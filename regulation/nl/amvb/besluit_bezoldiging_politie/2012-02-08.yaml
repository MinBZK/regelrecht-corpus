  - number: 4a
    text: |-
      1 Op de ambtenaar die deelnemer is in het AFUP-opbouwreglement wordt door het bevoegd gezag de helft van de voor
      het algemeen deel van de AFUP verschuldigde pensioenpremie verhaald.

      2 In afwijking van het eerste lid verhaalt het bevoegd gezag:

      a. in het jaar 2001 10% van de premie voor het algemeen deel van de AFUP;

      b. in het jaar 2002 20% van de premie voor het algemeen deel van de AFUP;

      c. in het jaar 2003 30% van de premie voor het algemeen deel van de AFUP;

      d. in het jaar 2004 40% van de premie voor het algemeen deel van de AFUP.

      3 Op de bezoldiging van de ambtenaar, bedoeld in
      [artikel 88, eerste lid, van het Besluit algemene rechtspositie politie][ref1], wordt in de periode voorafgaand aan
      de dag waarop zijn ontslag ingaat, een bedrag ingehouden dat gelijk is aan het gedeelte van de voor het algemeen
      deel van de AFUP verschuldigde pensioenpremie dat op hem verhaald zou zijn als hij deelnemer zou zijn geweest in
      het AFUP-opbouwreglement.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel88
    url: https://wetten.overheid.nl/BWBR0006517/2012-02-08#Artikel4a
