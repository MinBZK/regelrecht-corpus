    text: |-
      1 Indien het salaris behorend bij een volledige werktijd minder is dan het maandbedrag van het minimumloon, dat
      krachtens de [artikelen 7][ref1], [8][ref2] en [14 van de Wet minimumloon en minimumvakantiebijslag][ref3] geldt
      voor werknemers van dezelfde leeftijd als de ambtenaar, wordt deze een toelage toegekend ten bedrage van het
      verschil.

      2 Voor de ambtenaar met een andere betrekking dan een volledige betrekking, wordt de toelage als bedoeld in het
      eerste lid naar evenredigheid vastgesteld.


