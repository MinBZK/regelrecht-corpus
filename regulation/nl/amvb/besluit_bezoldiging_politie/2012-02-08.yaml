  - number: 37a
    text: |-
      1 De ambtenaar die 55 jaar of ouder is en deze leeftijd voor 1 januari 2012 bereikt, kan op zijn aanvraag, voor
      zover deze is ingediend voor genoemde datum, een functie worden opgedragen waaraan een salaris is verbonden met een
      lager maximum dan het maximum van de reeds voor hem geldende salarisschaal. In dat geval wordt op zijn salaris een
      inhouding toegepast.

      2 De inhouding is gelijk aan het verschil tussen het salaris dat de ambtenaar geniet en het maximumsalaris
      behorende bij de salarisschaal direct onder de voor de ambtenaar geldende salarisschaal met dien verstande dat dit
      bedrag niet negatief mag zijn.

      3 In bijzondere gevallen kan het bevoegd gezag geheel of gedeeltelijk van de inhouding afzien.

      4 Onze Minister kan nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0006517/2012-02-08#Artikel37a
  - number: '38'
    text: |-
      1 De ambtenaar heeft bij ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte gedurende een tijdvak van
      104 weken recht op de doorbetaling van zijn bezoldiging overeenkomstig de volgende tabel:

      1° de eerste 26 weken 100% van de bezoldiging;

      2° de tweede 26 weken 90% van de bezoldiging;

      3° de derde 26 weken 80% van de bezoldiging;

      4° vervolgens 70% van de bezoldiging.

      2 In afwijking van het eerste lid, behoudt de ambtenaar, indien de ziekte uit hoofde waarvan hij ongeschikt is
      zijn arbeid te verrichten, is veroorzaakt door een beroepsincident, zijn aanspraak op doorbetaling van 100% van
      zijn bezoldiging.

      3 Voor de toepassing van het eerste lid worden perioden van ongeschiktheid samengeteld indien zij
      elkaar met een onderbreking van minder dan vier weken opvolgen of indien zij direct voorafgaan aan
      en aansluiten op een periode waarin zwangerschaps- of bevallingsverlof wordt genoten overeenkomstig
      [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref1], tenzij de ongeschiktheid redelijkerwijs niet
      geacht kan worden voort te vloeien uit dezelfde oorzaak.

      4 Het tijdvak van 104 weken, bedoeld in het eerste lid, wordt verlengd:

      a. met de duur van de vertraging, indien het bevoegd gezag de aangifte, bedoeld in
      [artikel 38, eerste lid, van de ZW][ref2], later doet dan op grond van dat artikel is voorgeschreven;

      b. met de duur van de vertraging van de wachttijd, bedoeld in [artikel 19, eerste lid, van de WAO][ref3], zoals dat
      artikel luidde op 31 december 2003, indien de wachttijd met toepassing van het [zevende lid van dat artikel][ref4]
      wordt verlengd;

      c. met de duur van het tijdvak dat het Uitvoeringsinstituut werknemersverzekeringen op grond van
      [artikel 71a, negende lid, van de WAO][ref5] heeft vastgesteld.

      5 Ingeval van verlenging op grond van het vierde lid, kan het tijdvak, bedoeld in het eerste lid, niet méér dan 156
      weken belopen.

      6 De ambtenaar die langer dan 26 weken ongeschikt is tot het verrichten van zijn arbeid wegens ziekte en die
      loonvormende arbeid of reintegratieactiviteiten verricht, ontvangt over deze uren een beloning naast de bezoldiging
      bij ziekte als bedoeld in het eerste lid.

      7 De beloning, bedoeld in het zesde lid, tezamen met de doorbetaling van de bezoldiging bij ziekte bedraagt:

      a. 35% van de bezoldiging en 65% van de bezoldiging bij ziekte als bedoeld in het eerste lid indien de ambtenaar
      maximaal 35% van zijn betrekkingsomvang arbeid of activiteiten verricht als bedoeld in het zesde lid;

      b. 80% van de bezoldiging en 20% van de bezoldiging bij ziekte als bedoeld in het eerste lid indien de ambtenaar
      meer dan 35% en maximaal 80% van zijn betrekkingsomvang arbeid of activiteiten verricht als bedoeld in het zesde
      lid;

      c. 100% van de bezoldiging indien de ambtenaar meer dan 80% van zijn betrekkingsomvang arbeid of activiteiten
      verricht als bedoeld in het zesde lid.

      8 De doorbetaling van de bezoldiging eindigt in ieder geval:

      a. met ingang van de dag waarop de ambtenaar op grond van
      [artikel 49b, derde lid, van het Besluit algemene rechtspositie politie][ref6] passende arbeid verricht en daartoe
      is herplaatst;

      b. met ingang van de dag waarop de ambtenaar ontslag is verleend;

      c. met ingang van de dag waarop de ambtenaar de leeftijd van 65 jaar heeft bereikt; of

      d. met ingang van de dag volgende op die waarop de ambtenaar is overleden.

      9 De ambtenaar die op grond van [artikel 49b, derde lid, van het Besluit algemene rechtspositie politie][ref7]
      passende arbeid verricht en daartoe is herplaatst, voordat de termijn van twee jaar, bedoeld in
      [artikel 94, derde lid, van het Besluit algemene rechtspositie politie][ref8] is verstreken, heeft tot het eind van
      genoemde termijn aanspraak op een aanvullende uitkering, indien zijn bezoldiging als gevolg van zijn herplaatsing
      vermindering ondergaat, ter grootte van het verschil tussen:

      a. het bedrag waarop de ambtenaar op grond van dit artikel recht zou hebben gehad indien hem geen andere betrekking
      zou zijn opgedragen, maar in plaats daarvan voor dezelfde arbeidstijd zijn eigen betrekking; en

      b. de som van zijn bezoldiging na herplaatsing, een uit zijn arbeidsongeschiktheid voortvloeiend recht op een WAO-
      uitkering, een invaliditeitspensioen en een herplaatsingstoelage.

      10 De ambtenaar die op grond van [artikel 49b, derde lid, van het Besluit algemene rechtspositie politie][ref9]
      passende arbeid verricht en daartoe is herplaatst, heeft tevens aanspraak op een aanvullende uitkering nadat de
      termijn van 104 weken is verstreken, indien de ziekte, uit hoofde waarvan de ambtenaar ongeschikt is zijn arbeid
      te verrichten wordt veroorzaakt door een dienstongeval of een door het verrichten van zijn arbeid opgelopen
      beroepsziekte, ter grootte van het verschil tussen:

      a. een percentage van zijn bezoldiging vermeerderd met de vakantie-uitkering en de eindejaarsuitkering, zoals
      die zou zijn op de dag voor zijn herplaatsing indien de ambtenaar op die dag niet ongeschikt zou zijn geweest tot
      werken; en

      b. zijn bezoldiging na herplaatsing, in voorkomend geval vermeerderd met een uit de oorspronkelijke betrekking
      voortvloeiend recht op een WAO-uitkering, invaliditieitspensioen en een herplaatsingstoelage.

      11 Het percentage, bedoeld in het tiende lid, onderdeel a, is afhankelijk van de mate van arbeidsongeschiktheid en
      bedraagt bij een arbeidsongeschiktheid van:








                    80% of meer:


                    90,02%;






                    65 tot 80%:


                    65,26%;




                    55 tot 65%:


                    54,01%;




                    45 tot 55%:


                    45,01%;




                    35 tot 45%:


                    36,01%;




                    25 tot 35%:


                    27,01%;




                    15 tot 25%:


                    18,00%.






      12 De aanvullende uitkering, bedoeld in het negende en tiende lid, eindigt in ieder geval:

      a. met ingang van de dag waarop de ambtenaar niet meer voldoet aan de in bedoelde artikelleden genoemde
      voorwaarden;

      b. met ingang van de dag waarop de ambtenaar ontslag is verleend;

      c. met ingang van de dag waarop de ambtenaar de leeftijd van 65 jaar bereikt; of

      d. met ingang van de dag volgende op die waarop de ambtenaar is overleden.


