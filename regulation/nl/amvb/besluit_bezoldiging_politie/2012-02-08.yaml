  - number: '18'
    text: |-
      1 Aan de ambtenaar aan wie consignatie wordt opgelegd, wordt, behoudens het derde lid, een toelage toegekend. Onder
      consignatie wordt verstaan het zich in opdracht van het daartoe bevoegde gezag bereikbaar en beschikbaar houden
      teneinde bij oproep dienst te gaan verrichten. Consignatie wordt slechts opgedragen boven de voor de ambtenaar
      krachtens [artikel 12 van het Besluit algemene rechtspositie politie][ref1] vastgestelde diensttijden.

      2 Consignatie kan niet worden opgedragen boven een door het bevoegd gezag of een door deze daartoe aangewezen
      ambtenaar vast te stellen aantal uren per jaar, met dien verstande dat dit maximum niet geldt voor de
      ambtenaar die het overleg met de Regionale Commissie, de Commissie Korps landelijke politiediensten,
      de Commissie bijzondere ambtenaren van politie, de Commissie LSOP of een Commissie voorziening tot
      samenwerking, bedoeld in de [artikelen 12][ref2], [21][ref3], [22][ref4], [22a][ref5] onderscheidenlijk
      [22b van het Besluit overleg en medezeggenschap politie][ref6], pleegt.

      3 Voor consignatie gedurende een tijdvak van korter dan een half uur boven de voor de ambtenaar vastgestelde
      dagelijkse diensttijd wordt geen toelage toegekend.

      4 De toelage voor consignatie bedraagt € 1,00 voor elk uur dat de ambtenaar consignatie is opgelegd.

      5 De in het vierde lid genoemde toelage wordt zo spoedig mogelijk uitbetaald, doch uiterlijk bij gelegenheid van de
      tweede salarisbetaling volgende op de periode van vier weken waarin consignatie is verricht.

      6 Van de in het vijfde lid gestelde termijn kan worden afgeweken indien het dienstbelang dat vereist of, indien
      het dienstbelang zich daartegen niet verzet, op verzoek van de ambtenaar. Voor de hier bedoelde gevallen wordt een
      nieuwe uiterste termijn vastgesteld.

      7 Indien een ambtenaar aan wie consignatie is opgelegd, binnen het tijdvak van consignatie werkzaamheden moet
      verrichten, is voor de duur van die werkzaamheden sprake van het verrichten van arbeid.

      8 Voor de toepassing van dit artikel worden gedeelten van uren, voorzover daarmee het half uur, bedoeld in het
      derde lid, wordt overschreden, berekend over een periode van vier weken, opgeteld en naar boven afgerond op halve
      uren.

      9 De toelage voor consignatie wordt in geval van ziekte van de ambtenaar gesteld op het bedrag dat de ambtenaar
      in de drie perioden van vier weken, onmiddellijk voorafgaande aan de periode van vier weken waarin de ziekte is
      aangevangen, gemiddeld aan toelage op grond van dit artikel heeft genoten.

      10 Voor de toepassing van dit artikel berust het oordeel omtrent het dienstbelang bij het bevoegd gezag dan wel bij
      de door deze aangewezen ambtenaar.


