  - number: 38a
    text: |-
      1 De ambtenaar met recht op een ZW-uitkering heeft aanspraak op een aanvulling van die uitkering tot het niveau van
      de bezoldiging.

      2 Voor de toepassing van dit artikel wordt de ZW-uitkering waarop de ambtenaar recht heeft steeds aangemerkt als
      een uitkering die door deze onverminderd is genoten.
    url: https://wetten.overheid.nl/BWBR0006517/2012-02-08#Artikel38a
  - number: 38b
    text: |-
      1 De ambtenaar die ongeschikt is zijn arbeid te verrichten wegens een dienstongeval of een beroepsziekte doch
      niet door een beroepsincident, wordt op zijn aanvraag voor de toepassing van dit hoofdstuk gelijkgesteld met de
      ambtenaar die ongeschikt is zijn arbeid te verrichten wegens een beroepsincident.

      2 De gewezen ambtenaar van wie de arbeidsongeschiktheid is veroorzaakt door een dienstongeval of een beroepsziekte
      doch niet door een beroepsincident, wordt op zijn aanvraag voor de toepassing van dit hoofdstuk gelijkgesteld met
      de gewezen ambtenaar van wie de arbeidsongeschiktheid is veroorzaakt door een beroepsincident.

      3 De ambtenaar en de gewezen ambtenaar worden geacht een aanvraag te hebben ingediend als bedoeld in het eerste en
      tweede lid indien de eerste dag van ongeschiktheid tot het verrichten van zijn arbeid wegens een dienstongeval of
      een beroepsziekte is gelegen in de periode van 1 januari 2004 tot en met 31 mei 2006.
    url: https://wetten.overheid.nl/BWBR0006517/2012-02-08#Artikel38b
  - number: '39'
    text: |-
      1 De gewezen ambtenaar die wegens ziekte, ontstaan voor het tijdstip van ingang van zijn ontslag, niet zijnde
      een ontslag op grond van [artikel 87a][ref1], [artikel 88][ref2], [artikel 88a][ref3], [artikel 88b][ref4] dan
      wel [artikel 94, eerste lid, aanhef, onderdelen e of f, van het Besluit algemene rechtspositie politie][ref5] nog
      ongeschikt is een naar aard en omvang soortgelijke functie te vervullen, heeft zolang hij ongeschikt tot werken
      is wegens ziekte, doch niet langer dan een tijdvak van ten hoogste 78 weken, aanspraak op de doorbetaling van zijn
      bezoldiging overeenkomstig de volgende tabel:

      a. de eerste 26 weken 100% van de bezoldiging;

      b. de tweede 26 weken 90% van de bezoldiging;

      c. de derde 26 weken 80% van de bezoldiging.

      2 De gewezen ambtenaar die binnen een maand na het tijdstip van zijn ontslag ongeschikt wordt wegens ziekte een
      naar aard en omvang soortgelijke functie te vervullen, heeft zolang betrokkene ongeschikt is tot werken wegens
      ziekte, maar niet langer dan 52 weken, aanspraak op doorbetaling van zijn laatstelijk genoten bezoldiging indien
      hij gedurende ten minste twee maanden onmiddellijk aan het ontslag voorafgaande in dienst is geweest overeenkomstig
      de volgende tabel:

      a. de eerste 26 weken 100% van de bezoldiging;

      b. de tweede 26 weken 90% van de bezoldiging.

      3 Voor het bepalen van het einde van het tijdvak van 78 weken, bedoeld in het eerste lid, en het
      tijdvak van 52 weken, bedoeld in het tweede lid, worden perioden van ongeschiktheid samengeteld indien
      zij elkaar met een onderbreking van minder dan vier weken opvolgen of indien zij direct voorafgaan aan
      en aansluiten op een periode waarin zwangerschaps- of bevallingsverlof wordt genoten overeenkomstig
      [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref6], tenzij de ongeschiktheid redelijkerwijs niet
      geacht kan worden voort te vloeien uit dezelfde oorzaak.

      4 De doorbetaling van de bezoldiging bedoeld in het eerste en tweede lid, eindigt na ommekomst van de
      uitkeringsduur, maar in ieder geval:

      a. met ingang van de dag waarop de gewezen ambtenaar de leeftijd van 65 jaar bereikt; of

      b. met ingang van de dag volgende op die waarop de gewezen ambtenaar is overleden.

      5 De gewezen ambtenaar die aanspraak heeft op een WAO-uitkering ter zake van de dienstbetrekking die hij voor zijn
      ontslag vervulde, heeft aanspraak op een aanvullende uitkering indien de arbeidsongeschiktheid is veroorzaakt door
      beroepsincident.

      6 De in het vijfde lid bedoelde aanvullende uitkering is gelijk aan het verschil tussen:

      a) een percentage van de laatstelijk genoten bezoldiging vermeerderd met de vakantie-uitkering en de
      eindejaarsuitkering, in het jaar voorafgaande aan zijn ontslag; en

      b) de som van de ambtenaar toegekende WAO-uitkering, een hem toegekend invaliditeitspensioen, een hem
      toegekende herplaatsingstoelage dan wel in voorkomend geval een hem toegekende suppletie op grond van het
      [Besluit suppletieregeling gedeeltelijk arbeidsongeschikten sector politie][ref7].

      7 Het percentage, bedoeld in het zesde lid, onderdeel a, is afhankelijk van de mate van arbeidsongeschiktheid en
      bedraagt bij een arbeidsongeschiktheid van:

      80% of meer: 90,02%;

      65 tot 80%: 65,26%;

      55 tot 65%: 54,01%;

      45 tot 55%: 45,01%;

      35 tot 45%: 36,01%;

      25 tot 35%: 27,01%;

      15 tot 25%: 18,00%.

      8 De aanvullende uitkering, bedoeld in het vijfde lid, eindigt:

      a. met ingang van de dag waarop de gewezen ambtenaar niet meer voldoet aan de in bedoeld artikellid genoemde
      voorwaarden;

      b. met ingang van de dag waarop de gewezen ambtenaar de leeftijd van 65 jaar heeft bereikt; of

      c. met ingang van de dag volgende op die waarop de gewezen ambtenaar is overleden.

      9 De gewezen ambtenaar aan wie eervol ontslag is verleend op grond van
      [artikel 87a van het Besluit algemene rechtspositie politie][ref8] met het oog op een uitkering op grond van een
      vut-overeenkomst als bedoeld in [artikel 1, onderdeel e, van de Wet kaderregeling vut overheidspersoneel][ref9],
      heeft slechts aanspraak op de doorbetaling van zijn laatstelijk genoten bezoldiging voor zover deze tezamen
      met de aanvullende uitkering in artikel 8.4 van het Pensioenreglement de laatstelijk genoten bezoldiging niet
      overschrijdt.

      10 Het bedrag van de laatstelijk genoten bezoldiging, bedoeld in de voorgaande leden, wordt in voorkomende gevallen
      gewijzigd overeenkomstig een algemene salarismaatregel in de sector politie.


