  - number: 27a
    text: |-
      1 Indien de ambtenaar dienst verricht op aan hem volgens het dagrooster verleende vakantie-uren, wordt hem een
      vergoeding toegekend.

      2 De vergoeding, bedoeld in het eerste lid, is gelijk aan de toeslag als bedoeld in
      [artikel 27, achtste lid][ref1]. De vergoeding voor delen van een uur wordt vastgesteld op een evenredig deel van
      de toeslag.

      3 De vergoeding die is uitgekeerd in geld, is niet pensioengevend.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel27
