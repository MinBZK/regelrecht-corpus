  - number: 3 bis
    text: |-
      1 In afwijking van [artikel 3, eerste tot en met zesde lid][ref1], wordt voor aspiranten die de opleiding beginnen
      in de periode van 1 november 2010 tot en met 31 oktober 2013 het op grond van artikel 3, eerste tot en met zesde
      lid, geldende salaris gedurende de gehele opleidingsperiode gedurende het theoretisch opleidingsdeel met 50%
      verminderd. [Artikel 17a][ref2] is niet van toepassing.

      2 Onze Minister kan, in afwijking van het eerste lid, besluiten de vermindering van de salarissen van de
      aspiranten, bedoeld in het eerste lid, gelijkelijk te verdelen over het theoretische en het praktische
      opleidingsdeel.

      3 Het bevoegd gezag kan, in geval van langdurige ziekte bij een aspirant, die op grond van dit artikel zijn salaris
      ontvangt, besluiten de vermindering van het salaris, bedoeld in het eerste lid, buiten beschouwing te laten.


