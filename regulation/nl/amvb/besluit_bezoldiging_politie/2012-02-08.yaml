  - number: '25'
    text: |-
      1 De vakantie-uitkering wordt eenmaal per jaar betaald over de periode van twaalf maanden die is aangevangen met de
      maand juni van het voorafgaande kalenderjaar.

      2 Bij ontslag van de ambtenaar vindt betaling plaats over het tijdvak, gelegen tussen het einde van de laatst
      verstreken periode waarover de vakantie-uitkering is betaald en de datum van het ontslag.

      3 Voor de toepassing van dit artikel wordt met het ontslag van de ambtenaar gelijkgesteld de beëindiging van de
      doorbetaling van de bezoldiging van de gewezen ambtenaar, bedoeld in [artikel 24][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel24
