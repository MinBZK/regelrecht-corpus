        artikel: '18'
  - number: '34'
    text: |-
      1 [Artikel 33][ref1] is eerst van toepassing, nadat de ambtenaar als militair de opleiding en oefening heeft
      volbracht.

      2 De ambtenaar die ingevolge een wettelijke verplichting voor de opleiding en oefening als militair in werkelijke
      dienst is, geniet gedurende deze opleiding en oefening de aan zijn ambt verbonden bezoldiging tot een bedrag dat
      gelijk is aan het op hem te verhalen gedeelte van de pensioenbijdrage.

      3 Het eerste en tweede lid zijn niet van toepassing ten aanzien van ambtenaren op wie bij koninklijk besluit de
      [artikelen 32][ref2] en [33][ref3] van overeenkomstige toepassing zijn verklaard.

      4 Indien de ambtenaar bij opkomst in militaire dienst voldoet aan de voorwaarde, gesteld in het eerste lid, of
      indien ingevolge het derde lid bij opkomst in militaire dienst deze voorwaarde niet voor hem geldt, geniet hij, in
      afwijking van artikel 33, gedurende twee weken na zijn opkomst de volle aan zijn ambt verbonden bezoldiging.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel32
