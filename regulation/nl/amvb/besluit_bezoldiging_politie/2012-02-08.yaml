  - number: '45'
    text: |-
      1 De aanspraken van de ambtenaar op grond van dit hoofdstuk na de eerste 104 weken van ongeschiktheid tot werken,
      vervallen indien de ambtenaar:

      a) weigert aangeboden passende arbeid, waartoe de deskundige persoon of de arbodienst hem in staat acht, te
      verkrijgen of te aanvaarden;

      b) zich niet houdt aan de ten aanzien van hem geldende regels met betrekking de wijze waarop invulling wordt
      gegeven aan de verzuimbegeleiding en de arbeidsgezondheidskundige begeleiding en de daarbij in acht te nemen
      procedure;

      c) geen aanspraak heeft op een WAO-uitkering in verband met de toepassing van [artikel 25][ref1]
      of [28, onder a of b, van de WAO][ref2].

      2 De ingevolge het eerste lid vervallen aanspraken herleven met ingang van het tijdstip waarop de ambtenaar alsnog
      gevolg geeft aan de betreffende verplichting op grond van dat lid.

      3 Na het tijdvak van 104 weken, bedoeld in de [artikelen 38][ref3] en [39][ref4], is op de aanspraak die de
      ambtenaar heeft op doorbetaling van de bezoldiging, het verplichtingen- en sanctieregime van de [WAO][ref5] van
      overeenkomstige toepassing.

      4 Indien als gevolg van handelingen of het nalaten van handelingen door de ambtenaar, de WAO-uitkering vermindering
      ondergaat, dan wel de aanspraak daarop geheel of gedeeltelijk wordt geweigerd, wordt de WAO-uitkering voor het
      vaststellen van zijn aanspraak op doorbetaling van de bezoldiging zoals bedoeld in [artikel 38, eerste lid][ref6],
      steeds geacht onverminderd te zijn genoten.

      5 Indien ten aanzien van de WAO-uitkering die de ambtenaar genieten een verplichting wordt opgelegd of
      een sanctie wordt toegepast, wordt door het bevoegd gezag zoveel mogelijk dezelfde verplichting opgelegd
      dan wel een overeenkomende sanctie toegepast, op doorbetaling van de bezoldiging zoals bedoeld in
      [artikel 38, eerste lid][ref7] waarop de ambtenaar aanspraak hebben.


