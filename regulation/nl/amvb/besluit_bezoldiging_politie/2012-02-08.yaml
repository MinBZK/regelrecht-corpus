  - number: '29'
    text: |-
      1 Aan de ambtenaar die is ingedeeld in een salarisschaal lager dan salarisschaal 12 van [bijlage I][ref1] van dit
      besluit en die daadwerkelijk wordt ingezet als lid van een mobiele eenheid wordt een vergoeding toegekend.

      2 Het tijdvak gedurende hetwelk de ambtenaar is ingezet, blijft voor de toepassing van de
      [artikelen 18, tweede lid][ref2], en [27, vierde lid][ref3], buiten beschouwing.

      3 De vergoeding bedraagt € 29,65 per kalenderdag.

      4 Aan de ambtenaar die is ingedeeld in een salarisschaal lager dan salarisschaal 12 van [bijlage I][ref4] van dit
      besluit en geen lid is van de mobiele eenheid wordt de vergoeding zoals bedoeld in het derde lid toegekend indien
      hij daadwerkelijk wordt ingezet ten behoeve van de mobiele eenheid en:

      a. de mobiele eenheid is opgeroepen in het kader van een grootschalig of bijzonder optreden, en

      b. de betrokken ambtenaar door het bevoegd gezag wordt opgeroepen voor een inzet als bedoeld in onderdeel a,
      waarbij voor die ambtenaar achteraf wordt vastgesteld dat gevaarzetting heeft gegolden ter handhaving van de
      openbare orde.


      [ref1]: https://wetten.overheid.nl/BWBR0006517
