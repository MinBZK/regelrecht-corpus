      1 Ingeval van indeling in een hogere schaal wordt, met inachtneming van [artikel 11][ref1], het salaris van de
      ambtenaar in de nieuwe schaal vastgesteld op het salaris gelegen onmiddellijk boven het salaris dat de ambtenaar
      genoot.

      2 In bijzondere gevallen kan het salaris worden vastgesteld op een hoger bedrag in de voor de ambtenaar geldende
      salarisschaal.

      3 Indien de datum van indeling in de hogere schaal samenvalt met de datum waarop een verhoging als bedoeld
      in [artikel 9, eerste of tweede lid][ref2], plaatsvindt, vindt de indeling in de hogere schaal plaats voor de
      verhoging, bedoeld in artikel 9, eerste of tweede lid.


