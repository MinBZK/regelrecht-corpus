  - number: '48'
    text: |-
      Voor gevallen, waarin dit besluit niet of niet naar billijkheid voorziet, wordt door Onze Minister een bijzondere
      regeling getroffen.
    url: https://wetten.overheid.nl/BWBR0006517/2012-02-08#Artikel48
  - number: '49'
    text: |-
      1 Een ambtenaar die op grond van [afdeling 1, hoofdstuk 2, artikel 1, van de Invoeringswet Politiewet 1993][ref1]
      naar een politieregio dan wel het Korps landelijke politiediensten is overgegaan en die op de dag
      voorafgaande aan de datum van inwerkingtreding van de [Politiewet 1993][ref2] aanspraken had op grond van
      het Bezoldigingsreglement politie 1958 en op grond van artikel VII van het Besluit van 24 juni 1992, houdende
      wijziging van het Ambtenarenreglement voor de rijkspolitie 1975, het Ambtenarenreglement voor de gemeentepolitie
      1958, het Bezoldigingsreglement politie 1958, het [Besluit geneeskundige verzorging politie][ref3] 1984 en
      het [Besluit overleg en medezeggenschap politie][ref4] in verband met het tot stand brengen van een eenvormige
      rechtspositie voor alle politieambtenaren behoudt deze aanspraken.

      2 Een ambtenaar, werkzaam bij het LSOP, die op de dag voorafgaande aan de datum van inwerkingtreding van de
      [LSOP-wet][ref5] aanspraken had op grond van het Bezoldigingsbesluit LSOP, behoudt deze aanspraken.

      3 Indien aan een ambtenaar, werkzaam bij het LSOP, op de dag voorafgaande aan de datum van inwerkingtreding van
      de [LSOP-wet][ref6] een salaris was toegekend dat voorkwam in één van de salarisschalen opgenomen in een van de
      bijlagen van het Bezoldigingsbesluit LSOP, vindt inschaling plaats in een salarisschaal van bijlage 1 van dit
      besluit waarvan het maximumsalaris gelijk is aan dan wel gelegen is onmiddellijk onder het maximumsalaris van de
      salarisschaal volgens welke de ambtenaar werd bezoldigd voor de inwerkingtreding van de [LSOP-wet][ref7].

      Het salaris dat aan de ambtenaar wordt toegekend is gelijk aan dan wel gelegen onmiddellijk onder het salaris
      dat hem was toegekend voor de inwerkingtreding van de [LSOP-wet][ref8]. Indien aan de ambtenaar een salaris
      wordt toegekend dat is gelegen onmiddellijk onder het salaris dat hij ontving voor de inwerkingtreding van de
      [LSOP-wet][ref9], heeft hij tot het moment dat hij in een hogere salarisschaal wordt geplaatst, aanspraak op het
      verschil tussen bedoelde salarissen.


