  - number: 27b
    text: |-
      1 Aan de ambtenaar die is ingedeeld in salarisschaal 12 of lager, wordt een vergoeding
      toegekend als er sprake is van een verschuiving in de vastgestelde roosters, bedoeld in
      [artikel 12, negende, tiende of twaalfde lid, van het Besluit algemene rechtspositie politie][ref1], indien
      de verschuiving plaatsvindt in het dienstbelang en geen verband houdt met een omstandigheid als bedoeld in
      [artikel 2:2, eerste lid, van de Arbeidstijdenwet][ref2]. Voor de toepassing van dit lid berust het oordeel omtrent
      het dienstbelang bij het bevoegd gezag dan wel bij de door deze aangewezen ambtenaar.

      2 Aan de ambtenaar die is ingedeeld in salarisschaal 13 of 14, wordt een vergoeding als bedoeld in het eerste lid
      toegekend indien er sprake is van een verschuiving van diensten in het kader van:

      a. deelname aan een rampenstaf;

      b. deelname aan grootschalig bijzonder optreden;

      c. inzet als lid van een mobiele eenheid;

      d. deelname aan een team grootschalige opsporing.

      3 De vergoeding wordt berekend per gewerkt verschoven uur en is gelijk aan de toeslag in geld bij overwerk, bedoeld
      in [artikel 27, achtste lid][ref3].

      4 Een verschuiving van een vrije zondag of een dag die in de wekelijkse rusttijd valt, bedoeld in
      [artikel 12, negende lid, van het Besluit algemene rechtspositie politie][ref4], wordt gesteld op acht uren,
      ongeacht de betrekkingsomvang of werktijdenmodaliteit van de ambtenaar.

      5 De vergoeding voor een verschuiving in het dagrooster, bedoeld in
      [artikel 12, twaalfde lid, van het Besluit algemene rechtspositie politie][ref5], wordt slechts toegekend indien de
      verschuiving ten minste een half uur bedraagt.

      6 De vergoeding voor een verschuiving in de roosters, bedoeld in
      [artikel 12, negende of tiende lid, van het Besluit algemene rechtspositie politie][ref6], wordt eerst toegekend
      indien meer dan acht uren zijn verschoven op grond van één van deze leden of beide leden gezamenlijk.

      7 Voor de toepassing van dit artikel worden verschoven uren en gedeelten van uren berekend over een periode van
      vier weken, opgeteld en naar boven afgerond op hele uren.

      8 De vergoeding kan niet samenvallen met de vergoeding voor overwerk, bedoeld in [artikel 27][ref7]. De vergoeding
      wordt ook niet toegekend aan de ambtenaar die als gevolg van arbeidsongeschiktheid feitelijk niet werkzaam is
      volgens het rooster waarin de wijziging plaatsvindt.

      9 De vergoeding wordt zo spoedig mogelijk uitbetaald, doch uiterlijk bij gelegenheid van de tweede salarisbetaling
      volgende op de periode van vier weken waarin de verschuiving heeft plaatsgevonden.

      10 Dit artikel is niet van toepassing op de ambtenaar die deel uitmaakt van een eenheid als bedoeld in
      [artikel 60 Politiewet 1993][ref8] en [artikel 8 van het Besluit beheer regionale politiekorpsen][ref9].


