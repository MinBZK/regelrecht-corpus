  - number: 3a
    text: |-
      1 Het salaris van de vakantiewerker wordt vastgesteld op het maandbedrag van het minimumloon dat krachtens de
      [artikelen 7][ref1] en [8 van de Wet minimumloon en minimumvakantiebijslag][ref2] geldt voor werknemers van
      dezelfde leeftijd als de vakantiewerker, aangevuld met € 80,75 per maand.

      2 Het salaris, bedoeld in het eerste lid, wordt verhoogd met 15,7%.


