  - number: 25a
    text: |-
      1 Aan de ambtenaar kan een incidentele eindejaarsuitkering of een eenmalige uitkering worden toegekend.

      2 Ten aanzien van de incidentele eindejaarsuitkering of eenmalige uitkering, bedoeld in het eerste lid, stelt
      Onze Minister nadere regels vast met betrekking tot de hoogte van de uitkering en het tijdstip van uitbetaling, en
      bepaalt Onze Minister of de uitkering behoort tot de bezoldiging.
    url: https://wetten.overheid.nl/BWBR0006517/2012-02-08#Artikel25a
  - number: 25b
    text: |-
      1 De ambtenaar heeft recht op een eindejaarsuitkering ten bedrage van 8% van het door hem in dat jaar genoten
      salaris.

      2 De eindejaarsuitkering bedraagt tenminste € 144,25 per maand met dien verstande dat dit bedrag naar evenredigheid
      wordt verminderd indien:

      a. het salaris van de ambtenaar niet op de eerste dag van een maand is aangevangen, dan wel indien de ambtenaar een
      deel van een maand geen salaris heeft genoten;

      b. de ambtenaar in de loop van een maand slechts een gedeelte van zijn salaris heeft genoten.

      3 Het in het tweede lid genoemde bedrag wordt voor de ambtenaar met een andere betrekking dan een volledige
      betrekking naar evenredigheid vastgesteld.

      4 In afwijking van het eerste en tweede lid heeft de ambtenaar:

      a. in het jaar 2001 recht op een eindejaarsuitkering ter grootte van 2,50% van het door hem in dat jaar genoten
      salaris;

      b. in het jaar 2002 recht op een eindejaarsuitkering ter grootte van 5,25% van het door hem in dat jaar genoten
      salaris, doch ten minste € 81,40 per maand gedurende de eerste helft van dat jaar en ten minste € 82,21 per maand
      gedurende de tweede helft van dat jaar, met dien verstande dat dit bedrag overeenkomstig het tweede en derde lid
      naar evenredigheid wordt verminderd.

      5 Indien de ambtenaar recht heeft op een uitkering op grond van de [Ziektewet][ref1], de [Wet arbeid en zorg][ref2]
      of de [Wet op de arbeidsongeschiktheidsverzekering][ref3], wordt voor de toepassing van dit artikel het salaris in
      acht genomen zoals dit zou zijn genoten indien geen sprake zou zijn geweest van recht op een uitkering op grond van
      de [Ziektewet][ref4], de [Wet arbeid en zorg][ref5] of de [Wet op de arbeidsongeschiktheidsverzekering][ref6].

      6 Indien de ambtenaar vanwege een inhouding op grond van de [Regeling verlofsparen politie][ref7] niet zijn
      volledige salaris geniet, wordt voor de toepassing van dit artikel het salaris in aanmerking genomen zoals dit zou
      zijn genoten indien geen sprake zou zijn geweest van een inhouding op het salaris vanwege die regeling.

      7 Indien voor de ambtenaar het feitelijke genot van de bezoldiging is teruggebracht tot het bedrag van het op de
      ambtenaar te verhalen gedeelte van de pensioenbijdrage, wordt hij voor de toepassing van dit artikel geacht geen
      salaris te genieten.

      8 De eindejaarsuitkering wordt eenmaal per kalenderjaar in de maand december betaald.

      9 Bij ontslag van de ambtenaar vindt betaling plaats conform het bepaalde in het tweede en zesde lid over het
      tijdvak gelegen tussen het einde van de laatste verstreken periode waarover de eindejaarsuitkering is betaald en de
      datum van het ontslag.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0013008
      [ref3]: https://wetten.overheid.nl/BWBR0002524
