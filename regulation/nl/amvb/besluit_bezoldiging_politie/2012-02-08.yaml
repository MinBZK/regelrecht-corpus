  - number: 46a
    text: |-
      Na het overlijden van de gewezen ambtenaar, die op de dag van zijn overlijden op grond van [artikel 39][ref1] in
      het genot was van doorbetaling van zijn laatstelijk genoten bezoldiging, wordt aan de in [artikel 46][ref2] bedoelde
      personen en met overeenkomstige toepassing van dat artikel een bedrag uitgekeerd, gelijk aan de bezoldiging welke
      de gewezen ambtenaar op de dag van zijn overlijden genoot, berekend over een tijdvak van drie maanden. Op deze
      uitkering worden in mindering gebracht het bedrag van de uitkering op grond van [artikel 35 van de Ziektewet][ref3]
      of op grond van [artikel 53 van de Wet op de arbeidsongeschiktheidsverzekering][ref4] en naar aard en strekking
      daarmee overeenkomende uitkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel39
