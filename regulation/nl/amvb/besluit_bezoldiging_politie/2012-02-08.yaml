  - number: 49c
    text: |-
      [Artikel 6, zesde lid, onderdeel d, en zevende lid][ref1], is tot en met 31 december 2006 niet van toepassing
      op een reorganisatie, anders dan een reorganisatie aangaande bovenregionale samenwerkingen, een voorziening
      tot samenwerking als bedoeld in de [artikelen 47][ref2] en [47a van de Politiewet][ref3] (Stb. 2005, 242) of
      veranderingen in de landelijke organisatie van de politie.


