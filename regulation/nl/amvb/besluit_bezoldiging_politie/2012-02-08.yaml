  - number: '46'
    text: |-
      1 De bezoldiging van de ambtenaar wordt niet langer uitbetaald dan tot en met de dag van het overlijden.
      [Artikel 26, eerste lid, van het Besluit algemene rechtspositie politie][ref1], is van overeenkomstige toepassing

      2 Met inachtneming van het vijfde lid wordt zo spoedig mogelijk na het overlijden aan de weduwe of weduwnaar van
      wie de overleden ambtenaar niet duurzaam gescheiden leefde, een bedrag uitgekeerd gelijk aan de bezoldiging over
      een tijdvak van drie maanden. Als maatstaf bij de berekening van het in de eerste volzin bedoelde bedrag geldt,
      behoudens het hierna bepaalde, de bezoldiging welke de ambtenaar op de dag van het overlijden genoot of, indien
      hij op die dag aanspraak maakt op een ZW-uitkering of een WAO-uitkering en een bovenwettelijke ziekte-uitkering
      of een bovenwettelijke arbeidsongeschiktheidsuitkering, bedoeld in [hoofdstuk 10][ref2], zou hebben genoten indien
      hij op die dag arbeidsgeschikt zou zijn geweest. De uitkering wordt vermeerderd met een bedrag gelijk aan driemaal
      dat van de vakantieuitkering over een maand, berekend op de voet van [hoofdstuk 6][ref3], naar de bezoldiging
      die de ambtenaar in de maand van het overlijden zou hebben genoten. Indien de ambtenaar in het genot was van de
      operationele toelage, bedoeld in [artikel 14][ref4], of van de aflopende toelage, bedoeld in [artikel 15][ref5]
      of van een toelage op grond van artikel IV van het koninklijk besluit van 4 september 1968 tot wijziging van het
      Bezoldigingsreglement politie 1958 (*Stb.* 477) wordt het gedeelte van de in de eerste volzin bedoelde uitkering
      dat betrekking heeft op deze toelagen, gesteld op het bedrag dat de overleden ambtenaar in de drie kalendermaanden
      voorafgaand aan de dag van het overlijden aan zodanige toelagen is toegekend.

      3 Bij ontstentenis van een weduwe of weduwnaar van wie de overledene niet duurzaam gescheiden leefde, geschiedt de
      uitkering, bedoeld in het tweede lid, ten behoeve van de minderjarige kinderen. Onder kinderen in de zin van dit
      artikel worden mede verstaan natuurlijke kinderen en kinderen waarover de overledene de pleegouderlijke zorg droeg.
      Onder pleegouderlijke zorg wordt verstaan de zorg voor het onderhoud en de opvoeding van het kind als was het een
      eigen kind, onafhankelijk van enige verplichting daartoe of van het genieten van een vergoeding daarvoor.

      4 Ontbreken ook kinderen als bedoeld in het derde lid, dan geschiedt de uitkering, bedoeld in het tweede lid, aan
      degenen die geheel of grotendeels afhankelijk waren van de bezoldiging van de ambtenaar.

      5 Indien de overledene geen betrekkingen als bedoeld in het tweede tot en met het vierde lid nalaat, kan het
      daartoe bedoelde bedrag door het bevoegd gezag geheel of ten dele worden uitgekeerd voor de betaling van de kosten
      van de laatste ziekte en van de lijkbezorging, indien de nalatenschap van de overledene voor de betaling van die
      kosten ontoereikend is.

      6 Op de uitkering, bedoeld in het tweede lid, wordt reeds vóór zijn overlijden aan de
      ambtenaar uitbetaalde bezoldiging over een na zijn overlijden gelegen tijdvak in mindering
      gebracht. Indien de ambtenaar voor zijn overlijden te veel vakantie heeft genoten, is
      [artikel 26, tweede lid, van het Besluit algemene rechtspositie politie][ref6], van overeenkomstige toepassing. Het
      aldus verschuldigde bedrag wordt eveneens in mindering gebracht op de uitkering, bedoeld in het tweede lid.

      7 Op het bedrag, bedoeld in het tweede tot en met vierde lid, wordt in mindering
      gebracht een uitkering op grond van [artikel 35 van de Ziektewet ][ref7]of op grond van
      [artikel 53 van de Wet op de arbeidsongeschiktheidsverzekering][ref8] en naar aard en strekking daarmee
      overeenkomende uitkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Hoofdstuk10
