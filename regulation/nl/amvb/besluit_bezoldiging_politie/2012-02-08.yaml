      1 Het salaris, de toelagen en de vergoedingen worden maandelijks betaald.

      2 De aanspraak op het salaris, de toelagen, de vergoedingen en de uitkeringen vangt aan met ingang van de dag
      waarop de aanstelling ingaat.

      3 Wanneer het salaris, een toelage als bedoeld in de [artikelen 15][ref1], [16][ref2], [17][ref3], [19][ref4],
      [20][ref5] en [21][ref6] of een uitkering als bedoeld in [artikel 23, tweede lid][ref7], moet worden berekend over
      een gedeelte van een kalendermaand, wordt het bedrag per dag vastgesteld door het maandbedrag te delen door het
      aantal dagen van de desbetreffende kalendermaand.


