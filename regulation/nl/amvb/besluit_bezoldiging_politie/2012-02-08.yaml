preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken van 16 november 1993, directoraat-generaal voor Openbare
    Orde en Veiligheid, directie Politie, hoofdafdeling Personeel, Onderwijs en Informatievoorziening, afdeling
    Arbeidsvoorwaardenbeleid, nr. EA93/U3219;

    Gelet op artikel 50, eerste lid, van de Politiewet 1993;

    De Raad van State gehoord (advies van 7 februari 1994, nummer WO4.93.0763;

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken van 11 maart 1994, directoraat-generaal voor
    Openbare Orde en Veiligheid, directie Politie, hoofdafdeling Personeel, Onderwijs en Informatievoorziening,
    afdeling Arbeidsvoorwaardenbeleid, nr. EA94/419;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006517/2012-02-08#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Dit besluit verstaat onder:

      a. Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      b. aspirant: degene die door het bevoegd gezag is aangesteld als aspirant en die is toegelaten tot een initiële
      opleiding;

      c. ambtenaar, aangesteld voor de uitvoering van de politietaak: de ambtenaar, bedoeld in
      [artikel 3, eerste lid, onderdeel a, van de Politiewet 1993][ref1], met uitzondering van de aspirant gedurende het
      theoretische opleidingsdeel;

      d. ambtenaar, aangesteld voor de uitvoering van technische, administratieve en andere taken ten dienste van
      de politie: de ambtenaar, bedoeld in [artikel 3, eerste lid, onderdeel b, van de Politiewet 1993][ref2],
      waarbij voor de toepassing van dit besluit de ambtenaar, bedoeld in
      [artikel 10, eerste lid, onderdelen a en b, van de Wet op het LSOP en het politieonderwijs][ref3], werkzaam bij
      het LSOP en de ambtenaar werkzaam bij een voorziening tot samenwerking, worden gelijkgesteld met ambtenaren van
      politie, bedoeld in [artikel 3, eerste lid, onderdeel b, van de Politiewet 1993][ref4];

      e. bijzondere ambtenaar van politie: de ambtenaar, bedoeld in [artikel 3, tweede lid, van de Politiewet 1993][ref5];

      f. vakantiewerker: een scholier of student die ten tijde van onderbreking van zijn opleiding wegens vakantie voor
      een periode van ten hoogste acht weken is aangesteld voor het verrichten van ondersteunende werkzaamheden;

      g. voorziening tot samenwerking: een publiekrechtelijke rechtspersoon als bedoeld in
      [artikel 47a, eerste lid, van de Politiewet 1993][ref6];

      h. het LSOP: het Landelijk selectie- en opleidingsinstituut politie, bedoeld in
      [artikel 2 van de Wet op het LSOP en het politieonderwijs][ref7];

      i. ambtenaar: de aspirant, de ambtenaar, aangesteld voor de uitvoering van de politietaak, de ambtenaar, aangesteld
      voor de uitvoering van technische, administratieve en andere taken ten dienste van de politie, de bijzondere
      ambtenaar van politie en de vakantiewerker;

      j. bevoegd gezag:

      1°. de korpsbeheerder, voor zover het betreft de aspirant, de ambtenaar, aangesteld voor de uitvoering van de
      politietaak en de ambtenaar aangesteld voor de uitvoering van technische, administratieve en andere taken ten
      dienste van de politie, die werkzaam is bij een regionaal politiekorps;

      2°. Onze Minister, voor zover het betreft de aspirant, de ambtenaar, aangesteld voor de uitvoering van de
      politietaak en de ambtenaar, aangesteld voor de uitvoering van de technische, administratieve en andere taken ten
      dienste van de politie, die werkzaam is bij het Korps landelijke politiediensten;

      3°. Onze Minister van Justitie, voor zover het betreft de bijzondere ambtenaar van politie;

      4°. de raad van toezicht van het LSOP, voor zover het betreft de ambtenaren, bedoeld in
      [artikel 10, eerste lid, onderdeel a, van de Wet op het LSOP en het politieonderwijs][ref8];

      5°. het college van bestuur van het LSOP, voor zover het betreft de ambtenaren, bedoeld in
      [artikel 10, eerste lid, onderdeel b, van de Wet op het LSOP en het politieonderwijs][ref9];

      6°. het algemeen bestuur van een voorziening tot samenwerking, voor zover het betreft de ambtenaren aangesteld bij
      de desbetreffende voorziening tot samenwerking;

      k. volledige betrekking: een betrekking die een arbeidstijd van gemiddeld 36 uur per week omvat;

      l. deelbetrekking: een betrekking die een arbeidstijd van gemiddeld minder dan 36 uur per week omvat;

      m. salaris: het bedrag dat met inachtneming van de bepalingen van dit besluit voor de ambtenaar is vastgesteld aan
      de hand van één van de bijlagen van dit besluit;

      n. salaris per uur: 1/157 deel van het salaris bij een volledige betrekking;

      o. salarisschaal: een als zodanig in één van de bijlagen van dit besluit vermelde reeks van genummerde salarissen;

      p. salarisnummer: een aanduiding, bestaande uit een getal, die in een salarisschaal bij een salaris is vermeld;

      q. maximumsalaris: het hoogste bedrag van een salarisschaal;

      r. functie: het samenstel van werkzaamheden door de ambtenaar te verrichten krachtens en overeenkomstig hetgeen
      hem door het daartoe bevoegde gezag is opgedragen, of het samenstel van door de ambtenaar te verrichten opgedragen
      werkzaamheden, zoals vastgelegd in het LFNP;

      s. toelagen: alle toelagen waarop ingevolge dit besluit aanspraak bestaat;

      t. vergoedingen: alle vergoedingen waarop ingevolge dit besluit aanspraak bestaat;

      u. uitkeringen: alle uitkeringen waarop ingevolge dit besluit aanspraak bestaat;

      v. bezoldiging: de som van het salaris, de toelagen, met uitzondering van de toelage, bedoeld in
      [artikel 16, eerste lid][ref10], alsmede de uitkering, bedoeld in [artikel 25a][ref11], indien Onze Minister zulks
      bepaalt;

      w. arbeidsongeschiktheid: arbeidsongeschiktheid als bedoeld in
      [artikel 18, eerste lid van de Wet op de arbeidsongeschiktheidsverzekering][ref12];

      x. arbodienst: een arbodienst als bedoeld in de [Arbeidsomstandighedenwet][ref13];

      y. deskundige persoon: een deskundige persoon als bedoeld in
      [artikel 14, eerste lid, van de Arbeidsomstandighedenwet][ref14] die belast is met de taken, bedoeld in
      [artikel 14, eerste lid, onderdelen b of c, van die wet][ref15];

      z. beroepsziekte: een ziekte, welke in overwegende mate haar oorzaak vindt in de aard van de aan de
      ambtenaar opgedragen werkzaamheden of in de bijzondere omstandigheden, waaronder deze moesten worden
      verricht, en die niet aan zijn schuld of onvoorzichtigheid is te wijten, of een beroepsziekte als bedoeld in
      [artikel 16, eerste lid, van de Regeling vredesmissies politie][ref16];

      aa. dienstongeval: een ongeval, welke in overwegende mate zijn oorzaak vindt in de aard van de aan de
      ambtenaar opgedragen werkzaamheden of in de bijzondere omstandigheden, waaronder deze moesten worden
      verricht, en dat niet aan zijn schuld of onvoorzichtigheid is te wijten, of een ongeval als bedoeld in
      [artikel 16, eerste lid, van de Regeling vredesmissies politie][ref17];

      bb. beroepsincident: een dienstongeval of een beroepsziekte voortvloeiend uit een gevaarzettende situatie die
      rechtstreeks verband houdt met de uitvoering van zijn taak waaraan de ambtenaar zich vanwege zijn specifieke
      functie niet kan onttrekken;

      cc. herplaatsen: het op grond van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte opdragen van een
      andere functie of de eigen functie onder andere voorwaarden;

      dd. herplaatsingstoelage: een herplaatsingstoelage als bedoeld in hoofdstuk 9 van het Pensioenreglement;

      ee. invaliditeitspensioen: een invaliditeitspensioen als bedoeld in hoofdstuk 8 van het Pensioenreglement;

      ff. medisch advies: een advies van de deskundige persoon of de arbodienst dat
      ten aanzien van de ambtenaar is uitgebracht na een arbeidsgezondheidskundig
      onderzoek als bedoeld in [artikel 18, van de Arbeidsomstandighedenwet][ref18] en
      [artikel 50 van het Besluit algemene rechtspositie politie][ref19];

      gg. gewezen ambtenaar: een ambtenaar aan wie ontslag is verleend, met ingang van de dag waarop het ontslag is
      ingetreden;

      hh. Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, bedoeld in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref20];

      ii. passende arbeid: alle arbeid die voor de krachten en bekwaamheden van de ambtenaar is berekend, tenzij
      aanvaarding om redenen van lichamelijke, geestelijke of sociale aard niet van hem kan worden gevergd;

      jj. Pensioenreglement: het Pensioenreglement van de Stichting Pensioenfonds ABP;

      kk. Stichting Pensioenfonds ABP: de Stichting Pensioenfonds ABP, bedoeld in
      [artikel 6 van de Wet privatisering ABP][ref21];

      ll. AFUP-opbouwreglement: het reglement bedoeld in artikel 2.4b, tweede lid, van het pensioenreglement;

      mm. AFUP: de in het AFUP-opbouwreglement neergelegde regeling;

      nn. WAO: de [Wet op de arbeidsongeschiktheidsverzekering][ref22];

      oo. WAO-uitkering: een uitkering op grond van de [WAO][ref23];

      pp. ZW: de [Ziektewet][ref24];

      qq. ZW-uitkering: ziekengeld als bedoeld in [artikel 19 van de Ziektewet][ref25];

      rr. zijn arbeid: hetgeen daaronder wordt verstaan ingevolge [artikel 19 van de Ziektewet][ref26];

      ss. initiële opleiding: een door Onze Minister in overeenstemming met de Minister van Justitie aangewezen
      opleiding, gericht op de voorbereiding van de uitvoering van algemene politietaken waarvoor in het kader van de
      landelijke kwalificatiestructuur, bedoeld in [artikel 14 van de Wet op het LSOP en het politieonderwijs][ref27],
      competentiegerichte eindtermen zijn vastgesteld;

      tt. theoretisch opleidingsdeel: de periode of perioden waarin de aspirant aan een opleidingsinstituut in het kader
      van de initiële opleiding onderwijs volgt;

      uu. praktisch opleidingsdeel: de periode of perioden waarin de aspirant de politietaak bij een regionaal
      politiekorps of bij het Korps landelijke politiediensten uitvoert in het kader van de initiële opleiding;

      vv. LFNP: Landelijk Functiegebouw Nederlandse Politie: het door Onze Minister vastgestelde geheel van
      functiebeschrijvingen, onderverdeeld naar vakgebieden, inclusief de waardering, en de aan het gebouw verbonden en
      omschreven werkterreinen, aandachtsgebieden en specifieke functionaliteiten.

      2 Voor de toepassing van dit besluit wordt onder echtgenote of echtgenoot mede verstaan de geregistreerde partner
      alsmede de niet-gehuwde ambtenaar die met een levenspartner samenwoont en – met het oogmerk duurzaam samen te leven
      – een gemeenschappelijke huishouding voert op basis van een notarieel verleden samenlevingscontract bevattende de
      wederzijdse rechten en verplichtingen ter zake van die samenwoning en gemeenschappelijke huishouding. Onder weduwe
      of weduwnaar wordt mede begrepen de achtergebleven geregistreerde partner alsmede de achtergebleven levenspartner.
      Tegelijkertijd kan slechts een persoon als echtgenoot of echtgenote dan wel weduwe of weduwnaar worden aangemerkt.
      Het bevoegd gezag kan verlangen dat een schriftelijke verklaring van een notaris wordt overgelegd waaruit blijkt
      dat een samenlevingscontract als bedoeld in de eerste volzin is gesloten.


