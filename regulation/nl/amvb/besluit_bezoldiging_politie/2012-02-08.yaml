  - number: '26'
    text: |-
      1 Aan de ambtenaar kan een uitkering worden toegekend om redenen van werving of behoud tot een maximum van € 45
      400,- per kalenderjaar.

      2 De uitkering wordt toegekend aan het einde van een tijdvak dat tevoren is vastgesteld door het bevoegd gezag.

      3 Aan de toekenning van de uitkering kunnen door het bevoegd gezag voorwaarden worden gesteld.

      4 Aan de ambtenaar die niet heeft kunnen voldoen aan de in het derde lid bedoelde voorwaarden door een naar het
      oordeel van het bevoegd gezag niet aan de ambtenaar zelf te wijten oorzaak, kan de uitkering gedeeltelijk worden
      toegekend.
    url: https://wetten.overheid.nl/BWBR0006517/2012-02-08#Artikel26
  - number: '27'
    text: |-
      1 Aan de ambtenaar die is ingedeeld in een salarisschaal lager dan salarisschaal 13 van
      [bijlage I van dit besluit][ref1] en die overwerk verricht, wordt, behoudens het zesde lid, een vergoeding
      toegekend.

      2 Aan de ambtenaar die is ingedeeld in salarisschaal 13 of 14 van [bijlage I][ref2] van dit besluit wordt de in dit
      artikel bedoelde vergoeding toegekend indien hij overwerk verricht in het kader van:

      a. deelname aan een rampenstaf;

      b. deelname aan grootschalig bijzonder optreden;

      c. inzet als lid van een mobiele eenheid;

      d. deelname aan een team grootschalige opsporing.

      3 Onder overwerk wordt verstaan dienst in opdracht van het daartoe bevoegde gezag buiten de voor de ambtenaar
      krachtens [artikel 12 van het Besluit algemene rechtspositie politie][ref3] vastgestelde arbeidstijden, voorzover
      daardoor de per dienstdag vastgestelde totale arbeidstijd wordt overschreden.

      4 Overwerk kan niet worden opgedragen boven een door het bevoegd gezag of een door deze aangewezen ambtenaar, vast
      te stellen aantal uren per jaar.

      5 Het opdragen van overwerk mag niet tot gevolg hebben dat de ambtenaar per periode van vier weken minder dan
      vier vrije dagen en per kalenderjaar minder dan dertien vrije zondagen, waarvan elf aansluitend aan een vrije dag,
      geniet.

      6 Voor overwerk dat gedurende korter dan een half uur aansluitend aan de vastgestelde dagelijkse arbeidstijd wordt
      verricht, wordt geen vergoeding toegekend.

      7 Overwerk wordt naar de keuze van het bevoegd gezag vergolden door middel van een bedrag in geld dan wel door
      middel van verlof of door middel van een combinatie van een bedrag in geld en verlof. Bij de keuze van de vorm van
      vergoeding wordt zoveel mogelijk rekening gehouden met de wensen van de ambtenaar.

      8 De vergoeding voor elk uur overwerk is een bedrag in geld ter grootte van het salaris per uur van de ambtenaar
      dan wel verlof voor de duur van één uur, vermeerderd met € 6,00 dan wel verlof voor de duur van een half uur, bij
      wijze van toeslag.

      9 De in het achtste lid genoemde vergoeding door middel van een bedrag in geld wordt zo spoedig mogelijk
      uitbetaald, doch uiterlijk bij gelegenheid van de tweede salarisbetaling volgende op de periode van vier weken
      waarin het overwerk is verricht. De vergoeding is niet pensioengevend.

      10 In geval vergoeding van overwerk plaatsvindt door middel van verlof, wordt het verlof zo spoedig mogelijk
      verleend, doch uiterlijk in de periode van vier weken waarin de in het negende lid bedoelde salarisbetaling
      plaatsvindt.

      11 Van de in het negende en tiende lid gestelde termijnen kan worden afgeweken indien het dienstbelang dat vereist
      of, indien het dienstbelang zich daartegen niet verzet, op verzoek van de ambtenaar. Voor de hier bedoelde gevallen
      wordt een nieuwe uiterste termijn vastgesteld.

      12 De tijdstippen waarop het verlof, bedoeld in het achtste lid, wordt verleend, worden zo tijdig mogelijk
      vastgesteld, waarbij zoveel mogelijk rekening gehouden wordt met de wensen van de ambtenaar.

      13 Het verlof, bedoeld in het achtste lid, dat aan het einde van een kalenderjaar niet is verleend, wordt naar wens
      van de ambtenaar bij gelegenheid van de eerste salarisbetaling in het daarop volgende kalenderjaar uitbetaald als
      vergoeding, bedoeld in het achtste lid, dan wel toegevoegd aan het spaarverlof, bedoeld in de Regeling verlofsparen
      politie.

      14 Voor de toepassing van dit artikel worden gedeelten van uren, voor zover daarmee het half uur, bedoeld in het
      zesde lid, wordt overschreden, berekend over een periode van vier weken, opgeteld en naar boven afgerond op halve
      uren.

      15 Voor de bepaling van de duur van de overschrijding van de per dienstdag vastgestelde totale arbeidstijd gelden
      uren waarop krachtens het [Besluit algemene rechtspositie politie][ref4] vakantie of verlof is genoten dan wel
      wegens ziekte of schorsing geen dienst is verricht, als uren waarop feitelijk dienst is verricht.

      16 Voor de toepassing van dit artikel berust het oordeel omtrent het dienstbelang bij het bevoegd gezag dan wel bij
      de door deze aangewezen ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006517
