  - number: 49b
    text: |-
      1 Voor degene die op 30 juni 2007 met toepassing van
      [artikel 4a van het Besluit algemene rechtspositie politie][ref1] is aangesteld in tijdelijke dienst, blijft
      artikel 6a, zoals luidend op 30 juni 2007, van toepassing tot en met het tijdstip waarop hij hernieuwd in vaste
      dienst wordt aangesteld.

      2 Voor degene die op 30 juni 2007 vanwege een verplaatsing aanspraak heeft op een vergoeding als bedoeld in
      [artikel 30a][ref2], blijft dat artikel, zoals luidend op 30 juni 2007, van toepassing voor de duur van die
      verplaatsing.

      3 Voor degene die op 30 juni 2007 is gedetacheerd en een functie uitoefent waaraan op grond van [artikel 6][ref3]
      een hogere salarisschaal is verbonden, blijven de [artikelen 4][ref4], 6 en [17b][ref5], zoals luidend op 30 juni
      2007, van toepassing voor de duur van die detachering.

      4 Degene die in de periode van 1 juli 2007 tot 1 januari 2008 op grond van [artikel 4a][ref6], zoals dat gold
      op 30 juni 2007, tijdelijk is aangesteld of op grond van artikel 62 is gedetacheerd ter vervulling van een
      hoger gewaardeerde functie dan de salarisschaal waarin hij bezoldigd is en deze functie langer dan twee jaar na
      aanstellen of detachering onafgebroken heeft bekleed, heeft recht op behoud van die hogere salarisschaal, bij
      beëindiging van de tijdelijke aanstelling of detachering.


