  - number: '19'
    text: |-
      Aan de ambtenaar kan een toelage worden toegekend om reden van werving of behoud tot een maximum van € 45 400,-
      per kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0006517/2012-02-08#Artikel19
  - number: '20'
    text: |-
      Aan de ambtenaar kan als tegemoetkoming in de representatiekosten een toelage worden toegekend tot een maximum van
      5% van het salaris.
    url: https://wetten.overheid.nl/BWBR0006517/2012-02-08#Artikel20
  - number: '21'
    text: |-
      1 In uitzonderlijke gevallen kan aan de ambtenaar of aan een groep van ambtenaren een toelage worden toegekend op
      andere gronden dan die vermeld in de [artikelen 16 tot en met 20][ref1].

      2 Een in het eerste lid bedoelde toelage kan aan de ambtenaar worden toegekend nadat Onze Minister ter zake nadere
      regels heeft vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel16
