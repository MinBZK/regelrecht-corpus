  - number: '2'
    text: |-
      De bepaling van de salarisschaal, de waardering van de functie, de vaststelling, de toekenning, de intrekking,
      de verhoging onderscheidenlijk de vermindering van het salaris, de toelagen, de vergoedingen, de uitkeringen,
      de tegemoetkoming in de representatiekosten, het salaris van de aspirant, en de gratificatie geschieden door het
      bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0006517/2012-02-08#Artikel2
  - number: '3'
    text: |-
      1 Voor de aspirant geldt een salarisschaal die is opgenomen in [bijlage II][ref1] van dit besluit.

      2 Bij aanstelling wordt het salaris vastgesteld:

      a. op het minimumbedrag van schaal 2a, voor de aspirant die een opleiding volgt op niveau 2;

      b. op het minimumbedrag van schaal 3a, voor de aspirant die een opleiding volgt op niveau 3;

      c. op het minimumbedrag van schaal 4a, voor de aspirant die een opleiding volgt op niveau 4;

      d. op het minimumbedrag van schaal 5a, voor de aspirant die een opleiding volgt op niveau 5;

      e. op het minimumbedrag van schaal 6a, voor de aspirant die een opleiding volgt op niveau 6.

      3 In afwijking van het eerste en tweede lid wordt voor de aspirant die direct voorafgaand aan de datum van
      aanstelling ten minste twaalf maanden aaneengesloten inkomen uit arbeid genoot het salaris bij aanstelling zodanig
      vastgesteld dat het salaris, vermeerderd met de vakantie-uitkering en eindejaarsuitkering, gelijk is dan wel direct
      ligt onder dit genoten inkomen:

      a. in de volgens het tweede lid bij het opleidingsniveau behorende salarisschaal, of

      b. in de na afronding van de opleiding toepasselijke salarisschaal, bedoeld in het zevende lid, met dien verstande
      dat het salaris ten hoogste wordt vastgesteld op salarisregel 6 van de salarisschalen 4, 8 of 9, dan wel ten
      hoogste op salarisregel 7 van de salarisschalen 6 of 7.

      4 Voor de hoogte van het inkomen uit arbeid, bedoeld in het derde lid, wordt uitgegaan van het gemiddelde vaste
      bruto inkomen over de periode van twaalf maanden, vermeerderd met de vakantie-uitkering en met een eventuele
      eindejaarsuitkering of dertiende maand.

      5 Indien de aspirant, bedoeld in het tweede lid, naar het oordeel van het bevoegd gezag naar behoren functioneert,
      wordt het salaris telkens na het verstrijken van de periode die in de desbetreffende salarisschaal staat vermeld
      verhoogd tot het naasthogere bedrag in de schaal.

      6 Indien de aspirant

      a. die is ingeschaald zoals bedoeld in het derde lid onderdeel a, naar het oordeel van het bevoegd gezag naar
      behoren functioneert, wordt het salaris telkens na één jaar verhoogd tot het naasthogere bedrag in de bij het
      opleidingsniveau behorende salarisschaal. Zodra het maximum van die salarisschaal is bereikt wordt het salaris
      telkens na één jaar verhoogd tot het naasthogere bedrag in de na afronding van de opleiding toepasselijke
      salarisschaal, tot maximaal salarisregel 5 van die schaal.

      b. die is ingeschaald zoals bedoeld in het derde lid onderdeel b, naar het oordeel van het bevoegd gezag naar
      behoren functioneert, wordt het salaris telkens na één jaar verhoogd tot het naasthogere bedrag in de na afronding
      van de opleiding toepasselijke salarisschaal, tot ten hoogste het in het derde lid, onderdeel b, bedoelde
      salarisregel.

      7 Na het succesvol afronden van de opleiding vindt aanstelling plaats:

      a. in een functie waaraan salarisschaal 4 is verbonden van de aspirant die een opleiding heeft afgerond op niveau
      2;

      b. in een functie waaraan salarisschaal 6 is verbonden van de aspirant die een opleiding heeft afgerond op niveau
      3;

      c. in een functie waaraan salarisschaal 7 is verbonden van de aspirant die een opleiding heeft afgerond op niveau
      4;

      d. in een functie waaraan ten minste salarisschaal 8 is verbonden van de aspirant die een opleiding heeft afgerond
      op niveau 5;

      e. in een functie waaraan ten minste salarisschaal 9 is verbonden van de aspirant die een opleiding heeft afgerond
      op niveau 6,

      waarbij het salaris wordt vastgesteld op een bedrag dat gelijk is aan of hoger is dan het bij het desbetreffende
      opleidingsniveau behorende garantiebedrag zoals genoemd in [bijlage III][ref2] van dit besluit.

      8 In uitzonderlijke individuele situaties kan het bevoegd gezag ten gunste van de aspirant afwijken van de leden
      twee tot en met zes.


