  - number: 45a
    text: |-
      1 Bij samenloop van een aanspraak krachtens dit hoofdstuk met een uitkering krachtens een wettelijke verzekering,
      wordt de aanspraak krachtens dit hoofdstuk verminderd met het bedrag van de uitkering krachtens de wettelijke
      verzekering, tenzij het betreft:

      a) een tegemoetkoming of een vergoeding die vergelijkbaar is met de tegemoetkoming of de vergoeding, bedoeld in de
      [artikelen 53][ref1] en [54 van het Besluit algemene rechtspositie politie][ref2];

      b) een ZW-uitkering ingeval van meer dan een betrekking. In dat geval wordt de ZW-uitkering naar rato van de
      bezoldiging toegerekend aan de dienstbetrekking ter zake waarvan zijn bezoldiging wordt doorbetaald krachtens dit
      hoofdstuk en de andere betrekking of betrekkingen.

      c) een WAO-uitkering ingeval van meer dan één betrekking. In dat geval wordt de WAO-uitkering naar rato van
      de bezoldiging toegerekend aan de betrekking ter zake waarvan zijn bezoldiging wordt doorbetaald krachtens dit
      hoofdstuk en de andere betrekking of betrekkingen.

      2 Inkomsten uit of in verband met arbeid of bedrijf worden op het bedrag, waarop de gewezen ambtenaar ingevolge dit
      hoofdstuk recht heeft, in mindering gebracht, tenzij:

      a) de gewezen ambtenaar deze inkomsten reeds voor het intreden van de ongeschiktheid tot het verrichten van zijn
      arbeid wegens ziekte genoot; en

      b) de omvang van die arbeid niet is toegenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel54
