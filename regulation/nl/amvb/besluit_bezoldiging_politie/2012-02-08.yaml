  - number: '35'
    text: |-
      1 De ambtenaar die voor een herhalingsoefening als militair in werkelijke dienst is, geniet gedurende twee weken na
      zijn opkomst in militaire dienst de volle aan zijn ambt verbonden bezoldiging. Daarna wordt de militaire beloning
      in mindering gebracht op de aan zijn ambt verbonden bezoldiging.

      [Artikel 33, tweede, vierde en vijfde lid][ref1] is van toepassing.

      2 Voor zover nodig, bepaalt Onze Minister van Defensie welke dienst als herhalingsoefening wordt beschouwd.

      3 Voor de toepassing of voortgezette toepassing van het eerste lid worden, met inachtneming van hetgeen daaromtrent
      is bepaald in de [Kaderwet dienstplicht][ref2] of in de [Wet voor het reservepersoneel der krijgsmacht][ref3] en
      onverminderd [artikel 85 van het Besluit algemene rechtspositie politie][ref4] met herhalingsoefeningen gelijk
      gesteld:

      a. het in dienst komen dan wel het in aansluiting aan een herhalingsoefening langer in dienst blijven voor een
      onderzoek omtrent een strafbaar feit of een krijgstuchtelijk vergrijp waarvan de militair verdacht of beklaagd
      wordt;

      b. het in dienst komen dan wel het in aansluiting aan een herhalingsoefening langer in dienst blijven ten einde
      rekening en verantwoording af te leggen van gevoerd beheer;

      c. het in aansluiting aan een herhalingsoefening langer in dienst blijven wegens:

      1°. ziekte;

      2°. het niet tijdig bereiken van de vereiste graad van geoefendheid als gevolg van ziekte;

      3°. het heersen of geheerst hebben van een besmettelijke ziekte;

      d. het in dienst komen om gehoord te worden omtrent een bij de Kroon of bij Onze Minister van Defensie ingediend
      bezwaarschrift onderscheidenlijk beroepschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0008589
      [ref3]: https://wetten.overheid.nl/BWBR0003883
      [ref4]: https://wetten.overheid.nl/BWBR0006516#Artikel85
