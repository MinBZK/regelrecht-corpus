  - number: 49d
    text: |-
      De ambtenaar die opleidingsniveau 4 succesvol heeft afgerond, wordt uiterlijk per 1 augustus 2011 aangesteld in een
      functie waaraan ten minste salarisschaal 7 van [bijlage I][ref1] van dit besluit is verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0006517
    url: https://wetten.overheid.nl/BWBR0006517/2012-02-08#Artikel49d
    references:
      - id: ref1
        bwb_id: BWBR0006517
  - number: 49e
    text: |-
      Van de ambtenaar die voor 1 maart 2010 een salaris genoot met toepassing van [bijlage I][ref1], zoals deze luidde
      voor die datum, wordt het salaris op 1 maart 2010 vastgesteld in de schaal met hetzelfde nummer van de bij dit
      besluit behorende bijlage I als de schaal uit bijlage I die voor 1 maart 2010 van toepassing was, in de periodiek
      met het bedrag dat overeenkomt met het oude salaris, dan wel bij gebreke daarvan, met het salarisbedrag dat
      onmiddellijk boven het bedrag van het oude salaris ligt.


      [ref1]: https://wetten.overheid.nl/BWBR0006517
    url: https://wetten.overheid.nl/BWBR0006517/2012-02-08#Artikel49e
