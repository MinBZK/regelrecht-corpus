  - number: 27a
    text: |-
      1 Indien de ambtenaar dienst verricht op aan hem volgens het dagrooster verleende vakantie-uren of levensfase-uren,
      bedoeld in [artikel 1, eerste lid, van het Besluit algemene rechtspositie politie][ref1], wordt hem een vergoeding
      toegekend.

      2 De vergoeding, bedoeld in het eerste lid, is gelijk aan de toeslag als bedoeld in
      [artikel 27, achtste lid][ref2]. De vergoeding voor delen van een uur wordt vastgesteld op een evenredig deel van
      de toeslag.

      3 De vergoeding die is uitgekeerd in geld, is niet pensioengevend.


