  - number: '38'
    text: |-
      1 De ambtenaar heeft bij ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte gedurende een tijdvak van
      104 weken recht op de doorbetaling van zijn bezoldiging overeenkomstig de volgende tabel:

      1° de eerste 26 weken 100% van de bezoldiging;

      2° de tweede 26 weken 90% van de bezoldiging;

      3° de derde 26 weken 80% van de bezoldiging;

      4° vervolgens 70% van de bezoldiging.

      2 In afwijking van het eerste lid behoudt de ambtenaar zijn aanspraak op 100% van de bezoldiging, indien:

      a. de ambtenaar terminaal ziek is;

      b. de ziekte beroepsgerelateerd is;

      c. de ziekte is veroorzaakt door orgaandonatie; of,

      d. de ziekte is veroorzaakt door zwangerschap of bevalling.

      3 Voor de toepassing van het eerste lid worden perioden van ongeschiktheid samengeteld indien zij
      elkaar met een onderbreking van minder dan vier weken opvolgen of indien zij direct voorafgaan aan
      en aansluiten op een periode waarin zwangerschaps- of bevallingsverlof wordt genoten overeenkomstig
      [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref1], tenzij de ongeschiktheid redelijkerwijs niet
      geacht kan worden voort te vloeien uit dezelfde oorzaak.

      4 Het tijdvak van 104 weken, bedoeld in het eerste lid, wordt verlengd:

      a. met de duur van de vertraging, indien het bevoegd gezag de aangifte, bedoeld in
      [artikel 38, eerste lid, van de ZW][ref2], later doet dan op grond van dat artikel is voorgeschreven;

      b. met de duur van de vertraging van de wachttijd, bedoeld in [artikel 23, eerste en tweede lid, van de WIA][ref3],
      indien de wachttijd met toepassing van [artikel 24 van de WIA][ref4] wordt verlengd;

      c. met de duur van het tijdvak dat het Uitvoeringsinstituut werknemersverzekeringen op grond van
      [artikel 25, negende lid, van de WIA][ref5] heeft vastgesteld;

      d. met de duur van de periode dat het bevoegd gezag de ambtenaar, bedoeld in het eerste lid, noch heeft ontslagen
      op grond van [artikel 94, eerst lid, onderdeel e of f, van het Besluit algemene rechtspositie politie][ref6],
      noch op grond van [artikel 49b, derde lid, van het Besluit algemene rechtspositie politie][ref7] heeft herplaatst
      teneinde passende arbeid te kunnen verrichten.

      5 Ingeval van verlenging op grond van het vierde lid, onderdeel a, b of c, kan het tijdvak, bedoeld in het eerste
      lid, niet méér dan 156 weken belopen.

      6 De ambtenaar die langer dan 26 weken ongeschikt is tot het verrichten van zijn arbeid wegens ziekte en die
      loonvormende arbeid of reintegratieactiviteiten verricht, ontvangt over deze uren een beloning naast de bezoldiging
      bij ziekte als bedoeld in het eerste lid.

      7 De beloning, bedoeld in het zesde lid, tezamen met de doorbetaling van de bezoldiging bij ziekte bedraagt:

      a. 35% van de bezoldiging en 65% van de bezoldiging bij ziekte als bedoeld in het eerste lid indien de ambtenaar
      maximaal 35% van zijn betrekkingsomvang arbeid of activiteiten verricht als bedoeld in het zesde lid;

      b. 80% van de bezoldiging en 20% van de bezoldiging bij ziekte als bedoeld in het eerste lid indien de ambtenaar
      meer dan 35% en maximaal 80% van zijn betrekkingsomvang arbeid of activiteiten verricht als bedoeld in het zesde
      lid;

      c. 100% van de bezoldiging indien de ambtenaar meer dan 80% van zijn betrekkingsomvang arbeid of activiteiten
      verricht als bedoeld in het zesde lid.

      8 De doorbetaling van de bezoldiging eindigt in ieder geval:

      a. met ingang van de dag waarop de ambtenaar op grond van
      [artikel 49b, derde lid, van het Besluit algemene rechtspositie politie][ref8] passende arbeid verricht en daartoe
      is herplaatst;

      b. met ingang van de dag waarop de ambtenaar ontslag is verleend;

      c. met ingang van de dag waarop de ambtenaar de AOW-gerechtigde leeftijd heeft bereikt; of

      d. met ingang van de dag volgende op die waarop de ambtenaar is overleden.

      9 De ambtenaar die op grond van [artikel 49b, derde lid, van het Besluit algemene rechtspositie politie][ref9]
      passende arbeid verricht en daartoe is herplaatst, voordat de termijn van twee jaar, bedoeld in
      [artikel 94, derde lid, van het Besluit algemene rechtspositie politie][ref10] is verstreken, heeft tot het
      eind van genoemde termijn aanspraak op een aanvullende uitkering, indien zijn bezoldiging als gevolg van zijn
      herplaatsing vermindering ondergaat, ter grootte van het verschil tussen:

      a. het bedrag waarop de ambtenaar op grond van dit artikel recht zou hebben gehad indien hem geen andere betrekking
      zou zijn opgedragen, maar in plaats daarvan voor dezelfde arbeidstijd zijn eigen betrekking; en

      b. de som van zijn bezoldiging na herplaatsing, een uit zijn arbeidsongeschiktheid voortvloeiend recht op een WIA-
      uitkering, en een arbeidsongeschiktheidspensioen.

      10 De ambtenaar waarvan de mate van arbeidsongeschiktheid is vastgesteld op minder dan 35% en die als gevolg
      van de arbeidsongeschiktheid inkomensverlies heeft, maakt aanspraak op een compensatie van dit inkomensverlies.
      Onder inkomensverlies wordt verstaan het verschil tussen de oorspronkelijke bezoldiging van de ambtenaar,
      waarbij ten aanzien van de toelagen bedoeld in de [artikelen 14][ref11] en [18][ref12] wordt uitgegaan van
      hetgeen gemiddeld genoten is in de 13 perioden van vier weken voor de eerste ziektedag, en de bezoldiging nadat
      de arbeidsongeschiktheid is vastgesteld op minder dan 35%, waarbij een verhoging van het salaris als bedoeld in
      [artikel 9][ref13] of [artikel 9a][ref14] buiten beschouwing wordt gelaten.

      11 De compensatie, bedoeld in het tiende lid, is een toelage ter hoogte van 70% van het inkomensverlies voor
      de duur van vijf jaar, gerekend vanaf de dag waarop de mate van arbeidsongeschiktheid van de ambtenaar is
      vastgesteld op minder dan 35%, maar niet voordat 104 weken na de eerste ziektedag zijn verstreken. Bij samenloop
      van de compensatie, bedoeld in het tiende lid, met een uitkering krachtens de [Werkloosheidswet][ref15] of het
      [Besluit bovenwettelijke werkloosheidsuitkering politie][ref16], wordt de compensatie verminderd met het bedrag van
      de uitkering krachtens de Werkloosheidswet of het Besluit bovenwettelijke werkloosheidsuitkering politie.

      12 In geval van samenloop van doorbetaling van de bezoldiging als bedoeld in het eerste lid met inhouding op
      het salaris als bedoeld in [artikel 13a, vijfde lid, van het Besluit algemene rechtspositie politie][ref17],
      of met inhouding op de bezoldiging als bedoeld in
      [artikel 41, eerste lid, van het Besluit algemene rechtspositie politie][ref18], wordt uitsluitend de bepaling
      toegepast die de hoogste inhouding op de bezoldiging oplevert.

      13 Indien toepassing wordt gegeven aan het tweede lid, aanhef en onderdelen c of d, de ambtenaar recht heeft op een
      financiële tegemoetkoming op grond van de [Ziektewet][ref19] en deze tegemoetkoming rechtstreeks wordt uitbetaald
      aan de ambtenaar, wordt gedurende de periode waarin sprake is van samenloop een inhouding op de bezoldiging
      toegepast die overeenkomt met het bedrag van deze financiële tegemoetkoming.

      14 Voor de ambtenaar die gedurende ten minste vier aaneengesloten weken voor 100% van zijn betrekkingsomvang
      loonvormende arbeid verricht, vangt bij ongeschiktheid tot het verrichten van deze arbeid wegens ziekte het in het
      eerste lid bedoelde tijdvak opnieuw aan.

      15 Het bedrag van de oorspronkelijke bezoldiging, bedoeld in het tiende lid, wordt gewijzigd overeenkomstig
      algemene salarismaatregelen in de sector Politie.


