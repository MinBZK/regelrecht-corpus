  - number: 45a
    text: |-
      1 Bij samenloop van een aanspraak krachtens dit hoofdstuk met een uitkering krachtens een wettelijke verzekering
      of het arbeidsongeschiktheidspensioen, wordt de aanspraak krachtens dit hoofdstuk verminderd met het bedrag van de
      uitkering krachtens de wettelijke verzekering of het arbeidsongeschiktheidspensioen, tenzij het betreft:

      a) een tegemoetkoming of een vergoeding die vergelijkbaar is met de tegemoetkoming, bedoeld in
      [artikel 53 van het Besluit algemene rechtspositie politie][ref1], of de vergoeding van de schadepost, bedoeld
      in de [artikelen 53b, eerste lid, onder a](onbekend), en [53e, eerste lid, onder b, van het Besluit algemene
      rechtspositie politie](onbekend);

      b) een ZW-uitkering ingeval van meer dan een betrekking. In dat geval wordt de ZW-uitkering naar rato van de
      bezoldiging toegerekend aan de dienstbetrekking ter zake waarvan zijn bezoldiging wordt doorbetaald krachtens dit
      hoofdstuk en de andere betrekking of betrekkingen;

      c) een WIA-uitkering of het arbeidsongeschiktheidspensioen, ingeval van meer dan één betrekking. In dat geval
      worden de WIA-uitkering respectievelijk het arbeidsongeschiktheidspensioen naar rato van de bezoldiging toegerekend
      aan de betrekking ter zake waarvan zijn bezoldiging wordt doorbetaald krachtens dit hoofdstuk en de andere
      betrekking of betrekkingen.

      2 Inkomsten uit of in verband met arbeid of bedrijf worden op het bedrag, waarop de gewezen ambtenaar ingevolge dit
      hoofdstuk recht heeft, in mindering gebracht, tenzij:

      a) de gewezen ambtenaar deze inkomsten reeds voor het intreden van de ongeschiktheid tot het verrichten van zijn
      arbeid wegens ziekte genoot; en

      b) de omvang van die arbeid niet is toegenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel53
    url: https://wetten.overheid.nl/BWBR0006517/2025-05-13#Artikel45a
    references:
