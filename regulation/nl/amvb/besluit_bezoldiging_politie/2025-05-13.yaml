    text: |-
      1 Aan de ambtenaar die is ingedeeld in een salarisschaal lager dan salarisschaal 13 van [bijlage I][ref1] van dit
      besluit en die overwerk verricht, wordt, behoudens het zesde lid, een vergoeding toegekend.

      2 Aan de ambtenaar die is ingedeeld in salarisschaal 13 of 14 van [bijlage I][ref2] van dit besluit wordt de in dit
      artikel bedoelde vergoeding toegekend indien hij overwerk verricht in het kader van:

      a. deelname aan een rampenstaf;

      b. deelname aan grootschalig bijzonder optreden;

      c. inzet als lid van een mobiele eenheid als bedoeld in [artikel 26 van het Besluit beheer politie][ref3];

      d. deelname aan een team grootschalige opsporing.

      3 Onder overwerk wordt verstaan dienst in opdracht van het daartoe bevoegde gezag buiten de voor de ambtenaar
      krachtens [artikel 12 van het Besluit algemene rechtspositie politie][ref4] vastgestelde arbeidstijden, voor
      zover daardoor de per dienstdag vastgestelde totale arbeidstijd wordt overschreden, uitgezonderd de uren die in
      de periode vanaf zeven dagen tot vier dagen voorafgaand aan de dag waarop de dienst moet worden gedaan door het
      bevoegd gezag worden opgedragen.

      4 Overwerk wordt aan de ambtenaar niet opgedragen boven 240 uren per jaar. Ingeval van een aanstelling van minder
      dan 36 uren per week is het op te dragen aantal uren overwerk per jaar naar rato begrensd. In bijzondere gevallen
      kan met instemming van de betreffende Ondernemingsraad ten aanzien van groepen ambtenaren worden afgeweken van het
      vastgestelde aantal uren, bedoeld in de eerste en tweede volzin.

      5 Het opdragen van overwerk mag niet tot gevolg hebben dat de ambtenaar per periode van vier weken minder dan
      vier vrije dagen en per kalenderjaar minder dan dertien vrije zondagen, waarvan elf aansluitend aan een vrije dag,
      geniet.

      6 Voor overwerk dat gedurende korter dan een half uur aansluitend aan de vastgestelde dagelijkse arbeidstijd wordt
      verricht, wordt geen vergoeding toegekend.

      7 Elk uur overwerk wordt naar de keuze van de ambtenaar vergoed door middel van een bedrag in geld ter grootte van
      het salaris per uur van de ambtenaar dan wel verlof voor de duur van één uur, met uitzondering van overwerk boven
      het aantal vastgestelde uren, bedoeld in het vierde lid, eerste volzin, dat uitsluitend wordt vergoed door middel
      van een bedrag in geld. De ambtenaar dient de in de vorige volzin genoemde keuze vóór de door het bevoegd gezag
      aangegeven momenten kenbaar te maken.

      8 De vergoeding voor elk uur overwerk, bedoeld in het zevende lid, wordt naar de keuze van de ambtenaar vermeerderd
      met € 6,97 dan wel met verlof voor de duur van een half uur, bij wijze van toeslag.

      9 De in het zevende en achtste lid bedoelde vergoeding door middel van een bedrag in geld wordt zo spoedig mogelijk
      uitbetaald, doch uiterlijk bij gelegenheid van de tweede salarisbetaling volgende op de periode van vier weken
      waarin het overwerk is verricht. De vergoeding is niet pensioengevend.

      10 Indien overwerk wordt vergoed door middel van het in het zevende en achtste
      lid bedoelde verlof, wordt dat verlof toegekend in levensfase-uren, bedoeld in
      [artikel 1, eerste lid, van het Besluit algemene rechtspositie politie][ref5].

      11 Voor de toepassing van dit artikel worden gedeelten van uren, voor zover daarmee het half uur, bedoeld in het
      zesde lid, wordt overschreden, berekend over een periode van vier weken, opgeteld en naar boven afgerond op halve
      uren.

      12 Voor de bepaling van de duur van de overschrijding van de per dienstdag vastgestelde totale arbeidstijd gelden
      uren waarop krachtens het [Besluit algemene rechtspositie politie][ref6] vakantie of verlof is genoten dan wel
      wegens ziekte of schorsing geen dienst is verricht, als uren waarop feitelijk dienst is verricht.

      13 Voor de toepassing van dit artikel berust het oordeel omtrent het dienstbelang bij het bevoegd gezag dan wel bij
      de door deze aangewezen ambtenaar.

      14 Dit artikel is niet van toepassing op de ambtenaar met een functie waarvoor salarisschaal 15 of hoger geldt.


