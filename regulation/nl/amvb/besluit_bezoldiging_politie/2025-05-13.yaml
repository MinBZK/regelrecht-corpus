      1 Aan de ambtenaar of zijn nagelaten betrekking kan een tegemoetkoming worden verleend in de premie voor een
      ziektekostenverzekering volgens door Onze Minister te stellen regels.

      2 Het eerste lid is van overeenkomstige toepassing op de gewezen ambtenaar, jonger dan de AOW-gerechtigde leeftijd,
      of zijn nagelaten betrekkingen.
    url: https://wetten.overheid.nl/BWBR0006517/2025-05-13#Artikel46c
  - number: '47'
    text: |-
      1 Bij vermissing van de ambtenaar zijn, behoudens het tweede lid, de bepalingen van [artikel 46][ref1] van
      overeenkomstige toepassing. De ambtenaar wordt daarbij geacht te zijn overleden op een door het bevoegd gezag te
      bepalen dag.

      2 Het [ tweede lid van artikel 46][ref2] is niet van toepassing indien gegronde vermoedens bestaan, dat de
      vermissing het gevolg is van ongeoorloofde afwezigheid.

      3 Indien blijkt, dat de als vermist beschouwde ambtenaar in leven is, kan ter beoordeling van het bevoegd gezag
      de bezoldiging worden uitbetaald, tenzij gegronde vermoedens bestaan, dat de vermissing het gevolg was van
      ongeoorloofde afwezigheid.

      4 Indien uit hoofde van de vermissing van de ambtenaar pensioen of enige andere uitkering, voortvloeiende uit
      zijn ambtelijke rechtspositie, is toegekend over het tijdvak, waarover naar het oordeel van het bevoegd gezag
      geen aanspraak bestaat op bezoldiging, wordt die bezoldiging verminderd met de over dat tijdvak aldus uitbetaalde
      bedragen.

      5 De bezoldiging waarop de ambtenaar ingevolge het derde en vierde lid aanspraak heeft, kan aan anderen dan de
      ambtenaar worden uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel46
