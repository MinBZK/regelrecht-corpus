      1 In dit hoofdstuk wordt onder ambtenaar verstaan: de ambtenaar, bedoeld in [artikel 1, eerste lid][ref1], die op
      31 december 2020 in dienst was.

      2 Dit hoofdstuk is niet van toepassing op de ambtenaar

      a. die op 31 december 2020 geen dienst verrichtte vanwege gebruikmaking van een levensloopregeling met aansluitend
      een ontslag, of op grond van een met het bevoegd gezag getroffen regeling met aansluitend een ontslag;

      b. die op 31 december 2020 een aanstelling in tijdelijke dienst had op grond van [artikel 4][ref2] of
      [artikel 4a, eerste lid, onderdeel b, van het Besluit algemene rechtspositie politie][ref3]; of

      c. aan wie na 31 december 2020 ontslag wordt verleend anders dan op grond van [artikel 88d][ref4] of
      [94, eerste lid, onderdeel h, van het Besluit algemene rechtspositie politie][ref5].


