      1 Aan de ambtenaar kan een incidentele eindejaarsuitkering of een eenmalige uitkering worden toegekend.

      2 Ten aanzien van de incidentele eindejaarsuitkering of eenmalige uitkering, bedoeld in het eerste lid, stelt
      Onze Minister nadere regels vast met betrekking tot de hoogte van de uitkering en het tijdstip van uitbetaling, en
      bepaalt Onze Minister of de uitkering behoort tot de bezoldiging.

      3 Dit artikel is niet van toepassing op de ambtenaar met een functie waarvoor schaal 15 of hoger geldt.
    url: https://wetten.overheid.nl/BWBR0006517/2025-05-13#Artikel25a
  - number: 25b
    text: |-
      1 Voor de ambtenaar wordt maandelijks een eindejaarsuitkering berekend ter waarde van 8,33% van het genoten salaris
      en de compensatie, bedoeld in [artikel 38, tiende lid][ref1], dan wel in [artikel 38b, zevende lid][ref2].

      2 De eindejaarsuitkering bedraagt tenminste € 194,52 per maand met dien verstande dat dit bedrag naar evenredigheid
      wordt verminderd indien:

      a. het salaris van de ambtenaar niet op de eerste dag van een maand is aangevangen, dan wel indien de ambtenaar een
      deel van een maand geen salaris heeft genoten;

      b. de ambtenaar in de loop van een maand slechts een gedeelte van zijn salaris heeft genoten.

      3 Het in het tweede lid genoemde bedrag wordt voor de ambtenaar met een andere betrekking dan een volledige
      betrekking naar evenredigheid vastgesteld.

      4 Indien de ambtenaar recht heeft op een uitkering op grond van:

      a. de [WIA][ref3], voor zover de ambtenaar nog niet is herplaatst op grond van
      [artikel 49b van het Besluit algemene rechtspositie politie][ref4]; of

      b. de [Ziektewet][ref5] of de [Wet arbeid en zorg][ref6],

      wordt voor de toepassing van dit artikel het salaris in acht genomen zoals dit zou zijn genoten indien geen
      sprake zou zijn geweest van recht op een uitkering op grond van de [WIA][ref7], de [Ziektewet][ref8] of de
      [Wet arbeid en zorg][ref9].

      5 Indien voor de ambtenaar het feitelijke genot van de bezoldiging is teruggebracht tot het bedrag van het op de
      ambtenaar te verhalen gedeelte van de pensioenbijdrage, wordt hij voor de toepassing van dit artikel geacht geen
      salaris te genieten.


