  - number: 39b
    text: |-
      1 De gewezen ambtenaar die ongeschikt is zijn arbeid te verrichten wegens ziekte die op het moment van de melding
      van gezondheidsklachten, bedoeld in [artikel 53a, eerste lid, van het Besluit algemene rechtspositie politie]
      (onbekend), in overwegende mate beroepsgerelateerd is, heeft recht op een aanvullende uitkering nadat het tijdvak
      dan wel de doorbetaling van bezoldiging, bedoeld in [artikel 38, eerste of vierde lid][ref1], is verstreken dan
      wel geëindigd.

      2 De uitkering voor de gewezen ambtenaar, bedoeld in het eerste lid, die volledig en duurzaam ongeschikt is
      als bedoeld in [artikel 4, eerste lid, van de WIA][ref2], wordt aangevuld tot 95% van zijn laatstelijk genoten
      bezoldiging vermeerderd met de vakantie-uitkering en de eindejaarsuitkering, waarop aanspraak zou bestaan op de dag
      voor zijn ontslag indien de ambtenaar op die dag niet ongeschikt zou zijn geweest tot het verrichten van arbeid.

      3 De uitkering voor de gewezen ambtenaar, bedoeld in het eerste lid, die gedeeltelijk arbeidsgeschikt
      is als bedoeld in [artikel 5 van de WIA][ref3] en slechts in staat is met arbeid ten hoogste 20% te
      verdienen van het maatmaninkomen, bedoeld in [artikel 1 van de WIA][ref4], per uur, wordt aangevuld
      tot 90,02% van zijn laatstelijk genoten bezoldiging, vermeerderd met de vakantie-uitkering en de
      eindejaarsuitkering waarop aanspraak zou bestaan op de dag voor zijn ontslag indien de ambtenaar op die dag
      niet ongeschikt zou zijn geweest tot het verrichten van arbeid. Indien de gewezen ambtenaar op grond van
      [artikel 49b, derde lid, van het Besluit algemene rechtspositie politie][ref5] voor zijn ontslag passende arbeid
      heeft verricht en daartoe is herplaatst, gelden voor de toepassing van de vorige volzin de bezoldiging, vermeerderd
      met de vakantie-uitkering en de eindejaarsuitkering waarop aanspraak zou bestaan op de dag voor zijn herplaatsing
      indien de ambtenaar op die dag niet ongeschikt zou zijn geweest tot het verrichten van arbeid.

      4 Onder de uitkering, bedoeld in het tweede en derde lid, wordt verstaan de som van de WIA-uitkering en het
      arbeidsongeschiktheidspensioen.

      5 De aanvullende uitkering voor de gewezen ambtenaar, bedoeld in het eerste lid, die 35 tot 80% arbeidsongeschikt
      is bedraagt:

      a. gedurende de looptijd van de loongerelateerde uitkering, in geval de verdiencapaciteit volledig wordt benut, 90%
      van het verschil tussen het oude en het nieuwe inkomen;

      b. gedurende de looptijd van de loongerelateerde uitkering, in geval de verdiencapaciteit niet volledig wordt
      benut, 80% van het verschil tussen het oude en het nieuwe inkomen;

      c. gedurende de looptijd van de loonaanvulling, waarbij de verdiencapaciteit voor 50% of meer wordt benut,
      90% van het verschil tussen het oude en het nieuwe inkomen dat de ambtenaar bij volledige benutting van zijn
      restverdiencapaciteit zou verdienen;

      d. gedurende de looptijd van de vervolguitkering, waarbij de verdiencapaciteit voor minder dan voor 50% wordt
      benut, voor maximaal tien jaar, een aanvulling op het nieuwe inkomen tot 75% van het oude inkomen maal het
      arbeidsongeschiktheidspercentage.

      6 Onder het oude inkomen, bedoeld in het vijfde lid, wordt verstaan de laatstgenoten bezoldiging, de vakantie-
      uitkering en de eindejaarsuitkering. Onder het nieuwe inkomen, bedoeld in het vijfde lid, wordt verstaan de nieuwe
      structurele bruto inkomsten uit arbeid, de WIA-uitkering en het arbeidsongeschiktheidspensioen.

      7 De aanvullende uitkering voor de gewezen ambtenaar, bedoeld in het eerste lid, die
      minder dan 35% arbeidsongeschikt is, bedraagt 70% van het inkomensverlies, bedoeld in
      [artikel 39, vijfde lid, tweede volzin][ref6].

      8 Bij samenloop tussen de aanvullende uitkering, bedoeld in het zevende lid, met een uitkering krachtens de
      [Werkloosheidswet][ref7] of het [Besluit bovenwettelijke werkloosheidsuitkering politie][ref8] wordt de aanvullende
      uitkering verminderd met het bedrag van de uitkering krachtens de Werkloosheidswet of het Besluit bovenwettelijke
      werkloosheidsuitkering politie.

      9 De aanvullende uitkering eindigt in ieder geval:

      a. met ingang van de dag waarop de gewezen ambtenaar niet meer voldoet aan de in het eerste lid genoemde
      voorwaarden;

      b. met ingang van de dag waarop de gewezen ambtenaar de AOW-gerechtigde leeftijd heeft bereikt; of

      c. met ingang van de dag volgende op die waarop de gewezen ambtenaar is overleden.

      10 Het bedrag van de laatstelijk genoten bezoldiging dan wel het bedrag van het oude inkomen, bedoeld in het tweede
      en derde lid, onderscheidenlijk het vijfde lid, wordt gewijzigd overeenkomstig algemene salarismaatregelen in de
      sector Politie.

      11 Voor de gewezen ambtenaar die een uitkering ontvangt als bedoeld in [artikel 29d][ref9] of een pensioen
      ontvangt als bedoeld in hoofdstuk 5 van het Pensioenreglement, voor zover dat is ingegaan voor de AOW-
      gerechtigde leeftijd, wordt tevens onder nieuwe structurele inkomsten uit arbeid als bedoeld in het zesde lid
      verstaan de som van de bezoldiging, de vakantie-uitkering en de eindejaarsuitkering die direct voorafgaand
      aan het ontslag in aanmerking werd genomen voor de berekening van de aanvullende uitkering, bedoeld in
      [artikel 38b, vijfde lid][ref10]. In het geval de uitkering, bedoeld in [artikel 29d][ref11], hoger is dan die
      som, wordt voor de berekening van de aanvullende uitkering, bedoeld in het vijfde lid, uitgegaan van de uitkering.

      12 Indien de ambtenaar, bedoeld in het tweede en derde lid, inkomen uit arbeid geniet wordt de aanvullende
      uitkering, bedoeld in het eerste lid, berekend overeenkomstig de formule in [artikel 38b, twaalfde lid][ref12].

      13 Indien de ambtenaar, bedoeld in het tweede en derde lid, inkomen uit arbeid geniet en de som van het inkomen
      uit arbeid, de uitkering, bedoeld in het vierde lid, en de aanvullende uitkering, bedoeld in het eerste lid, hoger
      is dan de laatstelijk genoten bezoldiging verhoogd met de vakantie- en eindejaarsuitkering, wordt het meerdere in
      mindering gebracht op de aanvullende uitkering.

      14 De aanvullende uitkering, bedoeld in het eerste lid, wordt uitbetaald uiterlijk een maand na de kalendermaand
      waarover die uitkering is berekend.


