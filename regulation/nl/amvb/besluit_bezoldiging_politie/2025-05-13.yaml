      1 Aan de ambtenaar aan wie consignatie wordt opgelegd, wordt, behoudens het tweede lid, een toelage toegekend.

      2 Voor consignatie gedurende een tijdvak van korter dan een half uur boven de voor de ambtenaar vastgestelde
      dagelijkse diensttijd wordt geen toelage toegekend.

      3 De toelage voor consignatie bedraagt € 2,54 voor elk uur dat de ambtenaar consignatie is opgelegd.

      4 De in het derde lid genoemde toelage wordt zo spoedig mogelijk uitbetaald, doch uiterlijk bij gelegenheid van de
      tweede salarisbetaling volgende op de periode van vier weken waarin consignatie is verricht.

      5 Van de in het vierde lid gestelde termijn kan worden afgeweken indien het dienstbelang dat vereist of, indien
      het dienstbelang zich daartegen niet verzet, op verzoek van de ambtenaar. Voor de hier bedoelde gevallen wordt een
      nieuwe uiterste termijn vastgesteld.

      6 Indien een ambtenaar aan wie consignatie is opgelegd, binnen het tijdvak van consignatie werkzaamheden moet
      verrichten, is voor de duur van die werkzaamheden sprake van het verrichten van arbeid.

      7 Voor de toepassing van dit artikel worden gedeelten van uren, voorzover daarmee het half uur, bedoeld in het
      tweede lid, wordt overschreden, berekend over een periode van vier weken, opgeteld en naar boven afgerond op halve
      uren.

      8 De toelage voor consignatie wordt in geval van ziekte, zwangerschaps- en bevallingsverlof of van aangepaste
      werkzaamheden in verband met zwangerschap van de ambtenaar gesteld op het bedrag dat de ambtenaar in de 13
      perioden van vier weken, onmiddellijk voorafgaande aan de periode van vier weken waarin de ziekte, zwangerschap- en
      bevallingsverlof of aangepaste werkzaamheden in verband met zwangerschap zijn aangevangen, gemiddeld aan toelage op
      grond van dit artikel heeft genoten.

      9 Voor de toepassing van dit artikel berust het oordeel omtrent het dienstbelang bij het bevoegd gezag dan wel bij
      de door deze aangewezen ambtenaar.

      10 Het eerste lid is niet van toepassing op de ambtenaar met een functie waarvoor salarisschaal 15 of hoger geldt.

      11 De toelage voor consignatie voor de ambtenaar voor wie de hoogte van deze toelage eerder is vastgesteld met
      toepassing van het achtste lid, blijft in geval van ziekte, zwangerschaps- en bevallingsverlof of aangepaste
      werkzaamheden in verband met zwangerschap van de ambtenaar, binnen vier weken na hervatting van zijn werkzaamheden
      ongewijzigd op die hoogte.

      12 De ambtenaar die gedeeltelijk arbeidsongeschikt is, wordt voor de toepassing van het achtste lid geacht volledig
      ongeschikt te zijn om zijn arbeid te verrichten. Zou de gedeeltelijk arbeidsongeschikte ambtenaar op grond van
      zijn daadwerkelijk verrichte diensten op grond van het eerste tot en met het vierde lid een hogere toelage voor
      consignatie hebben ontvangen dan overeenkomstig de eerste volzin met toepassing van het achtste lid is vastgesteld,
      dan heeft hij recht op een additionele toelage ter hoogte van het verschil tussen die twee bedragen.
    url: https://wetten.overheid.nl/BWBR0006517/2025-05-13#Artikel18
  - number: '19'
    text: |-
      1 Aan de ambtenaar kan een toelage worden toegekend om reden van werving of behoud tot een maximum van € 45.400,–
      per kalenderjaar.

      2 Het eerste lid is niet van toepassing op de ambtenaar met een functie waarvoor salarisschaal 15 of hoger geldt.
    url: https://wetten.overheid.nl/BWBR0006517/2025-05-13#Artikel19
  - number: '20'
    text: |-
      1 Aan de ambtenaar kan als tegemoetkoming in de representatiekosten een toelage worden toegekend tot een maximum
      van 5% van het salaris.

      2 De ambtenaar die een vergoeding als bedoeld in het eerste lid ontvangt, kan de volgende kosten niet declareren:

      a. kosten in verband met aanschaf van kleding en schoeisel;

      b. kosten in verband met aanpassing en inrichting van de eigen woning;

      c. kosten in verband met persoonlijke verzorging;

      d. kosten in verband met ontvangsten van bescheiden omvang in de eigen woning;

      e. fooien;

      f. het aanbieden van een drankje en rookwaar aan een zakenrelatie tijdens een bespreking, anders dan een lunch of
      een diner;

      g. het aanbieden van attenties of geschenken ter zake van recepties, jubilea en dergelijke aan medewerkers,
      collega’s of zakenrelaties;

      h. vakliteratuur, abonnementen en kantoorbenodigdheden, voor zover deze niet rechtstreeks door de werkgever worden
      betaald;

      i. contributies vakvereniging, niet zijnde een beroepsvereniging.
    url: https://wetten.overheid.nl/BWBR0006517/2025-05-13#Artikel20
  - number: 20a
    text: |-
      1 Aan de ambtenaar met een functie waarvoor salarisschaal 15 of hoger geldt, kan een periodieke toelage worden
      toegekend door het bevoegd gezag in het kader van de individuele ontwikkeling in de functie, het individueel
      structureel goed functioneren, werving en behoud of een andere gewichtige reden.

      2 De maximale hoogte van de periodieke toelage is voor:

      a. de korpschef € 21.000,– per jaar;

      b. korpsleiding, plaatsvervangend korpschef, politiechefs, de directeur van de Politieacademie en zijn
      plaatsvervanger 11% van het persoonlijke salaris per jaar;

      c. overige ambtenaren van schaal 15 tot en met 18 11% van het persoonlijke salaris per jaar.

      3 Het besluit tot toekennen en de hoogte van de periodieke toelage zal jaarlijks aan het eind van elk kalenderjaar
      opnieuw worden getoetst.
    url: https://wetten.overheid.nl/BWBR0006517/2025-05-13#Artikel20a
  - number: '21'
    text: |-
      1 In uitzonderlijke gevallen kan aan de ambtenaar of aan een groep van ambtenaren een toelage worden toegekend op
      andere gronden dan die vermeld in de [artikelen 16 tot en met 20a][ref1].

      2 Een in het eerste lid bedoelde toelage kan aan de ambtenaar worden toegekend nadat Onze Minister ter zake nadere
      regels heeft vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel16
