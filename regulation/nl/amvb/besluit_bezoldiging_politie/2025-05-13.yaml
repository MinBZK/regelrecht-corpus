  - number: '5'
    text: |-
      De ambtenaar ontvangt geen bezoldiging over de tijd gedurende welke hij opzettelijk nalaat zijn dienst te
      verrichten.
    url: https://wetten.overheid.nl/BWBR0006517/2025-05-13#Artikel5
  - number: '6'
    text: |-
      1 Voor de ambtenaar geldt een salarisschaal.

      2 Bij ministeriële regeling worden regels gesteld over de functies en de bij de functies behorende waardering.

      3 Indien nog geen sprake is van volledige functievervulling, geldt voor de ambtenaar voor de duur van een jaar een
      lagere salarisschaal dan voor hem op grond van het tweede lid zou gelden. Het bevoegd gezag kan beslissen om de
      periode van een jaar tot twee jaar te verlengen.

      4 Indien de ambtenaar bij wijze van waarneming tijdelijk een andere functie uitoefent, blijft de voordien voor de
      ambtenaar geldende salarisschaal van toepassing.

      5 Anders dan bij wijze van disciplinaire straf op grond van
      [hoofdstuk IX van het Besluit algemene rechtspositie politie][ref1], kan zonder voorafgaand
      ontslag, niet zijnde een ontslag dat de ambtenaar is verleend om als aspirant een krachtens
      [artikel 2c, eerste lid, van het Besluit algemene rechtspositie politie][ref2] aangewezen politieopleiding te
      gaan volgen of om als ambtenaar in opleiding een krachtens artikel 2c, tweede lid, van het Besluit algemene
      rechtspositie politie aangewezen politieopleiding te gaan volgen, voor een ambtenaar geen salarisschaal gaan gelden
      met een lager maximumsalaris dan dat van de reeds voor de ambtenaar geldende salarisschaal.

      6 Het vijfde lid is niet van toepassing indien:

      a. bij de bepaling van de salarisschaal, bedoeld in het tweede lid, tevens is bepaald dat de functie van de
      ambtenaar een tijdelijk karakter heeft en de salarisschaal in verband daarmee slechts tijdelijk zal gelden;

      b. indien de ambtenaar in verband met ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte wordt
      herplaatst in een andere functie;

      c. het salaris van de ambtenaar na het succesvol afronden van de opleiding wordt vastgesteld, met toepassing van
      [artikel 3a, zevende lid][ref3];

      d. indien de ambtenaar, die is aangewezen als herplaatsingkandidaat als bedoeld in
      [hoofdstuk VII.B van het Besluit algemene rechtspositie politie][ref4], wordt herplaatst in een andere functie.

      7 De lagere salarisschaal op grond van het zesde lid, onderdeel d, gaat niet eerder voor de ambtenaar gelden dan
      drie jaar nadat hij is herplaatst. Afhankelijk van het aantal dienstjaren van de ambtenaar wordt de termijn van
      drie jaar verlengd overeenkomstig de hierna volgende tabel:








                    dienstjaren:


                    verlenging:






                    25 of meer dienstjaren


                    één jaar




                    30 of meer dienstjaren


                    twee jaren




                    35 of meer dienstjaren


                    drie jaren




                    40 of meer dienstjaren


                    vier jaren






      Ingeval [artikel 55ob van het Besluit algemene rechtspositie politie][ref5] van toepassing is, gaat de hiervoor
      genoemde termijn pas lopen vanaf het tijdstip dat de ambtenaar het tweede aanbod, bedoeld in het tweede lid van dat
      artikel, dan wel het aanbod op het oorspronkelijke functieniveau voor invoering van het LFNP, bedoeld in het vijfde
      lid van dat artikel, heeft geweigerd.

      8 De lagere salarisschaal uit het zesde lid, onderdeel d, en het zevende lid, geldt niet indien de
      uitzondering van [artikel 55ra van het Besluit algemene rechtspositie politie][ref6] van toepassing
      is. De lagere salarisschaal geldt ook niet indien de ambtenaar niet op grond van het bepaalde in
      [artikel 55ob van het Besluit algemene rechtspositie politie][ref7] teruggeplaatst kan worden in een functie op
      zijn niveau van voor de invoering van het LFNP, omdat dit niveau niet passend is.

      9 De ambtenaar kan een aanvraag indienen bij het bevoegd gezag wanneer zijn feitelijke werkzaamheden ten minste één
      jaar wezenlijk afwijken van zijn huidige, aan hem opgedragen LFNP functie, om de feitelijke werkzaamheden overeen
      te laten komen met een andere LFNP functie. Bij ministeriële regeling worden nadere regels gesteld.

      10 Voor de ambtenaar die in het kader van een detachering, bedoeld in
      [artikel 62 van het Besluit algemene rechtspositie politie][ref8], tijdelijk een andere functie uitoefent waaraan
      op grond van [artikel 6, tweede lid][ref9], een hogere salarisschaal is verbonden, geldt deze hogere salarisschaal.

      11 De regeling bedoeld in het tweede lid is ook van toepassing in het kader van het vaststellen van de
      salarisschaal van passende arbeid bij arbeidsongeschiktheid. Hierbij is de eigen of een andere functie uit het
      LFNP, of een deel van één of meerdere functies uit het LFNP bepalend.

      12 Indien een herplaatsingkandidaat, bedoeld in [artikel 55oa van het Besluit algemene rechtspositie politie][ref10]
      drie jaar na plaatsing op een lagere passende functie nog geen twee maal een passende functie op het oude
      functieniveau, inclusief ten minste 24 OVW punten is aangeboden, behoudt hij zijn oorspronkelijke salarisschaal, de
      inmiddels verworven OVW periodieken en de aanspraak op eventueel nog mogelijke OVW periodieken.

      13 Indien een herplaatsingkandidaat, bedoeld in [artikel 55oa van het Besluit algemene rechtspositie politie][ref11]
      voor de tweede maal een aanbod van een passende functie op het niveau van de functie waarin hij was geplaatst voor
      aanwijzing als herplaatsingkandidaat, inclusief ten minste 24 OVW punten weigert, geldt met ingang van de eerste
      dag van de tweede maand nadat het tweede aanbod is gedaan, het salaris behorende bij de functie waarop de ambtenaar
      op dat moment is geplaatst.


