  - number: '41'
    text: |-
      1 De ambtenaar en de gewezen ambtenaar hebben geen aanspraak op doorbetaling van de bezoldiging:

      a) indien de ziekte is voorgewend, althans zodanig overdreven wordt voorgesteld, dat ongeschiktheid tot het
      verrichten van arbeid wegens ziekte niet kan worden aangenomen;

      b) indien de ambtenaar de ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte opzettelijk heeft
      veroorzaakt, tenzij hem daarvan op grond van zijn psychische toestand geen verwijt kan worden gemaakt;

      c) indien de ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte
      zich voordoet binnen een half jaar na het geneeskundig onderzoek, bedoeld in
      [artikel 7, eerste lid, onderdeel c, tweede lid, onder d, vijfde, zesde of zevende lid][ref1], respectievelijk
      [artikel 8, eerste lid, onderdeel c, of derde lid, van het Besluit algemene rechtspositie politie][ref2] en
      blijkt dat de ambtenaar onjuiste informatie omtrent zijn gezondheidstoestand heeft verstrekt of gegevens heeft
      verzwegen, ten gevolge waarvan de verklaring van geschiktheid voor de desbetreffende functie ten onrechte heeft
      plaatsgevonden, tenzij de ambtenaar aannemelijk maakt dat hij te goeder trouw heeft gehandeld.

      2 De gewezen ambtenaar heeft geen aanspraak op doorbetaling van zijn laatstelijk genoten bezoldiging, indien hij op
      grond van een aanvaarde andere betrekking aanspraak kan maken op doorbetaling van zijn loon of bezoldiging, dan wel
      op een ZW-uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel8
