    text: |-
      1 Aan de volgende ambtenaren, voor wie een salarisschaal geldt die lager is dan salarisschaal 12 van
      [bijlage I][ref1], wordt maandelijks een toelage bezwarende functie toegekend:

      a. de aspirant, met uitzondering van de aspirant, aangesteld op grond van
      [artikel 3, eerste lid, van het Besluit algemene rechtspositie politie][ref2];

      b. de ambtenaar, aangesteld voor de uitvoering van de politietaak;

      c. de ambtenaar, aangesteld voor administratieve, technische en andere taken ten dienste van de politie in een
      functie als bedoeld in [artikel 10, derde lid, van het Besluit algemene rechtspositie politie][ref3].

      2 Voor de ambtenaar in de functie van vlieger bij de Eenheid landelijke expertise en operaties wordt maandelijks de
      toelage bezwarende functie toegekend ongeacht de salarisschaal.

      3 De toelage bezwarende functie wordt toegekend voor de duur van maximaal 25 jaar en uiterlijk tot de eerste dag
      van de maand volgend op die waarin de ambtenaar de AOW gerechtigde leeftijd heeft bereikt. Op de maximale duur van
      25 jaar wordt in mindering gebracht de periode waarover, voorafgaand aan de invoering van de toeslag bezwarende
      functie, rechten zijn genoten of opgebouwd waarvoor de toelage bezwarende functie in de plaats is gekomen.

      4 De toelage bezwarende functie bedraagt 1,8% van de berekeningsgrondslag. Bij een deelbetrekking wordt de toelage
      berekend naar rato van de betrekkingsomvang.

      5 In afwijking van het vierde lid bedraagt de toelage bezwarende functie in 2006 1,6% van de berekeningsgrondslag.
      Bij een deelbetrekking wordt de toelage berekend naar rato van de betrekkingsomvang.

      6 Bij een onderbreking van het dienstverband en een nieuwe aanstelling in politiedienst wordt een eventueel
      bestaand recht op de toelage bezwarende functie voortgezet. Er ontstaat geen recht op een nieuwe termijn van 25
      jaar.

      7 Geen recht op de toelage, bedoeld in het eerste of tweede lid, heeft de ambtenaar:

      a. op wie [artikel 30, eerste lid, van het Besluit algemene rechtspositie politie][ref4] van toepassing is;

      b. op wie het [artikel 88a van dat Besluit][ref5] van toepassing is.


