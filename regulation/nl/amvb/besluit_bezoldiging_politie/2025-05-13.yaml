preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken van 16 november 1993, directoraat-generaal voor Openbare
    Orde en Veiligheid, directie Politie, hoofdafdeling Personeel, Onderwijs en Informatievoorziening, afdeling
    Arbeidsvoorwaardenbeleid, nr. EA93/U3219;

    Gelet op artikel 50, eerste lid, van de Politiewet 1993;

    De Raad van State gehoord (advies van 7 februari 1994, nummer WO4.93.0763;

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken van 11 maart 1994, directoraat-generaal voor
    Openbare Orde en Veiligheid, directie Politie, hoofdafdeling Personeel, Onderwijs en Informatievoorziening,
    afdeling Arbeidsvoorwaardenbeleid, nr. EA94/419;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006517/2025-05-13#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

        - *ambtenaar:* de aspirant, de ambtenaar in opleiding, de ambtenaar, aangesteld voor de uitvoering van de
      politietaak, de ambtenaar, aangesteld voor de uitvoering van technische, administratieve en andere taken ten
      dienste van de politie, de ambtenaar van de rijksrecherche en de vakantiewerker;
        - *ambtenaar, aangesteld voor de uitvoering van de politietaak:* de ambtenaar, bedoeld in
      [artikel 2, onderdeel a, van de Politiewet 2012][ref1], met uitzondering van de aspirant gedurende het theoretische
      opleidingsdeel en de ambtenaar in opleiding gedurende het theoretisch opleidingsdeel, waarbij voor de toepassing
      van dit besluit de ambtenaar van de rijksrecherche, aangesteld voor de uitvoering van de politietaak, gelijk wordt
      gesteld aan de ambtenaar, bedoeld in artikel 2, onderdeel a, van de Politiewet 2012;
        - *ambtenaar, aangesteld voor de uitvoering van technische, administratieve en andere taken ten dienste van
      de politie:* de ambtenaar, bedoeld in [artikel 2, onderdeel b, van de Politiewet 2012][ref2], waarbij voor de
      toepassing van dit besluit de directeur van de Politieacademie, zijn plaatsvervanger en de ambtenaar van de
      rijksrecherche, aangesteld voor de uitvoering van technische, administratieve en andere taken ten dienste van
      de rijksrecherche, wordt gelijkgesteld met ambtenaren van politie, bedoeld in artikel 2, onderdeel b, van de
      Politiewet 2012;
        - *ambtenaar in opleiding:* degene die door het bevoegd gezag is aangesteld als ambtenaar in opleiding en die
      is toegelaten tot een krachtens [artikel 2c, tweede lid, van het Besluit algemene rechtspositie politie][ref3]
      aangewezen politieopleiding;
        - *ambtenaar van de rijksrecherche:* de ambtenaar, bedoeld in
      [artikel 2, onderdeel d, van de Politiewet 2012][ref4];
        - *AOW-gerechtigde leeftijd:* de leeftijd waarop recht op ouderdomspensioen ontstaat, bedoeld in
      [artikel 7a van de Algemene Ouderdomswet][ref5];
        - *arbeidsongeschiktheid:* volledige en duurzame arbeidsongeschiktheid als bedoeld in
      [artikel 4, eerste lid, van de WIA][ref6] of gedeeltelijke arbeidsongeschiktheid als bedoeld in
      [artikel 5 van de WIA][ref7];
        - *arbeidsongeschiktheidspensioen:* een ABP arbeidsongeschiktheidspensioen als bedoeld in hoofdstuk 3.4 van het
      Pensioenreglement;
        - *arbodienst:* een arbodienst als bedoeld in de Arbeidsomstandighedenwet;
        - *aspirant:* degene die door het bevoegd gezag is aangesteld als aspirant en die is toegelaten tot een krachtens
      [artikel 2c, eerste lid, van het Besluit algemene rechtspositie politie][ref8] aangewezen politieopleiding;
        - *beroepsgerelateerd:* beroepsgerelateerd als bedoeld in
      [artikel 1 van het Besluit algemene rechtspositie politie][ref9];
        - *beroepspraktijkvorming:* de periode of perioden waarin de aspirant of de ambtenaar in opleiding de
      politietaak bij een regionale eenheid of een landelijke eenheid uitvoert in het kader van een krachtens
      [artikel 2c, eerste onderscheidenlijk tweede lid, van het Besluit algemene rechtspositie politie][ref10] aangewezen
      politieopleiding;
        - *bevoegd gezag:* bevoegd gezag als bedoeld in [artikel 1 van het Besluit algemene rechtspositie politie][ref11];
        - *bezoldiging:* de som van het salaris, de toelagen, met uitzondering van de toelagen, bedoeld in de
      [artikelen 12b][ref12], [12c][ref13], [12d][ref14], [12g][ref15], en [artikel 16, eerste lid][ref16], alsmede de
      uitkering, bedoeld in [artikel 25a][ref17], indien Onze Minister zulks bepaalt;
        - *consignatie:* consignatie als bedoeld in [artikel 1 van het Besluit algemene rechtspositie politie][ref18];
        - *deelbetrekking:* een betrekking die een arbeidstijd van gemiddeld minder dan 36 uur per week omvat;
        - *deskundige persoon:* een deskundige persoon als bedoeld in
      [artikel 14, eerste lid, van de Arbeidsomstandighedenwet][ref19] die belast is met de taken, bedoeld in artikel 14,
      eerste lid, onderdelen b of c, van die wet;
        - *functie:* het samenstel van door de ambtenaar te verrichten opgedragen werkzaamheden, zoals vastgelegd in het
      LFNP;
        - *gewezen ambtenaar:* een gewezen ambtenaar als bedoeld in
      [artikel 1 van het Besluit algemene rechtspositie politie][ref20];
        - *herplaatsen:* het op grond van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte opdragen van een
      andere functie of de eigen functie onder andere voorwaarden;
        - *herplaatsingtoelage:* een herplaatsingtoelage als bedoeld in bijlage 4 van het Pensioenreglement;
        - *in overwegende mate:* in overwegende mate als bedoeld in
      [artikel 1 van het Besluit algemene rechtspositie politie][ref21];
        - *LFNP:* Landelijk Functiegebouw Nederlandse Politie: het door Onze Minister vastgestelde geheel van
      functiebeschrijvingen, onderverdeeld naar vakgebieden, inclusief de waardering, en de aan het gebouw verbonden en
      omschreven werkterreinen, aandachtsgebieden en specifieke functionaliteiten;
        - *maximumsalaris:* het hoogste bedrag van een salarisschaal;
        - *medisch advies:* een advies van de deskundige persoon of de arbodienst dat
      ten aanzien van de ambtenaar is uitgebracht na een arbeidsgezondheidskundig
      onderzoek als bedoeld in [artikel 18, van de Arbeidsomstandighedenwet][ref22] en
      [artikel 50 van het Besluit algemene rechtspositie politie][ref23];
        - *Onze Minister:* Onze Minister van Justitie en Veiligheid;
        - *OVW periodieken:* Onvermijdelijk Verzwarende Werkomstandigheden periodieken, welke kunnen worden toegewezen op
      grond van [artikel 9a][ref24];
        - *OVW punten:* Onvermijdelijk Verzwarende Werkomstandigheden punten, zoals die met toepassing van het
      functiewaarderingssysteem zoals bedoeld in [artikel 6, tweede lid][ref25], worden vastgesteld;
        - *passende arbeid:* alle arbeid die voor de krachten en bekwaamheden van de ambtenaar is berekend, tenzij
      aanvaarding om redenen van lichamelijke, geestelijke of sociale aard niet van hem kan worden gevergd;
        - *pensioengevend inkomen:* het pensioengevend inkomen, bedoeld in hoofdstuk 7.1.1 van het Pensioenreglement
      vermeerderd met de toelagen genoemd in de [artikelen 12b][ref26], [12c][ref27] en [12d][ref28];
        - *Pensioenreglement:* het Pensioenreglement van de Stichting Pensioenfonds ABP;
        - *salaris:* het bedrag dat met inachtneming van de bepalingen van dit besluit voor de ambtenaar is vastgesteld
      aan de hand van één van de bijlagen van dit besluit, inclusief de op grond van [artikel 9a][ref29] toegekende
      periodieken;
        - *salarisnummer:* een aanduiding, bestaande uit een getal, die in een salarisschaal bij een salaris is vermeld;
        - *salarisschaal:* een als zodanig in één van de bijlagen van dit besluit vermelde reeks van genummerde salarissen;
        - *salaris per uur:* 1/157 deel van het salaris bij een volledige betrekking;
        - *Stichting Pensioenfonds ABP:* de Stichting Pensioenfonds ABP, bedoeld in
      [artikel 6 van de Wet privatisering ABP][ref30];
        - *theoretisch opleidingsdeel:* de periode of perioden waarin de aspirant of de
      ambtenaar in opleiding aan een opleidingsinstituut in het kader van een krachtens
      [artikel 2c, eerste onderscheidenlijk tweede lid, van het Besluit algemene rechtspositie politie][ref31] aangewezen
      politieopleiding onderwijs volgt;
        - *toelagen:* alle toelagen waarop ingevolge dit besluit aanspraak bestaat;
        - *Uitvoeringsinstituut werknemersverzekeringen:* het Uitvoeringsinstituut werknemersverzekeringen, bedoeld in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref32];
        - *vakantiewerker:* degene die ten tijde van onderbreking van zijn opleiding wegens vakantie voor een periode van
      ten hoogste acht weken is aangesteld voor het verrichten van ondersteunende werkzaamheden;
        - *uitkeringen:* alle uitkeringen waarop ingevolge dit besluit aanspraak bestaat;
        - *vergoedingen:* alle vergoedingen waarop ingevolge dit besluit aanspraak bestaat;
        - *volledige betrekking:* een betrekking die een arbeidstijd van gemiddeld 36 uur per week omvat;
        - *WIA:* [Wet werk en inkomen naar arbeidsvermogen][ref33];
        - *WIA-uitkering:* een uitkering op grond van de [WIA][ref34];
        - *zijn arbeid:* hetgeen daaronder wordt verstaan ingevolge [artikel 19 van de Ziektewet][ref35];
        - *ZW:* de [Ziektewet][ref36];
        - *ZW-uitkering:* ziekengeld als bedoeld in [artikel 19 van de Ziektewet][ref37].

      2 Voor de toepassing van dit besluit wordt onder echtgenote of echtgenoot mede verstaan de geregistreerde partner
      alsmede de niet-gehuwde ambtenaar die met een levenspartner samenwoont en – met het oogmerk duurzaam samen te leven
      – een gemeenschappelijke huishouding voert op basis van een notarieel verleden samenlevingscontract bevattende de
      wederzijdse rechten en verplichtingen ter zake van die samenwoning en gemeenschappelijke huishouding. Onder weduwe
      of weduwnaar wordt mede begrepen de achtergebleven geregistreerde partner alsmede de achtergebleven levenspartner.
      Tegelijkertijd kan slechts een persoon als echtgenoot of echtgenote dan wel weduwe of weduwnaar worden aangemerkt.
      Het bevoegd gezag kan verlangen dat een schriftelijke verklaring van een notaris wordt overgelegd waaruit blijkt
      dat een samenlevingscontract als bedoeld in de eerste volzin is gesloten.


