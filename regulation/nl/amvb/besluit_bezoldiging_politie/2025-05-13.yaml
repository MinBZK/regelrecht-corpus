      1 Voor de ambtenaar wordt maandelijks een vakantie-uitkering berekend ter waarde van 8% van de genoten bezoldiging.

      2 De vakantie-uitkering bedraagt ten minste € 194,52 per maand, met dien verstande dat dit bedrag naar
      evenredigheid wordt verminderd indien:

      a. de bezoldiging van de ambtenaar niet op de eerste dag van een maand aanvangt, dan wel indien de ambtenaar in een
      deel van een maand geen bezoldiging heeft genoten;

      b. de ambtenaar in de loop van een maand slechts een gedeelte van zijn bezoldiging heeft genoten wegens verleend
      verlof, in verband met non-activiteit, bij wijze van disciplinaire straf of uit hoofde van schorsing.

      3 Het in het tweede lid genoemde bedrag wordt voor de ambtenaar met een andere betrekking dan een volledige
      betrekking naar evenredigheid vastgesteld.

      4 Voor de toepassing van het eerste lid wordt de ambtenaar geacht in het genot van de volle bezoldiging te zijn,
      indien hij

      a. niet zijn volledige bezoldiging geniet op grond van de artikelen [13a][ref1], [28b][ref2] en
      [41 van het Besluit algemene rechtspositie politie][ref3] of op grond van de [artikelen 32 tot en met 37][ref4]
      en [38][ref5],

      b. een uitkering op grond van de [Wet arbeid en zorg][ref6] ontvangt, of

      c. een aanvulling op zijn ZW-uitkering geniet op grond van [artikel 39a][ref7].

      Is het feitelijk genot van de bezoldiging teruggebracht tot het bedrag van het op de ambtenaar te verhalen gedeelte
      van de pensioenbijdrage dan wordt hij voor de toepassing van het eerste lid geacht geen bezoldiging te genieten.

      5 Voor de ambtenaar, bedoeld in [artikel 33][ref8], wordt het bedrag van de vakantie-uitkering slechts berekend
      voor zoveel die uitgaat boven de vakantie-uitkering waarop hij als militair aanspraak heeft.


