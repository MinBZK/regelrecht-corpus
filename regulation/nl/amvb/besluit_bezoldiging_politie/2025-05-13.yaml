        artikel: '2.3'
  - number: '3'
    text: |-
      1 Gedurende het eerste leerjaar ontvangen aspiranten een tegemoetkoming voor de opleiding ter hoogte van een bij
      het opleidingsniveau genoemd bedrag als bedoeld in [bijlage IV][ref1] van dit besluit.

      2 Gedurende het eerste leerjaar hebben de aspiranten geen recht op de toelagen en vergoedingen genoemd in dit
      besluit, met uitzondering van de operationele toelage bedoeld in [artikel 14][ref2].

      3 Gedurende het tweede leerjaar ontvangen:

      a. aspiranten die vanaf 1 januari 2021 beginnen met een opleiding op niveau 4 tijdens de eerste zes maanden het
      salaris behorend bij de eerste regel bij schaal 4a in bijlage II van dit besluit en tijdens de tweede zes maanden
      het salaris behorend bij de tweede regel bij schaal 4a in [bijlage II][ref3];

      b. de overige aspiranten een salaris als bedoeld in [bijlage V][ref4] van dit besluit.

      4 Gedurende het derde leerjaar ontvangen aspiranten een salaris als bedoeld in [bijlage VI][ref5] van dit besluit.

      5 Gedurende het vierde leerjaar ontvangen aspiranten een salaris als bedoeld in [bijlage II][ref6] van dit besluit.

      6 Gedurende het tweede en, indien van toepassing, derde en vierde leerjaar is [artikel 50, eerste lid][ref7], van
      toepassing.

      7 Gedurende de gehele opleiding is op de aspirant [artikel 17a][ref8] niet van toepassing.

      8 Na het succesvol afronden van de opleiding vindt aanstelling plaats:

      a. in een functie waaraan salarisschaal 4 is verbonden van de aspirant die een opleiding heeft afgerond op niveau
      2;

      b. in een functie waaraan salarisschaal 6 is verbonden van de aspirant die een opleiding heeft afgerond op niveau
      3;

      c. in een functie waaraan salarisschaal 7 is verbonden van de aspirant die een opleiding heeft afgerond op niveau
      4;

      d. in een functie waaraan salarisschaal 8 is verbonden van de aspirant die een opleiding heeft afgerond op niveau
      6;

      e. in een functie waaraan salarisschaal 9 is verbonden van de aspirant die een opleiding heeft afgerond op niveau
      7,

      waarbij het salaris wordt vastgesteld op een bedrag dat gelijk is aan het bij het desbetreffende opleidingsniveau
      behorende garantiebedrag, genoemd in [bijlage III][ref9] van dit besluit.

      9 In afwijking van het achtste lid, onder c, vindt de aanstelling van de aspirant in het vakgebied GGP, die
      op of na 1 januari 2021 met de opleiding is gestart en deze op niveau 4 heeft afgerond, plaats in een functie
      waaraan salarisschaal 6 is verbonden. Daarbij geldt het garantiebedrag behorende bij opleidingsniveau 3, genoemd
      in [bijlage III][ref10].

      10 De bedragen, genoemd in [bijlage IV][ref11], worden gewijzigd conform
      [artikel 17, tweede lid, van het Besluit studiefinanciering 2000][ref12].

      11 Dit artikel is niet van toepassing op de aspirant die in de twee jaar direct voorafgaand aan zijn aanstelling
      gemiddeld per maand een aan arbeid gerelateerd inkomen heeft genoten van ten minste € 1.462,75.

      Op deze aspirant is [artikel 3a][ref13] van toepassing. In dit artikellid wordt onder aan arbeid gerelateerd
      inkomen verstaan inkomen verkregen uit:

      a. arbeid in loondienst;

      b. de uitoefening van een bedrijf of de zelfstandige uitoefening van een beroep;

      c. een uitkering op grond van een werknemersverzekering als bedoeld in
      [artikel 1, eerste lid, onderdeel i, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref14] of een
      uitkering die hiermee naar aard en strekking overeenkomt;

      d. een uitkering op grond van de [Wet arbeid en zorg][ref15].


