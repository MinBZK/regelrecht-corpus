  - number: 3a
    text: |-
      1 Voor de aspirant, genoemd in [artikel 3, elfde lid][ref1], geldt een salarisschaal als bedoeld in
      [bijlage II][ref2] van dit besluit.

      2 Bij de aanstelling wordt het salaris vastgesteld:

      a. op het minimumbedrag van schaal 2a, voor de aspirant die een opleiding volgt op niveau 2;

      b. op het minimumbedrag van schaal 3a, voor de aspirant die een opleiding volgt op niveau 3;

      c. op het minimumbedrag van schaal 4a, voor de aspirant die een opleiding volgt op niveau 4;

      d. op het minimumbedrag van schaal 5a, voor de aspirant die een opleiding volgt op niveau 6;

      e. op het minimumbedrag van schaal 6a, voor de aspirant die een opleiding volgt op niveau 7.

      3 In afwijking van het eerste en tweede lid wordt voor de aspirant die in de twaalf maanden direct voorafgaand aan
      de datum van aanstelling in totaal een hoger gemiddeld aan arbeid gerelateerd inkomen genoot dan het salaris dat op
      grond van het tweede lid voor hem is vastgesteld het salaris bij aanstelling zodanig vastgesteld dat het salaris,
      vermeerderd met de vakantie-uitkering en eindejaarsuitkering, gelijk is dan wel direct ligt onder het totaal aan
      arbeid gerelateerd genoten inkomen:

      a. in de volgens het tweede lid bij het opleidingsniveau behorende salarisschaal, of, indien die salarisschaal niet
      toereikend is;

      b. in de na afronding van de opleiding toepasselijke salarisschaal, bedoeld in het zevende lid, met dien verstande
      dat het salaris ten hoogste wordt vastgesteld op salarisregel 6 van de salarisschalen 4, 8 of 9, dan wel ten
      hoogste op salarisregel 7 van de salarisschalen 6 of 7.

      4 Onder het totaal aan arbeid gerelateerd inkomen, bedoeld in het derde lid, wordt verstaan het inkomen, bedoeld
      in [artikel 3, elfde lid][ref3], vermeerderd met de vakantie-uitkering en met een eventuele eindejaarsuitkering of
      dertiende maand.

      5 Indien de aspirant, bedoeld in het tweede lid, naar het oordeel van het bevoegd gezag naar behoren functioneert,
      wordt het salaris telkens na het verstrijken van de periode die in de desbetreffende salarisschaal staat vermeld
      verhoogd tot het naasthogere bedrag in de schaal.

      6 Indien de aspirant

      a. die is ingeschaald zoals bedoeld in het derde lid, onderdeel a, naar het oordeel van het bevoegd gezag naar
      behoren functioneert, wordt het salaris telkens na het verstrijken van de periode die in de desbetreffende
      salarisschaal staat vermeld, verhoogd tot het naasthogere bedrag in de schaal. Zodra het maximum van die
      salarisschaal is bereikt wordt het salaris telkens na één jaar verhoogd tot het naasthogere bedrag in de na
      afronding van de opleiding toepasselijke salarisschaal, tot maximaal salarisregel 5 van die schaal.

      b. die is ingeschaald zoals bedoeld in het derde lid, onderdeel b, naar het oordeel van het bevoegd gezag
      naar behoren functioneert, wordt het salaris telkens na één jaar verhoogd tot het naasthogere bedrag in de na
      afronding van de opleiding toepasselijke salarisschaal, tot ten hoogste de in het derde lid, onderdeel b, bedoelde
      salarisregel.

      7 Na het succesvol afronden van de opleiding vindt aanstelling plaats:

      a. in een functie waaraan salarisschaal 4 is verbonden van de aspirant die een opleiding heeft afgerond op niveau
      2;

      b. in een functie waaraan salarisschaal 6 is verbonden van de aspirant die een opleiding heeft afgerond op niveau
      3;

      c. in een functie waaraan salarisschaal 7 is verbonden van de aspirant die een opleiding heeft afgerond op niveau
      4;

      d. in een functie waaraan salarisschaal 8 is verbonden van de aspirant die een opleiding heeft afgerond op niveau
      6;

      e. in een functie waaraan salarisschaal 9 is verbonden van de aspirant die een opleiding heeft afgerond op niveau
      7,

      waarbij het salaris wordt vastgesteld op een bedrag dat gelijk is aan of hoger is dan het bij het desbetreffende
      opleidingsniveau behorende garantiebedrag, genoemd in bijlage III van dit besluit.

      8 In afwijking van het zevende lid, onder c, vindt de aanstelling van de aspirant in het vakgebied GGP, die
      op of na 1 januari 2021 met de opleiding is gestart en deze op niveau 4 heeft afgerond, plaats in een functie
      waaraan salarisschaal 6 is verbonden. Daarbij geldt het garantiebedrag behorende bij opleidingsniveau 3, genoemd
      in [bijlage III][ref4].

      9 Bij inschaling vanuit het maximumbedrag van schaal 4a respectievelijk 5a van [bijlage II][ref5] bij dit besluit
      in salarisschaal 6 respectievelijk salarisschaal 8 van [bijlage I][ref6] bij dit besluit, vindt inschaling plaats
      op salarisregel 3 respectievelijk salarisregel 1 van de desbetreffende salarisschaal.

      10 In uitzonderlijke individuele situaties kan het bevoegd gezag ten gunste van de aspirant afwijken van het tweede
      tot en met zesde lid.


