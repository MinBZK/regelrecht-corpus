  - number: '30'
    text: |-
      1 Aan de ambtenaar die op grond van [artikel 62 van het Besluit algemene rechtspositie politie][ref1] voor een
      periode van tenminste twee weken wordt gedetacheerd, wordt, indien hij dagelijks heen en weer reist, een vergoeding
      toegekend voor de tijd waarmee de totale reistijd per dag 90 minuten overschrijdt.

      2 De vergoeding, bedoeld in het eerste lid, is gelijk aan de vergoeding, bedoeld in
      [artikel 27, achtste lid][ref2], die de ambtenaar bij overwerk zou ontvangen. De vergoeding voor delen van een uur
      wordt vastgesteld op een evenredig deel van de uurvergoeding.

      3 Het bevoegd gezag kan in afwijking van het eerste en tweede lid beslissen in individuele gevallen waarin dit
      artikel naar zijn oordeel niet of niet in redelijkheid voorziet.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel62
