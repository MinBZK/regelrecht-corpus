  - number: '8'
    text: |-
      1 Bij de aanstelling wordt het salaris vastgesteld op het minimum van de voor de ambtenaar geldende salarisschaal
      van [bijlage I][ref1] bij dit besluit.

      2 Van het eerste lid kan worden afgeweken door het toekennen van een hoger salaris in de voor de ambtenaar geldende
      salarisschaal, indien daartoe naar het oordeel van het bevoegd gezag aanleiding bestaat.

      3 Bij de aanstelling van de korpschef wordt zijn salaris vastgesteld conform [bijlage IA][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006517
