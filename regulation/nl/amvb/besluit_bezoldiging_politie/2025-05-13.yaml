      1 De ambtenaar heeft recht op een maandelijkse toelage inhoudende een algemene levensloopbijdrage van 0,75%
      van de berekeningsgrondslag. Bij een deelbetrekking wordt de levensloopbijdrage berekend naar rato van de
      betrekkingsomvang.

      2 In afwijking van het eerste lid bedraagt het in het eerste lid genoemde percentage in 2006 0,45%.

      3 Geen recht op de toelage, bedoeld in het eerste lid, heeft de:

      a. ambtenaar op wie [artikel 30, eerste lid, van het Besluit algemene rechtspositie politie][ref1] van toepassing
      is;

      b. ambtenaar op wie het [artikel 88a van dat Besluit][ref2] van toepassing is;

      c. aspirant op wie het [artikel 3, eerste lid, van dat Besluit][ref3] van toepassing is.


