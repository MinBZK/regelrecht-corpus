  - number: '16'
    text: |-
      1 Indien naar het oordeel van het bevoegd gezag sprake is van zeer goede of uitstekende vervulling van de functie
      kan voor de duur van een jaar een toelage worden toegekend aan de ambtenaar die het maximumsalaris van de voor hem
      geldende salarisschaal heeft bereikt indien de salarisschaal niet meer dan schaal 14 bedraagt.

      2 Indien naar het oordeel van het bevoegd gezag sprake is van zeer goede of uitstekende vervulling van de functie
      en daartoe op grond van bijzondere omstandigheden aanleiding bestaat, kan een toelage voor een langere duur dan een
      jaar worden toegekend.

      3 De toelage bedraagt voor de ambtenaar:

      a. ingedeeld in schaal 1 tot en met 9 van [bijlage I][ref1] van dit besluit: ten hoogste 6% van het voor de
      ambtenaar geldende maximumsalaris;

      b. ingedeeld in schaal 10, 11, 12 of 13 van [bijlage I][ref2] van dit besluit: ten hoogste 9% van het voor de
      ambtenaar geldende maximumsalaris;

      c. ingedeeld in schaal 14 van [bijlage I][ref3] van dit besluit: ten hoogste 12% van het voor de ambtenaar geldende
      maximumsalaris.


      [ref1]: https://wetten.overheid.nl/BWBR0006517
