  - number: 12d
    text: |-
      1 Aan de ambtenaar wordt maandelijks een inhaaltoelage bezwarende functie toegekend, indien de ambtenaar:

      a. op 12 maart 1999 en op 31 december 2000 een functie vervulde waarvoor tot 1 januari 2001 een leeftijdsgrens
      gold op grond van [artikel 88, eerste lid, van het Besluit algemene rechtspositie politie][ref1], zoals dat luidde
      direct voor die datum;

      b. op 1 januari 2001 jonger was dan 50 jaar; en

      c. vanaf 1 januari 2001 ononderbroken is aangesteld door een bevoegd gezag of opeenvolgend door meer dan één
      bevoegd gezag.

      2 Voor de toepassing van het eerste lid, onderdeel c, wordt niet als onderbreking aangemerkt:

      a. een onderbreking van maximaal twee maanden;

      b. een onderbreking van maximaal vijf jaren gelegen tussen het tijdstip van ontslag in verband met
      arbeidsongeschiktheid en het tijdstip waarop de ambtenaar wederom de hoedanigheid van ambtenaar heeft verworven;

      c. een onderbreking van maximaal achttien maanden gelegen tussen een tijdstip met ingang waarvan de ambtenaar,
      al dan niet na ontslag, recht op een ontslaguitkering of een wachtgelduitkering of een uitkering op grond van
      het [Besluit bovenwettelijke werkloosheidsuitkering politie][ref2], heeft verkregen en het tijdstip waarop die
      ambtenaar opnieuw de hoedanigheid van ambtenaar heeft verworven;

      d. een onderbreking van maximaal vier jaren gelegen tussen het tijdstip van ontslag in verband met zorgtaken en het
      tijdstip waarop de ambtenaar opnieuw de hoedanigheid van ambtenaar heeft verworven.

      3 De inhaaltoelage bezwarende functie wordt toegekend tot de eerste dag van de maand volgend op die waarin de
      ambtenaar de leeftijd van 60 jaar heeft bereikt.

      4 De inhaaltoelage bezwarende functie bedraagt een percentage van de berekeningsgrondslag. Het percentage wordt
      bepaald door het bevoegd gezag die daartoe wordt geadviseerd door de Stichting pensioenfonds ABP. Bij regeling van
      Onze Minister worden nadere regels gesteld over de berekeningsgrondslag.

      5 De ambtenaar, bedoeld in het eerste lid, die bij eerste indiensttreding in een functie als bedoeld in het eerste
      lid, onderdeel a, 35 jaar of ouder was, komt in aanmerking voor een aanvullend percentage bovenop het percentage,
      bedoeld in vierde lid. Het aanvullende percentage wordt bepaald door het bevoegd gezag die daartoe wordt
      geadviseerd door de Stichting pensioenfonds ABP. Bij regeling van Onze Minister worden nadere regels gesteld.

      6 In het geval de ambtenaar niet of niet volledig in het genot is van zijn volledige bezoldiging, heeft dit geen
      gevolgen voor de toekenning van de inhaaltoelage bezwarende functie.

      7 Eenmaal vastgesteld loopt de inhaaltoelage bezwarende functie door tot het moment dat de ambtenaar de leeftijd
      van 60 jaar bereikt dan wel de politie vóór die leeftijd verlaat. Veranderingen van functie, betrekkingsomvang,
      status of salarisschaal hebben geen effect op de duur en het vastgestelde percentage.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0012022
