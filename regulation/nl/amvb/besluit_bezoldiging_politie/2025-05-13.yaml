  - number: '26'
    text: |-
      1 Aan de ambtenaar kan een uitkering worden toegekend om redenen van werving of behoud tot een maximum van € 45
      400,- per kalenderjaar.

      2 De uitkering wordt toegekend aan het einde van een tijdvak dat tevoren is vastgesteld door het bevoegd gezag.

      3 Aan de toekenning van de uitkering kunnen door het bevoegd gezag voorwaarden worden gesteld.

      4 Aan de ambtenaar die niet heeft kunnen voldoen aan de in het derde lid bedoelde voorwaarden door een naar het
      oordeel van het bevoegd gezag niet aan de ambtenaar zelf te wijten oorzaak, kan de uitkering gedeeltelijk worden
      toegekend.

      5 Dit artikel is niet van toepassing op de ambtenaar met een functie waarvoor een salarisschaal 15 of hoger geldt.
    url: https://wetten.overheid.nl/BWBR0006517/2025-05-13#Artikel26
  - number: 26b
    text: |-
      1 De ambtenaar maakt maandelijks aanspraak op een individueel keuzebudget opgebouwd naar de gezamenlijke geldwaarde
      van:

      a. het bedrag van de vakantie-uitkering, bedoeld in [artikel 23][ref1];

      b. het bedrag van de eindejaarsuitkering, bedoeld in [artikel 25b][ref2], en;

      c. een bedrag ter waarde van 1,53% van het maandsalaris.

      2 De ambtenaar maakt daarnaast per kalenderjaar aanspraak op een aanvullend individueel keuzebudget van € 377,–
      netto.

      3 Het individueel keuzebudget, bedoeld in het eerste lid, kan in een door de ambtenaar gekozen maand geheel of
      gedeeltelijk worden uitbetaald of aangewend. Het resterende bedrag wordt aan het einde van het kalenderjaar met de
      salarisbetaling van december aan de ambtenaar uitbetaald.

      4 Het individueel keuzebudget, bedoeld in het tweede lid, kan in een door de ambtenaar gekozen maand geheel of
      gedeeltelijk op declaratiebasis worden aangewend. Het resterende bedrag aan het einde van het kalenderjaar vervalt.

      5 Bij beëindiging van het dienstverband wordt het niet uitbetaalde of aangewende individueel keuzebudget, bedoeld
      in het eerste lid, aan de ambtenaar uitbetaald.

      6 Bij beëindiging van het dienstverband vervalt het niet aangewende individueel keuzebudget, bedoeld in het tweede
      lid.

      7 Onze Minister kan bij ministeriële regeling nadere regels stellen ter uitwerking van hetgeen in dit artikel is
      bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel23
