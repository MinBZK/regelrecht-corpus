    text: |-
      1 Onder ambtenaar in dit artikel wordt verstaan de ambtenaar, die op 1 januari 2006 recht heeft
      op een uitkering krachtens de [Wet op de arbeidsongeschiktheidsverzekering][ref1] of die in de
      periode van 1 januari 2006 tot 1 januari 2008 recht heeft verkregen op een uitkering krachtens de
      [Wet werk en inkomen naar arbeidsvermogen][ref2].

      2 De ambtenaar kan het bevoegd gezag jaarlijks melden de bijdrage en toelagen, bedoeld in de
      [artikelen 12b tot en met 12d][ref3], in afwijking van [artikel 12e][ref4], te willen besteden, door:

      a. geheel of gedeeltelijk verlof op te nemen;

      b. de waarde van de levensloopbijdrage geheel of ten dele uit te laten betalen;

      c. geheel of ten dele af te zien van de levensloopbijdrage; of

      d. een combinatie van onderdelen a, b en c te kiezen.

      3 Indien de ambtenaar kiest voor besteding van de bijdrage en toelagen, bedoeld in het tweede lid, onderdeel b,
      merkt het bevoegd gezag op zijn verzoek de levensloopbijdrage bij uitbetaling eenmalig niet als pensioengevend
      inkomen aan.

      4 Bij ministeriele regeling worden nadere regels gesteld over de melding, bedoeld in het tweede lid.


