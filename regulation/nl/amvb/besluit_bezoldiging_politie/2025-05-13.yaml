  - number: '37'
    text: |-
      De [artikelen 32 tot en met 36][ref1] zijn van overeenkomstige toepassing ten aanzien van:

      a. de ambtenaar die is tewerkgesteld in de zin van [artikel 9 van de Wet gewetensbezwaren militaire dienst][ref2];

      b. de ambtenaar die als militair in werkelijke dienst is op grond van een verbintenis bij het reservepersoneel der
      krijgsmacht of

      c. de ambtenaar die op grond van een andere bijzondere verbintenis in werkelijke militaire of daarmee gelijk te
      stellen dienst is, terzake waarvan dit bij koninklijk besluit is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0002386#Artikel9
