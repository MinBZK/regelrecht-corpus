  - number: 49a
    text: |-
      1 Op de ambtenaar die recht heeft op een arbeidsongeschiktheidsuitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1], blijven de bepalingen uit het Besluit bezoldiging politie
      waarin sprake is van de Wet op de arbeidsongeschiktheidsverzekering van toepassing, zoals deze luidden op
      28 december 2005.

      2 Op de ambtenaar die op 31 december 2006 recht had op een herplaatsingstoelage of een invaliditeitspensioen,
      blijven de bepalingen uit het Besluit bezoldiging politie waarin sprake is van de herplaatsingstoelage of het
      invaliditeitspensioen van toepassing, zoals deze luidden op 31 december 2006.

      3 Bij de toepassing van de voorgaande leden wordt in de daarin bedoelde bepalingen in plaats van «de leeftijd van
      65 jaar» telkens gelezen: de AOW-gerechtigde leeftijd.

      4 Voor de ambtenaar die recht heeft op een arbeidsongeschiktheidsuitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref2] en die op grond van [artikel 38, tiende lid][ref3], zoals dit
      artikel luidde op 28 december 2005, een aanvullende uitkering ontvangt, wijzigt de hoogte van die uitkering niet
      indien de ambtenaar een uitkering gaat ontvangen als bedoeld in [artikel 29d][ref4] of een pensioen gaat ontvangen
      als bedoeld in hoofdstuk 5 van het Pensioenreglement, voor zover dat is ingegaan voor de AOW-gerechtigde leeftijd.


