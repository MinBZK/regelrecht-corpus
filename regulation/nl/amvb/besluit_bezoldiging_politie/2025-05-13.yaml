  - number: '2'
    text: |-
      De toekenning, de intrekking, de verhoging onderscheidenlijk de vermindering van het salaris, de toelagen, de
      vergoedingen, de uitkeringen, de tegemoetkoming in de representatiekosten, het salaris van de aspirant, en de
      gratificatie geschieden door het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0006517/2025-05-13#Artikel2
  - number: 2a
    text: |-
      De [artikelen 2.1, eerste tot en met derde lid][ref1], en [2.3 van de Wet normering topinkomens][ref2] zijn van
      overeenkomstige toepassing op de ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel2.3
