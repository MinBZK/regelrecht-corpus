  - number: 29e
    text: |-
      1 De ambtenaar die op 31 december 2025 ten minste de leeftijd van 65 jaar heeft bereikt en die doorwerkt tot aan
      het bereiken van de AOW-gerechtigde leeftijd, ontvangt een eenmalige uitkering.

      2 Bij ten minste een volledige betrekking bedraagt de eenmalige uitkering € 6.000.

      3 Bij een deelbetrekking bedraagt de eenmalige uitkering een evenredig deel van de aanspraak bij een volledige
      betrekking.

      4 De betrekkingsomvang wordt vastgesteld op basis van het gemiddelde van de betrekkingen van de ambtenaar
      in de periode van tien jaar direct voorafgaand aan het bereiken van de AOW-gerechtigde leeftijd, waarbij de
      voor hem vastgestelde betrekkingsomvang per week op 31 december van elk van de betrokken jaren geldt als de
      betrekkingsomvang van dat jaar. Indien in enig jaar in genoemde periode voor de ambtenaar geen betrekkingsomvang
      kan worden vastgesteld, blijft dat jaar voor de berekening van het gemiddelde buiten beschouwing.

      5 In afwijking van het vierde lid, wordt voor de ambtenaar die een uitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1] of een WIA-uitkering ontvangt de betrekkingsomvang vastgesteld
      aan de hand van het aantal uren dat de ambtenaar is aangesteld bij het bereiken van de AOW-gerechtigde leeftijd,
      tenzij met dit aantal uren de voor de ambtenaar vastgestelde restverdiencapaciteit niet volledig wordt benut. In
      dat geval geldt een betrekkingsomvang die overeenkomt met die restverdiencapaciteit.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
