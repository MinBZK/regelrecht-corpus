  - number: 37a
    text: |-
      1 De ambtenaar die 55 jaar of ouder is kan op zijn aanvraag, een functie worden opgedragen waaraan een salaris is
      verbonden met een lager maximum dan het maximum van de reeds voor hem geldende salarisschaal. In dat geval wordt op
      zijn salaris een inhouding toegepast.

      2 De inhouding is gelijk aan het verschil tussen het salaris dat de ambtenaar geniet en het maximumsalaris
      behorende bij de salarisschaal direct onder de voor de ambtenaar geldende salarisschaal met dien verstande dat dit
      bedrag niet negatief mag zijn.

      3 In bijzondere gevallen kan het bevoegd gezag geheel of gedeeltelijk van de inhouding afzien.

      4 Onze Minister kan nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0006517/2025-05-13#Artikel37a
  - number: 37b
    text: |-
      1 De ambtenaar heeft voor iedere dienstdag waarop minimaal vier uren arbeid wordt verricht vanaf
      een eigen woonadres aanspraak op een vergoeding van netto € 2,40, voor zover diegene voor de
      desbetreffende dienstdag geen aanspraak maakt op vergoedingen voor reis- of verblijfskosten ingevolge het
      [Besluit reis-, verblijf- en verhuiskosten politie][ref1].

      2 De vergoeding wordt toegekend op declaratiebasis op een door het bevoegd gezag voorgeschreven wijze.

      3 Geen aanspraak op een vergoeding bestaat indien de declaratie van de in een kalendermaand ontstane aanspraak
      niet binnen drie maanden na die kalendermaand bij het bevoegd gezag is ingediend, tenzij het overschrijden van de
      termijn niet aan de ambtenaar verwijtbaar is.

      4 Het bedrag van de vergoeding, genoemd in het eerste lid, wordt aan het begin van elk kalenderjaar bij
      ministeriële regeling vervangen door een ander bedrag, bepaald conform de indexatiemethode vermeld in
      [artikel 31a, dertiende lid, van de Wet op de loonbelasting 1964][ref2].

      5 Dit artikel is van overeenkomstige toepassing op de vrijwillige ambtenaar, aangesteld voor de uitvoering van de
      politietaak, bedoeld in [artikel 1, eerste lid, van het Besluit algemene rechtspositie politie][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0024064
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel31a
