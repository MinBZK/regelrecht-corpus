  - number: 29d
    text: |-
      1 De uitkering bedraagt voor de ambtenaar die ten minste in een volledige betrekking werkzaam is het in
      [artikel 32ba, zevende lid, van de Wet op de loonbelasting 1964][ref1] genoemde bedrag per maand.

      2 Bij een deelbetrekking wordt de uitkering vastgesteld op een evenredig deel van de aanspraak bij een volledige
      betrekking.

      3 Indien sprake is van samenloop van een uitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref2] of een WIA-uitkering en een uitkering als bedoeld in het eerste
      of tweede lid en de laatste uitkering hoger is dan de bezoldiging direct voorafgaand aan het ontslag, bedoeld
      in het achtste lid, wordt de uitkering, bedoeld in het eerste of tweede lid, verminderd met het bedrag dat die
      uitkering de bezoldiging overstijgt.

      4 De betrekkingsomvang wordt vastgesteld op basis van het gemiddelde van de betrekkingen van de ambtenaar in de
      periode van tien jaar direct voorafgaand aan de ingangsdatum van de uitkering, waarbij de voor hem vastgestelde
      betrekkingsomvang per week op 31 december van elk van de betrokken jaren geldt als de betrekkingsomvang van dat
      jaar. Indien in enig jaar in genoemde periode voor de ambtenaar geen betrekkingsomvang kan worden vastgesteld,
      blijft dat jaar voor de berekening van het gemiddelde buiten beschouwing.

      5 In afwijking van het vierde lid wordt voor de ambtenaar die door het Uitvoeringsinstituut werknemersverzekeringen
      op grond van:

      a. [artikel 18 van de Wet op de arbeidsongeschiktheidsverzekering][ref3] voor ten minste 15%, maar minder dan 80%
      arbeidsongeschikt wordt geacht, of

      b. [artikel 5 van de WIA][ref4] voor 35 tot 80% arbeidsongeschikt wordt geacht,

      de betrekkingsomvang vastgesteld aan de hand van het aantal uren dat de ambtenaar is aangesteld direct voorafgaand
      aan zijn ontslag, bedoeld in het achtste lid, tenzij met dit aantal uren de voor de ambtenaar vastgestelde
      restverdiencapaciteit niet volledig wordt benut. In dat geval geldt een betrekkingsomvang die overeenkomt met die
      restverdiencapaciteit.

      6 Onverminderd het bepaalde in [artikel 29c, derde lid][ref5], kan de ambtenaar bedoeld in het tweede lid,
      onderdeel b, van dat artikel, de uitkering voor het bereiken van de leeftijd van 65 jaar laten ingaan, doch niet
      eerder dan maximaal drie jaar voorafgaand aan de AOW-gerechtigde leeftijd. In dat geval wordt de uitkering berekend
      aan de hand van de volgende formule:

      A x (B/C) = D

      Hierbij staat:

      A voor de op grond van het eerste, tweede of derde lid voor de ambtenaar berekende uitkering;

      B voor het aantal maanden gelegen tussen de datum waarop de ambtenaar de leeftijd van 65 jaar bereikt en de AOW-
      gerechtigde leeftijd;

      C voor het op hele maanden naar boven afgeronde aantal maanden gelegen tussen de ingangsdatum van de uitkering en
      de AOW-gerechtigde leeftijd;

      D de uitkering per maand.

      7 De aanspraak op uitkering geldt alleen indien de uitkeringsduur ten minste een maand bedraagt.

      8 De uitkering gaat in op de dag waarop de ambtenaar ontslag is verleend op grond van
      [artikel 88d van het Besluit algemene rechtspositie politie][ref6].

      9 De uitkering wordt aangepast overeenkomstig wijzigingen van het in
      [artikel 32ba, zevende lid, van de Wet op de loonbelasting 1964][ref7] genoemde bedrag.

      10 De uitkering eindigt met ingang van de dag:

      a. waarop de ambtenaar de AOW-gerechtigde leeftijd bereikt;

      b. volgende op de dag waarop de ambtenaar overlijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel32ba
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel18
