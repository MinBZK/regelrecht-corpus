  - number: '14'
    text: |-
      1 Aan de ambtenaar wordt een operationele toelage toegekend.

      2 De operationele toelage wordt berekend per periode van vier weken en bedraagt voor elk uur waarop de ambtenaar
      werkelijke dienst verricht dan wel werkelijke dienst zou hebben verricht indien de ambtenaar niet binnen een
      tijdvak van vier dagen direct daaraan voorafgaande door het bevoegde gezag tot dienstverrichting op andere
      tijdstippen geroepen was:

      a. in het tijdvak van maandag tot en met vrijdagochtend van 21.00 tot 07.00 uur, op vrijdagavond van 21.00 tot
      22.00 uur, en op zaterdag en zondag van 07.00 tot 22.00 uur, € 5,04; en

      b. in het tijdvak van 22.00 tot 07.00 uur in de weekendnachtdiensten, daaronder begrepen de diensten in de nacht
      voor en de nacht na een weekend of een feestdag, genoemd in het derde lid, € 7,57.

      3 Hetgeen in het tweede lid ten aanzien van het verrichten van dienst op zaterdag en zondag is bepaald, geldt mede
      voor het verrichten van dienst op de Nieuwjaarsdag, de tweede Paasdag, de Hemelvaartsdag, de tweede Pinksterdag, de
      beide Kerstdagen en de dag waarop de verjaardag van de Koning wordt gevierd.

      4 De operationele toelage wordt in gevallen van ziekte, zwangerschaps- en bevallingsverlof of van aangepaste
      werkzaamheden in verband met zwangerschap van de ambtenaar gesteld op het bedrag dat de ambtenaar in de 13
      perioden van vier weken, onmiddellijk voorafgaande aan de periode van vier weken waarin de ziekte, zwangerschap- en
      bevallingsverlof of aangepaste werkzaamheden in verband met zwangerschap zijn aangevangen, gemiddeld aan toelage op
      grond van dit artikel heeft genoten.

      5 Het eerste tot en met vierde lid zijn niet van toepassing op de ambtenaar met een functie waarvoor salarisschaal
      15 of hoger geldt.

      6 De operationele toelage voor de ambtenaar voor wie de hoogte van deze toelage eerder is vastgesteld met
      toepassing van het vierde lid, blijft in geval van ziekte, zwangerschaps- en bevallingsverlof of aangepaste
      werkzaamheden in verband met zwangerschap van de ambtenaar, binnen vier weken na hervatting van zijn werkzaamheden
      ongewijzigd op die hoogte.

      7 De ambtenaar die gedeeltelijk arbeidsongeschikt is, wordt voor de toepassing van het vierde lid geacht volledig
      ongeschikt te zijn om zijn arbeid te verrichten. Zou de gedeeltelijk arbeidsongeschikte ambtenaar op grond van zijn
      daadwerkelijk verrichte diensten op grond van de eerste tot en met het derde lid een hogere operationele toelage
      hebben ontvangen dan overeenkomstig de eerste volzin met toepassing van het vierde lid is vastgesteld, dan heeft
      hij recht op een additionele toelage ter hoogte van het verschil tussen die twee bedragen.
    url: https://wetten.overheid.nl/BWBR0006517/2025-05-13#Artikel14
  - number: '15'
    text: |-
      1 De ambtenaar van wie de bezoldiging voldoet aan de volgende voorwaarden, wordt een aflopende toelage toegekend:

      a. de bezoldiging van de betreffende ambtenaar heeft als gevolg van het beëindigen of verminderen van de
      operationele toelage een blijvende of tijdelijke verlaging ondergaan;

      b. het gemiddelde bedrag dat de ambtenaar aan operationele toelage heeft genoten in de 13 perioden van vier weken
      voorafgaande aan de verlaging bedraagt ten minste 3% van het salaris van de ambtenaar in de nieuwe situatie op het
      moment dat de verlaging ingaat;

      c. de ambtenaar heeft, tenzij sprake is van een tijdelijke verlaging van de bezoldiging als bedoeld onder a, direct
      voorafgaande aan het tijdstip van de beëindiging of de vermindering de operationele toelage gedurende ten minste
      twee jaren zonder wezenlijke onderbreking genoten; en

      d. het beëindigen of verminderen van de operationele toelage, bedoeld onder a, is veroorzaakt buiten toedoen van de
      betrokken ambtenaar zelf, tenzij de vermindering het gevolg is van een verplaatsing of wijziging van de plaats van
      tewerkstelling op eigen verzoek, dan wel een aanstelling in een andere functie op eigen verzoek.

      2 In afwijking van het eerste lid wordt aan de ambtenaar van 55 jaar of ouder wiens bezoldiging als gevolg van
      het beëindigen of verminderen van de operationele toelage, bedoeld in [artikel 14][ref1], een blijvende verlaging
      ondergaat, een blijvende toelage toegekend, mits de ambtenaar eerstbedoelde toelage direct voorafgaande aan het
      tijdstip van deze beëindiging of vermindering ervan, gedurende tenminste tien jaren zonder wezenlijke onderbreking
      heeft genoten en mits wordt voldaan aan de in het eerste lid onder b en d genoemde voorwaarden.

      3 De in het eerste lid bedoelde aflopende toelage na een blijvende verlaging van de bezoldiging gaat, wanneer de
      ambtenaar de leeftijd van 55 jaar bereikt en onmiddellijk vóór de aanvang van die toelage gedurende tenminste tien
      jaren zonder wezenlijke onderbreking de operationele toelage, bedoeld in [artikel 14][ref2] heeft genoten, over in
      een blijvende toelage als bedoeld in het tweede lid.

      4 Voor de toepassing van dit artikel wordt onder wezenlijke onderbreking verstaan een onderbreking van langer dan
      twee maanden.

      5 Voor de ambtenaar die is aangesteld voor de uitvoering van technische, administratieve en andere taken
      ten dienste van de politie en geen door het bevoegd gezag aangewezen functie vervult als bedoeld in
      [artikel 10, derde lid, van het Besluit algemene rechtspositie politie][ref3], wordt in het tweede en derde lid van
      dit artikel in plaats van «55 jaar» telkens gelezen: 60 jaar.

      6 Onze Minister stelt nadere regels vast over de berekeningswijze van de toelage en over de gevallen waarin sprake
      is van een blijvende of tijdelijke verlaging van de bezoldiging als bedoeld in het eerste lid.

      7 Het eerste en het tweede lid zijn niet van toepassing op de ambtenaar met een functie waarvoor salarisschaal 15
      of hoger geldt.


