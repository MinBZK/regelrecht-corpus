  - number: '39'
    text: |-
      1 De gewezen ambtenaar die wegens ziekte, ontstaan voor het tijdstip van ingang
      van zijn ontslag, niet zijnde een ontslag op grond van [artikel 88a][ref1] dan wel
      [artikel 94, eerste lid, aanhef en onderdeel e of f, van het Besluit algemene rechtspositie politie][ref2] nog
      ongeschikt is een naar aard en omvang soortgelijke functie te vervullen, heeft zolang hij ongeschikt tot werken
      is wegens ziekte, doch niet langer dan een tijdvak van ten hoogste 78 weken, aanspraak op de doorbetaling van zijn
      bezoldiging overeenkomstig de volgende tabel:

      a. de eerste 26 weken 100% van de bezoldiging;

      b. de tweede 26 weken 90% van de bezoldiging;

      c. de derde 26 weken 80% van de bezoldiging.

      2 De gewezen ambtenaar die binnen een maand na het tijdstip van zijn ontslag ongeschikt wordt wegens ziekte een
      naar aard en omvang soortgelijke functie te vervullen, heeft zolang betrokkene ongeschikt is tot werken wegens
      ziekte, maar niet langer dan 52 weken, aanspraak op doorbetaling van zijn laatstelijk genoten bezoldiging indien
      hij gedurende ten minste twee maanden onmiddellijk aan het ontslag voorafgaande in dienst is geweest overeenkomstig
      de volgende tabel:

      a. de eerste 26 weken 100% van de bezoldiging;

      b. de tweede 26 weken 90% van de bezoldiging.

      3 Voor het bepalen van het einde van het tijdvak van 78 weken, bedoeld in het eerste lid, en het
      tijdvak van 52 weken, bedoeld in het tweede lid, worden perioden van ongeschiktheid samengeteld indien
      zij elkaar met een onderbreking van minder dan vier weken opvolgen of indien zij direct voorafgaan aan
      en aansluiten op een periode waarin zwangerschaps- of bevallingsverlof wordt genoten overeenkomstig
      [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref3], tenzij de ongeschiktheid redelijkerwijs niet
      geacht kan worden voort te vloeien uit dezelfde oorzaak.

      4 De doorbetaling van de bezoldiging bedoeld in het eerste en tweede lid, eindigt na ommekomst van de
      uitkeringsduur, maar in ieder geval:

      a. met ingang van de dag waarop de gewezen ambtenaar de AOW-gerechtigde leeftijd bereikt; of

      b. met ingang van de dag volgende op die waarop de gewezen ambtenaar is overleden.

      5 De gewezen ambtenaar waarvan de mate van arbeidsongeschiktheid is vastgesteld op minder dan 35% en die als gevolg
      van de arbeidsongeschiktheid inkomensverlies heeft, maakt aanspraak op een compensatie van dit inkomensverlies.
      Onder inkomensverlies wordt verstaan het verschil tussen de laatstgenoten bezoldiging, vakantie-uitkering en
      eindejaarsuitkering van de ambtenaar op het moment van vaststelling van de mate van arbeidsongeschiktheid op minder
      dan 35% en de nieuwe structurele bruto inkomsten uit arbeid, waarbij een periodieke verhoging van het inkomen
      buiten beschouwing wordt gelaten.

      6 De compensatie, bedoeld in het vijfde lid, is een toelage ter hoogte van 70% van het inkomensverlies voor de
      duur van vijf jaar, gerekend vanaf de dag waarop de mate van arbeidsongeschiktheid van de gewezen ambtenaar is
      vastgesteld op minder dan 35%, maar niet voordat 104 weken na de eerste ziektedag zijn verstreken. Bij samenloop
      van de compensatie, bedoeld in het vijfde lid, met een uitkering krachtens de [Werkloosheidswet][ref4] of het
      [Besluit bovenwettelijke werkloosheidsuitkering politie][ref5], wordt de compensatie verminderd met het bedrag van
      de uitkering krachtens de Werkloosheidwet of het Besluit bovenwettelijke werkloosheidsuitkering politie.

      7 De gewezen ambtenaar aan wie eervol ontslag is verleend op grond van
      [artikel 88d van het Besluit algemene rechtspositie politie][ref6] met het oog op een uitkering als bedoeld in
      [artikel 29d][ref7] of een pensioen als bedoeld in hoofdstuk 5 van het Pensioenreglement, voor zover dat pensioen
      is ingegaan voor de AOW-gerechtigde leeftijd, heeft tot uiterlijk de AOW-gerechtigde leeftijd slechts aanspraak op
      de doorbetaling van zijn laatstelijk genoten bezoldiging voor zover deze tezamen met de uitkering en zijn pensioen
      op grond van hoofdstuk 5 van het Pensioenreglement de laatstelijk genoten bezoldiging niet overschrijdt.

      8 Het bedrag van de laatstelijk genoten bezoldiging, bedoeld in de voorgaande leden, wordt in voorkomende gevallen
      gewijzigd overeenkomstig een algemene salarismaatregel in de sector politie.

      9 De in het eerste lid, onderdelen b en c, en het tweede lid, onderdeel b, bedoelde vermindering van het percentage
      van de bezoldiging is niet van toepassing indien de ziekte in overwegende mate beroepsgerelateerd is op het moment
      van de melding van gezondheidsklachten, bedoeld in [artikel 53a, eerste lid, van het Besluit algemene rechtspositie
      politie](onbekend).

      10 Voor de gewezen ambtenaar die een uitkering ontvangt als bedoeld in [artikel 29d][ref8] of een pensioen
      ontvangt als bedoeld in hoofdstuk 5 van het Pensioenreglement, voor zover dat is ingegaan voor de AOW-
      gerechtigde leeftijd, wordt tevens onder nieuwe structurele inkomsten uit arbeid als bedoeld in het vijfde
      lid verstaan de bezoldiging nadat de arbeidsongeschiktheid is vastgesteld op minder dan 35%, bedoeld in
      [artikel 38, tiende lid][ref9], die direct voorafgaand aan het ontslag in aanmerking werd genomen bij de
      berekening van de in dat artikellid bedoelde inkomensverlies.


