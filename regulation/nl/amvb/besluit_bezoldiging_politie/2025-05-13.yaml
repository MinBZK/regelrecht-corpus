  - number: 9a
    text: |-
      1 De ambtenaar die het maximum van de schaal behorende bij een functie met 24 of meer OVW punten, zoals opgenomen
      in [bijlage VII][ref1], heeft bereikt, wordt, met behoud van deze schaal en met inachtneming van het tweede lid,
      extra periodieken ter hoogte van de in de volgende salarisschaal opgenomen periodieken toegekend.

      2 Het toekennen van de periodieken bedoeld in het eerste lid, gebeurt overeenkomstig [artikel 9][ref2].

      3 Uitgezonderd van het eerste lid is:

      a. de ambtenaar die een functie bekleedt welke wordt gewaardeerd met schaal 15 of hoger;

      b. de ambtenaar die leiding geeft aan een onderdeel of team waarin hoofdzakelijk ambtenaren werken met een functie
      met minder dan 24 OVW punten, of

      c. de ambtenaar die recht heeft op Flexibel Pensioen en Uittreden.

      4 Het verkrijgen van de periodieken als bedoeld in het eerste lid heeft geen gevolgen voor de aan de functie
      gekoppelde rang.

      5 De periodieken die op grond van dit artikel worden verkregen vervallen bij een vrijwillige overstap naar een
      functie met minder dan 24 OVW punten.

      6 In afwijking van het eerste en tweede lid komt de ambtenaar met een functie waarvoor salarisschaal 14 of lager
      geldt niet in aanmerking voor trede 15 van salarisschaal 15.


      [ref1]: https://wetten.overheid.nl/BWBR0006517
