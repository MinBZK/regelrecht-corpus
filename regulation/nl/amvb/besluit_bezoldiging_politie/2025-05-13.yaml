  - number: 1a
    text: |-
      Voor de toepassing van dit besluit wordt onder de volgende opleidingsniveau verstaan:

      a. niveau 2 of 3: niveau 2 of 3 als bedoeld in
      [artikel 7.2.2, derde lid, van de Wet educatie en beroepsonderwijs][ref1];

      b. niveau 4: niveau 4 als bedoeld in [artikel 7.2.2, derde lid, van de Wet educatie en beroepsonderwijs][ref2];

      c. niveau 6 of 7: het niveau dat op grond van
      [artikel 7.10a van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3] recht geeft op het voeren van
      de graad Bachelor of Master.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.2
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7.10a
