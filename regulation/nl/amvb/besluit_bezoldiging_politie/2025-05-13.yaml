  - number: '50'
    text: |-
      1 De [artikelen 6, eerste tot en met vierde lid en zesde tot en met dertiende lid][ref1], en
      [8 tot en met 10][ref2], [15 tot en met 17][ref3], [20][ref4], [27 tot en met 29][ref5], [30][ref6]
      en [37a tot en met 37c][ref7] zijn niet van toepassing op de aspirant met dien verstande dat de
      [artikelen 27][ref8], [27a][ref9], [27b][ref10] en [28][ref11] wel van toepassing zijn op de aspirant gedurende
      de beroepspraktijkvorming.

      2 Op de ambtenaar in opleiding zijn niet van toepassing:

      a. de [artikelen 9 tot en met 10][ref12], voor zover de betrokkene direct voorafgaand aan de aanstelling als
      ambtenaar in opleiding geen ambtenaar in de zin van dit besluit was;

      b. [artikel 12c][ref13], voor zover de betrokkene voorafgaand aan de aanstelling als ambtenaar in opleiding geen
      aanspraak had op de in dit artikel bedoelde toelage;

      c. de [artikelen 6, eerste tot en met vierde en zesde tot en met dertiende lid][ref14], [15 tot en met 17][ref15],
      [20][ref16], [27 tot en met 30][ref17] en [37a tot en met 37c][ref18].

      3 In afwijking van het tweede lid, onderdeel c, zijn de [artikelen 27][ref19], [27a][ref20], [27b][ref21] en
      [28][ref22] wel van toepassing op de ambtenaar in opleiding gedurende de beroepspraktijkvorming.

      4 De [artikelen 6 tot en met 30][ref23] en [37a tot en met 37c][ref24] zijn niet van toepassing op de
      vakantiewerker.


