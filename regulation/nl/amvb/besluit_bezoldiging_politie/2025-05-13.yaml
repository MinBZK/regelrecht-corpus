  - number: '9'
    text: |-
      1 Het salaris van de ambtenaar wordt verhoogd tot het naasthogere bedrag in de schaal, indien deze naar het oordeel
      van het bevoegd gezag de functie naar behoren vervult.

      2 Het salaris van de ambtenaar kan worden verhoogd tot een hoger bedrag in de schaal, indien deze naar het oordeel
      van het bevoegd gezag de functie zeer goed of uitstekend vervult.

      3 Vervult de ambtenaar de functie naar het oordeel van het bevoegd gezag niet naar behoren, dan blijft de in het
      eerste lid bedoelde salarisverhoging achterwege.

      4 De in het eerste en tweede lid bedoelde salarisverhoging wordt voor de eerste maal toegekend met ingang van de
      eerste dag van de maand waarin sinds de aanstelling een jaar is verstreken en nadien telkens na één jaar, tot het
      maximumsalaris van de geldende salarisschaal is bereikt.

      5 Het tijdstip waarop ingevolge het vierde lid een salarisverhoging wordt toegekend, kan worden vervroegd ingeval
      daartoe naar het oordeel van het bevoegd gezag aanleiding bestaat.

      6 Het oordeel van het bevoegd gezag over het vervullen van de functie door de ambtenaar,
      bedoeld in het tweede of derde lid, is gebaseerd op een bekrachtigde beoordeling als bedoeld in
      [artikel 71, tweede en vijfde lid, van het Besluit algemene rechtspositie politie][ref1], die betrekking heeft op
      een tijdvak dat eindigt binnen een jaar vóór de datum van het oordeel, bedoeld in het tweede of derde lid.

      7 Voor de ambtenaar die na het succesvol afronden van de opleiding is aangesteld met toepassing van
      [artikel 3, achtste lid][ref2], of [artikel 3a, zevende lid][ref3], vindt de eerstvolgende salarisverhoging in
      afwijking van het vierde lid plaats een jaar na de laatste salarisverhoging, bedoeld in artikel 3, derde, vierde of
      vijfde lid, of artikel 3a, vijfde of zesde lid.

      8 In afwijking van het zevende lid vindt voor de ambtenaar die tijdens de opleiding was ingeschaald op grond
      van [artikel 3a, derde lid, onderdeel b][ref4], de eerstvolgende salarisverhoging plaats in de eerstvolgende
      kalendermaand na het voltooien van de opleiding waarin een geheel aantal jaren is verstreken sinds de aspirant het
      maximum salarisbedrag op grond van artikel 3a, zesde lid, onderdeel b, heeft bereikt.


