  - number: 37c
    text: |-
      1 De ambtenaar die structureel gemiddeld minimaal één dag in de week conform een vastgesteld dagrooster minimaal
      vier uren arbeid vanaf het woonadres verricht, heeft aanspraak op een vergoeding van maximaal € 950,– voor het
      inrichten van een ergonomische thuiswerkplek.

      2 De vergoeding wordt toegekend op declaratiebasis op een door het bevoegd gezag voorgeschreven wijze.

      3 Het in het eerste lid genoemde bedrag is beschikbaar voor een periode van 10 jaar en mag in delen worden
      gedeclareerd. De termijn van 10 jaar start na indiening van de eerste declaratie.

      4 Indien het in het eerste lid genoemde bedrag niet volledig is gebruikt binnen de in het vorige lid genoemde
      termijn, vervalt het resterende deel.

      5 Geen aanspraak op een vergoeding bestaat indien de declaratie van een in een kalendermaand gedane uitgave niet
      binnen drie maanden na die kalendermaand bij het bevoegd gezag is ingediend, tenzij het overschrijden van de
      termijn niet aan de ambtenaar verwijtbaar is.

      6 Indien de ambtenaar binnen 6 maanden nadat een declaratie is uitbetaald uit dienst gaat, kan het bevoegd gezag de
      betreffende kosten terugvorderen.

      7 Het bevoegd gezag kan ter uitvoering van dit artikel nadere regels stellen.
