  - number: 39a
    text: |-
      1 De gewezen ambtenaar die waarschijnlijk zal bevallen binnen vier maanden na de datum van ingang van haar ontslag,
      ontvangt haar laatstelijk genoten bezoldiging gedurende de periode die aanvangt op de 41e dag voorafgaande aan de
      vermoedelijke datum van bevalling en eindigt op de 70e dag na de datum waarop de bevalling heeft plaatsgevonden.

      2 De periode, bedoeld in het eerste lid, wordt verlengd tot zestien weken, indien die periode door een voortijdige
      bevalling minder dan zestien weken heeft bedragen.

      3 De gewezen ambtenaar van wie de bevalling niet wordt verwacht binnen vier maanden na de datum van ingang van
      haar ontslag, maar die niettemin binnen die termijn bevalt, ontvangt haar laatstelijk genoten bezoldiging gedurende
      de periode die aanvangt op de datum van bevalling en eindigt op de 70e dag na de datum waarop de bevalling heeft
      plaatsgevonden.

      4 Voor zolang de gewezen ambtenaar na beëindiging van de haar ingevolge het eerste of derde lid toekomende
      uitkering nog wegens ziekte ongeschikt is tot werken of binnen een maand na deze beëindiging ongeschikt wordt tot
      werken, heeft zij gedurende een tijdvak van 52 weken recht op de doorbetaling van de bezoldiging overeenkomstig
      [artikel 39][ref1]. De termijn van 52 weken loopt vanaf de eerste dag na de bevalling.

      5 Ongeschikt tot werken, in de zin van het vierde lid is de gewezen ambtenaar die als rechtstreeks en objectief
      medisch vast te stellen gevolg van ziekte of gebreken geheel of gedeeltelijk niet in staat is om een naar aard en
      omvang soortgelijke betrekking als zij vervulde, te vervullen.

      6 [Artikel 55, vijfde en zesde lid, van het Besluit algemene rechtspositie politie][ref2] en
      [artikel 41, tweede lid][ref3], van dit besluit zijn van overeenkomstige toepassing.

      7 Het bedrag van de laatstelijk genoten bezoldiging, bedoeld in de voorgaande leden, wordt in voorkomende gevallen
      gewijzigd overeenkomstig een algemene salarismaatregel in de sector politie.


