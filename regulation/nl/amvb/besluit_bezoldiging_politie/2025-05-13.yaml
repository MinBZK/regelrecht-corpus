    text: |-
      1 Aan de ambtenaar met een op 1 januari van het desbetreffende kalenderjaar pensioengevend
      inkomen dat zonder het bepaalde in hoofdstuk 7.4 van het Pensioenreglement het bedrag, bedoeld in
      [artikel 18ga, eerste lid, van de Wet op de Loonbelasting 1964][ref1] overschrijdt, wordt maandelijks een bruto
      uitkering verstrekt.

      2 De bruto uitkering bedraagt een twaalfde deel van de in het eerste lid bedoelde overschrijding, vermenigvuldigd
      met het voor dat kalenderjaar geldende percentage in de premie voor ouderdoms- en nabestaandenpensioen, genoemd in
      hoofdstuk 7.5 van het Pensioenreglement, voor zover het betreft het werkgeversdeel.


