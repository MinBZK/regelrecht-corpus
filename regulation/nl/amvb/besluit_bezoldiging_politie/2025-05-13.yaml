  - number: 29c
    text: |-
      1 Dit artikel is niet van toepassing op de ambtenaar en de gewezen ambtenaar bij wie door het Uitvoeringsinstituut
      werknemersverzekeringen, op grond van:

      a. [artikel 18 van de Wet op de arbeidsongeschiktheidsverzekering][ref1] een mate van arbeidsongeschiktheid van 80%
      of meer is vastgesteld;

      b. [artikel 4][ref2] dan wel [artikel 5 van de WIA][ref3], is vastgesteld dat hij slechts in staat is met arbeid
      ten hoogste 20% te verdienen van het maatmaninkomen, bedoeld in [artikel 1 van de WIA][ref4], per uur.

      2 Een ambtenaar heeft aanspraak op de uitkering, bedoeld in [artikel 29d][ref5], indien hij uiterlijk op
      31 december 2025 voldoet aan de voorwaarden genoemd in het derde lid en hij

      a. op 1 januari 2021 ten minste de leeftijd van 65 jaar heeft bereikt, of

      b. de leeftijd van 65 jaar bereikt in de periode van 1 januari 2021 tot en met 31 december 2025, vanaf het moment
      dat hij die leeftijd bereikt.

      3 De ambtenaar, bedoeld in het tweede lid, is ten minste 35 jaren in politiedienst werkzaam waarvan in totaal ten
      minste 25 jaren:

      a. aangesteld als ambtenaar voor de uitvoering van de politietaak, of

      b. aangesteld als ambtenaar voor de uitvoering van technische, administratieve en andere
      taken ten dienste van de politie in een functie in het domein uitvoering, bedoeld in
      [artikel 3, eerste lid, van de Regeling vaststelling LFNP][ref6], met uitzondering van de functie Chef Vlieger.

      4 Bij de berekening van de 25 jaren, bedoeld in het derde lid, blijft het eerste jaar dat de ambtenaar was
      aangesteld als aspirant buiten beschouwing.

      5 Voor de toepassing van het derde lid, onderdeel b, wordt onder functie mede verstaan een functie waarvan het
      aannemelijk is dat het een voorloper is van een in dat onderdeel bedoelde functie.

      6 Als diensttijd in politiedienst doorgebracht worden mede aangemerkt die jaren waarin de ambtenaar aantoonbaar:

      a. was aangesteld als algemeen of buitengewoon opsporingsambtenaar van de Koninklijke Marechaussee;

      b. was aangesteld als buitengewoon opsporingsambtenaar van de Douane;

      c. was aangesteld als algemeen of bijzonder opsporingsambtenaar van de Fiscale Inlichtingen- en Opsporingsdienst-
      ECD of de Sociale Inlichtingen en Opsporingsdienst;

      d. als algemeen of buitengewoon opsporingsambtenaar in dienst was van het Korps Spoorwegpolitie van de
      Nederlandse Spoorwegen voor zover het principeakkoord van 14 oktober 1999, gesloten tussen de vakorganisaties,
      FNV-bondgenoten, FSV, CNV-Bedrijvenbond, VHS en het Ministerie van Justitie, het Ministerie van Binnenlandse
      Zaken en Koninkrijksrelaties en de Nederlandse Spoorwegen, op de ambtenaar van toepassing was en deze een AFUP-
      garantieregeling toegekend heeft gekregen voor de jaren dat hij bij de spoorwegpolitie heeft gewerkt;

      e. was aangesteld als onbezoldigd algemeen of bijzonder opsporingsambtenaar van het Korps Rijkspolitie, werkzaam
      voor een krachtens de [Wet op de weerkorpsen][ref7] toegestane particuliere beveiligingsorganisaties van de
      luchthaven Schiphol in de periode van 15 februari 1974 tot en met 31 december 1992;

      f. was aangesteld als ambtenaar van politie in dienst bij de politie in Suriname tot en met 24 november 1975; of

      g. anderszins een schriftelijk besluit kan overleggen waaruit volgt dat de tijd die deze ambtenaar in een bepaalde
      functie was aangesteld door het bevoegd gezag voor inwerkingtreding van de [Politiewet 2012][ref8] is aangemerkt
      als politiedienstjaar.


