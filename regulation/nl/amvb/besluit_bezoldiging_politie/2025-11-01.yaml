  - number: '51'
    text: Dit besluit treedt in werking met ingang van 1 april 1994.
    url: https://wetten.overheid.nl/BWBR0006517/2025-11-01#Artikel51
  - number: '52'
    text: 'Dit besluit wordt aangehaald als: Besluit bezoldiging politie.'
