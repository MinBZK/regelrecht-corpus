        hoofdstuk: '8'
      - id: ref5
        bwb_id: BWBR0006517
        artikel: 37a
        hoofdstuk: '9'
  - number: '50.3'
    text: |-
      In afwijking van het tweede lid, onderdeel c, zijn de [artikelen 27][ref1], [27a][ref2], [27b][ref3] en [28][ref4]
      wel van toepassing op de ambtenaar in opleiding gedurende de beroepspraktijkvorming.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel27a
      [ref3]: https://wetten.overheid.nl/BWBR0006517#Artikel27b
      [ref4]: https://wetten.overheid.nl/BWBR0006517#Artikel28
    url: https://wetten.overheid.nl/BWBR0006517/2025-11-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '27'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0006517
        artikel: 27a
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0006517
        artikel: 27b
        hoofdstuk: '8'
      - id: ref4
        bwb_id: BWBR0006517
        artikel: '28'
        hoofdstuk: '8'
  - number: '50.4'
    text: |-
      De [artikelen 6 tot en met 30][ref1] en [37a tot en met 37c][ref2] zijn niet van toepassing op de vakantiewerker.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel37a
    url: https://wetten.overheid.nl/BWBR0006517/2025-11-01#Artikel50
    references:
