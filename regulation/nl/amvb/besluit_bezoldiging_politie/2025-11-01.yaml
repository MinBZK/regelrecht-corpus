  - number: '50.2'
    text: 'Op de ambtenaar in opleiding zijn niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0006517/2025-11-01#Artikel50
  - number: 50.2.a
    text: |-
      de [artikelen 9 tot en met 10][ref1], voor zover de betrokkene direct voorafgaand aan de aanstelling als ambtenaar
      in opleiding geen ambtenaar in de zin van dit besluit was;


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel9
    url: https://wetten.overheid.nl/BWBR0006517/2025-11-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '9'
        hoofdstuk: '2'
  - number: 50.2.b
    text: |-
      [artikel 12c][ref1], voor zover de betrokkene voorafgaand aan de aanstelling als ambtenaar in opleiding geen
      aanspraak had op de in dit artikel bedoelde toelage;


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel12c
    url: https://wetten.overheid.nl/BWBR0006517/2025-11-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: 12c
        hoofdstuk: 3b
  - number: 50.2.c
    text: |-
      de [artikelen 6, eerste tot en met vierde en zesde tot en met dertiende lid][ref1], [15 tot en met 17][ref2],
      [20][ref3], [27 tot en met 30][ref4] en [37a tot en met 37c][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0006517#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0006517#Artikel27
      [ref5]: https://wetten.overheid.nl/BWBR0006517#Artikel37a
    url: https://wetten.overheid.nl/BWBR0006517/2025-11-01#Artikel50
    references:
