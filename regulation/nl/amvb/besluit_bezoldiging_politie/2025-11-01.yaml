  - number: 50a.2
    text: |-
      Het bedrag genoemd in [bijlage IV][ref1] van dit besluit kan bij ministeriële regeling worden gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006517
    url: https://wetten.overheid.nl/BWBR0006517/2025-11-01#Artikel50a
    references:
