      [ref10]: https://wetten.overheid.nl/BWBR0006517#Artikel27b
      [ref11]: https://wetten.overheid.nl/BWBR0006517#Artikel28
    url: https://wetten.overheid.nl/BWBR0006517/2025-11-01#Artikel50
