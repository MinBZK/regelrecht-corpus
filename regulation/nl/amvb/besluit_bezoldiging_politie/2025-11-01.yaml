        bwb_id: BWBR0006517
        artikel: '6'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0006517
        artikel: 37a
        hoofdstuk: '9'
  - number: 50a.1
    text: |-
      De [bijlagen][ref1], behorende bij dit besluit, met uitzondering van [bijlage IV][ref2], alsmede de
      bedragen, genoemd in de [artikelen 3][ref3], [3c][ref4], [14][ref5], [18][ref6], [23][ref7], [25b][ref8],
      [26b, tweede lid][ref9], [27][ref10], [29][ref11] en [29a][ref12] worden bij ministeriële regeling gewijzigd
      overeenkomstig een algemene salarismaatregel in de sector politie.


      [ref1]: https://wetten.overheid.nl/BWBR0006517
      [ref2]: https://wetten.overheid.nl/BWBR0006517
      [ref3]: https://wetten.overheid.nl/BWBR0006517#Artikel3
