preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 21 november 1997, nr. DGG/J-97008790, Directoraat-
    Generaal Goederenvervoer, Stafafdeling Wetgeving en Juridische Zaken, gedaan mede namens Onze Minister van
    Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;


    Gelet op de artikelen 1, onder e, 5, 10 en 39 van de Wet voorkoming verontreiniging door schepen;


    De Raad van State gehoord (advies van 12 december 1997, nr. W09.97.0750);


    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 2 februari 1998, nr. DGG/J-98000097,
    Directoraat-Generaal Goederenvervoer, Stafafdeling Wetgeving en Juridische Zaken, uitgebracht mede namens Onze
    Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009371/1998-03-04#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. Handboek Gevaarlijke Stoffen: het Handboek Gevaarlijke Stoffen, bedoeld in
      [artikel 130e van het Schepenbesluit 1965][ref1];

      b. schadelijke stof in verpakte vorm: elke stof die als schadelijk is aangemerkt en is verpakt op omhullende wijze,
      genoemd bij of krachtens het Handboek Gevaarlijke Stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel130e
    url: https://wetten.overheid.nl/BWBR0009371/1998-03-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: 130e
  - number: '2'
    text: >-
      1 De bepalingen van dit besluit zijn van toepassing op schepen die over zee vervoeren:


      a. schadelijke stoffen in verpakte vorm;


      b. lege, niet gereinigde verpakkingen die eerder zijn gebruikt voor het vervoer van schadelijke stoffen in verpakte
      vorm, tenzij toereikende maatregelen zijn getroffen die verzekeren dat geen restanten zijn achtergebleven die
      schade kunnen toebrengen aan het mariene milieu.


      2 De bepalingen van dit besluit zijn niet van toepassing op schadelijke stoffen in verpakte vorm, bestemd voor
      eigen scheepsgebruik of behorend tot de eigen scheepsuitrusting.
    url: https://wetten.overheid.nl/BWBR0009371/1998-03-04#Artikel2
  - number: '3'
    text: >-
      De verpakking, gebruikt voor het vervoer van een schadelijke stof in verpakte vorm, is in overeenstemming met
      het daarvoor bepaalde bij of krachtens het Handboek Gevaarlijke Stoffen en is, rekening houdend met de specifieke
      inhoud, toereikend om schade aan het mariene milieu tot een minimum te beperken.
    url: https://wetten.overheid.nl/BWBR0009371/1998-03-04#Artikel3
  - number: '4'
    text: >-
      1 Verpakkingen van een schadelijke stof in verpakte vorm zijn duurzaam gemerkt met de juiste technische benaming
      van de stof waarbij handelsnamen niet als zodanig mogen worden gebruikt. De verpakkingen zijn bovendien op
      een duidelijk zichtbare plaats voorzien van een duurzaam aangehecht of opgedrukt merk of etiket waarmee wordt
      aangegeven dat de inhoud schadelijk is voor het mariene milieu.


      2 De aanduiding, bedoeld in het eerste lid, wordt aangevuld met het aan de stof toegekende identificatienummer van
      de Verenigde Naties voor zover van toepassing.


      3 Merken en etiketten zijn op een zodanige wijze aangebracht dat de aangegeven informatie nog herkenbaar is, nadat
      de verpakkingen ten minste drie maanden zijn ondergedompeld geweest in zeewater.


      4 Verpakkingen die kleine hoeveelheden van een schadelijke stof in verpakte vorm bevatten, zijn vrijgesteld van de
      bepalingen in dit artikel voorzover dat is bepaald bij of krachtens het Handboek Gevaarlijke Stoffen.
    url: https://wetten.overheid.nl/BWBR0009371/1998-03-04#Artikel4
  - number: '5'
    text: |-
      1 In alle bescheiden die betrekking hebben op het vervoer van een schadelijke stof in verpakte vorm wordt gebruikt:

      a. de juiste technische benaming van de stof, waarbij handelsnamen niet als zodanig mogen worden gebruikt;

      b. het identificatienummer van de Verenigde Naties voorzover van toepassing;

      c. de indeling in gevarenklassen, genoemd in [artikel 130 van het Schepenbesluit 1965][ref1];

      d. de hoeveelheden van die stoffen en, wanneer zij in transporttanks of vrachtcontainers worden vervoerd, de
      identificatiemerktekens daarvan.

      2 In alle bescheiden die betrekking hebben op het vervoer van een schadelijke stof in verpakte vorm wordt de
      schadelijke stof als zodanig aangemerkt door toevoeging van de woorden «marine pollutant».

      3 De ladingdocumenten, opgemaakt door degene die schadelijke stoffen aanbiedt voor vervoer per schip, gaan
      vergezeld van een ondertekend certificaat of een ondertekende verklaring waarin wordt vermeld dat de voor
      verscheping aangeboden goederen deugdelijk zijn verpakt, gemerkt en geëtiketteerd en zich in een deugdelijke staat
      voor vervoer bevinden teneinde het gevaar voor schade aan het mariene milieu tot een minimum te beperken.

      4 Elk schip dat een schadelijke stof in verpakte vorm vervoert, heeft een speciale lijst of manifest aan boord,
      waarin die stof en de plaats aan boord waar deze zich bevindt, worden omschreven. In plaats van zulk een speciale
      lijst of manifest mag een gedetailleerd stuwplan worden gebruikt waarin de plaats van stuwage van alle aan
      boord aanwezige schadelijke stoffen in verpakte vorm is aangegeven. Afschriften van de bescheiden worden door de
      exploitant of de agent van het schip aan de wal bewaard, totdat de stoffen zijn gelost. Ook worden afschriften van
      de bescheiden aan de bevoegde autoriteit afgegeven.

      5 Indien het schip beschikt over een speciale lijst of manifest, of een gedetailleerd stuwplan voor het vervoer van
      gevaarlijke stoffen als bedoeld in Bijlage XVII van het [Schepenbesluit 1965][ref2], mogen de bescheiden die zijn
      vereist overeenkomstig het bepaalde in dit artikel worden gecombineerd met die voor gevaarlijke stoffen. Indien
      deze bescheiden worden gecombineerd, wordt duidelijk onderscheid gemaakt tussen gevaarlijke stoffen en schadelijke
      stoffen in verpakte vorm.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0009371/1998-03-04#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '130'
      - id: ref2
        bwb_id: BWBR0002501
  - number: '6'
    text: >-
      Een schadelijke stof in verpakte vorm wordt op deugdelijke wijze gestuwd en vastgezet teneinde het gevaar voor
      schade aan het mariene milieu tot een minimum te beperken, zonder dat daarbij de veiligheid van het schip en de
      opvarenden in het geding komt.
    url: https://wetten.overheid.nl/BWBR0009371/1998-03-04#Artikel6
  - number: '7'
    text: >-
      Met inachtneming van de door de Internationale Maritieme Organisatie aanvaarde aanbevelingen kan bij ministeriële
      regeling worden bepaald dat de hoeveelheid schadelijke stoffen in verpakte vorm aan boord van een schip wordt
      beperkt. Daarbij wordt rekening gehouden met de aard, de constructie en de uitrusting van het schip, alsmede met de
      verpakking en de aard van de schadelijke stof.
    url: https://wetten.overheid.nl/BWBR0009371/1998-03-04#Artikel7
  - number: '8'
    text: >-
      1 Een schadelijke stof in verpakte vorm mag niet worden geloosd, tenzij dit noodzakelijk is om de veiligheid van
      het schip te verzekeren of mensenlevens op zee te redden.


      2 Indien een schadelijke stof in verpakte vorm vrijkomt door lekkage worden op grond van de eigenschappen van de
      stof passende maatregelen genomen om lozing van de stof te voorkomen. De uitvoering van deze maatregelen is zodanig
      dat de veiligheid van het schip en de opvarenden niet in het geding komt.
    url: https://wetten.overheid.nl/BWBR0009371/1998-03-04#Artikel8
  - number: '9'
    text: >-
      Ter uitvoering van internationale afspraken en besluiten van volkenrechtelijke organisaties over door met schepen
      vervoerde schadelijke stoffen in verpakte vorm kunnen bij ministeriële regeling nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009371/1998-03-04#Artikel9
  - number: '10'
    text: >-
      Het Besluit voorkoming verontreiniging door met schepen vervoerde schadelijke stoffen in verpakte vorm (Stb. 1995,
      40) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009371/1998-03-04#Artikel10
  - number: '11'
    text: >-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0009371/1998-03-04#Artikel11
  - number: '12'
    text: >-
      Dit besluit wordt aangehaald als: Besluit voorkoming verontreiniging door met schepen vervoerde schadelijke stoffen
      in verpakte vorm.
    url: https://wetten.overheid.nl/BWBR0009371/1998-03-04#Artikel12
