preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Verkeer en Waterstaat, gedaan mede namens Onze Minister van
    Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 5 oktober 1988, nr. S/J 31.705/88, Directoraat-Generaal
    Scheepvaart en Maritieme Zaken;


    Overwegende dat het noodzakelijk is uitvoering te geven aan de bepalingen van Protocol I van het Internationaal
    Verdrag ter voorkoming van verontreiniging door schepen met Protocollen en Bijlagen met Aanhangsels (Trb. 1975, 147
    en 1978, 187), zoals gewijzigd en aangevuld bij het op 17 februari 1978 te Londen tot stand gekomen Protocol bij
    dat Verdrag met Bijlage en Aanhangsels (Trb. 1978, 188 en 1986, 121);


    Gelet op de artikelen 12 en 38 van de Wet voorkoming verontreiniging door schepen (Stb. 1983, 683);


    De Raad van State gehoord (advies van 9 december 1988, nr. W09.88.0561);


    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat, uitgebracht mede namens Onze Minister van
    Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 22 december 1988, nr. S/J 32.293/88, Directoraat-
    Generaal Scheepvaart en Maritieme Zaken;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004472/1998-11-04#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop rustende bepalingen wordt verstaan onder:

      a. olie: minerale olie in elke vorm, daaronder begrepen ruwe olie, stookolie, oliedrab, olieafval en
      geraffineerde produkten, andere dan die petrochemische produkten welke zijn begrepen onder de bepalingen van het
      [Besluit voorkoming verontreiniging door met schepen in bulk vervoerde schadelijke vloeistoffen][ref1] (*Stb.*
      1988, 112);

      b. schadelijke vloeistof: een vloeistof als bedoeld in artikel 1, onder *f*, van het
      [Besluit voorkoming verontreiniging door met schepen in bulk vervoerde schadelijke vloeistoffen][ref2];

      c. schadelijke stof in verpakte vorm: elke stof welke als schadelijk is aangemerkt in, en verpakt op omhullende
      wijze als aangegeven in het Handboek Gevaarlijke Stoffen, bedoeld in [artikel 130][ref3] (*Stb.* 367).


      [ref1]: https://wetten.overheid.nl/BWBR0004306
      [ref2]: https://wetten.overheid.nl/BWBR0004306
      [ref3]: https://wetten.overheid.nl/BWBR0002501#Artikel130e
    url: https://wetten.overheid.nl/BWBR0004472/1998-11-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004306
      - id: ref2
        bwb_id: BWBR0004306
      - id: ref3
        bwb_id: BWBR0002501
        artikel: 130e
  - number: '2'
    text: >-
      De kapitein is verplicht een voorval waarbij het schip is betrokken onverwijld te melden, wanneer dit voorval met
      zich meebrengt:


      a. dat olie of schadelijke vloeistoffen boven de toegestane lozingshoeveelheden in zee worden geloosd of dreigen te
      worden geloosd, ongeacht de reden daarvan, daaronder begrepen lozingen die noodzakelijk zijn om de veiligheid van
      het schip zeker te stellen of mensenlevens op zee te redden;


      b. dat schadelijke stoffen in verpakte vorm in zee worden geloosd of dreigen te worden geloosd;


      c. dat er ten gevolge van de bedrijfsvoering aan boord van het schip olie of schadelijke vloeistoffen in zee
      worden geloosd, die de toegestane lozingshoeveelheden van die stoffen, dan wel de lozingssnelheden geldend voor die
      stoffen, te boven gaan; of


      d. dat er schade, een storing of een defect ontstaat aan een schip met een lengte van vijftien meter of meer en
      waarbij:


      1°. de veiligheid van het schip in gevaar wordt gebracht als gevolg van onder meer een aanvaring, het aan de grond
      lopen, brand, een explosie, schade aan de constructie, het binnendringen van water en het schuiven van lading; of


      2°. de veiligheid van de navigatie in gevaar wordt gebracht als gevolg van onder meer een storing van of defect aan
      het roer, de voortstuwingsmachines, de generatoren en de essentiële navigatiehulpsystemen aan boord.
    url: https://wetten.overheid.nl/BWBR0004472/1998-11-04#Artikel2
  - number: '3'
    text: |-
      De melding, bedoeld in [artikel 2][ref1], dient zo uitgebreid mogelijk te zijn en dient, met inachtneming van door
      Onze Minister vast te stellen regels in ieder geval te bevatten:

      a. de namen en de roepnamen van de betrokken schepen;

      b. tijd, soort en plaats van het voorval;

      c. soort en hoeveelheid van de olie, van de schadelijke vloeistof dan wel van de schadelijke stof in verpakte vorm,
      die in zee is geloosd of dreigt te worden geloosd; en

      d. de genomen maatregelen met betrekking tot assistentie en berging.


      [ref1]: https://wetten.overheid.nl/BWBR0004472#Artikel2
    url: https://wetten.overheid.nl/BWBR0004472/1998-11-04#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004472
        artikel: '2'
  - number: '4'
    text: |-
      De kapitein dient:

      1. de melding, bedoeld in [artikel 2][ref1], waar nodig aan te vullen en informatie te verschaffen over de verdere
      ontwikkelingen met inachtneming van door Onze Minister vast te stellen regels; en

      2. zo goed mogelijk te voldoen aan verzoeken van de betrokken kuststaten om aanvullende informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0004472#Artikel2
    url: https://wetten.overheid.nl/BWBR0004472/1998-11-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004472
        artikel: '2'
  - number: '5'
    text: >-
      Een melding dient met de hoogst mogelijke prioriteit te worden gedaan aan de dichtstbijzijnde kuststaat op een door
      Onze Minister vast te stellen wijze.
    url: https://wetten.overheid.nl/BWBR0004472/1998-11-04#Artikel5
  - number: '6'
    text: >-
      Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin het
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0004472/1998-11-04#Artikel6
  - number: '7'
    text: 'Dit besluit kan worden aangehaald als: Besluit melding voorvallen van verontreiniging door schepen.'
    url: https://wetten.overheid.nl/BWBR0004472/1998-11-04#Artikel7
