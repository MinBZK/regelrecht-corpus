---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: landbouwkwaliteitsbesluit_zuivelproducten
regulatory_layer: AMVB
publication_date: '2007-09-27'
valid_from: '2011-07-01'
bwb_id: BWBR0009770
url: https://wetten.overheid.nl/BWBR0009770/2011-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuurbeheer en Visserij van 23 juli 1997, nr. J. 977662, Directie
    Juridische Zaken, gedaan mede namens de Staatssecretaris van Volksgezondheid, Welzijn en Sport en Onze Minister van
    Economische Zaken;

    Gelet op de artikelen 2, 3, 7, 8, 9 en 12 van de Landbouwkwaliteitswet;

    De Raad van State gehoord (advies van 7 oktober 1997, nr. W11.97.0516);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuurbeheer en Visserij van 25 juni 1998, nr. J. 984971,
    Directie Juridische Zaken, uitgebracht mede namens de Staatssecretaris van Volksgezondheid, Welzijn en Sport en
    Onze Minister van Economische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel1
  - number: 1.1.a
    text: |-
      wet: [Landbouwkwaliteitswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002755
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002755
  - number: 1.1.b
    text: 'COKZ: Stichting Centraal Orgaan voor Kwaliteitsaangelegenheden in de Zuivel;'
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel1
  - number: 1.1.c
    text: 'zuivelproduct:'
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel1
  - number: 1.1.c.1e
    text: |-
      een product dat uitsluitend is verkregen uit melk, met dien verstande dat stoffen die voor de bereiding
      ervan noodzakelijk zijn, mogen worden toegevoegd, mits deze stoffen niet worden gebruikt voor de volledige of
      gedeeltelijke vervanging van één van de bestanddelen van melk, en
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel1
  - number: 1.1.c.2e
    text: |-
      een product dat is samengesteld uit melk, dat wil zeggen een product waarvan geen enkel element in de plaats
      komt van een melkbestanddeel of bedoeld is om daarvoor in de plaats te komen en waarvan de melk een essentieel
      bestanddeel is, hetzij door de hoeveelheid, hetzij omdat het effect kenmerkend is voor deze producten;
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel1
  - number: 1.1.d
    text: |-
      melk: het door het melken van één of meer koeien, geiten, schapen of buffelkoeien verkregen product, zonder dat
      daaraan stoffen worden toegevoegd of onttrokken;
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel1
  - number: 1.1.e
    text: |-
      kaas: het product dat wordt verkregen door stremming van melk, waaraan al dan niet melkbestanddelen zijn toegevoegd
      of onttrokken, de verwijdering van wei en de rijping tot voor de consumptie gereed product;
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel1
  - number: 1.1.f
    text: |-
      boerenkaas: kaas, waarin slechts op een veehouderijbedrijf gewonnen melk, al dan niet aangevuld met een ten hoogste
      gelijke hoeveelheid melk rechtstreeks afkomstig van en gewonnen op ten hoogste twee andere veehouderijbedrijven,
      op dat bedrijf wordt verwerkt en waarvan het woord «boeren» deel uitmaakt van de aanduiding, vermelding of
      voorstelling.
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel1
  - number: '1.2'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt onder bereiden mede verstaan: de door Onze Minister bij
      de in [artikel 2, tweede lid][ref1], bedoelde regels aangewezen vormen van behandeling van zuivelproducten of van
      bepaalde zuivelproducten, die de kwaliteit van deze producten in belangrijke mate kunnen beïnvloeden.


      [ref1]: https://wetten.overheid.nl/BWBR0009770#Artikel2
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009770
        artikel: '2'
  - number: '2.1'
    text: Onze Minister kan voor een zuivelproduct bij ministeriële regeling merken, tekenen of bewijsstukken vaststellen.
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel2
  - number: '2.2'
    text: |-
      Onze Minister kan bij ministeriële regeling eisen stellen met betrekking tot de kwaliteit van een zuivelproduct,
      waarvoor merken, tekenen of bewijsstukken als bedoeld in het eerste lid zijn vastgesteld. Deze eisen ten aanzien
      van het product kunnen betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel2
  - number: 2.2.a
    text: de inrichting en het gebruik van bedrijfsgebouwen en vervoermiddelen;
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel2
  - number: 2.2.b
    text: het gebruik en verbruik van grondstoffen, hulpstoffen en toevoegingen;
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel2
  - number: 2.2.c
    text: de be- of verwerkingswijze;
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel2
  - number: 2.2.d
    text: het gebruik van machines, werktuigen en gereedschappen;
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel2
  - number: 2.2.e
    text: de hoedanigheid en de verzorging;
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel2
  - number: 2.2.f
    text: de vorm, afwerking, maat en gewicht;
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel2
  - number: 2.2.g
    text: de aanduiding, de verpakking en de oorsprong;
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel2
  - number: 2.2.h
    text: de hoedanigheid en het gebruik van verpakkingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel2
  - number: '3'
    text: |-
      Het is verboden een zuivelproduct dat voorzien is of bestemd is te worden voorzien van merken, tekenen of
      bewijsstukken als bedoeld in [artikel 2, eerste lid][ref1], te bereiden of te verhandelen, tenzij het voldoet aan
      de bij of krachtens dit besluit gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009770#Artikel2
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009770
        artikel: '2'
  - number: '4'
    text: |-
      Een zuivelproduct, waarvoor een merk, teken of bewijsstuk als bedoeld in [artikel 2, eerste lid][ref1], wordt
      gebruikt, is onderworpen aan een keuring volgens door Onze Minister bij de ministeriële regeling te stellen regels,
      om vast te stellen of het product voldoet aan de bij of krachtens dit besluit gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009770#Artikel2
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009770
        artikel: '2'
  - number: '5.1'
    text: |-
      Onze Minister kan ten behoeve van de keuring bij ministeriële regeling regels stellen inzake de methoden van
      monsterneming en onderzoek.
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel5
  - number: '5.2'
    text: |-
      Onze Minister kan bij de in het eerste lid bedoelde regeling bepalen dat methoden van monsterneming en onderzoek
      als bedoeld in het eerste lid worden vastgesteld door een door hem aan te wijzen autoriteit.
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel5
  - number: '6'
    text: |-
      Onze Minister kan bij ministeriële regeling regels stellen over het vervaardigen, voorhanden en in voorraad hebben,
      het afleveren en gebruiken van de in [artikel 2, eerste lid][ref1], bedoelde merken, tekenen en bewijsstukken.


      [ref1]: https://wetten.overheid.nl/BWBR0009770#Artikel2
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009770
        artikel: '2'
  - number: '7'
    text: |-
      Het is verboden merken, tekenen en bewijsstukken als bedoeld in [artikel 2, eerste lid][ref1], te bezigen in strijd
      met het bij of krachtens dit besluit bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0009770#Artikel2
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009770
        artikel: '2'
  - number: '9'
    text: |-
      Het is verboden voor levensmiddelen aanduidingen, vermeldingen of voorstellingen te bezigen welke gelijken op
      merken, tekenen en bewijsstukken als bedoeld in [artikel 2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009770#Artikel2
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009770
        artikel: '2'
  - number: '10'
    text: 'Het COKZ is:'
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel10
  - number: 10.a
    text: belast met het toezicht op de naleving van de bij of krachtens dit besluit gestelde regels;
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel10
  - number: 10.b
    text: |-
      belast met de in [artikel 4][ref1] bedoelde keuring van producten, en


      [ref1]: https://wetten.overheid.nl/BWBR0009770#Artikel4
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009770
        artikel: '4'
  - number: 10.c
    text: |-
      bevoegd tot het uitreiken van de in [artikel 2, eerste lid][ref1], bedoelde merken, tekenen of bewijsstukken.


      [ref1]: https://wetten.overheid.nl/BWBR0009770#Artikel2
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009770
        artikel: '2'
  - number: '13'
    text: |-
      Het is verboden voor kaas anders dan de kaas waarvoor krachtens [artikel 2, eerste lid][ref1], merken, tekenen
      of bewijsstukken zijn vastgesteld, aanduidingen, vermeldingen of voorstellingen te gebruiken die een zodanige
      gelijkenis vertonen met dat merk, teken of bewijsstuk dat daardoor verwarring kan ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009770#Artikel2
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009770
        artikel: '2'
  - number: '14.1'
    text: |-
      [Artikel 13][ref1] is niet van toepassing op producten die in een lidstaat van de Europese Unie of in een land dat
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte zijn geproduceerd en aldaar rechtmatig in
      de handel zijn gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0009770#Artikel13
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009770
        artikel: '13'
  - number: '14.2'
    text: |-
      [Artikel 13][ref1] is niet van toepassing op de plaatsing van goederen onder enige douaneregeling als bedoeld in
      artikel 4, onderdeel 16, onder a, d en f, van de [verordening (EEG) nr. 2913/92](31992R2913) van de Raad van de
      Europese Gemeenschappen van 12 oktober 1992 tot vaststelling van het communautair douanewetboek (PbEG L 302).


      [ref1]: https://wetten.overheid.nl/BWBR0009770#Artikel13
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009770
        artikel: '13'
  - number: '15.1'
    text: Van het bij of krachtens dit besluit bepaalde kan Onze Minister vrijstelling en, op aanvraag, ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel15
  - number: '15.2'
    text: |-
      Onze Minister kan bij ministeriële regeling bepalen dat een ontheffing als bedoeld in het eerste lid wordt verleend
      door een door hem aan te wijzen autoriteit.
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel15
  - number: '17'
    text: |-
      Het Landbouwkwaliteitsbesluit boterproducten, het Landbouwkwaliteitsbesluit kaasproducten en het
      Landbouwkwaliteitsbesluit poedervormige melkproducten worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel17
  - number: '18'
    text: Dit besluit treedt in werking met ingang van 1 augustus 1998.
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel18
  - number: '19'
    text: 'Dit besluit wordt aangehaald als: Landbouwkwaliteitsbesluit zuivelproducten.'
    url: https://wetten.overheid.nl/BWBR0009770/2011-07-01#Artikel19
