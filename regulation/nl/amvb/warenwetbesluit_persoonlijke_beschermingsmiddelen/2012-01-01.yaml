  - number: 6h
    text: |-
      1 De aangewezen aangemelde instelling verstrekt de Stichting Raad voor Accreditatie te Utrecht desgevraagd
      kosteloos alle informatie die deze nodig heeft bij de uitvoering van het bepaalde bij of krachtens
      [artikel 6g][ref1].

      2 Bij ministeriele regeling worden nadere regels gesteld betreffende het kosteloos verstrekken van gegevens en
      inlichtingen door een aangewezen instelling aan Onze Minister of de toezichthouder respectievelijk door Onze
      Minister of de toezichthouder aan de in het eerste lid genoemde Stichting Raad voor Accreditatie of een aangewezen
      instelling, die zijn verkregen door de uitvoering of het toezicht op de naleving van het bepaalde bij of krachtens
      de wet, welke noodzakelijk zijn voor de uitvoering van hun wettelijke taken.


      [ref1]: https://wetten.overheid.nl/BWBR0005570#Artikel6g
