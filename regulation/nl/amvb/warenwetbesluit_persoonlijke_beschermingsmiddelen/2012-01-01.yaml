  - number: '7'
    text: |-
      1 Een wijziging van een van de bijlagen van de richtlijn waarnaar in dit besluit wordt verwezen, treedt voor de
      toepassing van de bij of krachtens dit besluit gestelde regels in werking met ingang van de dag waarop aan de
      betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.

      2 De vaststelling of wijziging van specifieke voorschriften als bedoeld in [artikel 1, derde lid, onder a][ref1],
      wordt door Onze Minister bekend gemaakt in de Nederlandse Staatscourant. Hij vermeldt daarbij met ingang van
      welke datum deze voorschriften of de wijzigingen daarvan worden toegepast met betrekking tot welke persoonlijke
      beschermingsmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005570#Artikel1
    url: https://wetten.overheid.nl/BWBR0005570/2012-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005570
        artikel: '1'
        hoofdstuk: '1'
  - number: '8'
    text: |-
      1 De aanwijzing als aangemelde instelling op verzoek, afgegeven op grond van de wet, en geldend op de dag,
      voorafgaand aan de datum van inwerkingtreding van het besluit van 7 september 2009, Stb. 395 wordt geacht te zijn
      afgegeven met inachtneming van de bij of krachtens dit besluit gestelde bepalingen, zoals die luiden met ingang van
      datum van inwerkingtreding van evengenoemd besluit.

      2 Onverminderd het derde en zesde lid, vervalt de aanwijzing, bedoeld in het eerste lid, van rechtswege
      vierentwintig maanden na de datum van inwerkingtreding van de voor het werkveld waarop de betrokken instelling
      werkzaam is, geldende ministeriële regeling, bedoeld in [artikel 6d, derde lid][ref1].

      3 De aanwijzing, bedoeld in het eerste lid, met een vervaldatum, gelegen voor de in het tweede lid bedoelde
      vervaldatum, vervalt van rechtswege op de oorspronkelijke vervaldatum, tenzij de betrokken instelling binnen
      vijf maanden na de datum van inwerkingtreding van de voor het werkveld waarop de instelling werkzaam is, geldende
      ministeriële regeling, bedoeld in [artikel 6d, derde lid][ref2], en voorafgaand aan de oorspronkelijke vervaldatum
      een verzoek tot beoordeling ten behoeve van een hernieuwde aanwijzing heeft ingediend bij de Stichting Raad
      voor Accreditatie te Utrecht. Alsdan blijft de aanwijzing van kracht tot uiterlijk de in het tweede lid bedoelde
      vervaldatum van rechtswege.

      4 De instelling waarvan de aanwijzing op grond van het bepaalde in het tweede of derde lid vervalt, kan Onze
      Minister vragen om hernieuwde aanwijzing met inachtneming van de bij of krachtens dit besluit gestelde bepalingen,
      zoals die luiden met ingang van de datum van inwerkingtreding van het besluit van 7 september 2009, Stb. 395.

      5 In afwijking van [artikel 6e, vierde lid][ref3], van dit besluit, zijn de aan de beoordeling door de in het
      derde lid genoemde Stichting Raad voor Accreditatie verbonden kosten voor rekening van Onze Minister, indien de
      instelling, bedoeld in het eerste lid, een verzoek tot beoordeling ten behoeve van een hernieuwde aanwijzing heeft
      ingediend bij voornoemde Stichting Raad voor Accreditatie binnen vijf maanden na de datum van inwerkingtreding
      van de voor het werkveld, waarop de instelling werkzaam is, geldende ministeriële regeling, bedoeld in
      [artikel 6d, derde lid][ref4].

      6 Indien Onze Minister op een aanvraag tot hernieuwde aanwijzing beslist op een tijdstip, gelegen voor de in het
      tweede lid bedoelde vervaldatum van rechtswege, vervalt de oorspronkelijke aanwijzing met ingang van de datum van
      inwerkingtreding van de hernieuwde aanwijzing.


