  - number: '5'
    text: |-
      1 Persoonlijke beschermingsmiddelen zijn onderworpen aan een certificeringsprocedure overeenkomstig het in dit
      artikel bepaalde en zijn voorzien van de in bijlage IV van de richtlijn bedoelde aanduiding, houdende de CE-
      markering, alsmede van het identificatienummer krachtens artikel 9, eerste lid, van de richtlijn toegekend
      aan een aangewezen aangemelde instelling. Indien een certificeringsprocedure de afgifte van een verklaring
      van EG-typeonderzoek voorschrijft, is het persoonlijke beschermingsmiddel of het model van de persoonlijke
      beschermingsmiddelen waarop dat voorschrift betrekking heeft, gekeurd.

      2 De in het eerste lid bedoelde CE-markering wordt uitsluitend gebezigd indien:

      a. voor het beschermingsmiddel:

      1e. een EG-verklaring van overeenstemming als bedoeld in bijlage VI van de richtlijn voorhanden is bij de
      in de Europese Economische Ruimte gevestigde fabrikant, diens in de Europese Economische Ruimte gevestigde
      gevolmachtigde, dan wel, indien geen van beide in de Europese Economische Ruimte is gevestigd, degene die het
      beschermingsmiddel in de Europese Economische Ruimte op de markt brengt, en

      2e. een technisch dossier als bedoeld in bijlage III van de richtlijn bij één van de personen zoals aangegeven
      onder 1e voorhanden is, en

      3e. behoudens voor beschermingsmiddelen, bedoeld in artikel 8, derde lid, van de richtlijn, een EG-type-
      onderzoekverklaring is verkregen als bedoeld in artikel 10 van de richtlijn van een aangewezen aangemelde
      instelling, en

      b. de vervaardiging van het persoonlijk beschermingsmiddel geschiedt met inachtneming van één van
      de produktiecontrole-procedures, bedoeld in artikel 11 van de richtlijn, wanneer het een persoonlijk
      beschermingsmiddel betreft, dat wordt genoemd in artikel 8, vierde lid, onder a, van de richtlijn, dan wel;

      c. wanneer het een persoonlijk beschermingsmiddel betreft dat niet wordt genoemd in artikel 8, vierde lid, onder
      a, van de richtlijn, voor elk vervaardigd persoonlijk beschermingsmiddel een EG-verklaring van overeenstemming als
      bedoeld in bijlage VI van de richtlijn voorhanden is bij de in de Europese Economische Ruimte gevestigde fabrikant,
      diens in de Europese Economische Ruimte gevestigde gevolmachtigde, dan wel, indien geen van beide in de Europese
      Economische Ruimte is gevestigd, degene die het beschermingsmiddel in de Europese Economische Ruimte in de handel
      brengt.

      3 Indien persoonlijke beschermingsmiddelen uitsluitend bestemd zijn voor beroepsmatige toepassing, is het eerste
      lid niet van toepassing op onderdelen van de persoonlijke beschermingsmiddelen die bestemd zijn om te worden
      ingebouwd in persoonlijke beschermingsmiddelen of met andere onderdelen te worden samengebouwd tot één persoonlijk
      beschermingsmiddel, mits zij geen wezenlijk onderdeel van persoonlijke beschermingsmiddelen zijn die voor de goede
      werking ervan onmisbaar zijn, en op de samenstellingen dit besluit van toepassing is.

      4 Indien bij de vervaardiging geharmoniseerde normen niet of slechts gedeeltelijk zijn toegepast, of wanneer
      die normen ontbreken, wordt in de verklaring van de aangewezen aangemelde instelling de overeenstemming met de
      fundamentele eisen met inachtneming van de procedure van artikel 10, vierde lid, onder a, tweede gedachtestreepje
      en b, tweede gedachtestreepje, van de richtlijn, vermeld.

      5 a. Indien de fabrikant, diens in Nederland gevestigde gevolmachtigde, dan wel, indien geen van beiden in
      Nederland zijn gevestigd, degene die het persoonlijke beschermingsmiddel in Nederland op de markt brengt,
      voornemens is aan het model van een persoonlijke beschermingsmiddel of aan te vervaardigen en in de handel te
      brengen persoonlijke beschermingsmiddelen waarvoor een verklaring van typeonderzoek is afgegeven, wijzigingen aan
      te brengen, stelt hij de aangewezen aangemelde instelling die de verklaring van EG-typeonderzoek heeft afgegeven
      hiervan onverwijld in kennis.

      b. De in onderdeel a bedoelde aangewezen aangemelde instelling beoordeelt de wijzigingen en deelt de genoemde
      persoon mede of de typeonderzoekverklaring voor het aldus gewijzigde persoonlijke beschermingsmiddel geldig is.

      c. Indien de in onderdeel a bedoelde aangewezen aangemelde instelling van oordeel is dat de verklaring van
      EG-typeonderzoek voor het gewijzigde persoonlijke beschermingsmiddel niet geldig is, moet dit persoonlijke
      beschermingsmiddel aan een EG-typeonderzoek worden onderworpen.

      6 De kosten van het EG-typeonderzoek, bedoeld in het tweede en vijfde lid, en de beoordeling, bedoeld in vijfde
      lid, zijn voor rekening van de fabrikant.
    url: https://wetten.overheid.nl/BWBR0005570/2012-01-01#Artikel5
  - number: '6'
    text: |-
      1 De in [artikel 5, eerste lid][ref1], bedoelde aanduiding en het in dat lid bedoelde identificatienummer zijn
      duidelijk leesbaar en onuitwisbaar op het persoonlijke beschermingsmiddel, dan wel, indien de kenmerken van het
      persoonlijke beschermingsmiddel dit onmogelijk maken, op de verpakking aangebracht.

      2 Ten aanzien van persoonlijke beschermingsmiddelen mogen geen vermeldingen, voorstellingen of aanduidingen
      worden gebezigd welke met de in [artikel 5, eerste lid][ref2], bedoelde aanduiding kunnen worden verward. Op de
      persoonlijke beschermingsmiddelen mogen andere markeringen worden aangebracht op voorwaarde dat de zichtbaarheid en
      de leesbaarheid van de CE-markering niet worden verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0005570#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005570#Artikel5
