preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 16 december 1991, VVP/P-
    U 692407, gedaan in overeenstemming met Onze Minister van Economische Zaken, Onze Minister van Sociale Zaken en
    Werkgelegenheid en Onze Minister van Verkeer en Waterstaat;

    Overwegende, dat het, gelet op richtlijn 89/686/EEG van de Raad van de Europese Gemeenschappen van 21 december 1989
    betreffende de onderlinge aanpassing van de wetgevingen van de Lid-Staten inzake persoonlijke beschermingsmiddelen
    (PbEG L 399), noodzakelijk is regels te stellen ten aanzien van de deugdelijke werking van persoonlijke
    beschermingsmiddelen;

    Gelet op de artikelen 1, vierde lid, 4, eerste lid, onderdeel a, 8, onderdelen a, b en c, 11, 12, 13 en 14 van de
    Warenwet (Stb. 1988, 360);

    Gezien het advies van de Adviescommissie Warenwet van 18 september 1991, nr. 14433/(41)5;

    De Raad van State gehoord (advies van 14 april 1992, nr. W13.92.0008);

    Gezien het nader rapport van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 12 juni 1992, VVP/P
    921208 uitgebracht in overeenstemming met Onze Minister van Economische Zaken en Onze Minister van Sociale Zaken en
    Werkgelegenheid en Onze Minister van Verkeer en Waterstaat;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005570/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. persoonlijk beschermingsmiddel:

      1e. een uitrustingsstuk of -middel dat bestemd is om door een persoon te worden gedragen of vastgehouden als
      bescherming tegen één of meer gevaren die een bedreiging voor zijn gezondheid of zijn veiligheid kunnen vormen;

      2e. een geheel dat is samengesteld uit verscheidene uitrustingsstukken of -middelen die door de fabrikant onderling
      zijn verbonden om een persoon te beschermen tegen één of meer, mogelijk gelijktijdig optredende gevaren;

      3e. een uitrustingsstuk of beschermingsmiddel dat al of niet onlosmakelijk verbonden is met een niet-beschermende
      persoonlijke uitrusting die door een persoon wordt gedragen of vastgehouden voor het bedrijven van een bepaalde
      activiteit;

      4e. verwisselbare onderdelen van een persoonlijk beschermingsmiddel die voor de goede werking ervan onontbeerlijk
      zijn en die uitsluitend voor dat beschermingsmiddel worden gebruikt;

      b. richtlijn: de richtlijn van de Raad van de Europese Economische Gemeenschappen van 21 december 1989 betreffende
      de onderlinge aanpassing van de wetgevingen der Lid-Staten inzake persoonlijke beschermingsmiddelen (89/686/EEG),
      (*PbEG* L 399);

      c. Europese Economische Ruimte: het grondgebied waarop de Overeenkomst betreffende de Europese Economische Ruimte
      van toepassing is;

      d. aangewezen aangemelde instelling: een krachtens [artikel 7a van de wet][ref1] in het kader van de richtlijn
      aangewezen en bij de Commissie van de Europese Gemeenschappen aangemelde instelling, dan wel een door een andere
      staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte in het kader van de richtlijn
      aangewezen en bij de Commissie van de Europese Gemeenschappen aangemelde instelling;

      e. wet: [Warenwet][ref2].

      2 Het samen met het persoonlijk beschermingsmiddel verhandelde verbindingssysteem dat het beschermingsmiddel aan
      een andere, externe voorziening verbindt, ook wanneer het verbindingssysteem voor de tijdsduur dat de gebruiker aan
      gevaren die een bedreiging voor zijn gezondheid of veiligheid kunnen vormen, is blootgesteld, niet ononderbroken
      behoeft te worden gedragen of meegevoerd, wordt beschouwd als integrerend bestanddeel van het beschermingsmiddel.

      3 Dit besluit is niet van toepassing op:

      a. categorieën persoonlijke beschermingsmiddelen waarvoor bij of krachtens de wet specifieke voorschriften op
      het gebied van de produktveiligheid zijn getroffen, die uitvoering geven aan andere richtlijnen van de Europese
      Gemeenschappen dan de in het eerste lid, onder *c*, bedoelde richtlijn alsmede wijzigingen daarvan;

      b. de categorieën persoonlijke beschermingsmiddelen, genoemd in bijlage I van de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0001969
