  - number: 6g
    text: |-
      1 Tijdens de looptijd van de aanwijzing stelt Onze Minister periodiek vast of deze instelling:

      a. nog voldoet aan het bepaalde bij of krachtens [artikel 6d][ref1]; en

      b. haar wettelijke verplichtingen naar behoren nakomt en de taken waarvoor zij is aangewezen, naar behoren
      uitvoert.

      2 Ten behoeve van de periodieke vaststelling laat Onze Minister de Stichting Raad voor Accreditatie te Utrecht ter
      zake een beoordeling doen.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de periodieke vaststelling en
      de beoordeling.

      4 De kosten van de beoordeling lid, zijn voor rekening van de aangewezen aangemelde instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0005570#Artikel6d
    url: https://wetten.overheid.nl/BWBR0005570/2012-01-01#Artikel6g
