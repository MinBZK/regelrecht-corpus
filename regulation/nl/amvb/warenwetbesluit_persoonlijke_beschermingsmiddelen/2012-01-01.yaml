  - number: 6a
    text: |-
      Een EG-typeonderzoekverklaring wordt door de aangewezen aangemelde instelling die haar heeft afgegeven ingetrokken
      indien de fundamentele eisen van bijlage II van de richtlijn zodanig zijn gewijzigd dat het model niet aan de
      gewijzigde eisen voldoet.
    url: https://wetten.overheid.nl/BWBR0005570/2012-01-01#Artikel6a
  - number: 6c
    text: |-
      Artikel 2 is niet van toepassing op het tentoonstellen en demonstreren op (jaar)beurzen, exposities en bij
      demonstraties van persoonlijke beschermingsmiddelen die niet in overeenstemming zijn met dit besluit, mits
      op een zichtbaar bord duidelijk is aangegeven dat ze niet in overeenstemming zijn met dit besluit en niet te
      koop zijn voordat zij door de fabrikant of zijn in de Europese Economische Ruimte gevestigde gevolmachtigde in
      overeenstemming zijn gebracht met dit besluit. Bij demonstraties zijn alle passende veiligheidsmaatregelen genomen
      om de bescherming van de mens te waarborgen.
    url: https://wetten.overheid.nl/BWBR0005570/2012-01-01#Artikel6c
  - number: 6d
    text: |-
      1 Als aangewezen aangemelde instelling kan worden aangewezen de instelling die:

      a. rechtspersoonlijkheid heeft;

      b. onafhankelijk is;

      c. beschikt over de deskundigheid en outillage die nodig zijn om de uitvoering van de taken waarvoor zij aangewezen
      wil worden, naar behoren te kunnen vervullen;

      d. beschikt over een registratiesysteem waarin de gegevens die samenhangen met en betrekking hebben op de
      uitvoering van de taken waarvoor zij aangewezen wil worden, naar behoren vastgelegd kunnen worden. Aan de hand
      van deze gegevens zijn de gekeurde persoonlijke beschermingsmiddelen en de onderzochte kwaliteitssystemen afdoende
      te identificeren;

      e. verzekerd is tegen wettelijke aansprakelijkheid voor de risico’s die voortvloeien uit de uitoefening van de
      taken waarvoor zij aangewezen wil worden;

      f. een overeenkomst heeft gesloten met de in voorkomend geval aanwezige beheerstichting die de krachtens dit
      besluit geregelde certificatieschema’s beheert; en

      g. naar behoren functioneert.

      2 In aanvulling op het eerste lid komt voor aanwijzing als aangewezen aangemelde instelling slechts in aanmerking
      de instelling die ten minste voldoet aan de in bijlage V bij de richtlijn neergelegde voorwaarden.

      3 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0005570/2012-01-01#Artikel6d
  - number: 6e
    text: |-
      1 De instelling, bedoeld in [artikel 6d][ref1], dient de aanvraag tot aanwijzing in bij Onze Minister.

      2 De instelling doet de aanvraag vergezellen van een beoordeling door de Stichting Raad voor Accreditatie te
      Utrecht, waaruit blijkt dat zij voldoet aan de criteria, genoemd in [artikel 6d, eerste lid][ref2], en van het
      bewijs dat is voldaan aan de voorwaarden, genoemd in artikel 6d, tweede lid.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de indiening van de aanvraag, de
      beoordeling, het bewijs, bedoeld in het tweede lid, en de afhandeling van de aanvraag.

      4 De kosten van de beoordeling en het bewijs, bedoeld in het tweede lid, zijn voor rekening van de aanvragende
      instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0005570#Artikel6d
      [ref2]: https://wetten.overheid.nl/BWBR0005570#Artikel6d
