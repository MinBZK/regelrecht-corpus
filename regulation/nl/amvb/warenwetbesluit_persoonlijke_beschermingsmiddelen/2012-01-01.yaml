  - number: '2'
    text: |-
      1 Het is verboden persoonlijke beschermingsmiddelen die niet voldoen aan de vervaardigingsvoorschriften gesteld bij
      of krachtens dit besluit te verhandelen of te gebruiken.

      2 Het is verboden persoonlijke beschermingsmiddelen te verhandelen of te gebruiken, anders dan met inachtneming
      van de voorschriften bij of krachtens dit besluit gesteld met betrekking tot de aanduiding en het bezigen van
      vermeldingen.

      3 Het is verboden persoonlijke beschermingsmiddelen te verhandelen of te gebruiken, indien de bij of krachtens dit
      besluit voorgeschreven overeenstemmingsbeoordelingsprocedures niet in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0005570/2012-01-01#Artikel2
  - number: '3'
    text: |-
      Persoonlijke beschermingsmiddelen zijn zodanig ontworpen, samengesteld en vervaardigd, hebben zodanige
      eigenschappen en zijn van zodanige vermeldingen voorzien, dat zij bij gebruik overeenkomstig hun bestemming geen
      gevaar opleveren voor de veiligheid of gezondheid van de mens of voor de veiligheid van zaken, wanneer zij op
      passende wijze zijn geïnstalleerd en onderhouden. Zij voldoen aan de in bijlage II van de richtlijn opgenomen
      fundamentele eisen.
    url: https://wetten.overheid.nl/BWBR0005570/2012-01-01#Artikel3
  - number: '4'
    text: |-
      Persoonlijke beschermingsmiddelen die voldoen aan de door Onze Minister aangewezen normen en die met inachtneming
      van de procedures, genoemd in [artikel 5][ref1], zijn voorzien van de CE-markering, bedoeld in bijlage IV van
      de richtlijn, en waarvoor de EG-verklaring van overeenstemming, bedoeld in bijlage VI van de richtlijn, alsmede,
      indien van toepassing, de verklaring van EG-typeonderzoek, kan worden overgelegd, worden vermoed te voldoen aan het
      in [artikel 3, tweede volzin][ref2], bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0005570#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005570#Artikel3
    url: https://wetten.overheid.nl/BWBR0005570/2012-01-01#Artikel4
