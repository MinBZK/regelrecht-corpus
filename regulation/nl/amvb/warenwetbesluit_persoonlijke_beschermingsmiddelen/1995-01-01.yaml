preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 16 december 1991, VVP/P-
    U 692407, gedaan in overeenstemming met Onze Minister van Economische Zaken, Onze Minister van Sociale Zaken en
    Werkgelegenheid en Onze Minister van Verkeer en Waterstaat;

    Overwegende, dat het, gelet op richtlijn 89/686/EEG van de Raad van de Europese Gemeenschappen van 21 december 1989
    betreffende de onderlinge aanpassing van de wetgevingen van de Lid-Staten inzake persoonlijke beschermingsmiddelen
    (PbEG L 399), noodzakelijk is regels te stellen ten aanzien van de deugdelijke werking van persoonlijke
    beschermingsmiddelen;

    Gelet op de artikelen 1, vierde lid, 4, eerste lid, onderdeel a, 8, onderdelen a, b en c, 11, 12, 13 en 14 van de
    Warenwet (Stb. 1988, 360);

    Gezien het advies van de Adviescommissie Warenwet van 18 september 1991, nr. 14433/(41)5;

    De Raad van State gehoord (advies van 14 april 1992, nr. W13.92.0008);

    Gezien het nader rapport van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 12 juni 1992, VVP/P
    921208 uitgebracht in overeenstemming met Onze Minister van Economische Zaken en Onze Minister van Sociale Zaken en
    Werkgelegenheid en Onze Minister van Verkeer en Waterstaat;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005570/1995-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. persoonlijk beschermingsmiddel:

      1e. een uitrustingsstuk of -middel dat bestemd is om door een persoon te worden gedragen of vastgehouden als
      bescherming tegen één of meer gevaren die een bedreiging voor zijn gezondheid of zijn veiligheid kunnen vormen;

      2e. een geheel dat is samengesteld uit verscheidene uitrustingsstukken of -middelen die door de fabrikant onderling
      zijn verbonden om een persoon te beschermen tegen één of meer, mogelijk gelijktijdig optredende gevaren;

      3e. een uitrustingsstuk of beschermingsmiddel dat al of niet onlosmakelijk verbonden is met een niet-beschermende
      persoonlijke uitrusting die door een persoon wordt gedragen of vastgehouden voor het bedrijven van een bepaalde
      activiteit;

      4e. verwisselbare onderdelen van een persoonlijk beschermingsmiddel die voor de goede werking ervan onontbeerlijk
      zijn en die uitsluitend voor dat beschermingsmiddel worden gebruikt.

      b. de Gemeenschap: het grondgebied waarop het op 25 maart 1957, te Rome tot stand gekomen Verdrag tot oprichting
      van de Europese Economische Gemeenschap (*Trb.* 1957, 74 en 91), laatstelijk gewijzigd door de op 17 en 28 februari
      1986 te Luxemburg tot stand gekomen Europese Akte (*Trb.* 1986, 63), van toepassing is.

      c. richtlijn: de richtlijn van de Raad van de Europese Economische Gemeenschappen van 21 december 1989 betreffende
      de onderlinge aanpassing van de wetgevingen der Lid-Staten inzake persoonlijke beschermingsmiddelen (89/686/EEG),
      (*PbEG* L 399).

      2 Het samen met het persoonlijk beschermingsmiddel verhandelde verbindingssysteem dat het beschermingsmiddel aan
      een andere, externe voorziening verbindt, ook wanneer het verbindingssysteem voor de tijdsduur dat de gebruiker aan
      gevaren die een bedreiging voor zijn gezondheid of veiligheid kunnen vormen, is blootgesteld, niet ononderbroken
      behoeft te worden gedragen of meegevoerd, wordt beschouwd als integrerend bestanddeel van het beschermingsmiddel.

      3 Dit besluit is niet van toepassing op:

      a. persoonlijke beschermingsmiddelen specifiek bestemd voor uitsluitend beroepsmatige toepassing;

      b. categorieën persoonlijke beschermingsmiddelen waarvoor bij of krachtens de wet specifieke voorschriften op
      het gebied van de produktveiligheid zijn getroffen, die uitvoering geven aan andere richtlijnen van de Europese
      Gemeenschappen dan de in het eerste lid, onder *c*, bedoelde richtlijn alsmede wijzigingen daarvan.

      c. de categorieën persoonlijke beschermingsmiddelen, genoemd in bijlage I van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0005570/1995-01-01#Artikel1
  - number: '2'
    text: |-
      1 Het is verboden persoonlijke beschermingsmiddelen te verhandelen, die niet voldoen aan de eisen, gesteld bij of
      krachtens dit besluit.

      2 Het is verboden persoonlijke beschermingsmiddelen te verhandelen, anders dan met inachtneming van de
      voorschriften bij of krachtens dit besluit gesteld met betrekking tot de aanduiding en het bezigen van
      vermeldingen.
    url: https://wetten.overheid.nl/BWBR0005570/1995-01-01#Artikel2
  - number: '3'
    text: |-
      Persoonlijke beschermingsmiddelen dienen zodanig te zijn samengesteld en zodanige eigenschappen te hebben, alsmede
      van zodanige vermeldingen te zijn voorzien, dat zij, wanneer zij behoorlijk zijn onderhouden en overeenkomstig
      hun bestemming worden gebruikt, geen gevaar opleveren voor de gezondheid en veiligheid van personen, huisdieren en
      goederen. Zij dienen daartoe te voldoen aan de in bijlage II van de richtlijn opgenomen eisen.
    url: https://wetten.overheid.nl/BWBR0005570/1995-01-01#Artikel3
  - number: '4'
    text: |-
      Persoonlijke beschermingsmiddelen die voldoen aan de door Onze Minister in overeenstemming met Onze Minister
      van Sociale Zaken en Werkgelegenheid aangewezen normen en die met inachtneming van de procedures, genoemd in
      [artikel 5][ref1], zijn voorzien van de CE-markering, bedoeld in bijlage IV van de richtlijn, en waarvoor de EG-
      verklaring van overeenstemming, bedoeld in bijlage VI van de richtlijn, kan worden overgelegd, worden vermoed te
      voldoen aan het in [artikel 3, tweede volzin][ref2], bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0005570#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005570#Artikel3
    url: https://wetten.overheid.nl/BWBR0005570/1995-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005570
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005570
        artikel: '3'
  - number: '5'
    text: |-
      1 Persoonlijke beschermingsmiddelen zijn voorzien van de aanduiding houdende de CE-markering, bedoeld in bijlage IV
      van de richtlijn, alsmede van het identificatienummer ingevolge artikel 9, eerste lid, van de richtlijn toegekend
      aan een aangewezen instantie als bedoeld in de procedures beschreven in artikel 11 van de richtlijn.

      2 De in het eerste lid bedoelde aanduiding mag uitsluitend worden gebezigd indien:

      a. voor het beschermingsmiddel:

      1e. een EG-verklaring van overeenstemming als bedoeld in bijlage VI van de richtlijn voorhanden is bij de
      fabrikant, diens in de Gemeenschap dan wel in een van de staten die partij zijn bij de Overeenkomst betreffende de
      Europese Economische Ruimte gevestigde gevolmachtigde dan wel, indien geen van beide noch in de Gemeenschap noch
      in een van de zojuist genoemde staten is gevestigd, de importeur die het beschermingsmiddel in de Gemeenschap of in
      een van de hiervoor bedoelde staten op de markt brengt, en

      2e. een technisch dossier als bedoeld in bijlage III van de richtlijn bij één van de personen zoals aangegeven
      onder 1e voorhanden is, en

      3e. behoudens voor beschermingsmiddelen, bedoeld in artikel 8, derde lid, van de richtlijn, een EG-type-
      onderzoekverklaring is verkregen zoals bedoeld in artikel 10 van de richtlijn van een door Onze Minister in
      overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid daartoe aangewezen instantie, en

      b. de vervaardiging van het persoonlijk beschermingsmiddel geschiedt met inachtneming van één van
      de produktiecontrole-procedures, bedoeld in artikel 11 van de richtlijn, wanneer het een persoonlijk
      beschermingsmiddel betreft, dat wordt genoemd in artikel 8, vierde lid, onder *a*, van de richtlijn, dan wel;

      c. wanneer het een persoonlijk beschermingsmiddel betreft dat niet wordt genoemd in artikel 8, vierde lid, onder
      *a*, van de richtlijn, voor elk vervaardigd persoonlijk beschermingsmiddel een verklaring van overeenstemming als
      bedoeld in bijlage VI van de richtlijn voorhanden is bij de in de Gemeenschap gevestigde fabrikant, diens in de
      Gemeenschap gevestigde gemachtigde, of, indien geen van beide in de Gemeenschap is gevestigd, de importeur die het
      beschermingsmiddel in de Gemeenschap in de handel brengt.

      3 Voor een aanwijzing als bedoeld in het tweede lid, onderdeel *a*, 3e, en als bedoeld in de procedures, beschreven
      in artikel 11 van de richtlijn, komen slechts in aanmerking instanties die voldoen aan de in bijlage V van de
      richtlijn gestelde eisen. Onze Minister kan in overeenstemming met de Minister van Sociale Zaken en Werkgelegenheid
      nadere eisen stellen.

      4 Als aangewezen instanties als bedoeld in het tweede lid, onder *a*, 3e, en als bedoeld in de procedures,
      beschreven in artikel 11 van de richtlijn, worden aangemerkt instanties die in het kader van de richtlijn door
      andere Lid-Staten van de Gemeenschap dan wel door de overige staten die partij zijn bij de Overeenkomst betreffende
      de Europese Economische Ruimte bij de Commissie van de Europese Gemeenschappen zijn aangemeld en waarvan de namen
      door de Commissie zijn gepubliceerd in het Publicatieblad van de Europese Gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0005570/1995-01-01#Artikel5
  - number: '6'
    text: |-
      1 De in [artikel 5, eerste lid][ref1], bedoelde aanduiding en het in dat lid bedoelde identificatienummer zijn
      duidelijk leesbaar en onuitwisbaar op het persoonlijke beschermingsmiddel, dan wel, indien de kenmerken van het
      persoonlijke beschermingsmiddel dit onmogelijk maken, op de verpakking aangebracht.

      2 Ten aanzien van persoonlijke beschermingsmiddelen mogen geen vermeldingen, voorstellingen of aanduidingen worden
      gebezigd welke met de in [artikel 5, eerste lid][ref2], bedoelde aanduiding kunnen worden verward.


      [ref1]: https://wetten.overheid.nl/BWBR0005570#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005570#Artikel5
    url: https://wetten.overheid.nl/BWBR0005570/1995-01-01#Artikel6
