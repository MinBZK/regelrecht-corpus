  - number: '7'
    text: |-
      1 Het Redding- en Zwemvestenbesluit (Warenwet) (*Stb.* 1982, 469) wordt ingetrokken.

      2 Het Helmenbesluit (Warenwet) (*Stb.* 1975, 517) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005570/1995-01-01#Artikel7
  - number: '9'
    text: |-
      Indien één van de bijlagen van de richtlijn, waarnaar in dit besluit wordt verwezen, wordt gewijzigd dan wel
      indien een richtlijn zoals bedoeld in artikel 1, vierde lid, van de richtlijn wordt vastgesteld of gewijzigd, maakt
      Onze Minister dit bekend in de *Nederlandse Staatscourant*; hij vermeldt daarbij met ingang van welke datum de
      wijzigingen worden toegepast met betrekking tot welke persoonlijke beschermingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0005570/1995-01-01#Artikel9
  - number: '10'
    text: Dit besluit kan worden aangehaald als Warenwetbesluit persoonlijke beschermingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0005570/1995-01-01#Artikel10
  - number: '11'
    text: |-
      1 Dit besluit treedt in werking met ingang van 1 juli 1992 met dien verstande dat dit besluit tot 1 juli 1995
      niet geldt voor persoonlijke beschermingsmiddelen die voldoen aan de wettelijke voorschriften op het gebied van de
      produktveiligheid zoals die luidden onmiddellijk voor de inwerkingtreding van dit besluit.

      2 Met betrekking tot persoonlijke beschermingsmiddelen als bedoeld in het eerste lid, waarop dit besluit niet wordt
      toegepast en waarop ingevolge een of meer andere wettelijke regelingen de CE-markering wordt aangebracht, worden op
      de bij die persoonlijke beschermingsmiddelen gevoegde documenten, handleidingen of gebruiksaanwijzingen de in het
      *Publikatieblad van de Europese Gemeenschappen* bekendgemaakte referenties van de aan die wettelijke regelingen ten
      grondslag liggende richtlijnen vermeld.
    url: https://wetten.overheid.nl/BWBR0005570/1995-01-01#Artikel11
