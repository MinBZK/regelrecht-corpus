---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: warenwetbesluit_persoonlijke_beschermingsmiddelen
regulatory_layer: AMVB
publication_date: '2018-04-17'
valid_from: '2003-09-01'
bwb_id: BWBR0005570
url: https://wetten.overheid.nl/BWBR0005570/2003-09-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 16 december 1991, VVP/P-
    U 692407, gedaan in overeenstemming met Onze Minister van Economische Zaken, Onze Minister van Sociale Zaken en
    Werkgelegenheid en Onze Minister van Verkeer en Waterstaat;

    Overwegende, dat het, gelet op richtlijn 89/686/EEG van de Raad van de Europese Gemeenschappen van 21 december 1989
    betreffende de onderlinge aanpassing van de wetgevingen van de Lid-Staten inzake persoonlijke beschermingsmiddelen
    (PbEG L 399), noodzakelijk is regels te stellen ten aanzien van de deugdelijke werking van persoonlijke
    beschermingsmiddelen;

    Gelet op de artikelen 1, vierde lid, 4, eerste lid, onderdeel a, 8, onderdelen a, b en c, 11, 12, 13 en 14 van de
    Warenwet (Stb. 1988, 360);

    Gezien het advies van de Adviescommissie Warenwet van 18 september 1991, nr. 14433/(41)5;

    De Raad van State gehoord (advies van 14 april 1992, nr. W13.92.0008);

    Gezien het nader rapport van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 12 juni 1992, VVP/P
    921208 uitgebracht in overeenstemming met Onze Minister van Economische Zaken en Onze Minister van Sociale Zaken en
    Werkgelegenheid en Onze Minister van Verkeer en Waterstaat;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel1
  - number: 1.1.a
    text: 'persoonlijk beschermingsmiddel:'
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel1
  - number: 1.1.a.1e
    text: |-
      een uitrustingsstuk of -middel dat bestemd is om door een persoon te worden gedragen of vastgehouden als
      bescherming tegen één of meer gevaren die een bedreiging voor zijn gezondheid of zijn veiligheid kunnen vormen;
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel1
  - number: 1.1.a.2e
    text: |-
      een geheel dat is samengesteld uit verscheidene uitrustingsstukken of -middelen die door de fabrikant onderling
      zijn verbonden om een persoon te beschermen tegen één of meer, mogelijk gelijktijdig optredende gevaren;
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel1
  - number: 1.1.a.3e
    text: |-
      een uitrustingsstuk of beschermingsmiddel dat al of niet onlosmakelijk verbonden is met een niet-beschermende
      persoonlijke uitrusting die door een persoon wordt gedragen of vastgehouden voor het bedrijven van een bepaalde
      activiteit;
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel1
  - number: 1.1.a.4e
    text: |-
      verwisselbare onderdelen van een persoonlijk beschermingsmiddel die voor de goede werking ervan onontbeerlijk zijn
      en die uitsluitend voor dat beschermingsmiddel worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel1
  - number: 1.1.b
    text: |-
      richtlijn: de richtlijn van de Raad van de Europese Economische Gemeenschappen van 21 december 1989 betreffende
      de onderlinge aanpassing van de wetgevingen der Lid-Staten inzake persoonlijke beschermingsmiddelen (89/686/EEG),
      (*PbEG* L 399);
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel1
  - number: 1.1.c
    text: |-
      Europese Economische Ruimte: het grondgebied waarop de Overeenkomst betreffende de Europese Economische Ruimte van
      toepassing is;
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel1
  - number: 1.1.d
    text: |-
      aangewezen aangemelde instelling: een krachtens [artikel 7a van de wet][ref1] in het kader van de richtlijn
      aangewezen en bij de Commissie van de Europese Gemeenschappen aangemelde instelling, dan wel een door een andere
      staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte in het kader van de richtlijn
      aangewezen en bij de Commissie van de Europese Gemeenschappen aangemelde instelling;


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel7a
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 7a
  - number: 1.1.e
    text: |-
      wet: [Warenwet][ref1].

      [ref1]: https://wetten.overheid.nl/BWBR0001969
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001969
  - number: '1.2'
    text: |-
      Het samen met het persoonlijk beschermingsmiddel verhandelde verbindingssysteem dat het beschermingsmiddel aan een
      andere, externe voorziening verbindt, ook wanneer het verbindingssysteem voor de tijdsduur dat de gebruiker aan
      gevaren die een bedreiging voor zijn gezondheid of veiligheid kunnen vormen, is blootgesteld, niet ononderbroken
      behoeft te worden gedragen of meegevoerd, wordt beschouwd als integrerend bestanddeel van het beschermingsmiddel.
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel1
  - number: '1.3'
    text: 'Dit besluit is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel1
  - number: 1.3.a
    text: |-
      categorieën persoonlijke beschermingsmiddelen waarvoor bij of krachtens de wet specifieke voorschriften op het
      gebied van de produktveiligheid zijn getroffen, die uitvoering geven aan andere richtlijnen van de Europese
      Gemeenschappen dan de in het eerste lid, onder *c*, bedoelde richtlijn alsmede wijzigingen daarvan;
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel1
  - number: 1.3.b
    text: de categorieën persoonlijke beschermingsmiddelen, genoemd in bijlage I van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel1
  - number: '2.1'
    text: |-
      Het is verboden persoonlijke beschermingsmiddelen die niet voldoen aan de vervaardigingsvoorschriften gesteld bij
      of krachtens dit besluit te verhandelen of te gebruiken.
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel2
  - number: '2.2'
    text: |-
      Het is verboden persoonlijke beschermingsmiddelen te verhandelen of te gebruiken, anders dan met inachtneming
      van de voorschriften bij of krachtens dit besluit gesteld met betrekking tot de aanduiding en het bezigen van
      vermeldingen.
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel2
  - number: '2.3'
    text: |-
      Het is verboden persoonlijke beschermingsmiddelen te verhandelen of te gebruiken, indien de bij of krachtens dit
      besluit voorgeschreven overeenstemmingsbeoordelingsprocedures niet in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel2
  - number: '3'
    text: |-
      Persoonlijke beschermingsmiddelen zijn zodanig ontworpen, samengesteld en vervaardigd, hebben zodanige
      eigenschappen en zijn van zodanige vermeldingen voorzien, dat zij bij gebruik overeenkomstig hun bestemming geen
      gevaar opleveren voor de veiligheid of gezondheid van de mens of voor de veiligheid van zaken, wanneer zij op
      passende wijze zijn geïnstalleerd en onderhouden. Zij voldoen aan de in bijlage II van de richtlijn opgenomen
      fundamentele eisen.
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel3
  - number: '4'
    text: |-
      Persoonlijke beschermingsmiddelen die voldoen aan de door Onze Minister aangewezen normen en die met inachtneming
      van de procedures, genoemd in [artikel 5][ref1], zijn voorzien van de CE-markering, bedoeld in bijlage IV van
      de richtlijn, en waarvoor de EG-verklaring van overeenstemming, bedoeld in bijlage VI van de richtlijn, alsmede,
      indien van toepassing, de verklaring van EG-typeonderzoek, kan worden overgelegd, worden vermoed te voldoen aan het
      in [artikel 3, tweede volzin][ref2], bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0005570#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005570#Artikel3
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005570
        artikel: '5'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005570
        artikel: '3'
        hoofdstuk: '2'
  - number: '5.1'
    text: |-
      Persoonlijke beschermingsmiddelen zijn onderworpen aan een certificeringsprocedure overeenkomstig het in dit
      artikel bepaalde en zijn voorzien van de in bijlage IV van de richtlijn bedoelde aanduiding, houdende de CE-
      markering, alsmede van het identificatienummer krachtens artikel 9, eerste lid, van de richtlijn toegekend
      aan een aangewezen aangemelde instelling. Indien een certificeringsprocedure de afgifte van een verklaring
      van EG-typeonderzoek voorschrijft, is het persoonlijke beschermingsmiddel of het model van de persoonlijke
      beschermingsmiddelen waarop dat voorschrift betrekking heeft, gekeurd.
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel5
  - number: '5.2'
    text: 'De in het eerste lid bedoelde CE-markering wordt uitsluitend gebezigd indien:'
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel5
  - number: 5.2.a
    text: 'voor het beschermingsmiddel:'
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel5
  - number: 5.2.a.1e
    text: |-
      een EG-verklaring van overeenstemming als bedoeld in bijlage VI van de richtlijn voorhanden is bij de in
      de Europese Economische Ruimte gevestigde fabrikant, diens in de Europese Economische Ruimte gevestigde
      gevolmachtigde, dan wel, indien geen van beide in de Europese Economische Ruimte is gevestigd, degene die het
      beschermingsmiddel in de Europese Economische Ruimte op de markt brengt, en
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel5
  - number: 5.2.a.2e
    text: |-
      een technisch dossier als bedoeld in bijlage III van de richtlijn bij één van de personen zoals aangegeven onder 1e
      voorhanden is, en
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel5
  - number: 5.2.a.3e
    text: |-
      behoudens voor beschermingsmiddelen, bedoeld in artikel 8, derde lid, van de richtlijn, een EG-type-
      onderzoekverklaring is verkregen als bedoeld in artikel 10 van de richtlijn van een aangewezen aangemelde
      instelling, en
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel5
  - number: 5.2.b
    text: |-
      de vervaardiging van het persoonlijk beschermingsmiddel geschiedt met inachtneming van één van de
      produktiecontrole-procedures, bedoeld in artikel 11 van de richtlijn, wanneer het een persoonlijk
      beschermingsmiddel betreft, dat wordt genoemd in artikel 8, vierde lid, onder a, van de richtlijn, dan wel;
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel5
  - number: 5.2.c
    text: |-
      wanneer het een persoonlijk beschermingsmiddel betreft dat niet wordt genoemd in artikel 8, vierde lid, onder a,
      van de richtlijn, voor elk vervaardigd persoonlijk beschermingsmiddel een EG-verklaring van overeenstemming als
      bedoeld in bijlage VI van de richtlijn voorhanden is bij de in de Europese Economische Ruimte gevestigde fabrikant,
      diens in de Europese Economische Ruimte gevestigde gevolmachtigde, dan wel, indien geen van beide in de Europese
      Economische Ruimte is gevestigd, degene die het beschermingsmiddel in de Europese Economische Ruimte in de handel
      brengt.
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel5
  - number: '5.3'
    text: |-
      Indien persoonlijke beschermingsmiddelen uitsluitend bestemd zijn voor beroepsmatige toepassing, is het eerste
      lid niet van toepassing op onderdelen van de persoonlijke beschermingsmiddelen die bestemd zijn om te worden
      ingebouwd in persoonlijke beschermingsmiddelen of met andere onderdelen te worden samengebouwd tot één persoonlijk
      beschermingsmiddel, mits zij geen wezenlijk onderdeel van persoonlijke beschermingsmiddelen zijn die voor de goede
      werking ervan onmisbaar zijn, en op de samenstellingen dit besluit van toepassing is.
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel5
  - number: '5.4'
    text: |-
      Indien bij de vervaardiging geharmoniseerde normen niet of slechts gedeeltelijk zijn toegepast, of wanneer
      die normen ontbreken, wordt in de verklaring van de aangewezen aangemelde instelling de overeenstemming met de
      fundamentele eisen met inachtneming van de procedure van artikel 10, vierde lid, onder a, tweede gedachtestreepje
      en b, tweede gedachtestreepje, van de richtlijn, vermeld.
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel5
  - number: 5.5.a
    text: |-
      Indien de fabrikant, diens in Nederland gevestigde gevolmachtigde, dan wel, indien geen van beiden in Nederland
      zijn gevestigd, degene die het persoonlijke beschermingsmiddel in Nederland op de markt brengt, voornemens is aan
      het model van een persoonlijke beschermingsmiddel of aan te vervaardigen en in de handel te brengen persoonlijke
      beschermingsmiddelen waarvoor een verklaring van typeonderzoek is afgegeven, wijzigingen aan te brengen, stelt
      hij de aangewezen aangemelde instelling die de verklaring van EG-typeonderzoek heeft afgegeven hiervan onverwijld
      in kennis.
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel5
  - number: 5.5.b
    text: |-
      De in onderdeel a bedoelde aangewezen aangemelde instelling beoordeelt de wijzigingen en deelt de genoemde persoon
      mede of de typeonderzoekverklaring voor het aldus gewijzigde persoonlijke beschermingsmiddel geldig is.
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel5
  - number: 5.5.c
    text: |-
      Indien de in onderdeel a bedoelde aangewezen aangemelde instelling van oordeel is dat de verklaring van EG-
      typeonderzoek voor het gewijzigde persoonlijke beschermingsmiddel niet geldig is, moet dit persoonlijke
      beschermingsmiddel aan een EG-typeonderzoek worden onderworpen.
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel5
  - number: '6.1'
    text: |-
      De in [artikel 5, eerste lid][ref1], bedoelde aanduiding en het in dat lid bedoelde identificatienummer zijn
      duidelijk leesbaar en onuitwisbaar op het persoonlijke beschermingsmiddel, dan wel, indien de kenmerken van het
      persoonlijke beschermingsmiddel dit onmogelijk maken, op de verpakking aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005570#Artikel5
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005570
        artikel: '5'
        hoofdstuk: '3'
  - number: '6.2'
    text: |-
      Ten aanzien van persoonlijke beschermingsmiddelen mogen geen vermeldingen, voorstellingen of aanduidingen
      worden gebezigd welke met de in [artikel 5, eerste lid][ref1], bedoelde aanduiding kunnen worden verward. Op de
      persoonlijke beschermingsmiddelen mogen andere markeringen worden aangebracht op voorwaarde dat de zichtbaarheid en
      de leesbaarheid van de CE-markering niet worden verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0005570#Artikel5
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005570
        artikel: '5'
        hoofdstuk: '3'
  - number: 6a
    text: |-
      Een EG-typeonderzoekverklaring wordt door de aangewezen aangemelde instelling die haar heeft afgegeven ingetrokken
      indien de fundamentele eisen van bijlage II van de richtlijn zodanig zijn gewijzigd dat het model niet aan de
      gewijzigde eisen voldoet.
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel6a
  - number: 6b.1
    text: |-
      Degene die een persoonlijk beschermingsmiddel verhandelt of gebruikt zorgt er voor dat dit in goede staat van
      onderhoud verkeert.
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel6b
  - number: 6b.2
    text: |-
      Het eerste lid is niet van toepassing op degene die een persoonlijk beschermingsmiddel voorhanden heeft dat hetzij
      is afgekeurd, hetzij onklaar gemaakt, hetzij anderszins kennelijk niet meer voor gebruik bestemd is.
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel6b
  - number: 6c
    text: |-
      Artikel 2 is niet van toepassing op het tentoonstellen en demonstreren op (jaar)beurzen, exposities en bij
      demonstraties van persoonlijke beschermingsmiddelen die niet in overeenstemming zijn met dit besluit, mits
      op een zichtbaar bord duidelijk is aangegeven dat ze niet in overeenstemming zijn met dit besluit en niet te
      koop zijn voordat zij door de fabrikant of zijn in de Europese Economische Ruimte gevestigde gevolmachtigde in
      overeenstemming zijn gebracht met dit besluit. Bij demonstraties zijn alle passende veiligheidsmaatregelen genomen
      om de bescherming van de mens te waarborgen.
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel6c
  - number: 6d.1
    text: 'Als aangewezen aangemelde instelling kan worden aangewezen een instelling die:'
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel6d
  - number: 6d.1.a
    text: rechtspersoonlijkheid heeft;
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel6d
  - number: 6d.1.b
    text: haar zetel of een vestiging in Nederland heeft;
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel6d
  - number: 6d.1.c
    text: |-
      onafhankelijk is van degenen die bij het resultaat van de uitvoering van de taken waarvoor zij is aangewezen belang
      hebben;
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel6d
  - number: 6d.1.d
    text: |-
      beschikt over voldoende deskundigheid en outillage om de uitvoering van de taken waarvoor zij is aangewezen, naar
      behoren te kunnen vervullen;
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel6d
  - number: 6d.1.e
    text: |-
      beschikt over een behoorlijke administratie waarin de gegevens die samenhangen met en betrekking hebben op de
      uitvoering van haar taken, op een systematische wijze zijn vastgelegd. Aan de hand van deze gegevens zijn de
      gekeurde persoonlijke beschermingsmiddelen en de onderzochte kwaliteitssystemen afdoende te identificeren;
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel6d
  - number: 6d.1.f
    text: naar behoren functioneert.
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel6d
  - number: 6d.2
    text: |-
      In aanvulling op het eerste lid komen voor een aanwijzing als aangewezen aangemelde instelling slechts in
      aanmerking instellingen die ten minste voldoen aan de in bijlage V van de richtlijn neergelegde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel6d
  - number: 6d.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel6d
  - number: 6e
    text: |-
      De instelling verstrekt jaarlijks aan Onze Minister een afschrift van de polis van de afgesloten verzekering tegen
      wettelijke aansprakelijkheid tegen alle risico's die voortvloeien uit de uitoefening van de taken waarvoor zij
      is aangewezen.
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel6e
  - number: 6f.1
    text: |-
      Indien een wijziging plaatsvindt in de gegevens op grond waarvan de instelling is aangewezen, doet de instelling
      hiervan terstond mededeling aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel6f
  - number: 6f.2
    text: |-
      Indien een instelling voornemens is een of meer van de taken waarvoor zij is aangewezen, te beëindigen, doet de
      instelling hiervan terstond mededeling aan Onze Minister en de certificaathouders. In dat geval worden door de
      instelling de gegevens, bedoeld in [artikel 6d, eerste lid, onder e][ref1], overgedragen aan Onze Minister dan
      wel, na toestemming van Onze Minister en de certificaathouders, een andere instelling die voor dezelfde taken is
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005570#Artikel6d
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel6f
    references:
      - id: ref1
        bwb_id: BWBR0005570
        artikel: 6d
        hoofdstuk: '5'
  - number: 6g.1
    text: |-
      Een aanvraag om aanwijzing gaat vergezeld van het bewijs dat is voldaan aan de criteria, bedoeld in
      [artikel 6d, eerste lid][ref1], dan wel in geval van [artikel 6d, tweede lid][ref2], tevens van bewijs dat is
      voldaan aan de voorwaarden, bedoeld in dat lid, dan wel van een verklaring waaruit de bereidheid blijkt om voor
      eigen rekening een onderzoek naar het voldoen aan deze criteria dan wel voorwaarden te ondergaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005570#Artikel6d
      [ref2]: https://wetten.overheid.nl/BWBR0005570#Artikel6d
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel6g
    references:
      - id: ref1
        bwb_id: BWBR0005570
        artikel: 6d
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005570
        artikel: 6d
        hoofdstuk: '5'
  - number: 6g.2
    text: |-
      Een aanwijzing kan worden geweigerd, dan wel worden gewijzigd of ingetrokken, indien niet of niet volledig is
      voldaan aan de bij de wet of bij of krachtens dit besluit gestelde voorschriften. Een aanwijzing kan worden
      ingetrokken indien de instelling gedurende een aaneengesloten periode van twee jaar geen werkzaamheden, waarvoor
      zij is aangewezen, heeft uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel6g
  - number: 6g.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel6g
  - number: '7.1'
    text: Het Redding- en Zwemvestenbesluit (Warenwet) (*Stb.* 1982, 469) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel7
  - number: '7.2'
    text: Het Helmenbesluit (Warenwet) (*Stb.* 1975, 517) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel7
  - number: '9.1'
    text: |-
      Een wijziging van een van de bijlagen van de richtlijn waarnaar in dit besluit wordt verwezen, treedt voor de
      toepassing van de bij of krachtens dit besluit gestelde regels in werking met ingang van de dag waarop aan de
      betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel9
  - number: '9.2'
    text: |-
      De vaststelling of wijziging van specifieke voorschriften als bedoeld in [artikel 1, derde lid, onder a][ref1],
      wordt door Onze Minister bekend gemaakt in de Nederlandse Staatscourant. Hij vermeldt daarbij met ingang van
      welke datum deze voorschriften of de wijzigingen daarvan worden toegepast met betrekking tot welke persoonlijke
      beschermingsmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005570#Artikel1
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005570
        artikel: '1'
        hoofdstuk: '1'
  - number: '10'
    text: Dit besluit kan worden aangehaald als Warenwetbesluit persoonlijke beschermingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel10
  - number: '11.1'
    text: |-
      De [artikelen 3][ref1] en [5][ref2] zijn niet van toepassing op persoonlijke beschermingsmiddelen die voldoen
      aan de wettelijke voorschriften zoals die luidden op 24 augustus 1993 en die voor 1 juli 1995 in de handel zijn
      gebracht en in gebruik genomen en voor die datum niet zijn voorzien van de CE-markering.


      [ref1]: https://wetten.overheid.nl/BWBR0005570#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005570#Artikel5
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005570
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005570
        artikel: '5'
        hoofdstuk: '3'
  - number: '11.2'
    text: |-
      Met betrekking tot persoonlijke beschermingsmiddelen als bedoeld in het eerste lid, waarop dit besluit niet wordt
      toegepast en waarop ingevolge een of meer andere wettelijke regelingen de CE-markering wordt aangebracht, worden op
      de bij die persoonlijke beschermingsmiddelen gevoegde documenten, handleidingen of gebruiksaanwijzingen de in het
      *Publikatieblad van de Europese Gemeenschappen* bekendgemaakte referenties van de aan die wettelijke regelingen ten
      grondslag liggende richtlijnen vermeld.
    url: https://wetten.overheid.nl/BWBR0005570/2003-09-01#Artikel11
