  - number: '1.2'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt mede verstaan onder militair: degene die is aangesteld in
      burgerlijke openbare dienst om bij de krijgsmacht als geestelijk verzorger werkzaam te zijn.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel1
  - number: '1.3'
    text: |-
      Met inachtneming van [artikel 1, derde en vierde lid, van het Algemeen militair ambtenarenreglement][ref1] wordt in
      dit besluit en de daarop berustende bepalingen mede verstaan onder echtgenote of echtgenoot:


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel1
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '1'
  - number: 1.3.1°
    text: de geregistreerde partner;
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel1
  - number: 1.3.2°
    text: |-
      degene die door de militair als partner is aangemeld bij de Stichting Pensioenfonds ABP en door het bestuur van dat
      fonds als zodanig is aangemerkt, op voorwaarde dat de militair een bewijs van die aanmelding heeft overgelegd aan
      de commandant;
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel1
  - number: '1.4'
    text: 'Voor de toepassing van dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel1
  - number: 1.4.a
    text: |-
      fase één: fase één als bedoeld in
      [artikel 1, eerste lid, onderdeel l van het Algemeen militair ambtenarenreglement][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel1
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '1'
  - number: 1.4.b
    text: |-
      fase twee: fase twee als bedoeld in
      [artikel 1, eerste lid, onderdeel m van het Algemeen militair ambtenarenreglement][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel1
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '1'
  - number: 1.4.c
    text: |-
      fase drie: fase drie als bedoeld in
      [artikel 1, eerste lid, onderdeel n van het Algemeen militair ambtenarenreglement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel1
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '1'
  - number: '2.1'
    text: |-
      Onze Minister kan in geval van buitengewone omstandigheden, als bedoeld in
      [artikel 1, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref1], tijdelijk afwijken van hetgeen
      bij of krachtens dit besluit is bepaald, indien en voor zolang dit met het oog op de goede uitvoering van de
      operationele taken van de krijgsmacht noodzakelijk wordt geacht.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel1
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '1'
  - number: '2.2'
    text: |-
      Bij ministeriële regeling kunnen voorts afwijkende regelen worden gesteld ten aanzien van militairen, die zijn
      tewerkgesteld of ingezet:
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel2
  - number: 2.2.a
    text: onder leiding of toezicht van een orgaan van de Verenigde Naties;
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel2
  - number: 2.2.b
    text: bij of ten behoeve van een bondgenootschappelijk orgaan of bondgenootschappelijke strijdkrachten;
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel2
  - number: 2.2.c
    text: |-
      ten behoeve van operaties in het kader van internationale overeenkomsten of andere verplichtingen door Nederland
      aangegaan;
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel2
  - number: 2.2.d
    text: buiten het Ministerie van Defensie anders dan in de gevallen, bedoeld onder a, b en c.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel2
  - number: '3.1'
    text: |-
      Voor zover in dit besluit niet anders is bepaald, heeft de militair aanspraak op inkomsten voor elke dag dat hij in
      werkelijke dienst is; daarbij wordt een gedeelte van een dag aangemerkt als een volle dag.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel3
  - number: '3.2'
    text: |-
      Bij de vaststelling van inkomsten die zijn uitgedrukt per maand wordt een maand gesteld op dertig dagen. Bij de
      berekening over een gedeelte van een maand wordt het bedrag per dag vastgesteld door het maandbedrag te delen door
      dertig. Een wijziging van inkomsten op de eenendertigste van een maand gaat in op de eerste dag van de volgende
      maand.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel3
  - number: '3.3'
    text: |-
      Tenzij anders is bepaald, kan op inkomsten die zijn uitgedrukt per dag of per tijdseenheid van langere duur en
      die niet tot de bezoldiging behoren, slechts aanspraak bestaan voor de tijd dat aanspraak bestaat op bezoldiging.
      Bedoelde inkomsten worden dan toegekend in evenredigheid met de bezoldiging waarop aanspraak bestaat.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel3
  - number: '3.4'
    text: |-
      De militair aangesteld bij het reservepersoneel, die in werkelijke dienst is op grond van
      [artikel 12l, derde lid, van de Militaire ambtenarenwet 1931][ref1] heeft geen aanspraak op inkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel12l
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: 12l
  - number: '3.5'
    text: |-
      De bezoldiging van de militair aangesteld bij het reservepersoneel in werkelijke dienst bedraagt per feitelijk
      gewerkt uur 1/165e van de maandbezoldiging, met een maximum van 165 uren per maand.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel3
  - number: '3.6'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de vaststelling van de inkomsten
      van de militair aangesteld bij het reservepersoneel.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel3
  - number: '4.1'
    text: |-
      De opleidingstabel, bedoeld in [bijlage A][ref1], is van toepassing op militairen die het algemene deel van hun
      eerste initiële opleiding nog niet hebben afgerond.


      [ref1]: https://wetten.overheid.nl/BWBR0007816
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007816
  - number: '4.2'
    text: |-
      De salaristabel, bedoeld in [bijlage B][ref1], is van toepassing op militairen op wie de opleidingstabel, bedoeld
      in het eerste lid, niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0007816
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007816
  - number: '4.3'
    text: |-
      Bij ministeriële regeling wordt per initiële opleiding vastgesteld wat onder het algemene deel van de initiële
      opleiding, bedoeld in het eerste lid, wordt verstaan.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel4
  - number: '5'
    text: 'De militair heeft aanspraak op een salaris dat wordt bepaald met inachtneming van:'
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel5
  - number: 5.a
    text: het krijgsmachtdeel waartoe diegene behoort;
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel5
  - number: 5.b
    text: diens rang en
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel5
  - number: 5.c
    text: diens salaristrede.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel5
  - number: '6.1'
    text: |-
      De bevoegdheid tot het toekennen van aanspraken op grond van de [artikelen 7][ref1], [8][ref2], [12][ref3],
      [12a][ref4] en [13][ref5] aan militairen met de rang van kapitein ter zee/kolonel en hoger berust bij de
      Secretaris-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007816#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0007816#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0007816#Artikel12a
      [ref5]: https://wetten.overheid.nl/BWBR0007816#Artikel13
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007816
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007816
        artikel: '12'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0007816
        artikel: 12a
        hoofdstuk: '3'
      - id: ref5
        bwb_id: BWBR0007816
        artikel: '13'
        hoofdstuk: '3'
  - number: '6.2'
    text: |-
      De militair met de rang van vice-admiraal, luitenant-generaal, luitenant-admiraal of generaal heeft aanspraak op
      een eindejaarsuitkering van 8,3% van de door hem genoten bezoldiging.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel6
  - number: '7.1'
    text: |-
      Het hoofd defensieonderdeel kent aan de militair op wie de opleidingstabel van toepassing is met gebruikmaking van
      deze opleidingstabel een salaris toe op basis van de alsdan geldende rang en leeftijd.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel7
  - number: '7.2'
    text: |-
      Het hoofd defensieonderdeel kent aan de militair op wie de salaristabel van toepassing is met gebruikmaking van
      deze salaristabel een salaristrede toe binnen de bij diens rang behorende salarisschaal op basis van de kennis en
      ervaring van de militair.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel7
  - number: '7.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de uitvoering van het tweede lid van dit
      artikel.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel7
  - number: 7a
    text: |-
      De militair op wie de opleidingstabel van toepassing is, wordt met gebruikmaking van deze opleidingstabel met
      ingang van de eerste dag van de maand waarin deze jarig is dan wel wordt bevorderd, opnieuw ingeschaald op basis
      van de alsdan geldende leeftijd of rang.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel7a
  - number: 7b.1
    text: |-
      Het hoofd defensieonderdeel kent de militair op wie de opleidingstabel niet langer van toepassing is, vanaf dat
      moment met gebruikmaking van de salaristabel salaristrede 0 toe behorend bij diens rang.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel7b
  - number: 7b.2
    text: |-
      Indien bij de overgang van de opleidingstabel naar de salaristabel, bedoeld in het eerste lid, blijkt dat sprake is
      van een opleidingsvertraging die niet aan de militair is toe te rekenen, vindt inschaling in de salaristabel plaats
      met ingang van de dag waarop de opleidingstabel zonder de eerdergenoemde vertraging niet langer op de militair van
      toepassing zou zijn geweest.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel7b
  - number: 7b.3
    text: |-
      In aanvulling op het eerste en tweede lid, kan aan specifieke categorieën personeel een verhoging van de
      salaristrede binnen de salarisschaal behorend bij de van toepassing zijnde rang worden toegekend.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel7b
  - number: 7b.4
    text: Bij ministeriële regeling worden nadere regels gesteld over de uitvoering van het derde lid.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel7b
  - number: 7c.1
    text: |-
      De salaristrede van de militair op wie de salaristabel van toepassing is, wordt met gebruikmaking van deze
      salaristabel en voor zover de maximale salaristrede van de voor de militair van toepassing zijnde salarisschaal
      nog niet is bereikt, jaarlijks met één salaristrede verhoogd, indien de militair naar het oordeel van het hoofd
      defensieonderdeel de functie naar behoren vervult.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel7c
  - number: 7c.2
    text: |-
      De verhoging van de salaristrede, bedoeld in het eerste lid, vindt voor de eerste maal plaats met ingang van
      de eerste dag van de maand waarin een jaar is verstreken sinds de overgang van de opleidingstabel naar de
      salaristabel, bedoeld in [artikel 7b, eerste of tweede lid][ref1], en nadien telkens na één jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel7b
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: 7b
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 7c.3
    text: |-
      Het hoofd defensieonderdeel kan, in aanvulling op het eerste lid, een verhoging van één of meer salaristredes
      toekennen binnen de salarisschaal behorend bij diens rang toekennen aan de militair, indien de militair naar het
      oordeel van het hoofd defensieonderdeel de functie zeer goed of uitstekend vervult.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel7c
  - number: 7c.4
    text: |-
      De verhoging, bedoeld in het derde lid, kan op elk gewenst moment plaatsvinden zonder dat dit van invloed is op de
      maand, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel7c
  - number: 7c.5
    text: |-
      Het hoofd defensieonderdeel kan de verhoging van de salaristrede, bedoeld in het eerste lid, achterwege laten,
      indien de militair niet naar behoren functioneert.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel7c
  - number: '8.1'
    text: |-
      Aan de militair op wie de salaristabel van toepassing is, wordt bij een bevordering als bedoeld in de
      [artikelen 24][ref1] en [24a van het Algemeen militair ambtenarenreglement][ref2] met gebruikmaking van deze
      salaristabel met ingang van de eerste dag van de maand waarin de bevordering plaatsvindt, de salaristrede toegekend
      van het naast hogere bedrag in de salarisschaal van diens rang na de bevordering.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel24a
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: 24a
  - number: '8.2'
    text: |-
      Bij samenloop in dezelfde maand van de toekenning van een salaristrede, bedoeld in het eerste lid, en de
      verhoging van de salaristrede, bedoeld in [artikel 7c, eerste lid][ref1], wordt eerst uitvoering gegeven aan de
      toekenning van een salaristrede op grond het eerste lid en daarna wordt uitvoering gegeven aan de verhoging van de
      salaristrede op grond van artikel 7c, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel7c
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: 7c
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '8.3'
    text: |-
      Bij de Koninklijke landmacht, Koninklijke luchtmacht en Koninklijke marechaussee wordt de salaristrede binnen de
      salarisschaal met één verhoogd bij de bevordering van:
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel8
  - number: 8.3.a
    text: korporaal naar korporaal der eerste klasse;
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel8
  - number: 8.3.b
    text: marechaussee der tweede klasse naar marechaussee der eerste klasse;
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel8
  - number: 8.3.c
    text: sergeant naar sergeant der eerste klasse;
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel8
  - number: 8.3.d
    text: wachtmeester naar wachtmeester der eerste klasse en
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel8
  - number: 8.3.e
    text: tweede luitenant naar eerste luitenant.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel8
  - number: '8.4'
    text: |-
      Bij de Koninklijke marine wordt, na dezelfde periode waarop vergelijkbare rangen van de andere krijgsmachtdelen als
      bedoeld in het derde lid worden bevorderd, aan de matroos der eerste klasse, de korporaal dan wel de luitenant ter
      zee der 2e klasse de salaristrede binnen de salarisschaal met één verhoogd.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel8
  - number: '8.5'
    text: |-
      De verhoging van de salaristrede, bedoeld in het derde of het vierde lid, vindt onverkort plaats naast de verhoging
      van de salaristrede, bedoeld in [artikel 7c, eerste en derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel7c
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: 7c
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '9.1'
    text: |-
      Een militair wiens salaris vermindering ondergaat, heeft aanspraak op een overbruggingstoelage ten bedrage van die
      vermindering, indien hij:
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel9
  - number: 9.1.a
    text: |-
      na een verandering in zijn dienstverhouding tot het Rijk - in verband met het volgen van een opleiding wordt
      aangesteld in een lagere rang; of
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel9
  - number: 9.1.b
    text: na overgang naar een ander krijgsmachtdeel aanspraak heeft op een lager salaris.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel9
  - number: '9.2'
    text: |-
      Een militair, voor wie na bevordering de functioneringstoelage is vervallen, of het bedrag ervan op nul is gesteld,
      heeft aanspraak op een overbruggingstoelage indien hij na bevordering aanspraak heeft op een salaris dat lager
      is dan het salaris vermeerderd met de functioneringstoelage waarop hij direct voorafgaande aan die bevordering
      aanspraak had, ten bedrage van deze vermindering.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel9
  - number: '9.3'
    text: |-
      Indien het salaris van de militair aan wie een overbruggingstoelage is toegekend, wordt verhoogd anders dan op
      grond van een algemene salarismaatregel, wordt de overbruggingstoelage met het bedrag van die verhoging verminderd.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel9
  - number: '9.4'
    text: |-
      Geen aanspraak op een overbruggingstoelage wordt verleend, dan wel de aanspraak op de toegekende
      overbruggingstoelage vervalt, indien de militair na een tijdelijke rang te hebben bekleed, de rang herkrijgt die
      hij had voordat hij tijdelijk werd bevorderd.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel9
  - number: '9.5'
    text: |-
      De aanspraak op de in het tweede lid bedoelde overbruggingstoelage eindigt op de datum waarop de toegekende
      functioneringstoelage volgens de toekenningsbeschikking zou eindigen.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel9
  - number: 10a.1
    text: |-
      Het hoofd defensieonderdeel kent aan de militair die op 1 januari 2023 reeds was aangesteld en op wie met ingang
      van 1 januari 2023 de opleidingstabel van toepassing is met gebruikmaking van de opleidingstabel een salaris toe op
      basis van de alsdan geldende rang en leeftijd.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel10a
  - number: 10a.2
    text: |-
      Indien het op 31 december 2022 geldende salaris hoger was dan het voor de militair geldende salaris na inschaling
      in de opleidingstabel op 1 januari 2023, vindt toepassing plaats van de aanvullende maatregelen, bedoeld in
      [artikel 16, onderdeel j][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel16
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '16'
        hoofdstuk: '3'
  - number: 10b
    text: |-
      Het hoofd defensieonderdeel kent de militair, bedoeld in [artikel 10a][ref1], op het moment dat de opleidingstabel
      niet langer van toepassing is, met gebruikmaking van de salaristabel, een salaristrede toe behorende bij diens
      rang, onder toepassing van de aanvullende maatregelen, bedoeld in [artikel 16, onderdeel j][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0007816#Artikel16
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: 10a
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007816
        artikel: '16'
        hoofdstuk: '3'
  - number: 10c.1
    text: |-
      Het hoofd defensieonderdeel kent aan de militair die op 1 januari 2023 reeds was aangesteld en op wie met ingang
      van 1 januari 2023 de salaristabel van toepassing is met gebruikmaking van de salaristabel een salaristrede toe
      binnen de bij diens rang behorende salarisschaal op basis van de transitietabel, bedoeld in [bijlage C][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007816
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0007816
  - number: 10c.2
    text: |-
      De maand waarin de jaarlijkse verhoging van de salaristrede op grond van [artikel 7c, tweede lid][ref1],
      plaatsvind, blijft voor de militair, bedoeld in het eerste lid, gelijk aan die van voor de transitie op 1 januari
      2023.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel7c
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: 7c
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 10d.1
    text: |-
      Bij samenloop van transitie en een bevordering op grond van de [artikelen 24][ref1] of
      [24a van het Algemeen militair ambtenarenreglement][ref2] op 1 januari 2023, wordt uitvoering gegeven aan de voor
      de militair meest gunstige volgorde.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel24a
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel10d
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: 24a
  - number: 10d.2
    text: |-
      Bij samenloop van de transitie, bedoeld in [artikel 10c][ref1], en de verhoging van de salaristrede, bedoeld in
      [artikel 7c, eerste lid][ref2], in de maand januari 2023, wordt eerst uitvoering gegeven aan die transitie en
      daarna wordt uitvoering gegeven aan die verhoging van de salaristrede.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel10c
      [ref2]: https://wetten.overheid.nl/BWBR0007816#Artikel7c
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel10d
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: 10c
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007816
        artikel: 7c
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 10e.1
    text: |-
      Het hoofd defensieonderdeel kent aan de militair met de rang van kapitein, majoor dan wel luitenant-kolonel
      respectievelijk luitenant ter zee der tweede klasse oudste categorie, luitenant ter zee der eerste klasse dan wel
      kapitein-luitenant ter zee die tussen 1 januari 2023 en 31 december 2032 voor de eerste maal wordt bevorderd naar
      de naast hogere rang, extra salaristreden toe binnen de salarisschaal behorend bij diens rang op basis van de
      overgangsmaatregelen loongebouw, bedoeld in [bijlage D][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007816
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel10e
    references:
      - id: ref1
        bwb_id: BWBR0007816
  - number: 10e.2
    text: |-
      Het hoofd defensieonderdeel kent aan de militair die op 1 januari 2023 in opleiding is tot officier en reeds voor
      1 juli 2022 in deze opleiding was ingestroomd dan wel zich hiervoor had ingeschreven, op verzoek van de militair
      een compensatie toe op het moment dat de opleiding tot officier met goed gevolg is afgerond en de bevordering tot
      de bijbehorende officiersrang heeft plaatsgevonden, indien:
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel10e
  - number: 10e.2.a
    text: |-
      de salaristabel geldend op 1 januari 2023 langer dan 48 maanden een lager salaris oplevert dan het salaris op grond
      van de salaristabel geldend voor 1 januari 2023 en het cumulatieve salaris in deze maanden eveneens lager is dan
      het cumulatieve salaris in dezelfde periode op grond van de salaristabel geldend voor 1 januari 2023; of
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel10e
  - number: 10e.2.b
    text: |-
      het cumulatieve salaris in de salaristabel geldend op 1 januari 2023 gemeten over 84 maanden met ingang van 1 juli
      2022 lager is dan het cumulatieve salaris in dezelfde periode op grond van de salaristabel geldend voor 1 januari
      2023.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel10e
  - number: 10e.3
    text: |-
      De compensatie, bedoeld in het tweede lid, bestaat uit het toekennen van het aantal salaristreden dat benodigd is
      om de situaties beschreven in het tweede lid, onderdelen a en b, niet langer te overschrijden.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel10e
  - number: 10e.4
    text: |-
      De compensatie, bedoeld in het tweede lid en derde lid, kan op verzoek van de militair ook worden toegekend bij
      de daaropvolgende bevordering, indien wederom sprake is van een van de situaties beschreven in het tweede lid,
      onderdelen a en b.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel10e
  - number: '11.1'
    text: |-
      De militair die is belast met de volledige waarneming van een functie, bedoeld in
      [artikel 22, eerste lid, van het Algemeen militair ambtenarenreglement][ref1], heeft, indien aan die functie een
      hogere rang is verbonden, voor de duur van de waarneming aanspraak op een waarnemingstoelage.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel22
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '22'
  - number: '11.2'
    text: |-
      De toelage wordt toegekend, indien de waarneming ten minste een tijdvak van dertig aaneengesloten dagen heeft
      geduurd.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel11
  - number: '11.3'
    text: |-
      Het bedrag van de toelage is gelijk aan het verschil tussen de bezoldiging waarop de militair aanspraak heeft
      en de bezoldiging waarop hij aanspraak zou hebben, indien de waargenomen functie hem zou zijn toegewezen en hij
      dientengevolge zou zijn bevorderd tot de aan die functie verbonden rang.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel11
  - number: 11b.1
    text: |-
      Ter zake van extra beslaglegging ontvangt de militair een maandelijkse toelage, bestaande uit een percentage van de
      voor hem geldende bezoldiging.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel11b
  - number: 11b.2
    text: |-
      In afwijking van het eerste lid wordt voor de militair die aanspraak heeft op een afwijkende bezoldiging de toelage
      verminderd overeenkomstig de mate waarin die bezoldiging afwijkt van de bezoldiging bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel11b
  - number: 11b.3
    text: |-
      Het percentage bedoeld in het eerste lid, wordt bepaald aan de hand van het maandbedrag van de bezoldiging, volgens
      onderstaande tabel:







                    bezoldiging


                    percentage






                    t/m


                    € 3.604,16


                    9,30%




                    van


                    € 3.604,17 t/m € 4.120,21


                    8,80%




                    van


                    € 4.120,22 t/m € 4.829,56


                    7,70%




                    van


                    € 4.829,57 t/m € 8.016,18


                    6,30%




                    vanaf


                    € 8.016,19


                    4,60%
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel11b
  - number: 11b.4
    text: 'Onder een afwijkende bezoldiging bedoeld in het tweede lid wordt verstaan de bezoldiging in geval van:'
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel11b
  - number: 11b.4.a
    text: ongeoorloofde afwezigheid;
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel11b
  - number: 11b.4.b
    text: vermissing;
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel11b
  - number: 11b.4.c
    text: verlof;
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel11b
  - number: 11b.4.d
    text: ziekte;
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel11b
  - number: 11b.4.e
    text: schorsing, vrijheidsstraf of voorlopige hechtenis.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel11b
  - number: '12.1'
    text: |-
      De commandant operationeel commando kan aan een militair in fase twee of drie, die zich verbindt om gedurende een
      bepaalde periode onafgebroken deel uit te maken van het beroepspersoneel, een bindingspremie toekennen.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel12
  - number: '12.2'
    text: Bij ministeriële regeling worden regels gesteld omtrent de toekenning van een bindingspremie.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel12
  - number: 12a.1
    text: |-
      Het hoofd defensieonderdeel kan aan een militair, die is aangesteld bij het beroepspersoneel en het voor hem
      geldende maximumsalaris heeft bereikt, een functioneringstoelage toekennen, indien de wijze van functioneren van
      die militair daartoe naar het oordeel van het hoofd defensieonderdeel aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel12a
  - number: 12a.2
    text: De functioneringstoelage wordt toegekend voor een periode van tenminste één jaar.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel12a
  - number: 12a.3
    text: De functioneringstoelage bedraagt ten hoogste 10 procent van het voor de militair geldende salaris.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel12a
  - number: 12a.4
    text: |-
      Indien de militair, die een functioneringstoelage geniet, wordt bevorderd, niet zijnde een tijdelijke bevordering,
      komt de functioneringstoelage met ingang van de datum van de bevordering te vervallen.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel12a
  - number: 12a.5
    text: |-
      Indien de militair, die een functioneringstoelage geniet, tijdelijk wordt bevorderd, wordt het bedrag van de
      functioneringstoelage gedurende de tijd dat hij de tijdelijke rang bekleedt, op nul gesteld.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel12a
  - number: 12b.1
    text: |-
      Onder toepassing van [artikel 53g van het Algemeen militair ambtenarenreglement][ref1] wordt aan de militair die
      behoort tot een bij ministeriële regeling vastgestelde categorie personeel, een premie ter stimulering van het
      behoud van de militair toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel53g
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 53g
  - number: 12b.2
    text: Bij ministeriële regeling worden regels gesteld omtrent de hoogte en de wijze van toekenning van een behoudpremie.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel12b
  - number: 12c.1
    text: |-
      Onder toepassing van [artikel 53g van het Algemeen militair ambtenarenreglement][ref1] komt de militair op aanvraag
      in aanmerking voor een stimuleringspremie indien op aanvraag eervol ontslag wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel53g
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 53g
  - number: 12c.2
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de hoogte en de wijze van toekenning van een
      stimuleringspremie.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel12c
  - number: '13.1'
    text: |-
      De commandant kan aan de militair die zich tijdens het verblijf in werkelijke dienst bijzonder heeft onderscheiden
      door optreden of gedragingen dan wel door buitengewone toewijding of bijzondere loffelijke dienstverrichtingen,
      naar bij ministeriële regeling te stellen regels, één of meer van de onderstaande beloningen toekennen:
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel13
  - number: 13.1.a
    text: geschenk;
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel13
  - number: 13.1.b
    text: geldelijke beloning;
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel13
  - number: 13.1.c
    text: functioneringsgratificatie.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel13
  - number: '13.2'
    text: Het maximumbedrag van de beloningen wordt bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel13
  - number: 13a.1
    text: |-
      Aan de militair die met goed gevolg zijn initiële opleiding heeft volbracht kan naar bij ministeriële regeling te
      stellen regels een aanstellingspremie worden toegekend.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel13a
  - number: 13a.2
    text: |-
      Indien de in het eerste lid bedoelde militair tijdens fase één ontslag wordt verleend, betaalt hij de toegekende
      premie op een door Onze minister te bepalen wijze terug.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel13a
  - number: 13a.3
    text: |-
      Indien het in het tweede lid bedoelde ontslag niet of niet geheel aan de militair valt te verwijten kan Onze
      Minister in afwijking van het tweede lid bepalen dat de toegekende premie gedeeltelijk of niet behoeft te worden
      terugbetaald.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel13a
  - number: '14.1'
    text: |-
      De militair met aanspraak op salaris heeft aanspraak op een vakantie-uitkering ten bedrage van 8 procent van de
      door hem genoten bezoldiging, in voorkomend geval vermeerderd met:
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel14
  - number: 14.1.a
    text: de waarnemingstoelage;
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel14
  - number: 14.1.b
    text: |-
      de toelage officieren-arts, -tandarts, of -apotheker, zodra deze laatstelijk gedurende vijf jaren onafgebroken
      is genoten;
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel14
  - number: 14.1.c
    text: de brevettoelage voor het vervullen van een eerste partij bij de marinierskapel der Koninklijke marine;
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel14
  - number: 14.1.d
    text: de brevettoelage voor het vervullen van een solistenpartij bij de marinierskapel der Koninklijke marine;
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel14
  - number: 14.1.e
    text: de vliegtoelage of de garantievliegtoelage;
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel14
  - number: 14.1.f
    text: de toelage woninghuur Koninklijke marechaussee;
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel14
  - number: 14.1.g
    text: |-
      het emolument van kleermakers, schoenmakers en barbiers der zeemacht, bedoeld in
      [artikel 23a, eerste lid, onderdeel l][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel23a
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: 23a
        hoofdstuk: 4a
  - number: 14.1.h
    text: de toelage Huis van Hare Majesteit de Koningin.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel14
  - number: '14.2'
    text: 'het minimumbedrag per maand van de vakantie-uitkering is voor de militair:'
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel14
  - number: 14.2.a
    text: 'van 19 jaar of jonger: € 131,87;'
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel14
  - number: 14.2.b
    text: 'van 20 jaar: € 150,70;'
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel14
  - number: 14.2.c
    text: 'van 21 jaar: € 169,54;'
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel14
  - number: 14.2.d
    text: 'van 22 jaar of ouder: € 188,38.'
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel14
  - number: '14.3'
    text: |-
      Ten aanzien van de militair op wie [artikel 17, eerste lid][ref1], van toepassing is, wordt voor de toepassing
      van dit artikel uitgegaan van de inkomsten waarop die militair aanspraak zou hebben, indien de verhindering tot
      dienstverrichting niet was ingetreden.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel17
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '17'
        hoofdstuk: '4'
  - number: '14.4'
    text: |-
      Indien de militair - anders dan op grond van [artikel 17][ref1] - aanspraak heeft op een gedeelte van de voor hem
      geldende inkomsten, wordt het in het tweede lid bedoelde bedrag naar evenredigheid verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel17
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '17'
        hoofdstuk: '4'
  - number: '15'
    text: |-
      De militair met een lagere rang dan vice-admiraal of luitenant-generaal heeft aanspraak op een eindejaarsuitkering
      van 8,33% van de door hem genoten bezoldiging.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel15
  - number: 15a.1
    text: |-
      In dit artikel wordt verstaan onder: - *pensioengevend inkomen:* de som van de inkomensbestanddelen die op grond
      van de pensioenregeling voor militairen die geldt tot 1 januari 2019 pensioengevend zijn voor de opbouw van
      aanspraken op ouderdomspensioen en het daarvan afgeleide partnerpensioen en wezenpensioen;
        - *aftoppingsgrens:* de aftoppingsgrens van het pensioengevend inkomen op basis van
      [artikel 18ga van de Wet op de loonbelasting 1964][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18ga
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18ga
  - number: 15a.2
    text: |-
      De militair heeft aanspraak op een uitkering indien zijn pensioengevend inkomen wordt afgetopt op basis van
      [artikel 18ga van de Wet op de loonbelasting 1964][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18ga
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18ga
  - number: 15a.3
    text: |-
      De gewezen militair die een uitkering ontvangt op grond van de Uitkeringswet gewezen militairen
      heeft aanspraak op een uitkering indien zijn pensioengevend inkomen wordt afgetopt op basis van
      [artikel 18ga van de Wet op de loonbelasting 1964][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18ga
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18ga
  - number: 15a.4
    text: |-
      De uitkering, bedoeld in het tweede lid, wordt berekend door het werkgeversdeel van de premie voor ouderdoms- en
      nabestaandenpensioen te vermenigvuldigen met het pensioengevend inkomen boven de aftoppingsgrens.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel15a
  - number: 15a.5
    text: |-
      De uitkering, bedoeld in het derde lid, wordt berekend door vijftig procent van het werkgeversdeel van de
      premie voor ouderdoms- en nabestaandenpensioen te vermenigvuldigen met het pensioengevend inkomen boven de
      aftoppingsgrens.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel15a
  - number: 15a.6
    text: |-
      Dit artikel is niet van toepassing op militairen, en gewezen militairen, wier salarissen de ontwikkeling volgen van
      de sector Rijk.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel15a
  - number: 15b.1
    text: |-
      De militair aangesteld bij het beroepspersoneel, die op 31 december 2018 en op 1 januari 2019 in werkelijke
      dienst was, heeft, op het moment van transitie naar de middelloonregeling militairen per 1 januari 2019 en
      bij de eerstvolgende twee bevorderingen, voor zover deze bevorderingen plaatsvinden vóór 1 januari 2039 en de
      militair op die bevorderingsmomenten vanaf 1 januari 2019 doorlopend in werkelijke dienst is geweest, aanspraak
      op een compensatie van – indien van toepassing – een verminderd pensioenvooruitzicht in toekomstige jaren door de
      invoering van de middelloonregeling militairen.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel15b
  - number: 15b.2
    text: Bij ministeriële regeling worden nadere regels gesteld omtrent de compensatie, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel15b
  - number: '16'
    text: 'Bij ministeriële regeling kan de militair aanspraak worden verleend op:'
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel16
  - number: 16.a
    text: |-
      een toelage in verband met het vervullen van een door Onze Minister aangewezen functie of het bezit van een door
      Onze Minister aangewezen bekwaamheid;
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel16
  - number: 16.b
    text: |-
      een toelage voor het verrichten van werkzaamheden waaraan naar het oordeel van Onze Minister bijzondere risico’s of
      inconveniënten zijn verbonden;
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel16
  - number: 16.c
    text: |-
      een toelage of - in de plaats daarvan - voorzieningen in natura ter zake van het verblijf van de militair buiten
      Nederland;
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel16
  - number: 16.d
    text: een vergoeding van of een tegemoetkoming in de kosten van recepties en representatie;
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel16
  - number: 16.e
    text: |-
      een diensttijdgratificatie bij een - naar het oordeel van Onze Minister - eervolle diensttijd van twaalfeneenhalf,
      vijfentwintig of vijfendertig jaren;
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel16
  - number: 16.f
    text: |-
      een toelage dan wel een toeslag, uitsluitend indien de militair is aangesteld bij het reserve-personeel, in verband
      met het handhaven van zijn inzetbaarheid;
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel16
  - number: 16.g
    text: een vergoeding van of een tegemoetkoming in de kosten van communicatie;
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel16
  - number: 16.h
    text: |-
      een vergoeding van of tegemoetkoming in de kosten van het volgen van een cursus of opleiding alsmede de hiervoor
      benodigde studiematerialen;
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel16
  - number: 16.i
    text: een vergoeding of een tegemoetkoming in de extra kosten voor zorg voor jonge kinderen bij inzet;
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel16
  - number: 16.j
    text: overgangs- en aanvullende maatregelen ter zake van de invoering van het loongebouw met ingang van 1 januari 2023;
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel16
  - number: 16.k
    text: |-
      een maatregel in verband met reeds opgedane kennis en ervaring, met dien verstande dat deze maatregel uitsluitend
      geldt voor de militair die op 1 januari 2023 nog niet was aangesteld.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel16
  - number: '17.1'
    text: |-
      De militair die wegens ziekte verhinderd is dienst te verrichten, heeft, zodra die verhindering twaalf maanden
      heeft geduurd, aanspraak op 70% van de inkomsten waarop hij aanspraak zou hebben, indien die verhindering tot
      dienstverrichting niet was ingetreden.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel17
  - number: '17.2'
    text: |-
      Indien de militair, bedoeld in het eerste lid gedurende een bepaalde tijd zwangerschaps- of bevallingsverlof op
      basis van [artikel 3:1 van de Wet arbeid en zorg][ref1] geniet wordt het betreffende tijdvak van twaalf maanden met
      dat verlof verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '17.3'
    text: |-
      Voor het bepalen van de in het eerste lid genoemde termijn – in voorkomend geval verlengd ingevolge het tweede lid
      – wordt een opnieuw ingetreden verhindering tot dienstverrichting als voortzetting van de voorgaande verhindering
      beschouwd, indien niet meer dan vier weken zijn verstreken sinds de dag waarop de militair de dienst volledig heeft
      hervat. Bij de vaststelling van de periode van vier weken blijven perioden waarin zwangerschapsof bevallingsverlof
      wordt genoten op basis van [artikel 3:1 van de Wet arbeid en zorg][ref1], buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '17.4'
    text: |-
      In afwijking van het eerste lid heeft de militair ook na afloop van de in lid 1 genoemde termijn – in voorkomend
      geval verlengd ingevolge het tweede lid – aanspraak op de inkomsten waarop hij aanspraak zou hebben, indien die
      verhindering tot dienstverrichting niet was ingetreden:
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel17
  - number: 17.4.a
    text: |-
      als de ziekte waardoor hij verhinderd is dienst te verrichten naar het oordeel van het hoofd defensieonderdeel
      in overwegende mate haar oorzaak vindt in de aard van de aan hem opgedragen werkzaamheden of diensten of in de
      bijzondere omstandigheden waaronder deze moeten worden verricht, en – rekening houdend met de werkzaamheden of
      diensten en omstandigheden – niet aan zijn schuld of onvoorzichtigheid te wijten;
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel17
  - number: 17.4.b
    text: |-
      gedurende de periode dat zwangerschaps- of bevallingsverlof wordt genoten op basis van
      [artikel 3:1 van de Wet arbeid en zorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '17.5'
    text: |-
      In afwijking van het eerste lid heeft de militair ook na het eerste tijdvak van twaalf maanden recht op
      doorbetaling van zijn inkomsten over het aantal uren dat hij loonvormende arbeid heeft verricht, niet zijnde
      reïntegratieactiviteiten waaronder therapeutische arbeid, onderwijs of scholing.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel17
  - number: '17.6'
    text: 'In afwijking van het vijfde lid wordt onderwijs of scholing beschouwd als loonvormende arbeid indien:'
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel17
  - number: 17.6.a
    text: dit onderwijs of deze scholing is gekoppeld aan de functievervulling van een voor de militair beschikbare functie;
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel17
  - number: 17.6.b
    text: |-
      dit onderwijs of deze scholing plaats vindt binnen een erkend reïntegratietraject en gericht is op concrete
      arbeidsmogelijkheden buiten Defensie en is goedgekeurd door de reïntegratie-autoriteit van Defensie.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel17
  - number: '17.7'
    text: |-
      In bijzondere gevallen kan het hoofd defensieonderdeel in de situaties, genoemd in het vijfde en zesde lid,
      bepalen dat de niet genoten inkomsten geheel of gedeeltelijk aan anderen dan aan de militair worden betaald. Na
      verrekening met deze aan anderen dan aan de militair betaalde inkomsten, worden de eventueel resterende, niet
      betaalde inkomsten alsnog aan de militair betaald, indien een door hem aangevraagd hernieuwd onderzoek als bedoeld
      in [artikel 104 van het Algemeen militair ambtenarenreglement][ref1] in zijn voordeel is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel104
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '104'
  - number: '17.8'
    text: |-
      Het vijfde tot en met zevende lid is niet van toepassing indien sprake is van samenloop, bedoeld in
      [artikel 17a][ref1], met een uitkering op grond van en werknemersverzekering of de [Wet arbeid en zorg][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel17a
      [ref2]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: 17a
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0013008
  - number: 17a.1
    text: |-
      Indien de militair, bedoeld in [artikel 17][ref1], ter zake van de betrekking waaruit het recht op doorbetaling
      van bezoldiging voortvloeit, recht heeft op een of meerdere uitkeringen op grond van een werknemersverzekering, de
      [Wet arbeid en zorg][ref2] of een bovenwettelijke WW-uitkering, wordt het bedrag van die uitkering(en) in mindering
      gebracht op het bedrag waarop hij ingevolge [artikel 17][ref3] recht heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0013008
      [ref3]: https://wetten.overheid.nl/BWBR0007816#Artikel17
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '17'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0013008
      - id: ref3
        bwb_id: BWBR0007816
        artikel: '17'
        hoofdstuk: '4'
  - number: 17a.2
    text: |-
      Indien als gevolg van handelingen of het nalaten van handelingen door de militair de uitkering ingevolge een
      werknemersverzekering, de [Wet arbeid en zorg][ref1], dan wel de bovenwettelijke WW-uitkering een vermindering
      ondergaat, dan wel de aanspraak daarop geheel of gedeeltelijk niet wordt toegekend, wordt die uitkering voor de
      toepassing van het eerste lid steeds aangemerkt als een uitkering die onverminderd is genoten. Indien het een
      uitkering betreft op grond van de [WAO][ref2] die in het geheel niet wordt toegekend, wordt voor de toepassing van
      dit artikel rekening gehouden met de uitkering op grond van de [WAO][ref3] zoals die zou zijn toegekend bij een
      arbeidsongeschiktheid van 80% of meer.


      [ref1]: https://wetten.overheid.nl/BWBR0013008
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0013008
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0002524
  - number: 17a.3
    text: |-
      Indien ten aanzien van de wettelijke uitkering een verplichting wordt opgelegd of een sanctie wordt toegepast,
      wordt door het hoofd defensieonderdeel zoveel mogelijk dezelfde verplichting opgelegd, dan wel een overeenkomstige
      sanctie toegepast op het bedrag aan inkomsten waarop de militair ingevolge het eerste lid aanspraak heeft.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel17a
  - number: 17a.4
    text: |-
      In bijzondere gevallen kan het hoofd defensieonderdeel bepalen dat de niet genoten inkomsten geheel
      of gedeeltelijk aan anderen dan aan de militair worden betaald. Na verrekening met deze aan anderen
      dan aan de militair betaalde inkomsten, worden de eventueel resterende, niet betaalde inkomsten
      alsnog aan de militair betaald, indien een door hem aangevraagd hernieuwd onderzoek als bedoeld in
      [artikel 104 van het Algemeen militair ambtenarenreglement][ref1] in zijn voordeel is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel104
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '104'
  - number: 17a.5
    text: |-
      Het in het derde lid bedoelde verplichtingen- en sanctieregime is van overeenkomstige toepassing indien de militair
      bij doorbetaling van bezoldiging tijdens ziekte of arbeidsongeschiktheid de in dat lid bedoelde aanspraak niet had
      kunnen hebben.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel17a
  - number: 17b.1
    text: |-
      Indien aan de vrouwelijke militair zwangerschaps- en bevallingsverlof is verleend, behoudt zij haar aanspraak op
      inkomsten.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel17b
  - number: 17b.2
    text: |-
      De commandant draagt ervoor zorg dat de vrouwelijke militair door tussenkomst van de commandant een
      uitkering op basis van [hoofdstuk 3 van de Wet arbeid en zorg][ref1] aanvraagt bij het Uitvoeringsinstituut
      werknemersverzekeringen genoemd in [hoofdstuk 5 van de Wet-SUWI][ref2]. Deze uitkering moet uiterlijk twee
      weken voor de datum van ingang van het zwangerschaps- en bevallingsverlof onderscheidenlijk de datum waarop de
      vrouwelijke militair het recht op de uitkering wil laten ingaan, worden aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: 17b.3
    text: |-
      Indien de vrouwelijke militair aan wie zwangerschaps- en bevallingsverlof is verleend gedurende dat verlof
      of gedurende een bepaalde periode van dat verlof tevens recht heeft op een uitkering op basis van de
      [Wet arbeid en zorg][ref1], wordt door het hoofd defensieonderdeel gedurende de periode waarin sprake is van
      samenloop een inhouding op de doorbetaling als bedoeld in het eerste lid toegepast die overeenkomt met het bedrag
      van bedoelde uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '3'
  - number: 17b.4
    text: |-
      Indien aan de voorwaarden voor het toekennen van een uitkering als bedoeld in het tweede lid is voldaan maar
      geen uitkering is toegekend omdat de vrouwelijke militair geen aanvraag heeft ingediend, wordt het derde lid op
      overeenkomstige wijze toegepast.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel17b
  - number: 17c.1
    text: |-
      Indien aan de militair door de commandant adoptieverlof op basis van
      [artikel 3:2, eerste tot en met derde lid, van de Wet arbeid en zorg][ref1] is verleend behoudt hij zijn aanspraak
      op inkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: 17c.2
    text: |-
      De commandant draagt ervoor zorg dat de militair door tussenkomst van de commandant een uitkering op basis van
      [hoofdstuk 3 van de Wet arbeid en zorg][ref1] aanvraagt bij het Uitvoeringsinstituut werknemersverzekeringen
      bedoeld in [hoofdstuk 5 van de Wet-SUWI][ref2]. Deze uitkering moet uiterlijk twee weken voor de datum van ingang
      van het adoptieverlof onderscheidenlijk de datum waarop de militair het recht op de uitkering wil laten ingaan,
      worden aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: 17c.3
    text: |-
      Indien de militair aan wie adoptieverlof is verleend gedurende dat verlof of gedurende een bepaalde periode van
      dat verlof tevens recht heeft op een uitkering op basis van de [Wet arbeid en zorg][ref1], wordt door het hoofd
      defensieonderdeel gedurende de periode waarin sprake is van samenloop een inhouding op de doorbetaling, bedoeld in
      het eerste lid, toegepast die overeenkomt met het bedrag van bedoelde uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0013008
  - number: 17c.4
    text: |-
      Indien aan de voorwaarden voor het toekennen van een uitkering als bedoeld in het derde lid is voldaan maar geen
      uitkering is toegekend omdat de militair geen aanvraag heeft ingediend, wordt het derde lid op overeenkomstige
      wijze toegepast.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel17c
  - number: '18'
    text: |-
      Voor elke volledige dag dat de militair zich aan zijn dienstverplichtingen onttrekt, heeft hij geen aanspraak op
      inkomsten.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel18
  - number: '19.1'
    text: |-
      Bij de militair die ingevolge [artikel 34, eerste lid][ref1], dan wel ingevolge
      [artikel 34, tweede lid, onderdeel a of b, van het Algemeen militair ambtenarenreglement][ref2] is geschorst, wordt
      door de commandant voor de duur van die schorsing eenderde gedeelte ingehouden van de inkomsten, tenzij het hoofd
      defensieonderdeel bepaalt dat geen inhouding zal plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel34
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '34'
  - number: '19.2'
    text: |-
      In geval een schorsing als bedoeld in het eerste lid, langer duurt dan zes weken, kan het hoofd defensieonderdeel
      bepalen dat gedurende die verdere duur van die schorsing een verdere inhouding plaatsvindt tot het volle bedrag
      der inkomsten. Bij de afweging omtrent de hoogte van de inhouding wordt de financiële positie van de militair in de
      beschouwing betrokken.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel19
  - number: '19.3'
    text: |-
      Bij de militair die ingevolge [artikel 34, tweede lid, onder c, van het Algemeen militair ambtenarenreglement][ref1]
      is geschorst, vindt geen inhouding van inkomsten plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel34
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '34'
  - number: '19.4'
    text: |-
      De ingehouden inkomsten kunnen alsnog geheel of gedeeltelijk aan de militair worden uitbetaald, indien een schorsing
      als bedoeld in [artikel 34, tweede lid, onderdeel a of b, van het Algemeen militair ambtenarenreglement][ref1]
      niet wordt gevolgd door een veroordeling tot een onvoorwaardelijke vrijheidsstraf, een vrijheidsbenemende maatregel
      of ontslag uit de militaire dienst. Op de aldus uit te keren inkomsten worden in mindering gebracht de inkomsten,
      welke de militair sedert de schorsing heeft genoten uit arbeid, die hij als gevolg van de schorsing heeft kunnen
      verrichten, tenzij zulks, naar het oordeel van het hoofd defensieonderdeel, onredelijk of onbillijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel34
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '34'
  - number: '20.1'
    text: |-
      Aan de nagelaten betrekkingen van degene, die als militair, krachtens een door of namens de Minister van Defensie
      verstrekte opdracht, anders dan als passagier, dienst verrichte aan boord van een vliegtuig en die ten gevolge
      van een vliegongeval met dat vliegtuig tijdens het verrichten van die dienst, is overleden, wordt gezamenlijk een
      uitkering ineens verleend.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel20
  - number: '20.2'
    text: |-
      Aan degene, die als militair, krachtens een door of namens de Minister van Defensie verstrekte opdracht, anders
      dan als passagier, dienst aan boord van een vliegtuig verrichte en die ten gevolge van een vliegongeval met dat
      vliegtuig tijdens het verrichten van die dienst blijvend invalide is geworden wordt een uitkering ineens verleend.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel20
  - number: '20.3'
    text: |-
      Onder dienst aan boord van een vliegtuig in de zin van de eerste lid en tweede lid wordt verstaan het, waar ook ter
      wereld, tijdens een vlucht dienst doen aan boord van een vliegtuig.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel20
  - number: '20.4'
    text: 'De vlucht, bedoeld in het vorige lid en in vijfde lid, wordt geacht:'
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel20
  - number: 20.4.a
    text: |-
      aan te vangen op het ogenblik, waarop de betrokkene, met het doel om te vliegen zich begeeft naar het vliegtuig
      en dit zo dicht is genaderd, dat hem ten gevolge van een gebeuren met dat vliegtuig, een vliegongeval zou kunnen
      overkomen;
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel20
  - number: 20.4.b
    text: |-
      te eindigen onmiddellijk na het ogenblik, waarop de betrokkene, op het aardoppervlak teruggekeerd na het verlaten
      van het vliegtuig, redelijkerwijze kan worden geacht zich in veiligheid te bevinden.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel20
  - number: '20.5'
    text: |-
      Onder vliegongeval in de zin van dit artikel wordt verstaan een tijdens de vlucht rechtstreeks met het vliegtuig
      in verband staande plotselinge inwerking van uitwendig geweld op het lichaam, waaronder begrepen verstikking, het
      onvrijwillig inademen van vergiftigende gassen en dampen, verdrinking, uitputting en de gevolgen van rechtmatige
      verdediging, alsmede zodanige andere feiten als de Minister van Defensie in voorkomende gevallen daaronder begrepen
      oordeelt.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel20
  - number: '20.6'
    text: |-
      De uitkering ineens, bedoeld in het eerste lid, bedraagt € 15.000,–, indien de overledene in het genot was van
      een vliegtoelage bedoeld in de artikel 10 of artikel 11 van de Inkomstenregeling militairen. De verschuldigde
      loonheffing en premies komen voor rekening van het Rijk.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel20
  - number: '20.7'
    text: |-
      De uitkering ineens, bedoeld in het eerste lid, bedraagt € 37.500,–, indien de overledene niet in het genot was van
      een vliegtoelage bedoeld in de artikel 10 of artikel 11 Inkomstenregeling militairen. De verschuldigde loonheffing
      en premies komen voor rekening van het Rijk.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel20
  - number: '20.8'
    text: |-
      De toekenning van een uitkering ineens ter zake van blijvende invaliditeit doet aanspraak op een uitkering ter
      zake van overlijden te niet gaan, tenzij het overlijden plaatsvindt binnen twee jaar ná het tijdstip, waarop het
      vliegongeval plaatsvond, in welk geval het bedrag van de uitkering of de som der uitkeringen toekomende aan de
      nagelaten betrekkingen wordt verminderd met het bedrag der verleende uitkering.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel20
  - number: '20.9'
    text: |-
      De uitkering ineens, bedoeld in het tweede lid, is ingeval van blijvende algehele invaliditeit gelijk aan de
      overeenkomstige gevallen bij overlijden uit te keren bedragen, genoemd in de zesde lid en zevende lid.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel20
  - number: '20.10'
    text: |-
      De uitkering ineens, bedoeld in het tweede lid, is in het geval van blijvende gedeeltelijke invaliditeit gelijk
      aan dat gedeelte van de in overeenkomstige gevallen bij overlijden uit te keren bedragen, genoemd in de zesde lid
      en zevende lid, als wordt uitgedrukt door het percentage van die invaliditeit. Het percentage wordt zo spoedig
      mogelijk, doch uiterlijk twee jaar na het tijdstip, waarop het vliegongeval plaatsvond, vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel20
  - number: '20.11'
    text: Dit artikel is niet van kracht ten aanzien van vliegongevallen als gevolg van feitelijke oorlogsomstandigheden.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel20
  - number: '21'
    text: |-
      De militair die zich in krijgsgevangenschap bevindt of door een vreemde mogendheid is geïnterneerd, behoudt
      aanspraak op inkomsten, tenzij Onze Minister anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel21
  - number: '22.1'
    text: |-
      Indien de militair wordt vermist en gegronde redenen bestaan om aan te nemen dat hij zich aan zijn
      dienstverplichtingen onttrekt, dan wel zich in krijgsgevangenschap bevindt of door een vreemde mogendheid is
      geïnterneerd, is [artikel 18][ref1], onderscheidenlijk [21][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0007816#Artikel21
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '18'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0007816
        artikel: '21'
        hoofdstuk: '4'
  - number: '22.2'
    text: |-
      Indien de militair wordt vermist en het eerste lid niet van toepassing is, wordt de militair geacht te zijn
      overleden op de dag waarop hij wordt vermist.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel22
  - number: '22.3'
    text: |-
      Indien blijkt dat een op grond van het eerste of tweede lid gemaakte veronderstelling onjuist is geweest, stelt
      het hoofd defensieonderdeel de aanspraak op inkomsten met betrekking tot het tijdvak waarin de militair vermist is
      geweest vast in overeenstemming met de overige bepalingen van dit besluit. Daarbij geldt dat enerzijds kan worden
      bepaald dat eventueel te veel betaalde bedragen niet worden teruggevorderd, maar dat anderzijds rekening kan worden
      gehouden met:
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel22
  - number: 22.3.a
    text: een eventueel aan de gezinsleden van de militair toegekend tijdelijk pensioen;
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel22
  - number: 22.3.b
    text: |-
      een eventueel aan nabestaanden van de militair toegekende uitkering op grond van
      [artikel 118b van het Algemeen militair ambtenarenreglement][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel118b
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 118b
  - number: 22.3.c
    text: |-
      eventuele andere inkomsten of baten die door de militair of zijn gezinsleden tijdens de duur van de vermissing van
      de militair in verband daarmede zijn genoten.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel22
  - number: '23.1'
    text: |-
      Onverminderd het tweede lid kan het hoofd defensieonderdeel het bedrag aan inkomsten waarop de militair
      over enig tijdvak aanspraak heeft, verminderen met het gehele of gedeeltelijke bedrag van de geldelijke
      inkomsten waarop die militair over hetzelfde tijdvak aanspraak heeft uit of in verband met arbeid of bedrijf
      anders dan als militair. Dit geldt uitsluitend, indien laatstbedoelde geldelijke inkomsten zijn verkregen
      uit of in verband met werkzaamheden, verricht gedurende de voor de militair geldende werktijd, bedoeld in
      [artikel 54a, onder d, van het Algemeen militair ambtenarenreglement][ref1]. De vermindering bedraagt ten hoogste
      het bedrag van de inkomsten als militair.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel54a
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 54a
  - number: '23.2'
    text: |-
      Indien de militair, bedoeld in [artikel 17, eerste lid][ref1], tijdens verhindering tot dienstverrichting in het
      belang van zijn genezing door de militair geneeskundige dienst wenselijk geachte arbeid voor zichzelf of voor
      derden verricht, worden - in afwijking van het eerste lid - de geldelijke inkomsten uit die arbeid slechts op zijn
      inkomsten als militair in mindering gebracht, voor zover de inkomsten uit die arbeid 30 procent van zijn inkomsten
      als militair te boven gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel17
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '17'
        hoofdstuk: '4'
  - number: '23.3'
    text: |-
      Indien de militair reeds vóór het tijdstip waarop hij de in het eerste lid bedoelde werkzaamheden heeft
      aangevangen, naast zijn inkomsten als militair tevens inkomsten uit of in verband met arbeid of bedrijf genoot,
      worden die inkomsten niet in aanmerking genomen bij de toepassing van het eerste lid. Dit is uitsluitend het geval,
      indien hij aannemelijk kan maken dat die inkomsten niet het gevolg zijn van verhoogde werkzaamheden of van andere
      oorzaken die verband houden met de werkzaamheden, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel23
  - number: '23.4'
    text: |-
      Indien de militair reeds vóór het tijdstip waarop hij de in het eerste lid bedoelde werkzaamheden heeft
      aangevangen, inkomsten uit of in verband met arbeid of bedrijf genoot en hij na dat tijdstip meer inkomsten gaat
      genieten, worden die meerdere inkomsten in aanmerking genomen bij de toepassing van het eerste lid, tenzij hij
      aannemelijk kan maken dat die meerdere inkomsten niet het gevolg zijn van verhoogde werkzaamheden of van andere
      oorzaken die verband houden met de werkzaamheden, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel23
  - number: '23.5'
    text: |-
      Het bedrag aan inkomsten waarop de militair over enig tijdvak aanspraak heeft, wordt verminderd met het bedrag van
      de geldelijke uitkeringen waarop hij met betrekking tot hetzelfde tijdvak krachtens een sociale verzekeringswet
      aanspraak heeft. Dit geldt uitsluitend, indien die geldelijke uitkeringen in de plaats zijn getreden van geldelijke
      inkomsten uit of in verband met arbeid of bedrijf, die met toepassing van het eerste lid in mindering zijn of
      zouden zijn gebracht tot ten hoogste het bedrag van de inkomsten als militair.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel23
  - number: '23.6'
    text: |-
      Het hoofd defensieonderdeel kan het bedrag aan inkomsten waarop de militair over enig tijdvak aanspraak heeft,
      verminderen met het gehele of gedeeltelijke bedrag van de vaste vergoeding waarop de militair over hetzelfde
      tijdvak aanspraak heeft in verband met een functie in een publiekrechtelijk college waarvoor hem over dat tijdvak
      het in [artikel 12][ref1] bedoelde verlof is verleend. De vermindering bedraagt ten hoogste het bedrag van de
      inkomsten als militair.


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel12c
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: 12c
  - number: '23.7'
    text: |-
      De militair, bedoeld in het eerste tot en met het zesde lid, is gehouden de geldelijke inkomsten of uitkeringen
      uit of in verband met arbeid of bedrijf, dan wel de vaste vergoedingen in verband met een functie in een
      publiekrechtelijk college te melden aan het hoofd defensieonderdeel onder overlegging van een gespecificeerde
      opgave van die inkomsten, uitkeringen of vergoedingen.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel23
  - number: 23a.1
    text: |-
      Bij de berekening van de grondslag voor militair ouderdoms- en nabestaandenpensioen en pensioen ter zake van
      ziekten of gebreken naar de bij of krachtens de Kaderwet militaire pensioenen vast te stellen regels gelden als
      inkomstenbestanddelen ingevolge dit besluit de in tabel 1 bij dit artikel opgenomen inkomensbestanddelen.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel23a
  - number: 23a.2
    text: |-
      Aanvullende op de inkomensbestanddelen bedoeld in het eerste lid, gelden vanaf 1 januari 2019 en uiterlijk tot de
      laatste dag van de maand voorafgaande aan die waarin het aan de militair verleende leeftijdsontslag ingaat, tevens
      ingevolge dit besluit:
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel23a
  - number: 23a.2.a
    text: als vaste inkomensbestanddelen voor 100 procent de in tabel 2 bij dit artikel opgenomen inkomensbestanddelen;
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel23a
  - number: 23a.2.b
    text: als variabele inkomensbestanddelen voor 100 procent de in tabel 3 bij dit artikel opgenomen inkomensbestanddelen;
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel23a
  - number: 23a.2.c
    text: |-
      tevens als variabele inkomstenbestanddelen ingevolge dit besluit, voor 50 procent de in tabel 4 opgenomen
      inkomensbestanddelen.
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel23a
  - number: 23a.3
    text: |-
      Het eerste lid en het tweede lid, onderdeel a, zijn van overeenkomstige toepassing voor de gewezen militair die een
      uitkering ingevolge de [Uitkeringswet gewezen militairen][ref1] geniet en voor wie de ontslagleeftijd met ingang
      van 1 januari 2006 bij of krachtens [artikel 12 van de Militaire ambtenarenwet 1931][ref2] is gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002540
      [ref2]: https://wetten.overheid.nl/BWBR0001952#Artikel12
    url: https://wetten.overheid.nl/BWBR0007816/2025-01-17#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0002540
      - id: ref2
        bwb_id: BWBR0001952
        artikel: '12'
  - number: 23a.4
    text: |-
      Het eerste lid en het tweede lid, onderdeel a, zijn van overeenkomstige toepassing voor de gewezen militair die een
      ontslaguitkering, waaronder tevens te begrijpen een uitkering ingevolge de Uitkeringswet gewezen militairen, geniet
      in de zin van de bij of krachtens de Kaderwet militaire pensioenen vastgestelde regels, met dien verstande dat
      onderdeel n van Tabel 1 niet als inkomensbestanddeel bij de berekening van de pensioengrondslag wordt meegenomen.






                    Tabel 1.


                    a. de bezoldiging;
                    b. de vakantie-uitkering;
                    c. de eindejaarsuitkering;
                    d. de vliegtoelage;
                    e. de garantievliegtoelage;
                    f. de toelage Huis van Z.M. de Koning;
                    g. de functioneringstoelage, indien deze voor ten minste vijf jaren onafgebroken is toegekend;
                    h. de toelage officieren-arts, officieren-tandarts en officieren-apotheker, zodra deze toelage
      laatstelijk gedurende vijf jaren onafgebroken is genoten;
                    i. de toelage officieren-medisch specialist, zodra deze toelage laatstelijk gedurende vijf jaren
      onafgebroken is genoten;
                    j. de brevettoelage marinierskapel;
                    k. een op grond van [artikel 26][ref1] van dit besluit dan wel een voor 1 januari 2009 op grond van
      [artikel 115 van het Algemeen militair ambtenarenreglement][ref2] toegekende schadeloosstelling, vergoeding of
      tegemoetkoming, voor zover deze, naar het oordeel van Onze Minister, een vast onderdeel van zijn inkomen vormt;
                    l. de door Onze Minister te schatten geldswaarden per jaar van het emolument van kleermakers,
      schoenmakers en barbiers der zeemacht wegens werkzaamheden ten dienste van de militairen, welke schatting niet
      individueel geschiedt doch voor alle kleermakers, schoenmakers en barbiers naar een voor elk van deze categorieën
      te bepalen bedrag, berekend naar de gemiddelde inkomsten, welke door elke categorie jaarlijks uit het bedrijf wordt
      genoten;
                    m. het emolument huisvesting Koninklijke marechaussee;
                    n. de vaste vergoeding voor extra beslaglegging van de militair die zich in fase 2 of 3 bevindt, voor
      zover hij deze na 31 december 2001 heeft genoten.




                    Tabel 2.


                    a. de functioneringstoelage;
                    b. de toelage officieren-arts, officieren-tandarts en officieren-apotheker;
                    c. de toelage officieren-medisch specialist;
                    d. de vaste vergoeding voor extra beslaglegging van de militair die zich in fase 1 bevindt.




                    Tabel 3.


                    a. de waarnemingstoelage;
                    b. de functioneringsgratificatie;
                    c. de bindingspremie;
                    d. de behoudpremie.
                    e. de naar bij ministeriële regeling vastgestelde regels genoten toelage of vergoeding voor extra
      beslaglegging bedoeld in [artikel 60c, onderdelen a en b, van het Algemeen militair ambtenarenreglement][ref3];
                    f. eenmalige uitkeringen aan het defensiepersoneel;
                    g. overige vergoedingen en toelagen voor zover dit bij ministeriële regeling is bepaald.




                    Tabel 4.


                    a. de bij ministeriële regeling vastgestelde vergoeding voor extra beslaglegging bedoeld in
      [artikel 60c, onderdelen d en e, van het Algemeen militair ambtenarenreglement][ref4];
                    b. de bij ministeriële regeling vastgestelde vergoeding voor ondervonden extra werkdruk die een
      gevolg is van de inzet;
                    c. overige vergoedingen en toelagen voor zover dit bij ministeriële regeling is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel115
      [ref3]: https://wetten.overheid.nl/BWBR0003482#Artikel60c
      [ref4]: https://wetten.overheid.nl/BWBR0003482#Artikel60c
