    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel5a
  - number: 5a.4
    text: 'Onder een afwijkende bezoldiging bedoeld in het tweede lid wordt verstaan de bezoldiging in geval van:'
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel5a
  - number: 5a.4.a
    text: ongeoorloofde afwezigheid;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel5a
  - number: 5a.4.b
    text: vermissing;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel5a
