  - number: '26'
    text: |-
      Indien de billijkheid dat vordert, kan Onze Minister de militair schadeloos stellen, kosten vergoeden of overigens
      een geldelijke tegemoetkoming toekennen.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel26
  - number: '29'
    text: |-
      Dit besluit treedt in werking met ingang van 1 januari 1996. Indien het *Staatsblad* waarin dit besluit wordt
      geplaatst, wordt uitgegeven na 31 december 1995, treedt het in werking met ingang van de dag na de datum van
      uitgifte van het *Staatsblad* waarin het wordt geplaatst, en werkt het terug tot en met 1 januari 1996.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel29
  - number: '30'
    text: 'Dit besluit wordt aangehaald als: Inkomstenbesluit militairen.'
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel30
