    text: ziekte;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel5a
  - number: 5a.4.e
    text: schorsing, vrijheidsstraf of voorlopige hechtenis;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel5a
  - number: 5a.4.f
    text: wachtgeld als bedoeld in het Tijdelijk besluit uitstroom bevorderende maatregel Defensie.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel5a
  - number: '6.1'
    text: |-
      De bevoegdheid tot het toekennen van aanspraken op grond van de [artikelen 7][ref1], [8][ref2], [12][ref3],
      [12a][ref4] en [13][ref5] aan militairen met de rang van kapitein ter zee/kolonel en hoger berust bij de
      Secretaris-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007816#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0007816#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0007816#Artikel12a
      [ref5]: https://wetten.overheid.nl/BWBR0007816#Artikel13
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '7'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007816
        artikel: '8'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0007816
        artikel: '12'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0007816
        artikel: 12a
        hoofdstuk: '3'
      - id: ref5
        bwb_id: BWBR0007816
        artikel: '13'
        hoofdstuk: '3'
  - number: '6.2'
    text: |-
      De militair met de rang van vice-admiraal, luitenant-generaal, luitenant-admiraal of generaal heeft aanspraak op
      een eindejaarsuitkering van 8,3% van de door hem genoten bezoldiging.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel6
  - number: '7.1'
    text: |-
      De commandant operationeel commando kent de militair bij aanstelling een salarisnummer binnen de bij zijn rang
      behorende salarisschaal toe op basis van kennis en ervaring van de militair.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel7
  - number: '7.2'
    text: |-
      Aan de militair van 20, 21, 22 of 23 jaar en ouder wordt bij aanstelling respectievelijk ten minste salarisnummer
      1, 2, 3 of 4 toegekend.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel7
  - number: '7.3'
    text: |-
      Het salarisnummer van de militair wordt jaarlijks met één verhoogd. Deze verhoging is ook van toepassing op de
      militair, die het maximum van de salarisschaal heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel7
  - number: '7.4'
    text: |-
      De in het derde lid bedoelde verhoging van het salarisnummer vindt plaats met ingang van de eerste dag van de maand
      waarin één jaar is verstreken sedert de dag waarop zijn salarisnummer voor de laatste maal is toegekend.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel7
  - number: '7.5'
    text: |-
      Het hoofd defensieonderdeel kan een hoger salarisnummer toekennen aan een militair, indien deze naar het oordeel
      van het hoofd defensieonderdeel daarvoor in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel7
  - number: '7.6'
    text: |-
      Het hoofd defensieonderdeel kan een verhoging van het salarisnummer achterwege laten, indien de militair niet naar
      behoren functioneert.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel7
  - number: '8.1'
    text: De militair behoudt zijn salarisnummer indien hij wordt bevorderd.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel8
  - number: '8.2'
    text: |-
      Indien het salarisnummer van een militair, na bevordering, lager is dan het laagste salarisnummer waarvoor bij
      zijn nieuwe salarisschaal een bedrag is opgenomen, wordt de militair door de commandant operationeel commando een
      hoger salarisnummer toegekend, zodanig dat de militair aanspraak verkrijgt op het laagste bedrag behorende bij zijn
      nieuwe salarisschaal.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel8
  - number: '8.3'
    text: |-
      Indien de in het tweede lid bedoelde militair tijdelijk is bevorderd en de rang herkrijgt die hij had voordat hij
      tijdelijk werd bevorderd, vervalt de in het vorige lid bedoelde verhoging van het salarisnummer.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel8
  - number: '8.4'
    text: |-
      Het salarisnummer van de korporaal van de Koninklijke Landmacht of van de Koninklijke Luchtmacht, die wordt
      bevorderd tot korporaal der eerste klasse, wordt met één verhoogd. Deze verhoging is niet van invloed op de datum
      van de jaarlijkse verhoging van het salarisnummer, bedoeld in [artikel 7, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel7
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '7'
        hoofdstuk: '2'
  - number: 8a.1
    text: |-
      Voor de militair, die op 31 mei 2001 aanspraak maakt op salaris, wordt op 1 juni 2001 zijn tot die tijd geldende
      diensttijd omgezet in een salarisnummer aan de hand van de salarisschalen van [bijlage A][ref1] en [B][ref2] en
      met inachtneming van het volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0007816
      [ref2]: https://wetten.overheid.nl/BWBR0007816
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0007816
      - id: ref2
        bwb_id: BWBR0007816
  - number: 8a.1.a
    text: |-
      Het salarisnummer wordt toegekend zodanig, dat het salaris op 1 juni 2001 gelijk is aan het salaris dat voor hem op
      die datum zou hebben gegolden bij toepassing van dit besluit zoals dat luidde op 31 mei 2001;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel8a
  - number: 8a.1.b
    text: |-
      Indien dit salaris niet voorkomt in de salarisschaal wordt het salarisnummer toegekend zodanig, dat het salaris
      gelijk is aan het eersthogere bedrag in de salarisschaal;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel8a
  - number: 8a.1.c
    text: |-
      Voor de militair, die één of meer jaren diensttijd had boven de diensttijd behorende bij het maximum salaris in de
      salarisschaal, wordt het salarisnummer hoger vastgesteld overeenkomstig dat aantal jaren diensttijd.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel8a
  - number: 8a.2
    text: |-
      In afwijking van [artikel 7, vierde lid][ref1], wordt voor de militair, die op 31 mei 2001 aanspraak maakt op
      salaris, de datum van de eerstvolgende verhoging van het salarisnummer na 1 juni 2001 als volgt vastgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel7
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '7'
        hoofdstuk: '2'
  - number: 8a.2.a
    text: 'voor de militair, bedoeld in het eerste lid, onder b: één jaar na de toekenning van het salarisnummer;'
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel8a
  - number: 8a.2.b
    text: |-
      voor de militair, voor wie de diensttijd vóór 1 juni 2001 met tenminste een jaar is vermeerderd en voor de
      officier, niet bedoeld onder a: overeenkomstig de diensttijdbepalingen van dit besluit zoals deze luidden op 31
      mei 2001;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel8a
  - number: 8a.2.c
    text: 'voor de overige militairen: de eerste dag van de maand waarin één jaar is verstreken sedert zijn aanstelling.'
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel8a
  - number: '9.1'
    text: |-
      Een militair wiens salaris vermindering ondergaat, heeft aanspraak op een overbruggingstoelage ten bedrage van die
      vermindering, indien hij:
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel9
  - number: 9.1.a
    text: |-
      na een verandering in zijn dienstverhouding tot het Rijk - in verband met het volgen van een opleiding wordt
      aangesteld in een lagere rang; of
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel9
  - number: 9.1.b
    text: na overgang naar een ander krijgsmachtdeel aanspraak heeft op een lager salaris.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel9
  - number: '9.2'
    text: |-
      Een militair, voor wie na bevordering de functioneringstoelage is vervallen, of het bedrag ervan op nul is gesteld,
      heeft aanspraak op een overbruggingstoelage indien hij na bevordering aanspraak heeft op een salaris dat lager
      is dan het salaris vermeerderd met de functioneringstoelage waarop hij direct voorafgaande aan die bevordering
      aanspraak had, ten bedrage van deze vermindering.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel9
  - number: '9.3'
    text: |-
      Indien het salaris van de militair aan wie een overbruggingstoelage is toegekend, wordt verhoogd anders dan op
      grond van een algemene salarismaatregel, wordt de overbruggingstoelage met het bedrag van die verhoging verminderd.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel9
  - number: '9.4'
    text: |-
      Geen aanspraak op een overbruggingstoelage wordt verleend, dan wel de aanspraak op de toegekende
      overbruggingstoelage vervalt, indien de militair na een tijdelijke rang te hebben bekleed, de rang herkrijgt die
      hij had voordat hij tijdelijk werd bevorderd.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel9
  - number: '9.5'
    text: |-
      De aanspraak op de in het tweede lid bedoelde overbruggingstoelage eindigt op de datum waarop de toegekende
      functioneringstoelage volgens de toekenningsbeschikking zou eindigen.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel9
  - number: '10'
    text: |-
      De militair wiens salaris - in voorkomend geval verhoogd met een overbruggingstoelage -
      lager is dan het maandbedrag van het minimumloon dat krachtens de [artikelen 7][ref1], 8 en
      [14 van de Wet minimumloon en minimumvakantiebijslag][ref2] geldt voor werknemers van dezelfde leeftijd, heeft
      aanspraak op een garantietoelage minimumloon ten bedrage van het verschil.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel14
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '14'
  - number: '11.1'
    text: |-
      De militair die is belast met de volledige waarneming van een functie, bedoeld in
      [artikel 22, eerste lid, van het Algemeen militair ambtenarenreglement][ref1], heeft, indien aan die functie een
      hogere rang is verbonden, voor de duur van de waarneming aanspraak op een waarnemingstoelage.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel22
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '22'
  - number: '11.2'
    text: |-
      De toelage wordt toegekend, indien de waarneming ten minste een tijdvak van dertig aaneengesloten dagen heeft
      geduurd.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel11
  - number: '11.3'
    text: |-
      Het bedrag van de toelage is gelijk aan het verschil tussen de bezoldiging waarop de militair aanspraak heeft
      en de bezoldiging waarop hij aanspraak zou hebben, indien de waargenomen functie hem zou zijn toegewezen en hij
      dientengevolge zou zijn bevorderd tot de aan die functie verbonden rang.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel11
  - number: 11b.1
    text: |-
      Ter zake van extra beslaglegging ontvangt de militair een maandelijkse toelage, bestaande uit een percentage van de
      voor hem geldende bezoldiging.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel11b
  - number: 11b.2
    text: |-
      In afwijking van het eerste lid wordt voor de militair die aanspraak heeft op een afwijkende bezoldiging de toelage
      verminderd overeenkomstig de mate waarin die bezoldiging afwijkt van de bezoldiging bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel11b
  - number: 11b.3
    text: |-
      Het percentage bedoeld in het eerste lid, wordt bepaald aan de hand van het maandbedrag van de bezoldiging, volgens
      onderstaande tabel:








                    bezoldiging


                    percentage






                    t/m


                    € 2.854,08



                    9,3%




                    van


                    € 2.854,09 t/m


                    € 3.262,74


                    8,8%




                    van


                    € 3.262,75 t/m


                    € 3.824,45


                    7,7%




                    van


                    € 3.824,46 t/m


                    € 6.347,89


                    6,3%




                    vanaf


                    € 6.347,90



                    4,6%
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel11b
  - number: 11b.4
    text: 'Onder een afwijkende bezoldiging bedoeld in het tweede lid wordt verstaan de bezoldiging in geval van:'
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel11b
  - number: 11b.4.a
    text: ongeoorloofde afwezigheid;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel11b
  - number: 11b.4.b
    text: vermissing;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel11b
  - number: 11b.4.c
    text: verlof;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel11b
  - number: 11b.4.d
    text: ziekte;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel11b
  - number: 11b.4.e
    text: schorsing, vrijheidsstraf of voorlopige hechtenis.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel11b
  - number: '12.1'
    text: |-
      De commandant operationeel commando kan aan een militair in fase twee of drie, die zich verbindt om gedurende een
      bepaalde periode onafgebroken deel uit te maken van het beroepspersoneel, een bindingspremie toekennen.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel12
  - number: '12.2'
    text: Bij ministeriële regeling worden regels gesteld omtrent de toekenning van een bindingspremie.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel12
  - number: 12a.1
    text: |-
      Het hoofd defensieonderdeel kan aan een militair, die is aangesteld bij het beroepspersoneel en het voor hem
      geldende maximumsalaris heeft bereikt, een functioneringstoelage toekennen, indien de wijze van functioneren van
      die militair daartoe naar het oordeel van het hoofd defensieonderdeel aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel12a
  - number: 12a.2
    text: De functioneringstoelage wordt toegekend voor een periode van tenminste één jaar.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel12a
  - number: 12a.3
    text: De functioneringstoelage bedraagt ten hoogste 10 procent van het voor de militair geldende salaris.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel12a
  - number: 12a.4
    text: |-
      Indien de militair, die een functioneringstoelage geniet, wordt bevorderd, niet zijnde een tijdelijke bevordering,
      komt de functioneringstoelage met ingang van de datum van de bevordering te vervallen.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel12a
  - number: 12a.5
    text: |-
      Indien de militair, die een functioneringstoelage geniet, tijdelijk wordt bevorderd, wordt het bedrag van de
      functioneringstoelage gedurende de tijd dat hij de tijdelijke rang bekleedt, op nul gesteld.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel12a
  - number: 12a.6
    text: 'Voor de toepassing van dit artikel wordt het maximumsalaris bereikt voor:'
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel12a
  - number: 12a.6.a
    text: 'de matroos der 1e klasse van de Koninklijke Marine: bij het salarisnummer 11 of hoger;'
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel12a
  - number: 12a.6.b
    text: |-
      de korporaal, de korporaal der 1e klasse van de Koninklijke Landmacht en de Koninklijke Luchtmacht en de
      marechaussee der 1e klasse van de Koninklijke Marechaussee: bij het salarisnummer 15 of hoger.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel12a
  - number: '13.1'
    text: |-
      De commandant kan aan de militair die zich tijdens het verblijf in werkelijke dienst bijzonder heeft onderscheiden
      door optreden of gedragingen dan wel door buitengewone toewijding of bijzondere loffelijke dienstverrichtingen,
      naar bij ministeriële regeling te stellen regels, één of meer van de onderstaande beloningen toekennen:
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel13
  - number: 13.1.a
    text: geschenk;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel13
  - number: 13.1.b
    text: geldelijke beloning;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel13
  - number: 13.1.c
    text: functioneringsgratificatie.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel13
  - number: '13.2'
    text: Het maximumbedrag van de beloningen wordt bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel13
  - number: 13a.1
    text: |-
      Aan de militair die met goed gevolg zijn initiële opleiding heeft volbracht kan naar bij ministeriële regeling te
      stellen regels een aanstellingspremie worden toegekend.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel13a
  - number: 13a.2
    text: |-
      Indien de in het eerste lid bedoelde militair tijdens fase één ontslag wordt verleend, betaalt hij de toegekende
      premie op een door Onze minister te bepalen wijze terug.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel13a
  - number: 13a.3
    text: |-
      Indien het in het tweede lid bedoelde ontslag niet of niet geheel aan de militair valt te verwijten kan Onze
      Minister in afwijking van het tweede lid bepalen dat de toegekende premie gedeeltelijk of niet behoeft te worden
      terugbetaald.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel13a
  - number: '14.1'
    text: |-
      De militair met aanspraak op salaris heeft aanspraak op een vakantie-uitkering ten bedrage van 8 procent van de
      door hem genoten bezoldiging, in voorkomend geval vermeerderd met:
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel14
  - number: 14.1.a
    text: de waarnemingstoelage;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel14
  - number: 14.1.b
    text: |-
      de toelage officieren-arts, -tandarts, of -apotheker, zodra deze laatstelijk gedurende vijf jaren onafgebroken
      is genoten;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel14
  - number: 14.1.c
    text: de brevettoelage voor het vervullen van een eerste partij bij de marinierskapel der Koninklijke marine;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel14
  - number: 14.1.d
    text: de brevettoelage voor het vervullen van een solistenpartij bij de marinierskapel der Koninklijke marine;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel14
  - number: 14.1.e
    text: de vliegtoelage of de garantievliegtoelage;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel14
  - number: 14.1.f
    text: de toelage woninghuur Koninklijke marechaussee;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel14
  - number: 14.1.g
    text: |-
      het emolument van kleermakers, schoenmakers en barbiers der zeemacht, bedoeld in
      [artikel 23a, eerste lid, onderdeel l][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel23a
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: 23a
        hoofdstuk: 4a
  - number: 14.1.h
    text: de toelage Huis van Hare Majesteit de Koningin.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel14
  - number: '14.2'
    text: 'Het minimumbedrag per maand van de vakantie-uitkering is voor de militair:'
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel14
  - number: 14.2.a
    text: 'met salarisnummer 0: € 104,43;'
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel14
  - number: 14.2.b
    text: 'met salarisnummer 1: € 119,34;'
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel14
  - number: 14.2.c
    text: 'met salarisnummer 2: € 134,26;'
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel14
  - number: 14.2.d
    text: 'met salarisnummer 3 of hoger: € 149,18.'
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel14
  - number: '14.3'
    text: |-
      Ten aanzien van de militair op wie [artikel 17, eerste lid][ref1], van toepassing is, wordt voor de toepassing
      van dit artikel uitgegaan van de inkomsten waarop die militair aanspraak zou hebben, indien de verhindering tot
      dienstverrichting niet was ingetreden.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel17
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '17'
        hoofdstuk: '4'
  - number: '14.4'
    text: |-
      Indien de militair - anders dan op grond van [artikel 17][ref1] - aanspraak heeft op een gedeelte van de voor hem
      geldende inkomsten, wordt het in het tweede lid bedoelde bedrag naar evenredigheid verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel17
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '17'
        hoofdstuk: '4'
  - number: '15'
    text: |-
      De militair met een lagere rang dan vice-admiraal of luitenant-generaal heeft aanspraak op een eindejaarsuitkering
      van 5,0% van de door hem genoten bezoldiging. Dit percentage wordt verhoogd naar: 5,82% per 1 maart 2012 6,2% per 1
      juli 2012.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel15
  - number: '16'
    text: 'Bij ministeriële regeling kan de militair aanspraak worden verleend op:'
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel16
  - number: 16.a
    text: |-
      een toelage in verband met het vervullen van een door Onze Minister aangewezen functie of het bezit van een door
      Onze Minister aangewezen bekwaamheid;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel16
  - number: 16.b
    text: |-
      een toelage voor het verrichten van werkzaamheden waaraan naar het oordeel van Onze Minister bijzondere risico’s of
      inconveniënten zijn verbonden;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel16
  - number: 16.c
    text: |-
      een toelage of - in de plaats daarvan - voorzieningen in natura ter zake van het verblijf van de militair buiten
      Nederland;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel16
  - number: 16.d
    text: een vergoeding van of een tegemoetkoming in de kosten van recepties en representatie;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel16
  - number: 16.e
    text: |-
      een diensttijdgratificatie bij een - naar het oordeel van Onze Minister - eervolle diensttijd van twaalfeneenhalf,
      vijfentwintig of vijfendertig jaren;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel16
  - number: 16.f
    text: |-
      een toelage dan wel een toeslag, uitsluitend indien de militair is aangesteld bij het reserve-personeel, in verband
      met het handhaven van zijn inzetbaarheid;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel16
  - number: 16.g
    text: een vergoeding van of een tegemoetkoming in de kosten van communicatie;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel16
  - number: 16.h
    text: |-
      een vergoeding van of tegemoetkoming in de kosten van het volgen van een cursus of opleiding alsmede de hiervoor
      benodigde studiematerialen;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel16
  - number: 16.i
    text: een vergoeding of een tegemoetkoming in de extra kosten voor zorg voor jonge kinderen bij inzet.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel16
  - number: '17.1'
    text: |-
      De militair die wegens ziekte verhinderd is dienst te verrichten, heeft, zodra die verhindering twaalf maanden
      heeft geduurd, aanspraak op 70% van de inkomsten waarop hij aanspraak zou hebben, indien die verhindering tot
      dienstverrichting niet was ingetreden.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel17
  - number: '17.2'
    text: |-
      Indien de militair, bedoeld in het eerste lid gedurende een bepaalde tijd zwangerschaps- of bevallingsverlof op
      basis van [artikel 3:1 van de Wet arbeid en zorg][ref1] geniet wordt het betreffende tijdvak van twaalf maanden met
      dat verlof verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '17.3'
    text: |-
      Voor het bepalen van de in het eerste lid genoemde termijn – in voorkomend geval verlengd ingevolge het tweede lid
      – wordt een opnieuw ingetreden verhindering tot dienstverrichting als voortzetting van de voorgaande verhindering
      beschouwd, indien niet meer dan vier weken zijn verstreken sinds de dag waarop de militair de dienst volledig heeft
      hervat. Bij de vaststelling van de periode van vier weken blijven perioden waarin zwangerschapsof bevallingsverlof
      wordt genoten op basis van [artikel 3:1 van de Wet arbeid en zorg][ref1], buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '17.4'
    text: |-
      In afwijking van het eerste lid heeft de militair ook na afloop van de in lid 1 genoemde termijn – in voorkomend
      geval verlengd ingevolge het tweede lid – aanspraak op de inkomsten waarop hij aanspraak zou hebben, indien die
      verhindering tot dienstverrichting niet was ingetreden:
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel17
  - number: 17.4.a
    text: |-
      als de ziekte waardoor hij verhinderd is dienst te verrichten naar het oordeel van het hoofd defensieonderdeel
      in overwegende mate haar oorzaak vindt in de aard van de aan hem opgedragen werkzaamheden of diensten of in de
      bijzondere omstandigheden waaronder deze moeten worden verricht, en – rekening houdend met de werkzaamheden of
      diensten en omstandigheden – niet aan zijn schuld of onvoorzichtigheid te wijten;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel17
  - number: 17.4.b
    text: |-
      gedurende de periode dat zwangerschaps- of bevallingsverlof wordt genoten op basis van
      [artikel 3:1 van de Wet arbeid en zorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '17.5'
    text: |-
      In afwijking van het eerste lid heeft de militair ook na het eerste tijdvak van twaalf maanden recht op
      doorbetaling van zijn inkomsten over het aantal uren dat hij loonvormende arbeid heeft verricht, niet zijnde
      reïntegratieactiviteiten waaronder therapeutische arbeid, onderwijs of scholing.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel17
  - number: '17.6'
    text: 'In afwijking van het vijfde lid wordt onderwijs of scholing beschouwd als loonvormende arbeid indien:'
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel17
  - number: 17.6.a
    text: dit onderwijs of deze scholing is gekoppeld aan de functievervulling van een voor de militair beschikbare functie;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel17
  - number: 17.6.b
    text: |-
      dit onderwijs of deze scholing plaats vindt binnen een erkend reïntegratietraject en gericht is op concrete
      arbeidsmogelijkheden buiten Defensie en is goedgekeurd door de reïntegratie-autoriteit van Defensie.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel17
  - number: '17.7'
    text: |-
      In bijzondere gevallen kan het hoofd defensieonderdeel in de situaties, genoemd in het vijfde en zesde lid,
      bepalen dat de niet genoten inkomsten geheel of gedeeltelijk aan anderen dan aan de militair worden betaald. Na
      verrekening met deze aan anderen dan aan de militair betaalde inkomsten, worden de eventueel resterende, niet
      betaalde inkomsten alsnog aan de militair betaald, indien een door hem aangevraagd hernieuwd onderzoek als bedoeld
      in [artikel 104 van het Algemeen militair ambtenarenreglement][ref1] in zijn voordeel is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel104
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '104'
  - number: '17.8'
    text: |-
      Het vijfde tot en met zevende lid is niet van toepassing indien sprake is van samenloop, bedoeld in
      [artikel 17a][ref1], met een uitkering op grond van en werknemersverzekering of de [Wet arbeid en zorg][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel17a
      [ref2]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: 17a
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0013008
  - number: 17a.1
    text: |-
      Indien de militair, bedoeld in [artikel 17][ref1], ter zake van de betrekking waaruit het recht op doorbetaling
      van bezoldiging voortvloeit, recht heeft op een of meerdere uitkeringen op grond van een werknemersverzekering, de
      [Wet arbeid en zorg][ref2] of een bovenwettelijke WW-uitkering, wordt het bedrag van die uitkering(en) in mindering
      gebracht op het bedrag waarop hij ingevolge [artikel 17][ref3] recht heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0013008
      [ref3]: https://wetten.overheid.nl/BWBR0007816#Artikel17
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '17'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0013008
      - id: ref3
        bwb_id: BWBR0007816
        artikel: '17'
        hoofdstuk: '4'
  - number: 17a.2
    text: |-
      Indien als gevolg van handelingen of het nalaten van handelingen door de militair de uitkering ingevolge een
      werknemersverzekering, de [Wet arbeid en zorg][ref1], dan wel de bovenwettelijke WW-uitkering een vermindering
      ondergaat, dan wel de aanspraak daarop geheel of gedeeltelijk niet wordt toegekend, wordt die uitkering voor de
      toepassing van het eerste lid steeds aangemerkt als een uitkering die onverminderd is genoten. Indien het een
      uitkering betreft op grond van de [WAO][ref2] die in het geheel niet wordt toegekend, wordt voor de toepassing van
      dit artikel rekening gehouden met de uitkering op grond van de [WAO][ref3] zoals die zou zijn toegekend bij een
      arbeidsongeschiktheid van 80% of meer.


      [ref1]: https://wetten.overheid.nl/BWBR0013008
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0013008
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0002524
  - number: 17a.3
    text: |-
      Indien ten aanzien van de wettelijke uitkering een verplichting wordt opgelegd of een sanctie wordt toegepast,
      wordt door het hoofd defensieonderdeel zoveel mogelijk dezelfde verplichting opgelegd, dan wel een overeenkomstige
      sanctie toegepast op het bedrag aan inkomsten waarop de militair ingevolge het eerste lid aanspraak heeft.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel17a
  - number: 17a.4
    text: |-
      In bijzondere gevallen kan het hoofd defensieonderdeel bepalen dat de niet genoten inkomsten geheel
      of gedeeltelijk aan anderen dan aan de militair worden betaald. Na verrekening met deze aan anderen
      dan aan de militair betaalde inkomsten, worden de eventueel resterende, niet betaalde inkomsten
      alsnog aan de militair betaald, indien een door hem aangevraagd hernieuwd onderzoek als bedoeld in
      [artikel 104 van het Algemeen militair ambtenarenreglement][ref1] in zijn voordeel is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel104
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '104'
  - number: 17a.5
    text: |-
      Het in het derde lid bedoelde verplichtingen- en sanctieregime is van overeenkomstige toepassing indien de militair
      bij doorbetaling van bezoldiging tijdens ziekte of arbeidsongeschiktheid de in dat lid bedoelde aanspraak niet had
      kunnen hebben.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel17a
  - number: 17b.1
    text: |-
      Indien aan de vrouwelijke militair zwangerschaps- en bevallingsverlof is verleend, behoudt zij haar aanspraak op
      inkomsten.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel17b
  - number: 17b.2
    text: |-
      De commandant draagt ervoor zorg dat de vrouwelijke militair door tussenkomst van de commandant een
      uitkering op basis van [hoofdstuk 3 van de Wet arbeid en zorg][ref1] aanvraagt bij het Uitvoeringsinstituut
      werknemersverzekeringen genoemd in [hoofdstuk 5 van de Wet-SUWI][ref2]. Deze uitkering moet uiterlijk twee
      weken voor de datum van ingang van het zwangerschaps- en bevallingsverlof onderscheidenlijk de datum waarop de
      vrouwelijke militair het recht op de uitkering wil laten ingaan, worden aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: 17b.3
    text: |-
      Indien de vrouwelijke militair aan wie zwangerschaps- en bevallingsverlof is verleend gedurende dat verlof
      of gedurende een bepaalde periode van dat verlof tevens recht heeft op een uitkering op basis van de
      [Wet arbeid en zorg][ref1], wordt door het hoofd defensieonderdeel gedurende de periode waarin sprake is van
      samenloop een inhouding op de doorbetaling als bedoeld in het eerste lid toegepast die overeenkomt met het bedrag
      van bedoelde uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '3'
  - number: 17b.4
    text: |-
      Indien aan de voorwaarden voor het toekennen van een uitkering als bedoeld in het tweede lid is voldaan maar
      geen uitkering is toegekend omdat de vrouwelijke militair geen aanvraag heeft ingediend, wordt het derde lid op
      overeenkomstige wijze toegepast.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel17b
  - number: 17c.1
    text: |-
      Indien aan de militair door de commandant adoptieverlof op basis van
      [artikel 3:2, eerste tot en met derde lid, van de Wet arbeid en zorg][ref1] is verleend behoudt hij zijn aanspraak
      op inkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: 17c.2
    text: |-
      De commandant draagt ervoor zorg dat de militair door tussenkomst van de commandant een uitkering op basis van
      [hoofdstuk 3 van de Wet arbeid en zorg][ref1] aanvraagt bij het Uitvoeringsinstituut werknemersverzekeringen
      bedoeld in [hoofdstuk 5 van de Wet-SUWI][ref2]. Deze uitkering moet uiterlijk twee weken voor de datum van ingang
      van het adoptieverlof onderscheidenlijk de datum waarop de militair het recht op de uitkering wil laten ingaan,
      worden aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: 17c.3
    text: |-
      Indien de militair aan wie adoptieverlof is verleend gedurende dat verlof of gedurende een bepaalde periode van
      dat verlof tevens recht heeft op een uitkering op basis van de [Wet arbeid en zorg][ref1], wordt door het hoofd
      defensieonderdeel gedurende de periode waarin sprake is van samenloop een inhouding op de doorbetaling, bedoeld in
      het eerste lid, toegepast die overeenkomt met het bedrag van bedoelde uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0013008
  - number: 17c.4
    text: |-
      Indien aan de voorwaarden voor het toekennen van een uitkering als bedoeld in het derde lid is voldaan maar geen
      uitkering is toegekend omdat de militair geen aanvraag heeft ingediend, wordt het derde lid op overeenkomstige
      wijze toegepast.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel17c
  - number: '18'
    text: |-
      Voor elke volledige dag dat de militair zich aan zijn dienstverplichtingen onttrekt, heeft hij geen aanspraak op
      inkomsten.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel18
  - number: '19.1'
    text: |-
      Bij de militair die ingevolge [artikel 34, eerste lid][ref1], dan wel ingevolge
      [artikel 34, tweede lid, onderdeel a of b, van het Algemeen militair ambtenarenreglement][ref2] is geschorst, wordt
      door de commandant voor de duur van die schorsing eenderde gedeelte ingehouden van de inkomsten, tenzij het hoofd
      defensieonderdeel bepaalt dat geen inhouding zal plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel34
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '34'
  - number: '19.2'
    text: |-
      In geval een schorsing als bedoeld in het eerste lid, langer duurt dan zes weken, kan het hoofd defensieonderdeel
      bepalen dat gedurende die verdere duur van die schorsing een verdere inhouding plaatsvindt tot het volle bedrag
      der inkomsten. Bij de afweging omtrent de hoogte van de inhouding wordt de financiële positie van de militair in de
      beschouwing betrokken.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel19
  - number: '19.3'
    text: |-
      Bij de militair die ingevolge [artikel 34, tweede lid, onder c, van het Algemeen militair ambtenarenreglement][ref1]
      is geschorst, vindt geen inhouding van inkomsten plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel34
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '34'
  - number: '19.4'
    text: |-
      De ingehouden inkomsten kunnen alsnog geheel of gedeeltelijk aan de militair worden uitbetaald, indien een schorsing
      als bedoeld in [artikel 34, tweede lid, onderdeel a of b, van het Algemeen militair ambtenarenreglement][ref1]
      niet wordt gevolgd door een veroordeling tot een onvoorwaardelijke vrijheidsstraf, een vrijheidsbenemende maatregel
      of ontslag uit de militaire dienst. Op de aldus uit te keren inkomsten worden in mindering gebracht de inkomsten,
      welke de militair sedert de schorsing heeft genoten uit arbeid, die hij als gevolg van de schorsing heeft kunnen
      verrichten, tenzij zulks, naar het oordeel van het hoofd defensieonderdeel, onredelijk of onbillijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel34
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '34'
  - number: '21'
    text: |-
      De militair die zich in krijgsgevangenschap bevindt of door een vreemde mogendheid is geïnterneerd, behoudt
      aanspraak op inkomsten, tenzij Onze Minister anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel21
  - number: '22.1'
    text: |-
      Indien de militair wordt vermist en gegronde redenen bestaan om aan te nemen dat hij zich aan zijn
      dienstverplichtingen onttrekt, dan wel zich in krijgsgevangenschap bevindt of door een vreemde mogendheid is
      geïnterneerd, is [artikel 18][ref1], onderscheidenlijk [21][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0007816#Artikel21
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '18'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0007816
        artikel: '21'
        hoofdstuk: '4'
  - number: '22.2'
    text: |-
      Indien de militair wordt vermist en het eerste lid niet van toepassing is, wordt de militair geacht te zijn
      overleden op de dag waarop hij wordt vermist.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel22
  - number: '22.3'
    text: |-
      Indien blijkt dat een op grond van het eerste of tweede lid gemaakte veronderstelling onjuist is geweest, stelt
      het hoofd defensieonderdeel de aanspraak op inkomsten met betrekking tot het tijdvak waarin de militair vermist is
      geweest vast in overeenstemming met de overige bepalingen van dit besluit. Daarbij geldt dat enerzijds kan worden
      bepaald dat eventueel te veel betaalde bedragen niet worden teruggevorderd, maar dat anderzijds rekening kan worden
      gehouden met:
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel22
  - number: 22.3.a
    text: een eventueel aan de gezinsleden van de militair toegekend tijdelijk pensioen;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel22
  - number: 22.3.b
    text: |-
      een eventueel aan nabestaanden van de militair toegekende uitkering op grond van
      [artikel 118b van het Algemeen militair ambtenarenreglement][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel118b
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 118b
  - number: 22.3.c
    text: |-
      eventuele andere inkomsten of baten die door de militair of zijn gezinsleden tijdens de duur van de vermissing van
      de militair in verband daarmede zijn genoten.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel22
  - number: '23.1'
    text: |-
      Onverminderd het tweede lid kan het hoofd defensieonderdeel het bedrag aan inkomsten waarop de militair
      over enig tijdvak aanspraak heeft, verminderen met het gehele of gedeeltelijke bedrag van de geldelijke
      inkomsten waarop die militair over hetzelfde tijdvak aanspraak heeft uit of in verband met arbeid of bedrijf
      anders dan als militair. Dit geldt uitsluitend, indien laatstbedoelde geldelijke inkomsten zijn verkregen
      uit of in verband met werkzaamheden, verricht gedurende de voor de militair geldende werktijd, bedoeld in
      [artikel 54a, onder d, van het Algemeen militair ambtenarenreglement][ref1]. De vermindering bedraagt ten hoogste
      het bedrag van de inkomsten als militair.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel54a
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 54a
  - number: '23.2'
    text: |-
      Indien de militair, bedoeld in [artikel 17, eerste lid][ref1], tijdens verhindering tot dienstverrichting in het
      belang van zijn genezing door de militair geneeskundige dienst wenselijk geachte arbeid voor zichzelf of voor
      derden verricht, worden - in afwijking van het eerste lid - de geldelijke inkomsten uit die arbeid slechts op zijn
      inkomsten als militair in mindering gebracht, voor zover de inkomsten uit die arbeid 30 procent van zijn inkomsten
      als militair te boven gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel17
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '17'
        hoofdstuk: '4'
  - number: '23.3'
    text: |-
      Indien de militair reeds vóór het tijdstip waarop hij de in het eerste lid bedoelde werkzaamheden heeft
      aangevangen, naast zijn inkomsten als militair tevens inkomsten uit of in verband met arbeid of bedrijf genoot,
      worden die inkomsten niet in aanmerking genomen bij de toepassing van het eerste lid. Dit is uitsluitend het geval,
      indien hij aannemelijk kan maken dat die inkomsten niet het gevolg zijn van verhoogde werkzaamheden of van andere
      oorzaken die verband houden met de werkzaamheden, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23
  - number: '23.4'
    text: |-
      Indien de militair reeds vóór het tijdstip waarop hij de in het eerste lid bedoelde werkzaamheden heeft
      aangevangen, inkomsten uit of in verband met arbeid of bedrijf genoot en hij na dat tijdstip meer inkomsten gaat
      genieten, worden die meerdere inkomsten in aanmerking genomen bij de toepassing van het eerste lid, tenzij hij
      aannemelijk kan maken dat die meerdere inkomsten niet het gevolg zijn van verhoogde werkzaamheden of van andere
      oorzaken die verband houden met de werkzaamheden, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23
  - number: '23.5'
    text: |-
      Het bedrag aan inkomsten waarop de militair over enig tijdvak aanspraak heeft, wordt verminderd met het bedrag van
      de geldelijke uitkeringen waarop hij met betrekking tot hetzelfde tijdvak krachtens een sociale verzekeringswet
      aanspraak heeft. Dit geldt uitsluitend, indien die geldelijke uitkeringen in de plaats zijn getreden van geldelijke
      inkomsten uit of in verband met arbeid of bedrijf, die met toepassing van het eerste lid in mindering zijn of
      zouden zijn gebracht tot ten hoogste het bedrag van de inkomsten als militair.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23
  - number: '23.6'
    text: |-
      Het hoofd defensieonderdeel kan het bedrag aan inkomsten waarop de militair over enig tijdvak aanspraak heeft,
      verminderen met het gehele of gedeeltelijke bedrag van de vaste vergoeding waarop de militair over hetzelfde
      tijdvak aanspraak heeft in verband met een functie in een publiekrechtelijk college waarvoor hem over dat tijdvak
      het in [artikel 12][ref1] bedoelde verlof is verleend. De vermindering bedraagt ten hoogste het bedrag van de
      inkomsten als militair.


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel12c
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: 12c
  - number: '23.7'
    text: |-
      De militair, bedoeld in het eerste tot en met het zesde lid, is gehouden de geldelijke inkomsten of uitkeringen
      uit of in verband met arbeid of bedrijf, dan wel de vaste vergoedingen in verband met een functie in een
      publiekrechtelijk college te melden aan het hoofd defensieonderdeel onder overlegging van een gespecificeerde
      opgave van die inkomsten, uitkeringen of vergoedingen.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23
  - number: 23a.1
    text: |-
      Als inkomstenbestanddelen ingevolge dit besluit gelden, bij de berekening van de grondslag voor militair
      ouderdoms- en nabestaandenpensioen en pensioen ter zake van ziekten of gebreken naar de bij of krachtens de
      [Kaderwet militaire pensioenen][ref1] vast te stellen regels, uitsluitend:


      [ref1]: https://wetten.overheid.nl/BWBR0011955
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0011955
  - number: 23a.1.a
    text: de bezoldiging;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23a
  - number: 23a.1.b
    text: |-
      de vakantie-uitkering, met uitzondering van dat deel, dat als een tijdelijk bestanddeel van de inkomsten wordt
      aangemerkt;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23a
  - number: 23a.1.c
    text: de eindejaarsuitkering;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23a
  - number: 23a.1.d
    text: de vliegtoelage;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23a
  - number: 23a.1.e
    text: de garantievliegtoelage;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23a
  - number: 23a.1.f
    text: de toelage Huis van H.M. de Koningin;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23a
  - number: 23a.1.g
    text: de functioneringstoelage, indien deze voor ten minste vijf jaren onafgebroken is toegekend;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23a
  - number: 23a.1.h
    text: |-
      de toelage officieren-arts, officieren-tandarts en officieren-apotheker, zodra deze toelage laatstelijk gedurende
      vijf jaren onafgebroken is genoten;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23a
  - number: 23a.1.i
    text: |-
      de toelage officieren-medisch specialist, zodra deze toelage laatstelijk gedurende vijf jaren onafgebroken is
      genoten;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23a
  - number: 23a.1.j
    text: de brevettoelage marinierskapel;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23a
  - number: 23a.1.k
    text: |-
      een op grond van [artikel 26][ref1] van dit besluit dan wel een voor 1 januari 2009 op grond van
      [artikel 115 van het Algemeen militair ambtenarenreglement][ref2] toegekende schadeloosstelling, vergoeding of
      tegemoetkoming, voor zover deze, naar het oordeel van Onze Minister, een vast onderdeel van zijn inkomen vormt;


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel115
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '26'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '115'
  - number: 23a.1.l
    text: |-
      de door Onze Minister te schatten geldswaarden per jaar van het emolument van kleermakers, schoenmakers en barbiers
      der zeemacht wegens werkzaamheden ten dienste van de militairen, welke schatting niet individueel geschiedt doch
      voor alle kleermakers, schoenmakers en barbiers naar een voor elk van deze categorieën te bepalen bedrag, berekend
      naar de gemiddelde inkomsten, welke door elke categorie jaarlijks uit het bedrijf wordt genoten;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23a
  - number: 23a.1.m
    text: het emolument huisvesting Koninklijke marechaussee;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23a
  - number: 23a.1.n
    text: |-
      de vaste vergoeding voor extra beslaglegging van de militair die zich in fase twee of drie bevindt, voor zover hij
      deze na 31 december 2001 heeft genoten, met uitzondering van de militair, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23a
  - number: 23a.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing voor de gewezen militair die een uitkering ingevolge de
      [Uitkeringswet gewezen militairen][ref1] geniet en voor wie de ontslagleeftijd met ingang van 1 januari 2006 bij of
      krachtens [artikel 12 van de Militaire Ambtenarenwet 1931][ref2] is gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002540
      [ref2]: https://wetten.overheid.nl/BWBR0001952#Artikel12
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0002540
      - id: ref2
        bwb_id: BWBR0001952
        artikel: '12'
  - number: 23a.3
    text: |-
      Het eerste lid is van overeenkomstige toepassing voor de gewezen militair die een ontslaguitkering, waaronder
      tevens te begrijpen een uitkering ingevolge de [Uitkeringswet gewezen militairen][ref1], geniet in de zin van de
      bij of krachtens de [Kaderwet militaire pensioenen](onbekend) vastgestelde regels, met dien verstande dat onderdeel
      n van het eerste lid niet als inkomensbestanddeel bij de berekening van de pensioengrondslag wordt meegenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002540
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0002540
  - number: 23a.4
    text: 'Met de uitzondering genoemd in het eerste lid, onderdeel n, wordt bedoeld:'
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23a
  - number: 23a.4.a
    text: |-
      de militair van de zeemacht zonder rang, of die een rang bekleedt lager dan luitenant ter zee der derde klasse die
      in het jaar 2002, 2003, 2004 of 2005 de leeftijd van vijftig jaar heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23a
  - number: 23a.4.b
    text: |-
      de militair van de zeemacht, die de rang bekleedt van luitenant ter zee der derde klasse, luitenant ter zee der
      tweede klasse of luitenant ter zee der tweede klasse oudste categorie, die in het jaar 2002, 2003, 2004 of 2005 de
      leeftijd van tweeënvijftig jaar heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23a
  - number: 23a.4.c
    text: 'de militair van de zeemacht die de rang bekleedt van luitenant ter zee der eerste klasse, of een hogere rang, die:'
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23a
  - number: 23a.4.c.1°
    text: van 1 januari 2002 tot en met 30 juni 2002 de leeftijd van drieënvijftig jaar en zes maanden heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23a
  - number: 23a.4.c.2°
    text: van 1 juli 2002 tot en met 30 juni 2003 de leeftijd van drieënvijftig jaar en negen maanden heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23a
  - number: 23a.4.c.3°
    text: van 1 juli 2003 tot en met 30 juni 2005 de leeftijd van vierenvijftig jaar heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23a
  - number: 23a.4.c.4°
    text: van 1 juli 2005 tot en met 30 juni 2006 de leeftijd van vierenvijftig jaar en drie maanden heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23a
  - number: 23a.4.c.5°
    text: van 1 juli 2006 tot en met 30 juni 2007 de leeftijd van vierenvijftig jaar en zes maanden bereikt;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23a
  - number: 23a.4.c.6°
    text: van 1 juli 2007 tot en met 30 juni 2008 de leeftijd van vierenvijftig jaar en negen maanden bereikt;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23a
  - number: 23a.4.c.7°
    text: van 1 juli 2008 tot en met 31 december 2008 de leeftijd van vijfenvijftig jaar bereikt;
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23a
  - number: 23a.4.d
    text: de overige militairen die in het jaar 2002, 2003, 2004 en 2005 de leeftijd van vijfenvijftig jaar hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23a
  - number: 23b.1
    text: |-
      De eigen bijdrage van de militair aan het arbeidsongeschiktheidspensioen komt
      overeen met het pensioenbijdrageverhaal voor het invaliditeitspensioen dat ingevolge
      [artikel 4, vijfde lid van de Wet privatisering ABP][ref1] van een overheidswerknemer, die met die militair kan
      worden gelijkgesteld, door de sectorwerkgever wordt geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel4
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '4'
  - number: 23b.2
    text: |-
      De eigen bijdrage van de gewezen militair aan het arbeidsongeschiktheidspensioen komt
      overeen met het pensioenbijdrageverhaal voor het invaliditeitspensioen dat ingevolge
      [artikel 4, vijfde lid, van de Wet privatisering ABP][ref1] van een gewezen overheidswerknemer, die met die gewezen
      militair kan worden gelijkgesteld, door de voor de ontslaguitkering zorgdragende instantie wordt geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel4
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '4'
  - number: 23b.3
    text: |-
      De tijdelijke aanvullende eigen bijdrage van de militair en de gewezen militair aan het ouderdoms-
      en nabestaandenpensioen bedraagt een door het bestuur van de Stichting Pensioenfonds ABP ingevolge de
      [Kaderwet militaire pensioenen][ref1] vast te stellen extra bijdrage. Deze bijdrage wordt geheven over de
      bijdragegrondslag die geldt voor het pensioenbijdrageverhaal voor het ouderdoms- en nabestaandenpensioen in de
      desbetreffende jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0011955
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0011955
  - number: 23c.1
    text: |-
      Op de inkomsten van de militair bedoeld in [artikel 23a, vierde lid][ref1], wordt een pseudo-
      pensioenpremievergoeding voor extra beslaglegging ingehouden, overeenkomstig de pensioenbijdrage die verhaald zou
      zijn indien op basis van [artikel 23a, onderdeel n][ref2], de vaste vergoeding voor extra beslaglegging voor zover
      hij deze na 31 december 2001 heeft genoten, tot zijn pensioengrondslag zou behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel23a
      [ref2]: https://wetten.overheid.nl/BWBR0007816#Artikel23a
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23c
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: 23a
        hoofdstuk: 4a
      - id: ref2
        bwb_id: BWBR0007816
        artikel: 23a
        hoofdstuk: 4a
  - number: 23c.2
    text: |-
      De pseudo-pensioenpremievergoeding voor extra beslaglegging wordt op de datum dat hij met leeftijdsontslag gaat
      gerestitueerd aan de militair, uitgezonderd de militair bedoeld in het derde en vierde lid.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23c
  - number: 23c.3
    text: |-
      Voor de militair, bedoeld in het eerste lid, die na 31 december 2002 de leeftijd bereikt waarop hij twee jaren
      ouder is dan de voor hem geldende ontslagleeftijd als bedoeld in [artikel 39a AMAR][ref1] wordt de pseudo-
      pensioenpremievergoeding voor extra beslaglegging op de datum van eerstbedoelde leeftijd omgezet in een
      pensioenbijdrage en wordt de vaste vergoeding voor extra beslaglegging tot de berekeningsgrondslag voor het
      pensioen gerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel39a
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23c
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 39a
  - number: 23c.4
    text: |-
      Voor de militair, bedoeld in het eerste lid, die na 31 december 2002 met leeftijdsontslag gaat en op
      de ontslagdatum twee jaar ouder is dan de op die datum voor hem geldende ontslagleeftijd als bedoeld in
      [artikel 39a AMAR][ref1], wordt de pseudo-pensioenpremie vergoeding voor extra beslaglegging op de datum
      van ontslag omgezet in een pensioenbijdrage en wordt de vaste vergoeding voor extra beslaglegging tot de
      berekeningsgrondslag voor het pensioen gerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel39a
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23c
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 39a
  - number: 23c.5
    text: |-
      Het tweede, derde en vierde lid zijn van overeenkomstige toepassing indien deze militair komt te overlijden voordat
      hij is ontslagen, te rekenen naar de overlijdensdatum.
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23c
  - number: 23d.1
    text: |-
      Over de toelage bedoeld in [artikel 23a, eerste lid, onderdeel i][ref1], wordt, zolang niet is uitgesloten dat aan
      de in dat onderdeel bedoelde voorwaarde zal worden voldaan, een pseudo-pensioenpremie ingehouden, overeenkomstig de
      pensioenbijdrage die verhaald zou zijn, indien die toelage tot zijn pensioengrondslag zou behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel23a
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23d
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: 23a
        hoofdstuk: 4a
  - number: 23d.2
    text: |-
      De in het eerste lid bedoelde pseudo-pensioenpremie is verschuldigd, totdat blijkt dat aan de in
      [artikel 23a, eerste lid, onderdeel i][ref1], bedoelde voorwaarde is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel23a
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23d
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: 23a
        hoofdstuk: 4a
  - number: 23d.3
    text: |-
      De in het eerste lid bedoelde pseudo-pensioenpremie over de toelage wordt aan de militair gerestitueerd, zodra
      die toelage niet meer wordt genoten en is uitgesloten dat aan de in [artikel 23a, eerste lid, onderdeel i][ref1],
      bedoelde voorwaarde zal worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel23a
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23d
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: 23a
        hoofdstuk: 4a
  - number: 23d.4
    text: |-
      Het derde lid is van overeenkomstige toepassing indien de militair komt te overlijden en niet aan de in
      [artikel 23a, eerste lid, onderdeel i][ref1], bedoelde voorwaarde is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel23a
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel23d
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: 23a
        hoofdstuk: 4a
  - number: 24a
    text: |-
      De militair die op 31 mei 2001 aanspraak had op een overbruggingstoelage op grond van
      [artikel 9, eerste lid, onder b][ref1], volgens de bepalingen van dit besluit zoals deze luidden op 31 mei 2001,
      behoudt zijn aanspraak op de overbruggingstoelage volgens de bepalingen van dit besluit zoals deze luidden op
      voornoemde datum.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel9
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '9'
        hoofdstuk: '2'
  - number: '25'
    text: |-
      Bij de vaststelling van de grondslag voor de vakantie-uitkering wordt in voorkomend geval het ingevolge de bij of
      krachtens de [Kaderwet militaire pensioenen][ref1] bepaalde emolument huisvesting Koninklijke marechaussee, mede in
      aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011955
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011955
  - number: 25a
    text: |-
      Van de bevoegdheid tot het vaststellen van ministeriële regelingen als bedoeld in
      [artikel 16, eerste lid, onderdelen c en d][ref1], kan mandaat worden verleend aan de hoofddirecteur personeel van
      het Ministerie van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel16
    url: https://wetten.overheid.nl/BWBR0007816/2015-09-01#Artikel25a
