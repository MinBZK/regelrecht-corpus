preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Defensie van 11 augustus 1995, nr. PAV 6011/95014842;

    Gelet op artikel 125 van de Ambtenarenwet en artikel 12 van de Militaire ambtenarenwet 1931;

    De Raad van State gehoord (advies van 14 december 1995, nr. W07.95.0432);

    Gezien het nader rapport van de Staatssecretaris van Defensie van 20 december 1995, nr. PAV 6011/95023787;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Defensie;'
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel1
  - number: 1.1.b
    text: |-
      «Bevelhebber» de bevelhebber van het desbetreffende krijgsmachtdeel of de commandant van het wapen der Koninklijke
      marechaussee;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel1
  - number: 1.1.c
    text: 'commandant: een bij ministeriële regeling aan te wijzen functionaris;'
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel1
  - number: 1.1.d
    text: |-
      militair: de militaire ambtenaar in de zin van
      [artikel 1, eerste en tweede lid, van de Militaire ambtenarenwet 1931][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel1
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: '1'
  - number: 1.1.e
    text: 'werkelijke dienst: de tijd gedurende welke de militair:'
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel1
  - number: 1.1.e.1°
    text: |-
      is aangesteld bij het beroepspersoneel en hij niet op nonactiviteit is gesteld en hem geen buitengewoon verlof van
      lange duur zonder behoud van inkomsten is verleend;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel1
  - number: 1.1.e.2°
    text: behoort tot het reserve-personeel en als zodanig feitelijk onder de wapenen is;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel1
  - number: 1.1.f
    text: 'rang: een militaire rang en stand of klasse, voor zover niet titulair toegekend;'
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel1
  - number: 1.1.g
    text: 'officier: de militair met de rang van luitenant ter zee der derde klasse, tweede luitenant of met een hogere rang;'
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel1
  - number: 1.1.h
    text: |-
      gezin en gezinsleden: de echtgenote van de militair en de kinderen, stief- en pleegkinderen van de militair of van
      zijn echtgenote;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel1
  - number: 1.1.i
    text: |-
      salaris: het bedrag dat met inachtneming van de bepalingen van dit besluit voor de militair is vastgesteld op grond
      van [artikel 5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel5
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '5'
        hoofdstuk: '2'
  - number: 1.1.j
    text: 'salarisschaal: een reeks van salarissen, behorende bij een bepaalde rang;'
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel1
  - number: 1.1.k
    text: |-
      bezoldiging: het salaris, in voorkomend geval vermeerderd met de overbruggingstoelage, bedoeld in
      [artikel 9][ref1], en de garantietoelage minimumloon, bedoeld in [artikel 10][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0007816#Artikel10
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '9'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007816
        artikel: '10'
        hoofdstuk: '2'
  - number: 1.1.l
    text: 'inkomsten: alle beloningen in geld waarop de militair aanspraak kan maken bij of krachtens dit besluit;'
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel1
  - number: 1.1.m
    text: '*salarisnummer:* het getal dat in een salarisschaal voor een salaris is vermeld;'
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel1
  - number: 1.1.n
    text: 'maand: een kalendermaand;'
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel1
  - number: 1.1.o
    text: |-
      werknemersverzekering: [Werkloosheidswet][ref1], [Wet op de Arbeidsongeschiktheidsverzekering][ref2], dan wel de
      [Ziektewet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0001888
  - number: '1.2'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt mede verstaan onder militair: degene die is aangesteld in
      burgerlijke openbare dienst om bij de krijgsmacht als geestelijk verzorger werkzaam te zijn.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel1
  - number: '1.3'
    text: |-
      Met inachtneming van [artikel 1, derde en vierde lid, van het Algemeen militair ambtenarenreglement][ref1] wordt in
      dit besluit en de daarop berustende bepalingen mede verstaan onder echtgenote of echtgenoot:


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel1
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '1'
  - number: 1.3.1°
    text: de geregistreerde partner;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel1
  - number: 1.3.2°
    text: |-
      degene die door de militair als partner is aangemeld bij de Stichting Pensioenfonds ABP en door het bestuur van dat
      fonds als zodanig is aangemerkt, op voorwaarde dat de militair een bewijs van die aanmelding heeft overgelegd aan
      de commandant;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel1
  - number: '2.1'
    text: |-
      Onze Minister kan in geval van buitengewone omstandigheden tijdelijk afwijken van hetgeen bij of krachtens dit
      besluit is bepaald, indien en voor zolang dit met het oog op de goede uitvoering van de operationele taken van de
      krijgsmacht noodzakelijk wordt geacht.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel2
  - number: '2.2'
    text: |-
      Bij ministeriële regeling kunnen voorts afwijkende regelen worden gesteld ten aanzien van militairen, die zijn
      tewerkgesteld of ingezet:
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel2
  - number: 2.2.a
    text: onder leiding of toezicht van een orgaan van de Verenigde Naties;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel2
  - number: 2.2.b
    text: bij of ten behoeve van een bondgenootschappelijk orgaan of bondgenootschappelijke strijdkrachten;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel2
  - number: 2.2.c
    text: |-
      ten behoeve van operaties in het kader van internationale overeenkomsten of andere verplichtingen door Nederland
      aangegaan;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel2
  - number: 2.2.d
    text: buiten het Ministerie van Defensie anders dan in de gevallen, bedoeld onder a, b en c.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel2
  - number: '2.3'
    text: |-
      Bij ministeriële regeling kan voor de militair die verblijft buiten Nederland worden afgeweken van hetgeen bij
      of krachtens dit besluit is bepaald, voor zover het betreft de aanspraak op voor gehuwde militairen geldende
      voorzieningen.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel2
  - number: '3.1'
    text: |-
      Voor zover in dit besluit niet anders is bepaald, heeft de militair aanspraak op inkomsten voor elke dag dat hij in
      werkelijke dienst is; daarbij wordt een gedeelte van een dag aangemerkt als een volle dag.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel3
  - number: '3.2'
    text: |-
      Bij de vaststelling van inkomsten die zijn uitgedrukt per maand wordt een maand gesteld op dertig dagen. Bij de
      berekening over een gedeelte van een maand wordt het bedrag per dag vastgesteld door het maandbedrag te delen door
      dertig. Een wijziging van inkomsten op de eenendertigste van een maand gaat in op de eerste dag van de volgende
      maand.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel3
  - number: '3.3'
    text: |-
      Tenzij anders is bepaald, kan op inkomsten die zijn uitgedrukt per dag of per tijdseenheid van langere duur en
      die niet tot de bezoldiging behoren, slechts aanspraak bestaan voor de tijd dat aanspraak bestaat op bezoldiging.
      Bedoelde inkomsten worden dan toegekend in evenredigheid met de bezoldiging waarop aanspraak bestaat.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel3
  - number: 3a
    text: |-
      Betalingen op grond van dit besluit of op grond van andere regelingen inzake beloningen van de militair,
      waarop vóór 1 januari 2001 aanspraak is ontstaan maar die in 2001 worden uitbetaald en waarover loonheffing is
      verschuldigd, worden verhoogd met 1,9%.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel3a
  - number: 3b
    text: |-
      Voor de berekening van het pensioen gevend inkomen worden aanspraken op grond van dit besluit of op grond van
      andere regelingen inzake beloningen van de militair, vermenigvuldigd met een factor 1/1,019 met inachtneming van
      een maximale vermindering van het pensioen gevend inkomen van f 139,84.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel3b
  - number: '4'
    text: |-
      De salarisschalen voor militairen zijn opgenomen in de bij dit besluit behorende [bijlage A][ref1] of [B][ref2],
      die blijkens het opschrift betrekking heeft op het krijgsmachtdeel waartoe de militair behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0007816
      [ref2]: https://wetten.overheid.nl/BWBR0007816
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007816
      - id: ref2
        bwb_id: BWBR0007816
  - number: '5.1'
    text: 'De militair heeft aanspraak op een salaris dat wordt bepaald met inachtneming van:'
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel5
  - number: 5.1.a
    text: het krijgsmachtdeel waartoe hij behoort;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel5
  - number: 5.1.b
    text: zijn rang en
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel5
  - number: 5.1.c
    text: zijn salarisnummer.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel5
  - number: '5.2'
    text: |-
      De militair van de Koninklijke landmacht die behoort tot het Korps Nationale Reserve heeft aanspraak op 50 procent
      van het salaris dat op grond van het eerste lid wordt vastgesteld, indien hij werkelijke dienst verricht ter zake
      van bij ministeriële regeling vastgestelde activiteiten.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel5
  - number: '5.3'
    text: |-
      De militair heeft in de volgende gevallen aanspraak op een verhoging van zijn salaris met een in bijlage C van dit
      besluit in tabel 2 opgenomen bedrag boven het maximum van zijn salarisschaal:
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel5
  - number: 5.3.a
    text: 'indien hij behoort tot de Koninklijke marine:'
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel5
  - number: 5.3.a.1°
    text: |-
      met de rang van matroos der eerste klasse: met ingang van de maand waarin zes, acht, tien of achttien jaren zijn
      verstreken sinds bedoeld schaalmaximum is bereikt, met dien verstande dat op het bedrag behorende bij achttien
      jaren of meer niet vóór 1 april 1996 aanspraak bestaat;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel5
  - number: 5.3.a.2°
    text: |-
      met de rang van korporaal: met ingang van de maand waarin zes of acht jaren zijn verstreken sinds bedoeld
      schaalmaximum is bereikt;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel5
  - number: 5.3.b
    text: 'indien hij behoort tot de Koninklijke landmacht of de Koninklijke luchtmacht:'
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel5
  - number: 5.3.b.1°
    text: |-
      met de rang van korporaal: met ingang van de maand waarin zes, acht of tien jaren zijn verstreken sinds bedoeld
      schaalmaximum is bereikt;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel5
  - number: 5.3.b.2°
    text: |-
      met de rang van korporaal der eerste klasse: met ingang van de maand waarin zes, acht, tien of veertien jaren zijn
      verstreken sinds bedoelde schaalmaximum is bereikt, met dien verstande dat op het bedrag behorende bij veertien
      jaren of meer niet vóór 1 april 1996 aanspraak bestaat;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel5
  - number: 5.3.b.3°
    text: |-
      met de rang van sergeant: met ingang van de maand waarin zes of acht jaren zijn verstreken sinds bedoeld
      schaalmaximum is bereikt.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel5
  - number: 5a
    text: |-
      Voor de militair van 18 tot en met 23 jaar met de stand van matroos der derde klasse, matroos der tweede klasse,
      soldaat en soldaat der eerste klasse, voor wie op 31 maart 1998 een salaris gold als vermeld in de bijlagen A en
      B van dit besluit, zoals deze luidden op bedoelde dag, geldt, in afwijking van [artikel 5, eerste lid][ref1], het
      hieronder vermelde salaris:







                  salarisnummer


                  matr3/sld


                  matr2/sld1






                  0


                  f 2 033,–


                  f 2 075,–




                  1


                  f 2 323,–


                  f 2 371,–




                  2


                  f 2 614,–


                  f 2 668,–




                  3


                  f 2 904,–


                  f 2 964,–




                  4


                  f 2 939,–


                  f 3 008,–


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel5
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '5'
        hoofdstuk: '2'
  - number: '7.1'
    text: |-
      De bevelhebber kent de militair bij aanstelling een salarisnummer binnen de bij zijn rang behorende salarisschaal
      toe op basis van kennis en ervaring van de militair.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel7
  - number: '7.2'
    text: |-
      Aan de militair van 20, 21, 22 of 23 jaar en ouder wordt bij aanstelling respectievelijk ten minste salarisnummer
      1, 2, 3 of 4 toegekend.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel7
  - number: '7.3'
    text: |-
      Het salarisnummer van de militair wordt jaarlijks met één verhoogd. Deze verhoging is ook van toepassing op de
      militair, die het maximum van de salarisschaal heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel7
  - number: '7.4'
    text: |-
      De in het derde lid bedoelde verhoging van het salarisnummer vindt plaats met ingang van de eerste dag van de maand
      waarin één jaar is verstreken sedert de dag waarop zijn salarisnummer voor de laatste maal is toegekend.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel7
  - number: '7.5'
    text: |-
      De bevelhebber kan een hoger salarisnummer toekennen aan een militair, indien deze naar het oordeel van de
      bevelhebber daarvoor in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel7
  - number: '7.6'
    text: |-
      De bevelhebber kan een verhoging van het salarisnummer achterwege laten, indien de militair niet naar behoren
      functioneert.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel7
  - number: '8.1'
    text: De militair behoudt zijn salarisnummer indien hij wordt bevorderd.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel8
  - number: '8.2'
    text: |-
      Indien het salarisnummer van een militair, na bevordering, lager is dan het laagste salarisnummer waarvoor bij
      zijn nieuwe salarisschaal een bedrag is opgenomen, wordt de militair door de bevelhebber een hoger salarisnummer
      toegekend, zodanig dat de militair aanspraak verkrijgt op het laagste bedrag behorende bij zijn nieuwe
      salarisschaal.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel8
  - number: '8.3'
    text: |-
      Indien de in het tweede lid bedoelde militair tijdelijk is bevorderd en de rang herkrijgt die hij had voordat hij
      tijdelijk werd bevorderd, vervalt de in het vorige lid bedoelde verhoging van het salarisnummer.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel8
  - number: 8a.1
    text: |-
      Voor de militair, die op 31 mei 2001 aanspraak maakt op salaris, wordt op 1 juni 2001 zijn tot die tijd geldende
      diensttijd omgezet in een salarisnummer aan de hand van de salarisschalen van [bijlage A][ref1] en [B][ref2] en
      met inachtneming van het volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0007816
      [ref2]: https://wetten.overheid.nl/BWBR0007816
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0007816
      - id: ref2
        bwb_id: BWBR0007816
  - number: 8a.1.a
    text: |-
      Het salarisnummer wordt toegekend zodanig, dat het salaris op 1 juni 2001 gelijk is aan het salaris dat voor hem op
      die datum zou hebben gegolden bij toepassing van dit besluit zoals dat luidde op 31 mei 2001;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel8a
  - number: 8a.1.b
    text: |-
      Indien dit salaris niet voorkomt in de salarisschaal wordt het salarisnummer toegekend zodanig, dat het salaris
      gelijk is aan het eersthogere bedrag in de salarisschaal;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel8a
  - number: 8a.1.c
    text: |-
      Voor de militair, die één of meer jaren diensttijd had boven de diensttijd behorende bij het maximum salaris in de
      salarisschaal, wordt het salarisnummer hoger vastgesteld overeenkomstig dat aantal jaren diensttijd.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel8a
  - number: 8a.2
    text: |-
      In afwijking van [artikel 7, vierde lid][ref1], wordt voor de militair, die op 31 mei 2001 aanspraak maakt op
      salaris, de datum van de eerstvolgende verhoging van het salarisnummer na 1 juni 2001 als volgt vastgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel7
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '7'
        hoofdstuk: '2'
  - number: 8a.2.a
    text: 'voor de militair, bedoeld in het eerste lid, onder b: één jaar na de toekenning van het salarisnummer;'
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel8a
  - number: 8a.2.b
    text: |-
      voor de militair, voor wie de diensttijd vóór 1 juni 2001 met tenminste een jaar is vermeerderd en voor de
      officier, niet bedoeld onder a: overeenkomstig de diensttijdbepalingen van dit besluit zoals deze luidden op 31
      mei 2001;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel8a
  - number: 8a.2.c
    text: 'voor de overige militairen: de eerste dag van de maand waarin één jaar is verstreken sedert zijn aanstelling.'
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel8a
  - number: '9.1'
    text: |-
      Een militair wiens salaris vermindering ondergaat, heeft aanspraak op een overbruggingstoelage ten bedrage van die
      vermindering, indien hij:
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel9
  - number: 9.1.a
    text: |-
      na een verandering in zijn dienstverhouding tot het Rijk - in verband met het volgen van een opleiding wordt
      aangesteld in een lagere rang; of
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel9
  - number: 9.1.b
    text: na overgang naar een ander krijgsmachtdeel aanspraak heeft op een lager salaris.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel9
  - number: '9.2'
    text: |-
      Een militair, voor wie na bevordering de functioneringstoelage is vervallen, of het bedrag ervan op nul is gesteld,
      heeft aanspraak op een overbruggingstoelage indien hij na bevordering aanspraak heeft op een salaris dat lager
      is dan het salaris vermeerderd met de functioneringstoelage waarop hij direct voorafgaande aan die bevordering
      aanspraak had, ten bedrage van deze vermindering.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel9
  - number: '9.3'
    text: |-
      Indien het salaris van de militair aan wie een overbruggingstoelage is toegekend, wordt verhoogd anders dan op
      grond van een algemene salarismaatregel, wordt de overbruggingstoelage met het bedrag van die verhoging verminderd.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel9
  - number: '9.4'
    text: |-
      Geen aanspraak op een overbruggingstoelage wordt verleend, dan wel de aanspraak op de toegekende
      overbruggingstoelage vervalt, indien de militair na een tijdelijke rang te hebben bekleed, de rang herkrijgt die
      hij had voordat hij tijdelijk werd bevorderd.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel9
  - number: '9.5'
    text: |-
      Voor de militair, die op 31 december 2000 aanspraak heeft op een overbruggingstoelage, wordt de toelage met ingang
      van 1 januari 2001 verhoogd met 1,9%.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel9
  - number: '10'
    text: |-
      De militair wiens salaris - in voorkomend geval verhoogd met een overbruggingstoelage -
      lager is dan het maandbedrag van het minimumloon dat krachtens de [artikelen 7][ref1], 8 en
      [14 van de Wet minimumloon en minimumvakantiebijslag][ref2] geldt voor werknemers van dezelfde leeftijd, heeft
      aanspraak op een garantietoelage minimumloon ten bedrage van het verschil.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel14
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '14'
  - number: '11.1'
    text: |-
      De militair die is belast met de volledige waarneming van een functie, bedoeld in
      [artikel 25, eerste lid, van het Algemeen militair ambtenarenreglement][ref1], heeft, indien aan die functie een
      hogere rang is verbonden, voor de duur van de waarneming aanspraak op een waarnemingstoelage.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel25
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '25'
  - number: '11.2'
    text: |-
      De toelage wordt toegekend, indien de waarneming ten minste een tijdvak van dertig aaneengesloten dagen heeft
      geduurd.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel11
  - number: '11.3'
    text: |-
      Het bedrag van de toelage is gelijk aan het verschil tussen de bezoldiging waarop de militair aanspraak heeft
      en de bezoldiging waarop hij aanspraak zou hebben, indien de waargenomen functie hem zou zijn toegewezen en hij
      dientengevolge zou zijn bevorderd tot de aan die functie verbonden rang.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel11
  - number: 11a.1
    text: |-
      De militair, die voor onbepaalde tijd is aangesteld heeft tot en met 31 december 2009 bij een bevordering,
      als bedoeld in [artikel 27, vierde lid, van het Algemeen militair ambtenarenreglement][ref1], aanspraak op een
      eenmalige toeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel27
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '27'
  - number: 11a.2
    text: |-
      Het bedrag van de toeslag is gelijk aan vier maal het verschil tussen het salaris waarop hij aanspraak maakt na de
      bevordering en het salaris waarop hij aanspraak maakte voor de bevordering.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel11a
  - number: '12.1'
    text: |-
      De bevelhebber kan aan een militair, die voor onbepaalde tijd is aangesteld bij het beroepspersoneel, een premie
      toekennen, indien hij na afloop van een voor hem uit [artikel 7][ref1], eerste lid, dan wel [artikel 14][ref2],
      tweede lid, en [artikel 15, tweede lid, van het Algemeen militair ambtenarenreglement][ref3] voortvloeiende
      verplichting nog gedurende een bepaalde periode onafgebroken deel heeft uitgemaakt van het beroepspersoneel voor
      onbepaalde tijd. De toekenning geschiedt naar bij ministeriële regeling te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0003482#Artikel15
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0003482
        artikel: '15'
  - number: '12.2'
    text: |-
      Uitbetaling van de premie vindt plaats binnen twee maanden nadat de militair de in het eerste lid bedoelde periode
      heeft voltooid.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel12
  - number: 12a.1
    text: |-
      Onze Minister kan een functioneringstoelage toekennen aan de militair met een rang van luitenant-generaal, vice-
      admiraal of hoger, of aan de commandant van het wapen der Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel12a
  - number: 12a.2
    text: |-
      De bevelhebber kan aan een militair, niet bedoeld in het eerste lid, die voor onbepaalde tijd is aangesteld bij het
      beroepspersoneel en het voor hem geldende maximumsalaris heeft bereikt, een functioneringstoelage toekennen, indien
      de wijze van functioneren van die militair daartoe naar het oordeel van de bevelhebber aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel12a
  - number: 12a.3
    text: De functioneringstoelage wordt toegekend voor een periode van tenminste één jaar.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel12a
  - number: 12a.4
    text: De functioneringstoelage bedraagt ten hoogste 10 procent van het voor de militair geldende salaris.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel12a
  - number: 12a.5
    text: |-
      Indien de militair, die een functioneringstoelage geniet, wordt bevorderd, niet zijnde een tijdelijke bevordering,
      komt de functioneringstoelage met ingang van de datum van de bevordering te vervallen.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel12a
  - number: 12a.6
    text: |-
      Indien de militair, die een functioneringstoelage geniet, tijdelijk wordt bevorderd, wordt het bedrag van de
      functioneringstoelage gedurende de tijd dat hij de tijdelijke rang bekleedt, op nul gesteld.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel12a
  - number: '13.1'
    text: |-
      Aan een militair die zich tijdens het verblijf in werkelijke dienst bijzonder heeft onderscheiden door optreden
      of gedragingen dan wel door buitengewone toewijding of bijzondere loffelijke dienstverrichtingen, kunnen, naar bij
      ministeriële regeling te stellen regels één of meer van de onderstaande beloningen worden toegekend:
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel13
  - number: 13.1.a
    text: geschenk;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel13
  - number: 13.1.b
    text: geldelijke beloning;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel13
  - number: 13.1.c
    text: functioneringsgratificatie.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel13
  - number: '13.2'
    text: |-
      De minister kan de beloningen, genoemd in het eerste lid, toekennen aan een militair met de rang van luitenant-
      generaal, vice-admiraal, generaal of luitenant-admiraal, of aan de commandant van het wapen der Koninklijke
      marechaussee.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel13
  - number: '13.3'
    text: |-
      De commandant kan de beloningen, genoemd in het eerste lid, toekennen aan een militair niet bedoeld in het tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel13
  - number: '13.4'
    text: Het maximumbedrag van de beloningen, genoemd in het eerste lid, wordt bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel13
  - number: '14.1'
    text: |-
      De militair met aanspraak op salaris heeft aanspraak op een vakantie-uitkering ten bedrage van 8 procent van de
      door hem genoten bezoldiging, in voorkomend geval vermeerderd met:
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel14
  - number: 14.1.a
    text: de waarnemingstoelage;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel14
  - number: 14.1.b
    text: |-
      de toelage officieren-arts, -tandarts, of -apotheker, zodra deze laatstelijk gedurende vijf jaren onafgebroken
      is genoten;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel14
  - number: 14.1.c
    text: de brevettoelage voor het vervullen van een eerste partij bij de marinierskapel der Koninklijke marine;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel14
  - number: 14.1.d
    text: de brevettoelage voor het vervullen van een solistenpartij bij de marinierskapel der Koninklijke marine;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel14
  - number: 14.1.e
    text: de vliegtoelage of de garantievliegtoelage;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel14
  - number: 14.1.f
    text: de toelage woninghuur Koninklijke marechaussee;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel14
  - number: 14.1.g
    text: |-
      het emolument van kleermakers, schoenmakers en barbiers der zeemacht, bedoeld in artikel 2, onder [II, onderdeel ]
      (onbekend);
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel14
  - number: 14.1.h
    text: de toelage Huis van Hare Majesteit de Koningin.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel14
  - number: '14.2'
    text: 'Het minimumbedrag van de vakantie-uitkering is voor de militair:'
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel14
  - number: 14.2.a
    text: 'met salarisnummer 0: f 195,57;'
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel14
  - number: 14.2.b
    text: 'met salarisnummer 1: f 223,51;'
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel14
  - number: 14.2.c
    text: 'met salarisnummer 2: f 251,45;'
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel14
  - number: 14.2.d
    text: 'met salarisnummer 3 of hoger: f 279,39.'
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel14
  - number: '14.3'
    text: |-
      Ten aanzien van de militair op wie [artikel 17, eerste lid][ref1], van toepassing is, wordt voor de toepassing
      van dit artikel uitgegaan van de inkomsten waarop die militair aanspraak zou hebben, indien de verhindering tot
      dienstverrichting niet was ingetreden.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel17
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '17'
        hoofdstuk: '4'
  - number: '14.4'
    text: |-
      Indien de militair - anders dan op grond van [artikel 17][ref1] - aanspraak heeft op een gedeelte van de voor hem
      geldende inkomsten, wordt het in het tweede lid, onder *a*, bedoelde bedrag naar evenredigheid verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel17
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '17'
        hoofdstuk: '4'
  - number: '15.1'
    text: |-
      De militair respectievelijk de gewezen militair met de rang van vice-admiraal, luitenant-generaal, luitenant-
      admiraal of generaal heeft aanspraak op een eindejaarsuitkering ten bedrage van 0,3% van de door hem genoten
      bezoldiging respectievelijk de door hem genoten uitkering op grond van de [Uitkeringswet gewezen militairen][ref1]
      of het door hem genoten wachtgeld als bedoeld in [artikel 22 van het Werkloosheidsbesluit defensiepersoneel][ref2]
      na toepassing van de bij of krachtens die wet respectievelijk die regeling geldende vermindering wegens inkomsten
      uit of in verband met arbeid of bedrijf. Bij ministeriële regeling kan de eindejaarsuitkering worden verhoogd met
      een nominaal bedrag, overeenkomstig de desbetreffende vaststelling bij overige overheidssectoren.


      [ref1]: https://wetten.overheid.nl/BWBR0002540
      [ref2]: https://wetten.overheid.nl/BWBR0008113#Artikel22
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002540
      - id: ref2
        bwb_id: BWBR0008113
        artikel: '22'
  - number: '15.2'
    text: |-
      De militair respectievelijk de gewezen militair met een lagere rang dan die van vice-admiraal of luitenant-generaal
      heeft aanspraak op een eindejaarsuitkering ten bedrage van 0,6% van de door hem genoten bezoldiging respectievelijk
      de door hem genoten uitkering op grond van de [Uitkeringswet gewezen militairen][ref1] of het door hem genoten
      wachtgeld als bedoeld in [artikel 22 van het Werkloosheidsbesluit defensiepersoneel][ref2] na toepassing van de
      bij of krachtens die wet respectievelijk die regeling geldende vermindering wegens inkomsten uit of in verband met
      arbeid of bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0002540
      [ref2]: https://wetten.overheid.nl/BWBR0008113#Artikel22
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002540
      - id: ref2
        bwb_id: BWBR0008113
        artikel: '22'
  - number: 15a
    text: |-
      In afwijking van [artikel 15, eerste lid][ref1], bedraagt het percentage van de eindejaarsuitkering in 2000 voor de
      militair met de rang van vice-admiraal, luitenant-generaal, luitenant-admiraal of generaal 1%.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel15
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '15'
        hoofdstuk: '3'
  - number: '16.1'
    text: 'Bij ministeriële regeling kan de militair aanspraak worden verleend op:'
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel16
  - number: 16.1.a
    text: |-
      een toelage in verband met het vervullen van een door Onze Minister aangewezen functie of het bezit van een door
      Onze Minister aangewezen bekwaamheid;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel16
  - number: 16.1.b
    text: |-
      een toelage voor het verrichten van werkzaamheden waaraan naar het oordeel van Onze Minister bijzondere risico’s of
      inconveniënten zijn verbonden;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel16
  - number: 16.1.c
    text: |-
      een toelage of - in de plaats daarvan - voorzieningen in natura ter zake van het verblijf van de militair buiten
      Nederland;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel16
  - number: 16.1.d
    text: een vergoeding van of een tegemoetkoming in de kosten van representatie;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel16
  - number: 16.1.e
    text: |-
      een diensttijdgratificatie bij een - naar het oordeel van Onze Minister - eervolle diensttijd van twaalfeneenhalf,
      vijfentwintig of vijfendertig jaren;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel16
  - number: 16.1.f
    text: |-
      een toelage dan wel een toeslag, uitsluitend indien de militair is aangesteld bij het reserve-personeel, in verband
      met het handhaven van zijn beschikbaarheid en inzetbaarheid.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel16
  - number: '16.2'
    text: |-
      Tenzij de bevelhebber om redenen van billijkheid anders bepaalt, is de militair die is aangesteld bij het reserve-
      personeel en de verplichting op zich heeft genomen om zich gedurende een bepaalde tijd beschikbaar te houden voor
      inzet in het kader van een door Onze Minister als zodanig aangemerkte vredes- of humanitaire operatie of andere
      vorm van daadwerkelijke inzet buiten Nederland, verplicht tot terugbetaling van de hem daartoe verstrekte toelage,
      indien hij deze verplichting niet nakomt.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel16
  - number: '16.3'
    text: |-
      Bij ministeriële regeling wordt de verlening van een uitkering in geval van overlijden of vermissing van de
      militair aan of ten behoeve van diens nabestaanden geregeld.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel16
  - number: '17.1'
    text: |-
      De militair die wegens ziekte verhinderd is dienst te verrichten, heeft, zodra die verhindering achttien maanden
      heeft geduurd, aanspraak op 80 procent van de inkomsten waarop hij aanspraak zou hebben, indien die verhindering
      tot dienstverrichting niet was ingetreden.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel17
  - number: '17.2'
    text: |-
      Indien de militair tijdens de in het eerste lid genoemde termijn gedurende zekere tijd voor ten minste 45 procent
      van de voor hem normaal geldende arbeidsduur dienst verricht, wordt die termijn voor toepassing van het eerste lid
      met die tijd verlengd.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel17
  - number: '17.3'
    text: |-
      Voor het bepalen van de in het eerste lid genoemde termijn - in voorkomend geval verlengd ingevolge het tweede lid
        - wordt een opnieuw ingetreden verhindering tot dienstverrichting als voortzetting van de voorgaande verhindering
      beschouwd, indien niet meer dan vier weken zijn verstreken sinds de dag waarop de militair de dienst volledig heeft
      hervat.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel17
  - number: '17.4'
    text: |-
      In afwijking van het eerste lid heeft de militair ook na afloop van de in dat lid genoemde termijn - in voorkomend
      geval verlengd ingevolge het tweede lid - aanspraak op de inkomsten waarop hij aanspraak zou hebben, indien die
      verhindering tot dienstverrichting niet was ingetreden:
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel17
  - number: 17.4.a
    text: zolang hij voor ten minste 45 procent van de voor hem normaal geldende arbeidsduur dienst verricht;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel17
  - number: 17.4.b
    text: |-
      als de ziekte waardoor hij verhinderd is dienst te verrichten naar het oordeel van de bevelhebber in overwegende
      mate haar oorzaak vindt in de aard van de hem opgedragen werkzaamheden of diensten of in de bijzondere
      omstandigheden waaronder deze moeten worden verricht, en - rekening houdend met die werkzaamheden of diensten en
      omstandigheden - niet aan zijn schuld of onvoorzichtigheid is te wijten.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel17
  - number: 17a.1
    text: |-
      Indien de militair, bedoeld in [artikel 17][ref1], recht heeft op een uitkering op grond van een
      werknemersverzekering die berust op de dienstbetrekking waaraan de inkomsten zijn verbonden, wordt die uitkering op
      het bedrag daarvan in mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel17
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '17'
        hoofdstuk: '4'
  - number: 17a.2
    text: |-
      Indien als gevolg van handelingen of het nalaten van handelingen door die militair geen uitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1] wordt toegekend, wordt voor de toepassing van het eerste lid
      uitgegaan van een uitkering op grond van die wet, zoals die zou zijn toegekend bij een arbeidsongeschiktheid van
      80% of meer.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 17a.3
    text: |-
      Indien als gevolg van handelingen of het nalaten van handelingen door die militair het bedrag van de uitkering op
      grond van de in het eerste lid bedoelde werknemersverzekering of een bovenwettelijke WW-uitkering een vermindering
      ondergaat, dan wel de aanspraak daarop geheel of gedeeltelijk niet wordt toegekend, wordt deze uitkering voor de
      toepassing van het eerste lid steeds aangemerkt als een uitkering die onverminderd is genoten.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel17a
  - number: 17a.4
    text: |-
      Indien die militair over een periode ter zake van de dienstbetrekking waaraan de inkomsten zijn
      verbonden aanspraak heeft of had kunnen hebben op een uitkering op grond van de [Ziektewet][ref1] of de
      [Wet op de arbeidsongeschiktheidsverzekering][ref2] is het verplichtingen- en sanctieregime van die wet over die
      periode van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0002524
  - number: 17a.5
    text: |-
      Indien ten aanzien van die wettelijke uitkering een verplichting wordt opgelegd of een sanctie wordt toegepast,
      wordt door de bevelhebber zoveel mogelijk dezelfde verplichting opgelegd dan wel een overeenkomstige sanctie
      toegepast op het bedrag aan inkomsten waarop de militair ingevolge het eerste lid aanspraak heeft.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel17a
  - number: 17a.6
    text: |-
      De aanspraak op doorbetaling van inkomsten ingevolge [artikel 17][ref1] vervalt, indien de militair zonder
      deugdelijke grond weigert de hem door de bevelhebber aangeboden gangbare arbeid, waartoe de militair geneeskundige
      dienst hem in staat acht, te aanvaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel17
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '17'
        hoofdstuk: '4'
  - number: 17a.7
    text: |-
      In bijzondere gevallen kan de bevelhebber bepalen dat de ingevolge [dit artikel][ref1] niet genoten
      inkomsten geheel of gedeeltelijk aan anderen dan aan de militair worden betaald. Na verrekening met
      deze aan anderen dan aan de militair betaalde inkomsten, worden de eventueel resterende, niet betaalde
      inkomsten alsnog aan de militair betaald, indien een door hem aangevraagd hernieuwd onderzoek als bedoeld in
      [artikel 102 van het Algemeen militair ambtenarenreglement][ref2] in zijn voordeel is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel17a
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel102
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: 17a
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '102'
  - number: '18'
    text: |-
      Voor elke volledige dag dat de militair zich aan zijn dienstverplichtingen onttrekt, heeft hij geen aanspraak op
      inkomsten.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel18
  - number: '19.1'
    text: |-
      De bevelhebber kan bepalen dat de militair die ingevolge
      [artikel 35, eerste lid, van het Algemeen militair ambtenarenreglement][ref1] is geschorst:


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel35
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '35'
  - number: 19.1.a
    text: |-
      gedurende de eerste zes weken van die schorsing aanspraak heeft op tweederde gedeelte van de inkomsten waarop hij
      bij plaatsing in Nederland aanspraak zou hebben, indien hem geen schorsing was opgelegd;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel19
  - number: 19.1.b
    text: 'gedurende de verdere duur van die schorsing:'
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel19
  - number: 19.1.b.1°
    text: |-
      aanspraak heeft op minder dan tweederde gedeelte van de inkomsten waarop hij bij plaatsing in Nederland aanspraak
      zou hebben, indien hem geen schorsing was opgelegd, dan wel
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel19
  - number: 19.1.b.2°
    text: geen aanspraak heeft op inkomsten.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel19
  - number: '19.2'
    text: |-
      Bij de toepassing van het eerste lid kan tevens worden bepaald dat de buiten Nederland geplaatste militair wiens
      gezin met toestemming van de bevelhebber aldaar metterwoon is gevestigd, aanspraak heeft op:
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel19
  - number: 19.2.a
    text: |-
      indien hij kinderen verzorgt of onderhoudt: de toelage, bedoeld in [artikel 16, eerste lid, onder ][ref1], waarop
      de militair aanspraak zou hebben, indien hem geen schorsing was opgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel16
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '16'
        hoofdstuk: '3'
  - number: 19.2.b
    text: |-
      indien hij geen kinderen verzorgt of onderhoudt: tweederde gedeelte van [de onder ][ref1] bedoelde toelage, waarop
      de militair aanspraak zou hebben, indien hem geen schorsing was opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel19
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '19'
        hoofdstuk: '4'
  - number: '19.3'
    text: |-
      In geval een schorsing geacht moet worden niet te hebben plaatsgehad of geen ontslag uit de militaire dienst volgt,
      wordt na opheffing van de schorsing alsnog aan de militair het bedrag aan inkomsten uitbetaald, dat op grond van de
      vorige leden niet is genoten.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel19
  - number: '20.1'
    text: |-
      De bevelhebber kan bepalen dat de militair die een vrijheidsstraf ondergaat of zich in voorlopige hechtenis of
      gijzeling bevindt:
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel20
  - number: 20.1.a
    text: |-
      gedurende de eerste zes weken van die tijd aanspraak heeft op tweederde gedeelte van de inkomsten waarop hij
      bij plaatsing in Nederland aanspraak zou hebben, indien hij geen vrijheidsstraf zou ondergaan of zich niet in
      voorlopige hechtenis of gijzeling zou bevinden;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel20
  - number: 20.1.b
    text: 'gedurende de verdere duur van die tijd:'
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel20
  - number: 20.1.b.1°
    text: |-
      aanspraak heeft op minder dan tweederde gedeelte van de inkomsten waarop hij bij plaatsing in Nederland aanspraak
      zou hebben, indien hij geen vrijheidsstraf zou ondergaan of zich niet in voorlopige hechtenis of gijzeling zou
      bevinden, dan wel
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel20
  - number: 20.1.b.2°
    text: geen aanspraak heeft op inkomsten.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel20
  - number: '20.2'
    text: |-
      [Artikel 19, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel19
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '19'
        hoofdstuk: '4'
  - number: '20.3'
    text: |-
      De militair op wie het eerste lid is toegepast, heeft alsnog aanspraak op de volle inkomsten over de tijd
      doorgebracht in voorlopige hechtenis, indien ter zake van het feit in verband waarmee hij in voorlopige hechtenis
      werd gesteld:
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel20
  - number: 20.3.a
    text: niet een veroordeling tot een onvoorwaardelijke vrijheidsstraf volgt;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel20
  - number: 20.3.b
    text: |-
      een veroordeling volgt tot een vrijheidsstraf, bij de tenuitvoerlegging waarvan de in voorlopige hechtenis
      doorgebrachte tijd in mindering wordt gebracht: voor de tijd waarmee de duur van de voorlopige hechtenis die van de
      vrijheidsstraf overtreft.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel20
  - number: '21'
    text: |-
      De militair die zich in krijgsgevangenschap bevindt of door een vreemde mogendheid is geïnterneerd, behoudt
      aanspraak op inkomsten, tenzij Onze Minister anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel21
  - number: '22.1'
    text: |-
      Indien de militair wordt vermist en gegronde redenen bestaan om aan te nemen dat hij zich aan zijn
      dienstverplichtingen onttrekt, dan wel zich in krijgsgevangenschap bevindt of door een vreemde mogendheid is
      geïnterneerd, is [artikel 18][ref1], onderscheidenlijk 21 van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel18
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '18'
        hoofdstuk: '4'
  - number: '22.2'
    text: |-
      Indien de militair wordt vermist en het eerste lid niet van toepassing is, wordt de militair geacht te zijn
      overleden op de dag waarop hij wordt vermist.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel22
  - number: '22.3'
    text: |-
      Indien blijkt dat een op grond van het eerste of tweede lid gemaakte veronderstelling onjuist is geweest, stelt
      de bevelhebber de aanspraak op inkomsten met betrekking tot het tijdvak waarin de militair vermist is geweest vast
      in overeenstemming met de overige bepalingen van dit besluit. Daarbij geldt dat enerzijds kan worden bepaald dat
      eventueel te veel betaalde bedragen niet worden teruggevorderd, maar dat anderzijds rekening kan worden gehouden
      met:
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel22
  - number: 22.3.a
    text: een eventueel aan de gezinsleden van de militair toegekend tijdelijk pensioen;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel22
  - number: 22.3.b
    text: |-
      een eventueel aan nabestaanden van de militair toegekende uitkering op grond van [artikel 16, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel16
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '16'
        hoofdstuk: '3'
  - number: 22.3.c
    text: |-
      eventuele andere inkomsten of baten die door de militair of zijn gezinsleden tijdens de duur van de vermissing van
      de militair in verband daarmede zijn genoten.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel22
  - number: '23.1'
    text: |-
      Onverminderd het tweede lid kan de bevelhebber het bedrag aan inkomsten waarop de militair over enig tijdvak
      aanspraak heeft, verminderen met het gehele of gedeeltelijke bedrag van de geldelijke inkomsten waarop die militair
      over hetzelfde tijdvak aanspraak heeft uit of in verband met arbeid of bedrijf anders dan als militair. Dit
      geldt uitsluitend, indien laatstbedoelde geldelijke inkomsten zijn verkregen uit of in verband met werkzaamheden,
      verricht gedurende de voor de militair geldende werktijd, bedoeld in [artikel 54, onder ][ref1]. De vermindering
      bedraagt ten hoogste het bedrag van de inkomsten als militair.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel54
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '54'
  - number: '23.2'
    text: |-
      Indien de militair, bedoeld in [artikel 17, eerste lid][ref1], tijdens verhindering tot dienstverrichting in het
      belang van zijn genezing door de militair geneeskundige dienst wenselijk geachte arbeid voor zichzelf of voor
      derden verricht, worden - in afwijking van het eerste lid - de geldelijke inkomsten uit die arbeid slechts op zijn
      inkomsten als militair in mindering gebracht, voor zover de inkomsten uit die arbeid 20 procent van zijn inkomsten
      als militair te boven gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel17
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '17'
        hoofdstuk: '4'
  - number: '23.3'
    text: |-
      Indien de militair reeds vóór het tijdstip waarop hij de in het eerste lid bedoelde werkzaamheden heeft
      aangevangen, naast zijn inkomsten als militair tevens inkomsten uit of in verband met arbeid of bedrijf genoot,
      worden die inkomsten niet in aanmerking genomen bij de toepassing van het eerste lid. Dit is uitsluitend het geval,
      indien hij aannemelijk kan maken dat die inkomsten niet het gevolg zijn van verhoogde werkzaamheden of van andere
      oorzaken die verband houden met de werkzaamheden, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel23
  - number: '23.4'
    text: |-
      Indien de militair reeds vóór het tijdstip waarop hij de in het eerste lid bedoelde werkzaamheden heeft
      aangevangen, inkomsten uit of in verband met arbeid of bedrijf genoot en hij na dat tijdstip meer inkomsten gaat
      genieten, worden die meerdere inkomsten in aanmerking genomen bij de toepassing van het eerste lid, tenzij hij
      aannemelijk kan maken dat die meerdere inkomsten niet het gevolg zijn van verhoogde werkzaamheden of van andere
      oorzaken die verband houden met de werkzaamheden, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel23
  - number: '23.5'
    text: |-
      Het bedrag aan inkomsten waarop de militair over enig tijdvak aanspraak heeft, wordt verminderd met het bedrag van
      de geldelijke uitkeringen waarop hij met betrekking tot hetzelfde tijdvak krachtens een sociale verzekeringswet
      aanspraak heeft. Dit geldt uitsluitend, indien die geldelijke uitkeringen in de plaats zijn getreden van geldelijke
      inkomsten uit of in verband met arbeid of bedrijf, die met toepassing van het eerste lid in mindering zijn of
      zouden zijn gebracht tot ten hoogste het bedrag van de inkomsten als militair.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel23
  - number: '23.6'
    text: |-
      De bevelhebber kan het bedrag aan inkomsten waarop de militair over enig tijdvak aanspraak heeft, verminderen
      met het gehele of gedeeltelijke bedrag van de vaste vergoeding waarop de militair over hetzelfde tijdvak
      aanspraak heeft in verband met een functie in een publiekrechtelijk college waarvoor hem over dat tijdvak het in
      [artikel 12][ref1] bedoelde verlof is verleend. De vermindering bedraagt ten hoogste het bedrag van de inkomsten
      als militair.


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel12c
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: 12c
  - number: '23.7'
    text: |-
      De militair, bedoeld in het eerste tot en met het zesde lid, is gehouden de geldelijke inkomsten of uitkeringen
      uit of in verband met arbeid of bedrijf, dan wel de vaste vergoedingen in verband met een functie in een
      publiekrechtelijk college te melden aan de bevelhebber onder overlegging van een gespecificeerde opgave van die
      inkomsten, uitkeringen of vergoedingen.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel23
  - number: '24'
    text: |-
      In [bijlage C][ref1] van dit besluit is in tabel 3 een verlengde salarisschaal opgenomen voor de militair van de
      Koninklijke landmacht en de Koninklijke luchtmacht met de rang van tweede luitenant, eerste luitenant of kapitein.
      De bevelhebber kan bedoelde militair aanspraak verlenen op het bij zijn salarisnummer in de verlengde salarisschaal
      opgenomen salaris, indien de desbetreffende militair op 31 december 1989 behoorde tot:


      [ref1]: https://wetten.overheid.nl/BWBR0007816
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007816
  - number: 24.a
    text: het dienstvak van officieren van fortificatiën;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel24
  - number: 24.b
    text: het dienstvak van officieren-technisch-opzichter der genie;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel24
  - number: 24.c
    text: het dienstvak van officieren-technisch-opzichter van de verbindingsdienst;
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel24
  - number: 24.d
    text: het dienstvak van officieren-technisch-opzichter van de technische dienst of
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel24
  - number: 24.e
    text: |-
      de dienstgroep van de officieren voor speciale diensten van de Koninklijke luchtmacht, voor zover hij althans
      laatstelijk vóór zijn benoeming tot officier, technisch opzichter van de Koninklijke luchtmacht is geweest.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel24
  - number: 24a
    text: |-
      De militair die op 31 mei 2001 aanspraak had op een overbruggingstoelage op grond van
      [artikel 9, eerste lid, onder b][ref1], volgens de bepalingen van dit besluit zoals deze luidden op 31 mei 2001,
      behoudt zijn aanspraak op de overbruggingstoelage volgens de bepalingen van dit besluit zoals deze luidden op
      voornoemde datum.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel9
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '9'
        hoofdstuk: '2'
  - number: '25'
    text: |-
      Bij de vaststelling van de grondslag voor de vakantie-uitkering wordt in voorkomend geval het emolument
      huisvesting, bedoeld in artikel 2 , onder II, onderdeel b, van het Besluit uitvoering Algemene militaire
      pensioenwet, mede in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel25
  - number: 25a
    text: |-
      Van de bevoegdheid tot het vaststellen van ministeriële regelingen als bedoeld in
      [artikel 16, eerste lid, onderdelen c en d][ref1], kan mandaat worden verleend aan de directeur-generaal personeel
      van het Ministerie van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel16
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '16'
        hoofdstuk: '3'
  - number: '29'
    text: |-
      Dit besluit treedt in werking met ingang van 1 januari 1996. Indien het *Staatsblad* waarin dit besluit wordt
      geplaatst, wordt uitgegeven na 31 december 1995, treedt het in werking met ingang van de dag na de datum van
      uitgifte van het *Staatsblad* waarin het wordt geplaatst, en werkt het terug tot en met 1 januari 1996.
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel29
  - number: '30'
    text: 'Dit besluit wordt aangehaald als: Inkomstenbesluit militairen.'
    url: https://wetten.overheid.nl/BWBR0007816/2002-01-01#Artikel30
