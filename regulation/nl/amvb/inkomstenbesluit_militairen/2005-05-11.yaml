  - number: '7'
    text: |-
      1 De bevelhebber kent de militair bij aanstelling een salarisnummer binnen de bij zijn rang behorende salarisschaal
      toe op basis van kennis en ervaring van de militair.

      2 Aan de militair van 20, 21, 22 of 23 jaar en ouder wordt bij aanstelling respectievelijk ten minste salarisnummer
      1, 2, 3 of 4 toegekend.

      3 Het salarisnummer van de militair wordt jaarlijks met één verhoogd. Deze verhoging is ook van toepassing op de
      militair, die het maximum van de salarisschaal heeft bereikt.

      4 De in het derde lid bedoelde verhoging van het salarisnummer vindt plaats met ingang van de eerste dag van de
      maand waarin één jaar is verstreken sedert de dag waarop zijn salarisnummer voor de laatste maal is toegekend.

      5 De bevelhebber kan een hoger salarisnummer toekennen aan een militair, indien deze naar het oordeel van de
      bevelhebber daarvoor in aanmerking komt.

      6 De bevelhebber kan een verhoging van het salarisnummer achterwege laten, indien de militair niet naar behoren
      functioneert.
    url: https://wetten.overheid.nl/BWBR0007816/2005-05-11#Artikel7
  - number: '8'
    text: |-
      1 De militair behoudt zijn salarisnummer indien hij wordt bevorderd.

      2 Indien het salarisnummer van een militair, na bevordering, lager is dan het laagste salarisnummer waarvoor bij
      zijn nieuwe salarisschaal een bedrag is opgenomen, wordt de militair door de bevelhebber een hoger salarisnummer
      toegekend, zodanig dat de militair aanspraak verkrijgt op het laagste bedrag behorende bij zijn nieuwe
      salarisschaal.

      3 Indien de in het tweede lid bedoelde militair tijdelijk is bevorderd en de rang herkrijgt die hij had voordat hij
      tijdelijk werd bevorderd, vervalt de in het vorige lid bedoelde verhoging van het salarisnummer.

      4 Het salarisnummer van de korporaal van de Koninklijke Landmacht of van de Koninklijke Luchtmacht, die na 1
      oktober 2001 wordt bevorderd tot korporaal der eerste klasse, wordt met één verhoogd. Deze verhoging is niet van
      invloed op de datum van de jaarlijkse verhoging van het salarisnummer, bedoeld in [artikel 7, vierde lid][ref1], of
      [artikel 8a, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007816#Artikel8a
