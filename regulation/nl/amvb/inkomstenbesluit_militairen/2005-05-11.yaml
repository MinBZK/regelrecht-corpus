  - number: 12a
    text: |-
      1 Onze Minister kan een functioneringstoelage toekennen aan de militair met een rang van luitenant-generaal, vice-
      admiraal of hoger, of aan de commandant van het wapen der Koninklijke marechaussee.

      2 De bevelhebber kan aan een militair, niet bedoeld in het eerste lid, die voor onbepaalde tijd is aangesteld bij
      het beroepspersoneel en het voor hem geldende maximumsalaris heeft bereikt, een functioneringstoelage toekennen,
      indien de wijze van functioneren van die militair daartoe naar het oordeel van de bevelhebber aanleiding geeft.

      3 De functioneringstoelage wordt toegekend voor een periode van tenminste één jaar.

      4 De functioneringstoelage bedraagt ten hoogste 10 procent van het voor de militair geldende salaris.

      5 Indien de militair, die een functioneringstoelage geniet, wordt bevorderd, niet zijnde een tijdelijke
      bevordering, komt de functioneringstoelage met ingang van de datum van de bevordering te vervallen.

      6 Indien de militair, die een functioneringstoelage geniet, tijdelijk wordt bevorderd, wordt het bedrag van de
      functioneringstoelage gedurende de tijd dat hij de tijdelijke rang bekleedt, op nul gesteld.

      7 Voor de toepassing van dit artikel wordt het maximumsalaris bereikt voor:

      a. de matroos der 1e klasse van de Koninklijke Marine: bij het salarisnummer 11 of hoger;

      b. de korporaal, de korporaal der 1e klasse van de Koninklijke Landmacht en de Koninklijke Luchtmacht en de
      marechaussee der 1e klasse van de Koninklijke Marechaussee: bij het salarisnummer 15 of hoger.
    url: https://wetten.overheid.nl/BWBR0007816/2005-05-11#Artikel12a
  - number: '13'
    text: |-
      1 Aan een militair die zich tijdens het verblijf in werkelijke dienst bijzonder heeft onderscheiden door optreden
      of gedragingen dan wel door buitengewone toewijding of bijzondere loffelijke dienstverrichtingen, kunnen, naar bij
      ministeriële regeling te stellen regels één of meer van de onderstaande beloningen worden toegekend:

      a. geschenk;

      b. geldelijke beloning;

      c. functioneringsgratificatie.

      2 Onze minister kan de beloningen, genoemd in het eerste lid, toekennen aan een militair met de rang van luitenant-
      generaal, vice-admiraal, generaal of luitenant-admiraal, of aan de commandant van het wapen der Koninklijke
      marechaussee.

      3 De commandant kan de beloningen, genoemd in het eerste lid, toekennen aan een militair niet bedoeld in het tweede
      lid.

      4 Het maximumbedrag van de beloningen, genoemd in het eerste lid, wordt bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007816/2005-05-11#Artikel13
  - number: '14'
    text: |-
      1 De militair met aanspraak op salaris heeft aanspraak op een vakantie-uitkering ten bedrage van 8 procent van de
      door hem genoten bezoldiging, in voorkomend geval vermeerderd met:

      a. de waarnemingstoelage;

      b. de toelage officieren-arts, -tandarts, of -apotheker, zodra deze laatstelijk gedurende vijf jaren onafgebroken
      is genoten;

      c. de brevettoelage voor het vervullen van een eerste partij bij de marinierskapel der Koninklijke marine;

      d. de brevettoelage voor het vervullen van een solistenpartij bij de marinierskapel der Koninklijke marine;

      e. de vliegtoelage of de garantievliegtoelage;

      f. de toelage woninghuur Koninklijke marechaussee;

      g. het emolument van kleermakers, schoenmakers en barbiers der zeemacht, bedoeld in
      [artikel 23a, eerste lid, onderdeel l][ref1].

      h. de toelage Huis van Hare Majesteit de Koningin.

      2 Het minimumbedrag per maand van de vakantie-uitkering is voor de militair:

      a. met salarisnummer 0: € 95,98;

      b. met salarisnummer 1: € 109,70;

      c. met salarisnummer 2: € 123,41;

      d. met salarisnummer 3 of hoger: € 137,12.

      3 Ten aanzien van de militair op wie [artikel 17, eerste lid][ref2], van toepassing is, wordt voor de toepassing
      van dit artikel uitgegaan van de inkomsten waarop die militair aanspraak zou hebben, indien de verhindering tot
      dienstverrichting niet was ingetreden.

      4 Indien de militair - anders dan op grond van [artikel 17][ref3] - aanspraak heeft op een gedeelte van de voor hem
      geldende inkomsten, wordt het in het tweede lid bedoelde bedrag naar evenredigheid verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel23a
