        artikel: '25'
  - number: 11a
    text: |-
      1 De militair, die voor onbepaalde tijd is aangesteld heeft tot en met 31 december 2009 bij een bevordering,
      als bedoeld in [artikel 27, vierde lid, van het Algemeen militair ambtenarenreglement][ref1], aanspraak op een
      eenmalige toeslag.

      2 Het bedrag van de toeslag is gelijk aan vier maal het verschil tussen het salaris waarop hij aanspraak maakt na
      de bevordering en het salaris waarop hij aanspraak maakte voor de bevordering.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel27
    url: https://wetten.overheid.nl/BWBR0007816/2005-05-11#Artikel11a
