  - number: 17d
    text: |-
      1 De commandant wijst de militair, aan wie buitengewoon verlof in het kader van arbeid en zorg met geheel
      of gedeeltelijk behoud van inkomsten op basis van paragraaf 4b van hoofdstuk 8 van het Algemeen militair
      ambtenarenreglement is verleend, in voorkomend geval op de mogelijkheden tot het aanvragen van een financiële
      tegemoetkoming op basis van [hoofdstuk 7 van de Wet arbeid en zorg][ref1].

      2 Indien de militair gedurende het verlof, bedoeld in eerste lid, of gedurende een bepaalde periode van dat verlof
      tevens recht heeft op een financiële tegemoetkoming op basis van [hoofdstuk 7 van de Wet arbeid en zorg][ref2],
      wordt door de bevelhebber gedurende de periode waarin sprake is van een samenloop een inhouding op de doorbetaling
      van die inkomsten toegepast.

      De inhouding bedraagt maximaal het bedrag van de in het eerste lid bedoelde tegemoetkoming en voor zover in totaal
      door de samenloop 100% van de inkomsten wordt overschreden.

      3 Indien aan de in [hoofdstuk 7 van de Wet arbeid en zorg][ref3] gestelde voorwaarden voor het toekennen van een
      financiële tegemoetkoming is voldaan maar door toedoen van de militair geen financiële tegemoetkoming is toegekend,
      kan het tweede lid op overeenkomstige wijze worden toegepast. In dat geval wordt rekening gehouden met de
      financiële tegemoetkoming die aan de militair zou zijn toegekend indien hij wel een aanvraag zou hebben ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk7
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk7
