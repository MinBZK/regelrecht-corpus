    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Defensie;

      b. «Bevelhebber» de bevelhebber van het desbetreffende krijgsmachtdeel of de commandant van het wapen der
      Koninklijke marechaussee;

      c. commandant: een bij ministeriële regeling aan te wijzen functionaris;

      d. militair: de militaire ambtenaar in de zin van
      [artikel 1, eerste en tweede lid, van de Militaire ambtenarenwet 1931][ref1];

      e. werkelijke dienst: de tijd gedurende welke de militair:

      1°. is aangesteld bij het beroepspersoneel en hij niet op nonactiviteit is gesteld en hem geen buitengewoon verlof
      van lange duur zonder behoud van inkomsten is verleend;

      2°. behoort tot het reserve-personeel en als zodanig feitelijk onder de wapenen is;

      f. rang: een militaire rang en stand of klasse, voor zover niet titulair toegekend;

      g. officier: de militair met de rang van luitenant ter zee der derde klasse, tweede luitenant of met een hogere
      rang;

      h. gezin en gezinsleden: de echtgenote van de militair en de kinderen, stief- en pleegkinderen van de militair of
      van zijn echtgenote;

      i. salaris: het bedrag dat met inachtneming van de bepalingen van dit besluit voor de militair is vastgesteld op
      grond van [artikel 5][ref2];

      j. salarisschaal: een reeks van salarissen, behorende bij een bepaalde rang;

      k. bezoldiging: het salaris, in voorkomend geval vermeerderd met de overbruggingstoelage, bedoeld in
      [artikel 9][ref3], en de garantietoelage minimumloon, bedoeld in [artikel 10][ref4];

      l. inkomsten: alle bedragen waarop de militair aanspraak kan maken bij of krachtens dit besluit;

      m. *salarisnummer:*

      het getal dat in een salarisschaal voor een salaris is vermeld;

      n. maand: een kalendermaand;

      o. werknemersverzekering: [Werkloosheidswet][ref5], [Wet op de Arbeidsongeschiktheidsverzekering][ref6], dan wel
      de [Ziektewet][ref7];

      p. Arbo-dienst: een voor de militair aangewezen deskundige dienst als bedoeld in
      [artikel 14, derde lid, laatste volzin, van de Arbeidsomstandighedenwet 1998][ref8].

      2 In dit besluit en de daarop berustende bepalingen wordt mede verstaan onder militair: degene die is aangesteld in
      burgerlijke openbare dienst om bij de krijgsmacht als geestelijk verzorger werkzaam te zijn.

      3 Met inachtneming van [artikel 1, derde en vierde lid, van het Algemeen militair ambtenarenreglement][ref9] wordt
      in dit besluit en de daarop berustende bepalingen mede verstaan onder echtgenote of echtgenoot:

      1°. de geregistreerde partner;

      2°. degene die door de militair als partner is aangemeld bij de Stichting Pensioenfonds ABP en door het bestuur van
      dat fonds als zodanig is aangemerkt, op voorwaarde dat de militair een bewijs van die aanmelding heeft overgelegd
      aan de commandant;


