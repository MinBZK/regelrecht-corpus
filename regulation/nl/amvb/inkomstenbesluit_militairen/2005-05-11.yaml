  - number: 17b
    text: |-
      1 Indien aan de vrouwelijke militair zwangerschaps- en bevallingsverlof is verleend, behoudt zij haar aanspraak
      op inkomsten.

      2 De commandant draagt ervoor zorg dat de vrouwelijke militair door tussenkomst van de commandant een
      uitkering op basis van [hoofdstuk 3 van de Wet arbeid en zorg][ref1] aanvraagt bij het Uitvoeringsinstituut
      werknemersverzekeringen genoemd in [hoofdstuk 5 van de Wet-SUWI][ref2]. Deze uitkering moet uiterlijk twee
      weken voor de datum van ingang van het zwangerschaps- en bevallingsverlof onderscheidenlijk de datum waarop de
      vrouwelijke militair het recht op de uitkering wil laten ingaan, worden aangevraagd.

      3 Indien de vrouwelijke militair aan wie zwangerschaps- en bevallingsverlof is verleend gedurende dat
      verlof of gedurende een bepaalde periode van dat verlof tevens recht heeft op een uitkering op basis van de
      [Wet arbeid en zorg][ref3], wordt door de bevelhebber gedurende de periode waarin sprake is van samenloop een
      inhouding op de doorbetaling als bedoeld in het vierde lid toegepast die overeenkomt met het bedrag van bedoelde
      uitkering.

      4 Indien aan de voorwaarden voor het toekennen van een uitkering als bedoeld in het tweede lid is voldaan maar
      geen uitkering is toegekend omdat de vrouwelijke militair geen aanvraag heeft ingediend, wordt het derde lid op
      overeenkomstige wijze toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk3
