  - number: 23a
    text: |-
      1 Als inkomstenbestanddelen ingevolge dit besluit gelden, bij de berekening van de grondslag voor militair
      ouderdoms- en nabestaandenpensioen en pensioen ter zake van ziekten of gebreken naar de bij of krachtens de
      [Kaderwet militaire pensioenen][ref1] vast te stellen regels, uitsluitend:

      a. de bezoldiging;

      b. de vakantie-uitkering, met uitzondering van dat deel, dat als een tijdelijk bestanddeel van de inkomsten wordt
      aangemerkt;

      c. de eindejaarsuitkering;

      d. de vliegtoelage;

      e. de garantievliegtoelage;

      f. de toelage Huis van H.M. de Koningin;

      g. de functioneringstoelage, indien deze voor ten minste vijf jaren onafgebroken is toegekend;

      h. de toelage officieren-arts, officieren-tandarts en officieren-apotheker, zodra deze toelage laatstelijk
      gedurende vijf jaren onafgebroken is genoten;

      i. de toelage officieren-medisch specialist, zodra deze toelage laatstelijk gedurende vijf jaren onafgebroken is
      genoten;

      j. de brevettoelage marinierskapel;

      k. een op grond van [artikel 115 van het Algemeen militair ambtenarenreglement (AMAR)][ref2] toegekende
      schadeloosstelling, vergoeding of tegemoetkoming, voor zover deze, naar het oordeel van Onze Minister, een vast
      onderdeel van zijn inkomen vormt;

      l. de door Onze Minister te schatten geldswaarden per jaar van het emolument van kleermakers, schoenmakers
      en barbiers der zeemacht wegens werkzaamheden ten dienste van de militairen, welke schatting niet individueel
      geschiedt doch voor alle kleermakers, schoenmakers en barbiers naar een voor elk van deze categorieën te bepalen
      bedrag, berekend naar de gemiddelde inkomsten, welke door elke categorie jaarlijks uit het bedrijf wordt genoten;

      m. het emolument huisvesting Koninklijke marechaussee;

      n. de vaste vergoeding voor extra beslaglegging van de militair die voor onbepaalde tijd is aangesteld,
      voor zover hij deze na 31 december 2001 heeft genoten, met uitzondering van de militair bedoeld in
      [artikel 39a, onderdelen a onder 1, b onder 1, c en e onder 1 van het AMAR][ref3].

      2 Het eerste lid is van overeenkomstige toepassing voor de gewezen militair die een uitkering ingevolge de
      [Uitkeringswet gewezen militairen][ref4] geniet en voor wie de ontslagleeftijd met ingang van 1 januari 2006 bij of
      krachtens [artikel 12 van de Militaire Ambtenarenwet 1931][ref5] is gewijzigd.

      3 Het eerste lid is van overeenkomstige toepassing voor de gewezen militair die een ontslaguitkering, waaronder
      tevens te begrijpen een uitkering ingevolge de [Uitkeringswet gewezen militairen][ref6], geniet in de zin van de
      bij of krachtens de [Kaderwet militaire pensioenen](onbekend) vastgestelde regels, met dien verstande dat onderdeel
      n van het eerste lid niet als inkomensbestanddeel bij de berekening van de pensioengrondslag wordt meegenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011955
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel115
      [ref3]: https://wetten.overheid.nl/BWBR0003482#Artikel39a
      [ref4]: https://wetten.overheid.nl/BWBR0002540
