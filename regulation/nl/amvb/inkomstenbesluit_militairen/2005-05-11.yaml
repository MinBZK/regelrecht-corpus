        artikel: '18'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0007816
        artikel: '16'
        hoofdstuk: '3'
  - number: '23'
    text: |-
      1 Onverminderd het tweede lid kan de bevelhebber het bedrag aan inkomsten waarop de militair over enig
      tijdvak aanspraak heeft, verminderen met het gehele of gedeeltelijke bedrag van de geldelijke inkomsten
      waarop die militair over hetzelfde tijdvak aanspraak heeft uit of in verband met arbeid of bedrijf anders
      dan als militair. Dit geldt uitsluitend, indien laatstbedoelde geldelijke inkomsten zijn verkregen uit
      of in verband met werkzaamheden, verricht gedurende de voor de militair geldende werktijd, bedoeld in
      [artikel 54a, onder d, van het Algemeen militair ambtenarenreglement][ref1]. De vermindering bedraagt ten hoogste
      het bedrag van de inkomsten als militair.

      2 Indien de militair, bedoeld in [artikel 17, eerste lid][ref2], tijdens verhindering tot dienstverrichting in
      het belang van zijn genezing door de militair geneeskundige dienst wenselijk geachte arbeid voor zichzelf of voor
      derden verricht, worden - in afwijking van het eerste lid - de geldelijke inkomsten uit die arbeid slechts op zijn
      inkomsten als militair in mindering gebracht, voor zover de inkomsten uit die arbeid 20 procent van zijn inkomsten
      als militair te boven gaan.

      3 Indien de militair reeds vóór het tijdstip waarop hij de in het eerste lid bedoelde werkzaamheden heeft
      aangevangen, naast zijn inkomsten als militair tevens inkomsten uit of in verband met arbeid of bedrijf genoot,
      worden die inkomsten niet in aanmerking genomen bij de toepassing van het eerste lid. Dit is uitsluitend het geval,
      indien hij aannemelijk kan maken dat die inkomsten niet het gevolg zijn van verhoogde werkzaamheden of van andere
      oorzaken die verband houden met de werkzaamheden, bedoeld in het eerste lid.

      4 Indien de militair reeds vóór het tijdstip waarop hij de in het eerste lid bedoelde werkzaamheden heeft
      aangevangen, inkomsten uit of in verband met arbeid of bedrijf genoot en hij na dat tijdstip meer inkomsten gaat
      genieten, worden die meerdere inkomsten in aanmerking genomen bij de toepassing van het eerste lid, tenzij hij
      aannemelijk kan maken dat die meerdere inkomsten niet het gevolg zijn van verhoogde werkzaamheden of van andere
      oorzaken die verband houden met de werkzaamheden, bedoeld in het eerste lid.

      5 Het bedrag aan inkomsten waarop de militair over enig tijdvak aanspraak heeft, wordt verminderd met het bedrag
      van de geldelijke uitkeringen waarop hij met betrekking tot hetzelfde tijdvak krachtens een sociale verzekeringswet
      aanspraak heeft. Dit geldt uitsluitend, indien die geldelijke uitkeringen in de plaats zijn getreden van geldelijke
      inkomsten uit of in verband met arbeid of bedrijf, die met toepassing van het eerste lid in mindering zijn of
      zouden zijn gebracht tot ten hoogste het bedrag van de inkomsten als militair.

      6 De bevelhebber kan het bedrag aan inkomsten waarop de militair over enig tijdvak aanspraak heeft, verminderen
      met het gehele of gedeeltelijke bedrag van de vaste vergoeding waarop de militair over hetzelfde tijdvak
      aanspraak heeft in verband met een functie in een publiekrechtelijk college waarvoor hem over dat tijdvak het in
      [artikel 12][ref3] bedoelde verlof is verleend. De vermindering bedraagt ten hoogste het bedrag van de inkomsten
      als militair.

      7 De militair, bedoeld in het eerste tot en met het zesde lid, is gehouden de geldelijke inkomsten of uitkeringen
      uit of in verband met arbeid of bedrijf, dan wel de vaste vergoedingen in verband met een functie in een
      publiekrechtelijk college te melden aan de bevelhebber onder overlegging van een gespecificeerde opgave van die
      inkomsten, uitkeringen of vergoedingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel54a
      [ref2]: https://wetten.overheid.nl/BWBR0007816#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0001952#Artikel12c
