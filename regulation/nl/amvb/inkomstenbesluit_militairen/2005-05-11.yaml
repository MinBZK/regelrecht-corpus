  - number: 23c
    text: |-
      1 Op de inkomsten van de militair bedoeld in
      [artikel 39a, onder a ten 1°, b ten 1°, c en e ten 1° van het AMAR][ref1] wordt een pseudo-
      pensioenpremievergoeding voor extra beslaglegging ingehouden, overeenkomstig de pensioenbijdrage die verhaald zou
      zijn indien op basis van [artikel 23a, onderdeel n][ref2], de vaste vergoeding voor extra beslaglegging voor zover
      hij deze na 31 december 2001 heeft genoten, tot zijn pensioengrondslag zou behoren.

      2 De pseudo-pensioenpremievergoeding voor extra beslaglegging wordt op de datum dat hij met leeftijdsontslag gaat
      gerestitueerd aan de militair, uitgezonderd de militair bedoeld in het derde en vierde lid.

      3 Voor de militair, bedoeld in het eerste lid, die na 31 december 2002 de leeftijd bereikt waarop hij twee
      jaren ouder is dan de voor hem geldende ontslagleeftijd als bedoeld in [artikel 39a AMAR][ref3] wordt de
      pseudo-pensioenpremievergoeding voor extra beslaglegging op de datum van eerstbedoelde leeftijd omgezet in een
      pensioenbijdrage en wordt de vaste vergoeding voor extra beslaglegging tot de berekeningsgrondslag voor het
      pensioen gerekend.

      4 Voor de militair, bedoeld in het eerste lid, die na 31 december 2002 met leeftijdsontslag gaat en op
      de ontslagdatum twee jaar ouder is dan de op die datum voor hem geldende ontslagleeftijd als bedoeld in
      [artikel 39a AMAR][ref4], wordt de pseudo-pensioenpremie vergoeding voor extra beslaglegging op de datum
      van ontslag omgezet in een pensioenbijdrage en wordt de vaste vergoeding voor extra beslaglegging tot de
      berekeningsgrondslag voor het pensioen gerekend.

      5 Het tweede, derde en vierde lid zijn van overeenkomstige toepassing indien deze militair komt te overlijden
      voordat hij is ontslagen, te rekenen naar de overlijdensdatum.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel39a
      [ref2]: https://wetten.overheid.nl/BWBR0007816#Artikel23a
