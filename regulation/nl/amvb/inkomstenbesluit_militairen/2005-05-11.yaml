  - number: '21'
    text: |-
      De militair die zich in krijgsgevangenschap bevindt of door een vreemde mogendheid is geïnterneerd, behoudt
      aanspraak op inkomsten, tenzij Onze Minister anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0007816/2005-05-11#Artikel21
  - number: '22'
    text: |-
      1 Indien de militair wordt vermist en gegronde redenen bestaan om aan te nemen dat hij zich aan zijn
      dienstverplichtingen onttrekt, dan wel zich in krijgsgevangenschap bevindt of door een vreemde mogendheid is
      geïnterneerd, is [artikel 18][ref1], onderscheidenlijk 21 van overeenkomstige toepassing.

      2 Indien de militair wordt vermist en het eerste lid niet van toepassing is, wordt de militair geacht te zijn
      overleden op de dag waarop hij wordt vermist.

      3 Indien blijkt dat een op grond van het eerste of tweede lid gemaakte veronderstelling onjuist is geweest, stelt
      de bevelhebber de aanspraak op inkomsten met betrekking tot het tijdvak waarin de militair vermist is geweest vast
      in overeenstemming met de overige bepalingen van dit besluit. Daarbij geldt dat enerzijds kan worden bepaald dat
      eventueel te veel betaalde bedragen niet worden teruggevorderd, maar dat anderzijds rekening kan worden gehouden
      met:

      a. een eventueel aan de gezinsleden van de militair toegekend tijdelijk pensioen;

      b. een eventueel aan nabestaanden van de militair toegekende uitkering op grond van [artikel 16, derde lid][ref2];

      c. eventuele andere inkomsten of baten die door de militair of zijn gezinsleden tijdens de duur van de vermissing
      van de militair in verband daarmede zijn genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0007816#Artikel16
    url: https://wetten.overheid.nl/BWBR0007816/2005-05-11#Artikel22
    references:
      - id: ref1
