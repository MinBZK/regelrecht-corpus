  - number: '24'
    text: |-
      In [bijlage C][ref1] van dit besluit is in tabel 3 een verlengde salarisschaal opgenomen voor de militair van de
      Koninklijke landmacht en de Koninklijke luchtmacht met de rang van tweede luitenant, eerste luitenant of kapitein.
      De bevelhebber kan bedoelde militair aanspraak verlenen op het bij zijn salarisnummer in de verlengde salarisschaal
      opgenomen salaris, indien de desbetreffende militair op 31 december 1989 behoorde tot:

      a. het dienstvak van officieren van fortificatiën;

      b. het dienstvak van officieren-technisch-opzichter der genie;

      c. het dienstvak van officieren-technisch-opzichter van de verbindingsdienst;

      d. het dienstvak van officieren-technisch-opzichter van de technische dienst of

      e. de dienstgroep van de officieren voor speciale diensten van de Koninklijke luchtmacht, voor zover hij althans
      laatstelijk vóór zijn benoeming tot officier, technisch opzichter van de Koninklijke luchtmacht is geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0007816
    url: https://wetten.overheid.nl/BWBR0007816/2005-05-11#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007816
  - number: 24a
    text: |-
      De militair die op 31 mei 2001 aanspraak had op een overbruggingstoelage op grond van
      [artikel 9, eerste lid, onder b][ref1], volgens de bepalingen van dit besluit zoals deze luidden op 31 mei 2001,
      behoudt zijn aanspraak op de overbruggingstoelage volgens de bepalingen van dit besluit zoals deze luidden op
      voornoemde datum.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel9
    url: https://wetten.overheid.nl/BWBR0007816/2005-05-11#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '9'
        hoofdstuk: '2'
  - number: '25'
    text: |-
      Bij de vaststelling van de grondslag voor de vakantie-uitkering wordt in voorkomend geval het ingevolge de bij of
      krachtens de [Kaderwet militaire pensioenen][ref1] bepaalde emolument huisvesting Koninklijke marechaussee, mede in
      aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011955
    url: https://wetten.overheid.nl/BWBR0007816/2005-05-11#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011955
  - number: 25a
    text: |-
      Van de bevoegdheid tot het vaststellen van ministeriële regelingen als bedoeld in
      [artikel 16, eerste lid, onderdelen c en d][ref1], kan mandaat worden verleend aan de hoofddirecteur personeel van
      het Ministerie van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel16
    url: https://wetten.overheid.nl/BWBR0007816/2005-05-11#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '16'
        hoofdstuk: '3'
  - number: '26'
    text: |-
      Indien de billijkheid dat vordert, kan Onze Minister de militair schadeloos stellen, kosten vergoeden of overigens
      een geldelijke tegemoetkoming toekennen.
    url: https://wetten.overheid.nl/BWBR0007816/2005-05-11#Artikel26
  - number: '29'
    text: |-
      Dit besluit treedt in werking met ingang van 1 januari 1996. Indien het *Staatsblad* waarin dit besluit wordt
      geplaatst, wordt uitgegeven na 31 december 1995, treedt het in werking met ingang van de dag na de datum van
      uitgifte van het *Staatsblad* waarin het wordt geplaatst, en werkt het terug tot en met 1 januari 1996.
    url: https://wetten.overheid.nl/BWBR0007816/2005-05-11#Artikel29
  - number: '30'
    text: 'Dit besluit wordt aangehaald als: Inkomstenbesluit militairen.'
    url: https://wetten.overheid.nl/BWBR0007816/2005-05-11#Artikel30
