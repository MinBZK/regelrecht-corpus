  - number: 17a
    text: |-
      1 Indien de militair, bedoeld in [artikel 17][ref1], ter zake van de betrekking waaruit het recht op doorbetaling
      van bezoldiging voortvloeit, recht heeft op een of meerdere uitkeringen op grond van een werknemersverzekering, de
      [Wet arbeid en zorg][ref2] of een bovenwettelijke WW-uitkering, wordt het bedrag van die uitkering(en) in mindering
      gebracht op het bedrag waarop hij ingevolge [artikel 17][ref3] recht heeft.

      2 Indien als gevolg van handelingen of het nalaten van handelingen door de militair de uitkering ingevolge een
      werknemersverzekering, de [Wet arbeid en zorg][ref4], dan wel de bovenwettelijke WW-uitkering een vermindering
      ondergaat, dan wel de aanspraak daarop geheel of gedeeltelijk niet wordt toegekend, wordt die uitkering voor de
      toepassing van het eerste lid steeds aangemerkt als een uitkering die onverminderd is genoten. Indien het een
      uitkering betreft op grond van de [WAO][ref5] die in het geheel niet wordt toegekend, wordt voor de toepassing van
      dit artikel rekening gehouden met de uitkering op grond van de [WAO][ref6] zoals die zou zijn toegekend bij een
      arbeidsongeschiktheid van 80% of meer.

      3 Indien ten aanzien van de wettelijke uitkering een verplichting wordt opgelegd of een sanctie wordt toegepast,
      wordt door de bevelhebber zoveel mogelijk dezelfde verplichting opgelegd, dan wel een overeenkomstige sanctie
      toegepast op het bedrag aan inkomsten waarop de militair ingevolge het eerste lid aanspraak heeft.

      4 In bijzondere gevallen kan de bevelhebber bepalen dat de niet genoten inkomsten geheel of
      gedeeltelijk aan anderen dan aan de militair worden betaald. Na verrekening met deze aan anderen
      dan aan de militair betaalde inkomsten, worden de eventueel resterende, niet betaalde inkomsten
      alsnog aan de militair betaald, indien een door hem aangevraagd hernieuwd onderzoek als bedoeld in
      [artikel 102 van het Algemeen militair ambtenarenreglement][ref7] in zijn voordeel is beslist.

      5 Het in het derde lid bedoelde verplichtingen- en sanctieregime is van overeenkomstige toepassing indien de
      militair bij doorbetaling van bezoldiging tijdens ziekte of arbeidsongeschiktheid de in dat lid bedoelde aanspraak
      niet had kunnen hebben.


