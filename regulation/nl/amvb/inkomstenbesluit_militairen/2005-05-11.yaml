  - number: 23d
    text: |-
      1 Over de toelage bedoeld in [artikel 23a, eerste lid, onderdeel i][ref1], wordt, zolang niet is uitgesloten
      dat aan de in dat onderdeel bedoelde voorwaarde zal worden voldaan, een pseudo-pensioenpremie ingehouden,
      overeenkomstig de pensioenbijdrage die verhaald zou zijn, indien die toelage tot zijn pensioengrondslag zou
      behoren.

      2 De in het eerste lid bedoelde pseudo-pensioenpremie is verschuldigd, totdat blijkt dat aan de in
      [artikel 23a, eerste lid, onderdeel i][ref2], bedoelde voorwaarde is voldaan.

      3 De in het eerste lid bedoelde pseudo-pensioenpremie over de toelage wordt aan de militair gerestitueerd, zodra
      die toelage niet meer wordt genoten en is uitgesloten dat aan de in [artikel 23a, eerste lid, onderdeel i][ref3],
      bedoelde voorwaarde zal worden voldaan.

      4 Het derde lid is van overeenkomstige toepassing indien de militair komt te overlijden en niet aan de in
      [artikel 23a, eerste lid, onderdeel i][ref4], bedoelde voorwaarde is voldaan.

      5 Ter voldoening aan de in [artikel 23a, eerste lid, onderdeel i][ref5], bedoelde voorwaarde, wordt voor de
      militair die vóór 1 juni 2006 met leeftijdsontslag gaat mede onder de toelage officieren-medisch specialist
      begrepen: de bijzondere tegemoetkoming, toegekend aan de officieren-medisch specialist op grond van
      [artikel 115 van het Algemeen Militair Ambtenarenreglement][ref6].

      6 Indien de in het vijfde lid bedoelde militair op de ontslagdatum ten minste twee
      jaar ouder is dan de op die datum voor hem geldende ontslagleeftijd, bedoeld in
      [artikel 39a van het Algemeen Militair Ambtenarenreglement][ref7], wordt de toelage aangemerkt als toelage die aan
      de in [artikel 23a, eerste lid, onderdeel i][ref8], bedoelde voorwaarde voldoet.


