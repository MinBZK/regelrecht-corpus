  - number: 23b
    text: |-
      1 De eigen bijdrage van de militair aan het arbeidsongeschiktheidspensioen komt
      overeen met het pensioenbijdrageverhaal voor het invaliditeitspensioen dat ingevolge
      [artikel 4, vijfde lid van de Wet privatisering ABP][ref1] van een overheidswerknemer, die met die militair kan
      worden gelijkgesteld, door de sectorwerkgever wordt geheven.

      2 De eigen bijdrage van de gewezen militair aan het arbeidsongeschiktheidspensioen komt
      overeen met het pensioenbijdrageverhaal voor het invaliditeitspensioen dat ingevolge
      [artikel 4, vijfde lid, van de Wet privatisering ABP][ref2] van een gewezen overheidswerknemer, die met die gewezen
      militair kan worden gelijkgesteld, door de voor de ontslaguitkering zorgdragende instantie wordt geheven.

      3 De tijdelijke aanvullende eigen bijdrage van de militair en de gewezen militair aan het ouderdoms-
      en nabestaandenpensioen bedraagt een door het bestuur van de Stichting Pensioenfonds ABP ingevolge de
      [Kaderwet militaire pensioenen][ref3] vast te stellen extra bijdrage in de jaren 2004 tot en met 2006. Deze
      bijdrage wordt geheven over de bijdragegrondslag die geldt voor het pensioenbijdrageverhaal voor het ouderdoms- en
      nabestaandenpensioen in de desbetreffende jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007791#Artikel4
