  - number: '16'
    text: |-
      1 Bij ministeriële regeling kan de militair aanspraak worden verleend op:

      a. een toelage in verband met het vervullen van een door Onze Minister aangewezen functie of het bezit van een door
      Onze Minister aangewezen bekwaamheid;

      b. een toelage voor het verrichten van werkzaamheden waaraan naar het oordeel van Onze Minister bijzondere risico’s
      of inconveniënten zijn verbonden;

      c. een toelage of - in de plaats daarvan - voorzieningen in natura ter zake van het verblijf van de militair buiten
      Nederland;

      d. een vergoeding van of een tegemoetkoming in de kosten van recepties en representatie;

      e. een diensttijdgratificatie bij een - naar het oordeel van Onze Minister - eervolle diensttijd van
      twaalfeneenhalf, vijfentwintig of vijfendertig jaren;

      f. een toelage dan wel een toeslag, uitsluitend indien de militair is aangesteld bij het reserve-personeel, in
      verband met het handhaven van zijn beschikbaarheid en inzetbaarheid;

      g. een vergoeding van of een tegemoetkoming in de kosten van communicatie.

      2 Tenzij de bevelhebber om redenen van billijkheid anders bepaalt, is de militair die is aangesteld bij het
      reserve-personeel en de verplichting op zich heeft genomen om zich gedurende een bepaalde tijd beschikbaar te
      houden voor inzet in het kader van een door Onze Minister als zodanig aangemerkte vredes- of humanitaire operatie
      of andere vorm van daadwerkelijke inzet buiten Nederland, verplicht tot terugbetaling van de hem daartoe verstrekte
      toelage, indien hij deze verplichting niet nakomt.
    url: https://wetten.overheid.nl/BWBR0007816/2005-05-11#Artikel16
  - number: '17'
    text: |-
      1 De militair die wegens ziekte verhinderd is dienst te verrichten, heeft, zodra die verhindering achttien maanden
      heeft geduurd, aanspraak op 80 procent van de inkomsten waarop hij aanspraak zou hebben, indien die verhindering
      tot dienstverrichting niet was ingetreden.

      2 Indien de militair tijdens de in het eerste lid genoemde termijn gedurende zekere tijd voor ten minste 45% van de
      voor hem normaal geldende arbeidsduur dienst verricht, dan wel zwangerschaps- of bevallingsverlof geniet op basis
      van [artikel 3:1 van de Wet arbeid en zorg][ref1], wordt die termijn voor de toepassing van het eerste lid met die
      tijd, dan wel dat verlof verlengd.

      3 Voor het bepalen van de in het eerste lid genoemde termijn – in voorkomend geval verlengd ingevolge het
      tweede lid – wordt een opnieuw ingetreden verhindering tot dienstverrichting als voortzetting van de voorgaande
      verhindering beschouwd, indien niet meer dan vier weken zijn verstreken sinds de dag waarop de militair de dienst
      volledig heeft hervat. Bij de vaststelling van de periode van vier weken blijven perioden waarin zwangerschapsof
      bevallingsverlof wordt genoten op basis van [artikel 3:1 van de Wet arbeid en zorg][ref2], buiten beschouwing.

      4 In afwijking van het eerste lid heeft de militair ook na afloop van de in dat lid genoemde termijn - in
      voorkomend geval verlengd ingevolge het tweede lid - aanspraak op de inkomsten waarop hij aanspraak zou hebben,
      indien die verhindering tot dienstverrichting niet was ingetreden:

      a. zolang hij voor ten minste 45 procent van de voor hem normaal geldende arbeidsduur dienst verricht;

      b. als de ziekte waardoor hij verhinderd is dienst te verrichten naar het oordeel van de bevelhebber in
      overwegende mate haar oorzaak vindt in de aard van de hem opgedragen werkzaamheden of diensten of in de bijzondere
      omstandigheden waaronder deze moeten worden verricht, en - rekening houdend met die werkzaamheden of diensten en
      omstandigheden - niet aan zijn schuld of onvoorzichtigheid is te wijten;

      c. gedurende de periode dat zwangerschaps- of bevallingsverlof wordt genoten op basis van artikel
      [3:1 van de Wet arbeid en zorg][ref3].

      5 De militair die wegens ziekte verhinderd is dienst te verrichten, heeft geen aanspraak op inkomsten, indien hij
      naar het oordeel van de bevelhebber:

      a. de ziekte heeft voorgewend, althans zodanig overdreven heeft voorgesteld, dat verhindering tot dienstverrichting
      niet kan worden aangenomen;

      b. de verhindering tot dienstverrichting opzettelijk heeft veroorzaakt, tenzij hem daarvan op grond van zijn
      psychische toestand geen verwijt kan worden gemaakt;

      c. weigert zich te onderwerpen aan een onderzoek door of vanwege de militair geneeskundige dienst of, ná voor zo'n
      onderzoek te zijn opgeroepen, zonder geldige reden niet verschijnt;

      d. zonder voldoende gronden nalaat zich onder geneeskundige behandeling te stellen of te blijven stellen of zich
      niet houdt aan de hem door de behandelend arts gegeven voorschriften, met dien verstande dat hij geen medewerking
      behoeft te verlenen aan een ingreep van heelkundige aard;

      e. zich zodanig gedraagt dat zijn genezing wordt belemmerd of vertraagd;

      f. tijdens de verhindering tot dienstverrichting voor zichzelf of voor derden arbeid verricht, tenzij dit door de
      militair geneeskundige dienst in het belang van zijn genezing wordt geacht;

      g. in gebreke blijft op het door de commandant – op advies van de militair geneeskundige dienst – bepaalde tijdstip
      en in de door hem bepaalde mate de dienst te hervatten, tenzij de militair daarvoor een inmiddels opgekomen, door
      de commandant als geldig erkende reden heeft opgegeven;

      h. voor de betaling van de bezoldiging of de bovenwettelijke arbeidsongeschiktheidsuitkering, weigert mededeling te
      doen van inkomsten uit arbeid die hij heeft in verband met het verrichten van door de Arbo-dienst in het belang van
      zijn genezing wenselijk geachte arbeid voor zichzelf of voor derden;

      i. niet onverwijld op verzoek of uit eigen beweging alle feiten en omstandigheden meedeelt, waarvan hem
      redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op het recht of op de hoogte van een aan hem
      toegekende arbeidsongeschiktheidsuitkering;

      j. weigert gevolg te geven aan door de commandant of een door deze aangewezen deskundige gegeven
      redelijke voorschriften of mee te werken aan door de commandant of een door deze aangewezen deskundige
      getroffen maatregelen om de militair in staat te stellen de eigen of andere passende arbeid als bedoeld in
      [artikel 94a, eerste lid, onderdeel a, van het AMAR][ref4] te verrichten;

      k. zonder deugdelijke grond weigert mee te werken aan het opstellen, evalueren en bijstellen van een plan van
      aanpak als bedoeld in [artikel 71a, tweede lid, van de WAO][ref5];

      l. zijn medewerking weigert bij de doelmatige uitvoering van de bepalingen van dit hoofdstuk.

      6 De aanspraak op doorbetaling van inkomsten ingevolge dit artikel vervalt, indien de militair zonder deugdelijke
      grond weigert de hem door de bevelhebber aangeboden passende, dan wel gangbare arbeid, waartoe de militair
      geneeskundige dienst hem in staat acht, te aanvaarden.

      7 In bijzondere gevallen kan de bevelhebber in de situaties, genoemd in het vijfde en zesde lid, bepalen dat
      de niet genoten inkomsten geheel of gedeeltelijk aan anderen dan aan de militair worden betaald. Na verrekening
      met deze aan anderen dan aan de militair betaalde inkomsten, worden de eventueel resterende, niet betaalde
      inkomsten alsnog aan de militair betaald, indien een door hem aangevraagd hernieuwd onderzoek als bedoeld in
      [artikel 102 van het Algemeen militair ambtenarenreglement][ref6] in zijn voordeel is beslist.

      8 Het vijfde tot en met zevende lid is niet van toepassing indien sprake is van samenloop, bedoeld in
      [artikel 17a][ref7], met een uitkering op grond van en werknemersverzekering of de [Wet arbeid en zorg][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel31
