    text: |-
      1 De militair respectievelijk de gewezen militair met de rang van vice-admiraal, luitenant-generaal,
      luitenant-admiraal of generaal heeft aanspraak op een eindejaarsuitkering ten bedrage van 0,4%
      van de door hem genoten bezoldiging respectievelijk de door hem genoten uitkering op grond van de
      [Uitkeringswet gewezen militairen][ref1] of het door hem genoten wachtgeld of uitkering als bedoeld in
      [artikel 18, zesde lid, van het Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Defensie][ref2]
      na toepassing van de bij of krachtens die wet respectievelijk die regeling geldende vermindering wegens inkomsten
      uit of in verband met arbeid of bedrijf.

      2 Bij ministeriële regeling kan de eindejaarsuitkering, bedoeld in het eerste lid, worden verhoogd met een nominaal
      bedrag overeenkomstig de desbetreffende vaststelling bij overige overheidssectoren.


