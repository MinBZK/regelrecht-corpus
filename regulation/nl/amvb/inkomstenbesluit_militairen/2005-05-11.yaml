      1 De militair heeft aanspraak op een salaris dat wordt bepaald met inachtneming van:

      a. het krijgsmachtdeel waartoe hij behoort;

      b. zijn rang en

      c. zijn salarisnummer.

      2 De militair van de Koninklijke landmacht die behoort tot het Korps Nationale Reserve heeft aanspraak op 50
      procent van het salaris dat op grond van het eerste lid wordt vastgesteld, indien hij werkelijke dienst verricht
      ter zake van bij ministeriële regeling vastgestelde activiteiten.
    url: https://wetten.overheid.nl/BWBR0007816/2005-05-11#Artikel5
