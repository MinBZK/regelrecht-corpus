  - number: '18'
    text: |-
      Voor elke volledige dag dat de militair zich aan zijn dienstverplichtingen onttrekt, heeft hij geen aanspraak op
      inkomsten.
    url: https://wetten.overheid.nl/BWBR0007816/2021-02-12#Artikel18
  - number: '19'
    text: |-
      1 Bij de militair die ingevolge [artikel 34, eerste lid][ref1], dan wel ingevolge
      [artikel 34, tweede lid, onderdeel a of b, van het Algemeen militair ambtenarenreglement][ref2] is geschorst, wordt
      door de commandant voor de duur van die schorsing eenderde gedeelte ingehouden van de inkomsten, tenzij het hoofd
      defensieonderdeel bepaalt dat geen inhouding zal plaatsvinden.

      2 In geval een schorsing als bedoeld in het eerste lid, langer duurt dan zes weken, kan het hoofd defensieonderdeel
      bepalen dat gedurende die verdere duur van die schorsing een verdere inhouding plaatsvindt tot het volle bedrag
      der inkomsten. Bij de afweging omtrent de hoogte van de inhouding wordt de financiële positie van de militair in de
      beschouwing betrokken.

      3 Bij de militair die ingevolge [artikel 34, tweede lid, onder c, van het Algemeen militair ambtenarenreglement][ref3]
      is geschorst, vindt geen inhouding van inkomsten plaats.

      4 De ingehouden inkomsten kunnen alsnog geheel of gedeeltelijk aan
      de militair worden uitbetaald, indien een schorsing als bedoeld in
      [artikel 34, tweede lid, onderdeel a of b, van het Algemeen militair ambtenarenreglement][ref4] niet wordt gevolgd
      door een veroordeling tot een onvoorwaardelijke vrijheidsstraf, een vrijheidsbenemende maatregel of ontslag uit de
      militaire dienst. Op de aldus uit te keren inkomsten worden in mindering gebracht de inkomsten, welke de militair
      sedert de schorsing heeft genoten uit arbeid, die hij als gevolg van de schorsing heeft kunnen verrichten, tenzij
      zulks, naar het oordeel van het hoofd defensieonderdeel, onredelijk of onbillijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0003482#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0003482#Artikel34
