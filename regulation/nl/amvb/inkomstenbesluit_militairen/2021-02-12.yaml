    text: |-
      1 De commandant operationeel commando kan aan een militair in fase twee of drie, die zich verbindt om gedurende een
      bepaalde periode onafgebroken deel uit te maken van het beroepspersoneel, een bindingspremie toekennen.

      2 Bij ministeriële regeling worden regels gesteld omtrent de toekenning van een bindingspremie.
    url: https://wetten.overheid.nl/BWBR0007816/2021-02-12#Artikel12
  - number: 12a
    text: |-
      1 Het hoofd defensieonderdeel kan aan een militair, die is aangesteld bij het beroepspersoneel en het voor hem
      geldende maximumsalaris heeft bereikt, een functioneringstoelage toekennen, indien de wijze van functioneren van
      die militair daartoe naar het oordeel van het hoofd defensieonderdeel aanleiding geeft.

      2 De functioneringstoelage wordt toegekend voor een periode van tenminste één jaar.

      3 De functioneringstoelage bedraagt ten hoogste 10 procent van het voor de militair geldende salaris.

      4 Indien de militair, die een functioneringstoelage geniet, wordt bevorderd, niet zijnde een tijdelijke
      bevordering, komt de functioneringstoelage met ingang van de datum van de bevordering te vervallen.

      5 Indien de militair, die een functioneringstoelage geniet, tijdelijk wordt bevorderd, wordt het bedrag van de
      functioneringstoelage gedurende de tijd dat hij de tijdelijke rang bekleedt, op nul gesteld.

      6 Voor de toepassing van dit artikel wordt het maximumsalaris bereikt voor:

      a. de matroos der 1e klasse van de Koninklijke Marine: bij het salarisnummer 11 of hoger;

      b. de korporaal, de korporaal der 1e klasse van de Koninklijke Landmacht en de Koninklijke Luchtmacht en de
      marechaussee der 1e klasse van de Koninklijke Marechaussee: bij het salarisnummer 15 of hoger.
    url: https://wetten.overheid.nl/BWBR0007816/2021-02-12#Artikel12a
  - number: 12b
    text: |-
      1 Onder toepassing van [artikel 53g van het Algemeen militair ambtenarenreglement][ref1] wordt aan de militair
      die behoort tot een bij ministeriële regeling vastgestelde categorie personeel, een premie ter stimulering van het
      behoud van de militair toegekend.

      2 Bij ministeriële regeling worden regels gesteld omtrent de hoogte en de wijze van toekenning van een
      behoudpremie.


