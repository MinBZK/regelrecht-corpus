  - number: '3'
    text: |-
      1 Voor zover in dit besluit niet anders is bepaald, heeft de militair aanspraak op inkomsten voor elke dag dat hij
      in werkelijke dienst is; daarbij wordt een gedeelte van een dag aangemerkt als een volle dag.

      2 Bij de vaststelling van inkomsten die zijn uitgedrukt per maand wordt een maand gesteld op dertig dagen. Bij de
      berekening over een gedeelte van een maand wordt het bedrag per dag vastgesteld door het maandbedrag te delen door
      dertig. Een wijziging van inkomsten op de eenendertigste van een maand gaat in op de eerste dag van de volgende
      maand.

      3 Tenzij anders is bepaald, kan op inkomsten die zijn uitgedrukt per dag of per tijdseenheid van langere duur en
      die niet tot de bezoldiging behoren, slechts aanspraak bestaan voor de tijd dat aanspraak bestaat op bezoldiging.
      Bedoelde inkomsten worden dan toegekend in evenredigheid met de bezoldiging waarop aanspraak bestaat.

      4 De militair aangesteld bij het reservepersoneel, die in werkelijke dienst is op grond van
      [artikel 12l, derde lid, van de Militaire ambtenarenwet 1931][ref1] heeft geen aanspraak op inkomsten.

      5 De bezoldiging van de militair aangesteld bij het reservepersoneel in werkelijke dienst bedraagt per feitelijk
      gewerkt uur 1/165e van de maandbezoldiging, met een maximum van 165 uren per maand.

      6 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de vaststelling van de inkomsten
      van de militair aangesteld bij het reservepersoneel.


