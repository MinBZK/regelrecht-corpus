      de voor hem geldende bezoldiging.

      2 In afwijking van het eerste lid wordt voor de militair die aanspraak heeft op een afwijkende bezoldiging de
      toelage verminderd overeenkomstig de mate waarin die bezoldiging afwijkt van de bezoldiging bedoeld in het eerste
      lid.

      3 Het percentage bedoeld in het eerste lid, wordt bepaald aan de hand van het maandbedrag van de bezoldiging,
