  - number: 13a
    text: |-
      1 Aan de militair die met goed gevolg zijn initiële opleiding heeft volbracht kan naar bij ministeriële regeling te
      stellen regels een aanstellingspremie worden toegekend.

      2 Indien de in het eerste lid bedoelde militair tijdens fase één ontslag wordt verleend, betaalt hij de toegekende
      premie op een door Onze minister te bepalen wijze terug.

      3 Indien het in het tweede lid bedoelde ontslag niet of niet geheel aan de militair valt te verwijten kan Onze
      Minister in afwijking van het tweede lid bepalen dat de toegekende premie gedeeltelijk of niet behoeft te worden
      terugbetaald.
    url: https://wetten.overheid.nl/BWBR0007816/2021-02-12#Artikel13a
  - number: '14'
    text: |-
      1 De militair met aanspraak op salaris heeft aanspraak op een vakantie-uitkering ten bedrage van 8 procent van de
      door hem genoten bezoldiging, in voorkomend geval vermeerderd met:

      a. de waarnemingstoelage;

      b. de toelage officieren-arts, -tandarts, of -apotheker, zodra deze laatstelijk gedurende vijf jaren onafgebroken
      is genoten;

      c. de brevettoelage voor het vervullen van een eerste partij bij de marinierskapel der Koninklijke marine;

      d. de brevettoelage voor het vervullen van een solistenpartij bij de marinierskapel der Koninklijke marine;

      e. de vliegtoelage of de garantievliegtoelage;

      f. de toelage woninghuur Koninklijke marechaussee;

      g. het emolument van kleermakers, schoenmakers en barbiers der zeemacht, bedoeld in
      [artikel 23a, eerste lid, onderdeel l][ref1];

      h. de toelage Huis van Hare Majesteit de Koningin.

      2 het minimumbedrag per maand van de vakantie-uitkering is voor de militair:

      a. met salarisnummer 0: € 121,51;

      b. met salarisnummer 1: € 138,87;

      c. met salarisnummer 2: € 156,23;

      d. met salarisnummer 3 of hoger: € 173,59.

      3 Ten aanzien van de militair op wie [artikel 17, eerste lid][ref2], van toepassing is, wordt voor de toepassing
      van dit artikel uitgegaan van de inkomsten waarop die militair aanspraak zou hebben, indien de verhindering tot
      dienstverrichting niet was ingetreden.

      4 Indien de militair - anders dan op grond van [artikel 17][ref3] - aanspraak heeft op een gedeelte van de voor hem
      geldende inkomsten, wordt het in het tweede lid bedoelde bedrag naar evenredigheid verminderd.


