  - number: 11a
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de aanspraak van de militair op een toelage ter compensatie
      van – indien van toepassing – de hogere inhouding premie ouderdoms- en nabestaandenpensioen door de invoering van
      de middelloonregeling militairen.
    url: https://wetten.overheid.nl/BWBR0007816/2021-02-12#Artikel11a
  - number: 11b
    text: |-
