  - number: 17c
    text: |-
      1 Indien aan de militair door de commandant adoptieverlof op basis van
      [artikel 3:2, eerste tot en met derde lid, van de Wet arbeid en zorg][ref1] is verleend behoudt hij zijn aanspraak
      op inkomsten.

      2 De commandant draagt ervoor zorg dat de militair door tussenkomst van de commandant een uitkering op basis
      van [hoofdstuk 3 van de Wet arbeid en zorg][ref2] aanvraagt bij het Uitvoeringsinstituut werknemersverzekeringen
      bedoeld in [hoofdstuk 5 van de Wet-SUWI][ref3]. Deze uitkering moet uiterlijk twee weken voor de datum van ingang
      van het adoptieverlof onderscheidenlijk de datum waarop de militair het recht op de uitkering wil laten ingaan,
      worden aangevraagd.

      3 Indien de militair aan wie adoptieverlof is verleend gedurende dat verlof of gedurende een bepaalde periode van
      dat verlof tevens recht heeft op een uitkering op basis van de [Wet arbeid en zorg][ref4], wordt door het hoofd
      defensieonderdeel gedurende de periode waarin sprake is van samenloop een inhouding op de doorbetaling, bedoeld in
      het eerste lid, toegepast die overeenkomt met het bedrag van bedoelde uitkering.

      4 Indien aan de voorwaarden voor het toekennen van een uitkering als bedoeld in het derde lid is voldaan maar geen
      uitkering is toegekend omdat de militair geen aanvraag heeft ingediend, wordt het derde lid op overeenkomstige
      wijze toegepast.


