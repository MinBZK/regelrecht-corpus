  - number: 8a
    text: |-
      1 Voor de militair, die op 31 mei 2001 aanspraak maakt op salaris, wordt op 1 juni 2001 zijn tot die tijd geldende
      diensttijd omgezet in een salarisnummer aan de hand van de salarisschalen van [bijlage A][ref1] en [B][ref2] en
      met inachtneming van het volgende:

      a. Het salarisnummer wordt toegekend zodanig, dat het salaris op 1 juni 2001 gelijk is aan het salaris dat voor hem
      op die datum zou hebben gegolden bij toepassing van dit besluit zoals dat luidde op 31 mei 2001;

      b. Indien dit salaris niet voorkomt in de salarisschaal wordt het salarisnummer toegekend zodanig, dat het salaris
      gelijk is aan het eersthogere bedrag in de salarisschaal;

      c. Voor de militair, die één of meer jaren diensttijd had boven de diensttijd behorende bij het maximum salaris in
      de salarisschaal, wordt het salarisnummer hoger vastgesteld overeenkomstig dat aantal jaren diensttijd.

      2 In afwijking van [artikel 7, vierde lid][ref3], wordt voor de militair, die op 31 mei 2001 aanspraak maakt op
      salaris, de datum van de eerstvolgende verhoging van het salarisnummer na 1 juni 2001 als volgt vastgesteld:

      a. voor de militair, bedoeld in het eerste lid, onder b: één jaar na de toekenning van het salarisnummer;

      b. voor de militair, voor wie de diensttijd vóór 1 juni 2001 met tenminste een jaar is vermeerderd en voor de
      officier, niet bedoeld onder a: overeenkomstig de diensttijdbepalingen van dit besluit zoals deze luidden op 31
      mei 2001;

      c. voor de overige militairen: de eerste dag van de maand waarin één jaar is verstreken sedert zijn aanstelling.


