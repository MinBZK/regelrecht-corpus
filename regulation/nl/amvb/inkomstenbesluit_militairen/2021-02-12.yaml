      1 De militair aangesteld bij het beroepspersoneel, die op 31 december 2018 en op 1 januari 2019 in werkelijke
      dienst was, heeft, op het moment van transitie naar de middelloonregeling militairen per 1 januari 2019 en
      bij de eerstvolgende twee bevorderingen, voor zover deze bevorderingen plaatsvinden vóór 1 januari 2039 en de
      militair op die bevorderingsmomenten vanaf 1 januari 2019 doorlopend in werkelijke dienst is geweest, aanspraak
      op een compensatie van – indien van toepassing – een verminderd pensioenvooruitzicht in toekomstige jaren door de
      invoering van de middelloonregeling militairen.

      2 Bij ministeriële regeling worden nadere regels gesteld omtrent de compensatie, bedoeld in het eerste lid.
