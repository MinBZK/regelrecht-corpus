  - number: 23a
    text: |-
      1 Bij de berekening van de grondslag voor militair ouderdoms- en nabestaandenpensioen en pensioen ter zake van
      ziekten of gebreken naar de bij of krachtens de Kaderwet militaire pensioenen vast te stellen regels gelden als
      inkomstenbestanddelen ingevolge dit besluit de in tabel 1 bij dit artikel opgenomen inkomensbestanddelen.

      2 Aanvullende op de inkomensbestanddelen bedoeld in het eerste lid, gelden vanaf 1 januari 2019 en uiterlijk tot de
      laatste dag van de maand voorafgaande aan die waarin het aan de militair verleende leeftijdsontslag ingaat, tevens
      ingevolge dit besluit:

      a. als vaste inkomensbestanddelen voor 100 procent de in tabel 2 bij dit artikel opgenomen inkomensbestanddelen;

      b. als variabele inkomensbestanddelen voor 100 procent de in tabel 3 bij dit artikel opgenomen
      inkomensbestanddelen;

      c. tevens als variabele inkomstenbestanddelen ingevolge dit besluit, voor 50 procent de in tabel 4 opgenomen
      inkomensbestanddelen.

      3 Het eerste lid en het tweede lid, onderdeel a, zijn van overeenkomstige toepassing voor de gewezen militair
      die een uitkering ingevolge de [Uitkeringswet gewezen militairen][ref1] geniet en voor wie de ontslagleeftijd met
      ingang van 1 januari 2006 bij of krachtens [artikel 12 van de Militaire ambtenarenwet 1931][ref2] is gewijzigd.

      4 Het eerste lid en het tweede lid, onderdeel a, zijn van overeenkomstige toepassing voor de gewezen militair die
      een ontslaguitkering, waaronder tevens te begrijpen een uitkering ingevolge de Uitkeringswet gewezen militairen,
      geniet in de zin van de bij of krachtens de Kaderwet militaire pensioenen vastgestelde regels, met dien verstande
      dat onderdeel n van Tabel 1 niet als inkomensbestanddeel bij de berekening van de pensioengrondslag wordt
      meegenomen.








                    Tabel 1.


                    a. de bezoldiging;
                    b. de vakantie-uitkering;
                    c. de eindejaarsuitkering;
                    d. de vliegtoelage;
                    e. de garantievliegtoelage;
                    f. de toelage Huis van Z.M. de Koning;
                    g. de functioneringstoelage, indien deze voor ten minste vijf jaren onafgebroken is toegekend;
                    h. de toelage officieren-arts, officieren-tandarts en officieren-apotheker, zodra deze toelage
      laatstelijk gedurende vijf jaren onafgebroken is genoten;
                    i. de toelage officieren-medisch specialist, zodra deze toelage laatstelijk gedurende vijf jaren
      onafgebroken is genoten;
                    j. de brevettoelage marinierskapel;
                    k. een op grond van [artikel 26][ref3] van dit besluit dan wel een voor 1 januari 2009 op grond van
      [artikel 115 van het Algemeen militair ambtenarenreglement][ref4] toegekende schadeloosstelling, vergoeding of
      tegemoetkoming, voor zover deze, naar het oordeel van Onze Minister, een vast onderdeel van zijn inkomen vormt;
                    l. de door Onze Minister te schatten geldswaarden per jaar van het emolument van kleermakers,
      schoenmakers en barbiers der zeemacht wegens werkzaamheden ten dienste van de militairen, welke schatting niet
      individueel geschiedt doch voor alle kleermakers, schoenmakers en barbiers naar een voor elk van deze categorieën
      te bepalen bedrag, berekend naar de gemiddelde inkomsten, welke door elke categorie jaarlijks uit het bedrijf wordt
      genoten;
                    m. het emolument huisvesting Koninklijke marechaussee;
                    n. de vaste vergoeding voor extra beslaglegging van de militair die zich in fase 2 of 3 bevindt, voor
      zover hij deze na 31 december 2001 heeft genoten;
                    o. eenmalige uitkeringen aan het defensiepersoneel.




                    Tabel 2.


                    a. de functioneringstoelage;
                    b. de toelage officieren-arts, officieren-tandarts en officieren-apotheker;
                    c. de toelage officieren-medisch specialist;
                    d. de vaste vergoeding voor extra beslaglegging van de militair die zich in fase 1 bevindt;
                    e. de tijdelijke toelage loongebouw.




                    Tabel 3.


                    a. de waarnemingstoelage;
                    b. de functioneringsgratificatie;
                    c. de bindingspremie;
                    d. de behoudpremie.
                    e. de naar bij ministeriële regeling vastgestelde regels genoten toelage of vergoeding voor extra
      beslaglegging bedoeld in [artikel 60c, onderdelen a en b, van het Algemeen militair ambtenarenreglement][ref5];
                    f. overige vergoedingen en toelagen voor zover dit bij ministeriële regeling is bepaald.




                    Tabel 4.


                    a. de bij ministeriële regeling vastgestelde vergoeding voor extra beslaglegging bedoeld in
      [artikel 60c, onderdelen d en e, van het Algemeen militair ambtenarenreglement][ref6];
                    b. de bij ministeriële regeling vastgestelde vergoeding voor ondervonden extra werkdruk die een
      gevolg is van de inzet;
                    c. overige vergoedingen en toelagen voor zover dit bij ministeriële regeling is bepaald.


