      1 Onze Minister kan in geval van buitengewone omstandigheden, als bedoeld in
      [artikel 1, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref1], tijdelijk afwijken van hetgeen
      bij of krachtens dit besluit is bepaald, indien en voor zolang dit met het oog op de goede uitvoering van de
      operationele taken van de krijgsmacht noodzakelijk wordt geacht.

      2 Bij ministeriële regeling kunnen voorts afwijkende regelen worden gesteld ten aanzien van militairen, die zijn
      tewerkgesteld of ingezet:

      a. onder leiding of toezicht van een orgaan van de Verenigde Naties;

      b. bij of ten behoeve van een bondgenootschappelijk orgaan of bondgenootschappelijke strijdkrachten;

      c. ten behoeve van operaties in het kader van internationale overeenkomsten of andere verplichtingen door Nederland
      aangegaan;

      d. buiten het Ministerie van Defensie anders dan in de gevallen, bedoeld onder a, b en c.


