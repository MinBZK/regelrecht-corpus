  - number: '6'
    text: |-
      1 De bevoegdheid tot het toekennen van aanspraken op grond van de [artikelen 7][ref1], [8][ref2], [12][ref3],
      [12a][ref4] en [13][ref5] aan militairen met de rang van kapitein ter zee/kolonel en hoger berust bij de
