  - number: '26'
    text: |-
      Indien de billijkheid dat vordert, kan Onze Minister de militair schadeloos stellen, kosten vergoeden of overigens
      een geldelijke tegemoetkoming toekennen.
    url: https://wetten.overheid.nl/BWBR0007816/2021-02-12#Artikel26
  - number: '27'
    text: |-
      Na inwerkingtreding van de [Wet normalisering rechtspositie ambtenaren][ref1] berust dit besluit op de
      [artikelen 12][ref2] en [12o van de Wet ambtenaren defensie][ref3].


