      - id: ref1
        bwb_id: BWBR0030105
  - number: '17'
    text: |-
      1 De militair die wegens ziekte verhinderd is dienst te verrichten, heeft, zodra die verhindering twaalf maanden
      heeft geduurd, aanspraak op 70% van de inkomsten waarop hij aanspraak zou hebben, indien die verhindering tot
      dienstverrichting niet was ingetreden.

      2 Indien de militair, bedoeld in het eerste lid gedurende een bepaalde tijd zwangerschaps- of bevallingsverlof op
      basis van [artikel 3:1 van de Wet arbeid en zorg][ref1] geniet wordt het betreffende tijdvak van twaalf maanden met
      dat verlof verlengd.

      3 Voor het bepalen van de in het eerste lid genoemde termijn – in voorkomend geval verlengd ingevolge het
      tweede lid – wordt een opnieuw ingetreden verhindering tot dienstverrichting als voortzetting van de voorgaande
      verhindering beschouwd, indien niet meer dan vier weken zijn verstreken sinds de dag waarop de militair de dienst
      volledig heeft hervat. Bij de vaststelling van de periode van vier weken blijven perioden waarin zwangerschapsof
      bevallingsverlof wordt genoten op basis van [artikel 3:1 van de Wet arbeid en zorg][ref2], buiten beschouwing.

      4 In afwijking van het eerste lid heeft de militair ook na afloop van de in lid 1 genoemde termijn – in voorkomend
      geval verlengd ingevolge het tweede lid – aanspraak op de inkomsten waarop hij aanspraak zou hebben, indien die
      verhindering tot dienstverrichting niet was ingetreden:

      a. als de ziekte waardoor hij verhinderd is dienst te verrichten naar het oordeel van het hoofd defensieonderdeel
      in overwegende mate haar oorzaak vindt in de aard van de aan hem opgedragen werkzaamheden of diensten of in de
      bijzondere omstandigheden waaronder deze moeten worden verricht, en – rekening houdend met de werkzaamheden of
      diensten en omstandigheden – niet aan zijn schuld of onvoorzichtigheid te wijten;

      b. gedurende de periode dat zwangerschaps- of bevallingsverlof wordt genoten op basis van
      [artikel 3:1 van de Wet arbeid en zorg][ref3].

      5 In afwijking van het eerste lid heeft de militair ook na het eerste tijdvak van twaalf maanden recht op
      doorbetaling van zijn inkomsten over het aantal uren dat hij loonvormende arbeid heeft verricht, niet zijnde
      reïntegratieactiviteiten waaronder therapeutische arbeid, onderwijs of scholing.

      6 In afwijking van het vijfde lid wordt onderwijs of scholing beschouwd als loonvormende arbeid indien:

      a. dit onderwijs of deze scholing is gekoppeld aan de functievervulling van een voor de militair beschikbare
      functie;

      b. dit onderwijs of deze scholing plaats vindt binnen een erkend reïntegratietraject en gericht is op concrete
      arbeidsmogelijkheden buiten Defensie en is goedgekeurd door de reïntegratie-autoriteit van Defensie.

      7 In bijzondere gevallen kan het hoofd defensieonderdeel in de situaties, genoemd in het vijfde en zesde lid,
      bepalen dat de niet genoten inkomsten geheel of gedeeltelijk aan anderen dan aan de militair worden betaald. Na
      verrekening met deze aan anderen dan aan de militair betaalde inkomsten, worden de eventueel resterende, niet
      betaalde inkomsten alsnog aan de militair betaald, indien een door hem aangevraagd hernieuwd onderzoek als bedoeld
      in [artikel 104 van het Algemeen militair ambtenarenreglement][ref4] in zijn voordeel is beslist.

      8 Het vijfde tot en met zevende lid is niet van toepassing indien sprake is van samenloop, bedoeld in
      [artikel 17a][ref5], met een uitkering op grond van en werknemersverzekering of de [Wet arbeid en zorg][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel31
