    text: |-
      1 In dit artikel wordt verstaan onder:

        - *pensioengevend inkomen:* de som van de inkomensbestanddelen die op grond van de pensioenregeling voor militairen
      die geldt tot 1 januari 2019 pensioengevend zijn voor de opbouw van aanspraken op ouderdomspensioen en het daarvan
      afgeleide partnerpensioen en wezenpensioen;
        - *aftoppingsgrens:* de aftoppingsgrens van het pensioengevend inkomen op basis van
      [artikel 18ga van de Wet op de loonbelasting 1964][ref1].

      2 De militair heeft aanspraak op een uitkering indien zijn pensioengevend inkomen wordt afgetopt op basis van
      [artikel 18ga van de Wet op de loonbelasting 1964][ref2].

      3 De gewezen militair die een uitkering ontvangt op grond van de Uitkeringswet gewezen militairen
      heeft aanspraak op een uitkering indien zijn pensioengevend inkomen wordt afgetopt op basis van
      [artikel 18ga van de Wet op de loonbelasting 1964][ref3].

      4 De uitkering, bedoeld in het tweede lid, wordt berekend door het werkgeversdeel van de premie voor ouderdoms- en
      nabestaandenpensioen te vermenigvuldigen met het pensioengevend inkomen boven de aftoppingsgrens.

      5 De uitkering, bedoeld in het derde lid, wordt berekend door vijftig procent van het werkgeversdeel van de
      premie voor ouderdoms- en nabestaandenpensioen te vermenigvuldigen met het pensioengevend inkomen boven de
      aftoppingsgrens.

      6 Dit artikel is niet van toepassing op militairen, en gewezen militairen, wier salarissen de ontwikkeling volgen
      van de sector Rijk.


