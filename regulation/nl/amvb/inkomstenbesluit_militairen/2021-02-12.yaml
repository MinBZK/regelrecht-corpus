  - number: '9'
    text: |-
      1 Een militair wiens salaris vermindering ondergaat, heeft aanspraak op een overbruggingstoelage ten bedrage van
      die vermindering, indien hij:

      a. na een verandering in zijn dienstverhouding tot het Rijk - in verband met het volgen van een opleiding wordt
      aangesteld in een lagere rang; of

      b. na overgang naar een ander krijgsmachtdeel aanspraak heeft op een lager salaris.

      2 Een militair, voor wie na bevordering de functioneringstoelage is vervallen, of het bedrag ervan op nul is
      gesteld, heeft aanspraak op een overbruggingstoelage indien hij na bevordering aanspraak heeft op een salaris
      dat lager is dan het salaris vermeerderd met de functioneringstoelage waarop hij direct voorafgaande aan die
      bevordering aanspraak had, ten bedrage van deze vermindering.

      3 Indien het salaris van de militair aan wie een overbruggingstoelage is toegekend, wordt verhoogd anders dan op
      grond van een algemene salarismaatregel, wordt de overbruggingstoelage met het bedrag van die verhoging verminderd.

      4 Geen aanspraak op een overbruggingstoelage wordt verleend, dan wel de aanspraak op de toegekende
      overbruggingstoelage vervalt, indien de militair na een tijdelijke rang te hebben bekleed, de rang herkrijgt die
      hij had voordat hij tijdelijk werd bevorderd.

      5 De aanspraak op de in het tweede lid bedoelde overbruggingstoelage eindigt op de datum waarop de toegekende
      functioneringstoelage volgens de toekenningsbeschikking zou eindigen.
    url: https://wetten.overheid.nl/BWBR0007816/2021-02-12#Artikel9
  - number: '10'
    text: |-
      1 De militair wiens salaris – in voorkomend geval verhoogd met een overbruggingstoelage – lager is dan het
      militair-specifiek minimumloon heeft aanspraak op een garantietoelage minimumloon ten bedrage van het verschil.

      2 Het militair-specifiek minimumloon is per 1 januari 2019 gelijk aan het maandbedrag van het wettelijk minimumloon
      bedoeld in [artikel 8 van de Wet minimumloon en minimumvakantiebijslag][ref1]. Indien de salarissen in de sector
      als gevolg van een algemene salarisverhoging worden verhoogd, wordt het militair-specifiek minimumloon verhoogd met
      het percentage van de algemene salarisverhoging. Indien het wettelijk minimumloon, bedoeld in artikel 8 van de Wet
      minimumloon en minimumvakantiebijslag, wordt verhoogd waardoor dit hoger is dan het militair-specifiek minimumloon,
      wordt het militair-specifiek minimumloon verhoogd tot het wettelijk minimumloon.

      3 In afwijking van het tweede lid is voor de militair tijdens initiële opleiding het militair-specifiek minimumloon
      per 1 januari 2019 gelijk aan het wettelijk minimumjeugdloon als bedoeld in het [Besluit minimumjeugdloon][ref2].
      Indien de salarissen in de sector Defensie als gevolg van een algemene salarisverhoging worden verhoogd, wordt het
      militair-specifiek minimumloon verhoogd met het percentage van de algemene salarisverhoging. Indien het wettelijk
      minimumjeugdloon, bedoeld in het Besluit minimumjeugdloon wordt verhoogd waardoor dit hoger is dan het militair-
      specifiek minimumloon, wordt het militair-specifiek minimumloon verhoogd tot het wettelijk minimumjeugdloon.

      4 Bij ministeriële regeling worden de bedragen vastgesteld van het militair-specifiek minimumloon, bedoeld in het
      tweede lid, en van het militair-specifiek minimumloon voor militairen in initiële opleiding, bedoeld in het derde
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
