articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *Arbodienst:* een voor de militair aangewezen arbodienst als bedoeld in de [Arbeidsomstandighedenwet][ref1];
        - *bezoldiging:* het salaris, in voorkomend geval vermeerderd met de overbruggingstoelage, bedoeld in
      [artikel 9][ref2], en de garantietoelage minimumloon, bedoeld in [artikel 10][ref3];
        - *commandant:* een bij ministeriële regeling aan te wijzen functionaris;
        - *de commandant operationeel commando:* de Commandant Zeestrijdkrachten, de Commandant Landstrijdkrachten, de
      Commandant Luchtstrijdkrachten en de Commandant Koninklijke Marechaussee, voor het desbetreffende commando;
        - *deskundige persoon:* een voor de militair aangewezen deskundige persoon als bedoeld in
      [artikel 14, eerste lid, van de Arbeidsomstandighedenwet][ref4] die belast is met de taken, bedoeld in artikel 14,
      eerste lid, onderdeel b, van die wet;
        - *gewezen militair:* de ontslagen militair, voor zover hij heeft behoort tot degenen die zijn aangesteld bij het
      beroepspersoneel of daarmee gelijk zijn gesteld;
        - *gezin en gezinsleden:* de echtgenoot, respectievelijk echtgenote van de militair en de kinderen, stief- en
      pleegkinderen van de militair of van de echtgenoot respectievelijk echtgenote;
        - *hoofd defensieonderdeel:* 1°. de Secretaris-Generaal, voor zover het betreft de Bestuursstaf; 2°. de
      commandant operationeel commando voor het desbetreffende commando; 3°. de directeur van de Defensie Materieel
      Organisatie, voor zover het betreft de Defensie Materieel Organisatie, met uitzondering van het deel ondergebracht
      in de Bestuursstaf; 4°. de commandant van het Commando Dienstencentra, voor zover het betreft het Commando
      Dienstencentra;
        - *inkomsten:* alle bedragen waarop de militair aanspraak kan maken bij of krachtens dit besluit;
        - *maand:* een kalendermaand;
        - *militair:* de militaire ambtenaar in de zin van
      [artikel 1, eerste en tweede lid, van de Militaire ambtenarenwet 1931][ref5];
        - *Nagelaten betrekkingen:* 1° De echtgenoot, echtgenote of geregistreerd partner van de overleden militair; 2° De
      achtergebleven partner die door de militair als partner is aangemeld bij de Stichting Pensioenfonds ABP en door het
      bestuur van dat fonds als zodanig is aangemerkt; 3° Minderjarige kinderen of minderjarige pleegkinderen;
        - *Officier:* de militair met de rang van luitenant ter zee der derde klasse, tweede luitenant of met een hogere
      rang;
        - *Onze Minister:* Onze Minister van Defensie;
        - *Pensioengevend inkomen:* de in de berekeningsgrondslag pensioenen opgenomen inkomensbestanddelen dat met
      inachtneming van de bepalingen van dit besluit voor de militair is vastgesteld op grond van [artikel 23a][ref6];
        - *rang:* een militaire rang en stand of klasse, voor zover niet titulair toegekend;
        - *salaris:* het bedrag dat met inachtneming van de bepalingen van dit besluit voor de militair is vastgesteld op
      grond van [artikel 5][ref7];
        - *salarisschaal:* een reeks van salarissen, behorende bij een bepaalde rang;
        - *salarisnummer:* het getal dat in een salarisschaal voor een salaris is vermeld;
        - *verhoogde bezoldiging:* de bezoldiging als bedoeld in [artikel 1][ref8], verhoogd met 8 procent vakantie-
      uitkering en het percentage vaste vergoeding extra beslaglegging als bedoeld in [artikel 11b][ref9] en de
      eindejaarsuitkering als bedoeld in [artikel 15][ref10];
        - *werknemersverzekering:* [Werkloosheidswet][ref11], [Wet op de Arbeidsongeschiktheidsverzekering][ref12], dan wel
      de [Ziektewet][ref13].

      2 In dit besluit en de daarop berustende bepalingen wordt mede verstaan onder militair: degene die is aangesteld in
      burgerlijke openbare dienst om bij de krijgsmacht als geestelijk verzorger werkzaam te zijn.

      3 Met inachtneming van [artikel 1, derde en vierde lid, van het Algemeen militair ambtenarenreglement][ref14] wordt
      in dit besluit en de daarop berustende bepalingen mede verstaan onder echtgenote of echtgenoot:

      1°. de geregistreerde partner;

      2°. degene die door de militair als partner is aangemeld bij de Stichting Pensioenfonds ABP en door het bestuur van
      dat fonds als zodanig is aangemerkt, op voorwaarde dat de militair een bewijs van die aanmelding heeft overgelegd
      aan de commandant;

      4 Voor de toepassing van dit besluit wordt verstaan onder:

      a. fase één: fase één als bedoeld in
      [artikel 1, eerste lid, onderdeel l van het Algemeen militair ambtenarenreglement][ref15];

      b. fase twee: fase twee als bedoeld in
      [artikel 1, eerste lid, onderdeel m van het Algemeen militair ambtenarenreglement][ref16];

      c. fase drie: fase drie als bedoeld in
      [artikel 1, eerste lid, onderdeel n van het Algemeen militair ambtenarenreglement][ref17].


