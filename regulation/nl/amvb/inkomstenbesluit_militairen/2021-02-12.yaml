      1 De commandant kan aan de militair die zich tijdens het verblijf in werkelijke dienst bijzonder heeft
      onderscheiden door optreden of gedragingen dan wel door buitengewone toewijding of bijzondere loffelijke
      dienstverrichtingen, naar bij ministeriële regeling te stellen regels, één of meer van de onderstaande beloningen
