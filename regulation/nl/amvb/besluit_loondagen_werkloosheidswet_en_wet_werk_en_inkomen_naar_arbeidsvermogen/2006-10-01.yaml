  - number: 3a
    text: |-
      Voor de toepassing van [artikel 42, tweede lid, onderdeel a, van de Werkloosheidswet][ref1] en
      [artikel 15, eerste lid, aanhef en onderdeel a, van de Wet werk en inkomen naar arbeidsvermogen][ref2] wordt:

      a. de werknemer die uitsluitend als gevolg van ploegendienst op minder dan vijf dagen per week arbeid verrichtte,
      geacht over het tijdvak waarin hij in ploegendienst werkzaam was, over vijf dagen per week loon te hebben genoten;

      b. arbeid in een aaneengesloten nachtdienst op twee dagen verricht, gerekend als arbeid op één dag;

      c. het aantal dagen waarover de werknemer gemiddeld per werkweek loon heeft genoten, geacht niet meer dan vijf
      te bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel15
