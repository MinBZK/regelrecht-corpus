articles:
  - number: '1'
    text: |-
      1 Voor de toepassing van [artikel 42, tweede lid, onderdeel a, van de Werkloosheidswet][ref1] en
      [artikel 15, eerste lid, aanhef en onderdeel a, van de Wet werk en inkomen naar arbeidsvermogen][ref2] worden
      dagen, waarover de werknemer:

      a. van zijn werkgever geen loon doch vakantiegeld heeft ontvangen; of

      b. tijdens dienstbetrekking vakantiebonnen of daarmee overeenkomende aanspraken bestemd voor die dagen heeft
      verkregen,

      gelijkgesteld met dagen waarover loon is ontvangen.

      2 Het eerste lid is niet van toepassing indien de in onderdeel b van dat lid bedoelde
      vakantiebonnen of daarmee overeenkomende aanspraken bestemd zijn voor dagen, waarover
      recht op uitkering op grond van [hoofdstuk II van de Werkloosheidswet][ref3] dan wel
      [hoofdstuk 7 van de Wet werk en inkomen naar arbeidsvermogen][ref4] bestaat of over dagen, waarin dat recht wegens
      vakantie of het in aanmerking nemen van deze aanspraken wordt onderbroken.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0004045#HoofdstukII
      [ref4]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk7
