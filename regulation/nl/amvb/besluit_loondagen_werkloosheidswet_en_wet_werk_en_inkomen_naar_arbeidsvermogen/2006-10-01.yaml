        artikel: '15'
  - number: '3'
    text: |-
      1 Voor de toepassing van [artikel 42, tweede lid, onderdeel a, van de Werkloosheidswet][ref1] wordt de persoon,
      die is toegelaten tot de vrijwillige verzekering op grond van [die wet][ref2], geacht loon te hebben ontvangen over
      tijdvakken waarover premie is betaald.

      2 Voor de toepassing van
      [artikel 15, eerste lid, aanhef en onderdeel a, van de Wet werk en inkomen naar arbeidsvermogen][ref3] wordt
      de persoon die is toegelaten tot de vrijwillige verzekering op grond van [die wet][ref4], geacht loon te hebben
      ontvangen over tijdvakken waarover premie is betaald.

      3 Voor de toepassing van
      [artikel 15, eerste lid, aanhef en onderdeel a, van de Wet werk en inkomen naar arbeidsvermogen][ref5]
      wordt de persoon die was toegelaten tot de vrijwillige verzekering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref6], zoals deze wet luidde op de dag voorafgaand aan de dag waarop
      [artikel 15 van de Wet werk en inkomen naar arbeidsvermogen][ref7] in werking is getreden, geacht loon te hebben
      ontvangen over tijdvakken waarover premie is betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel42
