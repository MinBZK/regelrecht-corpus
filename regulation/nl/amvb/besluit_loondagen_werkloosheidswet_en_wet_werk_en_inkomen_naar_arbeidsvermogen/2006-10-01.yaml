  - number: '2'
    text: |-
      Voor de toepassing van [artikel 42, tweede lid, onderdeel a, van de Werkloosheidswet][ref1] en
      [artikel 15, eerste lid, aanhef en onderdeel a, van de Wet werk en inkomen naar arbeidsvermogen][ref2] worden dagen
      waarover een werknemer geen loon heeft ontvangen wegens werkstaking of uitsluiting gelijkgesteld met dagen waarover
      loon is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel15
    url: https://wetten.overheid.nl/BWBR0005199/2006-10-01#Artikel2
