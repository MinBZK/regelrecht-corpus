preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 2 mei 1991, Directoraat-Generaal
    Sociale Zekerheid, nr. SZ/SVW/2171;

    Gelet op artikel 42, tiende lid, onderdeel a, van de Werkloosheidswet (Stb. 1987, 93);

    De Raad van State gehoord (advies van 27 augustus 1991, nr. W.12.91.0263);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 4 september 1991,
    Directoraat-Generaal Sociale Zekerheid nr. SZ/HSV/WR/SVW/91/4283;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005199/1997-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Voor de toepassing van [artikel 17, onderdeel ][ref1] (*Stb.* 1987, 93) worden dagen, waarover de werknemer:

      a. van zijn werkgever geen loon doch vakantiegeld heeft ontvangen; of

      b. tijdens dienstbetrekking vakantiebonnen of daarmee overeenkomende aanspraken bestemd voor die dagen heeft
      verkregen,

      gelijkgesteld met dagen waarover loon is ontvangen.

      2 Het eerste lid is niet van toepassing indien de in onderdeel *b* van dat lid bedoelde vakantiebonnen of daarmee
      overeenkomende aanspraken bestemd zijn voor dagen, waarover recht op uitkering op grond van [hoofdstuk II]
      (onbekend) of [II](onbekend) bestaat of over dagen, waarin dat recht wegens vakantie of het in aanmerking nemen van
      deze aanspraken wordt onderbroken.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel17
    url: https://wetten.overheid.nl/BWBR0005199/1997-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '17'
  - number: '2'
    text: |-
      Voor de toepassing van [artikel 17, onderdeel ][ref1] worden dagen waarover een werknemer geen loon heeft ontvangen
      wegens werkstaking of uitsluiting gelijkgesteld met dagen waarover loon is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel17
    url: https://wetten.overheid.nl/BWBR0005199/1997-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '17'
  - number: '3'
    text: |-
      Voor de toepassing van [artikel 17, onderdeel ][ref1] wordt de persoon, die is toegelaten tot de vrijwillige
      verzekering op grond van die wet, geacht loon te hebben ontvangen over tijdvakken waarover premie is betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel17
    url: https://wetten.overheid.nl/BWBR0005199/1997-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '17'
  - number: '4'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het is
      geplaatst en werkt terug tot en met 1 januari 1991.
    url: https://wetten.overheid.nl/BWBR0005199/1997-01-01#Artikel4
  - number: '5'
    text: Dit besluit kan worden aangehaald onder de titel "Besluit gelijkstelling loondagen Werkloosheidswet".
    url: https://wetten.overheid.nl/BWBR0005199/1997-01-01#Artikel5
