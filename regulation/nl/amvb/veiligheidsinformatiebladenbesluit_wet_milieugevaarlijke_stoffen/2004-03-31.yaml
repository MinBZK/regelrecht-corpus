        artikel: '2'
      - id: ref3
        bwb_id: BWBR0005974
        artikel: '2'
  - number: '5'
    text: |-
      In gevallen waarin een stof of preparaat niet alleen aan beroepsmatige gebruikers, maar ook aan particulieren ter
      beschikking wordt gesteld en de krachtens de artikelen 34 tot en met 39 van de wet op de verpakking van de stof
      of het preparaat aangebrachte aanduidingen zodanige informatie bevatten dat de beroepsmatige gebruiker op basis
      daarvan doeltreffende arbeidsbeschermende maatregelen kan nemen, behoeft een veiligheidsinformatieblad alleen te
      worden verstrekt indien de beroepsmatige gebruiker dit verzoekt.
    url: https://wetten.overheid.nl/BWBR0005974/2004-03-31#Artikel5
  - number: 5a
    text: |-
      Degene die een preparaat in de handel brengt waarvoor met toepassing van
      [artikel 2, eerste tot en met derde lid][ref1], een veiligheidsinformatieblad wordt opgesteld, bewaart de gegevens
      die zijn gebruikt voor het maken van dat veiligheidsinformatieblad.


      [ref1]: https://wetten.overheid.nl/BWBR0005974#Artikel2
    url: https://wetten.overheid.nl/BWBR0005974/2004-03-31#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0005974
        artikel: '2'
  - number: '6'
    text: |-
      Dit besluit is niet van toepassing op:

      a. cosmetica als bedoeld in het [Cosmeticabesluit (Warenwet)](onbekend);

      b. stoffen en preparaten in de vorm van afvalstoffen waarop [richtlijn nr. 75/442/EEG](31975L0442) van de Raad
      van de Europese Gemeenschappen van 15 juli 1975 betreffende afvalstoffen (*PbEG* L 194) of [richtlijn nr. 78/319/
      EEG](31978L0319) van de Raad van de Europese Gemeenschappen van 20 maart 1978 betreffende toxische en gevaarlijke
      afvalstoffen (*PbEG* L 84) van toepassing zijn;

      c. munitie en springstoffen die in de handel worden gebracht om door explosie of door een pyrotechnisch effect een
      beoogde uitwerking hebben;

      d. stoffen en preparaten in douanevervoer, die onder toezicht staan van de douane en niet worden bewerkt of
      verwerkt;

      e. radioactieve stoffen als bedoeld in [richtlijn nr. 80/836/EEG](31980L0836) van de Raad van de Europese
      Gemeenschappen van 15 juli 1980, houdende wijziging van de richtlijn tot vaststelling van de basisnormen voor de
      bescherming van de gezondheid der bevolking en der werkers tegen de aan ioniserende straling verbonden gevaren
      (*PbEG* L 246);

      f. geneesmiddelen als bedoeld in de [Wet op de geneesmiddelenvoorziening][ref1];

      g. diergeneesmiddelen als bedoeld in de [Diergeneesmiddelenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002290
      [ref2]: https://wetten.overheid.nl/BWBR0003818
    url: https://wetten.overheid.nl/BWBR0005974/2004-03-31#Artikel6
