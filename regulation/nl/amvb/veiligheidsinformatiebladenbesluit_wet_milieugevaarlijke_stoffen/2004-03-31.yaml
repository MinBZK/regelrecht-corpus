  - number: '3'
    text: |-
      1 Onverminderd het bepaalde in [artikel 2][ref1], voldoet de inhoud van een veiligheidsinformatieblad aan hetgeen
      daaromtrent is bepaald in de bijlage van de [richtlijn 91/155/EEG](31991L0155).

      2 Indien de bijlage van de [richtlijn 91/155/EEG](31991L0155) wordt gewijzigd doet de Minister van Sociale Zaken
      en Werkgelegenheid daarvan mededeling in de *Staatscourant*; hij vermeldt daarbij met ingang van welke datum de
      wijziging moet worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0005974#Artikel2
    url: https://wetten.overheid.nl/BWBR0005974/2004-03-31#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005974
        artikel: '2'
  - number: '4'
    text: |-
      1 Een veiligheidsinformatieblad als bedoeld in [artikel 2, eerste lid][ref1], wordt aan de beroepsmatige gebruiker
      verstrekt op of voorafgaand aan het moment waarop de stof of het preparaat voor de eerste maal aan hem ter
      beschikking wordt gesteld.

      2 Indien zich één of meer voor de veiligheid of de gezondheid van werknemers dan wel voor
      het milieu relevante veranderingen voordoen in de in het veiligheidsinformatieblad, bedoeld
      [artikel 2, eerste tot en met derde lid][ref2], opgenomen gegevens, wordt het veiligheidsinformatieblad daaraan
      aangepast.

      3 Het in het tweede lid bedoelde veiligheidsinformatieblad wordt voorzien van de vermelding "herziening van",
      gevolgd door de vermelding van de datum van de herziening.

      4 Vanaf de datum van de herziening wordt aan die beroepsmatige gebruikers aan wie de stof of het preparaat voor de
      eerste maal sinds de herziening ter beschikking wordt gesteld, het nieuwe veiligheidsinformatieblad verstrekt. Het
      nieuwe veiligheidsinformatieblad wordt eveneens verstrekt aan die beroepsmatige gebruikers aan wie in de 12 maanden
      voorafgaand aan de datum van de herziening de stof of het preparaat ter beschikking is gesteld.

      5 Een veiligheidsinformatieblad als bedoeld in [artikel 2, eerste tot en met derde lid][ref3], wordt aan de
      beroepsmatige gebruiker schriftelijk of op elektronische wijze verstrekt. Elektronische verstrekking vindt alleen
      plaats indien de geadresseerde over de benodigde middelen beschikt om het veiligheidsinformatieblad in ontvangst
      te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0005974#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005974#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005974#Artikel2
    url: https://wetten.overheid.nl/BWBR0005974/2004-03-31#Artikel4
    references:
