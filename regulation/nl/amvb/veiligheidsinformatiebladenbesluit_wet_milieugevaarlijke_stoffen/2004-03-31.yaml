    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 4 februari 1993, Directoraat-Generaal
    van de Arbeid, Afdeling Wetgeving en Juridische Zaken, nr. DGA/AIB/WJZ/93/00543A;

    Gelet op de richtlijn nr. 91/155/EEG van de Commissie van de Europese Gemeenschappen van 5 maart 1991 houdende
    beschrijving en vaststelling van de wijze van uitvoering voor het systeem voor specifieke informatie inzake
    gevaarlijke preparaten krachtens artikel 10 van richtlijn 88/379/EEG van de Raad (PbEG L 76) en op artikel 27
    van de richtlijn nr. 92/32/EEG van de Raad van de Europese Gemeenschappen van 30 april 1992 tot zevende wijziging
    van richtlijn 67/548/EEG betreffende de aanpassing van de wettelijke en bestuursrechtelijke bepalingen inzake de
    indeling, de verpakking en het kenmerken van gevaarlijke stoffen (PbEG L 154), alsmede op artikel 24 van de Wet
    milieugevaarlijke stoffen;

    De Raad van State gehoord (advies van 30 maart 1993, nr. W12.93.0078);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid van 22 april 1993, Directoraat-
    Generaal van de Arbeid, Afdeling Wetgeving en Juridische Zaken, nr. DGA/AIB/WJZ/93/04097A;

    Hebben goedgevonden en verstaan:
