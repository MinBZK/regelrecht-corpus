articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. de wet: de [Wet milieugevaarlijke stoffen][ref1];

      b. [richtlijn 91/155/EEG](31991L0155): [richtlijn nr. 91/155/EEG](31991L0155) van de Commissie van de Europese
      Gemeenschappen van 5 maart 1991 (PbEG L 76) houdende beschrijving en vaststelling van de wijze van uitvoering
      van het systeem voor specifieke informatie inzake gevaarlijke preparaten krachtens artikel 14 van [richtlijn
      nr. 1999/45/EG](31999L0045) van het Europees Parlement en de Raad van de Europese Unie en inzake gevaarlijke
      stoffen krachtens artikel 27 van [richtlijn nr. 67/548/EEG](31967L0548) van de Raad van de Europese Gemeenschappen
      (veiligheidsinformatiebladen);

      c. [richtlijn 98/24/EG](31998L0024): [richtlijn nr. 98/24/EG](31998L0024) van de Raad van de Europese Unie van
      7 april 1998 (PbEG L 131) betreffende de bescherming van de gezondheid en de veiligheid van werknemers tegen
      risico's van chemische agentia op het werk (veertiende bijzondere richtlijn in de zin van artikel 16, lid 1, van
      [richtlijn nr. 89/391/EEG](31989L0391)).


      [ref1]: https://wetten.overheid.nl/BWBR0003892
    url: https://wetten.overheid.nl/BWBR0005974/2004-03-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003892
  - number: '2'
    text: |-
      1 Degene die een stof of preparaat, behorende tot een categorie als bedoeld in
      [artikel 34, tweede lid, van de wet][ref1], aan een ander voor beroepsmatig gebruik ter beschikking stelt,
      verstrekt aan die ander kosteloos een deugdelijk veiligheidsinformatieblad dat hem in staat stelt om de nodige
      maatregelen te treffen ter bescherming van de gezondheid, de veiligheid en het milieu op het werk.

      2 Onverminderd het eerste lid, verstrekt degene die een niet-gasvormig preparaat aan een ander voor beroepsmatig
      gebruik ter beschikking stelt, aan die ander op diens verzoek kosteloos een deugdelijk veiligheidsinformatieblad
      dat hem in staat stelt om de nodige maatregelen te treffen ter bescherming van de gezondheid, de veiligheid en
      het milieu op het werk, indien dat preparaat een stof bevat die in een afzonderlijke concentratie groter is dan of
      gelijk is aan 1 gewichtspercent en:

        - die stof behoort tot een categorie als bedoeld in [artikel 34, tweede lid, onder f tot en met o van de wet][ref2],
      of
        - voor die stof op grond van artikel 3 van [richtlijn 98/24/EG](31998L0024) een grenswaarde voor beroepsmatige
      blootstelling of een biologische grenswaarde is vastgesteld.

      3 Het tweede lid is van overeenkomstige toepassing op een gasvormig preparaat dat een in dat lid bedoelde stof
      bevat, welke stof in een afzonderlijke concentratie gelijk is aan of groter is dan 0,2 volumepercent.

      4 Het veiligheidsinformatieblad bevat adequate gegevens omtrent:

      a. de identiteit van de stof of het preparaat;

      b. de aan de stof of het preparaat verbonden gevaren voor de veiligheid en de gezondheid van de betrokken
      werknemers;

      c. de aan de stof of het preparaat verbonden gevaren voor het milieu;

      d. de wijze waarop de in de onderdelen *b* en *c* genoemde gevaren zoveel mogelijk kunnen worden voorkomen of
      beperkt.

      5 Het veiligheidsinformatieblad omvat de navolgende rubrieken;

      a. identificatie van de stof of het preparaat en de vennootschap of onderneming;

      b. samenstelling van en informatie over de bestanddelen;

      c. identificatie van de gevaren;

      d. eerste-hulp-maatregelen;

      e. brandbestrijdingsmaatregelen;

      f. maatregelen bij het accidenteel vrijkomen van de stof of het preparaat;

      g. hanteren en opslag;

      h. maatregelen ter beheersing van blootstelling en persoonlijke bescherming;

      i. fysische en chemische eigenschappen;

      j. stabiliteit en reactiviteit;

      k. toxicologische informatie;

      l. milieu-informatie;

      m. instructies voor verwijdering;

      n. informatie met betrekking tot het vervoer;

      o. wettelijk verplichte informatie;

      p. overige informatie.

      6 Het veiligheidsinformatieblad is gedateerd en de daarin opgenomen gegevens zijn duidelijk leesbaar en gesteld in
      de Nederlandse taal. Indien de stof of het preparaat bestemd is om te worden gebruikt in een laboratorium en tevens
      de nominale inhoud van de verpakking niet meer bedraagt dan één liter, mag het veiligheidsinformatieblad in plaats
      van in de Nederlandse taal ook in de Franse, Duitse of Engelse taal worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel34
    url: https://wetten.overheid.nl/BWBR0005974/2004-03-31#Artikel2
    references:
