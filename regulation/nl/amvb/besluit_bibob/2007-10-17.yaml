preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 1 oktober 2002, nr.
    EA2002/88934, directoraat-generaal Openbare Orde en Veiligheid, mede namens Onze Minister van Justitie, in
    overeenstemming met Onze Minister van Verkeer en Waterstaat;

    Gelet op de artikelen 1, tweede lid, 5, tweede lid, 7, tweede lid, 16, tweede lid, 27, eerste lid, onderdeel i, en
    vijfde lid, en 46 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur;

    De Raad van State gehoord (advies van 28 november 2002, nr. W04.02.0448/I);

    Gezien het nader rapport van Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van Justitie van 27
    maart, nr EA2003/55758, directoraat-generaal Openbare Orde en Veiligheid, uitgebracht in overeenstemming met Onze
    Minister van Verkeer en Waterstaat;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0014964/2007-10-17#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder «wet»: de
      [Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798
    url: https://wetten.overheid.nl/BWBR0014964/2007-10-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013798
  - number: '2'
    text: |-
      Als aanbestedende dienst als bedoeld in [artikel 1, tweede lid, van de wet][ref1], worden aangewezen de
      zelfstandige bestuursorganen van de in de bijlage bij dit besluit genoemde rechtspersonen.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel1
    url: https://wetten.overheid.nl/BWBR0014964/2007-10-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '1'
  - number: '3'
    text: |-
      Als sectoren als bedoeld in [artikel 5, tweede lid, van de wet][ref1], worden aangewezen:

      a. de bouw,

      b. de informatie- en communicatietechnologie, en

      c. het milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel5
    url: https://wetten.overheid.nl/BWBR0014964/2007-10-17#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '5'
  - number: '4'
    text: |-
      Als inrichtingen als bedoeld in [artikel 7, tweede lid, van de wet][ref1], worden aangewezen:

      a. inrichtingen waarin bedrijfsmatig, in een omvang alsof zij bedrijfsmatig was of anders dan om niet, logies wordt
      verstrekt, dranken worden geschonken, of rookwaren of spijzen voor directe consumptie worden verstrekt,

      b. voor het publiek toegankelijke, besloten ruimten waarin bedrijfsmatig, in een omvang alsof zij bedrijfsmatig was
      of anders dan om niet seksuele handelingen worden verricht, seksuele diensten worden aangeboden of vertoningen van
      erotisch-pornografische aard plaatsvinden,

      c. een natuurlijke persoon, een groep van natuurlijke personen of een rechtspersoon die bedrijfsmatig, in een
      omvang alsof zij bedrijfsmatig was of anders dan om niet seksuele handelingen verricht of seksuele diensten
      aanbiedt in een andere ruimte dan de bedrijfsruimte,

      d. inrichtingen die in het maatschappelijk verkeer worden aangeduid als smartshops of growshops, en

      e. inrichtingen die zijn bestemd om het publiek de gelegenheid te geven een spel door middel van speelautomaten te
      beoefenen als bedoeld in [artikel 30c, eerste lid, onderdeel c, van de Wet op de kansspelen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel30c
    url: https://wetten.overheid.nl/BWBR0014964/2007-10-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 30c
  - number: '5'
    text: |-
      Het Bureau stelt jaarlijks de bijdrage in de kosten van het advies, bedoeld in [artikel 16 van de wet][ref1], vast
      aan de hand van:

      a. de werkelijk gemaakte kosten die het Bureau voor de behandeling van de aanvraag heeft moeten maken,

      b. het aantal aanvragen dat in het afgelopen kalenderjaar is ingediend,

      c. het verwachte totale aantal aanvragen dat in het lopende kalenderjaar zal worden ingediend,

      d. het verwachte aantal aanvragen dat in het eerstvolgende kalenderjaar zal worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel16
    url: https://wetten.overheid.nl/BWBR0014964/2007-10-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '16'
  - number: '6'
    text: |-
      Als bestuursorganen als bedoeld in [artikel 27, eerste lid, onderdeel i, van de wet][ref1], worden aangewezen:

      a. Onze Minister van Justitie, voor zover het bestanden betreft waarvan de gegevens worden verwerkt door het
      Centraal Justitieel Incasso Bureau;

      b. Onze Minister van Verkeer en Waterstaat, voor zover het bestanden betreft waarvan de gegevens worden verwerkt
      door de Inspectie Verkeer en Waterstaat, divisie Vervoer;

      c. de Inspectie Verkeer en Waterstaat, divisie Vervoer;

      d. de Dienst Wegverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel27
    url: https://wetten.overheid.nl/BWBR0014964/2007-10-17#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '27'
  - number: '7'
    text: |-
      1 De bestuursorganen, genoemd in [artikel 6][ref1], en de bestuursorganen, genoemd in
      [artikel 27, eerste lid, van de wet][ref2], verstrekken de gegevens, bedoeld in de aanhef van
      [artikel 27, eerste lid, van de wet][ref3], binnen twee weken nadat het Bureau om verstrekking heeft gevraagd.

      2 Indien de gegevens niet binnen twee weken kunnen worden verstrekt, stelt het desbetreffende bestuursorgaan het
      Bureau daarvan in kennis en noemt het daarbij een termijn waarbinnen de gegevens wel tegemoet kunnen worden gezien.
      Deze termijn bedraagt niet meer dan twee weken na afloop van de termijn, genoemd in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0014964#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0013798#Artikel27
