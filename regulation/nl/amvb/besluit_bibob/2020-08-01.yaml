  - number: '8'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst, met uitzondering van [artikel 6, onderdelen b. en c.][ref1], dat in werking treedt op een bij koninklijk
      besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0014964#Artikel6
    url: https://wetten.overheid.nl/BWBR0014964/2020-08-01#Artikel8
