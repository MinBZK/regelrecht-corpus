preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 1 oktober 2002, nr.
    EA2002/88934, directoraat-generaal Openbare Orde en Veiligheid, mede namens Onze Minister van Justitie, in
    overeenstemming met Onze Minister van Verkeer en Waterstaat;


    Gelet op de artikelen 1, tweede lid, 5, tweede lid, 7, tweede lid, 16, tweede lid, 27, eerste lid, onderdeel i, en
    vijfde lid, en 46 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur;


    De Raad van State gehoord (advies van 28 november 2002, nr. W04.02.0448/I);


    Gezien het nader rapport van Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van Justitie van 27
    maart, nr EA2003/55758, directoraat-generaal Openbare Orde en Veiligheid, uitgebracht in overeenstemming met Onze
    Minister van Verkeer en Waterstaat;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0014964/2020-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder «wet»: de
      [Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798
    url: https://wetten.overheid.nl/BWBR0014964/2020-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013798
  - number: '2'
    text: |-
      Als rechtspersoon met een overheidstaak als bedoeld in [artikel 1, tweede lid, van de wet][ref1], worden aangewezen
      de zelfstandige bestuursorganen van de in de bijlage bij dit besluit genoemde rechtspersonen.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel1
    url: https://wetten.overheid.nl/BWBR0014964/2020-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '1'
  - number: '5'
    text: |-
      Het Bureau stelt jaarlijks de bijdrage in de kosten van het advies, bedoeld in [artikel 16 van de wet][ref1], vast
      aan de hand van:

      a. de werkelijk gemaakte kosten die het Bureau voor de behandeling van de aanvraag heeft moeten maken,

      b. het aantal aanvragen dat in het afgelopen kalenderjaar is ingediend,

      c. het verwachte totale aantal aanvragen dat in het lopende kalenderjaar zal worden ingediend,

      d. het verwachte aantal aanvragen dat in het eerstvolgende kalenderjaar zal worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel16
    url: https://wetten.overheid.nl/BWBR0014964/2020-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '16'
  - number: '6'
    text: |-
      Als bestuursorganen als bedoeld in [artikel 27, eerste lid, onderdeel i, van de wet][ref1], worden aangewezen:

      a. Onze Minister van Veiligheid en Justitie, voor zover het bestanden betreft waarvan de gegevens worden verwerkt
      door het Centraal Justitieel Incasso Bureau;

      b. Onze Minister van Infrastructuur en Milieu, voor zover het bestanden betreft waarvan de gegevens worden verwerkt
      door de Inspectie Leefomgeving en Transport, domeinen Transport;

      c. de Inspectie Leefomgeving en Transport, domeinen Transport;

      d. de Dienst Wegverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel27
    url: https://wetten.overheid.nl/BWBR0014964/2020-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '27'
  - number: '7'
    text: |-
      1 De bestuursorganen, genoemd in [artikel 6][ref1], en de bestuursorganen, genoemd in
      [artikel 27, eerste lid, van de wet][ref2], alsmede de gerechten bedoeld in [artikel 27a van de wet][ref3],
      verstrekken de gegevens, bedoeld in de aanhef van [artikel 27, eerste lid, van de wet][ref4], binnen twee weken
      nadat het Bureau om verstrekking heeft gevraagd.

      2 Indien de gegevens niet binnen twee weken kunnen worden verstrekt, stelt het desbetreffende bestuursorgaan het
      Bureau daarvan in kennis en noemt het daarbij een termijn waarbinnen de gegevens wel tegemoet kunnen worden gezien.
      Deze termijn bedraagt niet meer dan twee weken na afloop van de termijn, genoemd in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0014964#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0013798#Artikel27a
      [ref4]: https://wetten.overheid.nl/BWBR0013798#Artikel27
    url: https://wetten.overheid.nl/BWBR0014964/2020-08-01#Artikel7
