        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0031560
        artikel: '4'
        hoofdstuk: '2'
  - number: 5.1.b
    text: |-
      die een bevoegde autoriteit heeft ontvangen op grond van een melding als bedoeld in
      [artikel 12a van de wet Voorkoming verontreiniging door schepen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel12a
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: 12a
  - number: 5.1.c
    text: |-
      die een bevoegde autoriteit heeft ontvangen op grond van een melding
      als bedoeld in [artikel 9.07 van het Binnenvaartpolitiereglement][ref1],
      [artikel 12.01 van het Rijnvaartpolitiereglement 1995][ref2],
      [artikel 51, eerste en tweede lid, van het Scheepvaartreglement Westerschelde 1990][ref3], of
      [artikel 29 van het Scheepvaartreglement Eemsmonding][ref4] en de gegevens die hij heeft ontvangen bij of krachtens
      verdrag of [artikel 4 van de Scheepvaartverkeerswet][ref5] of van een aan boord van een schip aanwezig AIS;


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006923#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0005393#Artikel51
      [ref4]: https://wetten.overheid.nl/BWBR0004552#Artikel29
      [ref5]: https://wetten.overheid.nl/BWBR0004364#Artikel4
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel5
    references:
