preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Infrastructuur en Milieu van 6 maart 2012, nr. IenM/BSK-2012/20694,
    Hoofddirectie Bestuurlijke en Juridische Zaken;

    Gelet op Richtlijn 2010/65/EU van het Europees Parlement en de Raad van 20 oktober 2010 betreffende
    meldingsformaliteiten voor schepen die aankomen in en/of vertrekken uit havens van de lidstaten en tot intrekking
    van Richtlijn 2002/6/EG (PbEU 2010, L 283), Hoofdstuk V, Voorschrift 19-1, van het op 1 november 1974 te Londen tot
    stand gekomen Verdrag voor de beveiliging van mensenlevens op zee (Trb. 1976, 157), en de bij dat verdrag behorende
    bindende protocollen, aanhangsels en bijlagen (SOLAS-verdrag), Richtlijn 2002/59/EG van het Europees Parlement
    en de Raad van 27 juni 2002 betreffende de invoering van een communautair monitoring- en informatiesysteem voor
    de zeescheepvaart en tot het intrekken van Richtlijn 93/75/EEG van de Raad (PbEG 2002, L 131), Verordening (EG)
    nr. 725/2004 van het Europees Parlement en de Raad van 31 maart 2004 betreffende de verbetering van de beveiliging
    van schepen en havenfaciliteiten (PbEU 2004, L 129), Richtlijn 2005/44/EG van het Europees Parlement en de Raad
    van 7 september 2005 betreffende geharmoniseerde River Information Services (RIS) op de binnenwateren in de
    Gemeenschap (PbEU 2005, L 255), Richtlijn 2009/16/EG van het Europees Parlement en de Raad van 23 april 2009
    betreffende havenstaatcontrole (Herschikking) (PbEU 2009, L 131), en de artikelen 8 van de Binnenvaartwet, 15
    van de Havenbeveiligingswet, 3, 4, 20 en 31, elfde lid, van de Scheepvaartverkeerswet en 38 van de Wet voorkoming
    verontreiniging door schepen;

    De Afdeling advisering van de Raad van State gehoord (advies van 6 april 2012, nr. W14.12.0069/IV);

    Gezien het nader rapport van Onze Minister van Infrastructuur en Milieu van 27 april 2012, nr. IenM/BSK-2012/60139,
    Hoofddirectie Bestuurlijke en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen, met uitzondering van [hoofdstuk 6][ref1], wordt verstaan onder:
        - *AIS:* op een schip geïnstalleerd automatisch identificatiesysteem als bedoeld in de artikelen 6 en 6bis van de
      richtlijn monitoring- en informatiesysteem zeescheepvaart of tracking- en tracingsysteem als bedoeld in artikel 5
      van de richtlijn River Information Services;
        - *ISM-Code:* International Safety Management Code voor de veilige exploitatie van schepen en voor preventie van
      verontreiniging, welke door de algemene vergadering van de Internationale Maritieme Organisatie is goedgekeurd bij
      resolutie A.741 (18) van 4 november 1993;
        - *NCA-SafeSeaNet:* degene die als nationaal bevoegde autoriteit belast is met de taken genoemd in bijlage III,
      onder 2, van de richtlijn monitoring- en informatiesysteem zeescheepvaart;
        - *bevoegde autoriteit*: autoriteit die op grond van dit besluit meldingen van schepen ontvangt: a. ten aanzien
      van gegevens van een zeeschip, niet zijnde gegevens over opvarenden aan boord van een passagiersschip als bedoeld
      in artikel 3 van de richtlijn registratie opvarenden van passagiersschepen: 1°. voor zover het schip een haven of
      een ankerplaats aan de Rijkswateren aandoet: de personen die als zodanig bij ministeriële regeling zijn aangewezen
      door Onze Minister; 2°. voor zover het schip een in de Nederlandse territoriale zee gelegen laad- of losinrichting
      aandoet: de personen die als zodanig bij ministeriële regeling zijn aangewezen door Onze Minister; 3°. voor zover
      het schip een haven aan of een ankerplaats in de wateren in beheer bij een ander openbaar lichaam aandoet: het
      bestuur van dat openbaar lichaam, dan wel de personen die als zodanig door het bestuur zijn aangewezen; 4°. voor
      zover gegevens als bedoeld in [artikel 12a van de Wet voorkoming verontreiniging door schepen][ref2] betreft: de
      havenbeheerder. b. ten aanzien van gegevens van schepen in binnenwateren: 1°. voor de wateren in beheer bij het
      Rijk: de personen die als zodanig bij ministeriële regeling zijn aangewezen door Onze Minister; 2°. voor de wateren
      in beheer bij een ander openbaar lichaam: het bestuur van dat openbaar lichaam, dan wel de personen die als zodanig
      door het bestuur zijn aangewezen. c. ten aanzien van gegevens over de opvarenden aan boord van een passagiersschip
      als bedoeld in artikel 3 van de richtlijn registratie opvarenden van passagiersschepen: de directeur Kustwacht
      Nederland, dan wel de personen die als zodanig bij ministeriële regeling zijn aangewezen door Onze Minister;
        - *passagiersregistratiebeambte:* in voorkomend geval, de verantwoordelijke persoon die door een maatschappij is
      aangewezen om aan de verplichtingen van de ISM-code te voldoen, dan wel een persoon die door een maatschappij is
      aangewezen als verantwoordelijke voor de overdracht van de gegevens van personen die aan boord zijn gegaan van een
      passagiersschip van de maatschappij;
        - *plaatselijk bevoegde autoriteit:* autoriteit die namens één of meer bevoegde autoriteiten verantwoordelijk
      is voor het bieden van technische faciliteiten voor het ontvangen van meldingen die bestemd zijn voor bevoegde
      autoriteiten en het elektronisch doorgeven van de meldingen aan SafeSeaNet;
        - *richtlijn meldingsformaliteiten:* [Richtlijn 2010/65](32010L0065)/EU van het Europees Parlement en de Raad van
      20 oktober 2010 betreffende meldingsformaliteiten voor schepen die aankomen in en/of vertrekken uit havens van de
      lidstaten en tot intrekking van [Richtlijn 2002/6/EG](32002L0006) (PbEU 2010, L 283);
        - *richtlijn monitoring- en informatiesysteem zeescheepvaart:* [Richtlijn 2002/59/EG](32002L0059) van het
      Europees Parlement en de Raad van de Europese Unie van 27 juni 2002 betreffende de invoering van een communautair
      monitoring- en informatiesysteem voor de zeescheepvaart en tot het intrekken van [Richtlijn 93/75/EEG](31993L0075)
      van de Raad (PbEG 2002, L 131);
        - *richtlijn registratie opvarenden van passagiersschepen:* [Richtlijn 98/41/EG](31998L0041) van de Raad van
      18 juni 1998 inzake de registratie van opvarenden van passagiersschepen die vanuit of naar havens in de lidstaten
      van de Gemeenschap varen (PbEU 1998, L 188);
        - *richtlijn River Information Services:* [Richtlijn 2005/44/EG](32005L0044) van het Europees Parlement en de
      Raad van 7 september 2005 betreffende geharmoniseerde River Information Services (RIS) op de binnenwateren in de
      Gemeenschap (PbEU 2005, L 255);
        - *RIS:* River Information Services als bedoeld in [artikel 1 van de Scheepvaartverkeerswet][ref3];
        - *RIS-autoriteit:* de bevoegde instantie voor de RIS-toepassing en voor de internationale uitwisseling van
      gegevens, bedoeld in artikel 8 van de richtlijn River Information Services;
        - *SafeSeaNet:* het communautaire systeem voor de uitwisseling van maritieme informatie, bedoeld in de richtlijn
      monitoring- en informatiesysteem zeescheepvaart;
        - *Uniek Europees scheepsidentificatienummer:* nummer als bedoeld in artikel 2.18 van bijlage II van [Richtlijn
      2006/87/EG](32006L0087) van het Europees Parlement en de Raad van 12 december 2006 tot vaststelling van de
      technische voorschriften voor binnenschepen en tot intrekking van [Richtlijn 82/714/EEG](31982L0714) van de Raad
      (PbEU 2006, L 389);
        - *verordening scheeps- en havenbeveiliging:* Verordening (EG) nr. 725/2004 van het Europees Parlement en de
      Raad van 31 maart 2004 betreffende de verbetering van de beveiliging van schepen en havenfaciliteiten (PbEU 2004,
      L 129).


      [ref1]: https://wetten.overheid.nl/BWBR0031560#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0003642#Artikel12a
      [ref3]: https://wetten.overheid.nl/BWBR0004364#Artikel1
