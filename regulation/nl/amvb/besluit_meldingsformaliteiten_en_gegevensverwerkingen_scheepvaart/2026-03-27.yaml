  - number: '1.2'
    text: |-
      In [hoofdstuk 6][ref1] en de daarop berustende bepalingen, wordt verstaan onder: - *applicatie-serviceprovider:*
      serviceprovider, die de van een meldplichtig zeeschip ontvangen meldplichtige gegevens doorzendt naar het LRIT-
      datacentrum;
        - *LRIT:* long range identification and tracking systeem als bedoeld in Hoofdstuk V, Voorschrift 19-1,
      onderdeel 4.1, van het SOLAS-verdrag;
        - *LRIT-datacentrum:* datacentrum waarin meldplichtige gegevens worden opgeslagen;
        - *meldplichtige gegevens:* gegevens, bedoeld in Hoofdstuk V, Voorschrift 19-1, onderdeel 5, van het SOLAS-verdrag;
        - *SOLAS-verdrag:* het op 1 november 1974 te Londen tot stand gekomen Verdrag voor de beveiliging van mensenlevens
      op zee (Trb. 1976, 157), en de bij dat verdrag behorende bindende protocollen, aanhangsels en bijlagen.


      [ref1]: https://wetten.overheid.nl/BWBR0031560#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0031560
        hoofdstuk: '6'
  - number: 1a
    text: |-
      Dit besluit berust mede op [artikel 4a van de Scheepvaartverkeerswet][ref1] en
      [artikel 12aa van de Wet voorkoming verontreiniging door schepen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0003642#Artikel12aa
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: 4a
      - id: ref2
        bwb_id: BWBR0003642
        artikel: 12aa
  - number: '2.1'
    text: |-
      De kapitein, de exploitant of de agent van een zeeschip dat behoort tot een bij ministeriële regeling vast te
      stellen categorie van zeeschepen en dat op weg is van of naar een in Nederland gelegen haven, ankerplaats of een in
      de Nederlandse territoriale zee gelegen ankerplaats of laad- of losinrichting, meldt de bevoegde autoriteit de bij
      ministeriële regeling te bepalen gegevens omtrent de aankomst, het vertrek en de positie van het schip, de gegevens
      met betrekking tot het schip, de daarmee vervoerde lading en de uit te voeren reis.
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel2
  - number: '2.2'
    text: 'Bij ministeriële regeling worden nadere regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel2
  - number: 2.2.a
    text: de gevallen waarin en de voorwaarden waaronder vrijstelling of ontheffing van deze meldplicht mogelijk is, en
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel2
  - number: 2.2.b
    text: de wijze waarop en het moment waarop de melding plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel2
  - number: '3'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld omtrent de door een kapitein, exploitant of agent van
      een zeeschip aan de bevoegde autoriteit te verschaffen inlichtingen als bedoeld in artikel 6 van de verordening
      scheeps- en havenbeveiliging.
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel3
  - number: 3a.1
    text: |-
      De kapitein, de exploitant of de agent van een passagiersschip als bedoeld in artikel 3, eerste lid, van de
      richtlijn registratie opvarenden van passagiersschepen meldt de bij ministeriële regeling vast te stellen gegevens
      omtrent de opvarenden aan de bevoegde autoriteit.
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel3a
  - number: 3a.2
    text: 'Bij ministeriële regeling kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel3a
  - number: 3a.2.a
    text: de gevallen waarin een melding als bedoeld in het eerste lid moet plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel3a
  - number: 3a.2.b
    text: de gevallen waarin en de voorwaarden waaronder vrijstelling of ontheffing van deze meldplicht mogelijk is, en
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel3a
  - number: 3a.2.c
    text: de wijze waarop en het moment waarop de melding plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel3a
  - number: 3a.3
    text: |-
      Een verstrekker van gegevens als bedoeld in het eerste lid, bewaart de gegevens niet langer dan de termijn
      opgenomen in artikel 8, tweede lid, van de richtlijn registratie opvarenden van passagiersschepen.
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel3a
  - number: 3b
    text: |-
      De kapitein, de exploitant of de agent van een passagiersschip als bedoeld in artikel 3, eerste lid, van de
      richtlijn registratie opvarenden van passagiersschepen dat op grond van voor Nederland geldende rechtsregels
      gerechtigd is de vlag van het Koninkrijk te voeren, dat vertrekt uit een buiten de Europese Unie gelegen haven en
      op weg is naar een haven van een lidstaat, draagt er zorg voor dat de in artikel 6, eerste lid, van de richtlijn
      registratie opvarenden van passagiersschepen bedoelde gegevens worden verstrekt volgens de regels van die lidstaat.
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel3b
  - number: '5.1'
    text: 'Dit hoofdstuk is van toepassing op de gegevens:'
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel5
  - number: 5.1.a
    text: |-
      die een bevoegde autoriteit heeft ontvangen op grond van een melding als bedoeld in de
      [artikelen 2 tot en met 3a][ref1] of [4][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0031560#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0031560#Artikel4
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel5
    references:
      - id: ref1
