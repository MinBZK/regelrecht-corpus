        artikel: '51'
      - id: ref4
        bwb_id: BWBR0004552
        artikel: '29'
      - id: ref5
        bwb_id: BWBR0004364
        artikel: '4'
  - number: 5.1.d
    text: |-
      die Onze Minister heeft ontvangen in verband met de afgifte en het gebruik van het uniek Europees
      scheepsidentificatienummer, krachtens [artikel 8 van de Binnenvaartwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel8
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '8'
  - number: '5.2'
    text: |-
      De bevoegde autoriteiten bedoeld in het eerste lid, onderdelen a en b, en Onze Minister bedoeld in onderdeel c,
      zijn verwerkingsverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel5
  - number: '6.1'
    text: |-
      Onverminderd de Algemene verordening gegevensbescherming en [artikel 2:5 van de Algemene wet bestuursrecht][ref1],
      treft een ontvanger van gegevens, bedoeld in [artikel 5][ref2], passende technische en organisatorische
      maatregelen ten behoeve van de adequate opslag en verwerking van de gegevens die aan hem worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0031560#Artikel5
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0031560
        artikel: '5'
        hoofdstuk: '3'
  - number: '6.2'
    text: |-
      Een ontvanger van gegevens, bedoeld in [artikel 5][ref1], bewaart de door hem ontvangen gegevens zo lang als hij
      die gegevens redelijkerwijs nodig heeft ten behoeve van de uitvoering van zijn wettelijke taak, dan wel gedurende
      de termijn die daarvoor is vastgesteld op grond van punten 2.2 en 2.3 van bijlage III van de richtlijn monitoring-
      en informatiesysteem zeescheepvaart of op grond van andere internationale verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0031560#Artikel5
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0031560
        artikel: '5'
        hoofdstuk: '3'
  - number: '6.3'
    text: |-
      In afwijking van het tweede lid bewaart een ontvanger van gegevens op grond van een melding als bedoeld in
      [artikel 3a][ref1] deze gegevens niet langer dan aangegeven in artikel 10, derde lid, van de richtlijn registratie
      opvarenden van passagiersschepen.


      [ref1]: https://wetten.overheid.nl/BWBR0031560#Artikel3a
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0031560
        artikel: 3a
        hoofdstuk: '2'
  - number: '7'
    text: |-
      Een bevoegde autoriteit stelt door hem ontvangen gegevens beschikbaar aan andere bevoegde autoriteiten, voor zover
      deze autoriteiten deze gegevens nodig hebben ten behoeve van de uitvoering van hun wettelijke taak.
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel7
  - number: '8.1'
    text: |-
      Een ontvanger van gegevens, bedoeld in [artikel 5][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0031560#Artikel5
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0031560
        artikel: '5'
        hoofdstuk: '3'
  - number: 8.1.a
    text: |-
      stelt door hem ontvangen gegevens ter beschikking aan andere in dat artikel genoemde ontvangers van gegevens voor
      zover deze ontvangers deze gegevens nodig hebben ten behoeve van de uitvoering van hun wettelijke taak, en
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel8
  - number: 8.1.b
    text: |-
      kan de door hem ontvangen gegevens ter beschikking stellen aan derden ter bevordering van de handel en het
      transport in de logistieke keten.
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel8
  - number: '8.2'
    text: |-
      In afwijking van het eerste lid worden geen gegevens ter beschikking gesteld indien hiertegen bij of krachtens
      verdrag, wettelijke bepaling of om andere zwaarwegende redenen, beletselen bestaan.
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel8
  - number: '8.3'
    text: |-
      Ten behoeve van de uitvoering van het eerste lid worden door de daarbij betrokken partijen in elk geval
      schriftelijk vastgelegd welke gegevens ter beschikking worden gesteld, voor welk doel zij ter beschikking worden
      gesteld, op welke wijze de verstrekker van de gegevens hierover in kennis wordt gesteld en de termijn dat deze
      gegevens door de ontvangende partij mogen worden bewaard. Voor zover van toepassing worden daarbij tevens afspraken
      vastgelegd over het waarborgen van de bescherming van de door de ontvangende partij verkregen commerciële- en
      privacygevoelige gegevens en over het verdere hergebruik van deze gegevens binnen de logistieke keten.
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel8
  - number: '8.4'
    text: |-
      Het tweede en derde lid zijn niet van toepassing op de uitwisseling van gegevens tussen bevoegde autoriteiten,
      bedoeld in [artikel 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031560#Artikel7
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0031560
        artikel: '7'
        hoofdstuk: '3'
  - number: '8.5'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de wijze waarop de uitwisseling van gegevens,
      bedoeld in het eerste lid, geschiedt.
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel8
  - number: '9.1'
    text: |-
      Een ontvanger van gegevens, bedoeld in [artikel 5][ref1], geeft, buiten de in [artikel 8][ref2] bedoelde gevallen,
      slechts na een daartoe strekkend verzoek inzage in door hem ontvangen gegevens of verstrekt deze gegevens aan:


      [ref1]: https://wetten.overheid.nl/BWBR0031560#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0031560#Artikel8
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0031560
        artikel: '5'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0031560
        artikel: '8'
        hoofdstuk: '3'
  - number: 9.1.a
    text: |-
      personen die als toezichthouder zijn aangewezen voor zover het verzoek zijn grondslag vindt in het toezicht op de
      regelgeving waarvoor de betreffende persoon als toezichthouder is aangewezen en voor zover gericht naar gegevens
      wordt gevraagd;
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel9
  - number: 9.1.b
    text: |-
      degenen die belast zijn met taken in het kader van de rampenbestrijding en crisisbeheersing als bedoeld in de
      [Wet veiligheidsregio’s][ref1] of de bestrijding van schadelijke gevolgen van een maritiem ongeval als bedoeld
      in de [Wet bestrijding maritieme ongevallen][ref2], en het onderzoek naar dergelijke incidenten op grond van de
      [Rijkswet onderzoeksraad voor de veiligheid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0027466
      [ref2]: https://wetten.overheid.nl/BWBR0037162
      [ref3]: https://wetten.overheid.nl/BWBR0017613
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0027466
      - id: ref2
        bwb_id: BWBR0037162
      - id: ref3
        bwb_id: BWBR0017613
  - number: 9.1.c
    text: |-
      ambtenaren die bij of krachtens [artikel 141 van het Wetboek van Strafvordering][ref1] belast zijn met de opsporing
      van een strafbaar feit voor zover gericht naar gegevens wordt gevraagd;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 9.1.d
    text: |-
      ambtenaren van politie die zijn aangesteld voor de uitvoering van de politietaak voor zover gericht naar gegevens
      wordt gevraagd;
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel9
  - number: 9.1.e
    text: |-
      een verzekeraar als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1], indien deze verzekeraar
      aannemelijk maakt deze gegevens nodig te hebben voor het behartigen van de belangen van degene die bij hem
      verzekerd is en nadat deze verzekerde daarvoor toestemming heeft verleend, of


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 9.1.f
    text: |-
      een advocaat indien deze aannemelijk maakt de gegevens nodig te hebben voor het behartigen van de belangen van
      zijn cliënt.
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel9
  - number: '9.2'
    text: Een verzoek om inzage of verstrekking van gegevens wordt schriftelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel9
  - number: '9.3'
    text: Aan de inzage of verstrekking van gegevens kunnen voorschriften en beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel9
  - number: '9.4'
    text: |-
      Bij het ter inzage geven of verstrekken van persoonsgegevens worden gegevens van andere personen voor zover
      mogelijk anoniem gemaakt.
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel9
  - number: '9.5'
    text: |-
      Na inzage of verstrekking van gegevens wordt schriftelijk vastgelegd: de naam van de degene op wie of het schip
      waarop de gegevens betrekking hebben, de wijze en het moment waarop inzage werd verleend of verstrekking van de
      gegevens plaatsvond, welke gegevens het betrof en de naam- en adresgegevens van de verzoeker.
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel9
  - number: '10.1'
    text: Bij ministeriële regeling worden een NCA-SafeSeaNet en een RIS-autoriteit aangewezen.
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel10
  - number: '10.2'
    text: |-
      De NCA-SafeSeaNet en de RIS-autoriteit vertegenwoordigen, indien de gecoördineerde nationale en internationale
      uitvoering van bindende besluiten van instellingen van de Europese gemeenschappen dit vereist, een of meer van de
      in [artikel 5][ref1] genoemde ontvangers van gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0031560#Artikel5
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0031560
        artikel: '5'
        hoofdstuk: '3'
  - number: '10.3'
    text: |-
      De [artikelen 6][ref1], [8][ref2] en [9][ref3] zijn van overeenkomstige toepassing op de gegevens die de NCA-
      SafeSeaNet en de RIS-autoriteit ontvangen in verband met de uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0031560#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0031560#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0031560#Artikel9
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0031560
        artikel: '6'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0031560
        artikel: '8'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0031560
        artikel: '9'
        hoofdstuk: '3'
  - number: '11.1'
    text: |-
      De gegevens die op grond van de [artikelen 2 tot en met 3a][ref1] en [4][ref2] zijn gemeld aan de bevoegde
      autoriteit worden door deze bevoegde autoriteit verstrekt aan SafeSeaNet.


      [ref1]: https://wetten.overheid.nl/BWBR0031560#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0031560#Artikel4
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0031560
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0031560
        artikel: '4'
        hoofdstuk: '2'
  - number: '11.2'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld over de wijze waarop de gegevens bedoeld in het eerste lid
      worden doorgegeven aan SafeSeaNet.
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel11
  - number: '12.1'
    text: |-
      Een plaatselijke bevoegde autoriteit kan namens de bevoegde autoriteit uitvoering geven aan de verplichting in
      [artikel 11, eerste lid][ref1], indien deze plaatselijke bevoegde autoriteit daartoe bij ministeriële regeling
      is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0031560#Artikel11
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0031560
        artikel: '11'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '12.2'
    text: Een plaatselijke bevoegde autoriteit als bedoeld in het eerste lid is verwerker.
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel12
  - number: '12.3'
    text: |-
      Indien een bevoegde autoriteit de door hem aangewezen plaatselijk bevoegde autoriteit, bedoeld in het eerste lid,
      wijzigt of de uitvoering van [artikel 11, eerste lid][ref1], zelf ter hand neemt wordt dit ten minste 6 maanden
      voorafgaand aan de wijziging medegedeeld aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0031560#Artikel11
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0031560
        artikel: '11'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '13'
    text: |-
      Onverminderd [artikel 11][ref1], worden de in dat artikel bedoelde gegevens op een bij ministeriële regeling
      bepaalde wijze verstrekt aan een bevoegde instantie van een andere lidstaat van de Europese Unie, indien deze
      daarom verzoekt en indien dit noodzakelijk is voor de maritieme veiligheid of beveiliging, dan wel voor de
      bescherming van het mariene milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0031560#Artikel11
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0031560
        artikel: '11'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '14.1'
    text: |-
      Ten behoeve van de uitvoering van de richtlijn River Information Services worden de in het tweede lid genoemde
      gegevens van een schip, dat de grens met een andere lidstaat van de Europese Unie zal overschrijden, voordat het
      schip de grens met die lidstaat overschrijdt door een bevoegde autoriteit of de RIS-autoriteit, verstrekt aan
      een bevoegde instantie in die lidstaat op de route van dat schip of aan degene die in de betreffende lidstaat is
      aangewezen als RIS-autoriteit.
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel14
  - number: '14.2'
    text: |-
      De in het eerste lid bedoelde gegevens, betreffen de gegevens, bedoeld in
      [artikel 5, eerste lid, onderdeel b][ref1], met uitzondering van de in dat onderdeel genoemde meldingen, bedoeld in
      [artikel 2][ref2] van dit besluit, en de gegevens, bedoeld in artikel 5, eerste lid, onderdeel c.


      [ref1]: https://wetten.overheid.nl/BWBR0031560#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0031560#Artikel2
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0031560
        artikel: '5'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0031560
        artikel: '2'
        hoofdstuk: '2'
  - number: '14.3'
    text: |-
      Ook aan een bevoegde instantie van een derde land kunnen ter uitvoering van bindende besluiten van instellingen van
      de Europese Unie, gegevens worden verstrekt als bedoeld in het eerste en tweede lid. Indien het betreffende derde
      land geen partij is bij de overeenkomst betreffende de Europese Economische Ruimte is dit alleen mogelijk voor
      zover ten minste een gelijkwaardige bescherming van gegevens is gewaarborgd en nadat dit in een bestuursrechtelijke
      overeenkomst is vastgelegd.
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel14
  - number: '15'
    text: |-
      De Kustwacht Nederland stelt de gegevens die hij via AIS van alle zeeschepen varend buiten de kustlijn en alle
      zeeschepen varend op de binnenwateren ontvangt ter beschikking aan kustwachtstations van andere lidstaten van de
      Europese Unie en aan de Europese Commissie en kan deze gegevens ook beschikbaar stellen aan een bevoegde instantie
      van een derde land. Indien het betreffende derde land geen partij is bij de overeenkomst betreffende de Europese
      Economische Ruimte is dit alleen mogelijk voor zover ten minste een gelijkwaardige bescherming van gegevens is
      gewaarborgd en nadat dit in een bestuursrechtelijke overeenkomst ter uitvoering van de doelstelling genoemd in
      artikel 1 van de richtlijn monitoring- en informatiesysteem zeescheepvaart is vastgelegd.
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel15
  - number: '16.1'
    text: |-
      De Kustwacht Nederland deelt bij hem bekende relevante informatie met betrekking tot in artikel 16, eerste lid, van
      de richtlijn monitoring- en informatiesysteem zeescheepvaart, bedoelde schepen onverwijld, op een bij ministeriële
      regeling bepaalde wijze, mede aan de betrokken kuststations, bedoeld in artikel 3, onderdeel n, van de richtlijn
      monitoring- en informatiesysteem zeescheepvaart, van de overige lidstaten van de Europese Unie langs de door het
      zeeschip te volgen route.
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel16
  - number: '16.2'
    text: |-
      De Kustwacht Nederland verstrekt de in artikel 17 van de richtlijn monitoring- en informatiesysteem zeescheepvaart,
      bedoelde informatie, op een bij ministeriële regeling bepaalde wijze aan een bevoegde instantie als bedoeld in
      artikel 3, onderdeel k, van de richtlijn monitoring- en informatiesysteem zeescheepvaart, van een andere lidstaat
      van de Europese Unie, die daarom uit veiligheidsoverwegingen verzoekt.
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel16
  - number: '17'
    text: 'De Kustwacht Nederland maakt door middel van een radiobericht in het betrokken zeegebied openbaar:'
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel17
  - number: 17.a
    text: |-
      een aan hem gemeld incident of ongeval op zee als bedoeld in artikel 17, eerste lid, van de richtlijn monitoring-
      en informatiesysteem zeescheepvaart, met een zeeschip;
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel17
  - number: 17.b
    text: |-
      een aan hem bekende aanwezigheid van zeeschepen die een bedreiging vormen voor de veiligheid op zee, de veiligheid
      van personen of het mariene milieu;
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel17
  - number: 17.c
    text: |-
      in geval van gevaarlijke ijsgang, alle nodige informatie over de ijsgang, de aanbevolen routes en de
      ijsbreekdiensten in het betrokken zeegebied.
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel17
  - number: '18'
    text: |-
      De exploitant van een zeeschip die door de kapitein van dat schip op de hoogte is gesteld van een incident
      of ongeval met dat schip op zee als bedoeld in artikel 17, eerste lid, van de richtlijn monitoring- en
      informatiesysteem zeescheepvaart, neemt onmiddellijk contact op met de Kustwacht Nederland en houdt zich voor zover
      nodig ter beschikking van dit centrum.
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel18
  - number: '19'
    text: |-
      De [artikelen 2, eerste lid][ref1], [13][ref2], [16][ref3], [17][ref4] en [18][ref5] zijn niet van toepassing met
      betrekking tot gegevens verkregen van een schip als bedoeld in [artikel 2, tweede lid][ref6], in samenhang met
      artikel 6bis, van de richtlijn monitoring- en informatiesysteem zeescheepvaart.


      [ref1]: https://wetten.overheid.nl/BWBR0031560#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0031560#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0031560#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0031560#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0031560#Artikel18
      [ref6]: https://wetten.overheid.nl/BWBR0031560#Artikel2
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0031560
        artikel: '12'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0031560
        artikel: '13'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0031560
        artikel: '16'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0031560
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0031560
        artikel: '18'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref6
        bwb_id: BWBR0031560
        artikel: '2'
        hoofdstuk: '2'
  - number: '20'
    text: |-
      Indien een lidstaat van de Europese Unie daarom verzoekt, wordt de informatie, die overeenkomstig artikel 20 bis,
      derde lid, van de richtlijn monitoring- en informatiesysteem zeescheepvaart is verstrekt, vertrouwelijk behandeld
      door degenen die deze informatie ontvangen.
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel20
  - number: '21.1'
    text: |-
      Onze Minister draagt, met inachtneming van de artikelen 3, onderdelen d, e, f, g en h, 4, eerste lid, tweede
      lid, derde lid, onderdelen a, b, c, eerste volzin, en d, vierde en vijfde lid, en de daarbij behorende bijlagen
      en artikel 9, tweede lid, van de richtlijn River Information Services, zorg voor RIS op de scheepvaartwegen die
      behoren tot of aansluiten op scheepvaartwegen klasse IV en hoger zoals vastgesteld op basis van de documenten
      genoemd in artikel 2, eerste lid, van de RIS-richtlijn.
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel21
  - number: '21.2'
    text: |-
      Een bevoegde autoriteit en de RIS-autoriteit treffen in het belang van de bescherming van persoonsgegevens
      en de bescherming van de persoonlijke levenssfeer van degenen die van diensten die via RIS worden aangeboden,
      gebruik maken, passende en organisatorische maatregelen ten behoeve van de veiligheid en de beveiliging van de
      aangeboden diensten. De maatregelen garanderen, rekening houdend met de stand van de techniek en de kosten van
      de tenuitvoerlegging, een passend beschermingsniveau dat in verhouding staat tot het desbetreffende risico.
      [Artikel 11.3, tweede lid, van de Telecommunicatiewet][ref1] is daarbij van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
  - number: '21.3'
    text: |-
      [Artikel 11.5a van de Telecommunicatiewet][ref1] is van overeenkomstige toepassing op de verwerking van
      positiegegevens die via een tracking- en tracingsysteem als bedoeld in artikel 5 van de richtlijn River Information
      Services zijn verkregen, met uitzondering van de verwerking van positiegegevens die door een bevoegde autoriteit
      of de RIS-autoriteit worden verwerkt ten behoeve van bij ministeriële regeling genoemde diensten die via RIS worden
      aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
  - number: '22'
    text: 'Bij ministeriële regeling worden aangewezen:'
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel22
  - number: 22.a
    text: een LRIT-datacentrum;
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel22
  - number: 22.b
    text: een of meerdere applicatie-serviceproviders, die voldoen aan bij die regeling te stellen voorwaarden;
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel22
  - number: 22.c
    text: degene die bevoegd is meldplichtige gegevens bij het LRIT-datacentrum op te vragen;
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel22
  - number: 22.d
    text: |-
      degene die bevoegd is te bepalen met welke intervallen meldplichtige gegevens door middel van het LRIT worden
      verzonden; en
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel22
  - number: 22.e
    text: degene aan wie wordt gemeld dat het LRIT is uitgeschakeld.
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel22
  - number: '23.1'
    text: |-
      De kapitein van een meldplichtig zeeschip meldt door middel van het LRIT de meldplichtige gegevens via een op
      grond van [artikel 22, onderdeel b][ref1], aangewezen applicatie-serviceprovider aan het op grond van artikel 22,
      onderdeel a, aangewezen LRIT-datacentrum.


      [ref1]: https://wetten.overheid.nl/BWBR0031560#Artikel22
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0031560
        artikel: '22'
        hoofdstuk: '6'
  - number: '23.2'
    text: |-
      De melding bedoeld in het eerste lid, geschiedt met de intervallen zoals bepaald door degene die daartoe op grond
      van [artikel 22, onderdeel d][ref1], is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0031560#Artikel22
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0031560
        artikel: '22'
        hoofdstuk: '6'
  - number: '23.3'
    text: |-
      Wanneer het LRIT overeenkomstig Hoofdstuk V, Voorschrift 19-1, onderdeel 7, van het SOLAS-verdrag is uitgeschakeld,
      meldt de kapitein dit aan degene die op grond van [artikel 22, onderdeel e][ref1], is aangewezen en maakt daarvan
      aantekening in het document, bedoeld in Hoofdstuk V, Voorschrift 28, van het SOLAS-verdrag, waarbij hij aangeeft
      waarom en hoe lang het LRIT werd uitgeschakeld.


      [ref1]: https://wetten.overheid.nl/BWBR0031560#Artikel22
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0031560
        artikel: '22'
        hoofdstuk: '6'
  - number: '23.4'
    text: |-
      Indien de melding, bedoeld in het derde lid, is geschied door de eigenaar, de rompbevrachter, de agent, of een
      ander die zeggenschap heeft over het gebruik van het desbetreffend meldplichtig zeeschip, is de kapitein van de
      meldingsplicht ontheven.
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel23
  - number: '24.1'
    text: |-
      Degene die op grond van [artikel 22, onderdeel c][ref1], is aangewezen, vraagt gegevens op bij het LRIT-datacentrum
      in overeenstemming met Hoofdstuk V, Voorschrift 19-1, onderdeel 8.1, van het SOLAS-verdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0031560#Artikel22
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0031560
        artikel: '22'
        hoofdstuk: '6'
  - number: '24.2'
    text: |-
      Een op grond van het eerste lid aangewezen organisatie die een Search and Rescue dienst is, kan, voor zover dat
      voor een goede uitvoering van de reddingstaak noodzakelijk is, bij het LRIT-datacentrum gegevens met betrekking tot
      ieder zeeschip opvragen, waar ter wereld dat zich ook bevindt.
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel24
  - number: '25'
    text: |-
      Een wijziging van de richtlijn monitoring- en informatiesysteem zeescheepvaart, van de richtlijn River Information
      Services, van de richtlijn meldingsformaliteiten, of van de daarbij behorende bijlagen gaat voor de toepassing
      van dit besluit of voor de hierop berustende bepalingen gelden met ingang van de dag waarop aan de betrokken
      wijzigingsrichtlijn dan wel de gewijzigde bijlagen uitvoering moet zijn gegeven, tenzij bij ministerieel besluit,
      dat in de Staatscourant wordt bekend gemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel25
  - number: 25a
    text: |-
      Tot 21 december 2023 blijft de melding bedoeld in [artikel 3a, eerste lid][ref1], achterwege en worden de in de
      melding te verstrekken gegevens geregistreerd door de passagiersregistratiebeambte als bedoeld in artikel 8, eerste
      lid, van de richtlijn registratie opvarenden van passagiersschepen.


      [ref1]: https://wetten.overheid.nl/BWBR0031560#Artikel3a
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0031560
        artikel: 3a
        hoofdstuk: '2'
  - number: '31'
    text: |-
      Overtreding van de [artikelen 2 tot en met 3a][ref1], [23, eerste, tweede en derde lid][ref2], of
      [24, eerste lid][ref3], en de daarop berustende bepalingen is een strafbaar feit.


      [ref1]: https://wetten.overheid.nl/BWBR0031560#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0031560#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0031560#Artikel24
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0031560
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0031560
        artikel: '23'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0031560
        artikel: '24'
        hoofdstuk: '6'
  - number: '32'
    text: |-
      Het [Besluit gegevens scheepvaart 2007][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0022612
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0022612
  - number: '33'
    text: 'Dit besluit wordt aangehaald als: Besluit meldingsformaliteiten en gegevensverwerkingen scheepvaart.'
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel33
  - number: '34'
    text: |-
      Dit besluit treedt in werking met ingang van 19 mei 2012 met uitzondering van de
      [onderdelen b en c van artikel 12][ref1], die met ingang van 1 juni 2015 in werking treden.


      [ref1]: https://wetten.overheid.nl/BWBR0031560#Artikel12
    url: https://wetten.overheid.nl/BWBR0031560/2026-03-27#Artikel34
    references:
