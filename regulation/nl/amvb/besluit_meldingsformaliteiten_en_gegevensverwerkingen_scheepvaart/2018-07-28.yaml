        artikel: 11.5a
  - number: '22'
    text: |-
      Bij ministeriële regeling worden aangewezen:

      a. een LRIT-datacentrum;

      b. een of meerdere applicatie-service providers, die voldoen aan bij die regeling te stellen voorwaarden;

      c. degene die bevoegd is meldplichtige gegevens bij het LRIT-datacentrum op te vragen;

      d. degene die bevoegd is te bepalen met welke intervallen meldplichtige gegevens door middel van het LRIT worden
      verzonden; en

      e. degene aan wie wordt gemeld dat het LRIT is uitgeschakeld.
    url: https://wetten.overheid.nl/BWBR0031560/2018-07-28#Artikel22
  - number: '23'
    text: |-
      1 De kapitein van een meldplichtig zeeschip meldt door middel van het LRIT de meldplichtige gegevens via een op
      grond van [artikel 22, onderdeel b][ref1], aangewezen applicatie-service provider aan het op grond van artikel 22,
      onderdeel a, aangewezen LRIT-datacentrum.

      2 De melding bedoeld in het eerste lid, geschiedt met de intervallen zoals bepaald door degene die daartoe op grond
      van [artikel 22, onderdeel d][ref2], is aangewezen.

      3 Wanneer het LRIT overeenkomstig Hoofdstuk V, Voorschrift 19-1, onderdeel 7, van het SOLAS-verdrag is
      uitgeschakeld, meldt de kapitein dit aan degene die op grond van [artikel 22, onderdeel e][ref3], is aangewezen en
      maakt daarvan aantekening in het document, bedoeld in Hoofdstuk V, Voorschrift 28, van het SOLAS-verdrag, waarbij
      hij aangeeft waarom en hoe lang het LRIT werd uitgeschakeld.

      4 Indien de melding, bedoeld in het derde lid, is geschied door de eigenaar, de rompbevrachter, de agent, of een
      ander die zeggenschap heeft over het gebruik van het desbetreffend meldplichtig zeeschip, is de kapitein van de
      meldingsplicht ontheven.


      [ref1]: https://wetten.overheid.nl/BWBR0031560#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0031560#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0031560#Artikel22
    url: https://wetten.overheid.nl/BWBR0031560/2018-07-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0031560
        artikel: '22'
