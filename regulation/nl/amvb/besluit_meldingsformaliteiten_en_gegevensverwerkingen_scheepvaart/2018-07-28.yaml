  - number: '12'
    text: |-
      Op bij ministeriële regeling bepaalde wijze worden onverwijld doorgegeven aan SafeSeaNet:

      a. door een bevoegde autoriteit, de gegevens die hem op grond van [artikel 2][ref1] zijn verschaft;

      b. door een bevoegde autoriteit, de gegevens die hem uit de te verschaffen inlichtingen als bedoeld in artikel 6
      van de verordening scheeps- en havenbeveiliging en [artikel 3][ref2] ter beschikking zijn gesteld; en

      c. door een havenbeheerder, bedoeld in [artikel 1 van de Wet voorkoming verontreiniging door schepen][ref3], de
      gegevens die hem krachtens [artikel 12a van de Wet voorkoming verontreiniging door schepen][ref4] zijn verschaft.


      [ref1]: https://wetten.overheid.nl/BWBR0031560#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0031560#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003642#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0003642#Artikel12a
    url: https://wetten.overheid.nl/BWBR0031560/2018-07-28#Artikel12
