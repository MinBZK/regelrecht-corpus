        artikel: '22'
        hoofdstuk: '6'
  - number: '24'
    text: |-
      1 Degene die op grond van [artikel 22, onderdeel c][ref1], is aangewezen, vraagt gegevens op bij het LRIT-
      datacentrum in overeenstemming met Hoofdstuk V, Voorschrift 19-1, onderdeel 8.1, van het SOLAS-verdrag.

      2 Een op grond van het eerste lid aangewezen organisatie die een Search and Rescue dienst is, kan, voor zover dat
      voor een goede uitvoering van de reddingstaak noodzakelijk is, bij het LRIT-datacentrum gegevens met betrekking tot
      ieder zeeschip opvragen, waar ter wereld dat zich ook bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0031560#Artikel22
    url: https://wetten.overheid.nl/BWBR0031560/2018-07-28#Artikel24
    references:
