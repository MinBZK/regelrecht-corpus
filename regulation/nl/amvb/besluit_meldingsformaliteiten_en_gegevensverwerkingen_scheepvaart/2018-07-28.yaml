  - number: '7'
    text: |-
      Een bevoegde autoriteit stelt door hem ontvangen gegevens beschikbaar aan andere bevoegde autoriteiten, voor zover
      deze autoriteiten deze gegevens nodig hebben ten behoeve van de uitvoering van hun wettelijke taak.
    url: https://wetten.overheid.nl/BWBR0031560/2018-07-28#Artikel7
  - number: '8'
    text: |-
      1 Een ontvanger van gegevens, bedoeld in [artikel 5][ref1]:

      a. stelt door hem ontvangen gegevens ter beschikking aan andere in dat artikel genoemde ontvangers van gegevens,
      aan bestuursorganen en aan overheidsdiensten, voor zover deze ontvangers, organen of diensten deze gegevens nodig
      hebben ten behoeve van de uitvoering van hun wettelijke taak, en

      b. kan de door hem ontvangen gegevens ter beschikking stellen aan derden ter bevordering van de handel en het
      transport in de logistieke keten.

      2 In afwijking van het eerste lid worden geen gegevens ter beschikking gesteld indien hiertegen bij of krachtens
      verdrag, wettelijke bepaling of om andere zwaarwegende redenen, beletselen bestaan.

      3 Ten behoeve van de uitvoering van het eerste lid worden door de daarbij betrokken partijen in elk geval
      schriftelijk vastgelegd welke gegevens ter beschikking worden gesteld, voor welk doel zij ter beschikking worden
      gesteld, op welke wijze de verstrekker van de gegevens hierover in kennis wordt gesteld en de termijn dat deze
      gegevens door de ontvangende partij mogen worden bewaard. Voor zover van toepassing worden daarbij tevens afspraken
      vastgelegd over het waarborgen van de bescherming van de door de ontvangende partij verkregen commerciële- en
      privacygevoelige gegevens en over het verdere hergebruik van deze gegevens binnen de logistieke keten.

      4 Het tweede en derde lid zijn niet van toepassing op de uitwisseling van gegevens tussen bevoegde autoriteiten,
      bedoeld in [artikel 7][ref2].

      5 Bij ministeriële regeling kunnen nadere regels worden gesteld over de wijze waarop de uitwisseling van gegevens,
      bedoeld in het eerste lid, geschiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0031560#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0031560#Artikel7
    url: https://wetten.overheid.nl/BWBR0031560/2018-07-28#Artikel8
