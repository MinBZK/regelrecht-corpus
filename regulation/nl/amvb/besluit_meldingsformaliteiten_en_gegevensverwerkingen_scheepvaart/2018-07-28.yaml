  - number: '2'
    text: |-
      1 De kapitein, de exploitant of de agent van een zeeschip dat behoort tot een bij ministeriële regeling vast te
      stellen categorie van zeeschepen en dat op weg is van of naar een in Nederland gelegen haven, ankerplaats, terminal
      of een in de Nederlandse territoriale zee gelegen laad- of losinrichting, meldt de bevoegde autoriteit de bij
      ministeriële regeling te bepalen gegevens omtrent de aankomst, het vertrek en de positie van het schip, de gegevens
      met betrekking tot het schip, de daarmee vervoerde lading en de uit te voeren reis.

      2 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot:

      a. de gevallen waarin en de voorwaarden waaronder vrijstelling of ontheffing van deze meldplicht mogelijk is, en

      b. de wijze waarop en het moment waarop de melding plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0031560/2018-07-28#Artikel2
  - number: '3'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld omtrent de door een kapitein, exploitant of agent van een
      schip aan de bevoegde autoriteit te verschaffen inlichtingen als bedoeld in artikel 6 van de verordening scheeps-
      en havenbeveiliging.
    url: https://wetten.overheid.nl/BWBR0031560/2018-07-28#Artikel3
  - number: '4'
    text: |-
      De kapitein, de exploitant of de agent van een schip dat op weg is naar een haven als bedoeld in
      [artikel 1 van de Wet havenstaatcontrole][ref1] en dat in aanmerking komt voor een uitgebreide inspectie als
      bedoeld in die wet, meldt aan het bij ministeriële regeling aangewezen bestuursorgaan, de bij die regeling te
      bepalen gegevens op een bij die regeling vast te stellen moment en wijze, voordat met het schip een in Nederland
      gelegen haven, een in de Nederlandse territoriale zee gelegen offshore-installatie of een ankerplaats ter hoogte
      van die haven of offshore-installatie wordt aangedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel1
    url: https://wetten.overheid.nl/BWBR0031560/2018-07-28#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: '1'
  - number: '5'
    text: |-
      Dit hoofdstuk is van toepassing op de gegevens:

      a. die een bevoegde autoriteit heeft ontvangen op grond van een melding als bedoeld in
      [artikel 2][ref1] van dit besluit, [artikel 9.07 van het Binnenvaartpolitiereglement][ref2],
      [artikel 12.01 van het Rijnvaartpolitiereglement][ref3],
      [artikel 51, eerste en tweede lid van het Scheepvaartreglement Westerschelde][ref4] of
      [artikel 29 van het Scheepvaartreglement Eemsmonding][ref5] en de gegevens die hij heeft ontvangen bij of krachtens
      verdrag of [artikel 4 van de Scheepvaartverkeerswet][ref6] of van een aan boord van een schip aanwezig AIS;

      b. die een havenbeheerder, bedoeld in [artikel 1 van de Wet voorkoming verontreiniging door schepen][ref7] heeft
      ontvangen op grond van [artikel 12a van de Wet voorkoming verontreiniging door schepen][ref8];

      c. die een bevoegde autoriteit heeft ontvangen uit de te verschaffen inlichtingen als bedoeld in artikel 6 van de
      verordening scheeps- en havenbeveiliging en [artikel 3][ref9];

      d. die het aangewezen bestuursorgaan, bedoeld in artikel 4, heeft ontvangen ten behoeve van een uitgebreide
      inspectie als bedoeld in [artikel 9 van de Wet havenstaatcontrole][ref10], en

      e. die Onze Minister heeft ontvangen in verband met de afgifte en het gebruik van het uniek Europees
      scheepsidentificatienummer, krachtens [artikel 8 van de Binnenvaartwet][ref11].


