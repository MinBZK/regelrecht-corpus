  - number: '9'
    text: |-
      1 Een ontvanger van gegevens, bedoeld in [artikel 5][ref1], geeft, buiten de in [artikel 8][ref2] bedoelde
      gevallen, slechts na een daartoe strekkend verzoek inzage in door hem ontvangen gegevens of verstrekt deze gegevens
      aan:

      a. personen die als toezichthouder zijn aangewezen voor zover het verzoek zijn grondslag vindt in het toezicht op
      de regelgeving waarvoor de betreffende persoon als toezichthouder is aangewezen en voor zover gericht naar gegevens
      wordt gevraagd;

      b. degenen die belast zijn met taken in het kader van de rampenbestrijding en crisisbeheersing als bedoeld in de
      [Wet veiligheidsregio’s][ref3] of de bestrijding van schadelijke gevolgen van een maritiem ongeval als bedoeld
      in de [Wet bestrijding maritieme ongevallen][ref4], en het onderzoek naar dergelijke incidenten op grond van de
      [Rijkswet onderzoeksraad voor de veiligheid][ref5];

      c. ambtenaren die bij of krachtens [artikel 141 van het Wetboek van Strafvordering][ref6] belast zijn met de
      opsporing van een strafbaar feit voor zover gericht naar gegevens wordt gevraagd;

      d. ambtenaren van politie die zijn aangesteld voor de uitvoering van de politietaak voor zover gericht naar
      gegevens wordt gevraagd;

      e. een verzekeraar als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref7], indien deze
      verzekeraar aannemelijk maakt deze gegevens nodig te hebben voor het behartigen van de belangen van degene die bij
      hem verzekerd is en nadat deze verzekerde daarvoor toestemming heeft verleend, of

      f. een advocaat indien deze aannemelijk maakt de gegevens nodig te hebben voor het behartigen van de belangen van
      zijn cliënt.

      2 Een verzoek om inzage of verstrekking van gegevens wordt schriftelijk ingediend.

      3 Aan de inzage of verstrekking van gegevens kunnen voorschriften en beperkingen worden verbonden.

      4 Bij het ter inzage geven of verstrekken van persoonsgegevens worden gegevens van andere personen voor zover
      mogelijk anoniem gemaakt.

      5 Na inzage of verstrekking van gegevens wordt schriftelijk vastgelegd: de naam van de degene op wie of het schip
      waarop de gegevens betrekking hebben, de wijze en het moment waarop inzage werd verleend of verstrekking van de
      gegevens plaatsvond, welke gegevens het betrof en de naam- en adresgegevens van de verzoeker.


