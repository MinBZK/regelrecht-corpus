  - number: '10'
    text: |-
      1 Bij ministeriële regeling worden een NCA-SafeSeaNet en een RIS-autoriteit aangewezen.

      2 De NCA-SafeSeaNet en de RIS-autoriteit vertegenwoordigen, indien de gecoördineerde nationale en internationale
      uitvoering van bindende besluiten van instellingen van de Europese gemeenschappen dit vereist, een of meer van de
      in [artikel 5][ref1] genoemde ontvangers van gegevens, bestuursorganen of overheidsdiensten.

      3 De [artikelen 6][ref2], [8][ref3] en [9][ref4] zijn van overeenkomstige toepassing op de gegevens die de NCA-
      SafeSeaNet en de RIS-autoriteit ontvangen in verband met de uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0031560#Artikel5
