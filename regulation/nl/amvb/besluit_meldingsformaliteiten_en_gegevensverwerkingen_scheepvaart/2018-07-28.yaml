  - number: '6'
    text: |-
      1 Onverminderd de Algemene verordening gegevensbescherming en [artikel 2:5 van de Algemene wet bestuursrecht][ref1],
      treft een ontvanger van gegevens, bedoeld in [artikel 5][ref2], passende technische en organisatorische maatregelen
      ten behoeve van de adequate opslag en verwerking van de gegevens die aan hem worden verstrekt.

      2 Een ontvanger van gegevens, bedoeld in [artikel 5][ref3], bewaart de door hem ontvangen gegevens zo lang als hij
      die gegevens redelijkerwijs nodig heeft ten behoeve van de uitvoering van zijn wettelijke taak, dan wel gedurende
      de termijn die daarvoor is vastgesteld op grond van punten 2.2 en 2.3 van bijlage III van de richtlijn monitoring-
      en informatiesysteem zeescheepvaart of op grond van andere internationale verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel25
