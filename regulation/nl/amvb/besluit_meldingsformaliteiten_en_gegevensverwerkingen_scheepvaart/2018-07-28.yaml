  - number: '13'
    text: |-
      Onverminderd [artikel 12][ref1], worden de in dat artikel bedoelde gegevens op een bij ministeriële regeling
      bepaalde wijze verstrekt aan een bevoegde instantie van een andere lidstaat van de Europese Unie, indien deze
      daarom verzoekt en indien dit noodzakelijk is voor de maritieme veiligheid of beveiliging, dan wel voor de
      bescherming van het mariene milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0031560#Artikel12
    url: https://wetten.overheid.nl/BWBR0031560/2018-07-28#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0031560
        artikel: '12'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '14'
    text: |-
      1 Ten behoeve van de uitvoering van de richtlijn River Information Services worden de in het tweede lid genoemde
      gegevens van een schip, dat de grens met een andere lidstaat van de Europese Unie zal overschrijden, voordat het
      schip de grens met die lidstaat overschrijdt door een bevoegde autoriteit of de RIS-autoriteit, verstrekt aan
      een bevoegde instantie in die lidstaat op de route van dat schip of aan degene die in de betreffende lidstaat is
      aangewezen als RIS-autoriteit.

      2 De in het eerste lid bedoelde gegevens, betreffen de gegevens, bedoeld in [artikel 5, onderdeel a][ref1], met
      uitzondering van de in dat onderdeel genoemde meldingen, bedoeld in [artikel 2][ref2] van dit besluit, en de
      gegevens, bedoeld in onderdeel e, van artikel 5.

      3 Ook aan een bevoegde instantie van een derde land kunnen ter uitvoering van bindende besluiten van instellingen
      van de Europese Unie, gegevens worden verstrekt als bedoeld in het eerste en tweede lid. Indien het betreffende
      derde land geen partij is bij de overeenkomst betreffende de Europese Economische Ruimte is dit alleen
      mogelijk voor zover ten minste een gelijkwaardige bescherming van gegevens is gewaarborgd en nadat dit in een
      bestuursrechtelijke overeenkomst is vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0031560#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0031560#Artikel2
    url: https://wetten.overheid.nl/BWBR0031560/2018-07-28#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0031560
        artikel: '5'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0031560
        artikel: '2'
        hoofdstuk: '2'
  - number: '15'
    text: |-
      Het Kustwachtcentrum stelt de gegevens die hij via AIS van een schip ontvangt ter beschikking aan kustwachtstations
      van andere lidstaten van de Europese Unie en aan de Europese Commissie en kan deze gegevens ook beschikbaar stellen
      aan een bevoegde instantie van een derde land. Indien het betreffende derde land geen partij is bij de overeenkomst
      betreffende de Europese Economische Ruimte is dit alleen mogelijk voor zover ten minste een gelijkwaardige
      bescherming van gegevens is gewaarborgd en nadat dit in een bestuursrechtelijke overeenkomst ter uitvoering van de
      doelstelling genoemd in artikel 1 van de richtlijn monitoring- en informatiesysteem zeescheepvaart is vastgelegd.
    url: https://wetten.overheid.nl/BWBR0031560/2018-07-28#Artikel15
  - number: '16'
    text: |-
      1 Het Kustwachtcentrum deelt bij hem bekende relevante informatie met betrekking tot in artikel 16, eerste lid, van
      de richtlijn monitoring- en informatiesysteem zeescheepvaart, bedoelde schepen onverwijld, op een bij ministeriële
      regeling bepaalde wijze, mede aan de betrokken kuststations, bedoeld in artikel 3, onderdeel n, van de richtlijn
      monitoring- en informatiesysteem zeescheepvaart, van de overige lidstaten van de Europese Unie langs de door het
      zeeschip te volgen route.

      2 Het Kustwachtcentrum verstrekt de in artikel 17 van de richtlijn monitoring- en informatiesysteem zeescheepvaart,
      bedoelde informatie, op een bij ministeriële regeling bepaalde wijze aan een bevoegde instantie als bedoeld in
      artikel 3, onderdeel k, van de richtlijn monitoring- en informatiesysteem zeescheepvaart, van een andere lidstaat
      van de Europese Unie, die daarom uit veiligheidsoverwegingen verzoekt.
    url: https://wetten.overheid.nl/BWBR0031560/2018-07-28#Artikel16
  - number: '17'
    text: |-
      Het Kustwachtcentrum maakt door middel van een radiobericht in het betrokken zeegebied openbaar:

      a. een aan hem gemeld incident of ongeval op zee als bedoeld in artikel 17, eerste lid, van de richtlijn
      monitoring- en informatiesysteem zeescheepvaart, met een zeeschip;

      b. een aan hem bekende aanwezigheid van zeeschepen die een bedreiging vormen voor de veiligheid op zee, de
      veiligheid van personen of het mariene milieu;

      c. in geval van gevaarlijke ijsgang, alle nodige informatie over de ijsgang, de aanbevolen routes en de
      ijsbreekdiensten in het betrokken zeegebied.
    url: https://wetten.overheid.nl/BWBR0031560/2018-07-28#Artikel17
  - number: '18'
    text: |-
      De exploitant van een zeeschip die door de kapitein van dat schip op de hoogte is gesteld van een incident
      of ongeval met dat schip op zee als bedoeld in artikel 17, eerste lid, van de richtlijn monitoring- en
      informatiesysteem zeescheepvaart, neemt onmiddellijk contact op met het Kustwachtcentrum en houdt zich voor zover
      nodig ter beschikking van dit centrum.
    url: https://wetten.overheid.nl/BWBR0031560/2018-07-28#Artikel18
  - number: '19'
    text: |-
      De [artikelen 12, aanhef en onderdeel a][ref1], [13][ref2], [16][ref3], [17][ref4] en [18][ref5] zijn niet van
      toepassing met betrekking tot gegevens verkregen van een schip als bedoeld in [artikel 2, tweede lid][ref6], in
      samenhang met artikel 6bis, van de richtlijn monitoring- en informatiesysteem zeescheepvaart.


      [ref1]: https://wetten.overheid.nl/BWBR0031560#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0031560#Artikel13
