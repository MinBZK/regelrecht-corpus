  - number: '11'
    text: |-
      Een bevoegde autoriteit die bij ministeriële regeling tevens als plaatselijk bevoegde autoriteit is aangewezen,
      kan namens een andere in [artikel 5][ref1] bedoelde ontvanger van gegevens, of namens een bestuursorgaan of
      overheidsdienst, gegevens omtrent schepen, dan wel de lading of de passagiers, opvragen, ontvangen of van de
      indiening hiervan ontheffing verlenen en kan deze gegevens doorgeven aan SafeSeaNet, indien dit ten behoeve
      van de efficiënte uitvoering van bindende besluiten van instellingen van de Europese Unie of om redenen
      van doelmatigheid, gewenst is. Tenzij hierover bij ministeriële regeling nadere regels zijn gesteld, is
      [artikel 8, tweede en derde lid][ref2], daarbij van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031560#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0031560#Artikel8
