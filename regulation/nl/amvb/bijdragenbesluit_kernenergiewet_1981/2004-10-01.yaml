      - id: ref1
        bwb_id: BWBR0002402
  - number: '1.2'
    text: |-
      In dit besluit wordt onder «activiteit», «ingekapselde bron» en «open bron» verstaan hetgeen daaronder wordt
      verstaan in [artikel 1, eerste lid, van het Besluit stralingsbescherming][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel1
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '1'
  - number: '1.3'
    text: 'In dit besluit wordt onder «voorhanden hebben» mede verstaan: vervaardigen, bewerken, hanteren en opslaan.'
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel1
  - number: '2'
    text: |-
      Hij, aan wie een vergunning wordt verleend voor het vervoeren van splijtstoffen, is verplicht aan de staat een
      bedrag te betalen van € 358.
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel2
  - number: '3.1'
    text: |-
      Hij, aan wie een vergunning wordt verleend voor het voorhanden hebben of zich ontdoen van splijtstoffen, is
      verplicht aan de staat een bedrag te betalen van:
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel3
  - number: 3.1.a
    text: |-
      € 4 476, indien de vergunning wordt verleend ten behoeve van een inrichting als bedoeld in
      [artikel 15, onder ][ref1] voor de opwekking van elektrische of thermische energie, dan wel voor het chemisch
      opwerken van bestraalde splijtstoffen;


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 3.1.b
    text: |-
      € 895, indien de vergunning wordt verleend ten behoeve van een andere inrichting als bedoeld in
      [artikel 15, onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 3.1.c
    text: |-
      € 531, indien de vergunning niet wordt verleend ten behoeve van een inrichting als bedoeld in
      [artikel 15, onder b, van de wet][ref1], ingeval de activiteit van de bij dat voorhanden hebben of
      zich ontdoen van betrokken splijtstoffen meer bedraagt dan een miljoen maal de waarden, genoemd in de
      [bij het Besluit stralingsbescherming behorende bijlage 1, tabel 1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0012702
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0012702
  - number: '3.2'
    text: |-
      [Artikel 25, derde en vierde lid, van het Besluit stralingsbescherming][ref1] is van overeenkomstige toepassing,
      met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel25
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '25'
  - number: 3.2.a
    text: |-
      onder «locatie» mede wordt verstaan een inrichting als bedoeld in [artikel 15, onder b, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 3.2.b
    text: |-
      onder «handeling» wordt verstaan hetgeen daaronder in
      [artikel 1, eerste lid, van het Besluit kerninstallaties, splijtstoffen en ertsen][ref1] wordt verstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel1
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel3
    references:
