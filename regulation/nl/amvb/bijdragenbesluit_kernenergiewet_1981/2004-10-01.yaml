preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Ministers van Economische Zaken, van Volksgezondheid en Milieuhygiëne en van Sociale
    Zaken van 5 februari 1981, no. 681/54 W.J.A., gedaan in overeenstemming met Onze Ministers van Verkeer en
    Waterstaat en van Financiën;

    Gelet op de artikelen 74 en 76, eerste lid, van de Kernenergiewet (Stb. 1963, 82);

    De Raad van State gehoord (advies van 21 april 1981, no. 810415/22);

    Gezien het nader rapport van Onze Ministers van Economische Zaken, van Volksgezondheid en Milieuhygiëne, en van
    Sociale Zaken van 19 juni 1981, no. 681/457 W.J.A., uitgebracht in overeenstemming met Onze Ministers van Verkeer
    en Waterstaat en van Financiën;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit wordt verstaan onder wet: [Kernenergiewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002402
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel1
