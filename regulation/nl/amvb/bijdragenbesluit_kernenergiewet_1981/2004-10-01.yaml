        artikel: '15'
  - number: '6.2'
    text: |-
      Hij, aan wie een vergunning wordt verleend voor het aangebracht houden of wijzigen van een uitrusting als bedoeld
      in [artikel 15, onder c, van de wet][ref1], is verplicht aan de staat een bedrag te betalen van € 3 581.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: '7.1'
    text: |-
      Hij, aan wie een vergunning wordt verleend om radioactieve stoffen te bereiden, voorhanden te hebben of toe te
      passen, is verplicht aan de staat een bedrag te betalen van:
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel7
  - number: 7.1.a
    text: |-
      € 358, indien het een ingekapselde bron betreft waarvan de activiteit meer bedraagt dan een miljoen maal de
      waarden, genoemd in de bij het [Besluit stralingsbescherming behorende bijlage 1, tabel 1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012702
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0012702
  - number: 7.1.b
    text: |-
      € 448, indien het een open bron betreft, waarvan de activiteit gelijk is aan, of meer bedraagt
      dan honderdmaal, doch niet meer dan honderd duizend maal de waarden, genoemd in de bij het
      [Besluit stralingsbescherming behorende bijlage 1, tabel 1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012702
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0012702
  - number: 7.1.c
    text: € 716, indien het een open bron betreft, waarvan de activiteit hoger is dan de onder b bedoelde waarden.
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel7
  - number: '7.2'
    text: |-
      [Artikel 25, derde en vierde lid, van het Besluit stralingsbescherming][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel25
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '25'
  - number: '9'
    text: |-
      Hij, aan wie een vergunning wordt verleend voor het vervoeren van radioactieve stoffen, is verplicht aan de staat
      een bedrag te betalen van € 358.
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel9
  - number: '10'
    text: |-
      Hij, aan wie een vergunning wordt verleend als bedoeld in
      [artikel 23, eerste lid, van het Besluit stralingsbescherming][ref1] is verplicht aan de staat een bedrag te
      betalen van:


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel23
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '23'
  - number: 10.a
    text: |-
      € 1 791, indien het betreft een toestel als bedoeld in [artikel 23, eerste lid, onder c, van dat besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel23
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '23'
  - number: 10.b
    text: |-
      € 400, en, ingeval de vergunning wordt verleend voor meer dan één toestel, € 48 voor elk extra toestel, indien het
      betreft een toestel als bedoeld in [artikel 23, eerste lid, onder a of b, van dat besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel23
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '23'
  - number: '11.1'
    text: |-
      Hij, aan wie een vergunning is verleend voor het vervoeren van splijtstoffen of radioactieve stoffen of voor het
      voorhanden hebben van genoemde stoffen bij opslag in verband met het vervoer, is, indien daaraan het voorschrift is
      verbonden, dat het vervoer of het voorhanden hebben dient te geschieden onder rijksgeleide of onder rijkstoezicht,
      verplicht aan de staat een bedrag te betalen van € 38 voor elk gewerkt uur of gedeelte van een uur gedurende
      hetwelk begeleiding heeft plaatsgevonden of toezicht is gehouden.
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel11
  - number: '11.2'
    text: |-
      Onverminderd het eerste lid is de vervoerder of zijn gemachtigde dan wel degene die voorhanden heeft verplicht aan
      de staat te betalen:
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel11
  - number: 11.2.a
    text: |-
      indien het vervoer plaatsheeft tussen 18.00 uur en 6.00 uur of op een zaterdag, een zondag dan wel een algemeen
      erkende feestdag als genoemd in [artikel 3 van de Algemene termijnenwet][ref1], of een bij of krachtens dat artikel
      daarmee gelijkgestelde dag, een bedrag van € 22 voor elk gewerkt uur of gedeelte van een uur gedurende hetwelk
      begeleiding heeft plaatsgevonden of toezicht is gehouden;


      [ref1]: https://wetten.overheid.nl/BWBR0002448#Artikel3
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002448
        artikel: '3'
  - number: 11.2.b
    text: |-
      indien het in verband met begeleiding of toezicht noodzakelijk is dat degene die begeleidt of toezicht houdt voor,
      tijdens of na zijn dienst buiten zijn standplaats nachtverblijf in een hotel moet houden, voor elk nachtverblijf
      een bedrag van € 54;
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel11
  - number: 11.2.c
    text: |-
      indien het vervoer later aanvangt dan het door of in overleg met de vervoerder of zijn gemachtigde dan wel degene
      die voorhanden heeft, vastgestelde tijdstip, een bedrag van € 22 voor elk uur of gedeelte van een uur van de
      daaruit voortvloeiende wachttijd van degene die begeleidt of toezicht houdt.
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel11
  - number: '11.3'
    text: |-
      Het tweede lid, onder a, is niet van toepassing op het vervoer per spoor tussen 18.00 uur en 6.00 uur op andere dan
      de in het tweede lid, onder a, genoemde dagen.
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel11
  - number: '11.4'
    text: |-
      Onverminderd het tweede lid is de vervoerder of zijn gemachtigde dan wel degene die voorhanden heeft, indien in een
      door of in overleg met de vervoerder of zijn gemachtigde dan wel degene die voorhanden heeft, vastgesteld tijdstip
      van aanvang van een transport op een zodanig tijdstip wijziging wordt gebracht dat degene die begeleidt of toezicht
      houdt zich reeds heeft begeven of reizende is naar de plaats waar het transport zou aanvangen, verplicht aan de
      staat een bedrag te betalen van € 22 voor elk uur of gedeelte van een uur van de daaruit voortvloeiende reistijd
      van degene die begeleidt of toezicht houdt.
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel11
  - number: '12'
    text: |-
      Indien gelijktijdig aan dezelfde persoon meerdere, met elkaar samenhangende vergunningen worden verleend,
      waarvoor bijdragen als in dit besluit bedoeld verschuldigd zijn, is slechts één bijdrage verschuldigd, waarvan
      het bedrag gelijk is aan het hoogste van de bedragen, welke op grond van dit besluit ter zake van die vergunningen
      verschuldigd zouden zijn.
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel12
  - number: '13.1'
    text: |-
      Indien een vergunning wordt verleend voor het oprichten of in werking brengen van een inrichting als bedoeld in
      [artikel 15, onder ][ref1], van de wet, dan wel voor het in een vaartuig aanbrengen, aangebracht houden of wijzigen
      van een uitrusting als bedoeld in [artikel 15, onder ][ref2], van de wet en ten aanzien van die inrichting of
      uitrusting in hetzelfde vaartuig reeds een vergunning als hiervoor bedoeld gold ten behoeve van een ander, in wiens
      plaats de aanvrager treedt, is geen bijdrage als in dit besluit bedoeld verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003418#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003418#Artikel15
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003418
        artikel: '15'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0003418
        artikel: '15'
        paragraaf: '8'
  - number: '13.2'
    text: |-
      Indien een vergunning wordt verleend voor een handeling, waarvoor ingevolge [artikel 15, onder ][ref1] van de wet
      een vergunning is vereist, en voor een gelijke handeling reeds een overeenkomstige vergunning gold ten behoeve van
      een ander, in wiens plaats de aanvrager treedt, is geen bijdrage als in dit besluit bedoeld verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003418#Artikel15
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003418
        artikel: '15'
        paragraaf: '8'
  - number: '14.1'
    text: |-
      De verplichting tot het betalen van een in dit besluit vastgestelde bijdrage ontstaat op de dag waarop de
      beroepstermijn met betrekking tot de beschikking, waarbij de vergunning werd verleend, is verstreken of, indien
      beroep is ingesteld, waarop op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel14
  - number: '14.2'
    text: |-
      Indien het betreft een jaarlijkse bijdrage als bedoeld in [artikel 5, tweede lid][ref1], ontstaat de verplichting
      tot betalen voor de eerste maal op de eerste dag waarop de betrokken vergunning van kracht is nadat dertig
      dagen zijn verstreken sinds de dag, waarop de beschikking, waarbij de vergunning werd verleend, is verzonden en
      vervolgens elk volgend jaar op dezelfde dag als waarop de verplichting voor de eerste maal ontstond.


      [ref1]: https://wetten.overheid.nl/BWBR0003418#Artikel5
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003418
        artikel: '5'
        paragraaf: '3'
  - number: '15'
    text: |-
      Onze Minister, wie het aangaat, deelt aan de betrokkene mede, welke bijdrage deze is verschuldigd, op welke wijze
      betaling van de bijdrage kan plaatsvinden en binnen welke termijn deze dient te geschieden.
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel15
  - number: '16.1'
    text: |-
      [Artikel 5, tweede lid][ref1], is van overeenkomstige toepassing ingeval een vergunning als daar bedoeld is
      verleend vóór het in werking treden van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003418#Artikel5
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003418
        artikel: '5'
        paragraaf: '3'
  - number: '16.2'
    text: |-
      Ingeval op de dag van in werking treden van dit besluit de vergunning van kracht is en dertig dagen zijn verstreken
      sinds de dag, waarop de beschikking, waarbij de vergunning werd verleend, is verzonden, ontstaat de verplichting
      tot betalen in afwijking van [artikel 14, tweede lid][ref1], voor de eerste maal op de dag van in werking treden
      van dit besluit en vervolgens elk volgend jaar op dezelfde dag als waarop de verplichting voor de eerste maal
      ontstond.


