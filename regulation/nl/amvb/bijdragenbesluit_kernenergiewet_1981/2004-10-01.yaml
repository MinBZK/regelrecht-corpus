    text: |-
      Hij, aan wie een vergunning wordt verleend voor het oprichten van een inrichting als bedoeld in
      [artikel 15, onder ][ref1], is verplicht aan de staat een bedrag te betalen van:


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel4
