      het chemisch opwerken van bestraalde splijtstoffen;
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel5
  - number: 5.1.b
    text: € 8 893, indien het een andere inrichting betreft.
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel5
  - number: '5.2'
    text: |-
      Hij, aan wie een vergunning wordt verleend voor het in werking houden van een inrichting als bedoeld in
      [artikel 15, onder ][ref1], is verplicht, zolang de vergunning van kracht is, jaarlijks aan de staat een bedrag te
      betalen van:


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel5
    references:
