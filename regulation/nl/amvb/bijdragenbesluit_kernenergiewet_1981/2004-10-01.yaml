    text: |-
      € 686 386, indien het betreft een inrichting voor de opwekking van elektrische of thermische energie, dan wel voor
      het chemisch opwerken van bestraalde splijtstoffen;
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel5
  - number: 5.2.b
    text: € 20 592, indien het een andere inrichting betreft.
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel5
  - number: '5.3'
    text: |-
      De verplichting, bedoeld in het tweede lid, vervalt indien de betrokken inrichting definitief buiten gebruik is
      gesteld.
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel5
  - number: 5a
    text: |-
      Hij, aan wie een vergunning wordt verleend voor het buiten gebruik stellen of ontmantelen van een inrichting als
      bedoeld in [artikel 15, onder b, van de wet][ref1], is verplicht aan de staat een bedrag te betalen van € 8 893.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: '6.1'
    text: |-
      Hij, aan wie een vergunning wordt verleend voor het aanbrengen in een vaartuig van een uitrusting als bedoeld in
      [artikel 15, onder c, van de wet][ref1], is verplicht aan de staat een bedrag te betalen van € 266 795.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0003418/2004-10-01#Artikel6
    references:
      - id: ref1
