  - number: 10.03a
    text: |-
      1 In verblijven, stuurhuizen en passagiersruimten mogen, ter bescherming van deze ruimten, slechts geschikte,
      automatisch werkende sprinklerinstallaties als vast ingebouwde brandblusinstallaties worden geïnstalleerd.

      2 Deze installaties mogen slechts door deskundige bedrijven worden ingebouwd of omgebouwd.

      3 Deze installaties moeten van staal of van gelijkwaardig niet brandbaar materiaal zijn gebouwd.

      4 Deze installaties moeten over de oppervlakken van de grootste te beschermen ruimte ten minste een hoeveelheid
      water van 5 l/m2 per minuut kunnen sproeien.

      5 Installaties die een kleinere hoeveelheid water sproeien moeten beschikken over een typegoedkeuring op grond van
      de IMO-Resolutie A.800 (19) dan wel van een andere door de Centrale Commissie voor de Rijnvaart erkende norm. De
      typegoedkeuring wordt uitgevoerd door een erkend classificatiebureau of door een gemachtigde testinstelling. De
      gemachtigde testinstelling moet voldoen aan de Europese normen inzake de algemene eisen aan de kundigheid van test-
      en kalibreerlaboratoria (EN ISO/IEC 17025: 2000).

      6 De installaties moeten:

      a. voor ingebruikstelling;

      b. voor hernieuwde ingebruikstelling na in werking te zijn geweest;

      c. na verandering of reparatie;

      d. met regelmaat tenminste elke twee jaar,

      door een deskundige worden gekeurd.

      7 Bij de keuring, bedoeld in het zesde lid, moet de deskundige controleren of de installaties aan de eisen van dit
      artikel voldoen.

      De keuring moet tenminste bestaan uit:

      a. inspectie van de buitenkant van de installatie als geheel;

      b. controle van de bedrijfszekerheid van de veiligheidssystemen en de sproeikoppen;

      c. controle van het systeem van druktanks en pompen.

      8 Betreffende de keuring moet een verklaring worden opgesteld die door de inspecteur wordt ondertekend en waarin de
      datum van de keuring is vermeld.

      9 Het aantal van de aanwezige installaties moet in het certificaat van onderzoek worden aangetekend.
