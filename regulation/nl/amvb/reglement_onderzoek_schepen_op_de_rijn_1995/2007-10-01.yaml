  - number: '8.01'
    text: |-
      1 Werktuigen alsmede de bijbehorende installaties moeten vakkundig zijn ontworpen, uitgevoerd en geïnstalleerd.

      2 Installaties die controle vereisen zoals stoomketels, andere drukvaten, alsmede hun toebehoren en liften moeten
      voldoen aan de voorschriften van één der Oeverstaten of van België.

      3 Er mogen alleen verbrandingsmotoren worden geïnstalleerd die brandstoffen gebruiken met een vlampunt boven 55° C.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel8.01
  - number: '8.02'
    text: |-
      1 Machine-installaties moeten zo zijn ingericht en opgesteld, dat zij voor bediening en onderhoud voldoende
      toegankelijk zijn en personen, die ze moeten bedienen of onderhouden, niet in gevaar kunnen worden gebracht. Zij
      moeten kunnen worden beveiligd tegen onopzettelijke inbedrijfstelling.

      2 Aan de hoofd- en hulpmotoren alsmede de stoomketels en drukvaten moeten beschermende inrichtingen zijn
      aangebracht; hetzelfde geldt voor hun toebehoren.

      3 Aandrijvingen voor de pers- en zuigventilatoren moeten in geval van nood ook buiten de ruimte waar zij zich
      bevinden en buiten de machinekamer uitgeschakeld kunnen worden.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel8.02
  - number: '8.03'
    text: |-
      1 De aandrijving van een schip moet op betrouwbare en snelle wijze aangezet, gestopt en van vooruit op achteruit of
      andersom gezet kunnen worden.

      2 Het kritieke peil van

      a. de temperatuur van het koelwater van de voortstuwingsmotoren;

      b. de druk van de smeerolie van de voortstuwingsmotoren en de transmissie;

      c. de olie- en luchtdruk van de omkeerinrichting van de voortstuwingsmotoren, de keerkoppeling of de schroeven;

      moet worden aangegeven door daartoe geschikte inrichtingen, die bij het bereiken van kritieke waarden een
      alarmsignaal in werking stellen.

      3 Bij schepen met slechts één voortstuwingsmotor mag, behalve ingeval van overtoeren, de motor niet automatisch
      worden stopgezet.

      4 Doorvoeringen van assen moeten zodanig zijn uitgevoerd dat geen waterverontreinigende smeermiddelen naar buiten
      kunnen treden.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel8.03
  - number: '8.04'
    text: |-
      1 Uitlaatgassen moeten volledig naar buitenboord worden afgevoerd.

      2 Het binnendringen van uitlaatgassen in de verschillende ruimten van het schip moet door doelmatige maatregelen
      zijn verhinderd. Uitlaatgassenleidingen die door verblijven of het stuurhuis gaan, moeten in die ruimten zijn
      voorzien van een gasdichte mantel. De ruimte tussen de uitlaatgassenleiding en de mantel moet in verbinding staan
      met de open lucht.

      3 Uitlaatgassenleidingen moeten zodaning zijn aangelegd en beschermd dat zij geen brand kunnen veroorzaken.

      4 In de machinekamer moeten uitlaatgassenleidingen voldoende geïsoleerd of gekoeld zijn. Buiten de machinekamer kan
      een beveiliging tegen aanraken voldoende zijn.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel8.04
  - number: '8.05'
    text: |-
      1 Vloeibare brandstoffen moeten zijn opgeslagen in tot de scheepsromp behorende of vast in het schip
      bevestigde tanks van staal of, wanneer dit wegens de constructie van het schip nodig is, van een met het oog op
      brandveiligheid gelijkwaardig materiaal. Dit geldt niet voor tanks van hulpaggregaten met een inhoud van maximaal
      12 l, die van fabriekswege hecht met deze zijn verbonden. Brandstoftanks mogen geen begrenzingsvlakken gemeen
      hebben met drinkwaterreservoirs.

      2 Deze tanks, alsmede brandstofleidingen en verdere toebehoren, moeten zodanig zijn uitgevoerd en ingericht dat
      zich geen brandstof of gas onopzettelijk in het inwendige van het schip kan verspreiden.

      Afsluitinrichtingen op brandstoftanks, die dienen voor het ontnemen van brandstof of voor de afwatering, moeten
      zelfsluitend zijn.

      3 Voor het aanvaringsschot mag zich geen brandstoftank bevinden.

      4 Dagtanks en hun appendages mogen niet zijn geplaatst boven motoren of uitlaatgassenleidingen.

      5 De vulopeningen van brandstoftanks moeten duidelijk zijn gekenmerkt.

      6 De vulleidingen van brandstoftanks moeten aan dek uitmonden, met uitzondering van die der dagtanks. De
      vulleidingen moeten voorzien zijn van een aansluitkoppeling volgens de Europese norm EN 12 827. Deze tanks moeten
      zijn voorzien van een ontluchtingsleiding die bovendeks in de open lucht uitmondt en zo zijn ingericht dat geen
      water kan binnendringen. De doorsnede van deze ontluchtingsleiding moet ten minste 1,25 maal zo groot zijn als de
      doorsnede van de vulleiding.

      Indien tanks voor vloeibare brandstoffen met elkaar in verbinding staan, moet de doorsnede van de
      verbindingsleiding ten minste 1,25 maal zo groot zijn als de doorsnede van de vulleiding.

      7 De uitgaande leidingen voor vloeibare brandstoffen moeten onmiddellijk bij de tanks zijn voorzien van een
      afsluitinrichting, die van het dek af kan worden bediend. Dit geldt niet voor brandstoftanks die rechtstreeks aan
      de motor zijn aangebouwd.

      8 Brandstofleidingen, hun verbindingen, afdichtingen en appendages moeten zijn vervaardigd uit materiaal dat
      bestand is tegen de te verwachten mechanische, chemische en thermische belasting. Brandstofleidingen mogen niet
      onderhevig zijn aan schadelijke invloeden van warmte en moeten over hun volle lengte gecontroleerd kunnen worden.

      9 Brandstoftanks moeten zijn voorzien van een peilinrichting die afleesbaar moet zijn tot aan de hoogste vulstand.
      De peilglazen moeten tegen beschadigingen zijn beschermd, aan de onderkant zijn voorzien van zelfsluitende
      afsluitinrichtingen en het boveneinde moet weer naar de tank zijn gevoerd, boven de hoogste vulstand. Het materiaal
      van de peilglazen moet bij normale omgevingstemperaturen niet vervormen.

      Smeerolietanks moeten zijn voorzien van een peilinrichting.

      10 a. Brandstoftanks moeten door geschikte technische inrichtingen aan boord, die in het certificaat van onderzoek
      onder nummer 52 moeten worden vermeld, zijn beveiligd tegen het uitstromen van brandstof tijdens het bunkeren.

      b. Wanneer brandstof wordt ingenomen van bunkerstations die door hun eigen technische inrichtingen tegen het
      uitstromen van brandstof aan boord tijdens het bunkeren beveiligd zijn, is het uitrustingsvoorschrift, bedoeld in
      onderdeel a en in het elfde lid, niet van toepassing.

      11 Indien brandstoftanks zijn uitgerust met een automatische uitschakelinrichting, moeten de meetelementen bij een
      tankvulstand van 97 % het bunkeren onderbreken; deze inrichtingen moeten voldoen aan de maatstaf «failsafe».

      Indien het meetelement een elektrisch contact in werking stelt, dat in de vorm van een binair signaal de van het
      bunkerstation afkomstige en gevoede stroomkring kan onderbreken, moet het signaal naar het bunkerstation kunnen
      worden overgebracht via een waterdichte apparatenstekker van een koppelingsinrichting volgens de internationale
      norm IEC 60309–1: 1999 voor gelijkstroom van 40 tot en met 50 V, kleur wit, geleidingsnok 10 uur.

      12 Tanks voor vloeibare brandstoffen moeten zijn voorzien van afsluitbare openingen voor reiniging en inspectie.

      13 Brandstoftanks die onmiddellijk aan de voortstuwingsmotoren en aan de voor de vaart noodzakelijke andere motoren
      zijn aangesloten, moeten zijn voorzien van een inrichting waardoor zowel optisch als akoestisch in het stuurhuis
      wordt aangegeven dat de hoeveelheid brandstof in de tank niet meer voldoende is voor een veilige voortzetting van
      de vaart.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel8.05
  - number: '8.06'
    text: |-
      1 Iedere waterdichte afdeling moet afzonderlijk kunnen worden gelenst. Dit geldt niet voor waterdichte afdelingen
      die tijdens de vaart gewoonlijk luchtdicht zijn afgesloten.

      2 Op schepen waarvoor een bemanning is voorgeschreven, moeten twee onafhankelijk van elkaar werkende lenspompen
      aanwezig zijn, die niet in dezelfde ruimte mogen staan, en waarvan er ten minste één door een motor wordt
      aangedreven. Indien deze schepen echter een motorvermogen hebben van minder dan 225 kW of een laadvermogen
      van minder dan 350 t, dan wel, in geval van schepen die niet bestemd zijn voor het vervoer van goederen, een
      waterverplaatsing van minder dan 250 m3, is een hand- of motorlenspomp voldoende.

      Elk der voorgeschreven pompen moet voor elke waterdichte afdeling te gebruiken zijn.

      3 De minimale capaciteit Q van de eerste lenspomp moet worden berekend volgens de volgende formule:

      ;

      dmoet worden berekend volgens de volgende formule:

      .

      De minimale capaciteit Q van de tweede lenspomp moet worden berekend volgens de volgende formule:

      ;

      d moet worden berekend volgens de volgende formule:

      .

      De afmeting d behoeft echter niet groter te zijn dan de afmeting d.

      Bij het berekenen van Q heeft l betrekking op de langste waterdichte afdeling.

      In deze formules betekent:

      l: de lengte van de desbetreffende waterdichte afdeling in [m];

      d: de rekenkundige inwendige diameter van de hoofdlensleiding in [mm];

      d: de rekenkundige inwendige diameter van de aftakking van de lensleiding in [mm].

      4 Indien de lenspompen zijn aangesloten op een lenssysteem moet de inwendige diameter van de lensleidingen ten
      minste afmeting d hebben, in mm, en de inwendige diameter van de aftakkingen ten minste afmeting d, in mm.

      Voor schepen met een lengte L van minder dan 25 m mogen de afmetingen d en d worden verminderd tot 35 mm.

      5 Er zijn slechts zelfaanzuigende lenspompen toegestaan.

      6 In iedere lensbare afdeling met een vlakke bodem en een breedte van meer dan 5 m moet zich aan stuurboord en aan
      bakboord tenminste één lenskorf bevinden.

      7 De achterpiek mag door middel van een gemakkelijk toegankelijke, zelfsluitende aftapinrichting, die naar de
      machinekamer loopt, gelenst kunnen worden.

      8 De aftakkingen van de leidingen van afzonderlijke afdelingen moeten door een vastzetbare terugslagklep aan de
      hoofdlensleiding zijn aangesloten.

      Afdelingen of andere ruimten, die als ballastruimten dienen, behoeven slechts via een afsluiter aan het lenssysteem
      te zijn aangesloten. Dit geldt niet voor laadruimen die zijn ingericht voor het opnemen van ballast. Het vullen
      van dergelijke laadruimen met ballastwater moet door een van de lensleiding gescheiden, vast geïnstalleerde
      ballastleiding of door aftakkingen geschieden, die als flexibele leidingen of door middel van beweegbare
      tussenstukken met de hoofdlensleiding kunnen worden verbonden. Bodemkleppen zijn hiervoor niet toegestaan.

      9 Vullingen van laadruimen moeten zijn voorzien van peilmogelijkheden.

      10 Indien een lensinrichting is uitgevoerd met vast aangebrachte leidingen, moeten de lensleidingen van de bilgen
      die voor het verzamelen van oliehoudend water zijn bestemd, zijn voorzien van door een Commissie van Deskundigen
      in gesloten stand verzegelde afsluiters. Het aantal en de plaats van deze afsluiters moeten worden vermeld in het
      certificaat van onderzoek.

      11 Het afgesloten zijn moet worden beschouwd als gelijkwaardig aan een verzegeling als bedoeld in het tiende lid.
      De sleutel of sleutels van de sloten van de afsluitinrichtingen moeten overeenkomstig gekenmerkt op een gemakkelijk
      toegankelijke en aangeduide plaats in de machinekamer worden bewaard.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel8.06
  - number: '8.07'
    text: |-
      1 Het tijdens het bedrijf van een schip vrijkomend oliehoudend water moet aan boord kunnen worden verzameld. In dit
      verband wordt de machinekamer-bilge aangemerkt als verzamelruimte.

      2 Voor het verzamelen van afgewerkte olie moeten in de machinekamer(s) één of meer speciaal daarvoor bestemde
      reservoirs zijn aangebracht die ten minste 1,5 keer de hoeveelheid afgewerkte olie uit de carters van alle
      ingebouwde verbrandingsmotoren en tandwielkasten, alsmede de hoeveelheid hydraulische olie afkomstig uit de
      hydraulische olietanks, kunnen bevatten.

      Aansluitingen voor het leeghalen van deze reservoirs moeten voldoen aan de Europese norm EN 1305: 1996.

      3 Voor schepen die slechts worden ingezet op korte trajecten kan de Commissie van Deskundigen ontheffing verlenen
      van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel8.07
  - number: '8.08'
    text: |-
      1 Het door een varend schip voortgebrachte geluid, in het bijzonder de door het aanzuigen van lucht en door de
      uitlaat van de motoren veroorzaakte geluiden, moet met daartoe geschikte middelen worden gedempt.

      2 Het door een varend schip voortgebrachte geluid mag op 25 m afstand zijdelings van de scheepswand niet meer
      bedragen dan 75 dB(A).

      3 Bij stilliggende schepen mag het geluid, behalve tijdens het laden en lossen, op 25 m afstand zijdelings van de
      scheepswand niet meer bedragen dan 65 dB(A).
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel8.08
  - number: 8a.01
    text: |-
      In dit hoofdstuk wordt verstaan onder:

      01. motor: een motor die werkt volgens het principe van de compressieontsteking (dieselmotor);

      02. typegoedkeuring: de beslissing waardoor de bevoegde autoriteit verklaart dat een motortype, een motorfamilie of
      een motorgroep aan de technische voorschriften van dit hoofdstuk voldoet wat betreft het niveau van de uitstoot van
      schadelijke gassen en luchtverontreinigende deeltjes uit de motor(en);

      03. inbouwkeuring: de procedure waarbij door de bevoegde autoriteit wordt gewaarborgd dat de in een vaartuig
      ingebouwde motor, met inbegrip van eventuele na de typegoedkeuring aangebrachte wijzigingen en/of afstellingen,
      voldoet aan de technische voorschriften van dit hoofdstuk wat betreft het niveau van de uitstoot van schadelijke
      gassen en luchtverontreinigende deeltjes;

      04. tussentijdse keuring: de procedure waarbij door de bevoegde autoriteit wordt gewaarborgd dat de in een
      vaartuig in gebruik zijnde motor, met inbegrip van eventuele na de inbouwkeuring aangebrachte wijzigingen en/of
      afstellingen, voldoet aan de technische voorschriften van dit hoofdstuk wat betreft het niveau van de uitstoot van
      schadelijke gassen en luchtverontreinigende deeltjes;

      05. bijzondere keuring: de procedure waarbij door de bevoegde autoriteit wordt gewaarborgd dat de in een vaartuig
      in gebruik zijnde motor na iedere belangrijke wijziging nog aan de technische voorschriften van dit hoofdstuk
      voldoet wat betreft het niveau van de uitstoot van schadelijke gassen en luchtverontreinigende deeltjes;

      06. motortype: een groepering van motoren die met betrekking tot de essentiële motorkenmerken vermeld in
      [bijlage J, deel II, aanhangsel 1][ref1], niet verschillend zijn; er dient tenminste één eenheid van een motortype
      te zijn gebouwd;

      07. motorfamilie: een door de fabrikant vastgestelde en door de bevoegde autoriteit type goedgekeurde groepering
      van motoren, die vanwege hun ontwerp naar verwachting vergelijkbare eigenschappen hebben wat betreft het niveau van
      de uitstoot van schadelijke gassen en luchtverontreinigende deeltjes, en die aan de voorschriften van dit hoofdstuk
      voldoen;

      08. motorgroep: een door de fabrikant vastgestelde en door de bevoegde autoriteit goedgekeurde groepering van
      motoren, die vanwege hun ontwerp naar verwachting vergelijkbare eigenschappen hebben wat betreft het niveau van de
      uitstoot van schadelijke gassen en luchtverontreinigende deeltjes, en die aan de voorschriften van dit hoofdstuk
      voldoen, waarbij een afstelling of een wijziging van afzonderlijke motoren na de typegoedkeuring toegelaten is
      binnen vastgelegde grenzen;

      09. basismotor: een uit een motorfamilie of motorgroep geselecteerde motor die voldoet aan de voorschriften van
      [bijlage J, deel I, onderdeel 5][ref2]

      10. nominaal vermogen: het netto vermogen van de motor bij nominaal toerental en volle belasting;

      11. fabrikant: de persoon of organisatie die tegenover de bevoegde autoriteit verantwoordelijk is voor alle
      aspecten van de typegoedkeuringsprocedure en voor de conformiteit van de produktie. Het is niet noodzakelijk dat
      deze persoon of organisatie rechtstreeks betrokken is bij alle fasen van de bouw van de motor. Indien de motor pas
      na zijn oorspronkelijke fabricage door veranderingen en aanvullingen wordt aangepast voor gebruik op een vaartuig
      in de zin van dit hoofdstuk, is de fabrikant normalerwijs de persoon of de organisatie die deze veranderingen of
      aanvullingen heeft uitgevoerd;

      12. inlichtingenformulier: het formulier, bedoeld in [bijlage J, deel II][ref3], waarin staat vermeld welke
      gegevens door de aanvrager moeten worden verstrekt;

      13. informatiedossier: het geheel van gegevens, tekeningen, foto's en andere bescheiden die de aanvrager
      overeenkomstig de eisen van het inlichtingenformulier aan de technische dienst of de bevoegde autoriteit moet
      verstrekken;

      14. informatiepakket: het informatiedossier plus alle testrapporten en andere documenten die de technische dienst
      of de bevoegde autoriteit tijdens de uitvoering van hun taken aan het informatiedossier hebben toegevoegd;

      15. certificaat van typegoedkeuring: het document, bedoeld in [bijlage J, deel III][ref4], waarin de bevoegde
      autoriteit de typegoedkeuring vaststelt;

      16. proces-verbaal van de motorkenmerken: het document, bedoeld in [bijlage J, deel VIII][ref5], waarin alle
      kenmerken van de motor, met inbegrip van de onderdelen (componenten) en afstellingen die een weerslag hebben op het
      niveau van de uitstoot van schadelijke gassen en luchtverontreinigende deeltjes evenals alle veranderingen daarvan,
      vastgelegd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007858
      [ref2]: https://wetten.overheid.nl/BWBR0007858
      [ref3]: https://wetten.overheid.nl/BWBR0007858
      [ref4]: https://wetten.overheid.nl/BWBR0007858
      [ref5]: https://wetten.overheid.nl/BWBR0007858
