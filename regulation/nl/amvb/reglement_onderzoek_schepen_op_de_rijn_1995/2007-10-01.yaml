articles:
  - number: '1.01'
    text: |-
      In dit reglement wordt verstaan onder:

        - **Typen vaartuigen** 01. *vaartuig*: een schip of een drijvend werktuig; 02. *schip*: een binnenschip of een
      zeeschip; 03. *binnenschip*: een schip dat uitsluitend of overwegend bestemd is voor de vaart op de binnenwateren;
      04. *zeeschip*: een schip dat is toegelaten voor de zee- of kustvaart en overwegend daartoe is bestemd; 05.
      *motorschip*: een motortankschip of een motorvrachtschip; 06. *motortankschip*: een schip dat is bestemd voor het
      vervoer van goederen in vaste tanks en gebouwd om door middel van zijn eigen mechanische middelen tot voortbeweging
      zelfstandig te varen; 07. *motorvrachtschip*: een schip, niet zijnde een motortankschip, dat is bestemd voor het
      vervoer van goederen en gebouwd om door middel van zijn eigen mechanische middelen tot voortbeweging zelfstandig
      te varen; 08. *kanaalspits*: een binnenschip waarvan de lengte niet meer dan 38,50 m en de breedte niet meer
      dan 5,05 m bedraagt en dat gewoonlijk op het Rijn-Rhône kanaal vaart; 09. *sleepboot*: een schip dat speciaal
      is gebouwd om te slepen; 10. *duwboot*: een schip dat speciaal is gebouwd voor het voortbewegen van een duwstel;
      11. *sleepschip*: een sleeptankschip of een sleepvrachtschip; 12. *sleeptankschip*: een schip dat is bestemd voor
      het vervoer van goederen in vaste tanks en is gebouwd om te worden gesleept zonder eigen mechanische middelen tot
      voortbeweging, dan wel met eigen mechanische middelen tot voortbeweging die slechts verplaatsingen over kleine
      afstanden toelaten; 13. *sleepvrachtschip*: een schip, niet zijnde een sleeptankschip, dat is bestemd voor het
      vervoer van goederen en is gebouwd om te worden gesleept zonder eigen mechanische middelen tot voortbeweging, dan
      wel met eigen mechanische middelen tot voortbeweging die slechts verplaatsingen over kleine afstanden toelaten;
      14. *duwbak*: een tankduwbak, een vrachtduwbak of een zeeschipbak; 15. *tankduwbak*: een schip dat is bestemd
      voor het vervoer van goederen in vaste tanks en gebouwd of in het bijzonder geschikt is om te worden geduwd
      zonder eigen mechanische middelen tot voortbeweging, dan wel met eigen mechanische middelen tot voortbeweging
      die slechts verplaatsingen over kleine afstanden toelaten, wanneer het geen deel uitmaakt van een duwstel; 16.
      *vrachtduwbak*: een schip, niet zijnde een tankduwbak, dat is bestemd voor het vervoer van goederen en gebouwd of
      in het bijzonder geschikt is om te worden geduwd zonder eigen mechanische middelen tot voortbeweging, dan wel met
      eigen mechanische middelen tot voortbeweging die slechts verplaatsingen over kleine afstanden toelaten, wanneer het
      geen deel uitmaakt van een duwstel; 17. *zeeschipbak*: een duwbak, die is gebouwd om aan boord van een zeeschip te
      kunnen worden vervoerd en om de binnenwateren te bevaren; 18. *passagiersschip*: een schip voor dagtochten of een
      hotelschip dat is gebouwd en ingericht voor het vervoer van meer dan 12 passagiers; 19. *schip voor dagtochten*:
      een passagiersschip waarop zich geen hutten bevinden voor overnachting van passagiers; 20. *hotelschip*: een
      passagiersschip waarop zich hutten bevinden voor overnachting van passagiers; 20a. *snel schip*: een schip met
      eigen mechanische middelen tot voortbeweging dat een snelheid ten opzichte van het water kan bereiken van meer
      dan 40 km/u; 21. *drijvend werktuig*: een drijvend bouwsel waarop zich werkinstallaties bevinden, zoals kranen,
      baggermolens, hei-installaties of elevatoren; 22. *schip bestemd voor bouwwerkzaamheden*: een schip dat vanwege
      zijn bouwwijze en uitrusting geschikt en bestemd is om voor werkzaamheden op bouwlokaties te worden gebruikt, zoals
      spoelbakken, onderlossers, dekschuiten, pontons of steenstorters; 23. *pleziervaartuig*: een schip, niet zijnde
      een passagiersschip, dat is bestemd voor sportieve en recreatieve doeleinden; 23a. *bijboot*: een boot om gebruikt
      te worden voor vervoer, redding, berging en werkzaamheden; 24. *drijvende inrichting*: een drijvend bouwsel dat
      vanwege zijn bestemming in de regel niet wordt verplaatst, zoals een badinrichting, een dok, een steiger of een
      botenhuis; 25. *drijvend voorwerp*: een vlot, alsmede een ander voorwerp of samenstel van voorwerpen dat geschikt
      is gemaakt om te varen en dat geen schip, drijvend werktuig of drijvende inrichting is;
        - **Samenstellen van vaartuigen** 26. *samenstel*: een hecht samenstel of een sleep; 27. *formatie*: vorm van de
      samenstelling van een samenstel; 28. *hecht samenstel*: een duwstel of een gekoppeld samenstel; 29. *duwstel*: een
      hecht samenstel van vaartuigen, waarvan er ten minste één is geplaatst vóór het vaartuig met motoraandrijving dat
      dient voor het voortbewegen van het samenstel, dan wel voor de beide vaartuigen met motoraandrijving die dienen
      voor het voortbewegen van het samenstel en die worden aangeduid als "duwboot" of "duwboten". Hieronder wordt ook
      verstaan een duwstel dat is samengesteld uit een duwend en een geduwd vaartuig waarvan de koppelingen een beheerst
      knikken mogelijk maken; 30. *gekoppeld samenstel*: een samenstel van langszijde van elkaar vastgemaakte vaartuigen,
      waarvan er geen is geplaatst vóór het vaartuig met motoraandrijving dat dient voor het voortbewegen van het
      samenstel; 31. *sleep*: een samenstel van één of meer vaartuigen, drijvende inrichtingen of drijvende voorwerpen,
      dat wordt gesleept door één of meer tot het samenstel behorende vaartuigen met motoraandrijving;
        - **Bijzondere ruimten van vaartuigen** 32. *hoofdmachinekamer*: de ruimte waarin de voortstuwingsmotoren zijn
      opgesteld; 33. *machinekamer*: een ruimte waarin verbrandingsmotoren zijn opgesteld; 34. *ketelruim*: een ruimte
      waarin een met brandstof gestookte inrichting voor het opwekken van stoom of het verwarmen van thermische olie
      is opgesteld; 35. *gesloten opbouw*: een doorlopende vaste en waterdichte opbouw met vaste wanden die blijvend
      en waterdicht met het dek zijn verbonden; 36. *stuurhuis*: de ruimte waarin de voor het voeren van het schip
      noodzakelijke bedienings- en controleapparatuur is opgesteld; 37. *verblijf*: de ruimte die bestemd is voor de
      gewoonlijk aan boord verblijvende personen, met inbegrip van keukens, provisiekamers, toiletten, wasgelegenheden,
      washokken, portalen en gangen, met uitzondering van het stuurhuis; 37a. *passagiersverblijf*: voor passagiers
      aan boord aangewezen ruimten en afgesloten zones zoals salons, kantoren, verkoopruimten, kapsalons, droogruimten,
      wasserijen, sauna's, toiletten, wasgelegenheden, gangen, verbindingsgangen en open trappenhuizen; 37b.
      *controlepost*: een stuurhuis, een ruimte waarin een noodstroominstallatie dan wel onderdelen daarvan aanwezig
      zijn of een ruimte met een permanent door boordpersoneel of leden van de bemanning bezette post, zoals voor
      brandmeldinstallaties, afstandsbedieningen van deuren of brandkleppen; 37c. *trappenschacht*: een schacht van
      een binnen het schip gelegen trap of van een lift; 37d. *verblijfsruimte*: een ruimte van een verblijf of een
      passagiersverblijf. Op passagiersschepen zijn keukens geen verblijfsruimten; 37e. *keuken*: een ruimte met een
      fornuis of een vergelijkbare kookgelegenheid; 37f. *voorraadruimte*: een ruimte voor de opslag van brandbare
      vloeistoffen of een ruimte met een vloeroppervlak van meer dan 4 m2 voor de opslag van voorraden; 38. *laadruim*:
      een naar voren en achteren door schotten begrensd, open of door luiken gesloten deel van het schip, dat is bestemd
      voor het vervoer van goederen als stukgoed of in bulk, dan wel voor het onderbrengen van tanks die onafhankelijk
      zijn van de scheepsromp; 39. *vaste tank*: een met het schip verbonden tank, waarbij de tankwanden kunnen worden
      gevormd ofwel door de scheepsromp zelf ofwel door wanden die onafhankelijk zijn van de scheepsromp; 40. *werkplek*:
      een gebied waar de bemanning zijn werk moet verrichten, met inbegrip van loopplank, slingergiek en bijboot; 41.
      *verkeersweg*: een gebied dat gewoonlijk dient voor het verplaatsen van personen en goederen; 41a. *veilige zone*:
      een gebied dat aan de buitenkant wordt begrensd door een loodrecht vlak, dat op een afstand van 1/5 B evenwijdig
      aan de scheepshuid in het vlak van de grootste inzinking loopt; 41b. *verzamelruimten*: ruimten op het schip die
      speciaal beschermd zijn en waar personen zich in geval van gevaar moeten ophouden; 41c. *evacuatieruimten*: deel
      van de verzamelruimten op het schip van waar uit een evacuatie van personen kan worden gerealiseerd;
        - **Scheepsbouwkundige begrippen** 42. *vlak van de grootste inzinking*: het vlak door de waterlijn, overeenkomende
      met de grootst mogelijke inzinking waarbij het vaartuig mag varen; 43. *veiligheidsafstand*: de afstand tussen
      het vlak van de grootste inzinking en het daaraan evenwijdige vlak door het laagste punt waarboven het vaartuig
      niet meer als waterdicht wordt beschouwd; 43a. *resterende veiligheidsafstand*: de bij slagzij van het vaartuig
      aanwezige loodrechte afstand tussen het wateroppervlak en het laagste punt van de ingedompelde zijde, waarboven
      het vaartuig niet meer als waterdicht wordt beschouwd; 44. *vrijboord*: de afstand tussen het vlak van de grootste
      inzinking en het daaraan evenwijdige vlak door het laagste punt van het gangboord of, bij ontbreken van een
      gangboord, het laagste punt van het vaste boord; 44a. *resterend vrijboord*: de bij slagzij van het vaartuig
      aanwezige loodrechte afstand tussen het wateroppervlak en de bovenkant van het dek op het laagste punt van de
      ondergedompelde zijde of, indien er geen dek is, het laagste punt van het vaste boord; 45. *indompelingsgrenslijn*:
      een denkbeeldige lijn op de boordwand, die ten minste 10 cm onder het schottendek en ten minste 10 cm onder het
      laagste niet waterdichte punt van de boordwand loopt. Bij ontbreken van een schottendek moet worden uitgegaan
      van een lijn, die ten minste 10 cm onder de laagste lijn loopt tot waar de buitenbeplating waterdicht is; 46.
      *waterverplaatsing [V]*: het ingedompelde volume van het schip in m3; 47. *deplacement [D]*: totaal gewicht van
      het schip met inbegrip van de lading in t; 48. *blokcoëfficiënt* of *C*: de verhouding van de waterverplaatsing
      tot het product van lengte L x breedte B x diepgang T;Â» 49. *lateraal oppervlak boven de waterlijn [A]*: het
      zijvlak van het schip boven de waterlijn in m²; 50. *schottendek*: het dek tot waar de voorgeschreven waterdichte
      schotten zijn opgetrokken en vanwaar het vrijboord wordt gemeten; 51. *schot*: een over het algemeen verticale
      wand, dienend voor de indeling van het schip, en grenzend aan de scheepsbodem, boordwanden of andere schotten en
      die tot een zekere hoogte wordt opgetrokken; 52. *dwarsschot*: een schot dat van boordwand tot boordwand reikt;
      53. *wand*: een over het algemeen verticaal scheidingsvlak; 54. *scheidingswand*: een niet waterdichte wand;
      55. *lengte [L]*: de grootste lengte van de scheepsromp in m, het roer en de boegspriet niet inbegrepen; 56.
      *lengte over alles*: de grootste lengte van het vaartuig in m met inbegrip van alle vaste aanbouwsels, zoals delen
      van roer- en voortstuwingsinstallaties, werktuigbouwkundige inrichtingen en dergelijke (ten hoogste toegelaten
      afmeting in de zin van het [Rijnvaartpolitiereglement][ref1]); 57. *lengte [L*  *]*: de in het vlak van de
      grootste inzinking van het schip gemeten grootste lengte van de scheepsromp in m; 58. *breedte [B]*: de grootste
      breedte van de scheepsromp in m, gemeten op de buitenkant van de huidbeplating (schoepraderen, schuurlijsten en
      dergelijke niet inbegrepen); 59. *breedte over alles*: de grootste breedte van het vaartuig in m met inbegrip
      van alle vaste aanbouwsels, zoals schoepraderen, schuurlijsten, werktuigbouwkundige inrichtingen en dergelijke
      (ten hoogste toegelaten breedte in de zin van het [Rijnvaartpolitiereglement][ref2]); 60. *breedte [B*  *]*: de
      grootste breedte van de scheepsromp, gemeten in het vlak van de grootste inzinking van het schip, op de buitenkant
      van de huidbeplating in m; 61. *holte [H]*: kleinste verticale afstand tussen de onderkant van de bodembeplating
      of van de kiel en het laagste punt van het dek aan de zijde van het schip in m; 62. *diepgang [T]*: de verticale
      afstand van het laagste punt van de scheepsromp aan de onderkant van de bodembeplating of van de kiel tot het vlak
      van de grootste inzinking van de scheepsromp in m; 63. *voorloodlijn*: de loodrechte lijn door het snijpunt van
      de voorzijde van de scheepsromp met het vlak van de grootste inzinking; 64. *vrije breedte van het gangboord*:
      de afstand tussen de loodrechte lijn door het meest ver in het gangboord uitstekende deel van het luikhoofd en de
      loodrechte lijn door de binnenkant van de beveiliging tegen vallen (reling, voetlijst) aan de buitenkant van het
      gangboord;
        - **Stuurinrichtingen** 65. *stuurinrichting*: iedere voor het sturen van het schip benodigde inrichting die
      voor het bereiken van de manoeuvreereigenschappen als bedoeld in [hoofdstuk 5][ref3] moet worden gebruikt; 66.
      *roer*: het roerblad of de roerbladen met de roerkoning en met inbegrip van het kwadrant, de helmstok en de
      verbindingsdelen met de stuurmachine; 67. *stuurmachine*: het deel van de stuurinrichting dat de beweging van
      het roer bewerkstelligt; 68. *stuurmachine-aandrijving*: de aandrijving van de stuurmachine vanaf de energiebron
      tot de verbinding met de stuurmachine; 69. *energiebron*: de energieverzorging van de stuurmachine-aandrijving
      en van de besturing vanuit het boordnet, een accumulator of een verbrandingsmotor; 70. *besturing*: de elementen
      en stroomkringen voor het bedienen van een mechanische stuurmachine-aandrijving; 71. *aandrijfinstallatie van
      de stuurmachine*: de stuurmachine-aandrijving met inbegrip van de bijbehorende besturing en energiebron; 72.
      *handaandrijving*: een aandrijving waarbij de beweging van het roer wordt bewerkstelligd door een handbewogen
      stuurwiel met mechanische of hydraulische overbrenging, zonder gebruik van een extra energiebron; 73.
      *handhydraulische aandrijving*: een handaandrijving met hydraulische overbrenging; 74. *stuurautomaat*: een
      inrichting die, afhankelijk van de ingestelde waarde, een bepaalde draaisnelheid van het schip automatisch
      bewerkstelligt en handhaaft; 75. *éénmansstuurstelling voor het varen op radar*: een stuurstelling die zodanig is
      ingericht dat het schip gedurende het varen op radar door één persoon kan worden gevoerd;
        - **Eigenschappen van constructiedelen en materialen** 76. *waterdicht*: constructiedelen of inrichtingen die zo
      zijn uitgevoerd dat het binnendringen van water wordt verhinderd; 77. *spatwater- en regendicht*: constructiedelen
      of inrichtingen die zo zijn uitgevoerd dat zij onder normale omstandigheden slechts een onbeduidende hoeveelheid
      water doorlaten; 78. *gasdicht*: constructiedelen of inrichtingen die zo zijn uitgevoerd dat het doordringen van
      gassen of dampen wordt verhinderd; 79. *onbrandbaar*: een materiaal dat niet brandbaar is en geen ontvlambare
      gassen ontwikkelt in zodanige hoeveelheden dat deze bij verhitting tot ongeveer 750 °C tot zelfontbranding
      overgaan; 80. *moeilijk ontvlambaar*: een materiaal dat zelf of waarbij tenminste de oppervlakken daarvan het
      uitbreiden van een brand volgens de testprocedure als bedoeld in [artikel 15.11, eerste lid, onder c][ref4],
      beperken; 81. *brandwerendheid*: de eigenschap van constructiedelen of inrichtingen die is aangetoond met de
      testprocedure als bedoeld in [artikel 15.11, eerste lid, onder d][ref5]; 81a. *Code voor brandtestprocedures*: de
      bij de resolutie MSC.61(67) van het maritieme veiligheidscomité van de IMO aangenomen Internationale code voor de
      toepassing van brandtestprocedures;
        - **Radarapparaten** 82. *radarapparaat*: hulpmiddel bij de navigatie voor de registratie en de weergave van
      de omgeving en het verkeer; 83. *Inland ECDIS*: gestandaardiseerd systeem voor de elektronische weergave van
      binnenvaartkaarten en de daarmee verbonden informatie, dat geselecteerde informatie uit een specifiek geproduceerde
      elektronische binnenvaartkaart en naar keuze informatie van andere navigatiesensoren weergeeft; 84. *Inland
      ECDIS apparaat*: apparaat voor de weergave van elektronische binnenvaartkaarten, dat in de informatiemodus
      en de navigatiemodus gebruikt kan worden; 85. *informatiemodus*: gebruik van Inland ECDIS alleen voor
      informatiedoeleinden zonder geïntegreerd radarbeeld; 86. *navigatiemodus*: gebruik van Inland ECDIS bij het sturen
      van het schip met geïntegreerd radarbeeld;
        - **Overige begrippen** 87. *erkend classificatiebureau*: een classificatiebureau dat is erkend door alle
      Oeverstaten en België, te weten: Germanischer Lloyd, Bureau Veritas en Lloyd's Register of Shipping. 88. *hoogste
      klasse*: een schip heeft de hoogste klasse, indien: – de scheepsromp met inbegrip van de roerinstallatie en het
      manoeuvreersysteem alsmede de uitrusting met ankers en kettingen beantwoordt aan de voorschriften van een erkend
      classificatiebureau en is gebouwd en getest onder toezicht daarvan; – de drijfinrichting alsmede de voor het
      gebruik aan boord noodzakelijke hulpmotoren en inrichtingen op het gebied van machinebouw en elektriciteit zijn
      aangelegd en getest volgens de voorschriften van dit classificatiebureau, de inbouw daarvan onder toezicht van het
      classificatiebureau is uitgevoerd en de installatie als geheel na de inbouw door het bureau met succes is beproefd;
      89. *boordpersoneel*: alle aan boord van een passagiersschip aangestelde personen die niet tot de bemanning
      behoren; 90. *personen met beperkte mobiliteit*: personen die specifieke moeilijkheden hebben bij het gebruik
      van openbare vervoermiddelen, zoals oudere mensen, gehandicapten, personen met een handicap op het gebied van de
      zintuigen, rolstoelgebruikers, zwangere vrouwen en personen die kleine kinderen begeleiden.


