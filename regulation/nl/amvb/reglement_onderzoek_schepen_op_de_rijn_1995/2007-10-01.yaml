  - number: '19.03'
    text: |-
      [Hoofdstuk 23][ref1] is niet van toepassing. De bemanning moet ten minste bestaan uit:

      a. een schipper die houder is van het kanaalspitsenpatent als bedoeld in het [Reglement Rijnpatenten][ref2];

      b. een persoon die ten minste 16 jaar oud is en die in staat is te helpen bij het manoeuvreren met het schip.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Hoofdstuk23
