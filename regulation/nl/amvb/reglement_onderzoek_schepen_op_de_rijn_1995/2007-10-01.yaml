      1 Algemeen

      De in het tweede lid gestelde testvoorwaarden zijn uitsluitend van toepassing op elektronische apparaten die voor
      stuurinrichtingen en machine-installaties voor de voortbeweging van het vaartuig, met inbegrip van de daarbij
      behorende randapparatuur, benodigd zijn.

      2 Testvoorwaarden

      a. De volgende testbelastingen mogen niet leiden tot schade aan of verkeerd functioneren van elektronische
      apparaten. De tests overeenkomstig de desbetreffende internationale normen (zoals IEC-Publ. 92-504) moeten, met
      uitzondering van de koudetest, met een ingeschakeld apparaat worden uitgevoerd, waarbij de functie moet worden
      getest.

      b. Spannings- en frequentieafwijkingen:












                        afwijkingen





                        eenheid


                        blijvend


                        kortstondig






                        Algemeen


                        frequentie


                        ± 5%


                        ± 10% 5 s




                        spanning


                        ± 10%


                        ± 20% 1,5 s




                        Accumulatorwerking


                        spanning


                        + 30%/– 25%







      c. Warmtetest:

      Het te testen apparaat wordt binnen een half uur tot op 55° C opgewarmd en wordt na het bereiken van deze
      temperatuur gedurende 16 uren op deze temperatuur gehouden. Aansluitend wordt een functietest uitgevoerd.

      d. Koudetest:

      Het te testen apparaat wordt in uitgeschakelde toestand tot op -25° C afgekoeld en gedurende twee uren op deze
      temperatuur gehouden. Aansluitend wordt de temperatuur tot op 0° C verhoogd en een functietest uitgevoerd.

      e. Trillingstest:

      Trillingstests moeten bij de resonantiefrequentie van het apparaat of het onderdeel in de drie richtingsassen voor
      de duur van telkens 90 minuten worden uitgevoerd. Indien geen bijzondere resonantie wordt geconstateerd, vindt de
      trillingstest plaats bij 30 Hz.

      De trillingstest wordt uitgevoerd met een sinusvormige slingering tussen de volgende grenzen:

      Algemeen:

      f = 2,0 tot 13,2 Hz; a = ± 1 mm

      (amplitude a = ½ slingerbreedte)

      f = 13,2 Hz tot 100 Hz: versnelling ± 0,7 g.

      Apparaten voor montage op dieselmotoren of stuurmachines moeten als volgt worden getest:

      f = 2,0 tot 25 Hz; a = ± 1,6 mm

      (amplitude a = ½ slingerbreedte)

      f = 25 Hz tot 100 Hz; versnelling ± 4 g.

      Voelers voor montage in uitlaatgassenleidingen van dieselmotoren kunnen worden blootgesteld aan beduidend hogere
      belastingen. Hiermee moet bij de tests rekening worden gehouden.

      f. Tests van de elektromagnetische verdraagbaarheid moeten op basis van IEC-Publ. 801-2, 801-3, 801-4, 801-5 met
      het testniveau 3 worden uitgevoerd.

      g. Het bewijs dat de apparaten voldoen aan deze testvoorwaarden, moet door de fabrikant worden geleverd. Als bewijs
      geldt ook een verklaring van een erkend classificatiebureau.
