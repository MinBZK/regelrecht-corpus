    text: |-
      1 Onverminderd het tweede lid en [artikel 22b.02, tweede lid][ref1], gelden voor snelle schepen de
      [hoofdstukken 3 tot en met 15][ref2] met uitzondering van:

      a. [artikel 3.04, zesde lid, tweede alinea][ref3];

      b. [artikel 8.08, tweede lid, tweede zin][ref4];

      c. [artikel 11.02, vierde lid, tweede en derde zin][ref5];

      d. [artikel 12.02, vierde lid, tweede zin][ref6];

      e. [artikel 15.06, derde lid, onderdeel a, tweede zin][ref7].

      2 In afwijking van [artikel 15.02, negende lid][ref8], en [artikel 15.15, zevende lid][ref9], moeten alle deuren in
      schotten op afstand kunnen worden bediend.

      3 In afwijking van [artikel 6.02, eerste lid][ref10], moet bij uitvallen of storing van de aandrijving van de
      stuurmachine onverwijld een tweede onafhankelijke aandrijving van de stuurmachine dan wel een handaandrijving in
      werking worden gesteld.

      4 Behalve de eisen van deel II gelden voor snelle schepen de [artikelen 22b.04 tot en met 22b.12][ref11].


