  - number: 8a.09
    text: |-
      1 De bevoegde autoriteit, die een typegoedkeuring verleent, vergewist er zich van tevoren van, zo nodig in
      samenwerking met de andere bevoegde autoriteiten, dat de met betrekking tot [bijlage J, deel I, onderdeel 4][ref1],
      passende voorzorgsmaatregelen zijn getroffen om een doeltreffende controle van de conformiteit van de produktie
      te waarborgen.

      2 De bevoegde autoriteit, die een typegoedkeuring heeft verleend, vergewist er zich van, zo nodig in samenwerking
      met de andere bevoegde autoriteiten, dat de in het eerste lid bedoelde voorzorgsmaatregelen nog steeds afdoende
      zijn en elke geproduceerde motor die krachtens dit hoofdstuk van een typegoedkeuringsnummer is voorzien nog steeds
      beantwoordt aan de beschrijving die in het certificaat van typegoedkeuring, en de daarbij behorende bijlagen inzake
      het goedgekeurde motortype, de goedgekeurde motorfamilie of motorgroep is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0007858
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel8a.09
    references:
      - id: ref1
        bwb_id: BWBR0007858
  - number: 8a.10
    text: |-
      1 Er is sprake van non-conformiteit met het goedgekeurde motortype, de goedgekeurde motorfamilie of de goedgekeurde
      motorgroep, indien er afwijkingen worden vastgesteld van de kenmerken in het certificaat van typegoedkeuring of
      eventueel in het informatiepakket, indien deze afwijkingen niet door de bevoegde autoriteit die de typegoedkeuring
      heeft verleend zijn toegestaan op grond van artikel 8a.05, derde lid.

      2 Indien de bevoegde autoriteit, die een typegoedkeuring heeft verleend, vaststelt dat motoren, die van een
      certificaat van conformiteit of van een goedkeuringsmerk zijn voorzien, niet conform zijn met het motortype, de
      motorfamilie of de motorgroep waaraan zij de goedkeuring heeft verleend, neemt zij de nodige maatregelen om ervoor
      te zorgen dat de in produktie zijnde motoren opnieuw in overeenstemming worden gebracht met het goedgekeurde
      motortype, de goedgekeurde motorfamilie of motorgroep. De bevoegde autoriteit, die de non-conformiteit heeft
      vastgesteld, stelt de andere bevoegde autoriteiten en het secretariaat van de Centrale Commissie voor de Rijnvaart
      in kennis van de genomen maatregelen, die kunnen leiden tot de intrekking van de typegoedkeuring.

      3 Indien een bevoegde autoriteit kan aantonen dat motoren die van een typegoedkeuringsnummer zijn voorzien niet
      conform zijn met het goedgekeurde motortype, de goedgekeurde motorfamilie of motorgroep, kan zij de bevoegde
      autoriteit die de typegoedkeuring heeft verleend verzoeken te controleren of de in produktie zijnde motoren conform
      zijn met het goedgekeurde motortype, de goedgekeurde motorfamilie of motorgroep. De hiertoe vereiste maatregelen
      moeten binnen zes maanden na de datum van het verzoek worden genomen.

      4 De bevoegde autoriteiten stellen elkaar in kennis van en informeren het secretariaat van de Centrale Commissie
      voor de Rijnvaart binnen één maand over de intrekking van een typegoedkeuring en van de redenen daarvoor.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel8a.10
  - number: 8a.11
    text: |-
      1 Bij gelegenheid van de inbouwkeuring, bedoeld in [artikel 8a.02, vierde lid][ref1], van de tussentijdse
      keuring, bedoeld in [artikel 8a.02, vijfde lid][ref2], en van de bijzondere keuring, bedoeld in
      [artikel 8a. 02, zesde lid][ref3], verifieert de bevoegde autoriteit de feitelijke toestand van de motor met
      betrekking tot de onderdelen, de ijking en de afstellingen van de parameters zoals die in het proces-verbaal van de
      motorkenmerken zijn gespecificeerd.

      Indien een bevoegde autoriteit vaststelt, dat een motor niet conform is met het goedgekeurde motortype, de
      goedgekeurde motorfamilie of motorgroep, kan zij eisen dat de conformiteit van de motor wordt hersteld, dat de
      typegoedkeuring, bedoeld in [artikel 8a.05][ref4], dienovereenkomstig wordt gewijzigd of dat metingen van de
      werkelijke uitstoot worden uitgevoerd.

      Indien de conformiteit van de motor niet wordt hersteld of indien de typegoedkeuring niet dienovereenkomstig wordt
      aangepast of indien de uitgevoerde metingen aantonen dat de uitstoot niet in overeenstemming is met de toegelaten
      grenswaarden, bedoeld in [artikel 8a.02, tweede lid][ref5], weigert de bevoegde autoriteit de afgifte van een
      certificaat van onderzoek of trekt zij een eerder afgegeven certificaat van onderzoek in.

      2 Bij motoren die uitgerust zijn met een systeem voor nabehandeling van de uitlaatgassen moet de werking van het
      bedoelde systeem ter gelegenheid van de inbouwkeuring, de tussentijdse keuring of de bijzondere keuring worden
      getest.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel8a.02
