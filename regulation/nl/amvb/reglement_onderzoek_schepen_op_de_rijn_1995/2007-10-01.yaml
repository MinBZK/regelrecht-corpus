    text: |-
      1 Voor vastgezette containers moet bij elke berekeningsmethode om de stabiliteit van het schip vast te stellen van
      de volgende criteria worden uitgegaan:

      a. De metacentrumhoogte

      mag niet minder zijn dan 0,50 m.

      b. Onder de gelijktijdige invloed van de middelpuntvliedende kracht bij het draaien van het schip, de winddruk en
      de vrije vloeistofoppervlakken mag geen opening van de scheepsromp onder water komen.

      c. De armen van de momenten veroorzaakt door de middelpuntvliedende kracht bij het draaien van het
      schip, door de winddruk en de vrije vloeistofoppervlakken worden berekend volgens de formules van
      [artikel 22.02, eerste lid onder c, d en e][ref1].

      d. Voor elke beladingstoestand moet met de halve voorraad aan brandstof en drinkwater worden gerekend.

