  - number: '15.05'
    text: |-
      1 De Commissie van Deskundigen bepaalt het ten hoogste toegelaten aantal passagiers en tekent dit in het
      certificaat van onderzoek aan.

      2 Het ten hoogste toegelaten aantal passagiers mag niet meer zijn dan:

      a. het aantal passagiers waarvoor een verzamelruimte, bedoeld in [artikel 15.06, achtste lid][ref1], is aangetoond;

      b. het aantal passagiers waarvoor de stabiliteitsberekening, bedoeld in [artikel 15.03][ref2], is uitgevoerd;

      c. het aantal beschikbare bedden voor passagiers op hotelschepen, die voor reizen met overnachting worden ingezet.

      3 Voor hotelschepen die ook als schip voor dagtochten worden ingezet moet het aantal passagiers zowel voor
      een schip voor dagtochten als voor een hotelschip worden berekend en in het certificaat van onderzoek worden
      aangetekend.

      4 Het ten hoogste toegelaten aantal passagiers moet aan boord op een opvallende plaats duidelijk leesbaar worden
      aangegeven.


