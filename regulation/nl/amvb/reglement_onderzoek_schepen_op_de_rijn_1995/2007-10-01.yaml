  - number: '14.15'
    text: |-
      1 Voor elke vloeibaargasinstallatie die in overeenstemming is met dit hoofdstuk moet een aantekening worden
      geplaatst in het certificaat van onderzoek.

      2 Deze aantekening wordt door de Commissie van Deskundigen geplaatst na de in [artikel 14.13][ref1] bedoelde
      keuring.

      3 De geldigheidsduur van de aantekening bedraagt ten hoogste drie jaar. Vóór iedere vernieuwing dient een nieuwe
      keuring overeenkomstig [artikel 14.13][ref2] plaats te vinden.

      Bij wijze van uitzondering kan de Commissie van Deskundigen op een met redenen omkleed verzoek van de eigenaar of
      zijn vertegenwoordiger de geldigheidsduur van de aantekening met ten hoogste drie maanden verlengen, zonder dat
      eerst een keuring overeenkomstig [artikel 14.13][ref3] heeft plaatsgehad. Deze verlenging wordt in het certificaat
      van onderzoek aangetekend.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel14.13
      [ref2]: https://wetten.overheid.nl/BWBR0007858#Artikel14.13
      [ref3]: https://wetten.overheid.nl/BWBR0007858#Artikel14.13
