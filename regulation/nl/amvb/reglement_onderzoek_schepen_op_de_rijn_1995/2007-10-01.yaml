  - number: 8a.02
    text: |-
      1 Dit hoofdstuk is van toepassing op alle motoren met een nominaal vermogen (PN) gelijk aan of groter dan 37 kW,
      die geïnstalleerd zijn aan boord van vaartuigen of die ingebouwd zijn in zich aan boord bevindende werktuigen, voor
      zover ze niet vallen onder de desbetreffende richtlijnen van de Europese Gemeenschap met betrekking tot de uitstoot
      van schadelijke gassen en luchtverontreinigende deeltjes.

      2 De uitstoot van deze motoren van koolmonoxide (CO), koolwaterstoffen (HC), stikstofoxide (NO) en van deeltjes
      (PT) mag, met betrekking tot het nominale toerental n, de volgende waarden niet overschrijden:











