  - number: '5.02'
    text: |-
      1 De vaar- en manoeuvreereigenschappen dienen door proefvaarten te worden aangetoond. Daarbij dient te worden
      vastgesteld:








                    snelheid (vooruitvaren)


                    ([art. 5.06][ref1]);




                    stopeigenschappen


                    ([art. 5.07][ref2]);




                    achteruitvaareigenschappen


                    ([art. 5.08][ref3]);




                    uitwijkeigenschappen


                    ([art. 5.09][ref4]);




                    keereigenschappen


                    ([art. 5.10][ref5]).






      2 De Commissie van Deskundigen kan geheel of gedeeltelijk afzien van proefvaarten, wanneer op andere wijze wordt
      aangetoond dat aan de eisen wat betreft vaar- en manoeuvreereigenschappen wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel5.06
      [ref2]: https://wetten.overheid.nl/BWBR0007858#Artikel5.07
      [ref3]: https://wetten.overheid.nl/BWBR0007858#Artikel5.08
      [ref4]: https://wetten.overheid.nl/BWBR0007858#Artikel5.09
      [ref5]: https://wetten.overheid.nl/BWBR0007858#Artikel5.10
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel5.02
