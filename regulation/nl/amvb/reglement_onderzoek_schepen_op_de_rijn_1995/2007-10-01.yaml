    text: |-
      1 De resterende veiligheidsafstand is de kleinste verticale afstand tussen de gladde waterspiegel en het laagste
      punt waarboven het drijvend werktuig niet meer waterdicht is, waarbij rekening wordt gehouden met trim en slagzij
      die optreden onder invloed van de momenten als bedoeld in [artikel 17.07, vierde lid][ref1].

      2 Een resterende veiligheidsafstand bij spatwater- en regendicht afsluitbare openingen is voldoende in de zin van
      [artikel 17.07, eerste lid][ref2], wanneer deze 300 mm bedraagt.

      3 De resterende veiligheidsafstand bij niet spatwater- en regendicht afsluitbare openingen moet tenminste 400 mm
      bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel17.07
      [ref2]: https://wetten.overheid.nl/BWBR0007858#Artikel17.07
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel17.04
