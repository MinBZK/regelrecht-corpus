  - number: '3.03'
    text: |-
      1 De volgende waterdichte schotten, die reiken tot tegen het dek of, wanneer er geen dek is, tot aan de bovenkant
      van het scheepsboord, moeten tenminste zijn aangebracht:

      a. een aanvaringsschot op een redelijke afstand van de voorsteven, zodanig dat bij vollopen van de vóór het
      aanvaringsschot gelegen waterdichte afdeling het drijfvermogen van het beladen schip behouden blijft en dat een
      resterende veiligheidsafstand van 100 mm in stand blijft.

      Aan deze eis wordt geacht te zijn voldaan indien het aanvaringsschot op een afstand tussen 0,04 L en 0,04 L + 2 m,
      gemeten vanaf de voorloodlijn, is aangebracht.

      Indien deze afstand meer is dan 0,04 L + 2m moet het voldoen aan deze eis rekenkundig worden aangetoond.

      De afstand mag tot 0,03 L worden gereduceerd. In dat geval moet rekenkundig worden aangetoond dat aan de
      bovengenoemde eis kan worden voldaan, wanneer de vóór het aanvaringsschot gelegen waterdichte afdeling alsmede de
      direct daaraan grenzende afdelingen samen zijn volgelopen;

      b. een achterpiekschot op een redelijke afstand van de achtersteven bij schepen met een lengte van meer dan 25 m.

      2 Verblijven alsmede voor de veiligheid van het schip en van de bedrijfsvoering noodzakelijke inrichtingen mogen
      zich niet vóór het vlak van het aanvaringsschot bevinden. Dit geldt niet voor ankerinrichtingen.

      3 Verblijven, machinekamers en ketelruimen, alsmede de daarbij behorende werkruimten, moeten van de laadruimen zijn
      gescheiden door middel van waterdichte schotten die reiken tot tegen het dek.

      4 Verblijven moeten van de machinekamers en ketel- en laadruimen gasdicht zijn gescheiden en rechtstreeks van het
      dek af toegankelijk zijn. Wanneer een dergelijke toegang niet aanwezig is, moet een extra nooduitgang rechtstreeks
      toegang geven tot het dek.

      5 In de bij het eerste en derde lid voorgeschreven schotten en de in het vierde lid bedoelde begrenzing van ruimten
      mogen zich geen openingen bevinden.

      Deuren in het achterpiekschot en openingen voor de doorvoering van assen, leidingen enz. zijn evenwel toegestaan,
      wanneer zij zodanig zijn uitgevoerd dat de doelmatigheid van deze schotten en van de begrenzing van ruimten
      onverlet blijft. Deuren in het achterpiekschot zijn alleen toegestaan, indien door middel van afstandsbewaking in
      het stuurhuis kan worden vastgesteld of zij gesloten dan wel geopend zijn en indien aan beide zijden goed leesbaar
      het volgende opschrift is aangebracht:

      "Deur steeds onmiddellijk na het openen weer sluiten".

      6 Openingen waarlangs water wordt in- of uitgelaten, alsmede de aangesloten leidingen moeten zo geconstrueerd zijn
      dat onopzettelijk binnendringen van water in de scheepsromp niet mogelijk is.

      7 Een voorschip moet zodanig gebouwd zijn dat ankers noch geheel, noch gedeeltelijk buiten de scheepshuid
      uitsteken.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel3.03
  - number: '3.04'
    text: |-
      1 De ruimten waarin machine-installaties of ketels, alsmede hun toebehoren zijn opgesteld, moeten zodanig uitgerust
      en ingericht zijn dat bediening, toezicht en onderhoud van de zich aldaar bevindende installaties gemakkelijk en
      zonder gevaar kunnen geschieden.

      2 Bunkers voor vloeibare brandstof of smeerolie mogen met ruimten bestemd voor passagiers en met verblijven geen
      begrenzingsvlakken gemeen hebben die bij normaal bedrijf onder de statische druk van de vloeistof staan.

      3 Wanden, dekken en deuren van de machinekamers, ketelruimen en bunkers moeten van staal of een ander gelijkwaardig
      onbrandbaar materiaal zijn gemaakt.

      Isolaties in machinekamers moeten zijn beschermd tegen het binnendringen van olie en oliedampen.

      Alle openingen in wanden, dekken en deuren van machinekamers, ketelruimen en bunkers moeten van buitenaf kunnen
      worden gesloten. De afsluitinrichtingen moeten van staal of een ander gelijkwaardig onbrandbaar materiaal zijn
      gemaakt.

      4 Machinekamers, ketelruimen en andere ruimten waarin zich brandbare of giftige gassen kunen ontwikkelen, moeten
      voldoende kunnen worden geventileerd.

      5 De trappen en ladders die toegang geven tot machinekamers, ketelruimen en bunkers moeten vast zijn aangebracht en
      zijn gemaakt van staal of van een ander stootvast en onbrandbaar materiaal.

      6 Machinekamers en ketelruimen moeten twee uitgangen hebben, waarvan er een als nooduitgang mag zijn uitgevoerd.

      Van een tweede uitgang kan worden afgezien, indien:

      a. het grondvlak (gemiddelde lengte * gemiddelde breedte ter hoogte van de vloerplaten) van een machinekamer of
      ketelruim in totaal niet meer bedraagt dan 35 m²,

      b. de vluchtweg vanaf iedere standplaats waar bedieningshandelingen of onderhoudswerkzaamheden moeten worden
      uitgevoerd tot aan de uitgang, of tot aan het voetpunt van de trap bij de uitgang die naar buiten leidt, niet meer
      bedraagt dan 5 m, en

      c. bij de plaats van onderhoud die het verst verwijderd is van de uitgang een draagbaar blustoestel aanwezig is, en
      wel in afwijking van [artikel 10.03, eerste lid onder e][ref1], ook indien de geïnstalleerde motorcapaciteit 100 kW
      of minder bedraagt.

      7 Het ten hoogste toegestane niveau van de geluidsdruk in de machinekamers bedraagt 110 dB(A). De meetpunten moeten
      worden gekozen met inachtneming van de noodzakelijke onderhoudswerkzaamheden tijdens het normale bedrijf van de
      installaties.


