  - number: 8a.03
    text: |-
      1 Een aanvraag van een typegoedkeuring van een motortype, een motorfamilie of een motorgroep moet door de fabrikant
      bij de bevoegde autoriteit worden ingediend. Bij de aanvraag moet een informatiedossier en het ontwerp van een
      proces-verbaal van de motorkenmerken worden gevoegd. De fabrikant moet voor de typekeuringen een motor, die voldoet
      aan de essentiële kenmerken vermeld in [bijlage J, deel II, aanhangsel 1][ref1], demonstreren.

      2 Indien de bevoegde autoriteit, in het geval van een aanvraag van een typegoedkeuring van een motorfamilie of
      van een motorgroep, vaststelt dat de ingediende aanvraag met betrekking tot de geselecteerde basismotor voor de in
      [bijlage J, deel II, aanhangsel 2][ref2], beschreven motorfamilie of motorgroep niet representatief is, moet een
      andere, en eventueel een extra, basismotor, die door de bevoegde autoriteit wordt aangewezen, ten behoeve van de
      goedkeuring, bedoeld in het eerste lid, ter beschikking worden gesteld.

      3 Een aanvraag van een typegoedkeuring voor een motortype, een motorfamilie of een motorgroep mag bij niet meer dan
      één bevoegde autoriteit worden ingediend. Voor ieder goed te keuren motortype, motorfamilie of motorgroep moet een
      afzonderlijke aanvraag worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0007858
      [ref2]: https://wetten.overheid.nl/BWBR0007858
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel8a.03
