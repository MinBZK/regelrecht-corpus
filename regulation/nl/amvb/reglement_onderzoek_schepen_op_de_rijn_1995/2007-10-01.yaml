      1 Voor installaties met spanningen boven 50 V is aarding noodzakelijk.

      2 De bij het normale bedrijf niet onder spanning staande metalen delen die voor aanraking toegankelijk zijn, zoals
      fundaties en omhulsels van machines, apparaten en verlichting, moeten afzonderlijk zijn geaard, voor zover zij niet
      door hun bevestiging elektrisch geleidend met de scheepsromp zijn verbonden.

      3 De omhulsels van verplaatsbare en draagbare apparaten moeten door middel van een extra ader die bij het normale
      bedrijf geen stroom voert en die in de voedingskabel is opgenomen, zijn geaard.

      Dit geldt niet bij het gebruik van een beschermingstransformator en voor apparaten waarvan de omhulsels bestaan uit
      isolatiemateriaal (dubbel geïsoleerd).

      4 De doorsnede van de aardleiding moet tenminste gelijk zijn aan de waarde zoals aangegeven in de onderstaande
