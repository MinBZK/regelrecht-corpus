      b. Scheidingsvlakken van het type «A» zijn schotten, wanden en dekken, die aan de volgende eisen voldoen:

      aa. Ze zijn vervaardigd van staal of een ander gelijkwaardig materiaal.

      bb. Ze zijn op een geschikte wijze versterkt.

      cc. Ze zijn zodanig geïsoleerd met een toegelaten onbrandbaar materiaal, dat de gemiddelde temperatuur aan de
      van de brand afgekeerde zijde niet meer dan 140 °C boven de begintemperatuur stijgt en op geen enkele plaats met
      inbegrip van de verbindingen een temperatuurverhoging van meer dan 180 °C boven de begintemperatuur plaatsvindt
      binnen de hierna aangegeven tijdsduur:

      type «A 60» 60 minuten

      type «A 30» 30 minuten

      type «A 0» 0 minuten.

      dd. Ze zijn zodanig gebouwd, dat ze de doorvoer van rook en vuur verhinderen tot aan het einde van de standaard
      brandtest van één uur.

      c. Scheidingsvlakken van het type «B» zijn schotten, wanden, dekken, dekens of bekledingen, die aan de volgende
      eisen voldoen:

      aa. Ze bestaan uit een toegelaten onbrandbaar materiaal, en alle materialen die voor de constructie en het
      installeren van de scheidingsvlakken worden toegepast zijn onbrandbaar met uitzondering van oppervlaktemateriaal
      dat tenminste moeilijk ontvlambaar moet zijn.

      bb. Ze hebben een zodanige isolatiewaarde, dat de gemiddelde temperatuur aan de van de brand afgekeerde zijde
      niet meer dan 140 °C boven de begintemperatuur stijgt en op geen enkele plaats met inbegrip van de verbindingen
      een temperatuurverhoging van meer dan 225 °C boven de begintemperatuur plaatsvindt binnen de hierna aangegeven
      tijdsduur:

      type «B 15» 15 minuten

      type «B 0» 0 minuten.

      cc. Ze zijn zodanig gebouwd dat ze de doorvoer van vuur verhinderen tot aan het eind van het eerste half uur van de
      standaard brandtest.

      3 In ruimten, met uitzondering van machinekamers en voorraadruimten, toegepaste verf, lak en andere producten voor
      het behandelen van oppervlakken, alsmede bedekking van dekken moeten moeilijk ontvlambaar zijn.

      Vaste vloerbedekking, stoffen, gordijnen en andere hangende materialen van textiel, alsmede gestoffeerde meubels en
      beddengoed, moeten moeilijk ontvlambaar zijn voorzover de ruimten waarin ze zich bevinden niet beschikken over een
      automatisch werkende sprinklerinstallatie als bedoeld in [artikel 10.03a][ref3].

      4 De in ruimten voor passagiers aangebrachte plafonds en stofferingen van wanden met inbegrip van de constructies
      daaronder moeten, voorzover die ruimten niet over een automatisch werkende sprinklerinstallatie beschikken als
      bedoeld in [artikel 10.03a][ref4], van onbrandbaar materiaal zijn vervaardigd met uitzondering van de oppervlakken
      ervan die tenminste moeilijk ontvlambaar moeten zijn.

      5 Meubels en constructies in verblijfsruimten, waarin zich verzamelruimten bevinden, moeten, voorzover die ruimten
      niet beschikken over een automatisch werkende sprinklerinstallatie als bedoeld in [artikel 10.03a][ref5], van
      onbrandbaar materiaal zijn vervaardigd.

      6 Verf, lak en andere stoffen, die worden toegepast op onbeschermde oppervlakken aan de binnenkant, mogen bij brand
      niet meer dan normale hoeveelheden rook en giftige stoffen ontwikkelen. Dit moet worden aangetoond met toetsing aan
      de code voor brandtestmethoden.

      7 Isolatiemateriaal in verblijfsruimten moet onbrandbaar zijn. Dit geldt niet voor isolaties van leidingen voor
      koelvloeistof. De oppervlakken van de isolatie van deze leidingen moeten tenminste moeilijk ontvlambaar zijn.

      8 Deuren in scheidingsvlakken als bedoeld in het tweede lid moeten aan de volgende eisen voldoen:

      a. Ze moeten aan dezelfde eisen, bedoeld in het tweede lid, voldoen als de scheidingsvlakken zelf.

      b. Ze moeten, voorzover het deuren in scheidingsvlakken, bedoeld in het tiende lid, dan wel deuren in wanden die
      machinekamers omsluiten, keukens en trappen betreft, automatisch sluitend zijn.

      c. Automatisch sluitende deuren, die bij een normale situatie open staan, moeten ter plaatse en vanuit een
      permanent door de bemanning en het boordpersoneel bezette plaats kunnen worden gesloten. Na sluiting op afstand
      moet de deur ter plaatse opnieuw geopend en veilig gesloten kunnen worden.

      d. Waterdichte deuren als bedoeld in [artikel 15.02][ref6] behoeven niet te worden geïsoleerd.

      9 Wanden als bedoeld in het tweede lid moeten van dek tot dek opgetrokken zijn, dan wel eindigen bij doorlopende
      plafonds die aan dezelfde eisen, bedoeld in het tweede lid, voldoen.

      10 De volgende passagiersruimten moeten zijn onderverdeeld met verticale scheidingsvlakken als bedoeld in het
      tweede lid:

      a. Passagiersruimten met een totale oppervlakte van meer dan 800 m2;

      b. Passagiersruimten, waarin zich hutten bevinden, met tussenruimten van ten hoogste 40 m.

      Deze verticale scheidingsvlakken wanden moeten onder normale omstandigheden rookdicht en van dek tot dek zijn
      opgetrokken.

      11 Holle ruimten boven de plafonds, onder vloeren en achter wandbekleding moeten met tussenruimten van ten hoogste
      14 m door niet brandbare, ook bij brand goed afsluitende, tochtkleppen gescheiden zijn.

      12 Trappen moeten van staal of een ander gelijkwaardig onbrandbaar materiaal zijn vervaardigd.

      13 Inwendig gelegen trappen en liften moeten op alle niveaus door wanden als bedoeld in het tweede lid zijn
      omgeven. De volgende uitzonderingen kunnen worden toegestaan:

      a. Een trap die slechts tussen twee dekken ligt behoeft niet in een schacht te liggen, wanneer de trap op één dek
      door wanden als bedoeld in het tweede lid is omgeven.

      b. In een verblijfsruimte behoeven trappen niet in een schacht te liggen, wanneer ze volledig binnen deze ruimte
      liggen en

      aa. wanneer deze ruimte niet meer dan 2 dekken omvat dan wel

      bb. indien in deze ruimte op alle dekken een automatisch werkende sprinklerinstallatie als bedoeld in
      [artikel 10.03a][ref7] is geïnstalleerd, deze ruimte beschikt over een installatie voor het afzuigen van rook als
      bedoeld in het zestiende lid en deze ruimte op alle dekken een toegang tot een trappenschacht heeft.

      14 Ventilatie- en airconditioningsystemen moeten aan de volgende eisen voldoen:

      a. Ze moeten zodanig zijn uitgevoerd dat vuur en rook zich niet via deze systemen kunnen verspreiden.

      b. Openingen voor toe- en afvoer van lucht en airconditioningsystemen moeten kunnen worden afgesloten.

      c. Ventilatiekanalen moeten van staal of een gelijkwaardig onbrandbaar materiaal zijn vervaardigd en op een veilige
      wijze met elkaar en met de scheepsconstructie verbonden zijn.

      d. Indien ventilatiekanalen met een doorsnede van meer dan 0,02 m2 door scheidingsvlakken van type A als bedoeld
      in het tweede lid of door scheidingsvlakken als bedoeld in het tiende lid lopen, moeten ze zijn uitgerust met
      automatische brandkleppen die vanaf een permanent door het boordpersoneel of leden van de bemanning bezette plaats
      kunnen worden bediend.

      e. Ventilatiesystemen voor keuken en machinekamers moeten zijn gescheiden van ventilatiesystemen die voor andere
      ruimten werken.

      f. Ontluchtingskanalen moeten voorzien zijn van afsluitbare openingen ten behoeve van controle en reiniging. De
      betreffende openingen moeten in de nabijheid van de brandkleppen zijn aangebracht.

      g. Ingebouwde ventilatoren moeten kunnen worden uitgeschakeld vanaf een centrale plaats buiten de machinekamer.

      15 Keukens moeten voorzien zijn van een ventilatiesysteem en keukenfornuizen met een afzuiging. De
      ontluchtingskanalen van de afzuigingen moeten voldoen aan de eisen als bedoeld in het veertiende lid en bovendien
      zijn voorzien van handbediende brandkleppen aan de ingangsopeningen.

      16 Controleposten, trappenschachten en binnen het schip gelegen verzamelruimten moeten zijn voorzien van
      inrichtingen voor het afzuigen van rook via een natuurlijke of machinale weg. Inrichtingen voor het afzuigen van
      rook moeten aan de volgende eisen voldoen:

      a. Ze moeten voldoende capaciteit hebben en betrouwbaar zijn.

      b. Ze moeten passen bij de bedrijfsomstandigheden van het passagiersschip.

      c. Indien inrichtingen voor het afzuigen van rook ook dienen voor de algemene ventilatie van de ruimten mag
      daardoor hun functie als inrichting voor het afzuigen van rook in geval van brand niet worden gehinderd.

      d. Inrichtingen voor het afzuigen van rook moeten voorzien zijn van een handmatige inschakeling.

      e. Machinale inrichtingen voor het afzuigen van rook moeten bovendien vanaf een permanent door boordpersoneel of
      leden van de bemanning bezette plaats kunnen worden bediend.

      f. Inrichtingen voor afzuiging van rook via natuurlijke weg moeten zijn voorzien van een handmatig te bedienen
      openingsmechanisme of met een energiebron binnen deze inrichtingen.

      g. Handmatig te bedienen inschakelinrichtingen en openingsmechanismen moeten van binnen en van buiten de te
      beschermen ruimte bereikbaar zijn.

      17 Verblijfsruimten waarop niet permanent door boordpersoneel en leden van de bemanning wordt gelet, keukens,
      machinekamers en andere bedreigde ruimten moeten op een doelmatige brandmeldinstallatie zijn aangesloten. De
      aanwezigheid van een brand alsmede de plaats daarvan moeten automatisch worden gemeld op een permanent door
      boordpersoneel of leden van de bemanning bezette plaats.


