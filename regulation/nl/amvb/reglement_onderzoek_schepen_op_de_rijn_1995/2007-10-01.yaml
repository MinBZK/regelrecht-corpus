    text: |-
      1 Snelle schepen mogen niet gebouwd zijn als hotelschepen.

      2 De volgende inrichtingen zijn op snelle schepen verboden:

      a. met pitbranders uitgeruste inrichtingen, bedoeld in [artikel 13.02][ref1];

      b. oliekachels met verdampingsbranders, bedoeld in de [artikelen 13.03][ref2] en [13.04][ref3];

      c. verwarmingsapparaten met vaste brandstoffen, bedoeld in [artikel 13.07][ref4];

      d. vloeibaargasinstallaties als bedoeld in [hoofdstuk 14][ref5].


