      1 Onverminderd de overige bepalingen van dit reglement moeten motorschepen, duwboten, duwstellen en
      passagiersschepen, die met een minimum-bemanning worden geëxploiteerd, aan de volgende voorschriften voldoen:

      1.1 Standaard S1

      a) De voortstuwingsinstallaties moeten zo zijn ingericht, dat de verandering van de vaarsnelheid en de omkering
      van de richting van de stuwkracht van de schroef vanaf de stuurstelling kunnen geschieden. De hulpmotoren die
      nodig zijn bij het varen met het schip moeten vanaf de stuurstelling kunnen worden aan- en afgezet, tenzij dit
      automatisch geschiedt, dan wel deze motoren gedurende elke reis ononderbroken in bedrijf zijn.

      b) Het kritieke peil van de temperatuur van het koelwater van de hoofdmotoren, van de druk van de smeerolie van
      de hoofdmotoren en de transmissie, van de oliedruk en de luchtdruk van de omkeerinrichting van de hoofdmotoren,
      de keerkoppeling of de schroeven en van het bilgewater in de hoofdmachinekamer moet worden aangegeven door
      installaties die in het stuurhuis akoestische en optische alarmsignalen in werking stellen. De akoestische
      alarmsignalen mogen in één akoestisch apparaat verenigd zijn. Zij mogen worden uitgeschakeld zodra de storing
      is vastgesteld. De optische alarmsignalen mogen pas worden uitgeschakeld, nadat de desbetreffende storingen zijn
      verholpen.

      c) De brandstoftoevoer en de koeling van de hoofdmotoren dienen automatisch te geschieden.

      d) De bediening van de stuurinrichting moet zelfs bij de grootste toegelaten inzinking door één persoon zonder
      bijzondere krachtsinspanning kunnen worden verricht.

      e) De bij het [Rijnvaartpolitiereglement][ref1] voorgeschreven optische tekens en geluidsseinen van varende schepen
      dienen vanaf de stuurstelling te kunnen worden gegeven.

      f) Indien geen rechtstreeks contact mogelijk is tussen de stuurstelling en het voorschip, het achterschip, de
      verblijven en de machinekamer, dient een spreekverbinding te zijn aangebracht. Voor contact met de machinekamer
      mogen in plaats van een spreekverbinding optische en akoestische signalen worden gebruikt.

      g) (Vervallen).

      h) (Vervallen).

      i) De kracht die nodig is om zwengels en soortgelijke draaibare voorzieningen van hefwerktuigen te bedienen mag
      niet meer dan 160 N bedragen.

      j) De in het certificaat van onderzoek vermelde sleeplieren dienen door een motor te worden aangedreven.

      k) De lenspompen en de dekwaspompen dienen door een motor te worden aangedreven.

      l) De voornaamste bedieningsinrichtingen en controle-instrumenten dienen ergonomisch te zijn aangebracht.

      m) De krachtens [artikel 6.01, eerste lid][ref2], vereiste inrichtingen dienen vanaf de stuurstelling te kunnen
      worden bediend.

      1.2 Standaard S2

      a) voor alleen varende motorschepen:

      Standaard S1 en bovendien een uitrusting met een vanuit de stuurhut bedienbare boegschroefinstallatie;

      b) voor motorschepen, die gekoppelde vaartuigen voortbewegen:

      Standaard S1 en bovendien een uitrusting met een vanuit de stuurhut bedienbare boegschroefinstallatie;

      c) voor motorschepen, die een duwstel, bestaande uit het motorschip en een vaartuig ervoor, voortbewegen:

      Standaard S1 en bovendien een uitrusting met hydraulisch of elektrisch aangedreven koppellieren. Deze uitrusting is
      echter niet vereist, wanneer het vaartuig aan de kop van het duwstel met een boegschroefinstallatie is uitgerust,
      die vanuit de stuurhut van het duwende motorschip te bedienen is;

      d) voor duwboten, die een duwstel voortbewegen:

      Standaard S1 en bovendien een uitrusting met hydraulisch of elektrisch aangedreven koppellieren. Deze uitrusting is
      echter niet vereist, wanneer het vaartuig aan de kop van het duwstel met een boegschroefinstallatie is uitgerust,
      die vanuit de stuurhut van het duwende duwboot te bedienen is;

      e) voor passagiersschepen:

      Standaard S1 en bovendien een uitrusting met een vanuit de stuurhut bedienbare boegschroefinstallatie. Deze
      uitrusting is echter niet vereist, indien de voortstuwingsinstallatie en de stuurinrichting van het passagiersschip
      gelijkwaardige manoeuvreereigenschappen waarborgen.

      2 Het voldoen of niet voldoen aan de voorschriften, bedoeld in het eerste lid, wordt door de Commissie van
      Deskundigen in het certificaat van onderzoek onder nummer 47 gewaarmerkt.


