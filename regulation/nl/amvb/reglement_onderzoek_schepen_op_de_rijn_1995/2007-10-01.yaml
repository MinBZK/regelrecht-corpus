  - number: '23.04'
    text: |-
      1 Het dienstboekje bevat enerzijds gegevens van algemene aard, zoals de medische verklaringen en de bekwaamheid van
      de houder, bedoeld in [artikel 23.02][ref1], en anderzijds de specifieke gegevens betreffende de afgelegde reizen.
      De plaatselijk bevoegde autoriteit is verantwoordelijk voor het invullen van de gegevens van algemene aard alsmede
      voor de afstempeling ter controle. Zij kan daartoe het overleggen van vaartijdenboeken dan wel uittreksels daarvan
      of van andere relevante bescheiden verlangen. Zij mag slechts die reizen van een afstempeling voorzien die niet
      ouder zijn dan 15 maanden.

      2 Elk lid van de bemanning moet in het bezit zijn van een persoonlijk dienstboekje overeenkomstig het model
      van [bijlage F][ref2] dan wel in het bezit zijn van een ander door de Centrale Commissie voor de Rijnvaart als
      gelijkwaardig erkend dienstboekje. Deze persoon wordt als houder van het dienstboekje aangemerkt.

      De houder moet het dienstboekje:

      a) bij de eerste indiensttreding aan boord overhandigen aan de schipper, en

      b) telkens binnen een periode van 12 maanden te rekenen vanaf de datum van afgifte, ten minste éénmaal overleggen
      en laten afstempelen zoals bedoeld in het eerste lid door een plaatselijk bevoegde autoriteit.

      Stuurlieden die geen groot patent als bedoeld in het [Reglement Rijnpatenten 1998][ref3] willen verkrijgen zijn van
      de verplichting tot het overleggen vrijgesteld. Indien de stuurman later alsnog een patent wil verkrijgen, wordt
      slechts met die riviergedeelten rekening gehouden die in het dienstboekje zijn ingevuld en die zijn afgestempeld
      zoals bedoeld in het eerste lid.

      3 De schipper is verantwoordelijk voor:

      a) het regelmatig invullen in het dienstboekje van alle gegevens overeenkomstig de aanwijzingen en instructies voor
      het bijhouden vermeld in [bijlage F][ref4];

      b) het veilig in het stuurhuis bewaren van het dienstboekje tot aan het eind van het dienstverband, arbeidscontract
      dan wel andere regeling;

      c) het te allen tijde op verzoek van de houder onverwijld teruggeven van het dienstboekje.

      4 Bij leden van de bemanning die in het bezit zijn van een groot patent als bedoeld in [bijlage A1][ref5] dan wel
      van een voorlopig groot patent als bedoeld in [bijlage A2 van het Reglement Rijnpatenten 1998][ref6] geldt dit
      patent als dienstboekje.

      5 De bekwaamheid voor een functie aan boord moet te allen tijde kunnen worden aangetoond:

      a) door de schipper door middel van het patent dat overeenkomstig het [Reglement Rijnpatenten 1998][ref7] wordt
      vereist;

      b) door de overige leden van de bemanning door middel van het dienstboekje of een patent als bedoeld onder a.


