      Voor de vaart beneden het Spijksche Veer (km 857,40) kan, voorzover de Duits-Nederlandse grens tijdens de vaart in
      de ene of de andere richting niet wordt overschreden, in plaats van met de voorschriften van dit hoofdstuk, worden
      volstaan met de voorschriften van de [Wet vaartijden en bemanningssterkte binnenvaart][ref1].


