    text: |-
      1 De [artikelen 24.02 tot en met 24.04][ref1] zijn slechts van toepassing op vaartuigen, die bij de
      inwerkingtreding van dit reglement voorzien zijn van een geldig certificaat van onderzoek overeenkomstig het op 31
      december 1994 geldende Reglement onderzoek schepen op de Rijn of in aanbouw zijn dan wel verbouwd worden.

      2 Onverminderd [artikel 2.09, tweede lid][ref2], blijven de overeenkomstig het op 31 december 1994 geldende
      Reglement onderzoek schepen op de Rijn afgegeven certificaten van onderzoek geldig tot de op deze certificaten
      aangegeven datum van beëindiging van de geldigheid.

      3 Op vaartuigen, die niet onder het eerste lid vallen, is [artikel 24.06][ref3] van toepassing.


