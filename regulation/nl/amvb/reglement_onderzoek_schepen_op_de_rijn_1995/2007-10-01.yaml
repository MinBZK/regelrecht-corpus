      1 Passagiersschepen moeten ofwel van verzameltanks voor afvalwater ofwel van geschikte zuiveringsinstallaties zijn
      voorzien.

      2 Tanks voor het verzamelen van afvalwater moeten voldoende capaciteit hebben. De tanks moeten zijn voorzien van
      een inrichting waarmee het niveau kan worden vastgesteld, dan wel hoever de tank gevuld is. Om de tanks leeg te
      maken moeten aan boord pompen en leidingen aanwezig zijn, waarmee het afvalwater op aanlegplaatsen aan beide zijden
      van het schip kan worden afgegeven.

      Doorvoer van afvalwater van andere schepen moet mogelijk zijn.

      De leidingen moeten zijn voorzien van een aansluiting voor afgifte overeenkomstig de Europese norm EN 1306 : 1996.
