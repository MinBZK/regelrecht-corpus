  - number: '17.02'
    text: |-
      1 De Commissie van Deskundigen kan toestaan dat van de volgende bepalingen wordt afgeweken.

      a. [Artikel 3.03, eerste en tweede lid][ref1], is van overeenkomstige toepassing;

      b. [Artikel 7.02][ref2] is van overeenkomstige toepassing;

      c. De ten hoogste toegelaten niveaus van de geluidsdruk als bedoeld in
      [artikel 12.02, vijfde lid, tweede alinea][ref3], mogen worden overschreden wanneer de werkinrichtingen in bedrijf
      zijn en voor zover er dan niet aan boord wordt overnacht;

      d. Van de overige bepalingen met betrekking tot bouw, inrichting en uitrusting, voor zover voor elk geval dezelfde
      veiligheid is aangetoond.

      2 De Commissie van Deskundigen kan afzien van de toepassing van de volgende bepalingen:

      a. [Artikel 10.01, eerste lid][ref4], wanneer het drijvende werktuig veilig kan worden verankerd terwijl de
      werkinrichtingen in bedrijf zijn, bij voorbeeld door middel van werkankers of palen. Een drijvend werktuig
      met eigen mechanische middelen tot voortbeweging moet echter ten minste één anker hebben als bedoeld in
      [artikel 10.01, eerste lid][ref5], waarbij de coëfficiënt k = 45 en voor T de kleinste hoogte in de zijde moet
      worden aangenomen;

      b. [Artikel 12.02, eerste lid, tweede gedeelte van de zin][ref6], wanneer de ruimten voldoende elektrisch kunnen
      worden verlicht.

      3 Bovendien geldt:

      a. in afwijking van [artikel 8.06, tweede lid, tweede alinea][ref7]: De lenspomp moet mechanisch worden
      aangedreven;

      b. in afwijking van [artikel 8.08, derde lid][ref8]: Bij stilliggende drijvende werktuigen mag het geluid wanneer
      de werkinrichtingen in bedrijf zijn op 25 m afstand zijdelings van de scheepshuid meer bedragen dan 65 dB(A);

      c. in afwijking van [artikel 10.03, eerste lid][ref9]: Bij vrij op het dek staande werktuigen moet ten minste één
      extra draagbaar blustoestel aanwezig zijn;

      d. in afwijking van [artikel 14.02, tweede lid][ref10]: Naast vloeibaargasinstallaties voor huishoudelijk gebruik
      mogen ook andere vloeibaargasinstallaties aanwezig zijn. Deze installaties met toebehoren moeten voldoen aan de
      voorschriften van één van de Oeverstaten of van België.


