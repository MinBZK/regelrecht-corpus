  - number: '9.13'
    text: |-
      Voor oliebranderinstallaties, brandstofpompen, brandstofseparatoren en machinekamerventilatoren moeten buiten de
      opstellingsruimten noodstopschakelaars op een centrale plaats aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel9.13
  - number: '9.14'
    text: |-
      1 Kabelinvoeren van apparaten moeten passend zijn voor de afmetingen en het type van de aan te sluiten kabels.

      2 Wandcontactdozen van verdeelsystemen met van elkaar afwijkende spanningen of frequenties moeten van verschillende
      uitvoering zijn.

      3 Schakelaars moeten alle niet geaarde geleiders van een stroomkring gelijktijdig schakelen. Bij niet geaarde
      netten zijn in stroomkringen van de verlichting voor verblijven, uitgezonderd was-, bad- en overige natte ruimten,
      eenpolige schakelaars toegestaan.

      4 Bij stroomsterkten van meer dan 16 A moeten de wandcontactdozen zodanig met een schakelaar worden vergrendeld,
      dat noch het insteken, noch het uittrekken van de stekker mogelijk is wanneer de contactbussen van de contactdoos
      onder spanning staan.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel9.14
  - number: '9.15'
    text: |-
      1 Kabels moeten moeilijk ontvlambaar, zelfdovend en bestendig tegen water en olie zijn.

      In de verblijven kan de toepassing van andere kabeltypen worden toegestaan, mits deze kabels doelmatig zijn
      beschermd, moeilijk ontvlambaar en zelfdovend zijn.

      2 Voor kracht- en verlichtingsinstallaties moeten de aders van de kabels een doorsnede van tenminste 1,5 mm²
      hebben.

      3 Metalen bewapeningen en mantels van kabels mogen voor het normale bedrijf niet als geleider of aardleiding
      dienen.

      4 Metalen bewapeningen en mantels van kabels van kracht- en verlichtingsinstallaties moeten tenminste aan één der
      einden zijn geaard.

      5 De doorsnede van de geleiders moet in overeenstemming zijn met de ten hoogste toegestane geleidertemperatuur
      (stroombelastbaarheid) alsmede met het toelaatbare spanningsverlies. Dit spanningsverlies, optredend tussen het
      hoofdschakelbord en het meest ongunstige punt van de installatie, mag bij verlichtingsinstallaties niet meer dan 5%
      en voor kracht- en verwarmingsinstallaties niet meer dan 7% van de nominale spanning bedragen.

      6 Kabels moeten tegen het gevaar van mechanische beschadigingen zijn beschermd.

      7 De bevestiging der kabels moet zodanig zijn, dat eventuele belastingen op trek binnen de toelaatbare grenzen
      blijven.

      8 De doorvoeringen van kabels door schotten of dekken mogen de sterkte, dichtheid en brandwerende eigenschappen van
      de schotten of de dekken niet nadelig beïnvloeden.

      9 Kabels die naar beweegbare stuurhuizen worden gevoerd moeten voldoende buigzaam zijn en van een isolatie zijn
      voorzien die voldoende buigzaam blijft tot een temperatuur van -20° C, alsmede bestand zijn tegen de inwerking van
      dampen, ultraviolette straling, ozon en dergelijke.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel9.15
  - number: '9.16'
    text: |-
      1 Verlichtingsarmaturen moeten zodanig zijn aangebracht, dat brandbare voorwerpen of constructiedelen niet door de
      uitgestraalde warmte in brand kunnen geraken.

      2 De verlichtingsarmaturen op het open dek moeten zodanig zijn geplaatst, dat de waarneembaarheid van de
      navigatieverlichting niet nadelig wordt beïnvloed.

      3 Indien in een machinekamer of een ketelruim twee of meer lichtpunten zijn aangebracht, moeten deze over ten
      minste twee stroomkringen zijn verdeeld. Dit geldt eveneens voor ruimten waarin koelmachines, hydraulische
      inrichtingen of elektromotoren zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel9.16
  - number: '9.17'
    text: |-
      1 Schakelborden voor navigatielantaarns moeten in het stuurhuis zijn geïnstalleerd. Zij moeten door een aparte
      kabel vanaf het hoofdschakelbord worden gevoed of door twee van elkaar onafhankelijke onderverdelingen kunnen
      worden verzorgd.

      2 Elke navigatielantaarn moet vanaf het navigatieschakelbord afzonderlijk gevoed, beveiligd en geschakeld kunnen
      worden.

      3 Het uitvallen van de controle-inrichtingen als bedoeld in [artikel 7.05, tweede lid][ref1], mag de werking van de
      bijbehorende navigatielantaarns niet nadelig beïnvloeden.

      4 Dicht bijeen geplaatste, bij elkaar behorende navigatielantaarns mogen gemeenschappelijk worden gevoed, beveiligd
      en geschakeld. De controle-inrichting moet dan echter het uitvallen van één der lantaarns kunnen signaleren. Twee
      in één armatuur boven elkaar geplaatste navigatielantaarns mogen niet gelijktijdig ingeschakeld kunnen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel7.05
