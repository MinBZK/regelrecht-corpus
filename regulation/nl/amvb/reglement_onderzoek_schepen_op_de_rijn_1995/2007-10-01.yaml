  - number: '7.05'
    text: |-
      1 In dit artikel wordt verstaan onder:

      a. navigatielichten: toplichten, boordlichten, heklichten, rondom schijnende lichten, blauwe flikkerlichten en
      blauwe lichten voor het vervoer van gevaarlijke stoffen;

      b. lichtseinen: de bij de geluidsseinen en het blauwe bord behorende lichten.

      2 Voor zover de controle van de navigatielichten niet rechtstreeks vanuit het stuurhuis mogelijk is, moeten
      ter controle van deze lichten in het stuurhuis stroomaanwijslampen of gelijkwaardige inrichtingen, zoals
      controlelampjes, zijn aangebracht.

      3 Bij éénmansstuurstellingen voor het varen op radar moeten ter controle van de navigatielichten en de lichtseinen
      controlelampen in de stuurstelling zijn ingebouwd. De schakelaars van de navigatielichten moeten in of vlakbij de
      daarbij behorende controlelampen zijn aangebracht en daar duidelijk bij behoren.

      De groepering en de kleur van de controlelampen van de navigatielichten en de lichtseinen moeten overeenkomen met
      de werkelijke opstelling en de kleur van de ingeschakelde navigatielichten en de lichtseinen.

      Het niet-functioneren van een navigatielicht of lichtsein moet het uitgaan van de overeenkomstige controlelamp tot
      gevolg hebben dan wel op andere wijze door de betreffende controlelamp worden aangegeven.

      4 Bij éénmansstuurstellingen voor het varen op radar dient de bediening van de geluidsseinen met de voet te kunnen
      geschieden. Dit geldt niet voor het in het Rijnvaartpolitiereglement bedoelde "blijf weg"-sein.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel7.05
  - number: '7.06'
    text: |-
      1 De radarinstallatie en de bochtaanwijzer moeten overeenkomen met een door de bevoegde autoriteit toegelaten type.
      Aan de voorschriften van het [Besluit radar- en bochtaanwijzerapparatuur Rijnvaart 1989][ref1] moet zijn voldaan.

      Inland ECDIS apparaten, die in de navigatiemodus kunnen worden gebruikt, worden beschouwd als radarinstallaties.
      Zij moeten tevens voldoen aan de eisen van Inland ECDIS.

      De bochtaanwijzer moet vóór de roerganger in diens gezichtsveld zijn geplaatst.

      2 Bij éénmansstuurstellingen voor het varen op radar:

      a. mag het radarscherm niet wezenlijk buiten de blikrichting van de roerganger vallen;

      b. moet het radarbeeld zonder kap of scherm, ongeacht de buiten het stuurhuis heersende lichtomstandigheden,
      duidelijk zichtbaar zijn;

      c. moet de bochtaanwijzer direct boven of onder het radarbeeld zijn geplaatst of hierin zijn geïntegreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004653
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel7.06
    references:
      - id: ref1
        bwb_id: BWBR0004653
  - number: '7.07'
    text: |-
      1 Op schepen met een éénmansstuurstelling voor het varen op radar moet voor het schip- -schipverkeer en de
      nautische informatie het ontvangen door een luidspreker en het zenden door een vast opgestelde microfoon
      geschieden. Het overschakelen van "ontvangen" naar "zenden" moet door middel van drukknoppen geschieden.

      In geen geval mag de microfoon van dit verkeer voor verbindingen van het openbaar verkeer kunnen worden gebruikt.

      2 Wanneer een schip met een éénmansstuurstelling voor het varen op radar is uitgerust met een marifooninstallatie
      bestemd voor het openbaar verkeer, moet de ontvangst daarvan vanaf de zitplaats van de roerganger mogelijk zijn.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel7.07
  - number: '7.08'
    text: |-
      Aan boord van schepen met een éénmansstuurstelling voor het varen op radar moet een interne spreekverbinding
      aanwezig zijn.

      Vanaf de stuurstelling moeten de volgende spreekverbindingen tot stand kunnen worden gebracht:

      a. met het voorschip van het schip of het voorste gedeelte van het samenstel;

      b. met het achterschip van het schip of het achterste gedeelte van het samenstel, indien geen directe communicatie
      daarmee vanaf de stuurstelling mogelijk is;

      c. met het verblijf of de verblijven van de bemanning;

      d. met de hut van de schipper.

      Op alle punten van deze spreekverbinding dient het luisteren door luidsprekers en het spreken door vast opgestelde
      microfoons te kunnen geschieden. Met het voorschip en het achterschip van het schip of van het samenstel is een
      marifoonverbinding toegestaan.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel7.08
  - number: '7.09'
    text: |-
      1 Er moet een onafhankelijke alarminstallatie aanwezig zijn, waarmee de verblijven, de machinekamers en eventueel
      aparte pompkamers kunnen worden bereikt.

      2 De roerganger moet een schakelaar "AAN/UIT" voor de bediening van het alarmsein binnen zijn bereik hebben.
      Voor dit sein mag geen schakelaar worden gebruikt die, wanneer men hem loslaat, automatisch in de stand "UIT" kan
      terugspringen.

      3 Het geluidsniveau van het alarmsignaal moet in de verblijven ten minste 75 dB (A) bedragen.

      In de machine- en pompkamers moet een overal goed waarneembaar, rondom zichtbaar knipperlicht als alarmsignaal
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel7.09
  - number: '7.10'
    text: Stuurhuizen moeten zijn voorzien van een doeltreffende en regelbare verwarming en ventilatie.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel7.10
  - number: '7.11'
    text: |-
      Op schepen en samenstellen met een éénmansstuurstelling voor het varen op radar waarvan de lengte L meer dan 86 m
      of de breedte B meer dan 22,90 m bedraagt, moet de roerganger de hekankers vanaf zijn plaats kunnen presenteren.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel7.11
  - number: '7.12'
    text: |-
      In de hoogte verstelbare stuurhuizen moeten zijn voorzien van een noodinrichting waarmee deze kunnen worden
      neergelaten.

      Telkens wanneer het stuurhuis in een lagere stand wordt gezet, moet automatisch een akoestisch waarschuwingssignaal
      duidelijk waarneembaar zijn. Dit geldt niet wanneer door adequate bouwkundige maatregelen geen gevaar bestaat voor
      verwondingen ten gevolge van de verstelling van de hoogte.

      In alle hoogtestanden moet het mogelijk zijn het stuurhuis zonder gevaar te verlaten.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel7.12
  - number: '7.13'
    text: |-
      Wanneer een schip voldoet aan de in de [artikelen 7.01][ref1], [7.04 tot en met 7.08][ref2] en [7.11][ref3]
      bedoelde voorschriften voor schepen met een éénmansstuurstelling voor het varen op radar, moet in het certificaat
      van onderzoek worden aangetekend:

      "Goedgekeurd voor het voeren van het schip met behulp van radar door één persoon".


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel7.01
      [ref2]: https://wetten.overheid.nl/BWBR0007858#Artikel7.04
      [ref3]: https://wetten.overheid.nl/BWBR0007858#Artikel7.11
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel7.13
