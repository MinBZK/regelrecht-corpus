  - number: '23.06'
    text: |-
      1 Bij exploitatiewijze A1 heeft elk bemanningslid recht op een ononderbroken rusttijd van 8 uren buiten de vaartijd
      per tijdvak van 24 uren, gerekend vanaf het eind van elke rusttijd van 8 uren.

      2 Bij exploitatiewijze A2 heeft elk bemanningslid recht op een rusttijd van 8 uren, waarvan 6 uren ononderbroken
      buiten de vaartijd per tijdvak van 24 uren, gerekend vanaf het einde van elke rusttijd van 6 uren. Voor
      bemanningsleden onder de 18 jaar moet een ononderbroken rusttijd van 8 uren worden aangehouden waarvan 6 uren
      buiten de vaartijd.

      3 Bij exploitatiewijze B heeft elk bemanningslid recht op een rusttijd van 24 uren per tijdvak van 48 uren, waarvan
      er ten minste 2 maal 6 uren ononderbroken moeten zijn.

      4 Gedurende zijn verplichte rusttijd mag een bemanningslid niet worden verplicht tot enige taak, met inbegrip van
      toezicht houden of zich beschikbaar houden. De wacht en het toezicht zoals bedoeld in de politievoorschriften voor
      stilliggende vaartuigen worden niet beschouwd als taak in de zin van dit lid.

      5 Bepalingen in de arbeidsvoorschriften of collectieve arbeidsovereenkomsten die voorzien in een langere duur van
      de rusttijden blijven onverminderd van kracht.
