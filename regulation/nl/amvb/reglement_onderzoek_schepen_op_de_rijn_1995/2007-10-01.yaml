  - number: 8a.07
    text: |-
      De Centrale Commissie voor de Rijnvaart kan de gelijkwaardigheid erkennen van overeenstemmende normen vastgelegd in
      internationale regelingen, dan wel in voorschriften van de Rijnoeverstaten of België of van een derde land met de
      voorwaarden en de bepalingen van dit hoofdstuk inzake de typegoedkeuring van motoren.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel8a.07
  - number: 8a.08
    text: |-
      1 De bevoegde autoriteit die een typegoedkeuring verleent, zorgt ervoor dat de identificatienummers van de motoren
      die overeenkomstig de voorschriften van dit hoofdstuk zijn geproduceerd, zo nodig in samenwerking met de andere
      bevoegde autoriteiten, worden geregistreerd en gecontroleerd.

      2 Een bijkomende controle van de identificatienummers kan plaats vinden bij gelegenheid van de controle van de
      conformiteit van de produktie, bedoeld in [artikel 8a.09][ref1].

      3 Met betrekking tot de controle van de identificatienummers verstrekken de fabrikant of zijn in de Rijnoeverstaten
      en België gevestigde agenten op verzoek van de bevoegde autoriteit onverwijld alle benodigde gegevens
      betreffende de cliënten alsook de identificatienummers van de motoren, waarvan is medegedeeld dat zij conform
      [artikel 8a.06, derde lid][ref2], zijn geproduceerd.

      4 Indien een fabrikant, na een verzoek daartoe van de bevoegde autoriteit, niet in staat is de in
      [artikel 8a.06][ref3] bedoelde voorschriften na te komen, kan de goedkeuring voor het betreffende motortype of
      de betreffende motorfamilie of motorgroep worden ingetrokken. Daarvan wordt kennis gegeven volgens de procedure
      overeenkomstig [artikel 8a.10, vierde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel8a.09
      [ref2]: https://wetten.overheid.nl/BWBR0007858#Artikel8a.06
      [ref3]: https://wetten.overheid.nl/BWBR0007858#Artikel8a.06
      [ref4]: https://wetten.overheid.nl/BWBR0007858#Artikel8a.10
