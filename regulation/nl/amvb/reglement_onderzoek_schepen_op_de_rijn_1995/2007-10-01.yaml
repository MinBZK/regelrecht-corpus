      Onverminderd [artikel 23.03][ref1] betreffende de lichamelijke geschiktheid geldt de volgende overgangsregeling
      voor [hoofdstuk 23][ref2]:

      1 Een op 31 december 2001 in de binnenvaart werkzame deksman kan de bevoegdheid als matroos verkrijgen, nadat hij
      zijn 19e levensjaar heeft beëindigd en een vaartijd als lid van de dekbemanning van ten minste drie jaar heeft
      aangetoond; daarvan moeten ten minste een jaar in de binnenvaart en twee jaar in de binnenvaart of in de zee- of
      kustvaart of visserij vervuld zijn. Deze matroos kan de bevoegdheid als:

      a. volmatroos verkrijgen, wanneer hij een vaartijd in de Rijnvaart van ten minste een jaar als matroos kan
      aantonen,

      b. stuurman verkrijgen, wanneer hij een vaartijd in de Rijnvaart van ten minste twee jaar als matroos kan aantonen.

      2 Een op 31 december 2001 in de binnenvaart werkzame matroos kan de bevoegdheid als volmatroos verkrijgen, wanneer
      hij een vaartijd in de Rijnvaart van ten minste een jaar als matroos kan aantonen.

      3 Een op 31 december 2001 in de binnenvaart werkzame matroos kan de bevoegdheid als stuurman verkrijgen, wanneer
      hij een vaartijd in de Rijnvaart van ten minste twee jaar als matroos kan aantonen.

      4 Een op 31 december 2001 in de Rijnvaart werkzame volmatroos kan de bevoegdheid als stuurman verkrijgen, wanneer
      hij een vaartijd in de Rijnvaart van ten minste een jaar als volmatroos kan aantonen.

      5 Tot aan de eerstvolgende verlenging van het certificaat van onderzoek, echter uiterlijk tot 1 juli 2007, kan
      het voldoen aan [artikel 23.09, lid 1.1 of lid 1.2][ref3], zoals vereist in [artikel 23.09, tweede lid][ref4], als
      volgt in het certificaat van onderzoek worden aangetekend:

      a. Voor het voldoen aan [artikel 23.09, lid 1.1][ref5], volstaat een aantekening onder punt 47 als volgt: «Het
      schip voldoet aan [artikel 23.09, eerste lid][ref6]».

      b. Voor het voldoen aan [artikel 23.09, lid 1.2][ref7], volstaan de volgende aantekeningen:

        - in het geval van alleen varende motorschepen en van motorschepen die een gekoppeld samenstel voortbewegen: •
      onder punt 47: «Het schip voldoet aan [artikel 23.09, eerste lid][ref8]» en • onder punt 34:
        - in het geval van passagiersschepen: • onder punt 47: «Het schip voldoet aan [artikel 23.09, eerste lid][ref9]» en
      ofwel • onder punt 34: • dan wel onder punt 27: • en onder punt 29:


