    text: |-
      1 Voor vaartuigen, waarvan het minste vrijboord overeenkomstig artikel 4.04 van de op 31 maart 1983 geldende
      voorschriften is vastgesteld, kan de Commissie van Deskundigen op verzoek van de eigenaar het vrijboord vaststellen
      op grond van artikel 4.03 van de op 1 januari 1995 geldende voorschriften.

      2 Vaartuigen, waarvan de kiel is gelegd vóór 1 juli 1983, behoeven niet te voldoen aan hoofdstuk 9. Deze vaartuigen
      moeten echter ten minste voldoen aan hoofdstuk 6 van de op 31 maart 1983 geldende voorschriften.

      3 [Artikel 15.06, derde lid, onder a tot en met e][ref1], en [artikel 15.12, derde lid, onder a][ref2], met
      betrekking tot de bepaling over de enige slanglengte, zijn slechts van toepassing op passagiersschepen waarvan
      de kiel is gelegd ná 30 september 1984, alsmede in geval van verbouwing van de betrokken sectoren, uiterlijk bij
      verlenging van het certificaat van onderzoek na 1.1.2045.

      4 Indien de toepassing van de in dit hoofdstuk genoemde bepalingen na afloop van de overgangsbepalingen in de
      praktijk moeilijk uitvoerbaar is of onevenredig hoge kosten met zich brengt, kan de Commissie van Deskundigen op
      grond van aanbevelingen van de Centrale Commissie voor de Rijnvaart afwijkingen van deze voorschriften toestaan.
      Deze afwijkingen moeten in het certificaat van onderzoek worden aangetekend.

      5 Indien dit voorschrift bij de vereisten aan de hoedanigheid van uitrustingsstukken verwijst naar een Europese of
      internationale norm, mogen na een nieuwe formulering of bewerking van die norm de betreffende uitrustingsstukken
      nog 20 jaar na de nieuwe formulering of bewerking van de norm verder worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel15.06
