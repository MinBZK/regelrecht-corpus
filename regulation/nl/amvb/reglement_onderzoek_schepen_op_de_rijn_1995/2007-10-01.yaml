  - number: '16.02'
    text: |-
      1 Voor duwbakken zonder stuurinrichting, verblijven, machinekamers of ketelruimen zijn niet van toepassing:

      a. de [hoofdstukken 5][ref1], [6][ref2], [7][ref3] en [12][ref4];

      b. de [artikelen 8.06, tweede tot en met achtste lid][ref5], [10.02][ref6] en [10.05, eerste lid][ref7].

      Indien stuurinrichtingen, verblijven, machinekamers of ketelruimen aanwezig zijn, zijn de dienovereenkomstige
      vereisten van dit Reglement van toepassing.

      2 Voor zeeschipbakken met een lengte L van ten hoogste 40 m geldt bovendien:

      a. Waterdichte schotten als bedoeld in [artikel 3.03, eerste lid][ref8], zijn niet vereist, wanneer de frontale
      gedeelten van de bak zodanig zijn versterkt dat zij een belasting kunnen opnemen die ten minste 2,5 maal zo groot
      is als die van het aanvaringsschot van een binnenschip met een overeenkomstige diepgang dat is gebouwd volgens de
      voorschriften van een door alle Oeverstaten en België erkend classificatiebureau;

      b. In afwijking van [artikel 8.06, eerste lid][ref9], behoeven moeilijk toegankelijke afdelingen van een dubbele
      bodem slechts gelenst te kunnen worden, wanneer hun inhoud meer bedraagt dan 5% van de waterverplaatsing van de
      zeeschipbak bij de grootste toegelaten inzinking.

      3 Vaartuigen die geduwd moeten worden moeten zijn voorzien van koppelingsinrichtingen die een veilige verbinding
      met andere vaartuigen waarborgen.


