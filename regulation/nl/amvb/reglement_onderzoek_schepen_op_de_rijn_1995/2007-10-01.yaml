  - number: '23.07'
    text: |-
      1 In afwijking van [artikel 23.05, eerste en derde lid][ref1], is een wisseling of herhaling van exploitatiewijze
      slechts mogelijk met inachtneming van het tweede tot met zesde lid.

      2 Van exploitatiewijze A1 mag slechts dan naar exploitatiewijze A2 worden gewisseld, indien:

      a) de bemanning in zijn geheel is afgelost, of

      b) de voor exploitatiewijze A2 bestemde bemanningsleden direct vóór de wisseling een rusttijd van 8 uren, waarvan
      6 uren buiten de vaartijd, in acht genomen en aangetoond hebben en de voor exploitatiewijze A2 voorgeschreven
      versterking zich aan boord bevindt.

      3 Van exploitatiewijze A2 mag slechts dan naar exploitatiewijze A1 worden gewisseld, indien:

      a) de bemanning in zijn geheel is afgelost, of

      b) de voor exploitatiewijze A1 bestemde bemanningsleden direct vóór de wisseling een ononderbroken rusttijd van 8
      uren buiten de vaartijd in acht genomen en aangetoond hebben.

      4 Van exploitatiewijze B mag slechts dan naar exploitatiewijze A1 of A2 worden gewisseld, indien:

      a) de bemanning in zijn geheel is afgelos, of

      b) de voor exploitatiewijze A1, onderscheidenlijk A2 bestemde bemanningsleden direct vóór de wisseling een
      ononderbroken rusttijd van 8, onderscheidenlijk 6 uren in acht genomen en aangetoond hebben.

      5 Van exploitatiewijze A1 of A2 mag slechts dan naar exploitatiewijze B worden gewisseld, indien:

      a) de bemanning in zijn geheel is afgelost, of

      b) de voor exploitatiewijze B bestemde bemanningsleden direct vóór de wisseling een ononderbroken rusttijd van
      8, onderscheidenlijk 6 uren buiten de vaartijd in acht genomen en aangetoond hebben en de voor exploitatiewijze B
      voorgeschreven versterking zich aan boord bevindt.

      6 Een schip kan onmiddellijk in aansluiting op de exploitatiewijze A1 of A2 voor een verdere A1 of A2 worden
      ingezet, indien een voltallige uitwisseling van de bemanning heeft plaatsgevonden en de nieuwe bemanningsleden
      onmiddellijk voorafgaand aan de verdere exploitatiewijze A1 en A2 een ononderbroken rusttijd van 8,
      onderscheidenlijk 6 uren buiten de vaartijd in acht genomen en aangetoond hebben.

      7 Het bewijs van een rusttijd van 8, onderscheidenlijk 6 uren wordt aangetoond met een verklaring als bedoeld in
      bijlage K of door een kopie van de pagina met aantekeningen van de vaar-, onderscheidenlijk rusttijden uit het
      vaartijdenboek van het schip, waarop de laatste reis van het bemanningslid heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel23.05
