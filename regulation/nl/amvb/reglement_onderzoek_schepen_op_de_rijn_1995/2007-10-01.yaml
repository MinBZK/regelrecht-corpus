  - number: 8a.05
    text: |-
      1 De bevoegde autoriteit, die de typegoedkeuring heeft verleend, moet de nodige maatregelen nemen om ervoor te
      zorgen dat zij in kennis wordt gesteld van iedere wijziging van de gegevens in het informatiepakket.

      2 De aanvraag om wijziging of uitbreiding van een typegoedkeuring wordt uitsluitend ingediend bij de bevoegde
      autoriteit die de oorspronkelijke typegoedkeuring heeft verleend.

      3 Indien in het informatiepakket vermelde gegevens worden gewijzigd, verstrekt de bevoegde autoriteit:

      a. indien nodig, de herziene bladzijden van het informatiepakket; op iedere herziene bladzijde moeten duidelijk
      de aard van de wijziging en de datum van de herziene versie zijn vermeld; bij iedere heruitgave van bladzijden
      moet ook de inhoudsopgave van het informatiepakket (dat bij het certificaat van typegoedkeuring is gevoegd) worden
      gewijzigd om deze in overeenstemming te brengen met de laatste stand van zaken;

      b. een herzien certificaat van typegoedkeuring (met een uitbreidingsnummer) indien de daarin voorkomende
      gegevens (met uitzondering van de bijlagen) zijn gewijzigd of indien de minimum eisen van dit hoofdstuk sinds de
      oorspronkelijke datum van de goedkeuring zijn veranderd; in dit herziene certificaat moeten duidelijk de reden voor
      de herziening en de datum van afgifte van de herziene versie worden vermeld.

      Indien de bevoegde autoriteit die de typegoedkeuring heeft verleend vastgesteld heeft, dat een voorgenomen
      wijziging van het informatiepakket aanleiding is voor nieuwe proeven of tests, stelt zij de fabrikant daarvan
      in kennis en geeft zij de bovengenoemde documenten pas af nadat de nieuwe proeven of tests met goed gevolg zijn
      verricht.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel8a.05
  - number: 8a.06
    text: |-
      1 De fabrikant brengt op iedere eenheid die conform de typegoedkeuring is geproduceerd de in
      [bijlage J, deel I, onderdeel 1][ref1], vastgestelde merktekens aan met inbegrip van het typegoedkeuringsnummer.

      2 Indien de typegoedkeuring overeenkomstig [artikel 8a.04, derde lid][ref2], beperkingen aan het gebruik bevat,
      moeten door de fabrikant bij iedere gefabriceerde eenheid gedetailleerde gegevens over deze beperkingen alsmede de
      volledige inbouwvoorschriften worden bijgeleverd.

      3 De fabrikant zendt op verzoek van de autoriteit die de typegoedkeuring heeft verleend binnen 45 dagen na het
      einde van ieder kalenderjaar, en onmiddellijk na ieder verder tijdstip dat door de autoriteit is vastgesteld,
      een lijst met de identificatienummers (serienummers) van alle motoren die conform de eisen van dit hoofdstuk zijn
      geproduceerd sinds de laatste lijst werd ingediend of sinds de datum waarop deze voorschriften voor het eerst van
      kracht werden. Indien het codesysteem van de motor daarover geen uitsluitsel geeft, moet deze lijst het verband
      aangeven tussen de identificatienummers en de daarbij behorende motortypes, de motorfamilies of de motorgroepen en
      de typegoedkeuringsnummers. Bovendien moet de lijst bijzondere gegevens bevatten indien de fabrikant niet langer
      een goedgekeurd motortype, een goedgekeurde motorfamilie of motorgroep produceert. Indien de bevoegde autoriteit
      niet verlangt dat deze lijst haar regelmatig wordt toegezonden, moet de fabrikant de geregistreerde gegevens
      gedurende ten minste 40 jaren bewaren.


      [ref1]: https://wetten.overheid.nl/BWBR0007858
      [ref2]: https://wetten.overheid.nl/BWBR0007858#Artikel8a.04
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel8a.06
