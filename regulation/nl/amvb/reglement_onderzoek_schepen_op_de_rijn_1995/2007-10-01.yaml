    text: |-
      1 Onverminderd [artikel 2.03][ref1] moeten snelle schepen worden gebouwd onder toezicht en volgens de toepasselijke
      voorschriften van een erkend classificatiebureau, dat beschikt over bijzondere regels voor snelle schepen, en door
      dat bureau geclassificeerd zijn. De klasse moet worden gehandhaafd.

      2 In afwijking van [artikel 2.06][ref2] bedraagt de geldigheidsduur van de certificaten van onderzoek, die volgens
      dit hoofdstuk zijn afgegeven ten hoogste vijf jaren.


