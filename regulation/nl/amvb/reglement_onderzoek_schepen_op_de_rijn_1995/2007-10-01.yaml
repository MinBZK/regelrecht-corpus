      1 De volgende artikelen zijn niet van toepassing:

      a. [artikel 3.02, eerste lid, onder b][ref1];

      b. [artikelen 4.01 tot en met 4.03][ref2];

      c. [artikel 8.06, tweede lid, tweede alinea, en zevende lid][ref3];

      d. [artikel 9.14, derde lid, tweede alinea][ref4], bij nominale spanningen van meer dan 50V.

      2 De volgende installaties zijn op passagiersschepen verboden:

      a. Lampen die werken op vloeibaar gas en vloeibare brandstof als bedoeld in
      [artikel 12.07, derde lid, tweede zin][ref5];

      b. Met pitbranders uitgeruste installaties als bedoeld in [artikel 13.02, tweede en derde lid][ref6];

      c. Oliekachels met verdampingsbranders als bedoeld in [artikel 13.04][ref7];

      d. Verwarmingsapparaten en verwarmingsketels als bedoeld in [artikel 13.07][ref8];

      e. Vloeibaargasinstallaties als bedoeld in [hoofdstuk 14][ref9].

      3 Schepen, die niet van eigen mechanische middelen tot voortbeweging zijn voorzien, kunnen niet tot het vervoer van
      passagiers worden toegelaten.

      4 Op passagiersschepen moeten ruimten beschikbaar zijn voor mensen met een beperkte mobiliteit, die aan de in dit
      hoofdstuk genoemde bepalingen voldoen. In geval de toepassing van de in dit hoofdstuk genoemde bepalingen, die te
      maken hebben met het rekening houden met de bijzondere veiligheidsbehoeften van personen met beperkte mobiliteit,
      praktisch moeilijk uitvoerbaar is of onevenredig hoge kosten veroorzaakt, kan de Commissie van Deskundigen op grond
      van aanbevelingen van de Centrale Commissie voor de Rijnvaart afwijkingen van deze voorschriften toestaan. Deze
      afwijkingen moeten in het certificaat van onderzoek worden aangetekend.


