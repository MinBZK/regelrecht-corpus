  - number: '16.07'
    text: |-
      1 Indien een vaartuig een samenstel moet voortbewegen of daarin moet worden voortbewogen, moet
      in het certificaat van onderzoek zijn aangetekend dat het daarvoor geschikt is overeenkomstig de
      [artikelen 16.01 tot en met 16.06][ref1].

      2 In het certificaat van onderzoek van het vaartuig dat voor de voortbeweging zorgdraagt moet worden aangetekend:

      a. de toegelaten samenstellen en formaties;

      b. het soort koppelingen;

      c. de vastgestelde grootste koppelingskrachten, en

      d. eventueel de minimum breeksterkte van de koppelingskabels van de langsverbindingen, alsmede het aantal windingen
      van de koppelingskabels.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel16.01
