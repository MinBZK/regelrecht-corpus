  - number: 10.03c
    text: |-
      Voor de bescherming van objecten zijn vast geïnstalleerde brandblusinstallaties slechts toegestaan op grond van
      aanbevelingen van de Centrale Commissie van de Rijnvaart.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel10.03c
  - number: '10.04'
    text: |-
      1 De volgende vaartuigen moeten met een bijboot overeenkomstig de Europese norm EN 1914: 1997, zijn uitgerust:

      a. motorschepen en sleepschepen met een laadvermogen van meer dan 150 t;

      b. sleepboten en duwboten met een waterverplaatsing van meer dan 150 m3;

      c. drijvende werktuigen; en

      d. passagiersschepen.

      2 Bijboten moeten binnen 5 minuten, te rekenen vanaf de eerste daartoe noodzakelijke handeling, door één persoon
      veilig te water kunnen worden gelaten. Indien zij door middel van een door een motor aangedreven inrichting te
      water worden gelaten, moet deze zo zijn ingericht dat uitvallen van de energietoevoer het snel en veilig te water
      laten niet kan verhinderen.

      3 Opblaasbare bijboten moeten zijn getest overeenkomstig de indicaties van de fabrikant.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel10.04
  - number: '10.05'
    text: |-
      1 Aan boord van vaartuigen moeten ten minste drie reddingsboeien overeenkomstig de Europese norm EN 14 144 :
      2002 aanwezig zijn. Zij moeten zich in gebruiksklare toestand op vaste en daarvoor geschikte plaatsen aan dek
      bevinden en mogen niet zijn vastgemaakt aan de houders. Ten minste één reddingsboei moet zich in de onmiddellijke
      nabijheid van het stuurhuis bevinden en deze moet zijn voorzien van een automatisch ontbrandend licht, gevoed door
      batterijen, dat in het water niet kan uitgaan.

      2 Aan boord van vaartuigen moet zich voor ieder zich regelmatig aan boord bevindend persoon een voor hem
      persoonlijk geschikt, automatisch opblaasbaar reddingsvest, dat voldoet aan de Europese norm EN 395 : 1998, of EN
      396 : 1998, onder handbereik bevinden. Voor kinderen zijn ook harde reddingsvesten, die aan deze normen voldoen,
      toegelaten.

      3 Zwemvesten moeten zijn getest overeenkomstig de indicaties van de fabrikant.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel10.05
  - number: '11.01'
    text: |-
      1 Vaartuigen moeten zodanig zijn gebouwd, ingericht en uitgerust, dat personen daarop veilig kunnen werken en zich
      verplaatsen.

      2 De voor het werk aan boord noodzakelijke en vast opgestelde voorzieningen moeten zodanig zijn ingericht,
      opgesteld en beveiligd, dat ze gemakkelijk en zonder gevaar bediend, gebruikt en onderhouden kunnen worden. Zo
      nodig moeten bewegende en hete delen van beschermende inrichtingen zijn voorzien.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel11.01
  - number: '11.02'
    text: |-
      1 Dekken en gangboorden moeten vlak zijn en moeten vrij zijn van obstakels waarover men kan struikelen; ze moeten
      zodanig zijn uitgevoerd dat er geen water op kan blijven staan.

      2 Dekken alsmede gangboorden, machinekamervloeren, bordessen, trappen en de bolderdeksels in de gangboorden moeten
      veiligheid bieden tegen uitglijden.

      3 Bolderdeksels in de gangboorden en hindernissen in de verkeerswegen, zoals bijvoorbeeld randen van traptreden,
      moeten in een met het omgevende dek contrasterende kleur zijn geverfd.

      4 Buitenkanten van de dekken en de werkplekken, waarbij de valhoogte meer dan 1 m kan bedragen, moeten zijn
      voorzien van een verschansing of den van elk ten minste 0,70 m hoogte of van relingen die voldoen aan de Europese
      norm EN 711 : 1995, die bestaan uit een handreling, een tussenroede op kniehoogte en een voetlijst. Bij gangboorden
      moet een voetlijst en een doorlopende handreling aan de dennenboom zijn aangebracht. De handreling aan de
      dennenboom kan achterwege worden gelaten, indien het gangboord voorzien is van een niet neerklapbare reling.

      5 Voor werkplekken, waar de valhoogte meer dan 1 meter bedraagt, kan de Commissie van Deskundigen geschikte
      inrichtingen en uitrustingen ten behoeve van het veilig werken eisen.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel11.02
  - number: '11.03'
    text: Werkplekken moeten zo groot zijn dat iedere persoon die er werkt voldoende bewegingsvrijheid heeft.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel11.03
  - number: '11.04'
    text: |-
      1 De vrije breedte van het gangboord moet ten minste 0,60 m bedragen. Op de plaats van bepaalde ingebouwde
      noodzakelijke constructies (zoals afsluiters voor dekwasleidingen) behoeft dit slechts 0,50 m te zijn en bij
      bolders en klampen 0,40 m.

      2 De vrije breedte van het gangboord kan tot een hoogte van 0,90 m daarboven tot 0,54 m beperkt blijven wanneer
      de vrije breedte in het gedeelte daarboven tussen de buitenkant van de scheepshuid en de binnenkant van de opening
      van het laadruim ten minste 0,65 m bedraagt. In dit geval kan de vrije breedte van het gangboord tot 0,50 m beperkt
      blijven, indien aan de buitenkant van het gangboord een reling is aangebracht als voorziening tegen overboord
      vallen van personen, die voldoet aan de Europese norm EN 711 : 1995. Deze reling behoeft niet te zijn aangebracht
      op schepen met een lengte van 55 m of minder die slechts verblijven op het achterschip hebben.

      3 Het eerste en tweede lid gelden tot een hoogte van 2,00 m boven het gangboord.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel11.04
  - number: '11.05'
    text: |-
      1 Bij gangen, toegangen en doorgangen, die door personen of voor het verplaatsen van goederen worden gebruikt,
      moet:

      a. voor de toegangsopeningen voldoende plaats zijn voor onbelemmerde beweging;

      b. de vrije breedte van de doorgangen overeenkomen met de bestemming van de werkplekken, maar ten minste 0,60 m
      bedragen. Bij schepen met een breedte van niet meer dan 8 m behoeft de breedte van de doorgangen slechts 0,50 m
      te bedragen;

      c. de vrije hoogte van de doorgangen inclusief de hoogte van de drempels ten minste 1,90 m bedragen.

      2 Deuren moeten van beide zijden zonder gevaar geopend en gesloten kunnen worden. Ze moeten zodanig zijn uitgevoerd
      dat zij niet onopzettelijk open of dicht kunnen gaan.

      3 In- en uitgangen en gangen die hoogteverschillen van meer dan 0,50 m hebben moeten zijn voorzien van adequate
      trappen, ladders of klimtreden.

      4 Wanneer het hoogteverschil bij permanent bezette werkplekken meer dan 1,00 m bedraagt, moeten er trappen zijn.
      Dit geldt niet voor nooduitgangen.

      5 Bij schepen met laadruimen moet ten minste bij ieder uiteinde van ieder laadruim een vast ingebouwde
      klimvoorziening aanwezig zijn.

      In afwijking hiervan behoeft geen vast ingebouwde klimvoorziening aanwezig te zijn indien er tenminste twee
      draagbare ruimladders aanwezig zijn die bij een hellingshoek van 60° met tenminste drie treden tot boven de rand
      van het luik moeten reiken.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel11.05
  - number: '11.06'
    text: |-
      1 Het aantal, de constructie en de afmetingen van de uitgangen met inbegrip van de nooduitgangen moeten
      overeenkomen met de bestemming en de grootte van de ruimten. Wanneer één van deze uitgangen een nooduitgang is,
      moet die duidelijk als zodanig zijn aangeduid.

      2 Nooduitgangen of als nooduitgang dienende vensters of bovenlichten moeten een vrije opening van ten minste 0,36
      m² hebben, waarbij de kortste zijde ten minste 0,50 m moet bedragen.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel11.06
  - number: '11.07'
    text: |-
      1 Trappen en ladders moeten veilig zijn bevestigd. Trappen moeten ten minste 0,60 m breed zijn; de vrije breedte
      tussen de handrelingen moet ten minste 0,60 m bedragen; de diepte van de treden mag niet minder zijn dan 0,15
      m; het oppervlak van de treden moet veiligheid bieden tegen uitglijden; trappen met meer dan drie treden moeten
      handrelingen hebben.

      2 Ladders en klimtreden moeten een vrije breedte van ten minste 0,30 m hebben; de afstand tussen de sporten mag
      niet meer dan 0,30 m bedragen; de afstand van de sporten tot constructiedelen moet ten minste 0,15 m zijn.

      3 Ladders en klimtreden moeten van boven herkenbaar zijn en met handgrepen boven de uitgangsopeningen zijn
      uitgerust.

      4 Aanleunladders moeten ten minste 0,40 m en onderaan ten minste 0,50 m breed zijn; ze moeten kunnen worden
      beveiligd tegen kantelen en wegglijden; de sporten moeten vast in de boom zijn bevestigd.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel11.07
  - number: '11.08'
    text: |-
      1 Binnen in het schip gelegen werkplekken moeten naar grootte, inrichting en indeling zijn aangepast aan de daar
      te verrichten werkzaamheden en voldoen aan de eisen inzake hygiëne en veiligheid. Ze moeten voldoende en niet
      verblindend kunnen worden verlicht en voldoende kunnen worden geventileerd; zo nodig moeten zij zijn voorzien van
      verwarmingsapparaten die een redelijke temperatuur waarborgen.

      2 Vloeren van binnen in het schip gelegen werkplekken moeten vast zijn, duurzaam uitgevoerd, en veiligheid bieden
      tegen struikelen en uitglijden. Openingen in dekken en vloeren moeten in geopende toestand een beveiliging hebben
      tegen het gevaar van vallen. Vensters en bovenlichten moeten zodanig zijn uitgevoerd en gesitueerd dat ze zonder
      gevaar kunnen worden bediend en gereinigd.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel11.08
  - number: '11.09'
    text: |-
      1 De werkplekken moeten zodanig zijn gelegen, ingericht en ontworpen dat de werknemers niet aan het gevaar van
      trillingen zijn blootgesteld.

      2 Permanent gebruikte werkruimten moeten bovendien zodanig zijn gebouwd en geïsoleerd tegen geluid dat de
      veiligheid en de gezondheid van de werknemers niet door geluidshinder in gevaar worden gebracht.

      3 Voor werknemers die dagelijks aan een geluidsdruk van meer dan 85 dB(A) worden blootgesteld, moeten
      persoonlijke gehoorbeschermings-middelen aanwezig zijn. Werkplekken waar deze waarden meer zijn dan 90 dB(A)
      moeten zijn voorzien van een teken «gehoorbescherming verplicht» met een diameter van ten minste 10 cm,
      overeenkomstig [schets 7 van bijlage I][ref1], waarin wordt gewezen op de plicht tot het gebruiken van deze
      gehoorbeschermingsmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0007858
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel11.09
    references:
      - id: ref1
        bwb_id: BWBR0007858
  - number: '11.10'
    text: |-
      1 Luiken moeten gemakkelijk bereikt en veilig bewogen kunnen worden. Delen van luiken met een gewicht van meer
      dan 40 kg moeten bovendien schuifbaar of neerklapbaar zijn of zodanig zijn ingericht dat zij mechanisch kunnen
      worden opgetild. Luiken die met behulp van hefwerktuigen worden bewogen, moeten zijn voorzien van adequate en
      gemakkelijk toegankelijke inrichtingen voor het vastmaken van de aanslagmiddelen. Op luiken of schaarstokken die
      niet uitwisselbaar zijn moet duidelijk het luik waarbij ze behoren en de exacte plaats daarop zijn aangegeven.

      2 Luiken moeten beveiligd kunnen worden tegen oplichten door wind en laadinrichtingen. Schuifluiken moeten zijn
      voorzien van vergrendelingen die onopzettelijke beweging in de lengterichting met meer dan 0,40 m verhinderen;
      zij moeten in hun uiterste stand kunnen worden vastgezet. Er moeten geschikte inrichtingen aanwezig zijn voor het
      bevestigen van opgestapelde luiken.

      3 Bij mechanisch bediende luiken moet de energietoevoer na het loslaten van de bedieningsschakelaar automatisch
      worden onderbroken.

      4 Luiken moeten de te verwachten belasting, begaanbare luiken ten minste 75 kg, als puntlast kunnen opnemen. Niet
      begaanbare luiken moeten als zodanig zijn aangeduid. Op luiken die bestemd zijn voor het dragen van deklast moet
      de toegelaten belasting in t/m² staan aangeduid. Indien voor het bereiken van de toegelaten belasting stutten nodig
      zijn, moet daarop op een geschikte plaats worden gewezen; in dat geval moeten tekeningen voor dit doel aan boord
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel11.10
  - number: '11.11'
    text: |-
      1 Lieren moeten zodanig zijn ingericht dat veilig werken mogelijk is. Ze moeten voorzieningen hebben die het
      onopzettelijk teruglopen van de last verhinderen. Lieren die geen automatische rem hebben moeten zijn uitgerust met
      een op de trekkracht berekende rem.

      2 Lieren die met de hand worden bediend moeten zijn voorzien van inrichtingen die het terugslaan van de zwengels
      verhinderen. Lieren die zowel met de hand als mechanisch kunnen worden bediend moeten zodanig zijn ingericht dat de
      mechanische aandrijving niet het handmechanisme in werking kan stellen.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel11.11
  - number: '11.12'
    text: |-
      1 Kranen moeten volgens de regels van de techniek zijn gebouwd. De tijdens het in bedrijf zijn optredende krachten
      moeten veilig worden overgebracht op de scheepsconstructie; zij mogen de stabiliteit niet in gevaar brengen.

      2 Op elke kraan moet een fabriekslabel met de volgende gegevens zijn aangebracht:

      a. naam en adres van de fabrikant;

      b. het EG-kenteken met vermelding van het bouwjaar;

      c. aanduiding van de serie of het type;

      d. eventueel serienummer.

      3 Op elke kraan moet de ten hoogste toelaatbare belasting duurzaam en duidelijk zichtbaar zijn aangebracht.

      Bij kranen waarvan de bedrijfslast niet meer bedraagt dan 2000 kg hoeft alleen de ten hoogste toelaatbare
      bedrijfslast bij de grootste vlucht van de kraan duurzaam en duidelijk zichtbaar te zijn aangebracht.

      4 Ter voorkoming van het gevaar van persoonlijk letsel moeten beschermende voorzieningen aanwezig zijn. De
      buitenste delen van de kraan moeten ten opzichte van alle delen van de omgeving van de kraan een veiligheidsafstand
      naar boven, beneden en naar opzij van ten minste 0,50 m hebben. De veiligheidsafstand naar opzij is buiten het
      gebied waar gewerkt en gelopen wordt niet noodzakelijk.

      5 Kranen die mechanisch worden aangedreven moeten kunnen worden beschermd tegen gebruik door onbevoegden. Ze mogen
      slechts aan de voor de kraan voorziene bedieningsinrichting in werking kunnen worden gesteld. De bedieningsorganen
      moeten automatisch in de stopstand terugkeren (schakelaar die niet automatisch in de in werking gestelde stand
      blijft); duidelijk zichtbaar moet zijn in welke richting zij functioneren.

      Bij het uitvallen van de aandrijfenergie mag de last niet automatisch kunnen teruglopen. Onopzettelijke
      kraanbewegingen moeten worden voorkomen.

      De opwaartse beweging van het hijsmiddel en de overschrijding van de bedrijfslast moeten door adequate
      voorzieningen zijn beperkt. De neerwaartse beweging van het hijsmiddel moet beperkt zijn wanneer bij het voorziene
      gebruik van de kraan, op het moment dat het hijsmiddel wordt bevestigd aan de last, minder dan twee wikkelingen van
      de hijskabel op de liertrommel over zijn. Na het aanspreken van de automatische (beveiligings-)voorzieningen, moet
      de respectieve tegengestelde beweging nog mogelijk zijn.

      De breeksterkte van draadkabels voor het lopende werk moet ten minste het vijfvoudige van de maximaal toelaatbare
      kabeltreksterkte bedragen. De constructie van de draadkabel moet onberispelijk zijn en moet geschikt zijn voor het
      gebruik bij kranen.

      6 Voor de eerste ingebruikneming en voor het opnieuw in gebruik nemen na ingrijpende wijzigingen dient de
      aanwezigheid van voldoende stevigheid en stabiliteit rekenkundig en door een belastingsproef aan boord te worden
      aangetoond.

      Voor kranen waarvan de bedrijfslast niet meer bedraagt dan 2000 kg kan de deskundige beslissen het rekenkundige
      bewijs geheel of gedeeltelijk te vervangen door een proef met het 1,25-voudige van de bedrijfslast die over het
      hele werkgebied wordt uitgevoerd.

      De in de eerste of tweede alinea bedoelde keuring moet door een door de Commissie van Deskundigen erkende
      deskundige worden verricht.

      7 Kranen dienen regelmatig, echter ten minste eens in de twaalf maanden, door een deskundige te worden onderzocht.
      Hierbij dient door visuele controle en controle van het functioneren te worden vastgesteld dat de kraan veilig is.

      8 Uiterlijk om de 10 jaar na de keuring dient de kraan opnieuw door een door de Commissie van Deskundigen erkende
      deskundige te worden getest.

      9 Kranen waarvan de bedrijfslast meer dan 2000 kg bedraagt, die dienen voor de overslag van vracht, of die aan
      boord van bokken, pontons en andere drijvende werktuigen of schepen bestemd voor bouwwerkzaamheden zijn opgesteld,
      moeten bovendien voldoen aan de voorschriften van een Oeverstaat of van België.

      10 Voor alle kranen moeten ten minste de volgende bescheiden aan boord aanwezig zijn:

      a. de gebruiksaanwijzing van de fabrikant van de kraan. Deze moet ten minste de volgende gegevens bevatten:

        - toepassing en functie van de bedieningsorganen;
        - maximaal toelaatbare bedrijfslast overeenkomstig de vlucht;
        - maximaal toelaatbare helling van de kraan;
        - handleiding voor montage en onderhoud;
        - richtlijnen voor de regelmatige controles;
        - algemene technische gegevens.

      b. de verklaring over uitgevoerde testen als bedoeld in het zesde, zevende, achtste of negende lid.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel11.12
  - number: '11.13'
    text: |-
      Ten behoeve van de opslag van brandbare vloeistoffen met een vlampunt van minder dan 55° C moet zich aan dek
      een geventileerde kast van onbrandbaar materiaal bevinden. De buitenkant daarvan moet zijn voorzien van een
      teken «Vuur, open licht en roken verboden» met een lengte van de zijde van ten minste 10 cm, overeenkomstig
      [schets 2 van bijlage I][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007858
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel11.13
    references:
      - id: ref1
        bwb_id: BWBR0007858
  - number: '12.01'
    text: |-
      1 Schepen moeten voor de gewoonlijk aan boord verblijvende personen, althans ten minste voor de minimum bemanning,
      voorzien zijn van verblijven.

      2 Verblijven moeten zodanig zijn gebouwd, ingericht en uitgerust dat zij voldoen aan de eisen met betrekking tot de
      veiligheid, de gezondheid en het welzijn van de personen aan boord. Zij moeten gemakkelijk en veilig toegankelijk
      zijn, alsmede voldoende geïsoleerd zijn tegen kou en warmte.

      3 De Commissie van Deskundigen kan afwijkingen van dit hoofdstuk toestaan indien de veiligheid en gezondheid van de
      personen aan boord op andere wijze zijn gewaarborgd.

      4 De Commissie van Deskundigen vermeldt in het certificaat van onderzoek beperkingen van de exploitatiewijze of van
      de soort bedrijfsvoering van het schip die zijn vereist op grond van afwijkingen als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel12.01
  - number: '12.02'
    text: |-
      1 Verblijven moeten, ook wanneer de deuren gesloten zijn, voldoende kunnen worden geventileerd; bovendien moeten de
      woonruimten voldoende daglicht verkrijgen en zo mogelijk uitzicht naar buiten hebben.

      2 Verblijven moeten, indien zij niet op dekhoogte toegankelijk zijn en het hoogteverschil meer dan 0,30 m bedraagt,
      via trappen toegankelijk zijn.

      3 In het voorschip mogen de vloeren niet lager dan 1,20 m onder het vlak van de grootste inzinking liggen.

      4 Woon- en slaapruimten moeten ten minste twee zover mogelijk van elkaar verwijderde uitgangen hebben, die als
      vluchtwegen dienen. Eén uitgang kan als nooduitgang zijn geconstrueerd. Dit geldt niet voor ruimten waarvan
      de uitgang rechtstreeks naar het dek leidt of naar een gang die als vluchtweg dient, voor zover deze gang twee
      van elkaar verwijderd liggende uitgangen heeft naar bak- en stuurboord. Nooduitgangen, waartoe ook bovenlichten
      en ramen kunnen behoren, moeten een vrije opening van ten minste 0,36 m² hebben, een kleinste zijde van ten
      minste 0,50 m hebben en een snelle evacuatie in geval van nood mogelijk maken. De isolering en de bekleding van
      oppervlakken van de vluchtwegen moeten van moeilijk ontvlambaar materiaal zijn gemaakt en het gebruik van de
      vluchtwegen moet door adequate maatregelen zoals ladders of klimtreden te allen tijde zijn gewaarborgd.

      5 Verblijven moeten zijn beschermd tegen ontoelaatbare geluidshinder en trillingen. De ten hoogste toegelaten
      niveaus van de geluidsdruk zijn:

      a. in woonruimten: 70 dB(A);

      b. in slaapruimten: 60 dB(A).

      Dit geldt echter niet op schepen waarvoor uitsluitend exploitatiewijze A geldt. De beperking wat betreft de
      exploitatiewijze dient in het certificaat van onderzoek te worden vermeld.

      6 In verblijven mag de stahoogte niet minder zijn dan 2,00 m.

      7 In de regel moeten de schepen ten minste één van de slaapruimte afgescheiden woonruimte hebben.

      8 In woonruimten mag het vrije vloeroppervlak niet minder zijn dan 2 m² per persoon, maar moet dit in totaal ten
      minste 8 m² zijn. De oppervlakte bezet met verplaatsbaar meubilair, zoals tafels en stoelen, maakt deel uit van de
      vrije oppervlakte.

      9 Elke woon- of slaapruimte moet een inhoud van ten minste 7,00 m³ hebben.

      10 In woonruimten bedraagt het minimale luchtvolume 3,50 m³ per persoon. In slaapruimten moet het luchtvolume
      voor de eerste persoon ten minste 5,00 m3 bedragen, voor iedere verdere persoon moet nog eens ten minste 3,00 m3
      aanwezig zijn (het volume van het meubilair dient daarvan te worden afgetrokken). Slaapruimten mogen slechts voor
      ten hoogste twee personen bestemd zijn. De bedden moeten ten minste 0,30 m boven de vloer zijn aangebracht. Indien
      het stapelbedden betreft, moet boven elk bed een vrije ruimte van ten minste 0,60 m hoogte aanwezig zijn.

      11 Deuren moeten een opening hebben waarvan de bovenkant ten minste 1,90 m boven het dek of de vloer ligt en
      zij moeten een vrije breedte van ten minste 0,60 m hebben. De voorgeschreven hoogte mag door het aanbrengen
      van schuifkappen of luiken worden bereikt. Deuren moeten van beide kanten naar buiten kunnen worden geopend.
      Deurdrempels mogen ten hoogste 0,40 m hoog zijn. Bovendien moeten andere veiligheidsvoorschriften worden nageleefd.

      12 Trappen moeten vast aangebracht en veilig begaanbaar zijn. Dit is het geval wanneer:

      a. zij ten minste 0,60 m breed zijn;

      b. de treden ten minste 0,15 m diep zijn;

      c. de treden een antisliplaag hebben, en

      d. trappen met meer dan drie treden zijn voorzien van ten minste een handgreep of leuning.

      13 Leidingen voor gevaarlijke gassen en gevaarlijke vloeistoffen, in het bijzonder als ze onder een zodanig hoge
      druk staan dat een lek personen in gevaar zou kunnen brengen, mogen niet zijn aangelegd in de verblijven en in
      de daarheen leidende gangen. Dit geldt niet voor leidingen voor stoomsystemen en hydraulische systemen die zijn
      ondergebracht in een metalen beschermkoker en voor vast aangelegde leidingen van vloeibaar-gasinstallaties voor
      huishoudelijk gebruik.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel12.02
  - number: '12.03'
    text: |-
      1 Schepen met verblijven moeten ten minste over de volgende sanitaire voorzieningen beschikken:

      a. een toilet per wooneenheid of per zes bemanningsleden. Dit toilet moet van frisse lucht kunnen worden voorzien;

      b. een wasbak met afvoer en met drinkwateraansluiting voor koud en warm water per wooneenheid of per vier
      bemanningsleden;

      c. een douche of badkuip met drinkwateraansluiting voor koud en warm water per wooneenheid of per zes
      bemanningsleden.

      2 Sanitaire voorzieningen moeten zich in de directe nabijheid van de woonruimten bevinden. Toiletten mogen geen
      rechtstreekse verbinding hebben met de keukens, eetruimten of woonkeukens.

      3 Toiletruimten moeten een grondoppervlak van ten minste 1,00 m² hebben. Daarbij moet de breedte ten minste 0,75
      m en de lengte ten minste 1,10 m bedragen. Toiletruimten in hutten voor maximaal twee personen mogen kleiner zijn.
      Indien zich een wasgelegenheid en/of douche in de toiletruimte bevindt, moet het grondoppervlak met ten minste het
      oppervlak van de wasbak en/of de douchebak (of eventueel van de badkuip) zijn vergroot.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel12.03
  - number: '12.04'
    text: |-
      1 Keukens mogen gecombineerd zijn met woonruimten.

      2 Keukens moeten uitgerust zijn met:

      a. kookgerei;

      b. spoelbak met afvoer;

      c. installatie voor de drinkwatervoorziening;

      d. koelkast;

      e. voldoende berg-, werk- en voorraadruimte.

      3 Eetruimten in woonkeukens moeten voldoende zijn voor het aantal bemanningsleden dat deze ruimten gewoonlijk
      gelijktijdig gebruikt. De breedte van de zitplaatsen mag niet minder dan 0,60 m bedragen.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel12.04
  - number: '12.05'
    text: |-
      1 Schepen waarop zich verblijven bevinden moeten van een drinkwaterinstallatie zijn voorzien. Op de vulopeningen
      van de drinkwatertanks en de drinkwaterslangen dient te zijn vermeld dat zij uitsluitend voor drinkwater zijn
      bestemd. Vulaansluitingen voor drinkwater moeten boven het dek zijn aangebracht.

      2 Drinkwaterinstallaties moeten:

      a. van binnen uit corrosiebestendig en fysiologisch ongevaarlijk materiaal bestaan;

      b. zijn samengesteld zonder leidinggedeelten waarin een regelmatige doorstroming niet is gegarandeerd, en

      c. tegen overmatige verhitting zijn beschermd.

      3 Drinkwatertanks moeten bovendien:

      a. een capaciteit hebben van ten minste 150 l per gewoonlijk aan boord verblijvende persoon, maar ten minste per
      bemanningslid;

      b. een adequaat afsluitbare opening hebben voor het schoonmaken van de binnenkant;

      c. een inrichting voor het aanwijzen van de inhoud hebben; en

      d. aansluitingen hebben voor beluchten en ontluchten, die afvoeren in de open lucht of die van adequate filters
      zijn voorzien.

      4 Drinkwatertanks mogen geen wanden gemeen hebben met andere tanks. Drinkwaterleidingen mogen niet door tanks
      lopen die andere vloeistoffen bevatten. Verbindingen tussen het drinkwatersysteem en andere pijpleidingen zijn niet
      toegestaan. Pijpleidingen voor gas of andere vloeistoffen dan drinkwater mogen niet door drinkwatertanks lopen.

      5 Drukvaten voor drinkwater mogen slechts met niet verontreinigde perslucht worden bediend. Indien de perslucht
      afkomstig is van compressoren, moeten vlak vóór de drukvaten voor drinkwater geschikte luchtfilters en
      olieafscheiders zijn aangebracht, tenzij het drinkwater door een membraan van de perslucht is gescheiden.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel12.05
  - number: '12.06'
    text: |-
      1 Verblijven moeten overeenkomstig hun doel kunnen worden verwarmd. De verwarmingen moeten berekend zijn op de
      heersende weersomstandigheden.

      2 Woon- en slaapruimten moeten - ook bij gesloten deuren - voldoende kunnen worden geventileerd. De toevoer en
      afvoer van lucht moeten onder alle klimatologische omstandigheden voldoende luchtcirculatie mogelijk maken.

      3 Verblijven moeten zodanig zijn ingericht en uitgevoerd dat voor zover mogelijk wordt voorkomen dat verontreinigde
      lucht uit andere afdelingen van het schip, zoals machinekamers of laadruimen, binnendringt; bij geforceerde
      ventilatie dienen de inlaatopeningen zodanig te worden aangebracht dat ze aan bovengenoemde eisen voldoen.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel12.06
  - number: '12.07'
    text: |-
      1 Ieder aan boord verblijvend bemanningslid moet over een eigen bed en een eigen afsluitbare klerenkast beschikken.
      Het bed moet ten minste een binnenmaat van 2,00 bij 0,90 m hebben.

      2 Buiten de slaapruimten dient te zijn voorzien in adequate gelegenheden voor het bewaren en drogen van
      werkkleding.

      3 Alle ruimten moeten elektrisch kunnen worden verlicht. Extra lampen voor gasvormige of vloeibare brandstoffen
      zijn slechts in woonruimten toegestaan. Verlichtingsvoorzieningen met vloeibare brandstof moeten van metaal zijn
      vervaardigd en mogen slechts op brandstoffen werken waarvan het vlampunt boven 55° C ligt of op handelspetroleum.
      Ze moeten zodanig zijn opgesteld of aangebracht dat er geen brandgevaar bestaat.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel12.07
  - number: '13.01'
    text: |-
      1 Op verwarmings-, kook- en koelinstallaties die werken op vloeibaar gas zijn de voorschriften van
      [hoofdstuk 14][ref1] van toepassing.

      2 Verwarmings-, kook- en koelinstallaties met toebehoren moeten zo zijn uitgevoerd en opgesteld dat zij ook bij
      oververhitting geen gevaar opleveren; ze moeten zijn beveiligd tegen onopzettelijk kantelen of verschuiven.

      3 De in het tweede lid genoemde installaties mogen niet worden opgesteld in ruimten waar stoffen met een vlampunt
      onder 55° C worden opgeslagen of gebruikt. Afvoerleidingen van de installaties mogen niet door deze ruimten lopen.

      4 De voor de verbranding noodzakelijke luchttoevoer moet zijn zekergesteld.

      5 Verwarmingsapparaten moeten vast verbonden zijn met schoorstenen. Deze schoorstenen moeten in goede staat zijn
      en zijn voorzien van geschikte kappen of tegen wind beschermd zijn. Zij moeten zodanig zijn aangelegd dat zij
      gereinigd kunnen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Hoofdstuk14
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel13.01
    references:
      - id: ref1
        bwb_id: BWBR0007858
        hoofdstuk: '14'
  - number: '13.02'
    text: |-
      1 Wanneer verwarmings-, kook- en koelinstallaties op vloeibare brandstoffen werken, mogen alleen brandstoffen met
      een vlampunt boven 55° C worden gebruikt.

      2 In afwijking van het eerste lid kunnen kooktoestellen en van pitbranders voorziene verwarmings- en koeltoestellen
      die op handelspetroleum werken worden toegestaan in verblijven en stuurhuizen, mits de inhoud van hun reservoir
      niet meer bedraagt dan 12 liter.

      3 Met pitbranders uitgeruste installaties moeten:

      a. een metalen brandstoftank met een afsluitbare vulopening hebben, die geen zacht gesoldeerde naden heeft onder de
      hoogste vulstand en die zo is gebouwd en aangebracht dat hij niet onopzettelijk kan opengaan of leeglopen;

      b. zonder behulp van een andere brandbare vloeistof kunnen worden ontstoken, en

      c. zo zijn opgesteld dat de verbrandingsgassen veilig worden afgevoerd.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel13.02
  - number: '13.03'
    text: |-
      1 Oliekachels met verdampingsbranders en oliestookinstallaties met verstuivingsbranders moeten volgens de algemeen
      erkende regels van de techniek zijn gebouwd.

      2 Indien een oliekachel met een verdampingsbrander of een oliestookinstallatie met een verstuivingsbrander in een
      machinekamer is opgesteld, moet de luchttoevoer voor het verwarmingsapparaat en de motoren zodanig zijn dat het
      verwarmingsapparaat en de motoren onafhankelijk van elkaar, probleemloos en veilig kunnen functioneren. Indien
      nodig moeten afzonderlijke luchttoevoerkokers aanwezig zijn. De opstelling van het apparaat moet zodanig zijn dat
      een eventueel uit de verbrandingsruimte terugslaande vlam niet met andere delen van de machinekamerinstallatie in
      aanraking kan komen.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel13.03
  - number: '13.04'
    text: |-
      1 Oliekachels met verdampingsbranders moeten zonder behulp van andere brandbare vloeistoffen kunnen worden
      aangestoken. Zij moeten zijn aangebracht boven een metalen lekbak van zodanige omvang dat alle kachelonderdelen
      waarin olie aanwezig kan zijn zich boven deze bak bevinden. De inhoud van de lekbak mag niet minder dan 2 liter en
      de randhoogte niet minder dan 20 mm bedragen.

      2 Voor oliekachels met verdampingsbranders die in de machinekamer zijn opgesteld moet de randhoogte van de in het
      eerste lid bedoelde lekbak ten minste 200 mm bedragen. De onderkant van de brander moet boven de bovenrand van de
      lekbak liggen. Bovendien moet de bovenrand van de lekbak ten minste 100 mm boven de vloerplaat uitsteken.

      3 Oliekachels met verdampingsbranders moeten van een geschikte brandstofregelaar zijn voorzien, die bij elke
      ingestelde stand een praktisch gelijkblijvende olietoevoer naar de brander waarborgt en bij eventueel uitdoven van
      de vlam de brandstoftoevoer afsluit. De brandstofregelaar is als geschikt te beschouwen als deze ook bij trillingen
      en bij slagzij tot 12° probleemloos functioneert en, behalve van een vlotter voor de regulering van het niveau, is
      voorzien van:

      a. een tweede vlotter, die bij het overschrijden van het toelaatbare olieniveau de toevoer van brandstof veilig en
      betrouwbaar afsluit, of

      b. een overloopleiding, mits de olie-opvangbak ten minste de inhoud van de verbruikstank kan bevatten.

      4 Indien de brandstoftank gescheiden is van de oliekachel met verdampingsbrander:

      a. mag deze tank niet hoger zijn geplaatst dan volgens de gebruiksaanwijzing van de fabrikant is toegestaan;

      b. moet de tank zodanig zijn geplaatst dat deze tegen ontoelaatbare verwarming is beschermd;

      c. moet de brandstoftoevoer vanaf het dek kunnen worden onderbroken.

      5 De schoorstenen van oliekachels met natuurlijke trek moeten zijn voorzien van een inrichting die terugslag van de
      trek verhindert.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel13.04
  - number: '13.05'
    text: |-
      Oliestookinstallaties met verstuivingsbranders moeten met name aan de volgende eisen voldoen:

      a. Vóór het begin van de olietoevoer moet voldoende ventilatie van de verbrandingsruimte zijn gewaarborgd;

      b. De brandstoftoevoer moet door een thermostatische regelaar worden geregeld;

      c. De ontsteking moet elektrisch of met een waakvlam geschieden;

      d. Er moet een inrichting aanwezig zijn die bij het uitdoven van de vlam de brandstoftoevoer automatisch afsluit;

      e. De hoofdschakelaar moet zijn aangebracht op een gemakkelijk toegankelijke plaats buiten de ruimte waar de
      installatie staat opgesteld.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel13.05
  - number: '13.06'
    text: |-
      Luchtverhitters waarbij de verwarmingslucht onder druk rondom een verbrandingskamer naar een verdeelsysteem of een
      ruimte wordt geleid moeten aan de volgende eisen voldoen:

      a. Indien de brandstof onder druk wordt verstoven, moet de toevoer van de verbrandingslucht door middel van een
      ventilator geschieden;

      b. Voordat de brander kan worden ontstoken, moet de verbrandingskamer goed geventileerd zijn. Dit kan ook gebeuren
      door het nalopen van de verbrandingsluchtventilator;

      c. De brandstoftoevoer moet automatisch worden gesloten, wanneer

        - het vuur uitdooft;
        - geen voldoende toevoer van verbrandingslucht aanwezig is;
        - de verhitte lucht een eerder ingestelde temperatuur overschrijdt, of
        - de stroomvoorziening van de veiligheidsinrichtingen uitvalt.

      In deze gevallen mag de brandstoftoevoer na te zijn gesloten niet weer automatisch starten;

      d. De ventilatoren voor verbrandingslucht en verwarmingslucht moeten kunnen worden uitgeschakeld buiten de ruimte
      waarin het verwarmingsapparaat is opgesteld;

      e. Indien de verwarmingslucht van buitenaf wordt aangezogen, moeten de aanzuigopeningen zo hoog mogelijk boven het
      dek liggen. De uitvoering daarvan moet spatwater- en regendicht zijn;

      f. De leidingen voor de verwarmingslucht moeten van metaal zijn vervaardigd;

      g. De uitgangsopeningen voor de verwarmingslucht mogen niet volledig gesloten kunnen worden;

      h. De bij lekkage vrijkomende brandstof mag zich niet tot in de leidingen voor de verwarmingslucht kunnen
      verspreiden;

      i. Luchtverhitters mogen hun verwarmingslucht niet uit een machinekamer kunnen aanzuigen.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel13.06
  - number: '13.07'
    text: |-
      1 Verwarmingsapparaten die op vaste brandstoffen werken moeten zodanig op een metalen plaat met een opstaande rand
      staan dat gloeiende brandstoffen of hete as niet buiten deze plaat kunnen geraken.

      Dit is niet vereist in ruimten die zijn gebouwd van onbrandbaar materiaal en die uitsluitend zijn bestemd voor het
      onderbrengen van een verwarmingsketel.

      2 De met vaste brandstoffen verwarmde ketels moeten zijn voorzien van thermostatische regelaars, die de voor de
      verbranding noodzakelijke luchttoevoer regelen.

      3 In de nabijheid van ieder verwarmingsapparaat moeten middelen aanwezig zijn waarmee de as gemakkelijk kan worden
      afgekoeld.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel13.07
  - number: '14.01'
    text: |-
      1 Vloeibaargasinstallaties bestaan in hoofdzaak uit een flessenkast met één of meer gasflessen, één of meer
      drukregelaars, een distributienet en gebruiksapparaten.

      Reserveflessen en lege flessen die zich niet in de flessenkast bevinden zijn geen delen van een
      vloeibaargasinstallatie. [Artikel 14.05][ref1] is hierop van toepassing.

      2 De installaties mogen slechts op handelspropaan werken.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel14.05
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel14.01
    references:
      - id: ref1
        bwb_id: BWBR0007858
        artikel: '14.05'
        hoofdstuk: '14'
  - number: '14.02'
    text: |-
      1 Vloeibaargasinstallaties moeten in al hun onderdelen geschikt zijn voor het gebruik van propaan en deugdelijk
      zijn uitgevoerd en opgesteld.

      2 Vloeibaargasinstallaties mogen slechts worden gebruikt voor huishoudelijke doeleinden in de verblijven en in het
      stuurhuis, alsmede voor overeenkomstige doeleinden op passagiersschepen.

      3 Er kunnen zich aan boord verschillende afzonderlijke vloeibaargasinstallaties bevinden. Een en dezelfde
      installatie mag niet worden gebruikt voor verblijven die door een ruim of een vaste tank zijn gescheiden.

      4 In de machinekamer mag zich geen onderdeel van de vloeibaargasinstallatie bevinden.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel14.02
  - number: '14.03'
    text: |-
      1 Toegestaan zijn uitsluitend flessen waarvan de toegelaten vulmassa ligt tussen 5 en 35 kg. Voor passagiersschepen
      kan de Commissie van Deskundigen flessen met een hoger vulgewicht toestaan.

      2 De flessen moeten voldoen aan de voorschriften die in één der Oeverstaten of België van kracht zijn.

      Zij moeten zijn voorzien van het officiële stempel ten bewijze van de keuring op basis van de voorgeschreven
      beproevingen.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel14.03
  - number: '14.04'
    text: |-
      1 Aangesloten flessen moeten aan dek zijn opgesteld in een al dan niet ingebouwde flessenkast buiten de verblijven
      en wel zodanig dat het zich verplaatsen aan boord niet wordt gehinderd. De flessenkast mag echter niet op het voor-
      of achterschip tegen de verschansing zijn opgesteld. De flessenkast mag alleen dan in de bovenbouw zijn ingebouwd,
      wanneer zij gasdicht is ten opzichte daarvan en wanneer zij slechts naar de buitenzijde kan worden geopend. Zij
      moet zo zijn ingericht dat de distributieleidingen naar de plaatsen van verbruik zo kort mogelijk zijn.

      Er mogen slechts zo veel flessen voor gelijktijdige afname zijn aangesloten als de verbruiksinstallatie vereist. In
      geval van meer dan één fles moet in elk geval gebruik worden gemaakt van een omschakel- of afsluitinrichting. Per
      flessenkast mogen ten hoogste vier flessen worden aangesloten. Met inbegrip van de reserveflessen mogen zich per
      flessenkast niet meer dan zes flessen aan boord bevinden.

      Op passagiersschepen met keukens of kantines voor de passagiers mogen ten hoogste zes flessen worden aangesloten.
      Met inbegrip van de reserveflessen mogen zich per flessenkast niet meer dan negen flessen aan boord bevinden.

      De drukregelaar, of in geval van een drukregeling in twee trappen, de eerste drukregelaar, moet zich in dezelfde
      kast bevinden als de flessen en vast zijn ingebouwd.

      2 Aangesloten flessen moeten zodanig zijn geplaatst dat in geval van lekkage ontsnappend gas uit de flessenkast
      in de open lucht kan afvloeien, zonder dat daarbij enig gevaar bestaat dat gas doordringt in het inwendige van het
      schip of in aanraking kan komen met een ontstekingsbron.

      3 Flessenkasten moeten zijn vervaardigd van moeilijk ontvlambaar materiaal en door aan de beneden- en bovenzijde
      aangebrachte openingen voldoende worden geventileerd. De flessen moeten staande zijn opgesteld en niet kunnen
      omvallen.

      4 De flessenkast moet zodanig zijn ingericht en opgesteld dat de temperatuur van de flessen niet boven 50° C kan
      stijgen.

      5 Aan de buitenzijde van de flessenkast moet het opschrift «vloeibaar gas» en een teken «vuur, open licht en roken
      verboden» met een diameter van ten minste 10 cm, overeenkomstig [schets 2 van bijlage I][ref1], zijn aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007858
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel14.04
    references:
      - id: ref1
        bwb_id: BWBR0007858
  - number: '14.05'
    text: |-
      Reserveflessen en lege flessen die zich niet in de flessenkast bevinden moeten buiten de verblijven en het
      stuurhuis in een overeenkomstig [artikel 14.04][ref1] uitgevoerde kast zijn opgeslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel14.04
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel14.05
    references:
      - id: ref1
        bwb_id: BWBR0007858
        artikel: '14.04'
        hoofdstuk: '14'
  - number: '14.06'
    text: |-
      1 De gebruiksapparaten mogen slechts op de flessen worden aangesloten door middel van een distributienet dat
      is voorzien van één of meer drukregelaars, die de gasdruk verlagen tot de gebruiksdruk. Deze drukvermindering
      kan in één of twee trappen worden bewerkstelligd. Alle drukregelaars moeten op een bepaalde druk overeenkomstig
      [artikel 14.07][ref1] zijn afgesteld.

      2 De laatste drukregelaar moet zijn voorzien van, dan wel worden gevolgd door een inrichting waardoor het
      distributienet automatisch is beveiligd tegen overdruk, wanneer de drukregelaar onvoldoende zou functioneren.
      Gewaarborgd moet zijn dat in geval van een lek uit deze veiligheidsvoorziening ontsnappend gas in de open
      lucht wordt afgevoerd en niet in het inwendige van het schip kan doordringen of in aanraking kan komen met een
      ontstekingsbron; zo nodig moet daartoe een afzonderlijke leiding worden aangelegd.

      3 Veiligheidsventielen en afblaasleidingen moeten tegen het binnendringen van water zijn beschermd.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel14.07
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel14.06
    references:
      - id: ref1
        bwb_id: BWBR0007858
        artikel: '14.07'
        hoofdstuk: '14'
  - number: '14.07'
    text: |-
      1 Bij een drukregeling in twee trappen mag de waarde van de middeldruk niet meer bedragen dan 2,5 bar boven de
      heersende atmosferische druk.

      2 De einddruk van het gas bij het verlaten van de laatste drukregelaar mag niet meer bedragen dan 0,05 bar boven de
      heersende atmosferische druk, waarbij een speling van 10% is toegestaan.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel14.07
  - number: '14.08'
    text: |-
      1 Leidingen moeten uit vast aangelegde stalen of koperen pijpen bestaan.

      Aansluitleidingen aan de flessen moeten evenwel bestaan uit voor propaan geschikte hoge-drukslangen of
      spiraalvormige pijpen. Gebruiksapparaten die niet vast zijn ingebouwd mogen echter zijn aangesloten door middel van
      geschikte slangen met een lengte van ten hoogste 1 m.

      2 Leidingen moeten bestand zijn tegen alle aan boord bij normale bedrijfsomstandigheden optredende invloeden,
      met name wat corrosie en sterkte betreft, en door hun eigenschappen en opstelling voldoende gastoevoer naar de
      gebruiksapparaten met betrekking tot hoeveelheid en druk verzekeren.

      3 Pijpleidingen moeten zo weinig mogelijk koppelingen bevatten. De pijpen en koppelingen moeten gasdicht zijn en
      bij alle trillingen en uitzettingen waaraan zij kunnen worden blootgesteld gasdicht blijven.

      4 Pijpleidingen moet goed toegankelijk, behoorlijk bevestigd en overal op die plaatsen beschermd zijn, waar gevaar
      van stoten of wrijvingen bestaat, vooral bij de doorvoeringen door stalen schotten of metalen wanden. Stalen pijpen
      moeten over hun gehele uitwendige oppervlakte corrosiebestendig zijn gemaakt.

      5 Flexibele leidingen en de koppelingen daarvan moeten bestand zijn tegen alle aan boord bij normale
      bedrijfsomstandigheden optredende invloeden. Zij moeten bovendien zo zijn aangelegd dat zij niet onder spanning
      staan, niet ontoelaatbaar worden verwarmd en over hun gehele lengte kunnen worden gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel14.08
  - number: '14.09'
    text: |-
      1 Het gehele distributienet moet door een steeds gemakkelijk en snel te bereiken hoofdkraan kunnen worden
      afgesloten.

      2 Ieder gebruiksappparaat moet aan een aftakking zijn geplaatst die door middel van een afzonderlijke kraan kan
      worden afgesloten.

      3 Kranen moeten beschermd tegen weersinvloeden en stoten zijn aangebracht.

      4 Achter elke drukregelaar moet een testaansluiting zijn aangebracht. Door middel van een kraan moet zijn
      gewaarborgd dat de drukregelaar bij een test niet aan de testdruk wordt blootgesteld.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel14.09
  - number: '14.10'
    text: |-
      1 Er mogen slechts gebruiksapparaten worden geïnstalleerd die in één van de Oeverstaten of België voor propaan zijn
      toegelaten. Zij moeten van inrichtingen zijn voorzien waardoor het uitstromen van gas bij het uitgaan van zowel de
      branders als de waakvlam geheel wordt verhinderd.

      2 Elk gebruiksapparaat moet zodanig zijn opgesteld en aangesloten dat het niet kan omvallen of onopzettelijk
      verschuiven en dat onopzettelijk losraken van de aansluitleidingen niet mogelijk is.

      3 Verwarmingstoestellen, geisers en koelkasten moeten zijn voorzien van een leiding waardoor verbrandingsgassen in
      de open lucht worden afgevoerd.

      4 Gebruiksapparaten mogen slechts in het stuurhuis zijn opgesteld, wanneer deze zo is gebouwd dat eventueel
      ontsnappend gas niet vanuit het stuurhuis in de lager gelegen gedeelten van het schip, met name via doorvoeringen
      van de afstandbedieningen in de machinekamer, kan doordringen.

      5 Gebruiksapparaten mogen in slaapruimten slechts worden opgesteld, wanneer de verbranding onafhankelijk van de in
      deze ruimte aanwezige lucht plaatsvindt.

      6 Gebruiksapparaten waarvan de verbranding afhankelijk van de in de ruimte aanwezige lucht plaatsvindt moeten in
      een ruimte van voldoende afmeting zijn opgesteld.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel14.10
  - number: '14.11'
    text: |-
      1 De ventilatie in de ruimten, waarin gebruiksapparaten zijn opgesteld waarvan de verbranding afhankelijk van de in
      de ruimte aanwezige lucht plaatsvindt, moet zijn verzekerd door ventilatie-openingen van voldoende afmetingen, elk
      echter met een vrije doorsnede van ten minste 150 cm².

      2 Ventilatie-openingen mogen geen afsluitinrichtingen hebben en niet in verbinding staan met nachtverblijven.

      3 Afvoerkanalen moeten zo zijn uitgevoerd dat de verbrandingsgassen afdoende worden afgevoerd. Zij moeten
      bedrijfszeker en onbrandbaar zijn. Ventilatoren voor de luchtverversing van verblijven mogen de afvoer niet nadelig
      beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel14.11
  - number: '14.12'
    text: |-
      Op een geschikte plaats aan boord moet een gebruiksaanwijzing zijn aangebracht; hierop moeten ten minste de
      volgende opschriften voorkomen:

        - "De afsluitkranen van de flessen, die niet op het distributienet zijn aangesloten, moeten zijn gesloten, zelfs
      wanneer de flessen geacht worden leeg te zijn."
        - "De slangen moeten worden vervangen, zodra hun toestand dit noodzakelijk maakt."
        - "Alle gebruiksapparaten moeten zijn aangesloten, tenzij de bijbehorende toevoerleidingen zijn gesloten."
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel14.12
  - number: '14.13'
    text: |-
      Vóór de ingebruikneming van een vloeibaargasinstallatie, na iedere verandering of reparatie en bij iedere
      vernieuwing van de in [artikel 14.15][ref1] bedoelde aantekening moet de gehele installatie worden gekeurd door een
      deskundige die als zodanig door de Commissie van Deskundigen is erkend. Deze deskundige moet bij de keuring nagaan
      of de installatie in overeenstemming is met dit hoofdstuk. Hij moet aan de Commissie van Deskundigen een verslag
      van de keuring uitbrengen.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel14.15
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel14.13
    references:
      - id: ref1
        bwb_id: BWBR0007858
        artikel: '14.15'
        hoofdstuk: '14'
  - number: '14.14'
    text: |-
      1 Het beproeven van de installatie moet onder de volgende voorwaarden geschieden:

      1. Pijpleidingen voor de middeldruk tussen de in [artikel 14.09, vierde lid][ref1], bedoelde kraan van de eerste
      drukregelaar en de kranen voor de laatste drukregelaars:

      a. een sterktebeproeving uitgevoerd met lucht, met een inert gas of met een vloeistof, onder een druk van 20 bar
      boven de heersende atmosferische druk;

      b. een beproeving van de luchtdichtheid, uitgevoerd met lucht of met een inert gas, onder een druk van 3,5 bar
      boven de heersende atmosferische druk.

      2 2. Pijpleidingen onder de bedrijfsdruk tussen de in [artikel 14.09, vierde lid][ref2], bedoelde kraan van de
      enige drukregelaar of de drukregelaar van de laatste trap en de kranen voor de gebruiksapparaten:

      Beproeving van de luchtdichtheid, uitgevoerd met lucht of met een inert gas, onder een druk van 1 bar boven de
      heersende atmosferische druk.

      3 Leidingen tussen de in [artikel 14.09, vierde lid][ref3], bedoelde kraan van de enige drukregelaar of van de
      drukregelaar van de laatste trap en de bedieningsarmaturen van de gebruiksapparaten:

      Beproeving van de luchtdichtheid onder een druk van 0,15 bar boven de heersende atmosferische druk.

      4 Bij de beproevingen, bedoeld in het eerste lid, onder *b*, het tweede en het derde lid, worden de leidingen
      als dicht beschouwd, wanneer de testdruk na een voor aanpassing aan de temperatuur voldoende wachttijd en een
      aansluitende beproevingsduur van 10 minuten niet daalt.

      5 De aansluitingen aan de flessen, de verbindingsstukken en de armaturen die onder flessendruk staan, alsmede de
      aansluiting van de regelaar aan de gebruiksleiding:

      Beproeving onder bedrijfsdruk van de luchtdichtheid met een schuimvormend middel.

      6 Gebruiksapparaten moeten bij de nominale belasting in gebruik worden genomen en worden gecontroleerd op goed
      branden bij verschillende instellingen van de regelknop.

      De ontstekingsbeveiligingen moeten op hun goede werking worden gecontroleerd.

      7 Na de in het zesde lid bedoelde controle moet voor ieder gebruiksapparaat dat aan een afvoergassenleiding is
      aangesloten, na vijf minuten functioneren bij nominale belasting met gesloten ramen en deuren en in werking zijnde
      ventilatieinrichtingen, worden gecontroleerd of verbrandingsgassen naar buiten uittreden.

      Wanneer het ontsnappen van verbrandingsgassen niet van voorbijgaande aard is, moet onmiddellijk de oorzaak worden
      opgespoord. Het apparaat mag niet voor gebruik worden vrijgegeven, voordat alle gebreken zijn hersteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel14.09
      [ref2]: https://wetten.overheid.nl/BWBR0007858#Artikel14.09
      [ref3]: https://wetten.overheid.nl/BWBR0007858#Artikel14.09
