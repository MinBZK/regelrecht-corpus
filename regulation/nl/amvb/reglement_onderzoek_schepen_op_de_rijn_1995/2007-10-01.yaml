  - number: '3.01'
    text: Schepen moeten volgens goed scheepsbouwgebruik zijn gebouwd.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel3.01
  - number: '3.02'
    text: |-
      1 De sterkte van de scheepsromp moet zodanig zijn dat zij in overeenstemming is met de belasting waaraan de romp
      onder normale omstandigheden is blootgesteld.

      a. Bij nieuwbouw van een schip en bij verbouwingen waardoor de sterkte van het schip kan worden beïnvloed,
      dient door berekeningen te worden aangetoond dat de scheepsromp sterk genoeg is. Dit is niet nodig, indien een
      klassecertificaat of een verklaring van een erkend classificatiebureau wordt overgelegd.

      b. Bij onderzoeken als bedoeld in [artikel 2.09][ref1] moeten de minimale diktes van de bodem-, kim- en
      zijbeplating van de scheepshuid overeenkomstig de volgende methode worden gecontroleerd:

      Bij schepen die van staal zijn gebouwd moet als minimale dikte t de grootste van de aan de hand van de volgende
      formules vastgestelde waarden worden genomen:

      1. Voor schepen met een lengte van meer dan 40 m: t = f· b· c (2,3 + 0,04 L) [mm]

      voor schepen met een lengte van 40 m of minder: t = f· b· c (1,5 + 0,06 L) [mm], echter ten minste 3,0 mm.

      2. Voor schepen ongeacht de lengte: t = 0,005· a √ T [mm]

      In deze formules betekent:








                        a =


                        spantafstand in [mm];










                        f =


                        factor voor spantafstand:





                        f = 1 voor a ≤ 500 mm





                        f = 1 + 0,0013 (a – 500) voor a > 500 mm;








                        b =


                        factor voor bodem- en zijbeplating of kimbeplating:





                        b = 1,0 voor bodem- en zijbeplating





                        b = 1,25 voor kimbeplating.






      Bij de berekening van de minimumdikte van de kimbeplating kan voor de factor voor de spantafstand worden uitgegaan
      van f = 1. De minimumdikte van de kimbeplating mag echter in geen geval minder zijn dan die van de bodem- en
      zijbeplating.








                        c =


                        factor voor bouwwijze:





                        c = 0,95 voor schepen met een dubbele bodem en zijtanks, waarvan het laadruimlangsschot in de
      zijde verticaal onder de denneboom is geplaatst





                        c = 1,0 voor schepen met een andere bouwwijze.






      c. De minimale plaatdikte die met de in onderdeel b vermelde formules is berekend mag bij schepen die in
      langsrichting zijn gebouwd en die van een dubbele bodem en zijtanks zijn voorzien zoveel minder zijn als door
      een erkend classificatiebureau is vastgesteld en gedocumenteerd nadat de voldoende sterkte van de scheepsromp
      rekenkundig is aangetoond.

      Vernieuwing van de beplating is noodzakelijk wanneer de dikte van bodem- of zijbeplating minder is dan de aldus
      vastgestelde waarde.

      De volgens bovenstaande methode vastgestelde waarden voor de minimumdikten van de beplating van de scheepshuid zijn
      grenswaarden bij een normale en gelijkmatige slijtage onder de voorwaarde dat scheepsbouwstaal is gebruikt en dat
      de inwendige constructiedelen, zoals spanten, bodemvrangen en hoofd-, langs- en dwarsverbanddelen zich in goede
      staat bevinden en dat het casco geen schade heeft opgelopen die wijst op overbelasting van de romp in langsscheepse
      richting.

      Indien de werkelijke waarden lager zijn dan de berekende waarden, moeten de desbetreffende platen worden vervangen
      of gerepareerd. Plaatselijke kleine, dunnere plekken kunnen worden toegestaan tot een afwijking van ten hoogste 10%
      van de minimumdikte.

      2 Indien voor de scheepsromp een ander materiaal dan staal wordt gebruikt, moet met een berekening worden
      aangetoond dat de sterkte (sterkte in langs- en dwarsrichting alsmede plaatselijke sterkte) tenminste overeenkomt
      met die, welke bij het gebruik van staal met inachtneming van de minimale diktes als bedoeld in het eerste lid zou
      zijn geresulteerd. Indien een klassecertificaat dan wel een verklaring van een erkend classificatiebureau wordt
      overgelegd kan deze berekening achterwege blijven.

      3 De stabiliteit van de schepen moet in overeenstemming zijn met het doel waarvoor zij zijn bestemd.


