  - number: '15.10'
    text: |-
      1 Voor de verlichting zijn slechts elektrische installaties toegestaan.

      2 [Artikel 9.16, derde lid][ref1], geldt bovendien ook voor gangen en ruimten waar passagiers verblijven.

      3 Een voldoende verlichting alsmede een noodverlichting moet voor tenminste de volgende ruimten en plaatsen
      aanwezig zijn:

      a. plaatsen waar reddingsmiddelen worden bewaard en waar zij normaal voor het gebruik worden gereedgemaakt;

      b. vluchtwegen, instapplaatsen voor passagiers met inbegrip van loopplanken, toe- en uitgangen, verbindingsgangen,
      liften en trappen van verblijven, hutten en woonruimten;

      c. markeringen van de vluchtwegen en nooduitgangen;

      d. overige ruimten die zijn bestemd voor gebruik door personen met beperkte mobiliteit;

      e. bedrijfsruimten, machinekamers en roermachinekamers en de uitgangen daarvan;

      f. stuurhuis;

      g. ruimte voor de noodkrachtbron;

      h. plaatsen waar zich blustoestellen en de bediening van brandblusinstallaties bevinden;

      i. plaatsen waar de passagiers, het boordpersoneel en de bemanning zich in noodgevallen verzamelen.

      4 Er moet een noodstroominstallatie aanwezig zijn, die bestaat uit een noodstroombron en noodschakelbord en die
      bij uitval van de voeding de stroomvoorziening van de volgende elektrische inrichtingen kan overnemen; zij moet in
      staat zijn deze gelijktijdig te voeden, voor zover deze inrichtingen niet van een eigen stroombron zijn voorzien:

      a. navigatielantaarns;

      b. installaties voor geluidsseinen;

      c. noodverlichting als bedoeld in het derde lid;

      d. marifooninstallatie;

      e. alarm- en luidsprekerinstallaties en installaties voor de interne communicatie aan boord;

      f. schijnwerpers als bedoeld in [artikel 10.02, tweede lid, onder i][ref2];

      g. brandmeldinstallatie;

      h. overige veiligheidsinstallaties zoals automatische sprinklerinstallaties of brandbluspompen;

      i. liften en hefinrichtingen als bedoeld in [artikel 15.06, negende lid, tweede zin][ref3].

      5 De lichtbronnen voor de noodverlichting moeten als zodanig zijn gemarkeerd.

      6 De noodstroominstallatie moet zijn aangebracht buiten de hoofdmachinekamer, buiten de ruimte waarin de
      energiebronnen als bedoeld in [artikel 9.02, eerste lid][ref4], ondergebracht zijn en buiten de ruimte
      waarin het hoofdschakelbord staat opgesteld en van deze ruimten door scheidingsvlakkenals bedoeld in
      [artikel 15.11, tweede lid][ref5], zijn gescheiden.

      Kabels die elektrische installaties in noodgevallen voeden, moeten zodanig zijn ingebouwd en doorgeleid dat de
      continuïteit van de voeding van deze installaties in geval van brand en overstroming gehandhaafd blijft. In ieder
      geval mogen deze kabels niet door de hoofdmachinekamer, door keukens of door ruimten geleid worden waarin de
      elektrische hoofdenergiebron en de daarbij behorende uitrusting staan, behalve in zoverre als het nodig is om ook
      deze ruimte van een noodstroominstallatie te voorzien.

      De noodstroominstallatie moet zijn opgesteld boven de indompelingsgrenslijn.

      7 Als noodstroombron zijn toegelaten:

      a. aggregaten met een eigen onafhankelijke brandstofvoorziening en onafhankelijk koelsysteem, die bij het uitvallen
      van het hoofdnet automatisch moeten aanlopen en binnen 30 seconden de stroomvoorziening automatisch moeten kunnen
      overnemen, dan wel, indien zij zich bevinden in de onmiddellijke nabijheid van het stuurhuis of een andere plaats
      waar voortdurend leden van de bemanning aanwezig zijn, met de hand kunnen worden gestart;

      b. accumulatoren, die bij uitvallen van het hoofdnet automatisch de stroomvoorziening overnemen, dan wel,
      indien zij zich in de onmiddellijke nabijheid van het stuurhuis of een andere plaats waar voortdurend leden van
      de bemanning aanwezig zijn, met de hand kunnen worden ingeschakeld. Zij moeten in staat zijn om de aangegeven
      installaties gedurende de voorgeschreven tijd zonder oplading en zonder ontoelaatbaar spanningsverlies te voeden.

      8 De voor de noodstroomvoorziening benodigde bedrijfsduur wordt bepaald naar gelang het gebruiksdoel van het
      passagiersschip, maar mag niet minder dan 30 minuten bedragen.

      9 De isolatie weerstanden en de aarding van de elektrische systemen moeten worden getest tijdens de onderzoeken,
      bedoeld in [artikel 2.09][ref6].

      10 De energiebronnen, bedoeld in [artikel 9.02, eerste lid][ref7], moeten onafhankelijk van elkaar zijn uitgevoerd.

      11 Storingen in de hoofd- of noodstroominstallatie mogen geen aanleiding kunnen zijn tot onderlinge beïnvloeding
      van de bedrijfszekerheid van de inrichtingen.


