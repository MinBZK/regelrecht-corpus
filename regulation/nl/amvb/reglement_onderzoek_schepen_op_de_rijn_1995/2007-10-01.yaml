  - number: 22b.04
    text: |-
      Voor het ten hoogste aan boord toegelaten aantal passagiers moeten zitplaatsen beschikbaar zijn. Zitplaatsen moeten
      van veiligheidsgordels voorzien zijn.

      Veiligheidsgordels kunnen achterwege blijven indien een geschikte bescherming tegen stoten aanwezig is, dan wel
      wanneer zij volgens de HSC Code 2000, hoofdstuk 4, onderdeel 6, niet vereist zijn.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel22b.04
  - number: 22b.05
    text: |-
      In afwijking van de [artikelen 4.02][ref1] en [4.03][ref2] moet het vrijboord ten minste 500 mm bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel4.02
      [ref2]: https://wetten.overheid.nl/BWBR0007858#Artikel4.03
