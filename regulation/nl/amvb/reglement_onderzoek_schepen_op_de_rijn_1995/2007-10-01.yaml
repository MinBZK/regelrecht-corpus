  - number: '17.05'
    text: |-
      1 Het resterende vrijboord is de kleinste verticale afstand tussen de gladde waterspiegel en de zijkant van het
      dek, waarbij rekening wordt gehouden met trim en slagzij, die optreden onder invloed van de momenten als bedoeld in
      [artikel 17.07, vierde lid][ref1].

      2 Het resterend vrijboord als bedoeld in [artikel 17.07, eerste lid][ref2], is voldoende indien het 300 mm
      bedraagt.

      3 Het resterend vrijboord mag worden verminderd wanneer wordt aangetoond dat [artikel 17.08][ref3] in acht is
      genomen.

      4 Indien de vorm van het drijvend voorwerp in belangrijke mate afwijkt van de vorm van een ponton, zoals bij
      cylindrische drijvende voorwerpen of bij een drijvend voorwerp waarvan de dwarsdoorsnede meer bedraagt dan vier
      zijden, kan de Commissie van Deskundigen een resterend vrijboord eisen of toelaten dat afwijkt van het tweede lid.
      Dit geldt ook voor een drijvend werktuig met verscheidene drijvende voorwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel17.07
      [ref2]: https://wetten.overheid.nl/BWBR0007858#Artikel17.07
      [ref3]: https://wetten.overheid.nl/BWBR0007858#Artikel17.08
