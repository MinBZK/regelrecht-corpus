  - number: 22b.08
    text: |-
      Snelle schepen moeten zijn uitgerust met:

      a. een radarinstallatie en een bochtaanwijzer, bedoeld in [artikel 7.06, eerste lid][ref1], en

      b. individuele reddingsmiddelen, die direct kunnen worden bereikt, overeenkomstig de Europese norm EN 395: 1998,
      voor het ten hoogste toegelaten aantal personen aan boord.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel7.06
