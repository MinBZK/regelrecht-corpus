  - number: '9.04'
    text: |-
      In ruimten waarin zich explosieve gassen of gasmengsels kunnen ophopen, zoals accumulatorenruimten en ruimten
      voor opslag van licht ontvlambare stoffen, zijn slechts erkend veilige elektrische inrichtingen (voldoende veilig
      voor gebruik in een gegeven explosiegevaarlijke omgeving) toegestaan. In deze ruimten mogen geen schakelaars voor
      verlichting en voor andere elektrische apparaten zijn geïnstalleerd. De beschermingsgraad tegen explosies moet zijn
      afgestemd op de eigenschappen met betrekking tot explosiegevaar van de voorkomende explosieve gassen en gasmengsels
      (explosiegroep, temperatuurklasse).
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel9.04
  - number: '9.05'
