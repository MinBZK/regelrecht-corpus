  - number: '23.02'
    text: |-
      1 De leden van de bemanning kunnen zijn: deksman, lichtmatroos (scheepsjongen), matroos, matroos-motordrijver,
      volmatroos, stuurman, schipper, machinist.

      2 De bekwaamheidseisen voor de leden van de bemanning zijn:

      2.1 voor de deksman ten minste 16 jaar zijn;

      2.2 voor de lichtmatroos (scheepsjongen) ten minste 15 jaar zijn en in het bezit zijn van een leerovereenkomst die
      voorziet in het bezoeken van een vakschool voor schippers of het volgen van een schriftelijke cursus die door de
      bevoegde autoriteit is erkend en opleidt voor een gelijkwaardig diploma;

      2.3 voor de matroos:

      a) ten minste 17 jaar zijn en

        - met goed gevolg de in lid 2.2 genoemde opleiding hebben afgesloten of
        - een met goed gevolg afgelegd eindexamen aan een vakschool voor schippers of
        - met goed gevolg een door een bevoegde autoriteit erkend examen matroos hebben afgelegd, of

      b) ten minste 19 jaar zijn en een vaartijd als lid van een dekbemanning van ten minste drie jaren hebben, waarvan
      ten minste één jaar in de binnenvaart en twee jaren in de binnenvaart, dan wel in de zee- of kustvaart dan wel de
      visserij vervuld zijn;

      2.4 voor de matroos-motordrijver:

      a) de bekwaamheid als matroos hebben en met goed gevolg een door de bevoegde autoriteit erkend examen matroos-
      motordrijver hebben afgelegd, of

      b) een vaartijd hebben van ten minste 1 jaar als matroos op een binnenschip met eigen mechanische middelen tot
      voortbeweging en elementaire kennis op het gebied van motoren bezitten;

      2.5 voor de volmatroos:

      a) een vaartijd van ten minste één jaar als matroos in de binnenvaart en

        - met goed gevolg de in onderdeel 2.2 genoemde opleiding hebben afgerond of
        - een met goed gevolg afgelegd eindexamen aan een vakschool voor schippers of
        - met goed gevolg een door een bevoegde autoriteit erkend examen matroos hebben afgelegd, of

      b) met goed gevolg een examen hebben afgelegd van een driejarige opleiding als bedoeld in onderdeel 2.2 of een
      met goed gevolg afgelegd eindexamen na een driejarige opleiding aan een vakschool voor schippers, indien in deze
      opleiding ten minste één jaar vaartijd in de binnenvaart is opgenomen, of

      c) een vaartijd in de binnenvaart van ten minste één jaar als matroos, bedoeld in
      onderdeel 2.3, onderdeel b, en een met goed gevolg afgelegd praktijkexamen als bedoeld in
      [bijlage C, lid 3.1, van het Reglement Rijnpatenten 1998][ref1] onder toepassing van de richtlijn, bedoeld in
      [artikel 1.05 van het Reglement Rijnpatenten 1998][ref2], ter uitvoering van het examen, of

      d) een vaartijd in de binnenvaart van ten minste twee jaar als matroos, bedoeld in onderdeel 2.3, onder b;

      2.6 voor de stuurman:

      a) een vaartijd in de binnenvaart hebben van ten minste één jaar als volmatroos of van ten minste drie jaar als
      matroos, bedoeld in onderdeel 2.3, onder b, of

      b) het bezit van een vaarbewijs, afgegeven op grond van [richtlijn nr. 96/50/EG](31996L0050) van de Raad van
      de Europese Unie van 23 juli 1996 betreffende de harmonisatie van de voorwaarden voor de afgifte van nationale
      vaarbewijzen voor binnenvaartuigen welke bij het goederen- en personenvervoer in de Gemeenschap gebruikt worden
      (PbEG L 235), of van een vaarbewijs als bedoeld in Bijlage I van [richtlijn nr. 91/672/EEG](31991L0672) van de Raad
      van de Europese Gemeenschappen van 16 december 1991 inzake de wederzijdse erkenning van de nationale vaarbewijzen
      voor het besturen van schepen in het goederen- en personenvervoer over de binnenwateren (PbEG L 373), of

      c) een vaartijd in de binnenvaart van ten minste vier jaar en het bezit van een aan het grote patent gelijkwaardig
      bevoegdheidsbewijs voor het voeren van een schip op binnenwateren van een lidstaat van de Centrale Commissie voor
      de Rijnvaart, of

      d) een vaartijd in de binnenvaart van ten minste 4 jaar en het bezit van een aan het grote patent gelijkwaardig
      bevoegdheidsbewijs voor het voeren van een schip op andere binnenwateren dat door de Centrale Commissie voor de
      Rijnvaart ingevolge [artikel 3.05, derde lid, van het Reglement Rijnpatenten 1998][ref3] is erkend;

      2.7 voor de schipper:

      houder zijn van het patent, afgegeven overeenkomstig het [Reglement Rijnpatenten 1998][ref4];

      2.8 voor de machinist:

      a) ten minste 18 jaar zijn en met goed gevolg een eindexamen hebben afgelegd voor een opleiding op het gebied van
      motoren en werktuigkunde, of

      b) ten minste 19 jaar zijn en een vaartijd hebben van ten minste 2 jaren als matroos-motordrijver op een
      binnenschip met eigen mechanische middelen tot voortbeweging.


      [ref1]: https://wetten.overheid.nl/BWBR0008934
      [ref2]: https://wetten.overheid.nl/BWBR0008934#Artikel1.05
      [ref3]: https://wetten.overheid.nl/BWBR0008934#Artikel3.05
      [ref4]: https://wetten.overheid.nl/BWBR0008934
