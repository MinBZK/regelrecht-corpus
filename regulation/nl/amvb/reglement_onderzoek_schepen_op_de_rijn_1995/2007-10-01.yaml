  - number: '20.02'
    text: |-
      1 Voor het vaststellen van de minimum bemanning van zeeschepen is [hoofdstuk 23][ref1] van toepassing.

      2 In afwijking van het eerste lid kan op zeeschepen de bemanningsregeling worden toegepast die overeenkomt met de
      bepalingen van IMO Resolutie A. 481 (XII) en van het Internationaal verdrag betreffende de normen voor zeevarenden
      inzake opleiding, diplomering en wachtdienst, 1978, onder de voorwaarde dat het aantal bemanningsleden ten minste
      overeenkomt met de minimum bemanning volgens exploitatiewijze B, waarbij met name rekening dient te worden gehouden
      met de [artikelen 23.09][ref2] en [23.13][ref3].

      In dit geval moeten de betreffende documenten, waaruit de bekwaamheid van de bemanningsleden en hun aantal blijken,
      aan boord aanwezig zijn. Bovendien moet zich een persoon aan boord bevinden die houder is van het grote patent
      bedoeld in het Reglement Rijnpatenten dat geldig is voor het te bevaren riviergedeelte. Na een vaartijd van ten
      hoogste 14 uren per tijdvak van 24 uren moet deze patenthouder vervangen worden door een andere houder van dat
      Rijnpatent.

      In het logboek moeten de volgende aantekeningen worden gemaakt:

      a. de namen van de houders van het grote patent die zich aan boord bevinden en het begin en einde van hun
      diensttijd;

      b. begin, onderbreking, voortzetting en einde van de vaart met telkens daarbij de vermelding van datum, tijdstip en
      plaats met aanduiding van de kilometerraai.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Hoofdstuk23
      [ref2]: https://wetten.overheid.nl/BWBR0007858#Artikel23.09
      [ref3]: https://wetten.overheid.nl/BWBR0007858#Artikel23.13
