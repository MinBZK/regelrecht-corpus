  - number: '17.06'
    text: |-
      1 Het bewijs van stabiliteit als bedoeld in de [artikelen 17.07][ref1] en [17.08][ref2] moet worden geleverd op
      basis van een volgens goed scheepsbouwgebruik uitgevoerde hellingproef.

      2 Indien bij de hellingproef geen voldoende hellingshoek kan worden bereikt, of indien de uitvoering van de
      hellingproef onoverkomelijke technische problemen met zich meebrengt, kan in plaats daarvan een berekening
      van het gewicht en het zwaartepunt worden gemaakt. Het resultaat van de berekening van het gewicht moet worden
      gecontroleerd met behulp van metingen van de diepgang, waarbij het verschil niet meer dan ± 5% mag bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel17.07
      [ref2]: https://wetten.overheid.nl/BWBR0007858#Artikel17.08
