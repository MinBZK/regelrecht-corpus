  - number: '21.03'
    text: |-
      [Hoofdstuk 23][ref1] is niet van toepassing. De bemanning moet ten minste bestaan uit:

      a. een schipper die houder is van het patent, vereist ingevolge het Reglement Rijnpatenten;

      b. een persoon die in staat is te helpen bij het manoeuvreren met het schip.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Hoofdstuk23
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel21.03
    references:
      - id: ref1
        bwb_id: BWBR0007858
        hoofdstuk: '23'
  - number: '22.01'
    text: |-
      1 Indien volgens het [Rijnvaartpolitiereglement][ref1] voor schepen die containers vervoeren stabiliteitsbescheiden
      zijn vereist, is dit hoofdstuk van toepassing.

      De stabiliteitsbescheiden moeten door een Commissie van Deskundigen worden geverifieerd en van haar waarmerk worden
      voorzien.

      2 De stabiliteitsbescheiden moeten de schipper begrijpelijke informatie bieden over de stabiliteit van het schip in
      elke voorkomende beladingstoestand.

      De stabiliteitsbescheiden moeten ten minste bevatten:

      a. gegevens betreffende de toelaatbare stabiliteitscoëfficiënten, de toegestane

      of de toegestane zwaartepuntshoogten van de lading;

      b. gegevens betreffende de ruimten die met ballastwater kunnen worden gevuld;

      c. formulieren voor de stabiliteitscontrole;

      d. een berekeningsvoorbeeld of handleiding voor de schipper.

      3 Indien containers op een schip naar keuze al dan niet vastgezet kunnen worden vervoerd, zijn voor het vervoer van
      niet-vastgezette en voor het vervoer van vastgezette containerladingen afzonderlijke berekeningsmethoden vereist
      voor het bewijs van stabiliteit.

      4 Een containerlading geldt alleen als vastgezet wanneer de afzonderlijke containers door middel van geleiders
      of spaninrichtingen hecht met de scheepsromp zijn verbonden en zij tijdens het varen niet van plaats kunnen
      veranderen.


      [ref1]: https://wetten.overheid.nl/BWBR0006923
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel22.01
    references:
