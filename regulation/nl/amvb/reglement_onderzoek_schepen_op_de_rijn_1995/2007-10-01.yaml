      1 De lichamelijke geschiktheid voor het beroep dient te blijken uit een medische verklaring als bedoeld in
      de [bijlage B1][ref1] en [B2 van het Reglement Rijnpatenten 1998][ref2], afgegeven door een door de bevoegde
      autoriteit aangewezen arts op het tijdstip waarop de betrokkene voor het eerst als bemanningslid in dienst treedt.
      De medische verklaring mag niet ouder zijn dan drie maanden.

      2 De eisen voor ogen en oren, bedoeld in bijlage [B1 van het Reglement Rijnpatenten 1998][ref3], zijn niet van
      toepassing voor de functie van machinist.

      3 Het bewijs van geschiktheid, bedoeld in het eerste en het tweede lid, dient binnen 3 maanden na het bereiken van
      de leeftijd van 65 jaar en daarna jaarlijks te worden vernieuwd.

      4 Indien een bevoegde autoriteit twijfels heeft omtrent de lichamelijke geschiktheid van een bemanningslid, kan
      zij om een medische keuring verzoeken. Het bemanningslid draagt slechts de daaruit voortvloeiende kosten wanneer de
      twijfels gegrond zijn gebleken.


      [ref1]: https://wetten.overheid.nl/BWBR0008934
