  - number: '15.08'
    text: |-
      1 Ieder passagiersschip moet beschikken over een interne spreekverbinding als bedoeld in [artikel 7.08][ref1]. Deze
      moet bovendien de bedrijfsruimten en – voor zover daar geen directe communicatiemogelijkheid vanuit het stuurhuis
      aanwezig is– de plaatsen voor het embarkeren van passagiers en de verzamelruimten voor passagiers als bedoeld in
      [artikel 15.06, achtste lid][ref2], omvatten.

      2 Alle passagiersverblijven moeten met een luidsprekerinstallatie bereikt kunnen worden. De installatie moet zo
      gedimensioneerd zijn dat de overgebrachte informatie duidelijk van achtergrondlawaai kan worden onderscheiden.
      Voorzover er een directe communicatiemogelijkheid vanuit het stuurhuis naar het passagiersgedeelte aanwezig is,
      behoeft er aldaar geen luidspreker beschikbaar te zijn.

      3 Er moet een alarmsysteem aanwezig zijn. Deze moet bestaan uit:

      a. een alarminstallatie waarmee passagiers, bemanningsleden en leden van het boordpersoneel de leiding van het
      schip en de bemanning kunnen alarmeren.

      Dit alarm mag slechts klinken in de ruimten bestemd voor de scheepsleiding en voor de bemanning en mag slechts door
      de scheepsleiding kunnen worden afgezet. Dit alarm moet tenminste op de volgende plaatsen kunnen worden aangezet:

      aa. in iedere hut;

      bb. in gangen, liften en trappenhuizen, zodanig dat de afstand naar de dichtstbijzijnde schakelaar ten hoogste 10 m
      bedraagt, terwijl er tenminste één schakelaar per waterdichte afdeling moet zijn;

      cc. in de salons, eetzalen en vergelijkbare dagverblijven;

      dd. in toiletten die zijn bestemd voor het gebruik van personen met beperkte mobiliteit;

      ee. in machinekamers, keukens en vergelijkbare ruimten waar brand mogelijk is;

      ff. in koelruimten en overige opslagruimten.

      De alarmknoppen moeten zijn aangebracht op een hoogte tussen 0,85 m en 1,10 m boven de vloer.

      b. een alarminstallatie waarmee de scheepsleiding de passagiers kan waarschuwen.

      Dit alarm moet duidelijk en zonder dat verwarring mogelijk is waarneembaar zijn in alle ruimten die toegankelijk
      zijn voor passagiers. Het moet ingeschakeld kunnen worden vanuit het stuurhuis en vanaf een plaats die constant
      door het personeel wordt bezet.

      c. een alarminstallatie waarmee de scheepsleiding, bedoeld in [artikel 7.09, eerste lid][ref3], de bemanning en het
      boordpersoneel kan waarschuwen.

      Deze alarminstallatie moet eveneens functioneren in de verblijfsruimten voor het boordpersoneel, de koelruimten en
      andere opslagruimten.

      De alarmschakelaars moeten beschermd zijn tegen ongewild gebruik.

      4 Iedere waterdichte afdeling moet zijn uitgerust met een bilge alarm.

      5 Er moeten twee gemotoriseerde lenspompen aan boord beschikbaar zijn.

      6 Een lenssysteem met vast geïnstalleerde lensleidingen moet beschikbaar zijn.

      7 Koelruimten moeten, ook wanneer de deur afgesloten is, van binnen uit kunnen worden geopend.

      8 Indien zich onderdelen van in kasten opgestelde CO-installaties in onderdeks gesitueerde ruimten bevinden, moeten
      deze zijn voorzien van een automatische ventilatie, die automatisch in werking treedt bij het openen van de deur of
      van het luik van deze ruimte. De ventilatieschachten moeten reiken tot op 0,05 m van de bodem van deze ruimte.

      9 Behalve de verbandtrommel, bedoeld in [artikel 10.02, tweede lid, onder f][ref4], moeten er verdere
      verbandtrommels in voldoende aantal aanwezig zijn. De verbandtrommels en de plaats waar ze opgeborgen zijn moeten
      voldoen aan de eisen van [artikel 10.02, tweede lid, onder f][ref5].


