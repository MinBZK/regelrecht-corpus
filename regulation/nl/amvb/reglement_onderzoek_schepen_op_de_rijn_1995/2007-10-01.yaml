  - number: '22.02'
    text: |-
      1 Voor niet-vastgezette containers moet bij elke berekeningsmethode om de stabiliteit van het schip vast te stellen
      van de volgende criteria worden uitgegaan:

      a. De metacentrumhoogte

      mag niet minder zijn dan 1,00 m.

      b. Onder de gelijktijdige invloed van de middelpuntvliedende kracht bij het draaien van het schip, de winddruk en
      de vrije vloeistofoppervlakken mag de optredende slagzij niet meer zijn dan 5° en mag de zijde van het dek niet in
      het water komen.

      c. De arm van het moment veroorzaakt door de middelpuntvliedende kracht bij het draaien van het schip wordt
      berekend volgens de formule:

      .

      In deze formule betekent:

      C coëfficiënt c = 0,04 [s²/m];

      v de grootste snelheid van het schip ten opzichte van het water [m/s];

      de hoogte van het gewichtszwaartepunt van het geladen schip boven de basis [m];

      T' de diepgang van het geladen schip [m].

