    text: |-
      1 Wanneer de uitrusting van een motorschip, een duwboot, een hecht samenstel, een andere hechte samenstelling
      of een passagiersschip niet voldoet aan de standaard S1, bedoeld in [artikel 23.09, eerste lid][ref1], dient de
      minimum-bemanning, bedoeld in de [artikelen 23.10][ref2], [23.11][ref3] of [23.12][ref4], te worden verhoogd

      a) in de exploitatiewijze A1 en A2 telkens met een matroos, en

      b) in de exploitatiewijze B telkens met twee matrozen.

      Wordt alleen niet voldaan aan de gestelde eisen in de onderdelen i en l, onderscheidenlijk de onderdelen i of l van
      de standaard S1, bedoeld in [artikel 23.09][ref5], dan wordt de bemanning bij exploitatiewijze B met één matroos in
      plaats van twee verhoogd.

      2 Wordt niet voldaan aan één of meer gestelde eisen van [artikel 23.09, lid 1.1, onderdelen a tot en met c][ref6],
      dan moeten worden vervangen

      a) in de exploitatiewijze A1 en A2 de matroos, bedoeld in het eerste lid, onderdeel a, door een matroos-
      motordrijver, en

      b) in de exploitatiewijze B de twee matrozen, bedoeld in het eerste lid, onderdeel b, door twee matrozen-
      motordrijver.


