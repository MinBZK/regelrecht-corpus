  - number: '10.02'
    text: |-
      1 De volgende in het Rijnvaartpolitiereglement bedoelde uitrustingsstukken moet ten minste aanwezig zijn:

      a. marifooninstallatie;

      b. apparaten en installaties die nodig zijn voor het geven van de voorgeschreven licht- en geluidsseinen, alsmede
      voor het voeren en tonen van de optische tekens;

      c. onafhankelijk van het aan boord aanwezige elektriciteitsnet werkende lichten ter vervanging van de voor het
      stilliggen voorgeschreven lichten;

      d. een brandbestendig verzamelreservoir met deksel voor oliehoudende poetslappen dat als zodanig is aangeduid;

      e. een apart brandbestendig verzamelreservoir voor het overig vast klein chemisch afval en een brandbestendig
      reservoir met deksel voor vloeibaar klein chemisch afval als bedoeld in het Rijnvaartpolitiereglement dat telkens
      als zodanig is aangeduid;

      f. een brandbestendig verzamelreservoir met deksel voor slops dat als zodanig is aangeduid.

      2 Voorts moeten ten minste aanwezig zijn:

      a. stalen trossen voor het meren:

        - Ieder schip moet zijn uitgerust met 3 stalen trossen voor het meren. De minimum lengte daarvan moet bedragen:
      1ste tros: L + 20 m, echter niet meer dan 100 m, 2de tros: 2/3 van de eerste tros, 3de tros: 1/3 van de eerste
      tros.

      Bij schepen met een lengte L van minder dan 20 m kan de kortste tros achterwege blijven. Deze trossen moeten
      berekend zijn op een minimum breeksterkte Rs die met behulp van de volgende formule wordt vastgesteld:

        - voor L x B x T tot 1000 m3:
        - voor L x B x T groter dan 1000 m3:

      Voor de voorgeschreven stalen trossen moet zich een keuringsbewijs volgens de Europese norm EN 10 204: 1991, model
      3.1, aan boord bevinden.

      Deze trossen mogen worden vervangen door andere kabels van dezelfde lengte en met dezelfde breeksterkte. De
      breeksterkte voor deze kabels moet in een keuringsbewijs worden aangetoond.

      b. trossen voor het slepen:

      Sleepboten moeten zijn uitgerust met een bij hun functie passend aantal trossen.

      De hoofdtros moet echter ten minste 100 m lang zijn en een breeksterkte hebben in kN die overeenkomt met ten minste
      een derde van het totale vermogen in kW van de voortstuwingsmotor(en).

      Motorschepen en duwboten die mogen slepen moeten ten minste zijn uitgerust met een sleeptros van 100 m lengte,
      waarvan de breeksterkte in kN overeenkomt met ten minste een kwart van het totale vermogen in kW van de
      voortstuwingsmotor(en);

      c. een werplijn;

      d. een loopplank, ten minste 0,40 m breed en ten minste 4 m lang, waarvan de zijkanten door een lichte streep zijn
      gemarkeerd; deze loopplank moet van een leuning zijn voorzien. Voor kleine schepen kan de Commissie van Deskundigen
      kortere loopplanken toelaten;

      e. een bootshaak;

      f. een geschikte verbandtrommel met een inhoud overeenkomstig een norm van één der Rijnoeverstaten of van België.
      De verbandtrommel moet in een verblijf of in het stuurhuis worden bewaard en zo zijn opgeborgen dat hij indien
      nodig gemakkelijk en zeker kan worden bereikt. Indien verbandtrommels aan het zicht zijn onttrokken moet de
      afdekking zijn gemarkeerd met een symbool voor verbandtrommels overeenkomstig schets 8 van [bijlage I][ref1] met
      een lengte van de zijde van tenminste 10 cm;

      g. een verrekijker, 7 • 50 of een grotere lensdiameter;

      h. een bord met aanwijzingen betreffende het redden en het bijbrengen van drenkelingen;

      i. een vanuit de stuurstand bedienbare schijnwerper.

      3 Op schepen waarvan de hoogte van het boord boven de waterlijn bij ledig schip meer dan 1,50 m bedraagt moet een
      buitenboordtrap of -ladder aanwezig zijn.


