  - number: 22b.06
    text: |-
      In het geval van snelle schepen moet de aanwezigheid van

      a. eigenschappen wat betreft drijfvermogen en stabiliteit, de veiligheid van het schip tijdens het varen met
      waterverplaatsing zowel in onbeschadigde toestand als in lekke toestand waarborgen,

      b. stabiliteitseigenschappen en stabiliseringssystemen, de veiligheid van het schip tijdens het bedrijf met
      dynamisch draagvermogen en in de overgangsfase waarborgen,

      c. stabiliteitseigenschappen tijdens het bedrijf met dynamisch draagvermogen en in de overgangsfase, het voor het
      schip mogelijk maken op veilige wijze de overgang te maken naar het varen met waterverplaatsing bij een eventueel
      niet functioneren van het systeem in voldoende mate worden aangetoond.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel22b.06
  - number: 22b.07
    text: |-
      1 Inrichting

      a. In afwijking van [artikel 7.01, eerste lid][ref1], moet het stuurhuis zo worden ingericht, dat zowel de
      roerganger als een tweede lid van de bemanning tijdens de vaart steeds hun taken kunnen uitvoeren.

      b. De stuurstand moet zo worden ingericht, dat de onder a genoemde personen daar hun werkplek hebben. De
      inrichtingen voor de navigatie, het manoeuvreren, de controle, het uitwisselen van berichten en de overige
      apparaten die voor het bedrijf van belang zijn moeten zo dicht bij elkaar zijn opgesteld, dat zowel de roerganger
      als een tweede lid van de bemanning over alle noodzakelijke informatie kan beschikken om indien nodig zittend alle
      uitrustings- en bedieningsinrichtingen te kunnen bedienen. In ieder geval moet:

      aa. de stuurstand van de roerganger zijn uitgevoerd als éénmansstuurstelling voor het varen op radar,

      bb. het tweede lid van de bemanning op zijn werkplek beschikken over een eigen radarbeeld (slave) en vanaf zijn
      werkplek in staat zijn in te grijpen in de uitwisseling van berichten en in de aandrijving van het schip.

      c. De onder a vermelde personen moeten, ook indien de veiligheidsgordels normaal zijn gesloten, in staat zijn de
      inrichtingen, bedoeld onder b, zonder belemmering te bedienen.

      2 Vrij zicht

      a. In afwijking van [artikel 7.02, tweede lid][ref2], mag de dode hoek vanaf een zittende positie en bij elke
      beladingstoestand niet meer bedragen dan één scheepslengte voor de boeg.

      b. In afwijking van [artikel 7.02, derde lid][ref3], mag de som van de sectoren zonder vrij gezichtsveld van recht
      vooruit tot 22,5° achterlijker dan dwars aan iedere zijde niet meer dan 20° bedragen. Iedere afzonderlijke sector
      zonder vrij gezichtsveld mag niet meer bedragen dan 5°. De sector met vrij zicht tussen twee sectoren zonder vrij
      gezichtsveld mag niet minder bedragen dan 10°.

      3 Instrumenten

      De instrumentenpanelen voor de bediening en de controle van de in [artikel 22b.11][ref4] genoemde installaties
      moeten gescheiden op een duidelijk herkenbare plaats binnen het stuurhuis zijn aangebracht. Dit geldt in voorkomend
      geval ook voor inrichtingen voor het te water laten van gemeenschappelijke reddingsmiddelen.

      4 Verlichting

      In zones of bij onderdelen van de uitrusting, die tijdens het bedrijf verlicht moeten zijn, moet rood licht worden
      toegepast.

      5 Vensters

      Reflecties moeten vermeden worden. Er moeten inrichtingen ter vermijding van verblinding door zonlicht aanwezig
      zijn.

      6 Oppervlaktematerialen

      In het stuurhuis moeten reflecties door oppervlaktematerialen vermeden worden.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel7.01
      [ref2]: https://wetten.overheid.nl/BWBR0007858#Artikel7.02
      [ref3]: https://wetten.overheid.nl/BWBR0007858#Artikel7.02
      [ref4]: https://wetten.overheid.nl/BWBR0007858#Artikel22b.11
