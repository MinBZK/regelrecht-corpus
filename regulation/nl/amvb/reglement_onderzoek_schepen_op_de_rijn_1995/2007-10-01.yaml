  - number: '15.11'
    text: |-
      1 De technische geschiktheid van materialen en onderdelen op het gebied van brandbescherming moet worden
      vastgesteld door een geaccrediteerd testinstituut op grond van geschikte testmethoden.

      a. Het testinstituut moet voldoen aan:

      aa. de code voor brandtestmethoden of

      bb. de Europese norm EN ISO/IEC 17025 : 2000, inzake de algemene eisen aan de kundigheid van test- en
      kalibreerlaboratoria.

      b. Erkend als testmethoden ten behoeve van het vaststellen van de onbrandbaarheid van materialen zijn:

      aa. bijlage 1, deel 1, van de code voor brandtestmethoden en

      bb. gelijkwaardige voorschriften van één der Rijnoeverstaten of België.

      c. Erkend als testmethoden ten behoeve van het vaststellen van het moeilijk ontvlambaar zijn van materialen zijn:

      aa. de voor de verschillende punten van toepassing zijnde eisen van bijlage 1, deel 5 (ontvlambaarheidstest van
      het oppervlak), deel 6 (test van dekbedekking), deel 7 (test van stofferingen en kunststoffen), deel 8 (test van
      gestoffeerd meubilair) en deel 9 (test van onderdelen van beddengoed) van de code voor brandtestmethoden en

      bb. gelijkwaardige voorschriften van één der Rijnoeverstaten of België.

      d. Erkend als testmethoden ten behoeve van het vaststellen van brandbestendigheid zijn:

      aa. IMO besluit A.754 (18) en

      bb. gelijkwaardige voorschriften van één der Rijnoeverstaten of België.

      e. De Commissie van Deskundigen kan in overeenstemming met de code voor brandtestmethoden een test voor een model
      scheidingsvlak voorschrijven teneinde zeker te stellen dat aan de voorschriften inzake weerstandsvermogen en
      temperatuurverhoging, bedoeld in het tweede lid, is voldaan.

