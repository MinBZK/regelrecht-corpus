  - number: '1.02'
    text: |-
      1 Dit reglement is van toepassing op:

      a. schepen met een lengte van 20 m of meer;

      b. schepen waarvan het volume, berekend uit het produkt L * B * T, 100 m³ of meer bedraagt.

      2 Ongeacht het in het eerste lid bepaalde is dit reglement van toepassing op alle:

      a. sleep- en duwboten die zijn bestemd om de in het eerste lid bedoelde schepen of drijvende werktuigen te slepen,
      te duwen of langszijde gekoppeld mede te voeren;

      b. schepen die beschikken over een certificaat van goedkeuring als bedoeld in het ADNR;

      c. passagiersschepen;

      d. drijvende werktuigen.

      3 Dit reglement is niet van toepassing op veerponten als bedoeld in het [Rijnvaartpolitiereglement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006923
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel1.02
    references:
      - id: ref1
        bwb_id: BWBR0006923
  - number: '1.03'
    text: |-
      De in [artikel 1.02, eerste en tweede lid][ref1], bedoelde vaartuigen moeten zijn voorzien van een certificaat van
      onderzoek dat is afgegeven door een Commissie van Deskundigen, die door één der Oeverstaten of België is ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel1.02
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel1.03
    references:
      - id: ref1
        bwb_id: BWBR0007858
        artikel: '1.02'
        hoofdstuk: '1'
  - number: '1.04'
    text: |-
      Voor kanaalspitsen die slechts de Rijn tussen Basel (Mittlere Rheinbrücke) en de sluizen te Iffezheim (met inbegrip
      van de meest benedenstrooms gelegen voorhaven) bevaren, volstaat in plaats van het certificaat van onderzoek een
      door een Commissie van Deskundigen van één der Oeverstaten of België afgegeven certificaat, waaruit de geschiktheid
      voor de vaart op dit riviergedeelte blijkt. In dit geval moeten zij voldoen aan [hoofdstuk 19][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Hoofdstuk19
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel1.04
    references:
      - id: ref1
        bwb_id: BWBR0007858
        hoofdstuk: '19'
  - number: '1.05'
    text: |-
      Voor zeeschepen wordt het certificaat van onderzoek volgens [bijlage B][ref1], indien zij niet van dit certificaat
      zijn voorzien, vervangen door een certificaat volgens [bijlage G][ref2], waaruit de geschiktheid voor de vaart op
      de Rijn blijkt. In dit geval moeten zij voldoen aan [hoofdstuk 20][ref3].


