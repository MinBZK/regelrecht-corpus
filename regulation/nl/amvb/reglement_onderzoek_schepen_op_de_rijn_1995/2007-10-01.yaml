    text: |-
      Snelle schepen als bedoeld in [artikel 1.01, onderdeel 20a][ref1], die op 31 maart 2003 beschikken over een geldig
      certificaat van onderzoek, moeten voldoen aan de volgende voorschriften van dit hoofdstuk:

      a. bij verlenging van het certificaat van onderzoek aan de [artikelen 22b.01][ref2], [22b.04][ref3],
      [22b.08][ref4], [22b.09][ref5], [22b.10][ref6] en [22b.11, eerste lid][ref7];

      b. op 1 april 2013 aan de [artikelen 22b.07, eerste, derde, vierde, vijfde en zesde lid][ref8];

      c. op 1 januari 2023 aan de overige voorschriften.


