  - number: '9.07'
    text: |-
      1 Voor gelijkstroom en 1-fase wisselstroom zijn de volgende verdeelsystemen toegestaan:

      a. twee geleiders waarvan één is geaard (L1/N/PE);

      b. één geleider met terugleiding naar de scheepsromp, alleen voor plaatselijk begrensde installaties, zoals
      startinstallaties van een verbrandingsmotor en kathodische corrosiebescherming (L1/PEN);

      c. twee geleiders geïsoleerd van de scheepsromp (L1/L2/PE).

      2 Voor draaistroom (3-fasen wisselstroom) zijn de volgende verdeelsystemen toegestaan:

      a. vier geleiders met geaard sterpunt zonder terugleiding via de scheepsromp (L1/L2/L3/N/PE) = (TN-S-Net) of (TT-
      Net);

      b. drie geleiders geïsoleerd van de scheepsromp (L1/L2/L3/PE) = (IT-Net);

      c. drie geleiders met geaard sterpunt en terugleiding via de scheepsromp, echter niet voor eindstroomkringen (L1/
      L2/L3/PEN).

      3 Toepassing van andere systemen kan door de Commissie van Deskundigen worden toegestaan.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel9.07
  - number: '9.08'
    text: |-
      1 Voedingskabels van het walnet en andere externe netten naar het boordnet moeten aan boord door middel van vast
      aangebrachte klemmen of door een vast aangebrachte stekkerinrichting kunnen worden aangesloten. Kabelverbindingen
      mogen niet op trek worden belast.

      2 De scheepsromp moet bij een aansluitspanning van meer dan 50 V doelmatig kunnen worden geaard. Aardaansluitingen
      moeten duidelijk gekenmerkt zijn.

      3 Schakelinrichtingen van de aansluitingen moeten zodanig zijn ingericht dat parallelbedrijf van de
      boordnetgeneratoren met het walnet of andere externe netten wordt vermeden. Een kortstondig parallelbedrijf ten
      behoeve van omschakelen zonder spanningsonderbreking van de systemen is toegestaan.

      4 De aansluiting moet tegen kortsluiting en overbelasting zijn beveiligd.

      5 Op het hoofdschakelbord moet zijn aangegeven of de aansluiting onder spanning staat.

      6 Teneinde bij gelijkspanning de polariteit en bij draaistroom de fasevolgorde van het walnet of van andere externe
      netten met die van het boordnet te kunnen vergelijken, moet een aanwijsinrichting zijn geïnstalleerd.

      7 Bij de aansluiting moet met een opschrift zijn aangegeven:

      a. de te treffen maatregelen voor het tot stand brengen van de aansluiting;

      b. de stroomsoort, de nominale spanning en, bij wisselstroom, bovendien de frequentie.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel9.08
  - number: '9.09'
    text: |-
      1 Indien aan andere vaartuigen stroom wordt geleverd, moet daarvoor een afzonderlijke aansluitinrichting aanwezig
      zijn. Indien contactstekkerinrichtingen worden gebruikt die geschikt zijn voor een nominale stroom van meer dan
      16 A, moet zijn gewaarborgd dat het aansluiten of het verbreken van de aansluiting alleen in stroomloze toestand
      kan plaatsvinden.

      2 Kabelverbindingen mogen niet op spanning worden belast.

      3 Artikel 9.08, derde tot en met zevende lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel9.09
  - number: '9.10'
    text: |-
      1 Generatoren, motoren en hun aansluitkasten moeten voor inspecties, metingen en reparaties toegankelijk
      zijn. De beschermingsgraad moet in overeenstemming zijn met de plaats van opstelling zoals aangegeven in
      [artikel 9.03][ref1].

      2 Generatoren, die worden aangedreven door de hoofdmotor, de schroef-as of een voor andere doeleinden bestemd
      hulpaggregaat, moeten voor de onder bedrijfsomstandigheden optredende toerentalvariaties geschikt zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel9.03
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel9.10
    references:
      - id: ref1
        bwb_id: BWBR0007858
        artikel: '9.03'
        hoofdstuk: '9'
  - number: '9.11'
    text: |-
      1 Accumulatoren moeten zodanig zijn opgesteld, dat zij toegankelijk zijn en niet kunnen verschuiven tengevolge
      van de scheepsbewegingen. Zij mogen niet zijn opgesteld op plaatsen waar zij aan overmatige hitte, extreme koude,
      sproeiwater of dampen zijn blootgesteld.

      Zij mogen niet zijn opgesteld in stuurhuizen, verblijven en laadruimen. Dit geldt echter niet voor voor
      accumulatoren in draagbare apparatuur alsmede voor accumulatoren die worden geladen met een vermogen van minder dan
      0,2 kW.

      2 Accumulatoren die worden geladen met een een vermogen van meer dan 2,0 kW (berekend uit de maximale laadstroom
      en de nominale spanning van de batterij, met inachtname van de laadkarakteristiek van de laadinrichting), moeten
      in een speciale ruimte zijn ondergebracht. Bij opstelling aan dek is het voldoende indien zij in een kast zijn
      geplaatst.

      Accumulatoren die worden geladen met een vermogen tot 2,0 kW of minder mogen ook benedendeks in een kast of kist
      zijn opgesteld. Zij mogen ook open in de machinekamer of een andere goed geventileerde ruimte zijn geplaatst, mits
      zij zijn beschermd tegen vallende voorwerpen en druipwater.

      3 De binnenzijde van alle voor accumulatoren bestemde ruimten, kasten of kisten, alsmede rekken en andere
      onderdelen, moeten tegen de schadelijke inwerking van electrolyt zijn beschermd.

      4 Gesloten ruimten, kasten of kisten, waarin accumulatoren zijn opgesteld, moeten doelmatig kunnen worden
      geventileerd. Een mechanische ventilatie moet zijn aangebracht indien het laadvermogen groter is dan 2 kW voor
      nikkel-cadmium accumulatoren en groter is dan 3 kW voor lood accumulatoren.

      De luchttoevoer aan de onderzijde en de luchtafvoer aan de bovenzijde moeten zodanig zijn dat een goede afvoer van
      de gassen is gewaarborgd.

      De ventilatiekanalen mogen geen inrichtingen zoals afsluitinrichtingen bevatten die de vrije doorgang van de lucht
      belemmeren.

      5 De vereiste hoeveelheid lucht Q in m3 per uur moet worden berekend volgens de formule:

      Q = 0,11 . l . n [m³/u].

      Daarbij betekent:

      l = 25% van de maximale stroom van de laadinrichting in A;

      n = het aantal cellen.

      Voor accumulatoren die in een bufferschakeling met het boordnet zijn opgenomen kan door de Commissie van
      Deskundigen op grond van de laadkarakteristiek van de laadinrichting een andere berekeningsmethode voor
      de benodigde luchthoeveelheid worden toegelaten voor zover deze berust op voorschriften van een erkend
      classificatiebureau of daartoe in aanmerking komende normen.

      6 Bij natuurlijke ventilatie moet de doorsnede van de ventilatiekanalen zo groot zijn dat bij een luchtsnelheid van
      0,5 m/s de vereiste luchthoeveelheid wordt opgebracht. De doorsnede moet echter voor lood accumulatoren tenminste
      80 cm² en voor nikkel-cadmium accumulatoren ten minste 120 cm² bedragen.

      7 Bij mechanische ventilatie moet, bij voorkeur, een afzuigventilator worden gebruikt waarvan de motor niet in de
      gas- of luchtstroom mag zijn geplaatst.

      Deze ventilator moet zodanig zijn uitgevoerd dat geen vonkvorming bij aanraking van een waaier met het
      ventilatorhuis en geen elektrostatische oplading kunnen optreden.

      8 Op de deuren of deksels van ruimten, kasten of kisten voor accumulatoren moet een teken «vuur, open licht
      en roken verboden» met een diameter van ten minste 10 cm, overeenkomstig schets 2 van [bijlage I][ref1], zijn
      aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007858
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel9.11
    references:
      - id: ref1
        bwb_id: BWBR0007858
  - number: '9.12'
    text: |-
      1 Schakelborden:

      a. Apparaten, schakelaars, veiligheden en instrumenten in schakelborden moeten overzichtelijk zijn gerangschikt en
      ten behoeve van onderhoud en reparatie toegankelijk zijn.

      Aansluitklemmen voor spanningen tot en met 50 V en die voor spanningen boven 50 V moeten van elkaar gescheiden zijn
      aangebracht en doelmatig zijn gekenmerkt.

      b. Op de schakelborden moeten naamplaatjes voor alle schakelaars en apparaten met de aanduiding van de stroomkring
      zijn aangebracht.

      Veiligheden moeten met de nominale stroomsterkte en de stroomkring zijn aangeduid.

      c. Indien zich achter de deuren apparaten met een bedrijfsspanning van meer dan 50 V bevinden, moeten de onder
      spanning staande delen van deze apparaten tegen onvoorzien aanraken bij geopende deuren zijn beschermd.

      d. Materialen van schakelborden moeten mechanisch sterk, duurzaam, moeilijk ontvlambaar, zelf dovend en niet
      hygroscopisch zijn.

      e. Zijn in schakelkasten kortsluitveiligheden van het type "mespatroon" ingebouwd dan moeten in de nabijheid
      van deze schakelkasten hulpmiddelen en middelen voor de bescherming van personen aanwezig zijn om deze te kunnen
      vervangen.

      2 Schakelaars, beveiligingen:

      a. Generator- en afgaande groepen moeten in elke niet geaarde geleider tegen kortsluiting en overbelasting
      beveiligd zijn. Daartoe kunnen schakelaars met kortsluit- en maximaalschakelaars of smeltveiligheden worden
      gebruikt.

      Stroomkringen van de elektrische aandrijving van stuurinrichtingen, alsmede de stuurstroomkringen van
      stuurinrichtingen, mogen alleen tegen kortsluiting zijn beveiligd. Indien schakelaars met een thermische
      uitschakelinrichting worden toegepast, moeten de thermische uitschakelinrichtingen buiten bedrijf zijn gesteld of
      op ten minste tweemaal de nominale stroom zijn afgesteld.

      b. De afgaande groepen van het hoofdschakelbord van meer dan 16 A moeten van last- of maximaalschakelaars zijn
      voorzien.

      c. Verbruikers die voor de voortstuwing, de stuurinrichting, de roerstandaanwijzer, de navigatie en de
      beveiligingssystemen noodzakelijk zijn, alsmede de verbruikers met een nominale stroom van meer dan 16 A, moeten
      via afzonderlijke stroomkringen worden gevoed.

      d. Stroomkringen van verbruikers die voor de voortstuwing en het manoeuvreren noodzakelijk zijn, moeten direct van
      het hoofdschakelbord worden gevoed.

      e. Schakelinrichtingen moeten volgens hun nominale stroom, hun thermische en dynamische sterkte alsmede hun
      schakelvermogen worden gekozen. Schakelaars moeten alle onder spanning staande geleiders gelijktijdig schakelen. De
      stand moet duidelijk te onderscheiden zijn.

      f. Smeltveiligheden moeten van het gesloten type zijn en uit keramisch of gelijkwaardig materiaal bestaan. Zij
      moeten zonder aanrakingsgevaar voor personen kunnen worden vervangen.

      3 Meet- en controle-inrichtingen:

      a. Voor generator-, accumulator- en verdeelstroomkringen moeten meet- en controle-inrichtingen aanwezig zijn, voor
      zover dit voor een veilig bedrijf van de installatie noodzakelijk is.

      b. Niet geaarde netten met een spanning boven 50 V moeten van een doelmatige aardfoutbewakingsinrichting
      met zowel een optisch als een akoestisch alarmsignaal zijn voorzien. Voor secundaire inrichtingen, zoals
      stuurstroomschakelingen, kan hiervan worden afgezien.

      4 Opstelling van schakelborden:

      a. Schakelborden moeten in goed toegankelijke en goed geventileerde ruimten zijn opgesteld, zodanig dat zij tegen
      waterschade en mechanische beschadigingen zijn beschermd.

      Pijpleidingen en ventilatiekokers moeten zodanig zijn geplaatst, dat schakelborden bij lekkages geen gevaar
      lopen. Indien de ligging in de nabijheid van schakelborden niet vermeden kan worden, mogen de pijpen aldaar geen
      losneembare koppelingen hebben.

      b. Kasten en nissen waarin open schakelinrichtingen zijn ondergebracht, moeten uit moeilijk ontvlambaar materiaal
      bestaan, dan wel door een bekleding van metaal of een ander niet brandbaar materiaal zijn beschermd.

      c. Bij spanningen boven 50 V moeten aan de bedieningszijde van het hoofdschakelbord isolerende roosters of matten
      liggen.
