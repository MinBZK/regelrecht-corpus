  - number: '5.03'
    text: |-
      1 De in [artikel 5.02][ref1] bedoelde proefvaarten dienen in de door de bevoegde autoriteiten aangewezen vakken van
      de Rijn of van andere binnenwateren te worden uitgevoerd.

      2 Deze proefvaarttrajecten moeten zich bevinden in zo recht mogelijke vakken met een lengte van ten minste 2 km
      en voldoende breedte in stromend of stil water en moeten zijn voorzien van duidelijk herkenbare markeringen om de
      positie van het schip vast te kunnen stellen.

      3 De hydrologische gegevens, zoals waterdiepte, vaarwaterbreedte en gemiddelde stroomsnelheid in het vaarwater bij
      verschillende waterstanden moeten door de Commissie van Deskundigen kunnen worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel5.02
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel5.03
    references:
      - id: ref1
        bwb_id: BWBR0007858
        artikel: '5.02'
        hoofdstuk: '5'
  - number: '5.04'
    text: |-
      Schepen en samenstellen die bestemd zijn voor het vervoer van goederen moeten voor de proefvaarten zo mogelijk
      gelijklastig en ten minste voor 70% zijn beladen. Wanneer de proefvaart met minder lading wordt uitgevoerd, moet de
      toelating voor wat betreft de afvaart tot deze belading worden beperkt.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel5.04
  - number: '5.05'
    text: |-
      1 Bij de proefvaarten mogen geen ankers worden gebruikt, maar wel alle in het certificaat van onderzoek, onder 34
      en 52, ingevulde inrichtingen die vanuit de stuurstelling te bedienen zijn.

      2 Bij opdraaimanoeuvres als bedoeld in [artikel 5.10][ref1] mogen echter de boegankers worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel5.10
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel5.05
    references:
      - id: ref1
        bwb_id: BWBR0007858
        artikel: '5.10'
        hoofdstuk: '5'
  - number: '5.06'
    text: |-
      1 Schepen en samenstellen moeten een snelheid ten opzichte van het water van ten minste 13 km/u kunnen bereiken.
      Dit geldt niet voor duwboten indien zij alleen varen.

      2 Voor schepen en samenstellen die slechts op de reden en in de havens varen kan de Commissie van Deskundigen
      afwijkingen toestaan.

      3 De Commissie van Deskundigen gaat na of het vaartuig in onbeladen toestand een snelheid ten opzichte van het
      water van 40 km/u kan overschrijden. Is dit het geval dan moet in het certificaat van onderzoek onder nummer 52
      worden vermeld: «Het vaartuig is in staat een snelheid van 40 km/u ten opzichte van het water te overschrijden.»
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel5.06
  - number: '5.07'
    text: |-
      1 Schepen en samenstellen moeten tijdig kop vóór kunnen stilhouden en moeten tegelijkertijd voldoende bestuurbaar
      blijven.

      2 Bij schepen en samenstellen met een lengte L van 86 m of minder en een breedte van 22,90 m of minder kunnen deze
      stop-eigenschappen worden vervangen door de keer-eigenschappen.

      3 De stop-eigenschappen dienen door stopmanoeuvres op één der in [artikel 5.03][ref1] bedoelde proefvaartvakken en
      de keer-eigenschappen door opdraaimanoeuvres als bedoeld in [artikel 5.10][ref2] te worden aangetoond.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel5.03
      [ref2]: https://wetten.overheid.nl/BWBR0007858#Artikel5.10
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel5.07
    references:
      - id: ref1
        bwb_id: BWBR0007858
        artikel: '5.03'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0007858
        artikel: '5.10'
        hoofdstuk: '5'
  - number: '5.08'
    text: |-
      Wanneer de in [artikel 5.07][ref1] genoemde noodzakelijke stopmanoeuvre in stilstaand water wordt uitgevoerd, dient
      tevens een achteruitvaarproef te worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel5.07
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel5.08
    references:
      - id: ref1
        bwb_id: BWBR0007858
        artikel: '5.07'
        hoofdstuk: '5'
  - number: '5.09'
    text: |-
      Schepen en samenstellen moeten tijdig kunnen uitwijken. De uitwijkeigenschappen dienen te worden aangetoond door
      uitwijkmanoeuvres op één der in [artikel 5.03][ref1] bedoelde proefvaartvakken.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel5.03
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel5.09
    references:
      - id: ref1
        bwb_id: BWBR0007858
        artikel: '5.03'
        hoofdstuk: '5'
  - number: '5.10'
    text: |-
      Schepen en samenstellen met een lengte van 86 m of minder en een breedte van 22,90 m of minder moeten tijdig kunnen
      keren.

      Deze keereigenschappen kunnen door de in [artikel 5.07][ref1] bedoelde stop-eigenschappen worden vervangen.

      De keereigenschappen dienen door opdraaimanoeuvres te worden aangetoond.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel5.07
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel5.10
    references:
      - id: ref1
        bwb_id: BWBR0007858
        artikel: '5.07'
        hoofdstuk: '5'
  - number: '6.01'
    text: |-
      1 Schepen moeten zijn voorzien van een betrouwbaar werkende stuurinrichting waarmee ten minste de in
      [hoofdstuk 5][ref1] bedoelde manoeuvreereigenschappen worden bereikt.

      2 Werktuiglijk aangedreven stuurinrichtingen moeten zodanig zijn uitgevoerd dat het roer niet onvoorzien van stand
      kan veranderen.

      3 De gehele stuurinrichting moet voor een permanente slagzij van het schip tot 15° en omgevingstemperaturen van
      -20° C tot + 50° C geschikt zijn.

      4 De afzonderlijke onderdelen van de stuurinrichting moeten qua sterkte zodanig zijn geconstrueerd dat alle
      onder normale omstandigheden daarop inwerkende krachten goed kunnen worden opgenomen. De van buitenaf op het roer
      inwerkende krachten mogen het functioneren van de stuurmachine en zijn aandrijving niet beïnvloeden.

      5 Stuurinrichtingen moeten een mechanisch aangedreven stuurmachine hebben wanneer de voor de bediening van het roer
      te leveren krachten dit vereisen.

      6 Stuurmachines met een mechanische aandrijving moeten een beveiliging tegen overbelasting hebben die het door de
      aandrijving uitgeoefende koppel begrenst.

      7 Asdoorvoeringen van roerkoningen moeten zodanig zijn uitgevoerd dat geen waterverontreinigende smeermiddelen naar
      buiten kunnen treden.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel6.01
    references:
      - id: ref1
        bwb_id: BWBR0007858
        hoofdstuk: '5'
  - number: '6.02'
    text: |-
      1 Bij stuurmachines met mechanische aandrijving moet in geval van uitval of storing van de aandrijving binnen 5
      seconden een tweede onafhankelijke aandrijving of een handaandrijving in werking kunnen worden gesteld.

      2 Wanneer het inschakelen van de tweede aandrijving of van de handaandrijving niet automatisch geschiedt, moet de
      roerganger deze met één enkele handeling onmiddellijk, snel en eenvoudig kunnen inschakelen.

      3 Ook wanneer de tweede aandrijving of de handaandrijving in werking is, moeten de in [hoofdstuk 5][ref1] bedoelde
      manoeuvreereigenschappen kunnen worden gerealiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel6.02
    references:
      - id: ref1
        bwb_id: BWBR0007858
        hoofdstuk: '5'
  - number: '6.03'
    text: |-
      1 Aan de hydraulische aandrijfinstallatie van de stuurmachine mogen geen andere verbruikers zijn aangesloten.
      Wanneer twee gescheiden aandrijfinstallatiesvan de stuurmachine aanwezig zijn, is dit echter voor één van de twee
      installaties toegestaan, indien de verbruikers in de retourleiding zijn aangesloten en door een afsluitinrichting
      van de aandrijving van de stuurmachine kunnen worden gescheiden.

      2 Bij twee hydraulische aandrijfinstallaties is voor elke installatie een onafhankelijke tank voor het hydraulische
      systeem vereist, waarbij tanks met ingebouwd scheidingsschot zijn toegestaan. De tanks voor het hydraulische
      systeem dienen te zijn uitgerust met een niveau-alarmsysteem, dat het dalen van het olieniveau beneden de voor het
      veilig kunnen functioneren laagst toegestane stand controleert.

      3 Wanneer het stuurventiel vanuit de stuurstelling met de hand of handhydraulisch kan worden bediend, kan met één
      stuurventiel worden volstaan.

      4 De afmetingen, constructie en plaatsing van de pijpleidingen moeten beschadigingen door mechanische invloeden of
      vuur zo veel mogelijk uitsluiten.

      5 Bij hydraulische aandrijfinstallaties kan voor de tweede installatie van de stuurmachine worden afgezien van een
      gescheiden pijpleidingsysteem, wanneer een onafhankelijke werking van de twee aandrijfinstallaties is gewaarborgd
      en het leidingsysteem is berekend op ten minste de 1,5-voudige ten hoogste toelaatbare werkdruk.

      6 Hydraulische slangen zijn slechts toegestaan wanneer het gebruik daarvan in verband met het verminderen van
      trillingen of de bewegingsvrijheid van de componenten absoluut noodzakelijk is. Zij moeten ten minste zijn berekend
      op de ten hoogste toegelaten werkdruk.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel6.03
  - number: '6.04'
    text: |-
      1 Stuurinrichtingen met twee mechanische aandrijvingen moeten beschikken over twee energiebronnen.

      2 Wanneer de tweede energiebron van een stuurmachine met mechanische aandrijving tijdens de vaart niet continu kan
      worden gebruikt, moet de voor het starten daarvan benodigde tijd door een buffersysteem van voldoende capaciteit
      worden overbrugd.

      3 Bij elektrische energiebronnen mogen uit de toevoer van de stuurinrichtingen geen andere verbruikers worden
      gevoed.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel6.04
  - number: '6.05'
    text: |-
      1 Het handstuurwiel mag niet meegedraaid kunnen worden door een mechanische aandrijving.

      2 Terugslag van het stuurwiel moet bij automatisch inschakelen van de handaandrijving bij iedere stand van het roer
      zijn verhinderd.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel6.05
  - number: '6.06'
    text: |-
      1 Indien bij roerpropeller-, waterstraal-, cycloïdaalschroef- en boegschroefinstallaties de afstandsbediening voor
      de verandering van de richting van de stuwkracht elektrisch, hydraulisch of pneumatisch is, dan moeten vanaf de
      stuurstelling tot de propeller- of straalinstallatie twee van elkaar onafhankelijke besturingssystemen aanwezig
      zijn die voldoen aan de in de [artikelen 6.01 tot en met 6.05][ref1] genoemde eisen.

      Dit is niet van toepassing indien het gebruik van dergelijke installaties niet noodzakelijk is om te kunnen voldoen
      aan de manoeuvreereigenschappen bedoeld in [hoofdstuk 5][ref2], dan wel uitsluitend voor de stopproef.

      2 Indien twee of meer van elkaar onafhankelijke roerpropeller-, waterstraal- of cycloïdaalschroefinstallaties
      aanwezig zijn, is het tweede besturingssysteem niet vereist indien het schip bij het uitvallen van één van deze
      installaties manoeuvreerbaar blijft overeenkomstig [hoofdstuk 5][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel6.01
      [ref2]: https://wetten.overheid.nl/BWBR0007858#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0007858#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel6.06
    references:
      - id: ref1
        bwb_id: BWBR0007858
        artikel: '6.01'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007858
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0007858
        hoofdstuk: '5'
  - number: '6.07'
    text: |-
      1 De stand van het roer moet bij de stuurstelling duidelijk zichtbaar zijn. Elektrische roerstandaanwijzers moeten
      een eigen voeding hebben.

      2 De stuurstelling moet van ten minste de volgende instrumenten voor signalering en controle zijn voorzien:

      a. het oliepeil van de tanks voor het hydraulische systeem als bedoeld in [artikel 6.03, tweede lid][ref1], en de
      werkdruk van het hydraulische systeem;

      b. het uitvallen van de voeding van de elektrische besturingsenergie;

      c. het uitvallen van de voeding van de elektrische energie ten behoeve van de aandrijving;

      d. het uitvallen van de stuurautomaat;

      e. het uitvallen van de voorgeschreven buffersystemen.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel6.03
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel6.07
    references:
      - id: ref1
        bwb_id: BWBR0007858
        artikel: '6.03'
        hoofdstuk: '6'
  - number: '6.08'
    text: |-
      1 Stuurautomaten en de onderdelen ervan moeten voldoen aan [artikel 9.20][ref1].

      2 Een groen lampje in de stuurstelling moet aangeven dat de stuurautomaat voor gebruik gereed is.

      Uitval, ontoelaatbare afwijkingen van de spanning van de voeding en ontoelaatbare daling van de rotatiefrequentie
      van de gyroscoop moeten worden gecontroleerd.

      3 Wanneer er naast de stuurautomaat nog andere besturingssystemen aanwezig zijn, moet bij de stuurstelling
      duidelijk te zien zijn welk systeem is ingeschakeld. De omschakeling van het ene systeem naar het andere
      moet onmiddellijk kunnen geschieden. Storingen van stuurautomaten mogen het betrouwbaar functioneren van de
      stuurinrichting niet kunnen beïnvloeden.

      4 De voeding van de elektrische energie van de stuurautomaat moet onafhankelijk zijn van andere verbruikers.

      5 De in stuurautomaten gebruikte gyroscopen, sensoren of bochtaanwijzers moeten voldoen aan de minimumeisen van de
      "Voorschriften omtrent de minimumeisen en keuringsvoorwaarden voor bochtaanwijzers in de Rijnvaart".


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel9.20
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel6.08
    references:
      - id: ref1
        bwb_id: BWBR0007858
        artikel: '9.20'
        hoofdstuk: '9'
  - number: '6.09'
    text: |-
      1 De correcte installatie van de stuurinrichting dient door een Commissie van Deskundigen te worden gekeurd.
      Daartoe kan de Commissie van Deskundigen om de volgende bescheiden vragen:

      a. Beschrijving van de stuurinrichting;

      b. Bouwtekeningen en gegevens over de aandrijvingen van de stuurmachine en de besturing;

      c. Gegevens over de stuurmachine;

      d. Schakelschema voor de elektrische installatie;

      e. Beschrijving van de stuurautomaat;

      f. Gebruiksaanwijzing van de installatie.

      2 Bij een proefvaart dient de werking van de stuurinrichting als geheel te worden gekeurd. Bij stuurautomaten
      dient te worden getest of op veilige wijze een rechte koers wordt gehouden en of op veilige wijze in bochten wordt
      gevaren.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel6.09
  - number: '7.01'
    text: |-
      1 Stuurhuizen moeten zodanig zijn ingericht dat de roerganger zijn werkzaamheden tijdens de vaart te allen tijde
      kan verrichten.

      2 Tijdens het normale bedrijf van het schip mag het niveau van de geluidsdruk voortgebracht door het schip bij de
      stuurstelling ter hoogte van het hoofd van de roerganger niet hoger zijn dan 70 dB(A).

      3 Bij éénmansstuurstellingen voor het varen op radar moet de roerganger zijn werkzaamheden zittend kunnen
      verrichten en moeten alle voor het voeren van het schip noodzakelijke signalerings- en controle-instrumenten en de
      bedieningsapparatuur zodanig zijn gerangschikt dat de roerganger ze tijdens de vaart gemakkelijk kan observeren en
      bedienen zonder daarbij zijn plaats te hoeven verlaten en zonder het radarbeeld uit het oog te verliezen.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel7.01
  - number: '7.02'
    text: |-
      1 Het uitzicht vanaf de stuurstelling moet naar alle zijden voldoende vrij zijn.

      2 De dode hoek voor de boeg van het lege schip met halve voorraden en zonder ballast mag voor de roerganger niet
      meer dan 250 m zijn.

      Optische hulpmiddelen als bedoeld in [artikel 1.09 van het Rijnvaartpolitiereglement][ref1] ter verkleining van de
      dode hoek mogen bij het onderzoek niet in aanmerking worden genomen.

      3 Het vrije gezichtsveld vanaf de plaats waar de roerganger zich gewoonlijk bevindt moet ten minste 240° van de
      horizon bedragen. Daarvan moet een gezichtsveld van ten minste 140° binnen de voorste halve cirkel liggen.

      In de normale zichtas van de roerganger mogen zich geen vensterstijlen, steunen of opbouwen bevinden.

      Indien geen voldoende vrij uitzicht naar achteren gewaarborgd is, kan de Commissie van Deskundigen andere
      maatregelen eisen, zoals de inbouw van optische hulpmiddelen.

      4 Door adequate middelen moet zijn gewaarborgd dat onder alle weersomstandigheden door de voorruiten helder zicht
      mogelijk is.

      5 In stuurhuizen gebruikte ruiten moeten een minimale lichtdoorlaatbaarheid van 75% hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0006923#Artikel1.09
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel7.02
    references:
      - id: ref1
        bwb_id: BWBR0006923
        artikel: '1.09'
  - number: '7.03'
    text: |-
      1 De voor het voeren van een schip noodzakelijke bedieningsapparatuur moet gemakkelijk kunnen worden bediend. De
      stand waarin zij zijn gebracht moet duidelijk herkenbaar zijn.

      2 Controle-instrumenten moeten gemakkelijk kunnen worden afgelezen; zij moeten traploos regelbaar kunnen worden
      verlicht. Lichtbronnen mogen niet storen of de zichtbaarheid van de controle-instrumenten beïnvloeden.

      3 Er moet een inrichting voor het controleren van de signaallampjes aanwezig zijn.

      4 Of een inrichting in werking is, moet duidelijk zichtbaar zijn. Wanneer dit door een signaallampje wordt
      aangegeven, moet dit groen zijn.

      5 Storingen of het uitvallen van inrichtingen waarvan controle verplicht is, dient door rode signaallampjes te
      worden aangegeven.

      6 Wanneer één van de rode signaallampjes gaat branden moet een akoestisch signaal klinken. Voor de verschillende
      lampjes kan hetzelfde akoestische alarmsignaal worden gegeven. Het geluidsniveau van dit signaal moet ten minste 3
      dB(A) meer bedragen dan het maximaal heersende geluidsniveau ter plaatse van de stuurstelling.

      7 Het akoestische signaal mag kunnen worden uitgezet na het constateren van het uitvallen of van de storing. Dit
      mag geen nadelige invloed hebben op het functioneren van het signaal voor andere storingen. De rode signaallampjes
      mogen echter pas na het verhelpen van de storing uitgaan.

      8 De signalerings- en controle-instrumenten moeten bij het uitvallen van de voeding automatisch op een andere
      energiebron worden geschakeld.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel7.03
  - number: '7.04'
    text: |-
      1 De bediening en de controle van de voortstuwingsmotoren en van de stuurinrichtingen moet vanaf de stuurstelling
      mogelijk zijn.

      Voortstuwingsmotoren die zijn voorzien van een vanaf de stuurstelling bedienbare koppeling, of die een vanaf de
      stuurstelling bedienbare verstelbare schroef aandrijven, hoeven slechts in de machinekamer aan- en uitgezet te
      kunnen worden.

      Voortstuwingsmotoren die zijn voorzien van een vanaf de stuurstelling bedienbare koppeling, of die een vanaf de
      stuurstelling bedienbare verstelbare schroef aandrijven, hoeven slechts in de machinekamer aan- en uitgezet te
      kunnen worden.

      2 De bediening van elke voortstuwingsmotor moet kunnen geschieden door één enkele hefboom. De hefboom moet volgens
      een cirkelboog, welke zich bevindt in een verticaal vlak dat nagenoeg evenwijdig is aan de lengte-as van het schip
      kunnen worden bewogen. Het verplaatsen van deze hefboom in de richting van het voorschip moet het schip vooruit
      doen varen, terwijl verplaatsing van de hefboom in de richting van het achterschip het schip achteruit doet varen.
      Aan weerszijde van de nulstand van de hefboom vindt het koppelen of omkeren plaats. In de nulstand moet de hefboom
      vanzelf blijven staan.

      3 Bij éénmansstuurstellingen voor het varen op radar moet de richting van de door de aandrijving op het schip
      werkende voortstuwingskracht alsmede het toerental van de schroeven of voortstuwingsmotoren worden aangegeven.

      4 De in de [artikelen 6.07, tweede lid][ref1], [8.03, tweede lid][ref2] en [8.05, elfde lid][ref3], voorgeschreven
      signalerings- en controle-instrumenten moeten in de stuurstelling zijn aangebracht.

      5 Bij éénmansstuurstellingen voor het varen op radar moet de besturing van het schip plaats vinden door middel
      van een hefboom. Deze hefboom moet gemakkelijk met de hand bediend kunnen worden. De hoek van de hefboom moet
      overeenkomen met de stand van de roerbladen ten opzichte van de lengte-as van het schip. De hefboom moet in
      onverschillig welke positie kunnen worden losgelaten, zonder dat dan de stand van de roerbladen verandert. De
      nulstand van de hefboom moet duidelijk voelbaar zijn.

      6 Wanneer het schip is voorzien van koproeren of bijzondere roeren (b.v. voor achteruitvaren), moeten deze bij
      éénmansstuurstellingen voor het varen op radar door speciale hefbomen kunnen worden bediend, die aan de in het
      vijfde lid genoemde toepasselijke eisen voldoen.

      Dit geldt ook wanneer bij samenstellen de roerinstallaties van andere vaartuigen dan het voor het voeren van het
      samenstel gebruikte vaartuig worden gebruikt.

      7 Bij het gebruik van stuurautomaten moet het bedieningsorgaan voor het instellen van de draaisnelheid in elke
      willekeurige positie kunnen worden losgelaten zonder dat daardoor de ingestelde draaisnelheid verandert.

      Het bedieningsorgaan moet een zodanige zwenkhoek hebben dat voldoende nauwkeurigheid van de instelling is
      gewaarborgd. De nulstand moet voelbaar van andere standen zijn te onderscheiden. De schaalverdeling moet traploos
      regelbaar kunnen worden verlicht.

      8 Inrichtingen voor afstandsbediening van de gehele stuurinrichting moeten vast ingebouwd zijn en zodanig zijn
      geïnstalleerd dat de gekozen vaarrichting duidelijk zichtbaar is. Wanneer zij uitgeschakeld kunnen worden, moeten
      zij voorzien zijn van een aanwijzer die aangeeft of de inrichting "aan" of "uit" is. De opstelling en bediening van
      de verschillende onderdelen van deze inrichtingen moeten overeenkomen met de functie daarvan.

      Voor aanvullende installaties van de stuurinrichting, zoals boegschroefinstallaties, zijn niet vast ingebouwde
      afstandsbedieningen toegestaan wanneer door een prioriteitsschakeling in het stuurhuis de bediening van de
      aanvullende installatie te allen tijde kan worden overgenomen.

      9 Bij roerpropeller-, waterstraal-, cycloïdaalschroef- en boegschroef-installaties zijn gelijkwaardige
      bedieningsapparatuur en signalerings- en controle-instrumenten toegestaan.

      Voor deze installaties zijn het eerste tot en met achtste lid met inachtneming van de bijzondere kenmerken en de
      gekozen opstelling van de genoemde aktieve stuurinrichtingen en de voorstuwingsinrichtingen van overeenkomstige
      toepassing. Voor alle installaties moet overeenkomstig hun stand kunnen worden afgelezen ofwel de richting van de
      op het schip werkende voortstuwing, ofwel de richting van de straal.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel6.07
      [ref2]: https://wetten.overheid.nl/BWBR0007858#Artikel8.03
      [ref3]: https://wetten.overheid.nl/BWBR0007858#Artikel8.05
