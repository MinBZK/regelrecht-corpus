  - number: '2.06'
    text: |-
      1 De geldigheidsduur van de volgens de bepalingen van dit reglement opgemaakte certificaten van onderzoek bedraagt
      ingeval van nieuwbouw:

      a. 5 jaren voor passagiersschepen;

      b. 10 jaren voor alle andere vaartuigen.

      In met redenen omklede gevallen kan de Commissie van Deskundigen een kortere geldigheidsduur bepalen. De
      geldigheidsduur wordt in het certificaat aangetekend.

      2 Voor vaartuigen die reeds vóórdat het onderzoek plaatsvindt in bedrijf waren, wordt de geldigheidsduur van het
      certificaat van onderzoek voor elk geval afzonderlijk, afhankelijk van de uitkomsten van het onderzoek, door de
      Commissie van Deskundigen bepaald. Deze geldigheidsduur mag evenwel niet langer zijn dan bij het eerste lid is
      voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel2.06
  - number: '2.07'
    text: |-
      1 Elke verandering van naam, overgang van de eigendom, iedere hermeting van een vaartuig alsmede elke wijziging
      van het officiële scheepsnummer, van de te boekstelling of van de thuishaven moet door de eigenaar of zijn
      vertegenwoordiger ter kennis worden gebracht van een Commissie van Deskundigen. Hij moet daarbij tevens het
      certificaat van onderzoek aan deze Commissie ter wijziging voorleggen.

      2 Alle aantekeningen in of wijzigingen van het certificaat van onderzoek, voorzien in dit reglement, in het
      Rijnvaartpolitiereglement en in andere, in gemeen overleg door de Oeverstaten en België vastgestelde bepalingen,
      kunnen door iedere Commissie van Deskundigen worden aangebracht.

      3 Wanneer een Commissie van Deskundigen in het certificaat een wijziging aanbrengt of daarin een aantekening stelt,
      moet zij daarvan kennis geven aan de Commissie die het betrokken certificaat heeft afgegeven.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel2.07
  - number: '2.08'
    text: |-
      1 Na iedere ingrijpende verandering of reparatie van een vaartuig die van invloed is op de hechtheid van de bouw,
      de vaar- of manoeuvreereigenschappen of op de kenmerkende eigenschappen moet het vaartuig, voor het weer in de
      vaart komt, aan een Commissie van Deskundigen worden aangeboden, teneinde aan een bijzonder onderzoek te worden
      onderworpen.

      2 De Commissie van Deskundigen die het bijzonder onderzoek verricht, stelt, afhankelijk van de resultaten van dit
      onderzoek, de geldigheidsduur van het certificaat van onderzoek vast. Deze periode mag niet langer zijn dan de
      lopende geldigheidsduur van het certificaat van onderzoek.

      De geldigheidsduur wordt aangetekend in het certificaat van onderzoek en dient ter kennis te worden gebracht van de
      Commissie van Deskundigen die het certificaat heeft afgegeven.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel2.08
  - number: '2.09'
    text: |-
      1 Vóór afloop van de geldigheidsduur van het certificaat van onderzoek moet het vaartuig aan een aanvullend
      onderzoek worden onderworpen.

      2 Bij wijze van uitzondering kan de Commissie van Deskundigen op een met redenen omkleed verzoek van de eigenaar
      of zijn vertegenwoordiger de geldigheidsduur van het certificaat van onderzoek zonder aanvullend onderzoek met
      ten hoogste één jaar verlengen. Deze verlenging wordt schriftelijk gegeven en moet zich aan boord van het vaartuig
      bevinden.

      3 De Commissie van Deskundigen die het aanvullend onderzoek verricht, stelt afhankelijk van de resultaten daarvan
      de nieuwe geldigheidsduur van het certificaat vast. Hierbij wordt [artikel 2.06][ref1] in acht genomen.

      De geldigheidsduur wordt aangetekend in het certificaat van onderzoek en dient ter kennis te worden gebracht van de
      Commissie van Deskundigen die het certificaat heeft afgegeven.

      4 Indien in plaats van verlenging van de geldigheidsduur het certificaat van onderzoek door een nieuw certificaat
      wordt vervangen, dient het oude certificaat te worden teruggezonden aan de Commissie van Deskundigen die het heeft
      afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel2.06
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel2.09
    references:
      - id: ref1
        bwb_id: BWBR0007858
        artikel: '2.06'
        hoofdstuk: '2'
  - number: '2.10'
    text: |-
      De eigenaar van een vaartuig of zijn vertegenwoordiger kan op elk moment om een vrijwillig onderzoek verzoeken.

      Aan dit verzoek om een onderzoek dient gevolg te worden gegeven.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel2.10
  - number: '2.11'
    text: |-
      1 Wanneer een der bevoegde autoriteiten, belast met de zorg voor de veiligheid van de scheepvaart op de Rijn, van
      mening is dat een vaartuig gevaar kan opleveren voor de zich aan boord bevindende personen of voor de scheepvaart,
      kan zij gelasten dat het vaartuig door een Commissie van Deskundigen wordt onderzocht.

      2 De eigenaar van het vaartuig draagt slechts dan de kosten van het onderzoek, wanneer de Commissie van Deskundigen
      erkent dat de mening van de in het eerste lid bedoelde autoriteit gegrond is.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel2.11
  - number: '2.12'
    text: |-
      1 De Commissie van Deskundigen kan er geheel of gedeeltelijk van afzien te onderzoeken of een vaartuig voldoet aan
      de bepalingen van [Deel II][ref1] en van [artikel 23.09][ref2] voor zover uit een geldige verklaring, afgegeven
      door een classificatiebureau dat door de regeringen van alle Oeverstaten en van België is erkend, blijkt dat het
      vaartuig geheel of gedeeltelijk aan die bepalingen voldoet.

      2 Een verklaring van een classificatiebureau, dan wel – voor zover dit volgens dit reglement voor bepaalde
      onderdelen van de uitrusting is toegelaten – van een andere instantie, mag door de bevoegde autoriteit slechts
      dan worden erkend, indien dat classificatiebureau of die andere instantie verklaart dat het de bepalingen van de
      richtlijnen bedoeld in [artikel 1.07][ref3] in acht heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007858
      [ref2]: https://wetten.overheid.nl/BWBR0007858#Artikel23.09
      [ref3]: https://wetten.overheid.nl/BWBR0007858#Artikel1.07
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0007858
      - id: ref2
        bwb_id: BWBR0007858
        artikel: '23.09'
        hoofdstuk: '23'
      - id: ref3
        bwb_id: BWBR0007858
        artikel: '1.07'
        hoofdstuk: '1'
  - number: '2.13'
    text: |-
      1 Wanneer een Commissie van Deskundigen tijdens een onderzoek bemerkt dat een vaartuig of de uitrusting
      daarvan ernstige gebreken vertoont, en dat daardoor de veiligheid van de zich aan boord bevindende personen
      of de scheepvaart in gevaar wordt gebracht, dient het certificaat te worden ingehouden en dient de Commissie
      die het heeft afgegeven hiervan onverwijld in kennis te worden gesteld. Bij duwbakken en schepen bestemd voor
      bouwwerkzaamheden dient ook de in het [Rijnvaartpolitiereglement][ref1] voorgeschreven metalen plaat te worden
      ingehouden.

      Wanneer de Commissie van Deskundigen heeft geconstateerd dat de gebreken zijn verholpen wordt het certificaat aan
      de eigenaar of zijn vertegenwoordiger teruggegeven.

      Dit constateren en de teruggave van het certificaat kunnen op verzoek van de eigenaar of zijn vertegenwoordiger
      door tussenkomst van een andere Commissie geschieden.

      Wanneer de Commissie van Deskundigen die het certificaat heeft ingehouden vermoedt dat de gebreken niet binnen
      afzienbare tijd worden verholpen, wordt het certificaat gezonden aan de Commissie van Deskundigen die het heeft
      afgegeven of, in geval van verlenging, die het het laatst heeft verlengd.

      2 Wanneer een vaartuig definitief is opgelegd of gesloopt, moet de eigenaar het certificaat terugzenden aan de
      Commissie van Deskundigen die het heeft afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006923
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0006923
  - number: '2.14'
    text: |-
      1 Wanneer een certificaat van onderzoek verloren is gegaan, moet hiervan kennis worden gegeven aan de Commissie van
      Deskundigen die het heeft afgegeven.

      Deze Commissie geeft dan een duplicaat van het certificaat af, dat als zodanig is gewaarmerkt.

      2 Wanneer een certificaat van onderzoek onleesbaar of om enige andere reden onbruikbaar is geworden, moet de
      eigenaar van het vaartuig of zijn vertegenwoordiger het certificaat terugzenden aan de Commissie van Deskundigen
      die het heeft afgegeven; deze geeft dan een duplicaat af, overeenkomstig het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel2.14
  - number: '2.15'
    text: |-
      1 Onverminderd [artikel 2.11, tweede lid][ref1], draagt de eigenaar van een vaartuig of zijn vertegenwoordiger
      de kosten die voortvloeien uit het onderzoek en de afgifte van het certificaat van onderzoek, overeenkomstig
      het geldende tarief, dat door elk der Oeverstaten en België wordt vastgesteld. Er mag hierbij geen onderscheid
      worden gemaakt uit hoofde van het land van teboekstelling van het vaartuig of de nationaliteit of woonplaats van
      de eigenaar.

      2 De Commissie van Deskundigen kan vóór het onderzoek een voorschot verlangen dat niet hoger mag zijn dan het
      vermoedelijke bedrag van de kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel2.11
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0007858
        artikel: '2.11'
        hoofdstuk: '2'
  - number: '2.16'
    text: |-
      De Commissie van Deskundigen kan personen, die kunnen aantonen daar om gegronde redenen belang bij te hebben,
      kennis laten nemen van de inhoud van het certificaat van onderzoek van een vaartuig, en op hun kosten als zodanig
      aangeduide uittreksels of gewaarmerkte afschriften van het certificaat verstrekken.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel2.16
  - number: '2.17'
    text: |-
      1 De Commissies van Deskundigen geven de door hen afgegeven certificaten een volgnummer. Zij houden een register
      bij van alle door hen afgegeven certificaten overeenkomstig [bijlage C][ref1].

      2 De Commissies van Deskundigen bewaren de minuut of een afschrift van elk certificaat dat zij hebben afgegeven.
      Daarop tekenen zij alle aantekeningen en wijzigingen, alsmede ongeldigheidsverklaringen en vervangingen van de
      certificaten aan.


      [ref1]: https://wetten.overheid.nl/BWBR0007858
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0007858
  - number: '2.18'
    text: |-
      1 De Commissie van Deskundigen die het certificaat van onderzoek afgeeft voor een vaartuig dat is teboekgesteld in
      één der Oeverstaten of België of waarvan de thuishaven in één van die landen is gelegen, vult op dit certificaat
      het officiële scheepsnummer in, dat is toegekend door de bevoegde instantie van het land waarin zijn plaats van
      teboekstelling of zijn thuishaven is gelegen.

      Aan vaartuigen die niet uit één der Oeverstaten of België afkomstig zijn wordt het officiële scheepsnummer, dat
      op het certificaat van onderzoek moet worden ingevuld, toegekend door de bevoegde instantie van de staat waarin de
      Commissie van Deskundigen is gevestigd die dit certificaat afgeeft.

      Deze bepalingen zijn niet van toepassing op zeeschepen en pleziervaartuigen.

      2 Het officiële scheepsnummer bestaat uit zeven Arabische cijfers. De eerste twee cijfers duiden het land aan en de
      instantie die het officiële scheepsnummer heeft toegekend, overeenkomstig de volgende indeling:








                    Frankrijk


                    01–19




                    Nederland


                    20–39




                    Duitsland


                    40–59




                    België


                    60–69




                    Zwitserland


                    70–79




                    overige landen


                    80–99






      De volgende vijf cijfers van het officiële scheepsnummer komen overeen met het volgnummer van het register dat door
      de bevoegde instantie wordt bijgehouden. Met het oog op technische controles kan het officiële scheepsnummer worden
      gevolgd door een kleine letter. Bij vaartuigen die noch in een Oeverstaat noch in België zijn teboekgesteld of daar
      hun thuishaven hebben, duiden de eerste twee cijfers het land aan waar de thuishaven van het vaartuig is gelegen.
      Deze worden door de Centrale Commissie voor de Rijnvaart vastgesteld. De volgende twee cijfers duiden het land aan
      en de instantie die het officiële scheepsnummer heeft toegekend.

      3 Het officiële scheepsnummer verandert tijdens de gehele levensduur van het vaartuig niet. Wanneer evenwel het
      vaartuig in een ander land wordt teboekgesteld of wanneer zijn thuishaven in een ander land komt te liggen, wordt
      het officiële scheepsnummer ongeldig. Het certificaat van onderzoek moet dan worden aangeboden aan een Commissie
      van Deskundigen, die het ongeldige officiële scheepsnummer doorhaalt en in voorkomend geval het nieuwe officiële
      scheepsnummer invult dat door de bevoegde instantie is toegekend.

      4 De eigenaar van het vaartuig of zijn vertegenwoordiger moet de toekenning van het officiële scheepsnummer bij de
      bevoegde instantie aanvragen. Bij schepen als bedoeld in [artikel 2.01, eerste lid onder ][ref1] moet hij tevens
      het officiële scheepsnummer, dat in het certificaat van onderzoek is ingevuld, daarop doen aanbrengen, alsmede dit
      doen verwijderen wanneer het niet meer geldig is.


