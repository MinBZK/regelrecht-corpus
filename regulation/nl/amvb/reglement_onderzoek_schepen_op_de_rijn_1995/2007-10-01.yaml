  - number: '17.03'
    text: |-
      1 Op drijvende werktuigen waarop tijdens het werk personen aanwezig zijn is de aanwezigheid van een algemene
      alarminstallatie vereist. Het alarmsignaal moet zich duidelijk onderscheiden van andere signalen en in alle
      verblijven en op alle werkplekken een geluidsdrukniveau doen ontstaan dat ten minste 5 dB(A) hoger is dan het ter
      plaatse overheersende maximale geluidsniveau. De alarminstallatie moet in het stuurhuis en op de belangrijkste
      bedieningspunten in werking kunnen worden gesteld.

      2 Werkinrichtingen moeten voor hun belasting voldoende sterkte hebben en zij moeten voldoen aan de nationale
      voorschriften van één van de Oeverstaten of van België.

      3 De kantelingsstabiliteit en de sterkte van de werkinrichtningen en eventueel de bevestiging daarvan moeten
      zodanig zijn dat zij bestand zijn tegen belastingen door te verwachten slagzij, trim en bewegingen van het drijvend
      werktuig.

      4 Indien lasten met heftoestellen omhoog worden gebracht, dient de uit stabiliteit en sterkte resulterende
      maximaal toelaatbare last duidelijk te worden aangegeven op een bord aan dek en op de bedieningspunten. Indien het
      hefvermogen door het aankoppelen van extra drijvende voorwerpen kan woren vergroot, moeten de waarden met en zonder
      extra drijvende voorwerpen zijn vermeld.

      5 Bij drijvende werktuigen die zijn toegelaten om te worden gebruikt aan de kust of op zee wordt het certificaat
      van onderzoek volgens bijlage B, indien zij dat niet hebben, vervangen door een certificaat volgens bijlage G.
      Daarbij dient te zijn voldaan aan [hoofdstuk 20][ref1] met inachtneming van [hoofdstuk 17][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Hoofdstuk20
      [ref2]: https://wetten.overheid.nl/BWBR0007858#Hoofdstuk17
