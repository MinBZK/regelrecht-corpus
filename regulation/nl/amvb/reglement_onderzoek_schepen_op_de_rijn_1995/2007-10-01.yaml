      1 Op vaartuigen waarvoor vanaf 1 januari 1995 voor het eerst een certificaat van onderzoek als bedoeld in dit
      reglement is afgegeven zijn de volgende bepalingen van toepassing, tenzij zij op 31 december 1994 in aanbouw of in
      ombouw waren.

      2 Deze vaartuigen moeten voldoen aan de versie van het Reglement onderzoek schepen op de Rijn die van kracht is op
      de dag waarop het certificaat van onderzoek is afgegeven. In afwijking hiervan mogen passagiersschepen, waaraan met
      ingang van 1 januari 2006 en vóór 1 januari 2007 voor het eerst een certificaat van onderzoek overeenkomstig dit
      reglement wordt afgegeven, voldoen aan de op 31 december 2005 geldende voorschriften van [hoofdstuk 15][ref1] van
      dit reglement.

      3 Deze vaartuigen moeten aan de voorschriften, die na de eerste afgifte van hun certificaat van onderzoek van
      kracht zijn geworden, volgens de in de onderstaande tabel vermelde overgangsbepalingen worden aangepast.

      4 [Artikel 24.04, vierde en vijfde lid][ref2], zijn van overeenkomstige toepassing.

      5 In de onderstaande tabel betekent:

        - «N.V.O.»: de betreffende bepaling is niet van toepassing op reeds in bedrijf zijnde vaartuigen, tenzij de
      betreffende delen worden vervangen of omgebouwd, dat wil zeggen dat deze bepaling slechts van toepassing is op
      Nieuwbouw, bij Vervanging of bij Ombouw van de betreffende delen of sectoren. Worden bestaande delen vervangen door
      delen welke in technische zin en bouwwijze gelijk zijn, dan wordt dit niet beschouwd als vervanging «V» volgens
      deze overgangsbepalingen.
        - «Verlenging certificaat»: aan het voorschrift moet zijn voldaan bij de eerstvolgende verlenging van de
      geldigheidsduur van het certificaat van onderzoek na de daarop aangegeven datum.

