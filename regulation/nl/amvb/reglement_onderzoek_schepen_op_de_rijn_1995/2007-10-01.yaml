      - id: ref2
        bwb_id: BWBR0007858
  - number: 8a.04
    text: |-
      1 De bevoegde autoriteit, waarbij de aanvraag wordt ingediend, verleent de typegoedkeuring voor alle motortypes,
      motorfamilies of motorgroepen die overeenstemmen met de gegevens van de informatiedossiers en aan de voorschriften
      van dit hoofdstuk voldoen.

      2 De bevoegde autoriteit vult voor ieder motortype en iedere motorfamilie of motorgroep waarvoor zij
      goedkeuring verleent alle desbetreffende onderdelen van het certificaat van typegoedkeuring in, waarvan het
      model is opgenomen in [bijlage J, deel III][ref1]; zij stelt de inhoudsopgave van het informatiepakket op of
      verifieert deze. De certificaten van typegoedkeuring moeten worden genummerd volgens het systeem aangegeven in
      [bijlage J, deel IV][ref2]. Het ingevulde certificaat van typegoedkeuring en de daarbij behorende bijlagen worden
      aan de aanvrager toegezonden.

      3 Indien de goed te keuren motor zijn functie slechts vervult of bijzondere kenmerken slechts vertoont in
      combinatie met andere onderdelen van het vaartuig waarin hij zal worden ingebouwd, en om die reden de naleving van
      één of meer eisen slechts kan worden geverifieerd wanneer de goed te keuren motor in combinatie met andere echte
      of gesimuleerde onderdelen van het vaartuig functioneert, moet de geldigheid van de typegoedkeuring van deze motor
      (motoren) dienovereenkomstig worden beperkt. In dergelijke gevallen moeten in het certificaat van typegoedkeuring
      van een motortype, van een motorfamilie of van een motorgroep de eventuele beperkingen in het gebruik alsmede
      eventuele voorwaarden waaraan bij montage moet worden voldaan, worden vermeld.

      4 Elke bevoegde autoriteit zendt:

      a. bij iedere wijziging aan de andere bevoegde autoriteiten een lijst, die de in [bijlage J, deel V][ref3],
      vermelde gegevens bevat, van de goedkeuringen van de motortypes, de motorfamilies en de motorgroepen die zij in de
      betrokken periode heeft verleend, geweigerd of ingetrokken;

      b. op verzoek van een andere bevoegde autoriteit een kopie van het certificaat van typegoedkeuring van het
      motortype, de motorfamilie of de motorgroep al dan niet met het informatiepakket van ieder motortype en iedere
      motorfamilie of motorgroep waarvoor zij goedkeuring heeft verleend, geweigerd of ingetrokken, en zo nodig de
      lijst van de motoren die zijn geproduceerd in overeenstemming met de verleende typegoedkeuringen, omschreven in
      [artikel 8a.06, derde lid][ref4], met de gegevens, bedoeld in [bijlage J, deel VI][ref5].

      5 Elke bevoegde autoriteit zendt jaarlijks en bovendien bij ontvangst van een daartoe strekkend verzoek aan
      het secretariaat van de Centrale Commissie voor de Rijnvaart een kopie van het in [bijlage J, deel VII][ref6],
      bedoelde technische gegevensformulier betreffende de motortypes, motorfamilies en motorgroepen die sinds de laatste
      kennisgeving zijn goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0007858
      [ref2]: https://wetten.overheid.nl/BWBR0007858
