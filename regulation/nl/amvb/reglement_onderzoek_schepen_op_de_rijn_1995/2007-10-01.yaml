      A' het lateraal oppervlak van het geladen schip boven water [m²];

      D' het deplacement van het geladen schip [t];

      I de afstand van het zwaartepunt van het lateraal oppervlak A' boven de waterlijn [m];

      T' de diepgang van het geladen schip [m].

      e. De arm van het moment veroorzaakt door de vrije vloeistofoppervlakken van regen- en restwater in het laadruim of
      de dubbele bodem wordt berekend volgens de formule:

      .

      In deze formule betekent:

      c coëfficiënt (c = 0,015) [t/m2]

      b de breedte van het desbetreffende ruim of ruimgedeelte [m];

      l de lengte van het desbetreffende ruim of ruimgedeelte [m];

      D' het deplacement van het geladen schip [t].

      f. Voor elke beladingstoestand moet met de halve voorraad aan brandstof en drinkwater worden gerekend.

