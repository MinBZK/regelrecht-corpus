  - number: '21.01'
    text: |-
      Op pleziervaartuigen zijn voor wat betreft bouw, uitrusting en bemanning slechts de
      [artikelen 21.02 tot en met 21.03][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel21.02
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel21.01
    references:
      - id: ref1
        bwb_id: BWBR0007858
        artikel: '21.02'
        hoofdstuk: '21'
  - number: '21.02'
    text: |-
      1 Op pleziervaartuigen zijn van toepassing:

      a. van [hoofdstuk 3][ref1]:

      de [artikelen 3.01][ref2], [3.02, eerste lid, onderdeel a, en tweede lid][ref3],
      [3.03, eerste lid, onderdeel a, en zesde lid][ref4], en [3.04, eerste lid][ref5];

      b. [hoofdstuk 5][ref6];

      c. van [hoofdstuk 6][ref7]:

      de [artikelen 6.01, eerste lid][ref8], en [6.08][ref9];

      d. van [hoofdstuk 7][ref10]:

      de [artikelen 7.01, eerste en tweede lid][ref11], [7.02][ref12], [7.03, eerste en tweede lid][ref13],
      [7.04, eerste lid][ref14], en [7.05, tweede lid][ref15], en [artikel 7.13][ref16] voor pleziervaartuigen met een
      éénmansstuurstand voor het varen met behulp van radar;

      e. van [hoofdstuk 8][ref17]:

      de [artikelen 8.01, eerste en tweede lid][ref18], [8.02, eerste en tweede lid][ref19],
      [8.03, eerste en derde lid][ref20], [8.04][ref21], [8.05, eerste tot en met tiende lid en dertiende lid][ref22],
      [8.06, eerste, tweede, vijfde, zevende en tiende lid][ref23], [8.07, eerste lid][ref24], en [8.08][ref25];

      f. van [hoofdstuk 9][ref26]: [artikel 9.01, eerste lid][ref27], van overeenkomstige toepassing;

      g. van [hoofdstuk 10][ref28]:

      de [artikelen 10.01, tweede, derde en vijfde tot en met veertiende lid][ref29],
      [10.02, eerste lid, onderdelen a, b en c, en tweede lid, onderdelen a en e tot en met h][ref30], en
      [10.03, eaerste lid, onderdelen a, b en d][ref31]; er moeten echter ten minste twee blustoestellen aan boord
      aanwezig zijn; en voorts de [artikelen 10.03, tweede tot en met vijfde lid][ref32], en [10.05][ref33];

      h. [hoofdstuk 13][ref34];

      i. [hoofdstuk 14][ref35].

      2 In het geval van pleziervaartuigen, waarop [richtlijn nr. 94/25/EG](31994L0025) van het Europees Parlement en de
      Raad van de Europese Unie van 16 juni 1994 inzake de onderlinge aanpassing van de wettelijke en bestuursrechtelijke
      bepalingen van de Lidstaten met betrekking tot pleziervaartuigen (PbEG L 164) van toepassing is, hebben het eerste
      onderzoek en het aanvullend onderzoek slechts betrekking op:

      a. [artikel 6.08][ref36], in het geval dat een bochtaanwijzer aanwezig is;

      b. de [artikelen 7.01, tweede lid][ref37], [7.02][ref38], en [7.03, eerste lid][ref39], alsmede
      [artikel 7.13][ref40], in het geval dat er sprake is van een éénmansstuurstelling voor het varen op radar;

      c. de [artikelen 8.01, tweede lid][ref41], [8.02, eerste lid][ref42], [8.03, derde lid][ref43],
      [8.05, vijfde lid][ref44], [8.06, tweede lid][ref45], en [8.08][ref46];

      d. [artikel 10.01, tweede, derde, zesde en veertiende lid][ref47],
      [artikel 10.02, eerste lid, onderdelen b en c, en tweede lid, onderdelen a en e tot en met h][ref48],
      [artikel 10.03, eerste lid, onderdelen b en d, en tweede tot en met zesde lid][ref49], en [artikel 10.05][ref50];

      e. [hoofdstuk 13][ref51];

      f. van [hoofdstuk 14][ref52]:

      1°. [artikel 14.12][ref53];

      2°. [artikel 14.13][ref54], waarbij de keuring na ingebruikneming van de vloeibaargasinstallatie overeenkomstig
      de eisen van de richtlijn geschiedt en aan de Commissie van Deskundigen hierover een verslag van de keuring moet
      worden uitgebracht;

      3°. de [artikelen 14.14][ref55] en [14.15][ref56] met dien verstande, dat de vloeibaargasinstallatie aan de eisen
      van de richtlijn moet beantwoorden;

      4°. [hoofdstuk 14][ref57] in zijn geheel, indien de vloeibaargasinstallatie wordt ingebouwd nadat het
      pleziervaartuig in het verkeer is gebracht.


