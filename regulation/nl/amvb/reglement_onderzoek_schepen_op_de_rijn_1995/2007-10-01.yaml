  - number: '18.01'
    text: |-
      Schepen bestemd voor bouwwerkzaamheden, die als zodanig in het certificaat van onderzoek overeenkomstig
      [bijlage B][ref1] zijn aangeduid, mogen buiten werkterreinen slechts onbeladen varen. Deze voorwaarde dient in het
      certificaat van onderzoek te worden vermeld.

      Hiertoe moeten deze schepen bestemd voor bouwwerkzaamheden beschikken over een verklaring van de bevoegde
      autoriteit over de duur van de werkzaamheden en de begrenzing van het werkterrein waarop het schip mag worden
      gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0007858
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel18.01
    references:
      - id: ref1
        bwb_id: BWBR0007858
  - number: '18.02'
    text: |-
      Voor zover in dit hoofdstuk niets anders is bepaald, zijn met betrekking tot de bouw en de uitrusting van schepen
      bestemd voor bouwwerkzaamheden de [hoofdstukken 3 tot en met 14][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel18.02
    references:
      - id: ref1
        bwb_id: BWBR0007858
        hoofdstuk: '3'
  - number: '18.03'
    text: |-
      1 a. [Artikel 3.03, eerste lid][ref1], is van overeenkomstige toepassing;

      b. De [hoofdstukken 5][ref2] en [6][ref3] zijn van overeenkomstige toepassing, indien het schip is voorzien van
      eigen mechanische middelen tot voortbeweging;

      c. [Artikel 10.02, tweede lid onder a en b][ref4], is van overeenkomstige toepassing;

      d. De Commissie van Deskundigen kan van de toepassing van de overige bepalingen met betrekking tot de bouw,
      inrichting en uitrusting uitzonderingen toelaten, voor zover in het betreffende geval een zelfde mate van
      veiligheid is aangetoond.

      2 De Commissie van Deskundigen kan afzien van de toepassing van de volgende bepalingen:

      a. [Artikel 8.06, tweede tot en met achtste lid][ref5], wanneer geen bemanning is voorgeschreven;

      b. [Artikel 10.01, eerste en derde lid][ref6], wanneer het schip bestemd voor bouwwerkzaamheden door
      middel van werkankers of palen veilig kan worden verankerd. Een schip bestemd voor bouwwerkzaamheden
      met eigen mechanische middelen tot voortbeweging moet echter ten minste één anker hebben als bedoeld in
      [artikel 10.01, eerste lid][ref7], waarbij de coëfficiënt k = 45 en voor T de kleinste hoogte aan de zijde wordt
      aangenomen;

      c. [Artikel 10.02, eerste lid onder c][ref8], wanneer het schip bestemd voor bouwwerkzaamheden niet over eigen
      mechanische middelen tot voortbeweging beschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel3.03
