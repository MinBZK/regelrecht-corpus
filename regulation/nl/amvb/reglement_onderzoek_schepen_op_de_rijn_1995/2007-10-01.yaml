  - number: '16.03'
    text: |-
      Op vaartuigen die bestemd zijn om een gekoppeld samenstel voort te bewegen moeten bolders of gelijkwaardige
      inrichtingen aanwezig zijn die het door hun aantal en opstelling mogelijk maken een afdoende verbinding tot stand
      te brengen tussen de gekoppelde vaartuigen.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel16.03
  - number: '16.04'
    text: |-
      Vaartuigen die bestemd zijn om te worden voortbewogen in een samenstel moeten zijn voorzien van hiervoor geschikte
      koppelingsinrichtingen, bolders of gelijkwaardige inrichtingen die door hun aantal en opstelling een afdoende
      verbinding met het andere vaartuig of de andere vaartuigen van het samenstel waarborgen.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel16.04
  - number: '16.05'
    text: |-
      1 Vaartuigen die moeten kunnen worden gebruikt om te slepen moeten aan de volgende eisen voldoen:

      a. De sleepinrichtingen moeten zo zijn aangebracht dat door het gebruik daarvan de veiligheid van het schip, de
      bemanning of de lading niet in gevaar komt;

      b. Assisterende en slepende schepen moeten zijn uitgerust met een vanuit het stuurhuis veilig te bedienen
      sleephaak; dit geldt niet wanneer op grond van de bouwwijze of door andere voorzieningen kenteren niet mogelijk is;

      c. Als sleepinrichting moeten sleeplieren of een sleephaak aanwezig zijn. De sleepinrichtingen moeten vóór de
      schroeven zijn aangebracht. Dit geldt niet voor sleepboten die met het aandrijforgaan worden gestuurd, zoals een
      roerpropeller of cycloïdaalschroef;

      d. In afwijking van *c* is bij schepen die uitsluitend worden gebruikt voor het slepen van motorschepen in de zin
      van het Rijnvaartpolitiereglement ook een sleepinrichting zoals bolders of gelijkwaardige inrichtingen voldoende.
      Het onder *b* gestelde is van overeenkomstige toepassing;

      e. Wanneer de sleeptrossen op een achterschip zouden kunnen blijven haken dienen daar sleepbogen met draadvangers
      te zijn aangebracht.

      2 Schepen met een lengte L van meer dan 86 m mogen niet worden toegelaten om afvarend te slepen.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel16.05
  - number: '16.06'
    text: |-
      1 Met het oog op de toelating als duwboot of motorschip voor het voortbewegen van vaartuigen in een hecht samenstel
      en met het oog op het plaatsen van een desbetreffende aantekening in het certificaat van onderzoek bepaalt de
      Commissie van Deskundigen welke formaties haar voor onderzoek moeten worden getoond en laat zij proefvaarten
      als bedoeld in [artikel 5.02][ref1] uitvoeren met het samenstel in de verzochte formatie(s) die haar het meest
      ongunstig voorkomen. Daarbij moet dit samenstel aan de [artikelen 5.02 tot en met 5.10][ref2] voldoen.

      De Commissie van Deskundigen vergewist zich ervan of een hechte verbinding van alle vaartuigen van het samenstel
      bij de volgens [hoofdstuk 5][ref3] voorgeschreven manoeuvres verzekerd is.

      2 Indien tijdens de in het eerste lid bedoelde proefvaarten bijzondere inrichtingen op de in het
      samenstel voortbewogen vaartuigen (zoals de stuurinrichting, de aandrijf- of manoeuvreerinrichtingen of de
      scharnierkoppelingen) worden gebruikt om te voldoen aan de [artikelen 5.02 tot en met 5.10][ref4], moet in
      het certificaat van onderzoek van het vaartuig dat het samenstel voortbeweegt worden vermeld: de formatie, de
      positie, de naam en het officiële scheepsnummer van de toegelaten vaartuigen die over deze bijzondere inrichtingen
      beschikken.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel5.02
      [ref2]: https://wetten.overheid.nl/BWBR0007858#Artikel5.02
      [ref3]: https://wetten.overheid.nl/BWBR0007858#Hoofdstuk5
      [ref4]: https://wetten.overheid.nl/BWBR0007858#Artikel5.02
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel16.06
