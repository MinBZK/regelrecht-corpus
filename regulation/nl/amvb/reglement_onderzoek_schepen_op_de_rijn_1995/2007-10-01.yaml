  - number: '17.07'
    text: |-
      1 Bewezen dient te worden dat bij de tijdens het in bedrijf zijn van de installaties en tijdens de vaart optredende
      belastingen voldoende resterende veiligheidsafstand en voldoende resterend vrijboord aanwezig zijn. Daarbij mag de
      som van de hoeken tussen slagzij en trim niet meer dan 10° bedragen en mag de bodem van de scheepsromp niet boven
      het water uitkomen.

      2 Het bewijs van stabiliteit moet de volgende gegevens en bescheiden bevatten:

      a. tekeningen op schaal van de drijvende voorwerpen en de werkinrichtingen alsmede de voor het bewijs van
      stabiliteit vereiste gedetailleerde gegevens, zoals de inhoud van tanks en openingen die naar het binnenste van het
      schip voeren;

      b. hydrostatische gegevens of krommen;

      c. krommen van de armen van statische stabiliteit, voor zover vereist ingevolge het vijfde lid of
      [artikel 17.08][ref1];

      d. beschrijving van de bedrijfstoestanden met de dienovereenkomstige gegevens inzake gewicht en zwaartepunt met
      inbegrip van de onbeladen toestand en de toestand van het werktuig bij verplaatsing;

      e. berekening van het kenterende, trimmende en oprichtende moment met vermelding van de optredende hellings- en
      trimhoeken, resterende veiligheidsafstanden en resterende vrijboorden;

      f. overzicht van de uitkomsten van de berekeningen met vermelding van de grenzen van gebruik en belasting.

      3 Het bewijs van stabiliteit moet ten minste zijn gebaseerd op de volgende veronderstelde belading:

      a. dichtheid van de baggerspecie bij baggermolens:

        - zand en grind 1,5 ton/m³;
        - zeer nat zand 2,0 ton/m³;
        - grond gemiddeld 1,8 ton/m³;
        - mengsel uit zand en water in buisleidingen 1,3 ton/m³;

      b. bij baggerwerktuigen met grijptanden moeten de waarden onder *a* met 15% worden verhoogd;

      c. bij hydraulische baggerwerktuigen moet worden uitgegaan van het maximale hefvermogen.

      4 4.1. In het bewijs van de stabiliteit moet rekening worden gehouden met de momenten resulterend uit:

      a. de belading;

      b. bouwkundige asymetrieën;

      c. de winddruk;

      d. de draaibeweging bij werktuigen met eigen aandrijvingskracht;

      e. dwarsstroming voor zover vereist;

      f. ballast en voorraden;

      g. deklasten en eventueel lading;

      h. vrije oppervlakken van vloeistof;

      i. dynamische traagheidskrachten;

      k. andere mechanische inrichtingen.

      Daarbij dienen momenten die tegelijkertijd kunnen inwerken te worden opgeteld.

      4.2. Het moment tengevolge van de winddruk dient te worden berekend volgens de volgende formule:

      In deze formule betekent:

      c de vormafhankelijke weerstandscoëfficiënt;

      Voor vakwerk moet worden uitgegaan van c = 1,2 en voor gesloten constructies van c = 1,6, waarbij rekening is
      gehouden met de invloed van windstoten.

      Het windvangend oppervlak is de omhullende oppervlakte van het vakwerk.

      p de specifieke winddruk; deze moet uniform op 0,25 kN/m² worden gesteld;

      A het zijdelings oppervlak boven het vlak van de grootste inzinking in m²;

      I de afstand van het zwaartepunt van het zijdelings oppervlak A tot het vlak van de grootste inzinking in m.

      4.3 Voor de vaststelling van de momenten bij de draaibeweging als bedoeld in lid 4.1, onder d, dient bij drijvende
      werktuigen met mechanische middelen tot voortbeweging de formule van [artikel 15.03, zesde lid][ref2], te worden
      gebruikt.

      4.4. Het door dwarsstroming als bedoeld in lid 4.1, onder *e*, veroorzaakte moment hoeft alleen te worden
      meegerekend bij drijvende werktuigen die gedurende het werk in stromend water dwarsliggend met ankers of kabels
      zijn vastgemaakt.

      4.5. Bij de berekening van de momenten resulterend uit vloeibare ballast en vloeibare voorraden als bedoeld in lid
      4.1, onder *f*, dient de voor de stabiliteit meest ongunstige vullingsgraad van de tanks te worden vastgesteld en
      het dienovereenkomstige moment in de berekening te worden opgenomen.

      4.6. Met het uit dynamische traagheidskrachten resulterende moment als bedoeld in lid 4.1, onder *i*, moet op
      passende wijze rekening worden gehouden, wanneer door bewegingen van de lading en van de werkinrichtingen een
      beïnvloeding van de stabiliteit te verwachten is.

      5 De oprichtende momenten kunnen bij drijvende voorwerpen met loodrechte zijwanden worden berekend volgens de
      formule:

      .

      In deze formule betekent:

      de metacentrumhoogte in m;

      φ de hellingshoek in °.

      Deze formule is van toepassing tot hellingshoeken van ten hoogste 10° of tot een hellingshoek waarbij de zijde van
      het dek wordt ingedompeld of de bodem boven water uitkomt. Daarbij is de kleinste hoek doorslaggevend. Bij schuin
      lopende zijwanden is de formule van toepassing tot hellingshoeken van ten hoogste 5°; voor het overige zijn de
      criteria als bedoeld in het derde en vierde lid van toepassing.

      Wanneer de bijzondere vorm van het drijvend voorwerp of de drijvende voorwerpen dit niet toelaat, zijn
      stabiliteitskrommen als bedoeld in het tweede lid, onder *c*, vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel17.08
      [ref2]: https://wetten.overheid.nl/BWBR0007858#Artikel15.03
