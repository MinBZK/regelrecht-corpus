      4 Voor passagiersschepen, bedoeld in het eerste en het derde lid, die zonder passagiers aan boord varen, geldt de
      minimum-bemanning volgens [artikel 23.10][ref1].

      5 De in het eerste en tweede lid voorgeschreven matrozen mogen door lichtmatrozen worden vervangen, die een
      minimum-leeftijd van 17 jaar hebben bereikt, zich ten minste in het derde leerjaar bevinden en een jaar vaartijd in
      de binnenvaart kunnen aantonen.

      6 De in het eerste lid voorgeschreven minimum-bemanning (schepen voor dagtochten)

      a) in de groep 2, exploitatiewijze A1, Standaard S2, en

      b) in de groepen 3 en 5, exploitatiewijze A1, Standaard S1,

      kan voor de ononderbroken duur van ten hoogste drie maanden in een kalenderjaar met een lichtmatroos, die een
      schippersschool bezoekt, worden verminderd. Opeenvolgende periodes met een verminderde bemanning moeten met een
      periode van minimaal één maand worden onderbroken. Het bezoek aan de schippersschool moet worden aangetoond met een
      verklaring van de schippersschool, die zich aan boord moet bevinden en waarin de tijden van het schoolbezoek zijn
      aangegeven. Deze bepalingen zijn niet van toepassing op de lichtmatroos, bedoeld in het vijfde lid.

      7 De in het tweede lid voorgeschreven minimum-bemanning (stoomschepen voor dagtochten) in de groep 2,
      exploitatiewijze A1, standaard S1, kan voor de ononderbroken duur van ten hoogste drie maanden in een
      kalenderjaar met een lichtmatroos, die een schippersschool bezoekt, worden verminderd. Opeenvolgende periodes
      met een verminderde bemanning moeten met een periode van minimaal één maand worden onderbroken. Het bezoek aan
      de schippersschool moet worden aangetoond met een verklaring van de schippersschool, die zich aan boord moet
      bevinden en waarin de tijden van het schoolbezoek zijn aangegeven. Deze bepalingen zijn niet van toepassing op de
      lichtmatroos, bedoeld in het vijfde lid.

      8 De in het eerste lid voorgeschreven minimum-bemanning (hotelschepen) in de groep 3, exploitatiewijze A1,
      standaard S1, kan voor de ononderbroken duur van ten hoogste drie maanden in een kalenderjaar met een lichtmatroos,
      die een schippersschool bezoekt, worden verminderd. Opeenvolgende periodes met een verminderde bemanning moeten met
      een periode van minimaal één maand worden onderbroken. Het bezoek aan de schippersschool moet worden aangetoond met
      een verklaring van de schippersschool, die zich aan boord moet bevinden en waarin de tijden van het schoolbezoek
      zijn aangegeven.


