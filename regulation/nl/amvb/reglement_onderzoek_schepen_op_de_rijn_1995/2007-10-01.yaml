  - number: '4.04'
    text: |-
      1 Het vlak van de grootste inzinking moet zo worden vastgesteld dat aan de voorschriften omtrent het kleinste
      vrijboord en aan die omtrent de kleinste veiligheidsafstand wordt voldaan. De Commissie van Deskundigen kan echter
      uit veiligheidsoverwegingen een groter vrijboord, dan wel een grotere veiligheidsafstand vaststellen.

      2 Het vlak van de grootste inzinking wordt door goed zichtbare en onuitwisbare inzinkingsmerken aangegeven.

      3 De inzinkingsmerken bestaan uit een rechthoek met horizontale zijden van 300 mm en verticale zijden van 40 mm,
      waarvan de basis samenvalt met het vlak van de toegelaten grootste inzinking. Andersoortige inzinkingsmerken dienen
      een dergelijke rechthoek te bevatten.

      4 Schepen moeten ten minste drie paar inzinkingsmerken hebben, waarvan één paar ongeveer midscheeps en de twee
      andere op ongeveer 1/6 van de lengte L achter de voorsteven, respectievelijk vóór de achtersteven moeten zijn
      aangebracht.

      Evenwel kan:

      a. bij schepen waarvan de lengte L minder dan 40 m bedraagt, met twee paar merken worden volstaan, die op ¼ van de
      lengte L achter de voorsteven, respectievelijk vóór de achtersteven moeten zijn aangebracht;

      b. bij schepen die niet zijn bestemd voor het vervoer van goederen, met één paar merken worden volstaan, dat
      ongeveer midscheeps moet zijn aangebracht.

      5 De ingevolge een nieuw onderzoek ongeldig geworden inzinkingsmerken of aanduidingen moeten onder toezicht
      van de Commissie van Deskundigen worden verwijderd of als ongeldig worden gekenmerkt. Onduidelijk geworden
      inzinkingsmerken mogen alleen onder toezicht van een Commissie van Deskundigen worden vervangen.

      6 Wanneer het schip overeenkomstig het van kracht zijnde verdrag nopens de meting van binnenschepen is gemeten
      en de ijkmerken in hetzelfde vlak liggen als de in dit reglement voorgeschreven inzinkingsmerken, gelden deze
      ijkmerken ook als inzinkingsmerken; daaromtrent wordt een aantekening geplaatst in het certificaat van onderzoek.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel4.04
  - number: '4.05'
    text: |-
      Wanneer het vlak van de grootste inzinking is vastgesteld onder de voorwaarde dat de laadruimen spatwater- en
      regendicht moeten kunnen worden gesloten en de afstand tussen het vlak van de grootste inzinking en de bovenrand
      van de denneboom minder dan 500 mm bedraagt, moet de ten hoogste toegelaten inzinking voor de vaart met open
      laadruimen worden vastgesteld.

      In het certificaat van onderzoek moet dan worden ingevuld:

      "Wanneer de luiken van de laadruimen geheel of gedeeltelijk zijn geopend, mag het schip ten hoogste tot ...mm onder
      de inzinkingsmerken zijn beladen."
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel4.05
  - number: '4.06'
    text: |-
      1 Elk schip waarvan de diepgang meer dan 1 m kan bereiken moet aan het achterschip aan iedere zijde van een
      diepgangsschaal zijn voorzien; aanvullende diepgangsschalen zijn toegestaan.

      2 Het nulpunt van iedere diepgangsschaal moet loodrecht daaronder liggen in een vlak evenwijdig aan het vlak van
      de grootste inzinking, dat door het laagste punt van de scheepsromp gaat of van de kiel, wanneer deze aanwezig
      is. De afstand loodrecht boven het nulpunt moet in decimeters zijn ingedeeld. Deze indeling moet vanaf het vlak
      voor de waterlijn bij ledig schip tot 100 mm boven het vlak van de grootste inzinking op iedere diepgangsschaal
      door ingehakte of ingeslagen merken zijn aangebracht. Deze indeling moet voorts in de vorm van goed zichtbare,
      afwisselend in twee verschillende kleuren geschilderde stroken zijn aangeduid. De indeling moet naast de schaal ten
      minste bij elke 5 decimeter, alsmede aan het boveneinde, door cijfers zijn aangegeven.

      3 De twee achterste ijkschalen, die met toepassing van het in [artikel 4.04, zesde lid][ref1], genoemde verdrag
      zijn aangebracht, kunnen als diepgangsschalen dienst doen, mits zij overeenkomstig bovenstaande voorschriften zijn
      ingedeeld; in voorkomend geval moeten de cijfers voor de diepgang zijn toegevoegd.


