  - number: '20.01'
    text: |-
      1 Zeeschepen, waarop het op 1 november 1974 te Londen tot stand gekomen Internationaal verdrag voor de beveiliging
      van mensenlevens op zee, 1974, met Bijlagen (Trb. 1977, 77) (SOLAS-verdrag), danwel het op 5 april 1966 te Londen
      tot stand gekomen Internationaal verdrag betreffende de uitwatering van schepen, 1966, (Trb. 1966, 275) van
      toepassing is, moeten in het bezit zijn van het betreffende geldige internationale document.

      2 Zeeschepen, waarop het SOLAS-verdrag danwel het Internationaal verdrag betreffende de uitwatering van schepen
      niet van toepassing is, moeten in het bezit zijn van de documenten en voorzien zijn van de vrijboordmerken die
      volgens het recht van de vlaggestaat zijn voorgeschreven en die wat betreft bouw, inrichting en uitrusting aan de
      eisen van de genoemde verdragen voldoen of een vergelijkbaar niveau van veiligheid op enigerlei andere wijze kunnen
      garanderen.

      3 Zeeschepen, waarop het op 2 november 1973 te Londen tot stand gekomen Internationaal Verdrag ter voorkoming
      van verontreiniging door schepen, met Protocollen en bijlagen (Trb. 1975, 147), zoals gewijzigd door het op 17
      februari 1978 te Londen tot stand gekomen Protocol van 1978 bij dat verdrag, met Bijlage (Trb. 1978, 188) (MARPOL-
      verdrag), van toepassing is, moeten in het bezit zijn van een geldig internationaal document inzake de voorkoming
      van verontreiniging van de zee (IOPP document).

      4 Zeeschepen, waarop het MARPOL-verdrag niet van toepassing is, moeten in het bezit zijn van een overeenkomstig
      document dat volgens het recht van de vlaggestaat is voorgeschreven.

      5 Voorts gelden:

      a. [Hoofdstuk 5][ref1];

      b. Van [hoofdstuk 6][ref2]: de [artikelen 6.01, eerste lid][ref3], en [6.02, eerste en tweede lid][ref4];

      c. Van [hoofdstuk 7][ref5]: de [artikelen 7.01, tweede lid][ref6],
      [7.02, eerste lid, en derde lid, eerste en derde alinea][ref7], [7.05, tweede lid][ref8], en [7.13][ref9] voor
      schepen die voor het voeren van het schip door één persoon met behulp van radar zijn toegelaten;

      d. Van [hoofdstuk 8][ref10]: [artikel 8.03, derde lid][ref11], indien vanuit het stuurhuis een inrichting
      om de motor automatisch te stoppen kan worden uitgeschakeld, en de [artikelen 8.05, dertiende lid][ref12],
      [8.06, tiende lid][ref13], [8.07, eerste en tweede lid][ref14], en [8.08][ref15].

      Een verzegeling van de afsluitorganen overeenkomstig [artikel 8.06, tiende lid][ref16], wordt geacht overeen
      te komen met het afsluiten van de afsluitorganen in het lenssysteem, via welke het oliehoudende water overboord
      kan worden gepompt. De sleutel of sleutels daarvan moeten op een centrale als zodanig gekenmerkte plaats worden
      bewaard.

      Een bewakings- en controlesysteem voor olielozingen, overeenkomstig voorschrift 16 van het MARPOL-verdrag, wordt
      geacht overeen te komen met het verzegelen van het afsluitorgaan overeenkomstig [artikel 8.06, tiende lid][ref17].
      De aanwezigheid van een bewakings- en controlesysteem moet door een internationaal document inzake de voorkoming
      van verontreiniging van de zee overeenkomstig het MARPOL-verdrag worden aangetoond.

      Blijkt uit het IOPP document, bedoeld in het derde lid, of uit het nationale door de vlaggenstaat afgegeven
      document, bedoeld in het vierde lid, dat het schip voorzien is van opslagtanks waarin al het aan boord aanwezige
      oliehoudende bilgewater en alle olieresten kunnen worden verzameld, dan wordt het schip geacht te hebben voldaan
      aan [artikel 8.07, tweede lid][ref18];

      e. Van [hoofdstuk 9][ref19]: [artikel 9.17][ref20];

      f. Van [hoofdstuk 10][ref21]: de [artikelen 10.01][ref22] en [10.02, eerste lid][ref23];

      g. [Hoofdstuk 16][ref24]: voor zeeschepen die zijn toegelaten om deel uit te maken van een samenstel;

      h. [Hoofdstuk 22][ref25]:

      Aan [hoofdstuk 22][ref26] is voldaan indien de stabiliteit voldoet aan de van kracht zijnde resoluties van de
      Internationale Maritieme Organisatie (IMO) en de betreffende stabiliteitsberekeningen door de bevoegde autoriteit
      gekeurd zijn en de containers op een voor de zeevaart gebruikelijke wijze zijn vastgezet.


