      Schepen en samenstellen moeten over voldoende vaar- en manoeuvreereigenschappen beschikken:

      Schepen zonder eigen mechanische middelen tot voortbeweging die bestemd zijn om gesleept te worden, moeten voldoen
      aan de bijzondere eisen van de Commissie van Deskundigen;

      Schepen met eigen mechanische middelen tot voortbeweging en samenstellen moeten voldoen aan de
      [artikelen 5.02 tot en met 5.10][ref1].


