    text: |-
      1 Aan boord van elk schip, met uitzondering van sleep- en duwboten die slechts in havens verkeren, onbemande
      duwbakken, overheidsschepen en pleziervaartuigen, moet zich in de stuurhut een vaartijdenboek bevinden
      overeenkomstig het model van [bijlage E][ref1]. Dit boek dient te worden bijgehouden overeenkomstig de daarin
      vervatte aanwijzingen. De schipper is verantwoordelijk voor de aanwezigheid van het vaartijdenboek en de
      aantekeningen die daarin moeten worden gemaakt. Het eerste vaartijdenboek, waarop het nummer 1, de naam van het
      schip en het officiële scheepsnummer dienen te staan, moet worden afgegeven door de autoriteit die het certificaat
      van onderzoek aan het schip heeft uitgereikt.

      Onderdeel 2 van de aanwijzingen voor het bijhouden van het vaartijdenboek, volgens welk per reis kan worden
      volstaan met één schema voor het aantekenen van de rusttijden, geldt slechts voor bemanningsleden in de
      exploitatiewijze B. In de exploitatiewijze A1 en in de exploitatiewijze A2 moeten het begin en het einde van de
      rusttijd van elk bemanningslid iedere dag gedurende de reis worden aangetekend.

      De na een wisseling van de exploitatiewijze noodzakelijke aantekeningen moeten op een nieuwe bladzijde van het
      vaartijdenboek worden aangebracht.

      2 Alle latere vaartijdenboeken mogen worden afgegeven door een plaatselijk bevoegde autoriteit, die het van
      een volgnummer voorziet; zij kunnen evenwel slechts worden afgegeven tegen overlegging van het voorgaande
      vaartijdenboek. Het voorgaande vaartijdenboek moet worden voorzien van de onuitwisbare aantekening« ongeldig» en
      dient aan de schipper te worden teruggegeven.

      Het overhandigen van het nieuwe vaartijdenboek kan geschieden op vertoon van het document, bedoeld in het vierde
      lid. De exploitant van het schip moet er voor zorg dragen, dat het voorafgaande vaartijdenboek binnen 30 dagen na
      de afgiftedatum van het nieuwe vaartijdenboek, die op het document, bedoeld in het vierde lid, door de bevoegde
      autoriteit geregistreerd is, door dezelfde bevoegde autoriteit onuitwisbaar ongeldig verklaard wordt.

      De exploitant van het schip moet er bovendien voor zorgen, dat daarna het vaartijdenboek weer aan boord wordt
      gebracht.

      3 Het ongeldig verklaarde vaartijdenboek moet gedurende zes maanden na de laatste aantekening aan boord worden
      bewaard.

      4 Bij de afgifte van het eerste vaartijdenboek overeenkomstig het eerste lid bevestigt de autoriteit, die het
      eerste vaartijdenboek uitreikt, deze afgifte door middel van een verklaring waarop de naam van het schip, het
      officiële scheepsnummer, het nummer van het vaartijdenboek en de datum van afgifte zijn vermeld. Deze verklaring
      dient aan boord te worden bewaard en op verzoek te worden getoond. De afgifte van latere vaartijdenboeken
      overeenkomstig het tweede lid moet door de bevoegde autoriteit op de verklaring worden aangetekend.

      5 De registraties van de tachografen moeten gedurende zes maanden na de laatste registratie aan boord worden
      bewaard.

      6 Bij een aflossing of versterking van de bemanning als bedoeld in [artikel 23.07][ref2] moet voor ieder nieuw
      bemanningslid een verklaring als bedoeld in bijlage K of een kopie van de pagina met de aantekeningen van de vaar-,
      onderscheidenlijk rusttijden uit het vaartijdenboek van het schip, waarop de laatste reis van het bemanningslid
      heeft plaatsgevonden, voorhanden zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007858
      [ref2]: https://wetten.overheid.nl/BWBR0007858#Artikel23.07
