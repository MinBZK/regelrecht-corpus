  - number: 8a.12
    text: |-
      1 De Oeverstaten en België delen aan de Centrale Commissie voor de Rijnvaart de namen en de adressen van de
      bevoegde autoriteiten en technische diensten mede, die verantwoordelijk zijn voor de uitvoering van dit hoofdstuk.
      De technische diensten moeten voldoen aan de geharmoniseerde normen voor het functioneren van testlaboratoria (EN
      ISO/IEC 17 025: 2000) en voldoen aan de volgende voorwaarden:

      a. de fabrikanten van motoren kunnen niet als technische dienst worden erkend;

      b. voor de toepassing van dit hoofdstuk mag een technische dienst met toestemming van de bevoegde autoriteit
      gebruik maken van inrichtingen buiten zijn eigen testinstelling.

      2 Technische diensten niet gelegen in de lidstaten van de Centrale Commissie voor de Rijnvaart kunnen slechts op
      aanbeveling van de Centrale Commissie voor de Rijnvaart worden erkend.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel8a.12
  - number: '9.01'
    text: |-
      1 Indien voor bepaalde onderdelen van een installatie bijzondere voorschriften ontbreken, wordt de veiligheidsgraad
      als voldoende beschouwd wanneer die onderdelen zijn vervaardigd volgens een geldende Europese norm of volgens de
      voorschriften van een erkend classificatiebureau.

      De benodigde bescheiden moeten worden voorgelegd aan de Commissie van Deskundigen.

      2 Aan boord moeten de volgende, door de Commissie van Deskundigen gewaarmerkte, bescheiden aanwezig zijn:

      a. overzichtschema's van de gehele elektrische installatie;

      b. schema's van het hoofdschakelbord, het noodschakelbord en de verdeelkasten waarop de belangrijkste technische
      gegevens zoals de nominale stroomsterkte van zekeringen en schakelapparatuur zijn aangegeven;

      c. gegevens betreffende de vermogens van elektrische apparaten;

      d. soort en doorsnede van de kabels.

      In geval van onbemande vaartuigen hoeven deze bescheiden zich niet aan boord te bevinden doch moeten zij te allen
      tijde bij de eigenaar beschikbaar zijn.

      3 De installaties moeten voor een permanente slagzij van het schip tot 15° en een omgevingstemperatuur, bij
      plaatsing binnen in het schip, van 0° C tot + 40° C en, bij plaatsing aan dek, van -20° C tot + 40° C zijn
      uitgevoerd en moeten tot deze grenzen onberispelijk functioneren.

      4 Elektrische en elektronische installaties en apparaten moeten goed toegankelijk en onderhoudsvriendelijk zijn.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel9.01
  - number: '9.02'
    text: |-
      1 Aan boord van vaartuigen die zijn voorzien van een elektrische installatie moeten ten behoeve van de
      energieverzorging in principe twee energiebronnen aanwezig zijn, zodat bij het uitvallen van één energiebron
      de resterende energiebron in staat is om de verbruikers, die voor de veilige vaart noodzakelijk zijn, gedurende
      tenminste 30 minuten te voeden.

      2 Het voldoende bemeten zijn van de energieverzorging moet worden aangetoond aan de hand van een vermogensbalans.
      Hierbij kan een passende gelijktijdigheidsfactor in aanmerking worden genomen.

      3 Onverminderd het eerste lid is voor de energiebron van stuurinrichtingen (roerinstallaties) [artikel 6.04][ref1]
      van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel6.04
