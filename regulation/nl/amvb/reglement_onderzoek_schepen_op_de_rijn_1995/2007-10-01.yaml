        hoofdstuk: '4'
  - number: '18.05'
    text: |-
      Schepen bestemd voor bouwwerkzaamheden hoeven niet met een bijboot te zijn uitgerust, indien

      a. ze niet zijn uitgerust met mechanische middelen tot voortbeweging, en

      b. op het werkterrein een andere bijboot beschikbaar is.

      Deze vrijstelling dient in het certificaat van onderzoek te worden vermeld.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel18.05
  - number: '19.01'
    text: |-
      Op kanaalspitsen, die de Rijn slechts tussen Basel (Mittlere Rheinbrücke) en de sluizen te Iffezheim met
      inbegrip van de meest benedenstrooms gelegen voorhaven bevaren, zijn voor wat betreft bouw en uitrusting de
      [artikelen 19.02][ref1] en [19.03][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel19.02
      [ref2]: https://wetten.overheid.nl/BWBR0007858#Artikel19.03
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel19.01
    references:
      - id: ref1
        bwb_id: BWBR0007858
        artikel: '19.02'
        hoofdstuk: '19'
      - id: ref2
        bwb_id: BWBR0007858
        artikel: '19.03'
        hoofdstuk: '19'
  - number: '19.02'
    text: |-
      Op kanaalspitsen zijn van toepassing:

      1. de [artikelen 3.01][ref1], [3.02, tweede lid][ref2], [3.03, tweede tot en met vierde en zesde lid][ref3];

      2. de [hoofdstukken 5][ref4] en [6][ref5];

      In afwijking van [artikel 6.01, eerste lid][ref6], moet een kanaalspits voorzien zijn van een deugdelijke
      stuurinrichting, die voldoende vaar- en manoeuvreereigenschappen mogelijk maakt;

      3. [artikel 8.01][ref7];

      4. [artikel 9.01, eerste lid][ref8], is van overeenkomstige toepassing;

      5. Kanaalspitsen moeten op het voorschip met een anker met een massa van ten minste 250 kg zijn uitgerust, dat
      is voorzien van een ketting van ten minste 50 m lengte, waarvan de minimum breeksterkte in kN een derde van
      de werkelijke ankermassa in kg bedraagt. De ketting mag door een kabel van gelijke minimum breeksterkte worden
      vervangen.

      De volgende uitrustingsstukken moeten aan boord zijn:

      a. twee deugdelijke lenspompen;

      b. trossen voor het meren:

        - een tros van ten minste 100 m lengte en een diameter van 18 mm;
        - twee trossen van ten minste 60 m lengte en een diameter van 16 tot 18 mm;

      c. een werplijn;

      d. een drinkwaterreservoir;

      e. apparaten en installaties die nodig zijn voor het voeren en tonen van de optische tekens en het geven van de
      geluidsseinen, voorgeschreven in het [Rijnvaartpolitiereglement][ref9];

      f. een loopplank, ten minste 0,40 m breed en ten minste 4 m lang, waarvan de zijkanten door een witte streep zijn
      gemarkeerd; deze loopplank moet voorzien zijn van een leuning;

      g. een bootshaak;

      h. een verbandtrommel;

      i. een verrekijker 7 ̈ 50 of een grotere lensdiameter;

      j. een bord met aanwijzingen betreffende het redden en bijbrengen van drenkelingen;

      k. een als zodanig gekenmerkt brandbestendig reservoir met deksel voor het bewaren van oliehoudende poetslappen;

      l. een als zodanig gekenmerkt brandbestendig reservoir voor het verzamelen van vast klein chemisch afval en een als
      zodanig gekenmerkt brandbestendig reservoir met deksel voor het verzamelen van vloeibaar klein chemisch afval;

      m. een als zodanig gekenmerkt brandbestendig reservoir voor slops;

      n. aan boord van schepen waarvan de hoogte van het boord boven de waterlijn bij ledig schip meer dan 1,50 m
      bedraagt een buitenboordtrap of -ladder;

      o. 2 draagbare blustoestellen;

      p. een bijboot met

        - een stel roeiriemen,
        - een meertouw,
        - een hoosvat;

      q. twee reddingsboeien en twee zwemvesten;

      6. [artikel 13.01][ref10];

      7. [hoofdstuk 14][ref11].


