  - number: '15.15'
    text: |-
      1 In plaats van het rekenkundig bewijs van voldoende lekstabiliteit als bedoeld in
      [artikel 15.03, zevende tot en met dertiende lid][ref1], moeten passagiersschepen die voor het vervoer van minder
      dan 50 passagiers zijn toegelaten en waarvan de lengte niet groter is dan 25 m in symmetrische leksituaties aan de
      volgende criteria voldoen:

      a. het schip mag maximaal tot aan de indompelingsgrenslijn inzinken, en

      b. de resterende metacentrische hoogte gm mag niet kleiner zijn dan 0,10 m.

      Het benodigde resterende opdrijvend vermogen moet worden gegarandeerd door de juiste keuze van het materiaal
      van de scheepshuid of door drijflichamen van blokken schuim, die vast met de romp verbonden zijn. Voor schepen
      met een lengte van meer dan 15 m mag het resterend opdrijvend vermogen door een combinatie van drijflichamen en
      schotindeling voor de 1 compartiment status als bedoeld in [artikel 15.03][ref2] zijn verzekerd.

      2 De Commissie van Deskundigen kan bij passagiersschepen als bedoeld in het eerste lid kleine afwijkingen toelaten
      van de bij [artikel 15.06, derde lid, onder c, en vijfde lid, onder b][ref3], vereiste vrije hoogte. De afwijking
      mag niet meer zijn dan 5%. Ingeval van afwijkingen moeten de betreffende plaatsen in het schip met verf worden
      gemarkeerd.

      3 In afwijking van [artikel 15.03, negende lid][ref4], behoeven passagiersschepen die voor het vervoer van ten
      hoogste 250 passagiers zijn toegelaten en waarvan de lengte niet groter is dan 45 m niet te voldoen aan de 2
      compartimenten status.

      4 (vervallen)

      5 De Commissie van Deskundigen kan bij passagiersschepen, die zijn toegelaten voor het vervoer van ten hoogste 250
      passagiers en waarvan de lengte niet meer is dan 25 m, afzien van het moeten voldoen aan [artikel 10.04][ref5],
      indien het passagiersschip is uitgerust met een van twee kanten bereikbaar platform vlak boven de waterlijn, dat
      het mogelijk maakt personen uit het water te redden. Het passagiersschip mag met een vergelijkbare inrichting zijn
      voorzien, in welk geval:

      a. voor de bediening van de inrichting één persoon volstaat;

      b. mobiele inrichtingen toegestaan zijn;

      c. de inrichting zich buiten de gevarenzone van de middelen tot voortbeweging bevinden moet, en

      d. een effectieve communicatie tussen de schipper en de persoon die de inrichting bedient mogelijk moet zijn.

      6 De Commissie van Deskundigen kan bij passagiersschepen, die zijn toegelaten voor het vervoer van ten
      hoogste 600 passagiers en waarvan de lengte niet meer bedraagt dan 45 m, afzien van het moeten voldoen aan
      [artikel 10.04][ref6], indien het passagiersschip is uitgerust met een platform overeenkomstig het vijfde lid,
      eerste zin, dan wel met een vergelijkbare inrichting als een platform als bedoeld in het vijfde lid, tweede zin.
      Bovendien moet het passagiersschip beschikken over:

      a. als hoofdaandrijving een roerpropeller, een cycloïdaalschroef of een waterstraalaandrijving, of

      b. een hoofdaandrijving met 2 voortstuwingsorganen, of

      c. een hoofdaandrijving en een boegschroefinstallatie.

      7 In afwijking van [artikel 15.02, negende lid][ref7], mag op passagiersschepen, waarvan de lengte niet meer
      bedraagt dan 45 m en waarvan het ten hoogste toegelaten aantal passagiers overeenkomt met de lengte van het
      schip in meters, een handbediende deur, die niet op afstand kan worden bediend, in een schot als bedoeld in
      [artikel 15.02, vijfde lid][ref8], in de verblijfsruimte voor passagiers aanwezig zijn, indien:

      a. het schip slechts één dek heeft;

      b. deze deur vanaf het dek direct te bereiken is en niet meer dan 10 m van de toegang tot het dek verwijderd is;

      c. de onderkant van de deuropening tenminste 30 cm boven de bodem van de verblijfsruimte voor passagiers is
      gelegen, en

      d. de beide afdelingen die door de deur worden gescheiden zijn uitgerust met een bilge alarm.

      8 In afwijking van [artikel 15.06, zesde lid, onder c][ref9], mag op passagiersschepen als bedoeld in het zevende
      lid een vluchtweg door een keuken leiden, indien een tweede vluchtweg beschikbaar is.

      9 Voor passagiersschepen, waarvan de lengte niet meer bedraagt dan 45 m, geldt
      [artikel 15.01, tweede lid, onder e][ref10], niet, wanneer de vloeibaargasinstallaties met geschikte
      alarminstallaties voor gezondheidsbedreigende concentraties van CO alsmede voor explosieve gasmengsels zijn
      uitgerust.

      10 De volgende voorschriften gelden niet voor passagiersschepen waarvan de lengte niet meer bedraagt dan 25 m:

      a. [artikel 15.04, eerste lid, laatste zin][ref11];

      b. [artikel 15.06, zesde lid, onder c][ref12], voor zover het keukens betreft, indien een tweede vluchtweg
      beschikbaar is;

      c. [artikel 15.07][ref13].

      11 Op hotelschepen, waarvan de lengte niet meer bedraagt dan 45 m, is [artikel 15.12, tiende lid][ref14], niet van
      toepassing voorzover in iedere hut vluchtmaskers, in een aantal dat overeenkomt met de zich in die hut bevindende
      bedden, direct bereikbaar aanwezig zijn.


