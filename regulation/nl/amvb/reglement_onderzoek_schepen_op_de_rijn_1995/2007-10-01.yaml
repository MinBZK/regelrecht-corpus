  - number: '15.13'
    text: |-
      1 Op ieder passagiersschip moet een veiligheidsrol aanwezig zijn. Hierin worden de instructies voor de bemanning en
      het boordpersoneel voor de volgende gevallen omschreven:

      a. averij van het schip,

      b. brand aan boord,

      c. evacuatie van de passagiers,

      d. man-over-boord.

      Bijzondere veiligheidsmaatregelen, die nodig zijn voor personen met beperkte mobiliteit moeten in de veiligheidsrol
      zijn opgenomen.

      De verschillende taken moeten aan de leden van de bemanning en van het boordpersoneel die in het kader van de
      veiligheidsrol moeten optreden in overeenstemming met hun functie zijn toegedeeld. In het bijzonder moet door
      speciale aanwijzingen zeker gesteld zijn, dat alle deuren en openingen in waterdichte schotten als bedoeld in
      [artikel 15.02][ref1] in geval van gevaar onmiddellijk waterdicht gesloten worden.

      2 Bij de veiligheidsrol behoort een veiligheidsplan van het schip, waarop duidelijk en overzichtelijk tenminste
      zijn aangegeven:

      a. ruimten die zijn bestemd voor gebruik door personen met beperkte mobiliteit;

      b. vluchtwegen, nooduitgangen, verzamel- en evacuatieruimten;

      c. reddingsmiddelen en bijboten;

      d. blustoestellen, brandblusinstallaties en automatisch werkende sprinklerinstallaties;

      e. overige veiligheidsuitrusting;

      f. alarminstallatie, bedoeld in [artikel 15.08, derde lid, onder a][ref2];

      g. alarminstallatie, bedoeld in [artikel 15.08, derde lid, onder b en c][ref3];

      h. deuren in schotten, bedoeld in [artikel 15.02, vijfde lid][ref4], en de plaatsen van waaruit deze worden
      bediend, alsook overige openingen, bedoeld in [artikel 15.02, negende, tiende en dertiende lid][ref5], en
      [artikel 15.03, twaalfde lid][ref6];

      i. deuren, bedoeld in [artikel 15.11, achtste lid][ref7];

      j. brandkleppen;

      k. brandmeldsysteem;

      l. noodstroominstallatie;

      m. schakelaars van ventilatiesystemen;

      n. walaansluitingen;

      o. afsluiters van brandstofleidingen;

      p. vloeibaargasinstallaties;

      q. luidsprekerinstallaties;

      r. marifooninstallaties;

      s. verbandtrommels.

      3 De veiligheidsrol, bedoeld in het eerste lid, en het veiligheidsplan, bedoeld in het tweede lid, moeten:

      a. door de Commissie van Deskundigen zijn gewaarmerkt en

      b. op ieder dek op geschikte plaatsen duidelijk zichtbaar zijn opgehangen.

      4 In elke hut moeten de nodige instructies aanwezig zijn voor het gedrag van de passagiers alsmede een verkort
      veiligheidsplan waarin alleen de indicaties, bedoeld in het tweede lid, onder a tot en met f, zijn opgenomen.

      Deze instructies moeten tenminste bevatten:

      a. Aangeven van noodsituaties:

      aa. brand;

      bb. lek raken van het schip;

      cc. algemeen gevaar.

      b. Beschrijving van de verschillende noodsignalen.

      c. Aanwijzingen met betrekking tot:

      aa. vluchtweg;

      bb. gedrag;

      cc. bewaren van kalmte.

      d. Aanwijzingen met betrekking tot:

      aa. roken;

      bb. gebruik van vuur en open licht;

      cc. openen van vensters;

      dd. gebruik van bepaalde inrichtingen.

      Deze instructies moeten in het Duits, Engels, Frans en Nederlands beschikbaar zijn.


