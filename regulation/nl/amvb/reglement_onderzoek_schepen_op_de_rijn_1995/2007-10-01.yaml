  - number: '1.06'
    text: |-
      De Centrale Commissie voor de Rijnvaart kan voorschriften van tijdelijke aard vaststellen, wanneer het voor een
      aanpassing aan de technische ontwikkeling van de binnenscheepvaart noodzakelijk wordt geacht om in dringende
      gevallen afwijkingen van dit reglement toe te laten dan wel proefnemingen mogelijk te maken, waardoor de veiligheid
      en de vlotte afwikkeling van het scheepvaartverkeer niet worden benadeeld. Deze voorschriften van tijdelijke
      aard worden door de bevoegde autoriteit gepubliceerd en hebben een geldigheidsduur van ten hoogste drie jaren.
      Zij worden in alle Oeverstaten en in België op hetzelfde tijdstip in werking gesteld en worden onder dezelfde
      voorwaarden buiten werking gesteld.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel1.06
  - number: '1.07'
    text: |-
      1 In het belang van een eenvoudige en uniforme toepassing van dit reglement kan de Centrale Commissie voor de
      Rijnvaart richtlijnen voor de Commissies van Deskundigen vaststellen. De Commissies van Deskundigen worden van deze
      richtlijnen in kennis gesteld.

      2 In het belang van een eenvoudige en uniforme toepassing van [hoofdstuk 23][ref1] kan de Centrale Commissie
      voor de Rijnvaart richtlijnen voor de terzake van dat hoofdstuk bevoegde autoriteiten vaststellen. Deze bevoegde
      autoriteiten worden van deze richtlijnen in kennis gesteld.

      3 De Commissies van Deskundigen en de ter zake van [hoofdstuk 23][ref2] bevoegde autoriteiten dienen zich aan deze
      richtlijnen te houden.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Hoofdstuk23
      [ref2]: https://wetten.overheid.nl/BWBR0007858#Hoofdstuk23
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel1.07
    references:
      - id: ref1
        bwb_id: BWBR0007858
        hoofdstuk: '23'
      - id: ref2
        bwb_id: BWBR0007858
        hoofdstuk: '23'
  - number: '2.01'
    text: |-
      1 In bepaalde daarvoor in aanmerking komende havens zijn door de Oeverstaten en België Commissies van Deskundigen
      ingesteld.

      2 De Commissies van Deskundigen bestaan uit een voorzitter en deskundigen.

      Als deskundigen maken van iedere Commissie ten minste deel uit:

      a. een ambtenaar van het bevoegd gezag op het gebied van de scheepvaart;

      b. een deskundige op het gebied van de bouw van binnenschepen en hun machines,

      c. een nautisch deskundige die in het bezit is van het grote patent als bedoeld in het Reglement Rijnpatenten.

      3 De voorzitter en de deskundigen van elke Commissie worden benoemd door de autoriteiten van de staat waartoe de
      Commissie behoort.

      De voorzitter en de deskundigen dienen bij de aanvaarding van hun functie schriftelijk te verklaren dat zij deze in
      alle onpartijdigheid zullen vervullen. Van ambtenaren wordt een dergelijke verklaring niet geëist.

      4 De Commissies van Deskundigen kunnen zich onder de voorwaarden, zoals door elk der betrokken staten zullen worden
      vastgesteld, doen bijstaan door gespecialiseerde deskundigen.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel2.01
  - number: '2.02'
    text: |-
      1 De eigenaar van een vaartuig of zijn vertegenwoordiger die een onderzoek hiervan wenst, moet bij de Commissie
      van Deskundigen van zijn keuze een aanvraag indienen volgens het model van [bijlage A][ref1]. De Commissie van
      Deskundigen stelt vast welke bescheiden moeten worden overgelegd.

      2 De eigenaar van een vaartuig, waarop dit reglement niet van toepassing is, of zijn vertegenwoordiger, kan een
      certificaat van onderzoek aanvragen. Aan deze aanvraag dient gevolg te worden gegeven wanneer het schip voldoet aan
      de bepalingen van dit reglement.


      [ref1]: https://wetten.overheid.nl/BWBR0007858
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel2.02
    references:
      - id: ref1
        bwb_id: BWBR0007858
  - number: '2.03'
    text: |-
      1 De eigenaar of zijn vertegenwoordiger moet het vaartuig leeg, schoongemaakt en met volledige uitrusting voor
      onderzoek aanbieden. Hij is verplicht bij het onderzoek de noodzakelijke hulp te verlenen, bijv. een geschikte boot
      met personeel ter beschikking te stellen, en die delen van de romp of van de installaties bloot te leggen, die niet
      direct toegankelijk of zichtbaar zijn.

      2 De Commissie van Deskundigen moet bij het eerste onderzoek het schip op het droge bezichtigen. Bezichtiging
      op het droge kan achterwege blijven wanneer een klassecertificaat of een verklaring van een erkend
      classificatiebureau, volgens welke de bouw voldoet aan de daardoor gehanteerde voorschriften, wordt overgelegd. Bij
      aanvullende of bijzondere onderzoeken kan de Commissie van Deskundigen een bezichtiging op het droge verlangen.

      De Commissie van Deskundigen moet bij het eerste onderzoek van motorschepen en samenstellen, alsmede bij essentiële
      veranderingen in de voortstuwingsinstallatie of de stuurinrichting proefvaarten doen plaatsvinden.

      3 De Commissie van Deskundigen kan extra bezichtigingen en proefvaarten doen plaatsvinden en nadere bewijzen
      verlangen. Dit geldt tevens tijdens de bouw.
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel2.03
  - number: '2.04'
    text: |-
      1 Wanneer de Commissie van Deskundigen op grond van het onderzoek van een vaartuig vaststelt dat dit beantwoordt
      aan de voorschriften van dit reglement met betrekking tot bouw, inrichting en uitrusting, geeft zij aan de
      aanvrager een certificaat van onderzoek volgens het model van [bijlage B][ref1] af.

      2 Ingeval de Commissie van Deskundigen weigert een certificaat van onderzoek af te geven, moet zij dit aan de
      aanvrager gemotiveerd schriftelijk mededelen.

      3 De onderscheidingsletters van de Commissie van Deskundigen en het volgnummer van het certificaat van onderzoek
      moeten onuitwisbaar in Latijnse letters en Arabische cijfers van ten minste 2 cm hoogte zijn aangebracht op een
      goed zichtbare plaats, die in het certificaat van onderzoek is vermeld, op een vast gedeelte van het schip dat is
      beschermd tegen stoten en dat slechts in geringe mate onderhevig is aan slijtage.


      [ref1]: https://wetten.overheid.nl/BWBR0007858
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel2.04
    references:
      - id: ref1
        bwb_id: BWBR0007858
  - number: '2.05'
    text: |-
      1 De Commissie van Deskundigen kan een voorlopig certificaat afgeven voor:

      a. vaartuigen die, teneinde een certificaat van onderzoek te verkrijgen, een reis willen ondernemen naar een
      Commissie van Deskundigen van hun keuze;

      b. vaartuigen die, wegens één van de in de [artikelen 2.07][ref1], [2.13, eerste lid][ref2], of [2.14][ref3]
      bedoelde gevallen, tijdelijk niet van hun certificaat van onderzoek zijn voorzien;

      c. vaartuigen waarvan het certificaat van onderzoek na het onderzoek nog in behandeling is;

      d. vaartuigen waarbij niet aan alle voorwaarden voor de afgifte van een certificaat van onderzoek overeenkomstig
      [bijlage B][ref4] of een certificaat overeenkomstig [bijlage G][ref5] wordt voldaan;

      e. vaartuigen die zodanige schade hebben geleden dat de staat waarin zij verkeren niet meer overeenstemt met het in
      het certificaat van onderzoek gestelde;

      f. drijvende inrichtingen en drijvende voorwerpen, in het geval dat de voor de toepassing van
      [artikel 1.21, eerste lid, van het Rijnvaart-politiereglement][ref6] bevoegde autoriteit de vergunning voor een
      bijzonder transport afhankelijk stelt van het hebben van een voorlopig certificaat van onderzoek;

      g. vaartuigen waarvoor een Commissie van Deskundigen gelijkwaardige voorzieningen als bedoeld in artikel 2.19,
      tweede lid, toestaat, voor die gevallen waarvoor de Centrale Commissie voor de Rijnvaart nog geen aanbeveling heeft
      gedaan.

      2 Het voorlopige certificaat van onderzoek wordt volgens het model van [bijlage D][ref7] afgegeven, wanneer
      de deugdelijkheid van het vaartuig, de drijvende inrichting of het drijvende voorwerp voor de vaart voldoende
      gewaarborgd wordt geacht.

      Het moet de voorwaarden bevatten die door de Commissie van Deskundigen nodig worden geacht en is geldig:

      a. in de in het eerste lid, onder *a* en *d* tot en met *f*, bedoelde gevallen voor één bepaalde reis, te maken
      binnen een redelijke termijn, die ten hoogste één maand mag zijn;

      b. in de in het eerste lid, onder *b* en *c*, bedoelde gevallen gedurende een redelijke termijn;

      c. in de in het eerste lid, onder *g*, genoemde gevallen gedurende zes maanden. Deze termijn mag slechts worden
      verlengd met toestemming van de Centrale Commissie voor de Rijnvaart.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel2.07
      [ref2]: https://wetten.overheid.nl/BWBR0007858#Artikel2.13
      [ref3]: https://wetten.overheid.nl/BWBR0007858#Artikel2.14
      [ref4]: https://wetten.overheid.nl/BWBR0007858
      [ref5]: https://wetten.overheid.nl/BWBR0007858
      [ref6]: https://wetten.overheid.nl/BWBR0006923#Artikel1.21
      [ref7]: https://wetten.overheid.nl/BWBR0007858
