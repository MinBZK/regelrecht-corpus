  - number: '23.01'
    text: |-
      1 De bemanning die zich krachtens het [Rijnvaartpolitiereglement][ref1] aan boord moet bevinden van schepen die de
      Rijn bevaren dient voor alle exploitatiewijzen in overeenstemming te zijn met de voorschriften van dit hoofdstuk.

      De voor de desbetreffende exploitatiewijze en vaartijd voorgeschreven bemanning moet zich tijdens de vaart
      voortdurend aan boord bevinden. Het is niet toegestaan zonder de voorgeschreven bemanning te vertrekken.

      Wanneer door onvoorziene omstandigheden (bijvoorbeeld ziekte, ongeval, bevel van een bevoegde autoriteit)
      tijdens de vaart ten hoogste één lid van de voorgeschreven bemanning uitvalt, mogen de schepen niettemin hun reis
      voortzetten tot de eerstvolgende geschikte aanlegplaats in de richting waarin gevaren wordt – passagiersschepen tot
      het eindpunt van de reis van die dag –, indien zich aan boord een persoon bevindt die houder is van een patent voor
      het riviergedeelte waarop hij vaart, alsmede nog een lid van de voorgeschreven bemanning.

      De persoon die belast is met het toezicht op en de verzorging van zich aan boord bevindende kinderen jonger dan
      zes jaar mag geen lid van de minimum-bemanning zijn, tenzij er maatregelen zijn getroffen om de veiligheid van de
      kinderen ook zonder voortdurend toezicht te waarborgen.

      2 Elke Oeverstaat of België kan bepalen, dat zijn voorschriften betreffende de arbeidsbescherming van toepassing
      zijn op de Rijnschepen die in die staat zijn ingeschreven. Niet in een register ingeschreven schepen zijn
      onderworpen aan de voorschriften van die Oeverstaat of België waarin het bedrijf of de eigenaar zijn hoofdzetel of
      wettelijke domicilie heeft.

      In afwijking hiervan kunnen de bevoegde autoriteiten van de Oeverstaten of België bilateraal overeenkomen, dat
      bepaalde schepen die in de ene staat zijn ingeschreven zijn onderworpen aan de voorschriften van de andere staat.

      Zwangere vrouwen en kraamvrouwen mogen geen deel uitmaken van de bemanning gedurende ten minste 14 weken, waarvan
      ten minste 6 weken voor en 7 weken na de bevalling.

      3 Voor de toepassing van de [artikelen 23.05][ref2], [23.06][ref3] en [23.08][ref4] dient tevens rekening te worden
      gehouden met vaar- en rusttijden vervuld buiten het toepassingsgebied van dit reglement.

      4 Als één jaar vaartijd gelden 180 effectieve vaardagen in de binnenvaart. Binnen een periode van 365 opeenvolgende
      dagen kunnen maximaal 180 dagen als vaartijd worden meegerekend. 250 Vaardagen in de zee- of kustvaart dan wel de
      visserij gelden als één jaar vaartijd.


      [ref1]: https://wetten.overheid.nl/BWBR0006923
      [ref2]: https://wetten.overheid.nl/BWBR0007858#Artikel23.05
      [ref3]: https://wetten.overheid.nl/BWBR0007858#Artikel23.06
      [ref4]: https://wetten.overheid.nl/BWBR0007858#Artikel23.08
    url: https://wetten.overheid.nl/BWBR0007858/2007-10-01#Artikel23.01
