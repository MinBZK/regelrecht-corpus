  - number: '24.02'
    text: |-
      1 Onverminderd de [artikelen 24.03][ref1] en [24.04][ref2] moeten vaartuigen, die niet volledig aan de bepalingen
      van dit reglement voldoen: a. daaraan volgens de in de onderstaande tabel vermelde overgangsbepalingen worden
      aangepast, b. totdat de aanpassing heeft plaatsgevonden, voldoen aan het op 31 december 1994 geldende Reglement
      onderzoek schepen op de Rijn.

      2 In de onderstaande tabel betekent: – «N.V.O.»: het voorschrift is niet van toepassing op reeds in bedrijf zijnde
      vaartuigen, tenzij de betreffende delen worden vervangen of omgebouwd, dat wil zeggen dat dit voorschrift slechts
      van toepassing is op Nieuwbouw, bij Vervanging of bij Ombouw van de betreffende delen of sectoren. Worden bestaande
      delen vervangen door delen welke in technische zin en bouwwijze gelijk zijn, dan wordt dit niet beschouwd als
      vervanging «V» volgens deze overgangsbepalingen. – «Verlenging certificaat»: aan het voorschrift moet zijn voldaan
      bij de eerstvolgende verlenging van de geldigheidsduur van het certificaat van onderzoek na de daarop aangegeven
      datum.

