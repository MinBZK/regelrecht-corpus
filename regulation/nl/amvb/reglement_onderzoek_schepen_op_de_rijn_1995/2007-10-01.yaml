  - number: '23.05'
    text: |-
      1 Men onderscheidt de volgende exploitatiewijzen:

      A1: vaart van ten hoogste 14 uren;

      A2: vaart van ten hoogste 18 uren;

      B: vaart van ten hoogste 24 uren; telkens binnen een tijdvak van 24 uur.

      2 Bij exploitatiewijze A1 mag de vaart eenmaal per week tot ten hoogste 16 uren worden verlengd, indien de vaartijd
      kan worden aangetoond met de registraties van een goed functionerende tachograaf van een type dat overeenkomstig
      [bijlage H][ref1] is goedgekeurd door de bevoegde autoriteit van een Oeverstaat of van België en wanneer er behalve
      de schipper nog een bemanningslid in de bemanning is opgenomen met de bevoegdheid van stuurman.

      3 Een schip dat op de onder A1, onderscheidenlijk A2 bedoelde wijze wordt geëxploiteerd moet de vaart gedurende 8,
      onderscheidenlijk 6 aaneengesloten uren onderbreken, te weten:

      a) in de exploitatiewijze A1 tussen 22.00 en 06.00 uur, en

      b) in de exploitatiewijze A2 tussen 23.00 en 05.00 uur.

      Er mag van deze tijden worden afgeweken, indien het schip is uitgerust met een goed functionerende tachograaf van
      een type dat overeenkomstig bijlage H is goedgekeurd door de bevoegde autoriteit van een Oeverstaat of België.
      De tachograaf moet ten minste in bedrijf zijn vanaf het begin van de laatste ononderbroken rusttijd van 8,
      onderscheidenlijk 6 uren en voor de controlerende diensten te allen tijde bereikbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007858
