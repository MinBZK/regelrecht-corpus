preamble:
  text: |-
    Wij WILLEM, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, Groot-Hertog van Luxemburg, enz.,
    enz., enz.

    Gezien de rapporten Onzer Ministers van Binnenlandsche Zaken en van Justitie, alsmede van het Amortisatie-
    Syndicaat, op een verzoek van het weldadig zeemans fonds te Amsterdam, omtrent de gelden en goederen van zeelieden,
    die ter koopvaardij zijn uitgevaren, en op de reis zijn overleden of vermist geraakt;

    Den Raad van State gehoord;

    Gezien het nader rapport van Onzen Minister van Justitie, van den 24 Augustus l.l., n°. 43;

    Den Raad van State nader gehoord;
  url: https://wetten.overheid.nl/BWBR0001831/1827-12-13#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      De schippers, eigenaars of boekhouders der koopvaardijschepen zullen de nagelaten goederen, gelden en verdiende
      gagien van zoodanige schepelingen, welke gedurende de reize, overleden, achtergebleven of vermist zijn, en
      bijaldien de erfgenamen of representanten onbekend of uitlandig mogten wezen, of zich niet mogten aanmelden, doen
      overbrengen in de kas der geregtelijke consignatien, ten einde daarmede op den voet der wet van den 20 December
      1823 (*staatsblad* no. 53) te worden gehandeld.
    url: https://wetten.overheid.nl/BWBR0001831/1827-12-13#Artikel1
  - number: '1.2'
    text: |-
      Voor zoo verre het nagelatene geheel of gedeeltelijke mogt bestaan uit andere voorwerpen, dan gereede penningen,
      zullen die voorwerpen in het voorgestelde geval, op de wijze bij de administratie gebruikelijk, in het openbaar
      verkocht en de opbrengst daarvan in de kas der geregtelijke consignatien gestort worden.
    url: https://wetten.overheid.nl/BWBR0001831/1827-12-13#Artikel1
  - number: '2'
    text: |-
      Voor zoo verre de overledene, achtergeblevene of vermiste schepelingen, buitenlanders of vreemdelingen mogten
      geweest zijn, van wier natie zich hier te lande een konsul of ander agent bevindt, zal van het overlijden,
      achterblijven of vermissen, aan den konsul of agent worden kennis gegeven door den waterschout, wanneer zich
      zoodanig ambtenaar op de plaats der aankomst van het vaartuig bevindt, of anderzins door het gemeentebestuur
      van zoodanige plaats, ten einde het overlijden, achterblijven of vermissen worde gebragt ter kennisse der
      belanghebbenden, en ten einde deze tot het doen der vereischte reclames in staat te stellen.
    url: https://wetten.overheid.nl/BWBR0001831/1827-12-13#Artikel2
  - number: '3'
    text: |-
      De waterschouten of bij ontbreken van dezelve, de gemeentebesturen, zullen mede aan de ambtenaren van het domein
      doen toekomen een uittreksel uit de monsterrol voor zoo veel betreft de overledene, achtergeblevene of vermiste
      schepelingen, en zullen daarbij vermelden of de erfgenamen, representanten of andere belanghebbenden al dan niet
      bekend zijn en wie als zoodanig zijn opgegeven.
    url: https://wetten.overheid.nl/BWBR0001831/1827-12-13#Artikel3
  - number: '4'
    text: |-
      Insgelijks zullen in de kas der geregtelijke consignatien worden overgebragt alle van vroegeren tijd nog aanwezige
      gelden en goederen van den voorz. aard, naar welke door de ambtenaren van het domein de vereischte nasporingen
      zullen worden gedaan; zullende de waterschouten, gemeentebesturen en alle andere autoriteiten daaromtrent aan die
      ambtenaren op hunne aanvrage alle mogelijke inlichtingen geven.
    url: https://wetten.overheid.nl/BWBR0001831/1827-12-13#Artikel4
