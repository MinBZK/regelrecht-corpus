  - number: 7.1.3
    text: |-
      1 Als categorieën van instanties als bedoeld in [artikel 7.1.1.2, eerste lid, onder a, van de wet][ref1] in het
      domein gezondheidszorg worden aangewezen:

      a. instanties voor verslavingszorg voor wie het op grond van
      [artikel 35 van de Wet marktordening gezondheidszorg][ref2] niet verboden is een tarief in rekening te brengen;

      b. instanties voor gehandicaptenzorg die zorg verlenen waarop aanspraak bestaat op grond van de
      [Zorgverzekeringswet][ref3] of de [Wet langdurige zorg][ref4];

      c. aanbieders van geestelijke gezondheidszorg waarop ingevolge de [Wet langdurige zorg][ref5] dan wel ingevolge een
      zorgverzekering als bedoeld in [artikel 1, onderdeel d, van de Zorgverzekeringswet][ref6] aanspraak bestaat,

      d. instanties die integrale eerstelijns geneeskundige zorg aanbieden, zoals huisartsen die plegen aan te beiden;

      e. ziekenhuizen die beschikken over een toelatingsvergunning als bedoeld in
      [artikel 1, eerste lid, van de Wet toetreding zorgaanbieders][ref7], voor zover het spoedeisende hulp betreft.

      2 Als categorie van functionarissen als bedoeld in [artikel 7.1.1.2, tweede lid, onder a, van de wet][ref8] in het
      domein gezondheidszorg worden huisartsen aangewezen.


