  - number: '2.1'
    text: |-
      Ter uitvoering van de taken, bedoeld in [artikel 2.14, eerste lid, van de wet][ref1], draagt het college zorg voor
      de beschikbaarheid van relevante deskundigheid met betrekking tot:

      a. opgroei- en opvoedingsproblemen, psychische problemen en stoornissen,

      b. opvoedingssituaties waardoor jeugdigen mogelijk in hun ontwikkeling worden bedreigd,

      c. taal- en leerproblemen,

      d. somatische aandoeningen,

      e. lichamelijke of verstandelijke beperkingen, en

      f. kindermishandeling en huiselijk geweld.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel2.14
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '2.14'
  - number: '2.2'
    text: |-
      Het college draagt er zorg voor dat de ambtenaar of de functionaris, bedoeld in
      [artikel 11aa, eerste lid, van het Besluit justitiële en strafvorderlijke gegevens][ref1], in het bezit is van een
      verklaring omtrent het gedrag als bedoeld in [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref2],
      die niet ouder is dan twee jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0016544#Artikel11a
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0016544
        artikel: 11a
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '28'
  - number: 3.1.1
    text: |-
      1 Als certificerende instelling wordt aangewezen een instelling die:

      a. rechtspersoonlijkheid heeft,

      b. onafhankelijk is,

      c. haar zetel of vestiging in Nederland heeft,

      d. beschikt over voldoende deskundigheid en toerusting om de uitvoering van de taken naar behoren te vervullen,

      e. beschikt over een behoorlijke administratie waarin de gegevens die samenhangen met en betrekking hebben op de
      uitvoering van haar taken, op een systematische wijze zijn vastgelegd, en

      f. verzekerd is tegen wettelijke aansprakelijkheid voor risico’s die voortvloeien uit de uitoefening van haar
      taken.

      2 De aanwijzing geschiedt voor een periode van vijf jaar.

      3 Bij regeling van Onze Minister van Veiligheid en Justitie kunnen nadere regels gesteld worden met betrekking tot
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel3.1.1
  - number: 3.1.2
    text: |-
      Onze Minister van Veiligheid en Justitie ziet toe op de rechtmatige, doeltreffende en doelmatige uitvoering van het
      bepaalde bij of krachtens de [wet][ref1] door de certificerende instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0034925
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel3.1.2
    references:
      - id: ref1
        bwb_id: BWBR0034925
  - number: 3.1.3
    text: |-
      1 De certificerende instelling verstrekt desgevraagd kosteloos aan Onze Minister van Veiligheid en Justitie de voor
      de uitoefening van zijn taak benodigde inlichtingen. Onze Minister van Veiligheid en Justitie kan inzage vorderen
      van zakelijke gegevens en bescheiden voor zover dat voor de vervulling van zijn taak redelijkerwijs nodig is.

      2 De certificerende instelling zendt Onze Minister van Veiligheid en Justitie jaarlijks een verslag van de
      uitgevoerde werkzaamheden, de rechtmatigheid en doeltreffendheid van die werkzaamheden en de werkwijze in het
      afgelopen jaar. Bij regeling van Onze Minister van Veiligheid en Justitie kunnen nadere regels worden gesteld met
      betrekking tot dit verslag.
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel3.1.3
  - number: 3.1.4
    text: |-
      1 Onze Minister van Veiligheid en Justitie kan de certificerende instelling algemene aanwijzingen geven met
      betrekking tot de uitoefening van haar taak.

      2 De certificerende instelling is gehouden overeenkomstig de aanwijzingen te handelen.
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel3.1.4
  - number: 3.1.5
    text: |-
      1 Indien naar het oordeel van Onze Minister van Veiligheid en Justitie de certificerende instelling haar taak niet
      naar behoren vervult, kan Onze Minister van Veiligheid en Justitie de aanwijzing, bedoeld in [artikel 3.1.1][ref1]
      intrekken.

      2 De aanwijzing wordt niet eerder ingetrokken dan nadat de certificerende instelling in de gelegenheid is gesteld
      om binnen een door Onze Minister van Veiligheid en Justitie te stellen termijn alsnog haar taken naar behoren uit
      te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0035779#Artikel3.1.1
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel3.1.5
    references:
      - id: ref1
        bwb_id: BWBR0035779
        artikel: 3.1.1
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.1.6
    text: |-
      Gedurende de looptijd van de aanwijzing als certificerende instelling stelt Onze Minister van Veiligheid en
      Justitie vast of de instelling nog steeds voldoet aan de bij of krachtens de [wet][ref1] gestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0034925
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel3.1.6
    references:
      - id: ref1
        bwb_id: BWBR0034925
  - number: 3.2.1
    text: |-
      1 De aanvraag voor een certificaat of een voorlopig certificaat wordt ingediend bij de certificerende instelling.

      2 De certificerende instelling beslist binnen zes maanden na ontvangst van de aanvraag.

      3 De vergoeding voor de behandeling van de aanvraag van een certificaat of een voorlopig certificaat is de
      aanvrager verschuldigd aan de gecertificeerde instelling.

      4 Onze Minister van Veiligheid en Justitie kan voor de uitvoering van de in het eerste en tweede lid bedoelde
      werkzaamheden maximumtarieven vaststellen.
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel3.2.1
  - number: 3.2.2
    text: |-
      Een certificaat of een voorlopig certificaat wordt geschorst of ingetrokken door de certificerende instelling:

      a. op grond van feiten of omstandigheden waarvan de certificerende instelling bij de afgifte van het certificaat
      redelijkerwijs niet op de hoogte kon zijn en op grond waarvan de certificerende instelling het certificaat niet zou
      hebben afgegeven;

      b. op grond van door de gecertificeerde instelling verstrekte onjuiste inlichtingen over feiten of omstandigheden,
      mits de onjuistheid daarvan aan de gecertificeerde instelling bekend was of kon zijn;

      c. indien de gecertificeerde instelling niet meer voldoet aan het normenkader, bedoeld in
      [artikel 3.4, vierde lid, van de wet][ref1], of

      d. indien de gecertificeerde instelling haar wettelijke verplichtingen niet meer naar behoren nakomt of de taken
      waarvoor zij is gecertificeerd niet meer naar behoren uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel3.4
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel3.2.2
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '3.4'
  - number: 3.2.3
    text: |-
      1 Gedurende de looptijd van het certificaat stelt de certificerende instelling jaarlijks vast of de gecertificeerde
      instelling nog voldoet aan het normenkader, bedoeld in [artikel 3.4, vierde lid, van de wet][ref1].

      2 De kosten van de controle, bedoeld in het eerste lid, zijn voor rekening van de gecertificeerde instelling.

      3 De gecertificeerde instelling verstrekt de certificerende instelling desgevraagd kosteloos alle informatie die
      nodig is voor de uitvoering van het bepaalde bij of krachtens dit artikel.

      4 Bij regeling van Onze Minister van Veiligheid en Justitie kunnen nadere regels worden gesteld met betrekking tot
      de controle, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel3.4
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel3.2.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '3.4'
  - number: 4.0.1
    text: |-
      De meldplicht, bedoeld in [artikel 4.0.1, eerste lid, van de wet][ref1], is niet van toepassing op de volgende
      categorieën van jeugdhulpaanbieders:

      a. jeugdhulpaanbieders die uitsluitend jeugdhulp leveren die bestaat uit het vervoer van een jeugdige, bedoeld in
      [artikel 2.3, tweede lid, van de wet][ref2]; en

      b. gemeenten.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4.0.1
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel2.3
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel4.0.1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: 4.0.1
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '2.3'
  - number: 4.1.1
    text: |-
      De informatie die het college, de jeugdhulpaanbieder en de gecertificeerde instelling aan jeugdigen, ouders en
      pleegouders verstrekken over de mogelijkheid gebruik te maken van de diensten van een vertrouwenspersoon, bestaat
      in ieder geval uit informatie over:

      a. de onafhankelijke rol van de vertrouwenspersoon;

      b. de aard van de ondersteuning door een vertrouwenspersoon;

      c. de vertrouwelijkheid van die ondersteuning;

      d. het feit dat de ondersteuning kosteloos is, en

      e. de bereikbaarheid en beschikbaarheid van de vertrouwenspersoon.
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel4.1.1
  - number: 4.1.2
    text: De vertrouwenspersoon behoeft geen toestemming van derden om met een jeugdige, ouder of pleegouder te spreken.
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel4.1.2
  - number: 4.1.3
    text: |-
      Het college, de jeugdhulpaanbieder en de gecertificeerde instelling, verschaffen aan de vertrouwenspersoon de
      faciliteiten die deze voor een juiste uitoefening van zijn taak nodig heeft.
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel4.1.3
  - number: 4.1.4
    text: |-
      De vertrouwenspersoon heeft vrije toegang tot de gebouwen van de gemeente voor zover deze gebruikt worden voor de
      toeleiding naar, advisering over, de bepaling en het inzetten van de aangewezen voorziening, en tot de gebouwen,
      terreinen en ruimten van jeugdhulpaanbieders en gecertificeerde instellingen waar jeugdigen zich kunnen bevinden,
      een en ander voor zover dit voor een juiste uitoefening van zijn taak nodig is.
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel4.1.4
  - number: 4.1.5
    text: |-
      Onverminderd het bij of krachtens de [wet][ref1] bepaalde verschaffen het college, de jeugdhulpaanbieder en de
      gecertificeerde instelling aan de vertrouwenspersoon alle inlichtingen en tonen zij alle bescheiden die deze voor
      een juiste uitoefening van zijn taak nodig heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0034925
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel4.1.5
    references:
      - id: ref1
        bwb_id: BWBR0034925
  - number: 4.2.1
    text: |-
      1 Binnen vijf werkdagen nadat de voogdij aan de gecertificeerde instelling is opgedragen en zij hiervan in kennis
      is gesteld, wijst de gecertificeerde instelling een voogdijwerker aan en vindt het eerste contact plaats tussen de
      voogdijwerker en de minderjarige en zijn ouders.

      2 De voogdijwerker informeert de minderjarige en diens ouders over de medewerker die de voogdijwerker bij zijn
      afwezigheid vervangt.
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel4.2.1
  - number: 4.2.2
    text: |-
      1 Binnen vijf werkdagen nadat de gecertificeerde instelling is belast met de uitvoering van de
      ondertoezichtstelling en zij hiervan in kennis is gesteld, wijst de gecertificeerde instelling een
      gezinsvoogdijwerker aan en vindt het eerste contact plaats tussen de gezinsvoogdijwerker en de minderjarige en de
      met het gezag belaste ouder of voogd.

      2 De gezinsvoogdijwerker doet mededeling aan de minderjarige en de met het gezag belaste ouder of voogd over:

      a. de medewerker die de gezinsvoogdijwerker bij zijn afwezigheid vervangt, en

      b. de wijze waarop een verzoek als bedoeld in [artikel 264, eerste lid][ref1], [artikel 265, eerste lid][ref2], en
      [artikel 265d, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref3] moet worden gedaan.

      3 De gecertificeerde instelling kan, al dan niet op verzoek van de minderjarige, de met het gezag belaste ouder of
      voogd, een andere medewerker als gezinsvoogdijwerker aanwijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel264
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel265
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel265d
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel4.2.2
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '264'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '265'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: 265d
  - number: 4.2.3
    text: |-
      1 Binnen vijf werkdagen nadat de gecertificeerde instelling is belast met de uitvoering van de jeugdreclassering en
      zij hiervan in kennis is gesteld, wijst de gecertificeerde instelling een jeugdreclasseringswerker aan en vindt het
      eerste contact plaats tussen de jeugdreclasseringswerker en de jeugdige en zijn ouders of zijn voogd.

      2 De jeugdreclasseringswerker doet mededeling aan de jeugdige en zijn ouders of zijn voogd over:

      a. de medewerker die de jeugdreclasseringswerker bij zijn afwezigheid vervangt, en

      b. de verplichtingen die voortvloeien uit de strafrechtelijke beslissing.
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel4.2.3
  - number: 4.2.4
    text: |-
      De gecertificeerde instelling beziet zo vaak als noodzakelijk, doch ten minste eenmaal per jaar, in hoeverre het
      plan van aanpak, bedoeld in [artikel 4.1.3 van de wet][ref1], bijstelling behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4.1.3
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel4.2.4
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: 4.1.3
  - number: 4.2.5
    text: |-
      1 Onverminderd de aan de raad voor de kinderbescherming toekomende taken en bevoegdheden, voldoet de
      gecertificeerde instelling aan verzoeken van de rechter, het openbaar ministerie of de directeur van de justitiële
      jeugdinrichting om advies omtrent een jeugdige die wordt verdacht van een strafbaar feit of die op grond daarvan
      is veroordeeld.

      2 De gecertificeerde instelling brengt geregeld, doch ten minste eenmaal per zes maanden, verslag uit aan het
      openbaar ministerie dat is belast met het toezicht op de naleving van de voorwaarden in het kader van de uitvoering
      van jeugdreclassering, over de wijze waarop de jeugdige zich houdt aan de voorwaarden die de rechter of het
      openbaar ministerie heeft opgelegd.

      3 Indien de jeugdige een opgelegde voorwaarde in het kader van de uitvoering van jeugdreclassering niet of niet
      geheel nakomt, meldt de gecertificeerde instelling dit onverwijld aan het openbaar ministerie of aan de directeur
      van de justitiële jeugdinrichting in het kader van een scholings- en trainingprogramma.

      4 De gecertificeerde instelling zendt de raad voor de kinderbescherming een afschrift van het verslag, bedoeld in
      het tweede lid, en van de melding, bedoeld in het derde lid, voortvloeiend uit de toezichthoudende taak van de raad
      voor de kinderbescherming, bedoeld in [artikel 77hh van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77hh
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel4.2.5
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77hh
  - number: 5.1.1
    text: |-
      1 Indien toepassing is gegeven aan [artikel 5.2.1, eerste lid][ref1], dragen de jeugdhulpaanbieder, de
      gecertificeerde instelling en het college, voor zover het betreft de toeleiding naar, advisering over, de
      bepaling en het inzetten van de aangewezen voorziening, er zorg voor dat de taken worden uitgevoerd door of onder
      verantwoordelijkheid van een geregistreerde professional. De jeugdhulpaanbieder, de gecertificeerde instelling
      en het college delen de taken toe met inachtneming van de specifieke kennis en vaardigheden van de geregistreerde
      professional.

      2 In afwijking van het eerste lid kan de jeugdhulpaanbieder, de gecertificeerde instelling of het college anderen
      dan geregistreerde professionals met de uitvoering van taken belasten indien hij of zij aannemelijk kan maken
      dat de kwaliteit van de uit te voeren taak daardoor niet nadelig wordt beïnvloed. In afwijking van het eerste
      lid belast de jeugdhulpaanbieder, de gecertificeerde instelling of het college anderen met die taken, indien dit
      noodzakelijk is voor de kwaliteit van uit te voeren taak.

      3 De jeugdhulpaanbieder, de gecertificeerde instelling en het college dragen er zorg voor dat geregistreerde
      professionals hun taken kunnen verrichten met inachtneming van de voor hen geldende professionele standaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0035779#Artikel5.2.1
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel5.1.1
    references:
      - id: ref1
        bwb_id: BWBR0035779
        artikel: 5.2.1
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.1.2
    text: |-
      Indien de mogelijkheid tot registratie in het kwaliteitsregister jeugd wordt uitgebreid naar nieuwe categorieën van
      beoefenaren van beroepen in het jeugddomein, blijft [artikel 5.1.1][ref1] gedurende een termijn van een jaar buiten
      toepassing op werktoedelingen waarvan het college voor zover het betreft de toeleiding naar, de advisering over,
      de bepaling en het inzetten van de aangewezen voorziening, de jeugdhulpaanbieder of de gecertificeerde instelling
      aannemelijk kan maken dat die toedeling plaatsvindt aan een niet tot die categorie behorende beroepsbeoefenaar,
      indien die beroepsbeoefenaar reeds bij de aanvang van die periode binnen de betreffende organisatie werkzaam was.


      [ref1]: https://wetten.overheid.nl/BWBR0035779#Artikel5.1.1
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel5.1.2
    references:
      - id: ref1
        bwb_id: BWBR0035779
        artikel: 5.1.1
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.1.3
    text: |-
      Indien de mogelijkheid tot registratie in het kwaliteitsregister jeugd wordt uitgebreid naar nieuwe categorieën
      van beoefenaren van beroepen in het jeugddomein, kan gedurende een termijn van vijf jaar en drie maanden vanaf het
      tijdstip van aanvang van die termijn in afwijking van [artikel 5.4.2, eerste lid, aanhef en onder c][ref1], een tot
      die categorie behorende beroepsbeoefenaar in het kwaliteitsregister jeugd zijn ingeschreven indien:

      a. die beroepsbeoefenaar op het tijdstip waarop de termijn aanvangt werkzaam is voor het college voor zover het
      betreft de toeleiding naar, de advisering over, de bepaling en het inzetten van de aangewezen voorziening, voor de
      jeugdhulpaanbieder of voor de gecertificeerde instelling in een functie waarvoor scholing is vereist op het niveau
      van een hogere beroepsopleiding;

      b. de aan de registratie van de beroepsbeoefenaar ten grondslag liggende aanvraag is ingediend binnen drie maanden
      na het tijdstip waarop de termijn is aangevangen;

      c. de beroepsbeoefenaar deelneemt aan een scholingstraject dat erop gericht is uiterlijk bij de eerste
      herregistratie de scholing op het niveau van hoger beroepsonderwijs te voltooien, en

      d. de registerstichting bij de uitvoering van [artikel 5.4.4][ref2] ervoor zorg draagt dat voor een ieder kenbaar
      is dat de registratie van de beroepsbeoefenaar valt onder de werking van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0035779#Artikel5.4.2
      [ref2]: https://wetten.overheid.nl/BWBR0035779#Artikel5.4.4
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel5.1.3
