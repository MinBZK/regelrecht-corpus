  - number: 7.1.1
    text: |-
      Als categorieën van instanties als bedoeld in [artikel 7.1.1.2, eerste lid, onder a, van de wet][ref1] in het
      domein jeugdhulp worden aangewezen:

      a. gemeenten voor zover het betreft de toeleiding naar, advisering over, de bepaling en het inzetten van de
      aangewezen voorziening;

      b. Veilig Thuis-organisaties;

      c. jeugdhulpaanbieders;

      d. gecertificeerde instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7.1.1.2
