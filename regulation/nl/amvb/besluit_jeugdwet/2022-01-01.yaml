        paragraaf: '5.1'
  - number: 5.2.1
    text: |-
      1 Onze Ministers kunnen op aanvraag van de beheerder van een beroepsregister dat register als enig
      kwaliteitsregister jeugd erkennen.

      2 De beheerder van het kwaliteitsregister jeugd is een stichting als bedoeld in
      [artikel 285, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel285
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel5.2.1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '285'
  - number: 5.2.2
    text: |-
      De erkenning, bedoeld in [artikel 5.2.1, eerste lid][ref1], vindt slechts plaats indien het beroepsregister
      onderscheidenlijk de registerstichting voldoet aan de in de [artikelen 5.3.1 tot en met 5.4.4][ref2] gestelde
      voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0035779#Artikel5.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0035779#Artikel5.3.1
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel5.2.2
    references:
      - id: ref1
        bwb_id: BWBR0035779
        artikel: 5.2.1
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0035779
        artikel: 5.3.1
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.2.3
    text: |-
      1 Onze Ministers kunnen een erkenning als bedoeld in [artikel 5.2.1, eerste lid][ref1], intrekken:

      a. indien de registerstichting handelt in strijd met de in dit hoofdstuk neergelegde erkenningsvoorwaarden;

      b. indien de registerstichting anderszins niet of niet langer voldoet aan de bij dit besluit gestelde eisen;

      c. indien de registerstichting niet naar behoren functioneert, of

      d. op verzoek van de registerstichting.

      2 Onze Ministers kunnen in het belang van de jeugdhulp een termijn vaststellen waarop de intrekking zal
      plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0035779#Artikel5.2.1
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel5.2.3
    references:
      - id: ref1
        bwb_id: BWBR0035779
        artikel: 5.2.1
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.3.1
    text: |-
      1 De leden van het bestuur van de registerstichting worden benoemd op voordracht van beroepsverenigingen waarbij
      beroepsbeoefenaren zijn aangesloten die van relevant belang zijn voor de beroepsuitoefening in het jeugddomein.

      2 De statuten van de registerstichting regelen de mogelijkheid tot aanwijzing van andere beroepsverenigingen van
      relevant belang voor de beroepsuitoefening in het jeugddomein, die gerechtigd zijn tot een voordracht van leden van
      het bestuur.
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel5.3.1
  - number: 5.3.2
    text: |-
      De statuten van de registerstichting regelen op afdoende wijze dat de leden van het bestuur, dan wel leden van
      andere organen van de registerstichting geen functies vervullen die onverenigbaar, strijdig zijn of strijdig kunnen
      zijn met de belangen of doelstellingen van de registerstichting.
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel5.3.2
  - number: 5.3.3
    text: |-
      1 De statuten van de registerstichting voorzien in een raad van advies, bestaande uit leden die in ieder geval
      organisaties van werkgevers en cliënten vertegenwoordigen.

      2 De raad van advies heeft in ieder geval het recht advies uit te brengen over:

      a. de voorwaarden voor registratie en herregistratie;

      b. een aanwijzing als bedoeld in [artikel 5.3.1, tweede lid][ref1];

      c. de samenstelling van de raad van advies.

      3 De statuten voorzien erin dat van een door de raad van advies uitgebracht advies slechts schriftelijk en
      gemotiveerd kan worden afgeweken nadat over het advies een op overeenstemming gericht overleg heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0035779#Artikel5.3.1
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel5.3.3
    references:
      - id: ref1
        bwb_id: BWBR0035779
        artikel: 5.3.1
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.4.1
    text: |-
      1 De registerstichting regelt de wijze van registratie en herregistratie van beroepsbeoefenaren en zorgt ervoor
      dat:

      a. registratie en herregistratie op zorgvuldige wijze plaatsvinden;

      b. de registratie een geldigheid heeft van een door de registerstichting vast te stellen periode, en

      c. herregistratie plaatsvindt op voorwaarde dat de betrokkene in de periode, bedoeld onder b, heeft voldaan aan
      door de registerstichting te stellen eisen van werkervaring en van na- en bijscholing.

      2 De registerstichting regelt voorts dat voorafgaand aan de wijziging van de eisen van registratie overleg wordt
      gevoerd met de beroepsverenigingen, bedoeld in [artikel 5.3.1, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035779#Artikel5.3.1
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel5.4.1
    references:
      - id: ref1
        bwb_id: BWBR0035779
        artikel: 5.3.1
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.4.2
    text: |-
      1 De registerstichting:

      a. regelt dat het kwaliteitsregister jeugd slechts opengesteld wordt voor registratie voor beroepsbeoefenaren die
      behoren tot bij een van de voordragende beroepsverenigingen aangesloten categorieën van beroepsbeoefenaren;

      b. hanteert niet het vereiste van lidmaatschap van een beroepsvereniging voor opname in het kwaliteitsregister
      jeugd;

      c. stelt het register open voor de registratie van beroepsbeoefenaren die minimaal op het niveau van een hogere
      beroepsopleiding scholing hebben afgerond, die is gericht op het vervullen van een beroep in het jeugddomein.

      2 De door de registerstichting in rekening te brengen kosten voor registratie in het beroepsregister worden zodanig
      vastgesteld dat de baten niet uitgaan boven de kosten die redelijkerwijs noodzakelijk zijn voor de verwezenlijking
      van de doelstellingen van de registerstichting.
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel5.4.2
  - number: 5.4.3
    text: |-
      1 De registerstichting waarborgt dat de in het kwaliteitsregister jeugd opgenomen beroepsbeoefenaren dienen te
      handelen volgens voor hen geldende professionele standaarden.

      2 De statuten van de registerstichting voorzien in de binding van de geregistreerde beroepsbeoefenaren aan
      een adequaat systeem van normhandhaving op grond waarvan passende maatregelen kunnen worden genomen tegen
      beroepsbeoefenaren die niet voldoen aan de voor hen geldende professionele standaarden.
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel5.4.3
  - number: 5.4.4
    text: |-
      De registerstichting regelt dat het beroepsregister voor een ieder kosteloos raadpleegbaar is. Zij regelt voorts
      dat de maatregelen bedoeld in [artikel 5.4.3, tweede lid][ref1], gedurende een door haar vast te stellen periode
      voor het publiek kenbaar zijn. Zij houdt daarbij rekening met de aard van de maatregelen, de verwijtbaarheid van
      het handelen en het belang van degenen die daarvan kennis kunnen nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0035779#Artikel5.4.3
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel5.4.4
    references:
      - id: ref1
        bwb_id: BWBR0035779
        artikel: 5.4.3
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 5.5.1
    text: |-
      Na de beëindiging van de erkenning verleent de registerstichting alle medewerking die noodzakelijk is voor de
      overdracht van taken aan een andere, door Onze Ministers aan te wijzen organisatie.
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel5.5.1
  - number: 5.5.2
    text: |-
      1 De registerstichting verstrekt aan Onze Ministers kosteloos op verzoek alle in haar bezit zijnde, op het
      functioneren van de registerstichting of het kwaliteitsregister jeugd betrekking hebbende informatie die
      redelijkerwijs noodzakelijk is om te beoordelen of de registerstichting of het kwaliteitsregister jeugd op enig
      moment voldoet aan de bij dit besluit gestelde eisen, dan wel de informatie die redelijkerwijs noodzakelijk is om
      ten minste inzicht te krijgen in de aantallen registraties, de aard van de registraties en de ontwikkelingen rond
      het systeem van normhandhaving, bedoeld in [artikel 5.4.3, tweede lid][ref1].

      2 De registerstichting meldt voorgenomen wijzingen van haar statuten aan Onze Ministers.


      [ref1]: https://wetten.overheid.nl/BWBR0035779#Artikel5.4.3
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel5.5.2
    references:
      - id: ref1
        bwb_id: BWBR0035779
        artikel: 5.4.3
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 5.5.3
    text: |-
      1 De registerstichting stelt over ieder kalenderjaar een verslag op met betrekking tot de uitvoering van de met dit
      besluit samenhangende werkzaamheden.

      2 Het jaarverslag bevat in ieder geval een beschrijving van de werkzaamheden, bedoeld in het eerste lid, en geeft
      inzicht in:

      a. de voorbereiding en uitvoering van de werkzaamheden;

      b. de kwaliteit van de daarbij gevolgde procedures;

      c. de behandeling van personen en instellingen die met de registerstichting in aanraking komen, en

      d. de werkzaamheden, samenhangend met [artikel 5.4.3, tweede lid][ref1].

      3 Het jaarverslag geeft tevens cijfermatig inzicht in de gegevens, bedoeld in het tweede lid, onder a, c en d.

      4 De registerstichting zendt het jaarverslag voor 1 mei, volgend op het verslagjaar, aan Onze Ministers en de
      beroepsverenigingen, bedoeld in [artikel 5.3.1, eerste lid][ref2].

      5 Het jaarverslag gaat vergezeld van een verklaring van een accountant die is ingeschreven in het register, bedoeld
      in [artikel 36, eerste lid, van de Wet toezicht accountantsorganisaties][ref3]. De verklaring:

      a. doet mededeling omtrent de getrouwheid van het jaarverslag; en

      b. geeft er blijk van dat de accountant heeft onderzocht of de registerstichting, onderscheidenlijk het
      kwaliteitsregister, heeft voldaan aan de bij dit besluit gestelde verplichtingen en wat daarvan de bevindingen
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0035779#Artikel5.4.3
      [ref2]: https://wetten.overheid.nl/BWBR0035779#Artikel5.3.1
      [ref3]: https://wetten.overheid.nl/BWBR0019468#Artikel36
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel5.5.3
    references:
      - id: ref1
        bwb_id: BWBR0035779
        artikel: 5.4.3
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref2
        bwb_id: BWBR0035779
        artikel: 5.3.1
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref3
        bwb_id: BWBR0019468
        artikel: '36'
  - number: 5.5.4
    text: |-
      Van de erkenning, bedoeld in [artikel 5.2.1, eerste lid][ref1], en de intrekking van de erkenning, bedoeld in
      [artikel 5.2.3, eerste lid][ref2], wordt mededeling gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0035779#Artikel5.2.1
