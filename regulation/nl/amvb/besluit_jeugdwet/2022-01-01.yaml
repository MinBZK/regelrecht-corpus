  - number: 6.1.1
    text: |-
      1 Een gesloten accommodatie is geschikt om:

      a. te voorkomen dat daar geplaatste jeugdigen zich ontrekken of onttrokken worden aan de jeugdhulp die nodig is in
      verband met ernstige opgroei- of opvoedingsproblemen, en

      b. daar geplaatste jeugdigen te doen verblijven in een veilige, beschermde omgeving, die voldoende privacy biedt.

      2 Bij regeling van Onze Ministers kunnen nadere regels worden gesteld met betrekking tot de uitvoering van het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel6.1.1
  - number: 6.2.1
    text: |-
      Indien de klager daarom verzoekt, wordt de klacht ter kennis gebracht van één lid van de klachtencommissie teneinde
      te bemiddelen.
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel6.2.1
  - number: 6.2.2
    text: |-
      1 De klager kan zich doen bijstaan door een vertrouwenspersoon of een andere persoon.

      2 Indien de klager de Nederlandse taal onvoldoende beheerst, draagt de voorzitter van de klachtencommissie zorg
      voor de bijstand van een tolk.
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel6.2.2
  - number: 6.2.3
    text: |-
      Van de klachtencommissie maken in ieder geval deel uit:

      a. een jurist;

      b. een gekwalificeerde gedragswetenschapper, en

      c. 1°. een arts, indien het een klacht betreft tegen een geneeskundige behandelingsmethode als bedoeld in
      [artikel 6.3.2, eerste lid, onderdeel b, van de wet][ref1], niet zijnde een behandeling van een stoornis van de
      geestvermogens, of

      2°. een psychiater, indien het een klacht betreft tegen een geneeskundige behandelingsmethode als bedoeld in
      [artikel 6.3.2, eerste lid, onderdeel b, van de wet][ref2], indien het gaat om een behandeling van een stoornis van
      de geestvermogens.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6.3.2
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6.3.2
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel6.2.3
