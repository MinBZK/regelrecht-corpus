        artikel: 8.3.1
      - id: ref5
        bwb_id: BWBR0034925
        artikel: 8.3.1
  - number: '10.4'
    text: |-
      Een erkenning van een beroepsregister als enig kwaliteitsregister jeugd door Onze Ministers op grond van
      [artikel 68a, eerste lid, van het Uitvoeringsbesluit Wet op de jeugdzorg][ref1], geldt als erkenning op grond van
      [artikel 5.2.1, eerste lid][ref2], van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel68a
      [ref2]: https://wetten.overheid.nl/BWBR0035779#Artikel5.2.1
    url: https://wetten.overheid.nl/BWBR0035779/2022-01-01#Artikel10.4
