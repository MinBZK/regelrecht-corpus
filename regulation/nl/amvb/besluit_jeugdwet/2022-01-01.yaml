  - number: '1.2'
    text: |-
      1 De verantwoordelijkheid van het college, bedoeld in [artikel 1.3, tweede lid, van de wet][ref1] geldt tevens ten
      aanzien van vreemdelingen die geen rechtmatig verblijf in Nederland hebben en die de leeftijd van achttien jaar nog
      niet hebben bereikt.

      2 Indien ten aanzien van een vreemdeling als bedoeld in het eerste lid een voorziening inhoudende jeugdhulp
      met verblijf aangewezen is, treft het college slechts een voorziening inhoudende verblijf bij een pleegouder,
      indien dit noodzakelijk is in het belang van de ontwikkeling van die vreemdeling. Indien het college voor een
      vreemdeling verblijf bij een pleegouder geboden acht, geeft hij aan waarom hij verblijf in een accommodatie van een
      jeugdhulpaanbieder niet aangewezen acht.

      3 De duur van de voorziening voor een vreemdeling als bedoeld in het eerste lid, is in overeenstemming met de
      verwachte duur van het verblijf in Nederland en is ten hoogste een half jaar.

      4 Indien het college een voorziening als bedoeld in [artikel 2.3, eerste lid, van de wet][ref2] treft ten
      behoeve van een vreemdeling, is de duur van die voorziening ten hoogste een half jaar, indien de vreemdeling een
      verblijfsvergunning regulier voor bepaalde tijd bezit, die is verleend onder de beperking die verband houdt met
      tijdelijke humanitaire gronden als bedoeld in [artikel 3.5, tweede lid, van het Vreemdelingenbesluit 2000][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1.3
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel2.3
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3.5
