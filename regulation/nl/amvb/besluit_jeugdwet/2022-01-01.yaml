  - number: 5.1.4
    text: |-
      1 De aanvang van de termijnen, bedoeld in de [artikelen 5.1.2][ref1] en [5.1.3][ref2], wordt bij besluit van Onze
      Ministers vastgesteld.

      2 De termijnen, bedoeld in de [artikelen 5.1.2][ref3] en [5.1.3][ref4], kunnen bij besluit van Onze Ministers
      worden gewijzigd, indien het in het belang van de continuïteit van de werktoedeling noodzakelijk is.

      3 De besluiten, bedoeld in het eerste en tweede lid, worden bekend gemaakt in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0035779#Artikel5.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0035779#Artikel5.1.3
