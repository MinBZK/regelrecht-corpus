  - number: 4.0.a2
    text: |-
      1 De interne toezichthouder bestaat uit ten minste drie natuurlijke personen.

      2 Een persoon wordt voor ten hoogste vier jaar aangesteld als lid van de interne toezichthouder van de
      jeugdhulpaanbieder of de gecertificeerde instelling. Deze periode kan eenmaal met ten hoogste vier jaar worden
      verlengd. De al dan niet aaneengesloten totale periode waarin een persoon lid is van de interne toezichthouder van
      de jeugdhulpaanbieder of de gecertificeerde instelling is ten hoogste acht jaar.
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel4.0.a2
  - number: 4.0.a3
    text: |-
      1 De jeugdhulpaanbieder of de gecertificeerde instelling borgt de onafhankelijke taakvervulling door de interne
      toezichthouder. Dit betekent in ieder geval dat:

      a. een lid van de interne toezichthouder geen andere financiële vergoeding van de jeugdhulpaanbieder of de
      gecertificeerde instelling ontvangt dan een passende vergoeding voor de als lid van de interne toezichthouder
      verrichte werkzaamheden;

      b. een lid van de interne toezichthouder, diens echtgenoot of andere levensgezel, pleegkind of bloed- of aanverwant
      tot in de tweede graad:

      1°. tijdens dan wel in de periode van drie jaar voorafgaand aan het lidmaatschap van de interne toezichthouder geen
      lid is van de dagelijkse of algemene leiding van de jeugdhulpaanbieder of de gecertificeerde instelling;

      2°. in de periode van een jaar voorafgaand aan het lidmaatschap van de interne toezichthouder niet tijdelijk heeft
      voorzien in de dagelijkse of algemene leiding van de jeugdhulpaanbieder of de gecertificeerde instelling bij belet
      of ontstentenis van een of meer leden van de dagelijkse of algemene leiding;

      3°. tijdens dan wel in de periode van drie jaar voorafgaand aan het lidmaatschap van de interne toezichthouder
      geen werknemer van de jeugdhulpaanbieder of de gecertificeerde instelling is dan wel krachtens een overeenkomst van
      opdracht werkzaamheden voor de jeugdhulpaanbieder of de gecertificeerde instelling heeft verricht;

      4°. tijdens dan wel in de periode van drie jaar voorafgaand aan het lidmaatschap van de interne toezichthouder geen
      zakelijke relatie onderhoudt met de jeugdhulpaanbieder of de gecertificeerde instelling die de onafhankelijkheid
      van het lid van de interne toezichthouder dan wel het vertrouwen in die onafhankelijkheid in gevaar brengt;

      5°. geen lid is van de dagelijkse of algemene leiding van een andere jeugdhulpaanbieder of gecertificeerde
      instelling indien een lid van de dagelijkse of algemene leiding van de jeugdhulpaanbieder of de gecertificeerde lid
      is van de interne toezichthouder van die andere jeugdhulpaanbieder of de gecertificeerde instelling;

      6°. geen aandelen in de jeugdhulpaanbieder of de gecertificeerde instelling houdt;

      7°. geen lid is van de dagelijkse of algemene leiding van een rechtspersoon die aandelen in de jeugdhulpaanbieder
      of de gecertificeerde instelling houdt dan wel van een andere jeugdhulpaanbieder of gecertificeerde instelling
      die binnen het verzorgingsgebied van de jeugdhulpaanbieder of de gecertificeerde instelling geheel of gedeeltelijk
      dezelfde werkzaamheden verricht;

      8°. geen lid is van de interne toezichthouder van een andere jeugdhulpaanbieder of gecertificeerde
      instelling die binnen het verzorgingsgebied van de jeugdhulpaanbieder of gecertificeerde instelling geheel
      of gedeeltelijk dezelfde werkzaamheden verricht, tenzij die andere jeugdhulpaanbieder of gecertificeerde
      instelling een dochtermaatschappij van de jeugdhulpaanbieder of gecertificeerde instelling is als bedoeld in
      [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref1] of die andere jeugdhulpaanbieder of gecertificeerde
      instelling met de jeugdhulpaanbieder of de gecertificeerde instelling is verbonden in een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref2];

      9°. geen lid is van de interne toezichthouder van een rechtspersoon die aandelen in de jeugdhulpaanbieder of
      de gecertificeerde instelling houdt, tenzij die rechtspersoon met de jeugdhulpaanbieder of de gecertificeerde
      instelling is verbonden in een groep als bedoeld in [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref3].

      2 Met jeugdhulpaanbieder of gecertificeerde instelling als bedoeld in het eerste lid, onderdelen a en b,
      wordt gelijkgesteld een dochtermaatschappij van de jeugdhulpaanbieder of de gecertificeerde instelling
      als bedoeld in [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref4] alsmede met de jeugdhulpaanbieder
      of de gecertificeerde instelling in een groep verbonden rechtspersonen of vennootschappen als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref5].

      3 Onder lid van de dagelijkse of algemene leiding als bedoeld in de subonderdelen 1°, 5° en 7° van onderdeel b
      van het eerste lid, wordt mede verstaan de natuurlijke persoon die het beleid van de instelling heeft bepaald
      of mede heeft bepaald, als ware hij lid van de dagelijkse of algemene leiding van de jeugdhulpaanbieder of de
      gecertificeerde instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24a
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel24a
      [ref5]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
