  - number: 7.3.1
    text: |-
      1 Indien een meldingsbevoegde een jeugdige die niet beschikt over een burgerservicenummer meldt aan de
      verwijsindex, biedt hij daartoe de volgende gegevens van de jeugdige aan in de verwijsindex:

      a. de familienaam;

      b. de geboortedatum;

      c. het geslacht.

      2 De gegevens, bedoeld in het eerste lid, worden in de verwijsindex omgezet in een verwijsindexservicenummer, dat
      vervolgens gebruikt wordt voor de melding in de verwijsindex.
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel7.3.1
  - number: 7.4.1.1
    text: |-
      1 De aanvraag tot opneming in de autorisatielijst, bedoeld in [artikel 7.2.7 van de wet][ref1], wordt uitsluitend
      gedaan door een jeugdhulpaanbieder.

      2 Bij regeling van Onze Minister van Volksgezondheid, Welzijn en Sport wordt bepaald welke gegevens en bescheiden
      worden verstrekt bij de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7.2.7
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel7.4.1.1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: 7.2.7
  - number: 7.4.1.2
    text: |-
      Onze Minister van Volksgezondheid, Welzijn en Sport stelt, voor zover mogelijk aan de hand van bij of krachtens
      de [wet][ref1] gestelde vereisten voor de hoedanigheid van de jeugdhulpaanbieder, vast of de aanvraag, bedoeld in
      [artikel 7.4.1.1][ref2], is gedaan door een jeugdhulpaanbieder.


      [ref1]: https://wetten.overheid.nl/BWBR0034925
      [ref2]: https://wetten.overheid.nl/BWBR0035779#Artikel7.4.1.1
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel7.4.1.2
    references:
      - id: ref1
        bwb_id: BWBR0034925
      - id: ref2
        bwb_id: BWBR0035779
        artikel: 7.4.1.1
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 7.4.1.3
    text: |-
      1 In de autorisatielijst van jeugdhulpaanbieders wordt per inschrijving opgenomen:

      a. indien de geautoriseerde een natuurlijk persoon is:

      1°. de familienaam en voornamen;

      2°. de geboortedatum en geboorteplaats;

      3°. de titel in de zin van de [Wet op de beroepen in de individuele gezondheidszorg][ref1];

      b. indien de geautoriseerde een rechtspersoon is: naam van de rechtspersoon;

      2 In de autorisatielijst wordt voorts per inschrijving opgenomen:

      a. de aard van de gegevens en bescheiden aan de hand waarvan is vastgesteld dat de geautoriseerde een
      jeugdhulpaanbieder is;

      b. de datum van opname in het register;

      c. het adres van vestiging;

      d. de gegevens met betrekking tot verstrekte en ingetrokken toegangsmiddelen.

      3 Bij regeling van Onze Minister van Volksgezondheid, Welzijn en Sport kunnen nadere regels worden gesteld over de
      opname en verwerking van gegevens in de autorisatielijst.


      [ref1]: https://wetten.overheid.nl/BWBR0006251
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel7.4.1.3
    references:
      - id: ref1
        bwb_id: BWBR0006251
  - number: 7.4.1.4
    text: |-
      De geautoriseerde stelt Onze Minister van Volksgezondheid, Welzijn en Sport onmiddellijk op de hoogte van een
      wijziging van de in de autorisatielijst opgenomen gegevens en van andere omstandigheden die van belang kunnen zijn
      voor het schorsen of doorhalen van de opname.
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel7.4.1.4
  - number: 7.4.1.5
    text: |-
      Zolang de inschrijving van een jeugdhulpaanbieder in het register, bedoeld in
      [artikel 3 van de Wet op de beroepen in de individuele gezondheidszorg][ref1], is geschorst, is zijn opname in de
      autorisatielijst van jeugdhulpaanbieders geschorst.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel7.4.1.5
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
  - number: 7.4.1.6
    text: |-
      Verwijdering van de autorisatielijst kan plaatsvinden:

      a. op verzoek van de geautoriseerde;

      b. indien de geautoriseerde geen jeugdhulpaanbieder meer is;

      c. indien de in de autorisatielijst opgenomen gegevens afwijken van de gegevens die zijn opgenomen in het register
      van de Kamer van Koophandel; of

      d. indien ten aanzien van een ingeschreven natuurlijk persoon een aantekening als bedoeld in
      [artikel 9, eerste tot en met vierde lid, van de Wet op de beroepen in de individuele gezondheidszorg][ref1] in het
      daar genoemde register is geplaatst, waaruit blijkt dat die persoon tijdelijk of blijvend, het betreffende beroep
      in zijn geheel niet langer mag uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel9
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel7.4.1.6
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '9'
  - number: 7.4.1.7
    text: |-
      1 Onze Minister van Volksgezondheid, Welzijn en Sport deelt aan een ieder die daarom verzoekt mee of:

      a. een jeugdhulpaanbieder is opgenomen op de autorisatielijst;

      b. een aan een geautoriseerde verstrekt toegangsmiddel geldig is.

      2 Indien het verzoek wordt gedaan door de beheerder van het nummerregister of van een voorziening, bedoeld in
      [artikel 3, eerste lid, onder d, van de Wet algemene bepalingen burgerservicenummer][ref1], wordt de mededeling,
      bedoeld in het eerste lid, onmiddellijk gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel7.4.1.7
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '3'
  - number: 7.4.2.1
    text: |-
      Jeugdhulpaanbieders kunnen uitsluitend door tussenkomst van de SBV-Z gebruik maken van de voorzieningen, bedoeld in
      [artikel 3, eerste lid, onder c en d, van de Wet algemene bepalingen burgerservicenummer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel7.4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '3'
  - number: 7.4.2.2
    text: |-
      De jeugdhulpaanbieder die is aangesloten op de SBV-Z draagt zorg dat de verbinding van zijn geautomatiseerde
      systeem met de SBV-Z en de uitwisseling van gegevens tussen zijn geautomatiseerde systeem en de SBV-Z functioneren
      op een wijze die overeenstemt met hetgeen daarover in de systeembeschrijving is vastgelegd.
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel7.4.2.2
  - number: 7.4.2.3
    text: |-
      Onze Minister van Volksgezondheid, Welzijn en Sport kan op aanvraag middelen verschaffen waarmee
      de geautoriseerde toegang kan verkrijgen tot de SBV-Z. De [artikelen 18 tot en met 25][ref1] en
      [33 van het Besluit gebruik burgerservicenummer in de zorg][ref2] zijn van overeenkomstige toepassing, met dien
      verstande dat daarbij onder «geregistreerde» verstaan wordt: geautoriseerde.


      [ref1]: https://wetten.overheid.nl/BWBR0023902#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0023902#Artikel33
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel7.4.2.3
    references:
      - id: ref1
        bwb_id: BWBR0023902
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0023902
        artikel: '33'
  - number: 7.5.1
    text: |-
      1 De structurele verstrekking van gegevens, bedoeld in de [artikelen 7.4.2][ref1] en [7.4.3 van de wet][ref2],
      vindt plaats op elektronische wijze aan het Centraal Bureau voor de Statistiek.

      2 Onze Ministers en het college vragen geen gegevens uit ten behoeve van de doelen bedoeld in
      [artikel 7.4.1 van de wet][ref3], indien zij zelf of het Centraal Bureau voor de Statistiek reeds over deze
      gegevens beschikken en deze gegevens gebruikt kunnen worden ten behoeve van deze doelen.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7.4.2
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel7.4.3
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel7.4.1
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel7.5.1
    references:
      - id: ref1
