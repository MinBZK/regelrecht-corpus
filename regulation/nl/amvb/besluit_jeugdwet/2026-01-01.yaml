  - number: 6.1.1
    text: |-
      1 Een gesloten accommodatie is geschikt om te voorkomen dat daar geplaatste jeugdigen zich onttrekken of onttrokken
      worden aan de jeugdhulp die nodig is in verband met ernstige opgroei- of opvoedingsproblemen.

      2 Bij regeling van Onze Ministers kunnen nadere regels worden gesteld met betrekking tot de uitvoering van het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel6.1.1
  - number: 6.1.2
    text: |-
      1 De jeugdhulpaanbieder draagt er zorg voor dat een gesloten accommodatie voor de daar verblijvende jeugdigen en
      werkzame jeugdhulpverleners een veilige en beschermde omgeving is die voldoende privacy biedt.

      2 De jeugdhulpaanbieder stelt voor een gesloten accommodatie een veiligheidsplan vast dat gericht is op het borgen
      van de fysieke en sociale veiligheid en wijst een veiligheidscoördinator aan die zorgdraagt voor de uitvoering van
      het veiligheidsplan.
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel6.1.2
  - number: 6.2.1
    text: |-
      1 Toezicht op een jeugdige als bedoeld in [artikel 6.3.2.1 van de wet][ref1], kan bestaan uit persoonlijk toezicht
      of cameratoezicht. De jeugdhulpaanbieder draagt er zorg voor dat toezicht zoveel mogelijk bestaat uit persoonlijk
      toezicht.

      2 Indien cameratoezicht plaatsvindt, draagt de jeugdhulpverantwoordelijke er zorg voor dat de jeugdige en diens
      bezoekers daarover worden geïnformeerd.

      3 Cameratoezicht in de kamer van de jeugdige, in een afzonderlijke en veilige ruimte als bedoeld
      in [artikel 6.2.6, tweede lid, van de wet][ref2], of tijdens een insluiting als bedoeld in
      [artikel 6.3.2.2, eerste lid, onderdeel f, van de wet][ref3], is niet toegestaan, tenzij de
      jeugdhulpverantwoordelijke een gegronde zorg heeft dat de jeugdige zichzelf tijdens het verblijf in die ruimte
      ernstig letsel toebrengt.

      4 Cameratoezicht is niet toegestaan in sanitaire ruimten.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6.3.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6.2.6
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel6.3.2.2
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel6.2.1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: 6.3.2.1
      - id: ref2
        bwb_id: BWBR0034925
        artikel: 6.2.6
      - id: ref3
        bwb_id: BWBR0034925
        artikel: 6.3.2.2
  - number: 6.2.2
    text: |-
      1 De jeugdhulpaanbieder draagt er zorg voor dat personen die niet betrokken zijn bij de verlening van jeugdhulp aan
      een jeugdige geen toegang hebben tot camerabeelden van die jeugdige.

      2 De jeugdhulpaanbieder draagt er zorg voor dat camerabeelden niet langer dan vier weken bewaard worden.

      3 In afwijking van het tweede lid draagt de jeugdhulpaanbieder er zorg voor dat in geval van een incident of
      calamiteit de camerabeelden van dat incident of die calamiteit bewaard worden tot het moment waarop het onderzoek
      naar en de afwikkeling van dat incident of die calamiteit is afgerond.
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel6.2.2
  - number: 6.2.3
    text: |-
      1 De jeugdhulpaanbieder draagt er zorg voor dat vastpakken of vastpakken en vasthouden als bedoeld in
      [artikel 6.3.2.2, eerste lid, onderdeel a, van de wet][ref1], op proportionele en verantwoorde wijze wordt
      toegepast.

      2 Vastpakken en vasthouden wordt uitsluitend toegepast indien er sprake is van gevaar voor de gezondheid of
      veiligheid van de jeugdige of anderen als gevolg van het gedrag van een jeugdige.

      3 Zodra er niet langer sprake is van gevaar voor de gezondheid of veiligheid wordt het vastpakken en vasthouden
      beëindigd.

      4 Vastpakken en vasthouden wordt uitsluitend toegepast door personen die opgeleid zijn in het proportioneel en op
      verantwoorde wijze toepassen ervan.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6.3.2.2
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel6.2.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: 6.3.2.2
  - number: 6.2.4
    text: |-
      1 Indien een jeugdige is ingesloten als bedoeld in [artikel 6.3.2.2, eerste lid, onderdeel f, van de wet][ref1],
      beoordeelt een gekwalificeerde gedragswetenschapper binnen drie uur of de insluiting noodzakelijk en geschikt is om
      de noodsituatie af te wenden.

      2 De jeugdhulpverantwoordelijke draagt er zorg voor dat een jeugdhulpverlener gedurende een insluiting ten minste
      eenmaal per kwartier de toestand van de jeugdige controleert en, indien de jeugdige dat wenst, rechtstreeks contact
      heeft met de jeugdige.

      3 De gekwalificeerde gedragswetenschapper en de jeugdhulpverantwoordelijke stellen zich regelmatig op de hoogte van
      de toestand van de jeugdige gedurende een insluiting.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6.3.2.2
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel6.2.4
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: 6.3.2.2
  - number: 6.2.5
    text: |-
      1 De verblijfsruimte, bedoeld in de [artikelen 6.2.6, tweede lid][ref1], en
      [6.3.2.2, eerste lid, onderdeel f, van de wet][ref2], is voorzien van goede daglichttoetreding, verlichting, een
      temperatuurregelaar, een ventilatiesysteem en een klok.

      2 De jeugdige die in de verblijfsruimte verblijft, kan de daglichttoetreding, de verlichting, de temperatuur en de
      ventilatie in de verblijfsruimte reguleren en kan gebruikmaken van in die ruimte aanwezige media.

      3 De wanden, deuren, vloer en het meubilair in de verblijfsruimte zijn letselvoorkomend.

      4 De jeugdige wordt in de gelegenheid gesteld persoonlijke eigendommen bij zich te hebben in de verblijfsruimte,
      tenzij deze een gevaar kunnen vormen voor de gezondheid of de veiligheid van de jeugdige.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6.2.6
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6.3.2.2
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel6.2.5
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: 6.2.6
      - id: ref2
        bwb_id: BWBR0034925
        artikel: 6.3.2.2
  - number: 6.2.6
    text: |-
      1 De jeugdige die in de verblijfsruimte, bedoeld in de [artikelen 6.2.6, tweede lid][ref1], en
      [6.3.2.2, eerste lid, onderdeel f, van de wet][ref2], verblijft, kan rechtstreeks contact hebben met een
      jeugdhulpverlener op elk moment dat de jeugdige dat wenst.

      2 Vanuit de verblijfsruimte kan de jeugdige een sanitaire gelegenheid betreden zonder tussenkomst van medewerkers
      van de jeugdhulpaanbieder.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6.2.6
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6.3.2.2
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel6.2.6
