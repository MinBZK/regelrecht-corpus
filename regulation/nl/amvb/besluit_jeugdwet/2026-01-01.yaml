        bwb_id: BWBR0034925
        artikel: '2.11'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '2.11'
  - number: 3.1.1
    text: |-
      1 Als certificerende instelling wordt aangewezen een instelling die:

      a. rechtspersoonlijkheid heeft,

      b. onafhankelijk is,

      c. haar zetel of vestiging in Nederland heeft,

      d. beschikt over voldoende deskundigheid en toerusting om de uitvoering van de taken naar behoren te vervullen,

      e. beschikt over een behoorlijke administratie waarin de gegevens die samenhangen met en betrekking hebben op de
      uitvoering van haar taken, op een systematische wijze zijn vastgelegd, en

      f. verzekerd is tegen wettelijke aansprakelijkheid voor risico’s die voortvloeien uit de uitoefening van haar
      taken.

      2 De aanwijzing geschiedt voor een periode van vijf jaar.

      3 Bij regeling van Onze Minister van Veiligheid en Justitie kunnen nadere regels gesteld worden met betrekking tot
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel3.1.1
  - number: 3.1.2
    text: |-
      Onze Minister van Veiligheid en Justitie ziet toe op de rechtmatige, doeltreffende en doelmatige uitvoering van het
      bepaalde bij of krachtens de [wet][ref1] door de certificerende instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0034925
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel3.1.2
    references:
      - id: ref1
        bwb_id: BWBR0034925
  - number: 3.1.3
    text: |-
      1 De certificerende instelling verstrekt desgevraagd kosteloos aan Onze Minister van Veiligheid en Justitie de voor
      de uitoefening van zijn taak benodigde inlichtingen. Onze Minister van Veiligheid en Justitie kan inzage vorderen
      van zakelijke gegevens en bescheiden voor zover dat voor de vervulling van zijn taak redelijkerwijs nodig is.

      2 De certificerende instelling zendt Onze Minister van Veiligheid en Justitie jaarlijks een verslag van de
      uitgevoerde werkzaamheden, de rechtmatigheid en doeltreffendheid van die werkzaamheden en de werkwijze in het
      afgelopen jaar. Bij regeling van Onze Minister van Veiligheid en Justitie kunnen nadere regels worden gesteld met
      betrekking tot dit verslag.
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel3.1.3
  - number: 3.1.4
    text: |-
      1 Onze Minister van Veiligheid en Justitie kan de certificerende instelling algemene aanwijzingen geven met
      betrekking tot de uitoefening van haar taak.

      2 De certificerende instelling is gehouden overeenkomstig de aanwijzingen te handelen.
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel3.1.4
  - number: 3.1.5
    text: |-
      1 Indien naar het oordeel van Onze Minister van Veiligheid en Justitie de certificerende instelling haar taak niet
      naar behoren vervult, kan Onze Minister van Veiligheid en Justitie de aanwijzing, bedoeld in [artikel 3.1.1][ref1]
      intrekken.

      2 De aanwijzing wordt niet eerder ingetrokken dan nadat de certificerende instelling in de gelegenheid is gesteld
      om binnen een door Onze Minister van Veiligheid en Justitie te stellen termijn alsnog haar taken naar behoren uit
      te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0035779#Artikel3.1.1
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel3.1.5
    references:
      - id: ref1
        bwb_id: BWBR0035779
        artikel: 3.1.1
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.1.6
    text: |-
      Gedurende de looptijd van de aanwijzing als certificerende instelling stelt Onze Minister van Veiligheid en
      Justitie vast of de instelling nog steeds voldoet aan de bij of krachtens de [wet][ref1] gestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0034925
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel3.1.6
    references:
      - id: ref1
        bwb_id: BWBR0034925
  - number: 3.2.1
    text: |-
      1 De aanvraag voor een certificaat of een voorlopig certificaat wordt ingediend bij de certificerende instelling.

      2 De certificerende instelling beslist binnen zes maanden na ontvangst van de aanvraag.

      3 De vergoeding voor de behandeling van de aanvraag van een certificaat of een voorlopig certificaat is de
      aanvrager verschuldigd aan de gecertificeerde instelling.

      4 Onze Minister van Veiligheid en Justitie kan voor de uitvoering van de in het eerste en tweede lid bedoelde
      werkzaamheden maximumtarieven vaststellen.
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel3.2.1
  - number: 3.2.2
    text: |-
      Een certificaat of een voorlopig certificaat wordt geschorst of ingetrokken door de certificerende instelling:

      a. op grond van feiten of omstandigheden waarvan de certificerende instelling bij de afgifte van het certificaat
      redelijkerwijs niet op de hoogte kon zijn en op grond waarvan de certificerende instelling het certificaat niet zou
      hebben afgegeven;

      b. op grond van door de gecertificeerde instelling verstrekte onjuiste inlichtingen over feiten of omstandigheden,
      mits de onjuistheid daarvan aan de gecertificeerde instelling bekend was of kon zijn;

      c. indien de gecertificeerde instelling niet meer voldoet aan het normenkader, bedoeld in
      [artikel 3.4, vierde lid, van de wet][ref1], of

      d. indien de gecertificeerde instelling haar wettelijke verplichtingen niet meer naar behoren nakomt of de taken
      waarvoor zij is gecertificeerd niet meer naar behoren uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel3.4
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel3.2.2
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '3.4'
  - number: 3.2.3
    text: |-
      1 Gedurende de looptijd van het certificaat stelt de certificerende instelling jaarlijks vast of de gecertificeerde
      instelling nog voldoet aan het normenkader, bedoeld in [artikel 3.4, vierde lid, van de wet][ref1].

      2 De kosten van de controle, bedoeld in het eerste lid, zijn voor rekening van de gecertificeerde instelling.

      3 De gecertificeerde instelling verstrekt de certificerende instelling desgevraagd kosteloos alle informatie die
      nodig is voor de uitvoering van het bepaalde bij of krachtens dit artikel.

      4 Bij regeling van Onze Minister van Veiligheid en Justitie kunnen nadere regels worden gesteld met betrekking tot
      de controle, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel3.4
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel3.2.3
