articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *beroepsregister:* register waarin beoefenaren van beroepen in het jeugddomein worden ingeschreven en dat tot
      doel heeft de kwaliteit van de beroepsbeoefening te bevorderen en te handhaven;
        - *geregistreerde jeugdprofessional:* beroepsbeoefenaar die is ingeschreven in het kwaliteitsregister jeugd;
        - *geregistreerde professional:* geregistreerde jeugdprofessional of beroepsbeoefenaar die als arts,
      verpleegkundige, gezondheidszorgpsycholoog, orthopedagoog-generalist of psychotherapeut is ingeschreven in een
      register als bedoeld in [artikel 3 van de Wet op de beroepen in de individuele gezondheidszorg][ref1];
        - *gezinsvoogdijwerker:* medewerker van een gecertificeerde instelling, belast met het uitvoeren van de
      ondertoezichtstelling, bedoeld in [artikel 255 van Boek 1 van het Burgerlijk Wetboek][ref2] en de voorlopige
      ondertoezichtstelling, bedoeld in [artikel van 257 Boek 1 van het Burgerlijk Wetboek][ref3];
        - *interne toezichthouder:* interne toezichthouder als bedoeld in
      [artikel 4.4.1, eerste lid, onderdeel a, van de wet][ref4];
        - *jeugddomein:* terrein waarop aanbieders van jeugdhulp, uitvoerders van kinderbeschermingsmaatregelen en
      jeugdreclassering, Veilig Thuis-organisaties, colleges voor zover het betreft de toeleiding naar, advisering
      over en de bepaling van de aangewezen voorziening, justitiële jeugdinrichtingen, Halt-bureaus en de raad voor de
      kinderbescherming, werkzaam zijn;
        - *jeugdreclasseringswerker:* medewerker van een gecertificeerde instelling, belast met het uitvoeren van
      jeugdreclassering;
        - *klacht:* klacht als bedoeld in [artikel 6.5.1, eerste lid, van de wet][ref5];
        - *klachtencommissie:* klachtencommissie, bedoeld in [artikel 4.2.1, tweede lid, van de wet][ref6], voor zover deze
      klachten behandelt over een beslissing als bedoeld in [artikel 6.5.1, eerste lid, van de wet][ref7];
        - *klager:* degene die een klacht als bedoeld in [artikel 6.5.1, eerste lid, van de wet][ref8] indient;
        - *kwaliteitsregister jeugd:* door Onze Ministers op grond van [artikel 5.2.1, eerste lid][ref9], erkend register;
        - *multidisciplinaire jeugdhulp:* het gezamenlijk en in onderlinge samenhang verlenen van jeugdhulp door
      jeugdhulpverleners van verschillende disciplines dan wel het gezamenlijk en in onderlinge samenhang verlenen van
      jeugdhulp en zorg door jeugdhulpverleners en zorgverleners;
        - *registerstichting:* stichting, bedoeld in [artikel 5.2.1, tweede lid][ref10];
        - *SBV-Z:* sectorale berichtenvoorziening in de zorg als bedoeld in
      [artikel 11 van het Besluit gebruik burgerservicenummer in de zorg][ref11];
        - *voogdijwerker:* medewerker van een gecertificeerde instelling, belast met het uitvoeren van de voogdij en de
      voorlopige voogdij op grond van [Boek 1 van het Burgerlijk Wetboek][ref12];
        - *vreemdeling:* vreemdeling als bedoeld in de [Vreemdelingenwet 2000][ref13];
        - *wet:* [Jeugdwet][ref14].


