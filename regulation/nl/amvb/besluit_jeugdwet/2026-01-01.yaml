        artikel: 7.4.3
  - number: 7.5.4
    text: |-
      1 Bij regeling van Onze Ministers wordt voor het structureel verstrekken van de gegevens, genoemd in
      [artikel 7.5.1][ref1], door de instanties genoemd in de [artikelen 7.5.2][ref2] en [7.5.3][ref3], bepaald:

      a. welke gegevens genoemd in [artikel 7.5.3, eerste lid][ref4], worden verstrekt alsmede, voor zover nodig, een
      nadere omschrijving van deze gegevens;

      b. de wijze waarop de gegevens worden verstrekt;

      c. de tijdvakken waarop de gegevens die worden verstrekt betrekking hebben;

      d. de termijnen waarbinnen of de tijdstippen waarop de gegevens worden verstrekt.

      2 De regeling, bedoeld in het eerste lid, bevat een informatieprotocol.


      [ref1]: https://wetten.overheid.nl/BWBR0035779#Artikel7.5.1
      [ref2]: https://wetten.overheid.nl/BWBR0035779#Artikel7.5.2
