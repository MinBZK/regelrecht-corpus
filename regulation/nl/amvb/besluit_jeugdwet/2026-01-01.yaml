    text: |-
      [Artikel 4.4.1 van de wet][ref1] is niet van toepassing op de volgende categorieën van jeugdhulpaanbieders:

      a. jeugdhulpaanbieders die uitsluitend jeugdhulp leveren die bestaat uit het vervoer van een jeugdige, bedoeld in
      [artikel 2.3, tweede lid, van de wet][ref2]; en

      b. gemeenten.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4.4.1
