  - number: 7.1.6
    text: |-
      Als categorieën van instanties als bedoeld in [artikel 7.1.1.2, eerste lid, onder a, van de wet][ref1]
      in het domein werk en inkomen worden aangewezen de gemeentelijke kredietbanken, bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7.1.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel11
