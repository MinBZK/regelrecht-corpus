        artikel: '3.4'
  - number: 4.0.1
    text: |-
      De meldplicht, bedoeld in [artikel 4.0.1, eerste lid, van de wet][ref1], is niet van toepassing op de volgende
      categorieën van jeugdhulpaanbieders:

      a. jeugdhulpaanbieders die uitsluitend jeugdhulp leveren die bestaat uit het vervoer van een jeugdige, bedoeld in
      [artikel 2.3, tweede lid, van de wet][ref2]; en

      b. gemeenten.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4.0.1
