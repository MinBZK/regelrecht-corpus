  - number: 8.2.1
    text: |-
      Deze paragraaf wordt verstaan onder «gegevens»: de in [artikel 8.3.2 van de wet][ref1] bedoelde gegevens
      betreffende de exploitatie van jeugdhulpaanbieders en gecertificeerde instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel8.3.2
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel8.2.1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: 8.3.2
  - number: 8.2.2
    text: |-
      1 Onze Ministers geven per categorie van jeugdhulpaanbieders of gecertificeerde instellingen en per categorie van
      personen die bij de exploitatie van een jeugdhulpaanbieder of gecertificeerde instelling betrokken zijn, aan, welke
      gegevens jaarlijks dienen te worden verstrekt.

      2 Onze Ministers kunnen voor jeugdhulpaanbieders en gecertificeerde instellingen gelegen binnen een door hen aan te
      wijzen gebied en voor personen die bij de exploitatie van die jeugdhulpaanbieders of gecertificeerde instellingen
      betrokken zijn, aangeven welke gegevens op hun desbetreffend verzoek dienen te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel8.2.2
  - number: 8.2.3
    text: |-
      1 De gegevens, bedoeld in [artikel 8.2.2, eerste lid][ref1], worden jaarlijks uiterlijk vijf maanden na het
      verstrijken van het jaar waarop zij betrekking hebben verstrekt.

      2 De gegevens, bedoeld in [artikel 8.2.2, tweede lid][ref2], worden verstrekt telkens uiterlijk zes maanden na een
      desbetreffend verzoek van elk van Onze Ministers.


      [ref1]: https://wetten.overheid.nl/BWBR0035779#Artikel8.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0035779#Artikel8.2.2
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel8.2.3
    references:
      - id: ref1
        bwb_id: BWBR0035779
        artikel: 8.2.2
        hoofdstuk: '8'
        paragraaf: '8.2'
      - id: ref2
        bwb_id: BWBR0035779
        artikel: 8.2.2
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: 8.2.4
    text: |-
      1 Onze Ministers wijzen instanties aan die de te verstrekken gegevens verzamelen en verwerken.

      2 Bij regeling van Onze Ministers worden voorschriften gegeven:

      a. over de wijze waarop en de vorm waarin de gegevens dienen te worden verstrekt;

      b. over de wijze van vergoeding van de kosten, verbonden aan de verstrekking van de gegevens;

      c. over wijze waarop gegevens ter beschikking worden gesteld van de organen genoemd in of betrokken bij de
      uitvoering van de [wet][ref1];

      d. die door die instanties, bedoeld in het eerste lid, in acht worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0034925
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel8.2.4
    references:
      - id: ref1
        bwb_id: BWBR0034925
  - number: '8.3'
    text: |-
      Bij regeling van Onze Ministers kunnen regels worden gesteld over de uitvoering van de taak, bedoeld
      in [artikel 8.1.8, eerste lid, van de wet][ref1] door de Sociale verzekeringsbank, genoemd in
      [artikel 3 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel8.1.8
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel3
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: 8.1.8
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '3'
  - number: '9.24'
    text: |-
      1 Het [Uitvoeringsbesluit Wet op de jeugdzorg][ref1] wordt ingetrokken.

      2 Het [Uitvoeringsbesluit Wet op de jeugdzorg][ref2] blijft van toepassing op de financiële verantwoording,
      vaststelling, inning of uitbetaling van op grond van dat besluit verleende subsidies en uitkeringen en bijdragen in
      de kosten voor jeugdzorg.

      3 In wettelijke procedures en rechtsgedingen tegen besluiten die op grond van het
      [Uitvoeringsbesluit Wet op de jeugdzorg][ref3] zijn genomen, dan wel op tegen deze besluiten in te stellen of
      ingestelde beroepen, blijven, zowel in eerste aanleg als in verdere instantie, de regels van toepassing, die golden
      voor de intrekking van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0017751
      [ref2]: https://wetten.overheid.nl/BWBR0017751
      [ref3]: https://wetten.overheid.nl/BWBR0017751
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel9.24
    references:
      - id: ref1
        bwb_id: BWBR0017751
      - id: ref2
        bwb_id: BWBR0017751
      - id: ref3
        bwb_id: BWBR0017751
  - number: '10.1'
    text: |-
      [Artikel 10.0, eerste lid, van de wet][ref1] is niet van toepassing op de volgende categorieën van
      jeugdhulpaanbieders:

      a. jeugdhulpaanbieders als bedoeld in [artikel 4.0.1][ref2];

      b. jeugdhulpaanbieders die binnen de termijn, bedoeld in [artikel 10.0 van de wet][ref3], de gegevens, bedoeld in
      [artikel 8.3.1 van de wet][ref4], over het jaar 2021 op de krachtens laatstgenoemd artikel bepaalde wijze hebben
      openbaar gemaakt; en

      c. jeugdhulpaanbieders die overeenkomstig het bepaalde krachtens [artikel 8.3.1 van de wet][ref5] uitstel hebben
      verzocht van de in onderdeel b bedoelde openbaarmaking over het jaar 2021.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel10.0
      [ref2]: https://wetten.overheid.nl/BWBR0035779#Artikel4.0.1
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel10.0
      [ref4]: https://wetten.overheid.nl/BWBR0034925#Artikel8.3.1
      [ref5]: https://wetten.overheid.nl/BWBR0034925#Artikel8.3.1
