  - number: 6.3.1
    text: |-
      Een klager kan bij de klachtencommissie een verzoek om bemiddeling doen. De klachtencommissie kan de mogelijkheid
      van bemiddeling ook ambtshalve voorstellen.
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel6.3.1
  - number: 6.3.2
    text: |-
      Van de klachtencommissie maken in ieder geval deel uit:

      a. een jurist;

      b. een gekwalificeerde gedragswetenschapper; en

      c. een arts, indien het een klacht betreft tegen een geneeskundige behandelingsmethode als bedoeld in
      [artikel 6.3.2.3, onderdeel b, van de wet][ref1], niet zijnde een behandeling van een psychische stoornis; of

      d. een psychiater, indien het een klacht betreft tegen een geneeskundige behandelingsmethode als bedoeld in
      [artikel 6.3.2.3, onderdeel b, van de wet][ref2], indien het gaat om een behandeling van een psychische stoornis.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6.3.2.3
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6.3.2.3
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel6.3.2
