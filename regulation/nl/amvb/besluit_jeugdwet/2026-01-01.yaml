  - number: 7.1.2
    text: |-
      Als categorieën van instanties als bedoeld in [artikel 7.1.1.2, eerste lid, onder a, van de wet][ref1]
      in het domein jeugdgezondheidszorg worden aangewezen instanties die de in
      [artikel 5, tweede lid, van de Wet publieke gezondheid][ref2] genoemde werkzaamheden in opdracht van het college
      uitvoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7.1.1.2
