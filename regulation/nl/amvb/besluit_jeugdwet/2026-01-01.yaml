  - number: 7.1.4
    text: |-
      1 Als categorieën van instanties als bedoeld in [artikel 7.1.1.2, eerste lid, onder a, van de wet][ref1] in het
      domein onderwijs worden aangewezen:

      a. scholen als bedoeld in [artikel 1 van de Wet op het primair onderwijs][ref2];

      b. scholen als bedoeld in [artikel 1 van de Wet op de expertisecentra][ref3];

      c. scholen als bedoeld in [artikel 1.1 van de Wet voortgezet onderwijs 2020][ref4];

      d. instellingen als bedoeld in [artikel 1.1.1 van de Wet educatie en beroepsonderwijs][ref5];

      e. instellingen voor hoger onderwijs als bedoeld in
      [artikel 1.2, onder a of b, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref6];

      f. contactgemeenten als bedoeld in [artikel 9.2.4 van de Wet educatie en beroepsonderwijs][ref7] ten behoeve van de
      taak, bedoeld in [artikel 9.2.5 van die wet][ref8].

      2 Als categorie van functionarissen als bedoeld in [artikel 7.1.1.2, tweede lid, onder a, van de wet][ref9] in het
      domein onderwijs worden aangewezen ambtenaren als bedoeld in [artikel 16 van de Leerplichtwet 1969][ref10].


