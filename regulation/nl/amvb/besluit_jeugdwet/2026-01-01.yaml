  - number: 2.2.3
    text: |-
      De vormen van jeugdhulp, bedoeld in [artikel 2.19, eerste lid, onderdeel a, onder 1°, van de wet][ref1] zijn:

      a. jeugdhulp met verblijf;

      b. pleegzorg als bedoeld in [artikel 1.1 van de wet][ref2];

      c. multidisciplinaire specialistische jeugdhulp in verband met meervoudige of complexe problemen, waarbij:

      1°. de jeugdige als gevolg van de betreffende problemen aanzienlijke beperkingen in het dagelijks functioneren
      ervaart;

      2°. sprake is van:

        - een hoog risico voor de jeugdige of diens omgeving;
        - ernstige ontwikkelingsproblemen;
        - ernstige opvoedproblemen; of
        - crimineel gedrag dan wel een vermoeden daarvan; en

      3°. in het geval van multidisciplinaire specialistische jeugdhulp mede bestaande uit geestelijke gezondheidszorg
      tevens:

        - sprake is van een psychische aandoening of een vermoeden daarvan; en
        - onvoldoende resultaat wordt verwacht of is gebleken van jeugdhulp bestaande uit generalistische basis geestelijke
      gezondheidszorg of monodisciplinaire specialistische geestelijke gezondheidszorg;

      d. jeugdhulp die wordt verleend door een forensische jeugdhulpaanbieder, mede is gericht op het voorkomen van
      recidive en is gesteld als bijzondere voorwaarde als bedoeld in [artikel 77z van het Wetboek van Strafrecht][ref3]
      of wordt verleend ter uitvoering van jeugdreclassering;

      e. jeugdhulp in verband met een zintuiglijke beperking;

      f. jeugdhulp bestaande uit crisishulp die gezien de ernst van de problemen 7 x 24 uur beschikbaar is;

      g. multidisciplinaire jeugdhulp bestaande uit dagbehandeling in groepsverband aan jeugdigen met een verstandelijke
      beperking, een lichamelijke beperking, ernstige psychische problemen, opvoedproblemen dan wel een vermoeden daarvan
      of ernstige gedragsproblemen;

      h. jeugdhulp bestaande uit hoogspecialistische geestelijke gezondheidszorg aan jeugdigen die onvoldoende baat
      hebben gehad of naar verwachting zullen hebben bij jeugdhulp bestaande uit generalistische basis geestelijke
      gezondheidszorg of specialistische geestelijke gezondheidszorg en waarbij sprake is van één of meer ernstige,
      complexe of zeldzame aandoeningen dan wel van een voorspelbaar ernstig beloop van klachten;

      i. specialistische jeugdhulp in verband met seksueel misbruik, geweld in afhankelijkheidsrelaties of eergerelateerd
      geweld;

      j. jeugdhulp in verband met ernstige problemen op het gebied van onzindelijkheid.


