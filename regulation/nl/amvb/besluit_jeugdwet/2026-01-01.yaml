  - number: 7.1.7
    text: |-
      Als categorieën van instanties als bedoeld in [artikel 7.1.1.2, eerste lid, onder a, van de wet][ref1] in het
      domein politie en justitie worden aangewezen:

      a. de regionale eenheden van het landelijke politiekorps, genoemd in
      [artikel 25, eerste lid, onder a, van de Politiewet 2012][ref2];

      b. Halt-bureaus door Onze Minister van Justitie en Veiligheid aangewezen;

      c. de regionale locaties van de raad voor de kinderbescherming, bedoeld in
      [artikel 2 van het Organisatiebesluit raad voor de kinderbescherming 2006][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7.1.1.2
