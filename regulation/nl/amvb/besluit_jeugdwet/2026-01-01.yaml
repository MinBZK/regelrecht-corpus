    text: |-
      Als categorieën van instanties als bedoeld in [artikel 7.1.1.2, eerste lid, onder a, van de wet][ref1]
      in het domein maatschappelijke ondersteuning worden aangewezen de aanbieders in de zin van de
      [Wet maatschappelijke ondersteuning 2015][ref2], niet zijnde aanbieders van hulpmiddelen of woningaanpassingen.


