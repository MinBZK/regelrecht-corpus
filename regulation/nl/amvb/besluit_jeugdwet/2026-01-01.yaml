  - number: 6.2.7
    text: |-
      1 Een beperking van het brief- en telefoonverkeer of van het gebruik van andere communicatiemiddelen als bedoeld in
      [artikel 6.3.2.4, eerste lid, onderdeel a, van de wet][ref1], kan uitsluitend bestaan uit:

      a. het verbod om gedurende een in het hulpverleningsplan opgenomen periode contact op te nemen met bepaalde, in het
      hulpverleningsplan genoemde personen; of

      b. het verbod om gebruik te maken van bepaalde communicatiemiddelen op in het hulpverleningsplan opgenomen
      tijdstippen of gedurende een in het hulpverleningsplan opgenomen periode.

      2 De tijdstippen en perioden, bedoeld in het eerste lid, worden gemotiveerd in het hulpverleningsplan van de
      jeugdige.

      3 Toezicht op telefoongesprekken als bedoeld in [artikel 6.3.2.4, eerste lid, onderdeel c, van de wet][ref2],
      bestaat uitsluitend uit het meeluisteren met het telefoongesprek in de ruimte waar het gesprek plaatsvindt.

      4 Toezicht op het gebruik van andere communicatiemiddelen als bedoeld in
      [artikel 6.3.2.4, eerste lid, onderdeel c, van de wet][ref3], bestaat uitsluitend uit het meekijken tijdens het
      gebruik van die communicatiemiddelen of het door de jeugdige laten tonen van de gecommuniceerde berichten nadat de
      jeugdige deze communicatiemiddelen heeft gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6.3.2.4
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6.3.2.4
