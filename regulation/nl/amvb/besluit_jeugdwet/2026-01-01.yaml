  - number: 2.2.4
    text: |-
      De vormen van jeugdhulp, bedoeld in [artikel 2.19, eerste lid, onderdeel c, onder 1°, van de wet][ref1] zijn:

      a. jeugdhulp met verblijf voor zover:

      1°. sprake is van gesloten jeugdhulp als bedoeld in [artikel 1.1 van de wet][ref2]; of

      2°. deze jeugdhulp mede is gericht op de drie milieus wonen, onderwijs en vrije tijd;

      b. jeugdhulp die wordt verleend door een forensische jeugdhulpaanbieder, mede is gericht op het voorkomen van
      recidive en:

      1°. is gesteld als bijzondere voorwaarde als bedoeld in [artikel 77z van het Wetboek van Strafrecht][ref3] of wordt
      verleend ter uitvoering van jeugdreclassering; en

      2°. geen sprake is van jeugdhulp met verblijf;

      c. jeugdhulp bestaande uit crisishulp die gezien de ernst van de problematiek 7 x 24 uur beschikbaar is;

      d. multidisciplinaire specialistische jeugdhulp bestaande uit geestelijke gezondheidszorg in verband met complexe
      verslavingsproblematiek.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel2.19
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel1.1
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel77z
