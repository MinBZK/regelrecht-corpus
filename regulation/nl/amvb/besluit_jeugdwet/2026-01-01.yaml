  - number: 2.2.1
    text: |-
      In de regiovisie wordt in ieder geval opgenomen:

      a. de wijze waarop de gemeenten in de regio samen met jeugdhulpaanbieders en professionals in algemene zin
      afstemmen over schaarste van de vormen van jeugdhulp bedoeld in [artikel 2.19, eerste lid, onderdeel a][ref1];

      b. de aanpak van wachttijden en de wijze waarop de gemeenten in de regio samen met jeugdhulpaanbieders maximaal
      aanvaardbare wachttijden formuleren;

      c. een voorziening waarmee inspraak mogelijk wordt gemaakt voor jeugdigen en diens wettelijk vertegenwoordigers;

      d. de wijze waarop de afstemming, bedoeld in [artikel 2.19, eerste lid, onderdeel c, van de wet][ref2] plaatsvindt;

      e. de wijze waarop de afstemming en verbinding wordt geborgd tussen de op grond van
      [artikel 2.19, eerste lid, onderdeel a, van de wet][ref3] gecontracteerde of gesubsidieerde jeugdhulp en
      gecertificeerde instellingen voor de uitvoering van kinderbeschermingsmaatregelen en jeugdreclassering en

      1°. de vormen van jeugdhulp die zijn gecontracteerd door een door alle gemeenten gezamenlijk in stand gehouden
      landelijk werkende organisatie en waarbij alle gemeenten in de regio uitsluitend gebruikmaken van dat landelijk
      gecontracteerde aanbod;

      2°. de vormen van jeugdhulp die door de colleges worden gecontracteerd of gesubsidieerd;

      f. de wijze waarop de verbinding wordt geborgd tussen de op grond van
      [artikel 2.19, eerste lid, onderdeel a, van de wet][ref4] gecontracteerde of gesubsidieerde jeugdhulp en
      gecertificeerde instellingen voor de uitvoering van kinderbeschermingsmaatregelen en jeugdreclassering en

      1°. jeugdgezondheidszorg als bedoeld in de [Wet publieke gezondheid][ref5];

      2°. zorg of diensten als omschreven bij of krachtens de [Wet langdurige zorg][ref6] en de
      [Zorgverzekeringswet][ref7];

      3°. maatschappelijke ondersteuning als bedoeld in
      [artikel 1.1.1 van de Wet maatschappelijke ondersteuning 2015][ref8];

      4°. ondersteuning als bedoeld in de [Wet op het primair onderwijs][ref9], de [Wet voortgezet onderwijs 2020][ref10]
      of de [Wet op de expertisecentra][ref11];

      g. de wijze waarop wordt voorzien in regionale expertteams.


