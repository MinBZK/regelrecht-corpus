        artikel: 7.4.2
      - id: ref2
        bwb_id: BWBR0034925
        artikel: 7.4.3
      - id: ref3
        bwb_id: BWBR0034925
        artikel: 7.4.1
  - number: 7.5.2
    text: |-
      1 De structurele verstrekking van gegevens bedoeld in [artikel 7.4.2 van de wet][ref1] betreft gegevens over de
      door het college gefinancierde jeugdhulpaanbieders en gecertificeerde instellingen.

      2 Een incidentele verstrekking van gegevens uit hoofde van [artikel 7.4.2 van de wet][ref2] betreft geen
      persoonsgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7.4.2
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel7.4.2
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel7.5.2
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: 7.4.2
      - id: ref2
        bwb_id: BWBR0034925
        artikel: 7.4.2
  - number: 7.5.3
    text: |-
      1 De structurele verstrekking door jeugdhulpaanbieders en gecertificeerde instellingen van gegevens, bedoeld in
      [artikel 7.4.3 van de wet][ref1], betreft:

      a. het burgerservicenummer, de geboortedatum en het geslacht van de jeugdige;

      b. de adresgegevens van de jeugdige, de gezaghebbende ouders, voogd of pleegoudervoogd, in het bijzonder ter
      aanduiding van de woonplaats als bedoeld in [artikel 1.1 van de wet][ref2];

      c. de gegevens over de jeugdhulpaanbieder of de gecertificeerde instelling;

      d. de datum van de aanvang van de jeugdhulp, de uitvoering van de kinderbeschermingsmaatregel of de
      jeugdreclassering;

      e. de einddatum van de jeugdhulp, de uitvoering van de kinderbeschermingsmaatregel of de jeugdreclassering;

      f. het type ingezette jeugdhulp;

      g. een aanduiding van de verwijzer naar jeugdhulp;

      h. de reden van beëindiging van de jeugdhulp;

      i. het type kinderbeschermingsmaatregel of jeugdreclassering;

      j. de datum van het eerste contact van de gecertificeerde instelling met de jeugdige bij de uitvoering van de
      kinderbeschermingsmaatregel of de jeugdreclassering;

      k. de reden van de beëindiging van de kinderbeschermingsmaatregel of de jeugdreclassering;

      l. de vraag of er al dan niet sprake is van de inzet van een erkende interventie bij jeugdreclassering;

      m. gegevens over de outcome van:

      1°. de jeugdhulp die is verleend door een jeugdhulpaanbieder als bedoeld in
      [artikel 1.1, onderdeel 1°, van de Jeugdwet][ref3], voor zover de gemeente en die jeugdhulpaanbieder hebben
      afgesproken dat de jeugdhulpaanbieder deze gegevens registreert of in subsidievoorwaarden is opgenomen dat de
      jeugdhulpaanbieder dit zal registreren, of

      2°. gecertificeerde instellingen.

      2 Een incidentele verstrekking van gegevens als bedoeld in [artikel 7.4.3 van de wet][ref4] door
      jeugdhulpaanbieders of gecertificeerde instellingen betreft geen persoonsgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7.4.3
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel1.1
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel1.1
      [ref4]: https://wetten.overheid.nl/BWBR0034925#Artikel7.4.3
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel7.5.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: 7.4.3
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '1.1'
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '1.1'
      - id: ref4
