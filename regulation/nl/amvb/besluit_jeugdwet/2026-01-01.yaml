  - number: '10.2'
    text: |-
      1 Een jeugdhulpaanbieder stelt het veiligheidsplan, bedoeld in [artikel 6.1.2, tweede lid][ref1], vast binnen zes
      maanden na het tijdstip van inwerkingtreding van de [Wet rechtspositie gesloten jeugdhulp][ref2].

      2 Een jeugdhulpaanbieder voldoet zo spoedig mogelijk, doch in ieder geval binnen zes maanden
      na het tijdstip van inwerkingtreding van de [Wet rechtspositie gesloten jeugdhulp][ref3] aan de
      [artikelen 6.2.5, eerste en derde lid][ref4], en [6.2.6, tweede lid][ref5].


