  - number: 6.2.8
    text: |-
      1 Het onderzoek aan het lichaam, de kleding of van urine wordt uitgevoerd door de jeugdhulpverantwoordelijke samen
      met een andere jeugdhulpverlener of door twee jeugdhulpverleners.

      2 Het onderzoek vindt plaats in een besloten ruimte die gedurende het onderzoek niet toegankelijk is voor anderen
      dan de betrokken jeugdige en de personen die het onderzoek uitvoeren.

      3 Het onderzoek wordt uitsluitend uitgevoerd door personen die opgeleid zijn in het proportioneel en op
      verantwoorde wijze uitvoeren ervan.
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel6.2.8
  - number: 6.2.9
    text: |-
      1 Bij het onderzoek aan het lichaam en de kleding kan de jeugdige worden verzocht kledingstukken uit te trekken met
      uitzondering van ondergoed indien dat noodzakelijk is voor de uitvoering van het onderzoek.

      2 Indien gedragsbeïnvloedende middelen of voorwerpen die de jeugdige niet in bezit mag hebben, worden aangetroffen
      bij het onderzoek aan het lichaam of van de kleding wordt de jeugdige de gelegenheid geboden die middelen of
      voorwerpen te overhandigen.

      3 Ingeval de jeugdige de gedragsbeïnvloedende middelen of niet toegestane voorwerpen weigert te overhandigen,
      worden die middelen of voorwerpen verwijderd.
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel6.2.9
  - number: 6.2.10
    text: |-
      1 Bij een onderzoek van urine wordt de urine in het bijzijn van de jeugdige over twee daartoe bestemde goed af te
      sluiten urinehouders verdeeld, waarna een registratienummer wordt aangebracht op de twee urinehouders.

      2 De jeugdhulpverantwoordelijke draagt er zorg voor dat één urinehouder ten behoeve van een onderzoek op de
      aanwezigheid van gedragsbeïnvloedende middelen naar een laboratorium wordt gezonden.

      3 De jeugdhulpverantwoordelijke verzoekt het laboratorium het onderzoek binnen tien dagen uit te voeren.

      4 De tweede urinehouder wordt in een voor onbevoegden niet toegankelijke diepvries of koelkast bewaard dan wel naar
      een laboratorium verstuurd waar de urinehouder in een voor onbevoegden niet toegankelijke diepvries of koelkast
      wordt bewaard.
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel6.2.10
  - number: 6.2.11
    text: |-
      1 De jeugdhulpverantwoordelijke draagt er zorg voor dat de jeugdige wiens urine is onderzocht op de kortst
      mogelijke termijn nadat de uitslag van het onderzoek bekend is over de uitslag wordt geïnformeerd.

      2 Indien de uitslag van het onderzoek op mogelijk gebruik van gedragsbeïnvloedende middelen duidt, bespreekt de
      jeugdhulpverantwoordelijke de uitslag met de jeugdige en kan de jeugdige binnen uiterlijk achtenveertig uur na
      kennisneming van de uitslag verzoeken dat het onderzoek wordt herhaald.

      3 Een herhalingsonderzoek als bedoeld in het tweede lid wordt uitgevoerd op de eerder bewaarde urine, bedoeld in
      [artikel 6.2.10, vierde lid][ref1]. Het eerste lid en artikel 6.2.10, tweede en derde lid, zijn van toepassing.

      4 Indien geen herhalingsonderzoek plaatsvindt, draagt de jeugdhulpaanbieder er zorg voor dat de eerder bewaarde
      urine wordt vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0035779#Artikel6.2.10
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel6.2.11
