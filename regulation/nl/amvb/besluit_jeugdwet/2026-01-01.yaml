  - number: 7.2.1
    text: |-
      1 Indien voor een melding aan de verwijsindex gebruik wordt gemaakt van een gemeentelijk signaleringssysteem,
      draagt het college zorg voor een zorgvuldige en veilige aansluiting daarvan op de verwijsindex.

      2 Indien voor een melding aan de verwijsindex gebruik wordt gemaakt van een ander digitaal systeem dan een
      gemeentelijk signaleringssysteem, draagt de daarvoor verantwoordelijke zorg voor een zorgvuldige en veilige
      aansluiting daarvan op de verwijsindex.

      3 Een aansluiting als bedoeld in het eerste of tweede lid wordt vermoed voldoende zorgvuldig en veilig te zijn
      als het voldoet aan de eisen zoals deze zijn uitgegeven door het Nederlands Normalisatie-instituut in de NTA 8023,
      Maatschappelijke zorg – Informatiearchitectuur in de jeugdsector – Deel 1 : Landelijke verwijsindex risicojongeren.
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel7.2.1
  - number: 7.2.2
    text: |-
      1 Een instantie die behoort tot een van de categorieën, bedoeld in de [artikelen 7.1.1 tot en met 7.1.7][ref1]
      of een functionaris die behoort tot een van de categorieën, bedoeld in [artikel 7.1.3, tweede lid][ref2], of
      [7.1.4, tweede lid][ref3], draagt zorg voor een zorgvuldig en veilig gebruik van de verwijsindex.

      2 Een instantie of een functionaris wordt vermoed te voldoen aan het bepaalde in het eerste lid als deze voldoet
      aan de eisen zoals deze zijn uitgegeven door het Nederlands Normalisatie-instituut in de NEN 7510, Medische
      informatica – Informatiebeveiliging in de zorg – Algemeen.


