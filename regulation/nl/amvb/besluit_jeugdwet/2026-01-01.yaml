  - number: '2.3'
    text: |-
      1 Bij verordening als bedoeld in [artikel 2.11, tweede lid, van de wet][ref1] wordt aandacht besteed aan de
      wijze waarop tariefdifferentiatie wordt bevorderd en wordt geregeld dat de prijs voor een dienst ten minste wordt
      gebaseerd op de volgende kostprijselementen:

      a. kosten van beroepskrachten (cliëntgebonden en niet-cliëntgebonden);

      b. cliëntgebonden kosten anders dan van beroepskrachten;

      c. overheadkosten, en

      d. kosten voor indexering.

      2 Bij ministeriële regeling van Onze Ministers kunnen regels worden gesteld over de indexering, bedoeld in het
      eerste lid, onderdeel d.

      3 Een verordening als bedoeld in [artikel 2.11, tweede lid, van de wet][ref2] verplicht het college om bij door
      hem gecontracteerde of gesubsidieerde aanbieders van preventie, jeugdhulpaanbieders of gecertificeerde instellingen
      te bedingen dat zij het verlenen van preventie, jeugdhulp, kinderbeschermingsmaatregelen of jeugdreclassering
      alleen aan derden uitbesteden indien zij die derden daarvoor een reële prijs betalen, die tot stand is gekomen met
      gebruikmaking van de kostprijselementen, bedoeld in het eerste lid.

      4 Het eerste tot en met derde lid gelden voor een subsidie slechts voor zover zij wordt verstrekt voor de
      daadwerkelijke verlening van preventie, jeugdhulp, kinderbeschermingsmaatregelen of jeugdreclassering aan jeugdigen
      of hun ouders en met de subsidie wordt beoogd de te subsidiëren diensten volledig te bekostigen.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel2.11
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel2.11
    url: https://wetten.overheid.nl/BWBR0035779/2026-01-01#Artikel2.3
    references:
