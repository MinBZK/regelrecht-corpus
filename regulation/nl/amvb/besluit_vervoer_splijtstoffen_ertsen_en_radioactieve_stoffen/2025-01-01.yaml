        bwb_id: BWBR0002402
        artikel: '15'
  - number: '18'
    text: |-
      1 Aan een vergunning voor het vervoeren van splijtstoffen of ertsen in een luchtvaartuig of voor het voorhanden
      hebben van genoemde stoffen bij opslag in verband met zodanig vervoer worden ter voorkoming van schade
      voorschriften verbonden als bedoeld in [artikel 7, eerste lid][ref1].

      2 Tot de in het eerste lid bedoelde voorschriften kunnen behoren:

      a. het voorschrift dat bijlage 18 (annex 18) van het op 7 december 1944 te Chicago tot stand gekomen verdrag inzake
      de internationale burgerlijke luchtvaart (*Stb.* 1947, H 165) en de daarbij behorende technische voorschriften
      (Technical Instructions for the safe transport of dangerous goods by air), in acht dienen te worden genomen, met
      dien verstande dat voor de toepassing van die regels voor Nederland de Autoriteit als bevoegde autoriteit wordt
      aangemerkt;

      b. voorschriften als bedoeld in [artikel 7, tweede lid, onder c en d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002668#Artikel7
