  - number: 1a
    text: |-
      Dit besluit is niet van toepassing op handelingen met:

      a. radioactieve stoffen, splijtstoffen of ertsen die een integraal onderdeel vormen van het vervoermiddel;

      b. radioactieve stoffen, splijtstoffen of ertsen die binnen een inrichting of een locatie of tussen twee locaties
      binnen een inrichting van de ondernemer worden vervoerd, indien het vervoer onderworpen is aan regelgeving die op
      de inrichting van toepassing is en het vervoer niet via de openbare weg plaatsvindt;

      c. radioactieve stoffen, splijtstoffen of ertsen, die in het menselijk lichaam of in levende dieren aanwezig zijn;

      d. radioactieve stoffen, splijtstoffen of ertsen in bij regeling van Onze Minister aangewezen producten bestemd
      voor gebruik op of in de directe omgeving van personen;

      e. natuurlijke bronnen waarvan de activiteitsconcentratie lager is dan of gelijk is aan tien keer de waarden,
      vermeld in tabel 2.2.7.2.2.1 van [bijlage 1 bij de VSG][ref1].


