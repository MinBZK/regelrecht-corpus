  - number: 4d
    text: |-
      1 Een kennisgeving, als bedoeld in [artikel 4c, eerste lid][ref1], bevat in ieder geval:

      a. de naam en het adres van degene die de kennisgeving doet, alsmede van de afzender en de ontvanger van de
      betrokken radioactieve stof;

      b. de wijze van vervoer en opslag in verband met dat vervoer, waarop de kennisgeving betrekking heeft;

      c. de hoeveelheid radioactieve stoffen waarop de kennisgeving betrekking heeft, zo mogelijk onder vermelding van
      symbool, massagetal en energietoestand van de betrokken radionucliden, van de maximale activiteit van de stoffen en
      van de chemische en fysische toestand en de vorm, waarin deze zich bevinden;

      d. de vermoedelijke data waarop het vervoer en het voorhanden hebben bij de opslag in verband met dat vervoer
      plaatsvinden;

      e. indien een kennisgeving wordt gedaan voor vervoer en voorhanden hebben bij de opslag in
      verband met dat vervoer, dat overeenkomstig [artikel 1b][ref2], in samenhang met de krachtens
      [artikel 2.3, eerste lid, van het Besluit basisveiligheidsnormen stralingsbescherming][ref3] vastgestelde regeling
      is gerechtvaardigd, een verwijzing naar die rechtvaardiging.

      2 Indien een kennisgeving wordt gedaan voor vervoer en voorhanden hebben bij de opslag in
      verband met dat vervoer dat niet overeenkomstig [artikel 1b][ref4], in samenhang met de krachtens
      [artikel 2.3, eerste lid, van het Besluit basisveiligheidsnormen stralingsbescherming][ref5] vastgestelde regeling
      is gerechtvaardigd, omvat de kennisgeving tevens een verzoek om rechtvaardiging van dat vervoer en het voorhanden
      hebben bij de opslag in verband met dat vervoer. De kennisgeving bevat dan tevens de gegevens met betrekking tot
      de individuele of maatschappelijke voordelen van het betrokken vervoer en het voorhanden hebben bij de opslag in
      verband met dat vervoer en met betrekking tot de gezondheidsschade die erdoor kan worden toegebracht, die nodig
      zijn met het oog op de beoordeling van de gerechtvaardigdheid van het vervoer en het voorhanden hebben bij de
      opslag in verband met dat vervoer.

      3 De ondernemer doet een kennisgeving van wijzigingen van de in het eerste lid genoemde gegevens ten minste twee
      dagen voordat het vervoer en het voorhanden hebben bij de opslag in verband met dat vervoer, waarop zij betrekking
      hebben, plaatsvindt aan de Autoriteit.

      4 De ondernemer verstrekt de Autoriteit op zijn verzoek nadere gegevens.


