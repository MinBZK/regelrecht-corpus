        artikel: '58'
  - number: '26'
    text: |-
      Degene, die splijtstoffen of ertsen binnen of buiten Nederlands grondgebied brengt of doet brengen:

      a. vergewist zich ervan dat die stoffen bestemd zijn voor een ontvanger, die bevoegd is die stoffen voorhanden te
      hebben, of voor een ontvanger in een ander land dan Nederland, die bevoegd is de stoffen te ontvangen;

      b. draagt er zorg voor dat een afschrift van de vergunning voor het binnen of buiten Nederlands grondgebied (doen)
      brengen, dan wel de kennisgeving hiervoor, tijdens het vervoer bij de splijtstoffen of ertsen aanwezig is;

      c. draagt er zorg voor dat aan de voor het betrokken vervoer geldende voorschriften met betrekking tot de
      verpakking en de daarop aan te brengen opschriften en gevaarsetiketten wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0002668/2025-01-01#Artikel26
  - number: '27'
    text: |-
      1 Het in [artikel 29, eerste lid, van de wet][ref1] vervatte verbod zonder vergunning van de Autoriteit
      radioactieve stoffen binnen of buiten Nederlands grondgebied te brengen of te doen brengen geldt voor:

      a. geneesmiddelen en

      b. consumentenproducten, met uitzondering van producten en stoffen als bedoeld in het tweede lid.

      2 Het binnen of buiten Nederlands grondgebied brengen of doen brengen van levensmiddelen, speelgoed, sieraden,
      cosmetische producten en diervoeder waaraan bij de productie of vervaardiging opzettelijk radioactieve stoffen zijn
      toegevoegd, is verboden.

      3 Het in het eerste lid, onder b, bedoelde verbod geldt niet, indien:

      a. de activiteit van de radionucliden in de betrokken radioactieve stof lager is dan de in tabel 2.2.7.2.2.1 van
      [bijlage 1 bij de VSG][ref2] vermelde grenswaarde voor de activiteit van een vrijgestelde zending, of

      b. de activiteitsconcentratie van die stof lager is dan de in tabel 2.2.7.2.2.1 van [bijlage 1 bij de VSG][ref3]
      vermelde waarde voor de activiteitsconcentratie voor vrijgestelde stoffen.

      4 Het bij en krachtens
      __REF000___________________________________________________________________________________________________________
      __ bepaalde is van overeenkomstige toepassing ten aanzien van het derde lid.

      5 Het in het eerste lid bedoelde verbod geldt niet voor bij regeling van Onze Minister aangewezen handelingen en
      handelingen met natuurlijke bronnen die een beperkt risico van blootstelling van mensen tot gevolg hebben.

      6 De verplichting, bedoeld in [artikel 4c, eerste lid][ref5], geldt niet ingeval er sprake is van een
      vergunning voor het binnen of buiten het Nederlands grondgebied brengen of doen brengen van geneesmiddelen of
      consumentenproducten als bedoeld in het eerste lid.


