  - number: 1g
    text: |-
      1 De vervoerder handelt overeenkomstig het laatst goedgekeurde beveiligingsplan, bedoeld in
      [artikel 1e, eerste lid][ref1].

      2 Het Geheimhoudingsbesluit Kernenergiewet is van toepassing op het beveiligingsplan, bedoeld in
      [artikel 1e, eerste lid][ref2], op het nucleaire draaiboek, bedoeld in artikel 1e, tweede lid, en de overige op de
      beveiliging van het vervoer betrekking hebbende documenten en gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel1e
