    text: |-
      De aanvraag om een vergunning voor het vervoeren van radioactieve stoffen en voor het voorhanden hebben van
      genoemde stoffen bij opslag in verband met het vervoer bevat de volgende gegevens:

      a. de gegevens, bedoeld in [artikel 3, eerste lid, onderdelen a tot en met i, m en n, en tweede lid][ref1], met
      dien verstande dat telkens in plaats van «splijtstoffen of ertsen» wordt gelezen: «radioactieve stoffen»;

      b. in een geval als bedoeld in [artikel 5, onderdeel a][ref2]: de gegevens, bedoeld in 6.4.23.2(c) van
      [bijlage 1 bij de VSG][ref3];

      c. in een geval als bedoeld in [artikel 5, onderdeel d][ref4]: de gegevens, bedoeld in 6.4.23.3 van
      [bijlage 1 bij de VSG][ref5];

      d. in een geval als bedoeld in [artikel 5, onderdeel e][ref6]: de gegevens, bedoeld in 6.4.23.2.2 van
      [bijlage 1 bij de VSG][ref7].


