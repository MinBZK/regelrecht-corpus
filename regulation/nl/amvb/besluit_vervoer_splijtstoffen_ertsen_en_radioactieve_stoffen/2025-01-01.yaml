  - number: 1d
    text: |-
      1 De vervoerder treft de beveiligingsmaatregelen die redelijkerwijs
      noodzakelijk zijn om categorie I-, II- of III-materiaal als bedoeld in
      [artikel 22, zevende of achtste lid, van het Besluit kerninstallaties, splijtstoffen en ertsen][ref1] te beveiligen
      tegen diefstal en sabotage.

      2 De beveiligingsmaatregelen hebben ten minste betrekking op:

      a. het collo met categorie I-, II-, of III-materiaal of radioactieve stoffen en sloten en zegels;

      b. de beperking van de duur van het vervoer en van de eventuele opslag in verband met het vervoer of onvoorzien
      oponthoud;

      c. de beperking van het aantal malen dat het categorie I-, II-, of III-materiaal moet worden overgeslagen; als er
      sprake is van overslag of opslag in verband met vervoer, de beperking van de duur ervan;

      d. de keuze van het vervoermiddel, de keuze van de vervoersroute, de geplande stopplaats of stopplaatsen, de
      planning van het tijdschema van het vervoer en de locatie van de eventuele opslag in verband met het vervoer;

      e. de taken, de vakbekwaamheid, de betrouwbaarheid en instructies van betrokkenen bij het vervoer;

      f. de communicatiemiddelen en overige voorzieningen van het vervoermiddel;

      g. de bescherming van specifieke gegevens over de beveiligingsmaatregelen in verband met het vervoer;

      h. het tegengaan van incidenten en andere ongewenste beïnvloeding.

      3 Bij verordening van de Autoriteit worden nadere regels gesteld met betrekking tot de uitvoering van het eerste of
      tweede lid, waaronder de getroffen of te treffen beveiligingsmaatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel22
    url: https://wetten.overheid.nl/BWBR0002668/2025-01-01#Artikel1d
    references:
      - id: ref1
        bwb_id: BWBR0002667
        artikel: '22'
  - number: 1e
    text: |-
      1 De vervoerder beschikt over een beveiligingsplan met een beschrijving van de wijze waarop het categorie I-, II-
      of III-materiaal wordt beveiligd. Dit betreft ten minste een omschrijving van de beveiligingsmaatregelen die worden
      getroffen door de vervoerder om te voldoen aan [artikel 1d][ref1] en een verwijzing naar de krachtens dit besluit
      verleende vergunning of vergunningen.

      2 Voorafgaand aan het vervoer stelt de vervoerder een nucleair draaiboek op met de voor dit vervoer specifieke
      uitwerking van de in [artikel 1d][ref2] bedoelde maatregelen.

      3 Voorafgaand aan het vervoer vergewist de vervoerder zich ervan dat alle beveiligingsmaatregelen conform het
      beveiligingsplan en het nucleaire draaiboek getroffen zijn. De vervoerder vergewist zich eveneens voorafgaand aan
      het vervoer ervan dat geen ongewenste veranderingen zijn aangebracht aan het collo en aan het vervoermiddel.

      4 Bij verordening van de Autoriteit kunnen met het oog op een goede uitvoering nadere regels worden gesteld met
      betrekking tot het beveiligingsplan, het nucleaire draaiboek of andere verplichtingen van de vervoerder.

      5 Het beveiligingsplan, bedoeld in het eerste lid, en wijzigingen daarvan die negatieve effecten hebben of kunnen
      hebben op het beveiligingsniveau van het transport, behoeven de goedkeuring van de Autoriteit.

      6 De Autoriteit kan aan de goedkeuring voorschriften verbinden.

      7 De Autoriteit kan de goedkeuring of de daaraan verbonden voorschriften intrekken of wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel1d
      [ref2]: https://wetten.overheid.nl/BWBR0002668#Artikel1d
