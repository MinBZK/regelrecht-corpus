  - number: 1b
    text: |-
      1 Het bepaalde bij of krachtens de in het tweede lid genoemde hoofdstukken, paragrafen en artikelen van het
      [Besluit basisveiligheidsnormen stralingsbescherming][ref1] is, met uitzondering van hetgeen daarin is bepaald over
      toestellen, van overeenkomstige toepassing, met inachtneming van het derde lid.

      2 Hoofdstukken, paragrafen en artikelen als bedoeld in het eerste lid zijn:

      a. [hoofdstuk 1][ref2], met uitzondering van [artikel 1.1, derde lid][ref3];

      b. [hoofdstuk 2][ref4];

      c. [afdeling 3.1][ref5] en [artikel 3.6, derde lid, aanhef, en vierde lid][ref6];

      d. de [artikelen 4.4][ref7][4.13, derde lid][ref8], en [4.29][ref9];

      e. de [artikelen 5.4][ref10], [5.5][ref11], [5.6][ref12] en [5.7][ref13];

      f. de [artikelen 6.2][ref14], [6.7][ref15] en [6.8 tot en met 6.14][ref16];

      g. [hoofdstuk 7][ref17], met uitzondering van de [artikelen 7.5][ref18] en [7.38][ref19];

      h. de [artikelen 9.1 tot en met 9.7][ref20] en [9.9][ref21];

      i. [artikel 11.6, eerste lid][ref22];

      j. [artikel 14.1][ref23].

      3 Bij de van overeenkomstige toepassing, bedoeld in het tweede lid:

      a. van de [paragrafen 3.3.1][ref24] en [3.3.2][ref25], wordt in plaats van de tabellen, bedoeld
      in [artikel 3.17, eerste lid][ref26], en [3.20, eerste lid][ref27], gelezen: tabel 2.2.7.2.2.1 van
      [bijlage 1 bij de VSG][ref28];

      b. van [artikel 3.6, derde lid, aanhef][ref29], wordt in plaats van «aanvraag» gelezen «aanvraag of
      kennisgeving» en wordt voor «de te verstrekken gegevens» gelezen «de te verstrekken gegevens, bedoeld in de
      [artikelen 3][ref30], [4d, eerste, tweede en vierde lid][ref31], [6][ref32], [13, tweede en vierde lid][ref33],
      [15, tweede en vierde lid][ref34], [24][ref35], [28][ref36] of [32a][ref37] van dit besluit»;

      c. van [artikel 3.6, vierde lid][ref38], wordt in plaats van «een beveiligingsplan als bedoeld in
      [artikel 4.7][ref39]» gelezen «een beveiligingsplan als bedoeld in [artikel 1e][ref40] van dit besluit»;

      d. van [artikel 4.4][ref41], heeft het tweede lid van dat artikel geen betrekking op bronnen;

      e. zijn de [artikelen 6.13][ref42] en [6.14][ref43] alleen van overeenkomstige toepassing voor het geval een
      categorie B-ongeval wordt opgeschaald tot een categorie A-ongeval;

      f. van [artikel 14.1][ref44], wordt in plaats van «die van dit besluit afwijken» gelezen: die van de van
      overeenkomstige toepassing verklaarde artikelen afwijken.


