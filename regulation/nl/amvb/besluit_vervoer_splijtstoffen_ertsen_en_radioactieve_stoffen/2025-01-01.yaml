  - number: 32b
    text: |-
      Het is verboden in strijd te handelen met de artikelen 4, 5 en 6 van Verordening (Euratom) nr. 1493/93 van de Raad
      van 8 juni 1993 betreffende de overbrenging van radioactieve stoffen tussen Lid-Staten van de Europese Gemeenschap
      (PbEG 1993 L148).
    url: https://wetten.overheid.nl/BWBR0002668/2025-01-01#Artikel32b
  - number: '33'
    text: |-
      Het in [artikel 15, onder b, van de wet][ref1] vervatte verbod geldt niet ten aanzien van een inrichting, waarin
      splijtstoffen uitsluitend worden opgeslagen in verband met het vervoer daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002668/2025-01-01#Artikel33
    references:
