    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Ministers van Economische Zaken, van Sociale Zaken en Volksgezondheid en van Verkeer en
    Waterstaat van 23 augustus 1968, no. 668/639 W.J.A., de Centrale Raad voor de Kernenergie gehoord;

    Gelet op de artikelen 16, 19, eerste lid, 21, 26, 29, 30, tweede lid, 31, 32 en 35 van de Kernenergiewet (Stb.
    1963, 82);

    De Raad van State gehoord (advies van 25 september 1968, no. 88);

    Gezien het nader rapport van Onze Minister van Economische Zaken en de Staatssecretarissen van Sociale Zaken en
    Volksgezondheid en van Verkeer en Waterstaat van 3 september 1969, no. 669/585 W.J.A.;

    Hebben goedgevonden en verstaan:
