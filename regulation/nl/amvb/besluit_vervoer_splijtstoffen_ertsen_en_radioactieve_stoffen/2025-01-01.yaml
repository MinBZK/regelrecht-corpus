  - number: '19'
    text: |-
      1 Bij het vervoeren van splijtstoffen of ertsen in een luchtvaartuig en bij het voorhanden hebben van genoemde
      stoffen bij opslag in verband met zodanig vervoer dienen, indien daarvoor ingevolge dit besluit het in
      [artikel 15, onder a, van de wet][ref1] vervatte verbod niet geldt, bijlage 18 (annex 18) van het op 7 december
      1944 te Chicago tot stand gekomen verdrag inzake de internationale burgerlijke luchtvaart (*Stb.* 1947, H 165) en
      de daarbij behorende technische voorschriften (Technical Instructions for the safe transport of dangerous goods by
      air) in acht te worden genomen, met dien verstande dat:

      a. voor de toepassing van die regels voor Nederland de Autoriteit als bevoegde autoriteit wordt aangemerkt;

      b. voor het vervoer als bedoeld in artikel 17 in een Nederlands luchtvaartuig het bepaalde met betrekking tot de
      goedkeuring van een zending door de voor Nederland bevoegde autoriteit niet geldt;

      c. voor vervoer als bedoeld in artikel 17 in een niet-Nederlands luchtvaartuig het bepaalde met betrekking tot
      de goedkeuring van een zending of van het model van de verpakking door de voor Nederland bevoegde autoriteit niet
      geldt.

      2 Ten aanzien van de in het eerste lid bedoelde bepalingen is [artikel 8, derde lid][ref2], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002668#Artikel8
