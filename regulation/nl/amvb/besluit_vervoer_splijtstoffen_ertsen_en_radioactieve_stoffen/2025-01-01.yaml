  - number: '24'
    text: |-
      1 De aanvraag om een vergunning voor het binnen of buiten Nederlands grondgebied brengen of doen brengen van
      splijtstoffen of ertsen bevat de volgende gegevens:

      a. naam en adres van de aanvrager;

      b. de soort handeling, waarop de aanvraag betrekking heeft;

      c. naam en adres van degene, voor wie de splijtstoffen of ertsen bestemd zijn;

      d. de hoeveelheid, de chemische en fysische toestand, de vorm, het gehalte en de verrijkingsgraad van de
      splijtstoffen of ertsen;

      e. het land van herkomst van de splijtstoffen of ertsen;

      f. het land van bestemming van de splijtstoffen of ertsen;

      g. de vermoedelijke datum, waarop de splijtstoffen of ertsen binnen Nederlands grondgebied zullen worden gebracht,
      of de duur, waarvoor vergunning wordt gevraagd;

      h. de plaats, waar de splijtstoffen of ertsen binnen, onderscheidenlijk buiten Nederlands grondgebied zullen worden
      gebracht;

      i. indien een vergunning wordt aangevraagd voor een handeling die overeenkomstig [artikel 1b][ref1], in samenhang
      met de krachtens [artikel 2.3, eerste lid, van het Besluit basisveiligheidsnormen stralingsbescherming][ref2]
      vastgestelde regeling is gerechtvaardigd, een verwijzing naar die rechtvaardiging.

      2 Indien een vergunning wordt aangevraagd voor een handeling die niet is gerechtvaardigd of als niet-
      gerechtvaardigd is aangewezen overeenkomstig [artikel 1b][ref3], in samenhang met de krachtens
      [artikel 2.3, eerste lid, van het Besluit basisveiligheidsnormen stralingsbescherming][ref4] vastgestelde regeling,
      omvat de aanvraag tevens een verzoek om rechtvaardiging van die handeling. De aanvraag om de vergunning bevat
      dan tevens de gegevens met betrekking tot de individuele of maatschappelijke voordelen van de betrokken handeling
      en met betrekking tot de gezondheidsschade die erdoor kan worden toegebracht, die nodig zijn met het oog op de
      beoordeling van de gerechtvaardigdheid van de handeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel1b
      [ref2]: https://wetten.overheid.nl/BWBR0040179
      [ref3]: https://wetten.overheid.nl/BWBR0002668#Artikel1b
      [ref4]: https://wetten.overheid.nl/BWBR0040179
