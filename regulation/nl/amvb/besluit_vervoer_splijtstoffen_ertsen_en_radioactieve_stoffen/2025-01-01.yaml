  - number: 4c
    text: |-
      1 De ondernemer die een radioactieve stof vervoert, doet kennisgeving van dit vervoer en het voorhanden hebben bij
      de opslag in verband met dat vervoer ten minste drie weken tevoren aan de Autoriteit.

      2 In afwijking van de in het eerste lid bedoelde verplichting tot kennisgeving geldt voor het vervoeren of het
      voorhanden hebben in verband met dat vervoer van radioactieve stoffen een verplichting tot het doen van een
      jaarkennisgeving indien de vervoerder ten genoegen van de Autoriteit kan aantonen:

      a. dat hij gelet op de aard van de te vervoeren stoffen, de specifieke toepassing van de te vervoeren stoffen of de
      bedrijfsvoering redelijkerwijs alleen een kennisgeving in de vorm van een jaarkennisgeving kan doen;

      b. een administratie bijhoudt waarin de gegevens, bedoeld in [artikel 4d][ref1] zijn opgenomen.

      De Autoriteit kan nadere regels stellen met betrekking tot de uitvoering van het bepaalde in de aanhef en onder a
      en de eerste volzin.

      3 De in het eerste lid bedoelde verplichting geldt niet indien er sprake is van aansluitend vervoer in het kader
      van het binnen Nederlands grondgebied (doen) brengen of het voorafgaand vervoer in het kader van het buiten
      Nederlands grondgebied (doen) brengen als bedoeld in [artikel 27][ref2].

      4 De in het eerste lid bedoelde verplichting geldt niet voor het vervoeren of het voorhanden hebben bij de opslag
      in verband met dat vervoer van een kunstmatige bron, indien:

      a. de activiteit van de radionucliden in de betrokken radioactieve stof lager is dan de in tabel 2.2.7.2.2.1 van
      [bijlage 1 bij de VSG][ref3] vermelde grenswaarde voor de activiteit van een vrijgestelde zending,

      b. de activiteitsconcentratie van die stof lager is dan de in tabel 2.2.7.2.2.1 van [bijlage 1 bij de VSG][ref4]
      vermelde waarde voor de activiteitsconcentratie voor vrijgestelde stoffen, of

      c. [artikel 5][ref5] van toepassing is.

      5 De in het eerste lid bedoelde verplichting geldt niet voor het vervoeren of het voorhanden hebben bij de opslag
      in verband met dat vervoer van een natuurlijke bron, indien:

      a. de activiteit van de radionucliden in de betrokken natuurlijke bron lager is dan de in tabel 2.2.7.2.2.1 van
      [bijlage 1 bij de VSG][ref6] vermelde grenswaarde voor de activiteit van een vrijgestelde zending,

      b. de activiteitsconcentratie van de betrokken natuurlijke bron lager is dan tienmaal de in tabel 2.2.7.2.2.1 van
      [bijlage 1 bij de VSG][ref7] vermelde waarde voor de activiteitsconcentratie voor vrijgestelde stoffen, of

      c. [artikel 5][ref8] van toepassing is.

      6 Het bij of krachtens
      [artikel 3.17, derde, vierde en negende lid, van het Besluit basisveiligheidsnormen stralingsbescherming][ref9]
      bepaalde is van overeenkomstige toepassing.

      7 De in het eerste lid bedoelde verplichting geldt niet voor bij regeling van Onze Minister aangewezen handelingen,
      die een beperkt risico van blootstelling van mensen tot gevolg hebben.


