  - number: '13'
    text: |-
      1 Het in [artikel 15, onder a, van de wet][ref1] vervatte verbod geldt niet voor het vervoeren van splijtstoffen
      of ertsen:

      a. over de Nederlandse territoriale zee of over niet-Nederlandse wateren;

      b. door Belgiëvaarders indien voor het vervoer een vergunning of een andere autorisatie is afgegeven door de
      bevoegde Belgische autoriteiten en een kennisgeving als bedoeld in het tweede lid is gedaan.

      2 Een Belgiëvaarder geeft ten minste zeven dagen voordat het vervoer, bedoeld in het eerste lid, onderdeel b,
      plaatsvindt kennis van dat vervoer aan de Autoriteit waarbij de Belgiëvaarder de volgende informatie verschaft:

      a. de naam en het adres van degene die de kennisgeving doet, alsmede van de afzender en de ontvanger van de
      betrokken splijtstoffen en ertsen;

      b. de hoeveelheid splijtstoffen en ertsen waarop de kennisgeving betrekking heeft;

      c. de data waarop het vervoer zal plaatsvinden;

      d. het nummer en de geldigheidsdatum van de vergunning of de andere autorisatie, bedoeld in het eerste lid, onder
      b.

      3 Een Belgiëvaarder neemt de eisen van een vergunning of andere autorisatie als bedoeld in het eerste lid,
      onderdeel b, in acht.

      4 Een Belgiëvaarder geeft tenminste twee dagen voordat het vervoer naar verwachting zal plaatsvinden kennis aan de
      Autoriteit van wijzigingen van gegevens als bedoeld in het tweede lid met betrekking tot dat vervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
