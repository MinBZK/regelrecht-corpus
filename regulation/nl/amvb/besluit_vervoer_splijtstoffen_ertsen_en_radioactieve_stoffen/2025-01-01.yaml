  - number: '25'
    text: |-
      1 Aan een vergunning voor het binnen of buiten Nederlands grondgebied brengen van splijtstoffen of ertsen kunnen
      ter voorkoming van schade de volgende voorschriften worden verbonden:

      a. het voorschrift, dat de splijtstoffen of ertsen uitsluitend binnen, onderscheidenlijk buiten Nederlands
      grondgebied mogen worden gebracht op de plaats die in het voorschrift is vermeld;

      b. het voorschrift, dat de vergunning of een gewaarmerkt afschrift daarvan desverlangd aan een op grond van
      [artikel 58, eerste lid, van de wet][ref1] aangewezen ambtenaar ter inzage moet worden gegeven.

      2 Aan een vergunning voor het binnen of buiten Nederlands grondgebied doen brengen van splijtstoffen of ertsen
      kunnen de volgende voorschriften worden verbonden:

      a. het voorschrift, dat de houder van de vergunning de splijtstoffen of ertsen uitsluitend binnen,
      onderscheidenlijk buiten Nederlands grondgebied mag doen brengen op een plaats die in het voorschrift is vermeld;

      b. het voorschrift, dat de houder van de vergunning de vergunning of een gewaarmerkt afschrift daarvan ter
      beschikking moet stellen aan degene, die de splijtstoffen of ertsen binnen of buiten Nederlands grondgebied brengt;

      c. het voorschrift, dat de houder van de vergunning er voor dient zorg te dragen, dat aan de voor het betrokken
      vervoer geldende voorschriften met betrekking tot de verpakking en de daarop aan te brengen opschriften en
      gevaarsetiketten wordt voldaan;

      d. het voorschrift dat van de plaats waar de splijtstoffen of ertsen binnen respectievelijk buiten Nederlands
      grondgebied worden gebracht mag worden afgeweken, indien door een onvoorzien voorval een onbelemmerde doorgang van
      het vervoer niet meer mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel58
    url: https://wetten.overheid.nl/BWBR0002668/2025-01-01#Artikel25
