  - number: '2'
    text: |-
      1 Het in [artikel 15, onder a, van de wet][ref1] vervatte verbod geldt niet voor het vervoeren en het voorhanden
      hebben bij opslag in verband met het vervoer van splijtstoffen of ertsen, indien:

      a. de activiteit van de radionucliden in de betrokken splijtstoffen of ertsen lager is dan de in tabel 2.2.7.2.2.1
      van [bijlage 1 bij de VSG][ref2] vermelde grenswaarde voor de activiteit van een vrijgestelde zending, of

      b. de activiteitsconcentratie van die stoffen of ertsen lager is dan de in tabel 2.2.7.2.2.1 van
      [bijlage 1 bij de VSG][ref3] vermelde waarde voor de activiteitsconcentratie voor vrijgestelde stoffen.

      2 Het in [artikel 15, onder a, van de wet][ref4] vervatte verbod geldt voorts niet voor het vervoeren
      en het voorhanden hebben bij opslag in verband met het vervoer van splijtstoffen die gebruikt worden als
      afschermingsmateriaal in een collo, mits er een kennisgeving is gedaan als bedoeld in artikel 4c, in geval van
      vervoer in Nederland, of [artikel 32][ref5], in geval van het binnen of buiten Nederlands grondgebied doen brengen,
      en wordt voldaan aan de bij en krachtens de wet gestelde regels en voorschriften.

      3 Voor de toepassing van het eerste of tweede lid worden bestraalde
      splijtstoffen beoordeeld naar onbestraalde toestand. Het bij en krachtens
      [artikel 3.17, tweede, derde en zesde lid, van het Besluit basisveiligheidsnormen stralingsbescherming][ref6]
      bepaalde is van overeenkomstige toepassing ten aanzien van het eerste of tweede lid.

      4 Bij regeling van Onze Minister kan worden bepaald dat het eerste of tweede lid niet van toepassing is in daarbij
      aangewezen categorieën van gevallen, waarin sprake is van een te hoog risico van blootstelling van werknemers of
      leden van de bevolking.


