articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *Belgiëvaarder:* Een schip dat, tenzij nautische omstandigheden daartoe noodzaken, zonder een haven,
      overlaadplaats, ankerplaats of wachtplaats in Nederland aan te doen, zonder dat er laad-, los- of bunkerhandelingen
      worden verricht en zonder dat er sprake is van het schoonmaken, gasvrijmaken of spoelen van tanks, vaart: 1°. van
      zee, over de Westerschelde, naar België; of 2°. van België, over de Westerschelde, naar zee;
        - *collo*: verpakking met radioactieve inhoud, gereed voor verzending;
        - *geneesmiddel:* een substantie of een samenstel van substanties als bedoeld in artikel 1 van de Geneesmiddelenwet
      waaraan opzettelijk radioactieve stoffen zijn toegevoegd;
        - *handeling*: vervoeren, binnen of buiten Nederlands grondgebied brengen, of voorhanden hebben bij opslag in
      verband met vervoer van een: 1º. splijtstof, 2º. erts, 3º. kunstmatige bron of 4º. natuurlijke bron, uitgezonderd
      bij een interventie, een ongeval of een radiologische noodsituatie;
        - *jaarkennisgeving:* kennisgeving van de te verrichten zendingen binnen een tijdvak van twaalf maanden, welke
      wordt gedaan voorafgaand aan het eerste vervoer binnen dat tijdvak;
        - *lid van de bevolking:* een persoon uit de bevolking binnen of buiten een locatie, niet zijnde een werknemer
      gedurende zijn werktijd of een persoon die een radiologische verrichting ondergaat;
        - *locatie*: inrichting, als bedoeld in [artikel 15, onder b, van de wet][ref1], locatie waarop een
      milieubelastende activiteit die is aangewezen in [hoofdstuk 3 van het Besluit activiteiten leefomgeving][ref2]
      wordt verricht of plaats, waar een handeling wordt verricht;
        - *ondernemer*: degene onder wiens verantwoordelijkheid een handeling wordt verricht;
        - *Onze Minister:* Onze Minister van Infrastructuur en Waterstaat;
        - *de richtlijn vervoer gevaarlijke goederen over land:* richtlijn nr. 2008/68/EG van het Europees Parlement en de
      Raad van de Europese Unie van 24 september 2008 betreffende het vervoer van gevaarlijke goederen over land (PbEG
      L 260);
        - VBG: Regeling vervoer over de binnenwateren van gevaarlijke stoffen;
        - ** vervoerder:* houder van een vergunning voor het vervoeren, het voorhanden hebben
      bij opslag in verband met het vervoer en het binnen of buiten Nederlands grondgebied
      brengen of doen brengen van categorie I-, II- of III- materiaal als bedoeld in
      [artikel 22, zevende of achtste lid, van het Besluit kerninstallaties, splijtstoffen en ertsen][ref3];
        - VLG: Regeling vervoer over land van gevaarlijke stoffen;
        - VSG: Regeling vervoer over de spoorweg van gevaarlijke stoffen;
        - wet: [Kernenergiewet][ref4].

      2 Een wijziging van de richtlijn vervoer gevaarlijke goederen over land gaat voor de toepassing van dit besluit
      gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.

      3 In dit besluit en de daarop berustende bepalingen wordt onder «activiteit», «besmetting», «blootstelling»,
      «consumentenproducten», «effectieve dosis», «equivalente dosis», «gezondheidsschade», «radiologische
      verrichting» en «schade» verstaan hetgeen daaronder wordt verstaan in [artikel 1.2][ref5] in samenhang met
      [bijlage 1 van het Besluit basisveiligheidsnormen stralingsbescherming][ref6].

      4 In dit besluit en de daarop berustende bepalingen wordt onder «bron», «hoogactieve bron», «kunstmatige bron»,
      «open bron» en «natuurlijke bron» verstaan hetgeen daaronder wordt verstaan in [artikel 1.2][ref7] in samenhang met
      [bijlage 1 van het Besluit basisveiligheidsnormen stralingsbescherming][ref8], voorzover dat betrekking heeft op
      radioactieve stoffen.

      5 In dit besluit en de daarop berustende bepalingen wordt onder «gehalte», «natuurlijk
      uranium», «verrijkingsgraad» en «verrijkt uranium» verstaan hetgeen daaronder wordt verstaan in
      [artikel 1, eerste lid, van het Besluit kerninstallaties, splijtstoffen en ertsen][ref9].


