        bwb_id: BWBR0002402
        artikel: '29'
  - number: '28'
    text: |-
      De aanvraag om een vergunning voor het binnen of buiten Nederlands grondgebied brengen of doen brengen van
      radioactieve stoffen als bedoeld in [artikel 27, eerste lid][ref1], of van een hoogactieve bron bevat de volgende
      gegevens:

      a. de gegevens, bedoeld in [artikel 24, eerste lid, onder a, b en e tot en met i, en tweede lid][ref2], met dien
      verstande dat in plaats van «splijtstoffen of ertsen» telkens wordt gelezen: «radioactieve stoffen»;

      b. een opgave als bedoeld in [artikel 3, eerste lid, onder c][ref3], met dien verstande, dat in plaats van
      "splijtstoffen of ertsen", telkens wordt gelezen: "radioactieve stoffen";

      c. de hoeveelheid radioactieve stoffen, waarop de aanvraag betrekking heeft, zo mogelijk onder vermelding van
      symbool, massagetal en energietoestand van de betrokken nucliden, van de maximale activiteit van de stoffen en van
      de chemische en fysische toestand en de vorm, waarin deze zich bevinden;

      d. een omschrijving van de geneesmiddelen of consumentenproducten, waarin de radioactieve stoffen zich bevinden.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0002668#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0002668#Artikel3
