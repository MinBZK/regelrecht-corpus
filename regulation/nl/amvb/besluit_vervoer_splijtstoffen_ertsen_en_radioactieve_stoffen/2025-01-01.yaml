  - number: 32a
    text: |-
      1 De kennisgeving, bedoeld in [artikel 32, eerste lid][ref1], bevat in ieder geval:

      a. de naam en het adres van degene die de kennisgeving doet, van de afzender van de radioactieve stof en van de
      ontvanger daarvan;

      b. de soort handelingen waarop de kennisgeving betrekking heeft;

      c. het land van herkomst van de radioactieve stoffen;

      d. de hoeveelheid radioactieve stoffen, waarop de kennisgeving betrekking heeft, zo mogelijk onder vermelding van
      symbool, massagetal en energietoestand van de betrokken radionucliden, van de maximale activiteit van de stoffen en
      van de chemische en fysische toestand en de vorm, waarin deze zich bevinden;

      e. de vermoedelijke data waarop de handelingen plaatsvinden;

      f. Indien een kennisgeving wordt gedaan voor een handeling die niet is gerechtvaardigd of als niet-
      gerechtvaardigd is aangewezen overeenkomstig [artikel 1b][ref2], in samenhang met de krachtens
      [artikel 2.3, eerste lid, van het Besluit basisveiligheidsnormen stralingsbescherming][ref3] vastgestelde regeling,
      omvat de kennisgeving tevens een verzoek om rechtvaardiging van die handeling.

      2 Indien een kennisgeving wordt gedaan voor een handeling die niet is gerechtvaardigd of als niet-
      gerechtvaardigd is aangewezen overeenkomstig [artikel 1b][ref4], in samenhang met de krachtens
      [artikel 2.3 van het Besluit basisveiligheidsnormen stralingsbescherming][ref5] vastgestelde regeling, omvat de
      kennisgeving tevens een verzoek om rechtvaardiging van die handeling. De kennisgeving bevat dan tevens de gegevens
      met betrekking tot de individuele of maatschappelijke voordelen van de betrokken handeling en met betrekking
      tot de gezondheidsschade die erdoor kan worden toegebracht, die nodig zijn met het oog op de beoordeling van de
      gerechtvaardigdheid van de handeling.

      3 Degene die de kennisgeving heeft gedaan, meldt wijzigingen van de in het eerste lid genoemde gegevens ten minste
      drie werkdagen voordat de handelingen plaatsvinden, waarop ze betrekking hebben, aan de Autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel32
