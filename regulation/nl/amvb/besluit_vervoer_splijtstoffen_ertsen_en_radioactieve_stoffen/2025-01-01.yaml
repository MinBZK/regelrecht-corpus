  - number: '4'
    text: |-
      1 Aan een vergunning voor het vervoeren van plutonium of verrijkt uranium bevattende splijtstoffen of voor het
      voorhanden hebben van genoemde stoffen bij opslag in verband met het vervoer wordt met het oog op het zeker stellen
      van de betaling van de vergoeding, aan derden toekomende voor schade, hun toegebracht, het voorschrift verbonden,
      dat het vervoer over, of het voorhanden hebben binnen Nederlands grondgebied slechts mag geschieden, indien degene,
      die voor schade als bedoeld in een bijzondere wettelijke regeling van de aansprakelijkheid op het gebied van de
      kernenergie, veroorzaakt tijdens het vervoer of de opslag van de splijtstoffen, aansprakelijk kan zijn, ter dekking
      van die aansprakelijkheid beschikt over een verzekering of andere financiële zekerheid als in die wettelijke
      regeling bedoeld of over een door Onze Minister van Financiën goedgekeurde verzekering of andere financiële
      zekerheid.

      2 Het vervoeren van plutonium of verrijkt uranium bevattende splijtstoffen over, en het voorhanden hebben van
      genoemde stoffen bij opslag in verband met het vervoer binnen Nederlands grondgebied, waarvoor ingevolge dit
      besluit het in [artikel 15, onder a][ref1], van de wet vervatte verbod niet geldt, mogen slechts geschieden, indien
      degene, die voor schade als bedoeld in een bijzondere wettelijke regeling van de aansprakelijkheid op het gebied
      van de kernenergie, veroorzaakt tijdens het vervoer of de opslag van de splijtstoffen, aansprakelijk kan zijn,
      ter dekking van die aansprakelijkheid beschikt over een verzekering of andere financiële zekerheid als in die
      bijzondere wettelijke regeling bedoeld of over een door Onze Minister van Financiën goedgekeurde verzekering of
      andere financiële zekerheid.

      3 Het eerste en tweede lid gelden niet voor het vervoeren en het voorhanden hebben van de daargenoemde stoffen van
      een verrijkingsgraad of in hoeveelheden, waarop de daarbedoelde wettelijke regeling niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel15
