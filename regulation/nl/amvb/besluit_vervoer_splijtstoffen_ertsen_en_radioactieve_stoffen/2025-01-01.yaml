  - number: 1f
    text: |-
      1 De vervoerder wijzigt het beveiligingsplan, bedoeld in [artikel 1e, eerste lid][ref1], wanneer de Autoriteit dit
      nodig acht en dit schriftelijk heeft kenbaar gemaakt aan de vervoerder, waarbij de kennisgeving is voorzien van de
      aard van de aan te brengen wijzigingen.

      2 De vervoerder dient binnen een jaar nadat de Autoriteit kenbaar heeft gemaakt wijziging van het beveiligingsplan
      nodig te achten een aanvraag om goedkeuring van het in overeenstemming met de kennisgeving van de Autoriteit
      gewijzigde beveiligingsplan in.

      3 De termijn, bedoeld in het tweede lid, kan door de Autoriteit worden gewijzigd indien:

      a. de door de Autoriteit nodig geachte wijzigingen van het beveiligingsplan deze gewijzigde termijn rechtvaardigen,
      en

      b. de wijzigingen binnen de door de Autoriteit gestelde termijn voor de vervoerder redelijkerwijs mogelijk zijn.

      4 De vervoerder beoordeelt het beveiligingsplan jaarlijks op doeltreffendheid. De vervoerder meldt binnen een maand
      na die beoordeling de resultaten ervan aan de Autoriteit.

      5 De vervoerder wijzigt het beveiligingsplan voor zover de resultaten van de in het vierde lid bedoelde beoordeling
      daartoe aanleiding geven. Hij biedt de wijziging binnen een jaar na het ontstaan van de aanleiding tot wijziging
      ter goedkeuring aan de Autoriteit aan.

      6 Het derde lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel1e
    url: https://wetten.overheid.nl/BWBR0002668/2025-01-01#Artikel1f
