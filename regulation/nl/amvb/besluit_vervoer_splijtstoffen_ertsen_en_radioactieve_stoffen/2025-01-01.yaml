  - number: 27a
    text: |-
      Het in [artikel 29, eerste lid, van de wet][ref1] vervatte verbod om zonder vergunning van de Autoriteit
      radioactieve stoffen binnen of buiten Nederlands grondgebied te brengen geldt voorts voor het binnen of buiten
      Nederlands grondgebied brengen van een hoogactieve bron.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel29
    url: https://wetten.overheid.nl/BWBR0002668/2025-01-01#Artikel27a
    references:
