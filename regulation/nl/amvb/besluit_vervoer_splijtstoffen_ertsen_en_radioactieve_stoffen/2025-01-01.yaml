  - number: '23'
    text: |-
      1 Het in [artikel 15, onder a, van de wet][ref1] vervatte verbod geldt niet voor het binnen of buiten Nederlands
      grondgebied brengen of doen brengen van splijtstoffen of ertsen indien:

      a. de activiteit van de radionucliden in de betrokken splijtstoffen en ertsen lager is dan de in tabel 2.2.7.2.2.1
      van [bijlage 1 bij de VSG][ref2] vermelde grenswaarde voor de activiteit van een vrijgestelde zending;

      b. de activiteitsconcentratie van die stoffen en ertsen lager is dan de in tabel 2.2.7.2.2.1 van
      [bijlage 1 bij de VSG][ref3] vermelde waarde voor de activiteitsconcentratie voor vrijgestelde stoffen, of

      c. het vervoer, bedoeld in [artikel 13, eerste lid, onderdeel b][ref4], betreft.

      2 Het in [artikel 15, onder a, van de wet][ref5] vervatte verbod geldt voorts niet voor het vervoeren
      en het voorhanden hebben bij opslag in verband met het vervoer van splijtstoffen die gebruikt worden als
      afschermingsmateriaal in een collo, mits er een kennisgeving is gedaan als bedoeld in [artikel 4c][ref6], in geval
      van vervoer in Nederland, of [artikel 32][ref7], in geval van het binnen of buiten Nederlands grondgebied doen
      brengen, en wordt voldaan aan de bij en krachtens de [wet][ref8] gestelde regels en voorschriften.

      4 Het bij of krachtens
      [artikel 3.17, derde, vierde en negende lid, van het Besluit basisveiligheidsnormen stralingsbescherming][ref9]
      en wordt aan het slot toegevoegd: ten aanzien van de toepassing van het eerste of tweede lid bepaalde is van
      overeenkomstige toepassing ten aanzien van de toepassing van het eerste of tweede lid.

      4 Bij regeling van Onze Minister kan worden bepaald dat het eerste of tweede lid niet van toepassing is in daarbij
      aangewezen categorieën van gevallen, waarin sprake is van een te hoog risico van blootstelling van werknemers of
      leden van de bevolking.


