  - number: 1c
    text: |-
      Geen vergunning krachtens dit besluit wordt verleend indien:

      a. niet is voldaan aan de krachtens [artikel 1b][ref1] in samenhang met de bij en krachtens de hierna genoemde
      artikelen van het [Besluit basisveiligheidsnormen stralingsbescherming][ref2], gestelde voorwaarden betreffende:

      1°. rechtvaardiging: de [artikelen 2.1 tot en met 2.5][ref3];

      2°. optimalisatie: de [artikelen 2.1][ref4], [2.6][ref5], [2.7][ref6] en [7.33][ref7];

      3°. dosislimieten: de [artikelen 2.1][ref8], [2.9][ref9], [7.3][ref10], [7.4][ref11], [7.34][ref12], [7.35][ref13],
      [7.36][ref14], [9.1][ref15], [9.2][ref16], [9.3][ref17], [9.4][ref18] en [9.5][ref19];

      4°. deskundigheid: de [artikelen 5.4 tot en met 5.8][ref20], [7.1][ref21], [7.2][ref22] of [9.6][ref23];

      b. voor een lid van de bevolking dat zich buiten de locatie bevindt, als gevolg van de handeling waarvoor de
      vergunning is aangevraagd en ten gevolge van andere handelingen binnen en buiten deze locatie, een van de volgende
      doses wordt overschreden:

      1º. een effectieve dosis van 1 mSv in een kalenderjaar, en met inachtneming daarvan:

      2º. een equivalente dosis van 50 mSv in een kalenderjaar voor de huid gemiddeld over enig huidoppervlak van 1 cm2;

      c. de handeling waarvoor de vergunning is aangevraagd, behoort tot een
      categorie die overeenkomstig [artikel 1b][ref24] in samenhang met de krachtens
      [artikel 2.3, eerste lid, van het Besluit basisveiligheidsnormen stralingsbescherming][ref25]
      vastgestelde regeling is gerechtvaardigd, maar het specifieke karakter van deze handeling op grond van
      [artikel 3.7, onderdeel d, van het Besluit basisveiligheidsnormen stralingsbescherming][ref26] niet gerechtvaardigd
      is.


