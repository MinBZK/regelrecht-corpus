  - number: '22'
    text: |-
      1 Bij het vervoeren van radioactieve stoffen in een luchtvaartuig en bij het voorhanden hebben van genoemde stoffen
      bij opslag in verband met zodanig vervoer dienen bijlage 18 (annex 18) van het op 7 december 1944 te Chicago tot
      stand gekomen verdrag inzake de burgerlijke luchtvaart (*Stb.* 1947, H 165) en de daarbij behorende technische
      voorschriften (Technical Instructions for the safe transport of dangerous goods by air) in acht te worden genomen,
      met dien verstande dat:

      a. voor de toepassing van die regels voor Nederland de Autoriteit als bevoegde autoriteit wordt aangemerkt;

      b. voor vervoer als bedoeld in [artikel 20][ref1] in een Nederlands luchtvaartuig het bepaalde met betrekking tot
      de goedkeuring van een zending door de voor Nederland bevoegde autoriteit niet geldt;

      c. voor vervoer als bedoeld in [artikel 20][ref2] in een niet-Nederlands luchtvaartuig het bepaalde met betrekking
      tot de goedkeuring van een zending of van het model van de verpakking door de voor Nederland bevoegde autoriteit
      niet geldt.

      2 Ten aanzien van de in het eerste lid bedoelde bepalingen is [artikel 8, derde lid][ref3], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel20
