  - number: '5'
    text: |-
      Het in [artikel 29, eerste lid, van de wet][ref1] vervatte verbod om zonder vergunning radioactieve stoffen te
      vervoeren of voorhanden te hebben geldt voor het vervoeren en het voorhanden hebben bij opslag in verband met het
      vervoer:

      a. van radioactieve stoffen in colli van het type B(M) die niet voldoen aan 6.4.7.5 van
      [bijlage 1 bij de VSG][ref2] of die speciaal zijn ontworpen voor de mogelijkheid van intermitterende
      druknivellering;

      b. van radioactieve stoffen in colli van het type B(M) als de activiteit van de radioactieve stoffen meer bedraagt
      dan is aangegeven in 5.1.5.1.2 van [bijlage 1 bij de VSG][ref3];

      c. van hoogactieve bronnen;

      d. indien daarop een speciale regeling als bedoeld in 1.7.4 van [bijlage 1 bij de VSG][ref4] van toepassing is;

      e. van grote voorwerpen met besmetting aan het oppervlak als bedoeld in 2.2.7.2.3.2 (c) van
      [bijlage 1 van de VSG][ref5].


