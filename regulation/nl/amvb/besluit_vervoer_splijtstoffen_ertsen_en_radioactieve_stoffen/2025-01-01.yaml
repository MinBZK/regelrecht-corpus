    text: |-
      De Autoriteit kan bij verordening regels stellen ten aanzien van de beveiliging van het vervoer, de opslag
      in verband met het vervoer en het binnen of buiten Nederlands grondgebied brengen of doen brengen van de in
      [artikel 4.7 van het Besluit basisveiligheidsnormen stralingsbescherming][ref1] bedoelde radioactieve stoffen.


