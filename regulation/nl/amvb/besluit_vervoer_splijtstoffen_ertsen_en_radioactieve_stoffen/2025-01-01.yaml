  - number: '31'
    text: |-
      Degene, die radioactieve stoffen binnen of buiten Nederlands grondgebied brengt of doet brengen:

      a. vergewist zich er voorafgaand aan het afleveren van dat die stoffen bestemd zijn voor een ontvanger, die bevoegd
      is die stoffen voorhanden te hebben, of voor een ontvanger in een ander land dan Nederland die bevoegd is de
      stoffen te ontvangen;

      b. draagt er zorg voor dat een afschrift van de vergunning voor het binnen of buiten Nederlands grondgebied (doen)
      brengen, dan wel de kennisgeving hiervoor, tijdens het vervoer bij de radioactieve stoffen aanwezig is; en

      c. draagt er zorg voor dat aan de voor het betrokken vervoer geldende voorschriften met betrekking tot de
      verpakking en de daarop aan te brengen opschriften en gevaars-etiketten wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0002668/2025-01-01#Artikel31
  - number: '32'
    text: |-
      1 De ondernemer onder wiens verantwoordelijkheid een radioactieve stof binnen of buiten Nederlands grondgebied
      wordt gebracht, doet hiervan ten minste drie weken voordat dit brengen plaatsvindt een kennisgeving aan de
      Autoriteit.

      2 De in het eerste lid bedoelde verplichting geldt niet voor het brengen van de aldaar bedoelde stoffen voor zover
      de ondernemer kan aantonen dat hij:

      a. van dat vervoer reeds heeft kennisgegeven in de jaarkennisgeving, en

      b. een administratie bijhoudt waarin de gegevens genoemd in [artikel 4d][ref1] zijn opgenomen.

      3 De in het eerste lid bedoelde verplichting geldt niet voor een kunstmatige bron, indien:

      a. de activiteit van de radionucliden in de betrokken radioactieve stof lager is dan de in tabel 2.2.7.2.2.1 van
      [bijlage 1 bij de VSG][ref2] vermelde grenswaarde voor de activiteit van een vrijgestelde zending, of

      b. de activiteitsconcentratie van die stof lager is dan de in tabel 2.2.7.2.2.1 van [bijlage 1 bij de VSG][ref3]
      vermelde waarde voor de activiteitsconcentratie voor vrijgestelde stoffen.

      4 De in het eerste lid bedoelde verplichting geldt niet voor een natuurlijke bron, indien:

      a. de activiteit van de radionucliden in de betrokken natuurlijke bron lager is dan de in tabel 2.2.7.2.2.1 van
      [bijlage 1 bij de VSG][ref4] vermelde grenswaarde voor de activiteit van een vrijgestelde zending; of

      b. de activiteitsconcentratie van de betrokken natuurlijke bron lager is dan tienmaal de in tabel 2.2.7.2.2.1 van
      [bijlage 1 bij de VSG][ref5] vermelde genoemde waarde voor de activiteitsconcentratie voor vrijgestelde stoffen.

      5 Het bij en krachtens
      __REF000___________________________________________________________________________________________________________
      __ bepaalde is van overeenkomstige toepassing.

      6 De in het eerste lid bedoelde verplichting geldt niet:

      a. voor bij regeling van Onze Minister aangewezen handelingen die een beperkt risico van blootstelling van mensen
      tot gevolg hebben, of

      b. indien [artikel 27, eerste lid][ref7], van toepassing is.


