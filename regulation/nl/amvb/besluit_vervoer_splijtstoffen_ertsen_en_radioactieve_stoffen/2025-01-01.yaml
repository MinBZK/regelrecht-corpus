  - number: '3'
    text: |-
      1 De aanvraag om een vergunning voor het vervoeren van splijtstoffen of ertsen, of voor het voorhanden hebben van
      genoemde stoffen of ertsen in verband met het vervoer bevat de volgende gegevens:

      a. naam en adres van de aanvrager;

      b. naam en adres van de afzender;

      c. naam en adres van degene, voor wie de splijtstoffen of ertsen bestemd zijn;

      d. het traject of de trajecten, waarlangs het vervoer zal plaatsvinden;

      e. de uiteindelijke bestemming in geval van overladen, of het doel waarvoor de stoffen of ertsen worden aangewend
      op de plaats van bestemming;

      f. een omschrijving van het vervoermiddel of de vervoermiddelen, waarmede het vervoer zal worden verricht;

      g. de vermoedelijke datum van het vervoer of de duur, waarvoor vergunning wordt gevraagd;

      h. de hoeveelheid te vervoeren splijtstoffen of ertsen;

      i. in gevallen van colli met het type B(M) of indien de bepalingen voor verpakkingen met splijtstoffen in hoofdstuk
      6.4 van [bijlage 1 bij de VSG][ref1] van toepassing zijn:

      1°. een afschrift van certificaten van goedkeuring of erkenning van het model van de te vervoeren colli als bedoeld
      in 5.1.5.2.1 van [bijlage 1 bij de VSG][ref2],

      2°. de gegevens, bedoeld in 6.4.23.2(c) van [bijlage 1 bij de VSG][ref3];

      j. in het geval dat splijtstoffen of ertsen op grond van een speciale regeling als bedoeld in 1.7.4 van
      [bijlage 1 bij de VSG][ref4] worden vervoerd: de gegevens, bedoeld in 6.4.23.3 van bijlage 1 bij de VSG;

      k. in geval van splijtstoffen of ertsen die als besmetting aan het oppervlak van grote voorwerpen als bedoeld in
      2.2.7.2.3.2 (c) van [bijlage 1 bij de VSG][ref5] worden vervoerd: de gegevens, bedoeld in 6.4.23.2.2 van bijlage 1
      bij de VSG;

      l. in gevallen, waarin een ander land als eerste bij de verzending is betrokken: de door de bevoegde
      autoriteit van dat land afgegeven certificaten van goedkeuring van verzending, bedoeld in 5.1.5.2.1 van
      [bijlage 1 bij de VSG][ref6];

      m. naam en adres van degene, die de verzekering of andere financiële zekerheid, bedoeld in [artikel 4][ref7], zal
      verstrekken alsmede naam en adres van degene die deze verzekering of andere financiële zekerheid zal afsluiten;

      n. in voorkomend geval een nauwkeurige aanduiding van de plaats of de plaatsen, waar opslag van de betrokken
      splijtstoffen of ertsen in verband met het vervoer zal plaatsvinden;

      o. indien een vergunning wordt aangevraagd voor een handeling die overeenkomstig [artikel 1b][ref8], in samenhang
      met de krachtens [artikel 2.3, eerste lid, van het Besluit basisveiligheidsnormen stralingsbescherming][ref9]
      vastgestelde regeling is gerechtvaardigd, een verwijzing naar die rechtvaardiging.

      2 Indien een vergunning wordt aangevraagd voor een handeling die niet is gerechtvaardigd of als niet-
      gerechtvaardigd is aangewezen overeenkomstig [artikel 1b][ref10], in samenhang met de krachtens
      [artikel 2.3, eerste lid, van het Besluit basisveiligheidsnormen stralingsbescherming][ref11] vastgestelde
      regeling, omvat de aanvraag om een vergunning tevens een verzoek om rechtvaardiging van die handeling. De aanvraag
      om de vergunning bevat dan tevens de gegevens met betrekking tot de individuele of maatschappelijke voordelen van
      de betrokken handeling en met betrekking tot de gezondheidsschade die erdoor kan worden toegebracht, die nodig zijn
      met het oog op de beoordeling van de gerechtvaardigdheid van de handeling.


      [ref1]: https://wetten.overheid.nl/BWBR0010053
