  - number: 4d
    text: |-
      1 Een melding, als bedoeld in [artikel 4c, eerste lid][ref1], bevat in ieder geval:

      a. de naam en het adres van degene die de melding doet, alsmede van de afzender en de ontvanger van de betrokken
      radioactieve stof;

      b. de wijze van vervoer en opslag in verband met dat vervoer, waarop de melding betrekking heeft;

      c. de hoeveelheid radioactieve stoffen waarop de melding betrekking heeft, zo mogelijk onder vermelding van
      symbool, massagetal en energietoestand van de betrokken radionucliden, van de maximale activiteit van de stoffen en
      van de chemische en fysische toestand en de vorm, waarin deze zich bevinden;

      d. de vermoedelijke data waarop het vervoer en het voorhanden hebben bij de opslag in verband met dat vervoer
      plaatsvinden;

      e. indien een melding wordt gedaan voor vervoer en voorhanden hebben bij de opslag in verband met dat vervoer, dat
      krachtens [artikel 1b][ref2], in samenhang met [artikel 4, tweede lid, van het Besluit stralingsbescherming][ref3],
      als gerechtvaardigd is bekendgemaakt, een verwijzing naar die bekendmaking.

      2 Indien een melding wordt gedaan voor vervoer en voorhanden hebben bij de opslag in verband met dat vervoer, dat
      niet of als niet-gerechtvaardigd is bekendgemaakt overeenkomstig de krachtens [artikel 1b][ref4], in samenhang
      met [artikel 4, tweede lid, van het Besluit stralingsbescherming][ref5] geldende regeling, omvat de melding
      tevens een verzoek om rechtvaardiging van dat vervoer en het voorhanden hebben bij de opslag in verband met dat
      vervoer. De melding bevat dan tevens de gegevens met betrekking tot de economische, sociale en andere voordelen
      van het betrokken vervoer en het voorhanden hebben bij de opslag in verband met dat vervoer en met betrekking
      tot de gezondheidsschade die erdoor kan worden toegebracht, die nodig zijn met het oog op de beoordeling van de
      gerechtvaardigdheid van het vervoer en het voorhanden hebben bij de opslag in verband met dat vervoer.

      3 De ondernemer meldt wijzigingen van de in het eerste lid genoemde gegevens ten minste drie werkdagen voordat
      het vervoer en het voorhanden hebben bij de opslag in verband met dat vervoer, waarop zij betrekking hebben,
      plaatsvindt aan Onze Minister.

      4 De ondernemer verstrekt Onze Minister op zijn verzoek nadere gegevens.


