  - number: 4c
    text: |-
      1 De ondernemer die een radioactieve stof vervoert, meldt dit vervoer en het voorhanden hebben bij de opslag in
      verband met dat vervoer ten minste drie weken tevoren aan Onze Minister.

      2 De in het eerste lid bedoelde verplichting geldt niet voor het vervoeren of het voorhanden hebben in verband met
      dat vervoer van radioactieve stoffen voor zover de vervoerder kan aantonen dat hij:

      a. dat vervoer reeds heeft vermeld in de globale melding; en

      b. een administratie bijhoudt waarin de gegevens genoemd in [artikel 4d][ref1] zijn opgenomen.

      3 De in het eerste lid bedoelde verplichting geldt niet indien er sprake is van aansluitend vervoer in het kader
      van het binnen Nederlands grondgebied (doen) brengen of het voorafgaand vervoer in het kader van het buiten
      Nederlands grondgebeid (doen) brengen als bedoeld in [artikel 27][ref2].

      4 De in het eerste lid bedoelde verplichting geldt niet voor het vervoeren of het voorhanden hebben bij de opslag
      in verband met dat vervoer van een kunstmatige bron of een natuurlijke bron, voorzover deze is of wordt bewerkt met
      het oog op zijn radioactieve eigenschappen, indien:

      a. de activiteit van de radionucliden in de betrokken radioactieve stof lager is dan de in tabel 2.2.7.7.2.1 van
      [bijlage 1 bij het VSG][ref3] vermelde grenswaarde voor de activiteit van een vrijgestelde zending,

      b. de activiteitsconcentratie van die stof lager is dan de in tabel 2.2.7.7.2.1 van [bijlage 1 bij het VSG][ref4]
      vermelde waarde voor de activiteitsconcentratie voor vrijgestelde stoffen, of

      c. [artikel 5][ref5] van toepassing is.

      5 De in het eerste lid bedoelde verplichting geldt niet voor het vervoeren of het voorhanden hebben bij de opslag
      in verband met dat vervoer van een natuurlijke bron, voorzover deze niet is of wordt bewerkt met het oog op zijn
      radioactieve eigenschappen, indien:

      a. de activiteit van de radionucliden in de betrokken natuurlijke bron lager is dan de in tabel 2.2.7.7.2.1 van
      [bijlage 1 bij het VSG][ref6] vermelde grenswaarde voor de activiteit van een vrijgestelde zending,

      b. de activiteitsconcentratie van de betrokken natuurlijke bron lager is dan tienmaal de in tabel 2.2.7.7.2.1 van
      [bijlage 1 bij het VSG][ref7] vermelde waarde voor de activiteitsconcentratie voor vrijgestelde stoffen, of

      c. [artikel 5][ref8] van toepassing is.

      6 Het bij of krachtens [artikel 25, vierde, vijfde en achtste lid, van het Besluit stralingsbescherming][ref9]
      bepaalde is van overeenkomstige toepassing.

      7 De in het eerste lid bedoelde verplichting geldt niet voor bij regeling van Onze Minister aangewezen handelingen
      en werkzaamheden, die een beperkt risico van blootstelling van mensen tot gevolg hebben.


