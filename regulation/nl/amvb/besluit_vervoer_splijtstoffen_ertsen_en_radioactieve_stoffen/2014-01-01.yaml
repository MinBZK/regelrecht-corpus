  - number: '27'
    text: |-
      1 Het in [artikel 29, eerste lid, van de wet][ref1] vervatte verbod zonder vergunning van Onze Minister
      radioactieve stoffen binnen of buiten Nederlands grondgebied te brengen of te doen brengen geldt voor:

      a. geneesmiddelen en

      b. gebruiksartikelen,

      waaraan bij de productie en fabricage opzettelijk radioactieve stoffen zijn toegevoegd.

      2 Het in het eerste lid, onder b, bedoelde verbod geldt niet voor een kunstmatige bron of een natuurlijke bron,
      voorzover deze is of wordt bewerkt met het oog op zijn radioactieve eigenschappen, indien:

      a. de activiteit van de radionucliden in de betrokken radioactieve stof lager is dan de in tabel 2.2.7.7.2.1 van
      [bijlage 1 bij het VSG][ref2] vermelde grenswaarde voor de activiteit van een vrijgestelde zending, of

      b. de activiteitsconcentratie van die stof lager is dan de in tabel 2.2.7.7.2.1 van [bijlage 1 bij het VSG][ref3]
      vermelde waarde voor de activiteitsconcentratie voor vrijgestelde stoffen.

      3 Het in het eerste lid, onder b, bedoelde verbod geldt niet voor een natuurlijke bron, voorzover deze niet is of
      wordt bewerkt met het oog op zijn radioactieve eigenschappen, indien:

      a. de activiteit van de radionucliden in de betrokken natuurlijke bron lager is dan de in tabel 2.2.7.7.2.1 van
      [bijlage 1 bij het VSG][ref4] vermelde grenswaarde voor de activiteit van een vrijgestelde zending, of

      b. de activiteitsconcentratie van de betrokken natuurlijke bron lager is dan tienmaal de in tabel 2.2.7.7.2.1 van
      [bijlage 1 bij het VSG][ref5] vermelde waarde voor de activiteitsconcentratie voor vrijgestelde stoffen.

      4 Het bij en krachtens [artikel 25, derde, vierde, zevende en achtste lid, van het Besluit stralingsbescherming][ref6]
      bepaalde is van overeenkomstige toepassing.

      5 Het in het eerste lid bedoelde verbod geldt niet voor bij regeling van Onze Minister aangewezen handelingen en
      werkzaamheden die een beperkt risico van blootstelling van mensen tot gevolg hebben.

      6 De verplichting, bedoeld in [artikel 4c, eerste lid][ref7], geldt niet ingeval er sprake is van een
      vergunning voor het binnen of buiten het Nederlands grondgebied brengen of doen brengen van geneesmiddelen of
      gebruiksartikelen, als bedoeld in het eerste lid.


