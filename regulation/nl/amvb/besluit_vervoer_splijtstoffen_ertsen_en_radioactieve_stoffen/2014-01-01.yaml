      het [VSG][ref1] vermelde grenswaarde voor de activiteit van een vrijgestelde zending, of


      [ref1]: https://wetten.overheid.nl/BWBR0010053
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010053
  - number: 2.1.b
    text: |-
      de activiteitsconcentratie van die stoffen of ertsen lager is dan de in tabel 2.2.7.7.2.1 bij het [VSG][ref1]
      vermelde waarde voor de activiteitsconcentratie voor vrijgestelde stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0010053
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010053
  - number: '2.2'
    text: Voor de toepassing van het eerste lid worden bestraalde splijtstoffen beoordeeld naar onbestraalde toestand.
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel2
  - number: '2.3'
    text: |-
      Het bij en krachtens [artikel 25, derde, vierde en zevende lid, van het Besluit stralingsbescherming][ref1]
      bepaalde is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel25
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '25'
  - number: '2.4'
    text: |-
      Bij regeling van Onze Minister kan worden bepaald dat het eerste lid niet van toepassing is in daarbij aangewezen
      categorieën van gevallen, waarin sprake is van een te hoog risico van blootstelling van werknemers of leden van
      de bevolking.
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel2
  - number: '3.1'
    text: |-
      De aanvraag om een vergunning voor het vervoeren van splijtstoffen of ertsen, of voor het voorhanden hebben van
      genoemde stoffen of ertsen in verband met het vervoer bevat de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel3
  - number: 3.1.a
    text: naam en adres van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel3
  - number: 3.1.b
    text: naam en adres van de afzender;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel3
  - number: 3.1.c
    text: naam en adres van degene, voor wie de splijtstoffen of ertsen bestemd zijn;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel3
  - number: 3.1.d
    text: het traject of de trajecten, waarlangs het vervoer zal plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel3
  - number: 3.1.e
    text: |-
      de uiteindelijke bestemming in geval van overladen, of het doel waarvoor de stoffen of ertsen worden aangewend op
      de plaats van bestemming;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel3
  - number: 3.1.f
    text: een omschrijving van het vervoermiddel of de vervoermiddelen, waarmede het vervoer zal worden verricht;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel3
  - number: 3.1.g
    text: de vermoedelijke datum van het vervoer of de duur, waarvoor vergunning wordt gevraagd;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel3
  - number: 3.1.h
    text: de hoeveelheid te vervoeren splijtstoffen of ertsen;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel3
  - number: 3.1.i
    text: |-
      in gevallen van colli met het type B(M) of indien de bepalingen voor verpakkingen met splijtstoffen in hoofdstuk
      6.4 van [bijlage 1 bij de VSG][ref1] van toepassing zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0010053
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010053
  - number: 3.1.i.1°
    text: |-
      een afschrift van certificaten van goedkeuring of erkenning van het model van de te vervoeren colli als bedoeld in
      5.1.5.3.1 van [bijlage 1 bij de VSG][ref1], afgegeven door Onze Minister dan wel door de bevoegde autoriteit van
      een ander, met toepassing van het tweede lid aangewezen land,


      [ref1]: https://wetten.overheid.nl/BWBR0010053
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010053
  - number: 3.1.i.2°
    text: |-
      de gegevens, bedoeld in 6.4.23.2(c) van [bijlage 1 bij de VSG][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010053
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010053
  - number: 3.1.j
    text: |-
      in het geval dat splijtstoffen of ertsen op grond van een speciale regeling als bedoeld in 1.7.4 worden vervoerd:
      de gegevens, bedoeld in 6.4.23.3 van [bijlage 1 bij de VSG][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010053
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010053
  - number: 3.1.k
    text: |-
      in gevallen, waarin een met toepassing van het tweede lid aangewezen land als eerste bij de verzending is
      betrokken: de door de bevoegde autoriteit van dat land afgegeven certificaten van goedkeuring van verzending,
      bedoeld in 5.1.5.3.1(c) en 5.1.5.3.1(b) van [bijlage 1 bij de VSG][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010053
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010053
  - number: 3.1.l
    text: |-
      naam en adres van degene, die de verzekering of andere financiële zekerheid, bedoeld in [artikel 4][ref1], zal
      verstrekken alsmede naam en adres van degene die deze verzekering of andere financiële zekerheid zal afsluiten;


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel4
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '1'
  - number: 3.1.m
    text: |-
      in voorkomend geval een nauwkeurige aanduiding van de plaats of de plaatsen, waar opslag van de betrokken
      splijtstoffen of ertsen in verband met het vervoer zal plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel3
  - number: 3.1.n
    text: |-
      indien een vergunning wordt aangevraagd voor een handeling die overeenkomstig de krachtens [artikel 1b][ref1],
      in samenhang met [artikel 4, tweede lid, van het Besluit stralingsbescherming][ref2], geldende regeling als
      gerechtvaardigd is bekendgemaakt, een verwijzing naar die bekendmaking.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel1b
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel4
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: 1b
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '4'
  - number: '3.2'
    text: |-
      Een aanwijzing van landen als bedoeld in het eerste lid, onder h en j, geschiedt bij een door plaatsing in de
      *Staatscourant* bekend te maken besluit van Onze Minister. Uitsluitend aangewezen kunnen worden landen die naar
      het oordeel van Onze Minister toepassing geven aan de ter zake door de Internationale Atoomorganisatie gedane
      aanbevelingen.
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel3
  - number: '3.3'
    text: |-
      Indien een vergunning wordt aangevraagd voor een handeling die niet of als niet-
      gerechtvaardigd is bekendgemaakt overeenkomstig de krachtens [artikel 1b][ref1], in samenhang met
      [artikel 4, tweede lid, van het Besluit stralingsbescherming][ref2] geldende regeling, omvat de aanvraag om een
      vergunning tevens een verzoek om rechtvaardiging van die handeling. De aanvraag om de vergunning bevat dan tevens
      de gegevens met betrekking tot de economische, sociale en andere voordelen van de betrokken handeling en met
      betrekking tot de gezondheidsschade die erdoor kan worden toegebracht, die nodig zijn met het oog op de beoordeling
      van de gerechtvaardigdheid van de handeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel1b
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel4
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: 1b
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '4'
  - number: '4.1'
    text: |-
      Aan een vergunning voor het vervoeren van plutonium of verrijkt uranium bevattende splijtstoffen of voor het
      voorhanden hebben van genoemde stoffen bij opslag in verband met het vervoer wordt met het oog op het zeker stellen
      van de betaling van de vergoeding, aan derden toekomende voor schade, hun toegebracht, het voorschrift verbonden,
      dat het vervoer over, of het voorhanden hebben binnen Nederlands grondgebied slechts mag geschieden, indien degene,
      die voor schade als bedoeld in een bijzondere wettelijke regeling van de aansprakelijkheid op het gebied van de
      kernenergie, veroorzaakt tijdens het vervoer of de opslag van de splijtstoffen, aansprakelijk kan zijn, ter dekking
      van die aansprakelijkheid beschikt over een verzekering of andere financiële zekerheid als in die wettelijke
      regeling bedoeld of over een door Onze Minister van Financiën goedgekeurde verzekering of andere financiële
      zekerheid.
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel4
  - number: '4.2'
    text: |-
      Het vervoeren van plutonium of verrijkt uranium bevattende splijtstoffen over, en het voorhanden hebben van
      genoemde stoffen bij opslag in verband met het vervoer binnen Nederlands grondgebied, waarvoor ingevolge dit
      besluit het in [artikel 15, onder a][ref1], van de wet vervatte verbod niet geldt, mogen slechts geschieden, indien
      degene, die voor schade als bedoeld in een bijzondere wettelijke regeling van de aansprakelijkheid op het gebied
      van de kernenergie, veroorzaakt tijdens het vervoer of de opslag van de splijtstoffen, aansprakelijk kan zijn,
      ter dekking van die aansprakelijkheid beschikt over een verzekering of andere financiële zekerheid als in die
      bijzondere wettelijke regeling bedoeld of over een door Onze Minister van Financiën goedgekeurde verzekering of
      andere financiële zekerheid.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel15
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '15'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '4'
  - number: '4.3'
    text: |-
      Het eerste en tweede lid gelden niet voor het vervoeren en het voorhanden hebben van de daargenoemde stoffen van
      een verrijkingsgraad of in hoeveelheden, waarop de daarbedoelde wettelijke regeling niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel4
  - number: 4c.1
    text: |-
      De ondernemer die een radioactieve stof vervoert, meldt dit vervoer en het voorhanden hebben bij de opslag in
      verband met dat vervoer ten minste drie weken tevoren aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel4c
  - number: 4c.2
    text: |-
      De in het eerste lid bedoelde verplichting geldt niet voor het vervoeren of het voorhanden hebben in verband met
      dat vervoer van radioactieve stoffen voor zover de vervoerder kan aantonen dat hij:
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel4c
  - number: 4c.2.a
    text: dat vervoer reeds heeft vermeld in de globale melding; en
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel4c
  - number: 4c.2.b
    text: |-
      een administratie bijhoudt waarin de gegevens genoemd in [artikel 4d][ref1] zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel4d
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel4c
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: 4d
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '1'
  - number: 4c.3
    text: |-
      De in het eerste lid bedoelde verplichting geldt niet indien er sprake is van aansluitend vervoer in het kader van
      het binnen Nederlands grondgebied (doen) brengen of het voorafgaand vervoer in het kader van het buiten Nederlands
      grondgebeid (doen) brengen als bedoeld in [artikel 27][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel27
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel4c
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '27'
        hoofdstuk: III
        paragraaf: '2'
  - number: 4c.4
    text: |-
      De in het eerste lid bedoelde verplichting geldt niet voor het vervoeren of het voorhanden hebben bij de opslag in
      verband met dat vervoer van een kunstmatige bron of een natuurlijke bron, voorzover deze is of wordt bewerkt met
      het oog op zijn radioactieve eigenschappen, indien:
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel4c
  - number: 4c.4.a
    text: |-
      de activiteit van de radionucliden in de betrokken radioactieve stof lager is dan de in tabel 2.2.7.7.2.1 van
      [bijlage 1 bij het VSG][ref1] vermelde grenswaarde voor de activiteit van een vrijgestelde zending,


      [ref1]: https://wetten.overheid.nl/BWBR0010053
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel4c
    references:
      - id: ref1
        bwb_id: BWBR0010053
  - number: 4c.4.b
    text: |-
      de activiteitsconcentratie van die stof lager is dan de in tabel 2.2.7.7.2.1 van [bijlage 1 bij het VSG][ref1]
      vermelde waarde voor de activiteitsconcentratie voor vrijgestelde stoffen, of


      [ref1]: https://wetten.overheid.nl/BWBR0010053
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel4c
    references:
      - id: ref1
        bwb_id: BWBR0010053
  - number: 4c.4.c
    text: |-
      [artikel 5][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel5
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel4c
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '1'
  - number: 4c.5
    text: |-
      De in het eerste lid bedoelde verplichting geldt niet voor het vervoeren of het voorhanden hebben bij de opslag
      in verband met dat vervoer van een natuurlijke bron, voorzover deze niet is of wordt bewerkt met het oog op zijn
      radioactieve eigenschappen, indien:
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel4c
  - number: 4c.5.a
    text: |-
      de activiteit van de radionucliden in de betrokken natuurlijke bron lager is dan de in tabel 2.2.7.7.2.1 van
      [bijlage 1 bij het VSG][ref1] vermelde grenswaarde voor de activiteit van een vrijgestelde zending,


      [ref1]: https://wetten.overheid.nl/BWBR0010053
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel4c
    references:
      - id: ref1
        bwb_id: BWBR0010053
  - number: 4c.5.b
    text: |-
      de activiteitsconcentratie van de betrokken natuurlijke bron lager is dan tienmaal de in tabel 2.2.7.7.2.1 van
      [bijlage 1 bij het VSG][ref1] vermelde waarde voor de activiteitsconcentratie voor vrijgestelde stoffen, of


      [ref1]: https://wetten.overheid.nl/BWBR0010053
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel4c
    references:
      - id: ref1
        bwb_id: BWBR0010053
  - number: 4c.5.c
    text: |-
      [artikel 5][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel5
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel4c
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '1'
  - number: 4c.6
    text: |-
      Het bij of krachtens [artikel 25, vierde, vijfde en achtste lid, van het Besluit stralingsbescherming][ref1]
      bepaalde is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel25
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel4c
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '25'
  - number: 4c.7
    text: |-
      De in het eerste lid bedoelde verplichting geldt niet voor bij regeling van Onze Minister aangewezen handelingen en
      werkzaamheden, die een beperkt risico van blootstelling van mensen tot gevolg hebben.
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel4c
  - number: 4d.1
    text: |-
      Een melding, als bedoeld in [artikel 4c, eerste lid][ref1], bevat in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel4c
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel4d
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: 4c
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '1'
  - number: 4d.1.a
    text: |-
      de naam en het adres van degene die de melding doet, alsmede van de afzender en de ontvanger van de betrokken
      radioactieve stof;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel4d
  - number: 4d.1.b
    text: de wijze van vervoer en opslag in verband met dat vervoer, waarop de melding betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel4d
  - number: 4d.1.c
    text: |-
      de hoeveelheid radioactieve stoffen waarop de melding betrekking heeft, zo mogelijk onder vermelding van symbool,
      massagetal en energietoestand van de betrokken radionucliden, van de maximale activiteit van de stoffen en van de
      chemische en fysische toestand en de vorm, waarin deze zich bevinden;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel4d
  - number: 4d.1.d
    text: |-
      de vermoedelijke data waarop het vervoer en het voorhanden hebben bij de opslag in verband met dat vervoer
      plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel4d
  - number: 4d.1.e
    text: |-
      indien een melding wordt gedaan voor vervoer en voorhanden hebben bij de opslag in verband met dat vervoer, dat
      krachtens [artikel 1b][ref1], in samenhang met [artikel 4, tweede lid, van het Besluit stralingsbescherming][ref2],
      als gerechtvaardigd is bekendgemaakt, een verwijzing naar die bekendmaking.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel1b
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel4
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel4d
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: 1b
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '4'
  - number: 4d.2
    text: |-
      Indien een melding wordt gedaan voor vervoer en voorhanden hebben bij de opslag in verband met dat vervoer, dat
      niet of als niet-gerechtvaardigd is bekendgemaakt overeenkomstig de krachtens [artikel 1b][ref1], in samenhang
      met [artikel 4, tweede lid, van het Besluit stralingsbescherming][ref2] geldende regeling, omvat de melding
      tevens een verzoek om rechtvaardiging van dat vervoer en het voorhanden hebben bij de opslag in verband met dat
      vervoer. De melding bevat dan tevens de gegevens met betrekking tot de economische, sociale en andere voordelen
      van het betrokken vervoer en het voorhanden hebben bij de opslag in verband met dat vervoer en met betrekking
      tot de gezondheidsschade die erdoor kan worden toegebracht, die nodig zijn met het oog op de beoordeling van de
      gerechtvaardigdheid van het vervoer en het voorhanden hebben bij de opslag in verband met dat vervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel1b
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel4
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel4d
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: 1b
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '4'
  - number: 4d.3
    text: |-
      De ondernemer meldt wijzigingen van de in het eerste lid genoemde gegevens ten minste drie werkdagen voordat
      het vervoer en het voorhanden hebben bij de opslag in verband met dat vervoer, waarop zij betrekking hebben,
      plaatsvindt aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel4d
  - number: 4d.4
    text: De ondernemer verstrekt Onze Minister op zijn verzoek nadere gegevens.
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel4d
  - number: '5.1'
    text: |-
      Het in [artikel 29, eerste lid][ref1], van de wet vervatte verbod zonder vergunning radioactieve stoffen te
      vervoeren of voorhanden te hebben geldt voor het vervoeren en het voorhanden hebben bij opslag in verband met
      het vervoer van stoffen in colli van het type B(M) als bedoeld in hoofdstuk 6.4 van [bijlage 1 bij de VSG][ref2],
      tenzij het model van het collo voldoet aan de eisen met betrekking tot type B(M) zonder voortdurende
      druknivellering, gesteld in 6.4.9.1 en 6.4.7.5 van [bijlage 1 bij de VSG][ref3], en


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0010053
      [ref3]: https://wetten.overheid.nl/BWBR0010053
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002668
