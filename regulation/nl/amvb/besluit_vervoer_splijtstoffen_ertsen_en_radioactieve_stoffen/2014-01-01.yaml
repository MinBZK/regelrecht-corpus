        bwb_id: BWBR0002667
        artikel: '1'
  - number: 1a
    text: 'Dit besluit is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel1a
  - number: 1a.a
    text: radioactieve stoffen, splijtstoffen of ertsen die een integraal onderdeel vormen van het vervoermiddel;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel1a
  - number: 1a.b
    text: |-
      radioactieve stoffen, splijtstoffen of ertsen die binnen een inrichting of een locatie of tussen twee locaties
      binnen een inrichting van de ondernemer worden vervoerd, indien het vervoer onderworpen is aan regelgeving die op
      de inrichting van toepassing is en het vervoer niet via de openbare weg plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel1a
  - number: 1a.c
    text: radioactieve stoffen, splijtstoffen of ertsen, die in het menselijk lichaam of in levende dieren aanwezig zijn;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel1a
  - number: 1a.d
    text: |-
      radioactieve stoffen, splijtstoffen of ertsen in bij regeling van Onze Minister aangewezen producten bestemd voor
      gebruik op of in de directe omgeving van personen;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel1a
  - number: 1a.e
    text: |-
      natuurlijke bronnen waarmee werkzaamheden worden verricht, indien de activiteitsconcentratie daarvan lager is dan
      of gelijk is aan tien keer de waarden, vermeld in tabel 2.2.7.7.2.1 van [bijlage 1 bij de VSG][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010053
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0010053
