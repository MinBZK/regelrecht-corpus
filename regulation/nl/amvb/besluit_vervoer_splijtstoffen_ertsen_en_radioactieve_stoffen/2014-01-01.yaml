  - number: 1b
    text: |-
      Het bij of krachtens de [artikelen 1, derde lid][ref1], [3][ref2],
      [4, eerste, tweede, derde, zesde en zevende lid][ref3], [5][ref4],
      [7, tweede en vierde tot en met zevende lid][ref5], [8][ref6], [9, tweede en vierde lid][ref7],
      [10, eerste en derde lid][ref8], [11, eerste, tweede en zevende lid,][ref9][14, eerste, derde en vierde lid][ref10],
      [15, eerste en vijfde lid][ref11], [16][ref12], [17][ref13], [20, eerste en tweede lid][ref14],
      [48 tot en met 51][ref15], [76 tot en met 80][ref16], [83 tot en met 101][ref17], [112 tot en met 114][ref18],
      [116 tot en met 119][ref19], [122, eerste lid][ref20] en [124 van het Besluit stralingsbescherming][ref21]
      bepaalde, met uitzondering van hetgeen daarin is bepaald over toestellen, is van overeenkomstige toepassing, met
      dien verstande dat:

      a. in [artikel 3, zesde lid][ref22], in plaats van «bijlage 1, tabel 1 en tabel 2», wordt gelezen: tabel
      2.2.7.7.2.1 van bijlage 1 bij de VSG;

      b.

      c. de overeenkomstige toepassing van [artikel 10, eerste lid, onder d][ref23], en
      [11, tweede lid, van het Besluit stralingsbescherming][ref24] geen betrekking heeft op bronnen;

      d. het vervoer van splijtstoffen, ertsen of radioactieve stoffen betreft, Onze Minister van Infrastructuur en
      Milieu;

      e. de [artikelen 114][ref25] en [119][ref26] alleen van overeenkomstige toepassing zijn voor het geval een
      categorie B ongeval wordt opgeschaald tot een categorie A ongeval;

      f. bij de overeenkomstige toepassing van [artikel 124][ref27] in plaats van «die van dit besluit afwijken» wordt
      gelezen: die van de van overeenkomstige toepassing verklaarde artikelen van het Besluit stralingsbescherming
      afwijken.


