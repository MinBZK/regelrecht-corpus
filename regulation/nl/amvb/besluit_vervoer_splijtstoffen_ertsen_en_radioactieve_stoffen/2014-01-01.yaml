  - number: '1.2'
    text: |-
      Een wijziging van de richtlijn vervoer gevaarlijke goederen over land gaat voor de toepassing van dit besluit
      gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel1
  - number: '1.3'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt onder «activiteit», «besmetting», «blootstelling»,
      «effectieve dosis», «equivalente dosis», «gezondheidsschade», «radiologische verrichting» en «schade» verstaan
      hetgeen daaronder wordt verstaan in [artikel 1, eerste lid, van het Besluit stralingsbescherming][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel1
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '1'
  - number: '1.4'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt onder «bron», «kunstmatige
      bron», «open bron» en «natuurlijke bron» verstaan hetgeen daaronder wordt verstaan in
      [artikel 1, eerste lid, van het Besluit stralingsbescherming][ref1], voorzover dat betrekking heeft op radioactieve
      stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel1
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '1'
  - number: '1.5'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt onder «gehalte», «natuurlijk uranium»,
      «verrijkingsgraad» en «verrijkt uranium» verstaan hetgeen daaronder wordt verstaan in
      [artikel 1, eerste lid, van het Besluit kerninstallaties, splijtstoffen en ertsen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel1
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel1
    references:
