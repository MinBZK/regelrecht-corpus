articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *Belgiëvaarder:* Een schip dat, tenzij
      nautische omstandigheden daartoe noodzaken, zonder een haven, overlaadplaats, ankerplaats of wachtplaats in
      Nederland aan te doen, zonder dat er laad-, los- of bunkerhandelingen worden verricht en zonder dat er sprake is
      van het schoonmaken, gasvrijmaken of spoelen van tanks, vaart: 1°. van zee, over de Westerschelde, naar België; of
      2°. vaart van België, over de Westerschelde, naar zee;
        - *collo*: verpakking met radioactieve inhoud, gereed voor verzending;
        - *globale melding:* melding van de te verrichten zendingen binnen een periode van twaalf maanden, welke wordt
      gedaan voorafgaand aan het eerste vervoer binnen die periode;
        - *handeling*: vervoeren, binnen of buiten Nederlands grondgebied brengen, of voorhanden hebben bij opslag in
      verband met vervoer van een: 1º. splijtstof, 2º. erts, 3º. kunstmatige bron of 4º. natuurlijke bron, voorzover deze
      is of wordt bewerkt met het oog op zijn radioactieve eigenschappen, uitgezonderd bij een interventie, een ongeval
      of een radiologische noodsituatie;
        - *lid van de bevolking:* een persoon uit de bevolking binnen of buiten een locatie, niet zijnde een werknemer
      gedurende zijn werktijd of een persoon die een radiologische verrichting ondergaat;
        - *locatie*: inrichting, als bedoeld in [artikel 15, onder b, van de wet][ref1], of als aangewezen krachtens
      [artikel 1.1, derde lid, van de Wet milieubeheer][ref2] of plaats, waar een handeling of een werkzaamheid wordt
      verricht;
        - *ondernemer*: degene onder wiens verantwoordelijkheid een handeling of werkzaamheid wordt verricht;
        - *Onze Minister:* Onze Minister van Economische Zaken, Landbouw en Innovatie;
        - *de richtlijn vervoer gevaarlijke goederen over land:* richtlijn nr. 2008/68/EG van het Europees Parlement en de
      Raad van de Europese Unie van 24 september 2008 betreffende het vervoer van gevaarlijke goederen over land (PbEG
      L 260);
        - VBG: Regeling vervoer over de binnenwateren van gevaarlijke stoffen;
        - VLG: Regeling vervoer over land van gevaarlijke stoffen;
        - VSG: Regeling vervoer over de spoorweg van gevaarlijke stoffen;
        - *werkzaamheid*: vervoeren, binnen of buiten Nederlands grondgebied brengen, of voorhanden hebben bij opslag
      in verband met vervoer van een natuurlijke bron, voorzover deze niet is of wordt bewerkt met het oog op zijn
      radioactieve eigenschappen, uitgezonderd bij een interventie, een ongeval of een radiologische noodsituatie;
        - wet: [Kernenergiewet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002402
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel1
    references:
