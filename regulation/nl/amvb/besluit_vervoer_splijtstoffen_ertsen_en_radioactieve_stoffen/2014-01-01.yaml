  - number: '23'
    text: |-
      1 Het in [artikel 15, onder a, van de wet][ref1] vervatte verbod geldt niet voor het binnen of buiten Nederlands
      grondgebied brengen of doen brengen van splijtstoffen of ertsen indien:

      a. de activiteit van de radionucliden in de betrokken splijtstoffen en ertsen lager is dan de in tabel 2.2.7.7.2.1
      van [bijlage 1 bij het VSG][ref2] vermelde grenswaarde voor de activiteit van een vrijgestelde zending;

      b. de activiteitsconcentratie van die stoffen en ertsen lager is dan de in tabel 2.2.7.7.2.1 van
      [bijlage 1 bij het VSG][ref3] vermelde waarde voor de activiteitsconcentratie voor vrijgestelde stoffen, of

      c. het vervoer, bedoeld in [artikel 13, eerste lid, onderdeel b][ref4], betreft.

      2 Voor de toepassing van het eerste lid worden bestraalde splijtstoffen beoordeeld naar onbestraalde toestand.

      4 Het bij of krachtens [artikel 25, vierde, vijfde en achtste lid, van het Besluit stralingsbescherming][ref5]
      bepaalde is van overeenkomstige toepassing.

      4 Bij regeling van Onze Minister kan worden bepaald dat het eerste lid niet van toepassing is in daarbij aangewezen
      categorieën van gevallen, waarin sprake is van een te hoog risico van blootstelling van werknemers of leden van
      de bevolking.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
