      1 Aan een vergunning voor het vervoeren van splijtstoffen of ertsen over de spoorweg of voor het voorhanden
      hebben van genoemde stoffen bij opslag in verband met zodanig vervoer worden ter voorkoming van schade zodanige
      voorschriften verbonden, dat:

      a. blootstelling en besmetting, zo veel als redelijkerwijs mogelijk is, wordt voorkomen;

      b. in gevallen, waarin blootstelling of besmetting onvermijdelijk is, deze zo veel als redelijkerwijs mogelijk is
      wordt beperkt;

      c. in gevallen, waarin blootstelling of besmetting onvermijdelijk is, het aantal aan ioniserende straling
      blootgestelde personen, met vermijding van een ontoelaatbaar te achten blootstelling of besmetting per persoon, zo
      veel als redelijkerwijs mogelijk is wordt beperkt.

      2 Tot de in het eerste lid bedoelde voorschriften kunnen behoren:

      a. het voorschrift, dat het vervoer dient te geschieden onder daarbij aan te wijzen geleide, dan wel de opslag
      onder daarbij aan te wijzen toezicht;

      b. het voorschrift, dat het vervoer dient plaats te vinden langs een daarbij aan te geven route;

      c. het voorschrift, dat bij opslag in verband met het vervoer, onverminderd de bepalingen, welke terzake
      gelden op grond van andere voorschriften, zodanige maatregelen dienen te worden genomen, dat schade zo veel als
      redelijkerwijs mogelijk is, wordt voorkomen;

      d. het voorschrift, dat bij opslag in verband met het vervoer moet worden voldaan aan door Onze Minister gestelde
      nadere eisen;

      e. het voorschrift dat van de transportroute mag worden afgeweken, indien door een onvoorzien voorval een
      onbelemmerde doorgang van het vervoer niet meer mogelijk is.
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel7
  - number: '8'
    text: |-
      1 Met betrekking tot het vervoeren van splijtstoffen of ertsen over de spoorweg en het voorhanden hebben van
      genoemde stoffen bij opslag in verband met zodanig vervoer zijn de bepalingen van de VSG van toepassing. Indien
      voor het vervoeren van splijtstoffen over de spoorweg of voor het voorhanden hebben van genoemde stoffen bij opslag
      in verband met zodanig vervoer ingevolge dit besluit het in [artikel 15, onder a, van de wet][ref1] vervatte verbod
      geldt, kan Onze Minister aan een vergunning van de VSG afwijkende voorschriften verbinden, voorzover de richtlijn
      vervoer gevaarlijke goederen over land dat toelaat.

      2 Bij het voorhanden hebben van splijtstoffen of ertsen bij opslag in verband met het vervoer over de spoorweg
      dienen, indien daarvoor ingevolge dit besluit het in [artikel 15, onder a, van de wet][ref2] vervatte verbod
      niet geldt, onverminderd de bepalingen, welke terzake gelden ingevolge het eerste lid, eerste volzin, zodanige
      maatregelen te worden genomen, dat schade, zo veel als redelijkerwijs mogelijk is, wordt voorkomen.

      3 Onze Minister kan ontheffing verlenen van de in het eerste lid, eerste volzin, bedoelde bepalingen. Een zodanige
      ontheffing kan onder beperkingen worden verleend. Aan een ontheffing kunnen voorschriften worden verbonden.

      4 De bevoegdheid, bedoeld in het derde lid, eerste volzin, kan alleen worden uitgeoefend in de gevallen en onder
      de voorwaarden, bedoeld in artikel 6, tweede, derde en vijfde lid, van de richtlijn vervoer gevaarlijke goederen
      over land.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel15
