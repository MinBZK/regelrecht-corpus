  - number: '2'
    text: |-
      1 Het in [artikel 15, onder a, van de wet][ref1] vervatte verbod geldt niet voor het vervoeren en het voorhanden
      hebben bij opslag in verband met het vervoer van splijtstoffen of ertsen, indien binnen de locatie:

      a. de activiteit van de radionucliden in de betrokken splijtstoffen of ertsen lager is dan de in tabel 2.2.7.7.2.1
      bij het [VSG][ref2] vermelde grenswaarde voor de activiteit van een vrijgestelde zending, of

      b. de activiteitsconcentratie van die stoffen of ertsen lager is dan de in tabel 2.2.7.7.2.1 bij het [VSG][ref3]
      vermelde waarde voor de activiteitsconcentratie voor vrijgestelde stoffen.

      2 Voor de toepassing van het eerste lid worden bestraalde splijtstoffen beoordeeld naar onbestraalde toestand.

      3 Het bij en krachtens [artikel 25, derde, vierde en zevende lid, van het Besluit stralingsbescherming][ref4]
      bepaalde is van overeenkomstige toepassing.

      4 Bij regeling van Onze Minister kan worden bepaald dat het eerste lid niet van toepassing is in daarbij aangewezen
      categorieën van gevallen, waarin sprake is van een te hoog risico van blootstelling van werknemers of leden van
      de bevolking.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0010053
      [ref3]: https://wetten.overheid.nl/BWBR0010053
      [ref4]: https://wetten.overheid.nl/BWBR0012702#Artikel25
