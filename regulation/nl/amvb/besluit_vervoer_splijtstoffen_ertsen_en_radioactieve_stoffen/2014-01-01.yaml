      1 Het in [artikel 29, eerste lid][ref1], van de wet vervatte verbod zonder vergunning radioactieve stoffen te
      vervoeren of voorhanden te hebben geldt voor het vervoeren en het voorhanden hebben bij opslag in verband met
      het vervoer van stoffen in colli van het type B(M) als bedoeld in hoofdstuk 6.4 van [bijlage 1 bij de VSG][ref2],
      tenzij het model van het collo voldoet aan de eisen met betrekking tot type B(M) zonder voortdurende
      druknivellering, gesteld in 6.4.9.1 en 6.4.7.5 van [bijlage 1 bij de VSG][ref3], en

      a. de activiteit van de radioactieve stoffen niet meer bedraagt dan aangegeven in 5.1.5.2.2 van
      [bijlage 1 bij de VSG][ref4], dan wel

      b. zulks in een door Onze Minister afgegeven certificaat van goedkeuring of erkenning van het model van het te
      vervoeren collo is bepaald.

      2 Het in het eerste lid bedoelde verbod geldt eveneens voor radioactieve stoffen, die worden vervoerd:

      a. op grond van een speciale regeling als bedoeld in 1.7.4 van [bijlage 1 bij de VSG][ref5], of

      b. in colli van type B(M), waarvan de activiteit hoger is dan 3 x 103 A, 3 x 103 A of 1000 TBq, waarbij de laagste
      van deze waarden bepalend is.


