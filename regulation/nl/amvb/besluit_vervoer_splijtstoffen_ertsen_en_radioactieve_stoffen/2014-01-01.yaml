  - number: '2.1'
    text: |-
      Het in [artikel 15, onder a, van de wet][ref1] vervatte verbod geldt niet voor het vervoeren en het voorhanden
      hebben bij opslag in verband met het vervoer van splijtstoffen of ertsen, indien binnen de locatie:


