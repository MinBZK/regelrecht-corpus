  - number: 1d
    text: |-
      Onze Minister kan regels stellen ten aanzien van de beveiliging van het vervoer, de opslag in verband
      met het vervoer en het binnen of buiten Nederlands grondgebied brengen of doen brengen van de in
      [artikel 22 van het Besluit kerninstallaties, splijtstoffen en ertsen bedoelde splijtstoffen en ertsen][ref1] en de
      in [artikel 20ca van het Besluit stralingsbescherming][ref2] bedoelde radioactieve stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel20ca
