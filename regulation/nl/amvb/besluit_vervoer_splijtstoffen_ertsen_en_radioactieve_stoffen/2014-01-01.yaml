  - number: '24'
    text: |-
      1 De aanvraag om een vergunning voor het binnen of buiten Nederlands grondgebied brengen of doen brengen van
      splijtstoffen of ertsen bevat de volgende gegevens:

      a. naam en adres van de aanvrager;

      b. de soort handeling, waarop de aanvraag betrekking heeft;

      c. naam en adres van degene, voor wie de splijtstoffen of ertsen bestemd zijn;

      d. de hoeveelheid, de chemische en fysische toestand, de vorm, het gehalte en de verrijkingsgraad van de
      splijtstoffen of ertsen;

      e. het land van herkomst van de splijtstoffen of ertsen;

      f. het land van bestemming van de splijtstoffen of ertsen;

      g. de vermoedelijke datum, waarop de splijtstoffen of ertsen binnen Nederlands grondgebied zullen worden gebracht,
      of de duur, waarvoor vergunning wordt gevraagd;

      h. de plaats, waar de splijtstoffen of ertsen binnen, onderscheidenlijk buiten Nederlands grondgebied zullen worden
      gebracht;

      i. indien een vergunning wordt aangevraagd voor een handeling die overeenkomstig de krachtens [artikel 1b][ref1],
      in samenhang met [artikel 4, tweede lid, van het Besluit stralingsbescherming][ref2], geldende regeling als
      gerechtvaardigd is bekendgemaakt, een verwijzing naar die bekendmaking.

      2 Indien een vergunning wordt aangevraagd voor een handeling die niet of als niet-
      gerechtvaardigd is bekendgemaakt overeenkomstig de krachtens [artikel 1b][ref3], in samenhang met
      [artikel 4, tweede lid, van het Besluit stralingsbescherming][ref4] geldende regeling, omvat de aanvraag om een
      vergunning tevens een verzoek om rechtvaardiging van die handeling. De aanvraag om de vergunning bevat dan tevens
      de gegevens met betrekking tot de economische, sociale en andere voordelen van de betrokken handeling en met
      betrekking tot de gezondheidsschade die erdoor kan worden toegebracht, die nodig zijn met het oog op de beoordeling
      van de gerechtvaardigdheid van de handeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel1b
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002668#Artikel1b
      [ref4]: https://wetten.overheid.nl/BWBR0012702#Artikel4
