  - number: '13'
    text: |-
      1 Het in [artikel 15, onder a, van de wet][ref1] vervatte verbod geldt niet voor het vervoeren van splijtstoffen
      of ertsen:

      a. over de Nederlandse territoriale zee of over niet-Nederlandse wateren:

      b. door Belgiëvaarders indien voor het vervoer een vergunning is afgegeven door de bevoegde Belgische autoriteiten
      en een melding als bedoeld in het tweede lid is gedaan.

      2 Vervoer, bedoeld in het eerste lid, onderdeel b, wordt ten minste drie weken tevoren gemeld aan Onze Minister
      waarbij de vervoerder de volgende informatie verschaft:

      a. de naam en het adres van degene die de melding doet, alsmede van de afzender en de ontvanger van de betrokken
      splijtstoffen en ertsen;

      b. de hoeveelheid splijtstoffen en ertsen waarop de melding betrekking heeft;

      c. de data waarop het vervoer zal plaatsvinden;

      d. het nummer en de geldigheidsdatum van de vergunning, bedoeld in het eerste lid, onder b.

      3 Een Belgiëvaarder neemt de vergunning, bedoeld in het eerste lid, onder b, in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel13
