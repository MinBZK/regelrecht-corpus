  - number: 32a
    text: |-
      1 De melding, bedoeld in [artikel 32, eerste lid][ref1], bevat in ieder geval:

      a. de naam en het adres van degene die de melding doet, van de afzender van de radioactieve stof of de open bron en
      van de ontvanger daarvan;

      b. de soort handelingen en werkzaamheden waarop de melding betrekking heeft;

      c. het land van herkomst van de radioactieve stoffen of de open bron;

      d. de hoeveelheid radioactieve stoffen of open bronnen, waarop de melding betrekking heeft, zo mogelijk onder
      vermelding van symbool, massagetal en energietoestand van de betrokken radionucliden, van de maximale activiteit
      van de stoffen en van de chemische en fysische toestand en de vorm, waarin deze zich bevinden;

      e. de vermoedelijke data waarop de handelingen en werkzaamheden plaatsvinden;

      f. indien een melding wordt gedaan voor een handeling of werkzaamheid die overeenkomstig de krachtens
      [artikel 1b][ref2], in samenhang met [artikel 4, tweede lid, van het Besluit stralingsbescherming][ref3], geldende
      regeling als gerechtvaardigd is bekendgemaakt, een verwijzing naar die bekendmaking.

      2 Indien een melding wordt gedaan voor een handeling of werkzaamheid die niet of als niet-
      gerechtvaardigd is bekendgemaakt overeenkomstig de krachtens [artikel 1b][ref4], in samenhang met
      [artikel 4, tweede lid, van het Besluit stralingsbescherming][ref5] geldende regeling, omvat de melding tevens
      een verzoek om rechtvaardiging van die handeling of werkzaamheid. De melding bevat dan tevens de gegevens met
      betrekking tot de economische, sociale en andere voordelen van de betrokken handeling of werkzaamheid en met
      betrekking tot de gezondheidsschade die erdoor kan worden toegebracht, die nodig zijn met het oog op de beoordeling
      van de gerechtvaardigdheid van de handeling of werkzaamheid.

      3 Degene die de melding heeft gedaan, meldt wijzigingen van de in het eerste lid genoemde gegevens ten minste drie
      werkdagen voordat de handelingen of werkzaamheden plaatsvinden, waarop ze betrekking hebben, aan Onze Minister.


