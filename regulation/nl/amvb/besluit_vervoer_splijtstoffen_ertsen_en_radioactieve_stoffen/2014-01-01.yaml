      - id: ref4
        bwb_id: BWBR0002668
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '2'
  - number: '17'
    text: |-
      Het in [artikel 15, onder a, van de wet][ref1] vervatte verbod geldt niet voor het vervoeren van splijtstoffen of
      ertsen in een luchtvaartuig, waarbij geen landing op Nederlands grondgebied plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: '18.1'
    text: |-
      Aan een vergunning voor het vervoeren van splijtstoffen of ertsen in een luchtvaartuig of voor het voorhanden
      hebben van genoemde stoffen bij opslag in verband met zodanig vervoer worden ter voorkoming van schade
      voorschriften verbonden als bedoeld in [artikel 7, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel7
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '2'
  - number: '18.2'
    text: 'Tot de in het eerste lid bedoelde voorschriften kunnen behoren:'
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel18
  - number: 18.2.a
    text: |-
      het voorschrift dat bijlage 18 (annex 18) van het op 7 december 1944 te Chicago tot stand gekomen verdrag inzake
      de internationale burgerlijke luchtvaart (*Stb.* 1947, H 165) en de daarbij behorende technische voorschriften
      (Technical Instructions for the safe transport of dangerous goods by air), in acht dienen te worden genomen, met
      dien verstande dat voor de toepassing van die regels voor Nederland Onze Minister als bevoegde autoriteit wordt
      aangemerkt;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel18
  - number: 18.2.b
    text: |-
      voorschriften als bedoeld in [artikel 7, tweede lid, onder c en d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel7
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '2'
  - number: '19.1'
    text: |-
      Bij het vervoeren van splijtstoffen of ertsen in een luchtvaartuig en bij het voorhanden hebben van genoemde
      stoffen bij opslag in verband met zodanig vervoer dienen, indien daarvoor ingevolge dit besluit het in
      [artikel 15, onder a, van de wet][ref1] vervatte verbod niet geldt, bijlage 18 (annex 18) van het op 7 december
      1944 te Chicago tot stand gekomen verdrag inzake de internationale burgerlijke luchtvaart (*Stb.* 1947, H 165) en
      de daarbij behorende technische voorschriften (Technical Instructions for the safe transport of dangerous goods by
      air) in acht te worden genomen, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 19.1.a
    text: voor de toepassing van die regels voor Nederland Onze Minister als bevoegde autoriteit wordt aangemerkt;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel19
  - number: 19.1.b
    text: |-
      voor het vervoer als bedoeld in artikel 17 in een Nederlands luchtvaartuig het bepaalde met betrekking tot de
      goedkeuring van een zending door de voor Nederland bevoegde autoriteit niet geldt;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel19
  - number: 19.1.c
    text: |-
      voor vervoer als bedoeld in artikel 17 in een niet-Nederlands luchtvaartuig het bepaalde met betrekking tot de
      goedkeuring van een zending of van het model van de verpakking door de voor Nederland bevoegde autoriteit niet
      geldt.
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel19
  - number: '19.2'
    text: |-
      Ten aanzien van de in het eerste lid bedoelde bepalingen is [artikel 8, derde lid][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel8
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '2'
  - number: '20'
    text: |-
      Het in [artikel 29, eerste lid][ref1], van de wet vervatte verbod zonder vergunning van Onze Minister radioactieve
      stoffen te vervoeren geldt, in afwijking van [artikel 5][ref2], niet voor het vervoeren van radioactieve stoffen in
      een luchtvaartuig, waarbij geen landing op Nederlands grondgebied plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0002668#Artikel5
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '29'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002668
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '1'
  - number: '21'
    text: |-
      Aan een vergunning voor het vervoeren van radioactieve stoffen in een luchtvaartuig of voor het voorhanden hebben
      van genoemde stoffen bij opslag in verband met zodanig vervoer worden ter voorkoming van schade voorschriften
      verbonden als bedoeld in [artikel 7, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel7
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '2'
  - number: '22.1'
    text: |-
      Bij het vervoeren van radioactieve stoffen in een luchtvaartuig en bij het voorhanden hebben van genoemde stoffen
      bij opslag in verband met zodanig vervoer dienen bijlage 18 (annex 18) van het op 7 december 1944 te Chicago tot
      stand gekomen verdrag inzake de burgerlijke luchtvaart (*Stb.* 1947, H 165) en de daarbij behorende technische
      voorschriften (Technical Instructions for the safe transport of dangerous goods by air) in acht te worden genomen,
      met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel22
  - number: 22.1.a
    text: voor de toepassing van die regels voor Nederland Onze Minister als bevoegde autoriteit wordt aangemerkt;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel22
  - number: 22.1.b
    text: |-
      voor vervoer als bedoeld in [artikel 20][ref1] in een Nederlands luchtvaartuig het bepaalde met betrekking tot de
      goedkeuring van een zending door de voor Nederland bevoegde autoriteit niet geldt;


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel20
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '5'
  - number: 22.1.c
    text: |-
      voor vervoer als bedoeld in [artikel 20][ref1] in een niet-Nederlands luchtvaartuig het bepaalde met betrekking
      tot de goedkeuring van een zending of van het model van de verpakking door de voor Nederland bevoegde autoriteit
      niet geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel20
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '5'
  - number: '22.2'
    text: |-
      Ten aanzien van de in het eerste lid bedoelde bepalingen is [artikel 8, derde lid][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel8
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '2'
  - number: '23.1'
    text: |-
      Het in [artikel 15, onder a, van de wet][ref1] vervatte verbod geldt niet voor het binnen of buiten Nederlands
      grondgebied brengen of doen brengen van splijtstoffen of ertsen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 23.1.a
    text: |-
      de activiteit van de radionucliden in de betrokken splijtstoffen en ertsen lager is dan de in tabel 2.2.7.7.2.1 van
      [bijlage 1 bij het VSG][ref1] vermelde grenswaarde voor de activiteit van een vrijgestelde zending;


      [ref1]: https://wetten.overheid.nl/BWBR0010053
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0010053
  - number: 23.1.b
    text: |-
      de activiteitsconcentratie van die stoffen en ertsen lager is dan de in tabel 2.2.7.7.2.1 van
      [bijlage 1 bij het VSG][ref1] vermelde waarde voor de activiteitsconcentratie voor vrijgestelde stoffen, of


      [ref1]: https://wetten.overheid.nl/BWBR0010053
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0010053
  - number: 23.1.c
    text: |-
      het vervoer, bedoeld in [artikel 13, eerste lid, onderdeel b][ref1], betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel13
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '13'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '4'
  - number: '23.2'
    text: Voor de toepassing van het eerste lid worden bestraalde splijtstoffen beoordeeld naar onbestraalde toestand.
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel23
  - number: '23.4'
    text: |-
      Het bij of krachtens [artikel 25, vierde, vijfde en achtste lid, van het Besluit stralingsbescherming][ref1]
      bepaalde is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel25
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '25'
  - number: '23.4'
    text: |-
      Bij regeling van Onze Minister kan worden bepaald dat het eerste lid niet van toepassing is in daarbij aangewezen
      categorieën van gevallen, waarin sprake is van een te hoog risico van blootstelling van werknemers of leden van
      de bevolking.
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel23
  - number: '24.1'
    text: |-
      De aanvraag om een vergunning voor het binnen of buiten Nederlands grondgebied brengen of doen brengen van
      splijtstoffen of ertsen bevat de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel24
  - number: 24.1.a
    text: naam en adres van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel24
  - number: 24.1.b
    text: de soort handeling, waarop de aanvraag betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel24
  - number: 24.1.c
    text: naam en adres van degene, voor wie de splijtstoffen of ertsen bestemd zijn;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel24
  - number: 24.1.d
    text: |-
      de hoeveelheid, de chemische en fysische toestand, de vorm, het gehalte en de verrijkingsgraad van de splijtstoffen
      of ertsen;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel24
  - number: 24.1.e
    text: het land van herkomst van de splijtstoffen of ertsen;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel24
  - number: 24.1.f
    text: het land van bestemming van de splijtstoffen of ertsen;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel24
  - number: 24.1.g
    text: |-
      de vermoedelijke datum, waarop de splijtstoffen of ertsen binnen Nederlands grondgebied zullen worden gebracht, of
      de duur, waarvoor vergunning wordt gevraagd;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel24
  - number: 24.1.h
    text: |-
      de plaats, waar de splijtstoffen of ertsen binnen, onderscheidenlijk buiten Nederlands grondgebied zullen worden
      gebracht;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel24
  - number: 24.1.i
    text: |-
      indien een vergunning wordt aangevraagd voor een handeling die overeenkomstig de krachtens [artikel 1b][ref1],
      in samenhang met [artikel 4, tweede lid, van het Besluit stralingsbescherming][ref2], geldende regeling als
      gerechtvaardigd is bekendgemaakt, een verwijzing naar die bekendmaking.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel1b
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel4
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: 1b
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '4'
  - number: '24.2'
    text: |-
      Indien een vergunning wordt aangevraagd voor een handeling die niet of als niet-
      gerechtvaardigd is bekendgemaakt overeenkomstig de krachtens [artikel 1b][ref1], in samenhang met
      [artikel 4, tweede lid, van het Besluit stralingsbescherming][ref2] geldende regeling, omvat de aanvraag om een
      vergunning tevens een verzoek om rechtvaardiging van die handeling. De aanvraag om de vergunning bevat dan tevens
      de gegevens met betrekking tot de economische, sociale en andere voordelen van de betrokken handeling en met
      betrekking tot de gezondheidsschade die erdoor kan worden toegebracht, die nodig zijn met het oog op de beoordeling
      van de gerechtvaardigdheid van de handeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel1b
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel4
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: 1b
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '4'
  - number: '25.1'
    text: |-
      Aan een vergunning voor het binnen of buiten Nederlands grondgebied brengen van splijtstoffen of ertsen kunnen ter
      voorkoming van schade de volgende voorschriften worden verbonden:
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel25
  - number: 25.1.a
    text: |-
      het voorschrift, dat de splijtstoffen of ertsen uitsluitend binnen Nederlands grondgebied mogen worden gebracht,
      indien zij bestemd zijn voor een persoon die bevoegd is die stoffen voorhanden te hebben, of voor een persoon in
      een ander land dan Nederland;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel25
  - number: 25.1.b
    text: |-
      het voorschrift, dat de splijtstoffen of ertsen uitsluitend binnen, onderscheidenlijk buiten Nederlands grondgebied
      mogen worden gebracht op de plaats die in het voorschrift is vermeld;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel25
  - number: 25.1.c
    text: |-
      het voorschrift, dat de vergunning of een gewaarmerkt afschrift daarvan desverlangd aan een op grond van
      [artikel 58, eerste lid, van de wet][ref1] aangewezen ambtenaar ter inzage moet worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel58
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '58'
  - number: '25.2'
    text: |-
      Aan een vergunning voor het binnen of buiten Nederlands grondgebied doen brengen van splijtstoffen of ertsen kunnen
      de volgende voorschriften worden verbonden:
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel25
  - number: 25.2.a
    text: |-
      het voorschrift, dat de houder van de vergunning uitsluitend splijtstoffen of ertsen binnen Nederlands grondgebied
      mag doen brengen, indien zij bestemd zijn voor een persoon, die bevoegd is die stoffen voorhanden te hebben, of
      voor een persoon in een ander land dan Nederland;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel25
  - number: 25.2.b
    text: |-
      het voorschrift, dat de houder van de vergunning de splijtstoffen of ertsen uitsluitend binnen, onderscheidenlijk
      buiten Nederlands grondgebied mag doen brengen op een plaats die in het voorschrift is vermeld;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel25
  - number: 25.2.c
    text: |-
      het voorschrift, dat de houder van de vergunning de vergunning of een gewaarmerkt afschrift daarvan ter beschikking
      moet stellen aan degene, die de splijtstoffen of ertsen binnen of buiten Nederlands grondgebied brengt;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel25
  - number: 25.2.d
    text: |-
      het voorschrift, dat de houder van de vergunning er voor dient zorg te dragen, dat aan de voor het betrokken
      vervoer geldende voorschriften met betrekking tot de verpakking en de daarop aan te brengen opschriften en
      gevaarsetiketten wordt voldaan;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel25
  - number: 25.2.e
    text: |-
      het voorschrift dat van de plaats waar de splijtstoffen of ertsen binnen respectievelijk buiten Nederlands
      grondgebied worden gebracht mag worden afgeweken, indien door een onvoorzien voorval een onbelemmerde doorgang van
      het vervoer niet meer mogelijk is.
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel25
  - number: '26.1'
    text: |-
      Degene, die splijtstoffen of ertsen binnen of buiten Nederlands grondgebied brengt, draagt, indien voor het
      binnen Nederlands grondgebied brengen of doen brengen van die splijtstoffen of ertsen een vergunning als bedoeld
      in [artikel 15 van de wet][ref1] is vereist, ervoor zorg dat de vergunning of een gewaarmerkt afschrift daarvan
      tijdens het vervoer bij de splijtstoffen of ertsen aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: '26.2'
    text: |-
      Degene, die splijtstoffen of ertsen binnen of buiten Nederlands grondgebied doet brengen in een geval waarin
      ingevolge dit besluit het in [artikel 15, onder a, van de wet][ref1] vervatte verbod niet geldt, draagt ervoor zorg
      dat aan de voor het betrokken vervoer geldende voorschriften met betrekking tot de verpakking en de daarop aan te
      brengen opschriften en gevaarsetiketten wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: '27.1'
    text: |-
      Het in [artikel 29, eerste lid, van de wet][ref1] vervatte verbod zonder vergunning van Onze Minister radioactieve
      stoffen binnen of buiten Nederlands grondgebied te brengen of te doen brengen geldt voor:


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel29
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '29'
  - number: 27.1.a
    text: geneesmiddelen en
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel27
  - number: 27.1.b
    text: gebruiksartikelen,
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel27
  - number: '27.2'
    text: |-
      Het in het eerste lid, onder b, bedoelde verbod geldt niet voor een kunstmatige bron of een natuurlijke bron,
      voorzover deze is of wordt bewerkt met het oog op zijn radioactieve eigenschappen, indien:
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel27
  - number: 27.2.a
    text: |-
      de activiteit van de radionucliden in de betrokken radioactieve stof lager is dan de in tabel 2.2.7.7.2.1 van
      [bijlage 1 bij het VSG][ref1] vermelde grenswaarde voor de activiteit van een vrijgestelde zending, of


      [ref1]: https://wetten.overheid.nl/BWBR0010053
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0010053
  - number: 27.2.b
    text: |-
      de activiteitsconcentratie van die stof lager is dan de in tabel 2.2.7.7.2.1 van [bijlage 1 bij het VSG][ref1]
      vermelde waarde voor de activiteitsconcentratie voor vrijgestelde stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0010053
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0010053
  - number: '27.3'
    text: |-
      Het in het eerste lid, onder b, bedoelde verbod geldt niet voor een natuurlijke bron, voorzover deze niet is of
      wordt bewerkt met het oog op zijn radioactieve eigenschappen, indien:
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel27
  - number: 27.3.a
    text: |-
      de activiteit van de radionucliden in de betrokken natuurlijke bron lager is dan de in tabel 2.2.7.7.2.1 van
      [bijlage 1 bij het VSG][ref1] vermelde grenswaarde voor de activiteit van een vrijgestelde zending, of


      [ref1]: https://wetten.overheid.nl/BWBR0010053
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0010053
  - number: 27.3.b
    text: |-
      de activiteitsconcentratie van de betrokken natuurlijke bron lager is dan tienmaal de in tabel 2.2.7.7.2.1 van
      [bijlage 1 bij het VSG][ref1] vermelde waarde voor de activiteitsconcentratie voor vrijgestelde stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0010053
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0010053
  - number: '27.4'
    text: |-
      Het bij en krachtens [artikel 25, derde, vierde, zevende en achtste lid, van het Besluit stralingsbescherming][ref1]
      bepaalde is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel25
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '25'
  - number: '27.5'
    text: |-
      Het in het eerste lid bedoelde verbod geldt niet voor bij regeling van Onze Minister aangewezen handelingen en
      werkzaamheden die een beperkt risico van blootstelling van mensen tot gevolg hebben.
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel27
  - number: '27.6'
    text: |-
      De verplichting, bedoeld in [artikel 4c, eerste lid][ref1], geldt niet ingeval er sprake is van een vergunning voor
      het binnen of buiten het Nederlands grondgebied brengen of doen brengen van geneesmiddelen of gebruiksartikelen,
      als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel4c
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: 4c
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '1'
  - number: '28'
    text: |-
      De aanvraag om een vergunning voor het binnen of buiten Nederlands grondgebied brengen of doen brengen van
      radioactieve stoffen als bedoeld in [artikel 27, eerste lid][ref1], bevat de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel27
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '27'
        hoofdstuk: III
        paragraaf: '2'
  - number: 28.a
    text: |-
      de gegevens, bedoeld in [artikel 24, eerste lid, onder a, b en e tot en met i, en tweede lid][ref1], met dien
      verstande dat in plaats van «splijtstoffen of ertsen» telkens wordt gelezen: «radioactieve stoffen» en in plaats
      van «handeling» wordt gelezen: «handeling of werkzaamheid»;


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel24
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '24'
        hoofdstuk: III
        paragraaf: '1'
  - number: 28.b
    text: |-
      een opgave als bedoeld in [artikel 3, eerste lid, onder c][ref1], met dien verstande, dat in plaats van
      "splijtstoffen of ertsen", telkens wordt gelezen: "radioactieve stoffen";


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel3
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '1'
  - number: 28.c
    text: |-
      de hoeveelheid radioactieve stoffen, waarop de aanvraag betrekking heeft, zo mogelijk onder vermelding van symbool,
      massagetal en energietoestand van de betrokken nucliden, van de maximale activiteit van de stoffen en van de
      chemische en fysische toestand en de vorm, waarin deze zich bevinden;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel28
  - number: 28.d
    text: een omschrijving van de geneesmiddelen of gebruiksartikelen, waarin de radioactieve stoffen zich bevinden.
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel28
  - number: '31.1'
    text: |-
      Het binnen Nederlands grondgebied brengen en doen brengen van radioactieve stoffen mag uitsluitend geschieden,
      indien die stoffen bestemd zijn voor een persoon, die bevoegd is die stoffen voorhanden te hebben, of voor een
      persoon in een ander land dan Nederland.
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel31
  - number: '31.2'
    text: |-
      Degene, die radioactieve stoffen binnen Nederlands grondgebied doet brengen, is verplicht er voor zorg te dragen,
      dat aan de voor het betrokken vervoer geldende voorschriften met betrekking tot de verpakking en de daarop aan te
      brengen opschriften en gevaarsetiketten wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel31
  - number: '32.1'
    text: 'De ondernemer onder wiens verantwoordelijkheid:'
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel32
  - number: 32.1.a
    text: |-
      een radioactieve stof binnen het Nederlands grondgebied wordt gebracht vanuit een land buiten de Europese Unie of
      een radioactieve stof vanaf Nederlands grondgebied buiten het grondgebied van de Europese Unie wordt gebracht, of
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel32
  - number: 32.1.b
    text: |-
      een radioactieve stof als open bron vanaf Nederlands grondgebied naar het grondgebied van een andere lidstaat van
      de Europese Unie wordt gebracht, meldt dit tenminste drie weken voordat dit brengen plaatsvindt aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel32
  - number: '32.2'
    text: |-
      De in het eerste lid bedoelde verplichting geldt niet voor het brengen van de aldaar bedoelde stoffen voor zover de
      ondernemer kan aantonen dat hij:
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel32
  - number: 32.2.a
    text: dat vervoer reeds heeft vermeld in de globale melding; en
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel32
  - number: 32.2.b
    text: |-
      een administratie bijhoudt waarin de gegevens genoemd in [artikel 4d][ref1] zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel4d
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: 4d
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '1'
  - number: '32.3'
    text: |-
      De in het eerste lid bedoelde verplichting geldt niet voor een kunstmatige bron of een natuurlijke bron, voorzover
      deze is of wordt bewerkt met het oog op zijn radioactieve eigenschappen, indien:
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel32
  - number: 32.3.a
    text: |-
      de activiteit van de radionucliden in de betrokken radioactieve stof lager is dan de in tabel 2.2.7.7.2.1 van
      [bijlage 1 bij het VSG][ref1] vermelde grenswaarde voor de activiteit van een vrijgestelde zending, of


      [ref1]: https://wetten.overheid.nl/BWBR0010053
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0010053
  - number: 32.3.b
    text: |-
      de activiteitsconcentratie van die stof lager is dan de in tabel 2.2.7.7.2.1 van [bijlage 1 bij het VSG][ref1]
      vermelde waarde voor de activiteitsconcentratie voor vrijgestelde stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0010053
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0010053
  - number: '32.4'
    text: |-
      De in het eerste lid bedoelde verplichting geldt niet voor een natuurlijke bron, voorzover deze niet is of wordt
      bewerkt met het oog op zijn radioactieve eigenschappen, indien:
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel32
  - number: 32.4.a
    text: |-
      de activiteit van de radionucliden in de betrokken natuurlijke bron lager is dan de in tabel 2.2.7.7.2.1 van
      [bijlage 1 bij het VSG][ref1] vermelde grenswaarde voor de activiteit van een vrijgestelde zending; of


      [ref1]: https://wetten.overheid.nl/BWBR0010053
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0010053
  - number: 32.4.b
    text: |-
      de activiteitsconcentratie van de betrokken natuurlijke bron lager is dan tienmaal de in tabel 2.2.7.7.2.1 van
      [bijlage 1 bij het VSG][ref1] vermelde genoemde waarde voor de activiteitsconcentratie voor vrijgestelde stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0010053
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0010053
  - number: '32.5'
    text: |-
      Het bij en krachtens [artikel 25, derde, vierde, zevende en achtste lid, van het Besluit stralingsbescherming][ref1]
      bepaalde is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel25
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '25'
  - number: '32.6'
    text: 'De in het eerste lid bedoelde verplichting geldt niet:'
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel32
  - number: 32.6.a
    text: |-
      voor bij regeling van Onze Minister aangewezen handelingen en werkzaamheden die een beperkt risico van
      blootstelling van mensen tot gevolg hebben, of
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel32
  - number: 32.6.b
    text: |-
      indien [artikel 27, eerste lid][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel27
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '27'
        hoofdstuk: III
        paragraaf: '2'
  - number: 32a.1
    text: |-
      De melding, bedoeld in [artikel 32, eerste lid][ref1], bevat in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel32
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '32'
        hoofdstuk: III
        paragraaf: '2'
  - number: 32a.1.a
    text: |-
      de naam en het adres van degene die de melding doet, van de afzender van de radioactieve stof of de open bron en
      van de ontvanger daarvan;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel32a
  - number: 32a.1.b
    text: de soort handelingen en werkzaamheden waarop de melding betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel32a
  - number: 32a.1.c
    text: het land van herkomst van de radioactieve stoffen of de open bron;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel32a
  - number: 32a.1.d
    text: |-
      de hoeveelheid radioactieve stoffen of open bronnen, waarop de melding betrekking heeft, zo mogelijk onder
      vermelding van symbool, massagetal en energietoestand van de betrokken radionucliden, van de maximale activiteit
      van de stoffen en van de chemische en fysische toestand en de vorm, waarin deze zich bevinden;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel32a
  - number: 32a.1.e
    text: de vermoedelijke data waarop de handelingen en werkzaamheden plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel32a
  - number: 32a.1.f
    text: |-
      indien een melding wordt gedaan voor een handeling of werkzaamheid die overeenkomstig de krachtens
      [artikel 1b][ref1], in samenhang met [artikel 4, tweede lid, van het Besluit stralingsbescherming][ref2], geldende
      regeling als gerechtvaardigd is bekendgemaakt, een verwijzing naar die bekendmaking.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel1b
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel4
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: 1b
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '4'
  - number: 32a.2
    text: |-
      Indien een melding wordt gedaan voor een handeling of werkzaamheid die niet of als niet-
      gerechtvaardigd is bekendgemaakt overeenkomstig de krachtens [artikel 1b][ref1], in samenhang met
      [artikel 4, tweede lid, van het Besluit stralingsbescherming][ref2] geldende regeling, omvat de melding tevens
      een verzoek om rechtvaardiging van die handeling of werkzaamheid. De melding bevat dan tevens de gegevens met
      betrekking tot de economische, sociale en andere voordelen van de betrokken handeling of werkzaamheid en met
      betrekking tot de gezondheidsschade die erdoor kan worden toegebracht, die nodig zijn met het oog op de beoordeling
      van de gerechtvaardigdheid van de handeling of werkzaamheid.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel1b
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel4
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: 1b
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '4'
  - number: 32a.3
    text: |-
      Degene die de melding heeft gedaan, meldt wijzigingen van de in het eerste lid genoemde gegevens ten minste drie
      werkdagen voordat de handelingen of werkzaamheden plaatsvinden, waarop ze betrekking hebben, aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel32a
  - number: 32b
    text: |-
      Het is verboden in strijd te handelen met de artikelen 4, 5 en 6 van Verordening (Euratom) nr. 1493/93 van de Raad
      van 8 juni 1993 betreffende de overbrenging van radioactieve stoffen tussen Lid-Staten van de Europese Gemeenschap
      (PbEG 1993 L148).
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel32b
  - number: '33'
    text: |-
      Het in [artikel 15, onder b, van de wet][ref1] vervatte verbod geldt niet ten aanzien van een inrichting, waarin
      splijtstoffen uitsluitend worden opgeslagen in verband met het vervoer daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: '34.1'
    text: 'Dit besluit kan worden aangehaald als: Besluit vervoer splijtstoffen, ertsen en radioactieve stoffen.'
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel34
  - number: '34.2'
    text: Het treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel34
