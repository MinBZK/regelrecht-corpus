      Het in [artikel 15, onder a, van de wet][ref1] vervatte verbod geldt niet voor het vervoeren van splijtstoffen of
      ertsen in een luchtvaartuig, waarbij geen landing op Nederlands grondgebied plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
