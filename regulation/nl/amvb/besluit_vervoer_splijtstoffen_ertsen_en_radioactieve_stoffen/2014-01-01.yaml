  - number: 1c
    text: |-
      Geen vergunning krachtens dit besluit wordt verleend indien:

      a. niet aan de krachtens [artikel 1b][ref1] in samenhang met de [artikelen 4][ref2], [5][ref3],
      [6][ref4], [9][ref5], [10][ref6], [11][ref7], [48][ref8], [76][ref9], [77][ref10] en
      [78 van het Besluit stralingsbescherming][ref11] geldende voorwaarden betreffende rechtvaardiging, optimalisatie en
      dosislimieten is voldaan;

      b. voor een lid van de bevolking dat zich buiten de locatie bevindt, als gevolg van de handeling of werkzaamheid
      waarvoor de vergunning is aangevraagd en ten gevolge van andere handelingen en werkzaamheden binnen en buiten deze
      locatie, een van de volgende doses wordt overschreden:

      1º. een effectieve dosis van 1 mSv in een kalenderjaar, en met inachtneming daarvan:

      2º. een equivalente dosis van 50 mSv in een kalenderjaar voor de huid gemiddeld over enig huidoppervlak van 1 cm2;

      c. de handeling of werkzaamheid waarvoor de vergunning is aangevraagd, behoort tot een
      categorie die overeenkomstig de krachtens [artikel 1b][ref12] in samenhang met de in
      [artikel 4, tweede lid, van het Besluit stralingsbescherming][ref13] geldende regeling als gerechtvaardigd
      is bekendgemaakt, maar het specifieke karakter van deze handeling of werkzaamheid op grond van
      [artikel 4, eerste lid, van dat besluit][ref14] niet gerechtvaardigd is.


