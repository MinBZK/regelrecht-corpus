  - number: 5.1.a
    text: |-
      de activiteit van de radioactieve stoffen niet meer bedraagt dan aangegeven in 5.1.5.2.2 van
      [bijlage 1 bij de VSG][ref1], dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0010053
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010053
  - number: 5.1.b
    text: |-
      zulks in een door Onze Minister afgegeven certificaat van goedkeuring of erkenning van het model van het te
      vervoeren collo is bepaald.
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel5
  - number: '5.2'
    text: 'Het in het eerste lid bedoelde verbod geldt eveneens voor radioactieve stoffen, die worden vervoerd:'
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel5
  - number: 5.2.a
    text: |-
      op grond van een speciale regeling als bedoeld in 1.7.4 van [bijlage 1 bij de VSG][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0010053
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010053
  - number: 5.2.b
    text: |-
      in colli van type B(M), waarvan de activiteit hoger is dan 3 x 103 A, 3 x 103 A of 1000 TBq, waarbij de laagste van
      deze waarden bepalend is.
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel5
  - number: '6'
    text: |-
      De aanvraag om een vergunning voor het vervoeren van radioactieve stoffen en voor het voorhanden hebben van
      genoemde stoffen bij opslag in verband met het vervoer bevat de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel6
  - number: 6.a
    text: |-
      de gegevens, bedoeld in [artikel 3, eerste lid, onderdelen a tot en met h, m en n, en derde lid][ref1], met
      dien verstande dat telkens in plaats van «splijtstoffen» wordt gelezen: «radioactieve stoffen» en in plaats van
      «handeling»: «handeling of werkzaamheid»;


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel3
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '1'
  - number: 6.b
    text: |-
      in een geval als bedoeld in [artikel 5, eerste lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel5
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '1'
  - number: 6.b.1°
    text: |-
      een afschrift van certificaten van goedkeuring of erkenning van het model van de te vervoeren colli als bedoeld in
      5.1.5.3.1 van [bijlage 1 bij de VSG][ref1], afgegeven door Onze Minister dan wel door de bevoegde autoriteit van
      een ander, met overeenkomstige toepassing van [artikel 3, tweede lid][ref2], aangewezen land,


      [ref1]: https://wetten.overheid.nl/BWBR0010053
      [ref2]: https://wetten.overheid.nl/BWBR0002668#Artikel3
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010053
      - id: ref2
        bwb_id: BWBR0002668
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '1'
  - number: 6.b.2°
    text: |-
      de gegevens, bedoeld in 6.4.23.2(c) van [bijlage 1 bij de VSG][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010053
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010053
  - number: 6.c
    text: |-
      in een geval als bedoeld in [artikel 5, tweede lid][ref1]: de gegevens, bedoeld in 6.4.23.3 van
      [bijlage 1 bij de VSG][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0010053
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0010053
  - number: 6.d
    text: |-
      in gevallen, waarin een met overeenkomstige toepassing van [artikel 3, tweede lid][ref1], aangewezen land als
      eerste bij de verzending is betrokken: de door de bevoegde autoriteiten van dat land afgegeven certificaten van
      goedkeuring van de verzending, bedoeld in 5.1.5.3.1(c) en 5.1.5.3.1(b) van [bijlage 1 bij de VSG][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010053
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0010053
  - number: '7.1'
    text: |-
      Aan een vergunning voor het vervoeren van splijtstoffen of ertsen over de spoorweg of voor het voorhanden
      hebben van genoemde stoffen bij opslag in verband met zodanig vervoer worden ter voorkoming van schade zodanige
      voorschriften verbonden, dat:
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel7
  - number: 7.1.a
    text: blootstelling en besmetting, zo veel als redelijkerwijs mogelijk is, wordt voorkomen;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel7
  - number: 7.1.b
    text: |-
      in gevallen, waarin blootstelling of besmetting onvermijdelijk is, deze zo veel als redelijkerwijs mogelijk is
      wordt beperkt;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel7
  - number: 7.1.c
    text: |-
      in gevallen, waarin blootstelling of besmetting onvermijdelijk is, het aantal aan ioniserende straling
      blootgestelde personen, met vermijding van een ontoelaatbaar te achten blootstelling of besmetting per persoon, zo
      veel als redelijkerwijs mogelijk is wordt beperkt.
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel7
  - number: '7.2'
    text: 'Tot de in het eerste lid bedoelde voorschriften kunnen behoren:'
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel7
  - number: 7.2.a
    text: |-
      het voorschrift, dat het vervoer dient te geschieden onder daarbij aan te wijzen geleide, dan wel de opslag onder
      daarbij aan te wijzen toezicht;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel7
  - number: 7.2.b
    text: het voorschrift, dat het vervoer dient plaats te vinden langs een daarbij aan te geven route;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel7
  - number: 7.2.c
    text: |-
      het voorschrift, dat bij opslag in verband met het vervoer, onverminderd de bepalingen, welke terzake gelden
      op grond van andere voorschriften, zodanige maatregelen dienen te worden genomen, dat schade zo veel als
      redelijkerwijs mogelijk is, wordt voorkomen;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel7
  - number: 7.2.d
    text: |-
      het voorschrift, dat bij opslag in verband met het vervoer moet worden voldaan aan door Onze Minister gestelde
      nadere eisen;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel7
  - number: 7.2.e
    text: |-
      het voorschrift dat van de transportroute mag worden afgeweken, indien door een onvoorzien voorval een onbelemmerde
      doorgang van het vervoer niet meer mogelijk is.
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel7
  - number: '8.1'
    text: |-
      Met betrekking tot het vervoeren van splijtstoffen of ertsen over de spoorweg en het voorhanden hebben van genoemde
      stoffen bij opslag in verband met zodanig vervoer zijn de bepalingen van de VSG van toepassing. Indien voor het
      vervoeren van splijtstoffen over de spoorweg of voor het voorhanden hebben van genoemde stoffen bij opslag in
      verband met zodanig vervoer ingevolge dit besluit het in [artikel 15, onder a, van de wet][ref1] vervatte verbod
      geldt, kan Onze Minister aan een vergunning van de VSG afwijkende voorschriften verbinden, voorzover de richtlijn
      vervoer gevaarlijke goederen over land dat toelaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: '8.2'
    text: |-
      Bij het voorhanden hebben van splijtstoffen of ertsen bij opslag in verband met het vervoer over de spoorweg
      dienen, indien daarvoor ingevolge dit besluit het in [artikel 15, onder a, van de wet][ref1] vervatte verbod
      niet geldt, onverminderd de bepalingen, welke terzake gelden ingevolge het eerste lid, eerste volzin, zodanige
      maatregelen te worden genomen, dat schade, zo veel als redelijkerwijs mogelijk is, wordt voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: '8.3'
    text: |-
      Onze Minister kan ontheffing verlenen van de in het eerste lid, eerste volzin, bedoelde bepalingen. Een zodanige
      ontheffing kan onder beperkingen worden verleend. Aan een ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel8
  - number: '8.4'
    text: |-
      De bevoegdheid, bedoeld in het derde lid, eerste volzin, kan alleen worden uitgeoefend in de gevallen en onder de
      voorwaarden, bedoeld in artikel 6, tweede, derde en vijfde lid, van de richtlijn vervoer gevaarlijke goederen over
      land.
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel8
  - number: '9.1'
    text: |-
      Aan een vergunning voor het vervoeren van radioactieve stoffen over de spoorweg of voor het voorhanden hebben van
      genoemde stoffen bij opslag in verband met zodanig vervoer worden ter voorkoming van schade voorschriften verbonden
      als bedoeld in [artikel 7, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel7
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '2'
  - number: '9.2'
    text: |-
      Tot de in het eerste lid bedoelde voorschriften kunnen behoren voorschriften als bedoeld in
      [artikel 7, tweede lid, onder a en b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel7
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '2'
  - number: '10.1'
    text: |-
      Met betrekking tot het vervoeren van radioactieve stoffen over de spoorweg en het voorhanden hebben van genoemde
      stoffen bij opslag in verband met zodanig vervoer zijn de bepalingen van de VSG van toepassing. Indien voor het
      vervoeren van radioactieve stoffen over de spoorweg of voor het voorhanden hebben van genoemde stoffen bij opslag
      in verband met zodanig vervoer ingevolge dit besluit het in [artikel 29, eerste lid, van de wet][ref1] vervatte
      verbod geldt, kan Onze Minister aan een vergunning van de VSG afwijkende voorschriften verbinden, voorzover de
      richtlijn vervoer gevaarlijke goederen over land dat toelaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002402
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002402
  - number: '10.2'
    text: |-
      Bij het voorhanden hebben van radioactieve stoffen bij opslag in verband met het vervoer over de spoorweg dienen,
      onverminderd de bepalingen, welke terzake gelden ingevolge het eerste lid, eerste volzin, zodanige maatregelen te
      worden genomen, dat schade, zo veel als redelijkerwijs mogelijk is, wordt voorkomen. Daarbij moet worden voldaan
      aan door Onze Minister gestelde nadere eisen.
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel10
  - number: '10.3'
    text: |-
      Ten aanzien van de in het eerste lid, eerste volzin, bedoelde bepalingen is [artikel 8, derde en vierde lid][ref1],
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel8
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '2'
  - number: '11'
    text: |-
      Ten aanzien van het vervoeren van splijtstoffen of ertsen over land, anders dan over de spoorweg, en het voorhanden
      hebben van genoemde stoffen bij opslag in verband met zodanig vervoer zijn de [artikelen 7][ref1] en [8][ref2] van
      overeenkomstige toepassing, met dien verstande dat in plaats van «VSG» telkens wordt gelezen: VLG.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002668#Artikel8
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002668
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '2'
  - number: '12.1'
    text: |-
      Ten aanzien van het vervoeren van radioactieve stoffen over land, anders dan over de spoorweg, en het
      voorhanden hebben van genoemde stoffen bij opslag in verband met zodanig vervoer zijn de [artikelen 9][ref1] en
      [10, eerste en tweede lid][ref2], van overeenkomstige toepassing, met dien verstande dat in plaats van «VSG» wordt
      gelezen: VLG.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002668#Artikel10
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002668
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '2'
  - number: '12.2'
    text: |-
      Ten aanzien van de krachtens het eerste lid van toepassing zijnde bepalingen is
      [artikel 8, derde en vierde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel8
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '2'
  - number: '13.1'
    text: |-
      Het in [artikel 15, onder a, van de wet][ref1] vervatte verbod geldt niet voor het vervoeren van splijtstoffen
      of ertsen:


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 13.1.a
    text: 'over de Nederlandse territoriale zee of over niet-Nederlandse wateren:'
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel13
  - number: 13.1.b
    text: |-
      door Belgiëvaarders indien voor het vervoer een vergunning is afgegeven door de bevoegde Belgische autoriteiten en
      een melding als bedoeld in het tweede lid is gedaan.
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel13
  - number: '13.2'
    text: |-
      Vervoer, bedoeld in het eerste lid, onderdeel b, wordt ten minste drie weken tevoren gemeld aan Onze Minister
      waarbij de vervoerder de volgende informatie verschaft:
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel13
  - number: 13.2.a
    text: |-
      de naam en het adres van degene die de melding doet, alsmede van de afzender en de ontvanger van de betrokken
      splijtstoffen en ertsen;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel13
  - number: 13.2.b
    text: de hoeveelheid splijtstoffen en ertsen waarop de melding betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel13
  - number: 13.2.c
    text: de data waarop het vervoer zal plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel13
  - number: 13.2.d
    text: het nummer en de geldigheidsdatum van de vergunning, bedoeld in het eerste lid, onder b.
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel13
  - number: '13.3'
    text: Een Belgiëvaarder neemt de vergunning, bedoeld in het eerste lid, onder b, in acht.
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel13
  - number: '14.1'
    text: |-
      Ten aanzien van het vervoeren van splijtstoffen of ertsen naar en van zee of over zee zijn de [artikelen 7][ref1]
      en [8, eerste, tweede en derde lid][ref2], van overeenkomstige toepassing met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002668#Artikel8
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002668
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '2'
  - number: 14.1.a
    text: |-
      telkens in plaats van "VSG" wordt gelezen: de International Maritime Dangerous Goods Code, bedoeld in hoofdstuk
      VII, deel A-1, van het op 1 november 1974 te Londen totstandgekomen Verdrag voor de beveiliging van mensenlevens op
      zee (Trb. 1976, 157) en de bij dat verdrag behorende bindende protocollen, aanhangsels en bijlagen;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel14
  - number: 14.1.b
    text: |-
      voor de toepassing van de International Maritime Dangerous Goods Code voor Nederland Onze Minister als bevoegde
      autoriteit wordt aangemerkt;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel14
  - number: 14.1.c
    text: |-
      in plaats van een ingevolge de International Maritime Dangerous Goods Code voor het model van verpakkingen vereiste
      goedkeuring door de bevoegde autoriteiten van een of meer daarbij aangewezen landen is vereist een zodanige
      goedkeuring, welke is verleend:
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel14
  - number: 14.1.c.1°
    text: hetzij door Onze Minister,
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel14
  - number: 14.1.c.2°
    text: |-
      hetzij door de bevoegde autoriteit van een ander land, dat met overeenkomstige toepassing van
      [artikel 3, tweede lid][ref1], is aangewezen en dat bij het vervoer betrokken is of waar het model is ontworpen;


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel3
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '1'
  - number: 14.1.d
    text: |-
      voor vervoer als bedoeld in [artikel 13][ref1] met een schip onder Nederlandse vlag het bepaalde met betrekking tot
      de goedkeuring van de zending door de voor Nederland bevoegde autoriteit niet geldt;


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel13
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '13'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '4'
  - number: 14.1.e
    text: |-
      voor vervoer als bedoeld in [artikel 13][ref1] met een schip onder vreemde vlag het bepaalde met betrekking tot
      de goedkeuring van de zending en van het model van de verpakking door de voor Nederland bevoegde autoriteit niet
      geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel13
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '13'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '4'
  - number: '14.2'
    text: |-
      Ten aanzien van het vervoeren van splijtstoffen of ertsen over de binnenwateren, anders dan van en naar zee, en
      het voorhanden hebben van genoemde stoffen bij opslag in verband met zodanig vervoer zijn de [artikelen 7][ref1] en
      [8, eerste, tweede en derde lid][ref2], van overeenkomstige toepassing, met dien verstande, dat telkens in plaats
      van "VSG" wordt gelezen: VBG.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002668#Artikel8
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002668
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '2'
  - number: '15'
    text: |-
      Het in [artikel 29, eerste lid][ref1], van de wet vervatte verbod zonder vergunning van Onze Minister radioactieve
      stoffen te vervoeren geldt, in afwijking van [artikel 5][ref2], niet voor het vervoeren van radioactieve stoffen
      over de Nederlandse territoriale zee of over niet-Nederlandse wateren.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0002668#Artikel5
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '29'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002668
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '1'
  - number: '16.1'
    text: |-
      Ten aanzien van het vervoeren van radioactieve stoffen naar en van zee of over zee zijn de
      [artikelen 8, derde lid][ref1], [9][ref2] en [10, eerste en tweede lid][ref3], van overeenkomstige toepassing met
      dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002668#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002668#Artikel10
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002668
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002668
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '2'
  - number: 16.1.a
    text: |-
      in [artikel 10, eerste lid][ref1], in plaats van "VSG" wordt gelezen: de International Maritime Dangerous Goods
      Code, bedoeld in hoofdstuk VII, deel A-1, van het op 1 november 1974 te Londen totstandgekomen Verdrag voor
      de beveiliging van mensenlevens op zee (Trb. 1976, 158) en de bij dat verdrag behorende bindende protocollen,
      aanhangsels en bijlagen;


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel10
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '2'
  - number: 16.1.b
    text: |-
      voor de toepassing van de International Maritime Dangerous Goods Code voor Nederland Onze Minister als bevoegde
      autoriteit wordt aangemerkt;
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel16
  - number: 16.1.c
    text: |-
      in plaats van een ingevolge de International Maritime Dangerous Goods Code voor het model van verpakkingen vereiste
      goedkeuring door de bevoegde autoriteiten van een of meer daarbij aangewezen landen is vereist een zodanige
      goedkeuring, welke is verleend:
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel16
  - number: 16.1.c.1°
    text: hetzij door Onze Minister,
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel16
  - number: 16.1.c.2°
    text: |-
      hetzij door de bevoegde autoriteit van een ander land, dat met overeenkomstige toepassing van
      [artikel 3, tweede lid][ref1], is aangewezen en dat bij het vervoer betrokken is of waar het model is ontworpen;


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel3
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '1'
  - number: 16.1.d
    text: |-
      voor vervoer als bedoeld in [artikel 15][ref1] met een schip onder Nederlandse vlag het bepaalde met betrekking tot
      de goedkeuring van de zending door de voor Nederland bevoegde autoriteit niet geldt;


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel15
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '15'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '4'
  - number: 16.1.e
    text: |-
      voor vervoer als bedoeld in [artikel 15][ref1] met een schip onder vreemde vlag het bepaalde met betrekking tot
      de goedkeuring van de zending en van het model van de verpakking door de voor Nederland bevoegde autoriteit niet
      geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel15
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '15'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '4'
  - number: '16.2'
    text: |-
      Ten aanzien van het vervoeren van radioactieve stoffen over de binnenwateren, anders dan van en naar
      zee, en het voorhanden hebben van genoemde stoffen bij opslag in verband met zodanig vervoer zijn de
      [artikelen 8, derde lid][ref1], [9][ref2] en [10, eerste en tweede lid][ref3], van overeenkomstige toepassing met
      dien verstande dat in [artikel 10, eerste lid][ref4], in plaats van "VSG" wordt gelezen: VBG.


      [ref1]: https://wetten.overheid.nl/BWBR0002668#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002668#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002668#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0002668#Artikel10
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002668
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '2'
