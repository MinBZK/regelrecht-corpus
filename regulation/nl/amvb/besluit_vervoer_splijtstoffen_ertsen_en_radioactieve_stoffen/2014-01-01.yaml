    text: |-
      voor een lid van de bevolking dat zich buiten de locatie bevindt, als gevolg van de handeling of werkzaamheid
      waarvoor de vergunning is aangevraagd en ten gevolge van andere handelingen en werkzaamheden binnen en buiten deze
