        artikel: '15'
  - number: '14'
    text: |-
      1 Ten aanzien van het vervoeren van splijtstoffen of ertsen naar en van zee of over zee zijn de [artikelen 7][ref1]
      en [8, eerste, tweede en derde lid][ref2], van overeenkomstige toepassing met dien verstande dat:

      a. telkens in plaats van "VSG" wordt gelezen: de International Maritime Dangerous Goods Code, bedoeld in hoofdstuk
      VII, deel A-1, van het op 1 november 1974 te Londen totstandgekomen Verdrag voor de beveiliging van mensenlevens op
      zee (Trb. 1976, 157) en de bij dat verdrag behorende bindende protocollen, aanhangsels en bijlagen;

      b. voor de toepassing van de International Maritime Dangerous Goods Code voor Nederland Onze Minister als bevoegde
      autoriteit wordt aangemerkt;

      c. in plaats van een ingevolge de International Maritime Dangerous Goods Code voor het model van verpakkingen
      vereiste goedkeuring door de bevoegde autoriteiten van een of meer daarbij aangewezen landen is vereist een
      zodanige goedkeuring, welke is verleend:

      1°. hetzij door Onze Minister,

      2°. hetzij door de bevoegde autoriteit van een ander land, dat met overeenkomstige toepassing van
      [artikel 3, tweede lid][ref3], is aangewezen en dat bij het vervoer betrokken is of waar het model is ontworpen;

      d. voor vervoer als bedoeld in [artikel 13][ref4] met een schip onder Nederlandse vlag het bepaalde met betrekking
      tot de goedkeuring van de zending door de voor Nederland bevoegde autoriteit niet geldt;

      e. voor vervoer als bedoeld in [artikel 13][ref5] met een schip onder vreemde vlag het bepaalde met betrekking tot
      de goedkeuring van de zending en van het model van de verpakking door de voor Nederland bevoegde autoriteit niet
      geldt.

      2 Ten aanzien van het vervoeren van splijtstoffen of ertsen over de binnenwateren, anders dan van en naar zee, en
      het voorhanden hebben van genoemde stoffen bij opslag in verband met zodanig vervoer zijn de [artikelen 7][ref6] en
      [8, eerste, tweede en derde lid][ref7], van overeenkomstige toepassing, met dien verstande, dat telkens in plaats
      van "VSG" wordt gelezen: VBG.


