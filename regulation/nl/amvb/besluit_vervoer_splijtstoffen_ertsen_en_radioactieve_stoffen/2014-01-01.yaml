    text: |-
      De aanvraag om een vergunning voor het vervoeren van radioactieve stoffen en voor het voorhanden hebben van
      genoemde stoffen bij opslag in verband met het vervoer bevat de volgende gegevens:

      a. de gegevens, bedoeld in [artikel 3, eerste lid, onderdelen a tot en met h, m en n, en derde lid][ref1], met
      dien verstande dat telkens in plaats van «splijtstoffen» wordt gelezen: «radioactieve stoffen» en in plaats van
      «handeling»: «handeling of werkzaamheid»;

      b. in een geval als bedoeld in [artikel 5, eerste lid][ref2]:

      1°. een afschrift van certificaten van goedkeuring of erkenning van het model van de te vervoeren colli als bedoeld
      in 5.1.5.3.1 van [bijlage 1 bij de VSG][ref3], afgegeven door Onze Minister dan wel door de bevoegde autoriteit van
      een ander, met overeenkomstige toepassing van [artikel 3, tweede lid][ref4], aangewezen land,

      2°. de gegevens, bedoeld in 6.4.23.2(c) van [bijlage 1 bij de VSG][ref5];

      c. in een geval als bedoeld in [artikel 5, tweede lid][ref6]: de gegevens, bedoeld in 6.4.23.3 van
      [bijlage 1 bij de VSG][ref7];

      d. in gevallen, waarin een met overeenkomstige toepassing van [artikel 3, tweede lid][ref8], aangewezen land als
      eerste bij de verzending is betrokken: de door de bevoegde autoriteiten van dat land afgegeven certificaten van
      goedkeuring van de verzending, bedoeld in 5.1.5.3.1(c) en 5.1.5.3.1(b) van [bijlage 1 bij de VSG][ref9].


