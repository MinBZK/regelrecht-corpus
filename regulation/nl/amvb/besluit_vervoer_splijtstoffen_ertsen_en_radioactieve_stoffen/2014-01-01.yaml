        artikel: '25'
  - number: '3'
    text: |-
      1 De aanvraag om een vergunning voor het vervoeren van splijtstoffen of ertsen, of voor het voorhanden hebben van
      genoemde stoffen of ertsen in verband met het vervoer bevat de volgende gegevens:

      a. naam en adres van de aanvrager;

      b. naam en adres van de afzender;

      c. naam en adres van degene, voor wie de splijtstoffen of ertsen bestemd zijn;

      d. het traject of de trajecten, waarlangs het vervoer zal plaatsvinden;

      e. de uiteindelijke bestemming in geval van overladen, of het doel waarvoor de stoffen of ertsen worden aangewend
      op de plaats van bestemming;

      f. een omschrijving van het vervoermiddel of de vervoermiddelen, waarmede het vervoer zal worden verricht;

      g. de vermoedelijke datum van het vervoer of de duur, waarvoor vergunning wordt gevraagd;

      h. de hoeveelheid te vervoeren splijtstoffen of ertsen;

      i. in gevallen van colli met het type B(M) of indien de bepalingen voor verpakkingen met splijtstoffen in hoofdstuk
      6.4 van [bijlage 1 bij de VSG][ref1] van toepassing zijn:

      1°. een afschrift van certificaten van goedkeuring of erkenning van het model van de te vervoeren colli als bedoeld
      in 5.1.5.3.1 van [bijlage 1 bij de VSG][ref2], afgegeven door Onze Minister dan wel door de bevoegde autoriteit van
      een ander, met toepassing van het tweede lid aangewezen land,

      2°. de gegevens, bedoeld in 6.4.23.2(c) van [bijlage 1 bij de VSG][ref3];

      j. in het geval dat splijtstoffen of ertsen op grond van een speciale regeling als bedoeld in 1.7.4 worden
      vervoerd: de gegevens, bedoeld in 6.4.23.3 van [bijlage 1 bij de VSG][ref4];

      k. in gevallen, waarin een met toepassing van het tweede lid aangewezen land als eerste bij de verzending is
      betrokken: de door de bevoegde autoriteit van dat land afgegeven certificaten van goedkeuring van verzending,
      bedoeld in 5.1.5.3.1(c) en 5.1.5.3.1(b) van [bijlage 1 bij de VSG][ref5];

      l. naam en adres van degene, die de verzekering of andere financiële zekerheid, bedoeld in [artikel 4][ref6], zal
      verstrekken alsmede naam en adres van degene die deze verzekering of andere financiële zekerheid zal afsluiten;

      m. in voorkomend geval een nauwkeurige aanduiding van de plaats of de plaatsen, waar opslag van de betrokken
      splijtstoffen of ertsen in verband met het vervoer zal plaatsvinden;

      n. indien een vergunning wordt aangevraagd voor een handeling die overeenkomstig de krachtens [artikel 1b][ref7],
      in samenhang met [artikel 4, tweede lid, van het Besluit stralingsbescherming][ref8], geldende regeling als
      gerechtvaardigd is bekendgemaakt, een verwijzing naar die bekendmaking.

      2 Een aanwijzing van landen als bedoeld in het eerste lid, onder h en j, geschiedt bij een door plaatsing in de
      *Staatscourant* bekend te maken besluit van Onze Minister.

      Uitsluitend aangewezen kunnen worden landen die naar het oordeel van Onze Minister toepassing geven aan de ter zake
      door de Internationale Atoomorganisatie gedane aanbevelingen.

      3 Indien een vergunning wordt aangevraagd voor een handeling die niet of als niet-
      gerechtvaardigd is bekendgemaakt overeenkomstig de krachtens [artikel 1b][ref9], in samenhang met
      [artikel 4, tweede lid, van het Besluit stralingsbescherming][ref10] geldende regeling, omvat de aanvraag om een
      vergunning tevens een verzoek om rechtvaardiging van die handeling. De aanvraag om de vergunning bevat dan tevens
      de gegevens met betrekking tot de economische, sociale en andere voordelen van de betrokken handeling en met
      betrekking tot de gezondheidsschade die erdoor kan worden toegebracht, die nodig zijn met het oog op de beoordeling
      van de gerechtvaardigdheid van de handeling.


