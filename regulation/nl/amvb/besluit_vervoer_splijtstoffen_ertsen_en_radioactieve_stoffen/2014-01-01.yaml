  - number: '31'
    text: |-
      1 Het binnen Nederlands grondgebied brengen en doen brengen van radioactieve stoffen mag uitsluitend geschieden,
      indien die stoffen bestemd zijn voor een persoon, die bevoegd is die stoffen voorhanden te hebben, of voor een
      persoon in een ander land dan Nederland.

      2 Degene, die radioactieve stoffen binnen Nederlands grondgebied doet brengen, is verplicht er voor zorg te dragen,
      dat aan de voor het betrokken vervoer geldende voorschriften met betrekking tot de verpakking en de daarop aan te
      brengen opschriften en gevaarsetiketten wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0002668/2014-01-01#Artikel31
  - number: '32'
    text: |-
      1 De ondernemer onder wiens verantwoordelijkheid:

      a. een radioactieve stof binnen het Nederlands grondgebied wordt gebracht vanuit een land buiten de Europese Unie
      of een radioactieve stof vanaf Nederlands grondgebied buiten het grondgebied van de Europese Unie wordt gebracht,
      of

      b. een radioactieve stof als open bron vanaf Nederlands grondgebied naar het grondgebied van een andere lidstaat
      van de Europese Unie wordt gebracht, meldt dit tenminste drie weken voordat dit brengen plaatsvindt aan Onze
      Minister.

      2 De in het eerste lid bedoelde verplichting geldt niet voor het brengen van de aldaar bedoelde stoffen voor zover
      de ondernemer kan aantonen dat hij:

      a. dat vervoer reeds heeft vermeld in de globale melding; en

      b. een administratie bijhoudt waarin de gegevens genoemd in [artikel 4d][ref1] zijn opgenomen.

      3 De in het eerste lid bedoelde verplichting geldt niet voor een kunstmatige bron of een natuurlijke bron,
      voorzover deze is of wordt bewerkt met het oog op zijn radioactieve eigenschappen, indien:

      a. de activiteit van de radionucliden in de betrokken radioactieve stof lager is dan de in tabel 2.2.7.7.2.1 van
      [bijlage 1 bij het VSG][ref2] vermelde grenswaarde voor de activiteit van een vrijgestelde zending, of

      b. de activiteitsconcentratie van die stof lager is dan de in tabel 2.2.7.7.2.1 van [bijlage 1 bij het VSG][ref3]
      vermelde waarde voor de activiteitsconcentratie voor vrijgestelde stoffen.

      4 De in het eerste lid bedoelde verplichting geldt niet voor een natuurlijke bron, voorzover deze niet is of wordt
      bewerkt met het oog op zijn radioactieve eigenschappen, indien:

      a. de activiteit van de radionucliden in de betrokken natuurlijke bron lager is dan de in tabel 2.2.7.7.2.1 van
      [bijlage 1 bij het VSG][ref4] vermelde grenswaarde voor de activiteit van een vrijgestelde zending; of

      b. de activiteitsconcentratie van de betrokken natuurlijke bron lager is dan tienmaal de in tabel 2.2.7.7.2.1 van
      [bijlage 1 bij het VSG][ref5] vermelde genoemde waarde voor de activiteitsconcentratie voor vrijgestelde stoffen.

      5 Het bij en krachtens [artikel 25, derde, vierde, zevende en achtste lid, van het Besluit stralingsbescherming][ref6]
      bepaalde is van overeenkomstige toepassing.

      6 De in het eerste lid bedoelde verplichting geldt niet:

      a. voor bij regeling van Onze Minister aangewezen handelingen en werkzaamheden die een beperkt risico van
      blootstelling van mensen tot gevolg hebben, of

      b. indien [artikel 27, eerste lid][ref7], van toepassing is.


