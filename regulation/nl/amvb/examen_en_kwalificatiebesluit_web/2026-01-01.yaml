articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      - *basisberoepsopleiding:* basisberoepsopleiding, genoemd in
      [artikel 7.2.2, eerste lid, onderdeel b, van de wet][ref1];
      - *basisvakken:* onderdelen van een taalschakeltraject waarvoor op grond van
      [artikel 7.3.3, eerste lid, van de wet][ref2] eindtermen zijn vastgesteld bij ministeriële regeling en die
      noodzakelijk zijn voor de toelating tot de beoogde vervolgopleiding;
      - *college*: College voor toetsen en examens als bedoeld in
      [artikel 2, eerste lid, van de Wet College voor toetsen en examens][ref3];
      - *entreeopleiding:* entreeopleiding, genoemd in [artikel 7.2.2, eerste lid, onderdeel a, van de wet][ref4];
      - *examencommissie:* examencommissie als bedoeld in [artikel 7.4.5 van de wet][ref5];
      - *examenonderdeel:* onderdeel van het examen van een beroepsopleiding of een taalschakeltraject;
      - *examenonderdeel kennis van de Nederlandse maatschappij:* examenonderdeel dat de examinering
      betreft van de eindtermen met betrekking tot de kennis van de Nederlandse maatschappij, bedoeld in
      [artikel 8, vierde lid, onderdeel b, van de Wet inburgering 2021][ref6];
      - *generieke examenonderdelen:* examenonderdelen die de examinering betreffen van de generieke kwalificatie-eisen;
      - *generieke kwalificatie-eisen:* eisen die deel uitmaken van alle kwalificaties op eenzelfde niveau, bedoeld in
      [artikel 7.2.2, derde lid, van de wet][ref7], of van alle kwalificaties;
      - *keuzedeel Engels:* keuzedeel waarvan de eisen en het niveau overeenkomen met de eisen en het niveau van het
      onderdeel Engels van een kwalificatie;
      - *keuzedeel Nederlandse taal:* keuzedeel waarvan de eisen en het niveau overeenkomen met de eisen en het niveau
      van het onderdeel Nederlandse taal van een kwalificatie;
      - *keuzedeel rekenen:* keuzedeel waarvan de eisen en het niveau overeenkomen met de eisen en het niveau van het
      onderdeel rekenen van een kwalificatie;
      - *maatwerkvakken:* onderdelen van een taalschakeltraject waarvoor op grond van
      [artikel 7.3.3, eerste lid, van de wet][ref8] eindtermen zijn vastgesteld bij ministeriële regeling en die naar het
      oordeel van het bevoegd gezag noodzakelijk zijn voor de toelating tot de beoogde vervolgopleiding;
      - *middenkaderopleiding:* middenkaderopleiding, genoemd in
      [artikel 7.2.2, eerste lid, onderdeel d, van de wet][ref9];
      - *onderdeel Engels:* onderdeel Engels van een kwalificatie waarvoor op grond van [artikel 17a, vierde lid][ref10],
      van dit besluit generieke kwalificatie-eisen zijn vastgesteld;
      - *onderdeel loopbaan en burgerschap:* onderdeel loopbaan en burgerschap van een kwalificatie waarvoor op grond van
      [artikel 17a, derde lid][ref11], van dit besluit generieke kwalificatie-eisen zijn vastgesteld;
      - *onderdeel Nederlandse taal:* onderdeel Nederlandse taal van een kwalificatie
      dat is vastgesteld overeenkomstig het referentieniveau Nederlandse taal, bedoeld in
      [artikel 2, tweede lid, aanhef en onderdeel d, van de Wet referentieniveaus Nederlandse taal en rekenen][ref12];
      - *onderdeel rekenen:* onderdeel rekenen van een kwalificatie dat is
      vastgesteld overeenkomstig het referentieniveau rekenen, bedoeld in
      [artikel 2, tweede lid, aanhef en onderdeel d, van de Wet referentieniveaus Nederlandse taal en rekenen][ref13];
      - *pilotexamen:* centraal examen dat bij wijze van proef wordt afgenomen in een periode voorafgaand aan de
      invoering van centrale examinering voor het betreffende examenonderdeel overeenkomstig daarvoor bij of krachtens
      [artikel 19][ref14] gestelde eisen;
      - *specialistenopleiding:* specialistenopleiding, genoemd in
      [artikel 7.2.2, eerste lid, onderdeel e, van de wet][ref15];
      - *specifieke examenonderdelen:* examenonderdelen die de examinering betreffen van de specifieke kwalificatie-eisen
      die als kerntaken zijn opgenomen in het kwalificatiedossier van de beroepsopleiding waarin examen wordt gedaan;
      - *specifieke kwalificatie-eisen:* eisen die deel uitmaken van een bepaalde kwalificatie;
      - *student:* student en in voorkomende gevallen extraneus als bedoeld in
      [artikel 8.1.1, eerste lid, van de wet][ref16];
      - *taalschakeltrajecten:* opleidingen educatie als bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel f, van de Wet educatie en beroepsonderwijs][ref17] aan instellingen met
      diploma-erkenning als bedoeld in [artikel 1.4a.1 van de Wet educatie en beroepsonderwijs][ref18], welke opleidingen
      zijn gericht op het begeleiden van anderstaligen richting het beroeps- of wetenschappelijk onderwijs;
      - *vakopleiding:* vakopleiding, genoemd in [artikel 7.2.2, eerste lid, onderdeel c, van de wet][ref19];
      - *wet:* [Wet educatie en beroepsonderwijs][ref20].


