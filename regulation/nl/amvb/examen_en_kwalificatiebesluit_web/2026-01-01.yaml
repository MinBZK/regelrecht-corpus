  - number: '9'
    text: >-
      De examencommissie zorgt er in ieder geval voor dat:


      a. de opgaven van het centraal examen geheim blijven tot de aanvang van de toets waarbij de opgaven aan de
      studenten worden voorgelegd;


      b. het nodige toezicht bij het centraal examen wordt uitgeoefend, en


      c. het door het college vastgestelde examenprotocol in acht wordt genomen.
    url: https://wetten.overheid.nl/BWBR0027963/2026-01-01#Artikel9
  - number: '10'
    text: >-
      1 De examencommissie beoordeelt het gemaakte werk van het centraal examen overeenkomstig de door het college
      vastgestelde beoordelingsnormen en de daarbij behorende scores.


      2 Bij de beoordeling van toetsen bestaande uit open vragen vindt de correctie plaats overeenkomstig de door het
      college vastgestelde regels.


      3 De examencommissie zet de scores in cijfers om overeenkomstig de daarvoor door het college vastgestelde regels.
    url: https://wetten.overheid.nl/BWBR0027963/2026-01-01#Artikel10
  - number: '11'
    text: >-
      1 Indien het centraal examen naar het oordeel van de inspectie niet volgens de geldende regels is afgenomen, kan
      zij besluiten dat het geheel of gedeeltelijk voor een of meer studenten opnieuw wordt afgenomen.


      2 De inspectie verzoekt het college zonodig nieuwe opgaven vast te stellen en te bepalen op welke wijze en door wie
      het examen zal worden afgenomen.
    url: https://wetten.overheid.nl/BWBR0027963/2026-01-01#Artikel11
  - number: '12'
    text: >-
      Indien door onvoorziene omstandigheden het centraal examen voor één of meer onderdelen van één of meer
      beroepsopleidingen niet op de voorgeschreven wijze kan worden afgenomen, beslist Onze Minister hoe in dat geval
      moet worden gehandeld.
    url: https://wetten.overheid.nl/BWBR0027963/2026-01-01#Artikel12
  - number: 12a
    text: >-
      De examencommissie kan in verband met onvoldoende beheersing van de Nederlandse taal de duur van de desbetreffende
      toets van het centraal examen voor het onderdeel Nederlandse taal met ten hoogste 30 minuten verlengen ten aanzien
      van een student die met inbegrip van het studiejaar waarin hij examen aflegt, ten hoogste zes jaren onderwijs in
      Nederland heeft gevolgd en voor wie het Nederlands niet de moedertaal is.
    url: https://wetten.overheid.nl/BWBR0027963/2026-01-01#Artikel12a
  - number: '13'
    text: |-
      Het instellingsexamen vindt plaats overeenkomstig de door de examencommissie krachtens de [wet][ref1] vastgestelde
      regels.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0027963/2026-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: '14'
    text: >-
      Bij gedeeltelijk centrale examinering van een examenonderdeel worden de waarderingen voor zowel het
      instellingsexamen als het centraal examen uitgedrukt in cijfers uit de reeks 1 tot en met 10 met één decimaal.
    url: https://wetten.overheid.nl/BWBR0027963/2026-01-01#Artikel14
  - number: '15'
    text: >-
      1 De eindwaardering voor een generiek examenonderdeel en het examen in een keuzedeel dat wat betreft eisen en
      niveau overeenkomt met een onderdeel rekenen, een onderdeel Nederlandse taal of het onderdeel Engels van een
      middenkaderopleiding of een specialistenopleiding wordt uitgedrukt in een geheel cijfer uit de reeks 1 tot en met
      10. Indien de uitkomst van de berekening niet een geheel getal is, wordt dat getal indien het eerste cijfer achter
      de komma een 4 of lager is, naar beneden afgerond en indien dat cijfer een 5 of hoger is, naar boven afgerond.


      2 De eindwaardering voor andere examenonderdelen wordt uitgedrukt op de wijze, genoemd in het eerste lid, of met
      een waardering uit een reeks:


      a. die in ieder geval de waarderingen «onvoldoende», «voldoende» en «goed» bevat; en


      b. waarin tevens uitsluitend de waarderingen «zeer slecht», «slecht», «ruim onvoldoende», «bijna voldoende», «ruim
      voldoende», «zeer goed» en «uitmuntend» kunnen worden opgenomen.


      3 Indien een examenonderdeel uitsluitend bestaat uit een centraal examen dan wel een instellingsexamen, is de
      waardering voor dat onderdeel tevens de eindwaardering voor dat onderdeel.


      4 Indien een examenonderdeel bestaat uit zowel een centraal examen als een instellingsexamen, bepaalt de
      examencommissie de eindwaardering voor dat onderdeel op het rekenkundig gemiddelde van het cijfer voor het
      instellingsexamen en het cijfer voor het centraal examen.


      5 In afwijking van het eerste lid wordt de eindwaardering voor het onderdeel loopbaan en burgerschap uitgedrukt in
      «niet voldaan» of «voldaan».


      6 In afwijking van het eerste lid wordt de eindwaardering voor het generieke examenonderdeel rekenen voor een
      entreeopleiding uitgedrukt in «niet voldaan» of «voldaan».
    url: https://wetten.overheid.nl/BWBR0027963/2026-01-01#Artikel15
  - number: '16'
    text: |-
      De examencommissie stelt de uitslag van het examen vast met inachtneming van [artikel 17][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027963#Artikel17
    url: https://wetten.overheid.nl/BWBR0027963/2026-01-01#Artikel16
    references:
