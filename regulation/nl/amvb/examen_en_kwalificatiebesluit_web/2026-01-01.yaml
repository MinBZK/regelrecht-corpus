        bwb_id: BWBR0027963
        artikel: '17'
        hoofdstuk: II
        paragraaf: '4'
  - number: '17'
    text: |-
      1 Onverminderd [artikel 7.4.6, tweede lid, van de wet][ref1] is het examen voor de entreeopleiding met goed gevolg
      afgelegd, indien:

      a. voor alle specifieke examenonderdelen en het keuzedeel dat deel uitmaakt van de desbetreffende opleiding een
      eindwaardering van ten minste het cijfer 6 of ten minste «voldoende» is behaald;

      b. voor het onderdeel loopbaan en burgerschap een eindwaardering «voldaan» is behaald; en

      c. voor het onderdeel rekenen een eindwaardering «voldaan» is behaald.

      2 Onverminderd [artikel 7.4.6, tweede lid, van de wet][ref2] is het examen voor de basisberoepsopleiding en de
      vakopleiding met goed gevolg afgelegd, indien:

      a. voor één van de generieke examenonderdelen Nederlandse taal en rekenen een eindwaardering van ten minste het
      cijfer 5 en voor het andere genoemde generieke examenonderdeel ten minste het cijfer 6 is behaald;

      b. voor alle specifieke examenonderdelen een eindwaardering van ten minste het cijfer 6 of ten minste «voldoende»
      is behaald;

      c. voor het onderdeel loopbaan en burgerschap een eindwaardering «voldaan» is behaald; en

      d. voor het keuzedeel dat deel uitmaakt van de beroepsopleiding een eindwaardering van ten minste het cijfer 6 of
      ten minste «voldoende» is behaald of, indien twee of meer keuzedelen deel uitmaken van de beroepsopleiding, het
      volgende resultaat is behaald:

      1° voor de keuzedelen waarmee wordt voldaan aan de minimum studielast, bedoeld in [artikel 17d][ref3], is een
      gemiddelde eindwaardering van ten minste het cijfer 6 of ten minste «voldoende» behaald, en

      2° voor ten minste de helft van de keuzedelen waarmee wordt voldaan aan de minimum studielast, bedoeld in
      [artikel 17d][ref4], is een eindwaardering van ten minste het cijfer 6 of ten minste «voldoende» behaald en voor de
      overige keuzedelen waarmee wordt voldaan aan de minimum studielast, bedoeld in artikel 17d, is een eindwaardering
      van ten minste het cijfer 4 of een daarmee overeenkomende eindwaardering behaald.

      3 Onverminderd [artikel 7.4.6, tweede lid, van de wet][ref5] is het examen voor de middenkaderopleiding en de
      specialistenopleiding met goed gevolg afgelegd, indien:

      a. voor één van de generieke examenonderdelen Engels, Nederlandse taal en rekenen een eindwaardering van ten minste
      het cijfer 5 en voor de andere genoemde generieke examenonderdelen ten minste het cijfer 6 is behaald;

      b. voor alle specifieke examenonderdelen een eindwaardering van ten minste het cijfer 6 of ten minste «voldoende»
      is behaald;

      c. voor het onderdeel loopbaan en burgerschap een eindwaardering «voldaan» is behaald; en

      d. voor het keuzedeel dat deel uitmaakt van de beroepsopleiding een eindwaardering van ten minste het cijfer 6 of
      ten minste «voldoende» is behaald of, indien twee of meer keuzedelen deel uitmaken van de beroepsopleiding, het
      volgende resultaat is behaald:

      1° voor de keuzedelen waarmee wordt voldaan aan de minimum studielast, bedoeld in [artikel 17d][ref6], is een
      gemiddelde eindwaardering van ten minste het cijfer 6 of ten minste «voldoende» behaald, en

      2° voor ten minste de helft van de keuzedelen waarmee wordt voldaan aan de minimum studielast, bedoeld in
      [artikel 17d][ref7], is een eindwaardering van ten minste het cijfer 6 of ten minste «voldoende» behaald en voor de
      overige keuzedelen waarmee wordt voldaan aan de minimum studielast, bedoeld in artikel 17d, is een eindwaardering
      van ten minste het cijfer 4 of een daarmee overeenkomende eindwaardering behaald.

      4 Het eerste tot en met derde lid zijn van toepassing met inachtneming van het bepaalde in
      [artikel 19, vierde lid][ref8].


