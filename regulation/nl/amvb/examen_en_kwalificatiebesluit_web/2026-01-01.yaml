  - number: '2'
    text: |-
      Dit hoofdstuk is van toepassing op examens van een beroepsopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.2
    url: https://wetten.overheid.nl/BWBR0027963/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 7.2.2
  - number: '3'
    text: >-
      1 Het examen bestaat voor iedere beroepsopleiding uit generieke examenonderdelen, specifieke examenonderdelen en
      examenonderdelen die een keuzedeel betreffen.


      2 De generieke examenonderdelen betreffen de onderdelen:


      a. Nederlandse taal;


      b. rekenen;


      c. loopbaan en burgerschap; en


      d. voor zover het betreft de middenkaderopleiding en de specialistenopleiding: Engels.


      3 Het examen bestaat voor ieder onderdeel van een beroepsopleiding uit een instellingsexamen of een centraal examen
      dan wel beide.


      4 Het derde lid is niet van toepassing op het onderdeel loopbaan en burgerschap. Het bevoegd gezag stelt de eisen
      waaraan de student voor dit onderdeel moet voldoen vast met inachtneming van het kwalificatiedossier.


      5 Indien voor een onderdeel van een beroepsopleiding gedeeltelijk centrale examinering plaatsvindt, wordt bij
      ministeriële regeling bepaald over welk gedeelte het instellingsexamen voor dat onderdeel zich uitstrekt.
    url: https://wetten.overheid.nl/BWBR0027963/2026-01-01#Artikel3
  - number: 3a
    text: |-
      1 Na toestemming van de examencommissie kan een student een generiek examenonderdeel afleggen op een hoger niveau
      dan vastgesteld voor zijn beroepsopleiding.

      2 Indien de student een generiek examenonderdeel op een hoger niveau heeft afgelegd, wordt het hierbij behaalde
      cijfer gebruikt voor de eindwaardering, bedoeld in [artikel 15][ref1].

      3 Indien een student zijn generiek examenonderdeel Engels of Nederlandse taal op een hoger niveau aflegt, wordt het
      instellingsexamen op één niveau afgelegd.

      4 Het niveau waarop het instellingsexamen Nederlandse taal wordt afgelegd, is hetzelfde niveau als waarop het
      centraal examen wordt afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0027963#Artikel15
    url: https://wetten.overheid.nl/BWBR0027963/2026-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0027963
        artikel: '15'
        hoofdstuk: II
        paragraaf: '4'
  - number: 3b
    text: |-
      1 De examencommissie kan vrijstelling verlenen van het afleggen van een examenonderdeel of een deel daarvan, op
      verzoek van de student.

      2 De examencommissie beslist met ten minste inachtneming van de wettelijk vastgestelde eisen voor de kwalificatie,
      voor het keuzedeel, en voor de vaststelling van de uitslag, bedoeld in [artikel 17][ref1].

      3 Indien de examencommissie vrijstelling verleent, telt de eerder behaalde waardering mee voor de eindwaardering,
      bedoeld in [artikel 15][ref2].

      4 De examencommissie beslist of de vrijstelling betrekking heeft op het gehele examenonderdeel, dan wel in
      voorkomend geval op het centraal examen, het instellingsexamen dan wel een deel van het instellingsexamen.

      5 De examencommissie verleent slechts vrijstelling van het examenonderdeel Nederlandse taal, rekenen of Engels of
      een deel daarvan, indien zij vaststelt dat de student reeds eerder examen heeft afgelegd op ten minste hetzelfde
      niveau als vastgesteld voor zijn beroepsopleiding:

      a. als examenonderdeel van een andere beroepsopleiding, of van dezelfde beroepsopleiding bij een andere instelling;
      of

      b. als eind- of staatsexamen of deeleindexamen zoals vastgesteld voor havo of vwo.


      [ref1]: https://wetten.overheid.nl/BWBR0027963#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0027963#Artikel15
    url: https://wetten.overheid.nl/BWBR0027963/2026-01-01#Artikel3b
    references:
