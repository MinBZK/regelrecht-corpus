  - number: 17e
    text: Dit hoofdstuk is van toepassing op de examens van een taalschakeltraject.
    url: https://wetten.overheid.nl/BWBR0027963/2026-01-01#Artikel17e
  - number: 17f
    text: |-
      1 Het examen van een taalschakeltraject bestaat uit de volgende examenonderdelen:

      a. examenonderdelen basisvakken;

      b. examenonderdelen maatwerkvakken;

      c. examenonderdeel kennis van de Nederlandse maatschappij;

      d. examenonderdeel leervaardigheden; en

      e. examenonderdeel vaardigheden voor opleidings- en beroepskeuze.

      2 Het examen voor een basisvak of een maatwerkvak bestaat uit een instellingsexamen, met uitzondering van het
      examen voor de vakken «Nederlands als tweede taal ERK-niveau B1» en «Nederlands als tweede taal ERK-niveau B2» dat
      uit een staatsexamen als bedoeld in [artikel 17h][ref1] bestaat.

      3 Het examen voor het examenonderdeel kennis van de Nederlandse maatschappij bestaat uit een examen als bedoeld
      in [artikel 17i][ref2].

      4 Voor de examenonderdelen leervaardigheden en vaardigheden voor opleidings- en beroepskeuze stelt het
      bevoegd gezag eisen vast waaraan de deelnemer moet voldoen met inachtneming van de eindtermen die voor het
      taalschakeltraject zijn vastgesteld op grond van [artikel 7.3.3, eerste lid, van de wet][ref3].

      5 Indien naar het oordeel van het bevoegd gezag geen maatwerkvakken noodzakelijk zijn voor de toelating tot de
      beoogde vervolgopleiding, hoeft het examen van een taalschakeltraject in afwijking van het eerste lid niet uit
      maatwerkvakken te bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0027963#Artikel17h
      [ref2]: https://wetten.overheid.nl/BWBR0027963#Artikel17i
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7.3.3
    url: https://wetten.overheid.nl/BWBR0027963/2026-01-01#Artikel17f
