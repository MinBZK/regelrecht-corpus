    text: >-
      De examens voor de vakken «Nederlands als tweede taal ERK-niveau B1» of «Nederlands als tweede taal ERK-niveau B2»
      vinden plaats overeenkomstig de regels van het Staatsexamenbesluit Nederlands als tweede taal.
