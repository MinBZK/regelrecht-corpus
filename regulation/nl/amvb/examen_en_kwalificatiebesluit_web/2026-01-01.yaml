        hoofdstuk: II
        paragraaf: '4'
  - number: '5'
    text: >-
      Gedeeltelijk centrale examinering vindt plaats voor het onderdeel Nederlandse taal van de basisberoepsopleiding,
      de vakopleiding, de middenkaderopleiding en de specialistenopleiding, en voor het onderdeel Engels van de
      middenkaderopleiding en de specialistenopleiding en voor de daarmee wat betreft eisen en niveau overeenkomende
      keuzedelen.
    url: https://wetten.overheid.nl/BWBR0027963/2026-01-01#Artikel5
  - number: '6'
    text: >-
      1 Het college is belast met de volgende taken op het gebied van de centrale examinering:


      a. het tot stand brengen en bij regeling vaststellen van syllabi overeenkomstig de voor de desbetreffende soort
      opleiding vastgestelde eindtermen of kwalificatiedossiers;


      b. het vaststellen van het aantal toetsen, de tijdsduur en de aard van de toetsen, overeenkomstig de voor de
      desbetreffende soort opleiding vastgestelde eindtermen of kwalificatiedossiers;


      c. het vaststellen van de wijze waarop en de vorm waarin de toetsen worden afgenomen;


      d. het tijdig tot stand brengen en tijdig vaststellen van de opgaven;


      e. het geven van regels voor digitale examinering;


      f. het tot stand brengen en bij regeling vaststellen van de beoordelingsnormen en de daarbij behorende scores;


      g. het geven van regels voor de omzetting van de scores in cijfers;


      h. het geven van regels met betrekking tot de hulpmiddelen die gebruikt mogen worden bij het maken van opgaven;


      i. het geven van regels voor een aangepaste wijze of vorm van examineren bij studenten met een handicap rekening
      houdend met de aard van de handicap;


      j. het bij regeling vaststellen van een examenprotocol waarin de gang van zaken bij centrale examinering is
      vastgelegd, waaronder begrepen te nemen maatregelen bij onregelmatigheden begaan door studenten, het bewaren van
      het gemaakte examenwerk en de wijze waarop belanghebbenden kunnen kennisnemen van de beoordeling daarvan.


      2 Voor zover toetsen bestaan uit open vragen geeft het college tevens regels voor de uitvoering van de correctie.


      3 Het college stelt de tijdvakken vast waarin centrale examinering kan plaatsvinden. De vaststelling geschiedt voor
      aanvang van elk studiejaar na instemming van Onze Minister.


      4 De regelingen, bedoeld in het eerste lid, onderdelen a, g, i en j, alsmede het tweede lid, treden slechts in
      werking na goedkeuring door Onze Minister. Onze Minister kan zijn goedkeuring onthouden wegens strijd met het recht
      of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0027963/2026-01-01#Artikel6
  - number: '7'
    text: Onze Minister zorgt ervoor dat de instellingen tijdig beschikken over de opgaven.
    url: https://wetten.overheid.nl/BWBR0027963/2026-01-01#Artikel7
  - number: '8'
    text: |-
      1 Indien de student voor een centraal examen een waardering lager dan het cijfer 6 heeft behaald, heeft hij recht
      op ten minste één herkansing voor dit centraal examen of indien hij ingevolge [artikel 3a, eerste lid][ref1],
      zijn examen op een hoger niveau heeft afgelegd, heeft hij recht op herkansing op het niveau van de desbetreffende
      beroepsopleiding.

      2 Indien de student voor een centraal examen een waardering van ten minste het cijfer 6 heeft behaald, heeft
      hij recht op één herkansing voor dit centraal examen, tenzij hij eerder gebruik heeft gemaakt van het recht op
      herkansing, bedoeld in het eerste lid. De student kan daarbij op zijn verzoek het desbetreffende examenonderdeel op
      een hoger niveau afleggen dan vastgesteld voor zijn beroepsopleiding.

      3 De student wordt binnen de voor hem geldende studieduur voor de eerste maal in de gelegenheid gesteld de
      herkansing af te leggen, tenzij hij geen gebruik heeft gemaakt van de voor hem vastgestelde eerste gelegenheid tot
      het afleggen van het centraal examen.

      4 Nadat de student gebruik heeft gemaakt van een herkansingsmogelijkheid voor een centraal examen wordt het hoogste
      door de student behaalde cijfer voor dit centraal examen gebruikt bij het bepalen van de eindwaardering, bedoeld
      in [artikel 15][ref2].

      5 Indien een generiek examenonderdeel mede op een hoger niveau is afgelegd, en voor elk examenonderdeel ten
      minste het cijfer 6 is behaald, bepaalt de examencommissie in afwijking van het vierde lid in overleg met
      de student welk cijfer wordt gebruikt voor het bepalen van de eindwaardering, bedoeld in [artikel 15][ref3].
      [Artikel 3a, tweede lid][ref4], is niet van toepassing.

      6 De student heeft per tijdvak ten hoogste twee gelegenheden per referentieniveau tot het afleggen van een centraal
      examen of een herkansing daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0027963#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0027963#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0027963#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0027963#Artikel3a
    url: https://wetten.overheid.nl/BWBR0027963/2026-01-01#Artikel8
