  - number: 18c
    text: |-
      1 Voor de student die voor 1 augustus 2022 een aanvang heeft gemaakt met zijn beroepsopleiding en deze opleiding
      uiterlijk heeft voltooid in de periode die overeenkomt met de voor hem geldende studieduur vermeerderd met twee
      studiejaren als bedoeld in [artikel 7.2.4, zevende lid, van de wet][ref1]:

      a. zijn de begripsbepaling *centraal examen ER voor het onderdeel rekenen* en de [artikelen 4][ref2],
      [6, eerste lid, onderdeel k][ref3], [8, derde en zesde lid][ref4], [12a][ref5], [12b][ref6], [12c][ref7] en
      [17, tweede lid, onderdeel a, en derde lid, onderdeel a][ref8], van toepassing zoals die luidden op 31 juli 2022,
      en

      b. zijn de [artikelen 15, zesde lid][ref9], [17, eerste lid, onderdeel c][ref10], en [17b1][ref11] niet van
      toepassing.

      2 Het bepaalde in het eerste lid is ook van toepassing op de student die voor 1 augustus 2023 een aanvang
      heeft gemaakt met het tweede studiejaar van zijn beroepsopleiding, die voor 1 augustus 2024 een aanvang
      heeft gemaakt met het derde studiejaar van zijn beroepsopleiding of voor 1 augustus 2025 een aanvang heeft
      gemaakt met het vierde studiejaar van zijn beroepsopleiding, en deze opleiding uiterlijk heeft voltooid in de
      periode die overeenkomt met de voor hem geldende studieduur vermeerderd met twee studiejaren als bedoeld in
      [artikel 7.2.4, zevende lid, van de wet][ref12].


