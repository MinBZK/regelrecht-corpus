  - number: 17j
    text: Het instellingsexamen vindt plaats overeenkomstig de door de examencommissie krachtens de wet vastgestelde regels.
    url: https://wetten.overheid.nl/BWBR0027963/2026-01-01#Artikel17j
  - number: 17k
    text: |-
      1 De eindwaardering van de basisvakken en de maatwerkvakken wordt uitgedrukt op een van de volgende wijzen:

      a. in een geheel cijfer uit de reeks 1 tot en met 10. Indien de uitkomst van de berekening niet een geheel getal
      is, wordt dat getal indien het eerste cijfer achter de komma een 4 of lager is, naar beneden afgerond en indien dat
      cijfer een 5 of hoger is, naar boven afgerond; of

      b. met een waardering uit een reeks:

      1° die in ieder geval de waarderingen «onvoldoende», «voldoende» en «goed» bevat; en

      2° waarin tevens uitsluitend de waarderingen «zeer slecht», «slecht», «ruim onvoldoende», «bijna voldoende», «ruim
      voldoende», «zeer goed» en «uitmuntend» kunnen worden opgenomen.

      2 In afwijking van het eerste lid wordt de eindwaardering van:

      a. de basisvakken «op weg naar Engels ERK-niveau A1» en «op weg naar mbo-rekenniveau 2» uitgedrukt in «voldaan» of
      «niet voldaan»; en

      b. de vakken «Nederlands als tweede taal ERK-niveau B1» en «Nederlands als tweede taal ERK-
      niveau B2» uitgedrukt overeenkomstig het door het College voor toetsen en examens op grond van
      [artikel 14 van het Staatsexamenbesluit Nederlands als tweede taal][ref1] vastgestelde resultaat.

      3 De eindwaardering van het examenonderdeel kennis van de Nederlandse maatschappij wordt uitgedrukt overeenkomstig
      de op grond van [artikel 3.5, vierde lid, van het Besluit inburgering 2021][ref2] vastgestelde wijze van
      beoordeling.

      4 De eindwaardering voor de examenonderdelen leervaardigheden en vaardigheden voor opleidings- en beroepskeuze
      worden uitgedrukt in «voldaan» of «niet voldaan».


      [ref1]: https://wetten.overheid.nl/BWBR0006192#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0045555#Artikel3.5
