  - number: 17m
    text: >-
      1 Het examen voor het taalschakeltraject naar de basisberoepsopleiding is met goed gevolg afgelegd, indien:


      a. voor alle basisvakken en het examenonderdeel kennis van de Nederlandse maatschappij een eindwaardering van ten
      minste het cijfer 6 of ten minste «voldoende» is behaald met uitzondering van de basisvakken «op weg naar «Engels
      ERK-niveau A1» en «op weg naar mbo-rekenniveau 2»; en


      b. voor de examenonderdelen leervaardigheden en vaardigheden voor opleidings- en beroepskeuze en voor de
      basisvakken «op weg naar Engels ERK-niveau A1» en «op weg naar mbo-rekenniveau 2» een eindwaardering «voldaan»
      is behaald.


      2 Het examen voor het taalschakeltraject naar de vakopleiding is met goed gevolg afgelegd, indien:


      a. voor alle basisvakken en het examenonderdeel kennis van de Nederlandse maatschappij een eindwaardering van ten
      minste het cijfer 6 of ten minste «voldoende» is behaald; en


      b. voor de examenonderdelen leervaardigheden en vaardigheden voor opleidings- en beroepskeuze een eindwaardering
      «voldaan» is behaald.


      3 Het examen voor het taalschakeltraject naar de middenkaderopleiding is met goed gevolg afgelegd, indien:


      a. voor alle basis- en maatwerkvakken en het examenonderdeel kennis van de Nederlandse maatschappij een
      eindwaardering van ten minste het cijfer 6 of ten minste «voldoende» is behaald; en


      b. voor de examenonderdelen leervaardigheden en vaardigheden voor opleidings- en beroepskeuze een eindwaardering
      «voldaan» is behaald.
    url: https://wetten.overheid.nl/BWBR0027963/2026-01-01#Artikel17m
  - number: 17n
    text: >-
      Het examen voor de taalschakeltrajecten naar het hoger beroepsonderwijs en wetenschappelijk onderwijs is met goed
      gevolg afgelegd, indien:


      a. voor alle basis- en maatwerkvakken en het examenonderdeel kennis van de Nederlandse maatschappij een
      eindwaardering van ten minste het cijfer 6 of ten minste «voldoende» is behaald; en


      b. voor de examenonderdelen leervaardigheden en vaardigheden voor opleidings- en beroepskeuze een eindwaardering
      «voldaan» is behaald.
    url: https://wetten.overheid.nl/BWBR0027963/2026-01-01#Artikel17n
  - number: '18'
    text: |-
      1 Het examen van een beroepsopleiding wordt voor de eerste maal ingedeeld met keuzedelen als bedoeld in
      [artikel 3, eerste lid][ref1], bij beroepsopleidingen waarmee een student is aangevangen op of na 1 augustus 2016.

      2 Centrale examinering voor de keuzedelen rekenen en Nederlandse taal, die wat eisen en niveau overeenkomen met
      de gelijknamige generieke examenonderdelen, vindt plaats bij beroepsopleidingen vanaf het studiejaar 2016–2017,
      onverminderd [artikel 4][ref2] zoals luidend op 1 augustus 2019.

      3 Centrale examinering voor het keuzedeel Engels, dat wat eisen en niveau overeenkomt met het gelijknamige generiek
      examenonderdeel, vindt plaats bij beroepsopleidingen vanaf het studiejaar 2017–2018.


      [ref1]: https://wetten.overheid.nl/BWBR0027963#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0027963#Artikel4
    url: https://wetten.overheid.nl/BWBR0027963/2026-01-01#Artikel18
