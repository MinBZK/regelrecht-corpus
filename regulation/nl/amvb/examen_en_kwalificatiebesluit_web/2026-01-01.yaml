  - number: 17c
    text: >-
      Bij ministeriële regeling kan worden bepaald dat aan een onderdeel of onderdelen van een kwalificatie of
      kwalificaties dan wel aan een keuzedeel of keuzedelen een certificaat is verbonden.
    url: https://wetten.overheid.nl/BWBR0027963/2026-01-01#Artikel17c
  - number: 17d
    text: |-
      1 Bij ministeriële regeling wordt op voorstel van de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven de
      studielast van elk keuzedeel vastgesteld. De studielast van een keuzedeel is 240, 480 of 720 klokuren.

      2 De totale studielast van de keuzedelen die deel uitmaken van een beroepsopleiding is ten minste

      a. voor de entreeopleiding en de specialistenopleiding: 240 klokuren,

      b. voor de basisberoepsopleiding: 480 klokuren,

      c. voor de vakopleiding: 720 klokuren,

      d. voor de middenkaderopleiding: 720 klokuren.

      3 Indien een of meer onderdelen als bedoeld in [artikel 6.1.2a, tweede lid, van de wet][ref1] deel uitmaken van
      de beroepsopleiding, worden 240 klokuren in mindering gebracht op de in het tweede lid, onder b, c en d, bedoelde
      minimum studielast van de keuzedelen.

      4 Voor de toepassing van [artikel 7.2.7, tweede lid, van de wet][ref2] wordt voor keuzedelen en onderdelen als
      bedoeld in [artikel 6.1.2a, tweede lid, van de wet][ref3] tezamen maximaal het in het tweede lid genoemde aantal
      klokuren uren studielast meegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6.1.2a
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.7
