    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van de Staatssecretaris van Onderwijs, Cultuur en Wetenschap, van 16 maart 2010, nr. WJZ/196829
    (4858), directie Wetgeving en Juridische Zaken, gedaan mede namens Onze Minister van Landbouw, Natuur en
    Voedselkwaliteit;


    Gelet op artikel 7.4.3a van de Wet educatie en beroepsonderwijs en artikel 3 van de Wet College voor examens;


    De Raad van State gehoord (advies van 21 april 2010, nr. W05.10.0096/I);


