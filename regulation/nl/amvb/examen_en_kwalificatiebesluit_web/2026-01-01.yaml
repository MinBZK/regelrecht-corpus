  - number: 18b
    text: |-
      1 Bij ministeriële regeling kan voor het examenonderdeel rekenen of het examenonderdeel dat een keuzedeel betreft,
      worden bepaald dat het bevoegd gezag kan beslissen dat het betreffende examenonderdeel geen deel uitmaakt van het
      examen van een beroepsopleiding.

      2 Het bevoegd gezag neemt een beslissing als bedoeld in het eerste lid uitsluitend indien dat noodzakelijk is om de
      gevolgen van de uitbraak van COVID-19 te beperken voor de studenten of het personeel.

      3 Bij ministeriële regeling worden nadere regels vastgesteld met betrekking tot de bevoegdheid, bedoeld in het
      eerste lid. Deze regels betreffen in ieder geval:

      a. het uiterste tijdstip waarop een student zijn diploma moet hebben behaald;

      b. op welk examenonderdeel de bevoegdheid van toepassing is; en

      c. de beroepsopleidingen, bedoeld in [artikel 7.2.2 van de wet][ref1], waarop de bevoegdheid van toepassing is.

      4 Na een beslissing als bedoeld in het tweede lid maakt het betreffende examenonderdeel in afwijking van
      [artikel 3][ref2] geen deel uit van het examen en is op de student de uitslagbepaling van [artikel 17][ref3] van
      toepassing met dien verstande dat het betreffende examenonderdeel niet behoeft te zijn afgelegd.

      5 Indien het gelet op de epidemiologische situatie vanwege de uitbraak van COVID-19 niet in het belang is van
      studenten om vast te houden aan de gestelde voorschriften omtrent het examen en geen onevenredige afbreuk wordt
      gedaan aan de doelstellingen voor beroepsonderwijs, bedoeld in [artikel 1.2.1, tweede lid, van de wet][ref4], kan
      bij ministeriële regeling worden bepaald dat dit artikel van overeenkomstige toepassing is op een ander generiek
      examenonderdeel dan rekenen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0027963#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0027963#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel1.2.1
