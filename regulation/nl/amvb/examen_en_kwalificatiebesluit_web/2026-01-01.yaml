  - number: 17g
    text: |-
      1 De examencommissie kan op verzoek van de deelnemer vrijstelling verlenen voor een examenonderdeel dat wordt
      geëxamineerd met een instellingsexamen of een deel daarvan, alsmede voor de examenonderdelen leervaardigheden en
      vaardigheden voor opleidings- en beroepskeuze of een deel daarvan.

      2 De examencommissie beslist met ten minste inachtneming van de eindtermen die voor het taalschakeltraject zijn
      vastgesteld op grond van [artikel 7.3.3, eerste lid, van de wet][ref1], en met ten minste inachtneming van de eisen
      voor de vaststelling van de uitslag, bedoeld in de [artikelen 17m][ref2] en [17n][ref3].

      3 Indien de examencommissie vrijstelling verleent, telt de eerder behaalde waardering mee voor de eindwaardering,
      bedoeld in [artikel 17k][ref4].

      4 De examencommissie kan op verzoek van de deelnemer een vrijstelling verlenen van het basisvak «Nederlands
      als tweede taal ERK-niveau B1» of een deel daarvan, indien de deelnemer beschikt over een van de volgende
      bewijsstukken, en daaruit blijkt dat ten minste een voldoende resultaat is behaald voor de examinering van de
      Nederlandse taal op het betreffende niveau:

      a. een certificaat ter afronding van het examenonderdeel lezen, schrijven, luisteren of spreken van het
      staatsexamen Nederlands als tweede taal ERK-niveau B1, of een diploma van het staatsexamen Nederlands als tweede
      taal op ten minste niveau B1;

      b. een cijferlijst als bedoeld in [artikel 52 van het Eindexamenbesluit VO][ref5] of een certificaat als bedoeld in
      [artikel 53 van het Eindexamenbesluit VO][ref6] of [artikel 31 van het Staatsexamenbesluit VO][ref7];

      c. een van de volgende certificaten van het Certificaat Nederlands als Vreemde Taal:

      i. Certificaat Profiel Maatschappelijk Formeel op ERK-niveau B1;

      ii. Certificaat Profiel Zakelijk Professioneel op ERK-niveau B2;

      iii. Certificaat Profiel Educatief Startbekwaam op ERK-niveau B2;

      iv. Certificaat Profiel Educatief Professioneel op ERK-niveau C1; of

      d. een buitenlands diploma of certificaat behaald bij een door de overheid van het land waar de opleiding is
      gevolgd erkende instelling, waaruit blijkt dat de deelnemer een of meerdere van de schriftelijke en mondelinge
      vaardigheden in de Nederlandse taal op ten minste het niveau B1 beheerst.

      5 De examencommissie kan op verzoek van de deelnemer een vrijstelling verlenen van het basisvak of maatwerkvak
      «Nederlands als tweede taal ERK-niveau B2» of een deel daarvan, indien de deelnemer beschikt over een van de
      volgende bewijsstukken, en daaruit blijkt dat een voldoende resultaat is behaald voor de examinering van de
      Nederlandse taal op het betreffende niveau:

      a. een certificaat ter afronding van het examenonderdeel lezen, schrijven, luisteren of spreken van het
      staatsexamen Nederlands als tweede taal ERK-niveau B2, of een diploma van het staatsexamen Nederlands als tweede
      taal op niveau B2;

      b. een cijferlijst als bedoeld in [artikel 52 van het Eindexamenbesluit VO][ref8] of een certificaat als bedoeld in
      [artikel 53 van het Eindexamenbesluit VO][ref9] of [artikel 31 van het Staatsexamenbesluit VO][ref10];

      c. een van de volgende certificaten van het Certificaat Nederlands als Vreemde Taal:

      i. Certificaat Profiel Zakelijk Professioneel op ERK-niveau B2;

      ii. Certificaat Profiel Educatief Startbekwaam op ERK-niveau B2;

      iii. Certificaat Profiel Educatief Professioneel op ERK-niveau C1; of

      d. een buitenlands diploma of certificaat behaald bij een door de overheid van het land waar de opleiding is
      gevolgd erkende instelling, waaruit blijkt dat de deelnemer een of meerdere van de schriftelijke en mondelinge
      vaardigheden in de Nederlandse taal op ten minste het niveau B2 beheerst.


