  - number: 18a
    text: |-
      1 In afwijking van [artikel 17, tweede lid][ref1], en onverminderd artikel 17, vierde lid, van dit besluit
      en [artikel 7.4.3 van de wet][ref2], geldt in het studiejaar waarin centrale examinering voor het onderdeel
      Nederlandse taal voor de eerste maal plaatsvindt dat het examen voor de basisberoepsopleiding en de vakopleiding
      met goed gevolg is afgelegd, indien:

      a. voor het onderdeel Nederlandse taal een eindwaardering van ten minste het cijfer 5 is behaald;

      b. voor alle specifieke examenonderdelen een eindwaardering van ten minste het cijfer 6 dan wel ten minste
      «voldoende» is behaald dan wel op grond van [artikel 14a][ref3] vrijstelling is verkregen; en

      c. voor het onderdeel loopbaan en burgerschap een eindwaardering «voldaan» is behaald.

      2 In afwijking van [artikel 17, derde lid][ref4], en onverminderd artikel 17, vierde lid, van dit besluit
      en [artikel 7.4.3 van de wet][ref5], geldt in het studiejaar waarin centrale examinering voor het onderdeel
      Nederlandse taal voor de eerste maal plaatsvindt dat het examen voor de middenkaderopleiding en de
      specialistenopleiding met goed gevolg is afgelegd, indien:

      a. voor het onderdeel Nederlandse taal of het onderdeel Engels een eindwaardering van ten minste het cijfer 5 en
      voor het andere genoemde onderdeel ten minste het cijfer 6 is behaald, dan wel op grond van [artikel 14a][ref6]
      vrijstelling is verkregen;

      b. voor alle specifieke examenonderdelen een eindwaardering van ten minste het cijfer 6 dan wel ten minste
      «voldoende» is behaald dan wel op grond van [artikel 14a][ref7] vrijstelling is verkregen; en

      c. voor het onderdeel loopbaan en burgerschap een eindwaardering «voldaan» is behaald.


