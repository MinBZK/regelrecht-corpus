  - number: '18'
    text: |-
      1 Centrale examinering voor het onderdeel rekenen als bedoeld in [artikel 4][ref1] vindt voor de eerste maal
      plaats:

      a. in het studiejaar 2015–2016 bij de middenkaderopleiding en de specialistenopleiding waarmee een aanvang is
      gemaakt op of na 1 augustus 2010;

      b. in het studiejaar 2016–2017 bij de basisberoepsopleiding en de vakopleiding waarmee een aanvang is gemaakt op of
      na 1 augustus 2012.

      2 Centrale examinering voor het onderdeel Nederlandse taal als bedoeld in [artikel 5][ref2] vindt voor de eerste
      maal plaats:

      a. in het studiejaar 2014–2015 bij de middenkaderopleiding en de specialistenopleiding waarmee een aanvang is
      gemaakt op of na 1 augustus 2010;

      b. in het studiejaar 2015–2016 bij de basisberoepsopleiding en de vakopleiding waarmee een aanvang is gemaakt op of
      na 1 augustus 2012.

      3 Centrale examinering voor het onderdeel Engels als bedoeld in [artikel 5][ref3] vindt voor de eerste maal plaats
      in het studiejaar 2017–2018 bij de middenkaderopleiding en de specialistenopleiding waarmee een aanvang is gemaakt
      op of na 1 augustus 2014.

      4 Indien de resultaten van eerdere pilotexamens als bedoeld in [artikel 19][ref4], dan wel onvoorziene
      omstandigheden daartoe aanleiding geven, kan bij koninklijk besluit een later studiejaar worden bepaald dat voor de
      onderdelen Nederlandse taal, rekenen en Engels verschillend kan worden vastgesteld.

      5 Voor de deelnemer die voor 1 augustus 2012 een aanvang heeft gemaakt met een basisberoepsopleiding of
      vakopleiding en deze opleiding nog niet heeft voltooid in het studiejaar waarin centrale examinering voor de eerste
      maal plaatsvindt, vindt centrale examinering voor de eerste maal plaats in het tweede studiejaar volgend op het
      studiejaar waarin de voor hem geldende studieduur is verstreken.

      6 Het examen van een beroepsopleiding wordt voor de eerste maal ingedeeld in specifieke en generieke
      examenonderdelen als bedoeld in [artikel 3][ref5], in het studiejaar 2012–2013 bij beroepsopleidingen waarmee een
      aanvang wordt gemaakt op of na 1 augustus 2012.

      7 Op het examen van de basisberoepsopleiding, vakopleiding, middenkaderopleiding en specialistenopleiding
      waarmee een aanvang is gemaakt voor 1 augustus 2012 zijn de [artikelen 3][ref6] en [17][ref7] van
      toepassing zoals deze artikelen luidden voor 1 augustus 2012 met dien verstande dat daarbij het
      bepaalde in [artikel 19, vierde lid][ref8], in acht wordt genomen en in geval van centrale examinering
      van de basisberoepsopleiding en de vakopleiding voor de deelnemers, bedoeld in het derde lid,
      [artikel 18a, eerste lid, aanhef en onderdeel a][ref9], van overeenkomstige toepassing is.

      8 De deelnemer is niet vrijgesteld van het examen in het examenonderdeel Nederlandse
      taal op grond van [artikel 3b, tweede lid][ref10], indien bij het door de deelnemer
      afgelegde examen in het vak Nederlandse taal en literatuur, het op grond van
      [artikel 2, tweede lid, aanhef en onderdeel c, van de Wet referentieniveaus Nederlandse taal en rekenen][ref11]
      vastgestelde referentieniveau voor Nederlandse taal voor havo of vwo niet in acht is genomen.

      9 Het examen van een beroepsopleiding wordt voor de eerste maal ingedeeld op de wijze als bedoeld in
      [artikel 3, eerste lid][ref12], zoals luidend op 1 augustus 2016 in het studiejaar 2016–2017 bij beroepsopleidingen
      waarmee een aanvang wordt gemaakt op of na 1 augustus 2016.

      10 Het eerste, tweede en vierde lid zijn vanaf het studiejaar 2016–2017 van overeenkomstige toepassing op de
      examinering van keuzedelen rekenen en Nederlandse taal die wat betreft eisen en niveau overeenkomen met de in die
      leden bedoelde onderdelen bij beroepsopleidingen waarmee een aanvang is gemaakt op of na 1 augustus 2016.

      11 Het derde en vierde lid zijn vanaf het studiejaar 2017–2018 van overeenkomstige toepassing op de examinering
      van het keuzedeel Engels dat wat betreft eisen en niveau overeenkomt met het in die leden bedoelde onderdeel bij
      beroepsopleidingen waarmee een aanvang is gemaakt op of na 1 augustus 2016.


