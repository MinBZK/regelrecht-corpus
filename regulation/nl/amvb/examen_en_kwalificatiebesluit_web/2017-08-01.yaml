  - number: '19'
    text: |-
      1 In één of meer studiejaren gelegen voor het studiejaar waarin krachtens [artikel 18][ref1] centrale examinering
      voor de onderdelen Nederlandse taal, rekenen of Engels voor de eerste maal plaatsvindt, kan voor de onderdelen
      Nederlandse taal, rekenen en Engels bij wijze van proef geheel of gedeeltelijk centrale examinering plaatsvinden
      door middel van een pilotexamen. Het bevoegd gezag van een instelling beslist of bij die instelling pilotexamens
      plaatsvinden.

      2 Deelname aan een pilotexamen, niet zijnde een instellingsexamen, in het laatste studiejaar voorafgaande aan het
      studiejaar waarin centrale examinering voor de eerste maal plaatsvindt, levert voor de onderdelen Nederlandse taal,
      rekenen of Engels een vrijstelling van uitsluitend het centraal examen voor het betreffende onderdeel op indien:

      a. dit overeenkomstig [artikel 7a][ref2] is afgenomen; en

      b. voor zover het pilotexamen het onderdeel Nederlandse taal betreft, voor dit pilotexamen ten minste het cijfer 6
      is behaald.

      3 Bij vrijstelling voor de onderdelen Nederlandse taal, rekenen of Engels op grond van het tweede lid, telt de
      waardering voor het pilotexamen mee bij het bepalen van de eindwaardering, bedoeld in [artikel 15][ref3].

      4 Indien een pilotexamen of uitsluitend een instellingsexamen voor de onderdelen Nederlandse taal of rekenen van
      een beroepsopleiding is afgenomen voordat centrale examinering van die onderdelen voor de deelnemer voor de eerste
      maal plaatsvindt, heeft de waardering daarvan met een cijfer lager dan 6 dan wel met «onvoldoende» geen gevolgen
      voor het behalen van het diploma.

      5 Bij ministeriële regeling kunnen nadere regels worden vastgesteld omtrent pilotexamens.


      [ref1]: https://wetten.overheid.nl/BWBR0027963#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0027963#Artikel7a
