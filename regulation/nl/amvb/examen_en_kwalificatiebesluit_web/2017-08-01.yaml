  - number: 19a
    text: |-
      Voor de deelnemer die voor 1 augustus 2016 een aanvang heeft gemaakt met zijn beroepsopleiding, zijn de generieke
      kwalificatie-eisen inzake loopbaan en burgerschap uit [bijlage 1][ref1] van toepassing zoals die bijlage luidde op
      31 juli 2016.


