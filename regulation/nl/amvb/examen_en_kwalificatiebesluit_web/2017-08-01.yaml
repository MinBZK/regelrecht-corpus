  - number: '9'
    text: |-
      De examencommissie zorgt er in ieder geval voor dat:

      a. de opgaven van het centraal examen geheim blijven tot de aanvang van de toets waarbij de opgaven aan de
      deelnemers worden voorgelegd;

      b. het nodige toezicht bij het centraal examen wordt uitgeoefend, en

      c. het door het college vastgestelde examenprotocol in acht wordt genomen.
    url: https://wetten.overheid.nl/BWBR0027963/2017-08-01#Artikel9
  - number: '10'
    text: |-
      1 De examencommissie beoordeelt het gemaakte werk van het centraal examen overeenkomstig de door het college
      vastgestelde beoordelingsnormen en de daarbij behorende scores.

      2 Bij de beoordeling van toetsen bestaande uit open vragen vindt de correctie plaats overeenkomstig de door het
      college vastgestelde regels.

      3 De examencommissie zet de scores in cijfers om overeenkomstig de daarvoor door het college vastgestelde regels.
    url: https://wetten.overheid.nl/BWBR0027963/2017-08-01#Artikel10
  - number: '11'
    text: |-
      1 Indien het centraal examen naar het oordeel van de inspectie niet volgens de geldende regels is afgenomen, kan
      zij besluiten dat het geheel of gedeeltelijk voor een of meer deelnemers opnieuw wordt afgenomen.

      2 De inspectie verzoekt het college zonodig nieuwe opgaven vast te stellen en te bepalen op welke wijze en door wie
      het examen zal worden afgenomen.
    url: https://wetten.overheid.nl/BWBR0027963/2017-08-01#Artikel11
  - number: '12'
    text: |-
      Indien door onvoorziene omstandigheden het centraal examen voor één of meer onderdelen van één of meer
      beroepsopleidingen niet op de voorgeschreven wijze kan worden afgenomen, beslist Onze Minister hoe in dat geval
      moet worden gehandeld.
    url: https://wetten.overheid.nl/BWBR0027963/2017-08-01#Artikel12
  - number: 12a
    text: |-
      De examencommissie kan in verband met onvoldoende beheersing van de Nederlandse taal de duur van de desbetreffende
      toets van het centraal examen voor het onderdeel Nederlandse taal en voor het onderdeel rekenen met ten hoogste 30
      minuten verlengen ten aanzien van een deelnemer die met inbegrip van het studiejaar waarin hij examen aflegt, ten
      hoogste zes jaren onderwijs in Nederland heeft gevolgd en voor wie het Nederlands niet de moedertaal is.
    url: https://wetten.overheid.nl/BWBR0027963/2017-08-01#Artikel12a
  - number: 12b
    text: |-
      1 De examencommissie informeert een deelnemer tijdig voor de eerste gelegenheid over de mogelijkheid van het
      afleggen van het centraal examen ER voor het onderdeel rekenen, alsmede over de mogelijke gevolgen van het afleggen
      van een rekenexamen voor doorstroom naar het vervolgonderwijs of voor de arbeidsmarkt.

      2 Indien de examencommissie daarin toestemt, kan de deelnemer in plaats van het centraal examen voor het onderdeel
      rekenen van de beroepsopleiding waarin hij examen doet, het centraal examen ER voor het onderdeel rekenen van die
      beroepsopleiding afleggen.
    url: https://wetten.overheid.nl/BWBR0027963/2017-08-01#Artikel12b
  - number: 12c
    text: |-
      1 Op verzoek van een deelnemer verleent de examencommissie toestemming voor het afleggen van het centraal examen
      ER voor het onderdeel rekenen indien de deelnemer aantoonbaar ernstige problemen heeft met de beheersing van de
      vereiste rekenvaardigheden.

      2 Er is in ieder geval sprake van aantoonbare ernstige rekenproblemen indien de deelnemer:

      a. zich heeft ingespannen de vereiste rekenvaardigheden te leren;

      b. daarbij gebruik heeft gemaakt van de door de instelling geboden extra ondersteuning, en

      c. hij desondanks aanhoudend onvoldoende resultaten laat zien.
    url: https://wetten.overheid.nl/BWBR0027963/2017-08-01#Artikel12c
  - number: '13'
    text: |-
      Het instellingsexamen vindt plaats overeenkomstig de door de examencommissie krachtens de [wet][ref1] vastgestelde
      regels.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0027963/2017-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: '14'
    text: |-
      Bij gedeeltelijk centrale examinering van een examenonderdeel worden de waarderingen voor zowel het
      instellingsexamen als het centraal examen uitgedrukt in cijfers uit de reeks 1 tot en met 10 met één decimaal.
    url: https://wetten.overheid.nl/BWBR0027963/2017-08-01#Artikel14
  - number: 14a
    text: |-
      1 De deelnemer kan een verzoek tot vrijstelling van een instellingsexamen indienen bij de examencommissie. De
      examencommissie beslist hierop met inachtneming van de kwalificatie-eisen of de eisen van het keuzedeel van de
      beroepsopleiding waarin examen wordt gedaan, welke eisen zijn opgenomen in de ministeriële regeling die wordt
      vastgesteld op grond van [artikel 7.2.4, tweede lid, onder a tot en met c][ref1], onderscheidenlijk artikel 7.2.4,
      tweede lid, onder d, van de wet.

      2 Het eerste lid is niet van toepassing op het examenonderdeel Nederlandse taal en het examenonderdeel Engels.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.4
    url: https://wetten.overheid.nl/BWBR0027963/2017-08-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 7.2.4
  - number: '15'
    text: |-
      1 De eindwaardering voor een generiek examenonderdeel en het examen in een keuzedeel dat wat betreft eisen en
      niveau overeenkomt met een onderdeel rekenen, een onderdeel Nederlandse taal of het onderdeel Engels van een
      middenkaderopleiding of een specialistenopleiding wordt uitgedrukt in een geheel cijfer uit de reeks 1 tot en met
      10. Indien de uitkomst van de berekening niet een geheel getal is, wordt dat getal indien het eerste cijfer achter
      de komma een 4 of lager is, naar beneden afgerond en indien dat cijfer een 5 of hoger is, naar boven afgerond.

      2 De eindwaardering voor andere examenonderdelen wordt uitgedrukt op de wijze, genoemd in het eerste lid, of met
      een waardering uit een reeks:

      a. die in ieder geval de waarderingen «onvoldoende», «voldoende» en «goed» bevat; en

      b. waarin tevens uitsluitend de waarderingen «zeer slecht», «slecht», «ruim onvoldoende», «bijna voldoende», «ruim
      voldoende», «zeer goed» en «uitmuntend» kunnen worden opgenomen.

      3 Indien een examenonderdeel uitsluitend bestaat uit een centraal examen dan wel een instellingsexamen, is de
      waardering voor dat onderdeel tevens de eindwaardering voor dat onderdeel.

      4 Indien een examenonderdeel bestaat uit zowel een centraal examen als een instellingsexamen, bepaalt de
      examencommissie de eindwaardering voor dat onderdeel op het rekenkundig gemiddelde van het cijfer voor het
      instellingsexamen en het cijfer voor het centraal examen.

      5 In afwijking van het eerste lid wordt de eindwaardering voor het onderdeel loopbaan en burgerschap uitgedrukt in
      «niet voldaan» of «voldaan».
    url: https://wetten.overheid.nl/BWBR0027963/2017-08-01#Artikel15
  - number: 15a
    text: |-
      De deelnemer kan bij de examencommissie een verzoek indienen tot het meenemen van het examenresultaat van een
      keuzedeel waarin hij in het kader van een eerder door hem gevolgde beroepsopleiding examen heeft afgelegd, maar dat
      niet met goed gevolg door hem is afgesloten.
    url: https://wetten.overheid.nl/BWBR0027963/2017-08-01#Artikel15a
  - number: '16'
    text: |-
      De examencommissie stelt de uitslag van het examen vast met inachtneming van [artikel 17][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027963#Artikel17
    url: https://wetten.overheid.nl/BWBR0027963/2017-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0027963
        artikel: '17'
        hoofdstuk: II
        paragraaf: '4'
  - number: '17'
    text: |-
      1 Onverminderd [artikel 7.4.6, tweede lid, van de wet][ref1] is het examen voor de entreeopleiding met goed gevolg
      afgelegd, indien:

      a. voor alle specifieke examenonderdelen een eindwaardering van ten minste het cijfer 6 of ten minste «voldoende»
      is behaald, dan wel op grond van [artikel 14a][ref2] vrijstelling is verkregen;

      b. voor het onderdeel loopbaan en burgerschap een eindwaardering «voldaan» is behaald; en

      c. examen is afgelegd in het keuzedeel dat deel uitmaakt van de desbetreffende opleiding.

      2 Onverminderd [artikel 7.4.6, tweede lid, van de wet][ref3] is het examen voor de basisberoepsopleiding en de
      vakopleiding met goed gevolg afgelegd, indien:

      a. voor één van de generieke examenonderdelen Nederlandse taal en rekenen een eindwaardering van ten minste het
      cijfer 5 en voor het andere genoemde onderdeel ten minste het cijfer 6 is behaald;

      b. voor alle specifieke examenonderdelen een eindwaardering van ten minste het cijfer 6 of ten minste «voldoende»
      is behaald, dan wel op grond van [artikel 14a][ref4] vrijstelling is verkregen;

      c. voor het onderdeel loopbaan en burgerschap een eindwaardering «voldaan» is behaald; en

      d. examen is afgelegd in het keuzedeel dat of de keuzedelen die deel uitmaken van de desbetreffende opleiding.

      3 Onverminderd [artikel 7.4.6, tweede lid, van de wet][ref5] is het examen voor de middenkaderopleiding en de
      specialistenopleiding met goed gevolg afgelegd, indien:

      a. voor één van de generieke examenonderdelen Engels, Nederlandse taal en rekenen een eindwaardering van ten minste
      het cijfer 5 en voor de andere twee genoemde onderdelen ten minste het cijfer 6 is behaald;

      b. voor alle specifieke examenonderdelen een eindwaardering van ten minste het cijfer 6 of ten minste «voldoende»
      is behaald, dan wel op grond van [artikel 14a][ref6] vrijstelling is verkregen;

      c. voor het onderdeel loopbaan en burgerschap een eindwaardering «voldaan» is behaald; en

      d. examen is afgelegd in het keuzedeel dat of de keuzedelen die deel uitmaken van de desbetreffende opleiding.

      4 Het eerste tot en met derde lid zijn van toepassing met inachtneming van het bepaalde in
      [artikel 19, vierde lid][ref7].


