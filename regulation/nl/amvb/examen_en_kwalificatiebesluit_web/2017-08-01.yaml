  - number: '2'
    text: |-
      Dit hoofdstuk is van toepassing op examens van een beroepsopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.2
    url: https://wetten.overheid.nl/BWBR0027963/2017-08-01#Artikel2
