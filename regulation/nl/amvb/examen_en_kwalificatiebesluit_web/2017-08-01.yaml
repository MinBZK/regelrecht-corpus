        artikel: 7.2.2
  - number: 18c
    text: |-
      1 In afwijking van [artikel 17, tweede lid, onderdeel a][ref1], dient voor het generieke examenonderdeel
      Nederlandse taal een eindwaardering van ten minste het cijfer 5 te zijn behaald, en het generieke examenonderdeel
      rekenen te zijn afgelegd in:

      a. de basisberoepsopleiding,

      b. de vakopleiding.

      2 In afwijking van [artikel 17, derde lid, onderdeel a][ref2], dient in de middenkaderopleiding en in de
      specialistenopleiding voor één van de generieke examenonderdelen Engels en Nederlandse taal een eindwaardering
      van ten minste het cijfer 5 en voor het andere genoemde generieke examenonderdeel ten minste het cijfer 6 te zijn
      behaald, en het generieke examenonderdeel rekenen te zijn afgelegd.

      3 Dit artikel vervalt op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende onderdelen
      daarvan verschillend kan worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0027963#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0027963#Artikel17
