        paragraaf: '4'
  - number: 3b
    text: |-
      1 De deelnemer is vrijgesteld van het examenonderdeel Nederlandse taal, rekenen of Engels indien de examencommissie
      heeft vastgesteld dat:

      a. hij het betreffende examenonderdeel heeft afgelegd zoals is vastgesteld voor een beroepsopleiding van eenzelfde
      dan wel een hoger niveau als bedoeld in [artikel 7.2.2, derde lid, van de wet][ref1], als examenonderdeel van een
      andere beroepsopleiding of een beroepsopleiding bij een andere instelling;

      b. hij een eindwaardering voor het betreffende examenonderdeel van ten minste het cijfer 6 heeft behaald; en

      c. er na het studiejaar waarin het diploma is verkregen dan wel de deelnemer is uitgeschreven voor de opleiding
      zonder het verkrijgen van een diploma nog geen twee studiejaren zijn verstreken.

      2 De deelnemer is vrijgesteld van het examenonderdeel Nederlandse taal, rekenen of Engels indien de examencommissie
      heeft vastgesteld dat:

      a. hij op grond van [artikel 29][ref2], [30][ref3] of [60 van de Wet op het voortgezet onderwijs][ref4] het eind-
      of staatsexamen in het vak Nederlandse taal en literatuur of in het vak Engelse taal en literatuur voor havo of vwo
      respectievelijk de rekentoets voor havo of vwo heeft afgelegd;

      b. hij voor dit eind- of staatsexamen in het vak Nederlandse taal en literatuur respectievelijk deze rekentoets
      ten minste een eindcijfer 6 heeft behaald respectievelijk voor dit eind- of staatsexamen in het vak Engelse taal en
      literatuur voor havo of vwo ten minste het eindcijfer 5 heeft behaald; en

      c. er na het studiejaar waarin het diploma is verkregen dan wel de deelnemer is uitgeschreven voor de opleiding
      zonder het verkrijgen van een diploma nog geen twee studiejaren zijn verstreken.

      3 Indien de examencommissie vrijstelling verleent voor het examenonderdeel Nederlandse taal, rekenen of Engels,
      telt de eindwaardering van het eerder afgelegde examenonderdeel of het eindcijfer van de eerder afgelegde
      rekentoets respectievelijk het eind- of staatsexamen in het vak Nederlandse taal en literatuur of in het vak
      Engelse taal en literatuur mee bij het bepalen van de uitslag.

      4 Het eerste lid is van overeenkomstige toepassing op het centraal examen van het onderdeel Nederlandse taal en het
      centraal examen van het onderdeel Engels.

      5 Op een verzoek van de deelnemer bij de examencommissie tot vrijstelling van het instellingsexamen van
      het examenonderdeel Nederlandse taal of van het instellingsexamen van het examenonderdeel Engels beslist de
      examencommissie met inachtneming van de vereisten, genoemd in het eerste lid.

      6 Indien de examencommissie vrijstelling heeft verleend op grond van het vierde of vijfde lid, telt het cijfer voor
      het eerder afgelegde centraal examen respectievelijk instellingsexamen van het examenonderdeel Nederlandse taal of
      van het examenonderdeel Engels mee bij het bepalen van de eindwaardering, bedoeld in [artikel 15][ref5].


