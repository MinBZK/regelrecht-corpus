  - number: 17a
    text: |-
      1 Voor elke kwalificatie worden in het kwalificatiedossier generieke kwalificatie-eisen voor
      Nederlandse taal opgenomen overeenkomstig het desbetreffende referentieniveau, bedoeld in
      [artikel 2, onderdelen h tot en met l, van het Besluit referentieniveaus Nederlandse taal en rekenen][ref1].

      2 Voor elke kwalificatie worden in het kwalificatiedossier generieke kwalificatie-
      eisen voor rekenen opgenomen overeenkomstig het desbetreffende referentieniveau, bedoeld in
      [artikel 3, onderdelen h tot en met l, van het Besluit referentieniveaus Nederlandse taal en rekenen][ref2].

      3 Voor elke kwalificatie worden in het kwalificatiedossier generieke kwalificatie-eisen voor loopbaan en
      burgerschap opgenomen overeenkomstig [bijlage 1][ref3] bij dit besluit.

      4 Voor elke kwalificatie voor het vierde niveau bedoeld in [artikel 7.2.2, derde lid, van de wet][ref4] worden
      in het kwalificatiedossier generieke kwalificatie-eisen voor Engels opgenomen overeenkomstig de volgende
      referentieniveaus zoals opgenomen in [bijlage 2][ref5] bij dit besluit:

      a. lezen en luisteren: B1,

      b. schrijven, spreken en gesprekken voeren: A2.


      [ref1]: https://wetten.overheid.nl/BWBR0027879#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027879#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0027963
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.2
      [ref5]: https://wetten.overheid.nl/BWBR0027963
    url: https://wetten.overheid.nl/BWBR0027963/2017-08-01#Artikel17a
