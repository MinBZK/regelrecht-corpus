  - number: '7'
    text: Onze Minister zorgt ervoor dat de instellingen tijdig beschikken over de opgaven.
    url: https://wetten.overheid.nl/BWBR0027963/2017-08-01#Artikel7
  - number: 7a
    text: |-
      1 Het centraal examen wordt afgenomen nadat ten minste de helft van de voor de deelnemer geldende studieduur is
      verstreken.

      2 Indien de voor de deelnemer geldende studieduur minder dan 24 maanden bedraagt, wordt in afwijking van het eerste
      lid het centraal examen afgenomen vanaf het moment waarop de resterende periode van de voor de deelnemer geldende
      studieduur minder dan 12 maanden bedraagt.
    url: https://wetten.overheid.nl/BWBR0027963/2017-08-01#Artikel7a
  - number: '8'
    text: |-
      1 Indien de deelnemer voor een centraal examen een waardering lager dan het cijfer 6 heeft behaald, heeft hij
      recht op ten minste één herkansing voor dit centraal examen of indien hij ingevolge [artikel 3a, eerste lid][ref1],
      zijn examen op een hoger niveau heeft afgelegd, heeft hij recht op herkansing op het niveau van de desbetreffende
      beroepsopleiding.

      2 Indien de deelnemer voor een centraal examen een waardering van ten minste het cijfer 6 heeft behaald, heeft
      hij recht op één herkansing voor dit centraal examen, tenzij hij eerder gebruik heeft gemaakt van het recht op
      herkansing, bedoeld in het eerste lid. De deelnemer kan daarbij op zijn verzoek het desbetreffende examenonderdeel
      op een hoger niveau afleggen dan vastgesteld voor zijn beroepsopleiding.

      3 Indien een centraal examen ER voor het onderdeel rekenen is afgelegd en de deelnemer daarvoor een eindwaardering
      van tenminste het cijfer 6 heeft behaald, kan hij de mogelijkheid tot herkansing, bedoeld in het tweede lid, ook
      gebruiken om het centraal examen voor het onderdeel rekenen af te leggen.

      4 De deelnemer wordt binnen de voor hem geldende studieduur voor de eerste maal in de gelegenheid gesteld de
      herkansing af te leggen, tenzij hij geen gebruik heeft gemaakt van de voor hem vastgestelde eerste gelegenheid tot
      het afleggen van het centraal examen.

      5 Nadat de deelnemer gebruik heeft gemaakt van een herkansingsmogelijkheid voor een centraal examen wordt het
      hoogste door de deelnemer behaalde cijfer voor dit centraal examen gebruikt bij het bepalen van de eindwaardering,
      bedoeld in [artikel 15][ref2].

      6 Indien zowel het centraal examen als het centraal examen ER voor het onderdeel rekenen is afgelegd of
      een generiek examenonderdeel mede op een hoger niveau is afgelegd, en voor elk examenonderdeel ten minste
      het cijfer 6 is behaald, bepaalt de examencommissie in afwijking van het vijfde lid in overleg met de
      deelnemer welk cijfer wordt gebruikt voor het bepalen van de eindwaardering, bedoeld in [artikel 15][ref3].
      [Artikel 3a, tweede lid][ref4], is niet van toepassing.

      7 Herkansing in een centraal examen vindt plaats in een volgend tijdvak.


