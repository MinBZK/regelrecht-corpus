  - number: 18b
    text: |-
      De bepalingen in dit besluit die van toepassing zijn op de entreeopleiding zijn tevens van toepassing op de
      assistentopleiding, bedoeld in [artikel 7.2.2, eerste lid, onderdeel a, van de wet][ref1] zoals dat onderdeel
      luidde op 31 juli 2014.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.2
    url: https://wetten.overheid.nl/BWBR0027963/2017-08-01#Artikel18b
    references:
