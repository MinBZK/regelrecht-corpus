    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Onderwijs, Cultuur en Wetenschap, van 16 maart 2010, nr. WJZ/196829
    (4858), directie Wetgeving en Juridische Zaken, gedaan mede namens Onze Minister van Landbouw, Natuur en
    Voedselkwaliteit;

    Gelet op artikel 7.4.3a van de Wet educatie en beroepsonderwijs en artikel 3 van de Wet College voor examens;

    De Raad van State gehoord (advies van 21 april 2010, nr. W05.10.0096/I);

    Gezien het nader rapport van de Staatssecretaris van Onderwijs, Cultuur en Wetenschap, van 28 juni 2010,
    nr. WJZ/218936(4858), directie Wetgeving en Juridische Zaken, uitgebracht mede namens Onze Minister van Landbouw,
    Natuur en Voedselkwaliteit;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *entreeopleiding:* entreeopleiding,
      genoemd in [artikel 7.2.2, eerste lid, onderdeel a, van de wet][ref1];
        - *basisberoepsopleiding:* basisberoepsopleiding, genoemd in
      [artikel 7.2.2, eerste lid, onderdeel b, van de wet][ref2];
        - *centraal examen ER voor het onderdeel rekenen:* centraal examen voor het onderdeel rekenen waarbij de opgaven
      zijn aangepast ten behoeve van studenten met ernstige rekenproblemen;
        - *college*: College voor toetsen en examens als bedoeld in
      [artikel 2, eerste lid, van de Wet College voor toetsen en examens][ref3];
        - *examencommissie:* examencommissie als bedoeld in [artikel 7.4.5 van de wet][ref4];
        - *examenonderdeel:* onderdeel van het examen van een beroepsopleiding;
        - *generieke examenonderdelen:* examenonderdelen die de examinering betreffen van de generieke kwalificatie-eisen;
        - *generieke kwalificatie-eisen:* eisen die deel uitmaken van alle kwalificaties op eenzelfde niveau, bedoeld in
      [artikel 7.2.2, derde lid, van de wet][ref5], of van alle kwalificaties;
        - *instellingsexamen:* examen of examenonderdeel bestaande uit toetsen die zijn vastgesteld en worden afgenomen
      door of in opdracht van de instelling;
        - *keuzedeel Engels:* keuzedeel waarvan de eisen en het niveau overeenkomen met de eisen en het niveau van het
      onderdeel Engels van een kwalificatie;
        - *keuzedeel Nederlandse taal:* keuzedeel waarvan de eisen en het niveau overeenkomen met de eisen en het niveau
      van het onderdeel Nederlandse taal van een kwalificatie;
        - *keuzedeel rekenen:* keuzedeel waarvan de eisen en het niveau overeenkomen met de eisen en het niveau van het
      onderdeel rekenen van een kwalificatie;
        - *middenkaderopleiding:* middenkaderopleiding, genoemd in
      [artikel 7.2.2, eerste lid, onderdeel d, van de wet][ref6];
        - *onderdeel Engels:* onderdeel Engels van een kwalificatie waarvoor op grond van [artikel 17a, vierde lid][ref7],
      van dit besluit generieke kwalificatie-eisen zijn vastgesteld;
        - *onderdeel loopbaan en burgerschap:* onderdeel loopbaan en burgerschap van een kwalificatie waarvoor op grond van
      [artikel 17a, derde lid][ref8], van dit besluit generieke kwalificatie-eisen zijn vastgesteld;
        - *onderdeel Nederlandse taal:* onderdeel Nederlandse taal van een kwalificatie
      dat is vastgesteld overeenkomstig het referentieniveau Nederlandse taal, bedoeld in
      [artikel 2, tweede lid, aanhef en onderdeel d, van de Wet referentieniveaus Nederlandse taal en rekenen][ref9];
        - *onderdeel rekenen:* onderdeel rekenen van een kwalificatie dat is
      vastgesteld overeenkomstig het referentieniveau rekenen, bedoeld in
      [artikel 2, tweede lid, aanhef en onderdeel d, van de Wet referentieniveaus Nederlandse taal en rekenen][ref10];
        - *pilotexamen:* centraal examen dat bij wijze van proef wordt afgenomen in een periode voorafgaand aan de
      invoering van centrale examinering voor het betreffende examenonderdeel overeenkomstig daarvoor bij of krachtens
      [artikel 19][ref11] gestelde eisen;
        - *specialistenopleiding:* specialistenopleiding, genoemd in
      [artikel 7.2.2, eerste lid, onderdeel e, van de wet][ref12];
        - *specifieke examenonderdelen:* examenonderdelen die de examinering betreffen van de specifieke kwalificatie-eisen
      die als kerntaken zijn opgenomen in het kwalificatiedossier van de beroepsopleiding waarin examen wordt gedaan;
        - *specifieke kwalificatie-eisen:* eisen die deel uitmaken van een bepaalde kwalificatie;
        - *student:* student en in voorkomende gevallen extraneus als bedoeld in
      [artikel 8.1.1, eerste lid, van de wet][ref13];
        - *vakopleiding:* vakopleiding, genoemd in [artikel 7.2.2, eerste lid, onderdeel c, van de wet][ref14];
        - *wet:* [Wet educatie en beroepsonderwijs][ref15].


