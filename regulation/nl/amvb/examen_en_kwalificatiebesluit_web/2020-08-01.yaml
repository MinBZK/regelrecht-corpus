  - number: '2'
    text: |-
      Dit hoofdstuk is van toepassing op examens van een beroepsopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '3.1'
    text: |-
      Het examen bestaat voor iedere beroepsopleiding uit generieke examenonderdelen, specifieke examenonderdelen en
      examenonderdelen die een keuzedeel betreffen.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel3
  - number: '3.2'
    text: 'De generieke examenonderdelen betreffen de onderdelen:'
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel3
  - number: 3.2.a
    text: Nederlandse taal;
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel3
  - number: 3.2.b
    text: rekenen;
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel3
  - number: 3.2.c
    text: loopbaan en burgerschap; en
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel3
  - number: 3.2.d
    text: 'voor zover het betreft de middenkaderopleiding en de specialistenopleiding: Engels.'
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel3
  - number: '3.3'
    text: |-
      Het examen bestaat voor ieder onderdeel van een beroepsopleiding uit een instellingsexamen of een centraal examen
      dan wel beide.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel3
  - number: '3.4'
    text: |-
      Het derde lid is niet van toepassing op het onderdeel loopbaan en burgerschap. Het bevoegd gezag stelt de eisen
      waaraan de student voor dit onderdeel moet voldoen vast met inachtneming van het kwalificatiedossier.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel3
  - number: '3.5'
    text: |-
      Indien voor een onderdeel van een beroepsopleiding gedeeltelijk centrale examinering plaatsvindt, wordt bij
      ministeriële regeling bepaald over welk gedeelte het instellingsexamen voor dat onderdeel zich uitstrekt.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel3
  - number: 3a.1
    text: |-
      Na toestemming van de examencommissie kan een student een generiek examenonderdeel afleggen op een hoger niveau dan
      vastgesteld voor zijn beroepsopleiding.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel3a
  - number: 3a.2
    text: |-
      Indien de student een generiek examenonderdeel op een hoger niveau heeft afgelegd, wordt het hierbij behaalde
      cijfer gebruikt voor de eindwaardering, bedoeld in [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027963#Artikel15
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0027963
        artikel: '15'
        hoofdstuk: II
        paragraaf: '4'
  - number: 3a.3
    text: |-
      Indien een student zijn generiek examenonderdeel Engels of Nederlandse taal op een hoger niveau aflegt, wordt het
      instellingsexamen op één niveau afgelegd.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel3a
  - number: 3a.4
    text: |-
      Het niveau waarop het instellingsexamen Nederlandse taal wordt afgelegd, is hetzelfde niveau als waarop het
      centraal examen wordt afgelegd.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel3a
  - number: 3b.1
    text: |-
      De examencommissie kan vrijstelling verlenen van het afleggen van een examenonderdeel of een deel daarvan, op
      verzoek van de student.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel3b
  - number: 3b.2
    text: |-
      De examencommissie beslist met ten minste inachtneming van de wettelijk vastgestelde eisen voor de kwalificatie,
      voor het keuzedeel, en voor de vaststelling van de uitslag, bedoeld in [artikel 17][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027963#Artikel17
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0027963
        artikel: '17'
        hoofdstuk: II
        paragraaf: '4'
  - number: 3b.3
    text: |-
      Indien de examencommissie vrijstelling verleent, telt de eerder behaalde waardering mee voor de eindwaardering,
      bedoeld in [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027963#Artikel15
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0027963
        artikel: '15'
        hoofdstuk: II
        paragraaf: '4'
  - number: 3b.4
    text: |-
      De examencommissie beslist of de vrijstelling betrekking heeft op het gehele examenonderdeel, dan wel in voorkomend
      geval op het centraal examen, het instellingsexamen dan wel een deel van het instellingsexamen.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel3b
  - number: 3b.5
    text: |-
      De examencommissie verleent slechts vrijstelling van het examenonderdeel Nederlandse taal, rekenen of Engels of een
      deel daarvan, indien zij vaststelt dat de student reeds eerder examen heeft afgelegd op ten minste hetzelfde niveau
      als vastgesteld voor zijn beroepsopleiding:
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel3b
  - number: 3b.5.a
    text: als examenonderdeel van een andere beroepsopleiding, of van dezelfde beroepsopleiding bij een andere instelling; of
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel3b
  - number: 3b.5.b
    text: als eind- of staatsexamen of deeleindexamen zoals vastgesteld voor havo of vwo.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel3b
  - number: '4'
    text: |-
      Geheel centrale examinering kan plaatsvinden voor het onderdeel rekenen van de basisberoepsopleiding, de
      vakopleiding, de middenkaderopleiding en de specialistenopleiding en voor de daarmee wat betreft eisen en niveau
      overeenkomende keuzedelen.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel4
  - number: '5'
    text: |-
      Gedeeltelijk centrale examinering vindt plaats voor het onderdeel Nederlandse taal van de basisberoepsopleiding,
      de vakopleiding, de middenkaderopleiding en de specialistenopleiding, en voor het onderdeel Engels van de
      middenkaderopleiding en de specialistenopleiding en voor de daarmee wat betreft eisen en niveau overeenkomende
      keuzedelen.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel5
  - number: '6.1'
    text: 'Het college is belast met de volgende taken op het gebied van de centrale examinering:'
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel6
  - number: 6.1.a
    text: |-
      het tot stand brengen en bij regeling vaststellen van syllabi overeenkomstig de voor de desbetreffende soort
      opleiding vastgestelde eindtermen of kwalificatiedossiers;
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel6
  - number: 6.1.b
    text: |-
      het vaststellen van het aantal toetsen, de tijdsduur en de aard van de toetsen, overeenkomstig de voor de
      desbetreffende soort opleiding vastgestelde eindtermen of kwalificatiedossiers;
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel6
  - number: 6.1.c
    text: het vaststellen van de wijze waarop en de vorm waarin de toetsen worden afgenomen;
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel6
  - number: 6.1.d
    text: het tijdig tot stand brengen en tijdig vaststellen van de opgaven;
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel6
  - number: 6.1.e
    text: het geven van regels voor digitale examinering;
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel6
  - number: 6.1.f
    text: het tot stand brengen en bij regeling vaststellen van de beoordelingsnormen en de daarbij behorende scores;
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel6
  - number: 6.1.g
    text: het geven van regels voor de omzetting van de scores in cijfers;
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel6
  - number: 6.1.h
    text: het geven van regels met betrekking tot de hulpmiddelen die gebruikt mogen worden bij het maken van opgaven;
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel6
  - number: 6.1.i
    text: |-
      het geven van regels voor een aangepaste wijze of vorm van examineren bij studenten met een handicap rekening
      houdend met de aard van de handicap;
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel6
  - number: 6.1.j
    text: |-
      het bij regeling vaststellen van een examenprotocol waarin de gang van zaken bij centrale examinering is
      vastgelegd, waaronder begrepen te nemen maatregelen bij onregelmatigheden begaan door studenten, het bewaren van
      het gemaakte examenwerk en de wijze waarop belanghebbenden kunnen kennisnemen van de beoordeling daarvan;
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel6
  - number: 6.1.k
    text: |-
      het tot stand brengen van een centraal examen ER voor het onderdeel rekenen. Het college neemt daarbij in
      aanmerking het referentieniveau rekenen dat voor de desbetreffende soort beroepsopleiding is vastgesteld ingevolge
      [artikel 3, onderdelen h tot en met l, van het Besluit referentieniveaus Nederlandse taal en rekenen][ref1], maar
      past de opgaven zodanig aan dat de opgaven beter geschikt zijn voor studenten met ernstige rekenproblemen.


      [ref1]: https://wetten.overheid.nl/BWBR0027879#Artikel3
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0027879
        artikel: '3'
  - number: '6.2'
    text: Voor zover toetsen bestaan uit open vragen geeft het college tevens regels voor de uitvoering van de correctie.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel6
  - number: '6.3'
    text: |-
      Het college stelt de tijdvakken vast waarin centrale examinering kan plaatsvinden. De vaststelling geschiedt voor
      aanvang van elk studiejaar na instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel6
  - number: '6.4'
    text: |-
      De regelingen, bedoeld in het eerste lid, onderdelen a, g, i en j, alsmede het tweede lid, treden slechts in
      werking na goedkeuring door Onze Minister. Onze Minister kan zijn goedkeuring onthouden wegens strijd met het recht
      of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel6
  - number: '7'
    text: Onze Minister zorgt ervoor dat de instellingen tijdig beschikken over de opgaven.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel7
  - number: '8.1'
    text: |-
      Indien de student voor een centraal examen een waardering lager dan het cijfer 6 heeft behaald, heeft hij recht
      op ten minste één herkansing voor dit centraal examen of indien hij ingevolge [artikel 3a, eerste lid][ref1],
      zijn examen op een hoger niveau heeft afgelegd, heeft hij recht op herkansing op het niveau van de desbetreffende
      beroepsopleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0027963#Artikel3a
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0027963
        artikel: 3a
        hoofdstuk: II
        paragraaf: '1'
  - number: '8.2'
    text: |-
      Indien de student voor een centraal examen een waardering van ten minste het cijfer 6 heeft behaald, heeft
      hij recht op één herkansing voor dit centraal examen, tenzij hij eerder gebruik heeft gemaakt van het recht op
      herkansing, bedoeld in het eerste lid. De student kan daarbij op zijn verzoek het desbetreffende examenonderdeel op
      een hoger niveau afleggen dan vastgesteld voor zijn beroepsopleiding.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel8
  - number: '8.3'
    text: |-
      Indien een centraal examen ER voor het onderdeel rekenen is afgelegd en de student daarvoor een eindwaardering
      van tenminste het cijfer 6 heeft behaald, kan hij de mogelijkheid tot herkansing, bedoeld in het tweede lid, ook
      gebruiken om het centraal examen voor het onderdeel rekenen af te leggen.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel8
  - number: '8.4'
    text: |-
      De student wordt binnen de voor hem geldende studieduur voor de eerste maal in de gelegenheid gesteld de herkansing
      af te leggen, tenzij hij geen gebruik heeft gemaakt van de voor hem vastgestelde eerste gelegenheid tot het
      afleggen van het centraal examen.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel8
  - number: '8.5'
    text: |-
      Nadat de student gebruik heeft gemaakt van een herkansingsmogelijkheid voor een centraal examen wordt het hoogste
      door de student behaalde cijfer voor dit centraal examen gebruikt bij het bepalen van de eindwaardering, bedoeld
      in [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027963#Artikel15
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0027963
        artikel: '15'
        hoofdstuk: II
        paragraaf: '4'
  - number: '8.6'
    text: |-
      Indien zowel het centraal examen als het centraal examen ER voor het onderdeel rekenen is afgelegd of een generiek
      examenonderdeel mede op een hoger niveau is afgelegd, en voor elk examenonderdeel ten minste het cijfer 6 is
      behaald, bepaalt de examencommissie in afwijking van het vijfde lid in overleg met de student welk cijfer wordt
      gebruikt voor het bepalen van de eindwaardering, bedoeld in [artikel 15][ref1]. [Artikel 3a, tweede lid][ref2], is
      niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0027963#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0027963#Artikel3a
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0027963
        artikel: '15'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0027963
        artikel: 3a
        hoofdstuk: II
        paragraaf: '1'
  - number: '8.7'
    text: |-
      De student heeft per tijdvak ten hoogste twee gelegenheden per referentieniveau tot het afleggen van een centraal
      examen of een herkansing daarvan.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel8
  - number: '9'
    text: 'De examencommissie zorgt er in ieder geval voor dat:'
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel9
  - number: 9.a
    text: |-
      de opgaven van het centraal examen geheim blijven tot de aanvang van de toets waarbij de opgaven aan de studenten
      worden voorgelegd;
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel9
  - number: 9.b
    text: het nodige toezicht bij het centraal examen wordt uitgeoefend, en
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel9
  - number: 9.c
    text: het door het college vastgestelde examenprotocol in acht wordt genomen.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel9
  - number: '10.1'
    text: |-
      De examencommissie beoordeelt het gemaakte werk van het centraal examen overeenkomstig de door het college
      vastgestelde beoordelingsnormen en de daarbij behorende scores.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel10
  - number: '10.2'
    text: |-
      Bij de beoordeling van toetsen bestaande uit open vragen vindt de correctie plaats overeenkomstig de door het
      college vastgestelde regels.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel10
  - number: '10.3'
    text: De examencommissie zet de scores in cijfers om overeenkomstig de daarvoor door het college vastgestelde regels.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel10
  - number: '11.1'
    text: |-
      Indien het centraal examen naar het oordeel van de inspectie niet volgens de geldende regels is afgenomen, kan zij
      besluiten dat het geheel of gedeeltelijk voor een of meer studenten opnieuw wordt afgenomen.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel11
  - number: '11.2'
    text: |-
      De inspectie verzoekt het college zonodig nieuwe opgaven vast te stellen en te bepalen op welke wijze en door wie
      het examen zal worden afgenomen.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel11
  - number: '12'
    text: |-
      Indien door onvoorziene omstandigheden het centraal examen voor één of meer onderdelen van één of meer
      beroepsopleidingen niet op de voorgeschreven wijze kan worden afgenomen, beslist Onze Minister hoe in dat geval
      moet worden gehandeld.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel12
  - number: 12a
    text: |-
      De examencommissie kan in verband met onvoldoende beheersing van de Nederlandse taal de duur van de desbetreffende
      toets van het centraal examen voor het onderdeel Nederlandse taal en voor het onderdeel rekenen met ten hoogste
      30 minuten verlengen ten aanzien van een student die met inbegrip van het studiejaar waarin hij examen aflegt, ten
      hoogste zes jaren onderwijs in Nederland heeft gevolgd en voor wie het Nederlands niet de moedertaal is.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel12a
  - number: 12b.1
    text: |-
      De examencommissie informeert een student tijdig voor de eerste gelegenheid over de mogelijkheid van het afleggen
      van het centraal examen ER voor het onderdeel rekenen, alsmede over de mogelijke gevolgen van het afleggen van een
      rekenexamen voor doorstroom naar het vervolgonderwijs of voor de arbeidsmarkt.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel12b
  - number: 12b.2
    text: |-
      Indien de examencommissie daarin toestemt, kan de student in plaats van het centraal examen voor het onderdeel
      rekenen van de beroepsopleiding waarin hij examen doet, het centraal examen ER voor het onderdeel rekenen van die
      beroepsopleiding afleggen.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel12b
  - number: 12c.1
    text: |-
      Op verzoek van een student verleent de examencommissie toestemming voor het afleggen van het centraal examen ER
      voor het onderdeel rekenen indien de student aantoonbaar ernstige problemen heeft met de beheersing van de vereiste
      rekenvaardigheden.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel12c
  - number: 12c.2
    text: 'Er is in ieder geval sprake van aantoonbare ernstige rekenproblemen indien de student:'
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel12c
  - number: 12c.2.a
    text: zich heeft ingespannen de vereiste rekenvaardigheden te leren;
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel12c
  - number: 12c.2.b
    text: daarbij gebruik heeft gemaakt van de door de instelling geboden extra ondersteuning, en
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel12c
  - number: 12c.2.c
    text: hij desondanks aanhoudend onvoldoende resultaten laat zien.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel12c
  - number: '13'
    text: |-
      Het instellingsexamen vindt plaats overeenkomstig de door de examencommissie krachtens de [wet][ref1] vastgestelde
      regels.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: '14'
    text: |-
      Bij gedeeltelijk centrale examinering van een examenonderdeel worden de waarderingen voor zowel het
      instellingsexamen als het centraal examen uitgedrukt in cijfers uit de reeks 1 tot en met 10 met één decimaal.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel14
  - number: '15.1'
    text: |-
      De eindwaardering voor een generiek examenonderdeel en het examen in een keuzedeel dat wat betreft eisen en
      niveau overeenkomt met een onderdeel rekenen, een onderdeel Nederlandse taal of het onderdeel Engels van een
      middenkaderopleiding of een specialistenopleiding wordt uitgedrukt in een geheel cijfer uit de reeks 1 tot en met
      10. Indien de uitkomst van de berekening niet een geheel getal is, wordt dat getal indien het eerste cijfer achter
      de komma een 4 of lager is, naar beneden afgerond en indien dat cijfer een 5 of hoger is, naar boven afgerond.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel15
  - number: '15.2'
    text: |-
      De eindwaardering voor andere examenonderdelen wordt uitgedrukt op de wijze, genoemd in het eerste lid, of met een
      waardering uit een reeks:
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel15
  - number: 15.2.a
    text: die in ieder geval de waarderingen «onvoldoende», «voldoende» en «goed» bevat; en
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel15
  - number: 15.2.b
    text: |-
      waarin tevens uitsluitend de waarderingen «zeer slecht», «slecht», «ruim onvoldoende», «bijna voldoende», «ruim
      voldoende», «zeer goed» en «uitmuntend» kunnen worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel15
  - number: '15.3'
    text: |-
      Indien een examenonderdeel uitsluitend bestaat uit een centraal examen dan wel een instellingsexamen, is de
      waardering voor dat onderdeel tevens de eindwaardering voor dat onderdeel.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel15
  - number: '15.4'
    text: |-
      Indien een examenonderdeel bestaat uit zowel een centraal examen als een instellingsexamen, bepaalt de
      examencommissie de eindwaardering voor dat onderdeel op het rekenkundig gemiddelde van het cijfer voor het
      instellingsexamen en het cijfer voor het centraal examen.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel15
  - number: '15.5'
    text: |-
      In afwijking van het eerste lid wordt de eindwaardering voor het onderdeel loopbaan en burgerschap uitgedrukt in
      «niet voldaan» of «voldaan».
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel15
  - number: '16'
    text: |-
      De examencommissie stelt de uitslag van het examen vast met inachtneming van [artikel 17][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027963#Artikel17
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0027963
        artikel: '17'
        hoofdstuk: II
        paragraaf: '4'
  - number: '17.1'
    text: |-
      Onverminderd [artikel 7.4.6, tweede lid, van de wet][ref1] is het examen voor de entreeopleiding met goed gevolg
      afgelegd, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 17.1.a
    text: |-
      voor alle specifieke examenonderdelen en het keuzedeel dat deel uitmaakt van de desbetreffende opleiding een
      eindwaardering van ten minste het cijfer 6 of ten minste «voldoende» is behaald; en
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel17
  - number: 17.1.b
    text: voor het onderdeel loopbaan en burgerschap een eindwaardering «voldaan» is behaald.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel17
  - number: '17.2'
    text: |-
      Onverminderd [artikel 7.4.6, tweede lid, van de wet][ref1] is het examen voor de basisberoepsopleiding en de
      vakopleiding met goed gevolg afgelegd, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 17.2.a
    text: |-
      voor het generieke examenonderdeel Nederlandse taal een eindwaardering van ten minste het cijfer 5 is behaald, en
      het generieke examenonderdeel rekenen is afgelegd;
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel17
  - number: 17.2.b
    text: |-
      voor alle specifieke examenonderdelen een eindwaardering van ten minste het cijfer 6 of ten minste «voldoende»
      is behaald;
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel17
  - number: 17.2.c
    text: voor het onderdeel loopbaan en burgerschap een eindwaardering «voldaan» is behaald; en
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel17
  - number: 17.2.d
    text: |-
      voor het keuzedeel dat deel uitmaakt van de beroepsopleiding een eindwaardering van ten minste het cijfer 6 of
      ten minste «voldoende» is behaald of, indien twee of meer keuzedelen deel uitmaken van de beroepsopleiding, het
      volgende resultaat is behaald:
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel17
  - number: 17.2.d.1
    text: |-
      voor de keuzedelen waarmee wordt voldaan aan de minimum studielast, bedoeld in [artikel 17d][ref1], is een
      gemiddelde eindwaardering van ten minste het cijfer 6 of ten minste «voldoende» behaald, en


      [ref1]: https://wetten.overheid.nl/BWBR0027963#Artikel17d
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0027963
        artikel: 17d
        hoofdstuk: III
  - number: 17.2.d.2
    text: |-
      voor ten minste de helft van de keuzedelen waarmee wordt voldaan aan de minimum studielast, bedoeld in
      [artikel 17d][ref1], is een eindwaardering van ten minste het cijfer 6 of ten minste «voldoende» behaald en voor de
      overige keuzedelen waarmee wordt voldaan aan de minimum studielast, bedoeld in artikel 17d, is een eindwaardering
      van ten minste het cijfer 4 of een daarmee overeenkomende eindwaardering behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0027963#Artikel17d
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0027963
        artikel: 17d
        hoofdstuk: III
  - number: '17.3'
    text: |-
      Onverminderd [artikel 7.4.6, tweede lid, van de wet][ref1] is het examen voor de middenkaderopleiding en de
      specialistenopleiding met goed gevolg afgelegd, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 17.3.a
    text: |-
      voor één van de generieke examenonderdelen Engels en Nederlandse taal een eindwaardering van ten minste het cijfer
      5 en voor het andere genoemde generieke examenonderdeel ten minste het cijfer 6 is behaald, en het generieke
      examenonderdeel rekenen is afgelegd;
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel17
  - number: 17.3.b
    text: |-
      voor alle specifieke examenonderdelen een eindwaardering van ten minste het cijfer 6 of ten minste «voldoende»
      is behaald;
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel17
  - number: 17.3.c
    text: voor het onderdeel loopbaan en burgerschap een eindwaardering «voldaan» is behaald; en
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel17
  - number: 17.3.d
    text: |-
      voor het keuzedeel dat deel uitmaakt van de beroepsopleiding een eindwaardering van ten minste het cijfer 6 of
      ten minste «voldoende» is behaald of, indien twee of meer keuzedelen deel uitmaken van de beroepsopleiding, het
      volgende resultaat is behaald:
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel17
  - number: 17.3.d.1
    text: |-
      voor de keuzedelen waarmee wordt voldaan aan de minimum studielast, bedoeld in [artikel 17d][ref1], is een
      gemiddelde eindwaardering van ten minste het cijfer 6 of ten minste «voldoende» behaald, en


      [ref1]: https://wetten.overheid.nl/BWBR0027963#Artikel17d
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0027963
        artikel: 17d
        hoofdstuk: III
  - number: 17.3.d.2
    text: |-
      voor ten minste de helft van de keuzedelen waarmee wordt voldaan aan de minimum studielast, bedoeld in
      [artikel 17d][ref1], is een eindwaardering van ten minste het cijfer 6 of ten minste «voldoende» behaald en voor de
      overige keuzedelen waarmee wordt voldaan aan de minimum studielast, bedoeld in artikel 17d, is een eindwaardering
      van ten minste het cijfer 4 of een daarmee overeenkomende eindwaardering behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0027963#Artikel17d
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0027963
        artikel: 17d
        hoofdstuk: III
  - number: '17.4'
    text: |-
      Het eerste tot en met derde lid zijn van toepassing met inachtneming van het bepaalde in
      [artikel 19, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027963#Artikel19
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0027963
        artikel: '19'
        hoofdstuk: IV
  - number: 17a.1
    text: |-
      Voor elke kwalificatie worden in het kwalificatiedossier generieke kwalificatie-eisen voor
      Nederlandse taal opgenomen overeenkomstig het desbetreffende referentieniveau, bedoeld in
      [artikel 2, onderdelen h tot en met l, van het Besluit referentieniveaus Nederlandse taal en rekenen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027879#Artikel2
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0027879
        artikel: '2'
  - number: 17a.2
    text: |-
      Voor elke kwalificatie worden in het kwalificatiedossier generieke kwalificatie-eisen
      voor rekenen opgenomen overeenkomstig het desbetreffende referentieniveau, bedoeld in
      [artikel 3, onderdelen h tot en met l, van het Besluit referentieniveaus Nederlandse taal en rekenen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027879#Artikel3
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0027879
        artikel: '3'
  - number: 17a.3
    text: |-
      Voor elke kwalificatie worden in het kwalificatiedossier generieke kwalificatie-eisen voor loopbaan en burgerschap
      opgenomen overeenkomstig [bijlage 1][ref1] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0027963
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0027963
  - number: 17a.4
    text: |-
      Voor elke kwalificatie voor het vierde niveau bedoeld in [artikel 7.2.2, derde lid, van de wet][ref1] worden in het
      kwalificatiedossier generieke kwalificatie-eisen voor Engels opgenomen overeenkomstig de volgende referentieniveaus
      zoals opgenomen in [bijlage 2][ref2] bij dit besluit:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0027963
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0027963
  - number: 17a.4.a
    text: 'lezen en luisteren: B1,'
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel17a
  - number: 17a.4.b
    text: 'schrijven, spreken en gesprekken voeren: A2.'
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel17a
  - number: 17b
    text: |-
      In het toelichtende deel van het kwalificatiedossier wordt aangegeven hoe de specifieke kwalificatie-eisen voor
      moderne vreemde talen zich verhouden tot de referentieniveaus zoals opgenomen in [bijlage 2][ref1] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0027963
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0027963
  - number: 17c
    text: |-
      Bij ministeriële regeling kan worden bepaald dat aan een onderdeel of onderdelen van een kwalificatie of
      kwalificaties dan wel aan een keuzedeel of keuzedelen een certificaat is verbonden.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel17c
  - number: 17d.1
    text: |-
      Bij ministeriële regeling wordt op voorstel van de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven de
      studielast van elk keuzedeel vastgesteld. De studielast van een keuzedeel is 240, 480, 720 of 960 klokuren.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel17d
  - number: 17d.2
    text: De totale studielast van de keuzedelen die deel uitmaken van een beroepsopleiding is ten minste
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel17d
  - number: 17d.2.a
    text: 'voorde entreeopleiding en de specialistenopleiding: 240 klokuren,'
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel17d
  - number: 17d.2.b
    text: 'voor de basisberoepsopleiding: 480 klokuren,'
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel17d
  - number: 17d.2.c
    text: 'voor de vakopleiding: 720 klokuren,'
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel17d
  - number: 17d.2.d
    text: |-
      voor de middenkaderopleiding: 720 klokuren of, indien met inachtneming van
      [artikel 7.2.4a, vierde lid, van de wet][ref1] voor de opleiding een langere studieduur dan drie volledige
      studiejaren kan worden vastgesteld: 960 klokuren.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel17d
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 17d.3
    text: |-
      Indien een of meer onderdelen als bedoeld in [artikel 6.1.2a, tweede lid, van de wet][ref1] deel uitmaken van de
      beroepsopleiding, worden 240 klokuren in mindering gebracht op de in het tweede lid, onder b, c en d, bedoelde
      minimum studielast van de keuzedelen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel17d
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
  - number: 17d.4
    text: |-
      Voor de toepassing van [artikel 7.2.7, tweede lid, van de wet][ref1] wordt voor keuzedelen en onderdelen als
      bedoeld in [artikel 6.1.2a, tweede lid, van de wet][ref2] tezamen maximaal het in het tweede lid genoemde aantal
      klokuren uren studielast meegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel17d
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '6'
  - number: '18.1'
    text: |-
      Het examen van een beroepsopleiding wordt voor de eerste maal ingedeeld met keuzedelen als bedoeld in
      [artikel 3, eerste lid][ref1], bij beroepsopleidingen waarmee een student is aangevangen op of na 1 augustus 2016.


      [ref1]: https://wetten.overheid.nl/BWBR0027963#Artikel3
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0027963
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '18.2'
    text: |-
      Centrale examinering voor de keuzedelen rekenen en Nederlandse taal, die wat eisen en niveau overeenkomen met
      de gelijknamige generieke examenonderdelen, vindt plaats bij beroepsopleidingen vanaf het studiejaar 2016–2017,
      onverminderd [artikel 4][ref1] zoals luidend op 1 augustus 2019.


      [ref1]: https://wetten.overheid.nl/BWBR0027963#Artikel4
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0027963
        artikel: '4'
        hoofdstuk: II
        paragraaf: '2'
  - number: '18.3'
    text: |-
      Centrale examinering voor het keuzedeel Engels, dat wat eisen en niveau overeenkomt met het gelijknamige generiek
      examenonderdeel, vindt plaats bij beroepsopleidingen vanaf het studiejaar 2017–2018.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel18
  - number: 18a.1
    text: |-
      In afwijking van [artikel 3][ref1] kan het bevoegd gezag beslissen dat de examenonderdelen rekenen en die een
      keuzedeel betreffen, geen onderdeel zijn van het examen van een beroepsopleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0027963#Artikel3
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0027963
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: 18a.2
    text: |-
      Het bevoegd gezag neemt een beslissing als bedoeld in het eerste lid alleen ten behoeve van deelnemers die
      uiterlijk 31 december 2020 hun diploma behalen en die als gevolg van de uitbraak van COVID-19 studievertraging
      hebben opgelopen.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel18a
  - number: 18a.3
    text: |-
      Indien het bevoegd gezag heeft beslist overeenkomstig het eerste lid is op die deelnemers de uitslagbepaling van
      [artikel 17][ref1] van toepassing, met dien verstande dat, afhankelijk van op welk examenonderdeel de beslissing
      betrekking heeft:


      [ref1]: https://wetten.overheid.nl/BWBR0027963#Artikel17
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0027963
        artikel: '17'
        hoofdstuk: II
        paragraaf: '4'
  - number: 18a.3.a
    text: het onderdeel rekenen niet behoeft te zijn afgelegd;
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel18a
  - number: 18a.3.b
    text: het examenonderdeel dat een keuzedeel betreft, niet behoeft te zijn afgelegd,
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel18a
  - number: 18a.3.c
    text: beide examenonderdelen, bedoeld in onderdelen a en b, niet behoeven te zijn afgelegd.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel18a
  - number: '19.1'
    text: |-
      In één of meer studiejaren gelegen voor het studiejaar waarin krachtens [artikel 18][ref1] centrale examinering
      voor de onderdelen Nederlandse taal, rekenen of Engels voor de eerste maal plaatsvindt, kan voor de onderdelen
      Nederlandse taal, rekenen en Engels bij wijze van proef geheel of gedeeltelijk centrale examinering plaatsvinden
      door middel van een pilotexamen. Het bevoegd gezag van een instelling beslist of bij die instelling pilotexamens
      plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0027963#Artikel18
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0027963
        artikel: '18'
        hoofdstuk: IV
  - number: '19.2'
    text: |-
      Het resultaat van het pilotexamen, dat is afgenomen in het laatste studiejaar voorafgaande aan het studiejaar
      waarin centrale examinering voor de eerste maal plaatsvindt, levert voor de onderdelen Nederlandse taal, rekenen of
      Engels een vrijstelling van uitsluitend het centraal examen voor het betreffende onderdeel op indien:
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel19
  - number: 19.2.a
    text: |-
      het centraal examen is afgenomen nadat ten minste de helft van de voor de student geldende studieduur is
      verstreken; of
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel19
  - number: 19.2.b
    text: |-
      indien de voor de student geldende studieduur minder dan 24 maanden bedraagt en daarmee in afwijking van onderdeel
      a: het centraal examen is afgenomen vanaf het moment waarop de resterende periode van de voor die student geldende
      studieduur minder dan 12 maanden bedraagt; en
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel19
  - number: 19.2.c
    text: |-
      voor zover het pilotexamen het onderdeel Nederlandse taal betreft: voor dit pilotexamen ten minste het cijfer 6
      is behaald.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel19
  - number: '19.3'
    text: |-
      Bij vrijstelling voor de onderdelen Nederlandse taal, rekenen of Engels op grond van het tweede lid, telt de
      waardering voor het pilotexamen mee bij het bepalen van de eindwaardering, bedoeld in [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027963#Artikel15
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0027963
        artikel: '15'
        hoofdstuk: II
        paragraaf: '4'
  - number: '19.4'
    text: |-
      Indien een pilotexamen of uitsluitend een instellingsexamen voor de onderdelen Nederlandse taal of rekenen van een
      beroepsopleiding is afgenomen voordat centrale examinering van die onderdelen voor de student voor de eerste maal
      plaatsvindt, heeft de waardering daarvan met een cijfer lager dan 6 dan wel met «onvoldoende» geen gevolgen voor
      het behalen van het diploma.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel19
  - number: '19.5'
    text: Bij ministeriële regeling kunnen nadere regels worden vastgesteld omtrent pilotexamens.
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel19
  - number: 19a
    text: |-
      Voor de student die voor 1 augustus 2016 een aanvang heeft gemaakt met zijn beroepsopleiding, zijn de generieke
      kwalificatie-eisen inzake loopbaan en burgerschap uit [bijlage 1][ref1] van toepassing zoals die bijlage luidde op
      31 juli 2016.


      [ref1]: https://wetten.overheid.nl/BWBR0027963
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0027963
  - number: '20'
    text: 'Dit besluit wordt aangehaald als: Examen- en kwalificatiebesluit beroepsopleidingen WEB.'
    url: https://wetten.overheid.nl/BWBR0027963/2020-08-01#Artikel20
