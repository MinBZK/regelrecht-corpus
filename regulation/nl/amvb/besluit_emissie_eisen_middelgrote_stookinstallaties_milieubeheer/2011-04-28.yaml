  - number: 2.1.1.1
    text: |-
      Het rookgas van een ketelinstallatie waarin de brandstof in vaste of vloeibare vorm wordt verstookt, voldoet aan de
      volgende emissiegrenswaarden:
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.1.1
  - number: 2.1.1.1.a
    text: |-
      stikstofoxiden (NO): 100 milligram per Nm3, voor zover de brandstof in vaste vorm wordt verstookt, en 120 milligram
      per Nm3, voor zover de brandstof in vloeibare vorm wordt verstookt;
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.1.1
  - number: 2.1.1.1.b
    text: 'zwaveldioxide (SO): 200 milligram per Nm3, en'
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.1.1
  - number: 2.1.1.1.c
    text: 'totaal stof: 5 milligram per Nm3.'
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.1.1
  - number: 2.1.1.2
    text: |-
      In afwijking van het eerste lid, onder a en c, voldoet het rookgas van een ketelinstallatie met een thermisch
      vermogen van minder dan vijf megawatt, waarin biomassa als brandstof wordt toegepast, aan de volgende
      emissiegrenswaarden:
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.1.1
  - number: 2.1.1.2.a
    text: 'stikstofoxiden (NO): 200 milligram per Nm3, en'
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.1.1
  - number: 2.1.1.2.b
    text: 'totaal stof: 20 milligram per Nm3.'
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.1.1
  - number: 2.1.1.3
    text: |-
      In afwijking van het eerste lid, onder a, voldoet het rookgas van een ketelinstallatie met een thermisch vermogen
      van vijf megawatt of meer, waarin biomassa als brandstof wordt verstookt, aan een emissiegrenswaarde voor
      stikstofoxiden (NO) van 145 milligram per Nm3.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.1.1
  - number: 2.1.1.4
    text: |-
      Het rookgas van een ketelinstallatie, waarin de brandstof in gasvorm wordt verstookt, voldoet aan de volgende
      emissiegrenswaarden:
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.1.1
  - number: 2.1.1.4.a
    text: 'stikstofoxiden (NO): 70 milligram per Nm3, en'
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.1.1
  - number: 2.1.1.4.b
    text: 'zwaveldioxide (SO): 200 milligram per Nm3.'
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.1.1
  - number: 2.1.1.5
    text: |-
      In afwijking van het vierde lid, onder a, wordt, indien in een stookinstallatie een andere gasvormige brandstof dan
      aardgas wordt gestookt, de emissiegrenswaarde vermenigvuldigd met een factor die gelijk is aan de verhouding van de
      onderste verbrandingswaarde van de ingezette brandstof, uitgedrukt in MJ/kg, tot een verbrandingswaarde van 38 MJ/
      kg, waarbij de laatstgenoemde factor minimaal 0,9 en maximaal 2,0 bedraagt.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.1.1
  - number: 2.1.2
    text: 'Het rookgas van een gasturbine-installatie voldoet aan de volgende emissiegrenswaarden:'
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.1.2
  - number: 2.1.2.a
    text: |-
      stikstofoxiden (NO): 140 milligram per Nm3, teruggerekend naar ISO-luchtcondities en betrokken op de warmte-inhoud
      van de toegevoerde brandstof;
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.1.2
  - number: 2.1.2.b
    text: 'zwaveldioxide (SO): 200 milligram per Nm3, en'
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.1.2
  - number: 2.1.2.c
    text: 'voor zover op vloeibare brandstof wordt gestookt, totaal stof: 15 milligram per Nm3.'
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.1.2
  - number: 2.1.3
    text: 'Het rookgas van een vloeistofmotorinstallatie voldoet aan de volgende emissiegrenswaarden:'
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.1.3
  - number: 2.1.3.a
    text: 'stikstofoxiden (NO): 450 milligram per Nm3, teruggerekend naar ISO-luchtcondities;'
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.1.3
  - number: 2.1.3.b
    text: 'zwaveldioxide (SO): 200 milligram per Nm3, en'
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.1.3
  - number: 2.1.3.c
    text: 'totaal stof: 50 milligram per Nm3.'
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.1.3
  - number: 2.1.4.1
    text: 'Het rookgas van een gasmotorinstallatie voldoet aan de volgende emissiegrenswaarden:'
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.1.4
  - number: 2.1.4.1.a
    text: 'stikstofoxiden (NO): 100 milligram per Nm3;'
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.1.4
  - number: 2.1.4.1.b
    text: zwaveldioxide (SO) 200 milligram per Nm3, en
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.1.4
  - number: 2.1.4.1.c
    text: 'onverbrande koolwaterstoffen (CH, uitgedrukt in C): 1500 milligram per Nm3.'
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.1.4
  - number: 2.1.4.2
    text: |-
      In afwijking van het eerste lid, onder a en c, voldoet het rookgas van een gasmotorinstallatie waarin gas wordt
      verstookt dat voor ten minste 95 procent uit gas bestaat dat door vergisting van organisch materiaal, zoals gft-
      afval, mest, rioolslib, actief slib, gestort huisvuil of een mengsel daarvan met hoofdbestanddelen als methaan en
      koolstofdioxide is ontstaan, en een gasmotorinstallatie met een thermisch vermogen van minder dan 2,5 megawatt,
      aan een emissiegrenswaarde voor stikstofoxiden (NO) van ten hoogste 340 milligram per Nm3 en geldt voor onverbrande
      koolwaterstoffen (CH, uitgedrukt in C), geen emissiegrenswaarde.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.1.4
  - number: 2.1.5.1
    text: |-
      In afwijking van de [artikelen 2.1.1 tot en met 2.1.4][ref1] stelt het bevoegd gezag, indien tot de
      inrichting een gpbv-installatie behoort, voor een tot die gpbv-installatie behorende stookinstallatie
      strengere emissiegrenswaarden vast dan de voor die installatie gestelde emissiegrenswaarden, indien met
      laatstbedoelde eisen niet wordt voldaan aan het bepaalde bij of krachtens de [artikelen 2.14][ref2] en
      [2.22 van de Wet algemene bepalingen omgevingsrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0026884#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.1.5
    references:
      - id: ref1
        bwb_id: BWBR0026884
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 2.1.5.2
    text: |-
      Het bevoegd gezag kan ten aanzien van een stookinstallatie waarop [titel 16.3 van de wet][ref1] van toepassing is,
      eisen stellen met betrekking tot de emissie van stikstofoxiden (NO), indien de lokale luchtkwaliteit dat vergt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.1.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 2.2.1.1
    text: |-
      Een bestaande stookinstallatie voldoet aan de emissiegrenswaarden die onmiddellijk
      voorafgaand aan de inwerkingtreding van dit besluit voor die installatie golden ingevolge het
      [Besluit emissie-eisen stookinstallaties milieubeheer B][ref1], dan wel de daarvan afwijkende emissiegrenswaarden,
      die voor die stookinstallatie gelden ingevolge een voor die installatie verleende vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0004833
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0004833
  - number: 2.2.1.2
    text: |-
      Een stookinstallatie als bedoeld in het eerste lid voldoet vanaf 1 januari 2017 aan de in de
      [artikelen 2.1.1 tot en met 2.1.5][ref1] gestelde emissiegrenswaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0026884#Artikel2
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0026884
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.2.1.3
    text: |-
      In afwijking van het eerste lid voldoen stookinstallaties die zich binnen de exclusieve economische zone bevinden
      dan wel deel uitmaken van een inrichting waarin kooldioxide (CO), afkomstig van een andere inrichting, wordt
      ingezet ten behoeve van de bemesting van gewassen teneinde het gebruik van brandstof te verminderen, met ingang van
      1 januari 2019 aan de in het derde lid bedoelde emissiegrenswaarden.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.2.1
  - number: 2.2.2
    text: |-
      Indien aan een bestaande stookinstallatie als bedoeld in
      [artikel 2.2.1, eerste lid, in verbinding met het tweede of derde lid][ref1], voor 1 januari 2017 onderscheidenlijk
      1 januari 2019 een belangrijke wijziging wordt aangebracht, wordt die wijziging zodanig uitgevoerd dat aan de
      emissiegrenswaarden voor een nieuwe stookinstallatie wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0026884#Artikel2
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0026884
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.3.1.1
    text: |-
      Een stookinstallatie die door een storing niet voldoet aan de voor die installatie ingevolge dit besluit geldende
      emissiegrenswaarden, mag in bedrijf blijven voor ten hoogste 120 achtereenvolgende uren na het optreden van de
      storing, met een maximum van 120 uur per kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.3.1
  - number: 2.3.1.2
    text: |-
      Indien een storing als bedoeld in het eerste lid niet binnen 120 uur zodanig is hersteld dat de stookinstallatie
      weer aan de op haar van toepassing zijnde emissiegrenswaarden voldoet, wordt de stookinstallatie buiten bedrijf
      gesteld.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.3.1
  - number: 2.3.1.3
    text: |-
      Het tweede lid blijft buiten toepassing indien het een stookinstallatie betreft die zich binnen de exclusieve
      economische zone bevindt, de storing redelijkerwijs niet binnen het in het eerste lid genoemde aantal uren kan
      worden hersteld en deze omstandigheid voor het verstrijken van dat aantal uren schriftelijk met opgave van redenen
      is gemeld bij het Staatstoezicht op de mijnen. Het Staatstoezicht op de mijnen stelt in dat geval een termijn
      waarbinnen de storing wordt hersteld. Indien de storing niet binnen de door het Staatstoezicht op de mijnen
      gestelde termijn is hersteld, wordt de stookinstallatie alsnog buiten bedrijf gesteld.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.3.1
  - number: 2.3.1.4
    text: |-
      Indien een storing samenhangt met de brandstof die in de stookinstallatie wordt verstookt, mag gedurende het aantal
      uren, bedoeld in het eerste of derde lid, een andere brandstof worden gebruikt en blijven de emissiegrenswaarden,
      bedoeld in dit besluit, buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.3.1
  - number: 2.3.2.1
    text: |-
      Voor de berekening van de uitworp van een stookinstallatie wordt de massaconcentratie aan zwaveldioxide (SO),
      stikstofoxiden (NO), totaal stof of onverbrande koolwaterstoffen (CH, uitgedrukt in C) in het rookgas herleid op
      rookgas met een volumegehalte aan zuurstof van:
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.3.2
  - number: 2.3.2.1.a
    text: zes procent, indien het een stookinstallatie met vaste brandstof betreft, en
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.3.2
  - number: 2.3.2.1.b
    text: drie procent, indien het een stookinstallatie met een gasvormige of vloeibare brandstof betreft.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.3.2
  - number: 2.3.2.2
    text: |-
      Voor de berekening van de uitworp van een stookinstallatie wordt de massaconcentratie aan stikstofoxiden (NO) in
      het rookgas berekend als massaconcentratie aan stikstofdioxide.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.3.2
  - number: 2.3.3
    text: |-
      Bij gelijktijdig gebruik van verschillende brandstoffen in een ketelinstallatie bedraagt de uitworp van
      zwaveldioxide (SO), stikstofoxiden (NO) en totaal stof met het rookgas niet meer dan het gemiddelde van de uitworp
      die voor elke brandstof afzonderlijk is toegestaan. Het gemiddelde van de uitworp wordt berekend naar het aandeel
      in de warmte-inhoud van de toegevoerde brandstof.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.3.3
  - number: 2.3.4
    text: |-
      Een stookinstallatie die strekt tot vervanging voor ten hoogste zes maanden van een stookinstallatie die buiten
      bedrijf is gesteld in verband met onderhoud, reparatie of definitieve vervanging en die is afgekoppeld van
      de brandstoftoevoer of van het stoom- of elektriciteitsnet waaraan zij levert, voldoet in ieder geval aan de
      emissiegrenswaarden waaraan de buiten bedrijf gestelde stookinstallatie voldeed.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel2.3.4
  - number: 3.1.1
    text: |-
      Deze paragraaf is niet van toepassing op het meten van de concentratie van totaal stof en onverbrande
      koolwaterstoffen (CH, uitgedrukt in C) in het rookgas van stookinstallaties waarvoor ingevolge dit besluit geen
      emissiegrenswaarde geldt voor deze stoffen.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.1.1
  - number: 3.1.2.1
    text: |-
      De concentratie aan stikstofoxiden (NO), zwaveldioxide (SO), totaal stof en onverbrande koolwaterstoffen (CH,
      uitgedrukt in C) in het rookgas, bedoeld in dit besluit, wordt bepaald door continue of afzonderlijke meting.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.1.2
  - number: 3.1.2.2
    text: |-
      In afwijking van het eerste lid, wordt de concentratie aan stikstofoxiden in het rookgas van een stookinstallatie
      bepaald door continue meting, indien ter bestrijding van de uitworp van stikstofoxiden (NO) met rookgasinjectie van
      water of stoom, een inert materiaal dan wel ammoniak of ureum wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.1.2
  - number: 3.1.2.3
    text: |-
      In afwijking van het tweede lid mag worden volstaan met afzonderlijke meting indien een logboek wordt bijgehouden
      waarin de hoeveelheid geïnjecteerde stoom of water, de hoeveelheid toegepast inert materiaal of de hoeveelheid
      toegevoegde ammoniak of ureum gedurende een kalenderjaar wordt bijgehouden en de betreffende emissiegrenswaarden
      niet worden overschreden.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.1.2
  - number: 3.1.2.4
    text: |-
      De concentraties van stoffen waarvoor in dit besluit emissiegrenswaarden zijn vastgesteld in het rookgas van een
      stookinstallatie worden voor een vervangende stookinstallatie als bedoeld in [artikel 2.3.4][ref1] binnen vier
      weken na de inbedrijfstelling van die vervangende installatie bepaald door middel van een afzonderlijke meting.


      [ref1]: https://wetten.overheid.nl/BWBR0026884#Artikel2
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.1.2
    references:
      - id: ref1
        bwb_id: BWBR0026884
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 3.1.3
    text: |-
      In afwijking van [artikel 3.1.2, eerste lid][ref1], behoeven geen metingen van zwaveldioxide (SO) te worden
      verricht indien het in acht nemen van de emissiegrenswaarden geschiedt door het stoken van brandstof met een
      zwavelgehalte van 0,1 procent en de stookinstallatie niet is uitgerust met apparatuur voor het reduceren van de
      emissies van zwaveldioxide (SO).


      [ref1]: https://wetten.overheid.nl/BWBR0026884#Artikel3
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.1.3
    references:
      - id: ref1
        bwb_id: BWBR0026884
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.1.4.1
    text: |-
      Onverminderd de [artikelen 3.1.2][ref1] en [3.1.3][ref2] worden voor het bepalen van de concentraties in het
      rookgas van stoffen waarvoor in de [paragrafen 2.1][ref3] en [2.2][ref4] emissiegrenswaarden zijn gesteld,
      representatieve metingen verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0026884#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0026884#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0026884#Hoofdstuk2
      [ref4]: https://wetten.overheid.nl/BWBR0026884#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.1.4
    references:
      - id: ref1
        bwb_id: BWBR0026884
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0026884
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0026884
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref4
        bwb_id: BWBR0026884
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 3.1.4.2
    text: |-
      De bemonsteringen, analyses en metingen van de parameters die nodig zijn voor het bepalen van het voldoen
      aan de waarden, bedoeld in het eerste lid, alsmede de andere metingen en berekeningen die in dit besluit zijn
      voorgeschreven, worden uitgevoerd volgens onderstaande normbladen:
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.1.4
  - number: 3.1.4.2.a
    text: 'emissiemeting:'
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.1.4
  - number: 3.1.4.2.a.1°
    text: |-
      stikstofoxiden (NO): NEN-EN 14792 «Emissies van stationaire bronnen – Bepaling van massaconcentratie aan
      stikstofoxiden (NO) – Referentiemethode – Chemiluminescentie»;
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.1.4
  - number: 3.1.4.2.a.2°
    text: |-
      zwaveldioxide (SO): NEN-EN 14791 «Emissies van stationaire bronnen – Bepaling van de massaconcentratie aan
      zwaveldioxide – Referentiemethode»; en
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.1.4
  - number: 3.1.4.2.a.3°
    text: |-
      onverbrande koolwaterstoffen (CH): NEN-EN 12619 «Emissies van stationaire bronnen – Bepaling van de
      massaconcentratie van totaal gasvormig organisch koolstof in lage concentraties in verbrandingsgassen – Continue
      methode met vlamionisatiedetector»;
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.1.4
  - number: 3.1.4.2.a.4°
    text: |-
      Totaal stof: NEN-EN 13284-1 «Emissies van stationaire bronnen – Bepaling van massaconcentratie van stof in lage
      concentraties – Deel 1: Manuele gravimetrische methode», of NEN-EN 13284-2 «Emissies van stationaire bronnen –
      Bepaling van massaconcentratie van stof in lage concentraties – Deel 2: Geautomatiseerde meetsystemen»;
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.1.4
  - number: 3.1.4.2.a.5°
    text: |-
      Zuurstof (O): NEN-EN 14789 «Emissies van stationaire bronnen – Bepaling van de volumeconcentratie van zuurstof (O)
      – Referentiemethode – Paramagnetisme», en
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.1.4
  - number: 3.1.4.2.b
    text: |-
      monstername betreffende de onder a genoemde stoffen: NEN-EN 15259 «Luchtkwaliteit – Meetmethode emissies van
      stationaire bronnen – Eisen voor meetvlakken en meetlocaties en voor doelstelling, meetplan en rapportage van de
      meting».
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.1.4
  - number: 3.1.4.3
    text: |-
      Met de normbladen, bedoeld in het tweede lid, worden gelijkgesteld normbladen die worden gesteld in een andere
      lidstaat van de Europese Unie dan wel een staat, niet zijnde een lidstaat van de Europese Unie, die partij is
      bij een daartoe strekkend of mede daartoe strekkend verdrag dat Nederland bindt, en die een beschermingsniveau
      waarborgen dat ten minste gelijkwaardig is aan het niveau dat met de nationale eisen wordt nagestreefd.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.1.4
  - number: 3.1.4.4
    text: |-
      Het uitvoeren van afzonderlijke metingen, parallelmetingen en referentiemetingen geschiedt door een instantie die
      is geaccrediteerd door een accreditatie-instantie.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.1.4
  - number: 3.1.4.5
    text: |-
      In afwijking van het vierde lid, mag een afzonderlijke meting ook worden uitgevoerd door een persoon die beschikt
      over een geldig certificaat dat is afgegeven door een instantie die is geaccrediteerd door een accreditatie-
      instantie teneinde uitvoering te kunnen geven aan de «Beoordelingrichtlijn voor het uitvoeren van onderhoud en
      inspecties aan stookinstallaties, Scope 6» van de Stichting Certificatie Inspectie en Onderhoud Stookinstallaties,
      mits hij die meting uitvoert overeenkomstig Scope 6, of door een persoon die beschikt over een bewijs dat aangeeft
      dat aan met die beoordelingrichtlijn, Scope 6, vergelijkbare eisen wordt voldaan, mits hij de meting uitvoert
      overeenkomstig die vergelijkbare eisen.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.1.4
  - number: 3.1.4.6
    text: |-
      Op een certificaat als bedoeld in het vijfde lid is [artikel 4.1, vijfde lid][ref1], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0026884#Artikel4
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.1.4
    references:
      - id: ref1
        bwb_id: BWBR0026884
        artikel: '4'
        hoofdstuk: '4'
  - number: 3.2.1.1
    text: |-
      Indien de concentratie aan stikstofoxiden (NO), zwaveldioxide (SO), totaal stof of onverbrande koolwaterstoffen
      (CH, uitgedrukt in C) afzonderlijk wordt gemeten, wordt zodra een emissiegrenswaarde van toepassing is geworden,
      binnen vier weken nadien een afzonderlijke meting verricht.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.2.1
  - number: 3.2.1.2
    text: |-
      Indien de concentratie aan stikstofoxiden (NO), zwaveldioxide (SO), totaal stof of onverbrande koolwaterstoffen
      (CH, uitgedrukt in C) bij een gasturbine-installatie, een vloeistofmotorinstallatie of een gasmotorinstallatie
      afzonderlijk wordt gemeten, wordt in aanvulling op het eerste lid, om de vier jaar een nieuwe afzonderlijke meting
      verricht.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.2.1
  - number: 3.2.1.3
    text: |-
      Indien door het veranderen van brandstof op een stookinstallatie andere emissiegrenswaarden van toepassing worden,
      wordt binnen vier weken nadien een nieuwe afzonderlijke meting verricht. Het tweede lid is van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.2.1
  - number: 3.2.2.1
    text: |-
      Een afzonderlijke meting als bedoeld in [artikel 3.2.1][ref1] bestaat uit drie deelmetingen van ten minste vijftien
      minuten en ten hoogste dertig minuten.


      [ref1]: https://wetten.overheid.nl/BWBR0026884#Artikel3
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.2.2
    references:
      - id: ref1
        bwb_id: BWBR0026884
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.2.2.2
    text: |-
      Indien geen van de deelmetingen, bedoeld in het eerste lid, de desbetreffende emissiegrenswaarde overschrijdt, is
      aan die emissiegrenswaarde voldaan.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.2.2
  - number: 3.2.2.3
    text: |-
      Indien één van de deelmetingen, bedoeld in het eerste lid, aangeeft dat een emissiegrenswaarde wordt overschreden,
      wordt de afzonderlijke meting herhaald binnen drie maanden na de laatste deelmeting van de afzonderlijke meting,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.2.2
  - number: 3.2.2.4
    text: |-
      Indien één van de deelmetingen van de afzonderlijke meting, bedoeld in het derde lid, aangeeft dat de
      emissiegrenswaarde die aanleiding was voor de herhaalde afzonderlijke meting, wederom wordt overschreden, treft
      de drijver van de inrichting zodanige voorzieningen aan de stookinstallatie dat verdere overschrijding van die
      emissiegrenswaarde wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.2.2
  - number: 3.2.3.1
    text: |-
      Bij een afzonderlijke meting als bedoeld in [artikel 3.2.1][ref1] mag van een meting een door een onafhankelijke en
      deskundige meetinstantie aangetoond 95%-betrouwbaarheidsinterval worden afgetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0026884#Artikel3
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.2.3
    references:
      - id: ref1
        bwb_id: BWBR0026884
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.2.3.2
    text: |-
      De waarde van het 95%-betrouwbaarheidsinterval, bedoeld in het eerste lid, is niet groter dan de volgende
      percentages van de emissiegrenswaarde voor:
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.2.3
  - number: 3.2.3.2.a
    text: 'zwaveldioxide (SO): 20;'
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.2.3
  - number: 3.2.3.2.b
    text: 'stikstofoxiden (NO): 20;'
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.2.3
  - number: 3.2.3.2.c
    text: 'totaal stof: 30, en'
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.2.3
  - number: 3.2.3.2.d
    text: 'onverbrande koolwaterstoffen (CH, uitgedrukt in C): 20.'
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.2.3
  - number: 3.2.4.1
    text: |-
      Een afzonderlijke meting als bedoeld in [artikel 3.2.1][ref1] bij een ketelinstallatie wordt verricht bij een
      belasting van meer dan 60 procent.


      [ref1]: https://wetten.overheid.nl/BWBR0026884#Artikel3
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.2.4
    references:
      - id: ref1
        bwb_id: BWBR0026884
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.2.4.2
    text: |-
      Een afzonderlijke meting als bedoeld in [artikel 3.2.1][ref1] bij een vloeistofmotorinstallatie, een
      gasmotorinstallatie of een gasturbine-installatie wordt verricht bij de hoogste belasting waarbij deze continu kan
      worden bedreven.


      [ref1]: https://wetten.overheid.nl/BWBR0026884#Artikel3
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.2.4
    references:
      - id: ref1
        bwb_id: BWBR0026884
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.2.4.3
    text: |-
      Een afzonderlijke meting als bedoeld in [artikel 3.2.1][ref1] bij een gasturbine-installatie met een bijbehorende
      ketelinstallatie wordt verricht bij een bijstook van ten hoogste 10% in de bijbehorende ketelinstallatie.


      [ref1]: https://wetten.overheid.nl/BWBR0026884#Artikel3
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.2.4
    references:
      - id: ref1
        bwb_id: BWBR0026884
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.3.1.1
    text: |-
      Continue meting voor de bepaling van de concentratie van zwaveldioxide (SO), stikstofoxiden (NO), totaal stof of
      onverbrande koolwaterstoffen (CH, uitgedrukt in C) vindt plaats door:
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.3.1
  - number: 3.3.1.1.a
    text: rechtstreekse continue meting van de concentratie in het rookgas, of
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.3.1
  - number: 3.3.1.1.b
    text: continue meting van de parameters van de voor een stookinstallatie vastgestelde uitworpkarakteristiek.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.3.1
  - number: 3.3.1.2
    text: |-
      De kwaliteitsborging van de ter controle van de emissiegrenswaarden geïnstalleerde apparatuur en toegepaste
      uitworpkarakteristieken voldoen aan NEN-EN 14181 «Emissies van stationaire bronnen – Kwaliteitsborging van
      geautomatiseerde meetsystemen», waarbij de kalibratie eens per vijf jaar plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.3.1
  - number: 3.3.1.3
    text: |-
      Met het normblad, bedoeld in het tweede lid, worden gelijkgesteld normdocumenten die worden gesteld in een andere
      lidstaat van de Europese Unie dan wel een staat, niet zijnde een lidstaat van de Europese Unie, die partij is
      bij een daartoe strekkend of mede daartoe strekkend verdrag dat Nederland bindt, en die een beschermingsniveau
      waarborgen dat ten minste gelijkwaardig is aan het niveau dat met de nationale eisen wordt nagestreefd.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.3.1
  - number: 3.3.2
    text: |-
      Bij een continue meting als bedoeld in [artikel 3.3.1][ref1] is aan een emissiegrenswaarde voldaan indien 100
      procent van de daggemiddelden die emissiegrenswaarde niet overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0026884#Artikel3
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.3.2
    references:
      - id: ref1
        bwb_id: BWBR0026884
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.3.1
    text: |-
      Indien de concentratie aan stikstofoxiden, zwaveldioxide, onverbrande koolwaterstoffen of totaal stof continu wordt
      gemeten, wordt de uitworp tijdens het opstarten en stilleggen van de stookinstallatie niet meegerekend bij het
      bepalen of aan de emissiegrenswaarde wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.3.3
  - number: 3.3.3.2
    text: |-
      Indien de concentratie aan stikstofoxiden, zwaveldioxide, onverbrande koolwaterstoffen of totaal stof continu wordt
      gemeten en de stookinstallatie is uitgerust met nageschakelde apparatuur die is bedoeld voor het verminderen van de
      emissie van genoemde stoffen, wordt de uitworp tijdens perioden als bedoeld in [artikel 2.3.1, eerste lid][ref1],
      niet meegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0026884#Artikel2
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.3.3
    references:
      - id: ref1
        bwb_id: BWBR0026884
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 3.3.4.1
    text: |-
      De waarde van het 95%-betrouwbaarheidsinterval van individuele waarnemingen, op basis waarvan de gemiddelden worden
      berekend die getoetst worden aan een emissiegrenswaarde, is bij continue metingen niet groter dan de volgende
      percentages van de emissiegrenswaarde:
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.3.4
  - number: 3.3.4.1.a
    text: 'zwaveldioxide (SO): 20;'
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.3.4
  - number: 3.3.4.1.b
    text: 'stikstofoxiden (NO): 20;'
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.3.4
  - number: 3.3.4.1.c
    text: 'totaal stof: 30, en'
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.3.4
  - number: 3.3.4.1.d
    text: 'onverbrande koolwaterstoffen (CH, uitgedrukt in C): 20.'
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.3.4
  - number: 3.3.4.2
    text: |-
      Bij continue metingen vindt toetsing aan de bij of krachtens dit besluit gestelde emissiegrenswaarden plaats
      op basis van het gemiddelde van de individuele waarnemingen, na aftrek van de waarde van het in het eerste lid
      bedoelde betrouwbaarheidsinterval.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.3.4
  - number: 3.3.4.3
    text: |-
      Indien in een dag meer dan drie uurgemiddelden ongeldig zijn wegens storing of onderhoud van het continu werkende
      meetsysteem, worden de metingen van die dag als ongeldig beschouwd. Indien in enig kalenderjaar de metingen van
      meer dan tien dagen ongeldig zijn, treft degene die de inrichting drijft passende maatregelen om de betrouwbaarheid
      van het continu werkende meetsysteem te verbeteren.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.3.4
  - number: '3.4'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van dit hoofdstuk, waaronder begrepen
      voorschriften omtrent registratie en rapportage.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel3.4
  - number: 4.1.1
    text: 'Een niet-gasgestookte stookinstallatie als bedoeld in dit besluit met een nominaal vermogen van:'
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel4.1
  - number: 4.1.1.a
    text: |-
      20 kilowatt tot ten hoogste 100 kilowatt, wordt ten minste eenmaal per vier jaar gekeurd op veilig functioneren,
      optimale verbranding en energiezuinigheid;
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel4.1
  - number: 4.1.1.b
    text: |-
      meer dan 100 kilowatt, wordt ten minste eenmaal per twee jaar gekeurd op veilig functioneren, optimale verbranding
      en energiezuinigheid.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel4.1
  - number: 4.1.2
    text: |-
      Een gasgestookte stookinstallatie als bedoeld in dit besluit met een nominaal vermogen van meer dan 100 kilowatt
      wordt ten minste eenmaal per vier jaar gekeurd op veilig functioneren, optimale verbranding en energiezuinigheid.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel4.1
  - number: 4.1.3
    text: |-
      Een keuring als bedoeld in het eerste of tweede lid omvat mede de afstelling voor de verbranding, het systeem voor
      de toevoer van brandstof en verbrandingslucht en de afvoer van verbrandingsgassen.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel4.1
  - number: 4.1.4
    text: |-
      Een keuring als bedoeld in het eerste of tweede lid wordt verricht door een persoon die beschikt over een geldig
      certificaat dat is afgegeven door een instantie die door een accreditatie-instantie is geaccrediteerd teneinde
      uitvoering te kunnen geven aan de «Beoordelingrichtlijn voor het uitvoeren van onderhoud en inspecties aan
      stookinstallaties» van de Stichting Certificatie Inspectie en Onderhoud Stookinstallaties of door een persoon die
      beschikt over een bewijs dat aangeeft dat aan met die beoordelingsrichtlijn vergelijkbare eisen wordt voldaan.
      Degene die de inrichting drijft vraagt van degene die een keuring verricht een door hem opgesteld en ondertekend
      verslag van die keuring, waaruit ten minste blijkt wanneer en door wie de keuring is verricht en de resultaten van
      de keuring.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel4.1
  - number: 4.1.5
    text: |-
      Bij ministeriële regeling worden nadere voorschriften gegeven betreffende de in het vierde lid bedoelde
      beoordelingrichtlijn.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel4.1
  - number: 4.1.6
    text: |-
      Indien uit een keuring als bedoeld in het vierde lid blijkt dat de stookinstallatie onderhoud behoeft, vindt
      dat onderhoud binnen twee weken na de keuring plaats. Degene die de inrichting drijft vraagt van degene die het
      onderhoud verricht aan de stookinstallatie een door hem ondertekend bewijs waaruit blijkt wanneer, door wie en welk
      onderhoud is verricht.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel4.1
  - number: 5.1.1
    text: |-
      De resultaten van de laatstelijk uitgevoerde metingen en andere gegevens, die nodig zijn om te kunnen beoordelen
      of in overeenstemming met dit besluit wordt gehandeld, worden door degene die de inrichting drijft in de inrichting
      ter beschikking gehouden ten behoeve van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel5.1
  - number: 5.1.2
    text: |-
      Het laatstelijk verstrekte verslag van een keuring en het laatstelijk verstrekte bewijs van verricht onderhoud,
      bedoeld in [artikel 4.1, vierde en zevende lid][ref1], worden door degene die de inrichting drijft in de inrichting
      ter beschikking gehouden ten behoeve van het bevoegde gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0026884#Artikel4
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0026884
        artikel: '4'
        hoofdstuk: '4'
  - number: '6.1'
    text: |-
      Het [Besluit emissie-eisen stookinstallaties milieubeheer B][ref1] en het [Besluit emissie-eisen NO][ref2] worden
      ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0004833
      [ref2]: https://wetten.overheid.nl/BWBR0004174
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0004833
      - id: ref2
        bwb_id: BWBR0004174
  - number: 6.7.1
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel6.7
  - number: 6.7.2
    text: |-
      In afwijking van het eerste lid treedt [artikel 1.2, onderdeel b][ref1], in werking op het tijdstip waarop het
      bij koninklijke boodschap van 10 juni 2008 ingediende voorstel van wet tot wijziging van de Wet milieubeheer en
      diverse aanverwante wetten (verdere invulling van hoofdstuk 9) (Kamerstukken II 2007/2008, 31 501, nr. 2), nadat
      dat voorstel tot wet is verheven, in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0026884#Artikel1
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0026884
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '6.8'
    text: 'Dit besluit wordt aangehaald als: Besluit emissie-eisen middelgrote stookinstallaties milieubeheer.'
    url: https://wetten.overheid.nl/BWBR0026884/2011-04-28#Artikel6.8
