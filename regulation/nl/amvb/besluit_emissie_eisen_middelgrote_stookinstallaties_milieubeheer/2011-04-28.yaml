articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *accreditatie-instantie:* nationale
      accreditatie-instantie als bedoeld in artikel 4, eerste lid, van verordening (EG) nr. 765/2008 van het Europees
      Parlement en de Raad van de Europese Unie van 9 juli 2008 tot vaststelling van de eisen inzake accreditatie en
      marktoezicht betreffende het verhandelen van producten en tot intrekking van Verordening (EEG) nr. 339/93 (PbEU
      L 218);
        - *belangrijke wijziging:* wijziging van het thermisch vermogen van een stookinstallatie, die leidt tot een toename
      van de emissies van de in dit besluit bedoelde stoffen met meer dan 10%, alsmede elke andere wijziging die naar
      het oordeel van het bevoegd gezag aanzienlijke negatieve gevolgen voor de menselijke gezondheid of het milieu kan
      hebben;
        - *belasting:* deel van het thermische vermogen waarbij de stookinstallatie daadwerkelijk wordt bedreven;
        - *bestaande stookinstallatie:* stookinstallatie die voor het tijdstip van inwerkingtreding van dit besluit is
      geplaatst of in gebruik is genomen;
        - *brandstof:* vaste, vloeibare of gasvormige brandstof;
        - *gasmotorinstallatie:* zuigermotor waarin ten minste 50 procent van de brandstof, betrokken op de warmte-inhoud,
      in gasvorm aan de cilinders wordt gedoseerd en waarbij aan eventuele nageschakelde ketels of ketelinstallaties geen
      significante hoeveelheid extra lucht voor de verbranding wordt toegevoerd;
        - *gasturbine-installatie:* installatie, bestaande uit: a. een luchtcompressor, b. een of meer verbrandingskamers
      waarin brandstof met behulp van de door de compressor gecomprimeerde lucht wordt verstookt, en c. een
      turbine waarin het geproduceerde verbrandingsgas expandeert, waarbij aan eventuele nageschakelde ketels of
      ketelinstallaties geen significante hoeveelheid extra lucht voor de verbranding wordt toegevoerd;
        - *ISO-luchtcondities:* temperatuur van 288 Kelvin, een druk van 101,3 kiloPascal en een relatieve vochtigheid van
      60 procent;
        - *ketelinstallatie:* installatie, bestaande uit een ketel waarin brandstof wordt verstookt, welke verbranding in
      hoofdzaak is bedoeld om kracht op te wekken of om warmte over te dragen aan water of stoom dan wel een combinatie
      daarvan;
        - *Nm3:* volume van het rookgas, herleid naar een temperatuur van 273 Kelvin en een druk van 101,3 kiloPascal, na
      aftrek van het volume van het erin aanwezige water, berekend als waterdamp;
        - *rendement:* procentueel aandeel van de warmte-inhoud van de toegevoerde brandstof, dat bij de hoogste belasting
      waarbij de installatie continu kan worden bedreven, bij ISO-luchtcondities in arbeid wordt omgezet, zoals
      aangegeven door de fabrikant van de stookinstallatie;
        - *rookgas:* mengsel van gassen met vaste of vloeibare stoffen, dat bij het verbruik van brandstof vrijkomt en naar
      de buitenlucht wordt afgevoerd;
        - *stookinstallatie:* technische eenheid, bestaande uit een of meer vaste of verplaatsbare ketelinstallaties,
      gasturbine-, vloeistofmotor- of gasmotorinstallaties met inbegrip van voor het functioneren van de installatie
      noodzakelijke voorzieningen en vaste voorzieningen voor de reiniging van rookgassen;
        - *thermisch vermogen:* warmte-inhoud van de maximale hoeveelheid brandstof die per tijdseenheid kan worden
      toegevoerd naar een stookinstallatie;
        - *totaal stof:* vaste deeltjes, waarbij geen onderscheid wordt gemaakt naar de aërodynamische diameter van deze
      deeltjes;
        - *vergunning:* omgevingsvergunning voor een inrichting, voor zover deze betrekking heeft op een stookinstallatie;
        - *vloeistofmotorinstallatie:* zuigermotor waarin ten minste 50 procent van de brandstof, betrokken op de
      warmte-inhoud, in vloeibare vorm aan cilinders wordt gedoseerd en waarbij aan eventuele nageschakelde ketels of
      ketelinstallaties geen significante hoeveelheid extra lucht voor de verbranding wordt toegevoerd;
        - *warmte-inhoud van een hoeveelheid brandstof:* de op de onderste verbrandingswaarde betrokken hoeveelheid energie
      die bij de verbranding van die hoeveelheid brandstof vrijkomt;
        - *wet:* [Wet milieubeheer][ref1];
        - *zuigermotor:* installatie, bestaande uit een toestel waarin een door verbranding van brandstof verkregen
      gasmengsel een zuiger in beweging brengt, voor de aandrijving van een werktuig.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
