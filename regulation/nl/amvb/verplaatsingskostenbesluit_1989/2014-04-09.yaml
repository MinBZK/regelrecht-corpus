preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken van 11 juli 1989, nr. AB88/439/U47, directoraat-generaal
    Management en Personeelsbeleid, directie Arbeidsvoorwaarden, afdeling Financiële Arbeidsvoorwaarden Rijkspersoneel;

    Gelet op artikel 125, eerste lid, en artikel 134 van de Ambtenarenwet 1929 (Stb. 530);

    De Raad van State gehoord (advies van 18 augustus 1989 nr. W04.89.0411);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken van 26 september 1989, nr. AB87/74/5,
    directoraat-generaal Management en Personeelsbeleid, directie Arbeidsvoorwaarden, afdeling Financiële
    Arbeidsvoorwaarden Rijkspersoneel;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#ArtikelAanhef
articles:
  - number: '1.1'
    text: Naar de regels bij of krachtens dit besluit kan
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel1
  - number: 1.1.a
    text: |-
      een tegemoetkoming of vergoeding worden verleend ter zake van uitgaven, gedaan in verband met een verhuizing dan
      wel in verband met het reizen naar en van de plaats van tewerkstelling;
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel1
  - number: 1.1.b
    text: een voorziening worden getroffen voor het reizen naar en van de plaats van tewerkstelling.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel1
  - number: '1.2'
    text: |-
      Indien uit anderen hoofde reeds in enigerlei vorm aanspraak bestaat op een tegemoetkoming, vergoeding of
      voorziening voor de in het eerste lid bedoelde uitgaven, wordt de tegemoetkoming, vergoeding of voorziening
      krachtens dit besluit slechts verleend tot het bedrag, waarmee deze tegemoetkoming, vergoeding of voorziening de
      eerstbedoelde aanspraak overschrijdt.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel1
  - number: '1.3'
    text: 'Dit besluit is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel1
  - number: 1.3.a
    text: ministers;
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel1
  - number: 1.3.b
    text: |-
      hen die krachtens [Grondwet][ref1] of wet voor het leven zijn benoemd;


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 1.3.c
    text: commissarissen van de Koning;
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel1
  - number: 1.3.d
    text: burgemeesters;
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel1
  - number: 1.3.e
    text: de politie;
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel1
  - number: 1.3.f
    text: |-
      betrokkenen, bedoeld in [artikel 51 van het Rechtspositiebesluit WPO/WEC][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel51
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '51'
  - number: 1.3.g
    text: |-
      personeel van universiteiten, academische ziekenhuizen, organen voor postacademisch onderwijs, de Open universiteit
      en de Nederlandse organisatie voor wetenschappelijk onderzoek;
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel1
  - number: 1.3.h
    text: |-
      hen die ingevolge of krachtens het [Reglement Dienst Buitenlandse Zaken][ref1] aanspraak hebben op tegemoetkomingen
      ter zake van uitgaven als bedoeld in het eerste lid, of daarvoor tegemoetkomingen ontvangen op de voet van genoemd
      reglement.


      [ref1]: https://wetten.overheid.nl/BWBR0004052
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004052
  - number: '2.1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel2
  - number: 2.1.a
    text: 'Onze Minister: het hoofd van het betrokken ministerie;'
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel2
  - number: 2.1.b
    text: 'betrokkene:'
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel2
  - number: 2.1.b.1e
    text: |-
      hij, die in burgerlijke dienst is of is geweest van het Rijk of eenvan zijn diensten, bedrijven of instellingen
      krachtens een aanstelling;
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel2
  - number: 2.1.b.2e
    text: |-
      hij, die door Onze Minister als zodanig is aangemerkt in verband met werkzaamheden, die hij in het belang van het
      Rijk of een van zijn diensten, bedrijven of instellingen verricht of heeft verricht;
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel2
  - number: 2.1.c
    text: 'woonplaats: de gemeente of het bij name genoemde deel daarvan, waar de betrokkene metterwoon is gevestigd;'
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel2
  - number: 2.1.d
    text: |-
      plaats van tewerkstelling: de gebruikelijke ingang van het gebouw, gebouwencomplex, terrein of vaartuig waar de
      betrokkene gewoonlijk zijn werkzaamheden verricht, dan wel, indien de uitoefening van het ambt zich uitstrekt over
      een ambtsgebied, de door het bevoegde gezag aangewezen plaats;
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel2
  - number: 2.1.e
    text: |-
      standplaats: de gemeente of het bij name genoemde deel van die gemeente, waar de plaats van tewerkstelling van
      de betrokkene is gelegen, dan wel indien de plaats van tewerkstelling een vaartuig is, de door het bevoegde gezag
      aangewezen plaats;
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel2
  - number: 2.1.f
    text: |-
      gezinsleden: de echtgenoot of levenspartner of geregistreerde partner van de betrokkene en de kinderen, stief- en
      pleegkinderen van hemzelf en/of van zijn echtgenoot of levenspartner of geregistreerde partner, voor zover zij met
      hem samenwonen;
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel2
  - number: 2.1.g
    text: |-
      eigen huishouding voeren: het zelfstandig bewonen van woonruimte, voorzien van eigen meubilair en stoffering, een
      en ander ter beoordeling van het bevoegde gezag;
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel2
  - number: 2.1.h
    text: |-
      berekeningsbasis: het twaalfvoud van de bezoldiging in de zin van het
      [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1], die betrokkene geniet op het berekeningstijdstip,
      vermeerderd met de aanspraak op de vakantie-uitkering en in voorkomende gevallen verhoogd met:


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: 2.1.h.a
    text: |-
      genoten wachtgeld of uitkering krachtens dan wel overeenkomstig het [Rijkswachtgeldbesluit 1959][ref1]
      en de [Uitkeringsregeling 1966][ref2], de [Werkloosheidswet][ref3] en het
      [Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Rijk][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0002326
      [ref2]: https://wetten.overheid.nl/BWBR0002537
      [ref3]: https://wetten.overheid.nl/BWBR0004045
      [ref4]: https://wetten.overheid.nl/BWBR0008114
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002326
      - id: ref2
        bwb_id: BWBR0002537
      - id: ref3
        bwb_id: BWBR0004045
      - id: ref4
        bwb_id: BWBR0008114
  - number: 2.1.h.b
    text: |-
      genoten uitkering krachtens dan wel overeenkomstig de Regeling uitkering wegens functioneel leeftijdsontslag of de
      Wet uitkering wegens vrijwillig vervroegd uittreden;
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel2
  - number: 2.1.h.c
    text: |-
      genoten herplaatsingstoelage als bedoeld in hoofdstuk 9 van het Pensioenreglement van de Stichting Pensioenfonds
      ABP.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel2
  - number: 2.1.i
    text: 'berekeningstijdstip:'
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel2
  - number: 2.1.i.1e
    text: de datum waarop de betrokkene verhuist;
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel2
  - number: 2.1.i.2e
    text: |-
      indien de betrokkene verhuist voor de datum dat de functie feitelijk wordt vervuld, de datum van ingang van de
      functievervulling;
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel2
  - number: 2.1.i.3e
    text: bij het overlijden of ontslag van de betrokkene, de datum waarop laatstelijk bezoldiging werd genoten;
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel2
  - number: 2.1.j
    text: |-
      verplaatsen en verplaatsing: veranderen onderscheidenlijk verandering van de standplaats van de betrokkene in
      opdracht van het bevoegde gezag;
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel2
  - number: 2.1.k
    text: |-
      voor het eerst in dienst treden: in dienst treden bij het Rijk of een van zijn diensten, bedrijven of instellingen,
      anders dan in geval van overgang binnen een maand:
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel2
  - number: 2.1.k.1e
    text: van de ene naar de andere tak van rijksdienst,
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel2
  - number: 2.1.k.2e
    text: van een andere overheidsdienst of een door het Rijk bekostigde onderwijsinstelling naar de rijksdienst;
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel2
  - number: 2.1.l
    text: |-
      dienstwoning: de door het bevoegde gezag aan de betrokkene in verband met de uitoefening van zijn functie
      aangewezen woning;
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel2
  - number: 2.1.m
    text: |-
      levenspartner: degene met wie de niet-gehuwde ambtenaar samenwoont en - met het oogmerk duurzaam samen te leven
        - een gemeenschappelijke huishouding voert op basis van een notarieel verleden samenlevingscontract bevattende
      de wederzijdse rechten en verplichtingen ter zake van die samenwoning en gemeenschappelijke huishouding;
      tegelijkertijd kan slechts één persoon als levenspartner worden aangemerkt; Onze Minister kan verlangen dat
      een schriftelijke verklaring van een notaris wordt overgelegd waaruit blijkt dat een samenlevingscontract als
      vorenbedoeld is gesloten.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel2
  - number: '2.2'
    text: 'Voor de toepassing van dit besluit wordt met de bezoldiging van de ambtenaar gelijkgesteld:'
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel2
  - number: 2.2.a)
    text: |-
      in het geval dat het [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1] niet op hem van toepassing is,
      hetgeen met de bezoldiging van de ambtenaar overeenkomt; en


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: 2.2.b)
    text: |-
      indien de ambtenaar recht heeft op een uitkering op grond van de [Ziektewet][ref1] of de
      [Wet werk en inkomen naar arbeidsvermogen][ref2], de bezoldiging zoals die zou zijn genoten indien
      geen sprake zou zijn geweest van recht op een uitkering op grond van de [Ziektewet][ref3] of de
      [Wet werk en inkomen naar arbeidsvermogen][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0019057
      [ref3]: https://wetten.overheid.nl/BWBR0001888
      [ref4]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0019057
      - id: ref3
        bwb_id: BWBR0001888
      - id: ref4
        bwb_id: BWBR0019057
  - number: '2.3'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel h, wordt, indien de betrokkene in
      het genot is van een toelage als bedoeld in de [artikelen 17][ref1], [18][ref2] en
      [18a van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref3], dit bezoldigingsdeel vastgesteld op het
      bedrag dat de betrokkene gedurende de drie kalendermaanden voorafgaande aan het berekeningstijdstip gemiddeld per
      maand aan deze toelagen heeft genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003630#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0003630#Artikel18a
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0003630
        artikel: '18'
      - id: ref3
        bwb_id: BWBR0003630
        artikel: 18a
  - number: '2.4'
    text: |-
      Voor de toepassing van dit besluit worden, behoudens voor de toepassing van [artikel 16][ref1], met Onze Minister
      gelijkgesteld: het tot aanstelling bevoegd gezag bij elk der beide Kamers der Staten-Generaal, de vice-president
      van de Raad van State, het College van de Algemene Rekenkamer, de Nationale ombudsman en de directeur van het
      Kabinet van de Koning.


      [ref1]: https://wetten.overheid.nl/BWBR0004630#Artikel16
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004630
        artikel: '16'
        hoofdstuk: V
  - number: '3.1'
    text: |-
      De betrokkene, die in verband met een verplaatsing of indiensttreding in opdracht van het bevoegde gezag is
      verhuisd en een woning in de standplaats heeft betrokken, wordt een tegemoetkoming in de verhuiskosten verleend.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel3
  - number: '3.2'
    text: |-
      De betrokkene, die in verband met een verplaatsing of indiensttreding in opdracht van het bevoegde gezag is
      verhuisd en een woning buiten de standplaats heeft betrokken, wordt een tegemoetkoming in de verhuiskosten
      verleend, indien het bevoegde gezag vooraf heeft vastgesteld dat met de verhuizing aan de opdracht om naar de
      nabijheid van de standplaats te verhuizen wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel3
  - number: '3.3'
    text: |-
      De betrokkene, die, zonder dat daartoe opdracht is verleend door het bevoegde gezag, in verband met een
      verplaatsing is verhuisd, wordt een tegemoetkoming in de verhuiskosten verleend, indien hij zich binnen een
      afstand van 25 kilometer van de standplaats heeft gevestigd en de afstand tussen de oude woning en de plaats van
      tewerkstelling ten minste 50 kilometer bedroeg.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel3
  - number: '3.4'
    text: |-
      De betrokkene, die in verband met een indiensttreding is verhuisd en aan wie binnen twee jaren na de verhuizing
      ontslag op verzoek wordt verleend of die ten gevolge van aan hem te wijten feiten of omstandigheden binnen
      twee jaren na de verhuizing wordt ontslagen, dient de hem op grond van het eerste of tweede lid toegekende
      tegemoetkoming in verhuiskosten terug te betalen. Overgang binnen een maand naar een andere functie binnen de
      rijksdienst wordt niet als een ontslag op verzoek beschouwd, tenzij de betrokkene als gevolg van die overgang
      opnieuw moet verhuizen met aanspraak op tegemoetkoming in verhuiskosten.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel3
  - number: '3.5'
    text: |-
      De tegemoetkoming in verhuiskosten wordt aan de betrokkene, die in verband met een indiensttreding dient te
      verhuizen, slechts verleend, indien hij schriftelijk heeft verklaard dat een verplichting tot terugbetalen als
      bedoeld in het vierde lid hem bekend is.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel3
  - number: '3.6'
    text: Het vierde en vijfde lid zijn van overeenkomstige toepassing op de betrokkene als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel3
  - number: '4.1'
    text: |-
      De betrokkene, die in opdracht van het bevoegde gezag, anders dan in verband met een verplaatsing of
      indiensttreding, een dienstwoning betrekt of verlaat, wordt een tegemoetkoming in verhuiskosten verleend.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel4
  - number: '4.2'
    text: |-
      Indien het verlaten van een dienstwoning samenhangt met een ontslag op verzoek anders dan een ontslag op verzoek
      met recht op uitkering voor vervroegd uittreden, of met een ontslag als gevolg van aan betrokkene te wijten
      feiten of omstandigheden en het ontslag niet ingaat binnen twee jaren nadat de dienstwoning is betrokken, kan een
      gedeeltelijke tegemoetkoming in verhuiskosten worden verleend.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel4
  - number: '4.3'
    text: |-
      Indien het verlaten van een dienstwoning verband houdt met het overlijden van de betrokkene, wordt een
      tegemoetkoming in verhuiskosten verleend aan de nagelaten gezinsleden.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel4
  - number: '5.1'
    text: |-
      Een tegemoetkoming in verhuiskosten kan slechts worden verleend bij een vrijwillige verandering van de woonplaats
      binnen Nederland, verband houdende met:
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel5
  - number: 5.1.a
    text: |-
      een ontslag, ter zake waarvan de betrokkene recht heeft op dadelijk ingaand pensioen, dan wel op een uitkering
      ingevolge de Wet uitkering wegens vrijwillig vervroegd uittreden of de Regeling uitkering wegens functioneel
      leeftijdsontslag;
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel5
  - number: 5.1.b
    text: |-
      een ontslag, dat de betrokkene anders dan op eigen verzoek is verleend en niet het gevolg is van aan hem te wijten
      feiten of omstandigheden;
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel5
  - number: 5.1.c
    text: het overlijden van betrokkene.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel5
  - number: '5.2'
    text: |-
      Een tegemoetkoming als bedoeld in het eerste lid wordt slechts verleend, indien de betrokkene in een periode
      van minder dan tien jaar voorafgaande aan het beëindigen van het dienstverband is verhuisd ten gevolge van een
      verplaatsing en het bevoegde gezag een verhuizing van het gezin naar de oude woonomgeving noodzakelijk acht. Het
      bevoegde gezag wint daarbij een bedrijfsmaatschappelijk advies in.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel5
  - number: '6.1'
    text: |-
      De betrokkene aan wie tijdens zijn plaatsing buiten Nederland ontslag op verzoek wordt verleend met recht op
      een uitkering ingevolge de Wet uitkering wegens vrijwillig vervroegd uittreden dan wel die anders dan op eigen
      verzoek en niet wegens aan hem te wijten feiten of omstandigheden wordt ontslagen, wordt een tegemoetkoming in de
      verhuiskosten voor terugkeer naar Nederland verleend.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel6
  - number: '6.2'
    text: |-
      De betrokkene, aan wie tijdens zijn plaatsing buiten Nederland ontslag op verzoek wordt verleend, anders
      dan ontslag op verzoek als bedoeld in het eerste lid, of die niet op verzoek wordt ontslagen als gevolg van
      aan hem te wijten feiten of omstandigheden, wordt volgens nader door Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties te stellen regels een gedeeltelijke tegemoetkoming in verhuiskosten verleend voor terugkeer
      naar Nederland.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel6
  - number: '6.3'
    text: |-
      Indien de betrokkene tijdens zijn plaatsing buiten Nederland overlijdt, wordt een tegemoetkoming in verhuiskosten
      aan de nagelaten gezinsleden verleend voor terugkeer naar Nederland.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel6
  - number: '7'
    text: |-
      Geen tegemoetkoming in verhuiskosten ingevolge artikel 3, eerste, tweede of derde lid, of de artikelen 5 dan
      wel 6 wordt verleend, indien de verhuizing niet heeft plaatsgevonden binnen twee jaren nadat de verplichting tot
      verhuizen is opgelegd dan wel na de datum van het ontslag, het overlijden of de verplaatsing.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel7
  - number: '8.1'
    text: |-
      De tegemoetkoming in verhuiskosten, bedoeld in artikel 3, eerste, tweede en derde lid, alsmede in de artikelen 4, 5
      en 6 kan slechts bestaan uit:
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel8
  - number: 8.1.a
    text: |-
      Een bedrag voor de kosten van transport van de bagage en van de inboedel van de betrokkene en zijn gezinsleden naar
      de nieuwe woning, waaronder begrepen de kosten van het in- en uitpakken van breekbare zaken;
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel8
  - number: 8.1.b
    text: een bedrag voor dubbele woonkosten;
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel8
  - number: 8.1.c
    text: een bedrag voor alle andere direct uit de verhuizing voortvloeiende kosten.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel8
  - number: '8.2'
    text: |-
      Indien de betrokkene op de dag van de verhuizing een eigen huishouding voert, wordt het bedrag bedoeld in
      het eerste lid, onderdeel *c*, voor zover bij of krachtens dit artikel niet anders is bepaald, gesteld op een
      tegemoetkoming van 3% van de berekeningsbasis voor ieder woon- of slaapvertrek, tot een maximum van 4 van deze
      vertrekken, die de achtergelaten woning telt, met dien verstande dat het bedrag een nader door Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties vast te stellen bedrag niet mag overschrijden.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel8
  - number: '8.3'
    text: |-
      Indien het betreft een verhuizing van een gezin, waarin de echtgenoten of levenspartners beiden betrokkenen
      zijn in de zin van dit besluit en afzonderlijk de opdracht hebben om te verhuizen of zijn verplaatst, wordt de
      tegemoetkoming berekend over de gezamenlijke berekeningsbasis. Elk van de betrokkenen heeft in dit geval aanspraak
      op een evenredig deel van de in de vorige volzin bedoelde tegemoetkoming.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel8
  - number: '8.4'
    text: |-
      Indien het betreft een verhuizing als gevolg van een verplaatsing van de betrokkene naar of in een buiten Nederland
      gelegen gebied, wordt de berekeningsbasis mede vermeerderd met een eventueel bedrag wegens verblijf buiten
      Nederland, dat de betrokkene is of zal worden toegekend.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel8
  - number: '8.5'
    text: |-
      Indien de betrokkene geen eigen huishouding voert, wordt geen tegemoetkoming als bedoeld in het eerste lid,
      onderdeel *c*, verleend. Indien bijzondere omstandigheden daartoe aanleiding geven, kan voor deze kosten niettemin
      een tegemoetkoming worden verleend van 3% van de berekeningsbasis.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel8
  - number: '8.6'
    text: |-
      Indien aan de betrokkene door het bevoegde gezag tevoren is medegedeeld dat de verplaatsing van tijdelijke aard
      is, bestaat slechts aanspraak op de vergoeding van transportkosten van de bagage. Voorts kan, indien bijzondere
      omstandigheden daartoe aanleiding geven een tegemoetkoming, als bedoeld in het eerste lid, onderdeel *c*, worden
      verleend van 3% van de berekeningsbasis.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel8
  - number: '8.7'
    text: |-
      De betrokkene als bedoeld in artikel 3, die voor het eerst bij het Rijk of een van zijn diensten, bedrijven of
      instellingen in dienst treedt, kan slechts in aanmerking worden gebracht voor een tegemoetkoming in verhuiskosten
      gelijk aan de helft van de tegemoetkoming, die op grond van dit artikel zou zijn toegekend.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel8
  - number: '9.1'
    text: |-
      Bij een verplaatsing uit, naar en buiten Nederland kan de tegemoetkoming in verhuiskosten naast de in artikel 8,
      eerste lid, bedoelde bedragen slechts bestaan uit:
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel9
  - number: 9.1.a
    text: |-
      een bedrag voor de kosten verbonden aan het vervoer van betrokkene en zijn gezinsleden naar de nieuwe woning en
      zonodig voor de overnachtingskosten;
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel9
  - number: 9.1.b
    text: |-
      een bedrag voor de kosten van een of meer reizen van de betrokkene en van de gezinsleden, welke in het land van
      vertrek zijn gemaakt ter voldoening aan een oproep tot het vervullen van formaliteiten, vereist in verband met
      de reis.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel9
  - number: '9.2'
    text: |-
      Bij een verplaatsing als bedoeld in het eerste lid worden onder transportkosten als bedoeld in artikel 8, eerste
      lid, onderdeel *a*, mede verstaan:
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel9
  - number: 9.2.a
    text: een bedrag voor de verschuldigde belastingen bij invoer voor de bagage en de inboedel;
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel9
  - number: 9.2.b
    text: |-
      een bedrag voor de kosten van verzekering van de bagage en de inboedel tegen schade ten gevolge van of in verband
      met de verhuizing;
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel9
  - number: 9.2.c
    text: |-
      een bedrag voor de kosten van het inpakken van de gehele inboedel alsmede kosten van de- en montage van meubilair
      en afvoer van emballage;
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel9
  - number: 9.2.d
    text: |-
      voor zover geen emballage in natura wordt verstrekt, een bedrag voor de kosten van aanschaffing van emballage
      zulks echter slechts onder beding dat de emballage na de verhuizing desgevorderd ter beschikking van het Rijk wordt
      gesteld.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel9
  - number: '9.3'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan regels stellen ten aanzien van de berekening van de
      bedragen bedoeld in de vorige leden.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel9
  - number: '10'
    text: |-
      Indien bij een verplaatsing uit, naar en buiten Nederland de door Onze Minister vastgestelde regels niet toelaten,
      dat de betrokkene zijn gezinsleden op rijkskosten meeneemt, bestaat slechts aanspraak op vergoeding van:
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel10
  - number: 10.a
    text: transportkosten van de bagage van betrokkene zelf;
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel10
  - number: 10.b
    text: |-
      kosten bedoeld in artikel 9, eerste en tweede lid, voor zover deze betrekking hebben op de betrokkene zelf. Voorts
      kan, indien bijzondere omstandigheden daartoe aanleiding geven, een tegemoetkoming, als bedoeld in artikel 8,
      eerste lid, onderdeel *c*, worden verleend van 3% van de berekeningsbasis.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel10
  - number: '11'
    text: |-
      Bij een verplaatsing naar een land buiten Europa alsmede Kreta of IJsland en terug kan - indien de tewerkstelling
      aldaar naar verwachting tenminste een jaar zal duren - de tegemoetkoming in verhuiskosten mede bestaan uit een
      tegemoetkoming in de kosten van het transport over zee van een aan de betrokkene in eigendom behorende personenauto
      volgens nader door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties vast te stellen regels.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel11
  - number: '12.1'
    text: |-
      De betrokkene heeft aanspraak op vergoeding van de gemaakte kosten van het dagelijks reizen per openbaar vervoer
      tussen de woning en de plaats van tewerkstelling.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel12
  - number: '12.2'
    text: |-
      In plaats van de vergoeding, bedoeld in het eerste lid, kan het bevoegd gezag ook de noodzakelijke vervoerbewijzen
      verstrekken.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel12
  - number: '12.3'
    text: |-
      Geen aanspraak op een vergoeding of verstrekking als bedoeld in het eerste of tweede lid bestaat, indien in de
      desbetreffende maand een tegemoetkoming wordt genoten als bedoeld in [artikel 12a][ref1] of [12b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004630#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0004630#Artikel12b
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004630
        artikel: 12a
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004630
        artikel: 12b
        hoofdstuk: IV
  - number: 12a.1
    text: |-
      De betrokkene die naar het oordeel van het bevoegd gezag de plaats van tewerkstelling niet of niet doelmatig per
      openbaar vervoer kan bereiken, heeft aanspraak op een tegemoetkoming in de gemaakte reiskosten.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel12a
  - number: 12a.2
    text: |-
      Voor de toepassing van het eerste lid wordt als niet of niet doelmatig bereikbaar per openbaar vervoer in ieder
      geval beschouwd de situatie dat een van de volgende omstandigheden zich voordoet op een of meer voor betrokkene
      geldende werkdagen in de desbetreffende maand:
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel12a
  - number: 12a.2.a
    text: |-
      de afstand tussen de plaats van tewerkstelling en de dichtstbijzijnde halte van het openbaar vervoer bedraagt meer
      dan één kilometer;
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel12a
  - number: 12a.2.b
    text: |-
      het openbaar vervoer komt volgens de dienstregeling niet ten minste twee maal per uur binnen de onder a genoemde
      afstand van de plaats van tewerkstelling op de tijdstippen waarop de ambtenaar overeenkomstig de voor hem geldende
      werktijdregeling zijn werkzaamheden begint of beëindigt;
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel12a
  - number: 12a.2.c
    text: |-
      bij gebruik van het openbaar vervoer komt als gevolg van de ligging van de plaats van tewerkstelling de
      persoonlijke veiligheid van de ambtenaar in gevaar;
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel12a
  - number: 12a.2.d
    text: de bedrijfsarts is van oordeel dat om medische redenen geen gebruik kan worden gemaakt van het openbaar vervoer.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel12a
  - number: 12b.1
    text: |-
      De betrokkene die naar het oordeel van het bevoegd gezag de plaats van tewerkstelling met het openbaar vervoer
      kan bereiken, maar daarvan geen gebruik maakt, heeft aanspraak op een gedeelte van de tegemoetkoming, bedoeld in
      [artikel 12a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004630#Artikel12a
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0004630
        artikel: 12a
        hoofdstuk: IV
  - number: 12b.2
    text: |-
      In afwijking van het eerste lid heeft de betrokkene, die de gehele afstand tussen de woning en de plaats van
      tewerkstelling blijkens een schriftelijke verklaring op een of meer dagen per week per fiets aflegt, voor die dagen
      aanspraak op de volledige tegemoetkoming, bedoeld in [artikel 12a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004630#Artikel12a
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0004630
        artikel: 12a
        hoofdstuk: IV
  - number: 12b.3
    text: |-
      De betrokkene, bedoeld in het tweede lid, legt op de dagen, genoemd in de verklaring, de afstand tussen zijn woning
      en de plaats van tewerkstelling per fiets af, of, bij wijze van uitzondering, per openbaar vervoer.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel12b
  - number: 12b1.1
    text: |-
      De ambtenaar die na een wijziging van de plaats van tewerkstelling in verband met plaatsing of herplaatsing
      ten gevolge van een reorganisatie anders dan op eigen verzoek de nieuwe plaats van tewerkstelling doelmatig
      per openbaar vervoer kan bereiken, kan gedurende een jaar aanspraak maken op de tegemoetkoming, genoemd in
      [artikel 12a][ref1], als ware de nieuwe plaats van tewerkstelling niet of niet doelmatig bereikbaar per openbaar
      vervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0004630#Artikel12a
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel12b1
    references:
      - id: ref1
        bwb_id: BWBR0004630
        artikel: 12a
        hoofdstuk: IV
  - number: 12b1.2
    text: Aan de ambtenaar die
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel12b1
  - number: 12b1.2.a
    text: |-
      ten gevolge van een wijziging van de plaats van tewerkstelling in verband met plaatsing of herplaatsing ten gevolge
      van een reorganisatie anders dan op eigen verzoek meer reiskosten heeft voor woon-werkverkeer, en
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel12b1
  - number: 12b1.2.b
    text: de oude en de nieuwe plaats van tewerkstelling niet of niet doelmatig kan bereiken per openbaar vervoer,
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel12b1
  - number: 12b1.3
    text: |-
      Gedurende het tweede, derde en vierde jaar heeft de in het eerste of tweede lid bedoelde ambtenaar recht op
      respectievelijk 75%, 50% en 25% van het verschil met de reguliere tegemoetkoming op grond van respectievelijk
      [artikel 12b][ref1] en [artikel 12a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004630#Artikel12b
      [ref2]: https://wetten.overheid.nl/BWBR0004630#Artikel12a
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel12b1
    references:
      - id: ref1
        bwb_id: BWBR0004630
        artikel: 12b
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004630
        artikel: 12a
        hoofdstuk: IV
  - number: 12b1.4
    text: |-
      Voor de ambtenaar die de in het eerste of tweede lid bedoelde aanspraak heeft, en voor wie binnen twee jaar
      opnieuw de plaats van tewerkstelling wijzigt, wordt bij de berekening van de tegemoetkoming uitgegaan van de
      oorspronkelijke plaats van tewerkstelling. Indien de tweede wijziging van de plaats van tewerkstelling plaatsvindt
      gedurende het tweede jaar, wordt de termijn, genoemd in het eerste, tweede en derde lid, opnieuw gestart.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel12b1
  - number: 12ba.1
    text: |-
      De betrokkene die opdracht van het bevoegde gezag heeft gekregen naar of naar de nabijheid van de standplaats te
      verhuizen en daarin, ondanks alle pogingen daartoe, niet slaagt, heeft aanspraak op een voorziening voor, dan wel
      vergoeding van respectievelijk tegemoetkoming in de kosten voor het dagelijks reizen tussen de woning en de plaats
      van tewerkstelling als bedoeld in de artikelen 12, 12a en 12b, zolang hij bij de verhuizing in aanmerking zou
      kunnen komen voor een tegemoetkoming in de verhuiskosten.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel12ba
  - number: 12ba.2
    text: |-
      Een betrokkene, bedoeld in het eerste lid, die naar het oordeel van het bevoegde gezag niet dagelijks heen en weer
      kan reizen, heeft, tenzij van overheidswege al dan niet tegen betaling in huisvesting wordt voorzien, aanspraak
      op een tegemoetkoming in de pensionkosten voor verblijf in een pension in of nabij de standplaats, benevens een
      vergoeding voor ten hoogste één maal per week in de reiskosten voor gezinsbezoek, dan wel voor reiskosten naar de
      plaats waar hij feitelijk nog gevestigd is.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel12ba
  - number: 12ba.3
    text: |-
      De betrokkene, bedoeld in het tweede lid, heeft tevens aanspraak op een voorziening voor, dan wel vergoeding
      van respectievelijk tegemoetkoming in de kosten van het dagelijks reizen tussen het pension en de plaats van
      tewerkstelling als bedoeld in de artikelen 12, 12a en 12b.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel12ba
  - number: 12ba.4
    text: |-
      Indien de betrokkene, bedoeld in het eerste en tweede lid, naar het oordeel van het bevoegde gezag niet alles, wat
      redelijkerwijs van hem mag worden verwacht, heeft gedaan om zo spoedig mogelijk te verhuizen, komt hij niet langer
      in aanmerking voor de vergoeding, voorziening en tegemoetkomingen als bedoeld in het eerste respectievelijk tweede
      en derde lid.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel12ba
  - number: 12ba.5
    text: |-
      De betrokkene die een functie voor betrekkelijk korte duur bekleedt of voor betrekkelijk korte duur elders is
      geplaatst en als gevolg daarvan niet behoeft te verhuizen, kan een vergoeding, voorziening en tegemoetkomingen
      overeenkomstig het eerste respectievelijk tweede en derde lid worden verleend, indien de betrokkene naar het
      oordeel van het bevoegde gezag niet dagelijks heen en weer kan reizen.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel12ba
  - number: 12ba.6
    text: |-
      De betrokkene die in verband met een verplaatsing opdracht van het bevoegde gezag heeft gekregen om naar of naar
      de nabijheid van de toekomstige standplaats te verhuizen en die voor de datum van verplaatsing verhuist, heeft tot
      een maximumtermijn van drie maanden aanspraak op een vergoeding, voorziening en tegemoetkomingen als bedoeld in het
      eerste respectievelijk tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel12ba
  - number: 12bb
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt bij ministeriële regeling nadere regels vast ten
      aanzien van de vergoeding, voorziening en tegemoetkomingen als bedoeld in de artikelen 12, 12a, 12b en 12ba.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel12bb
  - number: 12c
    text: |-
      Onze Minister kan artikel [49n van het Algemeen Rijksambtenarenreglement][ref1] dan wel artikel
      [84n van het Ambtenarenreglement Staten-Generaal][ref2] geheel of gedeeltelijk van overeenkomstige toepassing
      verklaren op de betrokkene, die anders dan in het kader van een reorganisatie in een andere functie wordt
      herplaatst of geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49n
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel84n
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49n
      - id: ref2
        bwb_id: BWBR0003229
        artikel: 84n
  - number: '13.1'
    text: |-
      Aan de betrokkene, die met zijn gezin ten gevolge van een verplaatsing naar een buiten Nederland gelegen gebied
      is verhuisd of terugkeert van een plaatsing in een in het buitenland gelegen gebied en die, als gevolg van het
      ontbreken van passende woonruimte, dan wel het nog niet beschikbaar zijn van zijn inboedel, voor bijzondere
      financiële lasten komt te staan, kan deswege een tegemoetkoming worden verleend.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel13
  - number: '13.2'
    text: |-
      De in het eerste lid bedoelde tegemoetkoming kan ook worden verleend ingeval de betrokkene buiten Nederland blijft
      geplaatst, doch zijn gezin naar Nederland terugkeert.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel13
  - number: '14'
    text: |-
      Het bevoegde gezag kan ter zake van de in of krachtens dit besluit bedoelde tegemoetkomingen een voorschot
      verlenen.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel14
  - number: '15.1'
    text: |-
      Onze Minister kan voor zover nodig in afwijking van de bij of krachtens dit besluit gestelde regels beslissen in
      individuele gevallen, waarin deze regels naar zijn oordeel niet of niet naar redelijkheid voorzien.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel15
  - number: '15.2'
    text: |-
      Onze Minister is bevoegd om in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      ten behoeve van de betrokkene voor wie de plaats van tewerkstelling buiten Nederland is gelegen, bij ministeriële
      regeling regels vast te stellen, die afwijken van [artikel 12bb][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004630#Artikel12bb
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004630
        artikel: 12bb
        hoofdstuk: IV
  - number: '16'
    text: |-
      Van de bevoegdheid tot het stellen van regels met een sterk technisch karakter krachtens dit besluit, kunnen Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties en Onze Minister mandaat verlenen.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel16
  - number: '19'
    text: |-
      Dit besluit treedt in werking met ingang van de eerste kalendermaand na de datum van uitgifte van het *Staatsblad*
      waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel19
  - number: '20'
    text: Dit besluit kan worden aangehaald als het Verplaatsingskostenbesluit 1989.
    url: https://wetten.overheid.nl/BWBR0004630/2014-04-09#Artikel20
