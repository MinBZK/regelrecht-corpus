preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Ministers voor Algemeene Oorlogvoering van het Koninkrijk, van Algemeene Zaken,
    van Buitenlandsche Zaken, van Justitie, van Binnenlandsche Zaken, van Onderwijs, Kunsten en Wetenschappen,
    van Financiën, van Oorlog, van Marine, van Waterstaat, van Handel, Nijverheid en Scheepvaart, van Landbouw en
    Visscherij, van Sociale Zaken, van Koloniën en van Onze Ministers zonder Portefeuille van 10 December 1943, N°.
    2724/G. 92 (a);

    Overwegende, dat de veiligheid van den Staat het dringend noodzakelijk maakt bijzondere bepalingen vast te stellen
    betreffende de wijze van rechtspleging in zaken, waarvan de kennisneming aan de ingevolge het Besluit op de
    Bijzondere Gerechtshoven in te stellen gerechten behoort;

    Den Buitengewonen Raad van Advies gehoord;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Ten aanzien van de rechtspleging in zaken, waarvan krachtens het [Besluit op de Bijzondere Gerechtshoven][ref1] de
      kennisneming aan de dienvolgens in te stellen gerechten behoort, zijn - behoudens de afwijkingen, bij dit besluit
      voorzien - de bepalingen, vervat in [het Eerste Boek](onbekend), [den Eersten](onbekend) tot en met [den Zesden
      Titel](onbekend) van [het Tweede Boek](onbekend), den [Eersten](onbekend) en [den Derden](onbekend) tot en met [den
      Achtsten Titel](onbekend) van [het Derde Boek](onbekend) , [den Tweeden](onbekend) tot en met [den Vijfden Titel]
      (onbekend) van [het Vierde Boek](onbekend) en het [Vijfde Boek van het Wetboek van Strafvordering](onbekend),
      alsmede de tot uitvoering daarvan gestelde voorschriften van overeenkomstige toepassing, met dien verstande, dat

      1°. hetgeen daarin omtrent de rechtbank, derzelver voorzitter, de rechters, den rechter-commissaris, den officier
      van justitie en den griffier bij de rechtbank is bepaald, ten deze geldt voor het Bijzondere Gerechtshof, deszelfs
      voorzitter en leden, den raadsheer-commissaris, den procureur-fiscaal en den griffier bij dat Hof;

      2°. hetgeen daarin omtrent den Hoogen Raad, deszelfs voorzitter en leden, den procureur-generaal en den griffier
      bij den Hoogen Raad is bepaald, ten deze geldt voor den Bijzonderen Raad van Cassatie, deszelfs voorzitter en
      leden, den procureur-fiscaal en den griffier bij dien Bijzonderen Raad;

      3°. hetgeen daarin met betrekking tot de kantonrechter van de rechtbank of het gerechtshof en de leden der
      rechterlijke macht bij een dezer gerechten is bepaald, ten deze buiten toepassing blijft, voor zoover uit eenige
      bepaling van dit besluit niet het tegendeel volgt.


      [ref1]: https://wetten.overheid.nl/BWBR0002007
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002007
  - number: '2'
    text: |-
      1 Waar in dit besluit naar een of meer bepalingen van het [Wetboek van Strafvordering][ref1] bijzonderlijk wordt
      verwezen, heeft die verwijzing betrekking op de desbetreffende bepaling of bepalingen, gelezen met inachtneming van
      het in het voorgaande artikel onder 1°., 2°. en 3°. gestelde.

      2 In alle gevallen, waarin bij een toepasselijk verklaarde bepaling van het [Wetboek van Strafvordering][ref2]
      wordt verwezen naar een andere bepaling van dat Wetboek, waarvan bij dit besluit wordt afgeweken, zal op die
      afwijking mede acht worden geslagen bij de toepassing der verwijzende bepaling.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
      [ref2]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001903
      - id: ref2
        bwb_id: BWBR0001903
  - number: '3'
    text: |-
      1 Voor de toepassing van [artikel 2 van het Wetboek van Strafvordering][ref1] wordt onder het rechtsgebied, binnen
      hetwelk de verdachte zich bevindt, mede verstaan het rechtsgebied, binnen hetwelk hij zich onvrijwillig bevindt.

      2 Indien ingevolge de [artikelen 2][ref2] en [4 van het Wetboek van Strafvordering][ref3] niet een bevoegde rechter
      is aangewezen, is, in afwijking van het in [artikel 5 van dat Wetboek][ref4] bepaalde, bevoegd het Bijzondere
      Gerechtshof, bij hetwelk de vervolging het eerst wordt aangevangen. Dit Bijzondere Gerechtshof blijft uitsluitend
      bevoegd, ook indien na den aanvang der vervolging een Bijzonder Gerechtshof wordt ingesteld, dat volgens een der
      beide eerstgemelde artikelen bevoegd ware.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel5
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel3
