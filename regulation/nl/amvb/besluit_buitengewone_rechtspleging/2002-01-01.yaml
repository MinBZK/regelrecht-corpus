        artikel: '5'
  - number: '4'
    text: |-
      De berichten, in [artikel 11, eerste lid, van het Wetboek van Strafvordering][ref1] bedoeld, worden door den
      procureur-fiscaal aan Onzen Minister van Justitie gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel11
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '11'
  - number: '5'
    text: |-
      1 Een beklag, als in [artikel 12, eerste lid, van het Wetboek van Strafvordering][ref1] bedoeld, kan worden gedaan
      bij het Bijzondere Gerechtshof, bij hetwelk de vervolging zal behooren plaats te vinden. Indien in het geval, in
      [artikel 3][ref2] van dit besluit vermeld, een vervolging nog niet is aangevangen, kan het beklag worden gedaan
      bij het Bijzondere Gerechtshof, door den voorzitter van den Bijzonderen Raad van Cassatie op verzoek van den
      belanghebbende daarvoor aan te wijzen.

      2 Het in den tweeden zin van het eerste lid en in het tweede en derde lid van
      [artikel 12 van het Wetboek van Strafvordering][ref3] ten aanzien van het gerechtshof, deszelfs leden en den
      procureur-generaal bepaalde is voor het Bijzondere Gerechtshof, deszelfs leden en den procureur-fiscaal bij dat Hof
      van overeenkomstige toepassing.

      3 Het beklag wordt niet in behandeling genomen vóór een nader door Ons te bepalen datum, tenzij het Bijzondere
      Gerechtshof van oordeel is, dat er dringende redenen zijn om het beklag aanstonds in behandeling te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel12
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0002008
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '12'
  - number: '6'
    text: |-
      In afwijking in zooverre van het bepaalde in [artikel 20, eerste lid, van het Wetboek van Strafvordering][ref1]
      staat tegen eenige beschikking omtrent de schorsing den verdachte alleen dan beroep in cassatie open, indien hem
      daartoe door het Bijzondere Gerechtshof verlof is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel20
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '20'
  - number: '7'
    text: |-
      In afwijking van het bepaalde in [artikel 21, tweede lid, van het Wetboek van Strafvordering][ref1] is de raadkamer
      samengesteld:

      bij de Bijzondere Gerechtshoven uit twee rechtsgeleerde leden en één militair lid;

      bij den Bijzonderen Raad van Cassatie uit vijf leden, waaronder ten minste één en ten hoogste twee militaire leden,
      met dien verstande, dat, indien er twee militaire leden zijn, zooveel mogelijk één hunner tot de zeemacht en één
      tot de landmacht zal behooren.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel21
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '21'
  - number: '8'
    text: |-
      1 Waar in het [Wetboek van Strafvordering][ref1] van advocaten wordt gesproken, worden daarmede, behalve voor
      zoover de behandeling van zaken bij den Bijzonderen Raad van Cassatie betreft, gelijkgesteld officieren der zee-
      of landmacht.

      2 De presidenten en vice-presidenten van, de raadsheeren in, alsmede de leden van het openbaar ministerie bij een
      Bijzonder Gerechtshof of den Bijzonderen Raad van Cassatie zijn niet bevoegd bij een dezer colleges als raadsman of
      advocaat op te treden. De griffiers en substituut-griffiers bij een dezer colleges zijn niet bevoegd als raadsman
      of advocaat op te treden bij hetzelfde college, waarbij zij zijn aangesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '9'
    text: |-
      De kennisgeving, bedoeld in [artikel 39, eerste lid, van het Wetboek van Strafvordering][ref1], geschiedt, wanneer
      de procureur-fiscaal nog niet in de zaak is betrokken, aan den in de zaak betrokken officier of hulpofficier van
      justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel39
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '39'
  - number: '10'
    text: |-
      1 Voor de toepassing van [artikel 40, eerste lid, van het Wetboek van Strafvordering][ref1] wordt met voorloopige
      hechtenis elke andere wijze van verzekerde bewaring gelijkgesteld. De voorzitter van den Bijzonderen Raad van
      Cassatie voegt voorts in elke zaak, welke voor dien Raad moet dienen, aan iederen verdachte een raadsman toe,
      zoodra de dag der terechtzitting wordt bepaald.

      2 In afwijking in zooverre van het bepaalde in [artikel 41 van het Wetboek van Strafvordering][ref2] wordt buiten
      de gevallen, in het voorgaande lid bedoeld, aan iederen verdachte, wiens onvermogen voldoende gestaafdwordt
      geoordeeld, op zijn verzoek door den voorzitter van het college, waarvoor de zaak moet dienen, een raadsman
      toegevoegd.

      3 Toevoeging van een officier, die niet een graad of hoedanigheid bezit, als in
      [artikel 4, tweede lid, van het Besluit op de Bijzondere Gerechtshoven][ref3] bedoeld, zal alleen dan geschieden,
      indien een andere raadsman niet beschikbaar is, tenzij de verdachte militair is en uitdrukkelijk den wensch te
      kennen geeft, dat hem een officier als raadsman worde toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0002007#Artikel4
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '40'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '41'
      - id: ref3
        bwb_id: BWBR0002007
        artikel: '4'
  - number: '11'
    text: |-
      De toegevoegde raadsman heeft terzake van zijn verrichtingen recht op een toelage uit 's Rijks kas volgens door Ons
      bij algemeenen maatregel van bestuur te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel11
  - number: '12'
    text: |-
      1 De officier van justitie heeft gelijke bevoegdheden en verplichtingen als bij de bepalingen van den Vierden Titel
      van het [Eerste Boek van het Wetboek van Strafvordering](onbekend) aan den hulpofficier van justitie zijn toegekend
      en opgelegd.

      2 In de gevallen, waarin bij die bepalingen aan den hulpofficier een bevoegdheid is toegekend, omdat het optreden
      van den procureur-fiscaal niet kan worden afgewacht, wordt deze bevoegdheid uitgeoefend door den officier van
      justitie en door een hulpofficier alleen dan, als ook het optreden van den officier van justitie niet kan worden
      afgewacht.

      3 Waar bij de voormelde bepalingen eenige kennisgeving aan den procureur-fiscaal bij het Bijzondere Gerechtshof
      is voorgeschreven, wordt deze kennisgeving, indien zij door een anderen opsporingsambtenaar dan den officier van
      justitie moet geschieden, door diens tusschenkomst gedaan, tenzij de procureur-fiscaal daaromtrent afwijkende
      instructies mocht geven.
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel12
  - number: '13'
    text: |-
      Ten aanzien van de verlenging van het bevel tot inverzekeringstelling, bedoeld in
      [artikel 58, tweede lid, van het Wetboek van Strafvordering][ref1], komt aan den officier van justitie gelijke
      bevoegdheid toe als aan den procureur-fiscaal bij het Bijzondere Gerechtshof.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel58
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '58'
  - number: '14'
    text: |-
      1 Iedere officier en onderofficier der zee- of landmacht is bevoegd en verplicht om aan een militair, die van
      minderen rang dan hijzelf is, het arrest aan te zeggen, zoodra hem bekend is of door hem op waarschijnlijke gronden
      wordt vermoed, dat de mindere in rang zich schuldig heeft gemaakt aan een misdrijf, waarop de bepalingen van het
      [Besluit Buitengewoon Strafrecht][ref1] van toepassing zijn.

      2 Van het gepleegde feit en het eventueel opgelegde arrest zal terstond worden gerapporteerd aan den
      commandeerenden officier, onder wien de verdachte ressorteert.

      3 De commandeerende officier zal daarop de zaak summier onderzoeken en bepalen, of de verdachte al dan niet
      aanvankelijk in arrest zal worden gesteld of gehouden.

      4 Indien de commandeerende officier bepaalt, dat de verdachte in arrest zal worden gesteld of gehouden, geeft hij,
      indien de berechting van het misdrijf niet tot de bevoegdheid van den militairen rechter behoort, daarvan terstond
      schriftelijk of mondeling kennis aan den procureur-fiscaal bij het Bijzonder Gerechtshof en doet hij den verdachte
      onmiddellijk voor dezen geleiden.


      [ref1]: https://wetten.overheid.nl/BWBR0002006
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002006
  - number: '15'
    text: |-
      Een bevel tot voorloopige hechtenis kan op de gronden, in
      [artikel 64, eerste lid, van het Wetboek van Strafvordering][ref1] vermeld, worden verleend in geval van eenig
      misdrijf, waarop de bepalingen van het [Besluit Buitengewoon Strafrecht][ref2] van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0002006
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '64'
      - id: ref2
        bwb_id: BWBR0002006
  - number: '16'
    text: |-
      In geval van eenig misdrijf, als in het voorgaande artikel bedoeld, zijn de opsporingsambtenaren te allen tijde
      bevoegd de uitlevering te vorderen van alle voor inbeslagneming vatbare voorwerpen.
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel16
  - number: '17'
    text: |-
      Een bevel, als bedoeld in [artikel 100, eerste lid, van het Wetboek van Strafvordering][ref1], kan, indien ook het
      optreden van den procureur-fiscaal niet kan worden afgewacht, bij voorraad worden verleend door den officier van
      justitie, onder verplichting om daarvan onverwijld schriftelijk aan den procureur-fiscaal kennis te geven, door
      wien alsdan, zoolang de raadsheer-commissaris nog niet is opgetreden, de bemoeiingen van den officier van justitie,
      bij de [artikelen 100-102 van dat Wetboek][ref2] vermeld, zoo spoedig mogelijk worden overgenomen en voortgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel100
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel100
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '100'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '100'
  - number: '18'
    text: |-
      In afwijking van het bepaalde in [artikel 112, derde lid, van het Wetboek van Strafvordering][ref1] kan de
      raadsheer-commissaris een huiszoeking buiten het rechtsgebied van het Bijzondere Gerechtshof, waartoe hij behoort,
      hetzij zelf doen, hetzij overdragen aan den raadsheer-commissaris bij het Bijzondere Gerechtshof, binnen welks
      rechtsgebied zij moet plaats hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel112
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '112'
  - number: '19'
    text: |-
      Voor de overeenkomstige toepassing van [artikel 120, eerste lid, van het Wetboek van Strafvordering][ref1] geldt
      mede het daarin omtrent den kantonrechter bepaalde en wordt met een algemeenen last van den procureur-fiscaal bij
      het Bijzondere Gerechtshof gelijkgesteld een algemeene last, door den procureur-generaal bij het gerechtshof of
      door den officier van justitie gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel120
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '120'
  - number: '20'
    text: |-
      Onverminderd het bepaalde in [artikel 129 van het Wetboek van Strafvordering][ref1], wordt, waar in eenige bepaling
      van dit besluit of in eenige krachtens dit besluit toepasselijke bepaling van dat Wetboek van misdrijf in het
      algemeen of van eenig misdrijf in het bijzonder wordt gesproken, samenspanning tot dat misdrijf daaronder begrepen,
      voor zoover dit met de strekking dier bepaling niet onvereenigbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel129
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '129'
  - number: '21'
    text: |-
      Met de opsporing der strafbare feiten, waarop de bepalingen van het [Besluit Buitengewoon Strafrecht][ref1] van
      toepassing zijn, zijn behalve de procureurs-fiscaal bij de Bijzondere Gerechtshoven, belast zoowel de officieren
      van justitie als de overige in [artikel 141 van het Wetboek van Strafvordering][ref2] vermelde ambtenaren, de
      kantonrechters daaronder begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0002006
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002006
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '22'
    text: |-
      1 Door of vanwege Onzen Minister van Justitie kan ook aan andere dan de in het voorgaande artikel
      bedoelde personen de opsporing der daar genoemde feiten worden opgedragen en kan, in afwijking van het in
      [artikel 146, eerste lid, van het Wetboek van Strafvordering][ref1] bepaalde, de bevoegdheid van personen, belast
      met de opsporing dier feiten, worden uitgebreid buiten het grondgebied, waarvoor zij zijn aangesteld. Insgelijks
      kunnen met betrekking tot de opsporing dier feiten andere dan de in [artikel 154][ref2] van dat Wetboek vermelde
      personen door of vanwege Onzen genoemden Minister met hulpofficieren van justitie worden gelijkgesteld.

      2 Tenzij Onze Minister van Justitie anders mocht bepalen, is de procureur-fiscaal bij het Bijzondere Gerechtshof
      gemachtigd tot eenige beschikking, als in het voorgaande lid bedoeld, voor zoover betreft de opsporing binnen zijn
      ressort door een of meer bepaalde, in de beschikking met name te noemen personen.

      3 De beschikkingen, in dit artikel bedoeld, kunnen te allen tijde worden ingetrokken, hetzij door Onzen Minister
      van Justitie, hetzij door dengeen, door wien zij van zijnentwege zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel146
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel154
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '146'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '154'
  - number: '23'
    text: |-
      De opsporingsambtenaren hebben te allen tijde vrijen toegang tot alle plaatsen, waar redelijkerwijs vermoed kan
      worden, dat een misdrijf, waarop de bepalingen van het [Besluit Buitengewoon Strafrecht][ref1] van toepassing
      zijn, wordt begaan. De artikelen [120][ref2]-[123][ref3] van het [Wetboek van Strafvordering][ref4] zijn, met
      inachtneming van het bepaalde in [artikel 19][ref5] van dit besluit van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002006
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel120
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel123
      [ref4]: https://wetten.overheid.nl/BWBR0001903
      [ref5]: https://wetten.overheid.nl/BWBR0002008#Artikel19
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002006
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '120'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '123'
      - id: ref4
        bwb_id: BWBR0001903
      - id: ref5
        bwb_id: BWBR0002008
        artikel: '19'
  - number: '24'
    text: |-
      De bevelen, in [artikel 148, tweede lid, van het Wetboek van Strafvordering][ref1] bedoeld, kunnen, behalve
      door den procureur-fiscaal bij het Bijzondere Gerechtshof, ook door den officier van justitie aan de onder
      dezen ressorteerende opsporingsambtenaren worden gegeven, mits die bevelen niet in strijd zijn met bevelen of
      instructies, door den procureur-fiscaal hetzij aan den officier van justitie, hetzij aan de genoemde ambtenaren
      gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel148
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '148'
  - number: '25'
    text: |-
      De officier van justitie heeft gelijke verplichtingen en bevoegdheden als bij de [artikelen 152][ref1],
      [153][ref2], [155][ref3], [156][ref4] en [158 van het Wetboek van Strafvordering][ref5] aan de hulpofficieren van
      justitie zijn opgelegd en toegekend. Het bepaalde in [artikel 12, tweede en derde lid][ref6], van dit besluit is te
      dien aanzien van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel152
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel153
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel155
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel156
      [ref5]: https://wetten.overheid.nl/BWBR0001903#Artikel158
      [ref6]: https://wetten.overheid.nl/BWBR0002008#Artikel12
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '152'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '153'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '155'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '156'
      - id: ref5
        bwb_id: BWBR0001903
        artikel: '158'
      - id: ref6
        bwb_id: BWBR0002008
        artikel: '12'
  - number: '26'
    text: |-
      1 In afwijking in zooverre van het bepaalde in [artikel 160 van het Wetboek van Strafvordering][ref1] is ieder,
      die kennis draagt van eenig misdrijf, waarop de bepalingen van het [Besluit Buitengewoon Strafrecht][ref2] van
      toepassing zijn, verplicht daarvan onverwijld aangifte te doen bij een opsporingsambtenaar.

      2 Door de in [artikel 162][ref3] van dat Wetboek bedoelde colleges en ambtenaren wordt de aangifte hetzij aan den
      procureur-fiscaal, hetzij aan den officier van justitie of een zijner hulpofficieren gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel160
      [ref2]: https://wetten.overheid.nl/BWBR0002006
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel162
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '160'
      - id: ref2
        bwb_id: BWBR0002006
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '162'
  - number: '27'
    text: |-
      In afwijking van [artikel 59 van de Wet op de rechterlijke organisatie][ref1] (*Stb.*
      1972, 463) worden de raadsheren-commissarissen door de president van het Bijzondere
      Gerechtshof uit de rechtsgeleerde leden van zijn college benoemd. Het bepaalde in
      [artikel 11, tweede en derde lid, van het Besluit op de Bijzondere Gerechtshoven][ref2] is daarbij van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0002007#Artikel11
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '59'
      - id: ref2
        bwb_id: BWBR0002007
        artikel: '11'
  - number: '28'
    text: |-
      Opdrachten en bevelen, als in [artikel 177, eerste lid, van het Wetboek van Strafvordering][ref1] bedoeld, kunnen
      door den raadsheer-commissaris ook aan den officier van justitie worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel177
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '177'
  - number: '29'
    text: |-
      1 In afwijking van het bepaalde in de [artikelen 194][ref1] en
      [201, tweede lid, van het Wetboek van Strafvordering][ref2] is in de gevallen, waarin de daar bedoelde handelingen
      moeten geschieden buiten het rechtsgebied van het Bijzondere Gerechtshof, het bepaalde in [artikel 18][ref3] van
      dit besluit van overeenkomstige toepassing.

      2 In het in [artikel 223, derde lid][ref4], van dat Wetboek bedoelde geval staat den getuige met inachtneming
      overigens der daar gestelde bepalingen tegen de beschikking van het Bijzondere Gerechtshof beroep in cassatie open.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel194
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel201
      [ref3]: https://wetten.overheid.nl/BWBR0002008#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel223
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '194'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '201'
      - id: ref3
        bwb_id: BWBR0002008
        artikel: '18'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '223'
  - number: '30'
    text: |-
      Indien het instellen of voortzetten der vervolging ingevolge [artikel 5][ref1] van dit besluit door het Bijzondere
      Gerechtshof is bevolen, vindt de mededeeling, in [artikel 237, eerste lid, van het Wetboek van Strafvordering][ref2]
      genoemd, of eene kennisgeving van niet verdere vervolging, waaraan een zoodanige mededeeling niet is voorafgegaan,
      niet plaats, dan nadat het Bijzondere Gerechtshof daarin heeft bewilligd.


      [ref1]: https://wetten.overheid.nl/BWBR0002008#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel237
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002008
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '237'
  - number: '31'
    text: |-
      1 In afwijking van het bepaalde in de [artikelen 250][ref1] en [262 van het Wetboek van Strafvordering][ref2] is
      noch tegen de kennisgeving van verdere vervolging, noch tegen de dagvaarding een bezwaarschrift toegelaten.

      2 Het bepaalde in [artikel 255][ref3] van dat Wetboek is niet van toepassing met betrekking tot een vervolging
      van een strafbaar feit, waarop de bepalingen van het [Besluit Buitengewoon Strafrecht][ref4] van toepassing zijn,
      indien de vervolging niet heeft plaats gehad bij een Bijzonder Gerechtshof of een Nederlandschen rechter buiten het
      Rijk in Europa.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel250
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel262
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel255
      [ref4]: https://wetten.overheid.nl/BWBR0002006
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '250'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '262'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '255'
      - id: ref4
        bwb_id: BWBR0002006
  - number: 31a
    text: |-
      In afwijking van het bepaalde in [artikel 263 van het Wetboek van Strafvordering][ref1] moeten de getuigen en
      deskundigen steeds ten minste vier dagen vóór de terechtzitting ten parkette worden opgegeven en kan de procureur-
      fiscaal hun dagvaarding achterwege laten, zoolang niet ten genoegen van den procureur-fiscaal bij dezen een
      voldoend bedrag is gestort ter nadere verrekening met de aan hen uit te betalen vergoedingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel263
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '263'
  - number: 31b
    text: |-
      In afwijking van het bepaalde in [artikel 282 van het Wetboek van Strafvordering][ref1] kan van het verhoor van
      een op de lijst voorkomenden getuige, die niet is verschenen, ook zonder toestemming van den procureur-fiscaal,
      onderscheidenlijk den verdachte worden afgezien, indien redelijkerwijze moet worden aangenomen, dat hierdoor de
      procureur-fiscaal niet in zijn vervolging of de verdachte niet in zijn verdediging wordt benadeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel282
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel31b
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '282'
  - number: '32'
    text: |-
      In afwijking van het bepaalde in [artikel 293, vierde en vijfde lid, van het Wetboek van Strafvordering][ref1],
      doet het Bijzondere Gerechtshof in het daar bedoelde geval, zonder een gerechtelijk vooronderzoek te kunnen
      bevelen, het proces-verbaal onverwijld toekomen aan het bevoegde openbaar ministerie.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel293
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '293'
  - number: 32a
    text: |-
      In afwijking van het bepaalde in [artikel 314][ref1], laatste lid, van het [Wetboek van Strafvordering][ref2] kan
      ook zonder toestemming van den verdachte het onderzoek aanstonds worden voortgezet, indien redelijkerwijze moet
      worden aangenomen, dat de verdachte door onmiddellijke voortzetting van het onderzoek in verband met de wijziging
      der telastlegging in zijn verdediging niet wordt benadeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel314
      [ref2]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '314'
      - id: ref2
        bwb_id: BWBR0001903
  - number: 32b
    text: |-
      In afwijking van het bepaalde in [artikel 319][ref1], laatste lid, van het [Wetboek van Strafvordering][ref2]
      kunnen ook zonder toestemming van den verdachte bepaalde getuigen, deskundigen en tolken worden aangewezen,
      wier tegenwoordigheid bij de nadere behandeling niet meer wordt vereischt, indien redelijkerwijze moet worden
      aangenomen, dat de verdachte hierdoor in zijn verdediging niet wordt benadeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel319
      [ref2]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '319'
      - id: ref2
        bwb_id: BWBR0001903
  - number: '33'
    text: |-
      Al hetgeen in de tweede afdeeling van den Zesden Titel van het [Tweede Boek van het Wetboek van Strafvordering]
      (onbekend) en elders in dat Wetboek met betrekking tot de beleedigde partij is bepaald, blijft buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel33
  - number: '34'
    text: |-
      In afwijking van het bepaalde in [artikel 353, tweede lid][ref1], tweede zinsnede, van het
      [Wetboek van Strafvordering][ref2] gelast het Bijzondere Gerechtshof in de daar bedoelde gevallen de afgifte der
      voorwerpen aan den procureur-fiscaal, die met deze voorwerpen handelt volgens door Onzen Minister van Justitie te
      stellen regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel353
      [ref2]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '353'
      - id: ref2
        bwb_id: BWBR0001903
  - number: 34a
    text: |-
      1 Indien de zaak naar het oordeel van het Bijzondere Gerechtshof van eenvoudigen aard is, bepaaldelijk
      ook ten aanzien van het bewijs en de toepassing der wet, kan het Bijzondere Gerechtshof op het ingevolge
      [artikel 345 van het Wetboek van Strafvordering][ref1] bepaalde tijdstip in plaats van een uitspraak bij monde
      van den voorzitter of een der raden een mondelinge sententie wijzen, tenzij vóór de sluiting van het onderzoek ter
      terechtzitting de procureur-fiscaal vordert of de verdachte verzoekt, dat een schriftelijke sententie zal worden
      gewezen.

      2 De mondelinge sententie wordt in het proces-verbaal der terechtzitting, waarop de sententie wordt gewezen,
      aangeteekend op de wijze, door Onzen Minister van Justitie te bepalen.

      3 Zoodra het proces-verbaal der terechtzitting, waarin de sententie is aangeteekend, is geteekend, kunnen de
      verdachte en zijn raadsman daarvan en van het proces-verbaal van het onderzoek kennis nemen.

      4 [Artikel 381 van het Wetboek van Strafvordering][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel345
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel381
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '345'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '381'
  - number: '35'
    text: |-
      Het Bijzondere Gerechtshof kan aan den verdachte, die bij de einduitspraak niet van de geheele telastlegging is
      vrijgesproken, hetzij op diens verzoek, hetzij ambtshalve verlof verleenen om beroep in cassatie in te stellen.
      Indien het Bijzondere Gerechtshof dat verlof verleent, wordt van deze beslissing op de sententie of, indien een
      mondelinge sententie gewezen wordt, op het proces-verbaal der terechtzitting, waarin de sententie is aangeteekend,
      aanteekening gedaan.
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel35
  - number: '36'
    text: |-
      In afwijking in zooverre van het bepaalde in [artikel 402, eerste lid, van het Wetboek van Strafvordering][ref1]
      staat tegen de einduitspraak, waarbij het verzet vervallen is verklaard, den verdachte alleen dan beroep in
      cassatie open, indien hem daartoe door het Bijzondere Gerechtshof verlof is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel402
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '402'
  - number: '37'
    text: |-
      Onverminderd de bevoegdheid van het openbaar ministerie om tegen de sententiën der Bijzondere
      Gerechtshoven, als uitspraak gewezen, overeenkomstig het [Besluit op de Bijzondere Gerechtshoven][ref1],
      beroep in cassatie in te stellen, staat, in afwijking in zooverre van het bepaalde in
      [artikel 427, eerste lid, van het Wetboek van Strafvordering][ref2], aan den verdachte zoodanig beroep alleen open:

      1°. indien bij de sententie de doodstraf of gevangenisstraf van meer dan zes jaren is opgelegd;

      2°. indien de sententie is gewezen na verwijzing der zaak door den Bijzonderen Raad van Cassatie;

      3°. in het geval bedoeld in [artikel 434, derde lid, van het Wetboek van Strafvordering][ref3];

      4°. indien hem daartoe door het Bijzondere Gerechtshof, dat de sententie heeft gewezen, verlof is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002007
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel427
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel434
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002007
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '427'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '434'
  - number: 37a
    text: |-
      1 In afwijking van het bepaalde in [artikel 433, tweede lid, van het Wetboek van Strafvordering][ref1] is de
      verdachte, door of namens wien beroep in cassatie is ingesteld, uitsluitend bevoegd binnen twee maanden na den dag,
      waarop het beroep is ingesteld, een schriftuur, houdende zijn middelen van cassatie, bij den Bijzonderen Raad van
      Cassatie in te dienen.

      2 Artikel 439, tweede zin, van het [Wetboek van Strafvordering][ref2] blijft buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel433
      [ref2]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '433'
      - id: ref2
        bwb_id: BWBR0001903
  - number: '38'
    text: |-
      1 De verdachte kan ter terechtzitting van den Bijzonderen Raad van Cassatie omtrent zijn persoon en zijn
      persoonlijke omstandigheden worden gehoord.

      2 Te dien einde kan de Bijzondere Raad van Cassatie, indien de verdachte op den bepaalden rechtsdag niet ter
      terechtzitting aanwezig is, zoowel bij den aanvang als gedurende den loop van de behandeling der zaak bevelen,
      dat hij op een door den Raad te bepalen tijdstip ter terechtzitting aanwezig zal zijn en daartoe tevens zijne
      medebrenging gelasten.

      3 Het bepaalde in [artikel 310 van het Wetboek van Strafvordering][ref1] is ook voor de behandeling der zaak in
      cassatie van overeenkomstige toepassing, met dien verstande, dat hetgeen daar ten aanzien van de rechtbank en den
      officier van justitie is bepaald, ten deze geldt voor den Bijzonderen Raad van Cassatie en den procureur-fiscaal
      bij dien Raad.

      4 Indien de Bijzondere Raad van Cassatie een nader onderzoek naar de omstandigheden, waaronder het misdrijf is
      begaan, of naar den persoon of de persoonlijke omstandigheden van den verdachte noodzakelijk oordeelt, zijn de
      [artikelen 316][ref2] en [317 van het Wetboek van Strafvordering][ref3] van overeenkomstige toepassing, met dien
      verstande, dat hetgeen daar ten aanzien van de rechtbank, den officier van justitie en den rechter-commissaris
      is bepaald, ten deze geldt voor den Bijzonderen Raad van Cassatie, den procureur-generaal bij dien Raad en den
      raadsheer-commissaris bij het Bijzondere Gerechtshof dat in eersten aanleg uitspraak heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel310
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel316
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel317
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '310'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '316'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '317'
  - number: '39'
    text: |-
      Indien alleen door den verdachte beroep in cassatie is ingesteld, kan hij ter zake van hetgeen in eersten aanleg
      te zijnen aanzien bewezen is verklaard, slechts met eenparigheid van stemmen tot eene zwaardere straf worden
      veroordeeld dan hem bij de sententie van het Bijzondere Gerechtshof is opgelegd.
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel39
  - number: 39a
    text: |-
      1 Het beroep in cassatie wordt behandeld door een bijzondere kamer van den Bijzonderen Raad van Cassatie, indien,
      naar het aanvankelijk oordeel van den president, de zaak van eenvoudigen aard is.

      2 Indien de bijzondere kamer oordeelt, dat de zaak door een gewone kamer van den Bijzonderen Raad van Cassatie moet
      worden behandeld, verwijst zij de zaak daarheen.
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel39a
  - number: '40'
    text: |-
      In afwijking in zooverre van het bepaalde in [artikel 457 van het Wetboek van Strafvordering][ref1] is herziening
      op den in het eerste lid van dat artikel onder 1°. genoemden grond uitgesloten, indien een der daar bedoelde
      uitspraken van een ander gerecht dan een Bijzonder Gerechtshof of den Bijzonderen Raad van Cassatie afkomstig is.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel457
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '457'
  - number: '41'
    text: |-
      In afwijking in zooverre van het bepaalde in [artikel 458 van het Wetboek van Strafvordering][ref1] geschiedt de
      toevoeging van een raadsman aan den veroordeelde door den voorzitter van den Bijzonderen Raad van Cassatie.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel458
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '458'
  - number: '42'
    text: |-
      1 In afwijking in zooverre van het bepaalde in [artikel 461, eerste lid, van het Wetboek van Strafvordering][ref1]
      geschiedt zoowel in het daar, alsook in het in [artikel 465, tweede lid][ref2], van dat Wetboek bedoelde geval de
      verwijzing naar een Bijzonder Gerechtshof.

      2 Hetgeen bij [de artikelen 470][ref3], [473][ref4] en [474][ref5] van dat Wetboek, alsmede bij de artikelen,
      waarnaar daarin wordt verwezen, omtrent het gerechtshof, deszelfs voorzitter en den procureur-generaal bij het
      gerechtshof is bepaald, is ten aanzien van het Bijzondere Gerechtshof, deszelfs voorzitter en den procureur-fiscaal
      bij dat Hof van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel461
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel465
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel470
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel473
      [ref5]: https://wetten.overheid.nl/BWBR0001903#Artikel474
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '461'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '465'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '470'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '473'
      - id: ref5
        bwb_id: BWBR0001903
        artikel: '474'
  - number: 42a
    text: |-
      1 Het verzoek tot herziening wordt behandeld door een bijzondere kamer van den Bijzonderen Raad van Cassatie,
      indien naar het aanvankelijk oordeel van den president de zaak van eenvoudigen aard is.

      2 Indien de bijzondere kamer oordeelt, dat de zaak door een gewone kamer van den Bijzonderen Raad van Cassatie moet
      worden behandeld, verwijst zij de zaak daarheen.
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel42a
  - number: '43'
    text: |-
      Al hetgeen in den [Tweeden Titel van het Vierde Boek van het Wetboek van Strafvordering][ref1] met betrekking tot
      den kinderrechter is bepaald, blijft buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '44'
    text: |-
      In afwijking in zooverre van het bepaalde in [artikel 527, vierde lid][ref1], staat tegen de daar bedoelde
      beschikking den verdachte alleen dan beroep in cassatie open, indien hem daartoe door het Bijzondere Gerechtshof
      verlof is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel527
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '527'
  - number: 44a
    text: |-
      1 Bij elk Bijzonder Gerechtshof zijn één of meer raadsheeren belast met vereenvoudigde gerechtelijke afdoening
      van strafzaken.

      2 Zij worden uit de raadsheeren en raadsheeren-plaatsvervanger van het Bijzondere Gerechtshof voor den tijd van één
      jaar door Onzen Minister van Justitie, op voordracht van den president, aangewezen.
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel44a
  - number: 44b
    text: |-
      Indien naar het aanvankelijk oordeel van den procureur-fiscaal in een zaak als hoofdstraf gevangenisstraf van ten
      hoogste zes jaren, hechtenis of geldboete dient te worden opgelegd en de zaak naar zijn aanvankelijk oordeel voor
      vereenvoudigde gerechtelijke afdoening in aanmerking komt, stelt hij de stukken, al dan niet vergezeld van een
      schriftelijke vordering tot oplegging van een bepaalde straf, te dien einde in handen van den raadsheer.
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel44b
  - number: 44c
    text: |-
      1 Indien de raadsheer oordeelt, dat de zaak niet voor vereenvoudigde gerechtelijke afdoening in aanmerking komt,
      geeft hij daarvan kennis aan den procureur-fiscaal onder wederoverlegging der stukken.

      2 De raadsheer is bevoegd last tot invrijheidstelling van den verdachte te geven op de gronden, genoemd in
      [artikel 14 van het Besluit politieke delinquenten 1945][ref1]. [Artikel 15][ref2], tweede lid, van dat besluit is
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002015#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002015#Artikel15
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel44c
    references:
      - id: ref1
        bwb_id: BWBR0002015
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0002015
        artikel: '15'
  - number: 44d
    text: |-
      1 Indien de raadsheer op grond van de stukken en het verhoor van den verdachte de overtuiging heeft bekomen, dat
      deze een misdrijf, waarop de bepalingen van het [Besluit Buitengewoon Strafrecht][ref1] van toepassing zijn, heeft
      begaan en strafbaar is kan hij den verdachte deswege straf opleggen. De raadsheer is niet bevoegd tot oplegging van
      andere hoofdstraffen dan gevangenisstraf van ten hoogste zes jaren, hechtenis en geldboete.

      2 Indien de raadsheer niet de overtuiging heeft bekomen, dat de verdachte een bepaald feit, in de stukken vermeld,
      heeft begaan, kan hij hem ter zake van dat feit vrijspreken.

      3 Indien de raadsheer de overtuiging heeft bekomen, dat de verdachte een bepaald feit, in de stukken
      vermeld, heeft begaan, doch van oordeel is, dat dit niet is een misdrijf, waarop de bepalingen van het
      [Besluit Buitengewoon Strafrecht][ref2] van toepassing zijn, of dat de verdachte deswege niet strafbaar is, kan hij
      hem ter zake van dat feit van alle rechtsvervolging ontslaan.

      4 De raadsheer geeft de beslissingen, in dit artikel bedoeld, bij schriftelijke beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0002006
      [ref2]: https://wetten.overheid.nl/BWBR0002006
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel44d
    references:
      - id: ref1
        bwb_id: BWBR0002006
      - id: ref2
        bwb_id: BWBR0002006
  - number: 44e
    text: |-
      1 De raadsheer geeft de beschikking niet alvorens den verdachte te hebben gehoord. Hij doet den verdachte, die in
      verzekerde bewaring is, voor zich verschijnen. Indien de verdachte in vrijheid is, beveelt hij diens dagvaarding;
      indien de verdachte niet op de dagvaarding verschijnt, doet hij hem andermaal dagvaarden; hij kan daarbij diens
      medebrenging bevelen of zoodanig bevel later uitvaardigen.

      2 De president van het Bijzondere Gerechtshof voegt den verdachte, die geen raadsman heeft, uiterlijk den tienden
      dag vóór dien, waarop het verhoor zal plaats vinden, een raadsman toe. Van deze toevoeging benevens van den datum
      van het verhoor wordt onverwijld schriftelijk kennis gegeven aan den raadsman en aan den verdachte.

      3 De raadsheer stelt den verdachte en diens raadsman desverlangd in de gelegenheid van de stukken kennis te nemen.

      4 De procureur-fiscaal en de raadsman van den verdachte zijn bevoegd het verhoor bij te wonen. In dat geval worden
      zij in de gelegenheid gesteld het woord te voeren.
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel44e
  - number: 44f
    text: |-
      1 De beschikking behelst den naam van den raadsheer, den dag, waarop de beschikking is genomen, en voor zoover
      mogelijk naam en voornamen, leeftijd, geboorteplaats, beroep en woon- of verblijfplaats van den verdachte.

      2 De beschikking bevat voorts de beslissing, op grond van [artikel 44d][ref1] genomen. Ingeval van een beslissing
      als in het eerste lid van dat artikel bedoeld, vermeldt de beschikking de opgelegde straf en het strafbaar feit
      volgens de wettelijke omschrijving, ter zake waarvan de straf is opgelegd, met vermelding omstreeks welken tijd en
      waar ter plaatse het is begaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002008#Artikel44d
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel44f
    references:
      - id: ref1
        bwb_id: BWBR0002008
        artikel: 44d
  - number: 44g
    text: |-
      1 De raadsheer doet de beschikking met de stukken onverwijld toekomen aan den procureur-fiscaal.

      2 De beschikking wordt aan den verdachte in persoon beteekend, tenzij zij is genomen en aan den verdachte in
      afschrift is uitgereikt aanstonds na het verhoor. In het laatste geval maakt de raadsheer van de uitreiking een
      acte op. Bij de uitreiking of beteekening wordt de verdachte opmerkzaam gemaakt op de bevoegdheden, hem toegekend
      in de [artikelen 44h][ref1] en [44i][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002008#Artikel44h
      [ref2]: https://wetten.overheid.nl/BWBR0002008#Artikel44i
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel44g
    references:
      - id: ref1
        bwb_id: BWBR0002008
        artikel: 44h
      - id: ref2
        bwb_id: BWBR0002008
        artikel: 44i
  - number: 44h
    text: |-
      1 De verdachte is bevoegd uiterlijk binnen drie weken na de dagteekening van de beschikking, welke hem bij
      gelegenheid van zijn verhoor is uitgereikt, of anders binnen drie weken na den datum, waarop de beschikking hem
      in persoon is beteekend, een verklaring van bezwaar af te leggen. De [artikelen 449][ref1]-[452][ref2] van het
      [Wetboek van Strafvordering][ref3] zijn van overeenkomstige toepassing.

      2 Gelijke bevoegdheid komt toe aan den procureur-fiscaal binnen twee weken na dagteekening van de beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel449
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel452
      [ref3]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel44h
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '449'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '452'
      - id: ref3
        bwb_id: BWBR0001903
  - number: 44i
    text: |-
      De procureur-fiscaal en de verdachte kunnen afstand doen van de bevoegdheid om een verklaring van bezwaar af
      te leggen. [Artikel 454 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing met dien
      verstande, dat de procureur-fiscaal en de verdachte ook aanstonds na de uitreiking van het afschrift van de
      beschikking bij gelegenheid van het verhoor afstand kunnen doen van de bevoegdheid een verklaring van bezwaar af te
      leggen; in dat geval wordt de acte door den raadsheer opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel454
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel44i
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '454'
  - number: 44j
    text: |-
      1 Door een verklaring van bezwaar vervalt de beschikking.

      2 De beschikking vervalt eveneens, indien zij niet binnen drie maanden na haar dagteekening in afschrift uitgereikt
      of beteekend is kunnen worden.

      3 Wanneer de termijn, genoemd in [artikel 44h][ref1], is verstreken, zonder dat een verklaring van bezwaar
      is afgelegd of zooveel eerder als zoowel door den procureur-fiscaal als den verdachte afstand is gedaan van
      de bevoegdheid om een verklaring van bezwaar af te leggen, geldt de beschikking als een einduitspraak van het
      Bijzondere Gerechtshof, waartegen geen gewoon rechtsmiddel openstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002008#Artikel44h
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel44j
    references:
      - id: ref1
        bwb_id: BWBR0002008
        artikel: 44h
  - number: '45'
    text: |-
      Het bepaalde in [den tweeden zin van het eerste lid][ref1] van
      [artikel 556 van het Wetboek van Strafvordering][ref2] blijft buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel556
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel556
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '556'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '556'
  - number: '46'
    text: |-
      1 In afwijking van het bepaalde in [artikel 559, derde lid, van het Wetboek van Strafvordering][ref1] stelt de
      griffier een verzoekschrift om gratie, nadat hij van den dag der inlevering aanteekening heeft gedaan, onverwijld
      in handen van het openbaar ministerie, teneinde daaromtrent aan den rechter verslag te doen.

      2 Het bepaalde in [artikel 560][ref2] van dat Wetboek is mede van overeenkomstige toepassing, indien advies wordt
      ingewonnen omtrent gratie van de doodstraf, zonder dat een daartoe strekkend verzoek aan Ons is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel559
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel560
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '559'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '560'
  - number: '47'
    text: |-
      Het bepaalde in [artikel 562 van het Wetboek van Strafvordering][ref1] is mede in geval van veroordeeling tot de
      doodstraf van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel562
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '562'
  - number: '48'
    text: |-
      De persoon, die tot de doodstraf is veroordeeld, wordt, zoodra die veroordeeling uitvoerbaar is, ter uitvoerlegging
      van de sententie of het arrest op de wijze als is bepaald in Ons besluit van 26 April 1922 (*Staatsblad* No. 228),
      overgegeven aan den officier, die het bevel voert ter plaatse in den last van tenuitvoerlegging daarvoor aan te
      wijzen.
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel48
  - number: '49'
    text: |-
      Ten aanzien van de kosten in zaken, waarvan de kennisneming aan de Bijzondere Gerechtshoven of den Bijzonderen Raad
      van Cassatie behoort, zijn mede van overeenkomstige toepassing, met inachtneming van het in [artikel 1][ref1] van
      dit besluit [onder 1°][ref2]., [2°][ref3]. en 3°. gestelde, de bepalingen der wet van 18 April 1874 (*Staatsblad*
      N°. 66) tot vaststelling der tarieven van gerechtskosten in strafzaken, waarvan de gewone rechter kennis neemt,
      zooals deze wet sedert is gewijzigd, alsmede de voorschriften tot uitvoering daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0002008#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002008#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002008#Artikel1
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002008
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002008
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0002008
        artikel: '1'
  - number: '50'
    text: |-
      1 Dit besluit, ten aanzien waarvan de bevoegdheid, bedoeld in artikel 9, tweede lid, van het Besluit op den
      bijzonderen staat van beleg, niet kan worden uitgeoefend, treedt in werking op den dag zijner afkondiging.

      2 Het kan worden aangehaald onder den titel: Besluit Buitengewone Rechtspleging.
    url: https://wetten.overheid.nl/BWBR0002008/2002-01-01#Artikel50
