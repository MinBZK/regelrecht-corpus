preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuur en Voedselkwaliteit van 8 december 2021, nr. WJZ /
    21298679, gedaan in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport en na overleg met Onze
    Minister van Sociale Zaken en Werkgelegenheid;

    Gelet op Verordening (EU) 2019/6 van het Europees Parlement en de Raad van 11 december 2018 betreffende
    diergeneesmiddelen en tot intrekking van Richtlijn 2001/82/EG (PbEU 2019, L 4), Verordening (EU) 2019/4 van het
    Europees Parlement en de Raad van 11 december 2018 betreffende de vervaardiging, het in de handel brengen en het
    gebruik van gemedicineerde diervoeders, tot wijziging van Verordening (EG) nr. 183/2005 van het Europees Parlement
    en de Raad en tot intrekking van Richtlijn 90/167/EEG van de Raad (PbEU 2019, L 4), Verordening (EU) 2016/429
    van het Europees Parlement en de Raad van 9 maart 2016 betreffende overdraagbare dierziekten en tot wijziging en
    intrekking van bepaalde handelingen op het gebied van diergezondheid («diergezondheidswetgeving») (PbEU 2016, L
    84), Richtlijn 96/22/EG van de Raad van 29 april 1996 betreffende het verbod op het gebruik, in de veehouderij,
    van bepaalde stoffen met hormonale werking en van bepaalde stoffen met thyreostatische werking, alsmede van β-
    agonisten en tot intrekking van de Richtlijnen 81/602/EEG, 88/146/EEG en 88/299/EEG (PbEG 1996, L 125), Verordening
    (EU) 2017/625 van het Europees Parlement en de Raad van 15 maart 2017 betreffende officiële controles en andere
    officiële activiteiten die worden uitgevoerd om de toepassing van de levensmiddelen- en diervoederwetgeving en van
    de voorschriften inzake diergezondheid, dierenwelzijn, plantgezondheid en gewasbeschermingsmiddelen te waarborgen,
    tot wijziging van de Verordeningen (EG) nr. 999/2001, (EG) nr. 396/2005, (EG) nr. 1069/2009, (EG) nr. 1107/2009,
    (EU) nr. 1151/2012, (EU) nr. 652/2014, (EU) 2016/429 en (EU) 2016/2031 van het Europees Parlement en de Raad, de
    Verordeningen (EG) nr. 1/2005 en (EG) nr. 1099/2009 van de Raad en de Richtlijnen 98/58/EG, 1999/74/EG, 2007/43/
    EG, 2008/119/EG en 2008/120/EG van de Raad, en tot intrekking van de Verordeningen (EG) nr. 854/2004 en (EG)
    nr. 882/2004 van het Europees Parlement en de Raad, de Richtlijnen 89/608/EEG, 89/662/EEG, 90/425/EEG, 91/496/
    EEG, 96/23/EG, 96/93/EG en 97/78/EG van de Raad en Besluit 92/438/EEG van de Raad (verordening officiële controles)
    (PbEU 2017, L 95), Verordening (EG) nr. 470/2009 van het Europees Parlement en de Raad van 6 mei 2009 tot
    vaststelling van communautaire procedures voor het vaststellen van grenswaarden voor residuen van farmacologisch
    werkzame stoffen in levensmiddelen van dierlijke oorsprong, tot intrekking van Verordening (EEG) nr. 2377/90 van
    de Raad en tot wijziging van Richtlijn 2001/82/EG van het Europees Parlement en de Raad en van Verordening (EG)
    nr. 726/2004 van het Europees Parlement en de Raad en de artikelen 2.2, tiende lid, onderdeel a, onder 2° en 3°, en
    onderdeel l, onder 4°, 2.20, 2.25, 7.2, tweede lid, 7.3, vijfde lid, 7.6, eerste en tweede lid, en 7.8, eerste lid
    van de Wet dieren;

    De Afdeling advisering van de Raad van State gehoord (advies van 26 januari 2022, nr. W11.21.0368/IV)

    Gezien het nader rapport van Onze Minister van Landbouw, Natuur en Voedselkwaliteit van 22 februari 2022, nr. WJZ /
    22018374, gedaan in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *apotheker:* apotheker als bedoeld
      in [artikel 3, eerste lid, van de Wet op de beroepen in de individuele gezondheidszorg][ref1] die zijn beroep
      uitoefent in een apotheek als bedoeld in [artikel 1, eerste lid, onderdeel oo, van de Geneesmiddelenwet][ref2];
        - *dierproef:* dierproef als bedoeld in [artikel 1, eerste lid, onderdeel a, van de Wet op de dierproeven][ref3];
        - *kleinhandel:* handel in diergeneesmiddelen met het oog op verstrekking aan eindgebruikers, waaronder het ter
      hand stellen aan personen die krachtens wettelijk voorschrift gerechtigd zijn een diergeneesmiddel toe te passen.
        - *voorschriftplichtig diergeneesmiddel:* diergeneesmiddel dat is geclassificeerd als diergeneesmiddel waarvoor een
      diergeneeskundig voorschrift vereist is als bedoeld in artikel 34 van verordening (EU) nr. 2019/6.
        - *wet:* [Wet dieren][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0003081#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0030250
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0003081
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0030250
  - number: 2.1.1
    text: |-
      Een diergeneesmiddel, diervoeder, gemedicineerd diervoeder of andere stof wordt niet in een dierproef toegepast
      zonder vergunning van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel2.1
  - number: 2.1.2
    text: |-
      Het eerste lid is niet van toepassing indien het diergeneesmiddel, diervoeder of de stof wordt toegepast in
      een proef die wordt verricht met toepassing van de [Wet op de dierproeven][ref1] door de in die wet bedoelde
      vergunninghouders of het diergeneesmiddel wordt toegepast in een klinische proef als bedoeld in artikel 9 van
      verordening (EU) nr. 2019/6.


      [ref1]: https://wetten.overheid.nl/BWBR0003081
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0003081
  - number: 2.1.3
    text: |-
      Bij ministeriële regeling kunnen onderzoeksinstellingen worden aangewezen die voor wetenschappelijk onderzoek,
      kwaliteitscontrole of toezicht op de naleving onder bij die regeling te stellen regels zijn uitgezonderd van het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel2.1
  - number: '2.2'
    text: |-
      Een dier waarop een diergeneesmiddel, diervoeder, gemedicineerd diervoeder of een andere stof met mogelijk
      farmacologische werking is beproefd, of een levensmiddel van een dergelijk dier wordt niet in de handel gebracht,
      tenzij Onze Minister hiervoor vergunning heeft verleend.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel2.2
  - number: 3.1.1
    text: |-
      Op een aanvraag voor een vergunning voor de vervaardiging als bedoeld in artikel 88, eerste lid, van verordening
      (EU) nr. 2019/6 wordt binnen een termijn van negentig dagen beslist.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel3.1
  - number: 3.1.2
    text: 'De vergunning wordt niet verstrekt indien:'
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel3.1
  - number: 3.1.2.a
    text: |-
      uit een inspectie van Onze Minister of op andere wijze blijkt dat de gegevens, bedoeld in artikel 89, tweede lid,
      van verordening (EU) nr. 2019/6 niet volledig of niet juist zijn;
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel3.1
  - number: 3.1.2.b
    text: de aanvraag niet voldoet aan voorschriften, bedoeld in artikel 93 van verordening (EU) nr. 2019/6.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel3.1
  - number: 3.1.3
    text: |-
      Geen vergunning voor de vervaardiging is vereist voor het bereiden, het verdelen en het veranderen van de
      verpakking of aanbiedingsvorm van diergeneesmiddelen wanneer die verrichtingen overeenkomstig de artikelen 103
      en 104 van verordening (EU) nr. 2019/6 uitsluitend voor de rechtstreekse kleinhandel aan het publiek worden
      uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel3.1
  - number: 3.2.1
    text: Een aanvraag voor het intrekken van een vergunning voor de vervaardiging wordt ingediend bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel3.2
  - number: 3.2.2
    text: Op de aanvraag wordt binnen een termijn van negentig dagen beslist.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel3.2
  - number: 4.1.1
    text: |-
      Een vergunning voor groothandel wordt verstrekt indien de aanvrager voldoet aan de voorschriften, genoemd in de
      artikelen 100, tweede lid, onderdelen a tot en met e, en 101 van verordening (EU) nr. 2019/6.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel4.1
  - number: 4.1.2
    text: Op een aanvraag voor een vergunning voor groothandel wordt binnen een termijn van negentig dagen beslist.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel4.1
  - number: 4.1.3
    text: |-
      Voor incidentele leveringen van kleine hoeveelheden diergeneesmiddelen tussen kleinhandelaars in Nederland is geen
      vergunning voor groothandel vereist.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel4.1
  - number: 4.2.1
    text: Voor kleinhandel in diergeneesmiddelen is een vergunning voor kleinhandel vereist.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel4.2
  - number: 4.2.2
    text: De aanvraag voor de vergunning wordt ingediend bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel4.2
  - number: 4.2.3
    text: Op een aanvraag voor een vergunning voor kleinhandel wordt binnen een termijn van negentig dagen beslist.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel4.2
  - number: 4.2.4
    text: |-
      Bij ministeriële regeling kunnen in het belang van de diergezondheid, volksgezondheid of het milieu regels worden
      gesteld die de houder van de vergunning voor kleinhandel in acht neemt bij het uitoefenen van activiteiten waarvoor
      de vergunning is verstrekt. Deze regels hebben betrekking op:
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel4.2
  - number: 4.2.4.a
    text: de geschiktheid van ruimten en apparatuur;
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel4.2
  - number: 4.2.4.b
    text: de bewaring en behandeling van diergeneesmiddelen;
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel4.2
  - number: 4.2.4.c
    text: het vervoeren van diergeneesmiddelen; en
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel4.2
  - number: 4.2.4.d
    text: de levering van diergeneesmiddelen.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel4.2
  - number: 4.2.5
    text: |-
      In afwijking van het eerste lid is geen vergunning voor kleinhandel vereist voor de kleinhandel in niet-
      voorschriftplichtige diergeneesmiddelen die zijn bestemd voor niet-voedselproducerende dieren.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel4.2
  - number: 4.3.1
    text: |-
      Een apotheker die is ingeschreven in het door de Inspectie gezondheidszorg en jeugd ingestelde register van
      gevestigde apothekers, bedoeld in [artikel 61, vijfde lid, van de Geneesmiddelenwet][ref1] heeft van rechtswege een
      vergunning voor kleinhandel.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel61
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '61'
  - number: 4.3.2
    text: |-
      Een dierenarts heeft van rechtswege een vergunning voor kleinhandel voor het afleveren van diergeneesmiddelen aan
      houders van dieren voor die dieren waarvoor de dierenarts in de uitoefening van zijn beroep de medische zorg op
      zich heeft genomen.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel4.3
  - number: 4.4.1
    text: |-
      Een persoon met een vergunning voor kleinhandel kan, in afwijking van artikel 104, eerste lid, van verordening
      (EU) nr. 2019/6, via diensten van de informatiemaatschappij als bedoeld in artikel 1, eerste lid, onderdeel
      b, van [Richtlijn (EU) 2015/1535](32015L1535) van het Europees Parlement en de Raad van 9 september 2015
      betreffende een informatieprocedure op het gebied van technische voorschriften en regels betreffende de diensten
      van de informatiemaatschappij (PbEU 2015, L 241) diergeneesmiddelen aanbieden die zijn aangewezen op grond van
      [artikel 5.1, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0046416#Artikel5
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0046416
        artikel: '5'
        hoofdstuk: '5'
  - number: 4.4.2
    text: |-
      Het eerste lid is uitsluitend van toepassing op personen die in Nederland gevestigd zijn en enkel ten aanzien van
      levering in Nederland.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel4.4
  - number: 4.5.1
    text: Een aanvraag voor het wijzigen van een vergunning voor groothandel wordt ingediend bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel4.5
  - number: 4.5.2
    text: Op de aanvraag wordt binnen een termijn van negentig dagen beslist.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel4.5
  - number: '4.6'
    text: |-
      Onze Minister kan een vergunning voor groothandel wijzigen indien de groothandelaar niet voldoet aan artikel 101
      van verordening (EU) nr. 2019/6.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel4.6
  - number: 4.7.1
    text: Een aanvraag voor het wijzigen van een vergunning voor kleinhandel wordt ingediend bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel4.7
  - number: 4.7.2
    text: |-
      Op een aanvraag voor het wijzigen van een vergunning voor kleinhandel wordt binnen een termijn van negentig dagen
      beslist.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel4.7
  - number: 4.7.3
    text: 'Een vergunning voor kleinhandel kan door Onze Minister worden geschorst, ingetrokken of gewijzigd indien:'
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel4.7
  - number: 4.7.3.a
    text: |-
      de kleinhandelaar een voorschrift als bedoeld in artikel 103, tweede, derde en vijfde lid, van verordening (EU)
      nr. 2019/6 overtreedt;
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel4.7
  - number: 4.7.3.b
    text: |-
      de kleinhandelaar een voorschrift overtreedt dat is gesteld krachtens [artikel 4.2, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0046416#Artikel4
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0046416
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.7.3.c
    text: |-
      de kleinhandelaar met het diergeneesmiddel omgaat in strijd met de informatie die overeenkomstig verordening
      (EU) nr. 2019/6 is aangebracht op de verpakking van een diergeneesmiddel of gemedicineerd diervoeder of bij deze
      verpakking is gevoegd; of
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel4.7
  - number: 4.7.3.d
    text: de kleinhandelaar de artikelen 112, 113 of 114 van verordening (EU) nr. 2019/6 overtreedt; of
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel4.7
  - number: 4.7.3.e
    text: de kleinhandelaar in strijd handelt met bij de vergunning gestelde voorschriften of beperkingen.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel4.7
  - number: 4.7.3
    text: |-
      Onze Minister draagt zorg voor een register als bedoeld in [artikel 7.2, tweede lid, van de wet][ref1] waarin
      aantekening wordt gehouden van iedere vergunning voor kleinhandel en een besluit tot verlenging, wijziging,
      schorsing of intrekking daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7'
  - number: 5.1.1
    text: Een voorschriftplichtig diergeneesmiddel wordt uitsluitend geleverd door een dierenarts of een apotheker.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel5.1
  - number: 5.1.2
    text: |-
      In afwijking van het eerste lid kan een voorschriftplichtig diergeneesmiddel worden geleverd door iedere persoon
      met een vergunning voor kleinhandel indien het diergeneesmiddel daartoe door Onze Minister is aangewezen vanwege
      een naar het oordeel van Onze Minister beperkt gevaar voor de volksgezondheid, diergezondheid, het dierenwelzijn
      of milieu.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel5.1
  - number: 5.1.3
    text: |-
      Een dierenarts kan het afleveren van een diergeneesmiddel door een andere persoon, in afwijking van het eerste
      en tweede lid en [artikel 4.2, eerste lid][ref1], uit laten voeren voor zover dit in overeenstemming is met de
      zorgplichten, bedoeld in [artikel 4.2 van de wet][ref2] en regels die bij ministeriële regeling kunnen worden
      gesteld over het afleveren door een persoon zonder kleinhandelsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0046416#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel4
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0046416
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '4'
  - number: '5.2'
    text: Bij ministeriële regeling kunnen regels worden gesteld over het bewaren en behandelen van diergeneesmiddelen.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel5.2
  - number: 5.3.1
    text: |-
      Onze Minister kan voorschriftplichtige diergeneesmiddelen aanwijzen waarvan toepassing is voorbehouden aan
      een dierenarts of een andere persoon die is toegelaten tot het beroepsmatig verrichten van diergeneeskundige
      handelingen vanwege een gevaar voor de volksgezondheid, diergezondheid, het dierenwelzijn of milieu.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel5.3
  - number: 5.3.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over het onder de verantwoordelijkheid van een dierenarts
      toepassen van diergeneesmiddelen als bedoeld in de artikelen 112, derde lid, 113, derde lid, en 114, vijfde lid,
      van verordening (EU) nr. 2019/6.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel5.3
  - number: 5.3.3
    text: |-
      Bij ministeriële regeling worden regels gesteld over het toepassen van antimicrobiële diergeneesmiddelen door
      dierenartsen en houders van dieren.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel5.3
  - number: 6.1.1
    text: |-
      Degene die verantwoordelijk is voor een laboratorium, voorziening of andere ruimte waar zich een bij ministeriële
      regeling aangewezen ziekteverwekker bevindt, meldt dit bij Onze Minister, indien de ziekteverwekker:
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel6.1
  - number: 6.1.1.a
    text: |-
      voor een periode van ten minste 30 aaneengesloten dagen in het laboratorium, de voorziening of de ruimte aanwezig
      is; of
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel6.1
  - number: 6.1.1.b
    text: aldaar wordt gekweekt.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel6.1
  - number: 6.1.2
    text: |-
      Indien de ziekteverwekker, bedoeld in het eerste lid, zich niet meer bevindt in het laboratorium, voorziening of
      ruimte doet degene die verantwoordelijk is, bedoeld in het eerste lid, hiervan melding bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel6.1
  - number: 6.1.3
    text: |-
      De meldingen, bedoeld in het eerste en tweede lid, geschieden met gebruikmaking van een middel dat daartoe door
      Onze Minister beschikbaar is gesteld.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel6.1
  - number: 6.2.1
    text: |-
      Bij ministeriële regeling kan worden geregeld dat het voorhanden of in voorraad hebben van bij die regeling
      aangewezen ziekteverwekkers uitsluitend is toegestaan aan door Onze Minister erkende laboratoria, voorzieningen
      of andere natuurlijke of rechtspersonen als bedoeld in artikel 16, eerste lid, van [verordening (EU) 2016/429]
      (32329R2016) van het Europees Parlement en de Raad van 9 maart 2016 betreffende overdraagbare dierziekten en tot
      wijziging en intrekking van bepaalde handelingen op het gebied van diergezondheid («diergezondheidswetgeving»)
      (PbEU 2016, L 84).
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel6.2
  - number: 6.2.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de gevallen waarin een erkenning als bedoeld in het
      eerste lid wordt verleend, geschorst of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel6.2
  - number: '7.1'
    text: |-
      Bij ministeriële regeling worden regels gesteld voor de uitvoering van EU-rechtshandelingen die betrekking hebben
      op bij die EU-rechtshandelingen aangewezen substanties over:
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel7.1
  - number: 7.1.a
    text: onderzoeken naar en controle op de aanwezigheid van deze substanties in diergeneesmiddelen;
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel7.1
  - number: 7.1.b
    text: onderzoek naar en controle op de aanwezigheid van deze substanties in dieren of dierlijke producten; en
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel7.1
  - number: 7.1.c
    text: het houden van en de handel in dieren of dierlijke producten die deze substanties bevatten.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel7.1
  - number: '8.1'
    text: |-
      Bij ministeriële regeling kan worden geregeld in welke gevallen homeopathische diergeneesmiddelen worden
      geregistreerd als bedoeld in artikel 85, eerste lid, van verordening (EU) nr. 2019/6.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel8.1
  - number: '8.2'
    text: |-
      Het maken van reclame voor diergeneesmiddelen waarvoor een diergeneeskundig voorschrift vereist is, is enkel
      toegestaan bij professionele houders van dieren, voor zover de voorwaarden van artikel 120, tweede lid, onderdelen
      a en b, van verordening (EU) nr. 2019/6 worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel8.2
  - number: '8.3'
    text: |-
      Van een besluit dat Onze Minister neemt krachtens verordening (EU) nr. 2019/6 wordt mededeling gedaan op een
      daartoe door Onze Minister bij ministeriële regeling aangewezen website.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel8.3
  - number: '8.4'
    text: |-
      [Artikel 28, eerste lid, van de Dienstenwet][ref1] is niet van toepassing op een aanvraag voor een eerste
      vergunning voor kleinhandel.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
  - number: '8.5'
    text: |-
      Bij ministeriële regeling worden regels gesteld voor de uitvoering van de volgende EU-rechtshandelingen en de
      krachtens die EU-rechtshandelingen vastgestelde EU-rechtshandelingen:
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel8.5
  - number: 8.5.a
    text: |-
      [Richtlijn 96/22/EG](31996L0022) van de Raad van 29 april 1996 betreffende het verbod op het gebruik, in de
      veehouderij, van bepaalde stoffen met hormonale werking en van bepaalde stoffen met thyreostatische werking,
      alsmede van β-agonisten en tot intrekking van de [Richtlijnen 81/602/EEG](31981L0602), [88/146/EEG](31988L0146) en
      [88/299/EEG](31988L0299) (PbEG 1996, L 125); en
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel8.5
  - number: 8.5.b
    text: |-
      Verordening (EG) nr. 470/2009 van het Europees Parlement en de Raad van 6 mei 2009 tot vaststelling van
      communautaire procedures voor het vaststellen van grenswaarden voor residuen van farmacologisch werkzame stoffen
      in levensmiddelen van dierlijke oorsprong, tot intrekking van Verordening (EEG) nr. 2377/90 van de Raad en tot
      wijziging van [Richtlijn 2001/82/EG](32001L0082) van het Europees Parlement en de Raad en van Verordening (EG)
      nr. 726/2004 van het Europees Parlement en de Raad.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel8.5
  - number: 8.6.1
    text: |-
      Een krachtens dit besluit vast te stellen ministeriële regeling wordt vastgesteld door Onze Minister in
      overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel8.6
  - number: 8.6.2
    text: |-
      Een vergunning als bedoeld in de artikelen 47, 49, 52 en 53 van verordening (EU) nr. 2019/6 wordt verleend in
      overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel8.6
  - number: 10.1.1
    text: |-
      Zolang Onze Minister nog geen aanwijzingsbesluit heeft genomen als bedoeld in de [artikelen 5.1, tweede lid][ref1],
      en [5.3, eerste lid][ref2], gelden de voorschriften die zijn verbonden aan de vergunningen voor het
      in de handel brengen van diergeneesmiddelen, bedoeld in de [artikelen 2.15][ref3], [2.17][ref4] en
      [2.18 van de Regeling diergeneesmiddelen][ref5], zoals die regeling luidde op 27 januari 2022, als aanwijzingen als
      bedoeld in de artikelen 5.1, tweede lid, en 5.3, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0046416#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0046416#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0032626#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0032626#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0032626#Artikel2
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel10.1
    references:
      - id: ref1
        bwb_id: BWBR0046416
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0046416
        artikel: '5'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0032626
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0032626
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0032626
        artikel: '2'
  - number: 10.1.2
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel10.1
  - number: 10.1.2.a
    text: antimicrobiële diergeneesmiddelen; en
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel10.1
  - number: 10.1.2.b
    text: immunologische diergeneesmiddelen voor varkens.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel10.1
  - number: '10.3'
    text: |-
      Het [Besluit diergeneesmiddelen][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0035091
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0035091
  - number: '10.4'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel10.4
  - number: '10.5'
    text: 'Dit besluit wordt aangehaald als: Besluit diergeneesmiddelen 2022.'
    url: https://wetten.overheid.nl/BWBR0046416/2025-03-01#Artikel10.5
