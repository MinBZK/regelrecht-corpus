preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 12 maart 2010,
    BJZ2010006064, Directie Bestuurlijke en Juridische Zaken;

    De Raad van State gehoord (advies van 25 maart 2010, nr. W08.10.0083/IV);

    Gelet op artikel 28 van de Wet voorkeursrecht gemeenten;

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 18 juni
    2010, BJZ2010015754, Directie Bestuurlijke en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0027832/2010-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0027832/2010-07-01#Artikel1
  - number: 1.a
    text: |-
      *de wet:* de [Wet voorkeursrecht gemeenten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003391
    url: https://wetten.overheid.nl/BWBR0027832/2010-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003391
  - number: 1.b
    text: |-
      *besluit tot aanwijzing:* besluit als bedoeld in [artikel 2][ref1] in samenhang met [artikel 3][ref2], [4][ref3]
      of [5 van de wet][ref4] of een besluit als bedoeld in [artikel 9a, eerste of tweede lid][ref5], in samenhang met
      artikel 2 en artikel 3, 4 of 5 van de wet;


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003391#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0003391#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0003391#Artikel9a
    url: https://wetten.overheid.nl/BWBR0027832/2010-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003391
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0003391
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0003391
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0003391
        artikel: 9a
  - number: 1.c
    text: |-
      *besluit tot voorlopige aanwijzing:* besluit als bedoeld in [artikel 6 van de wet][ref1] of een besluit als bedoeld
      in [artikel 9a, eerste lid][ref2], in samenhang met artikel 6 van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel9a
    url: https://wetten.overheid.nl/BWBR0027832/2010-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0003391
        artikel: 9a
  - number: '2.1'
    text: 'Het besluit tot aanwijzing of voorlopige aanwijzing vermeldt ten aanzien van de aangewezen gronden:'
    url: https://wetten.overheid.nl/BWBR0027832/2010-07-01#Artikel2
  - number: 2.1.a
    text: |-
      de kadastrale aanduidingen, bestaande uit achtereenvolgens de naam der kadastrale gemeente, de aanduiding der
      sectie en het perceelnummer van de in de aanwijzing opgenomen percelen in numerieke volgorde geplaatst;
    url: https://wetten.overheid.nl/BWBR0027832/2010-07-01#Artikel2
  - number: 2.1.b
    text: |-
      de kadastrale grootte van elk van de in de aanwijzing opgenomen percelen en indien een gedeelte van een perceel in
      de aanwijzing is opgenomen, de kadastrale grootte van dat gedeelte;
    url: https://wetten.overheid.nl/BWBR0027832/2010-07-01#Artikel2
  - number: 2.1.c
    text: |-
      de namen van de eigenaren van en de beperkt gerechtigden tot de in de aanwijzing opgenomen percelen en
      perceelsgedeelten,
    url: https://wetten.overheid.nl/BWBR0027832/2010-07-01#Artikel2
  - number: '2.2'
    text: |-
      Het besluit vermeldt tevens ten aanzien van elk tot de aangewezen gronden behorend perceel of perceelsgedeelte de
      planologische grondslag op basis waarvan het besluit is genomen, alsmede de eerst mogelijke vervaldatum van het
      voorkeursrecht.
    url: https://wetten.overheid.nl/BWBR0027832/2010-07-01#Artikel2
  - number: '2.3'
    text: |-
      Het besluit vermeldt voorts of, en zo ja, wanneer en op welke grondslag het perceel eerder was aangewezen alsmede
      het tijdstip waarop het bevoegd gezag de vorige aanwijzing heeft doen vervallen.
    url: https://wetten.overheid.nl/BWBR0027832/2010-07-01#Artikel2
  - number: '3'
    text: |-
      Het kadastraal overzicht, bedoeld in [artikel 3, derde lid, van de wet][ref1] wordt vervat in een kaart, die is
      ingericht met inachtneming van de volgende voorschriften:


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel3
    url: https://wetten.overheid.nl/BWBR0027832/2010-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '3'
  - number: 3.a
    text: |-
      de kaart wordt vervaardigd op een schaal van ten minste 1 op 2500, waarop de kadastrale indeling van het gebied
      waarin zich aangewezen gronden bevinden is aangegeven;
    url: https://wetten.overheid.nl/BWBR0027832/2010-07-01#Artikel3
  - number: 3.b
    text: de aangewezen gronden worden met een duidelijke ononderbroken lijn of arcering op de kaart aangegeven;
    url: https://wetten.overheid.nl/BWBR0027832/2010-07-01#Artikel3
  - number: 3.c
    text: uit de kaart moet de kadastrale sectie-indeling blijken door middel van een onderbroken lijn;
    url: https://wetten.overheid.nl/BWBR0027832/2010-07-01#Artikel3
  - number: 3.d
    text: uit de kaart moet de aansluiting van de aangewezen gronden aan het daaromheen gelegen gebied blijken;
    url: https://wetten.overheid.nl/BWBR0027832/2010-07-01#Artikel3
  - number: 3.e
    text: |-
      op de kaart wordt aangegeven een noordpijl, alsmede de naam van de gemeente en in geval van afwijking tevens de
      naam van de kadastrale gemeente.
    url: https://wetten.overheid.nl/BWBR0027832/2010-07-01#Artikel3
  - number: '4.1'
    text: |-
      De mededeling overeenkomstig [artikel 7, derde lid, van de wet][ref1] aan de in het besluit tot aanwijzing of
      voorlopige aanwijzing vermelde eigenaren en beperkt gerechtigden, gaat vergezeld van een afschrift van het besluit
      dan wel een uittreksel daaruit met de voor de geadresseerde eigenaar of beperkt gerechtigde van belang zijnde
      gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel7
    url: https://wetten.overheid.nl/BWBR0027832/2010-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '7'
  - number: '4.2'
    text: |-
      De mededeling van het besluit tot aanwijzing door provinciale staten of Onze Minister en de mededeling van het
      besluit tot voorlopige aanwijzing door gedeputeerde staten vermeldt tevens:
    url: https://wetten.overheid.nl/BWBR0027832/2010-07-01#Artikel4
  - number: 4.2.a
    text: of het betrokken perceel reeds is aangewezen door een ander bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0027832/2010-07-01#Artikel4
  - number: 4.2.b
    text: |-
      het rechtsgevolg van het besluit voor de reeds bestaande aanwijzing of voorlopige aanwijzing van het betrokken
      perceel;
    url: https://wetten.overheid.nl/BWBR0027832/2010-07-01#Artikel4
  - number: 4.2.c
    text: |-
      indien een opgave als bedoeld in [artikel 11, eerste lid, van de wet][ref1], is gedaan, op welke wijze
      gedeputeerde staten onderscheidenlijk Onze Minister invulling zullen geven aan de indeplaatstreding, bedoeld in
      [artikel 9a, vijfde onderscheidenlijk zesde lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel9a
    url: https://wetten.overheid.nl/BWBR0027832/2010-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0003391
        artikel: 9a
  - number: '5'
    text: |-
      Alle schriftelijke mededelingen aan of van de vervreemder, in de wet voorzien, worden gedaan bij aangetekende brief
      met ontvangstbevestiging.
    url: https://wetten.overheid.nl/BWBR0027832/2010-07-01#Artikel5
  - number: '6.1'
    text: |-
      Burgemeester en wethouders, gedeputeerde staten of Onze Minister zenden aan de vervreemder afschrift van een
      verzoek aan de rechtbank als bedoeld in [artikel 13, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel13
    url: https://wetten.overheid.nl/BWBR0027832/2010-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '13'
  - number: '6.2'
    text: |-
      Burgemeester en wethouders, gedeputeerde staten of Onze Minister zenden aan de vervreemder afschrift van een
      schriftelijke intrekking van het verzoek, bedoeld in [artikel 13, zevende lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel13
    url: https://wetten.overheid.nl/BWBR0027832/2010-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '13'
  - number: '6.3'
    text: |-
      De vervreemder zendt aan burgemeester en wethouders, gedeputeerde staten of Onze Minister afschrift van het
      verzoek, bedoeld in [artikel 15, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel15
    url: https://wetten.overheid.nl/BWBR0027832/2010-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '15'
  - number: '7'
    text: |-
      De toezending van een exemplaar van het advies, bedoeld in [artikel 13, vierde lid, van de wet][ref1] aan ieder van
      beide partijen geschiedt onder dezelfde dagtekening als de nederlegging daarvan ter griffie van de rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel13
    url: https://wetten.overheid.nl/BWBR0027832/2010-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '13'
  - number: '8'
    text: |-
      Het [Besluit voorkeursrecht gemeenten][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0003720
    url: https://wetten.overheid.nl/BWBR0027832/2010-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003720
  - number: '10'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgeteld.
    url: https://wetten.overheid.nl/BWBR0027832/2010-07-01#Artikel10
  - number: '11'
    text: 'Dit besluit wordt aangehaald als: Besluit voorkeursrecht gemeenten 2010.'
    url: https://wetten.overheid.nl/BWBR0027832/2010-07-01#Artikel11
