preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 10 juni 1997, nr.
    MJZ 97106647, Centrale Directie Juridische Zaken, Afdeling Wetgeving;


    Gelet op richtlijn (EG) nr. 96/62 van de Raad van de Europese Unie van 27 september 1996 inzake de beoordeling en
    het beheer van de luchtkwaliteit (PbEG L 296) en op de artikelen 53 in samenhang met 48, derde lid, en 59, eerste
    lid, van de Wet inzake de luchtverontreiniging, en artikel 5.3, eerste en tweede lid, van de Wet milieubeheer;


    De Raad van State gehoord (advies van 4 augustus 1997, nr. W08.97.0335);


    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 21 april
    1998, nr. MJZ 98037449, Centrale Directie Juridische Zaken, Afdeling Wetgeving;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009573/1998-04-22#ArtikelAanhef
articles:
  - number: '1'
    text: >-
      In dit besluit wordt verstaan onder:


      a. EG-kaderrichtlijn luchtkwaliteit: [richtlijn (EG) nr. 96/62](31996L0062) van de Raad van de Europese Unie van 27
      september 1996 inzake de beoordeling en het beheer van de luchtkwaliteit (PbEG L 296), naar de tekst zoals deze bij
      die richtlijn is vastgesteld;


      b. RIVM: Rijksinstituut voor Volksgezondheid en Milieu.
    url: https://wetten.overheid.nl/BWBR0009573/1998-04-22#Artikel1
  - number: '2'
    text: |-
      Het RIVM is belast met de uitvoering van de taken, genoemd in [artikel 3][ref1], derde tot en met zesde
      gedachtestreepje, van de EG-kaderrichtlijn luchtkwaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0009573#Artikel3
    url: https://wetten.overheid.nl/BWBR0009573/1998-04-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009573
        artikel: '3'
  - number: '3'
    text: |-
      Onze Minister draagt zorg voor de uitvoering van de in de [artikelen 4, eerste lid][ref1], vierde alinea, en 11,
      eerste lid, van de EG-kaderrichtlijn luchtkwaliteit bedoelde verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009573#Artikel4
    url: https://wetten.overheid.nl/BWBR0009573/1998-04-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009573
        artikel: '4'
  - number: '4'
    text: >-
      Het RIVM organiseert meet-, onderzoek- of beoordelingscampagnes als bedoeld in artikel 5 van de EG-kaderrichtlijn
      luchtkwaliteit.
    url: https://wetten.overheid.nl/BWBR0009573/1998-04-22#Artikel4
  - number: '5'
    text: |-
      Wanneer een alarmdrempel, gesteld krachtens [artikel 5.1, eerste lid, van de Wet milieubeheer][ref1],
      wordt overschreden, laat Onze Commissaris in de provincie hiervan mededeling doen. Daarbij worden aan het
      publiek de gegevens verstrekt, bedoeld in artikel 10, derde volzin, van de EG-kaderrichtlijn luchtkwaliteit.
      [Artikel 48, derde lid, van de Wet inzake de luchtverontreiniging][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5.1
      [ref2]: https://wetten.overheid.nl/BWBR0002731#Artikel48
    url: https://wetten.overheid.nl/BWBR0009573/1998-04-22#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5.1'
      - id: ref2
        bwb_id: BWBR0002731
        artikel: '48'
  - number: '6'
    text: >-
      Dit besluit treedt in werking op het tijdstip waarop de wijziging van de Wet milieubeheer en de Wet inzake de
      luchtverontreiniging ter implementatie van de EG-kaderrichtlijn luchtkwaliteit in werking treedt.
    url: https://wetten.overheid.nl/BWBR0009573/1998-04-22#Artikel6
  - number: '7'
    text: 'Dit besluit wordt aangehaald als: Besluit uitvoering EG-kaderrichtlijn luchtkwaliteit.'
    url: https://wetten.overheid.nl/BWBR0009573/1998-04-22#Artikel7
