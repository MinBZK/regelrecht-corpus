preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op voordracht van de Staatssecretaris van Volksgezondheid, Welzijn en Sport, van 3 maart 1995 nr. DGVgz/VVP/
    L 95613, gedaan in overeenstemming met Onze Ministers van Economische Zaken en van Landbouw, Natuurbeheer en
    Visserij;

    Gelet op de beschikking van het Comité van Ministers van de Benelux Economische Unie tot wijziging van de
    beschikking betreffende de harmonisatie der wetgevingen inzake Limonades M(94)1;

    Gelet op de artikelen 3, 4, eerste lid, 8, onderdelen a, b en c, 13 en 14 van de Warenwet (Stb. 1988, 360) en
    op artikel II, eerste lid, van de Wijzigingswet 1988 Warenwet ( Stb. 358) jo. artikel 14a, 16, 16a en 16c van de
    Warenwet (Stb. 1935, 973);

    Gezien het advies van de Adviescommissie Warenwet (advies van 14 september 1994, nr. 14804/(12)5);

    De Raad van State gehoord (advies van 2 juni 1995, nr. W13.95.0149.);

    Gezien het nader rapport van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 17 juli 1995, nr. VVP/
    L 951622, uitgebracht in overeenstemming met Onze Ministers van Economische Zaken en van Landbouw, Natuurbeheer
    en Visserij;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007501/2000-05-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. procent of %: massaprocent;

      b. suikers: de waren, bedoeld in de [artikelen 2, eerste lid][ref1], en [2][ref2]*bis*, eerste lid, onder *b* en
      *c*, van het [Suiker- en stroopbesluit (Warenwet)][ref3];

      c. suikergehalte: het met behulp van de refractometer bepaalde percentage opgeloste droge stof, uitgedrukt als
      saccharose;

      d. koolzuur: kooldioxide (E 290) zoals omschreven in het Conserveermiddelenbesluit (Warenwet);

      e. kinine: kinine en de zouten van kinine zoals omschreven in de Nederlandse Pharmacopee (achtste uitgave, deel II,
      pagina 502-504);

      f. kininegehalte: de som der gehaltes aan de onder *e* genoemde stoffen, berekend als kininebasis (C20H24N2O2);

      g. cafeïne: coffeïne of coffeïnemonohydraat(cafeïnemonohydraat) zoals omschreven in de Nederlandse Pharmacopee
      (achtste uitgave deel II, pagina 535 en 536);

      h. cafeïnegehalte: de som der gehaltes aan de onder *g* genoemde stoffen, berekend als coffeïne (cafeïne).

      2 Dit besluit is niet van toepassing op eet- en drinkwaren die in een andere lid-staat van de Europese Unie of
      in een andere staat die partij is bij de overeenkomst betreffende de Europese Economische Ruimte rechtmatig zijn
      bereid en in het verkeer gebracht, onder de voorwaarde dat de etikettering daarvan de consument op passende wijze
      informeert over de aard en de kenmerken van die waren, ten einde een onderscheid mogelijk te maken met de in dit
      besluit bedoelde waren.


      [ref1]: https://wetten.overheid.nl/BWBR0007501#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007501#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003089
    url: https://wetten.overheid.nl/BWBR0007501/2000-05-01#Artikel1
    references:
      - id: ref1
