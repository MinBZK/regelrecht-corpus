        bwb_id: BWBR0003089
  - number: '2'
    text: |-
      1 Het is verboden frisdranken te bereiden en te verhandelen anders dan met inachtneming van de voorschriften, bij
      dit besluit aan de desbetreffende waar gesteld.

      2 Het is verboden frisdranken te verhandelen anders dan met inachtneming van de voorschriften bij dit besluit
      gesteld met betrekking tot hun aanduiding en tot het bezigen van vermeldingen en voorstellingen.

      3 Het is verboden met gebruikmaking van de bij dit besluit aangegeven aanduidingen, andere waren te verhandelen dan
      die waaraan die aanduidingen bij dit besluit zijn voorbehouden.
    url: https://wetten.overheid.nl/BWBR0007501/2000-05-01#Artikel2
  - number: '5'
    text: |-
      1

      2 De als *limonade* of *frisdrank* aangeduide waren bevatten, voor wat betreft de hieronder genoemde stoffen, de
      volgende maximale gehaltes:

      a.

      b. cafeïne (v.w.b. dranken met planten- of vruchtenextracten): 150 mg/l

      c. kinine (en zijn zouten), uitgedrukt als kininebase: 85 mg/l

      d. kinine (en zijn zouten), uitgedrukt als kininebase (voor wat betreft dranken met vruchtesap): 40 mg/l
    url: https://wetten.overheid.nl/BWBR0007501/2000-05-01#Artikel5
  - number: '7'
    text: |-
      1 Als methoden van onderzoek welke bij uitsluiting beslissend zijn voor de vaststelling of al dan niet is voldaan
      aan de bij of krachtens dit besluit gestelde regels, worden aangewezen microbiologische onderzoekingsmethoden,
      chromatografische en andere scheidingsmethoden, organoleptische bepalingsmethoden en detectiemethoden.

      2 Onze Minister kan, in overeenstemming met Onze Minister van Landbouw, Natuurbeheer en Visserij, omtrent de in het
      eerste lid bedoelde methoden nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0007501/2000-05-01#Artikel7
  - number: '8'
    text: Het [Frisdranken- en siropenbesluit (Warenwet)](onbekend) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007501/2000-05-01#Artikel8
  - number: '10'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0007501/2000-05-01#Artikel10
  - number: '11'
    text: 'Dit besluit wordt aangehaald als: Warenwetbesluit Frisdranken.'
    url: https://wetten.overheid.nl/BWBR0007501/2000-05-01#Artikel11
