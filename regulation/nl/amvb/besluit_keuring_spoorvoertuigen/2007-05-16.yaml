      1 Bij de aanvraag voor een erkenning als bedoeld in [artikel 48 van de wet][ref1] wordt overgelegd een verklaring
      omtrent het gedrag als bedoeld in [artikel 28 van de Wet justitiële gegevens][ref2] betreffende:

      a. het hoofd van het bedrijf of indien het bedrijf een meerhoofdige leiding heeft, betreffende ieder hoofd;

      b. iedere bestuurder in geval van een rechtspersoon.

      2 Bij ministeriële regeling kunnen vorm en inhoud van de erkenning worden vastgesteld.

      3 Met een verklaring als bedoeld in het eerste lid, onderdeel a, wordt gelijkgesteld een zodanig document afgegeven
      door de bevoegde instantie van een andere lidstaat of van een andere staat die partij is bij het Verdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0016544#Artikel28
