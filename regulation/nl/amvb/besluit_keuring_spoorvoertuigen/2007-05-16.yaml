        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0017622
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: '11'
    text: >-
      1 De aanvraag voor een wijziging van het goedkeuringcertificaat wordt door de eigenaar of de houder van het
      betrokken spoorvoertuig of onderdeel ingediend bij de keuringsinstantie die het goedkeuringscertificaat heeft
      afgegeven.


      2 Bij de aanvraag wordt een informatiedossier overgelegd.
    url: https://wetten.overheid.nl/BWBR0017622/2007-05-16#Artikel11
  - number: '12'
    text: |-
      1 De keuringsinstantie wijzigt het goedkeuringscertificaat indien het gewijzigde spoorvoertuig of onderdeel in
      overeenstemming is met het betrokken informatiedossier, bedoeld in [artikel 11, tweede lid][ref1], en het voldoet
      aan de eisen gesteld bij de ministeriële regeling, bedoeld in [artikel 4, eerste lid][ref2], respectievelijk
      [artikel 6][ref3].

      2 Bij de wijziging verstrekt de keuringsinstantie een gewijzigd goedkeuringscertificaat en kan de keuringsinstantie
      een merkteken verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0017622#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0017622#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0017622#Artikel6
    url: https://wetten.overheid.nl/BWBR0017622/2007-05-16#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0017622
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017622
