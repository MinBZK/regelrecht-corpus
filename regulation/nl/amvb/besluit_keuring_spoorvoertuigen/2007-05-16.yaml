  - number: '27'
    text: |-
      1 Een EG-verklaring van conformiteit of geschiktheid voor gebruik als bedoeld in
      [artikel 39, eerste lid, onderdelen a of b, van de wet][ref1] wordt afgegeven door:

      a. de fabrikant van de betrokken onderdelen of diens in Nederland gevestigde gemachtigde;

      b. degene die deze onderdelen van diverse herkomst of delen daarvan assembleert dan wel voor eigen gebruik
      vervaardigt.

      2 Een EG-verklaring van conformiteit of geschiktheid voor gebruik voldoet aan bijlage IV van [richtlijn 2001/16/EG]
      (32001L0016) respectievelijk bijlage IV van [richtlijn 96/48/EG](31996L0048).


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel39
    url: https://wetten.overheid.nl/BWBR0017622/2007-05-16#Artikel27
    references:
