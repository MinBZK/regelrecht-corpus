        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0017622
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: '13'
    text: |-
      Betreft de wijziging een goedkeuringscertificaat als bedoeld in [artikel 4, tweede lid][ref1], dan stelt de
      keuringsinstantie ten aanzien van het betrokken spoorvoertuig of onderdeel een afzonderlijk informatiedossier samen
      bestaande uit de inhoud van het informatiedossier, bedoeld in [artikel 3, tweede lid][ref2], met daarin aangebracht
      de wijzigingen vermeld in het betrokken informatiedossier, bedoeld in [artikel 11, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017622#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0017622#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0017622#Artikel11
    url: https://wetten.overheid.nl/BWBR0017622/2007-05-16#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0017622
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017622
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0017622
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
  - number: '14'
    text: >-
      1 Aan een certificaat van overeenstemming en aan een goedkeuringscertificaat kunnen voorschriften worden verbonden,
      en deze documenten kunnen onder beperkingen worden afgegeven.


      2 Het is verboden in strijd met deze voorschriften of beperkingen met het betrokken spoorvoertuig over een
      hoofdspoorweg te rijden of de betrokken onderdelen in de handel te brengen of te gebruiken.
    url: https://wetten.overheid.nl/BWBR0017622/2007-05-16#Artikel14
  - number: '15'
    text: |-
      Indien een krachtens de wet voor het rijden over de hoofdspoorwegen goedgekeurd spoorvoertuig na een ernstige
      beschadiging als bedoeld in [artikel 45, onderdeel a, van de wet][ref1], is hersteld, kan Onze Minister bepalen dat
      het door de keuringsinstantie gekeurd wordt voordat het opnieuw in gebruik wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel45
    url: https://wetten.overheid.nl/BWBR0017622/2007-05-16#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '45'
  - number: '16'
    text: |-
      1 De aanvraag voor een keuring als bedoeld in [artikel 15][ref1] wordt door de spoorwegonderneming die het
      herstelde spoorvoertuig gebruikt of door de eigenaar of de houder daarvan ingediend.

      2 Bij de aanvraag wordt een informatiedossier overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0017622#Artikel15
    url: https://wetten.overheid.nl/BWBR0017622/2007-05-16#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0017622
        artikel: '15'
        hoofdstuk: II
        paragraaf: '4'
  - number: '17'
    text: |-
      1 De keuringsinstantie keurt het herstelde spoorvoertuig goed indien het voldoet aan de eisen gesteld bij de
      ministeriële regeling, bedoeld in [artikel 4, eerste lid][ref1], of [artikel 6][ref2].

      2 Na goedkeuring verstrekt de keuringsinstantie voor het herstelde spoorvoertuig:

      a. een keuringscertificaat dat in de plaats treedt van de goedkeuring, bedoeld in [artikel 15, tweede lid][ref3];

      b. een merkteken.


      [ref1]: https://wetten.overheid.nl/BWBR0017622#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0017622#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0017622#Artikel15
    url: https://wetten.overheid.nl/BWBR0017622/2007-05-16#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0017622
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017622
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0017622
        artikel: '15'
        hoofdstuk: II
        paragraaf: '4'
  - number: '18'
    text: |-
      Indien de keuringsinstantie het herstelde spoorvoertuig afkeurt, vervalt de geldigheid van de met betrekking tot
      dat voertuig verleende goedkeuring als bedoeld in [artikel 15][ref1] op het tijdstip waarop het besluit van de
      keuringsinstantie onherroepelijk wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0017622#Artikel15
    url: https://wetten.overheid.nl/BWBR0017622/2007-05-16#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0017622
        artikel: '15'
        hoofdstuk: II
        paragraaf: '4'
  - number: '19'
    text: |-
      1 De keuringsinstantie stelt van keuringen als bedoeld in [hoofdstuk II, paragrafen 1][ref1], [2][ref2] en
      [4][ref3], telkens een technisch dossier samen.

      2 Nadat het besluit van de keuringsinstantie met betrekking tot deze keuring onherroepelijk is geworden, stelt de
      keuringsinstantie het betrokken technische dossier aan de aanvrager van de keuring ter beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0017622#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0017622#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0017622#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0017622/2007-05-16#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0017622
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017622
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0017622
        hoofdstuk: II
        paragraaf: '4'
  - number: '20'
    text: >-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over


      a. de vorm en inhoud van:


      1°. de informatiedossiers;


      2°. het certificaat van overeenstemming;


      3°. de goedkeuringscertificaten en de gewijzigde goedkeuringscertificaten;


      4°. het technisch dossier;


      b. de merktekens en het aanbrengen of verwijderen daarvan.
    url: https://wetten.overheid.nl/BWBR0017622/2007-05-16#Artikel20
  - number: '21'
    text: |-
      1 De keuringsinstantie stelt in opdracht van Onze Minister bij de fabrikant aan wie deze instantie voor een type
      spoorvoertuig of onderdeel een certificaat van overeenstemming als bedoeld in [artikel 4, eerste lid][ref1],
      heeft afgegeven, onderzoek in of de productie van de spoorvoertuigen of onderdelen waarop dat certificaat
      betrekking heeft overeenstemt met de gegevens in het betrokken certificaat en met de gegevens in het betrokken
      informatiedossier.

      2 De met het onderzoek belaste medewerkers van de keuringsinstantie beschikken over de bevoegdheden, bedoeld in de
      [artikelen 5:15 tot en met 5:18 van de Algemene wet bestuursrecht][ref2]. De [artikelen 5:12][ref3], [5:13][ref4]
      en [5:20 van de Algemene wet bestuursrecht][ref5] zijn van overeenkomstige toepassing.

      3 De keuringsinstantie stelt een rapport op van de resultaten van het onderzoek, bedoeld in het eerste lid, en
      zendt een afschrift daarvan aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0017622#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel515
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel512
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel513
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel520
    url: https://wetten.overheid.nl/BWBR0017622/2007-05-16#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0017622
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
