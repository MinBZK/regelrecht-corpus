  - number: '35'
    text: >-
      Onze Minister legt het RIC en het RIV ter inzage. Van de terinzagelegging wordt mededeling gedaan in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0017622/2007-05-16#Artikel35
  - number: '36'
    text: >-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0017622/2007-05-16#Artikel36
  - number: '37'
    text: 'Dit besluit wordt aangehaald als: Besluit keuring spoorvoertuigen.'
