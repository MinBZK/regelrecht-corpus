  - number: '22'
    text: |-
      De fabrikant, bedoeld in [artikel 21, eerste lid][ref1], is verplicht om in geval van gebrek aan overeenstemming
      als bedoeld in dat lid, dit gebrek op eerste vordering van de keuringsinstantie en binnen een door deze instantie
      te bepalen termijn te herstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0017622#Artikel21
    url: https://wetten.overheid.nl/BWBR0017622/2007-05-16#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0017622
        artikel: '21'
        hoofdstuk: II
        paragraaf: '5'
  - number: '23'
    text: |-
      1 Indien de keuringsinstantie vaststelt, dat een spoorvoertuig of onderdeel waarvoor deze instantie een
      goedkeuringscertificaat als bedoeld in de [artikelen 4, tweede lid][ref1], [6][ref2] of [12, tweede lid][ref3],
      heeft afgegeven, niet langer voldoet aan de bij ministeriële regeling als bedoeld in [artikel 4, eerste lid][ref4],
      of [artikel 6][ref5] gestelde eisen, stelt deze instantie de spoorwegonderneming, die het spoorvoertuig of
      onderdeel gebruikt, of de eigenaar of houder daarvan in de gelegenheid het gebrek te herstellen binnen een door
      deze instantie te stellen termijn.

      2 Indien de spoorwegonderneming, eigenaar of houder niet voldoet aan het eerste lid, doet de keuringsinstantie
      daarvan melding aan Onze Minister, die het betrokken goedkeuringscertificaat kan intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0017622#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0017622#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0017622#Artikel12
