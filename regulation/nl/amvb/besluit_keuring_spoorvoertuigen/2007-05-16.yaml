  - number: '24'
    text: |-
      Indien de fabrikant, bedoeld in [artikel 21, eerste lid][ref1], niet voldoet aan de verplichtingen, bedoeld in
      [artikel 5:20 van de Algemene wet bestuursrecht][ref2] of in [artikel 22][ref3], kan Onze Minister, gehoord de
      keuringsinstantie, het betrokken certificaat van overeenstemming intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0017622#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel520
      [ref3]: https://wetten.overheid.nl/BWBR0017622#Artikel22
