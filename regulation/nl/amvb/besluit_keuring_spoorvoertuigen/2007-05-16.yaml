preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van de Staatssecretaris van Verkeer en Waterstaat van 16 september 2003, nr. HDJZ/S&W/2003-1881;


    Gelet op de artikelen 37, tweede lid, 38, 39, eerste lid, 40, tweede lid, 41, 45, 48 en 107 van de Spoorwegwet;


    De Raad van State gehoord (advies van 1 december 2003, nr. W09.03.0390/V);


    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 29 november 2004, nr. HDJZ/S&W/2004-2897;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0017622/2007-05-16#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. wet: de [Spoorwegwet][ref1];

      b. goedkeuringscertificaat: certificaat als bedoeld in [artikel 36, eerste lid, onderdeel a][ref2], of
      [artikel 39, eerste lid, onderdeel c, van de wet][ref3];

      c. RIC: Overeenkomst inzake het wederzijdse gebruik van personenrijtuigen en bagagewagens in het internationale
      verkeer;

      d. RIV: Overeenkomst inzake het wederzijdse gebruik van goederenwagons in het internationale verkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0015007
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel39
    url: https://wetten.overheid.nl/BWBR0017622/2007-05-16#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0015007
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '36'
      - id: ref3
        bwb_id: BWBR0015007
        artikel: '39'
  - number: '2'
    text: >-
      1 De keuringsinstantie keurt op aanvraag een spoorvoertuig of een onderdeel daarvan. De keuring betreft het
      ontwerp, de beproeving en de productie van het voertuig of het onderdeel.


      2 De keuring kan geschieden van een type voertuig of onderdeel of van een afzonderlijk voertuig of onderdeel.
    url: https://wetten.overheid.nl/BWBR0017622/2007-05-16#Artikel2
  - number: '3'
    text: >-
      1 De aanvraag voor een keuring wordt ingediend door:


      a. de fabrikant van het spoorvoertuig of onderdeel indien het betreft een keuring van een type voertuig of
      onderdeel;


      b. de fabrikant, een spoorwegonderneming, de eigenaar of de houder van een spoorvoertuig of onderdeel indien het
      betreft een keuring van een afzonderlijk voertuig of onderdeel.


      2 Bij de aanvraag wordt een informatiedossier overgelegd.
    url: https://wetten.overheid.nl/BWBR0017622/2007-05-16#Artikel3
  - number: '4'
    text: >-
      1 Betreft de keuring een type voertuig of onderdeel dan geeft de keuringsinstantie daarvoor een certificaat van
      overeenstemming af indien het voertuig of het onderdeel in overeenstemming is met het informatiedossier en het
      voldoet aan de bij ministeriële regeling gestelde eisen.


      2 Voor elk overeenkomstig dit type geconstrueerd voertuig of onderdeel dat vergezeld gaat van een verklaring van de
      fabrikant waarin deze overeenstemming wordt bevestigd, geeft de keuringsinstantie op aanvraag zonder nadere keuring
      een goedkeuringscertificaat af.
    url: https://wetten.overheid.nl/BWBR0017622/2007-05-16#Artikel4
  - number: '5'
    text: |-
      De [artikelen 2 tot en met 4][ref1] zijn van overeenkomstige toepassing op de keuring van gebruikte spoorvoertuigen
      die tot eenzelfde type behoren en waaraan identieke wijzigingen in de constructie, inrichting of uitrusting zijn
      aangebracht, met dien verstande:

      a. dat de aanvraag voor een zodanige keuring wordt ingediend door de eigenaar van die spoorvoertuigen, en

      b. dat een verklaring als bedoeld in [artikel 4, tweede lid][ref2], wordt afgegeven door de eigenaar van die
      spoorvoertuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0017622#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017622#Artikel4
    url: https://wetten.overheid.nl/BWBR0017622/2007-05-16#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0017622
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017622
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: '6'
    text: >-
      Betreft de keuring een afzonderlijk voertuig of onderdeel dan geeft de keuringsinstantie daarvoor een
      goedkeuringscertificaat af, indien het voertuig of het onderdeel in overeenstemming is met het informatiedossier en
      het voldoet aan de bij ministeriële regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0017622/2007-05-16#Artikel6
  - number: '7'
    text: |-
      Voor een spoorvoertuig of onderdeel waarvoor een certificaat van overeenstemming als bedoeld in
      [artikel 4, eerste lid][ref1], of een goedkeuringscertificaat als bedoeld in [artikel 6][ref2] is afgegeven, kan de
      keuringsinstantie een merkteken verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0017622#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0017622#Artikel6
    url: https://wetten.overheid.nl/BWBR0017622/2007-05-16#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017622
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017622
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: '8'
    text: |-
      Met een goedkeuringscertificaat als bedoeld in [artikel 4, tweede lid][ref1], of [artikel 6][ref2], dat geldig is
      voor het verkeer over hoofdspoorwegen binnen Nederland, wordt gelijkgesteld een vergelijkbaar document afgegeven
      met inachtneming van het RIC of het RIV door de bevoegde instantie in de zin van deze overeenkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0017622#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0017622#Artikel6
    url: https://wetten.overheid.nl/BWBR0017622/2007-05-16#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0017622
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017622
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: '9'
    text: |-
      1 In afwijking van [artikel 4, eerste lid][ref1], of [artikel 6][ref2] mag de keuringsinstantie in geval van
      spoorvoertuigen of onderdelen waarin technologieën of concepten zijn verwerkt, die of wegens hun specifieke aard
      niet aan een of meer van de in die artikelen bedoelde eisen kunnen voldoen, of gelijkwaardig zijn aan bestaande
      eisen, van die eisen afwijken, indien deze technologieën of concepten tenminste dezelfde waarborgen bieden voor de
      veiligheid en de interoperabiliteit van het verkeer over de hoofdspoorwegen als die eisen.

      2 De afwijking wordt afzonderlijk vermeld in het betrokken certificaat van overeenstemming of in het betrokken
      goedkeuringscertificaat.

      3 Bij ministeriële regeling worden nadere regels gesteld over het eerste lid.

      4 Bij toepassing van het eerste lid voor zover het betreft andere eisen dan die gebaseerd op het Verdrag, hoort de
      keuringsinstantie Onze Minister en de beheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0017622#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0017622#Artikel6
    url: https://wetten.overheid.nl/BWBR0017622/2007-05-16#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0017622
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017622
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: '10'
    text: |-
      Een goedkeuringscertificaat behoeft wijziging indien ten aanzien van het betrokken spoorvoertuig of onderdeel
      wijziging heeft plaatsgevonden van:

      a. gegevens vermeld in het informatiedossier, bedoeld in [artikel 4, eerste lid][ref1], respectievelijk
      [artikel 6][ref2];

      b. technische aspecten waaromtrent bij de ministeriële regeling, bedoeld in [artikel 4, eerste lid][ref3],
      respectievelijk [artikel 6][ref4], eisen zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0017622#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0017622#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0017622#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0017622#Artikel6
    url: https://wetten.overheid.nl/BWBR0017622/2007-05-16#Artikel10
    references:
