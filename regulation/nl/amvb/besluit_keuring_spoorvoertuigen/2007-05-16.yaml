  - number: '25'
    text: >-
      De geldigheid van een goedkeuringscertificaat vervalt van rechtswege bij de definitieve buitengebruikstelling van
      het betrokken spoorvoertuig.
    url: https://wetten.overheid.nl/BWBR0017622/2007-05-16#Artikel25
  - number: '26'
    text: |-
      1 Een EG-keuringsverklaring als bedoeld in [artikel 36, eerste lid, van de wet][ref1], wordt afgegeven door degene
      die de fabricage van een spoorvoertuig of de uitrusting daarvan dan wel de vernieuwing of verbetering van een
      bestaand spoorvoertuig aanbesteedt, of door diens in Nederland gevestigde gemachtigde.

      2 Een EG-keuringsverklaring voldoet aan bijlage V van richtlijn 2001/16/EG, onderscheidenlijk bijlage V van
      richtlijn 96/48/EG.

      3 Onder vernieuwing wordt verstaan belangrijke vervangingswerkzaamheden waarbij een bestaand spoorvoertuig of
      de uitrusting daarvan wordt gewijzigd en die geen wijziging van de algemene prestaties van dat spoorvoertuig tot
      gevolg hebben.

      4 Onder verbetering wordt verstaan belangrijke werkzaamheden waarbij een bestaand spoorvoertuig of de uitrusting
      daarvan wordt gewijzigd en die een verbetering van de algemene prestaties van het spoorvoertuig tot gevolg hebben.

      5 Degene die de verbetering of vernieuwing van een bestaand spoorvoertuig aanbesteedt, dient bij Onze Minister een
      dossier in waarin het project beschreven wordt.

      6 Onze Minister bepaalt op basis van het dossier, bedoeld in het vijfde lid, dat een nieuwe EG-keuringsverklaring
      moet worden afgegeven indien:

      a. de omvang van de voorgenomen verbetering of vernieuwing dit volgens hem noodzakelijk maakt, of

      b. de verbetering of vernieuwing gevolgen heeft voor de algehele veiligheid van het spoorvoertuig.

      7 De krachtens [artikel 4][ref2] onderscheidenlijk [artikel 6][ref3], bij ministeriële regeling vastgestelde
      eisen gelden voor de afgifte van een EG-keuringsverklaring als technische specificaties inzake interoperabiliteit,
      bedoeld in artikel 2, onderdeel g, van richtlijn 2001/16/EG.

      8 Bij ministeriële regeling worden eisen vastgesteld ter uitvoering van de technische specificaties inzake
      interoperabiliteit als bedoeld in artikel 2, onderdeel g, van richtlijn 96/48/EG onderscheidenlijk in artikel 2,
      onderdeel g, van richtlijn 2001/16/EG, die voor de afgifte van een EG-keuringsverklaring als zodanige specificaties
      gelden.

      9 Degene die voor een spoorvoertuig een EG-keuringsverklaring afgeeft dan wel heeft afgegeven, verstrekt aan
      Onze Minister de gegevens, die op grond van de toepasselijke technische specificaties inzake interoperabiliteit,
      bedoeld in artikel 2, onderdeel g, van richtlijn 96/48/EG onderscheidenlijk in artikel 2, onderdeel g, van
      richtlijn 2001/16/EG in de registers voor rollend materieel, bedoeld in artikel 22 bis, van richtlijn 96/48/EG
      onderscheidenlijk artikel 24 van richtlijn 2001/16/EG, moeten worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0017622#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0017622#Artikel6
