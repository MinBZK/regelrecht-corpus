  - number: '33'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over het onderhoud, bedoeld in
      [artikel 48 van de wet][ref1]. Deze regels kunnen onder meer betrekking hebben op de periodiciteit van de
      onderhoudscontroles, de te controleren onderdelen, de periodieke vervanging van onderdelen en de bij de controle
      toe te passen meetmethoden.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel48
