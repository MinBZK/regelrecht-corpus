  - number: '30'
    text: |-
      De spoorwegonderneming doet de in [artikel 45 van de wet][ref1] bedoelde mededeling schriftelijk aan Onze Minister,
      met opgave van de gegevens die van belang zijn voor de identificatie van het betrokken spoorvoertuig en van de
      eigenaar of houder daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel45
    url: https://wetten.overheid.nl/BWBR0017622/2007-05-16#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '45'
  - number: '31'
    text: |-
      1 De keuringsinstantie voert een deugdelijke registratie terzake van:

      a. de krachtens de wet verrichte keuringen en afgegeven, gewijzigde, ingetrokken of geweigerde certificaten;

      b. de onderzoeken, bedoeld in de [artikelen 38, eerste lid onderdeel c][ref1], en
      [41, eerste lid onderdeel b, van de wet][ref2].

      2 De keuringsinstantie bewaart:

      a. afschriften van technische dossiers als bedoeld in [artikel 19][ref3];

      b. de rapporten, bedoeld in [artikel 21, vierde lid][ref4].

      3 Bij ministeriële regeling kunnen over het eerste en over het tweede lid nadere regels worden gesteld.

      4 De gegevens, bedoeld in het eerste lid, en de bescheiden, bedoeld in het tweede lid, worden gedurende de gehele
      levensduur van het betrokken spoorvoertuig bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel38
