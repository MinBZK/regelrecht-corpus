        bwb_id: BWBR0015007
        artikel: '39'
  - number: '28'
    text: |-
      1 De aanvraag voor afgifte of wijziging van een inzetcertificaat voor een spoorvoertuig of typen spoorvoertuigen
      als bedoeld in [artikel 36, vierde lid, van de wet][ref1], voor gebruik op de hoofdspoorweginfrastructuur,
      wordt ingediend door de spoorwegonderneming die het voertuig gebruikt of door de eigenaar of houder van het
      spoorvoertuig.

      2 Voor de toepassing van het eerste lid wordt onder houder van het spoorvoertuig verstaan degene die als eigenaar
      of anderszins beschikkingsbevoegde het voertuig duurzaam als transportmiddel exploiteert.

      3 Voor het verkrijgen van een inzetcertificaat voldoen spoorvoertuigen aan door Onze Minister gestelde eisen inzake
      compatibiliteit als bedoeld in [artikel 38, eerste lid, onderdeel a, van de wet][ref2].

      3 De aanvraag, die vergezeld gaat van een door de keuringsinstantie afgegeven compatibiliteitsverklaring, wordt
      ingediend bij Onze Minister.

      4

      5 Onze Minister vermeldt op het inzetcertificaat de voor dat spoorvoertuig geldende identificatiecode, bedoeld in
      artikel 14 van richtlijn 96/48/EG onderscheidenlijk artikel 14 van richtlijn 2001/16/EG.

      6 Onze Minister verbindt aan het inzetcertificaat de voorschriften dat de houder van dat certificaat:

      a. de daarin vermelde identificatiecode op het spoorvoertuig aanbrengt of doet aanbrengen;

      b. het spoorvoertuig overeenkomstig de essentiële eisen van richtlijn 96/48/EG onderscheidenlijk richtlijn 2001/16/
      EG exploiteert en onderhoudt;

      c. onverwijld mededeling doet aan Onze Minister van de wijziging van eigenaar of houder van het spoorvoertuig.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel38
    url: https://wetten.overheid.nl/BWBR0017622/2007-05-16#Artikel28
