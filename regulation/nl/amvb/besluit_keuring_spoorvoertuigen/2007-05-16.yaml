  - number: '29'
    text: |-
      1 Onze Minister kan ontheffing verlenen van de eisen, bedoeld in de [artikelen 4, eerste lid][ref1], [6][ref2]
      en [28, tweede lid][ref3].

      2 De fabrikant, de spoorwegonderneming, de eigenaar of de houder van een spoorvoertuig leggen bij een aanvraag voor
      een ontheffing de bescheiden over en verstrekken de inlichtingen die Onze Minister nodig acht.

      3 Onze Minister vermeldt in de beschikking tot ontheffingverlening in ieder geval:

      a. de eisen waarvan ontheffing is verleend;

      b. de beperkingen waaronder de ontheffing is verleend en de voorschriften die aan de ontheffing zijn verbonden;

      c. de datum van afgifte;

      d. de geldigheidsduur.


      [ref1]: https://wetten.overheid.nl/BWBR0017622#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0017622#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0017622#Artikel28
