  - number: '50'
    text: |-
      1 Voor iedere regionale eenheid is er een commissie van toezicht op de arrestantenzorg, bestaande uit
      onafhankelijke leden, die tot taak heeft:

      a. toezicht te houden op de arrestantenzorg;

      b. jaarlijks voor 1 maart rapport uit te brengen aan de korpschef en de politiechef over haar werkzaamheden en
      bevindingen over het voorgaande jaar;

      c. gevraagd en ongevraagd aan de korpschef en de politiechef advies uit te brengen en inlichtingen te geven omtrent
      aangelegenheden betreffende de arrestantenzorg.

      2 Onze Minister benoemt, herbenoemt, schorst en ontslaat de voorzitter, de plaatsvervangend voorzitter en de
      overige leden van de commissies.

      3 Voor de benoeming en herbenoeming als lid komt in ieder geval niet in aanmerking de persoon tegen wie
      bezwaar bestaat tegen de vervulling van de functie hetgeen blijkt uit justitiële gegevens als bedoeld in
      [artikel 1, onder a, van de Wet justitiële en strafvorderlijke gegevens][ref1] of politiegegevens als bedoeld
      in [artikel 4:3, eerste lid, aanhef, van het Besluit politiegegevens][ref2]. De bezwaren hebben betrekking op het
      vertrouwelijk karakter van de functie alsmede de aan de functie verbonden bevoegdheden. De korpschef adviseert Onze
      Minister bij het onderzoek of bezwaren bestaan tegen de vervulling van de functie.

      4 De leden van de commissies ontvangen van de ambtenaren van politie alle door hen gewenste inlichtingen ten
      behoeve van de in het eerste lid genoemde taak.

      5 Bij ministeriële regeling worden regels gesteld over de bevoegdheden, de samenstelling, de werkwijze van, de
      afstemming tussen en de jaarlijkse rapportage door de commissies alsmede over de benoeming, de herbenoeming, de
      schorsing en het ontslag en de vergoeding van de leden.

      6 Het jaarverslag, bedoeld in [artikel 37, eerste lid, van de Politiewet 2012][ref3], doet verslag over de
      arrestantenzorg bij de politie alsmede over de wijze waarop gevolg is gegeven aan de rapporten van de commissies
      van toezicht op de arrestantenzorg.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0023086#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel37
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel50
