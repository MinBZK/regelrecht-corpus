  - number: '2'
    text: |-
      Bij ministeriële regeling worden ambtenaren van politie aangewezen die naast de politiechef deel uitmaken van de
      leiding van een eenheid.
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel2
  - number: '3'
    text: |-
      1 Er zijn twee landelijke eenheden als bedoeld in [artikel 25, eerste lid, onder b, van de Politiewet 2012][ref1],
      genaamd: de Eenheid landelijke expertise en operaties en de Eenheid landelijke opsporing en interventies.

      2 De Eenheid landelijke expertise en operaties bestaat uit de leiding van die landelijke eenheid en de volgende
      onderdelen:

      a. de Staf Eenheid landelijke expertise en operaties;

      b. de Dienst bedrijfsvoering Eenheid landelijke expertise en operaties;

      c. de Dienst landelijk operationeel centrum;

      d. de Dienst specialistische operaties;

      e. de Dienst landelijke intelligenceorganisatie;

      f. de Dienst Infrastructuur; en

      g. de Dienst koninklijke en diplomatieke beveiliging.

      3 De Eenheid landelijke opsporing en interventies bestaat uit de leiding van die landelijke eenheid en de volgende
      onderdelen:

      a. de Staf Eenheid landelijke opsporing en interventies;

      b. de Dienst bedrijfsvoering Eenheid landelijke opsporing en interventies;

      c. de Dienst landelijke recherche;

      d. de Dienst speciale interventies;

      e. het Onderdeel afgeschermde operaties; en

      f. het Onderdeel intelligence.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel25
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '25'
  - number: '4'
    text: |-
      De Staf Eenheid landelijke expertise en operaties en de Staf Eenheid landelijke opsporing en interventies hebben in
      ieder geval tot taak de ondersteuning van de leiding van de landelijke eenheid waarvan zij onderdeel zijn.
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel4
  - number: '5'
    text: |-
      De Dienst bedrijfsvoering Eenheid landelijke expertise en operaties en de Dienst bedrijfsvoering Eenheid landelijke
      opsporing en interventies hebben in ieder geval tot taak het sturen van de bedrijfsvoeringsactiviteiten ingericht
      binnen de landelijk eenheid waarvan zij onderdeel zijn en het zorgdragen voor de aansluiting tussen de vraag vanuit
      die landelijke eenheden en de door het Politiedienstencentrum te leveren producten en diensten.
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel5
  - number: '6'
    text: |-
      De Dienst landelijk operationeel centrum heeft in ieder geval tot taak:

      a. het monitoren, ondersteunen en coördineren van grootschalige operaties;

      b. het aannemen en doorgeleiden van via het landelijke telefoonnummer 112 middels een mobiel netwerk ontvangen
      meldingen van spoedeisende situaties; en

      c. het aannemen en doorgeleiden van via het landelijke telefoonnummer 144 ontvangen meldingen over mishandeling
      of verwaarlozing van dieren, dieren in acute nood, gewonde dieren of dieren die een gevaar voor zichzelf of de
      veiligheid van mensen opleveren.
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel6
  - number: '7'
    text: |-
      De Dienst specialistische operaties heeft in ieder geval tot taak het leveren van hoogwaardige, specialistische
      ondersteuning ten behoeve van de uitvoering van de politietaak, waaronder:

      a. het verzamelen en verwerken van opsporings- en handhavingsinformatie;

      b. het ontwikkelen en toepassen van innovatieve instrumenten en expertise;

      c. de inzet van bereden politie voor de uitvoering van de politietaak en protocollaire taken;

      d. de inzet van politiespeurhonden als bedoeld in
      [artikel 23, onder c, van het Besluit bewapening en uitrusting politie][ref1], en specialistische dieren;

      e. het leveren van specialistische forensische ondersteuning; en

      f. het in stand houden van een landelijk team forensische opsporing.


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel23
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0032136
        artikel: '23'
  - number: '8'
    text: |-
      De Dienst landelijke intelligenceorganisatie heeft in ieder geval tot taak:

      a. het landelijk inwinnen, coördineren en verwerken van informatie ten behoeve van de sturing op en de
      ondersteuning van de politietaak;

      b. het afhandelen van internationale rechtshulpverzoeken; en

      c. het verzorgen van internationale informatie-uitwisseling.
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel8
  - number: '9'
    text: |-
      De Dienst infrastructuur heeft in ieder geval tot taak:

      a. het uitvoeren van de politietaak op de (hoofd)infrastructuur en het signaleren en adviseren daarover en het
      coördineren daarvan;

      b. het bieden en uitvoeren van specialistische ondersteuning voor de uitvoering van de politietaak op de
      (hoofd)infrastructuur; en

      c. het geven van luchtsteun en het uitvoeren van het luchtvaarttoezicht.
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel9
  - number: '10'
    text: |-
      De Dienst koninklijke en diplomatieke beveiliging heeft in ieder geval tot taak:

      a. de persoonsbeveiliging van de leden van het Koninklijk Huis en hun gasten;

      b. het zorgdragen voor de beveiliging van personen;

      c. het opstellen en uitvoeren van beveiligingsplannen; en

      d. het verzorgen van de coördinatie van bijzondere middelen en beveiligingsmaatregelen waar deze inzet de eenheden
      overstijgt.
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel10
  - number: '11'
    text: |-
      De Dienst landelijke recherche heeft in ieder geval tot taak:

      a. het bestrijden van zware, georganiseerde vormen van criminaliteit die naar aard of organisatie een
      (inter)nationaal karakter hebben en de rechtstaat of de vitale infrastructuur ondermijnen;

      b. het afhandelen van complexe internationale rechtshulpverzoeken; en

      c. het leveren van specialistische ondersteuning bij de bestrijding van de criminaliteit.
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel11
  - number: '12'
    text: |-
      De Dienst speciale interventies heeft in ieder geval tot taak:

      a. het in stand houden van aanhoudings- en ondersteuningsteams die, indien redelijkerwijs mag worden aangenomen dat
      levensbedreigende omstandigheden tegen de politie of anderen dreigen, tot taak hebben:

      1°. het verrichten van planmatige aanhoudingen;

      2°. het bewaken en beveiligen van politie-infiltranten;

      3°. het assisteren bij het bewaken en beveiligen van het transport van getuigen, verdachten of gedetineerden; en

      4°. het assisteren bij het bewaken en beveiligen van objecten en andere werkzaamheden waarvoor toestemming is
      verkregen van het bevoegd gezag.

      b. het in stand houden van een of meer bijzondere bijstandseenheden als bedoeld in
      [artikel 59, eerste lid, van de Politiewet 2012][ref1] of onderdelen daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel59
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '59'
  - number: 12a
    text: |-
      Het Onderdeel afgeschermde operaties heeft in ieder geval tot taak: het in stand houden van infiltratieteams
      die als taak hebben het uitvoeren van een bevel tot infiltratie, tot pseudokoop of pseudodienstverlening en tot
      stelselmatige inwinning van informatie.
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel12a
  - number: 12b
    text: |-
      Het Onderdeel intelligence heeft in ieder geval tot taak: het landelijk inwinnen, coördineren en verwerken van
      informatie ten behoeve van de sturing op en de ondersteuning van de politietaak van de Eenheid landelijke opsporing
      en interventies.
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel12b
  - number: '13'
    text: |-
      De regionale eenheden worden als volgt aangeduid:

      a. de regionale eenheid in het arrondissement Noord-Nederland als: de regionale eenheid Noord-Nederland;

      b. de regionale eenheid in de arrondissementen Overijssel en Gelderland als: de regionale eenheid Oost-Nederland;

      c. de regionale eenheid in het arrondissement Midden-Nederland als: de regionale eenheid Midden-Nederland;

      d. de regionale eenheid in het arrondissement Noord-Holland als: de regionale eenheid Noord-Holland;

      e. de regionale eenheid in het arrondissement Amsterdam als: de regionale eenheid Amsterdam;

      f. de regionale eenheid in het arrondissement Den Haag als: de regionale eenheid Den Haag;

      g. de regionale eenheid in het arrondissement Rotterdam als: de regionale eenheid Rotterdam;

      h. de regionale eenheid in het arrondissement Zeeland-West-Brabant als: de regionale eenheid Zeeland-West-Brabant;

      i. de regionale eenheid in het arrondissement Oost-Brabant als: de regionale eenheid Oost-Brabant;

      j. de regionale eenheid in het arrondissement Limburg als: de regionale eenheid Limburg.
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel13
  - number: '14'
    text: |-
      1 Een regionale eenheid bestaat uit de leiding van de regionale eenheid en in ieder geval uit de volgende
      onderdelen:

      a. de Staf regionale eenheid;

      b. districten;

      c. de Dienst regionaal operationeel centrum;

      d. de Dienst regionale recherche;

      e. de Dienst regionale intelligenceorganisatie;

      f. de Dienst regionale operationele samenwerking;

      g. de Dienst bedrijfsvoering regionale eenheid.

      2 De regionale eenheid Rotterdam bestaat tevens uit een Dienst zeehavenpolitie.
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel14
  - number: '15'
    text: De Staf regionale eenheid heeft in ieder geval tot taak het ondersteunen van de leiding van de regionale eenheid.
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel15
  - number: '16'
    text: |-
      1 Een district is geografisch verdeeld in basisteams, die gebiedsgebonden basispolitiezorg uitvoeren.

      2 Een district bestaat voorts uit de leiding van het district en in ieder geval de volgende onderdelen:

      a. een districtsrecherche;

      b. een flexteam.
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel16
  - number: '17'
    text: |-
      De districtsrecherche heeft in ieder geval tot taak het opsporen en aanpakken van criminaliteit met hoge impact en
      de probleemgerichte aanpak van veelvoorkomende criminaliteit.
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel17
  - number: '18'
    text: |-
      Het flexteam heeft in ieder geval tot taak het probleemgericht inzetten van capaciteit ter ondersteuning van de
      basisteams.
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel18
  - number: '19'
    text: |-
      De Dienst regionaal operationeel centrum heeft in ieder geval tot taak zorg te dragen voor de operationele
      aansturing van politieoperaties.
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel19
  - number: '20'
    text: |-
      1 De Dienst regionale recherche heeft in ieder geval tot taak:

      a. het doen van probleem- en themagerichte onderzoeken naar criminele samenwerkingsverbanden, onderzoeken naar
      delicten met hoge impact, onderzoeken op geprioriteerde thema’s en onderzoeken naar criminele activiteiten die aan
      terrorisme kunnen worden gelieerd;

      b. het handhaven van de vreemdelingenwetgeving en het bestrijden van mensenhandel en mensensmokkel;

      c. het bieden van specialistische ondersteuning in de eenheid op het terrein van de opsporing;

      d. het, ten behoeve van de recherchefunctie, verwerken van gegevens die noodzakelijk zijn voor de opsporing van
      misdrijven als bedoeld in [artikel 10, eerste lid, onderdeel a, van de Wet politiegegevens][ref1].

      2 De Dienst regionale recherche houdt, zelfstandig of samen met een Dienst regionale recherche van één of meer
      andere regionale eenheden ten behoeve van de recherchefunctie een gegevensbestand bij voor de verwerking van
      politiegegevens, bedoeld in [artikel 10, eerste lid, onderdeel a, van de Wet politiegegevens][ref2].

      3 De Dienst regionale recherche beschikt zelfstandig of samen met een Dienst regionale recherche van één of meer
      andere regionale eenheden over één of meer observatie-eenheden die zijn belast met de uitvoering van een bevel tot
      observatie als bedoeld in de [artikelen 126g][ref3] en [126o van het Wetboek van Strafvordering][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel126g
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel126o
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 126g
      - id: ref4
        bwb_id: BWBR0001903
        artikel: 126o
  - number: '21'
    text: |-
      De Dienst regionale informatieorganisatie heeft in ieder geval tot taak het inwinnen van criminele-inlichtingen
      en openbare orde-inlichtingen, coördineren, analyseren, veredelen en verstrekken van informatie ten behoeve van de
      sturing op en de ondersteuning van de uitvoering van het politiewerk.
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel21
  - number: '22'
    text: |-
      De Dienst regionale operationele samenwerking heeft in ieder geval tot taak het ondersteunen van de uitvoering van
      het politiewerk in de regionale eenheid. Bij deze dienst zijn in ieder geval ondergebracht taken op het terrein
      van:

      a. de conflict- en crisisbeheersing;

      b. het toezicht, de handhaving en de criminaliteitsbestrijding op de infrastructuur;

      c. de arrestantenbehandeling;

      d. de inzet van diensthonden.
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel22
  - number: '24'
    text: |-
      De Dienst zeehavenpolitie van de regionale eenheid Rotterdam is in ieder geval belast met de uitvoering van de
      politietaak in het zeehavengebied van Rotterdam.
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel24
  - number: '25'
    text: |-
      De Dienst bedrijfsvoering regionale eenheid heeft in ieder geval tot taak het sturen van de bedrijfsvoering die
      binnen de regionale eenheid is ingericht en het zorgdragen voor de aansluiting tussen de vraag vanuit de regionale
      eenheid en de door het Politiedienstencentrum te leveren producten en diensten.
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel25
  - number: '26'
    text: |-
      De regionale eenheden beschikken ieder over een organisatie van mobiele eenheden ten behoeve van:

      a. het optreden ter handhaving van de openbare orde en hulpverlening, in het bijzonder bij grootschalige
      manifestaties en evenementen;

      b. het uitvoeren van evacuaties;

      c. het bewaken en beveiligen van objecten;

      d. het optreden bij crises en rampen;

      e. het uitvoeren van zoekacties;

      f. het aanhouden van ordeverstoorders.
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel26
  - number: '27'
    text: |-
      De regionale en landelijke eenheden beschikken ieder over een staf die ten behoeve van het bevoegd gezag zorg
      draagt voor de coördinatie van grootschalig politieoptreden.
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel27
  - number: '28'
    text: |-
      1 Er is een ondersteunde dienst, genaamd: Staf korpsleiding.

      2 De Staf korpsleiding bestaat uit de volgende onderdelen:

      a. de Korpsstaf;

      b. de Directie operatiën;

      c. de Directie human resource management;

      d. de Directie facility management;

      e. de Directie financiën en control;

      f. de Directie informatievoorziening;

      g. de Directie communicatie.
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel28
  - number: '29'
    text: |-
      De Korpsstaf heeft in ieder geval tot taak de ondersteuning van de korpschef en de krachtens
      [artikel 28, derde lid, van de Politiewet 2012][ref1] aangewezen ambtenaren van politie die deel uitmaken van de
      leiding van de politie.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel28
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '28'
  - number: '30'
    text: |-
      De Directie operatiën heeft in ieder geval tot taak het ontwikkelen van de strategie- en beleidsvorming van de
      politie op het terrein van de politiële taakuitvoering.
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel30
  - number: '31'
    text: |-
      De Directie human resource management heeft in ieder geval tot taak het ontwikkelen van de strategie- en
      beleidsvorming van de politie op het terrein van personeelszaken.
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel31
  - number: '32'
    text: |-
      De Directie facility management heeft in ieder geval tot taak het ontwikkelen van de strategie- en beleidsvorming
      van de politie op het terrein van huisvestiging, middelen en diensten ter ondersteuning van de politie.
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel32
  - number: '33'
    text: |-
      De Directie financiën en control heeft in ieder geval tot taak het ontwikkelen van de strategie- en beleidsvorming
      van de politie op het terrein van de financiën alsmede het stellen van financiële kaders en het bewaken van de
      doelmatige besteding van de middelen.
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel33
  - number: '34'
    text: |-
      De Directie informatievoorziening heeft in ieder geval tot taak het ontwikkelen van de strategie- en beleidsvorming
      van de politie op het terrein van de informatievoorziening.
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel34
  - number: '35'
    text: |-
      De Directie communicatie heeft in ieder geval tot taak het ontwikkelen van de strategie- en beleidsvorming van de
      politie op het terrein van de communicatie.
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel35
  - number: '36'
    text: |-
      1 Er is een ondersteunende dienst, genaamd: Politiedienstencentrum.

      2 Het Politiedienstencentrum bestaat uit de leiding van het Politiedienstencentrum en uit de volgende onderdelen:

      a. de Staf politiedienstencentrum;

      b. de Dienst human resource management;

      c. de Dienst facility management;

      d. de Dienst financiën;

      e. de Dienst informatiemanagement;

      f. de Dienst informatie- en communicatietechnologie;

      g. de Dienst communicatie.
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel36
  - number: '37'
    text: |-
      De Staf politiedienstencentrum heeft in ieder geval tot taak de ondersteuning van de leiding van het
      Politiedienstencentrum.
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel37
  - number: '38'
    text: |-
