preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Veiligheid en Justitie van 19 februari 2015, nr. 616920;

    Gelet op artikel 30, eerste lid, van de Politiewet 2012, artikel 18, eerste lid, van de Wet politiegegevens en
    artikel 9, eerste lid, van de Wet justitiële en strafvorderlijke gegevens;

    De Afdeling advisering van de Raad van State gehoord (advies van 10 april 2015, nr. W03.15.0038/II);

    Gezien het nader rapport van Onze Minister van Veiligheid en Justitie van 3 juni 2015, nr. 638459;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

        - *ambtenaren van politie:* ambtenaren als bedoeld in [artikel 2, onder a, b en c, van de Politiewet 2012][ref1];
        - *arrestantenzorg:* zorg voor de huisvesting, veiligheid, verzorging, bejegening en het vervoer van ingeslotenen
      door de regionale eenheid en door de landelijke eenheden, bedoeld in [artikel 3, eerste lid][ref2], in het gebied
      van die regionale eenheid;
        - *beheersplan:* het beheersplan, bedoeld in [artikel 37, eerste lid, van de Politiewet 2012][ref3];
        - *commissies van toezicht op de arrestantenzorg:* de commissie, bedoeld in [artikel 50][ref4];
        - *ingeslotene:* de persoon die rechtens van zijn vrijheid is beroofd, alsmede de persoon die ten behoeve van de
      hulpverlening aan hem op een politiebureau is ondergebracht;
        - *jaaraanschrijving:* jaaraanschrijving van Onze Minister waarin aanwijzingen worden gegeven aan de korpschef;
        - *jaarverslag:* het jaarverslag, bedoeld in [artikel 37, eerste lid, van de Politiewet 2012][ref5];
        - *managementrapportage:* rapportage van de korpschef aan Onze Minister waarin wordt ingegaan op de uitvoering van
      het beheersplan;
        - *politiecellencomplex:* een in een gebouw te onderscheiden ruimte waarin één of meer gangen met daaraan grenzend
      één of meer ruimten liggen die door de politie worden gebruikt voor het insluiten van personen.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
