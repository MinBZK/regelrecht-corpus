  - number: '45'
    text: |-
      Onze Minister zendt de korpschef jaarlijks vóór 1 december een jaaraanschrijving. De jaaraanschrijving heeft
      betrekking op de managementrapportages, bedoeld in [artikel 47, eerste lid][ref1], op de ontwerpen van het
      beheersplan en het jaarverslag, alsmede op de in [artikel 3 van het Besluit financieel beheer politie][ref2]
      bedoelde onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0036705#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0036711#Artikel3
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0036705
        artikel: '47'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0036711
        artikel: '3'
  - number: 45a
    text: |-
      1 De korpschef stelt de directeur van de Politieacademie jaarlijks uiterlijk op 1 maart in kennis van de behoefte
      van de politie aan politieonderwijs en werkzaamheden als bedoeld in [artikel 75 van de Politiewet 2012][ref1] voor
      het komende begrotingsjaar en de vier daaropvolgende jaren.

      2 De inkennisstelling, bedoeld in het eerste lid, bevat in ieder geval de aantallen, typen en
      niveaus van opleidingen waar de politie behoefte aan heeft. De inkennisstelling is mede gebaseerd
      op het personeelsbeleid, de landelijke en lokale beleidsprioriteiten, resultaatverplichtingen
      van de politie en de regels in het Landelijk Functiegebouw Nederlandse Politie, bedoeld in
      [artikel 1, eerste lid, van het Besluit algemene rechtspositie politie][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel1
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '75'
      - id: ref2
        bwb_id: BWBR0006516
        artikel: '1'
  - number: '46'
    text: |-
      1 In het beheersplan zijn, naast de indeling van de eenheden, bedoeld in
      [artikel 25, eerste lid, onder a, van de Politiewet 2012][ref1], in districten en basisteams, ten minste opgenomen:

      a. het sterktebeleid waaronder de sterkteverdeling, de organisatie en formatie;

      b. het personeelsbeleid waaronder de meerjarige strategische personeelsplanning, het beleid op het terrein
      van leiderschap, loopbaanbeleid, het mobiliteitsbeleid, een divers samengesteld personeelsbestand, het
      integriteitbeleid en de maatregelen die voortvloeien uit de uitvoering van de vastgestelde CAO;

      c. het ICT-beleid waaronder het beleid op het terrein van het onderhoud en vernieuwing en de informatieorganisatie;

      d. het beleid op het gebied van materieel, waaronder inkoop en huisvesting;

      e. een meerjarenraming van de behoefte aan politieonderwijs, onderzoek en kennis voor de vier op het begrotingsjaar
      volgende jaren.

      2 In het beheersplan worden de in het eerste lid, onderdelen a tot en met d, genoemde onderwerpen inzichtelijk
      gemaakt ten aanzien van de sterkte die feitelijk ter beschikking wordt gesteld aan de Politieacademie.

      3 De korpschef zendt het ontwerp van het beheersplan voor het komende begrotingsjaar voor 1 juli aan Onze Minister.

      4 Het door Onze Minister voorgenomen beheersplan wordt als bijlage bij de begroting van het Ministerie van Justitie
      en Veiligheid aan de Staten-Generaal gezonden.

      5 Onze Minister stelt het beheersplan vast na goedkeuring van de begroting voor hetzelfde jaar van zijn ministerie
      door de Staten-Generaal.

      6 De korpschef meldt een voorgenomen wijziging van de organisatie of formatie, waarvan de gevolgen nog niet in het
      beheersplan zijn opgenomen en die wijzigingen in de verdeling van de operationele sterkte tot gevolg zal hebben zo
      spoedig mogelijk, aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel25
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '25'
  - number: '47'
    text: |-
      1 De korpschef verstrekt aan Onze Minister een 4-maands-, een 8-maands- en een 12-maandsmanagementrapportage over
      de uitvoering van het beheersplan. Deze managementrapportages worden telkens uiterlijk op respectievelijk 1 juni,
      1 oktober en 1 februari verstrekt aan Onze Minister.

      2 De in het eerste lid bedoelde rapportages en het jaarverslag bevatten in ieder geval de onderstaande informatie:

      a. de omvang van de operationele sterkte, bedoeld in
      [artikel 1, onder b, van het Besluit verdeling sterkte en middelen politie][ref1] en de niet-operationele sterkte
      alsmede de verdeling van de operationele en de niet-operationele sterkte over de onderdelen van de politie;

      b. het aantal aspiranten alsmede de verdeling van de aspiranten over de onderdelen van de politie;

      c. de sterkte die en het materieel dat feitelijk ter beschikking is gesteld aan de Politieacademie;

      d. de sterkte die feitelijk ter beschikking is gesteld aan de politieonderwijsraad.

      3 De korpschef zendt jaarlijks voor 1 april een ontwerp van het jaarverslag over het voorafgaande jaar aan Onze
      Minister.

      4 Onze Minister stelt jaarlijks voor 15 mei het jaarverslag over het voorafgaande jaar vast.

      5 Het vastgestelde jaarverslag wordt als bijlage bij het jaarverslag van het Ministerie van Justitie en Veiligheid
      ter informatie aan de Staten-Generaal gezonden.

      6 De korpschef toetst in periodieke audits de mate waarin de door hem verwerkte gegevens eenduidig, consistent en
      volledig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0032333#Artikel1
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0032333
        artikel: '1'
  - number: '48'
    text: |-
      Bij ministeriële regeling worden regels gesteld over de informatieverstrekking op het terrein van het beheer door
      de korpschef aan de minister.
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel48
  - number: '49'
    text: |-
      1 De korpschef wijst de ambtenaren van politie aan die worden belast met de leiding in de politiecellencomplexen en
      over de zorg voor de ingeslotenen.

      2 Met inachtneming van de [artikelen 26][ref1], [27][ref2] en
      __REF002___________________________________________________________________________________________________________
      ________ stelt de korpschef een instructie vast voor het personeel, niet zijnde ambtenaren van politie, dat is
      belast met de zorg voor ingeslotenen.


      [ref1]: https://wetten.overheid.nl/BWBR0006589#Artikel26
