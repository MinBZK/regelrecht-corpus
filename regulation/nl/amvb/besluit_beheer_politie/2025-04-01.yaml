  - number: '51'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het politielegitimatiebewijs en het
      politiecellencomplex en kunnen regels worden gesteld met betrekking tot het politielogo en de politiehuisstijl.
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel51
