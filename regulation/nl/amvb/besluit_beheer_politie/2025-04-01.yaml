      2 De Ondersteunende dienst Politieacademie heeft tot taak het ter beschikking stellen van personeel aan de
      Politieacademie.
    url: https://wetten.overheid.nl/BWBR0036705/2025-04-01#Artikel43a
  - number: 43b
    text: |-
      1 Er is een ondersteunende dienst, genaamd: Landelijke meldkamer samenwerking.

      2 De Landelijke meldkamer samenwerking heeft tot taak de uitvoering van het beheer van de meldkamers, bedoeld in
