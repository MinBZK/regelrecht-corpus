---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_elektronische_aangifte
regulatory_layer: AMVB
publication_date: '2016-10-14'
valid_from: '2013-01-01'
bwb_id: BWBR0020864
url: https://wetten.overheid.nl/BWBR0020864/2013-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Justitie van 17 oktober 2006, directie Wetgeving, nr. 5447430/06/6;

    Gelet op artikel 163, derde lid, van het Wetboek van Strafvordering;

    De Raad van State gehoord (advies van 7 december 2006, nr. W03.06.0454/l);

    Gezien het nader rapport van Onze Minister van Justitie van 20 december 2006, nr. 5459529/06/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0020864/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder Onze Minister: Onze Minister van Veiligheid en Justitie.'
    url: https://wetten.overheid.nl/BWBR0020864/2013-01-01#Artikel1
  - number: '2'
    text: |-
      Aangifte van een strafbaar feit langs elektronische weg is mogelijk voor de in de bijlage bij dit besluit genoemde
      feiten, behoudens de daarbij vermelde uitzonderingen.
    url: https://wetten.overheid.nl/BWBR0020864/2013-01-01#Artikel2
  - number: '3'
    text: |-
      Aangifte van een strafbaar feit langs elektronische weg vindt plaats met een aangiftevoorziening die overeenkomstig
      [artikel 7][ref1] is goedgekeurd door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0020864#Artikel7
    url: https://wetten.overheid.nl/BWBR0020864/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020864
        artikel: '7'
  - number: '4'
    text: 'De aangiftevoorziening voldoet aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0020864/2013-01-01#Artikel4
  - number: 4.a
    text: |-
      iedere aangifte wordt automatisch voorzien van een uniek nummer en van de datum en het tijdstip waarop deze is
      ontvangen;
    url: https://wetten.overheid.nl/BWBR0020864/2013-01-01#Artikel4
  - number: 4.b
    text: |-
      de transmissie van de aangifte vindt op zodanige wijze plaats, dat de inhoud van de ontvangen aangifte gelijk is
      aan de inhoud van de door de aangever verstuurde aangifte;
    url: https://wetten.overheid.nl/BWBR0020864/2013-01-01#Artikel4
  - number: 4.c
    text: |-
      de aangever wordt in de gelegenheid gesteld de aangifte zoals deze is ontvangen, langs elektronische weg te
      controleren en zonodig te wijzigen alvorens de aangifte te bevestigen;
    url: https://wetten.overheid.nl/BWBR0020864/2013-01-01#Artikel4
  - number: 4.d
    text: indien in de ontvangen aangifte nadien wijzigingen worden aangebracht, is dit achteraf vast te stellen;
    url: https://wetten.overheid.nl/BWBR0020864/2013-01-01#Artikel4
  - number: 4.e
    text: er zijn passende maatregelen genomen ter beveiliging van de gegevens en tegen kennisneming door onbevoegden.
    url: https://wetten.overheid.nl/BWBR0020864/2013-01-01#Artikel4
  - number: '5'
    text: 'De aangiftevoorziening verplicht de aangever tot het invullen van ten minste de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0020864/2013-01-01#Artikel5
  - number: 5.a
    text: naam, voornamen, geboortedatum en geboorteplaats van de aangever;
    url: https://wetten.overheid.nl/BWBR0020864/2013-01-01#Artikel5
  - number: 5.b
    text: |-
      het adres waarop de aangever als ingezetene is ingeschreven onderscheidenlijk zijn feitelijke woon- of
      verblijfplaats;
    url: https://wetten.overheid.nl/BWBR0020864/2013-01-01#Artikel5
  - number: 5.c
    text: een aanduiding van het feit waarvan aangifte wordt gedaan;
    url: https://wetten.overheid.nl/BWBR0020864/2013-01-01#Artikel5
  - number: 5.d
    text: een aanduiding van de plaats waar en het tijdstip waarop het feit heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0020864/2013-01-01#Artikel5
  - number: 5.e
    text: |-
      indien de aangever niet tevens het slachtoffer is, indien bekend de persoonsgegevens van het slachtoffer
      overeenkomstig de onderdelen a en b;
    url: https://wetten.overheid.nl/BWBR0020864/2013-01-01#Artikel5
  - number: 5.f
    text: de wijze waarop de aangever een bevestiging van de aangifte wenst te ontvangen;
    url: https://wetten.overheid.nl/BWBR0020864/2013-01-01#Artikel5
  - number: 5.g
    text: |-
      een aanduiding waaruit blijkt dat het de aangever bekend is dat het doen van een valse aangifte een strafbaar feit
      is.
    url: https://wetten.overheid.nl/BWBR0020864/2013-01-01#Artikel5
  - number: '6.1'
    text: |-
      Onze Minister wijst een keuringsinstantie aan die beoordeelt of de aangiftevoorziening voldoet aan de in de
      [artikelen 4][ref1] en [5][ref2] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0020864#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020864#Artikel5
    url: https://wetten.overheid.nl/BWBR0020864/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020864
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020864
        artikel: '5'
  - number: '6.2'
    text: |-
      De keuringsinstantie stelt een protocol vast inzake de keuring van de aangiftevoorziening. Het protocol behoeft de
      goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0020864/2013-01-01#Artikel6
  - number: '6.3'
    text: Onze Minister kan nadere regels stellen omtrent de keuring.
    url: https://wetten.overheid.nl/BWBR0020864/2013-01-01#Artikel6
  - number: '6.4'
    text: |-
      De keuringsinstantie legt de uitslag van de keuring vast in een keuringsrapport, dat aan Onze Minister wordt
      toegezonden.
    url: https://wetten.overheid.nl/BWBR0020864/2013-01-01#Artikel6
  - number: '7.1'
    text: |-
      Onze Minister keurt de aangiftevoorziening slechts goed, indien deze naar het oordeel van de keuringsinstantie
      voldoet aan de in de [artikelen 4][ref1] en [5][ref2] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0020864#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020864#Artikel5
    url: https://wetten.overheid.nl/BWBR0020864/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020864
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020864
        artikel: '5'
  - number: '7.2'
    text: Onze Minister kan aan een goedkeuring voorschriften verbinden en deze zonodig wijzigen.
    url: https://wetten.overheid.nl/BWBR0020864/2013-01-01#Artikel7
  - number: '7.3'
    text: 'Onze Minister kan een verleende goedkeuring intrekken:'
    url: https://wetten.overheid.nl/BWBR0020864/2013-01-01#Artikel7
  - number: 7.3.a
    text: indien de aangiftevoorziening niet meer voldoet aan een van de gestelde eisen of
    url: https://wetten.overheid.nl/BWBR0020864/2013-01-01#Artikel7
  - number: 7.3.b
    text: op andere gronden, aan het algemeen belang ontleend.
    url: https://wetten.overheid.nl/BWBR0020864/2013-01-01#Artikel7
  - number: '7.4'
    text: |-
      Van een besluit van Onze Minister houdende de verlening, weigering of intrekking van de goedkeuring of de wijziging
      van de daaraan verbonden voorschriften wordt mededeling gedaan door publicatie in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0020864/2013-01-01#Artikel7
  - number: '8'
    text: 'Dit besluit wordt aangehaald als: Besluit elektronische aangifte.'
    url: https://wetten.overheid.nl/BWBR0020864/2013-01-01#Artikel8
  - number: '9'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0020864/2013-01-01#Artikel9
