---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: reglement_radarpatenten
regulatory_layer: AMVB
publication_date: '2008-03-27'
valid_from: '2004-01-01'
bwb_id: BWBR0010915
url: https://wetten.overheid.nl/BWBR0010915/2004-01-01
articles:
  - number: '1.01'
    text: 'In dit reglement wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel1.01
  - number: 1.01.a
    text: |-
      schip: een binnenschip met inbegrip van een klein schip en een veerpont, alsmede een drijvend werktuig en een
      zeeschip;
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel1.01
  - number: 1.01.b
    text: 'op radar varen: varen bij slecht zicht, waarbij voor het voeren van het schip gebruik wordt gemaakt van radar;'
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel1.01
  - number: 1.01.c
    text: 'schipperspatent: een Rijnpatent of een ander bewijs van vaarbevoegdheid voor de binnenvaart;'
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel1.01
  - number: 1.01.d
    text: |-
      marifoonbedieningscertificaat: een, ingevolge de op 25 januari 1996 te Brussel tot stand gekomen Regionale
      overeenkomst betreffende de marifoon in de binnenvaart, afgegeven geldig bedieningscertificaat.
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel1.01
  - number: 1.02.1
    text: |-
      Degene die op radar wil varen moet, naast het voor het te bevaren riviergedeelte benodigde schipperspatent, in
      het bezit zijn van een in overeenstemming met dit reglement afgegeven radarpatent of een ander door de Centrale
      Commissie voor de Rijnvaart erkend diploma. De criteria voor de erkenning worden in een richtlijn als bedoeld in
      [artikel 1.03][ref1] vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0010915#Artikel1
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel1.02
    references:
      - id: ref1
        bwb_id: BWBR0010915
        artikel: '1'
        hoofdstuk: '1'
  - number: 1.02.2
    text: |-
      De bevoegde autoriteit kan, in afwijking van [artikel 3.03][ref1], voor het voeren van een veerpont binnen het
      gebied van zijn bevoegdheid een radarpatent onder voorwaarden afgeven, die rekening houden met de bijzonderheden
      van het traject waarop de veerpont vaart en waarvoor het radarpatent moet gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0010915#Artikel3
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel1.02
    references:
      - id: ref1
        bwb_id: BWBR0010915
        artikel: '3'
        hoofdstuk: '3'
  - number: '1.03'
    text: |-
      Voor de toepassing van dit reglement kunnen richtlijnen worden vastgesteld. De bevoegde autoriteiten dienen zich
      aan deze richtlijnen te houden.
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel1.03
  - number: '1.04'
    text: |-
      De Centrale Commissie voor de Rijnvaart kan voorschriften van tijdelijke aard vaststellen, wanneer het voor een
      aanpassing aan de technische ontwikkeling van de binnenscheepvaart noodzakelijk wordt geacht om in dringende
      gevallen afwijkingen van dit reglement toe te laten dan wel proefnemingen mogelijk te maken, waardoor de veiligheid
      en de vlotte afwikkeling van het scheepvaartverkeer niet worden benadeeld. Deze voorschriften van tijdelijke
      aard worden door de bevoegde autoriteit gepubliceerd en hebben een geldigheidsduur van ten hoogste drie jaren.
      Zij worden in alle Oeverstaten en in België op hetzelfde tijdstip in werking gesteld en worden onder dezelfde
      voorwaarden buiten werking gesteld.
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel1.04
  - number: '2.01'
    text: 'Degene die een radarpatent wil verkrijgen moet:'
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel2.01
  - number: 2.01.a
    text: ten minste 18 jaar oud,
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel2.01
  - number: 2.01.b
    text: houder van een schipperspatent en houder van een marifoonbedieningscertificaat zijn.
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel2.01
  - number: 2.02.1
    text: |-
      De gegadigde voor een radarpatent moet een aanvraag voor toelating tot het examen en tot afgifte van een patent
      richten aan de bevoegde autoriteit, onder opgave van de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel2.02
  - number: 2.02.1.a
    text: voor- en achternaam;
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel2.02
  - number: 2.02.1.b
    text: geboortedatum en geboorteplaats;
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel2.02
  - number: 2.02.1.c
    text: adres.
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel2.02
  - number: 2.02.2
    text: 'Bij de aanvraag moeten worden overgelegd:'
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel2.02
  - number: 2.02.2.a
    text: een recente pasfoto;
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel2.02
  - number: 2.02.2.b
    text: een kopie van de identiteitskaart of het paspoort;
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel2.02
  - number: 2.02.2.c
    text: een kopie van het schipperspatent;
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel2.02
  - number: 2.02.2.d
    text: een kopie van het marifoonbedieningscertificaat.
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel2.02
  - number: 2.02.3
    text: |-
      Voor aanvang van het examen moeten de originele documenten, bedoeld in het tweede lid, onder b tot en met d, op
      verzoek worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel2.02
  - number: 3.01.1
    text: |-
      De bevoegde autoriteit benoemt één of meer examencommissies voor het afnemen van de examens. Iedere examencommissie
      bestaat uit een voorzitter, die vertegenwoordiger is van de bevoegde autoriteit, en ten minste twee examinatoren
      die voldoende terzake kundig zijn.
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel3.01
  - number: 3.01.2
    text: |-
      De examinator die toeziet op het verloop van het praktische deel van het examen moet houder van het radarpatent
      zijn.
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel3.01
  - number: '3.02'
    text: |-
      De examencommissie draagt er zorg voor dat de datum, het tijdstip en de plaats van het examen evenals de termijn
      van aanmelden tijdig bekend gemaakt worden.
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel3.02
  - number: 3.03.1
    text: |-
      De gegadigde moet tijdens het examen ten overstaan van een examencommissie als bedoeld in [artikel 3.01][ref1]
      aantonen dat hij overeenkomstig het examenprogramma, bedoeld in [bijlage 1][ref2] (theoretisch en praktisch deel),
      beschikt over voldoende kennis terzake van het voeren van een schip met behulp van radar.


      [ref1]: https://wetten.overheid.nl/BWBR0010915#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010915
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel3.03
    references:
      - id: ref1
        bwb_id: BWBR0010915
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0010915
  - number: 3.03.2
    text: |-
      Het praktische examen kan ook op een door de bevoegde autoriteit hiervoor toegelaten radarsimulator worden
      afgenomen.
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel3.03
  - number: 3.03.3
    text: |-
      Aan het in het eerste lid gestelde vereiste wordt voldaan wanneer de gegadigde een ander bewijs bezit dan
      voorgeschreven volgens dit reglement, voorzover dit bewijs door de bevoegde autoriteit van één der Rijnoeverstaten
      of België als gelijkwaardig is erkend.
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel3.03
  - number: 3.03.4
    text: |-
      De gegadigde die voor het theoretische of praktische onderdeel van het examen is gezakt, kan voor dit onderdeel
      binnen een door de bevoegde autoriteit vastgestelde termijn, die niet korter dan twee maanden mag zijn, bij
      dezelfde examencommissie een herexamen doen. Indien de gegadigde niet binnen een jaar voor het herexamen is
      geslaagd, moet hij opnieuw worden geëxamineerd voor het volledige examenprogramma.
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel3.03
  - number: 3.03.5
    text: |-
      De examencommissie deelt aan iedere gegadigde persoonlijk de uitslag van het examen mee. Op verzoek van de
      gegadigde moet de examencommissie mondeling inlichtingen geven over de door hem gemaakte fouten en kan zij hem
      tevens het inzien van de examendocumenten toestaan.
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel3.03
  - number: 3.04.1
    text: |-
      Indien de gegadigde voor het examen is geslaagd, geeft de bevoegde autoriteit aan hem het radarpatent af volgens
      het model van [bijlage 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010915
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel3.04
    references:
      - id: ref1
        bwb_id: BWBR0010915
  - number: 3.04.2
    text: Het bezit van het radarpatent kan op de schipperspatentkaart met het woord «Radar» worden aangegeven.
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel3.04
  - number: 3.04.3
    text: |-
      Op de radarpatenten, bedoeld in [artikel 1.02, tweede lid][ref1], wordt aangetekend:« Alleen geldig voor het voeren
      van een veerpont tussen ........ en ..........».


      [ref1]: https://wetten.overheid.nl/BWBR0010915#Artikel1
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel3.04
    references:
      - id: ref1
        bwb_id: BWBR0010915
        artikel: '1'
        hoofdstuk: '1'
  - number: 3.04.4
    text: |-
      Is een radarpatent onbruikbaar geworden, verloren gegaan of anderszins in het ongerede geraakt, dan geeft de
      autoriteit die het heeft afgegeven op aanvraag een vervangend patent af, dat als zodanig is gewaarmerkt. De
      houder moet ten overstaan van de bevoegde autoriteit het verlies aannemelijk maken. Een onbruikbaar geworden of
      teruggevonden patent moet bij de autoriteit die het heeft afgegeven worden ingeleverd of worden overgelegd om
      ongeldig te worden verklaard.
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel3.04
  - number: '3.05'
    text: |-
      Het radarpatent kan door de bevoegde autoriteit worden ingetrokken, wanneer de houder bij het voeren van een
      schip met behulp van radar een voor de scheepvaart gevaar veroorzakende onbekwaamheid aan de dag heeft gelegd. Het
      radarpatent kan tijdelijk dan wel permanent worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel3.05
  - number: '3.06'
    text: |-
      Het examen, de afgifte, het vervangen en de omruil van het radarpatent worden gedaan tegen een redelijk vergoeding
      van de kosten door de aanvrager. De hoogte van de kosten wordt door de bevoegde autoriteit vastgesteld. Deze kan de
      kosten geheel of ten dele vanaf het tijdstip van aanvraag vorderen.
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel3.06
  - number: 4.01.1
    text: |-
      Radardiploma's, afgegeven overeenkomstig de voorschriften die van toepassing zijn tot aan de inwerkingtreding van
      dit reglement, blijven geldig met inachtneming van die voorschriften.
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel4.01
  - number: 4.01.2
    text: |-
      [Artikel 3.04, tweede lid][ref1], is eveneens van toepassing op radardiploma's.


      [ref1]: https://wetten.overheid.nl/BWBR0010915#Artikel3
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel4.01
    references:
      - id: ref1
        bwb_id: BWBR0010915
        artikel: '3'
        hoofdstuk: '3'
  - number: '4.02'
    text: |-
      Radardiploma's, bedoeld in [artikel 4.01][ref1], kunnen voor een radarpatent als bedoeld in dit reglement worden
      omgewisseld.


      [ref1]: https://wetten.overheid.nl/BWBR0010915#Artikel4
    url: https://wetten.overheid.nl/BWBR0010915/2004-01-01#Artikel4.02
    references:
      - id: ref1
        bwb_id: BWBR0010915
        artikel: '4'
        hoofdstuk: '4'
