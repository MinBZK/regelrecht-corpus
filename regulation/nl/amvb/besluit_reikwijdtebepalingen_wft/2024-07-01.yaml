  - number: '16'
    text: |-
      Een schadeverzekeraar als bedoeld in [artikel 15][ref1]:

      a. legt in zijn statuten vast zich bij het uitoefenen van het bedrijf van schadeverzekeraar te beperken tot de
      werkzaamheden die ingevolge [artikel 3 van de Kaderwet financiële verstrekkingen Financiën][ref2] verricht mogen
      worden;

      b. vermeldt in de jaarrekening dat alleen risico’s in verzekering zijn genomen voor rekening of met garantie van de
      Staat der Nederlanden.


      [ref1]: https://wetten.overheid.nl/BWBR0020419#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0007886#Artikel3
    url: https://wetten.overheid.nl/BWBR0020419/2024-07-01#Artikel16
