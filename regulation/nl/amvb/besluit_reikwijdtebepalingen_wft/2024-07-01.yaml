  - number: '17'
    text: |-
      Met uitzondering van de [hoofdstukken 5.1][ref1], [5.3][ref2] en [5.5 van de wet][ref3], zijn de ingevolge de
      [wet][ref4] gestelde regels niet van toepassing op verenigingen en onderlinge waarborgmaatschappijen van beperkte
      omvang met zetel in Nederland die het bedrijf van natura-uitvaartverzekeraar uitoefenen en:

      a. die naar Nederlands recht zijn opgericht voor 1 januari 1995; en

      b. waarvan het aantal meerderjarige verzekerden minder dan 3000 bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Hoofdstuk5.1
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Hoofdstuk5.3
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Hoofdstuk5.5
      [ref4]: https://wetten.overheid.nl/BWBR0020368
