  - number: '18'
    text: |-
      Op een schadeverzekeraar met zetel in Zwitserland die in Nederland het bedrijf van schadeverzekeraar wil uitoefenen
      vanuit een in Nederland gevestigd bijkantoor zijn de [artikelen 19 tot en met 26][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020419#Artikel19
    url: https://wetten.overheid.nl/BWBR0020419/2024-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020419
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: 2.4.1
        afdeling: '2.4'
  - number: '19'
    text: |-
      1 Een schadeverzekeraar met zetel in Zwitserland legt bij de notificatie, bedoeld in
      [artikel 2:35 van de wet][ref1] aan de Nederlandsche Bank een certificaat over, afgegeven door de terzake bevoegde
      toezichthoudende instantie van Zwitserland, waarin wordt verklaard in welke branches de aanvrager het bedrijf van
      schadeverzekeraar mag uitoefenen en dat hij beschikt over een solvabiliteitsmarge die overeenkomt met de ingevolge
      [artikel 3:57 van de wet][ref2] vereiste solvabiliteitsmarge. Het certificaat vermeldt voorts:

      a. welk bedrag aan financiële middelen beschikbaar is om de te verwachten kosten voor de inrichting van de
      administratie en van het productienet in Nederland te dekken;

      b. welke categorieën van risico’s door de schadeverzekeraar vanuit vestigingen in Zwitserland worden gedekt.

      2 Het certificaat wordt opgemaakt overeenkomstig een door de Nederlandsche Bank vast te stellen model.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel235
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel357
    url: https://wetten.overheid.nl/BWBR0020419/2024-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 2:35
      - id: ref2
        bwb_id: BWBR0020368
        artikel: 3:57
  - number: '20'
    text: |-
      1 Bij de notificatie legt een schadeverzekeraar met zetel in Zwitserland aan de Nederlandsche Bank een programma
      van werkzaamheden over als bedoeld in [artikel 21][ref1].

      2 De Nederlandsche Bank legt het programma van werkzaamheden, zonodig vergezeld van haar opmerkingen, binnen
      twee maanden na ontvangst van de vereiste gegevens, bewijsstukken en inlichtingen voor advies voor aan de
      toezichthoudende instantie, bedoeld in [artikel 19, eerste lid][ref2].

      3 Indien de toezichthoudende instantie haar advies niet binnen drie maanden nadat zij het programma van
      werkzaamheden heeft ontvangen aan de Nederlandsche Bank heeft uitgebracht, wordt zij geacht geen bezwaar te hebben.

      4 De Nederlandsche Bank doet binnen een maand na ontvangst van het advies, bedoeld in het tweede lid, of binnen een
      maand na verloop van de termijn, bedoeld in het derde lid, van haar beslissing mededeling aan de schadeverzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0020419#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0020419#Artikel19
    url: https://wetten.overheid.nl/BWBR0020419/2024-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0020419
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: 2.4.1
        afdeling: '2.4'
      - id: ref2
        bwb_id: BWBR0020419
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: 2.4.1
        afdeling: '2.4'
  - number: '21'
    text: |-
      1 Het programma van werkzaamheden bevat:

      a. een opgave van de aard van de risico’s die de schadeverzekeraar voornemens is te dekken;

      b. een uiteenzetting omtrent de leidende beginselen op het gebied van de herverzekering;

      c. een raming van de kosten voor de inrichting van de administratie en van het productienet en bewijsstukken
      waaruit blijkt, dat het bijkantoor beschikt over de financiële middelen tot dekking daarvan, alsmede, indien
      een der te dekken risico’s behoort tot de branche Hulpverlening, een opgave van de ter beschikking van de
      schadeverzekeraar staande middelen voor het verstrekken van de overeengekomen hulp;

      d. een raming voor de eerste drie boekjaren van de andere dan de in onderdeel c bedoelde kosten van beheer, met
      name van de algemene kosten en de provisies, van het bijkantoor;

      e. een raming voor de eerste drie boekjaren van de premies en van de schaden van het bijkantoor; en

      f. een raming voor de eerste drie boekjaren van de liquiditeitspositie van het bijkantoor.

      2 De schadeverzekeraar voegt bij het programma van werkzaamheden de jaarrekening, het bestuursverslag en de
      overige gegevens, bedoeld in de [artikelen 361, eerste lid][ref1], onderscheidenlijk [391, eerste lid][ref2] en
      [392, eerste lid, onderdelen a tot en met h, van Boek 2 van het Burgerlijk Wetboek][ref3] van elk der laatste drie
      boekjaren, tenzij sedert de oprichting van de onderneming van de schadeverzekeraar nog geen drie boekjaren zijn
      verstreken en:

      a. de schadeverzekeraar is opgericht ingevolge een fusie van bestaande schadeverzekeraars; of

      b. de schadeverzekeraar is opgericht door een of meer bestaande schadeverzekeraars voor de uitoefening van een
      bepaalde branche, waarin een van de betrokken schadeverzekeraars voordien werkzaam was.

      3 Het programma van werkzaamheden bevat een opgave van de solvabiliteitsmarge met betrekking tot het gehele in en
      buiten Nederland uitgeoefende verzekeringsbedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel361
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel391
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel392
