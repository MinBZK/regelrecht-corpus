  - number: '33'
    text: |-
      De Nederlandsche Bank neemt bij de vaststelling, bedoeld in [artikel 29][ref1], in aanmerking:

      a. het onderlinge verband tussen de aan een antecedent ten grondslag liggende gedraging of gedragingen en de
      overige omstandigheden van het geval;

      b. de belangen die de [wet][ref2] beoogt te beschermen; en

      c. de overige belangen van de aanvrager en de betrokken persoon of personen.


      [ref1]: https://wetten.overheid.nl/BWBR0020419#Artikel29
