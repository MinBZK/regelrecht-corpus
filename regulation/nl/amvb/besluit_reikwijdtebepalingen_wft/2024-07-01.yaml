    text: |-
      1 Een aanvraag als bedoeld in [artikel 3:110, tweede lid van de wet][ref1] wordt gedaan met gebruikmaking van het
      daartoe door de Nederlandsche Bank vastgestelde formulier dat op verzoek aan de aanvrager ter beschikking wordt
      gesteld.

      2 Het aanvraagformulier en de daarbij ingevolge dit besluit te verstrekken gegevens worden in enkelvoud ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3110
    url: https://wetten.overheid.nl/BWBR0020419/2024-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3:110
  - number: '36'
    text: |-
      1 De gegevens, bedoeld in dit besluit, worden in een zodanige vorm verstrekt dat een goede beoordeling door de
      Nederlandsche Bank mogelijk is.

      2 De opstellers van verklaringen en rapportages ondertekenen of waarmerken deze.
    url: https://wetten.overheid.nl/BWBR0020419/2024-07-01#Artikel36
  - number: '37'
    text: |-
      1 De gegevens, bedoeld in [artikel 3:110, tweede lid, van de wet][ref1] zijn:

      a. een opgave van de naam, het adres en het telefoon- en faxnummer van de bank of banken waarvan de financiële
      instelling dochtermaatschappij is;

      b. een opgave van de naam, het adres en het telefoon- en faxnummer van de aanvrager;

      c. een opgave van de rechtsvorm van de financiële instelling;

      d. indien de aanvrager rechtspersoon is, een opgave van de statutaire zetel, de statutaire naam en de handelsnaam
      of handelsnamen;

      e. indien de aanvrager is ingeschreven in het handelsregister, een opgave van het nummer van inschrijving;

      f. indien aanwezig, een gewaarmerkt afschrift van de statuten van de financiële instelling;

      g. een opgave van de activiteiten die de aanvrager voornemens is te verrichten;

      h. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of voldaan wordt aan hetgeen ingevolge
      [artikel 3:8 van de wet][ref2] is bepaald met betrekking tot de deskundigheid van de personen die het dagelijks
      beleid bepalen van de financiële instelling;

      i. gegevens op basis waarvan de Nederlandsche Bank kan beoordelen of voldaan wordt aan hetgeen ingevolge
      [artikel 3:9 van de wet][ref3] is bepaald met betrekking tot de betrouwbaarheid van de personen die het beleid
      bepalen of mede bepalen of onderdeel zijn van een orgaan dat belast is met het toezicht op het beleid en de
      algemene gang van zaken van de aanvrager;

      j. een beschrijving van het voorgenomen beleid met betrekking tot de integere bedrijfsuitoefening als bedoeld in
      a[rtikel 3:10, eerste lid, van de wet][ref4];

      k. een beschrijving van de zeggenschapsstructuur aan de hand waarvan de Nederlandsche Bank kan beoordelen of
      voldaan wordt aan [artikel 3:16 van de wet][ref5];

      l. een beschrijving van de inrichting van de bedrijfsvoering met betrekking tot de beheerste en integere
      bedrijfsuitoefening, bedoeld in [artikel 3:17, eerste lid, van de wet][ref6];

      m. een beschrijving van het geconsolideerde toezicht, bedoeld in [artikel 3:31 van de wet][ref7]; en

      n. bescheiden waaruit het eigen vermogen, bedoeld in [artikel 3:53, eerste lid, van de wet][ref8] en de te
      verwachten solvabiliteit, bedoeld in [artikel 3:57, eerste lid, van de wet][ref9] blijken.

      2 De gegevens, bedoeld in [artikel 3:110, tweede lid, van de wet][ref10] zijn voor een aanvrager die voornemens is
      beleggingsdiensten te verlenen, onverminderd het eerste lid, een beschrijving van:

      a. de inrichting van de bedrijfsvoering, bedoeld in [artikel 4:14 van de wet][ref11];

      b. de maatregelen, bedoeld in [artikel 4:87 van de wet][ref12]; en

      c. het voorgenomen beleid, bedoeld in [4:88 van de wet][ref13].

      3 De gegevens, bedoeld in het eerste lid, onderdeel h, zijn:

      a. een opgave van de naam, de geboortedatum, de geboorteplaats, de nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;

      b. een curriculum vitae;

      c. een opgave van de relevante diploma’s;

      d. een kopie van een geldig identiteitsbewijs; en

      e. een opgave van referenten.

      4 De gegevens, bedoeld in het eerste lid, onderdeel i, zijn:

      a. een opgave van de naam, de geboortedatum, de nationaliteit, het privé-adres, het telefoon- en faxnummer en de
      functie;

      b. een kopie van een geldig identiteitsbewijs;

      c. gegevens met betrekking tot de antecedenten, bedoeld in de bijlage bij dit besluit; en

      d. een opgave van referenten.

      5 Het eerste lid, onderdeel i, is niet van toepassing indien het een persoon betreft wiens betrouwbaarheid voor de
      toepassing van de [wet][ref14] door een toezichthouder reeds is vastgesteld.


