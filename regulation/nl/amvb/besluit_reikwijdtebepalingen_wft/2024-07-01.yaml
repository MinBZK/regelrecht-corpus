  - number: '34'
    text: |-
      1 De houder van een ontheffing als bedoeld in [artikel 3:5, vierde lid, van de wet][ref1]:

      a. informeert, alvorens een overeenkomst aan te gaan terzake van het in de uitoefening van een bedrijf van het
      publiek opvorderbare gelden aan te trekken, ter beschikking te verkrijgen of ter beschikking te hebben zijn
      wederpartij duidelijk en volledig over diens rechten en plichten met betrekking tot de overeenkomst;

      b. deelt de Nederlandsche Bank schriftelijk en onverwijld nadat hij daarvan in het kader van de normale
      bedrijfsvoering kennis heeft genomen een wijziging mede in de gegevens die eerder door hemzelf of door
      een financiële onderneming aan een toezichthouder zijn verstrekt ten behoeve van de beoordeling van de
      ingevolge de [wet][ref2] gestelde eisen met betrekking tot de betrouwbaarheid van de personen, bedoeld in
      [artikel 28, eerste lid][ref3]; en

      c. deelt de Nederlandsche Bank schriftelijk het voornemen tot wijziging van de personen bedoeld in
      [artikel 28, eerste lid][ref4], mede.

      2 De houder van een ontheffing geeft geen uitvoering aan het voornemen, bedoeld in het eerste lid, onderdeel c,
      voordat de Nederlandsche Bank heeft vastgesteld dat de betrouwbaarheid van de betrokken persoon buiten twijfel
      staat. De Nederlandsche Bank neemt een besluit omtrent de betrouwbaarheid:

      a. binnen zes weken na ontvangst van de mededeling; of

      b. inden de Nederlandsche Bank binnen twee weken na ontvangst van de mededeling om nadere gegevens heeft verzocht,
      binnen zes weken na ontvangst van die gegevens, doch uiterlijk binnen dertien weken na ontvangst van de mededeling.

      3 Indien de Nederlandsche Bank een derde verzoekt om nadere gegevens als bedoeld in het tweede lid, onderdeel b,
      geeft zij daarvan kennis aan de houder.

      4 Bij de mededeling, bedoeld in het eerste lid, onderdeel c, legt de houder ten aanzien van de betrokken persoon de
      volgende gegevens over:

      a. een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;

      b. een kopie van een geldig identiteitsbewijs;

      c. gegevens met betrekking tot de antecedenten, bedoeld in [artikel 30][ref5]; en

      d. een opgave van referenten.

      5 Het tweede lid en het vierde lid, onderdelen b, c en d, zijn niet van toepassing indien de wijziging een persoon
      betreft wiens betrouwbaarheid voor de toepassing van de [wet][ref6] door een toezichthouder reeds is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel35
