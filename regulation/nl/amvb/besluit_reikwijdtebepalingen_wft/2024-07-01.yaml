      1 Een ontheffing als bedoeld in [artikel 3:5, vierde lid, van de wet][ref1], kan, onverminderd [artikel 28][ref2],
      worden verleend indien;

      a. de nakoming van alle verplichtingen van de aanvrager die zijn ontstaan door het in de uitoefening van een
      bedrijf van het publiek opvorderbare gelden aan te trekken, ter beschikking te verkrijgen of ter beschikking te
      hebben, wordt gegarandeerd door:

      1°. een onderneming met een positief geconsolideerd eigen vermogen, waarvan de aanvrager dochtermaatschappij is;

      2°. een financiële onderneming die in Nederland het bedrijf van bank mag uitoefenen of een bank met zetel in een
      door Onze Minister aan te wijzen staat waar toezicht op het uitoefenen van het bedrijf van bank wordt uitgeoefend
      dat in voldoende mate waarborgen biedt ten aanzien van de belangen die deze wet beoogt te beschermen;

      3°. de Staat der Nederlanden of een openbaar lichaam als bedoeld in
      [artikel 1, onderdeel a, van de Wet financiering decentrale overheden][ref3]; of

      4°. een onderneming die behoort tot een door de Nederlandsche Bank aan te wijzen categorie; of

      b. de aanvrager een door de Nederlandsche Bank of de Autoriteit Financiële Markten op grond van de [wet][ref4]
      verleende vergunning heeft.

      2 De aanvrager van een ontheffing als bedoeld in [artikel 3:5, vierde lid, van de wet][ref5], toont aan dat zal
      worden voldaan aan [artikel 28, eerste lid][ref6], en legt ten aanzien van de in dat lid bedoelde personen de
      volgende gegevens over:

      a. een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;

      b. een kopie van een geldig identiteitsbewijs;

      c. gegevens met betrekking tot de antecedenten, bedoeld in [artikel 30][ref7]; en

      d. een opgave van referenten.

      3 De houder van de ontheffing verstrekt binnen zes maanden na afloop van het boekjaar aan
      de Nederlandsche Bank de jaarrekening, het bestuursverslag en de overige gegevens, bedoeld
      in de [artikelen 361, eerste lid][ref8], onderscheidenlijk [391, eerste lid][ref9], en
      [392, eerste lid, onderdelen a tot en met h, van Boek 2 van het Burgerlijk Wetboek][ref10].


