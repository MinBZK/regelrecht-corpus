  - number: '22'
    text: |-
      1 In afwijking van [artikel 3:118, eerste lid, onderdeel c, van de wet][ref1] verleent de Nederlandsche Bank
      voor een overdracht van rechten en verplichtingen uit overeenkomsten aan een verzekeraar met zetel in Zwitserland
      geen toestemming alvorens de terzake bevoegde toezichthoudende autoriteit van Zwitserland heeft verklaard dat de
      overnemende verzekeraar, mede gelet op de voorgenomen overdracht, het minimumbedrag aan solvabiliteitsmarge bezit.

      2 In afwijking van [artikel 3:118, derde lid, onderdeel a, van de wet][ref2] kan de Nederlandsche Bank voor een
      overdracht als bedoeld in het eerste lid aan een verzekeraar met zetel in Zwitserland in het kader van diens
      bedrijfsuitoefening vanuit een in een andere lidstaat gelegen bijkantoor slechts toestemming verlenen, indien de
      terzake bevoegde toezichthoudende autoriteit van Zwitserland heeft verklaard dat het betrokken bijkantoor, mede
      gelet op de voorgenomen overdracht, beschikt over het minimumbedrag aan solvabiliteitsmarge.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3118
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3118
    url: https://wetten.overheid.nl/BWBR0020419/2024-07-01#Artikel22
