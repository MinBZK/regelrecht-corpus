  - number: '15'
    text: |-
      Het bepaalde ingevolge de [artikelen 1:1][ref1], [1:45, eerste lid, aanhef en onderdelen h en i][ref2],
      [1:51, tweede lid][ref3], [1:78][ref4], [1:104, eerste lid, onderdeel d][ref5], [3:38][ref6],
      [3:53, eerste tot en met vierde lid][ref7], [3:57, eerste tot en met vierde lid][ref8],
      [3:67][ref9], [3:72, derde en vijfde tot en met achtste lid][ref10], [3:88][ref11], [3:132][ref12],
      [3:135 tot en met 3:137][ref13], [3:161 tot en met 3:193][ref14], [3:195 tot en met 3:201][ref15],
      [3:203][ref16], [3:204][ref17], [3:207 tot en met 3:219][ref18], [3:221][ref19], [3:238 tot en met 3:251][ref20],
      [3:255 tot en met 3:257][ref21], [3:269 tot en met 3:273][ref22], [3:282 tot en met 3:288k][ref23],
      [4:27 eerste en derde tot en met zesde lid][ref24], en [5:68 van de wet][ref25] is niet van toepassing op een
      schadeverzekeraar als bedoeld in [artikel 1:10, aanhef en onderdeel a, van de wet][ref26] die voldoet aan de
      krachtens [artikel 3, derde lid, van de Kaderwet financiële verstrekkingen Financiën][ref27] door Onze Minister
      gestelde regels.


