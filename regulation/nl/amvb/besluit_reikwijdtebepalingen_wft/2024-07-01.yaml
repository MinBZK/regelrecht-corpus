        artikel: 3:118
  - number: '23'
    text: |-
      [Artikel 3:68 van de wet][ref1] is van toepassing op een bijkantoor in Nederland van een schadeverzekeraar met
      zetel in Zwitserland.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel368
    url: https://wetten.overheid.nl/BWBR0020419/2024-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3:68
  - number: '24'
    text: |-
      1 Indien een bijkantoor in Nederland van een schadeverzekeraar met zetel in Zwitserland niet voldoet aan het
      bij of krachtens [artikel 3:68 van de wet][ref1] bepaalde met betrekking tot de technische voorzieningen, kan de
      Nederlandsche Bank de vrije beschikking door het bijkantoor over de waarden die betrekking hebben op zijn vanuit
      Nederland uitgeoefende bedrijf van schadeverzekeraar, beperken of hem verbieden om anders dan met machtiging van de
      Nederlandsche Bank te beschikken over deze waarden.

      2 Alvorens een beperking of een verbod als bedoeld in het eerste lid uit te vaardigen stelt de Nederlandsche Bank
      de toezichthoudende instantie van Zwitserland op de hoogte van haar voornemen.

      3 Een beperking of een verbod als bedoeld in het eerste lid kan de Nederlandsche Bank ook uitvaardigen, indien de
      toezichthoudende instantie van Zwitserland of van een andere lidstaat dan Nederland waar de schadeverzekeraar met
      zetel in Zwitserland een vestiging heeft, dit verzoekt op grond van het feit dat het bijkantoor naar haar oordeel
      in soortgelijke omstandigheden verkeert als bedoeld in het eerste lid.

      4 Het bijkantoor kan de ongeldigheid van een rechtshandeling, verricht in strijd met de beperking of het verbod,
      inroepen indien de wederpartij de maatregel kende of daarvan niet onkundig kon zijn.

      5 De beperking of het verbod wordt door de Nederlandsche Bank door middel van een deurwaardersexploot aan de
      schadeverzekeraar bekend.

      6 De Nederlandsche Bank heft de beperking of het verbod op zodra het bijkantoor weer voldoet aan de in het eerste
      lid bedoelde eisen of, wanneer de beperking of het verbod uitsluitend berust op het derde lid, zodra daartoe
      naar het oordeel van de Nederlandsche Bank aanleiding bestaat, doch in elk geval zodra de in dat lid bedoelde
      toezichthoudende instantie de door haar opgelegde beperking of het verbod heeft opgeheven. De Nederlandsche Bank
      maakt de opheffing bekend aan het bijkantoor.

      7 De Nederlandsche Bank stelt de toezichthoudende instantie, bedoeld in het derde lid, alsmede de toezichthoudende
      instanties van de lidstaten waarnaar het bijkantoor, bedoeld in het eerste lid, vanuit Nederland diensten verricht
      in kennis van de uitvaardiging van de beperking of het verbod en de opheffing daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel368
    url: https://wetten.overheid.nl/BWBR0020419/2024-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3:68
  - number: '25'
    text: |-
      1 De Nederlandsche Bank vaardigt een beperking of een verbod als bedoeld in [artikel 24][ref1] uit ten aanzien
      van de hier te lande aanwezige waarden, indien de toezichthoudende instantie van Zwitserland dit verzoekt op grond
      van het feit dat de schadeverzekeraar met zetel in Zwitserland naar haar oordeel in soortgelijke omstandigheden
      verkeert als bedoeld in [artikel 3:136, tweede lid, van de wet][ref2].

      2 De schadeverzekeraar kan de ongeldigheid van een rechtshandeling, verricht in strijd met de beperking of het
      verbod, inroepen indien de wederpartij de maatregel kende of daarvan niet onkundig kon zijn.

      3 De Nederlandsche Bank heft de beperking of het verbod, bedoeld in het eerste lid, op zodra de toezichthoudende
      instantie van Zwitserland dit verzoekt. Zij maakt de opheffing bekend aan de schadeverzekeraar. Tevens doet de
      Nederlandsche Bank van het besluit tot opheffing van de beperking of het verbod mededeling aan de toezichthoudende
      instanties van de andere lidstaten waarheen de schadeverzekeraar vanuit Nederland diensten verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0020419#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3136
    url: https://wetten.overheid.nl/BWBR0020419/2024-07-01#Artikel25
    references:
