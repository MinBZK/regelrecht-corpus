      1 Het beleid van een houder van een ontheffing als bedoeld in [artikel 3:5, vierde lid, van de wet][ref1] wordt
      bepaald of mede bepaald door personen wier betrouwbaarheid buiten twijfel staat. Indien binnen de houder van een
      ontheffing een orgaan is belast met het toezicht op het beleid en de algemene gang van zaken van de houder van een
      ontheffing wordt dit toezicht gehouden door personen wier betrouwbaarheid buiten twijfel staat.

      2 De betrouwbaarheid van een persoon als bedoeld in het eerste lid staat buiten twijfel wanneer dat eenmaal door
      een toezichthouder voor de toepassing van de [wet][ref2] is vastgesteld, zolang niet een wijziging in de relevante
      feiten of omstandigheden een redelijke aanleiding geeft tot een nieuwe beoordeling.

      3 Op de vaststelling van de betrouwbaarheid van de personen, bedoeld in het eerste lid, zijn de
      [artikelen 29 tot en met 33][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0020368
      [ref3]: https://wetten.overheid.nl/BWBR0020419#Artikel29
