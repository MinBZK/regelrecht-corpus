  - number: '26'
    text: |-
      [Hoofdstuk 3A:2 van de wet][ref1] is van overeenkomstige toepassing op een bijkantoor in Nederland van een
      schadeverzekeraar met zetel in Zwitserland.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Hoofdstuk3a.2
    url: https://wetten.overheid.nl/BWBR0020419/2024-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0020368
        hoofdstuk: 3a.2
  - number: 26a
    text: |-
      1 De Nederlandsche Bank vraagt vooraf advies aan de Autoriteit Financiële Markten indien zij dient te beslissen op:

      a. een aanvraag als bedoeld in de [artikelen 2:3.0d, eerste lid][ref1], [2:3.0i, eerste lid][ref2],
      [2:3.0m, eerste lid, van de wet][ref3] teneinde te beoordelen of wordt voldaan aan hetgeen is bepaald bij
      of krachtens de [artikelen 3:73b][ref4], en [4:76a tot en met 4:76d van de wet ][ref5]en aan krachtens de
      [artikelen 17b][ref6] en [18 van het Besluit prudentiële regels Wft][ref7] gestelde regels voor zover die regels
      uitvoering geven aan internationaal aanvaarde standaarden inzake bestuur; of

      b. een aanvraag als bedoeld in de [artikel 37a van het Besluit prudentiële regels Wf][ref8]t, teneinde te
      beoordelen of wordt voldaan aan hetgeen is bepaald bij of krachtens de [artikelen 3:73b van de wet][ref9] en aan
      de krachtens [artikel 17b Besluit prudentiële regels Wft][ref10] gestelde regels voor zover die regels uitvoering
      geven aan internationaal aanvaarde standaarden inzake bestuur.

      2 De Autoriteit Financiële Markten brengt het advies schriftelijk uit binnen zes weken na het verzoek.

      3 De Nederlandsche Bank volgt het advies, bedoeld in het eerste lid, tenzij zwaarwegende redenen betreffende de
      soliditeit van de aanvrager of de stabiliteit van het financiële stelsel naar het oordeel van de Nederlandsche
      Bank aanleiding tot afwijking geven. Indien de Nederlandsche Bank overweegt af te wijken, stelt zij de Autoriteit
      Financiële Markten in de gelegenheid om haar advies mondeling toe te lichten. De Nederlandsche Bank motiveert een
      afwijking schriftelijk.

      4 Het advies, bedoeld in het eerste lid, maakt deel uit van het besluit ten aanzien van de vergunning of de
      instemming.


