  - number: '29'
    text: |-
      De Nederlandsche Bank stelt vast of de betrouwbaarheid van een persoon als bedoeld in
      [artikel 28, eerste lid][ref1], buiten twijfel staat op basis van diens voornemens, handelingen en antecedenten.


      [ref1]: https://wetten.overheid.nl/BWBR0020419#Artikel28
    url: https://wetten.overheid.nl/BWBR0020419/2024-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0020419
        artikel: '28'
        hoofdstuk: '3'
  - number: '30'
    text: |-
      De Nederlandsche Bank neemt bij de vaststelling, bedoeld in [artikel 29][ref1], in ieder geval in aanmerking:

      a. de in onderdelen 1 en 2 van de bijlage genoemde strafrechtelijke antecedenten;

      b. de in onderdeel 3 van de bijlage genoemde financiële antecedenten;

      c. de in onderdeel 4 van de bijlage genoemde toezichtantecedenten;

      d. de in onderdeel 5 van de bijlage genoemde fiscaal bestuursrechtelijke antecedenten; en

      e. de in onderdeel 6 van de bijlage genoemde overige antecedenten.


      [ref1]: https://wetten.overheid.nl/BWBR0020419#Artikel29
    url: https://wetten.overheid.nl/BWBR0020419/2024-07-01#Artikel30
    references:
