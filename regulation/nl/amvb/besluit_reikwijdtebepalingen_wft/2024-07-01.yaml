    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. wet: [Wet op het financieel toezicht][ref1];

      b. Zwitserland: Zwitserse Bondsstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
