  - number: 3.26.3
    text: |-
      Een inwendige scheidingsconstructie van een verblijfsruimte, een toiletruimte of een badruimte, voor zover die
      scheidingsconstructie niet grenst aan een andere verblijfsruimte, een andere toiletruimte of een andere badruimte,
      is, bepaald volgens NEN 2778, waterdicht.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.26
  - number: '3.27'
    text: |-
      Een scheidingsconstructie van een badruimte heeft aan een zijde die grenst aan die ruimte tot 1 m boven de vloer
      van die ruimte een volgens NEN 2778 bepaalde wateropname die gemiddeld niet groter is dan 0.01 kg/(m2.s1/2) en op
      geen enkele plaats groter dan 0,2 kg/(m2.s1/2).
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.27
  - number: 3.28.1
    text: |-
      Een te bouwen bouwwerk heeft een zodanige voorziening voor luchtverversing dat het ontstaan van een voor de
      gezondheid nadelige kwaliteit van de binnenlucht wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.28
  - number: 3.28.2
    text: |-
