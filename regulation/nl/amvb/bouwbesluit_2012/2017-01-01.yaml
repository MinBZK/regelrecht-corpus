    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.14
  - number: 2.14.5
    text: |-
      Het vierde lid geldt niet voor een logiesfunctie niet gelegen in een logiesgebouw, met een gebruiksoppervlakte van
      niet meer dan 100 m2.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.14
  - number: 2.14.6
    text: |-
      Een bouwconstructie van een tunnel bezwijkt niet binnen 30 minuten en voor zover deze onder open water ligt niet
      binnen 60 minuten bij brand in de tunnel.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.14
  - number: 2.14.7
    text: |-
      Een bouwconstructie bezwijkt bij brand in een brandcompartiment waarin de bouwconstructie niet ligt, niet binnen
      een tijdsduur die afhankelijk van de bestemming en inrichting van het bouwwerk redelijkerwijs nodig is om het
      bouwwerk bij brand te kunnen verlaten en te doorzoeken, door het bezwijken van een bouwconstructie binnen of
      grenzend aan het brandcompartiment.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.14
  - number: 2.15.1
    text: |-
      Bij het bepalen van het bezwijken van een bouwconstructie als bedoeld in [artikel 2.14][ref1] wordt uitgegaan van
      de buitengewone belastingscombinaties die volgens NEN 8700 kunnen optreden bij brand.


