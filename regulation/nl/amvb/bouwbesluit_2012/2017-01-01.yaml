  - number: 4.3.4
    text: |-
      In ten minste een verblijfsgebied ligt een verblijfsruimte met een vloeroppervlakte van ten minste 11 m2 bij een
      breedte van ten minste 3 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.3
