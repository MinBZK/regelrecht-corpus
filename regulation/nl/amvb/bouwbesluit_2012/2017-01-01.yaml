    text: Het eerste lid geldt niet voor ramen, deuren, kozijnen en daarmee gelijk te stellen constructieonderdelen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.22
  - number: 3.23.1
    text: |-
      Een scheidingsconstructie van een toiletruimte of een badruimte heeft aan een zijde die grenst aan die ruimte, tot
      1,2 m hoogte boven de vloer van die ruimte een volgens NEN 2778 bepaalde wateropname die gemiddeld niet groter is
      dan 0.01 kg/(m2.s1/2) en op geen enkele plaats groter dan 0,2 kg/(m2.s1/2).
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.23
  - number: 3.23.2
    text: |-
      Voor een badruimte geldt het in het eerste lid gestelde voorschrift ter plaatse van een bad of een douche over een
      lengte van ten minste 3 m, tot een hoogte van 2,1 m boven de vloer van die ruimte.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.23
