  - number: 3.48.1
    text: |-
      Een te bouwen bouwwerk met een opstelplaats voor een verbrandingstoestel heeft zodanige voorzieningen voor de
      toevoer van verbrandingslucht en de afvoer van rookgas, dat een voor de gezondheid nadelige kwaliteit van de
