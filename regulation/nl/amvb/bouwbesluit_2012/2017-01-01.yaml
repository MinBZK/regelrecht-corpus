        paragraaf: 2.3.1
        afdeling: '2.3'
  - number: 2.19.3
    text: |-
      De horizontaal gemeten afstand tussen een vloer, een trap of een hellingbaan en een afscheiding als bedoeld in
      [artikel 2.17][ref1] is niet groter dan 0,05 m.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.19
