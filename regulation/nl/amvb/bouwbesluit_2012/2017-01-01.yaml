  - number: 3.21.1
    text: |-
      Een uitwendige scheidingsconstructie van een verblijfsgebied, een toiletruimte of een badruimte is, bepaald volgens
      NEN 2778, waterdicht.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.21
  - number: 3.21.2
    text: |-
      Een constructie die de scheiding vormt tussen een verblijfsgebied, een toiletruimte of een badruimte, en een
      kruipruimte, met inbegrip van de op die constructie aansluitende delen van andere constructies, voor zover
      die delen van invloed zijn op het kunnen binnendringen van vocht in het verblijfsgebied, de toiletruimte of de
      badruimte, is, bepaald volgens NEN 2778, waterdicht.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.21
  - number: 3.21.3
    text: |-
      Een inwendige scheidingsconstructie van een verblijfsgebied, een toiletruimte of een badruimte, voor zover die
      scheidingsconstructie niet grenst aan een ander verblijfsgebied, een andere toiletruimte of een andere badruimte,
      is, bepaald volgens NEN 2778, waterdicht.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.21
  - number: 3.21.4
    text: |-
      Een constructie die de scheiding vormt tussen een verblijfsgebied, een toiletruimte of een badruimte, en een
      kruipruimte, met inbegrip van de op die constructie aansluitende delen van andere constructies, voor zover
      die delen van invloed zijn op de specifieke luchtvolumestroom naar het verblijfsgebied, de toiletruimte of de
      badruimte, heeft een volgens NEN 2690 bepaalde, specifieke luchtvolumestroom van ten hoogste 20.10-6 m3 /(m2.s).
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.21
  - number: 3.22.1
    text: |-
      Een scheidingsconstructie waarvoor een warmteweerstand als bedoeld in [artikel 5.3][ref1] geldt, heeft aan
      de zijde die grenst aan een verblijfsgebied een volgens NEN 2778 bepaalde factor van de temperatuur van de
      binnenoppervlakte, die niet kleiner is dan de in [tabel 3.20][ref2] aangegeven waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel3
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.22
