      - id: ref1
        bwb_id: BWBR0030461
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.1
        afdeling: '3.6'
  - number: '3.43'
    text: |-
      Een opening van een spuivoorziening als bedoeld in [artikel 3.42, eerste lid][ref1], ligt op een afstand van ten
      minste 2 m van de perceelsgrens, gemeten loodrecht op de uitwendige scheidingsconstructie van de gebruiksfunctie.
      Indien het perceel waarop de gebruiksfunctie ligt, grenst aan een openbare weg, openbaar water of openbaar groen,
      wordt die afstand aangehouden tot het hart van de weg, dat water of dat groen.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel3
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.43
