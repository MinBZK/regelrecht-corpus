  - number: 9.2.6
    text: |-
      Met een geldig certificaat als bedoeld in de [artikelen 6.20, zesde lid][ref1], en
      [6.23, vierde lid][ref2], wordt gelijkgesteld een voor 1 januari 2015 afgegeven document als bedoeld in
      [artikel 2.2.1, negende lid, van het Besluit brandveilig gebruik bouwwerken][ref3] zoals dit luidde onmiddellijk
      voorafgaand aan 1 april 2012, voor zover de geldigheidsduur van dat document niet is verstreken.


