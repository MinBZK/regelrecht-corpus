        afdeling: '2.3'
  - number: 2.19.2
    text: |-
      In afwijking van het eerste lid heeft een afscheiding als bedoeld in [artikel 2.17][ref1] tot een hoogte van 0,7
      m boven een vloer, een tredevlak of een vloer van een hellingbaan geen openingen waardoor een bol kan passeren met
      een doorsnede groter dan 0,1 m.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.19
