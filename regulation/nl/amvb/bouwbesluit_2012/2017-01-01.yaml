  - number: 2.76.1
    text: |-
      Een zijde van een constructieonderdeel die grenst aan de binnenlucht heeft een volgens NEN 6065 bepaalde bijdrage
      tot brandvoortplanting, die voldoet aan de in [tabel 2.75][ref1] aangegeven brandklasse en een rookproductie met
      een volgens NEN 6066 bepaalde rookdichtheid van ten hoogste 10 m-1.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.76
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.9.2
        afdeling: '2.9'
  - number: 2.76.2
    text: |-
      In afwijking van het eerste lid heeft een zijde van een constructieonderdeel die grenst aan de binnenlucht in
      een besloten ruimte waardoor een beschermde route voert een rookproductie met een volgens NEN 6066 bepaalde
      rookdichtheid van ten hoogste 5,4 m-1.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.76
  - number: 2.76.3
    text: |-
      In afwijking van het eerste lid heeft een zijde van een constructieonderdeel die grenst aan de binnenlucht in een
      besloten ruimte waardoor een extra beschermde vluchtroute voert een rookproductie met een volgens NEN 6066 bepaalde
      rookdichtheid van ten hoogste 5,4 m-1.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.76
  - number: 2.76.4
    text: |-
      In afwijking van het eerste lid heeft een zijde van een constructieonderdeel die grenst aan de binnenlucht in een
      cel een rookproductie met een volgens NEN 6066 bepaalde rookdichtheid van ten hoogste 5,4 m-1.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.76
  - number: 2.77.1
    text: |-
      Een zijde van een constructieonderdeel die grenst aan de buitenlucht heeft een volgens NEN 6065 bepaalde bijdrage
      tot brandvoortplanting, die voldoet aan de in [tabel 2.75][ref1] aangegeven brandklasse.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.77
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.9.2
        afdeling: '2.9'
  - number: 2.77.2
    text: |-
      In afwijking van het eerste lid hebben een deur, een raam, een kozijn of een daaraan gelijk te stellen
      constructieonderdeel een volgens NEN 6065 bepaalde bijdrage tot brandvoortplanting die voldoet aan klasse 4.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.77
  - number: 2.77.3
    text: Het eerste lid geldt niet voor de bovenzijde van een dak.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.77
  - number: 2.78.1
    text: |-
      In afwijking van [artikel 2.76][ref1] geldt voor de bovenzijde van een vloer, een trap of een hellingbaan, die
      grenst aan de binnenlucht een volgens NEN 1775 bepaalde bijdrage tot brandvoortplanting van klasse T3 en een
      rookproductie met een volgens NEN 6066 bepaalde rookdichtheid van ten hoogste 10 m-1.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.78
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.9.2
        afdeling: '2.9'
  - number: 2.78.2
    text: |-
      In afwijking van [artikel 2.77][ref1] geldt voor de bovenzijde van een vloer, trap of een hellingbaan, die grenst
      aan de buitenlucht een volgens NEN 1775 bepaalde bijdrage tot brandvoortplanting van klasse T3.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.78
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.9.2
        afdeling: '2.9'
  - number: 2.78.3
    text: |-
      In afwijking van het eerste en tweede lid geldt voor de bovenzijde van een vloer, een trap of een hellingbaan,
      waarover een extra beschermde vluchtroute voert een volgens NEN 1775 bepaalde bijdrage tot brandvoortplanting van
      klasse T1.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.78
  - number: 2.79.1
    text: |-
      Op ten hoogste 5% van de totale oppervlakte van de constructieonderdelen van elke afzonderlijke ruimte, waarvoor
      volgens de [artikelen 2.76 tot en met 2.78][ref1] een eis geldt, is die eis niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.79
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.9.2
        afdeling: '2.9'
  - number: 2.79.2
    text: |-
      Voor bouwwerken geen gebouw zijnde is op ten hoogste 5% van de totale oppervlakte van de constructieonderdelen,
      waarvoor volgens de [artikelen 2.76 tot en met 2.78][ref1] een eis geldt, die eis niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.79
