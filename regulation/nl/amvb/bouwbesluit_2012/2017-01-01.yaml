  - number: 3.4.2
    text: |-
      Een uitwendige scheidingsconstructie van een verblijfsgebied van een gebruiksfunctie in een voor de luchthaven
      Schiphol op de kaarten in [bijlage 3B, nummer 4, van het Luchthavenindelingbesluit Schiphol][ref1] aangewezen
      gebied of een krachtens de Wet luchtvaart vastgestelde 56 dB(A) L beperkingengebied of een vastgestelde 35 Ke-
      geluidzone bij een burgerluchthaven, heeft een zodanige volgens NEN 5077 bepaalde karakteristieke geluidwering
      dat het karakteristiek geluidniveau in het verblijfsgebied ten hoogste 33 dB is. Daarbij wordt uitgegaan van
      de krachtens de [Luchtvaartwet][ref2] of de [Wet luchtvaart][ref3] bepaalde geluidbelasting op de uitwendige
      scheidingsconstructie.


      [ref1]: https://wetten.overheid.nl/BWBR0014329
      [ref2]: https://wetten.overheid.nl/BWBR0002267
      [ref3]: https://wetten.overheid.nl/BWBR0005555
