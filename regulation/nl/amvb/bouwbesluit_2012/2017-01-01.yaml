  - number: '4.18'
    text: Een gebruiksfunctie heeft ten minste een badruimte.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.18
  - number: 4.19.1
    text: |-
      Een badruimte als bedoeld in [artikel 4.18][ref1] heeft een vloeroppervlakte van ten minste 1,6 m2 en een breedte
      van ten minste 0,8 m.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel4
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.19
    references:
