        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.11.1
        afdeling: '2.11'
  - number: 2.97.1
    text: |-
      Een bestaand bouwwerk is zodanig dat uitbreiding van brand in verdergaande mate wordt beperkt dan in
      [paragraaf 2.10.2][ref1] en dat veilig kan worden gevlucht.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Hoofdstuk2
