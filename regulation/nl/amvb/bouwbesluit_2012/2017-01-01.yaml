  - number: '3.36'
    text: |-
      Op het bouwen van een tijdelijk bouwwerk zijn de [artikelen 3.29 tot en met 3.34][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel3
