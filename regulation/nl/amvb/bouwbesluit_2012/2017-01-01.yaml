  - number: 3.46.1
    text: |-
      Een bestaand bouwwerk heeft een voorziening voor het zo nodig snel kunnen afvoeren van sterk verontreinigde
      binnenlucht.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.46
