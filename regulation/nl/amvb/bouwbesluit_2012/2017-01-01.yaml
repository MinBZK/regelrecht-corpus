        afdeling: '2.3'
  - number: 2.24.2
    text: |-
      In afwijking van het eerste lid heeft een afscheiding als bedoeld in [artikel 2.23, eerste lid][ref1], ter plaatse
      van een al dan niet beweegbaar raam een hoogte van ten minste 0,6 m, gemeten vanaf de vloer.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.24
