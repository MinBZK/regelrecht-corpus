  - number: 9.4.2
    text: |-
      De [afdelingen 2.16][ref1], [5.2][ref2] en [6.12][ref3] en [artikel 5.2][ref4] treden in werking op een bij
      koninklijk besluit te bepalen tijdstip, dat voor de verschillende afdelingen of onderdelen daarvan verschillend kan
      worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Hoofdstuk2
