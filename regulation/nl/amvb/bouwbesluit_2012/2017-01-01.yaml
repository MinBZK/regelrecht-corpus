  - number: 1.14.1
    text: |-
      Op het bouwen van een tijdelijk bouwwerk zijn wat betreft de [hoofdstukken 2 tot en met 6][ref1] de voorschriften
      voor een bestaand bouwwerk van toepassing, tenzij in de desbetreffende afdeling voor een voorschrift anders is
      aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.14
    references:
      - id: ref1
        bwb_id: BWBR0030461
        hoofdstuk: '2'
  - number: 1.14.2
    text: |-
      Indien een als tijdelijk bouwwerk gebouwd bouwwerk als permanent bouwwerk aanwezig blijft, wordt dat bouwwerk wat
      betreft de [hoofdstukken 2 tot en met 6][ref1] in overeenstemming gebracht met de voorschriften van een te bouwen
      bouwwerk.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.14
    references:
      - id: ref1
        bwb_id: BWBR0030461
        hoofdstuk: '2'
  - number: 1.15.1
    text: |-
      Op een bestaand bouwwerk dat in ongewijzigde samenstelling wordt verplaatst is het rechtens verkregen niveau van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.15
  - number: 1.15.2
    text: |-
      Op een tijdelijk bouwwerk is het eerste lid alleen van toepassing, indien het bouwwerk na verplaatsing een
      tijdelijk bouwwerk is.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.15
  - number: 1.16.1
    text: |-
      Een bij of krachtens de wet aanwezige installatie als bedoeld in [hoofdstuk 6][ref1] van dit besluit:


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.16
    references:
      - id: ref1
        bwb_id: BWBR0030461
        hoofdstuk: '6'
  - number: 1.16.1.a
    text: functioneert overeenkomstig de op die installatie van toepassing zijnde voorschriften;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.16
  - number: 1.16.1.b
    text: wordt adequaat beheerd, onderhouden en gecontroleerd, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.16
  - number: 1.16.1.c
    text: wordt zodanig gebruikt dat geen gevaar voor de gezondheid of de veiligheid ontstaat dan wel voortduurt.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.16
  - number: 1.16.2
    text: |-
      Na het aanbrengen of wijzigen van een kabel-, leiding- of andere doorvoer in of door een scheidingsconstructie
      waarvoor op grond van dit besluit een eis met betrekking tot de weerstand tegen branddoorslag en brandoverslag
      of rookdoorgang geldt, wordt de weerstand tegen branddoorslag en brandoverslag of rookdoorgang op adequate wijze
      gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.16
  - number: '1.17'
    text: |-
      Een constructieonderdeel waarvoor volgens de [afdelingen 2.2][ref1], [2.8][ref2] of [2.9][ref3] een eis geldt
      waaraan het constructieonderdeel uitsluitend met een aanvullende behandeling kan blijven voldoen, is voorzien
      van een geldig door het bevoegd gezag aanvaard document waaruit blijkt dat deze aanvullende behandeling adequaat
      is toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0030461#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.17
    references:
      - id: ref1
        bwb_id: BWBR0030461
        hoofdstuk: '2'
        afdeling: '2.2'
      - id: ref2
        bwb_id: BWBR0030461
        hoofdstuk: '2'
        afdeling: '2.8'
      - id: ref3
        bwb_id: BWBR0030461
        hoofdstuk: '2'
        afdeling: '2.9'
  - number: 1.18.1
    text: 'Het is verboden om zonder of in afwijking van een gebruiksmelding:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.18
  - number: 1.18.1.a
    text: 'een bouwwerk in gebruik te nemen of te gebruiken indien:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.18
  - number: 1.18.1.a.1
    text: daarin meer dan 50 personen tegelijk aanwezig zullen zijn, of
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.18
  - number: 1.18.1.a.2
    text: |-
      toepassing is gegeven aan [artikel 1.3][ref1] in verband met een in [hoofdstuk 6][ref2] of [7][ref3] uit het
      oogpunt van brandveiligheid gegeven voorschrift, en


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0030461#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.18
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
      - id: ref2
        bwb_id: BWBR0030461
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0030461
        hoofdstuk: '7'
  - number: 1.18.1.b
    text: een woonfunctie in gebruik te nemen of te gebruiken voor kamergewijze verhuur.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.18
  - number: 1.18.2
    text: |-
      Het eerste lid is niet van toepassing op het in gebruik nemen of gebruiken van een bouwwerk waarvoor een vergunning
      voor brandveilig gebruik is vereist.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.18
  - number: 1.18.3
    text: 'Het eerste lid, onderdeel a, onder 1, is niet van toepassing op het in gebruik nemen of gebruiken van:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.18
  - number: 1.18.3.a
    text: een één- of meergezinswoning;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.18
  - number: 1.18.3.b
    text: een wegtunnel.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.18
  - number: 1.18.4
    text: |-
      Het eerste lid is van overeenkomstige toepassing bij het veranderen van een bouwwerk of van het gebruik daarvan,
      indien eerder een gebruiksmelding is gedaan en door het veranderen een afwijking ontstaat van de bij die melding
      verstrekte gegevens.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.18
  - number: 1.18.5
    text: |-
      Voor de toepassing van dit artikel wordt onder bouwwerk mede verstaan een gedeelte daarvan dat is bestemd om
      afzonderlijk te worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.18
  - number: 1.19.1
    text: |-
      Een gebruiksmelding wordt ten minste vier weken voor de voorgenomen aanvang van het gebruik schriftelijk ingediend
      bij het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.19
  - number: 1.19.2
    text: |-
      Een gebruiksmelding langs elektronische weg wordt gedaan met gebruikmaking van het
      elektronische formulier dat op de datum van indiening van de gebruiksmelding beschikbaar is
      via de landelijke voorziening, bedoeld in [artikel 7.6 van de Wabo][ref1]. Op die melding is
      [artikel 4.3, eerste en tweede lid, van het Besluit omgevingsrecht][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0027464#Artikel4
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.19
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0027464
        artikel: '4'
  - number: 1.19.3
    text: |-
      Een gebruiksmelding anders dan langs elektronische weg wordt gedaan met gebruikmaking van het formulier, bedoeld
      in [artikel 4.2, eerste lid, van het Besluit omgevingsrecht][ref1]. Indien de gebruiksmelding tegelijk met de
      indiening van een aanvraag om vergunning krachtens de [Wabo][ref2] wordt gedaan, wordt van de gebruiksmelding en
      de daarbij te verstrekken gegevens en bescheiden hetzelfde aantal exemplaren ingediend als op grond van artikel
      4.2, tweede en derde lid, van het Besluit omgevingsrecht van de aanvraag om vergunning en de daarbij te verstrekken
      gegevens en bescheiden wordt ingediend. Indien de gebruiksmelding afzonderlijk wordt gedaan, worden deze en de
      daarbij te verstrekken gegevens en bescheiden in drievoud ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0024779
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.19
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0024779
  - number: 1.19.4
    text: |-
      Bij de gebruiksmelding, bedoeld in [artikel 1.18, eerste lid, onderdeel a, onder 2][ref1], verstrekt de melder
      voor zover dit naar het oordeel van het bevoegd gezag nodig is gegevens en bescheiden waarmee de gelijkwaardigheid
      voldoende aannemelijk wordt gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.19
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.5'
  - number: 1.19.5
    text: 'Bij de gebruiksmelding worden de volgende gegevens en bescheiden aan het bevoegd gezag verstrekt:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.19
  - number: 1.19.5.a
    text: naam, adres en woonplaats van de melder en indien van toepassing, van de gemachtigde om te melden;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.19
  - number: 1.19.5.b
    text: adres, kadastrale aanduiding dan wel ligging van het bouwwerk en de aard en omvang daarvan.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.19
  - number: 1.19.6
    text: |-
      Voor zover dit naar het oordeel van het bevoegd gezag nodig is om aannemelijk te maken dat het gebruik voldoet
      aan de bij of krachtens de wet gegeven voorschriften verstrekt de melder bij de gebruiksmelding, bedoeld in
      [artikel 1.18, eerste lid, onderdelen a, onder 1, en b][ref1], een situatieschets met noordpijl met een schaal die
      niet kleiner is dan 1:1.000, en per bouwlaag een plattegrondtekening met een schaal die niet kleiner is dan 1:100
      bij een gebouw met een brutovloeroppervlakte van minder dan 10.000 m2 en niet kleiner dan 1:200 bij een grotere
      brutovloeroppervlakte. Op de plattegrondtekening of een bijlage daarvan is aangegeven:


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.19
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.5'
  - number: 1.19.6.a
    text: schaalaanduiding;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.19
  - number: 1.19.6.b
    text: 'per bouwlaag:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.19
  - number: 1.19.6.b.1°
    text: hoogte van de vloer boven het meetniveau;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.19
  - number: 1.19.6.b.2°
    text: gebruiksoppervlakte, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.19
  - number: 1.19.6.b.3°
    text: maximaal aantal personen;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.19
  - number: 1.19.6.c
    text: 'per ruimte:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.19
  - number: 1.19.6.c.1°
    text: vloeroppervlakte;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.19
  - number: 1.19.6.c.2°
    text: gebruiksbestemming;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.19
  - number: 1.19.6.c.3°
    text: bij ruimten voor meer dan 25 personen, de hoogste bezetting van die ruimte, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.19
  - number: 1.19.6.c.4°
    text: opstelling van inventaris en van inrichtingselementen als bedoeld in dit besluit;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.19
  - number: 1.19.6.d
    text: 'met aanduidingen van de plaats van, voor zover deze aanwezig zijn:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.19
  - number: 1.19.6.d.1°
    text: brand- en/of rookwerende scheidingsconstructies;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.19
  - number: 1.19.6.d.2°
    text: vluchtroutes;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.19
  - number: 1.19.6.d.3°
    text: draairichting van deuren;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.19
  - number: 1.19.6.d.4°
    text: zelfsluitende deuren als bedoeld in dit besluit;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.19
  - number: 1.19.6.d.5°
    text: |-
      sluitwerk van deuren als bedoeld in [artikel 6.25][ref1] en [7.12][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel7
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.19
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.6'
      - id: ref2
        bwb_id: BWBR0030461
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.2'
  - number: 1.19.6.d.6°
    text: vluchtroute-aanduidingen;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.19
  - number: 1.19.6.d.7°
    text: noodverlichting;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.19
  - number: 1.19.6.d.8°
    text: |-
      oriëntatieverlichting als bedoeld in [artikel 6.5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.19
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.1'
  - number: 1.19.6.d.9°
    text: brandmeldcentrale en brandmeldpaneel;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.19
  - number: 1.19.6.d.10°
    text: brandslanghaspels;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.19
  - number: 1.19.6.d.11°
    text: mobiele brandblusapparaten;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.19
  - number: 1.19.6.d.12°
    text: droge blusleidingen;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.19
  - number: 1.19.6.d.13°
    text: brandweeringang;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.19
  - number: 1.19.6.d.14°
    text: sleutelkluis of -buis, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.19
  - number: 1.19.6.d.15°
    text: brandweerlift, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.19
  - number: 1.19.6.e
    text: gegevens en bescheiden over de aard en de plaats van de brandveiligheidsinstallaties.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.19
  - number: 1.19.7
    text: |-
      Bij een gebruiksmelding voor tijdelijk of seizoensgebonden gebruik van een bouwwerk wordt door de melder aangegeven
      voor welke periode of voor welke tijdvakken in een kalenderjaar het gebruik is beoogd.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.19
  - number: 1.19.8
    text: |-
      Een gebruiksmelding kan betrekking hebben op meerdere bouwwerken op hetzelfde terrein of op met elkaar
      samenhangende terreinen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.19
  - number: '1.20'
    text: |-
      De melder krijgt door of namens het bevoegd gezag een bewijs van ontvangst toegezonden of uitgereikt, waarin de
      datum van ontvangst is vermeld.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.20
  - number: 1.21.1
    text: |-
      Het bevoegd gezag kan na een melding van een gebruik als bedoeld in
      [artikel 1.18, eerste lid, onderdeel a, onder 1][ref1], nadere voorwaarden opleggen aan het gebruik indien deze
      noodzakelijk zijn voor het voorkomen, beperken en bestrijden van brand, brandgevaar en ongevallen bij brand.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.21
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.5'
  - number: 1.21.2
    text: Het is verboden in strijd te handelen met de nadere voorwaarden, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.21
  - number: 1.22.1
    text: |-
      Het bevoegd gezag kan de nadere voorwaarden, bedoeld in [artikel 1.21, eerste lid][ref1], wijzigen:


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.22
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.5'
  - number: 1.22.1.a
    text: |-
      indien een verandering van inzichten of van omstandigheden gelegen buiten het bouwwerk die bij de beoordeling van
      de melding een rol hebben gespeeld dit noodzakelijk maakt, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.22
  - number: 1.22.1.b
    text: op verzoek van de melder.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.22
  - number: 1.22.2
    text: |-
      Het bevoegd gezag gaat niet over tot wijziging van de nadere voorwaarden, bedoeld in
      [artikel 1.21, eerste lid][ref1], dan nadat het de melder in de gelegenheid heeft gesteld zijn zienswijze naar
      voren te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.22
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.5'
  - number: '1.23'
    text: |-
      Tijdens het bouwen zijn, voor zover van toepassing, de volgende bescheiden of een afschrift daarvan op het terrein
      aanwezig:
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.23
  - number: 1.23.a
    text: vergunning voor het bouwen;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.23
  - number: 1.23.b
    text: |-
      veiligheidsplan als bedoeld in [artikel 8.7][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel8
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.23
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.1'
  - number: 1.23.c
    text: |-
      afschrift van een besluit ingevolge [artikel 13][ref1], [13a][ref2], of [14 van de wet][ref3], dan wel een besluit
      tot oplegging van een last onder bestuursdwang dan wel last onder dwangsom, en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel13a
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel14
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.23
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 13a
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '14'
  - number: 1.23.d
    text: overige voor het bouwen van belang zijnde vergunningen en documenten met nadere voorwaarden en ontheffingen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.23
  - number: '1.24'
    text: |-
      Met het bouwen van een bouwwerk waarvoor vergunning is verleend wordt, onverminderd de voorwaarden bij de
      vergunning, niet begonnen voordat voor zover nodig door of namens het bevoegd gezag:
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.24
  - number: 1.24.a
    text: de rooilijnen of bebouwingsgrenzen op het bouwterrein zijn uitgezet, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.24
  - number: 1.24.b
    text: het straatpeil is uitgezet.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.24
  - number: 1.25.1
    text: |-
      Het bevoegd gezag wordt ten minste twee werkdagen voor de feitelijke aanvang van bouwwerkzaamheden waarvoor een
      vergunning voor het bouwen is verleend door de houder van die vergunning schriftelijk van de aanvang van die
      werkzaamheden, met inbegrip van ontgravingswerkzaamheden, in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.25
  - number: 1.25.2
    text: |-
      Het bevoegd gezag wordt uiterlijk op de eerste werkdag na de dag van beëindiging van de bouwwerkzaamheden waarvoor
      een vergunning voor het bouwen is verleend, door de houder van die vergunning schriftelijk van de beëindiging van
      die werkzaamheden in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.25
  - number: 1.25.3
    text: |-
      Een bouwwerk voor het bouwen waarvan een vergunning voor het bouwen is verleend, wordt niet in gebruik gegeven of
      genomen indien niet voldaan is aan het bepaalde in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.25
  - number: 1.26.1
    text: |-
      Het is verboden om zonder of in afwijking van een sloopmelding te slopen indien daarbij asbest wordt verwijderd of
      de hoeveelheid sloopafval naar redelijke inschatting meer dan 10 m3 zal bedragen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.26
  - number: 1.26.2
    text: |-
      Het eerste lid is niet van toepassing op een voornemen tot slopen dat uitsluitend bestaat uit het in het kader van
      de uitoefening van een bedrijf geheel of gedeeltelijke verwijderen van asbesthoudende:
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.26
  - number: 1.26.2.a
    text: geklemde vloerplaten onder verwarmingstoestellen;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.26
  - number: 1.26.2.b
    text: beglazingskit dat is verwerkt in de constructie van kassen;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.26
  - number: 1.26.2.c
    text: rem- en frictiematerialen;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.26
  - number: 1.26.2.d
    text: pakkingen uit verbrandingsmotoren, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.26
  - number: 1.26.2.e
    text: |-
      pakkingen uit procesinstallaties onderscheidenlijk verwarmingstoestellen met een nominaal vermogen van ten hoogste
      2.250 kW.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.26
  - number: 1.26.3
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.26
  - number: 1.26.3.a
    text: het slopen van een seizoensgebonden bouwwerk, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.26
  - number: 1.26.3.b
    text: |-
      het slopen ingevolge een besluit op grond van [artikel 13 van de wet][ref1] dan wel een besluit tot toepassing van
      bestuursdwang of oplegging van een last onder dwangsom.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel13
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.26
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '13'
  - number: 1.26.4
    text: |-
      Een sloopmelding wordt ten minste vier weken voor de voorgenomen aanvang van de sloopwerkzaamheden schriftelijk
      ingediend bij het bevoegd gezag. De in de eerste volzin bedoelde termijn is ten minste vijf werkdagen indien:
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.26
  - number: 1.26.4.a
    text: |-
      die sloopwerkzaamheden in het kader van reparatie- of mutatieonderhoudswerkzaamheden worden uitgevoerd aan een
      asbesthoudende toepassing in een gebouw en handhaving van de termijn, bedoeld in het eerste lid, tot onnodige
      leegstand van het gebouw of gedeelte daarvan zou leiden of het gebruiksgenot daarvan ernstig zou belemmeren, of
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.26
  - number: 1.26.4.b
    text: |-
      die sloopwerkzaamheden bestaan uit het anders dan in de uitoefening van een beroep of bedrijf in zijn geheel
      verwijderen van geschroefde, asbesthoudende platen waarin de asbestvezels hechtgebonden zijn, niet zijnde
      dakleien, of van asbesthoudende vloertegels of niet-gelijmde, asbesthoudende vloerbedekking, uit een woonfunctie
      of nevenfunctie daarvan, voor zover die woonfunctie of die nevenfunctie niet bedoeld zijn voor de uitoefening van
      een beroep of bedrijf en de oppervlakte van de te verwijderen asbesthoudende platen, vloerbedekking of vloertegels
      maximaal vijfendertig vierkante meter per kadastraal perceel bedraagt.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.26
  - number: 1.26.5
    text: |-
      Indien dit naar het oordeel van het bevoegd gezag nodig is, kan worden afgeweken van de in het vierde lid bedoelde
      termijnen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.26
  - number: 1.26.6
    text: 'Bij de sloopmelding worden de volgende gegevens en bescheiden aan het bevoegd gezag verstrekt:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.26
  - number: 1.26.6.a
    text: |-
      naam en adres van de eigenaar van het te slopen bouwwerk en indien van toepassing, van diegene die uit andere
      hoofde bevoegd is tot het slopen van het bouwwerk;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.26
  - number: 1.26.6.b
    text: |-
      naam en adres van diegene die de sloopwerkzaamheden zal uitvoeren, indien de uitvoerder een ander persoon is dan
      bedoeld onder a;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.26
  - number: 1.26.6.c
    text: adres, kadastrale aanduiding en aard van het te slopen bouwwerk of onderdeel daarvan;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.26
  - number: 1.26.6.d
    text: |-
      de data, de tijdstippen en een beschrijving van de wijze waarop het uitvoeren van de sloopwerkzaamheden zal
      plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.26
  - number: 1.26.6.e
    text: |-
      een veiligheidsplan als bedoeld in [artikel 8.7][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel8
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.26
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.1'
  - number: 1.26.6.f
    text: |-
      een globale inventarisatie van de aard en de hoeveelheid van de afvalstoffen die naar verwachting zullen vrijkomen
      bij de sloopwerkzaamheden en een opgave van de voorgenomen afvoerbestemming van die stoffen
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.26
  - number: 1.26.6.g
    text: |-
      indien op grond van het [Asbestverwijderingsbesluit 2005][ref1] een asbestinventarisatierapport is vereist, het
      rapport als bedoeld in [artikel 1, eerste lid, onder b, van dat besluit][ref2] dan wel een eindbeoordeling als
      bedoeld in [artikel 9, eerste en tweede lid, van dat besluit][ref3], en


      [ref1]: https://wetten.overheid.nl/BWBR0019316
      [ref2]: https://wetten.overheid.nl/BWBR0019316#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0019316#Artikel9
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.26
    references:
      - id: ref1
        bwb_id: BWBR0019316
      - id: ref2
        bwb_id: BWBR0019316
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0019316
        artikel: '9'
  - number: 1.26.6.h
    text: |-
      indien bij het uitvoeren van de sloopwerkzaamheden steenachtig afval zal vrijkomen dat ter plaatse zal worden
      gebroken, de hoeveelheid, de naam en het adres van de eigenaar van het recyclinggranulaat.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.26
  - number: 1.26.7
    text: |-
      In afwijking van het zesde lid worden de gegevens, bedoeld in onderdeel b van dat lid, ten minste twee werkdagen
      voor de feitelijke aanvang van het uitvoeren van de sloopwerkzaamheden aan het bevoegd gezag verstrekt.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.26
  - number: 1.26.8
    text: |-
      Indien tijdens het slopen asbest wordt ontdekt dat niet is opgenomen in het asbestinventarisatierapport als bedoeld
      in het zesde lid, onder g, wordt het bevoegd gezag daarvan onmiddellijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.26
  - number: 1.26.9
    text: |-
      Een sloopmelding kan betrekking hebben op meerdere bouwwerken op hetzelfde terrein of op met elkaar samenhangende
      terreinen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.26
  - number: 1.27.1
    text: |-
      Een sloopmelding wordt langs elektronische weg gedaan met gebruikmaking van het elektronische
      formulier dat op de datum van indiening van de sloopmelding beschikbaar is via de
      landelijke voorziening, bedoeld in [artikel 7.6 van de Wabo][ref1]. Op die melding is
      [artikel 4.3, eerste en tweede lid, van het Besluit omgevingsrecht][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0027464#Artikel4
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.27
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0027464
        artikel: '4'
  - number: 1.27.2
    text: |-
      Een sloopmelding anders dan langs elektronische weg wordt gedaan met gebruikmaking van het formulier, bedoeld in
      [artikel 4.2, eerste lid, van het Besluit omgevingsrecht][ref1]. Indien de melding tegelijkertijd met de indiening
      van een aanvraag om vergunning krachtens de [Wabo][ref2] wordt gedaan, is het aantal exemplaren dat van de melding
      en de daarbij te verstrekken gegevens en bescheiden wordt ingediend gelijk aan het aantal exemplaren dat van de
      aanvraag om vergunning en de daarbij te verstrekken gegevens en bescheiden op grond van artikel 4.2, tweede en
      derde lid, van het Besluit omgevingsrecht wordt ingediend. Indien de sloopmelding afzonderlijk wordt gedaan, worden
      deze en de daarbij te verstrekken gegevens en bescheiden in drievoud ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0024779
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.27
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0024779
  - number: '1.28'
    text: |-
      De melder krijgt door of namens het bevoegd gezag een bewijs van ontvangst toegezonden of uitgereikt, waarin de
      datum van ontvangst is vermeld.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.28
  - number: 1.29.1
    text: |-
      Het bevoegd gezag kan na een sloopmelding als bedoeld in [artikel 1.26][ref1] nadere voorwaarden opleggen aan
      het slopen indien deze noodzakelijk zijn voor het voorkomen of beperken van hinder of van een onveilige situatie
      tijdens het uitvoeren van de sloopwerkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.29
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.7'
  - number: 1.29.2
    text: |-
      Het bevoegd gezag kan na een sloopmelding als bedoeld in [artikel 1.26][ref1] tevens nadere voorwaarden opleggen
      over:


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.29
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.7'
  - number: 1.29.2.a
    text: het scheiden van en het op de sloopplaats gescheiden houden van het sloopafval in fracties, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.29
  - number: 1.29.2.b
    text: |-
      de wijze waarop de mededeling als bedoeld in [artikel 1.33, tweede lid][ref1], wordt gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.29
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.7'
  - number: 1.29.3
    text: Het is verboden in strijd te handelen met de nadere voorwaarden, bedoeld in het eerste en het tweede lid.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.29
  - number: 1.30.1
    text: |-
      Het bevoegd gezag kan de nadere voorwaarden, bedoeld in [artikel 1.29, eerste en tweede lid][ref1], wijzigen:


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.30
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.7'
  - number: 1.30.1.a
    text: |-
      indien een verandering van inzichten of van omstandigheden gelegen buiten de sloopwerkzaamheden die bij de
      beoordeling van de sloopmelding een rol hebben gespeeld dit noodzakelijk maakt, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.30
  - number: 1.30.1.b
    text: op verzoek van de melder.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.30
  - number: 1.30.2
    text: |-
      Het bevoegd gezag gaat niet over tot wijziging van de nadere voorwaarden, bedoeld in [artikel 1.29][ref1], dan
      nadat het de melder in de gelegenheid heeft gesteld zijn zienswijze naar voren te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.30
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.7'
  - number: '1.32'
    text: |-
      Tijdens het slopen zijn, voor zover van toepassing, de volgende bescheiden of een afschrift daarvan op het terrein
      aanwezig:
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.32
  - number: 1.32.a
    text: sloopmelding;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.32
  - number: 1.32.b
    text: |-
      veiligheidsplan als bedoeld in [artikel 8.7][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel8
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.32
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.1'
  - number: 1.32.c
    text: |-
      afschrift van een besluit ingevolge [artikel 13][ref1], [13a][ref2], of [14 van de wet][ref3], dan wel een besluit
      tot oplegging van een last onder bestuursdwang dan wel last onder dwangsom;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel13a
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel14
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.32
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 13a
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '14'
  - number: 1.32.d
    text: overige voor het slopen van belang zijnde vergunningen en documenten met nadere voorwaarden en ontheffingen, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.32
  - number: 1.32.e
    text: |-
      indien op grond van het [Asbestverwijderingsbesluit 2005][ref1] een
      asbestinventarisatierapport is vereist, een asbestinventarisatierapport als bedoeld in
      [artikel 1, eerste lid, onder b, van het Asbestverwijderingsbesluit 2005][ref2] dan wel een afschrift van de
      resultaten van de eindbeoordeling als bedoeld in [artikel 9, eerste en tweede lid, van dat besluit][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019316
      [ref2]: https://wetten.overheid.nl/BWBR0019316#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0019316#Artikel9
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.32
    references:
      - id: ref1
        bwb_id: BWBR0019316
      - id: ref2
        bwb_id: BWBR0019316
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0019316
        artikel: '9'
  - number: 1.33.1
    text: |-
      Het bevoegd gezag wordt ten minste twee werkdagen voor de feitelijke aanvang van de sloopwerkzaamheden, bedoeld
      in [artikel 1.26][ref1], schriftelijk van de aanvang van die werkzaamheden in kennis gesteld door diegene die de
      sloopwerkzaamheden gaat uitvoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.33
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.7'
  - number: 1.33.2
    text: |-
      Het bevoegd gezag wordt uiterlijk op de eerste werkdag na de dag van beëindiging van de sloopwerkzaamheden, bedoeld
      in [artikel 1.26][ref1] van de beëindiging van die werkzaamheden in kennis gesteld door degene die de werkzaamheden
      heeft uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.33
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.7'
  - number: 1.33.3
    text: |-
      Voor zover van toepassing verstrekt degene die de sloopwerkzaamheden heeft uitgevoerd het bevoegd gezag binnen
      twee weken na beëindiging van de werkzaamheden een afschrift van de resultaten van de eindbeoordeling, bedoeld in
      [artikel 9, eerste en tweede lid, van het Asbestverwijderingsbesluit 2005][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019316#Artikel9
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.33
    references:
      - id: ref1
        bwb_id: BWBR0019316
        artikel: '9'
  - number: 1.33.4
    text: |-
      Op verzoek van het bevoegd gezag overlegt degene die de sloopwerkzaamheden als bedoeld in [artikel 1.26][ref1]
      heeft uitgevoerd, binnen een door het bevoegd gezag te bepalen termijn na beëindiging van de werkzaamheden,
      een opgave van de aard en de hoeveelheid van de bij de werkzaamheden vrijgekomen afvalstoffen en van de
      afvoerbestemming van die stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.33
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.7'
  - number: 2.1.1
    text: Een te bouwen bouwwerk is voldoende bestand tegen de daarop werkende krachten.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.1
