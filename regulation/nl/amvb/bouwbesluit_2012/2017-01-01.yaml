  - number: 3.63.1
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gegeven over het in een bouwwerk toepassen van materialen
      waaruit giftige of hinderlijke stoffen kunnen vrijkomen of waaruit ioniserende stralen kunnen ontstaan.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.63
  - number: 3.63.2
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gegeven voor een uitwendige scheidingsconstructie, die
      de scheiding vormt met de grond of met de kruipruimte voor zover die scheidingsconstructie van invloed is op
      het ontstaan van een voor de gezondheid nadelige kwaliteit van de binnenlucht door de aanwezigheid van voor de
      gezondheid schadelijke stoffen en ioniserende straling.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.63
  - number: '3.64'
    text: |-
      Op het gedeeltelijk vernieuwen of het veranderen of het vergroten van een bouwwerk is [artikel 3.63][ref1] van
      overeenkomstige toepassing, waarbij in plaats van het in dat artikel aangegeven niveau van eisen wordt uitgegaan
      van het rechtens verkregen niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel3
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.64
