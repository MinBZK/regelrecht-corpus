  - number: '3.19'
    text: |-
      Op het bouwen van een tijdelijk bouwwerk zijn de [artikelen 3.16 tot en met 3.17a][ref1] van overeenkomstige
      toepassing, waarbij wordt uitgegaan van een niveau van eisen dat 10 dB lager is dan het in die artikelen aangegeven
      niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel3
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.19
