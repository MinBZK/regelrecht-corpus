  - number: 2.100.3
    text: |-
      Bij het bepalen van de weerstand tegen branddoorslag en brandoverslag als bedoeld in het tweede lid blijft onder
      een deur een oppervlak van niet meer dan 0,02 m2 bij een hoogte van niet meer dan 0,05 m, gemeten vanaf de vloer,
      buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.100
  - number: 2.101.1
    text: Een te bouwen bouwwerk heeft zodanige vluchtroutes dat bij brand een veilige plaats kan worden bereikt.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.101
  - number: 2.101.2
    text: |-
      Voor zover voor een gebruiksfunctie in tabel 2.101 voorschriften zijn aangewezen, wordt voor die gebruiksfunctie
      aan de in het eerste lid gestelde eis voldaan door toepassing van die voorschriften en de krachtens die bepalingen
      gegeven voorschriften.
