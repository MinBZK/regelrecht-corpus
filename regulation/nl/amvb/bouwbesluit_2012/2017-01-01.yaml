  - number: 9.3.1
    text: |-
      Het [Bouwbesluit 2003][ref1] met uitzondering van [afdeling 5.3][ref2],
      het [Besluit brandveilig gebruik bouwwerken][ref3] en
      [paragraaf 2 van het Besluit aanvullende regels veiligheid wegtunnels][ref4] worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0012727
      [ref2]: https://wetten.overheid.nl/BWBR0012727#Afdeling5.3
      [ref3]: https://wetten.overheid.nl/BWBR0024379
