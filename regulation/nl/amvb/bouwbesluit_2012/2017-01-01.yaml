  - number: 2.88.3.c
    text: |-
      een liftschacht, indien de constructieonderdelen aan de binnenzijde van de schacht voldoen aan een volgens NEN 6065
      bepaalde bijdrage tot brandvoortplanting die voldoet aan klasse 2 en een rookproductie met een volgens NEN 6066
      bepaalde rookdichtheid van ten hoogste 5,4 m-1, of aan brandklasse B en rookklasse s2, beide bepaald volgens NEN
      13501-1, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.88
  - number: 2.88.3.d
    text: |-
      een technische ruimte met een gebruiksoppervlakte van ten hoogste 100 m2 niet bestemd voor een of meer
      verbrandingstoestellen met een totale nominale belasting van meer dan 160 kW.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.88
  - number: 2.88.4
    text: In afwijking van het eerste lid voert een extra beschermde vluchtroute niet door een brandcompartiment.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.88
  - number: 2.88.5
    text: Een niet besloten gebruiksgebied ligt in een brandcompartiment.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.88
  - number: 2.88.6
    text: |-
      Het eerste en vijfde lid zijn niet van toepassing op een of meer gebruiksfuncties van dezelfde soort met een
      gebruiksoppervlakte van ten hoogste 2.000 m2 en een vuurbelasting niet groter dan 500 MJ/m2, bepaald volgens NEN
      6090.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.88
  - number: 2.88.7
    text: |-
      Het eerste en vijfde lid zijn niet van toepassing op een of meer gebruiksfuncties van dezelfde soort met een totale
      gebruiksoppervlakte van ten hoogste100 m2.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.88
  - number: 2.88.8
    text: |-
      Het eerste en vijfde lid zijn niet van toepassing op een lichte industriefunctie met een permanente vuurbelasting
      niet groter dan 200 MJ/m2, bepaald volgens NEN 6090.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.88
  - number: 2.89.1
    text: |-
      Een brandcompartiment heeft een gebruiksoppervlakte die niet groter is dan de in [tabel 2.87][ref1] aangegeven
      waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.89
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.10.2
        afdeling: '2.10'
  - number: 2.89.2
    text: |-
      In een brandcompartiment liggen ten hoogste vier woonwagens en nevenfuncties daarvan met een totale
      gebruiksoppervlakte van ten hoogste 1.000 m2.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.89
  - number: 2.89.3
    text: Een brandcompartiment strekt zich uit over niet meer dan een perceel.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.89
  - number: 2.89.4
    text: Een brandcompartiment strekt zich uit over niet meer dan een wegtunnelbuis.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.89
  - number: 2.89.5
    text: In een brandcompartiment liggen ten hoogste een woonfunctie en nevenfuncties daarvan.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.89
  - number: 2.89.6
    text: |-
      In afwijking van het vijfde lid is een gemeenschappelijk verblijfsgebied toegestaan, indien dat verblijfsgebied een
      afzonderlijk brandcompartiment is.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.89
  - number: 2.89.7
    text: |-
      Een technische ruimte met een gebruiksoppervlakte van meer dan 100 m2 of een technische ruimte waarin een of meer
      verbrandingstoestellen met een totale nominale belasting van meer dan 160 kW worden opgesteld, is een afzonderlijk
      brandcompartiment.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.89
  - number: 2.89.8
    text: |-
      Bij een brandcompartiment van een industriefunctie met een gebruiksoppervlakte van meer dan 2.000 m2 is het eerste
      lid niet van toepassing op een of meer in dat brandcompartiment gelegen nevenfuncties.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.89
  - number: 2.89.9
    text: |-
      In afwijking van het eerste lid is de gebruiksoppervlakte van een brandcompartiment met een of meer cellen ten
      hoogste 1.000 m2 en niet groter dan 77% van de gebruiksoppervlakte van het gebouw.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.89
  - number: 2.89.10
    text: |-
      Een brandcompartiment met bedgebied voor bedgebonden patiënten is niet groter dan 77% van de gebruiksoppervlakte
      van de bouwlaag waarop dit brandcompartiment ligt.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.89
  - number: 2.90.1
    text: |-
      De volgens NEN 6068 bepaalde weerstand tegen branddoorslag en brandoverslag van een brandcompartiment naar een
      ander brandcompartiment en een besloten ruimte waardoor een extra beschermde vluchtroute voert is ten minste 20
      minuten.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.90
  - number: 2.90.2
    text: |-
      Bij het bepalen van de weerstand tegen branddoorslag en brandoverslag van een brandcompartiment naar een ruimte van
      een op een aangrenzend perceel gelegen gebouw wordt voor het op het andere perceel gelegen gebouw uitgegaan van een
      identiek maar spiegelsymmetrisch ten opzichte van de perceelsgrens gelegen gebouw. Indien het perceel grenst aan
      een openbare weg, openbaar water of openbaar groen, of een perceel dat niet is bestemd voor bebouwing of voor een
      speeltuin, een kampeerterrein of opslag van brandgevaarlijke stoffen vindt deze spiegeling plaats ten opzichte van
      het hart van die weg, dat water, dat groen of dat perceel.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.90
  - number: 2.90.3
    text: |-
      De volgens NEN 6068 bepaalde weerstand tegen branddoorslag en brandoverslag van een brandcompartiment naar
      een ander brandcompartiment is ten minste 20 minuten of de afstand tussen een brandcompartiment en een ander
      brandcompartiment is ten minste 5 meter.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.90
  - number: 2.91.1
    text: |-
      Een te bouwen bouwwerk is zodanig dat uitbreiding van brand in verdergaande mate wordt beperkt dan is beoogd met
      [paragraaf 2.10.1][ref1] en dat veilig kan worden gevlucht.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Hoofdstuk2
