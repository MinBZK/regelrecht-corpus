        artikel: '2'
      - id: ref3
        bwb_id: BWBR0012727
        artikel: '2'
  - number: 9.2.3
    text: |-
      Voor wegtunnels met een tunnellengte van meer dan 250 m die zijn opengesteld voor 29 juni 2006 blijven de
      voorschriften van dit besluit en de daarop rustende bepalingen tot 1 mei 2019 buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel9.2
  - number: 9.2.4
    text: |-
      [Afdeling 4.11 van het Bouwbesluit 2003][ref1] zoals dit luidde onmiddellijk voorafgaand aan het tijdstip van de
      inwerkingtreding van dit besluit blijft tot 1 april 2022 van toepassing tenzij in het op het bouwen van toepassing
      zijnde bestemmingsplan voorschriften over stallingruimte voor fietsen zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0012727#Afdeling4.11
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0012727
        afdeling: '4.11'
  - number: 9.2.5
    text: |-
      Een voor het tijdstip waarop dit besluit in werking treedt afgegeven document als bedoeld in
      [artikel 2.1.7 van het Besluit brandveilig gebruik bouwwerken][ref1] zoals dit luidde onmiddellijk voorafgaand aan
      het tijdstip van inwerkingtreding van dit besluit, geldt voor zover de geldigheidsduur van dit document niet is
      verstreken als een geldig document zoals bedoeld in [artikel 1.17][ref2] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0024379#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel9.2
