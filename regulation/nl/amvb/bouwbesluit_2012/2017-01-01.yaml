      - id: ref1
        bwb_id: BWBR0030461
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.9.1
        afdeling: '3.9'
  - number: '3.65'
    text: |-
      Op het bouwen van een tijdelijk bouwwerk is [artikel 3.63][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel3
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.65
