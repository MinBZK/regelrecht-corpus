  - number: 2.120.1
    text: |-
      Vanaf een lifttoegang van een brandweerlift is vanaf een verdieping de lifttoegang op de verdieping daarboven
      bereikbaar via een extra beschermde vluchtroute.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.120
  - number: 2.120.2
    text: |-
      Een uitgang van een woonfunctie grenst niet aan een in het eerste lid bedoelde extra beschermde vluchtroute voor
      zover die voert door een ruimte die direct grenst aan de lifttoegang.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.120
  - number: 2.121.1
    text: |-
      De loopafstand tussen een punt in een gebruiksgebied en ten minste een toegang van een trappenhuis is niet groter
      dan 75 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.121
  - number: 2.121.2
    text: |-
      De loopafstand tussen een punt in een gebruiksgebied en ten minste een lifttoegang van een brandweerlift is niet
      groter dan 120 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.121
  - number: '2.122'
    text: |-
      Een wegtunnelbuis met een lengte van meer dan 250 m heeft een zodanig aantal hulpposten dat de loopafstand tussen
      een punt op de rijbaanvloer en ten minste een hulppost niet groter is dan 75 m. Deze afstand wordt gemeten over een
      route die uitsluitend voert over vloeren, trappen of hellingbanen zonder dat deuren worden gepasseerd die met een
      sleutel moeten worden geopend. De afstand tussen twee opeenvolgende hulpposten is ten hoogste 100 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.122
  - number: '2.123'
    text: |-
      Op het gedeeltelijk vernieuwen of veranderen of het vergroten van een bouwwerk zijn de [artikelen 2.120][ref1]
      en [2.121][ref2] van overeenkomstige toepassing, waarbij in plaats van het in die artikelen aangegeven niveau van
      eisen wordt uitgegaan van het rechtens verkregen niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.123
