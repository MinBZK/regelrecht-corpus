    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.91
  - number: 2.92.1
    text: |-
      Een brandcompartiment is ingedeeld in een of meer subbrandcompartimenten of verkeersruimten waardoor een beschermde
      vluchtroute voert.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.92
  - number: 2.92.2
    text: Een beschermde vluchtroute ligt niet in een subbrandcompartiment.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.92
  - number: 2.92.3
    text: |-
      In afwijking van het eerste lid kan een verblijfsgebied voor bewaking buiten een subbrandcompartiment liggen
      indien:
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.92
  - number: 2.92.3.a
    text: |-
      constructieonderdelen in dat gebied voldoen aan de eisen die [artikel 2.67][ref1] stelt aan constuctieonderdelen
      die grenzen aan de binnenlucht in een ruimte waardoor een beschermde vluchtroute voert, en


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.92
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.9.1
        afdeling: '2.9'
  - number: 2.92.3.b
    text: |-
      aankleding in dat gebied voldoet aan de eisen die [artikel 7.4][ref1] stelt aan aankleding in een ruimte waardoor
      een beschermde vluchtroute voert.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel7
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.92
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.1'
  - number: 2.92.4
    text: Een verblijfsgebied ligt in een beschermd subbrandcompartiment.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.92
  - number: 2.92.5
    text: Een bedgebied ligt in een beschermd subbrandcompartiment.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.92
  - number: 2.92.6
    text: Een cel ligt in een beschermd subbrandcompartiment.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.92
  - number: 2.92.7
    text: Een logiesverblijf ligt in een beschermd subbrandcompartiment.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.92
  - number: 2.93.1
    text: |-
      Een beschermd subbrandcompartiment heeft een gebruiksoppervlakte van ten hoogste de in [tabel 2.91][ref1]
      aangegeven waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.93
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.11.1
        afdeling: '2.11'
  - number: 2.93.2
    text: |-
      In afwijking van het eerste lid is een gezamenlijke verblijfsruimte een afzonderlijk beschermd subbrandcompartiment
      met een gebruiksoppervlakte van ten hoogste 500 m2.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.93
  - number: 2.93.3
    text: |-
      Een beschermd subbrandcompartiment omvat niet meer dan een gebruiksfunctie en nevenfuncties van die
      gebruiksfunctie.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.93
  - number: 2.93.4
    text: Een cel is een afzonderlijk beschermd subbrandcompartiment.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.93
  - number: 2.93.5
    text: |-
      Een beschermd subbrandcompartiment met bedgebied omvat uitsluitend een of meer bedruimten en ruimten die ten
      dienste staan van die bedruimten, en heeft een totale gebruiksoppervlakte van ten hoogste 500 m2.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.93
  - number: 2.93.6
    text: |-
      Een beschermd subbrandcompartiment als bedoeld in het vijfde lid, bestemd voor bedgebonden patiënten heeft,
      afhankelijk van het bewakingsniveau, een totale gebruiksoppervlakte van ten hoogste 50 m2 zonder bewaking en ten
      hoogste 500 m2 bij permanente bewaking.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.93
  - number: 2.93.7
    text: Een logiesverblijf is een afzonderlijk beschermd subbrandcompartiment.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.93
  - number: 2.93.8
    text: Een afzonderlijk beschermd subbrandcompartiment is een afzonderlijk subbrandcompartiment.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.93
  - number: 2.94.1
    text: |-
      De volgens NEN 6068 bepaalde weerstand tegen branddoorslag van een subbrandcompartiment naar een andere
      ruimte in het brandcompartiment is ten minste 20 minuten, waarbij voor de bepaling van de brandwerendheid met
      betrekking tot de scheidende functie van een scheidingsconstructie uitsluitend rekening wordt gehouden met het
      beoordelingscriterium vlamdichtheid met betrekking op de afdichting.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.94
  - number: 2.94.2
    text: |-
      De volgens NEN 6068 bepaalde weerstand tegen branddoorslag en brandoverslag van een beschermd subbrandcompartiment
      naar een andere ruimte in het brandcompartiment is ten minste 30 minuten.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.94
  - number: 2.94.3
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gegeven over de rookdoorgang van een subbrandcompartiment en
      van een beschermd subbrandcompartiment naar een andere ruimte.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.94
  - number: '2.95'
    text: |-
      Op het gedeeltelijk vernieuwen of veranderen of het vergroten van een bouwwerk zijn de
      [artikelen 2.92 tot en met 2.94][ref1] van overeenkomstige toepassing, waarbij in plaats van het in die artikelen
      aangegeven niveau van eisen wordt uitgegaan van het rechtens verkregen niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.95
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.11.1
        afdeling: '2.11'
  - number: '2.96'
    text: |-
      Op het bouwen van een tijdelijk bouwwerk zijn de [artikelen 2.94, eerste en derde lid][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.96
