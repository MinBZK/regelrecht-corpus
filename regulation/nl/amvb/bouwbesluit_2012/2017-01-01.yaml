  - number: 9.3.2
    text: |-
      [Afdeling 5.3 van het Bouwbesluit 2003][ref1] wordt ingetrokken op een bij koninklijk besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0012727#Afdeling5.3
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0012727
        afdeling: '5.3'
  - number: 9.4.1
    text: |-
      Dit besluit treedt, met uitzondering van de [afdelingen 2.16][ref1], [5.2][ref2] en [6.12][ref3] en
      [artikel 5.2][ref4], in werking op een bij koninklijk besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0030461#Hoofdstuk6
      [ref4]: https://wetten.overheid.nl/BWBR0030461#Artikel5
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel9.4
    references:
