    text: |-
      Het onderhoud van een ontruimingsalarminstallatie als bedoeld in het eerste lid, die behoort bij een
      brandmeldinstallatie waarop [artikel 6.20, zevende lid][ref1], van toepassing is, voldoet aan NEN 2654-2.


