articles:
  - number: 1.1.1
    text: |-
      Voor de toepassing van de bij of krachtens dit besluit gegeven voorschriften wordt verstaan onder: -
      ***aansluitafstand:*** afstand tussen een leiding van het distributienet en het deel van het bouwwerk dat zich het
      dichtst bij die leiding bevindt, gemeten langs de kortste lijn waarlangs een aansluiting zonder bezwaren kan worden
      gemaakt;
        - ***aansluitend terrein:*** aan een bouwwerk grenzend onbebouwd gedeelte van een perceel of openbaar toegankelijk
      gebied;
        - ***ADR-klasse:*** classificatie als bedoeld in de op 30 september 1957 te Genève tot stand gekomen Europese
      overeenkomst betreffende het internationale vervoer van gevaarlijke goederen over de weg (Trb. 1959, 171);
        - ***asbest:*** asbest als bedoeld in
      [artikel 1, eerste lid, onder a, van het Asbestverwijderingsbesluit 2005][ref1];
        - ***basisnetroute:*** basisnetroute als bedoeld in het [Besluit externe veiligheid transportroutes][ref2];
        - **bedgebied:** verblijfsgebied met een of meer bedruimten;
        - ***bedieningscentrale:*** centrale met voorzieningen om voorvallen te detecteren, installaties te bedienen en met
      tunnelgebruikers en hulpverleningsdiensten te communiceren;
        - **bedruimte:** verblijfsruimte bestemd voor een of meer bedden bestemd voor slapen of voor het verblijf van aan
      bed gebonden patiënten in die ruimte;
        - ***belastingscombinatie:*** verzameling van belastingen die gelijktijdig kunnen optreden;
        - **beschermd subbrandcompartiment:** gedeelte van een bouwwerk dat binnen de begrenzing van een
      subbrandcompartiment ligt of daarmee samenvalt, dat meer bescherming biedt tegen brand of rook dan een
      subbrandcompartiment;
        - ***beschermde route:*** buiten het subbrandcompartiment waar de vluchtroute begint gelegen gedeelte van een
      vluchtroute;
        - ***beschermde vluchtroute:*** buiten een subbrandcompartiment gelegen gedeelte van een vluchtroute die
      uitsluitend voert door een verkeersruimte;
        - ***bevoegd gezag:*** bevoegd gezag als bedoeld in de [Wabo][ref3];
        - ***bezwijken:*** het overschrijden van een uiterste grenstoestand;
        - **bijna energieneutraal gebouw:** gebouw met een zeer hoge energieprestatie, waarbij de dicht bij nul liggende of
      zeer lage hoeveelheid energie die is vereist in zeer aanzienlijke mate wordt geleverd uit hernieuwbare bronnen die
      deels ter plaatse of dichtbij wordt geproduceerd;
        - ***bouwconstructie:*** onderdeel van een bouwwerk dat bestemd is om belasting te dragen;
        - **bouwschil:** de geïntegreerde onderdelen die de binnenruimte van een gebouw scheiden van de buitenwereld;
        - ***brandcompartiment:*** gedeelte van een of meer bouwwerken bestemd als maximaal uitbreidingsgebied van brand;
        - **brandgevaarlijke stof:** vaste, vloeibare of gasvormige stof die brandbaar of brandbevorderend is, of bij brand
      gevaar oplevert, in de zin van de ADR-klassen twee tot en met vijf;
        - ***brandklasse:*** Europese brandklasse als bedoeld in NEN-EN 13501-1, onderdeel Classification criteria for
      construction products;
        - ***brandweerlift:*** lift die met een eenvoudige handeling ter beschikking van de brandweer kan worden gesteld
      voor het transport van materieel en manschappen;
        - ***CE-markering:*** CE-markering als bedoeld in artikel 8 van de verordening bouwproducten;
        - ***dagwaarde:*** de waarde van het langtijdgemiddeld beoordelingsniveau voor geluid tussen 07.00 tot 19.00 uur
      op de gevel van een geluidsgevoelig object als bedoeld in [artikel 11.1 van de Wet milieubeheer][ref4], vermeerderd
      met een eventuele toeslag voor geluid met een impulskarakter, bepaald volgens de Handleiding meten en rekenen
      industrielawaai, internetuitgave 2004;
        - ***distributienet voor warmte:*** collectief circulatiesysteem voor het transport van warmte door een circulerend
      medium voor verwarming of warmtapwater;
        - ***doorgang:*** toegang, uitgang of doorlaatopening voor personen van een bouwwerk of van een gedeelte daarvan;
        - ***erf:*** erf als bedoeld in [bijlage II bij het Besluit omgevingsrecht][ref5];
        - ***extra beschermde vluchtroute:*** buiten een brandcompartiment gelegen gedeelte van een beschermde vluchtroute;
        - ***functiegebied:*** gebruiksgebied of een gedeelte daarvan, waar de voor die gebruiksfunctie kenmerkende
      activiteiten, niet zijnde het verblijven van personen, plaatsvinden;
        - ***functieruimte:*** in een functiegebied gelegen ruimte;
        - ***gebruiksfunctie:*** gedeelten van een of meer bouwwerken die dezelfde gebruiksbestemming hebben en die tezamen
      een gebruikseenheid vormen;
        - **gebruiksgebied:** vrij indeelbaar gedeelte van een gebruiksfunctie waar voor de gebruiksfunctie kenmerkende
      activiteiten plaatsvinden, dat bestaat uit een of meer op dezelfde bouwlaag gelegen ruimten gelegen in een
      brandcompartiment die niet door een dragende scheidingsconstructie van elkaar zijn gescheiden en die geen
      toiletruimte, badruimte, technische ruimte of verkeersruimte zijn, tenzij die ruimte zelf een functieruimte is;
        - ***gebruiksoppervlakte:*** gebruiksoppervlakte als bedoeld in NEN 2580;
        - ***gecorrigeerde loopafstand:*** loopafstand waarbij constructieonderdelen die geen onderdeel uitmaken van de
      bouwconstructie buiten beschouwing worden gelaten, waarbij de loopafstand voor zover deze door een gebruiksgebied
      voert met 1,5 wordt vermenigvuldigd;
        - **geharmoniseerde norm:** norm als bedoeld in artikel 2, elfde lid, van de verordening bouwproducten;
        - **geharmoniseerde technische specificatie:** specificatie als bedoeld in artikel 2, tiende lid, van de
      verordening bouwproducten;
        - ***herziene richtlijn energieprestatie gebouwen:*** richtlijn 2010/31/EU van het Europees Parlement en de Raad
      van 19 mei 2010 betreffende de energieprestatie van gebouwen (herschikking) (PbEU L153/13);
        - ***hoge spanning:*** nominale wisselspanning van meer dan 1.000 volt, hetzij een nominale gelijkspanning van meer
      dan 1.500 volt;
        - ***installatie:*** voor het functioneren van een bouwwerk of een gedeelte daarvan noodzakelijke voorziening van
      niet-bouwkundige aard;
        - ***integraal toegankelijke badruimte:*** badruimte in een toegankelijkheidssector;
        - ***integraal toegankelijke toiletruimte:*** toiletruimte in een toegankelijkheidssector;
        - ***inwendige scheidingsconstructie:*** constructie die de scheiding vormt tussen twee voor personen toegankelijke
      besloten ruimten van een gebouw, waaronder begrepen de op die constructie aansluitende delen van andere
      constructies, voor zover die delen van invloed zijn op het voldoen van die scheidingsconstructie aan een bij of
      krachtens dit besluit gegeven voorschrift;
        - ***klimlijn:*** denkbeeldige, vloeiend verlopende lijn die de voorkanten van de treden van een trap met elkaar
      verbindt;
        - ***koelsysteem:*** technisch bouwsysteem met als doel het koelen van een ruimte binnen een gebouw of gedeelte
      daarvan, door middel van het toevoeren van koude of het ontvochtigen van de lucht of een combinatie van beide;
        - ***lage spanning:*** nominale wisselspanning van niet meer dan 1.000 volt, hetzij nominale gelijkspanning van
      niet meer dan 1.500 volt;
        - ***leefzone:*** gedeelte van een verblijfsgebied waarbij de ruimte gelegen binnen 1 m van een uitwendige
      scheidingsconstructie, binnen 0,2 m van een inwendige scheidingsconstructie en hoger gelegen dan 1,8 m boven de
      vloer buiten beschouwing blijft;
        - ***lift:*** lift als bedoeld in [artikel 1 van het Warenwetbesluit liften][ref6] bestemd voor personen;
        - ***lifttoegang:*** doorgang van een liftschacht voor het bereiken van een kooi van een lift;
        - ***loopafstand:*** afstand, gemeten langs een denkbeeldige, kortst realiseerbare lijn tussen twee punten,
      waarover op een afstand van ten minste 0,3 m van constructieonderdelen kan worden gelopen en waarbij de loopafstand
      over een trap samenvalt met de klimlijn;
        - ***lozingstoestel:*** toestel met een mogelijkheid voor aansluiting op de afvoervoorziening voor huishoudelijk
      afvalwater;
        - ***meetniveau:*** hoogte van het aansluitende terrein, gemeten ter plaatse van de toegang van het gebouw;
        - ***milieugevaarlijke stoffen:*** gevaarlijke stoffen als bedoeld in het [Activiteitenbesluit milieubeheer][ref7];
        - ***NEN:*** door de Stichting Nederlands Normalisatie-instituut uitgegeven norm;
        - ***NEN-EN:*** door de Europese Commissie voor Normalisatie geharmoniseerde norm;
        - ***nevenfunctie:*** gebruiksfunctie die ten dienste staat van een andere gebruiksfunctie;
        - ***nominale belasting:*** maximale belasting van een verbrandingstoestel, bepaald op basis van de calorische
      bovenwaarde van de brandstof waarvoor dat toestel is ingericht;
        - ***nooddeur:*** deur die uitsluitend is bestemd om te vluchten;
        - ***NVN:*** door de Stichting Nederlands Normalisatie-instituut uitgegeven voornorm;
        - **onderdeel van een gebouw:** technisch bouwsysteem of een onderdeel van de bouwschil;
        - ***open erf:*** onbebouwd deel van een erf;
        - ***permanente vuurbelasting:*** volgens NEN 6090 bepaalde vuurbelasting van de brandbare materialen in de
      constructieonderdelen van een bouwwerk of van een daarin gelegen ruimte, dan wel de constructieonderdelen die dat
      bouwwerk of die ruimte begrenzen;
        - ***permanente vuurlast:*** product van de permanente vuurbelasting van een ruimte of een groep van ruimten en de
      volgens NEN 2580 bepaalde netto-vloeroppervlakte van het beschouwde gedeelte van het bouwwerk;
        - ***plasbrandaandachtsgebied:*** gebied als bedoeld in het [Besluit externe veiligheid transportroutes][ref8];
        - **prestatieverklaring:** verklaring als bedoeld in artikel 4, eerste lid, van de verordening bouwproducten;
        - ***RAL:*** door het RAL Deutsches Institut für Gütesicherung und Kennzeichnung gestandaardiseerde kleurcode;
        - ***rechtens verkregen niveau:*** niveau dat het gevolg is van de toepassing op enig moment van de relevante
      op dat moment van toepassing zijnde technische voorschriften en dat niet lager ligt dan het niveau van de
      desbetreffende voorschriften voor een bestaand bouwwerk en niet hoger dan het niveau van de desbetreffende
      voorschriften voor een te bouwen bouwwerk;
        - ***rookklasse:*** Europese brandklasse als bedoeld in NEN-EN 13501-1, onderdeel Additional classifications for
      smoke production;
        - ***rijbaan:*** rijbaan als bedoeld in [artikel 1 van het Reglement verkeersregels en verkeerstekens 1990][ref9];
        - ***stookplaats:*** opstelplaats voor een verbrandingstoestel dat bestemd is voor open verbranding van vaste
      brandstoffen;
        - **straatpeil:** a. voor een bouwwerk waarvan de hoofdtoegang direct aan de weg grenst de hoogte van de weg ter
      plaatse van die hoofdtoegang; b. voor een bouwwerk waarvan de hoofdtoegang niet direct aan de weg grenst de hoogte
      van het terrein ter plaatse van die hoofdtoegang bij voltooiing van de bouw;
        - ***subbrandcompartiment:*** gedeelte van een bouwwerk dat binnen de begrenzing van een brandcompartiment ligt of
      daarmee samenvalt, bestemd voor beperking van verspreiding van rook of verdere beperking van het uitbreidingsgebied
      van brand;
        - ***systeemrendement:*** verhouding tussen de door het technisch bouwsysteem nuttig geleverde energie voor het
      doelmatig functioneren van dat systeem en de door dat systeem aangewende primaire energie;
        - ***technisch bouwsysteem:*** gebouwgebonden samenstelling van alle bestanddelen van een installatie, waaronder de
      isolatiekenmerken daarvan, die is bedoeld voor het verwarmen, koelen, ventileren, of het voorzien van warmtapwater,
      of een combinatie daarvan, van een gebouw of een gedeelte daarvan;
        - ***technische ruimte:*** ruimte voor het plaatsen van de apparatuur, noodzakelijk voor het functioneren van het
      bouwwerk, waaronder in ieder geval begrepen een meterruimte, een liftmachineruimte en een stookruimte;
        - ***terrein:*** bij een bouwwerk behorend onbebouwd perceel, of een gedeelte daarvan, niet zijnde een erf;
        - ***toegankelijkheidssector:*** voor personen met een fysieke functiebeperking zelfstandig bruikbaar en
      toegankelijk gedeelte van een gebouw;
        - ***trappenhuis:*** verkeersruimte waarin een trap ligt;
        - ***tunnelbuislengte:*** lengte van het omsloten gedeelte van een tunnelbuis;
        - ***tunnellengte:*** lengte van de wegtunnelbuis met de grootste tunnelbuislengte;
        - ***tijdelijk bouwwerk:*** bouwwerk dat bedoeld is om voor een periode van ten hoogste vijftien jaar op een
      bepaalde plaats aanwezig te zijn;
        - ***uitgang van een gebruiksfunctie:*** uitgang tot het aansluitende terrein, een gemeenschappelijke
      verkeersruimte, een gemeenschappelijk verblijfsgebied of een ruimte van een andere gebruiksfunctie, ter plaatse
      waarvan een route eindigt die begint in een punt in een niet-gemeenschappelijk verblijfsgebied en uitsluitend voert
      door niet-gemeenschappelijke ruimten van de gebruiksfunctie;
        - ***uitwendige scheidingsconstructie:*** constructie die de scheiding vormt tussen een voor personen toegankelijke
      besloten ruimte van een gebouw en de buitenlucht, de grond of het water, waaronder begrepen de op die constructie
      aansluitende delen van andere constructies, voor zover die delen van invloed zijn op het voldoen van die
      scheidingsconstructie aan een bij of krachtens dit besluit gegeven voorschrift;
        - ***V:*** door de Hoofdcommissie voor de Normalisatie uitgegeven leidraad;
        - ***veiligheidsroute:*** gedeelte van een extra beschermde vluchtroute dat voert door een niet besloten ruimte en
      aansluitend daarop door een ruimte die in de vluchtrichting uitsluitend kan worden bereikt vanuit een niet besloten
      ruimte;
        - ***veiligheidsvluchtroute:*** gedeelte van een extra beschermde vluchtroute dat voert door een niet besloten
      ruimte en aansluitend daarop door een ruimte die uitsluitend kan worden bereikt vanuit niet besloten ruimten;
        - ***veiligheidszone:*** gebied langs of binnen een basisnetroute waar het plaatsgebonden risico meer bedraagt of
      kan bedragen dan 10-6;
        - ***ventilatiesysteem:*** technisch bouwsysteem, geen onderdeel uitmakend van een verwarmings- of koelsysteem, dat
      verse lucht toevoert of verontreinigde binnenlucht afvoert, of een combinatie daarvan;
        - ***verblijfsgebied:*** gebruiksgebied of een gedeelte daarvan voor het verblijven van personen;
        - ***verblijfsruimte:*** in een verblijfsgebied gelegen ruimte voor het verblijven van personen;
        - ***vergunning voor brandveilig gebruik:*** vergunning voor brandveilig gebruik als bedoeld in
      [artikel 2.1, eerste lid, onder d, van de Wabo][ref10];
        - ***vergunning voor het bouwen:*** vergunning voor een bouwactiviteit als bedoeld in
      [artikel 2.1, eerste lid, onder a, van de Wabo][ref11];
        - ***verkeersroute:*** route die begint bij een doorgang van een ruimte, uitsluitend voert over vloeren, trappen of
      hellingbanen en eindigt bij de doorgang van een andere ruimte;
        - ***verkeersruimte:*** ruimte bestemd voor het bereiken van een andere ruimte, niet zijnde een ruimte in een
      verblijfsgebied of in een functiegebied, een toiletruimte, een badruimte of een technische ruimte;
        - ***verordening bouwproducten:*** verordening van het Europees parlement en de Raad van 9 maart 2011 tot
      vaststelling van geharmoniseerde voorwaarden voor het verhandelen van bouwproducten en tot intrekking van
      [Richtlijn 89/106/EEG](31989L0106) van de Raad (305/2011/EU, PbEU L88);
        - ***verpakkingsgroep:*** verpakkingsgroep als bedoeld in de op 30 september 1957 te Genève tot stand gekomen
      Europese overeenkomst betreffende het internationale vervoer van gevaarlijke goederen over de weg (Trb. 1959, 171);
        - ***verwarmingssysteem:*** technisch bouwsysteem waarin warmte wordt opgewekt, gedistribueerd of afgegeven of een
      combinatie daarvan;
        - ***vluchtroute:*** route die begint in een voor personen bestemde ruimte, uitsluitend voert over vloeren, trappen
      of hellingbanen en eindigt op een veilige plaats, zonder dat gebruik behoeft te worden gemaakt van een lift;
        - ***voor personen bestemde vloer of ruimte:*** vloer of ruimte waarvan het kenmerkende gebruik verbonden is met de
      aanwezigheid van personen;
        - ***vrije breedte:*** kleinste afstand tussen constructieonderdelen aan weerskanten van een doorgang;
        - ***vrije hoogte:*** vrije hoogte als bedoeld in NEN 2580;
        - ***vuurbelasting:*** hoeveelheid warmte die vrijkomt per eenheid vloeroppervlakte bij verbranding van alle in een
      gebouw of een daarin gelegen ruimte aanwezige brandbare materialen;
        - ***Wabo:*** [Wet algemene bepalingen omgevingsrecht][ref12];
        - ***warmtapwatersysteem:*** technisch bouwsysteem waarin warmtapwater wordt opgewekt, gedistribueerd of afgegeven
      of een combinatie daarvan;
        - ***warmteplan:*** besluit van de gemeenteraad inzake de aanleg van een distributienet voor warmte in een bepaald
      gebied, waarin voor een periode van ten hoogste 10 jaar, uitgaande van het voor die periode geplande aantal
      aansluitingen op dat distributienet, de mate van energiezuinigheid en bescherming van het milieu, gebaseerd op de
      energiezuinigheid van dat distributienet en het opwekkingsrendement van de over dat distributienet getransporteerde
      warmte, bij aansluiting op dat distributienet is opgenomen;
        - ***weerstand tegen branddoorslag en brandoverslag:*** kortste tijd die een brand nodig heeft om zich uit te
      breiden van een ruimte naar een andere ruimte;
        - ***wegtunnel:*** tunnel of tunnelvormig bouwwerk uitsluitend dan wel mede bestemd voor motorrijtuigen als bedoeld
      in [artikel 1, eerste lid, onder c, van de Wegenverkeerswet 1994][ref13];
        - ***wegtunnelbuis:*** gedeelte van een wegtunnel voor een rijbaan;
        - ***wet:*** [Woningwet][ref14].


