  - number: 1.3.1
    text: |-
      Aan een in [hoofdstuk 2 tot en met 7][ref1] gesteld voorschrift behoeft niet te worden voldaan indien het bouwwerk
      of het gebruik daarvan anders dan door toepassing van het desbetreffende voorschrift ten minste dezelfde mate van
      veiligheid, bescherming van de gezondheid, bruikbaarheid, energiezuinigheid en bescherming van het milieu biedt als
      is beoogd met de in die hoofdstukken gestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0030461
        hoofdstuk: '2'
  - number: 1.3.2
    text: |-
      Een gelijkwaardige oplossing als bedoeld in het eerste lid wordt bij het gebruik van het bouwwerk in stand
      gehouden.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.3
  - number: 1.3.3
    text: |-
      Een in het eerste lid bedoelde gelijkwaardige oplossing voor een aansluiting op het distributienet voor warmte als
      bedoeld in [artikel 6.10, derde lid][ref1], heeft ten minste dezelfde mate van energiezuinigheid en bescherming van
      het milieu als wordt bereikt met de in het warmteplan voor die aansluiting opgenomen mate van energiezuinigheid en
      bescherming van het milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
  - number: 1.4.1
    text: |-
      Voor de toepassing van voorschriften gesteld bij of krachtens dit besluit is een bouwwerk, een ruimte, een
      voorziening, of een gedeelte daarvan naar keuze een gemeenschappelijk of niet-gemeenschappelijk, tenzij anders
      is bepaald.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.4
  - number: 1.4.2
    text: |-
      Voor de toepassing van voorschriften gesteld bij of krachtens dit besluit wordt een gedeelte van een bouwwerk, een
      ruimte of een voorziening die ten dienste staat van meer dan een gebruiksfunctie, aangemerkt als gemeenschappelijk.
      Een zodanig gedeelte, een zodanige ruimte of een zodanige voorziening maakt, met uitzondering van een nevenfunctie,
      voor de toepassing van dit besluit deel uit van alle daarop aangewezen gebruiksfuncties.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.4
  - number: 1.4.3
    text: |-
      Voor de toepassing van voorschriften gesteld bij of krachtens dit besluit wordt een gedeelte van een woonfunctie,
      een celfunctie of een logiesfunctie of een ruimte of voorziening die ten dienste staat van die gebruiksfunctie,
      gebruikt door meer dan een wooneenheid, cel of logiesverblijf in die gebruiksfunctie, aangemerkt als gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.4
  - number: 1.5.1
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gegeven over de toepassing van een in dit besluit genoemde
      norm.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.5
  - number: 1.5.2
    text: |-
      Indien bij of krachtens dit besluit een NEN-EN is aangewezen waarvoor een nationale bijlage is vastgesteld, is
      bedoeld deze NEN-EN inclusief deze bijlage.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.5
  - number: 1.5.3
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gegeven over de toepassing van een in dit besluit genoemd
      certificatie- of inspectieschema.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.5
  - number: '1.6'
    text: |-
      Het is verboden een bouwproduct in de handel te brengen waarvoor overeenkomstig de verordening bouwproducten een
      geharmoniseerde norm is vastgesteld en de co-existentieperiode met betrekking tot die norm is afgelopen, indien dat
      product niet is voorzien van de daarop betrekking hebbende CE-markering.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.6
  - number: 1.8.1
    text: |-
      Indien een bouwproduct, waarop een CE-markering is aangebracht, aan bepaalde prestaties moet voldoen zodat het
      bouwwerk waarin het wordt toegepast voldoet aan een bij of krachtens dit besluit gestelde eis, is aan die eis
      voldaan indien het bouwproduct is toegepast overeenkomstig een op die eis toegesneden prestatieverklaring.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.8
  - number: 1.8.2
    text: |-
      Indien een bouwproduct aan bepaalde prestaties die niet onder een geharmoniseerde norm vallen moet voldoen zodat
      het bouwwerk waarin het wordt toegepast voldoet aan een bij of krachtens dit besluit gestelde eis, is aan die eis
      voldaan indien het bouwproduct is toegepast overeenkomstig een op die eis toegesneden kwaliteitsverklaring.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.8
  - number: 1.8.3
    text: |-
      Indien een bouwproces aan bepaalde prestaties moet voldoen zodat het bouwwerk waarin het wordt uitgevoerd voldoet
      aan een bij of krachtens dit besluit gestelde eis, is aan die eis voldaan indien het bouwproces is toegepast
      overeenkomstig een op die eis toegesneden kwaliteitsverklaring.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.8
  - number: 1.8.4
    text: Een prestatieverklaring wordt in de Nederlandse taal verstrekt.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.8
  - number: 1.9.1
    text: |-
      Onze Minister wijst technische beoordelingsinstanties als bedoeld in artikel 29 van de verordening bouwproducten
      aan.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.9
  - number: 1.9.2
    text: Onze Minister wijst een aanmeldende autoriteit als bedoeld in artikel 40 van de verordening bouwproducten aan.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.9
  - number: 1.9.3
    text: Bij ministeriële regeling kunnen voorschriften worden gegeven over het in het eerste en tweede lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.9
  - number: 1.10.1
    text: Handelen in strijd met de verplichtingen die voortvloeien uit de verordening bouwproducten is verboden.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.10
  - number: 1.10.2
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven over de implementatie van de verordening
      bouwproducten.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.10
  - number: 1.11.1
    text: |-
      Kwaliteitsverklaringen als bedoeld in [artikel 1, eerste lid, onderdeel i, van de wet][ref1] worden afgegeven op
      basis van een door Onze Minister erkend stelsel van kwaliteitsverklaringen voor de bouw.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
  - number: 1.11.2
    text: Bij ministeriële regeling kunnen voorschriften worden gegeven over het in het eerste lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.11
  - number: 1.12.1
    text: |-
      Op het geheel of gedeeltelijk vernieuwen of veranderen of het vergroten van een bouwwerk zijn wat betreft de
      [hoofdstukken 2 tot en met 5][ref1] de voorschriften van een te bouwen bouwwerk van toepassing tenzij in de
      desbetreffende afdeling voor een voorschrift anders is aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.12
    references:
      - id: ref1
        bwb_id: BWBR0030461
        hoofdstuk: '2'
  - number: 1.12.2
    text: |-
      Op het gedeeltelijk vernieuwen of veranderen of het vergroten van een installatie is wat betreft
      [hoofdstuk 6][ref1] het rechtens verkregen niveau van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.12
    references:
      - id: ref1
        bwb_id: BWBR0030461
        hoofdstuk: '6'
  - number: 1.12.3
    text: |-
      Op het geheel vernieuwen van een installatie zijn wat betreft [hoofdstuk 6][ref1] de voorschriften van een te
      bouwen bouwwerk van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.12
    references:
