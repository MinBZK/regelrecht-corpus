        bwb_id: BWBR0027464
  - number: 7.7.1
    text: |-
      Bedrijfsmatige opslag van brandbare niet-milieugevaarlijke stoffen is zodanig dat bij brand geen onveilige
      situatie kan ontstaan voor een op een aangrenzend perceel gelegen of op dat perceel volgens het bestemmingsplan
      nog te realiseren gebouw dat op grond van [hoofdstuk 2][ref1] een brandcompartiment of een gedeelte van een
      brandcompartiment is, of voor een speeltuin, kampeerterrein of opslag van brandgevaarlijke stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0030461
        hoofdstuk: '2'
  - number: 7.7.2
    text: 'Aan het in het eerste lid gestelde is bij opslag van hout, anders dan in een gebouw, voldaan indien:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.7
  - number: 7.7.2.a
    text: |-
      de opslag bij brand gedurende een periode van ten minste 60 minuten, gerekend vanaf het ontstaan van de brand, geen
      grotere stralingsbelasting veroorzaakt dan 15 kW/m2;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.7
  - number: 7.7.2.b
    text: |-
      de bereikbaarheid van de opslag vanaf twee tegenover elkaar liggende zijden is gewaarborgd, waarbij in een derde
      zijde ook een toegangsmogelijkheid aanwezig is indien die zijde langer is dan 40 m, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.7
  - number: 7.7.2.c
    text: |-
      bij de opslag een bluswatervoorziening met gedurende ten minste vier uren een toevoercapaciteit van ten minste 90
      m3 per uur aanwezig is.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.7
  - number: 7.7.3
    text: 'De in het tweede lid bedoelde stralingsbelasting wordt gemeten op:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.7
  - number: 7.7.3.a
    text: |-
      de perceelsgrens, indien het aangrenzend perceel een kampeerterrein, een speeltuin of een opslag van
      brandgevaarlijke stoffen is, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.7
  - number: 7.7.3.b
    text: enig punt van de uitwendige scheidingsconstructie van een op het aangrenzend perceel gelegen gebouw.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.7
  - number: '7.8'
    text: |-
      In een technische ruimte met een of meer verbrandingstoestellen met een totale nominale belasting van meer dan 130
      kW zijn geen brandbare goederen opgeslagen of opgesteld.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.8
  - number: 7.9.1
    text: 'Een verbrandingstoestel wordt uitsluitend gebruikt indien:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.9
  - number: 7.9.1.a
    text: de voorziening voor toevoer van verbrandingslucht en de voorziening voor afvoer van rookgas niet zijn afgesloten;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.9
  - number: 7.9.1.b
    text: |-
      de capaciteit van de voorziening voor toevoer van verbrandingslucht, van de voorziening voor afvoer van rookgas
      en van de daarop aangesloten aansluitleidingen, niet kleiner zijn dan de voor het adequaat functioneren van het
      verbrandingstoestel noodzakelijke capaciteit;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.9
  - number: 7.9.1.c
    text: |-
      de opstelling van het verbrandingstoestel met inbegrip van een aansluitleiding tussen het toestel en de voorziening
      voor de afvoer van rookgas brandveilig is;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.9
  - number: 7.9.1.d
    text: de voorziening voor afvoer van rookgas doeltreffend is gereinigd, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.9
  - number: 7.9.1.e
    text: |-
      het verbrandingstoestel met een aansluitmogelijkheid op een voorziening voor afvoer van rookgas adequaat op de
      voorziening is aangesloten.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.9
  - number: 7.9.2
    text: |-
      Van een brandveilige opstelling als bedoeld in het eerste lid, onder c, is in ieder geval sprake indien de
      opstelling brandveilig is, bepaald volgens NEN 3028.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.9
  - number: '7.10'
    text: |-
      Onverminderd het bij of krachtens dit besluit bepaalde is het verboden in, op, aan of nabij een bouwwerk voorwerpen
      of stoffen te plaatsen, te werpen of te hebben, handelingen te verrichten of na te laten, werktuigen, middelen of
      voorzieningen te gebruiken of niet te gebruiken of anderszins belemmeringen op te werpen of hinder te veroorzaken
      waardoor:
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.10
  - number: 7.10.a
    text: brandgevaar wordt veroorzaakt, of
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.10
  - number: 7.10.b
    text: bij brand een gevaarlijke situatie wordt veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.10
  - number: 7.11.1
    text: Het gebruik van een bouwwerk is zodanig dat bij brand veilig kan worden gevlucht.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.11
  - number: 7.11.2
    text: |-
