  - number: 2.67.1
    text: |-
      Een zijde van een constructieonderdeel die grenst aan de binnenlucht voldoet aan de in [tabel 2.66][ref1]
      aangegeven brandklasse en aan rookklasse s2, beide bepaald volgens NEN-EN 13501-1.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.67
    references:
