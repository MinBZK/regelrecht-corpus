  - number: 9.2.7
    text: |-
      Met een geldig certificaat als bedoeld in [artikel 6.32, eerste en tweede lid][ref1], wordt
      gelijkgesteld een voor 1 januari 2015 afgegeven document als bedoeld in de [artikelen 2.3.9][ref2] en
      [2.5.1 van het Besluit brandveilig gebruik bouwwerken][ref3] zoals dit luidde onmiddellijk voorafgaand aan 1 april
      2012, voor zover de geldigheidsduur van dat document niet is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0024379#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0024379#Artikel2
