  - number: 6.24.1
    text: |-
      Een ruimte waardoor een verkeersroute voert en een ruimte voor meer dan 50 personen hebben een
      vluchtrouteaanduiding die voldoet bij een te bouwen bouwwerk aan NEN 3011 of bij een bestaand bouwwerk aan NEN
      6088, en aan de zichtbaarheidseisen, bedoeld in de artikelen 5.2 tot en met 5.6 van NEN-EN 1838.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.24
  - number: 6.24.2
    text: |-
      Een wegtunnel heeft een vluchtrouteaanduiding die voldoet aan NEN 6088 en aan de zichtbaarheidseisen, bedoeld
      in de artikelen 5.2 tot en met 5.6 van NEN-EN 1838. De vluchtrouteaanduiding is niet hoger dan 1,5 m boven de
      vloer aangebracht en de afstand tussen twee vluchtrouteaanduidingen is niet meer dan 25 meter, gemeten langs de
      tunnelwand.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.24
  - number: 6.24.3
    text: |-
      Een vluchtrouteaanduiding als bedoeld in het eerste of tweede lid is aangebracht op een duidelijk waarneembare
      plaats.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.24
  - number: 6.24.4
    text: |-
      Een vluchtrouteaanduiding als bedoeld in het eerste of tweede lid voldoet binnen 15 seconden na het uitvallen van
      de voorziening voor elektriciteit, gedurende een periode van ten minste 60 minuten, aan de zichtbaarheidseisen
      bedoeld in de artikelen 5.2 tot en met 5.6 van NEN-EN 1838.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.24
  - number: 6.24.5
    text: |-
      Op een vluchtrouteaanduiding als bedoeld in het eerste lid gelegen op een vluchtroute vanuit een ruimte met een
      verlichtingsinstallatie niet zijnde noodverlichting als bedoeld in [artikel 6.3][ref1], zijn bij het uitvallen van
      de voorziening voor elektriciteit de in het eerste lid bedoelde zichtbaarheidseisen niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.24
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.1'
  - number: 6.24.6
    text: |-
      Een deur in een tunnel die toegang geeft tot een beschermde route als bedoeld in [afdeling 2.12][ref1] is
      uitgevoerd in de kleur groen, RAL 6024.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.24
    references:
      - id: ref1
        bwb_id: BWBR0030461
        hoofdstuk: '2'
        afdeling: '2.12'
  - number: 6.24.7
    text: |-
      Bij een vluchtrouteaanduiding als bedoeld in het tweede lid is goed zichtbaar aangegeven de loopafstand in twee
      richtingen tot het einde van de tunnelbuis of, indien die loopafstand korter is, de loopafstand tot de meest nabije
      toegang als bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.24
  - number: 6.25.1
    text: |-
      Een deur op een gemeenschappelijke vluchtroute die toegang geeft tot een trappenhuis van een te bouwen woongebouw
      draait bij het openen niet tegen de vluchtrichting in.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.25
  - number: 6.25.2
    text: |-
      Een deur op een vluchtroute vanaf de uitgang van een wooneenheid naar de uitgang van de woonfunctie voor
      kamergewijze verhuur kan in de vluchtrichting worden geopend:
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.25
  - number: 6.25.2.a
    text: door een lichte druk tegen de deur, of
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.25
  - number: 6.25.2.b
    text: met behulp van een ontsluitingsmechanisme dat voldoet aan NEN-EN 179 of aan NEN-EN 1125.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.25
  - number: 6.25.3
    text: |-
      Een deur op een vluchtroute draait bij het openen niet tegen de vluchtrichting in indien bij een te bouwen bouwwerk
      meer dan 37 personen of bij een bestaand bouwwerk meer dan 60 personen op die uitgang zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.25
  - number: 6.25.4
    text: Een nooddeur kan geen schuifdeur zijn.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.25
  - number: 6.25.5
    text: Een deur op een vluchtroute draait bij het openen niet tegen de vluchtrichting in.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.25
  - number: 6.25.6
    text: 'Een deur waarop bij het vluchten meer dan 100 personen zijn aangewezen kan worden geopend door:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.25
  - number: 6.25.6.a
    text: een lichte druk tegen de deur, of
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.25
  - number: 6.25.6.b
    text: |-
      een lichte druk tegen een op circa 1 m boven de vloer over de volle breedte van de deur aangebrachte panieksluiting
      die voldoet aan NEN-EN 1125.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.25
  - number: 6.25.7
    text: |-
      Een deur op een vluchtroute die begint in een ruimte voor het insluiten van personen, kan tijdens het vluchten met
      een sleutel worden geopend.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.25
  - number: 6.25.8
    text: |-
      Een automatisch werkende deur en een voorziening voor toegangs- of uitgangscontrole in een vluchtroute mogen het
      vluchten niet belemmeren.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.25
  - number: 6.25.9
    text: |-
      Een deur die toegang geeft tot een overdruktrappenhuis is voorzien van een aanduiding waaruit blijkt dat hard duwen
      noodzakelijk kan zijn.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.25
  - number: 6.25.10
    text: |-
      Aan de aan de buitenlucht grenzende zijde van een nooddeur is het opschrift «nooddeur vrijhouden» of «nooduitgang»
      aangebracht. Dit opschrift voldoet aan de eisen voor aanvullende tekens in NEN 3011.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.25
  - number: 6.25.11
    text: Bij ministeriële regeling kan worden afgeweken van het derde lid.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.25
  - number: 6.26.1
    text: |-
      Een beweegbaar constructieonderdeel in een inwendige scheidingsconstructie waarvoor een eis aan de weerstand
      tegen branddoorslag, weerstand tegen branddoorslag en brandoverslag of weerstand tegen rookdoorgang geldt, is
      zelfsluitend.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.26
  - number: 6.26.2
    text: Het eerste lid geldt niet voor een deur in een niet-gemeenschappelijke doorgang.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.26
  - number: 6.26.3
    text: Het eerste lid geldt niet voor een deur van een cel.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.26
  - number: 6.26.4
    text: Het eerste lid geldt niet voor een deur in een niet-gezamenlijke doorgang.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.26
  - number: 6.27.1
    text: |-
      Een bouwwerk heeft zodanige voorzieningen voor de bestrijding van brand, dat brand binnen redelijke tijd kan worden
      bestreden.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.27
  - number: 6.27.2
    text: |-
      Voor zover voor een gebruiksfunctie in tabel 6.27 voorschriften zijn aangewezen, wordt voor die gebruiksfunctie
      aan de in het eerste lid gestelde eis voldaan door toepassing van die voorschriften en de krachtens die bepalingen
      gegeven voorschriften.
