      [3.43][ref2] van overeenkomstige toepassing, waarbij in plaats van het in die artikelen aangegeven niveau van eisen
      wordt uitgegaan van het rechtens verkregen niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel3
