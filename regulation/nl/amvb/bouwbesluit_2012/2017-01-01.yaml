        hoofdstuk: '2'
        paragraaf: 2.3.1
        afdeling: '2.3'
  - number: 2.19.4
    text: |-
      De bovenregel van een in [artikel 2.17][ref1] bedoelde afscheiding heeft geen onderbreking van meer dan 0,1 m.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.19
    references:
