        afdeling: '2.3'
  - number: 2.20.2
    text: |-
      Het eerste lid is niet van toepassing op een vloer, een tredevlak of een vloer van een hellingbaan, of een gedeelte
      daarvan, niet bestemd voor kinderen jonger dan 12 jaar.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.20
  - number: '2.21'
    text: |-
      Op het geheel of gedeeltelijk vernieuwen of veranderen of het vergroten van een bouwwerk zijn de
      [artikelen 2.17 tot en met 2.20][ref1] van overeenkomstige toepassing, waarbij in plaats van het in die artikelen
      aangegeven niveau van eisen wordt uitgegaan van het rechtens verkregen niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.21
