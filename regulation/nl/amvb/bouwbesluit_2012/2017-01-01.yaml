    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.81
  - number: 2.82.1
    text: Een besloten ruimte ligt in een brandcompartiment.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.82
  - number: 2.82.2
    text: Een wegtunnelbuis met een lengte van meer dan 250 m ligt in een brandcompartiment.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.82
  - number: 2.82.3
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.82
  - number: 2.82.3.a
    text: een toiletruimte;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.82
  - number: 2.82.3.b
    text: een badruimte;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.82
  - number: 2.82.3.c
    text: |-
      een liftschacht, indien de constructieonderdelen aan de binnenzijde van de schacht voldoen aan brandklasse B en aan
      rookklasse s2, beide bepaald volgens NEN-EN 13501-1, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.82
  - number: 2.82.3.d
    text: |-
      een technische ruimte met een gebruiksoppervlakte van ten hoogste 50 m2 niet bestemd voor een of meer
      verbrandingstoestellen met een totale nominale belasting van meer dan 130 kW.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.82
  - number: 2.82.4
    text: In afwijking van het eerste lid voert een extra beschermde vluchtroute niet door een brandcompartiment.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.82
  - number: 2.82.5
    text: Een niet besloten gebruiksgebied ligt in een brandcompartiment.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.82
  - number: 2.82.6
    text: |-
      Het eerste en vijfde lid zijn niet van toepassing op een of meer gebruiksfuncties van dezelfde soort met een totale
      gebruiksoppervlakte van ten hoogste 1.000 m2 en een vuurbelasting niet groter dan 500 MJ/m2, bepaald volgens NEN
      6090.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.82
  - number: 2.82.7
    text: |-
      Het eerste en vijfde lid zijn niet van toepassing op een bouwwerk met een gebruiksoppervlakte van niet meer dan 50
      m2. Deze uitzondering geldt niet indien het bouwwerk aan een of meer andere bouwwerken grenst en de gezamenlijke
      gebruiksoppervlakte groter is dan 50 m2.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.82
  - number: 2.82.8
    text: |-
      Het eerste en vijfde lid zijn niet van toepassing op een lichte industriefunctie uitsluitend bestemd voor het
      bedrijfsmatig telen, kweken of opslaan van gewassen of daarmee vergelijkbare producten, met een permanente
      vuurbelasting niet groter dan 150 MJ/m2, bepaald volgens NEN 6090.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.82
  - number: 2.83.1
    text: |-
      Een brandcompartiment heeft een gebruiksoppervlakte die niet groter is dan de in [tabel 2.81][ref1] aangegeven
      waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.83
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.10.1
        afdeling: '2.10'
  - number: 2.83.2
    text: |-
      In een brandcompartiment liggen ten hoogste vier woonwagens en nevenfuncties daarvan met een totale
      gebruiksoppervlakte van ten hoogste 1.000 m2.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.83
  - number: 2.83.3
    text: Een brandcompartiment strekt zich uit over niet meer dan een perceel.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.83
  - number: 2.83.4
    text: Een brandcompartiment strekt zich uit over niet meer dan een wegtunnelbuis.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.83
  - number: 2.83.5
    text: In een brandcompartiment liggen ten hoogste een woonfunctie en nevenfuncties daarvan.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.83
  - number: 2.83.6
    text: |-
      In afwijking van het vijfde lid is een gemeenschappelijk verblijfsgebied toegestaan, indien dat verblijfsgebied een
      afzonderlijk brandcompartiment is.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.83
  - number: 2.83.7
    text: |-
      Een technische ruimte met een gebruiksoppervlakte van meer dan 50 m2 of een technische ruimte waarin een of meer
      verbrandingstoestellen met een totale nominale belasting van meer dan 130 kW worden opgesteld, is een afzonderlijk
      brandcompartiment.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.83
  - number: 2.83.8
    text: |-
      Bij een brandcompartiment van een industriefunctie met een gebruiksoppervlakte van meer dan 1.000 m2 is het
      eerste lid niet van toepassing op een of meer in dat brandcompartiment gelegen nevenfuncties met een totale
      gebruiksoppervlakte van ten hoogste 100 m2.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.83
  - number: 2.83.9
    text: |-
      In afwijking van het eerste lid is de gebruiksoppervlakte van een brandcompartiment met een of meer cellen ten
      hoogste 500 m2 en niet groter dan 77% van de gebruiksoppervlakte van het gebouw.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.83
  - number: 2.83.10
    text: |-
      Een brandcompartiment met bedgebied voor bedgebonden patiënten is niet groter dan 77% van de gebruiksoppervlakte
      van de bouwlaag waarop dit brandcompartiment ligt.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.83
  - number: 2.83.11
    text: Een technische ruimte is een afzonderlijk brandcompartiment.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.83
  - number: 2.84.1
    text: |-
      De volgens NEN 6068 bepaalde weerstand tegen branddoorslag en brandoverslag van een brandcompartiment naar een
      ander brandcompartiment, naar een besloten ruimte waardoor een extra beschermde vluchtroute voert, naar een niet
      besloten veiligheidsvluchtroute en naar een liftschacht van een brandweerlift is ten minste 60 minuten.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.84
  - number: 2.84.2
    text: |-
      In afwijking van het eerste lid kan tussen een brandcompartiment en een besloten ruimte waardoor een extra
      beschermde vluchtroute voert worden volstaan met 30 minuten.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.84
  - number: 2.84.3
    text: 'In afwijking van het eerste lid kan worden volstaan met 30 minuten indien:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.84
  - number: 2.84.3.a
    text: de volgens NEN 6090 bepaalde permanente vuurbelasting van het brandcompartiment niet groter is dan 500 MJ/m2, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.84
  - number: 2.84.3.b
    text: in het gebouw geen vloer van een verblijfsgebied hoger ligt dan 7 m boven het meetniveau.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.84
  - number: 2.84.4
    text: 'In afwijking van het eerste lid kan worden volstaan met 30 minuten indien:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.84
  - number: 2.84.4.a
    text: de in het eerste lid bedoelde besloten ruimten op hetzelfde perceel liggen, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.84
  - number: 2.84.4.b
    text: in het gebouw geen vloer van een gebruiksgebied hoger ligt dan 5 m boven het meetniveau.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.84
  - number: 2.84.5
    text: Het vierde lid is niet van toepassing op een brandcompartiment met een gebruiksoppervlakte van meer dan 1.000 m2.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.84
  - number: 2.84.6
    text: Het vierde lid is niet van toepassing op een technische ruimte.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.84
  - number: 2.84.7
    text: Het tweede tot en met vierde lid gelden niet voor een ruimte waardoor een veiligheidsvluchtroute voert.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.84
  - number: 2.84.8
    text: |-
      Bij het bepalen van de weerstand tegen branddoorslag en brandoverslag van een brandcompartiment naar een ruimte
      van een op een aangrenzend perceel gelegen gebouw wordt voor het op het andere perceel gelegen gebouw uitgegaan van
      een identiek maar spiegelsymmetrisch ten opzichte van de perceelsgrens gelegen gebouw. Indien het perceel grenst
      aan een openbare weg, openbaar water, openbaar groen, of een perceel dat niet is bestemd voor bebouwing of voor
      een speeltuin, een kampeerterrein of opslag van brandgevaarlijke stoffen of van brandbare niet milieugevaarlijke
      stoffen vindt deze spiegeling plaats ten opzichte van het hart van die weg, dat water, dat groen of dat perceel.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.84
  - number: 2.84.9
    text: |-
      De volgens NEN 6068 bepaalde weerstand tegen branddoorslag en brandoverslag van een woonwagen naar een andere
      woonwagen is ten minste 30 minuten. Bij de bepaling van deze weerstand wordt uitgegaan van een identieke maar
      spiegelsymmetrisch op een afstand van 5 m geplaatste woonwagen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.84
  - number: 2.84.10
    text: |-
      De volgens NEN 6068 bepaalde weerstand tegen branddoorslag en brandoverslag van een brandcompartiment naar
      een ander brandcompartiment is ten minste 30 minuten of de afstand tussen een brandcompartiment en een ander
      brandcompartiment is ten minste 5 meter.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.84
  - number: 2.84.11
    text: |-
      In afwijking van het eerste lid geldt geen weerstand tegen branddoorslag en brandoverslag van een brandcompartiment
      naar een technische ruimte met een gebruiksoppervlakte van ten hoogste 50 m2 niet bestemd voor een of meer
      verbrandingstoestellen met een totale nominale belasting van meer dan 130 kW.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.84
  - number: '2.85'
    text: |-
      Op het gedeeltelijk vernieuwen of veranderen of het vergroten van een bouwwerk zijn de
      [artikelen 2.82 tot en met 2.84][ref1] van overeenkomstige toepassing, waarbij in plaats van het in die artikelen
      aangegeven niveau van eisen wordt uitgegaan van het rechtens verkregen niveau en een weerstand tegen branddoorslag
      en brandoverslag van ten minste 30 minuten.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.85
