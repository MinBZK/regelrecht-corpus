  - number: '1.13'
    text: |-
      Indien aan een omgevingsvergunning voor een activiteit als bedoeld in [artikel 2.1, eerste lid, onder f][ref1],
      dan wel [artikel 2.2, eerste lid, onder b, van de Wabo][ref2] een voorschrift is verbonden dat afwijkt van een bij
      of krachtens dit besluit vastgesteld voorschrift voor het geheel of gedeeltelijk vernieuwen of veranderen of het
      vergroten van een bouwwerk, is uitsluitend het aan die vergunning verbonden voorschrift van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
