    text: Een verblijfsruimte ligt in een beschermd subbrandcompartiment.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.98
  - number: 2.98.5
    text: Een bedruimte ligt in een beschermd subbrandcompartiment.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.98
  - number: 2.98.6
    text: Een cel ligt in een beschermd subbrandcompartiment.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.98
  - number: 2.98.7
    text: Een logiesverblijf ligt in een beschermd subbrandcompartiment.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.98
  - number: 2.99.1
    text: |-
      Een beschermd subbrandcompartiment heeft een gebruiksoppervlakte van ten hoogste de in [tabel 2.97][ref1]
      aangegeven waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.99
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.11.2
        afdeling: '2.11'
  - number: 2.99.2
    text: |-
      In afwijking van het eerste lid heeft een beschermd subbrandcompartiment met uitsluitend gezamenlijke ruimten een
      gebruiksoppervlakte van ten hoogste 1.000 m2.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.99
  - number: 2.99.3
    text: Een cel is een afzonderlijk beschermd subbrandcompartiment.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.99
  - number: 2.99.4
    text: |-
      Een beschermd subbrandcompartiment met bedgebied omvat uitsluitend een of meer bedruimten en ruimten die ten
      dienste staan van die bedruimten, en heeft een totale gebruiksoppervlakte van ten hoogste 1.000 m2.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.99
  - number: 2.99.5
    text: |-
      Een beschermd subbrandcompartiment als bedoeld in het vierde lid, bestemd voor bedgebonden patiënten heeft,
      afhankelijk van het bewakingsniveau, een totale gebruiksoppervlakte van ten hoogste 100 m2 zonder bewaking en ten
      hoogste 1000 m2 bij permanente bewaking.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.99
  - number: 2.99.6
    text: Een logiesverblijf is een afzonderlijk beschermd subbrandcompartiment.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.99
  - number: 2.99.7
    text: Een afzonderlijk beschermd subbrandcompartiment is een afzonderlijk subbrandcompartiment.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.99
  - number: 2.100.1
    text: |-
      De volgens NEN 6075 bepaalde weerstand tegen rookdoorgang van een subbrandcompartiment naar een besloten ruimte in
      het brandcompartiment is ten minste 20 minuten.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.100
  - number: 2.100.2
    text: |-
      De volgens NEN 6068 bepaalde weerstand tegen branddoorslag en brandoverslag van een beschermd subbrandcompartiment
      als bedoeld in [artikel 2.99][ref1] naar een andere ruimte in het brandcompartiment is ten minste 20 minuten.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.100
    references:
