  - number: 4.19.3
    text: Een integraal toegankelijke badruimte heeft een vloeroppervlakte van ten minste 1,6 m x 1,8 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.19
  - number: 4.19.4
    text: |-
      Een integraal toegankelijke badruimte die is samengevoegd met een toiletruimte heeft een vloeroppervlakte van ten
      minste 2,2 m x 2,2 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.19
  - number: 4.19.5
    text: |-
      Een vloeroppervlakte als bedoeld in het eerste tot en met vierde lid, heeft boven die vloer ten minste de in
      [tabel 4.17][ref1] aangegeven hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel4
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.19
