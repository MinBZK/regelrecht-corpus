  - number: 2.50.1
    text: |-
      Een te bouwen bouwwerk heeft zodanige beweegbare constructieonderdelen dat deze geen hinder veroorzaken bij het
      vluchten door en bij het gebruik van een aangrenzende openbare ruimte.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.50
  - number: 2.50.2
    text: Aan de in het eerste lid gestelde eis wordt voldaan door toepassing van de voorschriften in deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.50
  - number: 2.51.1
    text: |-
      Een beweegbaar constructieonderdeel dat zich in geopende stand kan bevinden boven een voor motorvoertuigen
      openstaande weg of boven een strook van 0,6 m grenzend aan die weg, ligt, gemeten vanaf de onderzijde van dat
      onderdeel, meer dan 4,2 m boven die weg of strook.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.51
  - number: 2.51.2
    text: |-
      Een beweegbaar constructieonderdeel dat zich in geopende stand kan bevinden boven een niet voor motorvoertuigen
      openstaande weg, ligt, gemeten vanaf de onderzijde van dat onderdeel, meer dan 2,2 m boven die weg. Dit voorschrift
      geldt niet voor een nooddeur.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.51
  - number: 2.51.3
    text: |-
      Een beschermde vluchtroute die langs een beweegbaar constructieonderdeel voert, heeft met het constructieonderdeel
      in geopende stand, een vrije doorgang met een breedte van ten minste 0,6 m en een hoogte van ten minste 2,2 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.51
  - number: 2.51.4
    text: |-
      Het eerste tot en met derde lid gelden niet voor een deur van een ruimte met een vloeroppervlakte van minder dan
      0,5 m2.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.51
  - number: '2.52'
    text: |-
      Op het geheel of gedeeltelijk vernieuwen of veranderen of het vergroten van een bouwwerk is
      [artikel 2.51, eerste lid][ref1], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.52
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.7.1
        afdeling: '2.7'
  - number: '2.53'
    text: |-
