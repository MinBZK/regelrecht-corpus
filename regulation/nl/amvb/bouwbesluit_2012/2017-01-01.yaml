  - number: 6.28.1
    text: Een te bouwen gebruiksfunctie heeft ten minste een brandslanghaspel.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.28
  - number: 6.28.2
    text: |-
      Een te bouwen gebruiksfunctie heeft ten minste een brandslanghaspel indien de gebruiksoppervlakte van de
      gebruiksfunctie of de totale gebruiksoppervlakte aan gebruiksfuncties van dezelfde soort in het gebouw groter is
      dan de grenswaarde vermeld in [tabel 6.27][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.28
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.7'
  - number: 6.28.3
    text: |-
      De gecorrigeerde loopafstand tussen een brandslanghaspel als bedoeld in het eerste en tweede lid en elk punt van de
      vloer van een gebruiksfunctie is niet groter dan de lengte van de brandslang, vermeerderd met 5 m. Dit geldt niet
      voor een niet in een functiegebied gelegen vloer die uitsluitend door niet besloten ruimten kan worden bereikt.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.28
  - number: 6.28.4
    text: 'Een brandslanghaspel als bedoeld in het eerste en tweede lid:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.28
  - number: 6.28.4.a
    text: heeft een slang met een lengte van niet meer dan 30 m;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.28
  - number: 6.28.4.b
    text: |-
      is aangesloten op een voorziening voor drinkwater als bedoeld in [artikel 6.12][ref1], die bij het mondstuk een
      statische druk geeft van niet minder dan 100 kPa en een capaciteit heeft van 1,3 m3/h bij gelijktijdig gebruik van
      twee brandslanghaspels, en


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.28
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.3'
  - number: 6.28.4.c
    text: ligt niet in een ruimte met een trap waarover een beschermde vluchtroute voert.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.28
  - number: 6.29.1
    text: |-
      Een gebruiksfunctie met een vloer van een verblijfsgebied hoger gelegen dan 20 m boven het meetniveau, heeft een
      droge blusleiding.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.29
  - number: 6.29.2
    text: |-
      Bij ministeriële regeling kan een droge blusleiding in andere gevallen dan in het eerste lid bepaald worden
      voorgeschreven en kunnen voorschriften ter zake van droge blusleidingen worden gegeven.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.29
  - number: 6.29.3
    text: |-
      Een wegtunnelbuis heeft een op een in artikel 6.30 bedoelde bluswatervoorziening aangesloten droge blusleiding met
      in elke hulppost als bedoeld in [afdeling 2.13][ref1] een brandslangaansluiting die bij brand een capaciteit van
      ten minste 120 m3/h kan leveren.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.29
    references:
      - id: ref1
        bwb_id: BWBR0030461
        hoofdstuk: '2'
        afdeling: '2.13'
  - number: 6.29.4
    text: |-
      De loopafstand tussen een brandslangaansluiting van een in het eerste lid bedoelde droge blusleiding en een punt
      in een op die aansluiting aangewezen gebruiksgebied is niet groter dan 60 m voor nieuwbouw en 110 m voor bestaande
      bouw.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.29
  - number: 6.29.5
    text: Een te installeren droge blusleiding voldoet aan NEN 1594.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.29
  - number: 6.29.6
    text: 'De inrichting van een bestaande droge blusleiding voldoet aan NEN 1594 voor:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.29
  - number: 6.29.6.a
    text: de drukbestendigheid;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.29
  - number: 6.29.6.b
    text: de onbrandbaarheid van het materiaal van de leiding;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.29
  - number: 6.29.6.c
    text: de soorten koppelingen voor de aansluiting van brandslangen;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.29
  - number: 6.29.6.d
    text: de aanduiding van de brandslangaansluitingen, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.29
  - number: 6.29.6.e
    text: de aanduiding van de voedingsaansluitingen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.29
  - number: 6.29.7
    text: |-
      Onverminderd het bepaalde in [artikel 1.16, eerste lid][ref1], worden een bij of krachtens de wet voorgeschreven
      droge blusleiding en een pompinstallatie bij oplevering en daarna eenmaal in de vijf jaar getest volgens NEN 1594.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.29
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.4'
  - number: 6.30.1
    text: |-
      Een bouwwerk heeft een toereikende bluswatervoorziening. Dit geldt niet indien de aard, ligging of het gebruik van
      het bouwwerk dat naar het oordeel van het bevoegd gezag niet vereist.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.30
  - number: 6.30.2
    text: |-
      Een wegtunnel heeft een bluswatervoorziening die bij brand gedurende ten minste 60 minuten een capaciteit van ten
      minste 120 m3/h kan leveren.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.30
  - number: 6.30.3
    text: |-
      De afstand tussen een bluswatervoorziening als bedoeld in het eerste lid en een brandweeringang als bedoeld in
      [artikel 6.36, eerste lid][ref1], is ten hoogste 40 m.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.30
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.8'
  - number: 6.30.4
    text: Een bluswatervoorziening als bedoeld in het eerste en tweede lid is onbeperkt toegankelijk voor bluswerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.30
  - number: 6.31.1
    text: |-
      Voor zover daarin niet reeds voldoende door de aanwezigheid van brandslanghaspels is voorzien, is een gebouw
      voorzien van voldoende draagbare of verrijdbare blustoestellen om een beginnende brand zo snel mogelijk door in het
      gebouw aanwezige personen te laten bestrijden.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.31
  - number: 6.31.2
    text: |-
      Bij een woonfunctie voor kamergewijze verhuur is aan het eerste lid voldaan met een toestel in een gezamenlijke
      keuken en ten minste een per bouwlaag in een ruimte waardoor een gezamenlijke vluchtroute voert.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.31
  - number: 6.31.3
    text: |-
      Elke hulppost als bedoeld in [artikel 2.122][ref1] heeft een draagbaar brandblusapparaat.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.31
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.13.1
        afdeling: '2.13'
  - number: 6.31.4
    text: |-
      Onverminderd het bepaalde in [artikel 1.16, eerste lid][ref1], wordt ten minste eenmaal per twee jaar
      overeenkomstig NEN 2559 op adequate wijze het nodige onderhoud aan een bij of krachtens de wet voorgeschreven
      draagbaar of verrijdbaar blustoestel verricht en de goede werking van dat blustoestel gecontroleerd.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.31
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.4'
  - number: 6.32.1
    text: |-
      Een bij of krachtens de wet voorgeschreven automatische brandblusinstallatie is voorzien van een geldig
      inspectiecertificaat dat is afgegeven op grond van het CCV-inspectieschema Vastopgestelde Brandbeheersings- en
      Brandblussystemen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.32
  - number: 6.32.2
    text: |-
      Een bij of krachtens de wet voorgeschreven rookbeheersingsinstallatie is voorzien van een geldig
      inspectiecertificaat dat is afgegeven op grond van het CCV-inspectieschema Rookbeheersingsinstallaties.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.32
  - number: '6.33'
    text: |-
      Een voorziening voor het bestrijden van brand als bedoeld in de [artikelen 6.28][ref1] en [6.31][ref2] is duidelijk
      zichtbaar opgehangen of gemarkeerd met een pictogram als bedoeld in NEN 3011.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.33
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.7'
      - id: ref2
        bwb_id: BWBR0030461
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.7'
  - number: '6.34'
    text: |-
      Op het bouwen van een tijdelijk bouwwerk zijn de [artikelen 6.28][ref1] en [6.29][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.34
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.7'
      - id: ref2
        bwb_id: BWBR0030461
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.7'
  - number: 6.35.1
    text: |-
      Een bouwwerk is zodanig bereikbaar voor hulpverleningsdiensten dat tijdig bluswerkzaamheden kunnen worden
      uitgevoerd en hulpverlening kan worden geboden.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.35
  - number: 6.35.2
    text: |-
      Voor zover voor een gebruiksfunctie in tabel 6.35 voorschriften zijn aangewezen, wordt voor die gebruiksfunctie aan
      de in het eerste lid gestelde eis voldaan door toepassing van die voorschriften.
