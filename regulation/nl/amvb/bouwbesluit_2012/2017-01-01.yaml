  - number: 2.98.1
    text: |-
      Een brandcompartiment is ingedeeld in een of meer subbrandcompartimenten of ruimten waardoor een beschermde route
      voert.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.98
  - number: 2.98.2
    text: Een beschermde route ligt niet in het subbrandcompartiment waarin de vluchtroute begint.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.98
  - number: 2.98.3
    text: |-
      In afwijking van het eerste lid kan een verblijfsgebied voor bewaking buiten een subbrandcompartiment liggen
      indien:
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.98
  - number: 2.98.3.a
    text: |-
      constructieonderdelen in dat gebied voldoen aan de eisen die [artikel 2.76][ref1] stelt aan constructieonderdelen
      die grenzen aan de binnenlucht in een ruimte waardoor een beschermde route voert, en


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.98
