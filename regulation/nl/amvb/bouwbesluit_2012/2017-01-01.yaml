        afdeling: '2.7'
  - number: 2.54.1
    text: |-
      Een bestaand bouwwerk heeft zodanige beweegbare constructieonderdelen dat deze geen hinder veroorzaken bij het
      vluchten en bij het gebruik van een aangrenzende openbare ruimte.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.54
  - number: 2.54.2
    text: Aan de in het eerste lid gestelde eis wordt voldaan door toepassing van het voorschrift in deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.54
  - number: '2.55'
    text: |-
      Een beweegbaar constructieonderdeel dat zich in geopende stand kan bevinden boven een voor motorvoertuigen
      openstaande weg, ligt, gemeten vanaf de onderzijde van dat onderdeel, meer dan 4,2 m boven die weg.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.55
  - number: 2.56.1
    text: Een te bouwen bouwwerk is zodanig dat het ontstaan van een brandgevaarlijke situatie voldoende wordt beperkt.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.56
  - number: 2.56.2
    text: Aan de in het eerste lid gestelde eis wordt voldaan door toepassing van de voorschriften in deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.56
  - number: '2.57'
    text: |-
      Materiaal ter plaatse van of nabij een stookplaats voldoet aan brandklasse A1 of voor zover het de bovenzijde van
      een vloer, een trap of een hellingbaan betreft aan brandklasse A1, beide bepaald volgens NEN-EN 13501-1, indien:
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.57
  - number: 2.57.a
    text: |-
      op het materiaal een intensiteit aan warmtestraling kan optreden die, bepaald volgens NEN 6061, groter is dan 2 kW/
      m2, of
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.57
  - number: 2.57.b
    text: in het materiaal een temperatuur kan optreden die, bepaald volgens NEN 6061, hoger is dan 90 °C.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.57
  - number: 2.58.1
    text: |-
      Materiaal toegepast aan de binnenzijde van een schacht, een koker of een kanaal grenzend aan meer dan een
      brandcompartiment of subbrandcompartiment met een inwendige doorsnede groter dan 0,015 m2, voldoet aan brandklasse
      A2, bepaald volgens NEN-EN 13501-1.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.58
  - number: 2.58.2
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.58
  - number: 2.58.2.a
    text: |-
      een schacht die uitsluitend is bestemd voor een of meer boven elkaar gelegen toiletruimten of badruimten en die
      niet door andere ruimten voert;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.58
  - number: 2.58.2.b
    text: ten hoogste 5% van de totale oppervlakte van de in dat lid bedoelde binnenzijde, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.58
  - number: 2.58.2.c
    text: |-
      het materiaal van een constructie- of installatieonderdeel dat wordt omsloten door een in dat lid bedoelde schacht,
      koker of kanaal.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.58
  - number: 2.59.1
    text: Een afvoervoorziening voor rookgas is brandveilig, bepaald volgens NEN 6062.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.59
  - number: 2.59.2
    text: |-
      De horizontale afstand tussen de uitmonding van een afvoervoorziening voor rookgas van een op vaste brandstof
      gestookt toestel en een brandgevaarlijk dak als bedoeld in NEN 6063, van een ander bouwwerk is ten minste 15 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.59
  - number: '2.60'
    text: |-
      Een opstelplaats voor een open verbrandingstoestel ligt niet in een toiletruimte, een badruimte, of een ruimte voor
      het stallen van motorvoertuigen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.60
  - number: '2.61'
    text: |-
      Op het bouwen van een tijdelijk bouwwerk zijn de artikelen [2.57 tot en met 2.59][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.61
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.8.1
        afdeling: '2.8'
  - number: 2.62.1
    text: Een bestaand bouwwerk is zodanig dat het ontstaan van een brandgevaarlijke situatie voldoende wordt beperkt.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.62
  - number: 2.62.2
    text: Aan de in het eerste lid gestelde eis wordt voldaan door toepassing van de voorschriften in deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.62
  - number: 2.63.1
    text: 'Materiaal ter plaatse van of nabij een stookplaats is onbrandbaar, bepaald volgens NEN 6064, indien:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.63
  - number: 2.63.1.a
    text: |-
      op het materiaal een intensiteit aan warmtestraling kan optreden die, bepaald volgens NEN 6061, groter is dan 2 kW/
      m2, of
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.63
  - number: 2.63.1.b
    text: in het materiaal een temperatuur kan optreden die, bepaald volgens NEN 6061, hoger is dan 90 °C.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.63
  - number: 2.63.2
    text: |-
      Bij toepassing van het eerste lid kan in plaats van onbrandbaar, bepaald volgens NEN 6064 worden uitgegaan van
      brandklasse A1, of A1, bepaald volgens NEN-EN 13501-1.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.63
  - number: 2.64.1
    text: |-
      Een afvoervoorziening voor rookgas is brandveilig. Of de afvoervoorziening brandveilig is kan worden bepaald
      volgens NEN 8062.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.64
  - number: 2.64.2
    text: |-
      De horizontale afstand tussen de uitmonding van een afvoervoorziening voor rookgas van een op vaste brandstof
      gestookt toestel en een brandgevaarlijk dak als bedoeld in NEN 6063, van een ander bouwwerk is ten minste 15 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.64
  - number: '2.65'
    text: Een opstelplaats voor een open verbrandingstoestel ligt niet in een toiletruimte of een badruimte.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.65
  - number: 2.66.1
    text: Een te bouwen bouwwerk is zodanig dat brand en rook zich niet snel kunnen ontwikkelen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.66
  - number: 2.66.2
    text: |-
