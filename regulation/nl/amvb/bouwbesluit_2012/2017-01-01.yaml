      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.10.1
        afdeling: '2.10'
  - number: '2.86'
    text: |-
      Op het bouwen van een tijdelijk bouwwerk zijn de [artikelen 2.82][ref1] en [2.83][ref2] van toepassing en is
      [artikel 2.84][ref3] van overeenkomstige toepassing waarbij de weerstand tegen branddoorslag en brandoverslag ten
      minste 30 minuten is.


