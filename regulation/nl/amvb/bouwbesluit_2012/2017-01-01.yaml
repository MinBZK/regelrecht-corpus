  - number: 3.12.1
    text: |-
      Een te bouwen woongebouw heeft in een gemeenschappelijke verkeersruimte een zodanige geluidsabsorptie, dat
      geluidhinder door galm wordt beperkt.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.12
  - number: 3.12.2
    text: Aan de in het eerste lid gestelde eis wordt voldaan door toepassing van de voorschriften in deze afdeling.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.12
  - number: '3.13'
    text: |-
      Een besloten gemeenschappelijke verkeersruimte voor het ontsluiten van een woonfunctie die grenst aan een niet-
      gemeenschappelijke ruimte van een woonfunctie, heeft een volgens NEN-EN 12354-6 bepaalde totale geluidsabsorptie
      met een getalswaarde, uitgedrukt in m2, die niet kleiner is dan 1/8 van de getalswaarde van de inhoud van die
      ruimte, uitgedrukt in m3, in elk van de octaafbanden met middenfrequenties van 250, 500, 1.000 en 2.000 Hz.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.13
  - number: '3.14'
    text: |-
      Op het gedeeltelijk vernieuwen of veranderen of het vergroten van een woongebouw is [artikel 3.13][ref1] van
      overeenkomstige toepassing, waarbij in plaats van het in dat artikel aangegeven niveau van eisen wordt uitgegaan
      van het rechtens verkregen niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel3
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.14
