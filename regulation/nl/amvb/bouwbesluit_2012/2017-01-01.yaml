        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.4.1
        afdeling: '2.4'
  - number: 2.30.1
    text: |-
      Een bestaand bouwwerk heeft in een vluchtroute voorzieningen voor het veilig overbruggen van hoogteverschillen
      door personen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.30
  - number: 2.30.2
    text: Aan de in het eerste lid gestelde eis wordt voldaan door toepassing van het voorschrift in deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.30
  - number: 2.31.1
    text: |-
      Een hoogteverschil van meer dan 0,22 m tussen vloeren waarover een vluchtroute voert, of tussen een van die vloeren
      en het aansluitende terrein, wordt overbrugd door een vaste trap of een vaste hellingbaan.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.31
  - number: 2.31.2
    text: |-
      Voor zover de vluchtroute door een wegtunnelbuis voert, geldt in afwijking van het eerste lid een hoogteverschil
      van meer dan 0,3 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.31
  - number: 2.32.1
    text: |-
      Een te bouwen trap die een hoogteverschil als bedoeld in [artikel 2.27][ref1] overbrugt, kan veilig worden
      gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.32
