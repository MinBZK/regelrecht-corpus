  - number: 3.66.1
    text: |-
      Een bestaand bouwwerk is zodanig dat het ontstaan van een voor de gezondheid nadelige kwaliteit van de binnenlucht
      door de aanwezigheid van voor de gezondheid schadelijke stoffen beperkt is.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.66
  - number: 3.66.2
    text: |-
      Aan de in het eerste lid gestelde eis wordt voldaan door toepassing van het voorschrift in deze paragraaf en de
      krachtens die bepaling gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.66
  - number: '3.67'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gegeven over het in een bouwwerk aanwezig zijn van materialen
      waaruit giftige of hinderlijke stoffen kunnen vrijkomen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.67
