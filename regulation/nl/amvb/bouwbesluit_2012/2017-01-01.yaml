  - number: 3.75.1
    text: |-
      Een verblijfsgebied heeft een volgens NEN 2057 bepaalde equivalente daglichtoppervlakte in m2 waarvan de
      getalswaarde niet kleiner is dan de getalswaarde van het in tabel 3.74 aangegeven deel van de vloeroppervlakte in
      m2 van dat verblijfsgebied.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.75
  - number: 3.75.2
    text: |-
      Een verblijfsruimte heeft een volgens NEN 2057 bepaalde equivalente daglichtoppervlakte die niet kleiner is dan de
      in tabel 3.74 gegeven oppervlakte.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.75
  - number: 3.75.3
    text: 'Bij het bepalen van een equivalente daglichtoppervlakte als bedoeld in het eerste en tweede lid:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.75
  - number: 3.75.3.a
    text: blijven bouwwerken en daarmee gelijk te stellen belemmeringen, die op een ander perceel liggen, buiten beschouwing;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.75
  - number: 3.75.3.b
    text: |-
      blijven daglichtopeningen in een uitwendige scheidingsconstructie, die op een loodrecht op het projectievlak van
      die openingen gemeten afstand van minder dan 2 m vanaf de perceelsgrens liggen, buiten beschouwing, waarbij, indien
      het perceel waarop de gebruiksfunctie ligt, grenst aan een openbare weg, openbaar water of openbaar groen, de
      afstand wordt aangehouden tot het hart van de weg, het openbaar groen of het openbaar water, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.75
  - number: 3.75.3.c
    text: |-
      is de in rekening te brengen belemmeringshoek α, bedoeld in NEN 2057 voor elk te onderscheiden segment niet kleiner
      dan 20°.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.75
  - number: 3.75.4
    text: |-
      Het eerste en tweede lid gelden niet voor een bouwwerk of een gedeelte daarvan voor de landsverdediging of de
      bescherming van de bevolking.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.75
  - number: 3.75.5
    text: Het eerste en tweede lid gelden niet voor een bedgebied dat niet mede bestemd is voor spelactiviteiten.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.75
  - number: 3.75.6
    text: |-
      In afwijking van het eerste en tweede lid, kan in een cel of andere ruimte als bedoeld in de regeling
      politiecellencomplex worden volstaan met het waarneembaar zijn van de dag- en nachtcyclus.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.75
  - number: 3.75.7
    text: Het eerste en tweede lid gelden uitsluitend voor een bedgebied.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.75
  - number: 3.75.8
    text: |-
      Bij de bepaling van de in het eerste lid bedoelde vloeroppervlakte van een verblijfsgebied, blijft een
      verblijfsruimte met een vloeroppervlakte van meer dan 150 m2 buiten beschouwing. Op een dergelijke verblijfsruimte
      is het tweede lid niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.75
  - number: '3.76'
    text: |-
      Op het gedeeltelijk vernieuwen of veranderen of het vergroten van een bouwwerk is [artikel 3.75][ref1] van
      overeenkomstige toepassing, waarbij in plaats van het in dat artikel aangegeven niveau van eisen wordt uitgegaan
      van het rechtens verkregen niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel3
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.76
