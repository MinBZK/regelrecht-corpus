  - number: 1.2.1
    text: |-
      In een bouwwerk of gedeelte daarvan zijn niet meer personen aanwezig dan het aantal personen waarvoor het bouwwerk
      of gedeelte daarvan overeenkomstig dit besluit is bestemd.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.2
  - number: 1.2.2
    text: |-
