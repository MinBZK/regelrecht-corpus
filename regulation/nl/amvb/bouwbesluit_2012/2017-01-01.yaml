  - number: 4.38.1
    text: |-
      Een woonfunctie heeft in ten minste een verblijfsgebied een opstelplaats voor een aanrecht en een opstelplaats voor
      een kooktoestel.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.38
  - number: 4.38.2
    text: |-
      Een gebruiksfunctie heeft een opstelplaats voor een verwarmingstoestel, waarvan de afmetingen zijn afgestemd op
      het te plaatsen toestel. Dit geldt niet indien de gebruiksfunctie wordt aangesloten op een publieke voorziening
      voor verwarming.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.38
  - number: 4.38.3
    text: |-
      Een gebruiksfunctie heeft een opstelplaats voor een warmwatertoestel, waarvan de afmetingen zijn afgestemd op het
      te plaatsen toestel. Dit geldt niet indien de gebruiksfunctie wordt aangesloten op een publieke voorziening voor
      warm water.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.38
  - number: 4.38.4
    text: |-
      Een bijeenkomstfunctie voor alcoholgebruik heeft in ten minste een verblijfsgebied een opstelplaats voor een
      aanrecht.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.38
  - number: 4.39.1
    text: |-
      Een opstelplaats voor een aanrecht als bedoeld in [artikel 4.38, eerste lid][ref1], heeft een vloeroppervlakte van
      ten minste 1,5 m x 0,6 m.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel4
