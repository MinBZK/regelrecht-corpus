  - number: 6.16.1
    text: |-
      Een gebruiksfunctie met een toilet- of badruimte of met een andere opstelplaats voor een lozingstoestel heeft voor
      die opstelplaats een afvoervoorziening voor huishoudelijk afvalwater.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.16
  - number: 6.16.2
    text: 'Een afvoervoorziening voor huishoudelijk afvalwater als bedoeld in het eerste lid heeft:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.16
  - number: 6.16.2.a
    text: |-
      bij een te bouwen bouwwerk: een capaciteit, een lucht- en waterdichtheid en een uitmonding en capaciteit van de
      ontspanningsleiding die voldoen aan NEN 3215;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.16
  - number: 6.16.2.b
    text: |-
      bij een bestaand bouwwerk: een zodanige capaciteit dat elk daarop aangesloten lozingstoestel binnen 5 minuten kan
      worden geleegd en een lucht- en waterdichtheid die voldoen aan NEN 3215.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.16
  - number: 6.17.1
    text: |-
      Een dak van een te bouwen bouwwerk heeft een voorziening voor de opvang en afvoer van hemelwater met een volgens
      NEN 3215 bepaalde capaciteit van ten minste de volgens die norm bepaalde belasting van die voorziening.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.17
  - number: 6.17.2
    text: |-
      Een binnen een bouwwerk gelegen voorziening voor de opvang en afvoer van hemelwater is, bepaald volgens NEN 3215,
      lucht- en waterdicht.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.17
  - number: 6.18.1
    text: |-
      Een ondergrondse doorvoer van een afvoervoorziening als bedoeld in de [artikelen 6.16][ref1] en [6.17][ref2] door
      een uitwendige scheidingconstructie van een bouwwerk ligt zoveel mogelijk haaks op de scheidingsconstructie.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.18
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.4'
      - id: ref2
        bwb_id: BWBR0030461
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.4'
  - number: 6.18.2
    text: |-
      De gebouwaansluiting van een afvoervoorziening als bedoeld in de [artikelen 6.16][ref1] en [6.17][ref2] op de op
      het eigen erf of terrein gelegen riolering of andere voorziening voor afvoer van afvalwater is zodanig dat bij
      zetting de dichtheid van de aansluiting en de afvoer gehandhaafd blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.18
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.4'
      - id: ref2
        bwb_id: BWBR0030461
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.4'
  - number: 6.18.3
    text: 'Een terreinleiding waardoor huishoudelijk afvalwater wordt geleid:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.18
  - number: 6.18.3.a
    text: heeft geen vernauwing in de stroomrichting;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.18
  - number: 6.18.3.b
    text: heeft een vloeiend beloop;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.18
  - number: 6.18.3.c
    text: is waterdicht;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.18
  - number: 6.18.3.d
    text: heeft een voldoende inwendige middellijn, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.18
  - number: 6.18.3.e
    text: bevat geen beer- of rottingput.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.18
  - number: 6.18.4
    text: 'Op aanwijzing van het bevoegd gezag wordt bepaald:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.18
  - number: 6.18.4.a
    text: |-
      indien voor de afvoer van huishoudelijk afvalwater een openbaar vuilwaterriool of een systeem als bedoeld in
      [artikel 10.33, tweede lid, van de Wet milieubeheer][ref1] aanwezig is waarop aangesloten kan worden: op welke
      plaats, op welke hoogte en met welke inwendige middellijn de voor aansluiting van een afvoervoorziening als bedoeld
      in [artikel 6.16][ref2] op dat riool of dat systeem noodzakelijke perceelaansluitleiding bij de gevel van het
      bouwwerk dan wel de grens van het erf of terrein wordt aangelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.18
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0030461
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.4'
  - number: 6.18.4.b
    text: |-
      indien voor de afvoer van hemelwater een openbaar hemelwaterstelsel of een openbaar vuilwaterriool aanwezig
      is waarop aangesloten kan worden en hemelwater op dat stelsel of riool mag worden gebracht: op welke plaats,
      op welke hoogte en met welke inwendige middellijn de voor aansluiting van een afvoervoorziening als bedoeld in
      [artikel 6.17][ref1] op dat stelsel of riool noodzakelijke perceelaansluitleiding bij de gevel van het bouwwerk dan
      wel de grens van het erf of terrein wordt aangelegd, en


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.18
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.4'
  - number: 6.18.4.c
    text: |-
      of, en zo ja welke voorzieningen in de afvoervoorziening of de op het erf of terrein gelegen riolering moeten
      worden aangebracht om het functioneren van de afvoervoorzieningen, naburige aansluitingen en de openbare
      voorzieningen voor de inzameling en het transport van afvalwater te waarborgen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.18
  - number: 6.19.1
    text: Een bouwwerk heeft zodanige voorzieningen dat brand tijdig kan worden ontdekt zodat veilig kan worden gevlucht.
