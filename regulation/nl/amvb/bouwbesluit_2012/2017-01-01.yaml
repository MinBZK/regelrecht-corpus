        afdeling: '5.1'
      - id: ref4
        bwb_id: BWBR0030461
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.1'
  - number: 5.6.4
    text: |-
      In afwijking van het eerste lid zijn op een ingrijpende renovatie als bedoeld in artikel 2 van de herziene
      richtlijn energieprestatie gebouwen de voorschriften van [artikel 5.2][ref1] niet van toepassing en zijn de
      voorschriften van de [artikelen 5.3, eerste tot en met zevende lid][ref2], en [5.4][ref3] van overeenkomstige
      toepassing, waarbij in plaats van het in artikel 5.4 aangegeven niveau van eisen wordt uitgegaan van het rechtens
      verkregen niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0030461#Artikel5
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.1'
      - id: ref2
        bwb_id: BWBR0030461
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.1'
      - id: ref3
        bwb_id: BWBR0030461
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.1'
  - number: 5.6.5
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gegeven over de in het vierde lid bedoelde ingrijpende
      renovatie.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel5.6
  - number: '5.7'
    text: |-
      Op het bouwen van een tijdelijk bouwwerk dat bestemd is om te worden verwarmd is [artikel 5.3][ref1] van
      overeenkomstige toepassing, waarbij de warmteweerstand ten minste 1,3 m2•K/W en de warmtedoorgangscoëfficiënt ten
      hoogste 4,2 W/m2•K bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel5
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.1'
  - number: 5.8.1
    text: |-
      Een te bouwen bouwwerk is zodanig dat de belasting van het milieu door de in het bouwwerk toe te passen materialen
      wordt beperkt.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel5.8
  - number: 5.8.2
    text: |-
      Voor zover voor een gebruiksfunctie in tabel 5.8 voorschriften zijn aangewezen, wordt voor die gebruiksfunctie
      aan de in het eerste lid gestelde eis voldaan door toepassing van die voorschriften en de krachtens die bepalingen
      gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel5.8
  - number: 5.8.3
    text: |-
      Het eerste lid is niet van toepassing op de gebruiksfuncties waarvoor in tabel 5.8 geen voorschrift is aangewezen.
