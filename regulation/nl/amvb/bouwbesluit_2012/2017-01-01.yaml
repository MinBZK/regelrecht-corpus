        paragraaf: 3.6.1
        afdeling: '3.6'
  - number: 3.34.8
    text: De afvoer van binnenlucht uit een toiletruimte of een badruimte vindt rechtstreeks naar buiten plaats.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.34
  - number: 3.34.9
    text: De afvoer van binnenlucht uit een stallingruimte voor motorvoertuigen vindt rechtstreeks naar buiten plaats.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.34
  - number: 3.35.1
    text: |-
      Op het gedeeltelijk vernieuwen of veranderen of het vergroten van een bouwwerk zijn de
      [artikelen 3.29 tot en met 3.34][ref1] van overeenkomstige toepassing, waarbij in plaats van het in die artikelen
      aangegeven niveau van eisen wordt uitgegaan van het rechtens verkregen niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel3
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.35
