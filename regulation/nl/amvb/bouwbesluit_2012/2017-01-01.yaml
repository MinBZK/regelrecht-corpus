    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.28
  - number: 3.29.1
    text: |-
      Een verblijfsgebied heeft een voorziening voor luchtverversing met een volgens NEN 1087 bepaalde capaciteit van ten
      minste 0,9 dm3/s per m2 vloeroppervlakte met een minimum van 7 dm3/s.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.29
  - number: 3.29.2
    text: |-
      Een verblijfsruimte heeft een voorziening voor luchtverversing met een volgens NEN 1087 bepaalde capaciteit van ten
      minste 0,7 dm3/s per m2 vloeroppervlakte met een minimum van 7 dm3/s.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.29
  - number: 3.29.3
    text: |-
      Een verblijfsgebied en een verblijfsruimte heeft een voorziening voor luchtverversing met een volgens NEN 1087
      bepaalde capaciteit van ten minste de in [tabel 3.28][ref1] aangegeven capaciteit per persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel3
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.29
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.1
        afdeling: '3.6'
  - number: 3.29.4
    text: |-
      Onverminderd het eerste tot en met derde lid heeft een verblijfsgebied of een verblijfsruimte, met een opstelplaats
      voor een kooktoestel als bedoeld in [artikel 4.38][ref1] een voorziening voor luchtverversing met een volgens NEN
      1087 bepaalde capaciteit van ten minste 21 dm3/s.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel4
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.29
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.7.1
        afdeling: '4.7'
  - number: 3.29.5
    text: |-
      Een voorziening voor luchtverversing voor meer dan een verblijfsgebied heeft een capaciteit die niet kleiner is dan
      de hoogste waarde die volgens het eerste en derde lid geldt voor elk afzonderlijk verblijfsgebied. In aanvulling
      daarop is de capaciteit niet kleiner dan 70% van de som van de waarden die volgens het eerste, derde en vierde lid
      gelden voor de op die voorziening aangewezen verblijfsgebieden.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.29
  - number: 3.29.6
    text: |-
      Een toiletruimte heeft een voorziening voor luchtverversing met een capaciteit van ten minste 7 dm3/s, bepaald
      volgens NEN 1087.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.29
  - number: 3.29.7
    text: |-
      Een badruimte heeft een voorziening voor luchtverversing met een capaciteit van ten minste 14 dm3/s, bepaald
      volgens NEN 1087.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.29
  - number: '3.30'
    text: |-
      De toevoer van verse lucht veroorzaakt in de leefzone van een verblijfsgebied een volgens NEN 1087 bepaalde
      luchtsnelheid die niet groter is dan 0,2 m/s.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.30
  - number: 3.31.1
    text: |-
      Een voorziening voor natuurlijke toevoer van verse lucht is regelbaar in het gebied van 0% tot 30% van de
      capaciteit als bedoeld in [artikel 3.29][ref1] en heeft, bepaald volgens NEN 1087, naast een laagste stand van
      ten hoogste 10% van die capaciteit en een stand van 100% van die capaciteit, ten minste twee regelstanden in het
      regelgebied die onderling ten minste 10% in capaciteit verschillen.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel3
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.31
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.1
        afdeling: '3.6'
  - number: 3.31.2
    text: |-
      Een voorziening voor mechanische toevoer van verse lucht heeft een dichtstand, is regelbaar in het gebied van 10%
      tot 100% van de capaciteit als bedoeld in [artikel 3.29][ref1] en heeft naast een laagste stand van ten hoogste 10%
      van die capaciteit en een stand van 100% van die capaciteit ten minste een regelstand in het regelgebied.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel3
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.31
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.1
        afdeling: '3.6'
  - number: 3.31.3
    text: |-
      Een voorziening voor toevoer van verse lucht als bedoeld in het eerste en tweede lid mag zelfregelend zijn in het
      regelgebied.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.31
  - number: 3.32.1
    text: |-
      Een gemeenschappelijke verkeersruimte heeft een niet afsluitbare voorziening voor luchtverversing met een volgens
      NEN 1087 bepaalde capaciteit van ten minste 0,5 dm3/s per m2 vloeroppervlakte van die ruimte.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.32
  - number: 3.32.2
    text: |-
      Een ruimte met een opstelplaats voor een gasmeter heeft een niet afsluitbare voorziening voor luchtverversing met
      een volgens NEN 1087 bepaalde capaciteit van ten minste 1 dm3/s per m2 vloeroppervlakte van die ruimte, met een
      minimum van 2 dm3/s.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.32
  - number: 3.32.3
    text: |-
      Een schacht voor een lift heeft een niet afsluitbare voorziening voor luchtverversing met een volgens NEN 1087
      bepaalde capaciteit van ten minste 3,2 dm3/s per m2 vloeroppervlakte van die liftschacht.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.32
  - number: 3.32.4
    text: |-
      Een opslagruimte voor huishoudelijk afval met een vloeroppervlakte van meer dan 1,5 m2 heeft een niet afsluitbare
      voorziening voor luchtverversing met een volgens NEN 1087 bepaalde capaciteit van ten minste 10 dm3/s per m2
      vloeroppervlakte van die ruimte.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.32
  - number: 3.32.5
    text: |-
      Een stallingruimte voor motorvoertuigen heeft een niet afsluitbare voorziening voor luchtverversing met een volgens
      NEN 1087 bepaalde capaciteit van ten minste 3 dm3/s per m2 vloeroppervlakte van die ruimte.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.32
  - number: 3.32.6
    text: |-
      Een tunnel heeft afhankelijk van zijn bestemming en tunnellengte een voorziening voor luchtverversing met voldoende
      capaciteit.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.32
  - number: 3.32.7
    text: |-
      Bij een tunnelbuislengte van meer dan 500 m is de in het zesde lid bedoelde voorziening voor luchtverversing
      mechanisch.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.32
  - number: 3.33.1
    text: |-
      De volgens NEN 1087 bepaalde verdunningsfactor van de uitstoot van een afvoervoorziening voor luchtverversing
      heeft ter plaatse van een instroomopening voor de toevoer van verse lucht voor een voorziening voor luchtverversing
      als bedoeld in [artikel 3.29][ref1] ten hoogste de in tabel 3.33 aangegeven waarde. Bij de bepaling van de
      verdunningsfactor blijven afvoervoorzieningen en belemmeringen die op een ander perceel liggen buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel3
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.33
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.1
        afdeling: '3.6'
  - number: 3.33.2
    text: |-
      De volgens NEN 2757 bepaalde verdunningsfactor van de uitstoot van een afvoervoorziening voor rookgas heeft
      ter plaatse van een instroomopening voor de toevoer van verse lucht voor een voorziening voor luchtverversing
      als bedoeld in [artikel 3.29][ref1] ten hoogste de in tabel 3.33 aangegeven waarde. Bij de bepaling van de
      verdunningsfactor blijven afvoervoorzieningen en belemmeringen die op een ander perceel liggen buiten beschouwing.
            Tabel 3.33 Verdunningsfactoren voor verschillende soorten afvoeren.






                    soort afvoer


                    verdunningsfactor






                    Luchtverversing


                    0,01




                    Afvoervoorziening voor rookgas bij gasgestookte toestellen


                    0,01




                    Afvoervoorziening voor rookgas bij toestellen met andere brandstoffen


                    0,0015


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel3
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.33
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.1
        afdeling: '3.6'
  - number: 3.33.3
    text: |-
      Een instroomopening en een uitmonding van een voorziening voor luchtverversing liggen op een afstand van ten minste
      2 m van de perceelsgrens, gemeten loodrecht op de uitwendige scheidingsconstructie van de gebruiksfunctie. Dit
      geldt niet voor een in een dak gelegen instroomopening of uitmonding. Indien het perceel waarop de gebruiksfunctie
      ligt, grenst aan een openbare weg, openbaar water of openbaar groen, wordt die afstand aangehouden tot het hart van
      die weg, dat water of dat groen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.33
  - number: 3.34.1
    text: |-
      De toevoer van de in [artikel 3.29][ref1] bedoelde hoeveelheid verse lucht naar een verblijfsgebied vindt
      rechtstreeks van buiten plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel3
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.34
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.1
        afdeling: '3.6'
  - number: 3.34.2
    text: |-
      In afwijking van het eerste lid mag, bij de toevoer van verse lucht naar een niet-gemeenschappelijk
      verblijfsgebied, ten hoogste 50% van de in [artikel 3.29][ref1] bedoelde hoeveelheid via een niet-gemeenschappelijk
      verblijfsgebied of niet-gemeenschappelijke verkeersruimte van dezelfde gebruiksfunctie worden aangevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel3
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.34
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.1
        afdeling: '3.6'
  - number: 3.34.3
    text: |-
      De toevoer van verse lucht naar een gemeenschappelijke verkeersruimte vindt rechtstreeks van buiten plaats. Afvoer
      van binnenlucht uit een dergelijke ruimte vindt rechtstreeks naar buiten plaats.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.34
  - number: 3.34.4
    text: |-
      De toevoer van verse lucht naar een schacht voor een lift vindt rechtstreeks van buiten plaats, of via de
      liftmachineruimte van buiten. Afvoer van binnenlucht uit een dergelijke ruimte vindt rechtstreeks naar buiten
      plaats, of via de liftmachineruimte naar buiten.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.34
  - number: 3.34.5
    text: |-
      De toevoer van verse lucht naar een opslagruimte voor huishoudelijk afval vindt rechtstreeks van buiten plaats en
      de afvoer van binnenlucht rechtstreeks naar buiten.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.34
  - number: 3.34.6
    text: |-
      Bij een wegtunnelbuis met een tunnelbuislengte van meer dan 250 m vindt de toevoer van verse lucht rechtstreeks van
      buiten plaats en de afvoer van binnenlucht rechtstreeks naar buiten.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.34
  - number: 3.34.7
    text: |-
      Ten minste 21 dm3/s van de capaciteit van de afvoer van binnenlucht uit een verblijfsgebied of een verblijfsruimte
      waarin zich een opstelplaats voor een kooktoestel, als bedoeld in [artikel 3.29, vierde lid][ref1], bevindt, wordt
      rechtstreeks naar buiten afgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel3
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.34
