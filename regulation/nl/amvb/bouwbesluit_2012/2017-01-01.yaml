    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.48
  - number: '3.49'
    text: |-
      Een ruimte met een opstelplaats voor een verbrandingstoestel heeft voorzieningen voor de toevoer van
      verbrandingslucht en de afvoer van rookgas. Een opstelplaats voor een kooktoestel met een nominale belasting van
      niet meer dan 15 kW, gelegen in een verblijfsruimte, blijft hierbij buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.49
  - number: 3.50.1
    text: |-
      Een voorziening voor de toevoer van verbrandingslucht voor een opstelplaats voor een verbrandingstoestel met
      een nominale belasting van meer dan 130 kW heeft een zodanige capaciteit, dat de verbranding doeltreffend kan
      plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.50
  - number: 3.50.2
    text: |-
      Een voorziening voor de toevoer van verbrandingslucht voor een verbrandingstoestel met een nominale belasting van
      niet meer dan 130 kW heeft ten minste de volgens tabel 3.50.1 benodigde capaciteit, bepaald volgens NEN 1087.
