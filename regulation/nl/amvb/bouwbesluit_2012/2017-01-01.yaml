  - number: '2.2'
    text: |-
      Een bouwconstructie bezwijkt gedurende de in NEN-EN 1990 bedoelde ontwerplevensduur niet bij de fundamentele
      belastingscombinaties als bedoeld in NEN-EN 1990.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.2
  - number: 2.3.1
    text: |-
      Een bouwconstructie bezwijkt gedurende de in NEN-EN 1990 bedoelde ontwerplevensduur niet bij de buitengewone
      belastingscombinaties als bedoeld in NEN-EN 1990, als dit leidt tot het bezwijken van een andere bouwconstructie
      die niet in de directe nabijheid ligt van die bouwconstructie. Daarbij wordt uitgegaan van de bekende buitengewone
      belastingen als bedoeld in NEN-EN 1991.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.3
  - number: 2.3.2
    text: |-
      Een dak of een vloerafscheiding bezwijkt gedurende de in NEN-EN 1990 bedoelde ontwerplevensduur niet bij de
      buitengewone belastingscombinaties als bedoeld in NEN-EN 1990. Daarbij wordt uitgegaan van stootbelastingen als
      bedoeld in NEN-EN 1991.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.3
  - number: 2.4.1
    text: |-
      Het niet bezwijken als bedoeld in de [artikelen 2.2][ref1] en[ 2.3][ref2] wordt bepaald volgens:


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.4
