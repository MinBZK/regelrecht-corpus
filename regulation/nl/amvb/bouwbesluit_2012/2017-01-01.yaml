  - number: '3.8'
    text: |-
      Een toilet met waterspoeling, een kraan, een mechanisch ventilatiesysteem, een warmwatertoestel, een installatie
      voor het verhogen van waterdruk of een lift veroorzaakt in een op een aangrenzend perceel gelegen verblijfsgebied
      een volgens NEN 5077 bepaald karakteristiek installatie-geluidsniveau van ten hoogste 30 dB. Dit geldt niet voor
      een op een aangrenzend perceel gelegen lichte industriefunctie of een overige gebruiksfunctie.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.8
  - number: 3.9.1
    text: |-
      Een toilet met waterspoeling, een kraan, een mechanische voorziening voor luchtverversing, een warmwatertoestel,
      een installatie voor verhoging van waterdruk of een lift veroorzaakt in een niet-gemeenschappelijke verblijfsruimte
      van een aangrenzende op hetzelfde perceel gelegen woonfunctie een volgens NEN 5077 bepaald karakteristiek
      installatie-geluidsniveau van ten hoogste 30 dB.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.9
  - number: 3.9.2
    text: |-
      Een mechanische voorziening voor luchtverversing, warmteopwekking of warmteterugwinning veroorzaakt in een niet-
      gemeenschappelijke verblijfsruimte van de gebruiksfunctie een volgens NEN 5077 bepaald karakteristiek installatie-
      geluidsniveau van ten hoogste de in [tabel 3.7][ref1] aangegeven waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel3
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.9
