  - number: 3.42.1
    text: |-
      Een verblijfsgebied heeft een spuivoorziening met een volgens NEN 1087 bepaalde capaciteit van de spuiventilatie
      van ten minste 6 dm3/s per m2 vloeroppervlakte van dat gebied. In een uitwendige scheidingsconstructie van dat
      gebied zijn beweegbare constructieonderdelen die op die capaciteit zijn afgestemd.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.42
  - number: 3.42.2
    text: |-
      Een verblijfsruimte heeft een spuivoorziening met een volgens NEN 1087 bepaalde capaciteit van de spuiventilatie
      van ten minste 3 dm3/s per m2 vloeroppervlakte van die ruimte. In een uitwendige scheidingsconstructie van
      die ruimte zijn beweegbare constructieonderdelen die op die capaciteit zijn afgestemd. Ten minste een van die
      beweegbare constructieonderdelen is een beweegbaar raam.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.42
  - number: 3.42.3
    text: |-
      In afwijking van het eerste en tweede lid kan de bedoelde capaciteit worden gerealiseerd met een in
      [artikel 3.29][ref1] bedoelde voorziening voor luchtverversing.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel3
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.42
