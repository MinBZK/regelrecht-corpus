  - number: 3.17.1
    text: |-
      Het volgens NEN 5077 bepaalde karakteristieke lucht-geluidniveauverschil voor de geluidsoverdracht van een besloten
      ruimte naar een verblijfsgebied van een aangrenzende woonfunctie op hetzelfde perceel is niet kleiner dan 52 dB.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.17
  - number: 3.17.2
    text: |-
      Het volgens NEN 5077 bepaalde karakteristieke lucht-geluidniveauverschil voor de geluidsoverdracht van een besloten
      ruimte naar een niet in een verblijfsgebied gelegen besloten ruimte van een aangrenzende woonfunctie op hetzelfde
      perceel is niet kleiner dan 47 dB.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.17
  - number: 3.17.3
    text: |-
      Het volgens NEN 5077 bepaalde gewogen contact-geluidniveau voor de geluidsoverdracht van een besloten ruimte naar
      een verblijfsgebied van een aangrenzende woonfunctie op hetzelfde perceel is niet groter dan de in tabel 3.15
      aangegeven waarde.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.17
  - number: 3.17.4
    text: |-
      Het volgens NEN 5077 bepaalde gewogen contact-geluidniveau voor de geluidsoverdracht van een besloten ruimte naar
      een niet in een verblijfsgebied gelegen besloten ruimte van een aangrenzende woonfunctie op hetzelfde perceel is
      niet groter dan de in tabel 3.15 aangegeven waarde.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.17
  - number: 3.17.5
    text: |-
      Het eerste tot en met vierde lid zijn niet van toepassing op de geluidsoverdracht van een nevenfunctie van een
      woonfunctie naar die woonfunctie.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.17
  - number: 3.17.6
    text: |-
      Het eerste tot en met vierde lid zijn niet van toepassing op de geluidsoverdracht van een gemeenschappelijke ruimte
      naar een aangrenzende gemeenschappelijke ruimte.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.17
  - number: 3.17.7
    text: |-
      Het tweede en vierde lid zijn niet van toepassing op de geluidsoverdracht van een besloten ruimte naar een
      gemeenschappelijk verkeersruimte of op de geluidsoverdracht van een gemeenschappelijke verkeersruimte naar een niet
      in een verblijfsgebied gelegen besloten ruimte.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.17
  - number: 3.17.8
    text: |-
      Het eerste tot en met vierde lid zijn niet van toepassing op de geluidsoverdracht van een gemeenschappelijke
      verkeersruimte naar een aangrenzende woonfunctie.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.17
  - number: 3.17a.1
    text: |-
      Het volgens NEN 5077 bepaalde karakteristieke lucht-geluidniveauverschil voor de geluidsoverdracht van een
      verblijfsruimte naar een andere verblijfsruimte van dezelfde woonfunctie is niet kleiner dan 32 dB.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.17a
  - number: 3.17a.2
    text: |-
      Het volgens NEN 5077 bepaalde gewogen contact-geluidniveau voor de geluidsoverdracht van een verblijfsruimte naar
      een andere verblijfsruimte van dezelfde woonfunctie is niet groter dan 79 dB.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.17a
  - number: 3.17a.3
    text: |-
      Het eerste en tweede lid gelden niet indien de verblijfsruimten met elkaar in open verbinding staan, of indien de
      ene verblijfsruimte vanuit de andere rechtstreeks bereikbaar is door een deuropening.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.17a
  - number: '3.18'
    text: |-
      Op het gedeeltelijk vernieuwen of veranderen of het vergroten van een bouwwerk zijn de
      [artikelen 3.16 tot en met 3.17a][ref1] van overeenkomstige toepassing, waarbij in plaats van het in die artikelen
      aangegeven niveau van eisen wordt uitgegaan van het rechtens verkregen niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel3
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.18
