  - number: 3.69.1
    text: |-
      Een uitwendige scheidingsconstructie heeft geen openingen die breder zijn dan 0,01 m. Dit geldt niet voor een
      afsluitbare opening en een uitmonding van:
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.69
  - number: 3.69.1.a
    text: een afvoervoorziening voor luchtverversing;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.69
  - number: 3.69.1.b
    text: een afvoervoorziening voor rookgas, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.69
  - number: 3.69.1.c
    text: een ont- en beluchting van een afvoervoorziening voor huishoudelijk afvalwater en hemelwater.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.69
  - number: 3.69.2
    text: |-
      In afwijking van het eerste lid is een grotere opening toegestaan voor een nest of een vaste rust- of
      verblijfplaats voor bij of krachtens [hoofdstuk 3 van de Wet natuurbescherming][ref1] beschermde diersoorten.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.69
    references:
      - id: ref1
        bwb_id: BWBR0037552
        hoofdstuk: '3'
  - number: 3.69.3
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een inwendige scheidingsconstructie die de scheiding vormt met
      een gebruiksfunctie waarop het eerste lid niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.69
  - number: 3.70.1
    text: |-
      Een gebruiksfunctie heeft ter plaatse van een uitwendige scheidingsconstructie, een scherm tot een vanaf het
      aansluitende terrein gemeten diepte van ten minste 0,6 m. Het scherm heeft geen openingen die breder zijn dan 0,01
      m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.70
  - number: 3.70.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een inwendige scheidingsconstructie die de scheiding vormt met
      een gebruiksfunctie waarop het eerste lid niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.70
  - number: 3.70.3
    text: |-
      Het eerste en het tweede lid zijn niet van toepassing op een scheidingsconstructie van een technische ruimte,
      indien zich, ter plaatse van de inwendige scheidingsconstructies die de scheiding vormen tussen die ruimte en een
      andere ruimte van de gebruiksfunctie, een scherm als bedoeld in het eerste lid, bevindt.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.70
  - number: '3.71'
    text: |-
      Op het gedeeltelijk vernieuwen of veranderen of het vergroten van een bouwwerk is [artikel 3.70][ref1] van
      overeenkomstige toepassing waarbij in plaats van het in dat artikel aangegeven niveau van eisen wordt uitgegaan van
      het rechtens verkregen niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel3
