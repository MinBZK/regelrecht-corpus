    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.50
  - number: 3.50.4
    text: |-
      In afwijking van het derde lid heeft een voorziening voor de afvoer van rookgas voor een opstelplaats voor een
      open verbrandingstoestel met ventilator een volgens NEN 2757 bepaalde capaciteit die niet kleiner is dan de door de
      toestelventilator opgewekte volumestroom.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.50
  - number: 3.50.5
    text: |-
      Een combinatie luchttoevoer- verbrandingsgasafvoersysteem heeft een volgens NEN 2757 bepaald positief drukverschil
      tussen het afvoerkanaal voor rookgas en het toevoerkanaal voor verbrandingslucht.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.50
  - number: 3.50.6
    text: |-
      Een combinatie van een voorziening voor de afvoer van rookgas met een voorziening voor de afvoer van binnenlucht
      heeft een volgens NEN 2757 bepaalde capaciteit die gelijk is aan de hoogste waarde die geldt voor de afzonderlijke
      voorzieningen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.50
  - number: 3.51.1
    text: |-
      Bij toevoer van verbrandingslucht via een verblijfsgebied, heeft de volgens NEN 1087 bepaalde verdunningsfactor van
      de uitstoot van een afvoervoorziening voor luchtverversing en van een afvoervoorziening voor rookgas, ter plaatse
      van een in de uitwendige scheidingsconstructie gelegen instroomopening voor verbrandingslucht, ten hoogste de
      in [tabel 3.33][ref1] aangegeven waarde. Bij de bepaling van de verdunningsfactor blijven afvoervoorzieningen en
      belemmeringen die op een ander perceel liggen, buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel3
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.51
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.1
        afdeling: '3.6'
  - number: 3.51.2
    text: |-
      Een instroomopening van een toevoervoorziening voor verbrandingslucht en een uitmonding van een afvoervoorziening
      voor rookgas, liggen op een afstand van ten minste 2 m van de perceelsgrens, gemeten loodrecht op de uitwendige
      scheidingsconstructie van de gebruiksfunctie. Dit geldt niet voor een in een dak gelegen instroomopening of
      uitmonding. Indien het perceel waarop de gebruiksfunctie ligt, grenst aan een openbare weg, openbaar water of
      openbaar groen, wordt die afstand aangehouden tot het hart van de weg, dat water of dat groen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.51
  - number: 3.51.3
    text: |-
      Een uitmonding van een afvoervoorziening voor rookgas ligt, gemeten langszij aan een uitwendige
      scheidingsconstructie van een gebruiksfunctie, niet zijnde het dak, op een afstand van ten minste 1 m van de
      perceelsgrens.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.51
  - number: 3.51.4
    text: |-
      Een instroomopening van een toevoervoorziening voor verbrandingslucht en een uitmonding van een afvoervoerziening
      voor rookgas, gelegen boven een constructieonderdeel of het aansluitende terrein, liggen, ter voorkoming van gehele
      of gedeeltelijke afsluiting van de opening door ophoping van vuil of sneeuw, ten minste 0,3 m boven de bovenzijde
      van dat constructieonderdeel of dat terrein.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.51
  - number: '3.52'
    text: |-
      De toevoer van verbrandingslucht veroorzaakt in de leefzone van een verblijfsgebied een volgens NEN 1087 bepaalde
      luchtsnelheid die niet groter is dan 0,2 m/s.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.52
  - number: '3.53'
    text: |-
      Het inwendig oppervlak van een afvoervoorziening voor rookgas heeft, ter voorkoming van verspreiding van voor de
      gezondheid schadelijke bestanddelen uit de rook, een volgens NEN 2757 bepaalde doorlatendheid die niet groter is
      dan in tabel 3.53 is aangegeven.
          Tabel 3.53






                  afvoervoorziening voor rook


                  toegestane doorlatendheid






                  Een overdrukvoorziening als bedoeld in NEN 2757


                  0,006 x 10-3 m3/s per m2 inwendig oppervlak, gemeten bij een drukverschil van 200 Pa




                  Een onderdrukvoorziening als bedoeld in NEN 2757


                  3 x 10-3 m3/s per m2 inwendig oppervlak, gemeten bij een drukverschil van 40 Pa
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.53
  - number: 3.54.1
    text: |-
      De volgens NEN 1087 bepaalde richting van de luchtstroming voor de toevoer van verbrandingslucht gaat vanuit
      de voorziening voor de toevoer van verbrandingslucht naar een opstelplaats van een verbrandingstoestel. Bij de
      bepaling van de stromingsrichting blijven bouwwerken en daarmee gelijk te stellen belemmeringen, die op een ander
      perceel liggen, buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.54
  - number: 3.54.2
    text: |-
      Rookgas stroomt, bepaald volgens NEN 2757, vanaf de opstelplaats van een verbrandingstoestel naar de uitmonding
      van de voorziening voor de afvoer van rook. Bij de bepaling van de stromingsrichting blijven bouwwerken en andere
      daarmee gelijk te stellen belemmeringen op een ander perceel buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.54
  - number: 3.55.1
    text: |-
      Op het gedeeltelijk vernieuwen of veranderen of het vergroten van een bouwwerk zijn de
      [artikelen 3.51 tot en met 3.53][ref1] van overeenkomstige toepassing, waarbij in plaats van het in die artikelen
      aangegeven niveau van eisen wordt uitgegaan van het rechtens verkregen niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel3
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.55
