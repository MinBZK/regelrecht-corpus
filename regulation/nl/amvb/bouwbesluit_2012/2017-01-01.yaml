  - number: 2.102.1
    text: |-
      Op elk punt van een voor personen bestemd gedeelte van een vloer begint een vluchtroute die leidt naar het
      aansluitende terrein en vandaar naar de openbare weg.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.102
  - number: 2.102.2
    text: |-
      Op elk punt van een voor personen bestemd gedeelte van een vloer van een celfunctie of van een nevenfunctie daarvan
      begint een vluchtroute die, al dan niet via een buitenruimte, leidt naar een ander brandcompartiment.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.102
  - number: 2.102.3
    text: |-
      Op elk punt van een rijbaan begint een vluchtroute die leidt naar het aansluitende terrein en vandaar naar de
      openbare weg.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.102
  - number: 2.102.4
    text: |-
      De gecorrigeerde loopafstand tussen een punt in een gebruiksgebied en ten minste een uitgang van het
      subbrandcompartiment waarin dat gebruiksgebied ligt, is niet groter dan de in [tabel 2.101][ref1] aangegeven
      waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.102
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.12.1
        afdeling: '2.12'
  - number: 2.102.5
    text: |-
      In afwijking van het vierde lid, wordt bij een niet nader in te delen gebruiksgebied en bij een verblijfsruimte
      in plaats van de gecorrigeerde loopafstand uitgegaan van de loopafstand die niet groter is dan de in tabel 2.101
      aangegeven waarde.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.102
  - number: 2.102.6
    text: |-
      In afwijking van het vierde en vijfde lid geldt bij een bezetting van minder dan 1 persoon per 12 m2
      gebruiksoppervlakte van het subbrandcompartiment een waarde van ten hoogste 45 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.102
  - number: 2.102.7
    text: |-
      In afwijking van het vierde en vijfde lid geldt bij een bezetting van minder dan 1 persoon per 30 m2
      gebruiksoppervlakte van het subbrandcompartiment een waarde van ten hoogste 60 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.102
  - number: 2.102.8
    text: |-
      De loopafstand tussen een punt op een rijbaanvloer en een uitgang van het subbrandcompartiment is ten hoogste 150
      m. De afstand tussen twee uitgangen is ten hoogste 250 m, gemeten langs de tunnelwand.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.102
  - number: 2.102.9
    text: |-
      Op elk punt van een voor personen bestemde vloer in een subbrandcompartiment begint ten minste een vluchtroute met
      een op die vluchtroute te overbruggen hoogteverschil naar een uitgang van het subbrandcompartiment van ten hoogste
      4 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.102
  - number: 2.102.10
    text: |-
      Een subbrandcompartiment of een daar in gelegen ruimte heeft, indien bestemd voor meer dan 150 personen, ten minste
      twee uitgangen waardoor een vluchtroute loopt. De onderlinge afstand tussen de uitgangen is ten minste 5 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.102
  - number: 2.102.11
    text: |-
      Een bouwwerk geen gebouw zijnde heeft afhankelijk van zijn bestemming en grootte, voldoende en zodanig ingerichte
      vluchtroutes dat in geval van brand op doeltreffende en veilige wijze kan worden gevlucht.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.102
  - number: 2.102.12
    text: |-
      Ten minste een uitgang van een beschermd subbrandcompartiment als bedoeld in
      [artikel 2.93, vierde tot en met zevende lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.102
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.11.1
        afdeling: '2.11'
  - number: 2.102.12.a
    text: is de uitgang van het subbrandcompartiment waarin het beschermde subbrandcompartiment ligt, of
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.102
  - number: 2.102.12.b
    text: |-
      is een uitgang waarbij een vluchtroute begint die niet door een verblijfsruimte, een toiletruimte, een badruimte of
      een technische ruimte naar een uitgang van het subbrandcompartiment voert.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.102
  - number: 2.103.1
    text: |-
      Een vluchtroute is vanaf de uitgang van het subbrandcompartiment waarin de vluchtroute begint een beschermde
      vluchtroute, tenzij die uitgang direct grenst aan het aansluitende terrein. Dit geldt niet voor zover de
      vluchtroute door een andere wegtunnelbuis voert dan de wegtunnelbuis waar de vluchtroute begint.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.103
  - number: 2.103.2
    text: |-
      Een vluchtroute waarop ten hoogste 37 personen zijn aangewezen, is vanaf de uitgang van het subbrandcompartiment
      waarin de vluchtroute begint een beschermde vluchtroute, tenzij die uitgang direct grenst aan het aansluitende
      terrein.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.103
  - number: 2.103.3
    text: |-
      Een besloten ruimte waardoor een beschermde vluchtroute voert heeft vanaf de uitgang van een subbrandcompartiment
      tot de volgende uitgang op de vluchtroute een loopafstand niet groter dan 30 m. Dit geldt niet voor zover de
      vluchtroute door een trappenhuis voert.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.103
  - number: 2.104.1
    text: |-
      Een vluchtroute is vanaf de uitgang van het subbrandcompartiment waarin de vluchtroute begint een extra beschermde
      vluchtroute, tenzij die uitgang direct grenst aan het aansluitende terrein.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.104
  - number: 2.104.2
    text: |-
      De in het eerste lid bedoelde vluchtroute voert niet langs een beweegbaar constructieonderdeel van een andere
      woonfunctie dan de woonfunctie waarin de vluchtroute begint. Dit geldt niet bij de toegang van een woonfunctie die
      recht tegenover de toegang ligt van de woonfunctie waarin de vluchtroute begint.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.104
  - number: 2.104.3
    text: De in het eerste lid bedoelde vluchtroute voert niet door een trappenhuis.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.104
  - number: 2.104.4
    text: |-
      Het tweede en derde lid gelden niet indien de route door een trappenhuis voert, de uitgangen van de op die route
      aangewezen woonfuncties direct aan het trappenhuis grenzen, op die route uitsluitend woonfuncties en nevenfuncties
      daarvan zijn aangewezen, en de uitgang van het trappenhuis direct grenst aan het aansluitende terrein en:
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.104
  - number: 2.104.4.a
    text: |-
      er niet meer dan 6 woonfuncties op die route zijn aangewezen en geen vloer van een verblijfsgebied van die
      woonfuncties hoger ligt dan 6 m boven het meetniveau, of
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.104
  - number: 2.104.4.b
    text: |-
      de totale gebruiksoppervlakte van de woonfuncties die op de route zijn aangewezen ten hoogste 800 m2 bedraagt,
      geen vloer van een verblijfsgebied van die woonfuncties hoger ligt dan 12,5 m boven het meetniveau en geen van die
      woonfuncties een gebruiksoppervlakte heeft van meer dan 150 m2.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.104
  - number: 2.104.5
    text: |-
      Een vluchtroute waarop meer dan 37 en ten hoogste 150 personen zijn aangewezen, is vanaf de uitgang van het
      subbrandcompartiment waarin de vluchtroute begint een extra beschermde vluchtroute, tenzij die uitgang direct
      grenst aan het aansluitende terrein.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.104
  - number: 2.104.6
    text: |-
      In een besloten ruimte waardoor een extra beschermde vluchtroute voert is de loopafstand vanaf de uitgang
      van het subbrandcompartiment waarin de vluchtroute begint tot het punt waar een tweede vluchtroute of een
      veiligheidsvluchtroute begint, of tot het aansluitende terrein niet groter dan de in [tabel 2.101][ref1] aangegeven
      waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.104
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.12.1
        afdeling: '2.12'
  - number: 2.104.7
    text: |-
      Een vluchtroute in een trappenhuis waarin een hoogteverschil van meer dan 8 m wordt overbrugd, is een extra
      beschermde vluchtroute.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.104
  - number: 2.105.1
    text: |-
      Een vluchtroute waarop meer dan 150 personen zijn aangewezen is vanaf de uitgang van het subbrandcompartiment
      waarin de vluchtroute begint een veiligheidsvluchtroute, tenzij die uitgang direct grenst aan het aansluitende
      terrein.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.105
  - number: 2.105.2
    text: |-
      Een vluchtroute in een besloten trappenhuis waarin een hoogteverschil van meer dan 12,5 m wordt overbrugd, is een
      veiligheidsvluchtroute.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.105
  - number: 2.106.1
    text: |-
      Indien op een vluchtroute een tweede vluchtroute begint zijn de [artikelen 2.103][ref1],
      [2.104, eerste tot en met zesde lid][ref2], en [2.105][ref3] niet van toepassing vanaf het punt dat de twee
      vluchtroutes door verschillende ruimten voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.106
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.12.1
        afdeling: '2.12'
      - id: ref2
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.12.1
        afdeling: '2.12'
      - id: ref3
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.12.1
        afdeling: '2.12'
  - number: 2.106.2
    text: |-
      Buiten het brandcompartiment waarin de in het eerste lid bedoelde tweede vluchtroute begint, voeren de twee
      vluchtroutes niet door eenzelfde brandcompartiment.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.106
  - number: 2.106.3
    text: |-
      In afwijking van het eerste en tweede lid kunnen de twee vluchtroutes vanaf de uitgang van het subbrandcompartiment
      waarin de eerste vluchtroute begint door dezelfde ruimte voeren indien:
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.106
  - number: 2.106.3.a
    text: die ruimte aan die uitgang van het subbrandcompartiment grenst;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.106
  - number: 2.106.3.b
    text: |-
      de vluchtroutes in die ruimte beschermde vluchtroutes en voor zover deze buiten een brandcompartiment liggen extra
      beschermde vluchtroutes zijn;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.106
  - number: 2.106.3.c
    text: de loopafstand in die ruimte gemeten over beide vluchtroutes ten hoogste 30 m is indien de ruimte besloten is, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.106
  - number: 2.106.3.d
    text: de vluchtroutes in verschillende richtingen voeren.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.106
  - number: 2.106.4
    text: |-
      In afwijking van het eerste lid kunnen de twee vluchtroutes door dezelfde ruimte voeren voor zover de vluchtroute
      een veiligheidsvluchtroute is.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.106
  - number: 2.106.5
    text: De in het vierde lid bedoelde veiligheidsvluchtroute voert uitsluitend door een trappenhuis.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.106
  - number: 2.107.1
    text: |-
      De volgens NEN 6068 bepaalde weerstand tegen branddoorslag en brandoverslag tussen een besloten ruimte waardoor
      een beschermde of extra beschermde vluchtroute voert en de in de vluchtrichting aansluitende besloten ruimte is
      ten minste 20 minuten, waarbij voor de bepaling van de brandwerendheid met betrekking tot de scheidende functie
      van een scheidingsconstructie uitsluitend rekening wordt gehouden met het beoordelingscriterium vlamdichtheid met
      betrekking tot de afdichting.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.107
  - number: 2.107.2
    text: |-
      De volgens NEN 6068 bepaalde weerstand tegen branddoorslag en brandoverslag tussen de twee ruimten als bedoeld in
      [artikel 2.106, eerste lid][ref1], is ten minste 30 minuten.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.107
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.12.1
        afdeling: '2.12'
  - number: 2.107.3
    text: 'Bij ministeriële regeling kunnen voorschriften worden gegeven over de rookdoorgang tussen:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.107
  - number: 2.107.3.a
    text: een beschermde of extra beschermde vluchtroute en de in de vluchtrichting aansluitende besloten ruimte, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.107
  - number: 2.107.3.b
    text: |-
      tussen twee vluchtroutes als bedoeld in [aritkel 2.106, eerste lid][ref1], die door verschillende ruimten voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.107
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.12.1
        afdeling: '2.12'
  - number: 2.107.4
    text: |-
      Per bouwlaag is de permanente vuurlast van een trappenhuis waardoor een beschermde of een extra beschermde
      vluchtroute voert, met inbegrip van de vanuit dat trappenhuis direct bereikbare besloten ruimten, ten hoogste
      3.500 MJ. Bij de bepaling van de vuurlast blijft een besloten ruimte buiten beschouwing als de weerstand tegen
      branddoorslag en brandoverslag tussen die ruimte en het trappenhuis ten minste 30 minuten is, bepaald volgens NEN
      6068. Bij de in rekening te brengen vuurlast van de dakconstructie op de bovenste bouwlaag van het trappenhuis
      waardoor geen veiligheidsvluchtroute voert, wordt een reductie van 50% toegepast. Dit geldt niet voor een
      trappenhuis als bedoeld in [artikel 2.104, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.107
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.12.1
        afdeling: '2.12'
  - number: 2.107.5
    text: |-
      Per bouwlaag is de permanente vuurlast van een besloten ruimte waardoor een veiligheidsvluchtroute voert, met
      inbegrip van de vanuit die ruimte direct bereikbare besloten ruimten, ten hoogste 3.500 MJ. Bij de bepaling van
      de vuurlast blijft een besloten ruimte buiten beschouwing als de weerstand tegen branddoorslag en brandoverslag
      tussen die ruimte en de ruimte waardoor de veiligheidsvluchtroute voert ten minste 30 minuten is, bepaald volgens
      NEN 6068.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.107
  - number: 2.107.6
    text: |-
      Een besloten trappenhuis, waarin een hoogteverschil van meer dan 20 m wordt overbrugd, wordt in de vluchtrichting
      uitsluitend bereikt door een afzonderlijke beschermde vluchtroute met een loopafstand van ten minste 2 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.107
  - number: 2.107.7
    text: Een uitgang van een woonfunctie grenst niet aan een in het zesde lid bedoelde afzonderlijke vluchtroute.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.107
  - number: 2.107.8
    text: |-
      Een vluchtroute heeft een vrije doorgang met een breedte van ten minste 0,85 m en een hoogte van ten minste de in
      tabel 2.101 aangegeven waarde. Dit geldt niet voor zover de vluchtroute over een trap voert.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.107
  - number: 2.107.9
    text: |-
      In afwijking van het achtste lid heeft een beschermde vluchtroute, voor zover deze niet door een uitgang of over
      een trap voert, een vrije doorgang met een breedte van ten minste 1,2 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.107
  - number: 2.107.10
    text: |-
      Indien op een trap in totaal meer dan 600 m2 vloeroppervlakte aan verblijfsgebied is aangewezen, is de breedte van
      de trap ten minste 1,2 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.107
  - number: 2.107.11
    text: |-
      Een vluchtroute die voert vanuit een bedgebied voor bedgebonden patiënten naar een ander brandcompartiment als
      bedoeld in [artikel 2.83, tiende lid][ref1], heeft een vrije doorgang waardoor een blok met een lengte van 2,3 m,
      een hoogte van 1,2 m en een breedte van 1,1 m horizontaal kan worden voortbewogen. Deze route voert niet over een
      trap of via een liftkooi.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.107
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.10.1
        afdeling: '2.10'
  - number: 2.107.12
    text: |-
      Een niet besloten ruimte waardoor een vluchtroute voert heeft een zodanige capaciteit voor de afvoer van warmte en
      rook, en de toevoer van verse lucht dat die ruimte tijdens brand gedurende langere tijd kan worden gebruikt om te
      vluchten en voor het uitvoeren van reddings- en bluswerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.107
  - number: 2.108.1
    text: |-
      De doorstroomcapaciteit van een gedeelte van een vluchtroute, uitgedrukt in personen, is ten minste het aantal
      personen dat op dat gedeelte is aangewezen. Bij de bepaling van de doorstroomcapaciteit wordt uitgegaan van:
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.108
  - number: 2.108.1.a
    text: |-
      45 personen per meter breedte van een trap voor het overbruggen van een hoogteverschil van meer dan 1 meter en 90
      personen per meter vrije breedte bij een hoogteverschil van ten hoogste 1 meter, voor zover de aantrede van de trap
      ten minste 0,17 m bedraagt;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.108
  - number: 2.108.1.b
    text: 90 personen per meter vrije breedte van een ruimte;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.108
  - number: 2.108.1.c
    text: |-
      90 personen per meter vrije breedte van een doorgang, indien zich in de doorgang een dubbele deur of vergelijkbaar
      beweegbaar constructieonderdeel bevindt met een met een maximale openingshoek van minder dan 135 graden;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.108
  - number: 2.108.1.d
    text: |-
      110 personen per meter vrije breedte van een doorgang, indien zich in de doorgang een enkele deur of vergelijkbaar
      beweegbaar constructieonderdeel bevindt met een maximale openingshoek van minder dan 135 graden, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.108
  - number: 2.108.1.e
    text: 135 personen per meter vrije breedte van een andere doorgang.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.108
  - number: 2.108.2
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gegeven over een gedeelte van een vluchtroute, gelegen buiten
      het subbrandcompartiment waarin de vluchtroute begint, op grond waarvan kan worden afgeweken van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.108
  - number: 2.108.3
    text: |-
      De doorstroomcapaciteit van een gedeelte van een vluchtroute is zodanig, dat de op dat gedeelte aangewezen personen
      veilig kunnen vluchten.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.108
  - number: '2.109'
    text: |-
      Op het gedeeltelijk vernieuwen of veranderen of het vergroten van een bouwwerk zijn de
      [artikelen 2.102 tot en met 2.108][ref1] van overeenkomstige toepassing, waarbij in plaats van het in die artikelen
      aangegeven niveau van eisen wordt uitgegaan van het rechtens verkregen niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.109
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.12.1
        afdeling: '2.12'
  - number: '2.110'
    text: |-
      Op het bouwen van een tijdelijk bouwwerk zijn de [artikelen 2.102 tot en met 2.106][ref1] en [2.108][ref2] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.110
