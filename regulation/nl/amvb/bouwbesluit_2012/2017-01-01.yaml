  - number: 2.70.2
    text: |-
      Onverminderd het eerste lid is op ten hoogste 10% van de totale oppervlakte van de constructieonderdelen van elke
      afzonderlijke ruimte waardoor geen beschermde vluchtroute voert, [artikel 2.67][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.70
    references:
