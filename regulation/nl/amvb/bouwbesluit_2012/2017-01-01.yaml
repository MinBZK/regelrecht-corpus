  - number: 2.10.1
    text: |-
      Een vloer, trap of hellingbaan waarover of waaronder een vluchtroute voert, bezwijkt niet binnen 30 minuten
      bij brand in een subbrandcompartiment waarin die vluchtroute niet ligt. Dit geldt niet voor de vloer van een
      buitenruimte van een woonfunctie.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.10
  - number: 2.10.2
    text: |-
      Een bouwconstructie bezwijkt bij brand in een brandcompartiment waarin die bouwconstructie niet ligt, niet binnen
      de in tabel 2.10.1 aangegeven tijdsduur door het bezwijken van een bouwconstructie binnen of grenzend aan dat
      brandcompartiment. Voor zover dat brandcompartiment een woonfunctie is, geldt dit niet voor een bouwconstructie van
      een aan dat brandcompartiment grenzend subbrandcompartiment of grenzende buitenruimte.
            Tabel 2.10.1






                    woonfunctie


                    tijdsduur van de brandwerendheid met betrekking tot bezwijken in minuten






                    Indien geen vloer van een verblijfsgebied hoger ligt dan 7 m boven het meetniveau


                    60




                    Indien een vloer van een verblijfsgebied hoger ligt dan 7 m en geen vloer van een verblijfsgebied
      hoger ligt dan 13 m boven het meetniveau


                    90




                    Indien een vloer van een verblijfsgebied hoger ligt dan 13 m boven het meetniveau


                    120
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.10
  - number: 2.10.3
    text: |-
      In afwijking van het tweede lid wordt de in tabel 2.10.1 aangegeven tijdsduur met 30 minuten bekort, indien geen
      vloer van een verblijfsgebied van de gebruiksfunctie hoger ligt dan 7 m boven het meetniveau en de volgens NEN 6090
      bepaalde permanente vuurbelasting van het brandcompartiment niet groter is dan 500 MJ/m2.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.10
  - number: 2.10.4
    text: |-
      Een bouwconstructie van een gebruiksfunctie met een vloer van een gebruiksgebied hoger dan 5 m boven het meetniveau
      of lager dan 5 m onder het meetniveau bezwijkt bij brand in een brandcompartiment waarin de bouwconstructie
      niet ligt, niet binnen 90 minuten door het bezwijken van een bouwconstructie binnen of grenzend aan het
      brandcompartiment.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.10
  - number: 2.10.5
    text: |-
      Een bouwconstructie bezwijkt bij brand in een brandcompartiment waarin de bouwconstructie niet ligt, niet binnen
      de in tabel 2.10.2 aangegeven tijdsduur door het bezwijken van een bouwconstructie binnen of grenzend aan het
      brandcompartiment.
            Tabel 2.10.2






                    gebruiksfunctie niet zijnde een woonfunctie


                    tijdsduur van de brandwerendheid met betrekking tot bezwijken in minuten






                    Indien geen vloer van een verblijfsgebied hoger ligt dan 5 m boven het meetniveau


                    60




                    Indien een vloer van een verblijfsgebied hoger ligt dan 5 m en geen vloer van een gebruiksgebied
      hoger ligt dan 13 m boven het meetniveau


                    90




                    Indien een vloer van een verblijfsgebied hoger ligt dan 13 m boven het meetniveau


                    120
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.10
  - number: 2.10.6
    text: |-
      In afwijking van het vierde en vijfde lid, wordt de tijdsduur met 30 minuten bekort, indien de volgens NEN 6090
      bepaalde permanente vuurbelasting van het brandcompartiment niet groter is dan 500 MJ/m2.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.10
  - number: 2.10.7
    text: |-
      Het vijfde lid geldt niet voor een logiesfunctie niet gelegen in een logiesgebouw, met een gebruiksoppervlakte van
      niet meer dan 100 m2.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.10
  - number: 2.10.8
    text: |-
      Een bouwconstructie van een tunnel bezwijkt niet binnen 60 minuten en voor zover deze onder open water ligt niet
      binnen 120 minuten bij brand in de tunnel.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.10
  - number: 2.10.9
    text: |-
      Een bouwconstructie bezwijkt bij brand in een brandcompartiment waarin de bouwconstructie niet ligt, niet binnen
      een tijdsduur die afhankelijk van de bestemming en inrichting van het bouwwerk redelijkerwijs nodig is om het
      bouwwerk bij brand te kunnen verlaten en te doorzoeken, door het bezwijken van een bouwconstructie binnen of
      grenzend aan het brandcompartiment.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.10
  - number: 2.11.1
    text: |-
      Bij het bepalen van het bezwijken van een bouwconstructie, als bedoeld in [artikel 2.10][ref1], wordt uitgegaan van
      de buitengewone belastingscombinaties die volgens NEN-EN 1990 kunnen optreden bij brand.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
