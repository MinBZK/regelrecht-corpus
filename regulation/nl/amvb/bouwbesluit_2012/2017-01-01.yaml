    text: |-
      Op een op het tijdstip van inwerkingtreding van dit besluit bestaande bijeenkomstfunctie voor kinderopvang blijft
      [paragraaf 3.10.2 van het Bouwbesluit 2003][ref1] zoals dit luidde onmiddellijk voorafgaand aan het tijdstip van
      inwerkingtreding van dit besluit, tot 1 april 2017 van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012727#Paragraaf3.10.2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0012727
        paragraaf: 3.10.2
  - number: 9.2.10
    text: |-
      Indien en voor zover in een gemeente onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van dit
      besluit op grond van de bouwverordening, bedoeld in [artikel 8, eerste lid, van de wet][ref1], en de daarop
      berustende bepalingen voor een gebied een aansluitplicht op het distributienet voor warmte geldt, dan blijft deze
      aansluitplicht voor dat gebied van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel8
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel9.2
