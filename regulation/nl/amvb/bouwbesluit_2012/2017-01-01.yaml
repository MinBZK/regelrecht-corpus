        afdeling: '3.8'
  - number: 3.55.2
    text: |-
      In afwijking van het eerste lid wordt bij het installeren van een afvoervoorziening voor rookgas bij toepassing van
      de [artikelen 3.51][ref1] en [3.53][ref2] niet uitgegaan van het rechtens verkregen niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel3
