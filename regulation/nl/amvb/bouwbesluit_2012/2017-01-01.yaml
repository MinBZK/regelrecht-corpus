  - number: '2.12'
    text: |-
      Op het gedeeltelijk vernieuwen of veranderen of het vergroten van een bouwwerk zijn de [artikelen 2.10][ref1] en
      [2.11][ref2] van overeenkomstige toepassing, waarbij in plaats van het in artikel 2.10 aangegeven niveau van eisen
      wordt uitgegaan van het rechtens verkregen niveau en waarbij, in afwijking van artikel 2.11, eerste lid, wordt
      uitgegaan van de buitengewone belastingscombinaties die volgens NEN 8700 kunnen optreden bij brand.


