  - number: 2.112.1
    text: |-
      Op elk punt van een voor personen bestemd gedeelte van een vloer begint een vluchtroute die leidt naar het
      aansluitende terrein en vandaar naar de openbare weg.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.112
  - number: 2.112.2
    text: |-
      Op elk punt van een voor personen bestemd gedeelte van een vloer van een celfunctie of van een nevenfunctie daarvan
      begint een vluchtroute die, al dan niet via een buitenruimte, leidt naar een ander brandcompartiment.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.112
  - number: 2.112.3
    text: |-
      Op elk punt van een rijbaan begint een vluchtroute die leidt naar het aansluitende terrein en vandaar naar de
      openbare weg.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.112
  - number: 2.112.4
    text: |-
      De loopafstand tussen een punt in een gebruiksgebied en een uitgang van het subbrandcompartiment waarin dat
      gebruiksgebied ligt, is niet groter dan de in [tabel 2.111][ref1] aangegeven waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.112
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.12.2
        afdeling: '2.12'
  - number: 2.112.5
    text: |-
      De loopafstand tussen een punt op een rijbaanvloer en een uitgang van het subbrandcompartiment is ten hoogste 150
      m. De afstand tussen twee uitgangen is ten hoogste 250 m, gemeten langs de tunnelwand.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.112
  - number: 2.112.6
    text: |-
      Een subbrandcompartiment of een daar in gelegen ruimte heeft, indien bestemd voor meer dan 225 personen, ten minste
      twee uitgangen waardoor een vluchtroute loopt.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.112
  - number: 2.112.7
    text: |-
      Een bouwwerk geen gebouw zijnde heeft afhankelijk van zijn bestemming en grootte, voldoende en zodanig ingerichte
      vluchtroutes dat in geval van brand op doeltreffende en veilige wijze kan worden gevlucht.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.112
  - number: 2.113.1
    text: |-
      Een vluchtroute is vanaf de uitgang van het subbrandcompartiment waarin de vluchtroute begint een beschermde route,
      tenzij die uitgang direct grenst aan het aansluitende terrein.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.113
  - number: 2.113.2
    text: |-
      Een vluchtroute waarop ten hoogste 60 personen zijn aangewezen, is vanaf de uitgang van het subbrandcompartiment
      waarin de vluchtroute begint een beschermde route, tenzij die uitgang direct grenst aan het aansluitende terrein.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.113
  - number: 2.114.1
    text: |-
      Een vluchtroute die door een gemeenschappelijke verkeersruimte voert waarop een totale gebruiksoppervlakte van meer
      dan 500 m2 aan woonfuncties is aangewezen, is een extra beschermde vluchtroute.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.114
  - number: 2.114.2
    text: |-
      Een vluchtroute waarop meer dan 60 en ten hoogste 225 personen zijn aangewezen, is vanaf de uitgang van het
      subbrandcompartiment waarin de vluchtroute begint een extra beschermde vluchtroute, tenzij dat compartiment direct
      grenst aan het aansluitende terrein.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.114
  - number: 2.114.3
    text: |-
      Een vluchtroute die vanaf de uitgang van een subbrandcompartiment over een trap voert en een hoogteverschil van
      meer dan 12,5 m overbrugt, is een extra beschermde vluchtroute.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.114
  - number: 2.115.1
    text: |-
      Een vluchtroute die door een gemeenschappelijke verkeersruimte voert waarop een totale gebruiksoppervlakte van meer
      dan 1.500 m2 aan woonfuncties is aangewezen, is een veiligheidsroute.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.115
  - number: 2.115.2
    text: |-
      Een vluchtroute waarop meer dan 225 personen zijn aangewezen, is vanaf de uitgang van het subbrandcompartiment
      waarin de vluchtroute begint een veiligheidsroute, tenzij dat compartiment direct grenst aan het aansluitende
      terrein.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.115
  - number: 2.116.1
    text: |-
      Indien op een vluchtroute een tweede vluchtroute begint, zijn de [artikelen 2.113][ref1],
      [2.114 eerste en tweede lid][ref2], en [2.115][ref3] niet van toepassing vanaf het punt dat de twee vluchtroutes
      door verschillende ruimten voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.116
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.12.2
        afdeling: '2.12'
      - id: ref2
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.12.2
        afdeling: '2.12'
      - id: ref3
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.12.2
        afdeling: '2.12'
  - number: 2.116.2
    text: |-
      In afwijking van het eerste lid kunnen de twee vluchtroutes vanaf de uitgang van het subbrandcompartiment waarin de
      eerste vluchtroute begint door dezelfde ruimte voeren indien:
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.116
  - number: 2.116.2.a
    text: de ruimte grenst aan de uitgang van het subbrandcompartiment;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.116
  - number: 2.116.2.b
    text: de vluchtroutes in de ruimte naar verschillende uitgangen voeren, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.116
  - number: 2.116.2.c
    text: |-
      de ruimte een besloten ruimte is, is de loopafstand in die ruimte gemeten over de vluchtroute ten hoogste 30 m en
      indien de route een beschermde route is ten hoogste 70 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.116
  - number: 2.116.3
    text: |-
      In afwijking van het eerste lid kunnen de twee vluchtroutes vanaf de uitgang van het subbrandcompartiment waarin de
      eerste vluchtroute begint door dezelfde ruimte voeren voor zover de vluchtroute een veiligheidsroute is.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.116
  - number: 2.117.1
    text: |-
      De volgens NEN 6075 bepaalde weerstand tegen rookdoorgang tussen een besloten ruimte waardoor een beschermde route
      of extra beschermde vluchtroute voert en de in de vluchtrichting aansluitende besloten ruimte is ten minste 20
      minuten.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.117
  - number: 2.117.2
    text: |-
      De volgens NEN 6068 bepaalde weerstand tegen branddoorslag en brandoverslag tussen twee vluchtroutes als bedoeld in
      de [artikel 2.116, eerste lid][ref1], is ten minste 20 minuten.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.117
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.12.2
        afdeling: '2.12'
  - number: 2.117.3
    text: |-
      Het product van de volgens NEN 6090 bepaalde permanente vuurbelasting en de netto-vloeroppervlakte van een ruimte
      waardoor een veiligheidsvluchtroute voert is per bouwlaag ten hoogste 7.000 MJ.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.117
  - number: 2.117.4
    text: |-
      Een vluchtroute heeft een vrije doorgang met ten minste de in [tabel 2.111][ref1] aangegeven breedte en hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.117
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.12.2
        afdeling: '2.12'
  - number: 2.117.5
    text: |-
      Een vluchtroute die voert vanuit een bedgebied voor bedgebonden patiënten naar een ander brandcompartiment als
      bedoeld in [artikel 2.89, tiende lid][ref1], heeft een vrije doorgang waardoor een blok met een lengte van 2,3 m,
      een hoogte van 1,2 m en een breedte van 1,1 m horizontaal kan worden voortbewogen. Deze vluchtroute voert niet over
      een trap of via een liftkooi.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.117
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.10.2
        afdeling: '2.10'
  - number: 2.117.6
    text: |-
      Een niet besloten ruimte waardoor een vluchtroute voert heeft een zodanige capaciteit voor de afvoer van warmte en
      rook, en de toevoer van verse lucht dat die ruimte tijdens brand gedurende langere tijd kan worden gebruikt om te
      vluchten en voor het uitvoeren van reddings- en bluswerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.117
  - number: '2.118'
    text: Bij ministeriële regeling kunnen voorschriften worden gegeven over de capaciteit van een vluchtroute.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.118
  - number: 2.119.1
    text: |-
      Een te bouwen bouwwerk is zodanig dat hulpverlening binnen redelijke tijd personen kan redden en brand kan
      bestrijden.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.119
  - number: 2.119.2
    text: |-
      Voor zover voor een gebruiksfunctie in tabel 2.119 voorschriften zijn aangewezen, wordt voor die gebruiksfunctie
      aan de in het eerste lid gestelde eis voldaan door toepassing van die voorschriften.
