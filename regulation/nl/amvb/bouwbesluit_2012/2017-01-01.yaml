    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.80
  - number: 2.80.e
    text: brandklasse T1 bepaald volgens NEN 1775 worden uitgegaan van brandklasse C, bepaald volgens NEN-EN 13501-1;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.80
  - number: 2.80.f
    text: |-
      brandklasse T3 bepaald volgens NEN 1775 worden uitgegaan van brandklasse D, bepaald volgens volgens NEN-EN 13501-
      1, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.80
