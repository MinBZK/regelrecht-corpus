        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.9.1
        afdeling: '2.9'
  - number: 2.71.1
    text: |-
      De bovenzijde van een dak van een bouwwerk is, bepaald volgens NEN 6063, niet brandgevaarlijk. Dit geldt niet
      indien het bouwwerk geen voor personen bestemde vloer heeft die hoger ligt dan 5 m boven het meetniveau, en de
      brandgevaarlijke delen van het dak ten minste 15 m vanaf de perceelsgrens liggen. Indien het perceel waarop het
      bouwwerk ligt, grenst aan een openbare weg, openbaar water, openbaar groen, of een perceel dat niet is bestemd
      voor bebouwing of voor een speeltuin, een kampeerterrein of opslag van brandgevaarlijke stoffen of van brandbare
      niet milieugevaarlijke stoffen wordt die afstand aangehouden tot het hart van de weg, dat water, dat groen of dat
      perceel.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.71
  - number: 2.71.2
    text: Het eerste lid geldt niet voor een bouwwerk met een gebruiksoppervlakte van ten hoogste 50 m2.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.71
  - number: '2.72'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gesteld ter beperking van het ontwikkelen van brand en rook
      in een constructieonderdeel.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.72
  - number: 2.73.1
    text: |-
      Op het geheel of gedeeltelijk vernieuwen of veranderen of het vergroten van een bouwwerk zijn de
      [artikelen 2.67][ref1], [2.68, eerste, tweede, vierde en vijfde lid][ref2], [2.69][ref3] en [2.71][ref4] van
      overeenkomstige toepassing, waarbij in plaats van het in die artikelen aangegeven niveau van eisen wordt uitgegaan
      van het rechtens verkregen niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0030461#Artikel2
