    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 5 juli 2011, nr. 2011-
    20112000271178, CZW;

    Gelet op de artikelen 2, 3, 5, 6 en 120 van de Woningwet en op richtlijn nr. 89/106/EEG van de Raad van de Europese
    Gemeenschappen van 21 december 1988 betreffende de onderlinge aanpassing van de wettelijke en bestuursrechtelijke
    bepalingen der Lid-Staten inzake voor de bouw bestemde producten (PbEG L 40), zoals gewijzigd bij richtlijn nr.
    93/68/EEG van de Raad van 22 juli 1993 (PbEG L 220), richtlijn nr. 2004/54/EG van het Europees Parlement en de Raad
    van 29 april 2004 inzake de minimumveiligheidseisen voor tunnels in het trans-Europese wegennet (PbEG L 101/56),
    richtlijn nr. 2010/31/EU van het Europees Parlement en de Raad van 19 mei 2010 betreffende de energieprestatie
    van gebouwen (PbEU L153) en verordening nr. 305/2011/EU van het Europees parlement en de Raad van 9 maart 2011 tot
    vaststelling van geharmoniseerde voorwaarden voor het verhandelen van bouwproducten en tot intrekking van Richtlijn
    89/106/EEG van de Raad (PbEU L88);

    De Afdeling advisering van de Raad van State gehoord (advies van 19 juli 2011, W04.11.0267/I);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 22 augustus 2011, nr.
    2011-2000364848, CZW;

    Hebben goedgevonden en verstaan:
