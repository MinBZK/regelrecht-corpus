      de in het eerste lid gestelde eis voldaan door toepassing van die voorschriften.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.1
  - number: 3.1.3
    text: |-
      Het eerste lid is niet van toepassing op de gebruiksfuncties waarvoor in tabel 3.1 geen voorschrift is aangewezen.
