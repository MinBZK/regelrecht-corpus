        bwb_id: BWBR0030461
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.3'
  - number: 4.19.2
    text: |-
      Een badruimte als bedoeld in [artikel 4.18][ref1] die is samengevoegd met een toiletruimte als bedoeld in artikel
      4.9 heeft een vloeroppervlakte van ten minste 2,2 m2 en een breedte van ten minste 0,9 m.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel4
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.19
    references:
