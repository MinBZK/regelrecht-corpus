        hoofdstuk: '3'
        paragraaf: 3.6.1
        afdeling: '3.6'
  - number: 3.35.2
    text: |-
      In afwijking van het eerste lid mag bij het installeren van een afvoervoorziening voor rookgas bij toepassing van
      [artikel 3.33, tweede lid][ref1], niet worden uitgegaan van het rechtens verkregen niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel3
