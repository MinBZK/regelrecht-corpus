  - number: 2.129.1
    text: Een te bouwen woonfunctie, niet zijnde een woonwagen, biedt weerstand tegen inbraak.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.129
  - number: 2.129.2
    text: Aan de in het eerste lid gestelde eis wordt voldaan door toepassing van de voorschriften in deze afdeling.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.129
  - number: '2.130'
    text: |-
      Deuren, ramen, kozijnen en daarmee gelijk te stellen constructieonderdelen in een scheidingsconstructie van een
      niet-gemeenschappelijke ruimte die volgens NEN 5087 bereikbaar zijn voor inbraak, hebben een volgens NEN 5096
      bepaalde inbraakwerendheid die voldoet aan de in die norm aangegeven weerstandsklasse 2.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.130
  - number: '2.131'
    text: |-
      Op het gedeeltelijk vernieuwen of veranderen of het vergroten van een woonfunctieniet zijnde een woonwagen is
      [artikel 2.130][ref1] van overeenkomstige toepassing, waarbij in plaats van het in dat artikel aangegeven niveau
      van eisen wordt uitgegaan van het rechtens verkregen niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.131
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.15'
  - number: 2.132.1
    text: |-
      Een te bouwen bouwwerk in een veiligheidszone of plasbrandaandachtsgebied of boven de volle breedte van een
      basisnetroute indien de veiligheidszone slechts een deel van de breedte van die basisnetroute betreft is zodanig
      dat het risico dat voortvloeit uit het vervoer van gevaarlijke stoffen voor personen in het bouwwerk beperkt is.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.132
  - number: 2.132.2
    text: |-
      Aan de in het eerste lid gestelde eis wordt voldaan door toepassing van het voorschrift in deze afdeling en de
      krachtens die bepaling gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.132
  - number: '2.133'
    text: |-
      Bij ministeriële regeling kunnen aan een bouwwerk in een veiligheidszone of een plasbrandaandachtsgebied of
      boven de volle breedte van een basisnetroute indien de veiligheidszone slechts een deel van de breedte van die
      basisnetroute betreft zodanige voorschriften worden gegeven dat personen beschermd zijn tegen gevolgen van een
      calamiteit op de weg, de spoorweg of het binnenwater waarbij gevaarlijke stoffen zijn betrokken.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.133
  - number: 2.133a
    text: |-
      Op het gedeeltelijk vernieuwen of veranderen of het vergroten van een bouwwerk is [artikel 2.133][ref1] van
      overeenkomstige toepassing, waarbij in plaats van het in het krachtens dat artikel aangegeven niveau van eisen
      wordt uitgegaan van het rechtens verkregen niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.133a
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.16'
  - number: 2.134.1
    text: |-
      Een te bouwen wegtunnel met een tunnellengte van meer dan 250 m is zodanig dat de veiligheid voor het wegverkeer
      is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.134
  - number: 2.134.2
    text: Aan de in het eerste lid gestelde eis wordt voldaan door toepassing van de voorschriften in deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.134
  - number: 2.135.1
    text: Een buiten de bebouwde kom gelegen wegtunnel voor twee rijrichtingen heeft ten minste twee wegtunnelbuizen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.135
  - number: 2.135.2
    text: |-
      Een wegtunnelbuis met een tunnelbuislengte van meer dan 250 m heeft een rijbaanvloer met een helling van ten
      hoogste 1 : 20.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.135
  - number: 2.135.3
    text: |-
      Een wegtunnelbuis met een tunnelbuislengte van meer dan 250 m heeft, voor een doelmatige doorgang voor
      wegvoertuigen, een vloer met een breedte van ten minste 7 m en een hoogte boven die breedte van ten minste 4,2 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.135
  - number: 2.136.1
    text: |-
      Een bestaande wegtunnel met een tunnellengte van meer dan 250 m is zodanig dat de veiligheid voor het wegverkeer
      is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.136
  - number: 2.136.2
    text: Aan de in het eerste lid gestelde eis wordt voldaan door toepassing van het voorschrift in deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.136
  - number: 3.1.1
    text: Een te bouwen bouwwerk biedt in een verblijfsgebied bescherming tegen geluid van buiten.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.1
  - number: 3.1.2
