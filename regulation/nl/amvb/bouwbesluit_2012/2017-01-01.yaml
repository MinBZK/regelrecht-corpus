  - number: 2.24.3
    text: |-
      In afwijking van het eerste lid, heeft een vloerafscheiding een vanaf de vloer gemeten hoogte van ten minste 0,6 m,
      indien de som van die hoogte en de breedte van de bovenregel ten minste 1 m is.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.24
  - number: 2.24.4
    text: |-
      Een afscheiding als bedoeld in [artikel 2.23, tweede en derde lid][ref1], heeft een hoogte van ten minste 0,6 m,
      gemeten vanaf de voorkant van de tredevlakken of vanaf de vloer van de hellingbaan.


