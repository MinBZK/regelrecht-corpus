  - number: 5.9.1
    text: |-
      Van de samenstelling van constructieonderdelen van een woonfunctie is de uitstoot van broeikasgassen en de
      uitputting van grondstoffen gekwantificeerd volgens de Bepalingsmethode Milieuprestatie Gebouwen en GWW-werken.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel5.9
  - number: 5.9.2
    text: |-
      Van de samenstelling van constructieonderdelen van een gebouw met uitsluitend kantoorfuncties en nevenfuncties
      daarvan met een totale gebruiksoppervlakte van meer dan 100 m2 is de uitstoot van broeikasgassen en de uitputting
      van grondstoffen gekwantificeerd volgens de Bepalingsmethode Milieuprestatie Gebouwen en GWW-werken.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel5.9
  - number: 5.9.3
    text: Bij ministeriële regeling kunnen voorschriften worden gegeven over het in het eerste en tweede lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel5.9
  - number: '5.10'
    text: |-
      Op het geheel of gedeeltelijk vernieuwen of veranderen of het vergroten van een bouwwerk is [artikel 5.9][ref1]
      niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel5
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel5.10
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.2'
  - number: 6.1.1
    text: Een bouwwerk heeft een zodanige verlichtingsinstallatie dat het bouwwerk veilig kan worden gebruikt en verlaten.
