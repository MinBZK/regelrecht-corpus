  - number: 4.19.6
    text: Het eerste en tweede lid zijn niet van toepassing op een badruimte in een cel.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.19
  - number: '4.20'
    text: |-
      Op het gedeeltelijk vernieuwen of veranderen of het vergroten van een bouwwerk zijn de [artikelen 4.18][ref1] en
      [4.19][ref2] van overeenkomstige toepassing waarbij in plaats van het in die artikelen aangegeven niveau van eisen
      bij de breedte en de vloeroppervlakte wordt uitgegaan van het rechtens verkregen niveau en bij de hoogte van 2 m.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel4
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.20
