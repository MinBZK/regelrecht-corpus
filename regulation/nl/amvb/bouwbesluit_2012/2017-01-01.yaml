  - number: 2.23.1
    text: |-
      Een voor personen bestemde vloer heeft bij een rand een afscheiding als die rand meer dan 1,5 m hoger ligt dan een
      aansluitende vloer, het aansluitende terrein of het aansluitende water.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.23
  - number: 2.23.2
    text: |-
      Een trap heeft, voor zover een zijkant van een tredevlak meer dan 1,5 m hoger ligt dan een aansluitende vloer, het
      aansluitende terrein of het aansluitende water, aan die zijkant een niet beweegbare afscheiding.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.23
  - number: 2.23.3
    text: |-
      Een hellingbaan heeft, indien een zijkant van de vloer meer dan 1,5 m hoger ligt dan een aansluitende vloer, het
      aansluitende terrein of het aansluitende water, aan die zijkant een niet beweegbare afscheiding.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.23
  - number: 2.23.4
    text: 'Het eerste lid geldt niet ter plaatse van de aansluiting van de vloer aan:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.23
  - number: 2.23.4.a
    text: een trap, of
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.23
  - number: 2.23.4.b
    text: een hellingbaan.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.23
  - number: 2.23.5
    text: 'Onverminderd het vierde lid geldt het eerste lid niet voor:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.23
  - number: 2.23.5.a
    text: een rand van een podium;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.23
  - number: 2.23.5.b
    text: een rand van een vloer die aan een bassin grenst;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.23
  - number: 2.23.5.c
    text: een rand van een laadvloer;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.23
  - number: 2.23.5.d
    text: een rand van een perron, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.23
  - number: 2.23.5.e
    text: een met een rand als bedoeld onder a tot en met d, gelijk te stellen rand van een vloer.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.23
  - number: 2.24.1
    text: |-
      Een vloerafscheiding als bedoeld in [artikel 2.23, eerste lid][ref1], heeft een hoogte van ten minste 0,9 m,
      gemeten vanaf de vloer.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.24
