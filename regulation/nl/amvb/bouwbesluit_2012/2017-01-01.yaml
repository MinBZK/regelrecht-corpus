  - number: 3.47.1
    text: |-
      Een verblijfsruimte heeft een spuivoorziening met een volgens NEN 8087 bepaalde capaciteit van de spuiventilatie
      van ten minste 3 dm3/s per m2 vloeroppervlakte van die ruimte.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.47
  - number: 3.47.2
    text: Het eerste lid is niet van toepassing op een gemeenschappelijke verblijfsruimte.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.47
  - number: 3.47.3
    text: |-
      De in het eerste lid bedoelde capaciteit kan worden gerealiseerd met de in [artikel 3.38][ref1] bedoelde
      voorziening voor luchtverversing.


