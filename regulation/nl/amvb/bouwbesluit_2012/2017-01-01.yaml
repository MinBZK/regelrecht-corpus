        hoofdstuk: '5'
        afdeling: '5.1'
  - number: 5.3.3
    text: |-
      Een constructie die de scheiding vormt tussen een verblijfsgebied, een toiletruimte of een badruimte en een
      kruipruimte, met inbegrip van de op die constructie aansluitende delen van andere constructies, voor zover die
      delen van invloed zijn op de warmteweerstand, heeft een volgens NEN 1068 bepaalde warmteweerstand van ten minste de
      in [tabel 5.1][ref1] gegeven waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel5
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel5.3
