    text: |-
      Op een inwendige scheidingsconstructie van een gebied als bedoeld in het eerste en tweede lid, die niet de
      scheiding vormt met een verblijfsgebied van een aangrenzende gebruiksfunctie waarop het eerste en tweede lid van
      toepassing zijn, zijn deze leden van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.4
  - number: 3.4.4
    text: |-
      Een scheidingsconstructie als bedoeld in het eerste tot en met derde lid van een verblijfsruimte heeft een
      volgens NEN 5077 bepaalde karakteristieke geluidwering die maximaal 2 dB of dB(A) lager is dan de karakteristieke
      geluidwering als bedoeld in het eerste tot en met derde lid van het verblijfsgebied waarin de verblijfsruimte ligt.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.4
  - number: '3.5'
    text: |-
      Op het gedeeltelijk vernieuwen of veranderen of het vergroten van een bouwwerk zijn de
      [artikelen 3.2 tot en met 3.4][ref1] van overeenkomstige toepassing, waarbij in plaats van het in die artikelen
      aangegeven niveau van eisen wordt uitgegaan van het rechtens verkregen niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel3
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.5
