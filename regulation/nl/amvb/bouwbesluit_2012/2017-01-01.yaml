        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.3.1
        afdeling: '2.3'
  - number: 2.19.1
    text: |-
      Een afscheiding als bedoeld in [artikel 2.17][ref1] heeft geen openingen waardoor een bol kan passeren met een
      doorsnede groter dan de in [tabel 2.16][ref2] aangegeven diameter.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.19
    references:
