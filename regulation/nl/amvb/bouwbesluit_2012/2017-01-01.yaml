  - number: 2.26.1
    text: Een te bouwen bouwwerk heeft voorzieningen voor het veilig overbruggen van hoogteverschillen door personen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.26
  - number: 2.26.2
    text: Aan de in het eerste lid gestelde eis wordt voldaan door toepassing van de voorschriften in deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.26
  - number: 2.27.1
    text: |-
      Een hoogteverschil van meer dan 0,21 m tussen vloeren waarover een vluchtroute voert en tussen vloeren van
      verblijfsgebieden, verblijfsruimten, toiletruimten, badruimten, of voor bezoekers bestemde vloeren, vloeren van een
      verkeersroute die deze ruimten met elkaar verbindt of tussen een van die vloeren en het aansluitende terrein wordt
      overbrugd door een vaste trap of een vaste hellingbaan.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.27
  - number: 2.27.2
    text: |-
      Voor zover de vluchtroute door een wegtunnelbuis voert, geldt in afwijking van het eerste lid een hoogteverschil
      van meer dan 0,3 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.27
  - number: '2.28'
    text: |-
      Op het geheel of gedeeltelijk vernieuwen of veranderen of het vergroten van een bouwwerk is [artikel 2.27][ref1]
      van overeenkomstige toepassing, waarbij in plaats van het in die artikelen aangegeven niveau van eisen wordt
      uitgegaan van het rechtens verkregen niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.28
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.4.1
        afdeling: '2.4'
  - number: '2.29'
    text: |-
      Op het bouwen van een tijdelijk bouwwerk is [artikel 2.27][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.29
    references:
