    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.80
  - number: 2.80.b
    text: |-
      brandklasse 2 bepaald volgens NEN 6065 in een besloten ruimte worden uitgegaan van brandklasse B en in een niet
      besloten ruimte van brandklasse C beide bepaald volgens NEN-EN 13501-1;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.80
  - number: 2.80.c
    text: brandklasse 3 bepaald volgens NEN 6065 worden uitgegaan van brandklasse C bepaald volgens NEN-EN 13501-1;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.80
  - number: 2.80.d
