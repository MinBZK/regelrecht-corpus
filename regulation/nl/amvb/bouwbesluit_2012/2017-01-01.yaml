    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.19
  - number: 6.20.1
    text: |-
      Een gebruiksfunctie heeft een brandmeldinstallatie als bedoeld in NEN 2535 met een omvang van de bewaking en een
      doormelding zoals aangegeven in [bijlage I][ref1] bij dit besluit, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0030461
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.20
    references:
      - id: ref1
        bwb_id: BWBR0030461
  - number: 6.20.1.a
    text: |-
      de gebruiksoppervlakte van de gebruiksfunctie of de totale gebruiksoppervlakte aan gebruiksfuncties van dezelfde
      soort in het gebouw voor zover die gebruiksfuncties op eenzelfde vluchtroute zijn aangewezen groter is dan de in
      deze bijlage aangegeven grenswaarde;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.20
  - number: 6.20.1.b
    text: |-
      de hoogste vloer van een verblijfsruimte van de gebruiksfunctie gemeten boven het meetniveau hoger is gelegen dan
      op de in deze bijlageaangegeven grenswaarde, of
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.20
  - number: 6.20.1.c
    text: deze bijlage dit aanwijst zonder dat sprake is van een grenswaarde als hierboven bedoeld.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.20
  - number: 6.20.2
    text: |-
      Een brandcompartiment waarin een gebruiksfunctie met een brandmeldinstallatie als bedoeld in het eerste lid ligt,
      heeft een brandmeldinstallatie met een zelfde omvang van de bewaking en doormelding als die gebruiksfunctie.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.20
  - number: 6.20.3
    text: |-
      Een doormelding als bedoeld in het eerste lid vindt rechtstreeks plaats naar de regionale alarmcentrale van de
      brandweer.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.20
  - number: 6.20.4
    text: |-
      Bij een woonfunctie voor zorg met zorg op afroep in een woongebouw of in een groepszorgwoning vindt rechtstreekse
      melding naar een zorgcentrale plaats. Bij 24-uurszorg in een woongebouw of in een groepszorgwoning vindt deze
      melding naar een zusterpost plaats.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.20
  - number: 6.20.5
    text: |-
      Voor zover vanuit de uitgang van een verblijfsruimte slechts in één richting kan worden gevlucht, zijn de buiten
      die verblijfsruimte gelegen ruimten waardoor die enkele vluchtroute voert alsmede aan die ruimten grenzende
      verblijfsruimten en ruimten met een verhoogd brandrisico voorzien van een brandmeldinstallatie met ruimtebewaking
      als bedoeld in NEN 2535, indien:
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.20
  - number: 6.20.5.a
    text: |-
      de loopafstand tussen de uitgang van een verblijfsruimte en het punt van waaruit in meer dan één richting kan
      worden gevlucht meer dan 10 m is;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.20
  - number: 6.20.5.b
    text: |-
      de totale vloeroppervlakte van de ruimten waardoor die enkele vluchtroute voert alsmede van de daarop aangewezen
      verblijfsruimten meer dan 200 m2 is, of
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.20
  - number: 6.20.5.c
    text: het aantal aan de enkele vluchtroute gelegen verblijfsruimten meer dan twee is.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.20
  - number: 6.20.6
    text: |-
      In de in [bijlage I][ref1] bij dit besluit aangewezen gevallen heeft een bij of krachtens de wet voorgeschreven
      brandmeldinstallatie een geldig inspectiecertificaat dat is afgegeven op grond van het CCV-inspectieschema
      Brandmeldinstallaties.


      [ref1]: https://wetten.overheid.nl/BWBR0030461
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.20
    references:
      - id: ref1
        bwb_id: BWBR0030461
  - number: 6.20.7
    text: |-
      Het onderhoud van een bij of krachtens de wet voorgeschreven brandmeldinstallatie waarvoor geen certificaat als
      bedoeld in het zesde lid is vereist, voldoet aan NEN 2654-1.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.20
  - number: 6.20.8
    text: |-
      Het beheer en de controle van een bij of krachtens de wet voorgeschreven brandmeldinstallatie voldoen aan NEN 2654-
      1.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.20
  - number: 6.20.9
    text: |-
      Het eerste lid, onderdeel b, is niet van toepassing indien boven de in [bijlage I][ref1] bedoelde hoogste vloer
      niet meer dan 6 opstelplaatsen voor bedden voor kinderen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0030461
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.20
    references:
      - id: ref1
        bwb_id: BWBR0030461
  - number: 6.21.1
    text: |-
      Bij een te bouwen woonfunctie en bij functiewijziging naar een woonfunctie heeft een besloten ruimte waardoor
      een vluchtroute voert tussen de uitgang van een verblijfsruimte en de uitgang van de woonfunctie een of meer
      rookmelders die voldoen aan en zijn geplaatst volgens de primaire inrichtingseisen als bedoeld in NEN 2555. Dit
      geldt niet voor een woonfunctie met een brandmeldinstallatie als bedoeld in [artikel 6.20][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.21
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.5'
  - number: 6.21.2
    text: |-
      Bij een woonfunctie voor kamergewijze verhuur heeft een besloten ruimte waardoor een vluchtroute voert tussen de
      uitgang van een verblijfsruimte en de uitgang van de woonfunctie een of meer rookmelders die voldoen aan en zijn
      geplaatst volgens de primaire inrichtingseisen als bedoeld in NEN 2555. Dit geldt niet voor een woonfunctie met een
      brandmeldinstallatie als bedoeld in [artikel 6.20][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.21
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.5'
  - number: 6.21.3
    text: |-
      Een verblijfsruimte heeft een of meer rookmelders die voldoen aan en zijn geplaatst volgens de primaire
      inrichtingseisen als bedoeld in NEN 2555. Dit geldt niet voor een verblijfsruimte in een wooneenheid indien elke
      wooneenheid in de woonfunctie in een afzonderlijk beschermd subbrandcompartiment ligt met een volgens NEN 6068
      bepaalde weerstand tegen branddoorslag en brandoverslag vanuit dat beschermd subbrandcompartiment naar een andere
      ruimte in het brandcompartiment van ten minste 30 minuten.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.21
  - number: 6.21.4
    text: |-
      Een verblijfsruimte en een besloten ruimte waardoor een vluchtroute voert tussen de uitgang van een verblijfsruimte
      en de uitgang van het gebouw hebben een of meer rookmelders die voldoen aan de primaire inrichtingseisen
      als bedoeld in NEN 2555. Dit geldt niet voor een gebruiksfunctie met een brandmeldinstallatie als bedoeld in
      [artikel 6.20][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
