  - number: 3.38.1
    text: |-
      Een verblijfsruimte heeft een voorziening voor luchtverversing met een volgens NEN 8087 bepaalde capaciteit van ten
      minste 0,7 dm3/s per m2 vloeroppervlakte met een minimum van 7 dm3/s.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.38
  - number: 3.38.2
    text: |-
      Een verblijfsruimte heeft een voorziening voor luchtverversing met een volgens NEN 8087 bepaalde capaciteit van ten
      minste de in tabel 3.37 aangegeven capaciteit per persoon.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.38
  - number: 3.38.3
    text: |-
      Onverminderd het eerste en tweede lid heeft een verblijfsruimte met een opstelplaats voor een kooktoestel als
      bedoeld in [artikel 4.42][ref1] of met een opstelplaats voor een open verbrandingstoestel voor warmwater een
      voorziening voor luchtverversing met een volgens NEN 8087 bepaalde capaciteit van ten minste 21 dm3/s. Een
      opstelplaats voor een kooktoestel of een warmwatertoestel met een nominale belasting van meer dan 15 kW, of voor
      een warmwatertoestel dat geen open verbrandingstoestel is, blijft hierbij buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel4
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.38
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.7.2
        afdeling: '4.7'
  - number: 3.38.4
    text: |-
      Een voorziening voor luchtverversing voor meer dan een verblijfsruimte heeft een capaciteit die ten minste voldoet
      aan de hoogste waarde die volgens het eerste tot en met derde lid is bepaald voor een op die voorziening aangewezen
      verblijfsruimte.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.38
  - number: 3.38.5
    text: |-
      Een voorziening voor luchtverversing voor een verblijfsgebied, dat bestaat uit meer dan één gemeenschappelijke
      verblijfsruimte heeft, in afwijking van het vierde lid, een capaciteit die ten minste voldoet aan de som
      van de waarden die volgens het eerste tot en met derde lid is bepaald voor de op die voorziening aangewezen
      verblijfsruimten.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.38
  - number: 3.38.6
    text: |-
      Een toiletruimte heeft een voorziening voor luchtverversing met een capaciteit van ten minste 7 dm3/s, bepaald
      volgens NEN 8087.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.38
  - number: 3.38.7
    text: |-
      Een badruimte heeft een voorziening voor luchtverversing met een capaciteit van ten minste 14 dm3/s, bepaald
      volgens NEN 8087.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.38
  - number: 3.39.1
    text: |-
      Een ruimte met een opstelplaats voor een gasmeter heeft een voorziening voor luchtverversing met een volgens NEN
      8087 bepaalde capaciteit van ten minste 1 dm3/s per m2 vloeroppervlakte van die ruimte, met een minimum van 2 dm3/
      s.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.39
  - number: 3.39.2
    text: |-
      Een schacht voor een lift heeft een voorziening voor luchtverversing met een volgens NEN 8087 bepaalde capaciteit
      van ten minste 3,2 dm3/s per m2 vloeroppervlakte van die liftschacht.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.39
  - number: 3.39.3
    text: |-
      Een opslagruimte voor huishoudelijk afval met vloeroppervlakte van meer dan 1,5 m2 heeft een niet afsluitbare
      voorziening voor luchtverversing met een volgens NEN 8087 bepaalde capaciteit van ten minste 10 dm3/s per m2
      vloeroppervlakte van die ruimte of een volgens NEN 8087 bepaalde capaciteit van ten minste100 dm3/s.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.39
  - number: 3.39.4
    text: |-
      Een stallingruimte voor motorvoertuigen heeft een voorziening voor luchtverversing met een volgens NEN 8087
      bepaalde capaciteit van ten minste 3 dm3/s per m2 vloeroppervlakte van die ruimte.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.39
  - number: 3.39.5
    text: |-
      Een tunnel heeft afhankelijk van zijn bestemming en tunnellengte een voorziening voor luchtverversing met voldoende
      capaciteit.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.39
  - number: 3.39.6
    text: |-
      Bij een wegtunnelbuis met een tunnelbuislengte van meer dan 500 m is de in het vijfde lid bedoelde voorziening voor
      luchtverversing mechanisch.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.39
  - number: 3.40.1
    text: |-
      De toevoer van verse lucht naar een liftschacht voor een brandweerlift vindt rechtstreeks van buiten plaats, of via
      de liftmachineruimte. Afvoer van binnenlucht uit een dergelijke ruimte vindt rechtstreeks naar buiten plaats, of
      via de liftmachineruimte.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.40
  - number: 3.40.2
    text: |-
      De toevoer van verse lucht naar een opslagruimte voor huishoudelijk afval vindt rechtstreeks van buiten plaats.
      Afvoer van binnenlucht uit een dergelijke ruimte vindt rechtstreeks naar buiten plaats.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.40
  - number: 3.40.3
    text: |-
      Bij een wegtunnelbuis met een tunnelbuislengte van meer dan 250 m vindt de toevoer van verse lucht rechtstreeks van
      buiten plaats en de afvoer van binnenlucht rechtstreeks naar buiten.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.40
  - number: 3.40.4
    text: |-
      Ten minste 21 dm3/s van de capaciteit van de afvoer van binnenlucht uit een verblijfsruimte waarin zich een
      opstelplaats voor een kooktoestel, als bedoeld in [artikel 3.38, derde lid][ref1], bevindt, wordt rechtstreeks naar
      buiten afgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel3
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.40
