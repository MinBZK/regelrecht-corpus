  - number: 2.14.1
    text: |-
      Een vloer, trap of hellingbaan, waarover of waaronder een beschermde route voert, bezwijkt niet binnen 20 minuten
      bij brand in een subbrandcompartiment waarin die beschermde route niet ligt.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.14
  - number: 2.14.2
    text: |-
      Een bouwconstructie bezwijkt bij brand in een brandcompartiment waarin die bouwconstructie niet ligt, niet
      binnen de in tabel 2.14.1 aangegeven tijdsduur door het bezwijken van een bouwconstructie binnen of grenzend aan
      dat brandcompartiment. Dit geldt dit niet voor een bouwconstructie van een aan dat brandcompartiment grenzend
      subbrandcompartiment of grenzende buitenruimte.
            Tabel 2.14.1






                    woonfunctie


                    tijdsduur van de brandwerendheid met betrekking tot bezwijken in minuten






                    Indien een vloer van een verblijfsgebied hoger ligt dan 7 m en niet hoger dan 13 m boven het
      meetniveau


                    30




                    Indien een vloer van een verblijfsgebied hoger ligt dan 13 m boven het meetniveau


                    60
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.14
  - number: 2.14.3
    text: |-
      Een bouwconstructie van een gebruiksfunctie met een vloer van een gebruiksgebied hoger dan 5 m boven het meetniveau
      bezwijkt bij brand in een brandcompartiment waarin de bouwconstructie niet ligt, niet binnen 30 minuten door het
      bezwijken van een bouwconstructie binnen of grenzend aan het brandcompartiment.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.14
  - number: 2.14.4
    text: |-
      Een bouwconstructie bezwijkt bij brand in een brandcompartiment waarin de bouwconstructie niet ligt, niet binnen
      de in tabel 2.14.2 aangegeven tijdsduur door het bezwijken van een bouwconstructie binnen of grenzend aan het
      brandcompartiment.
