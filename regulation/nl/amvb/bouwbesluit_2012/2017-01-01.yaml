  - number: 7.11a.1
    text: |-
      In een gebruiksfunctie met een brandmeldinstallatie als bedoeld in [artikel 6.20][ref1], in een bouwwerk
      met een vergunning voor brandveilig gebruik en in een bouwwerk waarvoor een gebruiksmelding als bedoeld in
      [artikel 1.18][ref2] is gedaan zijn voldoende personen aangewezen om de ontruiming bij brand voldoende snel te
      laten verlopen.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.11a
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.5'
      - id: ref2
        bwb_id: BWBR0030461
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.5'
  - number: 7.11a.2
    text: |-
      Het eerste lid is niet van toepassing op een woonfunctie voor zorg met zorg op afspraak of met zorg op afroep, als
      bedoeld in [bijlage I][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030461
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.11a
    references:
      - id: ref1
        bwb_id: BWBR0030461
  - number: 7.12.1
    text: |-
      Een deur op een vluchtroute is bij aanwezigheid van personen in het bouwwerk uitsluitend gesloten indien die deur
      tijdens het vluchten, zonder gebruik te moeten maken van een sleutel onmiddellijk over de ten minste vereiste
      breedte kan worden geopend.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.12
  - number: 7.12.2
    text: |-
      In afwijking van het eerste lid kan een deur op een vluchtroute die begint in een ruimte voor het insluiten van
      personen als bedoeld in [artikel 6.25, zevende lid][ref1], tijdens het vluchten met een sleutel over de ten minste
      vereiste breedte worden geopend, mits de inrichting, het gebruik en de organisatie zodanig zijn dat het in het met
      [artikel 7.11][ref2] beoogde brandveiligheidsniveau is gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel7
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.12
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.6'
      - id: ref2
        bwb_id: BWBR0030461
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.2'
  - number: 7.12.3
    text: Het eerste lid geldt niet voor een niet-gemeenschappelijke vluchtroute.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.12
  - number: 7.12.4
    text: Het eerste lid geldt niet voor een vluchtroute in een logiesverblijf.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.12
  - number: 7.12.5
    text: |-
      In afwijking van het eerste lid kan een deur op een vluchtroute in een tunnel worden ontgrendeld met een
      automatische ontgrendeling.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.12
  - number: 7.13.1
    text: 'De inrichting van een ruimte is zodanig dat:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.13
  - number: 7.13.1.a
    text: voor elke persoon zonder zitplaats ten minste 0,25 m2 vloeroppervlakte beschikbaar is;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.13
  - number: 7.13.1.b
    text: |-
      voor elke persoon met zitplaats ten minste 0,3 m2 vloeroppervlakte beschikbaar is, indien geen inventaris kan
      verschuiven of omvallen als gevolg van gedrang;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.13
  - number: 7.13.1.c
    text: |-
      voor elke persoon met zitplaats ten minste 0,5 m2 vloeroppervlakte beschikbaar is, indien inventaris kan
      verschuiven of omvallen als gevolg van gedrang.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.13
  - number: 7.13.2
    text: |-
      In een ruimte met meer dan 100 zitplaatsen zijn de zitplaatsen gekoppeld of aan de vloer bevestigd, zodanig dat
      deze niet kunnen verschuiven of omvallen als gevolg van gedrang, voor zover die zitplaatsen in meer dan 4 rijen van
      meer dan 4 stoelen zijn opgesteld.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.13
  - number: 7.13.3
    text: |-
      Bij in rijen opgestelde zitplaatsen is tussen de rijen een vrije ruimte aanwezig met een breedte van ten minste 0,4
      m, gemeten tussen de loodlijnen op de elkaar dichtst naderende gedeelten van de rijen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.13
  - number: 7.13.4
    text: |-
      Indien in een rij als bedoeld in het derde lid tussen de zitplaatsen een tafel is geplaatst, bevindt deze zich niet
      in de vrije ruimte, bedoeld in dat lid.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.13
  - number: 7.13.5
    text: Een rij zitplaatsen die slechts aan een einde op een gangpad of uitgang uitkomt, heeft niet meer dan 8 zitplaatsen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.13
  - number: 7.13.6
    text: 'Een rij zitplaatsen die aan beide einden op een gangpad of uitgang uitkomt, heeft ten hoogste:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.13
  - number: 7.13.6.a
    text: |-
      16 zitplaatsen indien de vrije ruimte, bedoeld in het derde lid, niet groter is dan 0,45 m en de breedte van de
      vrije doorgang van het gangpad of van de uitgang ten minste 0,6 m is;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.13
  - number: 7.13.6.b
    text: |-
      32 zitplaatsen indien de vrije ruimte, bedoeld in het derde lid, groter is dan 0,45 m en de breedte van de vrije
      doorgang van het gangpad of van de uitgang ten minste 0,6 m is;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.13
  - number: 7.13.6.c
    text: |-
      50 zitplaatsen indien de vrije ruimte, bedoeld in het derde lid, groter is dan 0,45 m en de breedte van de vrije
      doorgang van het gangpad of van de uitgang ten minste 1,1 m is.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.13
  - number: 7.14.1
    text: |-
      Gangpaden tussen stands, kramen, schappen, podia en andere inrichtingselementen in een voor publiek toegankelijke
      ruimte zijn ten minste 1,1 m breed.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.14
  - number: 7.14.2
    text: |-
      Voor een uitgang in een ruimte als bedoeld in het eerste lid is een vrije vloeroppervlakte met een lengte en een
      breedte van ten minste de breedte van deze uitgang.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.14
  - number: 7.15.1
    text: |-
      Tegen of onder het plafond aangebracht glas is veiligheidsglas of glas voorzien van een ingegoten kruiswapening met
      een maximale maaswijdte van 0,016 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.15
  - number: 7.15.2
    text: |-
      Textiel, folie of papier in horizontale toepassing is onderspannen met metaaldraad op een onderlinge afstand van
      ten hoogste 0,35 m, of metaaldraad in twee richtingen met een maximale maaswijdte van 0,7 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.15
  - number: 7.15.3
    text: |-
      Aankleding in een besloten ruimte mag bij brand geen druppelvorming geven boven een gedeelte van een vloer bestemd
      voor gebruik door personen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.15
  - number: 7.15.4
    text: Het eerste tot en met derde lid gelden niet voor een niet-gemeenschappelijke ruimte.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.15
  - number: 7.15.5
    text: Het eerste tot en met derde lid gelden niet in een logiesverblijf.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.15
  - number: '7.16'
    text: |-
      Onverminderd het bij of krachtens dit besluit bepaalde is het verboden in, op, aan of nabij een bouwwerk voorwerpen
      of stoffen te plaatsen, te werpen of te hebben, handelingen te verrichten of na te laten, werktuigen, middelen of
      voorzieningen te gebruiken of niet te gebruiken of anderszins belemmeringen te veroorzaken waardoor:
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.16
  - number: 7.16.a
    text: melding van, alarmering bij of bestrijding van brand wordt belemmerd;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.16
  - number: 7.16.b
    text: het gebruik van vluchtmogelijkheden bij brand wordt belemmerd, of
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.16
  - number: 7.16.c
    text: het redden van personen of dieren bij brand wordt belemmerd.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.16
  - number: 7.17.1
    text: |-
      Het gebruik van een bouwwerk, open erf en terrein is zodanig dat hinder, gezondheidsrisico’s en andere
      veiligheidsrisico’s dan brandveiligheidsrisico’s voor personen in voldoende mate worden beperkt.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.17
  - number: 7.17.2
    text: |-
      Voor zover voor een gebruiksfunctie in tabel 7.17 voorschriften zijn aangewezen, wordt voor die gebruiksfunctie aan
      de in het eerste lid gestelde eis voldaan door toepassing van die voorschriften.
