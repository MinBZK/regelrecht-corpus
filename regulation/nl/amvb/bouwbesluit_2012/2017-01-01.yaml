        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.1'
  - number: 5.3.2
    text: |-
      Een horizontale of schuine uitwendige scheidingsconstructie van een verblijfsgebied, een toiletruimte of een
      badruimte, heeft een volgens NEN 1068 bepaalde warmteweerstand van ten minste de in [tabel 5.1][ref1] gegeven
      waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel5
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel5.3
    references:
