  - number: 6.14.a
    text: de aansluitafstand niet groter is dan 40 m, of
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.14
  - number: 6.14.b
    text: de aansluitafstand groter is dan 40 m en de aansluitkosten niet hoger zijn dan bij een aansluitafstand van 40 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.14
  - number: 6.15.1
    text: |-
      Een bouwwerk heeft een zodanige voorziening voor de afvoer van huishoudelijk afvalwater of hemelwater dat het water
      zonder nadelige gevolgen voor de gezondheid kan worden afgevoerd.
