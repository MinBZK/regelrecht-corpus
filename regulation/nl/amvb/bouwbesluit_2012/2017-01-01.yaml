    text: |-
      Een gebruiksfunctie met een brandmeldinstallatie als bedoeld in [artikel 6.20, eerste, tweede en vijfde lid][ref1],
      heeft een ontruimingsalarminstallatie als bedoeld in NEN 2575.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.23
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.5'
  - number: 6.23.2
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gegeven over het ontruimingssignaal van de in het eerste lid
      bedoelde ontruimingsalarminstallatie.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.23
  - number: 6.23.3
    text: Het beheer en de controle van een ontruimingsalarminstallatie als bedoeld in het eerste lid voldoen aan NEN 2654-2.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.23
  - number: 6.23.4
    text: |-
      Een ontruimingsalarminstallatie als bedoeld in het eerste lid, die behoort bij een brandmeldinstallatie waarop
      [artikel 6.20, zesde lid][ref1], van toepassing is, heeft een geldig inspectiecertificaat dat is afgegeven op grond
      van het CCV-inspectieschema Ontruimingsalarminstallaties.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.23
