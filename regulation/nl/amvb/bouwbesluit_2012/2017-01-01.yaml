  - number: '3.58'
    text: |-
      Een ruimte met een opstelplaats voor een verbrandingstoestel heeft voorzieningen voor de toevoer van
      verbrandingslucht en de afvoer van rookgas. Een opstelplaats voor een kooktoestel of een warmwatertoestel met open
      verbranding met een nominale belasting van niet meer dan 15 kW, gelegen in een verblijfsruimte, blijft hierbij
      buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.58
  - number: 3.59.1
    text: |-
      Een voorziening voor de toevoer van verbrandingslucht en een voorziening voor de afvoer van rookgas voor een
      opstelplaats voor een verbrandingstoestel met een nominale belasting van meer dan 130 kW hebben een zodanige
      capaciteit, dat de verbranding doeltreffend kan plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.59
  - number: 3.59.2
    text: |-
      Een voorziening voor de toevoer van verbrandingslucht voor een verbrandingstoestel met een nominale belasting van
      niet meer dan 130 kW heeft ten minste de volgens [tabel 3.50.1][ref1] benodigde capaciteit, bepaald volgens NEN
      8087.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel3
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.59
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.8.1
        afdeling: '3.8'
  - number: 3.59.3
    text: |-
      Een voorziening voor de afvoer van rookgas voor een opstelplaats voor een verbrandingstoestel met een nominale
      belasting van niet meer dan 130 kW heeft een volgens NEN 8757 bepaalde capaciteit die niet kleiner is dan de met
      formule 3.50 bepaalde normaalvolumestroom van het rookgas.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.59
  - number: 3.59.4
    text: |-
      In afwijking van het derde lid heeft een voorziening voor de afvoer van rookgas voor een opstelplaats voor een
      open verbrandingstoestel met ventilator en een nominale belasting van niet meer dan 130 kW, een volgens NEN 8757
      bepaalde capaciteit die niet kleiner is dan de door de toestelventilator opgewekte volumestroom.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.59
  - number: 3.59.5
    text: |-
      Een combinatie luchttoevoer- verbrandingsgasafvoersysteem heeft een volgens NEN 8757 bepaald positief drukverschil
      tussen het afvoerkanaal voor rookgas en het toevoerkanaal voor verbrandingslucht.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.59
  - number: 3.59.6
    text: |-
      Een combinatie van een voorziening voor de afvoer van rookgas met een voorziening voor de afvoer van binnenlucht
      heeft een volgens NEN 8757 bepaalde capaciteit die gelijk is aan de hoogste waarde die geldt voor de afzonderlijke
      voorzieningen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.59
  - number: '3.60'
    text: |-
      Het inwendig oppervlak van een overdrukvoorziening voor de afvoer van rookgas heeft, ter voorkoming van
      verspreiding van voor de gezondheid schadelijke bestanddelen uit de rook, een volgens NEN 8757 bepaalde
      doorlatendheid die bij een drukverschil van 200 Pa, niet groter is dan 0,006 x 10-3 m3/s per m2.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.60
  - number: 3.61.1
    text: |-
      De richting van de luchtstroming voor de toevoer van verbrandingslucht gaat vanuit de voorziening voor de toevoer
      van verbrandingslucht naar een opstelplaats van een verbrandingstoestel. Bij de bepaling van de stromingsrichting
      blijven bouwwerken en daarmee gelijk te stellen belemmeringen, die op een ander perceel liggen, buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.61
  - number: 3.61.2
    text: |-
      Rookgas stroomt, bepaald volgens NEN 8757, vanaf de opstelplaats van een verbrandingstoestel naar de uitmonding
      van de voorziening voor de afvoer van rook. Bij de bepaling van de stromingsrichting blijven bouwwerken en andere
      daarmee gelijk te stellen belemmeringen op een ander perceel buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.61
  - number: 3.62.1
    text: |-
      Een te bouwen bouwwerk is zodanig dat het ontstaan van een voor de gezondheid nadelige kwaliteit van de binnenlucht
      door de aanwezigheid van voor de gezondheid schadelijke stoffen en ioniserende straling beperkt is.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.62
  - number: 3.62.2
    text: |-
      Voor zover voor een gebruiksfunctie in tabel 3.62 voorschriften zijn aangewezen, wordt voor die gebruiksfunctie
      aan de in het eerste lid gestelde eis voldaan door toepassing van die voorschriften en de krachtens die bepalingen
      gegeven voorschriften.
