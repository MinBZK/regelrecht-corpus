  - number: 3.40.5
    text: De afvoer van binnenlucht uit een toiletruimte of een badruimte vindt rechtstreeks naar buiten plaats.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.40
  - number: 3.41.1
    text: |-
      Een te bouwen bouwwerk heeft een voorziening voor het zo nodig snel kunnen afvoeren van sterk verontreinigde
      binnenlucht.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.41
  - number: 3.41.2
    text: |-
      Voor zover voor een gebruiksfunctie in tabel 3.41 voorschriften zijn aangewezen, wordt voor die gebruiksfunctie aan
      de in het eerste lid gestelde eis voldaan door toepassing van die voorschriften.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.41
