  - number: 5.2.1
    text: |-
      Een gebruiksfunctie heeft een volgens NEN 7120 bepaalde energieprestatiecoëfficiënt van ten hoogste de in
      [tabel 5.1][ref1] aangegeven waarde. De in de tabel aangegeven waarde voor een gebruiksfunctie wordt tenminste om
      de vijf jaar getoetst, en zo mogelijk aangepast aan de technische ontwikkelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel5
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.1'
  - number: 5.2.2
    text: |-
      In afwijking van het eerste lid, heeft een gebouw of een gedeelte daarvan dat op niet meer dan een perceel ligt,
      met meerdere gebruiksfuncties waarvoor volgens het eerste lid een energieprestatiecoëfficiënt geldt, een totaal
      volgens NEN 7120 bepaald karakteristiek energiegebruik dat niet hoger is dan het totale volgens NEN 7120 bepaalde
      toelaatbare energiegebruik. Bij het bepalen van het toelaatbare energiegebruik wordt per gebruiksfunctie uitgegaan
      van de in [tabel 5.1][ref1] aangegeven waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel5
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.1'
  - number: 5.2.3
    text: |-
      Indien bij toepassing van NEN 7120 gebruik wordt gemaakt van NVN 7125 dan is de waarde van de zonder NVN 7125
      bepaalde energieprestatiecoëfficiënt ten hoogste 1,33 maal de in [tabel 5.1][ref1] aangegeven waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel5
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.1'
  - number: 5.2.4
    text: |-
      Indien bij een gebruiksfunctie gebruik kan worden gemaakt van een energie-infrastructuur op gebiedsniveau als
      bedoeld in NVN 7125, dan zal bij de bepaling van de energieprestatiecoëfficiënt de technische, functionele en
      economische haalbaarheid in overweging worden genomen. De resultaten van deze overwegingen worden gedocumenteerd en
      beschikbaar gehouden voor controle.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel5.2
  - number: 5.2.7
    text: Bij ministeriële regeling kunnen voorschriften worden gegeven over het in het vierde tot en met zesde lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel5.2
  - number: 5.3.1
    text: |-
      Een verticale uitwendige scheidingsconstructie van een verblijfsgebied, een toiletruimte of een badruimte, heeft
      een volgens NEN 1068 bepaalde warmteweerstand van ten minste de in [tabel 5.1][ref1] gegeven waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel5
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel5.3
    references:
