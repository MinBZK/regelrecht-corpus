        afdeling: '2.1'
  - number: 2.4.1.a
    text: NEN-EN 1999 of NEN-EN 1993, indien de constructie is vervaardigd van metaal als bedoeld in die normen;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.4
  - number: 2.4.1.b
    text: |-
      NEN-EN 1992 of NEN-EN 1996, indien de constructie is vervaardigd van steenachtig materiaal als bedoeld in die
      normen;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.4
  - number: 2.4.1.c
    text: NEN-EN 1994, indien de constructie is vervaardigd van staal-beton als bedoeld in die norm;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.4
  - number: 2.4.1.d
    text: NEN-EN 1995, indien de constructie is vervaardigd van hout als bedoeld in die norm;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.4
  - number: 2.4.1.e
    text: NEN 2608, indien de constructie is vervaardigd van glas als bedoeld in die norm, of
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.4
  - number: 2.4.1.f
    text: |-
      NEN 6707, indien de constructie van de bevestiging van de dakbedekking is vervaardigd van materiaal als bedoeld in
      die norm.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.4
  - number: 2.4.2
    text: |-
      Indien een ander materiaal of een andere bepalingsmethode is toegepast dan aangegeven in het eerste lid, wordt het
      niet bezwijken als bedoeld in de [artikelen 2.2][ref1] en [2.3][ref2] bepaald volgens NEN-EN 1990.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.4
