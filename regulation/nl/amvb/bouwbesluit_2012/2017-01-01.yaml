  - number: 4.21.1
    text: Een te bouwen bouwwerk heeft voldoende bereikbare en toegankelijke ruimten.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.21
  - number: 4.21.2
    text: |-
      Voor zover voor een gebruiksfunctie in tabel 4.21 voorschriften zijn aangewezen, wordt voor die gebruiksfunctie aan
      de in het eerste lid gestelde eis voldaan door toepassing van die voorschriften.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.21
  - number: 4.21.3
    text: |-
      Het eerste lid is niet van toepassing op de gebruiksfuncties waarvoor in tabel 4.21 geen voorschrift is aangewezen.
