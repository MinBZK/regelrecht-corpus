  - number: 9.2.8
    text: |-
      Op een verbindingsweg als bedoeld in [artikel 6.37][ref1], een opstelplaats voor brandweervoertuigen als bedoeld
      in [artikel 6.38][ref2] en een route als bedoeld in [artikel 6.49][ref3] naar of bij een bouwwerk voor de bouw
      waarvan voor het tijdstip van inwerkingtreding van dit besluit een omgevingsvergunning voor het bouwen is verleend,
      blijven de voorschriften van de bouwverordening, bedoeld in [artikel 8, eerste lid, van de wet][ref4], en de
      daarop berustende bepalingen van toepassing, zoals deze luidden onmiddellijk voorafgaand aan het tijdstip van
      inwerkingtreding van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0030461#Artikel6
