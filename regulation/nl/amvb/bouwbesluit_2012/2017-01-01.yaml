  - number: 6.36.1
    text: |-
      Een bouwwerk voor het verblijven van personen heeft een brandweeringang. Dit geldt niet indien de aard, de ligging
      of het gebruik van het bouwwerk dat naar het oordeel van het bevoegd gezag niet vereist.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.36
  - number: 6.36.2
    text: |-
      Indien een bouwwerk dat op grond van het eerste lid een brandweeringang moet hebben meerdere toegangen heeft,
      worden in overleg met de brandweer een of meer van die toegangen als brandweeringang aangewezen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.36
  - number: 6.36.3
    text: |-
      In een bouwwerk met een brandmeldinstallatie met doormelding als bedoeld in [artikel 6.20, eerste lid][ref1], wordt
      een brandweeringang bij een brandmelding automatisch ontsloten of ontsloten met een systeem dat in overleg met de
      brandweer is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.36
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.5'
  - number: 6.37.1
    text: |-
      Tussen de openbare weg en ten minste een toegang van een bouwwerk voor het verblijven van personen ligt een
      verbindingsweg die geschikt is voor voertuigen van de brandweer en andere hulpverleningsdiensten.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.37
  - number: 6.37.2
    text: |-
      Het eerste lid is niet van toepassing: - op een gebruiksfunctie met een gebruiksoppervlakte van niet meer dan 1.000
      m2 en een vuurbelasting van ten hoogste 500 MJ/m2, bepaald volgens NEN 6090;
        - op een bouwwerk met een gebruiksoppervlakte van niet meer dan 50 m2;
        - op een lichte industriefunctie uitsluitend voor het bedrijfsmatig telen, kweken of opslaan van gewassen of
      daarmee vergelijkbare producten, met een permanente vuurbelasting van ten hoogste 150 MJ/m2, bepaald volgens NEN
      6090;
        - indien de toegang tot het bouwwerk op ten hoogste 10 meter van een openbare weg ligt, of
        - indien de aard, de ligging of het gebruik van het bouwwerk naar het oordeel van het bevoegd gezag geen
      verbindingsweg als bedoeld in het eerste lid vereist.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.37
  - number: 6.37.3
    text: |-
      Tenzij het bestemmingsplan of een gemeentelijke verordening anderszins bepaalt heeft een verbindingsweg als bedoeld
      in het eerste lid:
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.37
  - number: 6.37.3.a
    text: een breedte van ten minste 4,5 meter;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.37
  - number: 6.37.3.b
    text: |-
      een verharding over een breedte van ten minste 3,25 meter, die geschikt is voor motorvoertuigen met een massa van
      ten minste 14.600 kilogram;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.37
  - number: 6.37.3.c
    text: een vrijgehouden hoogte boven de kruin van de weg van ten minste 4,2 meter, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.37
  - number: 6.37.3.d
    text: een doeltreffende afwatering.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.37
  - number: 6.37.4
    text: |-
      Een verbindingsweg als bedoeld in het eerste lid is over de in het derde lid voorgeschreven hoogte en breedte
      vrijgehouden voor voertuigen van de brandweer en andere hulpverleningsdiensten.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.37
  - number: 6.37.5
    text: |-
      Hekwerken die een verbindingsweg als bedoeld in het eerste lid afsluiten, kunnen door hulpdiensten snel en
      gemakkelijk worden geopend of worden ontsloten met een systeem dat in overleg met de brandweer is bepaald.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.37
  - number: 6.38.1
    text: |-
      Bij een bouwwerk voor het verblijven van personen zijn zodanige opstelplaatsen voor brandweervoertuigen dat een
      doeltreffende verbinding tussen die voertuigen en de bluswatervoorziening kan worden gelegd.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.38
  - number: 6.38.2
    text: |-
      Het eerste lid is niet van toepassing: - op een gebruiksfunctie met een gebruiksoppervlakte van niet meer dan 1.000
      m2 en een vuurbelasting van ten hoogste 500 MJ/m2, bepaald volgens NEN 6090;
        - op een bouwwerk met een gebruiksoppervlakte van niet meer dan 50 m2;
        - een lichte industriefunctie uitsluitend voor het bedrijfsmatig telen, kweken of opslaan van gewassen of daarmee
      vergelijkbare producten, met een permanente vuurbelasting van ten hoogste 150 MJ/m2, bepaald volgens NEN 6090, of
        - indien de aard, de ligging of het gebruik van het bouwwerk naar het oordeel van het bevoegd gezag geen
      opstelplaatsen als bedoeld in het eerste lid vereist.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.38
  - number: 6.38.3
    text: |-
      De afstand tussen een opstelplaats als bedoeld in het eerste lid en een brandweeringang als bedoeld in
      [artikel 6.36, eerste lid][ref1], is ten hoogste 40 m.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.38
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.8'
  - number: 6.38.4
    text: |-
      Een opstelplaats voor brandweervoertuigen als bedoeld in het eerste lid is over de voorgeschreven hoogte en breedte
      als bedoeld in [artikel 6.37, derde lid][ref1], vrijgehouden voor brandweervoertuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.38
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.8'
  - number: 6.38.5
    text: |-
      Hekwerken die een opstelplaats als bedoeld in het eerste lid afsluiten, kunnen door hulpdiensten snel en
      gemakkelijk worden geopend of worden ontsloten met een systeem dat in overleg met de brandweer is bepaald.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.38
  - number: '6.39'
    text: |-
      Een te bouwen gebouw waarvan een vloer van een verblijfsgebied hoger ligt dan 20 m boven het meetniveau heeft een
      brandweerlift.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.39
  - number: 6.40.1
    text: |-
      Een voor grote aantallen bezoekers bestemd bouwwerk waarbij het goed functioneren van hulpverleningsdiensten
      afhankelijk is van mobiele radiocommunicatie heeft indien dat voor die communicatie nodig is een door het bevoegd
      gezag goedgekeurde installatie voor mobiele radiocommunicatie tussen hulpverleningsdiensten binnen en buiten dat
      bouwwerk.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.40
  - number: 6.40.2
    text: |-
      Een wegtunnel met een tunnellengte van meer dan 250 m heeft een door het bevoegd gezag goedgekeurde installatie
      voor mobiele radiocommunicatie tussen hulpverleningsdiensten binnen en buiten die wegtunnel.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.40
  - number: 6.41.1
    text: |-
      Een wegtunnel met een tunnellengte van meer dan 250 m heeft zodanige voorzieningen dat de veiligheid voor het
      wegverkeer is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.41
  - number: 6.41.2
    text: Aan de in het eerste lid gestelde eis wordt voldaan door toepassing van de voorschriften in deze afdeling.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.41
  - number: '6.42'
    text: |-
      Een hulppost als bedoeld in [artikel 2.122][ref1] heeft een noodtelefoon en een wandcontactdoos met een elektrische
      spanning van 230 volt.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.42
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.13.1
        afdeling: '2.13'
  - number: '6.43'
    text: |-
      Een wegtunnel met een tunnellengte van meer dan 500 m is aangesloten op een bedieningscentrale met een voorziening
      voor permanente videobewaking en automatische detectie van ongevallen en van brand.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.43
  - number: 6.44.1
    text: |-
      Een te bouwen wegtunnelbuis met een lengte van meer dan 250 m heeft ter beperking van uitbreiding van brand
      door verspreiding van brandbare vloeistoffen en ter beperking van verspreiding van giftige vloeistoffen, in een
      rijbaanvloer ten minste iedere 20 m gemeten in de lengterichting van de tunnelbuis, een voorziening voor de afvoer
      van brandbare en giftige vloeistoffen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.44
  - number: 6.44.2
    text: |-
      Een bestaande wegtunnelbuis met een lengte van meer dan 250 m heeft ter beperking van uitbreiding van brand door
      verspreiding van brandbare vloeistoffen en ter beperking van verspreiding van giftige vloeistoffen een voorziening
      voor de afvoer van brandbare en giftige vloeistoffen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.44
  - number: 6.45.1
    text: |-
      Een op een wegtunnelbuis aansluitende rijbaan heeft een zelfde aantal rijstroken als de rijbaan in de
      wegtunnelbuis. Een eventuele wijziging van het aantal rijstroken buiten de tunnelbuis vindt op zodanige afstand van
      de tunnelbuis plaats dat geen onrustige verkeersbewegingen in de tunnelbuis door die wijziging kunnen optreden.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.45
  - number: 6.45.2
    text: In een wegtunnelbuis is geen tweerichtingsverkeer toegestaan.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.45
  - number: 6.45.3
    text: |-
      In afwijking van het tweede lid is tweerichtingsverkeer toegestaan indien is aangetoond dat eenrichtingsverkeer in
      verband met fysieke, geografische of verkeerstechnische omstandigheden niet mogelijk is en het tweerichtingsverkeer
      met voldoende veiligheidswaarborgen is omgeven.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.45
  - number: 6.45.4
    text: |-
      Bij toepassing van het in het derde lid bedoelde tweerichtingsverkeer, is de wegtunnelbuis in ieder geval voorzien
      van een systeem voor permanent toezicht en een systeem voor de afsluiting van rijstroken en is de toegestane
      maximumsnelheid ten hoogste 70 km per uur.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.45
  - number: 6.46.1
    text: 'Een wegtunnel met een tunnellengte van meer dan 500 m heeft een voorziening:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.46
  - number: 6.46.1.a
    text: waarmee door luidsprekers mededelingen kunnen worden gedaan aan personen op elke rijbaan en vluchtroute;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.46
  - number: 6.46.1.b
    text: voor heruitzending van radiosignalen in elke wegtunnelbuis, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.46
  - number: 6.46.1.c
    text: om radio-uitzendingen te kunnen onderbreken om mededelingen te doen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.46
  - number: 6.46.2
    text: |-
      Mededelingen als bedoeld in het eerste lid, onderdelen a en c, worden ten minste in het Nederlands en het Engels
      gedaan.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.46
  - number: '6.47'
    text: |-
      De voor een evacuatie noodzakelijke voorzieningen, systemen en installaties in een wegtunnel, die voor het
      functioneren zijn aangewezen op een voorziening voor elektriciteit, zijn aangesloten op een voorziening die binnen
      15 seconden na het uitvallen van de voorziening voor elektriciteit gedurende ten minste 60 minuten de werking van
      die voorzieningen, systemen en installaties zeker stelt.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.47
  - number: 6.48.1
    text: |-
      Een bouwwerk met een toegankelijkheidssector is vanaf de openbare weg toegankelijk voor personen met een
      functiebeperking.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.48
  - number: 6.48.2
    text: Aan de in het eerste lid gestelde eis wordt voldaan door toepassing van de voorschriften in deze afdeling.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.48
  - number: 6.49.1
    text: |-
      Ten minste een route tussen de openbare weg en ten minste een toegang van een toegankelijkheidssector van een
      gebouw loopt over een weg of pad met:
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.49
  - number: 6.49.1.a
    text: een breedte van ten minste 1,1 m, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.49
  - number: 6.49.1.b
    text: bij een te overbruggen hoogteverschil van meer dan 0,02 m, een hellingbaan als bedoeld in afdeling 2.6.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.49
  - number: 6.49.2
    text: |-
      Een doorgang waardoor een in het eerste lid bedoelde route voert heeft een vrije breedte van ten minste 0,85 m en
      een vrije hoogte van ten minste 2 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.49
  - number: 6.50.1
    text: Een woongebouw heeft zodanige voorzieningen dat veel voorkomende criminaliteit wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.50
  - number: 6.50.2
    text: Aan de in het eerste lid gestelde eis wordt voldaan door toepassing van de voorschriften in deze afdeling.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.50
  - number: 6.51.1
    text: |-
      Een toegang van een te bouwen woongebouw heeft een zelfsluitende deur die van buitenaf niet zonder sleutel kan
      worden geopend.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.51
  - number: 6.51.2
    text: 'Ten minste een toegang van een te bouwen woongebouw:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.51
  - number: 6.51.2.a
    text: |-
      heeft aan de buitenkant een voorziening waarmee een signaal kan worden gegeven dat in een niet-gemeenschappelijk
      verblijfsgebied van een op die toegang aangewezen woonfunctie waarneembaar is;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.51
  - number: 6.51.2.b
    text: |-
      heeft een spreekinstallatie die vanuit ten minste een niet-gemeenschappelijke ruimte van een op die toegang
      aangewezen woonfunctie kan worden bediend, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.51
  - number: 6.51.2.c
    text: |-
      kan vanuit ten minste een niet-gemeenschappelijke ruimte van een op die toegang aangewezen woonfunctie worden
      geopend.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.51
  - number: 6.51.3
    text: |-
      Een afsluitbare toegang van een bestaand woongebouw heeft een zelfsluitende deur die van buitenaf niet zonder
      sleutel kan worden geopend.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.51
  - number: 6.51.4
    text: |-
      Indien een woonfunctie in een bestaand woongebouw uitsluitend bereikbaar is via een afsluitbare gemeenschappelijke
      verkeersruimte, heeft ten minste een toegang van het woongebouw aan de buitenkant een voorziening waarmee een
      signaal kan worden gegeven dat in een niet-gemeenschappelijke ruimte van die woonfunctie waarneembaar is.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.51
  - number: 6.52.1
    text: Een te bouwen gebouw is zodanig dat onderhoud aan het gebouw veilig kan worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.52
  - number: 6.52.2
    text: |-
      Aan de in het eerste lid gestelde eis wordt voldaan door toepassing van de voorschriften in deze afdeling en de
      krachtens die bepalingen gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.52
  - number: 6.53.1
    text: |-
      Indien onderhoud niet veilig kan worden uitgevoerd zonder gebouwgebonden veiligheidsvoorzieningen, heeft een te
      bouwen gebouw daarvoor voldoende gebouwgebonden veiligheidsvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.53
  - number: 6.53.2
    text: Bij ministeriële regeling kunnen voorschriften worden gegeven over het in het eerste lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.53
  - number: 6.54.1
    text: |-
      Technische bouwsystemen in bestaande gebouwen voldoen na verbouw aan eisen ten behoeve van een optimaal
      energiegebruik.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.54
  - number: 6.54.2
    text: Aan de in het eerste lid gestelde eis wordt voldaan door toepassing van de voorschriften in deze afdeling.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.54
  - number: 6.55.1
    text: |-
      Bij het geheel of gedeeltelijk vernieuwen of veranderen of het vergroten van een technisch bouwsysteem, waarbij
      het systeemrendement wordt beïnvloed, is het rechtens verkregen niveau van toepassing met dien verstande dat het
      rendement van dat systeem niet lager is dan aangegeven in tabel 6.55 en wat betreft het in die tabel genoemde
      ventilatiesysteem niet hoger is dan aangegeven in die tabel.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.55
  - number: 6.55.2
    text: |-
      Indien een technisch bouwsysteem bestaat uit een combinatie van de in tabel 6.55 opgenomen bouwsystemen is in
      afwijking van het eerste lid, het systeemrendement van dat systeem niet lager dan het rendement naar rato berekend
      op basis van de in die tabel opgenomen rendementen van de systemen die deel uitmaken van de combinatie.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.55
  - number: 6.55.3
    text: |-
      Bij ministeriële regeling worden voorschriften gegeven over de bepaling van het in het eerste en tweede lid
      bedoelde systeemrendement.
            Tabel 6.55






                    technisch bouwsysteem


                    Systeemrendement






                    verwarmingssysteem voor woonfunctie, niet lokaal


                    0,71




                    verwarmingssysteem voor overige functies, niet lokaal


                    0,65




                    lokaal verwarmingssysteem


                    0,63




                    warmtapwatersysteem


                    0,29




                    koelsysteem


                    0,75




                    ventilatiesysteem met ventilatiecapaciteit > 5000 m3/h, uitgedrukt in W/(dm3/s)


                    2,50
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.55
  - number: 7.1.1
    text: |-
      Het gebruik van een bouwwerk is zodanig dat het ontstaan van een brandgevaarlijke situatie en de ontwikkeling van
      brand wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.1
  - number: 7.1.2
    text: |-
      Voor zover voor een gebruiksfunctie in tabel 7.1 voorschriften zijn aangewezen, wordt voor die gebruiksfunctie
      aan de in het eerste lid gestelde eis voldaan door toepassing van die voorschriften en de krachtens die bepalingen
      gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.1
  - number: 7.2.1
    text: 'Het is verboden te roken of open vuur te hebben:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.2
  - number: 7.2.1.a
    text: in een ruimte die is bestemd voor de opslag van een brandgevaarlijke stof;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.2
  - number: 7.2.1.b
    text: bij het verrichten van een handeling die het uitstromen van een brandgevaarlijke stof kan veroorzaken, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.2
  - number: 7.2.1.c
    text: bij het vullen van een brandstofreservoir met een brandgevaarlijke stof.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.2
  - number: 7.2.2
    text: |-
      Het verbod, bedoeld in het eerste lid, wordt goed zichtbaar aangegeven door het aanbrengen van een
      gestandaardiseerd symbool overeenkomstig NEN 3011.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.2
  - number: '7.3'
    text: |-
      Een zelfsluitend constructieonderdeel als bedoeld in [artikel 6.26, eerste lid][ref1], mag niet in geopende stand
      zijn vastgezet tenzij het constructieonderdeel bij brand en bij rook door brand automatisch wordt losgelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.6'
  - number: 7.4.1
    text: 'Aankleding in een besloten ruimte mag geen brandgevaar opleveren. Dit gevaar is niet aanwezig indien de aankleding:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.4
  - number: 7.4.1.a
    text: een ondergeschikte bijdrage aan het brandgevaar levert;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.4
  - number: 7.4.1.b
    text: onbrandbaar is, bepaald volgens NEN 6064;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.4
  - number: 7.4.1.c
    text: voldoet aan brandklasse A1 als bedoeld in NEN-EN 13501-1;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.4
  - number: 7.4.1.d
    text: |-
      voldoet aan de eisen voor constructieonderdelen als bedoeld in [afdeling 2.9][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0030461
        hoofdstuk: '2'
        afdeling: '2.9'
  - number: 7.4.1.e
    text: een navlamduur heeft van ten hoogste 15 seconden en een nagloeiduur van ten hoogste 60 seconden.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.4
  - number: 7.4.2
    text: |-
      Bij een besloten ruimte voor het verblijven of vluchten van meer dan 50 personen is het eerste lid, onderdeel e,
      niet van toepassing, indien de aankleding:
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.4
  - number: 7.4.2.a
    text: zich bevindt boven een gedeelte van de vloer waar zich personen kunnen bevinden;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.4
  - number: 7.4.2.b
    text: de verticale vrije ruimte tussen de vloer en de aankleding minder dan 2,5 m is, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.4
  - number: 7.4.2.c
    text: niet direct op de vloer, trap of hellingbaan is aangebracht.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.4
  - number: 7.4.3
    text: |-
      Aankleding in een besloten ruimte die niet direct op de vloer, trap of hellingbaan is aangebracht mag geen
      brandgevaar opleveren. Dit gevaar is niet aanwezig indien de aankleding:
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.4
  - number: 7.4.3.a
    text: een ondergeschikte bijdrage aan het brandgevaar levert;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.4
  - number: 7.4.3.b
    text: onbrandbaar is, bepaald volgens NEN 6064;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.4
  - number: 7.4.3.c
    text: voldoet aan brandklasse A1 als bedoeld in NEN-EN 13501-1 of
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.4
  - number: 7.4.3.d
    text: |-
      voldoet aan de eisen voor constructieonderdelen als bedoeld in [afdeling 2.9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0030461
        hoofdstuk: '2'
        afdeling: '2.9'
  - number: 7.4.4
    text: |-
      Materiaal ter plaatse van of nabij apparatuur en installaties die warmte ontwikkelen voldoet aan brandklasse A1,
      als bedoeld in NEN-EN 13501-1 of is onbrandbaar, bepaald volgens NEN 6064, indien:
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.4
  - number: 7.4.4.a
    text: |-
      op het materiaal een intensiteit van de warmtestraling kan optreden die, bepaald volgens NEN 6061, groter is dan 2
      kW/m2, of
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.4
  - number: 7.4.4.b
    text: in het materiaal een temperatuur kan optreden die, bepaald volgens NEN 6061, hoger is dan 90 °C.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.4
  - number: 7.4.5
    text: In een besloten ruimte zijn geen met brandbaar gas gevulde ballonnen aanwezig.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.4
  - number: 7.4.6
    text: Het eerste tot en met vijfde lid gelden niet voor een niet-gemeenschappelijke ruimte.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.4
  - number: 7.4.7
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven over de bijdrage aan brandgevaar van
      aankleding.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.4
  - number: 7.5.1
    text: |-
      In een voor publiek toegankelijke ruimte opgestelde stands, kramen, schappen, podia en daarmee vergelijkbare
      inrichtingselementen zijn brandveilig.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.5
  - number: 7.5.2
    text: |-
      Aan het in het eerste lid gestelde is in ieder geval voldaan indien een naar de lucht gekeerd onderdeel van het
      inrichtingselement:
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.5
  - number: 7.5.2.a
    text: onbrandbaar is, bepaald volgens NEN 6064;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.5
  - number: 7.5.2.b
    text: voldoet aan brandklasse A1, als bedoeld in NEN-EN 13501-1;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.5
  - number: 7.5.2.c
    text: een dikte heeft van ten minste 3,5 mm, en voldoet aan brandklasse D, als bedoeld in NEN-EN 13501-1;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.5
  - number: 7.5.2.d
    text: een dikte heeft van ten minste 3,5 mm, en voldoet aan klasse 4 als bedoeld in NEN 6065, of
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.5
  - number: 7.5.2.e
    text: |-
      een dikte heeft van minder dan 3,5 mm en over de volle oppervlakte is verlijmd met een onderdeel als bedoeld onder
      c of d.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.5
  - number: 7.5.3
    text: Het eerste en tweede lid gelden niet voor een niet-gemeenschappelijke ruimte.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.5
  - number: 7.6.1
    text: In, op of nabij een bouwwerk is geen brandgevaarlijke stof als bedoeld in tabel 7.6 aanwezig.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.6
  - number: 7.6.2
    text: 'Het eerste lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.6
  - number: 7.6.2.a
    text: |-
      de in tabel 7.6 aangegeven toegestane hoeveelheid per stof niet wordt overschreden, met dien verstande dat de
      totale toegestane hoeveelheid stoffen 100 kilogram of liter is;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.6
  - number: 7.6.2.b
    text: 'de stof deugdelijk is verpakt, waarbij:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.6
  - number: 7.6.2.b.1°
    text: de verpakking tegen normale behandeling bestand is;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.6
  - number: 7.6.2.b.2°
    text: de verpakking is voorzien van een adequate gevaarsaanduiding, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.6
  - number: 7.6.2.b.3°
    text: geen inhoud onvoorzien uit de verpakking kan ontsnappen, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.6
  - number: 7.6.2.c
    text: de stof wordt gebruikt met inachtneming van de op de verpakking aangegeven gevaarsaanduidingen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.6
  - number: 7.6.3
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.6
  - number: 7.6.3.a
    text: brandstof in het reservoir van een verbrandingsmotor;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.6
  - number: 7.6.3.b
    text: brandstof in een verlichtings-, een verwarmings- of een ander warmteontwikkelend toestel;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.6
  - number: 7.6.3.c
    text: voor consumptie bestemde alcoholhoudende dranken;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.6
  - number: 7.6.3.d
    text: gasflessen tot een totale waterinhoud van 115 liter;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.6
  - number: 7.6.3.e
    text: |-
      dieselolie, gasolie of lichte stookolie met een vlampunt tussen de 61 °C en 100 °C tot een totale hoeveelheid van
      1.000 liter, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.6
  - number: 7.6.3.f
    text: |-
      brandgevaarlijke stoffen voor zover de aanwezigheid daarvan bij of krachtens de Wet milieubeheer of de Wabo is
      toegestaan.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.6
  - number: 7.6.4
    text: |-
      Bij het berekenen van een toegestane hoeveelheid als bedoeld in het tweede lid, onderdeel a, wordt een aangebroken
      verpakking als een volle meegerekend.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.6
  - number: 7.6.5
    text: |-
      In afwijking van het derde lid, onderdeel e, is de aanwezigheid van meer dan 1.000 liter van een in dat onderdeel
      bedoelde oliesoort toegestaan indien de wijze van opslag en gebruik daarvan zodanig is dat het ontstaan van een
      brandgevaarlijke situatie en de ontwikkeling van brand naar het oordeel van het bevoegd gezag voldoende worden
      voorkomen.
