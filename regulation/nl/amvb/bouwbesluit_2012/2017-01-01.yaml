  - number: 4.9.1
    text: |-
      Een gebruiksfunctie heeft ten minste het in [tabel 4.8][ref1] aangegeven aantal toiletruimten.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel4
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.2.1
        afdeling: '4.2'
  - number: 4.9.2
    text: |-
      Op een toiletruimte zijn niet meer dan vijf woonfuncties aangewezen. Op een dergelijke toiletruimte zijn
      uitsluitend woonfuncties of een nevenfunctie daarvan aangewezen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.9
  - number: 4.9.3
    text: Op een toiletruimte zijn niet meer dan 30 personen aangewezen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.9
  - number: 4.9.4
    text: |-
      In afwijking van het eerste lid kan met een toiletruimte worden volstaan, indien op die toiletruimte niet meer dan
      15 personen zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.9
  - number: 4.9.5
    text: Op een toiletruimte zijn niet meer dan zes logiesverblijven aangewezen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.9
  - number: '4.10'
    text: |-
      Een toiletruimte is niet rechtstreeks toegankelijk vanuit een verblijfsruimte van een bijeenkomstfunctie voor
      alcoholgebruik.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.10
  - number: 4.11.1
    text: |-
      Een toiletruimte als bedoeld in [artikel 4.9][ref1], heeft een vloeroppervlakte van ten minste 0,9 m x 1,2 m.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel4
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.11
