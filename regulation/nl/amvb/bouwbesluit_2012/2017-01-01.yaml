        hoofdstuk: '2'
        paragraaf: 2.3.1
        afdeling: '2.3'
  - number: 2.19.5
    text: |-
      Het tweede lid is niet van toepassing op een vloer, een tredevlak of een vloer van een hellingbaan, of een gedeelte
      daarvan, niet bestemd voor kinderen jonger dan 12 jaar.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.19
  - number: 2.20.1
    text: |-
      Een afscheiding als bedoeld in [artikel 2.17][ref1] of een constructieonderdeel dat, installatie die of onderdeel
      van een installatie dat aan of naast een dergelijke afscheiding is geplaatst, heeft, ter voorkoming van het
      overklauteren, geen opstapmogelijkheden tussen 0,2 m en 0,7 m boven een vloer, een tredevlak of een vloer van een
      hellingbaan.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.20
