  - number: 2.22.1
    text: |-
      Een bestaand bouwwerk bevat voorzieningen waardoor het vallen van een vloer, een trap of een hellingbaan
      redelijkerwijs wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.22
