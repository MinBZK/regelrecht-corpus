        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.1'
  - number: 5.3.4
    text: |-
      Een uitwendige scheidingsconstructie die de scheiding vormt tussen een verblijfsgebied, een toiletruimte of
      een badruimte en de grond of het water, met inbegrip van de op die constructie aansluitende delen van andere
      constructies, voor zover die delen van invloed zijn op de warmteweerstand, heeft een volgens NEN 1068 bepaalde
      warmteweerstand van ten minste de in [tabel 5.1][ref1] gegeven waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel5
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.1'
  - number: 5.3.5
    text: |-
      Een inwendige scheidingsconstructie die de scheiding vormt tussen een verblijfsgebied, een toiletruimte of een
      badruimte, en een ruimte die niet wordt verwarmd of die wordt verwarmd voor uitsluitend een ander doel dan het
      verblijven van personen, heeft een volgens NEN 1068 bepaalde warmteweerstand van ten minste de in [tabel 5.1][ref1]
      gegeven waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel5
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.1'
  - number: 5.3.6
    text: |-
      Ramen, deuren en kozijnen in een in het eerste tot en met vijfde lid bedoelde scheidingsconstructie
      hebben een volgens NEN 1068 bepaalde warmtedoorgangscoëfficiënt van ten hoogste 2,2 W/m2.K. De gemiddelde
      warmtedoorgangscoëfficiënt van de ramen, deuren en kozijnen in de in het eerste tot en met vijfde lid bedoelde
      scheidingsconstructies van een bouwwerk is, bepaald volgens een bij ministeriële regeling gegeven bepalingsmethode,
      ten hoogste 1,65 W/m2.K.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel5.3
  - number: 5.3.7
    text: |-
      Met ramen, deuren en kozijnen gelijk te stellen constructieonderdelen in een in het eerste tot en met vijfde lid
      bedoelde scheidingsconstructie hebben een volgens NEN 1068 bepaalde warmtedoorgangscoëfficiënt van ten hoogste 1,65
      W/m2.K.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel5.3
  - number: 5.3.8
    text: |-
      Het eerste tot en met het vijfde lid zijn niet van toepassing op een oppervlakte aan scheidingsconstructies,
      waarvan de getalwaarde niet groter is dan 2% van de gebruiksoppervlakte van de gebruiksfunctie.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel5.3
  - number: 5.4.1
    text: |-
      De volgens NEN 2686 bepaalde luchtvolumestroom van het totaal aan verblijfsgebieden, toiletruimten en badruimten
      van een gebruiksfunctie is niet groter dan 0,2 m3/s.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel5.4
  - number: 5.4.2
    text: |-
      In afwijking van het eerste lid, heeft een gebouw of een gedeelte daarvan dat op niet meer dan een perceel ligt,
      met meerdere gebruiksfuncties waarvoor volgens het eerste lid een eis aan de luchtvolumestroom geldt, een volgens
      NEN 2686 bepaalde luchtvolumestroom van het totaal aan verblijfsgebieden, toiletruimten en badruimten van de
      gebruiksfuncties die niet groter is dan 0,2 m3/s.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel5.4
  - number: '5.5'
    text: |-
      Op een gebruiksfunctie die niet bestemd is om te worden verwarmd, of indien de verwarming uitsluitend is bestemd
      voor een ander doel dan het verblijven van personen, zijn de [artikelen 5.2 tot en met 5.4][ref1] niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel5
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.1'
  - number: 5.6.1
    text: |-
      Bij het gedeeltelijk vernieuwen of veranderen of het vergroten van een bouwwerk zijn
      de voorschriften van [artikel 5.2][ref1] niet van toepassing en de voorschriften van
      [de artikelen 5.3, eerste tot en met zevende lid][ref2], en [5.4][ref3] van overeenkomstige toepassing, waarbij
      wordt uitgegaan van het rechtens verkregen niveau voor zover dat niveau voor de warmteweerstand niet lager is dan
      1,3 m2•K/W.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0030461#Artikel5
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.1'
      - id: ref2
        bwb_id: BWBR0030461
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.1'
      - id: ref3
        bwb_id: BWBR0030461
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.1'
  - number: 5.6.2
    text: |-
      In afwijking van het eerste lid geldt bij het vernieuwen of vervangen van isolatielagen een warmteweerstand van ten
      minste 2,5m2.K/W voor een vloer, 1,3 m2.K/W voor een gevel en 2,0m2.K/W voor een dak, bepaald volgens NEN 1068 en
      bij het vernieuwen of vervangen van ramen, deuren en kozijnen een warmtedoorgangscoëfficiënt van ten hoogste 2,2W/
      m2.K, bepaald volgens NEN 1068. Indien het rechtens verkregen niveau een betere energieprestatie heeft, dan geldt
      het rechtens verkregen niveau.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel5.6
  - number: 5.6.3
    text: |-
      In afwijking van het eerste lid zijn op het geheel oprichten of geheel vernieuwen van een dakkapel
      of van een bijbehorend bouwwerk als bedoeld in [bijlage II bij het Besluit omgevingsrecht][ref1]
      de voorschriften van [artikel 5.2][ref2] niet van toepassing, en zijn de voorschriften van de
      [artikelen 5.3, eerste tot en met zevende lid][ref3], en [5.4][ref4] van overeenkomstige toepassing, waarbij in
      plaats van het in artikel 5.4 aangegeven niveau van eisen wordt uitgegaan van het rechtens verkregen niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0027464
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0030461#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0030461#Artikel5
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0027464
      - id: ref2
        bwb_id: BWBR0030461
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.1'
      - id: ref3
