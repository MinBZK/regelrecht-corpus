  - number: 2.125.1
    text: |-
      Een bestaande wegtunnel met een tunnellengte van meer dan 250 m is zodanig dat de hulpverlening binnen redelijke
      tijd personen kan redden en brand kan bestrijden.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.125
  - number: 2.125.2
    text: Aan de in het eerste lid gestelde eis wordt voldaan door toepassing van het voorschrift in deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.125
  - number: '2.126'
    text: |-
      Een wegtunnelbuis met een lengte van meer dan 250 m heeft een zodanig aantal hulpposten dat de loopafstand tussen
      een punt op de rijbaanvloer en ten minste een hulppost niet groter is dan 75 m. Deze afstand wordt gemeten over een
      route die uitsluitend voert over vloeren, trappen of hellingbanen zonder dat deuren worden gepasseerd die met een
      sleutel moeten worden geopend. De afstand tussen twee opeenvolgende hulpposten is ten hoogste 100 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.126
  - number: 2.127.1
    text: |-
      Een te bouwen bouwwerk waarin een vloer van een gebruiksgebied hoger dan 70 m boven of lager dan 8 m onder het
      meetniveau ligt, is zodanig ingericht dat het bouwwerk brandveilig is.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.127
  - number: 2.127.2
    text: Aan de in het eerste lid gestelde eis wordt voldaan door toepassing van de voorschriften in deze afdeling.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.127
  - number: 2.128.1
    text: |-
      Een bouwwerk waarin een vloer van een gebruiksgebied hoger dan 70 m boven het meetniveau ligt, is zo ingericht dat
      het bouwwerk een zelfde mate van brandveiligheid heeft als beoogd met de [paragrafen 2.2.1][ref1], [2.8.1][ref2],
      [2.9.1][ref3], [2.10.1][ref4][2.11.1][ref5], [2.12.1][ref6] en [2.13.1][ref7].


