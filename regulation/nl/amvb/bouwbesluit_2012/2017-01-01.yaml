        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.6'
  - number: 4.22.1.g
    text: een ruimte voor het bereiken van een lift.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.22
  - number: 4.22.2
    text: |-
      Een lifttoegang heeft een vrije breedte van ten minste 0,85 m en een tussen de onderdelen van de bouwconstructie
      gemeten hoogte van 2,3 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.22
  - number: 4.23.1
    text: |-
      Een verkeersroute die begint bij een doorgang als bedoeld in [artikel 4.22][ref1], loopt door een ruimte met een
      vrije breedte van ten minste 0,85 m en ten minste de in [tabel 4.21][ref2] aangegeven vrije hoogte. Dit geldt niet
      voor zover de verkeersroute over een trap voert.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel4
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.23
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.4'
      - id: ref2
        bwb_id: BWBR0030461
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.4'
  - number: 4.23.2
    text: |-
      Indien de in het eerste lid bedoelde ruimte een gemeenschappelijke verkeersruimte is, is de vrije breedte ten
      minste 1,2 m. Dit geldt niet voor zover de verkeersroute over een trap voert.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.23
  - number: 4.23.3
    text: |-
      Een toegang van een woongebouw als bedoeld in [artikel 4.27][ref1] ontsluit een gemeenschappelijke verkeersruimte
      die bij die toegang over een lengte van ten minste 1,5 m een vrije doorgang heeft met een breedte van ten minste
      1,5 m.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel4
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.23
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.4'
  - number: 4.23.4
    text: Aan een doorgang van een liftschacht grenst een ruimte met een vloeroppervlakte van ten minste 1,5 m x 1,5 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.23
  - number: 4.23.5
    text: |-
      In aanvulling op het tweede lid, heeft een gemeenschappelijke verkeersruimte, over een lengte van 1,5 m een
      vrije doorgang met een breedte van ten minste 1,5 m. Dit geldt niet indien een rolstoelgebruiker vanuit die
      verkeersruimte zonder te keren het aansluitende terrein kan bereiken.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.23
  - number: 4.23.6
    text: |-
      Indien de in het eerste lid bedoelde ruimte in een toegankelijkheidssector ligt, is de vrije breedte ten minste
      1,2 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.23
  - number: 4.24.1
    text: 'Een woongebouw heeft een gemeenschappelijke toegankelijkheidssector, indien:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.24
  - number: 4.24.1.a
    text: de vloer van een verblijfsgebied in het woongebouw hoger ligt dan 12,5 m boven het meetniveau, of
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.24
  - number: 4.24.1.b
    text: het woongebouw een gebruiksoppervlakte heeft van meer dan 3.500 m2 die hoger ligt dan 1,5 m boven het meetniveau.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.24
  - number: 4.24.2
    text: In een woonfunctie voor zorg ligt ten minste een verblijfsgebied in een toegankelijkheidssector.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.24
  - number: 4.24.3
    text: |-
      Indien de gebruiksoppervlakte van een gebruiksfunctie, tezamen met de gebruiksoppervlakte van andere in
      hetzelfde gebouw gelegen gebruiksfuncties waarvoor dit voorschrift geldt, groter is dan 400 m2, ligt het in
      [tabel 4.21][ref1] aangegeven deel van de vloeroppervlakte aan verblijfsgebied van de gebruiksfunctie in een
      toegankelijkheidssector.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel4
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.24
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.4'
  - number: 4.24.4
    text: |-
      Indien de gebruiksoppervlakte van een gebruiksfunctie, tezamen met de gebruiksoppervlakte van andere in hetzelfde
      gebouw gelegen gebruiksfuncties waarvoor dit voorschrift geldt, groter is dan 250 m2 ligt het in [tabel 4.21][ref1]
      aangegeven deel van de vloeroppervlakte aan verblijfsgebied van de gebruiksfunctie in een toegankelijkheidssector
      en ligt 5% van de logiesverblijven, op een geheel getal naar boven afgerond in een toegankelijkheidssector.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel4
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.24
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.4'
  - number: 4.24.5
    text: |-
      Voor zover de in het vierde lid bedoelde gebruiksfunctie een bijeenkomstfunctie is voor het aanschouwen van sport,
      film, muziek of theater of een bijeenkomstfunctie die een nevenfunctie is van een kantoor- of industriefunctie,
      ligt 40% van de vloeroppervlakte aan verblijfsgebied in een toegankelijkheidssector.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.24
  - number: 4.24.6
    text: |-
      Een bijeenkomstfunctie voor alcoholgebruik met een gebruiksoppervlakte van meer dan 150 m2 heeft een
      toegankelijkheidssector.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.24
  - number: 4.25.1
    text: |-
      Een gebruiksfunctie met een toegankelijkheidssector als bedoeld in [artikel 4.24][ref1] heeft ten minste een
      integraal toegankelijke toiletruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel4
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.25
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.4'
  - number: 4.25.2
    text: |-
      Een gebruiksfunctie met een toegankelijkheidssector als bedoeld in [artikel 4.24][ref1] heeft een aantal integraal
      toegankelijke toiletruimten van ten minste het aantal toiletruimten als bedoeld in [artikel 4.9][ref2], gedeeld
      door de in [tabel 4.21][ref3] aangegeven waarde, op een geheel getal naar boven afgerond.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0030461#Artikel4
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.25
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.4'
      - id: ref2
        bwb_id: BWBR0030461
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.2.1
        afdeling: '4.2'
      - id: ref3
        bwb_id: BWBR0030461
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.4'
  - number: 4.25.3
    text: |-
      Een gezondheidszorgfunctie met een bedgebied heeft ten minste een integraal toegankelijke badruimte per 500 m2
      vloeroppervlakte aan bedgebied, op een geheel getal naar boven afgerond.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.25
  - number: 4.25.4
    text: |-
      Een gebruiksfunctie met een toegankelijkheidssector als bedoeld in [artikel 4.24][ref1] heeft een aantal integraal
      toegankelijke badruimten van ten minste de getalswaarde van het aantal aanwezige badruimten gedeeld door 20, op een
      geheel getal naar boven afgerond.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel4
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.25
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.4'
  - number: 4.25.5
    text: Een integraal toegankelijke badruimte mag zijn samengevoegd met een integraal toegankelijke toiletruimte.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.25
  - number: 4.26.1
    text: |-
      Een ruimte die in een toegankelijkheidssector ligt, is rechtstreeks bereikbaar vanaf het aansluitende terrein of
      langs een verkeersroute die uitsluitend door een toegankelijkheidssector voert.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.26
  - number: 4.26.2
    text: |-
      Ten minste een toegang van een toegankelijkheidssector die rechtstreeks bereikbaar is vanaf het aansluitend terrein
      is de hoofdtoegang van het gebouw.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.26
  - number: 4.26.3
    text: |-
      Een verkeersroute als bedoeld in het eerste lid, voert niet door een niet-gemeenschappelijke ruimte van een andere
      gebruiksfunctie.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.26
  - number: 4.26.4
    text: |-
      De toegang van een woonfunctie gelegen in een woongebouw met een gemeenschappelijke toegankelijkheidssector als
      bedoeld in [artikel 4.24, eerste lid][ref1], grenst aan een gemeenschappelijke toegankelijkheidssector.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel4
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.26
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.4'
  - number: 4.27.1
    text: |-
      Op ten minste een route tussen een punt in een toegankelijkheidssector en het aansluitende terrein is een
      hoogteverschil groter dan 0,02 m, gemeten vanaf de afgewerkte vloer, overbrugd door een lift of een hellingbaan.
      Het hoogteverschil tussen de op die route gelegen toegang van de toegankelijkheidssector en het aansluitende
      terrein is niet groter dan 1 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.27
  - number: 4.27.2
    text: |-
      Op ten minste een route tussen de vloer ter plaatse van de toegang van een woongebouw zonder een
      toegankelijkheidssector en het aansluitende terrein is een hoogteverschil groter dan 0,02 m, gemeten vanaf de
      afgewerkte vloer, overbrugd door een hellingbaan. Het hoogteverschil tussen die toegang en het aansluitende terrein
      is niet groter dan 1 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.27
  - number: 4.27.3
    text: |-
      Bij ten minste een toegang van een woonfunctie is een hoogteverschil op de route tussen een niet-gemeenschappelijke
      vloer en de aangrenzende vloer van een gemeenschappelijke verkeersruimte of het aansluitende terrein groter dan
      0,02 m, gemeten vanaf de afgewerkte vloer, overbrugd door een hellingbaan. Het hoogteverschil tussen die toegang en
      het aansluitende terrein of de gemeenschappelijke verkeersruimte is niet groter dan 1 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.27
  - number: 4.27.4
    text: |-
      Op ten minste een route tussen ten minste een uitgang van een woonfunctie en een gemeenschappelijke buitenruimte
      als bedoeld in [artikel 4.35, tweede lid][ref1], is een hoogteverschil groter dan 0,02 m, gemeten vanaf de
      afgewerkte vloer, overbrugd door een lift of een hellingbaan.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel4
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.27
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.6'
  - number: 4.27.5
    text: |-
      Een woongebouw waarin de vloer ter plaatste van de toegang van een woonfunctie hoger ligt dan 3 m boven het
      meetniveau, heeft op elke bouwlaag een opstelplaats voor een lift, met een liftkooi van ten minste 1,05 m x 2,05 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.27
  - number: 4.28.1
    text: |-
      De kooi van een lift als bedoeld in [artikel 4.27, eerste lid][ref1], heeft een vloeroppervlakte van ten minste
      1,05 m x 1,35 m.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel4
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.28
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.4'
  - number: 4.28.2
    text: |-
      In afwijking van het eerste lid heeft de kooi van een lift in een woongebouw met meer dan 6 woonfuncties een
      vloeroppervlakte van ten minste 1,05 m x 2,05 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.28
  - number: 4.28.3
    text: |-
      De loopafstand tussen de toegang van een woonfunctie en de toegang van ten minste een lift als bedoeld in het
      eerste lid is ten hoogste 90 m. Indien het tweede lid van toepassing is, wordt de loopafstand bepaald tussen de
      toegang van de woonfunctie en de toegang van ten minste een in het tweede lid bedoelde lift.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.28
  - number: '4.29'
    text: |-
      Op het gedeeltelijk vernieuwen of veranderen of het vergroten van een bouwwerk zijn de
      [artikelen 4.22 tot en met 4.28][ref1] van overeenkomstige toepassing, waarbij in plaats van het in die artikelen
      aangegeven niveau van eisen wordt uitgegaan van het rechtens verkregen niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel4
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.29
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.4'
  - number: 4.30.1
    text: |-
      Een te bouwen woonfunctie, anders dan een woonfunctie waarin door het Centraal Orgaan opvang asielzoekers opvang
      aan asielzoekers wordt geboden, heeft een afsluitbare bergruimte om fietsen of scootmobielen beschermd tegen weer
      en wind te kunnen opbergen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.30
  - number: 4.30.2
    text: |-
      Voor zover voor een woonfunctie in deze afdeling voorschriften zijn aangewezen wordt voor die woonfunctie aan de in
      het eerste lid gestelde eis voldaan door toepassing van die voorschriften.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.30
  - number: 4.31.1
    text: |-
      Een woonfunctie heeft als nevenfunctie een niet-gemeenschappelijke afsluitbare bergruimte met een vloeroppervlakte
      van ten minste 5 m2 bij een breedte van ten minste 1,8 m en een hoogte daarboven van ten minste 2,3 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.31
  - number: 4.31.2
    text: |-
      In afwijking van het eerste lid kan bij een woonfunctie met een gebruiksoppervlakte van niet meer dan 50 m2de
      bergruimte gemeenschappelijk zijn indien de vloeroppervlakte van de bergruimte ten minste 1,5 m2 per woonfunctie
      bedraagt.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.31
  - number: 4.31.3
    text: |-
      Een bergruimte als bedoeld in dit artikel is vanaf de openbare weg rechtstreeks bereikbaar via het aansluitende
      terrein of een gemeenschappelijke verkeersruimte.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.31
  - number: 4.31.4
    text: |-
      Het eerste tot en met derde lid zijn niet van toepassing op een woonfunctie voor studenten en een woonfunctie voor
      zorg.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.31
  - number: '4.32'
    text: |-
      De uitwendige scheidingsconstructie van een bergruimte als bedoeld in [artikel 4.31][ref1] is, bepaald volgens NEN
      2778, regenwerend.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel4
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.32
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.5'
  - number: '4.33'
    text: |-
      Op het gedeeltelijk vernieuwen of veranderen of het vergroten van een woonfunctie zijn de [artikelen 4.31][ref1] en
      [4.32][ref2] van overeenkomstige toepassing waarbij in plaats van het in die artikelen aangegeven niveau van eisen
      wordt uitgegaan van het rechtens verkregen niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel4
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.33
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.5'
      - id: ref2
        bwb_id: BWBR0030461
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.5'
  - number: 4.34.1
    text: |-
      Een te bouwen woonfunctie, anders dan een woonfunctie voor studenten of een woonfunctie voor zorg, heeft een
      rechtstreeks bereikbare buitenruimte.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.34
  - number: 4.34.2
    text: Aan de in het eerste lid gestelde eis wordt voldaan door toepassing van de voorschriften in deze afdeling.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.34
  - number: 4.35.1
    text: |-
      Een woonfunctie heeft een niet-gemeenschappelijke buitenruimte met een vloeroppervlakte van ten minste 4 m2 en een
      breedte van ten minste 1,5 m, die rechtstreeks bereikbaar is vanuit een niet-gemeenschappelijk verblijfsgebied van
      die woonfunctie.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.35
  - number: 4.35.2
    text: |-
      In afwijking van het eerste lid kan bij een woonfunctie met een gebruiksoppervlakte van niet meer dan 50 m2
      de buitenruimte gemeenschappelijk zijn indien de vloeroppervlakte aan buitenruimte ten minste 1 m2 per op die
      buitenruimte aangewezen woonfunctie bedraagt, met een minimum van 4 m2 en een breedte van ten minste 1,3 m. De
      buitenruimte is rechtstreeks vanuit de woning bereikbaar of via gemeenschappelijke ruimten.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.35
  - number: 4.35.3
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op een woonfunctie waarin door het Centraal Orgaan opvang
      asielzoekers opvang aan asielzoekers wordt geboden.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.35
  - number: '4.36'
    text: |-
      Op het gedeeltelijk vernieuwen of veranderen of het vergroten van een woonfunctie is [artikel 4.35][ref1] van
      overeenkomstige toepassing, waarbij in plaats van het in dat artikel aangegeven niveau van eisen wordt uitgegaan
      van het rechtens verkregen niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel4
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.36
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.6'
  - number: 4.37.1
    text: |-
      Een te bouwen bouwwerk heeft opstelplaatsen voor een aanrecht, een kooktoestel, een verwarmingstoestel en een
      warmwatertoestel.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.37
  - number: 4.37.2
    text: |-
      Voor zover voor een gebruiksfunctie in tabel 4.37 voorschriften zijn aangewezen, wordt voor die gebruiksfunctie aan
      de in het eerste lid gestelde eis voldaan door toepassing van die voorschriften.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.37
  - number: 4.37.3
    text: |-
      Het eerste lid is niet van toepassing op de gebruiksfuncties waarvoor in tabel 4.37 geen voorschrift is aangewezen.
            Tabel 4.37














