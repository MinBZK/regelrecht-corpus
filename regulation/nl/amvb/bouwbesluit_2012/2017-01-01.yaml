        paragraaf: 2.9.1
        afdeling: '2.9'
  - number: 2.70.3
    text: |-
      Voor bouwwerken geen gebouw zijnde is op ten hoogste 5% van de totale oppervlakte van de constructieonderdelen,
      waarvoor volgens de [artikelen 2.67 tot en met 2.69][ref1] een eis geldt, die eis niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.70
    references:
