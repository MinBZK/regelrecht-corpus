  - number: 1.1.2
    text: |-
      Voor de toepassing van de bij of krachtens dit besluit gegeven voorschriften wordt voorts verstaan onder: -
      ***bijeenkomstfunctie:*** gebruiksfunctie voor het samenkomen van personen voor kunst, cultuur, godsdienst,
      communicatie, kinderopvang, het verstrekken van consumpties voor het gebruik ter plaatse of het aanschouwen van
      sport;
        - ***bouwwerk geen gebouw zijnde:*** bouwwerk of gedeelte daarvan, voor zover dat geen gebouw of onderdeel daarvan
      is;
        - ***celfunctie:*** gebruiksfunctie voor dwangverblijf van personen;
        - ***gezondheidszorgfunctie:*** gebruiksfunctie voor medisch onderzoek, verpleging, verzorging of behandeling;
        - ***industriefunctie:*** gebruiksfunctie voor het bedrijfsmatig bewerken of opslaan van materialen en goederen, of
      voor agrarische doeleinden;
        - ***kantoorfunctie:*** gebruiksfunctie voor administratie;
        - ***logiesfunctie:*** gebruiksfunctie voor het bieden van recreatief verblijf of tijdelijk onderdak aan personen;
        - ***onderwijsfunctie:*** gebruiksfunctie voor het geven van onderwijs;
        - ***overige gebruiksfunctie:*** niet in dit lid benoemde gebruiksfunctie voor activiteiten waarbij het verblijven
      van personen een ondergeschikte rol speelt;
        - ***sportfunctie:*** gebruiksfunctie voor het beoefenen van sport;
        - ***winkelfunctie:*** gebruiksfunctie voor het verhandelen van materialen, goederen of diensten;
        - ***woonfunctie:*** gebruiksfunctie voor het wonen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.1
  - number: 1.1.3
    text: |-
      Voor de toepassing van de bij of krachtens dit besluit gegeven voorschriften wordt voorts verstaan onder: -
      ***bijeenkomstfunctie voor kinderopvang:*** bijeenkomstfunctie voor het bedrijfsmatig opvangen, verzorgen, opvoeden
      en begeleiden van kinderen die het basisonderwijs nog niet hebben beëindigd, niet zijnde gastouderopvang als
      bedoeld in de [Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref1];
        - ***cel:*** voor een enkel persoon of een afzonderlijke groep personen bestemd gedeelte van een celfunctie;
        - ***lichte industriefunctie:*** industriefunctie waarin activiteiten plaatsvinden, waarbij het verblijven van
      personen een ondergeschikte rol speelt;
        - **lichte industriefunctie voor het bedrijfsmatig houden van dieren:** lichte industriefunctie waarin dieren als
      bedoeld in [bijlage II bij het Besluit houders van dieren][ref2], worden gehouden;
        - **logiesfunctie met 24-uurs bewaking:** logiesfunctie waarbij 24 uur per dag een functionaris aanwezig is
      in het logiesgebouw, op het eigen perceel of op een loopafstand van ten hoogste 100 m vanaf de toegang van het
      logiesgebouw, mits die functionaris in geval van een calamiteit wordt gealarmeerd door de bij de logiesfunctie
      behorende ontruimingsinstallatie;
        - ***logiesgebouw:*** gebouw of gedeelte van een gebouw, waarin meer dan een logiesverblijf ligt, dat is aangewezen
      op een gezamenlijke verkeersroute;
        - ***logiesverblijf:*** voor een enkel persoon of een afzonderlijke groep personen bestemd gedeelte van een
      logiesfunctie;
        - ***overige gebruiksfunctie voor het personenvervoer:*** overige gebruiksfunctie die bestemd is voor aankomst of
      vertrek van vervoermiddelen ten behoeve van weg-, spoorweg-, water- of luchtverkeer van personen;
        - ***wooneenheid:*** gedeelte van een woonfunctie voor kamergewijze verhuur dat bestemd is voor afzonderlijke
      bewoning;
        - ***woonfunctie voor kamergewijze verhuur:*** niet-gemeenschappelijk deel van een woonfunctie waarin zich vijf of
      meer wooneenheden bevinden;
        - **woonfunctie voor particulier eigendom:** woonfunctie die wordt gebouwd in particulier opdrachtgeverschap als
      bedoeld in [artikel 1.1.1 van het Besluit ruimtelijke ordening][ref3] of die wordt bewoond door de eigenaar;
        - **woonfunctie voor studenten:** woonfunctie voor bewoners die zijn ingeschreven aan een instelling als bedoeld in
      [artikel 1.1.1, onderdeel b, van de Wet educatie en beroepsonderwijs][ref4] of aan een universiteit of hogeschool als
      bedoeld in [artikel 1.2, onderdelen a en b, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref5];
        - ***woonfunctie voor zorg:*** woonfunctie waarbij aan de bewoners professionele zorg wordt verleend met een vanuit
      het zorgaanbod georganiseerde koppeling tussen wonen en zorg in een daarvoor bestemde en uitgeruste woonfunctie;
        - ***woongebouw:*** gebouw of gedeelte daarvan met uitsluitend woonfuncties of nevenfuncties daarvan, waarin meer
      dan een woonfunctie ligt die is aangewezen op een gemeenschappelijke verkeersroute;
        - ***woonwagen:*** woonfunctie op een perceel bestemd voor het plaatsen van een woonwagen.


      [ref1]: https://wetten.overheid.nl/BWBR0017017
      [ref2]: https://wetten.overheid.nl/BWBR0035217
      [ref3]: https://wetten.overheid.nl/BWBR0023798#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel1.1
