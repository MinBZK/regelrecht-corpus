    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.1
  - number: 6.2.1
    text: |-
      Een verblijfsruimte heeft een verlichtingsinstallatie die een op een vloer, een tredevlak of een hellingbaan
      gemeten verlichtingssterkte kan geven van ten minste 1 lux.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.2
  - number: 6.2.2
    text: |-
      Een onder het meetniveau gelegen functieruimte heeft een verlichtingsinstallatie die een op een vloer, een
      tredevlak of een hellingbaan gemeten verlichtingssterkte kan geven van ten minste 1 lux.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.2
  - number: 6.2.3
    text: |-
      Een overige gebruiksfunctie voor het personenvervoer met een gebruiksoppervlakte van meer dan 50 m2 heeft in een
      boven het meetniveau gelegen functieruimte een verlichtingsinstallatie die een op een vloer, een tredevlak of een
      hellingbaan gemeten verlichtingssterkte kan geven van ten minste 1 lux.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.2
  - number: 6.2.4
    text: |-
      Een besloten ruimte waardoor een beschermde vluchtroute of beschermde route voert heeft een verlichtingsinstallatie
      die een op een vloer, een tredevlak of een hellingbaan gemeten verlichtingssterkte kan geven van ten minste 1 lux.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.2
  - number: 6.2.5
    text: |-
      Een wegtunnelbuis heeft een verlichtingsinstallatie die een op een vloer, een tredevlak of een hellingbaan gemeten
      verlichtingssterkte kan geven van ten minste 1 lux.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.2
  - number: 6.2.6
    text: |-
      Een te bouwen wegtunnelbuis heeft een voorziening die een uit oogpunt van verkeersveiligheid voldoende geleidelijke
      overgang van daglicht naar kunstlicht waarborgt.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.2
  - number: 6.3.1
    text: |-
      Een verblijfsruimte voor meer dan 75 personen en een besloten ruimte waardoor een vluchtroute uit die
      verblijfsruimte voert, hebben noodverlichting.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.3
  - number: 6.3.2
    text: |-
      Een onder het meetniveau gelegen functieruimte als bedoeld in [artikel 6.2, tweede lid][ref1], heeft
      noodverlichting.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.1'
  - number: 6.3.3
    text: |-
      Een besloten ruimte als bedoeld in [artikel 6.2, vierde lid][ref1], heeft noodverlichting.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.1'
  - number: 6.3.4
    text: Een wegtunnelbuis heeft noodverlichting.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.3
  - number: 6.3.5
    text: |-
      Noodverlichting als bedoeld in het eerste tot en met vierde lid geeft binnen 15 seconden na het uitvallen van de
      voorziening voor elektriciteit gedurende ten minste 60 minuten een op een vloer, een tredevlak of een hellingbaan
      gemeten verlichtingssterkte van ten minste 1 lux.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.3
  - number: '6.4'
    text: |-
      Een verlichtingsinstallatie als bedoeld in de [artikelen 6.2][ref1] en [6.3][ref2] is aangesloten op een
      voorziening voor elektriciteit als bedoeld in [artikel 6.8][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.1'
      - id: ref2
