        afdeling: '2.9'
  - number: 2.67.2
    text: In afwijking van het eerste lid, geldt de eis aan de rookklasse uitsluitend bij een beschermde vluchtroute.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.67
  - number: 2.68.1
    text: |-
      Een zijde van een constructieonderdeel die grenst aan de buitenlucht voldoet aan de in [tabel 2.66][ref1]
      aangegeven brandklasse, bepaald volgens NEN-EN 13501-1.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.68
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.9.1
        afdeling: '2.9'
  - number: 2.68.2
    text: |-
      Het deel van een zijde van een constructieonderdeel dat grenst aan de buitenlucht en hoger ligt dan 13 m, voldoet
      aan brandklasse B, bepaald volgens NEN-EN 13501-1.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.68
  - number: 2.68.3
    text: |-
      Een zijde van een constructieonderdeel die grenst aan de buitenlucht, van een bouwwerk waarvan een voor personen
      bestemde vloer ten minste 5 m boven het meetniveau ligt, voldoet vanaf het aansluitende terrein tot een hoogte van
      ten minste 2,5 m aan brandklasse B, bepaald volgens NEN-EN 13501-1.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.68
  - number: 2.68.4
    text: Het eerste tot en met derde lid zijn niet van toepassing op de bovenzijde van een dak.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.68
  - number: 2.68.5
    text: |-
      In afwijking van het eerste tot en met derde lid voldoet een deur, een raam, een kozijn en een daaraan gelijk te
      stellen constructieonderdeel aan brandklasse D, bepaald volgens NEN-EN 13501-1.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.68
  - number: 2.69.1
    text: |-
      In afwijking van [artikel 2.67][ref1] geldt voor de bovenzijde van een vloer, een trap en een hellingbaan die
      grenst aan de binnenlucht rookklasse s1 en de in [tabel 2.66][ref2] aangegeven brandklasse, beide bepaald volgens
      NEN-EN 13501-1.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.69
