  - number: 2.17.1
    text: |-
      Een voor personen bestemde vloer heeft bij een rand een niet beweegbare afscheiding als die rand meer dan 1 m hoger
      ligt dan een aansluitende vloer, het aansluitende terrein of het aansluitende water.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.17
  - number: 2.17.2
    text: |-
      Een trap als bedoeld in [artikel 2.27][ref1] heeft, voor zover een zijkant van een tredevlak meer dan 1 m hoger
      ligt dan een aansluitende vloer, het aansluitende terrein of het aansluitende water, aan die zijkant een niet
      beweegbare afscheiding.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.4.1
        afdeling: '2.4'
  - number: 2.17.3
    text: |-
      Een hellingbaan als bedoeld in [artikel 2.27][ref1] heeft, voor zover een zijkant van de vloer meer dan 1 m hoger
      ligt dan een aansluitende vloer, het aansluitende terrein of het aansluitende water, aan die zijkant een niet
      beweegbare afscheiding.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.4.1
        afdeling: '2.4'
  - number: 2.17.4
    text: 'Het eerste lid geldt niet ter plaatse van de aansluiting van de vloer aan:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.17
  - number: 2.17.4.a
    text: een trap, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.17
  - number: 2.17.4.b
    text: een hellingbaan.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.17
  - number: 2.17.5
    text: 'Onverminderd het vierde lid geldt het eerste lid niet voor:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.17
  - number: 2.17.5.a
    text: een rand van een podium;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.17
  - number: 2.17.5.b
    text: een rand van een vloer die aan een bassin grenst;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.17
  - number: 2.17.5.c
    text: een rand van een laadvloer;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.17
  - number: 2.17.5.d
    text: een rand van een perron, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.17
  - number: 2.17.5.e
    text: een met een rand als bedoeld onder a tot en met d, gelijk te stellen rand van een vloer.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.17
  - number: 2.18.1
    text: |-
      Een vloerafscheiding als bedoeld in [artikel 2.17, eerste lid][ref1], heeft een hoogte van ten minste 1 m, gemeten
      vanaf de vloer.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.3.1
        afdeling: '2.3'
  - number: 2.18.2
    text: |-
      In afwijking van het eerste lid heeft een vloer die hoger ligt dan 13 m boven een aangrenzende vloer, het
      aansluitende terrein of het aansluitende water, een vloerafscheiding een hoogte van ten minste 1,2 m, gemeten vanaf
      de vloer.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.18
  - number: 2.18.3
    text: |-
      In afwijking van het eerste en tweede lid heeft een afscheiding als bedoeld in [artikel 2.17, eerste lid][ref1],
      ter plaatse van een al dan niet beweegbaar raam een hoogte van ten minste 0,85 m, gemeten vanaf de vloer.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.3.1
        afdeling: '2.3'
  - number: 2.18.4
    text: |-
      In afwijking van het eerste lid, heeft een vloerafscheiding een vanaf de vloer gemeten hoogte van ten minste 0,7 m,
      indien de som van die hoogte en de breedte van de bovenregel ten minste 1,1 m is.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.18
  - number: 2.18.5
    text: |-
      Een afscheiding als bedoeld in [artikel 2.17, tweede of derde lid][ref1], heeft een hoogte van ten minste 0,85 m,
      gemeten vanaf de voorkant van de tredevlakken of vanaf de vloer van de hellingbaan.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.18
    references:
