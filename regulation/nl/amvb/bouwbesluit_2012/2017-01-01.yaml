    text: |-
      een rookproductie met een rookdichtheid van ten hoogste 10 m-1 of 5,4-1 bepaald volgens NEN 6066 worden uitgegaan
      van rookklasse s2 bepaald volgens NEN-EN 13501-1.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel2.80
