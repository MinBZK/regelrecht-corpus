        afdeling: '4.2'
  - number: 4.11.2
    text: |-
      In afwijking van het eerste lid heeft een integraal toegankelijke toiletruimte een vloeroppervlakte van ten minste
      1,65 m x 2,2 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel4.11
  - number: 4.11.3
    text: |-
      Een vloeroppervlakte als bedoeld in het eerste en tweede lid heeft boven die vloer ten minste de in
      [tabel 4.8][ref1] aangegeven hoogte.


