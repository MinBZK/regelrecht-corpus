    text: |-
      In afwijking van het eerste lid wordt bij het geheel of gedeeltelijk vernieuwen of veranderen of vergroten van een
      bouwwerk bij toepassing van [artikel 2.67, eerste lid][ref1], niet uitgegaan van het rechtens verkregen niveau.


