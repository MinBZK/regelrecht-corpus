  - number: '6.5'
    text: |-
      Een ruimte bestemd om te worden verduisterd tijdens het gebruik door meer dan 50 personen heeft zodanige
      voorzieningen dat tijdens de verduistering een redelijke oriëntatie mogelijk is.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.5
  - number: '6.6'
    text: |-
      Op het bouwen van een tijdelijk bouwwerk is [artikel 6.3, vierde lid][ref1], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.1'
  - number: 6.7.1
    text: |-
      Een bouwwerk met een voorziening voor het afnemen en gebruiken van energie heeft een veilige voorziening voor het
      afnemen en gebruiken van energie.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.7
  - number: 6.7.2
    text: Aan de in het eerste lid gestelde eis wordt voldaan door toepassing van de voorschriften in deze afdeling.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.7
  - number: 6.8.1
    text: 'Een voorziening voor elektriciteit voldoet aan:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.8
  - number: 6.8.1.a
    text: NEN 1010 bij lage spanning, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.8
  - number: 6.8.1.b
    text: NEN-EN-IEC 61936-1 en NEN-EN 50522, bij hoge spanning.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.8
  - number: 6.8.2
    text: |-
      Bij een bestaand bouwwerk voldoet in afwijking van het eerste lid, onderdeel b, de voorziening voor elektriciteit
      aan V 1041.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.8
  - number: 6.9.1
    text: 'Een te installeren voorziening voor gas voldoet aan:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.9
  - number: 6.9.1.a
    text: NEN 1078 bij een nominale werkdruk van ten hoogste 0,5 bar, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.9
  - number: 6.9.1.b
    text: NEN-EN 15001-1 bij een nominale werkdruk hoger dan 0,5 bar en lager dan 40 bar.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.9
  - number: 6.9.2
    text: 'Een bestaande voorziening voor gas voldoet aan:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.9
  - number: 6.9.2.a
    text: NEN 8078 bij een nominale werkdruk van ten hoogste 0,5 bar, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.9
  - number: 6.9.2.b
    text: NEN 2078 bij een nominale werkdruk hoger dan 0,5 bar en lager dan 40 bar.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.9
  - number: 6.9.3
    text: |-
      Een te bouwen bouwwerk met een in [artikel 6.10][ref1] bedoelde aansluiting op het distributienet voor gas heeft,
      voor die aansluiting, leidingdoorvoeren en een mantelbuis die voldoen aan NEN 2768.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.9
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
  - number: 6.10.1
    text: |-
      Een in [artikel 6.8, eerste en tweede lid][ref1], bedoelde voorziening voor elektriciteit is aangesloten op het
      distributienet voor elektriciteit indien:


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.10
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
  - number: 6.10.1.a
    text: de aansluitafstand niet groter is dan 100 m, of
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.10
  - number: 6.10.1.b
    text: de aansluitafstand groter is dan 100 m en de aansluitkosten niet hoger zijn dan bij een aansluitafstand van 100 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.10
  - number: 6.10.2
    text: |-
      Een in artikel 6.9, eerste en tweede lid, bedoelde voorziening voor gas is aangesloten op het distributienet voor
      gas indien:
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.10
  - number: 6.10.2.a
    text: de aansluitafstand niet groter is dan 40 m, of
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.10
  - number: 6.10.2.b
    text: de aansluitafstand groter is dan 40 m en de aansluitkosten niet hoger zijn dan bij een aansluitafstand van 40 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.10
  - number: 6.10.3
    text: |-
      Een te bouwen bouwwerk met een of meer verblijfsgebieden is aangesloten op het in het warmteplan bedoelde
      distributienet voor warmte indien:
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.10
  - number: 6.10.3.a
    text: |-
      het in het warmteplan geplande aantal aansluitingen op dat distributienet op het moment van het indienen van de
      aanvraag om vergunning voor het bouwen nog niet is bereikt, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.10
  - number: 6.10.3.b
    text: 'de aansluitafstand:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.10
  - number: 6.10.3.b.i
    text: niet groter is dan 40 m, of
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.10
  - number: 6.10.3.b.ii
    text: groter is dan 40 m en de aansluitkosten niet hoger zijn dan bij een aansluitafstand van 40 m.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.10
  - number: 6.11.1
    text: |-
      Een bouwwerk met een voorziening voor drinkwater of warmwater heeft een voorziening voor drinkwater of warmwater
      die de gezondheid niet nadelig beïnvloedt.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.11
  - number: 6.11.2
    text: Aan de in het eerste lid gestelde eis wordt voldaan door toepassing van de voorschriften in deze afdeling.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.11
  - number: 6.12.1
    text: Een voorziening voor drinkwater voldoet aan NEN 1006.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.12
  - number: 6.12.2
    text: Bij ministeriële regeling kunnen voorschriften worden gegeven over het in het eerste lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.12
  - number: 6.13.1
    text: Een voorziening voor warmwater voldoet aan NEN 1006.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.13
  - number: 6.13.2
    text: Bij ministeriële regeling kunnen voorschriften worden gegeven over het in het eerste lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.13
  - number: '6.14'
    text: |-
      Een in [artikel 6.12][ref1] bedoelde watervoorziening is aangesloten op het openbare distributienet voor
      drinkwater, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel6.14
    references:
