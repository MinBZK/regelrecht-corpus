    text: |-
      Het volgens NEN 5077 bepaalde karakteristieke lucht-geluidniveauverschil voor de geluidsoverdracht van een besloten
      ruimte naar een verblijfsgebied van een aangrenzende gebruiksfunctie op een ander perceel is niet kleiner dan 52
      dB.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.16
  - number: 3.16.2
    text: |-
      Het volgens NEN 5077 bepaalde karakteristieke lucht-geluidniveauverschil voor de geluidsoverdracht van een besloten
      ruimte naar een niet in een verblijfsgebied gelegen besloten ruimte van een aangrenzende woonfunctie op een ander
      perceel is niet kleiner dan 47 dB.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.16
