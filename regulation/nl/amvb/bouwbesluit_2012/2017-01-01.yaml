    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.1
  - number: '3.2'
    text: |-
      Een uitwendige scheidingsconstructie van een verblijfsgebied heeft een volgens NEN 5077 bepaalde karakteristieke
      geluidwering met een minimum van 20 dB.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.2
  - number: 3.3.1
    text: |-
      Bij een krachtens de [Wet geluidhinder][ref1] of de [Tracéwet][ref2] vastgesteld hogere-waardenbesluit
      is de volgens NEN 5077 bepaalde karakteristieke geluidwering van een uitwendige scheidingsconstructie van
      een verblijfsgebied niet kleiner dan het verschil tussen de in dat besluit opgenomen hoogst toelaatbare
      geluidsbelasting voor industrie-, weg- of spoorweglawaai en 35 dB(A) bij industrielawaai, of 33 dB bij weg- of
      spoorweglawaai.


      [ref1]: https://wetten.overheid.nl/BWBR0003227
      [ref2]: https://wetten.overheid.nl/BWBR0006147
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0003227
      - id: ref2
        bwb_id: BWBR0006147
  - number: 3.3.2
    text: |-
      Bij een krachtens de [Wet geluidhinder][ref1] of de [Tracéwet][ref2] vastgesteld hogere-waardenbesluit is de
      volgens NEN 5077 bepaalde karakteristieke geluidwering van een uitwendige scheidingsconstructie van een bedgebied
      niet kleiner dan het verschil tussen de in dat besluit opgenomen hoogst toelaatbare geluidsbelasting voor
      industrie-, weg- of spoorweglawaai en 30 dB(A) bij industrielawaai, of 28 dB bij weg- of spoorweglawaai.


      [ref1]: https://wetten.overheid.nl/BWBR0003227
      [ref2]: https://wetten.overheid.nl/BWBR0006147
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0003227
      - id: ref2
        bwb_id: BWBR0006147
  - number: 3.3.3
    text: |-
      Indien dit leidt tot een lagere karakteristieke geluidwering van de uitwendige scheidingsconstructie dan bij
      toepassing van het eerste of tweede lid het geval is kan de in het eerste en tweede lid bedoelde geluidsbelasting
      worden bepaald volgens het reken- en meetvoorschrift, bedoeld in [artikel 110d van de Wet geluidhinder][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel110d
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 110d
  - number: 3.3.4
    text: |-
      Op een inwendige scheidingsconstructie van een gebied als bedoeld in het eerste en tweede lid, die niet de
      scheiding vormt met een verblijfsgebied van een aangrenzende gebruiksfunctie waarop het eerste en tweede lid van
      toepassing zijn, zijn deze leden van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.3
  - number: 3.3.5
    text: |-
      Een scheidingsconstructie als bedoeld in het eerste, tweede en vierde lid van een verblijfsruimte heeft een
      volgens NEN 5077 bepaalde karakteristieke geluidwering die maximaal 2 dB of dB(A) lager is dan de karakteristieke
      geluidwering als bedoeld in het eerste, tweede en vierde lid van het verblijfsgebied waarin de verblijfsruimte
      ligt.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel3.3
  - number: 3.4.1
    text: |-
      Een uitwendige scheidingsconstructie van een verblijfsgebied van een gebruiksfunctie in een krachtens de
      [Luchtvaartwet][ref1] of de [Wet luchtvaart][ref2] vastgestelde Ke-geluidzone bij een militaire luchthaven, heeft
      een volgens NEN 5077 bepaalde karakteristieke geluidwering die niet kleiner is dan de waarde in tabel 3.4. Indien
      de geluidsbelasting ligt tussen de in de eerste kolom opgenomen Ke-waarden, wordt de te bereiken waarde van de
      geluidwering bepaald door middel van rechtevenredige interpolatie tussen de in de tweede kolom opgenomen dB-
      waarden.
