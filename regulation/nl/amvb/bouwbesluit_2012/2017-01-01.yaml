  - number: 7.18.1
    text: Een woonfunctie wordt niet bewoond door meer dan één persoon per 12 m2 gebruiksoppervlakte.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.18
  - number: 7.18.2
    text: Een woonwagen wordt niet bewoond door meer dan één persoon per 6 m2 gebruiksoppervlakte.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.18
  - number: 7.18.3
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op een woonfunctie waarin door het Centraal Orgaan opvang
      asielzoekers opvang aan asielzoekers wordt geboden.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.18
  - number: 7.19.1
    text: |-
      De concentratie van asbestvezels in een voor personen toegankelijke ruimte van een bestaand bouwwerk is niet groter
      dan 100.000 ve/m3, bepaald volgens NEN 2991.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.19
  - number: 7.19.2
    text: |-
      De concentratie van formaldehyde in een voor personen toegankelijke ruimte van een bouwwerk is niet groter dan 120
      μg/m3, bepaald volgens NEN-EN-ISO 16.000-2.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.19
  - number: '7.20'
    text: |-
      Een bouwwerk, open erf of terrein wordt niet gebruikt indien door of namens het bevoegd gezag is meegedeeld dat dit
      in verband met bouwvalligheid van een in de nabijheid gelegen bouwwerk gevaarlijk is.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.20
  - number: '7.21'
    text: |-
      Een bouwwerk, open erf en terrein bevindt zich in een zodanig zindelijke staat, dat dit geen hinder voor personen
      en geen gevaar voor de veiligheid of de gezondheid van personen oplevert.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.21
  - number: '7.22'
    text: |-
      Onverminderd het bij of krachtens dit besluit of de [Wet milieubeheer][ref1] bepaalde is het verboden in, op of aan
      een bouwwerk of op een open erf of terrein voorwerpen of stoffen te plaatsen, te werpen of te hebben, handelingen
      te verrichten of na te laten of werktuigen te gebruiken, waardoor:


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.22
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 7.22.a
    text: op voor de omgeving hinderlijke of schadelijke wijze rook, roet, walm of stof wordt verspreid;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.22
  - number: 7.22.b
    text: overlast wordt of kan worden veroorzaakt voor de gebruikers van het bouwwerk, het open erf of terrein;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.22
  - number: 7.22.c
    text: |-
      op voor de omgeving hinderlijke of schadelijke wijze stank, stof of vocht of irriterend materiaal wordt verspreid
      of overlast wordt veroorzaakt door geluid en trilling, elektrische trilling daaronder begrepen, of door schadelijk
      of hinderlijk gedierte, dan wel door verontreiniging van het bouwwerk, open erf of terrein, of
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.22
  - number: 7.22.d
    text: instortings-, omval- of ander gevaar wordt veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.22
  - number: 7.23.1
    text: Een verblijfsruimte in een onderwijsfunctie voor basisonderwijs heeft een kooldioxidemeter.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.23
  - number: 7.23.2
    text: Bij ministeriële regeling kunnen voorschriften worden gegeven over het in het eerste lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel7.23
  - number: 8.1.1
    text: |-
      De uitvoering van bouw- en sloopwerkzaamheden is zodanig dat voor de omgeving een onveilige situatie of voor de
      gezondheid of bruikbaarheid nadelige hinder zoveel mogelijk wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel8.1
  - number: 8.1.2
    text: Aan de in het eerste lid gestelde eis wordt voldaan door toepassing van de voorschriften in deze afdeling.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel8.1
  - number: '8.2'
    text: 'Bij het uitvoeren van bouw- of sloopwerkzaamheden worden maatregelen getroffen ter voorkoming van:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel8.2
  - number: 8.2.a
    text: |-
      letsel van personen op een aangrenzend perceel of een aan het bouw- of sloopterrein grenzende openbare weg,
      openbaar water of openbaar groen;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel8.2
  - number: 8.2.b
    text: letsel van personen die het bouw- of sloopterrein onbevoegd betreden, en
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel8.2
  - number: 8.2.c
    text: |-
      beschadiging of belemmering van wegen, van in de weg gelegen werken en van andere al dan niet roerende zaken op
      een aangrenzend perceel of op een aan het bouw- of sloopterrein grenzende openbare weg, openbaar water of openbaar
      groen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel8.2
  - number: 8.3.1
    text: |-
      Bedrijfsmatige bouw- of sloopwerkzaamheden worden op werkdagen en op zaterdag tussen 7.00 uur en 19.00 uur
      uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel8.3
  - number: 8.3.2
    text: |-
      Bij het uitvoeren van de werkzaamheden als bedoeld in het eerste lid worden de in tabel 8.3 aangegeven dagwaarden
      en de daarbij behorende maximale blootstellingsduur niet overschreden.
            Tabel 8.3











                    Dagwaarde


                    ≤60 dB(A)


                    >60 dB(A)


                    >65 dB(A)


                    >70 dB(A)


                    >75 dB(A)


                    >80 dB(A)






                    maximale blootstellingsduur


                    onbeperkt


                    50 dagen


                    30 dagen


                    15 dagen


                    5 dagen


                    0 dagen
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel8.3
  - number: 8.3.3
    text: |-
      Het bevoegd gezag kan ontheffing verlenen van het eerste en tweede lid. Onverkort het gestelde in de ontheffing,
      wordt bij het uitvoeren van bouw- of sloopwerkzaamheden gebruik gemaakt van de best beschikbare stille technieken.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel8.3
  - number: 8.3.4
    text: |-
      Indien het bevoegd gezag met betrekking tot het uitvoeren van bouw- of sloopwerkzaamheden beleidsregels als bedoeld
      in [titel 4.3 van de Algemene wet bestuursrecht][ref1] heeft vastgesteld, is in afwijking van het derde lid geen
      ontheffing vereist indien het uitvoeren van de werkzaamheden voldoet aan die beleidsregels en het bevoegd gezag
      ten minste twee werkdagen voor de feitelijke aanvang van die werkzaamheden in kennis is gesteld van de aanvang van
      de werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 8.4.1
    text: |-
      Trillingen veroorzaakt door het uitvoeren van bouw- of sloopwerkzaamheden bedragen in geluidsgevoelige
      ruimten als bedoeld in [artikel 1 van de Wet geluidhinder][ref1] en in verblijfsruimten als bedoeld in
      [artikel 1.1, onderdeel e, van het Besluit geluidhinder][ref2] niet meer dan de trillingsterkte, genoemd in tabel 4
      van de Meet- en beoordelingsrichtlijn deel B «Hinder voor personen in gebouwen» 2006.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020445#Artikel1
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020445
        artikel: '1'
  - number: 8.4.2
    text: Het bevoegd gezag kan ontheffing verlenen van de trillingsterkte, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel8.4
  - number: '8.5'
    text: |-
      Tijdens het uitvoeren van bouw- en sloopwerkzaamheden worden maatregelen getroffen om visueel waarneembare
      stofverspreiding buiten het bouw- of sloopterrein te voorkomen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel8.5
  - number: '8.6'
    text: |-
      Het bemalen van bouwputten, leidingsleuven en andere tijdelijke ontgravingen ten behoeve van bouwwerkzaamheden
      leidt niet tot een zodanige wijziging van de grondwaterstand dat gevaar kan ontstaan voor de veiligheid van
      belendingen.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel8.6
  - number: '8.7'
    text: |-
      De op grond van de [artikelen 8.2 tot en met 8.6][ref1] te treffen maatregelen worden op aanwijzing van het bevoegd
      gezag vastgelegd in een veiligheidsplan. Het plan bevat ter beoordeling door het bevoegd gezag:


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel8
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel8.7
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.1'
  - number: 8.7.a
    text: 'ten minste een tekening waaruit de bouw- of sloopplaatsinrichting blijkt met:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel8.7
  - number: 8.7.a.1
    text: de toegang tot de bouw- of sloopplaats inclusief begrenzing, afscheiding en afsluiting van de bouw- of sloopplaats;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel8.7
  - number: 8.7.a.2
    text: de ligging van het perceel waarop gebouwd of gesloopt wordt en de omliggende wegen en bouwwerken;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel8.7
  - number: 8.7.a.3
    text: de situering van het te bouwen of te slopen bouwwerk;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel8.7
  - number: 8.7.a.4
    text: de aan- en afvoerwegen;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel8.7
  - number: 8.7.a.5
    text: de laad-, los- en hijszones;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel8.7
  - number: 8.7.a.6
    text: de plaats van bouwketen;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel8.7
  - number: 8.7.a.7
    text: de in of op de bodem van het perceel aanwezige leidingen;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel8.7
  - number: 8.7.a.8
    text: de plaats van machines, werktuigen en ander hulpmaterieel en opslag van materialen;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel8.7
  - number: 8.7.a.9
    text: de bereikbaarheid van bluswater- en andere veiligheidsvoorzieningen;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel8.7
  - number: 8.7.b
    text: |-
      gegevens en bescheiden over de toe te passen bouw- of sloopmethodiek en de toe te passen materialen, materieel,
      hulp- en beveiligingsmiddelen bij de bouw- of sloopwerkzaamheden;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel8.7
  - number: 8.7.c
    text: 'indien een bouwput wordt gemaakt:'
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel8.7
  - number: 8.7.c.1
    text: de hoofdopzet van de verticale bouwputafscheiding en de bouwputbodem;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel8.7
  - number: 8.7.c.2
    text: de uitgangspunten voor een bemalingsplan;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel8.7
  - number: 8.7.c.3
    text: de uitgangspunten voor een monitoringsplan ter voorkoming van schade aan naburige bouwwerken;
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel8.7
  - number: 8.7.d
    text: |-
      een rapport van een akoestisch onderzoek, indien aannemelijk is dat de dagwaarde vanwege het uitvoeren van bouw- of
      sloopwerkzaamheden meer bedraagt of de maximale blootstellingsduur in dagen langer duurt dan de waarden, bedoeld in
      [artikel 8.3, tweede en derde lid][ref1], of indien aannemelijk is dat niet wordt voldaan aan de beleidsregels als
      bedoeld in artikel 8.3, vierde lid;


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel8
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel8.7
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.1'
  - number: 8.7.e
    text: |-
      een rapport van een trillingenonderzoek, indien aannemelijk is dat het uitvoeren van de bouw- of sloopwerkzaamheden
      een grotere trillingssterkte veroorzaakt dan de trillingssterkte bedoeld in [artikel 8.4, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel8
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel8.7
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.1'
  - number: 8.8.1
    text: |-
      Bouw- en sloopwerkzaamheden worden zodanig uitgevoerd dat tijdens de uitvoering vrijkomend bouw- en sloopafval
      deugdelijk wordt gescheiden.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel8.8
  - number: 8.8.2
    text: |-
      Aan de in het eerste lid gestelde eis wordt voldaan door toepassing van de voorschriften in deze afdeling en de
      krachtens die bepalingen gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel8.8
  - number: '8.9'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gegeven over de te scheiden categorieën bouw-en sloopafval en
      de opslag en afvoer daarvan op en van het terrein bij het uitvoeren van bouw- of sloopwerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel8.9
  - number: 9.1.1
    text: |-
      Op een aanvraag om vergunning voor het bouwen, ingediend voor het tijdstip van inwerkingtreding van dit
      besluit, alsmede op enig bezwaar of beroep, ingesteld tegen een beslissing over een dergelijke aanvraag,
      blijven de voorschriften van het [Bouwbesluit 2003][ref1], het [Besluit brandveilig gebruik bouwwerken][ref2],
      [paragraaf 2 van het Besluit aanvullende regels veiligheid wegtunnels][ref3], de bouwverordening, bedoeld in
      [artikel 8, eerste lid, van de wet][ref4] en de daarop berustende bepalingen van toepassing, zoals deze luidden op
      het tijdstip waarop de aanvraag werd ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0012727
      [ref2]: https://wetten.overheid.nl/BWBR0024379
      [ref3]: https://wetten.overheid.nl/BWBR0019857#Paragraaf2
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel8
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0012727
      - id: ref2
        bwb_id: BWBR0024379
      - id: ref3
        bwb_id: BWBR0019857
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0005181
        artikel: '8'
  - number: 9.1.2
    text: |-
      Op een aanvraag om vergunning voor brandveilig gebruik, ingediend voor het tijdstip van inwerkingtreding van dit
      besluit, alsmede op enig bezwaar of beroep, ingesteld tegen een beslissing over een dergelijke aanvraag, blijven
      de voorschriften van het [Bouwbesluit 2003][ref1], het [Besluit brandveilig gebruik bouwwerken][ref2] en de daarop
      berustende bepalingen van toepassing, zoals deze luidden op het tijdstip waarop de aanvraag werd ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0012727
      [ref2]: https://wetten.overheid.nl/BWBR0024379
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0012727
      - id: ref2
        bwb_id: BWBR0024379
  - number: 9.1.3
    text: |-
      Op een aanvraag om omgevingsvergunning voor het slopen als bedoeld in
      [artikel 2.2, eerste lid, onder a, van de Wabo][ref1], ingediend voor het tijdstip van inwerkingtreding van dit
      besluit, alsmede met betrekking tot enig bezwaar of beroep, ingesteld tegen een beslissing over een dergelijke
      aanvraag, blijven de voorschriften van de bouwverordening, bedoeld in [artikel 8, eerste lid, van de wet][ref2]
      en de daarop berustende bepalingen van toepassing, zoals deze luidden op het tijdstip waarop de aanvraag werd
      ingediend. Een dergelijke vergunning wordt aangemerkt als een sloopmelding als bedoeld in [artikel 1.26][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0030461
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.7'
  - number: 9.1.4
    text: |-
      Op een gebruiksmelding als bedoeld in
      [artikel 2.12.1, eerste lid, van het Besluit brandveilig gebruik bouwwerken][ref1], gedaan voor het
      tijdstip van inwerkingtreding van dit besluit, alsmede op enig bezwaar of beroep, ingesteld tegen een
      beslissing over een dergelijke melding, blijven de voorschriften van het [Bouwbesluit 2003][ref2], het
      [Besluit brandveilig gebruik bouwwerken][ref3] en de daarop berustende bepalingen van toepassing, zoals
      deze luidden op het tijdstip waarop de melding werd gedaan. Een dergelijke melding wordt aangemerkt als een
      gebruiksmelding als bedoeld in [artikel 1.18][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0024379#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012727
      [ref3]: https://wetten.overheid.nl/BWBR0024379
      [ref4]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0024379
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0012727
      - id: ref3
        bwb_id: BWBR0024379
      - id: ref4
        bwb_id: BWBR0030461
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.5'
  - number: 9.1.5
    text: |-
      Op een door de bouwverordening, bedoeld in [artikel 8, eerste lid, van de wet][ref1] vereiste sloopmelding, gedaan
      voor het tijdstip van inwerkingtreding van dit besluit, alsmede op enig bezwaar of beroep, ingesteld tegen een
      beslissing over een dergelijke melding, blijven de voorschriften van de bouwverordening en de daarop berustende
      bepalingen van toepassing, zoals deze luidden op het tijdstip waarop de melding werd gedaan. Een dergelijke melding
      wordt aangemerkt als een sloopmelding als bedoeld in [artikel 1.26][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0030461
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.7'
  - number: 9.1.6
    text: |-
      Op een aanvraag om vergunning voor het bouwen of voor brandveilig gebruik, een gebruiksmelding of een sloopmelding,
      gedaan voor het tijdstip waarop een wijziging van dit besluit in werking treedt, alsmede met betrekking tot
      enig bezwaar of beroep, ingesteld tegen een beslissing omtrent een dergelijke aanvraag of melding, blijven de
      voorschriften van dit besluit en de daarop berustende bepalingen van toepassing, die golden op het tijdstip waarop
      de aanvraag of melding werd gedaan.
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel9.1
  - number: 9.2.1
    text: |-
      Zolang het aantal personen dat in een bouwwerk of een gedeelte daarvan aanwezig is niet groter is dan het
      onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van dit besluit toegestane aantal personen in dat
      bouwwerk of gedeelte daarvan blijven de [artikelen 1.2, eerste lid][ref1], voor zover dit betrekking heeft op de
      bij of krachtens [hoofdstuk 2][ref2] gestelde eisen, en [6.25, derde lid][ref3], buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
      - id: ref2
        bwb_id: BWBR0030461
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0030461
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.6'
  - number: 9.2.2
    text: |-
      Zolang de indeling van een bouwwerk of een gedeelte daarvan niet verandert en het aantal personen in dat bouwwerk
      of gedeelte niet groter is dan het onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van dit besluit
      toegestane aantal personen blijft op dat bouwwerk of gedeelte [artikel 6.3][ref1] buiten toepassing indien dat
      bouwwerk of dat gedeelte daarvan voldoet aan de [artikelen 2.66][ref2] en [2.67 van het Bouwbesluit 2003][ref3]
      zoals dit luidde onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0012727#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0012727#Artikel2
    url: https://wetten.overheid.nl/BWBR0030461/2017-01-01#Artikel9.2
    references:
