      [artikel 1, eerste lid, onderdeel f, van de Wet toelating zorginstellingen][ref1]
      die als zodanig is toegelaten dan wel een academisch ziekenhuis als bedoeld in
      [artikel 1.4 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
