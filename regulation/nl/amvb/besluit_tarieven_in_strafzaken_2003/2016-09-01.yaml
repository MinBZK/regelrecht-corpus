  - number: '1.2'
    text: |-
      In dit besluit en de daarop rustende bepalingen is voor hetgeen wordt verstaan onder psychiatrisch ziekenhuis en
      psychiater [artikel 90sexies][ref1], respectievelijk [artikel 90septies van het Wetboek van Strafrecht][ref2] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel90sexies
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel90septies
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 90sexies
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 90septies
  - number: '2.1'
    text: |-
      Het tarief voor de vergoeding van werkzaamheden als bedoeld in
      [artikel 3, eerste lid, onderdeel a, van de wet][ref1], verricht door geneeskundigen, bedraagt, voor het verrichten
      van:


      [ref1]: https://wetten.overheid.nl/BWBR0002406#Artikel3
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002406
        artikel: '3'
  - number: 2.1.a
    text: psychiatrisch onderzoek, ten hoogste € 116,09 per uur;
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel2
  - number: 2.1.b
    text: |-
      onderzoek van iemand die gestoord is in zijn geestvermogens en afgifte van een verklaring, benodigd voor gedwongen
      opneming van de patiënt in een psychiatrisch ziekenhuis, ten hoogste € 116,09;
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel2
  - number: 2.1.c
    text: |-
      onderzoek en afgifte van een verklaring omtrent de conclusies van een onderzoek als bedoeld onder b door een
      controlerend geneeskundige of een rayonarts, € 13,16 respectievelijk, indien het onderzoek met spoed moet worden
      verricht, € 25,87.
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel2
  - number: '2.2'
    text: |-
      Voor het verrichten van een psychiatrisch onderzoek als bedoeld in het eerste lid, onder a, voor zover deze
      inhoudt het opstellen van een psychiatrisch rapport over een volwassene, komt ten behoeve van een monorapportage
      ten hoogste veertien uur en ten behoeve van een dubbelrapportage of tripelrapportage ten hoogste achttien uur voor
      vergoeding in aanmerking.
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel2
  - number: '2.3'
    text: |-
      Voor het verrichten van een psychiatrisch onderzoek als bedoeld in het eerste lid, onder a, voor zover deze
      inhoudt het opstellen van een psychiatrisch rapport over een jeugdige, komt ten behoeve van een monorapportage ten
      hoogste achttien uur en ten behoeve van een dubbelrapportage of tripelrapportage ten hoogste tweeëntwintig uur voor
      vergoeding in aanmerking.
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel2
  - number: '3.1'
    text: |-
      Het tarief voor de vergoeding van werkzaamheden als bedoeld in
      [artikel 3, eerste lid, onderdeel a, van de wet][ref1], verricht door psychologen, bedraagt, voor het verrichten
      van psychologisch onderzoek, ten hoogste  € 89,10 per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0002406#Artikel3
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002406
        artikel: '3'
  - number: '3.2'
    text: |-
      Voor het verrichten van een psychologisch onderzoek als bedoeld in het eerste lid, voor zover deze inhoudt het
      opstellen van een psychologisch rapport over een volwassene, komt ten behoeve van een monorapportage ten hoogste
      achttien uur en ten behoeve van een dubbelrapportage of tripelrapportage ten hoogste twintig uur voor vergoeding
      in aanmerking.
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel3
  - number: '3.3'
    text: |-
      Voor het verrichten van een psychologisch onderzoek als bedoeld in het eerste lid, voor zover deze inhoudt het
      opstellen van een psychologisch rapport over een jeugdige, komt ten behoeve van een monorapportage ten hoogste
      tweeëntwintig uur en ten behoeve van een dubbelrapportage of tripelrapportage ten hoogste vierentwintig uur voor
      vergoeding in aanmerking.
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel3
  - number: '4.1'
    text: |-
      Het tarief voor de vergoeding van werkzaamheden als bedoeld in
      [artikel 3, eerste lid, onderdeel a, van de wet][ref1], bedraagt voor tolken € 43,89 per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0002406#Artikel3
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002406
        artikel: '3'
  - number: '4.2'
    text: |-
      In afwijking van het eerste lid behouden tolken die vóór 1 oktober 2000 reeds een hogere uurvergoeding voor hun
      werkzaamheden ontvingen, het recht op een hogere vergoeding. Deze vergoeding bedraagt:
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel4
  - number: 4.2.a
    text: voor tolken in Europese talen € 46,29 per uur;
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel4
  - number: 4.2.b
    text: voor tolken in veelbeheerste niet-Europese talen € 48,60 per uur;
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel4
  - number: 4.2.c
    text: voor tolken in overige niet-Europese talen € 54,- per uur.
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel4
  - number: '4.3'
    text: |-
      Het tarief voor de vergoeding van werkzaamheden als bedoeld in
      [artikel 3, eerste lid, onderdeel a, van de wet][ref1], bedraagt voor tolken gebarentaal € 46,29 per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0002406#Artikel3
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002406
        artikel: '3'
  - number: '4.4'
    text: |-
      De tolken genoemd in het eerste tot en met derde lid, die werkzaamheden verrichten bij de gerechten, ontvangen
      een voorrijtarief van  € 20,23. Een tolk kan per gerecht maximaal tweemaal per dag aanspraak maken op het
      voorrijtarief. Om voor de tweede maal voor dit tarief in aanmerking te komen dienen er twee uren tussen het einde
      van de eerste en de aanvang van de volgende dienst te zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel4
  - number: '5'
    text: |-
      Het tarief voor de vergoeding van werkzaamheden als bedoeld in
      [artikel 3, eerste lid, onderdeel a, van de wet][ref1], bedraagt voor vertalers voor vertalingen uit of in:


      [ref1]: https://wetten.overheid.nl/BWBR0002406#Artikel3
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002406
        artikel: '3'
  - number: 5.a
    text: het Duits, Engels of Frans, € 0,79 per regel;
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel5
  - number: 5.b
    text: andere veelbeheerste Europese talen € 1,20 per regel;
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel5
  - number: 5.c
    text: overige Europese talen € 1,51 per regel;
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel5
  - number: 5.d
    text: veel beheerste niet-Europese talen € 1,51 per regel;
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel5
  - number: 5.e
    text: overige niet-Europese talen € 1,69 per regel.
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel5
  - number: 5a.1
    text: |-
      Bij ministeriële regeling kan bij wege van experiment, in het belang van het streven naar marktwerking op het
      gebied van de werkzaamheden van tolken en vertalers, voor een periode van maximaal drie jaren in dier voege worden
      afgeweken van de [artikelen 4, eerste, tweede en derde lid][ref1], en [5][ref2] dat de daarin genoemde tarieven
      als maximumtarieven gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0015481#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0015481#Artikel5
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0015481
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0015481
        artikel: '5'
        paragraaf: '2'
  - number: 5a.2
    text: 'Indien toepassing wordt gegeven aan het eerste lid, wordt in ieder geval bepaald:'
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel5a
  - number: 5a.2.a
    text: in welke arrondissementen de experimenten plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel5a
  - number: 5a.2.b
    text: gedurende welke periode de experimenten plaatsvinden en vanaf welk moment deze periode aanvangt;
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel5a
  - number: 5a.2.c
    text: welke regels daarbij in acht worden genomen; en
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel5a
  - number: 5a.2.d
    text: |-
      de wijze waarop tot de vaststelling wordt gekomen of de experimenten zodanig geslaagd zijn, dat de voorschriften
      waarvan bij wege van deze experimenten is afgeweken, zouden moeten worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel5a
  - number: '6'
    text: |-
      Voor werkzaamheden als bedoeld in [artikel 3, eerste lid, onderdeel a, van de wet][ref1], waarvoor geen speciaal
      tarief is bepaald, geldt, naar gelang de werkzaamheden niet of in meer of mindere mate van wetenschappelijke of
      bijzondere aard zijn, een tarief van ten hoogste € 116,09 per uur, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0002406#Artikel3
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002406
        artikel: '3'
  - number: 6.a
    text: |-
      het tarief voor vergoedingen van verrichtingen van medische aard het door de Nederlandse Zorgautoriteit
      vastgestelde tarief bedraagt;
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel6
  - number: 6.b
    text: |-
      het tarief voor vergoedingen van verpleging in een zorginstelling het voor deze vergoedingen geldende tarief in de
      laagste klasse bedraagt.
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel6
  - number: '7'
    text: |-
      De tarieven, genoemd in de [artikelen 2 tot en met 6][ref1], worden met de helft verhoogd voor werkzaamheden die
      ingevolge het daartoe strekkende verzoek of de gegeven opdracht moeten worden verricht op:


      [ref1]: https://wetten.overheid.nl/BWBR0015481#Artikel2
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0015481
        artikel: '2'
        paragraaf: '2'
  - number: 7.a
    text: zaterdag;
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel7
  - number: 7.b
    text: zondag;
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel7
  - number: 7.c
    text: |-
      een in [artikel 3 van de Algemene termijnenwet][ref1] genoemde algemeen erkende feestdag of een bij of krachtens
      dat artikel daarmee gelijkgestelde dag;


      [ref1]: https://wetten.overheid.nl/BWBR0002448#Artikel3
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002448
        artikel: '3'
  - number: 7.d
    text: op een andere dag, dan omschreven onder a tot en met c, tussen 0.00 en 08.00 uur of tussen 20.00 en 24.00 uur.
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel7
  - number: '8.1'
    text: |-
      Het tarief voor vergoedingen wegens tijdverzuim als bedoeld in
      [artikel 3, eerste lid, onderdeel b, van de wet][ref1] bedraagt, indien deze vergoedingen worden verstrekt aan:


      [ref1]: https://wetten.overheid.nl/BWBR0002406#Artikel3
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002406
        artikel: '3'
  - number: 8.1.a
    text: geneeskundigen, bevoegd tot uitoefening van de praktijk in Nederland, ten hoogste € 116,09 per uur;
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel8
  - number: 8.1.b
    text: psychologen, bevoegd tot uitoefening van de praktijk in Nederland, ten hoogste € 89,10 per uur;
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel8
  - number: 8.1.c
    text: vertalers € 40,45 per uur;
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel8
  - number: 8.1.d
    text: |-
      andere personen aan wie werkzaamheden zijn opgedragen, naar gelang de werkzaamheden niet of in meer of mindere mate
      van wetenschappelijke of bijzondere aard zijn, ten hoogste € 116,09 per uur;
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel8
  - number: 8.1.e
    text: |-
      getuigen, met uitzondering van minderjarigen die geen inkomsten derven, aan voogden die wegens een strafzaak tegen
      een onder hun gezag staande minderjarige ingevolge het [Wetboek van Strafvordering][ref1] moeten worden opgeroepen,
      aan curatoren, bij toepassing van [artikel 509d van dat Wetboek][ref2], en aan noodzakelijke geleiders van personen
      als hiervoor bedoeld, van personen aan wie werkzaamheden zijn opgedragen, van verdachten en van gerekwestreerden, €
      6,81 per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel509d
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001903
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 509d
  - number: '8.2'
    text: 'De in het eerste lid bedoelde vergoeding komt voor de tijd, besteed aan de reis, niet toe aan:'
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel8
  - number: 8.2.a
    text: |-
      geneeskundigen, psychologen en andere personen aan wie werkzaamheden zijn opgedragen van wetenschappelijke of
      bijzondere aard;
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel8
  - number: 8.2.b
    text: tolken en vertalers.
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel8
  - number: '8.3'
    text: |-
      Indien vergoeding wordt toegekend voor een plaatsvervanger, wordt de voor tijdverzuim toe te kennen vergoeding
      daarop in mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel8
  - number: '9.1'
    text: |-
      Voor de vaststelling van de uurvergoeding als bedoeld in de [artikelen 2 tot en met 8][ref1] geldt een gedeelte
      van een uur gelijk aan een half uur of korter, als een half uur, en een gedeelte langer dan een half uur als een
      heel uur.


      [ref1]: https://wetten.overheid.nl/BWBR0015481#Artikel2
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0015481
        artikel: '2'
        paragraaf: '2'
  - number: '9.2'
    text: |-
      Voor tijdverzuim als bedoeld in [artikel 8][ref1] is per dag een vergoeding verschuldigd voor ten hoogste negen
      uur.


      [ref1]: https://wetten.overheid.nl/BWBR0015481#Artikel8
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0015481
        artikel: '8'
        paragraaf: '2'
  - number: '10.1'
    text: |-
      Voor een lokaliteit, door een gemeente beschikbaar gesteld ingevolge een verzoek als bedoeld in
      [artikel 4 van de wet][ref1] is, indien de vergoeding voor het gebruik in een plaatselijke belastingverordening is
      geregeld, aan de gemeente een vergoeding verschuldigd overeenkomstig die verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0002406#Artikel4
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002406
        artikel: '4'
  - number: '10.2'
    text: |-
      In andere gevallen dan bedoeld in het eerste lid wordt de vergoeding berekend naar het plaatselijk gangbare tarief.
      Wanneer dit tarief afhankelijk is gesteld van een indeling naar klassen, dan wordt de vergoeding berekend naar het
      tarief voor de laagste klasse. Bij vergoeding volgens dagtarief is voor beschikbaarstelling gedurende zes uur of
      korter de halve dagprijs, voor meer dan zes uur de hele dagprijs verschuldigd.
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel10
  - number: '10.3'
    text: Bijkomende kosten kunnen overeenkomstig plaatselijk gebruik worden vergoed.
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel10
  - number: '11.1'
    text: |-
      Het tarief voor vergoedingen wegens reis- en verblijfkosten als bedoeld in [artikel 6 van de wet][ref1] bedraagt,
      indien deze vergoedingen worden verstrekt aan:


      [ref1]: https://wetten.overheid.nl/BWBR0002406#Artikel6
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002406
        artikel: '6'
  - number: 11.1.a
    text: |-
      personen als bedoeld in [artikel 8, tweede lid, onder a][ref1], € 2,70 per retourkilometer;


      [ref1]: https://wetten.overheid.nl/BWBR0015481#Artikel8
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0015481
        artikel: '8'
        paragraaf: '2'
  - number: 11.1.b
    text: |-
      personen als bedoeld in [artikel 8, tweede lid, onder b][ref1], € 1,54 per retourkilometer;


      [ref1]: https://wetten.overheid.nl/BWBR0015481#Artikel8
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0015481
        artikel: '8'
        paragraaf: '2'
  - number: 11.1.c
    text: |-
      personen aan wie op grond van [artikel 3, derde lid, sub c, d of e, van de wet][ref1], geen vergoeding wegens
      tijdverzuim toekomt, het tarief, gesteld in het [Reisbesluit binnenland][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002406#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005889
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002406
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005889
  - number: 11.1.d
    text: |-
      personen aan wie werkzaamheden zijn opgedragen die niet van wetenschappelijke of bijzondere aard zijn, aan
      getuigen, aan voogden die wegens een strafzaak tegen een onder hun gezag staande minderjarige ingevolge
      het [Wetboek van Strafvordering][ref1] moeten worden opgeroepen, aan curatoren, bij toepassing van
      [artikel 509d van dat Wetboek][ref2], en aan noodzakelijke geleiders van personen als hiervoor bedoeld, van
      personen aan wie werkzaamheden zijn opgedragen, van verdachten en van gerekwestreerden, een tarief waarvan de
      hoogte gelijk is aan de reiskosten per openbaar middel van vervoer, laagste klasse dan wel een kilometervergoeding
      van € 0,28 per kilometer indien openbaar vervoer niet of niet voldoende mogelijk is, alsmede verblijfkosten tot ten
      hoogste € 37,85 per dag, met inbegrip van overnachting; het tarief voor de vergoeding van het gebruik van een eigen
      auto bedraagt ten hoogste  € 0,28 per kilometer.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel509d
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001903
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 509d
  - number: '11.2'
    text: Het aantal retourkilometers, bedoeld in het eerste lid, onder a en b, wordt berekend naar de kortste reisroute.
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel11
  - number: '11.3'
    text: |-
      Voor het gebruik van een bijzonder middel van vervoer in de gevallen, bedoeld in [artikel 7 van de wet][ref1],
      wordt een vergoeding verstrekt, berekend naar de werkelijke kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0002406#Artikel7
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002406
        artikel: '7'
  - number: '11.4'
    text: |-
      Vergoeding voor reis- en verblijfkosten wordt niet meer dan eenmaal toegekend, ook al wordt de reis gemaakt ten
      behoeve van verschillende zaken.
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel11
  - number: '12.1'
    text: |-
      Behalve voor de gevallen, bedoeld in [artikel 17, tweede lid, van de wet][ref1], wordt evenmin recht geheven voor:


      [ref1]: https://wetten.overheid.nl/BWBR0002406#Artikel17
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002406
        artikel: '17'
  - number: 12.1.a
    text: |-
      het geven van inzage in vonnissen, arresten, registers of andere stukken waarvan kennisneming geoorloofd is,
      of voor het verstrekken van inlichtingen aan de verdachte, de gewezen verdachte, gerekwestreerde, de gewezen
      gerekwestreerde, de benadeelde partij; voor de benadeelde partij geldt dit ook indien deze zich niet in de
      strafzaak voegt, echter slechts ingeval hij belang heeft bij de gewenste gegevens en hij niet in staat is enig
      recht te betalen;
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel12
  - number: 12.1.b
    text: |-
      het verstrekken van afschriften van of uittreksels uit vonnissen, arresten, registers of andere stukken waarvan
      kennisneming geoorloofd is, aan de verdachte, de gewezen verdachte, de gerekwestreerde, de gewezen gerekwestreerde
      of de benadeelde partij, voor zover zij daarbij belang hebben, niet op andere wijze in de behoefte kunnen voorzien
      en niet in staat zijn enig recht te betalen; voor de benadeelde partij geldt dit ook indien deze zich niet in de
      strafzaak voegt.
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel12
  - number: '12.2'
    text: |-
      In de gevallen waarin personen als bedoeld in het eerste lid geen recht verschuldigd zijn, wordt evenmin recht in
      rekening gebracht aan de advocaat of de gemachtigde van deze personen.
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel12
  - number: '12.3'
    text: 'In de overige gevallen kan de griffier een recht berekenen van:'
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel12
  - number: 12.3.a
    text: |-
      € 3,18 per aanvraag voor inzage van en voor het verstrekken van afschriften van en uittreksels en inlichtingen uit
      vonnissen, arresten, registers of andere stukken waarvan kennisneming geoorloofd is, betrekking hebbende op één
      zaak, tenzij de aanvrager recht heeft op kosteloze inzage van of inlichtingen uit de desbetreffende stukken;
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel12
  - number: 12.3.b
    text: |-
      € 0,18 per bladzijde voor afschriften van de onder a vermelde stukken, tenzij ingevolge enig wettelijk voorschrift
      een lager bedrag moet worden berekend; geen recht is verschuldigd, indien op een aanvraag om inzage, afschriften
      of inlichtingen afwijzend moet worden beschikt, omdat geen inzage mag worden verleend, of geen inlichtingen of
      afschriften mogen worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel12
  - number: '12.4'
    text: |-
      De belanghebbende kan tegen een weigering van de griffier tot toepassing van het eerste of tweede lid en
      tegen een beschikking op grond van het derde lid schriftelijk bezwaar indienen bij de voorzieningenrechter
      van het gerecht en, indien het de Hoge Raad betreft, bij de president van de Hoge Raad. De
      [artikelen 10 tot en met 13 van de wet][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002406#Artikel10
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002406
        artikel: '10'
  - number: '12.5'
    text: |-
      Onze Minister van Justitie kan bepalen dat voor een door hem aan te wijzen doel van algemeen belang niet-getekende
      afschriften en uittreksels kunnen worden afgegeven, inzage kan worden verleend en inlichtingen kunnen worden
      verstrekt tegen betaling van een door hem aan te geven lager recht, dan het in het derde lid genoemde, of zonder
      betaling van enig recht.
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel12
  - number: '13'
    text: |-
      Voor het uitbrengen van exploiten ingevolge bijzondere wetten is aan de deurwaarders een vergoeding verschuldigd,
      berekend naar de in het [Besluit tarieven ambtshandelingen gerechtsdeurwaarders][ref1] bepaalde tarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0012638
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012638
  - number: '14.1'
    text: |-
      Tot de in [artikel 2 van de wet][ref1] bedoelde buitengewone, bij en krachtens die wet niet voorziene kosten worden
      gerekend de vergoedingen voor werkzaamheden, verricht door personen ten aanzien van wie in verband met hun verblijf
      in het buitenland wordt afgeweken van de tarieven, genoemd in de [artikelen 2 tot en met 9][ref2] en [11][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002406#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0015481#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0015481#Artikel11
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002406
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0015481
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0015481
        artikel: '11'
        paragraaf: '3'
  - number: '14.2'
    text: |-
      Bij deze niet voorziene kosten komen de reis- en verblijfkosten van deze personen en de kosten wegens tijdverzuim
      en daarmee verband houdende noodzakelijke kosten eveneens voor vergoeding in aanmerking.
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel14
  - number: '15'
    text: De bedragen, genoemd in dit besluit, worden verhoogd met de omzetbelasting die daarover is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel15
  - number: '16'
    text: |-
      Het [Besluit tarieven in strafzaken][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002429
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002429
  - number: '17'
    text: 'Dit besluit wordt aangehaald als: Besluit tarieven in strafzaken 2003.'
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel17
  - number: '22'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0015481/2016-09-01#Artikel22
