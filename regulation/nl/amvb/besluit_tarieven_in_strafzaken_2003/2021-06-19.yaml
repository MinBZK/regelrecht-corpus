  - number: '7'
    text: |-
      De tarieven, genoemd in de [artikelen 2][ref1], [3][ref2] en [6][ref3], worden met de helft verhoogd voor
      werkzaamheden die ingevolge het daartoe strekkende verzoek of de gegeven opdracht moeten worden verricht op:

      a. zaterdag;

      b. zondag;

      c. een in [artikel 3 van de Algemene termijnenwet][ref4] genoemde algemeen erkende feestdag of een bij of krachtens
      dat artikel daarmee gelijkgestelde dag;

      d. op een andere dag, dan omschreven onder a tot en met c, tussen 0.00 en 08.00 uur of tussen 20.00 en 24.00 uur.


