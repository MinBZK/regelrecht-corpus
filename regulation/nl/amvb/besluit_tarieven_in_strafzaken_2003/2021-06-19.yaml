      1 Tot de in [artikel 2 van de wet][ref1] bedoelde buitengewone, bij en krachtens die wet niet voorziene kosten
      worden gerekend de vergoedingen voor werkzaamheden, verricht door personen ten aanzien van wie in verband met
      hun verblijf in het buitenland wordt afgeweken van de tarieven, genoemd in de [artikelen 2 tot en met 9][ref2]
      en [11][ref3].

      2 Bij deze niet voorziene kosten komen de reis- en verblijfkosten van deze personen en de kosten wegens tijdverzuim
      en daarmee verband houdende noodzakelijke kosten eveneens voor vergoeding in aanmerking.


