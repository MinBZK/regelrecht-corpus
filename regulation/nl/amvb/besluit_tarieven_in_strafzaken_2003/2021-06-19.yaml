      1 Voor een lokaliteit, door een gemeente beschikbaar gesteld ingevolge een verzoek als bedoeld in
      [artikel 4 van de wet][ref1] is, indien de vergoeding voor het gebruik in een plaatselijke belastingverordening is
      geregeld, aan de gemeente een vergoeding verschuldigd overeenkomstig die verordening.

      2 In andere gevallen dan bedoeld in het eerste lid wordt de vergoeding berekend naar het plaatselijk gangbare
      tarief. Wanneer dit tarief afhankelijk is gesteld van een indeling naar klassen, dan wordt de vergoeding berekend
      naar het tarief voor de laagste klasse. Bij vergoeding volgens dagtarief is voor beschikbaarstelling gedurende zes
      uur of korter de halve dagprijs, voor meer dan zes uur de hele dagprijs verschuldigd.

      3 Bijkomende kosten kunnen overeenkomstig plaatselijk gebruik worden vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0002406#Artikel4
