  - number: '11'
    text: |-
      1 Het tarief voor vergoedingen wegens reis- en verblijfkosten als bedoeld in [artikel 6 van de wet][ref1] bedraagt,
      indien deze vergoedingen worden verstrekt aan:

      a. personen als bedoeld in [artikel 8, tweede lid][ref2], € 3,12 per retourkilometer;

      b. personen als bedoeld in [artikel 8, derde lid][ref3], ten minste € 0,77 per kilometer;

      c. personen aan wie op grond van [artikel 3, derde lid, sub c, d of e, van de wet][ref4], geen vergoeding
      wegens tijdverzuim toekomt, het tarief, dat is overeengekomen voor de vergoeding van reis- en verblijfskosten
      in het binnenland in de laatstelijk afgesloten collectieve arbeidsovereenkomst voor ambtenaren die krachtens een
      arbeidsovereenkomst met de Staat werkzaam zijn;

      d. personen aan wie werkzaamheden zijn opgedragen die niet van wetenschappelijke of bijzondere aard
      zijn, aan getuigen, aan voogden die wegens een strafzaak tegen een onder hun gezag staande minderjarige
      ingevolge het [Wetboek van Strafvordering][ref5] moeten worden opgeroepen, aan curatoren, bij toepassing van
      [artikel 509d van dat Wetboek][ref6], en aan noodzakelijke geleiders van personen als hiervoor bedoeld, van
      personen aan wie werkzaamheden zijn opgedragen, van verdachten en van gerekwestreerden, een tarief waarvan de
      hoogte gelijk is aan de reiskosten per openbaar middel van vervoer, laagste klasse dan wel een kilometervergoeding
      van € 0,28 per kilometer indien openbaar vervoer niet of niet voldoende mogelijk is, alsmede verblijfkosten tot ten
      hoogste € 37,85 per dag, met inbegrip van overnachting; het tarief voor de vergoeding van het gebruik van een eigen
      auto bedraagt ten hoogste  € 0,28 per kilometer.

      2 Het aantal kilometers, bedoeld in het eerste lid, onder a en b, wordt berekend naar de kortste reisroute.

      3 Voor het gebruik van een bijzonder middel van vervoer in de gevallen, bedoeld in [artikel 7 van de wet][ref7],
      wordt een vergoeding verstrekt, berekend naar de werkelijke kosten.

      4 Vergoeding voor reis- en verblijfkosten wordt niet meer dan eenmaal toegekend, ook al wordt de reis gemaakt ten
      behoeve van verschillende zaken.


