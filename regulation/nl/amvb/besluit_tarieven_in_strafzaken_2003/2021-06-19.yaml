  - number: '6'
    text: |-
      Voor werkzaamheden als bedoeld in [artikel 3, eerste lid, onderdeel a, van de wet][ref1], waarvoor geen speciaal
      tarief is bepaald, geldt, naar gelang de werkzaamheden niet of in meer of mindere mate van wetenschappelijke of
      bijzondere aard zijn, een tarief van ten hoogste € 134,04 per uur, met dien verstande dat:

      a. het tarief voor vergoedingen van verrichtingen van medische aard het door de Nederlandse Zorgautoriteit
      vastgestelde tarief bedraagt;

      b. het tarief voor vergoedingen van verpleging in een zorginstelling het voor deze vergoedingen geldende tarief in
      de laagste klasse bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0002406#Artikel3
