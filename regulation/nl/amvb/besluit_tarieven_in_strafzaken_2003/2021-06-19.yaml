    text: |-
      1 In dit besluit en de daarop rustende bepalingen wordt verstaan onder:

      a. dubbelrapportage: een psychiatrische en psychologische rapportage tezamen;

      b. milieurapportage: rapportage over de leefomgeving van de onderzochte persoon;

      c. monorapportage: een psychiatrische of psychologische rapportage;

      d. tripelrapportage: een dubbelrapportage aangevuld met een milieurapportage;

      e. de wet: de [Wet tarieven in strafzaken][ref1];

      f. ziekenhuisvoorziening: instelling als bedoeld in
      [artikel 1, eerste lid, onderdeel f, van de Wet toelating zorginstellingen][ref2]
      die als zodanig is toegelaten dan wel een academisch ziekenhuis als bedoeld in
      [artikel 1.4 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3].

      2 In dit besluit en de daarop rustende bepalingen is voor hetgeen wordt verstaan onder psychiatrisch ziekenhuis
      en psychiater [artikel 90sexies][ref4], respectievelijk [artikel 90septies van het Wetboek van Strafrecht][ref5]
      van toepassing.


