    text: |-
      1 Het tarief voor de vergoeding van werkzaamheden als bedoeld in
      [artikel 3, eerste lid, onderdeel a, van de wet][ref1], verricht door psychologen, bedraagt, voor het verrichten
      van psychologisch onderzoek, ten hoogste  € 102,88 per uur.

      2 Voor het verrichten van een psychologisch onderzoek als bedoeld in het eerste lid, voor zover deze inhoudt
      het opstellen van een psychologisch rapport over een volwassene, komt ten behoeve van een monorapportage of
      dubbelrapportage ten hoogste vijfentwintig uur en ten behoeve van een tripelrapportage ten hoogste eenendertig uur
      voor vergoeding in aanmerking.

      3 Voor het verrichten van een psychologisch onderzoek als bedoeld in het eerste lid, voor zover deze inhoudt
      het opstellen van een psychologisch rapport over een jeugdige, komt ten behoeve van een monorapportage of
      dubbelrapportage ten hoogste negenentwintig uur en ten behoeve van een tripelrapportage ten hoogste vijfendertig
      uur voor vergoeding in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0002406#Artikel3
