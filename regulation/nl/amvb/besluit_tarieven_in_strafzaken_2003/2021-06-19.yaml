      1 Het tarief voor vergoedingen wegens tijdverzuim als bedoeld in
      [artikel 3, eerste lid, onderdeel b, van de wet][ref1] bedraagt, indien deze vergoedingen worden verstrekt aan:

      a. geneeskundigen, bevoegd tot uitoefening van de praktijk in Nederland, ten hoogste € 134,04 per uur;

      b. psychologen, bevoegd tot uitoefening van de praktijk in Nederland, ten hoogste € 102,88 per uur;

      c. andere personen aan wie werkzaamheden zijn opgedragen, naar gelang de werkzaamheden niet of in meer of mindere
      mate van wetenschappelijke of bijzondere aard zijn, ten hoogste € 134,04 per uur;

      d. getuigen, met uitzondering van minderjarigen die geen inkomsten derven, aan voogden die wegens een strafzaak
      tegen een onder hun gezag staande minderjarige ingevolge het [Wetboek van Strafvordering][ref2] moeten worden
      opgeroepen, aan curatoren, bij toepassing van [artikel 509d van dat Wetboek][ref3], en aan noodzakelijke geleiders
      van personen als hiervoor bedoeld, van personen aan wie werkzaamheden zijn opgedragen, van verdachten en van
      gerekwestreerden, € 6,81 per uur.

      2 De in het eerste lid bedoelde vergoeding komt voor de tijd, besteed aan de reis, niet toe aan geneeskundigen,
      psychologen en andere personen aan wie werkzaamheden zijn opgedragen van wetenschappelijke of bijzondere aard.

      3 De in het eerste lid bedoelde vergoeding komt niet toe aan tolken en vertalers.

      4 Indien vergoeding wordt toegekend voor een plaatsvervanger, wordt de voor tijdverzuim toe te kennen vergoeding
      daarop in mindering gebracht.


