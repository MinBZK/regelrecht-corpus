      1 Het tarief voor de vergoeding van werkzaamheden als bedoeld in
      [artikel 3, eerste lid, onderdeel a, van de wet][ref1], verricht door geneeskundigen, bedraagt, voor het verrichten
      van:

      a. psychiatrisch onderzoek, ten hoogste € 134,04 per uur;

      b. onderzoek van iemand die gestoord is in zijn geestvermogens en afgifte van een verklaring, benodigd voor
      gedwongen opneming van de patiënt in een psychiatrisch ziekenhuis, ten hoogste € 134,04;

      c. onderzoek en afgifte van een verklaring omtrent de conclusies van een onderzoek als bedoeld onder b door een
      controlerend geneeskundige of een rayonarts, € 13,16 respectievelijk, indien het onderzoek met spoed moet worden
      verricht, € 25,87.

      2 Voor het verrichten van een psychiatrisch onderzoek als bedoeld in het eerste lid, onder a, voor zover deze
      inhoudt het opstellen van een psychiatrisch rapport over een volwassene, komt ten behoeve van een monorapportage of
      dubbelrapportage ten hoogste drieëntwintig uur en ten behoeve van een tripelrapportage ten hoogste dertig uur voor
      vergoeding in aanmerking.

      3 Voor het verrichten van een psychiatrisch onderzoek als bedoeld in het eerste lid, onder a, voor zover deze
      inhoudt het opstellen van een psychiatrisch rapport over een jeugdige, komt ten behoeve van een monorapportage of
      dubbelrapportage ten hoogste zevenentwintig uur en ten behoeve van een tripelrapportage ten hoogste vierendertig
      uur voor vergoeding in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0002406#Artikel3
    url: https://wetten.overheid.nl/BWBR0015481/2021-06-19#Artikel2
