  - number: '12'
    text: |-
      1 Behalve voor de gevallen, bedoeld in [artikel 17, tweede lid, van de wet][ref1], wordt evenmin recht geheven
      voor:

      a. het geven van inzage in vonnissen, arresten, registers of andere stukken waarvan kennisneming geoorloofd is,
      of voor het verstrekken van inlichtingen aan de verdachte, de gewezen verdachte, gerekwestreerde, de gewezen
      gerekwestreerde, de benadeelde partij; voor de benadeelde partij geldt dit ook indien deze zich niet in de
      strafzaak voegt, echter slechts ingeval hij belang heeft bij de gewenste gegevens en hij niet in staat is enig
      recht te betalen;

      b. het verstrekken van afschriften van of uittreksels uit vonnissen, arresten, registers of andere stukken waarvan
      kennisneming geoorloofd is, aan de verdachte, de gewezen verdachte, de gerekwestreerde, de gewezen gerekwestreerde
      of de benadeelde partij, voor zover zij daarbij belang hebben, niet op andere wijze in de behoefte kunnen voorzien
      en niet in staat zijn enig recht te betalen; voor de benadeelde partij geldt dit ook indien deze zich niet in de
      strafzaak voegt.

      2 In de gevallen waarin personen als bedoeld in het eerste lid geen recht verschuldigd zijn, wordt evenmin recht in
      rekening gebracht aan de advocaat of de gemachtigde van deze personen.

      3 In de overige gevallen kan de griffier een recht berekenen van:

      a. € 3,18 per aanvraag voor inzage van en voor het verstrekken van afschriften van en uittreksels en inlichtingen
      uit vonnissen, arresten, registers of andere stukken waarvan kennisneming geoorloofd is, betrekking hebbende op één
      zaak, tenzij de aanvrager recht heeft op kosteloze inzage van of inlichtingen uit de desbetreffende stukken;

      b. € 0,18 per bladzijde voor afschriften van de onder a vermelde stukken, tenzij ingevolge enig wettelijk
      voorschrift een lager bedrag moet worden berekend; geen recht is verschuldigd, indien op een aanvraag om inzage,
      afschriften of inlichtingen afwijzend moet worden beschikt, omdat geen inzage mag worden verleend, of geen
      inlichtingen of afschriften mogen worden verstrekt.

      4 De belanghebbende kan tegen een weigering van de griffier tot toepassing van het eerste of tweede lid en
      tegen een beschikking op grond van het derde lid schriftelijk bezwaar indienen bij de voorzieningenrechter
      van het gerecht en, indien het de Hoge Raad betreft, bij de president van de Hoge Raad. De
      [artikelen 10 tot en met 13 van de wet][ref2] zijn van overeenkomstige toepassing.

      5 Onze Minister van Justitie kan bepalen dat voor een door hem aan te wijzen doel van algemeen belang niet-
      getekende afschriften en uittreksels kunnen worden afgegeven, inzage kan worden verleend en inlichtingen kunnen
      worden verstrekt tegen betaling van een door hem aan te geven lager recht, dan het in het derde lid genoemde, of
      zonder betaling van enig recht.


      [ref1]: https://wetten.overheid.nl/BWBR0002406#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002406#Artikel10
