      1 Voor de vaststelling van de uurvergoeding als bedoeld in de [artikelen 2][ref1], [3][ref2], [6][ref3],
      [7][ref4] en [8][ref5] geldt een gedeelte van een uur gelijk aan een half uur of korter, als een half uur, en een
      gedeelte langer dan een half uur als een heel uur.

      2 Voor tijdverzuim als bedoeld in [artikel 8][ref6] is per dag een vergoeding verschuldigd voor ten hoogste negen
      uur.


