  - number: 14b
    text: |-
      1 Degenen, bedoeld in [artikel 14, eerste lid][ref1], en [artikel 14a, eerste lid][ref2], zijn verplicht
      aan het orgaan dat met de premie-inhouding en -afdracht is belast, aan het ziekenfonds, bedoeld in
      [artikel 14, vierde lid, onder b][ref3], laatste volzin, en onder c, en in [artikel 14a, derde lid][ref4], en
      aan degene bedoeld in [artikel 14, zesde lid][ref5], alsmede aan de door hen gemachtigde personen, alle gevraagde
      inlichtingen te verstrekken en inzage te geven in alle boeken en bescheiden, voor zover deze zulks voor de
      beoordeling van de verzekeringsplicht en de vaststelling van de premie nodig achten.

      2 Degenen, bedoeld in [artikel 14, eerste lid][ref6], en [artikel 14a][ref7], zijn verplicht het
      ziekenfonds, bedoeld in [artikel 14, vierde lid, onder b][ref8], laatste volzin, en onder c, en in
      [artikel 14a, derde lid][ref9], en degene bedoeld in [artikel 14, zesde lid][ref10], tijdig in te lichten over
      wijzigingen in de inkomsten, welke van belang zijn voor de premieheffing door het ziekenfonds.

      3 Overtreding van het eerste en tweede lid wordt aangeduid als een strafbaar feit als bedoeld in
      [artikel 84 van de Ziekenfondswet][ref11].


