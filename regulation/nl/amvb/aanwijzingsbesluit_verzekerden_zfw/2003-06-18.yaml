  - number: '15'
    text: |-
      1 Verzekerd is voorts, met inachtneming van het bepaalde in het tweede lid, en voor zover de betrokkene de leeftijd
      van 65 jaar nog niet heeft bereikt en zijn woonplaats hier te lande heeft:

      a.

      b.

      c.

      d.

      e. degene, die een rente of uitkering ontvangt op grond van het bepaalde in artikel 14 van de Liquidatiewet
      ongevallenwetten;

      f. degene, die krachtens arbeidsovereenkomst naar burgerlijk recht in dienst is geweest van een publiekrechtelijk
      lichaam en wegens ziekte of ongeval, in verband met deze dienstbetrekking ontstaan, een uitkering op de voet van de
      bepalingen van de Ongevallenwet 1921 ontvangt, welke is berekend naar een verlies van geschiktheid tot werken van
      50% of meer;

      g. de weduwe en de wezen van de onder *f* bedoelde personen, die op grond van het overlijden van de betrokkene,
      tengevolge van de ziekte of het ongeval, een uitkering op de voet van de bepalingen van de Ongevallenwet 1921
      ontvangen.

      2 Het eerste lid, onder e-g, is met inachtneming van het bepaalde bij het derde lid slechts van toepassing op
      degene, die op de dag voorafgaande aan het in werking treden van dit besluit verplicht-verzekerd was ingevolge het
      Ziekenfondsenbesluit op grond van zijn aanspraak op een rente, uitkering onderscheidenlijk pensioen als genoemd in
      het eerste lid, onder e-g, voor de duur van deze aanspraak, mits hij bij het in werking treden van dit besluit niet
      krachtens enige andere bepaling verplicht-verzekerd is overeenkomstig het bepaalde in de [Ziekenfondswet][ref1] en
      tot aan het tijdstip, waarop hij krachtens enige andere bepaling verzekerd wordt overeenkomstig het bepaalde in de
      [Ziekenfondswet][ref2] of van de verzekering wordt uitgezonderd wegens toepassing van de inkomensgrens bedoeld in
      het tweede lid van [artikel 3 van de Ziekenfondswet][ref3], dan wel het bepaalde in het derde lid op hem toepassing
      vindt.

      3 Het eerste lid is niet van toepassing op degene, die krachtens een arbeidsverhouding deelnemer is aan een door
      Onze Minister en Onze Minister van Binnenlandse Zaken aan te wijzen publiekrechtelijke ziektekostenregeling voor
      ambtenaren en die aan deze ziektekostenregeling recht kan ontlenen op geneeskundige verzorging of op een vergoeding
      van kosten van geneeskundige verzorging.


