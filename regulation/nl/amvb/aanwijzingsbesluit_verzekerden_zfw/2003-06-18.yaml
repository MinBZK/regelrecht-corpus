  - number: 12a
    text: |-
      1 Voor de verzekering op grond van de arbeidsongeschiktheidsuitkering krachtens de Wet
      arbeidsongeschiktheidsverzekering zelfstandigen dan wel de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten
      van degenen, bedoeld in [artikel 3, eerste lid, onder b, van de Ziekenfondswet][ref1], alsmede voor de verzekering
      van degenen, bedoeld in [artikel 1, onder ][ref2], wordt van de uit te betalen arbeidsongeschiktheidsuitkering
      welke de verzekerde heeft genoten in het tijdvak waarover de betaling loopt, een premie geheven tot het krachtens
      [artikel 15, eerste lid, van de Ziekenfondswet][ref3] vastgestelde percentage.

      2 Voor de toepassing van het eerste lid worden mede als uit te betalen arbeidsongeschiktheidsuitkering aangemerkt
      de vakantie-uitkering, bedoeld in [artikel 26 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref4]
      en [artikel 22 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref5], de toelage, bedoeld
      in artikel 58, eerste en derde lid, van de Algemene Arbeidsongeschiktheidswet, de toeslag op grond van de
      [Toeslagenwet][ref6], alsmede het bedrag, waarmee de arbeidsongeschiktheidsuitkering of genoemde vakantie-
      uitkering wordt beperkt in verband met samenloop met een uitkering op grond van de sociale wetgeving van een andere
      Mogendheid.

      3 Voor de toepassing van dit artikel is het bepaalde krachtens [artikel 15, tweede lid, van de Ziekenfondswet][ref7]
      van overeenkomstige toepassing, waarbij het orgaan dat de arbeidsongeschiktheidsuitkering doet als werkgever wordt
      beschouwd.

      4 Voor de toepassing van dit artikel is artikel 9, tweede en tiende lid, van de Coördinatiewet Sociale Verzekering
      van overeenkomstige toepassing.

      Voor een verzekerde die tevens verzekerd is krachtens [artikel 3, eerste lid, onder ][ref8], uit hoofde
      van een arbeidsongeschiktheidsuitkering op grond van een verplichte verzekering ingevolge de Wet op de
      arbeidsongeschiktheidsverzekering, worden voor de toepassing van de vorige volzin de uitkeringen, bedoeld in dit
      artikel, samengeteld.

      5 Het orgaan dat de arbeidsongeschiktheidsuitkering doet, houdt de door de verzekerde ingevolge dit artikel
      verschuldigde premie in op de uitkering.

      6 Het in het vijfde lid bedoelde orgaan stort de in het eerste lid bedoelde premie in de Algemene Kas, bedoeld in
      [artikel 1q van de Ziekenfondswet][ref9]. Onze Minister kan voorschriften geven met betrekking tot de vaststelling,
      de invordering, de afdracht en de verantwoording van de premie.

      7 Voor de toepassing van het eerste lid wordt ten aanzien van degene die naast een arbeidsongeschiktheidsuitkering
      ingevolge de sociale wetgeving van een andere Mogendheid met toepassing van [Verordening (EEG) nr. 1408/71]
      (31971R1408) van de Raad van 14 juni 1971 betreffende de toepassing van de sociale zekerheidsregelingen op
      werknemers en zelfstandigen, alsmede op hun gezinsleden, die zich binnen de Gemeenschap verplaatsen (PbEG
      L 149), of een door Nederland met een of meer andere staten gesloten verdrag inzake sociale zekerheid een
      aanvullende uitkering ingevolge de[ Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref10] ontvangt,
      de som van de uitkering ingevolge de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref11] en de
      arbeidsongeschiktheidsuitkering ingevolge de sociale wetgeving van die andere Mogendheid als grondslag voor de
      berekening van de verschuldigde ziekenfondspremie aangemerkt.


