        artikel: '4'
  - number: '5'
    text: |-
      1 Voor de verzekering van degenen, bedoeld in [artikel 15e][ref1], wordt van de uitkering en het wachtgeld, welke
      de verzekerden hebben genoten in het tijdvak, waarover de betaling loopt, een premie geheven tot het krachtens
      het eerste lid van [artikel 15 van de Ziekenfondswet][ref2] vastgestelde percentage. Daarbij wordt in voorkomend
      geval mede als uitkering of wachtgeld aangemerkt de toeslag ingevolge artikel 9 van de Wet van 20 december 1984,
      houdende aanpassing van uitkeringspercentages van ontslaguitkerings- en arbeidsongeschiktheidsregelingen voor
      overheidspersoneel, onderwijspersoneel en daarmee gelijk te stellen personeel (*Stb.* 657).

      2 Voor de toepassing van dit artikel is het bepaalde krachtens [artikel 15, tweede lid, van de Ziekenfondswet][ref3]
      alsmede het bepaalde in het derde, vierde en vijfde lid van dat artikel van overeenkomstige toepassing, waarbij het
      orgaan, dat de uitkering of het wachtgeld verleent, als werkgever wordt beschouwd en de uitkering en het wachtgeld
      als loon worden aangemerkt.

      Artikel 9, tweede lid, van de Coördinatiewet Sociale Verzekering is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel15e
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel15
