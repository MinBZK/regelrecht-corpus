        artikel: 1q
  - number: '3'
    text: |-
      1 Degene, tot wie een of meer personen bedoeld in [artikel 1, onder ii, onderdeel 1][ref1] of 2, en jj, onderdeel
      1, in dienstbetrekking staan, wordt mede voor de toepassing van [artikel 5 van de Ziekenfondswet][ref2] beschouwd
      als werkgever. Het bepaalde bij of krachtens de [artikelen 10][ref3] en [12 van de Ziektewet][ref4] is van
      overeenkomstige toepassing.

      2 Degene, die belast is met de uitkering van wachtgeld, rente, pensioen of enige andere uitkering
      als bedoeld in de [artikelen 1][ref5], [15][ref6], en [15][ref7], wordt mede voor de toepassing van
      [artikel 5 van de Ziekenfondswet][ref8] beschouwd als werkgever van degene, aan wie het wachtgeld, de rente, het
      pensioen of enige andere uitkering als vorenbedoeld is toegekend.

      3 Degene die belast is met de uitkering van pensioen of enige uitkering aan de persoon, bedoeld in
      [artikel 3, eerste lid, onder b en c, van de Ziekenfondswet][ref9], wordt, voor zover deze met de inhouding van
      ziekenfondspremie is belast, mede voor de toepassing van [artikel 5 van de Ziekenfondswet][ref10] beschouwd als
      werkgever van degene, aan wie het pensioen of de uitkering, als vorenbedoeld, is toegekend.

      4 Degene die aan de persoon, bedoeld in [artikel 1, onder y][ref11], een uitkering weigert, wordt voor de
      toepassing van [artikel 5 van de Ziekenfondswet][ref12] als diens werkgever beschouwd.


