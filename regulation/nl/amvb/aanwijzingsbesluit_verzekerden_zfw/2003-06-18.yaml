      1 Voor de verzekering van verzekerden als bedoeld in de [artikelen 1, onder x, onderdeel 1, en onder][ref1]
      aa, ff en 15c, eerste lid, wordt van de uitkering onderscheidenlijk vergoeding, herleid tot een bruto-
      bedrag, die zij hebben genoten in het tijdvak waarover de betaling loopt, een premie geheven tot het krachtens
      [artikel 15, eerste lid, van de Ziekenfondswet][ref2] vastgestelde percentage.

      2 Het bepaalde krachtens [artikel 15][ref3], tweede lid, en
      [artikel 15, derde, vierde en vijfde lid, van de Ziekenfondswet][ref4] zijn van overeenkomstige toepassing. Het
      orgaan dat de uitkering doet, wordt als werkgever beschouwd en de uitkering wordt als loon aangemerkt.

      3 Onze Minister kan voorschriften geven met betrekking tot de vaststelling, de invordering, de afdracht en de
      verantwoording van de premie.

      4 De ingevolge het eerste lid afgedragen premie kan niet worden teruggevorderd indien de in de vorm van een
      geldlening als bedoeld in artikel 20 van de Algemene bijstandswet verstrekte bijstand wordt afgelost.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel1
