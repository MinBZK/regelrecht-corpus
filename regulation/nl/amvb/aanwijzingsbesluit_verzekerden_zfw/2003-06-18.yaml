    text: |-
      1 Voor de verzekering van degenen bedoeld in de [artikelen 1, onder x, onderdeel 2][ref1], en
      [15c, tweede lid][ref2], is door de werkgever een door Onze Minister vast te stellen premie verschuldigd, welke
      wordt gebaseerd op de landelijk gemiddelde jaarlijkse kosten van een ziekenfondsverzekerde.

      2 Voor de toepassing van dit artikel is [artikel 15, derde en vijfde lid, van de Ziekenfondswet][ref3] van
      overeenkomstige toepassing.

      3 Onze Minister kan voorschriften geven met betrekking tot de invordering, de afdracht en de verantwoording van
      de premie.


