      1 De verzekerde, bedoeld in [artikel 1, onder q][ref1], is premie verschuldigd overeenkomstig het in
      [artikel 15a, eerste lid, van de Ziekenfondswet][ref2] vastgestelde percentage over het inkomen, bedoeld in
      [artikel 3d, vierde lid, van de Ziekenfondswet][ref3].

      2 Voor de toepassing van het eerste lid wordt ten aanzien van degene die krachtens [artikel 1, onder q][ref4],
      verzekerd is en die tevens ingevolge [artikel 3 van de Ziekenfondswet][ref5] verzekerd is, de reeds uit hoofde van
      [artikel 15, eerste lid][ref6], betaalde procentuele premie in mindering gebracht tot maximaal de ingevolge het
      eerste lid verschuldigde premie.

      3 [Artikel 15a, tweede, derde en vijfde lid, van de Ziekenfondswet][ref7] is van overeenkomstige toepassing.

      4 De ontvanger van de rijksbelastingdienst stort de ingevolge dit artikel ontvangen bedragen in de Algemene Kas,
      bedoeld in [artikel 1q van de Ziekenfondswet][ref8].

      5 [Artikel 15b, tweede lid, van de Ziekenfondswet][ref9] is van overeenkomstige toepassing.


