  - number: '7'
    text: |-
      1 Een verzekerde als bedoeld in [artikel 1, onder ][ref1], is naast de jaarlijkse nominale premie, bedoeld in
      [artikel 16][ref2], een premie verschuldigd die op een door Onze Minister en Onze Minister van Sociale Zaken en
      Werkgelegenheid tezamen te bepalen bedrag wordt vastgesteld.

      2 De in het eerste lid bedoelde premie wordt bij de verzekerde geïnd door het ziekenfonds waarbij hij staat
      ingeschreven.

      3 Als werkgever wordt beschouwd de werkgever bij wie de verzekerde, bedoeld in het eerste lid, op de datum van
      aanvang van het onbetaald verlof in dienstbetrekking was.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002516#Artikel16a
