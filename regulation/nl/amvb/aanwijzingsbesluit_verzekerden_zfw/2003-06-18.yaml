    text: |-
      Verzekerd is degene die hier te lande woonachtig is en die op 31 december
      2002 verzekerd was op grond van [artikel 1, onderdeel f][ref1], zoals genoemde
      bepaling op 31 december 2002 luidde, indien hij ingevolge de toepassing van
      [artikel 36, vijfde en zesde lid, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref2]
      geen recht verkrijgt op een uitkering krachtens de [Werkloosheidswet][ref3] op grond van
      [artikel 31 van de Wet overheidspersoneel onder de werknemersverzekeringen][ref4], voor zolang betrokkene de in
      [artikel 1, onderdeel f][ref5], bedoelde uitkering of wachtgeld ter zake van werkloosheid of ontslag of een daarmee
      gelijkgestelde uitkering ontvangt.


