    text: |-
      1 Voor de verzekering van verzekerden als bedoeld in [artikel 1, onder r][ref1], wordt van het uit te betalen
      pensioen een premie geheven tot het krachtens [artikel 15, eerste lid, van de Ziekenfondswet][ref2] vastgestelde
      percentage.

      2 Voor de toepassing van het eerste lid wordt mede als uit te betalen pensioen aangemerkt:

      a. de bestanddelen van het pensioen ingevolge de bij of krachtens de [Kaderwet militaire pensioenen][ref3]
      vastgestelde bepalingen ter zake van ziekten of gebreken, de invaliditeitsverhoging, de bijzondere
      invaliditeitsverhoging, de tropenverhoging, de overlijdensuitkering, de aanpassing aan algemene
      bezoldigingswijzigingen en de toeslag op het pensioen ter zake van ziekten of gebreken beneden de leeftijd van
      65 jaar;

      b. de toeslag, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      _________.

      3 Het bepaalde krachtens [artikel 15, tweede lid, van de Ziekenfondswet][ref5] en
      [artikel 9, tweede lid, van de Coördinatiewet Sociale Verzekering][ref6] zijn van overeenkomstige toepassing. Onze
      Minister van Defensie wordt als werkgever beschouwd en het pensioen wordt als loon aangemerkt.

      4 Onze Minister van Defensie houdt de door de verzekerde ingevolge dit artikel verschuldigde premie in op het
      pensioen.

      5 De in het vierde lid bedoelde minister stort de in het eerste lid bedoelde premie in de Algemene Kas, bedoeld in
      [artikel 1q van de Ziekenfondswet][ref7]. Onze Minister en Onze Minister van Defensie tezamen kunnen voorschriften
      geven met betrekking tot de vaststelling, de invordering, de afdracht en de verantwoording van de premie.


