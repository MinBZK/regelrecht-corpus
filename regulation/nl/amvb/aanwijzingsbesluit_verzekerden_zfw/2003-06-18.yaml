  - number: '14'
    text: |-
      1 Degenen, bedoeld in de [artikelen 1, onder bb, hh, ii, onderdeel 3, jj, onderdeel 2, kk, onderdeel 2][ref1],
      [15b][ref2] en [15c, derde lid][ref3], en in [artikel 3, eerste lid, onder c][ref4], en in
      [artikel 3c van de Ziekenfondswet][ref5], zijn een premie verschuldigd over het ouderdomspensioen, de toeslag en
      de vakantie-uitkering, waarop zij aanspraak hebben krachtens de [Algemene Ouderdomswet][ref6], alsmede over hun
      inkomsten uit of in verband met het verrichten van arbeid in het bedrijfs- en beroepsleven. Onze Minister bepaalt
      welke inkomsten worden beschouwd als inkomsten uit of in verband met het verrichten van arbeid in het bedrijfs-
      en beroepsleven.

      2 Over het ouderdomspensioen, de toeslag en de vakantie-uitkering waarop de verzekerde aanspraak heeft krachtens
      de Algemene Ouderdomswet, is een premie verschuldigd tot een door Onze Minister en Onze Minister van Sociale Zaken
      en Werkgelegenheid tezamen te bepalen percentage. De premie wordt per maand berekend over het ouderdomspensioen
      en de toeslag, met inbegrip van de vakantie-uitkering. Geen premie is verschuldigd over de overlijdensuitkering,
      bedoeld in artikel 18 van de Algemene Ouderdomswet, en de vakantie-uitkering, bedoeld in artikel 32 in verbinding
      met artikel 18, van die wet.

      3 Over de inkomsten van de verzekerde uit of in verband met het verrichten van arbeid in het bedrijfs-
      of beroepsleven wordt een premie geheven tot een door Onze Minister en Onze Minister van Sociale Zaken en
      Werkgelegenheid te zamen te bepalen percentage.

      4 Voor de verzekering van degenen, bedoeld in de
      [artikelen 1, onder bb, hh, ii, onderdeel 3, jj, onderdeel 2, kk, onderdeel 2][ref7],
      [15b][ref8] en [15c, derde lid][ref9], en in [artikel 3, eerste lid, onder c][ref10], en in
      [artikel 3c van de Ziekenfondswet][ref11], wordt

      a. de in het tweede lid bedoelde premie door de Sociale verzekeringsbank dan wel, indien uitbetaling van de in het
      tweede lid bedoelde uitkering ingevolge de Algemene Ouderdomswet met toepassing van artikel 19, vijfde lid, van
      die wet plaatsvindt door een pensioeninstelling, die pensioeninstelling, ingehouden op het ouderdomspensioen en de
      toeslag waarop de verzekerde aanspraak heeft krachtens de Algemene Ouderdomswet, welke organen de premie storten
      in de Algemene Kas, bedoeld in [artikel 1q van de Ziekenfondswet][ref12]. Onze Minister kan in afwijking hiervan
      bepalen dat in door hem vast te stellen gevallen tot een door hem vast te stellen tijdstip de inning van de hier
      bedoelde ziekenfondspremie geschiedt op de wijze, bedoeld onder c;

      b. de in het derde lid bedoelde premie op de inkomsten uit of in verband met het verrichten van arbeid in het
      bedrijfs- en beroepsleven, voor zover die inkomsten bestaan uit door Onze Minister aan te wijzen uitkeringen,
      ingehouden door het orgaan dat die uitkeringen betaalbaar stelt, welk orgaan de premie stort in de Algemene
      Kas, bedoeld in [artikel 1q van de Ziekenfondswet][ref13]; Onze Minister kan in afwijking hiervan bepalen dat
      in door hem vast te stellen gevallen tot een door hem vast te stellen tijdstip de inning van de hier bedoelde
      ziekenfondspremie geschiedt op de wijze, bedoeld onder c;

      c. de premie over alle overige inkomsten waarover premie verschuldigd is, bij de verzekerde geïnd door het
      ziekenfonds waarbij de verzekerde staat ingeschreven.

      5

      6 Indien de verzekerde, bedoeld in het eerste lid, niet bij een ziekenfonds staat ingeschreven wordt de premie
      geïnd door het ziekenfonds waarbij de verzekerde laatstelijk was ingeschreven. Indien de eerste volzin niet van
      toepassing is of de woonplaats van verzekerde is gewijzigd dan wordt de premie geïnd door het ziekenfonds waarbij
      de verzekerde zich bij of krachtens [artikel 5, eerste lid, van de Ziekenfondswet][ref14] dient aan te melden.

      7 Voor de toepassing van dit artikel is van overeenkomstige toepassing artikel 9, tweede lid, van de Coördinatiewet
      Sociale Verzekering.

      8 Onze Minister kan aan de in het vierde lid, onder *b*, bedoelde organen verplichtingen opleggen en voorschriften
      geven met betrekking tot de vaststelling, de invordering, de afdracht en de verantwoording van de premie.

      9 Voor de toepassing van dit artikel wordt ten aanzien van de verzekerde die een ouderdomspensioen ingevolge
      de Algemene Ouderdomswet geniet en daarnaast een uitkering ontvangt ingevolge de sociale wetgeving van een
      andere mogendheid in verband waarmee genoemd ouderdomspensioen is gekort, die uitkering gelijkgesteld met een
      ouderdomspensioen ingevolge de Algemene Ouderdomswet, voor zover bedoelde uitkering de vorenbedoelde op het
      ouderdomspensioen toegepaste korting niet te boven gaat. Indien het een gehuwde pensioengerechtigde betreft wordt
      voor de toepassing van de vorige volzin de korting op de toeslag ingevolge artikel 8 van de Algemene Ouderdomswet
      dan wel op het ouderdomspensioen ingevolge de Algemene Ouderdomswet van de huwelijkspartner mede in aanmerking
      genomen.

      10 In afwijking van het vierde lid, onder *b*, wordt de over een uitkering ingevolge de Algemene bijstandswet
      verschuldigde premie, ingehouden door het orgaan dat die uitkering betaalbaar stelt, welk orgaan de premie afdraagt
      aan het Uitvoeringsinstituut werknemersverzekeringen.


