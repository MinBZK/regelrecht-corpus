  - number: 5a
    text: |-
      1 Voor de verzekering van verzekerden als bedoeld in [artikel 1, onder ][ref1], wordt van de uitkering ter
      zake van vervroegde uittreding, de vakantie-uitkering daaronder begrepen, een premie geheven tot het krachtens
      [artikel 15, eerste lid, van de Ziekenfondswet][ref2] vastgestelde percentage.

      2 Bij ministeriële regeling van Onze Minister kan worden bepaald dat bij de premieberekening een daarbij aan te
      geven deel van de uitkering of de vakantie-uitkering buiten beschouwing blijft.

      3 Indien de uitkering niet of slechts ten dele wordt uitbetaald wegens samenloop met andere inkomsten, wordt
      de uitkering voor de toepassing van dit artikel geacht ten volle te worden uitbetaald, tenzij de uitkering niet
      of slechts ten dele wordt uitbetaald wegens samenloop met loon of uitkering waarover reeds krachtens een andere
      bepaling premie voor de ziekenfondsverzekering verschuldigd is.

      4 Voor de toepassing van dit artikel is van overeenkomstige toepassing het bepaalde in artikel 9, tweede lid, van
      de Coördinatiewet Sociale Verzekering.

      5 Het bepaalde krachtens [artikel 15][ref3], tweede lid, en
      [artikel 15, derde, vierde en vijfde lid, van de Ziekenfondswet][ref4] zijn van overeenkomstige toepassing.
      Het orgaan dat de uitkering doet, wordt als werkgever beschouwd en de uitkering wordt als loon aangemerkt.
      In afwijking van [artikel 15, derde en vijfde lid, van de Ziekenfondswet][ref5] stort de Stichting fonds
      vrijwillig vervroegd uittreden overheidspersoneel, bedoeld in artikel 11, eerste lid, van de Wet financiële
      voorzieningen privatisering ABP, de in het eerste lid bedoelde premie rechtstreeks in de Algemene Kas, bedoeld in
      [artikel 1q van de Ziekenfondswet][ref6].

      6 Indien de uitkering wordt gedaan door de werkgever bij wie degene, bedoeld in [artikel 1, onder ][ref7], vóór de
      uittreding in dienstbetrekking was, is het vijfde lid van overeenkomstige toepassing.

      7 Onze Minister kan voorschriften geven met betrekking tot de vaststelling, de invordering, de afdracht en de
      verantwoording van de premie.


