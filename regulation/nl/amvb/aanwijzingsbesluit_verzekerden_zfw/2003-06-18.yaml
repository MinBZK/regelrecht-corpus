    text: |-
      1 Voor de verzekering van verzekerden als bedoeld in [artikel 1, onder ][ref1], wordt van
      het pensioen, de vakantie-uitkering daaronder begrepen, een premie geheven tot het krachtens
      [artikel 15, eerste lid, van de Ziekenfondswet][ref2] vastgestelde percentage.

      2 Indien het pensioen slechts ten dele wordt uitbetaald wegens samenloop met wettelijke uitkeringen dan wel in
      verband met samenloop met uitkeringen ingevolge de sociale wetgeving van een andere mogendheid, wordt het pensioen
      voor de toepassing van het eerste lid geacht ten volle te zijn uitbetaald, voor zover over het bedrag van die
      aanspraken niet reeds premie wordt geheven.

      3 Het bepaalde krachtens [artikel 15, tweede lid, van de Ziekenfondswet][ref3] en artikel 9, tweede lid, van de
      Coördinatiewet Sociale Verzekering zijn van overeenkomstige toepassing. Het orgaan dat de pensioenuitkering doet,
      wordt als werkgever beschouwd en het pensioen wordt als loon aangemerkt.

      4 Het orgaan dat de pensioenuitkering doet, houdt de door de verzekerde ingevolge dit artikel verschuldigde premie
      in op het pensioen.

      5 Het in het vierde lid bedoelde orgaan stort de in het eerste lid bedoelde premie in de Algemene Kas, bedoeld in
      [artikel 1q van de Ziekenfondswet][ref4]. Onze Minister kan voorschriften geven met betrekking tot de vaststelling,
      de invordering, de afdracht en de verantwoording van de premie.


