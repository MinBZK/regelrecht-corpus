  - number: 14a
    text: |-
      1 Voor de verzekering van degene die een uitkering geniet ter zake van vervroegde pensionering als bedoeld in
      [artikel 1, onder ][ref1], wordt een premie geheven tot een door Onze Minister en Onze Minister van Sociale Zaken
      en Werkgelegenheid tezamen te bepalen percentage over het gedeelte van de uitkering dat in verband met het bereiken
      van de 65-jarige leeftijd te zijner tijd zal vervallen.

      Over het deel van de uitkering dat het in de vorige volzin bedoelde bedrag te boven gaat wordt een premie geheven
      tot het krachtens [artikel 15, eerste lid, van de Ziekenfondswet][ref2] vastgestelde percentage.

      2 Behoudens nadere, door Onze Minister vast te stellen regelen, wordt de premie berekend over de uitkering, de
      vakantie-uitkering daaronder begrepen.

      3 De in het eerste lid bedoelde premie over de uitkering wordt ingehouden door het orgaan dat
      de uitkering betaalbaar stelt. Bedoeld orgaan stort de premie in de Algemene Kas, bedoeld in
      [artikel 1q van de Ziekenfondswet][ref3]. Onze Minister kan in afwijking hiervan bepalen dat in door hem vast te
      stellen gevallen tot een door hem vast te stellen tijdstip de inning van de hier bedoelde ziekenfondspremie bij de
      verzekerde geschiedt door het ziekenfonds waarbij de verzekerde staat ingeschreven.

      4 Voor de toepassing van dit artikel is artikel 9, tweede lid, van de Coördinatiewet Sociale Verzekering van
      overeenkomstige toepassing.

      5 Onze Minister kan aan het in het derde lid bedoelde orgaan verplichtingen opleggen en voorschriften geven met
      betrekking tot de vaststelling, de invordering, de afdracht en de verantwoording van de premie.


