  - number: 15a
    text: |-
      1 Degenen die:

      a. als overheidswerknemer in de zin van
      [artikel 1, onder l, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref1] een WAO-uitkering
      ontvangen, dan wel;

      b. een pensioen ingevolge de bij of krachtens de [Kaderwet militaire pensioenen][ref2] vastgestelde
      bepalingen genieten, berekend naar een invaliditeit van minder dan 45 % en die op het tijdstip van
      inwerkingtreding van de [Wet op de toegang tot ziektekostenverzekeringen][ref3] verzekerd waren op grond van
      [artikel 1, onder r of w][ref4], zoals die onderdelen tot vorenbedoeld tijdstip luidden, blijven verzekerd onder de
      voorwaarden zoals die op dat tijdstip golden. Met betrekking tot de vaststelling, de invordering en de afdracht van
      de premie zijn de [artikelen 11b][ref5] en [12b][ref6] van overeenkomstige toepassing.

      2 De belanghebbende, bedoeld in [artikel 17, eerste lid, van de Wet privatisering ABP][ref7] die aanspraak
      heeft op het diensttijdpensioen, bedoeld in [artikel 19, eerste lid, van die wet][ref8] doch niet een WAO-
      uitkering als bedoeld in het eerste lid ontvangt, en die op het tijdstip van inwerkingtreding van de Wet op
      de toegang tot de ziektekostenverzekeringen verzekerd was op grond van [artikel 1, onder ][ref9], zoals dat
      onderdeel tot vorenbedoeld tijdstip luidde, blijft verzekerd onder de voorwaarden zoals die op dat tijdstip
      golden. Met betrekking tot de vaststelling, de invordering en de afdracht van de premie is [artikel 12][ref10] van
      overeenkomstige toepassing.

      3 Voor de verzekering van de verzekerden, bedoeld in dit artikel wordt een premie geheven tot het krachtens
      het eerste lid van [artikel 15 van de Ziekenfondswet][ref11] vastgestelde percentage van de uit te betalen
      WAO-uitkering, die in het tijdvak, waarover de betaling loopt, door de verzekerden is genoten. Het bepaalde
      krachtens [artikel 15, tweede lid][ref12], alsmede de [artikelen 15][ref13], derde tot en met vijfde lid, en
      [16 van de Ziekenfondswet][ref14] zijn van toepassing.


