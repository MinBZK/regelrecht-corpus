  - number: 13c
    text: |-
      1 Voor de verzekering van degenen, bedoeld in [artikel 1, onderdeel][ref1] kk, onder 1, wordt over de bruto
      periodieke uitkering waarop de verzekerde aanspraak heeft ingevolge [artikel 4, eerste of vierde lid][ref2],
      of ingevolge [artikel 5 van de Remigratiewet][ref3], een premie geheven tot het krachtens
      [artikel 15, eerste lid, eerste volzin, van de Ziekenfondswet][ref4] vastgestelde percentage. Indien de periodieke
      uitkering slechts ten dele wordt uitbetaald wegens samenloop met wettelijke uitkeringen, wordt de uitkering voor
      de vaststelling van de verschuldigde premie geacht ten volle te zijn uitbetaald, voor zover over het bedrag van die
      andere wettelijke uitkeringen niet reeds premie wordt geheven.

      2 Voor de verzekering van degenen, bedoeld in [artikel 1, onderdeel][ref5] kk, onder 2, wordt over de bruto
      periodieke uitkering waarop de verzekerde aanspraak heeft ingevolge [artikel 4, eerste of vierde lid][ref6],
      of [artikel 5 van de Remigratiewet][ref7], een premie geheven tot het krachtens [artikel 14, tweede lid][ref8],
      vastgestelde percentage. De tweede volzin van het eerste lid is van overeenkomstige toepassing.

      3 Het bepaalde krachtens [artikel 15, tweede en vierde lid, van de Ziekenfondswet][ref9] is van overeenkomstige
      toepassing. De Sociale verzekeringsbank wordt als werkgever beschouwd en de uitkering wordt als loon aangemerkt.

      4 De Sociale verzekeringsbank houdt de voor de verzekerde ingevolge dit artikel verschuldigde premie in op de
      uitkering.

      5 De Sociale verzekeringsbank stort de in het eerste lid bedoelde premie in de Algemene Kas, bedoeld in
      [artikel 1q, eerste lid, van de Ziekenfondswet][ref10]. Onze Minister kan voorschriften geven met betrekking tot de
      vaststelling, de invordering, de afdracht en de verantwoording van de premie.

      6 De ingevolge dit artikel afgedragen premie wordt niet teruggevorderd van de Algemene Kas indien de periodieke
      uitkering, anders dan in verband met overlijden, ten volle wordt teruggevorderd.


