  - number: 3a
    text: |-
      Waar in het vervolg van dit besluit regelen worden gesteld krachtens welke een procentuele premie wordt geheven
      gelden deze regelen onverminderd hetgeen bij of krachtens [artikel 16][ref1] omtrent de daarbedoelde nominale
      premie is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel16a
    url: https://wetten.overheid.nl/BWBR0002516/2003-06-18#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002516
        artikel: 16a
  - number: 3b
    text: |-
      Bij de premieheffing ingevolge dit besluit over uitkeringen en pensioenen niet zijnde loon als bedoeld in
      [artikel 4][ref1], wordt geen premie geheven over:

      a. bedragen die worden ingehouden als verplichte bijdrage ingevolge een pensioenregeling of een regeling voor
      vervroegde uittreding;

      b. eenmalige uitkeringen en verstrekkingen ter zake van overlijden;

      c. uitkeringen en verstrekkingen tot dekking van op de uitkerings- of pensioengerechtigde drukkende kosten ter zake
      van ziekte, invaliditeit en bevalling;

      d. geschenken ter gelegenheid van algemeen erkende feestdagen en het Sint-Nicolaasfeest, een jubileum
      van de inhoudingsplichtige, dan wel de verjaardag en andere persoonlijke feestdagen van de uitkerings- of
      pensioengerechtigde, voor zover de waarde daarvan een bedrag van € 136 per jaar niet overtreft.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel4
