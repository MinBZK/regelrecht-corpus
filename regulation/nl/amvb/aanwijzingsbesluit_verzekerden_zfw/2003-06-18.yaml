  - number: 16a
    text: |-
      1 Onverminderd hetgeen krachtens dit besluit omtrent de procentuele premie is bepaald, wordt voor de verzekering van
      de verzekerde, bedoeld in de [artikelen 1, onder e, g, h, i, j, k, n, q, r, s, t, u, v, x, onderdeel 1, z][ref1],
      aa, bb, ff, hh, ii en jj, kk, 9, 12a, 14, 15, 15a, 15b, 15c, eerste en derde lid, 15d en 15e, van 18 jaar of
      ouder en zijn medeverzekerde, bedoeld in [artikel 4, eerste lid, van de Ziekenfondswet][ref2], een jaarlijkse
      nominale premie geheven. Met betrekking tot deze nominale premie zijn de regelen die bij of krachtens
      [artikel 17, eerste tot en met zesde lid, van de Ziekenfondswet][ref3] zijn gesteld van toepassing.

      2 Onze Minister kan met betrekking tot de in dit artikel bedoelde nominale premie
      verschuldigd voor de verzekering van door hem aan te wijzen groepen van personen die krachtens
      [artikel 3, eerste lid, onder b, c of d, van de Ziekenfondswet][ref4] verzekerd zijn en die naar de omstandigheden
      beoordeeld woonachtig zijn op het grondgebied van een andere Lid-Staat van de Europese Economische Gemeenschap,
      dan wel een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of een staat
      waarmee Nederland een verdrag inzake sociale zekerheid heeft gesloten, andere regelen stellen.


