articles:
  - number: '1'
    text: |-
      Verzekerd is, met inachtneming van het bepaalde in het tweede lid van [artikel 3 van de Ziekenfondswet][ref1]:

      a.

      b.

      c.

      d.

      e. gedurende ten hoogste achttien maanden, degene, die ononderbroken onbetaald verlof in de zin van
      [artikel 1, onderdeel h, van de Ziektewet][ref2] opneemt en direct voorafgaand aan het verlof verzekerd was
      ingevolge de [Ziekenfondswet][ref3]. Als ononderbroken onbetaald verlof worden mede aangemerkt perioden van
      onbetaald verlof die elkaar met een onderbreking van minder dan een maand opvolgen;

      f.

      g. degene, die zijn woonplaats hier te lande heeft en die een uitkering geniet ter zake van vervroegde uittreding
      uit het arbeidsproces, mits hij op de dag, voorafgaande aan die met ingang waarvan de uitkering wordt toegekend,
      verzekerd was op grond van de [Ziekenfondswet][ref4]. Onder een uitkering ter zake van vervroegde uittreding uit
      het arbeidsproces wordt verstaan een uitkering ingevolge een van rijkswege dan wel bij of krachtens collectieve
      arbeidsovereenkomst vastgestelde regeling ter zake van vervroegde uittreding uit het arbeidsproces of een ter zake
      van vervroegde uittreding uit het arbeidsproces getroffen regeling voor personen van 55 jaar of ouder waarbij het
      uitkeringspercentage op ten minste 70% van het laatstgenoten loon is vastgesteld;

      h. degene, die zijn woonplaats hier te lande heeft en de wachtdagen vervult voor de uitkering van ziekengeld op
      grond van [artikel 46 van de Ziektewet][ref5], mits hij op de dag, waarop de verzekering eindigde ter zake waarvan
      artikel 46 toepassing vindt, verzekerd was op grond van de [Ziekenfondswet][ref6];

      i. degene, die zijn woonplaats hier te lande heeft en ziekengeld krachtens
      [Hoofdstuk II van de Wet arbeidsongeschiktheidsvoorziening militairen][ref7] dan wel
      arbeidsongeschiktheidsuitkering krachtens Hoofdstuk III van die wet ontvangt, mits - voor zover de uitkering
      werd toegekend krachtens Hoofdstuk III van genoemde wet - deze werd berekend naar een arbeidsongeschiktheid van
      tenminste 45%;

      j. degene die een uitkering ontvangt ingevolge [artikel 9 van de Wet inkomensvoorziening kunstenaars][ref8];

      k. degene wiens dienstbetrekking is geëindigd anders dan door opzegging met inachtneming van de rechtens geldende
      termijn, en die in verband met de eindiging van die dienstbetrekking recht heeft op inkomsten, indien hij op de dag
      voorafgaande aan die waarop de dienstbetrekking is geëindigd, verzekerd was ingevolge de [Ziekenfondswet][ref9],
      voor de duur van de bij opzegging rechtens geldende termijn;

      l.

      m.

      n. degene, die hier te lande zijn woonplaats heeft en wiens medeverzekering als bedoeld in
      [artikel 4 van de Ziekenfondswet][ref10] een einde heeft gevonden door het overlijden van degene op wiens
      verzekering de medeverzekering steunde, gedurende een aaneengesloten periode van 6 weken te rekenen van de dag af,
      waarop het recht op medeverzekering een einde nam;

      o. degene, die zijn woonplaats hier te lande heeft, in werkelijke militaire dienst is ingevolge de Wet voor het
      reserve-personeel der krijgsmacht 1985 en die langer dan 100 dagen onafgebroken in werkelijke militaire dienst
      is of geacht kan worden te zullen verblijven, mits een of meer personen ingevolge het bepaalde bij of krachtens
      [artikel 4 van de Ziekenfondswet][ref11] op grond van zijn verzekering in aanmerking komen voor medeverzekering;

      p. degene, die behoort tot een of meer door Onze Minister en door Onze Minister van Defensie aan te wijzen groepen
      van personen, die kunnen worden geacht niet langer dan 100 dagen onafgebroken in werkelijke militaire dienst te
      zullen verblijven;

      q. 1. tot de eerste dag van de maand waarin de betrokkene de leeftijd van 65 jaar bereikt, degene
      van 55 jaar of ouder die zijn woonplaats hier te lande heeft en niet langer verzekerd is ingevolge
      [artikel 3, eerste lid, aanhef en onder a, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref12]
      ten gevolge van bedrijfsbeëindiging indien hij op de dag, voorafgaande aan die waarop die
      verzekering ten gevolge van bedrijfsbeëindiging is geëindigd, verzekerd is op grond van
      [artikel 3d, eerste lid, van de Ziekenfondswet][ref13]. Onder bedrijfsbeëindiging wordt verstaan
      het geheel staken van de onderneming en het in verband daarmee eindigen van de verzekering ingevolge
      [artikel 3, eerste lid, aanhef en onder a, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref14].
      De verzekering vangt aan met ingang van de eerste dag van het kalenderjaar volgend op het
      kalenderjaar waarin de verzekering ingevolge [artikel 3d, eerste lid, van de Ziekenfondswet][ref15]
      eindigt. De verzekering eindigt op het tijdstip waarop betrokkene weer verzekerd wordt ingevolge
      [artikel 3, eerste lid, aanhef en onder a, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref16].

      2. Voor de verzekerde, bedoeld in het eerste lid, verstrekt de inspecteur van de rijksbelastingdienst bij voor
      bezwaar vatbare beschikking een verklaring waaruit blijkt dat hij voldoet aan de in het eerste lid bedoelde
      voorwaarden.

      r. tot de eerste dag van de maand waarin de betrokkene de leeftijd van 65 jaar bereikt, degene die zijn woonplaats
      hier te lande heeft en die een pensioen geniet, berekend naar een invaliditeit van tenminste 45%, dat is toegekend
      of geacht wordt te zijn toegekend ingevolge de bij of krachtens de [Kaderwet militaire pensioenen][ref17]
      vastgestelde bepalingen. Onder pensioen wordt ten deze niet verstaan het ingevolge de bij of krachtens de Kaderwet
      militaire pensioenen vastgestelde bepalingen toegekende uitgestelde pensioen of het dienovereenkomstige pensioen
      dat geacht wordt krachtens die wet te zijn toegekend;

      s. degene, die zijn woonplaats hier te lande heeft en wiens verplichte verzekering op grond van de
      [Ziekenfondswet][ref18] is geëindigd, zulks indien hij wacht op toekenning van arbeidsongeschiktheidsuitkering op
      grond van verplichte verzekering ingevolge de Wet op de Arbeidsongeschiktheidsverzekering, mits en voor zolang het
      ziekenfonds waarbij hij staat ingeschreven, het aannemelijk acht dat hem die arbeidsongeschiktheidsuitkering zal
      worden toegekend, doch gedurende ten hoogste 13 weken;

      t. tot de eerste dag van de maand waarin betrokkene de leeftijd van 65 jaar bereikt, degene, die zijn woonplaats
      hier te lande heeft en die een pensioen geniet ten laste van de pensioenkas van de Stichting "Algemeen
      Mijnwerkersfonds van de Steenkolenmijnen in Limburg", mits hij op 31 december 1972 lid was van het Algemeen
      Ziekenfonds van voornoemde Stichting en hij, bij pensionering na laatstgenoemde datum, in aansluiting aan zijn
      actief lidmaatschap van genoemde pensioenkas in het genot van pensioen is gesteld. De in de vorige volzin bedoelde
      gepensioneerde, die op 31 december 1972 op grond van een dienstverhouding buiten het mijnbedrijf als verplicht-
      verzekerde bij een ander ziekenfonds was ingeschreven, wordt niettemin voor de toepassing van de vorige volzin
      geacht op dat tijdstip lid te zijn geweest van voornoemd Algemeen Ziekenfonds;

      u. gedurende de in [artikel 3, tweede lid, onder a, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref19]
      bedoelde wachttijd, degene die, indien hij op de dag, voorafgaande aan die waarop die bepaling op hem van
      toepassing werd, verzekerd was ingevolge de [Ziekenfondswet][ref20];

      v. degene die zijn woonplaats hier te lande heeft en die een toelage ontvangt krachtens artikel 58, eerste of derde
      lid, van de Algemene Arbeidsongeschiktheidswet;

      w. tot de eerste dag van de maand waarin de betrokkene de leeftijd van 65 jaar bereikt, degene, die zijn woonplaats
      hier te lande heeft en die een WAO-uitkering als overheidswerknemer in de zin van artikel 1, onder l, van de Wet
      overheidspersoneel onder de werknemersverzekeringen ontvangt, berekend naar een arbeidsongeschiktheid van ten
      minste 45%;

      x. 1. tot de eerste dag van de maand waarin de betrokkene de leeftijd van 65 jaar bereikt, degene die algemene
      bijstand ontvangt met toepassing van de artikelen 29 of 30 van de Algemene bijstandswet;

      2. tot de eerste dag van de maand waarin de betrokkene de leeftijd van 65 jaar bereikt, degene die algemene
      bijstand ontvangt met toepassing van artikel 31 van de Algemene bijstandswet;.

      y. degene aan wie bijstand door burgemeester en wethouders op grond van artikel 14, eerste lid, van de Algemene
      bijstandswet geheel is geweigerd, gedurende de periode van weigering;

      z. degene die zijn woonplaats hier te lande heeft en die met ingang van een dag, gelegen op of na de dag van
      inwerkingtreding van de Wet op de toegang tot ziektekostenverzekeringen, in het genot is gesteld van een uitkering
      ter zake van vervroegde pensionering en die op de dag, voorafgaande aan die met ingang waarvan de uitkering wordt
      toegekend, verzekerd was op grond van de [Ziekenfondswet][ref21]. Onder een uitkering ter zake van vervroegde
      pensionering wordt verstaan een uitkering ter zake van pensionering voor de 65-jarige leeftijd ingevolge een
      pensioenregeling die ten doel heeft de verzorging van werknemers en gewezen werknemers bij ouderdom;

      aa. tot de eerste dag van de maand waarin de betrokkene de leeftijd van 65 jaar bereikt, degene die zijn woonplaats
      hier te lande heeft en die een uitkering ontvangt krachtens de Wet inkomensvoorziening oudere en gedeeltelijk
      arbeidsongeschikte werkloze werknemers dan wel de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte
      gewezen zelfstandigen;

      bb. degene van 65 jaar of ouder die algemene bijstand ontvangt met toepassing van de
      [artikelen 30 of 31 van de Algemene bijstandswet][ref22];.

      cc.

      dd.

      ee.

      ff. degene, die zijn woonplaats hier te lande heeft, jonger dan 18 jaar is en een financiële bijdrage ontvangt
      op grond van [artikel 3 van de Wet inschakeling werkzoekenden][ref23], voorzover hij uit hoofde daarvan niet als
      werknemer in de zin van de [Ziektewet][ref24] wordt aangemerkt.

      gg.

      hh. vanaf de eerste dag van de maand waarin de betrokkene de leeftijd van 65 jaar bereikt, degene die hier te
      lande woonachtig is en die op de laatste dag van de daaraan voorafgaande maand, op grond van een door Nederland
      met een of meer andere staten gesloten verdrag inzake sociale zekerheid of op grond van een verordening van de Raad
      van de Europese Unie dan wel de Overeenkomst betreffende de Europese Economische Ruimte als gezinslid aanspraak
      kon doen gelden op de in beginsel ten laste van een orgaan van een andere verdragsstaat respectievelijk van een
      andere lidstaat van de Europese Unie dan wel van de Europese Economische Ruimte door een Nederlands ziekenfonds
      te verlenen verstrekkingen, tenzij ingevolge de desbetreffende verdragsbepalingen het recht op medische zorg als
      gezinslid bij het bereiken van de 65-jarige leeftijd niet wordt beëindigd;

      ii. 1. tot de eerste dag van de maand waarin de betrokkene de leeftijd van 65 jaar
      bereikt, de vreemdeling die rechtmatig in Nederland verblijf houdt in de zin van
      [artikel 8, onder f tot en met k, van de Vreemdelingenwet 2000][ref25] en die werknemer
      is in de zin van de [Ziektewet][ref26] en wiens loon niet meer bedraagt dan het in
      [artikel 3, eerste lid, onder a, van de Ziekenfondswet][ref27] genoemde bedrag;

      2. de vreemdeling, bedoeld in het eerste lid blijft verzekerd indien hij uit hoofde van het
      verrichten van arbeid als bedoeld in het eerste lid, recht heeft op betaling van loon als bedoeld in
      [artikel 629, van Boek 7 van het Burgerlijk Wetboek][ref28], of recht heeft op een uitkering op grond van de
      [Ziektewet][ref29], de [Werkloosheidswet][ref30]of de[ Wet op de arbeidsongeschiktheidsverzekering][ref31], alsmede
      indien de arbeid, bedoeld in het eerste lid, tijdelijk is onderbroken als gevolg van betaald verlof, staking of
      uitsluiting;

      3. met ingang van de eerste dag van de maand waarin betrokkene de leeftijd van 65 jaar bereikt, de in het eerste
      onderdeel bedoelde vreemdeling die op de laatste dag van de daaraan voorafgaande maand ingevolge onderdeel 1 of 2
      verzekerd was;

      jj. 1. tot de eerste dag van de maand waarin de betrokkene de leeftijd van 65 jaar bereikt, de in
      Nederland wonende vreemdeling die na rechtmatig in Nederland verblijf te hebben gehouden in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref32]:

        - voor de beëindiging van dit verblijf een aanvraag heeft ingediend om voortgezette toelating, of
        - binnen de termijn, genoemd in [artikel 69, eerste lid, van de Vreemdelingenwet 2000][ref33], of,
      buiten die termijn, in geval [artikel 6.11 van de Algemene wet bestuursrecht][ref34] toepassing heeft
      gevonden, bezwaar heeft gemaakt of beroep heeft ingesteld tegen intrekking van de toelating in de zin van
      [artikel 8, onder a tot en met e en I, van de Vreemdelingenwet 2000][ref35], en

      die op de dag, voorafgaande aan die met ingang waarvan hij niet langer rechtmatig in Nederland verblijf hield in de
      zin van [artikel 8, onder a tot en met e en I, van de Vreemdelingenwet 2000][ref36] verzekerd was op grond van de
      [Ziekenfondswet][ref37], zolang en voor zover betrokkene het loon of de uitkering waarop de ziekenfondsverzekering
      steunde blijft ontvangen.

      2. met ingang van de eerste dag van de maand waarin betrokkene de leeftijd van 65 jaar bereikt, de in het eerste
      onderdeel bedoelde vreemdeling die op de laatste dag van de daaraan voorafgaande maand ingevolge dat onderdeel
      verzekerd was;

      3. de verzekering op grond van onderdeel 1 of 2 eindigt zodra:

      a. onherroepelijk op de aanvraag, het bezwaar of het beroep is beslist, of

      b. de uitzetting van de vreemdeling is gelast, tenzij die uitzetting ingevolge de [Vreemdelingenwet 2000][ref38] of
      op grond van een rechterlijke beslissing achterwege dient te blijven;

      kk. degene die niet in Nederland woont en een periodieke uitkering ontvangt ingevolge
      [artikel 4, eerste of vierde lid][ref39], of [artikel 5 van de Remigratiewet][ref40], indien betrokkene met
      toepassing van een verordening van de Raad van de Europese Unie of een door Nederland met een of meer andere staten
      gesloten verdrag inzake sociale zekerheid, in de staat op het grondgebied waarvan hij woont, recht kan doen gelden
      op verstrekkingen die hem in beginsel worden verleend ten laste van de middelen van de ziekenfondsverzekering en

      1. de leeftijd van 65 jaar nog niet heeft bereikt, dan wel

      2. 65 jaar of ouder is.


