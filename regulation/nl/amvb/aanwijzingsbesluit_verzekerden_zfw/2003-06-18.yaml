    text: |-
      1 [Artikel 1, onder e, k, u][ref1] en bb is niet van toepassing op degene die op grond van enige andere bepaling
      verzekerd ingevolge de [Ziekenfondswet][ref2] is.

      2

      3

      4 [Artikel 1, onder o, p en r][ref3] is niet van toepassing op degene wiens bezoldiging of
      pensioenuitkering, in voorkomend geval met inbegrip van de vergoeding in de zin van de bij of krachtens de
      [Kaderwet militaire pensioenen][ref4] vastgestelde bepalingen wegens het verschuldigd zijn van een premie
      krachtens een algemene pensioenwet en van de toeslag, bedoeld in artikel 10 van de Wet van 20 december 1984,
      houdende aanpassing van uitkeringspercentages van ontslaguitkerings- en arbeidsongeschiktheidsregelingen voor
      overheidspersoneel, onderwijspersoneel en daarmee gelijk te stellen personeel (Stb. 657), meer bedraagt dan het in
      [artikel 3, eerste lid, onder a, van de Ziekenfondswet][ref5] genoemde bedrag per jaar.

      Daarbij wordt het over één of meer gedeelten van een jaar genotene op jaarbasis herleid en wordt tot het einde van
      een kalenderjaar geen rekening gehouden met wijzigingen van de bezoldiging en de uitkering, welke na 1 november van
      het voorafgaande kalenderjaar plaatsvinden of hebben plaatsgevonden.

      5 Het bepaalde in [artikel 1, onder ][ref6], is niet van toepassing op degene, die een pensioen ten laste van
      de pensioenkas van de Stichting "Algemeen Mijnwerkersfonds van de Steenkolenmijnen in Limburg" geniet, indien de
      pensioenuitkering, in voorkomend geval met inbegrip van de vergoeding, bedoeld in artikel 55 van het Reglement
      voor het Algemeen Mijnwerkersfonds van de Steenkolenmijnen in Limburg op jaarbasis meer bedraagt dan het in
      [artikel 3, eerste lid, onder ][ref7] genoemde bedrag. Daarbij wordt tot het einde van een kalenderjaar geen
      rekening gehouden met wijzigingen van de pensioenuitkering, welke na 1 november van het voorafgaande kalenderjaar
      plaatsvinden of hebben plaatsgevonden.

      6 Het bepaalde in [artikel 1, onder ][ref8], is niet van toepassing op:

      a. degene die een toelage ontvangt indien 70% van zijn dagloon ingevolge de Wet op de
      arbeidsongeschiktheidsverzekering dan wel van zijn dagloon krachtens de Wet arbeidsongeschiktheidsvoorziening
      militairen - herleid tot jaarloon - meer bedraagt dan het in [artikel 3, eerste lid, onder ][ref9] genoemde
      bedrag, tenzij hij op de dag, voorafgaande aan die, waarop dit het geval is, verzekerd was op grond van de
      [Ziekenfondswet][ref10]. Hierbij wordt tot het einde van een kalenderjaar geen rekening gehouden met wijzigingen
      van het dagloon, welke na 1 november van het voorafgaande jaar plaatsvinden of hebben plaatsgevonden.

      b. degene die een toelage ontvangt welke minder dan 35% bedraagt van de grondslag, waarnaar de
      arbeidsongeschiktheidsuitkering, waarop hij recht heeft dan wel recht zou hebben, indien hij voor toekenning van
      zulk een uitkering in aanmerking zou komen, is of zou zijn berekend, tenzij hij op de dag voorafgaande aan die met
      ingang waarvan de toelage wordt toegekend verzekerd was op grond van de verplichte verzekering ingevolge de Wet op
      de arbeidsongeschiktheidsverzekering.

      7

      8 [Artikel 1, onder i][ref11], voor zover dit betrekking heeft op degene die een arbeidsongeschiktheidsuitkering
      ontvangt, alsmede onder n, r, t en v, is niet van toepassing op degene die deelneemt dan wel op de dag,
      voorafgaande aan de dag waarop zijn recht op uitkering of pensioen ingaat, deelnam aan een publiekrechtelijke
      ziektekostenregeling voor ambtenaren, bedoeld in artikel 4, zestiende lid, onder b, van de [Ziekenfondswet][ref12].

      9 [Artikel 1, onder g, s, x, z][ref13], aa en bb, is niet van toepassing op degene die deelneemt aan een
      publiekrechtelijke ziektekostenregeling voor ambtenaren, bedoeld in artikel 4, zestiende lid, onder b, van de
      [Ziekenfondswet][ref14].

      10 Onze Minister kan, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, categorieën van
      personen aanwijzen, op wie [artikel 1, onder r][ref15] , niet van toepassing is.

      11 Onze Minister kan, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, categorieën
      van personen, behorende tot de in [artikel 1, onder r][ref16] , bedoelde personen, aanwijzen, die indien zij de
      wens daartoe te kennen geven, niet verzekerd worden ingevolge de [Ziekenfondswet][ref17]. In hetgeen verder met
      betrekking tot de vorige volzin regeling behoeft, wordt voorzien door Onze Minister.

      12 [Artikel 1, onder ][ref18], is niet van toepassing indien de in dat onderdeel bedoelde uitkering ingevolge de
      Algemene bijstandswet betrekking heeft op de premie voor een particuliere ziektekostenverzekering dan wel wordt
      verleend aan een zelfstandige in de zin van de Algemene bijstandswet.

      13 [Artikel 1, onder ][ref19], is niet van toepassing op degene die uitsluitend een uitgesteld vervroegd pensioen
      ontvangt. Onder een uitgesteld vervroegd pensioen wordt verstaan een vervroegd pensioen uit een dienstbetrekking
      die niet onmiddellijk voorafgaande aan de dag van ingang van dat pensioen is geëindigd. Voor de toepassing van de
      vorige volzin wordt de dienstbetrekking geacht voort te duren zolang en voor zover in het tijdvak gelegen tussen de
      beëindiging van de dienstbetrekking en de ingangsdatum van het vervroegde pensioen, in verband met de beëindiging
      van bedoelde dienstbetrekking een uitkering op grond van een sociale verzekeringswet dan wel een uitkering als
      bedoeld in [artikel 1, onder ][ref20] of *aa*, is toegekend.

      14 [Artikel 1, onderdeel][ref21] hh, is niet van toepassing op degene die in het tijdvak van vijf jaar,
      onmiddellijk voorafgaande aan de maand waarin hij de leeftijd van 65 jaar bereikt, minder dan drie jaar verzekerd
      was ingevolge de [Ziekenfondswet][ref22], dan wel rechthebbende op verstrekkingen ingevolge de wettelijke regeling
      van een of meer andere staten waarmee Nederland een verdrag inzake sociale zekerheid heeft gesloten of van een
      of meer andere lidstaten van de Europese Unie dan wel van de Europese Economische Ruimte. Voorzover voor de
      vaststelling van de in de eerste volzin bedoelde periode nodig, worden de tijdvakken gedurende welke betrokkene
      aanspraken had op grond van de in die volzin bedoelde wettelijke regelingen samengeteld, voorzover deze tijdvakken
      niet samenvallen. Onze Minister kan bepalen dat door hem aangewezen categorieën van personen als bedoeld in het
      eerste lid, onder hh, niet behoeven te voldoen aan de in de eerste volzin bedoelde voorwaarde.

      15 [Artikel 1][ref23] is niet van toepassing op degene die recht heeft op medische zorg krachtens een regeling
      van een op grond van [artikel 3, derde lid][ref24], dan wel artikel 13, tweede lid, van het Besluit uitbreiding en
      beperking kring verzekerden volksverzekeringen 1989 aangewezen volkenrechtelijke organisatie.

      16 Het bepaalde in [artikel 1][ref25] is - tenzij anders bepaald - niet van toepassing op degene, die de leeftijd
      van 65 jaar heeft bereikt.

      17 [Artikel 1, onderdeel][ref26] kk, is niet van toepassing op degene die op de dag voor de inwerkingtreding van de
      [Remigratiewet][ref27] is geremigreerd.


