  - number: 10a
    text: |-
      1 Voor de verzekering van verzekerden, bedoeld in [artikel 1, onder j][ref1], wordt van de uitkering, herleid tot
      een bruto-bedrag, die zij hebben genoten in het tijdvak waarover de betaling loopt, een premie geheven tot een door
      Onze Minister en Onze Minister van Sociale Zaken en Werkgelegenheid tezamen te bepalen percentage.

      2 Het bepaalde krachtens [artikel 15, derde en vijfde lid, van de Ziekenfondswet][ref2] is van overeenkomstige
      toepassing. Het orgaan dat de uitkering doet, wordt als werkgever beschouwd en de uitkering wordt als loon
      aangemerkt.

      3 Onze Minister kan voorschriften geven met betrekking tot de vaststelling, de invordering, de afdracht en de
      verantwoording van de premie.

      4 De ingevolge het eerste lid afgedragen premie kan niet worden teruggevorderd indien na de definitieve vaststelling
      van de hoogte van de uitkering, bedoeld in [artikel 10 van de Wet inkomensvoorziening kunstenaars][ref3], de als
      renteloze geldlening verleende uitkering, bedoeld in [artikel 9 van die wet][ref4], geheel of ten dele niet wordt
      omgezet in een bedrag om niet.


