      wonende vreemdeling die na rechtmatig in Nederland verblijf te hebben gehouden in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1]: - voor de beëindiging van dit verblijf
      een aanvraag heeft ingediend om voortgezette toelating, of
        - binnen de termijn, genoemd in [artikel 69, eerste lid, van de Vreemdelingenwet 2000][ref2], of,
      buiten die termijn, in geval [artikel 6.11 van de Algemene wet bestuursrecht][ref3] toepassing heeft
      gevonden, bezwaar heeft gemaakt of beroep heeft ingesteld tegen intrekking van de toelating in de
      zin van [artikel 8, onder a tot en met e en I, van de Vreemdelingenwet 2000][ref4], en die op de dag,
      voorafgaande aan die met ingang waarvan hij niet langer rechtmatig in Nederland verblijf hield in de zin
      van [artikel 8, onder a tot en met e en I, van de Vreemdelingenwet 2000][ref5] verzekerd was op grond van de
      [Ziekenfondswet][ref6], zolang en voor zover betrokkene het loon of de uitkering waarop de ziekenfondsverzekering
