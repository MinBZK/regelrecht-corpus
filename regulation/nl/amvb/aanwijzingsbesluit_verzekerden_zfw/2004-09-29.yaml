  - number: 16a.2
    text: |-
      Onze Minister kan met betrekking tot de in dit artikel bedoelde nominale premie verschuldigd
      voor de verzekering van door hem aan te wijzen groepen van personen die krachtens
      [artikel 3, eerste lid, onder b, c of d, van de Ziekenfondswet][ref1] verzekerd zijn en die naar de omstandigheden
      beoordeeld woonachtig zijn op het grondgebied van een andere Lid-Staat van de Europese Economische Gemeenschap,
      dan wel een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of een staat
      waarmee Nederland een verdrag inzake sociale zekerheid heeft gesloten, andere regelen stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3
