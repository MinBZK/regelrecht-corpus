  - number: 1.t
    text: |-
      tot de eerste dag van de maand waarin betrokkene de leeftijd van 65 jaar bereikt, degene, die zijn woonplaats hier
      te lande heeft en die een pensioen geniet ten laste van de pensioenkas van de Stichting "Algemeen Mijnwerkersfonds
      van de Steenkolenmijnen in Limburg", mits hij op 31 december 1972 lid was van het Algemeen Ziekenfonds van
      voornoemde Stichting en hij, bij pensionering na laatstgenoemde datum, in aansluiting aan zijn actief lidmaatschap
      van genoemde pensioenkas in het genot van pensioen is gesteld. De in de vorige volzin bedoelde gepensioneerde, die
      op 31 december 1972 op grond van een dienstverhouding buiten het mijnbedrijf als verplicht-verzekerde bij een ander
      ziekenfonds was ingeschreven, wordt niettemin voor de toepassing van de vorige volzin geacht op dat tijdstip lid te
      zijn geweest van voornoemd Algemeen Ziekenfonds;
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel1
