        artikel: '5'
      - id: ref4
        bwb_id: BWBR0002516
        artikel: '14'
  - number: 13c.3
    text: |-
      Het bepaalde krachtens [artikel 15, tweede en vierde lid, van de Ziekenfondswet][ref1] is van overeenkomstige
      toepassing. De Sociale verzekeringsbank wordt als werkgever beschouwd en de uitkering wordt als loon aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel15
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel13c
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '15'
  - number: 13c.4
    text: |-
      De Sociale verzekeringsbank houdt de voor de verzekerde ingevolge dit artikel verschuldigde premie in op de
      uitkering.
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel13c
  - number: 13c.5
    text: |-
      De Sociale verzekeringsbank stort de in het eerste lid bedoelde premie in de Algemene Kas, bedoeld in
      [artikel 1q, eerste lid, van de Ziekenfondswet][ref1]. Onze Minister kan voorschriften geven met betrekking tot de
      vaststelling, de invordering, de afdracht en de verantwoording van de premie.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1q
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel13c
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 1q
  - number: 13c.6
    text: |-
      De ingevolge dit artikel afgedragen premie wordt niet teruggevorderd van de Algemene Kas indien de periodieke
      uitkering, anders dan in verband met overlijden, ten volle wordt teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel13c
  - number: '14.1'
    text: |-
      Degenen, bedoeld in de [artikelen 1, onder bb, hh, ii, onderdeel 3, jj, onderdeel 2, kk, onderdeel 2][ref1],
      [15b][ref2] en [15c, derde lid][ref3], en in [artikel 3, eerste lid, onder c][ref4], en in
      [artikel 3c van de Ziekenfondswet][ref5], zijn een premie verschuldigd over het ouderdomspensioen, de toeslag en
      de vakantie-uitkering, waarop zij aanspraak hebben krachtens de [Algemene Ouderdomswet][ref6], alsmede over hun
      inkomsten uit of in verband met het verrichten van arbeid in het bedrijfs- en beroepsleven. Onze Minister bepaalt
      welke inkomsten worden beschouwd als inkomsten uit of in verband met het verrichten van arbeid in het bedrijfs-
      en beroepsleven.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel15b
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel15c
      [ref4]: https://wetten.overheid.nl/BWBR0002460#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0002460#Artikel3c
      [ref6]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002460
        artikel: 15b
      - id: ref3
        bwb_id: BWBR0002460
        artikel: 15c
      - id: ref4
        bwb_id: BWBR0002460
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0002460
        artikel: 3c
      - id: ref6
        bwb_id: BWBR0002221
  - number: '14.2'
    text: |-
      Over het ouderdomspensioen, de toeslag en de vakantie-uitkering waarop de verzekerde aanspraak heeft krachtens de
      Algemene Ouderdomswet, is een premie verschuldigd tot een door Onze Minister en Onze Minister van Sociale Zaken en
      Werkgelegenheid tezamen te bepalen percentage. De premie wordt per maand berekend over het ouderdomspensioen en de
      toeslag, met inbegrip van de vakantie-uitkering. Geen premie is verschuldigd over de overlijdensuitkering, bedoeld
      in artikel 18 van de Algemene Ouderdomswet, en de vakantie-uitkering, bedoeld in artikel 32 in verbinding met
      artikel 18, van die wet.
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel14
  - number: '14.3'
    text: |-
      Over de inkomsten van de verzekerde uit of in verband met het verrichten van arbeid in het bedrijfs- of
      beroepsleven wordt een premie geheven tot een door Onze Minister en Onze Minister van Sociale Zaken en
      Werkgelegenheid te zamen te bepalen percentage.
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel14
  - number: '14.4'
    text: |-
      Voor de verzekering van degenen, bedoeld in de
      [artikelen 1, onder bb, hh, ii, onderdeel 3, jj, onderdeel 2, kk, onderdeel 2][ref1],
      [15b][ref2] en [15c, derde lid][ref3], en in [artikel 3, eerste lid, onder c][ref4], en in
      [artikel 3c van de Ziekenfondswet][ref5], wordt


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel15b
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel15c
      [ref4]: https://wetten.overheid.nl/BWBR0002460#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0002460#Artikel3c
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002460
        artikel: 15b
      - id: ref3
        bwb_id: BWBR0002460
        artikel: 15c
      - id: ref4
        bwb_id: BWBR0002460
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0002460
        artikel: 3c
  - number: 14.4.a
    text: |-
      de in het tweede lid bedoelde premie door de Sociale verzekeringsbank, ingehouden op het ouderdomspensioen en de
      toeslag waarop de verzekerde aanspraak heeft krachtens de Algemene Ouderdomswet, welk orgaan de premie stort in de
      Algemene Kas, bedoeld in [artikel 1q van de Ziekenfondswet][ref1]. Onze Minister kan in afwijking hiervan bepalen
      dat in door hem vast te stellen gevallen tot een door hem vast te stellen tijdstip de inning van de hier bedoelde
      ziekenfondspremie geschiedt op de wijze, bedoeld onder c;


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1q
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 1q
  - number: 14.4.b
    text: |-
      de in het derde lid bedoelde premie op de inkomsten uit of in verband met het verrichten van arbeid in het
      bedrijfs- en beroepsleven, voor zover die inkomsten bestaan uit door Onze Minister aan te wijzen uitkeringen,
      ingehouden door het orgaan dat die uitkeringen betaalbaar stelt, welk orgaan de premie stort in de Algemene Kas,
      bedoeld in [artikel 1q van de Ziekenfondswet][ref1]; Onze Minister kan in afwijking hiervan bepalen dat in door hem
      vast te stellen gevallen tot een door hem vast te stellen tijdstip de inning van de hier bedoelde ziekenfondspremie
      geschiedt op de wijze, bedoeld onder c;


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1q
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 1q
  - number: 14.4.c
    text: |-
      de premie over alle overige inkomsten waarover premie verschuldigd is, bij de verzekerde geïnd door het ziekenfonds
      waarbij de verzekerde staat ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel14
  - number: '14.6'
    text: |-
      Indien de verzekerde, bedoeld in het eerste lid, niet bij een ziekenfonds staat ingeschreven wordt de premie
      geïnd door het ziekenfonds waarbij de verzekerde laatstelijk was ingeschreven. Indien de eerste volzin niet van
      toepassing is of de woonplaats van verzekerde is gewijzigd dan wordt de premie geïnd door het ziekenfonds waarbij
      de verzekerde zich bij of krachtens [artikel 5, eerste lid, van de Ziekenfondswet][ref1] dient aan te melden.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel5
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '5'
  - number: '14.7'
    text: |-
      Voor de toepassing van dit artikel is van overeenkomstige toepassing artikel 9, tweede lid, van de Coördinatiewet
      Sociale Verzekering.
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel14
  - number: '14.8'
    text: |-
      Onze Minister kan aan de in het vierde lid, onder *b*, bedoelde organen verplichtingen opleggen en voorschriften
      geven met betrekking tot de vaststelling, de invordering, de afdracht en de verantwoording van de premie.
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel14
  - number: '14.9'
    text: |-
      Voor de toepassing van dit artikel wordt ten aanzien van de verzekerde die een ouderdomspensioen ingevolge
      de Algemene Ouderdomswet geniet en daarnaast een uitkering ontvangt ingevolge de sociale wetgeving van een
      andere mogendheid in verband waarmee genoemd ouderdomspensioen is gekort, die uitkering gelijkgesteld met een
      ouderdomspensioen ingevolge de Algemene Ouderdomswet, voor zover bedoelde uitkering de vorenbedoelde op het
      ouderdomspensioen toegepaste korting niet te boven gaat. Indien het een gehuwde pensioengerechtigde betreft wordt
      voor de toepassing van de vorige volzin de korting op de toeslag ingevolge artikel 8 van de Algemene Ouderdomswet
      dan wel op het ouderdomspensioen ingevolge de Algemene Ouderdomswet van de huwelijkspartner mede in aanmerking
      genomen.
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel14
  - number: '14.10'
    text: |-
      In afwijking van het vierde lid, onder *b*, wordt de over een uitkering ingevolge de [Wet werk en bijstand][ref1]
      verschuldigde premie, ingehouden door het orgaan dat die uitkering betaalbaar stelt, welk orgaan de premie afdraagt
      aan het Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0015703
  - number: 14a.1
    text: |-
      Voor de verzekering van degene die een uitkering geniet ter zake van vervroegde pensionering als bedoeld in
      [artikel 1, onder ][ref1], wordt een premie geheven tot een door Onze Minister en Onze Minister van Sociale
      Zaken en Werkgelegenheid tezamen te bepalen percentage over het gedeelte van de uitkering dat in verband
      met het bereiken van de 65-jarige leeftijd te zijner tijd zal vervallen. Over het deel van de uitkering
      dat het in de vorige volzin bedoelde bedrag te boven gaat wordt een premie geheven tot het krachtens
      [artikel 15, eerste lid, van de Ziekenfondswet][ref2] vastgestelde percentage.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel15
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0002516
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '15'
  - number: 14a.2
    text: |-
      Behoudens nadere, door Onze Minister vast te stellen regelen, wordt de premie berekend over de uitkering, de
      vakantie-uitkering daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel14a
  - number: 14a.3
    text: |-
      De in het eerste lid bedoelde premie over de uitkering wordt ingehouden door het orgaan dat de uitkering betaalbaar
      stelt. Bedoeld orgaan stort de premie in de Algemene Kas, bedoeld in [artikel 1q van de Ziekenfondswet][ref1]. Onze
      Minister kan in afwijking hiervan bepalen dat in door hem vast te stellen gevallen tot een door hem vast te stellen
      tijdstip de inning van de hier bedoelde ziekenfondspremie bij de verzekerde geschiedt door het ziekenfonds waarbij
      de verzekerde staat ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1q
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 1q
  - number: 14a.4
    text: |-
      Voor de toepassing van dit artikel is artikel 9, tweede lid, van de Coördinatiewet Sociale Verzekering van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel14a
  - number: 14a.5
    text: |-
      Onze Minister kan aan het in het derde lid bedoelde orgaan verplichtingen opleggen en voorschriften geven met
      betrekking tot de vaststelling, de invordering, de afdracht en de verantwoording van de premie.
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel14a
  - number: 14b.1
    text: |-
      Degenen, bedoeld in [artikel 14, eerste lid][ref1], en [artikel 14a, eerste lid][ref2], zijn verplicht
      aan het orgaan dat met de premie-inhouding en -afdracht is belast, aan het ziekenfonds, bedoeld in
      [artikel 14, vierde lid, onder b][ref3], laatste volzin, en onder c, en in [artikel 14a, derde lid][ref4], en
      aan degene bedoeld in [artikel 14, zesde lid][ref5], alsmede aan de door hen gemachtigde personen, alle gevraagde
      inlichtingen te verstrekken en inzage te geven in alle boeken en bescheiden, voor zover deze zulks voor de
      beoordeling van de verzekeringsplicht en de vaststelling van de premie nodig achten.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002516#Artikel14a
      [ref3]: https://wetten.overheid.nl/BWBR0002516#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0002516#Artikel14a
      [ref5]: https://wetten.overheid.nl/BWBR0002516#Artikel14
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0002516
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0002516
        artikel: 14a
      - id: ref3
        bwb_id: BWBR0002516
        artikel: '14'
      - id: ref4
        bwb_id: BWBR0002516
        artikel: 14a
      - id: ref5
        bwb_id: BWBR0002516
        artikel: '14'
  - number: 14b.2
    text: |-
      Degenen, bedoeld in [artikel 14, eerste lid][ref1], en [artikel 14a][ref2], zijn verplicht het ziekenfonds, bedoeld
      in [artikel 14, vierde lid, onder b][ref3], laatste volzin, en onder c, en in [artikel 14a, derde lid][ref4], en
      degene bedoeld in [artikel 14, zesde lid][ref5], tijdig in te lichten over wijzigingen in de inkomsten, welke van
      belang zijn voor de premieheffing door het ziekenfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002516#Artikel14a
      [ref3]: https://wetten.overheid.nl/BWBR0002516#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0002516#Artikel14a
      [ref5]: https://wetten.overheid.nl/BWBR0002516#Artikel14
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0002516
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0002516
        artikel: 14a
      - id: ref3
        bwb_id: BWBR0002516
        artikel: '14'
      - id: ref4
        bwb_id: BWBR0002516
        artikel: 14a
      - id: ref5
        bwb_id: BWBR0002516
        artikel: '14'
  - number: 14b.3
    text: |-
      Overtreding van het eerste en tweede lid wordt aangeduid als een strafbaar feit als bedoeld in
      [artikel 84 van de Ziekenfondswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel84
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '84'
  - number: 14c.1
    text: |-
      Voor de verzekering van verzekerden als bedoeld in [artikel 1, onder ii, onderdelen 1 en 2][ref1], en jj,
      onderdeel 1, wordt een premie geheven tot het krachtens het eerste lid van [artikel 15 van de Ziekenfondswet][ref2]
      vastgestelde percentage van het loon dan wel van de uitkering, dat door de verzekerde is genoten in het tijdvak,
      waarover de betaling loopt.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel15
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel14c
    references:
      - id: ref1
        bwb_id: BWBR0002516
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '15'
  - number: 14c.2
    text: |-
      [Artikel 15, tweede lid][ref1], alsmede de [artikelen 15, derde tot en met vijfde lid][ref2], en
      [16 van de Ziekenfondswet][ref3] zijn van overeenkomstige toepassing. In het geval een uitkering wordt genoten,
      wordt het orgaan dat de uitkering doet, als werkgever beschouwd en wordt de uitkering als loon aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel16
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel14c
    references:
      - id: ref1
        bwb_id: BWBR0002516
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0002460
        artikel: '16'
  - number: 14d
    text: |-
      Voor zover de premie welke ingevolge dit besluit verschuldigd is, niet wordt geheven door het Uitvoeringsinstituut
      werknemersverzekeringen, verricht het College zorgverzekeringen de controle op de inning en afdracht van de
      ziekenfondspremie. Onze Minister kan hieromtrent nadere regelen stellen.
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel14d
  - number: 14e.1
    text: |-
      Indien blijkt dat voor de verzekering van de persoon, bedoeld in
      [artikel 3, eerste lid, onder b of d, van de Ziekenfondswet][ref1], die gelijktijdig verzekerd is ingevolge
      [artikel 3, eerste lid, onder a of b, van de Ziekenfondswet][ref2] of een of meer [onderdelen van artikel 1][ref3]
      van dit besluit over in totaal een hoger bedrag premie is betaald dan het bedrag, bedoeld in artikel 9, tweede lid,
      van de Coördinatiewet Sociale Verzekering wordt de premie betaald over het bedrag dat hoger is dan het hiervoor
      bedoelde bedrag, terugbetaald volgens nader te stellen regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002516#Artikel1
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel14e
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0002516
        artikel: '1'
  - number: 14e.2
    text: |-
      De in het eerste lid bedoelde regelen worden vastgesteld door het College zorgverzekeringen. Het College
      zorgverzekeringen kan daarbij bepalen door en aan wie die premie wordt terugbetaald en zonodig aan die regelen
      terugwerkende kracht verlenen.
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel14e
  - number: 14e.3
    text: Artikel 13, derde lid, van de Coördinatiewet Sociale Verzekering is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel14e
  - number: '15.1'
    text: |-
      Verzekerd is voorts, met inachtneming van het bepaalde in het tweede lid, en voor zover de betrokkene de leeftijd
      van 65 jaar nog niet heeft bereikt en zijn woonplaats hier te lande heeft:
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel15
  - number: 15.1.e
    text: |-
      degene, die een rente of uitkering ontvangt op grond van het bepaalde in artikel 14 van de Liquidatiewet
      ongevallenwetten;
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel15
  - number: 15.1.f
    text: |-
      degene, die krachtens arbeidsovereenkomst naar burgerlijk recht in dienst is geweest van een publiekrechtelijk
      lichaam en wegens ziekte of ongeval, in verband met deze dienstbetrekking ontstaan, een uitkering op de voet van de
      bepalingen van de Ongevallenwet 1921 ontvangt, welke is berekend naar een verlies van geschiktheid tot werken van
      50% of meer;
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel15
  - number: 15.1.g
    text: |-
      de weduwe en de wezen van de onder *f* bedoelde personen, die op grond van het overlijden van de betrokkene,
      tengevolge van de ziekte of het ongeval, een uitkering op de voet van de bepalingen van de Ongevallenwet 1921
      ontvangen.
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel15
  - number: '15.2'
    text: |-
      Het eerste lid, onder e-g, is met inachtneming van het bepaalde bij het derde lid slechts van toepassing op
      degene, die op de dag voorafgaande aan het in werking treden van dit besluit verplicht-verzekerd was ingevolge het
      Ziekenfondsenbesluit op grond van zijn aanspraak op een rente, uitkering onderscheidenlijk pensioen als genoemd in
      het eerste lid, onder e-g, voor de duur van deze aanspraak, mits hij bij het in werking treden van dit besluit niet
      krachtens enige andere bepaling verplicht-verzekerd is overeenkomstig het bepaalde in de [Ziekenfondswet][ref1] en
      tot aan het tijdstip, waarop hij krachtens enige andere bepaling verzekerd wordt overeenkomstig het bepaalde in de
      [Ziekenfondswet][ref2] of van de verzekering wordt uitgezonderd wegens toepassing van de inkomensgrens bedoeld in
      het tweede lid van [artikel 3 van de Ziekenfondswet][ref3], dan wel het bepaalde in het derde lid op hem toepassing
      vindt.


      [ref1]: https://wetten.overheid.nl/BWBR0002460
      [ref2]: https://wetten.overheid.nl/BWBR0002460
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel3
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002460
      - id: ref2
        bwb_id: BWBR0002460
      - id: ref3
        bwb_id: BWBR0002460
        artikel: '3'
  - number: '15.3'
    text: |-
      Het eerste lid is niet van toepassing op degene, die krachtens een arbeidsverhouding deelnemer is aan een door
      Onze Minister en Onze Minister van Binnenlandse Zaken aan te wijzen publiekrechtelijke ziektekostenregeling voor
      ambtenaren en die aan deze ziektekostenregeling recht kan ontlenen op geneeskundige verzorging of op een vergoeding
      van kosten van geneeskundige verzorging.
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel15
  - number: 15a.1
    text: 'Degenen die:'
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel15a
  - number: 15a.1.a
    text: |-
      als overheidswerknemer in de zin van
      [artikel 1, onder l, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref1] een WAO-uitkering
      ontvangen, dan wel;


      [ref1]: https://wetten.overheid.nl/BWBR0009267#Artikel1
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0009267
        artikel: '1'
  - number: 15a.1.b
    text: |-
      een pensioen ingevolge de bij of krachtens de [Kaderwet militaire pensioenen][ref1] vastgestelde
      bepalingen genieten, berekend naar een invaliditeit van minder dan 45 % en die op het tijdstip van
      inwerkingtreding van de [Wet op de toegang tot ziektekostenverzekeringen][ref2] verzekerd waren op grond van
      [artikel 1, onder r of w][ref3], zoals die onderdelen tot vorenbedoeld tijdstip luidden, blijven verzekerd onder de
      voorwaarden zoals die op dat tijdstip golden.


      [ref1]: https://wetten.overheid.nl/BWBR0011955
      [ref2]: https://wetten.overheid.nl/BWBR0003934
      [ref3]: https://wetten.overheid.nl/BWBR0002516#Artikel1
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0011955
      - id: ref2
        bwb_id: BWBR0003934
      - id: ref3
        bwb_id: BWBR0002516
        artikel: '1'
  - number: 15a.2
    text: |-
      De belanghebbende, bedoeld in [artikel 17, eerste lid, van de Wet privatisering ABP][ref1] die aanspraak heeft
      op het diensttijdpensioen, bedoeld in [artikel 19, eerste lid, van die wet][ref2] doch niet een WAO-uitkering
      als bedoeld in het eerste lid ontvangt, en die op het tijdstip van inwerkingtreding van de Wet op de toegang
      tot de ziektekostenverzekeringen verzekerd was op grond van [artikel 1, onder ][ref3], zoals dat onderdeel tot
      vorenbedoeld tijdstip luidde, blijft verzekerd onder de voorwaarden zoals die op dat tijdstip golden.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0007791#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0002516#Artikel1
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0007791
        artikel: '19'
      - id: ref3
        bwb_id: BWBR0002516
        artikel: '1'
  - number: 15a.3.a
    text: |-
      Voor de verzekering van de verzekerden, bedoeld in het eerste lid, onder a, en het tweede lid wordt
      een premie geheven tot het krachtens het [eerste lid van artikel 15 van de Ziekenfondswet][ref1]
      vastgestelde percentage van de uit te betalen WAO-uitkering, die in het tijdvak, waarover de betaling
      loopt, door de verzekerden is genoten. Het bepaalde krachtens [artikel 15, tweede lid][ref2], alsmede de
      [artikelen 15, derde tot en met vijfde lid][ref3], en [16 van de Ziekenfondswet][ref4] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002516#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0002460#Artikel16
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002516
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0002460
        artikel: '15'
      - id: ref4
        bwb_id: BWBR0002460
        artikel: '16'
  - number: 15a.3.b
    text: |-
      Met betrekking tot de vaststelling, de invordering en de afdracht van de premie voor de verzekering van
      verzekerden, bedoeld in het eerste lid, onder b, is [artikel 11b][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel11b
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0002516
        artikel: 11b
  - number: 15b
    text: |-
      Verzekerd is degene die hier te lande woonachtig is en die op 31 december 1997 65 jaar of ouder was en op grond
      van een door Nederland met een of meer andere staten gesloten verdrag inzake sociale zekerheid of op grond van een
      verordening van de Raad van de Europese Unie dan wel de Overeenkomst betreffende de Europese Economische Ruimte
      als gezinslid aanspraak kon doen gelden op de in beginsel ten laste van een orgaan van een andere verdragsstaat
      respectievelijk van een andere lidstaat van de Europese Unie dan wel de Europese Economische Ruimte door een
      Nederlands ziekenfonds te verlenen verstrekkingen, tenzij ingevolge de desbetreffende verdragsbepalingen het recht
      op medische zorg als gezinslid bij het bereiken van de 65-jarige leeftijd niet wordt beëindigd.
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel15b
  - number: 15c.1
    text: |-
      Tot de eerste dag van de maand waarin de betrokkene de leeftijd van 65 jaar bereikt, is verzekerd
      de vreemdeling die op 1 juli 1998 rechtmatig hier te lande verblijf houdt, als bedoeld in artikel
      1b, aanhef en onder 5, van de Vreemdelingenwet, voor zover en zolang betrokkene op grond van
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      _________________________________________________________________________________________________________
      (Stb. 203), algemene bijstand ontvangt met toepassing van de [artikelen 20][ref2]
      of [21 van de Wet werk en bijstand][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009511#ArtikelXXIII
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel21
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0009511
        artikel: XXIII
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '20'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '21'
  - number: 15c.2
    text: |-
      Tot de eerste dag van de maand waarin de betrokkene de leeftijd van 65 jaar bereikt, is verzekerd
      de vreemdeling die op 1 juli 1998 rechtmatig hier te lande verblijf houdt, als bedoeld in artikel
      1b, aanhef en onder 5, van de Vreemdelingenwet, voor zover en zolang betrokkene op grond van
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      _______________________________________________________________________________________, algemene bijstand ontvangt
      met toepassing van [artikel 23 van de Wet werk en bijstand][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009511#ArtikelXXIII
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel23
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0009511
        artikel: XXIII
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '23'
  - number: 15c.3
    text: |-
      Verzekerd is met ingang van de eerste dag van de maand waarin hij de leeftijd van 65 jaar bereikt, degene
      die op de laatste dag van de daaraan voorafgaande maand ingevolge het eerste of tweede lid verzekerd was,
      zolang en voor zover betrokkene algemene bijstand ontvangt met toepassing van de [artikelen 22][ref1]
      of [23 van de Wet werk en bijstand][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel23
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '23'
  - number: 15d
    text: |-
      Indien hij daartoe de wens te kennen geeft, is tot de eerste dag van de maand waarin de betrokkene de leeftijd van
      65 jaar bereikt, degene die hier te lande woonachtig is en die op 30 september 1990 jonger was dan 65 jaar en die
      op die datum verzekerd was ingevolge [artikel 15, eerste lid, aanhef en onder ][ref1], in verbinding met het tweede
      en derde lid, van dit besluit zoals dit op genoemd tijdstip luidde, verzekerd overeenkomstig de bepalingen van
      de [Ziekenfondswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel15d
