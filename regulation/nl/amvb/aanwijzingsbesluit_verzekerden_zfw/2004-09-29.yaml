      degene, die hier te lande zijn woonplaats heeft en wiens medeverzekering als bedoeld in
      [artikel 4 van de Ziekenfondswet][ref1] een einde heeft gevonden door het overlijden van degene op wiens
      verzekering de medeverzekering steunde, gedurende een aaneengesloten periode van 6 weken te rekenen van de dag af,
      waarop het recht op medeverzekering een einde nam;


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel4
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel1
