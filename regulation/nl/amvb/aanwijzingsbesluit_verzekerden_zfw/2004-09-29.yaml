      degene, die zijn woonplaats hier te lande heeft en wiens verplichte verzekering op grond van de
      [Ziekenfondswet][ref1] is geëindigd, zulks indien hij wacht op toekenning van arbeidsongeschiktheidsuitkering
      op grond van verplichte verzekering ingevolge de [Wet op de Arbeidsongeschiktheidsverzekering][ref2],
      mits en voor zolang het ziekenfonds waarbij hij staat ingeschreven, het aannemelijk acht dat hem die
      arbeidsongeschiktheidsuitkering zal worden toegekend, doch gedurende ten hoogste 13 weken;


