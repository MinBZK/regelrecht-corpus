        bwb_id: BWBR0002460
  - number: '16.1'
    text: |-
      Voor de verzekering van degenen, bedoeld in [artikel 15, eerste lid, onder ][ref1], wordt een premie geheven
      tot het krachtens [artikel 15, tweede lid, van de Ziekenfondswet][ref2] door de verzekerde verschuldigde
      premiepercentage berekend van de rente, de uitkering, onderscheidenlijk het pensioen als bedoeld in het
      [eerste lid van artikel 15][ref3], met dien verstande, dat de premie ten minste € 1 per maand bedraagt, tenzij de
      rente, de uitkering onderscheidenlijk het pensioen als vorenbedoeld minder bedraagt dan dit bedrag in welk geval de
      premie gelijk is aan het bedrag van de rente, de uitkering, onderscheidenlijk het pensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0002516#Artikel15
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel16
    references:
      - id: ref1
