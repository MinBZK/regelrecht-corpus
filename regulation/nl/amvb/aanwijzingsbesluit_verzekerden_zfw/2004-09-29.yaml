        artikel: '15'
      - id: ref3
        bwb_id: BWBR0002516
        artikel: '15'
  - number: '16.2'
    text: |-
      Het orgaan, belast met de uitbetaling van de rente, de uitkering onderscheidenlijk het pensioen, houdt de premie
      daarop in en stort deze in de Algemene Kas, bedoeld in [artikel 1q van de Ziekenfondswet][ref1]. Onze Minister
      kan voorschriften geven met betrekking tot de vaststelling, de invordering, de afdracht en de verantwoording van
      de premie.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1q
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 1q
  - number: 16a.1
    text: |-
      Onverminderd hetgeen krachtens dit besluit omtrent de procentuele premie
      is bepaald, wordt voor de verzekering van de verzekerde, bedoeld in de
      __REF000___________________________________________________________________________________________________________
      ___________[9][ref2], [12a][ref3], [14][ref4], [15][ref5], [15a][ref6], [15b][ref7],
      [15c, eerste en derde lid][ref8], en [15d][ref9], van 18 jaar of ouder en zijn medeverzekerde,
      bedoeld in [artikel 4, eerste lid, van de Ziekenfondswet][ref10], een jaarlijkse nominale
      premie geheven. Met betrekking tot deze nominale premie zijn de regelen die bij of krachtens
      [artikel 17, eerste tot en met zesde lid, van de Ziekenfondswet][ref11] zijn gesteld van toepassing.


