  - number: 1.o
    text: |-
      degene, die zijn woonplaats hier te lande heeft, in werkelijke militaire dienst is ingevolge de Wet voor het
      reserve-personeel der krijgsmacht 1985 en die langer dan 100 dagen onafgebroken in werkelijke militaire dienst
      is of geacht kan worden te zullen verblijven, mits een of meer personen ingevolge het bepaalde bij of krachtens
      [artikel 4 van de Ziekenfondswet][ref1] op grond van zijn verzekering in aanmerking komen voor medeverzekering;


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel4
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel1
    references:
