        artikel: '4'
  - number: 1.p
    text: |-
      degene, die behoort tot een of meer door Onze Minister en door Onze Minister van Defensie aan te wijzen groepen van
      personen, die kunnen worden geacht niet langer dan 100 dagen onafgebroken in werkelijke militaire dienst te zullen
      verblijven;
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel1
  - number: 1.q.1
    text: |-
      tot de eerste dag van de maand waarin de betrokkene de leeftijd van 65 jaar bereikt, degene van 55 jaar of
      ouder die zijn woonplaats hier te lande heeft en die ten gevolge van bedrijfsbeëindiging niet langer voldoet
      aan de voorwaarden, bedoeld in [artikel 3d, eerste lid, van de Ziekenfondswet][ref1], indien hij op de dag,
      voorafgaande aan die waarop die verzekering ten gevolge van bedrijfsbeëindiging is geëindigd, verzekerd
      is op grond van [artikel 3d, eerste lid, van de Ziekenfondswet][ref2]. Onder bedrijfsbeëindiging wordt
      verstaan het geheel staken van de onderneming en het in verband daarmee niet langer genieten van winst uit
      onderneming als bedoeld in [artikel 3d, eerste lid, van de Ziekenfondswet][ref3]. De verzekering vangt aan
      met ingang van de eerste dag van het kalenderjaar volgend op het kalenderjaar waarin de verzekering ingevolge
      [artikel 3d, eerste lid, van de Ziekenfondswet][ref4] eindigt. De verzekering eindigt op het tijdstip waarop
      betrokkene weer verzekerd wordt ingevolge [3d, eerste lid, van de Ziekenfondswet][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3d
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel3d
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel3d
