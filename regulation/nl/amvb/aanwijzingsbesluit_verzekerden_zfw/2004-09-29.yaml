      gedurende het kalenderjaar waarop de verklaring ziet, maar uiterlijk tot de eerste dag van de maand
      waarin hij de leeftijd van 65 jaar bereikt, degene die een verklaring heeft ontvangen als bedoeld
      in [artikel 3d, tweede lid, van de Ziekenfondswet][ref1], en van wie nadien wordt vastgesteld
      dat hij over het jaar waarop de verklaring ziet, niet voldoet aan de voorwaarden bedoeld in
      [artikel 3d, eerste lid, van de Ziekenfondswet][ref2], tenzij de afgifte van de verklaring het gevolg is van het
      feit dat deze persoon de rijksbelastingdienst of het ziekenfonds ten onrechte niet heeft gemeld dat hij niet langer
      voldoet aan de voorwaarden van [artikel 3d, eerste lid, van de Ziekenfondswet][ref3];


