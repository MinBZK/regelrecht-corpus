  - number: 1.d
    text: |-
      degene, die zijn woonplaats hier te lande heeft en die op grond van een uitkeringsregeling wegens werkloosheid of
      ontslag, ter zake waarvan hij verzekerd was ingevolge onderdeel f, een uitkering wegens ziekte, zwangerschap of
      bevalling ontvangt;
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel1
  - number: 1.e
    text: |-
      gedurende ten hoogste achttien maanden, degene, die ononderbroken onbetaald verlof in de zin van
      [artikel 1, onderdeel e, van de Ziektewet][ref1] opneemt en direct voorafgaand aan het verlof verzekerd was
      ingevolge de [Ziekenfondswet][ref2]. Als ononderbroken onbetaald verlof worden mede aangemerkt perioden van
      onbetaald verlof die elkaar met een onderbreking van minder dan een maand opvolgen;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002460
  - number: 1.f
    text: |-
      degene, die zijn woonplaats hier te lande heeft en anders dan krachtens of anders dan in aanvulling op de
      [Werkloosheidswet ][ref1]of de [Toeslagenwet][ref2] dan wel de voorzieningen en regelingen, bedoeld onder g, x en
      aa, een uitkering of wachtgeld ter zake van werkloosheid of ontslag ontvangt op grond van de arbeidsvoorwaarden,
      verbonden aan de dienstbetrekking ter zake waarvan hij verzekerd was als overheidswerknemer in de zin van
      [artikel 1, onder l, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref3] dan wel in die
      hoedanigheid uitsluitend in verband met overschrijding van de voor de verplichte ziekenfondsverzekering
      geldende loongrens niet verzekerd was. Met een uitkering als bedoeld in de vorige alinea wordt gelijkgesteld een
      overbruggingsuitkering, welke aan een gewezen werknemer van de steenkolenmijn-industrie is toegekend op grond van
      de regeling inzake aanvullende voorzieningen in het kader van artikel 4 van de beschikking nr. 3–65 van de Hoge
      Autoriteit van de Europese Gemeenschap voor Kolen en Staal van 17 februari 1965, welke op 19 april 1967 door de
      vereniging «De Gezamenlijke Steenkolenmijnen in Limburg» is vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004043
      [ref3]: https://wetten.overheid.nl/BWBR0009267#Artikel1
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004043
      - id: ref3
        bwb_id: BWBR0009267
        artikel: '1'
  - number: 1.g
    text: |-
      degene, die zijn woonplaats hier te lande heeft en die een uitkering geniet ter zake van vervroegde uittreding
      uit het arbeidsproces, mits hij op de dag, voorafgaande aan die met ingang waarvan de uitkering wordt toegekend,
      verzekerd was op grond van de [Ziekenfondswet][ref1]. Onder een uitkering ter zake van vervroegde uittreding uit
      het arbeidsproces wordt verstaan een uitkering ingevolge een van rijkswege dan wel bij of krachtens collectieve
      arbeidsovereenkomst vastgestelde regeling ter zake van vervroegde uittreding uit het arbeidsproces of een ter zake
      van vervroegde uittreding uit het arbeidsproces getroffen regeling voor personen van 55 jaar of ouder waarbij het
      uitkeringspercentage op ten minste 70% van het laatstgenoten loon is vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002460
