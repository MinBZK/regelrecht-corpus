  - number: 1.z
    text: |-
      degene die zijn woonplaats hier te lande heeft en die met ingang van een dag, gelegen op of na de dag van
      inwerkingtreding van de [Wet op de toegang tot ziektekostenverzekeringen][ref1], in het genot is gesteld van
      een uitkering ter zake van vervroegde pensionering en die op de dag, voorafgaande aan die met ingang waarvan de
      uitkering wordt toegekend, verzekerd was op grond van de [Ziekenfondswet][ref2]. Onder een uitkering ter zake van
      vervroegde pensionering wordt verstaan een uitkering ter zake van pensionering voor de 65-jarige leeftijd ingevolge
      een pensioenregeling die ten doel heeft de verzorging van werknemers en gewezen werknemers bij ouderdom;


