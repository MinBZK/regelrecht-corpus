  - number: '2.13'
    text: |-
      [Artikel 1, onder z][ref1], is niet van toepassing op degene die uitsluitend een uitgesteld vervroegd pensioen
      ontvangt. Onder een uitgesteld vervroegd pensioen wordt verstaan een vervroegd pensioen uit een dienstbetrekking
      die niet onmiddellijk voorafgaande aan de dag van ingang van dat pensioen is geëindigd. Voor de toepassing van de
      vorige volzin wordt de dienstbetrekking geacht voort te duren zolang en voor zover in het tijdvak gelegen tussen de
      beëindiging van de dienstbetrekking en de ingangsdatum van het vervroegde pensioen, in verband met de beëindiging
      van bedoelde dienstbetrekking een uitkering op grond van een sociale verzekeringswet dan wel een uitkering als
      bedoeld in [artikel 1, onder g of aa][ref2], is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002516#Artikel1
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002516
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002516
        artikel: '1'
  - number: '2.14'
    text: |-
      [Artikel 1, onderdeel hh][ref1], is niet van toepassing op degene die in het tijdvak van vijf jaar, onmiddellijk
      voorafgaande aan de maand waarin hij de leeftijd van 65 jaar bereikt, minder dan drie jaar verzekerd was ingevolge
      de [Ziekenfondswet][ref2], dan wel rechthebbende op verstrekkingen ingevolge de wettelijke regeling van een of
      meer andere staten waarmee Nederland een verdrag inzake sociale zekerheid heeft gesloten of van een of meer andere
      lidstaten van de Europese Unie dan wel van de Europese Economische Ruimte. Voorzover voor de vaststelling van de
      in de eerste volzin bedoelde periode nodig, worden de tijdvakken gedurende welke betrokkene aanspraken had op grond
      van de in die volzin bedoelde wettelijke regelingen samengeteld, voorzover deze tijdvakken niet samenvallen. Onze
      Minister kan bepalen dat door hem aangewezen categorieën van personen als bedoeld in het eerste lid, onder hh, niet
      behoeven te voldoen aan de in de eerste volzin bedoelde voorwaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002516
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002460
  - number: '2.15'
    text: |-
      [Artikel 1][ref1] is niet van toepassing op degene die recht heeft op medische zorg
      krachtens een regeling van een op grond van [artikel 3, eerste lid, onder d][ref2], dan wel
      [artikel 14, tweede lid, van het Besluit uitbreiding en beperking kring verzekerden volksverzekeringen 1999][ref3]
      aangewezen volkenrechtelijke organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0010182#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0010182#Artikel14
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002516
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0010182
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0010182
        artikel: '14'
  - number: '2.16'
    text: |-
      Het bepaalde in [artikel 1][ref1] is - tenzij anders bepaald - niet van toepassing op degene, die de leeftijd van
      65 jaar heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel1
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002516
        artikel: '1'
  - number: '2.17'
    text: |-
      [Artikel 1, onderdeel kk][ref1], is niet van toepassing op degene die op de dag voor de inwerkingtreding van de
      [Remigratiewet][ref2] is geremigreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0010424
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002516
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0010424
  - number: 2a
    text: |-
      Waar ingevolge dit besluit voor de verzekering als voorwaarde wordt gesteld dat betrokkene zijn woonplaats hier
      te lande heeft, is deze voorwaarde niet van toepassing op degene die buiten het Rijk woont op het grondgebied van
      een staat waar hij hetzij krachtens verordening van de Raad van de Europese Gemeenschappen, hetzij krachtens een
      verdrag recht heeft op verstrekkingen, welke in beginsel worden verleend ten laste van de Algemene Kas bedoeld in
      [artikel 1q van de Ziekenfondswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1q
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 1q
  - number: '3.1'
    text: |-
      Degene, tot wie een of meer personen bedoeld in [artikel 1, onder ii, onderdeel 1][ref1] of 2, en jj, onderdeel
      1, in dienstbetrekking staan, wordt mede voor de toepassing van [artikel 5 van de Ziekenfondswet][ref2] beschouwd
      als werkgever. Het bepaalde bij of krachtens de [artikelen 10][ref3] en [12 van de Ziektewet][ref4] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel12
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002516
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0001888
        artikel: '12'
  - number: '3.2'
    text: |-
      Degene, die belast is met de uitkering van wachtgeld, rente, pensioen of enige andere uitkering
      als bedoeld in de [artikelen 1][ref1], [15][ref2], en [15][ref3], wordt mede voor de toepassing van
      [artikel 5 van de Ziekenfondswet][ref4] beschouwd als werkgever van degene, aan wie het wachtgeld, de rente, het
      pensioen of enige andere uitkering als vorenbedoeld is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002516#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0002516#Artikel15a
      [ref4]: https://wetten.overheid.nl/BWBR0002460#Artikel5
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002516
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002516
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0002516
        artikel: 15a
      - id: ref4
        bwb_id: BWBR0002460
        artikel: '5'
  - number: '3.3'
    text: |-
      Degene die belast is met de uitkering van pensioen of enige uitkering aan de persoon, bedoeld in
      [artikel 3, eerste lid, onder b en c, van de Ziekenfondswet][ref1], wordt, voor zover deze met de inhouding van
      ziekenfondspremie is belast, mede voor de toepassing van [artikel 5 van de Ziekenfondswet][ref2] beschouwd als
      werkgever van degene, aan wie het pensioen of de uitkering, als vorenbedoeld, is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel5
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '5'
  - number: '3.4'
    text: |-
      Degene die de bijstand van de persoon, bedoeld in [artikel 1, onder y][ref1], heeft verlaagd, wordt voor de
      toepassing van [artikel 5 van de Ziekenfondswet][ref2] als diens werkgever beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel5
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002516
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '5'
  - number: 3a
    text: |-
      Waar in het vervolg van dit besluit regelen worden gesteld krachtens welke een procentuele premie wordt geheven
      gelden deze regelen onverminderd hetgeen bij of krachtens [artikel 16][ref1] omtrent de daarbedoelde nominale
      premie is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel16a
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002516
        artikel: 16a
  - number: 3b
    text: |-
      Bij de premieheffing ingevolge dit besluit over uitkeringen en pensioenen niet zijnde loon als bedoeld in
      [artikel 3, vijfde lid, van de Ziekenfondswet][ref1], wordt geen premie geheven over:


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '3'
  - number: 3b.a
    text: |-
      bedragen die worden ingehouden als verplichte bijdrage ingevolge een pensioenregeling of een regeling voor
      vervroegde uittreding;
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel3b
  - number: 3b.b
    text: eenmalige uitkeringen en verstrekkingen ter zake van overlijden;
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel3b
  - number: 3b.c
    text: |-
      uitkeringen en verstrekkingen tot dekking van op de uitkerings- of pensioengerechtigde drukkende kosten ter zake
      van ziekte, invaliditeit en bevalling;
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel3b
  - number: 3b.d
    text: |-
      geschenken ter gelegenheid van algemeen erkende feestdagen en het Sint-Nicolaasfeest, een jubileum van
      de inhoudingsplichtige, dan wel de verjaardag en andere persoonlijke feestdagen van de uitkerings- of
      pensioengerechtigde, voor zover de waarde daarvan een bedrag van € 35 per jaar niet overtreft;
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel3b
  - number: 3b.e
    text: |-
      een tegemoetkoming in de voor rekening van de vervroegd gepensioneerde komende ziekenfondspremie tot ten hoogste
      het bedrag, dat overeenstemt met het werkgeversdeel, dat verschuldigd zou zijn, als de uitkering als loon zou
      worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel3b
  - number: 4a.1
    text: |-
      Voor de verzekering van degenen, bedoeld in [artikel 1, onder d][ref1], wordt over de uitkering een premie geheven
      tot het krachtens [artikel 15, eerste lid, van de Ziekenfondswet][ref2] vastgestelde percentage.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel15
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002516
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '15'
  - number: 4a.2
    text: |-
      [Artikel 9, tweede lid, van de Coördinatiewet Sociale Verzekering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002126#Artikel9
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002126
        artikel: '9'
  - number: 4a.3
    text: |-
      Voor de toepassing van dit artikel is het bepaalde krachtens [artikel 15, tweede lid, van de Ziekenfondswet][ref1]
      alsmede het bepaalde in het [derde, vierde en vijfde lid van dat artikel][ref2] van overeenkomstige toepassing,
      waarbij de uitkering, bedoeld in het eerste lid, als loon wordt aangemerkt en het orgaan dat de uitkering doet als
      werkgever wordt beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel15
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '15'
  - number: 4a.4
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gegeven met betrekking tot de vaststelling, de invordering,
      de afdracht en de verantwoording van de premie.
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel4a
  - number: '5.1'
    text: |-
      Voor de verzekering van degenen, bedoeld in [artikel 1, onder f,][ref1] wordt van de uitkering en het
      wachtgeld, welke de verzekerden hebben genoten in het tijdvak, waarover de betaling loopt, een premie geheven
      tot het krachtens het eerste lid van [artikel 15 van de Ziekenfondswet][ref2] vastgestelde percentage.
      Daarbij wordt in voorkomend geval mede als uitkering of wachtgeld aangemerkt de toeslag ingevolge artikel
      9 van de Wet van 20 december 1984, houdende aanpassing van uitkeringspercentages van ontslaguitkerings- en
      arbeidsongeschiktheidsregelingen voor overheidspersoneel, onderwijspersoneel en daarmee gelijk te stellen personeel
      (*Stb.* 657).


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel15
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002516
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '15'
  - number: '5.2'
    text: |-
      Voor de toepassing van dit artikel is het bepaalde krachtens [artikel 15, tweede lid, van de Ziekenfondswet][ref1]
      alsmede het bepaalde in het derde, vierde en vijfde lid van dat artikel van overeenkomstige toepassing, waarbij het
      orgaan, dat de uitkering of het wachtgeld verleent, als werkgever wordt beschouwd en de uitkering en het wachtgeld
      als loon worden aangemerkt. Artikel 9, tweede lid, van de Coördinatiewet Sociale Verzekering is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel15
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '15'
  - number: 5a.1
    text: |-
      Voor de verzekering van verzekerden als bedoeld in [artikel 1, onder ][ref1], wordt van de uitkering ter zake
      van vervroegde uittreding, de vakantie-uitkering daaronder begrepen, een premie geheven tot het krachtens
      [artikel 15, eerste lid, van de Ziekenfondswet][ref2] vastgestelde percentage.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel15
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0002516
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '15'
  - number: 5a.2
    text: |-
      Bij ministeriële regeling van Onze Minister kan worden bepaald dat bij de premieberekening een daarbij aan te geven
      deel van de uitkering of de vakantie-uitkering buiten beschouwing blijft.
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel5a
  - number: 5a.3
    text: |-
      Indien de uitkering niet of slechts ten dele wordt uitbetaald wegens samenloop met andere inkomsten, wordt de
      uitkering voor de toepassing van dit artikel geacht ten volle te worden uitbetaald, tenzij de uitkering niet
      of slechts ten dele wordt uitbetaald wegens samenloop met loon of uitkering waarover reeds krachtens een andere
      bepaling premie voor de ziekenfondsverzekering verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel5a
  - number: 5a.4
    text: |-
      Voor de toepassing van dit artikel is van overeenkomstige toepassing het bepaalde in artikel 9, tweede lid, van de
      Coördinatiewet Sociale Verzekering.
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel5a
  - number: 5a.5
    text: |-
      Het bepaalde krachtens [artikel 15][ref1], tweede lid, en
      [artikel 15, derde, vierde en vijfde lid, van de Ziekenfondswet][ref2] zijn van overeenkomstige toepassing.
      Het orgaan dat de uitkering doet, wordt als werkgever beschouwd en de uitkering wordt als loon aangemerkt.
      In afwijking van [artikel 15, derde en vijfde lid, van de Ziekenfondswet][ref3] stort de Stichting fonds
      vrijwillig vervroegd uittreden overheidspersoneel, bedoeld in artikel 11, eerste lid, van de Wet financiële
      voorzieningen privatisering ABP, de in het eerste lid bedoelde premie rechtstreeks in de Algemene Kas, bedoeld in
      [artikel 1q van de Ziekenfondswet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0002460#Artikel1q
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0002460
        artikel: '15'
      - id: ref4
        bwb_id: BWBR0002460
        artikel: 1q
  - number: 5a.6
    text: |-
      Indien de uitkering wordt gedaan door de werkgever bij wie degene, bedoeld in [artikel 1, onder ][ref1], vóór de
      uittreding in dienstbetrekking was, is het vijfde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel1
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0002516
        artikel: '1'
  - number: 5a.7
    text: |-
      Onze Minister kan voorschriften geven met betrekking tot de vaststelling, de invordering, de afdracht en de
      verantwoording van de premie.
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel5a
  - number: '6.1'
    text: |-
      Voor de verzekering van verzekerden als bedoeld in [artikel 1, onder ][ref1], die in het genot
      zijn van een ziekengeld krachtens Hoofdstuk II of een uitkering krachtens Hoofdstuk III van de
      Wet arbeidsongeschiktheidsvoorziening militairen wordt van het ziekengeld onderscheidenlijk de
      uitkering een premie geheven tot het krachtens [artikel 15, eerste lid, van de Ziekenfondswet][ref2]
      vastgestelde percentage. Het bepaalde krachtens [artikel 15, tweede lid][ref3], alsmede
      [artikel 15, derde, vierde en vijfde lid, van de Ziekenfondswet][ref4] en artikel 9, tweede lid, van de
      Coördinatiewet Sociale Verzekering zijn van overeenkomstige toepassing. Het orgaan dat het ziekengeld
      onderscheidenlijk de uitkering verleent, wordt als werkgever beschouwd. Het ziekengeld wordt als loon aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0002516#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0002460#Artikel15
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002516
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0002516
        artikel: '15'
      - id: ref4
        bwb_id: BWBR0002460
        artikel: '15'
  - number: '6.2'
    text: |-
      Een toeslag ingevolge de [Toeslagenwet][ref1], genoten in het tijdvak waarover de betaling loopt, wordt tot het
      ziekengeld gerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004043
  - number: '6.3'
    text: |-
      Als uitkering worden tevens aangemerkt een toeslag ingevolge de [Toeslagenwet][ref1] en aanspraken krachtens een
      andere wettelijke regeling, waarmee bij de vaststelling van het bedrag van de uitkering rekening werd gehouden,
      voor zover over het bedrag van die aanspraken niet reeds premie wordt geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004043
  - number: '6.4'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen stort de premie in de Algemene Kas, bedoeld in
      [artikel 1q van de Ziekenfondswet][ref1]. Onze Minister kan voorschriften geven met betrekking tot de vaststelling,
      de invordering, de afdracht en de verantwoording van de premie.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1q
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 1q
  - number: '7.1'
    text: |-
      Een verzekerde als bedoeld in [artikel 1, onder ][ref1], is naast de jaarlijkse nominale premie, bedoeld in
      [artikel 16][ref2], een premie verschuldigd die op een door Onze Minister en Onze Minister van Sociale Zaken en
      Werkgelegenheid tezamen te bepalen bedrag wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002516#Artikel16a
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002516
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002516
        artikel: 16a
  - number: '7.2'
    text: |-
      De in het eerste lid bedoelde premie wordt bij de verzekerde geïnd door het ziekenfonds waarbij hij staat
      ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel7
  - number: '7.3'
    text: |-
      Als werkgever wordt beschouwd de werkgever bij wie de verzekerde, bedoeld in het eerste lid, op de datum van
      aanvang van het onbetaald verlof in dienstbetrekking was.
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel7
  - number: '9.1'
    text: |-
      Voor de verzekering van verzekerden als bedoeld in [artikel 3, eerste lid, onder b, van de Ziekenfondswet][ref1],
      voor zover zij recht hebben op een uitkering ingevolge de Algemene nabestaandenwet, wordt een premie geheven tot
      het krachtens [artikel 15, eerste lid, van de Ziekenfondswet][ref2] vastgestelde percentage. De premie wordt per
      maand berekend over de uitkering met inbegrip van de vakantie-uitkering, waarop de verzekerde aanspraak heeft
      krachtens de Algemene nabestaandenwet, onder toepassing van artikel 18 van die wet. Indien de uitkering slechts
      ten dele wordt toegekend in verband met samenloop met een uitkering ingevolge de sociale wetgeving van een
      andere mogendheid, wordt de uitkering voor de vaststelling van de verschuldigde premie geacht ten volle te worden
      uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel15
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '15'
  - number: '9.2'
    text: |-
      Het bepaalde krachtens [artikel 15, tweede lid, van de Ziekenfondswet][ref1] is van overeenkomstige toepassing. De
      Sociale verzekeringsbank wordt als werkgever beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel15
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '15'
  - number: '9.3'
    text: |-
      De Sociale verzekeringsbank houdt de door de verzekerde ingevolge dit artikel verschuldigde premie in op de
      uitkering, waarop de verzekerde aanspraak heeft krachtens de Algemene nabestaandenwet.
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel9
  - number: '9.4'
    text: |-
      De Sociale verzekeringsbank stort de in het eerste lid bedoelde premie in de Algemene Kas, bedoeld in
      [artikel 1q van de Ziekenfondswet][ref1]. Onze Minister kan voorschriften geven met betrekking tot de vaststelling,
      de invordering, de afdracht en de verantwoording van de premie.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1q
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 1q
  - number: '10'
    text: |-
      Voor de verzekering van degenen, bedoeld in [artikel 1, onder h, n, s en u][ref1], is alleen een nominale premie
      verschuldigd als bedoeld in [artikel 16a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002516#Artikel16a
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002516
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002516
        artikel: 16a
  - number: 10a.1
    text: |-
      Voor de verzekering van verzekerden, bedoeld in [artikel 1, onder j][ref1], wordt van de uitkering, herleid tot
      een bruto-bedrag, die zij hebben genoten in het tijdvak waarover de betaling loopt, een premie geheven tot een door
      Onze Minister en Onze Minister van Sociale Zaken en Werkgelegenheid tezamen te bepalen percentage.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel1
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0002516
        artikel: '1'
  - number: 10a.2
    text: |-
      Het bepaalde krachtens [artikel 15, derde en vijfde lid, van de Ziekenfondswet][ref1] is van overeenkomstige
      toepassing. Het orgaan dat de uitkering doet, wordt als werkgever beschouwd en de uitkering wordt als loon
      aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel15
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '15'
  - number: 10a.3
    text: |-
      Onze Minister kan voorschriften geven met betrekking tot de vaststelling, de invordering, de afdracht en de
      verantwoording van de premie.
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel10a
  - number: 10a.4
    text: |-
      De ingevolge het eerste lid afgedragen premie kan niet worden teruggevorderd indien na de definitieve vaststelling
      van de hoogte van de uitkering, bedoeld in [artikel 10 van de Wet inkomensvoorziening kunstenaars][ref1], de als
      renteloze geldlening verleende uitkering, bedoeld in [artikel 9 van die wet][ref2], geheel of ten dele niet wordt
      omgezet in een bedrag om niet.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009344#Artikel9
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0009344
        artikel: '9'
  - number: 10b.1
    text: |-
      Voor de verzekering van verzekerden als bedoeld in [artikel 1, onder k][ref1], geschiedt de procentuele
      premiebetaling door betaling ineens van een jaarlijks door Onze Minister en Onze Minister van Sociale Zaken en
      Werkgelegenheid vast te stellen bedrag, welk bedrag gebaseerd is op de geschatte opbrengst aan procentuele premie
      van de betreffende categorie van verzekerden indien zij een loongerelateerde uitkering zouden hebben ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel1
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0002516
        artikel: '1'
  - number: 10b.2
    text: |-
      Als werkgever van de verzekerde, bedoeld in [artikel 1, onder k][ref1], wordt beschouwd de werkgever bij wie de
      verzekerde op de dag voorafgaande aan de eindiging van zijn dienstbetrekking in dienstbetrekking stond.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel1
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0002516
        artikel: '1'
  - number: 10c.1
    text: |-
      Degenen, bedoeld in [artikel 1, onder l][ref1], zijn over de uitkering een premie verschuldigd tot het krachtens
      [artikel 15, eerste lid, van de Ziekenfondswet][ref2] vastgestelde percentage.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel15
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0002516
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '15'
  - number: 10c.2
    text: |-
      [Artikel 9, tweede lid, van de Coördinatiewet Sociale Verzekering][ref1] is van overeenkomstige toepassing,
      waarbij de uitkering, bedoeld in het eerste lid, als loon wordt aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002126#Artikel9
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0002126
        artikel: '9'
  - number: 10c.3
    text: |-
      Voor de toepassing van dit artikel is het bepaalde krachtens
      [artikel 15, derde en vijfde lid, van de Ziekenfondswet][ref1] van overeenkomstige toepassing, waarbij de
      uitkering, bedoeld in het eerste lid, als loon wordt aangemerkt en het orgaan dat de uitkering doet, als werkgever
      wordt beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel15
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '15'
  - number: 10c.4
    text: |-
      Onze Minister kan voorschriften geven met betrekking tot de vaststelling, de invordering, de afdracht en de
      verantwoording van de premie.
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel10c
  - number: '11.1'
    text: |-
      Onze Minister en Onze Minister van Defensie stellen de premie vast, verschuldigd voor de verzekering van
      verzekerden, bedoeld in [artikel 1, onder o en p][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel1
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002516
        artikel: '1'
  - number: '11.2'
    text: |-
      Onze beide voornoemde Ministers stellen daarbij tevens vast naar welke regelen de premie wordt berekend, wie de
      premie verschuldigd is en welk orgaan deze int. Hierbij kunnen voorschriften worden gegeven ten aanzien van de
      vaststelling, de invordering, de afdracht en de verantwoording van de premie. Voorts kan voor één of meer van de
      hierbedoelde groepen worden bepaald, dat de premiebetaling zal geschieden door betaling ineens van een jaarlijks
      door Onze Minister en Onze Minister van Defensie vast te stellen bedrag.
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel11
  - number: 11a.1
    text: |-
      De verzekerde, bedoeld in [artikel 1, onder m of onder q][ref1], is premie verschuldigd overeenkomstig het in
      [artikel 15a, eerste lid, van de Ziekenfondswet][ref2] vastgestelde percentage over het inkomen, bedoeld in
      [artikel 3d, vierde lid, van de Ziekenfondswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel15a
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel3d
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0002516
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002460
        artikel: 15a
      - id: ref3
        bwb_id: BWBR0002460
        artikel: 3d
  - number: 11a.2
    text: |-
      Voor de toepassing van het eerste lid wordt ten aanzien van degene die krachtens
      [artikel 1, onder m of onder q][ref1], verzekerd is en die tevens ingevolge [artikel 3 van de Ziekenfondswet][ref2]
      verzekerd is, de reeds uit hoofde van [artikel 15, eerste lid, van de Ziekenfondswet][ref3] betaalde procentuele
      premie in mindering gebracht tot maximaal de ingevolge het eerste lid verschuldigde premie.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel15
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0002516
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0002460
        artikel: '15'
  - number: 11a.3
    text: |-
      [Artikel 15a, tweede, derde, vijfde en zesde lid, van de Ziekenfondswet][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel15a
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 15a
  - number: 11a.4
    text: |-
      De ontvanger van de rijksbelastingdienst stort de ingevolge dit artikel ontvangen bedragen in de Algemene Kas,
      bedoeld in [artikel 1q van de Ziekenfondswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1q
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 1q
  - number: 11b.1
    text: |-
      Voor de verzekering van verzekerden als bedoeld in [artikel 1, onder r][ref1], wordt van het uit te betalen
      pensioen een premie geheven tot het krachtens [artikel 15, eerste lid, van de Ziekenfondswet][ref2] vastgestelde
      percentage.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel15
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0002516
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '15'
  - number: 11b.2
    text: 'Voor de toepassing van het eerste lid wordt mede als uit te betalen pensioen aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel11b
  - number: 11b.2.a
    text: |-
      de bestanddelen van het pensioen ingevolge de bij of krachtens de [Kaderwet militaire pensioenen][ref1]
      vastgestelde bepalingen ter zake van ziekten of gebreken, de invaliditeitsverhoging, de bijzondere
      invaliditeitsverhoging, de tropenverhoging, de overlijdensuitkering, de aanpassing aan algemene
      bezoldigingswijzigingen en de toeslag op het pensioen ter zake van ziekten of gebreken beneden de leeftijd van
      65 jaar;


      [ref1]: https://wetten.overheid.nl/BWBR0011955
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0011955
  - number: 11b.2.b
    text: |-
      de toeslag, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      _________.


      [ref1]: https://wetten.overheid.nl/BWBR0003739#Artikel10
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0003739
        artikel: '10'
  - number: 11b.3
    text: |-
      Het bepaalde krachtens [artikel 15, tweede lid, van de Ziekenfondswet][ref1] en
      [artikel 9, tweede lid, van de Coördinatiewet Sociale Verzekering][ref2] is van overeenkomstige toepassing. Onze
      Minister van Defensie wordt als werkgever beschouwd en het pensioen wordt als loon aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002126#Artikel9
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002126
        artikel: '9'
  - number: 11b.4
    text: |-
      Onze Minister van Defensie houdt de door de verzekerde ingevolge dit artikel verschuldigde premie in op het
      pensioen.
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel11b
  - number: 11b.5
    text: |-
      De in het vierde lid bedoelde minister stort de in het eerste lid bedoelde premie in de Algemene Kas, bedoeld in
      [artikel 1q van de Ziekenfondswet][ref1]. Onze Minister en Onze Minister van Defensie tezamen kunnen voorschriften
      geven met betrekking tot de vaststelling, de invordering, de afdracht en de verantwoording van de premie.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1q
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 1q
  - number: '12.1'
    text: |-
      Voor de verzekering van verzekerden als bedoeld in [artikel 1, onder ][ref1], wordt van het
      pensioen, de vakantie-uitkering daaronder begrepen, een premie geheven tot het krachtens
      [artikel 15, eerste lid, van de Ziekenfondswet][ref2] vastgestelde percentage.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel15
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002516
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '15'
  - number: '12.2'
    text: |-
      Indien het pensioen slechts ten dele wordt uitbetaald wegens samenloop met wettelijke uitkeringen dan wel in
      verband met samenloop met uitkeringen ingevolge de sociale wetgeving van een andere mogendheid, wordt het pensioen
      voor de toepassing van het eerste lid geacht ten volle te zijn uitbetaald, voor zover over het bedrag van die
      aanspraken niet reeds premie wordt geheven.
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel12
  - number: '12.3'
    text: |-
      Het bepaalde krachtens [artikel 15, tweede lid, van de Ziekenfondswet][ref1] en artikel 9, tweede lid, van de
      Coördinatiewet Sociale Verzekering zijn van overeenkomstige toepassing. Het orgaan dat de pensioenuitkering doet,
      wordt als werkgever beschouwd en het pensioen wordt als loon aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel15
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '15'
  - number: '12.4'
    text: |-
      Het orgaan dat de pensioenuitkering doet, houdt de door de verzekerde ingevolge dit artikel verschuldigde premie in
      op het pensioen.
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel12
  - number: '12.5'
    text: |-
      Het in het vierde lid bedoelde orgaan stort de in het eerste lid bedoelde premie in de Algemene Kas, bedoeld in
      [artikel 1q van de Ziekenfondswet][ref1]. Onze Minister kan voorschriften geven met betrekking tot de vaststelling,
      de invordering, de afdracht en de verantwoording van de premie.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1q
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 1q
  - number: 12a.1
    text: |-
      Voor de verzekering op grond van de arbeidsongeschiktheidsuitkering krachtens de Wet
      arbeidsongeschiktheidsverzekering zelfstandigen dan wel de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten
      van degenen, bedoeld in [artikel 3, eerste lid, onder b, van de Ziekenfondswet][ref1], alsmede voor de verzekering
      van degenen, bedoeld in [artikel 1, onder ][ref2], wordt van de uit te betalen arbeidsongeschiktheidsuitkering
      welke de verzekerde heeft genoten in het tijdvak waarover de betaling loopt, een premie geheven tot het krachtens
      [artikel 15, eerste lid, van de Ziekenfondswet][ref3] vastgestelde percentage.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002516#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel15
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002516
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0002460
        artikel: '15'
  - number: 12a.2
    text: |-
      Voor de toepassing van het eerste lid worden mede als uit te betalen arbeidsongeschiktheidsuitkering aangemerkt
      de vakantie-uitkering, bedoeld in [artikel 26 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1]
      en [artikel 22 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref2], de toelage, bedoeld
      in artikel 58, eerste en derde lid, van de Algemene Arbeidsongeschiktheidswet, de toeslag op grond van de
      [Toeslagenwet][ref3], alsmede het bedrag, waarmee de arbeidsongeschiktheidsuitkering of genoemde vakantie-
      uitkering wordt beperkt in verband met samenloop met een uitkering op grond van de sociale wetgeving van een andere
      Mogendheid.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0008657
        artikel: '22'
      - id: ref3
        bwb_id: BWBR0004043
  - number: 12a.3
    text: |-
      Voor de toepassing van dit artikel is het bepaalde krachtens [artikel 15, tweede lid, van de Ziekenfondswet][ref1]
      van overeenkomstige toepassing, waarbij het orgaan dat de arbeidsongeschiktheidsuitkering doet als werkgever wordt
      beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel15
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '15'
  - number: 12a.4
    text: |-
      Voor de toepassing van dit artikel is artikel 9, tweede en tiende lid, van de Coördinatiewet Sociale
      Verzekering van overeenkomstige toepassing. Voor een verzekerde die tevens verzekerd is krachtens
      [artikel 3, eerste lid, onder ][ref1], uit hoofde van een arbeidsongeschiktheidsuitkering op grond van een
      verplichte verzekering ingevolge de Wet op de arbeidsongeschiktheidsverzekering, worden voor de toepassing van de
      vorige volzin de uitkeringen, bedoeld in dit artikel, samengeteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '3'
  - number: 12a.5
    text: |-
      Het orgaan dat de arbeidsongeschiktheidsuitkering doet, houdt de door de verzekerde ingevolge dit artikel
      verschuldigde premie in op de uitkering.
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel12a
  - number: 12a.6
    text: |-
      Het in het vijfde lid bedoelde orgaan stort de in het eerste lid bedoelde premie in de Algemene Kas, bedoeld in
      [artikel 1q van de Ziekenfondswet][ref1]. Onze Minister kan voorschriften geven met betrekking tot de vaststelling,
      de invordering, de afdracht en de verantwoording van de premie.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1q
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 1q
  - number: 12a.7
    text: |-
      Voor de toepassing van het eerste lid wordt ten aanzien van degene die naast een arbeidsongeschiktheidsuitkering
      ingevolge de sociale wetgeving van een andere Mogendheid met toepassing van [Verordening (EEG) nr. 1408/71]
      (31971R1408) van de Raad van 14 juni 1971 betreffende de toepassing van de sociale zekerheidsregelingen op
      werknemers en zelfstandigen, alsmede op hun gezinsleden, die zich binnen de Gemeenschap verplaatsen (PbEG
      L 149), of een door Nederland met een of meer andere staten gesloten verdrag inzake sociale zekerheid een
      aanvullende uitkering ingevolge de[ Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1] ontvangt,
      de som van de uitkering ingevolge de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2] en de
      arbeidsongeschiktheidsuitkering ingevolge de sociale wetgeving van die andere Mogendheid als grondslag voor de
      berekening van de verschuldigde ziekenfondspremie aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0008656
      [ref2]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0008656
      - id: ref2
        bwb_id: BWBR0008656
  - number: '13.1'
    text: |-
      Voor de verzekering van verzekerden als bedoeld in de [artikelen 1, onder x, onderdeel 1, en onder][ref1]
      aa, ff en 15c, eerste lid, wordt van de uitkering onderscheidenlijk vergoeding, herleid tot een bruto-
      bedrag, die zij hebben genoten in het tijdvak waarover de betaling loopt, een premie geheven tot het krachtens
      [artikel 15, eerste lid, van de Ziekenfondswet][ref2] vastgestelde percentage.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel15
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002516
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '15'
  - number: '13.2'
    text: |-
      Het bepaalde krachtens [artikel 15][ref1], tweede lid, en
      [artikel 15, derde, vierde en vijfde lid, van de Ziekenfondswet][ref2] zijn van overeenkomstige toepassing. Het
      orgaan dat de uitkering doet, wordt als werkgever beschouwd en de uitkering wordt als loon aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel15
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '15'
  - number: '13.3'
    text: |-
      Onze Minister kan voorschriften geven met betrekking tot de vaststelling, de invordering, de afdracht en de
      verantwoording van de premie.
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel13
  - number: '13.4'
    text: |-
      De ingevolge het eerste lid afgedragen premie kan niet worden teruggevorderd indien de in de vorm van een
      geldlening als bedoeld in [artikel 50 van de Wet werk en bijstand][ref1] verstrekte bijstand wordt afgelost.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel50
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '50'
  - number: 13a.1
    text: |-
      Voor de verzekering van degenen bedoeld in de [artikelen 1, onder x, onderdeel 2][ref1], en
      [15c, tweede lid][ref2], is door de werkgever een door Onze Minister vast te stellen premie verschuldigd, welke
      wordt gebaseerd op de landelijk gemiddelde jaarlijkse kosten van een ziekenfondsverzekerde.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002516#Artikel15c
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0002516
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002516
        artikel: 15c
  - number: 13a.2
    text: |-
      Voor de toepassing van dit artikel is [artikel 15, derde en vijfde lid, van de Ziekenfondswet][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel15
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '15'
  - number: 13a.3
    text: |-
      Onze Minister kan voorschriften geven met betrekking tot de invordering, de afdracht en de verantwoording van de
      premie.
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel13a
  - number: 13b
    text: |-
      Voor de verzekering van verzekerden als bedoeld in [artikel 1, onder y][ref1], wordt geen premie geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel1
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0002516
        artikel: '1'
  - number: 13c.1
    text: |-
      Voor de verzekering van degenen, bedoeld in [artikel 1, onderdeel][ref1] kk, onder 1, wordt over de bruto
      periodieke uitkering waarop de verzekerde aanspraak heeft ingevolge [artikel 4, eerste of vierde lid][ref2],
      of ingevolge [artikel 5 van de Remigratiewet][ref3], een premie geheven tot het krachtens
      [artikel 15, eerste lid, eerste volzin, van de Ziekenfondswet][ref4] vastgestelde percentage. Indien de periodieke
      uitkering slechts ten dele wordt uitbetaald wegens samenloop met wettelijke uitkeringen, wordt de uitkering voor
      de vaststelling van de verschuldigde premie geacht ten volle te zijn uitbetaald, voor zover over het bedrag van die
      andere wettelijke uitkeringen niet reeds premie wordt geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0010424#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0010424#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0002460#Artikel15
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel13c
    references:
      - id: ref1
        bwb_id: BWBR0002516
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0010424
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0010424
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0002460
        artikel: '15'
  - number: 13c.2
    text: |-
      Voor de verzekering van degenen, bedoeld in [artikel 1, onderdeel][ref1] kk, onder 2, wordt over de bruto
      periodieke uitkering waarop de verzekerde aanspraak heeft ingevolge [artikel 4, eerste of vierde lid][ref2],
      of [artikel 5 van de Remigratiewet][ref3], een premie geheven tot het krachtens [artikel 14, tweede lid][ref4],
      vastgestelde percentage. De tweede volzin van het eerste lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0010424#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0010424#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0002516#Artikel14
    url: https://wetten.overheid.nl/BWBR0002516/2004-09-29#Artikel13c
    references:
