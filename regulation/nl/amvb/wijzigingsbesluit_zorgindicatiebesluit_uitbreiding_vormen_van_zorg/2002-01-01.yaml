articles:
  - number: II
    text: |-
      Indien voor een verzekerde voor het tijdstip van de inwerkingtreding van [artikel I, onderdeel B][ref1], van dit
      besluit, overeenkomstig [artikel 9b, derde lid, van de Algemene Wet Bijzondere Ziektekosten][ref2] schriftelijk
      is vastgesteld dat hij is aangewezen op een vorm van zorg als bedoeld in de [artikelen 11][ref3], [12][ref4],
      [13][ref5] en [21 tot en met 25 van het Besluit zorgaanspraken bijzondere ziektekostenverzekering ][ref6]en
      de verzekerde op eerderbedoeld tijdstip zijn aanspraak op zorg nog niet tot gelding heeft gebracht, wordt
      die vaststelling tot twee jaar na dat tijdstip gelijkgesteld met een indicatiebesluit als bedoeld in
      [artikel 1, onder d, van het Zorgindicatiebesluit][ref7].


