  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 5 oktober 1993, no. J. 9315376,
    Directie Juridische en Bedrijfsorganisatorische Zaken;

    Gelet op Richtlijn nr. 89/556/EEG van de Raad van de Europese Gemeenschappen van 25 september 1989 tot vaststelling
    van veterinairrechtelijke voorschriften voor het intracommunautaire handelsverkeer in embryo's van als huisdier
    gehouden runderen en de invoer daarvan uit derde landen (PbEG L 302) en op Richtlijn nr. 92/65/EEG van de Raad van
    de Europese Gemeenschappen van 13 juli 1992 tot vaststelling van de veterinairrechtelijke voorschriften voor het
    handelsverkeer en de invoer in de Gemeenschap van dieren, sperma, eicellen en embryo's waarvoor ten aanzien van de
    veterinairrechtelijke voorschriften geen specifieke communautaire regelgeving als bedoeld in bijlage A, onder I,
    van Richtlijn 90/425/EEG geldt (PbEG L 268);

    Gelet op artikel 1, tweede lid, van de Gezondheids- en Welzijnswet voor dieren;

    Gezien het advies van de Raad voor dierenaangelegenheden en het Landbouwschap;

    De Raad van State gehoord (advies van 30 november 1993, No. W11.93.0664);

    Gezien het nader rapport van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 17 januari 1994, no.
    J.9319651, Directie Juridische en Bedrijfsorganisatorische Zaken;

    Hebben goedgevonden en verstaan:
