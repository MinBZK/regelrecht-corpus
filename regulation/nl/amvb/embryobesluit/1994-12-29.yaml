articles:
  - number: '1'
    text: |-
      Hetgeen bij of krachtens de [hoofdstukken II][ref1] en [VII][ref2] tot en met
      [IX van de Gezondheids- en welzijnswet voor dieren][ref3] met betrekking tot produkten of produkten van dierlijke
      oorsprong is bepaald, is van overeenkomstige toepassing op handelingen met embryo's voor zover deze zich buiten de
      baarmoeder van het dier bevinden.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005662#HoofdstukVII
      [ref3]: https://wetten.overheid.nl/BWBR0005662#HoofdstukIX
