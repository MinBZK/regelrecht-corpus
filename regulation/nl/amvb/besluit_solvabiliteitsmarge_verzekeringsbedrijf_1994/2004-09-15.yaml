  - number: '10'
    text: |-
      De in [artikel 6][ref1] bedoelde waarden worden overeenkomstig de [artikelen 8][ref2] en [9][ref3] in bewaring
      gegeven en wel, op straffe van schorsing van de behandeling van de aanvraag van de vergunning, bedoeld in
      [artikel 24, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref4], binnen vier weken nadat de Pensioen-
      & Verzekeringskamer de aanvraag heeft ontvangen.


