      1 Het minimum bedrag van de solvabiliteitsmarge, bedoeld in
      [artikel 68, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref1] bedraagt voor levensverzekeraars het
      totaal van de volgende berekeningen:

      a. voor verzekeringen waarbij door de verzekeraar beleggingsrisico wordt gelopen: vier procent van de bruto
      technische voorzieningen, vermenigvuldigd met de verhouding tussen de technische voorzieningen onder aftrek van
      de overdrachten uit hoofde van herverzekering en de bruto technische voorzieningen aan het eind van het afgelopen
      boekjaar: dit verhoudingsgetal bedraagt ten minste vijfentachtig procent;

      b. voor verzekeringen waarbij door de verzekeraar geen beleggingsrisico wordt gelopen en waarbij de beheerslasten
      voor een periode van meer dan vijf jaar zijn vastgelegd: een procent van de technische voorzieningen aan het einde
      van het boekjaar;

      c. voor verzekeringen waarbij door de verzekeraar geen beleggingsrisico wordt gelopen en waarbij de beheerslasten
      voor een periode van vijf jaar of minder zijn vastgelegd: vijfentwintig procent van de netto beheerslasten in
      verband met de bedrijfsuitoefening in het afgelopen boekjaar;

      d. voor spaarkassen: een procent van het vermogen van de spaarkassen;

      e. voor verzekeringen met risicokapitaal, te onderscheiden in:

        - tijdelijke verzekeringen met een contractsduur van ten hoogste drie jaar: 0,1 procent van het risicokapitaal
      bij overlijden;
        - tijdelijke verzekeringen met een contractsduur van meer dan drie jaar en ten hoogste vijf jaar: 0,15 procent van
      het risicokapitaal bij overlijden;
        - alle verzekeringen behalve tijdelijke verzekeringen met een contractsduur van ten hoogste vijf jaar: 0,3 procent
      van het risicokapitaal bij overlijden.

      De som van de aangegeven bedragen wordt vervolgens vermenigvuldigd met de verhouding tussen het risicokapitaal
      onder aftrek van de overdrachten uit hoofde van herverzekering en het risicokapitaal in het afgelopen boekjaar: dit
      verhoudingsgetal is ten minste vijftig procent;

      f. voor de aanvullende verzekeringen: de hoogste uitkomst van de volgende twee berekeningen:

      1º. Eerste berekening

      Achttien procent van de in het afgelopen boekjaar geboekte dan wel verdiende premies, naargelang welk bedrag het
      hoogst is en van de in rekening gebrachte poliskosten, voor zover deze premies en kosten niet meer bedragen dan
      € 50 miljoen, vermeerderd met zestien procent van deze premies en kosten voor zover deze meer bedragen dan € 50
      miljoen. De uitkomst van deze berekening wordt vermenigvuldigd met de verhouding tussen de schaden die voor eigen
      rekening komen van de verzekeraar na overdracht uit hoofde van herverzekering en de bruto schaden in de afgelopen
      drie boekjaren; dit verhoudingsgetal is ten minste vijftig procent.

      2º. Tweede berekening

      Zesentwintig procent van de gemiddeld geboekte bruto schaden in de afgelopen drie boekjaren en van de gemiddelde
      toevoeging aan de schadevoorziening in deze jaren, voor zover deze schaden en toevoeging niet meer bedragen dan
      € 35 miljoen, vermeerderd met drieëntwintig procent van deze schaden en toevoeging, voor zover deze meer bedragen
      dan € 35 miljoen. De uitkomst van deze berekening wordt vermenigvuldigd met de verhouding tussen de schaden die
      voor eigen rekening komen van de verzekeraar na overdracht uit hoofde van herverzekering en de bruto schaden in de
      afgelopen drie boekjaren; dit verhoudingsgetal is ten minste vijftig procent.

      2 Indien de hoogste uitkomst van de berekeningen in het eerste lid, onderdeel f, lager is dan in het afgelopen
      boekjaar, is de uitkomst ten minste gelijk aan de uitkomst van het afgelopen boekjaar vermenigvuldigd met de
      verhouding tussen de technische voorzieningen voor te betalen schaden onder aftrek van de overdrachten uit
      herverzekering aan het einde van het afgelopen boekjaar en de technische voorzieningen voor te betalen schaden
      onder aftrek van de overdrachten uit herverzekering aan het begin van het afgelopen boekjaar; dit verhoudingsgetal
      is ten hoogste honderd procent.

      3 De Pensioen- & Verzekeringskamer kan tegen de op herverzekering gebaseerde verlaging van het minimum bedrag van
      de solvabiliteitsmarge overeenkomstig het eerste lid, onderdelen a, e, laatste volzin, en f, en het tweede lid,
      bedenkingen naar voren brengen indien:

      a. de aard of de kwaliteit van de overdracht uit hoofde van herverzekering sinds het afgelopen boekjaar sterk is
      gewijzigd;

      b. er nauwelijks of geen risico-overdracht plaatsvindt uit hoofde van herverzekering.


