---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_solvabiliteitsmarge_verzekeringsbedrijf_1994
regulatory_layer: AMVB
publication_date: '2003-12-01'
valid_from: '2004-09-15'
bwb_id: BWBR0006733
url: https://wetten.overheid.nl/BWBR0006733/2004-09-15
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Financiën van 22 februari 1994, no. BGW 94-253, Generale Thesaurie, Directie
    Binnenlands Geldwezen, Afdeling Verzekeringswezen;

    Gelet op de artikelen 42, eerste lid, onderdeel e, 68, eerste, tweede en vierde lid, 187, eerste lid en 195, derde
    lid, van de Wet toezicht verzekeringsbedrijf 1993;

    Gezien de adviezen van de Verzekeringskamer en van het Verbond van Verzekeraars;

    De Raad van State gehoord (advies van 5 april 1994, no. W06.94.0096);

    Gezien het nader rapport van Onze Minister van Financiën van 2 juni 1994, no. BGW 94-428;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Het minimum bedrag van de solvabiliteitsmarge, bedoeld in
      [artikel 68, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref1] bedraagt voor schadeverzekeraars de
      hoogste uitkomst van de volgende twee berekeningen:


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel68
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '68'
  - number: 1.1.a
    text: |-
      Eerste berekening Achttien procent van de in het afgelopen boekjaar geboekte dan wel verdiende premies, naargelang
      welk bedrag het hoogst is en van de in rekening gebrachte poliskosten, indien en voorzover deze premies en kosten
      niet meer bedragen dan € 50 miljoen, vermeerderd met zestien procent van deze premies en kosten indien en voorzover
      deze meer bedragen dan tien miljoen euro. De uitkomst van deze berekening wordt vermenigvuldigd met de verhouding
      tussen de schaden die voor eigen rekening komen van de verzekeraar na overdracht uit hoofde van herverzekering en
      de bruto schaden in de afgelopen drie boekjaren; dit verhoudingsgetal is ten minste vijftig procent.
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel1
  - number: 1.1.b
    text: Tweede berekening
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel1
  - number: '1.2'
    text: |-
      Voor de branches Aansprakelijkheid luchtvaartuigen, Aansprakelijkheid zee- en binnenschepen en Algemene
      aansprakelijkheid worden de geboekte dan wel verdiende premies, bedoeld in het eerste lid, onderdeel a, eerste
      volzin, en de geboekte bruto schaden, bedoeld in het eerste lid, onderdeel b, eerste volzin, met vijftig procent
      verhoogd. De Pensioen- & Verzekeringskamer kan toestemmen in de toepassing van statistische methoden bij de
      toewijzing van de geboekte dan wel verdiende premies en geboekte bruto schaden aan de genoemde branches.
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel1
  - number: '1.3'
    text: |-
      Voor verzekeraars die in hoofdzaak één of meer van de risico's van krediet-, storm-, hagel- en vorstschade dekken,
      wordt in de berekening, bedoeld in het eerste lid, onderdeel *b*, uitgegaan van de afgelopen zeven boekjaren.
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel1
  - number: '1.4'
    text: |-
      Voor de branche Hulpverlening wordt voor het bedrag van de geboekte bruto schaden, bedoeld bij de berekening in het
      eerste lid, onderdeel *b*, uitgegaan van de voor de verzekeraar uit de verleende hulp voortvloeiende kosten.
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel1
  - number: '1.5'
    text: |-
      De berekeningen in dit artikel mogen worden verminderd tot een derde voor het gedeelte dat betrekking heeft op
      ziektekostenverzekeringen indien die verzekeringen op analoge wijze als levensverzekeringen worden beheerd en aan
      de volgende voorwaarden is voldaan:
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel1
  - number: 1.5.a
    text: de geheven premie wordt volgens verzekeringswiskundige methoden berekend;
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel1
  - number: 1.5.b
    text: er wordt een actuarieel berekende ouderdomsvoorziening gevormd;
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel1
  - number: 1.5.c
    text: er wordt een aanvullende premie geheven om een reële veiligheidsmarge te vormen;
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel1
  - number: 1.5.d
    text: de verzekeraar kan de overeenkomst alleen voor het einde van het derde verzekeringsjaar opzeggen;
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel1
  - number: 1.5.e
    text: |-
      in de overeenkomst is de mogelijkheid opgenomen om ook voor lopende contracten de premies te verhogen of de
      verstrekkingen te verminderen.
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel1
  - number: '1.6'
    text: |-
      Indien het minimum bedrag van de solvabiliteitsmarge zoals berekend overeenkomstig dit artikel lager is
      dan het minimum bedrag van de solvabiliteitsmarge in het afgelopen boekjaar, is het minimum bedrag van de
      solvabiliteitsmarge ten minste gelijk aan het minimum bedrag van de solvabiliteitsmarge van het afgelopen boekjaar
      vermenigvuldigd met de verhouding tussen de technische voorzieningen voor te betalen schaden onder aftrek van de
      overdrachten uit herverzekering aan het einde van het afgelopen boekjaar en de technische voorzieningen voor te
      betalen schaden onder aftrek van de overdrachten uit herverzekering aan het begin van het afgelopen boekjaar; dit
      verhoudingsgetal is ten hoogste honderd procent.
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel1
  - number: '1.7'
    text: |-
      De Pensioen- & Verzekeringskamer kan tegen de op herverzekering gebaseerde verlaging van het minimum bedrag van de
      solvabiliteitsmarge overeenkomstig het eerste lid, onderdeel a, tweede volzin, en onderdeel b, tweede volzin, en
      het zesde lid, bedenkingen naar voren brengen indien:
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel1
  - number: 1.7.a
    text: |-
      de aard of de kwaliteit van de overdracht uit hoofde van herverzekering sinds het afgelopen boekjaar sterk is
      gewijzigd;
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel1
  - number: 1.7.b
    text: er nauwelijks of geen risico-overdracht plaatsvindt uit hoofde van herverzekering.
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel1
  - number: '2.1'
    text: |-
      Het minimum bedrag van de solvabiliteitsmarge, bedoeld in
      [artikel 68, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref1] bedraagt voor levensverzekeraars het
      totaal van de volgende berekeningen:


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel68
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '68'
  - number: 2.1.a
    text: |-
      voor verzekeringen waarbij door de verzekeraar beleggingsrisico wordt gelopen: vier procent van de bruto
      technische voorzieningen, vermenigvuldigd met de verhouding tussen de technische voorzieningen onder aftrek van
      de overdrachten uit hoofde van herverzekering en de bruto technische voorzieningen aan het eind van het afgelopen
      boekjaar: dit verhoudingsgetal bedraagt ten minste vijfentachtig procent;
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel2
  - number: 2.1.b
    text: |-
      voor verzekeringen waarbij door de verzekeraar geen beleggingsrisico wordt gelopen en waarbij de beheerslasten voor
      een periode van meer dan vijf jaar zijn vastgelegd: een procent van de technische voorzieningen aan het einde van
      het boekjaar;
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel2
  - number: 2.1.c
    text: |-
      voor verzekeringen waarbij door de verzekeraar geen beleggingsrisico wordt gelopen en waarbij de beheerslasten voor
      een periode van vijf jaar of minder zijn vastgelegd: vijfentwintig procent van de netto beheerslasten in verband
      met de bedrijfsuitoefening in het afgelopen boekjaar;
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel2
  - number: 2.1.d
    text: 'voor spaarkassen: een procent van het vermogen van de spaarkassen;'
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel2
  - number: 2.1.e
    text: |-
      voor verzekeringen met risicokapitaal, te onderscheiden in: - tijdelijke verzekeringen met een contractsduur van
      ten hoogste drie jaar: 0,1 procent van het risicokapitaal bij overlijden;
        - tijdelijke verzekeringen met een contractsduur van meer dan drie jaar en ten hoogste vijf jaar: 0,15 procent van
      het risicokapitaal bij overlijden;
        - alle verzekeringen behalve tijdelijke verzekeringen met een contractsduur van ten hoogste vijf jaar: 0,3 procent
      van het risicokapitaal bij overlijden. De som van de aangegeven bedragen wordt vervolgens vermenigvuldigd met
      de verhouding tussen het risicokapitaal onder aftrek van de overdrachten uit hoofde van herverzekering en het
      risicokapitaal in het afgelopen boekjaar: dit verhoudingsgetal is ten minste vijftig procent;
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel2
  - number: 2.1.f
    text: 'voor de aanvullende verzekeringen: de hoogste uitkomst van de volgende twee berekeningen:'
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel2
  - number: 2.1.f.1º
    text: |-
      Eerste berekening Achttien procent van de in het afgelopen boekjaar geboekte dan wel verdiende premies, naargelang
      welk bedrag het hoogst is en van de in rekening gebrachte poliskosten, voor zover deze premies en kosten niet meer
      bedragen dan € 50 miljoen, vermeerderd met zestien procent van deze premies en kosten voor zover deze meer bedragen
      dan € 50 miljoen. De uitkomst van deze berekening wordt vermenigvuldigd met de verhouding tussen de schaden die
      voor eigen rekening komen van de verzekeraar na overdracht uit hoofde van herverzekering en de bruto schaden in de
      afgelopen drie boekjaren; dit verhoudingsgetal is ten minste vijftig procent.
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel2
  - number: 2.1.f.2º
    text: |-
      Tweede berekening Zesentwintig procent van de gemiddeld geboekte bruto schaden in de afgelopen drie boekjaren en
      van de gemiddelde toevoeging aan de schadevoorziening in deze jaren, voor zover deze schaden en toevoeging niet
      meer bedragen dan € 35 miljoen, vermeerderd met drieëntwintig procent van deze schaden en toevoeging, voor zover
      deze meer bedragen dan € 35 miljoen. De uitkomst van deze berekening wordt vermenigvuldigd met de verhouding tussen
      de schaden die voor eigen rekening komen van de verzekeraar na overdracht uit hoofde van herverzekering en de bruto
      schaden in de afgelopen drie boekjaren; dit verhoudingsgetal is ten minste vijftig procent.
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel2
  - number: '2.2'
    text: |-
      Indien de hoogste uitkomst van de berekeningen in het eerste lid, onderdeel f, lager is dan in het afgelopen
      boekjaar, is de uitkomst ten minste gelijk aan de uitkomst van het afgelopen boekjaar vermenigvuldigd met de
      verhouding tussen de technische voorzieningen voor te betalen schaden onder aftrek van de overdrachten uit
      herverzekering aan het einde van het afgelopen boekjaar en de technische voorzieningen voor te betalen schaden
      onder aftrek van de overdrachten uit herverzekering aan het begin van het afgelopen boekjaar; dit verhoudingsgetal
      is ten hoogste honderd procent.
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel2
  - number: '2.3'
    text: |-
      De Pensioen- & Verzekeringskamer kan tegen de op herverzekering gebaseerde verlaging van het minimum bedrag van
      de solvabiliteitsmarge overeenkomstig het eerste lid, onderdelen a, e, laatste volzin, en f, en het tweede lid,
      bedenkingen naar voren brengen indien:
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel2
  - number: 2.3.a
    text: |-
      de aard of de kwaliteit van de overdracht uit hoofde van herverzekering sinds het afgelopen boekjaar sterk is
      gewijzigd;
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel2
  - number: 2.3.b
    text: er nauwelijks of geen risico-overdracht plaatsvindt uit hoofde van herverzekering.
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel2
  - number: '3.1'
    text: 'De solvabiliteitsmarge wordt met name gevormd door de volgende vermogensbestanddelen:'
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel3
  - number: 3.1.a
    text: het gestorte aandelenkapitaal of waarborgkapitaal vermeerderd met de ledenrekeningen;
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel3
  - number: 3.1.b
    text: de helft van het obligo van het geplaatste kapitaal of van het in aandelen verdeeld waarborgkapitaal;
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel3
  - number: 3.1.c
    text: de reserves;
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel3
  - number: 3.1.d
    text: de onverdeelde winst dan wel het verlies;
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel3
  - number: 3.1.e
    text: |-
      de suppletiebijdragen die onderlinge waarborgmaatschappijen die het schadeverzekeringsbedrijf uitoefenen, uit
      hoofde van het boekjaar krachtens de statuten van hun leden kunnen eisen;
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel3
  - number: 3.1.f
    text: |-
      de meerwaarden in verband met de onderwaardering van activa dan wel op grond van winstverwachtingen van
      levensverzekeraars;
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel3
  - number: 3.1.g
    text: het cumulatief preferent aandelenkapitaal;
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel3
  - number: 3.1.h
    text: de achtergestelde leningen;
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel3
  - number: 3.1.i
    text: de effecten met onbepaalde looptijd en andere vermogensinstrumenten.
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel3
  - number: '3.2'
    text: |-
      Ten aanzien van de vermogensbestanddelen, bedoeld in het eerste lid, worden de volgende voorwaarden in acht
      genomen:
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel3
  - number: 3.2.a
    text: |-
      de ledenrekeningen hebben statutair een achtergesteld karakter; de statuten bepalen dat: - vanaf deze rekeningen
      alleen betalingen aan de leden plaatsvinden als daardoor de solvabiliteitsmarge niet daalt beneden het vereiste
      niveau, dan wel bij liquidatie van de verzekeraar als alle andere schulden zijn voldaan;
        - elke betaling vanaf deze ledenrekeningen voor andere doeleinden dan voor de individuele opzegging van het
      lidmaatschap niet eerder plaatsvindt dan dertig dagen na melding ervan aan de Pensioen- & Verzekeringskamer:
      de Pensioen- & Verzekeringskamer kan tegen deze voorgenomen betaling bedenkingen naar voren brengen aan welke
      bedenkingen de verzekeraar dient tegemoet te komen;
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel3
  - number: 3.2.b
    text: |-
      wijzigingen van de statutaire bepalingen met betrekking tot de ledenrekeningen bedoeld in onderdeel *a*., moeten
      zijn toegestaan door de Pensioen- & Verzekeringskamer;
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel3
  - number: 3.2.c
    text: |-
      de helft van het obligo van het geplaatste kapitaal of van het in aandelen verdeeld waarborgkapitaal kan alleen
      na toestemming van de Pensioen- & Verzekeringskamer worden meegeteld tot een maximum van vijftig procent van het
      totaal van de aanwezige solvabiliteitsmarge of de vereiste solvabiliteitsmarge, naargelang welk bedrag het laagst
      is, indien van het geplaatste kapitaal minimaal vijfentwintig procent is gestort;
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel3
  - number: 3.2.d
    text: |-
      de suppletiebijdragen kunnen na toestemming van de Pensioen- & Verzekeringskamer worden meegeteld tot maximaal
      vijftig procent van het verschil tussen de maximumbijdragen en de werkelijk gevorderde bedragen en tot een maximum
      van vijftig procent van het totaal van de aanwezige solvabiliteitsmarge of de vereiste solvabiliteitsmarge,
      naargelang welk bedrag het laagst is; de Pensioen- & Verzekeringskamer stelt nadere regels betreffende de
      voorwaarden waaronder de suppletiebijdragen kunnen worden meegeteld;
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel3
  - number: 3.2.e
    text: |-
      de meerwaarden worden slechts meegeteld na toestemming van de Pensioen- & Verzekeringskamer, met dien verstande
      dat maximaal vijftig procent van de meerwaarden op grond van winstverwachtingen van levensverzekeraars kan worden
      meegeteld tot een maximum van vijfentwintig procent van het totaal van de aanwezige solvabiliteitsmarge of de
      vereiste solvabiliteitsmarge, naargelang welk bedrag het laagst is;
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel3
  - number: 3.2.f
    text: |-
      het cumulatief preferent aandelenkapitaal en de achtergestelde leningen kunnen worden meegeteld tot een maximum van
      vijftig procent van het totaal van de aanwezige solvabiliteitsmarge of de vereiste solvabiliteitsmarge, naargelang
      welk bedrag het laagst is, met dien verstande dat cumulatief preferent aandelenkapitaal en achtergestelde leningen
      met vaste looptijd kunnen worden meegeteld tot maximaal vijfentwintig procent van deze solvabiliteitsmarge,
      voorzover aan de volgende voorwaarden is voldaan: - vorderingen uit hoofde van achtergestelde leningen worden
      achtergesteld bij de vorderingen van alle andere crediteuren;
        - van de achtergestelde leningen worden alleen de gestorte bedragen in aanmerking genomen;
        - een achtergestelde lening met een vaste looptijd heeft een oorspronkelijke looptijd van ten minste vijf jaar; ten
      minste een jaar voor de contractuele vervaldag legt de verzekeraar een plan ter toestemming voor aan de Pensioen-
      & Verzekeringskamer waarin wordt uiteengezet op welke wijze de solvabiliteitsmarge zal worden gehandhaafd of op de
      vervaldag op het vereiste niveau zal worden gebracht;
        - de achtergestelde lening zonder vaste looptijd kan slechts worden afgelost met een opzeggingstermijn van vijf
      jaar, tenzij de lening niet langer als bestanddeel van de solvabiliteitsmarge wordt aangemerkt of de Pensioen- &
      Verzekeringskamer de aflossing heeft toegestaan; het verzoek om die toestemming wordt ten minste zes maanden voor
      de beoogde aflossingsdatum bij de Pensioen- & Verzekeringskamer ingediend;
        - de leningsovereenkomst bevat geen bepaling op grond waarvan de achtergestelde lening voor het einde van de
      looptijd, anders dan bij liquidatie van de onderneming, moet worden afgelost;
        - wijzigingen in de leningsovereenkomst worden pas aangebracht na toestemming van de Pensioen- & Verzekeringskamer;
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel3
  - number: 3.2.g
    text: |-
      effecten met onbepaalde looptijd en andere vermogensinstrumenten worden voor het totaal van deze effecten en van
      de achtergestelde leningen als bedoeld in het eerste lid, onderdeel *h*, meegeteld tot een maximum van vijftig
      procent van het totaal van de aanwezige solvabiliteitsmarge of de vereiste solvabiliteitsmarge, naargelang welk
      bedrag het laagst is, voorzover aan de volgende voorwaarden is voldaan: - de aflossing op deze effecten en andere
      vermogensinstrumenten vindt alleen plaats na toestemming van de Pensioen- & Verzekeringskamer;
        - in de emissie-overeenkomst is vastgelegd dat de verzekeraar de rentebetaling kan uitstellen;
        - de vorderingen op de verzekeraar uit hoofde van genoemde effecten zijn achtergesteld ten opzichte van overige
      vorderingen;
        - in de emissie-overeenkomst is vastgelegd dat verliezen kunnen worden gecompenseerd met het bedrag van de lening
      en de nog te betalen rente;
        - alleen de gestorte bedragen worden in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel3
  - number: '3.3'
    text: |-
      De solvabiliteitsmarge, bedoeld in het eerste lid, wordt voor schadeverzekeraars, die overeenkomstig
      [artikel 3, derde lid, van het Besluit technische voorzieningen verzekeringsbedrijf 1994][ref1] tot discontering
      van hun technische voorzieningen voor te betalen schaden overgaan om met de opbrengsten uit beleggingen rekening
      te houden, verminderd met het verschil tussen de niet-gedisconteerde technische voorzieningen en de gedisconteerde
      technische voorzieningen voor alle risico's die geen verband houden met de branches Ongevallen en Ziekte, met
      dien verstande dat geen correctie behoeft te worden toegepast voor discontering van in de technische voorziening
      opgenomen renten.


      [ref1]: https://wetten.overheid.nl/BWBR0006732#Artikel3
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006732
        artikel: '3'
  - number: '4.1'
    text: |-
      Het minimum bedrag van het garantiefonds, bedoeld in
      [artikel 68, tweede lid, van de Wet toezicht verzekeringsbedrijf 1993][ref1], beloopt:


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel68
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '68'
  - number: 4.1.a
    text: voor schadeverzekeraars € 2 miljoen, behoudens het gestelde in onderdeel b;
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel4
  - number: 4.1.b
    text: |-
      voor de branches Aansprakelijkheid motorrijtuigen, Aansprakelijkheid wegvervoer, Aansprakelijkheid luchtvaartuigen,
      Aansprakelijkheid zee- en binnenschepen, Algemene aansprakelijkheid en Krediet en Borgtocht € 3 miljoen.
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel4
  - number: '4.2'
    text: |-
      Het minimum bedrag van het garantiefonds, bedoeld in
      [artikel 68, tweede lid, van de Wet toezicht verzekeringsbedrijf 1993][ref1], beloopt voor levensverzekeraars €
      3 miljoen.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel68
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '68'
  - number: '4.3'
    text: |-
      De in het eerste lid, onderdelen a en b, en tweede lid genoemde bedragen, alsmede de bedragen genoemd in
      [artikel 1, onderdelen a en b][ref1], worden jaarlijks automatisch aangepast aan de procentuele wijziging van
      het door Eurostat bekendgemaakte Europese indexcijfer van de consumptieprijzen, en afgerond op een veelvoud van
      € 100 000. Indien deze wijziging sinds de laatste aanpassing minder dan vijf procent bedraagt, blijft aanpassing
      achterwege.


      [ref1]: https://wetten.overheid.nl/BWBR0006733#Artikel1
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006733
        artikel: '1'
        hoofdstuk: I
  - number: '4.4'
    text: |-
      Van de door de Europese Commissie aan het Europees Parlement en de Raad van de Europese Unie jaarlijks
      kennisgegeven aanpassing en de aangepaste bedragen doet de Pensioen- & Verzekeringskamer onverwijld mededeling in
      de Staatscourant. De aangepaste bedragen worden voor het eerst toegepast in het boekjaar dat begint op 1 januari
      van het volgende kalenderjaar of gedurende het volgende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel4
  - number: '5'
    text: |-
      Het garantiefonds wordt, met inachtneming van de voorwaarden, genoemd in [artikel 3, tweede en derde lid][ref1],
      gevormd door de vermogensbestanddelen, genoemd in [artikel 3, eerste lid, onderdelen a, c, d, f][ref2], voor zover
      het betreft de meerwaarden in verband met de onderwaardering van activa, en g tot en met i.


      [ref1]: https://wetten.overheid.nl/BWBR0006733#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006733#Artikel3
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006733
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0006733
        artikel: '3'
        hoofdstuk: II
  - number: '6'
    text: |-
      Tot dekking van het in [artikel 42, eerste lid, onderdeel ][ref1] bedoelde minimum bedrag van het garantiefonds
      kunnen slechts de volgende, door de verzekeraar voor eigen rekening aangehouden waarden dienen:


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel42
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '42'
  - number: 6.a
    text: schatkistpapier ten laste van de Staat der Nederlanden;
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel6
  - number: 6.b
    text: aandelen, schuldbrieven, winst-, oprichtings- en optiebewijzen, warrants en soortgelijke waardepapieren;
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel6
  - number: 6.c
    text: bewijzen van rechten van deelgenootschap;
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel6
  - number: 6.d
    text: certificaten van waarden, bedoeld in de onderdelen *b* en *c*;
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel6
  - number: 6.e
    text: recepissen van waarden, bedoeld in de onderdelen *a* tot en met *c*;
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel6
  - number: 6.f
    text: |-
      schuldbekentenissen jegens de verzekeraar, niet zijnde schatkistpapier of schuldbrieven, ten laste van of
      rechtstreeks en onvoorwaardelijk voor rente en aflossing gewaarborgd door de Staat of andere Nederlandse openbare
      lichamen;
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel6
  - number: 6.g
    text: |-
      schuldbekentenissen jegens de verzekeraar, niet zijnde schuldbrieven, ten laste van in Nederland gevestigde
      naamloze vennootschappen of ten laste van een ingevolge [artikel 52, tweede lid, onderdelen ][ref1] geregistreerde
      kredietinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel52
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '52'
  - number: '7'
    text: |-
      De waardering en de spreiding van de waarden, bedoeld in [artikel 6][ref1], moeten zijn toegestaan door de
      Pensioen- & Verzekeringskamer.


      [ref1]: https://wetten.overheid.nl/BWBR0006733#Artikel6
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006733
        artikel: '6'
        hoofdstuk: III
  - number: '8'
    text: |-
      Met betrekking tot de schuldbekentenissen, bedoeld in [artikel 6, onderdelen ][ref1], geldt dat uit deze
      schuldbekentenissen dan wel uit een afzonderlijke schriftelijke overeenkomst moet blijken:


      [ref1]: https://wetten.overheid.nl/BWBR0006733#Artikel6
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006733
        artikel: '6'
        hoofdstuk: III
  - number: 8.a
    text: |-
      dat ten aanzien van de schuldvordering waarvan uit de schuldbekentenis blijkt, geen overeenkomst wordt gesloten
      noch enige andere rechtshandeling wordt verricht zonder toestemming van de Pensioen- & Verzekeringskamer;
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel8
  - number: 8.b
    text: |-
      dat overeengekomen aflossingen en rentebetaling niet zonder toestemming van de Pensioen- & Verzekeringskamer
      geschieden, wanneer de Pensioen- & Verzekeringskamer dat aan de schuldenaar heeft verboden;
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel8
  - number: 8.c
    text: |-
      dat extra aflossingen en vervroegde rentebetalingen niet geschieden zonder toestemming van de Pensioen- &
      Verzekeringskamer;
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel8
  - number: 8.d
    text: |-
      dat aflossingen en rentebetalingen, verricht in strijd met de onderdelen *b* en *c*, niet in mindering komen op
      de schuldvordering;
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel8
  - number: 8.e
    text: dat de schuldenaar zich niet op verrekening zal beroepen.
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel8
  - number: '9.1'
    text: |-
      De in [artikel 6][ref1] bedoelde waarden worden in open bewaring gegeven bij De Nederlandsche Bank N.V. of bij een
      ingevolge [artikel 52, tweede lid, onderdelen ][ref2] geregistreerde kredietinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0006733#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel52
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006733
        artikel: '6'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '52'
  - number: '9.2'
    text: |-
      De verzekeraar kan met de in het eerste lid bedoelde bewaarneemster overeenkomen dat deze bij haar in bewaring
      gegeven waarden op naam van de verzekeraar mag overdragen aan een effectenbewaarinstelling die rechtspersoon is,
      mits:
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel9
  - number: 9.2.a
    text: de nakoming van de verplichtingen van de effectenbewaarinstelling door haar is gewaarborgd, en
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel9
  - number: 9.2.b
    text: |-
      de effectenbewaarinstelling zich heeft verplicht om hetzij die waarden hetzij een gelijke hoeveelheid waarden van
      dezelfde soort op naam van de verzekeraar in haar voorraad aanwezig te houden en na beëindiging van de overeenkomst
      tussen de verzekeraar en de bewaarneemster af te geven aan de verzekeraar.
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel9
  - number: '9.3'
    text: |-
      De waarden worden in Nederland bewaard. De bewaarneemster of effectenbewaarinstelling draagt zelfstandig zorg voor
      verkrijging van nieuwe coupon- en dividendbladen en voor bewaargeving tot het bijwonen van vergaderingen door de
      verzekeraar.
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel9
  - number: '9.4'
    text: |-
      Zonder toestemming van de Pensioen- & Verzekeringskamer worden de waarden niet aan de verzekeraar afgegeven en
      zullen ten aanzien daarvan geen rechtshandelingen worden verricht. De bewaarneemster of effectenbewaarinstelling
      mag evenwel coupons en dividendbewijzen, mits niet vroeger dan veertien dagen voor de dag der betaalbaarstelling,
      zonder toestemming van de Pensioen- & Verzekeringskamer aan de verzekeraar afgeven, tenzij de Pensioen- &
      Verzekeringskamer haar dit heeft verboden. De Pensioen- & Verzekeringskamer maakt dit verbod onmiddellijk aan de
      verzekeraar bekend.
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel9
  - number: '9.5'
    text: 'De waarden worden op verzoek van de Pensioen- & Verzekeringskamer aan haar ter bewaring afgegeven, indien:'
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel9
  - number: 9.5.a
    text: de registratie van de kredietinstelling is doorgehaald, of
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel9
  - number: 9.5.b
    text: |-
      de bewaarneemster de overeenkomst met de verzekeraar beëindigt dan wel de nakoming van de verplichtingen van de
      effectenbewaarinstelling niet langer waarborgt.
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel9
  - number: '9.6'
    text: |-
      Vanaf de dertigste dag na de afgifte, bedoeld in het vijfde lid, kan de Pensioen- & Verzekeringskamer de waarden
      overeenkomstig dit artikel in bewaring geven op kosten van de verzekeraar.
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel9
  - number: '10'
    text: |-
      De in [artikel 6][ref1] bedoelde waarden worden overeenkomstig de [artikelen 8][ref2] en [9][ref3] in bewaring
      gegeven en wel, op straffe van schorsing van de behandeling van de aanvraag van de vergunning, bedoeld in
      [artikel 24, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref4], binnen vier weken nadat de Pensioen-
      & Verzekeringskamer de aanvraag heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0006733#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006733#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0006733#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0006509#Artikel24
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006733
        artikel: '6'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0006733
        artikel: '8'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0006733
        artikel: '9'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0006509
        artikel: '24'
  - number: '11'
    text: |-
      Het bedrag, bedoeld in [artikel 195, derde lid, van de Wet toezicht verzekeringsbedrijf 1993][ref1], beloopt
      € 205 000.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel195
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '195'
  - number: 11a.1
    text: |-
      Het bedrag van de boete, bedoeld in
      [artikel 188d, vijfde lid, eerste volzin, van de Wet toezicht verzekeringsbedrijf 1993][ref1], wordt bepaald op de
      wijze, voorzien in de bijlage bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel188d
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: 188d
  - number: 11a.2
    text: |-
      De Pensioen- & Verzekeringskamer kan het bedrag van de boete lager stellen dan in de bijlage is bepaald, indien het
      bedrag van de boete in een bepaald geval op grond van bijzondere omstandigheden onevenredig hoog is.
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel11a
  - number: '12.1'
    text: |-
      De in [artikel 6][ref1] bedoelde waarden die zijn gedeponeerd overeenkomstig het Besluit diverse financiële eisen
      verzekeringsbedrijf gelden als waarden, aan te houden ingevolge dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006733#Artikel6
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006733
        artikel: '6'
        hoofdstuk: III
  - number: '12.2'
    text: |-
      De rechtshandelingen en rechtsgevolgen, verricht of ingetreden krachtens het besluit, genoemd in het eerste lid,
      worden beschouwd te zijn verricht of ingetreden krachtens dit besluit.
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel12
  - number: '13'
    text: Dit besluit treedt in werking met ingang van 1 juli 1994.
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel13
  - number: '14'
    text: 'Dit besluit wordt aangehaald als: Besluit solvabiliteitsmarge verzekeringsbedrijf 1994.'
    url: https://wetten.overheid.nl/BWBR0006733/2004-09-15#Artikel14
