      1 Het minimum bedrag van het garantiefonds, bedoeld in
      [artikel 68, tweede lid, van de Wet toezicht verzekeringsbedrijf 1993][ref1], beloopt:

      a. voor schadeverzekeraars € 2 miljoen, behoudens het gestelde in onderdeel b;

      b. voor de branches Aansprakelijkheid motorrijtuigen, Aansprakelijkheid wegvervoer, Aansprakelijkheid
      luchtvaartuigen, Aansprakelijkheid zee- en binnenschepen, Algemene aansprakelijkheid en Krediet en Borgtocht €
      3 miljoen.

      2 Het minimum bedrag van het garantiefonds, bedoeld in
      [artikel 68, tweede lid, van de Wet toezicht verzekeringsbedrijf 1993][ref2], beloopt voor levensverzekeraars €
      3 miljoen.

      3 De in het eerste lid, onderdelen a en b, en tweede lid genoemde bedragen, alsmede de bedragen genoemd in
      [artikel 1, onderdelen a en b][ref3], worden jaarlijks automatisch aangepast aan de procentuele wijziging van
      het door Eurostat bekendgemaakte Europese indexcijfer van de consumptieprijzen, en afgerond op een veelvoud van
      € 100 000. Indien deze wijziging sinds de laatste aanpassing minder dan vijf procent bedraagt, blijft aanpassing
      achterwege.

      4 Van de door de Europese Commissie aan het Europees Parlement en de Raad van de Europese Unie jaarlijks
      kennisgegeven aanpassing en de aangepaste bedragen doet de Pensioen- & Verzekeringskamer onverwijld mededeling in
      de Staatscourant. De aangepaste bedragen worden voor het eerst toegepast in het boekjaar dat begint op 1 januari
      van het volgende kalenderjaar of gedurende het volgende kalenderjaar.


