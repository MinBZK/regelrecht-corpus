    text: |-
      1 Het minimum bedrag van de solvabiliteitsmarge, bedoeld in
      [artikel 68, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref1] bedraagt voor schadeverzekeraars de
      hoogste uitkomst van de volgende twee berekeningen:

      a. Eerste berekening

      Achttien procent van de in het afgelopen boekjaar geboekte dan wel verdiende premies, naargelang welk bedrag
      het hoogst is en van de in rekening gebrachte poliskosten, indien en voorzover deze premies en kosten niet meer
      bedragen dan € 50 miljoen, vermeerderd met zestien procent van deze premies en kosten indien en voorzover deze meer
      bedragen dan tien miljoen euro. De uitkomst van deze berekening wordt vermenigvuldigd met de verhouding tussen de
      schaden die voor eigen rekening komen van de verzekeraar na overdracht uit hoofde van herverzekering en de bruto
      schaden in de afgelopen drie boekjaren; dit verhoudingsgetal is ten minste vijftig procent.

      b. Tweede berekening

      Zesentwintig procent van de gemiddeld geboekte bruto schaden in de afgelopen drie boekjaren en van de gemiddelde
      toevoeging aan de schadevoorziening in deze jaren, indien en voorzover deze schaden en toevoeging niet meer
      bedragen dan € 35 miljoen, vermeerderd met drieëntwintig procent van deze schaden en toevoeging, indien en
      voorzover deze meer bedragen dan € 35 miljoen. De uitkomst van deze berekening wordt vermenigvuldigd met de
      verhouding tussen de schaden die voor eigen rekening komen van de verzekeraar na overdracht uit hoofde van
      herverzekering en de bruto schaden in de afgelopen drie boekjaren; dit verhoudingsgetal is ten minste vijftig
      procent.

      2 Voor de branches Aansprakelijkheid luchtvaartuigen, Aansprakelijkheid zee- en binnenschepen en Algemene
      aansprakelijkheid worden de geboekte dan wel verdiende premies, bedoeld in het eerste lid, onderdeel a, eerste
      volzin, en de geboekte bruto schaden, bedoeld in het eerste lid, onderdeel b, eerste volzin, met vijftig procent
      verhoogd. De Pensioen- & Verzekeringskamer kan toestemmen in de toepassing van statistische methoden bij de
      toewijzing van de geboekte dan wel verdiende premies en geboekte bruto schaden aan de genoemde branches.

      3 Voor verzekeraars die in hoofdzaak één of meer van de risico's van krediet-, storm-, hagel- en vorstschade
      dekken, wordt in de berekening, bedoeld in het eerste lid, onderdeel *b*, uitgegaan van de afgelopen zeven
      boekjaren.

      4 Voor de branche Hulpverlening wordt voor het bedrag van de geboekte bruto schaden, bedoeld bij de berekening in
      het eerste lid, onderdeel *b*, uitgegaan van de voor de verzekeraar uit de verleende hulp voortvloeiende kosten.

      5 De berekeningen in dit artikel mogen worden verminderd tot een derde voor het gedeelte dat betrekking heeft op
      ziektekostenverzekeringen indien die verzekeringen op analoge wijze als levensverzekeringen worden beheerd en aan
      de volgende voorwaarden is voldaan:

      a. de geheven premie wordt volgens verzekeringswiskundige methoden berekend;

      b. er wordt een actuarieel berekende ouderdomsvoorziening gevormd;

      c. er wordt een aanvullende premie geheven om een reële veiligheidsmarge te vormen;

      d. de verzekeraar kan de overeenkomst alleen voor het einde van het derde verzekeringsjaar opzeggen;

      e. in de overeenkomst is de mogelijkheid opgenomen om ook voor lopende contracten de premies te verhogen of de
      verstrekkingen te verminderen.

      6 Indien het minimum bedrag van de solvabiliteitsmarge zoals berekend overeenkomstig dit artikel lager is
      dan het minimum bedrag van de solvabiliteitsmarge in het afgelopen boekjaar, is het minimum bedrag van de
      solvabiliteitsmarge ten minste gelijk aan het minimum bedrag van de solvabiliteitsmarge van het afgelopen boekjaar
      vermenigvuldigd met de verhouding tussen de technische voorzieningen voor te betalen schaden onder aftrek van de
      overdrachten uit herverzekering aan het einde van het afgelopen boekjaar en de technische voorzieningen voor te
      betalen schaden onder aftrek van de overdrachten uit herverzekering aan het begin van het afgelopen boekjaar; dit
      verhoudingsgetal is ten hoogste honderd procent.

      7 De Pensioen- & Verzekeringskamer kan tegen de op herverzekering gebaseerde verlaging van het minimum bedrag van
      de solvabiliteitsmarge overeenkomstig het eerste lid, onderdeel a, tweede volzin, en onderdeel b, tweede volzin, en
      het zesde lid, bedenkingen naar voren brengen indien:

      a. de aard of de kwaliteit van de overdracht uit hoofde van herverzekering sinds het afgelopen boekjaar sterk is
      gewijzigd;

      b. er nauwelijks of geen risico-overdracht plaatsvindt uit hoofde van herverzekering.


