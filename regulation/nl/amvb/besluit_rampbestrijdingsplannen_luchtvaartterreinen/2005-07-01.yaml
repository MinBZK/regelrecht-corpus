---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_rampbestrijdingsplannen_luchtvaartterreinen
regulatory_layer: AMVB
publication_date: '2010-04-01'
valid_from: '2005-07-01'
bwb_id: BWBR0012703
url: https://wetten.overheid.nl/BWBR0012703/2005-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties, directoraat-generaal voor
    Openbare Orde en Veiligheid, in overeenstemming met Onze Minister van Verkeer en Waterstaat en de Staatssecretaris
    van Defensie, van 13 december 2000, nr. EB2000/101589;

    Gelet op artikel 7, derde lid, van de Wet rampen en zware ongevallen;

    De Raad van State gehoord (advies van 16 maart 2001, nr. W04.00.0605/I);

    Gezien het nader rapport van de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties, directoraat-
    generaal voor Openbare Orde en Veiligheid, uitgebracht in overeenstemming met Onze Minister van Verkeer en
    Waterstaat en de Staatssecretaris van Defensie, van 7 juli 2001, nr. EB2001/61597;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0012703/2005-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0012703/2005-07-01#Artikel1
  - number: 1.a
    text: |-
      luchtvaartterrein: een luchtvaartterrein dat op grond van de Brandweerregeling burgerluchtvaartterreinen is
      ingedeeld in brandrisicoklasse 3 of hoger en de door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties in
      overleg met Onze Minister van Defensie daarmee gelijkgestelde militaire luchtvaartterreinen;
    url: https://wetten.overheid.nl/BWBR0012703/2005-07-01#Artikel1
  - number: 1.b
    text: |-
      onmiddellijke omgeving van het luchtvaartterrein: een op grond van artikel 1, onderdeel j, van de Brandweerregeling
      burgerluchtvaartterreinen door de exploitant van het burgerluchtvaartterrein of op grond van de aan de
      basiscommandant van het militaire luchtvaartterrein gerichte instructie in overleg met het gemeentebestuur
      vastgesteld gebied buiten het luchtvaartterrein;
    url: https://wetten.overheid.nl/BWBR0012703/2005-07-01#Artikel1
  - number: 1.c
    text: |-
      alarmregeling: de alarmregeling, bedoeld in artikel 1, onderdeel a, van de Brandweerregeling
      burgerluchtvaartterreinen en het daarmee gelijk te stellen calamiteitenplan voor militaire luchtvaartterreinen.
    url: https://wetten.overheid.nl/BWBR0012703/2005-07-01#Artikel1
  - number: '2.1'
    text: |-
      De burgemeester stelt, na overleg met de exploitant, bedoeld in
      [artikel 1, onderdeel d, van de Luchtvaartwet][ref1], respectievelijk de basiscommandant van het militaire
      luchtvaartterrein, een rampbestrijdingsplan vast voor vliegtuigongevallen op luchtvaartterreinen en de
      onmiddellijke omgeving daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel1
    url: https://wetten.overheid.nl/BWBR0012703/2005-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '1'
  - number: '2.2'
    text: |-
      [Afdeling 3.4 van de Algemene wet bestuursrecht](onbekend) is van toepassing op de vaststelling van het
      rampbestrijdingsplan.
    url: https://wetten.overheid.nl/BWBR0012703/2005-07-01#Artikel2
  - number: '2.3'
    text: |-
      De burgemeester zendt het rampbestrijdingsplan met betrekking tot luchtvaartterreinen als bedoeld in artikel 5,
      tweede lid, van de Brandweerregeling burgerluchtvaartterreinen aan Onze Minister van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0012703/2005-07-01#Artikel2
  - number: '2.4'
    text: |-
      Een rampbestrijdingsplan als bedoeld in het eerste lid wordt uiterlijk een jaar na inwerkingtreding van dit besluit
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012703/2005-07-01#Artikel2
  - number: '3'
    text: 'Het rampbestrijdingsplan bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0012703/2005-07-01#Artikel3
  - number: 3.a
    text: |-
      de functies van de aan het luchtvaartterrein verbonden personen die bevoegd zijn om procedures van alarmering
      binnen en buiten het luchtvaartterrein in werking te doen treden en om bestrijdingsacties op het luchtvaartterrein
      in werking te doen treden;
    url: https://wetten.overheid.nl/BWBR0012703/2005-07-01#Artikel3
  - number: 3.b
    text: |-
      de functies van de personen die belast zijn met het opperbevel over en de operationele leiding van het geheel van
      de bestrijdingsacties;
    url: https://wetten.overheid.nl/BWBR0012703/2005-07-01#Artikel3
  - number: 3.c
    text: |-
      de maatregelen en voorzieningen die zijn getroffen opdat degene die is belast met het opperbevel en de
      hulpverleningsdiensten snel worden geïnformeerd en de bij de bestrijding betrokken personen snel worden opgeroepen;
    url: https://wetten.overheid.nl/BWBR0012703/2005-07-01#Artikel3
  - number: 3.d
    text: |-
      het schema met betrekking tot de leiding over en de gecoördineerde inzet van diensten en organisaties die bij de
      bestrijding kunnen worden betrokken;
    url: https://wetten.overheid.nl/BWBR0012703/2005-07-01#Artikel3
  - number: 3.e
    text: |-
      de maatregelen en voorzieningen die zijn getroffen met het oog op de bestrijding op en in de onmiddellijke omgeving
      van het luchtvaartterrein;
    url: https://wetten.overheid.nl/BWBR0012703/2005-07-01#Artikel3
  - number: 3.f
    text: |-
      een plan in hoofdlijnen met betrekking tot de geneeskundige organisatie, waaronder een plan op hoofdlijnen met
      betrekking tot de opvang en verzorging van de slachtoffers;
    url: https://wetten.overheid.nl/BWBR0012703/2005-07-01#Artikel3
  - number: 3.g
    text: de wijze waarop de bevolking wordt geïnformeerd en over de door haar te volgen gedragslijn;
    url: https://wetten.overheid.nl/BWBR0012703/2005-07-01#Artikel3
  - number: 3.h
    text: |-
      de wijze waarop slachtoffers, verwanten van slachtoffers, reizigers, medewerkers van de luchthaven en
      vliegmaatschappijen, binnen- en buitenlandse overheden en de media worden geïnformeerd;
    url: https://wetten.overheid.nl/BWBR0012703/2005-07-01#Artikel3
  - number: 3.i
    text: |-
      de maatregelen en voorzieningen die worden getroffen om de hulpverleningsdiensten van een andere staat te
      informeren, indien de bevolking of het milieu van die staat door het vliegtuigongeval worden getroffen of dreigen
      te worden getroffen;
    url: https://wetten.overheid.nl/BWBR0012703/2005-07-01#Artikel3
  - number: 3.j
    text: een overzichtskaart van de indeling van het luchtvaartterrein en de onmiddellijke omgeving daarvan.
    url: https://wetten.overheid.nl/BWBR0012703/2005-07-01#Artikel3
  - number: '4.1'
    text: |-
      Het college van burgemeester en wethouders verzorgt oefeningen, waarmee het rampbestrijdingsplan op juistheid,
      volledigheid en bruikbaarheid wordt getoetst.
    url: https://wetten.overheid.nl/BWBR0012703/2005-07-01#Artikel4
  - number: '4.2'
    text: |-
      In ieder geval vindt één maal per twee jaar een multidisciplinaire stafoefening en één maal per vier jaar een
      multidisciplinaire oefening van staf en operationele eenheden plaats.
    url: https://wetten.overheid.nl/BWBR0012703/2005-07-01#Artikel4
  - number: '4.3'
    text: Bij deze oefeningen wordt de alarmregeling van het luchtvaartterrein mede geoefend.
    url: https://wetten.overheid.nl/BWBR0012703/2005-07-01#Artikel4
  - number: '4.4'
    text: |-
      Het college van burgemeester en wethouders draagt zorg voor de evaluatie van de oefeningen, bedoeld in het tweede
      lid. Bij de uitvoering van de evaluatie worden de exploitant en de basiscommandant, bedoeld in [artikel 2][ref1],
      betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0012703#Artikel2
    url: https://wetten.overheid.nl/BWBR0012703/2005-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012703
        artikel: '2'
  - number: '5'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0012703/2005-07-01#Artikel5
  - number: '6'
    text: 'Dit besluit wordt aangehaald als: Besluit rampbestrijdingsplannen luchtvaartterreinen.'
    url: https://wetten.overheid.nl/BWBR0012703/2005-07-01#Artikel6
