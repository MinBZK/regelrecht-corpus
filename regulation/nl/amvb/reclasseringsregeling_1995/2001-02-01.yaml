preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Justitie a.i. van 7 september 1994, Stafafdeling Wetgeving Publiekrecht,
    nr. 455985/94/6;

    Gelet op de artikelen 14d, tweede lid, 16 en 22e van het Wetboek van Strafrecht, de artikelen 147, 177, tweede
    lid, en 310 van het Wetboek van Strafvordering, artikel 19, eerste lid, van de Wet overdracht tenuitvoerlegging
    strafvonnissen en artikel 15, eerste lid, van de Gratiewet;

    Gezien het advies van de Centrale Raad voor Strafrechtstoepassing (advies van 24 juni 1994, nr. SR 45/94);

    De Raad van State gehoord (advies van 29 november 1994, no. W03.94.0564);

    Gezien het nader rapport van Onze Minister van Justitie van 14 december 1994, Stafafdeling Wetgeving Publiekrecht,
    nr. 471960/94/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Justitie;'
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel1
  - number: 1.b
    text: |-
      stichting: de stichting, bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007120#Artikel2
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007120
        artikel: '2'
        hoofdstuk: '1'
  - number: 1.c
    text: |-
      reclasseringsinstelling: een erkende instelling als bedoeld in [artikel 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007120#Artikel4
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007120
        artikel: '4'
        hoofdstuk: '2'
  - number: 1.d
    text: 'penitentiaire inrichting: een gevangenis of huis van bewaring;'
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel1
  - number: 1.e
    text: |-
      straf van onbetaalde arbeid: de straf van onbetaalde arbeid ten algemene nutte, bedoeld in
      [artikel 9, eerste lid, onderdeel ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel9
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '9'
  - number: 1.f
    text: |-
      klachtencommissie: de commissie, bedoeld in [artikel 29][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007120#Artikel29
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007120
        artikel: '29'
        hoofdstuk: '5'
  - number: '2.1'
    text: |-
      De verantwoordelijkheid voor de uitvoering van reclasseringswerkzaamheden berust bij één door Onze Minister erkende
      landelijke stichting.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel2
  - number: '2.2'
    text: De stichting neemt de bij en krachtens dit besluit gestelde regels in acht.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel2
  - number: '2.3'
    text: 'Bij regeling van Onze Minister kunnen regels worden gesteld:'
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel2
  - number: 2.3.a
    text: ter zake van de prioriteiten die de stichting bij haar werkzaamheden in acht neemt,
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel2
  - number: 2.3.b
    text: ter zake van de eisen die aan de uitvoering van de werkzaamheden kunnen worden gesteld,
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel2
  - number: 2.3.c
    text: |-
      ter zake van de informatie die de stichting periodiek aan Onze Minister verstrekt aangaande de uitvoering van de
      werkzaamheden, en
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel2
  - number: 2.3.d
    text: ter bevordering van een goede uitvoering van reclasseringswerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel2
  - number: '3.1'
    text: |-
      De in [artikel 2][ref1] bedoelde erkenning kan slechts worden verleend indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007120#Artikel2
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007120
        artikel: '2'
        hoofdstuk: '1'
  - number: 3.1.a
    text: |-
      de stichting tot doel heeft, landelijk zorg te dragen voor het uitvoeren of doen uitvoeren van
      reclasseringswerkzaamheden;
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel3
  - number: 3.1.b
    text: |-
      de stichting ervoor zorg draagt dat de werkzaamheden in ieder arrondissement worden uitgevoerd en per hofressort
      worden gecoördineerd;
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel3
  - number: 3.1.c
    text: |-
      de stichting bereid is de opdrachten uit te voeren of te doen uitvoeren, die haar door de bevoegde autoriteiten
      worden gegeven;
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel3
  - number: 3.1.d
    text: |-
      het bestuur van de stichting zodanig is samengesteld dat een evenwichtige inbreng uit de samenleving, met inbegrip
      van de strafrechtspleging, is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel3
  - number: '3.2'
    text: |-
      Aan de erkenning kunnen voorschriften worden verbonden; de voorschriften kunnen na overleg met de stichting worden
      gewijzigd.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel3
  - number: '3.3'
    text: |-
      De erkenning kan worden ingetrokken indien de stichting handelt in strijd met de daaraan verbonden voorschriften of
      met het bij of krachtens dit besluit bepaalde.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel3
  - number: '3.4'
    text: |-
      De intrekking geschiedt niet eerder dan nadat dertien weken zijn verstreken na een waarschuwing van Onze Minister.
      Bij de waarschuwing vermeldt Onze Minister de maatregelen die de stichting dient te nemen om de intrekking te
      voorkomen.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel3
  - number: '4.1'
    text: |-
      Reclasseringswerkzaamheden worden uitsluitend verricht door de stichting of, onder haar verantwoordelijkheid, door
      instellingen die zich blijkens hun statuten of reglementen ten doel of mede ten doel stellen, op bijzondere wijze
      of ten behoeve van één of meer bijzondere categorieën van personen, reclasseringswerkzaamheden te verrichten en die
      daartoe door het bestuur van de stichting zijn erkend als reclasseringsinstelling.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel4
  - number: '4.2'
    text: |-
      De erkenning kan onder beperkingen worden verleend; aan de erkenning kunnen voorschriften worden verbonden. De
      beperkingen en voorschriften kunnen na overleg met de betrokken instelling worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel4
  - number: '4.3'
    text: |-
      De erkenning kan worden geschorst of ingetrokken. Intrekking van de erkenning geschiedt niet eerder dan nadat
      dertien weken zijn verstreken na een waarschuwing, waarbij is vermeld welke maatregelen moeten worden genomen om de
      intrekking te voorkomen.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel4
  - number: '4.4'
    text: |-
      Besluiten inzake de erkenning van instellingen worden door het bestuur van de stichting niet genomen dan nadat Onze
      Minister in kennis is gesteld van het voornemen daartoe.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel4
  - number: '5'
    text: |-
      In afwijking van [artikel 4][ref1] kunnen onder verantwoordelijkheid van de stichting bepaalde, door het bestuur
      van de stichting vast te stellen, reclasseringswerkzaamheden worden verricht door:


      [ref1]: https://wetten.overheid.nl/BWBR0007120#Artikel4
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007120
        artikel: '4'
        hoofdstuk: '2'
  - number: 5.a
    text: instellingen van maatschappelijke dienstverlening en
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel5
  - number: 5.b
    text: personen die zich als vrijwilliger aanbieden.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel5
  - number: '6.1'
    text: |-
      Reclasseringswerkers zijn de door het bestuur van de stichting als zodanig aangewezen personeelsleden van de
      stichting en van de reclasseringsinstellingen.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel6
  - number: '6.2'
    text: |-
      Op de aanwijzing is [artikel 4, tweede en derde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007120#Artikel4
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007120
        artikel: '4'
        hoofdstuk: '2'
  - number: '6.3'
    text: |-
      Alvorens zijn werkzaamheden aan te vangen, legt de reclasseringswerker de eed of belofte af dat hij zijn taak
      overeenkomstig de gestelde voorschriften naar geweten zal vervullen.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel6
  - number: '6.4'
    text: |-
      Bij ministeriële regeling worden regels gesteld over de eisen voor aanwijzing als reclasseringswerker en ter
      uitvoering van het derde lid.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel6
  - number: '7'
    text: 'Reclasseringswerkers hebben voor de uitoefening van hun werkzaamheden vrije toegang:'
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel7
  - number: 7.a
    text: |-
      tot degenen die zijn ingesloten in politiebureaus, voor zover de normale taakuitvoering van de politie dat
      redelijkerwijs toelaat, en
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel7
  - number: 7.b
    text: in penitentiaire inrichtingen, met inachtneming van de aldaar geldende huishoudelijke reglementen.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel7
  - number: '8.1'
    text: |-
      De stichting draagt er zorg voor dat in ieder arrondissement in ieder geval en zoveel mogelijk in onderlinge
      samenhang, de volgende reclasseringswerkzaamheden worden uitgevoerd:
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel8
  - number: 8.1.a
    text: |-
      het uit eigen beweging, in opdracht van de bevoegde autoriteiten of op verzoek van betrokkenen zelf verlenen van
      hulp en steun - rechtsbijstand uitgezonderd - aan personen die worden verdacht van of die zijn veroordeeld wegens
      een strafbaar feit;
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel8
  - number: 8.1.b
    text: |-
      het doen van onderzoek naar zodanige personen ten behoeve van de beslissingen die te hunnen aanzien moeten worden
      genomen over de vervolging, de berechting of de tenuitvoerlegging van straffen of maatregelen, en het geven van
      voorlichting daarover;
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel8
  - number: 8.1.c
    text: |-
      het voorbereiden en begeleiden van de uitvoering van de straf van onbetaalde arbeid en, voor zover daarvoor in
      aanmerking komend, van de uitvoering van andere rechterlijke beslissingen ten aanzien van personen die worden
      verdacht van of die zijn veroordeeld wegens een strafbaar feit, alsmede het houden van toezicht daarop en het
      verschaffen van inlichtingen daarover aan de bevoegde autoriteiten.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel8
  - number: '8.2'
    text: |-
      De stichting dient op verzoek of uit eigen beweging autoriteiten van advies omtrent onderwerpen die voor de
      reclassering van belang zijn.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel8
  - number: '9.1'
    text: |-
      Voorlichtingsrapporten, waartoe met toepassing van de [artikelen 147][ref1], [177][ref2], tweede
      lid, en [310 van het Wetboek van Strafvordering][ref3], [artikel 12 van de Gratiewet][ref4] of
      [artikel 19, eerste lid, van de Wet overdracht tenuitvoerlegging strafvonnissen][ref5] opdracht is gegeven, worden
      aangevraagd bij de stichting.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel147
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel177
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel310
      [ref4]: https://wetten.overheid.nl/BWBR0004257#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0004028#Artikel19
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '147'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '177'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '310'
      - id: ref4
        bwb_id: BWBR0004257
        artikel: '12'
      - id: ref5
        bwb_id: BWBR0004028
        artikel: '19'
  - number: '9.2'
    text: |-
      Voorlichtingsrapporten worden uitgebracht door de stichting of door een reclasseringsinstelling. In het laatste
      geval draagt de reclasseringsinstelling er zorg voor dat de stichting in staat is bij het rapport zo gewenst een
      eigen oordeel te voegen, na overleg met degene die het rapport heeft opgesteld.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel9
  - number: '9.3'
    text: |-
      De stichting kan ook uit eigen beweging of op verzoek van anderen, onder wie de betrokkene, een
      voorlichtingsrapport als bedoeld in het eerste lid uitbrengen of doen uitbrengen.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel9
  - number: '10'
    text: |-
      Nadat overeenkomstig [artikel 59, vijfde lid, van het Wetboek van Strafvordering][ref1] bericht is ontvangen van
      het bevel tot inverzekeringstelling van een verdachte beslist de stichting zo spoedig mogelijk:


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel59
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '59'
  - number: 10.a
    text: of de verdachte door een reclasseringswerker wordt bezocht, en
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel10
  - number: 10.b
    text: |-
      of een rapport wordt uitgebracht als bedoeld in [artikel 62, vierde lid, van het Wetboek van Strafvordering][ref1],
      mede met het oog op alternatieven voor een eventuele voorlopige hechtenis.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel62
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '62'
  - number: '11.1'
    text: |-
      De directeur van een penitentiaire inrichting bericht de stichting zo spoedig mogelijk omtrent de binnenkomst van
      een gedetineerde in de inrichting.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel11
  - number: '11.2'
    text: |-
      De directeur van een penitentiaire inrichting bericht de stichting zo spoedig mogelijk maar tenminste vier weken
      van te voren omtrent de datum van ontslag van een gedetineerde, die bij zijn ontslag een werkelijke straftijd zal
      hebben ondergaan van meer dan drie maanden en die hetzij krachtens rechterlijk vonnis of voorwaardelijke gratie,
      hetzij op eigen verzoek hulp en steun van reclasseringswege dient te ontvangen. Gelijke verplichting geldt indien
      de vervroegde invrijheidstelling wordt uitgesteld of achterwege blijft krachtens rechterlijke beslissing.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel11
  - number: '12.1'
    text: |-
      De stichting draagt er zorg voor dat, indien opdracht is gegeven tot het verlenen van hulp en steun terzake van
      de naleving van bijzondere voorwaarden, op verzoek een rapport over de daarmee verband houdende bemoeiingen wordt
      uitgebracht aan Onze Minister, de rechter of de officier van justitie.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel12
  - number: '12.2'
    text: |-
      Het rapport wordt uitgebracht door de stichting of een reclasseringsinstelling. Artikel 9, tweede lid, tweede
      volzin, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel12
  - number: '12.3'
    text: |-
      Aan het rapport wordt door de stichting of door de reclasseringsinstelling een advies terzake toegevoegd, indien
      het rapport naar haar oordeel aanleiding zou kunnen geven tot een van de navolgende maatregelen:
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel12
  - number: 12.3.a
    text: |-
      het instellen van een vordering als bedoeld in [artikel 14f][ref1] of [14g van het Wetboek van Strafrecht][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel14f
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel14g
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 14f
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 14g
  - number: 12.3.b
    text: het intrekken of wijzigen van het koninklijk besluit, waarbij onder voorwaarden gratie is verleend;
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel12
  - number: 12.3.c
    text: |-
      het intrekken van een voorwaardelijke beslissing door een vreemde staat, van welke de uitoefening van het toezicht
      op de naleving van voorwaarden is overgenomen.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel12
  - number: '13'
    text: |-
      De in de [hoofdstukken 14][ref1], [16][ref2] en [17 van het Reglement verpleging ter beschikking gestelden][ref3]
      aan de reclassering opgedragen werkzaamheden worden door of onder verantwoordelijkheid van de stichting verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0008690#Hoofdstuk14
      [ref2]: https://wetten.overheid.nl/BWBR0008690#Hoofdstuk16
      [ref3]: https://wetten.overheid.nl/BWBR0008690#Hoofdstuk17
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008690
        hoofdstuk: '14'
      - id: ref2
        bwb_id: BWBR0008690
        hoofdstuk: '16'
      - id: ref3
        bwb_id: BWBR0008690
        hoofdstuk: '17'
  - number: '15.1'
    text: |-
      De stichting ontvangt jaarlijks ten laste van de begroting van het Ministerie van Justitie een subsidie voor de
      reclasseringswerkzaamheden die door de stichting of onder haar verantwoordelijkheid worden verricht.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel15
  - number: '15.2'
    text: |-
      Een afzonderlijke subsidie kan worden verleend ten behoeve van de bouw, de inrichting en de uitbreiding van
      gebouwen ten dienste van de reclassering.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel15
  - number: '15.3'
    text: De verlening van subsidie geschiedt voor 1 januari van het subsidiejaar.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel15
  - number: '15.4'
    text: De vaststelling van subsidie geschiedt voor 1 juli van het op het subsidiejaar volgende jaar.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel15
  - number: '16.1'
    text: |-
      Voor 1 december van het tweede jaar voorafgaand aan het subsidiejaar nodigt Onze Minister de stichting uit tot het
      indienen van een voorlopige subsidieaanvraag.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel16
  - number: '16.2'
    text: |-
      Daarbij geeft hij zo mogelijk het bedrag aan dat volgens de meerjarenraming, voorkomend in de toelichting bij
      de begroting voor het jaar voorafgaand aan het subsidiejaar, beschikbaar zal zijn voor de reclassering in het
      subsidiejaar.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel16
  - number: '17.1'
    text: |-
      Voor 1 februari van het jaar voorafgaand aan het subsidiejaar dient de stichting bij Onze Minister een voorlopige
      subsidieaanvraag in.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel17
  - number: '17.2'
    text: 'De voorlopige subsidieaanvraag gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel17
  - number: 17.2.a
    text: een ontwerp-begroting van uitgaven en inkomsten voor het subsidiejaar en
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel17
  - number: 17.2.b
    text: een beleidsplan met de voorgenomen werkzaamheden voor de komende vier jaren, beginnend met het subsidiejaar.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel17
  - number: '18.1'
    text: |-
      Voor 1 mei van het jaar voorafgaand aan het subsidiejaar nodigt Onze Minister de stichting uit tot het indienen van
      een definitieve subsidieaanvraag.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel18
  - number: '18.2'
    text: |-
      Daarbij geeft hij aan in hoeverre wijziging is opgetreden of naar verwachting wijziging zal optreden in het voor de
      reclassering in het subsidiejaar beschikbare bedrag.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel18
  - number: '18.3'
    text: |-
      Onze Minister informeert de stichting zoveel mogelijk over wijzigingen als bedoeld in het tweede lid die zich
      daarna voordoen.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel18
  - number: '19.1'
    text: |-
      Voor 1 oktober van het jaar voorafgaand aan het subsidiejaar dient de stichting bij Onze Minister een definitieve
      subsidieaanvraag in.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel19
  - number: '19.2'
    text: |-
      De stichting houdt daarbij rekening met de financiële ruimte zoals die door de wetgever is vastgesteld of naar
      verwachting zal worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel19
  - number: '19.3'
    text: 'De subsidieaanvraag gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel19
  - number: 19.3.a
    text: een definitieve begroting van uitgaven en inkomsten en
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel19
  - number: 19.3.b
    text: een activiteitenplan voor het subsidiejaar.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel19
  - number: '19.4'
    text: |-
      Het activiteitenplan, bedoeld in het derde lid, wordt afgestemd op de behoefte aan reclasseringswerkzaamheden
      binnen de diverse arrondissementen en de hofressorten.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel19
  - number: '20.1'
    text: |-
      Voor de aanvang van het subsidiejaar neemt Onze Minister het besluit waarbij de subsidie voor het subsidiejaar
      wordt verleend, zo nodig onder de voorwaarde dat door de wetgever voldoende gelden ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel20
  - number: '20.2'
    text: |-
      In het besluit wordt in ieder geval aangegeven welke categorieën van activiteiten in welke omvang en volgens welke
      berekeningswijze ten hoogste voor subsidiëring in aanmerking zullen komen.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel20
  - number: '20.3'
    text: In het besluit kan tevens worden bepaald op welke wijze voorschotten worden verleend.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel20
  - number: '21.1'
    text: |-
      De stichting voert een zodanig ingerichte administratie, dat daaruit te allen tijde de voor de vaststelling van de
      subsidie van belang zijnde rechten en verplichtingen alsmede de betalingen en ontvangsten kunnen worden nagegaan.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel21
  - number: '21.2'
    text: De administratie en de daartoe behorende bescheiden worden gedurende tien jaren bewaard.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel21
  - number: '22.1'
    text: |-
      Indien gedurende het subsidiejaar aanmerkelijke verschillen ontstaan of dreigen te ontstaan tussen de werkelijke
      uitgaven en inkomsten en de begrote uitgaven en inkomsten doet de stichting daarvan onverwijld mededeling aan Onze
      Minister, onder vermelding van de oorzaak van de verschillen.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel22
  - number: '22.2'
    text: |-
      De stichting geeft Onze Minister zo spoedig mogelijk tevens kennis van omstandigheden die hetzij van belang
      kunnen zijn voor de vaststelling van de subsidie, hetzij aanleiding kunnen geven tot een wijziging van de
      subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel22
  - number: '23'
    text: De stichting kan Onze Minister verzoeken de subsidieverlening te wijzigen.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel23
  - number: '24.1'
    text: |-
      Zolang de subsidie niet overeenkomstig [artikel 27][ref1] is vastgesteld, kan Onze Minister de subsidieverlening
      intrekken of ten nadele van de stichting wijzigen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007120#Artikel27
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007120
        artikel: '27'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 24.1.a
    text: de activiteiten waarvoor subsidie is verleend niet of niet geheel hebben plaatsgevonden of zullen plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel24
  - number: 24.1.b
    text: de stichting niet heeft voldaan aan de aan de subsidie verbonden voorschriften;
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel24
  - number: 24.1.c
    text: |-
      de stichting onjuiste of onvolledige gegevens heeft verstrekt en de verstrekking van juiste of volledige gegevens
      tot een andere beschikking op de aanvraag tot subsidieverlening zou hebben geleid;
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel24
  - number: 24.1.d
    text: de subsidieverlening anderszins onjuist was en de stichting dit wist of behoorde te weten; of
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel24
  - number: 24.1.e
    text: een beroep wordt gedaan op de voorwaarde dat voldoende gelden ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel24
  - number: '24.2'
    text: |-
      De intrekking of wijziging werkt terug tot en met het tijdstip waarop de subsidie is verleend, tenzij bij de
      intrekking of wijziging anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel24
  - number: '25.1'
    text: |-
      Zolang de subsidie niet overeenkomstig [artikel 27][ref1] is vastgesteld, kan Onze Minister de subsidieverlening
      met inachtneming van een redelijke termijn intrekken of ten nadele van de stichting wijzigen:


      [ref1]: https://wetten.overheid.nl/BWBR0007120#Artikel27
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0007120
        artikel: '27'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 25.1.a
    text: voor zover de subsidieverlening onjuist is; of
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel25
  - number: 25.1.b
    text: |-
      voor zover veranderde omstandigheden of gewijzigde inzichten zich in overwegende mate tegen voortzetting of
      ongewijzigde voortzetting van de subsidie verzetten.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel25
  - number: '26.1'
    text: |-
      Voor 1 mei van het op het subsidiejaar volgende jaar dient de stichting bij Onze Minister de aanvraag in voor de
      definitieve vaststelling van het subsidiebedrag.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel26
  - number: '26.2'
    text: 'De aanvraag gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel26
  - number: 26.2.a
    text: een jaarrekening,
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel26
  - number: 26.2.b
    text: een verslag van de in dat jaar verrichte activiteiten en
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel26
  - number: 26.2.c
    text: |-
      een verklaring omtrent de getrouwheid van de jaarrekening en het verslag, afgegeven door een accountant als bedoeld
      in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '27.1'
    text: Voor 1 juli van het op het subsidiejaar volgende jaar stelt Onze Minister het definitieve subsidiebedrag vast.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel27
  - number: '27.2'
    text: |-
      Het subsidiebedrag wordt overeenkomstig de subsidievaststelling betaald, onder verrekening van de betaalde
      voorschotten.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel27
  - number: '28.1'
    text: 'Onze Minister kan de subsidievaststelling intrekken of ten nadele van de stichting wijzigen:'
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel28
  - number: 28.1.a
    text: |-
      op grond van feiten of omstandigheden waarvan hij bij de subsidievaststelling redelijkerwijs niet op de hoogte kon
      zijn en op grond waarvan de subsidie lager dan overeenkomstig de subsidieverlening zou zijn vastgesteld;
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel28
  - number: 28.1.b
    text: indien de subsidievaststelling onjuist was en de stichting dit wist of behoorde te weten;
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel28
  - number: 28.1.c
    text: indien de stichting na de subsidievaststelling niet heeft voldaan aan aan de subsidie verbonden verplichtingen.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel28
  - number: '28.2'
    text: |-
      De intrekking of wijziging werkt terug tot en met het tijdstip waarop de subsidie is vastgesteld, tenzij bij de
      intrekking of wijziging anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel28
  - number: '28.3'
    text: |-
      De subsidievaststelling kan niet meer worden ingetrokken of ten nadele van de stichting worden gewijzigd indien
      vijf jaren zijn verstreken sinds de dag waarop zij is bekendgemaakt dan wel, in het geval, bedoeld in het eerste
      lid, onderdeel *c*, sinds de dag waarop de handeling in strijd met de verplichting is verricht of de dag waarop aan
      de verplichting had moeten zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel28
  - number: '29.1'
    text: |-
      Er is een commissie, belast met de behandeling van klachten over het uitvoeren of nalaten van
      reclasseringswerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel29
  - number: '29.2'
    text: |-
      De klachtencommissie bestaat uit een oneven aantal leden, die worden benoemd door de stichting. Bestuursleden van
      de stichting en werknemers van de landelijke stichting of van een reclasseringsinstelling kunnen geen lid van de
      klachtencommissie zijn.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel29
  - number: '29.3'
    text: |-
      De klachtencommissie houdt zitting in elk van de ressorten van de gerechtshoven, volgens regels door de commissie
      te stellen bij reglement van orde.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel29
  - number: '29.4'
    text: De stichting voorziet in het secretariaat van de klachtencommissie.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel29
  - number: '30.1'
    text: |-
      Degene ten aanzien van wie reclasseringswerkzaamheden zijn verricht of ten onrechte zijn nagelaten, kan bij de
      klachtencommissie een klacht indienen over het uitvoeren of nalaten van reclasseringswerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel30
  - number: '30.2'
    text: |-
      De klacht wordt ingediend binnen zes weken na de dag waarop de klager kennis heeft gekregen van het handelen of
      nalaten waarover hij zich wenst te beklagen.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel30
  - number: '30.3'
    text: |-
      Een na afloop van de termijn ingediende klacht wordt toch in behandeling genomen, indien redelijkerwijs niet kan
      worden geoordeeld dat de klager in verzuim is geweest.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel30
  - number: '31.1'
    text: Door of namens de klachtencommissie worden de klager en degene tegen wie de klacht zich richt, gehoord.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel31
  - number: '31.2'
    text: |-
      Van het horen kan worden afgezien indien de klachtencommissie aanstonds van oordeel is dat de klacht kennelijk niet
      ontvankelijk of kennelijk ongegrond is.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel31
  - number: '31.3'
    text: |-
      Door of namens de klachtencommissie kunnen inlichtingen worden ingewonnen bij instellingen en personen die
      reclasseringswerkzaamheden verrichten.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel31
  - number: '32.1'
    text: De klachtencommissie kan trachten te bemiddelen tussen de klager en degene tegen wie de klacht zich richt.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel32
  - number: '32.2'
    text: |-
      Naar aanleiding van een klacht kan de klachtencommissie een aanbeveling doen aan degene tot wie de klacht zich
      richt of tot een andere instelling of persoon. De aanbeveling wordt openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel32
  - number: '32.3'
    text: |-
      De klachtencommissie bericht de klager zo spoedig mogelijk maar in ieder geval binnen zes weken na ontvangst van de
      klacht over de afdoening daarvan.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel32
  - number: '32.4'
    text: De klachtencommissie brengt jaarlijks een openbaar verslag uit over haar werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel32
  - number: '33.1'
    text: |-
      Onze Minister wijst de ambtenaren aan die zijn belast met het toezicht op de naleving van het bij of krachtens dit
      besluit bepaalde.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel33
  - number: '33.2'
    text: |-
      Bij de uitoefening van hun taak dragen de toezichthoudende ambtenaren een door Onze Minister uitgegeven
      legitimatiebewijs bij zich, dat zij desgevraagd aanstonds tonen.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel33
  - number: '34.1'
    text: |-
      De toezichthoudende ambtenaren hebben voor de uitoefening van hun taak vrije toegang tot de vestigingsplaatsen van
      de stichting en van de reclasseringsinstellingen. Een woning betreden zij niet zonder toestemming van de bewoner.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel34
  - number: '34.2'
    text: Zij zijn bevoegd zich te doen vergezellen door daartoe door hen aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel34
  - number: '34.3'
    text: |-
      De toezichthoudende ambtenaren zijn bevoegd inzage te vorderen van zakelijke gegevens en bescheiden en van de
      gegevens en bescheiden kopieën te maken en deze voor dat doel voor korte tijd mee te nemen tegen een schriftelijk
      bewijs.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel34
  - number: '35'
    text: |-
      De stichting, de reclasseringsinstellingen en de daarbij werkzame medewerkers zijn verplicht aan de
      toezichthoudende ambtenaren de inlichtingen en de medewerking te verschaffen die deze redelijkerwijs kunnen
      vorderen bij de uitoefening van hun bevoegdheden. Zij die uit hoofde van ambt, beroep of wettelijk voorschrift
      verplicht zijn tot geheimhouding, kunnen het verlenen van medewerking weigeren, voor zover dit uit hun
      geheimhoudingsplicht voortvloeit.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel35
  - number: '36'
    text: |-
      De toezichthouders maken van hun bevoegdheden slechts gebruik voor zover dat redelijkerwijs voor de vervulling van
      hun taak nodig is.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel36
  - number: '37'
    text: |-
      Een ieder die betrokken is bij de uitvoering van dit besluit en daarbij de beschikking krijgt over gegevens waarvan
      hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, en voor wie niet reeds uit hoofde van
      ambt, beroep of wettelijk voorschrift ter zake van die gegevens een geheimhoudingsplicht geldt, is verplicht tot
      geheimhouding daarvan, behoudens voor zover enig wettelijk voorschrift hem tot bekendmaking verplicht of uit zijn
      taak bij de uitvoering van dit besluit de noodzaak tot bekendmaking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel37
  - number: '38.1'
    text: |-
      Indien een instelling als bedoeld in artikel 4 op het moment van inwerkingtreding van dit besluit erkend is op
      grond van artikel 6 van de Reclasseringsregeling 1986, geldt deze erkenning als erkenning op grond van artikel 4,
      eerste lid, van de onderhavige regeling.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel38
  - number: '38.2'
    text: |-
      In afwijking van de [artikelen 26 tot en met 28][ref1] geschiedt de vaststelling van de subsidie voor het
      subsidiejaar 1994 op de voet van de Reclasseringsregeling 1986, zoals deze luidde op de dag voordat deze ingevolge
      het onderhavige besluit wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0007120#Artikel26
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0007120
        artikel: '26'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '38.3'
    text: Bij ministeriële regeling kunnen nadere overgangsregels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel38
  - number: '40'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ter uitvoering van dit besluit.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel40
  - number: '41'
    text: De Reclasseringsregeling 1986 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel41
  - number: '42'
    text: Dit besluit treedt in werking met ingang van 1 januari 1995.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel42
  - number: '43'
    text: Dit besluit wordt aangehaald als Reclasseringsregeling 1995.
    url: https://wetten.overheid.nl/BWBR0007120/2001-02-01#Artikel43
