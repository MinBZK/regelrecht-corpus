articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. wet: [Meststoffenwet][ref1];

      b. verkleining: verkleining van de tot het bedrijf behorende oppervlakte landbouwgrond;

      c. vergroting: vergroting van de tot het bedrijf behorende oppervlakte landbouwgrond;

      d. verklaring: verklaring, opgemaakt tussen degene die tot de landbouwgrond gerechtigd is ingevolge de titels,
      genoemd in [artikel 1, eerste lid, onderdeel q, en derde lid, van de wet][ref2], en degene die de grond in
      gebruik heeft anders dan ingevolge voornoemde titels, op grond waarvan deze landbouwgrond ingevolge de krachtens
      [artikel 53, onderdeel a, van de wet][ref3] gestelde regels voor de toepassing van [hoofdstuk IV van de wet][ref4]
      wordt gerekend tot de tot het bedrijf van degene die de grond in gebruik heeft behorende oppervlakte landbouwgrond;

      e. landinrichtingsproject: herinrichtings-, ruilverkavelings- of aanpassingsinrichtingsproject als bedoeld
      in [artikel 13, onderdelen a, b en c, van de Landinrichtingswet][ref5], herinrichting op grond van de
      [Herinrichtingswet Oost-Groningen en de Groningse-Drentse Veenkoloniën][ref6] of reconstructie op grond van de
      [Reconstructiewet Midden-Delfland][ref7];

      f. pachtovereenkomst: pachtovereenkomst als bedoeld in [artikel 12, derde lid][ref8],
      of [70f, eerste of vijfde lid, van de Pachtwet][ref9].


