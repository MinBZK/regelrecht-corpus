  - number: '2'
    text: |-
      Een verkleining als bedoeld in [artikel 55, vierde lid, onderdeel b, van de wet][ref1], is:

      a. een verkleining van ten hoogste 5% die het gevolg is van een ruilverkaveling bij overeenkomst als bedoeld in
      [artikel 119 van de Landinrichtingswet][ref2];

      b. een verkleining gevolgd door ingebruikname van landbouwgrond die tijdelijk in
      gebruik is gegeven overeenkomstig [artikel 189 van de Landinrichtingswet][ref3],
      [artikel 46, vierde lid, van de Reconstructiewet Midden-Delfland][ref4], of
      [artikel 28, vierde lid, van de Herinrichtingswet Oost-Groningen en de Gronings-Drentse Veenkoloniën][ref5],
      voorzover en voor zolang de som van de tot het bedrijf behorende oppervlakte landbouwgrond en de grond die
      tijdelijk in gebruik is gegeven, ten hoogste 5% minder is dan de vóór de verkleining tot het bedrijf behorende
      oppervlakte landbouwgrond;

      c. een verkleining die het gevolg is van een onderbedeling van ten hoogste 5% in het kader van een
      reconstructie op grond van de [Reconstructiewet Midden-Delfland][ref6], een herinrichting op grond van de
      [Herinrichtingswet Oost-Groningen en de Groningse-Drentse Veenkoloniën][ref7], dan wel landinrichting op
      grond van de [Landinrichtingswet][ref8] met uitzondering van de ruilverkaveling bij overeenkomst als bedoeld in
      [artikel 119 van die wet][ref9];

      d. een verkleining die het gevolg is van overdracht van landbouwgrond in het kader van een landinrichtingsproject
      aan het bureau beheer landbouwgronden, bedoeld in [artikel 28 van de Wet agrarisch grondverkeer][ref10], voorzover
      en voor zolang de directeur van dat bureau of de directeur van de Dienst landelijk gebied van het Ministerie van
      Landbouw, Natuurbeheer en Visserij in het kader van een toeslag- of vergoedingsregeling erin heeft toegestemd dat
      een deel van de over te dragen landbouwgrond tijdelijk in gebruik blijft bij het desbetreffende bedrijf;

      e. een verkleining die binnen hetzelfde kalenderjaar is voorafgegaan of wordt gevolgd door een vergroting van
      dezelfde omvang;

      f. een verkleining die het gevolg is van het niet meer bij het bedrijf in het kader van een normale bedrijfsvoering
      in gebruik zijn van de landbouwgrond door het in gebruik geven van die landbouwgrond aan een derde op grond van
      een verklaring of een pachtovereenkomst en die het volgende kalenderjaar wordt gevolgd door een vergroting die het
      gevolg is van het wederom bij het bedrijf in het kader van een normale bedrijfsvoering in gebruik nemen van die
      landbouwgrond na afloop van de in de verklaring vermelde periode dan wel na beëindiging van de pachtovereenkomst.


