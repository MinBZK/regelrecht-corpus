  - number: '3'
    text: |-
      1 De [onderdelen e en f van artikel 2][ref1] vinden geen toepassing ten aanzien van een verkleining indien een van
      deze onderdelen in het kalenderjaar voorafgaand aan die verkleining reeds is toegepast op een verkleining of een
      vergroting, als bedoeld in [artikel 2, onderdeel f][ref2], betreffende dezelfde landbouwgrond.

      2 Voor de toepassing van dit artikel wordt onder verkleining verstaan een verkleining van de tot het bedrijf
      behorende oppervlakte landbouwgrond die het gevolg is van het niet meer bij het bedrijf in het kader van een
      normale bedrijfsvoering in gebruik zijn van de landbouwgrond door het in gebruik geven van die landbouwgrond aan
      een derde op grond van een verklaring of een pachtovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0010581#Artikel2
