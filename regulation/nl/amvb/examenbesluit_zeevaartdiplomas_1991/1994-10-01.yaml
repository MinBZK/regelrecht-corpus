preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat, mede namens Onze Minister van Onderwijs en
    Wetenschappen, van 15 april 1991, nr. S/J 30 581/91, Directoraat-Generaal Scheepvaart en Maritieme Zaken;

    Gelet op artikel 2, derde lid, en 3, tweede lid, van de Wet op de zeevaartdiploma's (Stb. 1935, 456);

    De Raad van State gehoord (advies van 27 augustus 1991, nr. WO9.91 0209);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 9 december 1991, nr. S/J 31 572/91,
    Directoraat-Generaal Scheepvaart en Maritieme Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      De definities genoemd in artikel 1 van het Besluit zeevaartdiploma's (*Stb.* 1988, 260) zijn van toepassing, met
      dien verstande dat onder bewijs van diensttijd wordt verstaan het bewijs of de bewijzen van behaalde diensttijd.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel1
  - number: '1.2'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel1
  - number: 1.2.a
    text: |-
      de Commissie: de Commissie voor de stuurliedenexamens genoemd in [artikel 2, eerste lid][ref1], alsmede de
      Commissie voor de examens van scheepswerktuigkundigen genoemd in [artikel 2, tweede lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005324#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005324#Artikel2
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005324
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0005324
        artikel: '2'
        hoofdstuk: I
  - number: 1.2.b
    text: |-
      de schoolcommissie: de commissie genoemd in [artikel 3, sub 1°][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005324#Artikel3
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005324
        artikel: '3'
        hoofdstuk: I
  - number: 1.2.c
    text: |-
      school: een door Onze Minister aangewezen, uit 's Rijks kas bekostigde instelling voor hoger beroepsonderwijs of
      school voor middelbaar beroepsonderwijs, waaraan als zodanig nautische opleidingen ter verwerving van de in dit
      besluit genoemde diploma's verbonden zijn;
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel1
  - number: 1.2.d
    text: |-
      de Voorzitter: de voorzitter genoemd in [artikel 6, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005324#Artikel6
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005324
        artikel: '6'
        hoofdstuk: I
  - number: 1.2.e
    text: |-
      stoomkennisbewijs: het kennisbewijs stoomvoortstuwing B, respectievelijk C, bedoeld in
      [artikel 2, tweede lid, onder c en d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005324#Artikel2
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005324
        artikel: '2'
        hoofdstuk: I
  - number: '2.1'
    text: 'Er is een Commissie voor de stuurliedenexamens die examens afneemt ter verkrijging van:'
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel2
  - number: 2.1.a
    text: het diploma als stuurman voor de beperkte kleine handelsvaart;
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel2
  - number: 2.1.b
    text: het diploma als stuurman voor de kleine handelsvaart;
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel2
  - number: 2.1.c
    text: het aanvullingsdiploma als stuurman voor de kleine handelsvaart;
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel2
  - number: 2.1.d
    text: het diploma als stuurman voor de grote sleepvaart en
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel2
  - number: 2.1.e
    text: het diploma als stuurman voor de kustsleepvaart.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel2
  - number: '2.2'
    text: 'Er is een Commissie voor de examens van scheepswerktuigkundigen die examens afneemt ter verkrijging van:'
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel2
  - number: 2.2.a
    text: het voorlopig diploma als scheepswerktuigkundige;
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel2
  - number: 2.2.b
    text: het diploma als assistent-scheepswerktuigkundige;
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel2
  - number: 2.2.c
    text: het kennisbewijs stoomvoortstuwing B en
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel2
  - number: 2.2.d
    text: het kennisbewijs stoomvoortstuwing C.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel2
  - number: '2.3'
    text: |-
      Onze Minister bepaalt gedurende welke zittingsperiode als bedoeld in [artikel 9, eerste lid][ref1], de examens ter
      verkrijging van de in het eerste en tweede lid bedoelde diploma's en kennisbewijzen zullen worden afgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005324#Artikel9
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005324
        artikel: '9'
        hoofdstuk: II
  - number: '2.4'
    text: |-
      De vakken waarin examen wordt afgenomen staan vermeld in
      [Bijlage I bij dit besluit onder A, respectievelijk onder B][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005324
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005324
  - number: '3'
    text: |-
      Het afnemen van examens ter verkrijging van: a. het diploma als stuurman voor de kleine handelsvaart tezamen
      met het aanvullingsdiploma als stuurman voor de kleine handelsvaart, b. het diploma als derde stuurman voor de
      grote handelsvaart, c. het diploma als tweede stuurman voor de grote handelsvaart, d. het diploma als eerste
      stuurman voor de grote handelsvaart, e. het diploma als motordrijver, f. het diploma A als scheepswerktuigkundige,
      g. het diploma B als scheepswerktuigkundige en h. het diploma C als scheepswerktuigkundige, geschiedt
      door: 1°. de schoolcommissie van een door Onze Minister aangewezen school voor zover het examens betreft
      in de examenvakken die in [Bijlage II bij dit besluit onder C][ref1], zijn aangeduid als schooltoetsvakken;
      2°. de Commissie voor de stuurliedenexamens voor zover het examens betreft in de examenvakken die in
      [Bijlage III bij dit besluit onder D][ref2], zijn aangeduid als centrale toetsvakken; 3°. de Commissie
      voor de examens van scheepswerktuigkundigen voor zover het examens betreft in de examenvakken die in
      [Bijlage III bij dit besluit onder E][ref3], zijn aangeduid als centrale toetsvakken.


      [ref1]: https://wetten.overheid.nl/BWBR0005324
      [ref2]: https://wetten.overheid.nl/BWBR0005324
      [ref3]: https://wetten.overheid.nl/BWBR0005324
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005324
      - id: ref2
        bwb_id: BWBR0005324
      - id: ref3
        bwb_id: BWBR0005324
  - number: '4.1'
    text: |-
      Onze Minister gaat eerst over tot aanwijzing van een school wanneer naar zijn oordeel voldoende waarborgen aanwezig
      zijn dat:
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel4
  - number: 4.1.a
    text: de vereiste kennis en bekwaamheid van de kandidaat naar behoren zullen worden onderzocht en
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel4
  - number: 4.1.b
    text: |-
      de verklaring, bedoeld in [artikel 18, tweede lid][ref1], eerst na een met gunstig gevolg afgesloten onderzoek zal
      worden afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005324#Artikel18
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005324
        artikel: '18'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '4.2'
    text: |-
      De aanwijzing kan worden ingetrokken indien blijkt dat de in het eerste lid bedoelde waarborgen niet meer aanwezig
      zijn.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel4
  - number: '5.1'
    text: |-
      De schoolcommissie bestaat uit een voorzitter en leden. De voorzitter is het hoofd van de opleiding. De leden
      van de schoolcommissie worden benoemd door het bevoegd gezag van de betreffende school uit docenten die bij de
      opleiding zijn betrokken.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel5
  - number: '5.2'
    text: Het bevoegd gezag informeert Onze Minister omtrent de samenstelling van de schoolcommissie.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel5
  - number: '5.3'
    text: |-
      De schoolcommissie stelt aan het einde van ieder kalenderjaar een verslag op betreffende de gehouden examens en
      zendt dit aan de Voorzitter.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel5
  - number: '6.1'
    text: |-
      De Commissie bestaat uit een Voorzitter, leden en plaatsvervangende leden. De Voorzitter is een door Onze Minister
      aan te wijzen ambtenaar van zijn departement. De leden en plaatsvervangende leden treden op als examinator. Zij
      worden voor de tijd van ten hoogste twee jaren benoemd door Onze Minister en zijn terstond herbenoembaar. Bij de
      benoeming worden tevens uit de leden één of meer plaatsvervangende voorzitters aangewezen.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel6
  - number: '6.2'
    text: |-
      De leden en plaatsvervangende leden van de Commissie ontvangen uit 's Rijks kas een vergoeding van reis- en
      verblijfkosten overeenkomstig de regelen welke terzake van reizen in Nederland ten behoeve van het Rijk gelden,
      alsmede, voor zover hun benoeming haar oorzaak niet vindt in het ambt dat zij bekleden, vacatiegelden.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel6
  - number: '7.1'
    text: |-
      Onze Minister voorziet in het secretariaat van de Commissie en wijst een ambtenaar van zijn departement aan als
      secretaris.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel7
  - number: '7.2'
    text: De Voorzitter wijst een of meer leden aan als plaatsvervangend secretaris van de Commissie.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel7
  - number: '8'
    text: De Voorzitter stelt aan het einde van het zittingsjaar een jaarverslag op.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel8
  - number: '9.1'
    text: |-
      Onze Minister bepaalt, na overleg met de scholen, voor een tijdvak van ten hoogste een jaar de perioden waarin en
      de plaats waar de Commissie zitting houdt, voor welke examens de zitting zal openstaan alsmede de inschrijfperioden
      voor de examens.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel9
  - number: '9.2'
    text: |-
      Onze Minister bepaalt, na overleg met de scholen, voor een tijdvak van ten hoogste één jaar de perioden waarin de
      schoolcommissies zitting houden alsmede de inschrijfperioden voor de examens.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel9
  - number: '9.3'
    text: |-
      De voorzitters van de schoolcommissies bepalen in gezamenlijk overleg de plaats of plaatsen van een zitting en
      maken dit ten minste een maand voor de zittingsdatum bekend.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel9
  - number: '9.4'
    text: |-
      De Voorzitter alsmede de voorzitters van de schoolcommissies kunnen om naar hun oordeel zwaarwichtige redenen
      afwijkingen van de inschrijfperioden toestaan.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel9
  - number: '10'
    text: |-
      De Voorzitter en de voorzitters van de schoolcommissies stellen, ieder voor de eigen commissie, de roosters voor de
      te houden examens vast.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel10
  - number: '11.1'
    text: |-
      De Voorzitter roept de leden en plaatsvervangende leden van de Commissie op naarmate de aard en de omvang van de
      werkzaamheden hun tegenwoordigheid vereisen.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel11
  - number: '11.2'
    text: |-
      In het belang van het goed funktioneren van de Commissie kan de Voorzitter leden en plaatsvervangende leden
      oproepen met het doel hen in staat te stellen kennis te nemen van nieuwe ontwikkelingen op het gebied van navigatie
      en scheepswerktuigkunde.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel11
  - number: '12.1'
    text: |-
      Degene, die een examen wenst af te leggen ter verkrijging van een diploma als bedoeld in
      [artikel 2, eerste en tweede lid][ref1], meldt zich daartoe bij de Voorzitter aan, binnen de in
      [artikel 9, eerste lid][ref2], bedoelde inschrijfperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0005324#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005324#Artikel9
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005324
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0005324
        artikel: '9'
        hoofdstuk: II
  - number: '12.2'
    text: 'Bij de aanmelding legt de kandidaat over:'
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel12
  - number: 12.2.a
    text: een gewaarmerkt afschrift van de benodigde gegevens uit de basisadministratie persoonsgegevens;
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel12
  - number: 12.2.b
    text: een goedgelijkende pasfoto in tweevoud;
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel12
  - number: 12.2.c
    text: een bewijs van betaling van de in artikel 9, eerste lid, van de Wet op de zeevaartdiploma's bedoelde vergoeding;
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel12
  - number: 12.2.d
    text: |-
      het bewijs van behaalde diensttijd als bedoeld in [artikel 23][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005324#Artikel23
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005324
        artikel: '23'
        hoofdstuk: V
  - number: 12.2.e
    text: |-
      een verklaring van ontheffing als bedoeld in [artikel 15, vijfde lid][ref1], voor zover van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005324#Artikel15
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005324
        artikel: '15'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '12.3'
    text: |-
      Bij de aanmelding voor de examens ter verkrijging van de diploma's, bedoeld in
      [artikel 2, eerste lid, onder a en e][ref1], wordt tevens overgelegd het certificaat van bediening van VHF- en UHF-
      radiotelefonie-installaties dan wel het algemeen certificaat van bediening als radiotelefonist, bedoeld in het
      Besluit radio-electrische inrichtingen (*Stb.* 1988, 552).


      [ref1]: https://wetten.overheid.nl/BWBR0005324#Artikel2
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005324
        artikel: '2'
        hoofdstuk: I
  - number: '12.4'
    text: |-
      Bij de aanmelding voor de examens ter verkrijging van de diploma's, bedoeld in
      [artikel 2, eerste lid, onder b tot en met d][ref1], worden tevens overgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0005324#Artikel2
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005324
        artikel: '2'
        hoofdstuk: I
  - number: 12.4.a
    text: |-
      het bewijs dat de radarwaarnemercursus aan een door het Rijk bekostigde school met gunstig gevolg is doorlopen dan
      wel enig ander naar het oordeel van Onze Minister daarmee gelijk te stellen bewijs en
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel12
  - number: 12.4.b
    text: het algemeen certificaat van bediening als radiotelefonist.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel12
  - number: '12.5'
    text: |-
      Bij de aanmelding voor het examen ter verkrijging van het aanvullingsdiploma als stuurman voor de kleine
      handelsvaart, bedoeld in [artikel 2, eerste lid onder c][ref1], wordt tevens overgelegd het diploma als stuurman
      voor de kleine handelsvaart.


      [ref1]: https://wetten.overheid.nl/BWBR0005324#Artikel2
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005324
        artikel: '2'
        hoofdstuk: I
  - number: '12.6'
    text: |-
      Bij de aanmelding voor het examen ter verkrijging van het kennisbewijs stoomvoortstuwing B, bedoeld in
      [artikel 2, tweede lid, onder c][ref1], wordt tevens overgelegd het diploma A als scheepswerktuigkundige.


      [ref1]: https://wetten.overheid.nl/BWBR0005324#Artikel2
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005324
        artikel: '2'
        hoofdstuk: I
  - number: '12.7'
    text: |-
      Bij de aanmelding voor het examen ter verkrijging van het kennisbewijs stoomvoortstuwing C, bedoeld in
      [artikel 2, tweede lid, onder d][ref1], wordt tevens overgelegd het kennisbewijs stoomvoortstuwing B.


      [ref1]: https://wetten.overheid.nl/BWBR0005324#Artikel2
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005324
        artikel: '2'
        hoofdstuk: I
  - number: '13.1'
    text: |-
      Degene, die een schoolexamen wenst af te leggen meldt zich daartoe bij de Voorzitter aan, binnen de in
      [artikel 9, tweede lid][ref1], bedoelde inschrijfperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0005324#Artikel9
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005324
        artikel: '9'
        hoofdstuk: II
  - number: '13.2'
    text: 'Bij de aanmelding tot het afleggen van een schoolexamen legt de kandidaat over:'
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel13
  - number: 13.2.a
    text: een gewaarmerkt afschrift van de benodigde gegevens uit de basisadministratie persoonsgegevens en
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel13
  - number: 13.2.b
    text: |-
      een verklaring van ontheffing als bedoeld in [artikel 15, vijfde lid][ref1], voor zover van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005324#Artikel15
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005324
        artikel: '15'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '13.3'
    text: |-
      Bij de aanmelding voor de examens ter verkrijging van de diploma's, bedoeld in
      [artikel 3, eerste lid, onder a, b, en e][ref1], wordt tevens overgelegd het bewijs van behaalde diensttijd,
      bedoeld in [artikel 23][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005324#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005324#Artikel23
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005324
        artikel: '3'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0005324
        artikel: '23'
        hoofdstuk: V
  - number: '13.4'
    text: |-
      Bij de aanmelding voor het examen ter verkrijging van het diploma als tweede stuurman voor de grote handelsvaart
      wordt tevens overgelegd het diploma als derde stuurman voor de grote handelsvaart, het diploma als stuurman voor
      de grote sleepvaart dan wel het diploma als stuurman voor de kleine handelsvaart tezamen met het aanvullingsdiploma
      als stuurman voor de kleine handelsvaart.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel13
  - number: '13.5'
    text: |-
      Bij de aanmelding voor het examen ter verkrijging van het diploma als eerste stuurman voor de grote handelsvaart
      wordt tevens overgelegd het bewijs dat het examen voor de verkrijging van het diploma als tweede stuurman voor de
      grote handelsvaart met gunstig gevolg werd afgelegd.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel13
  - number: '13.6'
    text: |-
      Bij de aanmelding voor het examen ter verkrijging van het diploma A als scheepswerktuigkundige wordt tevens
      overgelegd het diploma als motordrijver, het voorlopig diploma als scheepswerktuigkundige dan wel het diploma als
      assistent-scheepswerktuigkundige.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel13
  - number: '13.7'
    text: |-
      Bij de aanmelding voor het examen ter verkrijging van het diploma B als scheepswerktuigkundige wordt tevens
      overgelegd het diploma A als scheepswerktuigkundige.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel13
  - number: '13.8'
    text: |-
      Bij de aanmelding voor het examen ter verkrijging van het diploma C als scheepswerktuigkundige wordt tevens
      overgelegd het bewijs dat het examen voor de verkrijging van het diploma B als scheepswerktuigkundige met gunstig
      gevolg is afgelegd.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel13
  - number: '13.9'
    text: |-
      De Voorzitter zendt aan degene die aan de aanmeldings en toelatingsvoorwaarden, bedoeld in het eerste tot
      en met het achtste lid, heeft voldaan een verklaring van toegang tot het schoolexamen toe, vergezeld van een
      aanmeldingsformulier voor het centrale deel van het examen.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel13
  - number: '13.10'
    text: |-
      De in artikel 9, eerste lid, van de Wet op de zeevaartdiploma's bedoelde vergoeding dient door de kandidaat aan de
      school waar door hem het schoolexamen zal worden afgelegd te worden betaald.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel13
  - number: '14.1'
    text: |-
      Degene, die aan het centrale deel van het examen wenst deel te nemen dient daartoe bij de Voorzitter het volledig
      ingevulde aanmeldingsformulier als bedoeld in [artikel 13, negende lid][ref1], in binnen de in [artikel 9][ref2]
      genoemde inschrijfperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0005324#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005324#Artikel9
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005324
        artikel: '13'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005324
        artikel: '9'
        hoofdstuk: II
  - number: '14.2'
    text: 'Bij het aanmeldingsformulier worden gevoegd:'
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel14
  - number: 14.2.a
    text: een goedgelijkende pasfoto in tweevoud;
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel14
  - number: 14.2.b
    text: |-
      een gewaarmerkt afschrift van de benodigde gegevens uit de basisadministratie persoonsgegevens indien het
      voorgedrukte adres op het aanmeldingsformulier niet (meer) juist is;
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel14
  - number: 14.2.c
    text: |-
      een verklaring van de voorzitter van de schoolcommissie dat de kandidaat ten aanzien van de schooltoetsvakken heeft
      voldaan aan de normen, bedoeld in [artikel 18, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005324#Artikel18
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005324
        artikel: '18'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 14.2.d
    text: |-
      een bewijs van betaling van de in artikel 9, eerste lid, van de Wet op de zeevaartdiploma's bedoelde vergoeding
      wanneer het een aanmelding voor een herexamen dan wel herkansing betreft en
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel14
  - number: 14.2.e
    text: |-
      een verklaring van ontheffing als bedoeld in [artikel 15, vijfde lid][ref1], voor zover van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005324#Artikel15
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005324
        artikel: '15'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '14.3'
    text: |-
      Bij de aanmelding voor de examens ter verkrijging van de diploma's, bedoeld in
      [artikel 3, eerste lid, onder a en b][ref1], worden tevens gevoegd:


      [ref1]: https://wetten.overheid.nl/BWBR0005324#Artikel3
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005324
        artikel: '3'
        hoofdstuk: I
  - number: 14.3.a
    text: |-
      het bewijs dat de radarwaarnemercursus aan een door het Rijk bekostigde school met gunstig gevolg is doorlopen, dan
      wel enig ander naar het oordeel van Onze Minister daarmee gelijk te stellen bewijs en
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel14
  - number: 14.3.b
    text: het algemeen certificaat van bediening als radiotelefonist.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel14
  - number: '15.1'
    text: |-
      Examens in de vakken opgenomen in [Bijlage II onder C][ref1], bij dit besluit, worden afgenomen door de
      schoolcommissies bedoeld in [artikel 3, sub 1°][ref2], overeenkomstig een door de betrokken schoolcommissie op te
      stellen regeling die de goedkeuring van Onze Minister behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005324
      [ref2]: https://wetten.overheid.nl/BWBR0005324#Artikel3
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005324
      - id: ref2
        bwb_id: BWBR0005324
        artikel: '3'
        hoofdstuk: I
  - number: '15.2'
    text: |-
      Examens in de vakken opgenomen in [Bijlage I][ref1], respectievelijk [Bijlage III][ref2], bij dit besluit, worden
      afgenomen door de Commissie voor de stuurliedenexamens, bedoeld in [artikel 2, eerste lid][ref3], respectievelijk
      de Commissie voor de examens van scheepswerktuigkundigen, bedoeld in [artikel 2, tweede lid][ref4], overeenkomstig
      door Onze Minister vast te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0005324
      [ref2]: https://wetten.overheid.nl/BWBR0005324
      [ref3]: https://wetten.overheid.nl/BWBR0005324#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0005324#Artikel2
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005324
      - id: ref2
        bwb_id: BWBR0005324
      - id: ref3
        bwb_id: BWBR0005324
        artikel: '2'
        hoofdstuk: I
      - id: ref4
        bwb_id: BWBR0005324
        artikel: '2'
        hoofdstuk: I
  - number: '15.3'
    text: |-
      De kennis die wordt gevorderd is per vak aangegeven in de examenprogramma's, die door Onze Minister worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel15
  - number: '15.4'
    text: |-
      Onze Minister stelt vast op grond van het bezit van welke diploma's ontheffing wordt verleend voor het afleggen van
      een of meer vakken van een examen.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel15
  - number: '15.5'
    text: Indien ontheffing wordt verleend geeft Onze Minister een desbetreffende verklaring af.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel15
  - number: '16'
    text: |-
      De examens worden schriftelijk afgenomen. Indien de aard van het te examineren vak dan wel het aantal te examineren
      kandidaten daartoe aanleiding geeft kan het examen mondeling of praktisch worden afgenomen.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel16
  - number: '17.1'
    text: |-
      Het oordeel over het in elk vak of gedeelte daarvan afgelegde examen wordt uitgedrukt in gehele cijfers, waarvan
      het laagste cijfer 1 en het hoogste cijfer 10 is.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel17
  - number: '17.2'
    text: |-
      Wanneer het examen in een vak uit meer dan een gedeelte bestaat, wordt het eindcijfer voor dat vak bepaald door het
      gemiddelde van de bij die gedeelten behaalde cijfers, waarbij breuken van een half of meer naar boven en breuken
      van minder dan een half naar beneden worden afgerond.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel17
  - number: '18.1'
    text: |-
      Onze Minister stelt ter bepaling van de uitslag van de examens in de vakken bedoeld in de bij dit besluit behorende
      [Bijlagen I][ref1], [II][ref2] en [III][ref3], normen vast.


      [ref1]: https://wetten.overheid.nl/BWBR0005324
      [ref2]: https://wetten.overheid.nl/BWBR0005324
      [ref3]: https://wetten.overheid.nl/BWBR0005324
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005324
      - id: ref2
        bwb_id: BWBR0005324
      - id: ref3
        bwb_id: BWBR0005324
  - number: '18.2'
    text: |-
      De schoolcommissie bepaalt of de kandidaat aan de normen voldoet voor zover het de in [Bijlage II][ref1] bij dit
      besluit bedoelde vakken betreft. Indien hij voldoet wordt aan hem een schoolverklaring uitgereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0005324
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005324
  - number: '18.3'
    text: |-
      De Commissie bepaalt aan de hand van de normen of de kandidaat is geslaagd of afgewezen voor de examens, bedoeld in
      [artikel 2, eerste en tweede lid][ref1], dan wel voor het centrale deel van een examen.


      [ref1]: https://wetten.overheid.nl/BWBR0005324#Artikel2
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005324
        artikel: '2'
        hoofdstuk: I
  - number: '19.1'
    text: |-
      Een kandidaat die, nadat hij voor de eerste maal een examen als bedoeld in [artikel 12][ref1], dan wel
      [artikel 14][ref2], ter verkrijging van een diploma heeft afgelegd, niet voldoet aan de normen om te slagen, kan
      eenmaal, binnen de periode van een jaar, herexamen afleggen in de vakken waarvoor het cijfer lager dan zes is
      behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005324#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005324#Artikel14
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005324
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005324
        artikel: '14'
        hoofdstuk: III
        paragraaf: '3'
  - number: '19.2'
    text: Onze Minister bepaalt het maximum aantal vakken waarin herexamen kan worden gedaan.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel19
  - number: '20.1'
    text: |-
      Nadat de Commissie heeft bepaald dat de kandidaat voor herexamen in aanmerking komt, worden de herexamendata aan de
      kandidaat medegedeeld tezamen met de inschrijvingsperiode hiervoor.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel20
  - number: '20.2'
    text: |-
      Op de aanmelding voor een herexamen als bedoeld in het eerste lid, is het bepaalde in [artikel 12][ref1],
      respectievelijk [artikel 14][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005324#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005324#Artikel14
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005324
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005324
        artikel: '14'
        hoofdstuk: III
        paragraaf: '3'
  - number: '20.3'
    text: |-
      Indien een herexamen niet tijdig is afgelegd of indien, na het afleggen daarvan, blijkt dat wederom niet is voldaan
      aan de normen om te slagen, wordt de kandidaat afgewezen en is het bepaalde in [artikel 19, eerste lid][ref1], niet
      meer op hem van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005324#Artikel19
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005324
        artikel: '19'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '21.1'
    text: Indien een kandidaat wordt uitgesloten van verdere deelneming, wordt hij beschouwd niet te hebben deelgenomen.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel21
  - number: '21.2'
    text: |-
      Indien een kandidaat zich tijdens het examen terugtrekt, wordt hij beschouwd niet te hebben deelgenomen, tenzij
      zulks, naar het oordeel van de Voorzitter, het gevolg is van overmacht.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel21
  - number: '21.3'
    text: |-
      Indien de Voorzitter ingevolge het bepaalde in het tweede lid van oordeel is dat de kandidaat zich heeft
      teruggetrokken als gevolg van overmacht, bepaalt hij op welk tijdstip de kandidaat het examen alsnog kan voltooien.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel21
  - number: '22.1'
    text: |-
      Degene, die is afgewezen na een examen wordt niet nogmaals geëxamineerd in de vakken waarvoor hij reeds het
      eindcijfer 6 of hoger had behaald, mits het examen binnen een door Onze Minister te bepalen periode wordt afgelegd.
      Het reeds behaalde eindcijfer zal dan op de nieuwe cijferlijst worden overgenomen.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel22
  - number: '22.2'
    text: |-
      Op de aanmelding voor een herkansing als bedoeld in het eerste lid, is het bepaalde in [artikel 12][ref1],
      respectievelijk [artikel 14][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005324#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005324#Artikel14
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005324
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005324
        artikel: '14'
        hoofdstuk: III
        paragraaf: '3'
  - number: '23'
    text: |-
      De Voorzitter gaat eerst over tot de uitreiking van enig diploma of stoomkennisbewijs waarvoor door de kandidaat
      met gunstig gevolg examen volgens dit besluit is afgelegd nadat hem is gebleken dat de kandidaat tevens in het
      bezit is van:
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.a
    text: 'voor het diploma als stuurman voor de beperkte kleine handelsvaart:'
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.a.1°
    text: |-
      het bewijs, dat hij gedurende ten minste een jaar dekdienst heeft gedaan aan boord van zeeschepen of
      zeevissersvaartuigen dan wel gedurende die periode heeft dienst gedaan als geïntegreerd scheepsgezel en
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.a.2°
    text: |-
      het certificaat van bediening van VHF- en UHF-radiotelefonie-installaties dan wel het algemeen certificaat van
      bediening als radiotelefonist.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.b
    text: 'voor het diploma als stuurman voor de kleine handelsvaart:'
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.b.1°
    text: |-
      het bewijs, dat hij gedurende ten minste een jaar dekdienst heeft gedaan aan boord van zeeschepen of
      zeevissersvaartuigen dan wel gedurende die periode heeft dienst gedaan als geïntegreerd scheepsgezel;
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.b.2°
    text: |-
      het bewijs dat een radarwaarnemercursus aan een door het Rijk bekostigde school met goed gevolg is doorlopen, dan
      wel enig ander naar het oordeel van Onze Minister daarmee gelijk te stellen bewijs en
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.b.3°
    text: het algemeen certificaat van bediening als radiotelefonist.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.c
    text: 'voor het aanvullingsdiploma als stuurman voor de kleine handelsvaart:'
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.c.1°
    text: het diploma als stuurman voor de kleine handelsvaart;
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.c.2°
    text: |-
      het bewijs dat een radarwaarnemercursus aan een door het Rijk bekostigde school met goed gevolg is doorlopen, dan
      wel enig ander naar het oordeel van Onze Minister daarmee gelijk te stellen bewijs en
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.c.3°
    text: het algemeen certificaat van bediening als radiotelefonist.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.d
    text: 'voor het diploma als stuurman voor de grote sleepvaart:'
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.d.1°
    text: |-
      het bewijs dan hij gedurende ten minste een jaar dekdienst heeft gedaan aan boord van zeesleepboten of zeegaand
      aannemersmateriaal dan wel gedurende die periode heeft dienst gedaan als geïntegreerd scheepsgezel;
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.d.2°
    text: |-
      het bewijs dat een radarwaarnemercursus aan een door het Rijk bekostigde school met goed gevolg is doorlopen, dan
      wel enig ander naar het oordeel van Onze Minister daarmee gelijk te stellen bewijs en
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.d.3°
    text: het algemeen certificaat van bediening als radiotelefonist.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.e
    text: 'voor het diploma als stuurman voor de kustsleepvaart:'
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.e.1°
    text: |-
      het bewijs dat hij gedurende ten minste een jaar dekdienst heeft gedaan aan boord van zeesleepboten of zeegaand
      aannemersmateriaal dan wel gedurende die periode heeft dienst gedaan als geïntegreerd scheepsgezel en
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.e.2°
    text: |-
      het certificaat van bediening van VHF- en UHF-radiotelefonie-installaties dan wel het algemeen certificaat van
      bediening als radiotelefonist.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.f
    text: |-
      voor het diploma als stuurman voor de kleine handelsvaart tezamen met het aanvullingsdiploma als stuurman voor de
      kleine handelsvaart:
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.f.1°
    text: |-
      het bewijs, dat hij gedurende ten minste één jaar dekdienst heeft gedaan aan boord van zeeschepen of
      zeevissersvaartuigen dan wel gedurende die periode heeft dienst gedaan als geïntegreerd scheepsgezel;
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.f.2°
    text: |-
      het bewijs dat een radarwaarnemercursus aan een door het Rijk bekostigde school met goed gevolg is doorlopen, dan
      wel enig ander naar het oordeel van Onze Minister daarmee gelijk te stellen bewijs en
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.f.3°
    text: het algemeen certificaat van bediening als radiotelefonist.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.g
    text: 'voor het diploma als derde stuurman voor de grote handelsvaart:'
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.g.1°
    text: |-
      het bewijs, dat hij gedurende ten minste een jaar dekdienst heeft gedaan aan boord van zeeschepen of
      zeevissersvaartuigen dan wel gedurende die periode heeft dienst gedaan als geïntegreerd scheepsgezel;
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.g.2°
    text: |-
      het bewijs dat een radarwaarnemercursus aan een door het Rijk bekostigde school met goed gevolg is doorlopen, dan
      wel enig ander naar het oordeel van Onze Minister daarmee gelijk te stellen bewijs en
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.g.3°
    text: het algemeen certificaat van bediening als radiotelefonist.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.h
    text: 'voor het diploma als tweede stuurman voor de grote handelsvaart:'
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.h.1°
    text: |-
      het diploma als derde stuurman voor de grote handelsvaart of het diploma als stuurman voor de kleine handelsvaart
      tezamen met het aanvullingsdiploma als zodanig of het diploma als stuurman voor de grote sleepvaart;
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.h.2°
    text: |-
      het bewijs dat hij, in het bezit van een der vorengenoemde diploma's, gedurende ten minste twee jaren heeft dienst
      gedaan als wachtdoend stuurman of maritiem officier aan boord van zeeschepen;
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.h.3°
    text: |-
      het bewijs dat een radarwaarnemercursus aan een door het Rijk bekostigde school met goed gevolg is doorlopen, dan
      wel enig ander naar het oordeel van Onze Minister daarmee gelijk te stellen bewijs en
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.h.4°
    text: het algemeen certificaat van bediening als radiotelefonist.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.i
    text: 'voor het diploma als eerste stuurman voor de grote handelsvaart:'
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.i.1°
    text: het diploma als tweede stuurman voor de grote handelsvaart;
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.i.2°
    text: |-
      het bewijs dat een radarnavigatorcursus aan een door het Rijk bekostigde school met goed gevolg is doorlopen, dan
      wel enig ander naar het oordeel van Onze Minister daarmee gelijk te stellen bewijs;
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.i.3°
    text: |-
      het bewijs dat hij, in het bezit van het diploma als tweede stuurman voor de grote handelsvaart, gedurende ten
      minste twee jaren heeft dienst gedaan als wachtdoend stuurman of maritiem officier aan boord van zeeschepen met een
      bruto-tonnage van 2000 of meer en
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.i.4°
    text: het algemeen certificaat van bediening als radiotelefonist.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.j
    text: |-
      voor het voorlopig diploma als scheepswerktuigkundige: het bewijs dat hij gedurende ten minste een jaar heeft
      dienst gedaan in de machinekamer van zeeschepen of zeevissersvaartuigen dan wel gedurende die periode heeft
      dienstgedaan als geïntegreerd scheepsgezel;
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.k
    text: |-
      voor het diploma als assistent-scheepswerktuigkundige: het bewijs dat hij gedurende ten minste een jaar heeft
      dienst gedaan in de machinekamer van zeeschepen of zeevissersvaartuigen dan wel gedurende die periode heeft
      dienstgedaan als geïntegreerd scheepsgezel.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.l
    text: |-
      voor het diploma als motordrijver: het bewijs dat hij gedurende ten minste een jaar heeft dienst gedaan in
      de machinekamer van zeeschepen of zeevisservaartuigen dan wel gedurende die periode heeft dienstgedaan als
      geïntegreerd scheepsgezel.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.m
    text: |-
      voor het diploma A als scheepswerktuigkundige: het voorlopig diploma als scheepswerktuigkundige, het diploma als
      assistent-scheepswerktuigkundige dan wel het diploma als motordrijver.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.n
    text: 'voor het diploma B als scheepswerktuigkundige:'
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.n.1°
    text: het diploma A als scheepswerktuigkundige en
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.n.2°
    text: |-
      het bewijs dat hij in het bezit van dat diploma gedurende ten minste twee jaren heeft dienst gedaan als
      scheepswerktuigkundige of maritiem officier aan boord van zeeschepen met een voortstuwingsvermogen van 1500 kW
      of meer.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.o
    text: 'voor het diploma C als scheepswerktuigkundige:'
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.o.1°
    text: het diploma B als scheepswerktuigkundige en
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.o.2°
    text: |-
      het bewijs dat hij in het bezit van dat diploma gedurende ten minste twee jaar dienst heeft gedaan als
      scheepswerktuigkundige of maritiem officier aan boord van zeeschepen met een voortstuwingsvermogen van 3000 kW
      of meer.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.p
    text: 'voor het kennisbewijs stoomvoortstuwing B: het diploma A als scheepswerktuigkundige.'
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: 23.q
    text: 'voor het kennisbewijs stoomvoortstuwing C: het kennisbewijs stoomvoortstuwing B.'
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel23
  - number: '24.1'
    text: |-
      De diensttijd, bedoeld in [artikel 23][ref1], dient te zijn doorgebracht aan boord van een in de vaart zijnd
      werktuigelijk voortbewogen zeeschip, blijkende uit zodanige bescheiden als daartoe door de Voorzitter voldoende
      worden geoordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005324#Artikel23
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005324
        artikel: '23'
        hoofdstuk: V
  - number: '24.2'
    text: |-
      Als diensttijd kan, geheel of gedeeltelijk, zulks ter beoordeling van Onze Minister, ook gelden de tijd
      doorgebracht op andere schepen of op andere wijze dan bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel24
  - number: '25'
    text: |-
      Onze Minister kan ontheffing verlenen van het bepaalde in de [artikelen 12][ref1], [13][ref2] en [14][ref3], zo
      nodig onder door hem te stellen voorwaarden en beperkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005324#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005324#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0005324#Artikel14
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005324
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005324
        artikel: '13'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005324
        artikel: '14'
        hoofdstuk: III
        paragraaf: '3'
  - number: '26'
    text: |-
      Degene die met gunstig gevolg examen heeft afgelegd, doch niet aan alle voorwaarden voldoet zoals genoemd in
      [artikel 23][ref1] en waarop de [artikelen 24, tweede lid][ref2], en [25][ref3], niet van toepassing zijn, ontvangt
      van de Voorzitter een kennisbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0005324#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0005324#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0005324#Artikel25
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005324
        artikel: '23'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0005324
        artikel: '24'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0005324
        artikel: '25'
        hoofdstuk: V
  - number: '27'
    text: |-
      Onze Minister stelt de modellen vast van de krachtens dit besluit uit te reiken schoolverklaringen, kennisbewijzen,
      stoomkennisbewijzen en diploma's.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel27
  - number: '28'
    text: |-
      Een duplicaat van een uitgereikt diploma of bewijsstuk wordt slechts afgegeven indien de belanghebbende aannemelijk
      kan maken, dat het oorspronkelijke diploma of bewijsstuk verloren is geraakt. Voor de afgifte van een duplicaat
      diploma of bewijsstuk is geen vergoeding verschuldigd indien het oorspronkelijke diploma of bewijsstuk verloren is
      geraakt tengevolge van een oorlogsdaad of van een scheepsramp.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel28
  - number: '29'
    text: |-
      De kandidaat die valse of vervalste bescheiden overlegt, kan voor ten hoogste een jaar door de Voorzitter van
      deelname aan een examen worden uitgesloten.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel29
  - number: '30'
    text: |-
      Indien blijkt dat een kandidaat zich aan enige onregelmatigheid heeft schuldig gemaakt of tijdens het examen bedrog
      heeft gepleegd, kan de Voorzitter, na overleg met de Commissie, de kandidaat van verdere deelneming uitsluiten dan
      wel het diploma of het bewijsstuk onthouden of het reeds uitgereikte diploma of bewijsstuk intrekken.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel30
  - number: '31.1'
    text: |-
      De Voorzitter legt een beslissing als bedoeld in de [artikelen 29][ref1] en [30][ref2] binnen twee weken vast in
      een beschikking en geeft van deze beschikking kennis aan Onze Minister door toezending van een afschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005324#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0005324#Artikel30
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005324
        artikel: '29'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0005324
        artikel: '30'
        hoofdstuk: VI
  - number: '31.2'
    text: |-
      Tegen een beschikking van de Voorzitter als bedoeld in het eerste lid kan de belanghebbende beroep instellen bij
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel31
  - number: '31.3'
    text: De Commissie handelt overeenkomstig de door Onze Minister genomen beslissing.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel31
  - number: '32.1'
    text: Het Examenreglement zeevaartdiploma's (*Stb.* 1990, 30) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel32
  - number: '32.2'
    text: |-
      Kandidaten die vóór 1 januari 1991 examen hebben afgelegd en voor het afleggen van een herexamen in
      aanmerking kwamen, kunnen tot 1 januari 1992 herexamen afleggen volgens de bepalingen van het Examenreglement
      zeevaartdiploma's.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel32
  - number: '32.3'
    text: |-
      De bepalingen van het Examenreglement zeevaartdiploma's met betrekking tot sancties en beroep blijven van kracht
      tot 1 januari 1992, voor zover dit de herexamens betreft.
    url: https://wetten.overheid.nl/BWBR0005324/1994-10-01#Artikel32
  - number: '33'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin
      het wordt geplaatst en werkt terug tot en met 1 januari 1991, met dien verstande dat de [artikelen 1][ref1],
      [3][ref2], [4][ref3], [5][ref4], [9][ref5], [10][ref6], [13][ref7], [14][ref8], [15][ref9], [16][ref10],
      [17][ref11], [18][ref12], [25][ref13], [27][ref14], [29][ref15], [30][ref16] en [31][ref17], voor zover deze geen
      betrekking hebben op het centrale deel van de examens, tot en met 1 september 1990 terugwerken.


      [ref1]: https://wetten.overheid.nl/BWBR0005324#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005324#Artikel3
