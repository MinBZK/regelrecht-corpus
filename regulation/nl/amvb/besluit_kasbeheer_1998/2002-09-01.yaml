    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Financiën van 27 oktober 1997, nr. B97/416M, Directoraat-Generaal van de
    Rijksbegroting, Directie Begrotingszaken, en de Centrale Directie Wetgeving, Juridische en Bestuurlijke Zaken;

    Gelet op artikel 32, aanhef en onder a en c, en op artikel 34, eerste lid, van de Comptabiliteitswet;

    Gezien het advies van de Algemene Rekenkamer van 12 augustus 1997, nr. 799R;

    De Raad van State gehoord (advies van 24 december 1997, nr. W06.97.686);

    Gezien het nader rapport van Onze Minister van Financiën van 19 januari 1998, nr. B97/522U, Directoraat-Generaal
    van de Rijksbegroting, Directie Begrotingszaken, en de Centrale Directie Wetgeving, Juridische en Bestuurlijke
    Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009347/2002-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. *kasbeheer*: de zorg voor:

      1. de vorderingen van het Rijk (vorderingenbeheer);

      2. de betalingen van het Rijk (betalingenbeheer);

      3. het geld en de geldswaardige papieren bij het Rijk (geldelijk beheer).

      b. *centrale kassen*: de door Onze Minister van Financiën centraal beheerde tegoeden op door hem aangewezen
      rekeningen bij in Nederland gevestigde bankinstellingen.

      c. *kassen*: voorraden contante gelden en tegoeden op bankrekeningen van het Rijk.

      d. *Onze ministers*: Onze betrokken ministers, ieder voor zover het hem aangaat;

      e. *begroting*: een van de onderdelen van de begroting van het Rijk, bedoeld in
      [artikel 1 van de Comptabiliteitswet 2001][ref1].

      2 Tot het kasbeheer worden in elk geval de volgende beheershandelingen gerekend:

      a. het bewaren van geld en geldswaardige papieren;

      b. het betaalbaar stellen van aangegane financiële verplichtingen;

      c. het verrichten van geldelijke betalingen;

      d. het invorderbaar stellen van vorderingen;

      e. het innen van geldelijke ontvangsten;

      f. het opnemen en storten van contant geld;

      g. het electronisch opladen en afwaarderen van contantgeldkaarten;

      h. het in ontvangst nemen en het afgeven van geldswaardige papieren;

      i. het aanwijzen van ordonnateurs, kasbeheerders en van kassiers en het intrekken van zodanige aanwijzingen;

      j. het administreren van de beheershandelingen, genoemd onder a tot en met i.

      3 Tot geldswaardige papieren worden gerekend:

      a. effecten, als bedoeld in [artikel 1, onder a, van de Wet toezicht effectenverkeer 1995][ref2];

      b. cheques;

      c. bankpassen, creditkaarten en contantgeldkaarten;

      d. andere door Onze Minister van Financiën aan te wijzen papieren of stukken.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel1
    url: https://wetten.overheid.nl/BWBR0009347/2002-09-01#Artikel1
