        artikel: '1'
  - number: '2'
    text: |-
      1 Onze ministers zijn belast met het kasbeheer, ieder voorzover dit beheer voortvloeit uit het beheer van de
      begrotingen en de rekeningen buiten begrotingsverband waarmee hij is belast.

      2 Onze Minister van Financiën voert het kasbeleid van het Rijk.

      3 Onze Minister van Financiën kan nadere regels stellen met betrekking tot het kasbeheer.

      4 Onze Minister van Financiën kan Onze ministers aanwijzingen geven voor de wijze waarop het kasbeheer wordt
      gevoerd.

      5 Onze Minister van Financiën draagt de zorg voor de bewaring van de aan het Rijk toebehorende en toevertrouwde
      effecten.

      6 Onze ministers kunnen Onze Minister van Financiën verzoeken zich te belasten met de bewaring van andere
      geldswaardige papieren dan effecten.
    url: https://wetten.overheid.nl/BWBR0009347/2002-09-01#Artikel2
  - number: '3'
    text: |-
      1 Ten behoeve van een rechtmatig en doelmatig kasbeheer leggen Onze ministers de beschrijving van de
      administratieve organisatie met betrekking tot het kasbeheer vast en dragen zij zorg voor de toepassing van de in
      die beschrijving vastgelegde procedures.

      2 In de administratieve organisatie wordt rekening gehouden met het toepassen van voldoende functiescheiding tussen
      in elk geval de ordonnateur en de kasbeheerder.

      3 Onze ministers kunnen, met inachtneming van de bepalingen van dit besluit en van de door Onze Minister van
      Financiën krachtens dit besluit gestelde regels, voor de onder hen ressorterende dienstonderdelen nadere regels met
      betrekking tot het kasbeheer stellen.
    url: https://wetten.overheid.nl/BWBR0009347/2002-09-01#Artikel3
  - number: '4'
    text: |-
      1 De ordonnateur is belast met het verlenen van de interne opdrachten tot het verrichten van de betalingen die
      uit de aangegane financiële verplichtingen van het Rijk voortvloeien, dan wel met het verlenen van de interne
      opdrachten tot het innen van de ontvangsten die uit de invorderbaar gestelde vorderingen van het Rijk voortvloeien.

      2 Met betrekking tot te verrichten betalingen draagt de ordonnateur zorg voor een deugdelijke verificatie van de
      betalingsnoodzaak.

      3 Met betrekking tot de in te stellen vorderingen draagt de ordonnateur zorg voor een deugdelijke verificatie van
      het recht op de vorderingen.
    url: https://wetten.overheid.nl/BWBR0009347/2002-09-01#Artikel4
  - number: '5'
    text: |-
      1 De kasbeheerder heeft de beschikkingsbevoegdheid over de hem door de betrokken directeur Financieel-Economische
      Zaken in beheer gegeven kassen en geldswaardige papieren. Uit dien hoofde verricht hij de betalingen en de
      ontvangsten waartoe de betrokken ordonnateur hem opdracht geeft, is hij belast met de ontvangst en de afgifte van
      geldswaardige papieren en bewaart hij op een zo veilig mogelijke plaats de contante gelden en de geldswaardige
      papieren.

      2 De kasbeheerder ziet toe op de rechtmatigheid van de te verrichten betalingen en ontvangsten. Indien hij van
      oordeel is dat een betaling of ontvangst niet rechtmatig is, pleegt hij overleg met de ordonnateur en zo nodig met
      diens hoofd van dienst. Leidt dit overleg niet tot overeenstemming, dan wordt het geschil ter beslissing voorgelegd
      aan de betrokken directeur Financieel-Economische Zaken. Van een dergelijk geschil blijkt in voldoende mate uit het
      betrokken dossier.

      3 De kasbeheerder legt, met inachtneming van de door Onze betrokken minister te stellen regels, periodiek in
      een jaar over de door hem in die functie verrichte werkzaamheden, aan de hand van de financiële administratie
      verantwoording af aan het betrokken hoofd van dienst.

      4 Een hoofd van dienst kan, na verkregen instemming van de betrokken directeur Financieel-Economische Zaken en van
      de betrokken kasbeheerder, ter ondersteuning van de kasbeheerder één of meer kassiers benoemen.

      5 Een kassier volgt, met inachtneming van de geldende voorschriften, bij de uitvoering van zijn werkzaamheden de
      aanwijzingen van de betrokken kasbeheerder op.
    url: https://wetten.overheid.nl/BWBR0009347/2002-09-01#Artikel5
  - number: '6'
    text: |-
      1 Onze Minister van Financiën houdt per begroting één of meer rekeningen-courant aan tussen het Ministerie van
      Financiën en het ministerie van Onze minister die de betrokken begroting beheert.

      2 In afwijking van het eerste lid kan Onze Minister van Financiën in overeenstemming met Onze betrokken minister
      besluiten tot het aanhouden van één rekening-courant voor meer dan één begroting tussen het Ministerie van
      Financiën en het ministerie van Onze minister die die begrotingen beheert.

      3 Onze andere ministers zijn niet bevoegd tot het aanhouden van onderlinge rekeningen-courant tussen hun
      ministeries, tenzij Onze Minister van Financiën daaraan zijn toestemming heeft verleend.
    url: https://wetten.overheid.nl/BWBR0009347/2002-09-01#Artikel6
  - number: '7'
    text: |-
      1 Onze Minister van Financiën is bevoegd in bepaalde gevallen derden toe te staan een geldelijk tegoed aan te
      houden op een rekening-courant bij het Ministerie van Financiën.

      2 De voorwaarden die gelden voor het aanhouden van een rekening-courant door een derde bij het Ministerie van
      Financiën worden per rekening-courant in een overeenkomst vastgelegd, tenzij die voorwaarden op grond van een
      wettelijke of een verdragsverplichting voldoende duidelijk vastliggen.
    url: https://wetten.overheid.nl/BWBR0009347/2002-09-01#Artikel7
  - number: '8'
    text: |-
      1 Onze Minister van Financiën bepaalt bij welke bankinstellingen het Rijk rekeningen kan aanhouden.

      2 Onze Minister van Financiën sluit namens het Rijk de overeenkomsten met de bankinstellingen over de modaliteiten
      waaronder het Rijk rekeningen aanhoudt.

      3 Onze ministers houden bij bankinstellingen rekeningen aan die in euro's luiden.

      4 Onze ministers hebben de instemming van Onze Minister van Financiën nodig voor:

      a. het aanhouden van rekeningen bij De Nederlandsche Bank NV en de NV Bank voor Nederlandse Gemeenten;

      b. het aanhouden van bankrekeningen die luiden in andere valuta dan in euro's.

      Aan het verlenen van zijn instemming kan Onze Minister van Financiën voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0009347/2002-09-01#Artikel8
  - number: '9'
    text: |-
      1 Het verrichten van geldelijke betalingen door het Rijk geschiedt door middel van een overboeking naar een
      bankrekening van de begunstigde, dan wel, als dat doelmatiger is, door middel van contant geld.

      2 In afwijking van het bepaalde in het eerste lid kan Onze Minister van Financiën bepalen, in welke situaties
      en onder welke voorwaarden het verrichten van geldelijke betalingen is toegestaan door middel van een andere
      betaalwijze dan genoemd in het eerste lid.

      3 Betalingen door het Rijk geschieden niet dan tegen voldoende kwijting.
    url: https://wetten.overheid.nl/BWBR0009347/2002-09-01#Artikel9
  - number: '10'
    text: |-
      1 Onze ministers bevorderen dat geldelijke ontvangsten van het Rijk zoveel mogelijk kunnen worden geïnd door middel
      van een overboeking naar of een storting op een bankrekening van het Rijk.

      2 Onze ministers ontmoedigen het verrichten van geldelijke betalingen door derden aan het Rijk door middel van
      creditkaarten, cheques en contant geld, tenzij die wijzen van betalen in bepaalde situaties aantoonbaar doelmatiger
      zijn.

      3 Ontvangen contante gelden en cheques worden zoveel mogelijk dagelijks verwerkt, zodanig dat een prompte
      bijboeking van de betrokken bedragen op een bankrekening van het Rijk is verzekerd.

      4 Het als geldelijke betaling in ontvangst nemen van niet-geldelijke zaken is niet toegestaan. Met de instemming
      van Onze Minister van Financiën kan hiervan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0009347/2002-09-01#Artikel10
  - number: '11'
    text: |-
      Contante gelden worden slechts tot een zodanige omvang aangehouden als nodig is voor het verrichten van de contante
      betalingen op korte termijn.
    url: https://wetten.overheid.nl/BWBR0009347/2002-09-01#Artikel11
  - number: '12'
    text: |-
      Het afgeven aan derden en het in ontvangst nemen van derden van geldswaardige papieren, bedoeld in
      [artikel 1, derde lid, onder a][ref1], geschiedt door het Rijk niet dan tegen een voldoende kwijting.


      [ref1]: https://wetten.overheid.nl/BWBR0009347#Artikel1
    url: https://wetten.overheid.nl/BWBR0009347/2002-09-01#Artikel12
