      het Staatsblad waarin het wordt geplaatst en werkt het terug tot en met 1 januari 1998.

      3 Dit besluit wordt aangehaald onder de titel: «Besluit kasbeheer 1998».
    url: https://wetten.overheid.nl/BWBR0009347/2002-09-01#Artikel16
