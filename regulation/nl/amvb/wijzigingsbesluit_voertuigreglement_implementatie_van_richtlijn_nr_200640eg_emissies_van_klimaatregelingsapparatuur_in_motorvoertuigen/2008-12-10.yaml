    Gelet op richtlijn nr. 2006/40/EG van het Europees Parlement en de Raad van de Europese Unie van 17 mei 2006 (PbEU
    L 161) betreffende emissies van klimaatregelingsapparatuur in motorvoertuigen en houdende wijziging van Richtlijn
    70/156/EEG van de Raad van de Europese Unie en de artikelen 22, eerste lid, 24, 26, eerste lid, 34, eerste lid, en
    71 van de Wegenverkeerswet 1994;

