  url: https://wetten.overheid.nl/BWBR0023533/2008-12-10#ArtikelAanhef
articles:
  - number: II
    text: |-
      Tot en met 20 juni 2008 wordt op verzoek van de fabrikant voor nieuwe personenauto’s of bedrijfsauto’s met een
      referentiemassa van niet meer dan 1305 kg, niet zijnde bussen, die zijn voorzien van een klimaatregelingssysteem
      dat is ontworpen om een gefluoreerd broeikasgas te bevatten met een aardopwarmingsvermogen van meer dan 150, een
      typegoedkeuring verleend als bedoeld in artikel 5, eerste lid, van [richtlijn nr. 2006/40/EG](32006L0040), indien
      het klimaatregelingssysteem wat betreft emissies aan die richtlijn voldoet.
    url: https://wetten.overheid.nl/BWBR0023533/2008-12-10#ArtikelII
  - number: III
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst, met uitzondering van [artikel I, onderdeel F][ref1], dat in werking treedt op een bij koninklijk besluit
      te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0023533#ArtikelI
    url: https://wetten.overheid.nl/BWBR0023533/2008-12-10#ArtikelIII
