---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: boetebesluit_werkgevers_coordinatiewet_sociale_verzekering
regulatory_layer: AMVB
publication_date: '2005-02-03'
valid_from: '2002-01-01'
bwb_id: BWBR0011389
url: https://wetten.overheid.nl/BWBR0011389/2002-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid, J. F. Hoogervorst, van 21 februari
    2000, Directie Sociale Verzekeringen, nr. SV/AVF/2000/10694;

    Gelet op artikel 12, zesde lid, van de Coördinatiewet Sociale Verzekering;

    De Raad van State gehoord (advies van 6 april 2000, no. W12.00.0063/IV);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid, J.F. Hoogervorst van 23 mei
    2000, Directie Sociale Verzekeringen, nr. SV/AVF/00/24362;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0011389/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0011389/2002-01-01#Artikel1
  - number: 1.a
    text: |-
      verzuim: het door de werkgever niet, niet juist of niet volledig voldoen aan een voor hem op grond van
      [artikel 10, tweede lid, van de Coördinatiewet Sociale Verzekering][ref1] geldende verplichting zonder dat daarbij
      sprake is van opzet of grove schuld;


      [ref1]: https://wetten.overheid.nl/BWBR0002126
    url: https://wetten.overheid.nl/BWBR0011389/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002126
  - number: 1.b
    text: |-
      vergrijp: het opzettelijk of aan grove schuld te wijten niet, niet juist of niet volledig voldoen door een
      werkgever aan een voor hem op grond van [artikel 10, tweede lid, van de Coördinatiewet Sociale Verzekering][ref1]
      geldende verplichting;


      [ref1]: https://wetten.overheid.nl/BWBR0002126#Artikel10
    url: https://wetten.overheid.nl/BWBR0011389/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002126
        artikel: '10'
  - number: 1.c
    text: |-
      UWV: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0011389/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: 1.d
    text: |-
      boete: een verhoging als bedoeld in
      [artikel 12, tweede en derde lid, van de Coördinatiewet Sociale Verzekering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002126#Artikel12
    url: https://wetten.overheid.nl/BWBR0011389/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002126
        artikel: '12'
  - number: '2'
    text: |-
      Het UWV beoordeelt of het niet voldoen aan een op grond van artikel 10, tweede lid, van de Coördinatiewet Sociale
      Verzekering geldende verplichting, al dan niet aan opzet of grove schuld te wijten is.
    url: https://wetten.overheid.nl/BWBR0011389/2002-01-01#Artikel2
  - number: '3.1'
    text: |-
      Bij een verzuim wordt een boete opgelegd die 5% van het verschuldigde of het alsnog verschuldigde bedrag aan premie
      of voorschotpremie bedraagt.
    url: https://wetten.overheid.nl/BWBR0011389/2002-01-01#Artikel3
  - number: '3.2'
    text: |-
      De in het eerste lid bedoelde boete is ten hoogste een geldboete van de derde categorie als bedoeld in
      [artikel 23 van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0011389/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '3.3'
    text: |-
      Indien in de vijf jaar voorafgaand aan het plegen van een verzuim geen boete is opgelegd of een schriftelijke
      waarschuwing is gegeven terzake van een ander verzuim of een vergrijp en het verzuim er niet toe heeft geleid dat
      te weinig premie is betaald, wordt geen boete opgelegd.
    url: https://wetten.overheid.nl/BWBR0011389/2002-01-01#Artikel3
  - number: '4'
    text: |-
      Bij een vergrijp legt het UWV aan de werkgever een boete op die 25% van het verschuldigde of het alsnog
      verschuldigde bedrag aan premie of voorschotpremie bedraagt.
    url: https://wetten.overheid.nl/BWBR0011389/2002-01-01#Artikel4
  - number: '5.1'
    text: |-
      Wanneer binnen vijf jaar sedert het einde van het kalenderjaar waarin, op grond van de
      [Coördinatiewet Sociale Verzekering][ref1], een boete is opgelegd wederom een verzuim of een vergrijp wordt
      gepleegd, wordt de boete terzake van dat verzuim of vergrijp verhoogd met 50%.


      [ref1]: https://wetten.overheid.nl/BWBR0002126
    url: https://wetten.overheid.nl/BWBR0011389/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002126
  - number: '5.2'
    text: |-
      Bij toepassing van het eerste lid wordt bij een verzuim als bedoeld in [artikel 3][ref1] het in het tweede lid van
      dat artikel bedoelde maximum niet overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0011389#Artikel3
    url: https://wetten.overheid.nl/BWBR0011389/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011389
        artikel: '3'
  - number: '5.3'
    text: |-
      Wanneer na het opleggen van een boete aan een recidiverende werkgever het boetebesluit terzake van het eerste
      verzuim of vergrijp in bezwaar of in beroep wordt vernietigd, restitueert het UWV de verhoging van de boete, die op
      grond van dit artikel is opgelegd, aan de werkgever.
    url: https://wetten.overheid.nl/BWBR0011389/2002-01-01#Artikel5
  - number: '6.1'
    text: |-
      Indien de ernst van de gedraging, de mate waarin de werkgever de gedraging verweten kan worden of de omstandigheden
      waarin de werkgever verkeert daartoe aanleiding geven, wordt de boete, die is berekend met toepassing van de
      [artikelen 3][ref1], [4][ref2] of [5][ref3], door het UWV verhoogd of verlaagd.


      [ref1]: https://wetten.overheid.nl/BWBR0011389#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011389#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0011389#Artikel5
    url: https://wetten.overheid.nl/BWBR0011389/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011389
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011389
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0011389
        artikel: '5'
  - number: '6.2'
    text: |-
      Bij toepassing van het eerste lid wordt [artikel 5, tweede lid][ref1] in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011389#Artikel5
    url: https://wetten.overheid.nl/BWBR0011389/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011389
        artikel: '5'
  - number: '7'
    text: Een boete lager dan € 45 wordt niet opgelegd.
    url: https://wetten.overheid.nl/BWBR0011389/2002-01-01#Artikel7
  - number: '8'
    text: De regeling Administratieve Boeten Coördinatiewet wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011389/2002-01-01#Artikel8
  - number: '9.1'
    text: |-
      De regeling Administratieve Boeten Coördinatiewet zoals die luidde op de dag voorafgaande aan de dag van
      inwerkingtreding van dit besluit, blijft van toepassing op verzuimen en vergrijpen gepleegd voorafgaande aan de dag
      van inwerkingtreding van dit besluit.
    url: https://wetten.overheid.nl/BWBR0011389/2002-01-01#Artikel9
  - number: '9.2'
    text: |-
      Indien voor een verzuim of een vergrijp, gepleegd voor inwerkingtreding van dit besluit, op grond van dit besluit
      een lagere boete zou moeten worden opgelegd dan op grond van de regeling Administratieve Boeten Coördinatiewet,
      wordt dit besluit toegepast.
    url: https://wetten.overheid.nl/BWBR0011389/2002-01-01#Artikel9
  - number: '10'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0011389/2002-01-01#Artikel10
  - number: '11'
    text: 'Dit besluit wordt aangehaald als: Boetebesluit werkgevers Coördinatiewet Sociale Verzekering.'
    url: https://wetten.overheid.nl/BWBR0011389/2002-01-01#Artikel11
