---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_medische_hulpmiddelen
regulatory_layer: AMVB
publication_date: '2020-05-07'
valid_from: '2016-10-06'
bwb_id: BWBR0007307
url: https://wetten.overheid.nl/BWBR0007307/2016-10-06
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport van 28 september 1994, GMV/G 943101,

    Gelet op

    Gezien het advies van de Geneesmiddelencommissie (advies van 21 januari 1994, Geco 4802/EJ);

    De Raad van State gehoord (advies van 21 december 1994, No. W13.94.0604);

    Gezien het nader rapport van Onze Minister van Volksgezondheid, Welzijn en Sport van 20 maart 1995, GMV/G 95767.

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel1
  - number: 1.1.a
    text: |-
      naar maat gemaakt medisch hulpmiddel: een medisch hulpmiddel dat speciaal is vervaardigd volgens voorschrift
      van een arts of van een andere persoon die uit hoofde van zijn beroep daartoe bevoegd is, waarin onder zijn
      verantwoordelijkheid de specifieke kenmerken van het ontwerp zijn aangegeven, en dat is bestemd om uitsluitend door
      een bepaalde patiënt te worden gebezigd;
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel1
  - number: 1.1.b
    text: |-
      medisch hulpmiddel bestemd voor klinisch onderzoek: een medisch hulpmiddel dat is bestemd om te worden gebruikt bij
      een klinisch onderzoek als bedoeld in onderdeel 2 van bijlage X van de richtlijn;
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel1
  - number: 1.1.c
    text: |-
      hulpstuk: een produkt dat door de fabrikant speciaal is bestemd om met een medisch hulpmiddel te worden gebruikt
      zodat dat middel overeenkomstig diens bestemming kan worden gebezigd of toegepast;
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel1
  - number: 1.1.d
    text: '*fabrikant:*de persoon, rechtspersoon daaronder begrepen, of diens gemachtigde, die:'
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel1
  - number: 1.1.d.1°
    text: |-
      verantwoordelijk is voor het ontwerp, de vervaardiging, de verpakking en de etikettering van een medisch hulpmiddel
      met het oog op het in de handel brengen ervan onder eigen naam, ongeacht of deze verrichtingen worden uitgevoerd
      door diezelfde persoon of onder zijn verantwoordelijkheid door een derde; of
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel1
  - number: 1.1.d.2°
    text: |-
      die één of meer geprefabriceerde produkten assembleert, verpakt, behandelt, vernieuwt of etiketteert, of aan deze
      produkten de bestemming van een medisch hulpmiddel toekent met het oog op het in de handel brengen ervan onder
      eigen naam;
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel1
  - number: 1.1.e
    text: |-
      *gemachtigde:*de in een lidstaat gevestigde persoon, rechtspersoon daaronder begrepen, die, na daartoe
      uitdrukkelijk door de fabrikant te zijn aangewezen, in rechte kan worden aangesproken ten aanzien van de
      verplichtingen die bij of krachtens dit besluit aan de fabrikant zijn opgelegd;
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel1
  - number: 1.1.f
    text: |-
      in de handel brengen: het voor het eerst tegen betaling of kosteloos afleveren van een medisch hulpmiddel, dat niet
      voor klinisch onderzoek is bestemd, met het oog op de distributie of het gebruik ervan op de markt van een lid-
      staat, ongeacht of het gaat om een nieuw of een vernieuwd medisch hulpmiddel;
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel1
  - number: 1.1.g
    text: |-
      bestemming: het gebruik waartoe het medisch hulpmiddel is bestemd volgens de aanwijzingen die de fabrikant op het
      etiket, in de gebruiksaanwijzing of in het reclame-materiaal verschaft;
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel1
  - number: 1.1.h
    text: 'aangemelde instantie: de ter uitvoering van artikel 16 van de richtlijn aangewezen instantie;'
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel1
  - number: 1.1.i
    text: |-
      lid-staat: de staat, die lid is van de Europese Unie, alsmede de staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel1
  - number: 1.1.j
    text: |-
      richtlijn: [richtlijn nr 93/42/EEG](31993L0042) van de Raad van de Europese Gemeenschappen van 14 juni 1993
      betreffende medische hulpmiddelen (*PbEG* L 169);
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel1
  - number: 1.1.k
    text: |-
      wet: de [Wet op de medische hulpmiddelen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002697
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002697
  - number: 1.1.l
    text: 'CE-markering: de markering overeenkomstig het model opgenomen in bijlage XII van de richtlijn;'
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel1
  - number: 1.1.m
    text: |-
      derivaat van menselijk bloed: een stof, als integrerend bestanddeel verwerkt in een medisch hulpmiddel, die, indien
      afzonderlijk gebruikt, kan worden beschouwd als een bestanddeel van een geneesmiddel of als een bloedproduct als
      bedoeld in [artikel 1, eerste lid, onder d, van de Geneesmiddelenwet][ref1], en die de werking van het hulpmiddel
      op het menselijk lichaam kan ondersteunen;


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel1
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '1'
  - number: 1.1.n
    text: |-
      hulpmiddelsubcategorie: een groep hulpmiddelen die bedoeld zijn voor gebruik op dezelfde gebieden, of een
      gemeenschappelijke technologie bezitten;
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel1
  - number: 1.1.o
    text: |-
      generieke hulpmiddelgroep: een groep hulpmiddelen die bedoeld zijn voor hetzelfde of een soortgelijk gebruik,
      of een gemeenschappelijke technologie bezitten, zodat zij op generieke wijze kunnen worden ingedeeld, waarbij
      specifieke eigenschappen buiten beschouwing blijven;
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel1
  - number: 1.1.p
    text: |-
      hulpmiddel voor eenmalig gebruik: een hulpmiddel dat bedoeld is om slechts eenmaal te worden gebruikt voor één
      patiënt;
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel1
  - number: 1.1.q
    text: |-
      richtlijn 2003/32/EG: richtlijn 2003/32/EG van de Commissie van 23 april 2003 tot vaststelling van nadere
      specificaties inzake de in Richtlijn 93/42/EEG van de Raad vastgelegde eisen betreffende medische hulpmiddelen die
      zijn vervaardigd met gebruikmaking van weefsel van dierlijke oorsprong (PbEU L 105);
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel1
  - number: 1.1.r
    text: |-
      klinische gegevens: uit het gebruik van een hulpmiddel voortkomende informatie betreffende de veiligheid of de
      prestaties, afkomstig uit: - klinisch onderzoek van het betrokken hulpmiddel, of
        - in de wetenschappelijke literatuur beschreven klinisch onderzoek van of andere studies over een soortgelijk
      hulpmiddel waarvan de gelijkwaardigheid met het hulpmiddel in kwestie kan worden aangetoond, of
        - gepubliceerde of ongepubliceerde verslagen over andere klinische ervaringen met het hulpmiddel in kwestie of met
      een soortgelijk hulpmiddel waarvan de gelijkwaardigheid met het hulpmiddel in kwestie kan worden aangetoond.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel1
  - number: '1.2'
    text: |-
      Medische hulpmiddelen die volgens methodes van continue fabrikage of van seriefabrikage worden vervaardigd en
      die een aanpassing vereisen om te voldoen aan de specifieke behoeften van de arts of van een andere professionele
      gebruiker worden niet beschouwd als een naar maat gemaakt medisch hulpmiddel.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel1
  - number: '1.3'
    text: |-
      Onder een fabrikant wordt niet begrepen een persoon die, niet zijnde een fabrikant van een medisch hulpmiddel
      in de zin van het eerste lid, onder d, onderdeel 1°, medische hulpmiddelen die reeds in de handel zijn gebracht,
      assembleert voor een individuele patiënt, of aanpast overeenkomstig hun bestemming.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel1
  - number: '1.4'
    text: |-
      Een wijziging van bijlage I, II, III, IV, V, VI, VII, VIII, IX of X van de richtlijn, dan wel van de bijlage van
      richtlijn 2003/32/EG gaat voor de toepassing van dit besluit gelden met ingang van de dag waarop aan de betrokken
      wijziging uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel1
  - number: '2'
    text: |-
      Dit besluit is mede van toepassing op het hulpstuk en op de software die voor de goede werking van het medisch
      hulpmiddel benodigd zijn.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel2
  - number: '3.1'
    text: 'Dit besluit is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel3
  - number: 3.1.a
    text: |-
      in-vitro diagnostica waarop het [Besluit in-vitro diagnostica][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0012610
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012610
  - number: 3.1.b
    text: |-
      actieve implantaten in de zin van het [Besluit actieve implantaten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006060
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006060
  - number: 3.1.c
    text: |-
      medische hulpmiddelen bestemd voor het toedienen van een geneesmiddel als bedoeld in
      [artikel 1, eerste lid, onder b, van de Geneesmiddelenwet][ref1], voor zover zij op zodanige wijze in de handel
      worden gebracht dat:


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel1
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '1'
  - number: 3.1.c.1°
    text: het medisch hulpmiddel en het geneesmiddel een ondeelbaar geheel vormen,
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel3
  - number: 3.1.c.2°
    text: zij uitsluitend zijn bestemd om te worden gebruikt in de gegeven combinatie, en
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel3
  - number: 3.1.c.3°
    text: niet opnieuw kunnen worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel3
  - number: 3.1.d
    text: |-
      menselijk bloed, producten van menselijk bloed, bloedplasma of bloedcellen van menselijke oorsprong of op medische
      hulpmiddelen die op het moment waarop ze in de handel worden gebracht dergelijke bloedproducten, dergelijk
      bloedplasma of dergelijke bloedcellen bevatten, met uitzondering van derivaten van menselijk bloed;
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel3
  - number: 3.1.e
    text: |-
      transplantaten, weefsels of cellen van menselijke oorsprong, of produkten die weefsels of cellen van menselijke
      oorsprong bevatten of daarvan zijn afgeleid;
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel3
  - number: 3.1.f
    text: |-
      transplantaten, weefsels of cellen van dierlijke oorsprong, tenzij het desbetreffende medisch hulpmiddel
      is vervaardigd met gebruikmaking van dierlijk weefsel dat niet-levensvatbaar is gemaakt, dan wel van niet-
      levensvatbare produkten die zijn afgeleid van dierlijk weefsel;
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel3
  - number: 3.1.g
    text: |-
      persoonlijke beschermingsmiddelen in de zin van het [Warenwetbesluit Persoonlijke beschermingsmiddelen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005570
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005570
  - number: '3.2'
    text: |-
      De in bijlage I van de richtlijn opgenomen essentiële eisen, voor zover het betreft aspecten verband houdend met
      veiligheid en prestaties, zijn evenwel op de in onderdeel c van het eerste lid bedoelde medische hulpmiddelen van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel3
  - number: '4.1'
    text: |-
      Het is de fabrikant verboden een medisch hulpmiddel voorhanden te hebben of af te leveren indien niet is voldaan
      aan de [artikelen 5 tot en met 9c][ref1], [12][ref2] en [13][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007307#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007307#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0007307#Artikel13
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007307
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0007307
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0007307
        artikel: '13'
  - number: '4.2'
    text: |-
      Het is de persoon, rechtspersoon daaronder begrepen, niet zijnde de fabrikant, die medische hulpmiddelen
      samenvoegt om deze in de vorm van een systeem of van een behandelingspakket af te leveren, verboden een systeem
      of behandelingspakket voorhanden te hebben of af te leveren indien met betrekking tot het systeem of het
      behandelingspakket niet is voldaan aan [artikel 10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007307#Artikel10
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007307
        artikel: '10'
  - number: '4.3'
    text: |-
      Het is een ander dan de in het tweede lid bedoelde persoon, niet zijnde de fabrikant, verboden een medisch
      hulpmiddel voorhanden te hebben of af te leveren indien met betrekking tot het medisch hulpmiddel niet is voldaan
      aan de [artikelen 15][ref1] en [16][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007307#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0007307#Artikel16
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007307
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0007307
        artikel: '16'
  - number: '4.4'
    text: |-
      Het is verboden een medisch hulpmiddel toe te passen indien het medisch hulpmiddel niet met inachtneming van de
      [artikelen 5 tot en met 10][ref1], [12][ref2], [13][ref3], [15][ref4] en [16][ref5] is afgeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0007307#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007307#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0007307#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0007307#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0007307#Artikel16
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007307
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0007307
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0007307
        artikel: '13'
      - id: ref4
        bwb_id: BWBR0007307
        artikel: '15'
      - id: ref5
        bwb_id: BWBR0007307
        artikel: '16'
  - number: '5.1'
    text: |-
      De in Nederland gevestigde fabrikant die onder eigen naam en in overeenstemming met de in
      [artikel 9, vijfde lid][ref1], bedoelde conformiteitsbeoordelingsprocedure een medisch hulpmiddel aflevert, deelt
      alvorens de aflevering plaatsvindt, aan de daartoe door Onze Minister aangewezen overheidsinstantie mede:


      [ref1]: https://wetten.overheid.nl/BWBR0007307#Artikel9
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007307
        artikel: '9'
  - number: 5.1.a
    text: |-
      zijn woonplaats in de zin van [artikel 10, Boek 1 van het Burgerlijk Wetboek][ref1]; alsmede


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel10
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '10'
  - number: 5.1.b
    text: een beschrijving van het desbetreffende medisch hulpmiddel; en, zo spoedig mogelijk,
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel5
  - number: 5.1.c
    text: wijzigingen van deze gegevens, alsook de beëindiging van de activiteit.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel5
  - number: '5.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de in [artikel 10][ref1] bedoelde persoon en de in
      [artikel 12][ref2] bedoelde fabrikant.


      [ref1]: https://wetten.overheid.nl/BWBR0007307#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0007307#Artikel12
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007307
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0007307
        artikel: '12'
  - number: '5.3'
    text: De buiten een lidstaat gevestigde fabrikant wijst een gemachtigde aan.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel5
  - number: '6.1'
    text: |-
      Een medisch hulpmiddel voldoet aan de in bijlage I van de richtlijn opgenomen eisen, met inachtneming van de
      bestemming van het betrokken medisch hulpmiddel.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel6
  - number: '6.2'
    text: |-
      De in bijlage I, punt 13, van de richtlijn bedoelde informatie die aan de gebruiker en de patiënt moeten worden
      verstrekt, zijn opgesteld in de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel6
  - number: '6.3'
    text: |-
      Onze Minister wijst ter uitvoering van artikel 5 van de richtlijn normen dan wel in voorkomend geval monografieën
      van de Europese Farmacopee aan, bij het voldoen waaraan medische hulpmiddelen worden vermoed te voldoen aan de in
      het eerste lid bedoelde eisen.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel6
  - number: '6.4'
    text: De referenties van de aangewezen normen en monografieën worden in de *Staatscourant* bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel6
  - number: '7.1'
    text: Een medisch hulpmiddel is voorzien van de CE-markering.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel7
  - number: '7.2'
    text: |-
      Een medisch hulpmiddel is slechts voorzien van de CE-markering indien het aan de in bijlage I van de richtlijn
      opgenomen eisen voldoet.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel7
  - number: '7.3'
    text: De CE-markering wordt niet aangebracht op een product dat niet een medisch hulpmiddel is.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel7
  - number: '7.4'
    text: |-
      In afwijking van het eerste lid zijn naar maat gemaakte medische hulpmiddelen en medische hulpmiddelen bestemd voor
      klinisch onderzoek niet voorzien van de CE-markering.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel7
  - number: '7.5'
    text: |-
      De CE-markering is vergezeld van het identificatienummer van de aangemelde instantie die de in bijlage II, IV, V en
      VI van de richtlijn bedoelde procedures heeft uitgevoerd of van de aangemelde instantie die de door een andere lid-
      staat vastgestelde procedures heeft uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel7
  - number: '7.6'
    text: |-
      De CE-markering en het in het vijfde lid bedoelde identificatienummer zijn zichtbaar leesbaar en onuitwisbaar
      aangebracht op het medisch hulpmiddel of op de verpakking die de steriliteit waarborgt, alsmede op de
      gebruiksaanwijzing.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel7
  - number: '7.7'
    text: |-
      In geval het om technische redenen niet mogelijk is om de CE-markering op het medisch hulpmiddel of op de
      verpakking die de steriliteit waarborgt, aan te brengen, is de markering aangebracht op de verpakking waarin het
      medisch hulpmiddel in de handel wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel7
  - number: '7.8'
    text: |-
      Een medisch hulpmiddel is niet voorzien van een markering of opschrift waardoor verwarring zou kunnen ontstaan over
      de betekenis of de grafische vormgeving van de CE-markering; indien op het medisch hulpmiddel, de verpakking of op
      de gebruiksaanwijzing andere markeringen zijn aangebracht verminderen zij niet de zichtbaarheid en leesbaarheid van
      de CE-markering.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel7
  - number: '8.1'
    text: |-
      Medische hulpmiddelen worden door de fabrikant ingedeeld in klasse I, IIa, IIb of III volgens bijlage IX van de
      richtlijn.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel8
  - number: '8.2'
    text: |-
      In afwijking van het eerste lid worden borstimplantaten en heup-, knie- en schouderprothesen door de fabrikant
      ingedeeld in klasse III.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel8
  - number: '8.3'
    text: |-
      Tegen een ingevolge de classificatieregels genomen beslissing van de aangemelde instantie kan de fabrikant beroep
      instellen bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel8
  - number: '9.1'
    text: |-
      Dit artikel is niet van toepassing op een naar maat gemaakt medisch hulpmiddel of een medisch hulpmiddel bestemd
      voor klinisch onderzoek.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9
  - number: '9.2'
    text: |-
      Voor de beoordeling of een in klasse III ingedeeld medisch hulpmiddel aan de in [artikel 6, eerste lid][ref1],
      bedoelde eisen voldoet, volgt de fabrikant, ten einde de CE-markering aan te brengen, één van de volgende
      procedures:


      [ref1]: https://wetten.overheid.nl/BWBR0007307#Artikel6
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007307
        artikel: '6'
  - number: 9.2.a
    text: de in bijlage II van de richtlijn omschreven procedure inzake de EG-verklaring van overeenstemming, of
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9
  - number: 9.2.b
    text: 'de in bijlage III van de richtlijn omschreven procedure inzake het EG-typeonderzoek in combinatie met:'
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9
  - number: 9.2.b.1°
    text: hetzij de in bijlage IV van de richtlijn omschreven procedure inzake de EG-keuring;
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9
  - number: 9.2.b.2°
    text: |-
      hetzij de in bijlage V van de richtlijn omschreven procedure van de EG-verklaring inzake produktie-
      kwaliteitsborging.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9
  - number: '9.3'
    text: |-
      Voor de beoordeling of een in klasse II*b* ingedeeld medisch hulpmiddel aan de in [artikel 6, eerste lid][ref1],
      bedoelde eisen voldoet volgt de fabrikant, ten einde de CE-markering aan te brengen, één van de volgende
      procedures:


      [ref1]: https://wetten.overheid.nl/BWBR0007307#Artikel6
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007307
        artikel: '6'
  - number: 9.3.a
    text: |-
      de in bijlage II van de richtlijn omschreven procedure inzake de EG-verklaring van overeenstemming met uitzondering
      van de onder punt 4 van dat onderdeel omschreven procedure, of
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9
  - number: 9.3.b
    text: de in bijlage III van de richtlijn omschreven procedure inzake het EG-typeonderzoek in combinatie met
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9
  - number: 9.3.b.1°
    text: hetzij de in bijlage IV van de richtlijn omschreven procedure inzake de EG-keuring;
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9
  - number: 9.3.b.2°
    text: |-
      hetzij de in bijlage V van de richtlijn omschreven procedure van de EG-verklaring inzake produktie-
      kwaliteitsborging;
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9
  - number: 9.3.b.3°
    text: hetzij de in bijlage VI van de richtlijn omschreven procedure inzake produkt-kwaliteitsborging.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9
  - number: '9.4'
    text: |-
      Voor de beoordeling of een in klasse II*a* ingedeeld medisch hulpmiddel aan de in [artikel 6, eerste lid][ref1],
      bedoelde eisen voldoet volgt de fabrikant, ten einde de CE-markering aan te brengen, één van de volgende
      procedures:


      [ref1]: https://wetten.overheid.nl/BWBR0007307#Artikel6
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007307
        artikel: '6'
  - number: 9.4.a
    text: |-
      de in bijlage II van de richtlijn omschreven procedure inzake de EG-verklaring van overeenstemming met uitzondering
      van de onder punt 4 van dat onderdeel omschreven procedure, of:
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9
  - number: 9.4.b
    text: |-
      de in bijlage VII van de richtlijn omschreven procedure inzake de EG-verklaring van overeenstemming in combinatie
      met:
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9
  - number: 9.4.b.1°
    text: hetzij de in bijlage IV van de richtlijn omschreven procedure inzake de EG-keuring;
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9
  - number: 9.4.b.2°
    text: |-
      hetzij de in bijlage V van de richtlijn omschreven procedure van de EG-verklaring inzake produktie-
      kwaliteitsborging;
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9
  - number: 9.4.b.3°
    text: hetzij de in bijlage VI van de richtlijn omschreven procedure inzake produkt-kwaliteitsborging.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9
  - number: '9.5'
    text: |-
      Voor de beoordeling of een in klasse I ingedeeld medisch hulpmiddel aan de in [artikel 6, eerste lid][ref1],
      bedoelde eisen voldoet, stelt de fabrikant, ten einde de CE-markering aan te brengen, vóór het in de handel brengen
      van het medisch hulpmiddel de EG-verklaring van overeenstemming op, bedoeld in bijlage VII van de richtlijn, en
      neemt daarbij de in die bijlage neergelegde voorschriften in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0007307#Artikel6
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007307
        artikel: '6'
  - number: '9.6'
    text: |-
      In geval een conformiteitsbeoordelingsprocedure de tussenkomst van een aangemelde instantie vooronderstelt, wendt
      de fabrikant zich tot een aangemelde instantie van zijn keuze in het kader van de taken waarvoor die instantie
      is aangemeld.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9
  - number: '9.7'
    text: |-
      Tijdens de conformiteitsbeoordelingsprocedure houdt de fabrikant of de aangemelde instantie rekening met de
      beschikbare resultaten van beoordelings- en keuringswerkzaamheden die eventueel overeenkomstig dit besluit in
      een tussenstadium van de fabricage hebben plaatsgevonden. Tevens wordt rekening gehouden met de resultaten van
      beoordelings- en keuringswerkzaamheden die hebben plaatsgevonden overeenkomstig de bij of krachtens de [wet][ref1]
      gestelde voorschriften zoals die golden op 31 december 1994.


      [ref1]: https://wetten.overheid.nl/BWBR0002697
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002697
  - number: '9.8'
    text: |-
      De fabrikant is verplicht om de aangemelde instantie iedere inlichting te verstrekken die voor de vervulling
      van haar taak met betrekking tot dit besluit redelijkerwijs nodig is. Voor in klasse III ingedeelde medische
      hulpmiddelen als bedoeld in [artikel 9a, eerste lid][ref1], verstrekt de fabrikant aan de aangemelde instantie
      alle relevante informatie die deze nodig heeft om een beoordeling van zijn lopende strategie voor risicoanalyse
      en risicobeheer uit te voeren. Eventuele nieuwe informatie over het risico van overdraagbare spongiforme
      encefalopathieën, die door de fabrikant wordt verzameld en die voor de door hem vervaardigde hulpmiddelen relevant
      is, wordt ter informatie naar de aangemelde instantie gezonden. Wijzigingen met betrekking tot de procedures voor
      het kiezen, verzamelen, behandelen en inactiveren of elimineren die van invloed kunnen zijn op het resultaat van
      het risicobeheer door de fabrikant, worden vóór de tenuitvoerlegging ervan ter aanvullende goedkeuring aan de
      aangemelde instantie voorgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007307#Artikel9a
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007307
        artikel: 9a
  - number: '9.9'
    text: |-
      Een krachtens bijlage II of III van de richtlijn genomen beslissing vervalt na een door de aangemelde instantie te
      bepalen termijn van maximaal vijf jaar. Op aanvraag van de fabrikant kan de aangemelde instantie deze periode met
      termijnen van telkenmale vijf jaar verlengen.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9
  - number: '9.10'
    text: |-
      Met de in het tweede lid tot en met het vijfde lid bedoelde procedures worden gelijkgesteld de door de daartoe
      bevoegde autoriteiten van de andere lid-staten in het kader van de richtlijn vastgestelde procedures.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9
  - number: 9a.1
    text: |-
      Alvorens een aanvraag voor een conformiteitsbeoordeling overeenkomstig [artikel 9, tweede lid][ref1],
      in te dienen, voert de fabrikant van een medisch hulpmiddel waarop dit besluit op grond van
      [artikel 3, eerste lid, onder f][ref2], van toepassing is, voor zover dat hulpmiddel is vervaardigd met
      gebruikmaking van dierlijk weefsel van runderen, schapen, geiten, herten, elanden, nertsen of katten, dan wel met
      gebruikmaking van afgeleide producten van zodanig weefsel, de in de bijlage, onderdeel 1, van richtlijn 2003/32/EG
      vastgestelde procedure inzake risicoanalyse en risicobeheer uit.


      [ref1]: https://wetten.overheid.nl/BWBR0007307#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0007307#Artikel3
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0007307
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0007307
        artikel: '3'
  - number: 9a.2
    text: |-
      Het eerste lid is niet van toepassing op medische hulpmiddelen die niet bestemd zijn om met het menselijk lichaam
      in aanraking te komen of die bestemd zijn uitsluitend met de gave huid in aanraking te komen.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9a
  - number: 9b.1
    text: |-
      In het kader van de conformiteitsprocedures, bedoeld in [artikel 9, tweede lid][ref1], met betrekking tot medische
      hulpmiddelen als bedoeld in artikel 9a, eerste lid, gaat de betrokken aangemelde instantie na of de medische
      hulpmiddelen overeenstemmen met de essentiële eisen, neergelegd in bijlage I van de richtlijn, en de in de bijlage,
      onderdeel 1, van richtlijn 2003/32/EG neergelegde specificaties.


      [ref1]: https://wetten.overheid.nl/BWBR0007307#Artikel9
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0007307
        artikel: '9'
  - number: 9b.2
    text: |-
      De aangemelde instantie beoordeelt de door de fabrikant gevolgde strategie voor risicoanalyse en risicobeheer, en
      met name:
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9b
  - number: 9b.2.a
    text: de door de fabrikant verstrekte informatie;
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9b
  - number: 9b.2.b
    text: de rechtvaardiging voor het gebruik van dierlijk weefsel of daarvan afgeleide producten;
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9b
  - number: 9b.2.c
    text: de resultaten van studies betreffende eliminatie of inactivatie of van literatuuronderzoek;
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9b
  - number: 9b.2.d
    text: het toezicht door de fabrikant op de herkomst van de grondstoffen, op de eindproducten en op de onderaannemers;
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9b
  - number: 9b.2.e
    text: de noodzaak de herkomst te controleren, met inbegrip van leveringen door derden.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9b
  - number: 9b.3
    text: |-
      De aangemelde instantie houdt bij de beoordeling van de risicoanalyse en het risicobeheer in het kader van de
      conformiteitsbeoordelingsprocedure voor het uitgangsmateriaal rekening met een TSE-goedkeuringscertificaat van het
      Europees Directoraat voor de geneesmiddelenkwaliteit, hierna «TSE-certificaat» genoemd, zo dit beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9b
  - number: 9b.4
    text: |-
      Behalve voor medische hulpmiddelen die zijn vervaardigd met gebruikmaking van uitgangsmateriaal waarvoor het in
      het derde lid bedoelde TSE-goedkeuringscertificaat is afgegeven, vraagt de aangemelde instantie, door tussenkomst
      van Onze Minister, het advies van de bevoegde autoriteiten van de andere lidstaten over hun beoordeling van en hun
      conclusies inzake de risicoanalyse en het risicobeheer door de fabrikant van de weefsels en afgeleide producten die
      bedoeld zijn om in het medische hulpmiddel te worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9b
  - number: 9b.5
    text: |-
      Alvorens een EG-onderzoekcertificaat voor het ontwerp of een verklaring van EG-typeonderzoek af te geven, houdt
      de aangemelde instantie terdege rekening met de opmerkingen die zij binnen twaalf weken nadat de mening van de
      nationale autoriteiten is gevraagd heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9b
  - number: 9c
    text: |-
      Voor medische hulpmiddelen als bedoeld in [artikel 9a, eerste lid][ref1], ten aanzien waarvan vóór 1 april 2004 een
      EG-onderzoekcertificaat voor het ontwerp of een verklaring van EG-typeonderzoek is afgegeven, is een aanvullend EG-
      onderzoekcertificaat voor het ontwerp of een aanvullende verklaring van EG-typeonderzoek verkregen waaruit blijkt
      dat aan de specificaties, opgenomen in de bijlage, onderdeel 1, van richtlijn 2003/32/EG, is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007307#Artikel9a
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0007307
        artikel: 9a
  - number: 9d
    text: |-
      Voor de toepassing van [artikel 3, eerste lid, onder f][ref1], [artikel 9a, eerste lid][ref2], [artikel 9b][ref3],
      [artikel 9c][ref4] wordt verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0007307#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007307#Artikel9a
      [ref3]: https://wetten.overheid.nl/BWBR0007307#Artikel9b
      [ref4]: https://wetten.overheid.nl/BWBR0007307#Artikel9c
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9d
    references:
      - id: ref1
        bwb_id: BWBR0007307
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0007307
        artikel: 9a
      - id: ref3
        bwb_id: BWBR0007307
        artikel: 9b
      - id: ref4
        bwb_id: BWBR0007307
        artikel: 9c
  - number: 9d.a
    text: |-
      *cel:* de kleinste structurele eenheid van een organisme die zelfstandig kan bestaan en in een geschikte omgeving
      zichzelf kan vervangen;
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9d
  - number: 9d.b
    text: '*weefsel:* een complex van cellen of extracellulaire bestanddelen:'
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9d
  - number: 9d.c
    text: |-
      *afgeleid product:* door middel van een productieproces uit dierlijk weefsel verkregen materiaal, zoals collageen,
      gelatine, monoklonale antilichamen;
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9d
  - number: 9d.d
    text: '*niet-levensvatbaar:* zonder mogelijkheid tot metabolisme of vermenigvuldiging;'
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9d
  - number: 9d.e
    text: |-
      *overdraagbare agentia:* niet-geclassificeerde pathogene entiteiten, prionen en entiteiten, zoals de agentia van
      boviene spongiforme encefalopathieën en van scrapie;
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9d
  - number: 9d.f
    text: |-
      *vermindering, eliminatie of verwijdering:* een proces waarbij het aantal overdraagbare agentia wordt verminderd,
      geëlimineerd of verwijderd teneinde besmetting of een pathogene reactie te voorkomen;
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9d
  - number: '9d.g:'
    text: |-
      *inactivatie:* een proces waarbij het vermogen van overdraagbare agentia om besmetting of een pathogene reactie te
      veroorzaken, wordt verminderd;
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9d
  - number: 9d.h
    text: '*land van herkomst:* het land waar het dier is geboren, opgefokt of geslacht;'
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9d
  - number: 9d.i
    text: |-
      *uitgangsmateriaal:* de grondstof of elk ander product van dierlijke herkomst waaruit of met behulp waarvan de in
      [artikel 9a, eerste lid][ref1], bedoelde hulpmiddelen worden geproduceerd.


      [ref1]: https://wetten.overheid.nl/BWBR0007307#Artikel9a
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel9d
    references:
      - id: ref1
        bwb_id: BWBR0007307
        artikel: 9a
  - number: '10.1'
    text: |-
      De persoon, rechtspersoon daaronder begrepen, die medische hulpmiddelen, voorzien van de CE-markering,
      overeenkomstig hun bestemming en binnen de door de fabrikanten opgegeven gebruikslimieten samenvoegt, met de
      bedoeling ze af te leveren in de vorm van een systeem of van een behandelingspakket, stelt een verklaring op waarin
      hij verklaart:
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel10
  - number: 10.1.a
    text: |-
      dat hij de wederzijdse compatibiliteit van de medische hulpmiddelen heeft gecontroleerd in overeenstemming met de
      instructies van de fabrikanten, en dat hij de samenvoeging in overeenstemming met die instructies heeft uitgevoerd;
      en
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel10
  - number: 10.1.b
    text: |-
      dat hij het systeem of het behandelingspakket heeft verpakt en heeft voorzien van voor de gebruikers relevante
      informatie, met inbegrip van de relevante instructies van de fabrikanten; en
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel10
  - number: 10.1.c
    text: dat al deze werkzaamheden onderworpen zijn aan passende methoden van interne beheersing en controle.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel10
  - number: '10.2'
    text: |-
      Ingeval medische hulpmiddelen worden samengevoegd ten aanzien waarvan de in het eerste lid bedoelde voorwaarden
      niet zijn vervuld, wordt het systeem of het behandelingspakket behandeld als een op zichzelf staand medisch
      hulpmiddel en wordt als zodanig onderworpen aan de desbetreffende procedure van [artikel 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007307#Artikel9
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007307
        artikel: '9'
  - number: '10.3'
    text: 'De persoon, rechtspersoon daaronder begrepen die, met het oog op het afleveren daarvan:'
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel10
  - number: 10.3.a
    text: systemen,
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel10
  - number: 10.3.b
    text: behandelingspakketten, of
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel10
  - number: 10.3.c
    text: |-
      andere van een CE-markering voorziene medische hulpmiddelen, die overeenkomstig de instructie van de fabrikant vóór
      gebruik moeten worden gesteriliseerd, steriliseert, volgt één van de in bijlage II of V van de richtlijn beschreven
      procedures voorzover deze betrekking hebben op het verkrijgen van de steriliteit. De persoon stelt een verklaring
      op dat de sterilisatie overeenkomstig de instructies van de fabrikant is uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel10
  - number: '10.4'
    text: De in het eerste en derde lid bedoelde middelen zijn niet van een extra CE-markering voorzien.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel10
  - number: '10.5'
    text: |-
      De systemen en behandelingspakketten zijn vergezeld van de in bijlage I van de richtlijn bedoelde informatie.
      Deze informatie bevat, indien noodzakelijk, de door de fabrikanten van de samen te voegen hulpmiddelen verstrekte
      gegevens.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel10
  - number: '10.6'
    text: |-
      De persoon, rechtspersoon daaronder begrepen, bewaart de in het eerste en derde lid bedoelde verklaring gedurende
      een periode van vijf jaar, te rekenen vanaf de datum van samenvoeging of sterilisatie.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel10
  - number: '11.1'
    text: |-
      Ter uitvoering van artikel 16 van de richtlijn kan Onze Minister één of meer instanties aanwijzen die de in
      [artikel 9][ref1] bedoelde procedures uitvoeren, doch slechts indien die instanties voldoen aan de in bijlage XI
      van de richtlijn opgenomen criteria. In zodanige aanwijzing worden in elk geval vermeld de specifieke taken van
      de instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0007307#Artikel9
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007307
        artikel: '9'
  - number: '11.2'
    text: |-
      Onze Minister wijst ter uitvoering van de richtlijn normen aan, bij het voldoen waaraan een instantie wordt vermoed
      te voldoen aan de in het eerste lid bedoelde criteria.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel11
  - number: '11.3'
    text: |-
      Wanneer de instantie constateert dat de fabrikant niet heeft voldaan of niet langer voldoet aan de van
      toepassing zijnde eisen van dit besluit of wanneer geen verklaring had mogen worden afgegeven, moet zij, rekening
      houdend met het evenredigheidsbeginsel, de afgegeven verklaring schorsen, intrekken of beperken, tenzij de
      fabrikant er door invoering van een geschikte corrigerende maatregel voor zorgt dat aan bovengenoemde eisen
      wordt voldaan. In geval van schorsing, intrekking of beperking van de verklaring of indien ingrijpen van de in
      [artikel 5, eerste lid][ref1], bedoelde overheidsinstantie nodig zou zijn, stelt zij die overheidsinstantie daarvan
      in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0007307#Artikel5
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007307
        artikel: '5'
  - number: '11.4'
    text: |-
      De instantie stelt desgevraagd de in [artikel 5, eerste lid][ref1] bedoelde overheidsinstantie en de andere
      aangemelde instanties in kennis van de afgegeven of geweigerde certificaten en stelt desgevraagd alle relevante
      informatie ter beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0007307#Artikel5
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007307
        artikel: '5'
  - number: '11.5'
    text: Ter uitvoering van artikel 16 van de richtlijn kan Onze Minister aan de aanwijzing voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel11
  - number: '11.6'
    text: |-
      Onze Minister trekt de aanwijzing in als de instantie niet voldoet aan het in het eerste lid, derde en vierde lid,
      of aan de op grond van het vijfde lid door de minister gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel11
  - number: '12.1'
    text: |-
      De fabrikant van een naar maat gemaakt medisch hulpmiddel stelt vóórdat hij het middel aflevert een verklaring op,
      die de in bijlage VIII, punt 2.1, bedoelde gegevens bevat, en volgt de in dat onderdeel bedoelde procedure.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel12
  - number: '12.2'
    text: |-
      Een naar maat gemaakt medisch hulpmiddel, ingedeeld in klasse III, IIb of IIa, moet zijn vergezeld van de in
      het eerste lid bedoelde verklaring, die aan de door middel van een naam, acroniem of nummercode geïdentificeerde
      patiënt beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel12
  - number: '12.3'
    text: |-
      In afwijking van [artikel 6, eerste lid][ref1], behoeft een naar maat gemaakt medisch hulpmiddel niet te voldoen
      aan de in bijlage I van de richtlijn opgenomen eisen, mits met betrekking tot de eisen waaraan niet wordt voldaan,
      in de in het eerste lid bedoelde verklaring de reden daarvan uitdrukkelijk is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007307#Artikel6
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007307
        artikel: '6'
  - number: '12.4'
    text: |-
      De fabrikant van een naar maat gemaakt medisch hulpmiddel houdt de in bijlage VIII, punt 3.1, van de richtlijn
      bedoelde gegevens ter beschikking van een daartoe door Onze Minister aangewezen overheidsinstantie.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel12
  - number: '13.1'
    text: |-
      Voor de medische hulpmiddelen die voor klinisch onderzoek zijn bestemd, stelt de fabrikant vóór de aanvang van
      het onderzoek het Staatstoezicht op de Volksgezondheid daarvan in kennis door middel van de verklaring, bedoeld in
      bijlage VIII van de richtlijn, en volgt hij de in de bijlage VIII van de richtlijn bedoelde procedure.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel13
  - number: '13.2'
    text: |-
      In afwijking van [artikel 6, eerste lid][ref1], behoeft een medisch hulpmiddel, bestemd voor klinisch onderzoek op
      het punt waarop het onderzoek is gericht, niet te voldoen aan de in bijlage I van de richtlijn opgenomen eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0007307#Artikel6
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007307
        artikel: '6'
  - number: '13.3'
    text: 'De fabrikant levert het medische hulpmiddel bestemd voor klinisch onderzoek slechts af indien:'
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel13
  - number: 13.3.a
    text: |-
      een op grond van [artikel 16 van de Wet medisch-wetenschappelijk onderzoek met mensen][ref1] erkende commissie een
      positief advies omtrent het onderzoeksprogramma, met inbegrip van het klinisch onderzoeksplan, heeft uitgebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel16
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '16'
  - number: 13.3.b
    text: |-
      hij vóór het tijdstip waarop het klinisch onderzoek aanvangt een verzekering heeft afgesloten die zijn
      aansprakelijkheid dekt voor door het klinisch onderzoek veroorzaakte schade.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel13
  - number: '13.4'
    text: Het klinisch onderzoek wordt uitgevoerd volgens bijlage X van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel13
  - number: '13.5'
    text: |-
      De fabrikant brengt het Staatstoezicht op de volksgezondheid op de hoogte van de beëindiging van het klinisch
      onderzoek, met een opgave van redenen in geval van een vroegtijdige beëindiging.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel13
  - number: '13.6'
    text: 'De fabrikant houdt de volgende gegevens ter beschikking van het Staatstoezicht op de volksgezondheid:'
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel13
  - number: 13.6.a
    text: de in de bijlage VIII, punt 3.2, van de richtlijn bedoelde gegevens;
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel13
  - number: 13.6.b
    text: het in punt 2.3.7 van bijlage X van de richtlijn bedoelde verslag inzake het klinisch onderzoek.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel13
  - number: '13.7'
    text: |-
      [Artikel 7, vierde lid][ref1], en het eerste en vierde lid, alsmede het zesde lid, onder a van dit artikel zijn
      niet van toepassing indien bij het klinisch onderzoek medische hulpmiddelen worden toegepast die overeenkomstig
      [artikel 7][ref2] zijn voorzien van de CE-markering, mits dit onderzoek dezelfde bestemming van de medische
      hulpmiddelen tot doel heeft als met de desbetreffende conformiteitsbeoordelingsprocedures is beoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0007307#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007307#Artikel7
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007307
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007307
        artikel: '7'
  - number: '14'
    text: |-
      De [artikelen 6][ref1] en [7][ref2] zijn niet van toepassing op medische hulpmiddelen die op jaarbeurzen,
      tentoonstellingen, demonstraties en soortgelijke gelegenheden worden gepresenteerd, mits daarbij op een zichtbaar
      bord duidelijk is aangegeven dat het medisch hulpmiddel niet aan de in bijlage I van de richtlijn opgenomen eisen
      voldoet en niet kan worden toegepast voordat het door de fabrikant met die eisen in overeenstemming is gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007307#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007307#Artikel7
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007307
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0007307
        artikel: '7'
  - number: '15'
    text: |-
      Een medisch hulpmiddel wordt door de in [artikel 4, derde lid][ref1], bedoelde persoon niet afgeleverd:


      [ref1]: https://wetten.overheid.nl/BWBR0007307#Artikel4
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0007307
        artikel: '4'
  - number: 15.a
    text: |-
      indien dat middel niet aan de in de [artikelen 6, eerste en tweede lid][ref1], en [7, eerste lid][ref2], bedoelde
      eisen voldoet;


      [ref1]: https://wetten.overheid.nl/BWBR0007307#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007307#Artikel7
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0007307
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0007307
        artikel: '7'
  - number: 15.b
    text: nadat de in bijlage I, punt 13.3, onder e, van de richtlijn bedoelde uiterste gebruiksdatum is verstreken.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel15
  - number: '16'
    text: |-
      De in [artikel 15][ref1] bedoelde persoon draagt zorg dat de medische hulpmiddelen die hij voorhanden heeft,
      op deugdelijke, zindelijke, ordelijke wijze en met inachtneming van de in bijlage I, punt 13.3, onder i, van de
      richtlijn bedoelde voorwaarden worden bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0007307#Artikel15
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007307
        artikel: '15'
  - number: 16a
    text: |-
      De toepassing van een rimpelvuller die levenslang in het lichaam aanwezig blijft, is verboden voor andere dan
      reconstructieve doeleinden.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel16a
  - number: '17'
    text: 'De volgende besluiten worden ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel17
  - number: 17.a
    text: het Besluit rubbercondomen;
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel17
  - number: 17.b
    text: het Besluit handel gesteriliseerde medische hulpmiddelen;
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel17
  - number: 17.c
    text: het Besluit elektromedische apparaten;
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel17
  - number: 17.d
    text: de EEG-IJkregeling koortsthermometers.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel17
  - number: '25.1'
    text: |-
      In afwijking van [artikel 4, eerste lid][ref1], is het de fabrikant tot 14 juni 1998 toegestaan om medische
      hulpmiddelen voorhanden te hebben of af te leveren indien met betrekking tot die middelen is voldaan aan de bij of
      krachtens de [wet][ref2] gestelde voorschriften zoals die golden op 31 december 1994.


      [ref1]: https://wetten.overheid.nl/BWBR0007307#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002697
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0007307
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0002697
  - number: '25.2'
    text: |-
      In afwijking van [artikel 4, tweede lid][ref1], is het de in dat lid bedoelde persoon toegestaan om een systeem
      of behandelingspakket voorhanden te hebben of af te leveren dat bestaat uit de in het eerste lid bedoelde medische
      hulpmiddelen indien met betrekking tot die middelen is voldaan aan de bij of krachtens de [wet][ref2] gestelde
      voorschriften zoals die golden op 31 december 1994.


      [ref1]: https://wetten.overheid.nl/BWBR0007307#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002697
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0007307
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0002697
  - number: '25.3'
    text: |-
      In afwijking van [artikel 4, derde lid][ref1], is het de in dat lid bedoelde persoon toegestaan om de in het eerste
      lid bedoelde medische hulpmiddelen uiterlijk tot 30 juni 2001 voorhanden te hebben of af te leveren indien met
      betrekking tot die middelen is voldaan aan de bij of krachtens de [wet][ref2] gestelde voorschriften zoals die
      golden op 31 december 1994.


      [ref1]: https://wetten.overheid.nl/BWBR0007307#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002697
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0007307
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0002697
  - number: '25.4'
    text: |-
      In afwijking van [artikel 4, vierde lid][ref1], is het toegestaan om medische hulpmiddelen toe te passen die vóór 1
      januari 1995 zijn afgeleverd of die overeenkomstig het eerste, tweede, of derde lid zijn afgeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0007307#Artikel4
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0007307
        artikel: '4'
  - number: '25.5'
    text: |-
      In afwijking van [artikel 4][ref1] is het voorhanden hebben, afleveren en voor het eerst toepassen van
      koortsthermometers met kwikvulling en maximuminrichting voor het meten van de lichaamstemperatuur van mensen
      en dieren tot en met 30 juni 2004 toegestaan indien deze zijn vervaardigd volgens een model dat overeenkomstig
      [artikel 3 van het Algemeen EEG-IJkbesluit][ref2] vóór 1 januari 1995 is toegelaten en waarvan de geldigheidsduur
      van de EEG-modelgoedkeuring nog niet is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0007307#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003165#Artikel3
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0007307
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0003165
        artikel: '3'
  - number: '25.6'
    text: |-
      Met betrekking tot medische hulpmiddelen als bedoeld in de voorgaande leden, waarop dit besluit niet wordt
      toegepast en waarop ingevolge één of meer wettelijke regelingen de CE-markering wordt aangebracht, worden op de bij
      die medische hulpmiddelen gevoegde documenten, handleidingen of gebruiksaanwijzingen de in het *Publikatieblad van
      de Europese Gemeenschappen* bekendgemaakte referenties van de aan die wettelijke regelingen ten grondslag liggende
      richtlijnen vermeld.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel25
  - number: '26'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel26
  - number: '27'
    text: 'Dit besluit wordt aangehaald als: Besluit medische hulpmiddelen.'
    url: https://wetten.overheid.nl/BWBR0007307/2016-10-06#Artikel27
