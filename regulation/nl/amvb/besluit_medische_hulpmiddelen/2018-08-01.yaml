      1 Het is de fabrikant verboden een medisch hulpmiddel voorhanden te hebben of af te leveren indien niet is voldaan
      aan de [artikelen 5 tot en met 9c][ref1], [12][ref2] en [13][ref3].

      2 Het is de persoon, rechtspersoon daaronder begrepen, niet zijnde de fabrikant, die medische hulpmiddelen
      samenvoegt om deze in de vorm van een systeem of van een behandelingspakket af te leveren, verboden een systeem
      of behandelingspakket voorhanden te hebben of af te leveren indien met betrekking tot het systeem of het
      behandelingspakket niet is voldaan aan [artikel 10][ref4].

      3 Het is een ander dan de in het tweede lid bedoelde persoon, niet zijnde de fabrikant, verboden een medisch
      hulpmiddel voorhanden te hebben of af te leveren indien met betrekking tot het medisch hulpmiddel niet is voldaan
      aan de [artikelen 15][ref5] en [16][ref6].

      4 Het is verboden een medisch hulpmiddel toe te passen indien het medisch hulpmiddel niet met inachtneming van de
      [artikelen 5 tot en met 10][ref7], [12][ref8], [13][ref9], [15][ref10] en [16][ref11] is afgeleverd.


