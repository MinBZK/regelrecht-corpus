  - number: '11'
    text: |-
      1 Ter uitvoering van artikel 16 van de richtlijn kan Onze Minister één of meer instanties aanwijzen die de in
      [artikel 9][ref1] bedoelde procedures uitvoeren, doch slechts indien die instanties voldoen aan de in bijlage XI
      van de richtlijn opgenomen criteria. In zodanige aanwijzing worden in elk geval vermeld de specifieke taken van
      de instantie.

      2 Onze Minister wijst ter uitvoering van de richtlijn normen aan, bij het voldoen waaraan een instantie wordt
      vermoed te voldoen aan de in het eerste lid bedoelde criteria.

      3 Wanneer de instantie constateert dat de fabrikant niet heeft voldaan of niet langer voldoet aan de van
      toepassing zijnde eisen van dit besluit of wanneer geen verklaring had mogen worden afgegeven, moet zij, rekening
      houdend met het evenredigheidsbeginsel, de afgegeven verklaring schorsen, intrekken of beperken, tenzij de
      fabrikant er door invoering van een geschikte corrigerende maatregel voor zorgt dat aan bovengenoemde eisen
      wordt voldaan. In geval van schorsing, intrekking of beperking van de verklaring of indien ingrijpen van de in
      [artikel 5, eerste lid][ref2], bedoelde overheidsinstantie nodig zou zijn, stelt zij die overheidsinstantie daarvan
      in kennis.

      4 De instantie stelt desgevraagd de in [artikel 5, eerste lid][ref3] bedoelde overheidsinstantie en de andere
      aangemelde instanties in kennis van de afgegeven of geweigerde certificaten en stelt desgevraagd alle relevante
      informatie ter beschikking.

      5 Ter uitvoering van artikel 16 van de richtlijn kan Onze Minister aan de aanwijzing voorschriften verbinden.

      6 Onze Minister trekt de aanwijzing in als de instantie niet voldoet aan het in het eerste lid, derde en vierde
      lid, of aan de op grond van het vijfde lid door de minister gegeven voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0007307#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0007307#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0007307#Artikel5
