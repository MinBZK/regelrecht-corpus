  - number: '17'
    text: |-
      De volgende besluiten worden ingetrokken:

      a. het Besluit rubbercondomen;

      b. het Besluit handel gesteriliseerde medische hulpmiddelen;

      c. het Besluit elektromedische apparaten;

      d. de EEG-IJkregeling koortsthermometers.
    url: https://wetten.overheid.nl/BWBR0007307/2018-08-01#Artikel17
  - number: '25'
    text: |-
      1 In afwijking van [artikel 4, eerste lid][ref1], is het de fabrikant tot 14 juni 1998 toegestaan om medische
      hulpmiddelen voorhanden te hebben of af te leveren indien met betrekking tot die middelen is voldaan aan de bij of
      krachtens de [wet][ref2] gestelde voorschriften zoals die golden op 31 december 1994.

      2 In afwijking van [artikel 4, tweede lid][ref3], is het de in dat lid bedoelde persoon toegestaan om een systeem
      of behandelingspakket voorhanden te hebben of af te leveren dat bestaat uit de in het eerste lid bedoelde medische
      hulpmiddelen indien met betrekking tot die middelen is voldaan aan de bij of krachtens de [wet][ref4] gestelde
      voorschriften zoals die golden op 31 december 1994.

      3 In afwijking van [artikel 4, derde lid][ref5], is het de in dat lid bedoelde persoon toegestaan om de in het
      eerste lid bedoelde medische hulpmiddelen uiterlijk tot 30 juni 2001 voorhanden te hebben of af te leveren indien
      met betrekking tot die middelen is voldaan aan de bij of krachtens de [wet][ref6] gestelde voorschriften zoals die
      golden op 31 december 1994.

      4 In afwijking van [artikel 4, vierde lid][ref7], is het toegestaan om medische hulpmiddelen toe te passen die vóór
      1 januari 1995 zijn afgeleverd of die overeenkomstig het eerste, tweede, of derde lid zijn afgeleverd.

      5 In afwijking van [artikel 4][ref8] is het voorhanden hebben, afleveren en voor het eerst toepassen van
      koortsthermometers met kwikvulling en maximuminrichting voor het meten van de lichaamstemperatuur van mensen
      en dieren tot en met 30 juni 2004 toegestaan indien deze zijn vervaardigd volgens een model dat overeenkomstig
      [artikel 3 van het Algemeen EEG-IJkbesluit][ref9] vóór 1 januari 1995 is toegelaten en waarvan de geldigheidsduur
      van de EEG-modelgoedkeuring nog niet is verstreken.

      6 Met betrekking tot medische hulpmiddelen als bedoeld in de voorgaande leden, waarop dit besluit niet wordt
      toegepast en waarop ingevolge één of meer wettelijke regelingen de CE-markering wordt aangebracht, worden op de bij
      die medische hulpmiddelen gevoegde documenten, handleidingen of gebruiksaanwijzingen de in het *Publikatieblad van
      de Europese Gemeenschappen* bekendgemaakte referenties van de aan die wettelijke regelingen ten grondslag liggende
      richtlijnen vermeld.


