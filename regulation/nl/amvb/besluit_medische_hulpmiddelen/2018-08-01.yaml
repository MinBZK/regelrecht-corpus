    text: |-
      Een medisch hulpmiddel wordt door de in [artikel 4, derde lid][ref1], bedoelde persoon niet afgeleverd:

      a. indien dat middel niet aan de in de [artikelen 6, eerste en tweede lid][ref2], en [7, eerste lid][ref3],
      bedoelde eisen voldoet;

      b. nadat de in bijlage I, punt 13.3, onder e, van de richtlijn bedoelde uiterste gebruiksdatum is verstreken.


