      1 De in Nederland gevestigde fabrikant die onder eigen naam en in overeenstemming met de in
      [artikel 9, vijfde lid][ref1], bedoelde conformiteitsbeoordelingsprocedure een medisch hulpmiddel aflevert, deelt
      alvorens de aflevering plaatsvindt, aan de daartoe door Onze Minister aangewezen overheidsinstantie mede:

      a. zijn woonplaats in de zin van [artikel 10, Boek 1 van het Burgerlijk Wetboek][ref2]; alsmede

      b. een beschrijving van het desbetreffende medisch hulpmiddel; en, zo spoedig mogelijk,

      c. wijzigingen van deze gegevens, alsook de beëindiging van de activiteit.

      2 Het eerste lid is van overeenkomstige toepassing op de in [artikel 10][ref3] bedoelde persoon en de in
      [artikel 12][ref4] bedoelde fabrikant.

      3 De buiten een lidstaat gevestigde fabrikant wijst een gemachtigde aan.


