  - number: 9b
    text: |-
      1 In het kader van de conformiteitsprocedures, bedoeld in [artikel 9, tweede lid][ref1], met betrekking tot
      medische hulpmiddelen als bedoeld in artikel 9a, eerste lid, gaat de betrokken aangemelde instantie na of de
      medische hulpmiddelen overeenstemmen met de essentiële eisen, neergelegd in bijlage I van de richtlijn, en de in de
      bijlage, onderdeel 1, van richtlijn 2003/32/EG neergelegde specificaties.

      2 De aangemelde instantie beoordeelt de door de fabrikant gevolgde strategie voor risicoanalyse en risicobeheer, en
      met name:

      a. de door de fabrikant verstrekte informatie;

      b. de rechtvaardiging voor het gebruik van dierlijk weefsel of daarvan afgeleide producten;

      c. de resultaten van studies betreffende eliminatie of inactivatie of van literatuuronderzoek;

      d. het toezicht door de fabrikant op de herkomst van de grondstoffen, op de eindproducten en op de onderaannemers;

      e. de noodzaak de herkomst te controleren, met inbegrip van leveringen door derden.

      3 De aangemelde instantie houdt bij de beoordeling van de risicoanalyse en het risicobeheer in het kader van de
      conformiteitsbeoordelingsprocedure voor het uitgangsmateriaal rekening met een TSE-goedkeuringscertificaat van het
      Europees Directoraat voor de geneesmiddelenkwaliteit, hierna «TSE-certificaat» genoemd, zo dit beschikbaar is.

      4 Behalve voor medische hulpmiddelen die zijn vervaardigd met gebruikmaking van uitgangsmateriaal waarvoor het in
      het derde lid bedoelde TSE-goedkeuringscertificaat is afgegeven, vraagt de aangemelde instantie, door tussenkomst
      van Onze Minister, het advies van de bevoegde autoriteiten van de andere lidstaten over hun beoordeling van en hun
      conclusies inzake de risicoanalyse en het risicobeheer door de fabrikant van de weefsels en afgeleide producten die
      bedoeld zijn om in het medische hulpmiddel te worden gebruikt.

      5 Alvorens een EG-onderzoekcertificaat voor het ontwerp of een verklaring van EG-typeonderzoek af te geven, houdt
      de aangemelde instantie terdege rekening met de opmerkingen die zij binnen twaalf weken nadat de mening van de
      nationale autoriteiten is gevraagd heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0007307#Artikel9
