  - number: '6'
    text: |-
      1 Een medisch hulpmiddel voldoet aan de in bijlage I van de richtlijn opgenomen eisen, met inachtneming van de
      bestemming van het betrokken medisch hulpmiddel.

      2 De in bijlage I, punt 13, van de richtlijn bedoelde informatie die aan de gebruiker en de patiënt moeten worden
      verstrekt, zijn opgesteld in de Nederlandse taal.

      3 Onze Minister wijst ter uitvoering van artikel 5 van de richtlijn normen dan wel in voorkomend geval monografieën
      van de Europese Farmacopee aan, bij het voldoen waaraan medische hulpmiddelen worden vermoed te voldoen aan de in
      het eerste lid bedoelde eisen.

      4 De referenties van de aangewezen normen en monografieën worden in de *Staatscourant* bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0007307/2018-08-01#Artikel6
  - number: '7'
    text: |-
      1 Een medisch hulpmiddel is voorzien van de CE-markering.

      2 Een medisch hulpmiddel is slechts voorzien van de CE-markering indien het aan de in bijlage I van de richtlijn
      opgenomen eisen voldoet.

      3 De CE-markering wordt niet aangebracht op een product dat niet een medisch hulpmiddel is.

      4 In afwijking van het eerste lid zijn naar maat gemaakte medische hulpmiddelen en medische hulpmiddelen bestemd
      voor klinisch onderzoek niet voorzien van de CE-markering.

      5 De CE-markering is vergezeld van het identificatienummer van de aangemelde instantie die de in bijlage II, IV, V
      en VI van de richtlijn bedoelde procedures heeft uitgevoerd of van de aangemelde instantie die de door een andere
      lid-staat vastgestelde procedures heeft uitgevoerd.

      6 De CE-markering en het in het vijfde lid bedoelde identificatienummer zijn zichtbaar leesbaar en onuitwisbaar
      aangebracht op het medisch hulpmiddel of op de verpakking die de steriliteit waarborgt, alsmede op de
      gebruiksaanwijzing.

      7 In geval het om technische redenen niet mogelijk is om de CE-markering op het medisch hulpmiddel of op de
      verpakking die de steriliteit waarborgt, aan te brengen, is de markering aangebracht op de verpakking waarin het
      medisch hulpmiddel in de handel wordt gebracht.

      8 Een medisch hulpmiddel is niet voorzien van een markering of opschrift waardoor verwarring zou kunnen ontstaan
      over de betekenis of de grafische vormgeving van de CE-markering; indien op het medisch hulpmiddel, de verpakking
      of op de gebruiksaanwijzing andere markeringen zijn aangebracht verminderen zij niet de zichtbaarheid en
      leesbaarheid van de CE-markering.
    url: https://wetten.overheid.nl/BWBR0007307/2018-08-01#Artikel7
  - number: '8'
    text: |-
      1 Medische hulpmiddelen worden door de fabrikant ingedeeld in klasse I, IIa, IIb of III volgens bijlage IX van
      de richtlijn.

      2 In afwijking van het eerste lid worden borstimplantaten en heup-, knie- en schouderprothesen door de fabrikant
      ingedeeld in klasse III.

      3 Tegen een ingevolge de classificatieregels genomen beslissing van de aangemelde instantie kan de fabrikant beroep
      instellen bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0007307/2018-08-01#Artikel8
  - number: '9'
    text: |-
      1 Dit artikel is niet van toepassing op een naar maat gemaakt medisch hulpmiddel of een medisch hulpmiddel bestemd
      voor klinisch onderzoek.

      2 Voor de beoordeling of een in klasse III ingedeeld medisch hulpmiddel aan de in [artikel 6, eerste lid][ref1],
      bedoelde eisen voldoet, volgt de fabrikant, ten einde de CE-markering aan te brengen, één van de volgende
      procedures:

      a. de in bijlage II van de richtlijn omschreven procedure inzake de EG-verklaring van overeenstemming, of

      b. de in bijlage III van de richtlijn omschreven procedure inzake het EG-typeonderzoek in combinatie met:

      1°. hetzij de in bijlage IV van de richtlijn omschreven procedure inzake de EG-keuring;

      2°. hetzij de in bijlage V van de richtlijn omschreven procedure van de EG-verklaring inzake produktie-
      kwaliteitsborging.

      3 Voor de beoordeling of een in klasse II*b* ingedeeld medisch hulpmiddel aan de in [artikel 6, eerste lid][ref2],
      bedoelde eisen voldoet volgt de fabrikant, ten einde de CE-markering aan te brengen, één van de volgende
      procedures:

      a. de in bijlage II van de richtlijn omschreven procedure inzake de EG-verklaring van overeenstemming met
      uitzondering van de onder punt 4 van dat onderdeel omschreven procedure, of

      b. de in bijlage III van de richtlijn omschreven procedure inzake het EG-typeonderzoek in combinatie met

      1°. hetzij de in bijlage IV van de richtlijn omschreven procedure inzake de EG-keuring;

      2°. hetzij de in bijlage V van de richtlijn omschreven procedure van de EG-verklaring inzake produktie-
      kwaliteitsborging;

      3°. hetzij de in bijlage VI van de richtlijn omschreven procedure inzake produkt-kwaliteitsborging.

      4 Voor de beoordeling of een in klasse II*a* ingedeeld medisch hulpmiddel aan de in [artikel 6, eerste lid][ref3],
      bedoelde eisen voldoet volgt de fabrikant, ten einde de CE-markering aan te brengen, één van de volgende
      procedures:

      a. de in bijlage II van de richtlijn omschreven procedure inzake de EG-verklaring van overeenstemming met
      uitzondering van de onder punt 4 van dat onderdeel omschreven procedure, of:

      b. de in bijlage VII van de richtlijn omschreven procedure inzake de EG-verklaring van overeenstemming in
      combinatie met:

      1°. hetzij de in bijlage IV van de richtlijn omschreven procedure inzake de EG-keuring;

      2°. hetzij de in bijlage V van de richtlijn omschreven procedure van de EG-verklaring inzake produktie-
      kwaliteitsborging;

      3°. hetzij de in bijlage VI van de richtlijn omschreven procedure inzake produkt-kwaliteitsborging.

      5 Voor de beoordeling of een in klasse I ingedeeld medisch hulpmiddel aan de in [artikel 6, eerste lid][ref4],
      bedoelde eisen voldoet, stelt de fabrikant, ten einde de CE-markering aan te brengen, vóór het in de handel brengen
      van het medisch hulpmiddel de EG-verklaring van overeenstemming op, bedoeld in bijlage VII van de richtlijn, en
      neemt daarbij de in die bijlage neergelegde voorschriften in acht.

      6 In geval een conformiteitsbeoordelingsprocedure de tussenkomst van een aangemelde instantie vooronderstelt, wendt
      de fabrikant zich tot een aangemelde instantie van zijn keuze in het kader van de taken waarvoor die instantie
      is aangemeld.

      7 Tijdens de conformiteitsbeoordelingsprocedure houdt de fabrikant of de aangemelde instantie rekening met de
      beschikbare resultaten van beoordelings- en keuringswerkzaamheden die eventueel overeenkomstig dit besluit in
      een tussenstadium van de fabricage hebben plaatsgevonden. Tevens wordt rekening gehouden met de resultaten van
      beoordelings- en keuringswerkzaamheden die hebben plaatsgevonden overeenkomstig de bij of krachtens de [wet][ref5]
      gestelde voorschriften zoals die golden op 31 december 1994.

      8 De fabrikant is verplicht om de aangemelde instantie iedere inlichting te verstrekken die voor de vervulling van
      haar taak met betrekking tot dit besluit redelijkerwijs nodig is.

      Voor in klasse III ingedeelde medische hulpmiddelen als bedoeld in [artikel 9a, eerste lid][ref6], verstrekt de
      fabrikant aan de aangemelde instantie alle relevante informatie die deze nodig heeft om een beoordeling van zijn
      lopende strategie voor risicoanalyse en risicobeheer uit te voeren. Eventuele nieuwe informatie over het risico
      van overdraagbare spongiforme encefalopathieën, die door de fabrikant wordt verzameld en die voor de door hem
      vervaardigde hulpmiddelen relevant is, wordt ter informatie naar de aangemelde instantie gezonden.

      Wijzigingen met betrekking tot de procedures voor het kiezen, verzamelen, behandelen en inactiveren of
      elimineren die van invloed kunnen zijn op het resultaat van het risicobeheer door de fabrikant, worden vóór de
      tenuitvoerlegging ervan ter aanvullende goedkeuring aan de aangemelde instantie voorgelegd.

      9 Een krachtens bijlage II of III van de richtlijn genomen beslissing vervalt na een door de aangemelde instantie
      te bepalen termijn van maximaal vijf jaar. Op aanvraag van de fabrikant kan de aangemelde instantie deze periode
      met termijnen van telkenmale vijf jaar verlengen.

      10 Met de in het tweede lid tot en met het vijfde lid bedoelde procedures worden gelijkgesteld de door de daartoe
      bevoegde autoriteiten van de andere lid-staten in het kader van de richtlijn vastgestelde procedures.


