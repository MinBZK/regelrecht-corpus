  - number: '12'
    text: |-
      1 De fabrikant van een naar maat gemaakt medisch hulpmiddel stelt vóórdat hij het middel aflevert een verklaring
      op, die de in bijlage VIII, punt 2.1, bedoelde gegevens bevat, en volgt de in dat onderdeel bedoelde procedure.

      2 Een naar maat gemaakt medisch hulpmiddel, ingedeeld in klasse III, IIb of IIa, moet zijn vergezeld van de in
      het eerste lid bedoelde verklaring, die aan de door middel van een naam, acroniem of nummercode geïdentificeerde
      patiënt beschikbaar wordt gesteld.

      3 In afwijking van [artikel 6, eerste lid][ref1], behoeft een naar maat gemaakt medisch hulpmiddel niet te voldoen
      aan de in bijlage I van de richtlijn opgenomen eisen, mits met betrekking tot de eisen waaraan niet wordt voldaan,
      in de in het eerste lid bedoelde verklaring de reden daarvan uitdrukkelijk is opgenomen.

      4 De fabrikant van een naar maat gemaakt medisch hulpmiddel houdt de in bijlage VIII, punt 3.1, van de richtlijn
      bedoelde gegevens ter beschikking van een daartoe door Onze Minister aangewezen overheidsinstantie.


