articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. naar maat gemaakt medisch hulpmiddel: een medisch hulpmiddel dat speciaal is vervaardigd volgens voorschrift
      van een arts of van een andere persoon die uit hoofde van zijn beroep daartoe bevoegd is, waarin onder zijn
      verantwoordelijkheid de specifieke kenmerken van het ontwerp zijn aangegeven, en dat is bestemd om uitsluitend door
      een bepaalde patiënt te worden gebezigd;

      b. medisch hulpmiddel bestemd voor klinisch onderzoek: een medisch hulpmiddel dat is bestemd om te worden gebruikt
      bij een klinisch onderzoek als bedoeld in onderdeel 2 van bijlage X van de richtlijn;

      c. hulpstuk: een produkt dat door de fabrikant speciaal is bestemd om met een medisch hulpmiddel te worden gebruikt
      zodat dat middel overeenkomstig diens bestemming kan worden gebezigd of toegepast;

      d. *fabrikant:*de persoon, rechtspersoon daaronder begrepen, of diens gemachtigde, die:

      1°. verantwoordelijk is voor het ontwerp, de vervaardiging, de verpakking en de etikettering van een medisch
      hulpmiddel met het oog op het in de handel brengen ervan onder eigen naam, ongeacht of deze verrichtingen worden
      uitgevoerd door diezelfde persoon of onder zijn verantwoordelijkheid door een derde; of

      2°. die één of meer geprefabriceerde produkten assembleert, verpakt, behandelt, vernieuwt of etiketteert, of aan
      deze produkten de bestemming van een medisch hulpmiddel toekent met het oog op het in de handel brengen ervan onder
      eigen naam;

      e. *gemachtigde:*de in een lidstaat gevestigde persoon, rechtspersoon daaronder begrepen, die, na daartoe
      uitdrukkelijk door de fabrikant te zijn aangewezen, in rechte kan worden aangesproken ten aanzien van de
      verplichtingen die bij of krachtens dit besluit aan de fabrikant zijn opgelegd;

      f. in de handel brengen: het voor het eerst tegen betaling of kosteloos afleveren van een medisch hulpmiddel, dat
      niet voor klinisch onderzoek is bestemd, met het oog op de distributie of het gebruik ervan op de markt van een
      lid-staat, ongeacht of het gaat om een nieuw of een vernieuwd medisch hulpmiddel;

      g. bestemming: het gebruik waartoe het medisch hulpmiddel is bestemd volgens de aanwijzingen die de fabrikant op
      het etiket, in de gebruiksaanwijzing of in het reclame-materiaal verschaft;

      h. aangemelde instantie: de ter uitvoering van artikel 16 van de richtlijn aangewezen instantie;

      i. lid-staat: de staat, die lid is van de Europese Unie, alsmede de staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte;

      j. richtlijn: [richtlijn nr 93/42/EEG](31993L0042) van de Raad van de Europese Gemeenschappen van 14 juni 1993
      betreffende medische hulpmiddelen (*PbEG* L 169);

      k. wet: de [Wet op de medische hulpmiddelen][ref1];

      l. CE-markering: de markering overeenkomstig het model opgenomen in bijlage XII van de richtlijn;

      m. derivaat van menselijk bloed: een stof, als integrerend bestanddeel verwerkt in een medisch hulpmiddel, die,
      indien afzonderlijk gebruikt, kan worden beschouwd als een bestanddeel van een geneesmiddel of als een bloedproduct
      als bedoeld in [artikel 1, eerste lid, onder d, van de Geneesmiddelenwet][ref2], en die de werking van het
      hulpmiddel op het menselijk lichaam kan ondersteunen;

      n. hulpmiddelsubcategorie: een groep hulpmiddelen die bedoeld zijn voor gebruik op dezelfde gebieden, of een
      gemeenschappelijke technologie bezitten;

      o. generieke hulpmiddelgroep: een groep hulpmiddelen die bedoeld zijn voor hetzelfde of een soortgelijk gebruik,
      of een gemeenschappelijke technologie bezitten, zodat zij op generieke wijze kunnen worden ingedeeld, waarbij
      specifieke eigenschappen buiten beschouwing blijven;

      p. hulpmiddel voor eenmalig gebruik: een hulpmiddel dat bedoeld is om slechts eenmaal te worden gebruikt voor één
      patiënt;

      q. richtlijn 2003/32/EG: richtlijn 2003/32/EG van de Commissie van 23 april 2003 tot vaststelling van nadere
      specificaties inzake de in Richtlijn 93/42/EEG van de Raad vastgelegde eisen betreffende medische hulpmiddelen die
      zijn vervaardigd met gebruikmaking van weefsel van dierlijke oorsprong (PbEU L 105);

      r. klinische gegevens: uit het gebruik van een hulpmiddel voortkomende informatie betreffende de veiligheid of de
      prestaties, afkomstig uit:

        - klinisch onderzoek van het betrokken hulpmiddel, of
        - in de wetenschappelijke literatuur beschreven klinisch onderzoek van of andere studies over een soortgelijk
      hulpmiddel waarvan de gelijkwaardigheid met het hulpmiddel in kwestie kan worden aangetoond, of
        - gepubliceerde of ongepubliceerde verslagen over andere klinische ervaringen met het hulpmiddel in kwestie of met
      een soortgelijk hulpmiddel waarvan de gelijkwaardigheid met het hulpmiddel in kwestie kan worden aangetoond.

      2 Medische hulpmiddelen die volgens methodes van continue fabrikage of van seriefabrikage worden vervaardigd en
      die een aanpassing vereisen om te voldoen aan de specifieke behoeften van de arts of van een andere professionele
      gebruiker worden niet beschouwd als een naar maat gemaakt medisch hulpmiddel.

      3 Onder een fabrikant wordt niet begrepen een persoon die, niet zijnde een fabrikant van een medisch hulpmiddel
      in de zin van het eerste lid, onder d, onderdeel 1°, medische hulpmiddelen die reeds in de handel zijn gebracht,
      assembleert voor een individuele patiënt, of aanpast overeenkomstig hun bestemming.

      4 Een wijziging van bijlage I, II, III, IV, V, VI, VII, VIII, IX of X van de richtlijn, dan wel van de bijlage van
      richtlijn 2003/32/EG gaat voor de toepassing van dit besluit gelden met ingang van de dag waarop aan de betrokken
      wijziging uitvoering moet zijn gegeven.


