  - number: 9d
    text: |-
      Voor de toepassing van [artikel 3, eerste lid, onder f][ref1], [artikel 9a, eerste lid][ref2], [artikel 9b][ref3],
      [artikel 9c][ref4] wordt verstaan onder:

      a. *cel:* de kleinste structurele eenheid van een organisme die zelfstandig kan bestaan en in een geschikte
      omgeving zichzelf kan vervangen;

      b. *weefsel:* een complex van cellen of extracellulaire bestanddelen:

      c. *afgeleid product:* door middel van een productieproces uit dierlijk weefsel verkregen materiaal, zoals
      collageen, gelatine, monoklonale antilichamen;

      d. *niet-levensvatbaar:* zonder mogelijkheid tot metabolisme of vermenigvuldiging;

      e. *overdraagbare agentia:* niet-geclassificeerde pathogene entiteiten, prionen en entiteiten, zoals de agentia van
      boviene spongiforme encefalopathieën en van scrapie;

      f. *vermindering, eliminatie of verwijdering:* een proces waarbij het aantal overdraagbare agentia wordt
      verminderd, geëlimineerd of verwijderd teneinde besmetting of een pathogene reactie te voorkomen;

      g: '*inactivatie:* een proces waarbij het vermogen van overdraagbare agentia om besmetting of een pathogene reactie'
      te veroorzaken, wordt verminderd;

      h. *land van herkomst:* het land waar het dier is geboren, opgefokt of geslacht;

      i. *uitgangsmateriaal:* de grondstof of elk ander product van dierlijke herkomst waaruit of met behulp waarvan de
      in [artikel 9a, eerste lid][ref5], bedoelde hulpmiddelen worden geproduceerd.


