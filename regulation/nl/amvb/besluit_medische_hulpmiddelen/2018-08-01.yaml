  - number: '10'
    text: |-
      1 De persoon, rechtspersoon daaronder begrepen, die medische hulpmiddelen, voorzien van de CE-markering,
      overeenkomstig hun bestemming en binnen de door de fabrikanten opgegeven gebruikslimieten samenvoegt, met de
      bedoeling ze af te leveren in de vorm van een systeem of van een behandelingspakket, stelt een verklaring op waarin
      hij verklaart:

      a. dat hij de wederzijdse compatibiliteit van de medische hulpmiddelen heeft gecontroleerd in overeenstemming
      met de instructies van de fabrikanten, en dat hij de samenvoeging in overeenstemming met die instructies heeft
      uitgevoerd; en

      b. dat hij het systeem of het behandelingspakket heeft verpakt en heeft voorzien van voor de gebruikers relevante
      informatie, met inbegrip van de relevante instructies van de fabrikanten; en

      c. dat al deze werkzaamheden onderworpen zijn aan passende methoden van interne beheersing en controle.

      2 Ingeval medische hulpmiddelen worden samengevoegd ten aanzien waarvan de in het eerste lid bedoelde voorwaarden
      niet zijn vervuld, wordt het systeem of het behandelingspakket behandeld als een op zichzelf staand medisch
      hulpmiddel en wordt als zodanig onderworpen aan de desbetreffende procedure van [artikel 9][ref1].

      3 De persoon, rechtspersoon daaronder begrepen die, met het oog op het afleveren daarvan:

      a. systemen,

      b. behandelingspakketten, of

      c. andere van een CE-markering voorziene medische hulpmiddelen, die overeenkomstig de instructie van de fabrikant
      vóór gebruik moeten worden gesteriliseerd, steriliseert, volgt één van de in bijlage II of V van de richtlijn
      beschreven procedures voorzover deze betrekking hebben op het verkrijgen van de steriliteit. De persoon stelt een
      verklaring op dat de sterilisatie overeenkomstig de instructies van de fabrikant is uitgevoerd.

      4 De in het eerste en derde lid bedoelde middelen zijn niet van een extra CE-markering voorzien.

      5 De systemen en behandelingspakketten zijn vergezeld van de in bijlage I van de richtlijn bedoelde informatie.
      Deze informatie bevat, indien noodzakelijk, de door de fabrikanten van de samen te voegen hulpmiddelen verstrekte
      gegevens.

      6 De persoon, rechtspersoon daaronder begrepen, bewaart de in het eerste en derde lid bedoelde verklaring gedurende
      een periode van vijf jaar, te rekenen vanaf de datum van samenvoeging of sterilisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0007307#Artikel9
