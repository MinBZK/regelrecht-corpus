  - number: '2'
    text: |-
      Dit besluit is mede van toepassing op het hulpstuk en op de software die voor de goede werking van het medisch
      hulpmiddel benodigd zijn.
    url: https://wetten.overheid.nl/BWBR0007307/2018-08-01#Artikel2
  - number: '3'
    text: |-
      1 Dit besluit is niet van toepassing op:

      a. in-vitro diagnostica waarop het [Besluit in-vitro diagnostica][ref1] van toepassing is.

      b. actieve implantaten in de zin van het [Besluit actieve implantaten][ref2];

      c. medische hulpmiddelen bestemd voor het toedienen van een geneesmiddel als bedoeld in
      [artikel 1, eerste lid, onder b, van de Geneesmiddelenwet][ref3], voor zover zij op zodanige wijze in de handel
      worden gebracht dat:

      1°. het medisch hulpmiddel en het geneesmiddel een ondeelbaar geheel vormen,

      2°. zij uitsluitend zijn bestemd om te worden gebruikt in de gegeven combinatie, en

      3°. niet opnieuw kunnen worden gebruikt;

      d. menselijk bloed, producten van menselijk bloed, bloedplasma of bloedcellen van menselijke oorsprong of op
      medische hulpmiddelen die op het moment waarop ze in de handel worden gebracht dergelijke bloedproducten, dergelijk
      bloedplasma of dergelijke bloedcellen bevatten, met uitzondering van derivaten van menselijk bloed;

      e. transplantaten, weefsels of cellen van menselijke oorsprong, of produkten die weefsels of cellen van menselijke
      oorsprong bevatten of daarvan zijn afgeleid;

      f. transplantaten, weefsels of cellen van dierlijke oorsprong, tenzij het desbetreffende medisch hulpmiddel
      is vervaardigd met gebruikmaking van dierlijk weefsel dat niet-levensvatbaar is gemaakt, dan wel van niet-
      levensvatbare produkten die zijn afgeleid van dierlijk weefsel;

      g. persoonlijke beschermingsmiddelen in de zin van het [Warenwetbesluit Persoonlijke beschermingsmiddelen][ref4].

      2 De in bijlage I van de richtlijn opgenomen essentiële eisen, voor zover het betreft aspecten verband houdend
      met veiligheid en prestaties, zijn evenwel op de in onderdeel c van het eerste lid bedoelde medische hulpmiddelen
      van toepassing.


