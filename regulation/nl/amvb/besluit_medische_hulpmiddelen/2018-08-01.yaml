  - number: '13'
    text: |-
      1 Voor de medische hulpmiddelen die voor klinisch onderzoek zijn bestemd, stelt de fabrikant vóór de aanvang van
      het onderzoek de Inspectie gezondheidszorg en jeugd daarvan in kennis door middel van de verklaring, bedoeld in
      bijlage VIII van de richtlijn, en volgt hij de in de bijlage VIII van de richtlijn bedoelde procedure.

      2 In afwijking van [artikel 6, eerste lid][ref1], behoeft een medisch hulpmiddel, bestemd voor klinisch onderzoek
      op het punt waarop het onderzoek is gericht, niet te voldoen aan de in bijlage I van de richtlijn opgenomen eisen.

      3 De fabrikant levert het medische hulpmiddel bestemd voor klinisch onderzoek slechts af indien:

      a. een op grond van [artikel 16 van de Wet medisch-wetenschappelijk onderzoek met mensen][ref2] erkende commissie
      een positief advies omtrent het onderzoeksprogramma, met inbegrip van het klinisch onderzoeksplan, heeft
      uitgebracht;

      b. hij vóór het tijdstip waarop het klinisch onderzoek aanvangt een verzekering heeft afgesloten die zijn
      aansprakelijkheid dekt voor door het klinisch onderzoek veroorzaakte schade.

      4 Het klinisch onderzoek wordt uitgevoerd volgens bijlage X van de richtlijn.

      5 De fabrikant brengt de Inspectie gezondheidszorg en jeugd op de hoogte van de beëindiging van het klinisch
      onderzoek, met een opgave van redenen in geval van een vroegtijdige beëindiging.

      6 De fabrikant houdt de volgende gegevens ter beschikking van de Inspectie gezondheidszorg en jeugd:

      a. de in de bijlage VIII, punt 3.2, van de richtlijn bedoelde gegevens;

      b. het in punt 2.3.7 van bijlage X van de richtlijn bedoelde verslag inzake het klinisch onderzoek.

      7 [Artikel 7, vierde lid][ref3], en het eerste en vierde lid, alsmede het zesde lid, onder a van dit artikel zijn
      niet van toepassing indien bij het klinisch onderzoek medische hulpmiddelen worden toegepast die overeenkomstig
      [artikel 7][ref4] zijn voorzien van de CE-markering, mits dit onderzoek dezelfde bestemming van de medische
      hulpmiddelen tot doel heeft als met de desbetreffende conformiteitsbeoordelingsprocedures is beoogd.


