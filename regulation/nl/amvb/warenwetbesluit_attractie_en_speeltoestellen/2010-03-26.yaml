  - number: '23'
    text: |-
      De [artikelen 6][ref1] en [7, eerste en tweede lid][ref2], zijn niet van toepassing op de in
      [artikel 21, eerste lid][ref3], bedoelde attractietoestellen.


      [ref1]: https://wetten.overheid.nl/BWBR0008223#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008223#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0008223#Artikel21
