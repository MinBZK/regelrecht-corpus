  - number: '24'
    text: |-
      De [artikelen 6][ref1], [7, derde lid][ref2], [8, tweede lid][ref3], en [14, eerste lid][ref4], zijn niet van
      toepassing op speeltoestellen die reeds in gebruik zijn op het tijdstip van inwerkingtreding van dit besluit.


