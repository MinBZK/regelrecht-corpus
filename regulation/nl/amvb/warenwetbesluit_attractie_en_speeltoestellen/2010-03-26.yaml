        artikel: '20'
        hoofdstuk: '6'
  - number: '26'
    text: |-
      Onze Minister van Volksgezondheid, Welzijn en Sport zendt binnen 5 jaar na de inwerkingtreding van dit besluit aan
      de Staten-Generaal een verslag over de doeltreffendheid en de effecten van dit besluit in de praktijk.
    url: https://wetten.overheid.nl/BWBR0008223/2010-03-26#Artikel26
