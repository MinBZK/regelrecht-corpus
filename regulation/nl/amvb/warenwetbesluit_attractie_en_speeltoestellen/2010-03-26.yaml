  - number: '25'
    text: |-
      Degene die een attractietoestel voorhanden heeft, dat reeds in gebruik is op het tijdstip van inwerkingtreding
      van dit besluit, doet binnen 30 dagen na inwerkingtreding van dit besluit bij de Regionale Inspectie
      Gezondheidsbescherming 's-Hertogenbosch aangifte van het feit dat hij een dergelijk attractietoestel voorhanden
      heeft, onder opgave van de gegevens, vermeld in [artikel 20, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008223#Artikel20
    url: https://wetten.overheid.nl/BWBR0008223/2010-03-26#Artikel25
