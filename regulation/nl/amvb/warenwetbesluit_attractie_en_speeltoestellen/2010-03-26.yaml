  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 2 februari 1996, nr DGVgz/VVP/
    P 9696;

    Gelet op de artikelen 1, eerste lid, onderdeel a, 2, 3, 6, 9, 10, 12, derde lid, en 24 van de Wet op de gevaarlijke
    werktuigen;

    Gezien het advies van de Commissie Regeling Attractieveiligheid van 12 december 1995;

    De Raad van State gehoord (advies van 4 juni 1996, nr. W 13.96.0060);

    Gezien het nader rapport van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 27 augustus 1996, nr.
    GZB/C&O/962053;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008223/2010-03-26#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop gebaseerde bepalingen wordt verstaan onder:

      a. attractietoestel: al dan niet permanent geïnstalleerde inrichting ter voortbeweging van personen, die bestemd is
      voor vermaak of ontspanning en die aangedreven wordt door een niet-menselijke energiebron;

      b. attractietoestel van een eenvoudig ontwerp: al dan niet roterend attractietoestel waarmee passagiers een
      snelheid kunnen bereiken van niet meer dan 10 meter per seconde en waarmee passagiers een hoogte kunnen bereiken
      van niet meer dan 5 meter boven het terrein waarop het attractietoestel staat opgesteld;

      c. speeltoestel: een inrichting bestemd voor vermaak of ontspanning waarbij uitsluitend van zwaartekracht of van
      fysieke kracht van de mens gebruik wordt gemaakt;

      d. aangewezen instelling: een krachtens [artikel 7a van de wet][ref1] met betrekking tot de keuring van attractie-
      en speeltoestellen aangewezen instelling;

      e. norm: een document, uitgegeven door een deskundig, onafhankelijk instituut, waarin wordt omschreven aan welke
      eisen een attractie- of speeltoestel moet voldoen, dan wel waarin een omschrijving wordt gegeven van een keurings-,
      meet- of berekeningsmethode;

      f. bijlage I, II, III: de bij dit besluit behorende bijlagen;

      g. wet: [Warenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0001969
    url: https://wetten.overheid.nl/BWBR0008223/2010-03-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0001969
  - number: '2'
    text: |-
      Dit besluit en de daarop berustende bepalingen zijn eveneens van toepassing op attractie- en speeltoestellen indien
      deze onroerend zijn.
    url: https://wetten.overheid.nl/BWBR0008223/2010-03-26#Artikel2
  - number: '3'
    text: |-
      1 Dit besluit is niet van toepassing op:

      a. attractie- en speeltoestellen die bestemd zijn om uitsluitend buiten het grondgebied van Nederland gebruikt
      te worden;

      b. kleine door elektrische energie aangedreven attractietoestellen kennelijk bestemd voor de voortbeweging van
      maximaal 3 kinderen;

      c. speeltoestellen die als element van hun spel door kinderen onder toezicht worden vervaardigd;

      2 De [artikelen 4 tot en met 14][ref1] en [16][ref2] zijn niet van toepassing op attractie- en speeltoestellen,
      die in een staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte, rechtmatig in
      het verkeer zijn gebracht en bestemd zijn voor tijdelijk gebruik in Nederland, mits zij voldoen aan eisen welke
      gelijkwaardig zijn aan de eisen in dit besluit gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008223#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008223#Artikel16
    url: https://wetten.overheid.nl/BWBR0008223/2010-03-26#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008223
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008223
        artikel: '16'
        hoofdstuk: '4'
  - number: 3a
    text: |-
      Het is verboden attractie- of speeltoestellen te vervaardigen, te verhandelen of te gebruiken, die niet voldoen
      aan, of ten aanzien waarvan wordt gehandeld, in strijd met bij of krachtens dit besluit gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0008223/2010-03-26#Artikel3a
  - number: '4'
    text: |-
      Attractie- en speeltoestellen zijn zodanig ontworpen en vervaardigd, hebben zodanige eigenschappen en zijn van
      zodanige opschriften voorzien, dat zij bij redelijkerwijs te verwachten gebruik geen gevaar opleveren voor de
      veiligheid of de gezondheid van de mens. Zij voldoen daartoe aan de in [bijlage I][ref1] genoemde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0008223
    url: https://wetten.overheid.nl/BWBR0008223/2010-03-26#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008223
  - number: '5'
    text: |-
      1 Bij ministeriële regeling kunnen normen worden aangewezen en nadere voorschriften worden gesteld voor attractie-
      en speeltoestellen.

      2 Attractie- en speeltoestellen welke voldoen aan de normen, bedoeld in het eerste lid, worden in zoverre vermoed
      te voldoen aan [artikel 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008223#Artikel4
    url: https://wetten.overheid.nl/BWBR0008223/2010-03-26#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008223
        artikel: '4'
        hoofdstuk: '2'
  - number: '6'
    text: |-
      Attractie- en speeltoestellen zijn voorzien van de volgende, onlosmakelijk op of in het toestel aangebrachte,
      onuitwisbare opschriften of aanduidingen:

      a. de naam en het adres van de fabrikant of importeur;

      b. het bouwjaar;

      c. de serie- of typeaanduiding;

      d. het serienummer, voor zover van toepassing.
    url: https://wetten.overheid.nl/BWBR0008223/2010-03-26#Artikel6
  - number: '7'
    text: |-
      1 Voor attractietoestellen stelt de fabrikant, diens gemachtigde of, indien zij geen van beide in Nederland zijn
      gevestigd, degene die de attractietoestellen in Nederland in de handel brengt, een technisch constructiedossier op,
      met inachtneming van [bijlage II][ref1], bewaart het bedoelde dossier gedurende de technische levensduur van het
      attractietoestel en houdt het ter beschikking van een aangewezen instelling.

      2 Voor speeltoestellen is het eerste lid van overeenkomstige toepassing, met dien verstande, dat de bewaartermijn
      beperkt is tot tien jaar na de laatste verhandeling van het speeltoestel.

      3 Degene die een attractie- of speeltoestel rechtstreeks betrekt van een in het buitenland gevestigde leverancier,
      met een ander voornemen dan om het in de handel te brengen, bedingt, indien het toestel niet vergezeld gaat van
      een technisch constructiedossier, contractueel dat de leverancier een technisch constructiedossier, overeenkomstig
      [bijlage II][ref2], ter beschikking houdt van een aangewezen instelling, met in achtneming van de in het eerste en
      tweede lid genoemde termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0008223
      [ref2]: https://wetten.overheid.nl/BWBR0008223
    url: https://wetten.overheid.nl/BWBR0008223/2010-03-26#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008223
      - id: ref2
        bwb_id: BWBR0008223
  - number: '8'
    text: |-
      1 Attractietoestellen worden periodiek gekeurd door een aangewezen instelling.

      2 Speeltoestellen worden eenmalig gekeurd door een aangewezen instelling.

      3 Bij de keuring van speeltoestellen en bij de eerste keuring van attractietoestellen van een eenvoudig ontwerp kan
      worden volstaan met de keuring van een het type kenmerkend monster.
    url: https://wetten.overheid.nl/BWBR0008223/2010-03-26#Artikel8
  - number: '9'
    text: |-
      1 De aanvraag van een keuring van een attractie- of speeltoestel wordt ingediend bij slechts één aangewezen
      instelling.

      2 De aanvraag omvat:

      a. de plaats waar het toestel is vervaardigd;

      b. het bouwjaar en het type- en serienummer;

      c. het in [artikel 7][ref1] genoemde technisch constructiedossier, indien van toepassing, of de naam en adres van
      de leverancier waar het technisch constructiedossier beschikbaar is voor de aangewezen instelling;

      d. het in [artikel 14, tweede lid][ref2], bedoelde logboek.

      3 De aanvraag gaat vergezeld van de opgave van de plaats waar het attractie- of speeltoestel kan worden gekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0008223#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008223#Artikel14
    url: https://wetten.overheid.nl/BWBR0008223/2010-03-26#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008223
        artikel: '7'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008223
        artikel: '14'
        hoofdstuk: '4'
  - number: '10'
    text: |-
      1 De aangewezen instelling onderzoekt het attractie- of speeltoestel en het technisch constructiedossier en
      vergewist zich ervan of het toestel is vervaardigd overeenkomstig het technisch constructiedossier.

      2 Bij de tweede en volgende keuringen van attractietoestellen vindt geen beoordeling van het technisch
      constructiedossier plaats.

      3 De aangewezen instelling gaat na of de eventuele toepassing van normen correct is gebeurd en voert passende
      onderzoeken en proeven uit om na te gaan of het toestel overeenstemt met de daarop betrekking hebbende veiligheids-
      en gezondheidsvoorschriften.
    url: https://wetten.overheid.nl/BWBR0008223/2010-03-26#Artikel10
  - number: 10a
    text: |-
      1 Nadat een keuring als bedoeld in artikel 8 heeft plaatsgevonden wordt voor een attractie- of speeltoestel een
      certificaat van goedkeuring afgegeven, indien het naar het oordeel van de aangewezen instelling voldoet aan de in
      de artikelen 4 tot en met 6 gegeven voorschriften.

      2 Bij toepassing van artikel 8, derde lid, wordt ieder attractie- of speeltoestel dat overeenkomstig het
      goedgekeurde, het type kenmerkende monster is vervaardigd zonder nadere keuring van een merk van goedkeuring
      voorzien.

      3 Attractietoestellen die niet overeenkomstig een goedgekeurd, het type kenmerkend monster zijn vervaardigd en
      waarvoor een certificaat van goedkeuring is afgegeven, worden door de aangewezen instelling tevens voorzien van een
      merk van goedkeuring.

      4 Bij ministeriële regeling worden met betrekking tot de inhoud, vorm en geldigheidsduur van certificaten en merken
      van goedkeuring nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0008223/2010-03-26#Artikel10a
  - number: 10b
    text: |-
      Bij ministeriële regeling kunnen fabrikanten of handelaren bevoegd worden verklaard tot het aanbrengen van het
      merk van goedkeuring, bedoeld in artikel 10a, tweede lid. Aan een dergelijke bevoegdverklaring kunnen voorschriften
      worden verbonden.
    url: https://wetten.overheid.nl/BWBR0008223/2010-03-26#Artikel10b
  - number: '11'
    text: |-
      De aangewezen instelling stelt bij attractietoestellen de voor het veilig gebruik relevante conclusies van de
      keuring en de geldigheidsduur van het certificaat of merk van goedkeuring op schrift in het bij het toestel
      behorende logboek.
    url: https://wetten.overheid.nl/BWBR0008223/2010-03-26#Artikel11
  - number: '12'
    text: |-
      1 De aangewezen instelling geeft aan de in [artikel 25 van de wet][ref1] bedoelde ambtenaren bericht van de
      uitslagen van keuringen en de datum waarop een tweede of volgende keuring van het bewuste toestel nodig is.

      2 De aangewezen instelling die het afgeven van een certificaat of merk van goedkeuring weigert, doet hiervan
      mededeling aan de overige aangewezen instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel25
    url: https://wetten.overheid.nl/BWBR0008223/2010-03-26#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '25'
  - number: '13'
    text: |-
      1 De aangewezen instelling die het attractie- of speeltoestel of een het type kenmerkend monster daarvan heeft
      gekeurd, wordt onverwijld in kennis gesteld van elke ingrijpende wijziging of reparatie van een toestel.

      2 Indien naar het oordeel van de in het eerste lid bedoelde aangewezen instelling de wijziging of reparatie van
      het toestel de veiligheid of gezondheid van personen beïnvloedt, wordt het toestel opnieuw gekeurd overeenkomstig
      [artikel 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008223#Artikel8
    url: https://wetten.overheid.nl/BWBR0008223/2010-03-26#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008223
        artikel: '8'
        hoofdstuk: '3'
  - number: '14'
    text: |-
      1 Attractie- en speeltoestellen gaan vergezeld van een Nederlandstalige gebruiksaanwijzing met aanwijzingen,
      veiligheidsinstructies, waarschuwingen en andere relevante informatie, die degene die het toestel voorhanden heeft,
      in staat stelt het toestel zodanig te installeren, te monteren, te doen gebruiken, te demonteren, te inspecteren en
      te onderhouden dat het toestel geen gevaar oplevert voor de veiligheid of gezondheid van personen.

      2 Attractie- en speeltoestellen gaan vergezeld van een logboek volgens het model in [bijlage III][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008223
    url: https://wetten.overheid.nl/BWBR0008223/2010-03-26#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008223
  - number: '15'
    text: |-
      1 Degene die een attractie- of speeltoestel voorhanden heeft, zorgt ervoor dat het toestel zodanig is
      geïnstalleerd, gemonteerd en zodanig is beproefd, geïnspecteerd en onderhouden en zodanig van opschriften is
      voorzien, dat er bij gebruik geen gevaar voor de gezondheid of veiligheid van personen bestaat.

      2 Het eerste lid is niet van toepassing op degene die een attractie- of speeltoestel voorhanden heeft, dat hetzij
      is afgekeurd, hetzij onklaar gemaakt, hetzij anderszins kennelijk niet meer voor gebruik bestemd is.
    url: https://wetten.overheid.nl/BWBR0008223/2010-03-26#Artikel15
  - number: '16'
    text: |-
      Degene die een attractie- of speeltoestel voorhanden heeft, houdt het in [artikel 14, tweede lid][ref1], bedoelde
      logboek bij en bewaart dit logboek.


      [ref1]: https://wetten.overheid.nl/BWBR0008223#Artikel14
    url: https://wetten.overheid.nl/BWBR0008223/2010-03-26#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008223
        artikel: '14'
        hoofdstuk: '4'
  - number: '17'
    text: |-
      Degene die een attractie- of speeltoestel voorhanden heeft, dat voorzien is van een merk van afkeuring, zorgt
      ervoor dat:

      a. het toestel zodanig is stilgezet of afgesloten dat het niet zonder hulpmiddelen kan worden betreden;

      b. op of nabij daarvoor in aanmerking komende punten van het toestel een duidelijk opschrift is aangebracht waaruit
      blijkt dat het toestel niet voor gebruik is bestemd.
    url: https://wetten.overheid.nl/BWBR0008223/2010-03-26#Artikel17
  - number: '18'
    text: |-
      [Artikel 3a][ref1] is niet van toepassing op het tentoonstellen en demonstreren op (jaar-)beurzen, exposities en
      bij demonstraties van attractie- en speeltoestellen die niet in overeenstemming zijn met dit besluit, mits op een
      zichtbaar bord is aangegeven dat de betrokken toestellen niet in overeenstemming met dit besluit zijn, en dat zij
      niet in het verkeer mogen worden gebracht voordat ze door de fabrikant of importeur in overeenstemming met dit
      besluit zijn gebracht. Bij demonstraties zijn alle passende veiligheidsmaatregelen genomen om de veiligheid en
      gezondheid van de mens te waarborgen.


      [ref1]: https://wetten.overheid.nl/BWBR0008223#Artikel3a
    url: https://wetten.overheid.nl/BWBR0008223/2010-03-26#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008223
        artikel: 3a
        hoofdstuk: 1A
  - number: '19'
    text: |-
      1 Als aangewezen instelling kan worden aangewezen een instelling die:

      a. rechtspersoonlijkheid heeft;

      b. haar zetel of een vestiging in een lidstaat van de Europese Unie of van de Europese Economische Ruimte heeft;

      c. onafhankelijk is van degenen die bij het resultaat van de uitvoering van de taken waarvoor zij is aangewezen
      belang hebben;

      d. beschikt over voldoende deskundigheid en outillage om de uitvoering van de taken waarvoor zij is aangewezen,
      naar behoren te kunnen vervullen;

      e. beschikt over een behoorlijke administratie waarin de gegevens die samenhangen met en betrekking hebben op
      de uitvoering van haar taken, op een systematische wijze zijn vastgelegd. Aan de hand van deze gegevens zijn de
      (type-)gekeurde attractie- en speeltoestellen afdoende te identificeren;

      f. naar behoren functioneert.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008223/2010-03-26#Artikel19
  - number: 19a
    text: |-
      De instelling verstrekt jaarlijks aan Onze Minister een afschrift van de polis van de afgesloten verzekering tegen
      wettelijke aansprakelijkheid tegen alle risico's die voortvloeien uit de uitoefening van de taken waarvoor zij
      is aangewezen.
    url: https://wetten.overheid.nl/BWBR0008223/2010-03-26#Artikel19a
  - number: 19b
    text: |-
      1 Indien een wijziging plaatsvindt in de gegevens op grond waarvan de instelling is aangewezen, doet de instelling
      hiervan terstond mededeling aan Onze Minister.

      2 Indien een instelling voornemens is een of meer van de taken waarvoor zij is aangewezen, te beëindigen, doet
      de instelling hiervan terstond mededeling aan Onze Minister en de certificaathouders. In dat geval worden door
      de instelling de gegevens, bedoeld in artikel 19, eerste lid, onder e, overgedragen aan Onze Minister dan wel,
      na toestemming van Onze Minister en de certificaathouders, een andere instelling die voor dezelfde taken is
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0008223/2010-03-26#Artikel19b
  - number: 19c
    text: |-
      1 Een aanvraag om aanwijzing gaat vergezeld van het bewijs dat is voldaan aan de criteria, bedoeld in artikel 19,
      eerste lid, dan wel van een verklaring waaruit de bereidheid blijkt om voor eigen rekening een onderzoek naar het
      voldoen aan deze criteria te ondergaan.

      2 Een aanwijzing kan worden geweigerd, dan wel worden gewijzigd of ingetrokken, indien niet of niet volledig
      is voldaan aan de bij de wet of bij of krachtens dit besluit gestelde voorschriften. Een aanwijzing kan worden
      ingetrokken indien de instelling gedurende een aaneengesloten periode van twee jaar geen werkzaamheden, waarvoor
      zij is aangewezen, heeft uitgevoerd.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0008223/2010-03-26#Artikel19c
  - number: '20'
    text: |-
      1 Degene die een attractietoestel voorhanden heeft, doet onverwijld na de eerste opbouw of plaatsing ervan bij de
      Voedsel en Waren Autoriteit aangifte van het feit dat hij een attractietoestel voorhanden heeft, onder opgave van
      de volgende gegevens:

      a. zijn naam, woon- of verblijfplaats en adres;

      b. de soort, het type, het bouwjaar en de fabrikant van het attractietoestel;

      c. plaats waar het attractietoestel zich bevindt of, in het geval van een niet permanent geïnstalleerd
      attractietoestel, de plaatsen waar het zich in de periode van drie maanden na de dag van aangifte zal bevinden.

      2 Degene die een attractie- of speeltoestel tijdelijk in Nederland gebruikt, doet, tenminste twee maal
      vierentwintig uur voorafgaand aan elke eerste opbouw of plaatsing van het toestel op Nederlands grondgebied, bij
      de Voedsel en Waren Autoriteit aangifte van zijn voornemen tot plaatsing of opbouw van het toestel op Nederlands
      grondgebied, onder opgave van de gegevens, vermeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008223/2010-03-26#Artikel20
  - number: '21'
    text: |-
      1 De verboden gesteld in [artikel 3a][ref1], voor zover het betreft het voorhanden hebben of gebruiken van
      attractietoestellen gelden niet gedurende tien jaren na het tijdstip van inwerkingtreding van dit besluit ten
      aanzien van op dat tijdstip reeds in gebruik zijnde attractietoestellen, mits zij, tezamen met het logboek, door
      een aangewezen instelling worden onderzocht en dit onderzoek geen evidente tekortkomingen voor de veiligheid of de
      gezondheid van de mens aan het licht brengt.

      2 Het in het eerste lid bedoelde onderzoek vindt plaats binnen twee jaar na inwerkingtreding van dit besluit en
      wordt daarna elke twee jaar herhaald.

      3 De aangewezen instelling maakt van de uitslagen van het in het eerste en het tweede lid bedoelde onderzoek, en de
      bevindingen bij dit onderzoek, aantekeningen in het in [artikel 14][ref2] bedoelde logboek.

      4 Het eerste lid is niet van toepassing op attractietoestellen die zijn voorzien van een merk van afkeuring.


      [ref1]: https://wetten.overheid.nl/BWBR0008223#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0008223#Artikel14
    url: https://wetten.overheid.nl/BWBR0008223/2010-03-26#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0008223
        artikel: 3a
        hoofdstuk: 1A
      - id: ref2
        bwb_id: BWBR0008223
        artikel: '14'
        hoofdstuk: '4'
  - number: '22'
    text: |-
      1 Ten aanzien van attractietoestellen als bedoeld in [artikel 21, eerste lid][ref1], geldt ten aanzien van
      de keuringen bedoeld in [hoofdstuk 3][ref2], dat in plaats van een technisch constructiedossier volstaan
      kan worden met een onvolledig technisch constructiedossier of met andere documenten indien dat onvolledige
      technisch constructiedossier of die andere documenten voldoende inzicht geven in de technische kenmerken van het
      attractietoestel.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008223#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0008223#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0008223/2010-03-26#Artikel22
