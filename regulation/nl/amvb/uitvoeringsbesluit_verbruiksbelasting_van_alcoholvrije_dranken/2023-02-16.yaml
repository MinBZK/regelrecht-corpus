  - number: '1.2'
    text: |-
      In dit besluit wordt verstaan onder de wet: de [Wet op de verbruiksbelasting van alcoholvrije dranken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005802
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005802
  - number: '2.1'
    text: |-
      Het brengen, bedoeld in [artikel 3, vierde lid, onderdeel a, van de wet][ref1], van alcoholvrije dranken vanuit
      een inrichting naar een andere inrichting die voor dat soort goed als zodanig is aangewezen, dient te kunnen worden
      aangetoond met een vervoersopdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel3
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005802
        artikel: '3'
  - number: '2.2'
    text: |-
      De vervoersopdracht wordt opgemaakt door de vergunninghouder van de inrichting van waaruit alcoholvrije dranken
      worden overgebracht.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel2
  - number: '2.3'
    text: |-
      De vervoersopdracht moet binnen één maand na de datum van verzending van de in het eerste lid bedoelde goederen
      zijn terugontvangen door de vergunninghouder van de inrichting van waaruit de goederen zijn overgebracht, voorzien
      van een verklaring van de vergunninghouder van de inrichting waarnaartoe de goederen zijn overgebracht dat de
      goederen hun bestemming hebben bereikt en in de administratie van zijn inrichting zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel2
  - number: '2.4'
    text: |-
      De vergunninghouder van de inrichting waarnaartoe de in het eerste lid bedoelde goederen zijn overgebracht, draagt
      zorg voor de terugzending van de in het derde lid bedoelde vervoersopdracht.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel2
  - number: '2.5'
    text: |-
      Indien de in het derde lid bedoelde vervoersopdracht niet wordt terugontvangen voorzien van de in het derde lid
      bedoelde verklaring, stelt de vergunninghouder van de inrichting van waaruit de goederen zijn overgebracht, de
      inspecteur daarvan in kennis uiterlijk binnen twee maanden na de datum van verzending van de goederen.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel2
  - number: '2.6'
    text: 'De vervoersopdracht, bedoeld in het eerste lid, kan op verzoek achterwege blijven indien:'
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel2
  - number: 2.6.a
    text: |-
      zowel de vergunninghouder van de inrichting van waaruit de goederen worden overgebracht, als de vergunninghouder
      van de inrichting waarnaartoe de goederen worden overgebracht, beschikt over een administratie waarin deze
      overbrengingen afzonderlijk worden bijgehouden en waaruit naar het oordeel van de inspecteur de overbrengingen op
      overzichtelijke wijze zijn af te lezen;
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel2
  - number: 2.6.b
    text: |-
      gebruik wordt gemaakt van een maandverklaring, waarin de vergunninghouder van de inrichting van waaruit de goederen
      worden overgebracht opgave doet van de door hem in een kalendermaand zonder vervoersopdracht naar een andere
      inrichting overgebrachte goederen; en
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel2
  - number: 2.6.c
    text: |-
      de maandverklaring na afloop van een kalendermaand wordt verstrekt aan elke vergunninghouder van een inrichting
      waarnaartoe in die kalendermaand goederen zijn overgebracht.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel2
  - number: '2.7'
    text: |-
      De toestemming voor toepassing van het zesde lid wordt opgenomen in de vergunning voor beide in het zesde lid
      bedoelde inrichtingen. Op de toestemming zijn de [artikelen 43 tot en met 50 van de Wet op de accijns][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel43
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '43'
  - number: '2.8'
    text: |-
      De administratie van de in het zesde lid bedoelde vergunninghouder van de inrichting van waaruit de goederen worden
      overgebracht, bevat in ieder geval:
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel2
  - number: 2.8.a
    text: |-
      de naam, het adres en het vergunningnummer van de vergunninghouder van de inrichting waarnaartoe de goederen zijn
      overgebracht;
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel2
  - number: 2.8.b
    text: de soort, de hoeveelheid en de voor de heffing van de belasting van belang zijnde samenstelling van de goederen;
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel2
  - number: 2.8.c
    text: de datum van verzending van de goederen; en
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel2
  - number: 2.8.d
    text: per overbrenging het nummer van de maandverklaring waarin die overbrenging is begrepen.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel2
  - number: '2.9'
    text: |-
      De administratie van de in het zesde lid bedoelde vergunninghouder van de inrichting waarnaartoe de goederen worden
      overgebracht, bevat in ieder geval:
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel2
  - number: 2.9.a
    text: |-
      de naam, het adres en het vergunningnummer van de vergunninghouder van de inrichting van waaruit de goederen zijn
      overgebracht;
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel2
  - number: 2.9.b
    text: de soort, de hoeveelheid en de voor de heffing van de belasting van belang zijnde samenstelling van de goederen;
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel2
  - number: 2.9.c
    text: de datum van verzending van de goederen;
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel2
  - number: 2.9.d
    text: de datum waarop de goederen zijn ontvangen; en
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel2
  - number: 2.9.e
    text: per overbrenging het nummer van de maandverklaring waarin die overbrenging is begrepen.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel2
  - number: '2.10'
    text: |-
      De vergunninghouder van de inrichting waarnaartoe de goederen zijn overgebracht, draagt zorg voor de terugzending
      van de in het zesde lid bedoelde maandverklaring.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel2
  - number: '2.11'
    text: |-
      De in het zesde lid bedoelde maandverklaring moet binnen één maand na de maand waarop de maandverklaring betrekking
      heeft, zijn terugontvangen door de vergunninghouder van de inrichting van waaruit de goederen zijn overgebracht,
      voorzien van een verklaring van de vergunninghouder van de inrichting waarnaartoe de goederen zijn overgebracht,
      dat de goederen hun bestemming hebben bereikt en in de administratie van zijn inrichting zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel2
  - number: '2.12'
    text: |-
      Indien de maandverklaring niet wordt terugontvangen voorzien van de in het elfde lid bedoelde verklaring, stelt
      de vergunninghouder van de inrichting van waaruit de goederen zijn overgebracht, de inspecteur daarvan onverwijld
      in kennis, maar uiterlijk binnen één week na afloop van de maand waarin de maandverklaring door hem moet zijn
      terugontvangen.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel2
  - number: '2.13'
    text: |-
      Bij toepassing van het zesde lid is [artikel 27][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005804#Artikel27
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005804
        artikel: '27'
        hoofdstuk: IV
        afdeling: '1'
  - number: '3.1'
    text: |-
      Het brengen, bedoeld in [artikel 3, vierde lid, onderdeel b, van de wet][ref1], van alcoholvrije dranken vanuit
      een inrichting naar een ondernemer dan wel een publiekrechtelijk lichaam, anders dan als ondernemer, in een andere
      lidstaat dient te blijken uit boeken en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel3
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005802
        artikel: '3'
  - number: '3.2'
    text: |-
      De vergunninghouder van de inrichting van waaruit de goederen, bedoeld in het eerste lid, worden overgebracht dient
      te beschikken over een administratie waarin deze overbrengingen afzonderlijk worden bijgehouden en waaruit naar het
      oordeel van de inspecteur de overbrengingen op overzichtelijke wijze zijn af te lezen.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel3
  - number: '3.3'
    text: |-
      De in het tweede lid bedoelde administratie bevat in ieder geval de gegevens over de door de vergunninghouder in
      het tijdvak waarover aangifte wordt gedaan overgebrachte goederen, alsmede per overbrenging:
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel3
  - number: 3.3.a
    text: |-
      de naam en het adres van de ondernemer dan wel het publiekrechtelijke lichaam, anders dan als ondernemer,
      waarnaartoe de goederen zijn overgebracht;
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel3
  - number: 3.3.b
    text: de soort, de hoeveelheid en de voor de belastingheffing van belang zijnde samenstelling van de goederen;
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel3
  - number: 3.3.c
    text: de datum waarop de overbrenging van de goederen is aangevangen.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel3
  - number: '4'
    text: |-
      Het brengen, bedoeld in [artikel 3, vierde lid, onderdeel c, van de wet][ref1], van alcoholvrije dranken vanuit
      een inrichting naar een derde land wordt aangetoond met afdrukken van het uitvoergeleidedocument of de aangifte
      ten uitvoer alsmede van de bevestiging van uitgang, welke documenten zijn vereist op grond van de wettelijke
      bepalingen, bedoeld in [artikel 1:1, eerste en tweede lid, van de Algemene douanewet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005802
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0023746
        artikel: '1'
  - number: '5.1'
    text: |-
      Het vervoer van alcoholvrije dranken, bedoeld in [artikel 4, tweede lid, van de wet][ref1], naar een inrichting
      die voor dat soort goed als zodanig is aangewezen, naar een ondernemer of publiekrechtelijk lichaam, anders dan
      als ondernemer, naar een natuurlijke persoon die de goederen voor andere doeleinden dan voor persoonlijk verbruik
      betrekt in Nederland, naar een andere lidstaat via Nederland of naar een derde land dient te kunnen worden
      aangetoond met een bescheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel4
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005802
        artikel: '4'
  - number: '5.2'
    text: 'In het bescheid, bedoeld in het eerste lid, worden vermeld:'
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel5
  - number: 5.2.a
    text: de naam en het adres van degene van wie de goederen afkomstig zijn;
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel5
  - number: 5.2.b
    text: de naam en het adres van degene naar wie de goederen worden vervoerd;
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel5
  - number: 5.2.c
    text: de naam en het adres van degene die de goederen vervoert;
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel5
  - number: 5.2.d
    text: de soorten en de hoeveelheden van de goederen;
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel5
  - number: 5.2.e
    text: de datum waarop het vervoer van de goederen is aangevangen.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel5
  - number: '6'
    text: |-
      Voor de toepassing van [artikel 4, derde lid][ref1], van de wet wordt als het op incidentele basis aanwenden
      van een beperkte hoeveelheid alcoholvrije dranken aangemerkt die hoeveelheid die een bij ministeriële regeling
      vastgestelde hoeveelheid niet overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel4
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005802
        artikel: '4'
  - number: '7'
    text: |-
      De in [artikel 4, eerste lid][ref1], van de wet bedoelde personen of lichamen moeten hun administratie zodanig doen
      zijn dat daarin op overzichtelijke wijze alle voor de heffing van alcoholvrije dranken van belang zijnde gegevens
      zijn opgenomen. De administratie dient in ieder geval te bevatten de regelmatige aantekening van de vorenbedoelde
      goederen.


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel4
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005802
        artikel: '4'
  - number: '8.1'
    text: |-
      Het brengen, bedoeld in [artikel 5, derde lid, onderdelen a en d, van de wet][ref1], van alcoholvrije dranken
      vanuit een derde land of vanuit een plaats voor tijdelijke opslag naar een inrichting die voor dat soort
      goederen als zodanig is aangewezen, alsmede het brengen, bedoeld in artikel 5, derde lid, onderdeel c, van
      de wet, van alcoholvrije dranken die zijn geplaatst onder een EU-douaneregeling naar een inrichting die voor
      dat soort goederen als zodanig is aangewezen, dient bij het op grond van de wettelijke bepalingen, bedoeld in
      [artikel 1:1, eerste en tweede lid, van de Algemene douanewet][ref2], aangeven van die goederen tot plaatsing onder
      de douaneregeling «in het vrije verkeer brengen», te worden aangetoond met een vervoersopdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005802
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0023746
        artikel: '1'
  - number: '8.2'
    text: |-
      Op de vervoersopdracht, bedoeld in het eerste lid, is een verklaring gesteld van de vergunninghouder van de
      inrichting waarnaartoe de alcoholvrije dranken zullen worden overgebracht, dat die alcoholvrije dranken worden
      overgebracht naar zijn inrichting en in de administratie van zijn inrichting worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel8
  - number: '8.3'
    text: |-
      De in het eerste lid bedoelde goederen dienen binnen één maand na het tijdstip waarop de op grond van de wettelijke
      bepalingen, bedoeld in [artikel 1:1, eerste en tweede lid, van de Algemene douanewet][ref1], vereiste aangifte is
      gedaan hun bestemming te hebben bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: '8.4'
    text: |-
      De vervoersopdracht wordt opgemaakt door de vergunninghouder van de inrichting waarnaartoe de goederen worden
      overgebracht, dan wel in diens opdracht.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel8
  - number: '9'
    text: |-
      Het brengen, bedoeld in [artikel 5, derde lid, onderdeel a, van de wet][ref1], van alcoholvrije dranken
      vanuit een derde land naar een plaats voor tijdelijke opslag, het in Nederland plaatsen onder een EU-
      douaneregeling van vanuit een derde land binnengebrachte alcoholvrije dranken, bedoeld in artikel 5, derde
      lid, onderdeel b, van de wet, alsmede het onder ambtelijk toezicht vernietigen van alcoholvrije dranken die
      onder een EU-douaneregeling zijn geplaatst, bedoeld in artikel 5, derde lid, onderdeel e, van de wet, dient
      te geschieden met inachtneming van de formaliteiten die op grond van de wettelijke bepalingen, bedoeld in
      [artikel 1:1, eerste en tweede lid, van de Algemene douanewet][ref2], moeten worden vervuld.


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005802
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0023746
        artikel: '1'
  - number: '10.1'
    text: |-
      In de vervoersopdracht, bedoeld in de [artikelen 2][ref1] en [8][ref2], worden vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0005804#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005804#Artikel8
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005804
        artikel: '2'
        hoofdstuk: I
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005804
        artikel: '8'
        hoofdstuk: I
        afdeling: '2'
  - number: 10.1.a
    text: |-
      de naam en het adres van degene die de vervoersopdracht opmaakt dan wel van degene in wiens opdracht zij wordt
      opgemaakt;
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel10
  - number: 10.1.b
    text: de naam en het adres van degene die de goederen overbrengt;
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel10
  - number: 10.1.c
    text: |-
      de naam en het adres van de vergunninghouder van de inrichting waarnaartoe de goederen worden overgebracht en het
      adres van die inrichting;
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel10
  - number: 10.1.d
    text: de soort, de hoeveelheid en de voor de heffing van belang zijnde samenstelling van de goederen; en
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel10
  - number: 10.1.e
    text: de datum waarop de overbrenging van de goederen aanvangt.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel10
  - number: '10.2'
    text: De vervoersopdracht dient te zijn gedagtekend en ondertekend.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel10
  - number: '10.3'
    text: |-
      Indien een persoon als bedoeld in het eerste lid vergunninghouder is van een inrichting, wordt tevens het nummer
      van zijn vergunning vermeld.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel10
  - number: '10.4'
    text: |-
      Afschriften van de vervoersopdrachten worden door de vergunninghouder van de inrichting die de vervoersopdracht
      heeft opgemaakt of heeft doen opmaken op overzichtelijke wijze bij zijn administratie bewaard.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel10
  - number: '11.1'
    text: 'De vergunninghouder van een inrichting moet:'
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel11
  - number: 11.1.a
    text: |-
      de administratieve organisatie van de inrichting zodanig doen zijn dat zij een juiste en volledige vastlegging van
      de bedrijfshandelingen waarborgt; en
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel11
  - number: 11.1.b
    text: |-
      de administratie van de inrichting zodanig doen zijn dat daarin op overzichtelijke wijze de gegevens omtrent alle
      voor de heffing van belang zijnde bedrijfshandelingen zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel11
  - number: '11.2'
    text: |-
      De administratie van de vergunninghouder van de inrichting dient in ieder geval te bevatten de regelmatige
      aantekening van:
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel11
  - number: 11.2.a
    text: de uitgeslagen alcoholvrije dranken en de daarvoor uitgereikte facturen;
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel11
  - number: 11.2.b
    text: |-
      de vervoersopdrachten of, indien [artikel 2, vijfde lid][ref1], toepassing vindt, de overgebrachte alcoholvrije
      dranken met de daarbij behorende gegevens en de daarvoor uitgereikte facturen;


      [ref1]: https://wetten.overheid.nl/BWBR0005804#Artikel2
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005804
        artikel: '2'
        hoofdstuk: I
        afdeling: '2'
  - number: 11.2.c
    text: de uit Nederland betrokken alcoholvrije dranken;
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel11
  - number: 11.2.d
    text: de uit een andere lidstaat betrokken alcoholvrije dranken; en
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel11
  - number: 11.2.e
    text: de uit een derde land betrokken alcoholvrije dranken.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel11
  - number: '11.3'
    text: |-
      Met betrekking tot een inrichting waar alcoholvrije dranken worden vervaardigd, bevat de administratie, bedoeld
      in het eerste lid, onderdeel b, tevens de voor de heffing van belang zijnde gegevens omtrent de inkoop van
      grondstoffen en van halffabricaten, alsmede omtrent de vervaardiging van halffabricaten en van eindproducten.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel11
  - number: '12.1'
    text: |-
      Indien degene die om een vergunning voor een inrichting verzoekt naar het oordeel van de inspecteur niet volledig
      kan voldoen aan het bepaalde in [artikel 11, eerste lid][ref1], stelt de inspecteur voorwaarden met betrekking tot
      de locatie en de inrichting van de inrichting, alsmede met betrekking tot het stelsel van toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0005804#Artikel11
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005804
        artikel: '11'
        hoofdstuk: II
  - number: '12.2'
    text: |-
      De in het eerste lid bedoelde inrichting van een inrichting heeft mede betrekking op de daar aanwezige productie-,
      transport- en opslaginstallaties.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel12
  - number: '14.1'
    text: |-
      Vrijstelling van belasting ter zake van de uitslag en de invoer van alcoholvrije dranken die worden gebruikt als
      grondstof voor het vervaardigen van andere goederen dan alcoholvrije dranken wordt verleend indien degene die de
      desbetreffende alcoholvrije dranken betrekt in het bezit is van een vergunning van de inspecteur waaruit blijkt dat
      hij alcoholvrije dranken met vrijstelling mag betrekken met inachtneming van de in het tweede tot en met vierde lid
      opgenomen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel14
  - number: '14.2'
    text: |-
      Om de in het eerste lid bedoelde vergunning te kunnen verkrijgen dient de administratie van degene die om de
      vergunning verzoekt zodanig te zijn ingericht dat daarin op overzichtelijke wijze de gegevens omtrent alle voor de
      vrijstelling van belasting van belang zijnde bedrijfshandelingen zijn opgenomen. Daarin moeten in ieder geval de
      gegevens zijn opgenomen omtrent de betrokken alcoholvrije dranken en omtrent de daarvan vervaardigde alcoholvrije
      dranken dan wel andere goederen.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel14
  - number: '14.3'
    text: |-
      Degene die de alcoholvrije dranken met vrijstelling betrekt dient zekerheid te stellen voor de
      belasting die hij verschuldigd kan worden. De [artikelen 56, zesde tot en met negende lid][ref1], en
      [57 tot en met 60 van de Wet op de accijns][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel57
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '56'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '57'
  - number: '14.4'
    text: |-
      Met betrekking tot het brengen van alcoholvrije dranken vanuit een inrichting, een derde land, een andere lidstaat,
      een douane-entrepot of een plaats voor tijdelijke opslag naar degene die de goederen met vrijstelling betrekt, zijn
      de [artikelen 2][ref1], [5][ref2], [8][ref3] en [10][ref4] van overeenkomstige toepassing, met dien verstande
      dat het nummer van de vergunning van degene die de alcoholvrije dranken met vrijstelling mag betrekken dient te
      worden vermeld op de vervoersopdracht of het bescheid, dan wel dient te worden opgenomen in de administratie van
      de inrichting van waaruit de alcoholvrije dranken worden overgebracht met overeenkomstige toepassing van artikel 2,
      zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005804#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005804#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005804#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0005804#Artikel10
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005804
        artikel: '2'
        hoofdstuk: I
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005804
        artikel: '5'
        hoofdstuk: I
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005804
        artikel: '8'
        hoofdstuk: I
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005804
        artikel: '10'
        hoofdstuk: I
        afdeling: '2'
  - number: '15'
    text: |-
      Vrijstelling van belasting ter zake van de uitslag of de invoer van alcoholvrije dranken die worden gebruikt aan
      boord van schepen in het verkeer van Nederland naar een andere lidstaat, anders dan over de binnenwateren, wordt
      verleend indien:
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel15
  - number: 15.a
    text: |-
      de eigenaar of exploitant van het schip of zijn vertegenwoordiger aan boord van het schip verklaart dat de aan hem
      te leveren alcoholvrije dranken worden gebruikt voor het in de aanhef bedoelde gebruik;
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel15
  - number: 15.b
    text: |-
      de verklaring in tweevoud geschiedt met gebruikmaking van een door de vergunninghouder van de inrichting opgesteld
      bescheid in geval van uitslag of met gebruikmaking van een door degene die de levering verricht opgesteld bescheid
      in geval van invoer;
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel15
  - number: 15.c
    text: |-
      de eigenaar of exploitant van het schip of zijn vertegenwoordiger aan boord van het schip beide exemplaren van de
      verklaring ondertekent; en
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel15
  - number: 15.d
    text: |-
      een exemplaar op overzichtelijke wijze wordt bewaard bij de administratie van de vergunninghouder van de inrichting
      in geval van uitslag en bij de administratie van degene die de aangifte tot plaatsing onder de douaneregeling
      brengen in het vrije verkeer doet, in geval van invoer. Het andere exemplaar wordt op overzichtelijke wijze bewaard
      bij de administratie aan boord van het schip.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel15
  - number: '16'
    text: |-
      Vrijstelling van belasting ter zake van de uitslag of de invoer van alcoholvrije dranken die worden gebruikt aan
      boord van luchtvaartuigen in het verkeer van Nederland naar een andere lidstaat wordt verleend indien:
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel16
  - number: 16.a
    text: |-
      de eigenaar of exploitant van het luchtvaartuig of zijn vertegenwoordiger aan boord van het luchtvaartuig verklaart
      dat de aan hem te leveren alcoholvrije dranken worden gebruikt voor het in de aanhef bedoelde gebruik;
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel16
  - number: 16.b
    text: |-
      de verklaring in tweevoud geschiedt met gebruikmaking van een door de vergunninghouder van de inrichting opgesteld
      bescheid in geval van uitslag of met gebruikmaking van een door degene die de levering verricht opgesteld bescheid
      in geval van invoer;
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel16
  - number: 16.c
    text: |-
      de eigenaar of exploitant van het luchtvaartuig of zijn vertegenwoordiger aan boord van het luchtvaartuig beide
      exemplaren van de verklaring ondertekent; en
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel16
  - number: 16.d
    text: |-
      een exemplaar op overzichtelijke wijze wordt bewaard bij de administratie van de vergunninghouder van de inrichting
      in geval van uitslag en bij de administratie van degene die de aangifte tot plaatsing onder de douaneregeling
      brengen in het vrije verkeer doet, in geval van invoer. Het andere exemplaar wordt op overzichtelijke wijze bewaard
      bij de administratie van de eigenaar of exploitant van het luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel16
  - number: '17.1'
    text: |-
      Vrijstelling van belasting ter zake van de uitslag en de invoer van alcoholvrije dranken die worden gebruikt voor
      onderzoek, kwaliteitscontroles en smaaktesten buiten een inrichting wordt verleend indien de vergunninghouder van
      de inrichting van waaruit de alcoholvrije dranken worden uitgeslagen dan wel degene die de goederen invoert, in het
      bezit is van een vergunning van de inspecteur waaruit blijkt dat hij de desbetreffende goederen met vrijstelling
      mag uitslaan dan wel invoeren.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel17
  - number: '17.2'
    text: 'De vergunning wordt op verzoek verleend. In het verzoek om de vergunning worden vermeld:'
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel17
  - number: 17.2.a
    text: de soort, de hoeveelheid en de voor de heffing van belang zijnde samenstelling van de alcoholvrije dranken;
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel17
  - number: 17.2.b
    text: de naam en het adres van de plaats waar de alcoholvrije dranken zullen worden onderzocht, gecontroleerd of getest;
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel17
  - number: 17.2.c
    text: de aard en het doel van het onderzoek, de controle of de test; en
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel17
  - number: 17.2.d
    text: de bestemming van de eventueel resterende alcoholvrije dranken na afloop van het onderzoek, de controle of de test.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel17
  - number: '17.3'
    text: |-
      Bij het verzoek om de vergunning moet de schriftelijke opdracht voor de in het eerste lid bedoelde onderzoeken,
      controles of testen worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel17
  - number: '17.4'
    text: |-
      De vergunning kan worden verleend voor een bepaalde periode of voor periodiek wederkerende onderzoeken, controles
      of testen. De in het tweede lid bedoelde opdrachten dienen alsdan afzonderlijk per onderzoek, controle of test uit
      de administratie te blijken.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel17
  - number: '17.5'
    text: |-
      De alcoholvrije dranken die na afloop van de in het eerste lid bedoelde onderzoeken, controles of testen resteren
      moeten na de onderzoeken, controles of testen worden overgebracht naar een inrichting, worden uitgevoerd of onder
      ambtelijk toezicht worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel17
  - number: '18'
    text: |-
      Voor de toepassing van de teruggaaf van belasting voor alcoholvrije dranken in gevallen waarin deze goederen op de
      voet van [artikel 29 van de wet][ref1] zouden kunnen worden betrokken met vrijstelling, is [artikel 14][ref2] van
      overeenkomstige toepassing met uitzondering van het bepaalde in het derde en het vierde lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0005804#Artikel14
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005802
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0005804
        artikel: '14'
        hoofdstuk: III
        afdeling: '1'
  - number: '19'
    text: |-
      Teruggaaf van belasting waarvoor op de voet van [artikel 30 van de wet][ref1] aanspraak op een vrijstelling zou
      bestaan, wordt verleend indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel30
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005802
        artikel: '30'
  - number: 19.a
    text: |-
      degene die om teruggaaf verzoekt in zijn administratie een verklaring opneemt van de eigenaar of exploitant van het
      schip of luchtvaartuig of zijn vertegenwoordiger aan boord van het schip of luchtvaartuig dat de goederen worden
      gebruikt voor het in [artikel 30 van de wet][ref1] bedoelde gebruik;


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel30
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005802
        artikel: '30'
  - number: 19.b
    text: |-
      de verklaring in tweevoud geschiedt met gebruikmaking van een door degene die de levering heeft verricht opgesteld
      bescheid;
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel19
  - number: 19.c
    text: |-
      de eigenaar of exploitant van het schip of luchtvaartuig of zijn vertegenwoordiger aan boord van het schip of
      luchtvaartuig beide exemplaren van de verklaring ondertekent; en
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel19
  - number: 19.d
    text: |-
      een exemplaar van de verklaring op overzichtelijke wijze wordt bewaard bij de administratie aan boord van het schip
      of bij de administratie van de eigenaar of exploitant van het luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel19
  - number: '20.1'
    text: |-
      Teruggaaf van belasting voor alcoholvrije dranken die zijn verloren gegaan, wordt verleend indien de goederen tot
      een bedrijfsvoorraad behoren en de belanghebbende onverwijld nadat is geconstateerd dat de goederen zijn verloren
      gegaan daarvan melding doet bij de inspecteur.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel20
  - number: '20.2'
    text: |-
      De soort, de hoeveelheid en de voor de berekening van de teruggaaf van belang zijnde samenstelling van de
      alcoholvrije dranken die zijn verloren gegaan, alsmede het tijdstip waarop en de oorzaak waardoor de goederen
      verloren zijn gegaan, dienen door de belanghebbende te worden aangetoond.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel20
  - number: '20.3'
    text: |-
      Teruggaaf wordt uitsluitend verleend indien het verloren gaan van de alcoholvrije dranken is te wijten aan
      overmacht of ongeval.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel20
  - number: '21'
    text: |-
      Voor de toepassing van teruggaaf van belasting voor onder ambtelijk toezicht vernietigde alcoholvrije dranken is
      [artikel 20, eerste en tweede lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005804#Artikel20
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005804
        artikel: '20'
        hoofdstuk: III
        afdeling: '2'
  - number: '22'
    text: |-
      Teruggaaf van belasting voor alcoholvrije dranken die zijn gebracht naar een derde land of zijn
      geplaatst onder een EU-douaneregeling met als bestemming een derde land, wordt verleend indien in
      de administratie van degene die verzoekt om teruggaaf van belasting elektronische of afgedrukte
      exemplaren zijn opgenomen van het uitvoergeleidedocument of de aangifte ten uitvoer alsmede van de
      bevestiging van uitgang, welke documenten zijn vereist op grond van de wettelijke bepalingen, bedoeld in
      [artikel 1:1, eerste en tweede lid, van de Algemene douanewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: '23'
    text: |-
      Teruggaaf van belasting voor alcoholvrije dranken die zijn gebracht binnen een inrichting die voor dat soort goed
      als zodanig is aangewezen, wordt verleend aan de vergunninghouder van de inrichting waarnaartoe de goederen zijn
      overgebracht wanneer hij om teruggaaf verzoekt en uit de administratie blijkt dat de goederen in zijn inrichting
      zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel23
  - number: '24'
    text: |-
      Voor de toepassing van de teruggaaf van belasting voor alcoholvrije dranken die door een ondernemer zijn
      overgebracht naar een ondernemer dan wel een publiekrechtelijk lichaam, anders dan als ondernemer, in een andere
      lidstaat, dient belanghebbende aan de hand van boeken en bescheiden aan te tonen dat de goederen hun bestemming
      hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel24
  - number: '25'
    text: |-
      Bij een verzoek om teruggaaf binnen drie maanden na een tariefwijziging van de belasting wordt teruggaaf ingevolge
      deze afdeling bij een tariefverhoging naar het daarvóór geldende tarief en bij een tariefverlaging naar het dan
      geldende tarief verleend, tenzij de belanghebbende aantoont dat de belasting waarvan teruggaaf wordt gevraagd, is
      voldaan naar het na de tariefverhoging geldende onderscheidenlijk vóór de tariefverlaging gegolden hebbende hogere
      tarief.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel25
  - number: '26.1'
    text: |-
      Voor een verzoek om teruggaaf van belasting wordt gebruikgemaakt van een van rijkswege beschikbaar gesteld
      elektronisch formulier dat via elektronische weg wordt ingediend op de op dat formulier aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel26
  - number: '26.2'
    text: |-
      De inspecteur kan ontheffing verlenen voor het gebruik van het van rijkswege beschikbaar gestelde elektronische
      formulier, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel26
  - number: '26.3'
    text: |-
      Tenzij anders bepaald wordt een verzoek om teruggaaf van belasting ingediend bij de inspecteur uiterlijk drie
      maanden na afloop van het kalenderkwartaal waarin het recht op teruggaaf is ontstaan.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel26
  - number: '26.4'
    text: |-
      Degene die verzoekt om teruggaaf van belasting neemt in zijn administratie de aankoopfacturen van de desbetreffende
      alcoholvrije dranken op alsmede alle andere bescheiden die in verband met het verzoek om teruggaaf zijn vereist.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel26
  - number: '26.5'
    text: |-
      De administratie van degene die verzoekt om teruggaaf van belasting is voorts zodanig ingericht, dat daarin op
      overzichtelijke wijze alle van belang zijnde gegevens zijn opgenomen voor de beoordeling van het bedrag van de
      teruggaaf.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel26
  - number: '27.1'
    text: |-
      Van alcoholvrije dranken die worden vervoerd dan wel voorhanden zijn buiten een inrichting of een douane-entrepot,
      moet aan de hand van bescheiden de herkomst kunnen worden aangetoond.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel27
  - number: '27.2'
    text: |-
      Het bescheid dat wordt gebruikt om de herkomst aan te tonen van alcoholvrije dranken die worden vervoerd, mag niet
      ouder zijn dan zes dagen, tenzij wordt aangetoond dat het vervoer langer dan zes dagen geleden is aangevangen.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel27
  - number: '27.3'
    text: |-
      Het eerste lid is niet van toepassing met betrekking tot alcoholvrije dranken die bij anderen dan ondernemers als
      bedoeld in [artikel 7 van de Wet op de omzetbelasting 1968][ref1], of publiekrechtelijke lichamen, anders dan als
      ondernemer, voorhanden zijn of door hen worden vervoerd voor eigen verbruik voor zover die producten zich bevinden
      in de gebruikelijke kleinhandelsverpakkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel7
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '7'
  - number: '28'
    text: |-
      Met betrekking tot het verlenen, het aanpassen en het intrekken van op grond van dit besluit te verlenen
      vergunningen zijn de [artikelen 45 tot en met 50 van de Wet op de accijns][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel45
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '45'
  - number: '29'
    text: |-
      In een publiek douane-entrepot type II als bedoeld in artikel 1, drieëndertigste lid, van de Gedelegeerde
      Verordening Douanewetboek van de Unie, of een particulier douane-entrepot als bedoeld in artikel 240, tweede
      lid, van het Douanewetboek van de Unie mogen alcoholvrije dranken met de douanestatus van Uniegoederen als
      bedoeld in artikel 5, drieëntwintigste lid, van het Douanewetboek van de Unie voorhanden zijn die voor uitvoer
      zijn vrijgegeven en die in afwachting van het verlaten van de Unie worden opgeslagen in een douane-entrepot, met
      toepassing van artikel 237, derde lid, van het Douanewetboek van de Unie, in samenhang met artikel 177 van de
      Gedelegeerde Verordening Douanewetboek van de Unie.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel29
  - number: '30.1'
    text: |-
      De opslagruimte van een particulier douane-entrepot als bedoeld in artikel 240, tweede lid, van het Douanewetboek
      van de Unie kan voor de opslag van alcoholvrije dranken als inrichting worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel30
  - number: '30.2'
    text: |-
      Uit de administratie van de vergunninghouder voor de inrichting en voor een douane-entrepot als bedoeld in het
      eerste lid, blijkt op overzichtelijke wijze welke goederen in de inrichting zijn opgeslagen en welke in het douane-
      entrepot.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel30
  - number: '30.3'
    text: |-
      Met betrekking tot plaatsen waarvoor een vergunning als bedoeld in het eerste lid is verleend, wordt onder het in
      [artikel 5, derde lid, onderdeel c, van de wet][ref1] bedoelde brengen van alcoholvrije dranken die zijn geplaatst
      onder een EU-douaneregeling vanuit het douane-entrepot naar een inrichting die voor dat soort goederen als zodanig
      is aangewezen, mede verstaan het in de administratie overboeken van de goederen van het douane-entrepot naar de
      inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel5
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005802
        artikel: '5'
  - number: '30.4'
    text: Voor de in het derde lid bedoelde overbrengingen is geen vervoersopdracht vereist.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel30
  - number: '30.5'
    text: |-
      Op verzoek kunnen alcoholvrije dranken worden aangemerkt als voorhanden te zijn in plaatsen waarvoor een in het
      eerste lid bedoelde vergunning is verleend indien zij in de administratie van de inrichting dan wel van het douane-
      entrepot zijn opgenomen. In afwijking in zoverre van [artikel 2, derde lid][ref1], worden de vervoersopdrachten
      alsdan voorzien van de verklaring dat de goederen in de administratie zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005804#Artikel2
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005804
        artikel: '2'
        hoofdstuk: I
        afdeling: '2'
  - number: '32'
    text: 'Strafbare feiten zijn:'
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel32
