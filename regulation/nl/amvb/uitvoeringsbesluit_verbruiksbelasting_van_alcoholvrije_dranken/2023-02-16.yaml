  - number: 32.b
    text: het overigens in strijd met dit besluit vervoeren of voorhanden hebben van alcoholvrije dranken.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel32
  - number: '33'
    text: Dit besluit treedt in werking met ingang van 1 januari 1993.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel33
  - number: '34'
    text: Dit besluit kan worden aangehaald als Uitvoeringsbesluit verbruiksbelasting van alcoholvrije dranken.
    url: https://wetten.overheid.nl/BWBR0005804/2023-02-16#Artikel34
