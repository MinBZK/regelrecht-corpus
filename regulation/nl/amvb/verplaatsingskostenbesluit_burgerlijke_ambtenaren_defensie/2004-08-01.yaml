  - number: '14'
    text: |-
      1 Dit artikel is van toepassing voor zover [artikel 13][ref1] geen toepassing heeft gevonden.

      2 De ambtenaar die geen opdracht heeft om te verhuizen, heeft aanspraak op een tegemoetkoming in de kosten voor
      het dagelijks reizen tussen de woning en de plaats van tewerkstelling, indien de te reizen afstand meer dan 10
      kilometer bedraagt.

      3 De ambtenaar die opdracht van het bevoegde gezag heeft gekregen naar of naar de nabijheid van de standplaats
      te verhuizen en daarin, ondanks alle pogingen daartoe niet slaagt, heeft aanspraak op een tegemoetkoming in de
      kosten voor het dagelijks reizen tussen de woning en de plaats van tewerkstelling, zolang hij bij de verhuizing
      in aanmerking zou kunnen komen voor een tegemoetkoming in de verhuiskosten en de te reizen afstand meer dan 10
      kilometer bedraagt.

      4 Een ambtenaar, bedoeld in het derde lid, die naar het oordeel van het bevoegde gezag niet dagelijks heen en weer
      kan reizen, heeft, tenzij van overheidswege al dan niet tegen betaling in huisvesting wordt voorzien, aanspraak
      op een tegemoetkoming in de pensionkosten voor verblijf in een pension in of nabij de standplaats, benevens een
      tegemoetkoming voor ten hoogste één maal per week in de reiskosten voor gezinsbezoek, dan wel voor reiskosten
      naar de plaats waar hij metterwoon nog gevestigd is. Indien de ambtenaar er niet in slaagt om een pension in de
      standplaats te betrekken en hij zich naar het oordeel van het bevoegde gezag daartoe voldoende inspanningen heeft
      getroost, heeft hij tevens aanspraak op een tegemoetkoming in de kosten voor het dagelijks reizen tussen het
      pension nabij de standplaats en de plaats van tewerkstelling.

      5 Indien een ambtenaar als bedoeld in het derde en vierde lid, naar het oordeel van het bevoegde gezag, niet alles
      wat redelijkerwijs van hem mag worden verwacht heeft gedaan om zo spoedig mogelijk te verhuizen, komt hij niet
      langer in aanmerking voor de tegemoetkomingen, bedoeld in het derde en vierde lid.

      6 Een ambtenaar die een functie voor betrekkelijk korte duur bekleedt of voor betrekkelijk korte duur elders is
      geplaatst en als gevolg daarvan niet behoeft te verhuizen kan in afwijking van het tweede lid een tegemoetkoming in
      de reiskosten, als bedoeld in het derde lid, worden verleend, dan wel een tegemoetkoming overeenkomstig het vierde
      lid, indien de ambtenaar, naar het oordeel van het bevoegde gezag, niet dagelijks heen en weer kan reizen.

      7 De ambtenaar die in verband met een verplaatsing opdracht van het bevoegde gezag heeft gekregen om naar of naar
      de nabijheid van de toekomstige standplaats te verhuizen en die voor de datum van verplaatsing verhuist, heeft tot
      een maximumtermijn van drie maanden aanspraak op een tegemoetkoming in de kosten voor het reizen tussen de nieuwe
      woning en de plaats van tewerkstelling, bedoeld in het derde lid, dan wel op de tegemoetkoming, bedoeld in het
      vierde lid.

      8 De tegemoetkomingen, bedoeld in dit artikel, worden vastgesteld volgens nader door Onze Minister te stellen
      regels.

      9 Onze Minister is bevoegd om ten behoeve van de ambtenaar voor wie de plaats van tewerkstelling buiten Nederland
      is gelegen, regels vast te stellen, die afwijken van de in het achtste lid bedoelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0006039#Artikel13
