    text: |-
      De tegemoetkoming in verhuiskosten, bedoeld in [artikel 3, vierde lid][ref1], wordt vastgesteld volgens nader door
      Onze Minister vast te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0006039#Artikel3
