  - number: '15'
    text: |-
      1 Onze Minister kan, ter uitvoering van een vervoerplan als bedoeld in [artikel 13, eerste lid][ref1],
      de aanspraak op een tegemoetkoming in de kosten voor het reizen, bedoeld in
      [artikel 14, tweede, derde, vierde, zesde en zevende lid][ref2], beperken tot één of meer van de volgende
      situaties:

      a. er wordt te zamen met één of meer andere ambtenaren dan wel niet-ambtenaren gebruik gemaakt van een
      motorvoertuig;

      b. er wordt gebruik gemaakt van openbare middelen van vervoer;

      c. er wordt gebruik gemaakt van een fiets.

      2 Onze Minister kan bepalen dat de aanspraak op een tegemoetkoming in de kosten voor het reizen door een ambtenaar
      als bedoeld in [artikel 14, tweede, derde, vierde, zesde en zevende lid][ref3], niet bestaat voor zover er gebruik
      kan worden gemaakt van vervoer van overheidswege.


      [ref1]: https://wetten.overheid.nl/BWBR0006039#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0006039#Artikel14
