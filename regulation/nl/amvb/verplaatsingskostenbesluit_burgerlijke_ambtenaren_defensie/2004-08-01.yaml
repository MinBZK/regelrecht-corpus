articles:
  - number: '1'
    text: |-
      1 Naar de regels bij of krachtens dit besluit kan

      a. een tegemoetkoming worden verleend ter zake van uitgaven, gedaan in verband met een verhuizing dan wel in
      verband met het reizen naar en van de plaats van tewerkstelling, en een bedrag betaald ter compensatie van het
      ongemak van een verhuizing in verband met de verplaatsing van een functie;

      b. een voorziening worden getroffen voor het reizen naar en van de plaats van tewerkstelling;

      c. een bedrag in rekening worden gebracht voor in verband met het reizen naar en van de plaats van tewerkstelling
      getroffen voorzieningen.

      2 Indien uit anderen hoofde reeds in enigerlei vorm aanspraak bestaat op een tegemoetkoming voor de in het eerste
      lid bedoelde uitgaven, wordt de tegemoetkoming krachtens dit besluit slechts verleend tot het bedrag, waarmee deze
      tegemoetkoming de eerstbedoelde aanspraak overschrijdt.
    url: https://wetten.overheid.nl/BWBR0006039/2004-08-01#Artikel1
  - number: '2'
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. Onze Minister: Onze Minister van Defensie;

      b. bevoegde gezag: Onze Minister dan wel de bij ministeriële regeling aangewezen autoriteiten;

      c. ambtenaar: degene die bij het Ministerie van Defensie in burgerlijke openbare dienst is aangesteld;

      d. woonplaats: de gemeente of het bij name genoemde deel daarvan, waar de ambtenaar metterwoon is gevestigd;

      e. plaats van tewerkstelling: de gebruikelijke ingang van het gebouw, gebouwencomplex, terrein of vaartuig waar de
      ambtenaar gewoonlijk zijn werkzaamheden verricht, dan wel, indien de uitoefening van het ambt zich uitstrekt over
      een ambtsgebied, de door het bevoegde gezag aangewezen plaats;

      f. standplaats: de gemeente of het bij name genoemde deel van die gemeente, waar de plaats van tewerkstelling van
      de ambtenaar is gelegen, dan wel, indien de plaats van tewerkstelling een vaartuig is, de door het bevoegde gezag
      aangewezen plaats;

      g. gezinsleden: de echtgenote van de ambtenaar en de kinderen, stief- en pleegkinderen van hemzelf of van zijn
      echtgenote voor zover zij met hem samenwonen;

      h. eigen huishouding voeren: het zelfstandig bewonen van woonruimte, voorzien van eigen meubilair en stoffering,
      een en ander ter beoordeling van het bevoegde gezag;

      i. berekeningsbasis: het twaalfvoud van de bezoldiging – in de zin van het
      [Bezoldigingsbesluit burgerlijke ambtenaren defensie][ref1], dan wel hetgeen daarmede overeenkomt ingeval dat het
      bezoldigingsbesluit niet op hem van toepassing is – die de ambtenaar geniet op het berekeningstijdstip, vermeerderd
      met de aanspraak op de vakantieuitkering en in voorkomende gevallen verhoogd met:

      1°. een genoten wachtgeld of uitkering krachtens dan wel overeenkomstig
      het [Werkloosheidsbesluit defensiepersoneel][ref2], dan wel het
      [Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Defensie][ref3];

      2° een genoten uitkering krachtens dan wel overeenkomstig de Regeling uitkering functioneel leeftijdsontslag
      defensie, de [Wet uitkering wegens vrijwillig vervroegd uittreden](onbekend) of de Regeling flexibel pensioen en
      uittreden bedoeld in artikel 3, van de Centrale vut-overeenkomst overheids- en onderwijspersoneel en artikel 1.5
      van het Pensioenreglement van de Stichting Pensioenfonds ABP;

      3° een uitkering ingevolge de [Suppletieregeling gedeeltelijk arbeidsongeschikten sector Defensie][ref4];

      en bij verhuizing naar of in een gebied buiten Nederland mede vermeerderd met het twaalfvoud van de bij
      ministeriële regeling vast te stellen toelage ter zake van verblijf van de ambtenaar buiten Nederland.

      j. berekeningstijdstip:

      1°. de datum waarop de ambtenaar verhuist;

      2°. indien de ambtenaar verhuist voor de datum dat de functie feitelijk wordt vervuld, de datum van ingang van
      de functievervulling;

      3°. bij het overlijden of ontslag van de ambtenaar, de datum waarop laatstelijk bezoldiging werd genoten;

      k. verplaatsen en verplaatsing: veranderen onderscheidenlijk verandering van de standplaats van de ambtenaar in
      opdracht van het bevoegde gezag;

      l. voor het eerst in dienst treden: in dienst treden bij het Ministerie van Defensie of een van zijn diensten,
      bedrijven of instellingen, anders dan in geval van overgang binnen een maand:

      1°. van de ene naar de andere tak van rijksdienst;

      2°. van een andere overheidsdienst of een door het Rijk bekostigde onderwijsinstelling naar de rijksdienst;

      m. dienstwoning: de door het bevoegde gezag aan de ambtenaar in verband met de uitoefening van zijn functie
      aangewezen woning;

      n. echtgenote: degene die met de ambtenaar naar Nederlands recht is gehuwd, alsmede degene die met inachtneming van
      [artikel 4 van het Burgerlijk ambtenarenreglement defensie][ref5] mede onder dit begrip wordt verstaan;

      2 Voor de toepassing van dit besluit wordt met ambtenaar gelijkgesteld degene die door het bevoegde gezag als
      zodanig wordt aangemerkt in verband met werkzaamheden die hij in het belang van het Ministerie van Defensie of een
      van zijn diensten, bedrijven of instellingen verricht of heeft verricht.

      3 Voor de toepassing van het eerste lid, onderdeel *i*, wordt, indien de ambtenaar
      in het genot is van een toelage als bedoeld in de [artikelen 15][ref6], [17][ref7] en
      [18 van het Bezoldigingsbesluit burgerlijke ambtenaren defensie][ref8], dit bezoldigingsdeel vastgesteld op het
      bedrag dat de ambtenaar gedurende de drie kalendermaanden voorafgaande aan het berekeningstijdstip gemiddeld per
      maand aan deze toelagen heeft genoten.

      4 Dit besluit is niet van toepassing op de ambtenaar, bedoeld in
      [artikel 8a, eerste lid, van het Burgerlijk ambtenarenreglement defensie][ref9] die als gevolg van een
      functiewisseling in het kader van de mobiliteitsbevordering van standplaats verandert.


