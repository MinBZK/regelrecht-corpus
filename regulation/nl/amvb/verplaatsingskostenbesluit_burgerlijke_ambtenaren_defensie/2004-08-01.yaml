  - number: '17'
    text: |-
      1 Aan de ambtenaar die met zijn gezin ten gevolge van een verplaatsing naar een buiten Nederland gelegen gebied
      is verhuisd of terugkeert van een plaatsing in een in het buitenland gelegen gebied en die, als gevolg van het
      ontbreken van passende woonruimte, dan wel het nog niet beschikbaar zijn van zijn inboedel, voor bijzondere
      financiële lasten komt te staan, kan een tegemoetkoming worden verleend.

      2 De in het eerste lid bedoelde tegemoetkoming kan ook worden verleend ingeval de ambtenaar buiten Nederland blijft
      geplaatst, doch zijn gezin naar Nederland terugkeert.
    url: https://wetten.overheid.nl/BWBR0006039/2004-08-01#Artikel17
  - number: '18'
    text: |-
      Het bevoegde gezag kan ter zake van de in of krachtens dit besluit bedoelde tegemoetkomingen een voorschot
      verlenen.
    url: https://wetten.overheid.nl/BWBR0006039/2004-08-01#Artikel18
  - number: '19'
    text: |-
      1 Onze Minister kan voor zover nodig in afwijking van de bij of krachtens dit besluit gestelde regels beslissen in
      individuele gevallen, waarin deze regels naar zijn oordeel niet of niet naar redelijkheid voorzien.

      2 Onze Minister kan ten aanzien van een door hem aan te wijzen groep van ambtenaren in afwijking van de bij of
      krachtens dit besluit gestelde regels beslissen, indien bijzondere omstandigheden daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0006039/2004-08-01#Artikel19
  - number: '20'
    text: |-
      Van de bevoegdheid tot het vaststellen van ministeriële regelingen als bedoeld in [artikel 14][ref1] kan mandaat
      worden verleend aan de directeur-generaal personeel en materieel van het Ministerie van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0006039#Artikel14
