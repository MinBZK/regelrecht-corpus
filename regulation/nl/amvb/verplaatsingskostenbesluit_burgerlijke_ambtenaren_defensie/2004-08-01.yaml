  - number: '16'
    text: |-
      1 Onze Minister kan, ter uitvoering van een vervoerplan als bedoeld in [artikel 13, eerste lid][ref1], regels
      stellen krachtens welke voor de ambtenaar een tegemoetkoming in reiskosten wordt verstrekt die afwijkt van een
      krachtens [artikel 14][ref2] vastgestelde tegemoetkoming indien de ambtenaar voor het reizen tussen de woning en de
      plaats van tewerkstelling:

      a. gebruik maakt van een eigen motorvoertuig te zamen met één of meer anderen;

      b. meerijdt in een motorvoertuig van een ander.

      2 De tegemoetkoming in reiskosten wordt in de in het eerste lid, onderdeel *b*, bedoelde situatie slechts
      uitbetaald aan een ander dan de betrokken ambtenaar.

      3 Geen tegemoetkoming als bedoeld in het eerste lid kan worden vastgesteld voor ambtenaren die op 10 kilometer of
      minder van de plaats van tewerkstelling woonachtig zijn.

      4 De ambtenaar die voor het reizen tussen de woning en de plaats van tewerkstelling meerijdt met een ander ten
      behoeve waarvan een tegemoetkoming als bedoeld in het eerste lid wordt verstrekt, ontvangt geen tegemoetkoming in
      de reiskosten als bedoeld in [artikel 14][ref3].

      5 De maximale afstand tussen de woning en de plaats van tewerkstelling waarover een tegemoetkoming per afgelegde
      kilometer als bedoeld in het eerste lid kan worden berekend bedraagt:

      a. 25 kilometer voor de ambtenaar die geen opdracht van het bevoegde gezag heeft gekregen om te verhuizen;

      b. 60 kilometer voor de ambtenaar die opdracht heeft gekregen om naar of naar de nabijheid van de standplaats te
      verhuizen.

      6 De tegemoetkoming, bedoeld in het eerste lid, bedraagt per afgelegde kilometer ten hoogste het bedrag vastgesteld
      krachtens [artikel 15, tweede lid, onderdeel ][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006039#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0006039#Artikel14
