  - number: '10'
    text: |-
      1 Bij een verplaatsing uit, naar en buiten Nederland kan de tegemoetkoming in verhuiskosten naast de in
      [artikel 8, eerste lid][ref1], bedoelde bedragen slechts bestaan uit:

      a. een bedrag voor de kosten verbonden aan het vervoer van de ambtenaar en zijn gezinsleden naar de nieuwe woning
      en zonodig voor de overnachtingskosten;

      b. een bedrag voor de kosten van een of meer reizen van de ambtenaar en van de gezinsleden, welke in het land van
      vertrek zijn gemaakt ter voldoening aan een oproep tot het vervullen van formaliteiten, vereist in verband met
      de reis.

      2 Bij een verplaatsing als bedoeld in het eerste lid worden onder de transportkosten, bedoeld in
      [artikel 8, eerste lid, onderdeel ][ref2], mede verstaan:

      a. een bedrag voor de verschuldigde belastingen bij invoer voor de bagage en de inboedel;

      b. een bedrag voor de kosten van verzekering van de bagage en de inboedel tegen schade ten gevolge van of in
      verband met de verhuizing;

      c. een bedrag voor de kosten van het inpakken van de gehele inboedel alsmede de kosten van demontage en montage van
      meubilair en afvoer van emballage;

      d. voor zover geen emballage in natura wordt verstrekt, een bedrag voor de kosten van aanschaffing van emballage,
      zulks echter slechts onder beding dat de emballage na de verhuizing desgevorderd ter beschikking van het Ministerie
      van Defensie wordt gesteld.

      3 Onze Minister kan regels stellen ten aanzien van de berekening van de bedragen, bedoeld in de vorige leden.


      [ref1]: https://wetten.overheid.nl/BWBR0006039#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006039#Artikel8
