  - number: '8'
    text: |-
      1 De tegemoetkoming in verhuiskosten, bedoeld in [artikel 3, eerste, tweede en derde lid][ref1], alsmede in de
      [artikelen 4][ref2], [5][ref3] en [6][ref4] kan slechts bestaan uit:

      a. een bedrag voor de kosten van transport van de bagage en van de inboedel van de ambtenaar en zijn gezinsleden
      naar de nieuwe woning, waaronder begrepen de kosten van het in- en uitpakken van breekbare zaken;

      b. een bedrag voor dubbele woonkosten;

      c. een bedrag voor alle andere direct uit de verhuizing voortvloeiende kosten.

      Onze Minister stelt regels ten aanzien van de uitvoering van de onderdelen *a* en *b* van de vorige volzin, alsmede
      ten aanzien van de berekening van de daarin bedoelde bedragen.

      2 Indien de ambtenaar op de dag van de verhuizing een eigen huishouding voert, wordt het bedrag, bedoeld in
      het eerste lid, onderdeel *c*, voor zover bij of krachtens dit artikel niet anders is bepaald, gesteld op een
      tegemoetkoming van 3% van de berekeningsbasis voor ieder woon- of slaapvertrek, tot een maximum van 4 van deze
      vertrekken, die de achtergelaten woning telt, met dien verstande dat het bedrag een nader door Onze Minister vast
      te stellen bedrag niet mag overschrijden.

      3 Indien het betreft een verhuizing van een gezin, waarin de echtgenoten beiden ambtenaar zijn in de zin van dit
      besluit en afzonderlijk de opdracht hebben om te verhuizen of zijn verplaatst, wordt de tegemoetkoming berekend
      over de gezamenlijke berekeningsbasis.

      4 Indien de ambtenaar geen eigen huishouding voert, wordt geen tegemoetkoming als bedoeld in het eerste lid,
      onderdeel *c*, verleend. Indien bijzondere omstandigheden daartoe aanleiding geven, kan voor deze kosten niettemin
      een tegemoetkoming worden verleend van 3% van de berekeningsbasis.

      5 Indien aan de ambtenaar door het bevoegde gezag tevoren is medegedeeld dat de verplaatsing van tijdelijke aard
      is, bestaat slechts aanspraak op de vergoeding van transportkosten van de bagage. Voorts kan, indien bijzondere
      omstandigheden daartoe aanleiding geven een tegemoetkoming, bedoeld in het eerste lid, onderdeel *c*, worden
      verleend van 3% van de berekeningsbasis.

      6 De ambtenaar, bedoeld in [artikel 3][ref5], die voor het eerst in dienst treedt, kan slechts in aanmerking worden
      gebracht voor een tegemoetkoming in verhuiskosten gelijk aan de helft van de tegemoetkoming, die op grond van dit
      artikel zou zijn toegekend.


