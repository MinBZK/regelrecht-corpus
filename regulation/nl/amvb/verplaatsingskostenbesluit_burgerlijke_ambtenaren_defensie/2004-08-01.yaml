  - number: '12'
    text: |-
      Bij een verplaatsing naar een land buiten Europa alsmede Kreta of IJsland en terug kan - indien de tewerkstelling
      aldaar naar verwachting tenminste een jaar zal duren - de tegemoetkoming in verhuiskosten mede bestaan uit een
      tegemoetkoming in de kosten van het transport over zee van een aan de ambtenaar in eigendom behorende personenauto
      volgens nader door Onze Minister vast te stellen regels.
    url: https://wetten.overheid.nl/BWBR0006039/2004-08-01#Artikel12
  - number: '13'
    text: |-
      1 Het bevoegde gezag kan ter uitvoering van een vervoerplan, dat voorziet in een vermindering van de mobiliteit, in
      het bijzonder waar dit het individueel autogebruik betreft, voor het dagelijks reizen tussen de woning en de plaats
      van tewerkstelling een openbaar vervoerbewijs dan wel een openbaar vervoer vastrechtkaart verstrekken of anderszins
      vervoer organiseren (vervoer van overheidswege).

      2 Het bevoegde gezag kan de ambtenaar aan wie een openbaar vervoerbewijs of een openbaar vervoer vastrechtkaart
      is verstrekt alsmede de ambtenaar die gebruik maakt van anderszins georganiseerd vervoer daarvoor een bedrag in
      rekening brengen.

      3 Het bedrag, bedoeld in het tweede lid, wordt vastgesteld volgens nader door Onze Minister vast te stellen regels.
    url: https://wetten.overheid.nl/BWBR0006039/2004-08-01#Artikel13
  - number: 13a
    text: |-
      1 De ambtenaar, wiens functie in het kader van de verplaatsing van zijn dienstonderdeel over een aanmerkelijke
      afstand is verplaatst en die als gevolg daarvan is verhuisd, ter zake waarvan hij aanspraak heeft op een
      tegemoetkoming in verhuiskosten als bedoeld in [artikel 3, eerste of tweede lid][ref1], wordt met inachtneming van
      door Onze Minister te stellen regels een eenmalige functieverplaatsingstoelage en een tegemoetkoming in huurkosten
      dan wel in de rentekosten voor een hypotheek verleend.

      2 In de gevallen waarin de ambtenaar en zijn echtgenote beiden aanspraak hebben op de toelage en
      tegemoetkoming, genoemd in het eerste lid, ontvangt elke ambtenaar de helft van de in het eerste lid genoemde
      functieverplaatsingstoelage en huur- of rentetegemoetkoming.

      3 De ambtenaar, bedoeld in het eerste lid, aan wie binnen twee jaren na de verhuizing ontslag op verzoek wordt
      verleend of die ten gevolge van aan hem te wijten feiten of omstandigheden binnen twee jaren na de verhuizing wordt
      ontslagen, dient de hem toegekende functieverplaatsingstoelage en tegemoetkoming in huur- of rentekosten terug
      te betalen. Overgang binnen een maand naar een andere functie binnen de rijksdienst wordt niet als een ontslag op
      verzoek beschouwd.

      4 De in het eerste lid genoemde functieverplaatsingstoelagen en tegemoetkoming in huur- of rentekosten wordt aan
      de ambtenaar die in verband met een verplaatsing van zijn functie dient te verhuizen, slechts verleend, indien
      de ambtenaar schriftelijk heeft verklaard dat een verplichting tot terugbetalen als bedoeld in het derde lid hem
      bekend is.

      5 In geval van overlijden van de ambtenaar, bedoeld in het eerste lid, komt de aanspraak op de in het eerste lid
      bedoelde functieverplaatsingstoelage en tegemoetkoming in huur- of rentekosten toe aan zijn nagelaten gezinsleden.

      6 De ambtenaar wordt geen functieverplaatsingstoelage en geen tegemoetkoming in huur- of rentekosten ingevolge het
      eerste lid verleend, indien de verhuizing niet heeft plaatsgevonden binnen twee jaren na zijn functieverplaatsing.


      [ref1]: https://wetten.overheid.nl/BWBR0006039#Artikel3
    url: https://wetten.overheid.nl/BWBR0006039/2004-08-01#Artikel13a
