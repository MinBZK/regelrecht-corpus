  - number: '11'
    text: |-
      Indien bij een verplaatsing uit, naar en buiten Nederland de door Onze Minister vastgestelde regels niet toelaten,
      dat de ambtenaar zijn gezinsleden op rijkskosten meeneemt, bestaat slechts aanspraak op vergoeding van:

      a. transportkosten van de bagage van de ambtenaar zelf;

      b. kosten, bedoeld in [artikel 10, eerste en tweede lid][ref1], voor zover deze betrekking hebben op de ambtenaar
      zelf. Voorts kan, indien bijzondere omstandigheden daartoe aanleiding geven, een tegemoetkoming als bedoeld in
      [artikel 8, eerste lid, onderdeel ][ref2], worden verleend van 3% van de berekeningsbasis.


      [ref1]: https://wetten.overheid.nl/BWBR0006039#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0006039#Artikel8
