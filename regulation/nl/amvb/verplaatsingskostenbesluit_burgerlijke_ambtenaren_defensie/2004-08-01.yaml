  - number: '3'
    text: |-
      1 De ambtenaar die in verband met een verplaatsing of indiensttreding in opdracht van het bevoegde gezag is
      verhuisd en een woning in de standplaats heeft betrokken, wordt een tegemoetkoming in de verhuiskosten verleend.

      2 De ambtenaar die in verband met een verplaatsing of indiensttreding in opdracht van het bevoegde gezag is
      verhuisd en een woning buiten de standplaats heeft betrokken, wordt een tegemoetkoming in de verhuiskosten
      verleend, indien het bevoegde gezag vooraf heeft vastgesteld dat met de verhuizing aan de opdracht om naar de
      nabijheid van de standplaats te verhuizen wordt voldaan.

      3 De ambtenaar die, zonder dat daartoe opdracht is verleend door het bevoegde gezag, in verband met een
      verplaatsing is verhuisd, wordt een tegemoetkoming in de verhuiskosten verleend, indien hij zich binnen een
      afstand van 25 kilometer van de standplaats heeft gevestigd en de afstand tussen de oude woning en de plaats van
      tewerkstelling ten minste 50 kilometer bedroeg.

      4 Onverminderd het derde lid wordt aan de ambtenaar die, zonder dat daartoe opdracht is verleend door het bevoegde
      gezag, is verhuisd een tegemoetkoming in verhuiskosten verleend indien hij zich met de verhuizing binnen een
      afstand van 10 kilometer van zijn plaats van tewerkstelling heeft gevestigd.

      5 De ambtenaar die in verband met een indiensttreding is verhuisd en aan wie binnen twee jaar na de verhuizing
      ontslag op aanvraag wordt verleend of die ten gevolge van aan hem te wijten feiten of omstandigheden binnen
      twee jaren na de verhuizing wordt ontslagen, dient de hem op grond van het eerste of tweede lid toegekende
      tegemoetkoming in verhuiskosten terug te betalen. Overgang binnen een maand naar een andere functie binnen de
      rijksdienst wordt niet als een ontslag op aanvraag beschouwd, tenzij de ambtenaar als gevolg van die overgang
      opnieuw moet verhuizen met aanspraak op tegemoetkoming in verhuiskosten.

      6 De ambtenaar aan wie in verband met een verhuizing op grond van het vierde lid een tegemoetkoming in
      verhuiskosten is toegekend, dient deze tegemoetkoming terug te betalen indien hem binnen drie jaren na
      de verhuizing ontslag op aanvraag wordt verleend of indien hij tengevolge van aan hem te wijten feiten of
      omstandigheden binnen drie jaren na de verhuizing wordt ontslagen dan wel indien hij, anders dan in opdracht van
      het bevoegde gezag, binnen drie jaren na de verhuizing wederom verhuist en zich daardoor op een afstand van 10
      kilometer of meer van de plaats van tewerkstelling vestigt. Overgang binnen een maand naar een andere functie
      binnen de rijksdienst wordt niet als een ontslag op aanvraag beschouwd, tenzij de ambtenaar als gevolg van die
      overgang moet verhuizen met aanspraak op een tegemoetkoming in verhuiskosten.

      7 De tegemoetkoming in verhuiskosten wordt aan de ambtenaar die in verband met een indiensttreding dient te
      verhuizen slechts verleend, indien hij schriftelijk heeft verklaard dat een verplichting tot terugbetalen als
      bedoeld in het vijfde lid hem bekend is.

      8 De tegemoetkoming in verhuiskosten wordt aan de ambtenaar, bedoeld in het vierde lid, slechts verleend, indien
      hij schriftelijk heeft verklaard dat een verplichting tot terugbetalen als bedoeld in het zesde lid hem bekend is.

      9 Het vijfde en zevende lid zijn van overeenkomstige toepassing op de ambtenaar, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0006039/2004-08-01#Artikel3
  - number: '4'
    text: |-
      1 De ambtenaar die in opdracht van het bevoegde gezag, anders dan in verband met een verplaatsing of
      indiensttreding, een dienstwoning betrekt of verlaat, wordt een tegemoetkoming in verhuiskosten verleend.

      2 Indien het verlaten van een dienstwoning samenhangt met een ontslag op aanvraag anders dan een ontslag op
      aanvraag met recht op uitkering voor vervroegd uittreden, of met een ontslag als gevolg van aan de ambtenaar te
      wijten feiten of omstandigheden en het ontslag niet ingaat binnen twee jaren nadat de dienstwoning is betrokken,
      kan een gedeeltelijke tegemoetkoming in verhuiskosten worden verleend.

      3 Indien het verlaten van een dienstwoning verband houdt met het overlijden van de ambtenaar, wordt een
      tegemoetkoming in verhuiskosten verleend aan de nagelaten gezinsleden.
    url: https://wetten.overheid.nl/BWBR0006039/2004-08-01#Artikel4
  - number: '5'
    text: |-
      1 Een tegemoetkoming in verhuiskosten kan slechts worden verleend bij een vrijwillige verandering van de woonplaats
      binnen Nederland, verband houdende met:

      a. een ontslag, ter zake waarvan de ambtenaar recht heeft op dadelijk ingaand pensioen, dan wel op
      een uitkering ingevolge de [Wet uitkering wegens vrijwillig vervroegd uittreden](onbekend) of het
      [Besluit uitkering wegens functioneel leeftijdsontslag burgerlijke ambtenaren defensie][ref1];

      b. een ontslag dat de ambtenaar anders dan op eigen aanvraag is verleend en niet het gevolg is van aan hem te
      wijten feiten of omstandigheden;

      c. het overlijden van de ambtenaar.

      2 Een tegemoetkoming als bedoeld in het eerste lid wordt slechts verleend, indien de ambtenaar in een periode
      van minder dan tien jaar voorafgaande aan het beëindigen van het dienstverband is verhuisd ten gevolge van een
      verplaatsing en het bevoegde gezag een verhuizing van het gezin naar de oude woonomgeving noodzakelijk acht. Het
      bevoegde gezag wint daarbij een bedrijfsmaatschappelijk advies in.


      [ref1]: https://wetten.overheid.nl/BWBR0006041
    url: https://wetten.overheid.nl/BWBR0006039/2004-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006041
  - number: '6'
    text: |-
      1 De ambtenaar aan wie tijdens zijn plaatsing buiten Nederland ontslag op aanvraag wordt verleend met recht op
      een uitkering ingevolge de Wet uitkering wegens vrijwillig vervroegd uittreden dan wel die anders dan op eigen
      aanvraag en niet wegens aan hem te wijten feiten of omstandigheden wordt ontslagen, wordt een tegemoetkoming in de
      verhuiskosten voor terugkeer naar Nederland verleend.

      2 De ambtenaar aan wie tijdens zijn plaatsing buiten Nederland ontslag op aanvraag wordt verleend, anders dan
      ontslag op aanvraag als bedoeld in het eerste lid, of die niet op aanvraag wordt ontslagen als gevolg van aan hem
      te wijten feiten of omstandigheden, wordt volgens nader door Onze Minister te stellen regels een gedeeltelijke
      tegemoetkoming in verhuiskosten verleend voor terugkeer naar Nederland.

      3 Indien de ambtenaar tijdens zijn plaatsing buiten Nederland overlijdt, wordt een tegemoetkoming in verhuiskosten
      aan de nagelaten gezinsleden verleend voor terugkeer naar Nederland.
    url: https://wetten.overheid.nl/BWBR0006039/2004-08-01#Artikel6
  - number: '7'
    text: |-
      Geen tegemoetkoming in verhuiskosten ingevolge [artikel 3, eerste, tweede, of derde lid][ref1], of de
      [artikelen 5][ref2] dan wel [6][ref3] wordt verleend, indien de verhuizing niet heeft plaatsgevonden binnen twee
      jaren nadat de verplichting tot verhuizen is opgelegd dan wel na de datum van het ontslag, het overlijden of de
      verplaatsing.


      [ref1]: https://wetten.overheid.nl/BWBR0006039#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006039#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0006039#Artikel6
