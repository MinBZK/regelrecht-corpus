preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Onderwijs, Cultuur en Wetenschappen, T. Netelenbos, van 14 januari
    1998, nr. 1998/2147 (3708), directie Wetgeving en Juridische Zaken;

    Gelet op artikel 9, vijfde lid, van de Wet op het basisonderwijs;

    De Raad van State gehoord (advies van 24 april 1998, nr. WO5.98.0017);

    Gezien het nader rapport van de Staatssecretaris van Onderwijs, Cultuur en Wetenschappen, T. Netelenbos, van 29 mei
    1998, nr. 1998/20853 (3708), directie Wetgeving en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009666/1998-10-16#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      De kerndoelen voor de onderwijsactiviteiten, genoemd in
      [artikel 9, eerste tot en met vierde lid, van de Wet op het basisonderwijs][ref1] worden vastgesteld als aangegeven
      in de bij dit besluit behorende bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel9
    url: https://wetten.overheid.nl/BWBR0009666/1998-10-16#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '9'
  - number: '1.2'
    text: |-
      Voor de school geldt de eis dat zij tenminste de kerndoelen bij haar onderwijsactiviteiten als aan het eind van
      het basisonderwijs te bereiken doelstellingen hanteert. Kerndoelen geven een beschrijving van kwaliteiten van
      leerlingen op het gebied van kennis, inzicht en vaardigheden.
    url: https://wetten.overheid.nl/BWBR0009666/1998-10-16#Artikel1
  - number: '2'
    text: |-
      De in de [bijlage bij het Besluit kerndoelen basisonderwijs](onbekend) opgenomen kerndoelen kunnen door het bevoegd
      gezag van een school voor basisonderwijs uiterlijk tot 1 augustus 2001 worden gehanteerd voor leerlingen die op 31
      juli 1998 reeds basisonderwijs volgen.
    url: https://wetten.overheid.nl/BWBR0009666/1998-10-16#Artikel2
  - number: '3.1'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0009666/1998-10-16#Artikel3
  - number: '3.2'
    text: |-
      Het besluit, bedoeld in het eerste lid, wordt aan de beide Kamers der Staten-Generaal overgelegd. Het koninklijk
      besluit, bedoeld in het eerste lid, wordt niet genomen dan nadat 4 weken na de overlegging zijn verstreken en
      gedurende die termijn niet door of namens een van beide Kamers der Staten-Generaal de wens wordt te kennen gegeven
      dat het in dit besluit geregelde onderwerp bij de wet wordt geregeld.
    url: https://wetten.overheid.nl/BWBR0009666/1998-10-16#Artikel3
  - number: '3.3'
    text: Het Besluit kerndoelen basisonderwijs wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009666/1998-10-16#Artikel3
  - number: '3.4'
    text: |-
      Indien de citeertitel van het in het derde lid genoemde besluit is gewijzigd in Besluit kerndoelen primair
      onderwijs 1998, wordt laatstgenoemd besluit ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009666/1998-10-16#Artikel3
  - number: '4'
    text: 'Dit besluit wordt aangehaald als: Besluit kerndoelen primair onderwijs 1998.'
    url: https://wetten.overheid.nl/BWBR0009666/1998-10-16#Artikel4
