        artikel: '13'
  - number: 5.2.1.a
    text: artikel I;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel5.2
  - number: 5.2.1.b
    text: de in [artikel II vermelde artikelen 1 en 18](onbekend);
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel5.2
  - number: 5.2.1.c
    text: |-
      de in [artikel III vermelde artikelen 1 tot en met 22, 24, 26 en 30, met uitzondering van artikel 10, tweede lid,
      artikel 19, derde lid, artikel 21, tweede lid, en artikel 24, tweede lid](onbekend).
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel5.2
  - number: 5.2.2
    text: |-
