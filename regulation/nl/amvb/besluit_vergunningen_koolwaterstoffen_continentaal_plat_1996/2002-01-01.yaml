        bwb_id: BWBR0007962
        hoofdstuk: '4'
  - number: '6.1'
    text: |-
      Het koninklijk besluit van 6 februari 1976, houdende uitvoering van artikel 12 van de Mijnwet continentaal plat
      ten aanzien van opsporings- en winningsvergunningen voor of mede voor aardolie of aardgas (*Stb*. 102) wordt
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel6.1
  - number: '6.3'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel6.3
  - number: '6.4'
    text: 'Dit besluit wordt aangehaald als: Besluit vergunningen koolwaterstoffen continentaal plat 1996.'
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel6.4
