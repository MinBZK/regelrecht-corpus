      weergegeven door het Internationaal Energie Agentschap in zijn publikatie «Energy prices and taxes» over het
      betrokken jaar lager is dan US $ 23 per vat, geldt, in afwijking in zoverre van het derde lid, bij een jaarlijkse
      afvoer van niet meer dan 800 miljoen m3 als cijnspercentage: 0.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.7
  - number: 3.8.1
    text: |-
      Voor zover het aardgas is verkocht, geldt voor de toepassing van de [artikelen 3.7][ref1], [3.10][ref2] en
      [3.11][ref3] als waarde van iedere verkochte hoeveelheid aardgas de verkoopprijs, verminderd – voor zover deze voor
      rekening van de verkoper komen – met:


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007962#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007962#Artikel3
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.8.1.a
    text: de kosten van de winning,
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.8
  - number: 3.8.1.b
    text: |-
      de kosten van behandeling en opslag binnen het continentaal plat, alsmede in de aan de Noordzee gelegen landen
      binnen een strook van 40 km breedte langs de kust van de Noordzee,
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.8
  - number: 3.8.1.c
    text: |-
      de kosten van vervoer tot de kust van een aan de Noordzee gelegen land, alsmede in een strook van 40 km breedte
      langs de kust van de Noordzee, en
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.8
  - number: 3.8.1.d
    text: de rechten en belastingen, ter zake van de invoer en levering van het aardgas door enige staat geheven.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.8
  - number: 3.8.2
    text: |-
      Voor zover het aardgas niet is verkocht, geldt voor de toepassing van de [artikelen 3.7][ref1], [3.10][ref2] en
      [3.11][ref3] als waarde van het aardgas de waarde, welke wordt verkregen door de door Onze Minister krachtens
      [artikel 3.26][ref4] goedgekeurde verrekenprijs te verminderen op overeenkomstige wijze als in het eerste lid,
      onder a tot en met d aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007962#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007962#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0007962#Artikel3
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '3.9'
    text: |-
      Binnen drie maanden na het einde van een kalenderjaar zendt de vergunninghouder aan Onze Minister een opgave
      – overeenkomstig een door Onze Minister vastgesteld model – van de hoeveelheden aardgas bij een druk van 1
      atmosfeer en een temperatuur van 0 °C, die met gebruikmaking van de vergunning zijn gewonnen en in dat jaar uit
      het vergunningsgebied zijn afgevoerd onderscheidenlijk verkocht, van de verkoopprijs of de verrekenprijs van
      dat aardgas, van de in [artikel 3.8, eerste lid, onder ][ref1], bedoelde bedragen, die op de verkoopprijs in
      mindering kunnen worden gebracht, alsmede van het bedrag van de cijns, die hij naar zijn oordeel op grond daarvan
      verschuldigd zal zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel3
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '3.10'
    text: |-
      Het op grond van een ingezonden opgave ingevolge [artikel 3.4][ref1] of [3.7][ref2] te betalen bedrag is
      verschuldigd nadat na het einde van het betrokken kalenderjaar drie maanden zijn verlopen.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007962#Artikel3
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '3.11'
    text: Onze Minister stelt nadien het verschuldigde bedrag definitief vast.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.11
  - number: '3.12'
    text: |-
      Het definitief als verschuldigd vastgestelde bedrag is – onder aftrek van het reeds betaalde – verschuldigd met
      ingang van de dag na die, waarop aan de vergunninghouder het bedrag is bekendgemaakt. Indien reeds meer is betaald
      dan het definitief vastgestelde bedrag wordt het verschil zo spoedig mogelijk terugbetaald.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.12
  - number: 3.13.1
    text: |-
      De vergunninghouder is jaarlijks aan de staat een bedrag als bedoeld in artikel 11, eerste lid, onder  verschuldigd
      van 70% van het voordelige saldo van een met inachtneming van de [artikelen 3.14][ref1] en [3.15][ref2] over het
      afgelopen boekjaar op te maken resultatenrekening, welke omvat de volgens goed koopmansgebruik aan dat jaar toe te
      rekenen kosten en opbrengsten van het krachtens de vergunning instellen van verkennings- en opsporingsonderzoeken
      en winnen van delfstoffen. In afwijking van de eerste volzin kan de afschrijving van aanschaffings- of
      voortbrengingskosten van bedrijfsmiddelen willekeurig geschieden, voor zover die wijze van afschrijven in het kader
      van de belastingheffing is toegestaan op grond van artikel 10, derde lid, van de Wet op de inkomstenbelasting 1964.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007962#Artikel3
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.13.2
    text: |-
      Indien het overeenkomstig het eerste lid vastgestelde bedrag lager is dan het bedrag, dat wordt
      verkregen door bij de toepassing van dat lid in plaats van 70% te lezen 50% en het bepaalde in
      [artikel 3.14, tweede lid, onder ][ref1], buiten beschouwing te laten, is in plaats van het eerstbedoelde bedrag
      het laatstbedoelde verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel3
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.13.3
    text: |-
      Een boekjaar als in het eerste lid bedoeld, is een kalenderjaar. Onze Minister kan een andere termijn als zodanig
      boekjaar aanwijzen.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.13
  - number: 3.14.1
    text: |-
      Bij het opmaken van een resultatenrekening als bedoeld in [artikel 3.13][ref1] worden in het credit daarvan
      gebracht:


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel3
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.14.1.a
    text: de opbrengst van de krachtens de vergunning gewonnen delfstoffen;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.14
  - number: 3.14.1.b
    text: |-
      de opbrengst van verkochte produktiemiddelen dan wel de waarde in het economisch verkeer van aan het bedrijf
      onttrokken produktiemiddelen, een en ander voor zover zij de aanschaffingswaarde, vermeerderd met de kosten
      van verbetering en verminderd met de tot de datum van verkoop ten laste van een resultatenrekening gebrachte
      afschrijvingen, te boven gaan, echter onder aftrek van bedragen, die uit deze opbrengst dan wel waarde tot
      afschrijving op andere, ter vervanging dienende produktiemiddelen strekken;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.14
  - number: 3.14.1.c
    text: |-
      andere met of door het verrichten van verkennings- en opsporingsonderzoeken en de winning verkregen voordelen zoals
      vergoedingen voor ter beschikking gestelde kennis en diensten dan wel de waarde in het economisch verkeer van aan
      het bedrijf onttrokken kennis en diensten.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.14
  - number: 3.14.2
    text: |-
      Bij het opmaken van een resultatenrekening als bedoeld in [artikel 3.13][ref1] worden in het debet daarvan
      gebracht:


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel3
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.14.2.a
    text: |-
      de kosten van het binnen het vergunningsgebied instellen van verkennings- en opsporingsonderzoeken, gemaakt na de
      dag, waarop de vergunning van kracht is geworden, en de kosten van het winnen en afleveren van delfstoffen, een en
      ander zowel wat de directe als de naar redelijkheid vast te stellen indirecte en algemene kosten betreft;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.14
  - number: 3.14.2.b
    text: |-
      de kosten van andere verkennings- en opsporingsonderzoeken dan onder *a* bedoeld, gemaakt na de dag,
      waarop de vergunning van kracht is geworden, met uitzondering van die kosten, welke reeds ten laste van
      een andere resultatenrekening zijn gebracht of zijn gemaakt in een gebied, waarvoor een opsporings- of
      winningsvergunning van kracht is, die is verleend vóór 1 januari 1976, of een op een later tijdstip op
      grond van [artikel 13, eerste lid, van de wet][ref1] in vervolg op zodanige opsporingsvergunning verleende
      winningsvergunning;


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel13
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0002504
        artikel: '13'
  - number: 3.14.2.c
    text: |-
      afschrijvingen op de niet reeds ten laste van een andere resultatenrekening gebrachte kosten van verkennings- en
      opsporingsonderzoeken, welke zijn gemaakt vóór de dag, waarop de vergunning van kracht is geworden, voor zover die
      kosten geen betrekking hebben op een gebied als onder *b* bedoeld;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.14
  - number: 3.14.2.d
    text: |-
      afschrijvingen op de aanschaffings- of voortbrengingskosten van alle duurzame produktiemiddelen, voor zover die
      kosten geen betrekking hebben op een gebied als onder *b* bedoeld;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.14
  - number: 3.14.2.e
    text: |-
      de door de vergunninghouder aan de staat verschuldigde belastingen en andere Nederlandse publiekrechtelijke lasten
      voor zover deze als bedrijfslasten van de onder *a* tot en met *c* bedoelde activiteiten zijn te beschouwen, met
      uitzondering van de belastingen en lasten, welke reeds ten laste van een andere resultatenrekening zijn gebracht,
      de naar inkomen, winst of vermogen geheven belastingen en hun voorheffingen, alsmede van de ingevolge de vergunning
      verschuldigde bedragen, berekend naar met de winning behaalde winst;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.14
  - number: 3.14.2.f
    text: een bedrag van 20% der kosten, bedoeld onder *a* tot en met *c*;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.14
  - number: 3.14.2.g
    text: een bedrag van 70% der kosten, bedoeld onder *d*.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.14
  - number: 3.14.3
    text: 'Voor de toepassing van het eerste lid gelden als opbrengsten of voordelen:'
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.14
  - number: 3.14.3.a
    text: |-
      mede de waarde van anders dan door verkoop aan het winningsbedrijf onttrokken delfstoffen, zomede de naar goed
      koopmansgebruik gewaardeerde verschillen tussen begin- en eindvoorraden;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.14
  - number: 3.14.3.b
    text: |-
      mede de bedragen, welke ten goede komen aan een vennootschap als bedoeld in [artikel 11, tweede lid, onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel11
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0002504
        artikel: '11'
  - number: 3.14.3.c
    text: niet de waarde van in het winningsbedrijf gewonnen en verbruikte delfstoffen;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.14
  - number: 3.14.3.d
    text: |-
      niet de bedragen, welke de vergunninghouder van een vennootschap als bedoeld in
      [artikel 11, tweede lid, onder ][ref1] heeft ontvangen als houder van aandelen of van winstbewijzen van die
      vennootschap.


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel11
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0002504
        artikel: '11'
  - number: 3.14.4
    text: |-
      Voor zover de gewonnen koolwaterstoffen anders dan door verkoop aan het winningsbedrijf zijn onttrokken, geldt voor
      de bepaling van de in het eerste lid, onder *a*, bedoelde opbrengst als waarde van de koolwaterstoffen de door Onze
      Minister krachtens [artikel 3.26][ref1] goedgekeurde verrekenprijs.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel3
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.14.5
    text: 'Voor de toepassing van het tweede lid gelden als kosten:'
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.14
  - number: 3.14.5.a
    text: |-
      mede de kosten, welke voor rekening komen van een vennootschap als bedoeld in
      [artikel 11, tweede lid, onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel11
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0002504
        artikel: '11'
  - number: 3.14.5.b
    text: |-
      niet de bedragen, betaald voor kennis, verkregen uit verkennings- of opsporingsonderzoeken of het winnen van
      delfstoffen, welke door derden zijn verricht, voor zover niet aannemelijk wordt gemaakt, dat deze kennis is
      verworven ten behoeve van activiteiten als in het tweede lid, onder *a* tot en met *c* bedoeld, en deze bedragen
      nog niet ten laste van een andere resultatenrekening zijn gebracht;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.14
  - number: 3.14.5.c
    text: |-
      niet de rente over eigen vermogen van de vergunninghouder en over vermogen, dat vóór de verlening van de vergunning
      is verschaft door ondernemingen, die tot dezelfde groep behoren, alsmede de rente over het eigen vermogen van een
      vennootschap als bedoeld in [artikel 11, tweede lid, onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel11
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0002504
        artikel: '11'
  - number: 3.14.5.d
    text: niet de waarde van in het winningsbedrijf gewonnen en verbruikte delfstoffen;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.14
  - number: 3.14.5.e
    text: |-
      niet uitgaven, waarvan niet aannemelijk is, dat zij zijn gedaan ter verkrijging van de in [artikel 3.13][ref1]
      bedoelde opbrengsten.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel3
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.14.6
    text: |-
      Kosten of opbrengsten, welke blijken niet te zijn opgenomen in de vastgestelde resultatenrekening over het jaar,
      waarop zij betrekking hebben, worden opgenomen in de resultatenrekening over het jaar, waarin van die kosten
      onderscheidenlijk die opbrengsten is gebleken.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.14
  - number: 3.15.1
    text: |-
      Indien een resultatenrekening over enig boekjaar – het bepaalde in [artikel 3.14, tweede lid, onder ][ref1],
      buiten beschouwing gelaten – een nadelig saldo aanwijst, wordt dit naar het debet van de resultatenrekening van het
      volgend boekjaar overgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel3
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.15.2
    text: |-
      Een samengevoegde resultatenrekening kan worden opgemaakt indien de vergunninghouder tevens houder is van één of
      meer andere winningsvergunningen die zijn verleend met inachtneming van dit besluit of het koninklijk besluit van
      6 februari 1976, houdende uitvoering van artikel 12 van de Mijnwet continentaal plat ten aanzien van opsporings- en
      winningsvergunningen voor of mede voor aardolie of aardgas (*Stb*. 102).
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.15
  - number: 3.16.1
    text: |-
      Voor de toepassing van de [artikelen 3.17][ref1], [3.18][ref2] en [3.20][ref3] wordt onder belasting verstaan
      de vennootschapsbelasting, onderscheidenlijk de inkomstenbelasting, die over het betrokken boekjaar van de
      vergunninghouder is geheven krachtens de [Wet op de Vennootschapsbelasting 1969][ref4], onderscheidenlijk de Wet op
      de inkomstenbelasting 1964, dan wel enige andere wettelijke belastingregeling, die voor genoemd besluit of genoemde
      wetten in de plaats zal treden, naar winst, die met activiteiten als in [artikel 3.14, tweede lid, onder ][ref5],
      bedoeld, is behaald, met dien verstande dat nimmer meer wordt verrekend dan de naar het voor dat jaar geldende
      tarief berekende vennootschapsbelasting bij een belastbaar bedrag, enkel bestaande uit hetgeen aan zodanige winst
      is verkregen. Met over zodanige winst geheven belasting wordt gelijkgesteld de belasting, die achterwege blijft
      ten gevolge van door de belastingplichtige uit anderen hoofde in enig jaar geleden verliezen. Als over zodanige
      winst geheven belasting wordt daarentegen niet beschouwd de belasting, die is geheven ten gevolge van door de
      belastingplichtige uit anderen hoofde in enig jaar behaalde winsten.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007962#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007962#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0002672
      [ref5]: https://wetten.overheid.nl/BWBR0007962#Artikel3
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0002672
      - id: ref5
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.16.2
    text: |-
      Indien de winning plaatsvindt voor rekening van een vennootschap als bedoeld in
      [artikel 11, tweede lid, onder ][ref1], wordt voor de toepassing van het eerste lid als van de vergunninghouder
      geheven vennootschapsbelasting mede in aanmerking genomen de vennootschapsbelasting die over het betrokken boekjaar
      van die vennootschap is geheven naar winst, die met activiteiten als in [artikel 3.14, tweede lid, onder ][ref2],
      bedoeld is behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0007962#Artikel3
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0002504
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.17.1
    text: |-
      De vergunninghouder is telkens met ingang van het tijdstip, waarop zes maanden na het begin van een boekjaar
      zijn verstreken, aan de staat als eerste vooruitbetaling een door Onze Minister en Onze Minister van Financiën
      vastgesteld bedrag verschuldigd.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.17
  - number: 3.17.2
    text: |-
      Genoemde Ministers stellen zodanig bedrag vast op de helft van het bedrag, dat naar hun redelijke schatting op
      grond van [artikel 3.13][ref1], over het betrokken boekjaar verschuldigd zal zijn, verminderd met de helft van de
      belasting, welke naar hun redelijke schatting over dat boekjaar zal worden geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel3
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.18.1
    text: |-
      De vergunninghouder is telkens met ingang van het tijdstip, waarop een maand na het einde van een boekjaar
      is verstreken, aan de staat als tweede vooruitbetaling een door Onze Minister en Onze Minister van Financiën
      vastgesteld bedrag verschuldigd.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.18
  - number: 3.18.2
    text: |-
      Genoemde Ministers stellen zodanig bedrag vast op het volle bedrag, dat naar hun redelijke schatting op grond van
      [artikel 3.13][ref1], over het betrokken boekjaar verschuldigd zal zijn, verminderd – voor zover mogelijk –:


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel3
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.18.2.a
    text: met de belasting, welke naar hun redelijke schatting over dat boekjaar zal worden geheven;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.18
  - number: 3.18.2.b
    text: met vervolgens het bedrag, dat de vergunninghouder over dat boekjaar als eerste vooruitbetaling heeft betaald.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.18
  - number: 3.18.3
    text: |-
      De eerste vooruitbetaling wordt, voor zover de in het tweede lid, onder *b*, bedoelde vermindering niet mogelijk
      is, zo spoedig mogelijk terugbetaald.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.18
  - number: '3.19'
    text: |-
      De vergunninghouder is verplicht binnen zes maanden na het einde van een boekjaar aan Onze Minister en Onze
      Minister van Financiën te zenden een over dat boekjaar opgemaakte resultatenrekening als in [artikel 3.13][ref1]
      bedoeld alsmede een balans, vermeldende de aan het einde van het boekjaar tot het winningsbedrijf behorende activa
      en passiva.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel3
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.20.1
    text: |-
      Onze Minister en Onze Minister van Financiën stellen na ontvangst van de resultatenrekening deze zo spoedig
      mogelijk vast.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.20
  - number: 3.20.2
    text: |-
      Zij stellen tegelijkertijd vast het ingevolge [artikel 3.13][ref1] verschuldigde bedrag, verminderd – voor zover
      mogelijk –:


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel3
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.20
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.20.2.a
    text: met de belasting, welke de vergunninghouder over het betrokken boekjaar per saldo heeft betaald;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.20
  - number: 3.20.2.b
    text: |-
      met vervolgens de bedragen, die de vergunninghouder als eerste en als tweede vooruitbetaling – indien
      [artikel 3.18, derde lid][ref1], toepassing heeft gevonden, per saldo – heeft betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel3
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.20
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.21.1
    text: |-
      De vergunninghouder is het krachtens [artikel 3.20, tweede lid][ref1], vastgestelde bedrag verschuldigd met ingang
      van de dag na die, waarop dat bedrag aan hem is bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel3
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.21
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.21.2
    text: |-
      De eerste en de tweede vooruitbetaling worden voor zover de in [artikel 3.20, tweede lid, onder ][ref1], bedoelde
      vermindering niet mogelijk is, zo spoedig mogelijk terugbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel3
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.21
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.22.1
    text: |-
      Indien na de betalingen of teruggaven van belasting, welke bij de toepassing van [artikel 3.20, tweede lid][ref1],
      reeds in aanmerking zijn genomen, nog betalingen of teruggaven van belasting over het betrokken boekjaar hebben
      plaatsgehad, herzien Onze Minister en Onze Minister van Financiën dienovereenkomstig het krachtens die bepaling
      vastgestelde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel3
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.22.2
    text: Hetgeen blijkens zodanige herziening te veel is betaald, wordt zo spoedig mogelijk terugbetaald.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.22
  - number: 3.22.3
    text: |-
      De vergunninghouder is hetgeen blijkens zodanige herziening te weinig is betaald, verschuldigd met ingang van de
      dag na die, waarop die herziening aan hem is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.22
  - number: '3.23'
    text: |-
      Indien en voor zover twijfel bestaat of de vergunninghouder zal voldoen aan hetgeen hij verschuldigd zal worden
      ingevolge [artikel 3.13, eerste lid][ref1], kan Onze Minister bepalen dat de vergunninghouder met ingang van
      een door Onze Minister vast te stellen tijdstip en ten genoegen van Onze Minister zekerheid stelt en gesteld zal
      houden. Dit voorschrift blijft van kracht totdat aan de betalingsverplichting is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel3
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '3.24'
    text: |-
      De vergunninghouder is verplicht op een door Onze Minister vast te stellen tijdstip en ten genoegen van
      Onze Minister zekerheid te stellen en gesteld te houden voor de nakoming van hetgeen hij verschuldigd zal
      worden, ingeval Onze Minister, op grond van [artikel 30 van de wet][ref1], de nodige maatregelen treft ter
      verwijdering van een niet meer in gebruik zijnde mijnbouwinstallatie. Dit voorschrift blijft van kracht totdat de
      mijnbouwinstallatie is verwijderd.


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel30
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.24
    references:
      - id: ref1
        bwb_id: BWBR0002504
        artikel: '30'
  - number: '3.25'
    text: |-
      De vergunninghouder is verplicht de ingevolge de vergunning verschuldigde bedragen te voldoen op door Onze Minister
      aan te geven wijze.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.25
  - number: '3.26'
    text: |-
      Het is de vergunninghouder verboden door hem met gebruikmaking van de vergunning gewonnen koolwaterstoffen te
      verkopen of anderszins aan het winningsbedrijf te onttrekken, indien de desbetreffende overeenkomst of, bij
      onttrekking anders dan in verband met verkoop, de jaarlijks uit het vergunningsgebied af te voeren hoeveelheden en
      de verrekenprijs niet door Onze Minister zijn goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.26
  - number: 3.27.1
    text: |-
      De vergunninghouder is verplicht volgens methoden, welke bij een modern en goed gevoerd winningsbedrijf algemeen
      gebruikelijk zijn, en met inachtneming van de door Onze Minister te geven aanwijzingen te meten en regelmatig in
      een register in te schrijven de hoeveelheden koolwaterstoffen, die hij met gebruikmaking van zijn vergunning heeft
      gewonnen alsmede die hij uit het vergunningsgebied heeft afgevoerd.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.27
  - number: 3.27.2
    text: |-
      Indien een inspectie-ambtenaar een onnauwkeurigheid in de meetapparatuur constateert, kan Onze Minister bepalen,
      dat deze onnauwkeurigheid geacht wordt te hebben bestaan gedurende 30 dagen voorafgaande aan het constateren
      daarvan of, indien binnen die 30 dagen een voorafgaande controle had plaatsgevonden, vanaf die voorafgaande
      controle. De vergunninghouder is in zodanig geval verplicht zijn registers dienovereenkomstig te corrigeren.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.27
  - number: 3.27.3
    text: |-
      De vergunninghouder is verplicht binnen 14 dagen na het einde van iedere kalendermaand en van ieder kalenderjaar
      aan Onze Minister en aan de Inspecteur-Generaal der Mijnen een uittreksel te zenden van de totalen der gedurende
      die maand onderscheidenlijk dat jaar verrichte boekingen in het in het eerste lid bedoelde register, in een door
      Onze Minister aan te geven vorm.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.27
  - number: '3.28'
    text: |-
      Overtreding van [artikel 2.6][ref1], [3.2][ref2], [3.3][ref3], [3.4][ref4], [3.6][ref5], [3.7][ref6], [3.9][ref7],
      [3.10][ref8], [3.12][ref9], [3.17][ref10], [3.18][ref11], [3.19][ref12], [3.21][ref13], [3.22][ref14],
      [3.25][ref15] of [3.26][ref16] is een grond voor het intrekken van de vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007962#Artikel3
