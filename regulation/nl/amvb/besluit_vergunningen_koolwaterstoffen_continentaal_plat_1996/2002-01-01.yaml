    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel2.6
  - number: '2.7'
    text: |-
      Overtreding van [artikel 2.2][ref1], [2.3][ref2], [2.4][ref3], [2.5][ref4] of [2.6][ref5] is een grond voor het
      intrekken van de vergunning.


