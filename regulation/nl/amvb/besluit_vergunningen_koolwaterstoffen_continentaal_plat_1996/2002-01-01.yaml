  - number: 4.11.1
    text: |-
      Indien de vergunninghouder buiten een reeds aangetoond voorkomen koolwaterstoffen in een economisch winbare
      hoeveelheid heeft aangetoond, is hij verplicht zijn medewerking te verlenen aan:
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.11
  - number: 4.11.1.a
    text: |-
      de oprichting met inachtneming van de [artikelen 4.3][ref1] en [4.4][ref2] van een naamloze vennootschap of
      besloten vennootschap met beperkte aansprakelijkheid voor het met gebruikmaking van de vergunning winnen van
      koolwaterstoffen, waarin de vergunninghouder voor 60% deelneemt en een door Onze Minister aangewezen naamloze
      vennootschap of besloten vennootschap met beperkte aansprakelijkheid, waarvan alle aandelen middellijk of
      onmiddellijk aan de staat toebehoren, voor 40% deelneemt, en


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007962#Artikel4
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.11.1.b
    text: |-
      de totstandkoming van een overeenkomst tussen de vergunninghouder en die op te richten vennootschap, krachtens
      welke de vergunninghouder de bedoelde koolwaterstoffen slechts voor rekening van die vennootschap zal winnen en
      welke in elk geval de in [artikel 4.6][ref1] bedoelde bepalingen behelst.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel4
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.11.2
    text: Het eerste lid geldt niet, indien de staat hierdoor naar redelijke schatting financieel nadeel zal lijden.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.11
  - number: 4.11.3
    text: |-
      Onze Minister beslist binnen zes maanden na de dag, waarop de vergunninghouder hem heeft aangetoond,
      koolwaterstoffen in een economisch winbare hoeveelheid te hebben aangetroffen, of de in het eerste lid bedoelde
      verplichting al dan niet geldt.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.11
  - number: 4.11.4
    text: |-
      De overeenkomst, bedoeld in het eerste lid, onder *b*, dient binnen een door Onze Minister vast te stellen termijn
      tot stand te komen en dient door Onze Minister te worden goedgekeurd. Het is verboden de in het eerste lid bedoelde
      koolwaterstoffen te winnen zolang de goedkeuring niet is verleend. De overeenkomst kan niet worden gewijzigd dan na
      goedkeuring door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.11
  - number: 4.12.1
    text: |-
      Indien de vergunninghouder in het vergunningsgebied buiten een reeds aangetoond voorkomen koolwaterstoffen heeft
      aangetroffen, is hij verplicht daarvan onverwijld mededeling te doen aan Onze Minister, aan de Inspecteur-Generaal
      der Mijnen en aan de Directeur van de Rijks Geologische Dienst.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.12
  - number: 4.12.2
    text: |-
      De vergunninghouder dient de delfstoffen aan te tonen ten overstaan en ten genoegen van de Inspecteur-Generaal der
      Mijnen of van een door hem aangewezen ambtenaar.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.12
  - number: 4.13.1
    text: |-
      Overtreding van [artikel 4.5][ref1], [4.7][ref2], [4.8][ref3], [4.11][ref4] of [4.12][ref5] is een grond voor het
      intrekken van de vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007962#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0007962#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0007962#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0007962#Artikel4
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.13.2
    text: |-
      De vergunning kan niet worden ingetrokken wegens overtreding van [artikel 4.7][ref1] nadat
      is beslist dat geen verzet wordt aangetekend tegen het betrokken besluit dan wel de ingevolge
      [artikel 4.8, tweede, derde of vijfde lid][ref2], geldende termijn is verstreken zonder dat verzet is aangetekend.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007962#Artikel4
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.14.1
    text: |-
      Op verzoek wordt toegestaan dat, naast de in [artikel 4.2, eerste lid, onder ][ref1], of de in
      [artikel 4.11, eerste lid, onder ][ref2], bedoelde overeenkomst, tussen de vennootschap, de vergunninghouder en
      de andere aandeelhouder in de vennootschap wordt overeengekomen dat de vennootschap de winning zal doen verrichten
      voor rekening van de aandeelhouders.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007962#Artikel4
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.14
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.14.2
    text: |-
      De in het eerste lid laatstbedoelde overeenkomst dient binnen een door Onze Minister vast te stellen termijn tot
      stand te komen en dient door Onze Minister te worden goedgekeurd. Het is verboden te winnen zolang de goedkeuring
      niet is verleend. De overeenkomst kan niet worden gewijzigd dan na goedkeuring door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.14
  - number: 4.14.3
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid, wordt de winningsvergunning verleend met het voorschrift,
      bedoeld in [artikel 4.15][ref1], in plaats van het voorschrift, bedoeld in [artikel 4.6][ref2], alsmede met het
      voorschrift, bedoeld in de [artikelen 4.16][ref3] en [4.17][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007962#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0007962#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0007962#Artikel4
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.14
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 4.14.4
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid, wordt het bepaalde in [artikel 4.4, eerste en derde lid][ref1],
      niet opgenomen in de oprichtingsakte, maar in de in het eerste lid laatstbedoelde overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel4
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.14
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.14.5
    text: |-
      Het in het eerste lid bedoelde verzoek kan worden ingediend bij de aanvraag om een vergunning of bij de aantoning,
      bedoeld in [artikel 4.11, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel4
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.14
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.15.1
    text: |-
      In de overeenkomst, bedoeld in [artikel 4.2, eerste lid, onder ][ref1], onderscheidenlijk in de in
      [artikel 4.14, eerste lid][ref2], laatstbedoelde overeenkomst worden onder meer bepalingen opgenomen, welke:


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007962#Artikel4
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 4.15.1.a
    text: 'de vennootschap ertoe verplichten:'
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.15
  - number: 4.15.1.a.1°
    text: |-
      de uitgaven van de vergunninghouder, die door de vennootschap zijn goedgekeurd of in overeenstemming zijn met een
      door deze goedgekeurd jaarlijks investerings- en financieringsplan, te financieren;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.15
  - number: 4.15.1.a.2°
    text: niet te beletten dat besluiten van de vergunninghouder gebaseerd worden op normale commerciële overwegingen;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.15
  - number: 4.15.1.a.3°
    text: de besluitvorming te baseren op transparante, objectieve en niet-discriminerende beginselen;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.15
  - number: 4.15.1.b
    text: 'de vergunninghouder ertoe verplichten:'
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.15
  - number: 4.15.1.b.1°
    text: |-
      aan de andere aandeelhouder in de vennootschap over te dragen een aandeel gelijk aan 40% in de eigendom van de
      werken, welke vóór de oprichting van de vennootschap tot stand zijn gekomen binnen het vergunningsgebied;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.15
  - number: 4.15.1.b.2°
    text: |-
      de voor hem uit de vergunning voortvloeiende rechten uit te oefenen ten behoeve van de vennootschap en
      overeenkomstig de besluiten van de vennootschap;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.15
  - number: 4.15.1.b.3°
    text: |-
      het door hem aangaan, wijzigen of beëindigen van duurzame samenwerking met derden, ter zake van de verkenning,
      opsporing en winning aan goedkeuring door de vennootschap te onderwerpen;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.15
  - number: 4.15.1.b.4°
    text: |-
      aan de vennootschap ten goede te doen komen zijn kennis en ervaring op het gebied van de verkenning, de opsporing,
      winning, afzet en het transport van koolwaterstoffen, in verband met het gebied waarvoor de vergunning geldt;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.15
  - number: 4.15.1.b.5°
    text: |-
      de andere aandeelhouder in de vennootschap tijdig in te lichten en in staat te stellen om een belang tot een
      percentage van 40% te nemen in te treffen regelingen die verband houden met de afzet van de gewonnen delfstoffen
      zoals het transport, de opslag en behandeling daarvan;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.15
  - number: 4.15.1.c
    text: ertoe strekt dat op de overeenkomst Nederlands recht van toepassing is.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.15
  - number: 4.15.2
    text: |-
      In de overeenkomst, bedoeld in [artikel 4.2, eerste lid, onder ][ref1], worden voorts onder meer bepalingen
      opgenomen, welke ertoe strekken dat de vennootschap geen informatie bezit over of betrokken is bij besluiten
      inhoudende bij wie opdrachten worden geplaatst voor leveringen, voor de uitvoering van werken en voor het
      verrichten van diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel4
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '4.16'
    text: |-
      In de in [artikel 4.14, eerste lid][ref1], laatstbedoelde overeenkomst worden onder meer bepalingen opgenomen,
      welke:


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel4
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 4.16.a
    text: 'de aandeelhouders ertoe verplichten:'
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.16
  - number: 4.16.a.1°
    text: |-
      middelen, bestemd tot het doen van de uitgaven, bedoeld in [artikel 4.15, eerste lid, onderdeel ][ref1], aan de
      vennootschap te verstrekken in verhouding tot ieders aandeel in de vennootschap;


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel4
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 4.16.a.2°
    text: ten behoeve van de afzet regelmatig overleg te plegen;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.16
  - number: 4.16.b
    text: 'ertoe strekken dat:'
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.16
  - number: 4.16.b.1°
    text: |-
      de vennootschap geen eigendomsrechten zal doen gelden op de werken, die door het doen van de in
      [artikel 4.15, eerste lid, onderdeel ][ref1], bedoelde investeringen zijn tot stand gekomen en op de uit de
      voorkomens gewonnen en beschikbare hoeveelheden delfstoffen, alsmede geen aanspraken zal doen gelden op de
      opbrengst van bedoelde delfstoffen;


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel4
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 4.16.b.2°
    text: |-
      de onder 1° bedoelde werken en delfstoffen aan de aandeelhouders in de vennootschap toebehoren in verhouding tot
      ieders aandeel daarin;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.16
  - number: 4.16.b.3°
    text: |-
      ieder der aandeelhouders gerechtigd is zijn aandeel in de gewonnen en beschikbare hoeveelheden delfstoffen in
      natura op te nemen, met dien verstande dat de aandeelhouders zich jegens elkaar verplichten ernaar te zullen
      streven zoveel mogelijk samen te werken bij de verkoop van de gewonnen en beschikbare hoeveelheden delfstoffen uit
      de voorkomens;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.16
  - number: 4.16.b.4°
    text: op de overeenkomst Nederlands recht van toepassing is.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.16
  - number: '4.17'
    text: |-
      Overtreding van [artikel 4.14][ref1] is een grond voor het intrekken van de vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel4
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.17
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 5.1.1
    text: |-
      Indien een winningsvergunning wordt verleend op grond van [artikel 13, eerste lid, van de wet][ref1]
      en de desbetreffende opsporingsvergunning is verleend vóór 23 april 1976, geschiedt de verlening van de
      winningsvergunning met inachtneming van de volgende artikelen van het koninklijk besluit van 27 januari
      1967 tot uitvoering van [artikel 12 van de Mijnwet continentaal plat][ref2] ten aanzien van opsporings- en
      winningsvergunningen voor of mede voor aardolie of aardgas (*Stb*. 24), zoals deze luidden op het tijdstip, waarop
      de opsporingsvergunning is verleend:


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002504#Artikel12
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0002504
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0002504
        artikel: '12'
  - number: 5.1.1.a
    text: artikel I;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel5.1
  - number: 5.1.1.b
    text: de in artikel II vermelde artikelen 1 en 18;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel5.1
  - number: 5.1.1.c
    text: |-
      de in artikel III vermelde artikelen 1 tot en met 22, 24, 26 en 30, met uitzondering van artikel 10, tweede lid,
      artikel 19, derde lid, artikel 21, tweede lid, en artikel 24, tweede lid.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel5.1
  - number: 5.1.2
    text: |-
      In het in het eerste lid bedoelde geval is artikel XII van het koninklijk besluit van 6 februari 1976, houdende
      uitvoering van artikel 12 van de Mijnwet continentaal plat ten aanzien van opsporings- en winningsvergunningen voor
      of mede voor aardolie of aardgas (*Stb*. 102), van toepassing.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel5.1
  - number: 5.1.3
    text: |-
      In het in het eerste lid bedoelde geval zijn de [artikelen 3.23][ref1] en [3.24][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007962#Artikel3
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 5.1.4
    text: |-
      In het in het eerste lid bedoelde geval is, indien het betreft een winningsvergunning als bedoeld in artikel IV of
      V van het in het eerste lid bedoelde besluit, hoofdstuk 4 van toepassing.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel5.1
  - number: 5.2.1
    text: |-
      Indien een winningsvergunning wordt verleend op grond van [artikel 13, eerste lid, van de wet][ref1] en de
      desbetreffende opsporingsvergunning is verleend na 22 april 1976 maar vóór het tijdstip van inwerkingtreding van
      dit besluit, geschiedt de verlening van de winningsvergunning met inachtneming van de volgende artikelen van het
      koninklijk besluit van 6 februari 1976, houdende uitvoering van artikel 12 van de Mijnwet continentaal plat ten
      aanzien van opsporings- en winningsvergunningen voor of mede voor aardolie of aardgas (*Stb*. 102), zoals deze
      luidden op het tijdstip, waarop de opsporingsvergunning is verleend:


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel13
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel5.2
    references:
