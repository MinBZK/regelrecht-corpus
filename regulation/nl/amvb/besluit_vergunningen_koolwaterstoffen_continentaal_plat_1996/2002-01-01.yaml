  - number: '3.6'
    text: |-
      Binnen drie maanden na het einde van een kalenderjaar zendt de vergunninghouder aan Onze Minister een
      opgave – overeenkomstig een door Onze Minister vastgesteld model – van de hoeveelheden van de aardolie,
      die met gebruikmaking van de vergunning zijn gewonnen en in dat jaar uit het vergunningsgebied zijn
      afgevoerd onderscheidenlijk verkocht, van de verkoopprijs of de verrekenprijs van die aardolie, van de in
      [artikel 3.5, eerste lid, onder ][ref1], bedoelde bedragen, die op de verkoopprijs in mindering kunnen worden
      gebracht, alsmede van het bedrag van de cijns, die hij naar zijn oordeel op grond daarvan verschuldigd zal zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel3
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.6
