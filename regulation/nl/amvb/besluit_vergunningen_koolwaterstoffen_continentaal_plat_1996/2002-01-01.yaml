  - number: 5.2.4
    text: |-
      Is de in het eerste lid bedoelde opsporingsvergunning verleend na het tijdstip van inwerkingtreding van het
      koninklijk besluit van 27 januari 1995 (*Stb*. 42) tot wijziging van het koninklijk besluit van 6 februari
      1976, houdende uitvoering van artikel 12 van de Mijnwet continentaal plat ten aanzien van opsporings- en
      winningsvergunningen voor of mede voor aardolie of aardgas (*Stb*. 102), dan is, indien het betreft een
      winningsvergunning als bedoeld in [artikel IV](onbekend) of [V van het in het eerste lid bedoelde besluit]
      (onbekend), [hoofdstuk 4][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel5.2
    references:
