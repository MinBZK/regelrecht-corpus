    text: |-
      Indien de vergunning op grond van [artikel 13, eerste lid, van de wet][ref1] is verleend, wordt voor de toepassing
      van het eerste lid het bedrag, dat verschuldigd is met ingang van de dag na de dag, waarop de vergunning van kracht
      is geworden, verminderd met het bedrag, dat de vergunninghouder voor het betrokken gebied en tijdvak als houder van
      de opsporingsvergunning aan oppervlakterecht reeds heeft betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel13
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.2
