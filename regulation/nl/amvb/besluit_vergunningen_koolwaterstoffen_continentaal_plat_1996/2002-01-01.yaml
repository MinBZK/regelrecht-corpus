preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 29 mei 1995, nr. 95035425 WJA/W;

    Gelet op de richtlijn nr. 94/22/EG van het Europees Parlement en de Raad van de Europese Unie van 30 mei 1994
    betreffende voorwaarden voor het verlenen en het gebruik maken van vergunningen voor de prospectie, de exploratie
    en de produktie van koolwaterstoffen (PbEG L 164), zomede op artikel 12, eerste lid, van de Mijnwet continentaal
    plat en op artikel VI, vierde lid, van de wet van 18 maart 1996 tot wijziging van enige wetten op het gebied van de
    mijnbouw in verband met de uitvoering van de vorenbedoelde richtlijn (Stb. 199);

    De Raad van State gehoord (advies van 7 augustus 1995, nr. W10.95.0280);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 20 maart 1996, nr. 96017480 WJA/W;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit wordt verstaan onder: wet: de [Mijnwet continentaal plat][ref1]; opsporingsvergunning: een
      opsporingsvergunning voor koolwaterstoffen; winningsvergunning: een winningsvergunning voor koolwaterstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002504
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0002504
  - number: '2.1'
    text: |-
      Een opsporingsvergunning wordt verleend met de voorschriften, bedoeld in de [artikelen 2.2 tot en met 2.7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel2
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '2'
        hoofdstuk: '2'
  - number: '2.2'
    text: |-
      De vergunninghouder is met ingang van de dag na die, waarop de vergunning van kracht is geworden, aan de staat een
      bedrag als bedoeld in [artikel 10, derde lid, van de wet][ref1] (bonus) verschuldigd, berekend naar de oppervlakte
      van het vergunningsgebied op de volgende grondslag, waarbij het laatstelijk vóór het van kracht worden van de
      vergunning door het Centraal Bureau voor de Statistiek berekende en in het «Statistisch bulletin van het Centraal
      Bureau voor de Statistiek» gepubliceerde indexcijfer van de cao-lonen per maand inclusief beloningen, leeftijd
      volwassenen (basisjaar 1990) wordt aangegeven met de letter *a*: a/63,5 x € 907,56 per gehele km2.


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel10
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0002504
        artikel: '10'
  - number: '2.3'
    text: |-
      De vergunninghouder is jaarlijks met ingang van de dag na de datum, waarop de vergunning van kracht is geworden,
      aan de staat een oppervlakterecht als bedoeld in [artikel 8 van de wet][ref1] verschuldigd, berekend naar de
      oppervlakte van het vergunningsgebied op die dag van het betrokken jaar op de grondslag van de volgende schaal,
      waarin het laatstelijk vóór die dag van het betrokken jaar door het Centraal Bureau voor de Statistiek berekende en
      in het «Statistisch bulletin van het Centraal Bureau voor de Statistiek» gepubliceerde indexcijfer van de cao-lonen
      per maand inclusief beloningen, leeftijd volwassenen (basisjaar 1990) wordt aangegeven met de letter *a*: a/63,5 x
      € 90,76 per gehele km2 voor elk der eerste zes jaren; a/63,5 x € 158,82 per gehele km2 voor elk der volgende drie
      jaren; a/63,5 x € 272,27 per gehele km2 voor elk jaar van de overige geldigheidsduur van de vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel8
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0002504
        artikel: '8'
  - number: '2.4'
    text: |-
      De vergunninghouder is met ingang van door Onze Minister van Verkeer en Waterstaat te bepalen tijdstippen aan de
      staat door deze Minister vastgestelde bedragen verschuldigd ter vergoeding van de kosten, die als gevolg van het
      krachtens de vergunning instellen van een verkennings- of opsporingsonderzoek voor betonningen zijn gemaakt ter
      beveiliging van de scheepvaart en van voor genoemde werkzaamheden dienende installaties.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel2.4
  - number: '2.5'
    text: |-
      De vergunninghouder is verplicht de ingevolge de vergunning verschuldigde bedragen te voldoen op door Onze Minister
      aan te geven wijze.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel2.5
  - number: 2.6.1
    text: |-
      De vergunninghouder is verplicht in Nederland van zijn met gebruikmaking van de vergunning uitgeoefend bedrijf
      een boekhouding te voeren, welke voldoet aan de eisen van dat bedrijf, en waaruit te allen tijde zijn financiële
      rechten en verplichtingen alsmede de door hem gedane investeringen kunnen worden gekend, zowel ten aanzien
      van het gehele vergunningsgebied als ten aanzien van ieder blok, aangegeven op de kaart, vastgesteld krachtens
      [artikel 4, tweede lid, van het Besluit aanvragen vergunningen en ontheffingen Mijnwet continentaal plat][ref1],
      waarvoor de vergunning geldt. De vergunninghouder is voorts verplicht ervoor zorg te dragen, dat degene, die is
      belast met de dagelijkse leiding van het met gebruikmaking van de vergunning uitgeoefend bedrijf, in Nederland
      kantoor houdt.


      [ref1]: https://wetten.overheid.nl/BWBR0002555#Artikel4
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel2.6
    references:
