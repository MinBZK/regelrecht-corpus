  - number: '3.29'
    text: |-
      Een winningsvergunning, welke anders dan op grond van [artikel 13, eerste lid, van de wet][ref1] wordt verleend,
      wordt mede verleend met de voorschriften, bedoeld in de [artikelen 3.30][ref2] en [3.31][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0007962#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007962#Artikel3
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.29
    references:
      - id: ref1
        bwb_id: BWBR0002504
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '3.30'
    text: |-
      De vergunninghouder is met ingang van de dag na die, waarop de vergunning van kracht is geworden, aan de staat een
      bedrag als bedoeld in [artikel 10, derde lid, van de wet][ref1] (bonus) verschuldigd, berekend naar de oppervlakte
      van het vergunningsgebied op de volgende grondslag, waarbij het laatstelijk vóór het van kracht worden van de
      vergunning door het Centraal Bureau voor de Statistiek berekende en in het «Statistisch bulletin van het Centraal
      Bureau voor de Statistiek» gepubliceerde indexcijfer van de cao-lonen per maand inclusief bijzondere beloningen,
      leeftijd volwassenen (basisjaar 1990) wordt aangegeven met de letter *a*: a/63,5 x € 907,56 per gehele km2.


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel10
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.30
    references:
      - id: ref1
        bwb_id: BWBR0002504
        artikel: '10'
  - number: '3.31'
    text: |-
      Overtreding van [artikel 3.30][ref1] is een grond voor het intrekken van de vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel3
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel3.31
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 4.1.1
    text: |-
      Indien een winningsvergunning wordt verleend voor een gebied waarbinnen zich koolwaterstoffen in een
      economisch winbare hoeveelheid bevinden, wordt gebruik gemaakt van de in [artikel 11, tweede lid, onder ][ref1]
      bedoelde bevoegdheid en wordt de vergunning daartoe mede verleend met de voorschriften, bedoeld in de
      [artikelen 4.2 tot en met 4.9][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0007962#Artikel4
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0002504
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.1.2
    text: Het eerste lid geldt niet, indien de staat hierdoor naar redelijke schatting financieel nadeel zal lijden.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.1
  - number: 4.2.1
    text: 'De vergunninghouder is verplicht zijn medewerking te verlenen aan:'
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.2
  - number: 4.2.1.a
    text: |-
      de oprichting met inachtneming van de [artikelen 4.3][ref1] en [4.4][ref2] van een naamloze vennootschap of
      besloten vennootschap met beperkte aansprakelijkheid voor het met gebruikmaking van de vergunning winnen van
      koolwaterstoffen, waarin de vergunninghouder voor 60% deelneemt en de in de vergunning aangewezen naamloze
      vennootschap of besloten vennootschap met beperkte aansprakelijkheid, waarvan alle aandelen middellijk of
      onmiddellijk aan de staat toebehoren, voor 40% deelneemt, en


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007962#Artikel4
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.2.1.b
    text: |-
      de totstandkoming van een overeenkomst tussen de vergunninghouder en die op te richten vennootschap, krachtens
      welke de vergunninghouder slechts voor rekening van die vennootschap zal winnen en welke in elk geval de in
      [artikel 4.6][ref1] bedoelde bepalingen behelst.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel4
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.2.2
    text: |-
      De overeenkomst, bedoeld in het eerste lid, onder *b*, dient binnen een door Onze Minister vast te stellen
      termijn tot stand te komen en dient door Onze Minister te worden goedgekeurd. Het is verboden te winnen zolang de
      goedkeuring niet is verleend. De overeenkomst kan niet worden gewijzigd dan na goedkeuring door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.2
  - number: '4.3'
    text: |-
      De statuten van een overeenkomstig [artikel 4.2, eerste lid, onder ][ref1], op te richten vennootschap zullen er
      onder meer toe strekken, dat


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel4
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.3.a
    text: de aandelen van de vennootschap op naam worden gesteld en worden onderscheiden in twee categorieën;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.3
  - number: 4.3.b
    text: |-
      de aandelen van de ene categorie eigendom zijn van de vergunninghouder en recht geven tot het doen aan de algemene
      vergadering van aandeelhouders van bindende voordrachten van twee natuurlijke personen voor de benoeming van de
      directeur van de vennootschap;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.3
  - number: 4.3.c
    text: |-
      de aandelen van de andere categorie eigendom zijn van de ingevolge [artikel 4.2, eerste lid, onder ][ref1],
      aangewezen vennootschap en deze aandelen niet aan derden kunnen worden overgedragen dan nadat zij onder gelijke
      voorwaarden zijn aangeboden aan de vergunninghouder;


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel4
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.3.d
    text: |-
      de werkelijke leiding van de vennootschap en de werkelijke leiding van haar bedrijf of bedrijven binnen Nederland
      worden uitgeoefend;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.3
  - number: 4.3.e
    text: |-
      de vennootschap ter vergoeding van de bij een overeenkomst als in [artikel 4.2, eerste lid, onder ][ref1],
      bedoeld aan haar toegekende voordelen aan ieder van de aandeelhouders een winstbewijs uitreikt, recht gevende op
      uitdeling van een zodanig gedeelte van de jaarlijkse overwinst als overeenkomt met de deelneming van de betrokken
      aandeelhouder in het kapitaal van de vennootschap bij haar oprichting; onder overwinst wordt te dezen verstaan
      de jaarlijkse winst na aftrek van tantièmes alsmede van een bedrag dat aangemerkt kan worden als een redelijke
      beloning voor het nominaal gestorte kapitaal;


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel4
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.3.f
    text: |-
      de goedkeuring, met twee derden van de stemmen, welke overeenkomstig de statuten kunnen worden uitgebracht, van de
      algemene vergadering van aandeelhouders is vereist voor:
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.3
  - number: 4.3.f.1°
    text: het jaarlijkse investerings- en financieringsplan;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.3
  - number: 4.3.f.2°
    text: |-
      niet in het jaarlijkse investerings- en financieringsplan opgenomen werkzaamheden en aanschaffingen, die een bedrag
      van € 460 000 te boven gaan;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.3
  - number: 4.3.f.3°
    text: het aangaan van langlopende geldleningen en de uitgifte van obligaties;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.3
  - number: 4.3.f.4°
    text: het bestemmen van de gemaakte winst;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.3
  - number: 4.3.f.5°
    text: |-
      het de vergunninghouder toestaan, dat overeenkomstig het beperkte doel der vennootschap het winnen van
      koolwaterstoffen uit een voorkomen niet of niet langer zal geschieden voor rekening van de vennootschap;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.3
  - number: 4.3.f.6°
    text: het aangaan van verplichtingen tot levering van koolwaterstoffen;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.3
  - number: 4.3.f.7°
    text: besluiten inzake het vervoer van gewonnen koolwaterstoffen;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.3
  - number: 4.3.g
    text: 'de goedkeuring van Onze Minister is vereist voor:'
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.3
  - number: 4.3.g.1°
    text: het ontbinden van de vennootschap;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.3
  - number: 4.3.g.2°
    text: het wijzigen van de statuten van de vennootschap.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.3
  - number: 4.4.1
    text: |-
      In de oprichtingsakte van de vennootschap zal worden vastgesteld het bedrag van de door de vergunninghouder reeds
      gemaakte kosten:
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.4
  - number: 4.4.1.a
    text: |-
      welke naar redelijkheid kunnen worden toegeschreven aan de werkzaamheden, welke tot het aantreffen van het
      voorkomen hebben geleid;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.4
  - number: 4.4.1.b
    text: van de verdere evaluatie van dat voorkomen;c. van investeringen ten behoeve van de winning.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.4
  - number: 4.4.2
    text: |-
      Voor de toepassing van het eerste lid wordt onder kosten niet verstaan de bedragen, welke de vergunninghouder als
      zodanig dan wel als houder van de opsporingsvergunning heeft betaald aan oppervlakterechten en bonus.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.4
  - number: 4.4.3
    text: |-
      In de oprichtingsakte zal voorts worden bepaald, dat aan de vergunninghouder door de andere aandeelhouder terstond
      zal worden vergoed 40% van het in het eerste lid bedoelde bedrag, vermeerderd met een enkelvoudige rente, waarvan
      het percentage gelijk is aan dat van de wettelijke rente, over een tijdvak van ten hoogste 5 jaar, te rekenen vanaf
      het tijdstip waarop de betreffende kosten zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.4
  - number: '4.5'
    text: |-
      De vergunninghouder dient eigenaar te zijn van de in [artikel 4.3, onder ][ref1], bedoelde aandelen.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel4
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.6.1
    text: |-
      In een overeenkomst als bedoeld in [artikel 4.2, eerste lid, onder ][ref1], worden onder meer bepalingen opgenomen,
      welke:


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel4
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.6.1.a
    text: 'de vennootschap ertoe verplichten:'
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.6
  - number: 4.6.1.a.1°
    text: |-
      de uitgaven van de vergunninghouder, die namens de vennootschap zijn goedgekeurd of in overeenstemming zijn met een
      jaarlijks investerings- en financieringsplan, te financieren;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.6
  - number: 4.6.1.a.2°
    text: |-
      in 10 jaarlijkse termijnen aan de vergunninghouder 60% en aan de andere aandeelhouder in de vennootschap 40% van
      het in [artikel 4.4, eerste lid][ref1], bedoelde bedrag uit te betalen, vermeerderd ten aanzien van iedere betaling
      met een rente, waarvan het percentage gelijk is aan dat van de wettelijke rente, berekend over het tijdvak, dat op
      het tijdstip van betaling sedert de oprichting van de vennootschap is verstreken;


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel4
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.6.1.a.3°
    text: |-
      indien [artikel 4.14][ref1] bij het verlenen van de winningsvergunning geen toepassing heeft gevonden, aan de
      vergunninghouder te betalen het door deze krachtens [artikel 3.13][ref2] verschuldigde bedrag, verminderd met
      de vennootschapsbelasting, die over het betrokken boekjaar van de vennootschap is geheven, naar winst, die met
      activiteiten als in [artikel 3.14, tweede lid, onder ][ref3], bedoeld, is behaald;


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007962#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007962#Artikel3
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007962
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 4.6.1.a.4°
    text: niet te beletten dat besluiten van de vergunninghouder gebaseerd worden op normale commerciële overwegingen;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.6
  - number: 4.6.1.a.5°
    text: de besluitvorming te baseren op transparante, objectieve en niet-discriminerende beginselen;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.6
  - number: 4.6.1.b
    text: 'de vergunninghouder ertoe verplichten:'
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.6
  - number: 4.6.1.b.1°
    text: |-
      aan de vennootschap in eigendom over te dragen de werken, welke door het doen van de in
      [artikel 4.4, eerste lid, onder ][ref1], bedoelde investeringen tot stand zijn gekomen;


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel4
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.6.1.b.2°
    text: |-
      aan de vennootschap ten goede te doen komen zijn kennis en ervaring op het gebied van de verkenning, de opsporing,
      winning en afzet van koolwaterstoffen ten aanzien van de verkenning, opsporing en winning in het vergunningsgebied;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.6
  - number: 4.6.1.b.3°
    text: |-
      de voor hem uit de vergunning voortvloeiende rechten uit te oefenen ten bate van de vennootschap en overeenkomstig
      de besluiten van de organen van de vennootschap;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.6
  - number: 4.6.1.b.4°
    text: |-
      het door hem aangaan of beëindigen van duurzame samenwerking met derden ter zake van de verkenning, opsporing of
      winning aan goedkeuring door de vennootschap te onderwerpen;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.6
  - number: 4.6.1.b.5°
    text: periodiek de ontvangen bruto-opbrengsten van de gewonnen koolwaterstoffen aan de vennootschap af te dragen;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.6
  - number: 4.6.1.c
    text: 'ertoe strekken, dat:'
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.6
  - number: 4.6.1.c.1°
    text: |-
      aan een verplichting als in onderdeel *a*, onder 2°, bedoeld binnen de daarvoor voorgeschreven tijdsduur kan worden
      voldaan;
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.6
  - number: 4.6.1.c.2°
    text: op de overeenkomst Nederlands recht toepasselijk is.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.6
  - number: 4.6.2
    text: |-
      In een overeenkomst als bedoeld in [artikel 4.2, eerste lid, onder ][ref1], worden voorts onder meer bepalingen
      opgenomen, welke ertoe strekken dat de vennootschap geen informatie bezit over of betrokken is bij besluiten
      inhoudende bij wie opdrachten worden geplaatst voor leveringen, voor de uitvoering van werken of voor het
      verrichten van diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel4
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '4.7'
    text: |-
      De vergunninghouder mag niet een besluit nemen inhoudende bij wie opdrachten worden geplaatst voor leveringen,
      voor de uitvoering van werken of voor het verrichten van diensten, indien aannemelijk is dat dit besluit leidt tot
      financieel nadeel voor de staat, voor zover het betreft hetgeen ingevolge een winningsvergunning verschuldigd is,
      of tot financieel nadeel voor de ingevolge [artikel 4.2, eerste lid, onder ][ref1], aangewezen vennootschap.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel4
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.8.1
    text: |-
      De vergunninghouder is verplicht onverwijld aan de ingevolge [artikel 4.2, eerste lid, onder ][ref1], aangewezen
      vennootschap mee te delen besluiten inhoudende bij wie opdrachten worden geplaatst voor leveringen, voor de
      uitvoering van werken of voor het verrichten van diensten. Deze verplichting geldt niet, ingeval de opdracht
      betrekking heeft op een bedrag van € 460 000 of minder.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel4
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.8.2
    text: |-
      De ingevolge [artikel 4.2, eerste lid, onder ][ref1], aangewezen vennootschap kan binnen een week na ontvangst van
      een mededeling als bedoeld in het eerste lid verzet aantekenen tegen het desbetreffende besluit, indien dit besluit
      in strijd is met [artikel 4.7][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007962#Artikel4
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.8.3
    text: |-
      De ingevolge [artikel 4.2, eerste lid, onder ][ref1], aangewezen vennootschap kan de termijn van een week eenmaal
      met ten hoogste vier weken verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel4
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.8.4
    text: |-
      Indien de door de vergunninghouder verstrekte gegevens en bescheiden onvoldoende zijn voor de beslissing omtrent
      het verzet, kan de ingevolge [artikel 4.2, eerste lid, onder ][ref1], aangewezen vennootschap de vergunninghouder
      in de gelegenheid stellen de gegevens en bescheiden aan te vullen.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel4
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.8.5
    text: |-
      De termijn, bedoeld in het tweede onderscheidenlijk derde lid, wordt opgeschort met ingang van de dag, waarop
      de ingevolge [artikel 4.2, eerste lid, onder ][ref1], aangewezen vennootschap de vergunninghouder uitnodigt de
      gegevens en bescheiden aan te vullen, tot de dag, waarop deze aanvulling is geschied.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel4
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.8.6
    text: |-
      Het is aan de vergunninghouder verboden uitvoering te geven aan een besluit dat ingevolge het eerste lid moet
      worden meegedeeld, totdat is beslist dat daartegen geen verzet wordt aangetekend dan wel de ingevolge het tweede,
      derde of vijfde lid geldende termijn is verstreken zonder dat verzet is aangetekend.
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.8
  - number: 4.9.1
    text: |-
      Overtreding van [artikel 4.2][ref1], [4.5][ref2], [4.7][ref3], of [4.8][ref4] is een grond voor het intrekken van
      de vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007962#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0007962#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0007962#Artikel4
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.9.2
    text: |-
      De vergunning kan niet worden ingetrokken wegens overtreding van [artikel 4.7][ref1] nadat
      is beslist dat geen verzet wordt aangetekend tegen het betrokken besluit dan wel de ingevolge
      [artikel 4.8, tweede, derde of vijfde lid][ref2], geldende termijn is verstreken zonder dat verzet is aangetekend.


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007962#Artikel4
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007962
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '4.10'
    text: |-
      Een winningsvergunning, welke niet met toepassing van [artikel 4.1, eerste lid][ref1], wordt verleend, wordt mede
      verleend met de voorschriften, bedoeld in de [artikelen 4.11][ref2], [4.12][ref3] en [4.13][ref4], en tevens, voor
      het geval de in [artikel 4.11, eerste lid][ref5], bedoelde verplichting geldt, met de voorschriften, bedoeld in de
      [artikelen 4.5][ref6], [4.7][ref7] en [4.8][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007962#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0007962#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0007962#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0007962#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0007962#Artikel4
      [ref7]: https://wetten.overheid.nl/BWBR0007962#Artikel4
      [ref8]: https://wetten.overheid.nl/BWBR0007962#Artikel4
    url: https://wetten.overheid.nl/BWBR0007962/2002-01-01#Artikel4.10
    references:
      - id: ref1
