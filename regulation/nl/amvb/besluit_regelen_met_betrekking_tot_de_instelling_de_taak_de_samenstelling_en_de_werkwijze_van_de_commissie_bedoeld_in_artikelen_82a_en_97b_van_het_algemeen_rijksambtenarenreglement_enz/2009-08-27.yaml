        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005689
        artikel: '5'
  - number: '7'
    text: |-
      1 De commissie hoort ter vergadering de belanghebbende, tenzij deze heeft verklaard daarop geen prijs te stellen
      of zonder gegronde reden aan een daartoe gedane oproeping geen gevolg heeft gegeven. De belanghebbende kan zich ter
      vergadering van de commissie laten bijstaan door een raadsman.

      2 Het bevoegd gezag wordt in de gelegenheid gesteld zijn standpunt ter vergadering van de commissie nader te doen
      toelichten.

      3 De commissie is bevoegd iedere ambtenaar ten aanzien waarvan zij het horen wenselijk acht te doen oproepen
      ter vergadering. De opgeroepen ambtenaar verstrekt desgevraagd alle inlichtingen. Indien dit uit een oogpunt van
      bronbescherming noodzakelijk is, verstrekt de ambtenaar de inlichtingen slechts in het bijzijn van de commissie.

      4 De commissie kan al dan niet op verzoek van de belanghebbende andere personen horen.
    url: https://wetten.overheid.nl/BWBR0005689/2009-08-27#Artikel7
  - number: '8'
    text: |-
      1 De commissie vergadert niet indien niet tenminste de voorzitter en twee andere leden, dan wel hun
      plaatsvervangers aanwezig zijn.

      2 Indien de commissie advies wordt gevraagd over een zaak als bedoeld in
      [artikel 80 van het Besluit algemene rechtspositie politie][ref1], vergadert de commissie niet, indien niet ten
      minste de voorzitter en twee andere leden, dan wel hun plaatsvervangers, die deskundig zijn op het gebied van de
      sector Politie, aanwezig zijn.

      3 De vergaderingen van de commissie zijn niet openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel80
    url: https://wetten.overheid.nl/BWBR0005689/2009-08-27#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '80'
  - number: '9'
    text: |-
      1 De commissie beslist bij meerderheid van stemmen. Noch de voorzitter, noch een der andere leden onthoudt zich van
      deelneming aan enige stemming. Indien de stemmen staken geeft de stem van de voorzitter de doorslag.

      2 Het advies van de commissie wordt met redenen omkleed. Indien in de commissie een minderheidsstandpunt bestaat,
      wordt dit, alsmede de daaraan ten grondslag liggende argumenten, desverlangd in het advies opgenomen. Het advies
      wordt door de voorzitter en de secretaris ondertekend.

      3 Behoudens dringende redenen wordt het advies niet later dan vier weken na de in [artikel 6, eerste lid][ref1],
      bedoelde vergadering uitgebracht aan het in [artikel 2][ref2] bedoelde adviesvragende gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0005689#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005689#Artikel2
    url: https://wetten.overheid.nl/BWBR0005689/2009-08-27#Artikel9
