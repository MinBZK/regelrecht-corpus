  - number: '3'
    text: |-
      1 De Commissie bestaat uit vijf leden onder wie de voorzitter. Voorts kunnen een plaatsvervangend voorzitter en
      plaatsvervangende leden worden benoemd. De plaatsvervangend voorzitter wordt uit de leden benoemd.

      2 De voorzitter en de andere leden, alsmede hun plaatsvervangers worden bij koninklijk besluit, op voordracht van
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, benoemd en ontslagen. Onze Minister stelt de centrales
      van verenigingen van ambtenaren die deel uitmaken van de Sectorcommissie overleg rijkspersoneel in de gelegenheid
      ter zake voorstellen te doen. De centrales van verenigingen van ambtenaren die deel uitmaken van de Commissie voor
      Georganiseerd Overleg in Politie-ambtenarenzaken worden in de gelegenheid gesteld voorstellen te doen voor leden,
      alsmede hun plaatsvervangers, die deskundig zijn op het gebied van de sector Politie.

      3 De voorzitter en de andere leden, alsmede hun plaatsvervangers, worden benoemd voor een periode van ten hoogste
      vier jaar. Herbenoeming kan twee maal en telkens voor ten hoogste vier jaar plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005689/2009-08-27#Artikel3
  - number: '4'
    text: |-
      De commissie wordt bijgestaan door een secretaris en een plaatsvervangend secretaris. Zij worden door Onze Minister
      van Binnenlandse Zaken en Koninkrijksrelaties benoemd en ontslagen.
    url: https://wetten.overheid.nl/BWBR0005689/2009-08-27#Artikel4
  - number: '5'
    text: |-
      1 Wanneer het advies van de commissie wordt gevraagd, worden daarbij afschriften van de ter zake dienende stukken
      overgelegd.

      2 Wanneer uit een oogpunt van bronbescherming de inhoud van bepaalde stukken ter uitsluitende kennisneming van de
      commissie dient te blijven, wordt dat aan de commissie medegedeeld.

      3 De commissie is bevoegd voorts alle inlichtingen in te winnen die zij voor de vorming van haar advies nodig acht.
    url: https://wetten.overheid.nl/BWBR0005689/2009-08-27#Artikel5
  - number: '6'
    text: |-
      1 Zo spoedig mogelijk na ontvangst van de adviesaanvraag stelt de voorzitter de datum voor een vergadering vast,
      die - behoudens dringende redenen - niet later dan vier weken na de ontvangst mag plaatsvinden.

      2 De secretaris geeft de belanghebbende alsmede het bevoegd gezag onverwijld na de vaststelling kennis van plaats
      en tijdstip der vergadering onder mededeling van het bepaalde in het derde lid, alsmede van het bepaalde in
      [artikel 7, eerste lid, tweede volzin][ref1].

      3 De belanghebbende en zijn raadsman worden voor deze vergadering in de gelegenheid gesteld kennis en afschrift te
      nemen van alle op de zaak betrekking hebbende stukken, voorzover niet [artikel 5, tweede lid][ref2], van toepassing
      is. In voorkomend geval wordt de belanghebbende daarvan mededeling gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005689#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005689#Artikel5
    url: https://wetten.overheid.nl/BWBR0005689/2009-08-27#Artikel6
    references:
      - id: ref1
