  - number: '10'
    text: |-
      1 Het beheer van de archiefbescheiden der commissie geschiedt met inachtneming van het Besluit algemene secretarie-
      aangelegenheden rijksadministratie (*Stb.* 1980, 182) op overeenkomstige wijze als bij het Ministerie van
      Binnenlandse Zaken en Koninkrijksrelaties.

      2 Bij opheffing der commissie wordt het archief overgedragen aan de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0005689/2009-08-27#Artikel10
