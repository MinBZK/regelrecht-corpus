  - number: '2'
    text: |-
      Er is een Adviescommissie grondrechten en functie-uitoefening ambtenaren. De commissie heeft tot taak:

      a. het bevoegd gezag van advies te dienen over het voornemen een disciplinaire straf op te leggen als bedoeld in
      [artikel 82][ref1], [artikel 117][ref2] dan wel [artikel 80 van het Besluit algemene rechtspositie politie][ref3];

      b. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, respectievelijk het bevoegd
      gezag, bedoeld in [artikel 128 van het Ambtenarenreglement Staten-Generaal][ref4], van advies te
      dienen over het voornemen tot ontslagverlening als bedoeld in [artikel 97][ref5] respectievelijk
      [artikel 128 van het Ambtenarenreglement Staten-Generaal][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel82a
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel117a
