preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken van 22 augustus 1991, nr. AB91/U420 directoraat-generaal
    Management en Personeelsbeleid, directie Arbeidsvoorwaarden, afdeling Arbeidsverhoudingen en Juridische Zaken;

    Gelet op de artikelen 125, eerste lid, 125e, zesde lid, en 134, eerste lid, van de Ambtenarenwet 1929 (Stb. 530);

    De Raad van State gehoord (advies van 25 februari 1992, nr. W04.91.0459);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken van 8 oktober 1992, AB92/248 directoraat-generaal
    Management en Personeelsbeleid, directie Arbeidsvoorwaarden, afdeling Arbeidsverhoudingen en Juridische Zaken;

    Hebben goedgevonden en verstaan
  url: https://wetten.overheid.nl/BWBR0005689/2009-08-27#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      1. het bevoegd gezag:

      a. het gezag dat bevoegd is een straf op te leggen en een ontslag te verlenen als bedoeld
      in [artikel 82][ref1] respectievelijk [97][ref2], [artikel 117][ref3] respectievelijk
      [128 van het Ambtenarenreglement Staten-Generaal][ref4] dan wel een straf op te leggen als bedoeld in
      [artikel 80 van het Besluit algemene rechtspositie politie][ref5];

      b. Onze Minister, hoofd van het betrokken ministerie, dan wel de vice-president van de Raad van State, de Algemene
      Rekenkamer of de Nationale ombudsman, indien de bevoegdheid, bedoeld in onderdeel *a*, bij koninklijk besluit wordt
      uitgeoefend;

      2. de belanghebbende: degene op wie het in [artikel 2][ref6] bedoelde voornemen betrekking heeft.


