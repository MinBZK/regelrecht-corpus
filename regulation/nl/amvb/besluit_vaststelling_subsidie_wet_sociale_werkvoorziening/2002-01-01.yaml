  - number: '10'
    text: |-
      1 Indien in een geval als bedoeld in [artikel 9, eerste lid, onderdeel c, van de wet][ref1] niet wordt voldaan
      aan [artikel 2 van het Besluit arbeidsaanpassing en begeleiding sociale werkvoorziening][ref2] stelt Onze
      Minister het bedrag van de maatregel vast op het bedrag dat wordt verkregen door het aantal niet gerealiseerde
      arbeidsovereenkomsten, bedoeld in [hoofdstuk 3 van de wet][ref3], te vermenigvuldigen met het bedrag behorende
      bij een arbeidsovereenkomst met een persoon die op grond van [artikel 6, eerste lid, van het besluit][ref4] is
      ingedeeld in de arbeidshandicapcategorie licht.

      2 Van het opleggen van een maatregel als bedoeld in het eerste lid, wordt door Onze Minister afgezien indien
      het gemeentebestuur naar het oordeel van Onze Minister aannemelijk heeft gemaakt dat het geen verwijt kan worden
      gemaakt van de in het eerste lid bedoelde tekortkoming.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel9
