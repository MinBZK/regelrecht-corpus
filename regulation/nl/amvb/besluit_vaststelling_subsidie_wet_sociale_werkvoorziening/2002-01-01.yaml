  - number: '8'
    text: |-
      Het percentage, bedoeld in [artikel 5][ref1], bedraagt, indien niet wordt voldaan aan de voorschriften met
      betrekking tot het vastleggen en bewaren van de informatie, bedoeld in artikel 2, vierde lid, van de Regeling
      statistiek Wet sociale werkvoorziening: 0,2.


      [ref1]: https://wetten.overheid.nl/BWBR0012782#Artikel5
    url: https://wetten.overheid.nl/BWBR0012782/2002-01-01#Artikel8
