        artikel: '9'
      - id: ref2
        bwb_id: BWBR0012782
        artikel: '4'
  - number: '6'
    text: |-
      1 Het percentage, bedoeld in [artikel 5][ref1], bedraagt, indien niet wordt voldaan aan de voorschriften met
      betrekking tot de (her)indicatie, bedoeld in:

      a. [artikel 11, eerste lid, onderdelen d en e, van de wet][ref2] en de artikelen 2 en 3 van de regeling: 0, 0,5
      of 1;

      b. de [artikelen 7, tweede tot en met achtste lid][ref3], en [8, derde lid, van het besluit][ref4]: 0, 0,1 of 0,2.

      2 Het percentage, bedoeld in [artikel 5][ref5], bedraagt, indien niet is voldaan aan de voorschriften met
      betrekking tot de ondersteuning van de commissie en de kwaliteit van het indicatieproces, bedoeld in:

      a. [artikel 12, vijfde lid, van de wet][ref6] 1;

      b. [artikel 10, eerste lid, van het besluit][ref7] 1;

      c. artikel 9 van de regeling 1.

      3 Het percentage, bedoeld in [artikel 5][ref8], bedraagt, indien niet wordt voldaan aan de
      voorschriften met betrekking tot de samenstelling van de commissie in geval van ontslag, bedoeld in
      [artikel 9, tweede lid, van het besluit][ref9]: 0,5.


