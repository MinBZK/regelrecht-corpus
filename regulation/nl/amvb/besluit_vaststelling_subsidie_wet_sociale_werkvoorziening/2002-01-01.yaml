  - number: '7'
    text: |-
      Het percentage, bedoeld in [artikel 5][ref1], bedraagt, indien niet wordt voldaan aan de voorschriften
      met betrekking tot de begeleidingsorganisatie, bedoeld in de [artikelen 3, tweede lid][ref2], en
      [6, eerste lid, van het Besluit arbeidsinpassing en begeleiding sociale werkvoorziening][ref3]: 1.


      [ref1]: https://wetten.overheid.nl/BWBR0012782#Artikel5
