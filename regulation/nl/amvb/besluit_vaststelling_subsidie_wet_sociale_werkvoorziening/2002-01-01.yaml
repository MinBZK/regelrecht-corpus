        artikel: '6'
  - number: '5'
    text: |-
      Indien in een geval als bedoeld in [artikel 9, eerste lid, onderdeel c, van de wet][ref1] het bedrag, bedoeld
      in [artikel 4][ref2], niet kan worden vastgesteld, stelt Onze Minister het bedrag van de maatregel vast op een
      percentage van het totaalbedrag dat aan subsidie voor het betreffende jaar is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0012782#Artikel4
    url: https://wetten.overheid.nl/BWBR0012782/2002-01-01#Artikel5
    references:
