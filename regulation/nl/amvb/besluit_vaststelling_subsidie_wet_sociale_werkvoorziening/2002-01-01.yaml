    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 13 juli 2001, Directie Arbeidsmarkt,
    nr. AM/RAW/01/30412;

    Gelet op de artikelen 8, vijfde lid, en9, derde lid, van de Wet sociale werkvoorziening;

    De Raad van State gehoord (advies van 26 juli 2001, no. W12.01.0341/IV);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid van 15 augustus 2001, Directie
    Arbeidsmarkt, nr. AM/RAW/01/50792;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0012782/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. wet: de [Wet sociale werkvoorziening][ref1];

      b. besluit: het [Besluit indicatie sociale werkvoorziening][ref2];

      c. regeling: de Regeling indicatie sociale werkvoorziening;

      d. maatregel: het ten opzichte van de subsidieverlening, bedoeld in [artikel 8 van de wet][ref3], lager vaststellen
      van de subsidie op grond van [artikel 9 van de wet][ref4];

      e. subsidiejaar: het jaar waarvoor de subsidie wordt verleend;

      f. standaardeenheid: hetgeen daaronder wordt verstaan in
      [artikel 1, eerste lid, onderdeel b, van het Besluit financieel verdeelmodel sociale werkvoorziening][ref5];

      g. commissie: de commissie, bedoeld in [artikel 12, eerste lid, van de wet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0008903
      [ref2]: https://wetten.overheid.nl/BWBR0008954
