  - number: '9'
    text: |-
      1 Indien een tekortkoming als bedoeld in [artikel 6, eerste lid][ref1], wordt vastgesteld in:

      a. minder dan 15% van het betreffende bestand, dan wordt het in die artikelen ten aanzien van die tekortkoming als
      eerste genoemde percentage toegepast;

      b. ten minste 15%, doch niet meer dan 50% van het betreffende bestand, dan wordt het in die artikelen ten aanzien
      van die tekortkoming als tweede genoemde percentage toegepast;

      c. meer dan 50% van het betreffende bestand, dan wordt het in die artikelen ten aanzien van die tekortkoming als
      derde genoemde percentage toegepast.

      2 Bij samenloop van tekortkomingen als bedoeld in het eerste lid en de [artikelen 6, tweede en derde lid][ref2],
      [7][ref3] en [8][ref4] worden de ten aanzien van de verschillende tekortkomingen vastgestelde percentages bij
      elkaar opgeteld.

      3 Indien een tekortkoming als bedoeld in het tweede lid, betrekking heeft op een deel van het betrokken jaar, wordt
      het bedrag van de maatregel, bedoeld in [artikel 5][ref5], naar evenredigheid vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0012782#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0012782#Artikel6
