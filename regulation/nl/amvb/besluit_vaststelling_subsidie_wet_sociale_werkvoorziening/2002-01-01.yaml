  - number: '11'
    text: |-
      In een geval als bedoeld in [artikel 9, eerste lid, onderdeel d, van de wet][ref1] stelt Onze Minister het bedrag
      van de maatregel vast op het bedrag van de subsidie die in het jaar na het jaar waarin deze is verleend niet of
      anders is bestemd dan voor het uitvoeren van de wet of voor de inschakeling van werkzoekenden in het arbeidsproces
      of binnen een termijn van ten hoogste drie jaar na afloop van het subsidiejaar niet of niet geheel overeenkomstig
      die bestemming is besteed.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel9
