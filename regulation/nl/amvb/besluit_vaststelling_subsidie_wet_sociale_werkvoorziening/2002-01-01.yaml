  - number: '2'
    text: |-
      1 Onze Minister stelt de subsidie aan de gemeente vast binnen een jaar na ontvangst van de daarvoor bij
      ministeriële regeling vastgestelde bescheiden.

      2 Indien de bescheiden, bedoeld in het eerste lid, niet zijn ontvangenbinnen 18 maanden na het kalenderjaar waarop
      deze betrekking hebben wordt de subsidie ambtshalve vastgesteld.

      3 Indien de subsidie aan de gemeente lager wordt vastgesteld dan de verleende subsidie over het subsidiejaar, wordt
      het verschil teruggevorderd dan wel verrekend met de subsidie over het lopende subsidiejaar.

      4 Voor dienstbetrekkingen en arbeidsovereenkomsten als bedoeld in de [hoofdstukken 2 en 3 van de wet][ref1],
      aangegaan door werknemers die zijn geïndiceerd na inwerkingtreding van de wet, geldt voor de vaststelling van de
      subsidie aan de gemeenten een maximum van gemiddeld 32 uur per week uitgedrukt in standaardeenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0012782/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008903
        hoofdstuk: '2'
  - number: '3'
    text: |-
      In een geval als bedoeld in [artikel 9, eerste lid, onderdeel b, van de wet][ref1] stelt Onze Minister het bedrag
      van de maatregel vast op het bedrag dat aan subsidie is verleend voor die dienstbetrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel9
    url: https://wetten.overheid.nl/BWBR0012782/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '9'
  - number: '4'
    text: |-
      1 In een geval als bedoeld in [artikel 9, eerste lid, onderdeel c, van de wet][ref1] stelt Onze Minister het bedrag
      van de maatregel vast op het bedrag dat in strijd met het bij of krachtens de wet bepaalde aan subsidie is besteed.

      2 Indien in een geval als bedoeld in het eerste lid, niet wordt voldaan aan artikel 11, eerste lid, onderdeel
      b, van de wet wordt bij de vaststelling van de subsidie uitgegaan van de indeling van de persoon in de
      arbeidshandicapcategorie licht, bedoeld in [artikel 6, eerste lid, van het besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0008954#Artikel6
    url: https://wetten.overheid.nl/BWBR0012782/2002-01-01#Artikel4
