  - number: 5.4.1
    text: >-
      Onze Minister wijst een vertaling aan van bijlage A bij de ADR of draagt zorg voor een vertaling en doet van de
      aanwijzing of wijze van bekendmaking van de vertaling mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel5.4.1
  - number: 5.4.2
    text: >-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel5.4.2
  - number: 5.4.3
    text: 'Dit besluit wordt aangehaald als: Vuurwerkbesluit.'
