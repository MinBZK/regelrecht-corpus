  - number: 1.1.3
    text: |-
      1 Dit besluit is van toepassing op vuurwerk en pyrotechnische artikelen voor theatergebruik, met uitzondering van:

      a. in beslag genomen vuurwerk en pyrotechnische artikelen voor theatergebruik die in beheer zijn bij de overheid;

      b. vuurwerk en pyrotechnische artikelen voor theatergebruik waarover door de krijgsmacht, de politie of de
      brandweer wordt beschikt ten behoeve van instructiedoeleinden;

      c. vuurwerk en pyrotechnische artikelen voor theatergebruik die in het kader van internationaal vervoer per
      zeeschip of vliegtuig binnen het grondgebied van Nederland worden gebracht en niet in Nederland worden gelost of
      rechtstreeks worden overgeladen naar een ander zeeschip onderscheidenlijk vliegtuig;

      d. vuurwerk waarvoor regels zijn gesteld bij het [Warenwetbesluit Speelgoed 2011][ref1];

      e. vuurwerk dat door een fabrikant voor eigen gebruik is vervaardigd en dat door Onze Minister uitsluitend voor
      gebruik op zijn grondgebied is goedgekeurd en dat op het grondgebied van Nederland blijft.

      2 Dit besluit is mede van toepassing op pyrotechnische artikelen van categorieën P1 en P2 die als vuurwerk worden
      gebruikt of kennelijk zijn bestemd om als vuurwerk te worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0029619
