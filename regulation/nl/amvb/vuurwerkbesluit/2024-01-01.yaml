  - number: 1.2.4
    text: |-
      1 Het is verboden vuurwerk of pyrotechnische artikelen voor theatergebruik voorhanden te hebben.

      2 Het eerste lid is niet van toepassing:

      a. tijdens de perioden dat consumentenvuurwerk, ingevolge [artikel 2.3.2][ref1] ter beschikking mag worden gesteld
      of ingevolge [artikel 2.3.6][ref2] tot ontbranding mag worden gebracht, indien niet meer dan 25 kg van dat vuurwerk
      voorhanden is;

      b. buiten de perioden, bedoeld onder a, indien niet meer dan 25 kg consumentenvuurwerk, voorhanden is op een plaats
      die niet voor het publiek toegankelijk is;

      c. tijdens het tot ontbranding brengen van professioneel vuurwerk of pyrotechnische artikelen voor theatergebruik
      overeenkomstig [artikel 3B.1][ref3], alsmede gedurende ten hoogste zestien uur daaraan voorafgaand, met dien
      verstande dat niet meer professioneel vuurwerk of pyrotechnische artikelen voor theatergebruik voorhanden zijn dan
      redelijkerwijs tot ontbranding zullen worden gebracht;

      d. gedurende ten hoogste 12 uur nadat is of zou worden aangevangen met het tot ontbranding van professioneel
      vuurwerk of pyrotechnische artikelen voor theatergebruik overeenkomstig [artikel 3B.1][ref4] en het professioneel
      vuurwerk of de pyrotechnische artikelen voor theatergebruik voorhanden zijn op een plaats die niet voor het publiek
      toegankelijk is en op een zodanige wijze dat geen gevaar voor personen is te duchten, met dien verstande dat niet
      meer professioneel vuurwerk of pyrotechnische artikelen voor theatergebruik voorhanden zijn dan redelijkerwijs tot
      ontbranding zouden worden gebracht;

      e. op een locatie waarop een milieubelastende activiteit als bedoeld in [artikel 3.30][ref5] of
      [3.286, eerste lid, onder i, van het Besluit activiteiten leefomgeving][ref6] wordt verricht, die is gemeld
      overeenkomstig [artikel 4.1030 van dat besluit][ref7] of waarvoor een omgevingsvergunning is verleend.

      3 Gedeputeerde staten van de provincie waarin het professioneel vuurwerk of de pyrotechnische artikelen voor
      theatergebruik tot ontbranding zullen worden gebracht kunnen bij de ontbrandingstoestemming in plaats van de
      tijdsduur, genoemd in het tweede lid, onder c, een andere tijdsduur vaststellen.

      4 Het eerste lid is tevens niet van toepassing indien het vuurwerk of de pyrotechnische
      artikelen voor theatergebruik worden vervoerd overeenkomstig de eisen gesteld bij of krachtens de
      [Wet vervoer gevaarlijke stoffen][ref8] en met inachtneming van [artikel 1.2.5][ref9].


