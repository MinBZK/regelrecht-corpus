  - number: 1.2.6
    text: |-
      1 Het is een ieder verboden pyrotechnische artikelen anders dan consumentenvuurwerk aan te prijzen of aan te
      bevelen:

      a. voor particulier gebruik als bedoeld in [artikel 1.2.2, zevende lid][ref1], of

      b. indien hij weet of redelijkerwijs moet vermoeden dat deze pyrotechnische artikelen zullen worden aangewend
      voor een ander gebruik dan waartoe deze gelet op de samenstelling of eigenschappen of de bijbehorende
      gebruiksaanwijzing, kennelijk geschikt zijn.

      2 Het is een ieder verboden consumentenvuurwerk aan te prijzen of aan te bevelen voor een ander gebruik dan waartoe
      het gelet op de samenstelling of eigenschappen of de bijbehorende gebruiksaanwijzing, kennelijk geschikt is.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1.2.2
