  - number: 3B.2
    text: |-
      1 De aanvraag om een toepassingsvergunning wordt langs elektronische weg ingediend. In afwijking van
      [artikel 2:15, eerste en tweede lid, van de Algemene wet bestuursrecht][ref1] neemt het bevoegd gezag een aanvraag
      die langs elektronische weg wordt ingediend, in ontvangst.

      2 Bij de aanvraag worden door de aanvrager de volgende gegevens en bescheiden langs elektronische weg verstrekt:

      a. zijn naam, adres, geboortedatum en geboorteplaats en, in voorkomend geval, de naam en het adres van de betrokken
      onderneming;

      b. gegevens waaruit blijkt dat de handelingen waarop de aanvraag betrekking heeft bedrijfsmatig worden verricht;

      c. een afschrift van een geldig certificaat van vakbekwaamheid, bedoeld in
      [artikel 4.9, tweede lid, van het Arbeidsomstandighedenbesluit][ref2], dat is afgegeven aan de persoon door wie
      of onder wiens voortdurend toezicht de handelingen, waarop de aanvraag betrekking heeft, worden verricht en dat
      betrekking heeft op die handelingen;

      d. de handelingen en de soorten vuurwerk of pyrotechnische artikelen voor theatergebruik waarop de aanvraag
      betrekking heeft;

      e. een verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref3] over hemzelf, die niet ouder is dan zes
      maanden.

      3 De aanvrager stelt naar het oordeel van het bevoegd gezag bij de aanvraag op genoegzame wijze
      door verzekering of anderszins financiële zekerheid ter dekking van de aansprakelijkheid, bedoeld in
      [boek 6 van het Burgerlijk Wetboek][ref4] ter zake van de in het tweede lid, onder b, bedoelde handelingen.

      4 De zekerheid bedraagt ten minste € 2 500 000,00 per gebeurtenis en wordt in ieder geval in stand gehouden tot het
      moment waarop de vergunning vervalt. De verzekering is gesloten bij een financiële onderneming die op grond van de
      Wet op het financieel toezicht in Nederland het bedrijf van verzekeraar mag uitoefenen.

      5 Met een verklaring omtrent het gedrag als bedoeld in het tweede lid, onder e, wordt gelijkgesteld een verklaring
      omtrent het gedrag afgegeven door een daartoe bevoegde instantie in een andere lidstaat van de Europese Unie dan
      wel in een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een daartoe strekkend of mede
      daartoe strekkend verdrag dat Nederland bindt, op basis van onderzoekingen of documenten die een beschermingsniveau
      bieden dat ten minste gelijkwaardig is aan het beschermingsniveau dat met de nationale onderzoekingen of documenten
      wordt geboden, mits die verklaring niet ouder is dan zes maanden.

      6 De aanvrager kan de gegevens en bescheiden, bedoeld in het tweede lid, op schriftelijke wijze verstrekken, voor
      zover het bevoegd gezag daarvoor toestemming heeft gegeven.

      7 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de wijze waarop een aanvraag langs
      elektronische weg wordt ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel215
