  - number: 3A.3.1
    text: >-
      1 Het is verboden pyrotechnische artikelen voor theatergebruik aan een ander ter beschikking te stellen.


      2 Het verbod geldt niet voor het ter beschikking stellen aan een persoon met gespecialiseerde kennis die gerechtigd
      is de pyrotechnische artikelen voor theatergebruik op te slaan of te bewerken, dan wel, indien de betrokken persoon
      de artikelen tot ontbranding zal brengen, gerechtigd is de artikelen tot ontbranding te brengen.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel3A.3.1
  - number: 3B.1
    text: |-
      1 Met uitzondering van de situatie, bedoeld in [artikel 2.3.6][ref1], is het verboden zonder een daartoe verleende
      vergunning vuurwerk of pyrotechnische artikelen voor theatergebruik tot ontbranding te brengen, ten behoeve daarvan
      op te bouwen, te installeren, te bewerken, dan wel na ontbranding te verwijderen.

      2 Onze Minister beslist op een aanvraag om een toepassingsvergunning.

      3 Aan de toepassingsvergunning wordt het voorschrift verbonden dat:

      a. voorafgaand aan het tot ontbranding brengen van vuurwerk of pyrotechnische artikelen voor theatergebruik door
      de aanvrager toestemming is verkregen van gedeputeerde staten van de provincie waarin de artikelen tot ontbranding
      zullen worden gebracht en de aan de toestemming verbonden voorschriften worden nageleefd;

      b. het tot ontbranding te brengen vuurwerk en de tot ontbranding te brengen pyrotechnische artikelen
      voor theatergebruik afkomstig zijn van een locatie waarop een milieubelastende activiteit als bedoeld in
      [artikel 3.30 van het Besluit activiteiten leefomgeving][ref2] wordt verricht, die is gemeld overeenkomstig
      [artikel 4.1030 van dat besluit][ref3] of waarvoor een omgevingsvergunning is verleend geldt, dan wel rechtstreeks
      afkomstig zijn uit het buitenland.

      4 Aan de toepassingsvergunning worden voorts voorschriften verbonden in het belang van de bescherming van de
      gezondheid van de mens en van het milieu. Zij kan onder beperkingen worden verleend.

      5 Degene aan wie een toepassingsvergunning is verleend, is gehouden de in het derde en vierde lid bedoelde
      voorschriften na te leven.

      6 De toepassingsvergunning vervalt op het moment dat de geldigheidsduur van het certificaat van vakbekwaamheid,
      bedoeld in [artikel 3B.2, tweede lid, onder c][ref4], afloopt. Is de toepassingsvergunning verleend aan een
      onderneming dan vervalt de toepassingsvergunning eveneens op het moment dat er geen persoon aan wie een certificaat
      van vakbekwaamheid, bedoeld in [artikel 4.9, tweede lid, van het Arbeidsomstandighedenbesluit][ref5], is afgegeven,
      meer werkzaam is voor de onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2.3.6
      [ref2]: https://wetten.overheid.nl/BWBR0041330#Artikel3.30
      [ref3]: https://wetten.overheid.nl/BWBR0041330#Artikel4.1030
      [ref4]: https://wetten.overheid.nl/BWBR0013360#Artikel3B.2
      [ref5]: https://wetten.overheid.nl/BWBR0008498#Artikel4.9
