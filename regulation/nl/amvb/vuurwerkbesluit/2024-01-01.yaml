  - number: 1A.2.2
    text: |-
      1 [Artikel 1A.2.1][ref1] is niet van toepassing op vuurwerk en pyrotechnische artikelen voor theatergebruik die
      niet in overeenstemming zijn met de bepalingen van EU-richtlijn pyrotechnische artikelen en die worden getoond en
      gebruikt op handelsbeurzen, tentoonstellingen en demonstraties voor het verhandelen van vuurwerk en pyrotechnische
      artikelen voor theatergebruik, mits is voldaan aan het bepaalde in het derde lid.

      2 Artikelen als bedoeld in het eerste lid mogen pas verkocht worden nadat ze in overeenstemming zijn gebracht met
      de bepalingen van de EU-richtlijn pyrotechnische artikelen.

      3 Op de artikelen, bedoeld in het eerste lid:

      a. wordt een zichtbaar teken aangebracht waaruit duidelijk de naam en de datum van de handelsbeurs, tentoonstelling
      of demonstratie blijken;

      b. is aangegeven dat de artikelen niet in overeenstemming zijn met de bepalingen van de EU-richtlijn pyrotechnische
      artikelen en niet verkocht mogen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A.2.1
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.2.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 1A.2.1
        hoofdstuk: 1a
        paragraaf: '2'
  - number: 1A.2.3
    text: |-
      1 [Artikel 1A.2.1][ref1] is niet van toepassing op vuurwerk en pyrotechnische artikelen voor theatergebruik die
      voor onderzoeks-, ontwikkelings- en testdoeleinden zijn geproduceerd en niet met de bepalingen van de EU-richtlijn
      pyrotechnische artikelen in overeenstemming zijn. Deze artikelen mogen vrij circuleren en worden gebruikt, mits is
      voldaan aan het bepaalde in het derde lid.

      2 Artikelen als bedoeld in het eerste lid mogen niet beschikbaar worden gesteld of worden gebruikt voor andere
      doeleinden dan voor ontwikkeling, tests en onderzoek.

      3 Op de artikelen, bedoeld in het eerste lid, wordt een zichtbaar teken aangebracht waaruit duidelijk blijkt dat
      ze niet in overeenstemming zijn met de bepalingen van de EU-richtlijn pyrotechnische artikelen en niet beschikbaar
      zijn voor andere doeleinden dan voor ontwikkeling, tests en onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A.2.1
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.2.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 1A.2.1
        hoofdstuk: 1a
        paragraaf: '2'
  - number: 1A.2A.1
    text: >-
      De fabrikant waarborgt dat vuurwerk en pyrotechnische artikelen voor theatergebruik worden ontworpen en vervaardigd
      overeenkomstig de essentiële veiligheidseisen.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.2A.1
  - number: 1A.2A.2
    text: |-
      1 De fabrikant stelt de technische documentatie, genoemd in bijlage II bij de EU-richtlijn pyrotechnische
      artikelen op en laat de toepasselijke conformiteitsbeoordelingsprocedure uitvoeren, overeenkomstig de
      [artikelen 1A.3.1][ref1] en [1A.3.2][ref2].

      2 Wanneer met de conformiteitsbeoordelingsprocedure is aangetoond dat vuurwerk of een pyrotechnisch artikel voor
      theatergebruik aan de toepasselijke eisen voldoet, stelt de fabrikant een EU-conformiteitsverklaring op en brengt
      hij de CE-markering aan.

      3 De fabrikant bewaart de technische documentatie en de EU-conformiteitsverklaring gedurende tien jaar nadat het
      vuurwerk of pyrotechnische artikel voor theatergebruik in de handel is gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel1A.3.2
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.2A.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 1A.3.1
        hoofdstuk: 1a
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: 1A.3.2
        hoofdstuk: 1a
        paragraaf: '3'
  - number: 1A.2A.3
    text: >-
      De fabrikant zorgt ervoor dat hij beschikt over procedures om de conformiteit van zijn serieproductie met EU-
      richtlijn pyrotechnische artikelen te blijven waarborgen. Er wordt terdege rekening gehouden met veranderingen
      in het ontwerp of in de kenmerken van het vuurwerk of het pyrotechnische artikel voor theatergebruik
      en met veranderingen in de geharmoniseerde normen of andere technische specificaties waarnaar in de EU-
      conformiteitsverklaring van het vuurwerk of het pyrotechnische artikel voor theatergebruik wordt verwezen.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.2A.3
  - number: 1A.2A.4
    text: >-
      1 Met een met redenen omkleed verzoek kan de bevoegde autoriteit een of meer van de volgende maatregelen van de
      fabrikant vergen:


      a. het uitvoeren van steekproeven op in de handel gebracht vuurwerk of in de handel gebrachte pyrotechnische
      artikelen voor theatergebruik;


      b. het onderzoeken van klachten;


      c. het onderzoeken van niet-conform vuurwerk of niet-conforme pyrotechnische artikelen voor theatergebruik;


      d. het onderzoeken van teruggeroepen vuurwerk of pyrotechnische artikelen voor theatergebruik;


      e. het bijhouden van een register met betrekking tot de onder b, c, en d bedoelde onderzoeken;


      f. het op de hoogte houden van de distributeurs betreffende de genomen maatregelen.


      2 De bevoegde autoriteit kan het in het eerste lid bedoelde verzoek doen als dit gezien de risico’s van het
      vuurwerk of de pyrotechnische artikelen voor theatergebruik passend wordt geacht.


      3 De fabrikant voert de maatregelen uit met het oog op de bescherming van de gezondheid en veiligheid van de
      consumenten.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.2A.4
  - number: 1A.2A.5
    text: |-
      De fabrikant zorgt ervoor dat door hem in de handel gebracht vuurwerk of pyrotechnisch artikelvoor theatergebruik
      is geëtiketteerd overeenkomstig de [artikelen 2.1.3][ref1], [3.1.1][ref2] of [3A.1.1][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel3.1.1
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel3A.1.1
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.2A.5
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: 3.1.1
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0013360
        artikel: 3A.1.1
        hoofdstuk: 3a
        paragraaf: '1'
  - number: 1A.2A.6
    text: >-
      Indien de fabrikant van mening is of redenen heeft om aan te nemen dat door hem in de handel gebracht vuurwerk
      of een door hem in de handel gebracht pyrotechnisch artikel voor theatergebruik niet in overeenstemming is met de
      eisen bij of krachtens dit besluit:


      a. neemt hij onmiddellijk alle corrigerende maatregelen die nodig zijn om het vuurwerk of pyrotechnisch artikel
      voor theatergebruik in overeenstemming te brengen met deze eisen of, zo nodig, uit de handel te nemen of terug te
      roepen, en


      b. brengt hij, indien het artikel een risico vertoont, de bevoegde autoriteiten van de lidstaten waar hij het
      artikel op de markt heeft aangeboden, hiervan onmiddellijk op de hoogte. Indien hij het artikel in Nederland op
      de markt heeft aangeboden, brengt hij de bevoegde autoriteit op de hoogte. Hierbij beschrijft hij in het bijzonder
      uitvoerig de niet-conformiteit en alle genomen corrigerende maatregelen.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.2A.6
  - number: 1A.2A.7
    text: >-
      1 Op een met redenen omkleed verzoek van de bevoegde autoriteit of de bevoegde autoriteiten van andere lidstaten:


      a. verstrekt de fabrikant aan deze autoriteit alle benodigde informatie en documentatie om de conformiteit van
      vuurwerk of pyrotechnische artikelen voor theatergebruik met de eisen gesteld bij of krachtens dit besluit aan te
      tonen, en


      b. verleent de fabrikant medewerking aan alle genomen maatregelen om de risico’s van de door hem in de handel
      gebracht vuurwerk of door hem in de handel gebrachte pyrotechnische artikelen voor theatergebruik, uit te sluiten.


      2 De informatie en documentatie wordt op papier of elektronisch ter beschikking van de autoriteiten, bedoeld in het
      eerste lid, gesteld. Deze wordt gesteld in de Nederlandse of Engelse taal.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.2A.7
  - number: 1A.2A.8
    text: >-
      Een importeur of een distributeur wordt als fabrikant beschouwd en voldoet aan de verplichtingen overeenkomstig dit
      hoofdstuk, wanneer hij vuurwerk of een pyrotechnisch artikel voor theatergebruik onder zijn eigen naam of merknaam
      in de handel brengt, of reeds in de handel gebracht vuurwerk of een reeds in de handel gebracht pyrotechnisch
      artikel voor theatergebruik zodanig wijzigt dat de conformiteit met de essentiële veiligheidseisen in het geding
      komt.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.2A.8
  - number: 1A.2B.1
    text: >-
      De importeur brengt alleen vuurwerk en pyrotechnische artikelen voor theatergebruik in de handel die aan de
      essentiële veiligheidseisen voldoen.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.2B.1
  - number: 1A.2B.2
    text: |-
      Alvorens vuurwerk of een pyrotechnisch artikel voor theatergebruik in de handel wordt gebracht:

      a. vergewist de importeur zich ervan dat de fabrikant de conformiteitsbeoordelingsprocedure heeft uitgevoerd;

      b. zorgt de importeur ervoor dat de fabrikant de technische documentatie heeft opgesteld;

      c. zorgt de importeur ervoor dat het vuurwerk of pyrotechnisch artikel voor theatergebruik is voorzien van de CE-
      markering en vergezeld gaat van de voorgeschreven documenten; en

      d. zorgt de importeur ervoor dat de fabrikant het vuurwerk of pyrotechnisch artikel voor theatergebruik heeft
      geëtiketteerd overeenkomstig de [artikelen 2.1.3][ref1], [3.1.1][ref2] of [3A.1.1][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel3.1.1
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel3A.1.1
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.2B.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: 3.1.1
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0013360
        artikel: 3A.1.1
        hoofdstuk: 3a
        paragraaf: '1'
  - number: 1A.2B.3
    text: >-
      De importeur die van mening is of redenen heeft om aan te nemen dat vuurwerk of een pyrotechnisch artikel voor
      theatergebruik niet in overeenstemming is met de essentiële veiligheidseisen:


      a. brengt het vuurwerk of pyrotechnisch artikel voor theatergebruik niet in de handel alvorens het in
      overeenstemming is gemaakt met de essentiële veiligheidseisen, en


      b. brengt de fabrikant en de markttoezichthouder op de hoogte, indien het vuurwerk of pyrotechnisch artikel voor
      theatergebruik een risico vertoont.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.2B.3
  - number: 1A.2B.4
    text: |-
      De importeur voldoet aan de aan hem gestelde eisen ingevolge de [artikelen 2.1.3, eerste lid, onder d][ref1],
      [3.1.1, eerste lid, onder d][ref2], of [3A.1.1, eerste lid, onder d][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel3.1.1
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel3A.1.1
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.2B.4
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: 3.1.1
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0013360
        artikel: 3A.1.1
        hoofdstuk: 3a
        paragraaf: '1'
  - number: 1A.2B.5
    text: >-
      De importeur zorgt, gedurende de periode dat hij voor vuurwerk of pyrotechnische artikelen voor theatergebruik
      verantwoordelijk is, voor zodanige opslag- en vervoersomstandigheden ervan dat de conformiteit van het
      pyrotechnische artikel met de essentiële veiligheidseisen niet in het geding komt.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.2B.5
  - number: 1A.2B.6
    text: >-
      1 Met een met redenen omkleed verzoek kan de bevoegde autoriteit een of meer van de volgende maatregelen van de
      importeur vergen:


      a. het uitvoeren van steekproeven op in de handel gebracht vuurwerk of in de handel gebrachte pyrotechnische
      artikelen voor theatergebruik;


      b. het onderzoeken van klachten;


      c. het onderzoeken van niet-conform vuurwerk of niet-conforme pyrotechnische artikelen voor theatergebruik;


      d. het onderzoeken van teruggeroepen vuurwerk of pyrotechnische artikelen voor theatergebruik;


      e. het bijhouden van een register met betrekking tot de onder b, c, en d bedoelde onderzoeken;


      f. het op de hoogte houden van de distributeurs betreffende de genomen maatregelen.


      2 De bevoegde autoriteit kan het verzoek, bedoeld in het eerste lid, doen als dit gezien de risico’s van het
      vuurwerk of de pyrotechnische artikelen voor theatergebruik passend wordt geacht.


      3 De importeur voert de maatregelen uit met het oog op de bescherming van de gezondheid en veiligheid van de
      consumenten.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.2B.6
  - number: 1A.2B.7
    text: >-
      Indien een importeur van mening is of redenen heeft om aan te nemen dat door hem in de handel gebracht vuurwerk
      of een door hem in de handel gebracht pyrotechnisch artikel voor theatergebruik, niet in overeenstemming is met de
      eisen gesteld bij of krachtens dit besluit:


      a. neemt hij onmiddellijk alle corrigerende maatregelen die nodig zijn om dat vuurwerk of pyrotechnisch artikel
      voor theatergebruik in overeenstemming te maken met die eisen of zo nodig uit de handel te nemen of terug te
      roepen; en


      b. brengt hij, indien het artikel een risico vertoont, de bevoegde autoriteiten van de lidstaten waar hij het
      artikel op de markt heeft aangeboden, hiervan onmiddellijk op de hoogte. Indien hij de artikelen in Nederland
      op de markt heeft aangeboden, brengt hij de bevoegde autoriteit onmiddellijk op de hoogte. Hierbij beschrijft de
      importeur in het bijzonder uitvoerig de niet-conformiteit en alle genomen corrigerende maatregelen.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.2B.7
  - number: 1A.2B.8
    text: >-
      De importeur houdt gedurende tien jaar nadat het vuurwerk of pyrotechnisch artikel voor theatergebruik in de handel
      is gebracht, een kopie van de EU-conformiteitsverklaring ter beschikking van de markttoezichthouder en zorgt ervoor
      dat de technische documentatie op verzoek aan de markttoezichthouder kan worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.2B.8
  - number: 1A.2B.9
    text: >-
      1 Op een met redenen omkleed verzoek van de bevoegde autoriteit of de bevoegde autoriteiten van andere lidstaten:


      a. verstrekt de importeur alle benodigde informatie en documentatie om de conformiteit van vuurwerk of
      pyrotechnische artikelen voor theatergebruik met de eisen gesteld bij of krachtens dit besluit aan te tonen; en


      b. verleent de importeur medewerking aan alle genomen maatregelen om de risico’s van door hem in de handel gebracht
      vuurwerk of door hem in de handel gebrachte pyrotechnische artikelen voor theatergebruik uit te sluiten.


      2 De informatie en documentatie wordt op papier of elektronisch ter beschikking van de autoriteiten, bedoeld in het
      eerste lid, gesteld. Deze worden gesteld in de Nederlandse of Engelse taal.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.2B.9
  - number: 1A.2C.1
    text: >-
      De distributeur die vuurwerk of pyrotechnische artikelen voor theatergebruik op de markt aanbiedt, neemt de nodige
      zorgvuldigheid in acht ten aanzien van de eisen in dit besluit.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.2C.1
  - number: 1A.2C.2
    text: |-
      Alvorens vuurwerk of pyrotechnische artikelen voor theatergebruik op de markt aan te bieden, controleert de
      distributeur of:

      a. het artikel is voorzien van een CE-markering;

      b. het artikel vergezeld gaat van de voorgeschreven documenten en van instructies en informatie
      aangaande de veiligheid, overeenkomstig [artikel 2.1.3, eerste lid, onder j, en tweede lid][ref1],
      [artikel 3.1.1, eerste lid, onder i, en tweede lid][ref2], en
      [artikel 3A.1.1, eerste lid, onder i, en tweede lid][ref3];

      c. de fabrikant en de importeur aan de verplichtingen ingevolge[ artikel 2.1.3][ref4], [3.1.1][ref5] en
      [3A.1.1][ref6] hebben voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel3.1.1
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel3A.1.1
      [ref4]: https://wetten.overheid.nl/BWBR0013360#Artikel2.1.3
      [ref5]: https://wetten.overheid.nl/BWBR0013360#Artikel3.1.1
      [ref6]: https://wetten.overheid.nl/BWBR0013360#Artikel3A.1.1
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.2C.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: 3.1.1
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0013360
        artikel: 3A.1.1
        hoofdstuk: 3a
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0013360
        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0013360
        artikel: 3.1.1
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref6
        bwb_id: BWBR0013360
        artikel: 3A.1.1
        hoofdstuk: 3a
        paragraaf: '1'
  - number: 1A.2C.3
    text: >-
      De distributeur die van mening is of redenen heeft om aan te nemen dat vuurwerk of pyrotechnische artikelen voor
      theatergebruik niet in overeenstemming zijn met de essentiële veiligheidseisen:


      a. biedt het vuurwerk of pyrotechnische artikel voor theatergebruik niet op de markt aan alvorens het in
      overeenstemming is gemaakt met de essentiële veiligheidseisen, en


      b. brengt de fabrikant, de importeur en de markttoezichthouder hiervan op de hoogte, indien het vuurwerk of
      pyrotechnische artikel voor theatergebruik een risico vertoont.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.2C.3
  - number: 1A.2C.4
    text: >-
      De distributeur zorgt gedurende de periode dat hij voor vuurwerk of pyrotechnische artikelen voor theatergebruik
      verantwoordelijk is, voor zodanige opslag- en vervoersomstandigheden ervan dat de conformiteit van het artikel met
      de essentiële veiligheidseisen niet in het gedrang komt.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.2C.4
  - number: 1A.2C.5
    text: >-
      Indien een distributeur van mening is, of redenen heeft om aan te nemen, dat door hem op de markt aangeboden
      vuurwerk of pyrotechnisch artikel voor theatergebruik niet in overeenstemming is met de eisen gesteld bij of
      krachtens dit besluit:


      a. ziet hij erop toe dat de nodige corrigerende maatregelen worden genomen om die artikelen in overeenstemming te
      maken of zo nodig uit de handel te nemen of terug te roepen; en


      b. brengt hij, indien het artikel een risico vertoont, de bevoegde autoriteiten van de lidstaten waar hij het
      artikel op de markt heeft aangeboden hiervan onmiddellijk op de hoogte. Indien hij de artikelen in Nederland op
      de markt heeft aangeboden, brengt hij de bevoegde autoriteit op de hoogte. Hierbij beschrijft hij in het bijzonder
      uitvoerig de niet-conformiteit en alle genomen corrigerende maatregelen.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.2C.5
  - number: 1A.2C.6
    text: >-
      1 Op een met redenen omkleed verzoek van de bevoegde autoriteit of bevoegde autoriteiten van andere lidstaten:


      a. verstrekt de distributeur deze autoriteit alle benodigde informatie en documentatie om de conformiteit van
      vuurwerk of een pyrotechnisch artikel voor theatergebruik met de eisen gesteld bij of krachtens dit besluit aan te
      tonen; en


      b. verleent de distributeur medewerking aan alle genomen maatregelen om de risico’s van de door hem in de handel
      gebrachte artikelen uit te sluiten.


      2 De informatie en documentatie, genoemd in het eerste lid, onder a, wordt op papier of elektronisch ter
      beschikking van de autoriteiten, genoemd in het eerste lid, gesteld.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.2C.6
  - number: 1A.2D.1
    text: >-
      1 Op verzoek van de bevoegde autoriteit verstrekken de marktdeelnemers de volgende informatie:


      a. welke marktdeelnemer vuurwerk of pyrotechnische artikelen voor theatergebruik aan hen heeft geleverd; en


      b. aan welke marktdeelnemer zij vuurwerk of pyrotechnische artikelen voor theatergebruik hebben geleverd.


      2 De marktdeelnemers houden de informatie, genoemd in het eerste lid, ten minste tien jaar nadat het vuurwerk of
      het pyrotechnische artikel voor theatergebruik aan de marktdeelnemers is geleverd, dan wel nadat de marktdeelnemers
      het vuurwerk of het pyrotechnische artikel voor theatergebruik heeft geleverd, ter beschikking van de bevoegde
      autoriteit.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.2D.1
  - number: 1A.2E.1
    text: |-
      1 De fabrikant etiketteert vuurwerk en pyrotechnische artikelen voor theatergebruik met een registratienummer dat
      de volgende elementen bevat:

      a. het viercijferig identificatienummer van de aangemelde instantie die het volgende heeft opgesteld:

      1°. de verklaring van EU-typeonderzoek in overeenstemming met de conformiteitsbeoordelingsprocedure, bedoeld in
      [artikel 1A.3.2, onder a][ref1] (module B);

      2°. de verklaring van overeenstemming, overeenkomstig de conformiteitsbeoordelingsprocedure, bedoeld in
      [artikel 1A.3.2, onder b][ref2] (module G);

      3°. de goedkeuring van het kwaliteitssysteem, in overeenkomst met de conformiteitsbeoordelingsprocedure, bedoeld in
      [artikel 1A.3.2, onder c][ref3] (module H).

      b. de afkorting van de categorie in hoofdletters van de categorie vuurwerk of pyrotechnische artikelen voor
      theatergebruik waarvoor de conformiteit is gecertificeerd:

      1°. F1, F2, F3 of F4 voor vuurwerk uit de desbetreffende categorieën vuurwerk;

      2°. T1 of T2 voor pyrotechnische artikelen voor theatergebruik voor de desbetreffende categorieën pyrotechnische
      artikelen voor theatergebruik;

      c. het verwerkingsnummer dat door de aangemelde instantie voor het pyrotechnische artikel wordt gebruikt.

      2 De structuur van het registratienummer is «XXXX-YY-ZZZZ...», waarbij XXXX verwijst naar het element, genoemd
      in het eerste lid, onder a, YY naar het element, genoemd in het eerste lid, onder b, en ZZZZ... naar het element,
      genoemd in het eerste lid, onder c.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A.3.2
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel1A.3.2
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel1A.3.2
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.2E.1
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 1A.3.2
        hoofdstuk: 1a
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: 1A.3.2
        hoofdstuk: 1a
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0013360
        artikel: 1A.3.2
        hoofdstuk: 1a
        paragraaf: '3'
  - number: 1A.2E.2
    text: >-
      Fabrikanten en importeurs van vuurwerk en pyrotechnische artikelen voor theatergebruik:


      a. houden een register bij met alle registratienummers van vuurwerk of pyrotechnische artikelen voor theatergebruik
      die zij hebben vervaardigd of ingevoerd, vergezeld van de handelsnaam, het algemene type en, indien van toepassing,
      het subtype, en de plaats van vervaardiging. Deze informatie wordt ten minste tien jaar nadat het artikel in de
      handel is gebracht bijgehouden;


      b. dragen het register over aan Onze Minister indien zij hun activiteiten staken;


      c. verstrekken de bevoegde autoriteit, de markttoezichthouder en bevoegde autoriteiten en markttoezichtautoriteiten
      van andere lidstaten, op hun met redenen omkleed verzoek, het register, genoemd onder a.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.2E.2
  - number: 1A.2F.1
    text: >-
      1 Indien de marktdeelnemer van de markttoezichthouder verneemt dat vuurwerk of een pyrotechnisch artikel voor
      theatergebruik, dat weliswaar in overeenstemming is met de essentiële veiligheidseisen en overige bepalingen van
      dit Besluit, toch een risico vormt voor de gezondheid of veiligheid van personen of voor andere aspecten van de
      bescherming van algemene belangen:


      a. neemt hij alle passende maatregelen om ervoor te zorgen dat dit vuurwerk of dit pyrotechnische artikel voor
      theatergebruik dat risico niet meer meebrengt wanneer zij in de handel worden gebracht, of


      b. neemt hij, binnen een door de markttoezichthouder vast te stellen termijn, dit vuurwerk of dit pyrotechnische
      artikel voor theatergebruik uit de handel of roept hij deze terug.


      2 De marktdeelnemer zorgt ervoor dat door hem genomen corrigerende maatregelen worden toegepast op alle betrokken
      vuurwerk of pyrotechnische artikelen voor theatergebruik die hij in de Europese Unie op de markt heeft aangeboden.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.2F.1
  - number: 1A.3.1
    text: >-
      1 Vuurwerk en pyrotechnische artikelen voor theatergebruik worden onderworpen aan een
      conformiteitsbeoordelingsprocedure overeenkomstig bijlage II bij de EU-richtlijn pyrotechnische artikelen.


      2 De fabrikant voldoet aan de verplichtingen die uit hoofde van bijlage II bij de EU-richtlijn pyrotechnische
      artikelen aan hem worden gesteld.


      3 De aangewezen instantie voldoet aan de verplichtingen die uit hoofde van bijlage II bij de EU-richtlijn
      pyrotechnische artikelen aan haar worden gesteld.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.3.1
  - number: 1A.3.2
    text: >-
      De fabrikant kiest een van de navolgende conformiteitsbeoordelingsprocedures, volgens welke de door hem gekozen
      aangemelde instantie de conformiteitsbeoordelingsprocedure uitvoert:


      a. het EU-typeonderzoek (module B), en naar keuze van de fabrikant een van de volgende procedures:


      1°. conformiteit met het type op basis van interne productiecontrole plus productcontroles onder toezicht met
      willekeurige tussenpozen (module C2);


      2°. conformiteit met het type op basis van de kwaliteitsborging van het productieproces (module D); of


      3°. conformiteit met het type op basis van productkwaliteitsborging (module E);


      b. conformiteit op basis van eenheidskeuring (module G);


      c. conformiteit op basis van volledige kwaliteitsborging (module H), voor zover het gaat om vuurwerk van categorie
      F4.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.3.2
  - number: 1A.4.1
    text: >-
      1 De CE-markering wordt zichtbaar, leesbaar en onuitwisbaar op het vuurwerk of het pyrotechnische artikel voor
      theatergebruik aangebracht. Wanneer dit gezien de aard van het artikel niet mogelijk of niet gerechtvaardigd is,
      wordt de CE-markering aangebracht op de verpakking en in de begeleidende documenten.


      2 De CE-markering wordt aangebracht voordat het vuurwerk of pyrotechnische artikel voor theatergebruik in de handel
      wordt gebracht.


      3 Indien de aangemelde instantie betrokken is geweest bij de productiecontrolefase, wordt de CE-markering gevolgd
      door het identificatienummer van die aangemelde instantie.


      4 Het identificatienummer, bedoeld in het derde lid, wordt aangebracht door de aangemelde instantie zelf, dan wel
      overeenkomstig haar instructies door de fabrikant.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.4.1
  - number: 1A.4.2
    text: >-
      1 In de EU-conformiteitsverklaring wordt vermeld dat is aangetoond dat aan de essentiële veiligheidseisen is
      voldaan.


      2 De EU-conformiteitsverklaring:


      a. komt qua structuur overeen met het model van bijlage III bij de EU-richtlijn pyrotechnische artikelen;


      b. bevat de in de desbetreffende modules van bijlage II bij de EU-richtlijn pyrotechnische artikelen vermelde
      elementen;


      c. wordt voortdurend bijgewerkt;


      d. wordt vertaald in de taal of talen zoals gevraagd door de lidstaat waar het vuurwerk of het pyrotechnische
      artikel voor theatergebruik in de handel wordt gebracht of op de markt wordt aangeboden.


      3 De EU-conformiteitsverklaring die betrekking heeft op vuurwerk of pyrotechnische artikelen voor theatergebruik
      die binnen het grondgebied van Nederland in de handel worden gebracht of op de markt worden aangeboden, is gesteld
      in de Nederlandse taal.


      4 Indien voor vuurwerk of pyrotechnische artikelen voor theatergebruik uit hoofde van meer dan één handeling van
      de Europese Unie een EU-conformiteitsverklaring vereist is, wordt één EU-conformiteitsverklaring met betrekking
      tot al die handelingen van de Europese Unie opgesteld. In die verklaring moet duidelijk worden aangegeven om welke
      handelingen van de Europese Unie het gaat, met vermelding van de publicatiereferenties ervan.


      5 Door de EU-conformiteitsverklaring op te stellen neemt de fabrikant de verantwoordelijkheid voor de conformiteit
      van het vuurwerk of het pyrotechnische artikel voor theatergebruik met de eisen van de EU-richtlijn pyrotechnische
      artikelen op zich.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.4.2
  - number: 1A.4a.1
    text: >-
      1 Het is verboden vuurwerk of pyrotechnische artikelen voor theatergebruik waarop de EU-verordening markttoezicht
      van toepassing is, in de handel te brengen in strijd met artikel 4, eerste lid, van die verordening.


      2 Het is de fabrikant, de importeur, de gemachtigde die is aangewezen om de in artikel 4, derde lid, van de EU-
      verordening markttoezicht vermelde taken namens de fabrikant te verrichten, of de fulfilmentdienstverlener ten
      aanzien van vuurwerk of pyrotechnische artikelen voor theatergebruik bedoeld in het eerste lid, verboden te
      handelen in strijd met artikel 4, derde en vierde lid, van de EU-verordening markttoezicht.


      3 Het is de gemachtigde, bedoeld in het tweede lid, verboden te handelen in strijd met artikel 5, tweede lid, van
      de EU-verordening markttoezicht.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.4a.1
  - number: 1A.4a.2
    text: >-
      1 Het is een marktdeelnemer die betrokken is of is geweest bij het op de markt brengen van vuurwerk of
      pyrotechnische artikelen voor theatergebruik waarop de EU-verordening markttoezicht van toepassing is, verboden in
      strijd te handelen met artikel 7, eerste lid, van die verordening.


      2 Het is een aanbieder van diensten van de informatiemaatschappij die betrokken is of is geweest bij het online te
      koop aanbieden van vuurwerk of pyrotechnische artikelen voor theatergebruik waarop de EU-verordening markttoezicht
      van toepassing is, verboden in strijd te handelen met artikel 7, tweede lid, van die verordening.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.4a.2
  - number: 1A.5.1
    text: |-
      1 Onze Minister kan een instantie, die hiertoe een verzoek heeft ingediend overeenkomstig [artikel 1A.5.2][ref1],
      aanwijzen die bevoegd is tot het uitvoeren van de conformiteitsbeoordelingsprocedure. Onze Minister meldt de
      aangewezen instantie aan overeenkomstig artikel 21 van de EU-richtlijn pyrotechnische artikelen.

      2 De aangewezen instantie voldoet aan de eisen, genoemd in de [artikelen 1A.5.3 tot en met 1A.5.10][ref2].

      3 Aan de aanwijzing kunnen voorschriften worden verbonden ter uitvoering van de eisen, genoemd in de
      [artikelen 1A.5.3 tot en met 1A.5.10][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A.5.2
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel1A.5.3
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel1A.5.3
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.5.1
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 1A.5.2
        hoofdstuk: 1a
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: 1A.5.3
        hoofdstuk: 1a
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0013360
        artikel: 1A.5.3
        hoofdstuk: 1a
        paragraaf: '5'
  - number: 1A.5.2
    text: |-
      1 Een instantie die wenst te worden aangewezen in de zin van [artikel 1A.5.1, eerste lid][ref1], dient een verzoek
      tot aanwijzing in bij Onze Minister.

      2 Het verzoek tot aanwijzing, genoemd in het eerste lid, gaat vergezeld van:

      a. een beschrijving van de conformiteitsbeoordelingsactiviteiten, de conformiteitbeoordelingsmodule(s), genoemd
      in bijlage II bij de EU-richtlijn pyrotechnische artikelen en het pyrotechnische artikel of de pyrotechnische
      artikelen waarvoor de instantie verklaart bekwaam te zijn, en

      b. het accreditatiecertificaat dat is afgegeven door een nationale accreditatie-instantie, waarin wordt verklaard
      dat de instantie voldoet aan de eisen, genoemd in de [artikelen 1A.5.3 tot en met 1A.5.10][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A.5.1
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel1A.5.3
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.5.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 1A.5.1
        hoofdstuk: 1a
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: 1A.5.3
        hoofdstuk: 1a
        paragraaf: '5'
  - number: 1A.5.3
    text: >-
      1 De aangewezen instantie is onafhankelijk van de door haar beoordeelde organisaties en het door haar beoordeeld
      vuurwerk of de door haar beoordeelde pyrotechnische artikelen voor theatergebruik.


      2 De aangewezen instantie, haar hoogste leidinggevenden en het personeel dat de conformiteitsbeoordelingstaken
      verricht, zijn niet de ontwerper, fabrikant, leverancier, installateur, koper, eigenaar, gebruiker of onderhouder
      van het vuurwerk, de pyrotechnische artikelen voor theatergebruik, of explosieve stoffen, noch de vertegenwoordiger
      van een van die partijen. Dit belet echter niet het gebruik van pyrotechnische artikelen of explosieve stoffen die
      nodig zijn voor de activiteiten van de aangewezen instantie of het gebruik van vuurwerk of pyrotechnische artikelen
      voor theatergebruik voor persoonlijke doeleinden.


      3 De aangewezen instantie, haar hoogste leidinggevenden en het personeel dat de conformiteitsbeoordelingstaken
      verricht, zijn niet rechtstreeks of als vertegenwoordiger van de betrokken partijen betrokken bij het ontwerpen,
      vervaardigen of bouwen, verhandelen, installeren, gebruiken of onderhouden van vuurwerk, pyrotechnische artikelen
      voor theatergebruik of explosieve stoffen. Zij oefenen geen activiteiten uit die hun onafhankelijke oordeel of hun
      integriteit met betrekking tot conformiteitsbeoordelingsactiviteiten waarvoor zij zijn aangewezen in het gedrang
      kunnen brengen. Dit geldt met name voor adviesdiensten.


      4 De aangewezen instantie waarborgt dat activiteiten van haar dochterondernemingen of onderaannemers geen afbreuk
      doen aan de vertrouwelijkheid, objectiviteit of onpartijdigheid van de conformiteitsbeoordelingsactiviteiten die de
      aangewezen instantie verricht;
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.5.3
  - number: 1A.5.4
    text: >-
      1 De aangewezen instantie en haar personeel voeren de conformiteitsbeoordelingsactiviteiten uit met de grootste
      mate van beroepsintegriteit en met de vereiste technische bekwaamheid op het specifieke gebied.


      2 De aangewezen instantie en haar personeel zijn vrij van elke druk en beïnvloeding, met name van financiële aard,
      die hun oordeel of de resultaten van hun conformiteitsbeoordelingsactiviteiten kunnen beïnvloeden, met name van
      personen of groepen van personen die belang hebben bij de resultaten van deze activiteiten.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.5.4
  - number: 1A.5.5
    text: >-
      1 De aangewezen instantie is in staat alle conformiteitsbeoordelingstaken te verrichten die in bijlage II bij de
      EU-richtlijn pyrotechnische artikelen aan haar zijn toegewezen en waarvoor zij is aangewezen, ongeacht of deze taak
      door de aangewezen instantie zelf of namens haar en onder haar verantwoordelijkheid wordt verricht.


      2 De aangewezen instantie beschikt te allen tijde, voor elke conformiteitsbeoordelingsprocedure en voor elk soort
      en elke categorie vuurwerk of pyrotechnische artikelen voor theatergebruik waarvoor zij is aangemeld over:


      a. benodigd personeel met technische kennis en voldoende passende ervaring om de conformiteitsbeoordelingstaken
      te verrichten;


      b. beschrijvingen van de procedures voor de uitvoering van de conformiteitsbeoordeling, waarbij de transparantie en
      de mogelijkheid tot reproductie van deze procedures worden gewaarborgd;


      c. gepast beleid en geschikte procedures om een onderscheid te maken tussen taken die zij als aangewezen instantie
      verricht en andere activiteiten; en


      d. procedures voor de uitoefening van haar activiteiten die naar behoren rekening houden met de omvang
      van een onderneming, de sector waarin zij actief is, de structuur ervan, de relatieve complexiteit van de
      producttechnologie in kwestie en het massa- of seriële karakter van het productieproces.


      3 Een aangewezen instantie beschikt over de noodzakelijke middelen om de technische en administratieve taken, die
      zijn verbonden met de conformiteitsbeoordelingsactiviteiten, op passende wijze uit te voeren en heeft toegang tot
      alle noodzakelijke apparatuur en faciliteiten.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.5.5
  - number: 1A.5.6
    text: >-
      Het personeel van de aangewezen instantie dat verantwoordelijk is voor de conformiteitsbeoordelingstaken beschikt
      over:


      a. een gedegen technische en beroepsopleiding die alle relevante conformiteitsbeoordelingsactiviteiten omvat
      waarvoor de instantie is aangewezen;


      b. een voldoende kennis van de eisen inzake de beoordelingen die de aangewezen instantie verricht en voldoende
      bevoegdheden om deze beoordelingen uit te voeren;


      c. voldoende kennis van en inzicht in de essentiële veiligheidseisen, de toepasselijke geharmoniseerde normen en
      de relevante bepalingen van de harmonisatiewetgeving van de Europese Unie en van het bij of krachtens dit besluit
      bepaalde; en


      d. de bekwaamheid om certificaten, dossiers en rapporten op te stellen die aantonen dat de beoordelingen zijn
      verricht.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.5.6
  - number: 1A.5.7
    text: >-
      1 De aangewezen instantie waarborgt haar onpartijdigheid en die van haar leidinggevenden en haar personeel dat de
      conformiteitsbeoordelingstaken verricht.


      2 De beloning van leidinggevenden en personeel van de aangewezen instantie hangt niet af van het aantal uitgevoerde
      beoordelingen of van de resultaten daarvan;
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.5.7
  - number: 1A.5.8
    text: De aangewezen instantie heeft een geldige aansprakelijkheidsverzekering.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.5.8
  - number: 1A.5.9
    text: >-
      1 Het personeel van een aangewezen instantie is gebonden aan het beroepsgeheim ten aanzien van alle informatie
      waarvan het kennisneemt bij de uitoefening van de taken van de aangewezen instantie uit hoofde van bijlage II bij
      de EU-richtlijn pyrotechnische artikelen of bij of krachtens dit besluit. De eigendomsrechten worden beschermd.


      2 Het beroepsgeheim, genoemd in het eerste lid, geldt niet ten opzichte van de bevoegde autoriteit.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.5.9
  - number: 1A.5.10
    text: >-
      1 De aangewezen instantie neemt deel aan of zorgt ervoor dat haar personeel dat de conformiteitsbeoordelingstaken
      verricht, op de hoogte is van:


      a. de relevante normalisatieactiviteiten, en


      b. de activiteiten van de coördinatiegroep van aangemelde instantie die is opgericht uit hoofde van de
      desbetreffende harmonisatiewetgeving van de Europese Unie.


      2 De aangewezen instantie hanteert de administratieve beslissingen en geproduceerde documenten van de
      coördinatiegroep, genoemd in het eerste lid, onder b, als algemene richtsnoeren.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.5.10
  - number: 1A.5.11
    text: |-
      Een conformiteitsbeoordelingsinstantie die aantoont dat zij voldoet aan de criteria in de ter zaken doende
      geharmoniseerde normen of delen ervan, waarvan de referentienummers in het Publicatieblad van de Europese Unie
      zijn bekendgemaakt, wordt geacht aan de eisen, genoemd in [artikel 1A.5.3 tot en met 1A.5.10][ref1], te voldoen, op
      voorwaarde dat de van toepassing zijnde geharmoniseerde normen de eisen dekken.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A.5.3
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.5.11
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 1A.5.3
        hoofdstuk: 1a
        paragraaf: '5'
  - number: 1A.5.12
    text: |-
      1 Indien de aangewezen instantie specifieke taken in verband met de conformiteitsbeoordeling uitbesteedt of door
      een dochteronderneming laat uitvoeren:

      a. waarborgt zij dat de onderaannemer of dochteronderneming aan de eisen, genoemd in
      [artikel 1A.5.3 tot en met 1A.5.10][ref1], voldoet;

      b. brengt zij Onze Minister hiervan op de hoogte;

      c. neemt zij de volledige verantwoordelijkheid op zich voor de taken die onderaannemers of dochterondernemingen
      verrichten, ongeacht waar deze gevestigd zijn;

      d. houdt zij de relevante documenten over de beoordeling van de kwalificaties van de onderaannemer of
      dochteronderneming en over de door de onderaannemer of dochteronderneming uit hoofde van bijlage II bij de EU-
      richtlijn pyrotechnische artikelen uitgevoerde werkzaamheden ter beschikking van Onze Minister.

      2 Activiteiten mogen uitsluitend met instemming van de klant worden uitbesteed of door een dochteronderneming
      worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A.5.3
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.5.12
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 1A.5.3
        hoofdstuk: 1a
        paragraaf: '5'
  - number: 1A.5.13
    text: >-
      1 De aangewezen instantie voert conformiteitsbeoordelingen uit. Zij voldoet aan de eisen die in bijlage II bij de
      EU-richtlijn pyrotechnische artikelen aan haar worden gesteld.


      2 De aangewezen instantie is bij uitvoering van de conformiteitsbeoordelingen, genoemd in het eerste lid, in elk
      geval bevoegd tot het nemen van de volgende besluiten:


      a. beslissen omtrent afgifte van een verklaring van EU-typeonderzoek in het kader van de toepassing van module B,
      als bedoeld in bijlage II bij de EU-richtlijn pyrotechnische artikelen, onder 6;


      b. beslissen omtrent afgifte van een aanvullende goedkeuring in het kader van de toepassing van module B, als
      bedoeld in bijlage II bij de EU-richtlijn pyrotechnische artikelen, onder 7;


      c. beslissen omtrent beoordelen of opnieuw beoordelen van het kwaliteitssysteem in het kader van de toepassing van
      module D, als bedoeld in bijlage II bij de EU-richtlijn pyrotechnische artikelen, onder 3.3 en 3.5.


      3 De aangewezen instantie voert de conformiteitbeoordelingen op evenredige wijze uit, waarbij zij voorkomt dat de
      marktdeelnemers onnodig worden belast. De aangewezen instantie houdt hierbij naar behoren rekening met de volgende
      aspecten, waarbij zij de striktheid en het beschermingsniveau eerbiedigt die nodig zijn opdat het vuurwerk of het
      pyrotechnische artikel voor theatergebruik voldoet aan de essentiële veiligheidseisen:


      a. de omvang van de onderneming;


      b. de sector waarin zij actief is;


      c. de structuur van de onderneming;


      d. de relatieve technologische complexiteit van de producten; en


      e. het massa- of seriële karakter van het productieproces.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.5.13
  - number: 1A.5.14
    text: |-
      1 De aangewezen instantie kent registratienummers toe ter identificatie van het vuurwerk of de pyrotechnische
      artikelen voor theatergebruik die aan een conformiteitsbeoordeling zijn onderworpen en ter identificatie van de
      fabrikanten van deze artikelen.

      2 De aangewezen instantie houdt een register bij van de registratienummers van vuurwerk en pyrotechnische artikelen
      voor theatergebruik waarvoor zij conformiteitcertificaten heeft afgegeven.

      3 Bij het bijhouden van het register gebruikt de aangewezen instantie het model en het formaat daarvan dat is
      vastgelegd in de bijlage bij dit besluit.

      4 Het register moet ten minste de in de bijlage bij dit besluit vermelde informatie over producten bevatten. Deze
      informatie wordt gedurende tien jaar bewaard na de datum waarop de aangemelde instantie de documenten, bedoeld in
      [artikel 1A.5.13][ref1], heeft afgegeven.

      5 De aangewezen instantie werkt het register regelmatig bij. Zij maken het register bekend via internet.

      6 Wanneer de aanmelding van een conformiteitsbeoordelingsinstantie wordt ingetrokken, draagt deze instantie de
      registers onverwijld over aan een andere aangemelde instantie of aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A.5.13
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.5.14
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 1A.5.13
        hoofdstuk: 1a
        paragraaf: '5'
  - number: 1A.5.15
    text: >-
      De aangewezen instantie verleent geen conformiteitscertificaat indien zij vaststelt dat een fabrikant niet heeft
      voldaan aan de essentiële veiligheidseisen of aan de overeenkomstige geharmoniseerde normen of andere technische
      specificaties. Zij verlangt dat de fabrikant de passende corrigerende maatregelen neemt.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.5.15
  - number: 1A.5.16
    text: >-
      1 De aangewezen instantie verlangt dat de fabrikant passende corrigerende maatregelen neemt, indien zij bij het
      toezicht op de conformiteit na verlening van een certificaat vaststelt dat vuurwerk of het pyrotechnische artikelen
      voor theatergebruik niet meer in overeenstemming is met de essentiële veiligheidseisen, de overeenkomstige
      geharmoniseerde normen of andere technische specificaties. Zo nodig schorst zij het certificaat of trekt zij dit
      in.


      2 Indien geen corrigerende maatregelen als bedoeld in het eerste lid worden genomen, worden de certificaten
      naargelang het geval door de aangewezen instantie geschorst, beperkt of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.5.16
  - number: 1A.5.17
    text: >-
      De aangewezen instantie neemt rechtstreeks of via aangestelde vertegenwoordigers deel aan de werkzaamheden van het
      forum van aangemelde instanties.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.5.17
  - number: 1A.5.18
    text: >-
      1 Onze Minister ziet toe op de rechtmatige en doeltreffende uitvoering van het bepaalde bij of krachtens dit
      besluit door de aangewezen instantie.


      2 De aangewezen instantie brengt Onze Minister op de hoogte van:


      a. elke weigering, beperking, schorsing of intrekking van certificaten;


      b. omstandigheden die van invloed zijn op de werkingssfeer van of de voorwaarden voor de aanwijzing;


      c. informatieverzoeken over conformiteitsbeoordelingsactiviteiten die zij van de markttoezichthouder of de
      marktautoriteiten uit andere lidstaten, ontvangen;


      3 Op verzoek van Onze Minister brengt de aangewezen instantie Onze Minister op de hoogte van de binnen haar
      werkingssfeer verrichte conformiteitsbeoordelingsactiviteiten, waaronder grensoverschrijdende activiteiten en
      uitbestedingen.


      4 De aangewezen instantie verstrekt relevante informatie over negatieve conformiteitsbeoordelingsresultaten en op
      verzoek over positieve conformiteitsbeoordelingsresultaten aan de andere aangemelde instanties die soortgelijke
      conformiteitsbeoordelingsactiviteiten voor dezelfde pyrotechnische artikelen verrichten.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.5.18
  - number: 1A.5.19
    text: >-
      De aangewezen instantie beschikt over een behoorlijke administratie waarin de gegevens die samenhangen met en
      betrekking hebben op de uitvoering van haar taken, op een systematische wijze zijn vastgelegd. Aan de hand van deze
      gegevens zijn de beoordeelde pyrotechnische artikelen afdoende te identificeren.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.5.19
  - number: 1A.5.20
    text: |-
      1 Indien is gebleken dat de aangewezen instantie niet langer voldoet aan de eisen, genoemd in
      [artikel 1A.5.3 tot en met 1A.5.10][ref1], of haar verplichtingen niet nakomt, kan Onze Minister de aanwijzing
      beperken, schorsen of intrekken, afhankelijk van de ernst van het niet-voldoen aan die eisen of het niet-nakomen
      van die verplichtingen.

      2 Onze Minister stelt de andere lidstaten van de Europese Unie en de Europese Commissie onverwijld op de hoogte van
      de maatregelen, genoemd in het eerste lid.

      3 Wanneer de aanwijzing wordt beperkt, geschorst, of ingetrokken, of de aangewezen instantie haar activiteiten
      heeft gestaakt:

      a. stelt deze instantie, ook nadat de aanwijzing is beperkt, geschorst of ingetrokken, de dossiers op verzoek van
      Onze Minister, ter beschikking aan Onze Minister en de markttoezichthouder, of

      b. draagt deze instantie de dossiers over aan een andere aangemelde instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A.5.3
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.5.20
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 1A.5.3
        hoofdstuk: 1a
        paragraaf: '5'
  - number: 2.1.1
    text: >-
      Bij regeling van Onze Minister wordt vuurwerk aangewezen dat ter beschikking mag worden gesteld voor particulier
      gebruik. De aanwijzing geschiedt aan de hand van de aard, samenstelling, constructie en eigenschappen van het
      vuurwerk.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel2.1.1
  - number: 2.1.3
    text: |-
      1 Vuurwerk van consumentenvuurwerk, is voorzien van:

      a. de aanduiding: Geschikt voor particulier gebruik;

      b. een vermelding of afbeelding van de soort van het vuurwerk waaruit duidelijk blijkt wat de te verwachten
      effecten tijdens het functioneren zijn;

      c. de naam, de geregistreerde handelsnaam of de geregistreerde merknaam van de fabrikant en één postadres waarop
      contact met hem kan worden opgenomen;

      d. indien de fabrikant niet is gevestigd op het grondgebied van de Europese Unie: de gegevens, genoemd onder c, en
      de naam, geregistreerde handelsnaam of geregistreerde merknaam van de importeur en het postadres waarop contact met
      hem kan worden opgenomen;

      e. indien de importeur niet in Nederland is gevestigd: de gegevens, genoemd onder c en d, en de handelsnaam of het
      handelsmerk en de naam en de plaats van vestiging van de distributeur;

      f. de naam en het type van het artikel, het door de fabrikant bij de vervaardiging toegekende artikelnummer dat
      dient ter identificatie van het vuurwerk, het registratienummer en het product-, partij- of serienummer van het
      product;

      g. de minimumleeftijd voor het verkopen of anderszins ter beschikking stellen van het vuurwerk, bedoeld in
      [artikel 2.3.5][ref1];

      h. de categorie, bedoeld in [artikel 1A.1.3][ref2], waartoe het vuurwerk behoort;

      i. de NEM;

      j. een gebruiksaanwijzing met zodanige aanwijzingen en waarschuwingen dat bij het dienovereenkomstig handelen geen
      letsel of schade bij de gebruiker en omstanders kan ontstaan.

      2 Consumentenvuurwerk is voorts voorzien van de volgende informatie:

      - *voor zover het betreft categorie F1:* in voorkomend geval: «uitsluitend buitenshuis te gebruiken» en een
      minimale veiligheidsafstand;
      - *voor zover het betreft categorie F2:* «uitsluitend buitenshuis te gebruiken» en, in voorkomend geval, een
      minimale veiligheidsafstand of -afstanden.

      3 Het eerste en tweede lid gelden niet voor vuurwerk van geringe afmeting, mits de in het eerste en tweede lid
      bedoelde gegevens zijn aangebracht op de kleinste verpakkingseenheid.

      4 De aanduiding en de gegevens, bedoeld in het eerste en tweede lid, zijn in de Nederlandse taal gesteld,
      zichtbaar, leesbaar, duidelijk, begrijpelijk en onuitwisbaar.

      5 In afwijking van het vierde lid worden de aanduiding en de gegevens, bedoeld in het eerste en tweede lid, op
      vuurwerk dat aan de consument zal worden aangeboden in een andere lidstaat van de Europese Unie gesteld in de
      officiële taal of talen van het desbetreffende land.

      6 Dit artikel is niet van toepassing op vuurwerk waarvan op het moment dat het binnen het grondgebied van Nederland
      wordt gebracht, naar het oordeel van Onze Minister genoegzaam wordt aangetoond dat het binnen 48 uur weer buiten
      het grondgebied van Nederland zal worden gebracht. Indien sprake is van het met een omgevingsvergunning opslaan van
      vuurwerk of pyrotechnische artikelen voor theatergebruik voor korte tijd en in afwachting van aansluitend vervoer
      naar een vooraf bekende ontvanger, bedoeld in artikel 3.286, eerste lid, onder i, van het Besluit activiteiten
      leefomgeving, in containers voor vervoer op een locatie op een haventerrein van de zeehaven van Amsterdam,
      Eemshaven, Rotterdam of Vlissingen, wordt in plaats van «48 uur» gelezen: twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2.3.5
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel1A.1.3
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel2.1.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 2.3.5
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: 1A.1.3
        hoofdstuk: 1a
        paragraaf: '1'
  - number: 2.1.4
    text: |-
      Het is verboden vuurwerk dat niet voldoet aan de ter uitwerking van dit besluit krachtens
      [artikel 9.2.2.1 van de Wet milieubeheer][ref1] gestelde regels met betrekking tot consumentenvuurwerk, te voorzien
      van de aanduiding: Geschikt voor particulier gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9.2.2.1
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel2.1.4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: 9.2.2.1
  - number: 2.3.1
    text: |-
      Het is verboden consumentenvuurwerk voor handelsdoeleinden ter beschikking te stellen aan een ander dan:

      a. degene die een milieubelastende activiteit als bedoeld in
      [artikel 3.30 van het Besluit activiteiten leefomgeving][ref1] verricht;

      b. een in het buitenland gevestigde ondernemer wiens bedrijfsmatige activiteit bestaat uit het verhandelen van
      vuurwerk en die gerechtigd is het vuurwerk op te slaan of te bewerken, dan wel, indien de betrokken persoon het
      vuurwerk tot ontbranding zal brengen, gerechtigd is het vuurwerk tot ontbranding te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0041330#Artikel3.30
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel2.3.1
    references:
      - id: ref1
        bwb_id: BWBR0041330
        artikel: '3.30'
  - number: 2.3.2
    text: >-
      1 Het is verboden consumentenvuurwerk ter beschikking te stellen aan een particulier.


      2 Het verbod geldt niet op 29, 30 en 31 december met dien verstande dat als een van deze dagen een zondag is het
      verbod eveneens op die zondag geldt, in welk geval het verbod om vuurwerk ter beschikking te stellen dan niet geldt
      op 28 december.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel2.3.2
  - number: 2.3.3
    text: >-
      Het is verboden per levering meer dan 25 kg consumentenvuurwerk aan een particulier ter beschikking te stellen.
      Voor de bepaling van de hoeveelheid vuurwerk wordt uitgegaan van het gewicht van het vuurwerk als zijnde onverpakt.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel2.3.3
  - number: 2.3.4
    text: |-
      Het is verboden consumentenvuurwerk aan een particulier bedrijfsmatig ter beschikking te
      stellen op een andere plaats dan een ruimte voor verkoop aan particulieren als bedoeld in
      [artikel 4.1046 van het Besluit activiteiten leefomgeving][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041330#Artikel4.1046
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel2.3.4
    references:
      - id: ref1
        bwb_id: BWBR0041330
        artikel: '4.1046'
  - number: 2.3.5
    text: |-
      Het is verboden consumentenvuurwerk te verkopen of anderszins ter beschikking te stellen aan particulieren jonger
      dan:

      - *voor zover het betreft categorie F1:* 12 jaar;
      - *voor zover het betreft categorie F2:* 16 jaar.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel2.3.5
  - number: 2.3.5a
    text: >-
      Het is verboden consumentenvuurwerk te verkopen of anderszins ter beschikking te stellen aan een particulier zonder
      een veiligheidsbril en een aansteeklont te verstrekken en instructies te geven over het veilig tot ontbranding
      brengen van dit vuurwerk.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel2.3.5a
  - number: 2.3.6
    text: >-
      Het is verboden vuurwerk, anders dan bedrijfsmatig, tot ontbranding te brengen op een ander tijdstip dan tussen
      31 december 18.00 uur en 1 januari 02.00 uur van het daaropvolgende jaar.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel2.3.6
  - number: 2.3.7
    text: |-
