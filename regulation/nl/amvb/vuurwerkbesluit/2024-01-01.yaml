  - number: 1.2.3
    text: |-
      Het is verboden vuurwerk of pyrotechnische artikelen voor theatergebruik zonder een daartoe verleende
      omgevingsvergunning te vervaardigen of, behoudens het bepaalde in [artikel 3B.1, eerste lid][ref1], te bewerken.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3B.1
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1.2.3
