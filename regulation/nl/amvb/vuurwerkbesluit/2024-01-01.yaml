  - number: 3.1.1
    text: |-
      1 professioneel vuurwerk is voorzien van:

      a. de aanduiding: Niet geschikt voor particulier gebruik;

      b. een vermelding of afbeelding van de soort van het vuurwerk waaruit duidelijk blijkt wat de te verwachten
      effecten tijdens het functioneren zijn;

      c. de naam, de geregistreerde handelsnaam of de geregistreerde merknaam van de fabrikant en één postadres waarop
      contact met hem kan worden opgenomen;

      d. indien de fabrikant niet is gevestigd op het grondgebied van de Europese Unie: de gegevens, genoemd onder c, en
      de naam, geregistreerde handelsnaam of geregistreerde merknaam van de importeur en het postadres waarop contact met
      hem kan worden opgenomen;

      e. indien de importeur niet in Nederland is gevestigd: de gegevens, genoemd onder c en d, en de handelsnaam of het
      handelsmerk en de naam en de plaats van vestiging van de distributeur;

      f. de naam en het type van het artikel, het door de fabrikant bij de vervaardiging toegekende registratienummer
      en het product-, partij- of serienummer van het product en, voor zover het vuurwerk betreft dat is ingedeeld in
      categorie F3 of F4, het productiejaar van het vuurwerk;

      g. de categorie, bedoeld in [artikel 1A.1.3][ref1], waartoe het vuurwerk behoort;

      h. de NEM;

      i. een gebruiksaanwijzing met zodanige aanwijzingen en waarschuwingen dat bij het dienovereenkomstig handelen geen
      letsel of schade bij de gebruiker en omstanders kan ontstaan.

      2 De verpakking van professioneel vuurwerk is voorts voorzien van de volgende informatie:

      - *voor zover het betreft categorie F2:* «uitsluitend buitenshuis te gebruiken» en, in voorkomend geval, de
      minimale veiligheidsafstanden(en);
      - *voor zover het betreft categorie F3:* «uitsluitend buitenshuis te gebruiken» en, de minimale
      veiligheidsafstand(en);
      - *voor zover het betreft categorie F4:* «uitsluitend door personen met gespecialiseerde kennis te gebruiken» en de
      minimale veiligheidsafstand(en).

      3 Het eerste en tweede lid gelden niet voor professioneel vuurwerk van geringe afmeting, mits de in het eerste en
      tweede lid bedoelde gegevens zijn aangebracht op de kleinste verpakkingseenheid.

      4 De aanduiding en de gegevens, bedoeld in het eerste en tweede lid, zijn in de Nederlandse, Duitse, Engelse of
      Franse taal gesteld, zichtbaar, leesbaar, duidelijk, begrijpelijk en onuitwisbaar.

      5 In afwijking van het vierde lid worden de aanduiding en de gegevens, bedoeld in het eerste en tweede lid, op
      professioneel vuurwerk dat aan een persoon met gespecialiseerde kennis zal worden aangeboden in een andere lidstaat
      van de Europese Unie, gesteld in de officiële taal of talen van het desbetreffende land.

      6 Dit artikel is niet van toepassing op vuurwerk waarvan op het moment dat het binnen het grondgebied
      van Nederland wordt gebracht, naar het oordeel van Onze Minister genoegzaam wordt aangetoond dat het
      binnen 48 uur weer buiten het grondgebied van Nederland zal worden gebracht. Indien sprake is van het
      met een omgevingsvergunning opslaan van vuurwerk of pyrotechnische artikelen voor theatergebruik voor
      korte tijd en in afwachting van aansluitend vervoer naar een vooraf bekende ontvanger, bedoeld in
      [artikel 3.286, eerste lid, onder i, van het Besluit activiteiten leefomgeving][ref2], in containers voor vervoer
      op een locatie op een haventerrein van de zeehaven van Amsterdam, Eemshaven, Rotterdam of Vlissingen, wordt in
      plaats van «48 uur» gelezen: twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0041330#Artikel3.286
