  - number: 1.2.5
    text: |-
      1 Het is verboden handelingen als bedoeld in
      [artikel 2, eerste lid, onder c, d en e, van de Wet vervoer gevaarlijke stoffen][ref1] te verrichten, voor zover
      het betreft handelingen met vuurwerk of pyrotechnische artikelen voor theatergebruik, anders dan:

      a. het laten staan en het laten liggen van een vervoermiddel waarin of waarop zich vuurwerk of pyrotechnische
      artikelen voor theatergebruik bevinden, in verband met:

      1°. de toepassing van [artikel 1.2.4, tweede lid, onder c][ref2],

      2°. een wettelijk voorschrift dat dat voorschrijft in verband met weersomstandigheden.

      b. het ononderbroken beladen van een vervoermiddel met vuurwerk of pyrotechnische artikelen voor theatergebruik en
      het ononderbroken lossen daaruit, of

      c. het met een omgevingsvergunning voor het opslaan van vuurwerk of van pyrotechnische artikelen voor
      theatergebruik voor korte tijd en in afwachting van aansluitend vervoer naar een vooraf bekende ontvanger, bedoeld
      in artikel 3.286, eerste lid, onder i, van het Besluit activiteiten leefomgeving:

      1°. laten staan en laten liggen van een vervoermiddel waarin of waarop zich vuurwerk of pyrotechnische artikelen
      voor theatergebruik bevinden,

      2°. beladen van een vervoermiddel met vuurwerk of pyrotechnische artikelen voor theatergebruik en het lossen
      daaruit, of

      3°. nederleggen tijdens het vervoer van vuurwerk of pyrotechnische artikelen voor theatergebruik.

      2 Het is verboden verpakt of onverpakt consumentenvuurwerk, anders dan voor eigen gebruik, in een hoeveelheid
      van meer dan 25 kg per vervoermiddel dan wel professioneel vuurwerk of pyrotechnische artikelen voor
      theatergebruik te vervoeren, tenzij degene die vervoert tijdens dat vervoer schriftelijk kan aantonen door
      middel van een inschrijvingsbewijs of een vrachtbrief als bedoeld in de [artikelen 20][ref3] onderscheidenlijk
      [29 van de Wet goederenvervoer over de weg][ref4], dan wel door middel van een cognossement als bedoeld in
      [boek 8 van het Burgerlijk Wetboek][ref5], dat de artikelen zijn bestemd voor een natuurlijk persoon of een
      rechtspersoon:

      a. die ingevolge het Besluit activiteiten leefomgeving, dit vuurwerk of deze pyrotechnische artikelen voor
      theatergebruik mag opslaan,

      b. die houder is van een vergunning als bedoeld in [artikel 3B.1, eerste lid][ref6], of

      c. wiens gegevens, als het vuurwerk of pyrotechnische artikelen voor theatergebruik buiten het grondgebied van
      Nederland worden gebracht, zijn verstrekt bij de melding, bedoeld in [artikel 1.3.2, vierde lid, onder f][ref7].


