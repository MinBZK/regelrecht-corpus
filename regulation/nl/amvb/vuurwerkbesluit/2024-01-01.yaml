      tot ontbranding worden gebracht, hebben tot taak zorg te dragen voor de bestuursrechtelijke
      handhaving van de ontbrandingstoestemming en de daaraan verbonden voorschriften als bedoeld in de
      [artikelen 3B.1, derde lid, onderdeel a][ref1], en [3B.3, tweede en derde lid][ref2], alsmede van bepalingen
      als bedoeld in de [artikelen 3B.3a, tiende lid][ref3], [3B.4, eerste, tweede, vierde en vijfde lid][ref4],
      [3B.6, vijfde lid][ref5], en [3B.7][ref6].


