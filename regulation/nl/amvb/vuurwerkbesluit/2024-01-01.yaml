      - id: ref1
        bwb_id: BWBR0013360
        artikel: 3B.7
        hoofdstuk: 3b
  - number: 3B.3a
    text: |-
      1 De aanvraag om een ontbrandingstoestemming wordt langs elektronische weg ingediend. In afwijking van
      [artikel 2:15, eerste en tweede lid, van de Algemene wet bestuursrecht][ref1] neemt het bevoegd gezag een
      aanvraag die langs elektronische weg wordt ingediend, in ontvangst. De aanvraag mag betrekking hebben op meerdere
      evenementen of voorstellingen waarbij vuurwerk of pyrotechnische artikelen voor theatergebruik tot ontbranding
      worden gebracht, mits die evenementen of voorstellingen plaatsvinden binnen dezelfde gemeente en binnen een tijdvak
      van ten hoogste een jaar.

      2 Bij de aanvraag worden de volgende gegevens en bescheiden langs elektronische weg verstrekt:

      a. gegevens omtrent de datum, het tijdstip en de plaats van het tot ontbranding brengen;

      b. een afschrift van de toepassingsvergunning die aan de aanvrager is verleend;

      c. een afschrift van het in [artikel 3B.2, tweede lid, onder c][ref2], bedoelde certificaat;

      d. een schietlijst met daarin een overzicht van de toe te passen artikelen en per categorie artikelen de volgende
      gegevens:

      - het aantal,
      - de omschrijving van het artikel,
      - de fabrikant van het artikel,
      - het artikelnummer,
      - gegevens waaruit blijkt of het artikel consumentenvuurwerk, professioneel vuurwerk of een pyrotechnisch artikel
      voor theatergebruik betreft,
      - het brutogewicht van het artikel in kilogrammen,
      - het kaliber,
      - het maximale effect van het artikel in verticale richting,
      - gegevens waaruit blijkt of er sprake is van een schuin opgesteld of schuin gemonteerd artikel, en
      - de veiligheidsafstand tot het publiek die bij het ontbranden in acht zal worden genomen;

      e. indien sprake is van het ontbranden in de buitenlucht, een actuele situatietekening, waarop is aangegeven:

      - de opbouwlocatie,
      - de afsteeklocatie met opstelling van de af te steken artikelen,
      - de omliggende bebouwing,
      - de veiligheidsafstanden,
      - de afzettingen van de gevarenzone tijdens opbouw en ontbranding,
      - de opstelplaats van het publiek, en
      - de vluchtwegen.

      f. indien wegen in de gevarenzone zijn gelegen, een toestemming van de burgemeester binnen wiens gemeente de
      artikelen tot ontbranding zullen worden gebracht, voor het afzetten van die wegen of, indien het een eigen weg
      betreft, een toestemming van de eigenaar van de weg voor het afzetten van de weg;

      g. een omschrijving van bijzondere omstandigheden.

      3 De schietlijst kan wat betreft de volgende gegevens, genoemd in het tweede lid, onder d, tot uiterlijk vier
      werkdagen voor de ontbranding worden gewijzigd, mits de wijziging betrekking heeft op vervangende artikelen die
      gelijkwaardig zijn wat betreft kaliber, maximaal effect en veiligheidsafstand:

      - het aantal;
      - de omschrijving van het artikel;
      - de fabrikant van het artikel;
      - het artikelnummer.

      4 Indien de aanvraag betrekking heeft op meerdere evenementen, bedoeld in het eerste lid, derde zin, worden bij
      de aanvraag per evenement of voorstelling de gegevens en bescheiden, bedoeld in de onderdelen b tot en met g,
      verstrekt.

      5 De aanvrager kan de gegevens en bescheiden, bedoeld in het tweede lid, op schriftelijke wijze verstrekken, voor
      zover het bevoegd gezag daarvoor toestemming heeft gegeven.

      6 Gedeputeerde staten zenden onverwijld een afschrift van de aanvraag aan de burgemeester binnen wiens gemeente het
      vuurwerk of de pyrotechnische artikelen voor theatergebruik tot ontbranding zullen worden gebracht.

      7 Gedeputeerde staten stellen alvorens een ontbrandingstoestemming te verlenen de volgende bestuursorganen en
      instanties in de gelegenheid advies uit te brengen:

      a. de betrokken verlener van een luchtverkeersdienst als bedoeld in de [Wet luchtvaart][ref3], voor zover het
      zichzelf voortdrijvend opstijgend vuurwerk of zichzelf opstijgende pyrotechnische artikelen voor theatergebruik
      betreft die in de openlucht tot ontbranding zullen worden gebracht binnen 15 kilometer afstand van een luchthaven,

      b. het bestuur van de veiligheidsregio binnen wiens gebied het vuurwerk of de pyrotechnische artikelen voor
      theatergebruik tot ontbranding zullen worden gebracht, en

      c. de burgemeester van de gemeente aangrenzend aan de gemeente waar het vuurwerk of de pyrotechnische artikelen
      voor theatergebruik tot ontbranding zullen worden gebracht, voor zover de artikelen effect kunnen hebben binnen
      zijn gemeente.

      8 Gedeputeerde staten verlenen geen ontbrandingstoestemming indien de burgemeester binnen wiens gemeente het
      vuurwerk of de pyrotechnische artikelen voor theatergebruik tot ontbranding zullen worden gebracht binnen twee
      weken na ontvangst van het afschrift van de aanvraag heeft verklaard tegen het verlenen van de toestemming in
      verband met de veiligheid bedenkingen te hebben, dan wel indien de burgemeester binnen die termijn gedeputeerde
      staten er van in kennis heeft gesteld dat hij de aanvraag binnen die termijn niet kan beoordelen, die verklaring
      heeft gegeven binnen vier weken na ontvangst van de aanvraag. Indien de burgemeester niet binnen de van toepassing
      zijnde termijn heeft verklaard bedenkingen te hebben, wordt hij geacht geen bedenkingen te hebben.

      9 Gedeputeerde staten zenden onverwijld een afschrift van de ontbrandingstoestemming aan Onze Minister, de
      burgemeester, bedoeld in het zevende lid, onder c, en aan het bestuur van de veiligheidsregio, bedoeld in het
      zevende lid, onder b. Deze verzending geschiedt zoveel als mogelijk en in ieder geval aan Onze Minister langs
      elektronische weg.

      10 Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref4] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref5] niet van toepassing op de aanvraag om een
      ontbrandingstoestemming.

      11 Degene aan wie een ontbrandingstoestemming is verleend voor meerdere evenementen of voorstellingen, meldt
      uiterlijk vijf werkdagen voorafgaand aan ieder evenement of iedere voorstelling aan gedeputeerde staten van de
      provincie waarin het evenement of de voorstelling zal plaatsvinden, de datum en het tijdstip van het opbouwen
      van het vuurwerk en de pyrotechnische artikelen voor theatergebruik en de datum, het tijdstip en de plaats van
      het tot ontbranding brengen van die artikelen, onder verwijzing naar de datum en het kenmerk van die toestemming.
      Gedeputeerde staten zenden onverwijld een afschrift van de melding aan de bestuursorganen en instanties, bedoeld
      in het negende lid. Deze verzending geschiedt zo veel als mogelijk en in ieder geval aan Onze Minister langs
      elektronische weg.

      12 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de wijze waarop een aanvraag als
      bedoeld in het eerste lid langs elektronische weg wordt ingediend en een afschrift van een ontbrandingstoestemming
      als bedoeld in het negende lid en van een melding als bedoeld in het elfde lid langs elektronische weg wordt
      gezonden.


