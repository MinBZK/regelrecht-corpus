articles:
  - number: 1.1.1
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      - aanbieder van diensten van de informatiemaatschappij: aanbieder van een dienst zoals gedefinieerd in artikel
      1, eerste lid, onderdeel b, van [Richtlijn (EU) 2015/1535](32015L1535) van het Europees Parlement en de Raad
      van 9 september 2015 betreffende een informatieprocedure op het gebied van technische voorschriften en regels
      betreffende de diensten van de informatiemaatschappij (PbEU 2015, L 241);
      - ADR: op 30 september 1957 te Genève tot stand gekomen Europese Overeenkomst betreffende het internationale
      vervoer van gevaarlijke goederen over de weg (Trb. 1959, 171);
      - bedrijfsmatig: in de uitoefening van een beroep of bedrijf of tegen vergoeding;
      - Categorie F1, F2, F3 en F4: categorie F1, F2, F3 onderscheidenlijk F4 als bedoeld in [artikel 1A.1.3][ref1];
      - categorie T1 en T2: categorie T1 onderscheidenlijk T2 als bedoeld in [artikel 1A.1.3][ref2];
      - CE-markering: CE-markering als bedoeld in de artikelen 19 en 20 van de EU-richtlijn pyrotechnische artikelen;
      - consumentenvuurwerk: vuurwerk dat is ingedeeld in categorie F1 of F2 en dat bij of krachtens dit besluit is
      aangewezen als vuurwerk dat ter beschikking mag worden gesteld voor particulier gebruik;
      - distributeur: natuurlijk of rechtspersoon in de toeleveringsketen, niet zijnde de fabrikant of de importeur, die
      vuurwerk of pyrotechnische artikelen voor theatergebruik op de markt aanbiedt;
      - EU-richtlijn pyrotechnische artikelen: richtlijn nr. 2013/29/EU van het Europees Parlement en de Raad van
      12 juni 2013 betreffende de harmonisatie van de wetgevingen van de lidstaten inzake het op de markt aanbieden van
      pyrotechnische artikelen (herschikking) (PbEU L 178);
      - fabrikant: natuurlijke of rechtspersoon die vuurwerk of een pyrotechnisch artikel voor theatergebruik vervaardigt
      of laat ontwerpen of vervaardigen en dat vuurwerk of pyrotechnische artikel voor theatergebruik onder zijn naam of
      merknaam verhandelt;
      - fop- en schertsvuurwerk: vuurwerk dat is ingedeeld in categorie F1 alsmede ander, als zodanig bij ministeriële
      regeling aangewezen vuurwerk;
      - fulfilmentdienstverlener: fulfilmentdienstverlener als, bedoeld in artikel 3, onderdeel 11, van de EU-verordening
      markttoezicht;
      - gemachtigde: gemachtigde als, bedoeld in artikel 3, onderdeel 12, van de EU-verordening markttoezicht;.
      - grondgebied van de Europese Unie: gebied waarop de Overeenkomst betreffende de Europese Economische Ruimte van
      toepassing is;
      - importeur: in de Europese Unie gevestigde natuurlijke of rechtspersoon die vuurwerk of een pyrotechnisch artikel
      voor theatergebruik uit een derde land in de Europese Unie in de handel brengt;
      - in de handel brengen: het voor het eerst in de Europese Unie op de markt aanbieden van vuurwerk of een
      pyrotechnisch artikel voor theatergebruik;
      - inspecteur: als zodanig bij besluit van Onze Minister aangewezen ambtenaar;
      - lidstaat van de Europese Unie: lidstaat van de Europese Unie of een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte;
      - luchthaven: luchthaven als bedoeld in de [Wet luchtvaart][ref3];
      - Marktdeelnemers: fabrikant, importeur en distributeur;
      - NEM: netto explosieve massa, zijnde de totale hoeveelheid pyrotechnische stof of preparaat, met eventuele
      toevoegingen, in vuurwerk of pyrotechnische artikelen voor theatergebruik;
      - omgevingsvergunning: omgevingsvergunning voor een milieubelastende activiteit als bedoeld in
      [artikel 5.1, tweede lid, aanhef en onderdeel b, van de Omgevingswet][ref4];
      - ontbrandingstoestemming: toestemming als bedoeld in [artikel 3B.1, derde lid, onder a][ref5];
      - Onze Minister: Onze Minister van Infrastructuur en Milieu;
      - Op de markt aanbieden: het in het kader van een handelsactiviteit, al dan niet tegen betaling, verstrekken van
      vuurwerk of een pyrotechnisch artikel voor theatergebruik met het oog op distributie, consumptie of gebruik op de
      markt van de Unie;
      - persoon met gespecialiseerde kennis: persoon, aangewezen bij [artikel 1.1.2a][ref6];
      - professioneel vuurwerk: vuurwerk dat is ingedeeld in categorie F4 of F3 alsmede vuurwerk dat is ingedeeld in
      categorie F2 en dat niet bij of krachtens dit besluit is aangewezen als vuurwerk dat ter beschikking mag worden
      gesteld voor particulier gebruik;
      - pyrotechnisch artikel: artikel dat explosieve stoffen of een explosief mengsel van stoffen bevat en dat tot doel
      heeft warmte, licht, geluid, gas of rook dan wel een combinatie van dergelijke verschijnselen te produceren door
      middel van zichzelf onderhoudende exotherme chemische reacties;
      - pyrotechnische artikelen die zijn ingedeeld in categorie P1: andere pyrotechnische artikelen dan vuurwerk en
      pyrotechnische artikelen voor theatergebruik, die weinig gevaar opleveren;
      - pyrotechnische artikelen die zijn ingedeeld in categorie P2: andere pyrotechnische artikelen dan vuurwerk en
      pyrotechnische artikelen voor theatergebruik die uitsluitend bestemd zijn om door personen met gespecialiseerde
      kennis te worden gehanteerd of gebruikt;
      - pyrotechnisch artikel voor theatergebruik: pyrotechnisch artikel voor podiumgebruik;
      - Richtlijn 2007/23/EG: Richtlijn 2007/23/EG van het Europees Parlement en de Raad van 23 mei 2007 betreffende het
      in de handel brengen van pyrotechnische artikelen (PbEU L 154);
      - toepassingsvergunning: vergunning als bedoeld in [artikel 3B.1, eerste lid][ref7];
      - vuurwerk: pyrotechnische artikelen ter vermaak;
      - werkdag: dag, niet zijnde een zondag of algemeen erkende feestdag in de zin van de [Algemene termijnenwet][ref8].

      2 Voor de toepassing van de [artikelen 1.2.2, eerste tot en met derde lid][ref9], [2.3.2][ref10], [2.3.3][ref11]
      en [2.3.4][ref12] wordt onder het begrip particulier mede verstaan een exploitant van een bedrijf zonder
      rechtspersoonlijkheid of een rechtspersoon die:

      a. geen milieubelastende activiteit als bedoeld in [artikel 3.30][ref13] of
      [3.286, eerste lid, onder i, van het Besluit activiteiten leefomgeving][ref14] verricht;

      b. geen houder is van een vergunning als bedoeld in [artikel 3B.1, eerste lid][ref15];

      c. in het buitenland is gevestigd en wiens bedrijfsmatige activiteit niet bestaat uit het verhandelen van of het
      tot ontbranding brengen van vuurwerk.

      3 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. verpakt vuurwerk: vuurwerk inclusief het omhulsel en eventuele verpakking, detailhandelsverpakking of
      assortimentverpakking en inclusief de transportverpakking als bedoeld in de ADR;

      b. onverpakt vuurwerk: vuurwerk inclusief het omhulsel en eventuele verpakking, detailhandelsverpakking of
      assortimentverpakking doch exclusief de transportverpakking als bedoeld in de ADR.

      4 Voor de toepassing van dit besluit wordt, voor zover dat voor de toepassing van de EU-verordening markttoezicht
      noodzakelijk is, verstaan onder marktdeelnemer hetgeen daaronder in artikel 3, onderdeel 13, van die verordening
      wordt verstaan.


