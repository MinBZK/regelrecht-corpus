  - number: 1.1.7
    text: >-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de praktische regelingen voor het
      regelmatig verzamelen en bijwerken van gegevens over ongevallen, als bedoeld in artikel 43, onder b, van de EU-
      richtlijn pyrotechnische artikelen.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1.1.7
  - number: 1.2.2
    text: |-
      1 Het is verboden professioneel vuurwerk of pyrotechnische artikelen voor theatergebruik, indien bestemd voor
      particulier gebruik, binnen het grondgebied van Nederland te brengen, op te slaan, te vervaardigen, voorhanden te
      hebben of aan een ander ter beschikking te stellen.

      2 Het is verboden aan een ander dan een persoon met gespecialiseerde kennis professioneel vuurwerk of
      pyrotechnische artikelen voor theatergebruik ter beschikking te stellen.

      3 Het is verboden als een ander dan een persoon met gespecialiseerde kennis professioneel vuurwerk of
      pyrotechnische artikelen voor theatergebruik op te slaan, voorhanden te hebben of tot ontbranding te brengen.

      4 Het is verboden vuurwerk of pyrotechnische artikelen voor theatergebruik binnen het grondgebied van Nederland
      te brengen, op te slaan, te vervaardigen, toe te passen, voorhanden te hebben, aan een ander ter beschikking te
      stellen of tot ontbranding te brengen indien dit niet voldoet aan het bepaalde bij of krachtens dit besluit.

      5 Het is eenieder verboden, teneinde handelingen als bedoeld in het eerste tot en met vierde lid, voor te bereiden
      of te bevorderen:

      a. te trachten een ander te bewegen om die handelingen te plegen, te doen plegen, mede te plegen of uit te lokken,
      om daarbij behulpzaam te zijn of om daartoe gelegenheid, middelen of inlichtingen te verschaffen,

      b. te trachten zich of een ander gelegenheid, middelen of inlichtingen tot het verrichten van die handelingen te
      verschaffen, of

      c. voorwerpen, vervoermiddelen, stoffen, gelden of andere betaalmiddelen voorhanden te hebben, waarvan hij weet of
      ernstige reden heeft te vermoeden dat zij bestemd zijn tot het verrichten van die handelingen.

      6 Het is verboden vuurwerk of pyrotechnische artikelen voor theatergebruik buiten het grondgebied van Nederland te
      brengen zonder dat het voornemen daartoe met inachtneming van [artikel 1.3.2][ref1] is gemeld.

      7 Van bestemd voor particulier gebruik als bedoeld in het eerste lid is in ieder geval sprake indien:

      a. het tot ontbranding wordt gebracht door een particulier,

      b. het te koop wordt aangeboden of ter beschikking wordt gesteld aan, gekocht of besteld door een particulier,

      c. het aangetroffen wordt bij een particulier,

      d. het binnen het grondgebied van Nederland wordt gebracht of voorhanden wordt gehouden met het oogmerk het aan
      particulieren ter beschikking te stellen, of

      e. het is voorzien van de aanduiding: Geschikt voor particulier gebruik.

      8 Voor de toepassing van de leden 1, 2 en 3 wordt onder professioneel vuurwerk mede verstaan:

      a. pyrotechnische artikelen die zijn ingedeeld in categorie P1 of P2 en die als vuurwerk worden gebruikt of
      kennelijk zijn bestemd om als vuurwerk te worden gebruikt;

      b. niet in een categorie ingedeelde pyrotechnische artikelen.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1.3.2
