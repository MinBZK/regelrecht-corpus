  - number: 3B.4
    text: |-
      1 In afwijking van [artikel 3B.1, derde lid, onder a][ref1], kan degene aan wie een toepassingsvergunning is
      verleend en die:

      a. ten hoogste 20 kg pyrotechnische artikelen voor theatergebruik tot ontbranding wil brengen, of

      b. ten hoogste 200 kg consumentenvuurwerk tot ontbranding wil brengen,

      voorafgaand aan het tot ontbranding brengen volstaan met een melding aan gedeputeerde staten van de provincie
      waarin de artikelen tot ontbranding zullen worden gebracht.

      2 Voor de bepaling van de hoeveelheid consumentenvuurwerk of pyrotechnische artikelen voor theatergebruik, bedoeld
      in het eerste lid, wordt uitgegaan van het gewicht van de artikelen als zijnde onverpakt consumentenvuurwerk
      onderscheidenlijk onverpakte pyrotechnische artikelen voor theatergebruik.

      3 Gedeputeerde staten zenden onverwijld een afschrift van de melding aan het bestuur van de regionale brandweer
      binnen wiens gebied de artikelen tot ontbranding zullen worden gebracht, aan de burgemeester van de gemeente binnen
      wiens gemeente de artikelen tot ontbranding zullen worden gebracht en aan Onze Minister. Deze verzending geschiedt
      zo veel als mogelijk en in ieder geval aan Onze Minister langs elektronische weg.

      4 Degene die het consumentenvuurwerk of de pyrotechnische artikelen voor theatergebruik tot ontbranding wil brengen
      draagt er zorg voor dat de melding ten minste twee weken voordat de artikelen tot ontbranding worden gebracht door
      gedeputeerde staten is ontvangen.

      5 In afwijking van het vierde lid kunnen gedeputeerde staten na overleg met de burgemeester en het bestuur, bedoeld
      in het derde lid, in bijzondere omstandigheden een kortere termijn voor de melding toestaan.

      6 [Artikel 3B.3a, eerste lid, eerste en tweede volzin, tweede, vijfde en twaalfde lid][ref2], is van
      overeenkomstige toepassing op een melding als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3B.1
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel3B.3a
