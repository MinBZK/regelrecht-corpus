  - number: 5.2.1
    text: >-
      Ingetrokken worden:


      a. het Vuurwerkbesluit Wet milieugevaarlijke stoffen;


      b. het Besluit opslag vuurwerk milieubeheer;


      c. het Reglement Gevaarlijke Stoffen;


      d. de beschikking van de Staatssecretaris van Verkeer en Waterstaat van 6 november 1979, houdende voorschriften
      voor de aflevering van ontploffingsgevaarlijke stoffen;


      e. de regeling van de Staatssecretaris van Verkeer en Waterstaat van 17 maart 1980, houdende verbod tot het gebruik
      van explosieven voor opruimingswerkzaamheden;


      f. de ontheffing van het Reglement Gevaarlijke Stoffen van de Staatssecretaris van Verkeer en Waterstaat van 19
      december 1985;


      g. de regeling van de Minister van Verkeer en Waterstaat van 20 december 1990, houdende vergunningplicht voor het
      afleveren, ter aflevering aanwezig houden en bezigen van vuurwerk;


      h. het Interim-besluit bezigen en afleveren professioneel vuurwerk Wms;


      i. de Interimregeling aanwijzing toezichthoudende ambtenaren Interim-besluit bezigen en afleveren professioneel
      vuurwerk Wms.
