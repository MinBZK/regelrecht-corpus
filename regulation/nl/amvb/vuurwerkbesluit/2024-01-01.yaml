        artikel: 3B.1
        hoofdstuk: 3b
  - number: 1.4.1
    text: >-
      1 Degene die:


      a. consumentenvuurwerk aan een groothandelaar ter beschikking stelt, of


      b. professioneel vuurwerk of pyrotechnische artikelen voor theatergebruik aan een ander ter beschikking stelt,


      meldt voordat de terbeschikkingstelling plaatsvindt elektronisch het voornemen hiertoe bij Onze Minister. De
      melding wordt gedaan ten minste 48 uur voorafgaand aan de terbeschikkingstelling van de artikelen.


      2 In afwijking van het eerste lid is het degene die consumentenvuurwerk in de periode van 15 december tot 1
      januari ter beschikking stelt toegestaan het voornemen hiertoe ten minste 24 uur van te voren elektronisch bij Onze
      Minister te melden.


      3 Bij de melding worden in ieder geval de volgende gegevens verstrekt:


      a. de naam en het adres van degene die ter beschikking stelt,


      b. de naam en het adres van degene aan wie ter beschikking wordt gesteld,


      c. de datum waarop de artikelen ter beschikking worden gesteld, en de plaats waar deze worden opgeslagen, en


      d. of het consumenten of professioneel vuurwerk dan wel pyrotechnische artikelen voor theatergebruik betreft,
      het door de fabrikant bij de vervaardiging toegekende artikelnummer dat dient ter identificatie van het artikel,
      de CE-markering, het type vuurwerk of pyrotechnisch artikel voor theatergebruik, de NEM en per artikelnummer de
      hoeveelheid.


      4 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de wijze waarop een melding langs
      elektronische weg wordt gedaan.


      5 Voor de berekening van de periode van 48 uur, bedoeld in het eerste lid, worden uren die vallen op een dag, niet
      zijnde een werkdag, niet meegerekend.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1.4.1
  - number: 1.4.2
    text: |-
      1 Degene die vuurwerk of pyrotechnische artikelen voor theatergebruik vervaardigt, binnen het grondgebied van
      Nederland brengt, of voor handelsdoeleinden voorhanden heeft, registreert:

      a. of het consumenten- of professioneel vuurwerk dan wel pyrotechnische artikelen voor theatergebruik betreft, en
      het door de fabrikant bij de vervaardiging toegekende artikelnummer dat dient ter identificatie van het artikel;

      b. de hoeveelheid verpakt vuurwerk of pyrotechnische artikelen voor theatergebruik in kilogrammen die per afnemer
      ter beschikking is gesteld.

      2 [Artikel 3, eerste en derde lid, van het Administratiebesluit milieugevaarlijke stoffen en preparaten][ref1] is
      van overeenkomstige toepassing op de gegevens, bedoeld in het eerste lid, onder a en b.

      3 Het eerste lid, aanhef en onder b, is niet van toepassing op degene die bedrijfsmatig consumentenvuurwerk ter
      beschikking stelt aan particulieren.


      [ref1]: https://wetten.overheid.nl/BWBR0004321#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1.4.2
    references:
      - id: ref1
        bwb_id: BWBR0004321
        artikel: '3'
  - number: 1A.1.1
    text: |-
      1 In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

      - *aangemelde instanties:* aangemelde instanties als bedoeld in artikel 21 van de EU-richtlijn pyrotechnische
      artikelen;
      - *aangewezen instantie:* een instantie, aangewezen door Onze Minister, die conformiteitsbeoordelingsactiviteiten
      verricht, zoals onder meer het ijken, testen, certificeren en inspecteren;
      - *accreditatie:* accreditatie zoals gedefinieerd in artikel 2, tiende lid, van de Verordening;
      - *bevoegde autoriteit:* Onze Minister;
      - *bijlage I bij de EU-richtlijn:* bijlage I bij de EU-richtlijn pyrotechnische artikelen, naar de tekst zoals deze
      bij die richtlijn is vastgesteld;
      - *bijlage II bij de EU-richtlijn:* bijlage II bij de EU-richtlijn pyrotechnische artikelen, naar de tekst zoals
      deze bij die richtlijn is vastgesteld, voor zover het betreft de in het tweede lid genoemde onderdelen van de
      bijlage, en bijlage II bij de EU-richtlijn pyrotechnische artikelen voor de overige onderdelen van de bijlage;
      - *conformiteitsbeoordeling:* proces waarin wordt beoordeeld of voldaan is aan de essentiële veiligheidseisen;
      - *conformiteitsbeoordelingsprocedure:* procedure als bedoeld in bijlage II bij de EU-richtlijn;
      - *essentiële veiligheidseisen:* essentiële veiligheidseisen als bedoeld in bijlage I bij de EU-richtlijn;
      - *EU-conformiteitsverklaring:* verklaring dat een product voldoet aan de eisen van de EU-richtlijn pyrotechnische
      artikelen als bedoeld in artikel 18, eerste tot en met derde lid, van die richtlijn;
      - *geharmoniseerde norm:* geharmoniseerde norm als bedoeld in artikel 2, eerste lid, onder c, van Verordening (EU)
      nr. 1025/2012 van het Europees Parlement en de Raad van 25 oktober 2012 betreffende Europese normalisatie, tot
      wijziging van de richtlijnen 89/686/EEG en 93/15/EEG van de Raad alsmede de richtlijnen 94/9/EG, 94/25/EG, 95/16/
      EG, 97/23/EG, 98/34/EG, 2004/22/EG, 2007/23/EG, 2009/23/EG en 2009/105/EG van het Europees Parlement en de Raad
      en tot intrekking van beschikking 87/95/EEG van de raad en besluit nr. 1673/2006/EG van het Europees Parlement en
      de Raad;
      - *harmonisatiewetgeving van de Europese Unie:* alle wetgeving van de Europese Unie die de voorwaarden voor het
      verhandelen van producten harmoniseert;
      - *markttoezicht:* hetgeen daaronder in hoofdstuk 5 van de EU-richtlijn pyrotechnische artikelen wordt verstaan;
      - *markttoezichthouder:* persoon als bedoeld in [artikel 18.6, eerste lid, van de Omgevingswet][ref1] die door Onze
      Minister is aangewezen en die handelt in het kader van markttoezicht;
      - *module B, C2, D, E, G en H:* module B, C2, D, E, G en H als bedoeld in bijlage II bij de EU-richtlijn
      pyrotechnische artikelen;
      - *nationale accreditatie-instantie:* nationale accreditatie-instantie zoals gedefinieerd in artikel 2, elfde lid,
      van de Verordening;
      - *technische specificatie:* document dat de technische vereisten voorschrijft waaraan vuurwerk of een
      pyrotechnisch artikel voor theatergebruik moet voldoen;
      - *terugroepen:* maatregel waarmee wordt beoogd vuurwerk of een pyrotechnisch artikel voor theatergebruik te doen
      terugkeren dat al aan de eindgebruiker ter beschikking is gesteld;
      - *uit de handel nemen:* maatregel waarmee wordt beoogd te voorkomen dat vuurwerk of een pyrotechnisch artikel voor
      theatergebruik dat zich in de toeleveringsketen bevindt, op de markt wordt aangeboden;
      - *Verordening:* Verordening (EG) nr. 765/2008 van het Europees parlement en de Raad van 9 juli 2008 tot
      vaststelling van de eisen inzake accreditatie en tot intrekking van Verordening (EEG) nr. 339/93;

      2 De in het eerste lid, in de begripsomschrijving van bijlage II bij de EU-richtlijn, bedoelde onderdelen van die
      bijlage zijn:

      a. Module B, de onderdelen 7, tweede alinea, tot en met 9;

      b. Module C2, de onderdelen 2 tot en met 4.2, voor zover het betreft het ter beschikking houden van de EU-
      conformiteitsverklaring;

      c. Module D, de onderdelen 3.4, 3.5, 4.2 tot en met 4.4, 6 en 7;

      d. Module E, de onderdelen 3.4, 3.5, 4.2 tot en met 4.4, 6 en 7;

      e. Module H, de onderdelen 3.4, 3,5, 4.2 tot en met 4.4, 6 en 7.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel18.6
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '18.6'
  - number: 1A.1.2
    text: >-
      1 Een wijziging van artikel 10 van de EU-richtlijn pyrotechnische artikelen, van bijlage II bij de EU-richtlijn
      pyrotechnische artikelen, met uitzondering van de onderdelen, genoemd in artikel 1A.1.1, tweede lid, en van
      bijlage III of IV bij de EU-richtlijn pyrotechnische artikelen gaat voor de toepassing van dit besluit en de daarop
      berustende bepalingen gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn of het betrokken
      wijzigingsbesluit uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt
      bekendgemaakt, een ander tijdstip wordt vastgesteld.


      2 Onze Minister doet meteen na het van kracht worden van een wijziging als bedoeld in het eerste lid daarvan
      mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.1.2
  - number: 1A.1.3
    text: >-
      1 De fabrikant brengt het vuurwerk of het pyrotechnische artikel voor theatergebruik in een bepaalde categorie
      onder op grond van toepassing, doel en gevaar, met inbegrip van hun geluidniveau.


      2 Een aangemelde instantie bevestigt de categorisering als onderdeel van de conformiteitsbeoordelingsprocedure.


      3 De categorieën luiden als volgt:


      a. *vuurwerk*


      Categorie F1: vuurwerk dat zeer weinig gevaar en een te verwaarlozen geluidsniveau oplevert en bestemd is voor
      gebruik in een besloten ruimte, inclusief vuurwerk dat bestemd is voor gebruik binnenshuis;


      Categorie F2: vuurwerk dat weinig gevaar en een laag geluidsniveau oplevert en bestemd is voor gebruik buitenshuis
      in een afgebakende plaats;


      Categorie F3: vuurwerk dat middelmatig gevaar oplevert en bestemd is voor gebruik buitenshuis in een grote open
      ruimte, en waarvan het geluidsniveau niet schadelijk is voor de menselijke gezondheid;


      Categorie F4: vuurwerk dat veel gevaar oplevert en uitsluitend bestemd is voor gebruik door personen met
      gespecialiseerde kennis, en waarvan het geluidsniveau niet schadelijk is voor de menselijke gezondheid.


      b. *pyrotechnische artikelen voor theatergebruik*


      Categorie T1: pyrotechnische artikelen voor podiumgebruik met gering gevaar;


      Categorie T2: pyrotechnische artikelen voor podiumgebruik die uitsluitend bestemd zijn om door personen met
      gespecialiseerde kennis te worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.1.3
  - number: 1A.1.4
    text: >-
      Vuurwerk of pyrotechnische artikelen voor theatergebruik die in overeenstemming zijn met geharmoniseerde normen of
      delen daarvan, waarvan de referentienummers in het Publicatieblad van de Europese Unie zijn bekendgemaakt, worden
      geacht in overeenstemming te zijn met de essentiële veiligheidseisen die door die normen of delen daarvan worden
      bestreken.
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel1A.1.4
  - number: 1A.2.1
    text: |-
      1 Het is verboden vuurwerk of pyrotechnische artikelen voor theatergebruik die niet voldoen aan de essentiële
      veiligheidseisen in de handel te brengen, voorhanden te hebben of aan een ander ter beschikking te stellen.

      2 Het is verboden vuurwerk of pyrotechnische artikelen voor theatergebruik die niet zijn onderworpen aan de
      conformiteitsbeoordelingsprocedure conform de [artikelen 1A.3.1][ref1] en [1A.3.2][ref2] in de handel te brengen,
      voorhanden te hebben of aan een ander ter beschikking te stellen.

      3 Het is verboden vuurwerk of pyrotechnische artikelen voor theatergebruik in de handel te brengen, voorhanden te
      hebben, aan een ander ter beschikking te stellen of te gebruiken anders dan met inachtneming van de voorschriften
      gesteld bij of krachtens de[ artikelen 1A.4.1][ref3], [2.1.3][ref4], [3.1.1][ref5] en [3A.1.1][ref6] met betrekking
      tot de aanduiding en het bezigen van vermeldingen.

      4 Het is verboden vuurwerk of pyrotechnische artikelen voor theatergebruik in de handel te brengen zonder dat
      hiervoor, overeenkomstig [artikel 1A.4.2][ref7], een EU-conformiteitsverklaring is opgesteld.

      5 Het is voor fabrikanten verboden te handelen in strijd met bijlage II bij de EU-richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel1A.3.2
