  - number: 3B.3
    text: |-
      1 De ontbrandingstoestemming kan worden geweigerd in het belang van de bescherming van de gezondheid van de mens en
      van het milieu.

      2 Aan de ontbrandingstoestemming kunnen voorschriften worden verbonden in het belang van de bescherming van de
      gezondheid van de mens en van het milieu. De voorschriften kunnen afwijken van regels gesteld in de regeling,
      bedoeld in [artikel 3B.7][ref1].

      3 Degene aan wie de toestemming is verleend, is gehouden de in het tweede lid bedoelde voorschriften na te leven.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3B.7
    url: https://wetten.overheid.nl/BWBR0013360/2024-01-01#Artikel3B.3
