        paragraaf: '2'
  - number: 5.3.3.4
    text: |-
      Voor inrichtingen waarvoor onmiddellijk voorafgaand aan het tijdstip waarop
      [paragraaf 2 van hoofdstuk 2 van dit besluit][ref1] in werking treedt, een melding was gedaan krachtens het
      Besluit opslag vuurwerk milieubeheer en binnen twee jaar na de inwerkingtreding van dit besluit ten gevolge van het
      veranderen van de inrichting dan wel het veranderen van de werking daarvan voor zover die verandering betrekking
      heeft op de opslag van vuurwerk een melding moet worden gedaan, zijn [artikel 2.3.4][ref2] en de voorschriften
      opgenomen in [bijlage 1][ref3] die ten gevolge van de inwerkingtreding van [artikel 2.2.1][ref4] gaan gelden, van
      toepassing, voor zover de verandering daarop betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0013360
      [ref4]: https://wetten.overheid.nl/BWBR0013360#Artikel2
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel5.3.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0013360
      - id: ref4
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 5.3.3.5
    text: |-
      Voor de in het eerste en derde lid bedoelde inrichtingen, voor zover daarin theatervuurwerk al dan niet tezamen
      met vuurwerk als bedoeld in [artikel 3.1.4][ref1] of meer dan 10 000 kg consumentenvuurwerk wordt opgeslagen
      en gedeputeerde staten toepassing hebben gegeven aan het [tweede lid van artikel 5.3.2][ref2], wordt voor de
      toepassing van het eerste en derde lid in plaats van «gedurende twee jaar na inwerkingtreding van dit besluit»
      gelezen: tot uiterlijk 1 maart 2005.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel5
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel5.3.3
