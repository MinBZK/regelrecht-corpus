        artikel: '8'
  - number: 1.1.4.2
    text: |-
      Voor de berekening van de in het eerste lid bedoelde termijn van 48 uur worden zaterdagen, zondagen en officieel
      erkende feestdagen niet meegerekend.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.1.4
  - number: 1.1.4.3
    text: |-
      In afwijking van het eerste lid wordt indien sprake is van opslag van vuurwerk in containers voor vervoer in een
      inrichting die is gelegen op een haventerrein van de zeehaven van Amsterdam, Eemshaven, Rotterdam of Vlissingen
      en waarvoor een vergunning krachtens [artikel 8.1 van de Wet milieubeheer][ref1] is verleend die betrekking heeft
      op de opslag van vuurwerk en voor zover aan de voorwaarden van het eerste lid is voldaan, in plaats van «48 uur»
      gelezen: twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.1.4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 1.1.5
    text: |-
      De [artikelen 2.3.6][ref1], [3.3.1][ref2] en [3.3.2][ref3] zijn niet van toepassing op instellingen die vuurwerk
      bedrijfsmatig en uitsluitend ten behoeve van onderzoek tot ontbranding brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.1.5
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 1.2.1
    text: 'Vuurwerk:'
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.1
  - number: 1.2.1.a
    text: heeft een zodanige constructie, is zodanig vervaardigd en verkeert in een zodanige staat,
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.1
  - number: 1.2.1.b
    text: is, wat aard, samenstelling en overige eigenschappen van het materiaal betreft, zodanig, en
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.1
  - number: 1.2.1.c
    text: functioneert zodanig,
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.1
  - number: 1.2.2.1
    text: |-
      Het is verboden, behoudens het bepaalde in de [artikelen 1.3.1, derde lid][ref1], [2.1.2, tweede lid][ref2], en
      [2.1.3, vijfde lid][ref3], consumentenvuurwerk:


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel2
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 1.2.2.1.a
    text: |-
      binnen het grondgebied van Nederland te brengen, te vervaardigen, toe te passen, voorhanden te hebben, of aan een
      ander ter beschikking te stellen, ten aanzien waarvan niet wordt voldaan aan de bij dit besluit gestelde eisen of
      de ter uitwerking van dit besluit krachtens [artikel 24, derde lid, van de Wet milieugevaarlijke stoffen][ref1]
      gestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel24
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.2
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '24'
  - number: 1.2.2.1.b
    text: |-
      op te slaan of te bewerken ten aanzien waarvan niet wordt voldaan aan de ter uitwerking van dit besluit krachtens
      [artikel 24, derde lid, van de Wet milieugevaarlijke stoffen][ref1] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel24
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.2
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '24'
  - number: 1.2.2.2
    text: |-
      Het is verboden, behoudens het bepaalde in de [artikelen 1.3.1, derde lid][ref1], en [3.1.1, zesde lid][ref2],
      professioneel vuurwerk:


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 1.2.2.2.a
    text: |-
      binnen het grondgebied van Nederland te brengen, te vervaardigen, toe te passen, voorhanden te hebben, of aan een
      ander ter beschikking te stellen, ten aanzien waarvan niet wordt voldaan aan de bij dit besluit gestelde eisen;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.2
  - number: 1.2.2.2.b
    text: |-
      op te slaan of te bewerken ten aanzien waarvan niet wordt voldaan aan de ter uitwerking van dit besluit krachtens
      [artikel 24, derde lid, van de Wet milieugevaarlijke stoffen][ref1] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel24
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.2
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '24'
  - number: 1.2.3
    text: |-
      Het is verboden vuurwerk buiten een daartoe bestemde inrichting te vervaardigen of, behoudens het bepaalde in
      [artikel 3.3.2, eerste lid][ref1], te bewerken.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 1.2.4.1
    text: 'Het is verboden vuurwerk voorhanden te hebben buiten een inrichting als bedoeld in:'
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.4
  - number: 1.2.4.1.a
    text: |-
      [artikel 1.1.4][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.4
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 1.2.4.1.b
    text: |-
      [artikel 2.2.2][ref1] of [3.2.1][ref2] waarvoor een vergunning krachtens
      [artikel 8.1 van de Wet milieubeheer][ref3] is verleend die betrekking heeft op de opslag van vuurwerk;


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.4
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 1.2.4.1.c
    text: |-
      [artikel 2.2.1][ref1] waarvoor een melding is gedaan krachtens [artikel 2.2.4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel2
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.4
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 1.2.4.2
    text: 'Het eerste lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.4
  - number: 1.2.4.2.a
    text: |-
      tijdens de perioden dat consumentenvuurwerk ingevolge [artikel 2.3.2][ref1] ter beschikking mag worden gesteld
      of ingevolge [artikel 2.3.6][ref2] tot ontbranding mag worden gebracht, indien niet meer dan tien kilogram
      consumentenvuurwerk voorhanden is;


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel2
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.4
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 1.2.4.2.b
    text: |-
      buiten de perioden, bedoeld onder a, indien niet meer dan tien kilogram consumentenvuurwerk voorhanden is op een
      plaats die niet voor het publiek toegankelijk is;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.4
  - number: 1.2.4.2.c
    text: |-
      tijdens het tot ontbranding brengen van professioneel vuurwerk overeenkomstig [artikel 3.3.2][ref1], alsmede
      gedurende ten hoogste zestien uur daaraan voorafgaand, met dien verstande dat niet meer vuurwerk voorhanden is dan
      redelijkerwijs tot ontbranding zal worden gebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.4
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 1.2.4.2.d
    text: |-
      gedurende ten hoogste 12 uur nadat is of zou worden aangevangen met het tot ontbranding van professioneel vuurwerk
      overeenkomstig [artikel 3.3.2][ref1] en het vuurwerk voorhanden is op een plaats die niet voor het publiek
      toegankelijk is en op een zodanige wijze dat geen gevaar voor personen is te duchten, met dien verstande dat niet
      meer vuurwerk voorhanden is dan redelijkerwijs tot ontbranding zou worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.4
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 1.2.4.3
    text: |-
      Gedeputeerde staten van de provincie waarin het professioneel vuurwerk tot ontbranding zal worden gebracht kunnen
      bij de toestemming, bedoeld in [artikel 3.3.2, derde lid, onder a][ref1], in plaats van de tijdsduur, genoemd in
      het tweede lid, onder c, een andere tijdsduur vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.4
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 1.2.4.4
    text: |-
      Het eerste lid is tevens niet van toepassing indien het vuurwerk wordt vervoerd overeenkomstig de eisen gesteld bij
      of krachtens de [Wet vervoer gevaarlijke stoffen][ref1] en met inachtneming van [artikel 1.2.5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007606
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel1
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.4
    references:
      - id: ref1
        bwb_id: BWBR0007606
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 1.2.5.1
    text: |-
      Het is verboden handelingen als bedoeld in
      [artikel 2, eerste lid, onder c, d en e, van de Wet vervoer gevaarlijke stoffen][ref1] te verrichten, voor zover
      het betreft handelingen met vuurwerk, anders dan:


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel2
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.5
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '2'
  - number: 1.2.5.1.a
    text: 'het laten staan en het laten liggen van een vervoermiddel waarin of waarop zich vuurwerk bevindt, in verband met:'
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.5
  - number: 1.2.5.1.a.1º
    text: |-
      de toepassing van [artikel 1.2.4, tweede lid, onder c][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.5
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 1.2.5.1.a.2º
    text: een wettelijk voorschrift dat dat voorschrijft in verband met weersomstandigheden.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.5
  - number: 1.2.5.1.b
    text: het ononderbroken beladen van een vervoermiddel met vuurwerk en het ononderbroken lossen daaruit, of
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.5
  - number: 1.2.5.1.c
    text: |-
      het in inrichtingen als bedoeld in [artikel 1.1.4, eerste lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.5
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 1.2.5.1.c.1°
    text: laten staan en laten liggen van een vervoermiddel waarin of waarop zich vuurwerk bevindt,
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.5
  - number: 1.2.5.1.c.2°
    text: beladen van een vervoermiddel met vuurwerk en het lossen daaruit, of
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.5
  - number: 1.2.5.1.c.3°
    text: nederleggen tijdens het vervoer van vuurwerk.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.5
  - number: 1.2.5.2
    text: |-
      Het is verboden verpakt of onverpakt consumentenvuurwerk, anders dan voor eigen gebruik, in een hoeveelheid van
      meer dan 10 kilogram per vervoermiddel of professioneel vuurwerk te vervoeren, tenzij degene die vervoert tijdens
      dat vervoer schriftelijk kan aantonen door middel van een inschrijvingsbewijs of een vrachtbrief als bedoeld in de
      [artikelen 20][ref1] onderscheidenlijk [29 van de Wet goederenvervoer over de weg][ref2], dan wel door middel van
      een cognossement als bedoeld in [boek 8 van het Burgerlijk Wetboek][ref3], dat het vuurwerk is bestemd voor een
      natuurlijk persoon of een rechtspersoon:


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0005443#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0005034
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.5
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0005443
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0005034
  - number: 1.2.5.2.a
    text: die ingevolge het bij of krachtens dit besluit bepaalde, dit vuurwerk mag opslaan,
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.5
  - number: 1.2.5.2.b
    text: |-
      die houder is van een vergunning als bedoeld in [artikel 3.3.2, eerste lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.5
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 1.2.5.2.c
    text: |-
      wiens gegevens, als het vuurwerk buiten het grondgebied van Nederland wordt gebracht, zijn verstrekt bij de
      melding, bedoeld in [artikel 1.3.2, derde lid, onder f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.5
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 1.2.6
    text: |-
      Het is een ieder verboden ander vuurwerk dan consumentenvuurwerk dat voldoet aan de bij dit besluit gestelde eisen
      of de ter uitwerking van dit besluit krachtens [artikel 24, derde lid, van de Wet milieugevaarlijke stoffen][ref1]
      gestelde regels met betrekking tot consumentenvuurwerk, aan te prijzen of aan te bevelen:


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel24
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.6
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '24'
  - number: 1.2.6.a
    text: als consumentenvuurwerk, of
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.6
  - number: 1.2.6.b
    text: |-
      indien hij weet of redelijkerwijs moet vermoeden dat dit vuurwerk zal worden aangewend voor een ander gebruik
      dan waartoe het gelet op de samenstelling of eigenschappen of de bijbehorende gebruiksaanwijzing, kennelijk is
      geschikt.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.6
  - number: 1.2.7
    text: |-
      Het is een ieder die anders dan beroepshalve vuurwerk tot ontbranding brengt, verboden handelingen te verrichten of
      na te laten waarvan hij weet of redelijkerwijs had kunnen vermoeden dat daardoor gevaren kunnen optreden voor mens
      of milieu.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.2.7
  - number: 1.3.1.1
    text: 'Degene die vuurwerk binnen het grondgebied van Nederland brengt, draagt ervoor zorg dat:'
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.3.1
  - number: 1.3.1.1.a
    text: |-
      op de verpakking waarin het vuurwerk zich tijdens het vervoer bevindt, is aangeduid de klasse waarin het vuurwerk
      volgens bijlage A van het ADR is ingedeeld als vuurwerk, en de aanduiding van de klasse overeenstemt met de
      eigenschappen van dat verpakte vuurwerk,
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.3.1
  - number: 1.3.1.1.b
    text: |-
      het vuurwerk vergezeld gaat van een door of namens hem opgestelde schriftelijke verklaring waarin per
      transportverpakking is aangeduid volgens welke klasse het vuurwerk ingevolge onderdeel a is ingedeeld en waarin hij
      verklaart dat de aanduiding van die klasse overeenstemt met de eigenschappen van dat verpakte vuurwerk,
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.3.1
  - number: 1.3.1.1.c
    text: |-
      aan degene aan wie hij het vuurwerk na het binnen het grondgebied van Nederland te hebben gebracht ter beschikking
      stelt, een schriftelijke verklaring als bedoeld onder b wordt afgegeven,
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.3.1
  - number: 1.3.1.1.d
    text: |-
      het vuurwerk en de verpakking van het vuurwerk zijn voorzien van de aanduiding «Geschikt voor particulier gebruik»,
      «Niet geschikt voor particulier gebruik» dan wel «Intended for indoor use» en «For professional use only», en
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.3.1
  - number: 1.3.1.1.e
    text: |-
      het vuurwerk en de verpakking van het vuurwerk zijn voorzien van een door de fabrikant bij de vervaardiging
      toegekend artikelnummer dat dient ter identificatie van het vuurwerk en het productiejaar.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.3.1
  - number: 1.3.1.2
    text: |-
      Degene die het vuurwerk opslaat draagt ervoor zorg dat op vuurwerk dat verpakt wordt opgeslagen de aanduiding van
      de klasse waarin het vuurwerk volgens bijlage A van het ADR is ingedeeld als vuurwerk aanwezig is en blijft en dat
      hij in het bezit is van de schriftelijke verklaring, bedoeld in het eerste lid, onder b.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.3.1
  - number: 1.3.1.3
    text: |-
      Het eerste lid, onder c en d, is niet van toepassing op vuurwerk waarvan op het moment dat het binnen het
      grondgebied van Nederland wordt gebracht, naar het oordeel van Onze Minister genoegzaam wordt aangetoond dat
      het binnen 48 uur weer buiten het grondgebied van Nederland zal worden gebracht. Indien sprake is van opslag als
      bedoeld in [artikel 1.1.4, derde lid][ref1], wordt in plaats van «48 uur» gelezen: twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.3.1
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 1.3.2.1
    text: |-
      Degene die vuurwerk binnen of buiten het grondgebied van Nederland brengt, meldt voorafgaand schriftelijk het
      voornemen hiertoe bij Onze Minister. De melding wordt ten minste drie werkdagen voorafgaand aan het binnen of
      buiten Nederland brengen van het vuurwerk gedaan. Indien de melding wordt gedaan op een werkdag voor 12.00 uur
      wordt in de vorige volzin in plaats van «drie werkdagen» gelezen: twee werkdagen.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.3.2
  - number: 1.3.2.2
    text: |-
      In afwijking van het eerste lid is het degene die consumentenvuurwerk in de periode van 15 december tot 1 januari
      binnen of buiten het grondgebied van Nederland brengt, toegestaan het voornemen hiertoe ten minste 24 uur van te
      voren schriftelijk bij Onze Minister te melden.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.3.2
  - number: 1.3.2.3
    text: |-
      In afwijking van het eerste lid is het binnen 24 uur nadat is of zou worden aangevangen met het tot ontbranding
      brengen van professioneel vuurwerk overeenkomstig [artikel 3.3.2][ref1], toegestaan het resterende vuurwerk buiten
      het grondgebied van Nederland te brengen zonder voorafgaande melding, met dien verstande dat binnen een werkdag na
      het buiten het grondgebied van Nederland brengen van het vuurwerk, door degene die het vuurwerk buiten Nederland
      heeft gebracht een melding aan Onze Minister wordt gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.3.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 1.3.2.4
    text: 'Bij de melding worden in ieder geval de volgende gegevens verstrekt:'
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.3.2
  - number: 1.3.2.4.a
    text: de naam en het adres van degene die het vuurwerk binnen of buiten het grondgebied van Nederland brengt;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.3.2
  - number: 1.3.2.4.b
    text: |-
      de voorziene plaats waar, de datum en het verwachte tijdstip, waarop het vuurwerk binnen of buiten het grondgebied
      van Nederland wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.3.2
  - number: 1.3.2.4.c
    text: |-
      of het consumenten- of professioneel vuurwerk betreft, het door de fabrikant bij de vervaardiging toegekende
      artikelnummer dat dient ter identificatie van het vuurwerk, het productiejaar, het type vuurwerk, de netto
      explosieve massa, per artikelnummer de hoeveelheid verpakt vuurwerk in kilogrammen en indien van toepassing het
      containernummer waarin het vuurwerk zich bevindt;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.3.2
  - number: 1.3.2.4.d
    text: de voorziene datum waarop en de plaats waar het vuurwerk wordt gelost of overgeladen;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.3.2
  - number: 1.3.2.4.e
    text: |-
      bij binnen het grondgebied van Nederland brengen het land van productie, de naam van de onderneming die het
      vuurwerk geproduceerd heeft, de naam en het adres van degene bij wie het vuurwerk wordt opgeslagen, en de naam en
      het adres van degene voor wie het vuurwerk is bestemd;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.3.2
  - number: 1.3.2.4.f
    text: |-
      bij buiten het grondgebied van Nederland brengen de naam en het adres van degene voor wie het vuurwerk is bestemd,
      en het adres van degene bij wie het vuurwerk wordt afgeleverd in het buitenland.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.3.2
  - number: 1.3.2.5
    text: De melding dient te worden gedaan op een formulier waarvan het model wordt vastgesteld door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.3.2
  - number: 1.3.2.6
    text: |-
      Afwijking van de gemelde gegevens wordt voorafgaand aan het binnen of buiten het grondgebied van Nederland brengen
      van vuurwerk terstond aan Onze Minister gemeld.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.3.2
  - number: 1.4.1.1
    text: 'Degene die:'
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.4.1
  - number: 1.4.1.1.a
    text: consumentenvuurwerk aan een groothandelaar ter beschikking stelt, of
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.4.1
  - number: 1.4.1.1.b
    text: professioneel vuurwerk aan een ander ter beschikking stelt,
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.4.1
  - number: 1.4.1.2
    text: |-
      In afwijking van het eerste lid is het degene die consumentenvuurwerk in de periode van 15 december tot 1 januari
      ter beschikking stelt toegestaan het voornemen hiertoe ten minste 24 uur van te voren schriftelijk bij Onze
      Minister te melden.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.4.1
  - number: 1.4.1.3
    text: 'Bij de melding worden in ieder geval de volgende gegevens verstrekt:'
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.4.1
  - number: 1.4.1.3.a
    text: de naam en het adres van degene die ter beschikking stelt,
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.4.1
  - number: 1.4.1.3.b
    text: de naam en het adres van degene aan wie ter beschikking wordt gesteld,
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.4.1
  - number: 1.4.1.3.c
    text: de datum waarop het vuurwerk ter beschikking wordt gesteld, en de plaats waar het wordt opgeslagen, en
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.4.1
  - number: 1.4.1.3.d
    text: |-
      of het consumenten- of professioneel vuurwerk betreft, het door de fabrikant bij de vervaardiging toegekende
      artikelnummer dat dient ter identificatie van het vuurwerk, het productiejaar, het type vuurwerk, de netto
      explosieve massa en per artikelnummer de hoeveelheid vuurwerk in kilogrammen.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.4.1
  - number: 1.4.1.4
    text: De melding dient te worden gedaan op een formulier waarvan het model wordt vastgesteld door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.4.1
  - number: 1.4.2.1
    text: |-
      Degene die vuurwerk vervaardigt, binnen het grondgebied van Nederland brengt, of voor handelsdoeleinden voorhanden
      heeft, registreert:
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.4.2
  - number: 1.4.2.1.a
    text: |-
      of het consumenten- of professioneel vuurwerk betreft, het door de fabrikant bij de vervaardiging toegekende
      artikelnummer dat dient ter identificatie van het vuurwerk, en het productiejaar;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.4.2
  - number: 1.4.2.1.b
    text: de hoeveelheid verpakt vuurwerk in kilogrammen die per afnemer ter beschikking is gesteld.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.4.2
  - number: 1.4.2.2
    text: |-
      [Artikel 3, eerste en derde lid, van het Registratiebesluit Wet milieugevaarlijke stoffen][ref1] is van
      overeenkomstige toepassing op de gegevens, bedoeld in het eerste lid, onder a en b.


      [ref1]: https://wetten.overheid.nl/BWBR0004321#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.4.2
    references:
      - id: ref1
        bwb_id: BWBR0004321
        artikel: '3'
  - number: 1.4.2.3
    text: |-
      In afwijking van het eerste lid, onder b, registreert degene die bedrijfsmatig consumentenvuurwerk ter beschikking
      stelt aan particulieren, de totale hoeveelheid vuurwerk uitgedrukt in kilogrammen verpakt vuurwerk die per dag aan
      particulieren ter beschikking is gesteld.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.4.2
  - number: 1.4.3.1
    text: |-
      Degene die een inrichting drijft als bedoeld in [artikel 1.1.4][ref1], [2.2.1][ref2], [2.2.2][ref3]
      of [3.2.1][ref4] draagt er zorg voor dat burgemeester en wethouders en de burgemeester van de gemeente waarin de
      inrichting is gelegen, en de commandant van de regionale brandweer, bij de toegang tot de inrichting direct toegang
      hebben tot in ieder geval de volgende actuele gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.4.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 1.4.3.1.a
    text: |-
      de classificatie van het vuurwerk volgens het ADR en de opgeslagen hoeveelheid verpakt en onverpakt vuurwerk in
      kilogrammen;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.4.3
  - number: 1.4.3.1.b
    text: informatie over de mate waarin het opgeslagen vuurwerk gevoelig is voor blusmiddelen;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.4.3
  - number: 1.4.3.1.c
    text: de plaats waar het vuurwerk binnen de inrichting is opgeslagen.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.4.3
  - number: 1.4.3.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van degene die in een inrichting professioneel
      vuurwerk voorhanden heeft dat is aangewezen ingevolge [artikel 1.1.1, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.4.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 2.1.1
    text: |-
      Consumentenvuurwerk moet voldoen aan door Onze Minister te stellen eisen. Daartoe behoren in ieder geval eisen
      omtrent:
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.1.1
  - number: 2.1.1.a
    text: de ten hoogste toelaatbare lading en geluidsdruk,
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.1.1
  - number: 2.1.1.b
    text: de wijze waarop de ten hoogste toelaatbare geluidsdruk wordt bepaald, en
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.1.1
  - number: 2.1.1.c
    text: de aard, samenstelling, constructie en eigenschappen.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.1.1
  - number: 2.1.2.1
    text: |-
      Verpakt consumentenvuurwerk is bij het opslaan en het voorhanden hebben anders dan door particulieren, op zodanige
      wijze verpakt dat het volgens bijlage A van het ADR, uitsluitend kan worden aangemerkt als vuurwerk behorende tot
      klasse 1.4G of 1.4S.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.1.2
  - number: 2.1.2.2
    text: |-
      Dit artikel is niet van toepassing op vuurwerk waarvan op het moment dat het binnen het grondgebied van
      Nederland wordt gebracht, naar het oordeel van Onze Minister genoegzaam wordt aangetoond dat het binnen 48
      uur weer buiten het grondgebied van Nederland zal worden gebracht. Indien sprake is van opslag als bedoeld in
      [artikel 1.1.4, derde lid][ref1], wordt in plaats van «48 uur» gelezen: twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.1.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 2.1.3.1
    text: 'Consumentenvuurwerk moet zijn voorzien van:'
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.1.3
  - number: 2.1.3.1.a
    text: 'de aanduiding: Geschikt voor particulier gebruik;'
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.1.3
  - number: 2.1.3.1.b
    text: |-
      een vermelding of afbeelding van de soort van het vuurwerk waaruit duidelijk blijkt wat de te verwachten effecten
      tijdens het functioneren zijn;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.1.3
  - number: 2.1.3.1.c
    text: |-
      de naam, de handelsnaam of het handelsmerk en de naam en de plaats van vestiging van de fabrikant en de importeur
      of handelaar;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.1.3
  - number: 2.1.3.1.d
    text: |-
      het door de fabrikant bij de vervaardiging toegekende artikelnummer dat dient ter identificatie van het vuurwerk en
      het productiejaar van het vuurwerk;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.1.3
  - number: 2.1.3.1.e
    text: |-
      een gebruiksaanwijzing met zodanige aanwijzingen en waarschuwingen dat bij het dienovereenkomstig handelen geen
      letsel of schade bij de gebruiker en omstanders kan ontstaan.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.1.3
  - number: 2.1.3.2
    text: |-
      Het eerste lid geldt niet voor consumentenvuurwerk van geringe afmeting, mits dat vuurwerk zich in een primaire
      verpakking bevindt waarop de in het eerste lid bedoelde gegevens zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.1.3
  - number: 2.1.3.3
    text: |-
      Indien door de geringe afmeting van het vuurwerk aan het eerste of tweede lid geen gevolg kan worden gegeven,
      is een bijsluiter bij het vuurwerk gevoegd, waarin de in het eerste lid bedoelde gegevens zijn opgenomen. De
      bijsluiter wordt bij de terbeschikkingstelling van het vuurwerk aan de particulier verstrekt.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.1.3
  - number: 2.1.3.4
    text: |-
      De in het eerste lid bedoelde aanduiding en de in het eerste en tweede lid bedoelde gegevens en de bijsluiter,
      bedoeld in het derde lid, zijn in de Nederlandse taal gesteld, begrijpelijk en duidelijk leesbaar.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.1.3
  - number: 2.1.3.5
    text: |-
      Dit artikel is niet van toepassing op vuurwerk waarvan op het moment dat het binnen het grondgebied van
      Nederland wordt gebracht, naar het oordeel van Onze Minister genoegzaam wordt aangetoond dat het binnen 48
      uur weer buiten het grondgebied van Nederland zal worden gebracht. Indien sprake is van opslag als bedoeld in
      [artikel 1.1.4, derde lid][ref1], wordt in plaats van «48 uur» gelezen: twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.1.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 2.1.4
    text: |-
      Het is verboden vuurwerk dat niet voldoet aan de ter uitwerking van dit besluit krachtens
      [artikel 24, derde lid, van de Wet milieugevaarlijke stoffen][ref1] gestelde regels met betrekking tot
      consumentenvuurwerk, te voorzien van de aanduiding: Geschikt voor particulier gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel24
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.1.4
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '24'
  - number: 2.2.1.1
    text: |-
      Degene die een inrichting drijft, waar ten hoogste 1 000 kilogram consumentenvuurwerk wordt opgeslagen of
      herverpakt, voldoet aan de voorschriften die zijn opgenomen in [bijlage 1, onder A, B en C][ref1], en aan de
      veiligheidsafstanden die van toepassing zijn ingevolge [bijlage 3][ref2]. Degene die de inrichting drijft draagt er
      zorg voor dat de voorschriften worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0013360
      [ref2]: https://wetten.overheid.nl/BWBR0013360
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0013360
      - id: ref2
        bwb_id: BWBR0013360
  - number: 2.2.1.2
    text: |-
      Indien een inrichting tot een krachtens [artikel 1.1, derde lid, van de Wet milieubeheer][ref1] aangewezen
      categorie behoort, niet uitsluitend omdat daarin vuurwerk wordt opgeslagen, geldt een voor de inrichting krachtens
      [artikel 8.1 van de Wet milieubeheer][ref2] verleende vergunning ook voor het oprichten, in werking hebben of
      veranderen van de inrichting, dan wel het veranderen van de werking daarvan, voor zover dit oprichten, in werking
      hebben of veranderen dan wel veranderen van de werking betrekking heeft op het opslaan van vuurwerk.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 2.2.2.1
    text: 'Degene die een inrichting drijft waar:'
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.2.2
  - number: 2.2.2.1.a
    text: meer dan 1 000 kilogram consumentenvuurwerk wordt opgeslagen of herverpakt, of
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.2.2
  - number: 2.2.2.1.b
    text: consumentenvuurwerk wordt bewerkt,
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.2.2
  - number: 2.2.2.2
    text: Degene die de inrichting drijft draagt er zorg voor dat de voorschriften worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.2.2
  - number: 2.2.3.1
    text: |-
      Het bevoegd gezag kan nadere eisen stellen met betrekking tot de in [bijlage 1, onder B][ref1], opgenomen
      voorschriften ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0013360
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
  - number: 2.2.3.1.a
    text: |-
      de bereikbaarheid en de toegankelijkheid van ruimten waar consumentenvuurwerk aanwezig mag zijn, als bedoeld in
      voorschrift 1.8;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.2.3
  - number: 2.2.3.1.b
    text: de wijze waarop verpakt of onverpakt vuurwerk wordt opgeslagen, bedoeld in voorschrift 5.6;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.2.3
  - number: 2.2.3.1.c
    text: bouwkundige voorzieningen als bedoeld in voorschrift 6.3;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.2.3
  - number: 2.2.3.1.d
    text: de interne afstanden binnen de inrichting teneinde domino-effecten te voorkomen, bedoeld in voorschrift 6.4.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.2.3
  - number: 2.2.3.2
    text: |-
      De nadere eisen gelden voor een ieder die de inrichting drijft. Deze draagt er zorg voor dat de nadere eisen worden
      nageleefd.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.2.3
  - number: 2.2.3.3
    text: |-
      Het bevoegd gezag kan nadere eisen wijzigen of aanvullen in het belang van de bescherming van het milieu, of
      wijzigen of intrekken indien het belang van de bescherming van het milieu zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.2.3
  - number: 2.2.3.4
    text: |-
      Het bevoegd gezag stelt de commandant van de regionale brandweer binnen wiens gebied de inrichting geheel of in
      hoofdzaak is gelegen, en de inspecteur, in de gelegenheid advies uit te brengen over het ontwerp van de beschikking
      waarbij de nadere eis wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.2.3
  - number: 2.2.3.5
    text: Van de beschikking wordt mededeling gedaan door kennisgeving in één of meer dag-, nieuws- of huis-aan-huisbladen.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.2.3
  - number: 2.2.3.6
    text: Een afschrift van de beschikking wordt door het bevoegd gezag gezonden aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.2.3
  - number: 2.2.4.1
    text: |-
      Degene die een inrichting, als bedoeld in [artikel 2.2.1][ref1], opricht, meldt dit ten minste vier weken voor de
      oprichting schriftelijk aan het bevoegd gezag. Het bevoegd gezag zendt onverwijld een afschrift van de melding aan
      de commandant van de regionale brandweer.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.2.4
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.2.4.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot het veranderen van een inrichting, als bedoeld
      in [artikel 2.2.1][ref1], en het veranderen van de werking daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.2.4
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.2.4.3
    text: 'Bij de melding worden vermeld:'
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.2.4
  - number: 2.2.4.3.a
    text: het adres van de inrichting;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.2.4
  - number: 2.2.4.3.b
    text: |-
      de naam en het adres van degene die de inrichting opricht dan wel verandert of de werking daarvan verandert, en,
      indien dit iemand anders is, van degene die de inrichting drijft of zal drijven;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.2.4
  - number: 2.2.4.3.c
    text: de aard en omvang van de activiteiten of processen in de inrichting;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.2.4
  - number: 2.2.4.3.d
    text: de indeling en de uitvoering van de inrichting;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.2.4
  - number: 2.2.4.3.e
    text: |-
      het tijdstip waarop de inrichting of de verandering daarvan in werking zal worden gebracht, dan wel de verandering
      van de werking daarvan verwezenlijkt zal zijn.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.2.4
  - number: 2.2.4.4
    text: |-
      De in het derde lid vermelde gegevens behoeven niet te worden verstrekt indien degene die de inrichting drijft,
      deze gegevens reeds aan het bevoegd gezag heeft verschaft en het bevoegd gezag geacht kan worden over die gegevens
      te beschikken.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.2.4
  - number: 2.2.4.5
    text: |-
      Degene die de melding doet, geeft in voorkomend geval bij de melding aan welke van de ingevolge dit artikel te
      verstrekken gegevens hij reeds aan het bevoegd gezag heeft verschaft.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.2.4
  - number: 2.2.5
    text: |-
      Het bevoegd gezag zendt een afschrift van een melding als bedoeld in [artikel 2.2.4, eerste lid][ref1],
      onderscheidenlijk een afschrift van een krachtens [artikel 8.1 van de Wet milieubeheer][ref2] verleende vergunning
      aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.2.5
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 2.3.1
    text: 'Het is verboden consumentenvuurwerk voor handelsdoeleinden ter beschikking te stellen aan een ander dan:'
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.3.1
  - number: 2.3.1.a
    text: |-
      degene die een inrichting drijft als bedoeld in de [artikelen 2.2.1][ref1] en [2.2.2][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel2
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.3.1
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.3.1.b
    text: |-
      een in het buitenland gevestigde ondernemer wiens bedrijfsmatige activiteit bestaat uit het verhandelen van
      vuurwerk.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.3.1
  - number: 2.3.2.1
    text: Het is verboden consumentenvuurwerk ter beschikking te stellen aan een particulier.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.3.2
  - number: 2.3.2.2
    text: |-
      Het verbod geldt niet op 29, 30 en 31 december met dien verstande dat als een van deze dagen een zondag is het
      verbod eveneens op die zondag geldt, in welk geval het verbod om vuurwerk ter beschikking te stellen dan niet geldt
      op 28 december.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.3.2
  - number: 2.3.3
    text: |-
      Het is verboden per levering meer dan tien kilogram consumentenvuurwerk aan een particulier ter beschikking te
      stellen.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.3.3
  - number: 2.3.4
    text: |-
      Het is verboden consumentenvuurwerk aan een particulier bedrijfsmatig ter beschikking te stellen op een andere
      plaats dan een verkoopruimte die voldoet aan de in [bijlage 1][ref1] gestelde voorschriften en de door het bevoegd
      gezag overeenkomstig [artikel 2.2.3][ref2] gestelde nadere eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0013360
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel2
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.3.4
    references:
      - id: ref1
        bwb_id: BWBR0013360
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.3.5
    text: |-
      Het is verboden consumentenvuurwerk bedrijfsmatig ter beschikking te stellen aan personen die jonger zijn dan
      zestien jaar.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.3.5
  - number: 2.3.6
    text: |-
      Het is verboden consumentenvuurwerk tot ontbranding te brengen op een ander tijdstip dan tussen 31 december 10.00
      uur en 1 januari 02.00 uur van het daarop volgende jaar.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.3.6
  - number: 2.3.7
    text: |-
      De [artikelen 1.2.4][ref1], [1.2.5][ref2], [2.3.2][ref3], [2.3.3][ref4] en [2.3.6][ref5] gelden niet ten aanzien
      van fop- en schertsvuurwerk aangewezen ingevolge [artikel 1.1.1, eerste lid][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref6]: https://wetten.overheid.nl/BWBR0013360#Artikel1
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel2.3.7
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref6
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 3.1.1.1
    text: 'Professioneel vuurwerk moet zijn voorzien van:'
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.1.1
  - number: 3.1.1.1.a
    text: 'de aanduiding: Niet geschikt voor particulier gebruik;'
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.1.1
  - number: 3.1.1.1.b
    text: |-
      een vermelding of afbeelding van de soort van het vuurwerk waaruit duidelijk blijkt wat de te verwachten effecten
      tijdens het functioneren zijn;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.1.1
  - number: 3.1.1.1.c
    text: |-
      de naam, de handelsnaam of het handelsmerk en de naam en de plaats van vestiging van de fabrikant en de in
      Nederland gevestigde importeur of handelaar;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.1.1
  - number: 3.1.1.1.d
    text: |-
      het door de fabrikant bij de vervaardiging toegekende artikelnummer dat dient ter identificatie van het vuurwerk en
      het productiejaar van het vuurwerk;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.1.1
  - number: 3.1.1.1.e
    text: |-
      een gebruiksaanwijzing met zodanige aanwijzingen en waarschuwingen dat bij het dienovereenkomstig handelen geen
      letsel of schade bij de gebruiker en omstanders kan ontstaan.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.1.1
  - number: 3.1.1.2
    text: |-
      Het eerste lid geldt niet voor professioneel vuurwerk van geringe afmeting, mits dat vuurwerk zich in een
      verpakking bevindt waarop de in het eerste lid bedoelde gegevens zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.1.1
  - number: 3.1.1.3
    text: |-
      Indien door de geringe afmeting van het vuurwerk aan het eerste of tweede lid geen gevolg kan worden gegeven,
      is een bijsluiter bij het vuurwerk gevoegd, waarin de in het eerste lid bedoelde gegevens zijn opgenomen. De
      bijsluiter wordt bij de terbeschikkingstelling van het vuurwerk verstrekt.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.1.1
  - number: 3.1.1.4
    text: |-
      De in het eerste lid bedoelde aanduiding en de in het eerste en tweede lid bedoelde gegevens en de bijsluiter,
      bedoeld in het derde lid, zijn in de Nederlandse taal gesteld, begrijpelijk en duidelijk leesbaar.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.1.1
  - number: 3.1.1.5
    text: |-
      Voor theatervuurwerk dat is bestemd voor gebruik buiten het grondgebied van Nederland kan in afwijking van het
      eerste lid, onder a, worden volstaan met de aanduiding «Intended for indoor use» en «For professional use only»,
      en kunnen de in het eerste lid, onder b en e, voorgeschreven gegevens in afwijking van het vierde lid in een andere
      taal dan de Nederlandse zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.1.1
  - number: 3.1.1.6
    text: |-
      Dit artikel is niet van toepassing op vuurwerk waarvan op het moment dat het binnen het grondgebied van
      Nederland wordt gebracht, naar het oordeel van Onze Minister genoegzaam wordt aangetoond dat het binnen 48
      uur weer buiten het grondgebied van Nederland zal worden gebracht. Indien sprake is van opslag als bedoeld in
      [artikel 1.1.4, derde lid][ref1], wordt in plaats van «48 uur» gelezen: twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.1.1
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 3.1.2
    text: 'Theatervuurwerk moet voldoen aan door Onze Minister te stellen eisen. Daartoe behoren in ieder geval eisen omtrent:'
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.1.2
  - number: 3.1.2.a
    text: de ten hoogste toelaatbare lading en geluidsdruk,
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.1.2
  - number: 3.1.2.b
    text: de wijze waarop de ten hoogste toelaatbare geluidsdruk wordt bepaald, en
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.1.2
  - number: 3.1.2.c
    text: de aard, samenstelling, constructie en eigenschappen.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.1.2
  - number: 3.1.3.1
    text: |-
      Verpakt theatervuurwerk is bij het opslaan en het voorhanden hebben op zodanige wijze verpakt dat het volgens
      bijlage A van het ADR, uitsluitend kan worden aangemerkt als vuurwerk behorende tot klasse 1.4G of 1.4S.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.1.3
  - number: 3.1.3.2
    text: |-
      Dit artikel is niet van toepassing op vuurwerk waarvan op het moment dat het binnen het grondgebied van
      Nederland wordt gebracht, naar het oordeel van Onze Minister genoegzaam wordt aangetoond dat het binnen 48
      uur weer buiten het grondgebied van Nederland zal worden gebracht. Indien sprake is van opslag als bedoeld in
      [artikel 1.1.4, derde lid][ref1], wordt in plaats van 48 uur gelezen: twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.1.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 3.1.4
    text: |-
      Professioneel vuurwerk dat voldoet aan de ter uitwerking van [artikel 2.1.1][ref1] gestelde regels krachtens
      [artikel 24 van de Wet milieugevaarlijke stoffen][ref2], is bij het opslaan en het voorhanden hebben op zodanige
      wijze verpakt dat het volgens bijlage A van het ADR, uitsluitend kan worden aangemerkt als vuurwerk behorende tot
      klasse 1.4G of 1.4S. In afwijking van [artikel 3.1.1, eerste lid, onder a][ref3], is dit vuurwerk voorzien van de
      aanduiding «Geschikt voor particulier gebruik».


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.1.4
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '24'
      - id: ref3
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.2.1.1
    text: |-
      Degene die een inrichting drijft, waar professioneel vuurwerk al dan niet tezamen met consumentenvuurwerk
      wordt opgeslagen of bewerkt, voldoet aan de voorschriften die zijn opgenomen in [bijlage 2][ref1] en aan de
      veiligheidsafstanden die van toepassing zijn ingevolge [bijlage 3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013360
      [ref2]: https://wetten.overheid.nl/BWBR0013360
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.2.1
    references:
      - id: ref1
        bwb_id: BWBR0013360
      - id: ref2
        bwb_id: BWBR0013360
  - number: 3.2.1.2
    text: |-
      In afwijking van het eerste lid voldoet degene die een inrichting drijft waar theatervuurwerk al dan niet tezamen
      met professioneel vuurwerk als bedoeld in [artikel 3.1.4][ref1] wordt opgeslagen of uitsluitend professioneel
      vuurwerk als bedoeld in [artikel 3.1.4][ref2] wordt opgeslagen aan de voorschriften die zijn opgenomen in
      [bijlage 1][ref3] en aan de veiligheidsafstanden die van toepassing zijn ingevolge [bijlage 3][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013360
      [ref4]: https://wetten.overheid.nl/BWBR0013360
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.2.1
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0013360
      - id: ref4
        bwb_id: BWBR0013360
  - number: 3.2.1.3
    text: |-
      Het tweede lid is niet van toepassing indien er sprake is van opslag van
      uitsluitend theatervuurwerk in een hoeveelheid van ten hoogste 25 kilogram en het
      [Besluit horeca-, sport- en recreatie-inrichtingen milieubeheer][ref1] van toepassing is op die opslag.


      [ref1]: https://wetten.overheid.nl/BWBR0009633
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.2.1
    references:
      - id: ref1
        bwb_id: BWBR0009633
  - number: 3.2.1.4
    text: |-
      Voor de bepaling van de hoeveelheid vuurwerk, bedoeld in het derde lid, wordt uitgegaan van het gewicht van het
      vuurwerk als zijnde onverpakt vuurwerk.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.2.1
  - number: 3.2.1.5
    text: Degene die de inrichting drijft draagt er zorg voor dat de voorschriften worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.2.1
  - number: 3.2.2.1
    text: |-
      Het bevoegd gezag kan nadere eisen stellen met betrekking tot de in [bijlage 2, onder B][ref1], opgenomen
      voorschriften ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0013360
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.2.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
  - number: 3.2.2.1.a
    text: de wijze waarop verpakt of onverpakt vuurwerk wordt opgeslagen, bedoeld in voorschrift 1.9;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.2.2
  - number: 3.2.2.1.b
    text: de interne afstanden binnen de inrichting teneinde domino-effecten te voorkomen, bedoeld in voorschrift 1.13;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.2.2
  - number: 3.2.2.1.c
    text: |-
      de compartimentering van de opslag van stoffen en voorwerpen uit verschillende compatibiliteitsgroepen, bedoeld in
      voorschrift 3.15 in één ruimte;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.2.2
  - number: 3.2.2.1.d
    text: de wijze waarop bij een eventuele brand alarm moet worden geslagen, bedoeld in voorschrift 5.2.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.2.2
  - number: 3.2.2.2
    text: |-
      De nadere eisen gelden voor een ieder die de inrichting drijft. Deze draagt er zorg voor dat de nadere eisen worden
      nageleefd.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.2.2
  - number: 3.2.2.3
    text: |-
      Het bevoegd gezag kan nadere eisen wijzigen of aanvullen in het belang van de bescherming van het milieu, of
      wijzigen of intrekken indien het belang van de bescherming van het milieu zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.2.2
  - number: 3.2.2.4
    text: |-
      Het bevoegd gezag stelt de commandant van de regionale brandweer binnen wiens gebied de inrichting geheel of in
      hoofdzaak is gelegen, en de inspecteur, in de gelegenheid advies uit te brengen over het ontwerp van de beschikking
      waarbij de nadere eis wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.2.2
  - number: 3.2.2.5
    text: Van de beschikking wordt mededeling gedaan door kennisgeving in één of meer dag-, nieuws- of huis-aan-huisbladen.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.2.2
  - number: 3.2.2.6
    text: |-
      Een afschrift van de in het eerste lid bedoelde beschikking wordt door het bevoegd gezag gezonden aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.2.2
  - number: 3.2.3.1
    text: |-
      Degene die een inrichting drijft als bedoeld in [artikel 3.2.1, eerste lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.2.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.2.3.1.a
    text: |-
      stelt naar het oordeel van het bevoegd gezag op genoegzame wijze door verzekering of anderszins financiële
      zekerheid ter dekking van de aansprakelijkheid, bedoeld in [boek 6 van het Burgerlijk Wetboek][ref1], waartoe het
      drijven van de inrichting aanleiding kan geven;


      [ref1]: https://wetten.overheid.nl/BWBR0005289
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.2.3
    references:
      - id: ref1
        bwb_id: BWBR0005289
  - number: 3.2.3.1.b
    text: |-
      overlegt aan het bevoegd gezag binnen een daartoe door het bevoegd gezag gestelde termijn schriftelijk bewijs van
      de gestelde financiële zekerheid.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.2.3
  - number: 3.2.3.2
    text: |-
      De zekerheid bedraagt tenminste  € 5 000 000,00 per gebeurtenis en per inrichting en wordt in stand gehouden tot
      het moment waarop de krachtens [artikel 8.1 van de Wet milieubeheer][ref1] verleende vergunning vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.2.3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 3.2.3.3
    text: |-
      Een verzekering wordt gesloten en in stand gehouden bij een verzekeraar die in het bezit is van een vergunning of
      heeft voldaan aan de ingevolge de [artikelen 37][ref1] of [38 van de Wet toezicht verzekeringsbedrijf 1993][ref2]
      vereiste procedure met betrekking tot een bijkantoor in Nederland, dan wel, indien het de
      in [die wet][ref3] bedoelde dienstverrichting naar Nederland betreft, heeft voldaan aan het
      bepaalde in de [artikelen 111, eerste lid, onderdelen a tot en met c, of tweede lid][ref4],
      [113, eerste of vierde lid][ref5], [116, eerste lid, onderdelen a tot en met c, of derde lid][ref6],
      of [118, tweede of vijfde lid, van die wet][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0006509
      [ref4]: https://wetten.overheid.nl/BWBR0006509#Artikel111
      [ref5]: https://wetten.overheid.nl/BWBR0006509#Artikel113
      [ref6]: https://wetten.overheid.nl/BWBR0006509#Artikel116
      [ref7]: https://wetten.overheid.nl/BWBR0006509#Artikel118
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.2.3
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '37'
      - id: ref2
        bwb_id: BWBR0006509
        artikel: '38'
      - id: ref3
        bwb_id: BWBR0006509
      - id: ref4
        bwb_id: BWBR0006509
        artikel: '111'
      - id: ref5
        bwb_id: BWBR0006509
        artikel: '113'
      - id: ref6
        bwb_id: BWBR0006509
        artikel: '116'
      - id: ref7
        bwb_id: BWBR0006509
        artikel: '118'
  - number: 3.2.3.4
    text: |-
      Het eerste lid is niet van toepassing ter zake van opslag van vuurwerk door of onder verantwoordelijkheid van
      bestuursorganen die door Onze Minister zijn aangewezen. De benadeelde heeft jegens een bestuursorgaan dat geen
      financiële zekerheid als bedoeld in het eerste lid heeft gesteld de rechten welke hij overeenkomstig dit artikel
      anders tegenover de verzekeraar zou hebben, indien de financiële zekerheid door verzekering zou zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.2.3
  - number: 3.2.3.5
    text: |-
      Het eerste lid is niet van toepassing op degene die een inrichting drijft waar theatervuurwerk al dan niet tezamen
      met professioneel vuurwerk als bedoeld in [artikel 3.1.4][ref1] wordt opgeslagen of uitsluitend professioneel
      vuurwerk als bedoeld in [artikel 3.1.4][ref2] wordt opgeslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.2.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.2.4
    text: |-
      Het bevoegd gezag zendt een afschrift van een krachtens [artikel 8.1 van de Wet milieubeheer][ref1] verleende
      vergunning aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.2.4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 3.3.1.1
    text: Het is verboden professioneel vuurwerk aan een ander ter beschikking te stellen.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.1
  - number: 3.3.1.2
    text: 'Het verbod geldt niet voor het ter beschikking stellen van professioneel vuurwerk aan:'
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.1
  - number: 3.3.1.2.a
    text: |-
      een persoon die een inrichting drijft als bedoeld in [artikel 3.2.1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.1
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.3.1.2.b
    text: |-
      een houder van een vergunning als bedoeld in [artikel 3.3.2, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.1
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.3.1.2.c
    text: |-
      een in het buitenland gevestigde ondernemer wiens bedrijfsmatige activiteit bestaat uit het verhandelen van of het
      tot ontbranding brengen van professioneel vuurwerk;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.1
  - number: 3.3.1.2.d
    text: de politie;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.1
  - number: 3.3.1.2.e
    text: de brandweer;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.1
  - number: 3.3.1.2.f
    text: een instelling die vuurwerk bedrijfsmatig en uitsluitend ten behoeve van onderzoek tot ontbranding brengt;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.1
  - number: 3.3.1.2.g
    text: de krijgsmacht.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.1
  - number: 3.3.2.1
    text: |-
      Het is verboden zonder een daartoe verleende vergunning professioneel vuurwerk tot ontbranding te brengen, ten
      behoeve daarvan op te bouwen, te installeren, te bewerken, dan wel na ontbranding te verwijderen.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.2
  - number: 3.3.2.2
    text: |-
      Gedeputeerde staten van de provincie waarin de aanvrager is gevestigd zijn bevoegd om te beslissen op een aanvraag
      om een vergunning. Is de aanvrager in het buitenland gevestigd dan is Onze Minister bevoegd.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.2
  - number: 3.3.2.3
    text: 'Aan de vergunning wordt het voorschrift verbonden dat:'
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.2
  - number: 3.3.2.3.a
    text: |-
      voorafgaand aan het tot ontbranding brengen van professioneel vuurwerk door de aanvrager toestemming is verkregen
      van gedeputeerde staten van de provincie waarin het vuurwerk tot ontbranding zal worden gebracht en de aan de
      toestemming verbonden voorschriften worden nageleefd;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.2
  - number: 3.3.2.3.b
    text: |-
      het tot ontbranding te brengen vuurwerk afkomstig is uit een inrichting als bedoeld in [artikel 2.2.1][ref1],
      [2.2.2][ref2] of [3.2.1][ref3] dan wel rechtstreeks afkomstig is uit het buitenland.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.3.2.4
    text: |-
      Aan de vergunning worden voorts voorschriften verbonden in het belang van de bescherming van mens en milieu. Zij
      kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.2
  - number: 3.3.2.5
    text: |-
      Degene aan wie een vergunning is verleend, is gehouden de in het derde en vierde lid bedoelde voorschriften na
      te leven.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.2
  - number: 3.3.2.6
    text: |-
      De vergunning vervalt op het moment dat de geldigheidsduur van het certificaat van vakbekwaamheid, bedoeld in
      [artikel 3.3.3, eerste lid, onder c][ref1], afloopt. Is de vergunning verleend aan een onderneming dan vervalt
      de vergunning eveneens op het moment dat er geen persoon aan wie een certificaat van vakbekwaamheid, bedoeld in
      [artikel 4.8a, tweede lid, van het Arbeidsomstandighedenbesluit][ref2], is afgegeven, meer werkzaam is voor de
      onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 3.3.2.7
    text: |-
      Gedeputeerde staten stellen de korpschef van de politieregio waar de aanvrager is gevestigd, in de gelegenheid
      advies uit te brengen over het ontwerp van de beschikking op de aanvraag om een vergunning.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.2
  - number: 3.3.2.8
    text: Een afschrift van de vergunning wordt door gedeputeerde staten gezonden aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.2
  - number: 3.3.3.1
    text: 'Bij de aanvraag van de vergunning worden door de aanvrager de volgende gegevens verstrekt:'
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.3
  - number: 3.3.3.1.a
    text: |-
      zijn naam, adres, geboortedatum en geboorteplaats en, in voorkomend geval, de naam en het adres van de betrokken
      onderneming;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.3
  - number: 3.3.3.1.b
    text: gegevens waaruit blijkt dat de handelingen waarop de aanvraag betrekking heeft bedrijfsmatig worden verricht;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.3
  - number: 3.3.3.1.c
    text: |-
      een afschrift van een geldig certificaat van vakbekwaamheid, bedoeld in
      [artikel 4.8a, tweede lid, van het Arbeidsomstandighedenbesluit][ref1], dat is afgegeven aan de persoon door wie
      of onder wiens voortdurend toezicht de handelingen, waarop de aanvraag betrekking heeft, worden verricht en dat
      betrekking heeft op die handelingen;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.3
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 3.3.3.1.d
    text: de handelingen en de soorten vuurwerk waarop de aanvraag betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.3
  - number: 3.3.3.1.e
    text: of het tot ontbranding brengen van vuurwerk binnen of buiten een gebouw plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.3
  - number: 3.3.3.2
    text: |-
      De aanvrager stelt naar het oordeel van het bevoegd gezag bij de aanvraag op genoegzame wijze door
      verzekering of anderszins financiële zekerheid ter dekking van de aansprakelijkheid, bedoeld in
      [boek 6 van het Burgerlijk Wetboek][ref1] ter zake van de in het eerste lid, onder b, bedoelde handelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005289
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.3
    references:
      - id: ref1
        bwb_id: BWBR0005289
  - number: 3.3.3.3
    text: |-
      De zekerheid bedraagt ten minste  € 2 500 000,00 per gebeurtenis en wordt in ieder geval in stand gehouden tot het
      moment waarop de vergunning vervalt. [Artikel 3.2.3, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.3.4.1
    text: |-
      De aanvraag om toestemming als bedoeld in [artikel 3.3.2, derde lid][ref1], bij
      gedeputeerde staten gaat vergezeld van een afschrift van het werkplan, bedoeld in
      [artikel 4.8a, eerste lid, van het Arbeidsomstandighedenbesluit][ref2], een afschrift van de
      ingevolge [artikel 3.3.2, eerste lid][ref3], verleende vergunning en een afschrift van het in
      [artikel 3.3.3, eerste lid, onder c][ref4], bedoelde certificaat. Gedeputeerde staten zenden onverwijld een
      afschrift van de aanvraag aan de burgemeester van de gemeente binnen wiens gemeente het vuurwerk tot ontbranding
      zal worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.4
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.3.4.2
    text: Aan de toestemming kunnen voorschriften worden verbonden in het belang van de bescherming van mens en milieu.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.4
  - number: 3.3.4.3
    text: Degene aan wie de toestemming is verleend, is gehouden de in het tweede lid bedoelde voorschriften na te leven.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.4
  - number: 3.3.4.4
    text: 'Gedeputeerde staten stellen alvorens toestemming te verlenen:'
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.4
  - number: 3.3.4.4.a
    text: |-
      degene die de aanvrager de vergunning, bedoeld in [artikel 3.3.2, eerste lid][ref1], hebben verleend,


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.4
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.3.4.4.b
    text: |-
      de betrokken luchtverkeersdienst als omschreven in [artikel 1, onder r, van het Luchtverkeersreglement][ref1] voor
      zover het zichzelf voortdrijvend opstijgend vuurwerk betreft, niet zijnde theatervuurwerk of vuurwerk als bedoeld
      in [artikel 3.1.4][ref2], dat in de open lucht tot ontbranding zal worden gebracht binnen 15 kilometer afstand van
      een luchtvaartterrein,


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.4
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.3.4.4.c
    text: de commandant van de regionale brandweer binnen wiens gebied het vuurwerk tot ontbranding zal worden gebracht,
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.4
  - number: 3.3.4.4.d
    text: |-
      de daartoe door Onze Minister van Sociale Zaken en Werkgelegenheid aangewezen ambtenaar als bedoeld in
      [artikel 24 van de Arbeidsomstandighedenwet 1998][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.4
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 3.3.4.4.e
    text: |-
      de burgemeester van de gemeente aangrenzend aan de gemeente waar het vuurwerk tot ontbranding zal worden gebracht
      voor zover het vuurwerk effect kan hebben binnen zijn gemeente,
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.4
  - number: 3.3.4.5
    text: |-
      Gedeputeerde staten verlenen geen toestemming indien geen verklaring van de burgemeester van de gemeente binnen
      wiens gemeente het vuurwerk tot ontbranding zal worden gebracht is ontvangen, dat in verband met de veiligheid geen
      bezwaar bestaat tegen het verlenen van toestemming.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.4
  - number: 3.3.4.6
    text: |-
      Een afschrift van de beschikking waarbij toestemming wordt verleend wordt door gedeputeerde staten gezonden aan
      Onze Minister, aan een daartoe door Onze Minister van Sociale Zaken en Werkgelegenheid aangewezen ambtenaar als
      bedoeld in [artikel 24 van de Arbeidsomstandighedenwet 1998][ref1], aan de burgemeester en aan de commandant van de
      regionale brandweer, bedoeld in het vierde lid, onder c.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.4
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 3.3.4a.1
    text: |-
      In afwijking van [artikel 3.3.2, derde lid, onder a][ref1], kan degene aan wie een vergunning als bedoeld in
      [artikel 3.3.2, eerste lid][ref2], is verleend en die:


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.4a
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.3.4a.1.a
    text: ten hoogste 10 kilogram theatervuurwerk tot ontbranding wil brengen, of
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.4a
  - number: 3.3.4a.1.b
    text: |-
      ten hoogste 100 kilogram professioneel vuurwerk als bedoeld in [artikel 3.1.4][ref1] tot ontbranding wil brengen,


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.4a
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.3.4a.2
    text: |-
      Voor de bepaling van de hoeveelheid vuurwerk, bedoeld in het eerste lid, wordt uitgegaan van het gewicht van het
      vuurwerk als zijnde onverpakt vuurwerk.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.4a
  - number: 3.3.4a.3
    text: |-
      [Artikel 3.3.4, eerste lid][ref1], is van overeenkomstige toepassing op de melding aan gedeputeerde
      staten. Gedeputeerde staten zenden onverwijld een afschrift van de melding aan een daartoe
      door Onze Minister van Sociale Zaken en Werkgelegenheid aangewezen ambtenaar als bedoeld in
      [artikel 24 van de Arbeidsomstandighedenwet 1998][ref2], aan de commandant van de regionale brandweer binnen
      wiens gebied het vuurwerk tot ontbranding zal worden gebracht en aan de burgemeester van de gemeente binnen wiens
      gemeente het vuurwerk tot ontbranding zal worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.4a
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 3.3.4a.4
    text: |-
      Degene die het vuurwerk tot ontbranding wil brengen draagt er zorg voor dat de melding ten minste twee weken
      voordat het vuurwerk tot ontbranding wordt gebracht door gedeputeerde staten is ontvangen.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.4a
  - number: 3.3.4a.5
    text: |-
      In afwijking van het vierde lid kunnen gedeputeerde staten na overleg met de burgemeester en de commandant, bedoeld
      in het derde lid, in bijzondere omstandigheden een kortere termijn voor de melding toestaan.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.4a
  - number: 3.3.5.1
    text: |-
      Een vergunning als bedoeld in [artikel 3.3.2, eerste lid][ref1], kan worden gewijzigd of ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.5
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.3.5.2
    text: |-
      De [artikelen 8.22, eerste en tweede lid][ref1], [8.23, eerste en tweede lid][ref2], [8.24, eerste lid][ref3],
      [8.25, eerste tot en met derde en achtste lid][ref4], en [8.26, eerste lid, van de Wet milieubeheer][ref5] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref5
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 3.3.6.1
    text: |-
      Degene aan wie een vergunning, als bedoeld in [artikel 3.3.2, eerste lid][ref1], is verleend, houdt een register
      bij waarin zijn vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.6
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.3.6.1.a
    text: |-
      de persoon of personen aan wie een certificaat van vakbekwaamheid is afgegeven als bedoeld in
      [artikel 4.8a, tweede lid, van het Arbeidsomstandighedenbesluit][ref1], en door wie of onder wier toezicht
      bedrijfsmatig handelingen met vuurwerk worden verricht, als bedoeld in [artikel 3.3.2, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.6
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.3.6.1.b
    text: |-
      de personen die onder toezicht van de onder a bedoelde persoon of personen bedrijfsmatig handelingen met vuurwerk
      verrichten als bedoeld in [artikel 3.3.2, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.6
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.3.6.1.c
    text: |-
      de evenementen en voorstellingen, waarbij professioneel vuurwerk tot ontbranding is gebracht en de daarbij tot
      ontbranding gebrachte typen en hoeveelheden vuurwerk in kilogrammen alsmede de weigeraars, met vermelding van de
      door de fabrikant bij de vervaardiging toegekende artikelnummers die dienen ter identificatie van het vuurwerk en
      het productiejaar;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.6
  - number: 3.3.6.1.d
    text: ongewone voorvallen die zich tijdens het tot ontbranding brengen van vuurwerk hebben voorgedaan.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.6
  - number: 3.3.6.2
    text: Het register wordt binnen twee werkdagen na een wijziging dan wel na een evenement of voorstelling bijgewerkt.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.6
  - number: 3.3.6.3
    text: |-
      De gegevens worden op een zodanige wijze geregistreerd dat gedurende de periode waarover de registratieplicht
      ingevolge het vierde lid geldt, indien Onze Minister of gedeputeerde staten van de provincie die de vergunning
      hebben verleend daarom verzoeken, binnen acht uur de gegevens schriftelijk kunnen worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.6
  - number: 3.3.6.4
    text: |-
      De gegevens, bedoeld in het eerste lid, blijven ten minste voor de duur van tien jaar na de vastlegging in de
      registratie opgenomen.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.6
  - number: 3.3.6.5
    text: |-
      Degene aan wie een vergunning, als bedoeld in [artikel 3.3.2, eerste lid][ref1], is verleend, meldt een ongewoon
      voorval als bedoeld in het eerste lid, onder d, onverwijld aan gedeputeerde staten van de provincie waarin het
      vuurwerk tot ontbranding wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel3.3.6
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 4.1.1
    text: |-
      De veiligheidsafstanden, bedoeld in [bijlage 3][ref1] worden, voor zover deze in acht genomen moeten worden bij
      de vaststelling van een besluit als bedoeld in [artikel 4.2][ref2], aangemerkt als grenswaarde als bedoeld in
      [artikel 5.1, derde lid, van de Wet milieubeheer][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013360
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0013360
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '4'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '5'
  - number: 4.1.2
    text: |-
      Indien de kwaliteit van een gebied waarvoor de veiligheidsafstand in acht moet worden genomen, beter is dan de
      grenswaarde aangeeft, treedt de kwaliteit van dat gebied niet in de plaats van de grenswaarde.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel4.1
  - number: 4.2.1
    text: |-
      De gemeenteraad neemt de in [bijlage 3][ref1] gestelde afstanden in acht bij:


      [ref1]: https://wetten.overheid.nl/BWBR0013360
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
  - number: 4.2.1.a
    text: |-
      de vaststelling van een bestemmingsplan als bedoeld in [artikel 10 van de Wet op de Ruimtelijke Ordening][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel10
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '10'
  - number: 4.2.1.b
    text: |-
      het verlenen van vrijstelling van een geldend bestemmingsplan als bedoeld in
      [artikel 19, eerste lid, van die wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel19
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '19'
  - number: 4.2.1.c
    text: |-
      de wijziging van een bestemmingsplan overeenkomstig [artikel 11, eerste lid, van die wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel11
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '11'
  - number: 4.2.2
    text: |-
      Burgemeester en wethouders nemen de in [bijlage 3][ref1] gestelde afstanden in acht bij:


      [ref1]: https://wetten.overheid.nl/BWBR0013360
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
  - number: 4.2.2.a
    text: |-
      het verlenen van vrijstelling van een geldend bestemmingsplan als bedoeld in
      [artikel 19, eerste lid, van de Wet op de Ruimtelijke Ordening][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel19
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '19'
  - number: 4.2.2.b
    text: |-
      het verlenen van vrijstelling van een bestemmingsplan als bedoeld in
      [artikel 19, tweede en derde lid, van die wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel19
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '19'
  - number: 4.2.2.c
    text: |-
      de wijziging van een bestemmingsplan overeenkomstig [artikel 11, eerste lid, van die wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel11
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '11'
  - number: 4.2.2.d
    text: |-
      de verlening of wijziging van een vergunning op grond van de [Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 4.2.3
    text: |-
      Gedeputeerde staten nemen de in [bijlage 3][ref1] gestelde afstanden in acht bij de verlening of wijziging van een
      vergunning op grond van de [Wet milieubeheer][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013360
      [ref2]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
      - id: ref2
        bwb_id: BWBR0003245
  - number: 4.2.4
    text: |-
      Onze Minister neemt bij de verlening of wijziging van een vergunning op grond van de [Wet milieubeheer][ref1]
      voor een inrichting die is gelegen binnen het door hem op grond van categorie 10, bedoeld in
      [bijlage II, van het Inrichtingen- en vergunningenbesluit milieubeheer][ref2], aangewezen gebied, de in
      [bijlage 3][ref3] gestelde afstanden in acht ten aanzien van kwetsbare objecten en geprojecteerde kwetsbare
      objecten die zijn gelegen buiten het door hem aangewezen gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0005829
      [ref3]: https://wetten.overheid.nl/BWBR0013360
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
      - id: ref2
        bwb_id: BWBR0005829
      - id: ref3
        bwb_id: BWBR0013360
  - number: 4.2.5
    text: |-
      Het eerste tot en met derde lid zijn niet van toepassing ten aanzien van inrichtingen als bedoeld in
      [artikel 1.1.4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 4.2.6
    text: |-
      In afwijking van het eerste tot en met derde lid kan het bevoegd gezag een kleinere afstand dan genoemd in
      [bijlage 3, onder 1.3][ref1], vaststellen, indien het desbetreffende besluit betrekking heeft op:


      [ref1]: https://wetten.overheid.nl/BWBR0013360
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
  - number: 4.2.6.a
    text: |-
      een inrichting waar theatervuurwerk al dan niet tezamen met professioneel vuurwerk als bedoeld in
      [artikel 3.1.4][ref1] wordt opgeslagen of bewerkt,


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 4.2.6.b
    text: een inrichting waar meer dan 10 000 kilogram consumentenvuurwerk wordt opgeslagen, herverpakt of bewerkt, of
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel4.2
  - number: 4.2.6.c
    text: |-
      de bestemming van grond, voor zover die grond ligt binnen het invloedsgebied van een inrichting als bedoeld onder
      a of b, indien aan de vergunning als bedoeld in [artikel 8.1 van de Wet milieubeheer][ref1] voor de desbetreffende
      inrichting zodanige voorschriften zijn verbonden dat:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 4.2.6.c.1°
    text: |-
      de warmtestraling ten gevolge van brand in die inrichting waarbij vuurwerk betrokken is voor personen die zich
      ophouden buiten een gebouw dat onderdeel is van een kwetsbaar object of een geprojecteerd kwetsbaar object beperkt
      blijft tot ten hoogste 10 kW/m2, en
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel4.2
  - number: 4.2.6.c.2°
    text: |-
      de weerstand tegen branddoorslag en brandoverslag tussen de deuropening van een bewaarplaats of een
      bufferbewaarplaats en een gebouw, indien dat gebouw een kwetsbaar object of een geprojecteerd kwetsbaar object is,
      niet lager is dan 60 minuten.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel4.2
  - number: 4.3.1
    text: |-
      Indien voor het desbetreffende gebied een bestemmingsplan geldt, gelden de veiligheidsafstanden,
      tenzij in [bijlage 3][ref1] anders is aangegeven, vanaf de uitwendige scheidingsconstructie, bedoeld in
      [artikel 1.1 van het Bouwbesluit 2003][ref2], van het gebouw waar vuurwerk wordt opgeslagen of bewerkt binnen een
      inrichting als bedoeld in de [artikelen 2.2.1][ref3], [2.2.2][ref4] of [3.2.1][ref5], tot aan de bestemmingsgrens.


      [ref1]: https://wetten.overheid.nl/BWBR0013360
      [ref2]: https://wetten.overheid.nl/BWBR0012727#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
      - id: ref2
        bwb_id: BWBR0012727
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 4.3.2
    text: |-
      Indien een bestemmingsplan voor het desbetreffende gebied ontbreekt, gelden de veiligheidsafstanden,
      tenzij in [bijlage 3][ref1] anders is aangegeven, vanaf de uitwendige scheidingsconstructie, bedoeld in
      [artikel 1.1 van het Bouwbesluit 2003][ref2], van het gebouw, bedoeld in het eerste lid, tot aan de eigendomsgrens
      van het gebied dat behoort bij het kwetsbare object.


      [ref1]: https://wetten.overheid.nl/BWBR0013360
      [ref2]: https://wetten.overheid.nl/BWBR0012727#Artikel1
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
      - id: ref2
        bwb_id: BWBR0012727
        artikel: '1'
  - number: 4.3.3
    text: |-
      In afwijking van het eerste lid gelden de veiligheidsafstanden tot tien meter vanaf het kwetsbare object of het
      geprojecteerde kwetsbare object, indien:
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel4.3
  - number: 4.3.3.a
    text: |-
      dat object een gebouw is, niet zijnde een gebouw als bedoeld in [artikel 1.1.1, eerste lid, onder d, e of f][ref1],
      en de grens van de bouwstrook meer dan tien meter vanaf de bestemmingsgrens is gelegen;


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 4.3.3.b
    text: |-
      dat object een woonwagen als bedoeld in de [Woningwet][ref1] is die meer dan tien meter vanaf de grens van het
      gebied dat voor woonwagens is bestemd, is of mag worden geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: 4.3.4
    text: |-
      Indien in het bestemmingsplan geen bouwstrook is aangegeven, gelden de veiligheidsafstanden tot aan de
      bestemmingsgrens.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel4.3
  - number: 4.3.5
    text: 'In afwijking van het tweede lid gelden de veiligheidsafstanden tot tien meter vanaf het kwetsbare object, indien:'
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel4.3
  - number: 4.3.5.a
    text: |-
      dat object een gebouw is, niet zijnde een gebouw als bedoeld in [artikel 1.1.1, eerste lid, onder d, e of f][ref1],
      dat meer dan tien meter vanaf de eigendomsgrens van het desbetreffende gebied is gelegen;


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 4.3.5.b
    text: |-
      dat object een woonwagen als bedoeld in de [Woningwet][ref1] is die meer dan tien meter van de eigendomsgrens van
      het desbetreffende perceel of van het gebied dat voor woonwagens is aangewezen, is geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: 4.3.6
    text: |-
      In afwijking van het eerste tot en met vijfde lid gelden de veiligheidsafstanden, tenzij in
      [bijlage 3][ref1] anders is aangegeven, vanaf de uitwendige scheidingsconstructie, bedoeld in
      [artikel 1.1 van het Bouwbesluit 2003][ref2], van het gebouw, bedoeld in het eerste lid, tot aan de ligplaats van
      een woonschip als bedoeld in [artikel 1.1.1, eerste lid, onder c][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013360
      [ref2]: https://wetten.overheid.nl/BWBR0012727#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel1
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
      - id: ref2
        bwb_id: BWBR0012727
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '4.4'
    text: |-
      Onze Minister geeft voor 1 januari 2008 aan in hoeverre de bij dit besluit gestelde grenswaarden herziening
      behoeven.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel4.4
  - number: 5.2.1
    text: 'Ingetrokken worden:'
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel5.2.1
  - number: 5.2.1.a
    text: het Vuurwerkbesluit Wet milieugevaarlijke stoffen;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel5.2.1
  - number: 5.2.1.b
    text: het Besluit opslag vuurwerk milieubeheer;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel5.2.1
  - number: 5.2.1.c
    text: het Reglement Gevaarlijke Stoffen;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel5.2.1
  - number: 5.2.1.d
    text: |-
      de beschikking van de Staatssecretaris van Verkeer en Waterstaat van 6 november 1979, houdende voorschriften voor
      de aflevering van ontploffingsgevaarlijke stoffen;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel5.2.1
  - number: 5.2.1.e
    text: |-
      de regeling van de Staatssecretaris van Verkeer en Waterstaat van 17 maart 1980, houdende verbod tot het gebruik
      van explosieven voor opruimingswerkzaamheden;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel5.2.1
  - number: 5.2.1.f
    text: |-
      de ontheffing van het Reglement Gevaarlijke Stoffen van de Staatssecretaris van Verkeer en Waterstaat van 19
      december 1985;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel5.2.1
  - number: 5.2.1.g
    text: |-
      de regeling van de Minister van Verkeer en Waterstaat van 20 december 1990, houdende vergunningplicht voor het
      afleveren, ter aflevering aanwezig houden en bezigen van vuurwerk;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel5.2.1
  - number: 5.2.1.h
    text: het Interim-besluit bezigen en afleveren professioneel vuurwerk Wms;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel5.2.1
  - number: 5.2.1.i
    text: |-
      de Interimregeling aanwijzing toezichthoudende ambtenaren Interim-besluit bezigen en afleveren professioneel
      vuurwerk Wms.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel5.2.1
  - number: 5.3.1
    text: |-
      Een vergunning die is verleend krachtens artikel 41, eerste lid, van het Reglement Gevaarlijke Stoffen, wordt tot
      en met 31 december 2002 gelijkgesteld met een vergunning als bedoeld in [artikel 3.3.2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel5.3.1
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 5.3.2.1
    text: |-
      Indien op het tijdstip waarop de [paragrafen 2 van de hoofdstukken 2][ref1] en [3 van dit besluit][ref2] in
      werking treden, ten opzichte van kwetsbare of geprojecteerde kwetsbare objecten niet wordt voldaan aan de van
      toepassing zijnde veiligheidsafstanden, draagt – behoudens eerdere intrekking van de vergunning – degene die de
      inrichting drijft er binnen twee jaar na inwerkingtreding van dit besluit zorg voor dat de veiligheidsafstanden
      zijn geëffectueerd.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel5.3.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013360
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 5.3.2.2
    text: |-
      In afwijking van het eerste lid kunnen gedeputeerde staten op verzoek van degene die de inrichting drijft een
      kleinere veiligheidsafstand dan genoemd in [bijlage 3, onder 1.3][ref1], vaststellen ten behoeve van:


      [ref1]: https://wetten.overheid.nl/BWBR0013360
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel5.3.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
  - number: 5.3.2.2.a
    text: |-
      een inrichting waar theatervuurwerk al dan niet tezamen met professioneel vuurwerk als bedoeld in
      [artikel 3.1.4][ref1] wordt opgeslagen of bewerkt, of


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel5.3.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 5.3.2.2.b
    text: |-
      een inrichting waar meer dan 10 000 kilogram consumentenvuurwerk wordt opgeslagen, herverpakt of bewerkt, indien
      aan de vergunning als bedoeld in [artikel 8.1 van de Wet milieubeheer][ref1] voor de desbetreffende inrichting
      zodanige voorschriften zijn verbonden dat:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel5.3.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 5.3.2.2.b.1°
    text: |-
      de warmtestraling ten gevolge van brand in die inrichting waarbij vuurwerk betrokken is voor personen die zich
      ophouden buiten een gebouw dat onderdeel is van een kwetsbaar object of een geprojecteerd kwetsbaar object beperkt
      blijft tot ten hoogste 10 kW/m2, en
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel5.3.2
  - number: 5.3.2.2.b.2°
    text: |-
      de weerstand tegen branddoorslag en brandoverslag tussen de deuropening van een bewaarplaats of een
      bufferbewaarplaats en een gebouw, indien dat gebouw een kwetsbaar object of een geprojecteerd kwetsbaar object is,
      niet lager is dan 60 minuten.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel5.3.2
  - number: 5.3.2.3
    text: |-
      Het verzoek, bedoeld in het tweede lid, wordt gedaan voor 1 maart 2004 en gaat vergezeld van toereikende gegevens
      met betrekking tot de warmtestraling en brandoverslag die de inrichting kan veroorzaken.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel5.3.2
  - number: 5.3.2.4
    text: |-
      Gedeputeerde staten stellen alvorens toepassing te geven aan het tweede lid de commandant van de regionale
      brandweer binnen wiens gebied de inrichting geheel of in hoofdzaak is gelegen, in de gelegenheid advies uit te
      brengen op het verzoek, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel5.3.2
  - number: 5.3.2.5
    text: |-
      Indien gedeputeerde staten toepassing geven aan het tweede lid wordt voor de effectuering van de
      veiligheidsafstanden, in afwijking van het eerste lid in plaats van «binnen twee jaar na inwerkingtreding van dit
      besluit» gelezen: uiterlijk 1 maart 2005.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel5.3.2
  - number: 5.3.2.6
    text: |-
      Het eerste lid geldt niet ten aanzien van geprojecteerde kwetsbare objecten, voor zover het bestemmingsplan waarin
      deze objecten zijn opgenomen, is vastgesteld op een tijdstip meer dan tien jaar voorafgaand aan het tijdstip waarop
      de [paragrafen 2 van de hoofdstukken 2][ref1] en [3 van dit besluit][ref2] in werking treden.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel5.3.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013360
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 5.3.3.1
    text: |-
      Voor inrichtingen waarvoor onmiddellijk voorafgaand aan het tijdstip waarop de
      [paragrafen 2 van de hoofdstukken 2][ref1] en [3 van dit besluit][ref2] in werking treden, een vergunning gold
      voor het opslaan, herverpakken of bewerken van vuurwerk krachtens [artikel 8.1 van de Wet milieubeheer][ref3] zijn
      gedurende twee jaar na inwerkingtreding van dit besluit – behoudens eerdere intrekking van de vergunning of het
      verstrijken van de periode waarvoor de vergunning is verleend – [artikel 2.3.4][ref4] en de voorschriften opgenomen
      in [bijlagen 1][ref5] en [2][ref6] die ten gevolge van de inwerkingtreding van de [artikelen 2.2.2][ref7] en
      [3.2.1][ref8] gaan gelden, niet van toepassing. Gedurende die periode blijven een zodanige vergunning, de aan de
      vergunning verbonden voorschriften en artikel 9 van het Vuurwerkbesluit Wet milieugevaarlijke stoffen, zoals dat
      luidde voor de inwerkingtreding van dit besluit, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0013360
      [ref6]: https://wetten.overheid.nl/BWBR0013360
      [ref7]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref8]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel5.3.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
        hoofdstuk: '2'
        paragraaf: '2'
