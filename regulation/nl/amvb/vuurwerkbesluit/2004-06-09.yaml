preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 20 september
    2001, nr. MJZ2001102504, Centrale Directie Juridische Zaken, Afdeling Wetgeving, gedaan in overeenstemming met
    Onze Minister van Verkeer en Waterstaat, de Minister van Volksgezondheid, Welzijn en Sport, de Staatssecretaris
    van Binnenlandse Zaken en Koninkrijksrelaties en de Staatssecretaris van Sociale Zaken en Werkgelegenheid, J. F.
    Hoogervorst;

    Gelet op de artikelen 24, 32, tweede en vierde lid, en artikel 39, derde lid, van de Wet milieugevaarlijke stoffen,
    artikel 3 van de Wet vervoer gevaarlijke stoffen, artikel 2c, derde lid, van de Wet rampen en zware ongevallen en
    de artikelen 16 en 20 van de Arbeidsomstandighedenwet 1998, artikel 74c van het Wetboek van Strafrecht, artikel 18,
    derde lid, van de Wet politieregisters, artikel 9, vijfde lid, onder b, van de Wet wapens en munitie,

    voor zover het betreft artikel 5.1.3, gelet op de artikelen 8.2, tweede lid, 8.5 en 8.7 van de Wet milieubeheer,

    voor zover het betreft de artikelen 1.1.4, 1.2.2, eerste lid, onder b, 1.4.3, 2.1.2, 2.2.1, 2.2.3, 2.2.4 en 5.1.9
    tot en met 5.1.14, gelet op de artikelen 8.19, 8.40 en 8.41 van de Wet milieubeheer,

    voor zover het betreft de artikelen 1.1.4, 1.2.2, eerste lid, onder b, en tweede lid, onder b, 1.4.3, 2.1.2, 2.2.2,
    2.2.3, 3.2.1, 3.2.2 en 3.2.3, gelet op artikel 8.44 van de Wet milieubeheer,

    voor zover het betreft de artikelen 4.1 tot en met 4.4, gelet op de artikelen 5.1 en 5.3 van de Wet milieubeheer,
    en

    voor zover het betreft artikel 5.1.6, gelet op artikel 18.4 van de Wet milieubeheer;

    De Raad van State gehoord (advies van 13 december 2001, nr. W08.01.0495/V);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van
    21 januari 2002, nr. MJZ2002005975, Centrale Directie Juridische Zaken, Afdeling Wetgeving, uitgebracht in
    overeenstemming met Onze Minister van Verkeer en Waterstaat, de Minister van Volksgezondheid, Welzijn en Sport,
    de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties, en de Staatssecretaris van Sociale Zaken en
    Werkgelegenheid, J. F. Hoogervorst;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#ArtikelAanhef
articles:
  - number: 1.1.1.1
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: Onze Minister: Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer; ADR: de op 30 september 1957 te Genève tot stand gekomen
      Europese Overeenkomst betreffende het internationale vervoer van gevaarlijke stoffen over de weg (Trb. 1959, 171);
      bijlage: 'bij dit besluit behorende bijlage; bedrijfsmatig: in de uitoefening van een beroep of bedrijf of tegen'
      vergoeding; bestemmingsgrens: grens van het perceel waarop de bouw, vestiging of plaatsing van een kwetsbaar object
      op grond van het voor het betrokken gebied geldende bestemmingsplan geëffectueerd of toelaatbaar is; bevoegd gezag:
      bestuursorgaan dat bevoegd is of zou zijn een vergunning krachtens [artikel 8.1 van de Wet milieubeheer][ref1]
      te verlenen, voor een inrichting waar consumentenvuurwerk of professioneel vuurwerk wordt opgeslagen of bewerkt;
      bouwstrook: gedeelte van het perceel dat op grond van het voor het betrokken gebied geldende bestemmingsplan voor
      de bouw van een kwetsbaar object is bestemd; consumentenvuurwerk: vuurwerk dat is bestemd voor particulier gebruik;
      fop- en schertsvuurwerk: door Onze Minister aangewezen consumentenvuurwerk; geprojecteerd kwetsbaar object: nog
      niet aanwezig kwetsbaar object dat op grond van het voor het betrokken gebied geldende bestemmingsplan toelaatbaar
      is; inspecteur: de ter plaatse bevoegde inspecteur van het staatstoezicht op de volksgezondheid, die door Onze
      Minister is aangewezen; kwetsbare objecten:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.1.1
