    text: |-
      geen houder is van een vergunning als bedoeld in [artikel 3.3.2, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.1.1
