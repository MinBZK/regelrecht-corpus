        paragraaf: '3'
  - number: 1.1.1.4.c
    text: |-
      in het buitenland is gevestigd en wiens bedrijfsmatige activiteit niet bestaat uit het verhandelen van of het tot
      ontbranding brengen van vuurwerk.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.1.1
  - number: 1.1.1.5
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.1.1
  - number: 1.1.1.5.a
    text: |-
      verpakt vuurwerk: vuurwerk inclusief het omhulsel en eventuele verpakking, detailhandelsverpakking of
      assortimentverpakking en inclusief de transportverpakking als bedoeld in het ADR;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.1.1
  - number: 1.1.1.5.b
    text: |-
      onverpakt vuurwerk: vuurwerk inclusief het omhulsel en eventuele verpakking, detailhandelsverpakking of
      assortimentverpakking doch exclusief de transportverpakking als bedoeld in het ADR;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.1.1
  - number: 1.1.1.5.c
    text: 'hoeveelheid consumentenvuurwerk in de bewaarplaats: massa verpakt consumenten-vuurwerk, uitgedrukt in kilogrammen;'
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.1.1
  - number: 1.1.1.5.d
    text: |-
      hoeveelheid consumentenvuurwerk in de bufferbewaarplaats of verkoopruimte: massa verpakt en onverpakt vuurwerk,
      uitgedrukt in kilogrammen onverpakt vuurwerk;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.1.1
  - number: 1.1.1.5.e
    text: |-
      hoeveelheid consumentenvuurwerk in de inrichting: sommatie van de aanwezige hoeveelheid consumentenvuurwerk in de
      bewaarplaats, de bufferbewaarplaats en de verkoopruimte, uitgedrukt in kilogrammen;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.1.1
  - number: 1.1.1.5.f
    text: |-
      netto explosieve massa: totale hoeveelheid pyrotechnische stof of preparaat, met inbegrip van eventuele
      toevoegingen, in professioneel vuurwerk, niet zijnde theatervuurwerk of vuurwerk als bedoeld in
      [artikel 3.1.4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.1.1
    references:
