  - number: 5.4.1
    text: |-
      Onze Minister wijst een vertaling aan van bijlage A van het ADR of draagt zorg voor een vertaling en doet van de
      aanwijzing of wijze van bekendmaking van de vertaling mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel5.4.1
  - number: 5.4.2.1
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel5.4.2
  - number: 5.4.2.2
    text: |-
      [Artikel 4.2][ref1] kan tot twee jaar na inwerkingtreding van de [artikelen 4.1 tot en met 4.3][ref2] buiten
      toepassing worden gelaten ten aanzien van besluiten die betrekking hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel4
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel5.4.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '4'
        hoofdstuk: '4'
  - number: 5.4.2.2.1°
    text: |-
      het gebied gelegen binnen de veiligheidsafstand die in acht genomen moet worden ten opzichte van een inrichting
      waar professioneel vuurwerk al dan niet tezamen met consumentenvuurwerk wordt opgeslagen of bewerkt;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel5.4.2
  - number: 5.4.2.2.2°
    text: |-
      de verlening of wijziging van een vergunning op grond van de [Wet milieubeheer][ref1] ten behoeve van inrichtingen
      in het onder 1° bedoelde gebied,


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel5.4.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 5.4.2.3
    text: |-
      Het tweede lid geldt niet voor zover het besluit, bedoeld in [artikel 4.2][ref1], betrekking heeft op een
      inrichting als bedoeld in [artikel 3.2.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel3
