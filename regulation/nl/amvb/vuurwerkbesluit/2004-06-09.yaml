        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 1.1.2.1
    text: |-
      Vuurwerk wordt in ieder geval aangemerkt als vuurwerk dat is bestemd voor particulier gebruik in de zin van
      [artikel 1.1.1, eerste lid][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.1.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 1.1.2.1.a
    text: het tot ontbranding wordt gebracht door een particulier,
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.1.2
  - number: 1.1.2.1.b
    text: het te koop wordt aangeboden of ter beschikking wordt gesteld aan, gekocht of besteld door een particulier,
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.1.2
  - number: 1.1.2.1.c
    text: het aangetroffen wordt bij een particulier,
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.1.2
  - number: 1.1.2.1.d
    text: |-
      het binnen het grondgebied van Nederland wordt gebracht of voorhanden wordt gehouden met het oogmerk het aan
      particulieren ter beschikking te stellen, of
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.1.2
  - number: 1.1.2.1.e
    text: 'het is voorzien van de aanduiding: Geschikt voor particulier gebruik.'
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.1.2
  - number: 1.1.2.2
    text: Vuurwerk waarvan de bestemming niet kan worden vastgesteld, wordt aangemerkt als professioneel vuurwerk.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.1.2
  - number: 1.1.3
    text: 'Dit besluit is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.1.3
  - number: 1.1.3.a
    text: in beslag genomen vuurwerk dat in beheer is bij de overheid;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.1.3
  - number: 1.1.3.b
    text: |-
      vuurwerk waarover door de krijgsmacht, de politie of de brandweer wordt beschikt ten behoeve van
      instructiedoeleinden;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.1.3
  - number: 1.1.3.c
    text: |-
      vuurwerk dat in het kader van internationaal vervoer per zeeschip of vliegtuig binnen het grondgebied van Nederland
      wordt gebracht en niet in Nederland wordt gelost of rechtstreeks wordt overgeladen naar een ander zeeschip
      onderscheidenlijk vliegtuig.
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.1.3
  - number: 1.1.4.1
    text: |-
      De [artikelen 2.2.1 tot en met 2.2.4][ref1] en de [artikelen 3.2.1][ref2] en [3.2.2][ref3] zijn
      niet van toepassing op de opslag van vuurwerk in inrichtingen waarvoor een vergunning krachtens
      [artikel 8.1 van de Wet milieubeheer][ref4] is verleend die betrekking heeft op de opslag van vuurwerk, voor
      zover deze plaatsvindt gedurende ten hoogste 48 uur te rekenen vanaf het moment van opslaan en in afwachting van
      aansluitend vervoer naar een vooraf bekende ontvanger, met inbegrip van het laden en lossen van het vuurwerk en de
      overbrenging daarvan naar een andere tak van vervoer, voor zover daadwerkelijk in aansluitend vervoer is voorzien
      en het betrokken vuurwerk in de oorspronkelijke verpakking blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.1.4
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
