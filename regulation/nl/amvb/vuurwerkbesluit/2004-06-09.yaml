  - number: 5.3.3.3
    text: |-
      Voor inrichtingen waarvoor onmiddellijk voorafgaand aan het tijdstip waarop
      [paragraaf 2 van hoofdstuk 2 van dit besluit][ref1] in werking treedt, een melding was gedaan krachtens het
      Besluit opslag vuurwerk milieubeheer, zijn [artikel 2.3.4][ref2] en de voorschriften opgenomen in [bijlage 1][ref3]
      die ten gevolge van de inwerkingtreding van [artikel 2.2.1][ref4] gaan gelden, niet van toepassing gedurende twee
      jaar na inwerkingtreding van dit besluit. Gedurende die periode blijven de voorschriften die gesteld zijn bij
      of krachtens het Besluit opslag vuurwerk milieubeheer en artikel 9 van het Vuurwerkbesluit Wet milieugevaarlijke
      stoffen, zoals dat luidde voor de inwerkingtreding van dit besluit, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0013360
      [ref4]: https://wetten.overheid.nl/BWBR0013360#Artikel2
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel5.3.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
        hoofdstuk: '2'
