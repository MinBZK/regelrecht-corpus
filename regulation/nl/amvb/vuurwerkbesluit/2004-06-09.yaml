  - number: 5.3.3.6
    text: |-
      Voor de in het eerste en derde lid bedoelde inrichtingen, voor zover daarin niet meer
      dan 10 000 kg consumentenvuurwerk wordt opgeslagen, wordt voor zover het betreft de in
      [bijlage 1, voorschriften 5.1 tot en met 5.5][ref1] genoemde onderdelen in plaats van «gedurende twee jaar na
      inwerkingtreding van dit besluit» gelezen: tot uiterlijk 1 november 2004.


      [ref1]: https://wetten.overheid.nl/BWBR0013360
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel5.3.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
  - number: 5.3.4
    text: |-
      Met de aanduiding «Geschikt voor particulier gebruik» genoemd in de [artikelen 1.1.2, eerste lid, onder e][ref1],
      [1.3.1, eerste lid, onder d][ref2], [2.1.3, eerste lid, onder a][ref3], en [2.1.4][ref4] wordt tot 2 januari 2005
      gelijkgesteld de aanduiding «bestemd voor particulier gebruik», indien deze aanduiding is aangebracht op vuurwerk
      dat voor 1 januari 2003 is vervaardigd.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel2
