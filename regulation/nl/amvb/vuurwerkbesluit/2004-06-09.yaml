  - number: 5.3.3.2
    text: |-
      Voor inrichtingen waarvoor onmiddellijk voorafgaand aan het tijdstip waarop de
      [paragrafen 2 van de hoofdstukken 2][ref1] en [3 van dit besluit][ref2] in werking treden, een vergunning gold
      voor het opslaan, herverpakken of bewerken van vuurwerk krachtens [artikel 8.1 van de Wet milieubeheer][ref3]
      en binnen twee jaar na de inwerkingtreding van dit besluit ten gevolge van het veranderen van de inrichting dan
      wel het veranderen van de werking daarvan de vergunning moet worden gewijzigd, zijn [artikel 2.3.4][ref4] en
      de voorschriften opgenomen in [bijlagen 1][ref5] en [2][ref6] van toepassing, voor zover de wijziging daarop
      betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0013360
      [ref6]: https://wetten.overheid.nl/BWBR0013360
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel5.3.3
