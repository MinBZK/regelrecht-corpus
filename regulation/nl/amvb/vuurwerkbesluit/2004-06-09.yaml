    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.1.1
  - number: 1.1.1.1.i
    text: gebouwen ten behoeve van het belijden van godsdienst of levensovertuiging;
    url: https://wetten.overheid.nl/BWBR0013360/2004-06-09#Artikel1.1.1
  - number: 1.1.1.1.j
    text: gebouwen die worden of plegen te worden gebruikt voor sportieve of recreatieve doeleinden;
