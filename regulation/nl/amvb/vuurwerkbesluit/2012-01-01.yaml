  - number: 1.2.6
    text: |-
      1 Het is een ieder verboden ander vuurwerk dan consumentenvuurwerk dat voldoet aan de bij dit besluit gestelde
      eisen of de ter uitwerking van dit besluit krachtens [artikel 9.2.2.1 van de Wet milieubeheer][ref1] gestelde
      regels met betrekking tot consumentenvuurwerk, aan te prijzen of aan te bevelen:

      a. als consumentenvuurwerk, of

      b. indien hij weet of redelijkerwijs moet vermoeden dat dit vuurwerk zal worden aangewend voor een ander gebruik
      dan waartoe het gelet op de samenstelling of eigenschappen of de bijbehorende gebruiksaanwijzing, kennelijk is
      geschikt.

      2 Het eerste lid is van overeenkomstige toepassing op pyrotechnische artikelen voor theatergebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9.2.2.1
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel1.2.6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: 9.2.2.1
  - number: 1.2.7
    text: |-
      Het is een ieder die anders dan beroepshalve vuurwerk of pyrotechnische artikelen voor theatergebruik tot
      ontbranding brengt, verboden handelingen te verrichten of na te laten waarvan hij weet of redelijkerwijs had kunnen
      vermoeden dat daardoor gevaren kunnen optreden voor mens of milieu.
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel1.2.7
  - number: 1.3.1
    text: |-
      1 Degene die vuurwerk of pyrotechnische artikelen voor theatergebruik binnen het grondgebied van Nederland brengt,
      draagt ervoor zorg dat:

      a. op de verpakking waarin het vuurwerk of de pyrotechnische artikelen voor theatergebruik zich tijdens het vervoer
      bevinden, is aangeduid de klasse waarin het vuurwerk of de pyrotechnische artikelen voor theatergebruik volgens
      bijlage A van het ADR zijn ingedeeld als vuurwerk, en de aanduiding van de klasse overeenstemt met de eigenschappen
      van dat verpakte vuurwerk,

      b. het vuurwerk of pyrotechnische artikelen voor theatergebruik vergezeld gaan van een door of namens hem
      opgestelde schriftelijke verklaring waarin per transportverpakking is aangeduid volgens welke klasse het vuurwerk
      of pyrotechnische artikelen voor theatergebruik ingevolge onderdeel a zijn ingedeeld en waarin hij verklaart dat de
      aanduiding van die klasse overeenstemt met de eigenschappen van de verpakte artikelen.

      c. aan degene aan wie hij het vuurwerk of pyrotechnische artikelen voor theatergebruik na het binnen het
      grondgebied van Nederland te hebben gebracht ter beschikking stelt, een schriftelijke verklaring als bedoeld onder
      b wordt afgegeven.

      2 Degene die het vuurwerk of pyrotechnische artikelen voor theatergebruik opslaat draagt ervoor zorg dat op
      artikelen die verpakt worden opgeslagen de aanduiding van de klasse waarin de artikelen volgens bijlage A van het
      ADR zijn ingedeeld als vuurwerk aanwezig is en blijft en dat hij in het bezit is van de schriftelijke verklaring,
      bedoeld in het eerste lid, onder b.

      3 Het eerste lid, onder c , is niet van toepassing op vuurwerk of pyrotechnische artikelen voor theatergebruik
      waarvan op het moment dat deze artikelen binnen het grondgebied van Nederland worden gebracht, naar het oordeel van
      Onze Minister genoegzaam wordt aangetoond dat zij binnen 48 uur weer buiten het grondgebied van Nederland zullen
      worden gebracht. Indien sprake is van opslag als bedoeld in [artikel 1.1.4, derde lid][ref1], wordt in plaats van
      «48 uur» gelezen: twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1.1.4
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel1.3.1
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 1.1.4
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 1.3.2
    text: |-
      1 Degene die vuurwerk of pyrotechnische artikelen voor theatergebruik binnen of buiten het grondgebied van
      Nederland brengt, meldt voorafgaand schriftelijk het voornemen hiertoe bij Onze Minister. De melding wordt ten
      minste drie werkdagen voorafgaand aan het binnen of buiten Nederland brengen van de artikelen gedaan. Indien
      de melding wordt gedaan op een werkdag voor 12.00 uur wordt in de vorige volzin in plaats van «drie werkdagen»
      gelezen: twee werkdagen.

      2 In afwijking van het eerste lid is het degene die consumentenvuurwerk in de periode van 15 december tot 1 januari
      binnen of buiten het grondgebied van Nederland brengt, toegestaan het voornemen hiertoe ten minste 24 uur van te
      voren schriftelijk bij Onze Minister te melden.

      3 In afwijking van het eerste lid is het binnen 24 uur nadat is of zou worden aangevangen met het tot
      ontbranding brengen van professioneel vuurwerk of pyrotechnische artikelen voor theatergebruik overeenkomstig
      [artikel 3B.1][ref1], toegestaan de resterende artikelen buiten het grondgebied van Nederland te brengen zonder
      voorafgaande melding, met dien verstande dat binnen een werkdag na het buiten het grondgebied van Nederland brengen
      van de artikelen, door degene die de artikelen buiten Nederland heeft gebracht een melding aan Onze Minister wordt
      gedaan.

      4 Bij de melding worden in ieder geval de volgende gegevens verstrekt:

      a. de naam en het adres van degene die het vuurwerk of de pyrotechnische artikelen voor theatergebruik binnen of
      buiten het grondgebied van Nederland brengt;

      b. de voorziene plaats waar, de datum en het verwachte tijdstip, waarop het vuurwerk of pyrotechnische artikelen
      voor theatergebruik binnen of buiten het grondgebied van Nederland worden gebracht;

      c. of het consumenten- of professioneel vuurwerk dan wel pyrotechnische artikelen voor theatergebruik betreft, het
      door de fabrikant bij de vervaardiging toegekende artikelnummer dat dient ter identificatie van het artikel, de
      CE-markering, het productiejaar, het type vuurwerk of pyrotechnische artikelen voor theatergebruik, de NEM, per
      artikelnummer de hoeveelheid verpakt vuurwerk of pyrotechnische artikelen voor theatergebruik in kilogrammen of het
      gewicht per verpakkingseenheid in kilogrammen en indien van toepassing het containernummer waarin het vuurwerk of
      de pyrotechnische artikelen voor theatergebruik zich bevinden;

      d. de voorziene datum waarop en de plaats waar het vuurwerk of de pyrotechnische artikelen voor theatergebruik
      worden gelost of overgeladen en, indien de artikelen aansluitend aan het binnen het grondgebied van Nederland
      brengen tot ontbranding worden gebracht, de plaats van die ontbranding;

      e. bij binnen het grondgebied van Nederland brengen het land van productie, de naam van de onderneming die het
      vuurwerk of de pyrotechnische artikelen voor theatergebruik geproduceerd heeft, de naam en het adres van degene bij
      wie de artikelen worden opgeslagen, en de naam en het adres van degene voor wie de artikelen zijn bestemd;

      f. bij buiten het grondgebied van Nederland brengen de naam en het adres van degene voor wie het vuurwerk of de
      pyrotechnische artikelen voor theatergebruik zijn bestemd, en het adres van degene bij wie de artikelen worden
      afgeleverd in het buitenland.

      5 De melding dient te worden gedaan op een formulier waarvan het model wordt vastgesteld door Onze Minister.

      6 Afwijking van de gemelde gegevens wordt voorafgaand aan het binnen of buiten het grondgebied van Nederland
      brengen van vuurwerk of de pyrotechnische artikelen voor theatergebruik terstond aan Onze Minister gemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3B.1
