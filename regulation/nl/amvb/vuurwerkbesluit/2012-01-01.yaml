    text: |-
      Een certificaat van vakbekwaamheid als bedoeld in
      [artikel 4.9, tweede lid, van het Arbeidsomstandighedenbesluit][ref1], dat voor 4 juli 2010 is afgegeven aan
      de houder van een vergunning als bedoeld in [artikel 3B.1][ref2], geldt, indien het betrekking heeft of mede
      betrekking heeft op professioneel vuurwerk, mede voor consumentenvuurwerk en pyrotechnische artikelen voor
      theatergebruik.


