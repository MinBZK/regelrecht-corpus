  - number: 2.2.2
    text: |-
      1 Degene die een inrichting drijft waar:

      a. meer dan 1 000 kilogram consumentenvuurwerk wordt opgeslagen of herverpakt, of

      b. consumentenvuurwerk wordt bewerkt,

      voldoet aan de voorschriften die zijn opgenomen in [bijlage 1 onder A, B en D][ref1] en aan de veiligheidsafstanden
      die van toepassing zijn ingevolge [bijlage 3][ref2].

      2 Degene die de inrichting drijft draagt er zorg voor dat de voorschriften worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0013360
      [ref2]: https://wetten.overheid.nl/BWBR0013360
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel2.2.2
