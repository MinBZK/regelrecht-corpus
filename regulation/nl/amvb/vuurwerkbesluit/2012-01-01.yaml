  - number: 5.3.7
    text: |-
      1 De [artikelen 3.3.2][ref1], [3.3.3][ref2] en [3.3.4][ref3] van het Vuurwerkbesluit zoals dat gold tot en met
      3 juli 2010 blijven van toepassing op voor 4 juli 2010 ingediende aanvragen van onderstaande besluiten, totdat deze
      onherroepelijk zijn geworden:

      a. een besluit inzake het verlenen, wijzigen of intrekken van een vergunning voor het tot ontbranding brengen, ten
      behoeve daarvan opbouwen, installeren, bewerken, dan wel na ontbranding verwijderen van professioneel vuurwerk;

      b. een besluit inzake het verlenen, wijzigen of intrekken van een toestemming voor het tot ontbranding brengen, ten
      behoeve daarvan opbouwen, installeren, bewerken, dan wel na ontbranding verwijderen van professioneel vuurwerk.

      2 [Artikel 5.3.6][ref4] is van overeenkomstige toepassing.


