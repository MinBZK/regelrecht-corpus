  - number: 1.1.4
    text: |-
      1 De [artikelen 2.2.1 tot en met 2.2.4][ref1] en de [artikelen 3.2.1][ref2], [3.2.2][ref3] en [3A.2.1][ref4] zijn
      niet van toepassing op de opslag van vuurwerk of pyrotechnische artikelen voor theatergebruik in inrichtingen
      waarvoor een omgevingsvergunning is verleend die betrekking heeft op de opslag van vuurwerk of pyrotechnische
      artikelen voor theatergebruik, voor zover deze plaatsvindt gedurende ten hoogste 48 uur te rekenen vanaf het moment
      van opslaan en in afwachting van aansluitend vervoer naar een vooraf bekende ontvanger, met inbegrip van het laden
      en lossen van de artikelen en de overbrenging daarvan naar een andere tak van vervoer, voor zover daadwerkelijk in
      aansluitend vervoer is voorzien en het betrokken artikel in de oorspronkelijke verpakking blijft.

      2 Voor de berekening van de in het eerste lid bedoelde termijn van 48 uur worden zaterdagen, zondagen en officieel
      erkende feestdagen niet meegerekend.

      3 In afwijking van het eerste lid wordt indien sprake is van opslag van vuurwerk of pyrotechnische artikelen voor
      theatergebruik in containers voor vervoer in een inrichting die is gelegen op een haventerrein van de zeehaven van
      Amsterdam, Eemshaven, Rotterdam of Vlissingen en waarvoor een omgevingsvergunning is verleend die betrekking heeft
      op de opslag van vuurwerk of pyrotechnische artikelen voor theatergebruik en voor zover aan de voorwaarden van het
      eerste lid is voldaan, in plaats van «48 uur» gelezen: twee weken.


