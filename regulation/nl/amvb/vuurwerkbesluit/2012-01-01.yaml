  - number: 5.3.5
    text: |-
      1 De [artikelen 1A.1.3 tot en met 1A.4.1][ref1] en [3A.1.1][ref2] zijn eerst met ingang van 4 juli 2013 van
      toepassing op vuurwerk behorende tot categorie 4 en pyrotechnische artikelen voor theatergebruik.

      2 Tot en met 3 juli 2013 wordt onder professioneel vuurwerk mede verstaan vuurwerk dat niet behoort tot categorie
      1, 2 of 3 en wel behoort tot :

      a. professioneel vuurwerk als bedoeld in [artikel 1.1.1][ref3] van het Vuurwerkbesluit, zoals dit artikel luidde op
      3 juli 2010,

      b. vuurwerk bestemd voor particulier gebruik als bedoeld in [artikel 1.2.2, vijfde lid][ref4], of

      c. vuurwerk waarvan de bestemming niet kan worden vastgesteld.

      3 [Artikel 3.1.1][ref5] van het Vuurwerkbesluit, zoals dat artikel luidde op 3 juli 2010, blijft tot en met 3 juli
      2013 van toepassing op professioneel vuurwerk als bedoeld in het tweede lid.

      4 Tot en met 3 juli 2013 is het in de handel brengen van vuurwerk behorende tot categorie 4 en van pyrotechnische
      artikelen voor theatergebruik behorende tot categorie T1 of T2 slechts toegestaan overeenkomstig de artikelen van
      dit besluit genoemd in het eerste lid, dan wel [artikel 3.1.1][ref6], zoals dat artikel luidde op 3 juli 2010.

      5 Vuurwerk dat voor 4 juli 2010 in Nederland in de handel is gebracht, mag tot en met 3 juli 2013 in Nederland
      worden verhandeld of gebruikt overeenkomstig het Vuurwerkbesluit zoals dat gold op 3 juli 2010.


