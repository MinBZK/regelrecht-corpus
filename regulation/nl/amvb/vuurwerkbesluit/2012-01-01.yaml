    text: |-
      1 Degene die een inrichting drijft als bedoeld in [artikel 1.1.4][ref1], [2.2.1][ref2], [2.2.2][ref3],
      [3.2.1][ref4] of [3A.2.1][ref5] draagt er zorg voor dat burgemeester en wethouders en de burgemeester van de
      gemeente waarin de inrichting is gelegen, en de commandant van de regionale brandweer, bij de toegang tot de
      inrichting direct toegang hebben tot in ieder geval de volgende actuele gegevens:

      a. de classificatie van het vuurwerk of de pyrotechnische artikelen voor theatergebruik volgens het ADR en
      de opgeslagen hoeveelheid verpakt en onverpakt vuurwerk of pyrotechnische artikelen voor theatergebruik in
      kilogrammen;

      b. informatie over de mate waarin de opgeslagen artikelen gevoelig zijn voor blusmiddelen;

      c. de plaats waar de artikelen binnen de inrichting zijn opgeslagen.

      2 Het eerste lid is van overeenkomstige toepassing ten aanzien van degene die in een inrichting professioneel
      vuurwerk of pyrotechnische artikelen voor theatergebruik voorhanden heeft die zijn aangewezen ingevolge
      [artikel 1.1.1, derde lid][ref6].


