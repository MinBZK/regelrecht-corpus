  - number: 3A.2.1
    text: |-
      1 Degene die een inrichting drijft waar pyrotechnische artikelen voor theatergebruik al dan niet tezamen met
      consumentenvuurwerk of professioneel vuurwerk worden opgeslagen of bewerkt, voldoet aan de voorschriften die zijn
      opgenomen in [bijlage 2][ref1] en aan de veiligheidsafstanden die van toepassing zijn ingevolge [bijlage 3][ref2].

      2 In afwijking van het eerste lid voldoet degene die een inrichting drijft waar theatervuurwerk al dan niet tezamen
      met consumentenvuurwerk worden opgeslagen, aan de voorschriften die zijn opgenomen in [bijlage 1][ref3] en aan de
      veiligheidsafstanden die van toepassing zijn ingevolge [bijlage 3][ref4].

      3 Het eerste en tweede lid zijn niet van toepassing indien er sprake is van opslag
      van uitsluitend theatervuurwerk in een hoeveelheid van ten hoogste 25 kilogram en het
      [Besluit algemene regels voor inrichtingen milieubeheer][ref5] van toepassing is op die opslag of aan de
      vergunning, bedoeld in [artikel 8.1, eerste lid, van de Wet milieubeheer][ref6], een voorschrift is verbonden,
      waarvan de inhoud overeenkomt met voorschrift 2.1.3 van de [bijlage, onder B, bij dat besluit][ref7].

      4 Voor de bepaling van de hoeveelheid artikelen, bedoeld in het derde lid, wordt uitgegaan van het gewicht van de
      artikelen als zijnde onverpakt.

      5 Degene die de inrichting drijft draagt er zorg voor dat de voorschriften worden nageleefd.


