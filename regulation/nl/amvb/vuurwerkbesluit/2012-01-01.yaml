  - number: 2.3.2
    text: |-
      1 Het is verboden consumentenvuurwerk ter beschikking te stellen aan een particulier.

      2 Het verbod geldt niet op 29, 30 en 31 december met dien verstande dat als een van deze dagen een zondag is het
      verbod eveneens op die zondag geldt, in welk geval het verbod om vuurwerk ter beschikking te stellen dan niet geldt
      op 28 december.
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel2.3.2
  - number: 2.3.3
    text: |-
      Het is verboden per levering meer dan tien kilogram consumentenvuurwerk aan een particulier ter beschikking te
      stellen.
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel2.3.3
  - number: 2.3.4
    text: |-
      Het is verboden consumentenvuurwerk aan een particulier bedrijfsmatig ter beschikking te stellen op een andere
      plaats dan een verkoopruimte die voldoet aan de in [bijlage 1][ref1] gestelde voorschriften en de door het bevoegd
      gezag overeenkomstig [artikel 2.2.3][ref2] gestelde nadere eisen.


