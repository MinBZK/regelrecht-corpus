  - number: 3B.2
    text: |-
      1 Bij de aanvraag van de vergunning worden door de aanvrager de volgende gegevens verstrekt:

      a. zijn naam, adres, geboortedatum en geboorteplaats en, in voorkomend geval, de naam en het adres van de betrokken
      onderneming;

      b. gegevens waaruit blijkt dat de handelingen waarop de aanvraag betrekking heeft bedrijfsmatig worden verricht;

      c. een afschrift van een geldig certificaat van vakbekwaamheid, bedoeld in
      [artikel 4.9, tweede lid, van het Arbeidsomstandighedenbesluit][ref1], dat is afgegeven aan de persoon door wie
      of onder wiens voortdurend toezicht de handelingen, waarop de aanvraag betrekking heeft, worden verricht en dat
      betrekking heeft op die handelingen;

      d. de handelingen en de soorten vuurwerk of pyrotechnische artikelen voor theatergebruik waarop de aanvraag
      betrekking heeft;

      e. of het tot ontbranding brengen van het vuurwerk of de pyrotechnische artikelen voor theatergebruik binnen of
      buiten een gebouw plaatsvindt.

      2 De aanvrager stelt naar het oordeel van het bevoegd gezag bij de aanvraag op genoegzame wijze
      door verzekering of anderszins financiële zekerheid ter dekking van de aansprakelijkheid, bedoeld in
      [boek 6 van het Burgerlijk Wetboek][ref2] ter zake van de in het eerste lid, onder b, bedoelde handelingen.

      3 De zekerheid bedraagt ten minste € 2 500 000,00 per gebeurtenis en wordt in ieder geval in stand gehouden tot het
      moment waarop de vergunning vervalt. [Artikel 3.2.3, derde lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.9
      [ref2]: https://wetten.overheid.nl/BWBR0005289
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel3.2.3
