      - id: ref1
        bwb_id: BWBR0013360
      - id: ref2
        bwb_id: BWBR0013360
  - number: 2.2.3
    text: |-
      1 Het bevoegd gezag kan nadere eisen stellen met betrekking tot de in [bijlage 1, onder B][ref1], opgenomen
      voorschriften ten aanzien van:

      a. de bereikbaarheid en de toegankelijkheid van ruimten waar consumentenvuurwerk aanwezig mag zijn, als bedoeld in
      voorschrift 1.8;

      b. de wijze waarop verpakt of onverpakt vuurwerk wordt opgeslagen, bedoeld in voorschrift 5.6;

      c. bouwkundige voorzieningen als bedoeld in voorschrift 6.3;

      d. de interne afstanden binnen de inrichting teneinde domino-effecten te voorkomen, bedoeld in voorschrift 6.4.

      2 De nadere eisen gelden voor een ieder die de inrichting drijft. Deze draagt er zorg voor dat de nadere eisen
      worden nageleefd.

      3 Het bevoegd gezag kan nadere eisen wijzigen of aanvullen in het belang van de bescherming van het milieu, of
      wijzigen of intrekken indien het belang van de bescherming van het milieu zich daartegen niet verzet.

      4 Het bevoegd gezag stelt de commandant van de regionale brandweer binnen wiens gebied de inrichting geheel of in
      hoofdzaak is gelegen, in de gelegenheid advies uit te brengen over het ontwerp van de beschikking waarbij de nadere
      eis wordt gesteld.

      5 Van de beschikking wordt mededeling gedaan door kennisgeving in één of meer dag-, nieuws- of huis-aan-huisbladen.

      6 Een afschrift van de beschikking wordt door het bevoegd gezag gezonden aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0013360
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
  - number: 2.2.4
    text: |-
      1 Degene die een inrichting, als bedoeld in [artikel 2.2.1][ref1], opricht, meldt dit ten minste vier weken voor de
      oprichting schriftelijk aan het bevoegd gezag. Het bevoegd gezag zendt onverwijld een afschrift van de melding aan
      de commandant van de regionale brandweer.

      2 Het eerste lid is van overeenkomstige toepassing met betrekking tot het veranderen van een inrichting, als
      bedoeld in [artikel 2.2.1][ref2], en het veranderen van de werking daarvan.

      3 Bij de melding worden vermeld:

      a. het adres van de inrichting;

      b. de naam en het adres van degene die de inrichting opricht dan wel verandert of de werking daarvan verandert, en,
      indien dit iemand anders is, van degene die de inrichting drijft of zal drijven;

      c. de aard en omvang van de activiteiten of processen in de inrichting;

      d. de indeling en de uitvoering van de inrichting;

      e. het tijdstip waarop de inrichting of de verandering daarvan in werking zal worden gebracht, dan wel de
      verandering van de werking daarvan verwezenlijkt zal zijn.

      4 De in het derde lid vermelde gegevens behoeven niet te worden verstrekt indien degene die de inrichting drijft,
      deze gegevens reeds aan het bevoegd gezag heeft verschaft en het bevoegd gezag geacht kan worden over die gegevens
      te beschikken.

      5 Degene die de melding doet, geeft in voorkomend geval bij de melding aan welke van de ingevolge dit artikel te
      verstrekken gegevens hij reeds aan het bevoegd gezag heeft verschaft.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel2.2.1
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel2.2.4
