  - number: 1.1.2a
    text: |-
      1 Als een persoon met gespecialiseerde kennis worden aangewezen:

      a. een persoon die een inrichting drijft als bedoeld in [artikel 3.2.1][ref1] of [3A.2.1][ref2];

      b. een houder van een vergunning als bedoeld in [artikel 3B.1, eerste lid][ref3];

      c. medewerkers van de politie in de uitoefening van hun functie;

      d. medewerkers van de brandweer in de uitoefening van hun functie;

      e. personen die in de uitoefening van hun functie vuurwerk of pyrotechnische artikelen voor theatergebruik tot
      ontbranding brengen bij een instelling die de genoemde producten bedrijfsmatig en uitsluitend ten behoeve van
      onderzoek tot ontbranding brengt;

      f. medewerkers van de krijgsmacht in de uitoefening van hun functie.

      2 Als een persoon met gespecialiseerde kennis wordt tevens aangewezen een persoon die als zodanig met betrekking
      tot vuurwerk en pyrotechnische artikelen voor theatergebruik is aangewezen in een andere lidstaat van de Europese
      Unie.


