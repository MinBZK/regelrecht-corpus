  - number: 1A.1.1
    text: |-
      1 In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

        - *aangemelde instantie:* aangemelde instantie als bedoeld in artikel 10 van de EG-richtlijn pyrotechnische
      artikelen;
        - *bijlage I van de EG-richtlijn pyrotechnische artikelen:* bijlage I bij de EG-richtlijn pyrotechnische artikelen,
      naar de tekst zoals deze bij die richtlijn is vastgesteld;
        - *bijlage II van de EG-richtlijn pyrotechnische artikelen:* bijlage II bij de EG-richtlijn pyrotechnische
      artikelen, naar de tekst zoals deze bij die richtlijn is vastgesteld, voor zover het betreft de in het tweede lid
      genoemde onderdelen van de bijlage, en bijlage II bij de EG-richtlijn pyrotechnische artikelen voor de overige
      onderdelen van de bijlage;
        - *conformiteitsbeoordelingsprocedure:* procedure als bedoeld in bijlage II van de EG-richtlijn pyrotechnische
      artikelen;
        - *fundamentele veiligheidseisen:* fundamentele veiligheidseisen, bedoeld in bijlage I van de EG-richtlijn
      pyrotechnische artikelen;
        - *geharmoniseerde norm:* Europese norm die op basis van een mandaat van de Commissie van de Europese
      Gemeenschappen door een Europees normalisatie-instituut is goedgekeurd overeenkomstig de in richtlijn 98/34/EG van
      het Europees Parlement en de Raad van 22 juni 1998 betreffende een informatieprocedure op het gebied van normen en
      technische voorschriften (*PB L 204)* vastgestelde procedures;
        - *module B, C, D, E, G en H:* module B, C, D, E, G en H als bedoeld in bijlage II van de EG-richtlijn
      pyrotechnische artikelen.

      2 De in het eerste lid, in de begripsomschrijving van bijlage II van de EG-richtlijn pyrotechnische artikelen,
      bedoelde onderdelen van die bijlage zijn:

      a. Module B, de onderdelen 6 tot en met 9;

      b. Module C, de onderdelen 2 tot en met 4;

      c. Module D, de onderdelen 3.4, 4.2 tot en met 4.4, 5 en 6;

      d. Module E, de onderdelen 3.4, 4.2 tot en met 4.4, 5 en 6;

      e. Module H, de onderdelen 3.4, 4.2 tot en met 4.4, 5 en 6.
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel1A.1.1
