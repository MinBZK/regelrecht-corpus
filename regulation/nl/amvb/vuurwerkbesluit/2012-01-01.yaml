  - number: 1A.1.3
    text: |-
      1 De fabrikant brengt vuurwerk of pyrotechnische artikelen voor theatergebruik in een bepaalde categorie onder op
      grond van toepassing, doel en gevaar, met inbegrip van hun geluidniveau.

      2 Een aangemelde instantie bevestigt de categorisering als onderdeel van de conformiteitsbeoordelingsprocedure.

      3 De categorieën luiden als volgt:

      a) *vuurwerk*

      Categorie 1: vuurwerk dat zeer weinig gevaar en een te verwaarlozen geluidsniveau oplevert en bestemd is voor
      gebruik in een besloten ruimte, inclusief vuurwerk dat bestemd is voor gebruik binnenshuis;

      Categorie 2: vuurwerk dat weinig gevaar en een laag geluidsniveau oplevert en bestemd is voor gebruik buitenshuis
      in een afgebakende plaats;

      Categorie 3: vuurwerk dat middelmatig gevaar oplevert en bestemd is voor gebruik buitenshuis in een grote open
      ruimte, en waarvan het geluidsniveau niet schadelijk is voor de menselijke gezondheid;

      Categorie 4: vuurwerk dat veel gevaar oplevert en uitsluitend bestemd is voor gebruik door personen met
      gespecialiseerde kennis, en waarvan het geluidsniveau niet schadelijk is voor de menselijke gezondheid.

      b) *pyrotechnische artikelen voor theatergebruik*

      Categorie T1: pyrotechnische artikelen voor podiumgebruik met gering gevaar;

      Categorie T2: pyrotechnische artikelen voor podiumgebruik die uitsluitend bestemd zijn om door personen met
      gespecialiseerde kennis te worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel1A.1.3
  - number: 1A.1.4
    text: |-
      De fabrikant zorgt ervoor dat vuurwerk of pyrotechnische artikelen voor theatergebruik voldoen aan de fundamentele
      veiligheidseisen.
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel1A.1.4
  - number: 1A.1.5
    text: |-
      1 De importeur van vuurwerk of pyrotechnische artikelen voor theatergebruik zorgt ervoor dat de fabrikant aan zijn
      verplichtingen uit hoofde van dit besluit heeft voldaan of neemt deze verplichtingen op zich.

      2 Het eerste lid is van toepassing wanneer de fabrikant niet is gevestigd in de Europese Gemeenschap.
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel1A.1.5
  - number: 1A.1.6
    text: |-
      Distributeurs nemen de nodige zorgvuldigheid in acht. Met name vergewissen zij zich ervan dat het pyrotechnische
      artikel is voorzien van de vereiste CE-markering en vergezeld gaat van de vereiste documenten.
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel1A.1.6
  - number: 1A.1.7
    text: |-
      1 Bij regeling van Onze Minister worden de geharmoniseerde normen aangewezen die in Nederland worden erkend en
      overgenomen.

      2 Bij de regeling stelt Onze Minister voor elke erkende en overgenomen geharmoniseerde norm een referentienummer
      vast.

      3 Vuurwerk of pyrotechnische artikelen voor theatergebruik die voldoen aan de in Nederland erkende en overgenomen
      geharmoniseerde normen, worden geacht in overeenstemming te zijn met de fundamentele veiligheidseisen.
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel1A.1.7
  - number: 1A.2.1
    text: |-
      1 Het is verboden vuurwerk of pyrotechnische artikelen voor theatergebruik in de handel te brengen, voorhanden te
      hebben of aan een ander ter beschikking te stellen die niet voldoen aan de fundamentele veiligheidseisen.

      2 Het is verboden vuurwerk of pyrotechnische artikelen voor theatergebruik in de handel te brengen
      voorhanden te hebben of aan een ander ter beschikking te stellen indien die niet zijn onderworpen aan de
      conformiteitsbeoordelingsprocedure.

      3 Het is verboden vuurwerk of pyrotechnische artikelen voor theatergebruik in de handel te brengen, voorhanden te
      hebben, aan een ander ter beschikking te stellen of te gebruiken anders dan met inachtneming van de voorschriften
      gesteld bij of krachtens de [artikelen 1A.4.1][ref1], [2.1.3][ref2], [3.1.1][ref3] en [3A.1.1][ref4] met betrekking
      tot de aanduiding en het bezigen van vermeldingen.

      4 Het is verboden te handelen in strijd met de [artikelen 1A.3.3][ref5], [1A.3.5][ref6],
      [1A.3.7, eerste en tweede lid][ref7], [1A.3.8][ref8] en [1A.3.9][ref9].


