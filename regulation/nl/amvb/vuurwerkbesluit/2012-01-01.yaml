  - number: 1.1.7
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot:

      a. de invoering van een traceerbaarheidssysteem als bedoeld in artikel 18, tweede lid onder a, van de EG-richtlijn
      pyrotechnische artikelen;

      b. het aanleggen van gemeenschappelijke criteria voor het regelmatig verzamelen en bijwerken van gegevens over
      ongevallen in verband met pyrotechnische artikelen, als bedoeld in artikel 18, tweede lid onder b, van de EG-
      richtlijn pyrotechnische artikelen.
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel1.1.7
  - number: 1.1.8
    text: |-
      1 Voor de toepassing van dit besluit wordt onder «een lidstaat van de Europese Unie» mede begrepen een andere staat
      die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte.

      2 Voor de toepassing van dit besluit worden begrepen onder «Europese Gemeenschap»: het grondgebied van de lidstaten
      van de Europese Unie alsmede het grondgebied van de andere staten die partij zijn bij de Overeenkomst betreffende
      de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel1.1.8
  - number: 1.2.2
    text: |-
      1 Het is verboden professioneel vuurwerk of pyrotechnische artikelen voor theatergebruik, indien bestemd voor
      particulier gebruik, binnen het grondgebied van Nederland te brengen, op te slaan, te vervaardigen, voorhanden te
      hebben of aan een ander ter beschikking te stellen.

      2 Het is verboden aan een ander dan een persoon met gespecialiseerde kennis professioneel vuurwerk of
      pyrotechnische artikelen voor theatergebruik ter beschikking te stellen.

      3 Het is verboden als een ander dan een persoon met gespecialiseerde kennis professioneel vuurwerk of
      pyrotechnische artikelen voor theatergebruik op te slaan, voorhanden te hebben of tot ontbranding te brengen.

      4 Het is verboden vuurwerk of pyrotechnische artikelen voor theatergebruik binnen het grondgebied van Nederland
      te brengen, op te slaan, te vervaardigen, toe te passen, voorhanden te hebben, aan een ander ter beschikking te
      stellen of tot ontbranding te brengen indien dit niet voldoet aan het bepaalde bij of krachtens dit besluit.

      5 Van bestemd voor particulier gebruik als bedoeld in het eerste lid is in ieder geval sprake indien:

      a. het tot ontbranding wordt gebracht door een particulier,

      b. het te koop wordt aangeboden of ter beschikking wordt gesteld aan, gekocht of besteld door een particulier,

      c. het aangetroffen wordt bij een particulier,

      d. het binnen het grondgebied van Nederland wordt gebracht of voorhanden wordt gehouden met het oogmerk het aan
      particulieren ter beschikking te stellen, of

      e. het is voorzien van de aanduiding: Geschikt voor particulier gebruik.
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel1.2.2
  - number: 1.2.2a
    text: |-
      Het is verboden, behoudens het bepaalde in de [artikelen 1.3.1, derde lid][ref1], [2.1.2, tweede lid][ref2],
      en [2.1.3, zesde lid][ref3], dan wel [3.1.1, zesde lid][ref4], en [3A.1.1, zesde lid][ref5], vuurwerk of
      pyrotechnische artikelen voor theatergebruik op te slaan of te bewerken indien niet wordt voldaan aan de
      voorschriften die zijn gesteld krachtens [artikel 9.2.2.1, derde lid, van de Wet milieubeheer][ref6], dan wel
      krachtens dit besluit.


