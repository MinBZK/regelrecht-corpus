      - id: ref3
        bwb_id: BWBR0013360
        artikel: 1A.3.10
        hoofdstuk: 1a
        paragraaf: '3'
  - number: 1A.3.10
    text: |-
      1 Indien module D, E of H is toegepast, voert de aangemelde instantie periodiek controles uit om ervoor te zorgen
      dat de fabrikant het kwaliteitssysteem handhaaft en toepast en verstrekt de fabrikant een controleverslag.

      2 De aangemelde instantie kan bovendien onaangekondigde bezoeken aan de fabrikant brengen. Tijdens dergelijke
      bezoeken kan de aangemelde instantie, indien noodzakelijk, tests (laten) uitvoeren om na te gaan of het
      kwaliteitssysteem naar behoren functioneert; de aangemelde instantie verstrekt de fabrikant een verslag van het
      bezoek en, indien tests zijn uitgevoerd, een testverslag.

      3 De aangemelde instantie verstrekt de andere aangemelde instanties de relevante informatie betreffende de
      goedkeuringen van het kwaliteitssysteem die zijn afgegeven of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel1A.3.10
  - number: 1A.4.1
    text: |-
      1 Nadat de conformiteitsbeoordelingsprocedure met succes is uitgevoerd, worden de pyrotechnische artikelen
      zichtbaar, leesbaar en onuitwisbaar voorzien van de CE-markering.

      2 Het eerste lid geldt niet voor vuurwerk en pyrotechnische artikelen voor theatergebruik van geringe afmeting,
      mits

      a. aan deze artikelen een identificatieplaatje is bevestigd waarop de in het eerste lid bedoelde gegevens zijn
      aangebracht, of

      b. deze artikelen zich in een primaire verpakking bevinden waarop de in het eerste lid bedoelde gegevens zijn
      aangebracht.

      3 Het identificatieplaatje, bedoeld in het tweede lid, onder a, moet zodanig zijn ontworpen dat hergebruik
      onmogelijk is.

      4 Het is verboden andere markeringen op pyrotechnische artikelen aan te brengen indien:

      a. zij tot onduidelijkheid kunnen leiden ten aanzien van de betekenis en de vorm van de CE-markering, en

      b. de zichtbaarheid en de leesbaarheid van de CE-markering daardoor in het gedrang komen.

      5 Indien de pyrotechnische artikelen onderworpen zijn aan andere wetgeving van de Europese Gemeenschap die
      betrekking heeft op andere aspecten van de CE-markering en een CE-markering voorschrijft, geeft deze markering aan
      dat deze artikelen ook geacht worden aan de bepalingen van de andere toepasselijke wetgeving te voldoen.
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel1A.4.1
  - number: 1A.5.1
    text: |-
      1 Onze Minister kan een instantie aanwijzen die bevoegd is tot het uitvoeren van de
      conformiteitsbeoordelingsprocedures. Onze Minister meldt de aangewezen instantie aan overeenkomstig artikel 10 van
      de EG-richtlijn pyrotechnische artikelen.

      2 De aan te wijzen instantie moet ten minste voldoen aan de minimumcriteria, opgenomen in bijlage III van de EG-
      richtlijn pyrotechnische artikelen. Aan de aanwijzing kunnen voorschriften worden verbonden ter uitvoering van de
      minimumcriteria als bedoeld in bijlage III van de EG-richtlijn pyrotechnische artikelen.

      3 Indien de aan te wijzen instantie voldoet aan de beoordelingscriteria die in de geharmoniseerde normen voor
      aangewezen instanties zijn vastgesteld, wordt zij geacht aan de desbetreffende minimumcriteria te voldoen.
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel1A.5.1
  - number: 1A.5.2
    text: |-
      1 In het kader van de beoordeling van de conformiteit is de aangewezen instantie in elk geval bevoegd tot het nemen
      van de volgende besluiten:

      a. het beslissen omtrent de afgifte van een verklaring van EG-typeonderzoek in het kader van de toepassing van
      module B, als bedoeld in bijlage II van de EG-richtlijn pyrotechnische artikelen, onderdeel 1, onder 5;

      b. het beslissen omtrent de afgifte van een aanvullende goedkeuring in het kader van de toepassing van module B,
      als bedoeld in bijlage II van de EG-richtlijn pyrotechnische artikelen, onderdeel 1, onder 6;

      c. het beslissen omtrent het beoordelen of opnieuw beoordelen van het kwaliteitssysteem in het kader van de
      toepassing van module D, als bedoeld in bijlage II van de EG-richtlijn pyrotechnische artikelen, onderdeel 3, onder
      3.3 en 3.4.

      2 Een goedkeurende beoordeling kan door de aangewezen instantie worden ingetrokken indien de fabrikant niet langer
      voldoet aan de vereisten voor een goedkeurende beoordeling.
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel1A.5.2
  - number: 1A.5.3
    text: |-
      Onze Minister ziet toe op de rechtmatige en doeltreffende uitvoering van het bepaalde bij of krachtens dit besluit
      door de aangewezen instantie.
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel1A.5.3
  - number: 1A.5.4
    text: |-
      De aangewezen instantie verstrekt desgevraagd aan Onze Minister de voor de uitoefening van zijn taak benodigde
      inlichtingen. Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de
      vervulling van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel1A.5.4
  - number: 1A.5.5
    text: |-
      De aangewezen instantie beschikt over een behoorlijke administratie waarin de gegevens die samenhangen met en
      betrekking hebben op de uitvoering van haar taken, op een systematische wijze zijn vastgelegd. Aan de hand van deze
      gegevens zijn de beoordeelde pyrotechnische artikelen afdoende te identificeren.
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel1A.5.5
  - number: 1A.5.6
    text: |-
      1 Indien een wijziging optreedt in de gegevens op grond waarvan de instantie is aangewezen, doet de instantie
      hiervan terstond mededeling aan Onze Minister.

      2 Indien de aangewezen instantie voornemens is een of meer van de taken waarvoor zij is aangewezen, te beëindigen,
      doet de instantie hiervan terstond mededeling aan Onze Minister. In dat geval worden door de instantie de gegevens,
      bedoeld in [artikel 1A.5.5][ref1] overgedragen aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A.5.5
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel1A.5.6
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 1A.5.5
        hoofdstuk: 1a
        paragraaf: '5'
  - number: 1A.5.7
    text: |-
      1 Onze Minister kan de aanwijzing wijzigen of intrekken.

      2 Onze Minister trekt de aanwijzing in elk geval in indien is gebleken dat de instantie niet of niet langer voldoet
      aan de minimumcriteria, opgenomen in bijlage III van de EG-richtlijn pyrotechnische artikelen.

      3 Onze Minister stelt de andere lidstaten van de Europese Unie en de Commissie van de Europese Gemeenschappen
      onverwijld op de hoogte van het intrekken van de aanwijzing.
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel1A.5.7
  - number: 1A.5.8
    text: |-
      1 Indien de aanwijzing van de instantie wordt ingetrokken, behouden de door deze instantie afgegeven certificaten
      van overeenstemming en bijbehorende documenten hun geldigheid.

      2 Indien er een dreigend of rechtstreeks gevaar is voor de gezondheid of de veiligheid, kan Onze Minister, in
      afwijking van het eerste lid, verklaren dat een of meer certificaten van overeenstemming en bijbehorende documenten
      hun geldigheid hebben verloren.
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel1A.5.8
  - number: 2.1.1
    text: |-
      Bij regeling van Onze Minister wordt vuurwerk aangewezen als consumentenvuurwerk. De aanwijzing geschiedt aan de
      hand van de aard, samenstelling, constructie en eigenschappen van het vuurwerk.
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel2.1.1
  - number: 2.1.2
    text: |-
      1 Verpakt consumentenvuurwerk is bij het opslaan en het voorhanden hebben anders dan door particulieren, op
      zodanige wijze verpakt dat het volgens bijlage A van het ADR, uitsluitend kan worden aangemerkt als vuurwerk
      behorende tot klasse 1.4G of 1.4S.

      2 Dit artikel is niet van toepassing op vuurwerk waarvan op het moment dat het binnen het grondgebied van
      Nederland wordt gebracht, naar het oordeel van Onze Minister genoegzaam wordt aangetoond dat het binnen 48
      uur weer buiten het grondgebied van Nederland zal worden gebracht. Indien sprake is van opslag als bedoeld in
      [artikel 1.1.4, derde lid][ref1], wordt in plaats van «48 uur» gelezen: twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1.1.4
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel2.1.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 1.1.4
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 2.1.3
    text: |-
      1 Consumentenvuurwerk is voorzien van:

      a. de aanduiding: Geschikt voor particulier gebruik;

      b. een vermelding of afbeelding van de soort van het vuurwerk waaruit duidelijk blijkt wat de te verwachten
      effecten tijdens het functioneren zijn;

      c. de naam, de handelsnaam of het handelsmerk en de naam en de plaats van vestiging van de fabrikant;

      d. indien de fabrikant niet is gevestigd in de Europese Gemeenschap: de naam, de handelsnaam of het handelsmerk en
      de naam en de plaats van vestiging van de importeur;

      e. indien de importeur niet in Nederland is gevestigd: de naam, de handelsnaam of het handelsmerk en de naam en de
      plaats van vestiging van de distributeur;

      f. de naam en het type van het artikel, het door de fabrikant bij de vervaardiging toegekende artikelnummer dat
      dient ter identificatie van het vuurwerk en het productiejaar van het vuurwerk;

      g. de minimumleeftijd voor het verkopen of anderszins ter beschikking stellen van het consumentenvuurwerk, bedoeld
      in [artikel 2.3.5][ref1];

      h. de categorie, bedoeld in [artikel 1A.1.3][ref2], waartoe het consumentenvuurwerk behoort;

      i. de NEM;

      j. een gebruiksaanwijzing met zodanige aanwijzingen en waarschuwingen dat bij het dienovereenkomstig handelen geen
      letsel of schade bij de gebruiker en omstanders kan ontstaan.

      2 Consumentenvuurwerk is voorts voorzien van de volgende informatie:

      voor zover het betreft categorie 1: in voorkomend geval: «uitsluitend buitenshuis te gebruiken» en de minimale
      veiligheidsafstand;

      voor zover het betreft categorie 2: «uitsluitend buitenshuis te gebruiken» en, in voorkomend geval, de minimale
      veiligheidsafstand(en);

      voor zover het betreft categorie 3: «uitsluitend buitenshuis te gebruiken» en de minimale veiligheidsafstand(en).

      3 Het eerste en tweede lid gelden niet voor consumentenvuurwerk van geringe afmeting, mits dat vuurwerk zich in een
      primaire verpakking bevindt waarop de in het eerste en tweede lid bedoelde gegevens zijn aangebracht.

      4 De aanduiding en de gegevens, bedoeld in het eerste en tweede lid, zijn in de Nederlandse taal gesteld,
      zichtbaar, leesbaar en onuitwisbaar.

      5 In afwijking van het vierde lid worden de aanduiding en de gegevens, bedoeld in het eerste en tweede lid, op
      consumentenvuurwerk dat zal worden verkocht in een andere lidstaat van de Europese Unie gesteld in de officiële
      taal of talen van het desbetreffende land.

      6 Dit artikel is niet van toepassing op vuurwerk waarvan op het moment dat het binnen het grondgebied van
      Nederland wordt gebracht, naar het oordeel van Onze Minister genoegzaam wordt aangetoond dat het binnen 48
      uur weer buiten het grondgebied van Nederland zal worden gebracht. Indien sprake is van opslag als bedoeld in
      [artikel 1.1.4, derde lid][ref3], wordt in plaats van «48 uur» gelezen: twee weken.

      7 Consumentenvuurwerk is voorts voorzien van de informatie waartoe met betrekking tot vuurwerk is besloten met
      toepassing van artikel 18, eerste lid, onder c, van de EG-richtlijn pyrotechnische artikelen. Indien de informatie,
      bedoeld in de eerste volzin, zou afwijken van het bepaalde in het eerste of tweede lid, blijft het in die leden
      bepaalde in zoverre buiten toepassing. Het derde tot en met zesde lid zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2.3.5
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel1A.1.3
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel1.1.4
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel2.1.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 2.3.5
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: 1A.1.3
        hoofdstuk: 1a
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0013360
        artikel: 1.1.4
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 2.1.4
    text: |-
      Het is verboden vuurwerk dat niet voldoet aan de ter uitwerking van dit besluit krachtens
      [artikel 9.2.2.1 van de Wet milieubeheer][ref1] gestelde regels met betrekking tot consumentenvuurwerk, te voorzien
      van de aanduiding: Geschikt voor particulier gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9.2.2.1
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel2.1.4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: 9.2.2.1
  - number: 2.2.1
    text: |-
      1 Degene die een inrichting drijft, waar ten hoogste 1 000 kilogram consumentenvuurwerk wordt opgeslagen of
      herverpakt, voldoet aan de voorschriften die zijn opgenomen in [bijlage 1, onder A, B en C][ref1], en aan de
      veiligheidsafstanden die van toepassing zijn ingevolge [bijlage 3][ref2]. Degene die de inrichting drijft draagt er
      zorg voor dat de voorschriften worden nageleefd.

      2 Indien een inrichting tot een krachtens [artikel 1.1, derde lid, van de Wet milieubeheer][ref3] aangewezen
      categorie behoort, niet uitsluitend omdat daarin vuurwerk wordt opgeslagen, geldt een voor de inrichting krachtens
      [artikel 8.1 van de Wet milieubeheer][ref4] verleende vergunning ook voor het oprichten, in werking hebben of
      veranderen van de inrichting, dan wel het veranderen van de werking daarvan, voor zover dit oprichten, in werking
      hebben of veranderen dan wel veranderen van de werking betrekking heeft op het opslaan van vuurwerk.


      [ref1]: https://wetten.overheid.nl/BWBR0013360
      [ref2]: https://wetten.overheid.nl/BWBR0013360
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel1.1
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel8.1
