articles:
  - number: 1.1.1
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;
        - ADR: de op 30 september 1957 te Genève tot stand gekomen Europese Overeenkomst betreffende het internationale
      vervoer van gevaarlijke goederen over de weg (Trb. 1959, 171);
        - bijlage: bij dit besluit behorende bijlage;
        - bedrijfsmatig: in de uitoefening van een beroep of bedrijf of tegen vergoeding;
        - bestemmingsgrens: grens van het perceel waarop de bouw, vestiging of plaatsing van een kwetsbaar object op
      grond van het voor het betrokken gebied geldende bestemmingsplan dan wel de daarvoor geldende beheersverordening
      geëffectueerd of toelaatbaar is;
        - bevoegd gezag: bestuursorgaan dat bevoegd is of zou zijn een omgevingsvergunning voor een inrichting te verlenen,
      waar consumentenvuurwerk, professioneel vuurwerk of pyrotechnische artikelen voor theatergebruik worden opgeslagen
      of bewerkt;
        - bouwstrook: gedeelte van het perceel dat op grond van het voor het betrokken gebied geldende bestemmingsplan dan
      wel de daarvoor geldende beheersverordening voor de bouw van een kwetsbaar object is bestemd;
        - categorie 1, 2, 3 en 4: categorie 1, 2, 3 onderscheidenlijk 4 als bedoeld in [artikel 1A.1.3][ref1];
        - categorie T1 en T2: categorie T1 onderscheidenlijk T2 als bedoeld in [artikel 1A.1.3][ref2];
        - CE-markering: CE-markering, bedoeld in artikel 11 en bijlage IV van de EG-richtlijn pyrotechnische artikelen;
        - consumentenvuurwerk: vuurwerk dat is ingedeeld in categorie 1, 2 of 3 en dat bij of krachtens dit besluit is
      aangewezen als vuurwerk dat ter beschikking mag worden gesteld voor particulier gebruik;
        - distributeur: natuurlijke of rechtspersoon in de leveringsketen die in de uitoefening van zijn bedrijf een
      pyrotechnisch artikel op de markt beschikbaar maakt;
        - EG-richtlijn pyrotechnische artikelen: richtlijn nr. 2007/23/EG van het Europees Parlement en de Raad van 23 mei
      2007 betreffende het in de handel brengen van pyrotechnische artikelen (PbEU L 154);
        - fabrikant: natuurlijke of rechtspersoon die een pyrotechnisch artikel ontwerpt, fabriceert of laat ontwerpen of
      fabriceren, met de bedoeling het in de handel brengen, onder zijn eigen naam of handelsmerk;
        - fop- en schertsvuurwerk: consumentenvuurwerk dat is ingedeeld in categorie 1 alsmede ander, als zodanig bij
      ministeriële regeling aangewezen consumentenvuurwerk;
        - geprojecteerd kwetsbaar object: nog niet aanwezig kwetsbaar object dat op grond van het voor het betrokken gebied
      geldende bestemmingsplan dan wel de daarvoor geldende beheersverordening toelaatbaar is;
        - importeur: in de Europese Gemeenschap gevestigde natuurlijke of rechtspersoon die in de uitoefening van zijn
      bedrijf een uit een derde land afkomstig pyrotechnisch artikel voor het eerst op de gemeenschapsmarkt beschikbaar
      maakt;
        - in de handel brengen: voor de eerste keer in de handel van de Europese Gemeenschap beschikbaar stellen, al dan
      niet tegen betaling, van een afzonderlijk product, met het oog op distributie of gebruik ervan;
        - inspecteur: als zodanig bij besluit van Onze Minister aangewezen ambtenaar;
        - kwetsbare objecten: a. woningen: gebouwen of afzonderlijke gedeelten van een gebouw die voor bewoning
      bestemd zijn, met uitzondering van dienst- en bedrijfswoningen die binnen inrichtingen als bedoeld in de
      [artikelen 2.2.1][ref3], [2.2.2][ref4], [3.2.1][ref5] of [3A.2.1][ref6] zijn gelegen; b. loodsen, keten of andere
      soortgelijke bouwwerken, bestemd om te voorzien in een tijdelijke behoefte aan woongelegenheid, dan wel woonwagens
      als bedoeld in artikel 1, eerste lid, van [bijlage II bij het Besluit omgevingsrecht][ref7]; c. woonschepen
      die uitsluitend of in hoofdzaak voor bewoning bestemd zijn; d. gebouwen waar dagopvang van minderjarigen
      plaatsvindt; e. gebouwen die gebruikt worden door een onderwijsinstelling; f. ziekenhuizen, verpleeginrichtingen en
      zorginstellingen; g. gebouwen of terreinen die in verband met het verrichten van arbeid worden of plegen te worden
      gebruikt of die daartoe bestemd zijn; h. winkels, hotels, restaurants en cafés; i. gebouwen ten behoeve van het
      belijden van godsdienst of levensovertuiging; j. gebouwen die worden of plegen te worden gebruikt voor sportieve
      of recreatieve doeleinden; k. een voor verblijfsrecreatie bestemd terrein dat als zodanig wordt geëxploiteerd;
      l. andere objecten en terreinen die met die onder a tot en met j gelijkgesteld kunnen worden uit hoofde van de
      aard van hun functie of de gemiddelde tijd per dag gedurende welke personen daar verblijven; m. rijkswegen en
      spoorwegen;
        - NEM: netto explosieve massa, zijnde de totale hoeveelheid pyrotechnische stof of preparaat, met eventuele
      toevoegingen, in professioneel vuurwerk of pyrotechnische artikelen voor theatergebruik;
        - persoon met gespecialiseerde kennis: persoon, aangewezen bij [artikel 1.1.2a][ref8];
        - primaire verpakking: verpakking waarin zich meer dan één exemplaar bevindt van eenzelfde type vuurwerk, bedoeld
      om in zijn geheel aan de particulier ter beschikking te worden gesteld;
        - professioneel vuurwerk: vuurwerk dat is ingedeeld in categorie 4 alsmede vuurwerk dat is ingedeeld in categorie
      2 of 3 en dat niet bij of krachtens dit besluit is aangewezen als vuurwerk dat ter beschikking mag worden gesteld
      voor particulier gebruik;
        - pyrotechnisch artikel: artikel dat explosieve stoffen of een explosief mengsel van stoffen bevat die tot doel
      hebben warmte, licht, geluid, gas of rook dan wel een combinatie van dergelijke verschijnselen te produceren door
      middel van zichzelf onderhoudende exotherme chemische reacties;
        - pyrotechnische artikelen voor theatergebruik: pyrotechnische artikelen die bestemd zijn voor binnenshuis of
      buitenshuis plaatsvindend podiumgebruik, met inbegrip van film- en TV-producties of soortgelijke vormen van
      gebruik;
        - theatervuurwerk: met het oog op de opslag ervan door Onze Minister aangewezen pyrotechnische artikelen voor
      theatergebruik, ingedeeld in categorie T1 of categorie T2;
        - veiligheidsafstand: afstand die met het oog op de kwaliteit van het milieu voor zover het
      betreft externe veiligheid tenminste moet zijn gelegen tussen een inrichting als bedoeld in de
      [artikelen 2.2.1][ref9], [2.2.2][ref10] en [3.2.1][ref11], of een onderdeel van een zodanige
      inrichting, dan wel een zodanige inrichting waarvoor het geldende bestemmingsplan dan wel de daarvoor
      geldende beheersverordening verlening van een vergunning voor het bouwen daarvan als bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder a, van de Wet algemene bepalingen omgevingsrecht][ref12] toelaat
      enerzijds en kwetsbare objecten en geprojecteerde kwetsbare objecten anderzijds;
        - vuurwerk: pyrotechnische artikelen ter vermaak;
        - werkdag: dag, niet zijnde een zondag of algemeen erkende feestdag.

      2 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. bewerken van professioneel vuurwerk: bewerken, verwerken, verpakken, herverpakken, voormonteren, monteren en
      assembleren;

      b. bewerken van consumentenvuurwerk: handelingen gericht op het positief beïnvloeden van de stabiliteit, waardoor
      de kans op omvallen of afbreken tijdens het afsteken wordt verkleind, waarbij geen pyrotechnische stof wordt
      verwijderd of toegevoegd.

      3 Onder professioneel vuurwerk wordt mede verstaan: een door Onze Minister aangewezen stof of een preparaat, een
      voorwerp of een onderdeel van een voorwerp dan wel een stof of een preparaat, een voorwerp of een onderdeel van een
      voorwerp dat behoort tot een door Onze Minister bij ministeriële regeling aangewezen categorie, voor zover die stof
      of dat preparaat, dat voorwerp of dat onderdeel van een voorwerp kennelijk is bestemd of wordt gebruikt om voor
      vermakelijkheidsdoeleinden effecten te bewerkstelligen.

      4 Voor de toepassing van de [artikelen 1.2.2, eerste tot en met derde lid][ref13],
      [2.1.2, eerste lid][ref14][2.3.2][ref15], [2.3.3][ref16], [2.3.4][ref17] wordt onder het begrip particulier mede
      verstaan een exploitant van een bedrijf zonder rechtspersoonlijkheid of een rechtspersoon die:

      a. geen inrichting drijft als bedoeld in de [artikelen 1.1.4][ref18], [2.2.1][ref19], [2.2.2][ref20]
      of [3.2.1][ref21];

      b. geen houder is van een vergunning als bedoeld in [artikel 3B.1, eerste lid][ref22];

      c. in het buitenland is gevestigd en wiens bedrijfsmatige activiteit niet bestaat uit het verhandelen van of het
      tot ontbranding brengen van vuurwerk.

      5 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. verpakt vuurwerk: vuurwerk inclusief het omhulsel en eventuele verpakking, detailhandelsverpakking of
      assortimentverpakking en inclusief de transportverpakking als bedoeld in het ADR;

      b. onverpakt vuurwerk: vuurwerk inclusief het omhulsel en eventuele verpakking, detailhandelsverpakking of
      assortimentverpakking doch exclusief de transportverpakking als bedoeld in het ADR;

      c. hoeveelheid consumentenvuurwerk in de bewaarplaats: massa verpakt consumenten-vuurwerk, uitgedrukt in
      kilogrammen;

      d. hoeveelheid consumentenvuurwerk in de bufferbewaarplaats of verkoopruimte: massa verpakt en onverpakt vuurwerk,
      uitgedrukt in kilogrammen onverpakt vuurwerk;

      e. hoeveelheid consumentenvuurwerk in de inrichting: sommatie van de aanwezige hoeveelheid consumentenvuurwerk in
      de bewaarplaats, de bufferbewaarplaats en de verkoopruimte, uitgedrukt in kilogrammen.

      6 Door de fabrikant voor eigen gebruik vervaardigd vuurwerk waarvan het gebruik op zijn grondgebied door een
      lidstaat van de Europese Unie is goedgekeurd, wordt niet geacht in de handel te zijn gebracht.


