  - number: 3.2.1
    text: |-
      1 Degene die een inrichting drijft, waar professioneel vuurwerk al dan niet tezamen met consumentenvuurwerk of
      pyrotechnische artikelen voor theatergebruik wordt opgeslagen of bewerkt, voldoet aan de voorschriften die zijn
      opgenomen in [bijlage 2][ref1] en aan de veiligheidsafstanden die van toepassing zijn ingevolge [bijlage 3][ref2].

      2 Degene die de inrichting drijft draagt er zorg voor dat de voorschriften worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0013360
