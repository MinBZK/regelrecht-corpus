  - number: 3.2.2
    text: |-
      1 Het bevoegd gezag kan nadere eisen stellen met betrekking tot de in [bijlage 2, onder B][ref1], opgenomen
      voorschriften ten aanzien van:

      a. de wijze waarop verpakt of onverpakt vuurwerk wordt opgeslagen, bedoeld in voorschrift 1.9;

      b. de interne afstanden binnen de inrichting teneinde domino-effecten te voorkomen, bedoeld in voorschrift 1.13;

      c. de compartimentering van de opslag van stoffen en voorwerpen uit verschillende compatibiliteitsgroepen, bedoeld
      in voorschrift 3.15 in één ruimte;

      d. de wijze waarop bij een eventuele brand alarm moet worden geslagen, bedoeld in voorschrift 5.2.

      2 De nadere eisen gelden voor een ieder die de inrichting drijft. Deze draagt er zorg voor dat de nadere eisen
      worden nageleefd.

      3 Het bevoegd gezag kan nadere eisen wijzigen of aanvullen in het belang van de bescherming van het milieu, of
      wijzigen of intrekken indien het belang van de bescherming van het milieu zich daartegen niet verzet.

      4 Het bevoegd gezag stelt de commandant van de regionale brandweer binnen wiens gebied de inrichting geheel of in
      hoofdzaak is gelegen, in de gelegenheid advies uit te brengen over het ontwerp van de beschikking waarbij de nadere
      eis wordt gesteld.

      5 Van de beschikking wordt mededeling gedaan door kennisgeving in één of meer dag-, nieuws- of huis-aan-huisbladen.

      6 Een afschrift van de in het eerste lid bedoelde beschikking wordt door het bevoegd gezag gezonden aan Onze
      Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0013360
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel3.2.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
  - number: 3.2.3
    text: |-
      1 Degene die een inrichting drijft als bedoeld in [artikel 3.2.1, eerste lid][ref1]:

      a. stelt naar het oordeel van het bevoegd gezag op genoegzame wijze door verzekering of anderszins financiële
      zekerheid ter dekking van de aansprakelijkheid, bedoeld in [boek 6 van het Burgerlijk Wetboek][ref2], waartoe het
      drijven van de inrichting aanleiding kan geven;

      b. overlegt aan het bevoegd gezag binnen een daartoe door het bevoegd gezag gestelde termijn schriftelijk bewijs
      van de gestelde financiële zekerheid.

      2 De zekerheid bedraagt tenminste  € 5 000 000,00 per gebeurtenis en per inrichting en wordt in stand gehouden tot
      het moment waarop de omgevingsvergunning vervalt.

      3 De verzekering is gesloten bij een financiële onderneming die ingevolge de [Wet op het financieel toezicht][ref3]
      in Nederland het bedrijf van verzekeraar mag uitoefenen.

      4 Het eerste lid is niet van toepassing ter zake van opslag van vuurwerk door of onder verantwoordelijkheid van
      bestuursorganen die door Onze Minister zijn aangewezen. De benadeelde heeft jegens een bestuursorgaan dat geen
      financiële zekerheid als bedoeld in het eerste lid heeft gesteld de rechten welke hij overeenkomstig dit artikel
      anders tegenover de verzekeraar zou hebben, indien de financiële zekerheid door verzekering zou zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0005289
      [ref3]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel3.2.3
