  - number: 3.2.4
    text: Het bevoegd gezag zendt een afschrift van een verleende omgevingsvergunning aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel3.2.4
  - number: 3.3.1
    text: |-
      1 Het is verboden professioneel vuurwerk aan een ander ter beschikking te stellen.

      2 Het verbod geldt niet voor het ter beschikking stellen van professioneel vuurwerk aan een persoon met
      gespecialiseerde kennis.
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel3.3.1
  - number: 3A.1.1
    text: |-
      1 Pyrotechnische artikelen voor theatergebruik zijn voorzien van:

      a. de aanduiding: Niet geschikt voor particulier gebruik;

      b. een vermelding of afbeelding van de soort van het artikel waaruit duidelijk blijkt wat de te verwachten effecten
      tijdens het functioneren zijn;

      c. de naam, de handelsnaam of het handelsmerk en de naam en de plaats van vestiging van de fabrikant;

      d. indien de fabrikant niet is gevestigd in de Europese Gemeenschap: de naam, de handelsnaam of het handelsmerk en
      de naam en de plaats van vestiging van de importeur;

      e. indien de importeur niet in Nederland is gevestigd: de naam, de handelsnaam of het handelsmerk en de naam en de
      plaats van vestiging van de distributeur;

      f. De naam en het type van het artikel, het door de fabrikant bij de vervaardiging toegekende artikelnummer dat
      dient ter identificatie van het artikel en het productiejaar van het artikel;

      g. de categorie, bedoeld in [artikel 1A.1.3][ref1], waartoe het artikel behoort;

      h. de NEM;

      i. een gebruiksaanwijzing met zodanige aanwijzingen en waarschuwingen dat bij het dienovereenkomstig handelen geen
      letsel of schade bij de gebruiker en omstanders kan ontstaan.

      2 Op pyrotechnische artikelen voor theatergebruik moet voorts de volgende informatie staan: voor zover het betreft
      categorie T1: in voorkomend geval: «uitsluitend buitenshuis te gebruiken» en een minimale veiligheidsafstand;
      voor zover het betreft categorie T2: «uitsluitend door personen met gespecialiseerde kennis te gebruiken» en een
      minimale veiligheidsafstand(en).

      3 Het eerste en tweede lid gelden niet voor pyrotechnische artikelen voor theatergebruik van geringe afmeting,
      mits die artikelen zich in een verpakking bevinden waarop de in het eerste en tweede lid bedoelde gegevens zijn
      aangebracht.

      4 De aanduiding en de gegevens, bedoeld in het eerste en tweede lid, zijn in de Nederlandse taal gesteld,
      zichtbaar, leesbaar en onuitwisbaar.

      5 In afwijking van het vierde lid worden de aanduiding en de gegevens, bedoeld in het eerste en tweede lid, op
      pyrotechnische artikelen voor theatergebruik die zullen worden verkocht in een andere lidstaat van de Europese Unie
      gesteld in de officiële taal of talen van het desbetreffende land.

      6 Dit artikel is niet van toepassing op pyrotechnische artikelen voor theatergebruik waarvan op het moment dat het
      binnen het grondgebied van Nederland wordt gebracht, naar het oordeel van Onze Minister genoegzaam wordt aangetoond
      dat zij binnen 48 uur weer buiten het grondgebied van Nederland zullen worden gebracht. Indien sprake is van opslag
      als bedoeld in [artikel 1.1.4, derde lid][ref2], wordt in plaats van «48 uur» gelezen: twee weken.

      7 Pyrotechnische artikelen voor theatergebruikmoeten voorts zijn voorzien van de informatie waartoe met
      betrekking tot deze artikelen is besloten met toepassing van artikel 18, eerste lid, onder c, van de EG-richtlijn
      pyrotechnische artikelen. Indien de informatie, bedoeld in de eerste volzin, zou afwijken van het bepaalde in het
      eerste of tweede lid, blijft het in die leden bepaalde in zoverre buiten toepassing. Het derde tot en met zesde lid
      zijn van overeenkomstige toepassing.


