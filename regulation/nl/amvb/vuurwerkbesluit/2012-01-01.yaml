  - number: 1A.2.3
    text: |-
      1 [Artikel 1A.2.1][ref1] is niet van toepassing op vuurwerk en pyrotechnische artikelen voor theatergebruik die
      voor onderzoeks-, ontwikkelings- en testdoeleinden zijn geproduceerd en niet met de bepalingen van de EG-richtlijn
      pyrotechnische artikelen in overeenstemming zijn. Deze artikelen mogen vrij circuleren en worden gebruikt, mits is
      voldaan aan het bepaalde in het derde lid.

      2 Pyrotechnische artikelen als bedoeld in het eerste lid mogen niet beschikbaar worden gesteld of worden gebruikt
      voor andere doeleinden dan voor ontwikkeling, tests en onderzoek.

      3 Op pyrotechnische artikelen als bedoeld in het eerste lid wordt een zichtbaar teken aangebracht waaruit duidelijk
      blijkt dat ze niet in overeenstemming zijn met de bepalingen van de EG-richtlijn pyrotechnische artikelen en niet
      beschikbaar zijn voor andere doeleinden dan voor ontwikkeling, tests en onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A.2.1
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel1A.2.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 1A.2.1
        hoofdstuk: 1a
        paragraaf: '2'
  - number: 1A.3.1
    text: |-
      Vuurwerk en pyrotechnische artikelen voor theatergebruik worden onderworpen aan een
      conformiteitsbeoordelingsprocedure overeenkomstig deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel1A.3.1
  - number: 1A.3.2
    text: |-
      De fabrikant kiest een van de navolgende conformiteitsbeoordelingsprocedures, volgens welke de door hem gekozen
      aangemelde instantie de conformiteitsbeoordelingsprocedure uitvoert:

      a) het EG-typeonderzoek (module B), en naar keuze van de fabrikant hetzij:

      1°. de overeenstemming met het type (module C),

      2°. de productiekwaliteitsborging (module D), of,

      3°. de productkwaliteitsborging (module E);

      b) de eenheidskeuring (module G), of,

      c) de algehele productkwaliteitsborging (module H), voor zover het gaat om vuurwerk van categorie 4.
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel1A.3.2
  - number: 1A.3.3
    text: |-
      1 Indien module B is toegepast, brengt de fabrikant de aangemelde instantie die de technische documentatie
      betreffende de verklaring van EG-typeonderzoek in haar bezit heeft, op de hoogte van alle wijzigingen van
      het goedgekeurde artikel die aanvullend moeten worden goedgekeurd als die wijzigingen invloed hebben op de
      overeenstemming met de fundamentele voorschriften of de voorgeschreven gebruiksvoorwaarden van het artikel. Deze
      aanvullende goedkeuring wordt gegeven in de vorm van een bijvoegsel bij de oorspronkelijke verklaring van EG-
      typeonderzoek.

      2 Samen met de technische documentatie houdt de fabrikant kopieën van de verklaringen van EG-typeonderzoek
      en de bijvoegsels bij gedurende ten minste tien jaar vanaf de laatste fabricagedatum van het desbetreffende
      artikel. Indien de fabrikant niet in de Europese Gemeenschap is gevestigd, rust de verplichting om de technische
      documentatie ter beschikking te houden bij de importeur of een andere persoon die het product in de handel brengt.
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel1A.3.3
  - number: 1A.3.4
    text: |-
      1 Indien module B is toegepast, brengt de aangemelde instantie de andere aangemelde instanties op de hoogte van
      de relevante informatie betreffende de verklaringen van EG-typeonderzoek en de bijvoegsels die zijn afgegeven of
      ingetrokken.

      2 De andere aangemelde instanties kunnen een kopie van de verklaringen van EG-typeonderzoek of de bijvoegsels
      krijgen. De bijlagen bij de verklaringen worden ter beschikking van de andere aangemelde instanties gehouden.
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel1A.3.4
  - number: 1A.3.5
    text: |-
      1 Indien module C is toegepast, neemt de fabrikant de nodige maatregelen om ervoor te zorgen dat het
      fabricageproces garandeert dat het gefabriceerde artikel overeenstemt met het type dat is beschreven in de
      verklaring van EG-typeonderzoek en met de fundamentele veiligheidseisen van de richtlijn.

      2 De fabrikant houdt een kopie van de verklaring van overeenstemming bij gedurende ten minste tien jaar vanaf
      de laatste fabricagedatum van het desbetreffende artikel. Indien de fabrikant niet in de Europese Gemeenschap is
      gevestigd, rust de verplichting om de technische documentatie ter beschikking te houden bij de persoon die het
      artikel in de handel brengt.
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel1A.3.5
  - number: 1A.3.6
    text: |-
      1 Indien module C is toegepast, onderzoekt de door de fabrikant gekozen aangemelde instantie het artikel met
      willekeurige intervallen, of laat deze instantie het artikel onderzoeken.

      2 De aangemelde instantie neemt ter plekke een geschikt monster van de gefabriceerde artikelen, en onderzoekt dit
      of laat dit onderzoeken. Aan de hand van passende tests zoals gedefinieerd in de toepasselijke geharmoniseerde
      norm of een gelijkwaardige norm, wordt gecontroleerd of het artikel met de voorschriften van de EG-richtlijn
      pyrotechnische artikelen overeenstemt. Wanneer een of meer stalen van de onderzochte artikelen niet in
      overeenstemming blijken te zijn, neemt de aangemelde instantie passende maatregelen.

      3 Onder verantwoordelijkheid van de aangemelde instantie brengt de fabrikant tijdens het fabricageproces het
      identificatienummer van die instantie aan.
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel1A.3.6
  - number: 1A.3.7
    text: |-
      1 Indien module D, E of H is toegepast, verbindt de fabrikant zich ertoe de verplichtingen die uit het goedgekeurde
      kwaliteitssysteem voortvloeien, na te komen en ervoor te zorgen dat het goed en efficiënt blijft werken.

      2 Indien module D of E is toegepast, informeert de fabrikant de aangemelde instantie die het kwaliteitssysteem
      heeft goedgekeurd over voorgenomen wijzigingen van het kwaliteitssysteem.

      3 Indien module H is toegepast, houdt de fabrikant de aangemelde instantie die het kwaliteitssysteem heeft
      goedgekeurd voortdurend op de hoogte van elke beoogde bijwerking van het kwaliteitssysteem.

      4 De aangemelde instantie beoordeelt de voorgestelde wijzigingen en beslist of het gewijzigde kwaliteitssysteem
      aan de in bijlage II van de EG-richtlijn pyrotechnische artikelen, punt 3.2 van module D, E onderscheidenlijk H,
      bedoelde voorschriften zal blijven voldoen dan wel of het systeem opnieuw moet worden beoordeeld.

      5 De fabrikant wordt in kennis gesteld van het met redenen omklede beoordelingsbesluit. De kennisgeving bevat de
      resultaten van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel1A.3.7
  - number: 1A.3.8
    text: |-
      1 Indien module D of E is toegepast, verleent de fabrikant de aangemelde instantie voor inspectiedoeleinden toegang
      tot de fabricage-, inspectie-, test- en opslagruimten en verstrekt haar de voor die doeleinden nodige informatie,
      met name:

      a. de documentatie met betrekking tot het kwaliteitssysteem;

      b. de kwaliteitsgegevens, zoals inspectieverslagen en testgegevens, ijkgegevens, en kwalificatierapporten van het
      betrokken personeel.

      2 Indien module D of E is toegepast, houdt de fabrikant de volgende elementen gedurende ten minste tien jaar vanaf
      de laatste fabricagedatum van het artikel ter beschikking van de nationale autoriteiten:

      a. het in bijlage II van de EG-richtlijn pyrotechnische artikelen, punt 3.1, onder b, van module D en module E,
      bedoelde document;

      b. de documenten betreffende de wijzigingen als bedoeld in [artikel 1A.3.7, tweede en derde lid][ref1];

      c. de in [artikel 1A.3.7, vijfde lid][ref2], en in [artikel 1A.3.10][ref3] bedoelde besluiten en verslagen van de
      aangemelde instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A.3.7
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel1A.3.7
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel1A.3.10
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel1A.3.8
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 1A.3.7
        hoofdstuk: 1a
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: 1A.3.7
        hoofdstuk: 1a
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0013360
        artikel: 1A.3.10
        hoofdstuk: 1a
        paragraaf: '3'
  - number: 1A.3.9
    text: |-
      1 Indien module H is toegepast, verleent de fabrikant de aangemelde instantie voor inspectiedoeleinden toegang
      tot de fabricage-, inspectie-, test- en opslagruimten en verstrekt haar de voor die doeleinden nodige informatie,
      met name:

      a. de documentatie met betrekking tot het kwaliteitssysteem;

      b. de door het kwaliteitssysteem voor de ontwikkeling verlangde kwaliteitsrapporten, zoals de resultaten van
      analyses, berekeningen, testgegevens;

      c. de door het kwaliteitssysteem voor de fabricage verlangde kwaliteitsrapporten, zoals inspectieverslagen en
      testgegevens, ijkgegevens, en kwalificatierapporten van het betrokken personeel.

      2 Indien module H is toegepast, houdt de fabrikant de volgende elementen gedurende ten minste tien jaar vanaf de
      laatste fabricagedatum van het artikel ter beschikking van de nationale autoriteiten:

      a. het in bijlage II van de EG-richtlijn pyrotechnische artikelen, punt 3.1, onder b, van module H bedoelde
      document;

      b. de documenten betreffende de bijwerking als bedoeld in [artikel 1A.3.7, derde lid][ref1];

      c. de in [artikel 1A.3.7, vijfde lid][ref2] en in [artikel 1A.3.10][ref3] bedoelde besluiten en verslagen van de
      aangemelde instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A.3.7
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel1A.3.7
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel1A.3.10
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel1A.3.9
