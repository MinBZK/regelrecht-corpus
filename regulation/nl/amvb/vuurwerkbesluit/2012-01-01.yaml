  - number: 1.4.1
    text: |-
      1 Degene die:

      a. consumentenvuurwerk aan een groothandelaar ter beschikking stelt, of

      b. professioneel vuurwerk of pyrotechnische artikelen voor theatergebruik aan een ander ter beschikking stelt,

      meldt voordat de terbeschikkingstelling plaatsvindt schriftelijk het voornemen hiertoe bij Onze Minister. De
      melding wordt gedaan op een werkdag en ten minste drie werkdagen voorafgaand aan de terbeschikkingstelling van het
      de artikelen. Indien de melding wordt gedaan op een werkdag voor 12.00 uur wordt in de vorige volzin in plaats van
      «drie werkdagen» gelezen: twee werkdagen.

      2 In afwijking van het eerste lid is het degene die consumentenvuurwerk in de periode van 15 december tot 1
      januari ter beschikking stelt toegestaan het voornemen hiertoe ten minste 24 uur van te voren schriftelijk bij Onze
      Minister te melden.

      3 Bij de melding worden in ieder geval de volgende gegevens verstrekt:

      a. de naam en het adres van degene die ter beschikking stelt,

      b. de naam en het adres van degene aan wie ter beschikking wordt gesteld,

      c. de datum waarop de artikelen ter beschikking worden gesteld, en de plaats waar deze worden opgeslagen, en

      d. of het consumenten- of professioneel vuurwerk dan wel pyrotechnische artikelen voor theatergebruik betreft,
      het door de fabrikant bij de vervaardiging toegekende artikelnummer dat dient ter identificatie van het artikel,
      de CE-markering, het productiejaar, het type vuurwerk of pyrotechnisch artikel voor theatergebruik, de NEM en per
      artikelnummer de hoeveelheid vuurwerk of pyrotechnische artikelen voor theatergebruik in kilogrammen.

      4 De melding dient te worden gedaan op een formulier waarvan het model wordt vastgesteld door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel1.4.1
  - number: 1.4.2
    text: |-
      1 Degene die vuurwerk of pyrotechnische artikelen voor theatergebruik vervaardigt, binnen het grondgebied van
      Nederland brengt, of voor handelsdoeleinden voorhanden heeft, registreert:

      a. of het consumenten- of professioneel vuurwerk dan wel pyrotechnische artikelen voor theatergebruik betreft, het
      door de fabrikant bij de vervaardiging toegekende artikelnummer dat dient ter identificatie van het artikel, en
      het productiejaar;

      b. de hoeveelheid verpakt vuurwerk of pyrotechnische artikelen voor theatergebruik in kilogrammen die per afnemer
      ter beschikking is gesteld.

      2 [Artikel 3, eerste en derde lid, van het Administratiebesluit milieugevaarlijke stoffen en preparaten][ref1] is
      van overeenkomstige toepassing op de gegevens, bedoeld in het eerste lid, onder a en b.

      3 In afwijking van het eerste lid, onder b, registreert degene die bedrijfsmatig consumentenvuurwerk ter
      beschikking stelt aan particulieren, de totale hoeveelheid vuurwerk uitgedrukt in kilogrammen verpakt vuurwerk die
      per dag aan particulieren ter beschikking is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004321#Artikel3
