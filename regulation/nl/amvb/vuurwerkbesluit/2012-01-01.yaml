  - number: 5.3.4
    text: |-
      Met de aanduiding «Geschikt voor particulier gebruik» genoemd in de [artikelen 1.1.2, eerste lid, onder e][ref1],
      [1.3.1, eerste lid, onder d][ref2], [2.1.3, eerste lid, onder a][ref3], en [2.1.4][ref4] wordt tot 2 januari 2005
      gelijkgesteld de aanduiding «bestemd voor particulier gebruik», indien deze aanduiding is aangebracht op vuurwerk
      dat voor 1 januari 2003 is vervaardigd.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel1.3.1
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel2.1.3
      [ref4]: https://wetten.overheid.nl/BWBR0013360#Artikel2.1.4
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel5.3.4
