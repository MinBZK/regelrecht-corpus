  - number: 3B.3
    text: |-
      1 De aanvraag om toestemming als bedoeld in [artikel 3B.1, derde lid][ref1], bij
      gedeputeerde staten gaat vergezeld van een afschrift van het werkplan, bedoeld in
      [artikel 4.9, eerste lid, van het Arbeidsomstandighedenbesluit][ref2], een afschrift van de ingevolge artikel
      3B.1, eerste lid, verleende vergunning en een afschrift van het in [artikel 3B.2, eerste lid, onder c][ref3],
      bedoelde certificaat. Gedeputeerde staten zenden onverwijld een afschrift van de aanvraag aan de burgemeester
      van de gemeente binnen wiens gemeente het vuurwerk of de pyrotechnische artikelen voor theatergebruik
      tot ontbranding zullen worden gebracht. Op de voorbereiding van de beschikking op de aanvraag is
      [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref4] niet van toepassing.

      2 Aan de toestemming kunnen voorschriften worden verbonden in het belang van de bescherming van mens en milieu.

      3 De toestemming kan worden geweigerd in het belang van de bescherming van mens en milieu.

      4 Degene aan wie de toestemming is verleend, is gehouden de in het tweede lid bedoelde voorschriften na te leven.

      5 Gedeputeerde staten stellen alvorens toestemming te verlenen:

      a. degene die de aanvrager de vergunning, bedoeld in [artikel 3B.1, eerste lid][ref5], hebben verleend,

      b. de betrokken luchtverkeersdienst als omschreven in [artikel 1, onder r, van het Luchtverkeersreglement][ref6]
      voor zover het zichzelf voortdrijvend opstijgend vuurwerk betreft dat in de open lucht tot ontbranding zal worden
      gebracht binnen 15 kilometer afstand van een luchtvaartterrein,

      c. de commandant van de regionale brandweer binnen wiens gebied het vuurwerk of de pyrotechnische artikelen voor
      theatergebruik tot ontbranding zullen worden gebracht,

      d. de daartoe door Onze Minister van Sociale Zaken en Werkgelegenheid aangewezen toezichthouder, bedoeld in
      [artikel 1, derde lid, onderdeel d, van de Arbeidsomstandighedenwet][ref7], en

      e. de burgemeester van de gemeente aangrenzend aan de gemeente waar de het vuurwerk of de pyrotechnische artikelen
      voor theatergebruik tot ontbranding zullen worden gebracht voor zover de artikelen effect kunnen hebben binnen zijn
      gemeente, in de gelegenheid advies uit te brengen over de beslissing op de aanvraag.

      6 Een afschrift van de beschikking waarbij toestemming wordt verleend wordt door gedeputeerde staten gezonden aan
      Onze Minister, aan een daartoe door Onze Minister van Sociale Zaken en Werkgelegenheid aangewezen toezichthouder
      als bedoeld in [artikel 1, derde lid, onderdeel d van de Arbeidsomstandighedenwet][ref8], aan de burgemeester en
      aan de commandant van de regionale brandweer, bedoeld in het vijfde lid, onder c.


