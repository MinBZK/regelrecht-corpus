  - number: 3A.1.2
    text: |-
      1 Verpakt theatervuurwerk is bij het opslaan en het voorhanden hebben op zodanige wijze verpakt dat zij volgens
      bijlage A van het ADR, uitsluitend kunnen worden aangemerkt als artikelen behorende tot klasse 1.4G of 1.4S.

      2 Dit artikel is niet van toepassing op theatervuurwerk waarvan op het moment dat zij binnen het grondgebied
      van Nederland worden gebracht, naar het oordeel van Onze Minister genoegzaam wordt aangetoond dat zij binnen 48
      uur weer buiten het grondgebied van Nederland zullen worden gebracht. Indien sprake is van opslag als bedoeld in
      [artikel 1.1.4, derde lid][ref1], wordt in plaats van 48 uur gelezen: twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1.1.4
