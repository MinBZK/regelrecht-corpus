  - number: 3B.4
    text: |-
      1 In afwijking van [artikel 3B.1, derde lid, onder a][ref1], kan degene aan wie een vergunning als bedoeld in
      artikel 3B.1, eerste lid, is verleend en die:

      a. ten hoogste 10 kilogram theatervuurwerk tot ontbranding wil brengen, of

      b. ten hoogste 100 kilogram consumentenvuurwerk tot ontbranding wil brengen,

      voorafgaand aan het tot ontbranding brengen volstaan met een melding aan gedeputeerde staten van de provincie
      waarin de artikelen tot ontbranding zullen worden gebracht.

      2 Voor de bepaling van de hoeveelheid consumentenvuurwerk of theatervuurwerk, bedoeld in het eerste lid, wordt
      uitgegaan van het gewicht van de artikelen als zijnde onverpakt consumentenvuurwerk onderscheidenlijk onverpakt
      theatervuurwerk.

      3 [Artikel 3B.3, eerste lid][ref2], is van overeenkomstige toepassing op de melding aan gedeputeerde
      staten. Gedeputeerde staten zenden onverwijld een afschrift van de melding aan een daartoe door
      Onze Minister van Sociale Zaken en Werkgelegenheid aangewezen toezichthouder als bedoeld in
      [artikel 1, derde lid, onderdeel d, van de Arbeidsomstandighedenwet][ref3], aan de commandant van de regionale
      brandweer binnen wiens gebied de artikelen tot ontbranding zullen worden gebracht en aan de burgemeester van de
      gemeente binnen wiens gemeente de artikelen tot ontbranding zullen worden gebracht.

      4 Degene die het consumentenvuurwerk of theatervuurwerk tot ontbranding wil brengen draagt er zorg voor dat de
      melding ten minste twee weken voordat de artikelen tot ontbranding wordt gebracht door gedeputeerde staten is
      ontvangen.

      5 In afwijking van het vierde lid kunnen gedeputeerde staten na overleg met de burgemeester en de commandant,
      bedoeld in het derde lid, in bijzondere omstandigheden een kortere termijn voor de melding toestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3B.1
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel3B.3
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel1
