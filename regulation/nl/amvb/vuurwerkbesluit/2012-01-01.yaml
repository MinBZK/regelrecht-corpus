  - number: '4.1'
    text: |-
      1 De veiligheidsafstanden, bedoeld in [bijlage 3][ref1] worden, voor zover deze in acht genomen moeten worden
      bij de vaststelling van een besluit als bedoeld in [artikel 4.2][ref2], aangemerkt als grenswaarde als bedoeld in
      [artikel 5.1, derde lid, van de Wet milieubeheer][ref3].

      2 Indien de kwaliteit van een gebied waarvoor de veiligheidsafstand in acht moet worden genomen, beter is dan de
      grenswaarde aangeeft, treedt de kwaliteit van dat gebied niet in de plaats van de grenswaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0013360
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel4.2
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel5.1
