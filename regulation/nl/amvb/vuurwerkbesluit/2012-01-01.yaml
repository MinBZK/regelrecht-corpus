  - number: 5.4.1
    text: |-
      Onze Minister wijst een vertaling aan van bijlage A van het ADR of draagt zorg voor een vertaling en doet van de
      aanwijzing of wijze van bekendmaking van de vertaling mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel5.4.1
  - number: 5.4.2
    text: |-
      1 De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.

      2 [Artikel 4.2][ref1] kan tot twee jaar na inwerkingtreding van de [artikelen 4.1 tot en met 4.3][ref2] buiten
      toepassing worden gelaten ten aanzien van besluiten die betrekking hebben op:

      1°. het gebied gelegen binnen de veiligheidsafstand die in acht genomen moet worden ten opzichte van een inrichting
      waar professioneel vuurwerk al dan niet tezamen met consumentenvuurwerk wordt opgeslagen of bewerkt;

      2°. de verlening of wijziging van een vergunning op grond van de [Wet milieubeheer][ref3] ten behoeve van
      inrichtingen in het onder 1° bedoelde gebied,

      indien en voor zover door de onder 1° bedoelde inrichting op het tijdstip waarop de
      [artikelen 4.1 tot en met 4.3][ref4] in werking treden, ten opzichte van kwetsbare of geprojecteerde kwetsbare
      objecten niet wordt voldaan aan de voor die inrichting van toepassing zijnde veiligheidsafstanden.

      3 Het tweede lid geldt niet voor zover het besluit, bedoeld in [artikel 4.2][ref5], betrekking heeft op een
      inrichting als bedoeld in [artikel 3.2.1][ref6].


