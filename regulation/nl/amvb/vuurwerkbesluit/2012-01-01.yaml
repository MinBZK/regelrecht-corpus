  - number: 3A.3.1
    text: |-
      1 Het is verboden pyrotechnische artikelen voor theatergebruik aan een ander ter beschikking te stellen.

      2 Het verbod geldt niet voor het ter beschikking stellen van pyrotechnische artikelen voor theatergebruik aan een
      persoon met gespecialiseerde kennis.
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel3A.3.1
  - number: 3B.1
    text: |-
      1 Met uitzondering van de situatie, bedoeld in [artikel 2.3.6][ref1], is het verboden zonder een daartoe verleende
      vergunning consumentenvuurwerk, professioneel vuurwerk of pyrotechnische artikelen voor theatergebruik tot
      ontbranding te brengen, ten behoeve daarvan op te bouwen, te installeren, te bewerken, dan wel na ontbranding te
      verwijderen.

      2 Gedeputeerde staten van de provincie waarin de aanvrager is gevestigd zijn bevoegd om te beslissen op een
      aanvraag om een vergunning. Is de aanvrager in het buitenland gevestigd, dan is Onze Minister bevoegd.

      3 Aan de vergunning wordt het voorschrift verbonden dat:

      a. voorafgaand aan het tot ontbranding brengen van vuurwerk of pyrotechnische artikelen voor theatergebruik door
      de aanvrager toestemming is verkregen van gedeputeerde staten van de provincie waarin de artikelen tot ontbranding
      zullen worden gebracht en de aan de toestemming verbonden voorschriften worden nageleefd;

      b. de tot ontbranding te brengen artikelen afkomstig zijn uit een inrichting als bedoeld in [artikel 2.2.1][ref2],
      [2.2.2][ref3], [3.2.1][ref4] of [3A.2.1][ref5] dan wel rechtstreeks afkomstig zijn uit het buitenland.

      4 Aan de vergunning worden voorts voorschriften verbonden in het belang van de bescherming van mens en milieu. Zij
      kan onder beperkingen worden verleend.

      5 Degene aan wie een vergunning is verleend, is gehouden de in het derde en vierde lid bedoelde voorschriften na
      te leven.

      6 De vergunning vervalt op het moment dat de geldigheidsduur van het certificaat van vakbekwaamheid, bedoeld in
      [artikel 3B.2, eerste lid, onder c][ref6], afloopt. Is de vergunning verleend aan een onderneming dan vervalt
      de vergunning eveneens op het moment dat er geen persoon aan wie een certificaat van vakbekwaamheid, bedoeld in
      [artikel 4.9, tweede lid, van het Arbeidsomstandighedenbesluit][ref7], is afgegeven, meer werkzaam is voor de
      onderneming.

      7 Gedeputeerde staten stellen de korpschef van de politieregio waar de aanvrager is gevestigd, in de gelegenheid
      advies uit te brengen over het ontwerp van de beschikking op de aanvraag om een vergunning.

      8 Een afschrift van de vergunning wordt door gedeputeerde staten gezonden aan Onze Minister.


