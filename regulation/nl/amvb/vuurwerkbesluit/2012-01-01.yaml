  - number: 1.1.3
    text: |-
      Dit besluit is van toepassing op vuurwerk en pyrotechnische artikelen voor theatergebruik, met uitzondering van:

      a. in beslag genomen vuurwerk en pyrotechnische artikelen voor theatergebruik die in beheer zijn bij de overheid;

      b. vuurwerk en pyrotechnische artikelen voor theatergebruik waarover door de krijgsmacht, de politie of de
      brandweer wordt beschikt ten behoeve van instructiedoeleinden;

      c. vuurwerk en pyrotechnische artikelen voor theatergebruik die in het kader van internationaal vervoer per
      zeeschip of vliegtuig binnen het grondgebied van Nederland worden gebracht en niet in Nederland worden gelost of
      rechtstreeks worden overgeladen naar een ander zeeschip onderscheidenlijk vliegtuig;

      d. vuurwerk waarvoor regels zijn gesteld bij het [Warenwetbesluit Speelgoed][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005094
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel1.1.3
