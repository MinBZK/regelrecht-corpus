  - number: '4.3'
    text: |-
      1 Indien voor het desbetreffende gebied een bestemmingsplan geldt, gelden de veiligheidsafstanden,
      tenzij in [bijlage 3][ref1] anders is aangegeven, vanaf de uitwendige scheidingsconstructie, bedoeld in
      [artikel 1.1 van het Bouwbesluit 2003][ref2], van het gebouw waar vuurwerk wordt opgeslagen of bewerkt binnen een
      inrichting als bedoeld in de [artikelen 2.2.1][ref3], [2.2.2][ref4], [3.2.1][ref5] of [3A.2.1][ref6], tot aan de
      bestemmingsgrens.

      2 Indien een bestemmingsplan voor het desbetreffende gebied ontbreekt, gelden de veiligheidsafstanden,
      tenzij in [bijlage 3][ref7] anders is aangegeven, vanaf de uitwendige scheidingsconstructie, bedoeld in
      [artikel 1.1 van het Bouwbesluit 2003][ref8], van het gebouw, bedoeld in het eerste lid, tot aan de eigendomsgrens
      van het gebied dat behoort bij het kwetsbare object.

      3 In afwijking van het eerste lid gelden de veiligheidsafstanden tot tien meter vanaf het kwetsbare object of het
      geprojecteerde kwetsbare object, indien:

      a. dat object een gebouw is, niet zijnde een gebouw als bedoeld in
      [artikel 1.1.1, eerste lid, onder d, e of f][ref9], en de grens van de bouwstrook meer dan tien meter vanaf de
      bestemmingsgrens is gelegen;

      b. dat object een woonwagen als bedoeld in artikel 1, eerste lid, van
      [bijlage II bij het Besluit omgevingsrecht][ref10] is die meer dan tien meter vanaf de grens van het gebied dat
      voor woonwagens is bestemd, is of mag worden geplaatst.

      4 Indien in het bestemmingsplan geen bouwstrook is aangegeven, gelden de veiligheidsafstanden tot aan de
      bestemmingsgrens.

      5 In afwijking van het tweede lid gelden de veiligheidsafstanden tot tien meter vanaf het kwetsbare object, indien:

      a. dat object een gebouw is, niet zijnde een gebouw als bedoeld in
      [artikel 1.1.1, eerste lid, onder d, e of f][ref11], dat meer dan tien meter vanaf de eigendomsgrens van het
      desbetreffende gebied is gelegen;

      b. dat object een woonwagen als bedoeld in artikel 1, eerste lid, van
      [bijlage II bij het Besluit omgevingsrecht][ref12] is die meer dan tien meter van de eigendomsgrens van het
      desbetreffende perceel of van het gebied dat voor woonwagens is aangewezen, is geplaatst.

      6 In afwijking van het eerste tot en met vijfde lid gelden de veiligheidsafstanden, tenzij in
      [bijlage 3][ref13] anders is aangegeven, vanaf de uitwendige scheidingsconstructie, bedoeld in
      [artikel 1.1 van het Bouwbesluit 2003][ref14], van het gebouw, bedoeld in het eerste lid, tot aan de ligplaats van
      een woonschip als bedoeld in [artikel 1.1.1, eerste lid, onder c][ref15].


