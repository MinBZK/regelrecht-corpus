  - number: '4.2'
    text: |-
      1 Het bevoegd gezag neemt de in [bijlage 3][ref1] gestelde afstanden in acht bij:

      a. het vaststellen van een bestemmings- of inpassingsplan of een beheersverordening
      als bedoeld in [artikel 3.1][ref2], [3.26][ref3] of [3.28][ref4], onderscheidenlijk
      [artikel 3.38 van de Wet ruimtelijke ordening][ref5];

      b. het wijzigen van een bestemmingsplan overeenkomstig [artikel 3.6, eerste lid, onder a, van die wet][ref6];

      c. het verlenen van een omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder c of e, van de Wet algemene bepalingen omgevingsrecht][ref7].

      2 Gedeputeerde staten nemen de in [bijlage 3][ref8] gestelde afstanden in acht bij de verlening of wijziging van
      een omgevingsvergunning.

      3 Onze Minister neemt bij de verlening of wijziging van een omgevingsvergunning voor een
      inrichting die is gelegen binnen het door hem op grond van categorie 29.1, onder l, van
      [bijlage I, onder C, bij het Besluit omgevingsrecht][ref9], aangewezen gebied, de in [bijlage 3][ref10] gestelde
      afstanden in acht ten aanzien van kwetsbare objecten en geprojecteerde kwetsbare objecten die zijn gelegen buiten
      het door hem aangewezen gebied.

      4 Het eerste en tweede lid zijn niet van toepassing ten aanzien van inrichtingen als bedoeld in
      [artikel 1.1.4][ref11].

      5 In afwijking van het eerste en tweede lid kan het bevoegd gezag een kleinere afstand dan genoemd in
      [bijlage 3, onder 1.3][ref12], vaststellen, indien het desbetreffende besluit betrekking heeft op:

      a. een inrichting waar theatervuurwerk al dan niet tezamen met consumentenvuurwerk wordt opgeslagen of bewerkt,

      b. een inrichting waar meer dan 10 000 kilogram consumentenvuurwerk wordt opgeslagen, herverpakt of bewerkt, of

      c. de bestemming van grond, voor zover die grond ligt binnen het invloedsgebied van een inrichting als bedoeld
      onder a of b,

      indien aan de omgevingsvergunning voor de desbetreffende inrichting zodanige voorschriften zijn verbonden dat:

      1°. de warmtestraling ten gevolge van brand in die inrichting waarbij vuurwerk of pyrotechnische artikelen voor
      theatergebruik betrokken zijn voor personen die zich ophouden buiten een gebouw dat onderdeel is van een kwetsbaar
      object of een geprojecteerd kwetsbaar object beperkt blijft tot ten hoogste 10 kW/m2, en

      2°. de weerstand tegen branddoorslag en brandoverslag tussen de deuropening van een bewaarplaats of een
      bufferbewaarplaats en een gebouw, indien dat gebouw een kwetsbaar object of een geprojecteerd kwetsbaar object is,
      niet lager is dan 60 minuten.


