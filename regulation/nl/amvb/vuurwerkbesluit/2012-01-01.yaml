  - number: 1.2.4
    text: |-
      1 Het is verboden vuurwerk of pyrotechnische artikelen voor theatergebruik voorhanden te hebben buiten een
      inrichting als bedoeld in:

      a. [artikel 1.1.4][ref1];

      b. [artikel 2.2.2][ref2], [3.2.1][ref3] of [3A.2.1][ref4] waarvoor een omgevingsvergunning is verleend die
      betrekking heeft op de opslag van vuurwerk;

      c. [artikel 2.2.1][ref5] waarvoor een melding is gedaan krachtens [artikel 2.2.4][ref6].

      2 Het eerste lid is niet van toepassing:

      a. tijdens de perioden dat consumentenvuurwerk ingevolge [artikel 2.3.2][ref7] ter beschikking mag worden gesteld
      of ingevolge [artikel 2.3.6][ref8] tot ontbranding mag worden gebracht, indien niet meer dan tien kilogram
      consumentenvuurwerk voorhanden is;

      b. buiten de perioden, bedoeld onder a, indien niet meer dan tien kilogram consumentenvuurwerk voorhanden is op een
      plaats die niet voor het publiek toegankelijk is;

      c. tijdens het tot ontbranding brengen van professioneel vuurwerk of pyrotechnische artikelen voor theatergebruik
      overeenkomstig [artikel 3B.1][ref9], alsmede gedurende ten hoogste zestien uur daaraan voorafgaand, met dien
      verstande dat niet meer vuurwerk of pyrotechnische artikelen voor theatergebruik voorhanden zijn dan redelijkerwijs
      tot ontbranding zullen worden gebracht;

      d. gedurende ten hoogste 12 uur nadat is of zou worden aangevangen met het tot ontbranding van professioneel
      vuurwerk of pyrotechnische artikelen voor theatergebruik overeenkomstig [artikel 3B.1][ref10] en het vuurwerk of de
      pyrotechnische artikelen voor theatergebruik voorhanden zijn op een plaats die niet voor het publiek toegankelijk
      is en op een zodanige wijze dat geen gevaar voor personen is te duchten, met dien verstande dat niet meer vuurwerk
      of pyrotechnische artikelen voor theatergebruik voorhanden zijn dan redelijkerwijs tot ontbranding zouden worden
      gebracht.

      3 Gedeputeerde staten van de provincie waarin het professioneel vuurwerk of de pyrotechnische artikelen
      voor theatergebruik tot ontbranding zullen worden gebracht kunnen bij de toestemming, bedoeld in
      [artikel 3B.1, derde lid, onder a][ref11], in plaats van de tijdsduur, genoemd in het tweede lid, onder c, een
      andere tijdsduur vaststellen.

      4 Het eerste lid is tevens niet van toepassing indien het vuurwerk of de pyrotechnische
      artikelen voor theatergebruik worden vervoerd overeenkomstig de eisen gesteld bij of krachtens de
      [Wet vervoer gevaarlijke stoffen][ref12] en met inachtneming van [artikel 1.2.5][ref13].


