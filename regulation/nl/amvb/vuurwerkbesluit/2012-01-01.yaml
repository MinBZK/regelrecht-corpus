  - number: 2.3.5
    text: |-
      Het is verboden consumentenvuurwerk te verkopen of anderszins ter beschikking te stellen aan particulieren jonger
      dan:

      Voor zover het betreft categorie 1: 12 jaar;

      Voor zover het betreft categorie 2: 16 jaar;

      Voor zover het betreft categorie 3: 18 jaar.
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel2.3.5
