        hoofdstuk: '3'
        paragraaf: '3'
  - number: 5.3.2
    text: |-
      1 Indien op het tijdstip waarop de [paragrafen 2 van de hoofdstukken 2][ref1] en [3][ref2] van dit besluit in
      werking treden, ten opzichte van kwetsbare of geprojecteerde kwetsbare objecten niet wordt voldaan aan de van
      toepassing zijnde veiligheidsafstanden, draagt – behoudens eerdere intrekking van de vergunning – degene die de
      inrichting drijft er binnen twee jaar na inwerkingtreding van dit besluit zorg voor dat de veiligheidsafstanden
      zijn geëffectueerd.

      2 In afwijking van het eerste lid kunnen gedeputeerde staten op verzoek van degene die de inrichting drijft een
      kleinere veiligheidsafstand dan genoemd in [bijlage 3, onder 1.3][ref3], vaststellen ten behoeve van:

      a. een inrichting waar theatervuurwerk al dan niet tezamen met professioneel vuurwerk als bedoeld in
      [artikel 3.1.4][ref4] wordt opgeslagen of bewerkt, of

      b. een inrichting waar meer dan 10 000 kilogram consumentenvuurwerk wordt opgeslagen, herverpakt of bewerkt,

      indien aan de vergunning als bedoeld in [artikel 8.1 van de Wet milieubeheer][ref5] voor de desbetreffende
      inrichting zodanige voorschriften zijn verbonden dat:

      1°. de warmtestraling ten gevolge van brand in die inrichting waarbij vuurwerk betrokken is voor personen die zich
      ophouden buiten een gebouw dat onderdeel is van een kwetsbaar object of een geprojecteerd kwetsbaar object beperkt
      blijft tot ten hoogste 10 kW/m2, en

      2°. de weerstand tegen branddoorslag en brandoverslag tussen de deuropening van een bewaarplaats of een
      bufferbewaarplaats en een gebouw, indien dat gebouw een kwetsbaar object of een geprojecteerd kwetsbaar object is,
      niet lager is dan 60 minuten.

      3 Het verzoek, bedoeld in het tweede lid, wordt gedaan voor 1 maart 2004 en gaat vergezeld van toereikende gegevens
      met betrekking tot de warmtestraling en brandoverslag die de inrichting kan veroorzaken.

      4 Gedeputeerde staten stellen alvorens toepassing te geven aan het tweede lid de commandant van de regionale
      brandweer binnen wiens gebied de inrichting geheel of in hoofdzaak is gelegen, in de gelegenheid advies uit te
      brengen op het verzoek, bedoeld in het tweede lid.

      5 Indien gedeputeerde staten toepassing geven aan het tweede lid wordt voor de effectuering van de
      veiligheidsafstanden, in afwijking van het eerste lid in plaats van «binnen twee jaar na inwerkingtreding van dit
      besluit» gelezen: uiterlijk 1 maart 2005.

      6 Het eerste lid geldt niet ten aanzien van geprojecteerde kwetsbare objecten, voor zover het bestemmingsplan dan
      wel de beheersverordening waarin deze objecten zijn opgenomen, is vastgesteld op een tijdstip meer dan tien jaar
      voorafgaand aan het tijdstip waarop de [paragrafen 2 van de hoofdstukken 2][ref6] en [3][ref7] van dit besluit in
      werking treden.


