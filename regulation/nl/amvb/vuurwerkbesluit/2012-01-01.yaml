  - number: 5.3.6
    text: |-
      1 Een vergunning, verleend op grond van [artikel 3.3.2][ref1] van het Vuurwerkbesluit, zoals dit gold tot en met
      3 juli 2010, wordt na die datum aangemerkt als een vergunning krachtens [artikel 3B.1, eerste lid][ref2], van het
      Vuurwerkbesluit.

      2 Een toestemming als bedoeld in [artikel 3.3.2, derde lid, onder a][ref3], van het Vuurwerkbesluit,
      zoals dit gold tot en met 3 juli 2010, wordt na die datum aangemerkt als een toestemming als bedoeld in
      [artikel 3B.1, derde lid][ref4], van het Vuurwerkbesluit.

      3 Een vergunning als bedoeld in het eerste lid, en een toestemming als bedoeld in het tweede lid, gelden tevens
      voor consumentenvuurwerk en pyrotechnische artikelen voor theatergebruik.


