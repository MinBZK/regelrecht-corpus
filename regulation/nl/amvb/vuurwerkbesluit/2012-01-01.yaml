  - number: 1A.2.2
    text: |-
      1 [Artikel 1A.2.1][ref1] is niet van toepassing op vuurwerk en pyrotechnische artikelen voor theatergebruik die
      niet in overeenstemming zijn met de bepalingen van EG-richtlijn pyrotechnische artikelen en die worden getoond en
      gebruikt op handelsbeurzen, tentoonstellingen en demonstraties voor de marketing van pyrotechnische artikelen, mits
      is voldaan aan het bepaalde in het derde lid.

      2 Pyrotechnische artikelen als bedoeld in het eerste lid mogen pas verkocht worden nadat ze door de fabrikant,
      wanneer die is gevestigd in de Europese Gemeenschap, of door de importeur in overeenstemming zijn gebracht met de
      bepalingen van de in het eerste lid genoemde richtlijn.

      3 Op pyrotechnische artikelen als bedoeld in het eerste lid:

      a. wordt een zichtbaar teken aangebracht waaruit duidelijk de naam en de datum van de handelsbeurs, tentoonstelling
      of demonstratie blijken;

      b. is aangegeven dat de artikelen niet in overeenstemming zijn met de bepalingen van de EG-richtlijn pyrotechnische
      artikelen, en niet verkocht mogen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A.2.1
    url: https://wetten.overheid.nl/BWBR0013360/2012-01-01#Artikel1A.2.2
