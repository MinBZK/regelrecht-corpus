  - number: 5.3.3
    text: |-
      1 Voor inrichtingen waarvoor onmiddellijk voorafgaand aan het tijdstip waarop de
      [paragrafen 2 van de hoofdstukken 2][ref1] en [3 van dit besluit][ref2] in werking treden, een vergunning gold
      voor het opslaan, herverpakken of bewerken van vuurwerk krachtens [artikel 8.1 van de Wet milieubeheer][ref3] zijn
      gedurende twee jaar na inwerkingtreding van dit besluit – behoudens eerdere intrekking van de vergunning of het
      verstrijken van de periode waarvoor de vergunning is verleend – [artikel 2.3.4][ref4] en de voorschriften opgenomen
      in [bijlagen 1][ref5] en [2][ref6] die ten gevolge van de inwerkingtreding van de [artikelen 2.2.2][ref7] en
      [3.2.1][ref8] gaan gelden, niet van toepassing. Gedurende die periode blijven een zodanige vergunning, de aan de
      vergunning verbonden voorschriften en artikel 9 van het Vuurwerkbesluit Wet milieugevaarlijke stoffen, zoals dat
      luidde voor de inwerkingtreding van dit besluit, van toepassing.

      2 Voor inrichtingen waarvoor onmiddellijk voorafgaand aan het tijdstip waarop de
      [paragrafen 2 van de hoofdstukken 2][ref9] en [3 van dit besluit][ref10] in werking treden, een vergunning gold
      voor het opslaan, herverpakken of bewerken van vuurwerk krachtens [artikel 8.1 van de Wet milieubeheer][ref11]
      en binnen twee jaar na de inwerkingtreding van dit besluit ten gevolge van het veranderen van de inrichting dan
      wel het veranderen van de werking daarvan de vergunning moet worden gewijzigd, zijn [artikel 2.3.4][ref12] en
      de voorschriften opgenomen in [bijlagen 1][ref13] en [2][ref14] van toepassing, voor zover de wijziging daarop
      betrekking heeft.

      3 Voor inrichtingen waarvoor onmiddellijk voorafgaand aan het tijdstip waarop
      [paragraaf 2 van hoofdstuk 2 van dit besluit][ref15] in werking treedt, een melding was gedaan krachtens
      het Besluit opslag vuurwerk milieubeheer, zijn [artikel 2.3.4][ref16] en de voorschriften opgenomen in
      [bijlage 1][ref17] die ten gevolge van de inwerkingtreding van [artikel 2.2.1][ref18] gaan gelden, niet van
      toepassing gedurende twee jaar na inwerkingtreding van dit besluit. Gedurende die periode blijven de voorschriften
      die gesteld zijn bij of krachtens het Besluit opslag vuurwerk milieubeheer en artikel 9 van het Vuurwerkbesluit Wet
      milieugevaarlijke stoffen, zoals dat luidde voor de inwerkingtreding van dit besluit, van toepassing.

      4 Voor inrichtingen waarvoor onmiddellijk voorafgaand aan het tijdstip waarop
      [paragraaf 2 van hoofdstuk 2 van dit besluit][ref19] in werking treedt, een melding was gedaan krachtens het
      Besluit opslag vuurwerk milieubeheer en binnen twee jaar na de inwerkingtreding van dit besluit ten gevolge van het
      veranderen van de inrichting dan wel het veranderen van de werking daarvan voor zover die verandering betrekking
      heeft op de opslag van vuurwerk een melding moet worden gedaan, zijn [artikel 2.3.4][ref20] en de voorschriften
      opgenomen in [bijlage 1][ref21] die ten gevolge van de inwerkingtreding van [artikel 2.2.1][ref22] gaan gelden, van
      toepassing, voor zover de verandering daarop betrekking heeft.

      5 Voor de in het eerste en derde lid bedoelde inrichtingen, voor zover daarin theatervuurwerk al dan niet tezamen
      met vuurwerk als bedoeld in [artikel 3.1.4][ref23] of meer dan 10 000 kg consumentenvuurwerk wordt opgeslagen
      en gedeputeerde staten toepassing hebben gegeven aan het [tweede lid van artikel 5.3.2][ref24], wordt voor de
      toepassing van het eerste en derde lid in plaats van «gedurende twee jaar na inwerkingtreding van dit besluit»
      gelezen: tot uiterlijk 1 maart 2005.

      6 Voor de in het eerste en derde lid bedoelde inrichtingen, voor zover daarin niet meer
      dan 10 000 kg consumentenvuurwerk wordt opgeslagen, wordt voor zover het betreft de in
      [bijlage 1, voorschriften 5.1 tot en met 5.5][ref25] genoemde onderdelen in plaats van «gedurende twee jaar na
      inwerkingtreding van dit besluit» gelezen: tot uiterlijk 1 november 2004.


