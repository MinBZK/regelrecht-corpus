  - number: 1.1.1.2
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.1.1
  - number: 1.1.1.2.a
    text: |-
      bewerken van professioneel vuurwerk: bewerken, verwerken, verpakken, herverpakken, voormonteren, monteren en
      assembleren;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.1.1
  - number: 1.1.1.2.b
    text: |-
      bewerken van consumentenvuurwerk: handelingen gericht op het positief beïnvloeden van de stabiliteit, waardoor
      de kans op omvallen of afbreken tijdens het afsteken wordt verkleind, waarbij geen pyrotechnische stof wordt
      verwijderd of toegevoegd.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.1.1
  - number: 1.1.1.3
    text: |-
      Onder professioneel vuurwerk wordt mede verstaan: een door Onze Minister aangewezen stof of een preparaat, een
      voorwerp of een onderdeel van een voorwerp dan wel een stof of een preparaat, een voorwerp of een onderdeel van een
      voorwerp dat behoort tot een door Onze Minister bij ministeriële regeling aangewezen categorie, voor zover die stof
      of dat preparaat, dat voorwerp of dat onderdeel van een voorwerp kennelijk is bestemd of wordt gebruikt om voor
      vermakelijkheidsdoeleinden effecten te bewerkstelligen.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.1.1
