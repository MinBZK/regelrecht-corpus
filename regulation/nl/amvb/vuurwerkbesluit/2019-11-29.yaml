  - number: 1.1.2a.1
    text: 'Als een persoon met gespecialiseerde kennis worden aangewezen:'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.1.2a
  - number: 1.1.2a.1.a
    text: |-
      een persoon die een inrichting drijft als bedoeld in [artikel 3.2.1][ref1] of [3A.2.1][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel3A
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.1.2a
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: 3A
        hoofdstuk: 3a
        paragraaf: '2'
  - number: 1.1.2a.1.b
    text: |-
      een houder van een vergunning als bedoeld in [artikel 3B.1, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3B
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.1.2a
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 3B
        hoofdstuk: 3b
  - number: 1.1.2a.1.c
    text: medewerkers van de politie in de uitoefening van hun functie;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.1.2a
  - number: 1.1.2a.1.d
    text: medewerkers van de brandweer in de uitoefening van hun functie;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.1.2a
  - number: 1.1.2a.1.e
    text: |-
      personen die in de uitoefening van hun functie vuurwerk of pyrotechnische artikelen voor theatergebruik tot
      ontbranding brengen bij een instelling die de genoemde producten bedrijfsmatig en uitsluitend ten behoeve van
      onderzoek tot ontbranding brengt;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.1.2a
  - number: 1.1.2a.1.f
    text: medewerkers van de krijgsmacht in de uitoefening van hun functie.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.1.2a
  - number: 1.1.2a.2
    text: |-
      Als een persoon met gespecialiseerde kennis wordt tevens aangewezen een persoon die als zodanig met betrekking tot
      vuurwerk en pyrotechnische artikelen voor theatergebruik is aangewezen in een andere lidstaat van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.1.2a
  - number: 1.1.3
    text: 'Dit besluit is van toepassing op vuurwerk en pyrotechnische artikelen voor theatergebruik, met uitzondering van:'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.1.3
  - number: 1.1.3.a
    text: in beslag genomen vuurwerk en pyrotechnische artikelen voor theatergebruik die in beheer zijn bij de overheid;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.1.3
  - number: 1.1.3.b
    text: |-
      vuurwerk en pyrotechnische artikelen voor theatergebruik waarover door de krijgsmacht, de politie of de brandweer
      wordt beschikt ten behoeve van instructiedoeleinden;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.1.3
  - number: 1.1.3.c
    text: |-
      vuurwerk en pyrotechnische artikelen voor theatergebruik die in het kader van internationaal vervoer per
      zeeschip of vliegtuig binnen het grondgebied van Nederland worden gebracht en niet in Nederland worden gelost of
      rechtstreeks worden overgeladen naar een ander zeeschip onderscheidenlijk vliegtuig;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.1.3
  - number: 1.1.3.d
    text: |-
      vuurwerk waarvoor regels zijn gesteld bij het [Warenwetbesluit Speelgoed 2011][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0029619
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.1.3
    references:
      - id: ref1
        bwb_id: BWBR0029619
  - number: 1.1.3.e
    text: |-
      vuurwerk dat door een fabrikant voor eigen gebruik is vervaardigd en dat door Onze Minister uitsluitend voor
      gebruik op zijn grondgebied is goedgekeurd en dat op het grondgebied van Nederland blijft.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.1.3
  - number: 1.1.4.1
    text: |-
      De [artikelen 2.2.1][ref1], [2.2.3][ref2], [3.2.1][ref3], [3.2.2][ref4] en [3A.2.1][ref5] zijn niet van
      toepassing op de opslag van vuurwerk of pyrotechnische artikelen voor theatergebruik in inrichtingen waarvoor
      een omgevingsvergunning is verleend die betrekking heeft op de opslag van vuurwerk of pyrotechnische artikelen
      voor theatergebruik, voor zover deze plaatsvindt gedurende ten hoogste 48 uur te rekenen vanaf het moment van
      opslaan en in afwachting van aansluitend vervoer naar een vooraf bekende ontvanger, met inbegrip van het laden en
      lossen van de artikelen en de overbrenging daarvan naar een andere vervoersmodaliteit dan waarlangs de artikelen
      zijn ontvangen, voor zover daadwerkelijk in aansluitend vervoer is voorzien en het betrokken artikel in de
      oorspronkelijke verpakking blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0013360#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0013360#Artikel3A
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.1.4
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0013360
        artikel: 3A
        hoofdstuk: 3a
        paragraaf: '2'
  - number: 1.1.4.2
    text: |-
      Voor de berekening van de in het eerste lid bedoelde termijn van 48 uur worden zaterdagen, zondagen en algemeen
      erkende feestdagen in de zin van de [Algemene termijnenwet][ref1] niet meegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.1.4
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: 1.1.4.3
    text: |-
      In afwijking van het eerste lid wordt indien sprake is van opslag van vuurwerk of pyrotechnische artikelen voor
      theatergebruik in containers voor vervoer in een inrichting die is gelegen op een haventerrein van de zeehaven van
      Amsterdam, Eemshaven, Rotterdam of Vlissingen en waarvoor een omgevingsvergunning is verleend die betrekking heeft
      op de opslag van vuurwerk of pyrotechnische artikelen voor theatergebruik en voor zover aan de voorwaarden van het
      eerste lid is voldaan, in plaats van «48 uur» gelezen: twee weken.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.1.4
  - number: 1.1.5
    text: |-
      De [artikelen 2.3.6][ref1], [3.3.1][ref2], [3A.3.1][ref3] en [3B.1][ref4] zijn niet van toepassing op instellingen
      die vuurwerk of pyrotechnische artikelen voor theatergebruik bedrijfsmatig en uitsluitend ten behoeve van onderzoek
      tot ontbranding brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel3A
      [ref4]: https://wetten.overheid.nl/BWBR0013360#Artikel3B
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.1.5
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0013360
        artikel: 3A
        hoofdstuk: 3a
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0013360
        artikel: 3B
        hoofdstuk: 3b
  - number: 1.1.7
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de praktische regelingen voor het
      regelmatig verzamelen en bijwerken van gegevens over ongevallen, als bedoeld in artikel 43, onder b, van de EU-
      richtlijn pyrotechnische artikelen.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.1.7
  - number: 1.2.2.1
    text: |-
      Het is verboden professioneel vuurwerk of pyrotechnische artikelen voor theatergebruik, indien bestemd voor
      particulier gebruik, binnen het grondgebied van Nederland te brengen, op te slaan, te vervaardigen, voorhanden te
      hebben of aan een ander ter beschikking te stellen.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.2
  - number: 1.2.2.2
    text: |-
      Het is verboden aan een ander dan een persoon met gespecialiseerde kennis professioneel vuurwerk of pyrotechnische
      artikelen voor theatergebruik ter beschikking te stellen.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.2
  - number: 1.2.2.3
    text: |-
      Het is verboden als een ander dan een persoon met gespecialiseerde kennis professioneel vuurwerk of pyrotechnische
      artikelen voor theatergebruik op te slaan, voorhanden te hebben of tot ontbranding te brengen.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.2
  - number: 1.2.2.4
    text: |-
      Het is verboden vuurwerk of pyrotechnische artikelen voor theatergebruik binnen het grondgebied van Nederland
      te brengen, op te slaan, te vervaardigen, toe te passen, voorhanden te hebben, aan een ander ter beschikking te
      stellen of tot ontbranding te brengen indien dit niet voldoet aan het bepaalde bij of krachtens dit besluit.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.2
  - number: 1.2.2.5
    text: |-
      Het is eenieder verboden, teneinde handelingen als bedoeld in het eerste tot en met vierde lid, voor te bereiden of
      te bevorderen:
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.2
  - number: 1.2.2.5.a
    text: |-
      te trachten een ander te bewegen om die handelingen te plegen, te doen plegen, mede te plegen of uit te lokken, om
      daarbij behulpzaam te zijn of om daartoe gelegenheid, middelen of inlichtingen te verschaffen,
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.2
  - number: 1.2.2.5.b
    text: |-
      te trachten zich of een ander gelegenheid, middelen of inlichtingen tot het verrichten van die handelingen te
      verschaffen, of
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.2
  - number: 1.2.2.5.c
    text: |-
      voorwerpen, vervoermiddelen, stoffen, gelden of andere betaalmiddelen voorhanden te hebben, waarvan hij weet of
      ernstige reden heeft te vermoeden dat zij bestemd zijn tot het verrichten van die handelingen.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.2
  - number: 1.2.2.6
    text: |-
      Het is verboden vuurwerk of pyrotechnische artikelen voor theatergebruik buiten het grondgebied van Nederland te
      brengen zonder dat het voornemen daartoe met inachtneming van [artikel 1.3.2][ref1] is gemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 1.2.2.7
    text: 'Van bestemd voor particulier gebruik als bedoeld in het eerste lid is in ieder geval sprake indien:'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.2
  - number: 1.2.2.7.a
    text: het tot ontbranding wordt gebracht door een particulier,
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.2
  - number: 1.2.2.7.b
    text: het te koop wordt aangeboden of ter beschikking wordt gesteld aan, gekocht of besteld door een particulier,
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.2
  - number: 1.2.2.7.c
    text: het aangetroffen wordt bij een particulier,
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.2
  - number: 1.2.2.7.d
    text: |-
      het binnen het grondgebied van Nederland wordt gebracht of voorhanden wordt gehouden met het oogmerk het aan
      particulieren ter beschikking te stellen, of
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.2
  - number: 1.2.2.7.e
    text: 'het is voorzien van de aanduiding: Geschikt voor particulier gebruik.'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.2
  - number: 1.2.2a
    text: |-
      Het is verboden, behoudens het bepaalde in de [artikelen 1.3.1, derde lid][ref1], [2.1.2, tweede lid][ref2],
      en [2.1.3, zesde lid][ref3], dan wel [3.1.1, zesde lid][ref4], en [3A.1.1, zesde lid][ref5], vuurwerk of
      pyrotechnische artikelen voor theatergebruik op te slaan of te bewerken indien niet wordt voldaan aan de
      voorschriften die zijn gesteld krachtens [artikel 9.2.2.1, derde lid, van de Wet milieubeheer][ref6], dan wel
      krachtens dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0013360#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0013360#Artikel3A
      [ref6]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.2a
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0013360
        artikel: 3A
        hoofdstuk: 3a
        paragraaf: '1'
      - id: ref6
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 1.2.3
    text: |-
      Het is verboden vuurwerk of pyrotechnische artikelen voor theatergebruik buiten een daartoe bestemde inrichting te
      vervaardigen of, behoudens het bepaalde in [artikel 3B.1, eerste lid][ref1], te bewerken.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3B
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 3B
        hoofdstuk: 3b
  - number: 1.2.4.1
    text: |-
      Het is verboden vuurwerk of pyrotechnische artikelen voor theatergebruik voorhanden te hebben buiten een inrichting
      als bedoeld in:
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.4
  - number: 1.2.4.1.a
    text: |-
      [artikel 1.1.4][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.4
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 1.2.4.1.b
    text: |-
      [artikel 2.2.1][ref1], [3.2.1][ref2] of [3A.2.1][ref3] waarvoor een omgevingsvergunning is verleend die betrekking
      heeft op de opslag van vuurwerk;


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel3A
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.4
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0013360
        artikel: 3A
        hoofdstuk: 3a
        paragraaf: '2'
  - number: 1.2.4.1.c
    text: |-
      [artikel 2.2.1][ref1] waarvoor een melding is gedaan krachtens [artikel 2.2.4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel2
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.4
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 1.2.4.2
    text: 'Het eerste lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.4
  - number: 1.2.4.2.a
    text: |-
      tijdens de perioden dat consumentenvuurwerk ingevolge [artikel 2.3.2][ref1] ter beschikking mag worden gesteld
      of ingevolge [artikel 2.3.6][ref2] tot ontbranding mag worden gebracht, indien niet meer dan 25 kilogram
      consumentenvuurwerk voorhanden is;


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel2
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.4
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 1.2.4.2.b
    text: |-
      buiten de perioden, bedoeld onder a, indien niet meer dan 25 kilogram consumentenvuurwerk voorhanden is op een
      plaats die niet voor het publiek toegankelijk is;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.4
  - number: 1.2.4.2.c
    text: |-
      tijdens het tot ontbranding brengen van professioneel vuurwerk of pyrotechnische artikelen voor theatergebruik
      overeenkomstig [artikel 3B.1][ref1], alsmede gedurende ten hoogste zestien uur daaraan voorafgaand, met dien
      verstande dat niet meer vuurwerk of pyrotechnische artikelen voor theatergebruik voorhanden zijn dan redelijkerwijs
      tot ontbranding zullen worden gebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3B
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.4
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 3B
        hoofdstuk: 3b
  - number: 1.2.4.2.d
    text: |-
      gedurende ten hoogste 12 uur nadat is of zou worden aangevangen met het tot ontbranding van professioneel
      vuurwerk of pyrotechnische artikelen voor theatergebruik overeenkomstig [artikel 3B.1][ref1] en het vuurwerk of de
      pyrotechnische artikelen voor theatergebruik voorhanden zijn op een plaats die niet voor het publiek toegankelijk
      is en op een zodanige wijze dat geen gevaar voor personen is te duchten, met dien verstande dat niet meer vuurwerk
      of pyrotechnische artikelen voor theatergebruik voorhanden zijn dan redelijkerwijs tot ontbranding zouden worden
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3B
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.4
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 3B
        hoofdstuk: 3b
  - number: 1.2.4.3
    text: |-
      Gedeputeerde staten van de provincie waarin het professioneel vuurwerk of de pyrotechnische artikelen voor
      theatergebruik tot ontbranding zullen worden gebracht kunnen bij de ontbrandingstoestemming in plaats van de
      tijdsduur, genoemd in het tweede lid, onder c, een andere tijdsduur vaststellen.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.4
  - number: 1.2.4.4
    text: |-
      Het eerste lid is tevens niet van toepassing indien het vuurwerk of de pyrotechnische artikelen voor theatergebruik
      worden vervoerd overeenkomstig de eisen gesteld bij of krachtens de [Wet vervoer gevaarlijke stoffen][ref1] en met
      inachtneming van [artikel 1.2.5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007606
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel1
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.4
    references:
      - id: ref1
        bwb_id: BWBR0007606
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 1.2.5.1
    text: |-
      Het is verboden handelingen als bedoeld in
      [artikel 2, eerste lid, onder c, d en e, van de Wet vervoer gevaarlijke stoffen][ref1] te verrichten, voor zover
      het betreft handelingen met vuurwerk of pyrotechnische artikelen voor theatergebruik, anders dan:


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel2
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.5
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '2'
  - number: 1.2.5.1.a
    text: |-
      het laten staan en het laten liggen van een vervoermiddel waarin of waarop zich vuurwerk of pyrotechnische
      artikelen voor theatergebruik bevinden, in verband met:
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.5
  - number: 1.2.5.1.a.1°
    text: |-
      de toepassing van [artikel 1.2.4, tweede lid, onder c][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.5
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 1.2.5.1.a.2°
    text: een wettelijk voorschrift dat dat voorschrijft in verband met weersomstandigheden.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.5
  - number: 1.2.5.1.b
    text: |-
      het ononderbroken beladen van een vervoermiddel met vuurwerk of pyrotechnische artikelen voor theatergebruik en het
      ononderbroken lossen daaruit, of
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.5
  - number: 1.2.5.1.c
    text: |-
      het in inrichtingen als bedoeld in [artikel 1.1.4, eerste lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.5
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 1.2.5.1.c.1°
    text: |-
      laten staan en laten liggen van een vervoermiddel waarin of waarop zich vuurwerk of pyrotechnische artikelen voor
      theatergebruik bevinden,
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.5
  - number: 1.2.5.1.c.2°
    text: |-
      beladen van een vervoermiddel met vuurwerk of pyrotechnische artikelen voor theatergebruik en het lossen daaruit,
      of
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.5
  - number: 1.2.5.1.c.3°
    text: nederleggen tijdens het vervoer van vuurwerk of pyrotechnische artikelen voor theatergebruik.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.5
  - number: 1.2.5.2
    text: |-
      Het is verboden verpakt of onverpakt consumentenvuurwerk, anders dan voor eigen gebruik, in een hoeveelheid
      van meer dan 25 kilogram per vervoermiddel dan wel professioneel vuurwerk of pyrotechnische artikelen voor
      theatergebruik te vervoeren, tenzij degene die vervoert tijdens dat vervoer schriftelijk kan aantonen door
      middel van een inschrijvingsbewijs of een vrachtbrief als bedoeld in de [artikelen 20][ref1] onderscheidenlijk
      [29 van de Wet goederenvervoer over de weg][ref2], dan wel door middel van een cognossement als bedoeld in
      [boek 8 van het Burgerlijk Wetboek][ref3], dat de artikelen zijn bestemd voor een natuurlijk persoon of een
      rechtspersoon:


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0005443#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0005034
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.5
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0005443
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0005034
  - number: 1.2.5.2.a
    text: |-
      die ingevolge het bij of krachtens dit besluit bepaalde, dit vuurwerk of deze pyrotechnische artikelen voor
      theatergebruik mag opslaan,
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.5
  - number: 1.2.5.2.b
    text: |-
      die houder is van een vergunning als bedoeld in [artikel 3B.1, eerste lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3B
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.5
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 3B
        hoofdstuk: 3b
  - number: 1.2.5.2.c
    text: |-
      wiens gegevens, als het vuurwerk of pyrotechnische artikelen voor theatergebruik buiten het grondgebied van
      Nederland worden gebracht, zijn verstrekt bij de melding, bedoeld in [artikel 1.3.2, vierde lid, onder f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.5
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 1.2.6.1
    text: |-
      Het is een ieder verboden ander vuurwerk dan consumentenvuurwerk dat voldoet aan de bij dit besluit gestelde eisen
      of de ter uitwerking van dit besluit krachtens [artikel 9.2.2.1 van de Wet milieubeheer][ref1] gestelde regels met
      betrekking tot consumentenvuurwerk, aan te prijzen of aan te bevelen:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 1.2.6.1.a
    text: als consumentenvuurwerk, of
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.6
  - number: 1.2.6.1.b
    text: |-
      indien hij weet of redelijkerwijs moet vermoeden dat dit vuurwerk zal worden aangewend voor een ander gebruik
      dan waartoe het gelet op de samenstelling of eigenschappen of de bijbehorende gebruiksaanwijzing, kennelijk is
      geschikt.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.6
  - number: 1.2.6.2
    text: Het eerste lid is van overeenkomstige toepassing op pyrotechnische artikelen voor theatergebruik.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.6
  - number: 1.2.7
    text: |-
      Het is een ieder die anders dan beroepshalve vuurwerk of pyrotechnische artikelen voor theatergebruik tot
      ontbranding brengt, verboden handelingen te verrichten of na te laten waarvan hij weet of redelijkerwijs had kunnen
      vermoeden dat daardoor gevaren kunnen optreden voor mens of milieu.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.2.7
  - number: 1.3.1.1
    text: |-
      Degene die vuurwerk of pyrotechnische artikelen voor theatergebruik binnen het grondgebied van Nederland brengt,
      draagt ervoor zorg dat:
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.3.1
  - number: 1.3.1.1.a
    text: |-
      op de verpakking waarin het vuurwerk of de pyrotechnische artikelen voor theatergebruik zich tijdens het vervoer
      bevinden, is aangeduid de klasse waarin het vuurwerk of de pyrotechnische artikelen voor theatergebruik volgens
      bijlage A van het ADR zijn ingedeeld als vuurwerk, en de aanduiding van de klasse overeenstemt met de eigenschappen
      van dat verpakte vuurwerk,
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.3.1
  - number: 1.3.1.1.b
    text: |-
      het vuurwerk of pyrotechnische artikelen voor theatergebruik vergezeld gaan van een door of namens hem opgestelde
      schriftelijke verklaring waarin per transportverpakking is aangeduid volgens welke klasse het vuurwerk of
      pyrotechnische artikelen voor theatergebruik ingevolge onderdeel a zijn ingedeeld en waarin hij verklaart dat de
      aanduiding van die klasse overeenstemt met de eigenschappen van de verpakte artikelen.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.3.1
  - number: 1.3.1.1.c
    text: |-
      aan degene aan wie hij het vuurwerk of pyrotechnische artikelen voor theatergebruik na het binnen het grondgebied
      van Nederland te hebben gebracht ter beschikking stelt, een schriftelijke verklaring als bedoeld onder b wordt
      afgegeven.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.3.1
  - number: 1.3.1.2
    text: |-
      Degene die het vuurwerk of pyrotechnische artikelen voor theatergebruik opslaat draagt ervoor zorg dat op artikelen
      die verpakt worden opgeslagen de aanduiding van de klasse waarin de artikelen volgens bijlage A van het ADR zijn
      ingedeeld als vuurwerk aanwezig is en blijft en dat hij in het bezit is van de schriftelijke verklaring, bedoeld in
      het eerste lid, onder b.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.3.1
  - number: 1.3.1.3
    text: |-
      Het eerste lid, onder c , is niet van toepassing op vuurwerk of pyrotechnische artikelen voor theatergebruik
      waarvan op het moment dat deze artikelen binnen het grondgebied van Nederland worden gebracht, naar het oordeel van
      Onze Minister genoegzaam wordt aangetoond dat zij binnen 48 uur weer buiten het grondgebied van Nederland zullen
      worden gebracht. Indien sprake is van opslag als bedoeld in [artikel 1.1.4, derde lid][ref1], wordt in plaats van
      «48 uur» gelezen: twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.3.1
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 1.3.2.1
    text: |-
      Degene die vuurwerk of pyrotechnische artikelen voor theatergebruik binnen of buiten het grondgebied van Nederland
      brengt, meldt voorafgaand elektronisch het voornemen hiertoe bij Onze Minister. De melding wordt ten minste 48 uur
      voorafgaand aan het binnen of buiten Nederland brengen van de artikelen gedaan.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.3.2
  - number: 1.3.2.2
    text: |-
      In afwijking van het eerste lid is het degene die consumentenvuurwerk in de periode van 15 december tot 1 januari
      binnen of buiten het grondgebied van Nederland brengt, toegestaan het voornemen hiertoe ten minste 24 uur van te
      voren elektronisch bij Onze Minister te melden.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.3.2
  - number: 1.3.2.3
    text: |-
      In afwijking van het eerste lid is het binnen 24 uur nadat is of zou worden aangevangen met het tot
      ontbranding brengen van professioneel vuurwerk of pyrotechnische artikelen voor theatergebruik overeenkomstig
      [artikel 3B.1][ref1], toegestaan de resterende artikelen buiten het grondgebied van Nederland te brengen zonder
      voorafgaande melding, met dien verstande dat binnen een werkdag na het buiten het grondgebied van Nederland brengen
      van de artikelen, door degene die de artikelen buiten Nederland heeft gebracht een melding aan Onze Minister wordt
      gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3B
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.3.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 3B
        hoofdstuk: 3b
  - number: 1.3.2.4
    text: 'Bij de melding worden in ieder geval de volgende gegevens verstrekt:'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.3.2
  - number: 1.3.2.4.a
    text: |-
      de naam en het adres van degene die het vuurwerk of de pyrotechnische artikelen voor theatergebruik binnen of
      buiten het grondgebied van Nederland brengt;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.3.2
  - number: 1.3.2.4.b
    text: |-
      de voorziene plaats waar, de datum en het verwachte tijdstip, waarop het vuurwerk of pyrotechnische artikelen voor
      theatergebruik binnen of buiten het grondgebied van Nederland worden gebracht;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.3.2
  - number: 1.3.2.4.c
    text: |-
      of het consumenten- of professioneel vuurwerk dan wel pyrotechnische artikelen voor theatergebruik betreft, het
      door de fabrikant bij de vervaardiging toegekende artikelnummer dat dient ter identificatie van het artikel,
      de CE-markering, het type vuurwerk of pyrotechnische artikelen voor theatergebruik, de NEM, per artikelnummer
      de hoeveelheid verpakt vuurwerk of pyrotechnische artikelen voor theatergebruik in kilogrammen of het gewicht
      per verpakkingseenheid in kilogrammen en indien van toepassing het containernummer waarin het vuurwerk of de
      pyrotechnische artikelen voor theatergebruik zich bevinden;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.3.2
  - number: 1.3.2.4.d
    text: |-
      de voorziene datum waarop en de plaats waar het vuurwerk of de pyrotechnische artikelen voor theatergebruik worden
      gelost of overgeladen en, indien de artikelen aansluitend aan het binnen het grondgebied van Nederland brengen tot
      ontbranding worden gebracht, de plaats van die ontbranding;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.3.2
  - number: 1.3.2.4.e
    text: |-
      bij binnen het grondgebied van Nederland brengen het land van productie, de naam van de onderneming die het
      vuurwerk of de pyrotechnische artikelen voor theatergebruik geproduceerd heeft, de naam en het adres van degene bij
      wie de artikelen worden opgeslagen, en de naam en het adres van degene voor wie de artikelen zijn bestemd;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.3.2
  - number: 1.3.2.4.f
    text: |-
      bij buiten het grondgebied van Nederland brengen de naam en het adres van degene voor wie het vuurwerk of de
      pyrotechnische artikelen voor theatergebruik zijn bestemd, en het adres van degene bij wie de artikelen worden
      afgeleverd in het buitenland.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.3.2
  - number: 1.3.2.5
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de wijze waarop een melding langs
      elektronische weg wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.3.2
  - number: 1.3.2.6
    text: |-
      Afwijking van de gemelde gegevens wordt voorafgaand aan het binnen of buiten het grondgebied van Nederland brengen
      van vuurwerk of de pyrotechnische artikelen voor theatergebruik terstond aan Onze Minister gemeld.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.3.2
  - number: 1.3.2.7
    text: |-
      Voor de berekening van de periode van 48 uur, bedoeld in het eerste lid, worden uren die vallen op een dag, niet
      zijnde een werkdag, niet meegerekend.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.3.2
  - number: 1.4.1.1
    text: 'Degene die:'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.4.1
  - number: 1.4.1.1.a
    text: consumentenvuurwerk aan een groothandelaar ter beschikking stelt, of
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.4.1
  - number: 1.4.1.1.b
    text: professioneel vuurwerk of pyrotechnische artikelen voor theatergebruik aan een ander ter beschikking stelt,
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.4.1
  - number: 1.4.1.2
    text: |-
      In afwijking van het eerste lid is het degene die consumentenvuurwerk in de periode van 15 december tot 1 januari
      ter beschikking stelt toegestaan het voornemen hiertoe ten minste 24 uur van te voren elektronisch bij Onze
      Minister te melden.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.4.1
  - number: 1.4.1.3
    text: 'Bij de melding worden in ieder geval de volgende gegevens verstrekt:'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.4.1
  - number: 1.4.1.3.a
    text: de naam en het adres van degene die ter beschikking stelt,
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.4.1
  - number: 1.4.1.3.b
    text: de naam en het adres van degene aan wie ter beschikking wordt gesteld,
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.4.1
  - number: 1.4.1.3.c
    text: de datum waarop de artikelen ter beschikking worden gesteld, en de plaats waar deze worden opgeslagen, en
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.4.1
  - number: 1.4.1.3.d
    text: |-
      of het consumenten- of professioneel vuurwerk dan wel pyrotechnische artikelen voor theatergebruik betreft, het
      door de fabrikant bij de vervaardiging toegekende artikelnummer dat dient ter identificatie van het artikel,
      de CE-markering, het type vuurwerk of pyrotechnisch artikel voor theatergebruik, de NEM en per artikelnummer de
      hoeveelheid vuurwerk of pyrotechnische artikelen voor theatergebruik in kilogrammen.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.4.1
  - number: 1.4.1.4
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de wijze waarop een melding langs
      elektronische weg wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.4.1
  - number: 1.4.1.5
    text: |-
      Voor de berekening van de periode van 48 uur, bedoeld in het eerste lid, worden uren die vallen op een dag, niet
      zijnde een werkdag, niet meegerekend.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.4.1
  - number: 1.4.2.1
    text: |-
      Degene die vuurwerk of pyrotechnische artikelen voor theatergebruik vervaardigt, binnen het grondgebied van
      Nederland brengt, of voor handelsdoeleinden voorhanden heeft, registreert:
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.4.2
  - number: 1.4.2.1.a
    text: |-
      of het consumenten- of professioneel vuurwerk dan wel pyrotechnische artikelen voor theatergebruik betreft, en het
      door de fabrikant bij de vervaardiging toegekende artikelnummer dat dient ter identificatie van het artikel;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.4.2
  - number: 1.4.2.1.b
    text: |-
      de hoeveelheid verpakt vuurwerk of pyrotechnische artikelen voor theatergebruik in kilogrammen die per afnemer ter
      beschikking is gesteld.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.4.2
  - number: 1.4.2.2
    text: |-
      [Artikel 3, eerste en derde lid, van het Administratiebesluit milieugevaarlijke stoffen en preparaten][ref1] is van
      overeenkomstige toepassing op de gegevens, bedoeld in het eerste lid, onder a en b.


      [ref1]: https://wetten.overheid.nl/BWBR0004321#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.4.2
    references:
      - id: ref1
        bwb_id: BWBR0004321
        artikel: '3'
  - number: 1.4.2.3
    text: |-
      Het eerste lid, aanhef en onder b, is niet van toepassing op degene die bedrijfsmatig consumentenvuurwerk ter
      beschikking stelt aan particulieren.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.4.2
  - number: 1.4.3.1
    text: |-
      Degene die een inrichting drijft als bedoeld in [artikel 1.1.4][ref1], [2.2.1][ref2], [3.2.1][ref3] of
      [3A.2.1][ref4] draagt er zorg voor dat burgemeester en wethouders en de burgemeester van de gemeente waarin de
      inrichting is gelegen, en het bestuur van de regionale brandweer, bij de toegang tot de inrichting direct toegang
      hebben tot in ieder geval de volgende actuele gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0013360#Artikel3A
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.4.3
