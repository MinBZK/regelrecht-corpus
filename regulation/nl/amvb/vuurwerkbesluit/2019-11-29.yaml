  - number: 1.4.3.1.a
    text: |-
      de classificatie van het vuurwerk of de pyrotechnische artikelen voor theatergebruik volgens het ADR en
      de opgeslagen hoeveelheid verpakt en onverpakt vuurwerk of pyrotechnische artikelen voor theatergebruik in
      kilogrammen;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.4.3
  - number: 1.4.3.1.b
    text: informatie over de mate waarin de opgeslagen artikelen gevoelig zijn voor blusmiddelen;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.4.3
  - number: 1.4.3.1.c
    text: de plaats waar de artikelen binnen de inrichting zijn opgeslagen.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.4.3
  - number: 1.4.3.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van degene die in een inrichting professioneel
      vuurwerk of pyrotechnische artikelen voor theatergebruik voorhanden heeft die zijn aangewezen ingevolge
      [artikel 1.1.1, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.4.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 1.4.4.1
    text: |-
      Degene die een inrichting drijft als bedoeld in [artikel 2.2.1, eerste lid][ref1], draagt er zorg voor dat op 1
      februari van elk jaar binnen de inrichting een overzicht aanwezig is van:


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.4.4
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 1.4.4.1.a
    text: de hoeveelheid ingekocht consumentenvuurwerk in de voorgaande 12 maanden;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.4.4
  - number: 1.4.4.1.b
    text: de hoeveelheid verkocht consumentenvuurwerk in de voorgaande 12 maanden;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.4.4
  - number: 1.4.4.1.c
    text: de hoeveelheid afgevoerd consumentenvuurwerk in de voorgaande 12 maanden;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.4.4
  - number: 1.4.4.1.d
    text: de hoeveelheid opgeslagen consumentenvuurwerk.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.4.4
  - number: 1.4.4.2
    text: De hoeveelheid, bedoeld in het eerste lid, wordt uitgedrukt in kilogrammen onverpakt vuurwerk.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1.4.4
  - number: 1A.1.1.1
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder: - *aangemelde instanties:* aangemelde
      instanties als bedoeld in artikel 21 van de EU-richtlijn pyrotechnische artikelen;
        - *aangewezen instantie:* een instantie, aangewezen door Onze Minister, die conformiteitsbeoordelingsactiviteiten
      verricht, zoals onder meer het ijken, testen, certificeren en inspecteren;
        - *accreditatie:* accreditatie zoals gedefinieerd in artikel 2, tiende lid, van de Verordening;
        - *bevoegde autoriteit:* Onze Minister;
        - *bijlage I bij de EU-richtlijn:* bijlage I bij de EU-richtlijn pyrotechnische artikelen, naar de tekst zoals deze
      bij die richtlijn is vastgesteld;
        - *bijlage II bij de EU-richtlijn:* bijlage II bij de EU-richtlijn pyrotechnische artikelen, naar de tekst zoals
      deze bij die richtlijn is vastgesteld, voor zover het betreft de in het tweede lid genoemde onderdelen van de
      bijlage, en bijlage II bij de EU-richtlijn pyrotechnische artikelen voor de overige onderdelen van de bijlage;
        - *conformiteitsbeoordeling:* proces waarin wordt beoordeeld of voldaan is aan de essentiële veiligheidseisen;
        - *conformiteitsbeoordelingsprocedure:* procedure als bedoeld in bijlage II bij de EU-richtlijn;
        - *essentiële veiligheidseisen:* essentiële veiligheidseisen als bedoeld in bijlage I bij de EU-richtlijn;
        - *EU-conformiteitsverklaring:* verklaring dat een product voldoet aan de eisen van de EU-richtlijn pyrotechnische
      artikelen als bedoeld in artikel 18, eerste tot en met derde lid, van die richtlijn;
        - *geharmoniseerde norm:* geharmoniseerde norm als bedoeld in artikel 2, eerste lid, onder c, van Verordening (EU)
      nr. 1025/2012 van het Europees Parlement en de Raad van 25 oktober 2012 betreffende Europese normalisatie, tot
      wijziging van de richtlijnen 89/686/EEG en 93/15/EEG van de Raad alsmede de richtlijnen 94/9/EG, 94/25/EG, 95/16/
      EG, 97/23/EG, 98/34/EG, 2004/22/EG, 2007/23/EG, 2009/23/EG en 2009/105/EG van het Europees Parlement en de Raad
      en tot intrekking van beschikking 87/95/EEG van de raad en besluit nr. 1673/2006/EG van het Europees Parlement en
      de Raad;
        - *harmonisatiewetgeving van de Europese Unie:* alle wetgeving van de Europese Unie die de voorwaarden voor het
      verhandelen van producten harmoniseert;
        - *markttoezicht:* hetgeen daaronder in hoofdstuk 5 van de EU-richtlijn pyrotechnische artikelen wordt verstaan;
        - *markttoezichthouder:* de in artikel 5:10, eerste lid, van de Wet algemene bepalingen omgevingsrecht bedoelde
      ambtenaren, die handelen in het kader van het markttoezicht
        - *module B, C2, D, E, G en H:* module B, C2, D, E, G en H als bedoeld in bijlage II bij de EU-richtlijn
      pyrotechnische artikelen;
        - *nationale accreditatie-instantie:* nationale accreditatie-instantie zoals gedefinieerd in artikel 2, elfde lid,
      van de Verordening;
        - *technische specificatie:* document dat de technische vereisten voorschrijft waaraan vuurwerk of een
      pyrotechnisch artikel voor theatergebruik moet voldoen;
        - *terugroepen:* maatregel waarmee wordt beoogd vuurwerk of een pyrotechnisch artikel voor theatergebruik te doen
      terugkeren dat al aan de eindgebruiker ter beschikking is gesteld;
        - *uit de handel nemen:* maatregel waarmee wordt beoogd te voorkomen dat vuurwerk of een pyrotechnisch artikel voor
      theatergebruik dat zich in de toeleveringsketen bevindt, op de markt wordt aangeboden;
        - *Verordening:* Verordening (EG) nr. 765/2008 van het Europees parlement en de Raad van 9 juli 2008 tot
      vaststelling van de eisen inzake accreditatie en markttoezicht betreffende het verhandelen van producten en tot
      intrekking van Verordening (EEG) nr. 339/93;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.1.1
  - number: 1A.1.1.2
    text: |-
      De in het eerste lid, in de begripsomschrijving van bijlage II bij de EU-richtlijn, bedoelde onderdelen van die
      bijlage zijn:
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.1.1
  - number: 1A.1.1.2.a
    text: Module B, de onderdelen 7, tweede alinea, tot en met 9;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.1.1
  - number: 1A.1.1.2.b
    text: |-
      Module C2, de onderdelen 2 tot en met 4.2, voor zover het betreft het ter beschikking houden van de EU-
      conformiteitsverklaring;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.1.1
  - number: 1A.1.1.2.c
    text: Module D, de onderdelen 3.4, 3.5, 4.2 tot en met 4.4, 6 en 7;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.1.1
  - number: 1A.1.1.2.d
    text: Module E, de onderdelen 3.4, 3.5, 4.2 tot en met 4.4, 6 en 7;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.1.1
  - number: 1A.1.1.2.e
    text: Module H, de onderdelen 3.4, 3,5, 4.2 tot en met 4.4, 6 en 7.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.1.1
  - number: 1A.1.2.1
    text: |-
      Een wijziging van artikel 10 van de EU-richtlijn pyrotechnische artikelen, van bijlage II bij de EU-richtlijn
      pyrotechnische artikelen, met uitzondering van de onderdelen, genoemd in artikel 1A.1.1, tweede lid, en van
      bijlage III of IV bij de EU-richtlijn pyrotechnische artikelen gaat voor de toepassing van dit besluit en de daarop
      berustende bepalingen gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn of het betrokken
      wijzigingsbesluit uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt
      bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.1.2
  - number: 1A.1.2.2
    text: |-
      Onze Minister doet meteen na het van kracht worden van een wijziging als bedoeld in het eerste lid daarvan
      mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.1.2
  - number: 1A.1.3.1
    text: |-
      De fabrikant brengt het vuurwerk of het pyrotechnische artikel voor theatergebruik in een bepaalde categorie onder
      op grond van toepassing, doel en gevaar, met inbegrip van hun geluidniveau.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.1.3
  - number: 1A.1.3.2
    text: Een aangemelde instantie bevestigt de categorisering als onderdeel van de conformiteitsbeoordelingsprocedure.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.1.3
  - number: 1A.1.3.3
    text: 'De categorieën luiden als volgt:'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.1.3
  - number: 1A.1.3.3.a
    text: |-
      *vuurwerk* Categorie F1: vuurwerk dat zeer weinig gevaar en een te verwaarlozen geluidsniveau oplevert en bestemd
      is voor gebruik in een besloten ruimte, inclusief vuurwerk dat bestemd is voor gebruik binnenshuis; Categorie
      F2: vuurwerk dat weinig gevaar en een laag geluidsniveau oplevert en bestemd is voor gebruik buitenshuis in een
      afgebakende plaats; Categorie F3: vuurwerk dat middelmatig gevaar oplevert en bestemd is voor gebruik buitenshuis
      in een grote open ruimte, en waarvan het geluidsniveau niet schadelijk is voor de menselijke gezondheid; Categorie
      F4: vuurwerk dat veel gevaar oplevert en uitsluitend bestemd is voor gebruik door personen met gespecialiseerde
      kennis, en waarvan het geluidsniveau niet schadelijk is voor de menselijke gezondheid.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.1.3
  - number: 1A.1.3.3.b
    text: |-
      *pyrotechnische artikelen voor theatergebruik* Categorie T1: pyrotechnische artikelen voor podiumgebruik met gering
      gevaar; Categorie T2: pyrotechnische artikelen voor podiumgebruik die uitsluitend bestemd zijn om door personen met
      gespecialiseerde kennis te worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.1.3
  - number: 1A.1.4
    text: |-
      Vuurwerk of pyrotechnische artikelen voor theatergebruik die in overeenstemming zijn met geharmoniseerde normen of
      delen daarvan, waarvan de referentienummers in het Publicatieblad van de Europese Unie zijn bekendgemaakt, worden
      geacht in overeenstemming te zijn met de essentiële veiligheidseisen die door die normen of delen daarvan worden
      bestreken.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.1.4
  - number: 1A.2.1.1
    text: |-
      Het is verboden vuurwerk of pyrotechnische artikelen voor theatergebruik die niet voldoen aan de essentiële
      veiligheidseisen in de handel te brengen, voorhanden te hebben of aan een ander ter beschikking te stellen.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2.1
  - number: 1A.2.1.2
    text: |-
      Het is verboden vuurwerk of pyrotechnische artikelen voor theatergebruik die niet zijn onderworpen aan de
      conformiteitsbeoordelingsprocedure conform de [artikelen 1A.3.1][ref1] en [1A.3.2][ref2] in de handel te brengen,
      voorhanden te hebben of aan een ander ter beschikking te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel1A
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2.1
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 1A
        hoofdstuk: 1a
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: 1A
        hoofdstuk: 1a
        paragraaf: '3'
  - number: 1A.2.1.3
    text: |-
      Het is verboden vuurwerk of pyrotechnische artikelen voor theatergebruik in de handel te brengen, voorhanden te
      hebben, aan een ander ter beschikking te stellen of te gebruiken anders dan met inachtneming van de voorschriften
      gesteld bij of krachtens de[ artikelen 1A.4.1][ref1], [2.1.3][ref2], [3.1.1][ref3] en [3A.1.1][ref4] met betrekking
      tot de aanduiding en het bezigen van vermeldingen.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0013360#Artikel3A
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2.1
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 1A
        hoofdstuk: 1a
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0013360
        artikel: 3A
        hoofdstuk: 3a
        paragraaf: '1'
  - number: 1A.2.1.4
    text: |-
      Het is verboden vuurwerk of pyrotechnische artikelen voor theatergebruik in de handel te brengen zonder dat
      hiervoor, overeenkomstig [artikel 1A.4.2][ref1], een EU-conformiteitsverklaring is opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2.1
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 1A
        hoofdstuk: 1a
        paragraaf: '4'
  - number: 1A.2.1.5
    text: Het is voor fabrikanten verboden te handelen in strijd met bijlage II bij de EU-richtlijn.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2.1
  - number: 1A.2.2.1
    text: |-
      [Artikel 1A.2.1][ref1] is niet van toepassing op vuurwerk en pyrotechnische artikelen voor theatergebruik die
      niet in overeenstemming zijn met de bepalingen van EU-richtlijn pyrotechnische artikelen en die worden getoond en
      gebruikt op handelsbeurzen, tentoonstellingen en demonstraties voor het verhandelen van vuurwerk en pyrotechnische
      artikelen voor theatergebruik, mits is voldaan aan het bepaalde in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 1A
        hoofdstuk: 1a
        paragraaf: '2'
  - number: 1A.2.2.2
    text: |-
      Artikelen als bedoeld in het eerste lid mogen pas verkocht worden nadat ze in overeenstemming zijn gebracht met de
      bepalingen van de EU-richtlijn pyrotechnische artikelen.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2.2
  - number: 1A.2.2.3
    text: 'Op de artikelen, bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2.2
  - number: 1A.2.2.3.a
    text: |-
      wordt een zichtbaar teken aangebracht waaruit duidelijk de naam en de datum van de handelsbeurs, tentoonstelling of
      demonstratie blijken;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2.2
  - number: 1A.2.2.3.b
    text: |-
      is aangegeven dat de artikelen niet in overeenstemming zijn met de bepalingen van de EU-richtlijn pyrotechnische
      artikelen en niet verkocht mogen worden.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2.2
  - number: 1A.2.3.1
    text: |-
      [Artikel 1A.2.1][ref1] is niet van toepassing op vuurwerk en pyrotechnische artikelen voor theatergebruik die
      voor onderzoeks-, ontwikkelings- en testdoeleinden zijn geproduceerd en niet met de bepalingen van de EU-richtlijn
      pyrotechnische artikelen in overeenstemming zijn. Deze artikelen mogen vrij circuleren en worden gebruikt, mits is
      voldaan aan het bepaalde in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 1A
        hoofdstuk: 1a
        paragraaf: '2'
  - number: 1A.2.3.2
    text: |-
      Artikelen als bedoeld in het eerste lid mogen niet beschikbaar worden gesteld of worden gebruikt voor andere
      doeleinden dan voor ontwikkeling, tests en onderzoek.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2.3
  - number: 1A.2.3.3
    text: |-
      Op de artikelen, bedoeld in het eerste lid, wordt een zichtbaar teken aangebracht waaruit duidelijk blijkt dat ze
      niet in overeenstemming zijn met de bepalingen van de EU-richtlijn pyrotechnische artikelen en niet beschikbaar
      zijn voor andere doeleinden dan voor ontwikkeling, tests en onderzoek.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2.3
  - number: 1A.2A.1
    text: |-
      De fabrikant waarborgt dat vuurwerk en pyrotechnische artikelen voor theatergebruik worden ontworpen en vervaardigd
      overeenkomstig de essentiële veiligheidseisen.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2A.1
  - number: 1A.2A.2.1
    text: |-
      De fabrikant stelt de technische documentatie, genoemd in bijlage II bij de EU-richtlijn pyrotechnische
      artikelen op en laat de toepasselijke conformiteitsbeoordelingsprocedure uitvoeren, overeenkomstig de
      [artikelen 1A.3.1][ref1] en [1A.3.2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel1A
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2A.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 1A
        hoofdstuk: 1a
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: 1A
        hoofdstuk: 1a
        paragraaf: '3'
  - number: 1A.2A.2.2
    text: |-
      Wanneer met de conformiteitsbeoordelingsprocedure is aangetoond dat vuurwerk of een pyrotechnisch artikel voor
      theatergebruik aan de toepasselijke eisen voldoet, stelt de fabrikant een EU-conformiteitsverklaring op en brengt
      hij de CE-markering aan.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2A.2
  - number: 1A.2A.2.3
    text: |-
      De fabrikant bewaart de technische documentatie en de EU-conformiteitsverklaring gedurende tien jaar nadat het
      vuurwerk of pyrotechnische artikel voor theatergebruik in de handel is gebracht.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2A.2
  - number: 1A.2A.3
    text: |-
      De fabrikant zorgt ervoor dat hij beschikt over procedures om de conformiteit van zijn serieproductie met EU-
      richtlijn pyrotechnische artikelen te blijven waarborgen. Er wordt terdege rekening gehouden met veranderingen
      in het ontwerp of in de kenmerken van het vuurwerk of het pyrotechnische artikel voor theatergebruik
      en met veranderingen in de geharmoniseerde normen of andere technische specificaties waarnaar in de EU-
      conformiteitsverklaring van het vuurwerk of het pyrotechnische artikel voor theatergebruik wordt verwezen.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2A.3
  - number: 1A.2A.4.1
    text: |-
      Met een met redenen omkleed verzoek kan de bevoegde autoriteit een of meer van de volgende maatregelen van de
      fabrikant vergen:
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2A.4
  - number: 1A.2A.4.1.a
    text: |-
      het uitvoeren van steekproeven op in de handel gebracht vuurwerk of in de handel gebrachte pyrotechnische artikelen
      voor theatergebruik;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2A.4
  - number: 1A.2A.4.1.b
    text: het onderzoeken van klachten;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2A.4
  - number: 1A.2A.4.1.c
    text: het onderzoeken van niet-conform vuurwerk of niet-conforme pyrotechnische artikelen voor theatergebruik;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2A.4
  - number: 1A.2A.4.1.d
    text: het onderzoeken van teruggeroepen vuurwerk of pyrotechnische artikelen voor theatergebruik;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2A.4
  - number: 1A.2A.4.1.e
    text: het bijhouden van een register met betrekking tot de onder b, c, en d bedoelde onderzoeken;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2A.4
  - number: 1A.2A.4.1.f
    text: het op de hoogte houden van de distributeurs betreffende de genomen maatregelen.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2A.4
  - number: 1A.2A.4.2
    text: |-
      De bevoegde autoriteit kan het in het eerste lid bedoelde verzoek doen als dit gezien de risico’s van het vuurwerk
      of de pyrotechnische artikelen voor theatergebruik passend wordt geacht.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2A.4
  - number: 1A.2A.4.3
    text: |-
      De fabrikant voert de maatregelen uit met het oog op de bescherming van de gezondheid en veiligheid van de
      consumenten.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2A.4
  - number: 1A.2A.5
    text: |-
      De fabrikant zorgt ervoor dat door hem in de handel gebracht vuurwerk of pyrotechnisch artikelvoor theatergebruik
      is geëtiketteerd overeenkomstig de [artikelen 2.1.3][ref1], [3.1.1][ref2] of [3A.1.1][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel3A
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2A.5
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0013360
        artikel: 3A
        hoofdstuk: 3a
        paragraaf: '1'
  - number: 1A.2A.6
    text: |-
      Indien de fabrikant van mening is of redenen heeft om aan te nemen dat door hem in de handel gebracht vuurwerk
      of een door hem in de handel gebracht pyrotechnisch artikel voor theatergebruik niet in overeenstemming is met de
      eisen bij of krachtens dit besluit:
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2A.6
  - number: 1A.2A.6.a
    text: |-
      neemt hij onmiddellijk alle corrigerende maatregelen die nodig zijn om het vuurwerk of pyrotechnisch artikel
      voor theatergebruik in overeenstemming te brengen met deze eisen of, zo nodig, uit de handel te nemen of terug te
      roepen, en
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2A.6
  - number: 1A.2A.6.b
    text: |-
      brengt hij, indien het artikel een risico vertoont, de bevoegde autoriteiten van de lidstaten waar hij het artikel
      op de markt heeft aangeboden, hiervan onmiddellijk op de hoogte. Indien hij het artikel in Nederland op de markt
      heeft aangeboden, brengt hij de bevoegde autoriteit op de hoogte. Hierbij beschrijft hij in het bijzonder uitvoerig
      de niet-conformiteit en alle genomen corrigerende maatregelen.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2A.6
  - number: 1A.2A.7.1
    text: 'Op een met redenen omkleed verzoek van de bevoegde autoriteit of de bevoegde autoriteiten van andere lidstaten:'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2A.7
  - number: 1A.2A.7.1.a
    text: |-
      verstrekt de fabrikant aan deze autoriteit alle benodigde informatie en documentatie om de conformiteit van
      vuurwerk of pyrotechnische artikelen voor theatergebruik met de eisen gesteld bij of krachtens dit besluit aan te
      tonen, en
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2A.7
  - number: 1A.2A.7.1.b
    text: |-
      verleent de fabrikant medewerking aan alle genomen maatregelen om de risico’s van de door hem in de handel gebracht
      vuurwerk of door hem in de handel gebrachte pyrotechnische artikelen voor theatergebruik, uit te sluiten.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2A.7
  - number: 1A.2A.7.2
    text: |-
      De informatie en documentatie wordt op papier of elektronisch ter beschikking van de autoriteiten, bedoeld in het
      eerste lid, gesteld. Deze wordt gesteld in de Nederlandse of Engelse taal.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2A.7
  - number: 1A.2A.8
    text: |-
      Een importeur of een distributeur wordt als fabrikant beschouwd en voldoet aan de verplichtingen overeenkomstig dit
      hoofdstuk, wanneer hij vuurwerk of een pyrotechnisch artikel voor theatergebruik onder zijn eigen naam of merknaam
      in de handel brengt, of reeds in de handel gebracht vuurwerk of een reeds in de handel gebracht pyrotechnisch
      artikel voor theatergebruik zodanig wijzigt dat de conformiteit met de essentiële veiligheidseisen in het geding
      komt.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2A.8
  - number: 1A.2B.1
    text: |-
      De importeur brengt alleen vuurwerk en pyrotechnische artikelen voor theatergebruik in de handel die aan de
      essentiële veiligheidseisen voldoen.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2B.1
  - number: 1A.2B.2
    text: 'Alvorens vuurwerk of een pyrotechnisch artikel voor theatergebruik in de handel wordt gebracht:'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2B.2
  - number: 1A.2B.2.a
    text: vergewist de importeur zich ervan dat de fabrikant de conformiteitsbeoordelingsprocedure heeft uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2B.2
  - number: 1A.2B.2.b
    text: zorgt de importeur ervoor dat de fabrikant de technische documentatie heeft opgesteld;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2B.2
  - number: 1A.2B.2.c
    text: |-
      zorgt de importeur ervoor dat het vuurwerk of pyrotechnisch artikel voor theatergebruik is voorzien van de CE-
      markering en vergezeld gaat van de voorgeschreven documenten; en
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2B.2
  - number: 1A.2B.2.d
    text: |-
      zorgt de importeur ervoor dat de fabrikant het vuurwerk of pyrotechnisch artikel voor theatergebruik heeft
      geëtiketteerd overeenkomstig de [artikelen 2.1.3][ref1], [3.1.1][ref2] of [3A.1.1][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel3A
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2B.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0013360
        artikel: 3A
        hoofdstuk: 3a
        paragraaf: '1'
  - number: 1A.2B.3
    text: |-
      De importeur die van mening is of redenen heeft om aan te nemen dat vuurwerk of een pyrotechnisch artikel voor
      theatergebruik niet in overeenstemming is met de essentiële veiligheidseisen:
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2B.3
  - number: 1A.2B.3.a
    text: |-
      brengt het vuurwerk of pyrotechnisch artikel voor theatergebruik niet in de handel alvorens het in overeenstemming
      is gemaakt met de essentiële veiligheidseisen, en
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2B.3
  - number: 1A.2B.3.b
    text: |-
      brengt de fabrikant en de markttoezichthouder op de hoogte, indien het vuurwerk of pyrotechnisch artikel voor
      theatergebruik een risico vertoont.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2B.3
  - number: 1A.2B.4
    text: |-
      De importeur voldoet aan de aan hem gestelde eisen ingevolge de [artikelen 2.1.3, eerste lid, onder d][ref1],
      [3.1.1, eerste lid, onder d][ref2], of [3A.1.1, eerste lid, onder d][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel3A
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2B.4
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0013360
        artikel: 3A
        hoofdstuk: 3a
        paragraaf: '1'
  - number: 1A.2B.5
    text: |-
      De importeur zorgt, gedurende de periode dat hij voor vuurwerk of pyrotechnische artikelen voor theatergebruik
      verantwoordelijk is, voor zodanige opslag- en vervoersomstandigheden ervan dat de conformiteit van het
      pyrotechnische artikel met de essentiële veiligheidseisen niet in het geding komt.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2B.5
  - number: 1A.2B.6.1
    text: |-
      Met een met redenen omkleed verzoek kan de bevoegde autoriteit een of meer van de volgende maatregelen van de
      importeur vergen:
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2B.6
  - number: 1A.2B.6.1.a
    text: |-
      het uitvoeren van steekproeven op in de handel gebracht vuurwerk of in de handel gebrachte pyrotechnische artikelen
      voor theatergebruik;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2B.6
  - number: 1A.2B.6.1.b
    text: het onderzoeken van klachten;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2B.6
  - number: 1A.2B.6.1.c
    text: het onderzoeken van niet-conform vuurwerk of niet-conforme pyrotechnische artikelen voor theatergebruik;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2B.6
  - number: 1A.2B.6.1.d
    text: het onderzoeken van teruggeroepen vuurwerk of pyrotechnische artikelen voor theatergebruik;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2B.6
  - number: 1A.2B.6.1.e
    text: het bijhouden van een register met betrekking tot de onder b, c, en d bedoelde onderzoeken;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2B.6
  - number: 1A.2B.6.1.f
    text: het op de hoogte houden van de distributeurs betreffende de genomen maatregelen.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2B.6
  - number: 1A.2B.6.2
    text: |-
      De bevoegde autoriteit kan het verzoek, bedoeld in het eerste lid, doen als dit gezien de risico’s van het vuurwerk
      of de pyrotechnische artikelen voor theatergebruik passend wordt geacht.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2B.6
  - number: 1A.2B.6.3
    text: |-
      De importeur voert de maatregelen uit met het oog op de bescherming van de gezondheid en veiligheid van de
      consumenten.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2B.6
  - number: 1A.2B.7
    text: |-
      Indien een importeur van mening is of redenen heeft om aan te nemen dat door hem in de handel gebracht vuurwerk
      of een door hem in de handel gebracht pyrotechnisch artikel voor theatergebruik, niet in overeenstemming is met de
      eisen gesteld bij of krachtens dit besluit:
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2B.7
  - number: 1A.2B.7.a
    text: |-
      neemt hij onmiddellijk alle corrigerende maatregelen die nodig zijn om dat vuurwerk of pyrotechnisch artikel voor
      theatergebruik in overeenstemming te maken met die eisen of zo nodig uit de handel te nemen of terug te roepen; en
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2B.7
  - number: 1A.2B.7.b
    text: |-
      brengt hij, indien het artikel een risico vertoont, de bevoegde autoriteiten van de lidstaten waar hij het artikel
      op de markt heeft aangeboden, hiervan onmiddellijk op de hoogte. Indien hij de artikelen in Nederland op de markt
      heeft aangeboden, brengt hij de bevoegde autoriteit onmiddellijk op de hoogte. Hierbij beschrijft de importeur in
      het bijzonder uitvoerig de niet-conformiteit en alle genomen corrigerende maatregelen.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2B.7
  - number: 1A.2B.8
    text: |-
      De importeur houdt gedurende tien jaar nadat het vuurwerk of pyrotechnisch artikel voor theatergebruik in de handel
      is gebracht, een kopie van de EU-conformiteitsverklaring ter beschikking van de markttoezichthouder en zorgt ervoor
      dat de technische documentatie op verzoek aan de markttoezichthouder kan worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2B.8
  - number: 1A.2B.9.1
    text: 'Op een met redenen omkleed verzoek van de bevoegde autoriteit of de bevoegde autoriteiten van andere lidstaten:'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2B.9
  - number: 1A.2B.9.1.a
    text: |-
      verstrekt de importeur alle benodigde informatie en documentatie om de conformiteit van vuurwerk of pyrotechnische
      artikelen voor theatergebruik met de eisen gesteld bij of krachtens dit besluit aan te tonen; en
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2B.9
  - number: 1A.2B.9.1.b
    text: |-
      verleent de importeur medewerking aan alle genomen maatregelen om de risico’s van door hem in de handel gebracht
      vuurwerk of door hem in de handel gebrachte pyrotechnische artikelen voor theatergebruik uit te sluiten.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2B.9
  - number: 1A.2B.9.2
    text: |-
      De informatie en documentatie wordt op papier of elektronisch ter beschikking van de autoriteiten, bedoeld in het
      eerste lid, gesteld. Deze worden gesteld in de Nederlandse of Engelse taal.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2B.9
  - number: 1A.2C.1
    text: |-
      De distributeur die vuurwerk of pyrotechnische artikelen voor theatergebruik op de markt aanbiedt, neemt de nodige
      zorgvuldigheid in acht ten aanzien van de eisen in dit besluit.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2C.1
  - number: 1A.2C.2
    text: |-
      Alvorens vuurwerk of pyrotechnische artikelen voor theatergebruik op de markt aan te bieden, controleert de
      distributeur of:
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2C.2
  - number: 1A.2C.2.a
    text: het artikel is voorzien van een CE-markering;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2C.2
  - number: 1A.2C.2.b
    text: |-
      het artikel vergezeld gaat van de voorgeschreven documenten en van instructies en informatie
      aangaande de veiligheid, overeenkomstig [artikel 2.1.3, eerste lid, onder j, en tweede lid][ref1],
      [artikel 3.1.1, eerste lid, onder i, en tweede lid][ref2], en
      [artikel 3A.1.1, eerste lid, onder i, en tweede lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel3A
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2C.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0013360
        artikel: 3A
        hoofdstuk: 3a
        paragraaf: '1'
  - number: 1A.2C.2.c
    text: |-
      de fabrikant en de importeur aan de verplichtingen ingevolge[ artikel 2.1.3][ref1], [3.1.1][ref2] en [3A.1.1][ref3]
      hebben voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel3A
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2C.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0013360
        artikel: 3A
        hoofdstuk: 3a
        paragraaf: '1'
  - number: 1A.2C.3
    text: |-
      De distributeur die van mening is of redenen heeft om aan te nemen dat vuurwerk of pyrotechnische artikelen voor
      theatergebruik niet in overeenstemming zijn met de essentiële veiligheidseisen:
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2C.3
  - number: 1A.2C.3.a
    text: |-
      biedt het vuurwerk of pyrotechnische artikel voor theatergebruik niet op de markt aan alvorens het in
      overeenstemming is gemaakt met de essentiële veiligheidseisen, en
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2C.3
  - number: 1A.2C.3.b
    text: |-
      brengt de fabrikant, de importeur en de markttoezichthouder hiervan op de hoogte, indien het vuurwerk of
      pyrotechnische artikel voor theatergebruik een risico vertoont.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2C.3
  - number: 1A.2C.4
    text: |-
      De distributeur zorgt gedurende de periode dat hij voor vuurwerk of pyrotechnische artikelen voor theatergebruik
      verantwoordelijk is, voor zodanige opslag- en vervoersomstandigheden ervan dat de conformiteit van het artikel met
      de essentiële veiligheidseisen niet in het gedrang komt.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2C.4
  - number: 1A.2C.5
    text: |-
      Indien een distributeur van mening is, of redenen heeft om aan te nemen, dat door hem op de markt aangeboden
      vuurwerk of pyrotechnisch artikel voor theatergebruik niet in overeenstemming is met de eisen gesteld bij of
      krachtens dit besluit:
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2C.5
  - number: 1A.2C.5.a
    text: |-
      ziet hij erop toe dat de nodige corrigerende maatregelen worden genomen om die artikelen in overeenstemming te
      maken of zo nodig uit de handel te nemen of terug te roepen; en
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2C.5
  - number: 1A.2C.5.b
    text: |-
      brengt hij, indien het artikel een risico vertoont, de bevoegde autoriteiten van de lidstaten waar hij het artikel
      op de markt heeft aangeboden hiervan onmiddellijk op de hoogte. Indien hij de artikelen in Nederland op de markt
      heeft aangeboden, brengt hij de bevoegde autoriteit op de hoogte. Hierbij beschrijft hij in het bijzonder uitvoerig
      de niet-conformiteit en alle genomen corrigerende maatregelen.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2C.5
  - number: 1A.2C.6.1
    text: 'Op een met redenen omkleed verzoek van de bevoegde autoriteit of bevoegde autoriteiten van andere lidstaten:'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2C.6
  - number: 1A.2C.6.1.a
    text: |-
      verstrekt de distributeur deze autoriteit alle benodigde informatie en documentatie om de conformiteit van vuurwerk
      of een pyrotechnisch artikel voor theatergebruik met de eisen gesteld bij of krachtens dit besluit aan te tonen; en
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2C.6
  - number: 1A.2C.6.1.b
    text: |-
      verleent de distributeur medewerking aan alle genomen maatregelen om de risico’s van de door hem in de handel
      gebrachte artikelen uit te sluiten.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2C.6
  - number: 1A.2C.6.2
    text: |-
      De informatie en documentatie, genoemd in het eerste lid, onder a, wordt op papier of elektronisch ter beschikking
      van de autoriteiten, genoemd in het eerste lid, gesteld.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2C.6
  - number: 1A.2D.1.1
    text: 'Op verzoek van de bevoegde autoriteit verstrekken de marktdeelnemers de volgende informatie:'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2D.1
  - number: 1A.2D.1.1.a
    text: welke marktdeelnemer vuurwerk of pyrotechnische artikelen voor theatergebruik aan hen heeft geleverd; en
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2D.1
  - number: 1A.2D.1.1.b
    text: aan welke marktdeelnemer zij vuurwerk of pyrotechnische artikelen voor theatergebruik hebben geleverd.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2D.1
  - number: 1A.2D.1.2
    text: |-
      De marktdeelnemers houden de informatie, genoemd in het eerste lid, ten minste tien jaar nadat het vuurwerk of het
      pyrotechnische artikel voor theatergebruik aan de marktdeelnemers is geleverd, dan wel nadat de marktdeelnemers
      het vuurwerk of het pyrotechnische artikel voor theatergebruik heeft geleverd, ter beschikking van de bevoegde
      autoriteit.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2D.1
  - number: 1A.2E.1.1
    text: |-
      De fabrikant etiketteert vuurwerk en pyrotechnische artikel voor theatergebruik met een registratienummer dat wordt
      toegekend door de aangemelde instantie.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2E.1
  - number: 1A.2E.1.2
    text: |-
      Vuurwerk en pyrotechnische artikelen worden voorzien van een etiket met een registratienummer dat, naast het
      registratienummer, bedoeld in het eerste lid, de volgende elementen bevat:
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2E.1
  - number: 1A.2E.1.2.a
    text: 'het viercijferige identificatienummer van de aangemelde instantie die het volgende heeft opgesteld:'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2E.1
  - number: 1A.2E.1.2.a.1°
    text: |-
      de verklaring van EU-typeonderzoek in overeenstemming met de conformiteitsbeoordelingsprocedure, bedoeld in
      [artikel 1A.3.2, onder a][ref1] (module B);


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2E.1
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 1A
        hoofdstuk: 1a
        paragraaf: '3'
  - number: 1A.2E.1.2.a.2°
    text: |-
      de verklaring van overeenstemming, overeenkomstig de conformiteitsbeoordelingsprocedure, bedoeld in
      [artikel 1A.3.2, onder b][ref1] (module G); of


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2E.1
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 1A
        hoofdstuk: 1a
        paragraaf: '3'
  - number: 1A.2E.1.2.a.3°
    text: |-
      de goedkeuring van het kwaliteitssysteem, in overeenkomst met de conformiteitsbeoordelingsprocedure, bedoeld in
      [artikel 1A.3.2, onder c][ref1] (module H).


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2E.1
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 1A
        hoofdstuk: 1a
        paragraaf: '3'
  - number: 1A.2E.1.2.b
    text: |-
      de afkorting in hoofdletters van de categorie van het vuurwerk of pyrotechnische artikel voor theatergebruik
      waarvoor de conformiteit is gecertificeerd:
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2E.1
  - number: 1A.2E.1.2.b.1°
    text: F1, F2, F3 of F4 voor vuurwerk uit de desbetreffende categorieën vuurwerk;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2E.1
  - number: 1A.2E.1.2.b.2°
    text: |-
      T1 of T2 voor pyrotechnische artikelen voor theatergebruik voor de desbetreffende categorieën pyrotechnische
      artikelen voor theatergebruik;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2E.1
  - number: 1A.2E.1.3
    text: |-
      De structuur van het registratienummer is «XXXX-YY-ZZZZ», waarbij XXXX verwijst naar het element, genoemd in het
      tweede lid, onder a, YY naar het element, genoemd in het tweede lid, onder b, en ZZZZ naar het element, genoemd in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2E.1
  - number: 1A.2E.2
    text: 'Fabrikanten en importeurs van vuurwerk en pyrotechnische artikelen voor theatergebruik:'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2E.2
  - number: 1A.2E.2.a
    text: |-
      houden een register bij met alle registratienummers van vuurwerk of pyrotechnische artikelen voor theatergebruik
      die zij hebben vervaardigd of ingevoerd, vergezeld van de handelsnaam, het algemene type en, indien van toepassing,
      het subtype, en de plaats van vervaardiging. Deze informatie wordt ten minste tien jaar nadat het artikel in de
      handel is gebracht bijgehouden;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2E.2
  - number: 1A.2E.2.b
    text: dragen het register over aan Onze Minister indien zij hun activiteiten staken;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2E.2
  - number: 1A.2E.2.c
    text: |-
      verstrekken de bevoegde autoriteit, de markttoezichthouder en bevoegde autoriteiten en markttoezichtautoriteiten
      van andere lidstaten, op hun met redenen omkleed verzoek, het register, genoemd onder a.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2E.2
  - number: 1A.2F.1.1
    text: |-
      Indien de marktdeelnemer van de markttoezichthouder verneemt dat vuurwerk of een pyrotechnisch artikel voor
      theatergebruik, dat weliswaar in overeenstemming is met de essentiële veiligheidseisen en overige bepalingen van
      dit Besluit, toch een risico vormt voor de gezondheid of veiligheid van personen of voor andere aspecten van de
      bescherming van algemene belangen:
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2F.1
  - number: 1A.2F.1.1.a
    text: |-
      neemt hij alle passende maatregelen om ervoor te zorgen dat dit vuurwerk of dit pyrotechnische artikel voor
      theatergebruik dat risico niet meer meebrengt wanneer zij in de handel worden gebracht, of
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2F.1
  - number: 1A.2F.1.1.b
    text: |-
      neemt hij, binnen een door de markttoezichthouder vast te stellen termijn, dit vuurwerk of dit pyrotechnische
      artikel voor theatergebruik uit de handel of roept hij deze terug.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2F.1
  - number: 1A.2F.1.2
    text: |-
      De marktdeelnemer zorgt ervoor dat door hem genomen corrigerende maatregelen worden toegepast op alle betrokken
      vuurwerk of pyrotechnische artikelen voor theatergebruik die hij in de Europese Unie op de markt heeft aangeboden.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.2F.1
  - number: 1A.3.1.1
    text: |-
      Vuurwerk en pyrotechnische artikelen voor theatergebruik worden onderworpen aan een
      conformiteitsbeoordelingsprocedure overeenkomstig bijlage II bij de EU-richtlijn pyrotechnische artikelen.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.3.1
  - number: 1A.3.1.2
    text: |-
      De fabrikant voldoet aan de verplichtingen die uit hoofde van bijlage II bij de EU-richtlijn pyrotechnische
      artikelen aan hem worden gesteld.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.3.1
  - number: 1A.3.1.3
    text: |-
      De aangewezen instantie voldoet aan de verplichtingen die uit hoofde van bijlage II bij de EU-richtlijn
      pyrotechnische artikelen aan haar worden gesteld.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.3.1
  - number: 1A.3.2
    text: |-
      De fabrikant kiest een van de navolgende conformiteitsbeoordelingsprocedures, volgens welke de door hem gekozen
      aangemelde instantie de conformiteitsbeoordelingsprocedure uitvoert:
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.3.2
  - number: 1A.3.2.a
    text: 'het EU-typeonderzoek (module B), en naar keuze van de fabrikant een van de volgende procedures:'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.3.2
  - number: 1A.3.2.a.1°
    text: |-
      conformiteit met het type op basis van interne productiecontrole plus productcontroles onder toezicht met
      willekeurige tussenpozen (module C2);
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.3.2
  - number: 1A.3.2.a.2°
    text: conformiteit met het type op basis van de kwaliteitsborging van het productieproces (module D); of
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.3.2
  - number: 1A.3.2.a.3°
    text: conformiteit met het type op basis van productkwaliteitsborging (module E);
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.3.2
  - number: 1A.3.2.b
    text: conformiteit op basis van eenheidskeuring (module G);
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.3.2
  - number: 1A.3.2.c
    text: conformiteit op basis van volledige kwaliteitsborging (module H), voor zover het gaat om vuurwerk van categorie F4.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.3.2
  - number: 1A.4.1.1
    text: |-
      De CE-markering wordt zichtbaar, leesbaar en onuitwisbaar op het vuurwerk of het pyrotechnische artikel voor
      theatergebruik aangebracht. Wanneer dit gezien de aard van het artikel niet mogelijk of niet gerechtvaardigd is,
      wordt de CE-markering aangebracht op de verpakking en in de begeleidende documenten.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.4.1
  - number: 1A.4.1.2
    text: |-
      De CE-markering wordt aangebracht voordat het vuurwerk of pyrotechnische artikel voor theatergebruik in de handel
      wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.4.1
  - number: 1A.4.1.3
    text: |-
      Indien de aangemelde instantie betrokken is geweest bij de productiecontrolefase, wordt de CE-markering gevolgd
      door het identificatienummer van die aangemelde instantie.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.4.1
  - number: 1A.4.1.4
    text: |-
      Het identificatienummer, bedoeld in het derde lid, wordt aangebracht door de aangemelde instantie zelf, dan wel
      overeenkomstig haar instructies door de fabrikant.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.4.1
  - number: 1A.4.2.1
    text: In de EU-conformiteitsverklaring wordt vermeld dat is aangetoond dat aan de essentiële veiligheidseisen is voldaan.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.4.2
  - number: 1A.4.2.2
    text: 'De EU-conformiteitsverklaring:'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.4.2
  - number: 1A.4.2.2.a
    text: komt qua structuur overeen met het model van bijlage III bij de EU-richtlijn pyrotechnische artikelen;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.4.2
  - number: 1A.4.2.2.b
    text: |-
      bevat de in de desbetreffende modules van bijlage II bij de EU-richtlijn pyrotechnische artikelen vermelde
      elementen;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.4.2
  - number: 1A.4.2.2.c
    text: wordt voortdurend bijgewerkt;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.4.2
  - number: 1A.4.2.2.d
    text: |-
      wordt vertaald in de taal of talen zoals gevraagd door de lidstaat waar het vuurwerk of het pyrotechnische artikel
      voor theatergebruik in de handel wordt gebracht of op de markt wordt aangeboden.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.4.2
  - number: 1A.4.2.3
    text: |-
      De EU-conformiteitsverklaring die betrekking heeft op vuurwerk of pyrotechnische artikelen voor theatergebruik die
      binnen het grondgebied van Nederland in de handel worden gebracht of op de markt worden aangeboden, is gesteld in
      de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.4.2
  - number: 1A.4.2.4
    text: |-
      Indien voor vuurwerk of pyrotechnische artikelen voor theatergebruik uit hoofde van meer dan één handeling van de
      Europese Unie een EU-conformiteitsverklaring vereist is, wordt één EU-conformiteitsverklaring met betrekking tot
      al die handelingen van de Europese Unie opgesteld. In die verklaring moet duidelijk worden aangegeven om welke
      handelingen van de Europese Unie het gaat, met vermelding van de publicatiereferenties ervan.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.4.2
  - number: 1A.4.2.5
    text: |-
      Door de EU-conformiteitsverklaring op te stellen neemt de fabrikant de verantwoordelijkheid voor de conformiteit
      van het vuurwerk of het pyrotechnische artikel voor theatergebruik met de eisen van de EU-richtlijn pyrotechnische
      artikelen op zich.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.4.2
  - number: 1A.5.1.1
    text: |-
      Onze Minister kan een instantie, die hiertoe een verzoek heeft ingediend overeenkomstig [artikel 1A.5.2][ref1],
      aanwijzen die bevoegd is tot het uitvoeren van de conformiteitsbeoordelingsprocedure. Onze Minister meldt de
      aangewezen instantie aan overeenkomstig artikel 21 van de EU-richtlijn pyrotechnische artikelen.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.1
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 1A
        hoofdstuk: 1a
        paragraaf: '5'
  - number: 1A.5.1.2
    text: |-
      De aangewezen instantie voldoet aan de eisen, genoemd in de [artikelen 1A.5.3 tot en met 1A.5.10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.1
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 1A
        hoofdstuk: 1a
        paragraaf: '5'
  - number: 1A.5.1.3
    text: |-
      Aan de aanwijzing kunnen voorschriften worden verbonden ter uitvoering van de eisen, genoemd in de
      [artikelen 1A.5.3 tot en met 1A.5.10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.1
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 1A
        hoofdstuk: 1a
        paragraaf: '5'
  - number: 1A.5.2.1
    text: |-
      Een instantie die wenst te worden aangewezen in de zin van [artikel 1A.5.1, eerste lid][ref1], dient een verzoek
      tot aanwijzing in bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 1A
        hoofdstuk: 1a
        paragraaf: '5'
  - number: 1A.5.2.2
    text: 'Het verzoek tot aanwijzing, genoemd in het eerste lid, gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.2
  - number: 1A.5.2.2.a
    text: |-
      een beschrijving van de conformiteitsbeoordelingsactiviteiten, de conformiteitbeoordelingsmodule(s), genoemd
      in bijlage II bij de EU-richtlijn pyrotechnische artikelen en het pyrotechnische artikel of de pyrotechnische
      artikelen waarvoor de instantie verklaart bekwaam te zijn, en
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.2
  - number: 1A.5.2.2.b
    text: |-
      het accreditatiecertificaat dat is afgegeven door een nationale accreditatie-instantie, waarin wordt verklaard dat
      de instantie voldoet aan de eisen, genoemd in de [artikelen 1A.5.3 tot en met 1A.5.10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 1A
        hoofdstuk: 1a
        paragraaf: '5'
  - number: 1A.5.3.1
    text: |-
      De aangewezen instantie is onafhankelijk van de door haar beoordeelde organisaties en het door haar beoordeeld
      vuurwerk of de door haar beoordeelde pyrotechnische artikelen voor theatergebruik.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.3
  - number: 1A.5.3.2
    text: |-
      De aangewezen instantie, haar hoogste leidinggevenden en het personeel dat de conformiteitsbeoordelingstaken
      verricht, zijn niet de ontwerper, fabrikant, leverancier, installateur, koper, eigenaar, gebruiker of onderhouder
      van het vuurwerk, de pyrotechnische artikelen voor theatergebruik, of explosieve stoffen, noch de vertegenwoordiger
      van een van die partijen. Dit belet echter niet het gebruik van pyrotechnische artikelen of explosieve stoffen die
      nodig zijn voor de activiteiten van de aangewezen instantie of het gebruik van vuurwerk of pyrotechnische artikelen
      voor theatergebruik voor persoonlijke doeleinden.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.3
  - number: 1A.5.3.3
    text: |-
      De aangewezen instantie, haar hoogste leidinggevenden en het personeel dat de conformiteitsbeoordelingstaken
      verricht, zijn niet rechtstreeks of als vertegenwoordiger van de betrokken partijen betrokken bij het ontwerpen,
      vervaardigen of bouwen, verhandelen, installeren, gebruiken of onderhouden van vuurwerk, pyrotechnische artikelen
      voor theatergebruik of explosieve stoffen. Zij oefenen geen activiteiten uit die hun onafhankelijke oordeel of hun
      integriteit met betrekking tot conformiteitsbeoordelingsactiviteiten waarvoor zij zijn aangewezen in het gedrang
      kunnen brengen. Dit geldt met name voor adviesdiensten.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.3
  - number: 1A.5.3.4
    text: |-
      De aangewezen instantie waarborgt dat activiteiten van haar dochterondernemingen of onderaannemers geen afbreuk
      doen aan de vertrouwelijkheid, objectiviteit of onpartijdigheid van de conformiteitsbeoordelingsactiviteiten die de
      aangewezen instantie verricht;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.3
  - number: 1A.5.4.1
    text: |-
      De aangewezen instantie en haar personeel voeren de conformiteitsbeoordelingsactiviteiten uit met de grootste mate
      van beroepsintegriteit en met de vereiste technische bekwaamheid op het specifieke gebied.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.4
  - number: 1A.5.4.2
    text: |-
      De aangewezen instantie en haar personeel zijn vrij van elke druk en beïnvloeding, met name van financiële aard,
      die hun oordeel of de resultaten van hun conformiteitsbeoordelingsactiviteiten kunnen beïnvloeden, met name van
      personen of groepen van personen die belang hebben bij de resultaten van deze activiteiten.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.4
  - number: 1A.5.5.1
    text: |-
      De aangewezen instantie is in staat alle conformiteitsbeoordelingstaken te verrichten die in bijlage II bij de EU-
      richtlijn pyrotechnische artikelen aan haar zijn toegewezen en waarvoor zij is aangewezen, ongeacht of deze taak
      door de aangewezen instantie zelf of namens haar en onder haar verantwoordelijkheid wordt verricht.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.5
  - number: 1A.5.5.2
    text: |-
      De aangewezen instantie beschikt te allen tijde, voor elke conformiteitsbeoordelingsprocedure en voor elk soort en
      elke categorie vuurwerk of pyrotechnische artikelen voor theatergebruik waarvoor zij is aangemeld over:
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.5
  - number: 1A.5.5.2.a
    text: |-
      benodigd personeel met technische kennis en voldoende passende ervaring om de conformiteitsbeoordelingstaken te
      verrichten;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.5
  - number: 1A.5.5.2.b
    text: |-
      beschrijvingen van de procedures voor de uitvoering van de conformiteitsbeoordeling, waarbij de transparantie en de
      mogelijkheid tot reproductie van deze procedures worden gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.5
  - number: 1A.5.5.2.c
    text: |-
      gepast beleid en geschikte procedures om een onderscheid te maken tussen taken die zij als aangewezen instantie
      verricht en andere activiteiten; en
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.5
  - number: 1A.5.5.2.d
    text: |-
      procedures voor de uitoefening van haar activiteiten die naar behoren rekening houden met de omvang van
      een onderneming, de sector waarin zij actief is, de structuur ervan, de relatieve complexiteit van de
      producttechnologie in kwestie en het massa- of seriële karakter van het productieproces.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.5
  - number: 1A.5.5.3
    text: |-
      Een aangewezen instantie beschikt over de noodzakelijke middelen om de technische en administratieve taken, die
      zijn verbonden met de conformiteitsbeoordelingsactiviteiten, op passende wijze uit te voeren en heeft toegang tot
      alle noodzakelijke apparatuur en faciliteiten.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.5
  - number: 1A.5.6
    text: |-
      Het personeel van de aangewezen instantie dat verantwoordelijk is voor de conformiteitsbeoordelingstaken beschikt
      over:
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.6
  - number: 1A.5.6.a
    text: |-
      een gedegen technische en beroepsopleiding die alle relevante conformiteitsbeoordelingsactiviteiten omvat waarvoor
      de instantie is aangewezen;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.6
  - number: 1A.5.6.b
    text: |-
      een voldoende kennis van de eisen inzake de beoordelingen die de aangewezen instantie verricht en voldoende
      bevoegdheden om deze beoordelingen uit te voeren;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.6
  - number: 1A.5.6.c
    text: |-
      voldoende kennis van en inzicht in de essentiële veiligheidseisen, de toepasselijke geharmoniseerde normen en de
      relevante bepalingen van de harmonisatiewetgeving van de Europese Unie en van het bij of krachtens dit besluit
      bepaalde; en
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.6
  - number: 1A.5.6.d
    text: |-
      de bekwaamheid om certificaten, dossiers en rapporten op te stellen die aantonen dat de beoordelingen zijn
      verricht.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.6
  - number: 1A.5.7.1
    text: |-
      De aangewezen instantie waarborgt haar onpartijdigheid en die van haar leidinggevenden en haar personeel dat de
      conformiteitsbeoordelingstaken verricht.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.7
  - number: 1A.5.7.2
    text: |-
      De beloning van leidinggevenden en personeel van de aangewezen instantie hangt niet af van het aantal uitgevoerde
      beoordelingen of van de resultaten daarvan;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.7
  - number: 1A.5.8
    text: De aangewezen instantie heeft een geldige aansprakelijkheidsverzekering.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.8
  - number: 1A.5.9.1
    text: |-
      Het personeel van een aangewezen instantie is gebonden aan het beroepsgeheim ten aanzien van alle informatie
      waarvan het kennisneemt bij de uitoefening van de taken van de aangewezen instantie uit hoofde van bijlage II bij
      de EU-richtlijn pyrotechnische artikelen of bij of krachtens dit besluit. De eigendomsrechten worden beschermd.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.9
  - number: 1A.5.9.2
    text: Het beroepsgeheim, genoemd in het eerste lid, geldt niet ten opzichte van de bevoegde autoriteit.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.9
  - number: 1A.5.10.1
    text: |-
      De aangewezen instantie neemt deel aan of zorgt ervoor dat haar personeel dat de conformiteitsbeoordelingstaken
      verricht, op de hoogte is van:
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.10
  - number: 1A.5.10.1.a
    text: de relevante normalisatieactiviteiten, en
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.10
  - number: 1A.5.10.1.b
    text: |-
      de activiteiten van de coördinatiegroep van aangemelde instantie die is opgericht uit hoofde van de desbetreffende
      harmonisatiewetgeving van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.10
  - number: 1A.5.10.2
    text: |-
      De aangewezen instantie hanteert de administratieve beslissingen en geproduceerde documenten van de
      coördinatiegroep, genoemd in het eerste lid, onder b, als algemene richtsnoeren.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.10
  - number: 1A.5.11
    text: |-
      Een conformiteitsbeoordelingsinstantie die aantoont dat zij voldoet aan de criteria in de ter zaken doende
      geharmoniseerde normen of delen ervan, waarvan de referentienummers in het Publicatieblad van de Europese Unie
      zijn bekendgemaakt, wordt geacht aan de eisen, genoemd in [artikel 1A.5.3 tot en met 1A.5.10][ref1], te voldoen, op
      voorwaarde dat de van toepassing zijnde geharmoniseerde normen de eisen dekken.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.11
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 1A
        hoofdstuk: 1a
        paragraaf: '5'
  - number: 1A.5.12.1
    text: |-
      Indien de aangewezen instantie specifieke taken in verband met de conformiteitsbeoordeling uitbesteedt of door een
      dochteronderneming laat uitvoeren:
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.12
  - number: 1A.5.12.1.a
    text: |-
      waarborgt zij dat de onderaannemer of dochteronderneming aan de eisen, genoemd in
      [artikel 1A.5.3 tot en met 1A.5.10][ref1], voldoet;


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.12
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 1A
        hoofdstuk: 1a
        paragraaf: '5'
  - number: 1A.5.12.1.b
    text: brengt zij Onze Minister hiervan op de hoogte;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.12
  - number: 1A.5.12.1.c
    text: |-
      neemt zij de volledige verantwoordelijkheid op zich voor de taken die onderaannemers of dochterondernemingen
      verrichten, ongeacht waar deze gevestigd zijn;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.12
  - number: 1A.5.12.1.d
    text: |-
      houdt zij de relevante documenten over de beoordeling van de kwalificaties van de onderaannemer of
      dochteronderneming en over de door de onderaannemer of dochteronderneming uit hoofde van bijlage II bij de EU-
      richtlijn pyrotechnische artikelen uitgevoerde werkzaamheden ter beschikking van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.12
  - number: 1A.5.12.2
    text: |-
      Activiteiten mogen uitsluitend met instemming van de klant worden uitbesteed of door een dochteronderneming worden
      uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.12
  - number: 1A.5.13.1
    text: |-
      De aangewezen instantie voert conformiteitsbeoordelingen uit. Zij voldoet aan de eisen die in bijlage II bij de EU-
      richtlijn pyrotechnische artikelen aan haar worden gesteld.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.13
  - number: 1A.5.13.2
    text: |-
      De aangewezen instantie is bij uitvoering van de conformiteitsbeoordelingen, genoemd in het eerste lid, in elk
      geval bevoegd tot het nemen van de volgende besluiten:
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.13
  - number: 1A.5.13.2.a
    text: |-
      beslissen omtrent afgifte van een verklaring van EU-typeonderzoek in het kader van de toepassing van module B, als
      bedoeld in bijlage II bij de EU-richtlijn pyrotechnische artikelen, onder 6;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.13
  - number: 1A.5.13.2.b
    text: |-
      beslissen omtrent afgifte van een aanvullende goedkeuring in het kader van de toepassing van module B, als bedoeld
      in bijlage II bij de EU-richtlijn pyrotechnische artikelen, onder 7;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.13
  - number: 1A.5.13.2.c
    text: |-
      beslissen omtrent beoordelen of opnieuw beoordelen van het kwaliteitssysteem in het kader van de toepassing van
      module D, als bedoeld in bijlage II bij de EU-richtlijn pyrotechnische artikelen, onder 3.3 en 3.5.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.13
  - number: 1A.5.13.3
    text: |-
      De aangewezen instantie voert de conformiteitbeoordelingen op evenredige wijze uit, waarbij zij voorkomt dat de
      marktdeelnemers onnodig worden belast. De aangewezen instantie houdt hierbij naar behoren rekening met de volgende
      aspecten, waarbij zij de striktheid en het beschermingsniveau eerbiedigt die nodig zijn opdat het vuurwerk of het
      pyrotechnische artikel voor theatergebruik voldoet aan de essentiële veiligheidseisen:
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.13
  - number: 1A.5.13.3.a
    text: de omvang van de onderneming;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.13
  - number: 1A.5.13.3.b
    text: de sector waarin zij actief is;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.13
  - number: 1A.5.13.3.c
    text: de structuur van de onderneming;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.13
  - number: 1A.5.13.3.d
    text: de relatieve technologische complexiteit van de producten; en
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.13
  - number: 1A.5.13.3.e
    text: het massa- of seriële karakter van het productieproces.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.13
  - number: 1A.5.14.1
    text: |-
      De aangewezen instantie kent registratienummers toe ter identificatie van het vuurwerk of de pyrotechnische
      artikelen voor theatergebruik die aan een conformiteitsbeoordeling zijn onderworpen en ter identificatie van de
      fabrikanten van deze artikelen.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.14
  - number: 1A.5.14.2
    text: |-
      De aangewezen instantie houdt een register bij van de registratienummers van vuurwerk en pyrotechnische artikelen
      voor theatergebruik waarvoor zij conformiteitcertificaten heeft afgegeven.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.14
  - number: 1A.5.14.3
    text: |-
      Bij het bijhouden van het register gebruikt de aangewezen instantie het model en het formaat daarvan dat is
      vastgelegd in [bijlage 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013360
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.14
    references:
      - id: ref1
        bwb_id: BWBR0013360
  - number: 1A.5.14.4
    text: |-
      Het register moet ten minste de in [bijlage 4][ref1] vermelde informatie over producten bevatten. Deze
      informatie wordt gedurende tien jaar bewaard na de datum waarop de aangemelde instantie de documenten, bedoeld in
      [artikel 1A.5.13][ref2], heeft afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0013360
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel1A
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.14
    references:
      - id: ref1
        bwb_id: BWBR0013360
      - id: ref2
        bwb_id: BWBR0013360
        artikel: 1A
        hoofdstuk: 1a
        paragraaf: '5'
  - number: 1A.5.14.5
    text: De aangewezen instantie werkt het register regelmatig bij. Zij maken het register bekend via internet.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.14
  - number: 1A.5.14.6
    text: |-
      Wanneer de aanmelding van een conformiteitsbeoordelingsinstantie wordt ingetrokken, draagt deze instantie de
      registers onverwijld over aan een andere aangemelde instantie of aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.14
  - number: 1A.5.15
    text: |-
      De aangewezen instantie verleent geen conformiteitscertificaat indien zij vaststelt dat een fabrikant niet heeft
      voldaan aan de essentiële veiligheidseisen of aan de overeenkomstige geharmoniseerde normen of andere technische
      specificaties. Zij verlangt dat de fabrikant de passende corrigerende maatregelen neemt.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.15
  - number: 1A.5.16.1
    text: |-
      De aangewezen instantie verlangt dat de fabrikant passende corrigerende maatregelen neemt, indien zij bij het
      toezicht op de conformiteit na verlening van een certificaat vaststelt dat vuurwerk of het pyrotechnische artikelen
      voor theatergebruik niet meer in overeenstemming is met de essentiële veiligheidseisen, de overeenkomstige
      geharmoniseerde normen of andere technische specificaties. Zo nodig schorst zij het certificaat of trekt zij dit
      in.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.16
  - number: 1A.5.16.2
    text: |-
      Indien geen corrigerende maatregelen als bedoeld in het eerste lid worden genomen, worden de certificaten
      naargelang het geval door de aangewezen instantie geschorst, beperkt of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.16
  - number: 1A.5.17
    text: |-
      De aangewezen instantie neemt rechtstreeks of via aangestelde vertegenwoordigers deel aan de werkzaamheden van het
      forum van aangemelde instanties.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.17
  - number: 1A.5.18.1
    text: |-
      Onze Minister ziet toe op de rechtmatige en doeltreffende uitvoering van het bepaalde bij of krachtens dit besluit
      door de aangewezen instantie.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.18
  - number: 1A.5.18.2
    text: 'De aangewezen instantie brengt Onze Minister op de hoogte van:'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.18
  - number: 1A.5.18.2.a
    text: elke weigering, beperking, schorsing of intrekking van certificaten;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.18
  - number: 1A.5.18.2.b
    text: omstandigheden die van invloed zijn op de werkingssfeer van of de voorwaarden voor de aanwijzing;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.18
  - number: 1A.5.18.2.c
    text: |-
      informatieverzoeken over conformiteitsbeoordelingsactiviteiten die zij van de markttoezichthouder of de
      marktautoriteiten uit andere lidstaten, ontvangen;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.18
  - number: 1A.5.18.3
    text: |-
      Op verzoek van Onze Minister brengt de aangewezen instantie Onze Minister op de hoogte van de binnen haar
      werkingssfeer verrichte conformiteitsbeoordelingsactiviteiten, waaronder grensoverschrijdende activiteiten en
      uitbestedingen.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.18
  - number: 1A.5.18.4
    text: |-
      De aangewezen instantie verstrekt relevante informatie over negatieve conformiteitsbeoordelingsresultaten en op
      verzoek over positieve conformiteitsbeoordelingsresultaten aan de andere aangemelde instanties die soortgelijke
      conformiteitsbeoordelingsactiviteiten voor dezelfde pyrotechnische artikelen verrichten.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.18
  - number: 1A.5.19
    text: |-
      De aangewezen instantie beschikt over een behoorlijke administratie waarin de gegevens die samenhangen met en
      betrekking hebben op de uitvoering van haar taken, op een systematische wijze zijn vastgelegd. Aan de hand van deze
      gegevens zijn de beoordeelde pyrotechnische artikelen afdoende te identificeren.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.19
  - number: 1A.5.20.1
    text: |-
      Indien is gebleken dat de aangewezen instantie niet langer voldoet aan de eisen, genoemd in
      [artikel 1A.5.3 tot en met 1A.5.10][ref1], of haar verplichtingen niet nakomt, kan Onze Minister de aanwijzing
      beperken, schorsen of intrekken, afhankelijk van de ernst van het niet-voldoen aan die eisen of het niet-nakomen
      van die verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.20
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 1A
        hoofdstuk: 1a
        paragraaf: '5'
  - number: 1A.5.20.2
    text: |-
      Onze Minister stelt de andere lidstaten van de Europese Unie en de Europese Commissie onverwijld op de hoogte van
      de maatregelen, genoemd in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.20
  - number: 1A.5.20.3
    text: |-
      Wanneer de aanwijzing wordt beperkt, geschorst, of ingetrokken, of de aangewezen instantie haar activiteiten heeft
      gestaakt:
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.20
  - number: 1A.5.20.3.a
    text: |-
      stelt deze instantie, ook nadat de aanwijzing is beperkt, geschorst of ingetrokken, de dossiers op verzoek van Onze
      Minister, ter beschikking aan Onze Minister en de markttoezichthouder, of
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.20
  - number: 1A.5.20.3.b
    text: draagt deze instantie de dossiers over aan een andere aangemelde instantie.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel1A.5.20
  - number: 2.1.1
    text: |-
      Bij regeling van Onze Minister wordt vuurwerk aangewezen dat ter beschikking mag worden gesteld voor particulier
      gebruik. De aanwijzing geschiedt aan de hand van de aard, samenstelling, constructie en eigenschappen van het
      vuurwerk.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.1.1
  - number: 2.1.2.1
    text: |-
      Verpakt consumentenvuurwerk is bij het opslaan en het voorhanden hebben anders dan door particulieren, op zodanige
      wijze verpakt dat het volgens bijlage A van het ADR, uitsluitend kan worden aangemerkt als vuurwerk behorende tot
      klasse 1.4G of 1.4S.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.1.2
  - number: 2.1.2.2
    text: |-
      Dit artikel is niet van toepassing op vuurwerk waarvan op het moment dat het binnen het grondgebied van
      Nederland wordt gebracht, naar het oordeel van Onze Minister genoegzaam wordt aangetoond dat het binnen 48
      uur weer buiten het grondgebied van Nederland zal worden gebracht. Indien sprake is van opslag als bedoeld in
      [artikel 1.1.4, derde lid][ref1], wordt in plaats van «48 uur» gelezen: twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.1.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 2.1.3.1
    text: 'Consumentenvuurwerk is voorzien van:'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.1.3
  - number: 2.1.3.1.a
    text: 'de aanduiding: Geschikt voor particulier gebruik;'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.1.3
  - number: 2.1.3.1.b
    text: |-
      een vermelding of afbeelding van de soort van het vuurwerk waaruit duidelijk blijkt wat de te verwachten effecten
      tijdens het functioneren zijn;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.1.3
  - number: 2.1.3.1.c
    text: |-
      de naam, de geregistreerde handelsnaam of de geregistreerde merknaam van de fabrikant en één postadres waarop
      contact met hem kan worden opgenomen;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.1.3
  - number: 2.1.3.1.d
    text: |-
      indien de fabrikant niet is gevestigd op het grondgebied van de Europese Unie: de gegevens, genoemd onder c, en de
      naam, geregistreerde handelsnaam of geregistreerde merknaam van de importeur en het postadres waarop contact met
      hem kan worden opgenomen;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.1.3
  - number: 2.1.3.1.e
    text: |-
      indien de importeur niet in Nederland is gevestigd: de gegevens, genoemd onder c en d, en de handelsnaam of het
      handelsmerk en de naam en de plaats van vestiging van de distributeur;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.1.3
  - number: 2.1.3.1.f
    text: |-
      de naam en het type van het artikel, het door de fabrikant bij de vervaardiging toegekende artikelnummer dat
      dient ter identificatie van het vuurwerk en, voor zover het vuurwerk betreft dat is ingedeeld in categorie F3, het
      productiejaar van het vuurwerk, het registratienummer en het product-, partij- of serienummer van het product;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.1.3
  - number: 2.1.3.1.g
    text: |-
      de minimumleeftijd voor het verkopen of anderszins ter beschikking stellen van het consumentenvuurwerk, bedoeld
      in [artikel 2.3.5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.1.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.1.3.1.h
    text: |-
      de categorie, bedoeld in [artikel 1A.1.3][ref1], waartoe het consumentenvuurwerk behoort;


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.1.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 1A
        hoofdstuk: 1a
        paragraaf: '1'
  - number: 2.1.3.1.i
    text: de NEM;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.1.3
  - number: 2.1.3.1.j
    text: |-
      een gebruiksaanwijzing met zodanige aanwijzingen en waarschuwingen dat bij het dienovereenkomstig handelen geen
      letsel of schade bij de gebruiker en omstanders kan ontstaan.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.1.3
  - number: 2.1.3.2
    text: |-
      Consumentenvuurwerk is voorts voorzien van de volgende informatie: voor zover het betreft categorie F1: in
      voorkomend geval: «uitsluitend buitenshuis te gebruiken» en een minimale veiligheidsafstand; voor zover het betreft
      categorie F2: «uitsluitend buitenshuis te gebruiken» en, in voorkomend geval, een minimale veiligheidsafstand(en);
      voor zover het betreft categorie F3: «uitsluitend buitenshuis te gebruiken» en de minimale veiligheidsafstand(en).
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.1.3
  - number: 2.1.3.3
    text: |-
      Het eerste en tweede lid gelden niet voor consumentenvuurwerk van geringe afmeting, mits dat vuurwerk zich in een
      primaire verpakking bevindt waarop de in het eerste en tweede lid bedoelde gegevens zijn aangebracht. De gegevens,
      bedoeld in het eerste lid, onder c, d en e, worden, indien vermelding op het vuurwerk niet mogelijk is, vermeld op
      een bij het vuurwerk gevoegd document.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.1.3
  - number: 2.1.3.4
    text: |-
      De aanduiding en de gegevens, bedoeld in het eerste en tweede lid, zijn in de Nederlandse taal gesteld, zichtbaar,
      leesbaar, duidelijk, begrijpelijk en onuitwisbaar.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.1.3
  - number: 2.1.3.5
    text: |-
      In afwijking van het vierde lid worden de aanduiding en de gegevens, bedoeld in het eerste en tweede lid, op
      consumentenvuurwerk dat aan de consument zal worden aangeboden in een andere lidstaat van de Europese Unie gesteld
      in de officiële taal of talen van het desbetreffende land.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.1.3
  - number: 2.1.3.6
    text: |-
      Dit artikel is niet van toepassing op vuurwerk waarvan op het moment dat het binnen het grondgebied van
      Nederland wordt gebracht, naar het oordeel van Onze Minister genoegzaam wordt aangetoond dat het binnen 48
      uur weer buiten het grondgebied van Nederland zal worden gebracht. Indien sprake is van opslag als bedoeld in
      [artikel 1.1.4, derde lid][ref1], wordt in plaats van «48 uur» gelezen: twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.1.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 2.1.3.7
    text: |-
      Consumentenvuurwerk is voorts voorzien van de informatie waartoe met betrekking tot vuurwerk is besloten met
      toepassing van artikel 18, eerste lid, onder c, van de EG-richtlijn pyrotechnische artikelen. Indien de informatie,
      bedoeld in de eerste volzin, zou afwijken van het bepaalde in het eerste of tweede lid, blijft het in die leden
      bepaalde in zoverre buiten toepassing. Het derde tot en met zesde lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.1.3
  - number: 2.1.4
    text: |-
      Het is verboden vuurwerk dat niet voldoet aan de ter uitwerking van dit besluit krachtens
      [artikel 9.2.2.1 van de Wet milieubeheer][ref1] gestelde regels met betrekking tot consumentenvuurwerk, te voorzien
      van de aanduiding: Geschikt voor particulier gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.1.4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 2.2.1.1
    text: |-
      Degene die een inrichting drijft, waar consumentenvuurwerk wordt opgeslagen, herverpakt of bewerkt, voldoet
      aan de voorschriften die zijn opgenomen in [bijlage 1, onder A, B en C][ref1], en aan de veiligheidsafstanden
      die van toepassing zijn ingevolge [bijlage 3][ref2]. Degene die de inrichting drijft draagt er zorg voor dat de
      voorschriften worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0013360
      [ref2]: https://wetten.overheid.nl/BWBR0013360
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0013360
      - id: ref2
        bwb_id: BWBR0013360
  - number: 2.2.1.2
    text: |-
      Indien een inrichting tot een krachtens [artikel 1.1, derde lid, van de Wet milieubeheer][ref1] aangewezen
      categorie behoort, niet uitsluitend omdat daarin vuurwerk wordt opgeslagen, geldt een voor de inrichting verleende
      omgevingsvergunning ook voor het oprichten, in werking hebben of veranderen van de inrichting, dan wel het
      veranderen van de werking daarvan, voor zover dit oprichten, in werking hebben of veranderen dan wel veranderen van
      de werking betrekking heeft op het opslaan van vuurwerk.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 2.2.3.1
    text: |-
      Het bevoegd gezag kan maatwerkvoorschriften stellen met betrekking tot een in [bijlage 1][ref1], onder B,
      opgenomen voorschrift, voor zover dat bij het voorschrift is aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0013360
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
  - number: 2.2.3.2
    text: |-
      De maatwerkvoorschriften gelden voor een ieder die de inrichting drijft. Deze draagt er zorg voor dat de
      maatwerkvoorschriften worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.2.3
  - number: 2.2.3.3
    text: |-
      Het bevoegd gezag stelt het bestuur van de regionale brandweer binnen wiens gebied de inrichting geheel of in
      hoofdzaak is gelegen, in de gelegenheid advies uit te brengen over het ontwerp van de beschikking waarbij een
      maatwerkvoorschrift wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.2.3
  - number: 2.2.3.4
    text: Van de beschikking wordt mededeling gedaan door kennisgeving in één of meer dag-, nieuws- of huis-aan-huisbladen.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.2.3
  - number: 2.2.4.1
    text: |-
      Degene die een inrichting opricht waar ten hoogste 10.000 kilogram consumentenvuurwerk wordt opgeslagen, meldt dit
      ten minste vier weken voor de oprichting schriftelijk aan het bevoegd gezag. Het bevoegd gezag zendt onverwijld
      een afschrift van de melding aan Onze Minister en aan het bestuur van de regionale brandweer. De verzending van
      het afschrift aan Onze Minister geschiedt langs elektronische weg. Bij ministeriële regeling worden nadere regels
      gesteld met betrekking tot de wijze waarop het afschrift wordt verzonden.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.2.4
  - number: 2.2.4.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot het veranderen van een inrichting, als bedoeld
      in [artikel 2.2.1][ref1], en het veranderen van de werking daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.2.4
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.2.4.3
    text: 'Bij de meldingen worden vermeld:'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.2.4
  - number: 2.2.4.3.a
    text: het adres en het nummer waaronder de inrichting bij de Kamer van Koophandel is ingeschreven,
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.2.4
  - number: 2.2.4.3.b
    text: |-
      de naam en het adres van degene die de inrichting opricht dan wel verandert of de werking daarvan verandert, en,
      indien dit iemand anders is, van degene die de inrichting drijft of zal drijven,
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.2.4
  - number: 2.2.4.3.c
    text: |-
      de aard en omvang van de activiteiten en processen in de inrichting, waaronder de hoeveelheid consumentenvuurwerk
      in opslag, uitgedrukt in kilogrammen verpakt vuurwerk per (buffer)bewaarplaats,
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.2.4
  - number: 2.2.4.3.d
    text: |-
      de indeling en de uitvoering van de inrichting, waarbij de grenzen van het terrein van de inrichting, de ligging en
      de indeling van de gebouwen, en de functie van de te onderscheiden ruimten worden aangegeven,
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.2.4
  - number: 2.2.4.3.e
    text: |-
      een situatieschets met een schaal van ten minste 1:10.000 waarop de ligging van de inrichting ten opzichte van de
      omgeving is aangegeven en die is voorzien van een noordpijl, en
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.2.4
  - number: 2.2.4.3.f
    text: |-
      het tijdstip waarop de inrichting of de verandering daarvan in werking zal worden gebracht, dan wel de verandering
      van de werking daarvan verwezenlijkt zal zijn.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.2.4
  - number: 2.2.4.4
    text: |-
      De in het derde lid vermelde gegevens behoeven niet te worden verstrekt indien degene die de inrichting drijft,
      deze gegevens reeds aan het bevoegd gezag heeft verschaft en het bevoegd gezag geacht kan worden over die gegevens
      te beschikken.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.2.4
  - number: 2.2.4.5
    text: |-
      Degene die de melding doet, geeft in voorkomend geval bij de melding aan welke van de ingevolge dit artikel te
      verstrekken gegevens hij reeds aan het bevoegd gezag heeft verschaft.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.2.4
  - number: 2.2.5
    text: |-
      Het bevoegd gezag zendt een afschrift van een melding als bedoeld in [artikel 2.2.4, eerste lid][ref1],
      onderscheidenlijk een afschrift van een verleende omgevingsvergunning aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.2.5
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.3.1
    text: 'Het is verboden consumentenvuurwerk voor handelsdoeleinden ter beschikking te stellen aan een ander dan:'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.3.1
  - number: 2.3.1.a
    text: |-
      degene die een inrichting drijft als bedoeld in [artikel 2.2.1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.3.1
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.3.1.b
    text: |-
      een in het buitenland gevestigde ondernemer wiens bedrijfsmatige activiteit bestaat uit het verhandelen van
      vuurwerk en die gerechtigd is het vuurwerk op te slaan of te bewerken, dan wel, indien de betrokken persoon het
      vuurwerk tot ontbranding zal brengen, gerechtigd is het vuurwerk tot ontbranding te brengen.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.3.1
  - number: 2.3.2.1
    text: Het is verboden consumentenvuurwerk ter beschikking te stellen aan een particulier.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.3.2
  - number: 2.3.2.2
    text: |-
      Het verbod geldt niet op 29, 30 en 31 december met dien verstande dat als een van deze dagen een zondag is het
      verbod eveneens op die zondag geldt, in welk geval het verbod om vuurwerk ter beschikking te stellen dan niet geldt
      op 28 december.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.3.2
  - number: 2.3.3
    text: |-
      Het is verboden per levering meer dan 25 kilogram consumentenvuurwerk aan een particulier ter beschikking te
      stellen. Voor de bepaling van de hoeveelheid consumentenvuurwerk wordt uitgegaan van het gewicht van het vuurwerk
      als zijnde onverpakt.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.3.3
  - number: 2.3.4
    text: |-
      Het is verboden consumentenvuurwerk aan een particulier bedrijfsmatig ter beschikking te stellen op een andere
      plaats dan een verkoopruimte die voldoet aan de in [bijlage 1][ref1] gestelde voorschriften en de door het bevoegd
      gezag overeenkomstig [artikel 2.2.3][ref2] gestelde maatwerkvoorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0013360
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel2
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.3.4
    references:
      - id: ref1
        bwb_id: BWBR0013360
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.3.5
    text: |-
      Het is verboden consumentenvuurwerk te verkopen of anderszins ter beschikking te stellen aan particulieren jonger
      dan: 'Voor zover het betreft categorie F1: 12 jaar; Voor zover het betreft categorie F2: 16 jaar; Voor zover het'
      betreft categorie F3: 18 jaar.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.3.5
  - number: 2.3.5a
    text: |-
      Het is verboden consumentenvuurwerk te verkopen of anderszins ter beschikking te stellen aan een particulier zonder
      een veiligheidsbril en een aansteeklont te verstrekken en instructies te geven over het veilig tot ontbranding
      brengen van dit vuurwerk.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.3.5a
  - number: 2.3.6
    text: |-
      Het is verboden vuurwerk, anders dan bedrijfsmatig, tot ontbranding te brengen op een ander tijdstip dan tussen
      31 december 18.00 uur en 1 januari 02.00 uur van het daarop volgende jaar.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.3.6
  - number: 2.3.7
    text: |-
      De [artikelen 1.2.4][ref1], [1.2.5][ref2], [2.3.2][ref3], [2.3.3][ref4], [2.3.5a][ref5] en [2.3.6][ref6] gelden
      niet ten aanzien van fop- en schertsvuurwerk.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref6]: https://wetten.overheid.nl/BWBR0013360#Artikel2
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel2.3.7
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref6
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 3.1.1.1
    text: 'Professioneel vuurwerk is voorzien van:'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3.1.1
  - number: 3.1.1.1.a
    text: 'de aanduiding: Niet geschikt voor particulier gebruik;'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3.1.1
  - number: 3.1.1.1.b
    text: |-
      een vermelding of afbeelding van de soort van het vuurwerk waaruit duidelijk blijkt wat de te verwachten effecten
      tijdens het functioneren zijn;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3.1.1
  - number: 3.1.1.1.c
    text: |-
      de naam, de geregistreerde handelsnaam of de geregistreerde merknaam van de fabrikant en één postadres waarop
      contact met hem kan worden opgenomen;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3.1.1
  - number: 3.1.1.1.d
    text: |-
      indien de fabrikant niet is gevestigd op het grondgebied van de Europese Unie: de gegevens, genoemd onder c, en de
      naam, geregistreerde handelsnaam of geregistreerde merknaam van de importeur en het postadres waarop contact met
      hem kan worden opgenomen;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3.1.1
  - number: 3.1.1.1.e
    text: |-
      indien de importeur niet in Nederland is gevestigd: de gegevens, genoemd onder c en d, en de handelsnaam of het
      handelsmerk en de naam en de plaats van vestiging van de distributeur;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3.1.1
  - number: 3.1.1.1.f
    text: |-
      de naam en het type van het artikel, het door de fabrikant bij de vervaardiging toegekende registratienummer
      en het product-, partij- of serienummer van het product en, voor zover het vuurwerk betreft dat is ingedeeld in
      categorie F3 of F4, het productiejaar van het vuurwerk;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3.1.1
  - number: 3.1.1.1.g
    text: |-
      de categorie, bedoeld in [artikel 1A.1.3][ref1], waartoe het professionele vuurwerk behoort;


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3.1.1
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 1A
        hoofdstuk: 1a
        paragraaf: '1'
  - number: 3.1.1.1.h
    text: de NEM;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3.1.1
  - number: 3.1.1.1.i
    text: |-
      een gebruiksaanwijzing met zodanige aanwijzingen en waarschuwingen dat bij het dienovereenkomstig handelen geen
      letsel of schade bij de gebruiker en omstanders kan ontstaan.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3.1.1
  - number: 3.1.1.2
    text: |-
      De verpakking van professioneel vuurwerk is voorts voorzien van de volgende informatie: voor zover het betreft
      categorie F2: „uitsluitend buitenshuis te gebruiken» en, in voorkomend geval, de minimale veiligheidsafstand(en);
      voor zover het betreft categorie F3: «uitsluitend buitenshuis te gebruiken» en de minimale veiligheidsafstand(en);
      voor zover het betreft categorie F4: «uitsluitend door personen met gespecialiseerde kennis te gebruiken» en de
      minimale veiligheidsafstand(en).
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3.1.1
  - number: 3.1.1.3
    text: |-
      Het eerste en tweede lid gelden niet voor professioneel vuurwerk van geringe afmeting, mits dat vuurwerk zich
      in een verpakking bevindt waarop de in het eerste en tweede lid bedoelde gegevens zijn aangebracht. De gegevens,
      bedoeld in het eerste lid, onder c, d en e, worden, indien vermelding op het vuurwerk niet mogelijk is, vermeld op
      een bij het vuurwerk gevoegd document.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3.1.1
  - number: 3.1.1.4
    text: |-
      De aanduiding en de gegevens, bedoeld in het eerste en tweede lid, zijn in de Nederlandse, Duitse, Engelse of
      Franse taal gesteld, zichtbaar, leesbaar, duidelijk, begrijpelijk en onuitwisbaar.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3.1.1
  - number: 3.1.1.5
    text: |-
      In afwijking van het vierde lid worden de aanduiding en de gegevens, bedoeld in het eerste en tweede lid, op
      professioneel vuurwerk dat aan een persoon met gespecialiseerde kennis zal worden aangeboden in een andere lidstaat
      van de Europese Unie, gesteld in de officiële taal of talen van het desbetreffende land.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3.1.1
  - number: 3.1.1.6
    text: |-
      Dit artikel is niet van toepassing op vuurwerk waarvan op het moment dat het binnen het grondgebied van
      Nederland wordt gebracht, naar het oordeel van Onze Minister genoegzaam wordt aangetoond dat het binnen 48
      uur weer buiten het grondgebied van Nederland zal worden gebracht. Indien sprake is van opslag als bedoeld in
      [artikel 1.1.4, derde lid][ref1], wordt in plaats van «48 uur» gelezen: twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3.1.1
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 3.1.1.7
    text: |-
      Professioneel vuurwerk is voorts voorzien van de informatie waartoe met betrekking tot professioneel vuurwerk is
      besloten met toepassing van artikel 18, eerste lid, onder c, van de EU-richtlijn pyrotechnische artikelen. Indien
      de informatie, bedoeld in de eerste volzin, zou afwijken van het bepaalde in het eerste of tweede lid, blijft
      het in die leden bepaalde in zoverre buiten toepassing. Het derde tot en met zesde lid zijn van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3.1.1
  - number: 3.2.1.1
    text: |-
      Degene die een inrichting drijft, waar professioneel vuurwerk al dan niet tezamen met consumentenvuurwerk of
      pyrotechnische artikelen voor theatergebruik wordt opgeslagen of bewerkt, voldoet aan de voorschriften die zijn
      opgenomen in [bijlage 2][ref1] en aan de veiligheidsafstanden die van toepassing zijn ingevolge [bijlage 3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013360
      [ref2]: https://wetten.overheid.nl/BWBR0013360
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3.2.1
    references:
      - id: ref1
        bwb_id: BWBR0013360
      - id: ref2
        bwb_id: BWBR0013360
  - number: 3.2.1.2
    text: Degene die de inrichting drijft draagt er zorg voor dat de voorschriften worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3.2.1
  - number: 3.2.2.1
    text: |-
      Het bevoegd gezag kan maatwerkvoorschriften stellen met betrekking tot een in [bijlage 2][ref1], onder B,
      opgenomen voorschrift, voor zover dat bij het voorschrift is aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0013360
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3.2.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
  - number: 3.2.2.2
    text: |-
      De maatwerkvoorschriften gelden voor een ieder die de inrichting drijft. Deze draagt er zorg voor dat de
      maatwerkvoorschriften worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3.2.2
  - number: 3.2.2.3
    text: |-
      Het bevoegd gezag stelt het bestuur van de regionale brandweer binnen wiens gebied de inrichting geheel of in
      hoofdzaak is gelegen, in de gelegenheid advies uit te brengen over het voorgenomen maatwerkvoorschrift.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3.2.2
  - number: 3.2.2.4
    text: Van de beschikking wordt mededeling gedaan door kennisgeving in één of meer dag-, nieuws- of huis-aan-huisbladen.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3.2.2
  - number: 3.2.3.1
    text: |-
      Degene die een inrichting drijft als bedoeld in [artikel 3.2.1, eerste lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3.2.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.2.3.1.a
    text: |-
      stelt naar het oordeel van het bevoegd gezag op genoegzame wijze door verzekering of anderszins financiële
      zekerheid ter dekking van de aansprakelijkheid, bedoeld in [boek 6 van het Burgerlijk Wetboek][ref1], waartoe het
      drijven van de inrichting aanleiding kan geven;


      [ref1]: https://wetten.overheid.nl/BWBR0005289
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3.2.3
    references:
      - id: ref1
        bwb_id: BWBR0005289
  - number: 3.2.3.1.b
    text: |-
      overlegt aan het bevoegd gezag binnen een daartoe door het bevoegd gezag gestelde termijn schriftelijk bewijs van
      de gestelde financiële zekerheid.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3.2.3
  - number: 3.2.3.2
    text: |-
      De zekerheid bedraagt tenminste  € 5 000 000,00 per gebeurtenis en per inrichting en wordt in stand gehouden tot
      het moment waarop de omgevingsvergunning vervalt.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3.2.3
  - number: 3.2.3.3
    text: |-
      De verzekering is gesloten bij een financiële onderneming die ingevolge de [Wet op het financieel toezicht][ref1]
      in Nederland het bedrijf van verzekeraar mag uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3.2.3
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 3.2.3.4
    text: |-
      Het eerste lid is niet van toepassing ter zake van opslag van vuurwerk door of onder verantwoordelijkheid van
      bestuursorganen die door Onze Minister zijn aangewezen. De benadeelde heeft jegens een bestuursorgaan dat geen
      financiële zekerheid als bedoeld in het eerste lid heeft gesteld de rechten welke hij overeenkomstig dit artikel
      anders tegenover de verzekeraar zou hebben, indien de financiële zekerheid door verzekering zou zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3.2.3
  - number: 3.2.4
    text: Het bevoegd gezag zendt een afschrift van een verleende omgevingsvergunning aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3.2.4
  - number: 3.3.1.1
    text: Het is verboden professioneel vuurwerk aan een ander ter beschikking te stellen.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3.3.1
  - number: 3.3.1.2
    text: |-
      Het verbod geldt niet voor het ter beschikking stellen van professioneel vuurwerk aan een persoon met
      gespecialiseerde kennis die gerechtigd is het vuurwerk op te slaan of te bewerken, dan wel, indien de betrokken
      persoon het vuurwerk tot ontbranding zal brengen, gerechtigd is het vuurwerk tot ontbranding te brengen.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3.3.1
  - number: 3A.1.1.1
    text: 'Pyrotechnische artikelen voor theatergebruik zijn voorzien van:'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3A.1.1
  - number: 3A.1.1.1.a
    text: 'de aanduiding: Niet geschikt voor particulier gebruik;'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3A.1.1
  - number: 3A.1.1.1.b
    text: |-
      een vermelding of afbeelding van de soort van het artikel waaruit duidelijk blijkt wat de te verwachten effecten
      tijdens het functioneren zijn;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3A.1.1
  - number: 3A.1.1.1.c
    text: |-
      de naam, de geregistreerde handelsnaam of de geregistreerde merknaam van de fabrikant en één postadres waarop
      contact met hem kan worden opgenomen;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3A.1.1
  - number: 3A.1.1.1.d
    text: |-
      indien de fabrikant niet is gevestigd op het grondgebied van de Europese Unie: de gegevens, genoemd onder c, en de
      naam, geregistreerde handelsnaam of geregistreerde merknaam van de importeur en het postadres waarop contact met
      hem kan worden opgenomen;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3A.1.1
  - number: 3A.1.1.1.e
    text: |-
      indien de importeur niet in Nederland is gevestigd: de gegevens, genoemd onder c en d, en de handelsnaam of het
      handelsmerk en de naam en de plaats van vestiging van de distributeur;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3A.1.1
  - number: 3A.1.1.1.f
    text: |-
      De naam en het type van het artikel en het door de fabrikant bij de vervaardiging toegekende registratienummer en
      het product-, partij- of serienummer van het product;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3A.1.1
  - number: 3A.1.1.1.g
    text: |-
      de categorie, bedoeld in [artikel 1A.1.3][ref1], waartoe het artikel behoort;


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3A.1.1
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 1A
        hoofdstuk: 1a
        paragraaf: '1'
  - number: 3A.1.1.1.h
    text: de NEM;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3A.1.1
  - number: 3A.1.1.1.i
    text: |-
      een gebruiksaanwijzing met zodanige aanwijzingen en waarschuwingen dat bij het dienovereenkomstig handelen geen
      letsel of schade bij de gebruiker en omstanders kan ontstaan.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3A.1.1
  - number: 3A.1.1.2
    text: |-
      Op pyrotechnische artikelen voor theatergebruik moet voorts de volgende informatie staan: voor zover het betreft
      categorie T1: in voorkomend geval: «uitsluitend buitenshuis te gebruiken» en de minimale veiligheidsafstand; voor
      zover het betreft categorie T2: «uitsluitend door personen met gespecialiseerde kennis te gebruiken» en de minimale
      veiligheidsafstand(en).
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3A.1.1
  - number: 3A.1.1.3
    text: |-
      Het eerste en tweede lid gelden niet voor pyrotechnische artikelen voor theatergebruik van geringe afmeting,
      mits die artikelen zich in een verpakking bevinden waarop de in het eerste en tweede lid bedoelde gegevens
      zijn aangebracht. De gegevens, bedoeld in het eerste lid, onder c, d en e, worden, indien vermelding op het
      pyrotechnisch artikel voor theatergebruik niet mogelijk is, vermeld op een bij het pyrotechnisch artikel voor
      theatergebruik gevoegd document.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3A.1.1
  - number: 3A.1.1.4
    text: |-
      De aanduiding en de gegevens, bedoeld in het eerste en tweede lid, zijn in de Nederlandse, Duitse, Engelse of
      Franse taal gesteld, zichtbaar, leesbaar, duidelijk, begrijpelijk en onuitwisbaar.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3A.1.1
  - number: 3A.1.1.5
    text: |-
      In afwijking van het vierde lid worden de aanduiding en de gegevens, bedoeld in het eerste en tweede lid, op
      pyrotechnische artikelen voor theatergebruik die zullen worden verkocht in een andere lidstaat van de Europese Unie
      gesteld in de officiële taal of talen van het desbetreffende land.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3A.1.1
  - number: 3A.1.1.6
    text: |-
      Dit artikel is niet van toepassing op pyrotechnische artikelen voor theatergebruik waarvan op het moment dat het
      binnen het grondgebied van Nederland wordt gebracht, naar het oordeel van Onze Minister genoegzaam wordt aangetoond
      dat zij binnen 48 uur weer buiten het grondgebied van Nederland zullen worden gebracht. Indien sprake is van opslag
      als bedoeld in [artikel 1.1.4, derde lid][ref1], wordt in plaats van «48 uur» gelezen: twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3A.1.1
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 3A.1.1.7
    text: |-
      Pyrotechnische artikelen voor theatergebruikmoeten voorts zijn voorzien van de informatie waartoe met betrekking
      tot deze artikelen is besloten met toepassing van artikel 18, eerste lid, onder c, van de EU-richtlijn
      pyrotechnische artikelen. Indien de informatie, bedoeld in de eerste volzin, zou afwijken van het bepaalde in het
      eerste of tweede lid, blijft het in die leden bepaalde in zoverre buiten toepassing. Het derde tot en met zesde lid
      zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3A.1.1
  - number: 3A.1.2.1
    text: |-
      Verpakt theatervuurwerk is bij het opslaan en het voorhanden hebben op zodanige wijze verpakt dat zij volgens
      bijlage A van het ADR, uitsluitend kunnen worden aangemerkt als artikelen behorende tot klasse 1.4G of 1.4S.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3A.1.2
  - number: 3A.1.2.2
    text: |-
      Dit artikel is niet van toepassing op theatervuurwerk waarvan op het moment dat zij binnen het grondgebied van
      Nederland worden gebracht, naar het oordeel van Onze Minister genoegzaam wordt aangetoond dat zij binnen 48 uur
      weer buiten het grondgebied van Nederland zullen worden gebracht. Indien sprake is van opslag als bedoeld in
      [artikel 1.1.4, derde lid][ref1], wordt in plaats van 48 uur gelezen: twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3A.1.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 3A.2.1.1
    text: |-
      Degene die een inrichting drijft waar pyrotechnische artikelen voor theatergebruik al dan niet tezamen met
      consumentenvuurwerk of professioneel vuurwerk worden opgeslagen of bewerkt, voldoet aan de voorschriften die zijn
      opgenomen in [bijlage 2][ref1] en aan de veiligheidsafstanden die van toepassing zijn ingevolge [bijlage 3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013360
      [ref2]: https://wetten.overheid.nl/BWBR0013360
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3A.2.1
    references:
      - id: ref1
        bwb_id: BWBR0013360
      - id: ref2
        bwb_id: BWBR0013360
  - number: 3A.2.1.2
    text: |-
      In afwijking van het eerste lid voldoet degene die een inrichting drijft waar theatervuurwerk al dan niet tezamen
      met consumentenvuurwerk worden opgeslagen, aan de voorschriften die zijn opgenomen in [bijlage 1][ref1] en aan de
      veiligheidsafstanden die van toepassing zijn ingevolge [bijlage 3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013360
      [ref2]: https://wetten.overheid.nl/BWBR0013360
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3A.2.1
    references:
      - id: ref1
        bwb_id: BWBR0013360
      - id: ref2
        bwb_id: BWBR0013360
  - number: 3A.2.1.3
    text: |-
      Het eerste en tweede lid zijn niet van toepassing indien er sprake is van opslag van uitsluitend theatervuurwerk
      in een hoeveelheid van ten hoogste 25 kilogram en het [Activiteitenbesluit milieubeheer][ref1] van toepassing
      is op die opslag of aan de omgevingsvergunning, een voorschrift is verbonden, waarvan de inhoud overeenkomt met
      [artikel 4.11 van de Activiteitenregeling milieubeheer][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022762
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3A.2.1
    references:
      - id: ref1
        bwb_id: BWBR0022762
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '4'
  - number: 3A.2.1.4
    text: |-
      Voor de bepaling van de hoeveelheid artikelen, bedoeld in het derde lid, wordt uitgegaan van het gewicht van de
      artikelen als zijnde onverpakt.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3A.2.1
  - number: 3A.2.1.5
    text: Degene die de inrichting drijft draagt er zorg voor dat de voorschriften worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3A.2.1
  - number: 3A.2.2
    text: |-
      De [artikelen 3.2.2][ref1], [3.2.3][ref2] en [3.2.4][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3A.2.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3A.3.1.1
    text: Het is verboden pyrotechnische artikelen voor theatergebruik aan een ander ter beschikking te stellen.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3A.3.1
  - number: 3A.3.1.2
    text: |-
      Het verbod geldt niet voor het ter beschikking stellen van pyrotechnische artikelen voor theatergebruik aan een
      persoon met gespecialiseerde kennis die gerechtigd is het vuurwerk op te slaan of te bewerken, dan wel, indien de
      betrokken persoon het vuurwerk tot ontbranding zal brengen, gerechtigd is het vuurwerk tot ontbranding te brengen.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3A.3.1
  - number: 3B.1.1
    text: |-
      Met uitzondering van de situatie, bedoeld in [artikel 2.3.6][ref1], is het verboden zonder een daartoe verleende
      vergunning consumentenvuurwerk, professioneel vuurwerk of pyrotechnische artikelen voor theatergebruik tot
      ontbranding te brengen, ten behoeve daarvan op te bouwen, te installeren, te bewerken, dan wel na ontbranding te
      verwijderen.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.1
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 3B.1.2
    text: Onze Minister beslist op een aanvraag om een toepassingsvergunning.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.1
  - number: 3B.1.3
    text: 'Aan de toepassingsvergunning wordt het voorschrift verbonden dat:'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.1
  - number: 3B.1.3.a
    text: |-
      voorafgaand aan het tot ontbranding brengen van vuurwerk of pyrotechnische artikelen voor theatergebruik door de
      aanvrager toestemming is verkregen van gedeputeerde staten van de provincie waarin de artikelen tot ontbranding
      zullen worden gebracht en de aan de toestemming verbonden voorschriften worden nageleefd;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.1
  - number: 3B.1.3.b
    text: |-
      het tot ontbranding te brengen vuurwerk en de tot ontbranding te brengen pyrotechnische artikelen voor
      theatergebruik afkomstig zijn uit een inrichting als bedoeld in [artikel 2.2.1, eerste lid][ref1],
      [3.2.1, eerste lid][ref2], of [3A.2.1, eerste lid][ref3], of een inrichting ten aanzien waarvan de in
      [artikel 4.11, eerste lid, van de Activiteitenregeling milieubeheer][ref4] opgenomen verplichting geldt, dan wel
      rechtstreeks afkomstig zijn uit het buitenland.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel3A
      [ref4]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.1
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0013360
        artikel: 3A
        hoofdstuk: 3a
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0022830
        artikel: '4'
  - number: 3B.1.4
    text: |-
      Aan de toepassingsvergunning worden voorts voorschriften verbonden in het belang van de bescherming van de
      gezondheid van de mens en van het milieu. Zij kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.1
  - number: 3B.1.5
    text: |-
      Degene aan wie een toepassingsvergunning is verleend, is gehouden de in het derde en vierde lid bedoelde
      voorschriften na te leven.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.1
  - number: 3B.1.6
    text: |-
      De toepassingsvergunning vervalt op het moment dat de geldigheidsduur van het certificaat van vakbekwaamheid,
      bedoeld in [artikel 3B.2, tweede lid, onder c][ref1], afloopt. Is de toepassingsvergunning verleend aan een
      onderneming dan vervalt de toepassingsvergunning eveneens op het moment dat er geen persoon aan wie een certificaat
      van vakbekwaamheid, bedoeld in [artikel 4.9, tweede lid, van het Arbeidsomstandighedenbesluit][ref2], is afgegeven,
      meer werkzaam is voor de onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3B
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.1
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 3B
        hoofdstuk: 3b
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 3B.2.1
    text: |-
      De aanvraag om een toepassingsvergunning wordt langs elektronische weg ingediend. In afwijking van
      [artikel 2:15, eerste en tweede lid, van de Algemene wet bestuursrecht][ref1] neemt het bevoegd gezag een aanvraag
      die langs elektronische weg wordt ingediend, in ontvangst.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: 3B.2.2
    text: 'Bij de aanvraag worden door de aanvrager de volgende gegevens en bescheiden langs elektronische weg verstrekt:'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.2
  - number: 3B.2.2.a
    text: |-
      zijn naam, adres, geboortedatum en geboorteplaats en, in voorkomend geval, de naam en het adres van de betrokken
      onderneming;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.2
  - number: 3B.2.2.b
    text: gegevens waaruit blijkt dat de handelingen waarop de aanvraag betrekking heeft bedrijfsmatig worden verricht;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.2
  - number: 3B.2.2.c
    text: |-
      een afschrift van een geldig certificaat van vakbekwaamheid, bedoeld in
      [artikel 4.9, tweede lid, van het Arbeidsomstandighedenbesluit][ref1], dat is afgegeven aan de persoon door wie
      of onder wiens voortdurend toezicht de handelingen, waarop de aanvraag betrekking heeft, worden verricht en dat
      betrekking heeft op die handelingen;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.2
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 3B.2.2.d
    text: |-
      de handelingen en de soorten vuurwerk of pyrotechnische artikelen voor theatergebruik waarop de aanvraag betrekking
      heeft;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.2
  - number: 3B.2.2.e
    text: |-
      een verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1] over hemzelf, die niet ouder is dan zes
      maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.2
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
  - number: 3B.2.3
    text: |-
      De aanvrager stelt naar het oordeel van het bevoegd gezag bij de aanvraag op genoegzame wijze door
      verzekering of anderszins financiële zekerheid ter dekking van de aansprakelijkheid, bedoeld in
      [boek 6 van het Burgerlijk Wetboek][ref1] ter zake van de in het eerste lid, onder b, bedoelde handelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005289
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.2
    references:
      - id: ref1
        bwb_id: BWBR0005289
  - number: 3B.2.4
    text: |-
      De zekerheid bedraagt ten minste € 2 500 000,00 per gebeurtenis en wordt in ieder geval in stand gehouden tot het
      moment waarop de vergunning vervalt. [Artikel 3.2.3, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3B.2.5
    text: |-
      Met een verklaring omtrent het gedrag als bedoeld in het tweede lid, onder e, wordt gelijkgesteld een verklaring
      omtrent het gedrag afgegeven door een daartoe bevoegde instantie in een andere lidstaat van de Europese Unie dan
      wel in een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een daartoe strekkend of mede
      daartoe strekkend verdrag dat Nederland bindt, op basis van onderzoekingen of documenten die een beschermingsniveau
      bieden dat ten minste gelijkwaardig is aan het beschermingsniveau dat met de nationale onderzoekingen of documenten
      wordt geboden, mits die verklaring niet ouder is dan zes maanden.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.2
  - number: 3B.2.6
    text: |-
      De aanvrager kan de gegevens en bescheiden, bedoeld in het tweede lid, op schriftelijke wijze verstrekken, voor
      zover het bevoegd gezag daarvoor toestemming heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.2
  - number: 3B.2.7
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de wijze waarop een aanvraag langs
      elektronische weg wordt ingediend.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.2
  - number: 3B.3.1
    text: |-
      De ontbrandingstoestemming kan worden geweigerd in het belang van de bescherming van de gezondheid van de mens en
      van het milieu.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.3
  - number: 3B.3.2
    text: |-
      Aan de ontbrandingstoestemming kunnen voorschriften worden verbonden in het belang van de bescherming van de
      gezondheid van de mens en van het milieu. De voorschriften kunnen afwijken van regels gesteld in de regeling,
      bedoeld in [artikel 3B.7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3B
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 3B
        hoofdstuk: 3b
  - number: 3B.3.3
    text: Degene aan wie de toestemming is verleend, is gehouden de in het tweede lid bedoelde voorschriften na te leven.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.3
  - number: 3B.3a.1
    text: |-
      De aanvraag om een ontbrandingstoestemming wordt langs elektronische weg ingediend. In afwijking van
      [artikel 2:15, eerste en tweede lid, van de Algemene wet bestuursrecht][ref1] neemt het bevoegd gezag een
      aanvraag die langs elektronische weg wordt ingediend, in ontvangst. De aanvraag mag betrekking hebben op meerdere
      evenementen of voorstellingen waarbij vuurwerk of pyrotechnische artikelen voor theatergebruik tot ontbranding
      worden gebracht, mits die evenementen of voorstellingen plaatsvinden binnen dezelfde gemeente en binnen een tijdvak
      van ten hoogste een jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.3a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: 3B.3a.2
    text: 'Bij de aanvraag worden de volgende gegevens en bescheiden langs elektronische weg verstrekt:'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.3a
  - number: 3B.3a.2.a
    text: gegevens omtrent de datum, het tijdstip en de plaats van het tot ontbranding brengen;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.3a
  - number: 3B.3a.2.b
    text: een afschrift van de toepassingsvergunning die aan de aanvrager is verleend;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.3a
  - number: 3B.3a.2.c
    text: |-
      een afschrift van het in [artikel 3B.2, tweede lid, onder c][ref1], bedoelde certificaat;


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3B
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.3a
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 3B
        hoofdstuk: 3b
  - number: 3B.3a.2.d
    text: |-
      een schietlijst met daarin een overzicht van de toe te passen artikelen en per categorie artikelen de volgende
      gegevens: '- het aantal,'
        - de omschrijving van het artikel,
        - de fabrikant van het artikel,
        - het artikelnummer,
        - gegevens waaruit blijkt of het artikel consumentenvuurwerk, professioneel vuurwerk of een pyrotechnisch artikel
      voor theatergebruik betreft,
        - het brutogewicht van het artikel in kilogrammen,
        - het kaliber,
        - het maximale effect van het artikel in verticale richting,
        - gegevens waaruit blijkt of er sprake is van een schuin opgesteld of schuin gemonteerd artikel, en
        - de veiligheidsafstand tot het publiek die bij het ontbranden in acht zal worden genomen;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.3a
  - number: 3B.3a.2.e
    text: |-
      indien sprake is van het ontbranden in de buitenlucht, een actuele situatietekening, waarop is aangegeven: - de
      opbouwlocatie,
        - de afsteeklocatie met opstelling van de af te steken artikelen,
        - de omliggende bebouwing,
        - de veiligheidsafstanden,
        - de afzettingen van de gevarenzone tijdens opbouw en ontbranding,
        - de opstelplaats van het publiek, en
        - de vluchtwegen.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.3a
  - number: 3B.3a.2.f
    text: |-
      indien wegen in de gevarenzone zijn gelegen, een toestemming van de burgemeester binnen wiens gemeente de artikelen
      tot ontbranding zullen worden gebracht, voor het afzetten van die wegen of, indien het een eigen weg betreft, een
      toestemming van de eigenaar van de weg voor het afzetten van de weg;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.3a
  - number: 3B.3a.2.g
    text: een omschrijving van bijzondere omstandigheden.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.3a
  - number: 3B.3a.3
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid, derde volzin, worden bij de aanvraag per evenement of
      voorstelling de gegevens en bescheiden, bedoeld in de onderdelen b tot en met g, verstrekt en hoeven bij de
      aanvraag de gegevens omtrent de datum en het tijdstip van het tot ontbranding brengen niet te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.3a
  - number: 3B.3a.4
    text: |-
      De aanvrager kan de gegevens en bescheiden, bedoeld in het tweede lid, op schriftelijke wijze verstrekken, voor
      zover het bevoegd gezag daarvoor toestemming heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.3a
  - number: 3B.3a.5
    text: |-
      Gedeputeerde staten zenden onverwijld een afschrift van de aanvraag aan de burgemeester binnen wiens gemeente het
      vuurwerk of de pyrotechnische artikelen voor theatergebruik tot ontbranding zullen worden gebracht.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.3a
  - number: 3B.3a.6
    text: |-
      Gedeputeerde staten stellen alvorens een ontbrandingstoestemming te verlenen de volgende bestuursorganen en
      instanties in de gelegenheid advies uit te brengen:
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.3a
  - number: 3B.3a.6.a
    text: Onze Minister,
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.3a
  - number: 3B.3a.6.b
    text: |-
      de betrokken verlener van een luchtverkeersdienst als bedoeld in de [Wet luchtvaart][ref1], voor zover het zichzelf
      voortdrijvend opstijgend vuurwerk of zichzelf opstijgende pyrotechnische artikelen voor theatergebruik betreft die
      in de openlucht tot ontbranding zullen worden gebracht binnen 15 kilometer afstand van een luchthaven,


      [ref1]: https://wetten.overheid.nl/BWBR0005555
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.3a
    references:
      - id: ref1
        bwb_id: BWBR0005555
  - number: 3B.3a.6.c
    text: |-
      het bestuur van de regionale brandweer binnen wiens gebied het vuurwerk of de pyrotechnische artikelen voor
      theatergebruik tot ontbranding zullen worden gebracht, en
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.3a
  - number: 3B.3a.6.d
    text: |-
      de burgemeester van de gemeente aangrenzend aan de gemeente waar het vuurwerk of de pyrotechnische artikelen voor
      theatergebruik tot ontbranding zullen worden gebracht, voor zover de artikelen effect kunnen hebben binnen zijn
      gemeente.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.3a
  - number: 3B.3a.7
    text: |-
      Gedeputeerde staten verlenen geen ontbrandingstoestemming indien de burgemeester binnen wiens gemeente het vuurwerk
      of de pyrotechnische artikelen voor theatergebruik tot ontbranding zullen worden gebracht binnen twee weken na
      ontvangst van het afschrift van de aanvraag heeft verklaard tegen het verlenen van de toestemming in verband met
      de veiligheid bedenkingen te hebben, dan wel indien de burgemeester binnen die termijn gedeputeerde staten er van
      in kennis heeft gesteld dat hij de aanvraag binnen die termijn niet kan beoordelen, die verklaring heeft gegeven
      binnen vier weken na ontvangst van de aanvraag. Indien de burgemeester niet binnen de van toepassing zijnde termijn
      heeft verklaard bedenkingen te hebben, wordt hij geacht geen bedenkingen te hebben.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.3a
  - number: 3B.3a.8
    text: |-
      Gedeputeerde staten zenden onverwijld een afschrift van de ontbrandingstoestemming aan Onze Minister, aan de
      burgemeester, bedoeld in het zesde lid, onder d, en aan het bestuur van de regionale brandweer, bedoeld in het
      zesde lid, onder c. Deze verzending geschiedt zo veel als mogelijk en in ieder geval aan Onze Minister langs
      elektronische weg.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.3a
  - number: 3B.3a.9
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op de aanvraag om een
      ontbrandingstoestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.3a
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 3B.3a.10
    text: |-
      Degene aan wie een ontbrandingstoestemming is verleend voor meerdere evenementen of voorstellingen, meldt uiterlijk
      5 werkdagen voorafgaand aan ieder evenement of iedere voorstelling aan gedeputeerde staten van de provincie waarin
      het evenement of de voorstelling zal plaatsvinden, de datum en het tijdstip van het opbouwen van het vuurwerk en de
      pyrotechnische artikelen voor theatergebruik en de datum, het tijdstip en de plaats van het tot ontbranding brengen
      van die artikelen, onder verwijzing naar de datum en het kenmerk van die toestemming. Gedeputeerde staten zenden
      onverwijld een afschrift van de melding aan de bestuursorganen en instanties, bedoeld in het achtste lid. Deze
      verzending geschiedt zo veel als mogelijk en in ieder geval aan Onze Minister langs elektronische weg.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.3a
  - number: 3B.3a.11
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de wijze waarop een aanvraag als bedoeld
      in het eerste lid langs elektronische weg wordt ingediend en een afschrift van een ontbrandingstoestemming als
      bedoeld in het achtste lid en van een melding als bedoeld in het tiende lid langs elektronische weg wordt gezonden.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.3a
  - number: 3B.4.1
    text: |-
      In afwijking van [artikel 3B.1, derde lid, onder a][ref1], kan degene aan wie een toepassingsvergunning is verleend
      en die:


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3B
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.4
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 3B
        hoofdstuk: 3b
  - number: 3B.4.1.a
    text: ten hoogste 20 kilogram theatervuurwerk tot ontbranding wil brengen, of
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.4
  - number: 3B.4.1.b
    text: ten hoogste 200 kilogram consumentenvuurwerk tot ontbranding wil brengen,
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.4
  - number: 3B.4.2
    text: |-
      Voor de bepaling van de hoeveelheid consumentenvuurwerk of theatervuurwerk, bedoeld in het eerste lid, wordt
      uitgegaan van het gewicht van de artikelen als zijnde onverpakt consumentenvuurwerk onderscheidenlijk onverpakt
      theatervuurwerk.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.4
  - number: 3B.4.3
    text: |-
      Gedeputeerde staten zenden onverwijld een afschrift van de melding aan het bestuur van de regionale brandweer
      binnen wiens gebied de artikelen tot ontbranding zullen worden gebracht, aan de burgemeester van de gemeente binnen
      wiens gemeente de artikelen tot ontbranding zullen worden gebracht en aan Onze Minister. Deze verzending geschiedt
      zo veel als mogelijk en in ieder geval aan Onze Minister langs elektronische weg.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.4
  - number: 3B.4.4
    text: |-
      Degene die het consumentenvuurwerk of theatervuurwerk tot ontbranding wil brengen draagt er zorg voor dat de
      melding ten minste twee weken voordat de artikelen tot ontbranding worden gebracht door gedeputeerde staten is
      ontvangen.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.4
  - number: 3B.4.5
    text: |-
      In afwijking van het vierde lid kunnen gedeputeerde staten na overleg met de burgemeester en het bestuur, bedoeld
      in het derde lid, in bijzondere omstandigheden een kortere termijn voor de melding toestaan.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.4
  - number: 3B.4.6
    text: |-
      [Artikel 3B.3a, eerste lid, eerste en tweede volzin, tweede, vierde en elfde lid][ref1], is van overeenkomstige
      toepassing op een melding als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3B
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.4
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 3B
        hoofdstuk: 3b
  - number: 3B.5.1
    text: De toepassingsvergunning kan worden gewijzigd of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.5
  - number: 3B.5.2
    text: |-
      De [artikelen 2.30, eerste lid][ref1], [2.31, eerste lid, onder b, en tweede lid, onder b][ref2],
      [2.33, eerste lid, onder a en b, en tweede lid, onder b en d, onder 2°][ref3], [3.15][ref4] en
      [5.19, vierde lid, van de Wet algemene bepalingen omgevingsrecht][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0024779#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0024779#Artikel5
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.5
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0024779
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0024779
        artikel: '5'
  - number: 3B.6.1
    text: 'Degene aan wie een toepassingsvergunning is verleend, houdt een register bij waarin zijn vermeld:'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.6
  - number: 3B.6.1.a
    text: |-
      de persoon of personen aan wie een certificaat van vakbekwaamheid is afgegeven als bedoeld in
      [artikel 4.9, tweede lid, van het Arbeidsomstandighedenbesluit][ref1], en door wie of onder wier toezicht
      bedrijfsmatig handelingen met vuurwerk of pyrotechnische artikelen voor theatergebruik worden verricht, als bedoeld
      in [artikel 3B.1, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel3B
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.6
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: 3B
        hoofdstuk: 3b
  - number: 3B.6.1.b
    text: |-
      de personen die onder toezicht van de onder a bedoelde persoon of personen bedrijfsmatig handelingen met vuurwerk
      of pyrotechnische artikelen voor theatergebruik verrichten als bedoeld in [artikel 3B.1, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3B
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.6
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 3B
        hoofdstuk: 3b
  - number: 3B.6.1.c
    text: |-
      de evenementen en voorstellingen, waarbij vuurwerk of pyrotechnische artikelen voor theatergebruik tot ontbranding
      zijn gebracht en de daarbij tot ontbranding gebrachte typen en hoeveelheden vuurwerk of pyrotechnische artikelen
      voor theatergebruik in kilogrammen alsmede de weigeraars, met vermelding van de door de fabrikant bij de
      vervaardiging toegekende artikelnummers die dienen ter identificatie van het vuurwerk of de pyrotechnische
      artikelen voor theatergebruik;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.6
  - number: 3B.6.1.d
    text: |-
      ongewone voorvallen die zich tijdens het tot ontbranding brengen van vuurwerk of pyrotechnische artikelen voor
      theatergebruik hebben voorgedaan.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.6
  - number: 3B.6.2
    text: Het register wordt binnen twee werkdagen na een wijziging dan wel na een evenement of voorstelling bijgewerkt.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.6
  - number: 3B.6.3
    text: |-
      De gegevens worden op een zodanige wijze geregistreerd dat gedurende de periode waarover de registratieplicht
      ingevolge het vierde lid geldt, indien Onze Minister of gedeputeerde staten van de provincie die de vergunning
      hebben verleend daarom verzoeken, binnen acht uur de gegevens schriftelijk kunnen worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.6
  - number: 3B.6.4
    text: |-
      De gegevens, bedoeld in het eerste lid, blijven ten minste voor de duur van zeven jaar na de vastlegging in de
      registratie opgenomen.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.6
  - number: 3B.6.5
    text: |-
      Degene aan wie een toepassingsvergunning is verleend, meldt een ongewoon voorval als bedoeld in het eerste lid,
      onder d, onverwijld aan gedeputeerde staten van de provincie waarin het vuurwerk of de pyrotechnische artikelen
      voor theatergebruik tot ontbranding worden gebracht.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.6
  - number: 3B.7
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het bedrijfsmatig tot ontbranding brengen van
      vuurwerk en pyrotechnische artikelen voor theatergebruik.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel3B.7
  - number: 4.1.1
    text: |-
      De veiligheidsafstanden, bedoeld in [bijlage 3][ref1] worden, voor zover deze in acht genomen moeten worden bij
      de vaststelling van een besluit als bedoeld in [artikel 4.2][ref2], aangemerkt als grenswaarde als bedoeld in
      [artikel 5.1, derde lid, van de Wet milieubeheer][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013360
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0013360
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '4'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '5'
  - number: 4.1.2
    text: |-
      Indien de kwaliteit van een gebied waarvoor de veiligheidsafstand in acht moet worden genomen, beter is dan de
      grenswaarde aangeeft, treedt de kwaliteit van dat gebied niet in de plaats van de grenswaarde.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel4.1
  - number: 4.2.1
    text: |-
      Het bevoegd gezag neemt de in [bijlage 3][ref1] gestelde afstanden in acht bij:


      [ref1]: https://wetten.overheid.nl/BWBR0013360
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
  - number: 4.2.1.a
    text: |-
      het vaststellen van een bestemmings- of inpassingsplan of een beheersverordening als bedoeld in [artikel 3.1][ref1],
      [3.26][ref2] of [3.28][ref3], onderscheidenlijk [artikel 3.38 van de Wet ruimtelijke ordening][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 4.2.1.b
    text: |-
      het wijzigen van een bestemmingsplan overeenkomstig [artikel 3.6, eerste lid, onder a, van die wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 4.2.2
    text: |-
      Gedeputeerde staten nemen de in [bijlage 3][ref1] gestelde afstanden in acht bij de verlening of wijziging van
      een omgevingsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0013360
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
  - number: 4.2.3
    text: |-
      Het tweede lid is niet van toepassing ten aanzien van inrichtingen als bedoeld in [artikel 1.1.4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 4.2.4
    text: |-
      In afwijking van het eerste en tweede lid kan het bevoegd gezag een kleinere afstand dan genoemd in
      [bijlage 3, onder 1.3][ref1], vaststellen, indien het desbetreffende besluit betrekking heeft op:


      [ref1]: https://wetten.overheid.nl/BWBR0013360
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
  - number: 4.2.4.a
    text: een inrichting waar theatervuurwerk al dan niet tezamen met consumentenvuurwerk wordt opgeslagen of bewerkt,
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel4.2
  - number: 4.2.4.b
    text: een inrichting waar meer dan 10 000 kilogram consumentenvuurwerk wordt opgeslagen, herverpakt of bewerkt, of
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel4.2
  - number: 4.2.4.c
    text: |-
      de bestemming van grond, voor zover die grond ligt binnen het invloedsgebied van een inrichting als bedoeld onder
      a of b, indien aan de omgevingsvergunning voor de desbetreffende inrichting zodanige voorschriften zijn verbonden
      dat:
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel4.2
  - number: 4.2.4.c.1°
    text: |-
      de warmtestraling ten gevolge van brand in die inrichting waarbij vuurwerk of pyrotechnische artikelen voor
      theatergebruik betrokken zijn voor personen die zich ophouden buiten een gebouw dat onderdeel is van een beperkt
      kwetsbaar object, kwetsbaar object of geprojecteerd beperkt kwetsbaar of kwetsbaar object beperkt blijft tot ten
      hoogste 10 kW/m2, en
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel4.2
  - number: 4.2.4.c.2°
    text: |-
      de weerstand tegen branddoorslag en brandoverslag tussen de deuropening van een bewaarplaats of een
      bufferbewaarplaats en een gebouw, indien dat gebouw een beperkt kwetsbaar object, kwetsbaar object of geprojecteerd
      beperkt kwetsbaar of kwetsbaar object is, niet lager is dan 60 minuten.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel4.2
  - number: 4.3.1
    text: |-
      Indien voor het desbetreffende gebied een bestemmingsplan geldt, gelden de veiligheidsafstanden,
      tenzij in [bijlage 3][ref1] anders is aangegeven, vanaf de uitwendige scheidingsconstructie, bedoeld in
      [artikel 1.1 van het Bouwbesluit 2012][ref2], van het gebouw waar vuurwerk wordt opgeslagen of bewerkt binnen een
      inrichting als bedoeld in [artikel 2.2.1][ref3], [3.2.1][ref4] of [3A.2.1][ref5], tot aan de bestemmingsgrens.


      [ref1]: https://wetten.overheid.nl/BWBR0013360
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0013360#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0013360#Artikel3A
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
      - id: ref2
        bwb_id: BWBR0030461
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0013360
        artikel: 3A
        hoofdstuk: 3a
        paragraaf: '2'
  - number: 4.3.2
    text: |-
      Indien een bestemmingsplan voor het desbetreffende gebied ontbreekt, gelden de veiligheidsafstanden,
      tenzij in [bijlage 3][ref1] anders is aangegeven, vanaf de uitwendige scheidingsconstructie, bedoeld in
      [artikel 1.1 van het Bouwbesluit 2012][ref2], van het gebouw, bedoeld in het eerste lid, tot aan de eigendomsgrens
      van het gebied dat behoort bij het beperkt kwetsbare of kwetsbare object.


      [ref1]: https://wetten.overheid.nl/BWBR0013360
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
      - id: ref2
        bwb_id: BWBR0030461
        artikel: '1'
  - number: 4.3.3
    text: |-
      In afwijking van het eerste lid gelden de veiligheidsafstanden tot tien meter vanaf het beperkt kwetsbare of
      kwetsbare object of het geprojecteerde beperkt kwetsbare of kwetsbare object, indien:
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel4.3
  - number: 4.3.3.a
    text: |-
      het object een gebouw is, niet zijnde een gebouw bestemd voor het verblijf, al dan niet gedurende een gedeelte
      van de dag, van minderjarigen, ouderen, zieken of gehandicapten of een kantoorgebouw is, niet zijnde een kwetsbaar
      object, en de grens van de bouwstrook meer dan tien meter vanaf de bestemmingsgrens is gelegen;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel4.3
  - number: 4.3.3.b
    text: |-
      het object een woonwagen is die meer dan tien meter vanaf de grens van het gebied dat voor woonwagens is bestemd,
      is of mag worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel4.3
  - number: 4.3.4
    text: |-
      Indien in het bestemmingsplan geen bouwstrook is aangegeven, gelden de veiligheidsafstanden tot aan de
      bestemmingsgrens.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel4.3
  - number: 4.3.5
    text: |-
      In afwijking van het tweede lid gelden de veiligheidsafstanden tot tien meter vanaf het beperkt kwetsbare of
      kwetsbare object, indien:
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel4.3
  - number: 4.3.5.a
    text: |-
      het object een gebouw is, niet zijnde een gebouw bestemd voor het verblijf, al dan niet gedurende een gedeelte
      van de dag, van minderjarigen, ouderen, zieken of gehandicapten of een kantoorgebouw is, niet zijnde een kwetsbaar
      object, en het object meer dan tien meter vanaf de eigendomsgrens van het desbetreffende gebied is gelegen;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel4.3
  - number: 4.3.5.b
    text: |-
      het object een woonwagen is die meer dan tien meter van de eigendomsgrens van het desbetreffende perceel of van het
      gebied dat voor woonwagens is aangewezen, is geplaatst.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel4.3
  - number: 4.3.6
    text: |-
      In afwijking van het eerste tot en met vijfde lid gelden de veiligheidsafstanden, tenzij in
      [bijlage 3][ref1] anders is aangegeven, vanaf de uitwendige scheidingsconstructie, bedoeld in
      [artikel 1.1 van het Bouwbesluit 2012][ref2], van het gebouw, bedoeld in het eerste lid, tot aan de ligplaats van
      een woonschip.


      [ref1]: https://wetten.overheid.nl/BWBR0013360
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
      - id: ref2
        bwb_id: BWBR0030461
        artikel: '1'
  - number: 5.2.1
    text: 'Ingetrokken worden:'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.2.1
  - number: 5.2.1.a
    text: het Vuurwerkbesluit Wet milieugevaarlijke stoffen;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.2.1
  - number: 5.2.1.b
    text: het Besluit opslag vuurwerk milieubeheer;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.2.1
  - number: 5.2.1.c
    text: het Reglement Gevaarlijke Stoffen;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.2.1
  - number: 5.2.1.d
    text: |-
      de beschikking van de Staatssecretaris van Verkeer en Waterstaat van 6 november 1979, houdende voorschriften voor
      de aflevering van ontploffingsgevaarlijke stoffen;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.2.1
  - number: 5.2.1.e
    text: |-
      de regeling van de Staatssecretaris van Verkeer en Waterstaat van 17 maart 1980, houdende verbod tot het gebruik
      van explosieven voor opruimingswerkzaamheden;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.2.1
  - number: 5.2.1.f
    text: |-
      de ontheffing van het Reglement Gevaarlijke Stoffen van de Staatssecretaris van Verkeer en Waterstaat van 19
      december 1985;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.2.1
  - number: 5.2.1.g
    text: |-
      de regeling van de Minister van Verkeer en Waterstaat van 20 december 1990, houdende vergunningplicht voor het
      afleveren, ter aflevering aanwezig houden en bezigen van vuurwerk;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.2.1
  - number: 5.2.1.h
    text: het Interim-besluit bezigen en afleveren professioneel vuurwerk Wms;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.2.1
  - number: 5.2.1.i
    text: |-
      de Interimregeling aanwijzing toezichthoudende ambtenaren Interim-besluit bezigen en afleveren professioneel
      vuurwerk Wms.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.2.1
  - number: 5.3.1
    text: |-
      De nadere eisen, gesteld krachtens [artikel 2.2.3][ref1] of [3.2.2][ref2], alsmede de toestemmingen, verleend
      krachtens voorschrift 1.8 van [bijlage 1][ref3], die voor een inrichting onmiddellijk voor 1 juli 2012 in werking
      en onherroepelijk waren, worden gelijkgesteld met maatwerkvoorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013360
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.3.1
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0013360
  - number: 5.3.2.1
    text: |-
      Een vergunning als bedoeld in [artikel 3B.1, eerste lid][ref1], die onmiddellijk voor 1 juli 2012 van kracht en
      onherroepelijk is, wordt gelijkgesteld met een toepassingsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3B
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.3.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 3B
        hoofdstuk: 3b
  - number: 5.3.2.2
    text: |-
      Een toestemming als bedoeld in [artikel 3B.1, derde lid, onder a][ref1], die onmiddellijk voor 1 juli 2012 van
      kracht en onherroepelijk is, wordt gelijkgesteld met een ontbrandingstoestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3B
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.3.2
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 3B
        hoofdstuk: 3b
  - number: 5.3.3.1
    text: 'Het recht zoals dat gold onmiddellijk voor 1 juli 2012 blijft van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.3.3
  - number: 5.3.3.1.a
    text: |-
      de voorbereiding en vaststelling van de beschikking op een aanvraag om een vergunning als bedoeld in
      [artikel 3B.1, eerste lid][ref1], of een toestemming als bedoeld in [artikel 3B.3, derde lid][ref2], of een
      aanvraag om een beschikking tot wijziging of intrekking daarvan, indien voor die datum een aanvraag is ingediend;


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3B
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel3B
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.3.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 3B
        hoofdstuk: 3b
      - id: ref2
        bwb_id: BWBR0013360
        artikel: 3B
        hoofdstuk: 3b
  - number: 5.3.3.1.b
    text: |-
      de voorbereiding en vaststelling van een ambtshalve te geven beschikking tot wijziging of
      intrekking van een vergunning als bedoeld in [artikel 3B.1, eerste lid][ref1], indien voor
      die datum van het ontwerpbesluit mededeling is gedaan met overeenkomstige toepassing van
      [artikel 3:19, tweede lid, onderdelen b en c, van de Algemene wet bestuursrecht][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3B
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.3.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 3B
        hoofdstuk: 3b
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 5.3.3.1.c
    text: |-
      een vergunning als bedoeld in [artikel 3B.1, eerste lid][ref1], of een toestemming als bedoeld in
      [artikel 3B.3, derde lid][ref2], of een beschikking tot wijziging of intrekking daarvan, die nog niet
      onherroepelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3B
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel3B
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.3.3
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 3B
        hoofdstuk: 3b
      - id: ref2
        bwb_id: BWBR0013360
        artikel: 3B
        hoofdstuk: 3b
  - number: 5.3.3.2
    text: 'In gevallen als bedoeld in het eerste lid wordt:'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.3.3
  - number: 5.3.3.2.a
    text: |-
      een vergunning of toestemming gelijkgesteld met een toepassingsvergunning onderscheidenlijk
      ontbrandingstoestemming;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.3.3
  - number: 5.3.3.2.b
    text: |-
      een beschikking tot wijziging van een vergunning of toestemming gelijkgesteld met een beschikking tot wijziging van
      een toepassingsvergunning onderscheidenlijk ontbrandingstoestemming,
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.3.3
  - number: 5.3.4
    text: |-
      Een melding die is gedaan op grond van [artikel 3B.4][ref1], zoals dat artikel luidde onmiddellijk voor 1 juli
      2012, behoudt haar geldigheid tot vier weken na die datum.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3B
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.3.4
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 3B
        hoofdstuk: 3b
  - number: 5.3.5.1
    text: |-
      De [artikelen 1A.1.3 tot en met 1A.4.1][ref1] en [3A.1.1][ref2] zoals die luidden vóór 1 juli 2015 zijn eerst
      met ingang van 4 juli 2013 van toepassing op vuurwerk behorende tot categorie F4 en pyrotechnische artikelen voor
      theatergebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1A
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel3A
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.3.5
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: 1A
        hoofdstuk: 1a
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: 3A
        hoofdstuk: 3a
        paragraaf: '1'
  - number: 5.3.5.2
    text: |-
      Tot en met 3 juli 2017 wordt onder professioneel vuurwerk mede verstaan vuurwerk dat niet behoort tot categorie F1,
      F2 of F3 en wel behoort tot :
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.3.5
  - number: 5.3.5.2.a
    text: |-
      professioneel vuurwerk als bedoeld in [artikel 1.1.1][ref1] van het Vuurwerkbesluit, zoals dit artikel luidde op
      3 juli 2010,


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.3.5
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 5.3.5.2.b
    text: |-
      vuurwerk bestemd voor particulier gebruik als bedoeld in [artikel 1.2.2, zevende lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.3.5
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 5.3.5.2.c
    text: vuurwerk waarvan de bestemming niet kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.3.5
  - number: 5.3.5.3
    text: |-
      [Artikel 3.1.1][ref1] van het Vuurwerkbesluit, zoals dat artikel luidde op 3 juli 2010, blijft tot en met 3 juli
      2017 van toepassing op professioneel vuurwerk als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.3.5
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 5.3.5.4
    text: |-
      Tot en met 3 juli 2013 is het in de handel brengen van vuurwerk behorende tot categorie F4 en van pyrotechnische
      artikelen voor theatergebruik behorende tot categorie T1 of T2 slechts toegestaan overeenkomstig de artikelen van
      dit besluit genoemd in het eerste lid, dan wel [artikel 3.1.1][ref1], zoals dat artikel luidde op 3 juli 2010.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.3.5
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 5.3.5.5
    text: |-
      Vuurwerk dat voor 4 juli 2010 in Nederland in de handel is gebracht en voldoet aan de eisen voor
      consumentenvuurwerk die zijn gesteld bij of krachtens het Vuurwerkbesluit dat gold op 3 juli 2010, mag tot en met
      3 juli 2014 in Nederland worden verhandeld of gebruikt overeenkomstig dat besluit.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.3.5
  - number: 5.3.5.6
    text: |-
      Vuurwerk dat voor 4 juli 2013 in Nederland in de handel is gebracht en voldoet aan de eisen voor professioneel
      vuurwerk die zijn gesteld bij of krachtens het Vuurwerkbesluit zoals dat gold op 3 juli 2010, mag tot en met 3 juli
      2017 in Nederland worden verhandeld of gebruikt overeenkomstig dat besluit.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.3.5
  - number: 5.3.5.7
    text: |-
      Vuurwerk en pyrotechnische artikelen voor theatergebruik die voldoen aan dit besluit zoals dat onmiddellijk vóór
      de inwerkingtreding van het besluit van 8 september 2015 tot wijziging van het Vuurwerkbesluit ter implementatie
      van richtlijn nr. 2013/29/EU van het Europees Parlement en de Raad van 12 juni 2013 betreffende de harmonisatie
      van de wetgevingen van de lidstaten inzake het op de markt aanbieden van pyrotechnische artikelen (herschikking)
      (PbEU L 178) en uitvoeringsrichtlijn 2014/58/EU van 16 april 2014 van de Commissie betreffende het opzetten van een
      traceerbaarheidssysteem voor pyrotechnische artikelen overeenkomstig Richtlijn 2007/23/EG (PbEU L 115) (Stb. 2015,
      nr. 332) luidde en die vóór dat tijdstip in de handel zijn gebracht, mogen ook na dat tijdstip op de markt worden
      aangeboden.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.3.5
  - number: 5.3.5.8
    text: |-
      Conformiteitscertificaten, verstrekt uit hoofde van Richtlijn 2007/23/EG van het Europees Parlement en de Raad van
      23 mei 2007 betreffende het in de handel brengen van pyrotechnische artikelen, zijn geldig uit hoofde van de EU-
      richtlijn pyrotechnische artikelen.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.3.5
  - number: 5.3.6.1
    text: |-
      Een vergunning, verleend op grond van [artikel 3.3.2][ref1] van het Vuurwerkbesluit, zoals dit gold tot en met
      3 juli 2010, wordt na die datum aangemerkt als een vergunning krachtens [artikel 3B.1, eerste lid][ref2], van het
      Vuurwerkbesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel3B
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.3.6
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: 3B
        hoofdstuk: 3b
  - number: 5.3.6.2
    text: |-
      Een toestemming als bedoeld in [artikel 3.3.2, derde lid, onder a][ref1], van het Vuurwerkbesluit,
      zoals dit gold tot en met 3 juli 2010, wordt na die datum aangemerkt als een toestemming als bedoeld in
      [artikel 3B.1, derde lid][ref2], van het Vuurwerkbesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel3B
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.3.6
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: 3B
        hoofdstuk: 3b
  - number: 5.3.6.3
    text: |-
      Een vergunning als bedoeld in het eerste lid, en een toestemming als bedoeld in het tweede lid, gelden tevens voor
      consumentenvuurwerk en pyrotechnische artikelen voor theatergebruik.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.3.6
  - number: 5.3.7.1
    text: |-
      De [artikelen 3.3.2][ref1], [3.3.3][ref2] en [3.3.4][ref3] van het Vuurwerkbesluit zoals dat gold tot en met
      3 juli 2010 blijven van toepassing op voor 4 juli 2010 ingediende aanvragen van onderstaande besluiten, totdat deze
      onherroepelijk zijn geworden:


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.3.7
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0013360
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 5.3.7.1.a
    text: |-
      een besluit inzake het verlenen, wijzigen of intrekken van een vergunning voor het tot ontbranding brengen, ten
      behoeve daarvan opbouwen, installeren, bewerken, dan wel na ontbranding verwijderen van professioneel vuurwerk;
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.3.7
  - number: 5.3.7.1.b
    text: |-
      een besluit inzake het verlenen, wijzigen of intrekken van een toestemming voor het tot ontbranding brengen, ten
      behoeve daarvan opbouwen, installeren, bewerken, dan wel na ontbranding verwijderen van professioneel vuurwerk.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.3.7
  - number: 5.3.7.2
    text: |-
      [Artikel 5.3.6][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel5
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.3.7
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: 5.3.8
    text: |-
      Een certificaat van vakbekwaamheid als bedoeld in
      [artikel 4.9, tweede lid, van het Arbeidsomstandighedenbesluit][ref1], dat voor 4 juli 2010 is afgegeven aan
      de houder van een vergunning als bedoeld in [artikel 3B.1][ref2], geldt, indien het betrekking heeft of mede
      betrekking heeft op professioneel vuurwerk, mede voor consumentenvuurwerk en pyrotechnische artikelen voor
      theatergebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel3B
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.3.8
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0013360
        artikel: 3B
        hoofdstuk: 3b
  - number: 5.4.0
    text: |-
      Dit besluit berust mede op de [artikelen 9.2.1.4][ref1], [9.2.2.1][ref2] en [9.2.3.2 van de Wet milieubeheer][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.4.0
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 5.4.1
    text: |-
      Onze Minister wijst een vertaling aan van bijlage A van het ADR of draagt zorg voor een vertaling en doet van de
      aanwijzing of wijze van bekendmaking van de vertaling mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.4.1
  - number: 5.4.2
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.4.2
  - number: 5.4.3
    text: 'Dit besluit wordt aangehaald als: Vuurwerkbesluit.'
    url: https://wetten.overheid.nl/BWBR0013360/2019-11-29#Artikel5.4.3
