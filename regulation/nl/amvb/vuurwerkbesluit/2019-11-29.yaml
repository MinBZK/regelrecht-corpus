articles:
  - number: 1.1.1.1
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - Onze Minister: Onze Minister van
      Infrastructuur en Milieu;
        - ADR: de op 30 september 1957 te Genève tot stand gekomen Europese Overeenkomst betreffende het internationale
      vervoer van gevaarlijke goederen over de weg (Trb. 1959, 171);
        - bijlage: bij dit besluit behorende bijlage;
        - bedrijfsmatig: in de uitoefening van een beroep of bedrijf of tegen vergoeding;
        - beperkt kwetsbaar object: a. 1°. woning, woonschip of woonwagen van een derde, gelegen op een locatie met een
      dichtheid van maximaal twee woningen, woonschepen of woonwagens per hectare, of 2°. dienst- of bedrijfswoning
      van een derde; b. kantoorgebouw, niet zijnde een kwetsbaar object; c. hotel of restaurant, niet zijnde een
      kwetsbaar object; d. winkel, niet zijnde een kwetsbaar object; e. sporthal, sportterrein, zwembad of speeltuin;
      f. kampeerterrein of ander terrein, niet zijnde een kwetsbaar object, bestemd voor recreatieve doeleinden; g.
      bedrijfsgebouw, niet zijnde een kwetsbaar object; h. object dat met een van de onder a tot en met e en g genoemde
      categorieën beperkt kwetsbare objecten gelijkgesteld kan worden uit hoofde van de gemiddelde tijd per dag
      gedurende welke personen daar verblijven, het aantal personen dat daarin doorgaans aanwezig is en de mogelijkheden
      voor zelfredzaamheid bij een ongeval; i. object met een hoge infrastructurele waarde, zoals een telefoon- of
      elektriciteitscentrale of een gebouw met vluchtleidingsapparatuur, dat wegens de aard van de gevaarlijke stoffen
      die bij een ongeval kunnen vrijkomen, bescherming verdient tegen de gevolgen van dat ongeval;
        - bestemmingsgrens: grens van het perceel waarop de bouw, vestiging of plaatsing van een beperkt kwetsbaar of
      kwetsbaar object op grond van het voor het betrokken gebied geldende bestemmingsplan dan wel de daarvoor geldende
      beheersverordening geëffectueerd of toelaatbaar is;
        - bevoegd gezag: bestuursorgaan dat bevoegd is of zou zijn een omgevingsvergunning voor een inrichting te verlenen,
      waar consumentenvuurwerk, professioneel vuurwerk of pyrotechnische artikelen voor theatergebruik worden opgeslagen
      of bewerkt;
        - bouwstrook: gedeelte van het perceel dat op grond van het voor het betrokken gebied geldende bestemmingsplan dan
      wel de daarvoor geldende beheersverordening voor de bouw van een beperkt kwetsbaar of kwetsbaar object is bestemd;
        - Categorie F1, F2, F3 en F4: categorie F1, F2, F3 onderscheidenlijk F4 als bedoeld in [artikel 1A.1.3][ref1];
        - categorie T1 en T2: categorie T1 onderscheidenlijk T2 als bedoeld in [artikel 1A.1.3][ref2];
        - CE-markering: CE-markering als bedoeld in de artikelen 19 en 20 van de EU-richtlijn pyrotechnische artikelen;
        - consumentenvuurwerk: vuurwerk dat is ingedeeld in categorie F1, F2 of F3 en dat bij of krachtens dit besluit is
      aangewezen als vuurwerk dat ter beschikking mag worden gesteld voor particulier gebruik;
        - distributeur: natuurlijk of rechtspersoon in de toeleveringsketen, niet zijnde de fabrikant of de importeur, die
      vuurwerk of pyrotechnische artikelen voor theatergebruik op de markt aanbiedt;
        - EU-richtlijn pyrotechnische artikelen: richtlijn nr. 2013/29/EU van het Europees Parlement en de Raad van
      12 juni 2013 betreffende de harmonisatie van de wetgevingen van de lidstaten inzake het op de markt aanbieden van
      pyrotechnische artikelen (herschikking) (PbEU L 178);
        - fabrikant: natuurlijke of rechtspersoon die vuurwerk of een pyrotechnisch artikel voor theatergebruik vervaardigt
      of laat ontwerpen of vervaardigen en dat vuurwerk of pyrotechnische artikel voor theatergebruik onder zijn naam of
      merknaam verhandelt;
        - fop- en schertsvuurwerk: consumentenvuurwerk dat is ingedeeld in categorie F1 alsmede ander, als zodanig bij
      ministeriële regeling aangewezen consumentenvuurwerk;
        - geprojecteerd beperkt kwetsbaar of kwetsbaar object: nog niet aanwezig beperkt kwetsbaar of kwetsbaar object dat
      op grond van het voor het betrokken gebied geldende bestemmingsplan dan wel de daarvoor geldende beheersverordening
      toelaatbaar is;
        - grondgebied van de Europese Unie: gebied waarop de Overeenkomst betreffende de Europese Economische Ruimte van
      toepassing is;
        - importeur: in de Europese Unie gevestigde natuurlijke of rechtspersoon die vuurwerk of een pyrotechnisch artikel
      voor theatergebruik uit een derde land in de Europese Unie in de handel brengt;
        - in de handel brengen: het voor het eerst in de Europese Unie op de markt aanbieden van vuurwerk of een
      pyrotechnisch artikel voor theatergebruik;
        - inspecteur: als zodanig bij besluit van Onze Minister aangewezen ambtenaar;
        - kwetsbaar object: a. woning, woonschip of woonwagen, niet zijnde een beperkt kwetsbaar object; b. gebouw
      bestemd voor het verblijf, al dan niet gedurende een gedeelte van de dag, van minderjarigen, ouderen, zieken of
      gehandicapten, waartoe in ieder geval behoren: 1°. een ziekenhuis, bejaardenhuis of verpleeghuis, 2°. een school of
      3°. een gebouw of een gedeelte daarvan, bestemd voor dagopvang van minderjarigen; c. gebouw waarin doorgaans grote
      aantallen personen gedurende een groot gedeelte van de dag aanwezig zijn, waartoe in ieder geval behoren, waartoe
      in ieder geval behoren: 1°. een kantoorgebouw of hotel met een bruto vloeroppervlak van meer dan 1500 m2, 2°. een
      complex waarin meer dan 5 winkels zijn gevestigd, waaronder in ieder geval een supermarkt, hypermarkt of warenhuis,
      met een gezamenlijk bruto vloeroppervlak van meer dan 1000 m2, of 3°. een winkel, zijnde een supermarkt, hypermarkt
      of warenhuis, met een totaal bruto vloeroppervlak van meer dan 2000 m2; d. kampeer- of ander recreatieterrein
      bestemd voor het verblijf van meer dan 50 personen gedurende meerdere aaneengesloten dagen; e. rijksweg of
      hoofdspoorweg als bedoeld in de [Spoorwegwet][ref3];
        - lidstaat van de Europese Unie: lidstaat van de Europese Unie of een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte;
        - luchthaven: luchthaven als bedoeld in de [Wet luchtvaart][ref4];
        - Marktdeelnemers: fabrikant, importeur en distributeur;
        - NEM: netto explosieve massa, zijnde de totale hoeveelheid pyrotechnische stof of preparaat, met eventuele
      toevoegingen, in vuurwerk of pyrotechnische artikelen voor theatergebruik;
        - ontbrandingstoestemming: toestemming als bedoeld in [artikel 3B.1, derde lid, onder a][ref5];
        - Op de markt aanbieden: het in het kader van een handelsactiviteit, al dan niet tegen betaling, verstrekken van
      vuurwerk of een pyrotechnisch artikel voor theatergebruik met het oog op distributie, consumptie of gebruik op de
      markt van de Unie;
        - persoon met gespecialiseerde kennis: persoon, aangewezen bij [artikel 1.1.2a][ref6];
        - primaire verpakking: verpakking waarin zich meer dan één exemplaar bevindt van eenzelfde type vuurwerk, bedoeld
      om in zijn geheel aan de particulier ter beschikking te worden gesteld;
        - professioneel vuurwerk: vuurwerk dat is ingedeeld in categorie F4 alsmede vuurwerk dat is ingedeeld in categorie
      F2 of F3 en dat niet bij of krachtens dit besluit is aangewezen als vuurwerk dat ter beschikking mag worden gesteld
      voor particulier gebruik;
        - pyrotechnisch artikel: artikel dat explosieve stoffen of een explosief mengsel van stoffen bevat die tot doel
      hebben warmte, licht, geluid, gas of rook dan wel een combinatie van dergelijke verschijnselen te produceren door
      middel van zichzelf onderhoudende exotherme chemische reacties;
        - pyrotechnische artikelen voor theatergebruik: pyrotechnische artikelen die bestemd zijn voor binnenshuis of
      buitenshuis plaatsvindend podiumgebruik, met inbegrip van film- en TV-producties of soortgelijke vormen van
      gebruik;
        - Richtlijn 2007/23/EG: Richtlijn 2007/23/EG van het Europees Parlement en de Raad van 23 mei 2007 betreffende het
      in de handel brengen van pyrotechnische artikelen (PbEU L 154);
        - theatervuurwerk: met het oog op de opslag ervan door Onze Minister aangewezen pyrotechnische artikelen voor
      theatergebruik, ingedeeld in categorie T1 of categorie T2;
        - toepassingsvergunning: vergunning als bedoeld in [artikel 3B.1, eerste lid][ref7];
        - veiligheidsafstand: afstand die met het oog op de kwaliteit van het milieu voor zover het
      betreft externe veiligheid ten minste moet zijn gelegen tussen een inrichting als bedoeld in
      de [artikelen 2.2.1][ref8], [3.2.1][ref9] en [3A.2.1][ref10], of een onderdeel van een zodanige
      inrichting, dan wel een zodanige inrichting waarvoor het geldende bestemmingsplan dan wel de daarvoor
      geldende beheersverordening verlening van een vergunning voor het bouwen daarvan als bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder a, van de Wet algemene bepalingen omgevingsrecht][ref11] toelaat
      enerzijds en beperkt kwetsbare of kwetsbare objecten en geprojecteerde beperkt kwetsbare of kwetsbare objecten
      anderzijds;
        - vuurwerk: pyrotechnische artikelen ter vermaak;
        - werkdag: dag, niet zijnde een zondag of algemeen erkende feestdag in de zin van de
      [Algemene termijnenwet][ref12];
        - woning: gebouw of gedeelte van een gebouw dat voor bewoning is bestemd;
        - woonschip: schip dat voor bewoning is bestemd;
        - woonwagen: woonwagen als bedoeld in artikel 1, eerste lid, van [bijlage II bij het Besluit omgevingsrecht][ref13].


