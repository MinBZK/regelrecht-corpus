preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Verkeer en Waterstaat en van Onze Minister van Onderwijs en Wetenschappen
    van 3 maart 1983, nr. PJ/S 21384, Directoraat-Generaal Scheepvaart en Maritieme Zaken;


    Gelet op artikel 2, derde lid, van de Wet op de Zeevaartdiploma's 1935 (Stb. 456);


    De Raad van State gehoord (advies van 11 mei 1983, nr. W09.83.0183/14.3.18);


    Gezien het nader rapport van Onze voornoemde Ministers, van 5 augustus 1983 nr. PJ/S 25336, Directoraat-Generaal
    Scheepvaart en Maritieme Zaken;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003611/1994-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: >-
      1 De begripsbepalingen genoemd in artikel 1, eerste lid, van de Wet op de Zeevaartdiploma's 1935 (*Stb.* 456) zijn
      van toepassing.


      2 In dit besluit wordt verstaan onder:


      "Onze Minister": Onze Minister van Verkeer en Waterstaat;


      "school": een middelbare dagschool voor scheepswerktuigkundigen;


      "de Commissie": de in artikel 2, tweede lid, van het Examenreglement Zeevaartdiploma's (*Stb.* 1983, 452) genoemde
      Commissie;


      "diensttijd": de tijd, doorgebracht als bemanningslid aan boord van een in de vaart zijnd schip.
    url: https://wetten.overheid.nl/BWBR0003611/1994-01-01#Artikel1
  - number: '2'
    text: >-
      1 Aan degene die heeft voldaan aan de daarvoor bij of krachtens dit besluit gestelde voorwaarden wordt op zijn
      verzoek door Onze Minister het voorlopig diploma als scheepswerktuigkundige uitgereikt.


      2 Onze Minister stelt het model van het in het eerste lid genoemde diploma vast.
    url: https://wetten.overheid.nl/BWBR0003611/1994-01-01#Artikel2
  - number: '3'
    text: |-
      1 Ter verkrijging van het diploma, bedoeld in [artikel 2, eerste lid][ref1], dient de kandidaat:

      a. aan een school het eindexamen met goed gevolg te hebben afgelegd;

      b. daarna de in het tweede lid genoemde diensttijd te hebben behaald in de machinekamer van een zeeschip onder
      bijhouding van een praktijkboek, als bedoeld in [artikel 4][ref2].

      2 De diensttijd, bedoeld in het eerste lid, onder *b*, bedraagt:

      a. ten minste een jaar, indien de kandidaat voorafgaand aan het met goed gevolg afleggen van het eindexamen minder
      dan een half jaar dienst heeft gedaan in de machinekamer van zeeschepen;

      b. ten minste een half jaar, indien de kandidaat voorafgaand aan het met goed gevolg afleggen van het eindexamen
      ten minste een half jaar doch minder dan anderhalf jaar dienst heeft gedaan in de machinekamer van zeeschepen.

      3 Degene die voorafgaand aan het met goed gevolg afleggen van het eindexamen ten minste anderhalf jaar dienst
      heeft gedaan in de machinekamer van zeeschepen, behoeft geen diensttijd als bedoeld in het eerste lid, onder *b*,
      te behalen.

      4 Onder dienst, bedoeld in het tweede en derde lid, is tot ten hoogste 30 dagen begrepen dienst in de machinekamer
      buitengaats als leerling aan boord van een ten behoeve van het onderwijs aan de school gebezigd opleidingsschip.


      [ref1]: https://wetten.overheid.nl/BWBR0003611#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003611#Artikel4
    url: https://wetten.overheid.nl/BWBR0003611/1994-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003611
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003611
        artikel: '4'
  - number: '4'
    text: |-
      1 Het praktijkboek bevat opdrachten, die de kandidaat gedurende de diensttijd, bedoeld in
      [artikel 3, eerste lid, onder b][ref1], overeenkomstig de in het praktijkboek gegeven richtlijnen dient uit te
      voeren.

      2 Onze Minister stelt de richtlijnen en de opdrachten vast en bepaalt het model van het praktijkboek.

      3 Ter verkrijging van een praktijkboek wendt de kandidaat zich tot de voorzitter van de Commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0003611#Artikel3
    url: https://wetten.overheid.nl/BWBR0003611/1994-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003611
        artikel: '3'
  - number: '5'
    text: >-
      1 De kandidaat richt zich bij de uitvoering van de in het praktijkboek vervatte opdrachten naar de door of vanwege
      de kapitein gegeven aanwijzingen.


      2 Na uitvoering van de opdrachten dient het praktijkboek door de kapitein te worden ondertekend. De kandidaat zendt
      het ondertekende praktijkboek aan de voorzitter van de Commissie.


      3 Indien de voorzitter van de Commissie van oordeel is, dat het praktijkboek niet in alle opzichten naar behoren
      is bijgehouden, kan hij de kandidaat een of meer aanvullende opdrachten geven, die binnen een daarbij te bepalen
      termijn van ten hoogste zes maanden dienen te worden uitgevoerd. Het bepaalde in het eerste en tweede lid is van
      overeenkomstige toepassing.


      4 Zo spoedig mogelijk na ontvangst van het praktijkboek wordt de kandidaat meegedeeld of het is goedgekeurd. Indien
      het praktijkboek niet is goedgekeurd worden de kandidaat daarbij tevens de aanvullende opdrachten meegedeeld en de
      termijn waarbinnen hij deze dient uit te voeren.
    url: https://wetten.overheid.nl/BWBR0003611/1994-01-01#Artikel5
  - number: '6'
    text: >-
      De kapitein van het schip draagt er zorg voor dat degene die aan boord daarvan een praktijkboek dient bij te
      houden, de daarin vervatte opdrachten naar behoren kan verrichten.
    url: https://wetten.overheid.nl/BWBR0003611/1994-01-01#Artikel6
  - number: '7'
    text: >-
      De reder die iemand in de gelegenheid stelt op zijn schip of schepen de ingevolge dit besluit vereiste diensttijd
      onder bijhouding van een praktijkboek te behalen, draagt er zorg voor dat de belanghebbende gedurende die
      diensttijd praktisch wordt bekwaamd voor zijn toekomstige functie en dat hij en de kapitein in de gelegenheid
      worden gesteld op de juiste wijze uitvoering te geven aan het bij of krachtens dit besluit bepaalde.
    url: https://wetten.overheid.nl/BWBR0003611/1994-01-01#Artikel7
  - number: '8'
    text: >-
      Ter zake van de afgifte van een krachtens dit besluit uit te reiken diploma is een vergoeding verschuldigd volgens
      een door Onze Minister vast te stellen tarief.
    url: https://wetten.overheid.nl/BWBR0003611/1994-01-01#Artikel8
  - number: '9'
    text: |-
      Bij zijn verzoek om uitreiking van het diploma, genoemd in [artikel 2, eerste lid][ref1], dient de kandidaat aan
      Onze Minister over te leggen:

      a. de bewijsstukken met betrekking tot opleiding, praktijkboek en, ten genoegen van Onze Minister, van de behaalde
      diensttijd;

      b. een uittreksel uit het geboortenregister of, ten genoegen van Onze Minister, een identiteitsbewijs;

      c. het bewijs van betaling van de in [artikel 8][ref2] bedoelde vergoeding;

      d. een goed gelijkende pasfoto, zwart-wit, in drievoud.


      [ref1]: https://wetten.overheid.nl/BWBR0003611#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003611#Artikel8
    url: https://wetten.overheid.nl/BWBR0003611/1994-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003611
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003611
        artikel: '8'
  - number: '10'
    text: >-
      Een duplicaat van een uitgereikt diploma wordt slechts afgegeven, indien de belanghebbende aannemelijk kan maken
      dat het oorspronkelijke diploma verloren is geraakt. Tenzij het oorspronkelijke diploma verloren is geraakt
      ten gevolge van een oorlogsdaad, een scheepsramp of daarmee vergelijkbare voorvallen, is voor een duplicaat een
      vergoeding verschuldigd volgens een door Onze Minister vast te stellen tarief.
    url: https://wetten.overheid.nl/BWBR0003611/1994-01-01#Artikel10
  - number: '11'
    text: |-
      Onze Minister kan, indien daartoe naar zijn oordeel aanleiding bestaat, ontheffing of vrijstelling verlenen van het
      bepaalde in [artikel 3, eerste en tweede lid, onder][ref1] zo nodig door hem te stellen voorwaarden en beperkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003611#Artikel3
    url: https://wetten.overheid.nl/BWBR0003611/1994-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003611
        artikel: '3'
  - number: '12'
    text: >-
      Dit besluit kan worden aangehaald als "Besluit bijzondere verkrijging voorlopig diploma als
      scheepswerktuigkundige".
    url: https://wetten.overheid.nl/BWBR0003611/1994-01-01#Artikel12
  - number: '13'
    text: >-
      Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin het
      wordt geplaatst en werkt terug tot 1 mei 1981.
    url: https://wetten.overheid.nl/BWBR0003611/1994-01-01#Artikel13
