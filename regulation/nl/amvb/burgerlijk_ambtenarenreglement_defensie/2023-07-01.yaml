  - number: 30o.1
    text: |-
      De arbeidsduur van de ambtenaar van 18 jaar of ouder bedraagt ten hoogste 10 uren per dienst, in elke periode van
      4 achtereenvolgende weken ten hoogste gemiddeld 50 uren per week en in elke periode van 13 achtereenvolgende weken
      ten hoogste gemiddeld 45 uren per week.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30o
  - number: 30o.2
    text: |-
      De commandant dient over de toepassing van het eerste lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang het noodzakelijk maakt dat de ambtenaar meer dan 9 uren per
      dienst of meer dan 45 uren per week arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30o
  - number: 30o.3
    text: |-
      Indien het eerste en tweede lid niet wordt toegepast, dan bedraagt de arbeidsduur ten hoogste 9 uren per dienst,
      ten hoogste 45 uren per week en ten hoogste gemiddeld 40 uren per week in elke periode van 13 achtereenvolgende
      weken.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30o
  - number: 30o.4
    text: |-
      De arbeidsduur van de jeugdige ambtenaar bedraagt ten hoogste 9 uren per dienst, ten hoogste 45 uren per week en in
      elke periode van 4 achtereenvolgende weken ten hoogste gemiddeld 40 uren per week.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30o
  - number: 30p.1
    text: |-
      Van de in [artikel 30o][ref1] genoemde arbeidsduur kan voor de ambtenaar van 18 jaar of ouder worden afgeweken
      indien zich een onvoorziene wijziging van omstandigheden, incidenteel en niet periodiek, voordoet, of de aard van
      de arbeid, incidenteel en voor korte tijd, dergelijke afwijkingen noodzakelijk maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel30o
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30p
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 30o
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 30p.2
    text: |-
      De arbeidsduur bedraagt in situaties als bedoeld in het eerste lid ten hoogste 12 uren per dienst, ten hoogste 60
      uren per week en in elke periode van 13 achtereenvolgende weken ten hoogste gemiddeld 48 uren per week.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30p
  - number: 30p.3
    text: |-
      Op de afwijking, bedoeld in het eerste lid, is [artikel 31c, vierde lid, onderdelen b en c, en het zesde lid][ref1],
      niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel31c
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30p
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 31c
        hoofdstuk: '4'
        paragraaf: '7'
  - number: 30p.4
    text: |-
      Indien als gevolg van de toepassing van het eerste lid arbeid wordt verricht in nachtdienst, welke arbeid
      eindigt vóór of op 02.00 uur, dan zijn hierop de in [paragraaf 5][ref1] opgenomen bepalingen ten aanzien van het
      verrichten van arbeid in nachtdienst niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30p
    references:
      - id: ref1
        bwb_id: BWBR0006040
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 30q.1
    text: |-
      De ambtenaar van 18 jaar of ouder heeft in elke aaneengesloten tijdruimte van 24 uren recht op een onafgebroken
      rusttijd van ten minste 11 uren, welke rusttijd éénmaal in elke aaneengesloten tijdruimte van 7 maal 24 uren mag
      worden ingekort tot ten minste 8 uren.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30q
  - number: 30q.2
    text: |-
      De jeugdige ambtenaar heeft in elke aaneengesloten tijdruimte van 24 uren recht op een onafgebroken rusttijd van
      ten minste 12 uren, waarin de periode tussen hetzij 22.00 uur en 06.00 uur, hetzij 23.00 uur en 07.00 uur begrepen
      is.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30q
  - number: 30q.3
    text: |-
      De in de voorgaande leden bedoelde tijdruimte vangt aan op het eerste tijdstip van de dag, waarop de ambtenaar
      arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30q
  - number: 30r.1
    text: |-
      De ambtenaar van 18 jaar of ouder heeft recht op een onafgebroken rusttijd van hetzij ten minste 36 uren in elke
      aaneengesloten tijdruimte van 7 maal 24 uren, hetzij ten minste 60 uren in elke aaneengesloten tijdruimte van 9
      maal 24 uren. De voorgeschreven rusttijd van 60 uren mag éénmaal in elke periode van 5 achtereenvolgende weken
      worden bekort tot 32 uren.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30r
  - number: 30r.2
    text: |-
      De jeugdige ambtenaar heeft recht op een onafgebroken rusttijd van ten minste 36 uren in elke aaneengesloten
      tijdruimte van 7 maal 24 uren.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30r
  - number: 30r.3
    text: |-
      De in de voorgaande leden bedoelde tijdruimte vangt aan op het eerste tijdstip van de dag, waarop de ambtenaar
      arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30r
  - number: 30s.1
    text: |-
      Voor de ambtenaar van 18 jaar of ouder die arbeid in nachtdienst verricht, bedraagt de arbeidsduur ten hoogste 9
      uren per nachtdienst, in elke periode van 4 achtereenvolgende weken ten hoogste gemiddeld 50 uren per week en in
      elke periode van 13 achtereenvolgende weken ten hoogste gemiddeld 40 uren per week.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30s
  - number: 30s.2
    text: |-
      De commandant dient over de toepassing van het eerste lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang het noodzakelijk maakt dat de ambtenaar meer dan 8 uren per
      nachtdienst of meer dan 45 uren per week arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30s
  - number: 30s.3
    text: |-
      Indien het eerste en tweede lid niet wordt toegepast, dan bedraagt de arbeidsduur ten hoogste 8 uren per
      nachtdienst, ten hoogste 45 uren per week en ten hoogste gemiddeld 40 uren per week in elke periode van 13
      achtereenvolgende weken.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30s
  - number: 30t.1
    text: |-
      Van de in [artikel 30s][ref1] genoemde arbeidsduur kan voor de ambtenaar van 18 jaar of ouder worden afgeweken
      indien zich een onvoorziene wijziging van omstandigheden, incidenteel en niet periodiek, voordoet, of de aard van
      de arbeid, incidenteel en voor korte tijd, dergelijke afwijkingen noodzakelijk maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel30s
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30t
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 30s
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 30t.2
    text: |-
      De arbeidsduur bedraagt in situaties als bedoeld in het eerste lid ten hoogste 10 uren per nachtdienst, ten hoogste
      60 uren per week en in elke periode van 13 achtereenvolgende weken ten hoogste gemiddeld 40 uren per week.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30t
  - number: 30t.3
    text: |-
      Op de afwijking, bedoeld in het eerste lid, is [artikel 31c, vierde lid, onderdelen b en c, en het zesde lid][ref1],
      niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel31c
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30t
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 31c
        hoofdstuk: '4'
        paragraaf: '7'
  - number: 30u.1
    text: |-
      De ambtenaar van 18 jaar of ouder heeft na het verrichten van arbeid in nachtdienst, welke eindigt ná 02.00 uur,
      recht op een onafgebroken rusttijd van tenminste 14 uren, welke éénmaal in elke aaneengesloten tijdruimte van 7
      maal 24 uren mag worden bekort tot ten minste 8 uren.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30u
  - number: 30u.2
    text: |-
      De commandant dient over de toepassing van de in het eerste lid bedoelde bekorting van de onafgebroken rusttijd tot
      ten minste 8 uren overeenstemming te bereiken met de betrokken medezeggenschapscommissie, indien het dienstbelang
      toepassing noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30u
  - number: 30u.3
    text: |-
      De in het eerste lid bedoelde tijdruimte vangt aan op het eerste tijdstip van de dag, waarop de ambtenaar arbeid
      verricht.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30u
  - number: 30v.1
    text: |-
      De ambtenaar van 18 jaar of ouder verricht in elke periode van 13 achtereenvolgende weken niet meer dan ten hoogste
      52 maal arbeid in nachtdienst, indien de arbeid eindigt vóór of op 02.00 uur.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30v
  - number: 30v.2
    text: |-
      De commandant dient over de toepassing van het eerste lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang het noodzakelijk maakt dat de ambtenaar in een periode van 4
      achtereenvolgende weken meer dan 16 maal arbeid in nachtdienst verricht, indien de arbeid eindigt vóór of op 02.00
      uur.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30v
  - number: 30w.1
    text: |-
      De ambtenaar van 18 jaar of ouder verricht in elke periode van 13 achtereenvolgende weken niet meer dan ten hoogste
      28 maal arbeid in nachtdienst, indien de arbeid eindigt ná 02.00 uur.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30w
  - number: 30w.2
    text: |-
      De commandant dient over de toepassing van het eerste lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang het noodzakelijk maakt dat de ambtenaar in elke periode van 4
      achtereenvolgende weken meer dan 10 maal en in elke periode van13 achtereenvolgende weken meer dan 25 maal arbeid
      in nachtdienst verricht, indien die arbeid eindigt ná 02.00 uur.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30w
  - number: 30x.1
    text: |-
      In afwijking van [artikel 30w, eerste lid][ref1], kan de commandant dit artikel toepassen.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel30w
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30x
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 30w
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 30x.2
    text: |-
      Indien de aard van de arbeid met zich brengt dat arbeid in nachtdienst worden verricht en dit door het op een
      andere wijze organiseren van de arbeid redelijkerwijs niet is te voorkomen, verricht de ambtenaar van 18 jaar of
      ouder:
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30x
  - number: 30x.2.a
    text: hetzij ten hoogste 35 maal in elke periode van 13 achtereenvolgende weken arbeid in nachtdienst;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30x
  - number: 30x.2.b
    text: hetzij ten hoogste 20 uren in elke periode van 2 achtereenvolgende weken arbeid tussen 00.00 uur en 06.00 uur.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30x
  - number: 30x.3
    text: |-
      De commandant dient over de toepassing van het eerste en tweede lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang toepassing noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30x
  - number: 30y.1
    text: |-
      Na een reeks van ten minste 3 en ten hoogste 7 maal achtereen arbeid in nachtdienst te hebben verricht, heeft de
      ambtenaar van 18 jaar of ouder recht op een onafgebroken rusttijd van ten minste 48 uren.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30y
  - number: 30y.2
    text: |-
      De commandant dient over de toepassing van het eerste lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang noodzakelijk maakt dat de ambtenaar 7 maal achtereen arbeid in
      nachtdienst verricht die eindigt vóór of op 02.00 uur, hetzij 6 of 7 maal achtereen arbeid in nachtdienst verricht
      die eindigt ná 02.00 uur.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30y
  - number: 30y.3
    text: 'Indien het eerste en tweede lid niet wordt toegepast, dan heeft de ambtenaar,:'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30y
  - number: 30y.3.a
    text: |-
      na een reeks van ten minste 3 en ten hoogste 6 maal achtereen arbeid in nachtdienst te hebben verricht, die eindigt
      vóór of op 02.00 uur;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30y
  - number: 30y.3.b
    text: |-
      hetzij na een reeks van ten minste 3 en ten hoogste 5 maal achtereen arbeid in nachtdienst te hebben verricht, die
      eindigt ná 02.00 uur,
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30y
  - number: 30z.1
    text: |-
      In afwijking van [artikel 30s, eerste lid][ref1], en [artikel 30t, tweede lid][ref2], ten aanzien van het gemiddeld
      aantal uren per week in elke periode van 13 achtereenvolgende weken dat arbeid in nachtdienst wordt verricht, kan
      de commandant dit artikel toepassen.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel30s
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel30t
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30z
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 30s
        hoofdstuk: '4'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: 30t
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 30z.2
    text: |-
      Indien zich een onvoorziene wijziging van omstandigheden voordoet of de aard van de arbeid het noodzakelijk maakt
      dat de ambtenaar van 18 jaar of ouder slechts incidenteel of voor korte tijd arbeid in nachtdienst verricht en dit
      door het op een andere wijze organiseren van de arbeid redelijkerwijs niet is te voorkomen, verricht de ambtenaar
      in elke periode van 52 achtereenvolgende weken gemiddeld 40 uren per week arbeid.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30z
  - number: 30z.3
    text: |-
      De commandant dient over de toepassing van het eerste en tweede lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang toepassing noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30z
  - number: 31a.1
    text: |-
      In afwijking van de [artikelen 30o][ref1], [30p][ref2], [30s][ref3], en [30t][ref4], ten aanzien van de arbeidsduur
      per dienst onderscheidenlijk per nachtdienst, kan de commandant dit artikel toepassen.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel30o
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel30p
      [ref3]: https://wetten.overheid.nl/BWBR0006040#Artikel30s
      [ref4]: https://wetten.overheid.nl/BWBR0006040#Artikel30t
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 30o
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: 30p
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0006040
        artikel: 30s
        hoofdstuk: '4'
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0006040
        artikel: 30t
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 31a.2
    text: |-
      Indien de arbeid geen uitstel gedogen, en door het nemen van andere maatregelen redelijkerwijs niet is te
      voorkomen, verricht de ambtenaar van 18 jaar of ouder ten hoogste éénmaal in elke periode van 2 achtereenvolgende
      weken 14 uren arbeid per dienst onderscheidenlijk per nachtdienst.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31a
  - number: 31a.3
    text: |-
      Het tweede lid is eveneens van toepassing, indien de arbeid wordt verstoord door een zich plotseling voordoende
      situatie:
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31a
  - number: 31a.3.a
    text: waarbij personen ernstig letsel oplopen, dan wel daartoe de onmiddellijke dreiging bestaat;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31a
  - number: 31a.3.b
    text: waarbij buitengewoon ernstige schade aan goederen ontstaat, dan wel dreigt te ontstaan.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31a
  - number: 31b.1
    text: |-
      De commandant kan, in afwijking van de in dit hoofdstuk opgenomen bepalingen ten aanzien van de arbeidsduur per
      dienst onderscheidenlijk per nachtdienst en de onafgebroken rusttijd, dit artikel toepassen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31b
  - number: 31b.2
    text: |-
      De arbeidsduur per dienst of per nachtdienst onderscheidenlijk de onafgebroken rusttijd wordt met ten hoogste
      15 achtereenvolgende minuten verlengd onderscheidenlijk ingekort, indien de arbeid van de ambtenaar van 18 jaar
      of ouder aan het eind van de dienst wordt overgenomen en direct daaropvolgend worden voortgezet door een andere
      ambtenaar en de goede voortgang van die arbeid overdracht noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31b
  - number: 31b.3
    text: |-
      Op de afwijking bedoeld in het tweede lid zijn de [artikelen 30v][ref1], [30w][ref2] en [30x][ref3], ten aanzien
      van het aantal malen dat arbeid in nachtdienst wordt verricht, niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel30v
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel30w
      [ref3]: https://wetten.overheid.nl/BWBR0006040#Artikel30x
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31b
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 30v
        hoofdstuk: '4'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: 30w
        hoofdstuk: '4'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0006040
        artikel: 30x
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 31c.1
    text: |-
      Indien de arbeidsduur van de ambtenaar van 18 jaar of ouder meer dan 5½ uur per dienst bedraagt, dan wordt de
      arbeid afgewisseld door een pauze.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31c
  - number: 31c.2
    text: |-
      De in het eerste lid bedoelde pauze bedraagt ten minste een half uur aaneengesloten, welke mag worden gesplitst in
      twee pauzes van ten minste 15 achtereenvolgende minuten.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31c
  - number: 31c.3
    text: |-
      De commandant dient over de toepassing van het tweede lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang toepassing noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31c
  - number: 31c.4
    text: |-
      Indien het tweede lid niet wordt toegepast, dan wordt, met inachtneming van het eerste lid, de arbeid van de
      ambtenaar:
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31c
  - number: 31c.4.a
    text: |-
      indien hij niet meer dan 8 uren arbeid per dienst of nachtdienst verricht, afgewisseld door pauzes van tezamen ten
      minste een half uur;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31c
  - number: 31c.4.b
    text: |-
      indien hij meer dan 8 uren, doch niet meer dan 10 uren arbeid per dienst of nachtdienst verricht, afgewisseld door
      pauzes van tezamen ten minste 45 minuten;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31c
  - number: 31c.4.c
    text: |-
      indien hij meer dan 10 uren arbeid per dienst of nachtdienst verricht, afgewisseld door pauzes van tezamen ten
      minste 1 uur.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31c
  - number: 31c.5
    text: Eén van de pauzes, bedoeld in het vierde lid, bedraagt ten minste een half uur aaneengesloten.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31c
  - number: 31c.6
    text: |-
      De pauzes, bedoeld in het vierde lid, vangen aan en eindigen in de periode, gelegen tussen 2 uren na de aanvang en
      2 uren voor het einde van de arbeid.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31c
  - number: 31d.1
    text: |-
      Indien de arbeidsduur van de jeugdige ambtenaar meer dan 4 ½ uur per dienst bedraagt, dan wordt de arbeid
      afgewisseld door een pauze.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31d
  - number: 31d.2
    text: |-
      De in het eerste lid bedoelde pauze bedraagt ten minste een half uur aaneengesloten, welke mag worden gesplitst in
      twee pauzes van ten minste 15 achtereenvolgende minuten.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31d
  - number: 31d.3
    text: |-
      De commandant dient over de toepassing van het tweede lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang toepassing noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31d
  - number: 31d.4
    text: |-
      Indien het tweede lid niet wordt toegepast, dan wordt, met inachtneming van het eerste lid, de arbeid van de
      jeugdige ambtenaar:
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31d
  - number: 31d.4.a
    text: |-
      indien hij niet meer dan 8 uren arbeid per dienst verricht, afgewisseld door pauzes van tezamen ten minste een
      half uur;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31d
  - number: 31d.4.b
    text: indien hij meer dan 8 uren arbeid per dienst verricht, afgewisseld door pauzes van tezamen ten minste 45 minuten.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31d
  - number: 31d.5
    text: Eén van de pauzes, bedoeld in het vierde lid, bedraagt ten minste een half uur aaneengesloten.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31d
  - number: 31d.6
    text: |-
      De pauzes, bedoeld in het vierde lid, vangen aan en eindigen in de periode, gelegen tussen 2 uren na de aanvang en
      2 uren voor het einde van de arbeid.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31d
  - number: 31e.1
    text: |-
      De commandant kan van het bepaalde in [artikel 30a, onderdeel h][ref1], en [artikel 31j, tweede lid][ref2],
      afwijken, indien de aard van de arbeid van de ambtenaar van 18 jaar of ouder het noodzakelijk maakt dat hij tijdens
      de pauze bereikbaar is onderscheidenlijk op de werkplek aanwezig is om op oproep zo spoedig mogelijk die arbeid te
      verrichten, en dit door het op een andere wijze organiseren van de arbeid redelijkerwijs niet is te voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel30a
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel31j
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31e
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 30a
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: 31j
        hoofdstuk: '4'
        paragraaf: '9'
  - number: 31e.2
    text: |-
      De commandant dient over de toepassing van het eerste lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang toepassing noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31e
  - number: 31e.3
    text: |-
      Voor de toepassing van het eerste lid geldt de tijd tijdens de werkplekgebonden pauze waarop de arbeid van de
      ambtenaar zich uitsluitend beperkt tot de verplichte aanwezigheid op de werkplek, als pauze.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31e
  - number: 31f.1
    text: |-
      De commandant kan van het bepaalde in [artikel 31c, eerste lid][ref1], afwijken, indien de ambtenaar van 18 jaar
      of ouder:


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel31c
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31f
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 31c
        hoofdstuk: '4'
        paragraaf: '7'
  - number: 31f.1.a
    text: arbeid verricht zonder enig direct contact met een andere ambtenaar die vergelijkbare arbeid verricht, of
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31f
  - number: 31f.1.b
    text: |-
      indien de aard van de arbeid met zich brengt dat de afwisseling van de arbeid per dienst onderscheidenlijk
      per nachtdienst door een pauze onmogelijk is en dit door het op een andere wijze organiseren van de arbeid
      redelijkerwijs niet is te voorkomen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31f
  - number: 31f.2
    text: |-
      De commandant dient over de toepassing van het eerste lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang toepassing noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31f
  - number: 31f.3
    text: |-
      Indien het eerste lid wordt toegepast, verricht de ambtenaar in elke periode van 52 achtereenvolgende weken ten
      hoogste gemiddeld 40 uren per week arbeid.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31f
  - number: 31f.4
    text: |-
      Indien het eerste lid wordt toegepast, verricht de ambtenaar in afwijking van [artikel 31i, tweede lid][ref1], en
      [artikel 31o, tweede lid][ref2], ten hoogste 12 uren per dienst onderscheidenlijk per nachtdienst arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel31i
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel31o
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31f
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 31i
        hoofdstuk: '4'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: 31o
        hoofdstuk: '4'
        paragraaf: '10'
  - number: 31g.1
    text: |-
      Op zaterdag en zondag wordt aan de ambtenaar geen arbeid opgedragen. Hiervan kan slechts worden afgeweken indien
      naar het oordeel van de commandant het dienstbelang zulks onvermijdelijk maakt. Indien de jeugdige ambtenaar op
      zondag arbeid verricht, dan wordt door hem op de dag voorafgaande aan die zondag geen dienst verricht.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31g
  - number: 31g.2
    text: |-
      Het eerste lid geldt mede voor Nieuwjaarsdag, Eerste en Tweede Paasdag, Hemelvaartsdag, Eerste en Tweede
      Pinksterdag, Eerste en Tweede Kerstdag, Koninginnedag en 5 mei en de door Onze Minister aan te wijzen feest- of
      gedenkdagen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31g
  - number: 31g.3
    text: De ambtenaar verricht geen arbeid op ten minste 26 zondagen per periode van 52 weken.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31g
  - number: 31g.4
    text: |-
      Indien naar het oordeel van de commandant de belangen van de dienst zich hiertegen niet verzetten, wordt de
      ambtenaar, aan wie op een zondag of een dag als bedoeld in het tweede lid, dienst is opgedragen, tijdens de
      werktijd in de gelegenheid gesteld de godsdienstuitoefening van de gezindte waartoe hij behoort bij te wonen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31g
  - number: 31h.1
    text: |-
      In afwijking van de [artikelen 30p][ref1] en [30t][ref2] ten aanzien van de arbeidsduur per dienst
      onderscheidenlijk per nachtdienst kan de commandant dit artikel toepassen.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel30p
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel30t
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31h
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 30p
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: 30t
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 31h.2
    text: |-
      Indien de aard van de arbeid, of de bedrijfsomstandigheden, in verband met de Nieuwjaarsdag, Eerste en Tweede
      Paasdag, Hemelvaartsdag, Eerste en Tweede Pinksterdag, Eerste en Tweede Kerstdag, Koninginnedag of 5 december dit
      noodzakelijk maakt, verricht de ambtenaar van 18 jaar of ouder in de aaneengesloten periode van 7 dagen voorafgaand
      aan die dag ten hoogste tweemaal 14 uren per dienst onderscheidenlijk per nachtdienst arbeid.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31h
  - number: 31h.3
    text: |-
      De commandant dient over de toepassing van het eerste en tweede lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang toepassing noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31h
  - number: 31h.4
    text: |-
      [Artikel 31a][ref1] is niet van toepassing indien het eerste en tweede lid wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel31a
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31h
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 31a
        hoofdstuk: '4'
        paragraaf: '6'
  - number: 31i.1
    text: |-
      In afwijking van [artikel 30o, eerste lid][ref1], en [artikel 30s, eerste lid][ref2], ten aanzien van de
      arbeidsduur per dienst onderscheidenlijk per nachtdienst, en [artikel 30u, eerste lid][ref3], ten aanzien van de
      onafgebroken rusttijd na een nachtdienst, kan de commandant dit artikel toepassen.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel30o
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel30s
      [ref3]: https://wetten.overheid.nl/BWBR0006040#Artikel30u
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31i
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 30o
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: 30s
        hoofdstuk: '4'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0006040
        artikel: 30u
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 31i.2
    text: |-
      De ambtenaar van 18 jaar of ouder verricht, in verband met de Nieuwjaarsdag, Eerste en Tweede Paasdag,
      Hemelvaartsdag, Eerste en Tweede Pinksterdag en Eerste en Tweede Kerstdag, in de tijdruimte tussen de dag
      voorafgaand aan bedoelde dagen 18.00 uur en de op deze dagen volgende dag 08.00 uur ten hoogste 11 uren per dienst
      onderscheidenlijk per nachtdienst arbeid. De ambtenaar heeft na het verrichten van die arbeid een onafgebroken
      rusttijd van ten minste 12 uren.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31i
  - number: 31i.3
    text: |-
      Indien het eerste en tweede lid wordt toegepast, dan organiseert de commandant de arbeid zodanig, dat zoveel
      mogelijk ambtenaren op de in het tweede lid bedoelde dagen geen arbeid verricht in de tijdruimte gelegen tussen
      00.00 uur en de daarop volgende dag 06.00 uur.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31i
  - number: 31i.4
    text: |-
      De commandant dient over de toepassing van het eerste en tweede lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang toepassing noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31i
  - number: 31j.1
    text: De commandant kan de ambtenaar van 18 jaar of ouder consignatie opleggen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31j
  - number: 31j.2
    text: |-
      Ten minste gedurende 2 maal een aaneengesloten tijdruimte van 7 maal 24 uren in elke periode van 4
      achtereenvolgende weken wordt geen consignatie opgelegd.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31j
  - number: 31j.3
    text: |-
      Tijdens de onafgebroken rusttijd direct voorafgaand aan en direct volgend op een nachtdienst wordt geen consignatie
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31j
  - number: 31j.4
    text: |-
      Als consignatie wordt opgelegd bedraagt de arbeidsduur ten hoogste 13 uren in elke periode van 24 achtereenvolgende
      uren, ten hoogste 60 uren per week en ten hoogste gemiddeld 45 uren per week in elke periode van 13
      achtereenvolgende weken.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31j
  - number: 31j.5
    text: |-
      Indien de consignatie geheel of gedeeltelijk de periode van 00.00 uur tot 06.00 uur bestrijkt, bedraagt de
      arbeidsduur, in afwijking van het vorige lid ten hoogste 13 uren in elke periode van 24 achtereenvolgende uren, ten
      hoogste 60 uren per week en ten hoogste gemiddeld 40 uren per week in elke periode van 13 achtereenvolgende weken.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31j
  - number: 31j.6
    text: |-
      Voor de toepassing van het vierde en vijfde lid vangt de arbeid aan op het moment van de oproep. Indien binnen
      een half uur na beëindiging van de arbeid die voortvloeit uit een oproep opnieuw een oproep wordt gedaan, wordt de
      tussenliggende tijd gerekend tot de arbeidsduur. Indien binnen een half uur één of meer keren arbeid voortvloeiend
      uit een oproep wordt verricht, wordt de arbeidsduur geacht ten minste een half uur te bedragen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31j
  - number: 31j.7
    text: |-
      De arbeid die voortvloeit uit een oproep wordt voor de toepassing van de in dit hoofdstuk opgenomen bepalingen ten
      aanzien van rusttijd en pauze buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31j
  - number: 31j.8
    text: |-
      Op de arbeid die voortvloeit uit een oproep zijn de bepalingen in [paragraaf 5][ref1] ten aanzien van het aantal
      malen dat arbeid in nachtdienst wordt verricht niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31j
    references:
      - id: ref1
        bwb_id: BWBR0006040
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 31k.1
    text: |-
      In afwijking van [artikel 31j, tweede lid][ref1], kan de commandant de ambtenaar van 18 jaar of ouder ten
      hoogste 3 maal in elke aaneengesloten tijdruimte van 7 maal 24 uren en ten hoogste 26 maal in elke periode van 13
      achtereenvolgende weken een aanwezigheidsdienst opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel31j
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31k
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 31j
        hoofdstuk: '4'
        paragraaf: '9'
  - number: 31k.2
    text: |-
      In afwijking van het eerste lid kan de commandant de ambtenaar gedurende ten hoogste 6 weken in elke periode van 52
      achtereenvolgende weken ten hoogste 4 maal in elke aaneengesloten tijdruimte van 7 maal 24 uren en ten hoogste 26
      maal in elke periode van 13 achtereenvolgende weken een aanwezigheidsdienst opleggen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31k
  - number: 31k.3
    text: |-
      Als het tweede lid wordt toegepast heeft de ambtenaar na de aanwezigheidsdienst of reeks van aaneengesloten
      aanwezigheidsdiensten een onafgebroken rusttijd die ten minste even lang is als de voorafgaande aanwezigheidsdienst
      onderscheidenlijk reeks van aaneengesloten aanwezigheidsdiensten.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31k
  - number: 31k.4
    text: |-
      Tijdens de onafgebroken rusttijd direct voorafgaand aan en direct volgend op een nachtdienst wordt geen
      aanwezigheidsdienst opgelegd.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31k
  - number: 31k.5
    text: |-
      Als een aanwezigheidsdienst wordt opgelegd bedraagt de arbeidsduur ten hoogste 13 uren in elke periode van 24
      achtereenvolgende uren, ten hoogste 60 uren per week en ten hoogste gemiddeld 45 uren per week in elke periode van
      13 achtereenvolgende weken.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31k
  - number: 31k.6
    text: |-
      Indien de aanwezigheidsdienst geheel of gedeeltelijk de periode van 00.00 uur tot 06.00 uur bestrijkt, bedraagt de
      arbeidsduur, in afwijking van het vorige lid ten hoogste 13 uren in elke periode van 24 achtereenvolgende uren, ten
      hoogste 60 uren per week en ten hoogste gemiddeld 40 uren per week in elke periode van 13 achtereenvolgende weken.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31k
  - number: 31k.7
    text: |-
      Voor de toepassing van dit artikel geldt de tijd tijdens een aanwezigheidsdienst, waarbij de dienst van de
      ambtenaar zich uitsluitend beperkt tot de verplichte aanwezigheid op de werkplek, als rusttijd.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31k
  - number: 31k.8
    text: |-
      Voor de toepassing van het vijfde en zesde lid vangt de arbeidsduur aan op het moment van de oproep. Indien binnen
      een half uur na beëindiging van de arbeid die voortvloeit uit een oproep opnieuw een oproep wordt gedaan, wordt de
      tussenliggende tijd gerekend tot de arbeidsduur. Indien binnen een half uur één of meer keren arbeid voortvloeiend
      uit een oproep wordt verricht, wordt de arbeidsduur geacht ten minste een half uur te bedragen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31k
  - number: 31k.9
    text: |-
      De arbeid die voortvloeit uit een oproep wordt voor de toepassing van de in dit hoofdstuk opgenomen bepalingen ten
      aanzien van rusttijd en pauze buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31k
  - number: 31k.10
    text: |-
      Op de arbeid die voortvloeit uit een oproep zijn de bepalingen in [paragraaf 5][ref1], ten aanzien van het aantal
      malen dat arbeid in nachtdienst wordt verricht, niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31k
    references:
      - id: ref1
        bwb_id: BWBR0006040
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 31l.1
    text: |-
      Dit artikel is uitsluitend van toepassing op de ambtenaar van 18 jaar of ouder die met goed gevolg een
      brandweeropleiding heeft afgesloten en die als zodanig werkzaam is, alsmede de ambtenaar van 18 jaar of ouder die
      in directe samenhang met voornoemde ambtenaar arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31l
  - number: 31l.2
    text: |-
      In afwijking van [artikel 31j, tweede lid][ref1], kan de commandant de ambtenaar ten hoogste 4 maal in elke
      aaneengesloten tijdruimte van 7 maal 24 uren, ten hoogste 46 maal in elke periode van 13 achtereenvolgende weken en
      ten hoogste 124 maal in elke periode van 52 achtereenvolgende weken een aanwezigheidsdienst opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel31j
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31l
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 31j
        hoofdstuk: '4'
        paragraaf: '9'
  - number: 31l.3
    text: 'Indien het tweede lid wordt toegepast dan:'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31l
  - number: 31l.3.a
    text: |-
      heeft de ambtenaar vóór en ná een aanwezigheidsdienst een onafgebroken rusttijd van ten minste 11 uren, welke
      rusttijd éénmaal in elke aaneengesloten tijdruimte van 7 maal 24 uren mag worden ingekort tot ten minste 8 uren;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31l
  - number: 31l.3.b
    text: |-
      bedraagt de arbeidsduur ten hoogste 10 uren in elke periode van 24 achtereenvolgende uren en in elke periode van 13
      achtereenvolgende weken ten hoogste gemiddeld 45 uren per week.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31l
  - number: 31l.4
    text: |-
      Het derde lid, onderdeel a, blijft buiten toepassing, indien zich incidentele en onvoorziene omstandigheden
      voordoen waardoor het aantal ambtenaren dat nodig is onder het vereiste minimum komt, die een dergelijke afwijking
      noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31l
  - number: 31l.5
    text: |-
      Voor de toepassing van dit artikel geldt de tijd tijdens een aanwezigheidsdienst, waarbij de dienst van de
      ambtenaar zich uitsluitend beperkt tot de verplichte aanwezigheid op de werkplek, als rusttijd.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31l
  - number: 31l.6
    text: |-
      Voor de toepassing van het derde lid, onderdeel b, vangt de arbeidsduur aan op het moment van de oproep. Indien
      binnen een half uur na beëindiging van de arbeid die voortvloeit uit een oproep opnieuw een oproep wordt gedaan,
      wordt de tussenliggende tijd gerekend tot de arbeidsduur. Indien binnen een half uur één of meer keren arbeid
      voortvloeiend uit een oproep wordt verricht, wordt de arbeidsduur geacht ten minste een half uur te bedragen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31l
  - number: 31l.7
    text: |-
      De arbeid die voortvloeit uit een oproep wordt voor de toepassing van de in dit hoofdstuk opgenomen bepalingen ten
      aanzien van rusttijd en pauze buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31l
  - number: 31l.8
    text: |-
      Op de arbeid die voortvloeit uit een oproep zijn de bepalingen in [paragraaf 5][ref1], ten aanzien van het aantal
      malen dat arbeid in nachtdienst wordt verricht, niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31l
    references:
      - id: ref1
        bwb_id: BWBR0006040
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 31m.1
    text: |-
      In afwijking van [artikel 31j, tweede lid][ref1], kan de commandant de ambtenaar van 18 jaar of ouder ten hoogste
      een aaneengesloten tijdruimte van 7 maal 24 uren piket opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel31j
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31m
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 31j
        hoofdstuk: '4'
        paragraaf: '9'
  - number: 31m.2
    text: |-
      Als piket wordt opgelegd, dan wordt de ambtenaar ten minste gedurende 8 maal een aaneengesloten tijdruimte van
      7 maal 24 uren in elke periode van 13 achtereenvolgende weken geen piket, aanwezigheidsdienst of consignatie
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31m
  - number: 31m.3
    text: |-
      Tijdens de onafgebroken rusttijd direct voorafgaand aan en direct volgend op een nachtdienst wordt geen piket
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31m
  - number: 31m.4
    text: |-
      Als piket wordt opgelegd bedraagt de arbeidsduur ten hoogste 13 uren in elke periode van 24 achtereenvolgende uren,
      ten hoogste 60 uren per week en ten hoogste gemiddeld 45 uren per week in elke periode van 13 achtereenvolgende
      weken.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31m
  - number: 31m.5
    text: |-
      Indien het piket geheel of gedeeltelijk de periode van 00.00 uur tot 06.00 uur bestrijkt, bedraagt de arbeidsduur,
      in afwijking van het vorige lid ten hoogste 13 uren in elke periode van 24 achtereenvolgende uren, ten hoogste 60
      uren per week en ten hoogste gemiddeld 40 uren per week in elke periode van 13 achtereenvolgende weken.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31m
  - number: 31m.6
    text: |-
      Voor de toepassing van dit artikel geldt de tijd tijdens het piket waarbij de dienst van de ambtenaar zich
      uitsluitend beperkt tot de verplichte aanwezigheid op de werkplek als rusttijd.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31m
  - number: 31m.7
    text: |-
      Voor de toepassing van het vierde en vijfde lid vangt de arbeidsduur aan op het moment van de oproep. Indien binnen
      een half uur na beëindiging van de arbeid die voortvloeit uit een oproep opnieuw een oproep wordt gedaan, wordt de
      tussenliggende tijd gerekend tot de arbeidsduur. Indien binnen een half uur één of meer keren arbeid voortvloeiend
      uit een oproep wordt verricht, wordt de arbeidsduur geacht ten minste een half uur te bedragen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31m
  - number: 31m.8
    text: |-
      De arbeid die voortvloeit uit een oproep wordt voor de toepassing van de in dit hoofdstuk opgenomen bepalingen ten
      aanzien van rusttijd en pauze buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31m
  - number: 31m.9
    text: |-
      Op de arbeid die voortvloeit uit een oproep zijn de bepalingen in [paragraaf 5][ref1] ten aanzien van het aantal
      malen dat arbeid in nachtdienst wordt verricht niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31m
    references:
      - id: ref1
        bwb_id: BWBR0006040
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 31n
    text: |-
      Deze paragraaf is uitsluitend van toepassing op arbeid in continu- of ploegendienst, die door de ambtenaar van 18
      jaar of ouder wordt verricht.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31n
  - number: 31o.1
    text: |-
      In afwijking van [artikel 30o, eerste lid][ref1], en [artikel 30s, eerste lid][ref2], ten aanzien van de
      arbeidsduur per dienst onderscheidenlijk per nachtdienst, en [artikel 30u, eerste lid][ref3], ten aanzien van de
      onafgebroken rusttijd na een nachtdienst, kan de commandant dit artikel toepassen.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel30o
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel30s
      [ref3]: https://wetten.overheid.nl/BWBR0006040#Artikel30u
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31o
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 30o
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: 30s
        hoofdstuk: '4'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0006040
        artikel: 30u
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 31o.2
    text: |-
      De ambtenaar verricht in de tijdruimte gelegen tussen vrijdag 18.00 uur en de daaropvolgende maandag 08.00 uur ten
      hoogste 11 uren per dienst onderscheidenlijk per nachtdienst arbeid.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31o
  - number: 31o.3
    text: |-
      Indien het eerste en tweede lid wordt toegepast heeft de ambtenaar na het verrichten van die arbeid een
      onafgebroken rusttijd van ten minste 12 uren, en verricht hij ten minste 2 maal in elke periode van 4
      achtereenvolgende weken geen arbeid in de tijdruimte gelegen tussen zaterdag 00.00 uur en de daaropvolgende maandag
      06.00 uur.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31o
  - number: 31o.4
    text: |-
      De commandant dient over de toepassing van het eerste en tweede lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang toepassing noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31o
  - number: 31p.1
    text: |-
      In afwijking van [artikel 30r, eerste lid][ref1], kan de commandant dit artikel toepassen.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel30r
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31p
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 30r
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 31p.2
    text: |-
      De ambtenaar heeft recht op een onafgebroken rusttijd van ten minste 92 uren in elke aaneengesloten tijdruimte
      van 11 maal 24 uren, welke rusttijd éénmaal in elke periode van 5 achtereenvolgende weken mag worden bekort tot
      72 uren.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31p
  - number: 31p.3
    text: |-
      De commandant dient over de toepassing van het eerste en tweede lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang toepassing noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31p
  - number: 31p.4
    text: |-
      Indien het eerste en tweede lid niet wordt toegepast, dan heeft de ambtenaar recht op een onafgebroken rusttijd van
      hetzij ten minste 36 uren in elke aaneengesloten tijdruimte van 7 maal 24 uren, hetzij ten minste 92 uren in elke
      aaneengesloten tijdruimte van 11 maal 24 uren.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31p
  - number: 31p.5
    text: |-
      De in het tweede en vierde lid bedoelde tijdruimte vangt aan op het eerste tijdstip van de dag, waarop de ambtenaar
      arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31p
  - number: 31q.1
    text: |-
      In afwijking van [artikel 31c, tweede lid][ref1], kan de commandant dit artikel toepassen.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel31c
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31q
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 31c
        hoofdstuk: '4'
        paragraaf: '7'
  - number: 31q.2
    text: |-
      Indien de arbeidsduur meer dan 5½ uur per dienst bedraagt, dan wordt de arbeid van de ambtenaar afgewisseld door
      een pauze.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31q
  - number: 31q.3
    text: |-
      De commandant dient over de toepassing van het eerste en tweede lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang toepassing noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31q
  - number: 31r.1
    text: |-
      Indien zich incidentele en onvoorziene omstandigheden voordoen, waardoor het aantal ambtenaren in een ploeg onder
      het vereiste minimum komt, kan de commandant afwijken van [artikel 30s, eerste lid][ref1], ten aanzien van de
      arbeidsduur per nachtdienst, en [artikel 30u, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel30s
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel30u
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31r
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 30s
        hoofdstuk: '4'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: 30u
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 31r.2
    text: |-
      Onverminderd het gestelde in [artikel 31i][ref1], en [artikel 31o][ref2] ten aanzien van de zondag,:


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel31i
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel31o
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31r
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 31i
        hoofdstuk: '4'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: 31o
        hoofdstuk: '4'
        paragraaf: '10'
  - number: 31r.2.a
    text: |-
      verricht de ambtenaar bij toepassing van het eerste lid gedurende ten hoogste 2 maal in elke periode van
      4 achtereenvolgende weken en 8 maal in elke periode van 52 achtereenvolgende weken, ten hoogste 11 uur per
      nachtdienst arbeid;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31r
  - number: 31r.2.b
    text: heeft de ambtenaar na het verrichten van die arbeid recht op een onafgebroken rusttijd van ten minste 12 uren.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31r
  - number: 31r.3
    text: |-
      De commandant dient over de toepassing van het eerste en tweede lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang toepassing noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31r
  - number: 31s.1
    text: |-
      De arbeid van een zwangere ambtenaar wordt zodanig ingericht, dat rekening wordt gehouden met haar specifieke
      omstandigheden. De commandant voldoet, met inachtneming van het tweede tot en met vijfde lid, aan de voor hem
      uit de eerste volzin voortvloeiende verplichting binnen een redelijke termijn nadat een aanvraag daartoe door de
      zwangere ambtenaar is gedaan. Bij deze aanvraag wordt desgevraagd een schriftelijke verklaring overgelegd van een
      geneeskundige of een verloskundige waaruit blijkt, dat de betrokken ambtenaar zwanger is.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31s
  - number: 31s.2
    text: |-
      De zwangere ambtenaar heeft het recht de arbeid af te wisselen met één of meer pauzes buiten die bedoeld in
      [artikel 31c][ref1]. Deze extra pauze onderscheidenlijk pauzes bedragen tezamen ten minste 15 minuten en ten
      hoogste één achtste deel van de voor haar geldende arbeidsduur per dienst of nachtdienst. De in de vorige volzin
      bedoelde pauzes gelden voor de toepassing van dit hoofdstuk als arbeidsduur.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel31c
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31s
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 31c
        hoofdstuk: '4'
        paragraaf: '7'
  - number: 31s.3
    text: |-
      De zwangere ambtenaar heeft het recht arbeid te verrichten in een bestendig en regelmatig werk- en
      rusttijdenpatroon.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31s
  - number: 31s.4
    text: |-
      De zwangere ambtenaar kan niet worden verplicht arbeid te verrichten anders dan op grond van [artikel 30o][ref1]
      is toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel30o
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31s
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 30o
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 31s.5
    text: |-
      De zwangere ambtenaar kan niet worden verplicht arbeid te verrichten in nachtdienst, tenzij de commandant
      aannemelijk maakt dat dit redelijkerwijs niet van hem kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31s
  - number: 31s.6
    text: |-
      De commandant stelt de zwangere ambtenaar in de gelegenheid de noodzakelijke zwangerschapsonderzoeken te
      ondergaan. De tijd van de in de vorige volzin bedoelde onderzoeken gelden voor de toepassing van dit hoofdstuk
      als arbeidsduur.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31s
  - number: 31t
    text: 'De commandant organiseert de arbeid zodanig, dat een vrouwelijke ambtenaar:'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31t
  - number: 31t.a
    text: |-
      geen arbeid verricht binnen 28 dagen voor de vermoedelijke datum van de bevalling, zoals die is aangegeven in
      een door de vrouwelijke ambtenaar aan de commandant overgelegde schriftelijke verklaring van een geneeskundige of
      verloskundige waaruit de vermoedelijke datum van bevalling blijkt. Het in de eerste volzin bedoelde tijdvak wordt
      verlengd met het tijdvak dat verloopt tussen de vermoedelijke datum van de bevalling en de werkelijke datum van
      de bevalling;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31t
  - number: 31t.b
    text: geen arbeid verricht binnen 42 dagen na haar bevalling.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31t
  - number: 31u
    text: |-
      [Artikel 31s][ref1] is, met uitzondering van het zesde lid, van overeenkomstige toepassing gedurende een periode
      van 6 maanden na de bevalling.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel31s
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31u
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 31s
        hoofdstuk: '4'
        paragraaf: '11'
  - number: 31v.1
    text: |-
      Een vrouwelijke ambtenaar, die een borstkind voedt, heeft, indien zij de commandant hiervan in kennis heeft
      gesteld, gedurende ten minste de eerste 9 levensmaanden van dat kind het recht de arbeid te onderbreken ten einde
      in de nodige rust en afzondering haar kind te zogen dan wel de borstvoeding te kolven. De commandant biedt haar
      daartoe de gelegenheid en stelt, waar nodig, een geschikte af te sluiten besloten ruimte ter beschikking.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31v
  - number: 31v.2
    text: |-
      De onderbrekingen, bedoeld in het eerste lid, vinden plaats zo vaak en zo lang als nodig is doch bedragen
      gezamenlijk ten hoogste een vierde van de arbeidsduur per dienst of nachtdienst. De vaststelling van het tijdstip
      en de duur van de onderbrekingen vindt plaats door de betrokken vrouwelijke ambtenaar na overleg met de commandant.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31v
  - number: 31v.3
    text: |-
      De duur van de onderbrekingen, bedoeld in dit artikel, gelden voor de toepassing van dit hoofdstuk en de daarop
      berustende bepalingen als arbeidsduur.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel31v
  - number: '32.1'
    text: De ambtenaar heeft jaarlijks aanspraak op vakantie met behoud van zijn volle bezoldiging.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel32
  - number: '32.2'
    text: De aanspraak op vakantie wordt uitgedrukt in hele uren. Zo nodig vindt afronding naar boven plaats.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel32
  - number: '32.3'
    text: 'De omvang van de aanspraak op vakantie is afhankelijk van:'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel32
  - number: 32.3.a
    text: het salaris van de ambtenaar;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel32
  - number: 32.3.b
    text: de leeftijd van de ambtenaar;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel32
  - number: 32.3.c
    text: de arbeidsduur waarvoor de ambtenaar is aangesteld.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel32
  - number: '32.4'
    text: |-
      Voor de ambtenaar die is aangesteld voor een wekelijkse arbeidsduur van 38 uur bedraagt de aanspraak op vakantie
      184 uren per kalenderjaar indien het salaris op 1 januari van het desbetreffende jaar minder bedraagt dan het
      maximumsalaris van schaal 9 van [bijlage A van het Inkomstenbesluit burgerlijke ambtenaren defensie][ref1], en 192
      uren per kalenderjaar indien het salaris op 1 januari van het desbetreffende jaar gelijk is aan of meer bedraagt
      dan vorenbedoeld maximumsalaris.


      [ref1]: https://wetten.overheid.nl/BWBR0018191
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0018191
  - number: '32.5'
    text: 'De op grond van het vierde lid geldende aanspraak op vakantie wordt verhoogd:'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel32
  - number: 32.5.a
    text: |-
      volgens onderstaande tabel, afhankelijk van de leeftijd die de ambtenaar in het desbetreffende kalenderjaar
      bereikt;






                        leeftijd


                        verhoging






                        18 jaar en jonger


                        24 uren




                        19 jaar


                        16 uren




                        20 jaar


                        8 uren




                        van 30 tot en met 39 jaar


                        8 uren




                        van 40 tot en met 44 jaar


                        16 uren




                        van 45 tot en met 49 jaar


                        24 uren




                        van 50 tot en met 54 jaar


                        32 uren




                        van 55 tot en met 59 jaar


                        40 uren




                        60 jaar en ouder


                        48 uren
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel32
  - number: 32.5.b
    text: |-
      over het kalenderjaar, waarin de ambtenaar in geheel of gedeeltelijk afwisselende dienst werkzaam is: met
      zoveel uren als hij op in dat kalenderjaar niet op zaterdag of zondag vallende feestdagen als bedoeld in
      [artikel 31g, tweede lid][ref1] volgens rooster heeft gewerkt, hetzij volgens rooster vrij van arbeid is geweest,
      dan wel uit hoofde van ziekte of vakantie niet tot dienstverrichting was gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel31g
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 31g
        hoofdstuk: '4'
        paragraaf: '8'
  - number: '32.6'
    text: |-
      Voor de ambtenaar die is aangesteld voor een wekelijkse arbeidsduur van minder dan 38 uur, wordt de op basis van
      het vierde en vijfde lid geldende aanspraak op vakantie vastgesteld op een evenredig deel van de aanspraak van een
      ambtenaar die is aangesteld voor een wekelijkse arbeidsduur van 38 uur.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel32
  - number: '32.7'
    text: |-
      Bij beëindiging of aanvang van het dienstverband in de loop van een kalenderjaar, wordt de aanspraak op vakantie
      vastgesteld naar evenredigheid van de vrij van arbeid, die de ambtenaar in dat jaar verricht heeft of zal
      verrichten.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel32
  - number: '32.8'
    text: |-
      Indien de wekelijkse arbeidsduur waarvoor de ambtenaar is aangesteld wordt gewijzigd, wordt de aanspraak op
      vakantie over een eventueel resterend gedeelte van het desbetreffende kalenderjaar opnieuw vastgesteld, rekening
      houdend met de nieuwe arbeidsduur. De tot aan de datum van ingang van de gewijzigde arbeidsduur verworven aanspraak
      op vakantie blijft ongewijzigd gehandhaafd.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel32
  - number: '32.9'
    text: |-
      De vakantie waarop een ambtenaar aanspraak maakt wordt naar evenredigheid verminderd indien hij een aaneengesloten
      periode van langer dan een maand geheel of gedeeltelijk geen vrij van arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel32
  - number: '32.10'
    text: 'Het negende lid is niet van toepassing, indien geheel of gedeeltelijk geen vrij van arbeid wordt verricht wegens:'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel32
  - number: 32.10.a
    text: vakantie;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel32
  - number: 32.10.b
    text: ziekte;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel32
  - number: 32.10.c
    text: |-
      zwangerschaps- en bevallingsverlof als bedoeld in [artikel 3:1 van de Wet arbeid en zorg][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: 32.10.d
    text: verblijf in militaire dienst wegens herhalingsoefeningen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel32
  - number: '32.11'
    text: |-
      De vakantie waarop de ambtenaar aanspraak maakt: - wordt verminderd naar evenredigheid van de tijd gedurende
      welke hem langer durend zorgverlof als bedoeld in [artikel 46e][ref1], of ouderschapsverlof als bedoeld in
      [hoofdstuk 6 van de Wet arbeid en zorg][ref2], is verleend;
        - kan worden verminderd naar evenredigheid van de tijd gedurende welke hem buitengewoon verlof als bedoeld in
      [artikel 12c, tweede lid, van de Wet ambtenaren defensie][ref3] of [artikel 45 van dit besluit][ref4], is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel46e
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0001952#Artikel12c
      [ref4]: https://wetten.overheid.nl/BWBR0006040#Artikel45
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 46e
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013008
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0001952
        artikel: 12c
      - id: ref4
        bwb_id: BWBR0006040
        artikel: '45'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '32.12'
    text: |-
      De ambtenaar heeft geen aanspraak op vakantie, indien [artikel 61a, tweede lid, onderdeel g][ref1], van toepassing
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel61a
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 61a
        hoofdstuk: '6'
        paragraaf: '4'
  - number: '33.1'
    text: |-
      De ambtenaar is vrij te bepalen wanneer hij vakantie opneemt, voor zoveel de belangen van de dienst zich daartegen
      niet verzetten.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel33
  - number: '33.2'
    text: Vakantie wordt zoveel mogelijk opgenomen in aaneengesloten perioden van ten minste vier uren.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel33
  - number: '33.3'
    text: |-
      De ambtenaar dient in elk kalenderjaar ten minste 152 uur vakantie op te nemen waarvan ten minste 76 uur over een
      aaneengesloten periode indien hij is aangesteld voor een wekelijkse arbeidsduur van 38 uur, en tot in evenredigheid
      lagere getallen indien hij is aangesteld voor een wekelijkse arbeidsduur van minder dan 38 uur.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel33
  - number: '33.4'
    text: |-
      De commandant kan toestaan dat een ambtenaar in enig kalenderjaar meer uren vakantie opneemt dan zijn aanspraak
      tot en met het lopende jaar bedraagt, met dien verstande dat de opgenomen vakantie de aanspraak tot en met het
      lopende jaar nimmer met meer dan 64 uren mag overschrijden. Voor de ambtenaar die is aangesteld voor een wekelijkse
      arbeidsduur van minder dan 38 uur, wordt het in de vorige volzin bedoelde aantal uren van de maximaal toegestane
      overschrijding verminderd naar evenredigheid van de arbeidsduur waarvoor hij is aangesteld. De in een kalenderjaar
      teveel genoten vakantie wordt in mindering gebracht op de aanspraak op vakantie over het eerstvolgende jaar.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel33
  - number: '33.5'
    text: De ambtenaar meldt het voornemen vakantie op te nemen ruimschoots van te voren.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel33
  - number: '33.6'
    text: |-
      Tenzij gewichtige redenen van dienstbelang zich hiertegen verzetten, is het de ambtenaar toegestaan op het
      voornemen vakantie op te nemen, terug te komen, dan wel het opnemen niet voort te zetten. De vorige volzin geldt
      in geval van ziekte of ongeval alleen indien de ambtenaar ten genoege van de commandant die ziekte of dat ongeval
      aantoont.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel33
  - number: '33.7'
    text: |-
      Wanneer dringende redenen van dienstbelang dat noodzakelijk maken, kan de commandant aan de ambtenaar verleende
      toestemming vakantie op te nemen intrekken, zowel vóór als tijdens de vakantie. Indien de ambtenaar ten gevolge van
      het intrekken van de toestemming vakantie op te nemen geldelijke schade lijdt, wordt deze hem vergoed.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel33
  - number: '33.8'
    text: Niet opgenomen vakantieverlof wordt overgeboekt naar het volgende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel33
  - number: '33.9'
    text: |-
      Het overgeboekte vakantieverlof als bedoeld in het achtste lid vervalt op 31 december van het volgende
      kalenderjaar. Deze vervaldatum wordt met een kalenderjaar uitgesteld indien operationele omstandigheden de
      commandant hebben verhinderd vakantie te verlenen, of naar het oordeel van de commandant gewichtige persoonlijke
      omstandigheden of medische redenen de ambtenaar hebben verhinderd vakantie op te nemen
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel33
  - number: '33.10'
    text: |-
      Indien medische redenen de ambtenaar hebben verhinderd om vakantie op te nemen, legt de ambtenaar een schriftelijke
      verklaring van de behandelend arts over aan de commandant.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel33
  - number: '33.11'
    text: |-
      Het niet genoten vakantieverlof toegekend voor 1 januari 2019, wordt uiterlijk voor of op 31 december 2023 genoten.
      Op 1 januari 2024 vervalt de aanspraak op het niet genoten verlof van voor 1 januari 2019.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel33
  - number: '34.1'
    text: |-
      Indien de ambtenaar op de datum van zijn ontslag nog aanspraak heeft op vakantie, wordt hem voor ieder uur
      vakantie dat hij niet heeft opgenomen een vergoeding toegekend ten bedrage van het salaris per uur verhoogd met 8
      procent vakantie-uitkering als bedoeld in [artikel 43, eerste lid][ref1] en de eindejaarsuitkering als bedoeld in
      [artikel 44, eerste lid, van het Inkomstenbesluit burgerlijke ambtenaren][ref2] dat de ambtenaar direct voorafgaand
      aan zijn ontslag genoot. De vergoeding wordt berekend over ten hoogste twee maal de aanspraak op vakantie over
      een vol kalenderjaar, uitgaande van het salaris en de arbeidsduur waarvoor hij is aangesteld zoals die direct
      voorafgaand aan het ontslag voor de ambtenaar golden en de leeftijd welke hij bereikt in het kalenderjaar waarin de
      dienstbetrekking wordt beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0018191#Artikel44
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018191
        artikel: '44'
  - number: '34.2'
    text: |-
      Indien op de dag van zijn ontslag blijkt dat de ambtenaar teveel vakantie heeft genoten, is hij voor ieder uur
      teveel genoten vakantie een bedrag verschuldigd ten bedrage van het salaris per uur.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel34
  - number: '34.3'
    text: |-
      In geval van overgang zonder onderbreking naar een functie binnen een andere sector van de rijksdienst in de loop
      van een kalenderjaar kan, indien dit binnen die andere sector van de rijksdienst mogelijk is, de ambtenaar er - in
      zoverre in afwijking van het eerste lid - voor kiezen de vakantieaanspraken van het lopende kalenderjaar die niet
      genoten zijn, mee te nemen. Daarbij wordt vakantie die in het lopende kalenderjaar genoten is in mindering gebracht
      op de aanspraken in dat jaar.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel34
  - number: '34.4'
    text: Indien de ambtenaar overlijdt, wordt dit artikel overeenkomstig toegepast.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel34
  - number: '35'
    text: |-
      Voor de toepassing van deze paragraaf is, voor de berekening van de bezoldiging,
      [artikel 30 van het Inkomstenbesluit burgerlijke ambtenaren defensie][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel30
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '30'
  - number: '36'
    text: Onze Minister is bevoegd nadere en zonodig afwijkende regels vast te stellen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel36
  - number: '37'
    text: |-
      Onverminderd het bepaalde in [hoofdstuk 6][ref1], genieten verlof:


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006040
        hoofdstuk: '6'
  - number: 37.a
    text: de ambtenaar, die als militair in werkelijke dienst is;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel37
  - number: 37.b
    text: |-
      de ambtenaar die in werkelijke dienst is als vrijwillige ambtenaar, aangesteld voor de uitvoering van de politietaak,
      als bedoeld in [artikel 1, eerste lid, onderdeel vv, van het Besluit algemene rechtspositie politie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel1
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '1'
  - number: 37.c
    text: |-
      de ambtenaar, die is tewerkgesteld in de zin van [artikel 9 van de Wet gewetensbezwaren militaire dienst][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel9
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '9'
  - number: 37.d
    text: |-
      de ambtenaar, die op grond van een andere bijzondere verbintenis in werkelijk militaire of daarmede gelijk te
      stellen dienst is, ter zake waarvan bij koninklijk besluit zulks is bepaald.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel37
  - number: '38.1'
    text: |-
      Indien het Ministerie van Defensie of een onderdeel daarvan op een daartoe aangewezen kerkelijke of nationale,
      landelijk, regionaal of plaatselijk erkende feest- of gedenkdag is gesloten, geniet de desbetreffende ambtenaar
      verlof voor zoveel het dienstbelang niet anders vereist.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel38
  - number: '38.2'
    text: |-
      Indien de ambtenaar op een dag als bedoeld in het eerste lid, een aantal uren dienst moet verrichten binnen het
      voor hem vastgestelde rooster, dan wel, in geheel of gedeeltelijk afwisselende dienst werkzaam zijnde, op die dag
      volgens rooster vrij van dienst is of uit hoofde van ziekte of vakantie niet tot dienstverrichting is gehouden,
      geniet hij bedoeld aantal uren als verlof op een andere dag.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel38
  - number: '38.3'
    text: |-
      Het eerste en tweede lid vinden geen toepassing, indien de sluiting van het Ministerie van Defensie regionaal of
      plaatselijk plaats vindt en de ambtenaar elders werkzaam is.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel38
  - number: '38.4'
    text: |-
      Het eerste en tweede lid vinden voorts geen toepassing, indien het betreft feestdagen genoemd in
      [artikel 31g, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel31g
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 31g
        hoofdstuk: '4'
        paragraaf: '8'
  - number: '39'
    text: |-
      Onverminderd het bepaalde in de [artikelen 94][ref1] en 95 wordt aan de ambtenaar in de gevallen en onder de
      voorwaarden, genoemd in de volgende artikelen van deze paragraaf, buitengewoon verlof verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel94
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '94'
        hoofdstuk: 7b
  - number: '42.1'
    text: |-
      Tenzij de belangen van de dienst zich daartegen verzetten wordt door de commandant aan de ambtenaar jaarlijks ten
      hoogste 120 uren buitengewoon verlof met behoud van volle bezoldiging verleend voor het bijwonen van vergaderingen
      van statutaire organen van verenigingen van ambtenaren, van centrale organisaties, waarbij deze verenigingen zijn
      aangesloten of van internationale ambtenarenorganisaties, mits de ambtenaar hieraan deelneemt:
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel42
  - number: 42.1.a
    text: |-
      voor zover het betreft vergaderingen van verenigingen van ambtenaren als bestuurslid van die vereniging dan wel als
      afgevaardigde of bestuurslid van een onderdeel daarvan;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel42
  - number: 42.1.b
    text: |-
      voor zover het betreft vergaderingen van centrale organisaties, waarbij verenigingen van ambtenaren zijn
      aangesloten, als bestuurslid van die centrale organisatie dan wel als afgevaardigde of bestuurslid van een bij die
      organisatie aangesloten vereniging van ambtenaren;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel42
  - number: 42.1.c
    text: |-
      voor zover het betreft vergaderingen van een internationale ambtenarenorganisatie als bestuurslid van deze
      organisatie dan wel als afgevaardigde of bestuurslid van een bij die organisatie aangesloten vereniging van
      ambtenaren.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel42
  - number: '42.2'
    text: |-
      Tenzij de belangen van de dienst zich daartegen verzetten, wordt door de commandant tot ten hoogste 208 uren
      per jaar buitengewoon verlof met behoud van volle bezoldiging verleend aan de ambtenaar, die door een centrale
      als bedoeld in het [Besluit georganiseerd overleg sector defensie][ref1] of een daarbij aangesloten vereniging
      is aangewezen om bestuurlijke of vertegenwoordigende activiteiten te ontplooien binnen zijn centrale of een
      daarbij aangesloten vereniging respectievelijk binnen de organisatie van de werkgever, die er toe strekken de
      doelstellingen van zijn centrale van overheidspersoneel en de daarbij aangesloten verenigingen te ondersteunen.


      [ref1]: https://wetten.overheid.nl/BWBR0006042
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006042
  - number: '42.3'
    text: |-
      Tenzij de belangen van de dienst zich daartegen verzetten, wordt door de commandant buitengewoon verlof met behoud
      van volle bezoldiging verleend aan de ambtenaar voor het – op uitnodiging van een organisatie van ambtenaren – als
      cursist deelnemen aan een cursus, met dien verstande dat dit verlof ten hoogste 48 uren per twee jaren bedraagt.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel42
  - number: '42.4'
    text: |-
      Het aantal uren dat op grond van het eerste, tweede en derde lid alsmede op grond van
      [artikel 17, tweede lid, van het Besluit medezeggenschap defensie][ref1] aan een ambtenaar mag worden verleend,
      bedraagt tezamen ten hoogste 240 uren per jaar, met dien verstande dat ten hoogste 320 uren worden verleend:


      [ref1]: https://wetten.overheid.nl/BWBR0010617#Artikel17
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0010617
        artikel: '17'
  - number: 42.4.a
    text: |-
      aan leden van hoofdbesturen van centrales van overheidspersoneel als bedoeld in het
      [Besluit georganiseerd overleg sector defensie][ref1] en van organisaties, die rechtstreeks bij die centrales zijn
      aangesloten;


      [ref1]: https://wetten.overheid.nl/BWBR0006042
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006042
  - number: 42.4.b
    text: |-
      aan leden van het hoofdbestuur van het Ambtenarencentrum en aan leden van het dagelijks bestuur van de bij die
      organisatie aangesloten centrales;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel42
  - number: 42.4.c
    text: |-
      aan leden van het hoofdbestuur van de Centrale van Middelbare en Hogere Functionarissen bij Overheid en Onderwijs
      (CMHF), alsmede aan de bestuursleden van de sectoren en secties van die organisatie.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel42
  - number: '42.5'
    text: |-
      Het verlof bedoeld in het eerste tot en met vierde lid, wordt slechts verleend aan ambtenaren, die lid zijn
      van verenigingen van ambtenaren, welke zijn aangesloten bij centrales van verenigingen van ambtenaren, die deel
      uitmaken van de sectorcommissie Defensie.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel42
  - number: '42.6'
    text: |-
      Tenzij andere belangen van de dienst zich daartegen verzetten, wordt door de commandant aan de ambtenaar
      buitengewoon verlof met behoud van volle bezoldiging verleend voor het bijwonen van vergaderingen van commissies
      voor georganiseerd overleg in ambtenarenzaken. Dit geldt eveneens voor één voorvergadering per in de vorige volzin
      bedoelde vergadering.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel42
  - number: '43'
    text: |-
      Tenzij de belangen van de dienst zich daartegen verzetten, wordt door de commandant aan de ambtenaar buitengewoon
      verlof met behoud van volle bezoldiging verleend:
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel43
  - number: 43.a
    text: 'voor het zoeken van een woning in geval van overplaatsing: ten hoogste twee dagen;'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel43
  - number: 43.b
    text: |-
      bij verhuizing in geval van overplaatsing: aan hen, die een eigen huishouding hebben: twee dagen, zo nodig te
      verlengen tot drie en in zeer bijzondere gevallen tot vier dagen en aan hen, die niet een eigen huishouding hebben:
      ten hoogste twee dagen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel43
  - number: '44'
    text: |-
      Tenzij de belangen van de dienst zich daartegen verzetten, wordt door de commandant aan de ambtenaar buitengewoon
      verlof met behoud van volle bezoldiging verleend:
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel44
  - number: 44.a
    text: 'bij zijn ondertrouw: één dag;'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel44
  - number: 44.b
    text: 'bij zijn huwelijk: vier dagen;'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel44
  - number: 44.c
    text: |-
      tot het bijwonen van een huwelijk van bloed- of aanverwanten in de eerste graad, van stief- of pleegouders, dan wel
      van stief- of pleegkinderen: één dag indien dit huwelijk wordt gesloten in zijn woon- of standplaats en ten hoogste
      twee dagen, indien dit huwelijk wordt gesloten buiten zijn woon- of standplaats;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel44
  - number: 44.d
    text: |-
      bij zijn 25-, 40- en 50-jarig ambts- of huwelijksjubileum en bij 25-, 40-, 50- en 60-jarig huwelijksjubileum van
      ouders, stiefouders, pleegouders, schoonouders of grootouders: één dag;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel44
  - number: '45.1'
    text: |-
      Buitengewoon verlof van korte duur, al dan niet met behoud van volle bezoldiging, kan bovendien aan de ambtenaar
      worden verleend in de gevallen waarin de commandant oordeelt dat daartoe aanleiding bestaat.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel45
  - number: '45.2'
    text: Onze Minister is bevoegd ter uitvoering van het eerste lid zo nodig nadere regels vast te stellen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel45
  - number: '46.1'
    text: |-
      Behoudens in dringende gevallen moet buitengewoon verlof van korte duur ten minste 24 uren tevoren schriftelijk of
      mondeling worden aangevraagd.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel46
  - number: '46.2'
    text: |-
      Indien de ambtenaar, die niet vooraf een aanvraag voor buitengewoon verlof van korte duur bij de commandant heeft
      ingediend, aantoont, dat hij daartoe geen gelegenheid heeft gehad, terwijl er voor zijn afwezigheid gegronde
      redenen bestonden, wordt deze afwezigheid beschouwd als buitengewoon verlof met behoud van volle bezoldiging.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel46
  - number: '46.3'
    text: 'Een gegronde reden als bedoeld in het tweede lid is slechts aanwezig:'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel46
  - number: 46.3.a
    text: |-
      indien één der in de voorgaande artikelen genoemde omstandigheden aanwezig is geweest, op grond waarvan aan de
      ambtenaar op zijn aanvraag buitengewoon verlof wordt verleend, zulks met inachtneming van de daarbij vermelde
      voorwaarden en termijnen;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel46
  - number: 46.3.b
    text: |-
      in alle andere gevallen, indien de ambtenaar, alle omstandigheden in aanmerking genomen, redelijkerwijze de dienst
      mocht verzuimen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel46
  - number: 46c.1
    text: |-
      Onverminderd [artikel 4:1 van de Wet arbeid en zorg][ref1] wordt door de commandant aan de ambtenaar buitengewoon
      verlof met behoud van volle bezoldiging verleend:


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel4
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel46c
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '4'
  - number: 46c.1.a
    text: |-
      bij plotselinge ziekte van de echtgenote of echtgenoot van de ambtenaar, de persoon met wie de ambtenaar ongehuwd
      samenwoont of een van zijn bloed- of aanverwanten in de eerste graad of wanneer een andere noodsituatie, waarvoor
      de ambtenaar onverwijld een voorziening moet treffen, ontstaat: voor de duur benodigd voor de eerste opvang en het
      treffen van verdere voorzieningen, maar voor ten hoogste één werkdag per zich voordoende situatie;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel46c
  - number: 46c.1.b
    text: bij de bevalling van zijn echtgenote of de persoon met wie de ambtenaar ongehuwd samenwoont;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel46c
  - number: 46c.1.c
    text: |-
      bij overlijden en lijkbezorging van de echtgenote of echtgenoot van de ambtenaar, de persoon met wie de ambtenaar
      ongehuwd samenwoont of een van zijn bloed- en aanverwanten in de eerste graad: vanaf het overlijden tot en met
      de dag van de begrafenis of de crematie en indien sprake is van bijzondere godsdienstige plechtigheden zoveel
      werkdagen als benodigd om overeenkomstig de bepalingen van die godsdienst rouwceremoniën te verrichten;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel46c
  - number: 46c.1.d
    text: 'bij overlijden van:'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel46c
  - number: 46c.1.d.1°
    text: 'bloed- of aanverwanten in de 2e graad, dan wel van pleegbroers of -zusters: voor ten hoogste 2 werkdagen;'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel46c
  - number: 46c.1.d.2°
    text: 'bloed- of aanverwanten in de 3e of 4e graad of een van zijn huisgenoten: voor 1 werkdag,'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel46c
  - number: 46c.2
    text: |-
      De ambtenaar meldt vooraf aan de commandant dat hij het verlof, bedoeld in het eerste lid, opneemt onder opgave
      van de reden. Indien dit niet mogelijk is, meldt de ambtenaar het opnemen van het verlof zo spoedig mogelijk aan de
      commandant onder opgave van de reden.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel46c
  - number: 46c.3
    text: |-
      De commandant kan achteraf van de ambtenaar verlangen dat hij aannemelijk maakt dat hij geen dienst heeft kunnen
      verrichten wegens een van de redenen genoemd in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel46c
  - number: 46d
    text: |-
      Het kort durend zorgverlof, bedoeld in [hoofdstuk 5 van de Wet arbeid en zorg][ref1], wordt door de commandant
      verleend met behoud van volle bezoldiging.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel46d
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '5'
  - number: 46e.1
    text: |-
      Aan de ambtenaar wordt door de commandant langer durend zorgverlof met behoud van volle bezoldiging verleend voor
      hulpverlening aan een tijdelijk ernstig hulpbehoevende of stervende echtgenote, echtgenoot of persoon met wie de
      ambtenaar ongehuwd samenwoont, ouders, stief-, pleeg- of schoonouders, eigen of aangehuwde kinderen, stief- of
      pleegkinderen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel46e
  - number: 46e.2
    text: |-
      De ambtenaar meldt vooraf aan de commandant dat hij het verlof, bedoeld in het eerste lid, opneemt onder opgave
      van de reden. Indien dit niet mogelijk is, meldt de ambtenaar het opnemen van het verlof zo spoedig mogelijk aan de
      commandant onder opgave van de reden. Bij de melding geeft de ambtenaar ook de omvang, de wijze van opneming en zo
      mogelijk de vermoedelijke duur van het verlof aan.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel46e
  - number: 46e.3
    text: |-
      Het verlof vangt niet aan of eindigt in ieder geval zodra de commandant aan de ambtenaar kenbaar maakt dat hij
      tegen het opnemen van het verlof onderscheidenlijk de voortzetting daarvan een zodanig zwaarwegend dienstbelang
      heeft, dat het belang van de ambtenaar daarvoor naar maatstaven van redelijkheid en billijkheid moet wijken.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel46e
  - number: 46e.4
    text: |-
      De commandant kan achteraf van de ambtenaar verlangen dat hij aannemelijk maakt dat hij geen dienst heeft kunnen
      verrichten wegens de reden genoemd in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel46e
  - number: 46e.5
    text: |-
      De commandant wijst de ambtenaar op de mogelijkheden tot het aanvragen van een financiële tegemoetkoming op basis
      van [hoofdstuk 7 van de Wet arbeid en zorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel46e
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '7'
  - number: 46e.6
    text: |-
      Indien de ambtenaar aan wie verlof als bedoeld in het eerste lid, is verleend gedurende dat verlof of
      gedurende een bepaalde periode van dat verlof tevens recht heeft op een financiële tegemoetkoming op basis van
      [hoofdstuk 7 van de Wet arbeid en zorg][ref1], wordt door de commandant gedurende de periode waarin sprake is van
      een samenloop een inhouding op de doorbetaling van de bezoldiging, als bedoeld in het eerste lid, toegepast welke
      overeenkomt met het bedrag van bedoelde financiële tegemoetkoming.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel46e
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '7'
  - number: 46e.7
    text: |-
      Indien aan de in [hoofdstuk 7 van de Wet arbeid en zorg][ref1] gestelde voorwaarden voor het toekennen van een
      financiële tegemoetkoming is voldaan maar geen financiële tegemoetkoming is toegekend omdat de ambtenaar geen
      aanvraag heeft ingediend, kan de commandant het zesde lid op overeenkomstige wijze toepassen. In dat geval wordt
      rekening gehouden met de financiële tegemoetkoming die aan de ambtenaar zou zijn toegekend indien hij wel een
      aanvraag zou hebben ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel46e
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '7'
  - number: 46f
    text: |-
      Wanneer aan de ambtenaar door de commandant aanvullend geboorteverlof als bedoeld in
      [hoofdstuk 4 van de Wet arbeid en zorg][ref1] wordt verleend, behoudt hij over de periode van het aanvullend
      geboorteverlof dat ten hoogste vijf gehele weken bedraagt gebaseerd op de voor de ambtenaar geldende arbeidsduur
      per week, 75% van zijn bezoldiging.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel46f
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '4'
  - number: '47.1'
    text: |-
      Wanneer aan de ambtenaar door de commandant ouderschapsverlof als bedoeld in
      [hoofdstuk 6 van de Wet arbeid en zorg][ref1] wordt verleend, behoudt hij over de eerste periode van het
      ouderschapsverlof, die overeenkomt met dertien maal de voor de ambtenaar geldende arbeidsduur per week, 75% van
      zijn bezoldiging. Over de resterende periode van het verleende ouderschapsverlof, ontvangt de ambtenaar over de
      ouderschapsverlofuren geen bezoldiging.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '6'
  - number: '47.2'
    text: |-
      De ambtenaar kan door de commandant worden verplicht tot terugbetaling van de tijdens het ouderschapsverlof
      genoten inkomsten wanneer hem tijdens de verlofperiode of binnen één jaar na afloop van het ouderschapsverlof
      ontslag wordt verleend op zijn aanvraag dan wel op grond van aan de ambtenaar te wijten omstandigheden of, wanneer
      hij is aangesteld in tijdelijke dienst voor bepaalde tijd, ter zake van het eindigen van de tijd waarvoor de
      aanstelling is geschied. Indien binnen één jaar na afloop van het ouderschapsverlof ontslag wordt verleend, wordt
      de verplichting tot terugbetaling naar evenredigheid beperkt. Indien het ontslag verband houdt met een aanstelling
      als militair bij het Ministerie van Defensie of indiensttreding bij een andere overheidssector bestaat geen
      verplichting tot terugbetaling.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel47
  - number: '48.1'
    text: |-
      Buitengewoon verlof van lange duur kan aan de ambtenaar op zijn aanvraag worden verleend door het hoofd
      defensieonderdeel al dan niet met behoud van bezoldiging en al dan niet onder bepaalde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel48
  - number: '48.2'
    text: |-
      Het verlof, genoemd in het eerste lid, gaat niet in dan na aanvaarding van dat verlof met de daaraan verbonden
      voorwaarden door de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel48
  - number: '49'
    text: |-
      Indien het verlof, genoemd in [artikel 48][ref1], uitsluitend strekt in het persoonlijk belang van de ambtenaar,
      kan hem dit slechts worden verleend zonder behoud van bezoldiging.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel48
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '48'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '50'
    text: |-
      Indien het verlof, genoemd in [artikel 48][ref1], ten doel heeft de ambtenaar in de gelegenheid te stellen
      een andere functie te vervullen en met verlofverlening naar het oordeel van het hoofd defensieonderdeel niet
      uitsluitend het persoonlijk belang van de ambtenaar, doch mede het algemeen belang wordt gediend, kan het verlof -
      onverminderd het bepaalde in de [artikelen 51][ref2] en [52][ref3] - in beginsel voor ten hoogste een jaar, zonder
      behoud van bezoldiging, worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel51
      [ref3]: https://wetten.overheid.nl/BWBR0006040#Artikel52
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '48'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: '51'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006040
        artikel: '52'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '51.1'
    text: |-
      Aan de ambtenaar, benoemd tot bezoldigd bestuurder van een vereniging van ambtenaren, van een centrale of van een
      internationale organisatie van zodanige verenigingen, kan uit dien hoofde naar het oordeel van Onze Minister voor
      ten hoogste twee jaren buitengewoon verlof zonder behoud van bezoldiging worden verleend.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel51
  - number: '51.2'
    text: |-
      [Artikel 42, vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel42
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '42'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '52.1'
    text: |-
      Indien het verlof, genoemd in [artikel 48][ref1], ten doel heeft de ambtenaar in de gelegenheid te stellen
      anders dan in vaste dienst hetzij een functie in dienst van een volkenrechtelijke organisatie te vervullen hetzij
      ten behoeve van de Nederlandse Antillen of Aruba, dan wel als deskundige tijdelijk ten behoeve van een vreemde
      mogendheid werkzaam te zijn en met verlofverlening naar het oordeel van het hoofd defensieonderdeel het algemeen
      belang in overwegende mate wordt gediend, kan het verlof in beginsel voor ten hoogste drie jaren, zonder behoud van
      bezoldiging, worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel48
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '48'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '52.2'
    text: |-
      In afwijking van het eerste lid kan aan de ambtenaar, die wenst te worden uitgezonden om in burgerlijke landsdienst
      van de Nederlandse Antillen of Aruba tijdelijk een betrekking te vervullen buitengewoon verlof worden verleend op
      de voet van het [West-Indisch Detacheeringsbesluit 1930][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001949
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0001949
  - number: '53.1'
    text: |-
      De ambtenaar, die na afloop van hem verleend buitengewoon verlof van lange duur en zonder dat dit is verlengd,
      zijn dienst niet tijdig hervat, wordt voor de toepassing van dit reglement geacht een aanvraag om ontslag te hebben
      ingediend.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel53
  - number: '53.2'
    text: |-
      Het eerste lid is niet van toepassing, indien de ambtenaar binnen een redelijke termijn ten genoegen van Onze
      Minister aannemelijk maakt dat hij geldige redenen had zijn dienst niet te hervatten, in welk geval het verlof
      geacht wordt te zijn verlengd tot het tijdstip, waarop bedoelde geldige redenen hebben opgehouden te bestaan.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel53
  - number: '54'
    text: |-
      Voor de toepassing van deze paragraaf is, voor de berekening van de bezoldiging,
      [artikel 30 van het Inkomstenbesluit burgerlijke ambtenaren defensie][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel30
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '30'
  - number: 54a
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel54a
  - number: 54a.a
    text: |-
      arbeidsongeschiktheid: arbeidsongeschiktheid als bedoeld in [artikel 18, eerste lid, van de WAO][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel18
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '18'
  - number: 54a.b
    text: |-
      arbodienst: een arbodienst als bedoeld in de [Arbeidsomstandighedenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010346
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0010346
  - number: 54a.c
    text: |-
      deskundige persoon: een deskundige persoon als bedoeld in
      [artikel 14, eerste lid, van de Arbeidsomstandighedenwet][ref1] die belast is met de taken, bedoeld in
      [artikel 14, eerste lid, onderdelen b of c, van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel14
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '14'
  - number: 54a.d
    text: |-
      beroepsziekte: ziekte, die in overwegende mate haar oorzaak vindt in de aard van de aan de ambtenaar opgedragen
      werkzaamheden of in de bijzondere omstandigheden waaronder deze moesten worden verricht, en die niet aan zijn
      schuld of onvoorzichtigheid is te wijten;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel54a
  - number: 54a.e
    text: |-
      bedrijfsongeval: ongeval, dat in overwegende mate zijn oorzaak vindt in de aard van de aan de ambtenaar opgedragen
      werkzaamheden of in de bijzondere omstandigheden waaronder deze moesten worden verricht, en dat niet aan zijn
      schuld of onvoorzichtigheid is te wijten;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel54a
  - number: 54a.f
    text: |-
      beroepsincident: een dienstongeval of beroepsziekte voortvloeiend uit een gevaarzettende situatie die rechtstreeks
      verband houdt met de uitvoering van zijn taak waaraan de ambtenaar zich vanwege zijn specifieke functie niet kan
      onttrekken;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel54a
  - number: 54a.g
    text: |-
      gangbare arbeid: arbeid als bedoeld in [artikel 18, vijfde lid, van de WAO][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel18
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '18'
  - number: 54a.h
    text: |-
      herplaatsingtoelage: herplaatsingtoelage als bedoeld in hoofdstuk 9 van het pensioenreglement van de Stichting
      pensioenfonds ABP;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel54a
  - number: 54a.i
    text: |-
      invaliditeitspensioen: invaliditeitspensioen als bedoeld in hoofdstuk 8 van het pensioenreglement van de Stichting
      pensioenfonds ABP;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel54a
  - number: 54a.j
    text: |-
      medisch advies: advies van de deskundige persoon of de arbodienst dat ten aanzien van de ambtenaar is uitgebracht
      na een arbeidsgezondheidskundig onderzoek als bedoeld in [artikel 18 van de Arbeidsomstandighedenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel18
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '18'
  - number: 54a.k
    text: |-
      UWV: het Uitvoeringsinstituut werknemersverzekeringen genoemd in [hoofdstuk 5 van de Wet-SUWI][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: 54a.l
    text: |-
      passende arbeid: alle arbeid die voor de krachten en de bekwaamheden van de ambtenaar is berekend, tenzij
      aanvaarding om redenen van lichamelijke, geestelijke of sociale aard niet van hem kan worden gevergd;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel54a
  - number: 54a.m
    text: 'Pensioenreglement: het Pensioenreglement van de stichting pensioenfonds ABP;'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel54a
  - number: 54a.n
    text: |-
      Wet-SUWI: de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0013060
  - number: 54a.o
    text: |-
      WW: [Werkloosheidswet][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 54a.p
    text: |-
      WAO: [Wet op de arbeidsongeschiktheidsverzekering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 54a.q
    text: |-
      ZW: [Ziektewet][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 54a.r
    text: |-
      werknemersverzekering: [WAO][ref1], [ZW][ref2], dan wel [WW][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0004045
  - number: 54a.s
    text: |-
      zijn arbeid: hetgeen daaronder wordt verstaan ingevolge [artikel 19 van de ZW][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel19
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '19'
  - number: '55.1'
    text: |-
      Onverminderd hetgeen ter zake is bepaald in de [Arbeidsomstandighedenwet][ref1] geniet de ambtenaar
      bedrijfsgeneeskundige begeleiding overeenkomstig deze paragraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0010346
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0010346
  - number: '55.2'
    text: |-
      Het hoofd defensieonderdeel is verantwoordelijk voor de bedrijfsgeneeskundige begeleiding van de ambtenaar. Bij
      deze begeleiding neemt het hoofd defensieonderdeel de door of vanwege Onze Minister gestelde regels in acht.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel55
  - number: '55.3'
    text: |-
      Voor de uitvoering van de bedrijfsgeneeskundige begeleiding laat het hoofd defensieonderdeel zich bijstaan door de
      deskundige persoon of de arbodienst.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel55
  - number: '56.1'
    text: |-
      Onverminderd de mogelijkheid de arts van de deskundige persoon of de arbodienst rechtstreeks te consulteren ter
      zake van met zijn arbeidssituatie samenhangende gezondheidsproblemen kan de ambtenaar het hoofd defensieonderdeel
      verzoeken hem in verband hiermede aan een onderzoek vanwege de deskundige persoon of de arbodienst te onderwerpen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel56
  - number: '56.2'
    text: |-
      De ambtenaar, die in verband met het verrichten van zijn arbeid aan bijzonder gevaar voor zijn gezondheid
      blootstaat dan wel voor een goede vervulling van zijn betrekking aan bijzondere gezondheidseisen moet voldoen,
      wordt in overleg met of op aanwijzing van de deskundige persoon of de arbodienst onderworpen aan een periodiek
      bedrijfsgeneeskundig onderzoek.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel56
  - number: '56.3'
    text: 'Het hoofd defensieonderdeel draagt de ambtenaar op zich aan een geneeskundig onderzoek te onderwerpen:'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel56
  - number: 56.3.a
    text: |-
      indien naar het oordeel van het hoofd defensieonderdeel gegronde redenen bestaan voor twijfel aan een goede
      gezondheidstoestand van de ambtenaar;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel56
  - number: 56.3.b
    text: |-
      indien de ambtenaar niet langer volledig geschikt is gebleken tot het verrichten van zijn arbeid, teneinde na te
      gaan of hiervoor medische oorzaken aanwezig zijn en, zo ja, of de ambtenaar geschikt kan worden geacht voor het
      vervullen van een andere betrekking.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel56
  - number: '56.4'
    text: |-
      Het hoofd defensieonderdeel stelt de ambtenaar buiten dienst indien na een onderzoek als bedoeld in het eerste tot
      en met derde lid blijkt dat sprake is van een zodanige lichamelijke of geestelijke toestand dat de belangen van
      de ambtenaar, van de dienst of van derden zich er tegen verzetten dat de ambtenaar zijn arbeid blijft verrichten.
      De ambtenaar wordt niet buiten dienst gesteld indien hem andere passende arbeid kan worden opgedragen. Indien de
      ambtenaar buiten dienst wordt gesteld, wordt hij geacht wegens ziekte ongeschikt te zijn tot het verrichten van
      zijn arbeid, in welk geval de overige bepalingen van dit hoofdstuk van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel56
  - number: '56.5'
    text: |-
      De ambtenaar is gehouden aan een onderzoek als bedoeld in het tweede en derde lid zijn medewerking te verlenen.
      Hij is tevens gehouden zijn medewerking te verlenen aan onderzoeken vanwege de deskundige persoon of de arbodienst,
      welke worden ingesteld ter beantwoording van de vraag:
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel56
  - number: 56.5.a
    text: |-
      of, in welke mate en tot welk tijdstip er sprake is van ongeschiktheid tot het verrichten van zijn arbeid wegens
      ziekte;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel56
  - number: 56.5.b
    text: |-
      of maatregelen of voorzieningen nodig zijn in het belang van het herstel van zijn gezondheid dan wel in het belang
      van het behoud, het herstel of de bevordering van zijn arbeidsgeschiktheid als genoemd in de [artikelen 65][ref1]
      en [65a van de WAO][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel65a
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '65'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 65a
  - number: '56.6'
    text: |-
      Indien het medisch advies daartoe aanleiding geeft, verzoekt het hoofd defensieonderdeel het UWV de ambtenaar in
      aanmerking te brengen voor maatregelen of voorzieningen als bedoeld in het vijfde lid onderdeel b.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel56
  - number: '57.1'
    text: |-
      Het medisch advies wordt zo spoedig mogelijk door die dienst aan de ambtenaar en aan het hoofd defensieonderdeel
      medegedeeld.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel57
  - number: '57.2'
    text: |-
      Indien de ambtenaar binnen drie dagen na ontvangst van de mededeling zijn bedenkingen tegen het advies schriftelijk
      aan het hoofd defensieonderdeel kenbaar maakt, vindt zo spoedig mogelijk, doch uiterlijk binnen vier weken, een
      nieuw onderzoek plaats door een commissie van drie artsen, tenzij het hoofd defensieonderdeel na overleg met de
      deskundige persoon of de arbodienst reeds aanstonds van mening is dat de bedenkingen van de ambtenaar voldoende
      gegrond zijn.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel57
  - number: '57.3'
    text: |-
      De kosten van het in het tweede lid genoemde onderzoek komen voor rekening van het Ministerie van Defensie.
      Eventuele reis- en verblijfkosten van de ambtenaar worden hem vergoed volgens de in [artikel 87, tweede lid][ref1],
      bedoelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel87
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '87'
        hoofdstuk: 7b
  - number: '58.1'
    text: |-
      Het hoofd defensieonderdeel is verplicht zo tijdig mogelijk zodanige maatregelen te treffen en voorschriften te
      geven als redelijkerwijs nodig is, opdat de ambtenaar, die in verband met ongeschiktheid als gevolg van ziekte
      verhinderd is zijn arbeid te verrichten, in staat wordt gesteld de eigen of andere passende arbeid te verrichten.
      Indien vaststaat dat zijn arbeid niet meer kan worden verricht en binnen het gezagsbereik van Onze Minister geen
      andere passende arbeid voorhanden is, bevordert het hoofd defensieonderdeel naar bij ministeriële regeling te
      stellen regels, de inschakeling van de ambtenaar in voor hem passende arbeid buiten het gezagsbereik van Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel58
  - number: '58.2'
    text: |-
      Uit hoofde van de verplichting bedoeld in het eerste lid, stelt het hoofd defensieonderdeel in overeenstemming met
      de ambtenaar een plan van aanpak op als bedoeld in [artikel 71a, tweede lid van de WAO][ref1]. Het plan van aanpak
      wordt met medewerking van de ambtenaar regelmatig geëvalueerd en zo nodig bijgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
  - number: 58a.1
    text: |-
      De ambtenaar die ongeschikt is tot het verrichten van zijn arbeid wegens ziekte kan door het hoofd
      defensieonderdeel een andere functie worden opgedragen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel58a
  - number: 58a.2
    text: |-
      de ambtenaar die in verband met ongeschiktheid ten gevolge van ziekte verhinderd is de bedongen arbeid te
      verrichten, is verplicht:
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel58a
  - number: 58a.2.a
    text: |-
      gevolg te geven aan door het bevoegd gezag of een door het bevoegd gezag aangewezen deskundige gegeven redelijke
      voorschriften en mee te werken aan door dat gezag of die deskundige getroffen maatregelen om hem instaat te stellen
      de eigen of passende arbeid te verrichten;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel58a
  - number: 58a.2.b
    text: |-
      mee te werken aan het opstellen, evalueren en bijstellen van een plan van aanpak als bedoeld in
      [artikel 71a, tweede lid, van de WAO][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
  - number: 58a.2.c
    text: |-
      gedurende het eerste jaar dat hij ongeschikt is een hem aangeboden betrekking te aanvaarden, indien sprake is van
      passende arbeid.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel58a
  - number: 58a.3
    text: |-
      Gedurende het tweede jaar dat de ambtenaar ongeschikt is tot het verrichten van zijn arbeid wegens ziekte is hij
      verplicht een hem aangeboden betrekking te aanvaarden indien sprake is van gangbare arbeid. Deze verplichting geldt
      eveneens na afloop van het tweede jaar.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel58a
  - number: 58a.4
    text: |-
      Dit artikel is op overeenkomstige wijze van toepassing indien aan de ambtenaar de eigen betrekking wordt opgedragen
      onder andere voorwaarden.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel58a
  - number: '59'
    text: |-
      Ten aanzien van de ambtenaar die wegens ziekte ongeschikt is zijn arbeid te verrichten kan worden bepaald, dat
      hij zijn arbeid slechts mag hervatten, nadat het hoofd defensieonderdeel hiervoor uitdrukkelijk toestemming heeft
      verleend. Het hoofd defensieonderdeel neemt hieromtrent en omtrent de mate van werkhervatting geen beslissing dan
      na advies van de bedrijfsgeneeskundige dienst. Deze toestemming van het hoofd defensieonderdeel is in ieder geval
      vereist, wanneer de ambtenaar gedurende meer dan één jaar volledig ongeschikt is geweest tot het verrichten van
      zijn arbeid.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel59
  - number: '62.1'
    text: |-
      De gewezen ambtenaar, die voor de beëindiging van zijn betrekking ongeschikt was tot het verrichten van zijn arbeid
      en nadien nog ongeschikt is om een naar aard en omvang soortgelijke betrekking te vervullen, behoudt gedurende een
      termijn van twaalf maanden aanspraak op zijn volledige bezoldiging. Vervolgens heeft hij aanspraak op 70% van zijn
      bezoldiging. De vorige volzin geldt slechts voor zover de termijn van achttien kalendermaanden, gerekend vanaf
      de eerste ziektedag, nog niet is verstreken en uiterlijk tot de eerste dag van de maand volgend op die waarin de
      gewezen ambtenaar de pensioengerechtigde leeftijd bereikt.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel62
  - number: '62.2'
    text: |-
      De gewezen ambtenaar, die binnen een maand na de datum van de beëindiging van zijn betrekking wegens ziekte
      ongeschikt wordt een naar aard en omvang soortgelijke betrekking te vervullen, ontvangt - mits hij gedurende
      tenminste twee maanden onmiddellijk aan dat tijdstip voorafgaande in dienst is geweest - gedurende zijn
      ongeschiktheid, doch uiterlijk tot een jaar na de aanvang van deze ongeschiktheid, dan wel - indien dit eerder is -
      uiterlijk tot de eerste dag van de maand volgende op die waarin hij de pensioengerechtigde leeftijd heeft bereikt,
      zijn laatstelijk genoten bezoldiging.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel62
  - number: '62.3'
    text: |-
      Het eerste en tweede lid vinden geen toepassing op de ambtenaar die na de beëindiging van zijn betrekking in
      verband met de aanvaarding van een betrekking van gelijke omvang aanspraak kan maken op loon of bezoldiging, dan
      wel op een uitkering krachtens de [ZW][ref1] ter zake van die aanvaarde betrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '62.4'
    text: |-
      Indien de gewezen ambtenaar binnen een tijdvak van vier weken nadat de volgens het eerste en tweede lid geregelde
      doorbetaling van zijn laatstelijk genoten bezoldiging in verband met zijn herstel is gestaakt, wederom wegens
      ziekte ongeschikt wordt een naar aard en omvang soortgelijke betrekking te vervullen, wordt de nieuw opgetreden
      ongeschiktheid als een voortzetting van de vorige ongeschiktheid beschouwd en wordt de doorbetaling hervat. Voor
      het bepalen van het tijdstip, waarop de in het eerste en tweede lid bedoelde termijnen zijn verstreken, worden
      perioden van ongeschiktheid om een naar aard en omvang soortgelijke betrekking te vervullen samengeteld, indien zij
      elkaar met een onderbreking van minder dan vier weken opvolgen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel62
  - number: '62.5'
    text: |-
      De gewezen ambtenaar, wier bevalling waarschijnlijk is binnen vier maanden na de datum van beëindiging van haar
      betrekking, ontvangt over een periode aanvangende met de 41ste dag voorafgaande aan de vermoedelijke datum van
      bevalling en eindigende met de 70ste dag na de datum waarop de bevalling plaatsvond haar laatstelijk genoten
      bezoldiging. Deze periode wordt verlengd tot 16 weken indien deze periode door een voortijdige bevalling minder dan
      16 weken heeft bedragen. Indien de bevalling niet wordt verwacht binnen vier maanden na de datum van beëindiging
      van haar betrekking, maar niettemin binnen die termijn plaatsvindt, ontvangt de gewezen ambtenaar haar laatstelijk
      genoten bezoldiging uitsluitend gedurende 70 dagen na de datum van bevalling. Indien en voor zolang de ambtenaar
      na beëindiging van de haar ingevolge de eerste of tweede volzin toekomende uitkeringen nog ongeschikt is tot het
      verrichten van haar arbeid, dan wel binnen een maand na deze beëindiging ongeschikt wordt tot het verrichten van
      haar arbeid, zijn het tweede tot en met vierde lid van overeenkomstige toepassing. De in het tweede lid bedoelde
      termijn van een jaar wordt geacht aan te vangen op de dag na de bevalling.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel62
  - number: '62.6'
    text: |-
      Ongeschikt tot het verrichten van haar arbeid, geheel of gedeeltelijk, in de zin van het vijfde lid is de ambtenaar
      die als rechtstreeks en objectief medisch vast te stellen gevolg van ziekte of gebreken geheel of gedeeltelijk
      niet in staat is om met arbeid te verdienen, hetgeen gezonde personen met soortgelijke opleiding en ervaring, ter
      plaatse waar zij arbeid verricht of het laatst heeft verricht, of in de omgeving daarvan, met arbeid gewoonlijk
      verdienen. Onder eerstgenoemde arbeid wordt verstaan gangbare arbeid.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel62
  - number: '62.7'
    text: |-
      Na het overlijden van de gewezen ambtenaar, die op de dag van zijn overlijden in het
      genot was van doorbetaling van zijn laatstelijk genoten bezoldiging, wordt aan de in
      [artikel 52, tweede lid, van het Inkomstenbesluit burgerlijke ambtenaren defensie][ref1] bedoelde personen en
      met overeenkomstige toepassing van dat artikel een bedrag uitgekeerd, gelijk aan de bezoldiging welke de gewezen
      ambtenaar op de dag van zijn overlijden genoot, berekend over een tijdvak van drie maanden. Op deze uitkering
      worden in mindering gebracht het bedrag van de uitkering ingevolge [artikel 35 van de ZW][ref2], dan wel
      [artikel 53 van de WAO][ref3] en naar aard en strekking daarmee overeenkomende uitkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel53
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '52'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '35'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '53'
  - number: '62.8'
    text: |-
      Het bedrag van de laatstelijk genoten bezoldiging, bedoeld in het eerste tot en met zevende lid, wordt in
      voorkomende gevallen gewijzigd overeenkomstig een algemene salariswijziging.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel62
  - number: '62.9'
    text: |-
      Indien de gewezen ambtenaar ter zake van de betrekking waaruit het recht op doorbetaling van zijn laatstgenoten
      bezoldiging voortvloeit, recht heeft op een uitkering op grond van een werknemersverzekering, een uitkering op
      basis van [hoofdstuk 3 van de Wet arbeid en zorg][ref1], dan wel een bovenwettelijke uitkering wegens onvrijwillige
      werkloosheid, wordt het bedrag van die uitkering in mindering gebracht op het bedrag waarop hij ingevolge
      dit artikel recht heeft. [Artikel 27 van het Inkomstenbesluit burgerlijke ambtenaren defensie][ref2] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0018191#Artikel27
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0018191
        artikel: '27'
  - number: '62.10'
    text: |-
      Inkomsten uit of in verband met arbeid of bedrijf, anders dan bedoeld in het negende lid, worden op het bedrag
      waarop de gewezen ambtenaar ingevolge dit artikel recht heeft in mindering gebracht. Bij deze vermindering wordt
      uitgegaan van de volledige laatstgenoten bezoldiging.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel62
  - number: '62.11'
    text: |-
      Ten aanzien van gevallen als bedoeld in het eerste lid is het tiende lid niet van toepassing indien de inkomsten
      uit of in verband met arbeid of bedrijf vóór het intreden van de ongeschiktheid tot het verrichten van zijn arbeid
      wegens ziekte werden genoten en de omvang van die dienstbetrekking niet is toegenomen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel62
  - number: '62.12'
    text: |-
      Ten aanzien van gevallen als bedoeld in het tweede en vijfde lid is het tiende lid niet van toepassing indien de
      inkomsten uit of in verband met arbeid of bedrijf vóór de datum van beëindiging van de betrekking werden genoten en
      de omvang van die arbeid niet is toegenomen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel62
  - number: '62.13'
    text: |-
      De gewezen ambtenaar die ingevolge dit artikel aanspraak heeft op doorbetaling van
      bezoldiging, heeft eveneens aanspraak op vakantie-uitkering overeenkomstig het bepaalde in
      [hoofdstuk 5 van het Bezoldigingsbesluit burgerlijke ambtenaren defensie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006038#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0006038
        hoofdstuk: '5'
  - number: '62.14'
    text: |-
      In de gevallen, bedoeld in dit artikel, zijn de [artikelen 56][ref1], [57][ref2], en
      [artikel 29 van het Inkomstenbesluit burgerlijke ambtenaren defensie][ref3], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel57
      [ref3]: https://wetten.overheid.nl/BWBR0018191#Artikel29
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '56'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: '57'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0018191
        artikel: '29'
  - number: '62.15'
    text: |-
      In afwijking van [artikel 3, eerste lid, onderdeel e][ref1], wordt voor de gewezen ambtenaar aan wie voor 1 januari
      2018 ontslag is verleend met recht op bezoldiging op grond van dit artikel, verstaan onder pensioengerechtigde
      leeftijd: de leeftijd van 65 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel3
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '3'
        hoofdstuk: '1'
  - number: '64.1'
    text: |-
      In geval van een door de ambtenaar opgelopen beroepsziekte of een hem overkomen bedrijfsongeval worden de te zijnen
      laste blijvende, naar het oordeel van het hoofd defensieonderdeel noodzakelijk gemaakte kosten voor geneeskundige
      behandeling of verzorging aan hem vergoed.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel64
  - number: '64.2'
    text: Onze Minister kan omtrent het bepaalde in het vorige lid nadere voorschriften geven.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel64
  - number: '65.1'
    text: |-
      Aan de gewezen ambtenaar aan wie ontslag is verleend op grond van ongeschiktheid tot het verrichten van zijn arbeid
      wegens ziekte, wordt – indien de arbeidsongeschiktheid in overwegende mate haar oorzaak vindt in de aard van de
      aan de ambtenaar opgedragen arbeid of in de bijzondere omstandigheden, waaronder deze moesten worden verricht,
      en de ongeschiktheid niet aan zijn schuld of onvoorzichtigheid is te wijten – door Onze Minister een aanvullende
      uitkering verleend.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel65
  - number: '65.2'
    text: |-
      De in het eerste lid bedoelde aanvullende uitkering is gelijk aan het bedrag dat nodig is om de gedeeltelijke,
      dan wel verminderde bezoldiging, bedoeld in de [artikel 62, negende lid][ref1], alsmede de eventuele
      uitkering op grond van de [ZW][ref2], dan wel de [WAO][ref3], vermeerderd met de suppletie krachtens de
      [Suppletieregeling gedeeltelijk arbeidsongeschikten sector Defensie][ref4], aan te vullen tot 90,02% van de
      bezoldiging welke de ambtenaar heeft genoten in het jaar voorafgaande aan zijn ontslag.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0008977
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '62'
        hoofdstuk: '6'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0002524
      - id: ref4
        bwb_id: BWBR0008977
  - number: '65.3'
    text: |-
      De in het eerste lid bedoelde aanvullende uitkering is gelijk aan het bedrag dat nodig is om de uitkering op grond
      van de [ZW][ref1], dan wel de [WAO][ref2], in voorkomend geval vermeerderd met een invaliditeitspensioen aan te
      vullen tot een bepaald percentage van de bezoldiging welke de ambtenaar heeft genoten in het jaar voorafgaand
      aan zijn ontslag. Dit percentage is afhankelijk van de mate van arbeidsongeschiktheid en bedraagt bij een
      arbeidsongeschiktheid van:






                    80% of meer:


                    90,02%




                    65 tot 80%


                    73,31%






                    55 tot 65%


                    56,59%




                    45 tot 55%


                    45,01%




                    35 tot 45%


                    34,08%




                    25 tot 35%


                    22,50%




                    15 tot 25%


                    15,00%.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0002524
  - number: '65.4'
    text: |-
      De aanvullende uitkering als bedoeld in het tweede lid eindigt op het moment dat de gewezen ambtenaar niet meer
      voldoet aan de in het eerste lid gestelde voorwaarden en in ieder geval na ommekomst van de duur van de suppletie
      dan wel met ingang van de dag waarop de gewezen ambtenaar de pensioengerechtigde leeftijd bereikt. De aanvullende
      uitkering als bedoeld in het derde lid eindigt op het moment dat de gewezen ambtenaar niet meer voldoet aan de
      in het eerste lid gestelde voorwaarden en in ieder geval met ingang van de dag waarop de gewezen ambtenaar de
      pensioengerechtigde leeftijd bereikt.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel65
  - number: '65.5'
    text: |-
      Indien het overlijden van een ambtenaar in overwegende mate zijn oorzaak vindt in de aard van de aan de ambtenaar
      opgedragen arbeid of in de bijzondere omstandigheden waaronder deze moesten worden verricht en niet aan zijn
      schuld of onvoorzichtigheid is te wijten, wordt aan degene die in verband met dit overlijden krachtens het
      pensioenreglement, bedoeld in [artikel 54a, onderdeel h][ref1], een nabestaandenpensioen geniet, door Onze Minister
      een uitkering toegekend ten bedrage van 18 procent van het resultaat van de vermenigvuldiging van:


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel54a
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 54a
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 65.5.a
    text: 1,75 procent van de berekeningsgrondslag, bedoeld in artikel 8.3 van het pensioenreglement, en
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel65
  - number: 65.5.b
    text: de pensioengeldige diensttijd, bedoeld in paragraaf 5 van het pensioenreglement.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel65
  - number: '65.6'
    text: |-
      Het vijfde lid is van overeenkomstige toepassing op de gewezen ambtenaar ten aanzien van wie het eerste lid
      toepassing heeft gevonden, indien zijn overlijden het rechtstreeks gevolg is van de arbeidsongeschiktheid, bedoeld
      in dat lid.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel65
  - number: '65.7'
    text: |-
      [ Artikel 62, achtste lid][ref1], is van overeenkomstige toepassing op de bezoldiging, bedoeld in het tweede en
      derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel62
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '62'
        hoofdstuk: '6'
        paragraaf: '5'
  - number: '65.8'
    text: |-
      In afwijking van [artikel 3, eerste lid, onderdeel e][ref1], wordt voor de gewezen ambtenaar aan wie voor 1 januari
      2018 ontslag is verleend met recht op een uitkering op grond van dit artikel, verstaan onder pensioengerechtigde
      leeftijd: de leeftijd van 65 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel3
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '3'
        hoofdstuk: '1'
  - number: 65a.1
    text: |-
      De ambtenaar of de gewezen ambtenaar die een beroepsincident als bedoeld in [artikel 54a, onderdeel f][ref1], is
      overkomen, heeft recht op volledige vergoeding van de schade die hij ten gevolge van dat beroepsincident lijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel54a
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel65a
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 54a
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 65a.2
    text: |-
      De nabestaanden van de ambtenaar die is overleden ten gevolge van een beroepsincident hebben aanspraak op een
      volledige vergoeding van de schade die zij tengevolge daarvan lijden.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel65a
  - number: 65a.3
    text: |-
      De nabestaanden van de gewezen ambtenaar, die is overleden aan de gevolgen van een beroepsincident, hebben
      aanspraak op een volledige vergoeding van de schade die zij tengevolge daarvan lijden, voor zover er op grond van
      het eerste lid geen schadevergoeding aan de gewezen ambtenaar is toegekend.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel65a
  - number: 65a.4
    text: |-
      Bij de vaststelling van de omvang van de in het vorige leden bedoelde schadevergoeding wordt rekening gehouden
      met de materiële aanspraken op grond van de rechtspositie en andere uitkeringen welke in verband staan met het
      beroepsincident.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel65a
  - number: 65a.5
    text: Dit artikel is niet van toepassing op beroepsincidenten die zich hebben voorgedaan voor 1 juni 2012.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel65a
  - number: 65a.6
    text: Onze Minister kan nadere voorschriften geven ten aanzien van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel65a
  - number: '67'
    text: |-
      Voor de toepassing van dit hoofdstuk is, voor de berekening van de bezoldiging,
      [artikel 30 van het Inkomstenbesluit burgerlijke ambtenaren defensie][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel30
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '30'
  - number: '69'
    text: |-
      Met uitzondering van [paragraaf 1][ref1] en van [artikel 64][ref2] is het bepaalde in dit hoofdstuk niet van
      toepassing op de ambtenaar die geen deelnemer is in de zin van het pensioenreglement. In geval van ziekte
      ontvangt hij tijdens de duur van zijn dienstverband op een hem op grond van de [Ziektewet][ref3] of [WAO][ref4]
      toegekende uitkering een aanvulling tot zijn bezoldiging. Indien de ambtenaar wegens ziekte ongeschikt is voor
      de uitoefening van zijn dienstbetrekking, ontvangt hij gedurende de eerste 18 maanden van die ongeschiktheid 100%
      en daarna tot aan het einde van zijn betrekking 80% van zijn bezoldiging, nadat daarop de uitkering ingevolge
      de [ZW][ref5] of de [WAO][ref6] in mindering is gebracht. Op die vermindering zijn de [artikelen 27][ref7] en
      [29 van het Inkomstenbesluit burgerlijke ambtenaren defensie][ref8] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel64
      [ref3]: https://wetten.overheid.nl/BWBR0001888
      [ref4]: https://wetten.overheid.nl/BWBR0002524
      [ref5]: https://wetten.overheid.nl/BWBR0001888
      [ref6]: https://wetten.overheid.nl/BWBR0002524
      [ref7]: https://wetten.overheid.nl/BWBR0018191#Artikel27
      [ref8]: https://wetten.overheid.nl/BWBR0018191#Artikel29
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0006040
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: '64'
        hoofdstuk: '6'
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0001888
      - id: ref4
        bwb_id: BWBR0002524
      - id: ref5
        bwb_id: BWBR0001888
      - id: ref6
        bwb_id: BWBR0002524
      - id: ref7
        bwb_id: BWBR0018191
        artikel: '27'
      - id: ref8
        bwb_id: BWBR0018191
        artikel: '29'
  - number: '70'
    text: |-
      De ambtenaar vervult de uit zijn functie voortvloeiende plichten nauwgezet en ijverig en gedraagt zich zoals een
      goed ambtenaar betaamt.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel70
  - number: 70a
    text: De ambtenaar voldoet aan hetgeen voor hem inzake het afleggen van een eed of een belofte is bepaald.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel70a
  - number: 70b.1
    text: |-
      De ambtenaar meldt aan Onze Minister, op een door Onze Minister te bepalen wijze, de nevenwerkzaamheden die de
      ambtenaar verricht of voornemens is te gaan verrichten, die de belangen van de dienst, voor zover deze in verband
      staan met zijn functievervulling, kunnen raken.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel70b
  - number: 70b.2
    text: Onze Minister voert een registratie van de op grond van het eerste lid gedane meldingen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel70b
  - number: 70b.3
    text: |-
      De ambtenaar verricht geen nevenwerkzaamheden waardoor de goede vervulling van de functie of het goed functioneren
      van de openbare dienst, voor zover dit in verband staat met de functievervulling, niet in redelijkheid zou zijn
      verzekerd.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel70b
  - number: 70b.4
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de melding, bedoeld in het eerste lid, de
      registratie, bedoeld in het tweede lid, en het verbod, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel70b
  - number: 70c.1
    text: |-
      Onze Minister wijst de ambtenaren aan die werkzaamheden verrichten waaraan in het bijzonder het risico van
      financiële belangenverstrengeling of het risico van oneigenlijk gebruik van koersgevoelige informatie verbonden
      is. De aangewezen ambtenaar meldt financiële belangen, alsmede het bezit van en transacties met effecten die de
      belangen van de dienst voor zover deze in verband staan met zijn functievervulling kunnen raken, aan een daartoe
      aangewezen functionaris.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel70c
  - number: 70c.2
    text: Onze Minister voert een registratie van de op grond van het eerste lid gedane meldingen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel70c
  - number: 70c.3
    text: |-
      De ambtenaar verstrekt nadere informatie of bescheiden met betrekking tot de financiële belangen of het bezit
      van of de transacties met effecten, indien daarvoor naar het oordeel van Onze Minister of de door Onze Minister
      aangewezen functionaris, bedoeld in het eerste lid, aanleiding bestaat op grond van de melding of na de melding
      gebleken feiten of omstandigheden.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel70c
  - number: 70c.4
    text: |-
      Het is de ambtenaar verboden financiële belangen te hebben, effecten te bezitten of effectentransacties te
      verrichten waardoor de goede vervulling van de functie of het goed functioneren van de openbare dienst, voorzover
      dit in verband staat met de functievervulling, niet in redelijkheid zou zijn verzekerd.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel70c
  - number: 70c.5
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de melding, bedoeld in het eerste lid, de
      registratie, bedoeld in het tweede lid, en het verbod, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel70c
  - number: 70d.1
    text: |-
      De ambtenaar neemt geen deel, direct of indirect, aan aannemingen en leveringen ten behoeve van openbare diensten,
      tenzij daarvoor toestemming is verleend.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel70d
  - number: 70d.2
    text: |-
      De ambtenaar gedraagt zich naar hetgeen voor de ambtenaar is bepaald ten aanzien van het deelnemen, direct of
      indirect, aan aannemingen en leveringen ten behoeve van anderen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel70d
  - number: 70e
    text: |-
      Aan de ambtenaren of aan bepaalde groepen van ambtenaren van een bepaalde dienst kan door onze Minister worden
      verboden commissaris, bestuurder of vennoot te zijn van alle of nader te omschrijven vennootschappen, stichtingen
      of verenigingen die geregeld in aanraking komen of krachtens haar opzet kunnen komen met de betrokken dienst.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel70e
  - number: 70f.1
    text: |-
      Vergoedingen, beloningen, giften of beloften worden door de ambtenaar in zijn ambt niet van derden gevorderd of
      verzocht of, anders dan met goedvinden van Onze Minister, aangenomen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel70f
  - number: 70f.2
    text: De ambtenaar neemt geen steekpenningen aan.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel70f
  - number: '71.1'
    text: |-
      Het is de ambtenaar verboden in dienst uniformkledingstukken te dragen, tenzij deze van regeringswege zijn
      verstrekt of voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel71
  - number: '71.2'
    text: |-
      Het is de ambtenaar verboden bij het gekleed gaan in uniform insignes of andere onderscheidingstekens te dragen,
      tenzij deze van regeringswege zijn verstrekt of voorgeschreven of tot het dragen daarvan door Onze Minister-
      President vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel71
  - number: '71.3'
    text: |-
      De ambtenaar is verplicht de dienstkleding en de onderscheidingstekenen te dragen, voor zover dit door Onze
      Minister voorgeschreven is.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel71
  - number: '72'
    text: |-
      Ter zake van niet-naleving van bepalingen, welke redelijkerwijs niet kunnen worden geacht de ambtenaar bekend te
      zijn, worden hem geen voordelen onthouden of nadelen toegebracht.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel72
  - number: '74'
    text: |-
      De ambtenaar die door ziekte of anderszins verhinderd is zijn dienst te verrichten, is verplicht, naar regels bij
      ministeriële regeling te stellen, daarvan zo tijdig mogelijk mededeling te doen aan zijn commandant.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel74
  - number: '75.1'
    text: |-
      De ambtenaar kan worden verplicht te gaan wonen of te blijven wonen in of nabij de gemeente die hem als standplaats
      is aangewezen of waartoe zijn standplaats behoort, indien dit naar het oordeel van de commandant noodzakelijk is in
      verband met de goede vervulling van zijn functie.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel75
  - number: '75.2'
    text: |-
      De ambtenaar aan wie de verplichting is opgelegd in of nabij de in het eerste lid bedoelde gemeente te gaan wonen,
      is gehouden zo spoedig mogelijk, maar uiterlijk twee jaar nadat die verplichting is opgelegd, daaraan gevolg te
      geven.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel75
  - number: '76.1'
    text: |-
      De ambtenaar is verplicht indien hem door de commandant een ambts- of dienstwoning ter bewoning is aangewezen,
      deze te betrekken en zich ter zake van de bewoning en het gebruik te gedragen naar de regels, die daaromtrent zijn
      gesteld.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel76
  - number: '76.2'
    text: |-
      De ambtenaar draagt de onderhoudskosten, die volgens de wet en het plaatselijk gebruik gemeenlijk voor rekening van
      de huurder zijn, tenzij door Onze Minister anders wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel76
  - number: '77.1'
    text: Het hoofd defensieonderdeel kan de ambtenaar op diens aanvraag een andere functie opdragen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel77
  - number: '77.2'
    text: |-
      Het hoofd defensieonderdeel kan de ambtenaar indien het belang van de dienst dit vordert, al dan niet in zijn
      dienstvak en al of niet op dezelfde standplaats, een andere functie opdragen die redelijkerwijs in overeenstemming
      is met diens persoonlijkheid, omstandigheden en vooruitzichten; de ambtenaar is verplicht een dergelijke functie
      te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel77
  - number: '77.3'
    text: |-
      De Secretaris-Generaal is bevoegd tot het opdragen van een andere functie als bedoeld in
      het eerste en tweede lid aan een ambtenaar, bezoldigd volgens salarisschaal 14 of hoger van
      [bijlage A van het Inkomstenbesluit burgerlijke ambtenaren defensie][ref1] alsmede aan een ambtenaar die is
      aangesteld in burgerlijke openbare dienst om bij de krijgsmacht als geestelijk verzorger werkzaam te zijn en die
      wordt bezoldigd in de salarisschaal behorend bij de rang van kapitein ter zee/kolonel.


      [ref1]: https://wetten.overheid.nl/BWBR0018191
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0018191
  - number: '78.1'
    text: |-
      Het hoofd defensieonderdeel kan de ambtenaar opdragen tijdelijk andere werkzaamheden te verrichten dan hij
      gewoonlijk verricht en die hem gelet op zijn persoonlijke omstandigheden redelijkerwijs kunnen worden opgedragen.
      De ambtenaar is gehouden deze werkzaamheden te verrichten, met uitzondering van werkzaamheden in de plaats van
      stakers of uitgeslotenen in particuliere dienst, tenzij deze worden verricht in dienst van Defensie en zij tijdens
      de staking of uitsluiting of als onmiddellijk gevolg daarvan, redelijkerwijs noodzakelijk zijn voor de openbare
      dienst.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel78
  - number: '78.2'
    text: |-
      Onze Minister kan, rekening houdend met de persoonlijke omstandigheden van de ambtenaar, de ambtenaar opdragen
      in geval van buitengewone omstandigheden andere werkzaamheden te verrichten dan hij gewoonlijk verricht, mits
      die werkzaamheden strekken tot uitvoering van de taken van de defensieorganisatie of ertoe strekken een zo goed
      mogelijke uitvoering van die taken te verzekeren.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel78
  - number: '78.3'
    text: |-
      Het hoofd defensieonderdeel kan de ambtenaar opdragen lessen te volgen en deel te nemen aan oefeningen met het oog
      op het verrichten van werkzaamheden als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel78
  - number: '82.1'
    text: |-
      De ambtenaar, die een besturende, beherende dan wel toezichthoudende functie vervult in een naamloze vennootschap
      of ander rechtspersoonlijkheid bezittend lichaam, en voor de in die functie verrichte of te verrichten
      werkzaamheden, anders dan uit 's-Rijks kas, een vergoeding ontvangt, is verplicht die vergoeding in genoemde kas te
      storten, indien de benoeming in die functie:
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel82
  - number: 82.1.a
    text: heeft plaats gehad door dan wel in overeenstemming met Onze Minister;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel82
  - number: 82.1.b
    text: |-
      is voortgevloeid uit een wettelijk voorschrift dan wel uit een overeenkomst, welke met instemming van Onze Minister
      of de Ministerraad is tot stand gekomen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel82
  - number: '82.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van de ambtenaar, die een nevenfunctie vervult, welke
      verband houdt met het door hem beklede ambt en hem is opgedragen door Onze Minister, en voor de in die functie
      verrichte of te verrichten werkzaamheden, anders dan uit 's-Rijks kas, een vergoeding ontvangt.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel82
  - number: '82.3'
    text: Het eerste en tweede lid vinden geen toepassing in de gevallen, waarin dit door Onze Minister-President is bepaald.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel82
  - number: '85.1'
    text: |-
      Onze Minister kan de ambtenaar verplichten tot gehele of gedeeltelijke vergoeding van de door de dienst geleden
      schade:
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel85
  - number: 85.1.a
    text: |-
      indien deze schade in het kader van de vervulling van aan de ambtenaar opgedragen taken en werkzaamheden is
      ontstaan door opzet of bewuste roekeloosheid van de ambtenaar; dan wel
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel85
  - number: 85.1.b
    text: |-
      indien deze schade buiten het kader van aan de ambtenaar opgedragen taken en werkzaamheden is ontstaan door
      verwijtbaar handelen van de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel85
  - number: '85.2'
    text: |-
      Wanneer de schade is veroorzaakt door meerdere tot het Defensiepersoneel behorende personen gezamenlijk, kan in
      beginsel ieder afzonderlijk tot vergoeding van de gehele schade worden verplicht.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel85
  - number: '87'
    text: |-
      De ambtenaar heeft recht op vergoeding van reis- en verblijfkosten wegens dienstreizen ingevolge het
      [Besluit dienstreizen defensie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007956
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0007956
  - number: 87a.1
    text: |-
      Voor de toepassing van dit artikel wordt onder kinderopvang en gastouderopvang verstaan hetgeen daaronder wordt
      verstaan in [artikel 1.1, eerste lid, van de Wet kinderopvang][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel87a
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
  - number: 87a.2
    text: |-
      Door het hoofd defensieonderdeel kan naar bij ministeriële regeling te stellen regels, financieel worden
      bijgedragen in de kosten van de ambtenaar voor kinderopvang of gastouderopvang van een of meerdere kinderen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel87a
  - number: 87a.3
    text: |-
      De bijdrage, als bedoeld in het tweede lid, eindigt met ingang van de dag waarop de ambtenaar ontslag wordt
      verleend.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel87a
  - number: 87a.4
    text: |-
      Wanneer sprake is van een ontslag op grond van [artikel 116][ref1] van dit besluit, eindigt de bijdrage, als
      bedoeld in het tweede lid, in afwijking van het vierde lid, 6 maanden na de datum waarop dat ontslag is ingegaan
      of op het moment dat uit andere hoofde aanspraak bestaat op een bijdrage, als bedoeld in het tweede lid. Gedurende
      deze periode van 6 maanden blijft de situatie van voor het ontslag ongewijzigd gehandhaafd.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel116
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel87a
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '116'
        hoofdstuk: '10'
  - number: '88'
    text: |-
      Onze Minister kan de ambtenaar naar billijkheid schadeloos stellen voor schaden anders dan bedoeld in
      [artikel 62 van het Inkomstenbesluit burgerlijke ambtenaren defensie][ref1] en is bevoegd hieromtrent voor groepen
      van ambtenaren regels te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel62
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '62'
  - number: '89.1'
    text: |-
      De ambtenaar, die in contact staat of kort geleden gestaan heeft met een persoon, die een ziekte heeft, waarvoor
      ingevolge het krachtens de [Wet publieke gezondheid][ref1] bepaalde een nominatieve aangifteplicht geldt, mag zijn
      dienst niet verrichten en heeft geen toegang tot dienstgebouwen-, lokalen en -terreinen dan met toestemming van de
      commandant, dat deze toestemming slechts kan verlenen na positief advies van de deskundige persoon of de arbodienst
      bedoeld in [artikel 54a, onderdeel b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024705
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel54a
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0024705
      - id: ref2
        bwb_id: BWBR0006040
        artikel: 54a
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '89.2'
    text: |-
      De ambtenaar, die verkeert in de in het eerste lid omschreven situatie, is verplicht daarvan ten spoedigste kennis
      te geven aan de deskundige persoon of de arbodienst bedoeld in [artikel 54a, onderdeel b][ref1]. Hij is gehouden
      zich te gedragen naar de vanwege de deskundige persoon of de arbodienst bedoeld in [artikel 54a, onderdeel b][ref2]
      gegeven aanwijzingen, waaronder die met betrekking tot het ondergaan van een geneeskundig onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel54a
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel54a
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 54a
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: 54a
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '89.3'
    text: |-
      Gedurende de periode dat de ambtenaar ingevolge het bepaalde in dit artikel zijn dienst niet verricht, geniet hij
      zijn volle bezoldiging.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel89
  - number: 91a.1
    text: |-
      De ambtenaar die werkzaam is in een vertrouwensfunctie waarin hij toegang heeft tot zeer geheime of geheime
      gegevens waarvan de kennisneming door niet-gerechtigden zeer ernstige of ernstige schade aan de veiligheid of
      andere gewichtige belangen van de staat kan veroorzaken, is verplicht van een, anders dan in de uitoefening van
      zijn functie, voorgenomen reis naar of verblijf in bij koninklijk besluit aangewezen landen, ten minste zes weken
      voor vertrek mededeling te doen aan de Directeur Militaire Inlichtingen- en Veiligheidsdienst.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel91a
  - number: 91a.2
    text: |-
      Een ambtenaar die tijdens het verblijf in een land als bedoeld in het eerste lid betrokken is geweest bij een
      incident dat van belang kan zijn uit het oogpunt van veiligheid of andere gewichtige belangen van de staat, is
      verplicht daarvan onmiddellijk bij terugkomst melding te doen aan een daartoe aangewezen functionaris van de
      Militaire Inlichtingen- en Veiligheidsdienst.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel91a
  - number: 91a.3
    text: |-
      Dit artikel is niet van toepassing op de ambtenaar, bedoeld in
      [artikel 10 van de Wet op de inlichtingen- en veiligheidsdiensten 2002][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel10
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel91a
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '10'
  - number: '92'
    text: Verplichting tot zekerheidsstelling wordt de ambtenaar niet opgelegd.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel92
  - number: '93.1'
    text: |-
      De ambtenaar die namens een minister is belast met de in
      [artikel 24, tweede en derde lid, van de Comptabiliteitswet 2001][ref1] vermelde taken, is verplicht een tekort
      geheel of gedeeltelijk aan te zuiveren, wanneer hem ter zake van dat tekort een ernstig verwijt kan worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel24
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '24'
  - number: '93.2'
    text: |-
      De ambtenaar, bedoeld in [artikel 1, eerste lid, onder c, van het Besluit materieelbeheer 1996][ref1], is verplicht
      schade te vergoeden, wanneer hem ter zake van die schade een ernstig verwijt kan worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0007803#Artikel1
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0007803
        artikel: '1'
  - number: '96.1'
    text: |-
      Aan de ambtenaar kan door de commandant de toegang tot de dienstlokalen, dienstgebouwen of het werk, dan wel het
      verblijf aldaar, worden ontzegd.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel96
  - number: '96.2'
    text: |-
      Hij is verplicht zich te gedragen naar de maatregelen van orde, die ten aanzien van het verblijf aldaar zijn
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel96
  - number: '97'
    text: |-
      Het is de ambtenaar verboden gedurende de werktijd alcoholhoudende dranken te gebruiken, bij zich te hebben of in
      de dienstlokalen te bewaren.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel97
  - number: 98a.1
    text: In dit hoofdstuk wordt onder ambtenaar mede verstaan
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98a
  - number: 98a.1.a
    text: de gewezen ambtenaar;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98a
  - number: 98a.1.b
    text: degenen die anderszins arbeid verrichten of hebben verricht bij het Ministerie van Defensie.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98a
  - number: 98a.2
    text: 'in dit hoofdstuk wordt voorts verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98a
  - number: 98a.2.a
    text: 'COID: de Centrale Organisatie Integriteit Defensie;'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98a
  - number: 98a.2.b
    text: 'melder: degene die een vermoeden van een misstand meldt overeenkomstig dit hoofdstuk;'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98a
  - number: 98a.2.c
    text: 'melding: de melding van een vermoeden van een misstand.'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98a
  - number: 98b
    text: |-
      Ten aanzien van een vertrouwenspersoon integriteit of een gewezen vertrouwenspersoon integriteit wordt vanwege
      de uitoefening van zijn taken op basis van dit besluit geen beslissing genomen of handeling verricht met nadelige
      gevolgen voor zijn rechtspositie.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98b
  - number: 98c.1
    text: Het hoofd defensieonderdeel wijst een of meer vertrouwenspersonen integriteit aan bij zijn defensieonderdeel.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98c
  - number: 98c.2
    text: 'De vertrouwenspersoon integriteit heeft in elk geval tot taak:'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98c
  - number: 98c.2.a
    text: een ambtenaar op diens verzoek te adviseren over het omgaan met een vermoeden van een misstand; en
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98c
  - number: 98c.2.b
    text: het hoofd defensieonderdeel, de Secretaris-Generaal en de COID te informeren over een melding.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98c
  - number: 98d.1
    text: |-
      Een ambtenaar doet een melding bij zijn direct leidinggevende, bij een hogere leidinggevende, bij het Meldpunt van
      de COID of bij een vertrouwenspersoon integriteit. Indien dit niet in redelijkheid van hem kan worden gevraagd, kan
      hij rechtstreeks een melding doen bij de afdeling onderzoek van het Huis voor klokkenluiders of een andere daartoe
      bevoegde instantie.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98d
  - number: 98d.2
    text: |-
      Een melding over een andere organisatie dan het defensieonderdeel waar hij tewerkgesteld doet een ambtenaar bij
      een leidinggevende of bij een vertrouwenspersoon van die organisatie of, indien dit in redelijkheid niet van hem
      kan worden gevraagd, rechtstreeks bij de afdeling onderzoek van het Huis voor klokkenluiders of een andere daartoe
      bevoegde instantie.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98d
  - number: 98e
    text: |-
      Een ambtenaar kan een krachtens [artikel 98c, eerste lid][ref1], aangewezen vertrouwenspersoon integriteit in
      vertrouwen raadplegen over een vermoeden van een misstand.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel98c
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98e
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 98c
        hoofdstuk: 7c
        paragraaf: '2'
  - number: 98f
    text: |-
      De vertrouwenspersoon integriteit maakt de identiteit van de melder niet bekend zonder schriftelijke instemming van
      de melder.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98f
  - number: 98g
    text: |-
      Degene bij wie een melding is gedaan, stelt het hoofd defensieonderdeel, de Secretaris-Generaal en de COID
      onverwijld in kennis van de melding en de datum waarop deze is ontvangen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98g
  - number: 98h
    text: |-
      Diegenen die betrokken zijn bij de behandeling van de melding gaan vertrouwelijk met de melding en de identiteit
      van de melder om.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98h
  - number: 98i
    text: |-
      Het hoofd defensieonderdeel bevestigt de ontvangst van de melding schriftelijk aan de melder, al dan niet via
      de vertrouwenspersoon integriteit, en informeert de persoon of personen op wie de melding betrekking heeft over
      de melding, tenzij daardoor een onderzoeksbelang of een belang van de melder onnodig of onevenredig kan worden
      geschaad. Een afschrift wordt gezonden aan de Secretaris-Generaal en de COID.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98i
  - number: 98j.1
    text: 'De commandant stelt onverwijld een onderzoek in naar het vermoeden van een misstand, tenzij:'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98j
  - number: 98j.1.a
    text: het vermoeden van een misstand kennelijk ongegrond is;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98j
  - number: 98j.1.b
    text: de melding kennelijk onredelijk laat is gedaan.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98j
  - number: 98j.2
    text: |-
      De commandant meldt het achterwege laten van een onderzoek en van de verdere behandeling van de melding zo spoedig
      mogelijk schriftelijk en gemotiveerd aan de melder, al dan niet via de vertrouwenspersoon integriteit, alsmede aan
      de persoon of personen op wie de melding betrekking heeft, indien deze op de hoogte zijn gebracht van de melding.
      Een afschrift wordt gezonden aan de Secretaris-Generaal en de COID.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98j
  - number: 98j.3
    text: |-
      Bij de kennisgeving, bedoeld in het tweede lid, wordt mededeling gedaan van de mogelijkheid het vermoeden van
      een misstand te melden bij de afdeling onderzoek van het Huis voor klokkenluiders of een andere daartoe bevoegde
      instantie.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98j
  - number: 98j.4
    text: |-
      Het onderzoek wordt niet verricht door een persoon die mogelijk betrokken is of is geweest bij de vermoedelijke
      misstand of op onvoldoende afstand staat van de te onderzoeken kwestie of personen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98j
  - number: 98k.1
    text: |-
      De commandant stelt de melder, al dan niet via de vertrouwenspersoon integriteit, binnen twaalf weken na de melding
      schriftelijk en gemotiveerd in kennis van de bevindingen van het onderzoek, het oordeel daarover en de eventuele
      consequenties die daaraan worden verbonden.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98k
  - number: 98k.2
    text: |-
      Als niet binnen twaalf weken toepassing kan worden gegeven aan het eerste lid, wordt de melder, al dan niet via
      de vertrouwenspersoon integriteit, voordat deze termijn verlopen is daarvan schriftelijk en gemotiveerd op de
      hoogte gesteld. Daarbij wordt de termijn aangegeven waarbinnen de melder, al dan niet via de vertrouwenspersoon
      integriteit, een kennisgeving als bedoeld in het eerste lid ontvangt.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98k
  - number: 98k.3
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op de persoon of personen op wie de melding betrekking
      heeft, tenzij daardoor een onderzoeksbelang kan worden geschaad.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98k
  - number: 98k.4
    text: |-
      Bij de kennisgeving, bedoeld in het eerste lid, wordt mededeling gedaan van de mogelijkheid het vermoeden van
      een misstand te melden bij de afdeling onderzoek van het Huis voor klokkenluiders of een andere daartoe bevoegde
      instantie.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98k
  - number: 98l.1
    text: |-
      Indien de afdeling onderzoek van het Huis voor klokkenluiders aan het bevoegd gezag in haar rapport een aanbeveling
      doet als bedoeld in [artikel 17, tweede lid, onder c, van de Wet Huis voor klokkenluiders][ref1], stelt de
      commandant de melder, al dan niet via de vertrouwenspersoon integriteit, en de persoon of personen op wie de
      melding betrekking heeft, uiterlijk binnen twaalf weken na openbaarmaking van het rapport schriftelijk in kennis
      van zijn standpunt dienaangaande en de eventuele consequenties die het daaraan verbindt. Een afschrift wordt
      gezonden naar het hoofd defensieonderdeel, de Secretaris-Generaal en de COID.


      [ref1]: https://wetten.overheid.nl/BWBR0037852#Artikel17
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98l
    references:
      - id: ref1
        bwb_id: BWBR0037852
        artikel: '17'
  - number: 98l.2
    text: |-
      Als het standpunt en de consequenties afwijken van de aanbeveling, vermeldt de commandant de reden voor de
      afwijking.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98l
  - number: 98m.1
    text: |-
      De melder of de vertrouwenspersoon integriteit of de gewezen vertrouwenspersoon integriteit, die bezwaar maakt of
      een gerechtelijke procedure instelt, kan aanspraak maken op een tegemoetkoming in de kosten van die procedure, op
      voorwaarde dat:
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98m
  - number: 98m.1.a
    text: |-
      de procedure is gericht tegen een gestelde benadeling als gevolg van een melding dan wel de procedure is gericht
      tegen een gestelde benadeling van de vertrouwenspersoon integriteit of de gewezen vertrouwenspersoon integriteit
      als gevolg van de uitoefening van zijn functie als vertrouwenspersoon integriteit;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98m
  - number: 98m.1.b
    text: |-
      de benadeling, bedoeld in onderdeel a, heeft plaatsgevonden binnen vijf jaar nadat het bevoegd gezag kennis
      heeft gegeven van de bevindingen en het oordeel, bedoeld in [artikel 98j, eerste lid][ref1], of binnen vijf jaar
      na openbaarmaking van een rapport als bedoeld in [artikel 17 van de Wet Huis voor klokkenluiders][ref2] door
      de afdeling onderzoek van het Huis voor klokkenluiders, dan wel binnen vijf jaar nadat de melding anderszins is
      afgehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel98j
      [ref2]: https://wetten.overheid.nl/BWBR0037852#Artikel17
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98m
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 98j
        hoofdstuk: 7c
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0037852
        artikel: '17'
  - number: 98m.2
    text: |-
      De melder of de vertrouwenspersoon integriteit of de gewezen vertrouwenspersoon integriteit die zijn zienswijze
      naar voren brengt met betrekking tot een voorgenomen beslissing of handeling die naar zijn oordeel een benadeling
      inhoudt als gevolg van een melding of van de uitoefening van zijn functie als vertrouwenspersoon integriteit, kan
      aanspraak maken op een tegemoetkoming in de kosten, indien:
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98m
  - number: 98m.2.a
    text: het voornemen is kenbaar gemaakt binnen de in het eerste lid, onder b, genoemde termijn, en
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98m
  - number: 98m.2.b
    text: |-
      in de zienswijze naar voren wordt gebracht dat de voorgenomen beslissing of handeling het gevolg is van de melding
      of van de uitoefening van zijn functie als vertrouwenspersoon integriteit.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98m
  - number: 98m.3
    text: |-
      De melder, de vertrouwenspersoon integriteit, of de gewezen vertrouwenspersoon integriteit richt een verzoek om een
      tegemoetkoming aan het hoofd defensieonderdeel.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98m
  - number: 98m.4
    text: |-
      Aanspraak op een tegemoetkoming bestaat alleen voor zover in verband met de in het eerste en tweede lid bedoelde
      procedures daadwerkelijk kosten worden of zijn gemaakt met betrekking tot door een derde beroepsmatig verleende
      rechtsbijstand.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98m
  - number: 98n.1
    text: |-
      De tegemoetkoming voor iedere afzonderlijke procedure, bedoeld in [artikel 98m, eerste en tweede lid][ref1], is
      gelijk aan tweemaal het bedrag, genoemd in onderdeel B1 van de [bijlage bij het Besluit proceskosten bestuursrecht]
      (onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel98m
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98n
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 98m
        hoofdstuk: 7c
        paragraaf: '3'
  - number: 98n.2
    text: |-
      [Artikel 3 van het Besluit proceskosten bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006358#Artikel3
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98n
    references:
      - id: ref1
        bwb_id: BWBR0006358
        artikel: '3'
  - number: 98o.1
    text: Het hoofd defensieonderdeel beslist binnen zes weken op het verzoek.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98o
  - number: 98o.2
    text: |-
      Het hoofd defensieonderdeel kan de beslissing voor ten hoogste vier weken verdagen. Van de verdaging wordt
      schriftelijk mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98o
  - number: 98p
    text: |-
      Degene aan wie een tegemoetkoming is toegekend, kan worden verplicht tot terugbetaling, indien hij de procedure
      waarop de tegemoetkoming betrekking heeft voortijdig staakt. Deze verplichting geldt niet, indien het staken
      van de procedure direct voortvloeit uit de intrekking door de commandant van de beslissing of het herzien van de
      handeling, waartegen de procedure is gericht.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98p
  - number: 98q.1
    text: |-
      Als een beslissing of handeling of een voorgenomen beslissing of handeling waarvoor op grond van
      [artikel 98m][ref1] aanspraak bestaat op een tegemoetkoming in de kosten van de procedures, in de bezwaarprocedure
      of zienswijzeprocedure wordt herroepen wegens een aan de commandant of het hoofd defensieonderdeel te wijten
      onrechtmatigheid of de bestreden beslissing of handeling als gevolg van een uitspraak van de rechter die
      onherroepelijk is geworden wordt vernietigd, waarbij de rechtsgevolgen niet in stand worden gelaten, vergoedt het
      hoofd defensieonderdeel voor iedere afzonderlijke procedure aan de melder, de vertrouwenspersoon integriteit of de
      gewezen vertrouwenspersoon integriteit alle daadwerkelijk en in redelijkheid door hem gemaakte kosten als bedoeld
      in [artikel 1 van het Besluit proceskosten bestuursrecht][ref2], met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel98m
      [ref2]: https://wetten.overheid.nl/BWBR0006358#Artikel1
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98q
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 98m
        hoofdstuk: 7c
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006358
        artikel: '1'
  - number: 98q.1.a
    text: de vergoeding wordt toegekend zonder toepassing van het tariefsysteem in voornoemd besluit;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98q
  - number: 98q.1.b
    text: |-
      de kosten van door een derde beroepsmatig verleende rechtsbijstand worden vergoed voor een bedrag van ten hoogste €
      258,57 per uur tot een bedrag van ten hoogste € 6.205,71, beide bedragen exclusief BTW en kantoorkosten;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98q
  - number: 98q.1.c
    text: |-
      aan de betrokkene toegekende bedragen waarop hij op grond van een ander wettelijk voorschrift of een uitspraak van
      een gerechtelijke instantie aanspraak heeft in verband met de vergoeding van kosten als bedoeld in dit artikel, in
      aftrek worden gebracht op de vergoeding.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98q
  - number: 98q.2
    text: |-
      De in het eerste lid genoemde bedragen worden per 1 januari van elk jaar bij ministeriële regeling gewijzigd aan de
      hand van de consumentenprijsindex, geldend voor de maand september van het voorafgaande jaar.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98q
  - number: 98r
    text: |-
      Op meldingen van ambtenaren die zijn gedaan voor het tijdstip van inwerkingtreding van artikel
      2.10, onderdeel i, van het Besluit van […] houdende aanpassing van besluiten in verband met de
      invoering van de normalisering van de rechtspositie van ambtenaren (Stb. […]) in de zin van de
      [Interne klokkenluidersregeling Rijk, Politie en Defensie][ref1], zoals die luidde voorafgaand aan het bedoelde
      tijdstip, is met ingang van dat tijdstip dit hoofdstuk van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0038940
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel98r
    references:
      - id: ref1
        bwb_id: BWBR0038940
  - number: '99.1'
    text: |-
      De ambtenaar, die de hem opgelegde verplichtingen niet nakomt of zich overigens aan plichtsverzuim schuldig maakt,
      kan deswege disciplinair worden gestraft.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel99
  - number: '99.2'
    text: |-
      Plichtsverzuim omvat zowel het overtreden van enig voorschrift als het doen of nalaten van iets, hetwelk een goed
      ambtenaar in gelijke omstandigheden behoort na te laten of te doen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel99
  - number: '99.3'
    text: De straf wordt opgelegd door Onze Minister of een door hem aangewezen autoriteit.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel99
  - number: '99.4'
    text: |-
      In afwijking van het derde lid, geschiedt het opleggen van straffen, genoemd in
      [artikel 100, eerste lid onder i en l][ref1], aan de ambtenaar die bij koninklijk besluit is aangesteld, door Onze
      Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel100
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '100'
        hoofdstuk: '8'
  - number: '100.1'
    text: 'De disciplinaire straffen, welke kunnen worden opgelegd, zijn:'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel100
  - number: 100.1.a
    text: schriftelijke berisping;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel100
  - number: 100.1.b
    text: |-
      buitengewone dienst op andere dagen dan zondag en de voor de ambtenaar geldende kerkelijke feestdagen, zonder
      beloning of tegen een lagere dan de normale beloning en wel voor ten hoogste 6 uren met een maximum van 3 uren
      per dag;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel100
  - number: 100.1.c
    text: |-
      vermindering van het recht op jaarlijkse vakantie met ten hoogste één derde van het aantal uren, waarop in het
      desbetreffende kalenderjaar aanspraak bestaat;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel100
  - number: 100.1.d
    text: geldboete van ten minste € 2 en ten hoogste € 22,50;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel100
  - number: 100.1.e
    text: gehele of gedeeltelijke inhouding van salaris tot een bedrag van ten hoogste het salaris over een halve maand;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel100
  - number: 100.1.f
    text: |-
      vaststelling van het salaris op een bedrag in de voor de ambtenaar geldende salarisschaal dat maximaal
      twee jaarlijkse periodieke salarisverhogingen minder bedraagt dan ingevolge de op hem van toepassing zijnde
      bezoldigingsregeling behoort te gelden, of indien voor het door de ambtenaar beklede ambt geen salarisschaal geldt,
      vermindering van het salaris met ten hoogste 5%, een en ander voor de tijd van niet langer dan twee jaren;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel100
  - number: 100.1.g
    text: het niet toekennen van periodieke salarisverhogingen gedurende ten hoogste vier jaren;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel100
  - number: 100.1.h
    text: |-
      uitsluiting voor de tijd van ten hoogste vier jaren van indeling in een salarisschaal waarvoor een hoger
      maximumsalaris geldt, indien zodanige indeling anders volgens de daarvoor geldende regeling zou hebben
      plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel100
  - number: 100.1.i
    text: |-
      indeling in een salarisschaal waarvoor een lager maximumsalaris geldt dan dat verbonden aan de salarisschaal
      welke ingevolge de van toepassing zijnde bezoldigingsregeling behoort te gelden, een en ander al dan niet voor een
      bepaalde tijd en met of zonder vermindering van bezoldiging;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel100
  - number: 100.1.j
    text: |-
      verplaatsing, al dan niet met verlening van een tegemoetkoming in mogelijke verplaatsingskosten tot ten hoogste het
      bedrag, dat in geval van verplaatsing in het belang van de dienst zou kunnen worden verleend;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel100
  - number: 100.1.k
    text: schorsing voor een bepaalde tijd met geheel of gedeeltelijke inhouding van bezoldiging;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel100
  - number: 100.1.l
    text: ontslag.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel100
  - number: '100.2'
    text: |-
      Een opgelegde straf, als bedoeld in het eerste lid onder g, h, of i, kan, indien daar gelet
      op het gedrag van betrokken ambtenaar naar het oordeel van de bevoegde autoriteit, bedoeld in
      [artikel 99, derde of vierde lid][ref1], reden voor is, ongedaan worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel99
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '99'
        hoofdstuk: '8'
  - number: '100.3'
    text: |-
      Bij het opleggen van een straf kan worden bepaald, dat zij niet ten uitvoer zal worden gelegd, indien de ambtenaar
      zich gedurende een vastgestelde termijn niet schuldig maakt aan soortgelijk plichtsverzuim, als waarvoor de
      bestraffing plaats vindt, noch aan enig ander ernstig plichtsverzuim en zich houdt aan bij het opleggen van de
      straf eventueel gestelde bijzondere voorwaarden.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel100
  - number: '101.1'
    text: |-
      Indien de ambtenaar verantwoording aflegt doet hij dit ten overstaan van Onze Minister of een door hem aangewezen
      autoriteit. Deze bepaalt of de verantwoording mondeling of schriftelijk zal geschieden, met dien verstande dat
      bij schriftelijke verantwoording de ambtenaar op zijn verzoek gelegenheid wordt gegeven tot nadere mondelinge
      toelichting. De ambtenaar kan zich door een rechtskundige of een andere raadsman doen bijstaan.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel101
  - number: '101.2'
    text: |-
      Van de mondelinge verantwoording en van een eventuele nadere mondelinge toelichting wordt aanstonds proces-verbaal
      opgemaakt, dat na voorlezing wordt getekend door hem, te wiens overstaan de verantwoording heeft plaatsgevonden en
      door de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel101
  - number: '102'
    text: |-
      De ambtenaar kan niet gestraft worden wegens overtreding van [artikel 10 van de Ambtenarenwet 2017][ref1], dan
      nadat daarover advies is ingewonnen van de Adviescommissie grondrechten en functieuitoefening ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel10
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '10'
  - number: '103.1'
    text: |-
      De straf, behalve die van schriftelijke berisping, wordt niet ten uitvoer gelegd, zolang zij niet onherroepelijk is
      geworden, tenzij bij de strafoplegging onmiddellijke tenuitvoerlegging is bevolen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel103
  - number: '103.2'
    text: |-
      De ambtenaar dient van de ontvangst van een besluit inzake strafoplegging te doen blijken door onverwijlde
      terugzending van een door hem ondertekend en gedateerd ontvangstbewijs.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel103
  - number: 103a
    text: |-
      In de [artikelen 103a tot en met 103i][ref1] wordt verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel103a
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel103a
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 103a
        hoofdstuk: 8a
        paragraaf: '1'
  - number: 103a.a
    text: |-
      belanghebbende: degene op wie het in [artikel 102][ref1] bedoelde voornemen betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel102
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel103a
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '102'
        hoofdstuk: '8'
  - number: 103a.b
    text: |-
      commissie: de Adviescommissie grondrechten en functie-uitoefening defensieambtenaren bedoeld in
      [artikel 103b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel103b
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel103a
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 103b
        hoofdstuk: 8a
        paragraaf: '1'
  - number: 103b.1
    text: Er is een Adviescommissie grondrechten en functie-uitoefening defensieambtenaren.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel103b
  - number: 103b.2
    text: |-
      De commissie heeft tot taak het bevoegd gezag van advies te dienen over het voornemen een disciplinaire straf op te
      leggen als bedoeld in [artikel 102][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel102
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel103b
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '102'
        hoofdstuk: '8'
  - number: 103c.1
    text: |-
      De commissie bestaat uit vijf leden onder wie de voorzitter. Voorts kunnen een plaatsvervangend voorzitter en
      plaatsvervangende leden worden benoemd. De plaatsvervangend voorzitter wordt uit de leden benoemd.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel103c
  - number: 103c.2
    text: |-
      De voorzitter en de andere leden, alsmede hun plaatsvervangers worden bij koninklijk besluit op voordracht van Onze
      Minister benoemd en ontslagen. Onze Minister stelt de centrales van overheidspersoneel die deel uitmaken van de
      Sectorcommissie Defensie, bedoeld in [artikel 4 van het Besluit georganiseerd overleg sector defensie][ref1], in de
      gelegenheid voorstellen te doen voor leden, alsmede hun plaatsvervangers.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel4
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel103c
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '4'
  - number: 103c.3
    text: |-
      De voorzitter en de andere leden, alsmede hun plaatsvervangers, worden benoemd voor een periode van ten hoogste
      vier jaar. Herbenoeming kan tweemaal en telkens voor ten hoogste vier jaar plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel103c
  - number: 103d
    text: |-
      De commissie wordt bijgestaan door een secretaris en een plaatsvervangend secretaris. Zij worden door Onze Minister
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel103d
  - number: 103e.1
    text: |-
      Wanneer het advies van de commissie wordt gevraagd, worden daarbij afschriften van de ter zake dienende stukken
      overgelegd.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel103e
  - number: 103e.2
    text: |-
      Wanneer uit een oogpunt van bronbescherming de inhoud van bepaalde stukken ter uitsluitende kennisneming van de
      commissie dient te blijven, wordt dat aan de commissie medegedeeld.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel103e
  - number: 103e.3
    text: De commissie is bevoegd voorts alle inlichtingen in te winnen die zij voor de vorming van haar advies nodig acht.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel103e
  - number: 103f.1
    text: |-
      Zo spoedig mogelijk na ontvangst van de adviesaanvraag stelt de voorzitter de datum voor een vergadering vast, die
      – behoudens dringende redenen – niet later dan vier weken na de ontvangst mag plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel103f
  - number: 103f.2
    text: |-
      De secretaris geeft de belanghebbende alsmede het bevoegd gezag onverwijld na de vaststelling kennis van plaats
      en tijdstip der vergadering onder mededeling van het bepaalde in het derde lid, alsmede van het bepaalde in
      [103g, eerste lid, tweede volzin][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel103g
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel103f
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 103g
        hoofdstuk: 8a
        paragraaf: '3'
  - number: 103f.3
    text: |-
      De belanghebbende en zijn raadsman worden voor deze vergadering in de gelegenheid gesteld kennis en afschrift
      te nemen van alle op de zaak betrekking hebbende stukken, voor zover niet [artikel 103e, tweede lid][ref1], van
      toepassing is. In voorkomend geval wordt de belanghebbende daarvan mededeling gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel103e
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel103f
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 103e
        hoofdstuk: 8a
        paragraaf: '3'
  - number: 103g.1
    text: |-
      De commissie hoort ter vergadering de belanghebbende, tenzij deze heeft verklaard daarop geen prijs te stellen of
      zonder gegronde reden aan een daartoe gedane oproeping geen gevolg heeft gegeven. De belanghebbende kan zich ter
      vergadering van de commissie laten bijstaan door een raadsman.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel103g
  - number: 103g.2
    text: |-
      Het bevoegd gezag wordt in de gelegenheid gesteld zijn standpunt ter vergadering van de commissie nader te doen
      toelichten.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel103g
  - number: 103g.3
    text: |-
      De commissie is bevoegd iedere ambtenaar ten aanzien waarvan zij het horen wenselijk acht te doen oproepen ter
      vergadering. De opgeroepen ambtenaar verstrekt desgevraagd alle inlichtingen. Indien dit uit een oogpunt van
      bronbescherming noodzakelijk is, verstrekt de ambtenaar de inlichtingen slechts in het bijzijn van de commissie.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel103g
  - number: 103g.4
    text: De commissie kan al dan niet op verzoek van de belanghebbende andere personen horen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel103g
  - number: 103h.1
    text: |-
      De commissie vergadert niet indien niet tenminste de voorzitter en twee andere leden, dan wel hun plaatsvervangers
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel103h
  - number: 103h.2
    text: De vergaderingen van de commissie zijn niet openbaar.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel103h
  - number: 103i.1
    text: |-
      De commissie beslist bij meerderheid van stemmen. Noch de voorzitter, noch een der andere leden onthoudt zich van
      deelneming aan enige stemming. Indien de stemmen staken geeft de stem van de voorzitter de doorslag.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel103i
  - number: 103i.2
    text: |-
      Het advies van de commissie wordt met redenen omkleed. Indien in de commissie een minderheidsstandpunt bestaat,
      wordt dit, alsmede de daaraan ten grondslag liggende argumenten, desverlangd in het advies opgenomen. Het advies
      wordt door de voorzitter en de secretaris ondertekend.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel103i
  - number: 103i.3
    text: |-
      Behoudens dringende redenen wordt het advies niet later dan vier weken na de in [artikel 103f, eerste lid][ref1],
      bedoelde vergadering uitgebracht aan het in [artikel 103b][ref2] bedoelde adviesvragende gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel103f
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel103b
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel103i
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 103f
        hoofdstuk: 8a
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: 103b
        hoofdstuk: 8a
        paragraaf: '1'
  - number: '104'
    text: |-
      Voor de toepassing van dit hoofdstuk wordt verstaan onder: - *ambtenaar* de ambtenaar, die: 1.
      is aangesteld in vaste dienst; 2. is aangesteld in tijdelijke dienst voor een proeftijd bedoeld
      in [artikel 7, tweede lid, onder a][ref1]; 3. is aangesteld in tijdelijke dienst bedoeld in
      [artikel 7, vijfde lid][ref2];
        - *boventalligheid* de situatie dat een ambtenaar zijn functie verliest omdat binnen de te reorganiseren
      organisatie of een onderdeel daarvan, meerdere ambtenaren een vergelijkbare of uitwisselbare functie vervullen en
      het totale aantal van die functies zodanig wordt verminderd dat onvoldoende van die functies resteren.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel7
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '105.1'
    text: |-
      Een functie is in beginsel passend wanneer de daaraan verbonden werkzaamheden op de capaciteiten en ervaring van
      de ambtenaar zijn berekend, tenzij aanvaarding om redenen van lichamelijke, geestelijke of sociale aard niet van de
      ambtenaar kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel105
  - number: '105.2'
    text: Bij ministeriële regeling worden nadere regels gesteld ter uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel105
  - number: '106.1'
    text: |-
      De ambtenaar van wie de functie wordt opgeheven of waarvoor boventalligheid is vastgesteld, wordt door het hoofd
      defensieonderdeel aangewezen als herplaatsingskandidaat en wordt hierover schriftelijk geïnformeerd.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel106
  - number: '106.2'
    text: |-
      In afwijking van het eerste lid kan Onze Minister bij ministeriële regeling bepalen dat specifieke categorieën
      ambtenaren van wie de functie wordt opgeheven of waarvoor boventalligheid is vastgesteld niet worden aangewezen
      als herplaatsingskandidaat.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel106
  - number: '107.1'
    text: |-
      Onze Minister onderzoekt gedurende drie maanden, te rekenen vanaf het moment dat de ambtenaar is aangewezen als
      herplaatsingskandidaat, of herplaatsing van de ambtenaar op een passende functie binnen het gezagsbereik van Onze
      Minister mogelijk is.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel107
  - number: '107.2'
    text: |-
      Indien het onderzoek bedoeld in het eerste lid niet heeft geleid tot herplaatsing, onderzoekt Onze Minister,
      aansluitend aan de periode bedoeld in het eerste lid, gedurende drie maanden of herplaatsing van de ambtenaar op
      een passende functie binnen of buiten het gezagsbereik van Onze Minister mogelijk is.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel107
  - number: '107.3'
    text: |-
      Indien het onderzoek bedoeld in het tweede lid niet heeft geleid tot herplaatsing, onderzoekt Onze Minister,
      aansluitend aan de periode bedoeld in het tweede lid, gedurende zes maanden of herplaatsing van de ambtenaar op een
      passende functie buiten het gezagsbereik van Onze Minister mogelijk is.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel107
  - number: '107.4'
    text: |-
      De periode van zes maanden bedoeld in het derde lid, wordt voor elk volledig jaar dat de ambtenaar is aangesteld
      bij het Ministerie van Defensie, verlengd met een halve maand tot maximaal twaalf maanden.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel107
  - number: '107.5'
    text: |-
      Onze Minister kan op verzoek van de ambtenaar die is aangewezen als herplaatsingskandidaat de duur van de
      herplaatsingsperiode, zoals vastgesteld op grond van het eerste tot en met het vierde lid, verlengen indien de
      omstandigheden naar zijn oordeel daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel107
  - number: '107.6'
    text: Bij ministeriële regeling worden nadere regels gesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel107
  - number: '108.1'
    text: |-
      De herplaatsingskandidaat is verplicht al het mogelijke te doen om een passende functie te vinden en mee te werken
      aan het herplaatsingsonderzoek bedoeld in [artikel 107][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel107
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '107'
        hoofdstuk: '9'
  - number: '108.2'
    text: |-
      De herplaatsingskandidaat is verplicht een passende functie te aanvaarden tijdens het herplaatsingsonderzoek
      bedoeld in [artikel 107, derde en vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel107
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '107'
        hoofdstuk: '9'
  - number: '108.3'
    text: |-
      De herplaatsingskandidaat die zonder deugdelijke grond weigert of heeft geweigerd te voldoen aan een hem op grond
      van dit artikel opgelegde verplichting, kan in verband daarmee ontslag bedoeld in [artikel 116, eerste lid][ref1]
      worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel116
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '116'
        hoofdstuk: '10'
  - number: 108a.1
    text: 'Onze Minister kan voorzieningen treffen:'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel108a
  - number: 108a.1.a
    text: om dreigende overtolligheid te voorkomen door ontslag op aanvraag te stimuleren;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel108a
  - number: 108a.1.b
    text: |-
      ten behoeve van ambtenaren die zijn aangewezen als herplaatsingskandidaat bedoeld in [artikel 106][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel106
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel108a
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '106'
        hoofdstuk: '9'
  - number: 108a.2
    text: Bij ministeriële regeling worden nadere regels gesteld ter uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel108a
  - number: '109.1'
    text: |-
      De ambtenaar is van rechtswege in zijn ambt geschorst, wanneer hij krachtens wettelijke maatregel van
      zijn vrijheid is beroofd, tenzij die vrijheidsbeneming het gevolg is van een maatregel, anders dan op
      grond van de [Wet zorg en dwang psychogeriatrische en verstandelijk gehandicapte cliënten][ref1] of de
      [Wet verplichte geestelijke gezondheidszorg][ref2], genomen in het belang van de volksgezondheid.


      [ref1]: https://wetten.overheid.nl/BWBR0040632
      [ref2]: https://wetten.overheid.nl/BWBR0040635
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0040632
      - id: ref2
        bwb_id: BWBR0040635
  - number: '109.2'
    text: |-
      Onverminderd [artikel 99, eerste lid][ref1], j°. [artikel 100, eerste lid, onderdeel k][ref2], kan de ambtenaar
      voorts in zijn ambt worden geschorst:


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel100
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '99'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: '100'
        hoofdstuk: '8'
  - number: 109.2.a
    text: indien een strafrechtelijke vervolging ter zake van misdrijf tegen hem is ingesteld;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel109
  - number: 109.2.b
    text: |-
      wanneer hem het voornemen tot bestraffing met onvoorwaardelijk ontslag is te kennen gegeven, dan wel hem die straf
      is opgelegd;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel109
  - number: 109.2.c
    text: wanneer het belang van de dienst zulks vordert.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel109
  - number: '110.1'
    text: |-
      Schorsing als bedoeld in [artikel 109, tweede lid][ref1], geschiedt door Onze Minister of een door hem aangewezen
      autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel109
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '109'
        hoofdstuk: '10'
  - number: '110.2'
    text: |-
      In afwijking van het eerste lid geschiedt de schorsing van de ambtenaar die bij koninklijk besluit is aangesteld,
      door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel110
  - number: '110.3'
    text: |-
      De schorsing als bedoeld in [artikel 109, tweede lid][ref1], gaat in op het tijdstip, waarop deze de betrokken
      ambtenaar bekend wordt gemaakt. Indien het gedurende zes dagen feitelijk niet mogelijk is de ambtenaar het
      schorsingsbesluit ter kennis te brengen, gaat de schorsing in op de zevende dag na de dagtekening van het
      schorsingsbesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel109
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '109'
        hoofdstuk: '10'
  - number: '111.1'
    text: |-
      Een schorsing als bedoeld in [artikel 109, tweede lid, onderdeel a en b][ref1], eindigt wanneer hij wordt opgeheven
      door de bevoegde autoriteit, bedoeld in [artikel 110, eerste of tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel109
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel110
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '109'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: '110'
        hoofdstuk: '10'
  - number: '111.2'
    text: |-
      Een schorsing als bedoeld in [artikel 109, tweede lid, onderdeel c][ref1], wordt opgeheven wanneer de belangen van
      de dienst de schorsing niet meer vorderen, doch uiterlijk na drie maanden, tenzij de omstandigheid die aanleiding
      gaf voor die schorsing zich nog immer voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel109
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '109'
        hoofdstuk: '10'
  - number: '112.1'
    text: |-
      Het ontslag van de ambtenaar in vaste dienst die wordt bezoldigd volgens salarisschaal 15 of hoger van
      [bijlage A van het Inkomstenbesluit burgerlijke ambtenaren defensie][ref1] geschiedt bij koninklijk besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0018191
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0018191
  - number: '112.2'
    text: Het ontslag in de overige gevallen geschiedt door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel112
  - number: '113.1'
    text: De ambtenaar wordt op zijn aanvraag ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel113
  - number: '113.2'
    text: |-
      Behoudens in het geval bedoeld in [artikel 53, eerste lid][ref1], wordt dit ontslag verleend met ingang van een dag
      niet vroeger dan een maand of later dan 3 maanden na de dag, waarop de aanvraag om ontslag is ingekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel53
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '53'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '113.3'
    text: |-
      Van het bepaalde in het eerste lid kan worden afgeweken, indien een strafrechtelijke vervolging ter zake van
      misdrijf tegen de ambtenaar is ingesteld of indien wordt overwogen de disciplinaire straf van ontslag op te leggen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel113
  - number: '113.4'
    text: 'Van het bepaalde in het tweede lid kan worden afgeweken:'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel113
  - number: 113.4.a
    text: indien wordt overwogen de ambtenaar een disciplinaire straf op te leggen;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel113
  - number: 113.4.b
    text: |-
      indien het belang van de dienst zulks vordert met dien verstande dat de termijn van 3 maanden, vermeld in het
      tweede lid, tot ten hoogste 6 maanden kan worden verlengd en dat bij de verlenging in redelijkheid met het belang
      van de ambtenaar rekening wordt gehouden;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel113
  - number: 113.4.c
    text: ingevolge een aanvraag van de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel113
  - number: '113.5'
    text: Het ontslag op eigen aanvraag wordt eervol verleend.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel113
  - number: '114.1'
    text: |-
      Aan de ambtenaar die ontslag vraagt met het oog op een uitkering op grond van de Regeling flexibel pensioen en
      uittreden, bedoeld in artikel 3 van de Centrale vut-overeenkomst overheids- en onderwijspersoneel en artikel
      1.5 van het Pensioenreglement van de Stichting Pensioenfonds Abp, wordt ontslag verleend, indien het bestuur
      van de Stichting fonds vrijwillig vervroegd uittreden overheidspersoneel alsmede het bestuur van de Stichting
      Pensioenfonds Abp op grond van een desbetreffende aanvraag hebben vastgesteld dat na dat te verlenen ontslag recht
      bestaat op een uitkering op grond van die regeling. Het ontslag gaat niet eerder in dan met ingang van de dag
      waarop het recht op evengenoemde uitkering ontstaat.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel114
  - number: '114.2'
    text: |-
      Op aanvraag van de ambtenaar kan het in het eerste lid bedoelde ontslag ook voor een gedeelte van de voor hem
      geldende arbeidsduur worden verleend, tenzij de belangen van de dienst zich hiertegen verzetten. Het gedeelte
      van dit ontslag bedraagt ten minste 10% van de omvang van de dienstverhouding. Ontslag voor een gedeelte van de
      arbeidsduur waaruit reeds eerder gedeeltelijk ontslag met het oog op de in het eerste lid bedoelde uitkering heeft
      plaatsgevonden bedraagt ten minste 10% van de oorspronkelijke arbeidsduur.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel114
  - number: '114.3'
    text: |-
      [Artikel 113, tweede tot en met vijfde lid][ref1], is zoveel mogelijk van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel113
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '113'
        hoofdstuk: '10'
  - number: '114.4'
    text: |-
      Het voorgaande is van overeenkomstige toepassing als de ambtenaar ontslag vraagt met het oog op ouderdomspensioen
      dat voor de pensioengerechtigde leeftijd ingaat.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel114
  - number: '115.1'
    text: |-
      Aan de ambtenaar in tijdelijke dienst die blijkens zijn akte van aanstelling is aangesteld voor een vast bepaalde
      tijd of voor een proeftijd, wordt tenzij het tegendeel blijkt, geacht eervol ontslag te zijn verleend zodra die
      tijd is verstreken. Bij voortduring van het dienstverband na het verstrijken van de vast bepaalde tijd of de –
      eventueel ingevolge [artikel 7, tweede lid onder a][ref1] verlengde – proeftijd, wordt de ambtenaar geacht voor
      onbepaalde tijd te zijn aangesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel7
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '115.2'
    text: |-
      Aan de ambtenaar in tijdelijke dienst, die is aangesteld voor onbepaalde tijd – waaronder begrepen de ambtenaar die
      is aangesteld ter vervanging van een afwezige ambtenaar dan wel belast is met werk van kennelijk tijdelijk karakter
      – kan ontslag worden verleend, mits een opzeggingstermijn in acht wordt genomen van:
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel115
  - number: 115.2.a
    text: |-
      drie maanden, indien de ambtenaar ten tijde van de opzegging laatstelijk tenminste twaalf maanden onafgebroken in
      dienst is geweest;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel115
  - number: 115.2.b
    text: |-
      twee maanden, indien de ambtenaar ten tijde van de opzegging laatstelijk ten minste zes maanden doch korter dan
      twaalf maanden onafgebroken in dienst is geweest;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel115
  - number: 115.2.c
    text: |-
      één maand, indien de ambtenaar ten tijde van de opzegging laatstelijk korter dan zes maanden onafgebroken in dienst
      is geweest.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel115
  - number: '115.3'
    text: |-
      Opzegging als bedoeld in het tweede lid kan niet geschieden gedurende de zwangerschap van de vrouwelijke ambtenaar,
      noch gedurende het verlof op grond van [artikel 3:1 van de Wet arbeid en zorg][ref1], noch – indien zij haar dienst
      heeft hervat – gedurende een periode van zes weken volgend op dat verlof. Onze Minister kan ter staving van de
      zwangerschap een verklaring van een arts of van een verloskundige verlangen.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '115.4'
    text: |-
      Opzegging als bedoeld in het tweede lid kan niet geschieden wegens de omstandigheid dat de ambtenaar in of buiten
      rechte een beroep heeft gedaan op het beginsel van gelijke behandeling van mannen en vrouwen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel115
  - number: '115.5'
    text: |-
      Opzegging als bedoeld in het tweede lid kan niet geschieden wegens de omstandigheid dat de ambtenaar zijn recht op
      ouderschapsverlof geldend maakt.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel115
  - number: '115.6'
    text: |-
      Opzegging als bedoeld in het tweede lid kan niet geschieden wegens de omstandigheid dat de ambtenaar is geplaatst
      op een kandidatenlijst als bedoeld in [artikel 8 van het Besluit medezeggenschap defensie][ref1], noch wegens het
      lidmaatschap of het korter dan twee jaar geleden beëindigde lidmaatschap van de medezeggenschapscommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0010617#Artikel8
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0010617
        artikel: '8'
  - number: '115.7'
    text: |-
      Het ontslag kan, al dan niet op aanvraag van de ambtenaar, ingaan voor de afloop van de opzeggingstermijn. Indien
      dit niet op aanvraag van de ambtenaar geschiedt, wordt hem over de tijd welke aan de opzeggingstermijn ontbreekt,
      een bedrag uitbetaald gelijk aan de laatstgenoten bezoldiging, vermeerderd met de vakantie-uitkering berekend op de
      voet van het bepaalde in het [Bezoldigingsbesluit burgerlijke ambtenaren defensie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006038
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0006038
  - number: '115.8'
    text: |-
      Aan de ambtenaar in tijdelijke dienst, genoemd in het eerste lid, kan ontslag worden verleend met ingang van een
      dag gelegen binnen een bepaalde tijd of proeftijd. In dat geval vindt het bepaalde in het tweede tot en met zevende
      lid overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel115
  - number: '116.1'
    text: 'Aan de ambtenaar kan eervol ontslag worden verleend:'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel116
  - number: 116.1.a
    text: wegens opheffing van zijn betrekking;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel116
  - number: 116.1.b
    text: |-
      wegens overtolligheid van personeel als gevolg van verandering in de inrichting van het dienstvak of onderdeel
      daarvan zoals een directie of een afdeling waarbij de ambtenaar werkzaam is, dan wel als gevolg van vermindering
      der werkzaamheden bij het dienstvak of dat onderdeel.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel116
  - number: '116.2'
    text: |-
      Ontslag op een van de in het eerste lid genoemde gronden kan slechts plaatsvinden, indien het na een zorgvuldig
      onderzoek bedoeld in [artikel 107, eerste en tweede lid][ref1], niet mogelijk is gebleken om de ambtenaar te
      herplaatsen op een passende functie binnen het gezagsbereik van Onze Minister. Het ontslag zal worden verleend na
      ommekomst van het volledige herplaatsingsonderzoek bedoeld in artikel 107 of eerder indien zulks met de ambtenaar
      wordt overeengekomen dan wel sprake is van een situatie bedoeld in [artikel 108, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel108
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '107'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: '108'
        hoofdstuk: '9'
  - number: '116.3'
    text: |-
      Ontslag van in vaste dienst aangestelde ambtenaren wegens overtolligheid van personeel geschiedt in de volgende
      rangorde:
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel116
  - number: 116.3.a
    text: zij die zulks wensen;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel116
  - number: 116.3.b
    text: zij die 35 of meer voor pensioen geldende dienstjaren hebben, waarbij ouderen in leeftijd vóór jongeren gaan;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel116
  - number: 116.3.c
    text: |-
      zij die de leeftijd van 35 jaren nog niet hebben overschreden, te beginnen met hen die het geringste aantal jaren
      in overheidsdienst hebben doorgebracht;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel116
  - number: 116.3.d
    text: |-
      zij die het geringste aantal jaren in overheidsdienst hebben doorgebracht. Voor de berekening van het aantal
      jaren in burgerlijke openbare dienst wordt mede in aanmerking genomen tijd gewijd aan de verzorging van tot het
      huishouden van de ambtenaar behorende 0-4-jarige eigen, stief- of pleegkinderen, tot een maximum van in totaal
      zes jaren.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel116
  - number: '116.4'
    text: |-
      Indien het dienstbelang zulks vordert, kan bij de verlening van ontslag van de rangorde genoemd in het derde
      lid, worden afgeweken. Omvat de afvloeiing in dat geval meer dan 1% van het aantal ambtenaren in vaste dienst bij
      het betrokken dienstvak of onderdeel daarvan - met een minimum van 5 dan geschiedt zij naar een bepaald vooraf
      vastgesteld plan.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel116
  - number: '116.5'
    text: |-
      Bij een ontslagverlening op grond van het eerste lid van dit artikel wordt een opzeggingstermijn van drie maanden
      in acht genomen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel116
  - number: '116.6'
    text: |-
      Aan de ambtenaar wordt bij dan wel na verplaatsing van de dienst of het dienstvak of onderdeel daarvan waarbij
      hij werkzaam is, eervol ontslag verleend, indien op grond van door hem kenbaar gemaakte, aan zijn persoonlijke
      omstandigheden ontleende en door Onze Minister als geldig erkende bedenkingen van hem in redelijkheid niet
      kan worden verlangd dat hij zich naar de daaruit voor hem voortvloeiende verplaatsing zal voegen dan wel in
      de daaruit voor hem voortgevloeide verplaatsing zal blijven voegen, tenzij de bevoegde autoriteit, bedoeld in
      [artikel 112, eerste of tweede lid][ref1] het mogelijk acht aan de ambtenaar andere hem passende werkzaamheden op
      te dragen waarvoor eerderbedoelde bedenkingen niet gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel112
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '112'
        hoofdstuk: '10'
  - number: '117.1'
    text: |-
      Aan de ambtenaar die in verband met de aanvaarding van een functie in een publiekrechtelijk college,
      waarin hij is benoemd of verkozen tijdelijk is ontheven van de waarneming van zijn ambt, wordt, indien
      hij ophoudt zodanige functie te bekleden en hij naar het oordeel van de bevoegde autoriteit, bedoeld in
      [artikel 112, eerste of tweede lid][ref1] niet in actieve dienst kan worden hersteld, eervol ontslag verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel112
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '112'
        hoofdstuk: '10'
  - number: '117.2'
    text: |-
      Tenzij [artikel 53, eerste lid][ref1] van toepassing is, wordt eervol ontslag eveneens verleend
      aan de ambtenaar die na afloop van het verlof, verleend met toepassing van [artikel 50][ref2]
      danwel van [artikel 52, eerste lid][ref3], naar het oordeel van de bevoegde autoriteit, bedoeld in
      [artikel 112, eerste of tweede lid][ref4] niet in actieve dienst kan worden hersteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel50
      [ref3]: https://wetten.overheid.nl/BWBR0006040#Artikel52
      [ref4]: https://wetten.overheid.nl/BWBR0006040#Artikel112
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '53'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: '50'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006040
        artikel: '52'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0006040
        artikel: '112'
        hoofdstuk: '10'
  - number: '117.3'
    text: |-
      Het eerste lid vindt eveneens toepassing voor de ambtenaar die ophoudt de functie van substituut-ombudsman te
      bekleden.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel117
  - number: '118'
    text: |-
      Aan de ambtenaar die een benoeming tot Minister of Staatssecretaris aanvaardt wordt door de bevoegde autoriteit,
      bedoeld in [artikel 112, eerste of tweede lid][ref1], met ingang van de dag van het aanvaarden van deze betrekking,
      eervol ontslag verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel112
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '112'
        hoofdstuk: '10'
  - number: '120.1'
    text: |-
      Voor de ontslagverlening als bedoeld in [artikel 12, tweede lid, van de Ambtenarenwet 2017][ref1] is de medewerking
      of machtiging vereist van Onze Minister. Deze is gehouden het advies in te winnen van de adviescommissie
      grondrechten en functie-uitoefening ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel12
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '12'
  - number: '120.2'
    text: |-
      Indien het voornemen tot ontslagverlening afkomstig is van Onze Minister is de machtiging vereist van Onze
      Minister-President.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel120
  - number: '121.1'
    text: |-
      Anders dan op eigen aanvraag, bij wijze van straf of ingevolge het bepaalde bij
      [artikel 7 van de Wet Incompatibiliteiten Staten-Generaal en Europees Parlement][ref1] en bij de
      [artikelen 115][ref2], [116][ref3], [117][ref4], [119][ref5] en [120][ref6] van dit besluit, kan de ambtenaar
      worden ontslagen op grond van:


      [ref1]: https://wetten.overheid.nl/BWBR0006612#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel115
      [ref3]: https://wetten.overheid.nl/BWBR0006040#Artikel116
      [ref4]: https://wetten.overheid.nl/BWBR0006040#Artikel117
      [ref5]: https://wetten.overheid.nl/BWBR0006040#Artikel119
      [ref6]: https://wetten.overheid.nl/BWBR0006040#Artikel120
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0006612
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: '115'
        hoofdstuk: '10'
      - id: ref3
        bwb_id: BWBR0006040
        artikel: '116'
        hoofdstuk: '10'
      - id: ref4
        bwb_id: BWBR0006040
        artikel: '117'
        hoofdstuk: '10'
      - id: ref5
        bwb_id: BWBR0006040
        artikel: '119'
        hoofdstuk: '10'
      - id: ref6
        bwb_id: BWBR0006040
        artikel: '120'
        hoofdstuk: '10'
  - number: 121.1.a
    text: |-
      het verlies van een vereiste voor de benoembaarheid, door Onze Minister gesteld bij een regeling aan de benoeming
      voorafgegaan, tenzij het vereiste alleen voor de aanvang van het ambt geldt;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel121
  - number: 121.1.b
    text: het aangaan van een graad van zwagerschap, die de benoembaarheid tot het ambt zou uitsluiten;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel121
  - number: 121.1.c
    text: onherroepelijk geworden rechterlijke uitspraak, waarbij de ambtenaar onder curatele is gesteld;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel121
  - number: 121.1.d
    text: het ondergaan van lijfsdwang wegens schulden krachtens onherroepelijk geworden rechterlijke uitspraak;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel121
  - number: 121.1.e
    text: onherroepelijk geworden veroordeling tot vrijheidsstraf wegens misdrijf;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel121
  - number: 121.1.f
    text: ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel121
  - number: 121.1.g
    text: onbekwaamheid of ongeschiktheid voor het door hem beklede ambt, anders dan op grond van ziels- of lichaamsgebreken;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel121
  - number: 121.1.h
    text: het bereiken van de pensioengerechtigde leeftijd;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel121
  - number: 121.1.i
    text: |-
      het bij of in verband met indiensttreding of medisch onderzoek verstrekken van onjuiste of onvolledige
      inlichtingen, zonder welke handelwijze niet tot indienstneming of goedkeuring zou zijn overgegaan, tenzij de
      ambtenaar aannemelijk maakt dat hij te goeder trouw heeft gehandeld.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel121
  - number: '121.2'
    text: |-
      Een ontslag op grond van het bepaalde in het eerste lid onder *a*, *b*, *f*, *g* en *h* wordt steeds eervol
      verleend.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel121
  - number: '121.3'
    text: |-
      Behoudens voor de toepassing van [artikel 123a][ref1] kan een ontslag als bedoeld in het eerste lid, onderdeel f.
      slechts plaatsvinden indien:


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel123a
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 123a
        hoofdstuk: '10'
  - number: 121.3.a
    text: |-
      er sprake is van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte gedurende een ononderbroken
      periode van twee jaar,
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel121
  - number: 121.3.b
    text: |-
      herstel van zijn ziekte niet binnen een periode van zes maanden na de in onderdeel *a* genoemde termijn van twee
      jaar te verwachten is, en
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel121
  - number: 121.3.c
    text: |-
      na een zorgvuldig onderzoek het niet mogelijk is gebleken om de ambtenaar binnen het gezagsbereik van Onze Minister
      andere arbeid aan te bieden, dan wel indien de ambtenaar geweigerd heeft deze arbeid te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel121
  - number: '121.4'
    text: |-
      Onder arbeid als bedoeld in het derde lid, onderdeel *c*, wordt gedurende het eerste jaar dat de ambtenaar
      ongeschikt is tot het verrichten van zijn arbeid wegens ziekte passende, en gedurende de periode daarna gangbare
      arbeid verstaan als bedoeld in [artikel 54a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel54a
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 54a
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '121.5'
    text: |-
      Bij het bepalen van het tijdvak van twee jaar als bedoeld in het derde lid, onder a, wordt niet in aanmerking
      genomen afwezigheid van een vrouwelijke ambtenaar wegens ziekte die haar oorsprong vindt in de zwangerschap of
      bevalling, in geval deze ziekte is opgetreden tijdens de zwangerschap en gedurende en na het zwangerschapsverlof
      heeft voortgeduurd.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel121
  - number: '121.6'
    text: |-
      Voor het bepalen van het in het derde lid, onder a, bedoelde tijdvak van twee jaar worden tijdvakken van
      ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte samengeteld, indien:
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel121
  - number: 121.6.a
    text: zij elkaar met een onderbreking van minder dan vier weken opvolgen;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel121
  - number: 121.6.b
    text: |-
      zij worden onderbroken door afwezigheid tijdens door zwangerschap of bevalling veroorzaakte ziekte in de periode
      vanaf het begin van het bevallingsverlof, dan wel;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel121
  - number: 121.6.c
    text: |-
      een onder b. bedoelde afwezigheid wordt voorafgegaan of wordt gevolgd door een periode van arbeidsgeschiktheid, die
      in totaal minder dan vier weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel121
  - number: '121.7'
    text: |-
      Om te beoordelen of er sprake is van een situatie als bedoeld in het derde lid, onderdelen *a* en *b*, vraagt
      Onze Minister het oordeel van een daartoe door de UWV, bedoeld in [artikel 54a, onderdeel k][ref1], die de
      [Wet op de Arbeidsongeschiktheidsverzekeringen][ref2] uitvoert ten aanzien van de ambtenaar, aangewezen arts.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel54a
      [ref2]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 54a
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
  - number: '121.8'
    text: |-
      De in het zevende lid bedoelde arts betrekt bij zijn beoordeling een door Onze Minister aangewezen arts en, indien
      de ambtenaar dit wenst, een door de ambtenaar aangewezen arts.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel121
  - number: '121.9'
    text: |-
      Onze Minister stelt de ambtenaar er schriftelijk van in kennis dat de procedure, bedoeld in het zevende lid,
      wordt ingesteld. Daarbij wijst Onze Minister de ambtenaar op de mogelijkheid om een arts van zijn keuze te laten
      deelnemen aan de procedure.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel121
  - number: '121.10'
    text: |-
      De kennisgeving, bedoeld in het negende lid, geschiedt niet eerder dan nadat de ambtenaar gedurende een
      onafgebroken periode van 18 maanden ongeschikt is geweest tot het verrichten van zijn arbeid wegens ziekte. Het
      zesde lid is hierbij van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel121
  - number: '121.11'
    text: |-
      De in het zevende lid bedoelde arts stelt naar aanleiding van zijn bevindingen een rapport op. Hij zendt dit
      rapport aan Onze Minister . Tevens zendt hij een afschrift van dit rapport aan de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel121
  - number: '121.12'
    text: |-
      Indien herplaatsing als bedoeld in het derde lid, onderdeel *c*, plaatsvindt in een betrekking voor minder uren dan
      het aantal waarvoor de ambtenaar was aangesteld, heeft het ontslag uitsluitend betrekking op het meerdere aantal
      uren.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel121
  - number: '122.1'
    text: |-
      Aan ambtenaren wordt, behoudens in zeer bijzondere gevallen, bij het bereiken van de pensioengerechtigde leeftijd
      door de bevoegde autoriteit, bedoeld in [artikel 112, eerste of tweede lid][ref1], het ontslag als bedoeld in
      [artikel 121, eerste lid onder h][ref2], verleend met ingang van de eerstvolgende maand.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel112
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel121
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '112'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: '121'
        hoofdstuk: '10'
  - number: '122.2'
    text: 'Dit artikel is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel122
  - number: 122.2.a
    text: |-
      op personen, die krachtens reeds bestaande wettelijke voorschriften bij het bereiken van een bepaalde leeftijd,
      behoudens toepassing van overgangsbepalingen, uit de functie worden ontslagen;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel122
  - number: 122.2.b
    text: op personen die de functie als nevenbetrekking bekleden.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel122
  - number: '123'
    text: |-
      Indien aan de ambtenaar gedurende de tijd, dat hij recht heeft op wachtgeld,
      daaronder mede begrepen herplaatsingswachtgeld of een uitkering op grond van
      [artikel 18, zesde lid van het Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Defensie][ref1],
      een voor hem passend geachte betrekking is aangeboden en die betrekking binnen een periode van uiterlijk één jaar
      nadat hij haar is gaan vervullen, niet passend voor hem blijkt te zijn, kan hem binnen die periode op zijn aanvraag
      eervol ontslag uit die betrekking worden verleend, welk ontslag ten aanzien van zijn aanspraken op dat wachtgeld of
      die uitkering wordt aangemerkt als niet door eigen toedoen te zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0010510#Artikel18
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0010510
        artikel: '18'
  - number: 123a.1
    text: |-
      Aan de ambtenaar die in verband met ongeschiktheid ten gevolge van ziekte verhinderd is zijn arbeid te verrichten,
      kan door de bevoegde autoriteit, bedoeld in [artikel 112, eerste of tweede lid][ref1], in afwijking van
      [artikel 121, derde lid, onderdeel a][ref2], ontslag worden verleend, indien hij zonder deugdelijke grond weigert:


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel112
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel121
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel123a
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '112'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: '121'
        hoofdstuk: '10'
  - number: 123a.1.a
    text: |-
      gevolg te geven aan door Onze Minister of een door Onze Minister aangewezen deskundige gegeven redelijke
      voorschriften mee te werken aan door Onze Minister of een door Onze Minister aangewezen deskundige
      getroffen maatregelen om hem in staat te stellen de eigen of andere passende arbeid als bedoeld in
      [artikel 54a, onderdeel j][ref1], te verrichten,


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel54a
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel123a
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 54a
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 123a.1.b
    text: |-
      passende arbeid als bedoeld in [artikel 54a, onderdeel j][ref1], te verrichten waartoe Onze Minister hem in de
      gelegenheid stelt, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel54a
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel123a
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 54a
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 123a.1.c
    text: |-
      zijn medewerking te verlenen aan het opstellen, evalueren en bijstellen van een plan van aanpak als bedoeld in
      [artikel 71a, tweede lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel123a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
  - number: 123a.2
    text: |-
      Om te beoordelen of er sprake is van een situatie als bedoeld in het eerste lid, wint Onze Minister een hierop
      betrekking hebbend advies van de UWV, bedoeld in [artikel 54a, onderdeel i][ref1], in en neemt dit mede in
      beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel54a
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel123a
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 54a
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '124.1'
    text: |-
      Aan de ambtenaar in vaste dienst kan ook op andere gronden dan die in [artikel 121][ref1] zijn geregeld of waarnaar
      in dat artikel wordt verwezen, ontslag worden gegeven. Het ontslag wordt eervol verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel121
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '121'
        hoofdstuk: '10'
  - number: '124.2'
    text: |-
      In geval van ontslag ingevolge het eerste lid wordt door de bevoegde autoriteit, bedoeld in
      [artikel 112, eerste of tweede lid][ref1], een voorziening getroffen waarbij de ambtenaar
      een uitkering wordt verleend, die, naar het oordeel van dat bevoegd gezag, met het oog
      op de omstandigheden redelijk is te achten. Deze uitkering is ten minste gelijk aan het
      totaalbedrag van de uitkeringen berekend op basis van de [Werkloosheidswet][ref2] en het
      [Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Defensie][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel112
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0010510
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '112'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0010510
  - number: '124.3'
    text: |-
      Indien de ambtenaar terzake van zijn ontslag ingevolge het eerste lid
      recht heeft op een uitkering krachtens de [Werkloosheidswet][ref1] of het
      [Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Defensie][ref2], wordt de in het tweede lid
      bedoelde uitkering met die uitkering verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0010510
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0010510
  - number: '127.1'
    text: |-
      De bezoldiging van de ambtenaar wordt niet langer uitbetaald dan tot en met de dag van overlijden.
      [Artikel 30dd][ref1] en [artikel 34, eerste lid][ref2], worden voorts overeenkomstig toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel30dd
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel34
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 30dd
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: '34'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '127.2'
    text: |-
      Met inachtneming van het bepaalde in het vijfde lid wordt zo spoedig mogelijk na het overlijden aan de weduwe,
      van wie de overleden ambtenaar niet duurzaam gescheiden leefde, een bedrag uitgekeerd gelijk aan de bezoldiging
      over een tijdvak van drie maanden. Als maatstaf bij de berekening van het in de vorige volzin bedoelde bedrag
      geldt, behoudens het hierna bepaalde, de bezoldiging, welke de ambtenaar op de dag van het overlijden genoot of
      zou hebben genoten met in acht neming van het bepaalde in [artikel 59a][ref1]. De uitkering wordt vermeerderd met
      een bedrag gelijk aan drie maal dat van de vakantie-uitkering over een maand berekend op de voet van het bepaalde
      in het [Bezoldigingsbesluit burgerlijke ambtenaren defensie][ref2], naar de bezoldiging die de ambtenaar in de
      maand van het overlijden zou hebben genoten. Indien de ambtenaar in het genot was van een toelage als bedoeld in
      [artikel 15][ref3], dan wel [artikel 18][ref4] van eerdervermeld besluit, wordt het gedeelte van de in de eerste
      volzin genoemde uitkering dat betrekking heeft op bovenbedoelde toelagen gesteld op het bedrag dat de overleden
      ambtenaar in de drie kalendermaanden voorafgaand aan de dag van het overlijden aan zodanige toelagen is toegekend.
      Bij ontstentenis van een weduwe, van wie de overledene niet duurzaam gescheiden leefde, geschiedt de uitkering ten
      behoeve van de minderjarige kinderen. Onder kinderen in de zin van dit artikel worden mede verstaan natuurlijke
      kinderen, waarover de overledene de pleegouderlijke zorg droeg. Onder pleegouderlijke zorg wordt verstaan de zorg
      voor het onderhoud en de opvoeding van het kind als was het een eigen kind, onafhankelijk van enige veplichting
      daartoe of van het genieten van een vergoeding daarvoor. Ontbreken ook zodanige kinderen dan geschiedt de uitkering
      aan degenene die geheel of grotendeels afhankelijk waren van de bezoldiging van de ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel59a
      [ref2]: https://wetten.overheid.nl/BWBR0006038
      [ref3]: https://wetten.overheid.nl/BWBR0006038#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0006038#Artikel18
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 59a
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0006038
      - id: ref3
        bwb_id: BWBR0006038
        artikel: '15'
      - id: ref4
        bwb_id: BWBR0006038
        artikel: '18'
  - number: '127.3'
    text: |-
      Indien de overledene geen betrekkingen, als bedoeld in het tweede lid nalaat, kan het daarbedoelde bedrag door
      Onze Minister geheel of ten dele worden uitgekeerd voor de betaling van de kosten van de laatste ziekte en van de
      lijkbezorging, indien de nalatenschap van de overledene voor de betaling van die kosten ontoereikend is.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel127
  - number: '127.4'
    text: |-
      Voor de toepassing van dit artikel wordt, indien de ambtenaar op de dag van zijn overlijden wegens ziekte of
      ongeval verhinderd was zijn dienst te verrichten, onder bezoldiging verstaan hetgeen daaronder voor de toepassing
      van [hoofdstuk 6][ref1] wordt verstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0006040
        hoofdstuk: '6'
  - number: '127.5'
    text: |-
      Op het bedrag bedoeld in het tweede lid, worden in mindering gebracht een uitkering overeenkomstig [35][ref1]
      en [36 van de Ziektewet][ref2], [artikel 53 van de Wet op de arbeidsongeschiktheidsverzekering][ref3],
      [artikel 6 van het Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Defensie][ref4] en naar aard
      en strekking daarmee overeenkomende uitkeringen, voorzover deze daadwerkelijk geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel53
      [ref4]: https://wetten.overheid.nl/BWBR0010510#Artikel6
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '36'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '53'
      - id: ref4
        bwb_id: BWBR0010510
        artikel: '6'
  - number: 127a.1
    text: |-
      Indien een ambtenaar in Nederland overlijdt terwijl hij om redenen van dienst buiten zijn woonplaats verbleef
      worden aan de nabestaanden de kosten vergoed van het doen overbrengen van het stoffelijk overschot naar een plaats
      van keuze in Nederland.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel127a
  - number: 127a.2
    text: |-
      Indien een ambtenaar overlijdt en het overlijden verband houdt met het verrichten van zijn arbeid, wordt aan de
      nabestaanden een tegemoetkoming in de kosten van lijkbezorging verleend tot maximaal € 5 000.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel127a
  - number: 127a.3
    text: |-
      Indien een ambtenaar overlijdt ten gevolge van een vliegongeval tijdens een dienstreis als bedoeld in
      [artikel 1, onder d, van het Besluit dienstreizen defensie][ref1], per militair luchttransport, wordt aan de
      nabestaanden een som ineens ten bedrage van € 15 000 toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0007956#Artikel1
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel127a
    references:
      - id: ref1
        bwb_id: BWBR0007956
        artikel: '1'
  - number: 127a.4
    text: Voor zover Onze Minister niet anders bepaalt, is dit artikel niet van toepassing in buitengewone omstandigheden.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel127a
  - number: '128.1'
    text: |-
      Gedurende de maand van het overlijden en de volgende drie maanden behouden de achterblijvende gezinsleden het
      gebruik der ambts- of dienstwoning, waarin zij met de ambtenaar woonden. Daarvan kan echter worden afgeweken als
      Onze Minister dat in het belang van de dienst noodzakelijk acht. Alsdan wordt door Onze Minister naar billijkheid
      een schadevergoeding gegeven.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel128
  - number: '128.2'
    text: |-
      Bij vrijwillig verlaten van de ambts- of dienstwoning binnen de termijn, gedurende welke de woning nog mag worden
      gebruikt kan Onze Minister te zijner beoordeling een vergoeding geven.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel128
  - number: '129'
    text: |-
      Indien door de ambtenaar voor het gebruik der ambts- of dienstwoning een vergoeding verschuldigd was, voldoen de
      achtergebleven gezinsleden deze over de tijd gedurende welke zij het gebruik dier woning behouden.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel129
  - number: '130.1'
    text: |-
      Bij vermissing van de ambtenaar vinden, behoudens het bepaalde in het tweede lid, de bepalingen van de
      [artikelen 127 tot en met 129][ref1] overeenkomstig toepassing. De ambtenaar wordt daarbij geacht te zijn overleden
      op een door Onze Minister te bepalen dag.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel127
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '127'
        hoofdstuk: '10'
  - number: '130.2'
    text: |-
      Het bepaalde in het tweede lid van [artikel 127][ref1] vindt geen toepassing indien gegronde vermoedens bestaan,
      dat de vermissing het gevolg is van ongeoorloofde afwezigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel127
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '127'
        hoofdstuk: '10'
  - number: '130.3'
    text: |-
      Indien blijkt dat de als vermist beschouwde ambtenaar in leven is, kan ter beoordeling van Onze Minister de
      bezoldiging alsnog worden uitbetaald, tenzij gegronde vermoedens bestaan dat de vermissing het gevolg was van
      ongeoorloofde afwezigheid.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel130
  - number: '130.4'
    text: |-
      Indien uit hoofde van de vermissing van de ambtenaar pensioen of enige andere uitkering voortvloeiende uit
      zijn ambtelijke rechtspositieregeling is toegekend over het tijdvak waarover naar het oordeel van Onze Minister
      aanspraak bestaat op bezoldiging, wordt die bezoldiging verminderd met de over dat tijdvak aldus uitbetaalde
      bedragen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel130
  - number: '130.5'
    text: |-
      De bezoldiging waarop de ambtenaar ingevolge het derde en vierde lid aanspraak heeft, kan aan anderen dan de
      ambtenaar worden uitbetaald.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel130
  - number: '161'
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel161
  - number: 161.a
    text: |-
      *opleiding:* de entreeopleiding en de basisberoepsopleiding, bedoeld in
      [artikel 7.2.2, eerste lid, onder a en b, van de Wet educatie en beroepsonderwijs][ref1], alsmede de
      assistentopleiding, bedoeld in artikel 7.2.2, eerste lid, onderdeel a, van de Wet educatie en beroepsonderwijs,
      zoals dat onderdeel luidde op 31 juli 2014;


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel161
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 161.b
    text: |-
      *student:* de ambtenaar die minder dan twaalf maanden achtereen is bezoldigd volgens het
      [Inkomstenbesluit burgerlijke ambtenaren defensie][ref1] en die deelneemt aan de opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0018191
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel161
    references:
      - id: ref1
        bwb_id: BWBR0018191
  - number: '162'
    text: |-
      In de akte van aanstelling van de student wordt opgenomen hoeveel uren van de wekelijkse arbeidsuur waarvoor hij
      is aangesteld is bestemd voor het verrichten van arbeid, alsmede het aantal uren dat is bestemd voor het volgen van
      de opleiding.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel162
  - number: '163'
    text: |-
      In de akte van aanstelling van de ambtenaar die een opleiding dient te volgen, wordt vermeld voor hoeveel uren het
      dienstverband wordt aangegaan, hoeveel uren daarvan als arbeidsduur gelden en hoeveel uren voor het volgen van de
      opleiding zijn bestemd.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel163
  - number: '164.1'
    text: De in verband met de opleiding te maken directe kosten worden integraal door het Ministerie van Defensie vergoed.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel164
  - number: '164.2'
    text: |-
      De [artikelen 19][ref1] en [22][ref2] van dit besluit zijn niet van toepassing op de student.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel22
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: '22'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '166'
    text: |-
      Aan de student wordt voor de uren die zijn bestemd voor het volgen van de opleiding een salaris in de zin van het
      [Inkomstenbesluit burgerlijke ambtenaren defensie][ref1] toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0018191
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel166
    references:
      - id: ref1
        bwb_id: BWBR0018191
  - number: '168'
    text: |-
      Voor zoveel voor ambtenaren nadere regels ter uitwerking of aanvulling van de bepalingen van dit besluit worden
      vereist, worden zodanige regels door Onze Minister vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel168
  - number: 168a
    text: |-
      Van de bevoegdheid tot het vaststellen van ministeriële regelingen als bedoeld in de [hoofdstukken 4][ref1],
      [5][ref2] en 7 kan mandaat worden verleend aan de hoofddirecteur personeel van het Ministerie van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel168a
    references:
      - id: ref1
        bwb_id: BWBR0006040
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006040
        hoofdstuk: '5'
  - number: '169.1'
    text: |-
      De ambtenaar in de zin van artikel 1 die is aangesteld op grond van
      [artikel 7, eerste respectievelijk tweede lid van het Algemeen rijksambtenarenreglement][ref1] wordt
      geacht met ingang van de datum van inwerkingtreden van dit besluit te zijn aangesteld op grond van
      [artikel 8, eerste respectievelijk tweede lid][ref2] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel8
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel169
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '169.2'
    text: |-
      De ambtenaar die bij koninklijk besluit in algemene dienst van het Rijk is aangesteld op grond van
      [artikel 7, vierde lid van het Algemeen rijksambtenarenreglement][ref1] en werkzaam is bij het Ministerie van
      Defensie wordt geacht met ingang van de datum van inwerkingtreden van dit besluit te zijn aangesteld bij het
      Ministerie van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel7
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel169
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '7'
  - number: '170.1'
    text: |-
      Voor zover op grond van de bepalingen van dit besluit nadere regels moeten worden gegeven gelden na de
      inwerkingtreding van dit besluit ten aanzien van de ambtenaar als genoemd in [artikel 1][ref1] van dit besluit de
      op basis van de overeenkomstige bepalingen van het [Algemeen rijksambtenarenreglement][ref2] vastgestelde regels
      als nadere regels berustende op dit besluit voor zover zij daarmede niet in strijd zijn. Zij blijven gedurende
      één jaar na het inwerkingtreden van dit besluit van toepassing op de in artikel 1 genoemde ambtenaar tenzij Onze
      Minister anders bepaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001950
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0001950
  - number: '170.2'
    text: |-
      Besluiten ten aanzien van ambtenaren als genoemd in [artikel 1][ref1] van dit besluit, welke na 1 april 1993 op
      basis van het [Algemeen rijksambtenarenreglement][ref2] zijn genomen worden geacht te zijn genomen op basis van
      dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001950
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0001950
  - number: '171.1'
    text: |-
      Voor de ambtenaar die op datum van inwerkingtreding van dit besluit in dienst is bij het Ministerie van Defensie,
      wordt de tijd dat hij aangesteld is geweest bij een onderdeel van de sector Rijk meegeteld voor het bepaalde in
      [artikel 7, tweede lid, onder e en g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel7
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 171a.1
    text: 'Voor de ambtenaar die op 1 januari 2006 was geplaatst op een functie als:'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.1.a
    text: verpleegkundige, in hoofdzaak werkzaam bij het ambulancevervoer van patiënten;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.1.b
    text: ambtenaar van de brandweer belast met de actieve deelname aan de repressieve brandbestrijding;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.1.c
    text: burgerverkeersleider bij de Koninklijke luchtmacht;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.1.d
    text: |-
      bootsman, matroos of tweede machinist aan boord van een zeesleper of een haven- of kustsleper van de Rijks
      Havendienst, geldt een leeftijdsgrens indien hij de leeftijd van vijfenvijftig jaar bereikt:
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.1.d.1°
    text: in het jaar 2010, van vijfenvijftig jaar en drie maanden;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.1.d.2°
    text: in het jaar 2011, van vijfenvijftig jaar en zes maanden;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.1.d.3°
    text: in het jaar 2012, van vijfenvijftig jaar en negen maanden;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.1.d.4°
    text: in het jaar 2013, van zesenvijftig jaar;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.1.d.5°
    text: in het jaar 2014, van zesenvijftig jaar en drie maanden;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.1.d.6°
    text: in het jaar 2015, van zesenvijftig jaar en zes maanden;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.1.d.7°
    text: in het jaar 2016, van zevenenvijftig jaar;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.1.d.8°
    text: in het jaar 2017, van zevenenvijftig jaar en zes maanden;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.1.d.9°
    text: in het jaar 2018, van achtenvijftig jaar;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.1.d.10°
    text: in het jaar 2019, van achtenvijftig jaar en zes maanden;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.1.d.11°
    text: in het jaar 2020, van negenenvijftig jaar;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.1.d.12°
    text: in het jaar 2021, van negenenvijftig jaar en zes maanden;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.1.d.13°
    text: in het jaar 2022 van zestig jaar.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.2
    text: 'Voor de ambtenaar die op 1 januari 2006 was geplaatst op een functie:'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.2.a
    text: |-
      die in hoofdzaak bestaat uit de daadwerkelijke verpleging van lichamelijk en geestelijk zieken. Hieronder worden
      medebegrepen de niet-gekwalificeerde functionarissen die in de daadwerkelijke verpleging werkzaam zijn;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.2.b
    text: als directrice of adjunct-directrice van een inrichting voor verpleging van zieken;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.2.c
    text: |-
      als commandant van de brandweer die op grond van de organisatie van deze dienst tijdens een brand door één of
      meerdere officieren wordt bijgestaan;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.2.d
    text: |-
      bij het geüniformeerd burgerpersoneel van het Marine Bewakings Korps of als de bediende aan boord van een
      zeeloodsvaartuig;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.2.e
    text: |-
      in nader door Onze Minister aan te wijzen functies in de operationele sector bij de Militaire Inlichtingen- en
      Veiligheidsdienst;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.2.f
    text: |-
      belast met de interceptie (verwerven en verwerken) van bijzonder verbindings- en berichtenverkeer ten behoeve van
      veiligheidsdoeleinden, dan wel (tevens) rechtstreeks met de leiding daarvan;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.2.g
    text: als kapitein of eerste machinist aan boord van een zeesleper of een haven- of kustsleper van de Rijks Havendienst;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.2.h
    text: aan boord van de tanker of de transportvaartuigen van de Rijks Havendienst;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.2.i
    text: aan boord van een schip van de Hydrografische Dienst;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.2.j
    text: bij het burgerbewakingspersoneel van het Joint Operations Centre;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.2.k
    text: |-
      als bewaker-hondengeleider of bewaker-hondengeleider-portier bij het burgerbewakingspersoneel van de Koninklijke
      landmacht, voor zover belast met de continubewaking van afgelegen objecten onder verzwarende terreinomstandigheden,
      geldt een leefijdsgrens indien hij de leeftijd van zestig jaar bereikt:
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.2.k.1°
    text: in het jaar 2010, van zestig jaar en twee maanden;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.2.k.2°
    text: in het jaar 2011, van zestig jaar en vier maanden;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.2.k.3°
    text: in het jaar 2012, van zestig jaar en vijf maanden;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.2.k.4°
    text: in het jaar 2013, van zestig jaar en zeven maanden;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.2.k.5°
    text: in het jaar 2014, van zestig jaar en tien maanden;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.2.k.6°
    text: in het jaar 2015, van één en zestig jaar;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.2.k.7°
    text: in het jaar 2016, van één en zestig jaar en drie maanden;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.2.k.8°
    text: in het jaar 2017, van één en zestig jaar en vijf maanden;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.2.k.9°
    text: in het jaar 2018, van één en zestig jaar en negen maanden;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.2.k.10°
    text: in het jaar 2019, van één en zestig jaar en elf maanden;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.2.k.11°
    text: in het jaar 2020, 2021 of 2022, van tweeënzestig jaar.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.3
    text: |-
      Aan de ambtenaar bedoeld in het eerste of tweede lid kan eervol ontslag worden verleend met ingang van de eerste
      van de maand, volgende op die waarin de voor de ambtenaar geldende leeftijdsgrens wordt bereikt. Dit ontslag
      wordt aangemerkt als een ontslag als bedoeld in [artikel 114, eerste lid][ref1], indien wordt voldaan aan de daar
      bedoelde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel114
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '114'
        hoofdstuk: '10'
  - number: 171a.4
    text: |-
      Het in het derde lid bedoelde ontslag kan op aanvraag of met instemming van de ambtenaar voor de duur van ten
      hoogste één jaar worden opgeschort indien dit door het bevoegde gezag in het belang van de dienst wordt geacht
      en de ambtenaar blijkens de uitslag van een onderzoek door de deskundige persoon of de arbodienst bedoeld in
      [artikel 54a, onderdeel b][ref1], lichamelijk en psychisch in staat kan worden geacht zijn functie te blijven
      waarnemen. De opschorting kan op gelijke voet telkenmale voor één jaar worden verlengd. Niettemin kan aan de
      ambtenaar, die tussentijds blijkens de uitslag van een bedrijfsgeneeskundig onderzoek ongeschikt is geworden voor
      de verdere waarneming van zijn functie, eervol ontslag worden verleend met ingang van de eerste van de maand,
      volgende op die waarin de uitslag van het geneeskundig onderzoek te zijner kennis is gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel54a
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 54a
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 171a.5
    text: |-
      De ambtenaar bedoeld in het eerste of tweede lid voor wie tijdens de periode gelegen na het vijfenvijftigste
      levensjaar op basis van een individuele afweging het voortzetten van de uitoefening van zijn functie leidt tot
      een te grote fysieke belasting, wordt een passende functie opgedragen, bij voorkeur in of in de nabijheid van zijn
      standplaats, met behoud van het uitzicht op functioneel leeftijdsontslag als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: 171a.6
    text: |-
      De ambtenaar, bedoeld in het eerste of tweede lid, die de leeftijd van vijfenvijftig respectievelijk zestig jaar
      bereikt in het jaar 2023 of later, wordt vóór het bereiken van de leeftijd van zestig respectievelijk tweeënzestig
      jaar een andere functie dan bedoeld in het eerste of tweede lid opgedragen. Indien dit niet mogelijk blijkt, wordt
      ontslag verleend als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel171a
  - number: '173'
    text: |-
      De [Algemene Termijnenwet][ref1] is niet van toepassing op de termijnen in dit besluit gesteld, met uitzondering
      van die, genoemd in de [artikelen 11, eerste en tweede lid][ref2], [57, derde en vierde lid][ref3] alsmede in
      [hoofdstuk 11][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002448
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0006040#Artikel57
      [ref4]: https://wetten.overheid.nl/BWBR0006040#Hoofdstuk11
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0002448
      - id: ref2
        bwb_id: BWBR0006040
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006040
        artikel: '57'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0006040
        hoofdstuk: '11'
  - number: 173a
    text: |-
      Na inwerkingtreding van de [Wet normalisering rechtspositie ambtenaren][ref1] berust dit besluit op
      [artikel 12o van de Wet ambtenaren defensie][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0039393
      [ref2]: https://wetten.overheid.nl/BWBR0001952#Artikel12o
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel173a
    references:
      - id: ref1
        bwb_id: BWBR0039393
      - id: ref2
        bwb_id: BWBR0001952
        artikel: 12o
  - number: '174'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst en werkt terug tot en met 1 april 1993.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel174
  - number: '175'
    text: Dit besluit wordt aangehaald als "Burgerlijk ambtenarenreglement defensie".
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel175
