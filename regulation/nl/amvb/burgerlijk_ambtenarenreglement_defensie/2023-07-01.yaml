preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Defensie van 1 februari 1993, nr. PAV 2210/93002671;

    Gelet op artikel 125 van de Ambtenarenwet 1929;

    De Raad van State gehoord (advies van 29 maart 1993, nr. W07.93.0061);

    Gezien het nader rapport van Onze Minister van Defensie van 16 juni 1993, nr. PAV2210/93008950;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingenen wordt verstaan onder ambtenaar, degene die bij het Ministerie
      van Defensie in burgerlijke openbare dienst is aangesteld.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel1
  - number: '2.1'
    text: Dit besluit is niet van toepassing op Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel2
  - number: '2.2'
    text: |-
      De [hoofdstukken 4][ref1] en [5][ref2] zijn niet van toepassing op ambtenaren met gedeeltelijke dag-, week- of
      jaartaken, die niet regelmatig dienst doen. Ten aanzien van de in die hoofdstukken geregelde onderwerpen worden
      voor hen voor elk betrokken dienstvak de nodige bepalingen vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006040
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006040
        hoofdstuk: '5'
  - number: '2.3'
    text: |-
      Op de ambtenaar die is aangesteld voor het verrichten van enkele diensten niet vallende binnen de taak van het
      betrokken dienstvak, waarbij per dienst een afzonderlijke beloning wordt vastgesteld, zijn niet van toepassing:
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel2
  - number: 2.3.a
