  - number: '3.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel3
  - number: 3.1.a
    text: 'Onze Minister: Onze Minister van Defensie;'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel3
  - number: 3.1.b
    text: hoofd defensieonderdeel
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel3
  - number: 3.1.b.1°
    text: de Secretaris-Generaal, voor zover het betreft de Bestuursstaf;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel3
  - number: 3.1.b.2°
    text: |-
      de Commandant Zeestrijdkrachten, de Commandant Landstrijdkrachten, de Commandant Luchtstrijdkrachten, de Commandant
      Koninklijke Marechaussee, voor het desbetreffende commando;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel3
  - number: 3.1.b.3°
    text: |-
      de directeur van de Defensie Materieel Organisatie, voor zover het betreft de Defensie Materieel Organisatie, met
      uitzondering van het deel ondergebracht in de Bestuursstaf;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel3
  - number: 3.1.b.4°
    text: de commandant van het Commando Dienstencentra, voor zover het betreft het Commando Dienstencentra;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel3
  - number: 3.1.c
    text: 'de commandant: een bij ministeriële regeling aan te wijzen functionaris;'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel3
  - number: 3.1.d
    text: |-
      passende functie: een functie bedoeld in [artikel 105][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel105
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '105'
        hoofdstuk: '9'
  - number: 3.1.e
    text: |-
      pensioengerechtigde leeftijd: de pensioengerechtigde leeftijd die voor de ambtenaar geldt op grond van
      [artikel 7a van de Algemene Ouderdomswet][ref1], tenzij in dit besluit anders wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: '3.2'
    text: |-
      Tenzij anders is bepaald wordt in dit besluit en de daarop berustende bepalingen verstaan
      onder salaris, onderscheidenlijk bezoldiging, hetgeen daaronder wordt verstaan in het
      [Inkomstenbesluit burgerlijke ambtenaren defensie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018191
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018191
  - number: '3.3'
    text: |-
      Ingeval de bezoldiging van de ambtenaar is geregeld krachtens een andere bezoldigingsregeling dan
      die bedoeld in het tweede lid, wordt in dit besluit en de daarop berustende bepalingen onder salaris,
      onderscheidenlijk bezoldiging verstaan, het bedrag dat op overeenkomstige wijze is vastgesteld als in het
      [Inkomstenbesluit burgerlijke ambtenaren defensie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018191
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018191
  - number: '4.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt mede verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel4
  - number: 4.1.a
    text: 'echtgenote of echtgenoot:'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel4
  - number: 4.1.a.1°
    text: de geregistreerde partner;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel4
  - number: 4.1.a.2°
    text: |-
      degene die door de ambtenaar als partner is aangemeld bij de Stichting Pensioenfonds ABP en door het bestuur van
      dat fonds als zodanig is aangemerkt, op voorwaarde dat de ambtenaar een bewijs van die aanmelding heeft overgelegd
      aan de minister;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel4
  - number: 4.1.b
    text: 'weduwe of weduwnaar: de achtergebleven partner als bedoeld onder a;'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel4
  - number: 4.1.c
    text: 'gezinslid: de partner als bedoeld onder a;'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel4
  - number: 4.1.d
    text: 'huwelijk:'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel4
  - number: 4.1.d.1°
    text: het geregistreerd partnerschap;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel4
  - number: 4.1.d.2°
    text: |-
      de samenleving met de partner die door de ambtenaar als zodanig is aangemeld bij de Stichting Pensioenfonds ABP en
      door het bestuur van dat fonds als zodanig is aangemerkt.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel4
  - number: '4.2'
    text: |-
      De gelijkstellingen, bedoeld in het eerste lid onderdeel a, onder 2° en onderdeel d, onder 2°, eindigen op de dag
      waarop de aanmelding van het partnerpensioen door de Stichting Pensioenfonds ABP wordt doorgehaald. De ambtenaar
      is verplicht die doorhaling aan Onze Minister te melden, waarbij hij een afschrift van de mededeling van die
      doorhaling verstrekt.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel4
  - number: '5'
    text: Onze Minister stelt regels ten aanzien van de werving en selectie van ambtenaren.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel5
  - number: '6.1'
    text: De aanstelling geschiedt in vaste of tijdelijke dienst.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel6
  - number: '6.2'
    text: Aan een aanstelling in vaste dienst gaat in de regel vooraf een aanstelling in tijdelijke dienst.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel6
  - number: '6.3'
    text: |-
      Degene die geen Nederlander is, kan slechts worden aangesteld indien hem verblijf is toegestaan op grond van
      artikel 9 van de Vreemdelingenwet en de vergunning tot verblijf het verrichten van arbeid in loondienst niet
      uitsluit of indien hem verblijf is toegestaan op grond van artikel 10 van de Vreemdelingenwet.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel6
  - number: '6.4'
    text: |-
      Evenmin vindt aanstelling plaats in een functie als bedoeld in [artikel 119, eerste lid][ref1], van personen die
      op het tijdstip waarop de voor die functie vastgestelde leeftijdsgrens wordt bereikt, geen ononderbroken diensttijd
      van tenminste 5 jaren, doorgebracht in een of meer zodanige functies, zouden kunnen aanwijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel119
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '119'
        hoofdstuk: '10'
  - number: '6.5'
    text: |-
      Het in het vierde lid bepaalde is van overeenkomstige toepassing in geval van plaatsing van een ambtenaar in een
      functie als in het vierde lid bedoeld.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel6
  - number: '7.1'
    text: Aanstelling in tijdelijke dienst geschiedt voor bepaalde of voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel7
  - number: '7.2'
    text: 'Zij kan plaatsvinden:'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel7
  - number: 7.2.a
    text: |-
      voor een proeftijd van ten hoogste twee jaar, zonodig bijzondere gevallen op aanvraag van de ambtenaar met nog één
      jaar te verlengen en zonodig ambtshalve te verlengen met de tijd, gedurende welke de ambtenaar de proeftijd niet in
      werkelijke dienst heeft doorgebracht;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel7
  - number: 7.2.b
    text: |-
      voor de tijd van ten hoogste drie maanden, indien een verklaring als bedoeld in [artikel 10, tweede lid][ref1], nog
      niet is afgegeven, met dien verstande dat aan de ambtenaar geen werkzaamheden mogen worden opgedragen die verband
      houden met de aspecten van de betreffende functie die hebben geleid tot de kwalificatie vertrouwensfunctie als
      bedoeld in [artikel 1, eerste lid, onderdeel a, van de Wet veiligheidsonderzoeken][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0008277#Artikel1
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008277
        artikel: '1'
  - number: 7.2.c
    text: van personen, die niet voldoen aan de voor een aanstelling in vaste dienst gestelde eisen;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel7
  - number: 7.2.d
    text: voor het verrichten van werkzaamheden, waarvoor slechts tijdelijk een beroep op de arbeidsmarkt kan worden gedaan;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel7
  - number: 7.2.e
    text: |-
      van personen, die belast zullen worden met werk van kennelijk tijdelijk karakter, al dan niet vallende binnen de
      taak van het betrokken dienstvak;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel7
  - number: 7.2.f
    text: |-
      voor het incidenteel verrichten van werkzaamheden, vallende binnen de taak van het betrokken dienstvak, waarbij
      telkenmale de commandant, gehoord de ambtenaar, vaststelt op welke tijdstippen daadwerkelijk door de ambtenaar
      dienst wordt verricht;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel7
  - number: 7.2.g
    text: |-
      voor het verrichten van enkele diensten niet vallende binnen de normale taak van het betrokken dienstvak, waarbij
      per dienst een afzonderlijke beloning wordt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel7
  - number: 7.2.h
    text: |-
      van personen, die in dienst worden genomen als leerling ter opleiding tot enig beroep dan wel in verband met hun
      verdere wetenschappelijke of praktische opleiding en vorming;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel7
  - number: 7.2.i
    text: indien een wijziging in de taak van het betrokken dienstvak is voorgenomen;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel7
  - number: 7.2.j
    text: van onbezoldigde ambtenaren;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel7
  - number: 7.2.k
    text: in de gevallen, waarin dit bij of krachtens algemene maatregel van bestuur is bepaald.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel7
  - number: '7.3'
    text: |-
      Zodra de omstandigheid, genoemd in het tweede lid, welke leidde tot een aanstelling in tijdelijke dienst, zich
      niet meer voordoet, wordt een aanstelling in vaste dienst verleend tenzij daartegen uit anderen hoofde bedenkingen
      bestaan.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel7
  - number: '7.4'
    text: |-
      In de gevallen, genoemd onder *d, e* en *i* van het tweede lid, wordt in ieder geval aangenomen, dat de
      omstandigheid, welke leidde tot een aanstelling in tijdelijke dienst, zich niet meer voordoet, wanneer de ambtenaar
      sinds vijf jaar zonder onderbreking van langer dan 1 maand in dienst van het Ministerie van Defensie, waarvan
      laatstelijk gedurende tenminste 1 jaar in zijn huidige betrekking, werkzaam is geweest, tenzij vaststaat, dat zijn
      werkzaamheden in het door hem vervulde ambt binnen het jaar zullen worden beëindigd.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel7
  - number: '7.5'
    text: |-
      In afwijking van het tweede tot en met vierde lid kan een aanstelling in tijdelijke dienst voor bepaalde tijd voor
      de duur van ten hoogste drie jaren plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel7
  - number: '7.6'
    text: |-
      Op een aanstelling in tijdelijke dienst als bedoeld in het vijfde lid kan een nieuwe aanstelling in tijdelijke
      dienst op grond van het vijfde lid volgen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel7
  - number: '7.7'
    text: |-
      De op grond van het vijfde lid aangestelde ambtenaar in tijdelijke dienst mag bij beëindiging van die aanstelling
      de leeftijd van 30 jaar niet hebben overschreden, tenzij bij ministeriële regeling anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel7
  - number: '7.8'
    text: 'Een aanstelling in tijdelijke dienst wordt omgezet in een aanstelling in vaste dienst, indien:'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel7
  - number: 7.8.a
    text: |-
      meerdere aanstellingen in tijdelijke dienst elkaar opvolgen in een periode van drie jaren of langer en met
      tussenpozen van niet langer dan drie maanden;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel7
  - number: 7.8.b
    text: meer dan drie aanstellingen in tijdelijke dienst elkaar opvolgen met tussenpozen van niet langer dan drie maanden.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel7
  - number: '7.9'
    text: |-
      Voor het tellen van opeenvolgende aanstellingen worden aanstellingen die hebben plaatsgevonden vóór 1 januari 2000
      mede in aanmerking genomen, tenzij er sprake is van opeenvolgende aanstellingen ten behoeve van een project of
      indien in de diensteenheid, waarin de laatste aanstelling heeft plaatsgevonden, sprake is van overtolligheid.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel7
  - number: '7.10'
    text: |-
      De in het vijfde lid genoemde maximumduur van de aanstelling is niet van toepassing op de aanstelling in tijdelijke
      dienst voor bepaalde tijd van degene is aangesteld in burgerlijke openbare dienst om bij de krijgsmacht als
      geestelijk verzorger doorlopend werkzaam te zijn.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel7
  - number: '8.1'
    text: |-
      De aanstelling van de ambtenaar in vaste dienst die wordt bezoldigd volgens salarisschaal 15 of hoger van
      [bijlage A van het Inkomstenbesluit burgerlijke ambtenaren defensie][ref1] alsmede van de ambtenaar die is
      aangesteld in burgerlijke openbare dienst om bij de krijgsmacht als geestelijk verzorger werkzaam te zijn en die
      wordt bezoldigd in de salarisschaal behorend bij de rang van kapitein ter zee/kolonel geschiedt bij koninklijk
      besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0018191
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018191
  - number: '8.2'
    text: De aanstelling in de overige gevallen geschiedt door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel8
  - number: '9.1'
    text: |-
      Een aanstelling voor de tijd van langer dan drie maanden kan slechts plaatsvinden, indien Onze Minister op grond
      van de gegevens waarover hij beschikt van oordeel is dat de betrokkene in voldoende mate geschikt en bekwaam is
      voor de desbetreffende functie.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel9
  - number: '9.2'
    text: |-
      Onze Minister stelt voor een functie of voor een groep van functies eisen van geschiktheid en bekwaamheid vast
      waaraan de betrokkene moet voldoen om voor een aanstelling in aanmerking te komen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel9
  - number: '9.3'
    text: |-
      Teneinde vast te stellen of de betrokkene in voldoende mate geschikt of bekwaam is, wordt deze door Onze Minister
      aan een onderzoek onderworpen, waaronder begrepen het verifiëren en zo nodig aanvullen van de gegevens die door de
      betrokkene zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel9
  - number: '9.4'
    text: 'Het onderzoek, bedoeld in het derde lid, omvat tevens:'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel9
  - number: 9.4.a
    text: een psychologisch onderzoek, indien daaraan naar het oordeel van Onze Minister behoefte bestaat;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel9
  - number: 9.4.b
    text: |-
      een medisch onderzoek, indien dit op grond van een wettelijk voorschrift verplicht is gesteld dan wel indien op
      grond van functie-eisen een onderzoek naar de medische geschiktheid van de betrokkene noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel9
  - number: '9.5'
    text: |-
      Onze Minister stelt vast voor welke functies een medisch onderzoek als bedoeld in het vierde lid, onderdeel b,
      noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel9
  - number: '10.1'
    text: |-
      Onze Minister kan, met uitzondering van het geval, bedoeld in het tweede lid, van de betrokkene eisen dat deze een
      verklaring omtrent het gedrag als bedoeld in de [Wet justitiële gegevens][ref1] overlegt.


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: '10.2'
    text: |-
      Aanstelling in een vertrouwensfunctie als bedoeld in
      [artikel 1, eerste lid, onderdeel a, van de Wet veiligheidsonderzoeken][ref1] is slechts mogelijk, indien ten
      aanzien van de betrokkene een verklaring als bedoeld in [artikel 1, eerste lid, onderdeel b, van die wet][ref2]
      is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008277#Artikel1
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008277
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0008277
        artikel: '1'
  - number: '10.3'
    text: |-
      Bij wijziging van een tijdelijk in een vast dienstverband dan wel in geval van wijziging van tewerkstelling in een
      andere niet-vertrouwensfunctie wordt geen verklaring omtrent het gedrag verlangd, tenzij naar het oordeel van Onze
      Minister dit noodzakelijk wordt geacht.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel10
  - number: '10.4'
    text: |-
      Een veiligheidsonderzoek als bedoeld in het tweede lid, wordt pas ingesteld, als naar het oordeel van Onze Minister
      de betrokkene geschikt en bekwaam is voor de betreffende functie.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel10
  - number: '11.1'
    text: |-
      Aan de betrokkene die is onderworpen aan een psychologisch onderzoek als bedoeld in
      [artikel 9, vierde lid, onderdeel a][ref1], wordt op zijn verzoek binnen twee weken na de vaststelling van de
      uitslag van het onderzoek inzage verleend in die uitslag. Dit vindt plaats in het kader van een nagesprek met de
      psycholoog die het onderzoek heeft verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel9
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '11.2'
    text: |-
      Mededeling van de uitslag van het onderzoek aan Onze Minister blijft achterwege, indien de betrokkene uiterlijk
      een week nadat hij van de uitslag van het onderzoek heeft kennis genomen zijn wens daartoe schriftelijk heeft
      meegedeeld aan degene die met het onderzoek is belast.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel11
  - number: '11.3'
    text: |-
      De uitslag van het onderzoek wordt niet eerder dan twee weken nadat betrokkene daarvan heeft kennis genomen,
      medegedeeld aan Onze Minister, tenzij die mededeling op een eerder tijdstip is geboden en de betrokkene met die
      eerdere mededeling schriftelijk heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel11
  - number: '11.4'
    text: |-
      Voor zover dit niet heeft plaatsgevonden overeenkomstig het eerste lid heeft de betrokkene recht op een nagesprek
      met de psycholoog die het onderzoek heeft verricht.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel11
  - number: '11.5'
    text: |-
      De kosten van het psychologisch onderzoek en van het nagesprek komen voor rekening van het Ministerie van Defensie.
      De betrokkene ontvangt voor ten behoeve van het onderzoek en het nagesprek gemaakte reis- en verblijfkosten een
      vergoeding ingevolge de bepalingen van het [Besluit dienstreizen defensie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007956
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007956
  - number: '12.1'
    text: |-
      De uitslag van het medisch onderzoek als genoemd in [artikel 9, vierde lid, onderdeel b][ref1], wordt uiterlijk
      binnen twee weken na vaststelling van die uitslag aan de betrokkene medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel9
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '12.2'
    text: |-
      De betrokkene kan binnen twee weken nadat hem de uitslag van het medisch onderzoek is meegedeeld, een hernieuwd
      medisch onderzoek aanvragen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel12
  - number: '12.3'
    text: Het hernieuwd medisch onderzoek mag niet worden verricht door de arts die het medisch onderzoek heeft verricht.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel12
  - number: '12.4'
    text: |-
      De betrokkene die op grond van [artikel 9, vierde lid, onderdeel b][ref1], is onderworpen aan een medisch
      onderzoek, wordt bij aanstelling in een andere functie opnieuw aan een onderzoek naar de medische geschiktheid
      onderworpen indien de betrokkene voor het vervullen van die functie aan andere medische eisen dient te voldoen dan
      voor de tot dusverre vervulde functie.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel9
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '12.5'
    text: |-
      Het medisch onderzoek, bedoeld in [artikel 9, vierde lid, onderdeel b][ref1], mag pas plaatsvinden, indien de
      betrokkene naar het oordeel van Onze Minister op grond van het onderzoek, bedoeld in [artikel 9, derde lid][ref2],
      en eventueel na het psychologisch onderzoek, bedoeld in [artikel 9, vierde lid, onderdeel a][ref3], overigens
      voldoende bekwaam en geschikt is voor de desbetreffende functie.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0006040#Artikel9
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006040
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '12.6'
    text: |-
      De kosten van het medisch onderzoek en het hernieuwd medisch onderzoek komen voor rekening van het Ministerie van
      Defensie. De betrokkene ontvangt voor ten behoeve van het onderzoek en het hernieuwd onderzoek gemaakte reis- en
      verblijfkosten een vergoeding ingevolge de bepalingen van het [Besluit dienstreizen defensie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007956
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007956
  - number: '14.1'
    text: |-
      Aan de ambtenaar wordt, zo mogelijk vóór de aanvaarding van zijn ambt, een akte van aanstelling uitgereikt, waarin
      in ieder geval worden vermeld:
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel14
  - number: 14.1.a
    text: de naam, de voornamen en de geboortedatum van de ambtenaar;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel14
  - number: 14.1.b
    text: de naam van de dienst, het bedrijf of de instelling van het Ministerie van Defensie;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel14
  - number: 14.1.c
    text: de datum, met ingang waarvan hij wordt aangesteld;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel14
  - number: 14.1.d
    text: of de aanstelling geschiedt in vaste of tijdelijke dienst;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel14
  - number: 14.1.e
    text: de wekelijkse arbeidsduur waarvoor de ambtenaar wordt aangesteld.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel14
  - number: '14.2'
    text: 'Indien de aanstelling geschiedt in tijdelijke dienst, wordt bovendien in de akte van aanstelling vermeld:'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel14
  - number: 14.2.a
    text: of de aanstelling geschiedt voor bepaalde tijd - en zo ja voor hoelang of voor onbepaalde tijd;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel14
  - number: 14.2.b
    text: |-
      de toepasselijke, in [artikel 7, tweede lid][ref1], omschreven grond(en) voor de aanstelling in tijdelijke dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel7
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '15.1'
    text: |-
      Voor zover deze gegevens op hem betrekking hebben en niet reeds in de akte van aanstelling zijn vermeld, worden aan
      de ambtenaar zo spoedig mogelijk schriftelijk medegedeeld:
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel15
  - number: 15.1.a
    text: |-
      de afdeling of het dienstvak waarbij, de betrekking waarin, en de periode gedurende welke hij in die betrekking
      wordt te werk gesteld, alsmede de hem dienovereenkomstig aangewezen standplaats;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel15
  - number: 15.1.b
    text: de salarisschaal en de voor de bepaling van die schaal in acht genomen regelen;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel15
  - number: 15.1.c
    text: |-
      het salaris dat hem is toegekend, zomede, het salarisnummer en het tijdstip waarop het salaris voor de eerste maal
      periodiek zal worden verhoogd;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel15
  - number: 15.1.d
    text: andere hem mogelijk toegekende voordelen, onder verwijzing naar de desbetreffende kortingsregeling;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel15
  - number: 15.1.e
    text: |-
      de omvang en de voorwaarden voor toekenning van een bindingspremie als bedoeld in
      [artikel 47 van het Inkomstenbesluit burgerlijke ambtenaren defensie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel47
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '47'
  - number: '16.1'
    text: |-
      De ambtenaar wordt bij zijn aanstelling schriftelijk op de hoogte gesteld van de hoofdlijnen van zijn
      rechtspositie.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel16
  - number: '16.2'
    text: |-
      Regelingen waarin zijn rechtspositie is neergelegd worden op een voor de ambtenaar gemakkelijk toegankelijke plaats
      ter inzage gelegd. Van deze regelingen kan hij kosteloos afschriften maken voor zover dat redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel16
  - number: '16.3'
    text: |-
      De schriftelijk vastgestelde en voor hem geldende regelingen en instructies, welke hij bij de vervulling van zijn
      dienst heeft na te leven, worden eveneens op een voor de ambtenaar gemakkelijk toegankelijke plaats ter inzage
      gelegd. In het geval vermelde regelingen en instructies niet schriftelijk zijn vastgesteld, worden deze behoorlijk
      te zijner kennis gebracht.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel16
  - number: '19.1'
    text: |-
      De ambtenaar kan, al dan niet op eigen aanvraag, door het hoofd defensieonderdeel worden aangewezen voor het volgen
      van een om- of bijscholingsopleiding teneinde de benodigde kennis en vaardigheden te behouden voor het vervullen
      van de huidige functie, dan wel te verkrijgen voor de vervulling van toekomstige functies. De ambtenaar wordt
      tijdig in de gelegenheid gesteld tot het volgen van die opleiding.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel19
  - number: '19.2'
    text: |-
      Het hoofd defensieonderdeel kent de ambtenaar een vergoeding toe voor de aan een om- of bijscholingsopleiding
      verbonden noodzakelijk te zijnen laste komende kosten.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel19
  - number: '19.3'
    text: |-
      De ambtenaar die is aangewezen voor het volgen van een om- of bijscholingsopleiding, kan daarvan door het hoofd
      defensieonderdeel worden ontheven indien hij niet voldoet aan de bij de opleiding gestelde eisen of indien
      ontheffing in het belang van de dienst of van de ambtenaar om andere redenen noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel19
  - number: '19.4'
    text: |-
      [Artikel 22][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel22
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '22'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '20.1'
    text: |-
      De ambtenaar wordt op zijn aanvraag door Onze Minister aangewezen voor een opleiding indien de ambtenaar de
      beschikking heeft over een individuele opleidingsaanspraak. Over de periode van het volgen van de opleiding worden
      vooraf afspraken gemaakt tussen de ambtenaar, de commandant en de employabilitybegeleider.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel20
  - number: '20.2'
    text: |-
      De kosten verbonden aan de opleiding worden vergoed tot bij ministeriele regeling vast te stellen maximum bedragen.
      De kosten kunnen tot vijf jaar voor de pensioengerechtigde leeftijd worden vergoed met inachtneming van de hiervoor
      bedoelde maximumbedragen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel20
  - number: '20.3'
    text: |-
      Indien bij een andere te vervullen functie blijkt dat de gevolgde opleiding onderdeel uitmaakt van de functie-
      eisen, wordt het bedrag van de daarvoor vergoede opleidingskosten weer toegevoegd aan de bedragen, bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel20
  - number: '20.4'
    text: |-
      Wanneer de opleiding dan wel de noodzakelijke voorbereiding daarop plaatsvindt tijdens de werktijd van de
      ambtenaar, wordt hij door Onze Minister hiervoor vrijgesteld van arbeid. Indien zwaarwegende redenen van
      dienstbelang dit noodzakelijk maken, kan de vrijstelling van arbeid door Onze Minister tijdelijk worden opgeheven.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel20
  - number: '20.5'
    text: |-
      Indien de opleiding niet kan worden afgerond voordat ontslag plaats vindt op grond van
      [artikel 113, vijfde lid][ref1], kan de opleiding na het ontslag worden afgerond met vergoeding van de daarmee
      samenhangende opleidingskosten met inachtneming van de in het tweede lid bedoelde maximum bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel113
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '113'
        hoofdstuk: '10'
  - number: '20.6'
    text: Bij ministeriele regeling worden nadere regels gesteld ten aanzien van dit artikel.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel20
  - number: '21'
    text: |-
      Aan de ambtenaar die dat wenst, kunnen naar bij ministeriële regeling te stellen regels bepaalde studiefaciliteiten
      worden verleend, indien de ambtenaar naar het oordeel van het hoofd defensieonderdeel een studie of opleiding voor
      eigen rekening volgt of heeft voltooid die mede in het belang van de dienst of in het belang van de bevordering van
      de externe werkzekerheid is.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel21
  - number: '22'
    text: |-
      De ambtenaar die wordt aangesteld om na afloop van een opleiding voor een functie daarin te worden tewerkgesteld,
      kan naar bij ministeriële regeling te stellen regels, bij die aanstelling worden verplicht tot gehele of
      gedeeltelijke (terug)betaling van de kosten van de opleiding als bedoeld in de [artikelen 19][ref1] en [21][ref2]
      ingeval hem overeenkomstig zijn aanvraag of anders dan eervol, ontslag wordt verleend in het opleidingstijdvak dan
      wel binnen een in even bedoelde regels aangegeven tijdvak na afloop van de opleiding. Het bepaalde in de vorige
      volzin is van overeenkomstige toepassing ten aanzien van de ambtenaar in tijdelijke dienst, wiens aanstelling
      voor een bepaalde tijd overeenkomstig zijn aanvraag niet wordt verlengd of overeenkomstig zijn aanvraag niet wordt
      gewijzigd in een aanstelling in vaste dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel21
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '23'
    text: |-
      Bij ministeriele regeling worden regels gesteld omtrent loopbaanvorming in het algemeen en omtrent daarmede verband
      houdende bijzondere regelingen ter bepaling van de voor de ambtenaar geldende salarisschaal.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel23
  - number: '24.1'
    text: |-
      De ambtenaar, die in vaste dienst is aangesteld en is tewerkgesteld in een functie waaraan schaal 9 of hoger van
      [bijlage A van het Inkomstenbesluit burgerlijke ambtenaren defensie][ref1] is verbonden, wordt voor een periode
      van ten hoogste vijf jaren in een functie tewerkgesteld. Deze tewerkstelling duurt voort, tenzij na afloop van die
      periode op basis van een met de betrokken ambtenaar gemaakte loopbaanafspraak een andere, passende functie wordt
      opgedragen. In beginsel dient met de ambtenaar overeenstemming te zijn bereikt over die andere functie.


      [ref1]: https://wetten.overheid.nl/BWBR0018191
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0018191
  - number: '24.2'
    text: Bij ministeriële regeling kunnen nadere regels ter uitvoering van het eerste lid worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel24
  - number: '25.1'
    text: |-
      Aan de wijze van functievervulling van de ambtenaar en aan zijn gedrag in relatie tot zijn functie wordt ten minste
      een keer per jaar aandacht besteed door middel van het houden van een functioneringsgesprek.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel25
  - number: '25.2'
    text: Aan het functioneringsgesprek wordt deelgenomen door de ambtenaar en diens functionele chef.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel25
  - number: '25.3'
    text: |-
      Op verzoek van een van de deelnemers aan het functioneringsgesprek en met instemming van beide deelnemers kunnen
      een of meer andere personen aan het gesprek deelnemen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel25
  - number: '25.4'
    text: 'Het functioneringsgesprek is ten minste gericht op de navolgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel25
  - number: 25.4.a
    text: |-
      het functioneren van de ambtenaar in de omgeving waarin hij zijn functie vervult, alsmede de functionele relatie
      tussen de ambtenaar en de functionele chef met betrekking tot de functie-uitoefening van de ambtenaar over de
      achterliggende periode. Hierbij komen in elk geval de volgende aspecten aan de orde:
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel25
  - number: 25.4.a.1°
    text: de verhouding tussen de getoonde kennis en de vaardigheden en de gestelde functie-eisen;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel25
  - number: 25.4.a.2
    text: de vorderingen en de gedragingen;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel25
  - number: 25.4.a.3°
    text: de toetsing of en in hoeverre is voldaan aan eerder gemaakte afspraken;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel25
  - number: 25.4.a.4°
    text: integriteit.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel25
  - number: 25.4.b
    text: afspraken en aandachtspunten met betrekking tot de toekomstige functievervulling;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel25
  - number: 25.4.c
    text: |-
      de persoonlijke ontwikkeling in relatie tot de mogelijke loopbaanwensen van de ambtenaar en de algemene
      loopbaanpatronen;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel25
  - number: 25.4.d
    text: |-
      indien de ambtenaar de leeftijd van 50 jaar heeft bereikt: de relatie tussen leeftijd en belastbaarheid en
      functievervulling.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel25
  - number: '25.5'
    text: |-
      De functionele chef legt een samenvatting van de inhoud van het gesprek alsmede de gemaakte afspraken en besproken
      aandachtspunten in het functioneringsgesprekformulier vast. Het formulier wordt voor een correcte weergave daarvan
      door de functionele chef en de ambtenaar ondertekend. De functionele chef verstrekt de ambtenaar een afschrift van
      het functioneringsgesprekformulier. De afspraken en aandachtspunten worden opgelegd in het personeelsdossier van
      de betrokkene.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel25
  - number: '25.6'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld ten aanzien van het houden van functioneringsgesprekken en
      het functioneringsgesprekformulier, waarin ten minste de in het vierde lid genoemde onderdelen zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel25
  - number: '26.1'
    text: Op verzoek van de ambtenaar voert de employabilitybegeleider een loopbaangesprek met de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel26
  - number: '26.2'
    text: 'In het loopbaangesprek wordt ten minste aandacht besteed aan:'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel26
  - number: 26.2.a
    text: |-
      de ontwikkelpunten inzake kennis, ervaring en competenties, gericht op het vervolg van de loopbaan binnen of buiten
      het ministerie van Defensie;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel26
  - number: 26.2.b
    text: de opleidingswensen van de ambtenaar;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel26
  - number: 26.2.c
    text: |-
      de kansen en mogelijkheden ten aanzien van het vervolg van de loopbaan binnen of buiten het ministerie van
      Defensie.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel26
  - number: '26.3'
    text: |-
      Afspraken die in het loopbaangesprek worden gemaakt, zijn bindend en worden vastgelegd in het bij ministeriële
      regeling vast te stellen persoonlijk ontwikkelplanformulier.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel26
  - number: '26.4'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld ten aanzien van het houden van loopbaangesprekken en het
      vaststellen van de afspraken in het persoonlijk ontwikkelplanformulier.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel26
  - number: '27.1'
    text: |-
      Indien de commandant of de ambtenaar dit wenselijk vindt, wordt een beoordeling opgemaakt. De ambtenaar dient
      daartoe een aanvraag in bij de commandant.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel27
  - number: '27.2'
    text: Onze Minister kan opdracht geven tot het opmaken van een beoordeling.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel27
  - number: '27.3'
    text: |-
      De ambtenaar wordt beoordeeld omtrent de wijze waarop hij zijn functie heeft vervuld en omtrent zijn gedrag in
      relatie tot die functie, gedurende het beoordelingstijdvak. De beoordeling is gebaseerd op concrete handelingen,
      resultaten en gedragingen van de te beoordelen ambtenaar.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel27
  - number: '27.4'
    text: Bij het opmaken van een beoordeling kan een toekomstverwachting worden opgemaakt.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel27
  - number: '27.5'
    text: |-
      Het beoordelingstijdvak omvat een periode van ten minste zes maanden en ten hoogste twee jaren. Per kalenderjaar
      kan maximaal één beoordeling worden opgemaakt.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel27
  - number: '27.6'
    text: |-
      De beoordeling wordt opgemaakt door een eerste en in beginsel een tweede beoordelaar. Als eerste beoordelaar treedt
      op de functionele chef van de ambtenaar. De tweede beoordelaar is de commandant dan wel een door de commandant
      aangewezen functionaris. In geval de commandant is opgetreden als eerste beoordelaar, treedt in beginsel als tweede
      beoordelaar op de functionele chef van de commandant.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel27
  - number: '27.7'
    text: |-
      Gelet op de vereiste deskundigheid kan bij het uitbrengen van een beoordeling een personeelsbeoordelingsadviseur
      aan de beoordelaar worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel27
  - number: '27.8'
    text: 'Na het opmaken van de beoordeling van de ambtenaar:'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel27
  - number: 27.8.a
    text: wordt met de ambtenaar zijn beoordeling besproken;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel27
  - number: 27.8.b
    text: krijgt de ambtenaar een afschrift van zijn beoordeling uitgereikt;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel27
  - number: 27.8.c
    text: |-
      krijgt hij de gelegenheid zijn bedenkingen tegen de omtrent hem opgemaakte beoordeling binnen twee weken
      schriftelijk bij de tweede beoordelaar kenbaar te maken, tenzij er geen tweede beoordelaar is; indien er geen
      tweede beoordelaar is, worden de bedenkingen kenbaar gemaakt bij de eerste beoordelaar.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel27
  - number: '27.9'
    text: |-
      Nadat de beoordeling door de tweede beoordelaar is vastgesteld, wordt aan de ambtenaar een afschrift verstrekt.
      Deze bepaling is van overeenkomstige toepassing indien er sprake is van één beoordelaar.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel27
  - number: '27.10'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld ten aanzien van het opmaken en vaststellen van beoordelingen
      alsmede het beoordelingsformulier volgens welke de ambtenaar wordt beoordeeld.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel27
  - number: 30a
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30a
  - number: 30a.a
    text: |-
      dienst: een aaneengesloten tijdruimte waarin arbeid wordt verricht en die gelegen is tussen twee voorgeschreven
      opeenvolgende onafgebroken rusttijden;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30a
  - number: 30a.b
    text: |-
      werktijd: het totaal van de in kloktijden aangegeven perioden gedurende welke een ambtenaar de hem opgedragen
      arbeid moet verrichten;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30a
  - number: 30a.c
    text: |-
      rooster: een voor een periode van tenminste een week opgesteld en van tevoren schriftelijk bekendgemaakt schema van
      aanvang en einde van de dagelijkse werk- en rusttijden;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30a
  - number: 30a.d
    text: |-
      arbeidsduur: de tijdsduur, uitgedrukt in een aantal uren per dag of per week, gedurende welke een ambtenaar arbeid
      verricht;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30a
  - number: 30a.e
    text: 'nachtdienst: een dienst waarin de uren tussen 00.00 uur en 06.00 uur geheel of gedeeltelijk zijn begrepen;'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30a
  - number: 30a.f
    text: 'jeugdige ambtenaar: een ambtenaar van 16 of 17 jaar;'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30a
  - number: 30a.g
    text: |-
      pauze: een tijdruimte van ten minste 15 achtereenvolgende minuten, waarmee de arbeid tijdens de dienst wordt
      onderbroken en de ambtenaar geen enkele verplichting heeft ten aanzien van de bedongen arbeid;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30a
  - number: 30a.h
    text: |-
      consignatie: een tijdruimte tussen twee elkaar opeenvolgende diensten of tijdens een pauze, waarin de ambtenaar
      uitsluitend verplicht is bereikbaar te zijn om in geval van onvoorziene omstandigheden op oproep zo spoedig
      mogelijk de bedongen arbeid te verrichten;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30a
  - number: 30a.i
    text: |-
      aanwezigheidsdienst: een aaneengesloten tijdruimte van ten hoogste 24 uren, waarin de ambtenaar, zo nodig naast
      het verrichten van de bedongen arbeid, consignatie wordt opgelegd waarbij de ambtenaar verplicht is op de werkplek
      aanwezig te zijn om op oproep zo spoedig mogelijk de bedongen arbeid te verrichten;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30a
  - number: 30a.j
    text: |-
      piket: een periode waarin de ambtenaar, zo nodig naast het verrichten van de bedongen arbeid, consignatie wordt
      opgelegd waarbij de ambtenaar verplicht is om in verband met zijn bereikbaarheid op de werkplek aanwezig te zijn;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30a
  - number: 30a.k
    text: |-
      oefening: elk door defensiepersoneel in de praktijk brengen van onderwezen bekwaamheden teneinde aldus de
      bedrevenheid in het uitvoeren van aan de krijgsmacht opgedragen operationele taken te verwerven, te vergroten of
      te onderhouden.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30a
  - number: 30b.1
    text: |-
      De werk- en rusttijden van de ambtenaar worden met inachtneming van de bepalingen in dit hoofdstuk, en nadat
      hierover overeenkomstig het [Besluit medezeggenschap defensie][ref1] overeenstemming is bereikt met de betrokken
      medezeggenschapscommissie, vastgesteld door de commandant en schriftelijk vastgelegd in roosters.


      [ref1]: https://wetten.overheid.nl/BWBR0010617
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30b
    references:
      - id: ref1
        bwb_id: BWBR0010617
  - number: 30b.2
    text: |-
      De arbeidsduur bedraagt gerekend over de periode waarvoor het rooster is vastgesteld ten hoogste gemiddeld 38 uren
      per week. In uitzonderlijke gevallen kan door Onze Minister van de eerste volzin worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30b
  - number: 30b.3
    text: |-
      Aan de ambtenaar van 55 jaar en ouder wordt niet opgedragen dienst te verrichten tussen 22.00 uur en 06.00 uur,
      tenzij het een gedeelte van een dienst betreft die doorloopt na 22.00 uur en ten laatste eindigt om 24.00 uur.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30b
  - number: 30b.4
    text: |-
      Van het derde lid kan door de commandant voor de duur van telkens ten hoogste één jaar worden afgeweken, indien de
      ambtenaar dit heeft aangevraagd, dan wel zeer gewichtige redenen van dienstbelang hiertoe noodzaken, mits de arts
      van de bedrijfsgeneeskundige dienst daaromtrent een positief advies heeft uitgebracht.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30b
  - number: 30b.5
    text: |-
      Door Onze Minister kunnen functies worden aangewezen waarbij het reizen, naar en vanaf de plaats waar de ambtenaar
      dienst moet verrichten, een wezenlijk bestanddeel uitmaakt van de functie. Bij die functies wordt de reisduur
      buiten de voor de ambtenaar geldende werktijd als arbeidsduur aangemerkt.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30b
  - number: 30ba
    text: |-
      Indien de overschrijding van de arbeidsduur, bedoeld in [artikel 30b, tweede lid][ref1], wordt vergoed in tijd, is
      op deze tijd [artikel 33, zevende lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel30b
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel33
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30ba
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 30b
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: '33'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 30bb.1
    text: |-
      De commandant kent, in afwijking van [artikel 30l, onder a][ref1], aan de ambtenaar met salarisschaal 11 of 12
      een compensatie voor overwerk toe, indien de ambtenaar in opdracht van de commandant een of meerdere uren overwerk
      verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel30l
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30bb
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 30l
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 30bb.2
    text: |-
      De compensatie voor overwerk bestaat uit roostervrije uren, gelijk aan het aantal uren overschrijding van het per
      dag vastgestelde aantal arbeidsuren.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30bb
  - number: 30bb.3
    text: De commandant stelt de ambtenaar in de gelegenheid de compensatie op te nemen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30bb
  - number: 30c.1
    text: |-
      De arbeidsduur, bedoeld in [artikel 30b, tweede lid][ref1], van de ambtenaar van 57 jaar en ouder die daartoe een
      aanvraag heeft ingediend, wordt door de commandant, onder handhaving van de arbeidsduur waarvoor hij is aangesteld,
      teruggebracht met 15,8%, tenzij het dienstbelang zich daartegen verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel30b
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30c
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 30b
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 30c.2
    text: |-
      De arbeidsduur, bedoeld in [artikel 30b, tweede lid][ref1], van de ambtenaar van 61 jaar en ouder die daartoe een
      aanvraag heeft ingediend, wordt door de commandant, onder handhaving van de arbeidsduur waarvoor hij is aangesteld,
      teruggebracht met 36,8%, tenzij het dienstbelang zich daartegen verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel30b
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30c
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 30b
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 30c.3
    text: |-
      De ingevolge het eerste en het tweede lid teruggebrachte arbeidsduur wordt afgerond naar boven indien de eerste
      decimaal achter de komma groter is dan nul.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30c
  - number: 30c.4
    text: |-
      De aanspraak op vakantie als bedoeld in [artikel 32, vierde lid][ref1], wordt naar evenredigheid verminderd en de
      in [artikel 32, vijfde lid, onder a][ref2], bedoelde verhoging van de vakantieaanspraak komt te vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel32
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30c
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '32'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: '32'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 30c.5
    text: |-
      De in het eerste dan wel tweede lid bedoelde ambtenaar dient op het moment van de eerste aanvraag ten minste 5
      aaneengesloten jaren in dienst te zijn van het Ministerie van Defensie.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30c
  - number: 30c.6
    text: |-
      Voor de uren die het wekelijks verschil vormen tussen de in het eerste en tweede lid bedoelde arbeidsduur waarvoor
      hij is aangesteld, en de teruggebrachte arbeidsduur wordt de ambtenaar geacht met verlof te zijn.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30c
  - number: 30c.7
    text: |-
      Op het salaris van de in het eerste respectievelijk tweede lid bedoelde ambtenaar wordt een inhouding toegepast ter
      grootte van 5% respectievelijk 10% van het salaris dat voor hem zou gelden zonder arbeidsduurvermindering op grond
      van dit artikel.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30c
  - number: 30c.8
    text: |-
      Onze Minister stelt omtrent de verrekening van extra inkomsten uit arbeid of bedrijf met het salaris van de in het
      eerste en tweede lid bedoelde ambtenaar nadere regels vast.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30c
  - number: 30c.9
    text: |-
      Dit artikel is niet van toepassing op een ambtenaar die gebruik maakt van de mogelijkheid van ontslag als bedoeld
      in [artikel 114, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel114
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30c
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '114'
        hoofdstuk: '10'
  - number: 30d.1
    text: |-
      De commandant dat een rooster vaststelt of opnieuw vaststelt, maakt het rooster ten minste 28 dagen vóór de datum
      van inwerkingtreding bekend aan de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30d
  - number: 30d.2
    text: |-
      Indien de aard van de arbeid toepassing van het eerste lid onmogelijk maakt, stelt de commandant ten minste
      28 dagen van tevoren aan de ambtenaar bekend op welke dag de rusttijd, bedoeld in de [artikelen 30r][ref1] en
      [31g, eerste lid][ref2], aanvangt. Tevens maakt hij aan de ambtenaar ten minste 4 dagen van tevoren de tijdstippen
      bekend waarop hij arbeid moet verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel30r
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel31g
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30d
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 30r
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: 31g
        hoofdstuk: '4'
        paragraaf: '8'
  - number: 30d.3
    text: |-
      De commandant dient overeenstemming te bereiken met de betrokken medezeggenschapscommissie, indien het dienstbelang
      het noodzakelijk maakt af te wijken van het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30d
  - number: 30da.1
    text: |-
      De ambtenaar kan bij de commandant eenmaal per kalenderjaar een aanvraag indienen om zijn arbeidsduur gedurende
      het resterende deel van dat kalenderjaar met 2 uren per week te verlengen wanneer het rooster van de ambtenaar
      gedurende het resterende deel van dat kalenderjaar zal zijn gebaseerd op een arbeidsduur van gemiddeld 38 uur
      per week. Voor de ambtenaar die is aangesteld voor een arbeidsduur van gemiddeld minder dan 38 uur per week
      wordt de ingevolge de vorige volzin geldende aanspraak vastgesteld op een evenredig deel van de aanspraak bij een
      arbeidsduur van gemiddeld 38 uur per week.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30da
  - number: 30da.2
    text: |-
      De commandant wijst een aanvraag als bedoeld in het eerste lid toe, tenzij het dienstbelang zich daartegen verzet.
      In ieder geval wordt de aanvraag afgewezen indien de tijdelijke verlenging van de arbeidsduur geen effect heeft op
      de formatie, onder door Onze Minister bij ministeriële regeling nader vast te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30da
  - number: 30da.3
    text: |-
      Een toegestane verlenging van de arbeidsduur gaat in op de eerste dag van de maand, volgend op de maand waarin de
      verlenging is toegestaan.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30da
  - number: 30da.4
    text: 'Een toegestane verlenging van de arbeidsduur wordt jaarlijks stilzwijgend voortgezet tenzij:'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30da
  - number: 30da.4.a
    text: de ambtenaar een aanvraag indient om de tijdelijke verlenging van de arbeidsduur te beëindigen; of
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30da
  - number: 30da.4.b
    text: |-
      de ambtenaar een aanvraag indient als bedoeld in [artikel 30db, eerste lid][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel30db
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30da
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 30db
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 30da.4.c
    text: |-
      de commandant de verlenging van de arbeidsduur beëindigt omdat hij van oordeel is dat het dienstbelang zich tegen
      een voortgezette verlenging daarvan verzet.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30da
  - number: 30da.5
    text: |-
      Indien de ambtenaar in een andere functie wordt tewerkgesteld vervalt met ingang van de datum van tewerkstelling de
      verlenging van de arbeidsduur. In dat geval kan de ambtenaar bij zijn nieuwe commandant een aanvraag als bedoeld in
      het eerste lid indienen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30da
  - number: 30da.6
    text: |-
      Voor het deel dat de arbeidsduur wordt verlengd ontvangt de ambtenaar een maandelijkse toeslag. Deze toeslag
      bedraagt acht maal het voor de betrokken ambtenaar geldende salaris per uur, of een evenredig deel daarvan voor de
      ambtenaar die is aangesteld voor een arbeidsduur van gemiddeld minder dan 38 uur per week.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30da
  - number: 30db.1
    text: |-
      De ambtenaar kan bij de commandant eenmaal per kalenderjaar een aanvraag indienen om zijn arbeidsduur gedurende
      het resterende deel van dat kalenderjaar met 2 uren per week te verkorten wanneer het rooster van de ambtenaar
      gedurende het resterende deel van dat kalenderjaar zal zijn gebaseerd op een arbeidsduur van gemiddeld 38 uur
      per week. Voor de ambtenaar die is aangesteld voor een arbeidsduur van gemiddeld minder dan 38 uur per week
      wordt de ingevolge de vorige volzin geldende aanspraak vastgesteld op een evenredig deel van de aanspraak bij een
      arbeidsduur van gemiddeld 38 uur per week.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30db
  - number: 30db.2
    text: |-
      De in het eerste lid bedoelde verkorting van de arbeidsduur wordt verwerkt in het voor de betrokken ambtenaar
      geldende rooster dan wel wordt toegekend in de vorm van acht spaaruren per maand wanneer het een ambtenaar betreft
      van wie het rooster is gebaseerd op een arbeidsduur van gemiddeld 38 uur per week en een evenredig deel daarvan
      wanneer het een ambtenaar betreft die is aangesteld voor een arbeidsduur van gemiddeld minder dan 38 uur per week.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30db
  - number: 30db.3
    text: De commandant wijst een aanvraag indien het gaat om een ambtenaar als bedoeld in het eerste lid toe.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30db
  - number: 30db.4
    text: |-
      Een toegestane verkorting van de arbeidsduur gaat in op de eerste dag van de maand, volgend op de maand waarin de
      verkorting is toegestaan.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30db
  - number: 30db.5
    text: 'Een toegestane verkorting van de arbeidsduur wordt jaarlijks stilzwijgend voortgezet tenzij:'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30db
  - number: 30db.5.a
    text: de ambtenaar een aanvraag indient om de tijdelijke verkorting van de arbeidsduur te beëindigen; of
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30db
  - number: 30db.5.b
    text: |-
      de ambtenaar een aanvraag indient als bedoeld in [artikel 30da, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel30da
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30db
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 30da
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 30db.6
    text: |-
      Indien de ambtenaar in een andere functie wordt tewerkgesteld vervalt met ingang van de datum van tewerkstelling de
      verkorting van de arbeidsduur. In dat geval kan de ambtenaar bij zijn nieuwe commandant een aanvraag als bedoeld in
      het eerste lid indienen.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30db
  - number: 30db.7
    text: |-
      Voor het deel dat de arbeidsduur wordt verkort, wordt maandelijks een inhouding toegepast. Deze inhouding bedraagt
      2 maal het voor de betrokken ambtenaar geldende salaris per uur, of een evenredig deel daarvan voor de ambtenaar
      die is aangesteld voor een arbeidsduur van gemiddeld minder dan 38 uur per week.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30db
  - number: 30dc.1
    text: |-
      De spaaruren, bedoeld in [artikel 30db, tweede lid][ref1], worden geheel of gedeeltelijk in een aaneengesloten
      periode van ten minste 288 spaaruren en ten hoogste 960 spaaruren opgenomen. Voor de ambtenaar die is aangesteld
      voor een arbeidsduur van gemiddeld minder dan 38 uur per week wordt de in de vorige volzin genoemde verplichting
      vastgesteld op een aaneengesloten periode van een evenredig aantal spaaruren van het aantal dat geldt voor een
      ambtenaar van wie het rooster is gebaseerd op een arbeidsduur van gemiddeld 38 uur per week.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel30db
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30dc
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 30db
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 30dc.2
    text: |-
      Indien de ambtenaar op een andere functie wordt tewerkgesteld kan de commandant op aanvraag van de ambtenaar
      afwijken van het minimum aantal op te nemen spaaruren. Indien de ambtenaar op een andere functie wordt
      tewerkgesteld kan de commandant op aanvraag van de ambtenaar afwijken van het gestelde in het eerste lid dat de
      spaaruren in een aaneengesloten periode van ten minste 288 spaaruren worden opgenomen. Indien met een dergelijke
      aanvraag wordt ingestemd, dan wordt het gehele tegoed aan spaaruren opgenomen bij functiewisseling, voorafgaand aan
      de datum van tewerkstelling op de nieuwe functie.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30dc
  - number: 30dc.3
    text: |-
      Een aanvraag voor de opname van spaaruren wordt ten minste 6 maanden voorafgaande aan de gewenste datum van aanvang
      van de opnameperiode, ingediend bij de commandant.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30dc
  - number: 30dc.4
    text: De commandant wijst een aanvraag als bedoeld in het derde lid toe, tenzij het dienstbelang zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30dc
  - number: 30dc.5
    text: |-
      De in een kalenderjaar opgebouwde spaaruren vervallen na een periode van 10 kalenderjaren, te rekenen vanaf de dag
      van aanvang van het daarop volgende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30dc
  - number: 30dc.6
    text: |-
      Indien vanwege dienstbelang dan wel persoonlijke omstandigheden de ambtenaar gedurende de periode van 10 jaar
      bedoeld in het vijfde lid niet in de gelegenheid is gesteld de spaaruren op te nemen, maakt de commandant in
      afwijking van het vijfde lid met de ambtenaar afspraken over de opname van de spaaruren binnen de 2 daaropvolgende
      kalenderjaren.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30dc
  - number: 30dc.7
    text: |-
      Ten aanzien van de opname van spaaruren zijn [artikel 33, zevende lid][ref1], en [artikel 91a][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel91a
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30dc
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '33'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: 91a
        hoofdstuk: 7b
  - number: 30dca
    text: |-
      De bevoegdheid tot het toekennen van de aanvraag op grond van de [artikelen 30da][ref1], [30db][ref2] en
      [30dc][ref3] aan ambtenaren bezoldigd volgens salarisschaal 14 en hoger berust bij de Secretaris-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel30da
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel30db
      [ref3]: https://wetten.overheid.nl/BWBR0006040#Artikel30dc
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30dca
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 30da
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: 30db
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0006040
        artikel: 30dc
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 30dd.1
    text: |-
      Indien de ambtenaar op de datum dat hem ontslag is verleend nog een tegoed aan spaaruren heeft, dan wordt voor elk
      spaaruur een vergoeding toegekend van 1/165 deel van het voor de betrokken ambtenaar geldende maandsalaris, zoals
      dit gold direct voorafgaande aan de datum dat hem ontslag is verleend.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30dd
  - number: 30dd.2
    text: Indien de ambtenaar overlijdt, wordt het eerste lid overeenkomstig toegepast.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30dd
  - number: 30e.1
    text: |-
      De commandant voert een deugdelijke registratie ter zake van de werk- en rusttijden en de realisatie daarvan, welke
      het toezicht op de naleving van de bepalingen in dit hoofdstuk mogelijk maakt.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30e
  - number: 30e.2
    text: |-
      De in het eerste lid bedoelde gegevens en bescheiden worden ten minste 52 weken, gerekend vanaf de datum waarop de
      desbetreffende gegevens en bescheiden betrekking hebben, bewaard.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30e
  - number: 30f
    text: |-
      Voor de toepassing van de bepalingen in dit hoofdstuk, ten aanzien van de arbeidsduur, wordt voor
      het bepalen van het aantal uren dat arbeid wordt verricht, meegeteld de uren waarop de ambtenaar
      de arbeid zou hebben verricht, maar deze uren in het kader van de medezeggenschap als bedoeld
      in [artikel 17 van het Besluit medezeggenschap defensie][ref1], ziekte, verlof als bedoeld in de
      [artikelen 32][ref2], [40][ref3], [42 tot en met 45][ref4] en [47][ref5], studieverlof als bedoeld in
      [artikel 3 van de Studiefaciliteitenregeling burgerlijke ambtenaren defensie][ref6], of de vervulling van door wet
      of overheid opgelegde verplichting welke niet in zijn vrije tijd kon geschieden, niet heeft verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0010617#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0006040#Artikel40
      [ref4]: https://wetten.overheid.nl/BWBR0006040#Artikel42
      [ref5]: https://wetten.overheid.nl/BWBR0006040#Artikel47
      [ref6]: https://wetten.overheid.nl/BWBR0043998#Artikel3
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30f
    references:
      - id: ref1
        bwb_id: BWBR0010617
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: '32'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0006040
        artikel: '40'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0006040
        artikel: '42'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0006040
        artikel: '47'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0043998
        artikel: '3'
  - number: 30g
    text: |-
      Voor de toepassing van de bepalingen in dit hoofdstuk ten aanzien van de zondag, vindt voor de ambtenaar, die in
      verband met zijn godsdienstige of levensbeschouwelijke opvatting, de wekelijkse rustdag op een andere dag dan de
      zondag viert, overeenkomstige toepassing ten aanzien van die dag in plaats van ten aanzien van de zondag, indien
      die ambtenaar dit schriftelijk verzoekt.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30g
  - number: 30h.1
    text: |-
      Indien uit arbeidsgezondheidskundig onderzoek blijkt, dat de gezondheidsproblemen van een ambtenaar voortvloeien
      uit het verrichten van nachtdiensten, dan wordt de arbeid van die ambtenaar binnen redelijke termijn zodanig
      ingericht, dat hij arbeid verricht anders dan in nachtdienst.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30h
  - number: 30h.2
    text: |-
      De commandant voldoet aan de voor hem uit het eerste lid voortvloeiende verplichting, tenzij hij aannemelijk maakt
      dat dit redelijkerwijs niet van hem kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30h
  - number: 30i.1
    text: 'Dit hoofdstuk en de daarop berustende bepalingen zijn niet van toepassing op arbeid verricht:'
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30i
  - number: 30i.1.a
    text: |-
      ten tijde van buitengewone omstandigheden, alsmede ten aanzien van een onderdeel van de krijgsmacht, waaraan de
      mededeling bedoeld in [artikel 71 van het Wetboek van Militair Strafrecht][ref1] is gedaan;


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel71
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30i
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '71'
  - number: 30i.1.b
    text: |-
      ter uitvoering van bij wet of daarop berustende bepalingen opgedragen taken, voor zover de toepassing van dit
      hoofdstuk en de daarop berustende bepalingen een goede taakuitoefening belemmert;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30i
  - number: 30i.1.c
    text: in door Onze Minister te bepalen andere gevallen waarin onderdelen van de krijgsmacht worden ingezet;
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30i
  - number: 30i.1.d
    text: inzake aangelegenheden die rechtstreeks betrekking hebben op de omstandigheden, bedoeld onder a, b, en c.
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30i
  - number: 30i.2
    text: |-
      Dit hoofdstuk en de daarop berustende bepalingen zijn, met uitzondering van [paragraaf 11][ref1], niet van
      toepassing op arbeid verricht:


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0006040/2023-07-01#Artikel30i
    references:
      - id: ref1
        bwb_id: BWBR0006040
        hoofdstuk: '4'
        paragraaf: '11'
  - number: 30i.2.a
