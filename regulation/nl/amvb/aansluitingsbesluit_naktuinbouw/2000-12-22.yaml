preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Minister van Landbouw en Visserij van 15 februari 1967, no. J. 505, Directie Juridische
    en Bedrijfsorganisatorische Zaken;

    Gelet op artikel 87, eerste lid, van de Zaaizaad- en Plantgoedwet;

    De Raad van State gehoord (advies van 8 maart 1967, no. 50);

    Gezien het nader rapport van Onze voornoemde Minister van 29 maart 1967, no. J. 809, Directie Juridische en
    Bedrijfsorganisatorische Zaken.

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002566/2000-12-22#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Het bedrijfsmatig voortbrengen en bewerken van teeltmateriaal van de in het tweede lid genoemde gewassen, anders
      dan voor gebruik in eigen bedrijf, alsmede het doen verrichten van deze handelingen, is slechts toegestaan aan hem,
      die is aangesloten bij de Stichting Nederlandse Algemene Kwaliteitsdienst Tuinbouw, gevestigd te Roelofarendsveen.
    url: https://wetten.overheid.nl/BWBR0002566/2000-12-22#Artikel1
  - number: '1.2'
    text: 'De in het eerste lid bedoelde gewassen zijn:'
    url: https://wetten.overheid.nl/BWBR0002566/2000-12-22#Artikel1
  - number: 1.2.a
    text: alle fruitgewassen;
    url: https://wetten.overheid.nl/BWBR0002566/2000-12-22#Artikel1
  - number: 1.2.b
    text: alle bosbouwgewassen;
    url: https://wetten.overheid.nl/BWBR0002566/2000-12-22#Artikel1
  - number: 1.2.c
    text: alle laan-, park- en sierbomen;
    url: https://wetten.overheid.nl/BWBR0002566/2000-12-22#Artikel1
  - number: 1.2.d
    text: alle overige winterharde of halfwinterharde houtige gewassen;
    url: https://wetten.overheid.nl/BWBR0002566/2000-12-22#Artikel1
  - number: 1.2.e
    text: alle vaste planten;
    url: https://wetten.overheid.nl/BWBR0002566/2000-12-22#Artikel1
  - number: 1.2.f
    text: |-
      alle kruidachtige bloemgewassen, die in aanmerking komen om uitsluitend of overwegend
      voor sierdoeleinden te worden geteeld, met uitzondering van bloembollen als bedoeld in
      [artikel 1 van het Landbouwkwaliteitsbesluit bloembollen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003358#Artikel1
    url: https://wetten.overheid.nl/BWBR0002566/2000-12-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003358
        artikel: '1'
  - number: 1.2.g
    text: |-
      alle kruidachtige en houtige gewassen, welke in aanmerking komen om uitsluitend of overwegend te worden geteeld
      als kamerplant;
    url: https://wetten.overheid.nl/BWBR0002566/2000-12-22#Artikel1
  - number: 1.2.h
    text: roos (Rosa L.);
    url: https://wetten.overheid.nl/BWBR0002566/2000-12-22#Artikel1
  - number: 1.2.i
    text: |-
      de groentegewassen Sjalot (Allium ascalonicum L.), Ui (Allium cepa L.), Stengelui (Allium fistulosum L.), Prei
      (Allium porrum L.), Knoflook (Allium sativum L.), Kervel (Anthriscus cerefolium (L.) Hoffm.), Bladselderij,
      Knolselderij (Apium graveolens L.), Asperge (Asparagus officinalis L.), Snijbiet (Beta vulgaris L. var. vulgaris),
      Rode Biet (Kroot) (Beta vulgaris L. var. conditiva Alef), Bladmosterd, Amsoi (Brassica juncea (L.) Czern. et Coss.
      (partim)), Koolraap (Brassica napus L. var. napobrassica (L.) chb.), Boerenkool (Brassica oleracea L. convar.
      acephala (DC.) Alef. var. sabellica L.), Bloemkool (Brassica oleracea L. convar. botrytis (L.) Alef. var. botrytis
      L.), Broccoli (Brassica oleracea L. convar. botrytis (L.) Alef. var. ymosa Duch.), Spruitkool (Brassica oleracea
      L. convar. oleracea var. gemmifera DC.), Savooiekool (Brassica oleracea L. convar. capitata (L.) Alef. var. sabauda
      L.), Witte kool (Brassica oleracea L. convar. capitata (L.) Alef. var. alba DC.), Rode kool (Brassica oleracea
      L. convar. capitata (L.) Alef. var. rubra DC.), Koolrabi (Brassica oleracea L. convar. acephala (DC.) Alef.
      var. gongylodes), Chinese kool (Brassica pekinensis (Lour.) Rupr.), Meiraap, Herfstraap (Brassica rapa L. var.
      rapa), Paprika, Spaanse peper (Capsicum annuum L.), Andijvie, Krulandijvie (Cichorium endivia L.), Bladcichorei
      (Groenlof, Radicchio), Witlof (Cichorium intybus L. (partim)), Watermeloen (Citrullus lanatus (Thunb.) Matsum. et
      Nakai), Meloen (Cucumis melo L.), Augurk, Komkommer (Cucumis sativus L.), Reuzenpompoen (Cucurbita maxima Duch.),
      Courgette, Patisson (Cucurbita pepo L.), Kardoen (Cynara cardunculus L.), Artisjok (Cynara scolymus L.), Wortel
      (Daucus carota L.), Venkel (Foeniculum vulgare Miller), Sla (Lactuca sativa L.), Tuinkers (Lepidium sativum L.),
      Tomaat (Lycopersicon lycopersicum (L.) Karsten ex Farw.), Pastinaak (Pastinaca sativa L. var. hortensis (Miller)
      Ehrh.), Peterselie (Petroselinum crispum (Miller) Nyman ex. A.W. Hill), Pronkboon (Phaseolus coccineus L.),
      Stamslaboon, Stamsnijboon, Stokslaboon, Stoksnijboon (Phaseolus vulgaris L.), Kreukzadige erwt en Rondzadige erwt
      voor zover het rassen betreft die in aanmerking komen om overwegend te worden geteeld om vers te worden geoogst
      voor menselijke consumptie en Peul (Pisum sativum L. (partim)), Postelein (Portulaca oleracea L.), Radijs, Ramenas
      (Raphanus sativus L. (partim)), Rabarber (Rheum L.), Schorseneer (Scorzonera hispanica L.), Aubergine (Solanum
      melongena L.), Spinazie (Spinacia oleracea L.), Veldsla (Valerianella locusta (L.) Laterr.), Tuinboon (Vicia
      faba L. (partim)), Pofmaïs, Popcorn (Zea mays L. convar. microsperma (Koern.)), Suikermaïs (Zea mays L. convar.
      saccharata (Koern.));
    url: https://wetten.overheid.nl/BWBR0002566/2000-12-22#Artikel1
  - number: 1.2.j
    text: Cichorei voor de industrie (Cichorium intybus L. (partim));
    url: https://wetten.overheid.nl/BWBR0002566/2000-12-22#Artikel1
  - number: 1.2.k
    text: alle specerijgewassen, geneeskrachtige en aromatische kruiden;
    url: https://wetten.overheid.nl/BWBR0002566/2000-12-22#Artikel1
  - number: 1.2.l
    text: aardbei (Fragaria L.).
    url: https://wetten.overheid.nl/BWBR0002566/2000-12-22#Artikel1
  - number: '1.3'
    text: |-
      Onder het bewerken van teeltmateriaal, als bedoeld in het eerste lid, wordt verstaan het beïnvloeden van de
      hoedanigheid en de kwaliteit van het teeltmateriaal zoals het bewortelen van stekken en het eesten van zaden.
    url: https://wetten.overheid.nl/BWBR0002566/2000-12-22#Artikel1
  - number: '2.1'
    text: 'Dit besluit wordt aangehaald als: Aansluitingsbesluit Naktuinbouw.'
    url: https://wetten.overheid.nl/BWBR0002566/2000-12-22#Artikel2
  - number: '2.2'
    text: |-
      Het treedt in werking met ingang van het tijdstip, waarop de [Zaaizaad- en Plantgoedwet][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0002541
    url: https://wetten.overheid.nl/BWBR0002566/2000-12-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002541
