preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Economische Zaken van 26 oktober 2015, nr. 15147184;

    Gelet op verordening (EU) nr. 1143/2014 van het Europees Parlement en de Raad van 22 oktober 2014 betreffende de
    preventie en beheersing van de introductie en verspreiding van invasieve uitheemse soorten (PbEU 2014, L 317);

    Gelet op de artikelen 14, tweede en derde lid, en 18, eerste lid, van de Flora- en faunawet;

    De Afdeling advisering van de Raad van State gehoord (advies van 18 december 2015, nr. W15.15.0377/IV);

    Gezien het nader rapport van de Staatssecretaris van Economische Zaken van 22 februari 2016, nr. 16012211;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0037731/2016-03-18#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: - *vergunning:* vergunning als bedoeld in artikel 8, eerste lid,
      onderscheidenlijk 9, eerste lid, van verordening (EU) nr. 1143/2014;
        - *verordening (EU) nr. 1143/2014:* verordening (EU) nr. 1143/2014 van het Europees Parlement en de Raad van 22
      oktober 2014 betreffende de preventie en beheersing van de introductie en verspreiding van invasieve uitheemse
      soorten (PbEU 2014, L 317);
        - *wet:* [Flora- en faunawet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009640
    url: https://wetten.overheid.nl/BWBR0037731/2016-03-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009640
  - number: '2.1'
    text: |-
      Het is verboden handelingen als bedoeld in artikel 7, eerste lid, onderdelen e en h, van verordening (EU) nr.
      1143/2014 te verrichten.
    url: https://wetten.overheid.nl/BWBR0037731/2016-03-18#Artikel2
  - number: '2.2'
    text: |-
      Het is verboden zonder vergunning handelingen als bedoeld in artikel 7, eerste lid, onderdelen a, b, c, d, f en g,
      van verordening (EU) nr. 1143/2014 te verrichten.
    url: https://wetten.overheid.nl/BWBR0037731/2016-03-18#Artikel2
  - number: '2.3'
    text: |-
      De verboden, bedoeld in het eerste en tweede lid, zijn niet van toepassing in de gevallen en onder de voorwaarden,
      bedoeld in de artikelen 31, eerste lid, en 32, eerste lid, van verordening (EU) nr. 1143/2014, en het vierde lid.
    url: https://wetten.overheid.nl/BWBR0037731/2016-03-18#Artikel2
  - number: '2.4'
    text: |-
      Ingeval de Amerikaanse voseekhoorn (Sciurus niger), de grijze eekhoorn (Sciurus carolinensis) of de Pallas’
      eekhoorn (Callosciurus erythraeus) als soort is opgenomen op de lijst, bedoeld in artikel 4, eerste lid, van
      verordening (EU) nr. 1143/2014, geldt in aanvulling op de voorwaarden, bedoeld in artikel 31, eerste lid, van
      die verordening, de voorwaarde dat de houder van dieren van de betrokken soort aantoonbaar heeft voldaan aan
      [artikel 8a, tweede, derde en vierde lid, van het Besluit vrijstelling beschermde dier- en plantensoorten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011853#Artikel8a
    url: https://wetten.overheid.nl/BWBR0037731/2016-03-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011853
        artikel: 8a
  - number: '3.1'
    text: Vergunningen worden verleend door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0037731/2016-03-18#Artikel3
  - number: '3.2'
    text: |-
      Onze Minister is bevoegd een vergunning op elk moment voorlopig of definitief in te trekken, indien zich
      onvoorziene gebeurtenissen voordoen waarvan de gevolgen voor de biodiversiteit of aanverwante ecosysteemdiensten
      nadelig zijn.
    url: https://wetten.overheid.nl/BWBR0037731/2016-03-18#Artikel3
  - number: '3.3'
    text: |-
      Onverminderd het tweede lid, kan Onze Minister een vergunning intrekken in de gevallen, bedoeld in
      [artikel 80 van de Flora- en faunawet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel80
    url: https://wetten.overheid.nl/BWBR0037731/2016-03-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '80'
  - number: '4'
    text: |-
      Onze Minister beslist tot het nemen van onmiddellijke noodmaatregelen als bedoeld in artikel 10, eerste lid, van
      de verordening, wanneer op basis van voorlopig wetenschappelijk bewijs is vastgesteld dat de soort waarschijnlijk
      voldoet aan de criteria van artikel 4, derde lid, van verordening (EU) nr. 1143/2014.
    url: https://wetten.overheid.nl/BWBR0037731/2016-03-18#Artikel4
  - number: '5.1'
    text: |-
      Onverminderd [artikel 67 van de Flora- en faunawet][ref1] en [artikel 3.2a van de Waterwet][ref2] worden de
      uitroeiingsmaatregelen, bedoeld in artikel 17, eerste lid, van verordening (EU) nr. 1143/2014, uitgevoerd door
      Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel3
    url: https://wetten.overheid.nl/BWBR0037731/2016-03-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '67'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '3'
  - number: '5.2'
    text: |-
      [Artikel 67, vijfde lid, van de Flora- en faunawet][ref1] is in geval van uitvoering door Onze Minister van de in
      het eerste lid bedoelde maatregelen van overeenkomstige toepassing, met dien verstande dat de in dat artikellid
      genoemde bevoegdheden door Onze Minister worden uitgevoerd in plaats van door gedeputeerde staten en ook betrekking
      kunnen hebben op planten, schimmels en micro-organismen.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel67
    url: https://wetten.overheid.nl/BWBR0037731/2016-03-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '67'
  - number: '7'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0037731/2016-03-18#Artikel7
  - number: '8'
    text: 'Dit besluit wordt aangehaald als: Besluit uitvoering Europese exotenverordening.'
    url: https://wetten.overheid.nl/BWBR0037731/2016-03-18#Artikel8
