preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Economische Zaken van 28 november 1996, nr. 96075293 WJA/W;


    Gelet op richtlijn nr. 96/57/EG van het Europees Parlement en de Raad van de Europese Unie van 3 september
    1996 betreffende normen voor de energie-efficiëntie van huishoudelijke elektrische koelkasten, diepvriezers en
    combinaties daarvan (PbEG L 236) en de artikelen 2, 6 en 21 van de Wet energiebesparing toestellen;


    De Raad van State gehoord (advies van 3 februari 1997, nr. W10.96.0566);


    Gezien het nader rapport van Onze Minister van Economische Zaken van 17 juni 1997, nr. 97036635 WJA/W;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008756/1999-09-04#ArtikelAanhef
articles:
  - number: '1'
    text: >-
      In dit besluit wordt verstaan onder:


      a. richtlijn: [richtlijn nr. 96/57/EG](31996L0057) van het Europees Parlement en de Raad van de Europese Unie
      van 3 september 1996 betreffende normen voor de energie-efficiëntie van huishoudelijke elektrische koelkasten,
      diepvriezers en combinaties daarvan (*PbEG* L 236);


      b. koel- en vriesapparatuur: nieuwe huishoudelijke koelkasten, bewaarruimten voor bevroren levensmiddelen,
      diepvriezers en combinaties daarvan, zoals omschreven in bijlage I van de richtlijn, die op het elektrische net
      kunnen worden aangesloten;


      c. leverancier: de fabrikant, zijn gemachtigde gevestigd in de gebieden waarop de Overeenkomst betreffende de
      Europese Economische Ruimte van toepassing is en degene die de desbetreffende apparatuur in die gebieden in de
      handel brengt;


      d. CE-markering: de markering, bedoeld in bijlage III van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0008756/1999-09-04#Artikel1
  - number: '2'
    text: >-
      Dit besluit is niet van toepassing op:


      a. koel- en vriesapparatuur die ook kan werken op andere energiebronnen dan het elektrische net;


      b. koel- en vriesapparatuur waarvan de werking op het absorptieprincipe is gebaseerd;


      c. koel- en vriesapparatuur die volgens bijzondere specificaties wordt vervaardigd.
    url: https://wetten.overheid.nl/BWBR0008756/1999-09-04#Artikel2
  - number: '3'
    text: >-
      1 De fabrikant van koel- en vriesapparatuur:


      a. brengt op ieder door hem vervaardigd apparaat de CE-markering aan;


      b. stelt een schriftelijke verklaring van overeenstemming op als bedoeld in bijlage II, punt 1, van de richtlijn;


      c. stelt technische documentatie samen als bedoeld in bijlage II, punten 3 en 4, van de richtlijn en draagt zorg
      voor de juistheid van die documentatie.


      2 De CE-markering wordt zichtbaar, leesbaar en onuitwisbaar op de koel- en vriesapparatuur en, in voorkomend geval,
      op de verpakking aangebracht. Op apparaten, verpakkingen, gebruiksaanwijzingen of andere documenten mogen andere
      markeringen worden aangebracht, mits daardoor de zichtbaarheid en leesbaarheid van de CE-markering niet wordt
      verminderd.
    url: https://wetten.overheid.nl/BWBR0008756/1999-09-04#Artikel3
  - number: '4'
    text: |-
      1 De leverancier van koel- en vriesapparatuur houdt de schriftelijke verklaring van overeenstemming en
      de technische documentatie, bedoeld in [artikel 3, eerste lid, onder b en c][ref1], beschikbaar voor
      inspectiedoeleinden gedurende ten minste drie jaar na vervaardiging van het desbetreffende type van het
      desbetreffende apparaat.

      2 Zodra aan de op grond van het eerste lid op de leverancier rustende verplichting is voldaan door een van degenen,
      die ingevolge [artikel 1, onder c][ref2], als zodanig wordt beschouwd, is de verplichting van de anderen opgeheven.


      [ref1]: https://wetten.overheid.nl/BWBR0008756#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008756#Artikel1
    url: https://wetten.overheid.nl/BWBR0008756/1999-09-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008756
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0008756
        artikel: '1'
  - number: '5'
    text: >-
      Koel- en vriesapparatuur die van een CE-markering is voorzien wordt vermoed te voldoen aan de bij dit besluit
      gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0008756/1999-09-04#Artikel5
  - number: '6'
    text: |-
      1 Het is de leverancier verboden koel- en vriesapparatuur in de handel te brengen:

      a. die niet voldoet aan de in bijlage I van de richtlijn gestelde eisen met betrekking tot het ten hoogste
      toegelaten elektriciteitsverbruik;

      b. die niet is voorzien van een CE-markering die voldoet aan de in [artikel 3, tweede lid][ref1], gestelde eisen.

      2 Het is de leverancier verboden koel- en vriesapparatuur in de handel te brengen waarop markeringen zijn
      aangebracht die derden kunnen misleiden omtrent de betekenis en de grafische vorm van de CE-markering.


      [ref1]: https://wetten.overheid.nl/BWBR0008756#Artikel3
    url: https://wetten.overheid.nl/BWBR0008756/1999-09-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008756
        artikel: '3'
  - number: '7'
    text: >-
      1 Indien Onze Minister van oordeel is dat een CE-markering ten onrechte op koel- en vriesapparatuur is aangebracht,
      neemt hij de nodige maatregelen om die apparatuur uit de handel te nemen.


      2 Onze Minister stelt de Commissie van de Europese Gemeenschappen onmiddellijk onder opgave van redenen in kennis
      van maatregelen als bedoeld in het eerste lid.


      3 De leverancier verleent alle noodzakelijke medewerking aan maatregelen als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008756/1999-09-04#Artikel7
  - number: '8'
    text: >-
      1 Voor zover in dit besluit wordt verwezen naar de richtlijn of een daarbij behorende bijlage treedt voor de
      toepassing van de desbetreffende bepaling een wijziging van de richtlijn of een daarbij behorende bijlage in
      werking met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uiterlijk uitvoering moet zijn gegeven.


      2 Onze Minister van Economische Zaken doet mededeling van een wijziging als bedoeld in het eerste lid in de
      *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0008756/1999-09-04#Artikel8
  - number: '9'
    text: Dit besluit treedt in werking met ingang van 4 september 1999.
    url: https://wetten.overheid.nl/BWBR0008756/1999-09-04#Artikel9
  - number: '10'
    text: 'Dit besluit wordt aangehaald als: Besluit energie-efficiëntienormen koel- en vriesapparatuur.'
    url: https://wetten.overheid.nl/BWBR0008756/1999-09-04#Artikel10
