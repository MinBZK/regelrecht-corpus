  - number: '3'
    text: |-
      1 De [artikelen 50 tot en met 56 van de wet][ref1] zijn niet van toepassing op:

      a. farmaceutische zorg:

      1°. anders dan advies of begeleiding ten behoeve van medicatiebeoordeling en verantwoord gebruik van UR-
      geneesmiddelen als bedoeld in [artikel 1, eerste lid, onder s, van de Geneesmiddelenwet][ref2] of de
      terhandstelling van die geneesmiddelen,

      2°. waarop de Wet inzake bloedtransfusie van toepassing is;

      b. zorg waarvoor subsidie wordt verleend door:

      1. Onze Minister op grond van een regeling als bedoeld in [artikel 3 van de Kaderwet VWS-subsidies][ref3];

      2. het Zorginstituut op grond van [artikel 10.1.3][ref4], [10.1.4][ref5], [11.1.5][ref6] of
      [11.5.1 van de Wet langdurige zorg][ref7];

      c. de vaccinatie ten behoeve van de preventie van influenza;

      d. hulpmiddelenzorg;

      e. vervoer;

      f.

      g. woningaanpassingen als bedoeld in [artikel 3.1.3 van de Wet langdurige zorg][ref8];

      h. orthoptie;

      i. podotherapie;

      j.

      k. huidtherapie;

      l. optometrie;

      m. zorg die ten laste van een persoonsgebonden budget als bedoeld in
      [artikel 3.3.3 van de Wet langdurige zorg][ref9] wordt gefinancierd;

      n. zorg die wordt bekostigd op grond van [artikel 70a van de Zorgverzekeringswet][ref10];

      o. verblijf als bedoeld in [artikel 2.12, eerste lid, van het Besluit Zorgverzekering][ref11] buiten een ziekenhuis
      dat noodzakelijk is in verband met geneeskundige zorg zoals medisch specialisten die plegen te bieden en dat niet
      gepaard gaat met verpleging, verzorging of paramedische zorg;

      p. levering van elektriciteit voor mechanische ademhalingsondersteuning in de thuissituatie.

      2 De [artikelen 50 tot en met 56 van de wet][ref12] zijn, in afwijking van het eerste lid, van toepassing op:

      a. zorg die een vorm van zorg betreft als bedoeld in het eerste lid, onderdeel h, i, k of l en geleverd wordt door
      of vanwege een instelling in de zin van de [Wet toelating zorginstellingen][ref13];

      b. zorg die een vorm van zorg betreft als bedoeld in het eerste lid, onderdeel h, i, k of l en deel uitmaakt van
      een prestatie of geheel van prestaties waarvoor een tarief in rekening wordt gebracht;

      c. vervoer als bedoeld in [artikel 3.1.1, eerste lid, onderdeel f, van de Wet langdurige zorg][ref14] dat geleverd
      wordt door of vanwege een instelling in de zin van de Wet toelating zorginstellingen;

      d. vervoer als bedoeld in [artikel 3.1.1, eerste lid, onderdeel f, van de Wet langdurige zorg][ref15] dat deel
      uitmaakt van een prestatie of geheel van prestaties waarvoor een tarief in rekening wordt gebracht, en

      e. vervoer als bedoeld in [artikel 2.13 van het Besluit zorgverzekering][ref16] door of vanwege een Regionale
      Ambulancevoorziening dat in Nederland aanvangt en eindigt of dat bestaat uit spoedeisend grensoverschrijdend
      vervoer vanaf of naar de Belgische of Duitse grens.


