      1 De [artikelen 50 tot en met 56 van de wet][ref1] zijn niet van toepassing op zorg verleend onder eigen
      verantwoordelijkheid door verpleegkundigen en verzorgenden in de individuele gezondheidszorg.

      2 In afwijking van het eerste lid zijn de [artikelen 50 tot en met 56 van de wet][ref2] van toepassing indien
      de zorg, verleend onder eigen verantwoordelijkheid door verpleegkundigen en verzorgenden in de individuele
      gezondheidszorg, zorg is als omschreven in [artikel 2.10 van het Besluit zorgverzekering][ref3].


