  - number: 5a
    text: |-
      De [artikelen 40a][ref1] en [40b van de wet][ref2] zijn niet van toepassing op:

      a. zorgaanbieders en geen rechtspersoonlijkheid bezittende organisatorische verbanden van zorgaanbieders
      die uitsluitend zorg verlenen anders dan zorg en overige diensten die behoren tot het op grond van de
      [Wet langdurige zorg][ref3] verzekerde pakket, bedoeld in [artikel 3.1.1 van die wet][ref4] of onderdeel uitmaken
      van de zorgplicht van de zorgverzekeraar, bedoeld in [artikel 11, eerste lid, van de Zorgverzekeringswet][ref5], en
      waarvoor Onze Minister geen subsidie verleent;

      b. zorgaanbieders en geen rechtspersoonlijkheid bezittende organisatorische verbanden van zorgaanbieders die
      uitsluitend de volgende zorg verlenen:

      1° vervoer als bedoeld in [artikel 3.1.1, eerste lid, onderdeel f, van de Wet langdurige zorg][ref6];

      2° vervoer als bedoeld in [artikel 2.5, eerste lid, onderdeel e][ref7], [artikel 2.14][ref8] of
      [artikel 2.15 van het Besluit zorgverzekering][ref9];

      3° schoonhouden van de woonruimte als bedoeld in
      [artikel 3.1.1, eerste lid, onderdeel a, onder 2°, van de Wet langdurige zorg][ref10];

      4° leveren van roerende voorzieningen of mobiliteitshulpmiddelen als bedoeld in
      __REF000___________________________________________________________________________________________________________
      __;

      5° verstrekken van eten en drinken als bedoeld in
      [artikel 3.1.1, eerste lid, onderdeel a, onder 1°, van de Wet langdurige zorg][ref12];

      6°. verblijf als bedoeld in [artikel 2.12, eerste lid, van het Besluit Zorgverzekering][ref13] dat noodzakelijk
      is in verband met geneeskundige zorg zoals medisch specialisten die plegen te bieden en dat niet gepaard gaat met
      verpleging, verzorging of paramedische zorg;

      7°. levering van elektriciteit voor mechanische ademhalingsondersteuning in de thuissituatie;

      c. zorgaanbieders als bedoeld in [artikel 1, eerste lid, onderdeel c, onder 2°, van de wet][ref14];

      d. natuurlijke personen die geen zorg doen verlenen;

      e. natuurlijke personen en rechtspersonen voor zover zij zorg doen verlenen in het kader van een maatschap of
      vennootschap waarvan zij vennoot zijn.


