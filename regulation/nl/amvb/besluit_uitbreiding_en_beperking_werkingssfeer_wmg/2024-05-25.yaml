  - number: '4'
    text: |-
      1 De [artikelen 50 tot en met 56 van de wet][ref1] zijn niet van toepassing op zorg voorzover verleend onder eigen
      verantwoordelijkheid door:

      a. radiodiagnostisch laboranten;

      b. radiotherapeutisch laboranten.

      2 De [artikelen 50 tot en met 56 van de wet][ref2] zijn wel van toepassing indien de zorg, bedoeld in het eerste
      lid, geleverd wordt door of vanwege een instelling in de zin van de [Wet toelating zorginstellingen][ref3] of deel
      uitmaakt van een prestatie of geheel van prestaties waarvoor een tarief in rekening wordt gebracht.


