    text: |-
      In dit besluit wordt verstaan onder wet: [Wet marktordening gezondheidszorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020078
    url: https://wetten.overheid.nl/BWBR0020326/2024-05-25#Artikel1
