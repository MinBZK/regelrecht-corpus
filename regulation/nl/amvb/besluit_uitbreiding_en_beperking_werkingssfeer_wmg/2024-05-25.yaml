        bwb_id: BWBR0020078
  - number: '2'
    text: |-
      1 Als zorg in de zin van de [wet][ref1] worden aangewezen de werkzaamheden van:

      a. de Stichting Beroeps Opleiding Huisartsen, voor zover het betreft de toepassing van
      [artikel 56a van de wet][ref2] ten behoeve van de opleiding tot huisarts, specialist ouderengeneeskunde,
      verslavingsarts en arts voor verstandelijk gehandicapten;

      b. instellingen waarvan de werkzaamheden zijn gericht op donatie of transplantatie van weefsel of organen;

      c. personen ingeschreven in een register als bedoeld in
      [artikel 3 van de Wet op de beroepen in de individuele gezondheidszorg][ref3] of door personen als bedoeld in
      [artikel 34 van die wet][ref4], voor zover het betreft werkzaamheden in het kader van hun beroepsuitoefening
      met uitzondering van bedrijfsgeneeskundige zorg of verzekeringsgeneeskundige zorg, al dan niet onder eigen
      verantwoordelijkheid uitgevoerd, en die niet zijn begrepen onder [artikel 1, onder b, van de wet][ref5];

      d. de Stichting Beroepsopleiding tot Sportarts, voor zover het betreft de toepassing van
      [artikel 56a van de wet][ref6] ten behoeve van de opleiding tot sportarts.

      2 Als zorg in de zin van de wet wordt tevens aangewezen werkzaamheden in het kader van de verlening van zorg die
      krachtens [artikel 1.1, tweede lid, van de Wet forensische zorg][ref7] in of krachtens een algemene maatregel van
      bestuur als forensische zorg is aangemerkt.


