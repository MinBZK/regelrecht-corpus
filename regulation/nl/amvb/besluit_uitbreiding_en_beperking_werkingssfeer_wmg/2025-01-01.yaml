      [Artikel 3, vierde lid][ref1], [34][ref2], [38, eerste en derde tot en met zevende lid][ref3], en
      [40 tot en met 43 van de wet][ref4] zijn niet van toepassing op forensische zorg als bedoeld in
      [artikel 1.1, tweede lid, van de Wet forensische zorg][ref5] of forensische zorg als aangemerkt in of krachtens een
      algemene maatregel van bestuur».


