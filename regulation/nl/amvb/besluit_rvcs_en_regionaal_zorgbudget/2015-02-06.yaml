  - number: '2'
    text: |-
      1 Een regionale verwijzingscommissie bestaat uit een voorzitter, die tevens lid is, en ten minste twee andere
      leden. Tot de leden behoren in ieder geval een diagnostisch geschoold psycholoog of diagnostisch geschoold
      orthopedagoog en een deskundige op het terrein van v.b.o., m.a.v.o. en v.m.b.o..

      2 De leden van een regionale verwijzingscommissie behoren niet tot het bevoegd gezag van een school voor
      praktijkonderwijs of van een school waaraan leerwegondersteunend onderwijs wordt verzorgd waarvoor de commissie
      beschikkingen opstelt en zijn niet werkzaam bij of voor een dergelijke school.

      3 Een regionale verwijzingscommissie wordt bijgestaan door een secretaris.
    url: https://wetten.overheid.nl/BWBR0015137/2015-02-06#Artikel2
  - number: '3'
    text: |-
      1 Het bevoegd gezag dient de aanvraag voor indicatiestelling voor een leerling die rechtstreeks
      afkomstig is van een school of instelling als bedoeld in de [Wet op het primair onderwijs][ref1] of de
      [Wet op de expertisecentra][ref2] of van het eerste leerjaar van een school voor voortgezet onderwijs in bij de
      regionale verwijzingscommissie die werkzaam is voor het samenwerkingsverband waarvan de school deel uitmaakt.

      2 Het bevoegd gezag maakt bij de aanvraag gebruik van een door de regionale verwijzingscommissie ter beschikking
      gesteld aanmeldingsformulier en voegt bij de aanvraag een leerling-dossier.

      3 Het bevoegd gezag verstrekt een afschrift van het bij de regionale verwijzingscommissie ingediende
      aanmeldingsformulier en een mondelinge toelichting daarop aan de ouders van de leerling.

      4 Bij de samenstelling van het leerling-dossier hanteert het bevoegd gezag voor de gegevens, bedoeld in
      [artikel 4, eerste lid, onderdelen b tot en met d][ref3], de jaarlijks voor 1 oktober bij ministeriële regeling op
      voorstel van de voorzitters van de regionale verwijzingscommissies vastgestelde screenings- of testinstrumenten.
      De testinstrumenten voor de gegevens, bedoeld in [artikel 4, eerste lid, onderdelen c en d][ref4], worden toegepast
      onder verantwoordelijkheid van een diagnostisch geschoold psycholoog of diagnostisch geschoold orthopedagoog.

      5 De regionale verwijzingscommissie deelt binnen twee weken na ontvangst van de aanvraag schriftelijk aan het
      bevoegd gezag mee of de aanvraag volledig is. Bij de beoordeling of de aanvraag volledig is, wordt de vraag
      betrokken of de school de in het vierde lid bedoelde screenings- en testinstrumenten heeft toegepast.

      6 Indien het leerling-dossier niet volledig is, vermeldt de regionale verwijzingscommissie in de mededeling,
      bedoeld in het vijfde lid, welke gegevens ontbreken en stelt zij het bevoegd gezag eenmaal in de gelegenheid het
      leerling-dossier binnen een in de mededeling genoemde termijn te completeren. Voor aanvragen die betrekking hebben
      op leerlingen die vanuit het primair onderwijs of het speciaal of voortgezet speciaal onderwijs instromen in het
      eerste leerjaar van het voortgezet onderwijs en welke aanvragen zijn ontvangen in de periode vanaf 1 september
      tot 1 oktober, is de in de eerste volzin bedoelde termijn één week na ontvangst van de mededeling, bedoeld in het
      vijfde lid.

      7 Indien het leerling-dossier volledig is, registreert de regionale verwijzingscommissie de voor de
      indicatiestelling relevante gegevens.

      8 Voor het afgeven van een beschikking omtrent de indicatiestelling wordt het leerling-dossier beoordeeld door ten
      minste drie leden van de regionale verwijzingscommissie.

      9 Het bevoegd gezag verstrekt onverwijld een afschrift van de beschikking, bedoeld
      in [artikel 10e, vierde lid, eerste volzin, en vijfde lid, eerste volzin][ref5], en
      [artikel 10g, tweede lid, eerste volzin, en zevende lid, tweede volzin, van de wet][ref6] en het advies, bedoeld in
      [artikel 10e, vierde lid, derde volzin][ref7], juncto [artikel 10g, zevende lid, eerste volzin, van de wet][ref8],
      alsmede een mondelinge toelichting op de beschikking en het advies aan de ouders van de leerling.

      10 De regionale verwijzingscommissie zendt nadat de beschikking op de aanvraag is gegeven en aan de
      informatieplicht jegens de inspectie van het onderwijs is voldaan, alle bescheiden die zij ten behoeve van de
      uitoefening van haar taak heeft ontvangen terug aan het desbetreffende bevoegd gezag.


