articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

        - **bevoegd gezag:** bevoegd gezag als bedoeld in [artikel 1 van de wet][ref1];
        - **indicatiestelling:** beoordeling of een leerling toelaatbaar is tot praktijkonderwijs of is aangewezen op
      leerwegondersteunend onderwijs;
        - **intelligentiequotiënt:** quotiënt dat de cognitieve capaciteiten van een leerling uitdrukt, vastgesteld op
      basis van scores op verbaal en op niet-verbaal gebied;
        - **leerachterstand:** achterstand van een leerling in de domeinen technisch lezen, spellen, begrijpend lezen
      en inzichtelijk rekenen, gemeten op basis van didactische leeftijdseenheden (DLE) in relatie tot de didactische
      leeftijd (DL) op het moment van toetsing;
        - **leerling-dossier:** dossier dat over een leerling de gegevens bevat, bedoeld in
      [artikel 4, eerste lid, onderdelen a tot en met e][ref2], of [artikel 4a, vierde lid][ref3];
        - **leerwegondersteunend onderwijs:** onderwijs als bedoeld in [artikel 10e van de wet][ref4];
        - **m.a.v.o.:** middelbaar algemeen voortgezet onderwijs als bedoeld in [artikel 9 van de wet][ref5];
        - **Onze Minister:** Onze Minister van Onderwijs, Cultuur en Wetenschap en, voor wat betreft het onderwijs op het
      gebied van landbouw, natuurlijke omgeving en voedsel, Onze Minister van Economische Zaken;
        - **ouders:** ouders, voogden of verzorgers;
        - **praktijkonderwijs:** onderwijs als bedoeld in [artikel 10f van de wet][ref6];
        - **regionaal zorgbudget:** budget als bedoeld in [artikel 77, vierde lid, van de wet][ref7];
        - **regionale verwijzingscommissie:** regionale verwijzingscommissie als bedoeld in [artikel 10g van de wet][ref8];
        - **samenwerkingsverband:** samenwerkingsverband als bedoeld in [artikel 1 van de wet][ref9];
        - **school:** school of scholengemeenschap als bedoeld in [artikel 10h van de wet][ref10];
        - **sociaal-emotionele problematiek:** problematiek als gevolg van het sociaal-emotioneel functioneren van een
      leerling waardoor het onderwijsleerproces substantieel wordt belemmerd;
        - **v.b.o.:** voorbereidend beroepsonderwijs als bedoeld in [artikel 10a van de wet][ref11];
        - **v.m.b.o.:** voorbereidend middelbaar beroepsonderwijs als bedoeld in [artikel 21 van de wet][ref12], en
        - **wet:** [Wet op het voortgezet onderwijs][ref13].


