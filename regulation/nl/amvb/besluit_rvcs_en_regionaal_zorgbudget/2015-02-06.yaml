  - number: '5'
    text: |-
      1 Voor de werkzaamheden van een regionale verwijzingscommissie verstrekt Onze Minister een subsidie bestaande uit
      een vast bedrag per regionale verwijzingscommissie en een bedrag dat wordt berekend aan de hand van het aantal
      leerlingen. Het vaste bedrag en het bedrag per leerling worden jaarlijks bij ministeriële regeling vastgesteld.

      2 Het in het eerste lid bedoelde aantal leerlingen is het aantal leerlingen, bedoeld in
      [artikel 7 van het Bekostigingsbesluit WVO][ref1], die op 1 oktober voorafgaand aan het kalenderjaar waarvoor de
      subsidie wordt verstrekt, staan ingeschreven voor het derde en vierde leerjaar v.b.o., m.a.v.o. of v.m.b.o. van de
      scholen behorend tot de samenwerkingsverbanden waarvoor de regionale verwijzingscommissie werkzaam is. Een leerling
      telt slechts eenmaal mee bij de berekening van de subsidie.

      3 De op grond van het eerste en tweede lid berekende subsidie wordt in april van het desbetreffende kalenderjaar,
      via de rekening van de schoolbegeleidingsdienst waaraan de regionale verwijzingscommissie is gekoppeld, betaalbaar
      gesteld. Onze Minister verstrekt een voorschot op de subsidie ter grootte van het op grond van het eerste en tweede
      lid berekende bedrag in april van het kalenderjaar waarop de subsidie betrekking heeft.

      4 De regionale verwijzingscommissie zendt Onze Minister voor 1 juli volgend op het kalenderjaar
      waarvoor de subsidie wordt verstrekt een financieel verslag waarin de werkelijke uitgaven worden
      verantwoord. Het financieel verslag gaat vergezeld van een verklaring van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2], waaruit de rechtmatigheid van de
      bestedingen blijkt.

      5 Na de vaststelling van de subsidie worden niet rechtmatig bestede gelden teruggevorderd.

      6 Verrekening van niet bestede gelden en overschotten vindt niet plaats gedurende de doorlopende periode waarin
      Onze Minister een subsidie ten behoeve van de regionale verwijzingscommissie verstrekt. Na afloop van deze periode
      worden niet bestede gelden of overschotten opgenomen in de eindafrekening als schuld aan Onze Minister.


