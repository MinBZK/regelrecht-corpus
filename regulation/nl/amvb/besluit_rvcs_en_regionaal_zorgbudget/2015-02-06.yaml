    Juridische Zaken;

    Gelet op de Wet op het voortgezet onderwijs, artikel VI, derde lid, van de wet van 25 mei 1998, Stb. 337, de
    artikelen 4, derde en vierde lid, 5, vierde lid, en 6, vierde en vijfde lid, van de Les- en cursusgeldwet, de
    artikelen 17, 25, eerste en derde lid, 70, 117, eerste en elfde lid, van de Wet op de expertisecentra, de artikelen
    69, tweede en vierde lid, 120, eerste en tweede lid, 122, eerste en vierde lid, 125, eerste en derde lid, en 186,
    vijfde lid, van de Wet op het primair onderwijs, de Wet geluidhinder, de artikelen 25 en 76, eerste lid, onderdeel
    a, van de Luchtvaartwet, de artikelen 15.13 en 21.8 van de Wet milieubeheer, en de artikelen 8, derde lid, en 22
    van de Financiële-verhoudingswet;

    De Raad van State gehoord (advies van 10 februari 2003, nr. W05.02.0527/III);

    Gezien het nader rapport van Onze Minister van Onderwijs, Cultuur en Wetenschappen van 21 mei 2003, nr.
    WJZ/2003/17516 (3726), directie Wetgeving en Juridische Zaken, mede namens de Staatssecretaris van Landbouw,
