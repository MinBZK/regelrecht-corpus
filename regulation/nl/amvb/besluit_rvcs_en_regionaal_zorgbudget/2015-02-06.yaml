  - number: '9'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen en onderdelen van artikelen verschillend kan worden vastgesteld. Indien het koninklijk besluit dat de
      inwerkingtreding van dit besluit bevat, wordt uitgegeven na 31 juli 2003, kan dat koninklijk besluit bepalen dat
      dit besluit of de verschillende artikelen en onderdelen van artikelen daarvan, in werking treedt met ingang van de
      dag na de datum van uitgifte van het Staatsblad waarin het koninklijk besluit wordt geplaatst, en terugwerkt tot en
      met 1 augustus 2003.
    url: https://wetten.overheid.nl/BWBR0015137/2015-02-06#Artikel9
