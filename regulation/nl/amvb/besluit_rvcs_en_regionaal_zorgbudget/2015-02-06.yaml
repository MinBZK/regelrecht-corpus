  - number: '6'
    text: |-
      Het regionaal zorgbudget wordt berekend door een jaarlijks bij ministeriële regeling te bepalen bedrag te
      vermenigvuldigen met het aantal leerlingen, bedoeld in [artikel 7 van het Bekostigingsbesluit WVO][ref1], dat
      staat ingeschreven op de scholen binnen het samenwerkingsverband. Bij ministeriële regeling kunnen tot 1 januari
      2017 regels worden gesteld voor de berekening van het regionaal zorgbudget, welke regels kunnen afwijken van het
      bepaalde in de eerste volzin. Een leerling telt slechts eenmaal mee voor de berekening van de bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0005672#Artikel7
