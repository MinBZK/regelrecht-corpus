  - number: 3a
    text: |-
      Het samenwerkingsverband verdeelt het regionaal zorgbudget over de scholen binnen het samenwerkingsverband
      overeenkomstig het ondersteuningsplan.
    url: https://wetten.overheid.nl/BWBR0015137/2015-02-06#Artikel3a
  - number: '4'
    text: |-
      1 Een regionale verwijzingscommissie baseert per aanvraag als bedoeld in [artikel 3][ref1] de beschikking over de
      indicatiestelling uitsluitend op:

      a. de door het bevoegd gezag gegeven motivering die gebaseerd is op ervaringen met de leerling in
      het onderwijsleerproces, zoals die onder meer blijken uit het onderwijskundig rapport, bedoeld in
      [artikel 10e, vierde lid][ref2], en [10g, tweede lid, van de wet][ref3],

      b. de leerachterstand van de leerling,

      c. het intelligentiequotiënt van de leerling, en

      d. indien dat noodzakelijk is voor het vormen van een oordeel, de resultaten van een of meer
      persoonlijkheidsonderzoeken met betrekking tot prestatiemotivatie, faalangst en emotionele instabiliteit die een
      beeld geven van de sociaal-emotionele problematiek van de leerling in relatie tot de leerprestaties, en

      e. indien het een aanvraag voor praktijkonderwijs betreft: de zienswijze van de ouders.

      2 De leerachterstand van de leerling is de uitkomst van 1 minus (DLE/DL), waarin DLE de afkorting is van
      didactische leeftijdseenheden en het aantal maanden onderwijs is dat behoort bij het niveau dat de leerling
      feitelijk heeft bereikt en DL de afkorting is van didactische leeftijd en het aantal maanden is dat een leerling
      vanaf groep 3 in de perioden van september tot en met juni was ingeschreven bij een school als bedoeld in de
      [Wet op het primair onderwijs][ref4] of de [Wet op de expertisecentra][ref5].

      3 De regionale verwijzingscommissie wijst de aanvraag voor praktijkonderwijs uitsluitend toe, indien de leerling:

      a. een intelligentiequotiënt heeft binnen de bandbreedte van 55 tot en met 80, en

      b. een leerachterstand heeft op tenminste twee van de vier domeinen inzichtelijk rekenen, begrijpend lezen,
      technisch lezen en spellen, ten minste één van deze twee domeinen inzichtelijk rekenen of begrijpend lezen betreft
      en deze leerachterstand gelijk is aan of groter is dan 0,5.

      4 De regionale verwijzingscommissie wijst de aanvraag voor leerwegondersteunend onderwijs uitsluitend toe, indien
      de leerling:

      a. 1°. een intelligentiequotiënt heeft binnen de bandbreedte 75 tot en met 90, en

      2°. een leerachterstand heeft op tenminste twee van de vier domeinen inzichtelijk rekenen, begrijpend lezen,
      technisch lezen en spellen, ten minste één van deze twee domeinen inzichtelijk rekenen of begrijpend lezen betreft
      en deze leerachterstand is gelegen binnen de bandbreedte van 0,25 tot 0,5, of

      b. 1° een intelligentiequotiënt heeft binnen de bandbreedte 91 tot en met 120, en

      2°. een leerachterstand heeft op tenminste twee van de vier domeinen inzichtelijk rekenen, begrijpend lezen,
      technisch lezen en spellen, ten minste één van deze twee domeinen inzichtelijk rekenen of begrijpend lezen betreft
      en deze leerachterstand is gelegen binnen de bandbreedte van 0,25 tot 0,5, en

      3°. een sociaal-emotionele problematiek heeft als bedoeld in het eerste lid, onderdeel d.

      5 Voor een leerling die wat intelligentiequotiënt of leerachterstand betreft, voldoet aan de vereisten voor
      indicatiestelling voor praktijkonderwijs en die wat de overige vereisten betreft voldoet aan de vereisten
      voor indicatiestelling voor leerwegondersteunend onderwijs, kan een beschikking omtrent indicatiestelling voor
      praktijkonderwijs of voor leerwegondersteunend onderwijs worden afgegeven, afhankelijk van de door het bevoegd
      gezag gegeven motivering, bedoeld in het eerste lid, onderdeel a.


