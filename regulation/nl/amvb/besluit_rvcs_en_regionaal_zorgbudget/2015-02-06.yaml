  - number: 4a
    text: |-
      1 Op grond van [artikel 10g, vijfde lid, van de wet][ref1] kan het bevoegd gezag van een school voor
      praktijkonderwijs een aanvraag tot indicatiestelling bij een regionale verwijzingscommissie indienen voor een
      leerling voor wie naar het oordeel van dat bevoegd gezag het zorg- en onderwijsaanbod van het praktijkonderwijs het
      beste aansluit bij de behoeften van deze leerling en die:

      a. het voorbereidend beroepsonderwijs of het middelbaar algemeen voortgezet onderwijs bezoekt en op
      leerwegondersteunend onderwijs is aangewezen, met:

      1°. scores op de criteria, bedoeld in [artikel 4][ref2], in het grensvlak van het leerwegondersteunend onderwijs
      en praktijkonderwijs,

      2°. naar het oordeel van het bevoegd gezag een toegenomen problematiek nadat de beslissing is genomen dat de
      leerling op leerwegondersteunend onderwijs is aangewezen, of

      3°. naar het oordeel van het bevoegd gezag een stapeling van andersoortige problematiek dan wordt beoordeeld in het
      onderzoek of de leerling is aangewezen op leerwegondersteunend onderwijs of praktijkonderwijs, dan wel

      b. beschikt over een toelaatbaarheidsverklaring voor het speciaal onderwijs of voortgezet
      speciaal onderwijs van een samenwerkingsverband als bedoeld in [artikel 1 van de wet][ref3] of
      [artikel 1 van de Wet op het primair onderwijs][ref4] dan wel een ontwikkelingsperspectief en die:

      1. voldoet aan het intelligentiequotiëntcriterium of leerachterstandscriterium voor toelating tot het
      praktijkonderwijs, bedoeld in [artikel 4, derde lid][ref5], blijkens gegevens die gebaseerd zijn op screenings- of
      testinstrumenten als bedoeld in [artikel 3, vierde lid][ref6], of

      2. naar het oordeel van het bevoegd gezag, ongeacht een dergelijk intelligentiequotiënt of een dergelijke
      leerachterstand, een zodanige problematiek heeft dat toelaatbaarheid tot het praktijkonderwijs geboden is.

      2 Het bevoegd gezag dient een aanvraag tot indicatiestelling voor praktijkonderwijs voor een leerling als bedoeld
      in het eerste lid in bij de regionale verwijzingscommissie.

      3 De regionale verwijzingscommissie baseert de beschikking over de indicatiestelling uitsluitend op de volgende,
      bij de aanvraag gevoegde, gegevens:

      a. een kopie van de beslissing dat de leerling is aangewezen op leerwegondersteunend onderwijs, of een kopie
      van de toelaatbaarheidsverklaring voor het speciaal onderwijs of het voortgezet speciaal onderwijs dan wel het
      ontwikkelingsperspectief,

      b. de op schrift gestelde zienswijze en instemming van de ouders,

      c. een advies van de permanente commissie leerlingenzorg van het samenwerkingsverband waar de verwijzende school
      voor voorbereidend beroepsonderwijs of voor middelbaar algemeen voortgezet onderwijs aan deelneemt, of van
      het samenwerkingsverband van de school voor praktijkonderwijs voor leerlingen die niet afkomstig zijn van het
      voorbereidend beroepsonderwijs of als middelbaar algemeen voortgezet onderwijs,

      d. een motivering waaruit blijkt dat de leerling behoort tot een doelgroep bedoeld in het eerste lid, en

      e. een leerling-dossier.

      4 Het leerling-dossier bevat in elk geval:

      1°. het ontwikkelingsperspectief of de onderwijskundige rapportage over de leerling,

      2°. een beschrijving van de activiteiten van het verwijzende bevoegd gezag in het kader van de begeleiding van de
      leerling, en van de resultaten van die activiteiten,

      3°. een document dat aangeeft welke externe deskundigen voor advies of hulp zijn ingeschakeld bij de begeleiding
      van de leerling,

      4°. een beschrijving van de risico’s die zich naar verwachting zullen voordoen indien de leerling voorbereidend
      beroepsonderwijs, middelbaar algemeen voortgezet onderwijs, speciaal onderwijs of voortgezet speciaal onderwijs
      blijft volgen, en

      5°. mogelijk relevante test- en toetsgegevens.

      5 [Artikel 3, derde, vijfde, zesde, zevende, negende en tiende lid][ref7], is van overeenkomstige toepassing.


