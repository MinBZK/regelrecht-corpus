---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_subsidies_technische_ontwikkelingsprojecten
regulatory_layer: AMVB
publication_date: '2003-12-09'
valid_from: '2003-07-16'
bwb_id: BWBR0012422
url: https://wetten.overheid.nl/BWBR0012422/2003-07-16
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 12 januari 2001, nr. WJZ 01001700;

    Gelet op artikel 3 van de Kaderwet EZ-subsidies;

    De Raad van State gehoord (advies van 29 maart 2001, nr. W10.01.0036/II);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 12 april 2001, nr. WJZ 01020429;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel1
  - number: 1.1.a
    text: |-
      ontwikkelingsproject: een creatieve, systematische activiteit, gericht op het omzetten van de resultaten van
      industrieel onderzoek in plannen, schema's of ontwerpen voor nieuwe, gewijzigde of verbeterde producten, processen
      of diensten, dan wel wezenlijke onderdelen daarvan, die nieuw zijn voor Nederland, en waaraan substantiële
      technische risico's en daaruit voortvloeiende financiële risico's zijn verbonden;
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel1
  - number: 1.1.b
    text: |-
      ondernemer: een natuurlijke persoon of rechtspersoon, niet zijnde een rechtspersoon die krachtens publiekrecht is
      ingesteld, die een onderneming in stand houdt;
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel1
  - number: 1.1.c
    text: 'groep: een economische eenheid waarin organisatorisch zijn verbonden:'
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel1
  - number: 1.1.c.1°
    text: |-
      een natuurlijke persoon of privaatrechtelijke rechtspersoon die direct of indirect: - meer dan de helft van het
      geplaatste kapitaal verschaft aan,
        - volledig aansprakelijk vennoot is van of
        - overwegende zeggenschap heeft over een of meer rechtspersonen of vennootschappen, en
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel1
  - number: 1.1.c.2°
    text: laatstbedoelde rechtspersonen of vennootschappen.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel1
  - number: '1.2'
    text: |-
      Bij ministeriële regeling kunnen ondernemingen worden aangewezen die van de toepassing van dit besluit zijn
      uitgesloten.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel1
  - number: '2.1'
    text: |-
      Onze Minister verstrekt op aanvraag een subsidie aan een ondernemer die voor eigen rekening en risico een
      ontwikkelingsproject uitvoert, met dien verstande dat de subsidie overeenkomstig [artikel 18, eerste lid][ref1],
      moet worden terugbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0012422#Artikel18
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0012422
        artikel: '18'
        paragraaf: '4'
  - number: '2.2'
    text: 'Geen subsidie wordt verstrekt:'
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel2
  - number: 2.2.a
    text: indien voor het ontwikkelingsproject reeds door Onze Minister subsidie is verstrekt;
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel2
  - number: 2.2.b
    text: |-
      voor zover door verlening van de subsidie in het kalenderjaar waarin de beschikking wordt gegeven aan de aanvrager
      dan wel aan de tot dezelfde groep als de aanvrager behorende ondernemers meer dan €10 000 000,00 subsidie krachtens
      dit besluit zou worden verleend.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel2
  - number: '3.1'
    text: De subsidie bedraagt 25 procent van de projectkosten, maar niet meer dan €5 000 000,00.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel3
  - number: '3.2'
    text: |-
      Het in het eerste lid genoemde percentage wordt verhoogd tot 35 procent indien subsidie verstrekt wordt aan een
      ondernemer die een kleine of middelgrote onderneming in stand houdt in de zin van [verordening (EG) nr. 70/2001]
      (32001R0070) van de Commissie van de Europese Gemeenschappen van 12 januari 2001 betreffende de toepassing van de
      artikelen 87 en 88 van het EG-Verdrag op staatssteun voor kleine en middelgrote ondernemingen (PbEG L 10).
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel3
  - number: '3.3'
    text: |-
      Indien ter zake van de projectkosten of een deel daarvan reeds door een ander bestuursorgaan of de Commissie van
      de Europese Gemeenschappen subsidie is verstrekt, wordt slechts een zodanig bedrag aan subsidie verstrekt, dat het
      totale bedrag aan subsidies niet meer bedraagt dan het ingevolge het eerste of tweede lid geldende percentage van
      de projectkosten.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel3
  - number: '4.1'
    text: 'Als projectkosten worden uitsluitend in aanmerking genomen:'
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel4
  - number: 4.1.a
    text: |-
      de volgende rechtstreeks aan de uitvoering van het ontwikkelingsproject toe te rekenen, na de indiening van de
      aanvraag door de subsidie-ontvanger gemaakte en betaalde kosten:
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel4
  - number: 4.1.a.1°
    text: |-
      loonkosten, met dien verstande dat wordt uitgegaan van een uurloon, berekend op basis van het jaarloon bij een
      volledige dienstbetrekking volgens de kolom «loon voor de loonbelasting» van de loonstaat van het betrokken directe
      personeel, verhoogd met de wettelijke dan wel de op grond van een individuele of collectieve arbeidsovereenkomst
      verschuldigde opslagen voor sociale lasten, en van 1750 productieve uren per jaar;
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel4
  - number: 4.1.a.2°
    text: |-
      kosten van aangeschafte machines en apparatuur, met dien verstande dat wordt uitgegaan van de aan het
      ontwikkelingsproject toe te rekenen afschrijvingskosten, berekend op basis van de historische aanschafprijzen en
      de door de belastingdienst geaccepteerde afschrijvingstermijnen, met uitzondering van mogelijkheden tot vervroegde
      afschrijving, of lease-termijnen, met uitzondering van financieringskosten, en gebaseerd op de bedrijfseconomische
      levensduur;
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel4
  - number: 4.1.a.3°
    text: kosten van verbruikte materialen en hulpmiddelen, gebaseerd op historische aanschafprijzen;
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel4
  - number: 4.1.a.4°
    text: andere aan derden verschuldigde kosten, met uitzondering van binnenlandse reis- en verblijfkosten.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel4
  - number: 4.1.b
    text: een opslag voor algemene kosten, groot 50 procent van de onder a, onder 1°, bedoelde kosten.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel4
  - number: '4.2'
    text: |-
      Kosten van machines en apparatuur die niet uitsluitend voor het ontwikkelingsproject zijn aangeschaft, worden
      slechts als projectkosten op de voet van het eerste lid, onder a, onder 2°, in aanmerking genomen indien een
      door middel van een sluitende tijdschrijving vastgestelde urenverantwoording per machine respectievelijk van de
      apparatuur aanwezig is.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel4
  - number: '4.3'
    text: |-
      Indien geen loonkosten als bedoeld in het eerste lid, onder a, onder 1°, worden gemaakt, maar niettemin arbeid ten
      behoeve van het ontwikkelingsproject wordt verricht, wordt voor de berekening van de projectkosten uitgegaan van
      een bij regeling van Onze Minister vast te stellen uurtarief.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel4
  - number: '4.4'
    text: |-
      Voor de toepassing van het eerste lid worden winstopslagen bij transacties binnen een groep alleen in aanmerking
      genomen voor zover het gebruikelijk is die winstopslagen ook bij soortgelijke transacties buiten de groep in
      rekening te brengen.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel4
  - number: '4.5'
    text: |-
      De kosten worden in aanmerking genomen met inbegrip van omzetbelasting, indien de subsidie-ontvanger die de kosten
      heeft gemaakt omzetbelasting niet in aftrek kan brengen.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel4
  - number: '5.1'
    text: |-
      Er is een adviescommissie Technische Ontwikkelingsprojecten, die tot taak heeft Onze Minister op zijn verzoek te
      adviseren omtrent aanvragen om een subsidie op grond van dit besluit.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel5
  - number: '5.2'
    text: De adviezen van de commissie gaan vergezeld van een deugdelijke motivering.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel5
  - number: '5.3'
    text: |-
      De commissie bestaat uit een voorzitter en ten minste twee en ten hoogste tien andere leden. De leden zijn
      deskundig op het terrein waarop de commissie een taak heeft en zijn geen ambtenaren, werkzaam bij het Ministerie
      van Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel5
  - number: '5.4'
    text: |-
      De voorzitter en de leden worden door Onze Minister voor een termijn van ten hoogste drie jaar benoemd. Ze zijn te
      allen tijde opnieuw benoembaar.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel5
  - number: '5.5'
    text: De commissie stelt haar eigen werkwijze schriftelijk vast.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel5
  - number: '5.6'
    text: |-
      Een lid van de commissie neemt niet deel aan de voorbereiding en vaststelling van een advies, indien hij een
      persoonlijk belang heeft bij de beschikking op een aanvraag.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel5
  - number: '5.7'
    text: Onze Minister kan waarnemers aanwijzen, die het recht hebben de vergaderingen van de commissie bij te wonen.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel5
  - number: '5.8'
    text: In het secretariaat van de commissie wordt door Onze Minister voorzien.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel5
  - number: '5.9'
    text: |-
      Het beheer van de bescheiden betreffende de werkzaamheden van de commissie geschiedt op overeenkomstige wijze als
      bij het Ministerie van Economische Zaken. De bescheiden worden na beëindiging van de werkzaamheden van de commissie
      opgeborgen in het archief van dat ministerie.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel5
  - number: '5.10'
    text: |-
      De commissie verstrekt desgevraagd aan Onze Minister de voor de uitoefening van zijn taak benodigde inlichtingen.
      Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van zijn
      taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel5
  - number: '5.11'
    text: |-
      De commissie stelt jaarlijks voor 1 april een verslag op van haar werkzaamheden in het afgelopen kalenderjaar.
      Op verzoek van Onze Minister, maar ten minste elk vierde jaar, stelt de commissie tevens een evaluatieverslag op,
      waarin zij aandacht besteedt aan de doelmatigheid en doeltreffendheid van haar taakvervulling. Het jaarverslag en
      het evaluatieverslag worden aan Onze Minister toegezonden en algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel5
  - number: '6'
    text: |-
      Onze Minister stelt ieder begrotingsjaar bij ministeriële regeling een subsidieplafond vast voor het in dat jaar
      verlenen van subsidies krachtens dit besluit. Daarbij kan hij afzonderlijke subsidieplafonds vaststellen voor
      bepaalde categorieën aanvragers en voor bepaalde categorieën ontwikkelingsprojecten.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel6
  - number: '7.1'
    text: |-
      Een aanvraag om subsidie wordt ingediend met gebruikmaking van het origineel van een ondertekend formulier, dat
      door Onze Minister wordt vastgesteld. Onze Minister kan bij ministeriële regeling hiervan vrijstelling verlenen.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel7
  - number: '7.2'
    text: |-
      Een aanvraag gaat vergezeld van een projectplan en een begroting voor het ontwikkelingsproject alsmede van andere
      bescheiden, overeenkomstig hetgeen in het formulier is vermeld.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel7
  - number: '8'
    text: Onze Minister geeft een beschikking binnen achttien weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel8
  - number: '9.1'
    text: 'Onze Minister beslist in ieder geval afwijzend op een aanvraag indien:'
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel9
  - number: 9.1.a
    text: de aanvraag niet voldoet aan dit besluit en de daarop berustende bepalingen;
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel9
  - number: 9.1.b
    text: hij de projectkosten raamt op minder dan een bij regeling van Onze Minister vastgesteld bedrag;
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel9
  - number: 9.1.c
    text: gegronde vrees bestaat dat de betrokkenen het ontwikkelingsproject niet kunnen financieren.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel9
  - number: '9.2'
    text: |-
      Onze Minister kan, indien vooralsnog onvoldoende vertrouwen bestaat in de technische haalbaarheid van het
      ontwikkelingsproject, een aanvraag gedeeltelijk afwijzen, met dien verstande dat subsidie wordt verleend ter zake
      van de projectkosten, verbonden aan de uitvoering van een eerste fase van het ontwikkelingsproject, gedurende een
      in de beschikking tot subsidieverlening vermelde periode.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel9
  - number: '10.1'
    text: |-
      Onze Minister wint omtrent de aanvragen waarop niet met toepassing van [artikel 9, eerste lid][ref1], afwijzend is
      beslist, het advies in van de adviescommissie Technische Ontwikkelingsprojecten.


      [ref1]: https://wetten.overheid.nl/BWBR0012422#Artikel9
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012422
        artikel: '9'
        paragraaf: '2'
  - number: '10.2'
    text: 'De commissie geeft aan Onze Minister in ieder geval een negatief advies indien:'
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel10
  - number: 10.2.a
    text: |-
      onvoldoende aannemelijk is, dat het ontwikkelingsproject zonder de subsidie naar verwachting niet of met
      belangrijke vertraging zou worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel10
  - number: 10.2.b
    text: |-
      onvoldoende vertrouwen bestaat in de technische en economische haalbaarheid van het ontwikkelingsproject, in het
      bijzonder de mogelijkheid om bij welslagen van het ontwikkelingsproject de commercialisatie van de resultaten ervan
      en de eruit voortvloeiende productie of dienstverlening alleen of in samenwerking met derden ter hand te nemen en
      de subsidie te betalen binnen de economische levensduur van de eruit voortvloeiende producten of diensten;
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel10
  - number: 10.2.c
    text: |-
      onvoldoende vertrouwen bestaat dat de betrokkenen de capaciteiten hebben om het ontwikkelingsproject naar behoren
      uit te voeren;
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel10
  - number: 10.2.d
    text: van het ontwikkelingsproject onvoldoende positieve gevolgen voor de Nederlandse economie te verwachten zijn.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel10
  - number: '11.1'
    text: |-
      Onze Minister beslist afwijzend op een aanvraag, indien de adviescommissie Technische Ontwikkelingsprojecten een
      negatief advies heeft uitgebracht.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel11
  - number: '11.2'
    text: |-
      Onze Minister kan afwijken van het eerste lid, indien een advies van de commissie in strijd is met dit besluit dan
      wel niet op zorgvuldige wijze tot stand is gekomen.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel11
  - number: '11.3'
    text: |-
      Onze Minister verdeelt het beschikbare bedrag in de volgorde van ontvangst van de aanvragen, met dien verstande
      dat indien een aanvrager niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van een
      aanvraag en met toepassing van [artikel 4:5 van de Algemene wet bestuursrecht ](onbekend)de gelegenheid heeft gehad
      een aanvraag aan te vullen, de dag waarop een aanvraag voldoet aan de wettelijke voorschriften met betrekking tot
      de verdeling als datum van ontvangst geldt.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel11
  - number: '12'
    text: |-
      Onze Minister schort, ingeval een ondernemer als bedoeld in [artikel 3, tweede lid][ref1], een aanvraag om subsidie
      voor een ontwikkelingsproject heeft ingediend, de behandeling van die aanvraag op, als naar het oordeel van de
      adviescommissie Technische Ontwikkelingsprojecten een onderzoek naar de technische en economische haalbaarheid van
      het ontwikkelingsproject noodzakelijk is of het bij de aanvraag behorende projectplan onvoldragen is.


      [ref1]: https://wetten.overheid.nl/BWBR0012422#Artikel3
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0012422
        artikel: '3'
        paragraaf: '1'
  - number: '13.1'
    text: |-
      Onze Minister stelt de subsidie-aanvrager onverwijld van de opschorting in kennis en stelt hem in de gelegenheid
      binnen een door Onze Minister te stellen termijn van ten hoogste zes weken na de datum van inkennisstelling
      een aanvraag in te dienen om subsidie voor een onderzoek naar de technische en economische haalbaarheid van het
      ontwikkelingsproject of voor het opstellen van een projectplan. Onze Minister geeft daarbij aan, aan welke eisen
      het onderzoek respectievelijk het projectplan moet voldoen.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel13
  - number: '13.2'
    text: De subsidie bedraagt 50 procent van de kosten, maar niet meer dan €25 000,00.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel13
  - number: '14.1'
    text: |-
      Op de subsidie-ontvanger rusten de in de[artikelen 15 tot en met 19][ref1] opgenomen verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0012422#Artikel15
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0012422
        artikel: '15'
        paragraaf: '4'
  - number: '14.2'
    text: |-
      De in de[ artikelen 15 tot en met 17][ref1] opgenomen verplichtingen gelden tot aan de dag waarop de subsidie wordt
      vastgesteld. De in de [artikelen 18 en 19][ref2] opgenomen verplichtingen gelden totdat tien jaren na die dag zijn
      verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0012422#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0012422#Artikel18
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0012422
        artikel: '15'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0012422
        artikel: '18'
        paragraaf: '4'
  - number: '15.1'
    text: |-
      De subsidie-ontvanger voert het ontwikkelingsproject uit overeenkomstig het projectplan waarop de subsidieverlening
      betrekking heeft en voltooit het uiterlijk op het bij de verlening bepaalde tijdstip, behoudens voorafgaande
      schriftelijke ontheffing van Onze Minister voor het vertragen, essentieel wijzigen of stopzetten van het project.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel15
  - number: '15.2'
    text: |-
      De subsidie-ontvanger voert het ontwikkelingsproject in Nederland uit, behoudens voorafgaande schriftelijke
      ontheffing van Onze Minister voor gedeeltelijke uitvoering buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel15
  - number: '16.1'
    text: |-
      De subsidie-ontvanger voert een administratie die zodanig is ingericht, dat daaruit te allen tijde op
      eenvoudige en duidelijke wijze alle projectkosten kunnen worden afgelezen, gespecificeerd overeenkomstig de in
      [artikel 4, eerste lid][ref1], onderscheiden kostensoorten, met dien verstande dat ter zake van de loonkosten een
      door middel van een sluitende tijdschrijving vastgestelde urenverantwoording per werknemer aanwezig dient te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0012422#Artikel4
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0012422
        artikel: '4'
        paragraaf: '1'
  - number: '16.2'
    text: |-
      De subsidie-ontvanger doet onverwijld mededeling aan Onze Minister van de indiening bij de rechtbank van een
      verzoek tot het op hem van toepassing verklaren van de schuldsaneringsregeling natuurlijke personen, tot verlening
      van surseance van betaling aan hem of tot faillietverklaring van hem.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel16
  - number: '16.3'
    text: |-
      De subsidie-ontvanger brengt steeds na afloop van een periode van zes maanden, tenzij bij de subsidieverlening
      anders is bepaald, aan Onze Minister schriftelijk verslag uit omtrent de uitvoering van het ontwikkelingsproject,
      met inbegrip van een vergelijking van die uitvoering met het projectplan en de bij de subsidieverlening vermelde
      raming van de projectkosten, en doet mededeling van de activiteiten die zijn ondernomen ten behoeve van de
      commercialisatie van de resultaten van het ontwikkelingsproject en van de opbrengsten en vooruitzichten ter zake
      van die commercialisatie.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel16
  - number: '17.1'
    text: |-
      De subsidie-ontvanger dient zijn aanvraag om subsidievaststelling in binnen dertien weken na het tijdstip waarop
      het ontwikkelingsproject ingevolge [artikel 15, eerste lid][ref1], moet zijn voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0012422#Artikel15
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0012422
        artikel: '15'
        paragraaf: '4'
  - number: '17.2'
    text: |-
      Een aanvraag wordt ingediend met gebruikmaking van het origineel van een ondertekend formulier, dat door Onze
      Minister wordt vastgesteld. Onze Minister kan bij ministeriële regeling hiervan vrijstelling verlenen.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel17
  - number: '17.3'
    text: |-
      Een aanvraag gaat vergezeld van een accountantsverklaring indien het bedrag van de subsidieverlening meer dan
      € 50 000 bedraagt, en een eindverslag omtrent de uitvoering en de resultaten van het ontwikkelingsproject,
      overeenkomstig hetgeen in het formulier is vermeld.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel17
  - number: '18.1'
    text: 'Van de verstrekte subsidie zal de subsidie-ontvanger terugbetalen:'
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel18
  - number: 18.1.a
    text: |-
      binnen acht weken na afloop van een kalenderjaar, tot de in de beschikking tot subsidieverlening genoemde datum,
      een bedrag gelijk aan het in die beschikking vermelde percentage van de in dat kalenderjaar met de uit het
      ontwikkelingsproject voortvloeiende of ervan afgeleide productie of dienstverlening gerealiseerde omzet;
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel18
  - number: 18.1.b
    text: |-
      binnen vier weken na ontvangst van de beschikking tot subsidievaststelling, het in de beschikking tot
      subsidieverlening vermelde percentage van de opbrengst verkregen door verkoop of anderszins van een nulserie,
      prototype, onderdelen hiervan of van andere activa die mede met de subsidie zijn gefinancierd;
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel18
  - number: 18.1.c
    text: |-
      binnen vier weken na ontvangst van de beschikking tot subsidievaststelling, het in de beschikking tot
      subsidieverlening vermelde percentage van de waarde van de nog bruikbare activa welke mede met de subsidie zijn
      gefinancierd en die niet gebruikt worden voor de uit de subsidie voortvloeiende productie of dienstverlening.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel18
  - number: '18.2'
    text: |-
      In afwijking van het eerste lid, is de terugbetalingsverplichting niet van toepassing op de subsidie, bedoeld in
      [artikel 13, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012422#Artikel13
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0012422
        artikel: '13'
        paragraaf: '3'
  - number: '18.3'
    text: |-
      De subsidie-ontvanger verstrekt binnen acht weken na afloop van elk kalenderjaar aan Onze Minister een opgave van
      de in het eerste lid, onder a, bedoelde gerealiseerde omzet.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel18
  - number: '18.4'
    text: |-
      De subsidie-ontvanger verstrekt indien het bedrag van de subsidieverlening meer dan € 50 000 bedraagt, jaarlijks
      voor 1 oktober aan Onze Minister een accountantsverklaring inzake de opgave, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel18
  - number: '19.1'
    text: |-
      De subsidie-ontvanger brengt desgevraagd aan Onze Minister verslag uit omtrent de toepassing van de resultaten van
      het ontwikkelingsproject.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel19
  - number: '19.2'
    text: 'De subsidie-ontvanger zal, behoudens voorafgaande schriftelijke ontheffing van Onze Minister, niet:'
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel19
  - number: 19.2.a
    text: |-
      indien hij een rechtspersoon is, de rechtspersoon ontbinden of geheel of gedeeltelijk vervreemden noch zijn
      statutaire zetel verplaatsen buiten Nederland;
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel19
  - number: 19.2.b
    text: de activa, anders dan prototypen, welke mede met de subsidie zijn gefinancierd, vervreemden.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel19
  - number: '20'
    text: |-
      Onze Minister kan aan een ontheffing als bedoeld in de[ artikelen 15][ref1] en [19, tweede lid][ref2],
      voorschriften verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0012422#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0012422#Artikel19
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0012422
        artikel: '15'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0012422
        artikel: '19'
        paragraaf: '4'
  - number: '21'
    text: 'Onze Minister kan bij de subsidieverlening verplichtingen opleggen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel21
  - number: 21.a
    text: |-
      de tenaamstelling, verwerving, instandhouding, exploitatie en vervreemding van rechten van intellectuele eigendom
      en de instandhouding van andere voor de uitvoering van het ontwikkelingsproject van belang zijnde en door de
      uitvoering van het ontwikkelingsproject opgedane kennis;
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel21
  - number: 21.b
    text: |-
      de zekerheidsstelling voor de terugbetaling van de verstrekte subsidie, bedoeld in [artikel 18, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012422#Artikel18
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0012422
        artikel: '18'
        paragraaf: '4'
  - number: '22.1'
    text: |-
      Onze Minister kan op aanvraag van de subsidie-ontvanger subsidie verlenen, zodanig dat het bedrag van een eerder
      ter zake van een ontwikkelingsproject verleende subsidie wordt verhoogd tot maximaal het bedrag, bedoeld in
      [artikel 3, eerste lid][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0012422#Artikel3
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0012422
        artikel: '3'
        paragraaf: '1'
  - number: 22.1.a
    text: |-
      een eerdere aanvraag om verlening van een subsidie ter zake van het ontwikkelingsproject gedeeltelijk is afgewezen
      wegens overschrijding van het subsidieplafond;
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel22
  - number: 22.1.b
    text: |-
      een eerdere aanvraag om verlening van een subsidie ter zake van het ontwikkelingsproject gedeeltelijk is afgewezen
      op grond van [artikel 9, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012422#Artikel9
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0012422
        artikel: '9'
        paragraaf: '2'
  - number: 22.1.c
    text: |-
      ontheffing is verleend voor het essentieel wijzigen van het ontwikkelingsproject, bedoeld in
      [artikel 15, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012422#Artikel15
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0012422
        artikel: '15'
        paragraaf: '4'
  - number: '22.2'
    text: 'Van overeenkomstige toepassing zijn:'
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel22
  - number: 22.2.a
    text: |-
      in de gevallen, bedoeld in het eerste lid, onder a en c: de[ artikelen 2, tweede lid, onder b,][ref1][8][ref2],
      [11, derde lid][ref3], en [21][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0012422#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012422#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0012422#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0012422#Artikel21
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0012422
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0012422
        artikel: '8'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0012422
        artikel: '11'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0012422
        artikel: '21'
        paragraaf: '4'
  - number: 22.2.b
    text: |-
      in het geval, bedoeld in het eerste lid, onder b: de[artikelen 2, tweede lid, onder b, ][ref1], [8][ref2],
      [9, eerste lid][ref3][10][ref4], [11][ref5] en [21][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0012422#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012422#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0012422#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0012422#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0012422#Artikel11
      [ref6]: https://wetten.overheid.nl/BWBR0012422#Artikel21
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0012422
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0012422
        artikel: '8'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0012422
        artikel: '9'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0012422
        artikel: '10'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0012422
        artikel: '11'
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0012422
        artikel: '21'
        paragraaf: '4'
  - number: '23.1'
    text: |-
      Op een subsidie ter zake waarvan een beschikking tot subsidieverlening geldt, kunnen op aanvraag van de subsidie-
      ontvanger door Onze Minister voorschotten worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel23
  - number: '23.2'
    text: |-
      Een voorschot wordt berekend naar rato van de gemaakte en betaalde projectkosten, voor zover deze nog niet eerder
      bij de verstrekking van een voorschot in aanmerking zijn genomen. In totaal zal het bedrag aan voorschotten niet
      groter zijn dan 80 procent van het bij de subsidieverlening vermelde maximale subsidiebedrag.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel23
  - number: '23.3'
    text: |-
      In afwijking van het eerste en tweede lid wordt aan een ondernemer als bedoeld in [artikel 3, tweede lid][ref1],
      het eerste voorschot ambtshalve verstrekt bij de subsidieverlening. Dit voorschot bedraagt 25 procent van het bij
      de subsidieverlening vermelde maximale subsidiebedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0012422#Artikel3
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0012422
        artikel: '3'
        paragraaf: '1'
  - number: '23.4'
    text: |-
      Bij de toepassing van het tweede lid wordt de opslag, bedoeld in [artikel 4, eerste lid, onder b][ref1], geacht
      gemaakt en betaald te zijn voor zover de kosten waarover hij wordt berekend gemaakt en betaald zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0012422#Artikel4
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0012422
        artikel: '4'
        paragraaf: '1'
  - number: '23.5'
    text: Een voorschot wordt slechts verstrekt, indien het bedrag aan voorschot ten minste €5 000,00 bedraagt.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel23
  - number: '24.1'
    text: |-
      Een aanvraag wordt ingediend gelijktijdig met het uitbrengen van een verslag als bedoeld in
      [artikel 16, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012422#Artikel16
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0012422
        artikel: '16'
        paragraaf: '4'
  - number: '24.2'
    text: |-
      Een aanvraag wordt ingediend met gebruikmaking van het origineel van een ondertekend formulier, dat door Onze
      Minister wordt vastgesteld. Onze Minister kan bij ministeriële regeling hiervan vrijstelling verlenen.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel24
  - number: '25'
    text: |-
      Onze Minister kan afwijzend beschikken op een aanvraag, indien de subsidie-ontvanger niet heeft voldaan aan
      ingevolge de subsidieverlening voor hem geldende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel25
  - number: '26'
    text: |-
      Onze Minister geeft de beschikking tot subsidievaststelling binnen dertien weken na ontvangst van een aanvraag
      daartoe dan wel nadat de voor het indienen ervan geldende termijn is verstreken.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel26
  - number: '27'
    text: 'Tot en met 31 december 2001 geldt het volgende:'
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel27
  - number: 27.a
    text: |-
      in afwijking van [artikel 2, tweede lid, onder b][ref1], bedraagt het bedrag f 22 037 100,00;


      [ref1]: https://wetten.overheid.nl/BWBR0012422#Artikel2
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0012422
        artikel: '2'
        paragraaf: '1'
  - number: 27.b
    text: |-
      in afwijking van [artikel 3, eerste lid][ref1], bedraagt het bedrag f 11 018 550,00;


      [ref1]: https://wetten.overheid.nl/BWBR0012422#Artikel3
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0012422
        artikel: '3'
        paragraaf: '1'
  - number: 27.c
    text: |-
      in afwijking van [artikel 13, tweede lid][ref1], bedraagt het bedrag f 55 093,00;


      [ref1]: https://wetten.overheid.nl/BWBR0012422#Artikel13
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0012422
        artikel: '13'
        paragraaf: '3'
  - number: 27.d
    text: |-
      in afwijking van [artikel 23, vijfde lid][ref1], bedraagt het bedrag f 11 019,00.


      [ref1]: https://wetten.overheid.nl/BWBR0012422#Artikel23
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0012422
        artikel: '23'
        paragraaf: '6'
  - number: '28'
    text: |-
      Het Besluit technische ontwikkelingskredieten 1997 en het Besluit kredieten elektronische-dienstenontwikkeling
      worden ingetrokken, met dien verstande dat deze en de daarop gebaseerde regelgeving van toepassing blijven op
      subsidies die voor de inwerkingtreding van dit besluit zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel28
  - number: '29'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel29
  - number: '30'
    text: 'Dit besluit wordt aangehaald als: Besluit subsidies technische ontwikkelingsprojecten.'
    url: https://wetten.overheid.nl/BWBR0012422/2003-07-16#Artikel30
