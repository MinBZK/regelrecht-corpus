        artikel: '8'
  - number: '4'
    text: |-
      1 Op de uitkeringsgerechtigde die op ten minste twaalf uur per kalenderweek onbeloonde
      werkzaamheden gaat verrichten uit hoofde waarvan hij op grond van de [WW][ref1] niet
      als werknemer wordt beschouwd zijn de [artikelen 8, eerste lid, van de WW][ref2] en
      __REF002___________________________________________________________________________________________________________
      ___ tijdelijk niet van toepassing indien:

      a. de uitkeringsgerechtigde voor aanvang van de werkzaamheden aan het UWV mededeling doet van de omstandigheid dat
      hij deze zal gaan verrichten;

      b. de natuurlijke persoon voor wie, of het lichaam waarvoor, de werkzaamheden worden verricht een
      aansprakelijkheids- en ongevallenverzekering ten behoeve van de uitkeringsgerechtigde heeft afgesloten;

      c. er, naar het oordeel van het UWV, een reëel uitzicht is op een op de onbeloonde werkzaamheden aansluitende
      dienstbetrekking van dezelfde of grotere omvang voor ten minste zes maanden;

      d. de uitkeringsgerechtigde niet eerder werkzaamheden heeft verricht voor dezelfde natuurlijke persoon of hetzelfde
      lichaam of diens rechtsvoorganger ter zake waarvan dit besluit toepassing heeft gevonden;

      e. de aanvang van de werkzaamheden is gelegen voor de afloop van het kwartaal, volgend op het kwartaal waarin
      het aantal uitkerings-gerechtigden op wie, op grond van dit besluit, de in de aanhef genoemde artikelen tijdelijk
      buiten toepassing zijn of zijn geweest, de duizend heeft bereikt.

      2 De in het eerste lid genoemde artikelleden en artikelonderdelen blijven buiten toepassing over een aaneengesloten
      periode van drie maanden of zoveel korter als de werkzaamheden, bedoeld in het eerste lid, worden verricht.

      3 Indien de werkzaamheden, bedoeld in het eerste lid, wegens ziekte worden onderbroken, wordt de periode waarin een
      uitkering bij ziekte wordt ontvangen, voor de toepassing van het tweede lid buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel20
