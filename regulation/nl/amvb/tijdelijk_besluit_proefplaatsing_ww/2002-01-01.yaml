  - number: '2'
    text: |-
      Het met dit besluit beoogde resultaat is het verschaffen van inzicht in het effect van het toestaan van
      proefplaatsing met behoud van WW-uitkering op de werkhervattingskans van uitkeringsgerechtigden.
    url: https://wetten.overheid.nl/BWBR0011325/2002-01-01#Artikel2
  - number: '3'
    text: |-
      1 Dit besluit is van toepassing op de werknemer:

      a. die recht heeft op uitkering op grond van [hoofdstuk IIa](onbekend) of [IIb van de WW](onbekend);

      b. geen resterend aantal arbeidsuren per kalenderweek heeft;

      c. voor wie geen arbeidsmarktinstrumenten beschikbaar zijn, gericht op directe bemiddeling of terugkeer naar de
      arbeidsmarkt.

      2 In afwijking van het eerste lid is dit besluit niet van toepassing op:

      a. de werknemer die recht heeft op uitkering op grond van [artikel 18 van de WW][ref1];

      b. de arbeidsgehandicapte, bedoeld in [artikel 10 van de Wet op de (re)integratie arbeidsgehandicapten][ref2];

      c. de werknemer wiens werkloosheid uitsluitend een gevolg is van verkorting van de werktijd, waarvoor op grond van
      [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref3] ontheffing is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002014#Artikel8
    url: https://wetten.overheid.nl/BWBR0011325/2002-01-01#Artikel3
