articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. UWV: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];

      b. WW: [Werkloosheidswet][ref2];

      c. uitkeringsgerechtigde: werknemer op wie dit besluit op grond van [artikel 3][ref3] van toepassing is;

      d. WW-uitkering: uitkering op grond van de [Werkloosheidswet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0011325#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0004045
