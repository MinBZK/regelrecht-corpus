preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Financiën van 15 augustus 2005, nr. WDB 2005/489M;

    Gelet op artikel 38a van de Algemene wet inkomensafhankelijke regelingen;

    De Raad van State gehoord (advies van 24 augustus 2005, nr. W06.05.0382IV);

    Gezien het nader rapport van de Staatssecretaris van Financiën van 26 augustus 2005, nr. WDB 2005/489M,
    Directoraat-Generaal voor Fiscale Zaken, Directie Wetgeving Directe Belastingen;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0018707/2026-02-13#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Dit besluit geeft uitvoering aan de artikelen [21b][ref1], [32][ref2], [38][ref3], [38a][ref4] en
      [46 van de Algemene wet inkomensafhankelijke regelingen][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel21b
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0018472#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0018472#Artikel38a
      [ref5]: https://wetten.overheid.nl/BWBR0018472#Artikel46
    url: https://wetten.overheid.nl/BWBR0018707/2026-02-13#Artikel1
    references:
