        artikel: 38a
      - id: ref5
        bwb_id: BWBR0018472
        artikel: '46'
  - number: '1.2'
    text: 'Dit besluit verstaat onder:'
    url: https://wetten.overheid.nl/BWBR0018707/2026-02-13#Artikel1
  - number: 1.2.a
    text: |-
      wet: [Algemene wet inkomensafhankelijke regelingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018472
    url: https://wetten.overheid.nl/BWBR0018707/2026-02-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018472
  - number: 1.2.b
    text: |-
      Hulp- en informatiepunt: een rechtspersoon die belanghebbenden hulp biedt bij het aanvragen van een tegemoetkoming
      en belanghebbenden informeert over een tegemoetkoming en waarmee de Dienst Toeslagen een overeenkomst als bedoeld
      in artikel 28, derde lid, van de Algemene verordening gegevensbescherming heeft gesloten;
    url: https://wetten.overheid.nl/BWBR0018707/2026-02-13#Artikel1
  - number: 1.2.c
    text: |-
      Verordening (EG) nr. 883/2004: Verordening (EG) nr. 883/2004 van het Europees Parlement en de Raad van 29 april
      2004 betreffende de coördinatie van de socialezekerheidsstelsels (PbEU 2004, L 166);
    url: https://wetten.overheid.nl/BWBR0018707/2026-02-13#Artikel1
  - number: 1.2.d
    text: |-
      Verordening (EG) nr. 987/2009: Verordening (EG) nr. 987/2009 van het Europees Parlement en de Raad van 16 september
      2009 tot vaststelling van de wijze van toepassing van Verordening (EG) nr. 883/2004 betreffende de coördinatie van
      de socialezekerheidsstelsels (PbEU 2009, L 284).
    url: https://wetten.overheid.nl/BWBR0018707/2026-02-13#Artikel1
  - number: 1bis
    text: |-
      In situaties als bedoeld in [artikel 31a van de wet][ref1] kan de betekening en
      de tenuitvoerlegging van een dwangbevel geschieden op de uren en dagen, bedoeld in
      [artikel 64, eerste en tweede lid, eerste volzin, van het Wetboek van Burgerlijke Rechtsvordering][ref2], indien in
      het kader van een actie die mede is gericht op de toepassing en handhaving van de wet op deze uren en dagen:


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel31a
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel64
    url: https://wetten.overheid.nl/BWBR0018707/2026-02-13#Artikel1bis
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: 31a
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '64'
  - number: 1bis.a
    text: |-
      bekend wordt dat van de belanghebbende een bedrag wordt teruggevorderd ter zake waarvan terstond een dwangbevel
      wordt uitgevaardigd, of
    url: https://wetten.overheid.nl/BWBR0018707/2026-02-13#Artikel1bis
  - number: 1bis.b
    text: een vermogensbestanddeel van de belanghebbende aan wie reeds een dwangbevel is betekend, wordt aangetroffen.
    url: https://wetten.overheid.nl/BWBR0018707/2026-02-13#Artikel1bis
  - number: 1a
    text: |-
      Aan de Dienst Toeslagen worden door financiële ondernemingen die ingevolge de
      [Wet op het financieel toezicht][ref1] in Nederland het bedrijf van bank mogen uitoefenen de volgende gegevens
      inzake bankrekeningen verstrekt: het bankrekeningnummer en de naam, het adres, de woonplaats en de geboortedatum
      van de houder van de bankrekening.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0018707/2026-02-13#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 1b.1
    text: |-
      De verstrekking van gegevens en inlichtingen ingevolge [artikel 38, eerste lid, van de wet][ref1] aan de Dienst
      Toeslagen vindt plaats onder vermelding van het burgerservicenummer van degene op wie de gegevens betrekking hebben
      en geschiedt op de door de Dienst Toeslagen voorgeschreven wijze. De Dienst Toeslagen kan voor de toepassing van
      [artikel 1a][ref2] bepalen dat de vermelding van het burgerservicenummer achterwege blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0018707#Artikel1a
    url: https://wetten.overheid.nl/BWBR0018707/2026-02-13#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0018707
        artikel: 1a
  - number: 1b.2
    text: |-
      Degene op wie de gegevens betrekking hebben, dienen hiertoe hun burgerservicenummer bekend te maken aan de
      instelling die de gegevensverstrekking aan de Dienst Toeslagen verzorgt.
    url: https://wetten.overheid.nl/BWBR0018707/2026-02-13#Artikel1b
  - number: '2.1'
    text: |-
      Als voorzieningen die de dienstverlening voortvloeiende uit de uitvoering van de wet verbeteren, worden aangemerkt:
      Hulp- en informatiepunten.
    url: https://wetten.overheid.nl/BWBR0018707/2026-02-13#Artikel2
  - number: '2.2'
    text: |-
      De Dienst Toeslagen verstrekt aan Hulp- en informatiepunten de gegevens die noodzakelijk zijn voor de
      informatieverstrekking overeenkomstig het derde lid aan belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0018707/2026-02-13#Artikel2
  - number: '2.3'
    text: |-
      Hulp- en informatiepunten zijn verplicht tot geheimhouding van de gegevens waarvan zij ingevolge het tweede
      lid kennis nemen en mogen uitsluitend op verzoek van de belanghebbende de in zijn aanvraagformulier voor een
      tegemoetkoming gevraagde dan wel reeds vermelde gegevens raadplegen of aan hem verstrekken.
    url: https://wetten.overheid.nl/BWBR0018707/2026-02-13#Artikel2
  - number: 2a.1
    text: |-
      Bij regeling van Onze Minister in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid
      worden regels gesteld met betrekking tot de samenloop van tegemoetkomingen op grond van de
      [Wet op het kindgebonden budget][ref1] met naar aard en strekking daarmee overeenkomende tegemoetkomingen op grond
      van een regeling van een andere Staat, niet zijnde een lidstaat van de Europese Unie, een Staat die partij is bij
      de Overeenkomst betreffende de Europese Economische Ruimte, of Zwitserland.


      [ref1]: https://wetten.overheid.nl/BWBR0022751
    url: https://wetten.overheid.nl/BWBR0018707/2026-02-13#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0022751
  - number: 2a.2
    text: |-
      Bij regeling van Onze Minister in overeenstemming met Onze Minister van Sociale Zaken en
      Werkgelegenheid worden regels gesteld met betrekking tot de samenloop van tegemoetkomingen
      op grond van de [Wet op het kindgebonden budget][ref1] met naar aard en strekking daarmee
      overeenkomende tegemoetkomingen op grond van een regeling van een volkenrechtelijke
      organisatie als bedoeld in de [artikelen 3, eerste lid, onderdeel d][ref2], of
      [14, tweede lid, van het Besluit uitbreiding en beperking kring verzekerden volksverzekeringen 1999][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022751
      [ref2]: https://wetten.overheid.nl/BWBR0010182#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0010182#Artikel14
    url: https://wetten.overheid.nl/BWBR0018707/2026-02-13#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0022751
      - id: ref2
        bwb_id: BWBR0010182
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0010182
        artikel: '14'
  - number: 2a.3
    text: |-
      Bij regeling van Onze Minister in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, worden
      regels gesteld met betrekking tot de berekeningswijze en de wijze van verrekening van tegemoetkomingen op grond
      van een inkomensafhankelijke regeling in situaties waarin een of meer Nederlandse gezinsbijslagen als bedoeld
      in artikel 1, onder z) van Verordening (EG) nr. 883/2004 met toepassing van artikel 68 van die verordening en
      Verordening (EG) nr. 987/2009 worden uitbetaald in de vorm van een aanvulling op een of meer gezinsbijslagen van
      een andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0018707/2026-02-13#Artikel2a
  - number: 2a.4
    text: |-
      Bij regeling van Onze Minister worden, zo nodig met terugwerkende kracht, voor situaties waarin de Dienst
      Toeslagen op grond van artikel 6, vierde lid, van Verordening (EG) nr. 987/2009 geacht wordt retroactief bevoegd
      te zijn geweest regels gesteld met betrekking tot de aanvraag tot toekenning van een tegemoetkoming op grond
      van een inkomensafhankelijke regeling, de beslissingstermijnen die gelden voor de toekenning of herziening van
      deze tegemoetkoming alsmede in situaties die zien op een berekeningsjaar voorafgaand aan het berekeningsjaar
      2026 met betrekking tot het aanvangstijdstip van het tijdvak waarover rente wordt berekend als bedoeld in
      [artikel 27, tweede lid, van de wet][ref1] zoals dat luidde op 31 december 2025.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel27
    url: https://wetten.overheid.nl/BWBR0018707/2026-02-13#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '27'
  - number: 2b.1
    text: |-
      Als een type van beschikkingen als bedoeld in [artikel 21b, eerste lid, van de wet][ref1] wordt aangewezen een
      beschikking op grond waarvan het rechtmatig verblijf, bedoeld in [artikel 8 van de Vreemdelingenwet 2000][ref2],
      van de belanghebbende, diens partner of diens medebewoner eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel21b
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0018707/2026-02-13#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: 21b
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 2b.2
    text: |-
      De Dienst Toeslagen wordt geacht op de hoogte te zijn van de beschikking op de dag waarop die beschikking in de
      basisregistratie personen is verwerkt.
    url: https://wetten.overheid.nl/BWBR0018707/2026-02-13#Artikel2b
  - number: '3'
    text: |-
      Dit besluit treedt in werking met ingang van 1 september 2005. Indien het Staatsblad waarin dit besluit wordt
      geplaatst, wordt uitgegeven na 31 augustus 2005, treedt het in werking met ingang van de dag na de datum van
      uitgifte van het Staatsblad waarin het wordt geplaatst, en werkt terug tot en met 1 september 2005.
    url: https://wetten.overheid.nl/BWBR0018707/2026-02-13#Artikel3
  - number: '4'
    text: 'Dit besluit wordt aangehaald als: Uitvoeringsbesluit Algemene wet inkomensafhankelijke regelingen.'
    url: https://wetten.overheid.nl/BWBR0018707/2026-02-13#Artikel4
