preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw en Visserij van 17 augustus 1981, Directie Juridische en
    Bedrijfsorganisatorische Zaken, nr. J. 5559;

    Gelet op artikel 31, derde en zesde lid, van de Wet agrarisch grondverkeer (Stb. 1981, 248);

    De Raad van State gehoord (advies van 30 september 1981, nr. 810923/23);

    Gezien het nader rapport van Onze Minister van Landbouw en Visserij van 22 oktober 1981, Directie Juridische en
    Bedrijfsorganisatorische Zaken, nr. J. 6760;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003453/2015-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      "commissie": commissie beheer landbouwgronden als bedoeld in [artikel 30 van de Wet agrarisch grondverkeer][ref1]
      (*Stb.* 1981, 248);


      [ref1]: https://wetten.overheid.nl/BWBR0003386#Artikel30
    url: https://wetten.overheid.nl/BWBR0003453/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003386
        artikel: '30'
  - number: '2'
    text: |-
      In de commissie hebben zitting;

      a. de Directeur-Generaal Landbouw, Natuurbeheer en Visserij, die tevens voorzitter is;

      b. vier ambtelijke leden, onderscheidenlijk vertegenwoordigend: Onze Minister, Onze Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer, Onze Minister van Financiën en Onze Minister van Verkeer en Waterstaat;

      c. twee leden te benoemen door Onze Minister op voordracht van het Interprovinciaal Overleg;

      d. één lid, te benoemen door Onze Minister op voordracht van de Vereniging van Nederlandse Gemeenten;

      e. één lid, te benoemen door Onze Minister op voordracht van de Unie van Waterschappen;

      f. drie leden, die worden benoemd op voordracht van de Federatie van Land- en Tuinbouworganisaties Nederland;

      g. één lid, te benoemen door Onze Minister op voordracht van de Stichting Natuur en Milieu;

      h. één lid, te benoemen door Onze Minister op voordracht van de Vereniging tot behoud van Natuurmonumenten;

      i. één lid, dat benoemd wordt op voordracht van de Koninklijke Nederlandse Toeristenbond, ANWB;

      j. één lid, te benoemen door Onze Minister op voordracht van de Nederlandse Vereniging van Boseigenaren.
    url: https://wetten.overheid.nl/BWBR0003453/2015-01-01#Artikel2
  - number: '3'
    text: |-
      1 De leden hebben zitting voor het tijdvak van vijf jaren, doch uiterlijk totdat zij de pensioengerechtigde
      leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], hebben bereikt.

      2 De aftredende leden, met uitzondering van hen, die de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref2], hebben bereikt, zijn terstond herbenoembaar.

      3 Degene, die in de commissie de plaats inneemt van een lid, wiens zittingsduur nog niet verstreken was, heeft
      zitting tot het einde van die duur.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0003453/2015-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0002221
        artikel: 7a
  - number: '4'
    text: |-
      Aan de leden kan op hun verzoek dan wel, in voorkomend geval, op verzoek van de organisatie die het betrokken lid
      heeft voorgedragen ontslag worden verleend.
    url: https://wetten.overheid.nl/BWBR0003453/2015-01-01#Artikel4
  - number: '5'
    text: |-
      1 De commissie wijst uit de leden een plaatsvervangend voorzitter aan.

      2 Onze Minister kan aan de commissie een adjunct-secretaris toevoegen.
    url: https://wetten.overheid.nl/BWBR0003453/2015-01-01#Artikel5
  - number: '6'
    text: Onze Minister kan op verzoek van de commissie sub-commissies instellen.
    url: https://wetten.overheid.nl/BWBR0003453/2015-01-01#Artikel6
  - number: '7'
    text: |-
      1 De commissie vergadert zo dikwijls als de voorzitter dit wenselijk oordeelt of ten minste 3 leden dit onder
      opgaaf van redenen schriftelijk verzoeken. In het laatste geval wordt de commissie bijeengeroepen binnen een maand
      na ontvangst van het desbetreffende verzoek.

      2 De voorzitter kan, wanneer een vergadering niet voltallig is, de beslissing over zaken welke op de agenda van die
      vergadering zijn geplaatst, welke zulks naar zijn oordeel rechtvaardigen, aanhouden tot een volgende vergadering.

      3 De commissie vergadert ten minste twee maal per jaar.
    url: https://wetten.overheid.nl/BWBR0003453/2015-01-01#Artikel7
  - number: '8'
    text: |-
      1 De commissie besluit bij volstrekte meerderheid van stemmen.

      2 Elk der leden alsmede de voorzitter van de commissie beschikt over één stem.

      3 Stemming over personen geschiedt schriftelijk.

      4 Bij staking der stemmen wordt binnen vier weken een nieuwe vergadering uitgeschreven. In de oproeping voor deze
      vergadering moet het doel van deze vergadering duidelijk zijn aangegeven. Indien in de aldus te houden vergadering
      de stemmen wederom staken wordt de desbetreffende aangelegenheid aan Onze Minister voorgelegd.
    url: https://wetten.overheid.nl/BWBR0003453/2015-01-01#Artikel8
  - number: '9'
    text: |-
      Bij de werkzaamheden als bedoeld in [artikel 30, eerste lid, onder ][ref1], verricht het bureau de uitvoerende
      werkzaamheden die hier uit voortvloeien.


      [ref1]: https://wetten.overheid.nl/BWBR0003386#Artikel30
    url: https://wetten.overheid.nl/BWBR0003453/2015-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003386
        artikel: '30'
  - number: '10'
    text: |-
      De leden en adviserende leden genieten voor het bijwonen van vergaderingen een vergoeding bepaald ingevolge
      het [Vacatiegeldenbesluit 1988][ref1], alsmede een reis- en verblijfkostenvergoeding op de voet van het
      [Reisbesluit binnenland][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004317
      [ref2]: https://wetten.overheid.nl/BWBR0005889
    url: https://wetten.overheid.nl/BWBR0003453/2015-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004317
      - id: ref2
        bwb_id: BWBR0005889
  - number: '11'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin het
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0003453/2015-01-01#Artikel11
