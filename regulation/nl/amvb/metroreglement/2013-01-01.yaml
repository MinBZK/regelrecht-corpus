preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 23 april 1981, nr. A-1/V 23387, Directoraat-
    Generaal van het Verkeer;

    Gelet op artikel 27 van de Spoorwegwet en artikel 4a van de Locaalspoor- en Tramwegwet;

    De Raad van State gehoord (advies van 16 juni 1981, nr. 810610/15);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 26 oktober 1981, nr. A-1/V 27724,
    Directoraat-Generaal van het Verkeer;

    Hebben goedgevonden en verstaan: Metroreglement

    Algemeen reglement voor de stadsspoorwegen
  url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: Dit reglement kan worden aangehaald onder de titel "Metroreglement" of "MR".
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel1
  - number: '2'
    text: 'In dit reglement wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel2
  - number: 2.a
    text: 'Minister: Onze Minister van Infrastructuur en Milieu;'
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel2
  - number: 2.b
    text: |-
      ambtenaren belast met het toezicht: de ambtenaren, bedoeld in [artikel 10 van de Spoorwegwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel10
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '10'
  - number: 2.c
    text: |-
      spoorweg: spoorwegdienst als bedoeld in de [Spoorwegwet][ref1], al dan niet onder beheer van een publiekrechtelijk
      lichaam;


      [ref1]: https://wetten.overheid.nl/BWBR0001848
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001848
  - number: 2.d
    text: |-
      directie: bestuurders van een spoorwegdienst als bedoeld in [artikel 9 van de Spoorwegwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel9
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '9'
  - number: 2.e
    text: 'personeel: hoofdbeambten, beambten en bedienden van een spoorweg;'
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel2
  - number: 2.f
    text: 'chef van de trein: hij die het bevel over een trein voert;'
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel2
  - number: 2.g
    text: 'metrobestuurder: hij die een treinstel of combinatie van treinstellen bedient;'
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel2
  - number: 2.h
    text: 'machinist: hij die een locomotief bedient;'
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel2
  - number: 2.i
    text: 'voertuig: elk voertuig, al dan niet geleed, ingericht om op spoorstaven te rijden;'
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel2
  - number: 2.j
    text: |-
      bijzonder voertuig: elk voertuig dat zonder zijn lading door het begeleidend personeel met handkracht uit het spoor
      kan worden gebracht;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel2
  - number: 2.k
    text: 'rollend materieel: elk voertuig, geen bijzonder voertuig zijnde;'
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel2
  - number: 2.l
    text: 'krachtvoertuig: rollend materieel, voorzien van een eigen voortbewegingsinrichting;'
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel2
  - number: 2.m
    text: |-
      locomotief: krachtvoertuig, hoofdzakelijk bestemd om andere voertuigen voort te bewegen en niet zelf ingericht voor
      het vervoer van personen, of een combinatie van die krachtvoertuigen die van één punt uit worden bediend;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel2
  - number: 2.n
    text: |-
      treinstel: krachtvoertuig of verscheidene semi-permanent gekoppelde voertuigen waarvan ten minste één een
      krachtvoertuig is, hoofdzakelijk ingericht voor het vervoer van personen;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel2
  - number: 2.o
    text: |-
      motorwagenstel: krachtvoertuig of verscheidene semi-permanent gekoppelde voertuigen waarvan ten minste één een
      krachtvoertuig is, hoofdzakelijk bestemd voor andere doeleinden dan het voortbewegen van andere voertuigen en niet
      hoofdzakelijk ingericht voor het vervoer van personen;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel2
  - number: 2.p
    text: |-
      rijtuig: rollend materieel zonder eigen voortbewegingsinrichting, geheel of gedeeltelijk ingericht voor het vervoer
      van personen;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel2
  - number: 2.q
    text: 'wagen: rollend materieel zonder eigen voortbewegingsinrichting, geen rijtuig zijnde;'
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel2
  - number: 2.r
    text: |-
      trein: een krachtvoertuig - indien met andere voertuigen verbonden, daarmede een geheel vormende - dat zich naar of
      op een hoofdspoor of een door de directie aangewezen ander spoor beweegt of gaat bewegen;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel2
  - number: 2.s
    text: |-
      rangeerdeel: een krachtvoertuig, rijtuig of wagen, of een aantal van deze voertuigen aaneengesloten, geen trein
      zijnde;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel2
  - number: 2.t
    text: |-
      station: gedeelte van een spoorweg, hoofdzakelijk bestemd en ingericht om reizigers te laten in- en uitstappen, met
      inbegrip van de toeleidende trappen en andere toegangen;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel2
  - number: 2.u
    text: |-
      hoofdspoor: een spoor dat in gewone omstandigheden door reizigerstreinen wordt bereden, alsmede een door de
      directie als zodanig aangewezen spoor;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel2
  - number: 2.v
    text: 'baanvak: gedeelte van de spoorweg tussen twee met name genoemde punten;'
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel2
  - number: 2.w
    text: |-
      periode van duisternis: het gehele etmaal in tunnelgedeelten en de tijd tussen een half uur na zonsondergang en een
      half uur voor zonsopgang op de overige gedeelten van de spoorweg;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel2
  - number: 2.x
    text: |-
      ATB: systeem van automatische treinbeïnvloeding waarbij door middel van cabineseinen aan de metrobestuurder
      of machinist doorlopend de toegestane snelheid kenbaar wordt gemaakt, de werkelijke snelheid doorlopend wordt
      gecontroleerd en bij overschrijding van de toegestane snelheid automatisch hetzij de werkelijke snelheid ten minste
      wordt teruggebracht tot de toegestane waarde, hetzij de trein tot stilstand wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel2
  - number: 2.y
    text: |-
      ATO: systeem van automatische treinbesturing waarbij alle handelingen van de metrobestuurder of machinist met
      betrekking tot het rijden van de trein automatisch door de apparatuur worden verricht.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel2
  - number: '3'
    text: |-
      Dit reglement is van toepassing op de ingevolge [artikel 1, eerste lid, van de Locaalspoor- en Tramwegwet][ref1]
      door de Minister als stadsspoorweg aangewezen spoorwegen.


      [ref1]: https://wetten.overheid.nl/BWBR0001866#Artikel1
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001866
        artikel: '1'
  - number: '4'
    text: |-
      Ten aanzien van spoorwegen onder beheer van een publiekrechtelijk lichaam worden voor de naleving van dit besluit
      als bestuurders, bedoeld in [artikel 9 van de Spoorwegwet][ref1], aangemerkt zij die door dit publiekrechtelijk
      lichaam aan het hoofd van de spoorweg zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel9
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '9'
  - number: '5'
    text: |-
      Voor proefnemingen met betrekking tot het gebruik, de inrichting en de bediening van het rollend materieel en het
      gebruik van technische systemen en hulpmiddelen voor de uitoefening van de dienst over de spoorweg, kan de Minister
      voor een door hem te bepalen termijn ontheffing verlenen of afwijkingen toestaan van bepalingen van dit reglement.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel5
  - number: '6.1'
    text: |-
      Waar in dit reglement aan de Minister de bevoegdheid is toegekend afwijkingen toe te staan of ontheffing te
      verlenen van bepalingen van dit reglement, kunnen aan die afwijkingen of ontheffingen voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel6
  - number: '6.2'
    text: |-
      Het niet naleven van de gestelde voorwaarden staat gelijk met overtreding van de bepalingen waarvan afwijking werd
      toegestaan of ontheffing werd verleend.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel6
  - number: '7.1'
    text: |-
