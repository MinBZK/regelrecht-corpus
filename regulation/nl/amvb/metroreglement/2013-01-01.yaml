  - number: 7.1.a
    text: aanvullende voorwaarden stellen;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel7
  - number: 7.1.b
    text: voorschriften geven omtrent de uitoefening van deze bevoegdheden;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel7
  - number: 7.1.c
    text: |-
      de directie opdragen de op grond van die bevoegdheden getroffen maatregelen op te heffen, indien naar zijn mening
      de in genoemde artikelen en ingevolge *a.* gestelde voorwaarden niet vervuld waren of niet meer vervuld zijn.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel7
  - number: '7.2'
    text: De directie is verplicht aan deze voorschriften en opdrachten te voldoen.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel7
  - number: '7.3'
    text: |-
      De directie geeft terzake van de uitoefening van de haar toegekende bevoegdheden desgevraagd kennis aan de
      Minister.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel7
  - number: '8.1'
    text: |-
      De naam van elk station is met duidelijke, vanuit de trein leesbare letters aangeduid; de toegangen zijn door een
      door de directie vastgesteld uniform kenteken aangeduid.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel8
  - number: '8.2'
    text: |-
      Elk station is voorzien van één of meer klokken die de juiste tijd aanwijzen; deze worden zolang de reizigersdienst
      duurt, behoorlijk verlicht.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel8
  - number: '8.3'
    text: |-
      Aan beide einden van een roltrap of rolpad is opvallend en voor ieder voldoende bereikbaar een inrichting aanwezig,
      waarmee de roltrap- of rolpadmachine tot stilstand kan worden gebracht. Nabij deze inrichting is het opschrift
      "Noodrem" aangebracht, alsmede een aanduiding dat misbruik strafbaar is.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel8
  - number: '8.4'
    text: |-
      De perrons liggen ten hoogste 7 cm lager of ten hoogste 3 cm hoger dan de rijtuigvloer ter plaatse van de
      voor reizigers toegankelijke deuren van de treinstellen. Indien aan een perroneinde een verticale boog in het
      perronspoor noodzakelijk is, mogen deze waarden over een lengte van ten hoogste 15 m vanaf het einde van het perron
      10 cm onderscheidenlijk 6 cm bedragen.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel8
  - number: '8.5'
    text: Indien horizontale bogen in perronsporen noodzakelijk zijn, bedraagt de boogstraal ten minste 400 m.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel8
  - number: '8.6'
    text: |-
      De afstand tussen de perronrand en de rand van de vloer van het rijtuig of het treinstel ter plaatse van het midden
      van een voor reizigers toegankelijke deuropening is bij een boogstraal van 400 m ten hoogste 15 cm, bij bogen met
      grotere straal en op recht spoor dienovereenkomstig kleiner.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel8
  - number: '8.7'
    text: De Minister kan van het bepaalde in de voorafgaande leden in bijzondere gevallen afwijkingen toestaan.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel8
  - number: '8.8'
    text: De Minister kan, de directie gehoord, nadere voorschriften geven omtrent de technische inrichting van de stations.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel8
  - number: '9.1'
    text: |-
      De normale wijdte van het spoor, gemeten tussen de binnenzijden van de spoorstaafkoppen, bedraagt 1435 mm. De
      wijdte mag niet minder zijn dan 1430 mm en - in bogen met inbegrip van spoorverwijding - niet meer zijn dan 1470
      mm.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel9
  - number: '9.2'
    text: |-
      De bovenbouw, de aardebaan en de kunstwerken zijn zodanig uitgevoerd, dat zij met de ter plaatse toegelaten
      snelheid veilig kunnen worden bereden door voertuigen met een asbelasting van 12 t of een gewicht van 2 t per
      strekkende meter; hierbij is de ongunstige belasting bepalend. De directie kan hogere waarden voorschrijven, de
      Minister kan lagere waarden toestaan.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel9
  - number: '9.3'
    text: |-
      De spoorweg is zodanig ingericht, dat de reizigers zo nodig een trein kunnen verlaten en het dichtstbijzijnde
      station, een nooduitgang of een plaats die bereikbaar is vanaf de voor het openbaar verkeer openstaande weg kunnen
      bereiken.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel9
  - number: '9.4'
    text: |-
      Langs de spoorweg zijn aanduidingen aanwezig die de afstand tot een beginstation in kilometers en hectometers
      aangeven; in bijzondere gevallen kan een ander beginpunt worden aangenomen.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel9
  - number: '10.1'
    text: |-
      Als de afstand tussen de perroneinden van twee opeenvolgende ondergrondse stations, c.q. het perroneinde van een
      ondergronds station en een tunnelingang, meer dan 900 m bedraagt, zijn ten genoegen van de Minister één of meer
      nooduitgangen aangebracht. Deze zijn door blauw licht aangeduid.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel10
  - number: '10.2'
    text: De Minister kan afwijkingen toestaan van het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel10
  - number: '10.3'
    text: |-
      In tunnelgedeelten moet een verlichtingsinstallatie aanwezig zijn, die in de as van de in
      [artikel 9, derde lid][ref1], bedoelde vluchtweg een verlichtingssterkte heeft van ten minste 0,2 lux, gemeten
      op 1 m boven de weg. Bij uitvallen van de tunnelverlichting wordt automatisch een noodverlichting met ten minste
      bovengenoemde lichtsterkte ingeschakeld. Deze noodverlichtingsinstallatie is zodanig uitgevoerd dat zij ten minste
      één uur na het uitvallen van de netspanning licht uitstraalt.


      [ref1]: https://wetten.overheid.nl/BWBR0003454#Artikel9
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003454
        artikel: '9'
        hoofdstuk: II
        afdeling: II
  - number: '11'
    text: Beweegbare bruggen zijn niet toegelaten. De Minister kan van dit verbod in bijzondere gevallen ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel11
  - number: '12.1'
    text: |-
      De profielen van vrije ruimte van elke spoorweg worden door de Minister, de directie gehoord, vastgesteld,
      geldend voor een boog met een door hem bepaalde straal (referentieboog). Hij bepaalt daarbij in hoeverre de
      halve breedtematen in bogen met kleinere straal worden vermeerderd en in bogen met grotere straal kunnen worden
      verminderd.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel12
  - number: '12.2'
    text: |-
      De hartlijn van het profiel van vrije ruimte valt samen met de hartlijn van het spoor en staat loodrecht op het
      vlak door de bovenkanten van de spoorstaven.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel12
  - number: '12.3'
    text: |-
      Binnen dit profiel mogen zich geen vaste voorwerpen bevinden, tenzij deze voor de veiligheid van het verkeer niet
      hinderlijk zijn en door de directie zijn toegelaten.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel12
  - number: '12.4'
    text: |-
      Tussen twee samenlopende of elkander kruisende sporen wordt op de door de directie te bepalen wijze de grens
      aangeduid tot waar voertuigen zich op het ene spoor mogen bevinden, wanneer voertuigen zich over het andere spoor
      naar die grens bewegen.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel12
  - number: '13.1'
    text: |-
      Indien voor de stroomtoevoer naar de krachtvoertuigen stroomrails worden gebruikt, moeten deze door
      isolatiemateriaal zijn afgeschermd aan de bovenzijde en zodanig aan beide zijkanten, dat onbedoelde zijdelingse
      aanraking wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel13
  - number: '13.2'
    text: |-
      Het isolatiemateriaal moet voldoende isolatieweerstand hebben en overigens voldoen aan door de Minister, de
      directie gehoord, te stellen sterkte-eisen.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel13
  - number: '13.3'
    text: De Minister kan voor bepaalde spoorweggedeelten afwijkingen van het bepaalde in het eerste lid toestaan.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel13
  - number: '14.1'
    text: |-
      De directie draagt zorg dat de spoorweg met zijn vaste voorzieningen zodanig wordt onderhouden dat hij veilig kan
      worden bereden.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel14
  - number: '14.2'
    text: |-
      De directie regelt de schouw van de sporen, wissels, kruisingen, elektrische verbindingen aan spoorstaven en van de
      seininrichtingen, alsmede de schouw hetzij van de bovenleiding, hetzij van de isolatie van de stroomrails.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel14
  - number: '14.3'
    text: De directie treft maatregelen opdat punten waar gevaar dreigt voortdurend worden bewaakt.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel14
  - number: '14.4'
    text: |-
      De Minister kan voor hoofdsporen aanvullende maatregelen voorschrijven ter bevordering van het opsporen van
      spoorstaafgebreken.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel14
  - number: '15'
    text: |-
      Het is aan anderen dan de directie verboden zonder vergunning, verleend door of namens de Minister, op, in, boven
      of onder de spoorweg leidingen, werken, andere inrichtingen of beplantingen aan te brengen, te doen aanbrengen of
      te hebben, dan wel daarmede verband houdende werkzaamheden uit te voeren of te doen uitvoeren.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel15
  - number: '16.1'
    text: |-
      De spoorweg is afgesloten, tenzij de sporen zijn gelegen op een viaduct of op keermuren en wel op een hoogte van
      ten minste 3 m boven het maaiveld.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel16
  - number: '16.2'
    text: De hoogte van de afsluiting is ten minste 1,20 m.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel16
  - number: '16.3'
    text: |-
      De Minister kan voor de inrichting van de afsluitingen, bedoeld in het tweede lid, aanwijzingen geven en in
      bijzondere gevallen andere afmetingen voorschrijven of toestaan.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel16
  - number: '17'
    text: |-
      Gelijkvloerse kruisingen met openbare of niet-openbare wegen of paden zijn niet toegestaan. De Minister kan van dit
      verbod in bijzondere gevallen ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel17
  - number: '18'
    text: |-
      Op door de Minister krachtens het bepaalde in [artikel 17][ref1] toegestane gelijkvloerse
      kruisingen in niet voor het openbaar verkeer openstaande wegen zijn de bepalingen van
      [artikel 24 van het Reglement Dienst Hoofd- en Lokaalspoorwegen][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003454#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003083#Artikel24
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003454
        artikel: '17'
        hoofdstuk: II
        afdeling: III
      - id: ref2
        bwb_id: BWBR0003083
        artikel: '24'
  - number: '19'
    text: |-
      Spoorwegovergangen ten behoeve van de spoorwegdienst gelden niet als kruisingen in [de zin van artikel 17][ref1].
      De directie schrijft de nodige maatregelen voor in het belang van de veiligheid bij het gebruik van deze
      overgangen.


      [ref1]: https://wetten.overheid.nl/BWBR0003454#Artikel17
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003454
        artikel: '17'
        hoofdstuk: II
        afdeling: III
  - number: '20'
    text: |-
      Behoudens door de Minister te verlenen ontheffing zijn de hoofdsporen uitgerust met apparatuur van ATB of ATO. De
      ATB of ATO voldoet tenminste aan door de Minister te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel20
  - number: '21.1'
    text: 'Door een bedienbaar vast sein dat "stop" kan tonen zijn beveiligd:'
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel21
  - number: 21.1.a
    text: wissels in hoofdsporen;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel21
  - number: 21.1.b
    text: kruisingen op gelijke hoogte van hoofdsporen of van een hoofdspoor met een ander spoor.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel21
  - number: '21.2'
    text: |-
      Het in het eerste lid bedoelde sein kan achterwege blijven als een systeem van ATB of ATO het berijden van het
      wissel of de kruising slechts toelaat wanneer dit veilig kan geschieden. De plaats waar de trein of het rangeerdeel
      moet stoppen als het wissel of de kruising niet veilig kan worden bereden, is dan door een vast sein aangeduid,
      behoudens door de Minister te verlenen ontheffing.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel21
  - number: '21.3'
    text: |-
      Aansluitingen van een hoofd- en lokaalspoorweg of tramweg aan een hoofdspoor van een stadsspoorweg zijn beveiligd
      door een daarvoor geplaatst bedienbaar vast sein dat "stop" kan tonen.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel21
  - number: '21.4'
    text: |-
      De Minister bepaalt, in voorkomend geval in afwijking van [artikel 12 van het Tramwegreglement][ref1], op welke
      wijze de beveiliging geschiedt van een kruising op gelijke hoogte van een stadsspoorweg met een voor openbaar
      vervoer opengestelde andere spoorweg. De directie bepaalt dit ten aanzien van een kruising op gelijke hoogte met
      een niet voor openbaar vervoer opengestelde spoorweg.


      [ref1]: https://wetten.overheid.nl/BWBR0001898#Artikel12
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001898
        artikel: '12'
  - number: '22.1'
    text: |-
      De beschrijving van de beelden, getoond door de in deze afdeling bedoelde seinen, alsmede de akoestische
      seinen, de betekenis van vorengenoemde seinen en, voor zover daartoe aanleiding bestaat, voorschriften voor het
      gebruik mede in verband met de weersomstandigheden, worden opgenomen in een afzonderlijke afdeling van het in
      [artikel 6 van de Spoorwegwet][ref1] bedoelde dienstreglement, genaamd: Seinreglement.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel6
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '6'
  - number: '22.2'
    text: |-
      De plaats van de in deze afdeling bedoelde vaste seinen en, voor zover bedienbaar, de bedieningswijze ervan worden
      omschreven in voorschriften, die aan de Minister worden toegezonden.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel22
  - number: '23'
    text: |-
      De directie wijst de plaatsen aan, waar aan naderende treinen of rangeerdelen een stopsein moet kunnen worden
      gegeven.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel23
  - number: '24.1'
    text: |-
      Indien op een hoofdspoor voor een vast sein moet worden gestopt, legt de voorafgaande seingeving of een cabinesein
      een zodanige snelheidsvermindering op, dat de trein voor dit stoptonende sein tot stilstand kan worden gebracht.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel24
  - number: '24.2'
    text: |-
      Het in het eerste lid bepaalde geldt eveneens op andere sporen dan hoofdsporen, tenzij het sein zichtbaar is op een
      afstand die ten minste 1,1 maal de ter plaatse benodigde remweg bedraagt.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel24
  - number: '25.1'
    text: |-
      Tussen een wissel, gelegen in een hoofdspoor, en een ingevolge het bepaalde in
      [artikel 21, eerste of derde lid][ref1], daarvoor geplaatst sein, of het in de cabine van een naderende trein
      getoonde sein moet een zodanig verband bestaan, dat als dat sein resp. dit cabinesein het voorbijrijden toelaat,
      het wissel niet kan worden omgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003454#Artikel21
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003454
        artikel: '21'
        hoofdstuk: II
        afdeling: IV
  - number: '25.2'
    text: |-
      Wanneer een wissel in een hoofdspoor tegen de punt wordt bereden, moet tussen dat wissel en een daarvoor geplaatst
      vast sein of het in de cabine van een naderende trein getoond sein een zodanig verband bestaan, dat de juiste stand
      van de wisseltongen verzekerd is.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel25
  - number: '25.3'
    text: |-
      De directie kan bepalen, dat het in het eerste en tweede lid bedoelde verband achterwege blijft, mits bij het
      doorrijden van treinen over een hoofdspoor de wissels met een slot gesloten of bewaakt zijn.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel25
  - number: '25.4'
    text: |-
      Indien een wissel in een hoofdspoor normaal tegen de punt wordt bereden, zijn voorzieningen aanwezig die het
      omleggen beletten tijdens het berijden tegen de punt. Onder "normaal bereden" wordt ook verstaan het geval, bedoeld
      in [artikel 56, tweede lid, onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003454#Artikel56
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003454
        artikel: '56'
        hoofdstuk: IV
  - number: '25.5'
    text: |-
      Tussen de seinen, geplaatst ingevolge het bepaalde in [artikel 21, eerste en derde lid][ref1], bestaat een zodanig
      verband dat deze seinen alleen een seinbeeld dat voorbij rijden toestaat kunnen tonen, wanneer daardoor geen
      treinen met elkaar of met een rangeerdeel in botsing kunnen komen.


      [ref1]: https://wetten.overheid.nl/BWBR0003454#Artikel21
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003454
        artikel: '21'
        hoofdstuk: II
        afdeling: IV
  - number: '26.1'
    text: |-
      Elk station is voorzien van een toestel waarmee een spreekverbinding met de centrale treindienstleiderspost snel
      tot stand kan worden gebracht.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel26
  - number: '26.2'
    text: De directie bepaalt welke overige verbindingen nodig zijn.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel26
  - number: '26.3'
    text: |-
      In de bediende cabine van een trein, opengesteld voor reizigers niet zijnde personeelsleden is apparatuur aanwezig
      waarmee een spreekverbinding met de centrale treindienstleiderspost tot stand kan worden gebracht. Betreft het een
      radio-telefonische spreekverbinding, dan worden hiervoor één of meer vrije frequenties gebruikt, tenzij de Minister
      anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel26
  - number: '26.4'
    text: De Minister kan voor bepaalde baanvakken ontheffing van de in het derde lid genoemde verplichting verlenen.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel26
  - number: '27'
    text: |-
      De directie draagt zorg dat de constructie van het rollend materieel zodanig is dat het op de voor dit rollend
      materieel bestemde baanvakken met de hoogste daarvoor toegelaten snelheid en belasting veilig kan rijden.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel27
  - number: '28.1'
    text: |-
      De Minister stelt voor elke spoorweg, de directie gehoord, het kinematisch omgrenzingsprofiel vast, geldend voor
      de in [artikel 12, eerste lid][ref1], bedoelde referentieboog. Het rollend materieel blijft met alle daaraan
      bevestigde losse delen, bij een gelijkmatig verdeelde, volle, belasting, in bogen met een straal gelijk aan of
      groter dan de hierboven bedoelde referentieboog, binnen dit profiel.


      [ref1]: https://wetten.overheid.nl/BWBR0003454#Artikel12
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003454
        artikel: '12'
        hoofdstuk: II
        afdeling: II
  - number: '28.2'
    text: |-
      Bij de bepaling van het kinematisch omgrenzingsprofiel wordt ervan uitgegaan, dat de hartlijn van dit profiel
      samenvalt met de hartlijn van het spoor met een spoorwijdte van 1435 mm, waarbij deze hartlijn loodrecht staat op
      het vlak door de bovenkant van de spoorstaven.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel28
  - number: '28.3'
    text: |-
      Bij de bepaling van de afmetingen van het rollend materieel wordt uitgegaan van het in het eerste lid bepaalde en
      rekening gehouden met:
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel28
  - number: 28.3.a
    text: |-
      geometrische verplaatsingen ten gevolge van de instelling van dat materieel in nieuw spoor, slijtagefactoren van
      dat materieel en verticale verplaatsingen ervan;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel28
  - number: 28.3.b
    text: horizontale verplaatsingen ten gevolge van statisch overhellen van dat materieel bij een verkanting van 150 mm.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel28
  - number: '29'
    text: |-
      Bij elke snelheid van het rollend materieel mag de belasting van de bovenbouw, de aardebaan en de kunstwerken door
      het rollend materieel de bij die snelheid toegelaten waarde niet overschrijden.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel29
  - number: '30'
    text: |-
      Bij twee-assige voertuigen bedraagt de verhouding van de asafstand tot de voertuiglengte, gemeten over de buffers,
      ten minste 0.45. Het rollend materieel moet bogen met een straal van 150 m bij een spoorbreedte van 1435 mm kunnen
      berijden.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel30
  - number: '31'
    text: |-
      De afstand tussen de binnenste vlakke zijden van de wielen van een as bedraagt ter hoogte van de bovenkant van de
      spoorstaaf ten minste 1357 mm en ten hoogste 1363 mm.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel31
  - number: '32.1'
    text: |-
      Wielen bestaan hetzij uit één stuk van wals- of smeedstaal, hetzij uit een wielkern van wals of smeedstaal met
      een stalen wielband van ten minste 25 mm dikte en een breedte van ten minste 130 mm en ten hoogste 140 mm. Bij
      volwielen wordt de minimumdikte van de delen die de wielband vervangen, aangegeven door een in de buitenzijde van
      het wiel ingedraaide groef.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel32
  - number: '32.2'
    text: |-
      Voor wielen, voorzien van een verende stof tussen wielkern en wielband, gelden de volgende eisen onverminderd het
      elders bepaalde:
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel32
  - number: 32.2.a
    text: de wielband mag in normaal bedrijf niet vervormen;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel32
  - number: 32.2.b
    text: overbrenging van de wieldruk mag geen blijvende vervorming van de verende stof ten gevolge hebben;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel32
  - number: 32.2.c
    text: |-
      remblokken op de wielband zijn slechts toegelaten, als de vering bij de in normaal bedrijf daaraan gestelde eisen
      gewaarborgd blijft;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel32
  - number: 32.2.d
    text: |-
      ten aanzien van het axiale verenspel is de horizontale verplaatsing van de wielkern ten opzichte van de binnenzijde
      van de wielband niet groter dan 5 mm;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel32
  - number: 32.2.e
    text: er is een betrouwbare elektrische verbinding tussen wielband en voertuigmassa.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel32
  - number: '33'
    text: |-
      De constructie van de afvering is zodanig dat bij breuk van een onderdeel hiervan of bij defecte luchtvering het
      voertuig niet op ongewenste wijze met andere voertuigen of met vaste voorwerpen in aanraking komt.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel33
  - number: '34'
    text: 'Op het rollend materieel zijn aangegeven:'
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel34
  - number: 34.a
    text: serienummer van het voertuig;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel34
  - number: 34.b
    text: eigen gewicht;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel34
  - number: 34.c
    text: totale gewicht bij maximaal toelaatbare belasting;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel34
  - number: 34.d
    text: |-
      remgewicht, indien het voertuig met in dienst zijnde rem mag rijden op andere spoorwegen waarop de
      [Spoorwegwet][ref1] of de [Locaalspoor- en Tramwegwet][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0001848
      [ref2]: https://wetten.overheid.nl/BWBR0001866
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0001848
      - id: ref2
        bwb_id: BWBR0001866
  - number: '35'
    text: |-
      Alvorens rollend materieel wordt aangeschaft wordt het type door de directie geaccordeerd. Op de desbetreffende
      tekeningen op een schaal van ten minste 1:100 worden onder meer aangegeven:
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel35
  - number: 35.a
    text: |-
      voor treinstellen en rijtuigen: het aantal staan- en zitplaatsen in elke afdeling en het aantal klapzittingen op
      elk balkon;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel35
  - number: 35.b
    text: 'voor wagens: het draagvermogen voor vervoer van goederen.'
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel35
  - number: '36.1'
    text: Rollend materieel wordt niet in dienst gesteld dan na door de directie te zijn onderzocht en geaccordeerd.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel36
  - number: '36.2'
    text: |-
      De akkoordverklaring blijkt hetzij uit inschrijving in een hiertoe dienend register met volgnummer, datum van
      akkoordverklaring en datum van indienststelling, hetzij door een gedagtekende en ondertekende verklaring van de
      keurmeester, opgenomen in de in [artikel 40][ref1] bedoelde administratie.


      [ref1]: https://wetten.overheid.nl/BWBR0003454#Artikel40
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003454
        artikel: '40'
        hoofdstuk: III
        afdeling: I
  - number: '37'
    text: 'In een album, dat steeds wordt bijgehouden, worden vermeld:'
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel37
  - number: 37.A
    text: 'voor al het rollend materieel:'
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel37
  - number: 37.A.1
    text: volgnummer, naam en woonplaats van de fabrikant en het jaar waarin het voertuig is afgeleverd;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel37
  - number: 37.A.2
    text: korte omschrijving van het voertuig;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel37
  - number: 37.A.3
    text: type van de zelfwerkende rem;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel37
  - number: 37.A.4
    text: gewicht van het voertuig in dienstvaardige toestand en de grootste asdruk;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel37
  - number: 37.A.5
    text: |-
      remgewicht, indien het voertuig met in dienst gestelde rem mag rijden op andere spoorwegen waarop de
      [Spoorwegwet][ref1] of de [Locaalspoor- en Tramwegwet][ref2] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0001848
      [ref2]: https://wetten.overheid.nl/BWBR0001866
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0001848
      - id: ref2
        bwb_id: BWBR0001866
  - number: 37.A.6
    text: constructief toegestane snelheid;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel37
  - number: 37.B
    text: 'voor krachtvoertuigen, al dan niet rechtstreeks voortbewogen door een of meer verbrandingsmotoren:'
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel37
  - number: 37.B.1
    text: type en hoofdafmetingen van de motoren;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel37
  - number: 37.B.2
    text: grootste toegelaten aantal omwentelingen van de motoren per minuut;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel37
  - number: 37.B.3
    text: continuvermogen van de motoren in kW;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel37
  - number: 37.B.4
    text: type van koelinrichting;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel37
  - number: 37.B.5
    text: inhoud van de brandstoftanks;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel37
  - number: 37.B.6
    text: type van de krachtoverbrenging tussen de motoren en de aangedreven assen;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel37
  - number: 37.C
    text: 'voor krachtvoertuigen voortbewogen door een of meer elektromotoren:'
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel37
  - number: 37.C.1
    text: type en maximumspanning van de tractiemotoren;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel37
  - number: 37.C.2
    text: grootste toegelaten aantal omwentelingen van de tractiemotoren per minuut;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel37
  - number: 37.C.3
    text: aantal en continuvermogen van de tractiemotoren in kW.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel37
  - number: '38'
    text: |-
      Wijziging van de inrichting van rollend materieel waardoor wordt afgeweken van de in [artikel 35][ref1] bedoelde
      tekeningen, dan wel wijziging van de bestemming, behoeft de instemming van de directie.


      [ref1]: https://wetten.overheid.nl/BWBR0003454#Artikel35
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003454
        artikel: '35'
        hoofdstuk: III
        afdeling: I
  - number: '39.1'
    text: |-
      Rollend materieel wordt volgens een door de directie geaccordeerd schema voor periodiek onderhoud nauwkeurig
      onderzocht en in een zodanige staat gehouden, dat de daaruit samengestelde treinen en rangeerdelen te allen tijde
      veilig kunnen rijden.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel39
  - number: '39.2'
    text: |-
      De directie doet, wanneer hiertoe aanleiding ontstaat, bepaalde voertuigen c.q. bepaalde onderdelen vaker nazien
      dan in het bovenbedoelde schema is aangegeven.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel39
  - number: '40.1'
    text: |-
      Van rollend materieel wordt een administratie gevoerd, waarbij van elk krachtvoertuig, van elk rijtuig en van elke
      wagen worden aangetekend
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel40
  - number: 40.1.a
    text: serie- en volgnummer;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel40
  - number: 40.1.b
    text: naam van de fabrikant;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel40
  - number: 40.1.c
    text: |-
      datum van akkoordverklaring, indien deze niet in een register, als bedoeld in [artikel 36][ref1], is ingeschreven;


      [ref1]: https://wetten.overheid.nl/BWBR0003454#Artikel36
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003454
        artikel: '36'
        hoofdstuk: III
        afdeling: I
  - number: 40.1.d
    text: datum van indienststelling;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel40
  - number: 40.1.e
    text: wijzigingen en belangrijke herstellingen;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel40
  - number: 40.1.f
    text: |-
      data waarop het materieel voor [de onder ][ref1] bedoelde voorzieningen in de werkplaats werd opgenomen en daarna
      weer in dienst gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003454#Artikel40
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003454
        artikel: '40'
        hoofdstuk: III
        afdeling: I
  - number: '40.2'
    text: |-
      De directie draagt zorg, dat van de assen, alsmede van de wielen indien deze afzonderlijk worden beheerd, een
      administratie wordt gevoerd, waaruit o.m. blijkt:
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel40
  - number: 40.2.a
    text: samenstelling van het materiaal;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel40
  - number: 40.2.b
    text: naam van de fabrikant;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel40
  - number: 40.2.c
    text: datum van indienststelling.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel40
  - number: '41.1'
    text: |-
      Voor het dienst doen op hoofdsporen van rollend materieel - hetzij van andere Stadsspoorwegen,
        - hetzij van Spoorwegen waarop dit reglement niet van toepassing is, is instemming van de Minister vereist.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel41
  - number: '41.2'
    text: |-
      Het in het eerste lid bepaalde is niet van toepassing op rollend materieel dat ten behoeve van werkzaamheden op
      de Stadsspoorweg wordt toegelaten en dat niet aan de Spoorweg toebehoort. De directie stelt voorwaarden vast voor
      het toelaten van dit materieel, waarbij met toestemming van de Minister mag worden afgeweken van het bepaalde van
      dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel41
  - number: '42'
    text: De Minister kan om bijzondere redenen afwijkingen van het bepaalde in dit hoofdstuk toestaan.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel42
  - number: '43.1'
    text: Elk krachtvoertuig is voorzien van
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel43
  - number: 43.1.a
    text: |-
      een handrem, veerrem of andere vastzetrem, die het in beweging komen van het krachtvoertuig op de steilste helling
      van de spoorweg verhindert - zulks onverminderd het bepaalde in [artikel 46, tweede lid][ref1] - en waarvan
      de bediening onafhankelijk is van die van de reminrichtingen, bedoeld in [artikel 46, eerste lid][ref2], en
      [artikel 52, eerste lid][ref3]; indien een cabine aanwezig is, is de vastzetrem van hieruit bedienbaar;


      [ref1]: https://wetten.overheid.nl/BWBR0003454#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0003454#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0003454#Artikel52
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0003454
        artikel: '46'
        hoofdstuk: III
        afdeling: II
      - id: ref2
        bwb_id: BWBR0003454
        artikel: '46'
        hoofdstuk: III
        afdeling: II
      - id: ref3
        bwb_id: BWBR0003454
        artikel: '52'
        hoofdstuk: IV
  - number: 43.1.b
    text: |-
      een rem, aangesloten op het doorgaande zelfwerkende remsysteem als bedoeld in [artikel 52, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003454#Artikel52
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0003454
        artikel: '52'
        hoofdstuk: IV
  - number: 43.1.c
    text: een brandblusapparaat.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel43
  - number: '43.2'
    text: |-
      Onverminderd het in het eerste lid voorgeschrevene is elk met een of meer cabines uitgerust krachtvoertuig voorzien
      van:
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel43
  - number: 43.2.a
    text: een van uit de cabine(s) bedienbare inrichting om geluidsseinen te geven;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel43
  - number: 43.2.b
    text: |-
      een van uit de cabine(s) bedienbare inrichting om het in [artikel 52, eerste lid][ref1], bedoelde doorgaande
      zelfwerkende remsysteem te bedienen en te controleren, indien het krachtvoertuig is bestemd voor het vervoeren van
      treinen met een doorgaand zelfwerkend remsysteem;


      [ref1]: https://wetten.overheid.nl/BWBR0003454#Artikel52
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0003454
        artikel: '52'
        hoofdstuk: IV
  - number: 43.2.c
    text: |-
      een snelheidsmeter in elke cabine, indien de grootste toegelaten snelheid van het krachtvoertuig meer dan 30 km/
      h bedraagt;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel43
  - number: 43.2.d
    text: |-
      de apparatuur van het door de Minister geaccordeerde systeem van ATB en ATO, wanneer het krachtvoertuig dienst doet
      op met ATB onderscheidenlijk ATO uitgeruste baanvakken;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel43
  - number: 43.2.e
    text: |-
      een inrichting die, wanneer hij niet voortdurend of met korte tussenpozen door de metrobestuurder of machinist
      wordt bediend, het krachtvoertuig automatisch tot stilstand brengt; deze inrichting mag buiten bedrijf zijn gesteld
      als het krachtvoertuig rijdt met een in dienst zijnd systeem van ATO.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel43
  - number: '43.3'
    text: |-
      De Minister kan ontheffing verlenen van het bepaalde in het tweede lid sub *e*, onverminderd het bepaalde in art.
      69, vierde lid.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel43
  - number: '43.4'
    text: Bij storing van het ATB- of ATO-systeem komen de hierbij betrokken krachtvoertuigen automatisch tot stilstand.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel43
  - number: '43.5'
    text: |-
      Alle in het krachtvoertuig ten behoeve van de voortbeweging dienstdoende motoren kunnen door de metrobestuurder
      of machinist vanuit elke cabine - indien aanwezig - van het krachtvoertuig zelf worden beheerst; daarenboven
      zijn voorzieningen toegelaten die het mogelijk maken dat de bedoelde beheersing, alsmede die van de inrichtingen,
      bedoeld in het tweede lid onder *a*, *b*, en *e*, geschiedt vanuit de cabine van een ander voertuig in de trein
      of het rangeerdeel, dan wel op andere wijze van buitenaf; in laatstgenoemd geval voldoet de apparatuur aan door de
      Minister te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel43
  - number: '43.6'
    text: 'Bij krachtvoertuigen voortbewogen door een of meer verbrandingsmotoren zijn:'
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel43
  - number: 43.6.a
    text: |-
      de brandstoftanks en de brandstofleidingen zodanig ingericht, dat daarin geen ongewenste overdruk kan ontstaan en
      dat de kans op het ontstaan van lekken zoveel mogelijk wordt beperkt;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel43
  - number: 43.6.b
    text: |-
      de ruimten waarin deze tanks zijn aangebracht van het inwendige van het krachtvoertuig door dichte, onbrandbare
      wanden gescheiden en zodanig ingericht, dat buiten de tanks geraakte vloeibare brandstof of brandbare gassen
      onmiddellijk buiten het krachtvoertuig worden afgevoerd;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel43
  - number: 43.6.c
    text: |-
      de leidingen voor de afvoer van afgewerkte motorgassen, voor zover zij zich in de inwendige ruimte van het
      krachtvoertuig bevinden, niet onderbroken en waar zij gevaar voor brand opleveren, geïsoleerd.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel43
  - number: '43.7'
    text: 'Krachtvoertuigen voortbewogen door een of meer elektromotoren, zijn voorzien van:'
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel43
  - number: 43.7.a
    text: |-
      inrichtingen die beveiligen tegen de gevolgen van te grote stroomsterkte en te hoge spanning van de elektrische
      stroom, voor zover deze niet elders, b.v. in onderstations, zijn ondergebracht;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel43
  - number: 43.7.b
    text: |-
      geleidende verbindingen tussen de aarde en alle delen van het krachtvoertuig, die, indien zij ten gevolge van breuk
      in de bovenleiding of door andere oorzaken onder spanning zouden komen, gevaar opleveren.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel43
  - number: '43.8'
    text: |-
      Stroomafnemers zijn zodanig geconstrueerd en gemonteerd, dat de stroom met de voor het voertuig hoogste toegelaten
      snelheid veilig wordt afgenomen. De stroomafnemers oefenen een zo gelijkmatig mogelijke druk op de stroomrail of
      bovenleiding uit. De Minister kan voorschrijven dat zij worden beveiligd tegen onbedoeld opzetten.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel43
  - number: '43.9'
    text: |-
      De voorruiten van de cabines van krachtvoertuigen bestaan uit veiligheidsglas zonder beeldvervorming; in
      krachtvoertuigen met een hogere toegelaten snelheid dan 50 km/h zijn zij behalve van ruitenwissers tevens voorzien
      van apparatuur die beslaan of bevriezen verhindert.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel43
  - number: '43.10'
    text: |-
      Andere dan de in het zesde en zevende lid bedoelde typen krachtvoertuigen kunnen op stadsspoorwegen worden
      toegelaten onder door de Minister te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel43
  - number: '44'
    text: |-
      De Minister kan, de directie gehoord, nadere voorschriften geven omtrent de technische inrichting van
      krachtvoertuigen met het oog op het dienst doen op andere spoorwegen waarop de [Spoorwegwet][ref1] of de
      [Locaalspoor- en Tramwegwet][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0001848
      [ref2]: https://wetten.overheid.nl/BWBR0001866
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0001848
      - id: ref2
        bwb_id: BWBR0001866
  - number: '45.1'
    text: De bak en inwendige uitrusting bestaan uit onsplinterbaar, moeilijk ontvlambaar materiaal.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel45
  - number: '45.2'
    text: |-
      De ramen bestaan uit veiligheidsglas. Zij kunnen slechts zover worden geopend dat naar buiten leunen niet mogelijk
      is. Als een treinstel aan één zijde geen deur heeft, moet aan deze zijde een aantal ramen, gelijkmatig over
      de lengte van het treinstel verdeeld, als nooduitgang kunnen dienen. Zij zijn - duidelijk door een opschrift
      "Nooduitgang" aangeduid;
        - ten minste 60 cm breed en 43 cm hoog;
        - door bediening van een bijzonder slot te openen, dan wel gemakkelijk en snel te vernielen of te verwijderen,
      waartoe speciaal gereedschap in de onmiddellijke omgeving moet zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel45
  - number: '45.3'
    text: |-
      Treinstellen hebben een voldoend aantal deuren met een doorgang van tenminste 65 cm breed. De deuren kunnen slechts
      worden geopend en gesloten door bediening van de hiertoe bestemde apparatuur, zodanig dat hierbij geen gevaar voor
      reizigers ontstaat, en worden in de eindstanden vastgehouden. Gedurende de gehele rit zijn zij vergrendeld, doch
      kunnen in geval van gevaar door de reizigers worden geopend. De gesloten stand van de deuren wordt in de cabine
      van de metrobestuurder aangegeven. In geopende stand blijven zij binnen het profiel van vrije ruimte als bedoeld
      in [artikel 12][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003454#Artikel12
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0003454
        artikel: '12'
        hoofdstuk: II
        afdeling: II
  - number: '45.4'
    text: |-
      De Minister kan toestemming verlenen tot toepassing van een door hem te accorderen systeem van automatische
      deursluiting.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel45
  - number: '45.5'
    text: |-
      Bij de constructie van treinstellen wordt uitgegaan van een gemiddeld gewicht van 70 kg per reiziger; ten aanzien
      van de staanplaatsen wordt uitgegaan van 7 reizigers per m2.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel45
  - number: '45.6'
    text: |-
      De hoogte van het voor reizigers toegankelijke gedeelte bedraagt tenminste 1,90 m; ter plaatse van de zitplaatsen
      is een kleinere hoogte toegestaan.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel45
  - number: '45.7'
    text: In de vloer van het voor reizigers toegankelijke gedeelte van het treinstel bevinden zich geen treden.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel45
  - number: '45.8'
    text: |-
      Treinstellen zijn voorzien van middelen tot behoorlijke verlichting, luchtverversing en verwarming. In
      tunneltrajecten is de verlichting steeds ontstoken. Op deze trajecten rijdende treinstellen zijn uitgerust met een
      noodverlichting die onafhankelijk is van de stroomrail- of bovenleidingspanning. De cabine van de metrobestuurder
      is afgeschermd tegen het licht uit het voor reizigers toegankelijke gedeelte.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel45
  - number: '45.9'
    text: |-
      Treinstellen bezitten aan de voorzijde en/of aan de perronzijde een inrichting om de bestemming van de trein aan
      te duiden.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel45
  - number: '45.10'
    text: |-
      In elk treinstel bevindt zich een door de directie te bepalen aantal zitplaatsen, kenbaar door een door de directie
      vast te stellen aanduiding en bestemd voor reizigers voor wie het afleggen van de reis in staande houding bezwaar
      kan opleveren.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel45
  - number: '45.11'
    text: |-
      Treinstellen voortbewogen door verbrandingsmotoren zijn niet toegelaten. De Minister kan van dit verbod in
      bijzondere gevallen ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel45
  - number: '46.1'
    text: |-
      Indien in treinstellen een doorgaand remsysteem in gebruik is, onafhankelijk van het krachtens
      [artikel 52, eerste lid][ref1], vereiste systeem, treedt bij niet functioneren daarvan automatisch het in
      [artikel 52, eerste lid][ref2], bedoelde remsysteem in werking.


      [ref1]: https://wetten.overheid.nl/BWBR0003454#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0003454#Artikel52
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0003454
        artikel: '52'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003454
        artikel: '52'
        hoofdstuk: IV
  - number: '46.2'
    text: |-
      In afwijking van het bepaalde in [artikel 43, eerste lid, onder ][ref1], oefenen de in een treinstel aanwezige
      vastzetremmen gezamenlijk een zodanige remkracht uit, dat, ook indien het treinstel geheel bezet is, het in
      beweging komen op de steilste helling van de spoorweg wordt verhinderd.


      [ref1]: https://wetten.overheid.nl/BWBR0003454#Artikel43
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0003454
        artikel: '43'
        hoofdstuk: III
        afdeling: II
  - number: '46.3'
    text: |-
      In treinen die uit meer dan één treinstel bestaan, moeten - hetzij alle vastzetremmen bedienbaar zijn vanuit de
      bediendecabine
        - hetzij andere reminrichtingen de trein zo lang doen stil staan, dat de metrobestuurder alle vastzetremmen in
      werking kan stellen.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel46
  - number: '46.4'
    text: |-
      De bedieningsapparaten van de noodrem, die een doorgaand remsysteem in werking stellen, zijn zodanig aangebracht
      dat de reizigers deze gemakkelijk kunnen zien en bereiken zonder dat zij door een deur behoeven te gaan.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel46
  - number: '47.1'
    text: |-
      Op rijtuigen zijn mede de bepalingen van de [artikelen 43, eerste lid, onder ][ref1], en
      [46, tweede en vierde lid][ref2], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003454#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0003454#Artikel46
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0003454
        artikel: '43'
        hoofdstuk: III
        afdeling: II
      - id: ref2
        bwb_id: BWBR0003454
        artikel: '46'
        hoofdstuk: III
        afdeling: II
  - number: '47.2'
    text: De vastzetrem van rijtuigen is bedienbaar vanaf een goed toegankelijke plaats.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel47
  - number: '47.3'
    text: |-
      Rijtuigen zijn uitgerust met een doorgaand zelfwerkend remsysteem als bedoeld in [artikel 52, eerste lid][ref1],
      alsmede van een op dat systeem aangesloten rem.


      [ref1]: https://wetten.overheid.nl/BWBR0003454#Artikel52
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0003454
        artikel: '52'
        hoofdstuk: IV
  - number: '48.1'
    text: |-
      Onder een stuurstandvoertuig wordt verstaan een voertuig, geen krachtvoertuig zijnde, dat voorzien is van
      apparatuur waarmee alle voortbewegingsinrichtingen in de trein en het doorgaand zelfwerkend remsysteem kunnen
      worden bediend en gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel48
  - number: '48.2'
    text: |-
      Het is verder voorzien van een overige in [artikel 43, eerste en tweede lid][ref1], genoemde inrichtingen,
      zulks onverminderd de ontheffingsmogelijkheid, genoemd in het derde lid van dat artikel, alsmede van de in
      [artikel 43, negende lid][ref2], bedoelde voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0003454#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0003454#Artikel43
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0003454
        artikel: '43'
        hoofdstuk: III
        afdeling: II
      - id: ref2
        bwb_id: BWBR0003454
        artikel: '43'
        hoofdstuk: III
        afdeling: II
  - number: '49'
    text: Rijtuigen en wagens zijn voorzien van lantarenhouders of van vaste sluitseinen.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel49
  - number: '50.1'
    text: Behoudens hetgeen hierna is bepaald, is het krachtvoertuig aan het hoofd van de trein geplaatst.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel50
  - number: '50.2'
    text: |-
      Voertuigen als bedoeld in [artikel 48][ref1], mogen met de cabine voorop aan het hoofd van de trein worden
      geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0003454#Artikel48
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0003454
        artikel: '48'
        hoofdstuk: III
        afdeling: III
  - number: '50.3'
    text: De metrobestuurder of machinist bevindt zich
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel50
  - number: 50.3.a
    text: |-
      hetzij in de voorste cabine van het in het eerste lid bedoelde krachtvoertuig, dan wel in de vooroprijdende cabine
      van een voertuig als bedoeld in het tweede lid,
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel50
  - number: 50.3.b
    text: |-
      hetzij - bij bediening van buitenaf als bedoeld in [artikel 43, vijfde lid][ref1] - op een andere plaats vanwaar
      hij de te volgen weg kan overzien.


      [ref1]: https://wetten.overheid.nl/BWBR0003454#Artikel43
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0003454
        artikel: '43'
        hoofdstuk: III
        afdeling: II
  - number: 50.4.a
    text: |-
      In de trein mogen twee of meer krachtvoertuigen zijn geplaatst die worden bediend door de in het derde lid bedoelde
      metrobestuurder of machinist.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel50
  - number: 50.4.b
    text: |-
      Afzonderlijk bediende krachtvoertuigen mogen in de trein zijn geplaatst, indien de metrobestuurders of machinisten
      zich voortdurend door middel van een spreekverbinding met elkaar kunnen verstaan en alle krachtvoertuigen zijn
      aangesloten op het doorgaande zelfwerkende remsysteem, bedoeld in [artikel 52, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003454#Artikel52
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0003454
        artikel: '52'
        hoofdstuk: IV
  - number: '50.5'
    text: 'Afwijking van het bepaalde in het eerste, tweede en derde lid is toegestaan bij:'
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel50
  - number: 50.5.a
    text: treinen die niet voor reizigers zijn opengesteld;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel50
  - number: 50.5.b
    text: treinen naar of van spooraansluitingen;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel50
  - number: 50.5.c
    text: bedrijfsstoringen.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel50
  - number: '50.6'
    text: |-
      Voor het rijden met andere dan de in [artikel 43, zesde en zevende lid][ref1], bedoelde krachtvoertuigen geeft de
      directie bijzondere voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0003454#Artikel43
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0003454
        artikel: '43'
        hoofdstuk: III
        afdeling: II
  - number: '50.7'
    text: |-
      Niet medewerkende, onbemande krachtvoertuigen blijven bij de bepaling van het aantal krachtvoertuigen buiten
      beschouwing.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel50
  - number: '51.1'
    text: |-
      In afwijking van het in [artikel 26 van de Spoorwegwet][ref1] bepaalde stelt de directie het aantal voertuigen
      vast van de treinen opengesteld voor reizigers anders dan personeel, met dien verstande dat deze treinen zijn
      samengesteld uit zoveel voertuigen, dat het voor reizigers toegankelijke gedeelte niet langer is dan het kortste
      perron waar de trein stopt.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel26
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '26'
  - number: '51.2'
    text: De directie bepaalt de maximumlengte van andere dan de in het eerste lid bedoelde treinen.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel51
  - number: '51.3'
    text: |-
      Een trein voert front- en sluitseinen als omschreven in het Seinreglement, bedoeld in [artikel 22][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003454#Artikel22
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0003454
        artikel: '22'
        hoofdstuk: II
        afdeling: IV
  - number: '52.1'
    text: 'De treinen zijn voorzien van een doorgaand zelfwerkend remysteem, dat aan de volgende eisen voldoet:'
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel52
  - number: 52.1.a
    text: de remmen kunnen door de metrobestuurder of machinist alsmede automatisch in werking worden gesteld;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel52
  - number: 52.1.b
    text: |-
      zodra de doorgaande leiding wordt verbroken, treden tenminste de remmen van het treindeel achter de plaats van
      verbreking in werking.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel52
  - number: '52.2'
    text: |-
      De constructie van het doorgaande zelfwerkende remsysteem en de inrichting om het te bedienen worden vastgesteld
      door de directie.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel52
  - number: '52.3'
    text: |-
      Onverminderd het elders in dit artikel bepaalde mogen in een trein ten hoogste zoveel voertuigen zonder bediend
      remtoestel worden vervoerd, dat een afgebroken treindeel tot stilstand komt binnen de krachtens het vijfde en zesde
      lid daarvoor geldende remweg.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel52
  - number: '52.4'
    text: |-
      In het in [artikel 6 van de Spoorwegwet][ref1] bedoelde dienstreglement wordt het minimumgewicht van voertuigen
      zonder bediend remtoestel bepaald. Tevens kunnen bepalingen worden opgenomen waarbij wordt afgeweken van het
      bepaalde in het eerste en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel6
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '6'
  - number: '52.5'
    text: |-
      Treinen worden zodanig beremd, dat zij op een vlakke baan tot stilstand kunnen worden gebracht binnen de hierna
      genoemde afstanden:






                    op grond van baan en beveiliging ter plaatse hoogste toegelaten snelheid in km/h


                    afstand




                    niet meer dan 30


                    40 m






                    meer dan 30, doch niet meer dan 50


                    110 m




                    meer dan 50, doch niet meer dan 70


                    220 m




                    meer dan 70, doch niet meer dan 90


                    400 m




           In het in [artikel 6 van de Spoorwegwet][ref1] bedoelde dienstreglement wordt bepaald hoe te handelen bij
      uitval van een deel van de remkracht.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel6
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '6'
  - number: '52.6'
    text: |-
      De directie bepaalt in hoeverre de in het vijfde lid vermelde remwegen op dalende hellingen mogen worden verlengd
      en hoe het promillage van een helling wordt berekend.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel52
  - number: '53.1'
    text: |-
      De Minister stelt per spoorweg of zo nodig per spoorweggedeelte de snelheid vast waarmede de treinen mogen rijden.
      Zij bedraagt overigens, onverminderd het bepaalde in het zesde lid en noodzakelijke snelheidsbeperkingen wegens de
      aard van het materieel of de situatie ter plaatse, niet meer dan:
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel53
  - number: 53.1.a
    text: 90 km/h voor treinen bestaande uit treinstellen;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel53
  - number: 53.1.b
    text: |-
      60 km/h voor andere treinen indien zij door een metrobestuurder of machinist aan het hoofd van de trein worden
      bediend.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel53
  - number: '53.2'
    text: |-
      De toegelaten snelheid, ingeval de trein wordt bediend door een metrobestuurder of machinist die zich niet aan het
      hoofd van de trein bevindt, wordt geregeld in het dienstreglement, bedoeld in [artikel 6 van de Spoorwegwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel6
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '6'
  - number: '53.3'
    text: Bij proefritten is ten hoogste een snelheid van 120 km/h toegelaten.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel53
  - number: '53.4'
    text: |-
      Behalve bij proefritten is de snelheid zodanig dat voldaan wordt aan het in [artikel 52, vijfde lid][ref1],
      bepaalde. Zij mag voorts, behoudens in de in het vijfde lid voorziene gevallen, bij het doorrijden van bogen,
      waaronder begrepen wisselbogen, niet meer bedragen dan voortvloeit uit onderstaande formule, waarbij is uitgegaan
      van een grootste zijwaartse versnelling van 0,56 m/sec2: waarin wordt voorgesteld door v: de toegelaten snelheid
      in km/h, r: de boogstraal in m. De Minister kan in door hem te bepalen gevallen grotere zijwaartse versnellingen
      toestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003454#Artikel52
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0003454
        artikel: '52'
        hoofdstuk: IV
  - number: '53.5'
    text: |-
      De directie kan voor het doorrijden van bogen als bedoeld in het vierde lid hogere snelheden toestaan, indien aan
      het materieel en/of de baan bijzondere voorzieningen zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel53
  - number: '53.6'
    text: |-
      In of krachtens het in [artikel 6 van de Spoorwegwet][ref1] bedoelde dienstreglement wordt bepaald of, en in welke
      mate, de snelheid moet worden verminderd waar zulks voor de veiligheid van het verkeer nodig mocht zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel6
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '6'
  - number: '54.1'
    text: Elke trein wordt nagezien, voordat hij naar de eerste bestemming van de dag vertrekt.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel54
  - number: '54.2'
    text: |-
      In het in [artikel 6 van de Spoorwegwet][ref1] bedoelde dienstreglement wordt bepaald, welke onderdelen bij de
      in het eerste lid bedoelde controle worden nagezien en welk personeel hiervoor verantwoordelijk is, alsmede hoe
      gehandeld wordt na een onderbreking van de dienst of na een wijziging in de samenstelling van de trein.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel6
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '6'
  - number: '55.1'
    text: |-
      Elke trein wordt voorzien van door de directie voorgeschreven middelen voor het treffen van veiligheidsmaatregelen
      bij onregelmatigheden.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel55
  - number: '55.2'
    text: |-
      De directie schrijft voor of, en zo ja welk, gereedschap, nodig voor herstelling van het rollend materieel, in elke
      trein aanwezig moet zijn.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel55
  - number: '56.1'
    text: Waar dubbel spoor ligt houden de treinen het ten opzichte van de rijrichting rechts liggende spoor.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel56
  - number: '56.2'
    text: Afwijkingen van die regel zijn geoorloofd
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel56
  - number: 56.2.a
    text: |-
      indien de beveiliging mede is ingericht voor het berijden van het ten opzichte van de rijrichting links liggende
      spoor;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel56
  - number: 56.2.b
    text: |-
      voor treinen die - niet voor reizigers zijn opengesteld, of
        - in verband met werkzaamheden aan de spoorweg het rechts liggende spoor niet kunnen berijden, of
        - betrokken zijn bij ongevallen of onregelmatigheden in de treinenloop,
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel56
  - number: '57.1'
    text: Een trein mag een spoorgedeelte eerst berijden, nadat de zekerheid is verkregen, dat
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel57
  - number: 57.1.a
    text: dit spoorgedeelte vrij is;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel57
  - number: 57.1.b
    text: op dit spoorgedeelte geen trein uit tegengestelde richting gelijktijdig wordt toegelaten.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel57
  - number: '57.2'
    text: |-
      Door seinen wordt aan de metrobestuurder of machinist kenbaar gemaakt of, en zo ja met welke snelheid, hij mag
      rijden, tenzij de trein wordt bestuurd door het in [artikel 20][ref1] bedoelde systeem van ATO.


      [ref1]: https://wetten.overheid.nl/BWBR0003454#Artikel20
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0003454
        artikel: '20'
        hoofdstuk: II
        afdeling: IV
  - number: '57.3'
    text: 'De zekerheid, bedoeld in het eerste lid, wordt op een der volgende wijzen verkregen:'
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel57
  - number: 57.3.a
    text: |-
      door middel van zelfwerkend blokstelsel, waarbij het desbetreffende seinbeeld alleen kan worden getoond, indien het
      te berijden spoorgedeelte vrij is en tevens is uitgesloten, dat een sein gelijktijdig een trein uit tegengestelde
      richting toelaat;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel57
  - number: 57.3.b
    text: |-
      door middel van een systeem van in te stellen rijwegen die slechts kunnen worden ingesteld, als is voldaan aan de
      in het eerste lid vermelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel57
  - number: '57.4'
    text: |-
      In het in [artikel 6 van de Spoorwegwet][ref1] bedoelde dienstreglement is aangegeven in welke gevallen en hoe in
      afwijking van het bepaalde in het eerste lid onder *a* treinbewegingen plaatshebben.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel6
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '6'
  - number: '58.1'
    text: |-
      De dienstregeling van de op vaste tijden rijdende treinen wordt, in afwijking van het bepaalde in
      [artikel 26 van de Spoorwegwet][ref1], door de directie vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel26
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '26'
  - number: '58.2'
    text: |-
      Indien en voorzover de Minister daartoe de wens te kennen heeft gegeven, wordt hem de dienstregeling van de in het
      eerste lid bedoelde, dan wel van andere treinen toegezonden.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel58
  - number: '59.1'
    text: |-
      De directie draagt zorg dat van de in [artikel 58, eerste lid][ref1], bedoelde dienstregeling op elk station de
      vertrektijden van de eerste en de laatste voor openbaar vervoer van reizigers bestemde trein van elke dag in elke
      richting zijn aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003454#Artikel58
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0003454
        artikel: '58'
        hoofdstuk: IV
  - number: '59.2'
    text: |-
      De directie verschaft het publiek de mogelijkheid, zich op de hoogte te stellen van de dienstregeling van de voor
      openbaar vervoer van reizigers bestemde treinen.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel59
  - number: '60.1'
    text: |-
      De directie draagt zorg dat wordt vastgelegd welke treinen worden opgeheven, met vermelding van de reden en verdere
      bijzonderheden.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel60
  - number: '60.2'
    text: |-
      Treinen die voor het openbaar vervoer van reizigers zijn opengesteld mogen slechts bij ontregeling van de dienst
      vóór de in de dienstregeling aangegeven tijd rijden. De laatste trein van de dag mag echter nimmer vóór de in de
      dienstregeling aangegeven tijd rijden.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel60
  - number: '60.3'
    text: |-
      Treinen die niet voor het openbaar vervoer van reizigers zijn opengesteld mogen vóór de in de dienstregeling
      aangegeven tijd rijden.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel60
  - number: '61.1'
    text: Het bedienen van een krachtvoertuig in de rangeerdienst kan geschieden
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel61
  - number: 61.1.a
    text: hetzij rechtstreeks;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel61
  - number: 61.1.b
    text: |-
      hetzij van buiten af als bedoeld in [artikel 43, vijfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003454#Artikel43
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0003454
        artikel: '43'
        hoofdstuk: III
        afdeling: II
  - number: 61.1.c
    text: |-
      hetzij door middel van het in [artikel 43, eerste lid, onder ][ref1] bedoelde systeem van ATO.


      [ref1]: https://wetten.overheid.nl/BWBR0003454#Artikel43
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0003454
        artikel: '43'
        hoofdstuk: III
        afdeling: II
  - number: '61.2'
    text: |-
      Het krachtvoertuig waarmee of het stuurstandvoertuig van waaruit een rangeerbeweging wordt uitgevoerd, voert de
      seinen als omschreven in het Seinreglement, bedoeld in [artikel 22][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003454#Artikel22
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0003454
        artikel: '22'
        hoofdstuk: II
        afdeling: IV
  - number: '62'
    text: 'De directie schrijft maatregelen voor om te beletten dat:'
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel62
  - number: 62.a
    text: op de sporen staande voertuigen door de wind of onvoorziene omstandigheden in beweging worden gebracht;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel62
  - number: 62.b
    text: krachtvoertuigen, zonder dat zij worden bediend, onbedoeld in beweging komen;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel62
  - number: 62.c
    text: krachtvoertuigen door onbevoegden worden bediend.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel62
  - number: '63'
    text: |-
      Voorschriften betreffende bijzondere voertuigen worden opgenomen in het dienstreglement, bedoeld in
      [artikel 6 van de Spoorwegwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel6
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '6'
  - number: '64.1'
    text: |-
      In het dienstreglement, bedoeld in [artikel 6 van de Spoorwegwet][ref1], worden voorschriften opgenomen betreffende
      de te nemen maatregelen, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel6
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '6'
  - number: 64.1.a
    text: een trein ten gevolge van een onregelmatigheid tot stilstand is gekomen en zijn rit niet kan vervolgen;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel64
  - number: 64.1.b
    text: een gedeelte van een trein onderweg afbreekt;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel64
  - number: 64.1.c
    text: een hoofdspoor versperd is.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel64
  - number: '64.2'
    text: 'De directie wijst de plaatsen aan:'
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel64
  - number: 64.2.a
    text: waar een reserve-krachtvoertuig gereed moet staan voor onmiddellijk gebruik, en
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel64
  - number: 64.2.b
    text: |-
      waar de nodige werktuigen en materialen aanwezig moeten zijn om bij ongevallen het spoor spoedig te kunnen
      ontruimen.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel64
  - number: '65.1'
    text: |-
      Op de stations zijn door de directie voorgeschreven middelen tot het verlenen van eerste hulp aan gewonden
      aanwezig. De directie wijst de stations aan, waar de door haar voor te schrijven middelen voor het vervoer van
      gewonden aanwezig moeten zijn.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel65
  - number: '65.2'
    text: |-
      De directie schrijft voor of, en zo ja welke, middelen tot het verlenen van eerste hulp aan gewonden in elke voor
      reizigers opengestelde trein aanwezig moeten zijn.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel65
  - number: '65.3'
    text: |-
      De directie treft een regeling omtrent de wijze waarop aan de daarbij aan te wijzen personeelsleden de nodige
      kennis wordt bijgebracht voor het verlenen van eerste hulp aan gewonden.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel65
  - number: '66.1'
    text: |-
      Onder een ongeval wordt verstaan een voorval op de spoorweg, waarbij dood of verwonding anders dan van lichte aard,
      van één of meer personen of aanzienlijke materiële schade is ontstaan.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel66
  - number: '66.2'
    text: 'Door de directie wordt onmiddellijk kennis gegeven:'
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel66
  - number: 66.2.a
    text: |-
      van ernstige botsingen en ernstige ontsporingen van één of meer treinen telefonisch aan één der ambtenaren, belast
      met het toezicht, en aan de politie, per telex aan de Minister en de ambtenaren, belast met het toezicht, alsmede
      schriftelijk aan bedoelde ambtenaren;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel66
  - number: 66.2.b
    text: |-
      van overige ongevallen per telex en schriftelijk aan de ambtenaren belast met het toezicht, en van ongevallen met
      doden of gewonden bovendien aan de politie;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel66
  - number: 66.2.c
    text: |-
      van niet onder a of b begrepen voorvallen die de veiligheid van het verkeer of van personen in gevaar hebben
      gebracht of waarvoor de regelmatigheid van het spoorwegverkeer ernstig is gestoord schriftelijk aan de ambtenaren
      belast met het toezicht.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel66
  - number: '66.3'
    text: |-
      De directie bepaalt naar welke van de in het tweede lid bedoelde voorvallen een onderzoek wordt ingesteld en op
      welke wijze het onderzoek wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel66
  - number: '66.4'
    text: |-
      Van elk door de directie in te stellen onderzoek betreffende ongevallen en voorvallen waarbij de veiligheid van het
      verkeer of van personen in ernstige mate in gevaar is gebracht, wordt tijdig kennis gegeven aan een der ambtenaren,
      belast met het toezicht. Die ambtenaren kunnen het onderzoek bijwonen. De directie doet een verslag van het
      onderzoek aan de ambtenaren, belast met het toezicht, alsmede aan de Minister toekomen.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel66
  - number: '68.1'
    text: |-
      Het personeel moet de voor een behoorlijke uitoefening van zijn werkzaamheden vereiste lichamelijke en geestelijke
      gesteldheid bezitten.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel68
  - number: '68.2'
    text: |-
      De in [artikel 72][ref1] bedoelde personeelsleden moeten de Nederlandse taal zodanig beheersen, dat een behoorlijke
      uitoefening van de dienst wordt gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0003454#Artikel72
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0003454
        artikel: '72'
        hoofdstuk: VI
        afdeling: I
  - number: '69.1'
    text: |-
      Behoudens het bepaalde in het vijfde lid doet op elke trein een chef van de trein dienst, die tevens de
      metrobestuurder of de machinist kan zijn.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel69
  - number: '69.2'
    text: De chef van de trein heeft de leiding over het overige personeel, voor zover dit op de trein dienst doet.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel69
  - number: '69.3'
    text: |-
      Het bedienen van een rem als bedoeld in [artikel 52, eerste lid][ref1], geschiedt slechts door de metrobestuurder
      of machinist, behoudens het bepaalde in het vierde lid, of door het in [artikel 20][ref2] bedoelde systeem van ATO.


      [ref1]: https://wetten.overheid.nl/BWBR0003454#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0003454#Artikel20
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0003454
        artikel: '52'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003454
        artikel: '20'
        hoofdstuk: II
        afdeling: IV
  - number: '69.4'
    text: |-
      In het geval, bedoeld in [artikel 43, derde lid][ref1], doet naast de metrobestuurder of machinist een
      personeelslid dienst dat zo nodig de trein tot stilstand kan brengen, als deze op hoofdsporen rijdt zonder in
      dienst zijnd systeem van ATB of ATO als bedoeld in [artikel 43, tweede lid, onder d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003454#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0003454#Artikel43
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0003454
        artikel: '43'
        hoofdstuk: III
        afdeling: II
      - id: ref2
        bwb_id: BWBR0003454
        artikel: '43'
        hoofdstuk: III
        afdeling: II
  - number: '69.5'
    text: |-
      Op treinen, bestuurd door het in [artikel 20][ref1] bedoelde systeem van ATO en niet opengesteld voor reizigers
      anders dan personeel, behoeft geen chef van de trein dienst te doen.


      [ref1]: https://wetten.overheid.nl/BWBR0003454#Artikel20
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0003454
        artikel: '20'
        hoofdstuk: II
        afdeling: IV
  - number: '70.1'
    text: 'Met het bedienen van een krachtvoertuig wordt slechts belast degene die:'
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel70
  - number: 70.1.a
    text: tenminste 18 jaar is;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel70
  - number: 70.1.b
    text: tenminste volledig basisonderwijs of een daaraan gelijkwaardige opleiding heeft genoten;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel70
  - number: 70.1.c
    text: |-
      voldoende bewijzen heeft gegeven van praktische en theoretische bekwaamheid door het rijden van een proefrit en
      het afleggen van een examen; de exameneisen en de samenstelling van de examencommissie behoeven de instemming van
      de directie.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel70
  - number: '70.2'
    text: |-
      Onverminderd het bepaalde in het eerste lid, wordt met het bedienen van een krachtvoertuig in de rangeerdienst of
      van een niet voor reizigers opengestelde trein, met een snelheid van niet meer dan 50 km/h, slechts belast degene
      die tenminste een maand onder toezicht van een ervaren metrobestuurder of machinist een zodanig krachtvoertuig
      heeft bediend.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel70
  - number: '70.3'
    text: |-
      Onverminderd het bepaalde in het eerste lid, onder *b* en *c*, en in het vierde lid, wordt met het bedienen van
      een krachtvoertuig van treinen, opengesteld voor reizigers, slechts degene belast die tenminste een maand onder
      toezicht van een ervaren metrobestuurder een dergelijk krachtvoertuig heeft bediend.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel70
  - number: '70.4'
    text: |-
      De metrobestuurder of machinist van een trein, opengesteld voor reizigers anders dan personeel, dient tenminste 21
      jaar te zijn.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel70
  - number: '70.5'
    text: |-
      Ten aanzien van werkplaatspersoneel dat voldoet aan de in het eerste lid gestelde eisen, is het bepaalde in het
      tweede en derde lid, alsmede het bepaalde in [artikel 72, eerste lid, onder ][ref1], niet van toepassing voor zover
      het betreft het zonder reizigers overbrengen van krachtvoertuigen, bestemd voor of afkomstig van een werkplaats van
      of naar daarvoor door de directie aangewezen opstelsporen.


      [ref1]: https://wetten.overheid.nl/BWBR0003454#Artikel72
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0003454
        artikel: '72'
        hoofdstuk: VI
        afdeling: I
  - number: '70.6'
    text: |-
      De Minister kan ten aanzien van krachtvoertuigpersoneel dat dienst doet op door hem aan te wijzen materieel en
      baanvakken van de voorgaande leden afwijkende of aanvullende eisen stellen.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel70
  - number: '71.1'
    text: |-
      De directie draagt zorg dat het personeel, voor zover zijn dienst dit vordert, de beschikking heeft over de nodige
      gedeelten van dit reglement en van het in [artikel 6 van de Spoorwegwet][ref1] bedoelde dienstreglement, alsmede de
      nodige gegevens betreffende de dienstregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel6
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '6'
  - number: '71.2'
    text: |-
      Noch aan het personeel dat dienst doet op belangrijke posten die dienen voor de verzekering van het veilig verkeer
      op de spoorweg, noch aan metrobestuurders en machinisten gedurende de rit van de treinen waarop zij dienst doen,
      wordt iets opgedragen of toegestaan waardoor hun aandacht zou kunnen worden afgeleid. Indien de directie aan het
      personeel aanwijzingen geeft ter voorkoming dat de aandacht van de opgedragen werkzaamheden wordt afgeleid is dat
      personeel verplicht deze aanwijzingen op te volgen.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel71
  - number: '72.1'
    text: Beëdigd worden
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel72
  - number: 72.1.a
    text: de metrobestuurders en machinisten;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel72
  - number: 72.1.b
    text: de controlebeambten;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel72
  - number: 72.1.c
    text: |-
      het personeel tewerkgesteld op posten ten dienste van de veiligheid van de treinenloop, voor zover naar het oordeel
      van de directie de uitoefening van de dienst zulks vordert.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel72
  - number: '72.2'
    text: |-
      Eveneens beëdigd wordt het personeel waarvan de beëdiging door de directie wenselijk wordt geacht met het oog op de
      door dit personeel te verrichten werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel72
  - number: '73.1'
    text: De eed (belofte) wordt afgelegd ten overstaan van een kantonrechter van de rechtbank.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel73
  - number: '73.2'
    text: |-
      Ieder legt de eed (belofte) als volgt af. Ik zweer (beloof), dat ik alle plichten die mij door of krachtens de
      [Spoorwegwet][ref1] en door of krachtens de [Locaalspoor- en Tramwegwet][ref2] zijn of zullen worden opgelegd,
      eerlijk en naar behoren zal vervullen. Zo waarlijk helpe mij God almachtig (Dat beloof ik).


      [ref1]: https://wetten.overheid.nl/BWBR0001848
      [ref2]: https://wetten.overheid.nl/BWBR0001866
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0001848
      - id: ref2
        bwb_id: BWBR0001866
  - number: '74'
    text: |-
      Ten aanzien van Spoorwegen onder beheer van een publiekrechtelijk lichaam bepaalt dit lichaam welk personeel moet
      zijn voorzien van dienstkleding of van een dienstonderscheidingsteken en stelt het daartoe een reglement vast. Bij
      andere Spoorwegen stelt de directie een dergelijk reglement vast.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel74
  - number: '75'
    text: 'Personen die niet tot het personeel behoren kunnen onder door de directie te stellen voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel75
  - number: 75.a
    text: |-
      tot de spoorweg worden toegelaten voor de bediening van de in [artikel 41][ref1] bedoelde krachtvoertuigen;


      [ref1]: https://wetten.overheid.nl/BWBR0003454#Artikel41
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0003454
        artikel: '41'
        hoofdstuk: III
        afdeling: I
  - number: 75.b
    text: |-
      worden belast met de leiding van werkzaamheden aan - of in de onmiddellijke nabijheid van - de aardebaan, de
      bovenbouw, de kunstwerken en de inrichtingen of met zorg voor het nemen van de veiligheidsmaatregelen bij die
      werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel75
  - number: '78.1'
    text: |-
      Het is een ieder, behoudens uit de aard van zijn betrekking, verboden zich in of op een station dan wel in een
      trein in een zodanige toestand te bevinden of zich zodanig te gedragen, dat orde, rust, veiligheid of een goede
      bedrijfsgang wordt of kan worden verstoord.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel78
  - number: '78.2'
    text: 'Als verstoring van orde, rust, veiligheid of een goede bedrijfsgang worden beschouwd:'
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel78
  - number: 78.2.a
    text: |-
      gedragingen waardoor de bediening en het gebruik van voorzieningen of van een trein dan wel de taakuitoefening van
      het personeel van de directie worden verhinderd of belemmerd;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel78
  - number: 78.2.b
    text: |-
      misbruik maken van voorzieningen dan wel gebruik maken van voorzieningen of van een trein op een tijdstip waarop
      deze niet voor gebruik beschikbaar zijn dan wel op een andere wijze dan waarvoor deze bestemd zijn;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel78
  - number: 78.2.c
    text: uit een trein werpen van stoffen of van voorwerpen;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel78
  - number: 78.2.d
    text: zich in kennelijke staat van dronkenschap of onder kennelijke invloed van verdovende middelen bevinden;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel78
  - number: 78.2.e
    text: |-
      afsteken van vuurwerk, rumoer maken dan wel op zodanige wijze geluid voortbrengen dat anderen daarvan hinder
      ondervinden;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel78
  - number: 78.2.f
    text: uitoefenen van beroep of bedrijf;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel78
  - number: 78.2.g
    text: |-
      tentoonstellen van voorwerpen, maken van reclame of propaganda, verspreiden van drukwerken, bedelen of houden van
      inzamelingen;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel78
  - number: 78.2.h
    text: |-
      meenemen in een trein van dieren, stoffen of voorwerpen die hinder, gevaar, verontreiniging of beschadiging
      veroorzaken of kunnen veroorzaken;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel78
  - number: 78.2.i
    text: |-
      roken in een trein of station, of gedeelten daarvan, ten aanzien waarvan de directie heeft aangegeven dat roken
      niet is toegestaan;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel78
  - number: 78.2.j
    text: |-
      zich bevinden op een station op een tijdstip dat dit kenbaar gesloten is of op een gedeelte van een station dat
      kenbaar daartoe niet toegankelijk is;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel78
  - number: 78.2.k
    text: zich op een station begeven langs een andere dan de daarvoor bestemde weg;
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel78
  - number: 78.2.l
    text: op een andere wijze hinder, gevaar, verontreiniging of beschadiging veroorzaken.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel78
  - number: '78.3'
    text: |-
      Het bepaalde in het eerste en tweede lid is niet van toepassing voor zover de directie daarvoor, met inachtneming
      van de belangen van reizigers, toestemming heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel78
  - number: '79'
    text: Aanwijzingen betreffende orde, rust, veiligheid of een goede bedrijfsgang
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel79
  - number: '79.1'
    text: |-
      Een ieder is verplicht de aanwijzingen betreffende de orde, rust, veiligheid of een goede bedrijfsgang op te
      volgen, die door de directie duidelijk kenbaar zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel79
  - number: '79.2'
    text: Een aanwijzing om zich te verwijderen, kan worden gegeven voor een bij de aanwijzing te bepalen tijdsduur.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel79
  - number: '109'
    text: Dit reglement treedt in werking op een nader door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0003454/2013-01-01#Artikel109
