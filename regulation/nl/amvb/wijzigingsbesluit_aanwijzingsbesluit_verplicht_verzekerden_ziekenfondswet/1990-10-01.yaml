articles:
  - number: II
    text: |-
      De in artikel 15*d* van het Aanwijzingsbesluit verplicht-verzekerden [Ziekenfondswet][ref1] bedoelde kennisgeving,
      dient door de betrokkene te worden gedaan aan een ziekenfonds, werkend in de gemeente of in het deel van de
      gemeente waar hij woont, dan wel aan het in het Besluit aanwijzing ziekenfondsen [Ziekenfondswet][ref2] 1980
      (*Stcrt.* 225) voor de daar bedoelde personen aangewezen ziekenfonds, binnen vier maanden, te rekenen vanaf de dag
      van inwerkingtreding van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0002460
      [ref2]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0005339/1990-10-01#ArtikelII
