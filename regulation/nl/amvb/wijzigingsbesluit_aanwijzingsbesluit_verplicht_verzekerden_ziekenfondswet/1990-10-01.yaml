  - number: III
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin
      het wordt geplaatst en werkt, met uitzondering van [Artikel I, onderdeel A, punt 2][ref1], en II terug tot en met 1
      oktober 1990.


      [ref1]: https://wetten.overheid.nl/BWBR0005339#ArtikelI
