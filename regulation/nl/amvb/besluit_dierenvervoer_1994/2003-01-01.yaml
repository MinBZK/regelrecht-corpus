  - number: '5'
    text: |-
      1 De dieren worden slechts vervoerd indien zij geschikt zijn voor de reis en er voorzieningen zijn getroffen voor
      de verzorging van de dieren tijdens de reis en bij aankomst op de plaats van bestemming.

      2 De houder van een ziek of gewond dier biedt het dier slechts ten vervoer aan of staat het slechts ten vervoer af
      onderscheidenlijk de vervoerder neemt het dier slechts ten vervoer aan of vervoert een ziek of gewond dier slechts
      indien het betreft:

      a. een licht gewond of licht ziek dier waarvoor het vervoer geen onnodig lijden tot gevolg heeft;

      b. een dier dat wordt vervoerd ten behoeve van zijn diergeneeskundige verzorging of een noodslachting, mits dat
      vervoer geen onnodig lijden of een slechte behandeling tot gevolg heeft en, voor zover het vee betreft, geschiedt
      overeenkomstig de [artikelen 10 tot en met 14][ref1], of

      c. een dier dat wordt vervoerd met het oog op:

        - een dierproef waarvoor een vergunning is verleend als bedoeld in [artikel 2 van de Wet op de dierproeven][ref2]
      dan wel, indien het bij koninklijke boodschap van 7 januari 1992 ingediende voorstel van wet houdende
      wijziging van de [Wet op de dierproeven][ref3] tot wet wordt verheven en in werking treedt, als bedoeld
      in [artikel 2 van die wet][ref4], en, voor zover voor dat vervoer een vergunning is vereist als bedoeld in
      [artikel 66 van de wet][ref5], daarvoor een vergunning is verleend, of
        - door de bevoegde autoriteit van het land van bestemming goedgekeurde doeleinden van wetenschappelijk onderzoek.

      3 Als dieren waarvan het vervoer onnodig lijden of een slechte behandeling tot gevolg heeft, worden in ieder geval
      beschouwd runderen vanaf de leeftijd van tien dagen alsmede paarden, met één of meer botbreuken die zich niet
      meer zelfstandig kunnen voortbewegen, tenzij zij naar een diergeneeskundige praktijk, kliniek of ziekenhuis worden
      vervoerd ten behoeve van hun diergeneeskundige verzorging.

      4 Onverminderd [artikel 59 van de wet][ref6] wordt voor zieke en gewonde dieren slechts een certificaat als bedoeld
      in [artikel 58, eerste lid, onderdeel ][ref7] afgegeven in een geval als bedoeld in het tweede lid.


