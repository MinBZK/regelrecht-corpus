  - number: '6'
    text: |-
      1 De vervoerder:

      a. vervoert de dieren niet en doet de dieren niet vervoeren onder zodanige omstandigheden dat zij worden
      blootgesteld aan letsel of onnodig lijden, en

      b. vergewist zich ervan dat de dieren zonder vertraging naar hun plaats van bestemming worden vervoerd.

      2 De vervoerder stelt bij het vervoer van éénhoevigen, runderen, schapen, geiten en varkens bestemd voor het
      intracommunautaire handelsverkeer of voor uitvoer naar derde landen, wanneer de reistijd langer is dan 8 uur, voor
      de gehele duur van de reis een reisschema op overeenkomstig het in hoofdstuk VIII van de bijlage bij [richtlijn
      91/628/EEG](31991L0628) opgenomen model, onder vermelding van de eventuele halte- en overlaadplaatsen.

      3 De vervoerder vergewist zich ervan dat:

      a. het origineel van het reisschema op het juiste moment door de juiste personen naar behoren wordt in- en
      aangevuld;

      b. het origineel van het reisschema gedurende de gehele reis gehecht is aan het certificaat, bedoeld in
      [artikel 58, eerste lid, onderdeel ][ref1];

      c. de met het vervoer belaste personen in het reisschema de tijdstippen en plaatsen vermelden waarop de vervoerde
      dieren tijdens de reis gevoederd en gedrenkt zijn;

      d. de met het vervoer belaste personen de dieren, die worden uitgevoerd naar een derde land en waarbij de
      reistijd over het grondgebied van de Europese Gemeenschap dan wel over zee op het tijdstip van het verlaten
      van het grondgebied langer dan 8 uren heeft geduurd, slechts verder vervoeren nadat de dieren door de in
      [artikel 58, eerste lid, onderdeel ][ref2] bedoelde ambtenaar geschikt zijn bevonden om de reis voort te zetten en
      het reisschema door de ambtenaar na de controle is getekend, en

      e. de met het vervoer belaste personen bij terugkeer het origineel van het reisschema binnen zeven dagen
      terugzenden aan de VWA.

      4 Bij reizen over een afstand van meer dan 50 km, dient de vervoerder voorts:

      a. te beschikken over een door de eigenaar ondertekend document waaruit het bedrijf, het centrum of de instelling
      van oorsprong van de dieren, de plaats van vertrek, de plaats van bestemming, alsmede de datum en het uur van
      vertrek blijkt, voor zover deze gegevens niet reeds op grond van een ander wettelijk voorschrift worden verstrekt;

      b. bij reizen waarop punt 4 van hoofdstuk VII van de bijlage bij [richtlijn 91/628/EEG](31991L0628) van toepassing
      is en afhankelijk van de vervoerde diersoort, het bewijs te leveren dat maatregelen zijn genomen om te voorzien in
      de behoeften aan drinken en voedsel van de vervoerde dieren tijdens de reis, zelfs wanneer het reisschema, bedoeld
      in het tweede lid, wordt gewijzigd of de reis door onvoorziene omstandigheden wordt onderbroken, en

      c. zich ervan te vergewissen dat de dieren van niet onder hoofdstuk VII van de bijlage bij [richtlijn 91/628/EEG]
      (31991L0628) vallende soorten, tijdens het vervoer met passende tussenpozen en op passende wijze worden gedrenkt en
      gevoederd onverminderd hoofdstuk III van de genoemde bijlage.

      5 De vervoerder bewaart gedurende zes maanden een duplicaat van de in het tweede en vierde lid, onderdeel *a*,
      bedoelde documenten.

      6 De met het vervoer belaste personen dragen ervoor zorg dat een dier dat tijdens het vervoer ziek wordt of gewond
      raakt, zo spoedig mogelijk eerste hulp en indien nodig een passende diergeneeskundige behandeling krijgt. Zo nodig
      vindt onverwijld een speciale noodslachting plaats op zodanige wijze dat onnodig lijden wordt voorkomen.


