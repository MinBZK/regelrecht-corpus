  - number: '18'
    text: |-
      1 Onze Minister houdt de volgende registers bij:

      a. een register van eigenaren en houders van vervoermiddelen waarvoor hij een bewijsstuk als bedoeld in
      [artikel 9][ref1] heeft afgegeven;

      b. een register van vervoersondernemingen.

      2 Indien een vervoerder als bedoeld in onderdeel *b* van het vorige lid, reeds is opgenomen in het register,
      bedoeld in onderdeel *a* van dat lid, geldt zijn inschrijving in dat register tevens als inschrijving in het
      register, bedoeld in onderdeel *b*.

      3 Onze Minister kan nadere regelen stellen ter zake van het in het eerste en tweede lid bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0006990#Artikel9
    url: https://wetten.overheid.nl/BWBR0006990/2003-01-01#Artikel18
