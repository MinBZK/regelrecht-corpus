      1 Het model van het in [artikel 58, eerste lid, onderdeel ][ref1] bedoelde certificaat en de modellen van de
      in onderdeel *b* van dat artikellid bedoelde identificatiemerken en bewijsstukken worden door Onze Minister
      vastgesteld. Het model van het certificaat en de andere modellen kunnen per soort of categorie van dieren
      verschillend worden vastgesteld.

      2 Onze Minister kan regels stellen omtrent de afgifte van de identificatiemerken en bewijsstukken.


