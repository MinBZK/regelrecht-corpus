preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 25 april 1994, no. J. 946683,
    Directie Juridische en Bedrijfsorganisatorische Zaken, gedaan in overeenstemming met Onze Minister van Verkeer
    en Waterstaat;

    Gelet op richtlijn nr. 91/628/EEG van de Raad van de Europese Gemeenschappen van 19 november 1991 betreffende de
    bescherming van dieren tijdens het vervoer en tot wijziging van de richtlijnen nr. 90/425/EEG en nr. 91/496/EEG
    (PbEG 1991, L 340) en gelet op de artikelen 38, 44, eerste en tweede lid, 58, 60 en 111 van de Gezondheids- en
    welzijnswet voor dieren;

    Gezien de adviezen van de Commissie voor de Toetsing van Wetgevingsprojecten (16 november 1993), de Raad
    voor Dierenaangelegenheden (8 en 15 november 1993, RDA/930065/HJ en RDA/930067/HJ), de Nederlandse Vereniging
    tot Bescherming van Dieren (14 september 1993, 93.1562/B1403/?RR), het Landbouwschap (31 augustus 1993 en 24
    november 1993, 04/2002a.01 en B042200a.W01), het Produktschap voor Vee en Vlees (8 september 1993 en 18 november
    1993, tjb/sa/nr. 52844), het Bedrijfschap voor de Handel in Vee (27 augustus 1993, 8411/mp), Air Transport
    Association Netherlands (9 augustus 1993 en 10 november 1993, K/AB/ATAN-280 en K/NA/ATAN-409), Rechten voor al
    wat leeft (13 september 1993 en 15 november 1993), het Produktschap voor Pluimvee en Eieren (6 september 1993,
    93SAE299), het Bedrijfschap Pluimveehandel en -industrie (18 augustus 1993, 93SAP534), de SAVEETRA (Samenwerkende
    Veetransportbedrijven)(25 augustus 1993, SAV068.93/SCH/DH), de FOCWA (Nederlandse vereniging van ondernemers
    in het Carosseriebedrijf) (31 augustus 1993, HB/sha), N.V. Luchthaven Schiphol (30 augustus 1993, GH/nj/79167),
    de Koninklijke Nederlandse Maatschappij voor Diergeneeskunde (17 november 1993, 1163.93/Jsve) en de Nederlandse
    Vereniging van Noodslachters (13 oktober 1993).

    De Raad van State gehoord (advies van 1 augustus 1994, no. W11.94.0260);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuurbeheer en Visserij van 19 oktober 1994, no. J.
    9415926, Directie Juridische en Bedrijfsorganisatorische Zaken, uitgebracht in overeenstemming met Onze Minister
    van Verkeer en Waterstaat;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006990/2003-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. wet: [Gezondheids- en welzijnswet voor dieren][ref1];

      b. vervoermiddel: voor het inladen en vervoeren van levende dieren gebruikte gedeelten van voertuigen voor vervoer
      over de weg of per spoor, schepen en luchtvaartuigen, alsmede containers voor het vervoer over land, over zee of
      door de lucht;

      c. vervoer: elke verplaatsing van levende dieren met behulp van een vervoermiddel, het in- en uitladen van de
      levende dieren inbegrepen;

      d. markt: markt voorzover erkend overeenkomstig artikel 3, zevende lid, van [richtlijn nr. 64/432](31964L0432) EEG
      van de Raad van de Europese Gemeenschappen van 26 juni 1964 betreffende veterinairrechtelijke vraagstukken op het
      gebied van het intracommunautair handelsverkeer in runderen en varkens (*PbEG* L 121 en *PbEG* L 176);

      e. verzamelplaats: verzamelplaats voor zover erkend overeenkomstig artikel 3, zevende lid, van de in onderdeel *d*
      bedoelde richtlijn;

      f. plaats van vertrek:

      1°. plaats waar de dieren voor het eerst op of in het vervoermiddel worden geladen;

      2°. plaats waar de dieren zijn uitgeladen en alvorens weer te zijn ingeladen gedurende ten minste 24 uren zijn
      ondergebracht, gedrenkt, gevoederd en in voorkomend geval verzorgd;

      3°. markt of verzamelplaats indien deze minder dan 50 km van de eerste inlaadplaats verwijderd is, of

      4°. markt of verzamelplaats die verder dan 50 km van de eerste inlaadplaats verwijderd is, slechts indien de dieren
      gedurende een voor de vervoerde diersoort of categorie van dieren door Onze Minister te bepalen periode rust hebben
      gekregen en zijn gevoederd en gedrenkt alvorens opnieuw te worden ingeladen;

      g. plaats van bestemming: plaats waar de dieren definitief van of uit een vervoermiddel worden geladen;

      h. halteplaats: plaats waar het vervoer wordt onderbroken om de dieren te laten rusten, te voederen of te drenken;

      i. overlaadplaats: plaats waar het vervoer wordt onderbroken om de dieren van het ene op het andere vervoermiddel
      over te laden;

      j. rusttijd: ononderbroken periode tijdens de reis waarin de dieren niet worden verplaatst met behulp van een
      vervoermiddel;

      k. vervoerder: iedere natuurlijke of rechtspersoon die in de uitoefening van of ten behoeve van een beroep,
      onderneming of bedrijf dieren vervoert:

        - voor eigen rekening
        - voor rekening van derden, of
        - door een vervoermiddel voor het vervoer van dieren aan een derde ter beschikking te stellen;

      l. reis: vervoer van de plaats van vertrek naar de plaats van bestemming;

      m. gezelschapsdier: dier niet zijnde vee of pluimvee dat zonder produktiedoeleinden wordt gehouden;

      n. noodslachting: slachting, al dan niet op last van de dierenarts, overeenkomstig het bepaalde ter zake van het
      slachten van zieke of van ziekte verdachte dieren in hoofdstuk II, punt 14, onder *e*, en hoofdstuk VI, punt 28,
      van Bijlage I bij [richtlijn nr. 64/433/EEG](31964L0433) van de Raad van de Europese Gemeenschappen betreffende de
      gezondheidsvoorschriften voor de produktie en het in de handel brengen van vers vlees (*PbEG* 1964, L 121 en *PbEG*
      1991, L 268);

      o. speciale noodslachting: het op last van een dierenarts, wegens een ongeval of ernstige lichamelijke en
      functionele stoornissen buiten een slachthuis doden van een dier indien de dierenarts meent dat vervoer of verder
      vervoer onmogelijk is of onnodig lijden van het dier zou meebrengen;

      p. [richtlijn 91/628/EEG](31991L0628): [richtlijn nr. 91/628/EEG](31991L0628) van de Raad van de Europese
      Gemeenschappen van 19 november 1991 betreffende de bescherming van dieren tijdens het vervoer en tot wijziging van
      de [richtlijnen nr. 90/425/EEG](31990L0425) en [nr. 91/496/EEG](31991L0496) (*PbEG* L 340);

      q. [richtlijn 90/425/EEG](31990L0425): [richtlijn nr. 90/425/EEG](31990L0425) van de Raad van de Europese
      Gemeenschappen van 26 juni 1990 betreffende veterinaire en zoötechnische controles in het intracommunautaire
      handelsverkeer in bepaalde levende diern en produkten in het vooruitzicht van de totstandbrenging van de interne
      markt (*PbEG* L 224);

      r. [richtlijn 91/496/EEG](31991L0496): [richtlijn nr. 91/496/EEG](31991L0496) van de Raad van de Europese
      Gemeenschappen van 15 juli 1991 tot vaststelling van de beginselen voor de organisatie van de veterinaire controles
      voor dieren uit derde landen die in de Gemeenschap worden binnengebracht en tot wijziging van de [richtlijnen nr.
      89/662/EEG](31989L0662), [nr. 90/425/EEG](31990L0425) en [nr. 90/675/EEG](31990L0675) (*PbEG* L 268);

      s. derde land: land, niet zijnde een lid-staat van de Europese Unie of een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte;

      t. VWA: Voedsel en Waren Autoriteit, ingesteld bij besluit van de Minister van Volksgezondheid, Welzijn en Sport
      van 8 juli 2002 (Stcrt. 127).


