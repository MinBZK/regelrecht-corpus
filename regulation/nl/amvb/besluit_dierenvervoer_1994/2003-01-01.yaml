    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0006990/2003-01-01#Artikel20
  - number: '21'
    text: |-
      Dit besluit wordt aangehaald als: Besluit dierenvervoer met vermelding van het jaartal van het *Staatsblad* waarin
      het zal worden geplaatst.
