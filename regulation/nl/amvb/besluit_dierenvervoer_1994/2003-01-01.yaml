  - number: '4'
    text: |-
      1 Als soorten en categorieën van dieren als bedoeld in [artikel 60, eerste lid, van de wet][ref1] worden aangewezen
      vee en pluimvee, alsmede als huisdier gehouden honden en katten, als huisdier gehouden vogels en konijnen, overige
      zoogdieren en vogels, overige gewervelde dieren en koudbloedige dieren.

      2 Het vervoer van de in het eerste lid bedoelde soorten of categorieën van dieren geschiedt slechts
      indien voldaan is aan het ten aanzien van die soorten en categorieën bepaalde bij of krachtens de
      [artikelen 5 tot en met 9][ref2], en [artikel 16][ref3].

      3 Het tweede lid is niet van toepassing op:

      a. vervoer dat niet geschiedt in de uitoefening van of ten behoeve van een beroep, onderneming of bedrijf;

      b. vervoer van gezelschapsdieren die hun baas gedurende een privéreis vergezellen;

      c. vervoer van elk afzonderlijk gezond dier dat vergezeld wordt door een natuurlijk persoon die gedurende het
      vervoer verantwoordelijk is voor het dier, en

      d. vervoer van vee in of op aanhangwagens, voortbewogen door een landbouwtrekker als bedoeld in
      [artikel 1.1, onderdeel ][ref4], ingeval de geografische omstandigheden vervoer tussen wei en stal of vervoer met
      het oog op verweiding vereisen en mits is voldaan aan de door Onze Minister ter zake van het vervoermiddel gestelde
      eisen.


