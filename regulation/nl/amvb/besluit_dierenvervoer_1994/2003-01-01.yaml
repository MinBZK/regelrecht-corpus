  - number: '7'
    text: |-
      1 Het vervoer van de onderscheiden soorten en categorieën van dieren, de belading, de reis- en rusttijden en
      de tussenpozen voor het voederen en drenken voldoen ten minste aan het terzake voor de desbetreffende soort of
      categorie bepaalde in de bijlage bij [richtlijn 91/628/EEG](31991L0628), onverminderd [verordening (EEG) nr.
      3820/85](31985R3820) van de Raad van de Europese Gemeenschappen van 20 december 1985 tot harmonisatie van bepaalde
      voorschriften van sociale aard voor het wegvervoer (*PbEG* L 370).

      2 Onze Minister wordt aangewezen als bevoegd gezag als bedoeld in de in het eerste lid bedoelde bijlage.

      3 Een wijziging van de in het eerste lid bedoelde bijlage treedt voor de toepassing van het eerste lid in werking
      met ingang van de dag waarop aan de betrokken wijziging uiterlijk uitvoering moet zijn gegeven.

      4 Onze Minister doet mededeling in de *Staatscourant* van een wijziging als bedoeld in het derde lid alsmede van
      het tijdstip waarop de wijziging in werking treedt.

      5 Onze Minister kan ten aanzien van het in het eerste lid bedoelde vervoer nadere regelen stellen ter zake van de
      vervoermiddelen, de beladingsdichtheid, de inrichting van de halteplaatsen en de behandeling van de dieren aldaar,
      alsmede de omstandigheden waaronder en de wijze waarop het vervoer dient plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0006990/2003-01-01#Artikel7
  - number: '8'
    text: |-
      1 Iedere vervoersonderneming die dieren vervoert, is ingeschreven in het register, bedoeld in
      [artikel 18, eerste lid, onderdeel ][ref1], dan wel in een overeenkomstig de regelgeving van een andere lid-
      staat van de Europese Unie bijgehouden register als bedoeld in artikel 5, lid A, onderdeel 1, onder *a*)*i*), van
      [richtlijn 91/628/EEG](31991L0628).

      2 Iedere in Nederland gevestigde vervoersonderneming die gewervelde dieren vervoert, beschikt over een door Onze
      Minister te verstrekken erkenning die geldig is voor vervoer van die dieren op de in bijlage l van [richtlijn
      90/675/EEG](31990L0675) bedoelde grondgebieden.

      3 Vervoersondernemingen, gevestigd in een andere lid-staat van de Europese Unie of in een derde land, beschikken
      over een erkenning afgegeven door de bevoegde autoriteit van die onderscheidenlijk een lid-staat overeenkomstig
      artikel 5, lid A, onderdeel 1, onder *a*)*ii*), van [richtlijn 91/628/EEG](31991L0628).

      4 De in het tweede lid bedoelde erkenning wordt slechts verstrekt indien de verantwoordelijke voor de betreffende
      vervoersonderneming zich schriftelijk ertoe heeft verbonden de geldende veterinaire voorschriften na te leven en
      hij daarbij in het bijzonder heeft verklaard dat de personen aan wie het vervoer wordt toevertrouwd:

      a. de nodige voorzieningen hebben getroffen om aan het bij of krachtens dit besluit bepaalde te voldoen tot aan de
      plaats van bestemming, en

      b. binnen het bedrijf of bij een opleidingsinstelling een specifieke opleiding hebben gevolgd of over
      gelijkwaardige beroepservaring beschikken om gewervelde dieren te hanteren en te vervoeren en om zo nodig de
      vervoerde dieren op passende wijze te verzorgen.

      5 Onze Minister kan ter uitvoering van het vierde lid bij ministeriële regeling nadere regelen stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0006990#Artikel18
    url: https://wetten.overheid.nl/BWBR0006990/2003-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006990
        artikel: '18'
        paragraaf: '6'
  - number: '9'
    text: |-
      1 Bij vervoer van vee over de weg met een in Nederland geregistreerd vervoermiddel is het vervoermiddel vergezeld
      van een door Onze Minister voor dat vervoermiddel afgegeven, op naam van de eigenaar of houder gesteld geldig
      bewijsstuk waaruit blijkt dat het vervoermiddel zodanig is ingericht dat het vervoer kan geschieden overeenkomstig
      het ter zake van het vervoer van de betreffende soort of categorie van vee bij of krachtens dit besluit bepaalde.

      2 Onze Minister stelt nadere regelen ten aanzien van het in het eerste lid bepaalde, waarbij hij in ieder geval het
      model en de geldigheidsduur van het in het eerste lid bedoelde bewijsstuk vaststelt.
    url: https://wetten.overheid.nl/BWBR0006990/2003-01-01#Artikel9
  - number: '10'
    text: |-
      Indien meer dan licht ziek of licht gewond vee ter noodslachting wordt vervoerd, geschiedt dit zonder onderbreking
      naar het dichtstbijzijnde daarvoor in aanmerking komende slachthuis of een ander daarvoor in aanmerking komend
      slachthuis waarvoor de vervoersafstand vanaf de plaats van inladen niet meer dan 50 km bedraagt, onverminderd het
      bepaalde bij of krachtens de [Vleeskeuringswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001896
    url: https://wetten.overheid.nl/BWBR0006990/2003-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001896
  - number: '11'
    text: |-
      1 Het in- en uitladen, met inbegrip van de aanvoer naar onderscheidenlijk de afvoer vanaf het vervoermiddel
      van meer dan licht ziek of licht gewond vee dat zich niet op eigen kracht kan voortbewegen, geschiedt met een
      hulpmiddel dat onnodig lijden van de dieren voorkomt.

      2 Tijdens het vervoer van meer dan licht ziek of licht gewond vee is een hulpmiddel als bedoeld in het eerste lid
      in het vervoermiddel aanwezig.
    url: https://wetten.overheid.nl/BWBR0006990/2003-01-01#Artikel11
  - number: '12'
    text: Meer dan licht ziek of licht gewond vee wordt niet tezamen met andere dieren in één vervoermiddel vervoerd.
    url: https://wetten.overheid.nl/BWBR0006990/2003-01-01#Artikel12
  - number: '13'
    text: Meer dan licht ziek of licht gewond vee moet zacht kunnen liggen en staan.
    url: https://wetten.overheid.nl/BWBR0006990/2003-01-01#Artikel13
  - number: '14'
    text: |-
      1 Meer dan licht ziek of licht gewond vee wordt nadat het eenmaal is uitgeladen, niet opnieuw in hetzelfde dan wel
      in een ander vervoermiddel ingeladen.

      2 Het eerste lid is niet van toepassing ter zake van vee dat is uitgeladen ten behoeve van een diergeneeskundige
      behandeling alsmede ter zake van vee dat tijdens het vervoer ziek is geworden of gewond is geraakt en zich bevindt
      op een andere plaats dan een slachthuis, mits het vervoer onmiddellijk na het in- of overladen wordt voortgezet met
      inachtneming van de [artikelen 10 tot en met 14, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006990#Artikel10
    url: https://wetten.overheid.nl/BWBR0006990/2003-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006990
        artikel: '10'
        paragraaf: '5'
  - number: '16'
    text: |-
      Onverminderd het overigens ten aanzien van het vervoer bepaalde geschiedt het vervoer overeenkomstig de door Onze
      Minister met het oog op de controle en ter uitvoering van [richtlijn 90/425/EEG](31990L0425) onderscheidenlijk
      [richtlijn 91/496/EEG](31991L0496) te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0006990/2003-01-01#Artikel16
  - number: '17'
    text: |-
      1 Indien bij vervoer over een afstand van meer dan 50 km in strijd met bij of krachtens dit besluit gestelde
      verplichtingen is gehandeld, is Onze Minister bevoegd tot toepassing van bestuursdwang indien het welzijn van de
      dieren dit noodzakelijk maakt.

      2 Tot de toepassing van bestuursdwang krachtens het eerste lid behoort:

      a. de reis stop te zetten of de dieren langs de kortste weg naar de plaats van vertrek terug te zenden, voor zover
      daardoor geen onnodig lijden van de dieren wordt veroorzaakt;

      b. de dieren adequaat onder te brengen, of

      c. de dieren te doen slachten.

      3 Op de uitvoering van dit artikel zijn het tweede en derde lid van [artikel 117 van de wet][ref1] van
      overeenkomstige toepassing.

      4 In geval van herhaalde overtredingen door personen werkzaam bij de desbetreffende vervoersonderneming van
      de [artikelen 58][ref2] of [59 van de wet][ref3], dan wel van het bij of krachtens dit besluit bepaalde of
      in geval van een overtreding waarbij de dieren ernstig lijden, kan Onze Minister de erkenning, bedoeld in
      [artikel 8, tweede lid][ref4], schorsen voor een bepaalde tijd of intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel117
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0005662#Artikel59
      [ref4]: https://wetten.overheid.nl/BWBR0006990#Artikel8
    url: https://wetten.overheid.nl/BWBR0006990/2003-01-01#Artikel17
    references:
      - id: ref1
