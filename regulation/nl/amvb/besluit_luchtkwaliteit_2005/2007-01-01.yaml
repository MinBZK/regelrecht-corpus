  - number: '29.6'
    text: Een inventarisatie als bedoeld in het eerste lid, vindt voor de eerste maal plaats in 2006.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel29
  - number: '30.1'
    text: |-
      Voorzover Onze Minister de in de [artikelen 26, eerste lid][ref1], en [29, eerste lid][ref2], bedoelde plaatsen
      inventariseert en met overeenkomstige toepassing van de [artikelen 25 tot en met 29][ref3] de luchtverontreiniging
      vaststelt, zijn Onze Minister van Verkeer en Waterstaat, onderscheidenlijk gedeputeerde staten en burgemeester en
      wethouders, daartoe niet verplicht.


      [ref1]: https://wetten.overheid.nl/BWBR0018458#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0018458#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0018458#Artikel25
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel30
    references:
