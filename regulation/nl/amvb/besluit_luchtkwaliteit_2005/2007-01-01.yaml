preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 3 juni
    2005, nr. MJZ2005060047, Directie Juridische Zaken, Afdeling Wetgeving;

    Gelet op richtlijn nr. 2000/69/EG van het Europees Parlement en de Raad van de Europese Unie van 16 november
    2000 betreffende grenswaarden voor benzeen en koolmonoxide in de lucht (PbEG L 313), richtlijn nr. 1999/30/EG
    van de Raad van de Europese Unie van 22 april 1999, betreffende grenswaarden voor zwaveldioxide, stikstofdioxide
    en stikstofoxiden, zwevende deeltjes en lood in de lucht (PbEG L 163), richtlijn nr. 96/62/EG van de Raad van
    de Europese Unie van 27 september 1996 inzake de beoordeling en het beheer van de luchtkwaliteit (PbEG L 296),
    richtlijn nr. 2003/35/EG van het Europees Parlement en de Raad van 26 mei 2003 tot voorziening in inspraak van het
    publiek in de opstelling van bepaalde plannen en programma’s betreffende het milieu en, met betrekking tot inspraak
    van het publiek en toegang tot de rechter, tot wijziging van de richtlijnen 85/337/EEG en 96/61/EG van de Raad
    (PbEU L 156), de artikelen 53, 59 en 89 van de Wet inzake de luchtverontreiniging, en de artikelen 5.1, 5.2, 5.2a,
    en 5.3, van de Wet milieubeheer;

    De Raad van State gehoord (advies van 15 juni 2005, nr. W08.05.0176/V);

    Gezien het nader rapport van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 17
    juni 2005, nr. MJZ2005125886, Directie Juridische Zaken, Afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: *acht-uurgemiddelde concentratie*:
      concentratie in de buitenlucht, gemiddeld over acht achtereenvolgende uurgemiddelde concentraties, uitgedrukt
      in microgram per m3 lucht bij een temperatuur van 293 Kelvin en een druk van 101,3 kiloPascal; *agglomeratie*:
      stedelijk gebied met ten minste 250.000 inwoners; *alarmdrempel*: kwaliteitsniveau van de buitenlucht dat bij
      kortstondige overschrijding risico’s voor de gezondheid van de mens inhoudt; *autosnelweg*: autosnelweg in de zin
      van [artikel 1 van het Reglement verkeersregels en verkeerstekens 1990][ref1]; *beoordelen van de luchtkwaliteit*:
      ingevolge [paragraaf 3][ref2] vaststellen, dan wel overeenkomstig het bepaalde in [paragraaf 3][ref3]
      prognosticeren van het kwaliteitsniveau van de buitenlucht; *grenswaarde*: grenswaarde als bedoeld in
      [artikel 5.1 van de wet][ref4] ten aanzien van het kwaliteitsniveau van de buitenlucht; *inrichting*: inrichting
      die behoort tot een krachtens [artikel 1.1, derde lid, van de wet][ref5], aangewezen categorie; *jaargemiddelde
      concentratie*: concentratie in de buitenlucht, gemiddeld over vierentwintig-uurgemiddelde concentraties in een
      kalenderjaar, uitgedrukt in microgram per m3 lucht bij een temperatuur van 293 Kelvin en een druk van 101,3
      kiloPascal voor zwaveldioxide, stikstofdioxide, stikstofoxiden, lood en benzeen en bij heersende temperatuur en
      druk voor zwevende deeltjes (PM); *meetmethode*: procedure van het bemonsteren van de buitenlucht, het analyseren
      van aldus verkregen luchtmonsters, het kalibreren van daartoe te gebruiken apparatuur, alsmede de verwerking
      van het signaal tot uurgemiddelde, dan wel acht-uurgemiddelde onderscheidenlijk vierentwintig-uurgemiddelde
      concentraties; *meetperiode*: periode van 1 januari tot en met 31 december in een kalenderjaar; *motorvoertuig*:
      motorvoertuig in de zin van [artikel 1 van het Reglement verkeersregels en verkeerstekens 1990][ref6];
      *natuurverschijnselen*: seismische activiteit, spontane branden, stormen, atmosferische resuspensie en verplaatsing
      van natuurlijke deeltjes uit droge gebieden, die een significante verhoging van de normale achtergrondconcentraties
      van natuurlijke oorsprong ten gevolge hebben; *plandrempel*: kwaliteitsniveau van de buitenlucht dat bij
      overschrijden aanleiding geeft tot het opstellen van een plan als bedoeld in [artikel 9][ref7]; *stikstofoxiden*:
      het totale aantal volumedelen stikstofmonoxide en stikstofdioxide per miljard volumedelen, uitgedrukt in
      microgrammen stikstofdioxide per m3; *uurgemiddelde concentratie*: concentratie in de buitenlucht, gemiddeld
      over een heel uur, uitgedrukt in microgram per m3 lucht bij een temperatuur van 293 Kelvin en een druk van 101,3
      kiloPascal; *vierentwintig-uurgemiddelde concentratie*: concentratie in de buitenlucht, gemiddeld over het tijdvak
      van 0.00 uur tot 24.00 uur Midden-Europese-Tijd, uitgedrukt in microgram per m3 lucht bij een temperatuur van
      293 Kelvin en een druk van 101,3 kiloPascal voor zwaveldioxide en bij heersende temperatuur en druk voor zwevende
      deeltjes (PM); *wet*: [Wet milieubeheer][ref8]; *winterhalfjaargemiddelde concentratie*: concentratie in de
      buitenlucht, gemiddeld over vierentwintig-uurgemiddelde concentraties van 1 oktober tot en met 31 maart, uitgedrukt
      in microgram per m3 lucht bij een temperatuur van 293 Kelvin en een druk van 101,3 kiloPascal; *zone*: gedeelte
      van het Nederlandse grondgebied; *zwevende deeltjes (PM)*: in de buitenlucht voorkomende stofdeeltjes die een
      op grootte selecterende instroomopening passeren met een efficiencygrens van 50 procent bij een aërodynamische
      diameter van 10 micrometer.


