      - id: ref2
        bwb_id: BWBR0018458
        artikel: '9'
        paragraaf: '1'
  - number: '36'
    text: |-
      Het [Besluit luchtkwaliteit][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0012550
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0012550
  - number: '37'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip en werkt ten aanzien van de
      bevoegdheden, bedoeld in [artikel 7, eerste lid][ref1], van dit besluit, die zijn uitgeoefend voor dat tijdstip en
      na 4 mei 2005 terug tot laatstgenoemde datum.


      [ref1]: https://wetten.overheid.nl/BWBR0018458#Artikel7
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0018458
        artikel: '7'
        paragraaf: '1'
  - number: '38'
    text: 'Dit besluit wordt aangehaald als: Besluit luchtkwaliteit 2005.'
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel38
