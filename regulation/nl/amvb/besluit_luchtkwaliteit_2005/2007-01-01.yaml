  - number: '3.1'
    text: Onze Minister wijst voor de toepassing van dit besluit zones en agglomeraties aan.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel3
  - number: '3.2'
    text: |-
      Onze Minister overweegt ten minste eenmaal in de vijf jaar in hoeverre de indeling van zones en agglomeraties voor
      de vaststelling van de luchtverontreiniging overeenkomstig [artikel 25][ref1] aanpassing behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0018458#Artikel25
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018458
        artikel: '25'
        paragraaf: '3'
  - number: '3.3'
    text: Aan het tweede lid wordt voor de eerste maal gevolg gegeven voor 1 januari 2010.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel3
  - number: '4'
    text: |-
      Onze Minister overweegt ten minste eenmaal in de acht jaar in hoeverre de in [paragraaf 2][ref1] genoemde waarden
      herziening behoeven en stelt de Staten-Generaal in kennis van zijn bevindingen daaromtrent.


      [ref1]: https://wetten.overheid.nl/BWBR0018458#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018458
        paragraaf: '2'
  - number: '5.1'
    text: |-
      Concentraties die zich van nature in de lucht bevinden en die niet schadelijk zijn voor de gezondheid van de mens,
      worden bij het beoordelen van de luchtkwaliteit voor zwevende deeltjes (PM) buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel5
  - number: '5.2'
    text: |-
      Concentraties van zwevende deeltjes (PM) die veroorzaakt worden door natuurverschijnselen worden bij het beoordelen
      van de luchtkwaliteit buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel5
  - number: '6'
    text: |-
      Bij ministeriële regeling worden voor de toepassing van dit besluit regels gesteld aangaande de wijze van meten en
      berekenen en de frequentie daarvan.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel6
  - number: '7.1'
    text: |-
      Bestuursorganen nemen bij de uitoefening van bevoegdheden dan wel bij de toepassingen van wettelijke voorschriften
      die gevolgen kunnen hebben voor de luchtkwaliteit, de in [paragraaf 2][ref1] genoemde grenswaarden voor
      zwaveldioxide, stikstofdioxide, stikstofoxiden, zwevende deeltjes (PM), lood, koolmonoxide en benzeen in acht.


