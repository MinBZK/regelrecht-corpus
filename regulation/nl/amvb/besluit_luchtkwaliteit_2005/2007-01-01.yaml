  - number: '33.2'
    text: |-
      In het in het eerste lid bedoelde verslag geven gedeputeerde staten een overzicht van de luchtverontreiniging
      door zwaveldioxide, stikstofdioxide, stikstofoxiden, zwevende deeltjes (PM), koolmonoxide en benzeen in de
      binnen de provincie gelegen agglomeraties, alsmede van de maatregelen en plannen om de toepasselijke in de
      [artikelen 12][ref1], [15][ref2], [21][ref3], [22][ref4] en [23][ref5] genoemde grenswaarden daar te bereiken of te
      handhaven. De tweede volzin van het eerste lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018458#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0018458#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0018458#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0018458#Artikel22
      [ref5]: https://wetten.overheid.nl/BWBR0018458#Artikel23
