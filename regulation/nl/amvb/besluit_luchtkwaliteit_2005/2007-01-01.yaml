        paragraaf: '3'
  - number: '30.2'
    text: |-
      Het bestuursorgaan dat de in de [artikelen 26, eerste lid][ref1], en [29, eerste lid][ref2], bedoelde plaatsen
      inventariseert en krachtens de [artikelen 25][ref3], [26][ref4], [28][ref5] en [29][ref6] de luchtverontreiniging
      vaststelt, draagt zorg voor de bekostiging daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0018458#Artikel26
