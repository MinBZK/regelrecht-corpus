        artikel: '26'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0018458
        artikel: '28'
        paragraaf: '3'
      - id: ref6
        bwb_id: BWBR0018458
        artikel: '29'
        paragraaf: '3'
  - number: '31.1'
    text: 'Onze Minister kan:'
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel31
  - number: 31.1.a
    text: |-
      de nauwkeurigheid van een meetmethode of een andere methode waarmee de luchtverontreiniging vastgesteld wordt
      toetsen,
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel31
  - number: 31.1.b
    text: de nauwkeurigheid van de toepassing van een onder a bedoelde methode toetsen.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel31
  - number: '31.2'
    text: |-
      De door middel van de toetsing verkregen resultaten treden in de plaats van eerdere of anderszins verkregen
      resultaten.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel31
  - number: '31.3'
    text: Onze Minister maakt de in het tweede lid bedoelde resultaten kenbaar aan het betreffende bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel31
  - number: '32.1'
    text: |-
      Burgemeester en wethouders doen van een inventarisatie als bedoeld in [artikel 26, eerste lid][ref1], voor 1 mei
      van het jaar waarin die inventarisatie is verricht, aan gedeputeerde staten schriftelijk verslag.


      [ref1]: https://wetten.overheid.nl/BWBR0018458#Artikel26
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0018458
        artikel: '26'
        paragraaf: '3'
  - number: '32.2'
    text: |-
      Burgemeester en wethouders doen op basis van de vaststelling van de luchtverontreiniging door stikstofdioxide,
      zwevende deeltjes (PM), koolmonoxide en benzeen bedoeld in [artikel 26, tweede, derde, vierde of zesde lid][ref1],
      voor 1 mei van het jaar waarin de vaststelling heeft plaatsgevonden aan gedeputeerde staten schriftelijk verslag
      van:


      [ref1]: https://wetten.overheid.nl/BWBR0018458#Artikel26
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0018458
        artikel: '26'
        paragraaf: '3'
  - number: 32.2.a
    text: |-
      de plaatsen waar overschrijding van de in de [artikelen 15][ref1], [20][ref2], [22][ref3] en [23][ref4] genoemde
      grenswaarden is opgetreden, alsmede van de hoogte van de luchtverontreiniging op die plaatsen;


      [ref1]: https://wetten.overheid.nl/BWBR0018458#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0018458#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0018458#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0018458#Artikel23
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0018458
        artikel: '15'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018458
        artikel: '20'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0018458
        artikel: '22'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0018458
        artikel: '23'
        paragraaf: '2'
  - number: 32.2.b
    text: |-
      de plaatsen waar overschrijding van de in de [artikelen 16][ref1] en [17][ref2] genoemde plandrempels voor
      stikstofdioxide, onderscheidenlijk de in [artikel 24][ref3] genoemde plandrempels voor benzeen is opgetreden
      alsmede van de hoogte van de luchtverontreiniging op die plaatsen;


      [ref1]: https://wetten.overheid.nl/BWBR0018458#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0018458#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0018458#Artikel24
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0018458
        artikel: '16'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018458
        artikel: '17'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0018458
        artikel: '24'
        paragraaf: '2'
  - number: 32.2.c
    text: de reden van de overschrijding van de in onderdeel a of b bedoelde grenswaarden of plandrempels;
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel32
  - number: 32.2.d
    text: |-
      de gebruikte meetmethode, de data waarop of de periode waarin de overschrijding van de in onderdeel a of b bedoelde
      grenswaarden of plandrempels is opgetreden ingeval de vaststelling van de luchtverontreiniging door middel van
      metingen is verricht;
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel32
  - number: 32.2.e
    text: |-
      de aan deze vaststelling ten grondslag liggende gegevens ingeval de vaststelling van de luchtverontreiniging door
      middel van een andere methode is verricht, en
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel32
  - number: 32.2.f
    text: |-
      de maatregelen die zij hebben genomen of nog zullen nemen om de in de [artikelen 15][ref1], [20][ref2], [22][ref3]
      en [23][ref4] genoemde grenswaarden te bereiken of te handhaven.


      [ref1]: https://wetten.overheid.nl/BWBR0018458#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0018458#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0018458#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0018458#Artikel23
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0018458
        artikel: '15'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018458
        artikel: '20'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0018458
        artikel: '22'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0018458
        artikel: '23'
        paragraaf: '2'
  - number: '32.3'
    text: |-
      Indien het tweede lid, onder e, van toepassing is, vermelden burgemeester en wethouders tevens de oppervlakte
      van de plaatsen, bedoeld in het tweede lid, onder a, in vierkante kilometers of, indien van toepassing, de lengte
      van wegen in kilometers, alsmede de omvang van de bevolkingsgroep die aan de betreffende concentraties wordt
      blootgesteld.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel32
  - number: '33.1'
    text: |-
      Gedeputeerde staten doen in een jaar waarin een inventarisatie als bedoeld in
      [artikel 26, eerste lid][ref1], onderscheidenlijk [29, eerste lid][ref2], of een vaststelling als
      bedoeld in [artikel 26, tweede, derde, vierde of zesde lid][ref3], [28][ref4] onderscheidenlijk
      [29, tweede of derde lid][ref5], heeft plaatsgevonden, voor 1 juli schriftelijk verslag aan Onze Minister van
      de luchtverontreiniging door zwaveldioxide, stikstofdioxide, stikstofoxiden, zwevende deeltjes (PM), lood,
      koolmonoxide en benzeen in de provincie alsmede van de maatregelen en plannen om de in de [artikelen 12][ref6],
      [15][ref7], [20][ref8], [21][ref9], [22][ref10] en [23][ref11] genoemde waarden te bereiken of te handhaven.
      Zij betrekken in hun verslag de resultaten van de ingevolge [artikel 26][ref12] verrichte vaststelling van de
      luchtverontreiniging, de ingevolge [artikel 32][ref13] opgestelde verslagen en de ingevolge [artikel 9][ref14]
      opgestelde plannen. In het verslag wordt melding gemaakt van ingevolge [artikel 25][ref15] vastgestelde
      overschrijding van de in de [artikelen 13][ref16] en [18][ref17] genoemde waarden.


      [ref1]: https://wetten.overheid.nl/BWBR0018458#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0018458#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0018458#Artikel26
