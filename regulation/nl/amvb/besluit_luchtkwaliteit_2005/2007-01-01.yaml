  - number: '35'
    text: |-
      Een plan, opgesteld op grond van of overeenkomstig [artikel 25 van het Besluit luchtkwaliteit][ref1], geldt als een
      plan, opgesteld op grond van [artikel 9][ref2] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0012550#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0018458#Artikel9
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel35
    references:
