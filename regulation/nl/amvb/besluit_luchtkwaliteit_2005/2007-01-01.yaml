        artikel: '9'
        paragraaf: '1'
  - number: '8.2'
    text: |-
      Omtrent het treffen van maatregelen bevorderen gedeputeerde staten een regelmatig overleg met de betrokken andere
      bestuursorganen binnen het gebied van de provincie en met de inspecteur.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel8
  - number: '9.1'
    text: |-
      Wanneer uit vaststelling van de luchtverontreiniging ingevolge [artikel 26][ref1] of een verslag ingevolge
      [artikel 32][ref2] blijkt dat een plandrempel als bedoeld in de [artikelen 16][ref3], [17][ref4] en [24][ref5]
      wordt overschreden, stellen burgemeester en wethouders een actieplan vast, waarin wordt aangegeven op welke
      wijze op die plaatsen voldaan zal worden aan de grenswaarden voor de betreffende stof, binnen de voor die waarden
      gestelde termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0018458#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0018458#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0018458#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0018458#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0018458#Artikel24
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018458
        artikel: '26'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018458
        artikel: '32'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0018458
        artikel: '16'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0018458
        artikel: '17'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0018458
        artikel: '24'
        paragraaf: '2'
  - number: '9.2'
    text: |-
      Op de voorbereiding van een plan als bedoeld in het eerste lid, is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing. Zienswijzen kunnen naar voren worden
      gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '9.3'
    text: Burgemeester en wethouders dragen zorg voor de uitvoering van het actieplan.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel9
  - number: '9.4'
    text: |-
      Gedeputeerde staten, Onze Minister van Verkeer en Waterstaat en andere bestuursorganen die maatregelen als bedoeld
      in [artikel 8][ref1] kunnen treffen, leveren op verzoek van burgemeester en wethouders een bijdrage aan het
      opstellen en uitvoeren van een plan als bedoeld in het eerste lid. Daarbij geven de betreffende bestuursorganen in
      het plan gemotiveerd rekenschap van het al dan niet treffen van maatregelen. Omtrent het opstellen en uitvoeren van
      het actieplan bevorderen burgemeester en wethouders overleg met de betreffende bestuursorganen.


      [ref1]: https://wetten.overheid.nl/BWBR0018458#Artikel8
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018458
        artikel: '8'
        paragraaf: '1'
  - number: '9.5'
    text: |-
      Burgemeester en wethouders stellen gedeputeerde staten in kennis van een actieplan als bedoeld in het eerste lid,
      voor 1 mei van het jaar volgend op het jaar waarin de overschrijding van de betrokken plandrempels met inachtneming
      van de in de [artikelen 26][ref1] en [32][ref2] gestelde regels is vastgesteld en gerapporteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0018458#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0018458#Artikel32
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018458
        artikel: '26'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018458
        artikel: '32'
        paragraaf: '5'
  - number: '9.6'
    text: |-
      Burgemeester en wethouders stellen gedeputeerde staten eenmaal in de drie jaar voor 1 mei van het op die periode
      volgende jaar in kennis van de voortgang van de uitvoering van het in het eerste lid bedoelde actieplan.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel9
  - number: '9.7'
    text: |-
      Gedeputeerde staten stellen Onze Minister voor 1 juli van het jaar, bedoeld in het vijfde lid, in kennis van de
      ingevolge dat lid ontvangen actieplannen.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel9
  - number: '9.8'
    text: |-
      Gedeputeerde staten stellen Onze Minister eenmaal in de drie jaar voor 1 juli van het op die periode volgende jaar
      in kennis van de voortgang van de uitvoering van de in het eerste lid bedoelde actieplannen.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel9
  - number: '10.1'
    text: |-
      Een actieplan als bedoeld in [artikel 9, eerste lid][ref1], bevat tenminste de in bijlage IV van de EG-
      kaderrichtlijn luchtkwaliteit opgenomen gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0018458#Artikel9
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0018458
        artikel: '9'
        paragraaf: '1'
  - number: '10.2'
    text: |-
      Een wijziging van bijlage IV van de EG-kaderrichtlijn luchtkwaliteit gaat voor de toepassing van het eerste lid
      gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel10
  - number: '10.3'
    text: |-
      Voor gevallen waarin ingevolge [artikel 9][ref1] of ingevolge [artikel 13 van de Regeling luchtkwaliteit ozon][ref2]
      voor meer dan een stof een actieplan wordt vastgesteld en uitgevoerd, draagt het betrokken bestuursorgaan zorg voor
      één actieplan voor de betreffende stoffen. Het eerste lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018458#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0017451#Artikel13
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0018458
        artikel: '9'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017451
        artikel: '13'
  - number: '11.1'
    text: |-
      De commissaris van de Koningin doet van een overschrijding van een alarmdrempel als bedoeld in [artikel 14][ref1]
      of [18][ref2], zo spoedig mogelijk mededeling aan het publiek. Daarbij worden ten minste de volgende gegevens
      verstrekt:


      [ref1]: https://wetten.overheid.nl/BWBR0018458#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0018458#Artikel18
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0018458
        artikel: '14'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018458
        artikel: '18'
        paragraaf: '2'
  - number: 11.1.a
    text: |-
      de drempel die is overschreden, de datum, het tijdstip, de duur en de plaats van de overschrijding en, indien
      bekend, de oorzaak van de overschrijding;
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel11
  - number: 11.1.b
    text: |-
      een prognose voor de volgende middag, dag of dagen, met betrekking tot: - de ontwikkeling van de concentratie en de
      gegevens die aan die verwachting ten grondslag liggen,
        - het geografische gebied waar de overschrijding zich zal voordoen en
        - de duur van de overschrijding;
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel11
  - number: 11.1.c
    text: |-
      de bevolkingsgroep of bevolkingsgroepen waarvoor de overschrijding risico’s kan inhouden voor de gezondheid,
      alsmede de te verwachten symptomen en te treffen voorzorgsmaatregelen;
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel11
  - number: 11.1.d
    text: bronnen voor het verkrijgen van nadere informatie.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel11
  - number: '11.2'
    text: |-
      Wanneer een alarmdrempel dreigt te worden overschreden, geeft de commissaris van de Koningin, voor zover dat in de
      gegeven omstandigheden redelijkerwijs mogelijk is, uitvoering aan het eerste lid, met uitzondering van onderdeel a.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel11
  - number: '11.3'
    text: |-
      [Artikel 48, derde lid, van de Wet inzake de luchtverontreiniging][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002731#Artikel48
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002731
        artikel: '48'
  - number: '12'
    text: 'Voor zwaveldioxide gelden de volgende grenswaarden voor de bescherming van de gezondheid van de mens:'
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel12
  - number: 12.a
    text: |-
      350 microgram per m3 als uurgemiddelde concentratie, waarbij geldt dat deze maximaal vierentwintig maal per
      kalenderjaar mag worden overschreden;
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel12
  - number: 12.b
    text: |-
      125 microgram per m3 als vierentwintig-uurgemiddelde concentratie, waarbij geldt dat deze maximaal drie maal per
      kalenderjaar mag worden overschreden.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel12
  - number: '13'
    text: |-
      Voor zwaveldioxide gelden de volgende grenswaarden voor de bescherming van ecosystemen, in gebieden met een
      oppervlakte van ten minste 1000 km2 die gelegen zijn op een afstand van ten minste 20 km van agglomeraties of op
      een afstand van ten minste 5 km van andere gebieden met bebouwing, van inrichtingen of van autosnelwegen, waar het
      ecosysteem naar het oordeel van het bevoegde bestuursorgaan bijzondere bescherming behoeft:
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel13
  - number: 13.a
    text: 20 microgram per m3 als jaargemiddelde concentratie;
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel13
  - number: 13.b
    text: 20 microgram per m3 als winterhalfjaargemiddelde concentratie.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel13
  - number: '14'
    text: |-
      Voor zwaveldioxide geldt 500 microgram per m3 als uurgemiddelde concentratie gedurende drie achtereenvolgende uren,
      in gebieden van ten minste 100 km2, als alarmdrempel.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel14
  - number: '15.1'
    text: 'Voor stikstofdioxide gelden de volgende grenswaarden voor de bescherming van de gezondheid van de mens:'
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel15
  - number: 15.1.a
    text: |-
      200 microgram per m3 als uurgemiddelde concentratie, waarbij geldt dat deze maximaal achttien maal per kalenderjaar
      mag worden overschreden, en
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel15
  - number: 15.1.b
    text: 40 microgram per m3 als jaargemiddelde concentratie, uiterlijk op 1 januari 2010.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel15
  - number: '15.2'
    text: |-
      Het eerste lid, onder a, is met ingang van 1 januari 2010 van toepassing bij wegen waarvan ten minste 40.000
      motorvoertuigen per etmaal gebruik maken.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel15
  - number: '15.3'
    text: |-
      Tot 1 januari 2010 geldt bij de wegen, bedoeld in het tweede lid, voor stikstofdioxide een grenswaarde voor de
      bescherming van de gezondheid van de mens van 290 microgram per m3 als uurgemiddelde concentratie, waarbij geldt
      dat deze maximaal achttien maal per kalenderjaar mag worden overschreden.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel15
  - number: '15.4'
    text: |-
      Indien ten gevolge van maatregelen die door één of meer bestuursorganen zijn genomen met het oog op het voorkomen
      of beperken van luchtverontreiniging bij de wegen, bedoeld in het tweede lid, in een kalenderjaar voor het jaar
      2010 de grenswaarde wordt bereikt van 200 microgram per m3 als uurgemiddelde concentratie, met maximaal achttien
      overschrijdingen per kalenderjaar, geldt, in afwijking van het tweede en derde lid, deze grenswaarde met ingang van
      het jaar volgend op het jaar waarin de grenswaarde, bedoeld in de eerste volzin is bereikt.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel15
  - number: '16'
    text: |-
      Voor stikstofdioxide gelden de volgende plandrempels voor de bescherming van de gezondheid van de mens,
      gedefinieerd als jaargemiddelde concentraties:
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel16
  - number: 16.a
    text: in 2005, 50 microgram per m3;
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel16
  - number: 16.b
    text: in 2006, 48 microgram per m3;
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel16
  - number: 16.c
    text: in 2007, 46 microgram per m3;
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel16
  - number: 16.d
    text: in 2008, 44 microgram per m3;
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel16
  - number: 16.e
    text: in 2009, 42 microgram per m3.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel16
  - number: '17'
    text: |-
      Voor stikstofdioxide gelden bij de wegen, bedoeld in [artikel 15, tweede lid][ref1], de volgende plandrempels voor
      de bescherming van de gezondheid van de mens, gedefinieerd als uurgemiddelde concentraties waarbij geldt dat deze
      maximaal achttien maal per kalenderjaar mogen worden overschreden:


      [ref1]: https://wetten.overheid.nl/BWBR0018458#Artikel15
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0018458
        artikel: '15'
        paragraaf: '2'
  - number: 17.a
    text: in 2005, 250 microgram per m3;
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel17
  - number: 17.b
    text: in 2006, 240 microgram per m3;
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel17
  - number: 17.c
    text: in 2007, 230 microgram per m3;
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel17
  - number: 17.d
    text: in 2008, 220 microgram per m3;
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel17
  - number: 17.e
    text: in 2009, 210 microgram per m3.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel17
  - number: '18'
    text: |-
      Voor stikstofdioxide geldt 400 microgram per m3 als uurgemiddelde concentratie gedurende drie achtereenvolgende
      uren, in gebieden met een oppervlakte van ten minste 100 km2, als alarmdrempel.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel18
  - number: '19'
    text: |-
      Voor stikstofoxiden geldt 30 microgram per m3 als jaargemiddelde concentratie als grenswaarde voor de bescherming
      van vegetatie, in gebieden met een oppervlakte van ten minste 1000 km2 die gelegen zijn op een afstand van ten
      minste 20 km van agglomeraties of op een afstand van ten minste 5 km van andere gebieden met bebouwing, van
      inrichtingen of van autosnelwegen, waar de vegetatie naar het oordeel van het bevoegde bestuursorgaan bijzondere
      bescherming behoeft.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel19
  - number: '20'
    text: 'Voor zwevende deeltjes (PM) gelden de volgende grenswaarden voor de bescherming van de gezondheid van de mens:'
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel20
  - number: 20.a
    text: 40 microgram per m3 als jaargemiddelde concentratie;
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel20
  - number: 20.b
    text: |-
      50 microgram per m3 als vierentwintig-uurgemiddelde concentratie, waarbij geldt dat deze maximaal vijfendertig maal
      per kalenderjaar mag worden overschreden.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel20
  - number: '21'
    text: |-
      Voor lood geldt 0,5 microgram per m3 als jaargemiddelde concentratie als grenswaarde voor de bescherming van de
      gezondheid van de mens.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel21
  - number: '22'
    text: |-
      Voor koolmonoxide geldt 10.000 microgram per m3 als acht-uurgemiddelde concentratie als grenswaarde voor de
      bescherming van de gezondheid van de mens.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel22
  - number: '23'
    text: |-
      Voor benzeen gelden de volgende grenswaarden voor de bescherming van de gezondheid van de mens, gedefinieerd als
      jaargemiddelde concentraties:
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel23
  - number: 23.a
    text: tot 1 januari 2010, 10 microgram per m3;
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel23
  - number: 23.b
    text: met ingang van 1 januari 2010, 5 microgram per m3.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel23
  - number: '24'
    text: |-
      Voor benzeen gelden de volgende plandrempels voor de bescherming van de gezondheid van de mens, gedefinieerd als
      jaargemiddelde concentraties:
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel24
  - number: 24.a
    text: in 2006, 9 microgram per m3;
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel24
  - number: 24.b
    text: in 2007, 8 microgram per m3;
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel24
  - number: 24.c
    text: in 2008, 7 microgram per m3;
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel24
  - number: 24.d
    text: in 2009, 6 microgram per m3.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel24
  - number: '25.1'
    text: |-
      Gedeputeerde staten stellen in zones en agglomeraties de luchtverontreiniging door zwaveldioxide, stikstofdioxide,
      stikstofoxiden, zwevende deeltjes (PM), lood, koolmonoxide en benzeen vast met gebruikmaking van vaste meetpunten.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel25
  - number: '25.2'
    text: |-
      Voor de meting van de luchtverontreiniging door zwaveldioxide wordt gebruik gemaakt van een meetmethode waarvan
      de bovenste analysegrens ten minste 1000 microgram per m3 bedraagt en waarbij de onder operationele condities
      verkregen meetwaarden zodanig zijn dat met een waarschijnlijkheid van 95 procent de totale afwijking tussen de
      gemeten en de werkelijke concentratie minder is dan 15 procent voor uurgemiddelde concentraties, groter dan 75
      microgram per m3. De eerste volzin is niet van toepassing in de in [artikel 9][ref1] bedoelde gebieden.


      [ref1]: https://wetten.overheid.nl/BWBR0018458#Artikel9
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0018458
        artikel: '9'
        paragraaf: '1'
  - number: '25.3'
    text: |-
      Voor de meting van de luchtverontreiniging door zwaveldioxide wordt in de in [artikel 9][ref1] bedoelde gebieden
      gebruik gemaakt van een meetmethode waarvan de bovenste analysegrens ten minste 500 microgram per m3 bedraagt
      en waarbij de onder operationele condities verkregen meetwaarden zodanig zijn dat met een waarschijnlijkheid
      van 95 procent de totale afwijking tussen de gemeten en de werkelijke concentratie minder is dan 15 procent voor
      jaargemiddelde concentraties, groter dan 12 microgram per m3.


      [ref1]: https://wetten.overheid.nl/BWBR0018458#Artikel9
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0018458
        artikel: '9'
        paragraaf: '1'
  - number: '25.4'
    text: |-
      Voor de meting van de luchtverontreiniging door stikstofdioxide wordt gebruik gemaakt van een meetmethode waarvan
      de bovenste analysegrens ten minste 500 microgram per m3 bedraagt en waarbij de onder operationele condities
      verkregen meetwaarden zodanig zijn dat met een waarschijnlijkheid van 95 procent de totale afwijking tussen de
      gemeten en de werkelijke concentratie minder is dan 15 procent voor uurgemiddelde concentraties, groter dan 32
      microgram per m3.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel25
  - number: '25.5'
    text: |-
      Voor de meting van de luchtverontreiniging door stikstofoxiden wordt gebruik gemaakt van een meetmethode waarvan de
      bovenste analysegrens ten minste 500 microgram per m3 bedraagt en waarbij de onder operationele condities verkregen
      meetwaarden zodanig zijn dat met een waarschijnlijkheid van 95 procent de totale afwijking tussen de gemeten en de
      werkelijke concentratie minder is dan 15 procent voor jaargemiddelde concentraties, groter dan 24 microgram per m3.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel25
  - number: '25.6'
    text: |-
      Voor de meting van de luchtverontreiniging door zwevende deeltjes (PM) wordt gebruik gemaakt van een meetmethode
      waarvan de bovenste analysegrens ten minste 400 microgram per m3 bedraagt en waarbij de onder operationele
      condities verkregen meetwaarden zodanig zijn dat met een waarschijnlijkheid van 95 procent de totale afwijking
      tussen de gemeten en de werkelijke concentratie minder is dan 25 procent voor vierentwintig-uurgemiddelde
      concentraties, groter dan 30 microgram per m3.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel25
  - number: '25.7'
    text: |-
      Voor de meting van de luchtverontreiniging door lood wordt gebruik gemaakt van een meetmethode waarvan de
      bovenste analysegrens ten minste 1 microgram per m3 bedraagt en waarbij de onder operationele condities verkregen
      meetwaarden zodanig zijn dat met een waarschijnlijkheid van 95 procent de totale afwijking tussen de gemeten en de
      werkelijke concentratie minder is dan 50 procent voor concentraties, groter dan 0,25 microgram per m3.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel25
  - number: '25.8'
    text: |-
      Voor de meting van de luchtverontreiniging door koolmonoxide wordt gebruik gemaakt van een meetmethode waarvan
      de bovenste analysegrens ten minste 50.000 microgram per m3 bedraagt en waarbij de onder operationele condities
      verkregen meetwaarden zodanig zijn dat met een waarschijnlijkheid van 95 procent de totale afwijking tussen de
      gemeten en de werkelijke concentratie minder is dan 15 procent voor uurgemiddelde concentraties, groter dan 7.000
      microgram per m3.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel25
  - number: '25.9'
    text: |-
      Voor de meting van de luchtverontreiniging door benzeen wordt gebruik gemaakt van een meetmethode waarvan de
      bovenste analysegrens ten minste 100 microgram per m3 bedraagt en waarbij de onder operationele condities verkregen
      meetwaarden zodanig zijn dat met een waarschijnlijkheid van 95 procent de totale afwijking tussen de gemeten en
      de werkelijke concentratie minder is dan 25 procent voor jaargemiddelde concentraties, groter dan 3,5 microgram
      per m3.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel25
  - number: '26.1'
    text: |-
      Burgemeester en wethouders inventariseren eenmaal in de drie jaar de plaatsen waar de bevolking naar hun redelijke
      verwachting direct of indirect kan worden blootgesteld aan luchtverontreiniging:
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel26
  - number: 26.1.a
    text: |-
      door stikstofdioxide die meer dan achttien maal per kalenderjaar hoger is dan 200 microgram per m3 als
      uurgemiddelde concentratie;
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel26
  - number: 26.1.b
    text: door stikstofdioxide die hoger is dan 40 microgram per m3 als jaargemiddelde concentratie;
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel26
  - number: 26.1.c
    text: door zwevende deeltjes (PM) die hoger is dan 40 microgram per m3 als jaargemiddelde concentratie;
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel26
  - number: 26.1.d
    text: |-
      door zwevende deeltjes (PM) die meer dan vijfendertig maal per kalenderjaar hoger is dan 50 microgram per m3 als
      vierentwintig-uurgemiddelde concentratie;
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel26
  - number: 26.1.e
    text: door koolmonoxide die hoger is dan 3600 microgram per m3 als 98-percentiel van acht-uurgemiddelde concentraties;
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel26
  - number: 26.1.f
    text: door benzeen die hoger is dan 5 microgram per m3 als jaargemiddelde concentratie.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel26
  - number: '26.2'
    text: |-
      Burgemeester en wethouders stellen bij wegen, die ingevolge het eerste lid zijn geïnventariseerd, de
      luchtverontreiniging door stikstofdioxide, zwevende deeltjes (PM), koolmonoxide en benzeen vast. De vaststelling
      vindt plaats in hetzelfde jaar als waarin de inventarisatie is verricht. De vaststelling bij de in de eerste
      volzin bedoelde wegen geschiedt daar waar de concentraties van genoemde stoffen naar redelijke verwachting van
      burgemeester en wethouders het hoogst zijn.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel26
  - number: '26.3'
    text: |-
      Onze Minister van Verkeer en Waterstaat stelt op verzoek van burgemeester en wethouders, bij wegen die ingevolge
      het eerste lid zijn geïnventariseerd en onder het beheer van het Rijk vallen, de luchtverontreiniging door
      stikstofdioxide, zwevende deeltjes (PM), koolmonoxide en benzeen vast en rapporteert omtrent de resultaten daarvan
      voor 1 april van het jaar waarin de inventarisatie is verricht, aan burgemeester en wethouders. Het tweede lid,
      derde volzin, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel26
  - number: '26.4'
    text: |-
      Gedeputeerde staten stellen op verzoek van burgemeester en wethouders, bij inrichtingen die ingevolge het eerste
      lid zijn geïnventariseerd, en bij wegen die ingevolge het eerste lid zijn geïnventariseerd en onder het beheer van
      de provincie vallen, de luchtverontreiniging door stikstofdioxide, zwevende deeltjes (PM), koolmonoxide en benzeen
      vast en rapporteren omtrent de resultaten daarvan voor 1 april van het jaar waarin de inventarisatie is verricht
      aan burgemeester en wethouders. Het tweede lid, derde volzin, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel26
  - number: '26.5'
    text: |-
      Burgemeester en wethouders dienen een verzoek om vaststelling van de luchtverontreiniging, als bedoeld in het derde
      en vierde lid, in voor 1 februari van het jaar waarin de inventarisatie is verricht.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel26
  - number: '26.6'
    text: |-
      Burgemeester en wethouders stellen in elk van de twee jaren, die volgen op een jaar waarin laatstelijk een
      vaststelling als bedoeld in het tweede lid heeft plaatsgevonden, de luchtverontreiniging door stikstofdioxide,
      zwevende deeltjes (PM), koolmonoxide en benzeen, bedoeld in het eerste lid, vast bij wegen waar de bevolking
      direct of indirect wordt blootgesteld aan die luchtverontreiniging en waar die luchtverontreiniging naar hun
      redelijke verwachting de toepasselijke in de [artikelen 15, eerste en derde lid][ref1], [20][ref2], [22][ref3]
      onderscheidenlijk [23][ref4], genoemde waarden overschrijdt. Het tweede lid, derde volzin, en het derde, vierde en
      vijfde lid, zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018458#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0018458#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0018458#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0018458#Artikel23
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0018458
        artikel: '15'
        paragraaf: '2'
