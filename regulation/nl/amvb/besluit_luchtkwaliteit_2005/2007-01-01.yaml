  - number: '28'
    text: |-
      Burgemeester en wethouders stellen de luchtverontreiniging door koolmonoxide vast door middel van metingen
      overeenkomstig de [artikelen 25, achtste lid][ref1], en [27, vierde lid][ref2], en de krachtens [artikel 6][ref3]
      vast te stellen regeling, op plaatsen waar, blijkens de ingevolge [artikel 26, eerste lid][ref4] verrichte
      inventarisatie en de ingevolge [artikel 26, tweede, derde en vierde lid][ref5] verrichte vaststelling, mensen
      worden blootgesteld aan een concentratie van koolmonoxide die hoger is dan 3600 microgram per m3 als 98-percentiel
      van acht-uurgemiddelde concentraties.


