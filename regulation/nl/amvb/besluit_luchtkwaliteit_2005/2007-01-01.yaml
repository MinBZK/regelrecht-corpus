  - number: '29.1'
    text: |-
      Gedeputeerde staten inventariseren eenmaal in de drie jaar de plaatsen waar de bevolking naar hun redelijke
      verwachting direct of indirect kan worden blootgesteld aan luchtverontreiniging, die in overwegende mate wordt
      veroorzaakt door één of meer inrichtingen die:
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel29
  - number: 29.1.a
    text: |-
      voor zwaveldioxide meer dan vierentwintig maal per kalenderjaar hoger is dan 350 microgram per m3 als uurgemiddelde
      concentratie;
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel29
  - number: 29.1.b
    text: |-
      voor zwaveldioxide meer dan drie maal per kalenderjaar hoger is dan 125 microgram per m3 als vierentwintig-
      uurgemiddelde concentratie;
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel29
  - number: 29.1.c
    text: voor lood hoger is dan 0,5 microgram per m3 als jaargemiddelde concentratie.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel29
  - number: '29.2'
    text: |-
      Gedeputeerde staten stellen op plaatsen, die ingevolge het eerste lid zijn geïnventariseerd, de
      luchtverontreiniging door zwaveldioxide, onderscheidenlijk lood vast. De vaststelling vindt plaats in hetzelfde
      jaar als waarin de inventarisatie is verricht. De vaststelling op de in de eerste volzin bedoelde plaatsen
      geschiedt daar waar de luchtverontreiniging naar redelijke verwachting van gedeputeerde staten het hoogst is.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel29
  - number: '29.3'
    text: |-
      Gedeputeerde staten stellen op plaatsen, die ingevolge het eerste lid zijn geïnventariseerd, in elk van de twee
      jaren die volgen op een jaar waarin laatstelijk een vaststelling heeft plaatsgevonden, de luchtverontreiniging
      door zwaveldioxide, onderscheidenlijk lood, vast waar die luchtverontreiniging naar hun redelijke verwachting
      de toepasselijke in de [artikelen 12][ref1] en [21][ref2], genoemde waarden overschrijdt. Het tweede lid, derde
      volzin, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018458#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0018458#Artikel21
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel29
