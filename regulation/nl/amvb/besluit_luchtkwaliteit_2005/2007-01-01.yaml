  - number: '7.3'
    text: 'Bestuursorganen kunnen de bevoegdheden, bedoeld in het eerste lid, in afwijking van dat lid mede uitoefenen indien:'
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel7
  - number: 7.3.a
    text: |-
      de concentratie in de buitenlucht van de desbetreffende stof als gevolg van de uitoefening van die bevoegdheden per
      saldo verbetert of ten minste gelijk blijft;
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel7
  - number: 7.3.b
    text: |-
      bij een beperkte toename van de concentratie van de desbetreffende stof, door een met de uitoefening van de
      desbetreffende bevoegdheid samenhangende maatregel of een door die uitoefening optredend effect, de luchtkwaliteit
      per saldo verbetert.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel7
  - number: '7.4'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de gevallen waarin en de wijze waarop aan het derde lid
      toepassing kan worden gegeven.
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel7
  - number: '8.1'
    text: |-
      Bestuursorganen treffen tevens maatregelen teneinde overschrijding of dreigende overschrijding van een grenswaarde
      als bedoeld in [paragraaf 2][ref1] zo spoedig mogelijk te beëindigen of zoveel mogelijk te voorkomen, tenzij
      [artikel 9, eerste lid][ref2], van toepassing is. Deze maatregelen kunnen mede worden vastgesteld bij een
      actieplan, waarop [artikel 9, tweede en derde lid][ref3] van overeenkomstige toepassing is voor het desbetreffende
      bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0018458#Paragraaf2
      [ref2]: https://wetten.overheid.nl/BWBR0018458#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0018458#Artikel9
    url: https://wetten.overheid.nl/BWBR0018458/2007-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018458
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018458
        artikel: '9'
        paragraaf: '1'
      - id: ref3
