$id: regeling_overleg_raad_voor_het_overheidspersoneelsbeleid
regulatory_layer: AMVB
publication_date: '2017-03-28'
valid_from: '1997-02-05'
bwb_id: BWBR0008494
url: https://wetten.overheid.nl/BWBR0008494/1997-02-05
articles:
  - number: '1.1'
    text: |-
      Regelingen die specifiek betrekking hebben op overheids- en onderwijspersoneel in het algemeen worden niet tot
      stand gebracht dan nadat daarover door of namens Onze Minister van Binnenlandse Zaken overleg is gevoerd met de
      centrales van overheidspersoneel en de overheidswerkgevers of verenigingen van overheidswerkgevers, verenigd in de
      Raad voor het Overheidspersoneelsbeleid. In dit overleg hebben de centrales van overheidspersoneel evenveel stemmen
      als de overheidswerkgevers of verenigingen van overheidswerkgevers.
    url: https://wetten.overheid.nl/BWBR0008494/1997-02-05#Artikel1
  - number: '1.2'
    text: |-
      Indien een regeling als bedoeld in het eerste lid betrekking heeft op arbeidsvoorwaardelijke rechten of
      verplichtingen van individuele ambtenaren dient over een desbetreffend voorstel overeenstemming te worden bereikt.
      Overeenstemming bestaat indien de helft of meer van het totale aantal stemmen voor het voorstel wordt uitgebracht,
      met dien verstande dat in ieder geval de meerderheid van de centrales van overheidspersoneel met het voorstel
      ingestemd moet hebben.
    url: https://wetten.overheid.nl/BWBR0008494/1997-02-05#Artikel1
  - number: '1.3'
    text: 'Geen overeenstemming is vereist over een voorstel als bedoeld in het tweede lid indien het betreft:'
    url: https://wetten.overheid.nl/BWBR0008494/1997-02-05#Artikel1
  - number: 1.3.a
    text: |-
      invoering of wijziging van een wettelijke regeling voor ambtenaren met een overeenkomstige inhoud als een
      voorstel tot invoering of wijziging van een wettelijke regeling die betrekking heeft op werknemers die krachtens
      arbeidsovereenkomst als bedoeld in artikel 1637*a* van het Burgerlijk Wetboek werkzaam zijn;
    url: https://wetten.overheid.nl/BWBR0008494/1997-02-05#Artikel1
  - number: 1.3.b
    text: |-
      vantoepassingverklaring op ambtenaren van een wettelijke regeling die betrekking heeft op werknemers die
      krachtens arbeidsovereenkomst als bedoeld in artikel 1637*a* van het Burgerlijk Wetboek werkzaam zijn en met die
      vantoepassingverklaring samenhangende wijzigingen in voor ambtenaren geldende regelingen, een en ander mits het
      totaal van rechten en verplichtingen van ambtenaren over het geheel beoordeeld niet ongunstiger wordt;
    url: https://wetten.overheid.nl/BWBR0008494/1997-02-05#Artikel1
  - number: 1.3.c
    text: implementatie van verplichtingen voortvloeiend uit een internationaal verdrag.
    url: https://wetten.overheid.nl/BWBR0008494/1997-02-05#Artikel1
  - number: '1.4'
    text: |-
      Indien in het overleg een geschil ontstaat over de vraag of bij een voorstel als bedoeld in het derde lid, onder
      *b*, voldaan wordt aan de voorwaarde dat het totaal van rechten en verplichtingen over het geheel beoordeeld niet
      ongunstiger wordt, wordt dat geschil onderworpen aan arbitrage door de Advies- en Arbitragecommissie, genoemd in
      [artikel 110][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel110g
    url: https://wetten.overheid.nl/BWBR0008494/1997-02-05#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 110g
  - number: '2.1'
    text: |-
      Het overleg staat onder leiding van Onze Minister van Binnenlandse Zaken. Hij is bevoegd de leiding van het overleg
      op te dragen aan de directeur-generaal Management en Personeelsbeleid van het Ministerie van Binnenlandse Zaken,
      indien de aard van de te bespreken aangelegenheden dit toelaat.
    url: https://wetten.overheid.nl/BWBR0008494/1997-02-05#Artikel2
  - number: '2.2'
    text: Het overleg wordt gevoerd op plaats, dag en uur door Onze Minister van Binnenlandse Zaken te bepalen.
    url: https://wetten.overheid.nl/BWBR0008494/1997-02-05#Artikel2
  - number: '3'
    text: Het secretariaat van het overleg wordt gevoerd door het Centrum voor Arbeidsverhoudingen Overheidspersoneel.
    url: https://wetten.overheid.nl/BWBR0008494/1997-02-05#Artikel3
  - number: '4'
    text: |-
      Indien de voorzitter dan wel een of meer van de deelnemers aan het overleg tot het oordeel komen dat het overleg
      niet tot een uitkomst zal leiden die de instemming van alle deelnemers aan dat overleg zal hebben, brengen zij dat
      oordeel schriftelijk ter kennis van de overige deelnemers aan het overleg.
    url: https://wetten.overheid.nl/BWBR0008494/1997-02-05#Artikel4
  - number: '5.1'
    text: |-
      Binnen twee weken na de kennisgeving, bedoeld in [artikel 4][ref1], wordt een overlegvergadering gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0008494#Artikel4
    url: https://wetten.overheid.nl/BWBR0008494/1997-02-05#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008494
        artikel: '4'
  - number: '5.2'
    text: |-
      Tenzij wordt besloten het overleg voort te zetten dan wel te beëindigen, wordt in de vergadering nagegaan of
      overeenstemming bestaat over de vraag wat het onderwerp en de inhoud van het geschil is en of een oplossing van
      dat geschil zal worden gezocht door middel van voortzetting van het overleg nadat het advies is ingewonnen van de
      Advies- en Arbitragecommissie, genoemd in [artikel 110][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel110g
    url: https://wetten.overheid.nl/BWBR0008494/1997-02-05#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 110g
  - number: '5.3'
    text: |-
      Tot het inwinnen van advies kan alleen worden besloten met minimaal de helft van het totale aantal stemmen, met
      dien verstande dat in ieder geval de meerderheid van de centrales van overheidspersoneel daarmee in moeten stemmen.
    url: https://wetten.overheid.nl/BWBR0008494/1997-02-05#Artikel5
  - number: '6.1'
    text: |-
      Binnen een week na de vergadering bedoeld in [artikel 5][ref1], wordt het verzoek om advies ter kennis gebracht
      van de voorzitter van de Advies- en Arbitragecommissie. Het verzoek wordt ondertekend door de deelnemers aan het
      overleg die zich voor het inwinnen van advies hebben uitgesproken en bevat ten minste het onderwerp en de inhoud
      van het geschil, alsmede de visie daarop van de betreffende deelnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0008494#Artikel5
    url: https://wetten.overheid.nl/BWBR0008494/1997-02-05#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008494
        artikel: '5'
  - number: '6.2'
    text: |-
      De overige deelnemers brengen eveneens binnen een week hun visie ter kennis van de voorzitter van de Advies- en
      Arbitragecommissie.
    url: https://wetten.overheid.nl/BWBR0008494/1997-02-05#Artikel6
  - number: '7'
    text: |-
      De Advies- en Arbitragecommissie behandelt de adviesaanvraag overeenkomstig de [artikelen 110][ref1] en
      [110][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel110h
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel110i
    url: https://wetten.overheid.nl/BWBR0008494/1997-02-05#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 110h
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 110i
  - number: '8'
    text: Binnen twee weken na ontvangst van het advies wordt het overleg over het geschil voortgezet.
    url: https://wetten.overheid.nl/BWBR0008494/1997-02-05#Artikel8
  - number: '9'
    text: |-
      Het standpunt van de centrales van overheidspersoneel en de overheidswerkgevers of verenigingen van
      overheidswerkgevers over de in het overleg besproken aangelegenheden wordt schriftelijk aan Onze Minister van
      Binnenlandse Zaken bevestigd, waarbij desverlangd een samenvatting van de aan dat standpunt ten grondslag liggende
      argumenten wordt gegeven. Van minderheidsstandpunten wordt desverlangd melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0008494/1997-02-05#Artikel9
  - number: '10'
    text: 'Deze regeling wordt aangehaald als: Regeling overleg Raad voor het Overheidspersoneelsbeleid.'
    url: https://wetten.overheid.nl/BWBR0008494/1997-02-05#Artikel10
