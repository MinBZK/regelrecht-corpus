  - number: '5'
    text: |-
      [Artikel 2][ref1] is, voorzover het de belastbare hoeveelheid meststoffen, bedoeld in artikel 13 van de wet,
      betreft, uitsluitend van toepassing op de voorraden in tijdig door de heffingplichtige aangemelde opslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0008980#Artikel2
    url: https://wetten.overheid.nl/BWBR0008980/1998-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008980
        artikel: '2'
        paragraaf: PARAGRAAF_1
  - number: '6'
    text: |-
      1 Indien [artikel 2][ref1] in enig kalenderjaar ten aanzien van een intermediaire onderneming wordt toegepast
      terwijl de eindvoorraad groter is dan de beginvoorraad, wordt [artikel 2][ref2] ook de daarop volgende
      kalenderjaren ten aanzien van die onderneming toegepast, zolang de eindvoorraad groter is dan de beginvoorraad in
      het eerste jaar van deze reeks van jaren.

      2 Een aangemelde opslag van een intermediaire onderneming waarop het eerste lid van toepassing is, kan door de
      heffingplichtige met ingang van een kalenderjaar worden afgemeld indien de in die opslag aanwezige hoeveelheid
      fosfaat in dierlijke meststoffen aan het einde van het voorafgaande kalenderjaar niet meer bedraagt dan de in die
      opslag aanwezige hoeveelheid fosfaat in dierlijke meststoffen bij aanvang van het eerste jaar van de reeks van
      jaren, bedoeld in het eerste lid, danwel, indien de aanmelding van de opslag met ingang van een later jaar dan het
      hier bedoelde eerste jaar heeft plaatsgevonden, bij aanvang van dit latere jaar.

      [Artikel 2][ref3] is vanaf het kalenderjaar met ingang waarvan de afmelding plaatsvindt, niet langer van toepassing
      op de voorraden in afgemelde opslagen.

      3 Indien een intermediaire onderneming waarop het eerste lid van toepassing is, op enig tijdstip ophoudt als
      zodanig te bestaan of vanaf enig tijdstip door een ander wordt gevoerd, wordt de belastbare hoeveelheid meststoffen
      vermeerderd met de op dat tijdstip in de opslagen, bedoeld in [artikel 5][ref4], aanwezige voorraad fosfaat in
      dierlijke meststoffen, en verminderd met de beginvoorraad in het eerste jaar van de reeks van jaren, bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008980#Artikel2
