preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuurbeheer en Visserij van 11 augustus 1997, nr. J.977704,
    handelende in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Gelet op de artikelen 13ag en 19 van de Meststoffenwet;

    De Raad van State gehoord (advies van 12 september 1997, no. W11.97.0528);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuurbeheer en Visserij van 21 oktober 1997, nr
    J. 9710680, uitgebracht in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en
    Milieubeheer;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008980/1998-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. wet: [Meststoffenwet][ref1];

      b. intermediaire onderneming: onderneming, niet zijnde een bedrijf, in het kader waarvan dierlijke meststoffen
      worden aangevoerd ten behoeve van handel, transport, opslag, be- of verwerking of anderszins;

      c. beginvoorraad: hoeveelheid fosfaat, onderscheidenlijk stikstof in dierlijke meststoffen in opslag bij een
      bedrijf of intermediaire onderneming bij aanvang van het kalenderjaar;

      d. eindvoorraad: hoeveelheid fosfaat, onderscheidenlijk stikstof in dierlijke meststoffen in opslag bij een bedrijf
      of intermediaire onderneming aan het einde van het kalenderjaar;

      e. mestproducerend bedrijf: bedrijf in het kader waarvan dierlijke meststoffen worden geproduceerd;

      f. mestaanvoerend bedrijf: bedrijf in het kader waarvan dierlijke meststoffen worden aangevoerd en waarvan de
      gemiddelde veebezetting in het kalenderjaar niet groter is dan drie grootvee-eenheden, bepaald overeenkomstig de
      daarvoor in bijlage A bij de wet opgenomen normen.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0008980/1998-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: '2'
    text: |-
      De belastbare hoeveelheid mineralen, bedoeld in artikel 13 van de wet, onderscheidenlijk de belastbare hoeveelheid
      meststoffen, bedoeld in artikel 13 van de wet, kan worden vermeerderd met de beginvoorraad en verminderd met de
      eindvoorraad.
    url: https://wetten.overheid.nl/BWBR0008980/1998-01-01#Artikel2
  - number: '3'
    text: |-
      [Artikel 2][ref1] is, voorzover het de belastbare hoeveelheid mineralen, bedoeld in artikel 13 van de wet, van
      een mestproducerend bedrijf betreft, uitsluitend van toepassing ten aanzien van dierlijke meststoffen geproduceerd
      in het kader van een bedrijfssysteem, volgens hetwelk zij in redelijkheid niet vaker dan eenmaal per week kunnen
      worden afgevoerd. Bij ministeriële regeling worden de in het kader van zodanige bedrijfssystemen geproduceerde
      dierlijke meststoffen nader bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0008980#Artikel2
    url: https://wetten.overheid.nl/BWBR0008980/1998-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008980
        artikel: '2'
        paragraaf: PARAGRAAF_1
  - number: '4'
    text: |-
      1 Indien [artikel 2][ref1] ten aanzien van een mestproducerend bedrijf wordt toegepast en dat artikel met
      betrekking tot het voorafgaande kalenderjaar niet is toegepast, wordt als beginvoorraad 0 kilogram fosfaat,
      onderscheidenlijk stikstof in aanmerking genomen.

      2 Indien de eindvoorraad van een mestproducerend bedrijf ten aanzien waarvan [artikel 2][ref2] wordt toegepast,
      in enig kalenderjaar groter is dan 0 kilogram fosfaat, onderscheidenlijk stikstof, wordt dit artikel ook de daarop
      volgende kalenderjaren ten aanzien van dat bedrijf toegepast, zolang de eindvoorraad groter is dan 0 kilogram
      fosfaat, onderscheidenlijk stikstof.

      3 Indien ten aanzien van een bedrijf in het jaar volgend op een jaar waarin [artikel 2][ref3] ingevolge het tweede
      lid wordt toegepast, de forfaitaire mineralenheffingen, bedoeld in artikel 13 van de wet, worden geheven, wordt
      de belastbare hoeveelheid meststoffen, bedoeld in artikel 13 van de wet, vermeerderd met de eindvoorraad die in
      het voorafgaande jaar op de belastbare hoeveelheid mineralen, bedoeld in artikel 13 van de wet, in mindering is
      gebracht.

      4 Ten aanzien van een bedrijf waarop het tweede lid van toepassing is, wordt voor de toepassing van artikel 13 van
      de wet de hoeveelheid aangevoerde dierlijke meststoffen, uitgedrukt in kilogrammen fosfaat, bedoeld in het eerste
      lid, onderdelen *b* en *c*, van dat artikel, vermeerderd met de eindvoorraad die in het voorafgaande jaar op de
      belastbare hoeveelheid mineralen, bedoeld in artikel 13 van de wet, in mindering is gebracht.

      5 Indien een bedrijf waarop het tweede lid van toepassing is, op enig tijdstip ophoudt als zodanig te bestaan of
      vanaf enig tijdstip door een ander wordt gevoerd, wordt de belastbare hoeveelheid mineralen vermeerderd met de op
      dat tijdstip op het bedrijf aanwezige voorraad fosfaat, onderscheidenlijk stikstof in dierlijke meststoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0008980#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008980#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0008980#Artikel2
