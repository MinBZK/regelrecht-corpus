  - number: '9'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de voorwaarden waaraan moet worden voldaan om voor
      toepassing van [artikel 2][ref1] in aanmerking te komen.

      Deze regels kunnen onder meer betreffen:

      a. de verplichting tot tijdige aanmelding van het mestproducerend bedrijf door de heffingplichtige, en de
      functionaris bij wie de aanmelding geschiedt;

      b. de aanmelding, bedoeld in [de artikelen 5][ref2] en [7][ref3], onderscheidenlijk de afmelding, bedoeld
      in [de artikelen 6, tweede lid][ref4], en [8, tweede lid][ref5], en de functionaris bij wie de aanmelding,
      onderscheidenlijk afmelding geschiedt;

      c. de opslag en daarop aan te brengen kentekenen;

      d. de wijze waarop de beginvoorraad, de eindvoorraad, de voorraad, bedoeld in [artikel 4, vijfde lid][ref6], de
      voorraad, bedoeld in [artikel 6, derde lid][ref7], en de voorraad, bedoeld in [artikel 8, zesde lid][ref8], worden
      vastgesteld;

      e. de verplichting om de hoeveelheid fosfaat, onderscheidenlijk stikstof in hoeveelheden dierlijke meststoffen
      die aan de opgeslagen dierlijke meststoffen worden toegevoegd, respectievelijk waarmee de opgeslagen dierlijke
      meststoffen worden verminderd, vast te stellen en de wijze waarop die vaststelling geschiedt;

      f. de verplichting om de vaststellingen, bedoeld in onderdelen *d* en *e*, te doen uitvoeren door een daartoe
      bevoegde persoon of instelling, welke bevoegdheid kan worden verbonden aan een overeenkomstig bij de ministeriële
      regeling gestelde erkenningsvoorwaarden verleende erkenning;

      g. de administratieve vastlegging en verantwoording van voor de toepassing van [de artikelen 2 tot en met 8][ref9]
      van belang zijnde gegevens;

      h. de verplichting om een verklaring van een registeraccountant of accountant-administratieconsulent terzake van de
      administratieve vastlegging en verantwoording bedoeld in onderdeel g, over te leggen.


