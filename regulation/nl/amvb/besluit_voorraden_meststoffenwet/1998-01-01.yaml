    text: |-
      1 Indien [artikel 2][ref1] in enig kalenderjaar ten aanzien van een mestaanvoerend bedrijf wordt toegepast terwijl
      de eindvoorraad groter is dan de beginvoorraad, wordt [artikel 2][ref2] ook de daarop volgende kalenderjaren ten
      aanzien van dat bedrijf toegepast, zolang de eindvoorraad groter is dan de beginvoorraad in het eerste jaar van
      deze reeks van jaren.

      2 Een aangemelde opslag van een bedrijf waarop het eerste lid van toepassing is, kan door de heffingplichtige
      met ingang van een kalenderjaar worden afgemeld indien de in die opslag aanwezige hoeveelheid fosfaat,
      onderscheidenlijk stikstof in dierlijke meststoffen aan het einde van het voorafgaande kalenderjaar niet meer
      bedraagt dan de in die opslag aanwezige hoeveelheid fosfaat, onderscheidenlijk stikstof in dierlijke meststoffen
      bij aanvang van het eerste jaar van de reeks van jaren, bedoeld in het eerste lid, danwel, indien de aanmelding van
      de opslag met ingang van een later jaar dan het hier bedoelde eerste jaar heeft plaatsgevonden, bij aanvang van dit
      latere jaar.[ Artikel 2][ref3] is vanaf het kalenderjaar met ingang waarvan de afmelding plaatsvindt, niet langer
      van toepassing op de voorraden in afgemelde opslagen.

      3 Indien ten aanzien van een bedrijf in het jaar volgend op een jaar waarin [artikel 2][ref4] ingevolge het eerste
      lid wordt toegepast, de forfaitaire mineralenheffingen, bedoeld in artikel 13 van de wet, worden geheven, wordt
      de belastbare hoeveelheid meststoffen, bedoeld in artikel 13 van de wet, vermeerderd met de eindvoorraad die in
      het voorafgaande jaar op de belastbare hoeveelheid mineralen, bedoeld in artikel 13 van de wet, in mindering is
      gebracht, en verminderd met de beginvoorraad in het eerste jaar van de reeks van jaren, bedoeld in het eerste lid.

      4 Ten aanzien van een bedrijf waarop het eerste lid van toepassing is, wordt voor de toepassing van artikel 13 van
      de wet de hoeveelheid aangevoerde dierlijke meststoffen, uitgedrukt in kilogrammen fosfaat, bedoeld in het eerste
      lid, onderdelen *b* en *c*, van dat artikel, vermeerderd met de eindvoorraad die in het voorafgaande jaar op de
      belastbare hoeveelheid mineralen, bedoeld in artikel 13 van de wet, in mindering is gebracht, en verminderd met de
      beginvoorraad in het eerste jaar van de reeks van jaren, bedoeld in het eerste lid.

      5 Indien van een bedrijf in het jaar volgend op een jaar waarin [artikel 2][ref5] ingevolge het eerste lid wordt
      toegepast, de gemiddelde veebezetting groter is dan drie grootvee-eenheden, wordt de belastbare hoeveelheid
      meststoffen, bedoeld in artikel 13 van de wet, vermeerderd met de eindvoorraad die in het voorafgaande jaar op de
      belastbare hoeveelheid mineralen, bedoeld in artikel 13 van de wet, in mindering is gebracht, en verminderd met de
      beginvoorraad in het eerste jaar van de reeks van jaren, bedoeld in het eerste lid.

      6 Indien een bedrijf waarop het eerste lid van toepassing is, op enig tijdstip ophoudt als zodanig te bestaan
      of vanaf enig tijdstip door een ander wordt gevoerd, wordt de belastbare hoeveelheid mineralen vermeerderd
      met de op dat tijdstip in de opslagen, bedoeld in [artikel 7, tweede lid][ref6], aanwezige voorraad fosfaat,
      onderscheidenlijk stikstof in dierlijke meststoffen, en verminderd met de beginvoorraad in het eerste jaar van de
      reeks van jaren, bedoeld in het eerste lid.


