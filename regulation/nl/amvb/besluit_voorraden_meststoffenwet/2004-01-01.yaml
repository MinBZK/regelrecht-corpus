---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_voorraden_meststoffenwet
regulatory_layer: AMVB
publication_date: '2005-12-29'
valid_from: '2004-01-01'
bwb_id: BWBR0008980
url: https://wetten.overheid.nl/BWBR0008980/2004-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuurbeheer en Visserij van 11 augustus 1997, nr. J.977704,
    handelende in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Gelet op de artikelen 13ag en 19 van de Meststoffenwet;

    De Raad van State gehoord (advies van 12 september 1997, no. W11.97.0528);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuurbeheer en Visserij van 21 oktober 1997, nr
    J. 9710680, uitgebracht in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en
    Milieubeheer;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#Artikel1
  - number: 1.1.a
    text: |-
      wet: [Meststoffenwet][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: 1.1.b
    text: |-
      intermediaire onderneming: onderneming, niet zijnde een bedrijf, in het kader waarvan dierlijke meststoffen worden
      aangevoerd ten behoeve van handel, transport, opslag, be- of verwerking of anderszins;
    url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#Artikel1
  - number: 1.1.c
    text: |-
      beginvoorraad: hoeveelheid fosfaat, onderscheidenlijk stikstof in dierlijke meststoffen in opslag bij een bedrijf
      of intermediaire onderneming bij aanvang van het kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#Artikel1
  - number: 1.1.d
    text: |-
      eindvoorraad: hoeveelheid fosfaat, onderscheidenlijk stikstof in dierlijke meststoffen in opslag bij een bedrijf of
      intermediaire onderneming aan het einde van het kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#Artikel1
  - number: 1.1.e
    text: 'mestproducerend bedrijf: bedrijf in het kader waarvan dierlijke meststoffen worden geproduceerd;'
    url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#Artikel1
  - number: 1.1.f
    text: |-
      mestaanvoerend bedrijf: bedrijf in het kader waarvan dierlijke meststoffen worden aangevoerd en waarvan de
      gemiddelde veebezetting in het kalenderjaar niet groter is dan drie grootvee-eenheden, bepaald overeenkomstig de
      daarvoor in [bijlage A bij de wet][ref1] opgenomen normen.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: '1.2'
    text: |-
      Voor de toepassing van [paragraaf 3][ref1] in samenhang met [artikel 2][ref2] wordt onder de begin- en
      eindvoorraad mede begrepen de hoeveelheid fosfaat in overige organische meststoffen in opslag bij een intermediaire
      onderneming bij aanvang, onderscheidenlijk aan het einde van het kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0008980#ParagraafPARAGRAAF_3
      [ref2]: https://wetten.overheid.nl/BWBR0008980#Artikel2
    url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008980
        paragraaf: PARAGRAAF_3
      - id: ref2
        bwb_id: BWBR0008980
        artikel: '2'
        paragraaf: PARAGRAAF_1
  - number: '2'
    text: |-
      De belastbare hoeveelheid mineralen, bedoeld in [artikel 24 van de wet][ref1], onderscheidenlijk de belastbare
      hoeveelheid meststoffen, bedoeld in [artikel 31 van de wet][ref2], kan worden vermeerderd met de beginvoorraad en
      verminderd met de eindvoorraad.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel31
    url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '31'
  - number: '3'
    text: |-
      [Artikel 2][ref1] is, voorzover het de belastbare hoeveelheid mineralen, bedoeld in [artikel 24 van de wet][ref2],
      van een mestproducerend bedrijf betreft, uitsluitend van toepassing ten aanzien van dierlijke meststoffen
      geproduceerd in het kader van een bedrijfssysteem, volgens hetwelk zij in redelijkheid niet vaker dan eenmaal
      per week kunnen worden afgevoerd. Bij ministeriële regeling worden de in het kader van zodanige bedrijfssystemen
      geproduceerde dierlijke meststoffen nader bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0008980#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel24
    url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008980
        artikel: '2'
        paragraaf: PARAGRAAF_1
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '24'
  - number: '4.1'
    text: |-
      Indien [artikel 2][ref1] ten aanzien van een mestproducerend bedrijf wordt toegepast en dat artikel met betrekking
      tot het voorafgaande kalenderjaar niet is toegepast, wordt als beginvoorraad 0 kilogram fosfaat, onderscheidenlijk
      stikstof in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008980#Artikel2
    url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008980
        artikel: '2'
        paragraaf: PARAGRAAF_1
  - number: '4.2'
    text: |-
      Indien de eindvoorraad van een mestproducerend bedrijf ten aanzien waarvan [artikel 2][ref1] wordt toegepast, in
      enig kalenderjaar groter is dan 0 kilogram fosfaat, onderscheidenlijk stikstof, wordt dit artikel ook de daarop
      volgende kalenderjaren ten aanzien van dat bedrijf toegepast, zolang de eindvoorraad groter is dan 0 kilogram
      fosfaat, onderscheidenlijk stikstof.


      [ref1]: https://wetten.overheid.nl/BWBR0008980#Artikel2
    url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008980
        artikel: '2'
        paragraaf: PARAGRAAF_1
  - number: '4.3'
    text: |-
      Indien ten aanzien van een bedrijf in het jaar volgend op een jaar waarin [artikel 2][ref1] ingevolge het
      tweede lid wordt toegepast, de forfaitaire mineralenheffingen, bedoeld in [artikel 14 van de wet][ref2],
      worden geheven, wordt de belastbare hoeveelheid meststoffen, bedoeld in [artikel 16 van de wet][ref3],
      vermeerderd met de eindvoorraad die in het voorafgaande jaar op de belastbare hoeveelheid mineralen, bedoeld in
      [artikel 24 van de wet][ref4], in mindering is gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0008980#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0004054#Artikel24
    url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008980
        artikel: '2'
        paragraaf: PARAGRAAF_1
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0004054
        artikel: '16'
      - id: ref4
        bwb_id: BWBR0004054
        artikel: '24'
  - number: '4.4'
    text: |-
      Indien een bedrijf waarop het tweede lid van toepassing is op enig tijdstip ophoudt als zodanig te bestaan of vanaf
      enig tijdstip door een ander wordt gevoerd, is de eindvoorraad 0 kilogram fosfaat, onderscheidenlijk stikstof.
    url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#Artikel4
  - number: '5'
    text: |-
      [Artikel 2][ref1] is, voorzover het de belastbare hoeveelheid meststoffen, bedoeld in
      [artikel 31 van de wet][ref2], betreft, uitsluitend van toepassing op de voorraden in tijdig door de
      heffingplichtige aangemelde opslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0008980#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel31
    url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008980
        artikel: '2'
        paragraaf: PARAGRAAF_1
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '31'
  - number: '6.1'
    text: |-
      Indien [artikel 2][ref1] in enig kalenderjaar ten aanzien van een intermediaire onderneming wordt toegepast terwijl
      de eindvoorraad groter is dan de beginvoorraad, wordt [artikel 2][ref2] ook de daarop volgende kalenderjaren ten
      aanzien van die onderneming toegepast, zolang de eindvoorraad groter is dan de beginvoorraad in het eerste jaar van
      deze reeks van jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0008980#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008980#Artikel2
    url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008980
        artikel: '2'
        paragraaf: PARAGRAAF_1
      - id: ref2
        bwb_id: BWBR0008980
        artikel: '2'
        paragraaf: PARAGRAAF_1
  - number: '6.2'
    text: |-
      Een aangemelde opslag van een intermediaire onderneming waarop het eerste lid van toepassing is, kan door de
      heffingplichtige met ingang van een kalenderjaar worden afgemeld indien de in die opslag aanwezige hoeveelheid
      fosfaat in dierlijke of overige organische meststoffen aan het einde van het voorafgaande kalenderjaar niet meer
      bedraagt dan de in die opslag aanwezige hoeveelheid fosfaat in dierlijke of overige organische meststoffen bij
      aanvang van het eerste jaar van de reeks van jaren, bedoeld in het eerste lid, danwel, indien de aanmelding van de
      opslag met ingang van een later jaar dan het hier bedoelde eerste jaar heeft plaatsgevonden, bij aanvang van dit
      latere jaar.
    url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#Artikel6
  - number: '6.3'
    text: 'In afwijking het tweede lid kan een opslag gedurende het kalenderjaar worden afgemeld indien:'
    url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#Artikel6
  - number: 6.3.a
    text: deze opslag op het tijdstip van afmelding leeg is, of
    url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#Artikel6
  - number: 6.3.b
    text: |-
      deze opslag door het aangaan of beëindigen van een huurovereenkomst, het vestigen of beëindigen van een zakelijk
      gebruiksrecht of door eigendomsoverdracht naar een andere intermediaire onderneming overgaat, en in samenhang
      daarmee de in de opslag aanwezige dierlijke of overige organische meststoffen naar deze andere intermediaire
      onderneming worden afgevoerd.
    url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#Artikel6
  - number: '6.4'
    text: |-
      [Artikel 2][ref1] is vanaf het tijdstip van afmelding niet langer van toepassing op de voorraden in de afgemelde
      opslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0008980#Artikel2
    url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008980
        artikel: '2'
        paragraaf: PARAGRAAF_1
  - number: '6.5'
    text: |-
      Indien een intermediaire onderneming waarop het eerste lid van toepassing is, op enig tijdstip ophoudt als zodanig
      te bestaan of vanaf enig tijdstip door een ander wordt gevoerd, wordt de belastbare hoeveelheid meststoffen
      verminderd met de beginvoorraad in het eerste jaar van de reeks van jaren, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#Artikel6
  - number: '7'
    text: |-
      [Artikel 2][ref1] is, voorzover het de belastbare hoeveelheid mineralen, bedoeld in [artikel 24 van de wet][ref2],
      van een mestaanvoerend bedrijf betreft, uitsluitend van toepassing op de voorraden in tijdig door de
      heffingplichtige aangemelde opslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0008980#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel24
    url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008980
        artikel: '2'
        paragraaf: PARAGRAAF_1
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '24'
  - number: '8.1'
    text: |-
      Indien [artikel 2][ref1] in enig kalenderjaar ten aanzien van een mestaanvoerend bedrijf wordt toegepast terwijl
      de eindvoorraad groter is dan de beginvoorraad, wordt [artikel 2][ref2] ook de daarop volgende kalenderjaren ten
      aanzien van dat bedrijf toegepast, zolang de eindvoorraad groter is dan de beginvoorraad in het eerste jaar van
      deze reeks van jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0008980#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008980#Artikel2
    url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008980
        artikel: '2'
        paragraaf: PARAGRAAF_1
      - id: ref2
        bwb_id: BWBR0008980
        artikel: '2'
        paragraaf: PARAGRAAF_1
  - number: '8.2'
    text: |-
      Een aangemelde opslag van een bedrijf waarop het eerste lid van toepassing is, kan door de heffingplichtige
      met ingang van een kalenderjaar worden afgemeld indien de in die opslag aanwezige hoeveelheid fosfaat,
      onderscheidenlijk stikstof in dierlijke meststoffen aan het einde van het voorafgaande kalenderjaar niet meer
      bedraagt dan de in die opslag aanwezige hoeveelheid fosfaat, onderscheidenlijk stikstof in dierlijke meststoffen
      bij aanvang van het eerste jaar van de reeks van jaren, bedoeld in het eerste lid, danwel, indien de aanmelding van
      de opslag met ingang van een later jaar dan het hier bedoelde eerste jaar heeft plaatsgevonden, bij aanvang van dit
      latere jaar.[ Artikel 2][ref1] is vanaf het kalenderjaar met ingang waarvan de afmelding plaatsvindt, niet langer
      van toepassing op de voorraden in afgemelde opslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0008980#Artikel2
    url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008980
        artikel: '2'
        paragraaf: PARAGRAAF_1
  - number: '8.3'
    text: |-
      Indien ten aanzien van een bedrijf in het jaar volgend op een jaar waarin [artikel 2][ref1] ingevolge het
      eerste lid wordt toegepast, de forfaitaire mineralenheffingen, bedoeld in [artikel 14 van de wet][ref2],
      worden geheven, wordt de belastbare hoeveelheid meststoffen, bedoeld in [artikel 16 van de wet][ref3],
      vermeerderd met de eindvoorraad die in het voorafgaande jaar op de belastbare hoeveelheid mineralen, bedoeld in
      [artikel 24 van de wet][ref4], in mindering is gebracht, en verminderd met de beginvoorraad in het eerste jaar van
      de reeks van jaren, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008980#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0004054#Artikel24
    url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008980
        artikel: '2'
        paragraaf: PARAGRAAF_1
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0004054
        artikel: '16'
      - id: ref4
        bwb_id: BWBR0004054
        artikel: '24'
  - number: '8.4'
    text: |-
      Indien van een bedrijf in het jaar volgend op een jaar waarin [artikel 2][ref1] ingevolge het eerste lid wordt
      toegepast, de gemiddelde veebezetting groter is dan drie grootvee-eenheden, wordt de belastbare hoeveelheid
      meststoffen, bedoeld in [artikel 16 van de wet][ref2], vermeerderd met de eindvoorraad die in het voorafgaande
      jaar op de belastbare hoeveelheid mineralen, bedoeld in [artikel 24 van de wet][ref3], in mindering is gebracht, en
      verminderd met de beginvoorraad in het eerste jaar van de reeks van jaren, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008980#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel24
    url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008980
        artikel: '2'
        paragraaf: PARAGRAAF_1
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '16'
      - id: ref3
        bwb_id: BWBR0004054
        artikel: '24'
  - number: '8.5'
    text: |-
      Indien een bedrijf waarop het eerste lid van toepassing is, op enig tijdstip ophoudt als zodanig te bestaan of
      vanaf enig tijdstip door een ander wordt gevoerd, wordt de belastbare hoeveelheid mineralen verminderd met de
      beginvoorraad in het eerste jaar van de reeks van jaren, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#Artikel8
  - number: '9'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de voorwaarden waaraan moet worden voldaan om voor
      toepassing van [artikel 2][ref1] in aanmerking te komen. Deze regels kunnen onder meer betreffen:


      [ref1]: https://wetten.overheid.nl/BWBR0008980#Artikel2
    url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008980
        artikel: '2'
        paragraaf: PARAGRAAF_1
  - number: 9.a
    text: |-
      de verplichting tot tijdige aanmelding van het mestproducerend bedrijf door de heffingplichtige, en de functionaris
      bij wie de aanmelding geschiedt;
    url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#Artikel9
  - number: 9.b
    text: |-
      de aanmelding, bedoeld in [de artikelen 5][ref1] en [7][ref2], onderscheidenlijk de afmelding, bedoeld in
      [de artikelen 6, tweede en derde lid][ref3], en [8, tweede lid][ref4], en de functionaris bij wie de aanmelding,
      onderscheidenlijk afmelding geschiedt;


      [ref1]: https://wetten.overheid.nl/BWBR0008980#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008980#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0008980#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0008980#Artikel8
    url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008980
        artikel: '5'
        paragraaf: PARAGRAAF_3
      - id: ref2
        bwb_id: BWBR0008980
        artikel: '7'
        paragraaf: PARAGRAAF_4
      - id: ref3
        bwb_id: BWBR0008980
        artikel: '6'
        paragraaf: PARAGRAAF_3
      - id: ref4
        bwb_id: BWBR0008980
        artikel: '8'
        paragraaf: PARAGRAAF_4
  - number: 9.c
    text: de opslag en daarop aan te brengen kentekenen;
    url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#Artikel9
  - number: 9.d
    text: |-
      de wijze waarop de beginvoorraad, de eindvoorraad, de voorraad, bedoeld in [artikel 6, vijfde lid][ref1], de
      voorraad, bedoeld in [artikel 8, derde lid][ref2], en de voorraad, bedoeld in [artikel 8, vierde lid][ref3], worden
      vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0008980#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008980#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0008980#Artikel8
    url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008980
        artikel: '6'
        paragraaf: PARAGRAAF_3
      - id: ref2
        bwb_id: BWBR0008980
        artikel: '8'
        paragraaf: PARAGRAAF_4
