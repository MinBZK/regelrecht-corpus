  - number: 9.e
    text: |-
      de verplichting om de hoeveelheid fosfaat, onderscheidenlijk stikstof in hoeveelheden dierlijke of overige
      organische meststoffen die aan de opgeslagen dierlijke of overige organische meststoffen worden toegevoegd,
      respectievelijk waarmee de opgeslagen dierlijke of overige organische meststoffen worden verminderd, vast te
      stellen en de wijze waarop die vaststelling geschiedt;
    url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#Artikel9
  - number: 9.f
    text: |-
      de verplichting om de vaststellingen, bedoeld in onderdelen *d* en *e*, te doen uitvoeren door een daartoe bevoegde
      persoon of instelling, welke bevoegdheid kan worden verbonden aan een overeenkomstig bij de ministeriële regeling
      gestelde erkenningsvoorwaarden verleende erkenning;
    url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#Artikel9
  - number: 9.g
    text: |-
      de administratieve vastlegging en verantwoording van voor de toepassing van [de artikelen 2 tot en met 8][ref1] van
      belang zijnde gegevens;


