  - number: 9.h
    text: |-
      de verplichting om een verklaring van een registeraccountant of accountant-administratieconsulent terzake van de
      administratieve vastlegging en verantwoording bedoeld in onderdeel g, over te leggen.
    url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#Artikel9
  - number: '10'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008980/2004-01-01#Artikel10
  - number: '11'
    text: 'Dit besluit wordt aangehaald als: Besluit voorraden Meststoffenwet.'
