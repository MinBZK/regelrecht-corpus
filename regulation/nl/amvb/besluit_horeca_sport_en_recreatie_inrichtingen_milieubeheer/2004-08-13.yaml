    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel2
  - number: 2.1.b.3°
    text: |-
      het in een besloten ruimte vertonen van films, houden van presentaties, vergaderingen of congressen, of
      tentoonstellen van gebruiksvoorwerpen of voortbrengsels van kunst, cultuur of wetenschap;
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel2
  - number: 2.1.b.4°
    text: |-
