      consumptie worden bereid of verstrekt, of
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel2
  - number: 2.1.a.2°
    text: een gelegenheid tot zwemmen of baden;
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel2
  - number: 2.1.b
    text: 'uitsluitend of in hoofdzaak sprake is van een of meer voorzieningen of installaties voor:'
