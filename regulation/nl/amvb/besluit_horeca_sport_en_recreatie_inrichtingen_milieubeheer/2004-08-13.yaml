    text: |-
      op een inrichting als bedoeld in [artikel 2, eerste lid, onder a, b][ref1], ten eerste tot en met ten derde, of c
      voorzover in de inrichting permanente voorzieningen aanwezig zijn ten behoeve van de gelijktijdige aanwezigheid van
