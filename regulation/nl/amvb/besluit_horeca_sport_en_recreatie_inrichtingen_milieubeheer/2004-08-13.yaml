      toeschouwers.


      [ref1]: https://wetten.overheid.nl/BWBR0009633#Artikel2
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009633
        artikel: '2'
  - number: '4.1'
    text: |-
      De voorschriften die zijn opgenomen in de bijlage gelden voor een ieder die de inrichting drijft. Deze draagt er
      zorg voor dat de voorschriften worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel4
  - number: '4.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de voorschriften van paragraaf 1.1 van de bijlage die
      betrekking hebben op een concentratiegebied voor horecabedrijven dat bij of krachtens een gemeentelijke verordening
      is aangewezen.
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel4
  - number: '4.3'
    text: |-
      Indien een voorschrift dat is opgenomen in de bijlage, hoofdstukken 1 tot en met 3, inhoudt dat daarbij aangegeven
      middelen ter bescherming van het milieu moeten worden toegepast, kan degene die de inrichting drijft, andere
      middelen toepassen mits hij, voordat hij die andere middelen toepast, aan het bevoegd gezag aantoont dat met de
      door hem gekozen middelen een ten minste gelijkwaardige bescherming voor het milieu wordt bereikt.
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel4
  - number: '5.1'
    text: 'Het bevoegd gezag kan nadere eisen stellen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel5
  - number: 5.1.a
    text: |-
      de in de bijlage opgenomen voorschriften ten aanzien van geluid, trilling, energie, afvalstoffen, afvalwater,
      waterbesparing, lucht en verlichting, voorzover dat in hoofdstuk 4 van die bijlage is aangegeven, of
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel5
  - number: 5.1.b
    text: |-
      de aanwezigheid van brandbestrijdingsmiddelen, de veiligheid van toestellen en installaties voor gas of
      elektriciteit, de veiligheid van de opslag van stoffen, het verbruik van grondstoffen, onderzoek naar
      bodemverontreiniging voorzover dat in hoofdstuk 4 van de bijlage is aangegeven, de gevolgen van het verkeer van
      personen of goederen van en naar de inrichting, en de nadelige gevolgen voor het milieu die de inrichting kan
      veroorzaken waarop paragraaf 1.8 van de bijlage betrekking heeft, indien dat bijzonder is aangewezen in het belang
      van de bescherming van het milieu.
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel5
  - number: '5.2'
    text: |-
      De nadere eisen gelden voor een ieder die de inrichting drijft. Deze draagt er zorg voor dat de nadere eisen worden
      nageleefd.
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel5
  - number: '5.3'
    text: |-
      Nadere eisen kunnen worden gewijzigd of ingetrokken indien het belang van de bescherming van het milieu zich
      daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel5
  - number: '6.1'
    text: Degene die een inrichting opricht, meldt dit tevoren aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel6
  - number: '6.2'
    text: De melding geschiedt ten minste vier weken voor het tijdstip waarop de inrichting zal worden opgericht.
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel6
  - number: '6.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing met betrekking tot het veranderen van een inrichting
      en het veranderen van de werking daarvan. Deze melding is niet vereist, indien eerder een melding overeenkomstig
      dit artikel is gedaan en door dit veranderen geen afwijking ontstaat van de bij die melding verstrekte gegevens.
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel6
  - number: '6.4'
    text: 'Bij de melding wordt vermeld:'
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel6
  - number: 6.4.a
    text: het adres van de inrichting;
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel6
  - number: 6.4.b
    text: |-
      de naam en het adres van degene die de inrichting opricht dan wel verandert of de werking daarvan verandert, en,
      indien dit iemand anders is, van degene die de inrichting drijft of zal drijven;
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel6
  - number: 6.4.c
    text: de aard van en de activiteiten of processen in de inrichting;
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel6
  - number: 6.4.d
    text: de indeling en de uitvoering van de inrichting, en
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel6
  - number: 6.4.e
    text: |-
      het tijdstip waarop de inrichting of de verandering daarvan in werking zal worden gebracht, dan wel de verandering
      van de werking daarvan verwezenlijkt zal zijn.
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel6
  - number: '6.5'
    text: 'Bij de melding wordt tevens een rapportage van een akoestisch onderzoek gevoegd indien het aannemelijk is dat:'
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel6
  - number: 6.5.a
    text: |-
      in enig vertrek van de inrichting het equivalente geluidniveau veroorzaakt door de ten gehore gebrachte muziek in
      de representatieve bedrijfssituatie, meer bedraagt dan:
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel6
  - number: 6.5.a.1°
    text: |-
      70 dB(A), indien dit vertrek in- of aanpandig is gelegen met woningen of met ruimten deel uitmakend van andere
      geluidgevoelige bestemmingen;
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel6
  - number: 6.5.a.2°
    text: |-
      80 dB(A), indien dit vertrek niet in- of aanpandig is gelegen met woningen of met ruimten deel uitmakend van andere
      geluidgevoelige bestemmingen;
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel6
  - number: 6.5.b
    text: in de buitenlucht of op een open terrein van de inrichting muziek ten gehore zal worden gebracht.
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel6
  - number: '6.6'
    text: |-
      Uit de rapportage van het akoestisch onderzoek blijkt op grond van verrichte geluidmetingen of geluidberekeningen
      of aan voorschrift 1.1.1, 1.1.5 of 1.1.7 van de bijlage kan worden voldaan. In de rapportage wordt aangegeven welke
      de hiertoe te treffen voorzieningen zijn.
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel6
  - number: '6.7'
    text: |-
      Voor zover het een melding betreft als bedoeld in het derde lid, is het overleggen van een rapportage van een
      akoestisch onderzoek alleen vereist, indien een beoogde uitbreiding of verandering van de inrichting of het
      veranderen van de werking daarvan naar verwachting van nadelige invloed zal zijn op de geluidbelasting die door de
      inrichting wordt veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel6
  - number: '6.8'
    text: |-
      Het bevoegd gezag kan besluiten dat het overleggen van een rapportage van een akoestisch onderzoek niet is vereist,
      indien het aannemelijk is dat het equivalente geluidniveau en de piekniveaus veroorzaakt door de inrichting niet
      meer bedragen dan de waarden, bedoeld in voorschrift 1.1.1, 1.1.5 of 1.1.7.
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel6
  - number: '6.9'
    text: |-
      De in het vierde tot en met achtste lid vermelde gegevens behoeven niet te worden verstrekt indien degene die de
      inrichting drijft deze gegevens reeds aan het bevoegd gezag heeft verschaft en het bevoegd gezag over die gegevens
      beschikt.
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel6
  - number: '6.10'
    text: |-
      Degene die de melding doet, geeft in voorkomend geval bij de melding aan welke gegevens hij reeds aan het bevoegd
      gezag heeft verschaft.
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel6
  - number: '7.1'
    text: |-
      Voor een inrichting die op het tijdstip van inwerkingtreding van dit besluit reeds was opgericht en waarvoor
      onmiddellijk daaraan voorafgaand een vergunning gold, blijven de voorschriften van die vergunning gelden als nadere
      eis, bedoeld in [artikel 5][ref1], behoudens eerdere wijziging of intrekking van die voorschriften, gedurende
      drie jaar na het tijdstip van het van toepassing worden van dit besluit op die inrichting mits het voorschrift
      betrekking heeft op een onderwerp dat is genoemd in [artikel 5, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009633#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009633#Artikel5
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009633
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0009633
        artikel: '5'
  - number: '7.2'
    text: |-
      De nadere eisen die onmiddellijk voorafgaande aan de inwerkingtreding van dit besluit golden krachtens het Besluit
      horecabedrijven milieubeheer blijven gelden als nadere eis, bedoeld in [artikel 5][ref1], na het tijdstip van
      de inwerkingtreding van dit besluit, mits het voorschrift betrekking heeft op een onderwerp dat is genoemd in
      [artikel 5, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009633#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009633#Artikel5
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009633
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0009633
        artikel: '5'
  - number: '8.1'
    text: |-
      Indien op het tijdstip waarop dit besluit in werking treedt een inrichting reeds is opgericht en voor die
      inrichting onmiddellijk voor dat tijdstip geen vergunning gold of geen melding was gedaan krachtens het [Besluit
      horecabedrijven milieubeheer](onbekend), meldt degene die de inrichting drijft aan het bevoegd gezag dat hij de
      inrichting in werking heeft.
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel8
  - number: '8.2'
    text: |-
      De melding geschiedt ten hoogste twaalf weken na het tijdstip waarop dit besluit in werking treedt.
      [Artikel 6][ref1], vierde tot en met zesde en achtste tot en met tiende lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009633#Artikel6
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009633
        artikel: '6'
  - number: '8.3'
    text: |-
      Indien op het tijdstip waarop dit besluit in werking treedt een aanvraag om een vergunning voor het oprichten van
      de inrichting door het bevoegd gezag in behandeling is genomen en dit besluit op de inrichting van toepassing is
      of zal zijn, zijn het eerste en tweede lid niet van toepassing. De aanvraag om de vergunning wordt in dat geval
      aangemerkt als een melding overeenkomstig [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009633#Artikel6
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009633
        artikel: '6'
  - number: '9.1'
    text: Het [Besluit horecabedrijven milieubeheer](onbekend) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel9
  - number: '9.2'
    text: |-
      Na de inwerkingtreding van dit besluit berust de Regeling slibvangputten en vetafscheiders op het in de bijlage
      opgenomen voorschrift 1.3.11, onder b en c.
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel9
  - number: '10'
    text: Dit besluit treedt in werking met ingang van 1 oktober 1998.
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel10
  - number: '11'
    text: 'Dit besluit wordt aangehaald als: Besluit horeca-, sport- en recreatie-inrichtingen milieubeheer.'
    url: https://wetten.overheid.nl/BWBR0009633/2004-08-13#Artikel11
