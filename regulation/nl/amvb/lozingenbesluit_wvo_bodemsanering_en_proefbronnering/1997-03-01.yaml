  - number: '17'
    text: |-
      1 Op een melding van het lozen ten behoeve van een proefbronnering is [artikel 16][ref1] van overeenkomstige
      toepassing.

      2 Indien degene die meldt verwacht dat bij het lozen ten behoeve van een proefbronnering het gehalte aan een stof,
      genoemd in bijlage I hoger zal zijn dan het in die bijlage bij de betrokken stof vermelde gehalte, meldt hij ten
      aanzien van die stof het gehalte dat gedurende het lozen niet zal worden overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0008511#Artikel16
    url: https://wetten.overheid.nl/BWBR0008511/1997-03-01#Artikel17
