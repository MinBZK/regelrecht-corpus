  - number: '5'
    text: |-
      1 Degene die loost ten behoeve van een bodemsanering draagt er zorg voor dat het lozingsdebiet zodanig is dat de
      doelmatige werking van het zuiveringstechnische werk niet wordt belemmerd.

      2 De waterkwaliteitsbeheerder kan nadere eisen stellen ten aanzien van het bepaalde in het eerste lid.

      3 De nadere eisen, bedoeld in het tweede lid, worden gesteld na overleg met de beheerder van de riolering.
    url: https://wetten.overheid.nl/BWBR0008511/1997-03-01#Artikel5
  - number: '6'
    text: |-
      1 Degene die loost ten behoeve van een bodemsanering bepaalt het gehalte aan een stof, genoemd in bijlage I, indien
      deze blijkens het overzicht, bedoeld in [artikel 16, onderdeel ][ref1], voorkomt als verontreiniging.

      2 De bepalingen, bedoeld in het eerste lid, worden op de eerste, de derde, de achtste en de vijftiende dag na
      aanvang van het lozen uitgevoerd. Hierna worden de bepalingen uitgevoerd met een zodanige frequentie als nodig is
      om veranderingen in de gehalten tijdig te signaleren. Aan dit voorschrift wordt in ieder geval voldaan, indien de
      bepaling één maal per twee weken plaatsvindt.

      3 Indien degene die loost op enig tijdstip overgaat op een andere frequentie van de bepalingen, meldt hij dit
      onverwijld aan de waterkwaliteitsbeheerder.

      4 De waterkwaliteitsbeheerder kan nadere eisen stellen ten aanzien van de frequentie, bedoeld in het tweede lid,
      tweede volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0008511#Artikel16
    url: https://wetten.overheid.nl/BWBR0008511/1997-03-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008511
        artikel: '16'
        hoofdstuk: '5'
  - number: '7'
    text: |-
      1 Degene die loost ten behoeve van een bodemsanering draagt er zorg voor dat het gehalte aan een andere stof
      dan genoemd in bijlage I zodanig is, dat de nadelige gevolgen voor de kwaliteit van het oppervlaktewater zoveel
      mogelijk worden beperkt en de doelmatige werking van het zuiveringstechnische werk niet wordt belemmerd.

      2 De waterkwaliteitsbeheerder kan nadere eisen stellen ten aanzien van het bepaalde in het eerste lid; daarbij kan
      slechts worden voorgeschreven:

      a. dat het verontreinigde grondwater voorafgaand aan het lozen door een zuiveringsvoorziening wordt geleid, of

      b. dat het gehalte aan die stof bij het lozen een bepaalde waarde niet mag overschrijden, of

      c. dat het gehalte aan die stof wordt bepaald met een daarbij aan te geven meetfrequentie, meetvoorschrift of
      analysemethode.
    url: https://wetten.overheid.nl/BWBR0008511/1997-03-01#Artikel7
  - number: '8'
    text: |-
      Vierentwintig maanden na het tijdstip van aanvang van het lozen ten behoeve van een bodemsanering maakt
      degene die loost een raming van de resterende duur van het lozen en hij legt dit binnen vier weken aan de
      waterkwaliteitsbeheerder over.
    url: https://wetten.overheid.nl/BWBR0008511/1997-03-01#Artikel8
  - number: '9'
    text: |-
      Op degene die loost ten behoeve van een proefbronnering is [artikel 5][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008511#Artikel5
    url: https://wetten.overheid.nl/BWBR0008511/1997-03-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008511
        artikel: '5'
        hoofdstuk: '2'
  - number: '10'
    text: |-
      1 Degene die loost ten behoeve van een proefbronnering draagt er zorg voor dat het gehalte aan een stof, genoemd in
      bijlage I, zodanig is, dat de nadelige gevolgen voor de kwaliteit van het oppervlaktewater zoveel mogelijk worden
      beperkt en dat de doelmatige werking van het zuiveringstechnische werk niet wordt belemmerd.

      2 Aan het eerste lid wordt in ieder geval voldaan, indien het gehalte aan die stof niet hoger is dan het in bijlage
      I bij de betrokken stof vermelde gehalte.

      3 Degene die loost ten behoeve van een proefbronnering bepaalt dagelijks het gehalte aan een stof, genoemd
      in bijlage I, indien deze blijkens het overzicht, bedoeld in [artikel 16, onderdeel ][ref1], voorkomt als
      verontreiniging.

      4 De waterkwaliteitsbeheerder kan nadere eisen stellen ten aanzien van het bepaalde in het eerste lid;
      daarbij kan slechts worden voorgeschreven dat het verontreinigde grondwater voorafgaand aan het lozen door een
      zuiveringsvoorziening wordt geleid.

      5 Tenzij toepassing is gegeven aan het vierde lid, wordt aan de eis van het eerste lid tevens voldaan indien het
      gehalte, bedoeld in [artikel 17, tweede lid][ref2], niet wordt overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0008511#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0008511#Artikel17
    url: https://wetten.overheid.nl/BWBR0008511/1997-03-01#Artikel10
