        artikel: '1'
  - number: '4'
    text: |-
      De verboden, bedoeld in [artikel 1][ref1] van de wet, gelden niet ten aanzien van het lozen, bedoeld in
      [artikel 3, eerste lid][ref2]. Bij dit lozen wordt voldaan aan de voorschriften die bij of krachtens dit besluit
      zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008511#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008511#Artikel3
