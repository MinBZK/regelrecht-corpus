preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 14 mei 1996, nr. RH 217 465, Hoofddirectie van de
    Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken, gedaan mede namens Onze Minister van Volkshuisvesting,
    Ruimtelijke Ordening en Milieubeheer;

    Gelet op de artikelen 1, tweede en derde lid, 2a, eerste en tweede lid, 2b, eerste en tweede lid, 2c, tweede en
    derde lid, van de Wet verontreiniging oppervlaktewateren;

    Gezien het advies van de Staatscommissie voor de Waterstaatswetgeving (advies van 5 juli 1995, nr. St-31/95);

    De Raad van State gehoord (advies van 27 november 1996, nr. W09.96.0211);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 23 januari 1997, nr. HW/RH 1677,
    Hoofddirectie van de Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken, uitgebracht mede namens Onze
    Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008511/1997-03-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. lozen: in oppervlaktewateren brengen van stoffen:

      1°. met behulp van een werk dat op een ander werk is aangesloten, welk ander werk is aangesloten op een
      zuiveringstechnisch werk, of

      2°. op een andere wijze dan met behulp van een werk op een werk, dat is aangesloten op een zuiveringstechnisch
      werk;

      b. stoffen: afvalstoffen, verontreinigende of schadelijke stoffen;

      c. NEN onderscheidenlijk NVN: door het Nederlands Normalisatie Instituut (NNI) uitgegeven norm of voornorm;

      d. bodemsanering: saneren in de zin van de [Wet bodembescherming][ref1];

      e. proefbronnering: oppompen van verontreinigd grondwater in het kader van een saneringsonderzoek in de zin van de
      [Wet bodembescherming][ref2];

      f. wet: [Wet verontreiniging oppervlaktewateren][ref3];

      g. waterkwaliteitsbeheerder: bestuursorgaan dat overeenkomstig [artikel 3][ref4], onderscheidenlijk
      [6, eerste lid, van de wet][ref5] bevoegd is of zou zijn een vergunning te verlenen;

      h. bijlage I of II: bij dit besluit behorende bijlage I onderscheidenlijk II;

      i. Onze Minister: Onze Minister van Verkeer en Waterstaat.

      2 Indien in dit besluit naar een NEN of een NVN wordt verwezen, wordt bedoeld de vóór de datum waarop dit besluit
      in het *Staatsblad* is geplaatst, laatst uitgegeven norm met de daarop tot die datum uitgegeven aanvullingen of
      correctiebladen. Bij regeling van Onze Minister kan worden bepaald dat de verwijzing betrekking heeft op na die
      datum uitgegeven aanvullingen of correctiebladen of dat verwijzing naar een NEN of NVN wordt vervangen door een
      door het NNI uitgegeven ISO-normering.


