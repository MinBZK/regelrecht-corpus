  - number: '11'
    text: |-
      1 Degene die loost ten behoeve van een proefbronnering draagt er zorg voor dat het gehalte aan een andere stof
      dan genoemd in bijlage I zodanig is, dat de nadelige gevolgen voor de kwaliteit van het oppervlaktewater zoveel
      mogelijk worden beperkt en de doelmatige werking van het zuiveringstechnische werk niet wordt belemmerd.

      2 De waterkwaliteitsbeheerder kan nadere eisen stellen ten aanzien van het bepaalde in het eerste lid. Daarbij kan
      slechts worden voorgeschreven:

      a. dat het verontreinigde grondwater voorafgaand aan het lozen door een zuiveringsvoorziening wordt geleid,

      b. dat het gehalte aan die stof bij het lozen een bepaalde waarde niet mag overschrijden, of

      c. dat het gehalte aan die stof wordt bepaald met een daarbij aan te geven meetfrequentie, meetvoorschrift of
      analysemethode.
    url: https://wetten.overheid.nl/BWBR0008511/1997-03-01#Artikel11
  - number: '12'
    text: |-
      Degene die loost draagt er zorg voor dat voor het nemen van steekmonsters op elk lozingspunt een
      controlevoorziening aanwezig is.
    url: https://wetten.overheid.nl/BWBR0008511/1997-03-01#Artikel12
  - number: '13'
    text: Degene die loost bepaalt het dagelijks geloosde volume met een geijkte debietmeter.
    url: https://wetten.overheid.nl/BWBR0008511/1997-03-01#Artikel13
  - number: '14'
    text: |-
      1 Degene die loost registreert plaats, datum en de resultaten van de volume- of gehaltebepalingen.

      2 De registratie wordt gedurende vijf jaren bewaard en op een daartoe strekkend verzoek aan de
      waterkwaliteitsbeheerder ter beschikking gesteld.

      3 Met betrekking tot het lozen ten behoeve van een bodemsanering legt degene die loost de gegevens, bedoeld in
      het eerste lid, over de eerste twee weken na aanvang van het lozen direct na afloop van die periode over aan de
      waterkwaliteitsbeheerder. Daarna worden de resultaten van de gehalte- en volumebepalingen eens per drie maanden aan
      de waterkwaliteitsbeheerder overgelegd.

      4 Met betrekking tot het lozen ten behoeve van een proefbronnering worden de gegevens, bedoeld in het eerste lid,
      zo spoedig mogelijk na afloop van de proefbronnering aan de waterkwaliteitsbeheerder overgelegd.
    url: https://wetten.overheid.nl/BWBR0008511/1997-03-01#Artikel14
  - number: '15'
    text: |-
      1 Degene die voornemens is te lozen of het lozen te veranderen meldt dit voornemen ten minste zes weken voordat met
      het lozen onderscheidenlijk het veranderen daarvan wordt aangevangen aan de waterkwaliteitsbeheerder.

      2 De beëindiging van het lozen wordt ten hoogste één week na die beëindiging schriftelijk aan de
      waterkwaliteitsbeheerder medegedeeld.
    url: https://wetten.overheid.nl/BWBR0008511/1997-03-01#Artikel15
  - number: '16'
    text: |-
      Een melding van het lozen ten behoeve van een bodemsanering als bedoeld in [artikel 15, eerste lid][ref1], wordt
      schriftelijk gedaan en omvat in ieder geval:

      a. naam en adres van degene die meldt;

      b. naam en adres van degene die de feitelijke leiding heeft bij de sanering;

      c. de locatie van de bodemsanering met een plattegrond;

      d. het lozingsdebiet van de grondwaterstromen dat ten hoogste bij de vermelde activiteiten vrijkomt;

      e. een overzicht van de saneringsactiviteiten die worden uitgevoerd met inbegrip van het tijdstip van aanvang van
      het lozen en de tijdsplanning van de bodemsanering en het lozen;

      f. een overzicht van de voorzieningen waarmee de verschillende grondwaterstromen worden behandeld en de
      dimensionering hiervan;

      g. de wijze waarop de afvalstoffen worden opgeslagen;

      h. een overzicht van de aangetroffen verontreinigingen in grond en grondwater, het gehalte daarvan en vermelding
      van de oorzaak van die verontreinigingen, een en ander ontleend aan het op de betreffende locatie uitgevoerd
      oriënterend of nader onderzoek dan wel saneringsonderzoek als bedoeld in [artikel 3, tweede lid][ref2], dat niet
      langer dan drie jaren te voren is voltooid;

      i. het gehalte aan arseen, stikstof, fosfaat, chemisch zuurstofverbruik (CZV), chloride, sulfaat of een andere in
      het verontreinigde grondwater aangetroffen stof dan bedoeld in [onderdeel ][ref3];

      j. voor een stof als bedoeld [onder ][ref4] en [][ref5], die niet is genoemd in bijlage I, het gehalte dat
      gedurende het lozen niet zal worden overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0008511#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0008511#Artikel3
