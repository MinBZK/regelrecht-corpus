        artikel: '16'
        hoofdstuk: '5'
  - number: '18'
    text: |-
      1 Indien zich binnen een inrichting ten behoeve van een bodemsanering of proefbronnering een ongewoon voorval of
      uitzonderlijke omstandigheid voordoet of heeft voorgedaan, waardoor nadelige gevolgen voor de kwaliteit van het
      ontvangende oppervlaktewater of voor de doelmatige werking van het zuiveringstechnische werk zijn ontstaan of
      dreigen te ontstaan, treft degene die loost onmiddellijk de maatregelen die redelijkerwijs van hem kunnen worden
      verlangd om de bedoelde gevolgen te voorkomen of, voor zover die gevolgen niet kunnen worden voorkomen, om deze
      zoveel mogelijk te beperken en ongedaan te maken.

      2 Indien zich binnen een inrichting ten behoeve van een bodemsanering of proefbronnering, een voorval of
      omstandigheid als bedoeld in het eerste lid voordoet of heeft voorgedaan, maakt degene die loost zo spoedig
      mogelijk, doch uiterlijk binnen 8 uur, melding van dat voorval aan de waterkwaliteitsbeheerder binnen wiens gebied
      het lozen heeft plaatsgevonden.

      3 Indien zich buiten de inrichting ten behoeve van een bodemsanering of proefbronnering een ongewoon voorval of
      uitzonderlijke omstandigheid voordoet of heeft voorgedaan en de waterkwaliteitsbeheerder maatregelen van tijdelijke
      aard voorschrijft ter voorkoming van ernstige verontreiniging van oppervlaktewateren of van belemmering van de
      doelmatige werking van het zuiveringstechnische werk, is degene die loost verplicht deze maatregelen onverwijld
      te treffen.

      4 Het eerste tot en met derde lid is niet van toepassing voor zover [hoofdstuk 17 van de Wet milieubeheer][ref1]
      van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk17
    url: https://wetten.overheid.nl/BWBR0008511/1997-03-01#Artikel18
    references:
