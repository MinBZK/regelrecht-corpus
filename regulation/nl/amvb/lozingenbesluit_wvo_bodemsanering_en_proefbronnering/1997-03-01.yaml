  - number: '2'
    text: |-
      Inrichtingen behorende tot bedrijven die bodemsaneringen of proefbronneringen verrichten worden aangewezen als
      soorten van inrichtingen in de zin van [artikel 1, tweede lid][ref1], van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0008511#Artikel1
    url: https://wetten.overheid.nl/BWBR0008511/1997-03-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008511
        artikel: '1'
        hoofdstuk: '1'
  - number: '3'
    text: |-
      1 De voorschriften bij of krachtens dit besluit gesteld, zijn van toepassing op het lozen ten behoeve van een

      a. bodemsanering:

      1°. die plaatsvindt op een locatie als bedoeld in het tweede lid;

      2°. waarbij het lozen plaatsvindt binnen een periode van ten hoogste drie jaar;

      3°. waarbij het lozingsdebiet ten hoogste 15 m3 per uur bedraagt of, zo lang grond wordt afgegraven waarbij het
      grondwaterpeil wordt verlaagd door middel van het oppompen van verontreinigd grondwater, ten hoogste 50 m3 per
      uur, en

      4°. waarbij het gehalte aan een stof voorafgaand aan het lozen niet hoger is dan het in bijlage I bij de betrokken
      stof vermelde gehalte, alsmede ten behoeve van een

      b. proefbronnering:

      1°. die plaatsvindt op een locatie als bedoeld in het tweede lid;

      2°. waarbij het lozen plaatsvindt binnen een periode van ten hoogste drie weken, en

      3°. waarbij het lozingsdebiet ten hoogste 50 m3 per uur bedraagt.

      2 De locaties, bedoeld in het eerste lid, zijn de locaties waar blijkens de resultaten
      van het betreffende oriënterend of nader onderzoek dan wel saneringsonderzoek, bedoeld in
      [artikel 1 van de Wet bodembescherming][ref1]:

      a. de verontreiniging in de bodem uitsluitend is veroorzaakt door:

      1°. chemische wasserijen;

      2°. tankstations voor het wegverkeer;

      3°. be- en verwerkende bedrijven van afgewerkte olie en autowrakken;

      4°. herstelinrichtingen voor motorvoertuigen, of

      5°. opslagtanks van benzine, diesel of huisbrandolie, dan wel

      b. de verontreiniging in de bodem uitsluitend bestaat uit motorbrandstoffen ten behoeve van het wegverkeer of
      minerale olie.

      3 Het gehalte aan een stof, bedoeld in het eerste lid, onder *a*, onder 4°, wordt bepaald op basis van analyse van
      een steekmonster volgens het bij die stof in bijlage II vermelde voorschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel1
    url: https://wetten.overheid.nl/BWBR0008511/1997-03-01#Artikel3
    references:
      - id: ref1
