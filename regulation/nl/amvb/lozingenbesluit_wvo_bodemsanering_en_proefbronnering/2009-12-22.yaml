---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: lozingenbesluit_wvo_bodemsanering_en_proefbronnering
regulatory_layer: AMVB
publication_date: '2011-03-31'
valid_from: '2009-12-22'
bwb_id: BWBR0008511
url: https://wetten.overheid.nl/BWBR0008511/2009-12-22
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 14 mei 1996, nr. RH 217 465, Hoofddirectie van de
    Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken, gedaan mede namens Onze Minister van Volkshuisvesting,
    Ruimtelijke Ordening en Milieubeheer;

    Gelet op de artikelen 1, tweede en derde lid, 2a, eerste en tweede lid, 2b, eerste en tweede lid, 2c, tweede en
    derde lid, van de Wet verontreiniging oppervlaktewateren;

    Gezien het advies van de Staatscommissie voor de Waterstaatswetgeving (advies van 5 juli 1995, nr. St-31/95);

    De Raad van State gehoord (advies van 27 november 1996, nr. W09.96.0211);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 23 januari 1997, nr. HW/RH 1677,
    Hoofddirectie van de Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken, uitgebracht mede namens Onze
    Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel1
  - number: 1.1.a
    text: 'lozen: brengen van afvalwater of andere afvalstoffen in een openbaar vuilwaterriool;'
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel1
  - number: 1.1.b
    text: 'stoffen: afvalstoffen, verontreinigende of schadelijke stoffen;'
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel1
  - number: 1.1.c
    text: 'NEN onderscheidenlijk NVN: door het Nederlands Normalisatie Instituut (NNI) uitgegeven norm of voornorm;'
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel1
  - number: 1.1.d
    text: |-
      bodemsanering: saneren in de zin van de [Wet bodembescherming][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003994
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003994
  - number: 1.1.e
    text: |-
      proefbronnering: oppompen van verontreinigd grondwater in het kader van een saneringsonderzoek in de zin van de
      [Wet bodembescherming][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003994
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003994
  - number: 1.1.f
    text: |-
      wet: [Wet milieubeheer][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 1.1.g
    text: 'bevoegd gezag: burgemeester en wethouders van de gemeente waar het lozen plaatsvindt;'
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel1
  - number: 1.1.h
    text: |-
      [bijlage I][ref1] of [II][ref2]: bij dit besluit behorende bijlage I onderscheidenlijk II;


      [ref1]: https://wetten.overheid.nl/BWBR0008511
      [ref2]: https://wetten.overheid.nl/BWBR0008511
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008511
      - id: ref2
        bwb_id: BWBR0008511
  - number: 1.1.i
    text: 'Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;'
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel1
  - number: 1.1.j
    text: |-
      zuiveringstechnische werk: zuiveringtechnisch werk als bedoeld in [artikel 1.1, eerste lid, van de Waterwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel1
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '1'
  - number: '1.2'
    text: |-
      Indien in dit besluit naar een NEN of een NVN wordt verwezen, wordt bedoeld de vóór de datum waarop dit besluit
      in het *Staatsblad* is geplaatst, laatst uitgegeven norm met de daarop tot die datum uitgegeven aanvullingen of
      correctiebladen. Bij regeling van Onze Minister kan worden bepaald dat de verwijzing betrekking heeft op na die
      datum uitgegeven aanvullingen of correctiebladen of dat verwijzing naar een NEN of NVN wordt vervangen door een
      door het NNI uitgegeven ISO-normering.
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel1
  - number: '2'
    text: |-
      Dit besluit berust op de [artikelen 10.30, derde lid][ref1], en [10.32 van de Wet milieubeheer][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
  - number: '3.1'
    text: |-
      De voorschriften bij of krachtens dit besluit gesteld, zijn van toepassing op het lozen anders dan vanuit een
      inrichting als bedoeld in [artikel 1.1, derde lid, van de Wet milieubeheer][ref1] ten behoeve van een


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 3.1.a
    text: 'bodemsanering:'
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel3
  - number: 3.1.a.1°
    text: die plaatsvindt op een locatie als bedoeld in het tweede lid;
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel3
  - number: 3.1.a.2°
    text: waarbij het lozen plaatsvindt binnen een periode van ten hoogste drie jaar;
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel3
  - number: 3.1.a.3°
    text: |-
      waarbij het lozingsdebiet ten hoogste 15 m3 per uur bedraagt of, zo lang grond wordt afgegraven waarbij het
      grondwaterpeil wordt verlaagd door middel van het oppompen van verontreinigd grondwater, ten hoogste 50 m3 per
      uur, en
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel3
  - number: 3.1.a.4°
    text: |-
      waarbij het gehalte aan een stof voorafgaand aan het lozen niet hoger is dan het in bijlage I bij de betrokken stof
      vermelde gehalte, alsmede ten behoeve van een
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel3
  - number: 3.1.b
    text: 'proefbronnering:'
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel3
  - number: 3.1.b.1°
    text: die plaatsvindt op een locatie als bedoeld in het tweede lid;
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel3
  - number: 3.1.b.2°
    text: waarbij het lozen plaatsvindt binnen een periode van ten hoogste drie weken, en
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel3
  - number: 3.1.b.3°
    text: waarbij het lozingsdebiet ten hoogste 50 m3 per uur bedraagt.
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel3
  - number: '3.2'
    text: |-
      De locaties, bedoeld in het eerste lid, zijn de locaties waar blijkens de resultaten van het betreffende oriënterend
      of nader onderzoek dan wel saneringsonderzoek, bedoeld in [artikel 1 van de Wet bodembescherming][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel1
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '1'
  - number: 3.2.a
    text: 'de verontreiniging in de bodem uitsluitend is veroorzaakt door:'
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel3
  - number: 3.2.a.1°
    text: chemische wasserijen;
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel3
  - number: 3.2.a.2°
    text: tankstations voor het wegverkeer;
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel3
  - number: 3.2.a.3°
    text: |-
      be- en verwerkende bedrijven van afgewerkte olie als bedoeld in het [Besluit inzamelen afvalstoffen][ref1] en
      autowrakken;


      [ref1]: https://wetten.overheid.nl/BWBR0016530
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0016530
  - number: 3.2.a.4°
    text: herstelinrichtingen voor motorvoertuigen, of
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel3
  - number: 3.2.a.5°
    text: opslagtanks van benzine, diesel of huisbrandolie, dan wel
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel3
  - number: 3.2.b
    text: |-
      de verontreiniging in de bodem uitsluitend bestaat uit motorbrandstoffen ten behoeve van het wegverkeer of minerale
      olie.
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel3
  - number: '3.3'
    text: |-
      Het gehalte aan een stof, bedoeld in het eerste lid, onder *a*, onder 4°, wordt bepaald op basis van analyse van
      een steekmonster volgens het bij die stof in bijlage II vermelde voorschrift.
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel3
  - number: '4'
    text: |-
      Het verbod, bedoeld in [artikel 10.30, eerste lid, van de wet][ref1], geldt niet ten aanzien van het lozen, bedoeld
      in [artikel 3, eerste lid][ref2]. Bij dit lozen wordt voldaan aan de voorschriften die bij of krachtens dit besluit
      zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0008511#Artikel3
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0008511
        artikel: '3'
        hoofdstuk: '1'
  - number: '5.1'
    text: |-
      Degene die loost ten behoeve van een bodemsanering draagt er zorg voor dat het lozingsdebiet zodanig is dat de
      doelmatige werking van het zuiveringstechnische werk niet wordt belemmerd.
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel5
  - number: '5.2'
    text: Het bevoegd gezag kan nadere eisen stellen ten aanzien van het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel5
  - number: '6.1'
    text: |-
      Degene die loost ten behoeve van een bodemsanering bepaalt het gehalte aan een stof, genoemd in bijlage I, indien
      deze blijkens het overzicht, bedoeld in [artikel 16, onderdeel ][ref1], voorkomt als verontreiniging.


      [ref1]: https://wetten.overheid.nl/BWBR0008511#Artikel16
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008511
        artikel: '16'
        hoofdstuk: '5'
  - number: '6.2'
    text: |-
      De bepalingen, bedoeld in het eerste lid, worden op de eerste, de derde, de achtste en de vijftiende dag na
      aanvang van het lozen uitgevoerd. Hierna worden de bepalingen uitgevoerd met een zodanige frequentie als nodig is
      om veranderingen in de gehalten tijdig te signaleren. Aan dit voorschrift wordt in ieder geval voldaan, indien de
      bepaling één maal per twee weken plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel6
  - number: '6.3'
    text: |-
      Indien degene die loost op enig tijdstip overgaat op een andere frequentie van de bepalingen, meldt hij dit
      onverwijld aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel6
  - number: '6.4'
    text: Het bevoegd gezag kan nadere eisen stellen ten aanzien van de frequentie, bedoeld in het tweede lid, tweede volzin.
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel6
  - number: '7.1'
    text: |-
      Degene die loost ten behoeve van een bodemsanering draagt er zorg voor dat het gehalte aan een andere stof dan
      genoemd in [bijlage I][ref1] zodanig is, dat de nadelige gevolgen voor de kwaliteit van een oppervlaktewaterlichaam
      zoveel mogelijk worden beperkt en de doelmatige werking van het zuiveringstechnische werk niet wordt belemmerd.


      [ref1]: https://wetten.overheid.nl/BWBR0008511
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008511
  - number: '7.2'
    text: |-
      Het bevoegd gezag kan nadere eisen stellen ten aanzien van het bepaalde in het eerste lid; daarbij kan slechts
      worden voorgeschreven:
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel7
  - number: 7.2.a
    text: dat het verontreinigde grondwater voorafgaand aan het lozen door een zuiveringsvoorziening wordt geleid, of
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel7
  - number: 7.2.b
    text: dat het gehalte aan die stof bij het lozen een bepaalde waarde niet mag overschrijden, of
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel7
  - number: 7.2.c
    text: |-
      dat het gehalte aan die stof wordt bepaald met een daarbij aan te geven meetfrequentie, meetvoorschrift of
      analysemethode.
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel7
  - number: '8'
    text: |-
      Vierentwintig maanden na het tijdstip van aanvang van het lozen ten behoeve van een bodemsanering maakt degene die
      loost een raming van de resterende duur van het lozen en hij legt dit binnen vier weken aan het bevoegd gezag over.
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel8
  - number: '9'
    text: |-
      Op degene die loost ten behoeve van een proefbronnering is [artikel 5][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008511#Artikel5
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008511
        artikel: '5'
        hoofdstuk: '2'
  - number: '10.1'
    text: |-
      Degene die loost ten behoeve van een proefbronnering draagt er zorg voor dat het gehalte aan een stof, genoemd in
      bijlage I, zodanig is, dat de nadelige gevolgen voor de kwaliteit van een oppervlaktewaterlichaam zoveel mogelijk
      worden beperkt en dat de doelmatige werking van het zuiveringstechnische werk niet wordt belemmerd.
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel10
  - number: '10.2'
    text: |-
      Aan het eerste lid wordt in ieder geval voldaan, indien het gehalte aan die stof niet hoger is dan het in bijlage I
      bij de betrokken stof vermelde gehalte.
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel10
  - number: '10.3'
    text: |-
      Degene die loost ten behoeve van een proefbronnering bepaalt dagelijks het gehalte aan een stof, genoemd in bijlage
      I, indien deze blijkens het overzicht, bedoeld in [artikel 16, onderdeel ][ref1], voorkomt als verontreiniging.


      [ref1]: https://wetten.overheid.nl/BWBR0008511#Artikel16
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008511
        artikel: '16'
        hoofdstuk: '5'
  - number: '10.4'
    text: |-
      Het bevoegd gezag kan nadere eisen stellen ten aanzien van het bepaalde in het eerste lid; daarbij kan slechts
      worden voorgeschreven dat het verontreinigde grondwater voorafgaand aan het lozen door een zuiveringsvoorziening
      wordt geleid.
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel10
  - number: '10.5'
    text: |-
      Tenzij toepassing is gegeven aan het vierde lid, wordt aan de eis van het eerste lid tevens voldaan indien het
      gehalte, bedoeld in [artikel 17, tweede lid][ref1], niet wordt overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0008511#Artikel17
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008511
        artikel: '17'
        hoofdstuk: '5'
  - number: '11.1'
    text: |-
      Degene die loost ten behoeve van een proefbronnering draagt er zorg voor dat het gehalte aan een andere stof dan
      genoemd in [bijlage I][ref1] zodanig is, dat de nadelige gevolgen voor de kwaliteit van een oppervlaktewaterlichaam
      zoveel mogelijk worden beperkt en de doelmatige werking van het zuiveringstechnische werk niet wordt belemmerd.


      [ref1]: https://wetten.overheid.nl/BWBR0008511
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008511
  - number: '11.2'
    text: |-
      Het bevoegd gezag kan nadere eisen stellen ten aanzien van het bepaalde in het eerste lid. Daarbij kan slechts
      worden voorgeschreven:
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel11
  - number: 11.2.a
    text: dat het verontreinigde grondwater voorafgaand aan het lozen door een zuiveringsvoorziening wordt geleid,
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel11
  - number: 11.2.b
    text: dat het gehalte aan die stof bij het lozen een bepaalde waarde niet mag overschrijden, of
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel11
  - number: 11.2.c
    text: |-
      dat het gehalte aan die stof wordt bepaald met een daarbij aan te geven meetfrequentie, meetvoorschrift of
      analysemethode.
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel11
  - number: '12'
    text: |-
      Degene die loost draagt er zorg voor dat voor het nemen van steekmonsters op elk lozingspunt een
      controlevoorziening aanwezig is.
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel12
  - number: '13'
    text: Degene die loost bepaalt het dagelijks geloosde volume met een geijkte debietmeter.
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel13
  - number: '14.1'
    text: Degene die loost registreert plaats, datum en de resultaten van de volume- of gehaltebepalingen.
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel14
  - number: '14.2'
    text: |-
      De registratie wordt gedurende vijf jaren bewaard en op een daartoe strekkend verzoek aan het bevoegd gezag ter
      beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel14
  - number: '14.3'
    text: |-
      Met betrekking tot het lozen ten behoeve van een bodemsanering legt degene die loost de gegevens, bedoeld in
      het eerste lid, over de eerste twee weken na aanvang van het lozen direct na afloop van die periode over aan
      het bevoegd gezag. Daarna worden de resultaten van de gehalte- en volumebepalingen eens per drie maanden aan het
      bevoegd gezag overgelegd.
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel14
  - number: '14.4'
    text: |-
      Met betrekking tot het lozen ten behoeve van een proefbronnering worden de gegevens, bedoeld in het eerste lid, zo
      spoedig mogelijk na afloop van de proefbronnering aan het bevoegd gezag overgelegd.
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel14
  - number: '15.1'
    text: |-
      Degene die voornemens is te lozen of het lozen te veranderen meldt dit voornemen ten minste zes weken voordat met
      het lozen onderscheidenlijk het veranderen daarvan wordt aangevangen aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel15
  - number: '15.2'
    text: |-
      De beëindiging van het lozen wordt ten hoogste één week na die beëindiging schriftelijk aan het bevoegd gezag
      medegedeeld.
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel15
  - number: '16'
    text: |-
      Een melding van het lozen ten behoeve van een bodemsanering als bedoeld in [artikel 15, eerste lid][ref1], wordt
      schriftelijk gedaan en omvat in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0008511#Artikel15
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008511
        artikel: '15'
        hoofdstuk: '5'
  - number: 16.a
    text: naam en adres van degene die meldt;
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel16
  - number: 16.b
    text: naam en adres van degene die de feitelijke leiding heeft bij de sanering;
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel16
  - number: 16.c
    text: de locatie van de bodemsanering met een plattegrond;
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel16
  - number: 16.d
    text: het lozingsdebiet van de grondwaterstromen dat ten hoogste bij de vermelde activiteiten vrijkomt;
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel16
  - number: 16.e
    text: |-
      een overzicht van de saneringsactiviteiten die worden uitgevoerd met inbegrip van het tijdstip van aanvang van het
      lozen en de tijdsplanning van de bodemsanering en het lozen;
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel16
  - number: 16.f
    text: |-
      een overzicht van de voorzieningen waarmee de verschillende grondwaterstromen worden behandeld en de dimensionering
      hiervan;
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel16
  - number: 16.g
    text: de wijze waarop de afvalstoffen worden opgeslagen;
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel16
  - number: 16.h
    text: |-
      een overzicht van de aangetroffen verontreinigingen in grond en grondwater, het gehalte daarvan en vermelding
      van de oorzaak van die verontreinigingen, een en ander ontleend aan het op de betreffende locatie uitgevoerd
      oriënterend of nader onderzoek dan wel saneringsonderzoek als bedoeld in [artikel 3, tweede lid][ref1], dat niet
      langer dan drie jaren te voren is voltooid;


      [ref1]: https://wetten.overheid.nl/BWBR0008511#Artikel3
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008511
        artikel: '3'
        hoofdstuk: '1'
  - number: 16.i
    text: |-
      het gehalte aan arseen, stikstof, fosfaat, chemisch zuurstofverbruik (CZV), chloride, sulfaat of een andere in het
      verontreinigde grondwater aangetroffen stof dan bedoeld in [onderdeel ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008511#Artikel16
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008511
        artikel: '16'
        hoofdstuk: '5'
  - number: 16.j
    text: |-
      voor een stof als bedoeld [onder ][ref1] en [][ref2], die niet is genoemd in bijlage I, het gehalte dat gedurende
      het lozen niet zal worden overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0008511#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0008511#Artikel16
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008511
        artikel: '16'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0008511
        artikel: '16'
        hoofdstuk: '5'
  - number: '17.1'
    text: |-
      Op een melding van het lozen ten behoeve van een proefbronnering is [artikel 16][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008511#Artikel16
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008511
        artikel: '16'
        hoofdstuk: '5'
  - number: '17.2'
    text: |-
      Indien degene die meldt verwacht dat bij het lozen ten behoeve van een proefbronnering het gehalte aan een stof,
      genoemd in bijlage I hoger zal zijn dan het in die bijlage bij de betrokken stof vermelde gehalte, meldt hij ten
      aanzien van die stof het gehalte dat gedurende het lozen niet zal worden overschreden.
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel17
  - number: '18.1'
    text: |-
      Indien zich binnen een inrichting ten behoeve van een bodemsanering of proefbronnering een ongewoon voorval of
      uitzonderlijke omstandigheid voordoet of heeft voorgedaan, waardoor nadelige gevolgen voor de kwaliteit van een
      ontvangend oppervlaktewaterlichaam of voor de doelmatige werking van het zuiveringstechnische werk zijn ontstaan
      of dreigen te ontstaan, treft degene die loost onmiddellijk de maatregelen die redelijkerwijs van hem kunnen worden
      verlangd om de bedoelde gevolgen te voorkomen of, voor zover die gevolgen niet kunnen worden voorkomen, om deze
      zoveel mogelijk te beperken en ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel18
  - number: '18.2'
    text: |-
      Indien zich binnen een inrichting ten behoeve van een bodemsanering of proefbronnering, een voorval of
      omstandigheid als bedoeld in het eerste lid voordoet of heeft voorgedaan, maakt degene die loost zo spoedig
      mogelijk, doch uiterlijk binnen 8 uur, melding van dat voorval aan het bevoegd gezag binnen wiens gebied het lozen
      heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel18
  - number: '18.3'
    text: |-
      Indien zich buiten de inrichting ten behoeve van een bodemsanering of proefbronnering een ongewoon voorval of
      uitzonderlijke omstandigheid voordoet of heeft voorgedaan en het bevoegd gezag maatregelen van tijdelijke aard
      voorschrijft ter voorkoming van ernstige verontreiniging van een oppervlaktewaterlichaam of van belemmering van
      de doelmatige werking van het zuiveringstechnische werk, is degene die loost verplicht deze maatregelen onverwijld
      te treffen.
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel18
  - number: '18.4'
    text: |-
      Het eerste tot en met derde lid is niet van toepassing voor zover [hoofdstuk 17 van de Wet milieubeheer][ref1] van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk17
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '17'
  - number: '19'
    text: |-
      Van de beschikking waarbij een nadere eis wordt gesteld krachtens dit besluit, wordt kennis gegeven in één of meer
      dag-, nieuws- of huis-aan-huisbladen.
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel19
  - number: '20'
    text: |-
      Dit besluit is niet van toepassing op het lozen waarvoor op het tijdstip van inwerkingtreding van dit besluit een
      aanvraag voor een vergunning krachtens artikel 1 van de wet bij de waterkwaliteitsbeheerder is ontvangen of een
      dergelijke vergunning van kracht is.
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel20
  - number: '21'
    text: |-
      Dit besluit treedt in werking met ingang van de eerste dag van de tweede kalendermaand na de datum van uitgifte van
      het *Staatsblad* waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel21
  - number: '22'
    text: 'Dit besluit wordt aangehaald als: Lozingenbesluit Wvo bodemsanering en proefbronnering.'
    url: https://wetten.overheid.nl/BWBR0008511/2009-12-22#Artikel22
