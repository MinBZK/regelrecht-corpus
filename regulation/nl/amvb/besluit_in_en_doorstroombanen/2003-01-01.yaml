        artikel: '1'
  - number: '6'
    text: |-
      1 Een werkgever ontvangt van de gemeente een vergoeding voor de kosten die voortvloeien uit een dienstbetrekking
      die is aangegaan met een langdurig werkloze.

      2 De gemeente verstrekt de vergoeding slechts aan de werkgever:

      a. indien de dienstbetrekking wordt aangegaan met een persoon, die volgens een door het gemeentebestuur, bedoeld in
      artikel 5, eerste lid, afgegeven schriftelijke verklaring een langdurig werkloze is;

      b. indien de werkgever voor de loonkosten voortvloeiend uit het aangaan van die dienstbetrekking geen andere
      subsidie ontvangt of die kosten niet op andere wijze kan verminderen dan op grond van de [hoofdstukken III][ref1]
      en [IV van de Wet vermindering afdracht loonbelasting en premie voor de volksverzekeringen][ref2],
      artikel [79b van de Wet op de arbeidsongeschiktheidsverzekering][ref3] of de [artikelen 82][ref4],
      [82a][ref5] of [97c van de Werkloosheidswet][ref6], tenzij een subsidie voor meerkosten als bedoeld in
      [artikel 16 van de Wet op de (re)integratie arbeidsgehandicapten][ref7] wordt ontvangen;

      c. indien de dienstbetrekking voldoet aan de vereisten van de arbeidsduur, bedoeld in artikel 8, de vereisten van
      de beloning, bedoeld in de artikelen 9 en 10, en de werkgever artikel 11 omtrent scholing in acht neemt.


