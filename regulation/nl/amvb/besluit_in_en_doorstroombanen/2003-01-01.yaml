  - number: '7'
    text: |-
      1 De gemeente verstrekt pas een vergoeding aan een werkgever voor het vervullen van arbeidsplaatsen in de vorm van
      dienstbetrekkingen met langdurig werklozen:

      a. nadat de ondernemingsraad of de personeelsvertegenwoordiging, bedoeld in de [Wet op de ondernemingsraden][ref1],
      voor zover die door de werkgever is ingesteld, of het bij of krachtens de wet voor die onderneming ingestelde
      medezeggenschapsorgaan, over de totstandkoming van dergelijke arbeidsplaatsen positief heeft geadviseerd, en

      b. indien bij de werkgever in de periode van zes maanden, voorafgaand aan de datum van aanvang van die
      dienstbetrekking, geen overeenkomsten of aanstellingen tot het verrichten van arbeid die vergelijkbaar is met
      de arbeid in die dienstbetrekking, zijn beëindigd op grond van bedrijfseconomische redenen, voor zover nodig
      met toestemming van de Centrale organisatie werk en inkomen, dan wel daartoe een procedure voor ontslag om
      bedrijfseconomische redenen in behandeling is.

      2 De concurrentieverhoudingen worden niet onverantwoord beïnvloed met de prijzen voor de goederen en diensten, die
      ten gevolge van de arbeid in een dienstbetrekking als bedoeld in dit besluit, worden geleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0002747
    url: https://wetten.overheid.nl/BWBR0010994/2003-01-01#Artikel7
    references:
