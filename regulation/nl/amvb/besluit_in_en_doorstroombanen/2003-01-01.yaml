  - number: '11'
    text: |-
      1 De werkgever stelt de werknemer in de gelegenheid scholing te volgen die bijdraagt aan het goed vervullen
      van de werkzaamheden in een dienstbetrekking als bedoeld in dit besluit, en het vergroten van zijn kans op een
      dienstbetrekking anders dan op grond van dit besluit, mits voor ten minste 80% van de overeengekomen arbeidsduur
      werkzaamheden worden verricht.

      2 In afwijking van het eerste lid kan de voor het verrichten van werkzaamheden beschikbare tijd minimaal 60% van
      de overeengekomen arbeidsduur bedragen, indien opleidingen worden gevolgd die bestaan uit een beroepsbegeleidende
      leerweg als bedoeld in de [Wet educatie en beroepsonderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0010994/2003-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: '13'
    text: |-
      1 Onze Minister verleent op of omstreeks 15 mei 2003 aan de gemeente voor het jaar 2003 een subsidie voor de
      uitvoering van[ artikel 3, eerste lid][ref1], op basis van een door burgemeester en wethouders bij wijze van
      aanvraag uiterlijk op 1 februari 2003 gedane opgave van het aantal feitelijk bezette arbeidsplaatsen op 30 juni
      2002.

      2 Bij toepassing van het eerste lid wordt in aanvulling op dat lid aan de gemeenten
      door Onze Minister in totaal  € 45 000 000,– extra subsidie verleend. Deze subsidie
      wordt over de gemeenten verdeeld op basis van de verdeelmaatstaf, opgenomen in
      [artikel 14, eerste lid, van het Besluit uitvoering en financiering Wet inschakeling werkzoekenden][ref2].

      3 Gemeenten die op 30 juni 2002 geen feitelijk bezette arbeidsplaatsen als bedoeld in het eerste lid hebben
      gerealiseerd, ontvangen op of omstreeks 15 mei 2003 de subsidie, bedoeld in het tweede lid. De subsidie wordt, in
      afwijking van het tweede lid, vastgesteld volgens de bijlage bij dit besluit.

      4 De subsidie, bedoeld in het eerste lid, wordt bij wijze van voorschot op of omstreeks de vijftiende dag van
      iedere maand als volgt betaalbaar gesteld:

      a. in de maanden januari tot en met april van het jaar 2003, in vier gelijke delen en in de maand mei in een deel
      ter grootte van tweemaal het daaraan voorafgaande maandelijkse bedrag, op basis van de verdeling van de voor het
      jaar 2002 toegekende arbeidsplaatsen;

      b. in de maanden juni tot en met december van het jaar 2003, in zeven gelijke delen van de verleende subsidie,
      verminderd met de eerder betaalde voorschotten.

      Het voorschot voor de maand januari wordt betaalbaar gesteld, ongeacht of door burgemeester en wethouders een
      aanvraag is ingediend.

      5 De subsidie, bedoeld in het tweede lid, wordt per maand bij wijze van voorschot op of omstreeks de vijftiende dag
      van iedere maand betaalbaar gesteld. De laatste volzin van het derde lid is van toepassing.

      6 Indien burgemeester en wethouders de aanvraag, bedoeld in het eerste lid, niet of niet binnen de gestelde termijn
      indienen, worden de reeds betaalde voorschotten teruggevorderd.

      7 Indien de betaalde voorschotten meer bedragen dan de verleende subsidie, wordt het teveel betaalde
      teruggevorderd.

      8 Burgemeester en wethouders dragen er zorg voor dat Onze Minister ten behoeve van de vaststelling van de subsidie
      uiterlijk op 1 juli 2004 een jaaropgave heeft ontvangen. De jaaropgave wordt voorzien van een verklaring van een
      accountant, belast met de in [artikel 213 van de Gemeentewet][ref3] voorgeschreven controle omtrent de juistheid
      van de verstrekte gegevens. Na ontvangst van de jaaropgave stelt Onze Minister de subsidie binnen 12 maanden vast.
      Indien de jaaropgave niet is ontvangen binnen 12 maanden na het kalenderjaar waarop deze betrekking heeft dan wel
      niet is voorzien van de verklaring, bedoeld in de tweede volzin, wordt de subsidie ambtshalve vastgesteld.

      9 Burgemeester en wethouders verstrekken desgevraagd aan Onze Minister kosteloos alle inlichtingen die hij voor
      de informatievoorziening, de beleidsvorming en voor het betalen en vaststellen van de subsidie nodig heeft en
      werken mee aan door of namens Onze Minister ingesteld onderzoek, dat erop gericht is Onze Minister inlichtingen te
      verschaffen ten behoeve van beleidsontwikkeling.

      10 Indien de inlichtingen, bedoeld in het negende lid, niet of niet volledig binnen de daarvoor gestelde termijnen
      zijn ontvangen, kan Onze Minister de betaling van de voorschotten, bedoeld in het vierde en vijfde lid, opschorten.
      Hervatting van de betaling en nabetaling van de niet betaalde voorschotten vindt zo spoedig mogelijk plaats na
      ontvangst van de in het negende lid bedoelde gegevens.

      11 Bij ministeriële regeling worden nadere regels gesteld voor de vorm en inhoud van:

      a. de opgave, bedoeld in het eerste lid;

      b. de jaaropgave en de verklaring, bedoeld in het achtste lid;

      c. de inlichtingen die op grond van het negende lid worden verstrekt en de wijze en het tijdstip van verstrekking.

      12 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de toepassing van
      [artikel 4:46 van de Algemene wet bestuursrecht][ref4].


