  - number: '19'
    text: >-
      1 Dienstbetrekkingen, die zijn aangegaan voor de datum van inwerkingtreding van dit besluit en waarop de Regeling
      in- en doorstroombanen voor langdurig werklozen van toepassing was zoals deze regeling luidde tot de datum van
      inwerkingtreding van dit besluit, dan wel vervuld zijn bij een instelling als bedoeld in artikel 1, vijfde lid,
      onderdeel b, worden aangemerkt als dienstbetrekkingen als bedoeld in dit besluit.


      2 Voor bijdragen en vergoedingen van het Rijk over tijdvakken tot de datum van inwerkingtreding van dit besluit en
      ten aanzien van bezwaar en beroep tegen besluiten betreffende deze bijdragen en vergoedingen blijft de Regeling in-
      en doorstroombanen voor langdurig werklozen zoals deze regeling luidde tot de datum van inwerkingtreding van dit
      besluit van toepassing.


      3 Voor besluiten betreffende dienstbetrekkingen bij instellingen als bedoeld in artikel 1, vijfde lid, onderdeel
      b, die betrekking hebben op het tijdvak tot 1 januari 2000 en ten aanzien van bezwaar en beroep tegen dergelijke
      besluiten blijven Onze Minister van Volksgezondheid, Welzijn en Sport dan wel het Centraal orgaan tarieven
      gezondheidszorg na 1 januari 2000 bevoegd.
    url: https://wetten.overheid.nl/BWBR0010994/2003-01-01#Artikel19
  - number: 19b
    text: |-
      1 [Artikel 6, tweede lid, onderdeel c][ref1], zoals dit luidde vóór het tijdstip van inwerkingtreding van de
      __REF001___________________________________________________________________________________________________________
      ______________________________________, blijft van toepassing op de door een
      werkgever ontvangen subsidie op grond van de [artikelen 16][ref3], [17][ref4]
      of [18, met uitzondering van artikel 18, derde lid, van de Wet op de (re)integratie arbeidsgehandicapten][ref5],
      [artikel 13b van de Wet inschakeling werkzoekenden][ref6] of [artikel 81a van de Arbeidsvoorzieningswet 1996][ref7],
      zoals die artikelen luidden vóór genoemd tijdstip, voor een dienstbetrekking die vóór genoemd tijdstip is
      aangegaan, welke subsidie vóór genoemd tijdstip is aangevraagd.

      2 Het Besluit in- en doorstroombanen, zoals dit luidde vóór 1 januari 2003, blijft van toepassing op vóór 1 januari
      2003 aan de gemeente verleende subsidie.


