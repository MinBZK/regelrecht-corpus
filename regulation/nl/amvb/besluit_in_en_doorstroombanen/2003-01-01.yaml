    text: >-
      Dit besluit treedt in werking met ingang van 1 januari 2000 en vervalt met ingang van 1 januari 2004, tenzij voor
      dat tijdstip een voorstel van wet bij de Staten-Generaal is ingediend waarin de subsidie aan de gemeente, bedoeld
      in dit besluit, is geregeld.
