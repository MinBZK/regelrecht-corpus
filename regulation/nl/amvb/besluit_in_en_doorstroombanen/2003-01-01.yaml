preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid, gedaan in overeenstemming met Onze
    Minister van Volksgezondheid, Welzijn en Sport, Onze Minister voor Grote Steden- en Integratiebeleid en Onze
    Minister van Financiën van 13 juli 1999, nr. AM/RAW/99/35349;


    Gelet op artikel 3, eerste en vierde lid, van de Kaderwet SZW-subsidies;


    De Raad van State gehoord (advies van 7 september 1999, nr. W12.99.033/IV);


    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid, uitgebracht in overeenstemming met
    Onze Minister van Volksgezondheid, Welzijn en Sport, Onze Minister voor Grote Steden- en Integratiebeleid en Onze
    Minister van Financiën van 10 december 1999, nr. AM/RAW/99/78514;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0010994/2003-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: de Minister van Sociale Zaken en Werkgelegenheid;

      b. langdurig werkloze: een persoon die:

      1°. twaalf maanden of langer een algemene bijstandsuitkering ontvangt op grond
      van de [Algemene bijstandswet][ref1] dan wel een uitkering op grond van de
      [Wet inkomensvoorziening ouderen en gedeeltelijk arbeidsongeschikte werknemers][ref2] of de
      [Wet inkomensvoorziening ouderen en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3], of

      2°. een uitkering ontvangt op grond van een wet, genoemd onder 1°, en die langer dan twaalf maanden als werkloos
      werkzoekende is ingeschreven bij de Centrale organisatie werk en inkomen, of,

      3°. een dienstbetrekking heeft als bedoeld in
      [artikel 1, eerste lid, onderdeel g, van de Wet inschakeling werkzoekenden][ref4] of een arbeidsovereenkomst heeft
      als bedoeld in [artikel 5 van voornoemde wet][ref5].

      2 In dit besluit en de daarop berustende bepalingen wordt mede verstaan onder langdurig werkloze: de
      persoon, bedoeld in [artikel 1, eerste lid, onderdeel f, van de Wet inschakeling werkzoekenden][ref6],
      van wie de dienstbetrekking, bedoeld in die wet, overeenkomstig de [artikelen 11, onderdeel a][ref7],
      of [23, eerste lid, onderdeel a, van die wet][ref8] is opgezegd.

      3 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. dienstbetrekking: een arbeidsovereenkomst als bedoeld in het Burgerlijk Wetboek of een publiekrechtelijke
      aanstelling;

      b. werknemer: de voormalig langdurig werkloze, die in een dienstbetrekking werkzaam is;

      c. arbeidsplaats: een periode van één jaar waarin, bij een volledige werkweek van ten hoogste 32 uur per week,
      arbeid wordt verricht in dienstbetrekking op basis waarvan de subsidie, bedoeld in artikel 3, eerste lid, wordt
      bepaald;

      d. werkgever: een publiekrechtelijk lichaam of een instelling als bedoeld in het vierde of vijfde lid, tot welk
      een langdurig werkloze in dienstbetrekking staat en die – al of niet door het aangaan van die dienstbetrekking –
      ondernemer is als bedoeld in [artikel 1, eerste lid, onderdeel d, van de Wet op de ondernemingsraden][ref9];

      e. onderneming: de onderneming, bedoeld in
      [artikel 1, eerste lid, onderdeel c, van de Wet op de ondernemingsraden][ref10];

      f. Centrale organisatie werk en inkomen: de Centrale organisatie werk en inkomen, genoemd in
      [hoofdstuk 4 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref11].

      g. vergoeding: de vergoeding die door de gemeente aan een werkgever wordt verstrekt om een arbeidsplaats in de vorm
      van een dienstbetrekking met een langdurig werkloze te vervullen.

      4 In dit besluit en de daarop rustende bepalingen wordt verstaan onder instelling: een rechtspersoon, die:

      a. op grond van de [Wet op de vennootschapsbelasting 1969][ref12] niet onderworpen is aan die belasting of op grond
      van de [artikelen 5][ref13] of [6 van die wet][ref14] is vrijgesteld van die belasting, of

      b. op grond van de [Wet op de vennootschapsbelasting 1969][ref15] onderworpen is aan die belasting, doch waarbij
      de behartiging van het algemeen belang op de voorgrond staat en die voor de exploitatie mede afhankelijk is van
      subsidies.

      5 In dit besluit en de daarop berustende bepalingen wordt mede verstaan onder instelling:

      a. een rechtspersoon die kinderopvang aanbiedt die voldoet aan de eisen, gesteld bij of krachtens het
      [Tijdelijk besluit kwaliteitsregels kinderopvang][ref16];

      b. een rechtspersoon waarbij op grond van de Circulaire beleidsregels extra arbeidsplaatsen zorgsector 1998, nr.
      MEVA/ABA-98102 van 10 februari 1998, vastgesteld door Onze Minister van Volksgezondheid, Welzijn en Sport, mede
      namens Onze Minister, een arbeidsplaats in de vorm van een dienstbetrekking met een langdurig werkloze kon worden
      vervuld, waarvan de kosten op grond van artikel 16 van de Regeling in- en doorstroombanen voor langdurig werklozen
      zoals deze regeling luidde tot de datum van inwerkingtreding van dit besluit, tot 1 januari 2000 vergoed werden
      door middel van subsidie van Onze Minister van Volksgezondheid, Welzijn en Sport of gefinancierd werden op grond
      van besluiten van het Centraal orgaan tarieven gezondheidszorg.


