  - number: '10'
    text: |-
      1 De gemeente kan een werkgever toestaan, dat hij aan een werknemer een andere functie aanbiedt, waarin hij een
      loon betaalt dat meer bedraagt dan het bedrag, bedoeld in artikel 9, eerste lid.

      2 Op het loon, bedoeld in het eerste lid, is artikel 9 van toepassing waarbij voor «130%» wordt gelezen «150%».

      Burgemeester en wethouders kunnen de toestemming, bedoeld in het eerste lid, slechts geven indien voor het tot
      stand komen van de functie is voldaan aan [artikel 7, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010994#Artikel7
