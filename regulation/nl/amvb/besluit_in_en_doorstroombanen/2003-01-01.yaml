  - number: '8'
    text: >-
      De arbeidsduur per week in een dienstbetrekking als bedoeld in dit besluit, bedraagt bij aanvang van de
      dienstbetrekking ten minste zoveel uren, dat de werknemer niet is aangewezen op een uitkering als bedoeld
      in artikel 1, eerste lid, onderdeel b, onder 1°, waarop hij recht zou hebben gehad indien met hem niet die
      dienstbetrekking zou zijn aangegaan, tenzij op grond van bij de werknemer gelegen factoren een andere arbeidsduur
      aangewezen is.
    url: https://wetten.overheid.nl/BWBR0010994/2003-01-01#Artikel8
  - number: '9'
    text: |-
      1 Het loon, exclusief de vakantiebijslag, dat aan de werknemer in de dienstbetrekking wordt betaald en
      dat naar evenredigheid wordt verminderd indien de overeengekomen arbeidsduur minder is dan de normale
      arbeidsduur, bedoeld in [artikel 12 van de Wet minimumloon en minimumvakantiebijslag][ref1], bedraagt over
      de overeengekomen uitbetalingstermijn niet meer dan 130% van het bedrag, bedoeld in de [artikelen 8][ref2] en
      [12 van de Wet minimumloon en minimumvakantiebijslag][ref3].

      2 Bij de toepassing van het eerste lid worden buiten beschouwing gelaten de toeslagen in verband met werk
      op ongebruikelijke tijdstippen, die op grond van de van toepassing zijnde collectieve arbeidsovereenkomst of
      rechtspositieregeling aan de werknemer worden betaald.

      3 Het loon, bedoeld in het eerste lid, is het loon in de zin van de [Wet op de loonbelasting 1964][ref4],
      verminderd met tot dat loon behorende:

      a. tantièmes, gratificaties, en andere beloningen die in de regel slechts eenmaal of eenmaal per jaar worden
      toegekend;

      b. vergoedingen die worden verleend in het kader van het
      [Besluit tegemoetkoming ziektekosten en inkomenstoeslag onderwijs- en onderzoekspersoneel][ref5] en het
      [Besluit tegemoetkoming ziektekosten rijkspersoneel][ref6];

      c. loon dat in geblokkeerde vorm wordt gespaard ingevolge een spaarloonregeling;

      d. loon ter zake waarvan de belasting ingevolge [artikel 31 van die wet][ref7] wordt geheven van de
      inhoudingsplichtige.


