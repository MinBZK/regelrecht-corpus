  - number: '2'
    text: De Algemene Regeling SZW-subsidies is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0010994/2003-01-01#Artikel2
  - number: '3'
    text: |-
      1 Onze Minister verstrekt subsidie aan de gemeente voor arbeidsplaatsen voor langdurig werklozen die in de vorm
      van dienstbetrekkingen bij werkgevers worden vervuld en, voorzover de subsidie daarvoor toereikend is, andere
      voorzieningen gericht op arbeidsinschakeling voor werkzoekenden.

      2 Het gemeentebestuur toetst voor de besteding van de subsidie op grond van dit besluit bij toepassing van artikel
      1, vierde lid, onderdeel b, of de daar bedoelde rechtspersoon aan dat onderdeel voldoet.

      3 Het gemeentebestuur stelt voor het tot stand brengen van arbeidsplaatsen op het gebied van
      openbare veiligheid en toezicht een beleid vast na bespreking in het reguliere overleg, bedoeld in
      [artikel 27 van de Politiewet 1993][ref1], tussen de burgemeester van de gemeente, waar de werkzaamheden op
      de dienstbetrekkingen in belangrijke mate worden verricht, de officier van justitie van het desbetreffende
      arrondissement en de korpschef van het regionale politiekorps.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel27
    url: https://wetten.overheid.nl/BWBR0010994/2003-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '27'
  - number: '5'
    text: |-
      1 Ten behoeve van de werkgever verklaren burgemeester en wethouders van de gemeente, waarin de beoogde werknemer
      woonachtig is, voor de toepassing van artikel 6, tweede lid, onderdeel a, zo nodig na overleg met de Centrale
      organisatie werk en inkomen, in een schriftelijk stuk, dat die persoon een langdurig werkloze is.

      2 De verklaring, bedoeld in het eerste lid, geeft tevens aan welk inkomen voor deze persoon aangewezen is om te
      voldoen aan artikel 8 of welke arbeidsduur voor die persoon aangewezen kan zijn in verband met bij die persoon
      gelegen factoren.

      3 Burgemeester en wethouders kunnen voor de toepassing van dit besluit personen, die in vergelijkbare
      omstandigheden verkeren als die bedoeld in [artikel 1, eerste lid, onderdeel b, en tweede lid][ref1], gelijkstellen
      met een langdurig werkloze.


      [ref1]: https://wetten.overheid.nl/BWBR0010994#Artikel1
    url: https://wetten.overheid.nl/BWBR0010994/2003-01-01#Artikel5
    references:
      - id: ref1
