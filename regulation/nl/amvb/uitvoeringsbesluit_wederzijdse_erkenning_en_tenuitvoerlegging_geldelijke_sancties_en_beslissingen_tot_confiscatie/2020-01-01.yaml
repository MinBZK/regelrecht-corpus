  - number: '3.1'
    text: |-
      Een certificaat dat is afgegeven door de bevoegde autoriteit van een andere lidstaat en wordt meegezonden met de
      beslissing waarbij een geldelijke sanctie is opgelegd of met een beslissing tot confiscatie welke in Nederland moet
      worden erkend en ten uitvoer gelegd, is gesteld in de Nederlandse taal of, indien Nederland zulks heeft meegedeeld
      in een bij het secretariaat-generaal van de Raad van de Europese Unie neergelegde verklaring, in een van de in die
      verklaring genoemde talen.
    url: https://wetten.overheid.nl/BWBR0022793/2020-01-01#Artikel3
  - number: '3.2'
    text: |-
      Een certificaat dat is afgegeven door de officier van justitie en wordt meegezonden met een beslissing waarbij een
      geldelijke sanctie is opgelegd of met een beslissing tot confiscatie, is gesteld in de officiële taal of een van de
      officiële talen van de lidstaat waaraan de beslissing met het oog op de tenuitvoerlegging aldaar wordt gezonden dan
      wel, indien die lidstaat zulks heeft meegedeeld in een bij het secretariaat-generaal van de Raad van de Europese
      Unie neergelegde verklaring, in een van de in die verklaring genoemde talen.
    url: https://wetten.overheid.nl/BWBR0022793/2020-01-01#Artikel3
