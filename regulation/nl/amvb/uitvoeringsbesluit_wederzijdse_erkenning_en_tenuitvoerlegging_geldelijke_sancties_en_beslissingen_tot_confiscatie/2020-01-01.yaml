  - number: 2.A
    text: |-
      voor gevallen waarin het een beslissing, houdende een geldelijke sanctie betreft: a) Beslissingsstaat: ...
      Tenuitvoerleggingsstaat: ... b) Autoriteit die de beslissing tot het opleggen van de geldelijke sanctie heeft
      gegeven: 'Officiële naam: ... Adres: ... Dossiernummer: ... Tel.(landnummer)(netnummer): ... Faxlandnummer)'
      (netnurnmer): ... E-mailadres (indien beschikbaar): ... Talen waarin kan worden gecommuniceerd met de autoriteit
      die de beslissing heeft gegeven: ... Adresgegevens van de persoon (personen) die benaderd moet(en) worden indien
      er aanvullende informatie nodig is met het oog op de tenuitvoerlegging van de beslissing of, indien van toepassing,
      met het oog op het overmaken aan de beslissingsstaat van.de gelden van de tenuitvoerlegging (naam, titel/rang,
      telefoon, fax en, indien beschikbaar, e-mailadres): ... c) Autoriteit die bevoegd is voor de tenuitvoerlegging van
      de beslissing tot het opleggen van de geldelijke sanctie in de beslissingsstaat (indien dat een andere is dan de
      onder b) genoemde autoriteit): Officiële naam: ... Adres: ... Tel. (landnummer) (netnummer): ... Fax (landnummer
      (netnummer): ... E-mailadres (indien beschikbaar): ... Talen waarin kan worden gecommuniceerd met de autoriteit
      die bevoegd is voor de tenuitvoerlegging: ... Adresgegevens van de persoon (personen) die benaderd moet(en) worden
      indien er aanvullende informatie nodig is met het oog op de tenuitvoerlegging van de beslissing of, indien van
      toepassing, met het oog op het overmaken aan de beslissingsstaat van de gelden van de tenuitvoerlegging (naam,
      titel/rang, telefoon, fax en, indien beschikbaar, e-mailadres): ... d) Indien een centrale autoriteit belast is met
      de administratieve toezending van beslissingen tot het opleggen van een geldelijke sanctie in de beslissingsstaat:
      Naam van de centrale autoriteit: ... Contactpersoon, indien van toepassing (titel/rang en naam): ... Adres: ...
      Dossiernummer: '... Tel. (landnummer) (netnummer): ... Fax (landnummer) (netnummer): ... E-mailadres (indien'
      beschikbaar): ... e) Autoriteit(en) waarmee contact kan worden opgenomen (als punt c) en/ofpunt d) zijn/is
      ingevuld): □ Onder b) genoemde autoriteit Kan gecontacteerd worden voor vragen omtrent: ... □ Onder c) genoemde
      autoriteit Kan gecontacteerd worden voor vragen omtrent: ... □ Onder d) genoemde autoriteit Kan gecontacteerd
      worden voor vragen omtrent: ... f) Gegevens betreffende de natuurlijke of rechtspersoon aan wie de geldelijke
      sanctie is opgelegd: **1. Voor een natuurlijke persoon** Naam: ... Voornaam of voornamen: ... Meisjesnaam,
      indien van toepassing: ... Bijnamen, indien van toepassing: ... Geslacht: ... Geslacht: ... Nationaliteit: ...
      Identiteitskaartnummer of socialezekerheidsnummer (indien beschikbaar): ... Geboortedatum: ... Geboorteplaats: ...
      Laatste bekende adres: ... Taal of talen die de persoon begrijpt (indien bekend): ... a) Indien de beslissing
      wordt toegezonden aan de tenuitvoerleggingsstaat omdat de persoon tegen wie de beslissing is genomen, gewoonlijk
      verblijf houdt in de tenuitvoerleggingsstaat, de volgende informatie toevoegen: Gewone verblijfplaats in de
      tenuitvoerleggingsstaat: ... b) Indien de beslissing wordt toegezonden aan de tenuitvoerleggingsstaat omdat
      de persoon tegen wie de beslissing is genomen, eigendommen heeft in de tenuitvoerleggingsstaat, de volgende
      informatie toevoegen: Precieze beschrijving van de eigendom van de persoon: ... Locatie van de eigendom van
      de persoon: ... c) Indien de beslissing wordt toegezonden aan de tenuitvoerleggingsstaat omdat de persoon
      tegen wie de beslissing is genomen, inkomsten heeft in de tenuitvoerleggingsstaat, de volgende informatie
      toevoegen: 'Beschrijving van de inkornstenbrontnen) van de persoon: ... Locatie van de inkomsten bron(nen) van de'
      persoon: '... 2. Voor een rechtspersoon: Naam: ... Rechtsvorm: ... Registratienummer (indien beschikbaar) : ...'
      Statutaire zetel (indien beschikbaar): ... Adres van de rechtspersoon: ... a) Indien de beslissing wordt
      toegezonden aan de tenuitvoerleggingsstaat omdat de rechtspersoon waartegen de beslissing is genomen, eigendommen
      heeft in de tenuitvoerleggingsstaat, de volgende informatie toevoegen: Beschrijving van de eigendom van de
      rechtspersoon: '... Locatie van de eigendom van de rechtspersoon: ... b) Indien de beslissing wordt toegezonden'
      aan de tenuitvoerleggingsstaat omdat de rechtspersoon waartegen de beslissing is genomen, inkomsten heeft in
      de tenuitvoerleggingsstaat, de volgende informatie toevoegen: Beschrijving van de inkomstenbron(nen) van de
      rechtspersoon: '... Locatie van de inkomstenbron(nen) van de rechtspersoon: ... g) De beslissing tot het opleggen'
      van een geldelijke sanctie: I. De aard van de beslissing tot het opleggen van de geldelijke sanctie (kruis het
      overeenkomstige vak aan): □ i) Beslissing van een rechter van de beslissingsstaat ten aanzien van een naar het
      recht van de beslissingsstaat strafbaar feit. □ ii) Beslissing van een andere autoriteit van de beslissingsstaat
      dan een rechter, ten aanzien van een naar het recht van de beslissingsstaat strafbaar feit. Er wordt bevestigd dat
      de betrokkene de gelegenheid heeft gehad om de zaak te doen behandelen door een met name in strafzaken bevoegde
      rechter. □ iii) Beslissing van een andere autoriteit van de beslissingsstaat dan een rechter, ten aanzien van
      feiten die naar het nationale recht van de beslissingsstaat worden bestraft als inbreuk op de rechtsvoorschriften.
      Er wordt bevestigd dat de betrokkene de gelegenheid heeft gehad om de zaak te doen behandelen door een met name in
      strafzaken bevoegde rechter. □ iv) Beslissing van een met name in strafzaken bevoegde rechter betreffende een onder
      iii) bedoelde beslissing. De beslissing is gegeven op (datum): ... De beslissing is onherroepelijk geworden op
      datum): ... Referentienummer van de beslissing (indien beschikbaar): ... De geldelijke sanctie is de verplichting
      tot betaling van (kruis het toepasselijke vak/de toepasselijke vakken aan en vermeld het bedrag/de bedragen en de
      munteenheid): □ i) een geldsom die in geval van veroordeling wegens een strafbaar feit bij beslissing is opgelegd.
      Bedrag: ... □ ii) een schadevergoeding die bij dezelfde beslissing is toegewezen aan het slachtoffer, indien het
      slachtoffer niet als burgerlijke partij aan de procedure kan deelnemen en de rechter zijn rechtsmacht in strafzaken
      uitoefent. Bedrag: ... □ iii) een geldsom voor de kosten van de rechterlijke of bestuursrechtelijke procedure
      die tot de beslissing leidt. Bedrag: ... □ iv) een geldsom ten behoeve van een overheidsfonds of een organisatie
      voor slachtofferhulp die bij dezelfde beslissing is opgelegd. Bedrag: ... Het totaalbedrag van de geldelijke
      sanctie, onder vermelding van de munteenheid: ... 2. Een samenvatting van de feiten en een beschrijving van de
      omstandigheden waarin het strafbare feit/de strafbare feiten is/zijn gepleegd, inclusief tijd en plaats: ... Aard
      en kwalificatie van het strafbare feit/de strafbare feiten en toepasselijke wetsbepaling/toepasselijk wetboek op
      grond waarvan de beslissing is gegeven: ... 3. Als het in punt 2 genoemde strafbare feit/de in punt 2 genoemde
      strafbare feiten één of meer van de volgende strafbare feiten vormen, bevestig dit door het overeenkomstige vak/
      de overeenkomstige vakken aan te kruisen: □ deelneming aan een criminele organisatie; □ terrorisme; □ mensenhandel;
      □ seksuele uitbuiting van kinderen en kinderpornografie; □ illegale handel in verdovende middelen en psychotrope
      stoffen; □ illegale handel in wapens, munitie en explosieven; □ corruptie; □ fraude, met inbegrip van fraude
      waardoor de financiële belangen van de Europese Gemeenschappen worden geschaad in de zin van de Overeenkomst
      van 26 juli 1995 aangaande de bescherming van de financiële belangen van de Europese Gemeenschappen; □ witwassen
      van opbrengsten van misdrijven; □ valsemunterij, met inbegrip van namaak van de euro; □ cybercriminaliteit; □
      milieumisdrijven, met inbegrip van de illegale handel in bedreigde diersoorten en de illegale handel in bedreigde
      planten- en boomsoorten; □ hulp aan illegale binnenkomst en illegaal verblijf; □ moord en doodslag, zware
      mishandeling; □ illegale handel in menselijke organen en weefsels; □ ontvoering, wederrechtelijke vrijheidsberoving
      en gijzeling; □ racisme en vreemdelingenhaat; □ georganiseerde of gewapende diefstal; □ illegale handel in
      cultuurgoederen, waaronder antiquiteiten en kunstvoorwerpen; □ oplichting; □ racketeering en afpersing; □ namaak
      van producten en productpiraterij; □ vervalsing van administratieve documenten en handel in valse documenten;
      □ vervalsing van betaalmiddelen; □ illegale handel in hormonale stoffen en andere groeibevorderaars; □ illegale
      handel in nucleaire en radioactieve stoffen; □ handel in gestolen voertuigen; □ verkrachting; □ opzettelijke
      brandstichting; □ misdrijven die onder rechtsmacht van het Internationaal Strafhof vallen; □ kaping van vliegtuigen
      of schepen; □ sabotage; □ gedragingen in strijd met de verkeersregels, met inbegrip van overtredingen van de rij-
      en rusttijdenwetgeving en van de wetgeving inzake gevaarlijke goederen; □ smokkel van goederen; □ inbreuken op
      de intellectuele-eigendomsrechten; □ bedreigingen en daden van geweld jegens personen, met inbegrip van geweld
      tijdens sportevenementen; □ opzettelijke vernieling; □ diefstal; □ strafbare feiten die door de beslissingsstaat
      worden vastgesteld en die onder uitvoeringsverplichtingen vallen welke voortkomen uit instrumenten op grond van het
      Verdrag tot oprichting van de Europese Gemeenschap of titel VI van het Verdrag betreffende de Europese unie. Wordt
      dit vakje aangekruist, geef dan precies aan op welke bepalingen van het krachtens het Verdrag tot oprichting van de
      Europese Gemeenschap ofhet Verdrag betreffende de Europese Unie aangenomen instrument het strafbare feit betrekking
      heeft: ... 4. Als het in punt 2 genoemde strafbare feit/de in punt 2 genoemde strafbare feiten niet onder punt
      3 valt/vallen, geef dan een volledige beschrijving van het desbetreffende strafbare feit! de desbetreffende
      strafbare feiten: ... h) Status van de beslissing tot het opleggen van de geldelijke sanctie 1. Bevestig dat
      (kruis aan): □ a) de beslissing een onherroepelijke beslissing is; □ b) voorzover bekend aan de autoriteit die
      het certificaat aflevert, in de tenuitvoerleggingsstaat tegen de veroordeelde geen beslissing is gegeven voor
      dezelfde feiten en dat geen dergelijke beslissing die is gegeven in een andere staat dan de beslissings- en de
      tenuitvoerleggingsstaat, ten uitvoer is gelegd. 2. Vermeld of de zaak is behandeld volgens een schriftelijke
      procedure: □ a) Neen, zij is niet volgens een schriftelijke procedure behandeld. □ b) Ja, zij is volgens een
      schriftelijke procedure behandeld. Bevestigd wordt dat de betrokkene in overeenstemming met het recht van de
      beslissingsstaat persoonlijk of door toedoen van een naar het nationale recht bevoegde vertegenwoordiger in kennis
      is gesteld van zijn recht om de zaak te betwisten, alsmede van de termijnen voor dat rechtsmiddel.
    url: https://wetten.overheid.nl/BWBR0022793/2020-01-01#Artikel2
  - number: 2.A.3
    text: 'Gelieve te vermelden of de betrokkene in persoon is verschenen op het proces dat heeft geleid tot de beslissing:'
    url: https://wetten.overheid.nl/BWBR0022793/2020-01-01#Artikel2
  - number: 2.A.3.1
    text: □ Ja, de betrokkene is in persoon verschenen op het proces dat heeft geleid tot de beslissing.
    url: https://wetten.overheid.nl/BWBR0022793/2020-01-01#Artikel2
  - number: 2.A.3.2
    text: □ Neen, de betrokkene is niet in persoon verschenen op het proces dat heeft geleid tot de beslissing.
    url: https://wetten.overheid.nl/BWBR0022793/2020-01-01#Artikel2
  - number: 2.A.3.3
    text: |-
      Indien u het vakje «neen» (keuzemogelijkheid 2) heeft aangekruist, gelieve een van de volgende gevallen te
      bevestigen:
    url: https://wetten.overheid.nl/BWBR0022793/2020-01-01#Artikel2
  - number: 2.A.3.3.□
    text: |-
      3.1a) de betrokkene is persoonlijk gedagvaard op ... (dag/maand/jaar) en is daarbij op de hoogte gebracht van het
      tijdstip en de plaats van het proces dat tot de beslissing heeft geleid, en is ervan in kennis gesteld dat een
      beslissing kan worden gegeven wanneer hij niet op het proces verschijnt; OF
    url: https://wetten.overheid.nl/BWBR0022793/2020-01-01#Artikel2
  - number: 2.A.3.3.□
    text: |-
      3.1b) de betrokkene is niet persoonlijk gedagvaard, maar is anderszins daadwerkelijk officieel in kennis gesteld
      van het tijdstip en de plaats van het proces dat tot de beslissing heeft geleid zodat op ondubbelzinnige wijze
      vaststaat dat hij op de hoogte was van het voorgenomen proces, en is ervan in kennis gesteld dat een beslissing kan
      worden gegeven wanneer hij niet op het proces verschijnt; OF
    url: https://wetten.overheid.nl/BWBR0022793/2020-01-01#Artikel2
  - number: 2.A.3.3.□
    text: |-
      3.2. de betrokkene was op de hoogte van het voorgenomen proces, heeft een zelf gekozen of van overheidswege
      toegewezen raadsman gemachtigd zijn verdediging op het proces te voeren, en is op het proces ook werkelijk door die
      raadsman verdedigd; OF
    url: https://wetten.overheid.nl/BWBR0022793/2020-01-01#Artikel2
  - number: 2.A.3.3.□
    text: |-
      3.3. nadat de beslissing aan hem was betekend op ... (dag/maand/jaar) en hij uitdrukkelijk was geïnformeerd over
      zijn recht op een verzetprocedure of een procedure in hoger beroep, waarbij hij het recht heeft aanwezig te zijn,
      waarbij de zaak opnieuw ten gronde wordt behandeld en nieuw bewijsmateriaal wordt toegelaten, en die kan leiden tot
      herziening van de oorspronkelijke beslissing
    url: https://wetten.overheid.nl/BWBR0022793/2020-01-01#Artikel2
  - number: 2.A.3.3.□
    text: heeft de betrokkene uitdrukkelijk te kennen gegeven dat hij de beslissing niet betwist; OF
    url: https://wetten.overheid.nl/BWBR0022793/2020-01-01#Artikel2
  - number: 2.A.3.3.□
    text: heeft de betrokkene niet binnen de voorgeschreven termijn verzet of hoger beroep aangetekend; OF
    url: https://wetten.overheid.nl/BWBR0022793/2020-01-01#Artikel2
  - number: 2.A.3.3.□
    text: |-
      3.4. de betrokkene, na uitdrukkelijk te zijn geïnformeerd over de procedure en over de mogelijkheid om in persoon
      te verschijnen op het proces, heeft uitdrukkelijk verklaard afstand te doen van zijn recht op een mondelinge
      behandeling en heeft uitdrukkelijk te kennen gegeven dat hij de zaak niet betwist.
    url: https://wetten.overheid.nl/BWBR0022793/2020-01-01#Artikel2
  - number: 2.A.3.4
    text: |-
      Gelieve voor het in punt 3.1b, 3.2, 3.3 en 3.4 aangekruiste vakje
      te vermelden op welke wijze aan de desbetreffende voorwaarde is
      voldaan: ..........................................................................................................
      ................ ..................................................................................................
      ........................ ..........................................................................................
      ....
    url: https://wetten.overheid.nl/BWBR0022793/2020-01-01#Artikel2
  - number: 2.B
    text: |-
      voor gevallen waarin het een beslissing tot confiscatie betreft: a) Beslissingsstaat en tenuitvoerleggingsstaat:
      Beslissingsstaat: '... Tenuitvoerleggingsstaat: ... b) Rechter/rechtbank die de beslissing tot confiscatie heeft'
      gegeven: 'Officiële naam: ... Adres: ... Dossiemummer: ... tel. (landnummer) (netnummer): ... Fax (landnummer)'
      (netnummer): ... E-mailadres (indien beschikbaar): ... Talen waarin kan worden gecommuniceerd met de rechter/
      rechtbank: ... Contactgegevens van de persoon (personen) die benaderd moet(en) worden indien er aanvullende
      informatie nodig is met het oog op de tenuitvoerlegging van de beslissing tot confiscatie of, indien van
      toepassing, met het oog op de coördinatie van de tenuitvoerlegging van een beslissing tot confiscatie die aan
      twee of meer tenuitvoerleggingsstaten is gezonden, of met het oog op het overmaken aan de beslissingsstaat
      van de gelden of goederen die uit de tenuitvoerlegging zijn verkregen (naam, titel/rang, telefoon, fax, en,
      indien beschikbaar, e-mailadres): ... c) Autoriteit die bevoegd is tot de tenuitvoerlegging van de beslissing
      tot confiscatie in de beslissingsstaat (indien dat een andere is dan de onder b) genoemde rechter/rechtbank):
      Officiële naam: ... Adres: ... Tel. (landnummer) (netnummer): ... Fax (landnummer) (netnummer): ... E-mailadres
      (indien beschikbaar): ... Talen waarin kan worden gecommuniceerd met de autoriteit die bevoegd is voor de
      tenuitvoerlegging: ... Contactgegevens van de persoon (personen) die benaderd moet(en) worden indien er aanvullende
      informatie nodig is met het oog op de tenuitvoerlegging van de beslissing tot confiscatie of, indien van
      toepassing, met het oog op de coördinatie van de tenuitvoerlegging van een beslissing tot confiscatie die aan twee
      of meer tenuitvoerleggingsstaten is gezonden, of met het oog op het overmaken aan de beslissingsstaat van de gelden
      of goederen die uit de tenuitvoerlegging zijn verkregen (naam, titel/rang, telefoon, fax, en, indien beschikbaar,
      e-mailadres): ... d) Indien een centrale autoriteit belast is met de administratieve toezending en ontvangst van
      beslissingen tot confiscatie in de beslissingsstaat: Naam van de centrale autoriteit ... Contactpersoon, indien
      van toepassing (titel/rang en naam): ... Adres: ... Dossiernummer: ... Tel. (landnummer) netnummer): ... Fax
      (landnummer) (netnummer): ... E-mailadres (indien beschikbaar): ... e) Autoriteit(en) waarmee contact kan worden
      opgenomen (als punt c) enlof d) is/zijn ingevuld) □ Onder b) genoemde autoriteit kan benaderd worden voor vragen
      omtrent: '... □ Onder c) genoemde autoriteit kan benaderd worden voor vragen omtrent: ... □ Onder d) genoemde'
      autoriteit kan benaderd worden voor vragen omtrent: ... f) Ingeval de beslissing tot confiscatie een vervolg is
      op een beslissing tot bevriezing die is toegezonden aan de tenuitvoerleggingsstaat overeenkomstig Kaderbesluit
      2003/577/JBZ van de Raad van 22 juli 2003 inzake de tenuitvoerlegging in de Europese Unie van beslissingen tot
      bevriezing van voorwerpen of bewijsstukken (1), relevante informatie verstrekken om de beslissing tot bevriezing
      te identificeren (de data van afgifte en toezending van de beslissing tot confiscatie, de autoriteit waaraan
      deze is toegezonden, referentienummer indien beschikbaar): ... g) Wanneer de beslissing tot confiscatie aan
      meer dan één tenuitvoerleggingsstaat is toegezonden, volgende informatie verstrekken: 1. De beslissing tot
      confiscatie is toegezonden aan de onderstaande andere tenuitvoerleggingssta(a)t(en) (land en autoriteit): ...
      2. De beslissing tot confiscatie is aan meer dan één tenuitvoerleggingsstaat toegezonden en wel om volgende
      reden (aankruisen wat van toepassing is): 2.1. Ingeval de beslissing tot confiscatie betrekking heeft op één of
      meer specifieke voorwerpen: □ Van verschillende specifieke voorwerpen die onder de beslissing tot confiscatie
      vallen, wordt aangenomen dat zij zich in verschillende tenuitvoerleggingsstaten bevinden. □ De confiscatie van
      een specifiek voorwerp brengt mee dat in meer dan één tenuitvoerleggingsstaat moet worden opgetreden. □ Van een
      specifiek voorwerp dat onder de beslissing tot confiscatie valt, wordt aangenomen dat het zich in één van twee
      of meer nader genoemde tenuitvoerleggingsstaten bevindt. 2.2. Wanneer de beslissing tot confiscatie betrekking
      heeft op een geldbedrag: □ Voorwerpen in kwestie zijn niet bevroren overeenkomstig Kaderbesluit 2003/577/JBZ
      van de Raad van 22 juli 2003 inzake de tenuitvoerlegging in de Europese Unie van beslissingen tot bevriezing
      van voorwerpen of bewijsstukken. □ De gezamenlijke waarde van de voorwerpen die kunnen worden geconfisqueerd in
      de beslissingsstaat en in een tenuitvoerleggingsstaat, volstaat waarschijnlijk niet om bij de tenuitvoerlegging
      het volledige bedrag te dekken dat in de □ Andere reden(en) (nader te vermelden): ... h) Gegevens betreffende
      de natuurlijke of rechtspersoon aan wie de beslissing tot confiscatie is opgelegd: 1. Voor een natuurlijke
      persoon Naam: ... Voornaam of voornamen: ... Meisjesnaam, indien van toepassing: ... Alias/sen, indien van
      toepassing: '... Geslacht: ... Nationaliteit: ... Identiteitskaartnummer of sociale zekerheidsnummer (indien'
      mogelijk): ... Geboortedatum: ... Geboorteplaats: ... Laatste bekende adres: ... Taal of talen die de persoon
      begrijpt (indien bekend): ... 1.1. Wanneer de beslissing tot confiscatie betrekking heeft op een geldbedrag: De
      beslissing tot confiscatie wordt toegezonden aan de tenuitvoerleggingsstaat omdat (aankruisen wat van toepassing
      is): □ a) de beslissingsstaat op grond van redelijke vermoedens aanneemt dat de persoon aan wie de beslissing tot
      confiscatie is opgelegd, eigendommen of een inkomen heeft in de tenuitvoerleggingsstaat. De volgende informatie
      toevoegen: 'Gronden waarop het vermoeden berust dat de persoon eigendom/inkomen heeft: ... Beschrijving van de'
      eigendommen van de persoon/inkomstenbron: ... Locatie van de eigendommen van de persoon/inkomstenbron (indien
      onbekend, de laatste bekende locatie): ... □ b) er geen redelijke vermoedens in de zin van punt a) bestaan
      op grond waarvan de beslissingsstaat kan bepalen aan welke lidstaat de beslissing tot confiscatie kan worden
      toegezonden, maar de persoon aan wie de beslissing tot confiscatie is opgelegd zijn vaste woon- of verblijfplaats
      in de tenuitvoerleggingsstaat heeft. De volgende informatie toevoegen: Vaste woon- of verblijfsplaats in de
      tenuitvoerleggingsstaat: ... 1.2. Wanneer de beslissing tot confiscatie betrekking heeft op een specifiek voorwerp
      of voorwerpen: De beslissing tot confiscatie wordt toegezonden aan de tenuitvoerleggingsstaat omdat (aankruisen wat
      van toepassing is): □ a) het (de) specifieke voorwerp(en) zich in de tenuitvoerleggingsstaat bevindt (bevinden).
      (Zie punt i)); □ b de beslissingsstaat op grond van redelijke vermoedens aanneemt dat het specifieke voorwerp
      of de specifieke voorwerpen waarop de beslissing tot confiscatie betrekking heeft, zich geheel of gedeeltelijk
      in de tenuitvoerleggingsstaat bevindt (bevinden). De volgende informatie toevoegen: ... Gronden waarop het
      vermoeden berust dat het specifiek voorwerp of de specifieke voorwerpen zich in de tenuitvoerleggingsstaat bevindt
      bevinden): □ c) er geen redelijke vermoedens in de zin van punt b) bestaan op grond waarvan de beslissingsstaat
      kan bepalen aan welke lidstaat de beslissing tot confiscatie kan worden toegezonden, maar de persoon aan wie de
      beslissing tot confiscatie is opgelegd zijn vaste woon- of verblijfplaats in de tenuitvoerleggingsstaat heeft.
      De volgende informatie toevoegen: Vaste woon- of verblijfplaats in de tenuitvoerleggingsstaat: ... 2. Voor een
      rechtspersoon Naam: ... Rechtsvorm: ... Registratienummer (indien beschikbaar): ... Statutaire zetel (indien
      beschikbaar): ... Adres van de rechtspersoon: ... 2.1. Wanneer de beslissing tot confiscatie betrekking heeft op
      een geldbedrag: De beslissing tot confiscatie wordt toegezonden aan de tenuitvoerleggingsstaat omdat (aankruisen
      wat van toepassing is): □ a) de beslissingsstaat op grond van redelijke vermoedens aanneemt dat de persoon tegen
      wie de beslissing tot confiscatie is gegeven, eigendommen of een inkomen heeft in de tenuitvoerleggingsstaat.
      De volgende informatie toevoegen: Gronden waarop het vermoeden berust dat de rechtspersoon eigendom/inkomen
      heeft: '... Beschrijving van de eigendommen van de rechtspersoon/de inkomstenbron: ... Locatie van de eigendommen'
      van de persoon/inkomstenbron (indien onbekend, de laatste bekende locatie): ... □ b) er geen redelijke vermoedens
      in de zin van punt a) bestaan op grond waarvan de beslissingsstaat kan bepalen aan welke lidstaat de beslissing
      tot confiscatie kan worden toegezonden, maar de persoon aan wie de beslissing tot confiscatie is opgelegd zijn
      statutaire zetel in de tenuitvoerleggingsstaat heeft. De volgende informatie toevoegen: Statutaire zetel in de
      tenuitvoerleggingsstaat: ... ... 2.2 Wanneer de beslissing tot confiscatie betrekking heeft op een specifiek
      voorwerp of voorwerpen: De beslissing tot confiscatie wordt toegezonden aan de tenuitvoerleggingsstaat omdat
      (het overeenkomstige vak aankruisen): □ a) het (de) specifieke voorwerp(en) zich in de tenuitvoerleggingsstaat
      bevindt (bevinden). (Zie punt i)); □ b) de beslissingsstaat op grond van redelijke vermoedens aanneemt dat het
      specifieke voorwerp of de specifieke voorwerpen waarop de beslissing tot confiscatiebetrekkingheeft zich geheel
      of gedeeltelijk in de tenuitvoerleggingsstaat bevinden. De volgende informatie toevoegen: ... Gronden waarop
      het vermoeden berust dat het specifieke voorwerp of de specifieke voorwerpen zich in de tenuitvoerleggingsstaat
      bevindt (bevinden): ... □ c) er geen redelijke vermoedens in de zin van punt b) bestaan op grond waarvan de
      beslissingsstaat kan bepalen aan welke lidstaat de beslissing tot confiscatie kan worden toegezonden, maar de
      persoon aan wie de beslissing tot confiscatie is opgelegd zijn statutaire zetel in de tenuitvoerleggingsstaat
      heeft. De volgende informatie toevoegen: Statutaire zetel in de tenuitvoerleggingsstaat: ... i) De beslissing
      tot confiscatie. De beslissing tot confiscatie is opgelegd op (datum): De beslissing tot confiscatie is oplegd
      op (datum): ... De beslissing tot confiscatie is onherroepelijk geworden op (datum): ... Referentienummer van de
      beslissing tot confiscatie (indien beschikbaar): ... 1. Informatie over de aard van de beslissing tot confiscatie
      1.1. Geef aan door aan te kruisen wat van toepassing is of de beslissing tot confiscatie betrekking heeft op: □
      een geldsom Het bedrag dat ten uitvoer moet worden gelegd in de tenuitvoerleggingsstaat, met opgave van valuta
      (in cijfers en in letters): ... Het totaalbedrag dat in de beslissing tot confiscatie is bepaald, met opgave van
      valuta in cijfers en letters: ... □ Een specifiek voorwerp of specifieke voorwerpen Beschrijving van het specifieke
      voorwerp of de specifieke voorwerpen: ... Locatie van het specifieke voorwerp of de specifieke voorwerpen (indien
      onbekend, de laatste bekende locatie): ... Indien de confiscatie van bet specifieke voorwerp of de specifieke
      voorwerpen met zich brengt dat in meer dan één tenuitvoerleggingsstaat moet worden opgetreden, omschrijving van
      het te ondernemen optreden: ... 1.2. De rechter/rechtbank heeft besloten dat de voorwerpen (aankruisen wat van
      toepassing is): □ i) de opbrengst zijn van een strafbaar feit dan wel met de gehele of gedeeltelijke waarde van die
      opbrengst □ ii) een hulpmiddel voor dat strafbare feit vormen; □ iii) vatbaar zijn voorconfiscatie door de toep,
      assing in de beslissingsstaat van een van de ruimere confiscatiebevoegdheden zoals onder a), b) en c) vermeld. De
      beslissing is ingegeven door het feit dat de rechter, op basis van specifieke feiten, er ten volle van overtuigd
      is dat de voorwerpen in kwestie zijn verkregen uit: □ a) criminele activiteiten van de schuldig bevonden persoon
      gepleegd tijdens een periode vóór de veroordeling voor het strafbaar feit in kwestie, die door de rechter gelet op
      de specifieke omstandigheden van het geval redelijk wordt geacht, of, □ b) soortgelijke criminele activiteiten van
      de schuldig bevonden persoon gepleegd tijdens een periode voor de veroordeling voor het strafbaar feit in kwestie,
      die door de rechter gelet op de specifieke omstandigheden van het geval redelijk wordt geacht, of □ c) de criminele
      activiteit van de schuldig bevonden persoon, en het is komen vast te staan dat de waarde van de voorwerpen niet
      in verhouding staat tot het legale inkomen van de schuldig bevonden persoon; □ iv) vatbaar zijn voor confiscatie
      op grond van andere rechtsvoorschriften van de beslissingsstaat betreffende ruimere confiscatiebevoegdheden.
      Indien twee of meer categorieën voor confiscatie zijn aangeduid, nadere gegevens verstrekken over welke voorwerpen
      worden geconfisqueerd met betrekking tot welke categorie: ... 2. Informatie over het (de) strafbare feit(en)
      naar aanleiding waarvan een beslissing tot confiscatie is opgelegd. 2.1. Een samenvatting van de feiten en een
      beschrijving van de omstandigheden waarin het strafbare feit/de strafbare feiten naar aanleiding waarvan een
      beslissing tot confiscatie is opgelegd, is/zijn gepleegd, inclusief tijd en plaats: ... 2.2. Aard en kwalificatie
      van het strafbare feit/de strafbare feiten naar aanleiding waarvan een beslissing tot confiscatie is opgelegd
      en de toepasselijke wetsbepaling/het toepasselijke wetboek op grond waarvan de beslissing is gegeven: ... 2.3.
      Indien van toepassing, één of meer van de onderstaande strafbare feiten aankruisen waarmee het (de) onder punt 2.2
      gespecificeerde strafbare feit(en) verband houdt (houden), indien daarop in de beslissingsstaat een vrijheidsstraf
      staat met een maximum van ten minste drie jaar: □ deelneming aan een criminele organisatie; □ terrorisme; □
      mensenhandel; □ seksuele uitbuiting van kinderen en kinderpornografie; □ illegale handel in verdovende middelen en
      psychotrope stoffen; □ illegale handel in wapens, munitie en explosieven; □ corruptie; □ fraude, met inbegrip van
      fraude waardoor de financiële belangen van de Europese Gemeenschappen worden geschaad in de zin van de Overeenkomst
      van 26 juli 1995 aangaande de bescherming van de financiële belangen van de Europese Gemeenschappen; □ witwassen
      van opbrengsten van misdrijven; □ valsemunterij, met inbegrip van namaak van de euro; □ cybercriminaliteit; □
      milieumisdrijven, met inbegrip van de illegale handel in bedreigde diersoorten en de illegale handel in bedreigde
      planten- en boomsoorten; □ medewerking aan illegale binnenkomst en illegaal verblijf; □ moord- en doodslag, zware
      mishandeling; □ illegale handel in menselijke organen en weefsels; □ ontvoering, wederrechtelijke vrijheidsberoving
      en gijzeling; □ racisme en vreemdelingenhaat; □ georganiseerde of gewapende diefstal; □ illegale handel in
      cultuurgoederen, waaronder antiquiteiten en kunstvoorwerpen; □ oplichting; □ racketeering en afpersing; □ namaak
      van producten en productpiraterij; □ vervalsing van administratieve documenten en handel in valse documenten; □
      vervalsing van betaalmiddelen; □ illegale handel in hormonale stloffen en andere groeibevorderaars; □ illegale
      handel in nucleaire en radioactieve stoffen; □ handel in gestolen voertuigen; □ verkrachting; □ opzettelijke
      brandstichting; □ misdrijven die onder de rechtsmacht van het Internationaal Strafhof vallen; □ kaping van
      vliegtuigen/schepen; 2.4. Als het (de) in punt 2.2. genoemde strafbare feit(en) naar aanleiding waarvan een
      beslissing tot confiscatie is genomen, niet onder punt 2.3 valt (vallen), een volledige beschrijving van het (de)
      strafbare feit(en) geven (deze dient betrekking te hebben op de eigenlijke criminele gedragingen in kwestie (en
      niet op bijvoorbeeld juridische kwalificaties): ...
    url: https://wetten.overheid.nl/BWBR0022793/2020-01-01#Artikel2
  - number: 2.B.j)
    text: |-
      Procedure die heeft geleid tot de beslissing tot confiscatie Gelieve te vermelden of de betrokkene in persoon is
      verschenen bij het proces dat heeft geleid tot de beslissing tot confiscatie:
    url: https://wetten.overheid.nl/BWBR0022793/2020-01-01#Artikel2
  - number: 2.B.j).1
    text: □ Ja, de betrokkene is in persoon verschenen bij het proces dat heeft geleid tot de beslissing tot confiscatie.
    url: https://wetten.overheid.nl/BWBR0022793/2020-01-01#Artikel2
  - number: 2.B.j).2
    text: |-
      □ Neen, de betrokkene is niet in persoon verschenen bij het proces dat heeft geleid tot de beslissing tot
      confiscatie.
    url: https://wetten.overheid.nl/BWBR0022793/2020-01-01#Artikel2
  - number: 2.B.j).3
    text: |-
      Indien u het vakje «neen» (keuzemogelijkheid 2) heeft aangekruist, gelieve een van de volgende gevallen te
      bevestigen:
    url: https://wetten.overheid.nl/BWBR0022793/2020-01-01#Artikel2
  - number: 2.B.j).3.□
    text: |-
      3.1a) de betrokkene is persoonlijk gedagvaard op ... (dag/maand/jaar) en is daarbij op de hoogte gebracht van het
      tijdstip en de plaats van het proces dat tot de beslissing tot confiscatie heeft geleid, en is ervan in kennis
      gesteld dat een beslissing tot confiscatie kan worden gegeven wanneer hij niet bij het proces verschijnt; OF
    url: https://wetten.overheid.nl/BWBR0022793/2020-01-01#Artikel2
  - number: 2.B.j).3.□
    text: |-
      3.1b) de betrokkene is niet persoonlijk gedagvaard, maar is anderszins daadwerkelijk officieel in kennis
      gesteld van het tijdstip en de plaats van het proces dat tot de beslissing tot confiscatie heeft geleid zodat op
      ondubbelzinnige wijze vaststaat dat hij op de hoogte was van het voorgenomen proces, en is ervan in kennis gesteld
      dat een beslissing tot confiscatie kan worden gegeven wanneer hij niet bij het proces verschijnt; OF
    url: https://wetten.overheid.nl/BWBR0022793/2020-01-01#Artikel2
  - number: 2.B.j).3.□
    text: |-
      3.2. de betrokkene was op de hoogte van het voorgenomen proces, heeft een zelf gekozen of van overheidswege
      toegewezen raadsman gemachtigd zijn verdediging bij het proces te voeren, en is bij het proces ook werkelijk door
      die raadsman verdedigd; OF
    url: https://wetten.overheid.nl/BWBR0022793/2020-01-01#Artikel2
  - number: 2.B.j).3.□
    text: |-
      3.3. nadat de beslissing tot confiscatie aan hem was betekend op ... (dag/maand/jaar) en hij uitdrukkelijk was
      geïnformeerd over zijn recht op een verzetprocedure of een procedure in hoger beroep, waarbij hij het recht heeft
      aanwezig te zijn, waarbij de zaak opnieuw ten gronde wordt behandeld en nieuw bewijsmateriaal wordt toegelaten, en
      die kan leiden tot herziening van de oorspronkelijke beslissing tot confiscatie
    url: https://wetten.overheid.nl/BWBR0022793/2020-01-01#Artikel2
  - number: 2.B.j).3.□
    text: heeft de betrokkene uitdrukkelijk te kennen gegeven dat hij de beslissing tot confiscatie niet betwist; OF
    url: https://wetten.overheid.nl/BWBR0022793/2020-01-01#Artikel2
  - number: 2.B.j).3.□
    text: heeft de betrokkene niet binnen de voorgeschreven termijn verzet of hoger beroep aangetekend.
    url: https://wetten.overheid.nl/BWBR0022793/2020-01-01#Artikel2
  - number: 2.B.j).4
    text: |-
