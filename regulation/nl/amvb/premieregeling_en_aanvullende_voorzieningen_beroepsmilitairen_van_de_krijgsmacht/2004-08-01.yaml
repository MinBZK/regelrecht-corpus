  - number: '12'
    text: 'Dit besluit wordt aangehaald als: Premieregeling en aanvullende voorzieningen beroepsmilitairen van de krijgsmacht.'
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel12
  - number: '13'
    text: |-
      Dit besluit treedt in werking op een nader door Ons te bepalen tijdstip dat per krijgsmachtdeel verschillend kan
      worden gesteld.
