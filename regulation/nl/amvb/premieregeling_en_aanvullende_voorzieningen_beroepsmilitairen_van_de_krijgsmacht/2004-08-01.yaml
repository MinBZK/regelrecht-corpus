preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Defensie, J. van Houwelingen, van 13 juli 1982, nr. P.P. 82/091/3321;

    Gelet op artikel 12 van de Militaire Ambtenarenwet 1931 (Stb. 519);

    De Raad van State gehoord (advies van 17 augustus 1982, nr. 2369/10/8231);

    Gezien het nader rapport van de Staatssecretaris voornoemd van 4 november 1982, nr. D 82/600/22342;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Voor de toepassing van dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel1
  - number: 1.a
    text: |-
      salaris het salaris, bedoeld in [artikel 1, eerste lid, onderdeel i, van het Inkomstenbesluit militairen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel1
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '1'
  - number: 1.b
    text: |-
      maand: de periode gerekend van een datum van een kalendermaand tot de overeenkomstige datum van de volgende
      kalendermaand;
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel1
  - number: 1.c
    text: |-
      militair, militair in werkelijke dienst: hetgeen daaronder wordt verstaan in [artikel 1, eerste lid onder ][ref1]
      (*Stb.* 1982, 279);


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel1
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '1'
  - number: 1.d
    text: 'Onze minister: Onze Minister van Defensie;'
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel1
  - number: 1.e
    text: |-
      verplichting: de aan een aanstelling bij het beroepspersoneel verbonden verplichting om
      gedurende een bepaalde tijd deel uit te maken van het beroepspersoneel, zoals bedoeld in
      [artikel 7 van het Algemeen militair ambtenarenreglement][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel7
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '7'
  - number: 1.f
    text: |-
      verlengde verplichting: de uit de verlenging van de tijd, waarvoor een aanstelling voor een bepaalde tijd
      is geschied voortvloeiende verplichting om deel uit te maken van het beroepspersoneel, zoals bedoeld in
      [artikel 6][ref1], eerste lid juncto [artikel 7, tweede lid van het Algemeen militair ambtenarenreglement][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel7
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '7'
  - number: '2.1'
    text: |-
      Aan de militair, die voor onbepaalde tijd wordt aangesteld bij het beroepspersoneel, kan naar bij ministeriële
      regeling te stellen regels een premie worden toegekend, die gelijk is aan ten hoogste 20% van het salaris van
      een kapitein van de Koninklijke landmacht met salarisnummer 19, berekend naar het aantal maanden van de voor de
      militair geldende verplichting.
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel2
  - number: '2.2'
    text: |-
      De in het eerste lid bedoelde militair dient de door hem genoten premie op een door Onze minister te bepalen wijze
      aan het Rijk terug te betalen indien hij, binnen het tijdvak dat op hem een verplichting rust, wordt ontslagen:
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel2
  - number: 2.2.a
    text: van rechtswege;
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel2
  - number: 2.2.b
    text: |-
      op zijn aanvraag met toepassing van [artikel 39, eerste lid, van het Algemeen militair ambtenarenreglement][ref1],
      of op grond van [artikel 39, tweede lid, onder j, k, l, m of n van dat reglement][ref2], of op grond van
      [artikel 12g, tweede lid van de Militaire ambtenarenwet 1931][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0001952#Artikel12g
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '39'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '39'
      - id: ref3
        bwb_id: BWBR0001952
        artikel: 12g
  - number: '2.3'
    text: |-
      De in het eerste lid bedoelde militair die wordt ontslagen op grond van
      [artikel 39, tweede lid, onder h, van het Algemeen militair ambtenarenreglement][ref1], verliest zijn aanspraak
      op premie.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel39
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '39'
  - number: '2.4'
    text: |-
      Onze minister kan, indien de billijkheid zulks naar zijn oordeel vordert, een militair, op wie de verplichting rust
      tot de in het tweede lid bedoelde terugbetaling, geheel of gedeeltelijk van die verplichting ontheffen.
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel2
  - number: '3.1'
    text: |-
      Aan een militair, die voor een bepaalde tijd is aangesteld bij het beroepspersoneel, wordt bij ministeriële
      regeling een premie toegekend:
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel3
  - number: 3.1.a
    text: nadat hij de bij zijn aanstelling op hem gelegde verplichting heeft volbracht;
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel3
  - number: 3.1.b
    text: nadat hij in voorkomend geval een verlengde verplichting heeft volbracht;
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel3
  - number: 3.1.c
    text: |-
      nadat hij zijn opleiding met gunstig resultaat heeft volbracht en hij niet heeft kunnen voldoen aan de uit de
      aanstelling voorvloeiende of in voorkomend geval verlengde verplichting, door een naar het oordeel van Onze
      Minister niet aan hem zelf te wijten oorzaak.
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel3
  - number: '3.2'
    text: |-
      De premie is ten minste een bedrag gelijk aan 5% van het bij de aanstelling geldende laagste salarisbedrag
      verbonden aan de rang behorende bij de functie waarvoor hij is bestemd, berekend naar het aantal maanden van de
      voor de militair geldende verplichting.
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel3
  - number: '3.3'
    text: |-
      De premie is ten hoogste een bedrag dat gelijk is aan het onder a tot en met d genoemde percentage van de
      bezoldiging behorende bij ten hoogste salarisnummer 19 van het salaris van de rang die één rang hoger is dan de
      rang die verbonden is aan de functie waarvoor hij bij aanstelling is bestemd, berekend naar het aantal maanden van
      de voor de militair geldende verplichting, te weten:
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel3
  - number: 3.3.a
    text: 'bij een verplichting van vier jaar of langer: 25%;'
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel3
  - number: 3.3.b
    text: 'bij een verplichting van drie tot vier jaar: 23%;'
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel3
  - number: 3.3.c
    text: 'bij een verplichting van twee tot drie jaar: 21%;'
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel3
  - number: 3.3.d
    text: 'bij een verplichting van minder dan twee jaar: 20%.'
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel3
  - number: '3.4'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het niet of gedeeltelijk toekennen van de
      premie.
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel3
  - number: 3a
    text: |-
      Door Onze Minister kan uitsluitend ten aanzien van bepaalde doelgroepen van militairen worden afgeweken van
      de percentages zoals genoemd in [artikel 2, eerste lid][ref1], en [artikel 3, derde lid, onder ][ref2], indien
      vaststaat dat met toepassing van laatstgenoemde percentages onvoldoende in de werving van tot deze doelgroepen
      behorende militairen kan worden voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0003538#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003538#Artikel3
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0003538
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003538
        artikel: '3'
  - number: '4.1'
    text: |-
      Een premie als bedoeld in [artikel 2][ref1] wordt uitbetaald binnen twee maanden nadat de militair met gunstig
      gevolg de opleiding heeft voltooid, waarvoor hij bij zijn aanstelling was bestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0003538#Artikel2
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003538
        artikel: '2'
  - number: '4.2'
    text: |-
      Een premie als bedoeld in [artikel 3][ref1] wordt uitbetaald nadat daarop aanspraak is ontstaan. Een voorschot op
      de premie als bedoeld in [artikel 3][ref2] kan worden uitgekeerd aan de militair die zijn initiële opleiding als
      bedoeld in [artikel 13 van het Algemeen militair ambtenarenreglement][ref3] met goed gevolg heeft afgerond: voor
      ten hoogste een kwart van de bij zijn aanstelling toegekende premie.


      [ref1]: https://wetten.overheid.nl/BWBR0003538#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003538#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003482#Artikel13
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003538
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003538
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0003482
        artikel: '13'
  - number: '5.1'
    text: |-
      Een militair die voor een bepaalde tijd bij het beroepspersoneel is aangesteld, kan, met het oog op het na zijn
      verblijf in werkelijke dienst uitoefenen van een beroep in de burgermaatschappij, naar bij ministeriële regeling
      te stellen regels, in de gelegenheid worden gesteld een bij zijn aanstelling vastgestelde burgerberoepsopleiding
      te volgen.
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel5
  - number: '5.2'
    text: |-
      De in het eerste lid bedoelde opleiding vindt plaats tijdens het verblijf in werkelijke dienst en geschiedt voor
      rekening van en, indien en voorzover dat naar het oordeel van Onze minister wenselijk en mogelijk is, door de zorg
      van het Rijk.
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel5
  - number: '5.3'
    text: |-
      Bij de regelen bedoeld in het eerste lid worden voor de onderscheidene opleidingen maximum tijdsduren vastgesteld,
      gedurende welke die opleidingen op rijkskosten kunnen worden gevolgd, met dien verstande dat deze tijdsduur nimmer
      meer kan bedragen dan vierentwintig maanden.
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel5
  - number: '5.4'
    text: De in het eerste lid bedoelde opleiding wordt in een aanhangsel bij de akte van aanstelling vermeld.
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel5
  - number: '5.5'
    text: |-
      Gedurende zes maanden na de datum van aanstelling kan, in overeenstemming tussen Onze minister en de betrokken
      militair, eenmaal wijziging in de burgerberoepsopleiding worden gebracht. Indien het dienstbelang zulks vordert kan
      ook na vorenbedoelde termijn Onze minister de burgerberoepsopleiding met instemming van de militair wijzigen. De
      voorgaande leden zijn in dat geval van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel5
  - number: '5.6'
    text: |-
      Indien de militair de burgerberoepsopleiding, als gevolg van een naar het oordeel van Onze minister niet aan
      hemzelf te wijten oorzaak, niet binnen de voor hem op grond van het derde lid vastgestelde maximum tijdsduur met
      gunstig resultaat heeft voltooid, kan Onze minister bepalen, dat bij een verlengde verplichting een gedeelte van
      die verlenging wordt bestemd voor het voltooien van de opleiding.
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel5
  - number: '5.7'
    text: |-
      De militair die door een naar het oordeel van Onze minister niet aan hemzelf te wijten oorzaak wordt ontslagen
      nadat de aan de aanstelling verbonden proeftijd is verstreken, maar voordat de - eventueel verlengde - verplichting
      is volbracht, kan op zijn aanvraag in aanmerking worden gebracht voor een tegemoetkoming ten einde de in dit
      artikel bedoelde burgerberoepsopleiding te voltooien.
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel5
  - number: '6.1'
    text: |-
      Een militair die voor een bepaalde tijd bij het beroepspersoneel is aangesteld en die, met het oog op het na
      zijn verblijf in werkelijke dienst uitoefenen van een beroep in de burgermaatschappij, tijdens zijn verblijf in
      werkelijke dienst algemeen vormend of vakonderricht volgt, kan op zijn aanvraag, naar bij ministeriële regeling te
      stellen regels, in het genot worden gesteld van faciliteiten, verband houdende met het volgen van het onderricht.
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel6
  - number: '6.2'
    text: |-
      De in het eerste lid bedoelde militair, die de uit zijn aanstelling voortvloeiende verplichting en eventueel
      verlengde verplichting heeft volbracht, kan op zijn aanvraag gedurende ten hoogste één jaar na de datum van ingang
      van zijn ontslag in het genot van de in het eerste lid bedoelde faciliteiten worden gesteld, in geval deze verband
      houden met het volgen van onderwijs.
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel6
  - number: '7'
    text: |-
      Een militair die voor een bepaalde tijd bij het beroepspersoneel is aangesteld en die de uit zijn aanstelling
      voortvloeiende verplichting heeft volbracht, of daaraan - nadat hij met gunstig resultaat zijn opleiding heeft
      voltooid - niet heeft kunnen voldoen door een naar het oordeel van Onze minister niet aan hemzelf te wijten
      oorzaak, kan op zijn aanvraag na de datum van ingang van zijn ontslag, naar bij ministeriële regeling te stellen
      regels, in het genot worden gesteld van een studietoelage, indien hij met het oog op het uitoefenen van een
      beroep in de burgermaatschappij aan een in Nederland gevestigde en erkende onderwijsinstelling niet-schriftelijk
      wetenschappelijk, algemeen vormend of vakonderricht volgt.
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel7
  - number: '8.1'
    text: |-
      Een militair die voor een bepaalde tijd is aangesteld bij het beroepspersoneel heeft, indien zijn
      plaats van tewerkstelling in Nederland, België of Duitsland is gelegen, eenmaal in de twee weken
      aanspraak op een tegemoetkoming in de kosten van het reizen ten behoeve van familiebezoek over
      een enkele reisafstand van ten hoogste 460 kilometer, met inachtneming van het bepaalde krachtens
      [artikel 25 van het Verplaatsingskostenbesluit militairen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel25
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005137
        artikel: '25'
  - number: '8.2'
    text: |-
      Indien de in het eerste lid bedoelde militair tevens aanspraak heeft op een tegemoetkoming in de reiskosten op
      grond van het [Verplaatsingskostenbesluit militairen][ref1], bestaat slechts aanspraak op de hoogste vergoeding
      per maand.


      [ref1]: https://wetten.overheid.nl/BWBR0005137
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005137
  - number: '8.3'
    text: |-
      De in dit artikel bedoelde aanspraak is niet van toepassing voor de militair die voorzieningen geniet ingevolge het
      Dienst Buitenlandse Zaken Voorzieningenstelsel (DBZV).
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel8
  - number: '9'
    text: |-
      Van de bevoegdheid tot het vaststellen van ministeriële regelingen als bedoeld in de [artikelen 2][ref1],
      [3][ref2], [5][ref3], [6][ref4] en [7][ref5] kan mandaat worden verleend aan de directeur-generaal personeel en
      materieel van het Ministerie van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0003538#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003538#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003538#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0003538#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0003538#Artikel7
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003538
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003538
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0003538
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0003538
        artikel: '6'
      - id: ref5
        bwb_id: BWBR0003538
        artikel: '7'
  - number: '10.1'
    text: |-
      Voor de militair die vóór de datum van inwerkingtreding van dit besluit, op grond van een regeling die bij
      [artikel 11, eerste lid, onder ][ref1] wordt ingetrokken, een overeenkomst heeft gesloten tot het verrichten van
      werkelijke dienst als beroepsofficier bij de zeemacht, de landmacht of de luchtmacht, blijft die overeenkomst van
      kracht onder de voorwaarden als neergelegd in de betreffende in te trekken regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003538#Artikel11
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003538
        artikel: '11'
  - number: '10.2'
    text: |-
      Voor de militair die op grond van een vóór de datum van inwerkingtreding van dit besluit gesloten verbintenis,
      onder vigeur van een regeling die bij [artikel 11, eerste lid onder ][ref1] danwel het derde lid, wordt
      ingetrokken, bij beëindiging van die verbintenis of verlengde verbintenis aanspraak kan maken op een premie of
      geldelijke uitkering danwel een renteloos krediet, blijft die aanspraak onder voorwaarden als neergelegd in de
      betreffende in te trekken regeling van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003538#Artikel11
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003538
        artikel: '11'
  - number: '10.3'
    text: |-
      Voor de militair die op grond van een vóór de datum van inwerkingtreding van dit besluit gesloten verbintenis,
      onder vigeur van een regeling die bij [artikel 11, eerste lid onder ][ref1] wordt ingetrokken, tijdens zijn
      verblijf in werkelijke dienst recht heeft op het volgen van een opleiding danwel op cursusfaciliteiten, worden deze
      voorzieningen verleend overeenkomstig dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003538#Artikel11
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003538
        artikel: '11'
  - number: '10.4'
    text: |-
      De gewezen militair die vóór de datum van inwerkingtreding van dit besluit, op grond van een regeling die bij
      [artikel 11, eerste lid onder ][ref1] wordt ingetrokken, in het genot is van een overbruggingsuitkering of - indien
      het een luchtvarende van de luchtmacht betreft - van een aanvullende overbruggingsuitkering danwel aanspraak heeft
      op cursusfaciliteiten of een studietoelage, behoudt aanspraak op die voorzieningen onder voorwaarden als neergelegd
      in de betreffende in te trekken regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003538#Artikel11
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003538
        artikel: '11'
  - number: '10.5'
    text: |-
      Voor de militair die vóór de datum van inwerkingtreding van dit besluit een verbintenis heeft
      aangegaan en die deswege aanspraak heeft verkregen op een premie op grond van een regeling die bij
      [artikel 11, eerste lid, onder ][ref1] dan wel het tweede lid wordt ingetrokken, blijft die regeling van kracht
      voor de duur van de verbintenis.


      [ref1]: https://wetten.overheid.nl/BWBR0003538#Artikel11
    url: https://wetten.overheid.nl/BWBR0003538/2004-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003538
        artikel: '11'
  - number: '10.6'
    text: |-
      Voor de militair, die vóór de datum van inwerkingtreding van dit besluit is aangesteld voor onbepaalde tijd en die
      onder vigeur van de regeling genoemd in [artikel 11, eerste lid onder ][ref1] in verband met zijn ontslag aanspraak
      zou hebben op een premie, blijft die regeling van kracht tot het tijdstip waarop hij de leeftijd van dertig jaar
      heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0003538#Artikel11
