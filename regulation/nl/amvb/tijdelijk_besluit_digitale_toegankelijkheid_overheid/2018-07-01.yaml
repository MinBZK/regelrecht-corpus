preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties van 8 februari 2018, nr.
    0000091712/CZW/SB;

    Gelet op Richtlijn (EU) 2016/2102 van het Europees Parlement en de Raad van 26 oktober 2016 inzake de
    toegankelijkheid van de websites en mobiele applicaties van overheidsinstanties (PbEU 2016, L 327) en artikel 89
    van de Grondwet;

    De Afdeling advisering van de Raad van State gehoord (advies van 6 april 2018, No.W04.18.0021/I);

    Gezien het nader rapport van Onze Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties van 00 april 2018
    nr. 0000218242/CZW/SB;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0040936/2018-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: - *content:* het geheel aan informatie dat een instantie via een website of
      mobiele applicatie wil overbrengen, waaronder tekst, downloadbare documenten en formulieren en interactie, zoals
      het verwerken van digitale formulieren en het afwikkelen van identificatieprocedures;
        - *stukken uit erfgoedcollecties:* in particulier bezit of overheidsbezit zijnde goederen die van historisch,
      artistiek, archeologisch, esthetisch, wetenschappelijk of technisch belang zijn en deel uitmaken van verzamelingen
      die worden bewaard door culturele instellingen, zoals bibliotheken, archieven en musea;
        - *mobiele applicatie:* toepassingssoftware die is ontworpen en ontwikkeld door of namens overheidsinstanties met
      het oog op gebruik door het algemene publiek op mobiele toestellen zoals smartphones en tablets. Zij omvat niet de
      besturingssoftware van die toestellen en de hardware;
        - *Onze Minister:* de Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - *overheidsinstantie:* de staats-, regionale of lokale overheidsinstanties, publiekrechtelijke instellingen
      als gedefinieerd in artikel 2, lid 1, punt 4, van Richtlijn (EU) 2014/24, of samenwerkingsverbanden bestaande
      uit één of meer van deze overheidsinstanties of één of meer van deze publiekrechtelijke instellingen, indien die
      samenwerkingsverbanden worden opgericht met het specifieke doel te voorzien in andere behoeften van algemeen belang
      dan die van industriële of commerciële aard;
        - *op tijd gebaseerde media:* media van de volgende types: louter geluid, louter videobeeld, audio-video, audio en/
      of video in combinatie met interactie;
        - *richtlijn (EU) 2016/2102:* richtlijn van het Europees Parlement en de Raad van 26 oktober 2016 inzake de
      toegankelijkheid van de websites en mobiele applicaties van overheidsinstanties (PbEU 2016, L 327);
        - *standaard EN 301 549:* verzameling van technische eisen, waaronder de WCAG 2.0 richtlijnen, toe te passen
      bij bouw en beheer van websites en mobiele applicaties, die content toegankelijk maken voor mensen met een
      functiebeperking;
        - *toegankelijk:* waarneembaar, bedienbaar, begrijpelijk en robuust;
        - *website:* verzameling samenhangende webpagina’s met content, zoals tekst, afbeeldingen of video’s.
    url: https://wetten.overheid.nl/BWBR0040936/2018-07-01#Artikel1
  - number: '2.1'
    text: 'Dit besluit is niet van toepassing op websites en mobiele applicaties van:'
    url: https://wetten.overheid.nl/BWBR0040936/2018-07-01#Artikel2
  - number: 2.1.a
    text: |-
      publieke media-instellingen bedoeld in [artikel 1.1, eerste lid van de Mediawet 2008][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel1
    url: https://wetten.overheid.nl/BWBR0040936/2018-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '1'
  - number: 2.1.b
    text: |-
      de NPO en de RPO, bedoeld in [artikel 1.1, eerste lid van de Mediawet 2008][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel1
    url: https://wetten.overheid.nl/BWBR0040936/2018-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '1'
  - number: '2.2'
    text: 'Dit besluit is niet van toepassing op de volgende content van websites en mobiele applicaties:'
    url: https://wetten.overheid.nl/BWBR0040936/2018-07-01#Artikel2
  - number: 2.2.a
    text: |-
      kantoorbestandsformaten die zijn gepubliceerd voor 23 september 2018, tenzij dergelijke content nodig is voor
      actieve administratieve processen met betrekking tot de door de betrokken overheidsinstantie vervulde taken;
    url: https://wetten.overheid.nl/BWBR0040936/2018-07-01#Artikel2
  - number: 2.2.b
    text: vooraf opgenomen, op tijd gebaseerde media die zijn gepubliceerd voor 23 september 2020;
    url: https://wetten.overheid.nl/BWBR0040936/2018-07-01#Artikel2
  - number: 2.2.c
    text: live uitgezonden, op tijd gebaseerde media;
    url: https://wetten.overheid.nl/BWBR0040936/2018-07-01#Artikel2
  - number: 2.2.d
    text: |-
      onlinekaarten en onlinekarteringsdiensten, mits essentiële informatie op navigatiekaarten op een toegankelijke,
      digitale wijze wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0040936/2018-07-01#Artikel2
  - number: 2.2.e
    text: |-
      van derden afkomstige content die niet door de betrokken overheidsinstantie wordt gefinancierd of ontwikkeld en
      evenmin onder haar verantwoordelijkheid valt;
    url: https://wetten.overheid.nl/BWBR0040936/2018-07-01#Artikel2
  - number: 2.2.f
    text: |-
      reproducties van stukken uit erfgoedcollecties die niet volledig toegankelijk kunnen worden gemaakt om redenen van
      bewaring, authenticiteit of het ontbreken van geautomatiseerde en kostenefficiënte oplossingen om toegankelijkheid
      te bewerkstelligen;
    url: https://wetten.overheid.nl/BWBR0040936/2018-07-01#Artikel2
  - number: 2.2.g
    text: |-
      content die enkel beschikbaar is voor een gesloten gebruikersgroep en die is gepubliceerd voor 23 september 2019,
      tot de betreffende website ingrijpend wordt herzien;
    url: https://wetten.overheid.nl/BWBR0040936/2018-07-01#Artikel2
  - number: 2.2.h
    text: |-
      content van websites en mobiele applicaties die niet noodzakelijk is voor actieve administratieve processen en die
      niet wordt aangepast na 23 september 2019.
    url: https://wetten.overheid.nl/BWBR0040936/2018-07-01#Artikel2
  - number: '3.1'
    text: |-
      Overheidsinstanties maken hun websites en mobiele applicaties toegankelijk door toepassing van standaard EN 301
      549. Een wijziging of vervanging van deze standaard volgens de procedure van artikel 6, eerste, tweede of vierde
      lid, van richtlijn (EU) 2016/2102 gaat voor de toepassing van dit besluit gelden met ingang van de dag waarop aan
      de betrokken wijziging uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0040936/2018-07-01#Artikel3
  - number: '3.2'
    text: |-
      Een overheidsinstantie kan afzien van toepassing van het in het eerste lid gestelde, indien en voor zover dit een
      onevenredige last met zich mee brengt.
    url: https://wetten.overheid.nl/BWBR0040936/2018-07-01#Artikel3
  - number: '3.3'
    text: |-
      Bij de beoordeling of sprake is van een onevenredige last, houdt de overheidsinstantie rekening met de relevante
      omstandigheden, waaronder:
    url: https://wetten.overheid.nl/BWBR0040936/2018-07-01#Artikel3
  - number: 3.3.a
    text: de aard, omvang en financiële middelen van de betrokken overheidsinstantie, en
    url: https://wetten.overheid.nl/BWBR0040936/2018-07-01#Artikel3
  - number: 3.3.b
    text: |-
      de geraamde kosten en baten voor de betrokken overheidsinstantie in verhouding tot de geraamde voordelen voor
      personen met een beperking, rekening houdend met de frequentie en de duur van het gebruik van de specifieke website
      of mobiele applicatie.
    url: https://wetten.overheid.nl/BWBR0040936/2018-07-01#Artikel3
  - number: '3.4'
    text: |-
      Een overheidsinstantie die van mening is dat sprake is van een onevenredige last, maakt in de in [artikel 4][ref1]
      bedoelde toegankelijkheidsverklaring kenbaar aan welke toegankelijkheidseisen niet wordt voldaan en biedt
      toegankelijke alternatieven.


      [ref1]: https://wetten.overheid.nl/BWBR0040936#Artikel4
    url: https://wetten.overheid.nl/BWBR0040936/2018-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0040936
        artikel: '4'
        hoofdstuk: '2'
  - number: '4'
    text: |-
      Overheidsinstanties publiceren op hun website of bij het downladen van een mobiele applicatie, volgens het daartoe
      door Onze Minister vastgestelde en gepubliceerde model, een actuele verklaring over de conformiteit van hun website
      of mobiele applicatie met dit besluit.
    url: https://wetten.overheid.nl/BWBR0040936/2018-07-01#Artikel4
  - number: '5.1'
    text: Onze Minister draagt zorg voor monitoring en rapportage inzake de naleving van dit besluit.
    url: https://wetten.overheid.nl/BWBR0040936/2018-07-01#Artikel5
  - number: '5.2'
    text: 'De methodiek ten behoeve van de in het eerste lid bedoelde taak omvat in ieder geval de volgende elementen:'
    url: https://wetten.overheid.nl/BWBR0040936/2018-07-01#Artikel5
  - number: 5.2.a
    text: |-
      de frequentie van onderzoek naar de mate waarin websites en mobile applicaties van overheidsinstanties toegankelijk
      zijn;
    url: https://wetten.overheid.nl/BWBR0040936/2018-07-01#Artikel5
  - number: 5.2.b
    text: het nemen van steekproeven en het doen van testen;
    url: https://wetten.overheid.nl/BWBR0040936/2018-07-01#Artikel5
  - number: 5.2.c
    text: |-
      de aanwezigheid en de inhoud van de in [artikel 4][ref1] bedoelde verklaring bij overheidsinstanties;


      [ref1]: https://wetten.overheid.nl/BWBR0040936#Artikel4
    url: https://wetten.overheid.nl/BWBR0040936/2018-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0040936
        artikel: '4'
        hoofdstuk: '2'
  - number: 5.2.d
    text: de wijze waarop naleving of niet-naleving van toegankelijkheid kan worden aangetoond;
    url: https://wetten.overheid.nl/BWBR0040936/2018-07-01#Artikel5
  - number: 5.2.e
    text: |-
      het verstrekken van informatie aan overheidsinstanties bij geconstateerde tekortkomingen teneinde deze te
      verhelpen.
    url: https://wetten.overheid.nl/BWBR0040936/2018-07-01#Artikel5
  - number: '5.3'
    text: |-
      De in het tweede lid bedoelde methodiek is gebaseerd op de methodiek die is vastgesteld op grond van artikel 8,
      tweede lid, van richtlijn (EU) 2016/2102 en gaat voor de toepassing van dit besluit gelden met ingang van de dag
      waarop aan het hanteren van de methodiek uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0040936/2018-07-01#Artikel5
  - number: '5.4'
    text: |-
      Onze Minister rapporteert volgens de regels en procedure van artikel 8, vierde tot en met zesde lid, van richtlijn
      (EU) 2016/2102.
    url: https://wetten.overheid.nl/BWBR0040936/2018-07-01#Artikel5
  - number: '6'
    text: |-
      Aan de [artikelen 3][ref1] en [4][ref2] wordt:


      [ref1]: https://wetten.overheid.nl/BWBR0040936#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0040936#Artikel4
    url: https://wetten.overheid.nl/BWBR0040936/2018-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0040936
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0040936
        artikel: '4'
        hoofdstuk: '2'
  - number: 6.a
    text: |-
      wat betreft websites die zijn gepubliceerd vanaf 23 september 2018 uiterlijk met ingang van 23 september 2019
      voldaan;
    url: https://wetten.overheid.nl/BWBR0040936/2018-07-01#Artikel6
  - number: 6.b
    text: |-
      wat betreft websites die zijn gepubliceerd voor 23 september 2018 uiterlijk met ingang van 23 september 2020
      voldaan;
    url: https://wetten.overheid.nl/BWBR0040936/2018-07-01#Artikel6
  - number: 6.c
    text: wat betreft mobiele applicaties uiterlijk 23 juni 2021 voldaan.
    url: https://wetten.overheid.nl/BWBR0040936/2018-07-01#Artikel6
  - number: '7'
    text: Dit besluit treedt in werking met ingang van 1 juli 2018.
    url: https://wetten.overheid.nl/BWBR0040936/2018-07-01#Artikel7
  - number: '8'
    text: 'Dit besluit wordt aangehaald als: Tijdelijk besluit digitale toegankelijkheid overheid.'
    url: https://wetten.overheid.nl/BWBR0040936/2018-07-01#Artikel8
