  - number: '30'
    text: |-
      1 De Advies- en Arbitragecommissie besluit bij meerderheid van stemmen.

      2 Het advies of de uitspraak moet inhouden:

      a. de namen van de deelnemers die het advies of de arbitrale uitspraak hebben aangevraagd;

      b. een overzicht van de standpunten van alle deelnemers over het onderwerp en de inhoud van het geschil;

      c. het advies dan wel de beslissing en de redenen die daaraan ten grondslag liggen.

      3 Het advies of de uitspraak wordt gedagtekend en door ieder der optredende leden en bijzondere leden van de
      Advies- en Arbitragecommissie ondertekend.

      4 De voorzitter draagt er zorg voor dat het advies of de uitspraak binnen vier weken, nadat de kennisgeving,
      bedoeld in [artikel 27][ref1], is ontvangen, aan de deelnemers aan het overleg ter kennis wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006518#Artikel27
    url: https://wetten.overheid.nl/BWBR0006518/2007-02-09#Artikel30
