  - number: '25'
    text: |-
      Indien de voorzitter dan wel één of meer van de tot de Commissie toegelaten verenigingen van ambtenaren tot
      het oordeel komen dat het overleg met de Commissie niet tot een uitkomst zal leiden die de instemming van alle
      deelnemers aan dat overleg zal hebben, brengen zij dat oordeel binnen drie dagen nadat zij daarvan in dat overleg
      blijk hebben gegeven, schriftelijk ter kennis van de overige deelnemers aan dat overleg.
    url: https://wetten.overheid.nl/BWBR0006518/2007-02-09#Artikel25
  - number: '26'
    text: |-
      1 Binnen vijf dagen na de kennisgeving, bedoeld in [artikel 25][ref1], schrijft de voorzitter een
      overlegvergadering uit. De vergadering moet worden gehouden binnen zeven dagen nadat deze is uitgeschreven.

      2 Tenzij door de voorzitter en de Commissie wordt besloten het overleg voort te zetten dan wel te beëindigen wordt
      in de vergadering nagegaan of overeenstemming bestaat over de vraag wat het onderwerp en de inhoud van het geschil
      is en of een oplossing van dat geschil zal worden gezocht door middel van voortzetting van het overleg nadat het
      advies is ingewonnen van de Advies- en Arbitragecommissie, dan wel door middel van onderwerping van het geschil aan
      een arbitrale uitspraak van de Advies- en Arbitragecommissie.

      3 Tot het inwinnen van advies is zowel de voorzitter als de Commissie bevoegd.

      4 Voor onderwerping van het geschil aan arbitrage is overeenstemming vereist tussen alle deelnemers aan het
      overleg.


      [ref1]: https://wetten.overheid.nl/BWBR0006518#Artikel25
    url: https://wetten.overheid.nl/BWBR0006518/2007-02-09#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0006518
        artikel: '25'
        hoofdstuk: II
        afdeling: '5'
  - number: '27'
    text: |-
      1 Binnen drie dagen na de vergadering, bedoeld in [artikel 26][ref1], wordt het verzoek om advies ter kennis
      gebracht van de voorzitter van de Advies- en Arbitragecommissie. Het verzoek wordt ondertekend door de deelnemers
      aan het overleg die zich voor inwinning van advies hebben uitgesproken en bevat tenminste het onderwerp en de
      inhoud van het geschil. Indien in de vergadering, bedoeld in [artikel 26][ref2], geen overeenstemming is bereikt
      tussen alle deelnemers aan het overleg over de vraag wat het onderwerp en de inhoud van het geschil is, brengen
      de overige deelnemers aan het overleg hun visie op het onderwerp en de inhoud van het geschil eveneens binnen drie
      dagen na eerdergenoemde vergadering ter kennis van de voorzitter van de Advies- en Arbitragecommissie.

      2 Het eerste lid, eerste volzin, is van overeenkomstige toepassing ten aanzien van het onderwerpen van het geschil
      aan een arbitrale uitspraak. Het verzoek daartoe wordt ondertekend door alle deelnemers aan het overleg en dient
      ten minste te bevatten:

      a. het onderwerp en de inhoud van het geschil;

      b. de standpunten van alle deelnemers aan het overleg omtrent onderwerp en inhoud van het geschil.


      [ref1]: https://wetten.overheid.nl/BWBR0006518#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0006518#Artikel26
