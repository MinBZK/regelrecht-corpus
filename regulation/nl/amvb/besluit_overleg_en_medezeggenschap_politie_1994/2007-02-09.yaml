  - number: '4'
    text: |-
      1 Het overleg staat onder leiding van Onze Minister. Onze Minister is bevoegd de leiding van het overleg op te
      dragen aan een door Onze Minister aan te wijzen ambtenaar.

      2 Indien de Commissie in meerderheid van oordeel is dat over een bepaalde aangelegenheid overleg gevoerd dient
      te worden met Onze Minister, wordt voor de behandeling van die aangelegenheid een nieuwe vergadering vastgesteld,
      onder leiding van Onze Minister.

      3 De voorzitter wordt bij het overleg terzijde gestaan door functionarissen die daartoe door Onze Minister worden
      aangewezen.

      4 Onze Minister nodigt een vertegenwoordiger van het bevoegd gezag uit tot het bijwonen van het overleg als
      waarnemer.

      5 Het secretariaat van het overleg wordt gevoerd door een door Onze Minister benoemde secretaris of daartoe
      aangewezen functionaris, die onder leiding van de voorzitter ter beschikking staat van deze, van de in het derde
      lid bedoelde functionarissen en van de leden van de Commissie. De benoeming van de secretaris of de aanwijzing van
      een functionaris daartoe geschiedt, de Commissie gehoord.

      6 Bij de behandeling van bepaalde aangelegenheden kan op uitnodiging of met toestemming van de voorzitter ook door
      anderen dan degenen die daartoe ingevolge [artikel 2][ref1] gerechtigd zijn, aan het overleg worden deelgenomen.

      7 De leden van de Commissie kunnen zich na overleg met de voorzitter ter vergadering voor de behandeling van een
      bepaald onderwerp door deskundigen laten bijstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006518#Artikel2
    url: https://wetten.overheid.nl/BWBR0006518/2007-02-09#Artikel4
    references:
      - id: ref1
