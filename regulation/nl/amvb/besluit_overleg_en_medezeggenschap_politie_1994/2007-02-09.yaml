  - number: '28'
    text: |-
      1 Met betrekking tot de samenstelling van de Advies- en Arbitragecommissie is
      [artikel 110h, eerste lid, van het ARAR][ref1], van toepassing met dien verstande dat deze commissie voor de
      behandeling van een geschil, bedoeld in [artikel 26, tweede lid][ref2], wordt uitgebreid met twee bijzondere leden.

      2 De bijzondere leden, bedoeld in het eerste lid, worden door Onze Minister benoemd voor een tijdvak van zes jaren.

      3 Van de bijzondere leden, bedoeld in het eerste lid, wordt een lid benoemd op voordracht van de voorzitter van het
      overleg met de Commissie en een lid op voordracht van de tot dat overleg toegelaten verenigingen van ambtenaren.

      4 Niet benoembaar tot bijzonder lid zijn:

      a. personen die ingevolge [artikel 110g, vierde lid, van het ARAR][ref3] zijn uitgesloten van het lidmaatschap of
      van het plaatsvervangend lidmaatschap;

      b. personen die lid of plaatsvervangend lid zijn van de Commissie, van een Regionale Commissie, de Commissie
      Korps landelijke politiediensten, de Commissie bijzondere ambtenaren van politie, de Commissie LSOP of de de
      desbetreffende Commissie voorziening tot samenwerking dan wel van wie dit lidmaatschap of plaatsvervangend
      lidmaatschap nog niet langer dan twee jaar is beëindigd.

      5 Overeenkomstig de aan de leden en de plaatsvervangende leden te verlenen vergoedingen worden aan de bijzondere
      leden uit 's Rijks kas vergoedingen voor reis- en verblijfkosten verleend volgens de regelen welke voor de
      vergoeding voor reis- en verblijfkosten wegens reizen voor 's Rijks dienst gelden.

      6 Onze Minister benoemt tevens twee plaatsvervangende bijzondere leden. Het tweede lid tot en met vijfde lid, zijn
      van overeenkomstige toepassing.

      7 Indien het verzoek om arbitrage naar het oordeel van de voorzitter eenzelfde geschil betreft als waarover door
      de Advies- en Arbitragecommissie reeds advies is uitgebracht, treedt voor een lid die bij het uitbrengen van dat
      advies betrokken was, diens plaatsvervanger op.


