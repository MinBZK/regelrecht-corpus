        artikel: '27'
        hoofdstuk: II
        afdeling: '5'
  - number: '31'
    text: Binnen twee weken na ontvangst van het advies wordt het overleg over het geschil voortgezet.
    url: https://wetten.overheid.nl/BWBR0006518/2007-02-09#Artikel31
  - number: '32'
    text: De uitspraak van de Advies- en Arbitragecommissie heeft bindende kracht.
    url: https://wetten.overheid.nl/BWBR0006518/2007-02-09#Artikel32
  - number: '63'
    text: |-
      1 Onze Minister kan, in overeenstemming met de Commissie, besluiten het overleg met de Regionale Commissies, de
      Commissie Korps landelijke politiediensten, de Commissie bijzondere ambtenaren van politie, de Commissie LSOP
      en de Commissie ITO, bedoeld in respectievelijk de [afdelingen 2][ref1], [3][ref2], [4][ref3], [4A][ref4] en
      [4 B van hoofdstuk II][ref5], op te schorten.

      2 Onze Minister kan, in overeenstemming met de Commissie, bij het besluit om het overleg op te schorten tevens
      bepalen dat over de in voormelde afdelingen bedoelde aangelegenheden van algemeen belang voor de rechtstoestand van
      de ambtenaar, overlegd zal worden, overeenkomstig het bepaalde in [afdeling 1][ref6], met voormelde Commissie.


