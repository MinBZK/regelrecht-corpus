  - number: '15'
    text: |-
      De verenigingen van ambtenaren die vertegenwoordigd zijn in de Regionale Commissie stellen de korpsbeheerder
      jaarlijks in kennis van het ledental in het betreffende regionaal politiekorps. De verenigingen van ambtenaren
      die niet tevens in de Commissie zijn vertegenwoordigd, doen aan de korpsbeheerders bovendien mededeling van hun
      statuten en huishoudelijke reglementen en van de daarin aangebrachte wijzigingen.
    url: https://wetten.overheid.nl/BWBR0006518/2007-02-09#Artikel15
  - number: '16'
    text: |-
      1 De in [artikel 13, eerste lid][ref1], bedoelde aangelegenheden worden door de voorzitter op de agenda van het
      overleg met de Regionale Commissie geplaatst.

      2 Elke tot de Regionale Commissie toegelaten vereniging van ambtenaren is bevoegd aan de voorzitter van het
      overleg met de Regionale Commissie bepaalde tot de competentie van de Regionale Commissie behorende onderwerpen ter
      plaatsing op de agenda op te geven.

      3 Indien bij de behandeling van een aangelegenheid in het overleg met de Regionale Commissie blijkt dat zij niet
      uitsluitend het betrokken regionaal politiekorps regardeert, wordt zij verwezen naar het overleg met de Commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0006518#Artikel13
    url: https://wetten.overheid.nl/BWBR0006518/2007-02-09#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006518
        artikel: '13'
        hoofdstuk: II
        afdeling: '2'
  - number: '17'
    text: |-
      1 Het overleg wordt gevoerd op plaats, dag en uur door de voorzitter te bepalen.

      2 Indien de vertegenwoordigers van ten minste twee tot het overleg toegelaten verenigingen van ambtenaren de
      voorzitter, onder vermelding van hetgeen zij behandeld wensen te zien, verzoeken daartoe een vergadering uit te
      schrijven, vindt deze binnen 14 dagen plaats.

      3 De korpsbeheerder verleent zijn bemiddeling om aan de Regionale Commissie een lokaliteit ter beschikking te
      stellen, indien de Commissie daartoe een verzoek doet, ten behoeve van een door haar te houden vergadering.
    url: https://wetten.overheid.nl/BWBR0006518/2007-02-09#Artikel17
  - number: '18'
    text: |-
      1 Indien het wenselijk blijkt voorbereidende besprekingen te voeren of in de Regionale Commissie genomen besluiten
      uit te werken, geschiedt dit door werkgroepen, bestaande uit vertegenwoordigers van de Regionale Commissie en door
      de korpsbeheerder daartoe aangewezen functionarissen.

      2 [Artikel 14, vijfde en zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006518#Artikel14
    url: https://wetten.overheid.nl/BWBR0006518/2007-02-09#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006518
        artikel: '14'
        hoofdstuk: II
        afdeling: '2'
  - number: '19'
    text: |-
      1 Het standpunt van de Regionale Commissie wordt bepaald bij eenvoudige meerderheid van stemmen. Elke vereniging
      van ambtenaren brengt één stem uit. Indien de stemmen binnen de Regionale Commissie staken, beslist de voorzitter
      van het overleg met die Regionale Commissie of het voorstel ten uitvoer worden gebracht.

      2 Het standpunt van de Regionale Commissie over in het overleg besproken aangelegenheden wordt schriftelijk aan
      de korpsbeheerder en aan de voorzitter van het overleg, bedoeld in [artikel 2, eerste lid][ref1], meegedeeld. De
      Regionale Commissie geeft desverlangd een samenvatting van de aan het standpunt ten grondslag liggende argumenten.

      3 Indien in de Regionale Commissie een minderheidsstandpunt blijkt te bestaan, wordt daarvan desverlangd in de in
      het tweede lid bedoelde geschriften melding gemaakt.

      4 Indien over een aangelegenheid wordt beslist in afwijking van het standpunt van de meerderheid van de leden
      van de Regionale Commissie, worden de redenen van die afwijking zo spoedig mogelijk ter kennis van de Regionale
      Commissie gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006518#Artikel2
    url: https://wetten.overheid.nl/BWBR0006518/2007-02-09#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006518
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: '20'
    text: |-
      1 Van het in de vergaderingen van het overleg en de werkgroepen behandelde maakt de secretaris notulen. Bovendien
      kan op verzoek van de leden van de Regionale Commissie of van de voorzitter van het overleg een verslag worden
      opgemaakt bevattende een beknopte samenvatting van het behandelde in het overleg met de Regionale Commissie, voor
      zover dat voor openbaarmaking geschikt kan worden geacht.

      2 Na overleg met de Regionale Commissie dan wel de door deze in de betrokken werkgroep aangewezen leden, kan de
      voorzitter ten aanzien van het in vorenbedoelde vergaderingen behandelde geheimhouding opleggen.

      3 De plicht tot geheimhouding geldt niet voor zover de leden van de Regionale Commissie dan wel de door haar in
      de betrokken werkgroep aangewezen leden in bespreking treden met de door hen vertegenwoordigde verenigingen of de
      Centrales waarbij hun verenigingen zijn aangesloten.
    url: https://wetten.overheid.nl/BWBR0006518/2007-02-09#Artikel20
  - number: '21'
    text: |-
      1 Er is een Commissie Korps landelijke politiediensten.

      2 Over aangelegenheden van algemeen belang voor de rechtstoestand van de ambtenaar, met inbegrip van de algemene
      regels volgens welke het personeelsbeleid zal worden gevoerd, die uitsluitend het Korps landelijke politiediensten
      betreffen en bovendien niet ontleend zijn aan noch vergelijkbaar zijn met een aangelegenheid als bedoeld in
      [artikel 3, eerste lid][ref1], wordt niet beslist dan nadat daarover door of namens Onze Minister overleg is
      gepleegd met de Commissie Korps landelijke politiediensten.

      3 Het tweede lid blijft buiten toepassing:

      a. met betrekking tot bij of krachtens de wet gegeven regels over aangelegenheden waarover overleg is gepleegd met
      de Commissie indien die regels onverkort van toepassing zijn op de ambtenaar;

      b. indien Onze Minister overleg met de Commissie wenselijk acht of de voorzitter van het overleg met de Commissie
      Korps landelijke politiediensten dan wel één van de leden van de Commissie Korps landelijke politiediensten aan
      Onze Minister kenbaar maakt dat overleg te wensen.

      4 Het in het derde lid, onder *b*, bedoelde overleg met de Commissie vindt eerst plaats nadat zij het standpunt van
      de Commissie Korps landelijke politiediensten terzake in afschrift heeft ontvangen.

      5 Een voorstel strekkende tot invoering of wijziging van een regeling met rechten of verplichtingen van individuele
      ambtenaren, die een uitwerking is van een voorstel waarover in het in [artikel 2, eerste lid][ref2], bedoelde
      overleg overeenstemming is bereikt, wordt slechts ten uitvoer gebracht indien daarover overeenstemming bestaat met
      de Commissie Korps landelijke politiediensten.

      6 Het overleg met de Commissie Korps landelijke politiediensten vindt plaats overeenkomstig de
      [artikelen 12 tot en met 20][ref3], met dien verstande dat:

      a. voor de toepassing van deze afdeling wordt verstaan onder:

      1e. regionaal politiekorps: het Korps landelijke politiediensten;

      2e. Regionale Commissie: de Commissie Korps landelijke politiediensten;

      3e. korpsbeheerder: Onze Minister;

      b. Onze Minister de voorzitter en de plaatsvervangend voorzitter van het overleg met de Commissie Korps landelijke
      politiediensten aanwijst.


      [ref1]: https://wetten.overheid.nl/BWBR0006518#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006518#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006518#Artikel12
