  - number: '13'
    text: |-
      1 Over aangelegenheden van algemeen belang voor de rechtstoestand van de ambtenaar, met inbegrip van de algemene
      regels volgens welke het personeelsbeleid zal worden gevoerd, die uitsluitend het regionaal politiekorps
      betreffen en bovendien niet ontleend zijn aan noch vergelijkbaar zijn met een aangelegenheid als bedoeld in
      [artikel 3, eerste lid][ref1], wordt niet beslist dan nadat daarover door of namens de korpsbeheerder overleg is
      gepleegd met de Regionale Commissie.

      2 Het eerste lid blijft buiten toepassing:

      a. met betrekking tot bij of krachtens de wet gegeven regels over aangelegenheden waarover overleg is gepleegd met
      de Commissie indien die regels onverkort van toepassing zijn op de ambtenaar;

      b. indien Onze Minister overleg met de Commissie wenselijk acht of de voorzitter van het overleg met de Regionale
      Commissie dan wel één van de leden van de Regionale Commissie aan Onze Minister kenbaar maakt dat overleg te
      wensen.

      3 Het in het tweede lid, onder *b*, bedoelde overleg met de Commissie vindt eerst plaats nadat zij het standpunt
      van de Regionale Commissie ter zake in afschrift heeft ontvangen.

      4 Een voorstel strekkende tot invoering of wijziging van een regeling met rechten of verplichtingen van individuele
      ambtenaren, die een uitwerking is van een voorstel waarover in het in [artikel 2, eerste lid][ref2], bedoelde
      overleg overeenstemming is bereikt, wordt slechts ten uitvoer gebracht indien daarover overeenstemming bestaat met
      de Regionale Commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0006518#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006518#Artikel2
