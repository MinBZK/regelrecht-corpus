  - number: '14'
    text: |-
      1 Het overleg staat onder voorzitterschap van de korpsbeheerder.

      2 De korpsbeheerder wijst een lid van het regionaal college, bedoeld in [artikel 22 van de Politiewet 1993][ref1],
      als plaatsvervangend voorzitter aan.

      3 De voorzitter wordt bij het overleg terzijde gestaan door functionarissen die daartoe door de korpsbeheerder
      worden aangewezen.

      4 Het secretariaat van het overleg wordt gevoerd door een door de korpsbeheerder benoemde secretaris of daartoe
      aangewezen functionaris, die onder leiding van de voorzitter ter beschikking staat van deze, van de in het derde
      lid bedoelde functionarissen en van de leden van de Regionale Commissie. De benoeming van de secretaris of de
      aanwijzing van een functionaris daartoe geschiedt, de Regionale Commissie gehoord.

      5 Bij de behandeling van bepaalde aangelegenheden kan op uitnodiging of met toestemming van de voorzitter ook door
      anderen dan degenen die daartoe ingevolge [artikel 12][ref2] gerechtigd zijn, aan het overleg worden deelgenomen.

      6 De leden van de Regionale Commissie kunnen zich na overleg met de voorzitter ter vergadering voor de behandeling
      van een bepaald onderwerp door deskundigen laten bijstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0006518#Artikel12
