articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      b. regionaal politiekorps: een regionaal politiekorps als bedoeld in [artikel 21 van de Politiewet 1993][ref1];

      c. Korps landelijke politiediensten: het Korps landelijke politiediensten, bedoeld in
      [artikel 38 van de Politiewet 1993][ref2];

      d. Het LSOP: het Landelijk selectie- en opleidingsinstituut politie, bedoeld in [artikel 2 van het LSOP-wet][ref3];

      e. voorziening tot samenwerking: een publiekrechtelijke rechtspersoon als bedoeld in
      [artikel 47a, eerste lid, van de Politiewet 1993][ref4];

      f. ambtenaar: de ambtenaar, bedoeld in
      [artikel 1, onderdeel h, van het Besluit algemene rechtspositie politie][ref5];

      g. bevoegd gezag:

      1°. de korpsbeheerder, voor zover het betreft de ambtenaar die werkzaam is bij een regionaal politiekorps.

      2°. Onze Minister, voor zover het betreft de ambtenaar die werkzaam is bij het Korps landelijke politiediensten;

      3°. Onze Minister van Justitie, voor zover het betreft de bijzondere ambtenaar van politie;

      4°. de bestuursraad van het LSOP, voor zover het betreft het LSOP;

      5°. het algemeen bestuur van een voorziening tot samenwerking, voor zover het betreft de ambtenaren aangesteld bij
      de desbetreffende voorziening tot samenwerking;

      h. korpschef: de korpschef, bedoeld in [artikel 24][ref6] onderscheidenlijk
      [artikel 38 van de Politiewet 1993][ref7];

      i. Centrale: een centrale van overheidspersoneel als bedoeld in
      [artikel 1 van de Regeling overleg Raad voor het Overheidspersoneelsbeleid][ref8];

      j. Commissie: de Commissie voor georganiseerd overleg in politie-ambtenarenzaken, bedoeld in [artikel 2][ref9];

      k. Regionale Commissie: de Regionale Commissie voor georganiseerd overleg in politie-ambtenarenzaken in het
      regionaal politiekorps, bedoeld in [artikel 12][ref10];

      l. Commissie Korps landelijke politiediensten: de Commissie voor georganiseerd overleg in politie-ambtenarenzaken
      in het Korps landelijke politiediensten, bedoeld in [artikel 21][ref11].

      m. Commissie bijzondere ambtenaren van politie: de Commissie voor georganiseerd overleg in politie-ambtenarenzaken
      ten behoeve van de bijzondere ambtenaren van politie, bedoeld in [artikel 22][ref12];

      n. Commissie LSOP: de Commissie voor georganiseerd overleg in politie-ambtenarenzaken ten behoeve van de ambtenaren
      van het LSOP, bedoeld in [artikel 22a][ref13];

      o. Commissie voorziening tot samenwerking: de Commissie voor georganiseerd overleg in politieambtenarenzaken ten
      behoeve van de ambtenaren werkzaam bij een voorziening tot samenwerking, bedoeld in [artikel 22b][ref14];

      p. Pensioenreglement: het Pensioenreglement van de Stichting Pensioenfonds ABP;

      q. Stichting Pensioenfonds ABP: de Stichting Pensioenfonds ABP, bedoeld in
      [artikel 6 van de Wet privatisering ABP][ref15];

      r. AFUP-opbouwreglement: het reglement bedoeld in artikel 2.4b, tweede lid, van het pensioenreglement;

      s. AFUP: de in het AFUP-opbouwreglement neergelegde regeling.


