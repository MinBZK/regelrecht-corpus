  - number: '2'
    text: |-
      1 Er is een Commissie voor georganiseerd overleg in politie-ambtenarenzaken.

      2 De Commissie bestaat uit vertegenwoordigers van:

      a. de Algemene Centrale van Overheidspersoneel (ACOP), vertegenwoordigd door de Nederlandse Politiebond (NPB);

      b. de Christelijke Centrale van Overheids- en Onderwijzend personeel (CCOOP), vertegenwoordigd door de Algemeen
      Christelijke Politiebond (ACP);

      c. het Ambtenarencentrum (AC), vertegenwoordigd door de Algemene Nederlandse Politievereniging (ANPV);

      d. de Centrale van Middelbare en Hogere Functionarissen bij Overheid, Onderwijs, Bedrijven en Instellingen (CMHF),
      vertegenwoordigd door de Vereniging van Middelbare en Hogere Politie-ambtenaren (VMHP);

      e. andere bij koninklijk besluit tot het overleg toegelaten verenigingen van ambtenaren die eveneens representatief
      zijn, onder meer gelet op het aantal ambtenaren dat zij vertegenwoordigen, en die aangesloten zijn bij een Centrale
      die zich door haar doet vertegenwoordigen en tegen wier toelating het algemeen belang zich niet verzet.

      3 Elke vereniging van ambtenaren, genoemd in het tweede lid, is bevoegd tot aanwijzing van twee leden en twee
      plaatsvervangende leden van de Commissie. Indien verschillende verenigingen van ambtenaren zijn aangesloten bij
      dezelfde Centrale, zijn deze verenigingen slechts gezamenlijk bevoegd tot aanwijzing van vertegenwoordigers.

      4 Wij behouden Ons voor een toelating tot het overleg krachtens het tweede lid te schorsen en een toelating tot het
      overleg krachtens het tweede lid, onder *e*, in te trekken, indien naar Ons oordeel de vereniging van ambtenaren
      niet meer representatief is, dan wel indien het algemeen belang zich tegen haar verdere toelating verzet.

      5 Schorsing onderscheidenlijk intrekking van de toelating van een Centrale tot de Raad voor het
      Overheidspersoneelsbeleid heeft van rechtswege ten gevolge schorsing onderscheidenlijk intrekking van de toelating
      tot de Commissie van de bij haar aangesloten vereniging van ambtenaren.
    url: https://wetten.overheid.nl/BWBR0006518/2007-02-09#Artikel2
  - number: '3'
    text: |-
      1 Over aangelegenheden van algemeen belang voor de rechtstoestand van de ambtenaar, met inbegrip van de algemene
      regels volgens welke het personeelsbeleid zal worden gevoerd, wordt niet beslist dan nadat daarover door of namens
      Onze Minister overleg is gepleegd met de Commissie.

      2 Het eerste lid blijft buiten toepassing met betrekking tot regelingen, bedoeld in
      [artikel 1 van de Regeling overleg Raad voor het Overheidspersoneelsbeleid][ref1].

      3 Een voorstel strekkende tot invoering of wijziging van een regeling met rechten of verplichtingen van individuele
      ambtenaren, wordt slechts ten uitvoer gebracht, indien daarover overeenstemming bestaat met de Commissie. Indien
      de stemmen binnen de Commissie staken beslist de voorzitter van het overleg met de Commissie of het voorstel ten
      uitvoer wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0008494#Artikel1
