  - number: '22'
    text: |-
      1 Er is een Commissie bijzondere ambtenaren van politie.

      2 Over aangelegenheden van algemeen belang voor de rechtstoestand van de ambtenaar, met inbegrip van de algemene
      regels volgens welke het personeelsbeleid zal worden gevoerd, die uitsluitend de bijzondere ambtenaren van politie
      betreffen en bovendien niet ontleend zijn aan noch vergelijkbaar zijn met een aangelegenheid als bedoeld in
      [artikel 3, eerste lid][ref1], wordt niet beslist dan nadat daarover door of namens Onze Minister van Justitie
      overleg is gepleegd met de Commissie bijzondere ambtenaren van politie.

      3 Het tweede lid blijft buiten toepassing:

      a. met betrekking tot bij of krachtens de wet gegeven regels over aangelegenheden waarover overleg is gepleegd met
      de Commissie indien die regels onverkort van toepassing zijn op de ambtenaar;

      b. indien Onze Minister overleg met de Commissie wenselijk acht of de voorzitter van het overleg met de Commissie
      bijzondere ambtenaren van politie dan wel één van de leden van de Commissie bijzondere ambtenaren van politie aan
      Onze Minister kenbaar maakt dat overleg te wensen.

      4 Het in het derde lid, onder *b*, bedoelde overleg met de Commissie vindt eerst plaats nadat zij het standpunt van
      de Commissie bijzondere ambtenaren van politie terzake in afschrift heeft ontvangen.

      5 Een voorstel strekkende tot invoering of wijziging van een regeling met rechten of verplichtingen van individuele
      ambtenaren, die een uitwerking is van een voorstel waarover in het in [artikel 2, eerste lid][ref2], bedoelde
      overleg overeenstemming is bereikt, wordt slechts ten uitvoer gebracht indien daarover overeenstemming bestaat met
      de Commissie bijzondere ambtenaren van politie.

      6 Het overleg met de Commissie bijzondere ambtenaren van politie vindt plaats overeenkomstig de
      [artikelen 12 tot en met 20][ref3], met dien verstande dat:

      a. voor de toepassing van deze afdeling wordt verstaan onder:

      1e. regionaal politiekorps: het organisatie-onderdeel waarin de bijzondere ambtenaren van politie werkzaam zijn;

      2e. Regionale Commissie: de Commissie bijzondere ambtenaren van politie;

      3e. korpsbeheerder: Onze Minister van Justitie;

      b. Onze Minister van Justitie de voorzitter en de plaatsvervangend voorzitter van het overleg met de Commissie
      bijzondere ambtenaren van politie aanwijst.


      [ref1]: https://wetten.overheid.nl/BWBR0006518#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006518#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006518#Artikel12
