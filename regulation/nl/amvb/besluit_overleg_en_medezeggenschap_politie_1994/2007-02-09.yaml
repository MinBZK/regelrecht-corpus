      1 Deze afdeling is van toepassing op geschillen inzake aangelegenheden als bedoeld in
      [artikel 3, eerste lid][ref1].

      2 Deze afdeling is van overeenkomstige toepassing op geschillen inzake aangelegenheden als bedoeld in
      [artikel 13, eerste lid][ref2], met dien verstande dat onder Commissie wordt verstaan: de Regionale Commissie.

      3 Deze afdeling is van overeenkomstige toepassing op geschillen inzake aangelegenheden als bedoeld in
      [artikel 21, tweede lid][ref3], met dien verstande dat onder Commissie wordt verstaan: de Commissie Korps
      landelijke politiediensten.

      4 Deze afdeling is van overeenkomstige toepassing op geschillen inzake aangelegenheden als bedoeld in
      [artikel 22, tweede lid][ref4], met dien verstande dat onder Commissie wordt verstaan: de Commissie bijzondere
      ambtenaren van politie.

      5 Deze afdeling is van overeenkomstige toepassing op geschillen inzake aangelegenheden als bedoeld in
      [artikel 22][ref5], met dien verstande dat onder de Commissie wordt verstaan: de Commissie LSOP.

      6 Deze afdeling is van overeenkomstige toepassing op geschillen inzake aangelegenheden als bedoeld in
      [artikel 22b][ref6], met dien verstande dat onder de de Commissie wordt verstaan: de desbetreffende Commissie
      voorziening tot samenwerking.


