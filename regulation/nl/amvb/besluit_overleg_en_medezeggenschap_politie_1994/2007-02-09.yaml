        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: '5'
    text: |-
      De verenigingen van ambtenaren die vertegenwoordigd zijn in de Commissie, doen aan Onze Minister en aan de
      voorzitter van het overleg met de Commissie mededeling van hun statuten en huishoudelijke reglementen en van de
      daarin aangebrachte wijzigingen. Zij stellen dezen voorts jaarlijks in kennis van het ledental.
    url: https://wetten.overheid.nl/BWBR0006518/2007-02-09#Artikel5
  - number: '6'
    text: |-
      1 De in [artikel 3, eerste lid][ref1], bedoelde aangelegenheden worden door de voorzitter op de agenda van het
      overleg met de Commissie geplaatst.

      2 Elke tot de Commissie toegelaten vereniging van ambtenaren is bevoegd aan de voorzitter van het overleg met
      de Commissie bepaalde tot de competentie van de Commissie behorende onderwerpen ter plaatsing op de agenda op te
      geven.


      [ref1]: https://wetten.overheid.nl/BWBR0006518#Artikel3
    url: https://wetten.overheid.nl/BWBR0006518/2007-02-09#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006518
        artikel: '3'
        hoofdstuk: II
        afdeling: '1'
  - number: '7'
    text: |-
      1 Het overleg wordt gevoerd op plaats, dag en uur door de voorzitter te bepalen.

      2 De vergaderingen vinden in de regel te 's-Gravenhage plaats.

      3 Indien de vertegenwoordigers van ten minste twee tot het overleg toegelaten verenigingen van ambtenaren de
      voorzitter, onder vermelding van hetgeen zij behandeld wensen te zien, verzoeken daartoe een vergadering uit te
      schrijven, vindt deze binnen 14 dagen plaats.
    url: https://wetten.overheid.nl/BWBR0006518/2007-02-09#Artikel7
  - number: '8'
    text: |-
      Onze Minister verleent zijn bemiddeling om aan de Commissie een lokaliteit in een rijksgebouw ter beschikking te
      stellen, indien de Commissie daartoe een verzoek doet, ten behoeve van een door haar te houden vergadering.
    url: https://wetten.overheid.nl/BWBR0006518/2007-02-09#Artikel8
  - number: '9'
    text: |-
      1 Indien het wenselijk blijkt voorbereidende besprekingen te voeren of in de Commissie genomen besluiten uit te
      werken, geschiedt dit door werkgroepen, bestaande uit vertegenwoordigers van de Commissie en door Onze Minister
      daartoe aangewezen functionarissen.

      2 [Artikel 4, zesde en zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006518#Artikel4
    url: https://wetten.overheid.nl/BWBR0006518/2007-02-09#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006518
        artikel: '4'
        hoofdstuk: II
        afdeling: '1'
  - number: '10'
    text: |-
      1 Het standpunt van de Commissie wordt bepaald bij eenvoudige meerderheid van stemmen. Elke vereniging van
      ambtenaren brengt één stem uit. Indien de stemmen binnen de Commissie staken beslist de voorzitter van het overleg
      met de Commissie of het voorstel ten uitvoer wordt gebracht.

      2 Het standpunt van de Commissie over in het overleg besproken aangelegenheden wordt schriftelijk aan Onze Minister
      meegedeeld. De Commissie geeft desverlangd een samenvatting van de aan het standpunt ten grondslag liggende
      argumenten.

      3 Indien in de Commissie een minderheidsstandpunt blijkt te bestaan, wordt daarvan desverlangd in de in het tweede
      lid bedoelde geschriften melding gemaakt.

      4 Indien over een aangelegenheid wordt beslist in afwijking van het standpunt van de meerderheid van de leden van
      de Commissie, worden de redenen van die afwijking zo spoedig mogelijk ter kennis van de Commissie gebracht.
    url: https://wetten.overheid.nl/BWBR0006518/2007-02-09#Artikel10
  - number: '11'
    text: |-
      1 Van het in de vergaderingen van het overleg en de werkgroepen behandelde maakt de secretaris notulen.

      Bovendien kan op verzoek van de leden van de Commissie of van de voorzitter van het overleg een verslag worden
      opgemaakt bevattende een beknopte samenvatting van het behandelde in het overleg met de Commissie, voor zover dat
      voor openbaarmaking geschikt kan worden geacht.

      2 Na overleg met de Commissie dan wel de door deze in de betrokken werkgroep aangewezen leden, kan de voorzitter
      ten aanzien van het in vorenbedoelde vergaderingen behandelde geheimhouding opleggen.

      3 De plicht tot geheimhouding geldt niet voor zover de leden van de Commissie dan wel de door haar in de betrokken
      werkgroep aangewezen leden in bespreking treden met de door hen vertegenwoordigde verenigingen of de Centrales
      waarbij hun verenigingen zijn aangesloten.
    url: https://wetten.overheid.nl/BWBR0006518/2007-02-09#Artikel11
  - number: '12'
    text: |-
      1 Er is een Regionale Commissie voor georganiseerd overleg in politie-ambtenarenzaken in ieder regionaal
      politiekorps.

      2 De Regionale Commissie bestaat uit vertegenwoordigers van:

      a. de verenigingen van ambtenaren, bedoeld in [artikel 2, tweede lid, onder a tot en met d][ref1];

      b. andere door de korpsbeheerder tot het overleg toegelaten verenigingen van ambtenaren die eveneens representatief
      zijn, onder meer gelet op het aantal ambtenaren dat zij vertegenwoordigen en welke aangesloten zijn bij een
      Centrale en tegen wier toelating het algemeen belang zich niet verzet.

      3 Elke vereniging van ambtenaren, bedoeld in het tweede lid, is bevoegd tot aanwijzing van twee leden en
      twee plaatsvervangende leden van de Regionale Commissie. Indien verschillende verenigingen van ambtenaren
      zijn aangesloten bij dezelfde Centrale, zijn deze verenigingen slechts gezamenlijk bevoegd tot aanwijzing van
      vertegenwoordigers.

      4 De korpsbeheerder kan een toelating tot het overleg krachtens het tweede lid schorsen en een toelating tot het
      overleg krachtens het tweede lid, onder b, intrekken, indien naar zijn oordeel de vereniging van ambtenaren niet
      meer representatief is, dan wel indien het algemeen belang zich tegen haar verdere toelating verzet.

      5 Schorsing onderscheidenlijk intrekking van de toelating tot de Commissie van een vereniging van ambtenaren heeft
      van rechtswege ten gevolge schorsing onderscheidenlijk intrekking van de toelating tot de Regionale Commissie.

      6 In afwijking van het tweede lid kan Onze Minister, de Commissie gehoord, bepalen dat ook verenigingen van
      ambtenaren die niet zijn aangesloten bij een Centrale, tot de Regionale Commissie worden toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0006518#Artikel2
    url: https://wetten.overheid.nl/BWBR0006518/2007-02-09#Artikel12
