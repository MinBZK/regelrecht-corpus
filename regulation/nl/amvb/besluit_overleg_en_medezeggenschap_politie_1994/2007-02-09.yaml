  - number: '29'
    text: |-
      Voor zover de samenstelling van de Advies- en Arbitragecommissie overeenkomstig
      [artikel 28, eerste of tweede lid][ref1], daartoe aanleiding geeft stelt zij nadere regels vast met betrekking tot
      haar werkwijze.


