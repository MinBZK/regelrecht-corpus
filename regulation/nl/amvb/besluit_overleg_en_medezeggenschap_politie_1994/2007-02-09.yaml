  - number: 22b
    text: |-
      1 Er is een Commissie voorziening tot samenwerking voor elke voorziening tot samenwerking.

      2 Over aangelegenheden van algemeen belang voor de rechtstoestand van de ambtenaar, met inbegrip van de algemene
      regels volgens welke het personeelsbeleid zal worden gevoerd, die uitsluitend de ambtenaren van een voorziening
      tot samenwerking betreffen en bovendien niet ontleend zijn aan noch vergelijkbaar zijn met een aangelegenheid
      als bedoeld in [artikel 3, eerste lid][ref1], wordt niet beslist dan nadat daarover door of namens het algemeen
      bestuur van een voorziening tot samenwerking overleg is gepleegd met de desbetreffende Commissie voorziening tot
      samenwerking.

      3 Het tweede lid blijft buiten toepassing:

      a. met betrekking tot bij of krachtens de wet gegeven regels over aangelegenheden waarover overleg is gepleegd met
      de Commissie indien die regels onverkort van toepassing zijn op de ambtenaar;

      b. indien het algemeen bestuur van een voorziening tot samenwerking overleg met de Commissie wenselijk acht of de
      voorzitter van het overleg met de desbetreffende Commissie voorziening tot samenwerking dan wel één van de leden
      van de desbetreffende Commissie voorziening tot samenwerking aan het algemeen bestuur van een voorziening tot
      samenwerking kenbaar maakt dat overleg te wensen.

      4 Het in het derde lid, onder b, bedoelde overleg met de Commissie vindt eerst plaats nadat zij het standpunt van
      de desbetreffende Commissie voorziening tot samenwerking terzake in afschrift heeft ontvangen.

      5 Een voorstel strekkende tot invoering of wijziging van een regeling met rechten of verplichtingen van individuele
      ambtenaren, die een uitwerking is van een voorstel waarover in het in [artikel 2, eerste lid][ref2], bedoelde
      overleg overeenstemming is bereikt, wordt slechts ten uitvoer gebracht indien daarover overeenstemming bestaat met
      de desbetreffende Commissie voorziening tot samenwerking.

      6 Het overleg met de desbetreffende Commissie voorziening tot samenwerking vindt plaats overeenkomstig de
      [artikelen 12 tot en met 20][ref3], met dien verstande dat:

      a. voor de toepassing van deze afdeling wordt verstaan onder:

      1e. regionaal politiekorps: een voorziening tot samenwerking;

      2e. Regionale Commissie: de desbetreffende Commissie voorziening tot samenwerking;

      3e. korpsbeheerder: het algemeen bestuur van een voorziening tot samenwerking;

      b. het algemeen bestuur van een voorziening tot samenwerking de voorzitter en de plaatsvervangend voorzitter van
      het overleg met de desbetreffende Commissie voorziening tot samenwerking aanwijst.


