  - number: '4'
    text: |-
      1 Het overleg CGOP staat onder voorzitterschap van Onze Minister. Onze Minister is bevoegd het voorzitterschap op
      te dragen aan een door hem aan te wijzen ambtenaar.

      2 Indien de Commissie in meerderheid of de voorzitter van het overleg GOKB in overleg met de voorzitter van het
      overleg CGOP van oordeel is dat over een bepaalde aangelegenheid overleg gevoerd dient te worden met Onze Minister,
      wordt die aangelegenheid zo mogelijk in het eerstvolgende overleg CGOP geagendeerd.

      3 De voorzitter wordt bij het overleg CGOP terzijde gestaan door functionarissen die daartoe door Onze Minister
      worden aangewezen.

      4 Onze Minister wordt bij het overleg CGOP terzijde gestaan door de korpschef of diens vertegenwoordiger.

      5 Onze Minister kan de directeur van de Politieacademie of zijn plaatsvervanger uitnodigen tot het als waarnemer
      bijwonen van het overleg CGOP.

      6 Het secretariaat van het overleg CGOP wordt gevoerd door een door Onze Minister benoemde secretaris of daartoe
      aangewezen functionaris, die onder leiding van de voorzitter ter beschikking staat van deze, van de in het derde
      lid bedoelde functionarissen en van de leden van de Commissie. De benoeming van de secretaris of de aanwijzing van
      een functionaris daartoe geschiedt, de Commissie gehoord.

      7 Bij de behandeling van bepaalde aangelegenheden kan op uitnodiging of met toestemming van de voorzitter ook door
      anderen dan degenen die daartoe ingevolge [artikel 2][ref1] gerechtigd zijn, aan het overleg worden deelgenomen.

      8 De leden van de Commissie kunnen zich na overleg met de voorzitter ter vergadering voor de behandeling van een
      bepaald onderwerp door deskundigen laten bijstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006518#Artikel2
    url: https://wetten.overheid.nl/BWBR0006518/2020-01-01#Artikel4
    references:
      - id: ref1
