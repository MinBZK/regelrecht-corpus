  - number: '28'
    text: |-
      1 Er is een Advies- en Arbitragecommissie politieambtenaren, die tot taak heeft te adviseren dan wel een bindende
      uitspraak te doen in de geschillen die haar ingevolge de [artikelen 25 tot en met 27][ref1] worden voorgelegd.

      2 De Advies- en Arbitragecommissie politieambtenaren is gevestigd te ’s-Gravenhage. Zij bestaat uit vijf leden,
      onder wie de voorzitter en vijf plaatsvervangende leden. Zij worden bij koninklijk besluit benoemd voor een
      tijdvak van ten hoogste vier jaar. Herbenoeming kan tweemaal en telkens voor ten hoogste vier jaar plaatsvinden.
      De voorzitter en diens plaatsvervanger worden op gezamenlijke voordracht van Onze Minister en tot het overleg
      toegelaten verenigingen van ambtenaren. Van de andere vier leden en hun plaatsvervangers worden benoemd:

      a. twee leden en hun plaatsvervangers op voordracht van Onze Minister; alsmede

      b. twee leden en hun plaatsvervangers op voordracht van tot het overleg toegelaten verenigingen van ambtenaren.

      3 Daarnaast bestaat deze commissie uit twee bijzondere leden en twee plaatsvervangende bijzondere leden. Zij worden
      door Onze Minister benoemd voor een periode van ten hoogste vier jaren. Herbenoeming kan twee maal en telkens voor
      ten hoogste vier jaar plaatsvinden. Van de bijzondere leden en de plaatsvervangende bijzondere leden, wordt een lid
      benoemd op voordracht van de voorzitter van het overleg met de Commissie en een lid op voordracht van de tot dat
      overleg toegelaten verenigingen van ambtenaren.

      4 Met betrekking tot de samenstelling van de commissie geldt dat in geval van advies de commissie optreedt in een
      samenstelling van drie leden, onder wie de voorzitter, een van de twee leden bedoeld in het tweede lid, onder a
      en een van de twee leden bedoeld in het tweede lid onder b, en de twee bijzondere leden bedoeld in het derde lid.
      De overige twee leden treden te zamen met de voorzitter en de bijzondere leden op in geval van arbitrage. Bij
      verhindering van een der leden treedt diens plaatsvervanger op.

      5 Niet benoembaar tot lid zijn:

      a. personen die als vertegenwoordiger van een van de centrales genoemd in onderdeel b zijn toegelaten tot een
      overleg met de Staat als overheidswerkgever inzake aangelegenheden van algemeen belang voor de rechtstoestand van
      werknemers bij het Rijk;

      b. personen die bestuurslid zijn van, dan wel werkzaam zijn bij een centrale van verenigingen van ambtenaren,
      waaronder:

        - de Algemene Centrale van Overheidspersoneel;
        - de Christelijke Centrale van Overheids- en Onderwijspersoneel;
        - het Ambtenarencentrum;
        - de Centrale van Middelbare en Hogere Functionarissen bij Overheid en Onderwijs, Bedrijven en Instellingen;
      alsmede:
        - andere bij koninklijk besluit tot overleg met de Staat als overheidswerkgever toegelaten centrales van
      verenigingen van ambtenaren, welke onder meer gelet op het aantal ambtenaren, dat zij vertegenwoordigen, eveneens
      als representatief kunnen worden aangemerkt en tegen wier toelating het algemeen belang zich niet verzet.

      c. personen die werkzaam zijn bij de departementen van algemeen bestuur en de daaronder ressorterende instellingen,
      diensten en bedrijven, wier onafhankelijkheid en onpartijdigheid op grond van hun dienstverband door de deelnemers
      aan het overleg onvoldoende wordt geacht.

      Deze personen zijn eveneens uitgesloten van het lidmaatschap of plaatsvervangend lidmaatschap gedurende de periode
      van twee jaar na beëindiging van het lidmaatschap, plaatsvervangend lidmaatschap of bestuurslidmaatschap onder a en
      b bedoeld, alsmede na beëindiging van de werkzaamheden bedoeld onder b en c.

      d. personen die lid of plaatsvervangend lid zijn van de Commissie dan wel van wie dit lidmaatschap of
      plaatsvervangend lidmaatschap nog niet langer dan twee jaar is beëindigd;

      e. personen van wie het lidmaatschap of plaatsvervangend lidmaatschap van de Commissie LSOP, zoals deze commissie
      bestond tot 1 januari 2017, nog niet langer dan twee jaar is beëindigd.

      6 Aan de leden en bijzondere leden worden uit 's Rijks kas vergoedingen voor reis- en verblijfkosten verleend
      overeenkomstig de daarover gemaakte afspraken in de laatstelijk afgesloten collectieve arbeidsovereenkomst voor
      ambtenaren die krachtens een arbeidsovereenkomst met de Staat werkzaam zijn.

      7 Indien het verzoek om arbitrage naar het oordeel van de voorzitter eenzelfde geschil betreft als waarover door
      de Advies- en Arbitragecommissie reeds advies is uitgebracht, treedt voor een lid die bij het uitbrengen van dat
      advies betrokken was, diens plaatsvervanger op.


