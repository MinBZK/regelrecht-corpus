        artikel: '4'
        hoofdstuk: II
        afdeling: '1'
  - number: '10'
    text: |-
      1 Het standpunt van de Commissie wordt bepaald bij eenvoudige meerderheid van stemmen. Elke vereniging van
      ambtenaren brengt één stem uit. Indien de stemmen binnen de Commissie staken beslist de voorzitter van het overleg
      CGOP, de voorzitter van het overleg GOKB of de voorzitter van het overleg GOPB of het voorstel ten uitvoer wordt
      gebracht.

      2 Het standpunt van de Commissie over in het overleg besproken aangelegenheden wordt schriftelijk aan de voorzitter
      van het desbetreffende overleg meegedeeld. De Commissie geeft desverlangd een samenvatting van de aan het standpunt
      ten grondslag liggende argumenten.

      3 Indien in de Commissie een minderheidsstandpunt blijkt te bestaan, wordt daarvan desverlangd in de in het tweede
      lid bedoelde geschriften melding gemaakt.

      4 Indien over een aangelegenheid wordt beslist in afwijking van het standpunt van de meerderheid van de leden van
      de Commissie, worden de redenen van die afwijking zo spoedig mogelijk ter kennis van de Commissie gebracht.
    url: https://wetten.overheid.nl/BWBR0006518/2020-01-01#Artikel10
  - number: '11'
    text: |-
      1 Van het in de vergaderingen van het overleg en de werkgroepen behandelde maakt de secretaris notulen.

      Bovendien kan op verzoek van de leden van de Commissie of van de voorzitter van het overleg een verslag worden
      opgemaakt bevattende een beknopte samenvatting van het behandelde in het overleg met de Commissie, voor zover dat
      voor openbaarmaking geschikt kan worden geacht.

      2 Na overleg met de Commissie dan wel de door deze in de betrokken werkgroep aangewezen leden, kan de voorzitter
      ten aanzien van het in vorenbedoelde vergaderingen behandelde geheimhouding opleggen.

      3 De plicht tot geheimhouding geldt niet voor zover de leden van de Commissie dan wel de door haar in de betrokken
      werkgroep aangewezen leden in bespreking treden met de door hen vertegenwoordigde verenigingen of de Centrales
      waarbij hun verenigingen zijn aangesloten.
    url: https://wetten.overheid.nl/BWBR0006518/2020-01-01#Artikel11
  - number: '12'
    text: |-
      De korpschef draagt er zorg voor dat vertegenwoordigers van de verenigingen van ambtenaren met een aanstelling bij
      de politie die deel uitmaken van de Commissie niet uit hoofde van hun deelname worden benadeeld in hun positie bij
      de politie.
    url: https://wetten.overheid.nl/BWBR0006518/2020-01-01#Artikel12
  - number: '23'
    text: |-
      Voor de toepassing van deze afdeling wordt verstaan onder:

      a. deelnemers aan het overleg: de voorzitter en de tot de Commissie toegelaten verenigingen van ambtenaren;

      b. Advies- en Arbitragecommissie: de Advies- en Arbitragecommissie, bedoeld in [artikel 28][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006518#Artikel28
    url: https://wetten.overheid.nl/BWBR0006518/2020-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006518
        artikel: '28'
        hoofdstuk: II
        afdeling: '5'
  - number: '24'
    text: |-
      Deze afdeling is van toepassing op geschillen in aangelegenheden als bedoeld in [artikel 3, eerste lid][ref1], voor
      zover zij voortvloeien uit het overleg CGOP.


      [ref1]: https://wetten.overheid.nl/BWBR0006518#Artikel3
    url: https://wetten.overheid.nl/BWBR0006518/2020-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0006518
        artikel: '3'
        hoofdstuk: II
        afdeling: '1'
  - number: '25'
    text: |-
      Indien de voorzitter dan wel één of meer van de tot de Commissie toegelaten verenigingen van ambtenaren tot
      het oordeel komen dat het overleg met de Commissie niet tot een uitkomst zal leiden die de instemming van alle
      deelnemers aan dat overleg zal hebben, brengen zij dat oordeel binnen drie dagen nadat zij daarvan in dat overleg
      blijk hebben gegeven, schriftelijk ter kennis van de overige deelnemers aan dat overleg.
    url: https://wetten.overheid.nl/BWBR0006518/2020-01-01#Artikel25
  - number: '26'
    text: |-
      1 Binnen vijf dagen na de kennisgeving, bedoeld in [artikel 25][ref1], schrijft de voorzitter een
      overlegvergadering uit. De vergadering moet worden gehouden binnen zeven dagen nadat deze is uitgeschreven.

      2 Tenzij door de voorzitter en de Commissie wordt besloten het overleg voort te zetten dan wel te beëindigen wordt
      in de vergadering nagegaan of overeenstemming bestaat over de vraag wat het onderwerp en de inhoud van het geschil
      is en of een oplossing van dat geschil zal worden gezocht door middel van voortzetting van het overleg nadat het
      advies is ingewonnen van de Advies- en Arbitragecommissie, dan wel door middel van onderwerping van het geschil aan
      een arbitrale uitspraak van de Advies- en Arbitragecommissie.

      3 Tot het inwinnen van advies is zowel de voorzitter als de Commissie bevoegd.

      4 Voor onderwerping van het geschil aan arbitrage is overeenstemming vereist tussen alle deelnemers aan het
      overleg.


      [ref1]: https://wetten.overheid.nl/BWBR0006518#Artikel25
    url: https://wetten.overheid.nl/BWBR0006518/2020-01-01#Artikel26
