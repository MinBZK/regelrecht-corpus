        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: 4a
    text: |-
      1 Het overleg GOKB staat onder voorzitterschap van de korpschef of een door hem aan te wijzen lid van de
      korpsleiding.

      2 Indien de Commissie in meerderheid of de voorzitter van het overleg GOPB van oordeel is dat over een bepaalde
      aangelegenheid overleg gevoerd dient te worden met de korpschef, wordt die aangelegenheid zo mogelijk in het
      eerstvolgende overleg GOKB geagendeerd.

      3 De voorzitter wordt bij het overleg GOKB terzijde gestaan door functionarissen die daartoe door hem worden
      aangewezen.

      4 Onze Minister neemt deel aan het overleg GOKB vanuit zijn verantwoordelijkheid voor het overleg CGOP.

      5 De COR is als toehoorder bij het overleg GOKB aanwezig en wordt in dat overleg vertegenwoordigd door maximaal
      twee leden.

      6 [Artikel 4, zesde tot en met achtste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006518#Artikel4
    url: https://wetten.overheid.nl/BWBR0006518/2020-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0006518
        artikel: '4'
        hoofdstuk: II
        afdeling: '1'
  - number: 4b
    text: |-
      1 Het overleg GOPB staat onder voorzitterschap van de politiechef, de directeur van het betreffende korpsonderdeel,
      hun plaatsvervangers of, indien het de rijksrecherche betreft, de directeur van de rijksrecherche of zijn
      plaatsvervanger.

      2 De voorzitter wordt bij het overleg GOPB terzijde gestaan door functionarissen die daartoe door hem worden
      aangewezen, alsmede door functionarissen die daartoe door de korpschef worden aangewezen.

      3 Een vertegenwoordiger van de ondernemingsraad van het betreffende korpsonderdeel is als toehoorder bij het
      overleg GOPB aanwezig.

      4 [Artikel 4, zevende en achtste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006518#Artikel4
