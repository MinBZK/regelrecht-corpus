  - number: 3b
    text: |-
      1 Er is een sectorale commissie Politie.

      2 De sectorale commissie Politie bestaat uit vier leden namens de in [artikel 2, eerste lid][ref1], bedoelde
      Commissie en vier leden namens Onze Minister.

      3 De sectorale commissie heeft tot taak:

      a. advies uit te brengen aan het Bestuur van de Stichting Pensioenfonds ABP over de premie voor het
      PartnerPlusPensioen Politie;

      b. te besluiten over toelating van werkgevers die een verzoek tot deelname aan het PartnerPlusPensioen Politie
      doen.

      4 Onze Minister stelt in overeenstemming met de Commissie nadere regels met betrekking tot de werkwijze van de
      sectorale commissie Politie.


      [ref1]: https://wetten.overheid.nl/BWBR0006518#Artikel2
    url: https://wetten.overheid.nl/BWBR0006518/2020-01-01#Artikel3b
