        artikel: '1'
  - number: 3a
    text: |-
      1 In het overleg CGOP worden voorstellen over aangelegenheden en regels als bedoeld in
      [artikel 3, eerste lid][ref1], die moeten worden of zijn vastgelegd in algemeen verbindende voorschriften,
      besproken.

      2 In het overleg GOKB worden voorstellen over aangelegenheden en regels als bedoeld in
      [artikel 3, eerste lid][ref2], die bij besluit van de korpschef worden vastgelegd in beleidsregels, besproken.

      3 In het overleg GOPB worden aangelegenheden in het betreffende korpsonderdeel of de Rijksrecherche besproken,
      aangaande:

      a. de toepassing van arbeidsvoorwaarden en rechtspositie zoals vastgelegd in algemeen verbindende voorschriften
      en beleidsregels;

      b. de uitvoering van afspraken, opgenomen in het Arbeidsvoorwaardenakkoord sector Politie 2018–2020;

      c. de uitvoering van afspraken met de Commissie in het kader van verbetering van de politieorganisatie voor zover
      dit past binnen de eigen rol en verantwoordelijkheid van de politiechef of directeur van het korpsonderdeel.

      4 Indien eenzelfde aangelegenheid zich in meerdere korpsonderdelen voordoet, wordt de kwestie in het overleg GOKB
      geagendeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0006518#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006518#Artikel3
    url: https://wetten.overheid.nl/BWBR0006518/2020-01-01#Artikel3a
