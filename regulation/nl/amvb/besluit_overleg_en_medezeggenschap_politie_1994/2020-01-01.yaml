articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Justitie en Veiligheid;

      b.

      c.

      d. politiechef: de politiechef, bedoeld in [artikel 1, onderdeel h, van de Politiewet 2012][ref1];

      e. korpsonderdeel: een onderdeel van het politiekorps als bedoeld in
      [artikel 25, eerste lid, van de Politiewet 2012][ref2];

      f. ambtenaar: de ambtenaar, bedoeld in
      [artikel 1, eerste lid, onderdeel i, van het Besluit algemene rechtspositie politie][ref3];

      g. bevoegd gezag:

      1°. de korpschef, voor zover het betreft de ambtenaar, aangesteld bij een onderdeel, bedoeld in
      [artikel 25, eerste lid, van de Politiewet 2012][ref4];

      2°. het College van procureurs-generaal, voor zover het betreft ambtenaren van de rijksrecherche.

      h. korpschef: de korpschef als bedoeld in [artikel 27 van de Politiewet 2012][ref5];

      i. Centrale: een centrale van overheidspersoneel als bedoeld in
      [artikel 1 van de Regeling overleg Raad voor het Overheidspersoneelsbeleid][ref6];

      j. Commissie: de Commissie voor georganiseerd overleg in politie-ambtenarenzaken, bedoeld in [artikel 2][ref7];

      k. overleg CGOP: het overleg van Onze Minister met de Commissie;

      l. overleg GOKB: het overleg van de korpschef met de Commissie;

      m. overleg GOPB: het overleg van de politiechef of de directeur van het betreffende korpsonderdeel met de
      Commissie;

      n. COR: de centrale ondernemingsraad politie;

      o.

      p. Pensioenreglement: het Pensioenreglement van de Stichting Pensioenfonds ABP;

      q. Stichting Pensioenfonds ABP: de Stichting Pensioenfonds ABP, bedoeld in
      [artikel 6 van de Wet privatisering ABP][ref8];

      r. PartnerPlusPensioen Politie: het PartnerPlusPensioen Politie, bedoeld in artikel 1 van bijlage C van het
      Pensioenreglement.


