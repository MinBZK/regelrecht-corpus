  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Volksgezondheid van 2 december 1966, Directoraat-
    Generaal van de Arbeid, Hoofdafdeling Wetgevingsbeleid, Nr. 6418;

    Gelet op de artikelen 1, 2, 3, 6, 12 en 15 van de Wet op de gevaarlijke werktuigen (Stb. 1952, 104);

    De Raad van State gehoord (advies van 18 januari 1967, No. 47);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Volksgezondheid van 15 februari 1967,
    Directoraat-Generaal van de Arbeid, Hoofdafdeling Wetgevingsbeleid, Nr. 5141;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002558/2003-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Dit besluit verstaat onder:

      a. "schiethamer": een technisch voortbrengsel, waarmede pennen, stiften, draadeinden en dergelijke in materialen
      kunnen worden gedreven en waarbij de drijfkracht geheel of gedeeltelijk wordt geleverd door een explosieve lading;

      b. "plunjerschiethamer": een schiethamer, waarbij de drijfkracht niet rechtstreeks op de pen of een dergelijk
      voorwerp wordt overgebracht, doch door middel van een tussenliggende plunjer, waarvan de beweging in de
      lengterichting van de loop is beperkt;

      c. "splinterkap": een bij een schiethamer behorende splinterkap;

      d. "aangewezen instelling": een krachtens [artikel 7a van de Warenwet][ref1] met betrekking tot de keuring van
      schiethamers aangewezen instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002558/2003-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 7a
  - number: '2'
    text: Dit besluit is niet van toepassing op technische voortbrengselen, die bestemd zijn voor het doden van dieren.
    url: https://wetten.overheid.nl/BWBR0002558/2003-09-01#Artikel2
  - number: 2a
    text: |-
      1 Met de in dit besluit bedoelde schiethamers en splinterkappen worden gelijkgesteld schiethamers en splinterkappen
      die rechtmatig zijn vervaardigd of in de handel gebracht in een andere lidstaat van de Europese Unie, dan wel
      rechtmatig zijn vervaardigd in een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij de
      Overeenkomst inzake de Europese Economische Ruimte en die een beschermingsniveau bieden dat gelijkwaardig is aan
      het in dit besluit gewaarborgde niveau.

      2 Met het in dit besluit bedoelde certificaat van goedkeuring wordt gelijkgesteld een certificaat van goedkeuring
      afgegeven door een onafhankelijke instelling in een andere staat die partij is bij de Overeenkomst inzake
      de Europese Economische Ruimte, welk certificaat isafgegeven op basis van onderzoekingen die aan ten minste
      gelijkwaardige eisen voldoen.
    url: https://wetten.overheid.nl/BWBR0002558/2003-09-01#Artikel2a
  - number: 2b
    text: |-
      1 Het is verboden schiethamers, splinterkappen en patronen welke bestemd zijn om te worden gebruikt in
      schiethamers, die niet voldoen aan de vervaardigingsvoorschriften gesteld bij of krachtens dit besluit te
      vervaardigen, te verhandelen of te gebruiken.

      2 Het is verboden schiethamers en splinterkappen te verhandelen of te gebruiken anders dan met inachtneming
      van de voorschriften bij of krachtens dit besluit gesteld met betrekking tot de aanduiding en het bezigen van
      vermeldingen.

      3 Het is verboden schiethamers en splinterkappen te verhandelen of te gebruiken, indien de bij of krachtens dit
      besluit voorgeschreven keuringsprocedures niet in acht zijn genomen.

      4 Het is verboden schiethamers te gebruiken anders dan met inachtneming van de voorschriften bij of krachtens dit
      besluit gesteld met betrekking tot het voorhanden zijn van documenten.
    url: https://wetten.overheid.nl/BWBR0002558/2003-09-01#Artikel2b
  - number: '3'
    text: |-
      1 Een schiethamer is deugdelijk vervaardigd en biedt voldoende veiligheidswaarborgen.

      2 Op een schiethamer is de naam van de fabrikant of het fabrieksmerk, de type-aanduiding, het serienummer en het
      bouwjaar aangegeven.

      3 Op een schiethamer is een plaats beschikbaar voor het aanbrengen van een merk van goedkeuring en het nummer van
      een certificaat van goedkeuring als bedoeld in [artikel 12, zesde lid][ref1]. Deze gegevens en die, vermeld in het
      tweede lid, zijn duidelijk en onuitwisbaar op de schiethamer aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002558#Artikel12
    url: https://wetten.overheid.nl/BWBR0002558/2003-09-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002558
        artikel: '12'
        hoofdstuk: V
  - number: '4'
    text: |-
      1 Een schiethamer is zodanig vervaardigd, dat de reactiekracht en het geluid van de explosie niet gevaarlijk zijn
      voor de gebruiker.

      2 Een schiethamer is zodanig vervaardigd, dat hij slechts kan worden afgeschoten, indien hij van een splinterkap
      is voorzien.

      3 Een schiethamer is zodanig vervaardigd, dat het niet mogelijk is hem in de vrije ruimte af te vuren zonder
      gebruik te maken van bijzondere hulpmiddelen.

      4 Een schiethamer is zodanig vervaardigd, dat hij slechts kan worden afgeschoten, indien de loop met een kracht van
      ten minste 5 kg tegen het te beschieten oppervlak is aangedrukt.

      5 Een schiethamer is zodanig vervaardigd, dat hij slechts kan worden afgeschoten, indien de hoek, gevormd tussen de
      hartlijn van de loop en de loodlijn van het te beschieten oppervlak, niet groter is dan 7 graden.

      6 Een schiethamer is zodanig vervaardigd, dat het onopzettelijk afgaan van een schot onmogelijk is.
    url: https://wetten.overheid.nl/BWBR0002558/2003-09-01#Artikel4
  - number: '5'
    text: |-
      1 Een splinterkap is vervaardigd uit een materiaal, dat bestand is tegen ketsende en wegschietende pennen en
      materiaalsplinters.

      2 Op een splinterkap zijn merktekens aangebracht, die de hartlijn van de loop duidelijk aangeven.

      3 Een splinterkap is loodrecht op de loop aangebracht. Zij moet zodanig zijn vervaardigd en bevestigd, dat de rand
      ervan geheel kan aansluiten op het oppervlak, waartegen zij bij gebruik van de schiethamer wordt geplaatst, zodat
      terugketsende pennen, splinters en soortgelijke voorwerpen kunnen worden opgevangen.

      4 De afstand tussen de buitenrand van een splinterkap en de hartlijn van de loop bedraagt niet minder dan 50 mm.

      5 In afwijking van het vierde lid bedraagt bij een splinterkap, bestemd om te schieten in de nabijheid van
      ingesloten hoeken, de afstand van het middelpunt van de loop tot de buitenrand van de splinterkap aan één zijde
      minder dan 50 mm.
    url: https://wetten.overheid.nl/BWBR0002558/2003-09-01#Artikel5
  - number: '6'
    text: Bij een schiethamer wordt ten minste één splinterkap geleverd.
    url: https://wetten.overheid.nl/BWBR0002558/2003-09-01#Artikel6
  - number: '7'
    text: |-
      1 Bij een schiethamer wordt een bedienings- en onderhoudsvoorschrift geleverd, waarin ten minste is vermeld:

      a. welke pennen of dergelijke en welke patronen worden gebruikt;

      b. een schema, waarin de werking van de verschillende onderdelen is aangegeven;

      c. een opsomming van de onderdelen, die de gebruiker zelf kan verwisselen.

      2 Indien de schiethamer bestemd is voor uitvoer naar het buitenland, is het bedienings- en onderhoudsvoorschrift
      gesteld in de taal of talen van het land, waar de schiethamer zal worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0002558/2003-09-01#Artikel7
  - number: '8'
    text: |-
      Een schiethamer wordt geleverd in een stevige, in vakken verdeelde doos of kist, waarin de schiethamer,
      het bedienings- en onderhoudsvoorschrift, de splinterkap of splinterkappen, de pennen, de patronen, het
      onderhoudsmateriaal en een veiligheidsbril ordelijk opgeborgen kunnen worden. Deze doos of kist wordt met behulp
      van een sleutel afgesloten.
    url: https://wetten.overheid.nl/BWBR0002558/2003-09-01#Artikel8
  - number: '9'
    text: |-
      1 Op de verpakking, waarin de patronen geleverd worden, zijn aangegeven de naam van de fabrikant of het
      fabrieksmerk, het kaliber en de kleuraanduiding van de lading van de patronen, zoals bepaald in het tweede lid.

      2 De patronen zijn op de onderzijde van de huls voorzien van het kenteken van de fabrikant. De patronen zijn door
      een kleuraanduiding gekenmerkt, overeenkomstig de volgende tabel:








                    zwart


                    : sterkste lading,




                    rood


                    : zeer sterke lading,




                    blauw


                    : sterke lading,




                    geel


                    : middelmatige lading,




                    groen


                    : zwakke lading,




                    wit


                    : zwakste lading.
    url: https://wetten.overheid.nl/BWBR0002558/2003-09-01#Artikel9
  - number: '10'
    text: Hij, die een schiethamer verhandelt of gebruikt, zorgt ervoor, dat deze in goede staat van onderhoud verkeert.
    url: https://wetten.overheid.nl/BWBR0002558/2003-09-01#Artikel10
  - number: '11'
    text: |-
      Het bepaalde in [artikel 4, tweede, vierde en vijfde lid][ref1], geldt niet voor plunjerschiethamers, waarbij de
      kinetische energie van de pen bij het verlaten van de loop niet meer dan 2,5 kgm bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0002558#Artikel4
    url: https://wetten.overheid.nl/BWBR0002558/2003-09-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002558
        artikel: '4'
        hoofdstuk: II
  - number: '12'
    text: |-
      1 Een schiethamer en een splinterkop worden gekeurd.

      2 De keuring van een schiethamer en van een splinterkap geschiedt door de keuring van een het type kenmerkend
      monster.

      3 Degene die een keuring aanvraagt, stelt een schiethamer in een doos of kist als bedoeld in [artikel 8][ref1] ter
      beschikking van de aangewezen instelling. Bij deze schiethamer worden de in [artikel 6][ref2] bedoelde splinterkap
      of splinterkappen gevoegd, alsmede een door de aangewezen instelling aan te geven aantal pennen en patronen van
      de verschillende soorten, welke overeenstemmen met de aanwijzingen van de fabrikant, in de verpakking, bedoeld
      in [artikel 9][ref3].

      4 De aanvraag gaat vergezeld van:

      a. een constructietekening en een afbeelding van de schiethamer;

      b. een beschrijving van de veiligheidsinrichting, en

      c. het bij de schiethamer behorende in de Nederlandse taal gestelde bedienings- en onderhoudsvoorschrift, bedoeld
      in [artikel 7][ref4].

      5 Als een het type kenmerkend monster van de schiethamer reeds is gekeurd in een van de staten die partij is bij
      de Overeenkomst betreffende de Europese Economische Ruimte gaat de aanvraag tevens vergezeld van het in die staat
      afgegeven certificaat van goedkeuring en van de meetgegevens op basis waarvan het certificaat is afgegeven.

      6 Indien de aangewezen instelling vaststelt, dat het monster voldoet aan de voorschriften van [Hoofdstuk II][ref5],
      wordt een certificaat van goedkeuring afgegeven. Het nummer van het certificaat van goedkeuring met
      cijfers van ten minste 5 mm hoogte en een merk van goedkeuring worden ingeslagen op de plaats, bedoeld in
      [artikel 3, derde lid][ref6]. Iedere schiethamer die overeenkomstig het goedgekeurde, het type kenmerkende monster
      is vervaardigd wordt zonder nadere keuring van een merk van goedkeuring voorzien.

      7 Bij ministeriële regeling worden met betrekking tot het waarmerken en bewaren van goedgekeurde, het type
      kenmerkende monsters en het certificaat en merk van goedkeuring nadere regels gesteld.

      8 Bij ministeriële regeling kunnen fabrikanten en handelaren bevoegd worden verklaard tot het aanbrengen van het
      merk van goedkeuring. Aan een dergelijke bevoegdverklaring kunnen voorschriften worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002558#Artikel8
