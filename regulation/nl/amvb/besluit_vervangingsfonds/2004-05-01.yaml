  - number: '2'
    text: |-
      1 Het vervangingsfonds heeft tot taak het bevoegd gezag de waarborgen te bieden, bedoeld in de
      [artikelen 183, eerste lid, onderdeel a, van de WPO][ref1], [169, eerste lid, onderdeel a, van de WEC][ref2] en
      [98a, eerste lid, van de Wet op het voortgezet onderwijs][ref3].

      2 Het vervangingsfonds heeft tevens tot taak het bevoegd gezag de waarborgen te
      bieden, bedoeld in de [artikelen 183, eerste lid, onderdeel b, van de WPO][ref4], en
      [artikel 169, eerste lid, onderdeel b, van de WEC][ref5], en beheert daartoe het noodfonds, dat de
      bedragen omvat die Onze Minister op de voet van de [artikelen 183, vierde lid, van de WPO][ref6], en
      [169, vierde lid, van de WEC][ref7] jaarlijks aan het vervangingsfonds toekent.


