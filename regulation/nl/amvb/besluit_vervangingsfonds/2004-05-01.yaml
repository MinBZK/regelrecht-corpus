  - number: '5'
    text: |-
      1 De hoogte van de vervangingsbijdrage behoeft de goedkeuring van Onze Minister.

      2 Onze Minister toetst of de door het vervangingsfonds voorgestelde hoogte van de vervangingsbijdrage in een
      redelijke verhouding staat tot de uitgaven die het vervangingsfonds naar verwachting dient te doen met het oog op
      de uitoefening van zijn taak, bedoeld in [artikel 2, eerste lid][ref1]. Onze Minister hanteert daarbij de volgende
      criteria:

      a. de hoogte van de vervangingsbijdrage dient de vaststelling mogelijk te maken van vervangingsregels die ten
      minste de continuïteit in het onderwijs op aanvaardbaar niveau waarborgen;

      b. de hoogte van de vervangingsbijdrage belemmert het bevoegd gezag in het algemeen niet in de normale
      taakuitoefening.

      3 De goedkeuring, bedoeld in het eerste lid, is niet vereist, indien de vervangingsbijdrage niet meer dan 1
      procentpunt hoger of lager is dan het percentage dat, met toepassing van de [artikelen 126 van de WPO][ref2],
      [121 van de WEC][ref3] en [84b van de WVO][ref4], door Onze Minister met het oog op de vergoeding van de kosten
      voor vervanging jaarlijks wordt vastgesteld.

      4 Het tweede en derde lid hebben geen betrekking op de premie die het vervangingsfonds aan het bevoegd gezag oplegt
      uit hoofde van enige verzekering bij het vervangingsfonds voor personeel waarvan het salaris door het bevoegd gezag
      uit eigen middelen wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007009#Artikel2
