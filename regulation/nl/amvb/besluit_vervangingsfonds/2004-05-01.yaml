  - number: '3'
    text: |-
      1 Indien Onze Minister voornemens is van een of meer van de bevoegdheden, bedoeld in de
      [artikelen 187, eerste lid, van de WPO][ref1], [172, eerste lid, van de WEC][ref2], en
      [123a, eerste lid, van de WVO][ref3], jegens het vervangingsfonds gebruik te maken en dit voornemen leidt tot een
      groter beslag op de middelen van het vervangingsfonds, geeft hij aan dat voornemen geen uitvoering dan nadat vier
      weken zijn verstreken na de bekendmaking van dat voornemen aan het bestuur van het vervangingsfonds.

      2 Binnen het in het eerste lid bedoelde tijdvak kan het bestuur van het vervangingsfonds een begroting van de
      meerkosten die naar zijn verwachting aan de zijde van het vervangingsfonds zullen optreden als gevolg van de
      uitvoering van het voornemen, bedoeld in het eerste lid, aan Onze Minister zenden.

      3 Binnen drie weken na ontvangst van de in het tweede lid bedoelde begroting bericht Onze Minister aan het bestuur
      van het vervangingsfonds of hij de meerkosten aanvaardt. De uitvoering van het voornemen, bedoeld in het eerste
      lid, binnen de termijn van drie weken of nadien geldt als aanvaarding van een aanspraak van het vervangingsfonds op
      vergoeding van de meerkosten ten laste van ’s Rijks kas overeenkomstig de toegezonden begroting.

      4 Indien Onze Minister binnen drie weken na ontvangst van de in het tweede lid bedoelde begroting aan het bestuur
      van het vervangingsfonds bericht de meerkosten niet te aanvaarden, treden Onze Minister en het bestuur van het
      vervangingsfonds met elkaar in overleg ten einde te bezien of moet worden overgegaan tot uitvoering van het
      voornemen, bedoeld in het eerste lid. De tweede volzin van het derde lid is niet van toepassing, indien het overleg
      niet tot overeenstemming leidt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel187
