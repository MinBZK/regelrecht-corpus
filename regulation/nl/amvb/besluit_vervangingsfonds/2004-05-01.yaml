  - number: '9'
    text: |-
      Onze Minister draagt er zorg voor dat bij de intrekking van de aanwijzing van het vervangingsfonds als de
      rechtspersoon, bedoeld in de [artikelen 183, eerste lid, van de WPO][ref1], [169, eerste lid, van de WEC][ref2] en
      [98a, eerste lid, van de Wet op het voortgezet onderwijs][ref3], het vervangingsfonds de onder zijn beheer staande
      middelen, bestemd voor het verschaffen van de waarborgen, bedoeld in [artikel 2, eerste en tweede lid][ref4],
      aanwendt voor het doel waartoe die middelen aan het vervangingsfonds ter beschikking zijn gesteld, dan wel
      overdraagt aan de rechtspersoon die door Onze Minister als vervangingsfonds wordt aangewezen.


