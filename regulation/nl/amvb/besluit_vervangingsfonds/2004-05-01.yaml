  - number: '6'
    text: |-
      1 Indien Onze Minister van oordeel is dat de waarborgen voor vervanging van afwezig personeel onvoldoende zijn
      in verband met de goede voortgang van het onderwijs, treedt hij onverwijld in overleg met het bestuur van het
      vervangingsfonds.

      2 Indien dit overleg niet leidt tot overeenstemming over de waarborgen voor de vervanging van afwezig personeel die
      het vervangingsfonds ten minste dient te bieden, geeft Onze Minister binnen twee maanden een of meer aanwijzingen
      aan het vervangingsfonds met betrekking tot de te bieden waarborgen.

      3 In geval van toepassing van [dit artikel][ref1] is [artikel 3][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007009#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007009#Artikel3
