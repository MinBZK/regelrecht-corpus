  - number: '4'
    text: |-
      1 De statuten van het vervangingsfonds behoeven de goedkeuring van Onze Minister.

      2 Onze Minister verleent de goedkeuring aan de statuten van het vervangingsfonds uitsluitend, indien deze statuten
      ten minste de volgende bepalingen bevatten:

      a. de bepaling dat het vervangingsfonds zich ten doel stelt de waarborgen te bieden, bedoeld
      in de [artikelen 183, eerste lid, van de WBO][ref1], [169, eerste lid, van de WEC][ref2] en
      [98a, eerste lid, van de WVO][ref3];

      b. de bepaling dat het bestuur van het vervangingsfonds wordt gevormd door vertegenwoordigers van de centrales,
      genoemd in [artikel 3, eerste lid, van het Overlegbesluit onderwijspersoneel][ref4], en de organisaties, genoemd in
      [artikel 24, eerste lid, van dat besluit][ref5], met uitzondering van de BVE-Raad en het COLO;

      c. de bepaling dat het bestuur van het vervangingsfonds ten minste een maal per jaar overleg voert met Onze
      Minister of een door Onze Minister aan te wijzen vertegenwoordiger;

      d. de bepaling dat het vervangingsfonds is gehouden de aanwijzingen die Onze Minister geeft op
      grond van de [artikelen 187, eerste lid, van de WPO][ref6], [172, eerste lid, van de WEC][ref7] en
      [123a, eerste lid, van de WVO][ref8], zomede op grond van dit besluit, op te volgen;

      e. de bepaling dat het vervangingsfonds Onze Minister alle inlichtingen verschaft, die noodzakelijk zijn voor het
      door Onze Minister uit te oefenen toezicht op het vervangingsfonds;

      f. de bepaling dat het vervangingsfonds in het kader van zijn taakuitoefening, bedoeld in [onderdeel ][ref9], het
      bevoegd gezag bij reglement of anderszins verplichtingen van administratieve aard oplegt:

      1°. ten behoeve van de controle van de rechtmatigheid van de uitgaven van het vervangingsfonds,

      2°. ten behoeve van het verkrijgen van betrouwbare gegevens met betrekking tot ziekteverzuim, andere vormen van
      afwezigheid en vervanging,

      3°. ten behoeve van de doelmatige uitvoering van de werkzaamheden door het vervangingsfonds,

      4°. ten behoeve van het voldoen aan verplichtingen van het vervangingsfonds uit hoofde van de wet of dit besluit;

      g. de bepaling dat bij ontbinding of beëindiging van de werkzaamheden van het vervangingsfonds de bestemming van
      het bij liquidatie aanwezige vermogen wordt vastgesteld in overeenstemming met Onze Minister.

      3 Bij de goedkeuring van besluiten van het bestuur van het vervangingsfonds tot wijziging van de statuten is het
      tweede lid van overeenkomstige toepassing.

      4 Onze Minister onthoudt zijn goedkeuring aan een besluit van het bestuur van het vervangingsfonds tot
      wijziging van de statuten, indien een dergelijk besluit in strijd is met de wet of met dit besluit, dan wel
      in strijd is met het algemeen belang of niet is te verenigen met de waarborgen welke het vervangingsfonds
      zich ten doel stelt te bieden. Onze Minister kan aan een besluit van het bestuur van het vervangingsfonds tot
      wijziging van de statuten zijn goedkeuring onthouden, indien dat besluit naar zijn oordeel in strijd is met
      een door hem gegeven of voorgenomen aanwijzing op grond van de [artikelen 187, eerste lid, van de WPO][ref10],
      [172, eerste lid, van de WEC][ref11] en [123a, eerste lid, van de WVO][ref12].


