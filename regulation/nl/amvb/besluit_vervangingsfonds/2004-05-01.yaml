preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Onderwijs en Wetenschappen van 3 november 1993, nr. 93069693/3255, directie
    Wetgeving en Juridische Zaken, gedaan mede namens Onze Minister van Landbouw, Natuurbeheer en Visserij;

    Gelet op artikel 116b, vierde lid, van de Wet op het basisonderwijs, artikel 111a, vierde lid, van de Interimwet
    op het speciaal onderwijs en het voortgezet speciaal onderwijs en artikel 123a, vierde lid, van de Wet op het
    voortgezet onderwijs, artikel 1, onderdeel a, van de Wet openbaarheid van bestuur, en artikel 1a, eerste lid,
    onderdeel d, van de Wet Nationale ombudsman;

    Gezien het advies van de Onderwijsraad (advies van 22 september 1993, nr. OR 93000201/Alg);

    De Raad van State gehoord (advies van 19 mei 1994, nr. W05.93.0736);

    Gezien het nader rapport van Onze Minister van Onderwijs, Cultuur en Wetenschappen, Onze Minister-President,
    Minister van Algemene Zaken en de Staatssecretaris van Binnenlandse Zaken, mr. J. Kohnstamm, van 2 november 1994,
    nr. 94038337/3255, directie Wetgeving en Juridische Zaken, uitgebracht mede namens Onze Minister van Landbouw,
    Natuurbeheer en Visserij;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007009/2004-05-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Dit besluit verstaat onder:

      WPO: [Wet op het primair onderwijs][ref1];

      WEC: [Wet op de expertisecentra][ref2];

      WVO: [Wet op het voortgezet onderwijs][ref3];

      Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschappen en, wat betreft het landbouwonderwijs, Onze
      Minister van Landbouw, Natuurbeheer en Visserij;

      het vervangingsfonds: de rechtspersoon, bedoeld in [artikel 183, eerste lid, van de WPO][ref4],
      [169, eerste lid, van de WEC][ref5] en [98a, eerste lid van de WVO][ref6];

      het noodfonds: het noodfonds, bedoeld in [artikel 2, tweede lid][ref7];

      het bevoegd gezag: het bevoegd gezag van een school of instelling, dat is aangesloten bij het vervangingsfonds
      op grond van [artikel 183, eerste lid, van de WPO][ref8], [169, eerste lid, van de WEC][ref9] en
      [98a, eerste lid van de WVO][ref10];

      vervangingsbijdrage: door het bevoegd gezag op grond van de [artikel 183, tweede lid, van de WPO][ref11],
      [169, tweede lid, van de WEC][ref12] en [98a, tweede lid van de WVO][ref13] aan het vervangingsfonds verschuldigde
      bijdrage.


