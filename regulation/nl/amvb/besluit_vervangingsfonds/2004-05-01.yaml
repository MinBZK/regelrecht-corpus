  - number: '11'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip. Laatstbedoeld besluit wordt niet
      genomen voordat vier weken zijn verstreken nadat het onderhavige besluit is overgelegd aan de Tweede Kamer der
      Staten-Generaal en gedurende die termijn niet door of namens de Tweede Kamer de wens wordt te kennen gegeven dat
      het in het onderhavige besluit geregelde onderwerp bij de wet wordt geregeld.
    url: https://wetten.overheid.nl/BWBR0007009/2004-05-01#Artikel11
