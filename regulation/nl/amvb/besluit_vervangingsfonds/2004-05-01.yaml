  - number: '7'
    text: |-
      Onze Minister verstrekt aan het vervangingsfonds alle inlichtingen die het vervangingsfonds in verband met zijn
      taakuitoefening behoeft, tenzij Onze Minister niet over de desbetreffende gegevens beschikt of de wet zich tegen
      het verstrekken van die gegevens verzet.
    url: https://wetten.overheid.nl/BWBR0007009/2004-05-01#Artikel7
  - number: '8'
    text: |-
      1 Het vervangingsfonds verstrekt uit eigen beweging en onverwijld aan Onze Minister:

      a. een overzicht van de waarborgen, bedoeld in de [artikelen 183, eerste lid, van de WPO][ref1],
      [169, eerste lid, van de WEC][ref2] en [98a, eerste lid, van de Wet op het voortgezet onderwijs][ref3] die het aan
      het bevoegd gezag biedt;

      b. alle relevante gegevens betreffende de vaststelling van de vervangingsbijdrage;

      c. zijn jaarverslag;

      d. zijn begroting en jaarrekening;

      e. afschrift van de reglementen en voorwaarden die het opstelt met het oog op zijn taakuitoefening ten behoeve van
      het bevoegd gezag, zomede van alle circulaires of algemene berichten die het aan het bevoegd gezag zendt;

      f. in een voorkomend geval, de mededeling van zijn voornemen om over te gaan tot zijn ontbinding of tot beëindiging
      van zijn werkzaamheden.

      2 Het vervangingsfonds verstrekt aan Onze Minister tevens:

      a. de gegevens met betrekking tot het door het bevoegd gezag opgegeven ziekteverzuimpercentage onder het personeel;

      b. de gegevens met betrekking tot de door het bevoegd gezag opgegeven afwezigheid van personeel om andere redenen
      dan wegens ziekte;

      c. de gegevens met betrekking tot de door hem bekostigde vervanging, mede in relatie tot de aard van de afwezigheid
      van het vervangen personeelslid;

      d. de gegevens met betrekking tot de toegekende aanvragen van een tegemoetkoming uit het noodfonds, zomede
      periodieke overzichten van het verloop van de uitkeringen uit het noodfonds;

      e. de financiële gegevens met betrekking tot de aan het bevoegd gezag uitgekeerde vergoedingen en de van deze
      terugontvangen premies;

      f. de financiële gegevens met betrekking tot zijn bestuurs- en apparaatskosten en zijn overige inkomsten;

      g. de financiële gegevens met betrekking tot zijn reserves;

      h. de gegevens met betrekking tot de aard en het aantal van de door hem verrichte controles op juistheid van de
      ontvangen declaraties, alsmede de gegevens met betrekking tot de uitkomsten van deze controles;

      i. jaarlijks een overzicht van de door hem jegens derden aangegane financiële verplichtingen.

      3 Onze Minister stelt na overleg met het vervangingsfonds nadere voorwaarden vast met betrekking tot de inhoud,
      vorm en frequentie van de verstrekking van gegevens, bedoeld in het tweede lid, en in [artikel 7][ref4].

      4 Het vervangingsfonds voert een zodanige administratie dat de in het eerste en tweede lid bedoelde gegevens tijdig
      kunnen worden verstrekt. Onze Minister kan zonodig nadere aanwijzingen ter zake geven.

      5 Het vervangingsfonds geeft aan Onze Minister of aan een door Onze Minister daartoe gemachtigde, zo dikwijls als
      Onze Minister of de gemachtigde dat vordert, inzage in de boeken en bescheiden en toont de gelden en waarden welke
      door het vervangingsfonds worden beheerd of bewaard.

      6 Het vervangingsfonds verstrekt desgevraagd en kosteloos aan het Centraal Bureau voor de Statistiek gegevens ten
      behoeve van de statistiek.


