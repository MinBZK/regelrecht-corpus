  - number: '3.1'
    text: |-
      1 Onze Minister wijst de richtlijn, bedoeld in [artikel 5.5, onderdeel b, van de wet][ref1], aan.

      2 De richtlijn komt voor aanwijzing in aanmerking indien deze in elk geval voorschriften over de volgende
      onderwerpen bevat, zodat een opgraving op professionele wijze wordt verricht:

      a. de verschillende handelingen die worden verricht bij het opgraven door zelfstandig aan te duiden actoren, in
      samenhang met een daartoe geschikt kwaliteitszorgsysteem;

      b. het documenteren van de opgraving op zorgvuldige en navolgbare wijze;

      c. het rapporteren over vondsten met het oog op de vergaring en het behoud van kennis over het Nederlandse
      bodemarchief;

      d. de wijze van conserveren zodat de vondst behouden blijft; en

      e. de wijze waarop wordt omgegaan met tekortkomingen.

      3 Certificerende instellingen verstrekken certificaten met inachtneming van de richtlijn.

      4 Een certificaathouder of instelling als bedoeld in [artikel 2.1][ref2] verricht een opgraving overeenkomstig
      de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel5.5
      [ref2]: https://wetten.overheid.nl/BWBR0037866#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0037866/2016-07-01#Artikel3.1
    references:
