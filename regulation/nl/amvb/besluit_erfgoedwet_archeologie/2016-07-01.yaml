  - number: '3.2'
    text: |-
      1 Bij de aanvraag tot aanwijzing als certificerende instelling toont de aanvrager aan dat deze:

      a. rechtspersoonlijkheid heeft;

      b. onafhankelijk is van de door haar beoordeelde organisaties, processen, diensten of producten;

      c. beschikt over voldoende kennis, deskundigheid en toerusting om de uitvoering van de taken naar behoren te
      vervullen;

      d. beschikt over een behoorlijke administratie waarin de gegevens die samenhangen met en betrekking hebben op de
      uitvoering van haar taken, op een systematische wijze zijn vastgelegd;

      e. verzekerd is tegen wettelijke aansprakelijkheid voor risico’s die voortvloeien uit de uitoefening van haar
      taken;

      f. beschikt over een adequate klachtenregeling;

      g. in staat is te beslissen op bezwaar; en

      h. in staat is te voldoen aan rapportage- en informatieverplichtingen op grond van dit besluit, jegens Onze
      Minister.

      2 De aanvraag gaat vergezeld van een bewijs van accreditatie, als bedoeld in verordening EU nr. 765/2008, voor het
      afgeven van certificaten op basis van de in [artikel 3.1][ref1] genoemde richtlijn.

      3 Aan de aanwijzing kunnen nadere voorschriften verbonden worden.

      4 De aanwijzing bepaalt voor welke termijn deze wordt verleend. De termijn eindigt in ieder geval op de einddatum
      van de accreditatie.

      5 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste lid. Bij deze
      ministeriële regeling kunnen tevens regels worden gesteld over het indienen en het beslissen op de aanvraag tot
      aanwijzing als certificerende instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0037866#Artikel3.1
    url: https://wetten.overheid.nl/BWBR0037866/2016-07-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0037866
        artikel: '3.1'
        hoofdstuk: '3'
  - number: '3.3'
    text: |-
      1 De aanvraag voor een certificaat wordt ingediend bij een certificerende instelling.

      2 De certificerende instelling beslist binnen zes maanden na ontvangst van de aanvraag.

      3 De aanvrager is aan de certificerende instelling een vergoeding verschuldigd voor de behandeling van de aanvraag
      van een certificaat.

      4 Bij ministeriële regeling kunnen tarieven worden vastgesteld ten aanzien van de werkzaamheden van de
      certificerende instellingen.
    url: https://wetten.overheid.nl/BWBR0037866/2016-07-01#Artikel3.3
  - number: '3.4'
    text: |-
      1 Van een certificerende instelling die failliet is zijn de afgegeven certificaten ten hoogste zes maanden geldig
      na de datum van het uitspreken van de faillietverklaring.

      2 Van een certificerende instelling waarvan de aanwijzing is ingetrokken zijn de afgegeven certificaten ten hoogste
      zes maanden geldig na de datum van intrekking.
    url: https://wetten.overheid.nl/BWBR0037866/2016-07-01#Artikel3.4
  - number: '3.5'
    text: |-
      1 Indien een certificerende instelling niet langer beschikt over accreditatie als bedoeld in
      [artikel 5.2 van de wet][ref1], kan Onze Minister de aanwijzing intrekken.

      2 Onverminderd het eerste lid kan een aanwijzing in ieder geval worden geschorst, ten nadele van de certificerende
      instelling worden gewijzigd of worden ingetrokken:

      a. op grond van feiten of omstandigheden waarvan Onze Minister bij het besluit tot aanwijzing redelijkerwijs niet
      op de hoogte kon zijn;

      b. op grond van door de certificerende instelling verstrekte onjuiste inlichtingen over feiten en omstandigheden,
      mits de onjuistheid daarvan aan de certificerende instelling bekend was of kon zijn; of

      c. indien de certificerende instelling niet langer voldoet aan de bij of krachtens dit besluit gestelde eisen.

      3 Ingeval van schorsing kan het besluit daartoe voorzien in voorwaarden met betrekking tot de te verrichten
      werkzaamheden van de certificerende instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel5.2
    url: https://wetten.overheid.nl/BWBR0037866/2016-07-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '5.2'
  - number: '3.6'
    text: |-
      De certificerende instelling meldt onverwijld aan Onze Minister zijn door de rechtbank uitgesproken
      faillietverklaring of surseance van betaling. Onze Minister kan een formulier vaststellen voor de melding.
    url: https://wetten.overheid.nl/BWBR0037866/2016-07-01#Artikel3.6
  - number: '3.7'
    text: |-
      1 De certificerende instelling meldt aan Onze Minister de afgifte, schorsing, weigering of intrekking van een
      certificaat.

      2 De certificerende instelling meldt aan andere door Onze Minister aangewezen certificerende instellingen de
      weigering, schorsing of intrekking van een certificaat.

      3 De certificerende instelling verstrekt desgevraagd kosteloos aan Onze Minister de voor de uitoefening van zijn
      taken genoemd in [artikel 5.5, onderdeel h, van de wet][ref1], benodigde inlichtingen. Onze Minister kan inzage
      vorderen van zakelijke gegevens en bescheiden voor zover dat voor de vervulling van zijn taak redelijkerwijs nodig
      is.

      4 De certificerende instelling zendt Onze Minister jaarlijks een verslag van de uitgevoerde werkzaamheden, de
      rechtmatigheid en doeltreffendheid van die werkzaamheden en de werkwijze in het afgelopen jaar. Bij ministeriële
      regeling kunnen nadere regels worden gesteld met betrekking tot dit verslag.

      5 De Raad voor Accreditatie meldt aan Onze Minister de intrekking of schorsing van een accreditatie van een
      certificerende instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel5.5
