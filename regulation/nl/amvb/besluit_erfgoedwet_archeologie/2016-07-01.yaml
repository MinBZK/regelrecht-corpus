  - number: '2.3'
    text: |-
      1 Het opgravingsverbod in [artikel 5.1, eerste lid, van de wet][ref1], is niet van toepassing op een opgraving die
      wordt verricht door een vereniging die het behouden en beoefenen van archeologie als statutair doel heeft.

      2 De vrijstelling bedoeld in het eerste lid is slechts van toepassing indien:

      a. het terreinen betreft waarvan het college van burgemeester en wethouders of, indien het een gebied betreft dat
      niet tot het grondgebied van een gemeente behoort, het bevoegd gezag voor een omgevingsvergunning als bedoeld in
      [artikel 2.1, eerste lid, onder f, van de Wet algemene bepalingen omgevingsrecht][ref2], heeft vastgesteld dat
      nader archeologisch onderzoek niet is vereist, en

      b. de vereniging niet in opdracht van een derde handelt.

      3 Het eerste lid is niet van toepassing op een:

      a. rijksmonument;

      b. monument of archeologisch monument waarvoor de toezending van het ontwerpbesluit tot aanwijzing als
      rijksmonument op grond van [artikel 3:13, eerste lid, van de Algemene wet bestuursrecht][ref3] heeft
      plaatsgevonden, vanaf de dag van die toezending tot het moment van inschrijving in het rijksmonumentenregister of
      het moment waarop vaststaat dat het monument of archeologisch monument niet wordt ingeschreven in dat register; en

      c. krachtens een provinciale verordening aangewezen monument of archeologisch monument, dan wel een monument of
      archeologisch monument waarop, voordat het is aangewezen, een zodanige verordening van overeenkomstige toepassing
      is.

      4 De [artikelen 5.4, eerste lid][ref4], en [5.6 van de wet][ref5] zijn van overeenkomstige toepassing op de in het
      eerste lid bedoelde opgravingen.


