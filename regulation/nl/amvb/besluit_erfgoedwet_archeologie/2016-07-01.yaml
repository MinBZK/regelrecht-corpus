  - number: '2.2'
    text: |-
      1 Het opgravingsverbod in [artikel 5.1, eerste lid, van de wet][ref1], is niet van toepassing op opgravingen, voor
      zover deze worden verricht met gebruik van een metaaldetector en waarbij de bodem niet dieper verstoord wordt dan
      tot dertig centimeter onder het landoppervlak.

      2 De vrijstelling is niet van toepassing op:

      a. een rijksmonument;

      b. een monument of archeologisch monument waarvoor de toezending van het ontwerpbesluit tot aanwijzing
      als rijksmonument op grond van [artikel 3:13, eerste lid, van de Algemene wet bestuursrecht][ref2] heeft
      plaatsgevonden, vanaf de dag van die toezending tot het moment van inschrijving in het rijksmonumentenregister of
      het moment waarop vaststaat dat het monument of archeologisch monument niet wordt ingeschreven in dat register;

      c. een krachtens een provinciale verordening aangewezen monument of archeologisch monument, dan wel een monument of
      archeologisch monument waarop, voordat het is aangewezen, een zodanige verordening van overeenkomstige toepassing
      is;

      d. gemeentelijke monumenten; en

      e. terreinen waar een opgraving door een certificaathouder of een opgraving op grond van [artikel 2.1][ref3] wordt
      verricht.

      3 [Artikel 5.10 van de wet][ref4] is van overeenkomstige toepassing op de in het eerste lid bedoelde opgravingen.

      4 [Artikel 5.7 van de wet][ref5] is niet van toepassing op de in het eerste lid bedoelde opgravingen.

      5 De gemeenteraad kan voor het gehele grondgebied van de gemeente of voor delen daarvan het eerste lid buiten
      toepassing verklaren.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel5.1
