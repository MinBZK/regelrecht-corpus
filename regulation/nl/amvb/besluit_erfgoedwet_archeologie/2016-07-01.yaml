preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Onderwijs, Cultuur en Wetenschap, van 11 september 2015, nr. WJZ/811629
    (10522), directie Wetgeving en Juridische Zaken;

    Gelet op de artikelen 5.1, tweede lid, en 5.5, van de Erfgoedwet;

    De Afdeling advisering van de Raad van State gehoord (advies van 11 november 2015, nr. W05.15.0317/I);

    Gezien het nader rapport van Onze Minister van Onderwijs, Cultuur en Wetenschap van 1 april 2016, nr. WJZ/870410
    (6723), directie Wetgeving en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0037866/2016-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *aanwijzing:* aanwijzing als bedoeld in [artikel 5.2 van de wet][ref1].
        - *certificaathouder:* degene in het bezit van een certificaat afgegeven door een certificerende instelling;
        - *certificerende instelling:* instelling als bedoeld in [artikel 5.2 van de wet][ref2];
        - *wet:* [Erfgoedwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel5.2
      [ref2]: https://wetten.overheid.nl/BWBR0037521#Artikel5.2
