  - number: '2.4'
    text: |-
      1 Het opgravingsverbod in [artikel 5.1, eerste lid, van de wet][ref1], is niet van toepassing op een opgraving
      die wordt verricht door diegene die in het bezit is van een vergunning, een certificaat of een ander document van
      een andere lidstaat van de Europese Unie en dat ten minste gelijkwaardig is aan het niveau van de eisen die worden
      gesteld bij of krachtens [hoofdstuk 5 van de wet][ref2].

      2 Het eerste lid is slechts van toepassing op diegene die op incidentele basis opgravingen verricht in Nederland.

      3 De [artikelen 5.4, eerste en tweede lid][ref3], en [5.6, van de wet][ref4], zijn van overeenkomstige toepassing
      op de in het eerste lid bedoelde opgravingen.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel5.1
