  - number: '2.1'
    text: |-
      1 Het opgravingsverbod in [artikel 5.1, eerste lid, van de wet][ref1], is niet van toepassing op universiteiten
      en hogescholen als bedoeld in de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2],
      voor zover het opgravingen betreft die zijn verbonden met het onderwijs, bedoeld in
      [artikel 1.3, eerste en derde lid, van die wet][ref3].

      2 De [artikelen 5.4, eerste en tweede lid][ref4], en [5.6, van de wet][ref5], zijn van overeenkomstige toepassing
      op de in het eerste lid bedoelde opgravingen.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel5.1
