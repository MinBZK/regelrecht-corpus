articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *aanwijzing:* aanwijzing als bedoeld in
      [artikel 5.2 van de wet][ref1].
        - *certificaathouder:* degene in het bezit van een certificaat afgegeven door een certificerende instelling;
        - *certificerende instelling:* instelling als bedoeld in [artikel 5.2 van de wet][ref2];
        - *wet:* [Erfgoedwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037521#Artikel5
