    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel2.7
  - number: 2.7.4
    text: |-
      Onze Minister en Onze Ministers van Defensie en van Binnenlandse Zaken en Koninkrijksrelaties stellen een protocol
      vast over de werkwijze met betrekking tot de archeologische waardering.
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel2.7
  - number: 3.1.1
    text: |-
      Onze Minister wijst de richtlijn, bedoeld in [artikel 5.5, onderdeel b, van de wet][ref1], aan.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel5
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '5'
  - number: 3.1.2
    text: |-
      De richtlijn komt voor aanwijzing in aanmerking indien deze in elk geval voorschriften over de volgende onderwerpen
      bevat, zodat een opgraving op professionele wijze wordt verricht:
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.1
  - number: 3.1.2.a
    text: |-
      de verschillende handelingen die worden verricht bij het opgraven door zelfstandig aan te duiden actoren, in
      samenhang met een daartoe geschikt kwaliteitszorgsysteem;
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.1
  - number: 3.1.2.b
    text: het documenteren van de opgraving op zorgvuldige en navolgbare wijze;
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.1
  - number: 3.1.2.c
    text: |-
      het rapporteren over vondsten met het oog op de vergaring en het behoud van kennis over het Nederlandse
      bodemarchief;
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.1
  - number: 3.1.2.d
    text: de wijze van conserveren zodat de vondst behouden blijft; en
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.1
  - number: 3.1.2.e
    text: de wijze waarop wordt omgegaan met tekortkomingen.
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.1
  - number: 3.1.3
    text: Certificerende instellingen verstrekken certificaten met inachtneming van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.1
  - number: 3.1.4
    text: |-
      Een certificaathouder of instelling als bedoeld in [artikel 2.1][ref1] verricht een opgraving overeenkomstig de
      richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037866#Artikel2
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0037866
        artikel: '2'
        hoofdstuk: '2'
  - number: 3.2.1
    text: 'Bij de aanvraag tot aanwijzing als certificerende instelling toont de aanvrager aan dat deze:'
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.2
  - number: 3.2.1.a
    text: rechtspersoonlijkheid heeft;
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.2
  - number: 3.2.1.b
    text: onafhankelijk is van de door haar beoordeelde organisaties, processen, diensten of producten;
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.2
  - number: 3.2.1.c
    text: |-
      beschikt over voldoende kennis, deskundigheid en toerusting om de uitvoering van de taken naar behoren te
      vervullen;
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.2
  - number: 3.2.1.d
    text: |-
      beschikt over een behoorlijke administratie waarin de gegevens die samenhangen met en betrekking hebben op de
      uitvoering van haar taken, op een systematische wijze zijn vastgelegd;
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.2
  - number: 3.2.1.e
    text: verzekerd is tegen wettelijke aansprakelijkheid voor risico’s die voortvloeien uit de uitoefening van haar taken;
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.2
  - number: 3.2.1.f
    text: beschikt over een adequate klachtenregeling;
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.2
  - number: 3.2.1.g
    text: in staat is te beslissen op bezwaar; en
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.2
  - number: 3.2.1.h
    text: in staat is te voldoen aan rapportage- en informatieverplichtingen op grond van dit besluit, jegens Onze Minister.
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.2
  - number: 3.2.2
    text: |-
      De aanvraag gaat vergezeld van een bewijs van accreditatie, als bedoeld in verordening EU nr. 765/2008, voor het
      afgeven van certificaten op basis van de in [artikel 3.1][ref1] genoemde richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037866#Artikel3
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0037866
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.2.3
    text: Aan de aanwijzing kunnen nadere voorschriften verbonden worden.
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.2
  - number: 3.2.4
    text: |-
      De aanwijzing bepaalt voor welke termijn deze wordt verleend. De termijn eindigt in ieder geval op de einddatum van
      de accreditatie.
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.2
  - number: 3.2.5
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste lid. Bij deze
      ministeriële regeling kunnen tevens regels worden gesteld over het indienen en het beslissen op de aanvraag tot
      aanwijzing als certificerende instelling.
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.2
  - number: 3.3.1
    text: De aanvraag voor een certificaat wordt ingediend bij een certificerende instelling.
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.3
  - number: 3.3.2
    text: De certificerende instelling beslist binnen zes maanden na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.3
  - number: 3.3.3
    text: |-
      De aanvrager is aan de certificerende instelling een vergoeding verschuldigd voor de behandeling van de aanvraag
      van een certificaat.
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.3
  - number: 3.3.4
    text: |-
      Bij ministeriële regeling kunnen tarieven worden vastgesteld ten aanzien van de werkzaamheden van de certificerende
      instellingen.
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.3
  - number: 3.4.1
    text: |-
      Van een certificerende instelling die failliet is zijn de afgegeven certificaten ten hoogste zes maanden geldig na
      de datum van het uitspreken van de faillietverklaring.
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.4
  - number: 3.4.2
    text: |-
      Van een certificerende instelling waarvan de aanwijzing is ingetrokken zijn de afgegeven certificaten ten hoogste
      zes maanden geldig na de datum van intrekking.
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.4
  - number: 3.5.1
    text: |-
      Indien een certificerende instelling niet langer beschikt over accreditatie als bedoeld in
      [artikel 5.2 van de wet][ref1], kan Onze Minister de aanwijzing intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel5
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '5'
  - number: 3.5.2
    text: |-
      Onverminderd het eerste lid kan een aanwijzing in ieder geval worden geschorst, ten nadele van de certificerende
      instelling worden gewijzigd of worden ingetrokken:
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.5
  - number: 3.5.2.a
    text: |-
      op grond van feiten of omstandigheden waarvan Onze Minister bij het besluit tot aanwijzing redelijkerwijs niet op
      de hoogte kon zijn;
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.5
  - number: 3.5.2.b
    text: |-
      op grond van door de certificerende instelling verstrekte onjuiste inlichtingen over feiten en omstandigheden, mits
      de onjuistheid daarvan aan de certificerende instelling bekend was of kon zijn; of
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.5
  - number: 3.5.2.c
    text: indien de certificerende instelling niet langer voldoet aan de bij of krachtens dit besluit gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.5
  - number: 3.5.3
    text: |-
      Ingeval van schorsing kan het besluit daartoe voorzien in voorwaarden met betrekking tot de te verrichten
      werkzaamheden van de certificerende instelling.
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.5
  - number: '3.6'
    text: |-
      De certificerende instelling meldt onverwijld aan Onze Minister zijn door de rechtbank uitgesproken
      faillietverklaring of surseance van betaling. Onze Minister kan een formulier vaststellen voor de melding.
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.6
  - number: 3.7.1
    text: |-
      De certificerende instelling meldt aan Onze Minister de afgifte, schorsing, weigering of intrekking van een
      certificaat.
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.7
  - number: 3.7.2
    text: |-
      De certificerende instelling meldt aan andere door Onze Minister aangewezen certificerende instellingen de
      weigering, schorsing of intrekking van een certificaat.
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.7
  - number: 3.7.3
    text: |-
      De certificerende instelling verstrekt desgevraagd kosteloos aan Onze Minister de voor de uitoefening van zijn
      taken genoemd in [artikel 5.5, onderdeel h, van de wet][ref1], benodigde inlichtingen. Onze Minister kan inzage
      vorderen van zakelijke gegevens en bescheiden voor zover dat voor de vervulling van zijn taak redelijkerwijs nodig
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel5
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '5'
  - number: 3.7.4
    text: |-
      De certificerende instelling zendt Onze Minister jaarlijks een verslag van de uitgevoerde werkzaamheden, de
      rechtmatigheid en doeltreffendheid van die werkzaamheden en de werkwijze in het afgelopen jaar. Bij ministeriële
      regeling kunnen nadere regels worden gesteld met betrekking tot dit verslag.
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.7
  - number: 3.7.5
    text: |-
      De Raad voor Accreditatie meldt aan Onze Minister de intrekking of schorsing van een accreditatie van een
      certificerende instelling.
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel3.7
  - number: '5.1'
    text: Dit besluit treedt in werking met ingang van 1 juli 2016.
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel5.1
  - number: '5.2'
    text: 'Dit besluit wordt aangehaald als: Besluit Erfgoedwet archeologie'
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel5.2
