      Bij ministeriële regeling kunnen nadere regels worden gegeven omtrent de aanvraag, wijziging, weigering en
      intrekking van een ontheffing alsmede ten aanzien van de voorschriften bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0037866/2024-04-01#Artikel2.5
