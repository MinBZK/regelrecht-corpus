preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Minister van Defensie van 16 april 1969, nr. P.133.373/C;

    Overwegende, dat het gewenst is de exploitatieuitgaven van de Koninklijke landmacht te verlagen onder meer door
    voor militairen van oudere leeftijd een regeling te treffen die kan leiden tot een vermindering van de feitelijk
    aanwezige sterkte aan militair personeel;

    Gelet op artikel 12 van de Militaire Ambtenarenwet 1931 (Stb. 519);

    De Raad van State gehoord (advies van 14 mei 1969, nr. 47);

    Gezien het nader rapport van Onze voornoemde Minister van 30 mei 1969, nr. P. 133.373/F;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002657/1969-06-07#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van het bij of krachtens dit besluit bepaalde wordt verstaan onder:

      a. *Onze Minister*: Onze Minister van Defensie;

      b. *Militair*:

      1. de officier, op wie het gestelde in artikel 81 A van de Wet bevordering en ontslag beroepsofficieren (*Stb.*
      1954, 575) van toepassing is;

      2. de tot het reserve-personeel behorende officier van de landmacht, wiens vrijwillig dienstverband hem tot
      doorlopende werkelijke dienst verplicht;

      3. de beroepsmilitair beneden de rang van tweede-luitenant behorende tot de Koninklijke landmacht, op wie
      het gestelde in artikel 116 B van het Reglement voor de militaire ambtenaren der Koninklijke Landmacht en der
      Koninklijke Luchtmacht (*Stb.* 1931, 378) van toepassing is;

      c. laatstelijk genoten bezoldiging:

      1e. van de datum van ontheffing van de uitoefening van de functie als bedoeld in [artikel 2][ref1], af tot aan
      het tijdstip, bedoeld onder 2e: de som van de bij het vaststellen van de pensioengrondslag in beschouwing te nemen
      inkomsten en baten - in geld uitgedrukt -, waarop de militair op de dag voorafgaande aan de hiervoren bedoelde
      datum aanspraak had of zou hebben gehad, met uitzondering van de geldswaarde van het emolument vrije geneeskundige
      behandeling;

      2e. van de datum af, waarop, indien de militair in dezelfde rang of stand en klasse zijn functie was blijven
      uitoefenen, de onder 1e bedoelde som een ander bedrag zou hebben belopen: dat andere bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002657#Artikel2
    url: https://wetten.overheid.nl/BWBR0002657/1969-06-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002657
        artikel: '2'
  - number: '2'
    text: |-
      1 Tot 1 januari 1975 kan de militair, die de leeftijd van vijfenvijftig jaren heeft bereikt of overschreden, op
      zijn daartoe gedaan verzoek door Onze Minister eervol van de uitoefening van zijn functie worden ontheven en in
      afwachting van de dag waarop hij ter zake van het bereiken of overschrijden van die leeftijd zal worden ontslagen,
      huiswaarts worden gezonden.

      2 Onze Minister stelt regelen vast betreffende de toepassing van hetgeen in het vorige lid is bepaald.
    url: https://wetten.overheid.nl/BWBR0002657/1969-06-07#Artikel2
  - number: '3'
    text: |-
      1 Gedurende de tijd, dat de militair op grond van artikel 2 van de uitoefening van zijn functie is ontheven,
      ontvangt hij 80 percent van de laatstelijk genoten bezoldiging, vermeerderd met zoveel - doch ten hoogste 10 -
      malen 0,5 percent van die bezoldiging als het totaal aantal volle pensioengeldige dienstjaren op de dag van ingang
      van de ontheffing van de uitoefening van de functie meer dan 30 bedraagt.

      2 Gedurende de in het vorige lid bedoelde tijd, zijn op de militair de
      [artikelen 5, 6 en 8 van de Uitkeringswet gewezen militairen][ref1] (*Stb.* 1966, 451) van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002540#Artikel5
    url: https://wetten.overheid.nl/BWBR0002657/1969-06-07#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002540
        artikel: '5'
  - number: '4'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin het
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0002657/1969-06-07#Artikel4
