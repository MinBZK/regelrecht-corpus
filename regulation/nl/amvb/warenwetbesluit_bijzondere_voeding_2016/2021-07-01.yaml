    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport van 8 december 2015, 874753-144568-VGP;

    Gelet op Verordening (EU) nr. 609/2013 van het Europees Parlement en de Raad van 12 juni 2013 inzake voor
    zuigelingen en peuters bedoelde levensmiddelen, voeding voor medisch gebruik en de dagelijkse voeding volledig
    vervangende producten voor gewichtsbeheersing, en tot intrekking van Richtlijn 92/52/EEG van de Raad, Richtlijnen
    96/8/EG, 1999/21/EG, 2006/125/EG en 2006/141/EG van de Commissie, Richtlijn 2009/39/EG van het Europees Parlement
    en de Raad en de Verordeningen (EG) nr. 41/2009 en (EG) nr. 953/2009 van de Commissie (PbEU 2013, L 181), alsmede
    op de artikelen 13 en 14 van de Warenwet;

    De Afdeling advisering van de Raad van State gehoord (advies van 15 januari 2016, nr. W13.15.0432/III);

    Gezien het nader rapport van Onze Minister van Volksgezondheid, Welzijn en Sport van 29 maart 2016, 874747-144568-
    VGP;

