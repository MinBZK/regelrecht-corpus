articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: - *verordening (EU) 609/2013:* Verordening (EU) nr. 609/2013 van het Europees
      Parlement en de Raad van 12 juni 2013 inzake voor zuigelingen en peuters bedoelde levensmiddelen, voeding voor
      medisch gebruik en de dagelijkse voeding volledig vervangende producten voor gewichtsbeheersing, en tot intrekking
      van [Richtlijn 92/52/EEG](31992L0052) van de Raad, [Richtlijnen 96/8/EG](31996L0008), [1999/21/EG](31999L0021),
      [2006/125/EG](32006L0125) en [2006/141/EG](32006L0141) van de Commissie, [Richtlijn 2009/39/EG](32009L0039) van het
      Europees Parlement en de Raad en de [Verordeningen (EG) nr. 41/2009](32009R0041) en [(EG) nr. 953/2009](32009R0953)
      van de Commissie (PbEU 2013, L 181).
    url: https://wetten.overheid.nl/BWBR0037883/2021-07-01#Artikel1
  - number: '2'
    text: |-
      Het is verboden te handelen in strijd met de voorschriften die gesteld zijn bij of krachtens de artikelen 4, eerste
      en tweede lid, 6, eerste lid, 9, eerste lid, tweede lid, eerste alinea, derde lid, en vijfde lid, 10, eerste lid
      en tweede lid, eerste alinea, 11, eerste lid en tweede lid, eerste alinea, en 15, eerste, vierde, vijfde en zevende
      lid, van verordening (EU) 609/2013.
    url: https://wetten.overheid.nl/BWBR0037883/2021-07-01#Artikel2
  - number: 2a
    text: |-
      Onze Minister kan nadere regels stellen ter uitvoering van bindende onderdelen van [verordening (EU) 609/2013]
      (32013R0609) en daarop gebaseerde bindende EU-rechtshandelingen.
    url: https://wetten.overheid.nl/BWBR0037883/2021-07-01#Artikel2a
  - number: '6'
    text: Dit besluit treedt in werking met ingang van 20 juli 2016.
    url: https://wetten.overheid.nl/BWBR0037883/2021-07-01#Artikel6
  - number: '7'
    text: 'Dit besluit wordt aangehaald als: Warenwetbesluit bijzondere voeding 2016.'
    url: https://wetten.overheid.nl/BWBR0037883/2021-07-01#Artikel7
