preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Landbouw en Visserij van 11 maart 1986, nr. J 1408, Directie
    Juridische en Bedrijfsorganisatorische Zaken, gedaan in overeenstemming met de Staatssecretaris van Welzijn,
    Volksgezondheid en Cultuur;

    Gelet op artikel 21, eerste lid, en artikel 28 van de Diergeneesmiddelenwet (Stb. 1985, 410);

    Gehoord de Dibevo, de Vereniging van Fabrikanten en Groothandelaren in Veterinaire Produkten (Fagrovet), de
    Vereniging van Fabrikanten en Importeurs van Diergeneesmiddelen in Nederland (Fidin), de Koninklijke Nederlandse
    Maatschappij voor Diergeneeskunde, de Vereniging van Fabrikanten en Importeurs van Toevoegingsmiddelen (Nefato) en
    de Nederlandse Associatie van Homeopatische Farmaceutische Ondernemingen (Nehoma);

    Gehoord de Raad van State (advies van 15 mei 1986, nr. W 11.86.0136);

    Gezien het nader rapport van Onze Minister van Landbouw en Visserij van 18 augustus 1986, nr. J. 3527, Directie
    Juridische en Bedrijfsorganisatorische Zaken, uitgebracht in overeenstemming met de Staatssecretaris van Welzijn,
    Volksgezondheid en Cultuur;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004027/1987-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      [Artikel 21, eerste lid, van de Diergeneesmiddelenwet][ref1] (*Stb.* 1985, 410) is niet van toepassing op het
      afleveren aan houders van dieren van andere diergeneesmiddelen dan die waarvoor een wachttermijn als bedoeld in
      artikel 6, derde lid, onderdeel *c*, van die wet geldt en die niet door degene die aflevert rechtstreeks zijn
      geïmporteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0004027/1987-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
  - number: '2.1'
    text: |-
      Dit besluit treedt in werking met ingang van het tijdstip waarop [Hoofdstuk III van de Diergeneesmiddelenwet][ref1]
      (*Stb.* 1985, 410) in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0004027/1987-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003818
        hoofdstuk: III
  - number: '2.2'
    text: 'Dit besluit kan worden aangehaald als: "Besluit uitzondering vergunningplicht diergeneesmiddelen".'
    url: https://wetten.overheid.nl/BWBR0004027/1987-07-01#Artikel2
