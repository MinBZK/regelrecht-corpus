  - number: '37'
    text: |-
      1 Subsidie, verleend op grond van het [Besluit rijkssubsidiëring restauratie monumenten 1997][ref1],
      het [Besluit rijkssubsidiëring onderhoud monumenten][ref2], het
      [Besluit rijkssubsidiëring historische buitenplaatsen][ref3] en het
      [Besluit rijkssubsidiëring instandhouding monumenten][ref4], wordt afgehandeld overeenkomstig die besluiten.

      2 De rechten en verplichtingen die krachtens een beschikking op grond van een in het eerste lid genoemd besluit
      gelden, blijven gelden voor zover bij of krachtens dit besluit niet anders is bepaald.

      3 Onze minister kan toestaan dat het afleggen van rekening en verantwoording van subsidie, verleend op grond van
      het [Besluit rijkssubsidiëring instandhouding monumenten][ref5], geschiedt overeenkomstig dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0008615
      [ref2]: https://wetten.overheid.nl/BWBR0004654
