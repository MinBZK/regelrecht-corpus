  - number: '35'
    text: |-
      1 In dit artikel wordt verstaan onder restauratie: het verrichten van die werkzaamheden, de normale instandhouding
      te boven gaand, die voor het herstel van een beschermd monument noodzakelijk zijn.

      2 Onverminderd [artikel 3][ref1], eerste lid, kan Onze minister aan een eigenaar als bedoeld in
      [artikel 4, eerste lid][ref2], subsidie verstrekken in de kosten ten behoeve van de restauratie van een beschermd
      monument.

      3 Subsidie als bedoeld in dit artikel wordt voor beschermde monumenten of zelfstandige onderdelen op aanvraag
      verleend.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het verstrekken van subsidie op
      grond van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0028785#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028785#Artikel4
    url: https://wetten.overheid.nl/BWBR0028785/2011-01-01#Artikel35
