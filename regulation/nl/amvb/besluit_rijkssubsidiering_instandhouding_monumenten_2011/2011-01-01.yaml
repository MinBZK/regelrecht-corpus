  - number: '2'
    text: |-
      1 Onze minister draagt er zorg voor dat eigenaren van woonhuizen een lening kunnen verkrijgen ter financiering van
      de kosten van de instandhouding van het beschermd monument of het zelfstandig onderdeel, met dien verstande dat:

      a. de lening kan worden verstrekt met als zekerheid het recht van hypotheek op het beschermd monument,

      b. de fiscaal aftrekbare onderhoudskosten zoals die door de Belastingdienst worden gehanteerd, als grondslag dienen
      voor het bepalen van de hoogte van de lening,

      c. het maximumbedrag per lening en de voorwaarden waaronder de lening wordt verstrekt, worden bekendgemaakt in
      de Staatscourant,

      d. voor een eigenaar die recht op fiscale aftrek van onderhoudskosten heeft, de lening maximaal 70% van de
      vastgestelde fiscaal aftrekbare onderhoudskosten bedraagt,

      e. voor een eigenaar die geen recht op fiscale aftrek van onderhoudskosten kan genieten, de lening maximaal
      100% van de voor de hoogte van de lening door de Belastingdienst fictief vastgestelde fiscaal aftrekbare
      onderhoudskosten bedraagt, en

      f. Onze minister een bedrag kan vaststellen dat gedurende een bepaald tijdvak ten hoogste beschikbaar is voor de
      verstrekking van leningen.

      2 Provincies, gemeenten, waterschappen en openbare lichamen die zijn ingesteld met toepassing van de
      [Wet gemeenschappelijke regelingen][ref1], komen niet in aanmerking voor een lening als bedoeld in het eerste lid.

      3 Onze minister kan de eigenaar die geen recht op fiscale aftrek van onderhoudskosten heeft, verplichten een
      verklaring van de Belastingdienst te overleggen, waarin is vastgesteld dat geen aftrek mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0028785/2011-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: '3'
    text: |-
      1 Onze minister kan voor een periode van zes kalenderjaren aan de eigenaar van een beschermd monument of een
      zelfstandig onderdeel subsidie verstrekken ten behoeve van de instandhouding van een beschermd monument of een
      zelfstandig onderdeel.

      2 Bij ministeriële regeling worden voorschriften gegeven omtrent de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0028785/2011-01-01#Artikel3
  - number: '4'
    text: |-
      1 Voor subsidie op grond van dit hoofdstuk komen in aanmerking:

      a. aangewezen organisaties voor monumentenbehoud,

      b. provincies, gemeenten, waterschappen en openbare lichamen die zijn ingesteld met toepassing van de
      [Wet gemeenschappelijke regelingen][ref1], en

      c. overige eigenaren voor zover zij eigenaar zijn van andere beschermde monumenten dan woonhuizen.

      2 Eigenaren als bedoeld in het eerste lid, onderdelen a en c, kunnen in plaats van subsidie een lening als bedoeld
      in [artikel 2][ref2] aanvragen, met dien verstande dat een eigenaar waarvan een subsidieaanvraag in enig jaar is
      afgewezen, in datzelfde jaar niet alsnog een lening kan aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
      [ref2]: https://wetten.overheid.nl/BWBR0028785#Artikel2
    url: https://wetten.overheid.nl/BWBR0028785/2011-01-01#Artikel4
    references:
      - id: ref1
