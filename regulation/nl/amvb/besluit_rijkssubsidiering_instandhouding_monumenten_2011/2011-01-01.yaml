articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. *wet:* [Monumentenwet 1988][ref1],

      b. *eigenaar:* natuurlijke persoon of rechtspersoon die het recht van eigendom of een ander zakelijk recht heeft op
      een beschermd monument,

      c. *subsidiabele kosten:* kosten die naar het oordeel van Onze minister noodzakelijk zijn om een beschermd monument
      in stand te houden,

      d. *instandhoudingsplan:* instandhoudingsplan als bedoeld in [artikel 11][ref2],

      e. *inspectierapport:* rapport met betrekking tot een beschermd monument dat de technische of fysieke staat van dat
      monument beschrijft, en dat is opgesteld door een ter zake deskundige persoon of instantie,

      f. *woonhuizen:* beschermde monumenten of zelfstandige onderdelen die in oorsprong zijn vervaardigd voor bewoning
      of die thans voor meer dan de helft van de oppervlakte voor bewoning in gebruik zijn, met dien verstande dat niet
      als woonhuizen worden aangemerkt: woonhuizen die als museum zijn geregistreerd, kerkgebouwen, kastelen, paleizen,
      het hoofdhuis van buitenplaatsen, landhuizen, gebouwen van liefdadigheid, molens, gemalen, agrarische gebouwen
      en watertorens,

      g. *kerkgebouw:* beschermd monument of zelfstandig onderdeel, dat in oorsprong uitsluitend of voor een overwegend
      deel is vervaardigd voor het gezamenlijk belijden van de godsdienst of levensovertuiging,

      h. *zelfstandig onderdeel:* onderdeel van een beschermd monument dat:

      1°. is aan te merken als een zelfstandige bouwkundige eenheid,

      2°. is aan te merken als een toren van een kerkgebouw,

      3°. deel is van een park- of tuinaanleg, dan wel andere aanleg, dat aan één eigenaar behoort, of

      4°. deel is van een beschermd archeologisch monument, welk deel aan één eigenaar behoort, en

      i. *aangewezen organisaties voor monumentenbehoud:* organisaties als bedoeld in [artikel 33][ref3].

      2 Voor de toepassing van dit besluit wordt onderscheid gemaakt in categorieën beschermde monumenten en zelfstandige
      onderdelen. De onderscheiden categorieën zijn:

      a. woonhuizen,

      b. kerkgebouwen, en

      c. overige.


      [ref1]: https://wetten.overheid.nl/BWBR0004471
      [ref2]: https://wetten.overheid.nl/BWBR0028785#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0028785#Artikel33
