  - number: '5'
    text: Onze minister kan ieder jaar een of meer subsidieplafonds vaststellen voor het verstrekken van subsidie.
    url: https://wetten.overheid.nl/BWBR0028785/2011-01-01#Artikel5
  - number: '6'
    text: |-
      1 Bij ministeriële regeling kan een maximumbedrag aan subsidiabele kosten worden vastgesteld waarover per aanvraag
      subsidie kan worden verstrekt voor woonhuizen, kerkgebouwen en overige.

      2 Bij ministeriële regeling kan een afzonderlijk maximumbedrag aan subsidiabele kosten worden vastgesteld voor
      aanvragen waarvan de subsidiabele kosten hoger zijn dan een bij ministeriële regeling te bepalen bedrag.
    url: https://wetten.overheid.nl/BWBR0028785/2011-01-01#Artikel6
  - number: '7'
    text: |-
      Subsidie wordt slechts verleend voor zover deze noodzakelijk is voor de instandhouding van het beschermd monument
      en voor zover de werkzaamheden ter uitvoering van het instandhoudingsplan naar het oordeel van Onze minister sober
      en doelmatig zijn.
    url: https://wetten.overheid.nl/BWBR0028785/2011-01-01#Artikel7
  - number: '8'
    text: |-
      Onverminderd [artikel 4:35 van de Algemene wet bestuursrecht][ref1] wordt de subsidie in ieder geval niet
      verstrekt:

      a. voor zover in de subsidiabele kosten subsidie is verstrekt op grond van een andere rijkssubsidieregeling,

      b. voor zover bij schade de subsidiabele kosten op grond van een verzekering worden gedekt dan wel voor zover de
      subsidiabele kosten op grond van de [Wet op de omzetbelasting][ref2] op verschuldigde belasting in aftrek kunnen
      worden gebracht dan wel anderszins niet ten laste van de aanvrager komen, of

      c. voor zover met de werkzaamheden is begonnen voordat Onze minister de subsidie heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel435
      [ref2]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0028785/2011-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:35
      - id: ref2
        bwb_id: BWBR0002629
  - number: '9'
    text: |-
      1 Subsidie wordt op aanvraag verleend voor één of meer beschermde monumenten of zelfstandige onderdelen.

      2 De aanvraag kan van 15 januari tot en met 31 augustus voorafgaand aan het eerste kalenderjaar waarop het
      instandhoudingsplan betrekking heeft, worden ingediend. Aanvragen die zijn ingediend vóór 15 januari of na 31
      augustus, worden afgewezen.

      3 Per beschermd monument of per zelfstandig onderdeel kan slechts eenmaal voor een periode waarop een
      instandhoudingsplan betrekking heeft, subsidie worden verleend.
    url: https://wetten.overheid.nl/BWBR0028785/2011-01-01#Artikel9
  - number: '10'
    text: |-
      1 De subsidieaanvraag wordt ingediend op een door Onze minister vastgesteld formulier.

      2 De subsidieaanvraag gaat in ieder geval vergezeld van:

      a. een actueel inspectierapport per beschermd monument of per zelfstandig onderdeel, en

      b. een instandhoudingsplan per beschermd monument of per zelfstandig onderdeel, of een gecombineerd
      instandhoudingsplan als bedoeld in [artikel 34][ref1].

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld over andere bij de aanvraag te overleggen
      bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0028785#Artikel34
    url: https://wetten.overheid.nl/BWBR0028785/2011-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028785
        artikel: '34'
        hoofdstuk: '4'
  - number: '11'
    text: |-
      1 Het instandhoudingsplan omvat een overzicht van de aard en omvang van de voorgenomen werkzaamheden en een
      omschrijving van de daarmee beoogde resultaten. Het instandhoudingsplan omvat ook een meerjarenbegroting. In het
      instandhoudingsplan wordt aangegeven in welk jaar de onderscheiden werkzaamheden plaatsvinden.

      2 Het instandhoudingsplan heeft betrekking op zes kalenderjaren.

      3 Het instandhoudingsplan wordt ingediend volgens een door Onze minister vastgesteld model.
    url: https://wetten.overheid.nl/BWBR0028785/2011-01-01#Artikel11
  - number: '12'
    text: |-
      1 Onze minister verdeelt het voor subsidieverlening beschikbare bedrag in de volgorde
      van ontvangst van de aanvragen, met dien verstande dat wanneer de aanvrager krachtens
      [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad de subsidieaanvraag aan te vullen,
      de dag waarop de aanvullende informatie is ontvangen met betrekking tot de verdeling als datum van ontvangst geldt.

      2 Indien op grond van [artikel 5][ref2] subsidieplafonds zijn vastgesteld voor de toepassing van
      [artikel 6, eerste of tweede lid][ref3], wordt het eerste lid toegepast op de afzonderlijke beschikbare bedragen.

      3 Bij ministeriële regeling kunnen nadere regels worden gegeven voor de verdeling van het beschikbare bedrag indien
      een subsidieplafond dreigt te worden overschreden of wordt overschreden als gevolg van het aantal aanvragen dat op
      dezelfde dag wordt ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0028785#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0028785#Artikel6
    url: https://wetten.overheid.nl/BWBR0028785/2011-01-01#Artikel12
