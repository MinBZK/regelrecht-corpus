  - number: '38'
    text: |-
      1 Bij ministeriële regeling worden de beschermde monumenten en zelfstandige onderdelen aangewezen waarvan, en de
      kalenderjaren waarin, eigenaren in aanmerking komen voor subsidie.

      2 Voor zover dit besluit op grond van het eerste lid nog niet van toepassing is, blijft het
      [Besluit rijkssubsidiëring onderhoud monumenten][ref1] van toepassing.

      3 De eigenaar van een beschermd monument of een zelfstandig onderdeel waarop dit besluit van toepassing is, komt in
      aanmerking voor subsidie met ingang van 1 januari van het eerste jaar waarop het instandhoudingsplan van toepassing
      is.

      4 Aanvragen op grond van de [artikelen 8][ref2] en [9 van het Besluit rijkssubsidiëring onderhoud monumenten][ref3]
      blijven mogelijk tot 1 april van het eerste jaar waarop de eigenaar van een beschermd monument of
      een zelfstandig onderdeel in aanmerking komt voor subsidie, en worden afgehandeld overeenkomstig het
      [Besluit rijkssubsidiëring onderhoud monumenten][ref4].

      5 De gefaseerde inwerkingtreding, bedoeld in dit artikel, geldt niet voor subsidieverlening op grond van
      [artikel 35][ref5].


