        hoofdstuk: '3'
        paragraaf: '1'
  - number: '13'
    text: |-
      1 Een subsidie ten laste van een begroting die nog niet is vastgesteld, wordt verleend onder de voorwaarde, bedoeld
      in [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref1].

      2 In geval van het niet vervullen van de voorwaarde, bedoeld in
      [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref2], worden de op grond van dit besluit verleende
      subsidiebedragen verlaagd tot het bedrag van de subsidie dat na de vaststelling of goedkeuring van de begroting ter
      beschikking staat, een en ander naar rato van het aantal subsidieaanvragers aan wie subsidie is verleend en van de
      hoogte van de verleende subsidiebedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel434
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel434
    url: https://wetten.overheid.nl/BWBR0028785/2011-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:34
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:34
  - number: '14'
    text: |-
      1 Onze minister beslist binnen dertien weken op de subsidieaanvraag.

      2 Onze minister deelt de beschikking, bedoeld in het eerste lid, dan wel een beschikking tot wijziging of
      intrekking van die beschikking mee aan burgemeester en wethouders van de gemeente waar het beschermd monument is
      gelegen, en aan gedeputeerde staten van de provincie waar het beschermd monument is gelegen.
    url: https://wetten.overheid.nl/BWBR0028785/2011-01-01#Artikel14
  - number: '15'
    text: |-
      1 De subsidie bedraagt per aanvraag het volgende percentage van de subsidiabele kosten:

      a. bij woonhuizen van aangewezen organisaties voor monumentenbehoud: 25%,

      b. bij kerkgebouwen: 65%, en

      c. bij overige: 60%.

      2 Als een aanvraag beschermde monumenten of zelfstandige onderdelen uit zowel de categorie kerkgebouwen als de
      categorie overige omvat, geldt het percentage dat geldt voor kerkgebouwen.
    url: https://wetten.overheid.nl/BWBR0028785/2011-01-01#Artikel15
  - number: '16'
    text: |-
      Voor provincies, gemeenten, waterschappen en openbare lichamen die zijn ingesteld met toepassing van de
      [Wet gemeenschappelijke regelingen][ref1], bedraagt de subsidie 30% van de subsidiabele kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0028785/2011-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: '17'
    text: |-
      Subsidies worden niet verstrekt indien het bedrag dat overeenkomstig de bepalingen van dit besluit zou worden
      verstrekt, lager is dan € 3.000, met dien verstande dat subsidies voor beschermde archeologische monumenten niet
      worden verstrekt indien het bedrag lager is dan € 1.500.
    url: https://wetten.overheid.nl/BWBR0028785/2011-01-01#Artikel17
  - number: '18'
    text: |-
      Onze minister kan de eigenaar verplichten:

      a. mee te werken aan een onderzoek naar de bouw- of ontstaansgeschiedenis van het beschermd monument,

      b. de aanbesteding en de gunning van de werkzaamheden waarvoor subsidie is verleend, op een door Onze minister te
      bepalen wijze te doen plaatsvinden,

      c. Onze minister tussentijds te berichten over de voortgang van werkzaamheden, of

      d. mee te werken aan een onderzoek naar de uitvoering van het instandhoudingsplan door een deskundige.
    url: https://wetten.overheid.nl/BWBR0028785/2011-01-01#Artikel18
  - number: '19'
    text: |-
      De eigenaar doet onverwijld een schriftelijke melding aan de Rijksdienst voor het Cultureel Erfgoed zodra
      aannemelijk is dat de activiteiten waarvoor de subsidie is verleend niet, niet tijdig of niet geheel zullen
      worden verricht of dat niet, niet tijdig of niet geheel aan de aan de subsidie verbonden verplichtingen zal worden
      voldaan.
    url: https://wetten.overheid.nl/BWBR0028785/2011-01-01#Artikel19
  - number: '20'
    text: |-
      Onze minister kan de eigenaar verplichten:

      a. voor de duur van de werkzaamheden waarvoor subsidie is verleend, een Casco-All-Risks verzekering af te sluiten,
      of

      b. vanaf de aanvang van de werkzaamheden waarvoor subsidie is verleend, op zijn kosten het beschermd monument of
      het zelfstandig onderdeel te verzekeren dan wel verzekerd te houden tegen brand-, storm- en bliksemschade en na
      afloop van de werkzaamheden daartegen verzekerd te houden.
    url: https://wetten.overheid.nl/BWBR0028785/2011-01-01#Artikel20
  - number: '21'
    text: |-
      Onze minister kan de eigenaar verplichten het beschermd monument of het zelfstandig onderdeel te voorzien van
      een of meer installaties ter beperking van schade als gevolg van brand of blikseminslag, ter bescherming van de
      monumentale waarde van het beschermd monument of het zelfstandig onderdeel.
    url: https://wetten.overheid.nl/BWBR0028785/2011-01-01#Artikel21
  - number: '22'
    text: |-
      Onze minister kan de eigenaar verplichten om advies te vragen aan de Rijksdienst voor het Cultureel Erfgoed
      alvorens met de werkzaamheden ter uitvoering van het instandhoudingsplan wordt gestart indien de monumentale waarde
      van het beschermd monument of het zelfstandig onderdeel of de voorgenomen werkzaamheden daartoe aanleiding vormen.
    url: https://wetten.overheid.nl/BWBR0028785/2011-01-01#Artikel22
  - number: '23'
    text: |-
      Onze minister kan de eigenaar verplichten om de werkzaamheden onder nader door hem te stellen voorwaarden te doen
      begeleiden indien voor de uitvoering van het instandhoudingsplan specifieke kennis is vereist.
    url: https://wetten.overheid.nl/BWBR0028785/2011-01-01#Artikel23
  - number: '24'
    text: |-
      De eigenaar is verplicht na afloop van de werkzaamheden waarvoor subsidie is verleend, het beschermd monument
      of het zelfstandig onderdeel te bewaren en te onderhouden in de staat waarin het door de werkzaamheden waarvoor
      subsidie is verleend, is gebracht.
    url: https://wetten.overheid.nl/BWBR0028785/2011-01-01#Artikel24
  - number: '25'
    text: |-
      Indien de subsidie minder dan € 25.000 bedraagt, toont de subsidieontvanger op verzoek van Onze minister aan dat
      de activiteiten waarvoor de subsidie is verleend, zijn verricht en dat is voldaan aan de aan de subsidie verbonden
      verplichtingen. Bij ministeriële regeling of bij beschikking wordt aangegeven op welke wijze dit wordt aangetoond.
    url: https://wetten.overheid.nl/BWBR0028785/2011-01-01#Artikel25
  - number: '26'
    text: |-
      1 Indien de subsidie € 25.000 of meer bedraagt, toont de subsidieontvanger aan de hand van een prestatieverklaring
      aan dat de activiteiten waarvoor de subsidie is verleend, zijn verricht en dat is voldaan aan de aan de subsidie
      verbonden verplichtingen.

      2 Onze minister kan voor de prestatieverklaring een model vaststellen.

      3 De prestatieverklaring gaat vergezeld van een inspectierapport per beschermd monument of per zelfstandig
      onderdeel, dat is opgesteld na afloop van het verrichten van de in het instandhoudingsplan aangegeven
      werkzaamheden.

      4 De inrichting van de prestatieverklaring komt overeen met de inrichting van het instandhoudingsplan.

      5 De prestatieverklaring bevat, voor zover van toepassing, een toelichting op verschillen tussen de voorgenomen
      activiteiten en de beoogde resultaten, vermeld in het instandhoudingsplan, en de feitelijke realisatie.

      6 Onverminderd het bepaalde in het eerste tot en met vijfdelid, toont de subsidieontvanger op verzoek van Onze
      minister aan dat de activiteiten waarvoor de subsidie is verleend, zijn verricht en dat is voldaan aan de aan de
      subsidie verbonden verplichtingen. Bij ministeriële regeling of bij beschikking wordt aangegeven op welke wijze dit
      wordt aangetoond.
    url: https://wetten.overheid.nl/BWBR0028785/2011-01-01#Artikel26
  - number: '27'
    text: |-
      1 Indien de subsidie € 125.000 of meer bedraagt, legt de subsidieontvanger rekening en verantwoording af aan de
      hand van een financieel verslag. [Artikel 4:76 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige
      toepassing.

      2 Onze minister kan voor het financieel verslag een model vaststellen.

      3 Onze minister kan de subsidieontvanger verplichten het financieel verslag vergezeld te doen gaan van een
      verklaring van een accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2].

      4 In de verklaring, bedoeld in het derde lid, verklaart de accountant dat de bedragen in het financieel
      verslag juist zijn en doet hij tevens een uitspraak over de naleving door de subsidieontvanger van de in het
      controleprotocol genoemde voorschriften.

      5 De subsidieontvanger bedingt bij de accountant dat deze zijn onderzoek inricht overeenkomstig een door Onze
      minister vast te stellen controleprotocol.

      6 Onze minister kan de subsidieontvanger verplichten de desbetreffende originele rekeningen en betalingsbewijzen
      te overleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel476
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0028785/2011-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:76
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '28'
    text: |-
      1 Een aanvraag tot subsidievaststelling vindt plaats uiterlijk op 30 april na afloop van het laatste kalenderjaar
      waarop het instandhoudingsplan betrekking heeft. Indien de verleende subsidie minder dan € 25.000 bedraagt, wordt
      deze vastgesteld zonder aanvraag daartoe.

      2 Een beschikking tot subsidievaststelling wordt gegeven:

      a. indien de verleende subsidie minder dan € 25.000 bedraagt, binnen 22 weken na afloop van het laatste
      kalenderjaar waarop het instandhoudingsplan betrekking heeft, en

      b. indien de verleende subsidie € 25.000 of meer bedraagt binnen 22 weken na ontvangst van de aanvraag tot
      vaststelling.

      3 Een afschrift van de beschikking tot vaststelling van de subsidie zendt Onze minister aan burgemeester en
      wethouders van de gemeente waar het beschermd monument is gelegen, en aan gedeputeerde staten van de provincie waar
      het beschermd monument is gelegen.
    url: https://wetten.overheid.nl/BWBR0028785/2011-01-01#Artikel28
  - number: '29'
    text: |-
      Onverminderd [artikel 4:46 van de Algemene wet bestuursrecht][ref1] kan de subsidie in ieder geval lager dan de
      verlening worden vastgesteld indien werkzaamheden waarvoor subsidie is verleend, zijn verricht in strijd met het
      bij of krachtens de wet bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel446
    url: https://wetten.overheid.nl/BWBR0028785/2011-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:46
  - number: '30'
    text: |-
      1 Indien de subsidieontvanger de eigendom of een ander zakelijk recht van een beschermd monument of een
      zelfstandig onderdeel overdraagt aan een derde, dient de subsidieontvanger binnen drie maanden na de overdracht
      een aanvraag tot vaststelling van de subsidie in bij Onze minister. De [artikelen 25 tot en met 29][ref1] zijn van
      overeenkomstige toepassing.

      2 Na de vaststelling, bedoeld in het eerste lid, kan Onze minister op verzoek van de eigenaar aan wie de eigendom
      of het zakelijk recht is overgedragen, aan die eigenaar subsidie verstrekken ten behoeve van de afronding van het
      instandhoudingsplan. [Artikel 12][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028785#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0028785#Artikel12
    url: https://wetten.overheid.nl/BWBR0028785/2011-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0028785
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0028785
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '31'
    text: |-
      1 Indien de subsidie minder dan € 25.000 bedraagt verleent Onze minister de eigenaar een voorschot van 100% van
      het subsidiebedrag.

      2 Indien de subsidie € 25.000 of meer bedraagt, kan Onze minister de eigenaar een voorschot verlenen tot 100% van
      het subsidiebedrag. De verlening van het voorschot geschiedt gelijktijdig met de beschikking tot subsidieverlening.

      3 De uitkering van het voorschot geschiedt in jaarlijkse of meerjaarlijkse termijnen.

      4 De uitkering van het voorschot geschiedt op bij ministeriële regeling of bij beschikking aan te geven
      tijdstippen.
    url: https://wetten.overheid.nl/BWBR0028785/2011-01-01#Artikel31
  - number: '32'
    text: |-
      1 De subsidieontvanger is na de subsidievaststelling verplicht een teveel aan ontvangen voorschot onverwijld terug
      te betalen, tenzij Onze minister tot verrekening op andere wijze heeft besloten.

      2 Bij terugvordering van onverschuldigd betaalde subsidiebedragen of voorschotten kan Onze minister de
      subsidieontvanger verplichten de met de terugvordering verband houdende kosten te voldoen. Tevens kan Onze minister
      in dat geval de wettelijke rente vorderen.
    url: https://wetten.overheid.nl/BWBR0028785/2011-01-01#Artikel32
  - number: '33'
    text: |-
      1 Onze minister wijst op aanvraag een organisatie die zich de instandhouding van monumenten ten doel stelt, aan als
      organisatie voor monumentenbehoud indien:

      a. de organisatie een privaatrechtelijke rechtspersoon is,

      b. de organisatie ten minste 20 beschermde monumenten in eigendom heeft, en

      c. de organisatie naar het oordeel van Onze minister beschikt over voldoende professionele deskundigheid.

      2 Onze minister kan de aanwijzing intrekken indien een organisatie niet meer voldoet aan een van de in het eerste
      lid bedoelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0028785/2011-01-01#Artikel33
  - number: '34'
    text: |-
      1 In afwijking van [artikel 11][ref1] kan een aangewezen organisatie voor monumentenbehoud instandhoudingsplannen
      samenvoegen tot een gecombineerd instandhoudingsplan dat betrekking heeft op meerdere beschermde monumenten. In
      dat plan worden per beschermd monument of per zelfstandig onderdeel de aard, de omvang en de geraamde kosten van de
      voorgenomen werkzaamheden over de periode waarop het plan betrekking heeft, aangegeven.

      2 Een aangewezen organisatie voor monumentenbehoud kan de subsidie aanwenden voor uitvoering van subsidiabele
      werkzaamheden aan alle monumenten waar het instandhoudingsplan betrekking op heeft.

      3 Na een aanvraag als bedoeld in [artikel 9][ref2] en onverminderd [artikel 12][ref3] kan Onze minister er mee
      instemmen dat een aangewezen organisatie een gecombineerd instandhoudingsplan uitbreidt met andere beschermde
      monumenten of zelfstandige onderdelen waar het plan nog geen betrekking op heeft. In dat geval wijzigt Onze
      minister de beschikking tot subsidieverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0028785#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0028785#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0028785#Artikel12
