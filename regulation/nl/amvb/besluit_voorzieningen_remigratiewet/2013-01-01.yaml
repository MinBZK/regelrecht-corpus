        artikel: '15'
        hoofdstuk: '5'
      - id: ref5
        bwb_id: BWBR0010773
        artikel: '17'
        hoofdstuk: '5'
      - id: ref6
        bwb_id: BWBR0010424
        artikel: '1'
  - number: '1.3'
    text: |-
      Onder kind wordt in de [artikelen 7, derde lid][ref1], [15, vierde lid][ref2], [16, eerste en derde lid][ref3], en
      [17, tweede lid][ref4], mede verstaan het kind, bedoeld in [artikel 1, derde lid, van de wet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0010773#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0010773#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0010773#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0010773#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0010424#Artikel1
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010773
        artikel: '7'
        hoofdstuk: '2'
      - id: ref2
