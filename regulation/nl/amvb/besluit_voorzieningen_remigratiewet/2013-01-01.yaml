preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister voor Grote Steden- en Integratiebeleid, van 9 juli 1999, nr. CIM99/76314;

    Gelet op artikel 7, eerste lid, van de Remigratiewet;

    De Raad van State gehoord (advies van 20 augustus 1999, nr. W04.99.0342/1);

    Gezien het nader rapport van Onze Minister voor Grote Steden- en Integratiebeleid, van 7 oktober 1999, nr.
    CIM99/81518;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel1
  - number: 1.1.a
    text: |-
      wet: de [Remigratiewet][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0010424
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010424
  - number: 1.1.b
    text: |-
      remigratievoorzieningen: de periodieke uitkering, bedoeld in [artikel 4, eerste lid, van de wet][ref1] en de
      voorziening, bedoeld in [artikel 4, tweede lid, van de wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0010424#Artikel4
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0010424
        artikel: '4'
  - number: 1.1.c
    text: |-
      remigratie-uitkering: de periodieke uitkering, bedoeld in [artikel 4, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel4
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '4'
  - number: '1.2'
    text: |-
      Onder partner wordt in de [artikelen 7, derde lid][ref1], [11][ref2], [14, vijfde, zesde en zevende lid][ref3],
      [15, eerste, tweede, derde en vierde lid][ref4], en [17, tweede lid][ref5], mede verstaan de partner, bedoeld in
      [artikel 1, tweede lid, van de wet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0010773#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0010773#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0010773#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0010773#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0010773#Artikel17
      [ref6]: https://wetten.overheid.nl/BWBR0010424#Artikel1
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010773
        artikel: '7'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0010773
        artikel: '11'
        hoofdstuk: '3'
      - id: ref3
