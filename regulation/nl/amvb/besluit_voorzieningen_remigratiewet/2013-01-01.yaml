        bwb_id: BWBR0010424
        artikel: '1'
  - number: '2.1'
    text: |-
      De kosten van het vervoer van de remigrant, zijn partner en hun kinderen, bedoeld in
      [artikel 3, eerste lid, onderdeel a, van de wet][ref1] worden vergoed overeenkomstig de door Onze Minister vast te
      stellen normbedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel3
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '3'
  - number: '2.2'
    text: |-
      De kosten van het vervoer van de bagage, bedoeld in [artikel 3, tweede lid, onderdeel a, van de wet][ref1] worden
      vergoed, voor zover die bagage de door Onze Minister vast te stellen omvang niet te boven gaat en overeenkomstig de
      door Onze Minister vast te stellen normbedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel3
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '3'
  - number: '2.3'
    text: De normbedragen, bedoeld in het eerste en tweede lid, kunnen per bestemmingsland verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel2
  - number: '3.1'
    text: |-
      De kosten van het vervoer van een bedrijfsinventaris, of de kosten van het vervoer van een personenauto of
      andere hulpmiddelen voor een gehandicapte naar het bestemmingsland tot de plaats van bestemming, bedoeld in
      [artikel 3, tweede lid, onderdelen b en c, van de wet][ref1] worden vergoed overeenkomstig de werkelijk gemaakte
      kosten tot de door Onze Minister vast te stellen maximale bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel3
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '3'
  - number: '3.2'
    text: Onze Minister kan bepalen welke kosten als kosten van vervoer als bedoeld in het eerste lid, worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel3
  - number: '4'
    text: |-
      De opslagkosten van de goederen, bedoeld in [artikel 3, eerste lid][ref1], in het bestemmingsland worden vergoed
      overeenkomstig de werkelijk gemaakte kosten tot een door Onze Minister vast te stellen maximaal bedrag per dag voor
      een periode van maximaal 14 dagen, de periode van kosteloze opslag daaronder begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel3
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '3'
  - number: '5.1'
    text: |-
      In de kosten van hervestiging na aankomst in het bestemmingsland, bedoeld in
      [artikel 3, eerste lid, onderdeel b, van de wet][ref1], wordt tegemoet gekomen overeenkomstig een bedrag dat
      gelijk is aan tweemaal de hoogte van de remigratie-uitkering gedurende de eerste maand van verblijf in het
      bestemmingsland.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel3
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '3'
  - number: '5.2'
    text: |-
      Een remigrant aan wie een remigratie-uitkering is verstrekt heeft geen recht op een tegemoetkoming in de kosten van
      hervestiging in het bestemmingsland als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel5
  - number: '6'
    text: |-
      Onze Minister stelt regels over de wijze en het tijdstip waarop de in de [artikelen 2][ref1], [3][ref2] en
      [4][ref3] bedoelde vergoedingen en de in [artikel 5][ref4] bedoelde tegemoetkoming in de kosten van hervestiging
      worden uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0010773#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010773#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0010773#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0010773#Artikel5
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010773
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0010773
        artikel: '3'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0010773
        artikel: '4'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0010773
        artikel: '5'
        hoofdstuk: '2'
  - number: '7.1'
    text: |-
      Onze Minister stelt het bruto bedrag vast van de remigratie-uitkering, bedoeld in
      [artikel 4, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel4
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '4'
  - number: '7.2'
    text: De hoogte van het bruto bedrag, bedoeld in het eerste lid, kan per bestemmingsland verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel7
  - number: '7.3'
    text: |-
      De hoogte van het bruto bedrag, bedoeld in het eerste lid, is verschillend al naar gelang er sprake is van een
      alleenstaande remigrant, een remigrant met partner, dan wel van een alleenstaande remigrant met een kind.
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel7
  - number: '7.4'
    text: 'De hoogte van het bruto bedrag, bedoeld in het eerste lid, kan verschillend zijn:'
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel7
  - number: 7.4.a
    text: 'afhankelijk van de loonheffing die op de remigratie-uitkering moet worden ingehouden, waarbij:'
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel7
  - number: 7.4.a.1
    text: |-
      voor personen die de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], nog niet hebben bereikt uitsluitend rekening wordt
      gehouden met de algemene heffingskorting, bedoeld in [artikel 22 van de Wet op de loonbelasting 1964][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel22
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '22'
  - number: 7.4.a.2
    text: |-
      voor personen die de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], hebben bereikt rekening wordt gehouden met de
      algemene heffingskorting, de ouderenkorting en de aanvullende ouderenkorting, bedoeld in de [artikelen 22][ref2],
      [22b][ref3] respectievelijk [22c van de Wet op de loonbelasting 1964][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel22a
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel22c
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '22'
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 22a
      - id: ref4
        bwb_id: BWBR0002471
        artikel: 22c
  - number: 7.4.b
    text: al naar gelang er wel of niet een verzekering tegen ziektekosten is gesloten.
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel7
  - number: '7.5'
    text: |-
      Voor de vraag op welk bruto bedrag van de remigratie-uitkering op grond van het derde lid aanspraak bestaat is
      bepalend de toestand op de datum van vertrek uit Nederland, een en ander onverminderd de [artikelen 14][ref1],
      [15, tweede lid][ref2], en [17][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0010773#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0010773#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0010773#Artikel17
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0010773
        artikel: '14'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0010773
        artikel: '15'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0010773
        artikel: '17'
        hoofdstuk: '5'
  - number: '8.1'
    text: |-
      De vastgestelde bruto bedragen, bedoeld in [artikel 7][ref1], worden door Onze Minister jaarlijks aangepast aan de
      hand van de helft van het percentage waarmee de bijstandsnormen in het voorafgaande kalenderjaar met toepassing van
      [artikel 38, eerste lid, aanhef en onderdeel a, van de Wet werk en bijstand][ref2] zijn gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0010773#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel38
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0010773
        artikel: '7'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '38'
  - number: '8.2'
    text: |-
      De vastgestelde bruto bedragen, bedoeld in [artikel 7][ref1], kunnen door Onze Minister worden aangepast op het
      moment dat een wijziging optreedt in de in te houden loonheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0010773#Artikel7
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0010773
        artikel: '7'
        hoofdstuk: '2'
  - number: '9.1'
    text: De remigratie-uitkering wordt per maand uitbetaald.
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel9
  - number: '9.2'
    text: |-
      Indien de maandelijkse remigratie-uitkering, bedoeld in het eerste lid, minder dan € 22,69 bedraagt, kan de som van
      de remigratie-uitkeringen eenmaal per jaar worden uitbetaald.
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel9
  - number: '10.1'
    text: |-
      In de kosten van het sluiten van een verzekering tegen ziektekosten in het bestemmingsland als bedoeld in
      [artikel 4, tweede lid, van de wet][ref1] wordt tegemoet gekomen met een door Onze Minister vast te stellen bruto
      bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel4
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '4'
  - number: '10.2'
    text: |-
      De [artikelen 7, derde, vierde en vijfde lid][ref1], en [8, tweede lid][ref2], is van overeenkomstige toepassing op
      het bedrag, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010773#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0010773#Artikel8
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0010773
        artikel: '7'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0010773
        artikel: '8'
        hoofdstuk: '2'
  - number: '10.3'
    text: Het bedrag, bedoeld in het eerste lid, wordt per maand uitbetaald.
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel10
  - number: '11.1'
    text: |-
      Op de remigratie-uitkering wordt in mindering gebracht het bruto bedrag van de uitkeringen of
      inkomensvoorziening op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1], de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2], de [Wet werk en inkomen naar arbeidsvermogen][ref3],
      de [Wet werk en arbeidsondersteuning jonggehandicapten][ref4], de [Algemene Ouderdomswet][ref5], de
      [Algemene nabestaandenwet][ref6], de [Toeslagenwet][ref7], waarop de remigrant of zijn partner over het
      uitkeringstijdvak aanspraak heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0008656
      [ref3]: https://wetten.overheid.nl/BWBR0019057
      [ref4]: https://wetten.overheid.nl/BWBR0008657
      [ref5]: https://wetten.overheid.nl/BWBR0002221
      [ref6]: https://wetten.overheid.nl/BWBR0007795
      [ref7]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0008656
      - id: ref3
        bwb_id: BWBR0019057
      - id: ref4
        bwb_id: BWBR0008657
      - id: ref5
        bwb_id: BWBR0002221
      - id: ref6
        bwb_id: BWBR0007795
      - id: ref7
        bwb_id: BWBR0004043
  - number: '11.2'
    text: |-
      Op de remigratie-uitkering wordt niet in mindering gebracht het bruto bedrag van de tegemoetkoming op grond van de
      [Wet mogelijkheid koopkrachttegemoetkoming oudere belastingplichtigen][ref1], waarop de remigrant of zijn partner
      over het uitkeringstijdvak aanspraak heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0029984
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0029984
  - number: '11.3'
    text: |-
      In het bruto-bedrag van een uitkering op grond van de [Algemene nabestaandenwet][ref1] wordt niet begrepen de
      tegemoetkoming op grond van [artikel 29a van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel29a
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0007795
        artikel: 29a
  - number: '12.1'
    text: |-
      Om voor de voorzieningen, bedoeld in de [artikelen 3][ref1], [4][ref2], [5][ref3] en [11 van de wet][ref4], in
      aanmerking te komen dient de remigrant een aanvraag in bij de SVB.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010424#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0010424#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0010424#Artikel11
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0010424
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0010424
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0010424
        artikel: '11'
  - number: '12.2'
    text: Op een aanvraag wordt binnen vier maanden beslist.
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel12
  - number: '13'
    text: |-
      Indien de remigrant, en voor zover van toepassing, zijn partner en kinderen niet binnen een termijn van zes
      maanden na de datum van de beschikking tot toekenning van de voorzieningen, bedoeld in de [artikelen 3][ref1] en
      [4, eerste en tweede lid, van de wet][ref2], zijn geremigreerd, kan de beschikking geheel of gedeeltelijk worden
      ingetrokken, tenzij de remigrant of zijn partner van de overschrijding van die termijn redelijkerwijs geen verwijt
      kan worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010424#Artikel4
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0010424
        artikel: '4'
  - number: '14.1'
    text: |-
      Het recht op de remigratievoorzieningen gaat in op de eerste dag na die van vertrek van de remigrant naar het
      bestemmingsland.
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel14
  - number: '14.2'
    text: |-
      Het recht op de remigratievoorzieningen gaat in ieder geval niet eerder in dan op de eerste dag van de maand na die
      waarop het besluit op de aanvraag is genomen.
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel14
  - number: '14.3'
    text: |-
      De SVB kan het tweede lid buiten toepassing laten of daarvan afwijken, voor zover toepassing, gelet op het belang
      van de remigrant, zal leiden tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel14
  - number: '14.4'
    text: |-
      Het recht op de voorzieningen, bedoeld in [artikel 4, derde en vierde lid][ref1], en
      [artikel 11, eerste lid, van de wet][ref2] gaat in op de eerste dag van de maand waarin de aanvraag is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0010424#Artikel11
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0010424
        artikel: '11'
  - number: '14.5'
    text: |-
      Het recht van de partner op de voorziening, bedoeld in [artikel 5, eerste lid, van de wet][ref1] gaat in op de
      eerste dag van de maand waarin de remigrant is opgehouden met zijn partner een gezamenlijke huishouding te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel5
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '5'
  - number: '14.6'
    text: |-
      Het recht op de voorziening, bedoeld in [artikel 5, tweede lid, van de wet][ref1] gaat in op de eerste dag van de
      tweede maand, volgende op de maand waarin de remigrant of zijn partner is overleden.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel5
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '5'
  - number: '14.7'
    text: |-
      Het recht op de voorziening, bedoeld in [artikel 5, derde lid, van de wet][ref1] gaat in op de eerste dag van de
      tweede maand, volgende op de maand waarin de remigrant en zijn partner niet meer in leven zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel5
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '5'
  - number: '15.1'
    text: |-
      Het recht op de voorzieningen, bedoeld in de [artikelen 4][ref1] en [11, eerste lid, van de wet][ref2] vervalt met
      ingang van de eerste dag van de tweede maand, volgende op de maand van overlijden van de remigrant of zijn partner.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0010424#Artikel11
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0010424
        artikel: '11'
  - number: '15.2'
    text: |-
      Het recht op de voorzieningen, bedoeld in de [artikelen 4][ref1] en [11, eerste lid, van de wet][ref2] wordt
      omgezet in een recht op de voorzieningen, bedoeld in die artikelen, als ware de remigrant een alleenstaande
      remigrant met ingang van de eerste dag van de maand, waarin de remigrant is opgehouden met zijn partner een
      gezamenlijke huishouding te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0010424#Artikel11
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0010424
        artikel: '11'
  - number: '15.3'
    text: |-
      Het recht op de voorzieningen, bedoeld in [artikel 5, eerste en tweede lid, van de wet][ref1] vervalt met ingang
      van de eerste dag van de tweede maand, volgende op de maand van overlijden van de remigrant of zijn partner.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel5
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '5'
  - number: '15.4'
    text: |-
      Na het overlijden van de personen, bedoeld in het eerste, tweede en derde lid, worden de nog verschuldigde
      voorzieningen verstrekt aan:
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel15
  - number: 15.4.a
    text: de partner of aan de remigrant, of indien deze er niet zijn, aan
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel15
  - number: 15.4.b
    text: de kinderen of indien deze er niet zijn, aan
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel15
  - number: 15.4.c
    text: |-
      de persoon of personen die daarvoor naar het oordeel van de SVB op billijkheidsoverwegingen in aanmerking komt,
      onderscheidenlijk komen, mits deze binnen zes maanden na het overlijden een daartoe strekkend verzoek bij de SVB
      heeft, onderscheidenlijk hebben ingediend.
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel15
  - number: '16.1'
    text: |-
      Met ingang van de eerste dag van de tweede maand, volgend op de maand van overlijden van een kind dan wel met
      ingang van de eerste dag van de maand, volgend op de maand waarin een kind niet langer minderjarig is, vervalt zijn
      evenredig deel van het recht op de helft van de voorzieningen, bedoeld in [artikel 5, derde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel5
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '5'
  - number: '16.2'
    text: |-
      Na het overlijden van de kinderen, bedoeld in het eerste lid, worden de nog verschuldigde voorzieningen verstrekt
      aan de persoon of personen die daarvoor naar het oordeel van de SVB op billijkheidsoverwegingen in aanmerking komt,
      onderscheidenlijk komen, mits deze binnen zes maanden na het overlijden een daartoe strekkend verzoek bij de SVB
      heeft, onderscheidenlijk hebben ingediend.
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel16
  - number: '17.1'
    text: |-
      In geval twee alleenstaande remigranten die ieder afzonderlijk recht hebben op de remigratievoorzieningen
      met elkaar huwen of hun partnerschap laten registreren, of een gezamenlijke huishouding gaan voeren, waarbij
      betrokkenen hun hoofdverblijf hebben in dezelfde woning, en er geen bloedverwantschap is in de eerste graad, worden
      de twee afzonderlijke rechten op de remigratievoorzieningen omgezet in een recht op de remigratievoorzieningen als
      waren zij een remigrant en partner.
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel17
  - number: '17.2'
    text: |-
      Indien de alleenstaande remigrant of de alleenstaande partner geen kinderen meer heeft worden de
      remigratievoorzieningen aan de gewijzigde omstandigheden aangepast.
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel17
  - number: '17.3'
    text: |-
      De aanpassingen, bedoeld in het eerste en tweede lid, gaan in op de eerste dag van de maand na die waarin de
      wijziging der omstandigheden plaatsvond.
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel17
  - number: '19'
    text: |-
      [Artikel 8, eerste lid][ref1], is niet van toepassing op personen die voor de dag van inwerkingtreding van deze wet
      zijn geremigreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0010773#Artikel8
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0010773
        artikel: '8'
        hoofdstuk: '2'
  - number: '20'
    text: Dit besluit treedt in werking op het tijdstip waarop de wet in werking treedt.
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel20
  - number: '21'
    text: 'Dit besluit wordt aangehaald als: Besluit voorzieningen Remigratiewet.'
    url: https://wetten.overheid.nl/BWBR0010773/2013-01-01#Artikel21
