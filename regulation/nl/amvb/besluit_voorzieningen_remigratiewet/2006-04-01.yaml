  - number: '5'
    text: |-
      1 In de kosten van hervestiging na aankomst in het bestemmingsland, bedoeld in
      [artikel 3, eerste lid, onderdeel b, van de wet][ref1], wordt tegemoet gekomen overeenkomstig een bedrag dat
      gelijk is aan tweemaal de hoogte van de remigratie-uitkering gedurende de eerste maand van verblijf in het
      bestemmingsland.

      2 Een remigrant aan wie een remigratie-uitkering is verstrekt heeft geen recht op een tegemoetkoming in de kosten
      van hervestiging in het bestemmingsland als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel3
    url: https://wetten.overheid.nl/BWBR0010773/2006-04-01#Artikel5
