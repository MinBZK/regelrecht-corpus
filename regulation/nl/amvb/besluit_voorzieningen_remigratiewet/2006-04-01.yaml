      1 Om voor de voorzieningen, bedoeld in de [artikelen 3][ref1], [4][ref2], [5][ref3] en [11 van de wet][ref4], in
      aanmerking te komen dient de remigrant een aanvraag in bij de SVB.

      2 Op een aanvraag wordt binnen vier maanden beslist.


