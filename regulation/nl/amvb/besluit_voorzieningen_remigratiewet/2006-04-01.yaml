    text: |-
      1 De kosten van het vervoer van de remigrant, zijn partner en hun kinderen, bedoeld in
      [artikel 3, eerste lid, onderdeel a, van de wet][ref1] worden vergoed overeenkomstig de door Onze Minister vast te
      stellen normbedragen.

      2 De kosten van het vervoer van de bagage, bedoeld in [artikel 3, tweede lid, onderdeel a, van de wet][ref2] worden
      vergoed, voor zover die bagage de door Onze Minister vast te stellen omvang niet te boven gaat en overeenkomstig de
      door Onze Minister vast te stellen normbedragen.

      3 De normbedragen, bedoeld in het eerste en tweede lid, kunnen per bestemmingsland verschillend worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010424#Artikel3
    url: https://wetten.overheid.nl/BWBR0010773/2006-04-01#Artikel2
    references:
