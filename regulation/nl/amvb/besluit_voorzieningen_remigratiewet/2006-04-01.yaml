  - number: '16'
    text: |-
      1 Met ingang van de eerste dag van de tweede maand, volgend op de maand van overlijden van een kind dan wel met
      ingang van de eerste dag van de maand, volgend op de maand waarin een kind niet langer minderjarig is, vervalt zijn
      evenredig deel van het recht op de helft van de voorzieningen, bedoeld in [artikel 5, derde lid, van de wet][ref1].

      2 Na het overlijden van de kinderen, bedoeld in het eerste lid, worden de nog verschuldigde voorzieningen verstrekt
      aan de persoon of personen die daarvoor naar het oordeel van de SVB op billijkheidsoverwegingen in aanmerking komt,
      onderscheidenlijk komen, mits deze binnen zes maanden na het overlijden een daartoe strekkend verzoek bij de SVB
      heeft, onderscheidenlijk hebben ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel5
    url: https://wetten.overheid.nl/BWBR0010773/2006-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '5'
  - number: '17'
    text: |-
      1 In geval twee alleenstaande remigranten die ieder afzonderlijk recht hebben op de remigratievoorzieningen
      met elkaar huwen of hun partnerschap laten registreren, of een gezamenlijke huishouding gaan voeren, waarbij
      betrokkenen hun hoofdverblijf hebben in dezelfde woning, en er geen bloedverwantschap is in de eerste graad, worden
      de twee afzonderlijke rechten op de remigratievoorzieningen omgezet in een recht op de remigratievoorzieningen als
      waren zij een remigrant en partner.

      2 Indien de alleenstaande remigrant of de alleenstaande partner geen kinderen meer heeft worden de
      remigratievoorzieningen aan de gewijzigde omstandigheden aangepast.

      3 De aanpassingen, bedoeld in het eerste en tweede lid, gaan in op de eerste dag van de maand na die waarin de
      wijziging der omstandigheden plaatsvond.
    url: https://wetten.overheid.nl/BWBR0010773/2006-04-01#Artikel17
  - number: '19'
    text: |-
      [Artikel 8, eerste lid][ref1], is niet van toepassing op personen die voor de dag van inwerkingtreding van deze wet
      zijn geremigreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0010773#Artikel8
    url: https://wetten.overheid.nl/BWBR0010773/2006-04-01#Artikel19
