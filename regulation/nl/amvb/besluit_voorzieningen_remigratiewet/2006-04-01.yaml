preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister voor Grote Steden- en Integratiebeleid, van 9 juli 1999, nr. CIM99/76314;

    Gelet op artikel 7, eerste lid, van de Remigratiewet;

    De Raad van State gehoord (advies van 20 augustus 1999, nr. W04.99.0342/1);

    Gezien het nader rapport van Onze Minister voor Grote Steden- en Integratiebeleid, van 7 oktober 1999, nr.
    CIM99/81518;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0010773/2006-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. wet: de [Remigratiewet][ref1];

      b. remigratievoorzieningen: de periodieke uitkering, bedoeld in [artikel 4, eerste lid, van de wet][ref2] en de
      voorziening, bedoeld in [artikel 4, tweede lid, van de wet][ref3];

      c. remigratie-uitkering: de periodieke uitkering, bedoeld in [artikel 4, eerste lid, van de wet][ref4].

      2 Onder partner wordt in de [artikelen 7, derde lid][ref5], [11][ref6], [14, vijfde, zesde en zevende lid][ref7],
      [15, eerste, tweede, derde en vierde lid][ref8], en [17, tweede lid][ref9], mede verstaan de partner, bedoeld in
      [artikel 1, tweede lid, van de wet][ref10].

      3 Onder kind wordt in de [artikelen 7, derde lid][ref11], [15, vierde lid][ref12],
      [16, eerste en derde lid][ref13], en [17, tweede lid][ref14], mede verstaan het kind, bedoeld in
      [artikel 1, derde lid, van de wet][ref15].


