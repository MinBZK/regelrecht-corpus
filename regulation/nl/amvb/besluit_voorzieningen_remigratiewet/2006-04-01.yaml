  - number: '15'
    text: |-
      1 Het recht op de voorzieningen, bedoeld in de [artikelen 4][ref1] en [11, eerste lid, van de wet][ref2] vervalt
      met ingang van de eerste dag van de tweede maand, volgende op de maand van overlijden van de remigrant of zijn
      partner.

      2 Het recht op de voorzieningen, bedoeld in de [artikelen 4][ref3] en [11, eerste lid, van de wet][ref4] wordt
      omgezet in een recht op de voorzieningen, bedoeld in die artikelen, als ware de remigrant een alleenstaande
      remigrant met ingang van de eerste dag van de maand, waarin de remigrant is opgehouden met zijn partner een
      gezamenlijke huishouding te voeren.

      3 Het recht op de voorzieningen, bedoeld in [artikel 5, eerste en tweede lid, van de wet][ref5] vervalt met ingang
      van de eerste dag van de tweede maand, volgende op de maand van overlijden van de remigrant of zijn partner.

      4 Na het overlijden van de personen, bedoeld in het eerste, tweede en derde lid, worden de nog verschuldigde
      voorzieningen verstrekt aan:

      a. de partner of aan de remigrant, of indien deze er niet zijn, aan

      b. de kinderen of indien deze er niet zijn, aan

      c. de persoon of personen die daarvoor naar het oordeel van de SVB op billijkheidsoverwegingen in aanmerking komt,
      onderscheidenlijk komen, mits deze binnen zes maanden na het overlijden een daartoe strekkend verzoek bij de SVB
      heeft, onderscheidenlijk hebben ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0010424#Artikel11
