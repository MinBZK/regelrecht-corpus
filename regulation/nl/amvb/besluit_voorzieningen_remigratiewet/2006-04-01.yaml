    text: |-
      1 De remigratie-uitkering wordt per maand uitbetaald.

      2 Indien de maandelijkse remigratie-uitkering, bedoeld in het eerste lid, minder dan € 22,69 bedraagt, kan de som
      van de remigratie-uitkeringen eenmaal per jaar worden uitbetaald.
    url: https://wetten.overheid.nl/BWBR0010773/2006-04-01#Artikel9
  - number: '10'
    text: |-
      1 In de kosten van het sluiten van een verzekering tegen ziektekosten in het bestemmingsland als bedoeld in
      [artikel 4, tweede lid, van de wet][ref1] wordt tegemoet gekomen met een door Onze Minister vast te stellen bruto
      bedrag.

      2 De [artikelen 7, derde, vierde en vijfde lid][ref2], en [8, tweede lid][ref3], is van overeenkomstige toepassing
      op het bedrag, bedoeld in het eerste lid.

      3 Het bedrag, bedoeld in het eerste lid, wordt per maand uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0010773#Artikel7
