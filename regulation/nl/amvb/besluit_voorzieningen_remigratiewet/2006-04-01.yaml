  - number: '14'
    text: |-
      1 Het recht op de remigratievoorzieningen gaat in op de eerste dag na die van vertrek van de remigrant naar het
      bestemmingsland.

      2 Het recht op de remigratievoorzieningen gaat in ieder geval niet eerder in dan op de eerste dag van de maand na
      die waarop het besluit op de aanvraag is genomen.

      3 De SVB kan het tweede lid buiten toepassing laten of daarvan afwijken, voor zover toepassing, gelet op het belang
      van de remigrant, zal leiden tot een onbillijkheid van overwegende aard.

      4 Het recht op de voorzieningen, bedoeld in [artikel 4, derde en vierde lid][ref1], en
      [artikel 11, eerste lid, van de wet][ref2] gaat in op de eerste dag van de maand waarin de aanvraag is ingediend.

      5 Het recht van de partner op de voorziening, bedoeld in [artikel 5, eerste lid, van de wet][ref3] gaat in op de
      eerste dag van de maand waarin de remigrant is opgehouden met zijn partner een gezamenlijke huishouding te voeren.

      6 Het recht op de voorziening, bedoeld in [artikel 5, tweede lid, van de wet][ref4] gaat in op de eerste dag van de
      tweede maand, volgende op de maand waarin de remigrant of zijn partner is overleden.

      7 Het recht op de voorziening, bedoeld in [artikel 5, derde lid, van de wet][ref5] gaat in op de eerste dag van de
      tweede maand, volgende op de maand waarin de remigrant en zijn partner niet meer in leven zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0010424#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0010424#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0010424#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0010424#Artikel5
