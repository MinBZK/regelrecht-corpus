  - number: '8'
    text: |-
      1 De vastgestelde bruto bedragen, bedoeld in [artikel 7][ref1], worden door Onze Minister jaarlijks aangepast aan
      de hand van de helft van het percentage waarmee de bijstandsnormen in het voorafgaande kalenderjaar met toepassing
      van [artikel 56, eerste lid, aanhef en onder a, van de Algemene bijstandswet][ref2] zijn gewijzigd.

      2 De vastgestelde bruto bedragen, bedoeld in [artikel 7][ref3], kunnen door Onze Minister worden aangepast op het
      moment dat een wijziging optreedt in de in te houden loonheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0010773#Artikel7
