    text: |-
      1 Op de remigratie-uitkering wordt in mindering gebracht het bruto bedrag van de
      uitkeringen op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1], de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2], de [Wet werk en inkomen naar arbeidsvermogen][ref3],
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref4], de [Algemene Ouderdomswet][ref5], de
      [Algemene nabestaandenwet][ref6], de [Toeslagenwet][ref7], waarop de remigrant of zijn partner over het
      uitkeringstijdvak aanspraak heeft.

      2 In het bruto-bedrag van de uitkering op grond van de [Algemene Ouderdomswet][ref8] wordt niet begrepen de
      tegemoetkoming op grond van [artikel 33b van die wet][ref9].


