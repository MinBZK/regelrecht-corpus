        bwb_id: BWBR0010773
        artikel: '8'
        hoofdstuk: '2'
  - number: '20'
    text: Dit besluit treedt in werking op het tijdstip waarop de wet in werking treedt.
    url: https://wetten.overheid.nl/BWBR0010773/2006-04-01#Artikel20
  - number: '21'
    text: 'Dit besluit wordt aangehaald als: Besluit voorzieningen Remigratiewet.'
    url: https://wetten.overheid.nl/BWBR0010773/2006-04-01#Artikel21
