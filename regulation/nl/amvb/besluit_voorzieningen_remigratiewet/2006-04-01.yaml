        artikel: '3'
  - number: '6'
    text: |-
      Onze Minister stelt regels over de wijze en het tijdstip waarop de in de [artikelen 2][ref1], [3][ref2] en
      [4][ref3] bedoelde vergoedingen en de in [artikel 5][ref4] bedoelde tegemoetkoming in de kosten van hervestiging
      worden uitbetaald.


