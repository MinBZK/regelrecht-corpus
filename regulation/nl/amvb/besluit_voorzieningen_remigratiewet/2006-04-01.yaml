  - number: '7'
    text: |-
      1 Onze Minister stelt het bruto bedrag vast van de remigratie-uitkering, bedoeld in
      [artikel 4, eerste lid, van de wet][ref1].

      2 De hoogte van het bruto bedrag, bedoeld in het eerste lid, kan per bestemmingsland verschillend worden
      vastgesteld.

      3 De hoogte van het bruto bedrag, bedoeld in het eerste lid, is verschillend al naar gelang er sprake is van een
      alleenstaande remigrant, een remigrant met partner, dan wel van een alleenstaande remigrant met een kind.

      4 De hoogte van het bruto bedrag, bedoeld in het eerste lid, kan verschillend zijn:

      a. afhankelijk van de loonheffing die op de remigratie-uitkering moet worden ingehouden, waarbij:

      1° voor personen jonger dan 65 jaar uitsluitend rekening wordt gehouden met de algemene heffingskorting, bedoeld in
      [artikel 22 van de Wet op de loonbelasting 1964][ref2], en

      2° voor personen van 65 jaar of ouder rekening wordt gehouden met de algemene heffingskorting, de
      ouderenkorting en de aanvullende ouderenkorting, bedoeld in de [artikelen 22][ref3], [22b][ref4] respectievelijk
      [22c van de Wet op de loonbelasting 1964][ref5];

      b. al naar gelang er wel of niet een verzekering tegen ziektekosten is gesloten.

      5 Voor de vraag op welk bruto bedrag van de remigratie-uitkering op grond van het derde lid aanspraak bestaat is
      bepalend de toestand op de datum van vertrek uit Nederland, een en ander onverminderd de [artikelen 14][ref6],
      [15, tweede lid][ref7], en [17][ref8].


