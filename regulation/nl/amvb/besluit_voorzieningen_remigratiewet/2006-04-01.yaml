  - number: '13'
    text: |-
      Indien de remigrant, en voor zover van toepassing, zijn partner en kinderen niet binnen een termijn van zes
      maanden na de datum van de beschikking tot toekenning van de voorzieningen, bedoeld in de [artikelen 3][ref1] en
      [4, eerste en tweede lid, van de wet][ref2], zijn geremigreerd, kan de beschikking geheel of gedeeltelijk worden
      ingetrokken, tenzij de remigrant of zijn partner van de overschrijding van die termijn redelijkerwijs geen verwijt
      kan worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010424#Artikel4
    url: https://wetten.overheid.nl/BWBR0010773/2006-04-01#Artikel13
