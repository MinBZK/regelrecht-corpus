        artikel: '3'
  - number: '3'
    text: |-
      1 De kosten van het vervoer van een bedrijfsinventaris, of de kosten van het vervoer van een personenauto of
      andere hulpmiddelen voor een gehandicapte naar het bestemmingsland tot de plaats van bestemming, bedoeld in
      [artikel 3, tweede lid, onderdelen b en c, van de wet][ref1] worden vergoed overeenkomstig de werkelijk gemaakte
      kosten tot de door Onze Minister vast te stellen maximale bedragen.

      2 Onze Minister kan bepalen welke kosten als kosten van vervoer als bedoeld in het eerste lid, worden beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel3
    url: https://wetten.overheid.nl/BWBR0010773/2006-04-01#Artikel3
