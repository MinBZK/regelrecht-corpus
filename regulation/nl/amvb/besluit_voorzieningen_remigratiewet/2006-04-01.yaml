        artikel: '3'
  - number: '4'
    text: |-
      De opslagkosten van de goederen, bedoeld in [artikel 3, eerste lid][ref1], in het bestemmingsland worden vergoed
      overeenkomstig de werkelijk gemaakte kosten tot een door Onze Minister vast te stellen maximaal bedrag per dag voor
      een periode van maximaal 14 dagen, de periode van kosteloze opslag daaronder begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel3
    url: https://wetten.overheid.nl/BWBR0010773/2006-04-01#Artikel4
