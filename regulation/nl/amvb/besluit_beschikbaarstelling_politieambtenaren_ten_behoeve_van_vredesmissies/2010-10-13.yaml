  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties van 14 oktober 2002, nr.
    EA2002/89745, directoraat-generaal Openbare Orde en Veiligheid, directie Politie;

    Gelet op artikel 50, eerste lid, van de Politiewet 1993;

    De Raad van State gehoord (advies van 18 november 2002, nr. W04.02.0459/I);

    Gezien het nader rapport van de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties van 9 december 2002,
    nr. EA2002/99154, directoraat-generaal Openbare Orde en Veiligheid;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0014439/2010-10-13#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop gebaseerde regeling wordt verstaan onder:

      a. Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      b. betrokkene: de ambtenaar, bedoeld in
      [artikel 3, aanhef en onder a en b, van de Politiewet 1993][ref1], en de ambtenaar, bedoeld in
      [artikel 10, eerste lid, aanhef en onderdeel b, van de Wet op het LSOP en het politieonderwijs][ref2], die door het
      bevoegd gezag, bedoeld in het [Besluit algemene rechtspositie politie][ref3], buitengewoon verlof wordt verleend
      met behoud van bezoldiging ten behoeve van uitzending ingevolge dit besluit;

      c. missiegebied: een door een volkenrechtelijke organisatie of een in het kader van een internationale overeenkomst
      waarbij Nederland partij is, aangewezen gebied waarin inzet van civiele politie plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0014623#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0006516
    url: https://wetten.overheid.nl/BWBR0014439/2010-10-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0014623
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0006516
  - number: '2'
    text: |-
      1 De betrokkene kan op zijn verzoek door Onze Minister ter beschikking worden gesteld ten behoeve van uitzending
      naar een missiegebied.

      2 Uitzending naar een missiegebied vindt plaats ten behoeve van het uitvoeren van de politietaak, het geven van
      opleidingen, ondersteuning bij de opbouw van een civiele politie-organisatie, het leveren van specifieke technische
      expertise of het uitvoeren van waarnemersmissies.

      3 Slechts de betrokkene die is aangesteld voor de politietaak, bedoeld in
      [artikel 3, eerste lid, onder a, van de Politiewet 1993][ref1] wordt uitgezonden ten behoeve van het uitvoeren van
      de politietaak.

      4 De duur van de uitzending bedraagt 6 maanden, te verlengen tot ten hoogste een jaar. In bijzondere omstandigheden
      kan van deze termijnen worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel3
    url: https://wetten.overheid.nl/BWBR0014439/2010-10-13#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '3'
  - number: '3'
    text: |-
      Onze Minister stelt voor de beschikbaarstelling en de voorwaarden waaronder deze plaatsvindt, nadere regels vast
      die in ieder geval bepalingen bevatten over:

      a. medische keuring;

      b. werkgeverslasten;

      c. de bezoldiging en de toelagen;

      d. de voorzieningen bij de beschikbaarstelling en bij de beëindiging daarvan;

      e. de voorzieningen bij verblijf in het missiegebied;

      f. voorzieningen bij ongevallen;

      g. verlof.
    url: https://wetten.overheid.nl/BWBR0014439/2010-10-13#Artikel3
  - number: '4'
    text: Dit besluit treedt in werking met ingang van de dag na uitgifte van het Staatsblad waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0014439/2010-10-13#Artikel4
  - number: '5'
    text: 'Dit besluit wordt aangehaald als: Besluit beschikbaarstelling politieambtenaren ten behoeve van vredesmissies.'
    url: https://wetten.overheid.nl/BWBR0014439/2010-10-13#Artikel5
