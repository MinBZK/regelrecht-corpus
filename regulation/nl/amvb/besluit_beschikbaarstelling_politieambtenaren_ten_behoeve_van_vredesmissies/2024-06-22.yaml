articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop gebaseerde regeling wordt verstaan onder:

      a. Onze Minister: Onze Minister van Veiligheid en Justitie;

      b. betrokkene: de ambtenaar, bedoeld in [artikel 2, onderdeel a en b, van de Politiewet 2012][ref1], die door het
      bevoegd gezag, bedoeld in het [Besluit algemene rechtspositie politie][ref2], buitengewoon verlof wordt verleend
      met behoud van bezoldiging ten behoeve van uitzending ingevolge dit besluit;

      c. missiegebied: een door een volkenrechtelijke organisatie of een in het kader van een internationale overeenkomst
      waarbij Nederland partij is, aangewezen gebied waarin inzet van civiele politie plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006516
    url: https://wetten.overheid.nl/BWBR0014439/2024-06-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006516
  - number: '2'
    text: |-
      1 De betrokkene kan op zijn verzoek door Onze Minister ter beschikking worden gesteld ten behoeve van uitzending
      naar een missiegebied.

      2 Uitzending naar een missiegebied vindt plaats ten behoeve van het uitvoeren van de politietaak, het geven van
      opleidingen, ondersteuning bij de opbouw van een civiele politie-organisatie, het leveren van specifieke technische
      expertise of het uitvoeren van waarnemersmissies.

      3 Slechts de betrokkene die is aangesteld voor de politietaak, bedoeld in
      [artikel 2, onderdeel a, van de Politiewet 2012][ref1], wordt uitgezonden ten behoeve van het uitvoeren van de
      politietaak.

      4 De duur van de uitzending bedraagt een jaar, te verlengen met ten hoogste een jaar. In bijzondere omstandigheden
      kan van deze termijnen worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0014439/2024-06-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
  - number: '3'
    text: |-
      Onze Minister stelt voor de beschikbaarstelling en de voorwaarden waaronder deze plaatsvindt, nadere regels vast
      die in ieder geval bepalingen bevatten over:

      a. medische keuring;

      b. werkgeverslasten;

      c. de bezoldiging en de toelagen;

      d. de voorzieningen bij de beschikbaarstelling en bij de beëindiging daarvan;

      e. de voorzieningen bij verblijf in het missiegebied;

      f. voorzieningen bij ongevallen;

      g. verlof.
    url: https://wetten.overheid.nl/BWBR0014439/2024-06-22#Artikel3
  - number: 3a
    text: |-
      Dit besluit berust op [artikel 47, eerste lid, van de Politiewet 2012][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel47
