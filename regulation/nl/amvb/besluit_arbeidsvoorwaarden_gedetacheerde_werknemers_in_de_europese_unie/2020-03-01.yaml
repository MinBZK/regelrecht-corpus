preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 12 september 2016, nr. 2016-0000193477;

    Gelet op de artikelen 6, derde lid, 10, zesde lid, en 15, derde, vierde en vijfde lid, van de Wet
    arbeidsvoorwaarden gedetacheerde werknemers in de Europese Unie en 2a, tweede lid, van de Wet arbeid vreemdelingen;

    De Afdeling advisering van de Raad van State gehoord (advies van 2 november 2016, No.W12.16.0281/III);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid van 23 november 2016, nr. 2016-
    0000252779;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *IMI:* het Informatiesysteem interne
      markt, bedoeld in de IMI-verordening;
        - *IMI-verordening:* Verordening (EU) Nr. 1024/2012 van het Europees Parlement en de Raad van 25 oktober 2012
      betreffende de administratieve samenwerking via het Informatiesysteem interne markt en tot intrekking van
      Beschikking 2008/49/EG van de Commissie (PbEU 2012, L 316);
        - *wet:* [Wet arbeidsvoorwaarden gedetacheerde werknemers in de Europese Unie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0038054
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0038054
  - number: '2.1'
    text: |-
      Op grond van een met redenen omkleed verzoek van een bevoegde instantie van een andere lidstaat verstrekken de
      door Onze Minister aangewezen ambtenaren die instantie onverwijld de gegevens over gedetacheerde werknemers en
      dienstverrichters in verband met het toezicht op de naleving van de arbeidsvoorwaarden en de arbeidsomstandigheden,
      bedoeld in artikel 3 van de detacheringsrichtlijn, voor zover die gegevens noodzakelijk zijn voor de
      administratieve samenwerking, bedoeld in [artikel 4, eerste lid, van de wet][ref1]. Daarbij kan gebruik worden
      gemaakt van een nationaal identificatienummer, met inbegrip van het burgerservicenummer.


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel4
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '4'
  - number: '2.2'
    text: |-
      Indien een verzoek als bedoeld in het eerste lid ontoereikend is gemotiveerd, kan Onze Minister de verzoekende
      instantie in de gelegenheid stellen het verzoek binnen een redelijke termijn aan te vullen.
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel2
  - number: '2.3'
    text: |-
      In geval van een redelijk vermoeden van onregelmatigheden, verstrekken de door Onze Minister aangewezen ambtenaren
      de bevoegde instantie van het land van vestiging van de dienstverrichter uit eigen beweging alle relevante
      gegevens over gedetacheerde werknemers en dienstverrichters, voor zover die gegevens noodzakelijk zijn voor de
      administratieve samenwerking, bedoeld in [artikel 4, eerste lid, van de wet][ref1]. Daarbij kan gebruik worden
      gemaakt van een nationaal identificatienummer, met inbegrip van het burgerservicenummer.


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel4
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '4'
  - number: '2.4'
    text: |-
      De gegevens, genoemd in het eerste en derde lid worden kosteloos verstrekt. Hiervoor wordt gebruik gemaakt van het
      IMI, tenzij dit voor onevenredige vertraging zou zorgen.
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel2
  - number: '2.5'
    text: |-
      Voor het langs elektronische weg verstrekken van informatie waar de bevoegde instanties in andere lidstaten of de
      Europese Commissie om hebben verzocht, gelden de volgende termijnen:
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel2
  - number: 2.5.a
    text: 'Voor urgente gevallen: uiterlijk twee werkdagen na ontvangst van het verzoek.'
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel2
  - number: 2.5.b
    text: 'Voor alle overige verzoeken om informatie: uiterlijk 25 werkdagen na ontvangst van het verzoek.'
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel2
  - number: '2.6'
    text: |-
      Wanneer er zich problemen voordoen om aan een verzoek om informatie te voldoen, stellen de door Onze Minister
      aangewezen ambtenaren de verzoekende instantie daarvan onverwijld in kennis, en geven daarbij aan op welke wijze
      invulling kan worden gegeven aan het verzoek. Wanneer er sprake is van aanhoudende problemen bij de uitwisseling
      van informatie stellen de door Onze Minister aangewezen ambtenaren de Europese Commissie hiervan op de hoogte via
      het IMI.
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel2
  - number: '3.1'
    text: |-
      Onze Minister is bevoegd uit eigen beweging en verplicht op verzoek de gegevens met betrekking tot
      dienstverrichters, dienstontvangers, contactpersonen, de voor uitbetaling van het loon verantwoordelijke personen
      en gedetacheerde werknemers, die zijn verwerkt in verband met de [artikelen 4][ref1] en [8 van de wet][ref2],
      waaronder een nationaal identificatienummer zoals het burgerservicenummer begrepen kan worden, kosteloos te
      verstrekken aan:


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0038054#Artikel8
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0038054
        artikel: '8'
  - number: 3.1.a
    text: |-
      de inspecteur, bedoeld in [artikel 2, derde lid, onderdeel b, van de Algemene wet inzake rijksbelastingen][ref1],
      de ontvanger, bedoeld in [artikel 2, eerste lid, onderdeel i, van de Invorderingswet 1990][ref2], en de
      Belastingdienst/Toeslagen, bedoeld in [artikel 11 van de Algemene wet inkomensafhankelijke regelingen][ref3], voor
      zover die gegevens noodzakelijk zijn voor de heffing of invordering van enige rijksbelasting, van premies sociale
      verzekeringen als bedoeld in [artikel 2, onderdelen a en c, van de Wet financiering sociale verzekeringen][ref4]
      en van de inkomensafhankelijke bijdrage, bedoeld in de [Zorgverzekeringswet][ref5], met betrekking tot de
      gedetacheerde werknemers;


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0018472#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0018472
        artikel: '11'
      - id: ref4
        bwb_id: BWBR0017745
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0018450
  - number: 3.1.b
    text: |-
      de Sociale verzekeringsbank, voor zover die gegevens noodzakelijk zijn voor het vaststellen van de tijdvakken van
      verzekering voor de volksverzekeringen en de verzekeringsstatus van de gedetacheerde werknemers, of de toepassing
      van [Verordening (EG) nr. 883/2004](32004R0883) betreffende de coördinatie van de socialezekerheidsstelsels (PbEG
      2004, L 200);
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel3
  - number: 3.1.c
    text: |-
      de Inspectie Leefomgeving en Transport, voor zover die gegevens noodzakelijk zijn voor het toezicht op de
      naleving van het bepaalde bij of krachtens de [Arbeidsomstandighedenwet][ref1] en de [Arbeidstijdenwet][ref2], met
      betrekking tot: - arbeid door personen die werkzaam zijn in of op motorrijtuigen; en
        - arbeid verricht in bedrijven of inrichtingen die rechtstreeks betrekking heeft op de arbeid verricht in een
      voertuig op een openbare weg bestemd voor het vervoer van goederen.


      [ref1]: https://wetten.overheid.nl/BWBR0010346
      [ref2]: https://wetten.overheid.nl/BWBR0007671
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010346
      - id: ref2
        bwb_id: BWBR0007671
  - number: '3.2'
    text: |-
      Onze Minister is bevoegd uit eigen beweging en verplicht op verzoek de gegevens met betrekking tot
      dienstverrichters, dienstontvangers, contactpersonen, de voor uitbetaling van het loon verantwoordelijke personen
      en gedetacheerde werknemers, die zijn verwerkt in verband met [artikel 8 van de wet][ref1], waaronder een nationaal
      identificatienummer zoals het burgerservicenummer begrepen kan worden, kosteloos te verstrekken aan de Immigratie-
      en naturalisatiedienst, voor zover die gegevens noodzakelijk zijn voor de taken in verband met de uitvoering van de
      [Vreemdelingenwet 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
  - number: '4.1'
    text: |-
      Een verzoek als bedoeld in
      __REF000___________________________________________________________________________________________________________
      _________________________ wordt schriftelijk ingediend en met redenen omkleed. Indien uit het verzoek niet blijkt
      van een gegrond vermoeden van een mogelijke overtreding van een of meer algemeen verbindend verklaarde bepalingen
      van collectieve arbeidsovereenkomsten die gelden voor gedetacheerde werknemers en van de noodzaak voor de verzoeker
      om de verzochte gegevens te gebruiken voor het toezicht op de naleving van die bepaling of bepalingen, kan het
      verzoek worden geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0001987#Artikel10a
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001987
        artikel: 10a
  - number: '4.2'
    text: |-
      De gegevens, die Onze Minister op grond van
      __REF000___________________________________________________________________________________________________________
      _________________________ kan verstrekken uit de onder zijn verantwoordelijkheid gevoerde administraties,
      betreffen:


      [ref1]: https://wetten.overheid.nl/BWBR0001987#Artikel10a
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001987
        artikel: 10a
  - number: 4.2.a
    text: de identiteit van de dienstverrichter;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel4
  - number: 4.2.b
    text: de identiteit van de contactpersoon;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel4
  - number: 4.2.c
    text: de voor de uitbetaling van het loon verantwoordelijke natuurlijke persoon of rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel4
  - number: 4.2.d
    text: het adres van de hoofdvestiging;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel4
  - number: 4.2.e
    text: het aantal gedetacheerde werknemers;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel4
  - number: 4.2.f
    text: het adres van de werkplek;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel4
  - number: 4.2.g
    text: |-
      de opgaven als bedoeld in [artikel 626 van Boek 7 van het Burgerlijk Wetboek][ref1] van de gedetacheerde
      werknemers, met inbegrip van de maand en het jaar van de geboortedatum, dan wel de leeftijd, indien de werknemer
      nog niet de leeftijd van 23 jaar heeft bereikt, de maand en het jaar van indiensttreding en de functie;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel626
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '626'
  - number: 4.2.h
    text: bescheiden waaruit blijkt hoeveel uren de gedetacheerde werknemer heeft gewerkt; en
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel4
  - number: 4.2.i
    text: de arbeidsovereenkomsten met de gedetacheerde werknemers.
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel4
  - number: '4.3'
    text: De gegevens, bedoeld in het tweede lid, onderdelen g tot en met i, worden gepseudonimiseerd.
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel4
  - number: '5.1'
    text: |-
      De gegevens, bedoeld in de [artikelen 2 tot en met 4][ref1], worden vernietigd na een periode van maximaal 7 jaar,
      te rekenen vanaf de datum van ontvangst van het gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0038821#Artikel2
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0038821
        artikel: '2'
        hoofdstuk: II
  - number: '5.2'
    text: |-
      Indien blijkt dat gegevens onjuist zijn of ten onrechte worden verwerkt, worden deze verbeterd onderscheidenlijk
      verwijderd. Onze Minister doet daarvan zo spoedig mogelijk mededeling aan de personen en instanties die de gegevens
      hebben ontvangen.
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel5
  - number: '5.3'
    text: De gegevens die niet meer noodzakelijk zijn, gelet op het doel waarvoor zij worden verwerkt, worden verwijderd.
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel5
  - number: '5.4'
    text: De verwijderde gegevens worden vernietigd, tenzij wettelijke regels omtrent bewaring daaraan in de weg staan.
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel5
  - number: '5.5'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de in acht te nemen termijnen bij
      de verwerking van gegevens, bedoeld in de [artikelen 2 tot en met 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0038821#Artikel2
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0038821
        artikel: '2'
        hoofdstuk: II
  - number: '6'
    text: |-
      De elementen, bedoeld in [artikel 6, derde lid, onderdeel a, van de wet][ref1], ter beoordeling of een onderneming
      daadwerkelijk substantiële activiteiten verricht om werknemers ter beschikking te stellen in het kader van
      transnationale dienstverrichting, bestaan uit:


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel6
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '6'
  - number: 6.a
    text: de plaats waar de onderneming haar statutaire zetel heeft en waar haar administratie wordt verricht;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel6
  - number: 6.b
    text: |-
      de plaats waar de onderneming kantoren heeft, belasting en socialezekerheidspremies betaalt en waar zij, indien van
      toepassing, een vergunning voor de uitoefening van een beroep heeft of als onderneming is ingeschreven in registers
      die door de bevoegde instanties kunnen worden geraadpleegd of bij beroepsorganisaties;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel6
  - number: 6.c
    text: de plaats waar gedetacheerde werknemers worden geworven en de plaats van waaruit ze worden gedetacheerd;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel6
  - number: 6.d
    text: |-
      het op de overeenkomsten van de onderneming met de gedetacheerde werknemer en met de dienstontvanger toepasselijke
      recht;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel6
  - number: 6.e
    text: |-
      de plaats waar de onderneming haar belangrijkste ondernemingsactiviteiten ontplooit en waar zij administratief
      personeel heeft;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel6
  - number: 6.f
    text: |-
      het aantal overeenkomsten van dienstverrichting die worden uitgevoerd of de grootte van de omzet in de lidstaat
      van vestiging;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel6
  - number: 6.g
    text: de aard van de werkzaamheden van de onderneming in de lidstaat waar zij is gevestigd; en
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel6
  - number: 6.h
    text: |-
      of de werknemer rechtmatig verblijft en rechtmatig zijn hoofdactiviteit uitoefent in de lidstaat waar de
      onderneming is gevestigd.
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel6
  - number: '7'
    text: |-
      De elementen, bedoeld in [artikel 6, derde lid, onderdeel b, van de wet][ref1], ter beoordeling of er sprake is van
      een gedetacheerde werknemer die tijdelijk arbeid in Nederland verricht, bestaan uit:


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel6
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '6'
  - number: 7.a
    text: de periode waarin het werk wordt verricht in een andere lidstaat;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel7
  - number: 7.b
    text: de datum waarop de detachering begint;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel7
  - number: 7.c
    text: |-
      de detachering vindt plaats in een andere lidstaat dan die waar of van waaruit de gedetacheerde werknemer
      gewoonlijk zijn arbeid verricht;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel7
  - number: 7.d
    text: |-
      de gedetacheerde werknemer keert na de beëindiging van de werkzaamheden of de dienstverrichting waarvoor hij was
      gedetacheerd, terug naar de lidstaat van waar of van waaruit hij is gedetacheerd of waar hij wordt geacht weer te
      gaan werken;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel7
  - number: 7.e
    text: de aard van de activiteiten;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel7
  - number: 7.f
    text: |-
      de dienstverrichter die de werknemer detacheert, draagt zorg voor het vervoer, kost en inwoning of accommodatie of
      hij betaalt de kosten hiervoor terug aan de gedetacheerde werknemer;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel7
  - number: 7.g
    text: |-
      de wijze waarop is voorzien in het vervoer, kost en inwoning of accommodatie en de wijze van terugbetaling, bedoeld
      in onderdeel f;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel7
  - number: 7.h
    text: |-
      alle eerdere tijdvakken waarin dezelfde of een andere gedetacheerde werknemer de betrokken werkzaamheden heeft
      verricht;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel7
  - number: 7.i
    text: een bewijs waaruit de bijdrage voor de toepasselijke socialezekerheidsregelingen blijkt;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel7
  - number: 7.j
    text: |-
      de plaats van waaruit, de wijze waarop en de frequentie waarmee feitelijk leiding wordt gegeven aan de
      werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel7
  - number: 7.k
    text: |-
      wie de gedetacheerde persoon voor zijn arbeid betaalt en hoe deze betaling zich verhoudt tot het contract met de
      dienstverrichter en de dienstontvanger; en
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel7
  - number: 7.l
    text: |-
      hoe er feitelijk toezicht wordt gehouden en leiding wordt gegeven aan de werkzaamheden en of hierbij sprake is van
      een gezagsverhouding.
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel7
  - number: '8.1'
    text: |-
      De verplichtingen van [artikel 8, eerste en tweede lid, van de wet][ref1] zijn, voor wat betreft de identiteit van
      de persoon die de werkzaamheden uitvoert, de identiteit van de voor de uitbetaling van het loon verantwoordelijke
      persoon, met dien verstande dat daaronder wordt begrepen de voor de uitbetaling van de financiële tegenprestatie
      verantwoordelijke persoon, en de aard en vermoedelijke duur van de werkzaamheden, van overeenkomstige toepassing op
      zelfstandigen, die tijdelijk arbeid verrichten in Nederland in de sectoren van het beroeps- of bedrijfsleven, die
      in de Standaard Bedrijfsindeling worden aangeduid met de volgende classificaties:


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel8
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '8'
  - number: 8.1.a
    text: |-
      van de sectie A Landbouw, bosbouw en visserij: - 01 Landbouw, jacht en dienstverlening voor de landbouw en jacht;
        - 03.12 Binnenvisserij;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel8
  - number: 8.1.b
    text: |-
      van de sectie C Industrie: - 10.1 Slachterijen en vleesverwerking;
        - 10.2 Visverwerking;
        - 10.3 Verwerking van aardappels, groente en fruit;
        - 23 Vervaardiging van overige niet-metaalhoudende minerale producten;
        - 24 Vervaardiging van metalen in primaire vorm;
        - 25 Vervaardiging van producten van metaal (geen machines en apparaten);
        - 27 Vervaardiging van elektrische apparatuur (elektromotoren, batterijen, huishoudapparaten etc.);
        - 28 Vervaardiging van overige machines en apparaten;
        - 30 Vervaardiging van overige transportmiddelen;
        - 33 Reparatie en installatie van machines en apparaten;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel8
  - number: 8.1.c
    text: de sectie F Bouwnijverheid;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel8
  - number: 8.1.d
    text: |-
      van de sectie H Vervoer en opslag: - 49.4 Goederenvervoer over de weg, tenzij de tijdelijke arbeid uitsluitend
      bestaat uit het vervoeren van goederen door Nederland zonder in Nederland te laden of te lossen;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel8
  - number: 8.1.e
    text: de sectie I Logies-, maaltijd- en drankverstrekking;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel8
  - number: 8.1.f
    text: |-
      van de sectie N Verhuur van roerende goederen en overige zakelijke dienstverlening: - 81.2 Reiniging;
        - 81.3 Landschapsverzorging;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel8
  - number: 8.1.g
    text: |-
      van de sectie Q Gezondheids- en welzijnszorg: - 86.1 Ziekenhuizen en geestelijke gezondheids- en verslavingszorg
      met overnachting;
        - 87.1 Verpleeghuizen;
        - 87.2 Huizen en dagverblijven voor verstandelijk gehandicapten;
        - 87.3 Huizen en dagverblijven voor niet-verstandelijk gehandicapten en verzorgingshuizen;
        - 87.9 Jeugdzorg en maatschappelijke opvang met overnachting;
        - 88.1 Maatschappelijke dienstverlening zonder overnachting gericht op ouderen en gehandicapten;
        - 88.9 Maatschappelijke dienstverlening zonder overnachting niet specifiek gericht op ouderen en gehandicapten.
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel8
  - number: '8.2'
    text: |-
      Bij de beoordeling van de sector waartoe de werkzaamheden worden gerekend, nemen de toezichthoudende ambtenaren
      achtereenvolgens de volgende criteria in aanmerking:
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel8
  - number: 8.2.a
    text: de aard van de feitelijk verrichte werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel8
  - number: 8.2.b
    text: |-
      de activiteiten en werkzaamheden, zoals die zijn benoemd in de vervoersovereenkomst of de overeenkomst van opdracht
      of aanneming van werk;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel8
  - number: 8.2.c
    text: de bedrijfsindelingscode die aan de zelfstandige is toegekend op basis van diens economische activiteiten; en
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel8
  - number: 8.2.d
    text: de locatie waar de werkzaamheden worden verricht.
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel8
  - number: '9'
    text: |-
      Een melding in de zin van [artikel 8 van de wet][ref1] is geldig voor de duur van een jaar voor:


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel8
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '8'
  - number: 9.a
    text: 'een in het buitenland gevestigde dienstverrichter, die:'
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel9
  - number: 9.a.1°
    text: ten minste 1 en ten hoogste 9 werknemers in dienst heeft;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel9
  - number: 9.a.2°
    text: is gevestigd binnen een straal van 100 kilometer van de Nederlandse grens;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel9
  - number: 9.a.3°
    text: |-
      is ingeschreven in het handelsregister, bedoeld in [artikel 2 van de Handelsregisterwet 2007][ref1], of een
      vergelijkbaar register in aangrenzende landen;


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel2
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '2'
  - number: 9.a.4°
    text: |-
      in het voorafgaande kalenderjaar ten minste 3 transnationale diensten in Nederland heeft verricht, dan wel in het
      voorafgaande kalenderjaar een melding als bedoeld in dit artikel heeft verricht; en
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel9
  - number: 9.a.5°
    text: |-
      niet werkzaam is in een sector die in de Standaard Bedrijfsindeling is ingedeeld in: - de sectie F Bouwnijverheid;
      of
        - de afdeling 78 Arbeidsbemiddeling, uitzendbureaus en personeelsbeheer;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel9
  - number: 9.b
    text: 'een in het buitenland gevestigde zelfstandige, die:'
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel9
  - number: 9.b.1°
    text: |-
      werkzaam is in een in [artikel 8, eerste lid][ref1], genoemde sector van het beroeps- of bedrijfsleven;


      [ref1]: https://wetten.overheid.nl/BWBR0038821#Artikel8
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0038821
        artikel: '8'
        hoofdstuk: IV
  - number: 9.b.2°
    text: is gevestigd binnen een straal van 100 kilometer van de Nederlandse grens;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel9
  - number: 9.b.3°
    text: |-
      is ingeschreven in het handelsregister, bedoeld in [artikel 2 van de Handelsregisterwet 2007][ref1], of een
      vergelijkbaar register in aangrenzende landen;


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel2
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '2'
  - number: 9.b.4°
    text: |-
      in het voorafgaande kalenderjaar ten minste 3 transnationale diensten in Nederland heeft verricht, dan wel in het
      voorafgaande kalenderjaar een melding als bedoeld in dit artikel heeft verricht; en
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel9
  - number: 9.b.5°
    text: niet werkzaam is in de sector die in de Standaard Bedrijfsindeling is ingedeeld in de sectie F Bouwnijverheid;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel9
  - number: 9.c
    text: |-
      een dienstverrichter of in het buitenland gevestigde zelfstandige die werkzaam is in de sector die in de Standaard
      Bedrijfsindeling is ingedeeld in de groep 49.4 Goederenvervoer over de weg, met inbegrip van de dienstverrichter of
      zelfstandige die in Nederland in opdracht van een in Nederland gevestigde dienstontvanger goederen levert.
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel9
  - number: '10.1'
    text: |-
      [Artikel 8 van de wet][ref1] is niet van toepassing op de dienstverrichter, die uitsluitend de volgende categorieën
      van werknemers detacheert naar Nederland:


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel8
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '8'
  - number: 10.1.a
    text: |-
      werknemers die werkzaamheden uitvoeren in een sector die in de Standaard Bedrijfsindeling is ingedeeld in de
      groepen: '- 49.1 Personenvervoer per spoor (geen tram of metro);'
        - 49.2 Goederenvervoer per spoor;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel10
  - number: 10.1.b
    text: |-
      werknemers die werkzaamheden uitvoeren in de sector die in de Standaard Bedrijfsindeling is ingedeeld in de groep
      49.3 Personenvervoer over de weg;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel10
  - number: 10.1.c
    text: |-
      werknemers die werkzaamheden uitvoeren in de sector die in de Standaard Bedrijfsindeling is ingedeeld in de sector
      49.4 Goederenvervoer over de weg, mits die werkzaamheden uitsluitend bestaan in het vervoeren van goederen door
      Nederland zonder in Nederland te laden of te lossen;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel10
  - number: 10.1.d
    text: |-
      werknemers die werkzaamheden uitvoeren in de sector die in de Standaard Bedrijfsindeling is ingedeeld in de
      afdeling 50 Vervoer over water;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel10
  - number: 10.1.e
    text: |-
      werknemers die werkzaamheden uitvoeren in de sector die in de Standaard Bedrijfsindeling is ingedeeld in afdeling
      51 Luchtvaart;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel10
  - number: 10.1.f
    text: |-
      werknemers die werkzaamheden uitvoeren in de sector die in de Standaard Bedrijfsindeling is ingedeeld in de groep
      53 Post en koeriers;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel10
  - number: 10.1.g
    text: |-
      werknemers die werkzaamheden uitvoeren in een sector die in de Standaard Bedrijfsindeling is ingedeeld in de groep:
        - 84.1 Openbaar bestuur; of
        - 84.2 Overheidsdiensten;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel10
  - number: 10.1.h
    text: |-
      werknemers die werkzaamheden uitvoeren in de sector die in de Standaard Bedrijfsindeling is ingedeeld in de sectie
      U Extraterritoriale organisaties en lichamen.
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel10
  - number: 10.1.i
    text: |-
      gekwalificeerde of gespecialiseerde werknemers die de initiële assemblage of de eerste installatie uitvoeren
      van een goed, mits de werkzaamheden een wezenlijk bestanddeel uitmaken van een overeenkomst voor de levering van
      goederen, noodzakelijk zijn voor het in werking stellen daarvan en de duur van de werkzaamheden niet meer dan acht
      dagen bedraagt, tenzij het werkzaamheden in de sector bouwbedrijf betreft;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel10
  - number: 10.1.j
    text: |-
      werknemers die dringend onderhoud of reparaties uitvoeren aan werktuigen, machines of apparatuur, die door
      de dienstverrichter zijn geleverd aan de dienstontvanger ten behoeve waarvan de reparaties of het onderhoud
      plaatsvinden, dan wel werknemers die door de dienstverrichter geleverde software installeren, aanpassen, of die
      instrueren over het gebruik van die software, mits hun verblijf noodzakelijk is voor deze activiteiten en niet meer
      dan 12 aaneengesloten weken binnen een tijdsbestek van 36 weken bedraagt;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel10
  - number: 10.1.k
    text: |-
      werknemers die in Nederland wetenschappelijke congressen bijwonen, mits hun verblijf niet meer dan 5 dagen per
      kalendermaand bedraagt;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel10
  - number: 10.1.l
    text: |-
      werknemers die in Nederland zakelijke besprekingen voeren of overeenkomsten sluiten met bedrijven of instellingen,
      mits hun verblijf niet meer dan 13 aaneengesloten weken binnen een tijdsbestek van 52 weken bedraagt;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel10
  - number: 10.1.m
    text: |-
      werknemers die als correspondent werkzaam zijn in dienst van een publiciteitsmedium dat zijn hoofdzetel buiten
      Nederland gevestigd heeft;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel10
  - number: 10.1.n
    text: |-
      deelnemers aan internationale sportwedstrijden en hun vaste persoonlijke begeleiders, mits hun verblijf niet meer
      dan 6 aaneengesloten weken binnen een tijdsbestek van 13 weken bedraagt;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel10
  - number: 10.1.o
    text: |-
      artiesten en musici, en hun vaste persoonlijk begeleiders die een voorstelling uitvoeren, beeldend kunstenaars,
      conservators of restauratoren, mits hun verblijf niet meer dan 6 aaneengesloten weken binnen een tijdsbestek van 13
      weken bedraagt;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel10
  - number: 10.1.p
    text: gastdocenten die werkzaam zijn aan een Nederlandse instelling voor wetenschappelijk onderwijs;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel10
  - number: 10.1.q
    text: |-
      onderzoekers en leden van een wetenschappelijk team die door een universiteit of een wetenschappelijke
      instelling worden tewerkgesteld, die in Nederland aan een wetenschappelijk programma van een universiteit of
      een wetenschappelijke instelling deelnemen, mits hun verblijf niet meer dan 13 aaneengesloten weken binnen een
      tijdsbestek van 52 weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel10
  - number: '10.2'
    text: |-
      De dienstverrichter, die niet uitsluitend in het eerste lid genoemde categorieën van werknemers detacheert naar
      Nederland, meldt de in [artikel 8, eerste lid, van de wet][ref1] genoemde gegevens, met uitzondering van de
      identiteit van de gedetacheerde werknemer die valt onder een van de in het eerste lid genoemde categorieën en de
      bijdrage voor toepasselijke socialezekerheidsregelingen voor deze werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel8
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '8'
  - number: '11.1'
    text: |-
      De verplichting, bedoeld in [artikel 2a, eerste lid, van de Wet arbeid vreemdelingen][ref1] geldt niet voor de
      dienstverrichter op wie de meldingsplicht, bedoeld in [artikel 8, eerste lid, van de wet][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0038054#Artikel8
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 2a
      - id: ref2
        bwb_id: BWBR0038054
        artikel: '8'
  - number: '11.2'
    text: |-
      [Artikel 10, eerste lid][ref1], is niet van toepassing op de dienstverrichter die een vreemdeling als bedoeld in
      [artikel 1e van het Besluit uitvoering Wet arbeid vreemdelingen][ref2] detacheert. Indien artikel 10, tweede lid,
      van toepassing is, meldt deze dienstverrichter de in [artikel 8, eerste lid, van de wet][ref3] genoemde gegevens,
      met uitzondering van de identiteit van de gedetacheerde werknemer die valt onder een van de in artikel 10, eerste
      lid, genoemde categorieën en die geen vreemdeling is als bedoeld in artikel 1e van het Besluit uitvoering Wet
      arbeid vreemdelingen, en de bijdrage voor toepasselijke socialezekerheidsregelingen voor deze werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0038821#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0007523#Artikel1e
      [ref3]: https://wetten.overheid.nl/BWBR0038054#Artikel8
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0038821
        artikel: '10'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0007523
        artikel: 1e
      - id: ref3
        bwb_id: BWBR0038054
        artikel: '8'
  - number: '11.3'
    text: |-
      De dienstverrichter die een vreemdeling als bedoeld in
      [artikel 1e van het Besluit uitvoering Wet arbeid vreemdelingen][ref1] detacheert, verstrekt in aanvulling op
      de in [artikel 8, eerste lid, van de wet][ref2] genoemde gegevens de einddatum van de periode van rechtmatige
      tewerkstelling als vermeld in het document op grond waarvan het aan deze vreemdeling is toegestaan als werknemer
      arbeid te verrichten in de lidstaat van afgifte.


      [ref1]: https://wetten.overheid.nl/BWBR0007523#Artikel1e
      [ref2]: https://wetten.overheid.nl/BWBR0038054#Artikel8
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007523
        artikel: 1e
      - id: ref2
        bwb_id: BWBR0038054
        artikel: '8'
  - number: '12.1'
    text: |-
      De aangewezen ambtenaren, bedoeld in [artikel 10, eerste lid, van de wet][ref1], kunnen een verzoek tot invordering
      afwijzen op de volgende gronden:


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel10
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '10'
  - number: 12.1.a
    text: |-
      de verwachte kosten of middelen van de invordering van de administratieve sanctie of boete niet in verhouding staan
      tot het in te vorderen bedrag;
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel12
  - number: 12.1.b
    text: |-
      de administratieve sanctie of boete bedraagt minder dan € 350,– of indien het vreemde valuta betreft het equivalent
      van dit bedrag; of
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel12
  - number: 12.1.c
    text: met de uitvoering van het verzoek wordt gehandeld in strijd met een wettelijk voorschrift.
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel12
  - number: '12.2'
    text: |-
      Een verzoek als bedoeld in [artikel 10, tweede lid, van de wet][ref1] kan worden afgewezen, indien het verzoek niet
      voldoet aan de regels, bedoeld in artikel 10, vijfde lid, van de wet, onvolledig is of onmiskenbaar niet strookt
      met de onderliggende beslissing.


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel10
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '10'
  - number: '13.1'
    text: |-
      Als ernstige overtredingen als bedoeld in [artikel 15, derde en vijfde lid, van de wet][ref1] worden aangewezen
      de overtredingen van de informatieverplichting, bedoeld in [artikel 6, eerste lid, van de wet][ref2] en van
      de administratieve eisen en controlemaatregelen, bedoeld in de [artikelen 8, eerste en zesde lid][ref3], en
      [9, eerste en derde lid, van de wet][ref4], waarbij ten minste twintig gedetacheerde werknemers betrokken zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0038054#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0038054#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0038054#Artikel9
    url: https://wetten.overheid.nl/BWBR0038821/2020-03-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0038054
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0038054
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0038054
        artikel: '9'
  - number: '13.2'
    text: |-
      Als soortgelijke verplichtingen en verboden als bedoeld in [artikel 15, vierde lid, van de wet][ref1]
      worden aangewezen de informatie- en administratieve verplichtingen op grond van de
      [artikelen 6, eerste en tweede lid][ref2], [8, eerste, derde en zesde lid][ref3], en
      [9, eerste tot en met derde lid, van de wet][ref4] en de verplichting op grond van
      [artikel 2a van de Wet arbeid vreemdelingen][ref5].


