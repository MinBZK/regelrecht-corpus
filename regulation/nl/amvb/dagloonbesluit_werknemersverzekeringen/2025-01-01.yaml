  - number: 27c.3
    text: |-
      Met een melding of aanvraag als bedoeld in het tweede lid wordt gelijkgesteld
      een melding of aanvraag om een eenmalige tegemoetkoming op grond van
      __REF000___________________________________________________________________________________________________________
      _________, indien er na 1 januari 2018 nog recht is op de betreffende WW-uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0038659#Artikel2
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel27c
    references:
      - id: ref1
        bwb_id: BWBR0038659
        artikel: '2'
  - number: 27c.4
    text: |-
      Het eerste lid is niet van toepassing op de werknemer wiens recht op een WW-uitkering is ontstaan voor 15 november
      2017, maar waarvan de datum van de beschikking omtrent het ontstaan van dat recht op of na 15 november 2017 ligt.
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel27c
  - number: 27d
    text: |-
      De [artikelen 12c tot en met 12f,][ref1] zoals deze luiden na de dag van inwerkingtreding van artikel I, onderdelen
      E tot en met H, van het Besluit van 20 juni 2018 tot wijziging van het Dagloonbesluit werknemersverzekeringen in
      verband met een andere berekeningswijze van het WW-dagloon in het geval van een lager dagloon door ziekte in de
      referteperiode en enkele andere wijzigingen (Stb. 2018, 193), zijn niet van toepassing op de werknemer wiens recht
      op ziekengeld is ontstaan voor die dag van inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0033471#Artikel12c
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel27d
    references:
      - id: ref1
        bwb_id: BWBR0033471
        artikel: 12c
        hoofdstuk: 2a
  - number: 27e.1
    text: |-
      De [artikelen 5][ref1], [12e][ref2], [16][ref3] en [18][ref4], zoals deze luidden op 31 december 2021, blijven van
      toepassing op uitkeringen waarvan de eerste rechtdag is gelegen voor 1 januari 2022.


      [ref1]: https://wetten.overheid.nl/BWBR0033471#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0033471#Artikel12e
      [ref3]: https://wetten.overheid.nl/BWBR0033471#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0033471#Artikel18
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel27e
    references:
      - id: ref1
        bwb_id: BWBR0033471
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0033471
        artikel: 12e
        hoofdstuk: 2a
      - id: ref3
        bwb_id: BWBR0033471
        artikel: '16'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0033471
        artikel: '18'
        hoofdstuk: '3'
  - number: 27e.2
    text: |-
      Onder eerste rechtdag, bedoeld in het eerste lid, wordt voor de [WW][ref1] de eerste dag van werkloosheid verstaan,
      voor de [Wet WIA][ref2] en [WAO][ref3] de dag dat recht op uitkering is ontstaan en voor de [ZW][ref4] de eerste
      dag waarover het ziekengeld wordt uitgekeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0019057
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0001888
