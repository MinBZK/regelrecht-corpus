        bwb_id: BWBR0019057
        artikel: '5'
  - number: 1.1.c
    text: |-
      *arbeidsurenverlies:* het arbeidsurenverlies, bedoeld in [artikel 16, eerste lid, van de WW][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '16'
  - number: 1.1.d
    text: |-
      *arbeidsvoorwaardenbedrag:* het aan de werknemer toegekende en in geld uitgedrukte toekomstige loonbestanddeel,
      niet zijnde een afzonderlijke opbouw van vakantiebijslag, dat is opgebouwd ingevolge afspraken in de individuele
      of collectieve arbeidsovereenkomst, voor zover dit toekomstige loonbestanddeel kan leiden tot loon als bedoeld in
      [artikel 16 van de Wfsv][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel16
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '16'
  - number: 1.1.e
    text: |-
      *bedrag dat als loon is uitbetaald ten laste van een arbeidsvoorwaardenbedrag:* het door de werkgever als loon in
      de zin van [artikel 16 van de Wfsv][ref1] uitbetaalde bedrag ten laste van een arbeidsvoorwaardenbedrag voor zover
      dit loon belastbaar is op grond van de [Wet op de loonbelasting 1964][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0002471
  - number: 1.1.f
    text: |-
