        artikel: '8'
  - number: 12h.2.a
    text: |-
      het vastgestelde en herziene ZW-dagloon, tenzij er met de uitkering op grond van die wet in de vier kalenderweken
      voorafgaand aan de Wazo-uitkering ander inkomen dan uit de dienstbetrekking, op grond waarvan het recht op
      ziekengeld is ontstaan is verrekend op grond van [artikel 31 van de ZW][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel31
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel12h
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '31'
  - number: 12h.2.b
    text: |-
      100/A van het ziekengeld per dag over de vier kalenderweken voorafgaande aan de Wazo-uitkering, indien er met
      de uitkering op grond van die wet in de vier kalenderweken voorafgaand aan de Wazo-uitkering ander inkomen
      dan uit de dienstbetrekking, op grond waarvan het recht op ziekengeld is ontstaan is verrekend op grond van
      [artikel 31 van de ZW][ref1]. Daarbij staat A voor het uitkeringpercentage van de uitkering op grond van de
      [ZW][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel12h
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0001888
  - number: 12h.3
    text: |-
      Indien de gelijkgestelde, bedoeld in het tweede lid, recht had op ziekengeld, omdat hij op de eerste dag dat hij
      zijn arbeid niet kon verrichten vanwege ziekte op grond van [artikel 7, onderdeel a, van de ZW][ref1] als werknemer
      werd aangemerkt, wordt, in afwijking van het tweede lid, het dagloon vastgesteld op:


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel7
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel12h
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '7'
  - number: 12h.3.a
    text: |-
      het vastgestelde en herziene WW-dagloon, indien met de uitkering op grond van de [ZW][ref1] in de kalendermaand
      voorafgaande aan de kalendermaand waarin het recht op uitkering op grond van de [Wazo][ref2] is ontstaan, geen
      inkomen als bedoeld in [artikel 1b van de WW][ref3] is verrekend; of


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0013008
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel1b
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel12h
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0013008
      - id: ref3
        bwb_id: BWBR0004045
        artikel: 1b
  - number: 12h.3.b
    text: |-
      100/A keer de gemiddelde uitkering op grond van de [ZW][ref1] per dag, waarop recht bestond, in de laatste
      kalendermaand voorafgaande aan de kalendermaand waarin het recht op uitkering op grond van de [Wazo][ref2] is
      ontstaan, indien met de uitkering op grond van de [ZW][ref3] in die laatste kalendermaand inkomen als bedoeld in
      [artikel 1b van de WW][ref4] is verrekend. A staat daarbij voor het uitkeringspercentage van de uitkering op grond
      van de [ZW][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0013008
      [ref3]: https://wetten.overheid.nl/BWBR0001888
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel1b
      [ref5]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel12h
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0013008
      - id: ref3
        bwb_id: BWBR0001888
      - id: ref4
        bwb_id: BWBR0004045
        artikel: 1b
      - id: ref5
        bwb_id: BWBR0001888
  - number: 12h.4
    text: |-
      Voor de gelijkgestelde, bedoeld in [artikel 3:6, eerste lid, onderdeel b, onder 2°, van de Wazo][ref1], is
      het dagloon, in afwijking van de [artikelen 12b tot en met 12f][ref2], gelijk aan het reeds vastgestelde en
      herziene WIA-dagloon. Indien voor de gelijkgestelde, bedoeld in de eerste zin, bij het vaststellen van de hoogte
      van de loongerelateerde uitkering van de werkhervattingsuitkering gedeeltelijk arbeidsgeschikten op grond van
      [artikel 61 van de Wet WIA][ref3] rekening werd gehouden met inkomen, wordt het Wazo-dagloon, vastgesteld op 100/70
      keer de gemiddelde uitkering per dag in de laatste kalendermaand voorafgaande aan de kalendermaand waarin het recht
      op uitkering op grond van de [Wazo][ref4] is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0033471#Artikel12b
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel61
      [ref4]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel12h
    references:
