    text: |-
      het vastgestelde en herziene WW-dagloon, indien met de uitkering op grond van die wet in de kalendermaand
      voorafgaande aan de kalendermaand waarin het recht op uitkering op grond van de [Wazo][ref1] is ontstaan, geen
      inkomen als bedoeld in [artikel 1b van de WW][ref2] is verrekend; of


      [ref1]: https://wetten.overheid.nl/BWBR0013008
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel1b
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel12h
    references:
      - id: ref1
        bwb_id: BWBR0013008
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 1b
  - number: 12h.1.b
    text: |-
      100/70 keer de gemiddelde uitkering op grond van de [WW][ref1] per werkdag, waarop recht bestond, in de laatste
      kalendermaand voorafgaande aan de kalendermaand waarin het recht op uitkering op grond van de [Wazo][ref2]
      is ontstaan, indien met de uitkering op grond van de WW in die laatste kalendermaand inkomen als bedoeld in
      [artikel 1b van die wet][ref3] is verrekend.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0013008
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel1b
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel12h
    references:
