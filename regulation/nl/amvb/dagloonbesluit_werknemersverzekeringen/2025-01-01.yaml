        artikel: '68'
      - id: ref4
        bwb_id: BWBR0001888
        artikel: '71'
  - number: 12h.6
    text: |-
      Dit artikel is van overeenkomstige toepassing voor de persoon die recht heeft op een Wazo-uitkering op grond van
      [artikel 3:10 van de Wazo][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel12h
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '13.1'
    text: |-
      Onder referteperiode wordt in dit hoofdstuk de periode verstaan van één jaar die eindigt op de laatste dag van het
      aangiftetijdvak voorafgaande aan het aangiftetijdvak waarin de arbeidsongeschiktheid is ingetreden, of die eindigt,
      in geval de arbeidsongeschiktheid is ingetreden in gelijktijdige dienstbetrekkingen, op de laatste dag van het
      aangiftetijdvak dat het eerst voor het intreden van de arbeidsongeschiktheid is geëindigd.
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel13
  - number: '13.2'
    text: |-
      Indien [artikel 40, eerste lid, van de WAO][ref1] van toepassing is, is artikel 40, tweede lid, van de WAO van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel40
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '40'
  - number: '13.3'
    text: |-
      De referteperiode eindigt, indien de aanspraak op uitkering berust op [artikel 10 van de Wet WIA][ref1] of
      op [artikel 17 van de WAO][ref2], in afwijking van het eerste lid, op de laatste dag van het aangiftetijdvak
      voorafgaand aan het aangiftetijdvak waarin de verzekering is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel17
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '17'
  - number: '14'
    text: |-
      Onder loon wordt in dit hoofdstuk verstaan loon in de zin van [artikel 16 van de Wfsv][ref1] met dien verstande dat
      niet onder loon wordt begrepen:


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel16
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '16'
  - number: 14.a
    text: |-
      de toeslagen en aanvullingen, bedoeld in [artikel 16, tweede lid, onderdeel a, van die wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel16
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '16'
  - number: 14.b
    text: |-
      een eindheffingsbestanddeel als bedoeld in
      [artikel 31, eerste lid, onderdeel a, van de Wet op de loonbelasting 1964][ref1] ten aanzien waarvan de
      werkgever met toestemming van de inspecteur van de rijksbelastingdienst geen correctiebericht als bedoeld in
      [artikel 28a van de laatstgenoemde wet][ref2] heeft ingediend; en


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel28a
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 28a
  - number: 14.c
    text: |-
      een uitkering op grond van [hoofdstuk IV van de WW][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: IV
  - number: '15.1'
    text: |-
      Voor de toepassing van dit hoofdstuk wordt de werknemer geacht zijn loon te hebben genoten in het aangiftetijdvak
      waarover een werkgever van dat loon opgave heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel15
  - number: '15.2'
    text: |-
      Onder loon als bedoeld in [artikel 14][ref1] wordt mede begrepen het loon waarvan de werknemer aantoont dat dit
      in de referteperiode vorderbaar maar niet tevens inbaar is geworden. Voor de toepassing van dit hoofdstuk wordt de
      werknemer geacht dit loon te hebben genoten in het aangiftetijdvak waarin het vorderbaar is geworden. Indien in de
      referteperiode een uitkering is genoten, waarbij in het dagloon loon als bedoeld in de eerste zin is meegerekend,
      wordt, indien van dat loon in de referteperiode opgave is gedaan, dat loon bij de dagloonberekening buiten
      beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0033471#Artikel14
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0033471
        artikel: '14'
        hoofdstuk: '3'
  - number: '16.1'
    text: |-
      Het dagloon van uitkeringen op grond van de [Wet WIA][ref1] en de [WAO][ref2] is de uitkomst van de volgende
      berekening: '(A – B + C) / D waarbij: A staat voor het loon dat de werknemer in de referteperiode heeft genoten bij'
      alle werkgevers; B staat voor de bedragen aan vakantiebijslag die in de referteperiode als loon zijn uitbetaald
      ten laste van een opgebouwd bedrag en de bedragen die in die periode als loon zijn uitbetaald ten laste van een
      arbeidsvoorwaardenbedrag; C staat voor de in de referteperiode opgebouwde bedragen ten behoeve van vakantiebijslag
      dan wel ten behoeve van een arbeidsvoorwaardenbedrag; en D staat voor 261.


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0019057
      - id: ref2
        bwb_id: BWBR0002524
  - number: '16.2'
    text: |-
      In een gebroken aangiftetijdvak worden de factoren A, B en C berekend door het loon, de vakantiebijslag of de
      bedragen voor opbouw of opname van een arbeidsvoorwaardenbedrag in dat tijdvak te vermenigvuldigen met de breuk Y/
      Z waarbij: Z staat voor het aantal dagloondagen in het gebroken aangiftetijdvak binnen de dienstbetrekking of de
      uitkeringsverhouding; en Y staat voor het aantal dagloondagen van Z dat binnen de referteperiode valt. Indien Z nul
      is, wordt de uitkomst van deze berekening op nihil gesteld.
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel16
  - number: '16.3'
    text: |-
      Indien het loon in de referteperiode geheel of gedeeltelijk heeft bestaan uit een uitkering wordt voor de
      toepassing van het eerste lid het bedrag van de uitkering gesteld op de uitkomst van de volgende berekening: ((100
      x E) / F) waarbij: E staat voor de uitkering; en F staat voor:
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel16
  - number: 16.3.a
    text: 70, dan wel
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel16
  - number: 16.3.b
    text: |-
      indien het uitkeringspercentage op grond van de [ZW][ref1], de [WAO][ref2], [hoofdstuk 6 van de Wet WIA][ref3] of
      van [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wazo][ref4] hoger is dan 70, het uitkeringspercentage waarnaar de
      uitkering is berekend; of


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk6
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0019057
        hoofdstuk: '6'
      - id: ref4
        bwb_id: BWBR0013008
        hoofdstuk: '3'
  - number: 16.3.c
    text: |-
      100, indien [artikel 53][ref1] of [63 van de Wet WIA][ref2] van toepassing is, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel63
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '53'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '63'
  - number: 16.3.d
    text: |-
      indien de teller van de factor, bedoeld in [artikel 53][ref1] of [63 van de Wet WIA][ref2] lager is, de waarde van
      die teller.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel63
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '53'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '63'
  - number: '16.4'
    text: |-
      Voor zover het derde lid van toepassing is, wordt voor de toepassing van het eerste lid, het bedrag van de
      vakantiebijslag behorende bij de uitkeringen bedoeld in het derde lid, gesteld op de uitkomst van de volgende
      berekening: '(100 x G) / H waarbij: G staat voor de vakantiebijslag die in het in aanmerking te nemen tijdvak is'
      genoten; en H gelijk is aan de factor F, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel16
  - number: '16.5'
    text: |-
      Indien een dienstbetrekking is geëindigd door wederzijds goedvinden van partijen, of opzegging, zonder inachtneming
      van de geldende opzegtermijn, wordt voor de toepassing van het eerste lid factor D verminderd met het aantal
      dagloondagen gedurende de periode tussen de laatste dag van die dienstbetrekking en de dag waarop de rechtens
      geldende opzegtermijn eindigt, voor zover die periode in de referteperiode ligt en worden de factoren A, B en C
      verminderd met al het loon genoten in de aangiftetijdvakken die volledig liggen binnen die periode.
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel16
  - number: '17.1'
    text: |-
      Indien de werknemer in een aangiftetijdvak in de referteperiode geen loon of minder loon heeft genoten in verband
      met verlof of werkstaking of omdat hij de bedongen arbeid niet heeft verricht wegens ziekte wordt bij de berekening
      van het dagloon, bedoeld in [artikel 16, eerste lid][ref1], als loon in dat aangiftetijdvak in aanmerking genomen
      het loon, genoten bij dezelfde werkgever in het laatste aan dat verlof, die werkstaking of die ziekte, voorafgaande
      en volledig in de referteperiode gelegen aangiftetijdvak, waarin die omstandigheden zich niet hebben voorgedaan en
      waarin de werknemer het volledige aangiftetijdvak in dienstbetrekking tot de desbetreffende werkgever stond.


      [ref1]: https://wetten.overheid.nl/BWBR0033471#Artikel16
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0033471
        artikel: '16'
        hoofdstuk: '3'
  - number: '17.2'
    text: |-
      Indien er geen voorafgaand aangiftetijdvak als bedoeld in het eerste lid is, wordt bij de berekening van het
      dagloon, bedoeld in [artikel 16, eerste lid][ref1], het loon in aanmerking genomen bij dezelfde werkgever over het
      aangiftetijdvak direct na afloop van dat verlof, die werkstaking of die ziekte, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0033471#Artikel16
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0033471
        artikel: '16'
        hoofdstuk: '3'
  - number: 17.2.a
    text: dat aangiftetijdvak geheel gelegen is in de referteperiode, en
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel17
  - number: 17.2.b
    text: de werknemer gedurende het volledige aangiftetijdvak in dienstbetrekking tot de desbetreffende werkgever stond.
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel17
  - number: '17.3'
    text: |-
      Indien er geen aangiftetijdvak is als bedoeld in het eerste of tweede lid, wordt voor ieder in de referteperiode
      gelegen aangiftetijdvak waarin door de werknemer geen of minder loon is genoten in verband met de in het eerste lid
      genoemde omstandigheden, bij de berekening van het dagloon het per aangiftetijdvak geldende overeengekomen loon in
      aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel17
  - number: '17.4'
    text: 'Dit artikel blijft buiten toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel17
  - number: 17.4.a
    text: de toepassing van dit artikel leidt tot een lager dagloon, of
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel17
  - number: 17.4.b
    text: |-
      gedurende het aangiftetijdvak, bedoeld in het eerste lid, het te vervangen loon mede bestaat uit een uitkering in
      verband met de omstandigheden, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel17
  - number: '18.1'
    text: |-
      Het dagloon van de werknemer die vanaf de aanvang van de referteperiode tot en met de laatste dag van het eerste
      volledige aangiftetijdvak van dat jaar geen loon als bedoeld in [artikel 14][ref1] of [15][ref2] heeft genoten,
      wordt vastgesteld door bij de toepassing van [artikel 16, eerste lid][ref3], «261» te vervangen door: het aantal
      dagloondagen vanaf en met inbegrip van de dag waarop de dienstbetrekking is aangevangen tot en met de laatste dag
      van de referteperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0033471#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0033471#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0033471#Artikel16
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0033471
        artikel: '14'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0033471
        artikel: '15'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0033471
        artikel: '16'
        hoofdstuk: '3'
  - number: '18.2'
    text: |-
      Het dagloon van de werknemer die in de referteperiode geen loon als bedoeld in [artikel 14][ref1] of [15][ref2]
      heeft genoten is de uitkomst van de volgende berekening: (A – B + C) / D waarbij: A staat voor het loon dat
      de werknemer voor het intreden van de arbeidsongeschiktheid heeft genoten in het aangiftetijdvak waarin de
      arbeidsongeschiktheid is ingetreden, bij alle werkgevers; B staat voor de bedragen aan vakantiebijslag die
      voor het intreden van de arbeidsongeschiktheid als loon zijn uitbetaald ten laste van een opgebouwd bedrag
      en de bedragen die voor het intreden van de arbeidsongeschiktheid als loon zijn uitbetaald ten laste van
      een arbeidsvoorwaardenbedrag in het aangiftetijdvak waarin de arbeidsongeschiktheid is ingetreden; C staat
      voor de in de referteperiode opgebouwde bedragen ten behoeve van vakantiebijslag dan wel ten behoeve van een
      arbeidsvoorwaardenbedrag in het aangiftetijdvak waarin de arbeidsongeschiktheid is ingetreden; en D staat voor het
      in dat aangiftetijdvak gelegen aantal dagloondagen vanaf en met inbegrip van de dag waarop de dienstbetrekking is
      aangevangen tot de dag van intreden van de arbeidsongeschiktheid.


      [ref1]: https://wetten.overheid.nl/BWBR0033471#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0033471#Artikel15
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0033471
        artikel: '14'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0033471
        artikel: '15'
        hoofdstuk: '3'
  - number: '18.3'
    text: |-
      Indien D nul is, is het dagloon, in afwijking van het tweede lid, de uitkomst van de volgende berekening: E/F
      waarbij: E staat voor het overeengekomen loon in het aangiftetijdvak waarin de arbeidsongeschiktheid is ingetreden;
      en F staat voor het aantal dagloondagen in het aangiftetijdvak waarin de arbeidsongeschiktheid is ingetreden dan
      wel, indien het een aangiftetijdvak van een maand betreft, 21,75.
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel18
  - number: '18.4'
    text: Dit artikel is niet van toepassing indien de werknemer in verband met verlof geen loon heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel18
  - number: '19'
    text: |-
      Indien een werknemer, die recht heeft op een uitkering op grond van de [WAO][ref1] of de [Wet WIA][ref2], op
      of na de dag waarop hij de leeftijd van 45 jaar heeft bereikt, met arbeid inkomen is gaan verwerven in verband
      waarmee zijn uitkering op grond van de WAO of de Wet WIA is beëindigd, binnen vijf jaar na de datum waarop die
      uitkering is beëindigd recht heeft op een uitkering op grond van de Wet WIA, wordt het WIA-dagloon niet lager
      vastgesteld dan het WAO- of WIA-dagloon van de laatstelijk ontvangen uitkering op grond van de WAO of de Wet WIA.
      Het dagloon van de laatstelijk ontvangen uitkering als bedoeld in de eerste zin, wordt in aanmerking genomen, zoals
      dat zou zijn herzien vanaf de datum van beëindiging tot aan de datum van het nieuwe recht op uitkering op grond
      van [artikel 15, eerste lid, van de WAO][ref3], dan wel [artikel 14, eerste lid, van de Wet WIA][ref4] indien de
      uitkering op grond van de WAO of de Wet WIA niet zou zijn beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0019057
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0019057#Artikel14
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0019057
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '15'
      - id: ref4
        bwb_id: BWBR0019057
        artikel: '14'
  - number: '20'
    text: |-
      Het WIA-dagloon van de werknemer, die gedeeltelijk arbeidsongeschikt is als bedoeld in
      [artikel 46, derde lid, van de Wet WIA][ref1], zoals dat artikellid luidde op 31 december 2010,
      bedraagt ten hoogste het maatmaninkomen, dat op grond van dat artikellid, zoals dat luidde op
      31 december 2010, wordt vastgesteld, vermenigvuldigd met het aantal uren van de urenomvang, bedoeld in
      [artikel 9, onderdeel b, van het Schattingsbesluit arbeidsongeschiktheidswetten][ref2], gedeeld door vijf.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0011478#Artikel9
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '46'
      - id: ref2
        bwb_id: BWBR0011478
        artikel: '9'
  - number: '21'
    text: |-
      In de gevallen waarin de [artikelen 48, eerste lid, onderdelen b en c][ref1], en
      [55, eerste lid, onderdelen b en c, van de Wet WIA][ref2] van toepassing zijn, wordt het WIA-
      dagloon niet lager vastgesteld dan het dagloon dat op grond van de [Wet WIA][ref3] in aanmerking zou
      zijn genomen als het recht op uitkering zou zijn ontstaan op de in [artikel 47, tweede lid][ref4], en
      [artikel 54, tweede lid van de Wet WIA][ref5] bedoelde dag, zoals dat dagloon vanaf die dag tot aan de datum van
      het recht op uitkering op grond van [artikel 14, eerste lid, van de Wet WIA][ref6] zou zijn herzien, indien het
      recht op uitkering op grond van de Wet WIA op die dag zou zijn ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0019057
      [ref4]: https://wetten.overheid.nl/BWBR0019057#Artikel47
      [ref5]: https://wetten.overheid.nl/BWBR0019057#Artikel54
      [ref6]: https://wetten.overheid.nl/BWBR0019057#Artikel14
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '48'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '55'
      - id: ref3
        bwb_id: BWBR0019057
      - id: ref4
        bwb_id: BWBR0019057
        artikel: '47'
      - id: ref5
        bwb_id: BWBR0019057
        artikel: '54'
      - id: ref6
        bwb_id: BWBR0019057
        artikel: '14'
  - number: '23'
    text: |-
      Indien het minimumloon is herzien tussen het einde van de referteperiode en de eerste dag waarop recht bestaat
      op een uitkering op grond van de [ZW][ref1], de [WW][ref2], de [Wet WIA][ref3], de [WAO][ref4] of de [WAZO][ref5]
      wordt de hoogte van het dagloon zoals berekend op grond van dit besluit aangepast in de mate waarin het minimumloon
      is herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0019057
      [ref4]: https://wetten.overheid.nl/BWBR0002524
      [ref5]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0019057
      - id: ref4
        bwb_id: BWBR0002524
      - id: ref5
        bwb_id: BWBR0013008
  - number: '24.1'
    text: 'Indien de werknemer:'
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel24
  - number: 24.1.a
    text: |-
      bij aanvang van de referteperiode, bedoeld in [artikel 2][ref1], [artikel 12b][ref2] of [artikel 13][ref3], jonger
      is dan 21 jaar en het op grond van dit besluit berekende dagloon minder bedraagt dan het minimumloon vermeerderd
      met de vakantiebijslag, bedoeld in [artikel 15 van de WML][ref4], dat behoort bij de leeftijd van de werknemer op
      de eerste dag waarop recht bestaat op uitkering; of


      [ref1]: https://wetten.overheid.nl/BWBR0033471#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033471#Artikel12b
      [ref3]: https://wetten.overheid.nl/BWBR0033471#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0033471
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0033471
        artikel: 12b
        hoofdstuk: 2a
      - id: ref3
        bwb_id: BWBR0033471
        artikel: '13'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0002638
        artikel: '15'
  - number: 24.1.b
    text: |-
      op de eerste dag waarop recht bestaat op uitkering jonger is dan 21 jaar en het op grond van de overige artikelen
      van dit besluit berekende dagloon minder bedraagt dan het minimumloon vermeerderd met de vakantiebijslag, bedoeld
      in [artikel 15 van de WML][ref1], dat behoort bij de leeftijd van de werknemer bij zijn verjaring,


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '15'
  - number: '24.2'
    text: |-
      Het op grond van dit artikel verhoogde dagloon bedraagt niet meer dan het minimumloon vermeerderd met de
      vakantiebijslag, bedoeld in [artikel 15 van de WML][ref1] dat behoort bij de leeftijd van de werknemer op de eerste
      dag waarop recht bestaat op uitkering, dan wel bij de leeftijd van de werknemer bij zijn verjaring.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '15'
  - number: '24.3'
    text: |-
      Indien bij het vaststellen van het dagloon [artikel 18][ref1] van toepassing is of indien de dienstbetrekking is
      aangevangen na aanvang van de referteperiode, wordt bij toepassing van het eerste lid voor «bij aanvang van de
      referteperiode» gelezen: bij aanvang van de dienstbetrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0033471#Artikel18
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0033471
        artikel: '18'
        hoofdstuk: '3'
  - number: '24.4'
    text: |-
      Indien de referteperiode, bedoeld in het eerste lid, is aangevangen voor 1 juli 2019, wordt bij toepassing van het
      eerste lid voor «21 jaar» gelezen: 22 jaar.
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel24
  - number: '25.1'
    text: |-
      Vanaf het moment waarop een werknemer gelijktijdig aanspraak gaat hebben op meer dan een
      uitkering en de som van de uitkeringen per dag meer bedraagt dan 70% van het bedrag, bedoeld in
      [artikel 17, eerste lid, tweede zin, van de Wfsv][ref1], met betrekking tot een loontijdvak van een dag, worden
      de aan die uitkeringen ten grondslag liggende daglonen zodanig vastgesteld of herzien dat de som van de evenredig
      verlaagde uitkeringen per dag niet meer bedraagt dan 70% van dat bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel17
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '17'
  - number: '25.2'
    text: |-
      Indien van een van de uitkeringen, bedoeld in het eerste lid, het uitkeringspercentage hoger is dan 70, wordt de
      uitkomst van 70% van het bedrag bedoeld in [artikel 17, eerste lid, tweede zin, van de Wfsv][ref1], met betrekking
      tot een loontijdvak van een dag, verhoogd met de uitkomst van de volgende berekening: ((A – 70) / 100) x B
      waarbij: A staat voor het hogere uitkeringspercentage; en B staat voor het dagloon van de uitkering, waarvoor het
      uitkeringspercentage A geldt voordat dit dagloon is herzien op grond van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel17
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '17'
  - number: '25.3'
    text: |-
      Indien een van de uitkeringen, bedoeld in het eerste of tweede lid, wordt beëindigd wegens het bereiken van de
      maximale uitkeringsduur, wordt het dagloon van de resterende uitkering of uitkeringen met ingang van de dag van de
      beëindiging herzien, voor zover van toepassing met inachtneming van het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel25
  - number: '26.1'
    text: |-
      Het [Besluit dagloonregels werknemersverzekeringen][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0018842
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0018842
  - number: '26.2'
    text: |-
      Het [Besluit dagloonregels werknemersverzekeringen][ref1], zoals dat luidde voor de in het eerste lid bedoelde
      intrekking blijft van toepassing op uitkeringen als bedoeld in dat besluit waarvan de eerste uitkeringsdag is
      gelegen voor de datum van intrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0018842
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0018842
  - number: '26.3'
    text: |-
      Indien zich ten aanzien van de uitkeringen, bedoeld in het tweede lid, op of na de inwerkingtreding van dit besluit,
      een situatie voordoet als bedoeld in [artikel 22 van het Besluit dagloonregels werknemersverzekeringen][ref1],
      zoals dat luidde voor de in het eerste lid bedoelde intrekking is, in plaats van dat artikel, [artikel 25][ref2]
      van dit besluit van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018842#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0033471#Artikel25
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0018842
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0033471
        artikel: '25'
        hoofdstuk: '4'
  - number: '26.4'
    text: |-
      Onder uitkeringsdag in het tweede lid wordt voor de [WW][ref1] en de [Wet WIA][ref2] verstaan de dag dat recht op
      uitbetaling bestaat op grond van respectievelijk [artikel 30 van de WW][ref3] en [artikel 67 van de Wet WIA][ref4],
      voor de [ZW][ref5] de dag waarop het ziekengeld wordt uitgekeerd op grond van [artikel 29 van de ZW][ref6] en voor
      de [WAO][ref7] de dag waarop de uitkering betaalbaar wordt gesteld, op grond van [artikel 50 van de WAO][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0019057
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel30
      [ref4]: https://wetten.overheid.nl/BWBR0019057#Artikel67
      [ref5]: https://wetten.overheid.nl/BWBR0001888
      [ref6]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref7]: https://wetten.overheid.nl/BWBR0002524
      [ref8]: https://wetten.overheid.nl/BWBR0002524#Artikel50
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0019057
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '30'
      - id: ref4
        bwb_id: BWBR0019057
        artikel: '67'
      - id: ref5
        bwb_id: BWBR0001888
      - id: ref6
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref7
        bwb_id: BWBR0002524
      - id: ref8
        bwb_id: BWBR0002524
        artikel: '50'
  - number: '26.5'
    text: |-
      Het tweede lid is niet van toepassing op een dagloonherziening op grond van [artikel 40, eerste lid][ref1], of
      [48, derde lid, van de WAO][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel48
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '40'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '48'
  - number: '27'
    text: |-
      [Artikelen 3][ref1], [5][ref2] en [6][ref3] van het Dagloonbesluit werknemersverzekeringen zoals deze luidden op
      de dag voorafgaand aan de dag van de inwerkingtreding van artikel II, onderdelen A, C en D, maar met inachtneming
      van de wijzigingen in artikel II, onderdeel B, van het Besluit tot wijziging van het Besluit SUWI en enige
      andere besluiten in verband met gegevensverstrekking aan werkgevers en verzekeraars en enige andere technische
      wijzigingen, blijven van toepassing op een recht op uitkering op grond van de [Werkloosheidswet][ref4] of de
      [Ziektewet][ref5], waarvan de eerste uitkeringsdag is gelegen voor de dag van die inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0033471#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0033471#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0033471#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0004045
      [ref5]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0033471
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0033471
        artikel: '5'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0033471
        artikel: '6'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0004045
      - id: ref5
        bwb_id: BWBR0001888
  - number: 27a.1
    text: |-
      Het Dagloonbesluit werknemersverzekeringen, zoals dat luidde op 30 november 2016, blijft van toepassing op
      uitkeringen waarvan de eerste rechtdag is gelegen voor 1 december 2016.
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel27a
  - number: 27a.2
    text: |-
      Onder de eerste rechtdag, bedoeld in het eerste lid, wordt voor de [WW][ref1] de eerste dag van werkloosheid
      verstaan, voor de [Wet WIA][ref2] en [WAO][ref3] de dag dat recht op uitkering is ontstaan en voor de [ZW][ref4] de
      eerste dag waarover het ziekengeld wordt uitgekeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0019057
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0019057
      - id: ref3
        bwb_id: BWBR0002524
      - id: ref4
        bwb_id: BWBR0001888
  - number: 27a.3
    text: |-
      Het eerste lid is niet van toepassing op een dagloonherziening op grond van [artikel 40, eerste lid][ref1], of
      [48, derde lid, van de WAO][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel48
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '40'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '48'
  - number: 27a.4
    text: |-
      Het eerste lid is niet van toepassing op de werknemer, bedoeld in [artikel 22][ref1]. Op die werknemer zijn de
      [artikelen 2, achtste en negende lid][ref2], en [5, zesde lid][ref3], zoals deze luidden op of na 1 december 2016,
      niet van toepassing, voor zover het een recht op uitkering betreft dat op of na 1 juli 2015 en voor 1 december 2016
      is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0033471#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0033471#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0033471#Artikel5
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0033471
        artikel: '22'
        hoofdstuk: 3a
      - id: ref2
        bwb_id: BWBR0033471
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0033471
        artikel: '5'
        hoofdstuk: '2'
  - number: 27b
    text: |-
      [Artikel 5, eerste lid][ref1], zoals dat luidt na de dag van inwerkingtreding van artikel I, onderdeel C, onder 1,
      van het Besluit van 20 juni 2018 tot wijziging van het Dagloonbesluit werknemersverzekeringen in verband met een
      andere berekeningswijze van het WW-dagloon in het geval van een lager dagloon door ziekte in de referteperiode en
      enkele andere wijzigingen (Stb. 2018, 193) is niet van toepassing op de werknemer wiens WW-recht is ontstaan voor
      die dag van inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0033471#Artikel5
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0033471
        artikel: '5'
        hoofdstuk: '2'
  - number: 27c.1
    text: |-
      De [artikelen 3, eerste lid, onderdeel b][ref1], [5, achtste lid][ref2], en [6, eerste en tweede lid][ref3],
      zoals deze luiden na de dag van inwerkingtreding van artikel I, onderdelen B, C, onder 2, en D, van het
      Besluit van 20 juni 2018 tot wijziging van het Dagloonbesluit werknemersverzekeringen in verband met een andere
      berekeningswijze van het WW-dagloon in het geval van een lager dagloon door ziekte in de referteperiode en enkele
      andere wijzigingen (Stb. 2018, 193), zijn niet van toepassing op de werknemer:


      [ref1]: https://wetten.overheid.nl/BWBR0033471#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0033471#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0033471#Artikel6
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel27c
    references:
      - id: ref1
        bwb_id: BWBR0033471
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0033471
        artikel: '5'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0033471
        artikel: '6'
        hoofdstuk: '2'
  - number: 27c.1.a
    text: |-
      die recht heeft of heeft gehad op een reguliere WW-uitkering, dat is ontstaan op of na 1 juli 2015 en voor
      1 december 2017; en
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel27c
  - number: 27c.1.b
    text: die in de referteperiode minder loon heeft genoten in verband met ziekte in één of meer kalendermaanden.
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel27c
  - number: 27c.2
    text: |-
      In afwijking van het eerste lid zijn de [artikelen 5, achtste lid][ref1], en [6, eerste en tweede lid][ref2], wel
      van toepassing, indien de in het eerste lid bedoelde werknemer een melding of aanvraag doet om herziening van het
      dagloon. Hierbij geldt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0033471#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0033471#Artikel6
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel27c
    references:
      - id: ref1
        bwb_id: BWBR0033471
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0033471
        artikel: '6'
        hoofdstuk: '2'
  - number: 27c.2.a
    text: |-
      indien de melding of aanvraag is gedaan voor 1 juli 2018, het dagloon met inachtneming van de
      [artikelen 3, eerste lid, onderdeel b][ref1], [5, achtste lid][ref2], en [6, eerste en tweede lid][ref3], zoals
      deze luiden na inwerkingtreding van artikel I, onderdelen B, C, onder 2, en D, van het Besluit van 20 juni 2018
      tot wijziging van het Dagloonbesluit werknemersverzekeringen in verband met een andere berekeningswijze van
      het WW-dagloon in het geval van een lager dagloon door ziekte in de referteperiode en enkele andere wijzigingen
      (Stb. 2018, 193) wordt berekend of herberekend met ingang van:


      [ref1]: https://wetten.overheid.nl/BWBR0033471#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0033471#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0033471#Artikel6
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel27c
    references:
      - id: ref1
        bwb_id: BWBR0033471
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0033471
        artikel: '5'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0033471
        artikel: '6'
        hoofdstuk: '2'
  - number: 27c.2.a.1°
    text: |-
