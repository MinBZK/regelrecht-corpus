    text: |-
      1 juli 2018, indien er recht bestaat op een eenmalige tegemoetkoming op grond van
      __REF000___________________________________________________________________________________________________________
      _________; of


      [ref1]: https://wetten.overheid.nl/BWBR0038659#Artikel2
