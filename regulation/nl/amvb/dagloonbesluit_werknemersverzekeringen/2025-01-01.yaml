  - number: 12g.3
    text: |-
      In afwijking van de [artikelen 12b tot en met 12f][ref1] wordt het ZW-dagloon van de persoon die laatstelijk op
      grond van [artikel 8c van de ZW][ref2] verzekerd was, vastgesteld op het Wazo-dagloon.


