        hoofdstuk: 2a
  - number: 12e.6
    text: |-
      Indien het aantal dagloondagen op grond van het eerste, vierde of vijfde lid nul is, dan is het dagloon, in
      afwijking van het eerste lid, de uitkomst van de volgende berekening: E/F waarbij: E staat voor het overeengekomen
      loon in het aangiftetijdvak waarin de ziekte is ingetreden of waaruit het recht op uitkering op grond van
      [hoofdstuk 3, afdeling 2, paragraaf 1][ref1], [artikel 4:2b][ref2] of [artikel 6:3 van de Wazo][ref3] is
      ontstaan; en F staat voor het aantal dagloondagen in het aangiftetijdvak waarin de ziekte is ingetreden of waaruit
      het recht op uitkering op grond van [hoofdstuk 3, afdeling 2, paragraaf 1][ref4], [artikel 4:2b][ref5] of
      [artikel 6:3 van de Wazo][ref6] is ontstaan dan wel, indien het een aangiftetijdvak van een maand betreft, voor
      21,75.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel6
