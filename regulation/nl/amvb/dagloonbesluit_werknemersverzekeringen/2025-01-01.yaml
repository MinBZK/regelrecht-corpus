  - number: 12h.1
    text: |-
      In afwijking van de [artikelen 12b tot en met 12f][ref1], wordt het dagloon van de gelijkgestelde, bedoeld
      in [artikel 3:6, eerste lid, onderdeel b, onder 1°, van de Wazo][ref2], die op de dag voorafgaande aan het
      ontstaan van het recht op een uitkering op grond van de [Wazo][ref3] als werknemer wordt aangemerkt op grond van
      [artikel 7, onderdeel a, van de ZW][ref4], vastgesteld op:


      [ref1]: https://wetten.overheid.nl/BWBR0033471#Artikel12b
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel7
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel12h
    references:
