        artikel: 8c
  - number: 12g.2
    text: |-
      In afwijking van de [artikelen 12b tot en met 12f][ref1] wordt het ZW-dagloon van de persoon, wiens aanspraak
      op ziekengeld berust op [artikel 46 van de ZW][ref2], die tevens laatstelijk verzekerd was op grond van
      [artikel 8 van de ZW][ref3], vastgesteld op het voorgaande ZW-dagloon.


      [ref1]: https://wetten.overheid.nl/BWBR0033471#Artikel12b
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel8
