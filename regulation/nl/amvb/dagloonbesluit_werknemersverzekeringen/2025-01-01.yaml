      indien de aanvraag is gedaan op of na 1 juli 2018, het dagloon met inachtneming van de
      [artikelen 3, eerste lid, onderdeel b][ref1], [5, achtste lid][ref2], en [6, eerste en tweede lid][ref3], zoals
      deze luiden na inwerkingtreding van artikel I, onderdelen B, C, onder 2, en D, van het Besluit van 20 juni 2018
      tot wijziging van het Dagloonbesluit werknemersverzekeringen in verband met een andere berekeningswijze van
      het WW-dagloon in het geval van een lager dagloon door ziekte in de referteperiode en enkele andere wijzigingen
      (Stb. 2018, 193), wordt berekend met ingang van de eerste dag van de maand waarin de aanvraag is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0033471#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0033471#Artikel5
