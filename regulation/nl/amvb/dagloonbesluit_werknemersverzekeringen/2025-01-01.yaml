        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0013008
      - id: ref3
        bwb_id: BWBR0004045
        artikel: 1b
  - number: 12h.2
    text: |-
      In afwijking van de [artikelen 12b tot en met 12f][ref1], wordt het dagloon van de gelijkgestelde,
      bedoeld in [artikel 3:6, eerste lid, onderdeel b, onder 1°, van de Wazo][ref2], die op grond van
      [artikel 8, onderdeel a, van de ZW][ref3] voorafgaand aan een uitkering op grond van de Wazo ziekengeld ontving,
      vastgesteld op:


      [ref1]: https://wetten.overheid.nl/BWBR0033471#Artikel12b
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel8
    url: https://wetten.overheid.nl/BWBR0033471/2025-01-01#Artikel12h
