      [Artikelen 3][ref1], [5][ref2] en [6][ref3] van het Dagloonbesluit werknemersverzekeringen zoals deze luidden op
      de dag voorafgaand aan de dag van de inwerkingtreding van artikel II, onderdelen A, C en D, maar met inachtneming
      van de wijzigingen in artikel II, onderdeel B, van het Besluit tot wijziging van het Besluit SUWI en enige
      andere besluiten in verband met gegevensverstrekking aan werkgevers en verzekeraars en enige andere technische
      wijzigingen, blijven van toepassing op een recht op uitkering op grond van de [Werkloosheidswet][ref4] of de
      [Ziektewet][ref5], waarvan de eerste uitkeringsdag is gelegen voor de dag van die inwerkingtreding.


