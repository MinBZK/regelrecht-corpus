  - number: '8'
    text: |-
      1 Het WW-dagloon van de werknemer die op de dag voorafgaande aan de eerste werkloosheidsdag een
      arbeidsongeschiktheidsuitkering op grond van de [WAO][ref1] heeft ontvangen, is, indien die uitkering met ingang
      van de eerste werkloosheidsdag wordt ingetrokken op grond van [artikel 43, eerste lid, van de WAO][ref2], gelijk
      aan het laatstelijk geldende WAO-dagloon. Het WAO-dagloon van de werknemer die op de dag voorafgaande aan de
      eerste werkloosheidsdag een uitkering op grond van de WAO naar een arbeidsongeschiktheid van minder dan 80% heeft
      ontvangen, wordt in aanmerking genomen naar de mate waarin de uitkering, waarvoor het dagloon wordt vastgesteld, in
      de plaats is gekomen voor de uitkering op grond van de WAO.

      2 Het WW-dagloon van de werknemer die op de eerste werkloosheidsdag, of op de eerste dag van herleving van het
      recht op werkloosheidsuitkering, een uitkering op grond van de [WAO][ref3] naar een arbeidsongeschiktheid van
      minder dan 80% ontvangt, wordt vastgesteld door evenredige verlaging van het laatstelijk geldende WAO-dagloon. Dit
      WAO-dagloon wordt in aanmerking genomen naar de mate waarin de uitkering, waarvoor het dagloon wordt vastgesteld,
      in de plaats is gekomen voor de uitkering op grond van de WAO.

      3 Indien op een tijdstip na de in het tweede lid bedoelde dagloonvaststelling de werknemer wordt ingedeeld in een
      andere arbeidsongeschiktheidsklasse, wordt het WW-dagloon opnieuw vastgesteld. Het WAO-dagloon wordt in aanmerking
      genomen naar de mate waarin de uitkering, waarvoor het dagloon wordt vastgesteld, in de plaats is gekomen voor de
      uitkering op grond van de [WAO][ref4].

      4 De vaststelling, bedoeld in het tweede lid, en de hernieuwde vaststelling, bedoeld in het derde lid, geschieden
      volgens de volgende berekening:

      A x (100 – B) / 100

      waarbij:

      A staat voor het WAO-dagloon, bedoeld in het tweede lid; en

      B staat voor het midden van de arbeidsongeschiktheidsklasse die bij de vaststelling of hernieuwde vaststelling in
      acht wordt genomen.

      5 Voor de werknemer, bedoeld in het tweede lid, wiens arbeidsongeschiktheidsuitkering op een tijdstip na de in dat
      lid bedoelde dagloonberekening wordt ingetrokken op grond van [artikel 43, eerste lid, van de WAO][ref5], is het
      WW-dagloon het in de eerste zin van het in het tweede lid bedoelde WAO-dagloon respectievelijk het in het zesde lid
      bedoelde, WAO-vervolgdagloon.

      6 Indien de arbeidsongeschiktheidsuitkering laatstelijk was gebaseerd op een WAO-vervolgdagloon wordt bij de
      toepassing van het eerste, tweede, vierde en vijfde lid voor «WAO-dagloon» gelezen: WAO-vervolgdagloon.

      7 Voor de toepassing van het eerste en tweede lid wordt met het ontvangen van een uitkering op grond van de
      [WAO][ref6] gelijkgesteld: het zouden hebben ontvangen van een dergelijke uitkering indien de [artikelen 25][ref7],
      [28][ref8], [30][ref9] of [33 van de WAO][ref10] niet van toepassing zouden zijn geweest.

      8 Dit artikel is niet van toepassing zolang bij de vaststelling van de mate van arbeidsongeschiktheid of bij de
      toepassing van [artikel 44 WAO][ref11] rekening wordt gehouden met de arbeid die de werknemer na het intreden van
      zijn arbeidsongeschiktheid heeft verricht in de dienstbetrekking waaruit hij werkloos is geworden.

      9 De dagloonvaststelling op grond van het eerste lid is van overeenkomstige toepassing op de werknemer die
      voorafgaande aan de eerste werkloosheidsdag een arbeidsongeschiktheidsuitkering op grond van de [Wet WIA][ref12]
      ontvangt.


