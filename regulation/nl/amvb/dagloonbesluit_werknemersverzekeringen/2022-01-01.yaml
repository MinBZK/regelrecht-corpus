  - number: 27a
    text: |-
      1 Het Dagloonbesluit werknemersverzekeringen, zoals dat luidde op 30 november 2016, blijft van toepassing op
      uitkeringen waarvan de eerste rechtdag is gelegen voor 1 december 2016.

      2 Onder de eerste rechtdag, bedoeld in het eerste lid, wordt voor de [WW][ref1] de eerste dag van werkloosheid
      verstaan, voor de [Wet WIA][ref2] en [WAO][ref3] de dag dat recht op uitkering is ontstaan en voor de [ZW][ref4] de
      eerste dag waarover het ziekengeld wordt uitgekeerd.

      3 Het eerste lid is niet van toepassing op een dagloonherziening op grond van [artikel 40, eerste lid][ref5], of
      [48, derde lid, van de WAO][ref6].

      4 Het eerste lid is niet van toepassing op de werknemer, bedoeld in [artikel 22][ref7]. Op die werknemer zijn de
      [artikelen 2, achtste en negende lid][ref8], en [5, zesde lid][ref9], zoals deze luidden op of na 1 december 2016,
      niet van toepassing, voor zover het een recht op uitkering betreft dat op of na 1 juli 2015 en voor 1 december 2016
      is ontstaan.


