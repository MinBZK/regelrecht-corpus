    text: |-
      1 Dit hoofdstuk is van toepassing op de werknemer:

      a. die recht heeft of heeft gehad op een reguliere WW-uitkering dat is ontstaan op of na 1 juli 2015 en voor
      1 december 2016 en die in de periode van een jaar die eindigt op de laatste dag van de tweede kalendermaand
      voorafgaande aan de kalendermaand waarin de eerste dag van werkloosheid is gelegen, geen loon heeft genoten in één
      of meer kalendermaanden;

      b. die recht heeft of heeft gehad op een reguliere WW-uitkering dat is ontstaan op of na 1 juli 2015 en voor
      1 december 2016, die de wachttijd, bedoeld in [artikel 23, eerste lid, van de Wet WIA][ref1], heeft doorlopen,
      die geen recht heeft gekregen op een werkhervattingsuitkering gedeeltelijk arbeidsgeschikten, bedoeld in
      [hoofdstuk 7 van de Wet WIA][ref2], omdat hij minder dan 35% arbeidsongeschikt was en het ongemaximeerde
      dagloon op grond van dit hoofdstuk ten minste 2,5% hoger is dan het ongemaximeerde dagloon op grond van
      [hoofdstuk 2][ref3];

      c. die recht heeft of heeft gehad op een reguliere WW-uitkering:

      1°. dat is ontstaan op of na 1 juli 2015 en voor 1 december 2016;

      2°. waarbij op een dag in de kalendermaand waarin het recht op een reguliere WW-uitkering is ontstaan een eerder
      recht op een reguliere WW-uitkering bestaat; en

      3°. die in de referteperiode, bedoeld in [artikel 22b, derde lid][ref4], geen loon heeft genoten in één of meer
      kalendermaanden;

      d. die recht heeft of heeft gehad op een reguliere WW-uitkering:

      1°. dat is ontstaan op of na 1 juli 2015 en voor 1 december 2016;

      2°. die de wachttijd, bedoeld in [artikel 23, eerste lid, van de Wet WIA][ref5], heeft doorlopen, en die geen recht
      heeft gekregen op een Wet WIA-uitkering omdat hij minder dan 35% arbeidsongeschikt was;

      3°. het ongemaximeerde dagloon op grond van dit hoofdstuk ten minste 2,5% hoger is dan het ongemaximeerde dagloon
      op grond van hoofdstuk 2; en

      4°. waarbij op een dag in de kalendermaand waarin het recht op een reguliere WW-uitkering is ontstaan een eerder
      recht op een reguliere WW-uitkering bestaat.

      2 In afwijking van het eerste lid is dit hoofdstuk niet van toepassing op de werknemer:

      a. bedoeld in het eerste lid, onderdelen a en b, indien op een dag in de kalendermaand waarin het recht op een
      reguliere WW-uitkering is ontstaan een eerder recht op een reguliere WW-uitkering bestaat; of

      b. van wie de WW-uitkering blijvend geheel is geweigerd op grond van [artikel 27 van de WW][ref6].

      3 In afwijking van het eerste lid, onderdelen a en c, is dit hoofdstuk niet van toepassing op de werknemer van wie
      het ongemaximeerde dagloon op grond van dit hoofdstuk niet meer dan 7% hoger is dan het ongemaximeerde dagloon op
      grond van [hoofdstuk 2][ref7].


