  - number: 22b
    text: |-
      1 Het dagloon van de uitkering van de werknemer, bedoeld in [artikel 22, eerste lid, onderdeel a][ref1], is
      de uitkomst van de berekening, bedoeld in [artikel 5, eerste lid][ref2], vermenigvuldigd met 1,004, met dien
      verstande dat onder de referteperiode wordt verstaan de periode van een jaar die eindigt op de laatste dag van de
      tweede kalendermaand voorafgaande aan de kalendermaand waarin de eerste dag van werkloosheid is gelegen.

      2 Het dagloon van de uitkering van de werknemer, bedoeld in [artikel 22, eerste lid, onderdeel b][ref3], is
      de uitkomst van de berekening, bedoeld in [artikel 5, eerste lid][ref4], vermenigvuldigd met 1,0291, met dien
      verstande dat onder de referteperiode wordt verstaan de periode van een jaar die eindigt op de laatste dag van de
      vijfentwintigste kalendermaand voorafgaande aan de kalendermaand waarin de eerste dag van werkloosheid is gelegen.

      3 Het dagloon van de uitkering van de werknemer, bedoeld in [artikel 22, eerste lid, onderdeel c][ref5], is
      de uitkomst van de berekening, bedoeld in [artikel 5, eerste lid][ref6], vermenigvuldigd met 1,0097, met dien
      verstande dat onder de referteperiode wordt verstaan de periode, bedoeld in het eerste lid, tenzij in die
      periode een eerder recht op een reguliere WW-uitkering bestaat. De referteperiode begint dan op de eerste dag van
      werkloosheid van dat eerdere recht en eindigt op de laatste dag van de tweede kalendermaand voorafgaande aan de
      kalendermaand waarin de eerste dag van werkloosheid van het latere recht is ingetreden. Indien de eerste dag van
      werkloosheid van het eerdere recht is gelegen na de eerste dag van een kalendermaand, begint de referteperiode, in
      afwijking van de vorige volzin, op de eerste dag van de kalendermaand na de kalendermaand waarin de eerste dag van
      werkloosheid van het eerdere recht ligt.

      4 Het dagloon van de uitkering van de werknemer, bedoeld in [artikel 22, eerste lid, onderdeel d][ref7], is de
      uitkomst van de berekening, bedoeld in [artikel 5, eerste lid][ref8], vermenigvuldigd met 1,035, met dien verstande
      dat onder de referteperiode wordt verstaan de periode, bedoeld in het tweede lid, tenzij in die periode een eerder
      recht op een reguliere WW-uitkering bestaat. De referteperiode begint dan op de eerste dag van werkloosheid van
      dat eerdere recht en eindigt het op de laatste dag van de vijfentwintigste kalendermaand voorafgaande aan de
      kalendermaand waarin de eerste dag van werkloosheid is gelegen van het latere recht. Indien de eerste dag van
      werkloosheid van het eerdere recht is gelegen na de eerste dag van een kalendermaand, begint de referteperiode, in
      afwijking van de vorige volzin, op de eerste dag van de kalendermaand na de kalendermaand waarin de eerste dag van
      werkloosheid van het eerdere recht ligt.

      5 Bij de vaststelling van het dagloon op grond van dit hoofdstuk wordt [artikel 25][ref9] toegepast.

      6 In afwijking van het derde en vierde lid wordt het dagloon van de uitkering van de werknemer, bedoeld
      in[ artikel 22, eerste lid, onderdelen c en d][ref10], berekend op grond van [artikel 5, zevende lid][ref11],
      indien er geen dagloondagen op grond van het derde lid in de referteperiode van het recht liggen.


