  - number: 12g
    text: |-
      1 In afwijking van de [artikelen 12b tot en met 12f][ref1] wordt het ZW-dagloon van de persoon, wiens aanspraak op
      ziekengeld berust op [artikel 46 van de ZW][ref2], die tevens laatstelijk op grond van [artikel 8c van de ZW][ref3]
      verzekerd was, vastgesteld op het Wazo-dagloon.

      2 In afwijking van de [artikelen 12b tot en met 12f][ref4] wordt het ZW-dagloon van de persoon, wiens aanspraak
      op ziekengeld berust op [artikel 46 van de ZW][ref5], die tevens laatstelijk verzekerd was op grond van
      [artikel 8 van de ZW][ref6], vastgesteld op het voorgaande ZW-dagloon.

      3 In afwijking van de [artikelen 12b tot en met 12f][ref7] wordt het ZW-dagloon van de persoon die laatstelijk op
      grond van [artikel 8c van de ZW][ref8] verzekerd was, vastgesteld op het Wazo-dagloon.


