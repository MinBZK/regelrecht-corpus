  - number: '25'
    text: |-
      1 Vanaf het moment waarop een werknemer gelijktijdig aanspraak gaat hebben op meer dan een
      uitkering en de som van de uitkeringen per dag meer bedraagt dan 70% van het bedrag, bedoeld in
      [artikel 17, eerste lid, tweede zin, van de Wfsv][ref1], met betrekking tot een loontijdvak van een dag, worden
      de aan die uitkeringen ten grondslag liggende daglonen zodanig vastgesteld of herzien dat de som van de evenredig
      verlaagde uitkeringen per dag niet meer bedraagt dan 70% van dat bedrag.

      2 Indien van een van de uitkeringen, bedoeld in het eerste lid, het uitkeringspercentage hoger is dan 70, wordt de
      uitkomst van 70% van het bedrag bedoeld in [artikel 17, eerste lid, tweede zin, van de Wfsv][ref2], met betrekking
      tot een loontijdvak van een dag, verhoogd met de uitkomst van de volgende berekening:

      ((A – 70) / 100) x B

      waarbij:

      A staat voor het hogere uitkeringspercentage; en

      B staat voor het dagloon van de uitkering, waarvoor het uitkeringspercentage A geldt voordat dit dagloon is herzien
      op grond van het eerste lid.

      3 Indien een van de uitkeringen, bedoeld in het eerste of tweede lid, wordt beëindigd wegens het bereiken van de
      maximale uitkeringsduur, wordt het dagloon van de resterende uitkering of uitkeringen met ingang van de dag van de
      beëindiging herzien, voor zover van toepassing met inachtneming van het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel17
