  - number: '3'
    text: |-
      1 Onder loon wordt in dit hoofdstuk verstaan loon in de zin van [artikel 16 van de Wfsv][ref1], genoten in de
      referteperiode met dien verstande dat niet onder loon worden begrepen:

      a. uitkeringen op grond van de [Wet WIA][ref2], de [WAO][ref3], de [WW][ref4] en de uitkeringen die naar
      aard en strekking met deze uitkeringen overeenkomen, met uitzondering van een uitkering op grond van
      [artikel 18 van de WW][ref5];

      b. de aanvullingen en de toeslagen op grond van de [Toeslagenwet][ref6], bedoeld in
      [artikel 16, tweede lid, onderdeel a, van de Wfsv][ref7]; en

      c. een eindheffingsbestanddeel als bedoeld in
      [artikel 31, eerste lid, onderdeel a, van de Wet op de loonbelasting 1964][ref8] ten aanzien waarvan de
      werkgever met toestemming van de inspecteur van de rijksbelastingdienst geen correctiebericht als bedoeld in
      [artikel 28a van de laatstgenoemde wet][ref9] heeft ingediend.

      2 In afwijking van het eerste lid wordt, indien [artikel 18 van de WW][ref10] van toepassing is, onder loon
      verstaan het in het eerste lid bedoelde loon dat is genoten in de dienstbetrekking waaruit de werknemer werkloos
      is geworden.

      3 In dit hoofdstuk wordt, indien [artikel 18 van de WW][ref11] van toepassing is, onder loon tevens verstaan
      de som van het loon, bedoeld in het eerste en tweede lid, indien de werknemer bij één werkgever als bedoeld in
      [artikel 690 van Boek 7 van het Burgerlijk Wetboek][ref12], meer elkaar opvolgende dienstbetrekkingen als bedoeld
      in [artikel 691 van Boek 7 van het Burgerlijk Wetboek][ref13], heeft gehad en deze dienstbetrekkingen in de
      loonaangifte vanaf de aanvang van de eerste dienstbetrekking worden aangemerkt als één inkomstenverhouding.


