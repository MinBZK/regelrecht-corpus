  - number: 27b
    text: |-
      [Artikel 5, eerste lid][ref1], zoals dat luidt na de dag van inwerkingtreding van artikel I, onderdeel C, onder 1,
      van het Besluit van 20 juni 2018 tot wijziging van het Dagloonbesluit werknemersverzekeringen in verband met een
      andere berekeningswijze van het WW-dagloon in het geval van een lager dagloon door ziekte in de referteperiode en
      enkele andere wijzigingen (Stb. 2018, 193) is niet van toepassing op de werknemer wiens WW-recht is ontstaan voor
      die dag van inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0033471#Artikel5
    url: https://wetten.overheid.nl/BWBR0033471/2022-01-01#Artikel27b
