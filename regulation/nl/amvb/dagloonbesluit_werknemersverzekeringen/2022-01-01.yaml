  - number: 22a
    text: |-
      1 In dit hoofdstuk wordt, in zoverre in afwijking van de [hoofdstukken 1][ref1], [2][ref2] en [3][ref3],
      verstaan onder:

        - *loon:* hetgeen daaronder wordt verstaan in [artikel 3, eerste lid][ref4], met dien verstande dat indien in een
      aangiftetijdvak geen of minder loon is genoten vanwege verlof als loon in dat aangiftetijdvak wordt aangemerkt het
      loon dat in dezelfde dienstbetrekking is genoten in het laatste aan dat verlof voorafgaande aangiftetijdvak waarin
      geen sprake was van verlof;
        - *ongemaximeerde dagloon:* het dagloon op grond van [hoofdstuk 2][ref5] of
      dit hoofdstuk indien dat niet zou zijn gemaximeerd op het bedrag, genoemd in
      [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref6].

      2 Het in een aangiftetijdvak genoten loon wordt toegerekend aan de kalendermaand waarin de laatste dag van het
      aangiftetijdvak ligt.

      3 De [artikelen 2, tweede lid][ref7], [4, tweede lid][ref8], [5, tweede lid][ref9], en [6][ref10] zijn niet van
      toepassing op dit hoofdstuk.


