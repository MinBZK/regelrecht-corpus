  - number: 12d
    text: |-
      1 Voor de toepassing van dit hoofdstuk wordt de werknemer geacht zijn loon te hebben genoten in het aangiftetijdvak
      waarover de werkgever van dat loon opgave heeft gedaan.

      2 Onder loon als bedoeld in [artikel 12c][ref1] wordt mede begrepen loon uit de dienstbetrekking
      waaruit de werknemer ziek is geworden of waaruit het recht op uitkering op grond van
      [hoofdstuk 3, afdeling 2, paragraaf 1][ref2], of [artikel 4:2b van de Wazo][ref3] is ontstaan, en uit de
      daaraan voorafgaande dienstbetrekkingen, bedoeld in artikel 12c, tweede, derde en vierde lid, waarvan de werknemer
      aantoont dat dit in de referteperiode vorderbaar maar niet tevens inbaar is geworden. Voor de toepassing van
      dit hoofdstuk wordt de werknemer geacht dit loon te hebben genoten in het aangiftetijdvak waarin het vorderbaar
      is geworden. Indien in de referteperiode een uitkering is genoten, waarbij in het dagloon loon als bedoeld in
      de eerste zin is meegerekend, wordt, indien van dat loon in de referteperiode opgave is gedaan, dat loon bij de
      dagloonberekening buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0033471#Artikel12c
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel42b
