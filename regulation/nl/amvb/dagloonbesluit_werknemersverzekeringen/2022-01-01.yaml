  - number: 12e
    text: |-
      1 Het dagloon van uitkeringen op grond van de [ZW][ref1] en de [Wazo][ref2] is de uitkomst van de volgende
      berekening:

      (A – B + C) / D

      waarbij:

      A staat voor het loon dat de werknemer in de referteperiode heeft genoten bij een werkgever;

      B staat voor de bedragen aan vakantiebijslag die in de referteperiode als loon zijn uitbetaald ten laste
      van een opgebouwd bedrag en de bedragen die in die periode als loon zijn uitbetaald ten laste van een
      arbeidsvoorwaardenbedrag;

      C staat voor de in de referteperiode opgebouwde bedragen ten behoeve van vakantiebijslag dan wel ten behoeve van
      een arbeidsvoorwaardenbedrag; en

      D staat voor 261 dan wel, indien de dienstbetrekking waaruit de werknemer ziek is geworden of waaruit recht
      op uitkering op grond van [hoofdstuk 3, afdeling 2, paragraaf 1][ref3], of [artikel 4:2b van de Wazo][ref4]
      is ontstaan, is aangevangen na aanvang maar voor het einde van de referteperiode, voor het aantal dagloondagen
      vanaf en met inbegrip van de dag waarop de dienstbetrekking is aangevangen tot en met de laatste dag van de
      referteperiode.

      2 In een gebroken aangiftetijdvak worden de factoren A, B en C berekend door het loon, de bedragen voor opbouw of
      opname van vakantiebijslag of de bedragen voor opbouw of opname van een arbeidsvoorwaardenbedrag in dat tijdvak te
      vermenigvuldigen met de breuk Y/Z. Waarbij:

      Z staat voor het aantal dagloondagen in het gebroken aangiftetijdvak binnen de dienstbetrekking of de
      uitkeringsverhouding; en

      Y staat voor het aantal dagloondagen van Z dat binnen de referteperiode valt. Indien Z nul is, wordt de uitkomst
      van deze berekening op nihil gesteld.

      3 D staat, indien de dienstbetrekking waaruit de werknemer ziek is geworden of waaruit recht op uitkering op grond
      van [hoofdstuk 3, afdeling 2, paragraaf 1][ref5], of [artikel 4:2b van de Wazo][ref6] is ontstaan, één of meer
      aangiftetijdvakken kent waarin geen loon is genoten anders dan vanwege verlof, werkstaking, arbeidsongeschiktheid
      of ziekte, in afwijking van het eerste lid, voor het aantal dagloondagen van de aangiftetijdvakken waarin wel loon
      is genoten.

      4 D staat, indien de dienstbetrekking waaruit de werknemer ziek is geworden of waaruit recht op uitkering op
      grond van [hoofdstuk 3, afdeling 2, paragraaf 1][ref7], of [artikel 4:2b van de Wazo][ref8] is ontstaan, is
      aangevangen na afloop van de referteperiode, in afwijking van het eerste lid, voor het aantal dagloondagen vanaf
      en met inbegrip van de dag waarop de dienstbetrekking is aangevangen tot de eerste dag van de ongeschiktheid tot
      werken, bedoeld in [artikel 29, derde lid, van de ZW][ref9] of de dag waarop het recht op een uitkering op grond
      van hoofdstuk 3, afdeling 2, paragraaf 1, of artikel 4:2b van de Wazo is ontstaan en A, B en C staan in dat geval,
      in zoverre in afwijking van [artikel 12c][ref10], voor het loon respectievelijk de vakantiebijslag genoten in deze
      dienstbetrekking. Dit lid is van overeenkomstige toepassing op de situatie, bedoeld in artikel 12c, tweede, derde
      en vierde lid.

      5 Indien [artikel 12c, tweede, derde of vierde lid][ref11], van toepassing is, staat C tevens voor het ziekengeld
      uitgekeerd tussen de elkaar opvolgende dienstbetrekkingen, bedoeld in dat tweede, derde of vierde lid, en
      staat D voor het aantal dagloondagen vanaf en met inbegrip van de dag waarop de eerste van de elkaar opvolgende
      dienstbetrekkingen, bedoeld in dat tweede, derde of vierde lid, is aangevangen tot en met de laatste dag van de
      referteperiode.

      6 Indien het aantal dagloondagen op grond van het eerste, vierde of vijfde lid nul is, dan is het dagloon, in
      afwijking van het eerste lid, de uitkomst van de volgende berekening:

      E/F

      waarbij:

      E staat voor het overeengekomen loon in het aangiftetijdvak waarin de ziekte is ingetreden of waaruit recht op
      uitkering op grond van [hoofdstuk 3, afdeling 2, paragraaf 1][ref12], of [artikel 4:2b van de Wazo][ref13] is
      ontstaan; en

      F staat voor het aantal dagloondagen in het aangiftetijdvak waarin de ziekte is ingetreden of waaruit recht op
      uitkering op grond van [hoofdstuk 3, afdeling 2, paragraaf 1][ref14], of [artikel 4:2b van de Wazo][ref15] is
      ontstaan dan wel, indien het een aangiftetijdvak van een maand betreft, voor 21,75.


