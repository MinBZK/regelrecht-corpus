      Voor de toepassing van dit hoofdstuk wordt verstaan onder werknemer:

      a. de werknemer, bedoeld in de [eerste afdeling, paragraaf 2, van de ZW][ref1];

      b. de werknemer en de gelijkgestelde, bedoeld in
      [artikel 3:6, eerste lid, onderdeel a en b, en tweede lid, van de Wazo][ref2]; en

      c. de werknemer, bedoeld in [artikel 4:2b, eerste lid, van de Wazo][ref3].


