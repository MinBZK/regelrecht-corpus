preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 26 februari 2013, nr. IVV/2013/10006,

    Gelet op de artikelen 15, tweede lid, van de Ziektewet, 17a, derde lid, en 45, tweede lid, van de Werkloosheidswet,
    13, derde lid, en 58, derde lid, van de Wet werk en inkomen naar arbeidsvermogen en 14, tweede lid, van de Wet op
    de arbeidsongeschiktheidsverzekering;

    De Afdeling advisering van de Raad van State gehoord (advies van 19 april 2013, nr W12.12.0048/III);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid van 16 mei 2013, nr. 2013-
    000055455;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0033471/2022-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. *aangiftetijdvak:* het tijdvak van vier weken dan wel één maand waarop de aangifte waarop de ingehouden
      loonbelasting wordt afgedragen, betrekking heeft danwel, indien de werkgever over een afwijkend tijdvak aangifte
      doet, het tijdvak waarover loon is betaald van één maand of vier weken of herleid tot één maand of vier weken;

      b. *arbeidsongeschikt(heid):* arbeidsongeschikt(heid) als bedoeld in [artikel 18, eerste lid, van de WAO][ref1]
      of volledige en duurzame arbeidsongeschiktheid en gedeeltelijke arbeidsgeschiktheid als bedoeld in de
      [artikelen 4][ref2] en [5 van de Wet WIA][ref3];

      c. *arbeidsurenverlies:* het arbeidsurenverlies, bedoeld in [artikel 16, eerste lid, van de WW][ref4];

      d. *arbeidsvoorwaardenbedrag:* het aan de werknemer toegekende en in geld uitgedrukte toekomstige loonbestanddeel,
      niet zijnde een afzonderlijke opbouw van vakantiebijslag, dat is opgebouwd ingevolge afspraken in de individuele
      of collectieve arbeidsovereenkomst, voor zover dit toekomstige loonbestanddeel kan leiden tot loon als bedoeld in
      [artikel 16 van de Wfsv][ref5];

      e. *bedrag dat als loon is uitbetaald ten laste van een arbeidsvoorwaardenbedrag:* het door de werkgever als loon
      in de zin van [artikel 16 van de Wfsv][ref6] uitbetaalde bedrag ten laste van een arbeidsvoorwaardenbedrag voor
      zover dit loon belastbaar is op grond van de [Wet op de loonbelasting 1964][ref7];

      f. *gebroken aangiftetijdvak:* een aangiftetijdvak dat deels binnen en deels buiten de referteperiode, bedoeld in
      de [artikelen 2][ref8], [12b][ref9] en [13][ref10], valt;

      g. *het UWV:* het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref11];

      h. *minimumjeugdloonpercentage:* een percentage als bedoeld in [artikel 8, derde lid, van de WML][ref12];

      i. *minimumloon:* het minimumloon per maand, bedoeld in [artikel 8, eerste lid, onderdeel a, van de WML][ref13],
      gedeeld door 21,75;

      j. *uitkering:* een uitkering op grond van de [ZW][ref14], de [WW][ref15], de [Wet WIA][ref16], de [WAO][ref17] of
      de [Wazo][ref18], met uitzondering van een uitkering op grond van [artikel 4:2b van de Wazo][ref19];

      k. *reguliere WW-uitkering:* een uitkering op grond van de [WW][ref20], niet zijnde een uitkering op grond van
      [artikel 18][ref21] of op grond van[ hoofdstuk IV van die wet][ref22];

      l. *verlof:* een tussen de werkgever en werknemer voor een gedeelte of het geheel van de arbeidstijd overeengekomen
      tijdvak, waarin de werknemer geen arbeid jegens de werkgever verricht, met uitzondering van verlof als bedoeld in
      de [artikelen 3:1][ref23] en [3:2 van de Wazo][ref24];

      m. *WAO:* [Wet op de arbeidsongeschiktheidsverzekering][ref25];

      n. *WAO-dagloon:* het dagloon, bedoeld in [artikel 14, eerste lid, van de WAO][ref26];

      o. *WAO-vervolgdagloon:* het vervolgdagloon, bedoeld in [artikel 21b van de WAO][ref27];

      p. *Wazo:* [Wet arbeid en zorg][ref28];

      q. *Wazo-dagloon:* het dagloon, bedoeld in [3:13, tweede lid][ref29], en [4:2b, vierde lid, van de Wazo][ref30];

      r. *Wet WIA:* [Wet werk en inkomen naar arbeidsvermogen][ref31];

      s. *WIA-dagloon:* het dagloon, bedoeld in [artikel 13, eerste lid, van de Wet WIA][ref32];

      t. *Wfsv:* [Wet financiering sociale verzekeringen][ref33];

      u. *WML:* [Wet minimumloon en minimumvakantiebijslag][ref34];

      v. *WW:* [Werkloosheidswet][ref35];

      w. *WW-dagloon:* het dagloon, bedoeld in [artikel 1b, eerste lid, van de WW][ref36];

      x. *ziek/ziekte:* ongeschikt(heid) tot het verrichten van zijn of haar arbeid als bedoeld in
      [artikel 19, eerste of tweede lid, van de ZW][ref37];

      y. *ZW:* [Ziektewet][ref38];

      z. *ZW-dagloon:* het dagloon, bedoeld in [artikel 15, eerste lid, van de ZW][ref39].

      2 Voor de toepassing van dit besluit is maandag de eerste dag van de kalenderweek en zijn de eerste vijf dagen van
      de kalenderweek dagloondagen.


