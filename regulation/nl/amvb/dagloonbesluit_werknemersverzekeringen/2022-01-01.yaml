  - number: '16'
    text: |-
      1 Het dagloon van uitkeringen op grond van de [Wet WIA][ref1] en de [WAO][ref2] is de uitkomst van de volgende
      berekening:

      (A – B + C) / D

      waarbij:

      A staat voor het loon dat de werknemer in de referteperiode heeft genoten bij alle werkgevers;

      B staat voor de bedragen aan vakantiebijslag die in de referteperiode als loon zijn uitbetaald ten laste
      van een opgebouwd bedrag en de bedragen die in die periode als loon zijn uitbetaald ten laste van een
      arbeidsvoorwaardenbedrag;

      C staat voor de in de referteperiode opgebouwde bedragen ten behoeve van vakantiebijslag dan wel ten behoeve van
      een arbeidsvoorwaardenbedrag; en

      D staat voor 261.

      2 In een gebroken aangiftetijdvak worden de factoren A, B en C berekend door het loon, de vakantiebijslag of de
      bedragen voor opbouw of opname van een arbeidsvoorwaardenbedrag in dat tijdvak te vermenigvuldigen met de breuk Y/
      Z waarbij:

      Z staat voor het aantal dagloondagen in het gebroken aangiftetijdvak binnen de dienstbetrekking of de
      uitkeringsverhouding; en

      Y staat voor het aantal dagloondagen van Z dat binnen de referteperiode valt. Indien Z nul is, wordt de uitkomst
      van deze berekening op nihil gesteld.

      3 Indien het loon in de referteperiode geheel of gedeeltelijk heeft bestaan uit een uitkering wordt voor de
      toepassing van het eerste lid het bedrag van de uitkering gesteld op de uitkomst van de volgende berekening:

      ((100 x E) / F)

      waarbij:

      E staat voor de uitkering; en

      F staat voor:

      a. 70, dan wel

      b. indien het uitkeringspercentage op grond van de [ZW][ref3], de [WAO][ref4], [hoofdstuk 6 van de Wet WIA][ref5]
      of van [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wazo][ref6] hoger is dan 70, het uitkeringspercentage waarnaar
      de uitkering is berekend; of

      c. 100, indien [artikel 53][ref7] of [63 van de Wet WIA][ref8] van toepassing is, dan wel

      d. indien de teller van de factor, bedoeld in [artikel 53][ref9] of [63 van de Wet WIA][ref10] lager is, de waarde
      van die teller.

      4 Voor zover het derde lid van toepassing is, wordt voor de toepassing van het eerste lid, het bedrag van de
      vakantiebijslag behorende bij de uitkeringen bedoeld in het derde lid, gesteld op de uitkomst van de volgende
      berekening:

      (100 x G) / H

      waarbij:

      G staat voor de vakantiebijslag die in het in aanmerking te nemen tijdvak is genoten; en

      H gelijk is aan de factor F, bedoeld in het derde lid.

      5 Indien een dienstbetrekking is geëindigd door wederzijds goedvinden van partijen, of opzegging, zonder
      inachtneming van de geldende opzegtermijn, wordt voor de toepassing van het eerste lid factor D verminderd met
      het aantal dagloondagen gedurende de periode tussen de laatste dag van die dienstbetrekking en de dag waarop de
      rechtens geldende opzegtermijn eindigt, voor zover die periode in de referteperiode ligt en worden de factoren A, B
      en C verminderd met al het loon genoten in de aangiftetijdvakken die volledig liggen binnen die periode.


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0002524
