  - number: '24'
    text: |-
      1 Indien de werknemer:

      a. bij aanvang van de referteperiode, bedoeld in [artikel 2][ref1], [artikel 12b][ref2] of [artikel 13][ref3],
      jonger is dan 21 jaar en het op grond van dit besluit berekende dagloon minder bedraagt dan het minimumloon
      vermeerderd met de vakantiebijslag, bedoeld in [artikel 15 van de WML][ref4], dat behoort bij de leeftijd van de
      werknemer op de eerste dag waarop recht bestaat op uitkering; of

      b. op de eerste dag waarop recht bestaat op uitkering jonger is dan 21 jaar en het op grond van de overige
      artikelen van dit besluit berekende dagloon minder bedraagt dan het minimumloon vermeerderd met de vakantiebijslag,
      bedoeld in [artikel 15 van de WML][ref5], dat behoort bij de leeftijd van de werknemer bij zijn verjaring,

      wordt zijn dagloon op de eerste dag waarop recht bestaat op uitkering respectievelijk telkens bij zijn verjaring
      verhoogd door het dagloon te vermenigvuldigen met:

      A /B

      waarbij:

      A staat voor het minimumjeugdloonpercentage dat verbonden is aan de leeftijd van de werknemer op de eerste dag
      waarop recht bestaat op uitkering dan wel voor het minimumjeugdloonpercentage dat geldt bij zijn verjaring of
      indien de werknemer de leeftijd van 21 jaar heeft bereikt, voor 100; en

      B staat voor het minimumjeugdloonpercentage dat verbonden is aan de leeftijd van de werknemer bij aanvang van de
      referteperiode dan wel voor het minimumjeugdloonpercentage dat geldt op de laatste dag voor zijn verjaring.

      2 Het op grond van dit artikel verhoogde dagloon bedraagt niet meer dan het minimumloon vermeerderd met de
      vakantiebijslag, bedoeld in [artikel 15 van de WML][ref6] dat behoort bij de leeftijd van de werknemer op de eerste
      dag waarop recht bestaat op uitkering, dan wel bij de leeftijd van de werknemer bij zijn verjaring.

      3 Indien bij het vaststellen van het dagloon [artikel 18][ref7] van toepassing is of indien de dienstbetrekking
      is aangevangen na aanvang van de referteperiode, wordt bij toepassing van het eerste lid voor «bij aanvang van de
      referteperiode» gelezen: bij aanvang van de dienstbetrekking.

      4 Indien de referteperiode, bedoeld in het eerste lid, is aangevangen voor 1 juli 2019, wordt bij toepassing van
      het eerste lid voor «21 jaar» gelezen: 22 jaar.


