  - number: 12b
    text: |-
      1 Onder referteperiode wordt in dit hoofdstuk verstaan de periode van een jaar die eindigt op de laatste
      dag van het tweede aangiftetijdvak voorafgaande aan het aangiftetijdvak waarin de ongeschiktheid tot
      werken, bedoeld in [artikel 29, derde lid, van de ZW][ref1], is ingetreden of waarin het recht op grond van
      [hoofdstuk 3, afdeling 2, paragraaf 1][ref2], of [artikel 4:2b van de Wazo][ref3] is ontstaan.

      2 In afwijking van het eerste lid eindigt de referteperiode op de laatste dag van het tweede aangiftetijdvak
      voorafgaande aan het aangiftetijdvak waarin de dienstbetrekking is geëindigd, indien de datum van eindiging van die
      dienstbetrekking is gelegen voor het einde van de referteperiode, bedoeld in het eerste lid.

      3 Bij het vaststellen van het ZW-dagloon van de persoon, wiens aanspraak op ziekengeld berust op
      [artikel 46 van de ZW][ref4] eindigt de referteperiode, in afwijking van het eerste lid, op de laatste dag van het
      tweede aangiftetijdvak voorafgaand aan het aangiftetijdvak waarin de verzekering is geëindigd.

      4 Bij het vaststellen van het Wazo-dagloon van de persoon, wiens aanspraak op uitkering berust op
      [artikel 3:10 van de Wazo][ref5] eindigt de referteperiode, in afwijking van het eerste lid, op de laatste dag van
      het tweede aangiftetijdvak voorafgaand aan het aangiftetijdvak waarin de verzekering is geëindigd.


