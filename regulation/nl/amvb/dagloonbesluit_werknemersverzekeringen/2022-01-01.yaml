  - number: '6'
    text: |-
      1 Indien de werknemer in een aangiftetijdvak geen loon of minder loon heeft genoten in verband met verlof,
      ziekte of werkstaking tijdens de dienstbetrekking, wordt bij de berekening van het dagloon, bedoeld in
      [artikel 5, eerste lid][ref1], als loon in dat aangiftetijdvak in aanmerking genomen het loon, genoten in
      dezelfde dienstbetrekking in het laatste aan dat verlof, die werkstaking of die ziekte voorafgaande en volledig
      in de referteperiode gelegen aangiftetijdvak, waarin die omstandigheden zich niet hebben voorgedaan en waarin de
      werknemer het volledige aangiftetijdvak in dienstbetrekking tot de desbetreffende werkgever stond.

      2 Indien er geen voorafgaand aangiftetijdvak als bedoeld in het eerste lid is, wordt bij de berekening van het
      dagloon, bedoeld in [artikel 5, eerste lid][ref2], het loon in aanmerking genomen uit dezelfde dienstbetrekking of
      uit de opvolgende dienstbetrekkingen als bedoeld in [artikel 3, derde lid][ref3], over het aangiftetijdvak direct
      na afloop van dat verlof, die werkstaking of die ziekte, indien:

      a. dat aangiftetijdvak geheel is gelegen in de referteperiode, en

      b. de werknemer gedurende het volledige aangiftetijdvak in dienstbetrekking tot de desbetreffende werkgever stond.

      3 Indien er geen aangiftetijdvak is als bedoeld in het eerste of tweede lid, wordt voor ieder in de referteperiode
      gelegen aangiftetijdvak waarin door de werknemer geen of minder loon is genoten in verband met de in het eerste lid
      genoemde omstandigheden, bij de berekening van het dagloon het per aangiftetijdvak geldende overeengekomen loon in
      aanmerking genomen.

      4 Dit artikel blijft buiten toepassing indien:

      a. de toepassing van dit artikel leidt tot een lager dagloon; of

      b. gedurende het aangiftetijdvak, bedoeld in het eerste lid, het te vervangen loon mede bestaat uit een uitkering
      op grond van de ZW, vanwege de omstandigheden, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0033471#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0033471#Artikel5
