  - number: '26'
    text: |-
      1 Het [Besluit dagloonregels werknemersverzekeringen][ref1] wordt ingetrokken.

      2 Het [Besluit dagloonregels werknemersverzekeringen][ref2], zoals dat luidde voor de in het eerste lid bedoelde
      intrekking blijft van toepassing op uitkeringen als bedoeld in dat besluit waarvan de eerste uitkeringsdag is
      gelegen voor de datum van intrekking.

      3 Indien zich ten aanzien van de uitkeringen, bedoeld in het tweede lid, op of
      na de inwerkingtreding van dit besluit, een situatie voordoet als bedoeld in
      [artikel 22 van het Besluit dagloonregels werknemersverzekeringen][ref3], zoals dat luidde voor de in het eerste
      lid bedoelde intrekking is, in plaats van dat artikel, [artikel 25][ref4] van dit besluit van toepassing.

      4 Onder uitkeringsdag in het tweede lid wordt voor de [WW][ref5] en de [Wet WIA][ref6] verstaan de dag dat recht op
      uitbetaling bestaat op grond van respectievelijk [artikel 30 van de WW][ref7] en [artikel 67 van de Wet WIA][ref8],
      voor de [ZW][ref9] de dag waarop het ziekengeld wordt uitgekeerd op grond van [artikel 29 van de ZW][ref10] en voor
      de [WAO][ref11] de dag waarop de uitkering betaalbaar wordt gesteld, op grond van [artikel 50 van de WAO][ref12].

      5 Het tweede lid is niet van toepassing op een dagloonherziening op grond van [artikel 40, eerste lid][ref13], of
      [48, derde lid, van de WAO][ref14].


