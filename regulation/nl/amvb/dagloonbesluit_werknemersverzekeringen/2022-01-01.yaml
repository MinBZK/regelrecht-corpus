  - number: '5'
    text: |-
      1 Het dagloon van een uitkering op grond van de [WW][ref1] is de uitkomst van de volgende berekening:

      (A – B + C) / D

      waarbij:

      A staat voor het loon dat de werknemer in de referteperiode heeft genoten bij alle werkgevers;

      B staat voor de bedragen aan vakantiebijslag die in de referteperiode als loon zijn uitbetaald ten laste
      van een opgebouwd bedrag en de bedragen die in die periode als loon zijn uitbetaald ten laste van een
      arbeidsvoorwaardenbedrag;

      C staat voor de in de referteperiode opgebouwde bedragen ten behoeve van vakantiebijslag dan wel ten behoeve van
      een arbeidsvoorwaardenbedrag; en

      D staat voor 261 indien de referteperiode een duur van één jaar heeft. Indien er sprake is van een afwijkende
      referteperiode staat D voor het aantal dagloondagen in de referteperiode.

      2 In een gebroken aangiftetijdvak worden de factoren A, B, en C berekend door het loon, de bedragen voor opbouw of
      opname van vakantiebijslag of de bedragen voor opbouw of opname van een arbeidsvoorwaardenbedrag in dat tijdvak te
      vermenigvuldigen met de breuk Y/Z. Waarbij:

      Z staat voor het aantal dagloondagen in het gebroken aangiftetijdvak binnen de dienstbetrekking of de
      uitkeringsverhouding; en

      Y staat voor het aantal dagloondagen van Z dat binnen de referteperiode valt. Indien Z nul is, wordt de uitkomst
      van deze berekening op nihil gesteld.

      3 Indien [artikel 3, derde lid][ref2], van toepassing is, staat C tevens voor het ziekengeld uitgekeerd tussen de
      elkaar opvolgende dienstbetrekkingen bedoeld in dat derde lid.

      4 Indien [artikel 18 van de WW][ref3] van toepassing is en de dienstbetrekking of de inkomensverhouding met de
      elkaar opvolgende dienstbetrekkingen waaruit de werknemer werkloos is geworden, een of meer aangiftetijdvakken
      kent waarin geen loon is genoten anders dan vanwege verlof of werkstaking, staat D, in afwijking van het eerste
      lid, voor het aantal dagloondagen van de aangiftetijdvakken waarin loon is genoten of waarin geen loon is genoten
      vanwege verlof of werkstaking.

      5 Indien de referteperiode voor de dagloonvaststelling van een reguliere WW-uitkering een of meer kalendermaanden
      kent waarin geen loon is genoten anders dan vanwege verlof of werkstaking, dan staat D, in afwijking van het
      eerste lid, voor het aantal dagloondagen van de kalendermaanden waarin loon is genoten of waarin geen loon is
      genoten vanwege verlof of werkstaking. Het in een aangiftetijdvak genoten loon wordt, voor zover het binnen de
      referteperiode is genoten, toegerekend aan de kalendermaand waarin de laatste dag van het aangiftetijdvak ligt.
      Een kalendermaand ligt binnen de referteperiode, indien één of meer dagloondagen van de kalendermaand binnen de
      referteperiode vallen.

      6 Indien het aantal dagloondagen op grond van het eerste lid nul is, dan is het dagloon, in afwijking van het
      eerste lid, de uitkomst van de volgende berekening:

      E/F

      waarbij:

      E staat voor het overeengekomen loon in het aangiftetijdvak waarin het arbeidsurenverlies is ingetreden; en

      F staat voor het aantal dagloondagen in het aangiftetijdvak waarin het arbeidsurenverlies is ingetreden dan wel,
      indien het een aangiftetijdvak van een maand betreft, voor 21,75.

      7 Indien het loon in de referteperiode geheel of gedeeltelijk heeft bestaan uit ziekengeld, is voor de toepassing
      van het eerste lid het ziekengeld de som van de uitkomst van de volgende berekening per aangiftetijdvak:

      (100 x G) / H

      waarbij:

      G staat voor het ziekengeld; en

      H staat voor:

      a. 70; of

      b. indien het uitkeringspercentage hoger is dan 70%, het uitkeringspercentage waarnaar het ziekengeld is berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0033471#Artikel3
