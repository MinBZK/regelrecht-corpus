  - number: 27c
    text: |-
      1 De [artikelen 3, eerste lid, onderdeel b][ref1], [5, achtste lid][ref2], en [6, eerste en tweede lid][ref3],
      zoals deze luiden na de dag van inwerkingtreding van artikel I, onderdelen B, C, onder 2, en D, van het
      Besluit van 20 juni 2018 tot wijziging van het Dagloonbesluit werknemersverzekeringen in verband met een andere
      berekeningswijze van het WW-dagloon in het geval van een lager dagloon door ziekte in de referteperiode en enkele
      andere wijzigingen (Stb. 2018, 193), zijn niet van toepassing op de werknemer:

      a. die recht heeft of heeft gehad op een reguliere WW-uitkering, dat is ontstaan op of na 1 juli 2015 en voor
      1 december 2017; en

      b. die in de referteperiode minder loon heeft genoten in verband met ziekte in één of meer kalendermaanden.

      2 In afwijking van het eerste lid zijn de [artikelen 5, achtste lid][ref4], en [6, eerste en tweede lid][ref5], wel
      van toepassing, indien de in het eerste lid bedoelde werknemer een melding of aanvraag doet om herziening van het
      dagloon. Hierbij geldt dat:

      a. indien de melding of aanvraag is gedaan voor 1 juli 2018, het dagloon met inachtneming van de
      [artikelen 3, eerste lid, onderdeel b][ref6], [5, achtste lid][ref7], en [6, eerste en tweede lid][ref8], zoals
      deze luiden na inwerkingtreding van artikel I, onderdelen B, C, onder 2, en D, van het Besluit van 20 juni 2018
      tot wijziging van het Dagloonbesluit werknemersverzekeringen in verband met een andere berekeningswijze van
      het WW-dagloon in het geval van een lager dagloon door ziekte in de referteperiode en enkele andere wijzigingen
      (Stb. 2018, 193) wordt berekend of herberekend met ingang van:

      1°. 1 januari 2018, indien er geen recht bestaat op een eenmalige tegemoetkoming op grond van
      __REF000___________________________________________________________________________________________________________
      _________; of

      2°. 1 juli 2018, indien er recht bestaat op een eenmalige tegemoetkoming op grond van
      __REF000___________________________________________________________________________________________________________
      __________; of

      b. indien de aanvraag is gedaan op of na 1 juli 2018, het dagloon met inachtneming van de
      [artikelen 3, eerste lid, onderdeel b][ref11], [5, achtste lid][ref12], en [6, eerste en tweede lid][ref13],
      zoals deze luiden na inwerkingtreding van artikel I, onderdelen B, C, onder 2, en D, van het Besluit van 20 juni
      2018 tot wijziging van het Dagloonbesluit werknemersverzekeringen in verband met een andere berekeningswijze van
      het WW-dagloon in het geval van een lager dagloon door ziekte in de referteperiode en enkele andere wijzigingen
      (Stb. 2018, 193), wordt berekend met ingang van de eerste dag van de maand waarin de aanvraag is ingediend.

      3 Met een melding of aanvraag als bedoeld in het tweede lid wordt gelijkgesteld
      een melding of aanvraag om een eenmalige tegemoetkoming op grond van
      __REF000___________________________________________________________________________________________________________
      __________, indien er na 1 januari 2018 nog recht is op de betreffende WW-uitkering.

      4 Het eerste lid is niet van toepassing op de werknemer wiens recht op een WW-uitkering is ontstaan voor
      15 november 2017, maar waarvan de datum van de beschikking omtrent het ontstaan van dat recht op of na 15 november
      2017 ligt.


