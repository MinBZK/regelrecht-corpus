    text: |-
      Onder loon wordt in dit hoofdstuk verstaan loon in de zin van [artikel 16 van de Wfsv][ref1] met dien verstande dat
      niet onder loon wordt begrepen:

      a. de toeslagen en aanvullingen, bedoeld in [artikel 16, tweede lid, onderdeel a, van die wet][ref2];

      b. een eindheffingsbestanddeel als bedoeld in
      [artikel 31, eerste lid, onderdeel a, van de Wet op de loonbelasting 1964][ref3] ten aanzien waarvan de
      werkgever met toestemming van de inspecteur van de rijksbelastingdienst geen correctiebericht als bedoeld in
      [artikel 28a van de laatstgenoemde wet][ref4] heeft ingediend; en

      c. een uitkering op grond van [hoofdstuk IV van de WW][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel16
