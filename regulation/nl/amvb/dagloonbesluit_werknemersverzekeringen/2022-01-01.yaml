  - number: '18'
    text: |-
      1 Het dagloon van de werknemer die vanaf de aanvang van de referteperiode tot en met de laatste dag van het eerste
      volledige aangiftetijdvak van dat jaar geen loon als bedoeld in [artikel 14][ref1] of [15][ref2] heeft genoten,
      wordt vastgesteld door bij de toepassing van [artikel 16, eerste lid][ref3], «261» te vervangen door: het aantal
      dagloondagen vanaf en met inbegrip van de dag waarop de dienstbetrekking is aangevangen tot en met de laatste dag
      van de referteperiode.

      2 Het dagloon van de werknemer die in de referteperiode geen loon als bedoeld in [artikel 14][ref4] of [15][ref5]
      heeft genoten is de uitkomst van de volgende berekening:

      (A – B + C) / D

      waarbij:

      A staat voor het loon dat de werknemer voor het intreden van de arbeidsongeschiktheid heeft genoten in het
      aangiftetijdvak waarin de arbeidsongeschiktheid is ingetreden, bij alle werkgevers;

      B staat voor de bedragen aan vakantiebijslag die voor het intreden van de arbeidsongeschiktheid als loon zijn
      uitbetaald ten laste van een opgebouwd bedrag en de bedragen die voor het intreden van de arbeidsongeschiktheid
      als loon zijn uitbetaald ten laste van een arbeidsvoorwaardenbedrag in het aangiftetijdvak waarin de
      arbeidsongeschiktheid is ingetreden;

      C staat voor de in de referteperiode opgebouwde bedragen ten behoeve van vakantiebijslag dan wel ten behoeve van
      een arbeidsvoorwaardenbedrag in het aangiftetijdvak waarin de arbeidsongeschiktheid is ingetreden; en

      D staat voor het in dat aangiftetijdvak gelegen aantal dagloondagen vanaf en met inbegrip van de dag waarop de
      dienstbetrekking is aangevangen tot de dag van intreden van de arbeidsongeschiktheid.

      3 Indien D nul is, is het dagloon, in afwijking van het tweede lid, de uitkomst van de volgende berekening:

      E/F

      waarbij:

      E staat voor het overeengekomen loon in het aangiftetijdvak waarin de arbeidsongeschiktheid is ingetreden; en

      F staat voor het aantal dagloondagen in het aangiftetijdvak waarin de arbeidsongeschiktheid is ingetreden dan wel,
      indien het een aangiftetijdvak van een maand betreft, 21,75.

      4 Dit artikel is niet van toepassing indien de werknemer in verband met verlof geen loon heeft ontvangen.


