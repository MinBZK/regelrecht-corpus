  - number: '13'
    text: |-
      1 Onder referteperiode wordt in dit hoofdstuk de periode verstaan van één jaar die eindigt op de laatste dag van
      het aangiftetijdvak voorafgaande aan het aangiftetijdvak waarin de arbeidsongeschiktheid is ingetreden, of die
      eindigt, in geval de arbeidsongeschiktheid is ingetreden in gelijktijdige dienstbetrekkingen, op de laatste dag van
      het aangiftetijdvak dat het eerst voor het intreden van de arbeidsongeschiktheid is geëindigd.

      2 Indien [artikel 40, eerste lid, van de WAO][ref1] van toepassing is, is artikel 40, tweede lid, van de WAO van
      overeenkomstige toepassing.

      3 De referteperiode eindigt, indien de aanspraak op uitkering berust op [artikel 10 van de Wet WIA][ref2] of
      op [artikel 17 van de WAO][ref3], in afwijking van het eerste lid, op de laatste dag van het aangiftetijdvak
      voorafgaand aan het aangiftetijdvak waarin de verzekering is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel17
