  - number: 12c
    text: |-
      1 Onder loon wordt in dit hoofdstuk verstaan loon in de zin van [artikel 16 van de Wfsv][ref1], genoten in de
      referteperiode uit de dienstbetrekking waaruit de werknemer ziek is geworden of waaruit het recht op uitkering op
      grond van [hoofdstuk 3, afdeling 2, paragraaf 1][ref2], of [artikel 4:2b van de Wazo][ref3] is ontstaan, met
      dien verstande dat niet onder loon worden begrepen:

      a. uitkeringen op grond van de [Wet WIA][ref4], de [WAO][ref5], de [WW][ref6] en de uitkeringen die naar
      aard en strekking met deze uitkeringen overeenkomen, met uitzondering van een uitkering op grond van
      [artikel 18 van de WW][ref7];

      b. de aanvullingen en de toeslagen op grond van de [Toeslagenwet][ref8], bedoeld in
      [artikel 16, tweede lid, onderdeel a, van de Wfsv][ref9]; en

      c. een eindheffingsbestanddeel als bedoeld in
      [artikel 31, eerste lid, onderdeel a, van de Wet op de loonbelasting 1964][ref10] ten aanzien waarvan de
      werkgever met toestemming van de inspecteur van de rijksbelastingdienst geen correctiebericht als bedoeld in
      [artikel 28a van de laatstgenoemde wet][ref11] heeft ingediend.

      2 In dit hoofdstuk wordt onder loon tevens verstaan de som van het loon, bedoeld in het eerste lid, genoten in de
      referteperiode uit elkaar opvolgende dienstbetrekkingen bij dezelfde werkgever indien:

      a. ten aanzien van al deze dienstbetrekkingen een schriftelijk beding als bedoeld in
      [artikel 691, tweede lid, van Boek 7 van het Burgerlijk Wetboek][ref12] was opgenomen;

      b. al deze dienstbetrekkingen van rechtswege zijn geëindigd door inroeping van dat beding; en

      c. de werknemer gedurende de tussen de elkaar opvolgende dienstbetrekkingen liggende dagen recht op ziekengeld had.

      3 Indien het tweede lid van toepassing is, geldt tevens als loon het ziekengeld dat is uitgekeerd gedurende de
      tussen de elkaar opvolgende dienstbetrekkingen liggende dagen. Het ziekengeld wordt gesteld op de uitkomst van de
      berekening, bedoeld in [artikel 5, achtste lid][ref13].

      4 In dit hoofdstuk wordt onder loon tevens verstaan de som van het loon, bedoeld in
      het eerste, tweede en derde lid, indien de werknemer bij één werkgever als bedoeld in
      [artikel 690 van Boek 7 van het Burgerlijk Wetboek][ref14], meer elkaar opvolgende dienstbetrekkingen als bedoeld
      in [artikel 691 van Boek 7 van het Burgerlijk Wetboek][ref15], heeft gehad en deze dienstbetrekkingen in de
      loonaangifte vanaf de aanvang van de eerste dienstbetrekking worden aangemerkt als één inkomstenverhouding.


