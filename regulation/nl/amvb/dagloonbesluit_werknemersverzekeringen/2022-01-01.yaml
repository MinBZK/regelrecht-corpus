  - number: '2'
    text: |-
      1 Onder referteperiode wordt in dit hoofdstuk de periode verstaan van één jaar die eindigt op de laatste dag van
      het tweede aangiftetijdvak voorafgaande aan het aangiftetijdvak waarin het arbeidsurenverlies is ingetreden.

      2 In afwijking van het eerste lid, is de referteperiode voor een reguliere WW-uitkering korter dan een jaar, indien
      er in de referteperiode, bedoeld in het eerste lid, een eerder recht op een reguliere WW-uitkering is ontstaan. De
      referteperiode begint dan op de eerste werkloosheidsdag van dat eerdere recht en eindigt op de laatste dag van het
      tweede aangiftetijdvak voorafgaande aan het aangiftetijdvak waarin het arbeidsurenverlies is ingetreden als bedoeld
      in het eerste lid.

      3 In afwijking van het tweede lid, eindigt de referteperiode op de dag voorafgaand aan het arbeidsurenverlies,
      indien de eerste werkloosheidsdag van het eerdere recht is gelegen na afloop van de referteperiode als bedoeld in
      het tweede lid.

      4 In afwijking van het eerste lid is de referteperiode voor een reguliere WW-uitkering korter dan een jaar, indien
      er in de referteperiode, bedoeld in het eerste lid, geen recht op loon bestond of geen loon is genoten. In dat
      geval is de referteperiode de periode vanaf en met inbegrip van de dag waarop de dienstbetrekking is aangevangen
      tot de dag waarop het arbeidsurenverlies is ingetreden.

      5 In afwijking van het eerste lid begint de referteperiode voor het dagloon van een uitkering op grond van
      [artikel 18 van de WW][ref1] op de dag waarop de dienstbetrekking is aangevangen, indien de dienstbetrekking
      waaruit de werknemer werkloos is geworden, is aangevangen na het begin van de referteperiode als bedoeld in
      het eerste lid. De referteperiode eindigt op de laatste dag van het tweede aangiftetijdvak voorafgaande aan het
      aangiftetijdvak waarin het arbeidsurenverlies is ingetreden.

      6 In afwijking van het vijfde lid, eindigt de referteperiode op de dag voorafgaand aan het arbeidsurenverlies,
      indien de desbetreffende dienstbetrekking is aangevangen na afloop van de referteperiode, bedoeld in het vijfde
      lid.

      7 Bij het vaststellen van het WW-dagloon van de werknemer, op wie in verband met opeenvolgende verliezen van
      arbeidsuren [artikel 2 van het Besluit nadere regeling verlies van arbeidsuren][ref2] van toepassing is, eindigt
      de referteperiode, in afwijking van het eerste en tweede lid, op de laatste dag van het tweede aangiftetijdvak
      voorafgaand aan het aangiftetijdvak waarin het eerste verlies van arbeidsuren is ingetreden.

      8 In afwijking van het eerste tot en met derde lid wordt onder referteperiode verstaan de periode van één
      jaar die eindigt op de laatste dag van het aangiftetijdvak voorafgaande aan het aangiftetijdvak waarin de
      arbeidsongeschiktheid is ingetreden, indien:

      a. na afloop van de wachttijd, bedoeld in [artikel 23, eerste lid, van de Wet WIA][ref3] geen recht op een
      uitkering op grond van de [Wet WIA][ref4] ontstond, omdat de verzekerde minder dan 35% arbeidsongeschikt was; of

      b. op of na de dag waarop het tijdvak van 52 weken, bedoeld in [artikel 19aa, eerste lid, van de ZW][ref5],
      maar voordat het tijdvak van 104 weken, bedoeld in [artikel 29, vijfde lid, van die wet][ref6], is verstreken,
      niet langer recht op een uitkering op grond van de [ZW][ref7] bestond, omdat de verzekerde minder dan 35%
      arbeidsongeschikt was.

      9 In afwijking van het achtste lid eindigt de referteperiode, indien de aanspraak op uitkering berust op
      [artikel 46 van de ZW][ref8], op de laatste dag van het aangiftetijdvak voorafgaand aan het aangiftetijdvak waarin
      de verzekering is geëindigd.


