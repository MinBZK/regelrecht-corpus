  - number: '9'
    text: |-
      1 In afwijking van [artikel 8, tweede tot en met vierde lid][ref1], vindt de evenredige verlaging bij vaststelling
      respectievelijk hernieuwde vaststelling plaats overeenkomstig het tweede lid indien:

      a. de werknemer zijn recht op uitkering op grond van de [WW][ref2] ontleent aan artikel 65, eerste lid of vijfde
      lid, onderdeel a, van [Verordening (EG) nr. 883/2004](32004R0883) van het Europees Parlement en de Raad van
      29 april 2004 betreffende de coördinatie van de socialezekerheidsstelsels (PbEU L 166);

      b. aan de werknemer op grond van die verordening overeenkomstig de bepalingen van de [WAO][ref3] een
      arbeidsongeschiktheidsuitkering is toegekend, waarvan het bedrag is bepaald naar de verhouding tussen enerzijds de
      duur van de Nederlandse verzekering en anderzijds de totale duur van:

      1°. de tijdvakken van Nederlandse verzekering; en

      2°. de tijdvakken van verzekering of arbeid, vervuld op grond van de sociale wetgeving van een andere lidstaat of
      van andere lidstaten; en

      c. de werknemer geen recht heeft op toekenning van een invaliditeitsuitkering van een of meer lidstaten, dan
      wel dergelijke invaliditeitsuitkeringen alle zijn ingetrokken, omdat niet of niet meer wordt voldaan aan de
      openingsvoorwaarden voor het recht op invaliditeitsuitkering.

      2 De evenredige verlaging bij vaststelling of hernieuwde vaststelling als bedoeld in het eerste lid, vindt plaats
      door het WAO-dagloon of WAO-vervolgdagloon te vermenigvuldigen met de breuk

      (100 – (A x B)) / 100

      waarbij:

      A staat voor het midden van de arbeidsongeschiktheidsklasse die bij de vaststelling of hernieuwde vaststelling in
      acht wordt genomen; en

      B staat voor de breuk die de verhouding weergeeft, bedoeld in het eerste lid, onderdeel b.


