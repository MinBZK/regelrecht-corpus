  - number: 12h
    text: |-
      1 In afwijking van de [artikelen 12b tot en met 12f][ref1], wordt het dagloon van de gelijkgestelde, bedoeld
      in [artikel 3:6, eerste lid, onderdeel b, onder 1°, van de Wazo][ref2], die op de dag voorafgaande aan het
      ontstaan van het recht op een uitkering op grond van de [Wazo][ref3] als werknemer wordt aangemerkt op grond van
      [artikel 7, onderdeel a, van de ZW][ref4], vastgesteld op:

      a. het vastgestelde en herziene WW-dagloon, indien met de uitkering op grond van die wet in de kalendermaand
      voorafgaande aan de kalendermaand waarin het recht op uitkering op grond van de [Wazo][ref5] is ontstaan, geen
      inkomen als bedoeld in [artikel 1b van de WW][ref6] is verrekend; of

      b. 100/70 keer de gemiddelde uitkering op grond van de [WW][ref7] per werkdag, waarop recht bestond, in de
      laatste kalendermaand voorafgaande aan de kalendermaand waarin het recht op uitkering op grond van de [Wazo][ref8]
      is ontstaan, indien met de uitkering op grond van de WW in die laatste kalendermaand inkomen als bedoeld in
      [artikel 1b van die wet][ref9] is verrekend.

      2 In afwijking van de [artikelen 12b tot en met 12f][ref10], wordt het dagloon van de gelijkgestelde,
      bedoeld in [artikel 3:6, eerste lid, onderdeel b, onder 1°, van de Wazo][ref11], die op grond van
      [artikel 8, onderdeel a, van de ZW][ref12] voorafgaand aan een uitkering op grond van de Wazo ziekengeld ontving,
      vastgesteld op:

      a. het vastgestelde en herziene ZW-dagloon, tenzij er met de uitkering op grond van die wet in de vier
      kalenderweken voorafgaand aan de Wazo-uitkering ander inkomen dan uit de dienstbetrekking, op grond waarvan het
      recht op ziekengeld is ontstaan is verrekend op grond van [artikel 31 van de ZW][ref13]; of

      b. 100/A van het ziekengeld per dag over de vier kalenderweken voorafgaande aan de Wazo-uitkering, indien er
      met de uitkering op grond van die wet in de vier kalenderweken voorafgaand aan de Wazo-uitkering ander inkomen
      dan uit de dienstbetrekking, op grond waarvan het recht op ziekengeld is ontstaan is verrekend op grond van
      [artikel 31 van de ZW][ref14]. Daarbij staat A voor het uitkeringpercentage van de uitkering op grond van de
      [ZW][ref15].

      3 Indien de gelijkgestelde, bedoeld in het tweede lid, recht had op ziekengeld, omdat hij op de eerste dag dat
      hij zijn arbeid niet kon verrichten vanwege ziekte op grond van [artikel 7, onderdeel a, van de ZW][ref16] als
      werknemer werd aangemerkt, wordt, in afwijking van het tweede lid, het dagloon vastgesteld op:

      a. het vastgestelde en herziene WW-dagloon, indien met de uitkering op grond van de [ZW][ref17] in de kalendermaand
      voorafgaande aan de kalendermaand waarin het recht op uitkering op grond van de [Wazo][ref18] is ontstaan, geen
      inkomen als bedoeld in [artikel 1b van de WW][ref19] is verrekend; of

      b. 100/A keer de gemiddelde uitkering op grond van de [ZW][ref20] per dag, waarop recht bestond, in de laatste
      kalendermaand voorafgaande aan de kalendermaand waarin het recht op uitkering op grond van de [Wazo][ref21] is
      ontstaan, indien met de uitkering op grond van de [ZW][ref22] in die laatste kalendermaand inkomen als bedoeld in
      [artikel 1b van de WW][ref23] is verrekend. A staat daarbij voor het uitkeringspercentage van de uitkering op grond
      van de [ZW][ref24].

      4 Voor de gelijkgestelde, bedoeld in [artikel 3:6, eerste lid, onderdeel b, onder 2°, van de Wazo][ref25], is
      het dagloon, in afwijking van de [artikelen 12b tot en met 12f][ref26], gelijk aan het reeds vastgestelde en
      herziene WIA-dagloon. Indien voor de gelijkgestelde, bedoeld in de eerste zin, bij het vaststellen van de hoogte
      van de loongerelateerde uitkering van de werkhervattingsuitkering gedeeltelijk arbeidsgeschikten op grond van
      [artikel 61 van de Wet WIA][ref27] rekening werd gehouden met inkomen, wordt het Wazo-dagloon, vastgesteld op
      100/70 keer de gemiddelde uitkering per dag in de laatste kalendermaand voorafgaande aan de kalendermaand waarin
      het recht op uitkering op grond van de [Wazo][ref28] is ontstaan.

      5 In afwijking van de [artikelen 12b tot en met 12f][ref29], wordt het dagloon voor de werknemer en
      de gelijkgestelde, bedoeld in [artikel 3:6, tweede lid, van de Wazo][ref30] vastgesteld overeenkomstig
      [artikel 68 van de ZW][ref31] en de regels op grond van [artikel 71, onderdeel c, van die wet][ref32].

      6 Dit artikel is van overeenkomstige toepassing voor de persoon die recht heeft op een Wazo-uitkering op grond van
      [artikel 3:10 van de Wazo][ref33].


