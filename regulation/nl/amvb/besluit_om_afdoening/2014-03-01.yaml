  - number: '3.2'
    text: |-
      1 Voor de in [artikel 3.3, onderdeel a][ref1], aangewezen zaken wordt de strafbeschikkingsbevoegdheid toegekend
      aan de hulpofficieren van justitie, bedoeld in [artikel 154, onderdelen a en b, van de wet][ref2], alsmede aan
      de hulpofficieren van justitie, bedoeld in [artikel 154, onderdeel c, van de wet][ref3], voor zover het betreft
      de brigadecommandanten en de afdelingscommandanten en de adjudant-onderofficier en de opperwachtmeesters die
      als hun vervanger zijn aangewezen, voor zolang zij als zodanig optreden, alsmede de adjudant-onderofficier en de
      opperwachtmeesters, ingedeeld bij de centrale recherche Koninklijke marechaussee en de recherchegroepen.

      2 Voor de in [artikel 3.3, onderdeel b][ref4], aangewezen zaken wordt de strafbeschikkingsbevoegdheid toegekend aan
      de ambtenaren van politie, bedoeld in [artikel 141, aanhef en onder b, van de wet][ref5], alsmede aan de ambtenaren
      die een basisopleiding volgen aan de Politieacademie, uitsluitend gedurende hun praktijkstage bij de politie.

      3 Voor de in [artikel 3.3, onderdelen b en c][ref6], aangewezen zaken wordt strafbeschikkingsbevoegdheid toegekend
      aan de militairen van de Koninklijke marechaussee, bedoeld in [artikel 141, aanhef en onder c, van de wet][ref7].

      4 Voor de in [artikel 3.3, onderdeel b][ref8], aangewezen zaken wordt strafbeschikkingsbevoegdheid toegekend aan
      buitengewoon opsporingsambtenaren, voor zover deze ambtenaren bevoegd zijn tot de opsporing van die zaken.

      5 In afwijking van het vierde lid, wordt voor de in [artikel 3.3, onderdeel b][ref9], aangewezen zaken
      geen strafbeschikkingsbevoegdheid toegekend aan buitengewoon opsporingsambtenaren in dienst van de
      gemeente, voor zover voor die zaken in de desbetreffende gemeente krachtens een verordening als bedoeld in
      [artikel 154b, eerste lid, van de Gemeentewet][ref10] een bestuurlijke boete kan worden opgelegd.


