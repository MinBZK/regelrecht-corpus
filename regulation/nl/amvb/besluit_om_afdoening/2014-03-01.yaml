  - number: '3.4'
    text: |-
      1 De hoofdofficier van justitie kan de strafbeschikkingsbevoegdheid van een bevoegde ambtenaar tot nader bericht
      intrekken indien de taakvervulling van deze ambtenaar zulks naar zijn oordeel vordert. Alvorens een beschikking als
      bedoeld in de eerste zin te geven, hoort de hoofdofficier van justitie de betrokken korpschef.

      2 De korpschef draagt zorg voor de uitvoering van de beschikking.

      3 De hoofdofficier van justitie geeft zijn nader bericht slechts na hernieuwd overleg.

      4 Van de beschikking, bedoeld in het eerste lid, die betrekking heeft op een buitengewoon opsporingsambtenaar,
      wordt een afschrift gezonden aan de direct toezichthouder van de ambtenaar. Indien de hoofdofficier van justitie
      niet de toezichthouder van de ambtenaar is, wordt tevens een afschrift gezonden aan de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0022233/2014-03-01#Artikel3.4
  - number: '3.5'
    text: |-
      1 De hoofdofficier van justitie kan bepalen dat naar zijn oordeel het belang van een goede rechtsbedeling vordert
      dat in bepaalde gebieden of op bepaalde openbare wegen binnen het arrondissement of in bepaalde zaken door de
      bevoegde ambtenaren geen gebruik wordt gemaakt van de strafbeschikkingsbevoegdheid.

      2 Alvorens een besluit als in het eerste lid bedoeld te nemen, hoort de hoofdofficier van justitie de betrokken
      korpschef. Dit horen kan achterwege blijven, indien de hoofdofficier van justitie het nodig oordeelt dat in
      het gehele arrondissement in bepaalde zaken door de bevoegde ambtenaren geen gebruik wordt gemaakt van de
      strafbeschikkingsbevoegdheid.

      3 De betrokken korpschef draagt zorg voor de uitvoering van het besluit, bedoeld in het eerste lid.

      4 Indien het besluit, bedoeld in het eerste lid, betrekking heeft op buitengewoon opsporingsambtenaren wordt
      een afschrift gezonden aan de betrokken direct toezichthouder. Indien de hoofdofficier van justitie niet de
      toezichthouder van de ambtenaren is, wordt tevens een afschrift gezonden aan de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0022233/2014-03-01#Artikel3.5
  - number: '3.6'
    text: |-
      1 Het College van procureurs-generaal vaardigt richtlijnen uit waarin ten aanzien van elk feit waarvoor de bevoegde
      ambtenaar een strafbeschikking kan uitvaardigen de hoogte van de daarin op te leggen geldboete wordt bepaald. Deze
      richtlijnen worden in de Staatscourant bekend gemaakt.

      2 De bevoegde ambtenaar wordt in het bezit gesteld van een lijst met de feiten waarvoor de strafbeschikking kan
      worden uitgevaardigd en met de bedragen van de geldboeten die daarin kunnen worden opgelegd. Desgevraagd verleent
      hij aan de betrokken persoon inzage in deze lijst.
    url: https://wetten.overheid.nl/BWBR0022233/2014-03-01#Artikel3.6
  - number: '3.7'
    text: |-
      De bevoegde ambtenaar houdt aantekening van elke zaak waarin hij van zijn strafbeschikkingsbevoegdheid gebruik
      maakt.
    url: https://wetten.overheid.nl/BWBR0022233/2014-03-01#Artikel3.7
  - number: '4.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *strafbeschikkingsbevoegdheid:* de bevoegdheid een strafbeschikking bedoeld in [artikel 257ba van de wet][ref1],
      inhoudende een geldboete, uit te vaardigen;
        - *lichaam of persoon:* het lichaam of de persoon met een publieke taak belast, bedoeld in [artikel 4.2][ref2];
        - *Regionale Uitvoeringsdienst:* een openbaar lichaam in de zin van
      [artikel 8 van de Wet gemeenschappelijke regelingen][ref3] belast met de uitvoering van het toezicht op en de
      handhaving van milieuregelgeving;
        - *algemeen opsporingsambtenaar:* de ambtenaar, bedoeld in [artikel 141, aanhef en onder b en d, van de wet][ref4];
        - *bevoegde ambtenaar:* de buitengewoon opsporingsambtenaar in dienst van of werkzaam voor een lichaam of een
      persoon, voor zover hij bevoegd is tot opsporing van de zaken bedoeld in [artikel 4.3][ref5] en de algemeen
      opsporingsambtenaar werkzaam voor een lichaam of een persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel257ba
