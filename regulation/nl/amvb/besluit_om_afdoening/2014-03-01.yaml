  - number: '4.2'
    text: |-
      Voor zaken betreffende de in [artikel 4.3][ref1] aangewezen strafbare feiten wordt de strafbeschikkingsbevoegdheid
      toegekend aan de volgende lichamen of personen:

      a. de directeuren van de Regionale Uitvoeringsdiensten, voor de feiten vermeld in hoofdstuk 1 van
      [bijlage II][ref2] van dit besluit;

      b. de dagelijkse besturen van de waterschappen voor feiten vermeld in [bijlage II][ref3] van dit besluit;

      c. de hoofdingenieurs-directeur van de regionale en landelijke diensten van Rijkswaterstaat van het Ministerie van
      Infrastructuur en Milieu voor feiten vermeld in [bijlage II][ref4] van dit besluit;

      d. de inspecteur-generaal van de Inspectie voor Leefomgeving en Transport van het Ministerie van Infrastructuur en
      Milieu, voor de feiten vermeld in hoofdstuk 1 van [bijlage II][ref5] van dit besluit;

      e. de inspecteur-generaal van de Nederlandse Voedsel- en Warenautoriteit van het Ministerie van Economische Zaken,
      Landbouw en Innovatie, voor de feiten vermeld in hoofdstuk 1 van [bijlage II][ref6] van dit besluit;

      f. het college van gedeputeerde staten van de provincies, voor zover in de provincie of delen daarvan nog geen
      Regionale Uitvoeringsdienst is ingesteld, voor de feiten vermeld in hoofdstuk 1 van [bijlage II][ref7] van dit
      besluit;

      g. de algemeen directeur van de Belastingdienst/Douane voor de feiten vermeld in hoofdstuk 1 van [bijlage II][ref8]
      van dit Besluit.


