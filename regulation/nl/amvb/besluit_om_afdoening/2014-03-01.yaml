  - number: '2.2'
    text: |-
      1 Van elke uitreiking in persoon of toezending van het afschrift van de strafbeschikking wordt overeenkomstig
      dit artikel in daarvoor bestemde landelijke geautomatiseerde registers aantekening gehouden door degene die de
      strafbeschikking heeft uitgevaardigd.

      2 In geval van uitreiking in persoon aan de verdachte, wordt aantekening gehouden van in ieder geval de volgende
      gegevens:

      a. de datum van uitreiking;

      b. de plaats en het adres van uitreiking;

      c. de naam van de verdachte aan wie wordt uitgereikt;

      d. indien de verdachte een rechtspersoon, een maatschap, een vennootschap zonder rechtspersoonlijkheid, een
      doelvermogen, of een rederij is, en het afschrift van de strafbeschikking wordt uitgereikt aan de bestuurder
      van de rechtspersoon, de aansprakelijke vennoot, de bestuurder van een doelvermogen, de boekhouder of het lid
      van een rederij, dan wel aan de persoon die gemachtigd is het afschrift in ontvangst te nemen: de naam van de
      desbetreffende persoon.

      3 In geval van toezending wordt aantekening gehouden van in ieder geval de volgende gegevens:

      a. de datum van toezending;

      b. de naam van de verdachte aan wie het afschrift wordt toegezonden, de naam van de benadeelde partij aan wie het
      afschrift wordt toegezonden en de naam van de bij de officier van justitie bekende rechtstreeks belanghebbende aan
      wie het afschrift wordt toegezonden;

      c. het adres of de adressen waarnaar het afschrift wordt toegezonden;

      d. of de toezending per gewone dan wel per aangetekende brief geschiedt;

      e. de datum van ontvangst van het afschrift.
    url: https://wetten.overheid.nl/BWBR0022233/2014-03-01#Artikel2.2
  - number: '3.1'
    text: |-
      1 In dit hoofdstuk wordt verstaan onder:

      a. strafbeschikkingsbevoegdheid: de bevoegdheid een strafbeschikking uit te vaardigen, bedoeld in
      [artikel 257b van de wet][ref1];

      b. bevoegde ambtenaar: de opsporingsambtenaar, bedoeld in [artikel 3.2][ref2].

      2 Als korpschef in de zin van dit hoofdstuk wordt aangemerkt met betrekking tot

      a. de ambtenaren, bedoeld in [artikel 3.2, eerste en tweede lid][ref3]: de korpschef, bedoeld in
      [artikel 27 van de Politiewet 2012][ref4];

      b. de ambtenaren werkzaam bij de Koninklijke marechaussee, bedoeld in [artikel 3.2, eerste en derde lid][ref5]:

      1. voor de toepassing van [artikel 3.4][ref6]: de betrokken districtscommandant;

      2. voor de toepassing van de overige artikelen van dit hoofdstuk: de commandant van de Koninklijke marechaussee;

      c. de ambtenaren, bedoeld in [artikel 3.2, vierde lid][ref7]: het hoofd van de organisatie waarbij zij werkzaam
      zijn.


