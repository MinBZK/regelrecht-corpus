  - number: '3.3'
    text: |-
      Als zaken waarin de strafbeschikkingsbevoegdheid kan worden uitgeoefend worden aangewezen:

      a. de zaken, aangeduid in [bijlage I][ref1] van dit besluit en zoals nader omschreven in de richtlijnen, gesteld
      door het openbaar ministerie, die de ontdekking betreffen van een misdrijf, omschreven in [artikel 310][ref2] of
      [321 van het Wetboek van Strafrecht][ref3], voor zover het feit de toe-eigening betreft van goederen met een waarde
      van ten hoogste € 120 uit een winkel, voor zover de verdachte de leeftijd van achttien jaren heeft bereikt;

      b. de zaken welke betreffen de op heterdaad of met een technisch hulpmiddel door de bevoegde ambtenaar ontdekte
      overtredingen, aangeduid in [bijlage I][ref4] van dit besluit, voor zover de verdachte hetzij behoort tot een
      categorie die met betrekking tot die feiten in [bijlage I][ref5] van dit besluit is vermeld, hetzij, in het
      geval bedoeld in [artikel 181, eerste lid, van de Wegenverkeerswet 1994][ref6], de eigenaar of houder is van het
      motorrijtuig waarmee het feit is begaan;

      c. de op heterdaad of met een technisch hulpmiddel ontdekte verkeersovertredingen, aangeduid in [bijlage I][ref7]
      van dit besluit en strafbaar gesteld bij [artikel 169 van het Wetboek van Militair Strafrecht][ref8] juncto
      de Verkeersregeling defensie voor zover de verdachte militair is en hetzij behoort tot een categorie die met
      betrekking tot die feiten in [bijlage I][ref9] van dit besluit is vermeld, hetzij, in het geval bedoeld in
      [artikel 181, eerste lid, van de Wegenverkeerswet 1994][ref10], de eigenaar of houder is van het motorrijtuig
      waarmee het feit is begaan en de overtreding is begaan op een militair terrein met een voertuig dat niet bij de
      krijgsmacht in gebruik is.


