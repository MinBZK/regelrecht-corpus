  - number: '4.3'
    text: |-
      Zaken waarin de strafbeschikkingsbevoegdheid kan worden uitgeoefend, betreffen de door de bevoegde ambtenaar
      geconstateerde strafbare feiten, aangeduid in [bijlage II][ref1] van dit besluit, voor zover die strafbare
      feiten van geringe ernst of eenvoudige aard zijn zoals nader omschreven in de richtlijnen, bedoeld in
      [artikel 4.6, eerste lid][ref2] en voor zover de verdachte behoort tot een categorie die met betrekking tot die
      feiten in bijlage II van dit besluit is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0022233
      [ref2]: https://wetten.overheid.nl/BWBR0022233#Artikel4.6
    url: https://wetten.overheid.nl/BWBR0022233/2014-03-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0022233
      - id: ref2
        bwb_id: BWBR0022233
        artikel: '4.6'
        hoofdstuk: IV
  - number: '4.4'
    text: |-
      Een lichaam of een persoon maakt geen gebruik van zijn strafbeschikkingsbevoegdheid indien:

      a. het een strafbaar feit betreft dat is begaan door een persoon die jonger is dan achttien jaar;

      b. het een strafbaar feit betreft dat is begaan door een openbaar lichaam als bedoeld in
      [artikel 134 van de Grondwet][ref1];

      c. degene onder wie één of meer voorwerpen in beslag zijn genomen, weigert afstand te doen;

      d. voor opsporing van het strafbare feit internationale rechtshulp nodig is;

      e. het strafbare feit wordt geconstateerd met één of meer strafbare feiten waarvoor de strafbeschikkingsbevoegdheid
      is verleend, indien het gezamenlijke boetebedrag voor deze economische milieufeiten hoger is dan € 2.000 voor een
      natuurlijk persoon of € 10.000 voor een rechtspersoon;

      f. het strafbare feit wordt geconstateerd met één of meer strafbare feiten waarvoor de strafbeschikkingsbevoegdheid
      is verleend, indien het gezamenlijke boetebedrag voor niet-economische milieufeiten hoger is dan € 2.000 voor een
      natuurlijk persoon of een rechtspersoon;

      g. sprake is van aanwijzingen voor een wederrechtelijk verkregen voordeel van meer dan € 5.000;

      h. het strafbare feit een wederrechtelijke gedraging betreft waardoor de dood van of ernstig letsel aan personen
      danwel aanzienlijke schade aan dieren of planten wordt veroorzaakt, dan wel dreigt te worden veroorzaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel134
    url: https://wetten.overheid.nl/BWBR0022233/2014-03-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '134'
  - number: '4.5'
    text: |-
      1 De betrokken hoofdofficier van justitie kan de strafbeschikkingsbevoegdheid tot nader bericht intrekken indien
      de taakvervulling van een persoon of de wijze waarop een lichaam gebruik maakt van de bevoegdheid, zulks naar zijn
      oordeel vordert.

      2 Alvorens een beschikking, bedoeld in het eerste lid, te geven, hoort de hoofdofficier van justitie het betrokken
      lichaam of de betrokken persoon.

      3 De hoofdofficier van justitie geeft zijn nader bericht slechts na hernieuwd overleg.
    url: https://wetten.overheid.nl/BWBR0022233/2014-03-01#Artikel4.5
  - number: '4.6'
    text: |-
      1 Het College van procureurs-generaal vaardigt richtlijnen uit waarin ten aanzien van elk feit waarvoor een lichaam
      of een persoon een strafbeschikking kan uitvaardigen de hoogte van de daarin op te leggen geldboete wordt bepaald.
      Deze richtlijnen worden in de Staatscourant bekend gemaakt.

      2 De bevoegde ambtenaar wordt door het lichaam of de persoon in het bezit gesteld van een lijst met de feiten
      waarvoor de strafbeschikking kan worden uitgevaardigd. Desgevraagd verleent hij aan de verdachte inzage in deze
      lijst.
    url: https://wetten.overheid.nl/BWBR0022233/2014-03-01#Artikel4.6
  - number: '4.7'
    text: |-
      Een lichaam of een persoon houdt aantekening van elke zaak waarin hij van zijn strafbeschikkingsbevoegdheid gebruik
      maakt.
    url: https://wetten.overheid.nl/BWBR0022233/2014-03-01#Artikel4.7
  - number: '5.2'
    text: |-
      1 In strafzaken waarin voor het in werking treden van [artikel II, onderdelen O tot en met R][ref1],
      [artikel III][ref2], [artikel IV][ref3] en [artikel VI van de Wet OM-afdoening][ref4]
      voorwaarden ter voorkoming van strafvervolging zijn gesteld overeenkomstig de
      [artikelen 74][ref5] en [74c van het Wetboek van Strafrecht][ref6], de [artikelen 36][ref7] en
      [37 van de Wet op de economische delicten][ref8], [artikel 76 van de Algemene wet inzake rijksbelastingen][ref9],
      dan wel [artikel 85 van de Waterschapswet][ref10], blijven de artikelen die door dit besluit gewijzigd worden of
      vervallen, van toepassing zoals zij luidden voor het in werking treden van dit besluit.

      2 In strafzaken waarin voorwaarden ter voorkoming van strafvervolging zijn gesteld overeenkomstig
      [artikel 59 van het Wetboek van Militair Strafrecht][ref11], blijven de artikelen die door dit besluit gewijzigd
      worden of vervallen van toepassing zoals zij luidden voor het in werking treden van dit besluit.


