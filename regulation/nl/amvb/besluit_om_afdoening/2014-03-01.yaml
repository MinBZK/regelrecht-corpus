preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Justitie van 3 april 2007, directie Wetgeving, nr. 5476193/07/6,

    Gelet op de artikelen 257b, 257d, vierde lid, en 572, tweede lid, van het Wetboek van Strafvordering, en de
    artikelen 22e, 22k, 74, vijfde lid, en 77ff, vierde lid, van het Wetboek van Strafrecht;

    Voorts gelet op de artikelen 1, onderdeel a, 2, tweede lid, 4, derde lid, 9, eerste lid, en 13, eerste lid, van de
    Wet justitiële en strafvorderlijke gegevens, artikel 126 van de Wet op de rechterlijke organisatie en de artikelen
    37, 39 en 41 van de Wet op de rechtsbijstand;

    De Raad van State gehoord (advies van 23 mei 2007, nr.W03.07.0090/II);

    Gezien het nader rapport van Onze Minister van Justitie van 29 juni 2007, directie Wetgeving, nr. 5491696/07/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0022233/2014-03-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. de wet: het [Wetboek van Strafvordering][ref1];

      b. Onze Minister: Onze Minister van Veiligheid en Justitie;

      c. Centraal Justitieel Incassobureau: het Centraal Justitieel Incassobureau, bedoeld in
      [artikel 1 van het Besluit Instelling Centraal Justitieel Incassobureau][ref2];

      d. *hoofdofficier van justitie:* de officier van justitie in de rang van hoofdofficier van justitie die aan het
      hoofd staat van het arrondissementsparket, het landelijk parket of het functioneel parket;

      e. *buitengewoon opsporingsambtenaar:* de ambtenaar, bedoeld in [artikel 142, eerste lid, van de wet][ref3];

      f. *toezichthouder:* toezichthouder, bedoeld in
      [artikel 1, vierde lid, onderdeel a, van het Besluit buitengewoon opsporingsambtenaar][ref4];

      g. *direct toezichthouder:* direct toezichthouder, bedoeld in
      [artikel 1, vierde lid, onderdeel b, van het Besluit buitengewoon opsporingsambtenaar][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0001903
