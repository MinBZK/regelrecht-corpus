articles:
  - number: '1'
    text: |-
      In aanvulling op [artikel 29, tweede lid, van de Elektriciteitswet 1998][ref1], kan het tarief waarvoor transport
      van elektriciteit zal worden uitgevoerd, voor de ontvangst en voor het invoeden van elektriciteit verschillen voor
      verschillende afnemers afhankelijk van:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel29
    url: https://wetten.overheid.nl/BWBR0030517/2011-11-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '29'
  - number: 1.a
    text: het transportvermogen waarover een afnemer maximaal kan beschikken;
    url: https://wetten.overheid.nl/BWBR0030517/2011-11-01#Artikel1
  - number: 1.b
    text: het tijdsdeel dat een afnemer beschikt over zijn maximale transportvermogen;
    url: https://wetten.overheid.nl/BWBR0030517/2011-11-01#Artikel1
  - number: 1.c
    text: |-
      de fysieke wijze van aansluiten op een net met een spanningsniveau van ten hoogste 50 kV of de situering van een
      aansluiting in een net met een spanningsniveau van ten hoogste 50 kV ten opzichte van de transformator die dat net
      verbindt met een net van hoger spanningsniveau;
    url: https://wetten.overheid.nl/BWBR0030517/2011-11-01#Artikel1
  - number: 1.d
    text: het verzorgen van de aan- en uitschakeling van een aansluiting door een netbeheerder.
    url: https://wetten.overheid.nl/BWBR0030517/2011-11-01#Artikel1
  - number: '2'
    text: Dit besluit treedt in werking met ingang van 1 november 2011.
    url: https://wetten.overheid.nl/BWBR0030517/2011-11-01#Artikel2
  - number: '3'
    text: 'Dit besluit wordt aangehaald als: Besluit differentiatie tarieven transport elektriciteit.'
    url: https://wetten.overheid.nl/BWBR0030517/2011-11-01#Artikel3
