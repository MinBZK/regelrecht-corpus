  - number: '53'
    text: |-
      Een beheerder, beleggingsmaatschappij of bewaarder verstrekt geen kredieten voor rekening van derden, stelt zich
      niet garant en gaat geen borgtochtverplichtingen aan.
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel53
  - number: '54'
    text: |-
      Een beheerder, beleggingsmaatschappij of bewaarder verkoopt geen financiële instrumenten als bedoeld in
      [artikel 1, onderdeel c, 1° tot en met 4°][ref1], die de beleggingsinstelling niet in eigendom heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0018622#Artikel1
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0018622
        artikel: '1'
        paragraaf: I
  - number: '55'
    text: |-
      1 Een beheerder, beleggingsmaatschappij of bewaarder gaat niet als debiteur geldleningen aan.

      2 Het eerste lid is niet van toepassing op het aangaan van:

      a. kortlopende leningen die gezamenlijk niet meer bedragen dan tien procent van de activa van de
      beleggingsinstelling;

      b. leningen voor het verwerven van onroerende zaken die rechtstreeks noodzakelijk zijn voor de uitoefening van de
      werkzaamheden van de beleggingsmaatschappij en die gezamenlijk niet meer bedragen dan tien procent van haar activa,
      voor zover de omvang van deze geldleningen tezamen met de omvang van de in onderdeel a genoemde leningen niet meer
      bedraagt dan vijftien procent van haar activa;

      c. leningen met als doel de verwerving van vreemde valuta waardoor de netto schuld van de beleggingsinstelling niet
      verandert of zal veranderen.
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel55
  - number: '56'
    text: |-
      Een beheerder die ook diensten van individueel vermogensbeheer verricht als bedoeld in
      [artikel 6, vierde lid, van de wet][ref1], belegt de gelden van een belegger niet geheel of gedeeltelijk in door
      hem beheerde beleggingsinstellingen zonder de voorafgaande schriftelijke toestemming van de belegger.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '6'
  - number: '57'
    text: |-
      Het beheerde vermogen van een beleggingsinstelling wordt uitsluitend belegd in:

      a. financiële instrumenten als bedoeld in [artikel 1, onderdeel c, onder 1° tot en met 4°][ref1], die zijn
      toegelaten tot of worden verhandeld op een gereglementeerde markt of op een andere geregelde, regelmatig
      functionerende, erkende open markt in een lidstaat;

      b. financiële instrumenten als bedoeld in [artikel 1, onderdeel c, onder 1° tot en met 4°][ref2], die zijn
      toegelaten tot de notering op een effectenbeurs dan wel worden verhandeld op een andere geregelde, regelmatig
      functionerende, erkende open markt in een staat die geen lidstaat is, voorzover de statuten of het fondsreglement
      van de beleggingsinstelling voorzien in belegging in deze financiële instrumenten;

      c. financiële instrumenten als bedoeld in [artikel 1, onderdeel c, onder 1° en met 3°][ref3], waarvan het
      aannemelijk is dat zij binnen een jaar na emissie zullen worden toegelaten tot de notering op een gereglementeerde
      markt, een effectenbeurs of ter verhandeling zullen worden aangeboden op een andere geregelde, regelmatig
      functionerende, erkende open markt, voorzover de statuten of het fondsreglement van de beleggingsinstelling
      voorzien in belegging in deze financiële instrumenten;

      d. rechten van deelneming in beleggingsinstellingen als bedoeld in [artikel 6, eerste lid, van de wet][ref4]
      waarvoor op grond van [artikel 5 van de wet][ref5] een vergunning is verleend of in beleggingsinstellingen die
      overeenkomstig de richtlijn in een andere lidstaat zijn toegelaten, mits de betreffende beleggingsinstellingen
      volgens hun statuten of fondsreglementen niet meer dan tien procent van hun beheerde vermogen beleggen in rechten
      van deelneming in andere beleggingsinstellingen;

      e. rechten van deelneming in beleggingsinstellingen met zetel in een staat die door Onze Minister is aangewezen op
      grond van [artikel 17c van de wet][ref6], of in beleggingsinstellingen waarop het toezicht naar het oordeel van het
      bevoegde gezag in andere lidstaten gelijkwaardig is aan de richtlijn en ten aanzien waarvan de samenwerking tussen
      de bevoegde gezagen genoegzaam is gewaarborgd, indien:

      1°. de rechten van deelneming in de beleggingsinstellingen op verzoek van de deelnemers ten laste van de activa
      direct of indirect worden ingekocht of terugbetaald;

      2°. het reglementaire of statutaire doel van de beleggingsinstellingen uitsluitend is het beleggen in financiële
      instrumenten of deposito’s met toepassing van het beginsel van risicospreiding;

      3°. de op de beleggingsinstellingen toepasselijke regels inzake scheiding van het vermogen,
      opnemen en verstrekken van leningen en verkopen van financiële instrumenten als bedoeld in
      [artikel 1, onderdeel c, onder 1° tot en met 4°][ref7], vanuit een ongedekte positie gelijkwaardig zijn aan de
      voorschriften van de richtlijn; en

      4°. de beleggingsinstellingen volgens hun statuten of fondsreglementen niet meer dan tien procent van hun beheerde
      vermogen beleggen in rechten van deelneming in andere beleggingsinstellingen;

      f. deposito’s;

      g. financiële instrumenten als bedoeld in [artikel 1, onderdeel c, onder 6° tot en met 9°][ref8], die zijn
      toegelaten tot of worden verhandeld op een gereglementeerde markt of op een andere geregelde, regelmatig
      functionerende, erkende open markt in een lidstaat, voor zover de waarde afhankelijk is van de in dit artikel
      genoemde financiële instrumenten en deposito’s, financiële indices, rentetarieven, wisselkoersen of valuta’s waarin
      de beleggingsinstelling krachtens haar statuten of reglementen bevoegd is te beleggen;

      h. financiële instrumenten als bedoeld in [artikel 1, onderdeel c, onder 6° tot en met 9°][ref9], die zijn
      toegelaten tot de notering op een effectenbeurs dan wel worden verhandeld op een andere geregelde, regelmatig
      functionerende, erkende open markt in een staat die geen lidstaat is, voor zover de waarde afhankelijk is van de
      in dit artikel genoemde financiële instrumenten en deposito’s, financiële indices, rentetarieven, wisselkoersen of
      valuta’s waarin de beleggingsinstelling krachtens haar statuten of fondsreglement bevoegd is te beleggen;

      i. financiële instrumenten als bedoeld in [artikel 1, onderdeel c, onder 6° tot en met 9°][ref10], die buiten een
      gereglementeerde markt, effectenbeurs, of andere geregelde, regelmatig functionerende, erkende open markt worden
      verhandeld, indien:

      1°. de waarde afhankelijk is van de in dit artikel genoemde financiële instrumenten en deposito’s, financiële
      indices, rentetarieven, wisselkoersen of valuta’s waarin beleggingsinstelling krachtens haar statuten of
      reglementen bevoegd is te beleggen;

      2°. de tegenpartij een aan prudentieel toezicht onderworpen instelling is en behoort tot de categorieën die erkend
      zijn door de toezichthouder of een bevoegd gezag in een andere lidstaat, en

      3°. zij aan betrouwbare en verifieerbare dagelijkse waardering onderworpen zijn en te allen tijde tegen hun waarde
      in het economisch verkeer op initiatief van de beleggingsinstellingen kunnen worden verkocht, te gelde gemaakt of
      afgesloten door een compenserende transactie; of

      j. financiële instrumenten als bedoeld in [artikel 1, onderdeel c, onder 4°][ref11], die buiten een
      gereglementeerde markt worden verhandeld, indien de emissie of de emittent van deze instrumenten zelf aan
      regelgeving is onderworpen met het oog op de bescherming van beleggers en spaargelden, en deze instrumenten:

      1°. worden uitgegeven of gegarandeerd door een centrale, regionale of plaatselijke overheid, de centrale bank
      van een lidstaat, de Europese Centrale Bank, de Europese Unie of de Europese Investeringsbank, een staat die geen
      lidstaat is, een deelstaat van een federale staat, dan wel een internationale publiekrechtelijke instelling waarin
      een of meer lidstaten deelnemen;

      2°. worden uitgegeven door ondernemingen waarvan financiële instrumenten als bedoeld in
      [artikel 1, onderdeel c, onder 1° tot en met 3°][ref12], worden verhandeld op een gereglementeerde markt, een
      effectenbeurs of een andere geregelde, regelmatig functionerende, erkende en open markt;

      3°. worden uitgegeven of gegarandeerd door een instelling die in een lidstaat aan prudentieel toezicht is
      onderworpen of door een instelling die onderworpen is aan prudentieel toezicht dat in ieder geval gelijkwaardig is
      aan het ingevolge het gemeenschapsrecht geldende prudentieel toezicht; of

      4°. worden uitgegeven door andere instellingen waarvoor een gelijkwaardige bescherming van de belegger geldt als
      is vastgelegd in dit onderdeel, aanhef en onder 1°, 2° en 3°, indien de uitgevende instelling een onderneming is
      waarvan het kapitaal en de reserves in totaal ten minste € 10.000.000 bedragen en haar jaarrekeningen presenteert
      en publiceert overeenkomstig de Vierde [richtlijn nr. 78/660/EEG](31978L0660) van de Raad van de Europese
      Gemeenschappen van 25 juli 1978 op de grondslag van artikel 54, lid 3 sub g) van het Verdrag betreffende de
      jaarrekening van bepaalde vennootschappen (PbEG L 222), of een rechtspersoon is die binnen een groep ondernemingen
      waartoe een of meer ter beurze genoteerde ondernemingen behoren, specifiek gericht is op de financiering van de
      groep, of een rechtspersoon is specifiek gericht op de financiering van effectiseringsinstrumenten waarvoor een
      bankliquiditeitenlijn bestaat.


