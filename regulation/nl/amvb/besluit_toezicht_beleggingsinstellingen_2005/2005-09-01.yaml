  - number: '70'
    text: |-
      1 De in deze paragraaf gestelde begrenzingen gelden niet bij de uitoefening van voorkeursrechten die zijn verbonden
      aan financiële instrumenten als bedoeld in [artikel 1, onderdeel c, onder 1° tot en met 4°][ref1], die deel
      uitmaken van de activa van de beleggingsinstelling.

      2 Wanneer de in deze paragraaf gestelde begrenzingen buiten de wil van de beleggingsinstelling of ten gevolge van
      de uitoefening van voorkeursrechten worden overschreden, treft de beleggingsinstelling, met inachtneming van de
      belangen van de deelnemers, bij voorrang de nodige maatregelen opdat deze overschrijding ongedaan wordt gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0018622#Artikel1
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0018622
        artikel: '1'
        paragraaf: I
  - number: '71'
    text: |-
      Een beleggingsinstelling legt binnen vier weken na een verzoek daartoe van de toezichthouder, dan wel binnen vier
      weken na afloop van het boekjaar, een mededeling van een accountant over aan de toezichthouder waaruit blijkt dat
      de beleggingsinstelling in overeenstemming heeft gehandeld met de [artikelen 56 tot en met 70][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018622#Artikel56
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0018622
        artikel: '56'
        paragraaf: V
  - number: '72'
    text: |-
      Gelijktijdig met de verkrijgbaarstelling van het prospectus, bedoeld in [artikel 42, derde lid][ref1],
      zendt de beheerder een afschrift van het prospectus en van de financiële bijsluiter, bedoeld in
      [artikel 1, onderdeel d, van het Besluit financiële bijsluiter][ref2], van de beleggingsinstelling aan de
      toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0018622#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0013263#Artikel1
