    text: |-
      1 [Artikel 16][ref1] is van overeenkomstige toepassing op het eigen vermogen van beheerders en van
      beleggingsmaatschappijen die geen aparte beheerder hebben.

      2 Indien het eigen vermogen van een beheerder of beleggingsmaatschappij niet voldoet aan [artikel 16][ref2] meldt
      de beheerder of de beleggingsmaatschappij dit onverwijld aan de toezichthouder en brengt het eigen vermogen binnen
      een door de toezichthouder te stellen termijn in overeenstemming met [artikel 16][ref3].


