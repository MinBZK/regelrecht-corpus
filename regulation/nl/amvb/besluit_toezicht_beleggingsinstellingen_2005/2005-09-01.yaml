        artikel: '61'
        paragraaf: V
  - number: '63'
    text: |-
      1 In afwijking van [artikel 61, eerste lid][ref1], kan het beheerde vermogen van een beleggingsinstelling
      tot ten hoogste vijfendertig procent worden belegd in financiële instrumenten als bedoeld in
      [artikel 1, onderdeel c, 1° tot en met 4°][ref2], die zijn uitgegeven of gegarandeerd door een lidstaat,
      een openbaar lichaam met verordenende bevoegdheid in een lidstaat, een staat die geen lidstaat is, of een
      internationale organisatie waarin een of meer lidstaten deelnemen.

      2 Op verzoek van een beleggingsinstelling kan de toezichthouder ontheffing verlenen van het eerste lid en
      beleggingen voor een hoger percentage dan genoemd in het eerste lid toestaan indien:

      a. de beleggingsinstelling financiële instrumenten als bedoeld in
      [artikel 1, onderdeel c, 1° tot en met 4°][ref3], van ten minste zes verschillende emissies van een in het eerste
      lid bedoelde uitgevende staat, openbaar lichaam of internationale organisatie in portefeuille heeft;

      b. de financiële instrumenten van een zelfde emissie niet meer bedragen dan dertig procent van het beheerde
      vermogen van de beleggingsinstelling;

      c. de uitgevende staat, het openbaar lichaam of de internationale organisatie in de statuten of het fondsreglement
      van de beleggingsinstelling wordt genoemd; en

      d. de deelnemers in de beleggingsinstelling bescherming genieten die gelijkwaardig is aan de bescherming die
      voortvloeit uit het eerste lid en de [artikelen 61][ref4], [62][ref5], en [64][ref6].

      3 Onverminderd [artikel 36][ref7] vestigt de beleggingsinstelling in haar reclame-uitingen op opvallende wijze de
      aandacht op de ontheffing, bedoeld in het tweede lid, onder vermelding van de staat, het openbaar lichaam of de
      internationale organisatie die de financiële instrumenten, bedoeld in het tweede lid, uitgeeft of garandeert waarin
      de beleggingsinstelling voor meer dan vijfendertig procent van het beheerde vermogen belegt.


      [ref1]: https://wetten.overheid.nl/BWBR0018622#Artikel61
