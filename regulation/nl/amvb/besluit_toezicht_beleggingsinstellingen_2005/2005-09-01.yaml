  - number: '15'
    text: |-
      Een houder van een gekwalificeerde deelneming in de beheerder heeft op grond van die deelneming geen invloed of
      kan op grond van die deelneming geen invloed hebben op de beheerder die in strijd is met een gezonde of prudente
      bedrijfsvoering van de beheerder.
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel15
  - number: '16'
    text: |-
      1 In afwijking van [artikel 4][ref1] heeft de beheerder een eigen vermogen van ten minste € 125.000 en heeft de
      beleggingsmaatschappij die geen aparte beheerder heeft, een eigen vermogen van ten minste € 300.000.

      2 Indien de beheerder een vermogen beheert van meer dan € 250.000.000, heeft hij een aanvullend eigen vermogen van
      ten minste 0,02 procent van het bedrag waarmee de waarde van het beheerde vermogen het bedrag van € 250.000.000
      overstijgt.

      3 Het ingevolge het eerste en tweede lid vereiste eigen vermogen bedraagt ten hoogste € 10.000.000.

      4 Tot het beheerde vermogen, bedoeld in het tweede lid, wordt gerekend het vermogen van de beleggingsinstellingen
      waarover de beheerder het beheer voert met inbegrip van de delen van het vermogen waarvan hij het beheer heeft
      uitbesteed, met uitzondering van de delen van het vermogen waarvan het beheer door derden aan hem is uitbesteed.

      5 Onverminderd het eerste en tweede lid, beschikt de beheerder over een eigen vermogen van ten minste 25 procent
      van zijn vaste kosten in het afgelopen boekjaar. De toezichthouder kan bepalen dat het krachtens de vorige volzin
      vereiste percentage wordt aangepast in geval sprake is van aanzienlijke wijzigingen in de werkzaamheden van de
      beheerder sinds het voorgaande boekjaar.

      6 Wanneer de beheerder zijn werkzaamheden niet gedurende een volledig boekjaar heeft uitgeoefend, bedraagt het
      eigen vermogen, bedoeld in het vijfde lid, een kwart van het voor de werkzaamheden van de beheerder begrote bedrag
      voor de vaste kosten.

      7 De vaste kosten, bedoeld in het vijfde lid, omvatten alle kosten, met uitzondering van:

      a. de variabele kosten van werknemers waarvan het dienstverband niet onverwijld en zonder schadeloosstelling kan
      worden opgezegd;

      b. de kosten van werknemers waarvan het dienstverband onverwijld en zonder schadeloosstelling kan worden opgezegd;

      c. de variabele kosten betreffende de voor de beheerder verrichte effectendiensten;

      d. de afschrijvingen;

      e. de rentekosten over achtergestelde leningen, die op basis van [artikel 4, tweede lid][ref2], door de
      toezichthouder zijn aangemerkt als bestanddeel van het eigen vermogen;

      f. de buitengewone kosten met een eenmalig karakter; en

      g. de overige, door de toezichthouder goedgekeurde, variabele kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0018622#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0018622#Artikel4
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel16
