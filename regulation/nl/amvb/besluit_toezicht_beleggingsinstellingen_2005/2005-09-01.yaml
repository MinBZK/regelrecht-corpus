  - number: '22'
    text: |-
      1 Een beleggingsfonds of beleggingsmaatschappij waarvan de rechten van deelneming op verzoek van de deelnemers
      ten laste van de activa direct of indirect worden ingekocht of terugbetaald, houdt liquiditeitswaarborgen aan ter
      grootte van minimaal tien procent van het beheerde vermogen onderscheidenlijk het eigen vermogen.

      2 In afwijking van het vorige lid kan, indien uit een overeengekomen ontbindings- of beëindigingsregeling vooraf
      bekend is voor welk bedrag op een bepaalde datum wordt ingekocht, worden volstaan met dat bedrag.

      3 De beleggingsinstelling meldt aan de toezichthouder onverwijld het niet tijdig kunnen voldoen aan de
      verplichting, bedoeld in het eerste lid of tweede lid.

      4 De toezichthouder stelt regels met betrekking tot de categorieën van goederen die als liquiditeitswaarborgen als
      bedoeld in het eerste lid kunnen gelden.
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel22
  - number: '23'
    text: |-
      Het dagelijks beleid van een beheerder, beleggingsmaatschappij of bewaarder wordt bepaald door ten minste twee
      natuurlijke personen die volgens [wet][ref1], statuten of reglementen bevoegd zijn deze te vertegenwoordigen.


      [ref1]: https://wetten.overheid.nl/BWBR0004809
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004809
  - number: '24'
    text: |-
      De personen die het dagelijks beleid van een in Nederland gevestigde beheerder of een in Nederland gevestigde
      beleggingsmaatschappij bepalen verrichten hun werkzaamheden in verband daarmee hoofdzakelijk vanuit Nederland.
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel24
  - number: '25'
    text: |-
      De activa van een beleggingsfonds worden bewaard door een bewaarder die uitsluitend ten behoeve van het
      beleggingsfonds bewaart, indien op grond van het beleggingsbeleid van het desbetreffende beleggingsfonds een reëel
      risico bestaat dat het vermogen van het beleggingsfonds ontoereikend zal zijn voor voldoening van vorderingen als
      bedoeld in [artikel 16a, eerste lid, van de wet][ref1] en dat het eigen vermogen van de bewaarder ontoereikend zal
      zijn voor voldoening van dergelijke vorderingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel16a
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: 16a
  - number: '26'
    text: |-
      1 Een beheerder, beleggingsmaatschappij of bewaarder handelt in het belang van de deelnemers in de
      beleggingsinstelling.

      2 Een beheerder of beleggingsmaatschappij behandelt deelnemers onder vergelijkbare omstandigheden op gelijke wijze.

      3 Door of namens een beleggingsinstelling worden geen transacties uitgevoerd voor haar rekening met een zodanige
      frequentie of van een zodanige omvang dat dit gezien de omstandigheden kennelijk slechts strekt tot bevoordeling
      van de beheerder, de beleggingsinstelling of met de beheerder, beleggingsmaatschappij of bewaarder gelieerde
      partijen.

      4 Een beheerder of beleggingsmaatschappij benadert personen die geen deelnemer zijn in de beleggingsinstelling
      direct noch indirect telefonisch, elektronisch of in persoon, tenzij:

      a. de betrokkene daarmee vooraf uitdrukkelijk schriftelijk dan wel elektronisch heeft ingestemd; of

      b. de betrokkene in het contact slechts schriftelijk of elektronisch informatiemateriaal wordt aangeboden.

      5 Het vierde lid is niet van toepassing ten aanzien van natuurlijke personen of rechtspersonen die beroeps- of
      bedrijfsmatig handelen of beleggen in beleggingsobjecten.
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel26
  - number: '27'
    text: |-
      1 Indien een beheerder of een bewaarder opdracht verleent aan een derde om een of meer werkzaamheden in het kader
      van het beheer van een door de beheerder beheerde beleggingsinstelling onderscheidenlijk de bewaring van de activa
      van de beleggingsinstelling te verrichten, is het volgende van toepassing:

      a. de beheerder of de bewaarder blijft voor de toepassing van de [wet][ref1] verantwoordelijk voor de uitvoering
      van de werkzaamheden;

      b. de opdrachtverlening aan de derde belemmert niet een doeltreffend toezicht op de beheerder, de
      beleggingsinstelling of de bewaarder;

      c. de opdrachtnemer is op ieder door de beheerder, de door de beheerder beheerde beleggingmaatschappij of de
      bewaarder gewenst moment in staat verantwoording af te leggen over de door hem uitgevoerde werkzaamheden en de
      beheerder, de door de beheerder beheerde beleggingsmaatschappij of de bewaarder daar inzicht in te bieden;

      d. de beheerder of de bewaarder kan te allen tijde instructies omtrent de uitvoering van de werkzaamheden geven aan
      de opdrachtnemer en kan de opdracht met onmiddellijke ingang beëindigen indien dit in het belang van de beleggers
      is; en

      e. de opdrachtnemer is, gelet op de aard van de opdracht, aantoonbaar in staat om de opdracht in overeenstemming
      met de [wet][ref2] te vervullen.

      2 Een beheerder verleent geen opdracht aan een derde om het beleggingsbeleid van een door hem beheerde
      beleggingsinstelling te bepalen.

      3 Iedere overeenkomst die een beheerder of een bewaarder aangaat met een derde in het kader van het beheer
      van de door de beheerder beheerde beleggingsinstelling onderscheidenlijk de bewaring van de activa van de
      beleggingsinstelling, wordt schriftelijk vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004809
      [ref2]: https://wetten.overheid.nl/BWBR0004809
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0004809
      - id: ref2
        bwb_id: BWBR0004809
  - number: '28'
    text: |-
      1 [Artikel 9][ref1] is van overeenkomstige toepassing op beheerders en bewaarders.

      2 Een beheerder zendt een afschrift van iedere met een bewaarder gesloten overeenkomst alsmede van wijzigingen of
      aanvullingen van die overeenkomst binnen twee weken na ondertekening, wijziging of aanvulling van de overeenkomst
      aan de toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0018622#Artikel9
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel28
