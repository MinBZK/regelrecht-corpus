  - number: '61'
    text: |-
      1 Het beheerde vermogen van een beleggingsinstelling wordt tot ten hoogste tien procent belegd in financiële
      instrumenten als bedoeld in [artikel 1, onderdeel c, onder 1° tot en met 4°][ref1], uitgegeven door één
      uitgevende instelling. Een beleggingsinstelling belegt niet meer dan twintig procent van het beheerde vermogen in
      deposito’s bij één instelling.

      2 Het tegenpartijrisico van een beleggingsinstelling bij een transactie in financiële instrumenten als bedoeld in
      [artikel 1, onderdeel c, onder 6° tot en met 9°][ref2], die buiten een gereglementeerde markt, effectenbeurs of
      andere geregelde, regelmatig functionerende, erkende open markt worden verhandeld, bedraagt niet meer dan:

      a. tien procent van haar vermogen wanneer de tegenpartij een kredietinstelling is; of

      b. vijf procent van haar vermogen, in andere gevallen.

      3 De totale waarde van de financiële instrumenten, bedoeld in
      [artikel 1, onderdeel c, onder 1° tot en met 4°][ref3], die de beleggingsinstelling houdt in uitgevende
      instellingen waarin zij per instelling voor meer dan vijf procent belegt, bedraagt niet meer dan veertig procent
      van het beheerde vermogen van de beleggingsinstelling. Deze begrenzing is niet van toepassing op deposito’s en
      transacties in financiële instrumenten als bedoeld in [artikel 1, onderdeel c, onder 6° tot en met 9°][ref4], die
      buiten een gereglementeerde markt, effectenbeurs of andere geregelde, regelmatig functionerende, erkende open markt
      worden verhandeld, bij onderscheidenlijk met financiële instellingen die aan prudentieel toezicht onderworpen zijn.

      4 Onverminderd de in het eerste en tweede lid bepaalde individuele begrenzingen wordt het beheerde vermogen van een
      beleggingsinstelling tot ten hoogste twintig procent belegd in één instelling in een combinatie van:

      a. financiële instrumenten als bedoeld in [artikel 1, onderdeel c, onder 1° tot en met 4°][ref5], die door die
      instelling zijn uitgegeven;

      b. deposito’s bij die instelling; of

      c. risico’s ten gevolge van transacties in financiële instrumenten als bedoeld in
      [artikel 1, onderdeel c, onder 6° tot en met 9°][ref6], die buiten een gereglementeerde markt, effectenbeurs,
      of andere geregelde, regelmatig functionerende, erkende open markt worden verhandeld, met betrekking tot die
      instelling.

      5 Bij de berekening van de door de beleggingsinstelling gelopen risico’s bij beleggingen als bedoeld in het eerste
      tot en met vierde lid, wordt het risico bepaald aan de hand van het maximale verlies voor de beleggingsinstelling
      wanneer een tegenpartij in gebreke blijft. De toezichthouder kan nadere regels stellen over de berekening
      van het tegenpartijrisico en de daarbij in aanmerking te nemen zekerheden als beperking van het door de
      beleggingsinstelling gelopen tegenpartijrisico.


      [ref1]: https://wetten.overheid.nl/BWBR0018622#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018622#Artikel1
