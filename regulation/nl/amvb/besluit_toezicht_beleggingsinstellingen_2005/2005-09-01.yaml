        artikel: 17c
  - number: '77'
    text: |-
      De statuten of het fondsreglement van een beleggingsinstelling vermelden:

      a. de wijze waarop de bepaling plaatsvindt van de emissie-, verkoop- of inkoopprijs, en het bedrag bij
      terugbetaling van de waarde van de rechten van deelneming;

      b. de aard van de kosten die ten laste komen van het resultaat, in mindering worden gebracht op het beheerde
      vermogen of anderszins ten laste komen van de deelnemers in de beleggingsinstelling.
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel77
  - number: '78'
    text: |-
      1 Een beleggingsmaatschappij als bedoeld in [artikel 17, tweede en derde lid][ref1], draagt een accountant op
      om zich ten minste eenmaal per kwartaal ervan te vergewissen dat de berekening van de waarde van rechten van
      deelneming plaatsvindt overeenkomstig haar statuten en dit besluit en dat de activa van de beleggingsmaatschappij
      zijn belegd in overeenstemming met haar statuten alsmede met de in de [artikelen 57 tot en met 70][ref2] vervatte
      regels, waarbij tussen elk van de tijdstippen van vergewissing een periode van ten minste een week ligt.

      2 Een beleggingsmaatschappij als bedoeld in [artikel 17, tweede en derde lid][ref3], koopt of verkoopt al dan niet
      door tussenkomst van een derde haar rechten van deelneming dan wel geeft deze uit, om te voorkomen dat de waarde
      van haar rechten van deelneming ter beurze meer dan vijf procent afwijkt van de intrinsieke waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0018622#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0018622#Artikel57
      [ref3]: https://wetten.overheid.nl/BWBR0018622#Artikel17
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel78
