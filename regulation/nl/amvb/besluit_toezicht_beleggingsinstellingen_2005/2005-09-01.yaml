  - number: '2'
    text: |-
      Het bij of krachtens dit besluit bepaalde ten aanzien van een beleggingsinstelling die een beleggingsmaatschappij
      met aparte beheerder is, is gericht tot de beheerder.
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel2
  - number: '3'
    text: |-
      1 Het dagelijks beleid van de beheerder en, indien van toepassing, de bewaarders wordt bepaald door personen die
      deskundig zijn in verband met de uitoefening van het bedrijf van de beheerder onderscheidenlijk de bewaarders.

      2 Het beleid van de beheerder en, indien van toepassing, de bewaarders wordt bepaald of mede bepaald door personen
      wier betrouwbaarheid buiten twijfel staat. Indien toezicht wordt gehouden op het beleid en de algemene gang van
      zaken van de beheerder en, indien van toepassing, de bewaarder, wordt dit toezicht gehouden door personen wier
      betrouwbaarheid buiten twijfel staat.
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel3
  - number: '4'
    text: |-
      1 De beheerder en, indien van toepassing, de bewaarders beschikken over een minimum bedrag aan eigen vermogen van €
      225.000 onderscheidenlijk € 112.500.

      2 De samenstelling van het eigen vermogen voldoet aan door de toezichthouder te stellen regels in overeenstemming
      met Titel V, hoofdstuk 2, afdeling 1 van [richtlijn nr. 2000/12/EG](32000L0012) van het Europees Parlement en de
      Raad van de Europese Unie van 20 maart 2000 betreffende de toegang tot en de uitoefening van de werkzaamheden van
      kredietinstellingen (PbEG L 126) en [richtlijn nr. 93/6/EEG](31993L0006) van de Raad van de Europese Gemeenschappen
      van 15 maart 1993 inzake de kapitaaltoereikendheid van beleggingsondernemingen en kredietinstellingen (PbEG L 141).

      3 Iedere bewaarder treft maatregelen met het oog op de aansprakelijkheid voor schade die voor de bewaarder kan
      voortvloeien uit brand, vervoer van geld en waardepapieren, fraude of beroving.
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel4
  - number: '5'
    text: |-
      Het dagelijks beleid van de beheerder en, indien van toepassing, de bewaarders wordt bepaald door ten minste twee
      natuurlijke personen die volgens [wet][ref1], statuten of reglementen bevoegd zijn deze te vertegenwoordigen.


      [ref1]: https://wetten.overheid.nl/BWBR0004809
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004809
  - number: '6'
    text: |-
      De personen die het dagelijks beleid bepalen van de in Nederland gevestigde beheerder of de beleggingsmaatschappij,
      bedoeld in [artikel 6, eerste lid, van de wet][ref1], verrichten hun werkzaamheden in verband daarmee hoofdzakelijk
      vanuit Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '6'
  - number: '7'
    text: |-
      De activa van een beleggingsfonds dat de beheerder voornemens is te beheren worden bewaard door een bewaarder
      die uitsluitend ten behoeve van het beleggingsfonds bewaart, indien op grond van het beleggingsbeleid van het
      desbetreffende beleggingsfonds een reëel risico bestaat dat het vermogen van het beleggingsfonds ontoereikend zal
      zijn voor voldoening van vorderingen als bedoeld in [artikel 16a, eerste lid, van de wet][ref1] en dat het eigen
      vermogen van de bewaarder ontoereikend zal zijn voor voldoening van dergelijke vorderingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel16a
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: 16a
  - number: '8'
    text: |-
      1 De beheerder en, indien van toepassing, de bewaarders beschikken over een beschrijving van de administratieve
      organisatie en het systeem van interne controle.

      2 De beschrijving van de administratieve organisatie en het systeem van interne controle van de beheerder voorziet
      voor iedere beleggingsinstelling die hij voornemens is te beheren in een afzonderlijke administratieve organisatie
      en een afzonderlijk systeem van interne controle.

      3 De beschrijving van de administratieve organisatie en het systeem van interne controle voorziet ten minste in
      procedures en maatregelen die waarborgen dat:

      a. elke transactie waarbij de beleggingsinstelling is betrokken, kan worden gereconstrueerd;

      b. het beheerde vermogen van de beleggingsinstelling overeenkomstig het beleggingsbeleid en de bij of krachtens de
      [wet][ref1] gestelde regels wordt belegd;

      c. het besluitvormingsproces en de gemaakte afspraken binnen de beheerder, beleggingsinstelling en bewaarders
      inzichtelijk zijn;

      d. een functiescheiding bestaat tussen het verrichten van rechtshandelingen met betrekking tot het vermogen van de
      beleggingsinstelling en het controleren en administreren van deze handelingen;

      e. een betrouwbare, juiste en consistente intrinsieke waarde van de belegginginstelling wordt bepaald;

      f. het proces van intrinsieke waardebepaling binnen de beheerder en de beleggingsmaatschappij wordt gescheiden van
      de overige activiteiten van de beheerder en de beleggingsmaatschappij;

      g. de berekening van de intrinsieke waarde van de beleggingsinstelling aansluit bij de financiële administratie;

      h. klachten zorgvuldig, verifieerbaar, consistent en binnen een redelijke termijn worden afgehandeld;

      i. de risico’s die samenhangen met het beleggingsproces op een systematische wijze worden beheerst en geanalyseerd;

      j. de grootte en samenstelling van en mutaties in de aan te houden financiële waarborgen getrouw en volledig kunnen
      worden vastgesteld;

      k. de bestuurders regelmatig, alsmede tussentijds in het geval zich bijzondere omstandigheden voordoen, worden
      geïnformeerd over de bedrijfsvoering;

      l. er, voor zover mogelijk, een systematische, toegankelijke en actuele administratie van deelnemers in de
      beleggingsinstelling is waarin, voor zover van toepassing, de met de deelnemers gemaakte afspraken inzichtelijk
      worden gemaakt;

      m. de integriteit, voortdurende beschikbaarheid en beveiliging van de geautomatiseerde gegevens zijn gegarandeerd;
      en

      n. nagegaan wordt in hoeverre overeenkomstig de beschreven procedures voor administratieve organisatie wordt
      gehandeld, gesignaleerd wordt wanneer en in hoeverre daarvan wordt afgeweken en aanpassing van het feitelijk
      handelen mogelijk is.

      4 De toezichthouder kan regels stellen met betrekking tot de onderwerpen, bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004809
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004809
  - number: '9'
    text: |-
      1 Indien de activa van een beleggingsinstelling door een bewaarder worden bewaard, gaan de beheerder en de
      bewaarder een schriftelijke overeenkomst aan terzake van beheer en bewaring.

      2 De tussen de beheerder en een bewaarder gesloten overeenkomst ter zake van beheer en bewaring bepaalt in ieder
      geval dat:

      a. de bewaarder bij het bewaren in het belang van de deelnemers in de beleggingsinstelling optreedt;

      b. de bewaring ten name van de beleggingsinstelling op een zodanige wijze geschiedt dat over de in bewaring gegeven
      activa slechts kan worden beschikt door de beheerder en de bewaarder tezamen;

      c. de bewaarder de in bewaring gegeven activa slechts afgeeft tegen ontvangst van een verklaring van de beheerder
      waaruit blijkt dat afgifte wordt verlangd in verband met de regelmatige uitoefening van de beheerfunctie;

      d. de bewaarder volgens het recht van de staat waar de beheerder zijn zetel heeft jegens de beleggingsinstelling en
      de deelnemers aansprakelijk is voor door hen geleden schade voorzover de schade het gevolg is van verwijtbare niet-
      nakoming of gebrekkige nakoming van zijn verplichtingen, ook indien de bewaarder de bij hem in bewaring gegeven
      activa geheel of gedeeltelijk aan een derde heeft toevertrouwd;

      e. indien bewijzen van rechten van deelneming worden afgegeven, deze bewijzen door de bewaarder worden ondertekend;
      en

      f. een voorstel door de beheerder tot wijziging van de tussen de beleggingsinstelling en de deelnemers geldende
      voorwaarden, tezamen met de bewaarder wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel9
  - number: '10'
    text: |-
      De beheerder en, indien van toepassing, de bewaarders treffen maatregelen om te voldoen aan het bij of krachtens de
      [artikelen 30 tot en met 33][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0018622#Artikel30
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0018622
        artikel: '30'
        paragraaf: IV
  - number: '11'
    text: |-
      1 De beheerder heeft een registratiedocument beschikbaar waarin gegevens zijn opgenomen over de beheerder,
      de soorten beleggingsinstellingen die hij beheert of voornemens is te beheren en, indien van toepassing, de
      bewaarders.

      2 Het registratiedocument bevat ten minste de gegevens, bedoeld in [bijlage A][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018622
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0018622
  - number: '12'
    text: |-
      1 De beheerder en, indien van toepassing, de bewaarders behoren niet tot een groep waarbinnen de formele of
      feitelijke zeggenschapsstructuur in zodanige mate ondoorzichtig is dat deze een belemmering vormt of kan vormen
      voor het adequaat uitoefenen van toezicht op de beheerder, de beleggingsinstellingen die de beheerder voornemens is
      te beheren of de bewaarders.

      2 De beheerder en, indien van toepassing, de bewaarders zijn niet in een groep verbonden met een natuurlijke
      persoon of een rechtspersoon indien het recht van een staat die geen lidstaat is, dat op die persoon van
      toepassing is, een belemmering vormt of kan vormen voor het adequaat uitoefenen van toezicht op de beheerder, de
      beleggingsinstellingen die de beheerder voornemens is te beheren of de bewaarders.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op de beleggingsmaatschappij, bedoeld in
      [artikel 6, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '6'
  - number: '13'
    text: |-
      1 Bij de aanvraag van een vergunning legt de beheerder de volgende informatie over:

      a. het registratiedocument, bedoeld in [artikel 11][ref1];

      b. een beschrijving van het beleggingsbeleid van de beleggingsinstellingen die de beheerder voornemens is te
      beheren;

      c. de statuten van de beheerder;

      d. een beschrijving van de administratieve organisatie en het systeem van interne controle van de beheerder en,
      indien van toepassing, de bewaarders;

      e. indien van toepassing: de overeenkomst, bedoeld in [artikel 9][ref2] of [artikel 18][ref3];

      f. een beschrijving van de maatregelen, bedoeld in [artikel 10][ref4];

      g. gegevens ten aanzien van de groep waartoe de beheerder en, indien van toepassing, de bewaarders behoren;

      h. voor zover verschenen, de jaarrekeningen over de laatste drie jaren en, voor zover op grond van
      [Boek 2 van het Burgerlijk Wetboek][ref5] vereist, de op die jaarrekeningen betrekking hebbende verklaringen,
      bedoeld in [artikel 393, vijfde lid, van Boek 2 van het Burgerlijk Wetboek][ref6] en de laatste halfjaarcijfers; en

      i. gegevens waaruit blijkt dat wordt voldaan aan de vereisten, bedoeld in de [artikelen 5, tweede lid][ref7],
      [6][ref8], en [artikel 9 van de wet][ref9], voor zover deze artikelen van toepassing zijn.

      2 Bij de aanvraag van een vergunning legt de beleggingsmaatschappij, bedoeld in
      [artikel 6, eerste lid, van de wet][ref10], die een beheerder heeft de volgende informatie over:

      a. gegevens ten aanzien van de groep waartoe de beleggingsmaatschappij behoort; en

      b. gegevens waaruit blijkt dat wordt voldaan aan de vereisten bedoeld in de [artikelen 6][ref11], en, voor zover
      van toepassing, [9 van de wet][ref12].


