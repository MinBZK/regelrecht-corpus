  - number: '45'
    text: |-
      1 Onverminderd [artikel 43, tweede lid][ref1], bevat de toelichting op de balans en de winst- en verliesrekening
      van een beleggingsinstelling ten minste de volgende gegevens:

      a. een sluitend overzicht van het verloop gedurende het boekjaar van de activa waarbij de beleggingen worden
      onderscheiden naar soort;

      b. een overzicht van de samenstelling van de activa aan het einde van het boekjaar;

      c. een vergelijkend overzicht over de laatste drie jaren van de intrinsieke waarde van de beleggingsinstelling, het
      aantal uitstaande rechten van deelneming en de intrinsieke waarde per recht van deelneming, een en ander per het
      einde van het boekjaar;

      d. een mededeling in hoeverre incourante beleggingen door een onafhankelijke deskundige zijn gewaardeerd, volgens
      welke methode de waardering heeft plaatsgevonden, alsmede de regelmaat waarmee deze waardering plaatsvindt;

      e. het bedrag der verplichtingen, onderscheiden naar soort aan het einde van het boekjaar, die voortvloeien uit
      dekkingstransacties met betrekking tot koers- en wisselkoersrisico in verband met de beleggingen, voor zover een en
      ander niet reeds in de balans en winst- en verliesrekening is begrepen;

      f. een gespecificeerde opgave van de activa van de beleggingsinstelling die deelnemingen zijn in de zin van
      [artikel 389, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2];

      g. indien de beleggingsinstelling 99 procent van het beheerde vermogen belegt in een andere beleggingsinstelling:
      de gegevens, bedoeld in de onderdelen a, b, c, d en e, met betrekking tot de andere beleggingsinstelling;

      h. indien van toepassing: een mededeling op welke wijze uitvoering is gegeven aan het beleid, bedoeld in
      [onderdeel XIV van bijlage B][ref3]; en

      i. indien van toepassing: een mededeling dat de rechten van deelneming op verzoek van de deelnemers ten laste van
      de activa direct of indirect worden ingekocht of terugbetaald en onder welke omstandigheden de beleggingsinstelling
      dat kan opschorten.

      2 Indien de beleggingsinstelling ten minste 95 procent van het beheerde vermogen indirect belegt in een andere
      beleggingsinstelling is het eerste lid, aanhef en onderdelen a, b, c, d en e van overeenkomstige toepassing met
      betrekking tot die andere beleggingsinstelling.

      3 Onverminderd [artikel 379, derde lid, van Boek 2 van het Burgerlijk Wetboek][ref4] vermeldt de
      beleggingsinstelling onder de overige gegevens, bedoeld in [artikel 43, eerste lid][ref5], het totale
      persoonlijke belang dat de bestuurders van de beheerder of de beleggingsmaatschappij bij iedere belegging van de
      beleggingsinstelling aan het begin en het einde van het boekjaar hebben gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0018622#Artikel43
