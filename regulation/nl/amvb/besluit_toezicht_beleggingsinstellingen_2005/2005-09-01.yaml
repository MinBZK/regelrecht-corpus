  - number: '74'
    text: |-
      1 Een beleggingsinstelling publiceert telkens wanneer zij haar rechten van deelneming emitteert, verkoopt,
      inkoopt, of daarop terugbetaalt de emissiekoers, de verkoop- onderscheidenlijk inkoopprijs en het bedrag van de
      terugbetaling op de website van haar beheerder. De toezichthouder kan de beleggingsinstelling op verzoek toestaan
      deze bekendmaking eenmaal per maand te doen, indien de belangen van de deelnemers daardoor niet worden geschaad.

      2 Het eerste lid is niet van toepassing op een beleggingsmaatschappij als bedoeld in
      [artikel 17, tweede lid][ref1].

      3 Onverminderd [artikel 35][ref2] brengt een beleggingsmaatschappij als bedoeld in
      [artikel 17, tweede en derde lid][ref3], de intrinsieke waarde van de rechten van deelneming ten minste tweemaal
      per week ter kennis van de toezichthouder en publiceert zij de intrinsieke waarde van de rechten van deelneming
      tweemaal per maand op de website van haar beheerder waarbij tussen elk van de tijdstippen van publicatie een
      periode van ten minste een week ligt.

      4 Een beleggingsinstelling verschaft desgevraagd aan een deelnemer gegevens betreffende kwantitatieve begrenzingen
      die van toepassing zijn op het risicobeheer, de daartoe gekozen methodes en de recente ontwikkeling van de risico’s
      en rendementen van de voornaamste categorie financiële instrumenten.


      [ref1]: https://wetten.overheid.nl/BWBR0018622#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0018622#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0018622#Artikel17
