  - number: '20'
    text: |-
      1 [Artikel 3][ref1] is van overeenkomstige toepassing op beheerders en bewaarders.

      2 Het dagelijks beleid van een beleggingsmaatschappij die een aparte beheerder heeft wordt bepaald door personen
      die deskundig zijn in verband met de uitoefening van het bedrijf van de beleggingsmaatschappij.

      3 Het beleid van de beleggingsmaatschappij, bedoeld in het tweede lid, wordt bepaald of mede bepaald door personen
      wier betrouwbaarheid buiten twijfel staat. Het toezicht op het beleid en de algemene gang van zaken van de
      beleggingsmaatschappij wordt gehouden door personen wier betrouwbaarheid buiten twijfel staat.

      4 Indien zich een wijziging van de antecedenten van de personen, bedoeld in [artikel 3][ref2] en het tweede en
      derde lid, voordoet, stelt de beheerder de toezichthouder daarvan onverwijld nadat hij daarvan kennis heeft genomen
      schriftelijk in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0018622#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018622#Artikel3
