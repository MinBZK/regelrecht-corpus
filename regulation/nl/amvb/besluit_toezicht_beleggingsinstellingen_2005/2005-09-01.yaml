  - number: '47'
    text: |-
      1 Onverminderd de [artikelen 43, tweede lid][ref1], [45, eerste lid][ref2], en [46, eerste lid][ref3], vermeldt een
      beleggingsinstelling in de toelichting op de balans en de winst en verliesrekening:

      a. indien van toepassing: de met de met de beheerder, beleggingsmaatschappij of bewaarder gelieerde partijen
      aangegane overeenkomsten en een beschrijving van de hoofdlijnen van die overeenkomsten;

      b. welk percentage van het totale transactievolume van de beleggingsinstelling is uitgevoerd via de met de
      beheerder, beleggingsmaatschappij of bewaarder gelieerde partijen;

      c. indien van toepassing: een opsomming van de soorten transacties die via de met de beheerder,
      beleggingsmaatschappij of bewaarder gelieerde partijen zijn uitgevoerd en de voorwaarden waaronder die transacties
      plaatsvinden. Indien een transactie met een gelieerde partij niet tegen marktconforme voorwaarden heeft
      plaatsgevonden wordt tevens de naam van de gelieerde partij, de prijs, de relevante voorwaarden, de getaxeerde
      waarde en de reden voor niet marktconform handelen vermeld;

      d. indien van toepassing: het totaalbedrag gemoeid met transacties met de met de beheerder, beleggingsmaatschappij
      of bewaarder gelieerde partijen buiten een gereglementeerde markt, een effectenbeurs of een andere geregelde,
      regelmatig functionerende, erkende open markt;

      e. indien van toepassing: dat de beleggingsinstelling direct of indirect belegt in een andere
      beleggingsmaatschappij die een met de beheerder, beleggingsmaatschappij of bewaarder gelieerde partij is of in
      een andere beleggingsinstelling die beheerd wordt door een met de beheerder, beleggingsmaatschappij of bewaarder
      gelieerde partij en onder welke voorwaarden verkoop of inkoop van, alsmede terugbetaling op de rechten van
      deelneming in de andere beleggingsinstelling plaatsvindt;

      f. indien van toepassing: beleggingen in met de beheerder, beleggingsmaatschappij of bewaarder gelieerde partijen,
      niet zijnde beleggingsinstellingen, die meer dan tien procent van het vermogen van de gelieerde partij of van
      het beheerde vermogen van de beleggingsinstelling uitmaken, met een uiteenzetting van de relatie met de gelieerde
      partijen en het land van vestiging van de betreffende gelieerde partijen indien dit niet Nederland is;

      g. indien opdracht aan een of meer derden is verleend om een of meer werkzaamheden in het kader van het beheer of
      de bewaring van de activa van de beleggingsinstelling te verrichten: de naam van de derde(n) en een beschrijving
      van de werkzaamheden ten aanzien waarvan opdracht is verleend;

      h. indien financiële instrumenten worden in- of uitgeleend:

      1°. de waarde van de in- en uitgeleende financiële instrumenten; deze informatie dient in de toelichting op de
      balans onder de balanspost financiële instrumenten te worden vermeld; en

      2°. de zekerheden die de beleggingsinstelling heeft verkregen;

      i. indien de beleggingsinstelling gemiddeld twintig procent of meer van het beheerde vermogen direct of indirect
      belegt in een andere beleggingsinstelling:

      1°. waar de jaarrekening en het jaarverslag van de andere beleggingsinstelling verkrijgbaar zijn;

      2°. of en zo ja, waar de beleggingsinstelling onder toezicht staat;

      3°. het relatieve belang van de beleggingsinstelling in de andere beleggingsinstelling;

      4°. de intrinsieke waarde van de rechten van deelneming in de andere beleggingsinstelling aan het einde van het
      boekjaar;

      5°. een beschrijving van het beleggingsresultaat van de andere beleggingsinstelling; en

      6°. indien van toepassing: de afspraken tussen de beleggingsinstelling en de andere beleggingsinstelling over de
      deling van kosten en aan wie het voordeel ten goede is gekomen;

      j. indien de beleggingsinstelling 99 procent van het beheerde vermogen belegt in een andere beleggingsinstelling:
      het beleggingsbeleid van de andere beleggingsinstelling; en

      k. een verklaring van de beheerder dat hij voor de beleggingsinstelling beschikt over een beschrijving van de
      administratieve organisatie en systeem van interne controle als bedoeld in [artikel 8][ref4] die voldoet aan de
      eisen van de [wet][ref5] en dit besluit en dat de administratieve organisatie en het systeem van interne controle
      effectief en overeenkomstig de beschrijving functioneren.

      2 Indien de beleggingsinstelling ten minste 95 procent van het beheerde vermogen indirect belegt in een andere
      beleggingsinstelling is het eerste lid, aanhef en onderdeel j, van overeenkomstige toepassing met betrekking tot
      die andere beleggingsinstelling.

      3 De toezichthouder kan op verzoek van de beleggingsinstelling een ontheffing verlenen van het eerste lid,
      onderdeel i, indien de noodzakelijke gegevens niet of niet tijdig beschikbaar zijn. In de toelichting op de
      balans en de winst- en verliesrekening van de beleggingsinstelling wordt vermeld ten aanzien van welke andere
      beleggingsinstelling ontheffing is verleend, welke informatie niet beschikbaar is en de reden waarom deze
      informatie niet beschikbaar is.

      4 De toezichthouder kan regels stellen met betrekking tot de wijze waarop en de vorm waarin de informatie, bedoeld
      in het eerste lid, wordt opgenomen in de jaarrekening.


      [ref1]: https://wetten.overheid.nl/BWBR0018622#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0018622#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0018622#Artikel46
      [ref4]: https://wetten.overheid.nl/BWBR0018622#Artikel8
