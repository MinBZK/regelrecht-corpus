preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Financiën van 26 juli 2004, Generale Thesaurie, Directie Financiële Markten,
    Afdeling Marktgedrag en effectenverkeer, nr. FM 2004-987M;

    Gelet op artikel 5, eerste lid, artikel 6, eerste, vijfde en zesde lid, 9, tweede lid, artikel 12, eerste, tweede,
    derde en zevende lid, artikel 17a, zevende lid, artikel 17c, eerste en vijfde lid, en artikel 33d, eerste lid en
    derde lid, van de Wet toezicht beleggingsinstellingen;

    De Raad van State gehoord (advies van 22 november 2004, nr. W06.04.0404/IV);

    Gezien het nader rapport van Onze Minister van Financiën van 13 juli 2005 (nr. 2005-01746 FM);

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. accountant: een accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]
      die niet in dienstbetrekking staat tot de desbetreffende beheerder, beleggingsmaatschappij of bewaarder;

      b. bestuurder: een ieder die een beheerder, beleggingsmaatschappij of bewaarder krachtens [wet][ref2]
      vertegenwoordigt dan wel binnen een beheerder, beleggingsmaatschappij of bewaarder het beleid bepaalt;

      c. financiële instrumenten:

      1°. aandelen en andere met aandelen gelijk te stellen waardebewijzen die op de kapitaalmarkt verhandelbaar zijn;

      2°. obligaties en andere schuldinstrumenten die op de kapitaalmarkt verhandelbaar zijn;

      3°. alle andere gewoonlijk verhandelde waardebewijzen waarmee financiële instrumenten als bedoeld onder 1° en 2°
      via inschrijving of omruiling kunnen worden verworven of die in contanten worden afgewikkeld;

      4°. geldmarktinstrumenten die gewoonlijk op de geldmarkt worden verhandeld, liquide zijn en waarvan de waarde te
      allen tijde nauwkeurig kan worden vastgesteld;

      5°. rechten van deelneming in beleggingsinstellingen waarvan de rechten op verzoek van de deelnemers ten laste van
      de activa direct of indirect worden ingekocht of terugbetaald;

      6°. financiële futures, met inbegrip van gelijkwaardige instrumenten die aanleiding geven tot afwikkeling in
      contanten;

      7°. rentetermijncontracten, met inbegrip van gelijkwaardige instrumenten die gericht zijn op verrekening in geld;

      8°. rente- en valutaswaps en swaps betreffende aan aandelen of aan een aandelenindex gekoppelde kasstromen, met
      inbegrip van gelijkwaardige instrumenten die gericht zijn op verrekening in geld;

      9°. opties ter verwerving of vervreemding van bovengenoemde instrumenten, met inbegrip van gelijkwaardige
      instrumenten die gericht zijn op verrekening in geld;

      d. gekwalificeerde deelneming: een rechtstreeks of middellijk belang van ten minste tien procent van het geplaatste
      aandelenkapitaal van een onderneming of instelling, of het rechtstreeks of middellijk kunnen uitoefenen ten
      minste tien procent van de stemrechten in een onderneming of instelling, of het rechtstreeks of middellijk kunnen
      uitoefenen van een daarmee vergelijkbare zeggenschap in een onderneming of instelling, waarbij bij het bepalen
      van het aantal stemrechten dat iemand in een onderneming of instelling heeft, tot diens stemrechten mede worden
      gerekend de stemrechten waarover hij beschikt of geacht wordt te beschikken op grond van artikel 12 van de Wet
      melding zeggenschap en kapitaalbelang in ter beurze genoteerde vennootschappen;

      e. gelieerde partij:

      1°. een rechtspersoon of natuurlijke persoon die met een beheerder, beleggingsmaatschappij of bewaarder of met een
      bestuurder van een beheerder, beleggingsmaatschappij of bewaarder in een groep is verbonden;

      2°. een rechtspersoon of natuurlijke persoon die direct of indirect stemrecht kan uitoefenen of anderszins bepaalde
      rechten kan uitoefenen waardoor invloed van betekenis kan worden uitgeoefend op het zakelijk of financieel beleid
      van een beheerder of beleggingsmaatschappij;

      3°. een natuurlijke persoon die in een familierechtelijke betrekking staat tot een bestuurder van een beheerder,
      beleggingsmaatschappij of bewaarder of tot een natuurlijke persoon als bedoeld onder 1° en 2°;

      4°. een natuurlijke persoon die een persoonlijke relatie heeft met een bestuurder van een beheerder,
      beleggingsmaatschappij of bewaarder of met een natuurlijke persoon als bedoeld onder 1° en 2°, in welke relatie hij
      het handelen van de bestuurder of de natuurlijke persoon met betrekking tot de beheerder, beleggingsmaatschappij of
      bewaarder kan beïnvloeden;

      5°. een rechtspersoon waarin een bestuurder van een beheerder, beleggingsmaatschappij of bewaarder of een
      natuurlijke persoon als bedoeld onder 3° en 4°, direct of indirect stemrecht kan uitoefenen of anderszins bepaalde
      rechten kan uitoefenen waardoor sprake is van invloed van betekenis op het zakelijk of financieel beleid van die
      rechtspersoon;

      6°. een natuurlijke persoon die toezicht houdt op het beleid en de algemene gang van zaken van een beheerder,
      beleggingsmaatschappij of bewaarder;

      f. gereglementeerde markt: een gereglementeerde markt in de zin van artikel 4, veertiende lid, van [richtlijn nr.
      2004/39/EG](32004L0039) van het Europees Parlement en de Raad van de Europese Unie van 30 april 2004 betreffende
      markten voor financiële instrumenten, tot wijziging van de [richtlijnen nr. 85/611/EEG](31985L0611) en [nr. 93/6/
      EEG](31993L0006) van de Raad en van [richtlijn nr. 2000/12/EG](32000L0012) van het Europees Parlement en de Raad en
      houdende intrekking van [richtlijn nr. 93/22/EEG](31993L0022) van de Raad (PbEU L 145);

      g. incourante beleggingen: beleggingen die niet worden verhandeld via een gereglementeerde markt, effectenbeurs of
      andere geregelde, regelmatig functionerende, erkende open markt;

      h. op- en afslagen: de bedragen waarmee de door de deelnemers voor rechten van deelneming in de
      beleggingsinstelling betaalde of ontvangen prijs of terugbetaling worden verhoogd onderscheidenlijk verlaagd ten
      opzichte van de intrinsieke waarde van de rechten van deelneming;

      i. retourprovisie: het gedeelte van een door of ten laste van een beleggingsinstelling voor een dienst van een
      derde te betalen of betaalde vergoeding dat direct of indirect door de ontvanger wordt terugbetaald;

      j. toezichthouder: Onze Minister dan wel de rechtspersoon of rechtspersonen waaraan ingevolge
      [artikel 29, eerste lid, van de wet][ref3] taken en bevoegdheden zijn overgedragen;

      k. wet: de [Wet toezicht beleggingsinstellingen][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
