  - number: '39'
    text: |-
      1 Een beheerder maakt een voorstel tot wijziging van de voorwaarden die gelden tussen een door hem beheerde
      beleggingsinstelling en de deelnemers bekend in een advertentie in een landelijk verspreid Nederlands dagblad of
      aan het adres van iedere deelnemer alsmede op zijn website. De beheerder licht het voorstel tot wijziging van de
      voorwaarden toe op zijn website. Gelijktijdig met de bekendmaking van het voorstel tot wijziging meldt de beheerder
      deze aan de toezichthouder.

      2 Een beheerder maakt een wijziging van de voorwaarden die gelden tussen een door hem beheerde beleggingsinstelling
      en de deelnemers bekend in een advertentie in een landelijk verspreid Nederlands dagblad of aan het adres van
      iedere deelnemer alsmede op zijn website. De beheerder licht de wijziging van de voorwaarden toe op zijn website.
      Gelijktijdig met de bekendmaking van de wijziging meldt de beheerder deze aan de toezichthouder.

      3 Indien door de wijziging van de voorwaarden, bedoeld in het tweede lid, rechten of zekerheden van de deelnemers
      worden verminderd of lasten aan de deelnemers worden opgelegd, wordt de wijziging tegenover de deelnemers niet
      ingeroepen voordat drie maanden zijn verstreken na de bekendmaking, bedoeld in het tweede lid, en kunnen de
      deelnemers binnen deze periode onder de gebruikelijke voorwaarden uittreden.

      4 Indien door de wijziging van de voorwaarden, bedoeld in het tweede lid, het beleggingsbeleid van de
      beleggingsinstelling wordt gewijzigd, wordt de wijziging niet ingevoerd voordat drie maanden zijn verstreken na
      de bekendmaking, bedoeld in het tweede lid, en kunnen de deelnemers binnen deze periode onder de gebruikelijke
      voorwaarden uittreden.
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel39
  - number: '40'
    text: |-
      1 Een beheerder heeft een website waarop hij in ieder geval de krachtens de [artikelen 42, derde lid][ref1],
      [44, tweede en vierde lid][ref2], en [49, eerste tot en met derde lid][ref3], door hem of de door hem beheerde
      beleggingsinstellingen verkrijgbaar te stellen of te verstrekken informatie publiceert.

      2 Een beheerder rangschikt informatie op de website, voorzover relevant, per afzonderlijke beleggingsinstelling.

      3 Een beheerder vermeldt het adres van de website in het prospectus, bedoeld in [artikel 41][ref4], en de
      halfjaarcijfers en het jaarverslag van de beheerder en de beleggingsinstelling.

      4 Indien een beheerder krachtens dit besluit beschikbaar te stellen of te verstrekken informatie op zijn website
      publiceert of anderszins in elektronische vorm beschikbaar stelt, vermeldt hij daarbij dat desgevraagd een
      afschrift van die informatie wordt verstrekt en, indien van toepassing, welke kosten daaraan verbonden zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0018622#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0018622#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0018622#Artikel49
      [ref4]: https://wetten.overheid.nl/BWBR0018622#Artikel41
