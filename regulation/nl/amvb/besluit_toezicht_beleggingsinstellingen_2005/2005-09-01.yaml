  - number: '81'
    text: |-
      1 Onze Minister kan, ter uitvoering van [artikel 17c, eerste lid, van de wet][ref1], een staat aanwijzen als staat
      waar het toezicht in voldoende mate waarborgen biedt ten aanzien van de belangen die de [wet][ref2] beoogt te
      beschermen indien:

      a. de in die staat geldende regels voor het aanbieden van rechten van deelneming in een beleggingsinstelling en het
      toezicht op de naleving daarvan gelijkwaardig zijn aan het bij of krachtens de [wet][ref3] bepaalde, met betrekking
      tot:

      1°. deskundigheid en betrouwbaarheid;

      2°. financiële waarborgen;

      3°. bedrijfsvoering, waaronder maatregelen gericht op het bevorderen en handhaven van een integere bedrijfsvoering;

      4°. aan de deelnemers in de beleggingsinstelling, de toezichthouder en aan het publiek te verstrekken informatie;
      en

      5°. waarborgen voor een adequaat toezicht op de naleving van de in die staat gestelde regels;

      b. de samenwerking tussen de toezichthouder en het bevoegde gezag in die staat is gewaarborgd; en

      c. voor het bevoegde gezag in die staat regels gelden die gelijkwaardig zijn aan die in de
      [artikelen 26 tot en met 27d van de wet][ref4].

      2 Indien Onze Minister een verzoek van een staat, om te beoordelen of in die staat in voldoende mate waarborgen
      worden geboden ten aanzien van de belangen die de [wet][ref5] beoogt te beschermen in behandeling neemt, vraagt
      Onze Minister advies aan de toezichthouder alvorens een besluit te nemen over het verzoek.

      3 Het advies aan Onze Minister heeft betrekking op de vraag of de regels in de betrokken staat en het toezicht
      dat op de naleving daarvan wordt uitgeoefend in de betrokken staat gelijkwaardig zijn aan het bij en krachtens de
      [artikelen 5][ref6] en [12 van de wet][ref7] bepaalde.

      4 Onze Minister verschaft de toezichthouder alle informatie en middelen die nodig zijn om een advies te geven over
      het verzoek van de desbetreffende staat.

      5 Onze Minister stelt als voorwaarde bij het toewijzen van het verzoek dat de betrokken staat Onze Minister in
      kennis stelt van wijzigingen in de regels en in het toezicht op de naleving van de regels, bedoeld in het eerste
      lid.

      6 Onze Minister verzoekt de toezichthouder in voorkomend geval om aanvullend advies.

      7 Onze Minister kan indien daartoe aanleiding is de aanwijzing tot staat waar het toezicht in voldoende mate
      waarborgen biedt intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel17c
      [ref2]: https://wetten.overheid.nl/BWBR0004809
      [ref3]: https://wetten.overheid.nl/BWBR0004809
