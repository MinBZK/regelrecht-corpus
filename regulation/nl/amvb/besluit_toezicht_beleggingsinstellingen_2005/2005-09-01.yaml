  - number: '62'
    text: |-
      1 In afwijking van [artikel 61, eerste lid][ref1], kan het beheerde vermogen van een beleggingsinstelling tot
      ten hoogste vijfentwintig procent worden belegd in obligaties die worden uitgegeven door een kredietinstelling
      die haar zetel heeft in een lidstaat en die ingevolge de wet van die lidstaat is onderworpen aan een bijzonder
      overheidstoezicht met het oog op de bescherming van de houders van deze obligaties voor zover de opbrengst van
      die obligaties overeenkomstig de wet van die lidstaat belegd wordt in activa die gedurende de gehele looptijd van
      de obligaties voldoende dekking bieden voor de daaruit voortvloeiende verplichtingen en die bij een in gebreke
      blijven van de uitgevende instelling bij voorrang bestemd zijn voor de aflossing van de hoofdsom en betaling van de
      opgebouwde rente.

      2 Indien het beheerde vermogen van een beleggingsinstelling voor meer dan vijf procent wordt belegd in obligaties
      als bedoeld in het eerste lid die door één instelling zijn uitgegeven, bedraagt de totale waarde van deze
      beleggingen niet meer dan tachtig procent van de activa van die uitgevende instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0018622#Artikel61
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel62
    references:
