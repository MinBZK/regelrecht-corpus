  - number: '65'
    text: |-
      1 In afwijking van [artikel 61, eerste lid][ref1], kan het beheerde vermogen van een beleggingsinstelling
      tot ten hoogste twintig procent worden belegd in financiële instrumenten als bedoeld in
      [artikel 1, onderdeel c, onder 1° en 2°][ref2], van één uitgevende instelling indien in het fondsreglement of
      de statuten van de beleggingsinstelling is bepaald dat het beleggingsbeleid van de beleggingsinstelling erop is
      gericht de samenstelling van een bepaalde aandelen- of obligatie-index te volgen, en deze index voldoet aan de
      volgende voorwaarden:

      a. de samenstelling van de index is gediversifieerd;

      b. de index is representatief voor de markt waarop hij betrekking heeft; en

      c. de index wordt op passende wijze bekendgemaakt.

      2 Indien uitzonderlijke marktomstandigheden daartoe aanleiding geven kan de toezichthouder bepalen dat de
      begrenzing bedoeld in het eerste lid wordt verhoogd tot vijfendertig procent.

      3 Onverminderd [artikel 36][ref3] vestigt de belegginginstelling, bedoeld in het eerste lid, in haar reclame-
      uitingen duidelijk de aandacht op haar beleggingsbeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0018622#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0018622#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0018622#Artikel36
