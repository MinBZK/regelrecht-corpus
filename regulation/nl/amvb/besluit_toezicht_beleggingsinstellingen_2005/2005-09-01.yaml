      1 Een beheerder, beleggingsinstelling of bewaarder stelt, voor zover
      [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1] niet reeds van toepassing is, jaarlijks
      een jaarrekening en een jaarverslag op en voegt daaraan de overige gegevens, bedoeld in
      [artikel 392 van Boek 2 van het Burgerlijk Wetboek][ref2], toe. Na afloop van de eerste helft van het boekjaar
      maakt de beheerder of de beleggingsinstelling tevens de halfjaarcijfers op.

      2 Voor zover een beheerder, beleggingsinstelling of bewaarder niet aan
      [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref3] is onderworpen, is deze titel van
      overeenkomstige toepassing op zijn onderscheidenlijk haar jaarrekening, overige gegevens bedoeld in
      [artikel 392 van Boek 2 van het Burgerlijk Wetboek][ref4] en jaarverslag, met uitzondering van [artikel 403][ref5]
      voor zover het een beheerder betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel392
      [ref3]: https://wetten.overheid.nl/BWBR0003045
