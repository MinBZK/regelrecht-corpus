  - number: '73'
    text: |-
      1 Onverminderd de [artikelen 43, tweede lid][ref1], [45, eerste lid][ref2], [46, eerste lid][ref3], en
      [47, eerste lid][ref4], bevatten de balans en winst- en verliesrekening van een beleggingsinstelling of de
      toelichtingen daarop de volgende gegevens:

      a. tegoeden bij kredietinstellingen;

      b. een onderscheid in de overzichten van de beleggingen, bedoeld in
      [artikel 45, eerste lid, onderdelen a en b][ref5], naar:

      1°. financiële instrumenten die zijn toegelaten tot de notering op een gereglementeerde markt;

      2°. financiële instrumenten die op effectenbeurzen of andere geregelde, regelmatig functionerende, erkende open
      markten worden verhandeld;

      3°. nieuw uitgegeven financiële instrumenten als bedoeld in [artikel 57, onderdeel c][ref6]; en

      4°. financiële instrumenten als bedoeld in [artikel 58, onderdeel a][ref7];

      c. een sluitend overzicht van de gesaldeerde mutaties in de verslagperiode in het eigen vermogen van de
      beleggingsmaatschappij of het beheerde vermogen van het beleggingsfonds ten gevolge van en uitgesplitst naar:

      1°. inkomsten uit beleggingen;

      2°. overige inkomsten;

      3°. belastingen;

      4°. de bestemming, of voorgestelde bestemming, van het netto-resultaat;

      5°. de vermeerdering of vermindering van het eigen vermogen van de beleggingsmaatschappij of van het beheerde
      vermogen van het beleggingsfonds;

      6°. meer- en minderwaarde op beleggingen; en

      7°. overige mutaties van de activa en passiva; en

      d. het bedrag van de verplichtingen onderscheiden naar soort aan het einde van het boekjaar
      die voortvloeien uit verrichtingen met betrekking tot financiële instrumenten als bedoeld in
      [artikel 1, onderdeel c, onder 6° tot en met 9°][ref8], en voorzover deze niet reeds in de balans en de winst- en
      verliesrekening zijn opgenomen.

      2 Onverminderd [artikel 48][ref9] neemt een beleggingsinstelling in de halfjaarcijfers de gegevens op, bedoeld in
      het eerste lid, onderdelen a en b, zoals deze luidden aan het einde van de eerste helft van het boekjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0018622#Artikel43
