  - number: '21'
    text: |-
      1 [Artikel 4][ref1] is van overeenkomstige toepassing op het eigen vermogen van beheerders en bewaarders.

      2 Indien het eigen vermogen van een beheerder of bewaarder niet voldoet aan [artikel 4][ref2] meldt de beheerder
      of de bewaarder dit onverwijld aan de toezichthouder en brengt hij het eigen vermogen binnen een door de
      toezichthouder te stellen termijn in overeenstemming met [artikel 4][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0018622#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0018622#Artikel4
