  - number: '66'
    text: |-
      1 Het beheerde vermogen van een beleggingsinstelling wordt tot ten hoogste twintig procent belegd in rechten van
      deelneming als bedoeld in [artikel 57, onderdeel d of e][ref1], die zijn uitgegeven door één beleggingsinstelling.

      2 De beleggingen in rechten van deelneming in beleggingsinstellingen als bedoeld in
      [artikel 57, onderdeel e][ref2], bedragen in totaal niet meer dan dertig procent van het beheerde vermogen van
      de beleggingsinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0018622#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0018622#Artikel57
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel66
