  - number: '68'
    text: |-
      [Artikel 67][ref1] is niet van toepassing op het verwerven van onderscheidenlijk het beleggen in:

      a. financiële instrumenten als bedoeld in [artikel 1, onderdeel c, onder 1° tot en met 4°][ref2], die zijn
      uitgegeven of worden gegarandeerd door een lidstaat, een openbaar lichaam met verordenende bevoegdheid in een
      lidstaat, een staat die geen lidstaat is of een internationale organisatie waarin een of meer lidstaten deelnemen;

      b. aandelen in het kapitaal van een rechtspersoon, gevestigd in een staat die geen lidstaat is, die met
      inachtneming van de begrenzingen, bedoeld in de [artikelen 61][ref3], [62][ref4], [63, eerste lid][ref5],
      [64][ref6], [66][ref7] en [67][ref8], zijn vermogen in hoofdzaak belegt in financiële instrumenten als bedoeld
      in [artikel 1, onderdeel c, onder 1° tot en met 3°][ref9], van uitgevende instellingen, gevestigd in die staat,
      wanneer krachtens de wet van die staat een dergelijke deelneming voor de beleggingsinstelling de enige mogelijkheid
      is om in financiële instrumenten als bedoeld in [artikel 1, onderdeel c, onder 1° tot en met 3°][ref10], van
      uitgevende instellingen in die staat te beleggen;

      c. aandelen in het kapitaal van een dochteronderneming van de beleggingsmaatschappij die uitsluitend ten behoeve
      van de beleggingsmaatschappij bepaalde beheers-, advies- of verhandelingswerkzaamheden verricht in de staat waar de
      dochteronderneming is gevestigd, met het oog op de inkoop van rechten van deelneming op verzoek van deelnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0018622#Artikel67
