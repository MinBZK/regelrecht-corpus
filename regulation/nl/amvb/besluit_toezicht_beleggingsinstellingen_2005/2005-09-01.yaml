  - number: '48'
    text: |-
      1 De halfjaarcijfers van een beleggingsinstelling bevatten ten minste de volgende gegevens:

      a. de balans en winst- en verliesrekening, alsmede een mutatie-overzicht van het eigen vermogen van de
      beleggingsmaatschappij of van het beheerde vermogen van het beleggingsfonds met inachtneming, voor zover de aard
      van deze stukken dat toelaat, van de bepalingen van [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1];

      b. een overzicht van de samenstelling van de activa van de beleggingsinstelling;

      c. een opgave van de intrinsieke waarde van de beleggingsinstelling en het aantal uitstaande rechten van deelneming
      en de intrinsieke waarde per recht van deelneming;

      d. indien van toepassing: de vermelding, bedoeld in [artikel 45, derde lid][ref2];

      e. indien van toepassing: een mededeling dat de rechten van deelneming op verzoek van de deelnemers ten laste van
      de activa direct of indirect worden ingekocht of terugbetaald en onder welke omstandigheden de beleggingsinstelling
      dat kan opschorten; en

      f. indien van toepassing: een mededeling dat de beleggingsinstelling interim-dividend heeft uitgekeerd of
      voornemens is dat te doen.

      2 De halfjaarcijfers van een beheerder bevatten ten minste de balans en winst- en verliesrekening, alsmede een
      mutatieoverzicht van het eigen vermogen met inachtneming, voor zover de aard van deze stukken dat toelaat, van de
      bepalingen van [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref3], met uitzondering van [artikel 403][ref4].

      3 Indien de halfjaarcijfers van de beheerder of de beleggingsinstelling door een accountant zijn onderzocht, wordt
      diens verklaring gevoegd bij de stukken die ingevolge [artikel 44, vierde lid][ref5], aan de toezichthouder worden
      gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0018622#Artikel45
