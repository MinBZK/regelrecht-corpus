  - number: '69'
    text: |-
      De toezichthouder verleent een beleggingsinstelling voor een periode van ten hoogste zes maanden na het aanbod
      van de rechten van deelneming, bedoeld in [artikel 42, eerste lid][ref1], op verzoek ontheffing van het bepaalde
      in de [artikelen 61 tot en met 66][ref2] indien de beleggingsinstelling de beginselen van risicospreiding in haar
      beleggingen in acht neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0018622#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0018622#Artikel61
