  - number: '64'
    text: |-
      1 De in de [artikelen 62][ref1] en [63, eerste lid][ref2], bedoelde financiële instrumenten worden niet in
      aanmerking genomen voor de toepassing van de in [artikel 61, derde lid][ref3], bedoelde begrenzing van veertig
      procent.

      2 De overeenkomstig de [artikelen 61][ref4], [62][ref5] en [63, eerste lid][ref6], verrichte
      beleggingen in door één instelling uitgegeven financiële instrumenten als bedoeld in
      [artikel 1, onderdeel c, 1° tot en met 4°][ref7], dan wel in deposito’s bij of financiële instrumenten als
      bedoeld in [artikel 1, onderdeel c, 6° tot en met 9°][ref8], van die instelling, bedragen in geen geval samen
      meer dan vijfendertig procent van het beheerde vermogen van de beleggingsinstelling.

      3 Voor de berekening van de in de [artikelen 61][ref9], [62][ref10] en [63, eerste lid][ref11], gestelde
      begrenzingen worden ondernemingen die tot een groep worden gerekend voor de opstelling van geconsolideerde
      jaarrekeningen, overeenkomstig de Zevende [richtlijn nr. 83/349/EEG](31983L0349) van de Raad van de
      Europese Gemeenschappen van 13 juni 1983 op de grondslag van artikel 54, lid 3, sub g) van het Verdrag
      betreffende de geconsolideerde jaarrekening (PbEG L 193), of andere erkende internationale financiële
      verslagleggingsregels, als één instelling beschouwd, met dien verstande dat de beleggingen, bedoeld in
      [artikel 61, eerste lid, eerste volzin][ref12], in de afzonderlijke ondernemingen die tot de groep behoren kunnen
      worden gecumuleerd tot ten hoogste twintig procent van het beheerde vermogen van de beleggingsinstelling.

      4 De activa van beleggingsinstellingen in wier rechten van deelneming de beleggingsinstelling belegt, worden voor
      het vaststellen van de in [artikelen 61][ref13], [62][ref14], [63, eerste lid][ref15], en 64 bedoelde begrenzingen
      niet opgeteld bij de beleggingen van de beleggingsinstelling.


