  - number: '49'
    text: |-
      1 Een beheerder verstrekt tegen ten hoogste de kostprijs desgevraagd aan een ieder:

      a. de gegevens omtrent de beheerder, de door hem beheerde beleggingsinstellingen en de bewaarders die aan de
      beleggingsinstellingen zijn verbonden welke ingevolge enig wettelijk voorschrift in het handelsregister moeten
      worden opgenomen; en

      b. de overeenkomst, bedoeld in [artikel 9][ref1] of [artikel 18][ref2].

      2 Een beheerder legt een afschrift van zijn vergunning kosteloos ter inzage voor de deelnemers in de
      beleggingsinstelling en verstrekt tegen ten hoogste de kostprijs desgevraagd een afschrift aan de deelnemers. De
      beheerder verstrekt tevens tegen ten hoogste de kostprijs desgevraagd aan de deelnemers in de beleggingsinstelling
      een afschrift van een ingevolge [artikel 12, vierde lid, van de wet][ref3], door de toezichthouder genomen besluit
      met betrekking tot de door de hem beheerde beleggingsinstellingen.

      3 Een beheerder stelt ten behoeve van de deelnemers in de beleggingsinstelling maandelijks een opgave met
      toelichting van de hierna te noemen gegevens op, waarbij tussen de tijdstippen van opstelling een periode van ten
      minste een week ligt. De opgave is, indien van toepassing, mede door de bewaarder ondertekend en bevat ten minste
      de volgende gegevens:

      a. de totale waarde van de beleggingen van de beleggingsinstelling;

      b. een overzicht van de samenstelling van de beleggingen;

      c. het aantal uitstaande rechten van deelneming;

      d. voor zover het betreft een beleggingsinstelling waarvan de rechten van deelneming op verzoek van de deelnemers
      ten laste van de activa direct of indirect worden ingekocht of terugbetaald: de meest recente intrinsieke waarde
      van de rechten van deelneming.

      De beheerder verstrekt tegen ten hoogste de kostprijs desgevraagd een afschrift van de opgave aan de deelnemers in
      de beleggingsinstelling.

      4 Een beleggingsinstelling deelt desgevraagd aan een ieder de intrinsieke waarde van de rechten van deelneming
      mee. De intrinsieke waarde wordt bepaald op het meest recente moment van in- en uittreden van deelnemers in de
      beleggingsinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0018622#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0018622#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0004809#Artikel12
