  - number: '75'
    text: |-
      De [artikelen 17][ref1] en [18][ref2] zijn van overeenkomstige toepassing op beheerders, beleggingsmaatschappijen
      en bewaarders.


      [ref1]: https://wetten.overheid.nl/BWBR0018622#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0018622#Artikel18
