  - number: '42'
    text: |-
      1 Twee weken voorafgaand aan het aanbod van rechten van deelneming verstrekt een beheerder aan de
      toezichthouder ten behoeve van opname van de beleggingsinstelling in het register als bedoeld in
      [artikel 18, eerste lid, onderdeel b, van de wet][ref1] de volgende gegevens:

      a. naam en adres van de beheerder;

      b. naam en adres van de beleggingsinstelling;

      c. indien van toepassing: naam en adres van de personen, bedoeld in [artikel 20, tweede en derde lid][ref2];

      d. naam en adres van de eventuele bewaarder;

      e. met betrekking tot de eventuele bewaarder: naam en adres van de personen, bedoeld in [artikel 3][ref3];

      f. wijze van in- en verkoop van deelnemingsrechten;

      g. een beschrijving van het beleggingsbeleid van de beleggingsinstelling;

      h. eventuele notering op een gereglementeerde markt;

      i. beoogde datum van aanbod van deelnemingsrechten; en

      j. indien het een beleggingsfonds als bedoeld in [artikel 6, eerste lid, van de wet][ref4] betreft: het
      fondsreglement.

      2 De beheerder meldt een wijziging van de gegevens, bedoeld in het eerste lid, met uitzondering van onderdeel g,
      twee weken voorafgaand aan de wijziging aan de toezichthouder.

      3 Een beheerder stelt bij aanbod van de rechten van deelneming dan wel bij de schriftelijke aankondiging dat een
      aanbod zal worden gedaan een prospectus als bedoeld in [artikel 41][ref5], het fondsreglement of de statuten van
      de belegginginstelling en, voor zover openbaargemaakt, de jaarrekening van de beleggingsinstelling over de twee
      voorafgaande jaren kosteloos algemeen verkrijgbaar. In iedere bekendmaking waarin rechten van deelneming worden
      aangeboden, worden de plaatsen vermeld waar het prospectus voor het publiek verkrijgbaar is.

      4 Het derde lid is niet van toepassing ten aanzien van beleggingsinstellingen die ter zake van het aanbieden van
      rechten van deelneming voldoen aan [artikel 3, eerste lid, van de Wet toezicht effectenverkeer 1995][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel18
