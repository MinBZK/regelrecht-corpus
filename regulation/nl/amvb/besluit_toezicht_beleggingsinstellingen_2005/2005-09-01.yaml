  - number: '17'
    text: |-
      1 Indien de beleggingsmaatschappij wordt beheerd door een beheerder heeft de beheerder zijn zetel in Nederland.

      2 Indien de rechten van deelneming van de beleggingsmaatschappij zijn toegelaten tot de notering op een
      gereglementeerde markt, effectenbeurs of een andere geregelde, regelmatig functionerende, erkende open markt en
      door haar uitsluitend op die gereglementeerde markten, effectenbeurzen of andere markten worden verhandeld, is
      de beleggingsmaatschappij niet gehouden haar activa bij een bewaarder in bewaring te geven. De statuten van de
      beleggingsmaatschappij vermelden in dat geval de methoden voor de berekening van de intrinsieke waarde van die
      rechten.

      3 De beleggingsmaatschappij is ook niet gehouden haar activa bij een bewaarder in bewaring te geven indien haar
      rechten van deelneming voor ten minste tachtig procent op een in de statuten vermelde gereglementeerde markt,
      effectenbeurs of een geregelde, regelmatig functionerende, erkende open markt worden verhandeld en:

      a. de belangen van de deelnemers in de beleggingsmaatschappij worden beschermd op een wijze die gelijkwaardig is
      aan de bescherming uit hoofde van de [wet][ref1] en dit besluit;

      b. de rechten van deelneming zijn toegelaten tot de notering op een gereglementeerde markt of een andere geregelde,
      regelmatig functionerende, erkende open markt van de lidstaat waar zij verhandeld worden;

      c. de door de beleggingsmaatschappij buiten de gereglementeerde markt, effectenbeurs of een andere geregelde,
      regelmatig functionerende, erkende open markt om verrichte transacties in haar rechten van deelneming slechts tegen
      beurskoers plaatsvinden;

      d. de statuten de gereglementeerde markt, effectenbeurs of een andere geregelde, regelmatig functionerende, erkende
      open markt vermelden waarvan de notering de prijs bepaalt voor de transacties die door de beleggingsmaatschappij in
      de staat waar die gereglementeerde markt, effectenbeurs of een andere geregelde, regelmatig functionerende, erkende
      open markt gelegen is, buiten de gereglementeerde markt of een andere geregelde, regelmatig functionerende, erkende
      open markt om worden verricht; en

      e. de statuten de methoden voor de berekening van de intrinsieke waarde van de rechten van deelneming vermelden.


      [ref1]: https://wetten.overheid.nl/BWBR0004809
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004809
  - number: '18'
    text: |-
      Onverminderd [artikel 9, tweede lid][ref1], bepaalt een overeenkomst tussen de beheerder en een bewaarder dat de
      bewaarder:

      a. zich ervan vergewist dat de emissie, verkoop, inkoop en intrekking van alsmede terugbetaling op rechten
      van deelneming voor rekening van de beleggingsinstelling, overeenkomstig de [wet][ref2] of de statuten of het
      fondsreglement van de beleggingsinstelling geschieden;

      b. zich ervan vergewist dat bij transacties met betrekking tot de activa van de beleggingsinstelling de
      tegenprestatie binnen de gebruikelijke termijnen wordt voldaan;

      c. zich ervan vergewist dat de opbrengsten van de beleggingsinstelling een bestemming krijgen in overeenstemming
      met de [wet][ref3] of de statuten of het fondsreglement van de beleggingsinstelling;

      d. zich ervan vergewist dat de waarde van de rechten van deelneming wordt berekend overeenkomstig de statuten of
      het fondsreglement van de beleggingsinstelling; en

      e. de aanwijzingen van de beheerder dient uit te voeren, tenzij deze in strijd zijn met de [wet][ref4] of de
      statuten of het fondsreglement van de beleggingsinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0018622#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004809
      [ref3]: https://wetten.overheid.nl/BWBR0004809
      [ref4]: https://wetten.overheid.nl/BWBR0004809
