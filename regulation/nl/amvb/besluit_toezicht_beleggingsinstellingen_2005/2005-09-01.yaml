        artikel: '9'
        paragraaf: II
  - number: '29'
    text: |-
      1 Een beheerder of bewaarder handelt overeenkomstig de in [artikel 8][ref1] bedoelde beschrijving van de
      administratieve organisatie en het systeem van interne controle en de door de toezichthouder op grond van het
      [vierde lid van dat artikel][ref2] gestelde regels.

      2 De administratieve organisatie en het systeem van interne controle worden regelmatig geëvalueerd en zonodig
      geactualiseerd.

      3 Een beheerder of bewaarder verstrekt op verzoek aan de toezichthouder een actuele versie van de beschrijving van
      de administratieve organisatie en het systeem van interne controle.


      [ref1]: https://wetten.overheid.nl/BWBR0018622#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0018622#Artikel8
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0018622
        artikel: '8'
        paragraaf: II
      - id: ref2
        bwb_id: BWBR0018622
        artikel: '8'
        paragraaf: II
  - number: '30'
    text: |-
      1 Een beheerder, beleggingsinstelling of bewaarder voert een beleid ter zake van het tegengaan van verstrengeling
      van tegenstrijdige belangen. Dit beleid vindt zijn neerslag in organisatorische en administratieve procedures en
      maatregelen.

      2 De toezichthouder kan regels stellen met betrekking tot de voorwaarden waaraan het beleid en de procedures en
      maatregelen, bedoeld in het eerste lid, moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel30
  - number: '31'
    text: |-
      1 Een beheerder, beleggingsinstelling of bewaarder voert een beleid dat ertoe strekt dat:

      a. de betrokkenheid van de beheerder, de beleggingsinstelling of de bewaarder en hun werknemers bij strafbare
      feiten die het vertrouwen in de beheerder, de beleggingsinstelling, de bewaarder of in de financiële markten
      schaden, wordt voorkomen;

      b. de betrokkenheid van de beheerder, de beleggingsinstelling of de bewaarder en hun werknemers bij handelingen die
      anderszins in het maatschappelijk verkeer zodanig onaanvaardbaar zijn dat deze het vertrouwen in de beheerder, de
      beleggingsinstelling, de bewaarder of in de financiële markten schaden, wordt voorkomen;

      c. niet wegens de deelnemers in de beleggingsinstelling het vertrouwen in de beheerder, de beleggingsinstelling, de
      bewaarder of de financiële markten wordt geschaad.

      2 Het in het eerste lid bedoelde beleid vindt zijn neerslag in organisatorische en administratieve procedures en
      maatregelen. Deze procedures en maatregelen omvatten in ieder geval:

      a. de behandeling en administratieve vastlegging van incidenten die een ernstig gevaar vormen voor een integere
      bedrijfsvoering van de beheerder, de beleggingsinstelling of van de bewaarder voor zover het betreft een gedraging
      van een personeelslid of van een persoon die het dagelijks beleid bepaalt dan wel mede bepaalt, de houder van een
      gekwalificeerde deelneming of van een natuurlijk persoon of rechtspersoon die werkzaamheden verricht ten behoeve
      van de beheerder, de beleggingsinstelling of de bewaarder;

      b. de beoordeling, met het oog op de belangen van deelnemers of potentiële deelnemers in de beleggingsinstelling,
      of de betrouwbaarheid van een personeelslid dat de beheerder, de beleggingsmaatschappij of de bewaarder voornemens
      is te benoemen in een integriteitsgevoelige functie, buiten twijfel staat. Onder integriteitsgevoelige functie
      wordt in dit verband verstaan:

      1°. een leidinggevende functie onder directe verantwoordelijkheid van de bepalers of medebepalers van het dagelijks
      beleid van de beheerder, de beleggingsmaatschappij of de bewaarder;

      2°. een functie waaraan overigens een bevoegdheid is verbonden die een wezenlijk risico bevat voor de integere
      bedrijfsvoering van de beheerder, de beleggingsmaatschappij of van de bewaarder.

      3 De toezichthouder kan regels stellen met betrekking tot de voorwaarden waaraan het beleid en de organisatorische
      en administratieve procedures en maatregelen, bedoeld in het eerste en tweede lid, moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel31
  - number: '32'
    text: |-
      1 Een beheerder of bewaarder onderzoekt, op verzoek van de toezichthouder, of in de administratie van de door hem
      beheerde beleggingsinstellingen onderscheidenlijk de beleggingsinstellingen waarvan hij de activa beheert bepaalde
      personen of instellingen voorkomen die naar het oordeel van Onze Minister, in verband met vermoede terroristische
      activiteiten of daarmee verband houdende activiteiten, de integriteit van de financiële sector kunnen schaden.

      2 De beheerder, de beleggingsmaatschappij of de bewaarder verstrekt de uitkomst van het in het eerste en tweede lid
      bedoelde onderzoek, binnen een door de toezichthouder vast te stellen termijn, aan de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel32
  - number: '33'
    text: |-
      De toezichthouder kan regels stellen met betrekking tot door een beheerder of bewaarder aan de toezichthouder, ten
      behoeve van het toezicht op de naleving van het bij en krachtens de [artikelen 30 tot en met 32][ref1] bepaalde, te
      verstrekken gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0018622#Artikel30
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0018622
        artikel: '30'
        paragraaf: IV
  - number: '34'
    text: |-
      Ten minste een maal per jaar voert een onafhankelijke deskundige de waardering van de incourante beleggingen van de
      beleggingsinstelling uit.
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel34
  - number: '35'
    text: |-
      Een beleggingsinstelling bepaalt telkens wanneer zij haar rechten van deelneming emitteert, verkoopt, inkoopt
      of daarop terugbetaalt de intrinsieke waarde van de rechten van deelneming en publiceert de intrinsieke waarde
      onverwijld op de website van haar beheerder, onder vermelding van het moment waarop de bepaling van de intrinsieke
      waarde plaatsvond.
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel35
  - number: '36'
    text: |-
      1 Een reclame-uiting over een beheerder of een beleggingsinstelling is inhoudelijk juist en niet misleidend.

      2 In een reclame-uiting worden in ieder geval vermeld:

      a. de naam van de beheerder of de beleggingsinstelling;

      b. het feit dat het een beheerder of een beleggingsinstelling betreft;

      c. dat de beheerder of de beleggingsinstelling is geregistreerd bij de toezichthouder; en

      d. waar het prospectus, bedoeld in [artikel 41][ref1], voor het publiek verkrijgbaar is.

      3 Het tweede lid, onderdelen c en d, is niet van toepassing op reclame-uitingen op radio en televisie.

      4 De toezichthouder kan nadere regels stellen met betrekking tot het eerste of tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0018622#Artikel41
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0018622
        artikel: '41'
        paragraaf: IV
  - number: '37'
    text: |-
      1 De onderwerpen, bedoeld in [artikel 12, zevende lid, van de wet][ref1], zijn:

      a. het accountantsverslag aan de bestuurders en de raad van commissarissen;

      b. de managementletter;

      c. correspondentie tussen de accountant en de beheerder en de beleggingsmaatschappij die rechtstreeks betrekking
      heeft op de accountantsverklaring bij de jaarrekening van de beheerder of de beleggingsinstelling.

      2 Indien de accountant, bedoeld in [artikel 12, zevende lid, van de wet][ref2], schriftelijk inlichtingen verstrekt
      aan de toezichthouder over de in het voorgaande lid genoemde onderwerpen, zendt hij onverwijld aan de beheerder een
      afschrift van de stukken en van de begeleidende brief.

      3 De managementletter, bedoeld in het eerste lid, onderdeel b, bevat in ieder geval:

      a. een verklaring van de accountant of en zo ja, in hoeverre hij de administratieve organisatie en het systeem van
      interne controle heeft beoordeeld; en

      b. de belangrijkste bevindingen van de accountant naar aanleiding van zijn werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel12
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel37
