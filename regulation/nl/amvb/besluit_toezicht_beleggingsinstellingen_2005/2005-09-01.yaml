        artikel: '12'
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '12'
  - number: '38'
    text: |-
      1 Een beheerder meldt een voorgenomen wijziging van of aanvulling op onderdelen van het registratiedocument,
      bedoeld in [artikel 11][ref1], voor zover het betreft de gegevens, bedoeld in [bijlage A][ref2], aan de
      toezichthouder. Deze wijzigingen of aanvullingen, met uitzondering van wijzigingen van of aanvullingen op gegevens
      als bedoeld in [onderdeel 3.3 of 3.6 van bijlage A][ref3], worden niet ingevoerd voordat de toezichthouder zijn
      instemming heeft verleend.

      2 Indien de voorgenomen wijziging of aanvulling betrekking heeft op de vermelding van een persoon als bedoeld in
      [artikel 3][ref4] verstrekt de beheerder gegevens en bescheiden op basis waarvan de toezichthouder kan beoordelen
      of wordt voldaan aan [artikel 3][ref5]. Indien de toezichthouder een derde verzoekt om nadere inlichtingen over de
      in de eerste volzin bedoelde persoon, doet hij daarvan mededeling aan de beheerder.

      3 Instemming wordt geacht te zijn verkregen indien de toezichthouder niet heeft beslist ten aanzien van de
      wijziging of aanvulling binnen vier weken na ontvangst van de melding of, indien hij daarom heeft verzocht, binnen
      vier weken na ontvangst van nadere inlichtingen.

      4 In afwijking van het derde lid wordt instemming met een wijziging of aanvulling als bedoeld in het tweede lid
      geacht te zijn verkregen indien de toezichthouder niet heeft beslist ten aanzien van de wijziging of aanvulling
      binnen zes weken na ontvangst van de melding of zes weken na mededeling aan de beheerder van de ontvangst van de in
      het tweede lid bedoelde inlichtingen.

      5 De toezichthouder kan de instemming, bedoeld in het derde lid, intrekken indien zich omstandigheden voordoen
      of feiten bekend worden op grond waarvan, zo zij zich hadden voorgedaan of bekend waren geweest voor het tijdstip
      waarop de instemming is verleend, de toezichthouder tot een ander oordeel zou zijn gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0018622#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0018622
      [ref3]: https://wetten.overheid.nl/BWBR0018622
      [ref4]: https://wetten.overheid.nl/BWBR0018622#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0018622#Artikel3
