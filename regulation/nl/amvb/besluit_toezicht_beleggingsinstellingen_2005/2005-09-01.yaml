  - number: '41'
    text: |-
      1 Een beheerder heeft een prospectus beschikbaar over het aanbod van elke door hem beheerde beleggingsinstelling.

      2 Het prospectus bevat de gegevens die voor de beleggers noodzakelijk zijn om zich een verantwoord oordeel te
      kunnen vormen over het aanbod van de beleggingsinstelling en de daaraan verbonden kosten en risico’s.

      3 Het prospectus bevat ten minste het registratiedocument, bedoeld in [artikel 11][ref1], en de gegevens,
      vermeld in [bijlage B][ref2]. Tevens bevat het prospectus een verklaring van de beheerder dat hijzelf, de
      beleggingsinstelling en, indien van toepassing, de bewaarder voldoen aan de bij of krachtens de [wet][ref3]
      gestelde regels en dat het prospectus voldoet aan de bij of krachtens dit besluit gesteld regels.

      4 Het prospectus bevat een mededeling van een accountant, onder vermelding van zijn naam en kantooradres, dat het
      prospectus de ingevolge de [wet][ref4] vereiste gegevens bevat.

      5 In het prospectus worden in afzonderlijke paragrafen de gegevens opgenomen over:

      a. de kosten van de beleggingsinstelling en de wijze waarop zij ten laste komen van het resultaat van de
      beleggingsinstelling in mindering worden gebracht op het beheerde vermogen of anderszins direct of indirect ten
      laste komen van de deelnemers in de beleggingsinstelling, en

      b. de aan de beleggingsinstelling verbonden risico’s.

      6 De toezichthouder stelt regels met betrekking tot de wijze waarop in het prospectus inzicht wordt verschaft in
      het niveau van de kosten van de beleggingsinstelling en de daaraan ten grondslag liggende berekening. Voorts kan de
      toezichthouder nadere regels stellen met betrekking tot de wijze waarop en de vorm waarin de gegevens, bedoeld in
      [bijlage B][ref5], worden opgenomen in het prospectus.

      7 Een beheerder actualiseert de gegevens die in het prospectus zijn opgenomen zodra daartoe aanleiding bestaat.

      8 De toezichthouder kan verlangen dat het prospectus in een of meer door de toezichthouder te bepalen talen
      beschikbaar wordt gesteld indien dat, gelet op de voorgenomen verspreiding van het prospectus, noodzakelijk is voor
      een adequate informatieverschaffing aan het publiek.

      9 Dit artikel is niet van toepassing ten aanzien van beleggingsinstellingen die ter zake van het aanbieden van
      rechten van deelneming voldoen aan [artikel 3, eerste lid, van de Wet toezicht effectenverkeer 1995][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0018622#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0018622
      [ref3]: https://wetten.overheid.nl/BWBR0004809
      [ref4]: https://wetten.overheid.nl/BWBR0004809
      [ref5]: https://wetten.overheid.nl/BWBR0018622
      [ref6]: https://wetten.overheid.nl/BWBR0007657#Artikel3
