  - number: '58'
    text: |-
      In afwijking van [artikel 57][ref1] kan het beheerde vermogen van een beleggingsinstelling:

      a. voor ten hoogste tien procent worden belegd in financiële instrumenten als bedoeld in
      [artikel 1, onderdeel c, onder 1° tot en met 4°][ref2], die niet zijn toegelaten tot of worden verhandeld op een
      gereglementeerde markt, effectenbeurs of andere geregelde, regelmatig functionerende, open en erkende markt;

      b. indien het een beleggingsmaatschappij betreft: worden belegd in goederen die rechtstreeks noodzakelijk zijn voor
      de uitoefening van haar werkzaamheid;

      c. worden aangehouden in accessoir liquide middelen.


      [ref1]: https://wetten.overheid.nl/BWBR0018622#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0018622#Artikel1
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel58
