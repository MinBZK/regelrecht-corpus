  - number: '59'
    text: |-
      Het beheerde vermogen van een beleggingsinstelling wordt niet belegd in edele metalen dan wel in certificaten die
      deze metalen vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel59
  - number: '60'
    text: |-
      1 De risicobeheersingprocedure, bedoeld in [artikel 8, derde lid, onderdeel i][ref1],
      bevat een procedure voor de waardevaststelling van financiële instrumenten als bedoeld in
      [artikel 1, onderdeel c, onder 6° tot en met 9°][ref2], die buiten een gereglementeerde markt, effectenbeurs,
      of andere geregelde, regelmatig functionerende, erkende open markt worden verhandeld. De beleggingsinstelling
      doet de toezichthouder regelmatig mededeling van de tot haar activa behorende soorten financiële instrumenten als
      bedoeld in [artikel 1, onderdeel c, onder 6° tot en met 9°][ref3], de onderliggende risico’s, de kwantitatieve
      begrenzingen en de methodes die zijn gekozen om de aan transacties in deze financiële instrumenten verbonden
      risico’s te ramen.

      2 Het totale risico van een beleggingsinstelling bedraagt niet meer dan tweemaal de totale nettowaarde van
      de activa. Het totale risico van een beleggingsinstelling wordt met niet meer dan tien procent van de totale
      nettowaarde van haar portefeuille vergroot door het aangaan van kortlopende leningen, in welk geval het totale
      risico van de beleggingsinstelling niet meer dan 210 procent bedraagt van de totale nettowaarde van haar
      portefeuille.

      3 Het totale risico van de beleggingsinstelling in financiële instrumenten als bedoeld in
      [artikel 1, onderdeel c, onder 6° tot en met 9°][ref4], overschrijdt niet de totale nettowaarde van de activa.
      Voor de berekening van het risico worden de dagwaarde van de onderliggende activa, het tegenpartijrisico,
      toekomstige marktbewegingen en de voor de liquidatie van de posities beschikbare tijd in aanmerking genomen.

      4 Het beheerde vermogen van een beleggingsinstelling kan in het kader van het beleggingsbeleid en binnen
      de in [artikel 64][ref5] gestelde begrenzingen worden belegd in financiële instrumenten als bedoeld in
      [artikel 1, onderdeel c, onder 6° tot en met 9°][ref6], voor zover het risico met betrekking tot de onderliggende
      activa in totaal niet de in de [artikelen 61][ref7], [62][ref8], [63, eerste lid][ref9], en [64][ref10] gestelde
      begrenzingen overschrijdt. Indien het beheerde vermogen van de beleggingsinstelling in op een index gebaseerde
      financiële instrumenten als bedoeld in [artikel 1, onderdeel c, onder 6° tot en met 9°][ref11], wordt belegd,
      worden die beleggingen voor de toepassing van de in de [artikelen 61][ref12], [62][ref13], [63, eerste lid][ref14],
      en [64][ref15] gestelde begrenzingen bepaalde bovengrens niet samengeteld.

      5 Onverminderd [artikel 36][ref16] vestigt een beleggingsinstelling die voornamelijk belegt in financiële
      instrumenten als bedoeld in [artikel 1, onderdeel c, onder 6° tot en met 9°][ref17], in haar reclame-uitingen
      duidelijk de aandacht op haar beleggingsbeleid.

      6 De toezichthouder kan regels stellen met betrekking tot de berekening van het risico, de wijze van vaststelling
      van de dagwaarde van de onderliggende activa, de soorten verplichtingen die leiden tot een tegenpartijrisico, het
      meewegen van toekomstige marktbewegingen bij de vaststelling en de methodes die mede afhankelijk van de aard van
      het financiële instrument waarin wordt belegd, voor berekening van de risico’s kunnen worden gehanteerd.


