  - number: '79'
    text: |-
      Een beleggingsinstelling die belegt in rechten van deelneming in andere beleggingsinstellingen die door haar
      beheerder worden beheerd of door een beheerder waarmee haar beheerder in een groep is verbonden, brengt geen
      kosten in rekening voor inschrijving of aflossing ten aanzien van de rechten van deelneming in die andere
      beleggingsinstellingen.
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel79
  - number: '80'
    text: |-
      [Artikel 36][ref1] is van overeenkomstige toepassing op beheerders als bedoeld in
      [artikel 17a, eerste lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018622#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel17a
