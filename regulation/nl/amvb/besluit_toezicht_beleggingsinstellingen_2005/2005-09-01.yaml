  - number: '67'
    text: |-
      1 Een beheerder verwerft, voor de door hem beheerde beleggingsinstellingen als bedoeld in
      [artikel 6, eerste lid, van de wet][ref1] gezamenlijk, niet meer dan twintig procent van de aandelen met stemrecht
      in één uitgevende instelling.

      2 Het beheerde vermogen van een beleggingsinstelling wordt niet belegd in meer dan:

      a. tien procent van de financiële instrumenten, bedoeld in [artikel 1, onderdeel c, onder 1°][ref2], zonder
      stemrecht van één uitgevende instelling;

      b. tien procent van de financiële instrumenten, bedoeld in [artikel 1, onderdeel c, onder 2°][ref3], van één
      uitgevende instelling;

      c. vijfentwintig procent van de financiële instrumenten, bedoeld in [artikel 1, onderdeel c, onder 5°][ref4], van
      dezelfde beleggingsinstelling; of

      d. tien procent van de financiële instrumenten, bedoeld in [artikel 1, onderdeel c, onder 4°][ref5], van één
      uitgevende instelling.

      3 De in onderdelen b, c en d van het tweede lid genoemde begrenzingen hoeven niet in acht te worden genomen indien
      de brutowaarde van de financiële instrumenten, bedoeld in [artikel 1, onderdeel c, onder 2° of 4°][ref6], of de
      nettowaarde van de financiële instrumenten, bedoeld in [artikel 1, onderdeel c, onder 5º][ref7], op het tijdstip
      van verwerving, niet kan worden berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
