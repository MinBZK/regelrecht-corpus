  - number: '44'
    text: |-
      1 Jaarlijks binnen vier maanden na afloop van het boekjaar maakt een beheerder, beleggingsinstelling of
      bewaarder de vastgestelde jaarrekening of, indien de vaststelling niet behoeft plaats te vinden of nog niet heeft
      plaatsgevonden, de opgemaakte jaarrekening gelijktijdig met het jaarverslag en de overige gegevens, bedoeld in
      [artikel 392 van Boek 2 van het Burgerlijk Wetboek][ref1], openbaar.

      2 De openbaarmaking geschiedt overeenkomstig de bepalingen van
      [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref2]. Een beheerder stelt de jaarrekening, de overige gegevens,
      bedoeld in [artikel 392 van Boek 2 van het Burgerlijk Wetboek][ref3], en het jaarverslag van de beheerder, de
      beleggingsinstelling en de bewaarder voor de deelnemers in de beleggingsinstelling kosteloos verkrijgbaar.

      3 Gelijktijdig met de openbaarmaking van de jaarrekeningen, bedoeld in het eerste lid, doet de beheerder in een of
      meer landelijk verspreide Nederlandse dagbladen dan wel aan het adres van iedere deelnemer, opgave van de plaats
      waar de jaarrekening, alsmede het jaarverslag en de overige gegevens van de beheerder, de beleggingsinstelling
      en de bewaarder voor de deelnemers in de beleggingsinstelling kosteloos verkrijgbaar zijn. Gelijktijdig met de
      openbaarmaking zendt de beheerder een afschrift van deze stukken aan de toezichthouder.

      4 Jaarlijks binnen negen weken na afloop van de eerste helft van het boekjaar, maakt een beheerder of een
      beleggingsinstelling overeenkomstig het derde lid zijn onderscheidenlijk haar halfjaarcijfers openbaar. De
      beheerder stelt deze voor de deelnemers in de beleggingsinstelling kosteloos verkrijgbaar. Gelijktijdig met
      de openbaarmaking zendt de beheerder een afschrift van zijn halfjaarcijfers en van de halfjaarcijfers van de
      beleggingsinstelling aan de toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel392
      [ref2]: https://wetten.overheid.nl/BWBR0003045
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel392
