  - number: '19'
    text: |-
      Deze paragraaf is uitsluitend van toepassing op beheerders, beleggingsinstellingen en bewaarders
      als bedoeld in [artikel 12, eerste lid, van de wet][ref1] en accountants als bedoeld in
      [artikel 12, zevende lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel12
