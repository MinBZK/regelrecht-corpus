  - number: '50'
    text: |-
      1 Een beheerder, beleggingsmaatschappij of bewaarder behoort niet tot een groep waarbinnen de formele of feitelijke
      zeggenschapsstructuur in zodanige mate ondoorzichtig is dat deze een belemmering vormt of kan vormen voor het
      adequaat uitoefenen van toezicht op de beheerder, de beleggingsinstellingen of de bewaarder.

      2 Een beheerder, beleggingsmaatschappij of bewaarder is niet in een groep verbonden met een natuurlijke
      persoon of een rechtspersoon indien het recht van een staat die geen lidstaat is, dat op die persoon van
      toepassing is een belemmering vormt of kan vormen voor het adequaat uitoefenen van toezicht op de beheerder, de
      beleggingsinstellingen of de bewaarder.
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel50
