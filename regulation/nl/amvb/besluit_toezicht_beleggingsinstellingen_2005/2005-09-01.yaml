        artikel: '18'
        paragraaf: III
  - number: '76'
    text: |-
      Indien een beheerder opdracht verleent aan een derde om een of meer werkzaamheden in het kader van het beheer van
      een door hem beheerde beleggingsinstelling te verrichten, is onverminderd [artikel 27][ref1] met betrekking tot die
      opdracht het volgende van toepassing:

      a. indien de opdrachtverlening het uitvoeren van het beleggingsbeleid betreft, geschiedt dit uitsluitend aan een
      opdrachtnemer waaraan voor het beheer van beleggingsinstellingen of voor individueel vermogensbeheer een vergunning
      of erkenning is verleend en die aan prudentieel toezicht is onderworpen;

      b. bij opdrachtverlening aan een opdrachtnemer uit een staat die geen lidstaat of niet is aangewezen op grond van
      [artikel 17c, eerste lid, van de wet][ref2], is de samenwerking tussen de toezichthouder en het bevoegde gezag in
      de staat van de zetel van de opdrachtnemer op grond van een overeenkomst gewaarborgd; en

      c. de belangen van de opdrachtnemer zijn niet strijdig met die van de beheerder, de bewaarder of de deelnemers in
      de beleggingsinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0018622#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel17c
    url: https://wetten.overheid.nl/BWBR0018622/2005-09-01#Artikel76
