  - number: '46'
    text: |-
      1 Onverminderd de [artikelen 43, tweede lid][ref1], en [45, eerste lid][ref2], bevat de toelichting op de balans en
      de winst- en verliesrekening van een beleggingsinstelling de volgende gegevens:

      a. voor zover van toepassing: de kosten van oprichting van de beleggingsinstelling, de wijze waarop deze kosten ten
      laste zijn gekomen van het resultaat, in mindering zijn gebracht op het beheerde vermogen of anderszins ten laste
      zijn gekomen van de deelnemers in de beleggingsinstelling en welk gedeelte ten goede is gekomen aan de beheerder,
      de bewaarder, de bestuurders van de beheerder, beleggingsmaatschappij of bewaarder, of aan met de beheerder,
      beleggingsmaatschappij of bewaarder gelieerde partijen;

      b. de naar soort onderscheiden kosten gemoeid met:

      1°. het beheer van de beleggingsinstelling;

      2°. de bewaring van activa van de beleggingsinstelling;

      3°. de accountant;

      4°. het toezicht op de beleggingsinstelling; en

      5°. de marketing, inclusief de berekeningsgrondslag, en de wijze waarop deze kosten ten laste zijn gekomen van
      het resultaat, in mindering zijn gebracht op het beheerde vermogen of anderszins ten laste zijn gekomen van de
      deelnemers in de beleggingsinstelling;

      c. de transactiekosten die geïdentificeerd en gekwantificeerd kunnen worden en de wijze waarop deze kosten ten
      laste zijn gekomen van het resultaat, in mindering zijn gebracht op het beheerde vermogen of anderszins ten laste
      zijn gekomen van de deelnemers in de beleggingsinstelling;

      d. indien van toepassing: de kosten die zijn gemaakt of vergoedingen die zijn gevraagd in verband met het in-
      en uitlenen van financiële instrumenten en de wijze waarop deze kosten ten laste zijn gekomen van het resultaat,
      in mindering zijn gebracht op het beheerde vermogen of anderszins ten laste zijn gekomen van de deelnemers in de
      beleggingsinstelling onderscheidenlijk aan wie deze vergoedingen ten goede zijn gekomen;

      e. indien van toepassing: de kosten voor het verlenen van opdrachten aan derden om een of meer werkzaamheden in
      het kader van het beheer van de beleggingsinstelling of de bewaring van de activa van de beleggingsinstelling te
      verrichten en de wijze waarop deze kosten ten laste zijn gekomen van het resultaat, in mindering zijn gebracht op
      het beheerde vermogen of anderszins ten laste zijn gekomen van de deelnemers in de beleggingsinstelling;

      f. het totaal betaalde bedrag aan vergoedingen voor het aanbrengen van deelnemers indien dit bedrag hoger is dan
      één tiende procent van het gemiddelde beheerde vermogen van de beleggingsinstelling, de wijze waarop dit bedrag
      ten laste is gekomen van het resultaat, in mindering is gebracht op het beheerde vermogen of anderszins ten laste
      is gekomen van de deelnemers in de beleggingsinstelling en, indien van toepassing, de namen van met de beheerder,
      beleggingsmaatschappij of bewaarder gelieerde partijen aan wie deze aanbrengprovisies ten goede zijn gekomen;

      g. alle andere dan in onderdeel a tot en met f bedoelde naar soort onderscheiden kosten die hoger zijn dan tien
      procent van de totale kosten, inclusief de berekeningsgrondslag, en de wijze waarop deze kosten ten laste zijn
      gekomen van het resultaat, in mindering zijn gebracht op het beheerde vermogen of anderszins ten laste zijn gekomen
      van de deelnemers in de beleggingsinstelling;

      h. de wijze waarop de op- en afslagen zijn berekend, aan wie de op- en afslagen ten goede zijn gekomen en, voor
      zover van toepassing, de wijze waarop zij zijn verwerkt in de jaarrekening;

      i. de overige eenmalige kosten die deelnemers in de beleggingsinstelling betalen bij in- en uittreding, inclusief
      de berekeningsgrondslag;

      j. een vergelijkend overzicht van de naar soort onderscheiden volgens het prospectus, bedoeld in
      [artikel 41][ref3], te maken kosten en de daadwerkelijk gemaakte kosten;

      k. de naar soort onderscheiden kosten die voortvloeien uit directe of indirecte beleggingen in andere
      beleggingsinstellingen;

      l. het niveau van de kosten van de beleggingsinstelling gerelateerd aan haar gemiddelde intrinsieke waarde,
      onder vermelding van de kosten die daarbij buiten beschouwing zijn gelaten; indien de beleggingsinstelling
      gemiddeld tien procent of meer van haar vermogen direct of indirect in andere beleggingsinstellingen belegt,
      worden de kosten van de andere beleggingsinstellingen meegenomen bij het bepalen van het niveau van de kosten
      van de beleggingsinstelling of wordt vermeld dat en waarom het niet mogelijk is de kosten van een andere
      beleggingsinstelling mee te nemen, alsmede dat de kosten van de betreffende andere beleggingsinstelling van invloed
      zijn op het resultaat van de beleggingsinstelling;

      m. indien de beleggingsinstelling 99 procent van het beheerde vermogen belegt in een andere beleggingsinstelling:
      het niveau van de kosten van de andere beleggingsinstelling gerelateerd aan de gemiddelde intrinsieke waarde van de
      andere beleggingstelling, onder vermelding van de kosten die daarbij buiten beschouwing zijn gelaten;

      n. indien van toepassing: de retourprovisies die niet ten goede zijn gekomen aan de beleggingsinstelling en aan wie
      deze retourprovisies ten goede zijn gekomen;

      o. indien van toepassing: de door de beheerder, de bestuurders van de beheerder, beleggingsmaatschappij of
      bewaarder, de bewaarder, de met de beheerder, beleggingsmaatschappij of bewaarder gelieerde partijen of derden
      voor het uitvoeren van opdrachten ten behoeve van de beleggingsinstelling ontvangen of in het vooruitzicht gestelde
      goederen; en

      p. de omloopsnelheid van de activa en een vergelijking met de in het voorgaande boekjaar gerealiseerde
      omloopsnelheid van de activa.

      2 Indien de beleggingsinstelling ten minste 95 procent van het beheerde vermogen indirect belegt in een andere
      beleggingsinstelling is het eerste lid, aanhef en onderdeel m, van overeenkomstige toepassing met betrekking tot
      die andere beleggingsinstelling.

      3 Het eerste lid, onderdeel p, is niet van toepassing op beleggingsinstellingen die uitsluitend of vrijwel
      uitsluitend beleggen in onroerend goed.

      4 De toezichthouder stelt regels met betrekking tot de wijze waarop inzicht wordt verschaft in het niveau van
      de kosten van de beleggingsinstelling, bedoeld in het eerste lid, onderdelen l en m, en de daaraan ten grondslag
      liggende berekening en de wijze van berekening van de omloopsnelheid van de activa, bedoeld in het eerste lid,
      onderdeel p.

      5 Onverminderd [artikel 43, tweede lid][ref4], bevat de toelichting op de balans en de winst en verliesrekening van
      een beheerder ten minste de volgende gegevens:

      a. indien van toepassing: de door de beheerder of de bestuurders van de beheerder ontvangen retourprovisies;

      b. indien van toepassing: de door de beheerder of de bestuurders van de beheerder voor het uitvoeren van
      opdrachten ten behoeve van de beheerder of de door de beheerder beheerde beleggingsinstellingen ontvangen of in het
      vooruitzicht gestelde goederen; en

      c. de vergoedingen die zijn ontvangen in verband met het in- en uitlenen van financiële instrumenten van de door de
      beheerder beheerde beleggingsinstellingen.

      6 De in het eerste en vijfde lid bedoelde gegevens worden cijfermatig en tekstueel toegelicht.

      7 In de toelichting op de balans en de winst- en verliesrekening van de beheerder en de beleggingsinstelling worden
      de in het vijfde onderscheidenlijk het eerste lid bedoelde gegevens in één paragraaf opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0018622#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0018622#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0018622#Artikel41
      [ref4]: https://wetten.overheid.nl/BWBR0018622#Artikel43
