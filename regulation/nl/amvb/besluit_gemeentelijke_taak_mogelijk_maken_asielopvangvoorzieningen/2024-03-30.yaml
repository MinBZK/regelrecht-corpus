  - number: '2.1'
    text: |-
      1 Onze Minister stelt op basis van de Meerjaren Productie Prognose en het capaciteitsbesluit van het COA vast
      wat de capaciteitsraming is. Deze capaciteitsraming gaat uit van de verwachte behoefte aan opvangplaatsen voor
      asielzoekers in een bij ministeriële regeling te bepalen periode of op een in zodanige regeling te bepalen datum.

      2 De provinciale opvangopgave is de optelsom van de indicatieve verdelingen per gemeente in de provincie.

      3 De indicatieve verdeling per gemeente is de uitkomst, rekenkundig afgerond op een geheel getal, van de volgende
      formulereeks:

      (SES-WOA + 1)*iG/In = Wf

      BO*Wf/TWf = Iv

      in welke formule voorstelt:

      a. SES-WOA: weergave van de sociaaleconomische status op gemeenteniveau (SESWOA-score per gemeente van het Centraal
      Bureau voor de Statistiek;

      b. BO: de door Onze Minister van Justitie en Veiligheid vastgestelde behoefte aan opvangplaatsen bedoeld in het
      eerste lid;

      c. iG: het aantal inwoners van de gemeente volgens de meest recente door het Centraal Bureau voor de Statistiek
      vastgestelde bevolkingscijfers;

      d. In: het aantal inwoners van Nederland volgens de meest recente door het Centraal Bureau voor de Statistiek
      vastgestelde bevolkingscijfers;

      e. Wf: de wegingsfactor per gemeente;

      f. TWf: de totale wegingsfactor die wordt berekend door alle wegingsfactors van de gemeenten (Wf) bij elkaar op
      te tellen;

      g. Iv: de indicatieve verdeling per gemeente, bedoeld in [artikel 3 van de wet][ref1].

      4 Onze Minister maakt de capaciteitsraming, de provinciale opvangopgaven en de indicatieve verdelingen per gemeente
      voor 1 februari bekend door middel van een publicatie in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0049307#Artikel3
