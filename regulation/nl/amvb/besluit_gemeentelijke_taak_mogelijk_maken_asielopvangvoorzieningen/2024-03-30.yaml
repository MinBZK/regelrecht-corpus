  - number: '2.2'
    text: |-
      1 Onze Minister neemt in de indicatieve verdeling per gemeente op hoeveel van de aan te bieden opvangplaatsen
      geschikt moeten zijn voor de opvang van alleenstaande minderjarige vreemdelingen. De totale geraamde landelijke
      behoefte aan opvangplaatsen voor alleenstaande minderjarige vreemdelingen wordt indicatief over de gemeenten
      verdeeld op basis van de verdeling als bedoeld in [artikel 2.1, derde lid][ref1], waarbij BO in de formule de
      totale geraamde landelijke behoefte aan opvangplaatsen voor alleenstaande minderjarige vreemdelingen voorstelt.
      De provinciale opvangopgave van alleenstaande minderjarige vreemdelingen wordt vastgesteld conform het bepaalde in
      artikel 2.1, tweede lid.

      2 Onze Minister kan uitsluitend in de provinciale opvangopgave opnemen dat wordt voorzien in een
      aanmeldvoorziening, indien acht is geslagen op een evenwichtige spreiding over het grondgebied van Nederland door
      rekening te houden met de omvang van de in [artikel 2.1, tweede lid][ref2], bedoelde provinciale opvangopgaven.

      3 Bij regeling van Onze Minister kunnen nadere regels worden gesteld over de verdeling van opvangplaatsen van
      bijzondere aard.


      [ref1]: https://wetten.overheid.nl/BWBR0049310#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0049310#Artikel2.1
