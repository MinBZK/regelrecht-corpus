  - number: '6.1'
    text: |-
      De [Wet gemeentelijke taak mogelijk maken asielopvangvoorzieningen][ref1] en dit besluit treden in werking met
      ingang van de dag na de datum van uitgifte van het Staatsblad waarin dit besluit wordt geplaatst, met uitzondering
      van [artikel 5.1][ref2] van dit besluit, dat twee maanden na de datum van uitgifte van het Staatsblad waarin dit
      besluit wordt geplaatst in werking treedt.


