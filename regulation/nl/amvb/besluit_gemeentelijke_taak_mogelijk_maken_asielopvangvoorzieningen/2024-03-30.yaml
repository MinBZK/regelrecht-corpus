  - number: '3.2'
    text: >-
      1 Gemeenten kunnen in aanmerking komen voor een uitkering voor duurzame opvangplaatsen voor zover het aantal
      opvangplaatsen hoger is dan een bij ministeriële regeling te bepalen aantal.


      2 Bij ministeriële regeling wordt de hoogte van de uitkering bepaald.
    url: https://wetten.overheid.nl/BWBR0049310/2024-03-30#Artikel3.2
  - number: '4.1'
    text: |-
      1 Het college kan een opvangvoorziening exploiteren wanneer kan worden voorzien in de materiële en immateriële
      opvang van asielzoekers.

      2 Bij ministeriële regeling kunnen regels worden gesteld ten aanzien van:

      a. de materiële en immateriële opvang, bedoeld in het eerste lid;

      b. het uitsluiten van exploitatie, bedoeld in het eerste lid, van bepaalde opvangvoorzieningen met opvangplaatsen
      van bijzondere aard;

      c. het faciliteren van de taken die voortvloeien uit de [Vreemdelingenwet 2000][ref1], de
      [Wet Centraal orgaan opvang asielzoekers][ref2] of uit Unierechtelijke verplichtingen; of

      d. de inzet van derde partijen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823
      [ref2]: https://wetten.overheid.nl/BWBR0006685
