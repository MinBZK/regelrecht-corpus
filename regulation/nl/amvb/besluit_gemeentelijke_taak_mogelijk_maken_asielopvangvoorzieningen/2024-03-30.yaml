articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      - *aanmeldvoorziening:* een voorziening waar asielzoekers opgevangen worden ten behoeve van activiteiten/
      werkzaamheden in het kader van het aanmeldproces;
      - *capaciteitsraming:* de verwachte landelijke behoefte aan opvangplaatsen waaraan in de twee volgende jaren
      behoefte zal zijn, bedoeld in [artikel 2, eerste lid, van de wet][ref1];
      - *duurzame opvangplaatsen:* opvangplaatsen die voor minimaal vijf jaar beschikbaar zijn;
      - *opvangplaatsen van bijzondere aard:* alle opvangplaatsen waarbij een bijzondere vorm van begeleiding en opvang
      noodzakelijk is vanwege de individuele kenmerken van de asielzoeker of de fase van het asiel- of vertrekproces;
      - *uitkering:* de specifieke uitkering, bedoeld in [artikel 15a van de Financiële-verhoudingswet][ref2], voor
      duurzame opvangplaatsen op grond van [artikel 9, tweede lid, onder b, van de wet][ref3];
      - *wet:* [Wet gemeentelijke taak mogelijk maken asielopvangvoorzieningen][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0049307#Artikel2
