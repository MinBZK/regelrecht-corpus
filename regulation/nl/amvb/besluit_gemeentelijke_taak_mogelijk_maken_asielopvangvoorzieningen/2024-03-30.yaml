  - number: '3.1'
    text: |-
      1 Voor duurzame reguliere opvangvoorzieningen als bedoeld in [artikel 2, derde lid, van de wet][ref1] geldt
      een minimale omvang van honderd opvangplaatsen. Deze opvangplaatsen mogen verspreid worden over meerdere
      opvangvoorzieningen binnen de gemeente.

      2 Voor duurzame bijzondere opvangvoorzieningen als bedoeld in [artikel 2, derde lid, van de wet][ref2] geldt
      een minimale omvang van zestien opvangplaatsen. Deze opvangplaatsen mogen verspreid worden over meerdere
      opvangvoorzieningen binnen de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0049307#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0049307#Artikel2
