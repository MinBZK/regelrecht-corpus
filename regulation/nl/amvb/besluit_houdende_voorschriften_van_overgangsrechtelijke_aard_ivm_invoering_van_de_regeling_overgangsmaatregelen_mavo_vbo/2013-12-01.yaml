  - number: '8'
    text: |-
      Voor het eerste schooljaar waarin toepassing wordt gegeven aan [artikel VI van de wet][ref1], geldt bij de
      controle van de telling van anderstalige leerlingen, in afwijking van de regeling administratie leerlinggegevens
      WVO (Uitleg OCenW-Regelingen 1995, nr. 29), voor de groep anderstalige leerlingen op grond waarvan het in
      [artikel 7, vierde lid][ref2], bedoelde aantal formatieplaatsen is berekend, dat de school of scholengemeenschap,
      bedoeld in [artikel 2, tweede lid, onderdeel c][ref3], moet voldoen aan de voorschriften, vastgesteld bij of
      krachtens [deel II van de WVO][ref4] zoals die luidden op 31 juli voorafgaand aan de bedoelde toepassing.


