  - number: '12'
    text: |-
      Indien toepassing wordt gegeven aan [artikel II][ref1], [IV][ref2], [V][ref3], [VI][ref4] of
      [VIII van de wet][ref5], behoudt het personeel dat:

      a. op de dag voorafgaand aan het tijdstip met ingang waarvan de bedoelde toepassing wordt gegeven, was verbonden
      aan de desbetreffende school of afdeling voor svo, en

      b. met ingang van het bedoelde tijdstip wordt verbonden aan de desbetreffende school voor mavo, voor vbo, of
      voor praktijkonderwijs, dan wel aan een orgaan als bedoeld in [artikel VI van de wet][ref6], zijn aanspraak op
      salariëring volgens het carrièrepatroon conform de schaal die gold voor de functie op de dag voorafgaand aan het
      bedoelde tijdstip.


