  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van de Staatssecretaris van Onderwijs, Cultuur en Wetenschappen, drs. K. Y. I. J. Adelmund, van 10
    november 1998, nr. 1998/46958 (3721), directie Wetgeving en Juridische Zaken, gedaan mede namens Onze Minister van
    Landbouw, Natuurbeheer en Visserij;


    Gelet op deartikelen VI, derde lid, VIII, tweede lid, XV en XVI, eerste lid, van de Wet van 25 mei 1998 (Stb. 337)
    tot wijziging van onder meer de Wet op het voortgezet onderwijs in verband met de invoering van leerwegen in de
    hogere leerjaren van het middelbaar algemeen voortgezet onderwijs en het voorbereidend beroepsonderwijs, alsmede
    van leerwegondersteunend en praktijkonderwijs (regeling leerwegen mavo en vbo ; invoering leerwegondersteunend
    en praktijkonderwijs);


    De Raad van State gehoord (advies van 17 december 1998, nr. W05.98 0519);


    Gezien het nader rapport van de Staatssecretaris van Onderwijs, Cultuur en Wetenschappen, K. Y. I. J. Adelmund,
    van 19 januari 1999, nr. 1998/54973(3721), directie Wetgeving en Juridische Zaken, uitgebracht mede namens Onze
    Minister van Landbouw, Natuurbeheer en Visserij;


    Hebben goedgevonden en verstaan:
