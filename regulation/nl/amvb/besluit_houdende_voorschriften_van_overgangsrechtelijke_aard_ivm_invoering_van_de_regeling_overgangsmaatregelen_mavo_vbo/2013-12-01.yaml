    text: |-
      1 Het bevoegd gezag van een school voor svo-lom of afdeling voor svo-lom zendt een mededeling als bedoeld in
      [artikel VI, eerste lid, van de wet][ref1] dat ten aanzien van die school of afdeling met ingang van het schooljaar
      1999–2000 toepassing wordt gegeven aan genoemd artikel, uiterlijk 1 maart 1999, aan Onze Minister van Onderwijs,
      Cultuur en Wetenschappen. De eerste volzin is van overeenkomstige toepassing op de schooljaren 2000–2001, 2001–
      2002 en 2002–2003, met dien verstande dat de mededeling uiterlijk 1 december 1999, uiterlijk 1 december 2000
      onderscheidenlijk uiterlijk 1 december 2001 aan Onze Minister van Onderwijs, Cultuur en Wetenschappen wordt
      gezonden.

      2 De mededeling bevat, naast de informatie, bedoeld in [artikel VI, tweede lid, van de wet][ref2] de volgende
      informatie:

      a. met ingang van welk schooljaar toepassing wordt gegeven aan[ artikel VI van de wet][ref3],

      b. van de school of afdeling voor svo-lom het BRIN-nummer, de naam, het adres en de vestigingsplaats,

      c. van elk van de scholen voor mavo en vbo en de scholengemeenschappen, bedoeld in
      [artikel VI, eerste lid, onderdeel b, van de wet][ref4]:

      1°. het BRIN-nummer, de naam, het adres en de vestigingsplaats,

      2°. het aantal leerlingen van het totaal aantal leerlingen dat als werkelijk schoolgaand aan de school of afdeling,
      bedoeld in onderdeel b, was ingeschreven op 1 oktober van het eerste schooljaar voorafgaand aan het schooljaar
      waarin toepassing wordt gegeven aan [artikel VI van de wet][ref5], dat administratief is toebedeeld aan de school
      of scholengemeenschap,

      3°. het aantal anderstalige leerlingen van het totaal aantal leerlingen, bedoeld onder 2°, dat administratief is
      toebedeeld aan de school of scholengemeenschap,

      d. aan welke school of scholengemeenschap van de scholen en scholengemeenschappen, bedoeld in onderdeel c, de
      vergoeding in verband met de vermeerdering, bedoeld in [artikel 5][ref6], en het overgangsbudget en de aanvullende
      personele vergoeding, bedoeld in [artikel 6][ref7], dient te worden toegekend.

      3 De in het tweede lid, onderdeel c, bedoelde administratieve toedeling is éénmalig.


