    text: |-
      1 Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst, met uitzondering van [artikel 12][ref1].

      2 [Artikel 12][ref2] treedt in werking met ingang van een bij koninklijk besluit te bepalen tijdstip. Laatstbedoeld
      besluit wordt niet genomen dan nadat vier weken zijn verstreken nadat het onderhavige besluit, voor zover
      betrekking hebbend op [artikel 12][ref3], is overgelegd aan de beide kamers der Staten-Generaal en gedurende die
      termijn niet door of namens een van beide kamers de wens wordt te kennen gegeven dat het in [artikel 12][ref4]
      geregelde onderwerp bij de wet wordt geregeld.


