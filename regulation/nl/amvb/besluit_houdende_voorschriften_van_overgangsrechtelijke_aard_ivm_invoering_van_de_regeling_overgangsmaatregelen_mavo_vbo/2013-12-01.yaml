  - number: '4'
    text: |-
      1 Voor het eerste schooljaar waarin toepassing wordt gegeven aan [artikel VI van de wet][ref1], wordt het
      aantal leerlingen op grond waarvan de formatie wordt berekend van de school voor mavo, de school voor vbo of de
      scholengemeenschap, bedoeld in [artikel 2, tweede lid, onderdeel c][ref2], met inachtneming van de volgende leden
      berekend en vastgesteld.

      2 Ten behoeve van de personeelscategorieën directie en onderwijsondersteunend personeel wordt het aantal leerlingen
      dat in [artikel 6, derde lid, van het Formatiebesluit WVO][ref3] wordt aangeduid met Lt-1, verhoogd met het aantal
      leerlingen, bedoeld in [artikel 2, tweede lid, onderdeel c, onder 2°][ref4].

      3 Ten behoeve van de personeelscategorie leraren wordt het aantal leerlingen dat op 1 oktober van het schooljaar
      voorafgaand aan het schooljaar waarin toepassing wordt gegeven aan [artikel VI van de wet][ref5], als werkelijk
      schoolgaand ten behoeve van het volgen van leerwegondersteunend onderwijs was ingeschreven aan de school, bedoeld
      in [artikel 2, tweede lid, onderdeel c][ref6], verhoogd met het eerstbedoelde aantal leerlingen, bedoeld in
      [artikel 2, tweede lid, onderdeel c, onder 2°][ref7].

      4 Het aantal leerlingen dat in [artikel 6, derde lid, van het Formatiebesluit WVO][ref8] wordt aangeduid met Lt-
      2, wordt verhoogd met het aantal leerlingen dat als werkelijk schoolgaand aan de school of afdeling, bedoeld in
      [artikel 2, tweede lid, onderdeel b][ref9], was ingeschreven op 1 oktober van het tweede schooljaar voorafgaand aan
      het schooljaar waarin toepassing wordt gegeven aan [artikel VI van de wet](onbekend).

      5 Indien sprake is van toedeling van een gedeelte van het aantal leerlingen, bedoeld in het vierde lid, geschiedt
      de in dat lid bedoelde vaststelling van het aantal leerlingen ten behoeve van de formatieberekening met het
      overeenkomende gedeelte van het in dat lid bedoelde aantal leerlingen. Het bedoelde gedeelte wordt vastgesteld op
      basis van de volgende berekening:

      a. het aantal leerlingen, bedoeld in [artikel 2, tweede lid, onderdeel c, onder 2°][ref10],
      dat administratief is toebedeeld, wordt gedeeld door het totaal aantal leerlingen, bedoeld in
      [artikel 2, tweede lid, onderdeel c, onder 2°][ref11],

      b. de breuk, voortkomend uit de onder a bedoelde deling, wordt vermenigvuldigd met het aantal leerlingen dat
      als werkelijk schoolgaand aan de school of afdeling, bedoeld in [artikel 2, tweede lid, onderdeel b][ref12], was
      ingeschreven op 1 oktober van het tweede schooljaar voorafgaand aan het schooljaar waarin toepassing wordt gegeven
      aan [artikel VI van de wet][ref13], en

      c. de uitkomst van de onder b bedoelde vermenigvuldiging wordt afgerond op een geheel getal, waarbij dat getal met
      1 wordt verhoogd indien de eerste decimaal 5 of hoger is.


