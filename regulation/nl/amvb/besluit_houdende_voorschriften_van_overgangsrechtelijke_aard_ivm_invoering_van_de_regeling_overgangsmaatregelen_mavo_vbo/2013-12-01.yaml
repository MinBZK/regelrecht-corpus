  - number: '3'
    text: |-
      Indien het bevoegd gezag van een school voor svo-lom of afdeling voor svo-lom ten aanzien van die school of
      afdeling de mededeling, bedoeld in [artikel VI, eerste lid, van de wet][ref1], doet, wordt met ingang van
      het schooljaar waarop de mededeling betrekking heeft, een zodanige openbare school of afdeling opgeheven
      dan wel wordt de aanspraak op bekostiging van een zodanige bijzondere school of afdeling beëindigd.
      [Artikel 265, vierde lid, van de WVO][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009638#ArtikelVI
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel265
