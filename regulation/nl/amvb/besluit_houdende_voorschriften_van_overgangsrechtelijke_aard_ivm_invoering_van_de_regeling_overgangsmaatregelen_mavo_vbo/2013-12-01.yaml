  - number: '7'
    text: |-
      1 Voor het eerste schooljaar waarin toepassing wordt gegeven aan [artikel VI van de wet][ref1], wordt de formatie
      van de school voor mavo, de school voor vbo of de scholengemeenschap verhoogd, indien sprake is van toedeling van
      anderstalige leerlingen als bedoeld in [artikel 2, tweede lid, onderdeel c, onder 3°][ref2]. De verhoging wordt
      met inachtneming van de volgende leden berekend en vastgesteld.

      2 Met toepassing van [artikel 22b van het Formatiebesluit WEC][ref3] wordt het aantal formatierekeneenheden
      vastgesteld ten behoeve van het onderwijs aan anderstalige leerlingen van de school of afdeling voor svo-lom,
      indien ten aanzien van deze school of afdeling in het desbetreffende schooljaar geen toepassing zou worden gegeven
      aan [artikel VI van de wet][ref4].

      3 Het aantal formatierekeneenheden, bedoeld in het tweede lid, wordt verdeeld over de scholen voor mavo en vbo en
      de scholengemeenschappen, bedoeld in [artikel 2, tweede lid, onderdeel c][ref5]. De verdeling wordt vastgesteld op
      basis van de volgende berekening:

      a. het aantal anderstalige leerlingen, bedoeld in [artikel 2, tweede lid, onderdeel c, onder 3°][ref6], wordt
      gedeeld door het aantal anderstalige leerlingen dat deel uitmaakt van het totaal aantal leerlingen, bedoeld in
      [artikel 2, tweede lid, onderdeel c, onder 2°][ref7],

      b. de breuk, voortkomend uit de onder a bedoelde deling, wordt vermenigvuldigd met het aantal
      formatierekeneenheden, bedoeld in het tweede lid, en

      c. de uitkomst van de onder b bedoelde vermenigvuldiging wordt afgerond op een geheel getal, waarbij dat getal met
      1 wordt verhoogd indien de eerste decimaal 5 of hoger is.

      4 Het aantal formatieplaatsen wordt berekend door het aantal formatierekeneenheden dat de uitkomst is van de
      berekening, bedoeld in het derde lid:

      a. voor een scholengemeenschap voor (vwo)/havo/mavo/vbo te delen door de factor 216,

      b. voor een scholengemeenschap (vwo)/havo/mavo te delen door de factor 226,

      c. voor een school voor vbo of mavo, dan wel een scholengemeenschap voor vbo/mavo te delen door de factor 200.

      De uitkomst van de berekening wordt afgerond op vier decimalen, waarbij de vierde decimaal met 1 wordt verhoogd
      indien de vijfde decimaal 5 of hoger is.


