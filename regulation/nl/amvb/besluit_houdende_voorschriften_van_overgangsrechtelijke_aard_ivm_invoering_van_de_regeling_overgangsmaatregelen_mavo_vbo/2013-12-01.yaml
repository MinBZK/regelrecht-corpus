  - number: '5'
    text: |-
      Indien toepassing wordt gegeven aan [artikel VI van de wet][ref1], wordt van de school voor mavo of voor vbo of van
      de scholengemeenschap, bedoeld in [artikel 2, tweede lid, onderdeel d][ref2], het vaste aantal formatieplaatsen,
      genoemd in [artikel 2 van het Formatiebesluit WVO][ref3], vermeerderd. De vermeerdering is voor de verschillende
      schoolsoortgroepen als volgt:

      a. schoolsoortgroep 1: 2,26 formatieplaatsen,

      b. schoolsoortgroep 3: 0,31 formatieplaatsen,

      c. schoolsoortgroep 4: 1,15 formatieplaatsen.


      [ref1]: https://wetten.overheid.nl/BWBR0009638#ArtikelVI
