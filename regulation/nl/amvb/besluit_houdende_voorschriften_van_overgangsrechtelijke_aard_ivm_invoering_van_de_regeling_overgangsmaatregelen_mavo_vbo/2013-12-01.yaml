  - number: '6'
    text: |-
      1 Indien toepassing wordt gegeven aan [artikel VI van de wet][ref1], wordt ten behoeve van de vergoeding van de
      personeelskosten van een school of scholengemeenschap als bedoeld in [artikel 2, tweede lid, onderdeel d][ref2],
      een overgangsbudget en een aanvullende personele vergoeding berekend en vastgesteld.

      2 Op de berekening van het overgangsbudget is [paragraaf 4][ref3] en de daarbij behorende bijlage van de Regeling
      bekostiging, rechtspositie en samenvoeging leerwegondersteunend en praktijkonderwijs (Uitleg OCenW-Regelingen 1998,
      nr. 24) zoals luidend op 31 juli 2003, van overeenkomstige toepassing. Bij de berekening wordt wat betreft het
      aantal leerlingen van de school of afdeling voor svo-lom, uitgegaan van het aantal leerlingen dat als werkelijk
      schoolgaand aan de school of afdeling, bedoeld in [artikel 2, tweede lid, onderdeel b][ref4], was ingeschreven op
      1 oktober van het tweede en het derde schooljaar voorafgaand aan het schooljaar waarin toepassing wordt gegeven aan
      [artikel VI van de wet][ref5].

      3 De berekening van de aanvullende personele vergoeding geschiedt overeenkomstig artikel 23, tweede tot en met
      vierde lid, van de in het tweede lid genoemde regeling zoals luidend op 31 juli 2003.


