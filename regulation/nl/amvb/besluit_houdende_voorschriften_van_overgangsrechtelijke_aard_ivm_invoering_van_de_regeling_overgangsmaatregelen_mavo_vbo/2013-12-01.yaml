  - number: '9'
    text: |-
      1 Voor het eerste schooljaar waarin toepassing wordt gegeven aan [artikel VI van de wet][ref1], wordt de vergoeding
      voor de exploitatiekosten van de school voor mavo of vbo of de scholengemeenschap vastgesteld op basis van de som
      van de in de onderdelen a en b bedoelde vergoedingen:

      a. de vergoeding voor de kosten van de exploitatie die de school voor mavo of vbo of de scholengemeenschap zou
      hebben ontvangen voor het schooljaar, indien geen toepassing zou worden gegeven aan [artikel VI van de wet][ref2],
      en

      b. de vergoeding voor de kosten van de materiële instandhouding die de school of afdeling voor svo-lom op grond van
      [deel II van de WVO][ref3] zou hebben ontvangen voor het gehele kalenderjaar waarin toepassing wordt gegeven aan
      [artikel VI van de wet][ref4], indien geen toepassing zou worden gegeven aan [artikel VI van de wet][ref5].

      2 Indien sprake is van toedeling van een gedeelte van het totaal aantal leerlingen van de school of afdeling
      voor svo-lom, bedoeld in het eerste lid, onderdeel b, geschiedt de in het eerste lid bedoelde vaststelling
      van de vergoeding, door het bij de in het eerste lid, onderdeel b, bedoelde vergoeding behorende bedrag te
      vermenigvuldigen met de volgende breuk:

      a. het eerstbedoelde aantal leerlingen, bedoeld in [artikel 2, tweede lid, onderdeel c, onder 2°][ref6], gedeeld
      door

      b. het totaal aantal leerlingen dat als werkelijk schoolgaand aan de school of afdeling, bedoeld in het eerste
      lid, onderdeel b, was ingeschreven op 1 oktober van het eerste schooljaar voorafgaand aan het schooljaar waarin
      toepassing wordt gegeven aan [artikel VI van de wet][ref7].

      De uitkomst van de vermenigvuldiging wordt afgerond op twee decimalen, waarbij de tweede decimaal met 1 wordt
      verhoogd indien de derde decimaal 5 of hoger is.

      3 Het bij de in het eerste lid, onderdeel b, bedoelde vergoeding behorende bedrag dan wel het bedrag dat de
      uitkomst is van de in het tweede lid bedoelde berekening, wordt met ingang van het schooljaar waarin toepassing
      wordt gegeven aan [artikel VI van de wet][ref8], in verband met prijsontwikkelingen, verhoogd met het percentage
      voor de overige exploitatiekosten, dat voor dat schooljaar in de ministeriële regeling, bedoeld in artikel XV,
      derde lid, van de Wet van 27 februari 1992 (Stb. 112), is vastgesteld.


