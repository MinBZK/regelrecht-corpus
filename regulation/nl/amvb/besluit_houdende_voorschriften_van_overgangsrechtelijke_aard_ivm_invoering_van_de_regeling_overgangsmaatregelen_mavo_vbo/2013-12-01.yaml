    text: |-
      In dit besluit wordt, met uitzondering van [artikel 11][ref1], verstaan onder:

      wet: de
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      ________________________________________________________;

      WVO: de[ Wet op het voortgezet onderwijs][ref3];

      school voor svo-lom: een school voor speciaal voortgezet onderwijs, bezocht door kinderen met leer- en
      opvoedingsmoeilijkheden als bedoeld in [artikel III, eerste lid, van de wet][ref4];

      afdeling voor svo-lom: een afdeling voor speciaal voortgezet onderwijs, bezocht door kinderen met leer- en
      opvoedingsmoeilijkheden als bedoeld in [artikel III, eerste lid, van de wet][ref5];

      afdeling voor svo-mlk: een afdeling voor speciaal voortgezet onderwijs, bezocht door moeilijk lerende kinderen als
      bedoeld in [artikel VII, eerste lid, van de wet][ref6];

      school voor mavo: een school voor middelbaar algemeen voortgezet onderwijs;

      school voor vbo: een school voor voorbereidend beroepsonderwijs;

      scholengemeenschap: een scholengemeenschap waarvan ten minste deel uitmaakt een school voor mavo of een school
      voor vbo;

      school voor praktijkonderwijs: een school voor praktijkonderwijs als bedoeld in [artikel 10f van de WVO][ref7];

      schoolsoortgroep: een schoolsoortgroep als genoemd in de ministeriële regeling op grond
      van[ artikel 85, vijfde lid, van de WVO ][ref8](Uitleg OCenW-regelingen 1998, nr. 17b (VO/FB/1998/24968));

      anderstalige leerlingen: leerlingen met een niet-Nederlandse culturele achtergrond als bedoeld in
      [artikel 12 van het Formatiebesluit WVO][ref9];

      BRIN-nummer: het nummer waaronder een school staat geregistreerd in de Basisregistratie Instellingen.


