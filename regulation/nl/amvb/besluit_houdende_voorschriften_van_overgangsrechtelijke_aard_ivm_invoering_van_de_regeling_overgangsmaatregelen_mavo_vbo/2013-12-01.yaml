  - number: '10'
    text: |-
      Het aantal leerlingen, bedoeld in [artikel VIII, tweede lid, van de wet][ref1], is 75. Indien toepassing van
      de eerste volzin niet in overeenstemming is met een evenwichtig geheel van onderwijsvoorzieningen, kan Onze
      Minister van Onderwijs, Cultuur en Wetenschappen, in afwijking van de eerste volzin toepassing geven aan
      [artikel VIII, tweede lid, van de wet][ref2].


