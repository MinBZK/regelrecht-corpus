  - number: '4'
    text: De voorschriften in deze afdeling zijn van toepassing bij elk soort zicht.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel4
  - number: '5'
    text: |-
      Een schip moet te allen tijde door kijken en luisteren alsook door gebruik te maken van alle beschikbare middelen
      aangepast aan de heersende omstandigheden en toestanden, goede uitkijk houden zodat de omstandigheden en het gevaar
      voor aanvaring volledig kunnen worden beoordeeld.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel5
  - number: '6.1'
    text: |-
      Een schip moet te allen tijde een veilige vaart aanhouden zodat het juiste en doeltreffende maatregelen kan nemen
      ter vermijding van aanvaring en kan worden gestopt binnen een voor de heersende omstandigheden en toestanden
      aangepaste afstand. Bij de bepaling van een veilige vaart moet onder meer rekening worden gehouden met de volgende
      factoren:
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel6
  - number: 6.1.a
    text: 'door alle schepen:'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel6
  - number: 6.1.a.1°
    text: het zicht;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel6
  - number: 6.1.a.2°
    text: de verkeersdichtheid met inbegrip van concentraties van schepen;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel6
  - number: 6.1.a.3°
    text: |-
      de manoeuvreerbaarheid van het schip, in het bijzonder wat betreft de afstand waarbinnen gestopt kan worden en de
      wendbaarheid in verband met de heersende toestanden;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel6
  - number: 6.1.a.4°
    text: bij nacht de aanwezigheid van achtergrondlicht zoals van wallichten of het stralen van eigen lichten;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel6
  - number: 6.1.a.5°
    text: de toestand van wind en de nabijheid van gevaren voor de navigatie;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel6
  - number: 6.1.a.6°
    text: de diepgang ten opzichte van de beschikbare waterdiepte;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel6
  - number: 6.1.a.7°
    text: de afmetingen van het schip;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel6
  - number: 6.1.a.8°
    text: de aard van de lading;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel6
  - number: 6.1.b
    text: 'bovendien, door schepen met een goed werkende radar:'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel6
  - number: 6.1.b.1°
    text: de eigenschappen, doeltreffendheid en beperkingen van de radarinstallatie;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel6
  - number: 6.1.b.2°
    text: eventuele beperkingen opgelegd door het ingestelde radarbereik;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel6
  - number: 6.1.b.3°
    text: |-
      de invloed van de toestand van het vaarwater, het weer en andere omstandigheden die de radarwaarneming storend
      kunnen beïnvloeden;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel6
  - number: 6.1.b.4°
    text: |-
      de mogelijkheid dat kleine schepen, ijs en drijvende voorwerpen niet op voldoende afstand met radar worden
      waargenomen;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel6
  - number: 6.1.b.5°
    text: het aantal, de plaats en de beweging van de met radar waargenomen schepen;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel6
  - number: 6.1.b.6°
    text: |-
      de mogelijkheid tot nauwkeuriger beoordelen van het zicht bij gebruik van de radar voor het bepalen van de afstand
      tot schepen en andere voorwerpen in de omgeving;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel6
  - number: 6.1.c
    text: |-
      bovendien, voor schepen uitgerust met een goed werkende marifooninstallatie: de verplichting doeltreffend gebruik
      te maken van inlichtingen van walstations en van andere schepen via het door de bevoegde autoriteit daartoe
      aangewezen marifoonkanaal. Afgezien van de verplichting via het aangewezen marifoonkanaal de meldingen te doen die
      hun worden opgelegd door de bevoegde autoriteit, mag het marifoonkanaal door schepen slechts worden gebruikt voor
      mededelingen omtrent de veiligheid van de scheepvaart en, in dringende gevallen, omtrent de beveiliging van de
      personen aan boord.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel6
  - number: '6.2'
    text: |-
      Om een veilige vaart te kunnen aanhouden moet een schip, tenzij het wordt gesleept of geduwd, uitgerust zijn
      met een gebruiksklare motor waarmede een snelheid van ten minste 6 kilometer per uur door het water kan worden
      gehandhaafd.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel6
  - number: 6.3.a
    text: |-
      De hierna genoemde schepen moeten met een goed werkende marifooninstallatie zijn uitgerust en deze zo nodig
      gebruiken:
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel6
  - number: 6.3.a.1°
    text: zeeschepen;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel6
  - number: 6.3.a.2°
    text: binnenschepen of duwstellen met een lengte van meer dan 110 meter;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel6
  - number: 6.3.a.3°
    text: |-
      binnenschepen, duwstellen en gekoppelde samenstellen geladen met de gevaarlijke stoffen bedoeld in de bij dit
      besluit behorende [bijlagen 2][ref1], [3][ref2] of [4][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0005315
      [ref2]: https://wetten.overheid.nl/BWBR0005315
      [ref3]: https://wetten.overheid.nl/BWBR0005315
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005315
      - id: ref2
        bwb_id: BWBR0005315
      - id: ref3
        bwb_id: BWBR0005315
  - number: 6.3.b
    text: |-
      Indien de lengte van een binnenschip of van een duwstel meer dan 110 meter bedraagt, moet dit van een in twee
      richtingen werkende spreekverbinding zijn voorzien tussen de stuurhut en de kop van het schip of tussen de duwboot
      en de kop van het duwstel.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel6
  - number: '6.4'
    text: |-
      Werktuiglijk voortbewogen schepen moeten hun vaart tijdig verminderen en zo nodig stoppen, indien voor hen hierdoor
      geen onmiddellijk gevaar dreigt:
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel6
  - number: 6.4.a
    text: |-
      telkens wanneer zij in de nabijheid komen van schepen waarvoor golfslag of zuiging gevaar kan opleveren en die de
      bij [artikel 31, derde lid][ref1], voorgeschreven lichten of dagmerken voeren;


      [ref1]: https://wetten.overheid.nl/BWBR0005315#Artikel31
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005315
        artikel: '31'
        hoofdstuk: '3'
  - number: 6.4.b
    text: |-
      op plaatsen aangeduid door het teken A 9 van de bij dit besluit behorende [bijlage 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005315
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005315
  - number: '6.5'
    text: |-
      Wanneer schepen elkaar naderen met tegengestelde koersen bij een engte waarvan de doortocht zo nauw is dat het
      tegelijkertijd doorvaren gevaar kan opleveren, moet het schip dat geen hindernis aan zijn stuurboordzijde heeft,
      zijn weg vervolgen en moet het andere wachten totdat de engte vrij is.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel6
  - number: '6.6'
    text: |-
      Een schip mag slechts gebruik maken van een marifooninstallatie indien deze is goedgekeurd door Onze Minister van
      Verkeer en Waterstaat, en deze geschikt is voor gebruik van de daartoe aangewezen kanalen.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel6
  - number: '6.7'
    text: Het is verboden met een schip met een lengte van 20 meter of meer zeilen te voeren of te zeilen.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel6
  - number: '6.8'
    text: 'De maximum toegelaten snelheid bedraagt:'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel6
  - number: 6.8.a
    text: 'voor schepen met een diepgang van 10 meter of meer: 9 kilometer per uur;'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel6
  - number: 6.8.b
    text: 'voor schepen met een diepgang tussen 4,50 en 10 meter: 12 kilometer per uur;'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel6
  - number: 6.8.c
    text: 'voor schepen met een diepgang van 4,50 meter of minder: 16 kilometer per uur.'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel6
  - number: '6.9'
    text: |-
      Een schip mag niet varen indien door de wijze van belading of anderszins de stabiliteit in gevaar wordt gebracht,
      of indien het schip slecht bestuurbaar is of dreigt te zinken.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel6
  - number: '7.1'
    text: |-
      Een schip moet alle beschikbare middelen gebruiken, passend in de heersende omstandigheden en toestanden, om te
      bepalen of gevaar voor aanvaring bestaat. In geval van twijfel wordt zodanig gevaar geacht te bestaan.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel7
  - number: '7.2'
    text: |-
      Wanneer op een schip een goed werkende marifooninstallatie en goed werkende radarapparatuur zijn aangebracht,
      moet daarvan dusdanig gebruik gemaakt worden, dat vroegtijdige waarschuwing voor het gevaar voor aanvaring wordt
      verkregen.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel7
  - number: '7.3'
    text: |-
      Er mogen geen gevolgtrekkingen worden gemaakt op grond van summiere gegevens, vooral niet van summiere gegevens
      verkregen met behulp van radar.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel7
  - number: '8.1'
    text: |-
      Alle maatregelen ter vermijding van aanvaring moeten, indien de omstandigheden zulks toelaten, doelmatig en
      duidelijk zijn en op tijd worden genomen, daarbij goed rekening houdend met de gebruiken van goede zeemanschap.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel8
  - number: '8.2'
    text: |-
      Indien zulks noodzakelijk is ter vermijding van aanvaring of om meer tijd te verkrijgen ter beoordeling van de
      situatie, moet een schip vaart minderen of de vaart er geheel uithalen door stoppen of achteruit slaan.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel8
  - number: '8.3'
    text: |-
      De maatregelen genomen ter vermijding van aanvaring met een ander schip moeten zodanig zijn dat zij leiden tot het
      voorbijvaren op veilige afstand. De doeltreffendheid van de maatregelen moet zorgvuldig worden gecontroleerd totdat
      het andere schip geheel voorbij is gevaren en goed vrij is.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel8
  - number: '9.1'
    text: |-
      Een schip dat in het kanaal varende is en de richting ervan volgt, moet de oever van het kanaal aan zijn
      stuurboordzijde houden, zo dicht als veilig en uitvoerbaar is.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel9
  - number: '9.2'
    text: |-
      Een schip dat een vaarwater geheel of gedeeltelijk oversteekt of van zijn ligplaats vertrekt, mag de koerslijn
      van een schip dat in dat vaarwater varende is en de richting ervan volgt, niet kruisen indien laatstgenoemd schip
      daardoor verplicht zou worden koers of vaart te wijzigen om aanvaring te voorkomen. Bij gevaar voor aanvaring moet
      het schip dat een vaarwater geheel of gedeeltelijk oversteekt of van zijn ligplaats vertrekt uitwijken.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel9
  - number: 9.3.a
    text: |-
      Een schip dat het kanaal wil binnenvaren, mag de koerslijn van een schip dat in het kanaal vaart en de richting
      ervan volgt, niet kruisen indien laatstgenoemd schip daardoor verplicht zou worden koers of vaart te wijzigen om
      aanvaring te voorkomen. Bij gevaar voor aanvaring moet eerstgenoemd schip, daar waar het het kanaal binnenvaart,
      uitwijken voor een schip dat het kanaal volgt.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel9
  - number: 9.3.b
    text: |-
      Een schip mag de Westerschelde niet invaren, indien daardoor een schip dat dit vaarwater in gestrekte koers volgt,
      zou worden genoodzaakt zijn koers of snelheid te wijzigen.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel9
  - number: '9.4'
    text: 'Het is zonder toestemming van de bevoegde autoriteit verboden met een schip:'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel9
  - number: 9.4.a
    text: zich zodanig op te houden of af te meren dat andere schepen daarvan hinder kunnen ondervinden;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel9
  - number: 9.4.b
    text: ten anker te komen, ten anker te liggen of een anker te hebben uitstaan;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel9
  - number: 9.4.c
    text: een anker, een kabel of een ketting te laten slepen.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel9
  - number: '9.5'
    text: 'Het bepaalde in het vierde lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel9
  - number: 9.5.a
    text: indien dit voor de veiligheid noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel9
  - number: 9.5.b
    text: |-
      op de door de bevoegde autoriteit aangewezen ligplaatsen en op wachtplaatsen voor sluizen en bruggen, mits dat niet
      geschiedt binnen een afstand van 100 meter van plaatsen waar zich kabels of buisleidingen bevinden.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel9
  - number: '9.6'
    text: |-
      Het is verboden in het kanaal met een schip af te meren, tenzij dit is toegestaan middels verkeerstekens dan wel
      door de bevoegde autoriteit.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel9
  - number: '9.7'
    text: 'De kapitein of schipper van een gemeerd schip is verplicht:'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel9
  - number: 9.7.a
    text: |-
      aan een ander schip dat wil vertrekken of verhalen, laden of lossen dan wel ruimte wil hebben voor het langszij
      komen van een schip ten behoeve van overslag, de nodige medewerking te geven;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel9
  - number: 9.7.b
    text: te gedogen dat een ander schip verbinding met de wal heeft anders dan om te laden of te lossen;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel9
  - number: 9.7.c
    text: |-
      op eerste vordering van de bevoegde autoriteit zijn schip onverwijld te verhalen of te doen verhalen, dan wel met
      zijn schip de haven of vaarweg te verlaten.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel9
  - number: '9.8'
    text: |-
      Voor het vastmaken van meerdraden, kabels of kettingen mag alleen gebruik gemaakt worden van de daartoe bestemde
      voorzieningen.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel9
  - number: '9.9'
    text: 'Een schip mag ankeren noch afmeren binnen de afstanden van een ander schip zoals hieronder wordt bepaald:'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel9
  - number: 9.9.a
    text: |-
      binnen 10 meter van een schip dat een blauw licht of een blauwe kegel, bedoeld in
      [artikel 25, tweede lid, onder a,][ref1] voert;


      [ref1]: https://wetten.overheid.nl/BWBR0005315#Artikel25
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005315
        artikel: '25'
        hoofdstuk: '3'
  - number: 9.9.b
    text: |-
      binnen 50 meter van een schip dat twee blauwe lichten of kegels, bedoeld in
      [artikel 25, tweede lid, onder b,][ref1] of een rood helder rondom zichtbaar licht of de internationale seinvlag
      "B", bedoeld in [artikel 25, eerste lid][ref2], voert;


      [ref1]: https://wetten.overheid.nl/BWBR0005315#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0005315#Artikel25
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005315
        artikel: '25'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005315
        artikel: '25'
        hoofdstuk: '3'
  - number: 9.9.c
    text: |-
      binnen 100 meter van een schip dat drie blauwe lichten of kegels, bedoeld in
      [artikel 25, tweede lid, onder c][ref1], voert.


      [ref1]: https://wetten.overheid.nl/BWBR0005315#Artikel25
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005315
        artikel: '25'
        hoofdstuk: '3'
  - number: '9.10'
    text: |-
      Het verbod in het negende lid, onder *a*, geldt niet voor een schip dat eveneens dit licht of dit dagmerk voert.
      Het verbod geldt evenmin voor een schip dat, zonder dat het dit licht of dit dagmerk voert, is voorzien van
      een certificaat van goedkeuring, bedoeld in de Europese Overeenkomst betreffende het internationale vervoer van
      gevaarlijke goederen over de binnenwateren (ADN) nr. 8.1.8, en dat voldoet aan de veiligheidsvoorschriften voor
      een schip dat ingevolge [artikel 25, tweede lid, onder a][ref1], verplicht is een blauw licht of een blauwe kegel
      te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0005315#Artikel25
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005315
        artikel: '25'
        hoofdstuk: '3'
  - number: '9.11'
    text: |-
      De bevoegde autoriteit kan voor het ankeren en afmeren kleinere afstanden toestaan dan die in het negende lid
      worden vermeld.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel9
  - number: '9.12'
    text: |-
      Het bepaalde in het negende, tiende en elfde lid is van overeenkomstige toepassing voor de afstanden waar binnen
      een schip, bedoeld in [artikel 25][ref1], niet mag ankeren of afmeren ten opzichte van een ander schip.


      [ref1]: https://wetten.overheid.nl/BWBR0005315#Artikel25
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005315
        artikel: '25'
        hoofdstuk: '3'
  - number: '10.1'
    text: |-
      Een schip dat wil keren, mag de koerslijn van een schip dat in het vaarwater varende is en de richting ervan volgt,
      niet kruisen indien laatstgenoemd schip daardoor verplicht zou worden koers of vaart te wijzigen om aanvaring te
      voorkomen. Een schip dat wil keren moet dit tijdig aan de in de nabijheid zijnde schepen kenbaar maken door het
      geven van één lange stoot gevolgd door één of twee korte indien het keren respectievelijk over stuurboord dan wel
      over bakboord gebeurt; dit sein moet zo nodig worden herhaald.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel10
  - number: '10.2'
    text: |-
      Een schip mag niet keren vóór de ingang van een haven, zijkanaal of de toegang tot een sluis wanneer andere schepen
      die verlaten of aanlopen.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel10
  - number: '11'
    text: De voorschriften in deze afdeling zijn van toepassing op schepen die in zicht van elkaar zijn.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel11
  - number: '12'
    text: |-
      Behalve bij oplopen en bij voorbijvaren met tegengestelde koersen, mag een schip niet varen
      binnen een afstand van 50 meter van een schip dat de lichten of dagmerken voert voorgeschreven in
      [artikel 25, eerste lid en tweede lid, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005315#Artikel25
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005315
        artikel: '25'
        hoofdstuk: '3'
  - number: '13.1'
    text: Elk schip dat een ander schip oploopt, moet uitwijken voor het schip dat wordt opgelopen.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel13
  - number: '13.2'
    text: |-
      Een schip wordt geacht op te lopen wanneer het een ander schip nadert uit een richting van meer dan 22,5°
      achterlijker dan dwars, dat wil zeggen in zodanige positie met betrekking tot het schip dat wordt opgelopen dat
      het bij nacht alleen het heklicht daarvan zou kunnen zien doch geen van de beide zijdelichten. Geen daaropvolgende
      verandering van de peiling tussen de beide schepen zal het oplopende schip kunnen maken tot koerskruisend in de zin
      van dit reglement of het kunnen ontslaan van de plicht uit te wijken voor het opgelopen schip totdat dit geheel is
      voorbijgevaren en goed vrij is.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel13
  - number: '13.3'
    text: |-
      Wanneer een schip in twijfel verkeert of het een ander schip oploopt, moet het zich als oplopend schip beschouwen
      en uitwijken.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel13
  - number: '13.4'
    text: |-
      Een schip dat een ander schip oploopt, moet aan de bakboordzijde van dat schip voorbijvaren. Wanneer het oplopen
      slechts kan plaatsvinden indien het opgelopen schip maatregelen neemt om een veilig voorbijvaren mogelijk te maken,
      moet het schip dat wil oplopen tijdig zijn voornemen kenbaar maken door het geven van twee lange stoten gevolgd
      door twee korte. Kan het opgelopen schip ruimte aan zijn bakboordzijde geven dan moet het naar stuurboord uitwijken
      en één korte stoot geven.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel13
  - number: '13.5'
    text: |-
      Wanneer de omstandigheden daartoe noodzaken, mag, in afwijking van hetgeen in het vierde lid is voorgeschreven,
      het oplopende schip aan de stuurboordzijde van het opgelopene voorbijvaren. Wanneer het oplopen slechts kan
      plaatsvinden indien het opgelopen schip maatregelen neemt om een veilig voorbijvaren mogelijk te maken, moet het
      schip dat wil oplopen tijdig zijn voornemen kenbaar maken door het geven van twee lange stoten gevolgd door één
      korte. Kan het opgelopen schip ruimte aan zijn stuurboordzijde geven dan moet het naar bakboord uitwijken en twee
      korte stoten geven.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel13
  - number: '13.6'
    text: |-
      Het opgelopen schip moet ten minste vijf korte stoten geven indien het niet kan medewerken tot het oplopen of
      indien naar zijn mening het oplopen onmogelijk is.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel13
  - number: '13.7'
    text: |-
      Een schip mag, behoudens toestemming van de bevoegde autoriteit, een bovenmaats zeeschip dat varende is en de
      lichten of het dagmerk voert omschreven in [artikel 28][ref1] niet oplopen en voorbijvaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005315#Artikel28
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005315
        artikel: '28'
        hoofdstuk: '3'
  - number: '13.8'
    text: |-
      Het opgelopen schip is verplicht het oplopen te vergemakkelijken door tijdig en genoegzaam vaart te verminderen en
      het oplopende schip zoveel mogelijk ruimte te geven.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel13
  - number: '13.9'
    text: |-
      Schepen mogen niet op gelijke hoogte blijven varen tenzij dit zonder hinder of gevaar voor de scheepvaart kan
      geschieden.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel13
  - number: '14.1'
    text: |-
      Wanneer twee werktuiglijk voortbewogen schepen op tegengestelde of bijna tegengestelde koersen tegen elkaar
      insturen zodanig dat dit gevaar voor aanvaring medebrengt, moeten beide naar stuurboord uitwijken zodat ze elkaar
      aan bakboord voorbijvaren.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel14
  - number: '14.2'
    text: |-
      Een zodanige situatie wordt geacht te bestaan wanneer een schip een ander dusdanig recht of bijna recht vooruit
      ziet dat het, bij nacht, de toplichten daarvan in één lijn of nagenoeg in één lijn en/of beide zijdelichten zou
      kunnen zien. Wanneer een schip in twijfel verkeert of een zodanige situatie bestaat, moet het aannemen dat dit het
      geval is en dienovereenkomstig handelen.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel14
  - number: '15'
    text: |-
      Wanneer de koersen van twee werktuiglijk voortbewogen schepen elkaar kruisen zodanig dat dit gevaar voor aanvaring
      medebrengt, moet, behalve waar [artikel 9, tweede en derde lid][ref1], anders voorschrijft, het schip dat het
      andere aan stuurboordzijde van zich heeft uitwijken en, wanneer de omstandigheden het toelaten, vermijden vóór het
      andere over te lopen.


      [ref1]: https://wetten.overheid.nl/BWBR0005315#Artikel9
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005315
        artikel: '9'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '16'
    text: |-
      Elk schip dat verplicht is uit te wijken voor een ander schip moet, voor zover dit mogelijk is, bijtijds ruim
      voldoende maatregelen nemen om goed vrij te blijven.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel16
  - number: '17.1'
    text: |-
      Wanneer één van beide schepen verplicht is uit te wijken, moet het andere zijn koers behouden voor zover bij dit
      reglement niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel17
  - number: '17.2'
    text: |-
      Het schip dat zijn koers moet behouden mag echter maatregelen nemen ter vermijding van aanvaring door zelf een
      manoeuvre uit te voeren zodra hem duidelijk wordt dat het schip dat verplicht is uit te wijken niet de passende
      maatregelen neemt die ingevolge dit reglement zijn voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel17
  - number: '17.3'
    text: |-
      Indien ten gevolge van enige oorzaak het schip dat verplicht is koers te behouden zich zo dicht bij het andere
      bevindt dat aanvaring door een handeling van het schip dat moet uitwijken alléén niet kan worden vermeden, moet het
      de maatregelen nemen die het best kunnen bijdragen tot het vermijden van aanvaring.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel17
  - number: '17.4'
    text: Dit voorschrift ontheft het schip dat verplicht is uit te wijken niet van die verplichting.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel17
  - number: '18.1'
    text: |-
      Behalve waar [artikel 13][ref1] anders voorschrijft:


      [ref1]: https://wetten.overheid.nl/BWBR0005315#Artikel13
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005315
        artikel: '13'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 18.1.a
    text: 'moet een schip dat varende is uitwijken voor:'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel18
  - number: 18.1.a.1°
    text: een onmanoeuvreerbaar schip;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel18
  - number: 18.1.a.2°
    text: een bovenmaats zeeschip;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel18
  - number: 18.1.a.3°
    text: een beperkt manoeuvreerbaar schip;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel18
  - number: 18.1.b
    text: moet een bovenmaats zeeschip dat varende is uitwijken voor een onmanoeuvreerbaar schip;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel18
  - number: 18.1.c
    text: |-
      moet een beperkt manoeuvreerbaar schip dat varende is uitwijken voor een onmanoeuvreerbaar schip en voor een
      bovenmaats zeeschip;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel18
  - number: 18.1.d
    text: moet een klein schip dat varende is uitwijken voor andere dan kleine schepen.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel18
  - number: '18.2'
    text: |-
      Buiten de gedeelten van het kanaal die door de bevoegde autoriteit zijn aangegeven, is het een bovenmaats zeeschip
      verboden een ander bovenmaats zeeschip met tegengestelde koers voorbij te varen.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel18
  - number: '18.3'
    text: |-
      Buiten de gedeelten van het kanaal die door de bevoegde autoriteit zijn aangegeven, is het een zeeschip met
      een lengte van 245 meter of meer en een duwstel of een gekoppeld samenstel met een breedte van 15 meter of meer
      verboden elkaar met tegengestelde koersen voorbij te varen.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel18
  - number: '18.4'
    text: |-
      Wanneer twee kleine schepen elkaar zodanig naderen dat gevaar voor aanvaring bestaat en één van die schepen houdt
      de stuurboordzijde van het vaarwater, dan moet dit schip zijn weg vervolgen en moet het andere schip uitwijken.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel18
  - number: '18.5'
    text: |-
      Wanneer een werktuiglijk voortbewogen klein schip, een door spierkracht voortbewogen klein schip of een klein
      zeilschip elkaar zodanig naderen dat gevaar voor aanvaring bestaat, moet, behoudens in het geval genoemd in het
      vierde lid:
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel18
  - number: 18.5.a
    text: het werktuiglijk voortbewogen klein schip uitwijken voor het andere schip;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel18
  - number: 18.5.b
    text: het door spierkracht voortbewogen klein schip uitwijken voor het zeilschip.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel18
  - number: '18.6'
    text: 'Wanneer, behoudens in het geval genoemd in het vierde lid:'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel18
  - number: 18.6.a
    text: |-
      twee werktuiglijk voortbewogen kleine schepen zodanig recht of bijna recht tegen elkaar insturen dat gevaar voor
      aanvaring bestaat, moeten beide naar stuurboord uitwijken zodat ze elkaar aan bakboord voorbijvaren;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel18
  - number: 18.6.b
    text: |-
      de koersen van twee werktuiglijk voortbewogen kleine schepen elkaar zodanig kruisen dat gevaar voor aanvaring
      bestaat, moet het schip dat het andere aan stuurboordzijde van zich heeft, uitwijken.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel18
  - number: '18.7'
    text: |-
      Een klein schip dat ingevolge het bij het eerste, vierde, vijfde of zesde lid gestelde verplicht is uit te wijken,
      moet dit tijdig en naar stuurboord doen en moet, indien de omstandigheden dit toelaten, vermijden vóór het andere
      schip over te lopen.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel18
  - number: '18.8'
    text: |-
      Indien twee kleine zeilschepen elkaar zodanig naderen dat gevaar voor aanvaring bestaat, moet, behoudens in het
      geval genoemd in het vierde lid:
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel18
  - number: 18.8.a
    text: |-
      wanneer beide schepen over verschillende boeg liggen, het schip dat over stuurboordboeg ligt uitwijken voor het
      schip dat over bakboordboeg ligt;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel18
  - number: 18.8.b
    text: wanneer beide schepen over dezelfde boeg liggen, het loefwaartse schip wijken voor het lijwaartse;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel18
  - number: 18.8.c
    text: |-
      een schip dat over stuurboordboeg ligt en dat aan zijn loefzijde een schip ziet waarvan niet met zekerheid is te
      bepalen of het over stuurboord- dan wel over bakboordboeg ligt, voor laatstgenoemd schip uitwijken.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel18
  - number: '19.1'
    text: |-
      Bij beperkt zicht maakt een schip gebruik van radar. Als een schip niet op radar kan varen, gaat het bij beperkt
      zicht op de dichtstbijzijnde daarvoor geschikte plaats stilliggen.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel19
  - number: '19.2'
    text: |-
      Elk schip moet een veilige vaart aanhouden aangepast aan de heersende omstandigheden en de toestanden van
      beperkt zicht en zonodig stoppen. Een werktuiglijk voortbewogen schip moet zijn machines gereed hebben ten einde
      onmiddellijk te kunnen manoeuvreren.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel19
  - number: '19.3'
    text: |-
      Een schip dat alleen met radar de aanwezigheid van een ander schip waarneemt, moet vaststellen of zich een situatie
      ontwikkelt waarin men elkaar zo dicht nadert dat gevaar voor aanvaring kan ontstaan. Is dit het geval dan moet het
      bijtijds maatregelen ter vermijding daarvan nemen.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel19
  - number: '19.4'
    text: |-
      Behalve wanneer is vastgesteld dat geen gevaar voor aanvaring bestaat, moet elk schip dat meent voorlijker dan
      dwars het mistsein te horen van een ander schip of dat een dicht naderen van een schip voorlijker dan dwars niet
      kan vermijden, zijn vaart verminderen tot het minimum waarbij het op koers kan worden gehouden. Indien nodig moet
      de vaart geheel uit het schip worden gehaald en in elk geval uiterst voorzichtig gemanoeuvreerd worden tot het
      gevaar voor aanvaring is geweken.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel19
  - number: '19.5'
    text: 'Schepen mogen slechts met behulp van radar varen indien:'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel19
  - number: 19.5.a
    text: ze zijn uitgerust met een voor de behoeften van de binnenvaart geschikte radarinstallatie en een bochtaanwijzer;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel19
  - number: 19.5.b
    text: |-
      ze zijn uitgerust met een marifooninstallatie waarmede het onderhouden van verbinding tussen schepen onderling
      mogelijk is;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel19
  - number: 19.5.c
    text: |-
      zich aan boord een persoon bevindt die houder is van een diploma dat overeenkomstig de daaromtrent vastgestelde
      regelen is afgegeven;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel19
  - number: 19.5.d
    text: |-
      zowel de in onderdeel *c* bedoelde persoon als een tweede persoon, die met deze wijze van varen voldoende op de
      hoogte is, zich voortdurend in de stuurhut bevinden. Voor een schip waarvan de stuurstelling zodanig is ingericht,
      dat het voeren van het schip dat vaart met behulp van radar, door één persoon kan geschieden, behoeft de tweede
      persoon slechts aan boord beschikbaar te zijn.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel19
  - number: '19.6'
    text: |-
      Bij het varen bij beperkt zicht met behulp van radar moet de marifooninstallatie voortdurend op het kanaal zijn
      ingeschakeld dat door de bevoegde autoriteit is voorgeschreven en aan de scheepvaart is bekend gemaakt, hetzij
      om uit te luisteren, hetzij om inlichtingen te geven ten behoeve van andere schepen. De marifooninstallatie moet
      tevens worden gebruikt voor het onderhouden van verbinding met de bevoegde personen aan de wal.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel19
  - number: '20.1'
    text: |-
      Zeeschepen moeten de lichten en dagmerken voeren zoals voorgeschreven bij de van kracht zijnde internationale
      bepalingen ter voorkoming van aanvaringen op zee en op de bij die bepalingen voorgeschreven wijze, voor zover
      niet bij dit reglement wordt bepaald dat op zeeschepen in afwijking daarvan de voorschriften van dit reglement van
      toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel20
  - number: '20.2'
    text: De voorschriften in dit hoofdstuk moeten onder alle weersomstandigheden worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel20
  - number: 20.3.a
    text: |-
      De voorschriften betreffende de lichten zijn van toepassing van zonsondergang tot zonsopgang en gedurende die tijd
      mogen geen andere lichten worden getoond.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel20
  - number: 20.3.b
    text: |-
      De voorgeschreven lichten moeten, indien zij worden gevoerd, ook worden getoond van zonsopgang tot zonsondergang
      bij beperkt zicht en mogen onder alle andere omstandigheden worden getoond wanneer dat noodzakelijk wordt geacht.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel20
  - number: 20.3.c
    text: |-
      Schepen mogen geen verblindende lichten gebruiken waardoor voor andere schepen of voor het verkeer te land gevaar
      of hinder kan ontstaan.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel20
  - number: '20.4'
    text: |-
      De voorschriften betreffende de dagmerken moeten overdag worden nageleefd en gedurende die tijd mogen geen andere
      dagmerken worden getoond.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel20
  - number: '20.5'
    text: |-
      De in dit reglement vermelde lichten of dagmerken mogen alleen worden gevoerd of getoond in de omstandigheden en
      voor de doeleinden voorzien bij dit reglement.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel20
  - number: '21.1'
    text: 'Lichten In dit reglement wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel21
  - number: 21.1.a
    text: |-
      toplicht: een wit krachtig licht, geplaatst in het midscheepse verticale vlak in langsrichting van het schip,
      ononderbroken zichtbaar over een boog van de horizon van 225°, van recht vooruit tot 22,5° achterlijker dan dwars
      aan elke zijde van het schip;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel21
  - number: 21.1.b
    text: |-
      zijdelichten: een groen helder licht geplaatst aan stuurboordzijde en een rood helder licht geplaatst aan
      bakboordzijde, ononderbroken zichtbaar over een boog van de horizon van 112,5°, van recht vooruit tot 22,5°
      achterlijker dan dwars, elk aan hun zijde, en op één lijn loodrecht op het midscheepse verticale vlak in
      langsrichting;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel21
  - number: 21.1.c
    text: |-
      heklicht: een wit helder of gewoon licht geplaatst zo dicht mogelijk bij het hek als uitvoerbaar, dat ononderbroken
      zichtbaar is over een boog van de horizon van 135°, van recht achteruit over 67,5° naar elke zijde van het schip;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel21
  - number: 21.1.d
    text: 'sleeplicht: een geel helder licht met dezelfde kenmerken als het heklicht, omschreven onder *c*;'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel21
  - number: 21.1.e
    text: 'rondom zichtbaar licht: een licht dat ononderbroken zichtbaar is over een boog van de horizon van 360°;'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel21
  - number: 21.1.f
    text: |-
      flikkerlicht: een rondom zichtbaar licht dat flikkert met regelmatige tussenpozen met een frequentie van ten minste
      50 flikkeringen per minuut.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel21
  - number: '21.2'
    text: Dagmerken
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel21
  - number: 21.2.a
    text: |-
      De voorgeschreven dagmerken moeten, tenzij in dit reglement anders bepaald, zwart zijn en moeten de volgende
      afmetingen hebben:
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel21
  - number: 21.2.a.1°
    text: 'een bal: een middellijn van ten minste 0,50 meter;'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel21
  - number: 21.2.a.2°
    text: 'een cylinder: een middellijn van ten minste 0,50 meter en een hoogte van tweemaal zijn middellijn;'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel21
  - number: 21.2.a.3°
    text: 'een kegel: een grondvlak met een middellijn van ten minste 0,50 meter en een hoogte gelijk aan zijn middellijn;'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel21
  - number: 21.2.a.4°
    text: een ruit bestaat uit twee kegels zoals beschreven onder 3°, die het grondvlak gemeen hebben.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel21
  - number: 21.2.b
    text: |-
      De voorgeschreven vlaggen moeten rechthoekig zijn en zij moeten een hoogte hebben van ten minste 0,75 meter bij een
      breedte van ten minste 0,90 meter.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel21
  - number: 21.2.c
    text: Vorm en kleur van de dagmerken moeten steeds herkenbaar zijn.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel21
  - number: '21.3'
    text: |-
      Onderlinge afstand tussen lichten of dagmerken De loodrechte onderlinge afstand tussen de lichten of de dagmerken
      bedraagt, tenzij in dit reglement anders is bepaald, ten minste 0,50 meter en ten hoogste 2 meter. Indien meer dan
      twee van dergelijke lichten of dagmerken worden gevoerd moeten de onderlinge afstanden gelijk zijn.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel21
  - number: '21.4'
    text: |-
      Bijzondere regeling Indien de afmetingen van het schip een belemmering vormen om de lichten en dagmerken te voeren
      als voorzien in het tweede en het derde lid, mogen dagmerken met kleinere afmetingen, passend bij de grootte van
      het schip, worden gebruikt en mogen de onderlinge afstanden tussen lichten of dagmerken dienovereenkomstig worden
      verminderd.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel21
  - number: '22'
    text: 'In dit reglement wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel22
  - number: 22.a
    text: 'zichtbaar: zichtbaar bij donkere nacht en bij heldere dampkring;'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel22
  - number: 22.b
    text: 'gewoon licht, helder licht en krachtig licht:'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel22
  - number: 22.b.1
    text: |-
      voor zeeschepen: lichten die op een afstand van onderscheidenlijk ten minste 1.000 meter, 2.000 meter en 3.000
      meter zichtbaar zijn;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel22
  - number: 22.b.2
    text: |-
      voor binnenschepen: de lichten die voldoen aan de eisen van [bijlage 1.5 van de Binnenvaartregeling][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025958
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0025958
  - number: '23.1'
    text: 'Een werktuiglijk voortbewogen schip, dat varende is, moet voeren:'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel23
  - number: 23.1.a
    text: een toplicht op het voorschip;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel23
  - number: 23.1.b
    text: een tweede toplicht achterlijker en hoger dan het voorste;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel23
  - number: 23.1.c
    text: zijdelichten;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel23
  - number: 23.1.d
    text: een heklicht.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel23
  - number: '23.2'
    text: |-
      Het voorste toplicht of, indien slechts één toplicht wordt gevoerd, dat toplicht, wordt voor schepen met een lengte
      van 40 meter of meer op ten minste 6 meter hoogte, en voor schepen met een lengte van minder dan 40 meter op ten
      minste 4 meter hoogte geplaatst, en in elk geval ten minste 1 meter hoger dan de zijdelichten.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel23
  - number: '23.3'
    text: |-
      Wanneer twee toplichten worden gevoerd, moet het achterste ten minste 3 meter hoger zijn geplaatst dan het voorste
      of het hoogste van de bij [artikel 24, eerste en tweede lid][ref1], bedoelde lichten. De horizontale afstand tussen
      beide lichten mag niet minder zijn dan de helft van de lengte van het schip.


      [ref1]: https://wetten.overheid.nl/BWBR0005315#Artikel24
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005315
        artikel: '24'
        hoofdstuk: '3'
  - number: '23.4'
    text: |-
      Bij het varen door de doorvaartopening van een brug met een beperkte doorvaarthoogte dan wel van een ander
      kunstwerk, mogen de in het tweede en derde lid bedoelde lichten zoveel lager worden gevoerd als hiervoor nodig is.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel23
  - number: '23.5'
    text: De zijdelichten moeten op gelijke hoogte zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel23
  - number: '23.6'
    text: 'Samenstellen van varende langszij aan elkaar gekoppelde schepen, niet zijnde kleine schepen, moeten voeren:'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel23
  - number: 23.6.a
    text: op elk voortstuwend schip het toplicht of de toplichten;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel23
  - number: 23.6.b
    text: |-
      op elk niet voortstuwend schip een rondom zichtbaar wit helder licht geplaatst op voldoende hoogte doch niet hoger
      dan het voorste toplicht van het voortstuwende schip, en bij een lengte van meer dan 110 meter twee dergelijke
      lichten, één voorop en één achterop, op gelijke hoogte;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel23
  - number: 23.6.c
    text: |-
      de zijdelichten geplaatst aan de buitenzijde van het gekoppelde samenstel en voor zover als mogelijk op gelijke
      hoogte en ten minste 1 meter lager dan het licht bedoeld onder b;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel23
  - number: 23.6.d
    text: op elk schip het heklicht.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel23
  - number: '24.1'
    text: |-
      Een sleepboot of een werktuiglijk voortbewogen schip dat één of meer schepen sleept of assisteert moet, behalve de
      zijdelichten en het heklicht, onder of boven het in [artikel 23, eerste lid, onder ][ref1] bedoelde toplicht een
      tweede licht voeren van gelijke inrichting en sterkte als dit toplicht.


      [ref1]: https://wetten.overheid.nl/BWBR0005315#Artikel23
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005315
        artikel: '23'
        hoofdstuk: '3'
  - number: '24.2'
    text: |-
      Wanneer twee of meer sleepboten gezamenlijk één of meer schepen slepen of assisteren moet ieder, onder of boven de
      in het eerste lid genoemde lichten, een derde wit licht voeren van gelijke inrichting en sterkte.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel24
  - number: '24.3'
    text: |-
      De in het eerste en tweede lid bedoelde lichten moeten in verticale lijn staan en wel zodanig dat het onderste
      gevoerd wordt op een hoogte van ten minste 4 meter op een schip met een lengte van minder dan 40 meter, en op een
      hoogte van ten minste 6 meter op een schip met een lengte van 40 meter en meer.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel24
  - number: '24.4'
    text: Het bepaalde in het eerste, tweede en derde lid is eveneens van toepassing op zeeschepen.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel24
  - number: '24.5'
    text: |-
      Op een binnenschip dat sleept, moet het heklicht worden vervangen door een geel licht van gelijke inrichting en
      sterkte.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel24
  - number: '24.6'
    text: |-
      Een zeeschip dat wordt gesleept, moet behalve de zijdelichten en het heklicht ook het toplicht of de toplichten
      voeren en bovendien de lichten of de dagmerken voorgeschreven in [artikel 27, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005315#Artikel27
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005315
        artikel: '27'
        hoofdstuk: '3'
  - number: '24.7'
    text: |-
      Een binnenschip dat wordt gesleept, moet bij nacht één rondom zichtbaar wit helder licht voeren op een hoogte van
      ten minste 6 meter. Bij een scheepslengte van meer dan 110 meter moeten twee dergelijke lichten worden gevoerd, één
      voorop en één achterop, op gelijke hoogte; het laatste binnenschip van een sleep moet daarbij het heklicht voeren.
      Bij dag voert een binnenschip dat wordt gesleept een gele bal op een geschikte plaats en op een zodanige hoogte dat
      deze van alle zijden zichtbaar is.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel24
  - number: '24.8'
    text: |-
      Een niet of weinig opvallend, zich gedeeltelijk onder water bevindend schip of voorwerp dat wordt gesleept, moet
      voeren, daar waar dat het best kan worden gezien:
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel24
  - number: 24.8.a
    text: |-
      een rondom zichtbaar wit gewoon licht aan of nabij het voorste uiteinde en een zelfde licht aan of nabij het
      achterste uiteinde van de sleep;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel24
  - number: 24.8.b
    text: een ruitvormig dagmerk aan of nabij het achterste uiteinde van de sleep.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel24
  - number: '24.9'
    text: |-
      Een schip dat wordt geassisteerd, moet de lichten voeren van een werktuiglijk voortbewogen schip van zijn soort
      en lengte.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel24
  - number: '24.10'
    text: |-
      Voor het lager voeren van de in dit artikel bedoelde lichten, is [artikel 23, vierde lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005315#Artikel23
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005315
        artikel: '23'
        hoofdstuk: '3'
  - number: '25.1'
    text: |-
      Een zeeschip dat gevaarlijke stoffen vervoert, bedoeld in de bij dit besluit behorende [bijlage 1][ref1], moet,
      behalve de lichten of dagmerken die worden voorgeschreven bij de overige bepalingen van dit reglement, voeren: -
      bij nacht: een rondom zichtbaar rood helder licht;
        - bij dag: de seinvlag "B" van het Internationaal seinboek; waar zij het best kunnen worden gezien en op een hoogte
      van ten minste 6 meter boven het dek.


      [ref1]: https://wetten.overheid.nl/BWBR0005315
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005315
  - number: 25.2.a
    text: |-
      Een binnenschip dat bepaalde brandbare stoffen vervoert, bedoeld in de Europese Overeenkomst betreffende het
      internationale vervoer van gevaarlijke goederen over de binnenwateren (ADN), nr. 7.1.5.0.1 of nr. 7.2.5.0.2, moet,
      behalve de lichten of dagmerken die worden voorgeschreven bij de overige bepalingen van dit reglement, voeren: -
      bij nacht: één rondom zichtbaar blauw licht;
        - bij dag: één blauwe kegel met de punt naar beneden. In plaats van één blauwe kegel, kan ook één blauwe kegel op
      het voor- en één op het achterschip op een hoogte van ten minste 3 meter boven het vlak der inzinkingsmerken worden
      gevoerd.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel25
  - number: 25.2.b
    text: |-
      Een binnenschip dat bepaalde voor de gezondheid schadelijke stoffen vervoert, bedoeld in het ADN, nr. 7.1.5.0.1 of
      nr. 7.2.5.0.2, moet, behalve de lichten of dagmerken die worden voorgeschreven bij de overige bepalingen van dit
      reglement, voeren: - bij nacht: twee rondom zichtbare blauwe lichten;
        - bij dag: twee blauwe kegels met de punt naar beneden; in een verticale lijn en met een onderlinge afstand van
      ongeveer 1 meter. In plaats van twee blauwe kegels, kunnen ook telkens twee blauwe kegels op het voor- en op
      het achterschip worden gevoerd, waarvan de ondersten op een hoogte van ten minste 3 meter boven het vlak der
      inzinkingsmerken worden gevoerd.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel25
  - number: 25.2.c
    text: |-
      Een binnenschip dat bepaalde ontplofbare stoffen vervoert, bedoeld in ADN, nr. 7.1.5.0.1 of nr. 7.2.5.0.2, moet,
      behalve de lichten of dagmerken die worden voorgeschreven bij de overige bepalingen van dit reglement, voeren: -
      bij nacht: drie rondom zichtbare blauwe lichten;
        - bij dag: drie blauwe kegels met de punt naar beneden; in een verticale lijn en met een onderlinge afstand
      van ongeveer 1 meter. In plaats van drie blauwe kegels, kunnen ook telkens drie blauwe kegels op het voor en
      op het achterschip worden gevoerd, waarvan de ondersten op een hoogte van ten minste 3 meter boven het vlak der
      inzinkingsmerken worden gevoerd.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel25
  - number: 25.2.d
    text: |-
      Indien een duwstel of een gekoppeld samenstel één of meer schepen bevat, bedoeld in het eerste of tweede lid,
      moet, in plaats van dit schip of van deze schepen, de duwboot of het schip dat dient voor het voortbewegen van het
      gekoppeld samenstel het licht of de lichten, dan wel de kegel of de kegels, vermeld in het eerste of tweede lid,
      voeren.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel25
  - number: 25.2.e
    text: |-
      Een binnenschip, een duwstel of een gekoppeld samenstel, geladen met verschillende gevaarlijke stoffen, als bedoeld
      onder *a*, *b*, en *c*, moet uitsluitend de lichten of kegels voeren voorgeschreven voor de gevaarlijke stof die
      volgens dit lid het grootste aantal blauwe lichten of kegels vereist.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel25
  - number: 25.2.f
    text: |-
      De sterkte van de blauwe lichten voorgeschreven in dit lid dient ten minste gelijk te zijn aan die van blauwe
      gewone lichten.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel25
  - number: '25.3'
    text: |-
      Het eerste en tweede lid zijn ook van toepassing op tankschepen, die na het lossen van de in de bij dit besluit
      behorende [bijlage 1][ref1] bedoelde stoffen nog niet gereinigd, ontgast of geheel geïnertiseerd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005315
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005315
  - number: '25.4'
    text: |-
      Een binnenschip, dat in het bezit is van een certificaat van goedkeuring als bedoeld in het ADN, nr. 8.1.8.0 en
      dat voldoet aan de veiligheidsvoorschriften die gelden voor een schip als bedoeld in het tweede lid, onderdeel *a*,
      mag, indien het gelijktijdig geschut wil worden met een schip dat de tekens van het tweede lid, onder *a*, moet
      voeren, bij nadering van een sluis de tekens, bedoeld in het tweede lid, onder *a*, voeren.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel25
  - number: '26.1'
    text: |-
      Een duwstel met een lengte van meer dan 110 meter of met een breedte van meer dan 12 meter, dat varende is, moet
      voeren:
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel26
  - number: 26.1.a.1°
    text: |-
      drie toplichten vóór op het voorste schip of, ingeval meerdere schepen zich vooraan bevinden, vóór op het aan
      bakboord geplaatste van die voorste schepen, opgesteld in de vorm van een gelijkzijdige driehoek met horizontale
      basis in een vlak loodrecht op de lengte-as van het duwstel, het bovenste licht op een hoogte van ten minste 6
      meter en de beide onderste lichten ongeveer 1,25 meter uit elkaar en ongeveer 1,10 meter onder het bovenste licht;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel26
  - number: 26.1.a.2°
    text: |-
      een toplicht op het voorschip van elk ander schip dat van voren over de volle breedte zichtbaar is, voorzover
      mogelijk 3 meter lager dan het bovenste licht, bedoeld onder 1°;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel26
  - number: 26.1.b
    text: |-
      zijdelichten op het breedste gedeelte van het duwstel, zo dicht mogelijk bij de duwboot, ten hoogste 1 meter binnen
      de zijkanten van het duwstel en op een hoogte van ten minste 2 meter;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel26
  - number: 26.1.c.1°
    text: |-
      drie heklichten op de duwboot in een horizontale lijn loodrecht op de lengte-as, telkens ongeveer 1,25 meter
      uit elkaar, op een zodanige hoogte dat zij niet door een ander schip van het duwstel aan het zicht kunnen worden
      onttrokken;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel26
  - number: 26.1.c.2°
    text: |-
      een heklicht op elk ander schip dat van achteren over de volle breedte zichtbaar is; indien, behalve de duwboot,
      meer dan twee schepen van achteren zichtbaar zijn, moet dit licht alleen door de schepen aan de buitenzijden worden
      gevoerd.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel26
  - number: '26.2'
    text: |-
      Een duwstel met een lengte van 110 meter of minder en met een breedte van 12 meter of minder, dat varende is, moet
      de lichten voeren voorgeschreven bij [artikel 23][ref1] voor een werktuiglijk voortbewogen schip.


      [ref1]: https://wetten.overheid.nl/BWBR0005315#Artikel23
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005315
        artikel: '23'
        hoofdstuk: '3'
  - number: '27.1'
    text: 'Een onmanoeuvreerbaar schip moet voeren:'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel27
  - number: 27.1.a
    text: |-
      twee rondom zichtbare rode heldere lichten, het ene loodrecht onder het ander, daar waar deze het best kunnen
      worden gezien. Wanneer het vaart door het water loopt tevens het toplicht of de toplichten, de zijdelichten en
      het heklicht;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel27
  - number: 27.1.b
    text: twee ballen, de ene loodrecht onder de andere, daar waar deze het best kunnen worden gezien.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel27
  - number: '27.2'
    text: 'Een beperkt manoeuvreerbaar schip moet voeren:'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel27
  - number: 27.2.a
    text: |-
      drie rondom zichtbare heldere lichten, in verticale lijn, daar waar deze het best kunnen worden gezien; het
      bovenste en onderste licht moeten rood en het middelste licht moet wit zijn;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel27
  - number: 27.2.b
    text: |-
      drie dagmerken, in verticale lijn, daar waar deze het best kunnen worden gezien; het bovenste en het onderste
      dagmerk moeten een bal en het middelste moet een ruit zijn;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel27
  - number: 27.2.c
    text: |-
      aan de zijde waar het vaarwater niet vrij is, daar waar deze het best kunnen worden gezien, twee rondom zichtbare
      rode heldere lichten, het ene loodrecht onder het andere, of twee ballen, de ene loodrecht onder de andere;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel27
  - number: 27.2.d
    text: |-
      aan de zijde waar het vaarwater vrij is, daar waar deze het best kunnen worden gezien, twee rondom zichtbare groene
      heldere lichten, het ene loodrecht onder het andere of twee ruiten de ene loodrecht onder de andere;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel27
  - number: 27.2.e
    text: wanneer het vaart door het water loopt, tevens het toplicht of de toplichten, de zijdelichten en het heklicht;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel27
  - number: 27.2.f
    text: |-
      wanneer ankers uitstaan, zodanig dat deze een gevaar voor de scheepvaart kunnen vormen, moet de ligging ervan
      worden aangeduid door een gele drijver voorzien van een radarreflector en een rondom zichtbaar geel of wit helder
      licht.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel27
  - number: '27.3'
    text: |-
      Een bijzonder transport moet de lichten of de dagmerken voeren voorgeschreven voor een onmanoeuvreerbaar schip.
      Indien dit niet uitvoerbaar is moeten alle maatregelen worden genomen om het bijzonder transport goed te verlichten
      of om zijn aanwezigheid goed zichtbaar aan te duiden.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel27
  - number: '27.4'
    text: Het bepaalde in dit artikel is eveneens van toepassing op zeeschepen.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel27
  - number: '28'
    text: 'Een bovenmaats zeeschip dat varende is, moet voeren, daar waar dit het best kan worden gezien:'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel28
  - number: 28.a
    text: |-
      behalve de lichten voorgeschreven voor een werktuiglijk voortbewogen schip, drie rondom zichtbare rode krachtige
      lichten geplaatst in verticale lijn;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel28
  - number: 28.b
    text: een cylinder.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel28
  - number: '29.1'
    text: 'Een klein werktuiglijk voortbewogen schip dat varende is, moet voeren:'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel29
  - number: 29.1.a
    text: |-
      een toplicht. Dit licht moet echter een helder licht zijn. Dit licht mag op het voorschip dan wel achterlijker zijn
      geplaatst. Het moet ten minste 1 meter hoger dan de zijdelichten zijn aangebracht maar het mag lager dan 4 meter
      boven de romp zijn geplaatst;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel29
  - number: 29.1.b
    text: |-
      zijdelichten. Deze lichten moeten zich op gelijke hoogte en in één lijn loodrecht op de lengte-as van het schip
      bevinden. Zij behoeven niet achterlijker dan het toplicht te zijn geplaatst. Zij moeten naar de binnenzijde
      van het schip zodanig zijn afgeschermd, dat het groene licht niet aan bakboordzijde en het rode licht niet aan
      stuurboordzijde kan worden gezien. Zij mogen worden verenigd in één lantaarn, gevoerd in de lengte-as van het
      schip;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel29
  - number: 29.1.c
    text: |-
      een heklicht. Dit licht mag worden weggelaten indien het onder *a* bedoelde toplicht vervangen wordt door een
      rondom zichtbaar wit helder licht.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel29
  - number: '29.2'
    text: |-
      Een klein werktuiglijk voortbewogen schip dat varende is, waarvan de lengte minder is dan 7 meter en de hoogst
      bereikbare snelheid niet meer dan 7 zeemijlen (13 kilometer) per uur, mag, in plaats van de in het eerste lid
      voorgeschreven lichten, een rondom zichtbaar wit helder licht voeren, daar waar dit het best kan worden gezien.
      Indien uitvoerbaar, moet zulk een schip ook zijdelichten voeren.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel29
  - number: '29.3'
    text: |-
      Een klein werktuiglijk voortbewogen schip dat slechts kleine schepen sleept dan wel slechts langszijde daarvan
      vastgemaakte kleine schepen voortbeweegt, moet de in het eerste lid voorgeschreven lichten voeren.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel29
  - number: '29.4'
    text: |-
      Een klein schip dat wordt gesleept dan wel langszijde van een ander schip vastgemaakt wordt voortbewogen, moet een
      rondom zichtbaar wit helder licht voeren, daar waar dit het best kan worden gezien. Bijboten van schepen behoeven
      dit licht niet te voeren.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel29
  - number: '29.5'
    text: 'Een klein zeilschip dat varende is moet voeren:'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel29
  - number: 29.5.a
    text: |-
      hetzij de zijdelichten en een heklicht. De zijdelichten moeten zich op gelijke hoogte en in één lijn loodrecht
      op de lengte-as van het schip bevinden. Zij moeten worden aangebracht op een plaats, waar zij niet door de zeilen
      worden afgeschermd. Zij moeten naar de binnenzijde van het schip zodanig zijn afgeschermd dat het groene licht niet
      aan bakboordzijde en het rode licht niet aan stuurboordzijde kan worden gezien. Zij mogen worden verenigd in één
      lantaarn, gevoerd in de lengte-as van het schip;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel29
  - number: 29.5.b
    text: |-
      hetzij de zijdelichten en een heklicht, gecombineerd in één lantaarn die is geplaatst op de top van de mast dan wel
      nabij de top van de mast zodanig dat zij rondom zichtbaar is;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel29
  - number: 29.5.c
    text: |-
      hetzij, voor een schip met een lengte van minder dan 7 meter, een rondom zichtbaar wit gewoon licht, daar waar dit
      het best kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel29
  - number: '29.6'
    text: Een klein door spierkracht voortbewogen schip dat varende is, moet een rondom zichtbaar wit gewoon licht voeren.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel29
  - number: '29.7'
    text: |-
      Een klein schip dat ten anker of gemeerd ligt moet, tenzij het vanaf de wal voldoende wordt verlicht, daar waar dit
      het best kan worden gezien, een rondom zichtbaar wit gewoon licht voeren.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel29
  - number: '29.8'
    text: |-
      Het bepaalde bij [artikel 25][ref1] is van overeenkomstige toepassing op kleine schepen. De voorgeschreven
      dagmerken mogen van kleinere afmetingen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005315#Artikel25
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005315
        artikel: '25'
        hoofdstuk: '3'
  - number: '29.9'
    text: |-
      Een klein schip moet zijn voorzien van een deugdelijke radarreflector, bij zeilschepen ten minste 4 meter boven het
      wateroppervlak, en bij werktuiglijk voortbewogen schepen zo hoog mogelijk boven de opbouw.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel29
  - number: '30.1'
    text: |-
      Ten anker liggende schepen Een ten anker liggend schip moet op het voorschip, op een hoogte van ten minste 3 meter,
      een rondom zichtbaar wit helder licht voeren of een bal en op het achterschip een tweede wit licht van gelijke
      inrichting en sterkte, ten minste 2 meter lager dan het eerstgenoemde licht. Wanneer schepen gekoppeld ten anker
      liggen moet elk van die schepen de lichten of het dagmerk voeren als hierboven omschreven.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel30
  - number: '30.2'
    text: Gemeerde schepen
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel30
  - number: 30.2.a
    text: |-
      Een gemeerd schip moet voeren, tenzij het vanaf de wal voldoende wordt verlicht, aan de zijde van het vaarwater en
      zo mogelijk ter hoogte van het dek op het voorschip en aan of nabij het hek: een rondom zichtbaar wit helder licht.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel30
  - number: 30.2.b
    text: |-
      Een gemeerd schip dat een anker heeft uitstaan dat gevaar kan opleveren voor de scheepvaart moet de lichten bedoeld
      in het eerste lid voeren en een bijkomend rondom zichtbaar wit helder licht ongeveer 1 meter onder het licht dat
      zich het dichtst nabij dit anker bevindt.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel30
  - number: '30.3'
    text: Aan de grond zittende of gezonken schepen en andere obstakels voor de scheepvaart
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel30
  - number: 30.3.a
    text: |-
      Een schip dat aan de grond zit of gezonken is en elk ander obstakel voor de scheepvaart, moet voeren daar waar dit
      het best kan worden gezien: - de lichten voorgeschreven in het eerste lid;
        - twee rondom zichtbare rode heldere lichten, het ene loodrecht onder het andere;
        - drie ballen in verticale lijn geplaatst. Indien uitvoerbaar moet het schip of obstakel tevens de lichten en
      dagmerken voeren, die ingevolge de overige bepalingen van dit reglement van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel30
  - number: 30.3.b
    text: |-
      Indien de omstandigheden ter plaatse van het schip of van het obstakel vorderen dat wordt aangeduid dat het aan
      geen enkele zijde, aan één zijde of aan beide zijden kan worden voorbijgevaren, moeten in plaats van de onder *a*
      bedoelde lichten of dagmerken, worden gevoerd:
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel30
  - number: 30.3.b.1°
    text: |-
      aan de zijde of de zijden waar de doorvaart niet vrij is: twee rondom zichtbare rode heldere lichten, het ene
      loodrecht onder het andere of twee ballen, de ene loodrecht onder de andere, daar waar deze het best kunnen worden
      gezien;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel30
  - number: 30.3.b.2°
    text: |-
      aan de zijde of de zijden waar de doorvaart vrij is: twee rondom zichtbare groene heldere lichten, het ene
      loodrecht onder het andere of twee ruiten, de ene loodrecht onder de andere, daar waar deze het best kunnen worden
      gezien.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel30
  - number: 30.3.c
    text: |-
      De bevoegde autoriteit kan ontheffing verlenen van de verplichting tot het voeren van de onder *a* en *b*
      voorgeschreven lichten en dagmerken.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel30
  - number: 30.3.d
    text: |-
      Indien de lichten of de dagmerken niet door het schip of het obstakel zelf kunnen worden gevoerd, moeten zij worden
      aangebracht op een andere doelmatige wijze.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel30
  - number: '30.4'
    text: Het bepaalde in dit artikel is eveneens van toepassing op zeeschepen.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel30
  - number: '31.1'
    text: |-
      Een schip belast met een bijzondere politieopdracht kan zowel bij dag als bij nacht, behalve de lichten en de
      dagmerken elders voorgeschreven door dit reglement, een blauw helder flikkerlicht voeren. Indien twee of meer
      dergelijke schepen dat blauwe flikkerlicht voeren, is de tussen deze schepen gelegen zone voor de scheepvaart
      verboden.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel31
  - number: '31.2'
    text: |-
      Behoudens de lichten voorgeschreven voor zijn soort mag een varend of ten anker liggend schip bezig met
      werkzaamheden zowel bij dag als bij nacht, daar waar dit het best kan worden gezien, een geel helder flikkerlicht
      voeren om aan te duiden dat het die werkzaamheden uitvoert.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel31
  - number: '31.3'
    text: |-
      Ten anker liggende, gemeerde, aan de grond zittende of gezonken schepen, met inbegrip van zeeschepen, waarvoor
      gevaar voor golfslag of zuiging veroorzaakt door voorbijvarende schepen zou kunnen ontstaan moeten, behalve de
      lichten en de dagmerken elders in dit reglement voorgeschreven, voeren:
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel31
  - number: 31.3.a
    text: |-
      twee heldere lichten, het ene loodrecht onder het andere, het bovenste rood en het onderste wit, op een zodanige
      hoogte dat zij rondom zichtbaar zijn en niet met andere lichten kunnen worden verward;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel31
  - number: 31.3.b
    text: |-
      een vlag met twee horizontale banen van gelijke breedte, de bovenste rood en de onderste wit, op een geschikte
      plaats en op een zodanige hoogte dat zij rondom zichtbaar is. Deze vlag mag worden vervangen door twee vlaggen
      waarvan de bovenste rood en de onderste wit is. De vlaggen mogen worden vervangen door borden van vermelde kleuren.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel31
  - number: '31.4'
    text: |-
      Een veerpont voert bij nacht behoudens de zijdelichten en het heklicht een rondom zichtbaar groen helder licht
      ongeveer 1 meter boven een rondom zichtbaar wit helder licht, daar waar deze het best kunnen worden gezien.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel31
  - number: '31.5'
    text: |-
      Drijvende leidingen, die vast verbonden zijn aan de wal of aan ten anker liggende of gemeerde schepen, en die
      de scheepvaart kunnen hinderen, moeten over de gehele lengte worden aangeduid door rondom zichtbare gele gewone
      lichten of gele vlaggen geplaatst op een onderlinge afstand van ten hoogste 50 meter en op een hoogte van ten
      minste 1,50 meter boven de leiding.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel31
  - number: '32'
    text: 'In dit reglement wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel32
  - number: 32.a
    text: 'fluit: elk middel geschikt tot het geven van de voorgeschreven korte en lange stoten;'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel32
  - number: 32.b
    text: 'korte stoot: een geluidssein van ongeveer één seconde duur;'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel32
  - number: 32.c
    text: 'lange stoot: een geluidssein van vier tot zes seconden duur.'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel32
  - number: '33.1'
    text: |-
      Een schip met een lengte van 20 meter of meer moet zijn voorzien van een fluit en van een klok. De fluit en de klok
      moeten deugdelijk zijn. De fluit moet zodanig op het schip zijn geplaatst dat de goede werking ervan niet nadelig
      wordt beïnvloed. De klok mag worden vervangen door een ander middel dat dezelfde onderscheiden geluidskenmerken
      bezit, met dien verstande dat het altijd mogelijk moet zijn om de vereiste seinen door bediening met de hand te
      geven.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel33
  - number: '33.2'
    text: |-
      Een klein schip is niet verplicht de toestellen voor het geven van geluidsseinen voorgeschreven in het eerste lid,
      aan boord te hebben, doch indien het deze niet heeft, moet het zijn voorzien van een ander middel voor het geven
      van een doelmatig geluidssein.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel33
  - number: '33.3'
    text: |-
      De in dit reglement vermelde geluidsseinen mogen alleen worden gegeven in de omstandigheden en voor de doeleinden
      voorzien bij dit reglement.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel33
  - number: 34.1.a
    text: |-
      Behoudens wanneer het een klein schip is, moet een varend schip, indien het handelt ter voorkoming van aanvaring
      met een ander in zicht zijnd schip, zijn handeling door een der volgende seinen kenbaar maken: - één korte stoot
      voor: ik verander mijn koers naar stuurboord;
        - twee korte stoten voor: ik verander mijn koers naar bakboord;
        - drie korte stoten voor: ik sla achteruit;
        - vier korte stoten voor: ik kan niet manoeuvreren. Een zeeschip mag in de hierbedoelde omstandigheden genoemde
      geluidsseinen aanvullen met lichtseinen, gegeven met een rondom zichtbaar wit krachtig licht, die zonodig kunnen
      worden herhaald. Deze lichtseinen hebben de volgende betekenis: - één schittering: ik verander mijn koers naar
      stuurboord;
        - twee schitteringen: ik verander mijn koers naar bakboord;
        - drie schitteringen: ik sla achteruit;
        - vier schitteringen: ik kan niet manoeuvreren. De duur van elke schittering moet ongeveer één seconde zijn, de
      tijdsruimte tussen de schitteringen ongeveer één seconde en de tijdsruimte tussen de achtereenvolgende seinen niet
      minder dan tien seconden.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel34
  - number: 34.1.b
    text: |-
      Wanneer schepen die in zicht van elkaar zijn, elkaar naderen en één van die schepen de voornemens of handelingen
      van het andere niet begrijpt dan wel twijfelt of het andere voldoende handelingen verricht om aanvaring te
      voorkomen, moet eerstgenoemd schip die twijfel kenbaar maken door het geven van een reeks van ten minste vijf
      snel opeenvolgende zeer korte stoten. Deze verplichting geldt niet voor kleine schepen. Een zeeschip mag in de
      hierbedoelde omstandigheden genoemd geluidssein aanvullen met een lichtsein bestaande uit een reeks van ten minste
      vijf snel opeenvolgende zeer korte schitteringen gegeven met een rondom zichtbaar wit krachtig licht.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel34
  - number: 34.1.c
    text: |-
      Behoudens wanneer het een klein schip is, moet een werktuiglijk voortbewogen binnenschip, gelijktijdig met de
      gegeven geluidsseinen, lichtseinen geven van dezelfde duur met een rondom zichtbaar geel helder licht. Deze
      bepaling geldt niet voor de klokslagen of reeksen klokslagen.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel34
  - number: '34.2'
    text: |-
      Een aan de grond zittend schip, waarvan de voortstuwingswerktuigen in werking zijn, moet dit aan naderende schepen
      kenbaar maken door vier korte stoten gevolgd door twee lange stoten.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel34
  - number: '35.1'
    text: |-
      De geluidsseinen genoemd in dit artikel moeten zowel overdag als bij nacht worden gegeven in of nabij een gebied
      met beperkt zicht.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel35
  - number: 35.2.a
    text: |-
      Een werktuiglijk voortbewogen schip, een duwstel of een gekoppeld samenstel dat vaart door het water loopt moet,
      met tussenpozen van niet meer dan twee minuten, één lange stoot geven.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel35
  - number: 35.2.b
    text: |-
      Een werktuiglijk voortbewogen schip, een duwstel of een gekoppeld samenstel, dat varende is, doch geen vaart door
      het water loopt, moet, met tussenpozen van niet meer dan twee minuten, twee lange stoten geven, gescheiden door een
      tussenpoos van ongeveer twee seconden.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel35
  - number: 35.2.c
    text: |-
      Een onmanoeuvreerbaar schip, een beperkt manoeuvreerbaar schip, een bovenmaats zeeschip of een schip dat een ander
      schip sleept, dat varende is moet, in de plaats van de seinen voorgeschreven onder *a* en *b,* met tussenpozen van
      niet meer dan twee minuten, één lange stoot gevolgd door twee korte stoten geven.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel35
  - number: 35.2.d
    text: |-
      Een schip dat wordt gesleept of, in geval meer dan één schip wordt gesleept, het laatste schip van de sleep, moet,
      met tussenpozen van niet meer dan twee minuten, één lange stoot gevolgd door drie korte stoten geven.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel35
  - number: '35.3'
    text: |-
      Een ten anker liggend schip moet met tussenpozen van niet meer dan één minuut snel de klok luiden gedurende
      ongeveer vijf seconden. Een ten anker liggend schip mag bovendien één korte, één lange en één korte stoot geven om
      een naderend schip te waarschuwen.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel35
  - number: '35.4'
    text: |-
      Een schip dat aan de grond zit moet het sein met de klok, bedoeld in het derde lid, geven en bovendien drie van
      elkaar gescheiden duidelijke slagen op de klok, onmiddellijk vóór en onmiddellijk na het snelle luiden van de klok.
      Het schip mag daarenboven twee korte stoten gevolgd door een lange stoot geven.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel35
  - number: '35.5'
    text: |-
      Een veerpont die varende is moet met tussenpozen van niet meer dan één minuut één lange stoot gevolgd door vier
      korte stoten geven.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel35
  - number: '36.1'
    text: |-
      Wanneer het nodig is om de aandacht te trekken van een ander schip mag elk schip een licht- of een geluidssein
      geven dat niet kan worden verward met een bij dit reglement voorzien sein noch met een licht of een sein dat bij de
      betonning of bij de bebakening in gebruik is. Het mag tevens zijn zoeklicht laten schijnen in de richting van het
      gevaar, zonder daardoor een ander schip te hinderen of in verwarring te brengen.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel36
  - number: '36.2'
    text: |-
      Een schip dat een bocht of een gedeelte van het vaarwater nadert waar het zicht is belemmerd door omstandigheden
      die geen verband houden met beperkt zicht, moet tijdig als waarschuwingssein één lange stoot geven.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel36
  - number: '36.3'
    text: |-
      Eveneens moet een lange stoot als waarschuwingssein worden gegeven, indien het onder bijzondere omstandigheden
      nodig is de aandacht te trekken ter voorkoming van aanvaringen.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel36
  - number: '36.4'
    text: Zonodig moeten de in dit artikel bedoelde seinen tijdig worden herhaald.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel36
  - number: '36.5'
    text: Het gebruik van zeer felle flikker- of zwaailichten zoals "strobe"-lichten om de aandacht te trekken, is verboden.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel36
  - number: '37'
    text: |-
      Indien een schip in nood verkeert en hulp verlangt, gebruikt, toont of geeft het de volgende seinen, hetzij
      gezamenlijk hetzij afzonderlijk:
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel37
  - number: 37.a
    text: een aanhoudend geluid met een toestel voor mistseinen;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel37
  - number: 37.b
    text: een daartoe geëigend sein, door middel van radiotelegrafie of enige andere seinwijze uitgezonden;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel37
  - number: 37.c
    text: een daartoe geëigend sein, uitgezonden door middel van radiotelefonie;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel37
  - number: 37.d
    text: een rooksignaal dat oranje gekleurde rook afgeeft;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel37
  - number: 37.e
    text: langzaam en herhaald op en neer bewegen van de naar beide zijden uitgestrekte armen;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel37
  - number: 37.f
    text: seinen uitgezonden door noodradiobakens die de positie aanduiden;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel37
  - number: 37.g
    text: een licht of een vlag of ieder ander geschikt voorwerp waarmee in het rond wordt gezwaaid;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel37
  - number: 37.h
    text: reeksen klokslagen of herhaalde lange stoten.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel37
  - number: '38.1'
    text: |-
      Het is verboden te varen met een schip of samenstel dat de hieronder vermelde grootst toegelaten afmetingen en
      diepgang, uitgaande van een waterstand in het kanaal van Normaal Amsterdams Peil + 2,13 meter in zoet water,
      overschrijdt:
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel38
  - number: 38.1.a
    text: 'voor zeeschepen: lengte: 265 meter breedte: 34 meter diepgang:'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel38
  - number: 38.1.a.1
    text: 12,50 meter in opvaart
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel38
  - number: 38.1.a.2°
    text: 12,30 meter in afvaart;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel38
  - number: 38.1.b
    text: |-
      voor binnenschepen en gekoppelde samenstellen: lengte: 140,00 meter breedte: 23,00 meter diepgang: 4,30 meter wat
      de Oostsluis betreft;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel38
  - number: 38.1.c
    text: 'voor duwstellen: lengte: 200 meter breedte: 23 meter diepgang: 4,30 meter wat de Oostsluis betreft;'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel38
  - number: 38.1.d
    text: 'diepgang op de toeleidings- en zijkanalen:'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel38
  - number: 38.1.d.1
    text: 'toeleidingskanaal naar de Middensluis: 7,25 meter'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel38
  - number: 38.1.d.2
    text: 'toeleidingskanaal naar de Oostsluis: 4,30 meter'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel38
  - number: 38.1.d.3
    text: 'Axelse Vlakte te Sluiskil: 9,00 meter'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel38
  - number: 38.1.d.4
    text: 'Zijkanaal F (naar Passluis): 2,60 meter'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel38
  - number: 38.1.d.5
    text: 'Zijkanaal G (naar Sas van Gent): 5,00 meter.'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel38
  - number: '38.2'
    text: |-
      De bevoegde autoriteit kan vrijstelling of ontheffing verlenen van de in het eerste lid vermelde grootst toegelaten
      afmetingen en diepgang.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel38
  - number: '39.1'
    text: |-
      Een schip moet tijdig voor het invaren van een sluis zijn gemeld bij de bevoegde autoriteit volgens de door deze
      gestelde regels.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel39
  - number: '39.2'
    text: |-
      Behoudens toestemming van de bevoegde autoriteit mag een schip geen ligplaats nemen op de wachtplaats van een sluis
      anders dan om te worden geschut.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel39
  - number: '39.3'
    text: |-
      Op een wachtplaats van een sluis en in een sluis moet een schip, dat met een marifooninstallatie is uitgerust,
      uitluisteren op het daartoe aangewezen kanaal.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel39
  - number: '39.4'
    text: |-
      Tenzij de bevoegde autoriteit anders bepaalt, geschiedt het invaren in een sluis in volgorde van aankomst op een
      door de bevoegde autoriteit aangewezen plaats. Een klein schip dat samen met andere schepen wordt geschut mag de
      sluis slechts invaren na deze andere schepen.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel39
  - number: '39.5'
    text: 'Recht van voorrang bij schutting hebben, in de hierna genoemde volgorde:'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel39
  - number: 39.5.a
    text: |-
      schepen van toezichthoudende ambtenaren en brandweerboten die in verband met spoedeisende redenen van
      dienstvervulling onderweg zijn;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel39
  - number: 39.5.b
    text: schepen waaraan de bevoegde autoriteit het recht van voorrang bij schutting heeft toegekend.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel39
  - number: '39.6'
    text: |-
      De kapitein of schipper is verplicht te zorgen dat bij het invaren van een sluis de nodige meertrossen gereed
      worden gehouden. De kapitein van een zeeschip is bovendien verplicht te zorgen dat aan boord en op de wal het
      nodige daartoe bekwame personeel aanwezig is om die trossen aan te nemen en vast te maken.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel39
  - number: '39.7'
    text: |-
      Het is verboden zeilen te voeren bij het naderen van de wachtplaatsen, bij het in- of uitvaren van een sluis en
      tijdens het schutten.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel39
  - number: '39.8'
    text: 'In een sluis:'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel39
  - number: 39.8.a
    text: moet een schip ligplaats nemen binnen de door stopstrepen of op andere wijze aangegeven grenzen;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel39
  - number: 39.8.b
    text: |-
      moet tijdens het vullen en het ledigen van de sluiskolk en totdat het uitvaren van de sluis wordt toegestaan een
      schip zodanig zijn gemeerd en moet het zijn meerdraden zodanig vieren of doorhalen, dat het niet de sluismuren, de
      sluisdeuren, de beschermingsinrichtingen of andere schepen kan beschadigen;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel39
  - number: 39.8.c
    text: mag een schip slechts voorwerpen die niet kunnen zinken als wrijfhout gebruiken;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel39
  - number: 39.8.d
    text: mag een schip geen water op het sluisterrein of op andere schepen storten of laten vloeien;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel39
  - number: 39.8.e
    text: |-
      mag een schip, zodra het is gemeerd en totdat het uitvaren van de sluis wordt toegestaan, geen gebruik maken van
      de voortstuwingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel39
  - number: '39.9'
    text: |-
      Op een wachtplaats van een sluis en in een sluis moet een schip een zijwaartse afstand van ten minste
      10 meter in acht nemen ten opzichte van een schip dat een blauw licht of een blauwe kegel, bedoeld
      in [artikel 25, tweede lid, onder ][ref1] hetzij een rood licht of de seinvlag "B", bedoeld in
      [artikel 25, eerste lid][ref2], voert. Deze verplichting geldt niet voor schepen die hetzelfde licht of dagmerk
      voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0005315#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0005315#Artikel25
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005315
        artikel: '25'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005315
        artikel: '25'
        hoofdstuk: '3'
  - number: '39.10'
    text: |-
      Een schip dat twee of drie blauwe lichten dan wel twee of drie blauwe kegels, bedoeld in
      [artikel 25, tweede lid onder ][ref1] voert, mag een sluis niet invaren indien het niet afzonderlijk zou worden
      geschut. Een ander schip mag een sluis niet invaren indien het samen met een schip dat deze lichten of dagmerken
      voert, zou worden geschut. Het voorgaande is niet van toepassing op schepen die onderling hetzelfde sein voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0005315#Artikel25
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005315
        artikel: '25'
        hoofdstuk: '3'
  - number: '39.11'
    text: |-
      Een schip dat een blauw licht of een blauwe kegel, bedoeld in [artikel 25, tweede lid onder ][ref1] hetzij een rood
      licht of de seinvlag "B", bedoeld in [artikel 25, eerste lid][ref2], voert, mag een sluis niet invaren indien het
      samen met een passagiersschip zou worden geschut. Een passagiersschip mag een sluis niet invaren indien het samen
      met een schip dat deze lichten of dagmerken voert, zou worden geschut.


      [ref1]: https://wetten.overheid.nl/BWBR0005315#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0005315#Artikel25
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005315
        artikel: '25'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005315
        artikel: '25'
        hoofdstuk: '3'
  - number: '39.12'
    text: De bevoegde autoriteit kan in afwijking van het negende, tiende en elfde lid anders bepalen.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel39
  - number: '40'
    text: Een bijzonder transport mag slechts varen met de toestemming van de bevoegde autoriteit.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel40
  - number: '41.1'
    text: |-
      Werktuiglijk voortbewogen schepen die zorgen voor de voortbeweging van een samenstel moeten daartoe geschikt en
      uitgerust zijn en voldoende vermogen hebben om de goede bestuurbaarheid en manoeuvreerbaarheid van het geheel te
      verzekeren.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel41
  - number: '41.2'
    text: |-
      De koppelingen van een duwstel moeten de hechtheid daarvan verzekeren. Ze moeten gelijkmatig gespannen worden
      gehouden door geschikte inrichtingen. Het koppelen en ontkoppelen moet op veilige, eenvoudige en gemakkelijke wijze
      kunnen geschieden.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel41
  - number: '41.3'
    text: |-
      Een duwstel mag alleen van een sleepboot gebruik maken in uitzonderlijke en plaatselijke omstandigheden en wanneer
      de scheepvaart daarvan geen hinder ondervindt.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel41
  - number: '41.4'
    text: Het is verboden met een duwstel of een gekoppeld samenstel sleepdienst te verrichten.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel41
  - number: '41.5'
    text: |-
      Indien aan de kop van een duwstel uitsluitend een zeeschipbak is geplaatst, dan moet deze van een kopbak zijn
      voorzien.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel41
  - number: '41.6'
    text: Het is verboden te varen met een gekoppeld samenstel dat uit meer dan twee schepen bestaat.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel41
  - number: '41.7'
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel41
  - number: 41.7.a
    text: meer dan één schip te slepen;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel41
  - number: 41.7.b
    text: een binnenschip te slepen waarvan de lengte meer dan 110 meter bedraagt;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel41
  - number: 41.7.c
    text: |-
      te slepen indien de afstand tussen het hek van het slepende schip en de boeg van het gesleepte binnenschip meer dan
      40 meter bedraagt.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel41
  - number: '41.8'
    text: |-
      Op een sleep dienen zodanige maatregelen getroffen te zijn dat een goede communicatie tussen het slepende schip en
      het gesleepte schip of drijvend voorwerp is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel41
  - number: '41.9'
    text: De bevoegde autoriteit kan ontheffing verlenen van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel41
  - number: '42.1'
    text: |-
      Een schip dat niet varende is en dat is geladen met gevaarlijke stoffen, bedoeld in de bij dit besluit behorende
      [bijlagen 1][ref1], [2][ref2], [3][ref3] of [4][ref4], moet onder toezicht staan van een zich voortdurend aan
      boord bevindende ter zake kundige wachtsman.


      [ref1]: https://wetten.overheid.nl/BWBR0005315
      [ref2]: https://wetten.overheid.nl/BWBR0005315
      [ref3]: https://wetten.overheid.nl/BWBR0005315
      [ref4]: https://wetten.overheid.nl/BWBR0005315
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005315
      - id: ref2
        bwb_id: BWBR0005315
      - id: ref3
        bwb_id: BWBR0005315
      - id: ref4
        bwb_id: BWBR0005315
  - number: '42.2'
    text: |-
      Een ander schip dat niet varende is, moet, wanneer het geen kapitein of schipper aan boord heeft, onder toezicht
      staan van een persoon die zonodig snel kan ingrijpen.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel42
  - number: '42.3'
    text: |-
      Aan boord van een schip dat niet varende is en dat is uitgerust met een marifooninstallatie, moet een persoon
      luisterwacht houden op een door de bevoegde autoriteit aangewezen marifoonkanaal en bij het oproepen door de
      bevoegde autoriteit daarop antwoord geven.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel42
  - number: '42.4'
    text: De bevoegde autoriteit kan ontheffing verlenen van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel42
  - number: '43.1'
    text: De kapitein of schipper moet onverwijld de bevoegde autoriteit melden indien een schip
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel43
  - number: 43.1.a
    text: aan de grond is geraakt of gezonken, of
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel43
  - number: 43.1.b
    text: |-
      in aanraking is gekomen met een ander schip en daarbij schade van betekenis is ontstaan of zich persoonlijke
      ongevallen hebben voorgedaan, of
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel43
  - number: 43.1.c
    text: een boei, baken of kunstwerk heeft aangevaren, verplaatst of beschadigd, of
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel43
  - number: 43.1.d
    text: lading, brandstof of voorwerpen heeft verloren of dreigt te verliezen, of
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel43
  - number: 43.1.e
    text: brand aan boord heeft, of
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel43
  - number: 43.1.f
    text: |-
      zodanige schade heeft opgelopen dat de manoeuvreerbaarheid van het schip of de veiligheid door die schade wordt
      beïnvloed, of
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel43
  - number: 43.1.g
    text: een hindernis in de vaarweg aantreft.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel43
  - number: '43.2'
    text: |-
      Wanneer er tevens gevaar, schade of hinder voor de scheepvaart kan ontstaan, moet de kapitein of schipper bovendien
      de naderende vaart waarschuwen.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel43
  - number: '43.3'
    text: |-
      De kapitein of schipper van een schip dat behoort tot een door de bevoegde autoriteit aangewezen categorie van
      schepen, moet zich in de door die bevoegde autoriteit aangegeven gevallen melden. De bevoegde autoriteit kan nadere
      voorschriften stellen met betrekking tot de inhoud van de melding en de wijze waarop de melding plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel43
  - number: '44.1'
    text: |-
      Een schip mag geen voorwerpen hebben uitsteken, tenzij daarmee geen hinder of gevaar voor de scheepvaart en geen
      schade aan andere schepen en aan kunstwerken kan worden veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel44
  - number: '44.2'
    text: Een schip moet een anker waarvan geen gebruik wordt gemaakt geheel inhieuwen.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel44
  - number: '45.1'
    text: |-
      De kapitein of schipper moet de nodige maatregelen nemen om het vaarwater zo spoedig mogelijk vrij te maken,
      indien een schip is vastgevaren of gezonken, of indien een door een schip verloren voorwerp het vaarwater geheel of
      gedeeltelijk verspert of dreigt te versperren.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel45
  - number: '45.2'
    text: Het eerste lid geldt ook voor de kapitein of schipper wiens schip dreigt te zinken of onmanoeuvreerbaar wordt.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel45
  - number: '45.3'
    text: |-
      Indien vanaf een schip stoffen of voorwerpen te water raken, moet de kapitein of schipper er voor zorgen dat deze
      zo spoedig mogelijk worden opgeruimd.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel45
  - number: '45.4'
    text: |-
      Bij de in het eerste, tweede en derde lid gestelde verplichtingen moeten de aanwijzingen van de bevoegde autoriteit
      worden opgevolgd.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel45
  - number: '46'
    text: |-
      Schepen mogen alleen geladen of gelost worden op de daartoe bestemde of door de bevoegde autoriteit aangewezen
      plaatsen.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel46
  - number: '47'
    text: |-
      Het is verboden herstellings-, schoonmaak-, ontgassings-, ontsmettings-of andere werkzaamheden op of aan schepen
      te verrichten wanneer deze gevaar, schade of hinder voor de scheepvaart kunnen opleveren, tenzij die werkzaamheden
      plaatsvinden:
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel47
  - number: 47.a
    text: met toestemming van de bevoegde autoriteit, of
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel47
  - number: 47.b
    text: op een scheepswerf dan wel op of aan het terrein van een herstellingsinrichting.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel47
  - number: '48'
    text: 'Behoudens vergunning van de bevoegde autoriteit is het verboden:'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel48
  - number: 48.a
    text: een schip op een ligplaats te gebruiken als opslagplaats of voor het uitoefenen van een bedrijf;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel48
  - number: 48.b
    text: met een schip, al dan niet varend, goederen of diensten aan te bieden;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel48
  - number: 48.c
    text: schepen te slopen;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel48
  - number: 48.d
    text: zich met een schip te vestigen tot het houden van vast verblijf of het verlenen van huisvesting;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel48
  - number: 48.e
    text: een schip vanaf de wal te water te laten of met een schip proef te draaien.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel48
  - number: '49'
    text: |-
      Zonder vergunning van de bevoegde autoriteit is het verboden een sportevenement, een waterfeest of een
      vergelijkbare gebeurtenis te houden.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel49
  - number: 49a.1
    text: |-
      Schepen van handhavingsdiensten en brandweer, en reddingsvaartuigen betrokken bij reddingsoperaties mogen,
      behoudens het bepaalde in [artikel 3][ref1], afwijken van de voorschriften van dit besluit voor zover dat voor een
      goede vervulling van hun taak noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0005315#Artikel3
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0005315
        artikel: '3'
        hoofdstuk: '1'
  - number: 49a.2
    text: |-
      [Artikel 31, eerste lid][ref1], is van overeenkomstige toepassing op schepen van de brandweer die hulp bieden of
      daartoe op weg zijn en op reddingsvaartuigen die betrokken zijn bij een reddingsoperatie met toestemming van de
      Rijkshavenmeester Westerschelde.


      [ref1]: https://wetten.overheid.nl/BWBR0005315#Artikel31
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0005315
        artikel: '31'
        hoofdstuk: '3'
  - number: 49b.1
    text: |-
      Zwemmen, onderwatersport, watersport zonder gebruik te maken van een schip, waterskiën of doen waterskiën of op
      soortgelijke wijze van het vaarwater gebruik maken of gebruik doen maken, varen met een waterscooter, varen met
      een zeilplank of varen met een door een vlieger voortbewogen plank, vinden niet plaats in het toepassingsgebied als
      omschreven in [artikel 1, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005315#Artikel1
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel49b
    references:
      - id: ref1
        bwb_id: BWBR0005315
        artikel: '1'
        hoofdstuk: '1'
  - number: 49b.2
    text: De bevoegde autoriteit kan vrijstelling of ontheffing verlenen van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel49b
  - number: '50'
    text: Aan toestemmingen, ontheffingen, vrijstellingen en vergunningen kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel50
  - number: '51'
    text: |-
      De verkeerstekens die kunnen worden aangebracht en hun betekenis zijn vermeld in de bij dit besluit behorende
      [bijlagen 5][ref1] en [6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005315
      [ref2]: https://wetten.overheid.nl/BWBR0005315
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005315
      - id: ref2
        bwb_id: BWBR0005315
  - number: 51a
    text: |-
      Een schip gebruikt geen verkeerstekens om daaraan te meren of daaraan te verhalen, beschadigt ze niet en maakt ze
      niet ongeschikt voor hun bestemming.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel51a
  - number: 51b.1
    text: |-
      Een schip neemt niet deel aan de scheepvaart indien het zodanig is beladen dat het inzinkt tot over het vlak door
      de onderkant van de inzinkingsmerken, dan wel indien het zodanig is beladen dat het een geringer vrijboord heeft
      dan blijkens de afgegeven certificaten is toegestaan.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel51b
  - number: 51b.2
    text: |-
      Een schip neemt niet deel aan de scheepvaart indien door de wijze van belading de stabiliteit in gevaar wordt
      gebracht.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel51b
  - number: 51b.3
    text: |-
      Onverminderd het bepaalde in het tweede lid, neemt een binnenschip niet deel aan de scheepvaart indien aan boord
      niet aanwezig zijn:
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel51b
  - number: 51b.3.a
    text: |-
      het certificaat van onderzoek overeenkomstig [artikel 7, tweede lid, van de Binnenvaartwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel7
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel51b
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '7'
  - number: 51b.3.b
    text: het stuwplan of de ladinglijst voor de actuele beladingstoestand;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel51b
  - number: 51b.3.c
    text: |-
      de stabiliteitsberekening, met inbegrip van de daarbij gebruikte berekeningsmethode en het resultaat daarvan, voor
      de actuele, of een vergelijkbare vorige, dan wel een standaard beladingstoestand.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel51b
  - number: '52.1'
    text: |-
      Toepassing van de [artikelen 47][ref1], [48][ref2] en [51][ref3] kan, behalve in het belang van de veiligheid of
      het vlotte verloop van het scheepvaartverkeer, geschieden in het belang van:


      [ref1]: https://wetten.overheid.nl/BWBR0005315#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0005315#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0005315#Artikel51
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0005315
        artikel: '47'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005315
        artikel: '48'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0005315
        artikel: '51'
        hoofdstuk: '5'
  - number: 52.1.a
    text: het in stand houden van scheepvaartwegen en het waarborgen van de bereikbaarheid daarvan;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel52
  - number: 52.1.b
    text: |-
      het voorkomen of beperken van schade door het scheepvaartverkeer aan de waterhuishouding, oevers en waterkeringen,
      of werken gelegen in of over scheepvaartwegen.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel52
  - number: '52.2'
    text: |-
      Toepassing van de [artikelen 47][ref1], [48][ref2] en [51][ref3] ten behoeve van een in het eerste lid genoemd
      belang kan mede geschieden in het belang van het voorkomen of beperken van:


      [ref1]: https://wetten.overheid.nl/BWBR0005315#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0005315#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0005315#Artikel51
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0005315
        artikel: '47'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005315
        artikel: '48'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0005315
        artikel: '51'
        hoofdstuk: '5'
  - number: 52.2.a
    text: hinder of gevaar door het scheepvaartverkeer voor personen die zich anders dan op een schip te water bevinden;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel52
  - number: 52.2.b
    text: |-
      schade door het scheepvaartverkeer aan de landschappelijke of natuurwetenschappelijke waarden van een gebied waarin
      scheepvaartwegen zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel52
  - number: '53.1'
    text: |-
      In het belang van de veiligheid en het vlotte verloop van het scheepvaartverkeer alsmede in het belang van de
      instandhouding van de werken kunnen door of namens de bevoegde autoriteit verkeersaanwijzingen worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel53
  - number: '53.2'
    text: |-
      Onder de in het eerste lid genoemde verkeersaanwijzingen worden mede verstaan de bekendmakingen aan de scheepvaart
      die door de bevoegde autoriteit worden uitgevaardigd.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel53
  - number: '53.3'
    text: De bekendmakingen, bedoeld in het tweede lid, worden gepubliceerd in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel53
  - number: '53.4'
    text: |-
      Kapiteins en schippers moeten aan de verkeersaanwijzingen gevolg geven en de bekendmakingen aan de scheepvaart
      naleven.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel53
  - number: '54'
    text: |-
      Aan boord van elk schip, met uitzondering van een open klein schip, waarop dit reglement van toepassing is, moet
      een volledig bijgewerkt exemplaar van dit reglement in papieren vorm of dat via een elektronisch middel op ieder
      moment geraadpleegd kan worden aanwezig zijn, en dat op eerste aanvraag van een opsporingsambtenaar door deze kan
      worden ingezien.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel54
  - number: '55'
    text: |-
      Overtreding van de bij of krachtens dit besluit vastgestelde bepalingen, alsmede overtreding van de aan een
      vergunning, ontheffing, vrijstelling of toestemming verbonden voorschriften, is een strafbaar feit.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel55
  - number: '56'
    text: |-
      Het Vaarreglement, vastgesteld bij koninklijk besluit van 8 maart 1965 (*Stb.* 133) en het Bijzonder reglement van
      politie voor het Nederlandsche gedeelte van het kanaal van Gent naar Ter Neuzen, vastgesteld bij koninklijk besluit
      van 27 januari 1912 (*Stb.* 16) worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel56
  - number: '58'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel58
  - number: '59'
    text: 'Dit besluit kan worden aangehaald als: Scheepvaartreglement voor het Kanaal van Gent naar Terneuzen.'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel59
