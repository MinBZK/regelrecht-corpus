$id: scheepvaartreglement_voor_het_kanaal_van_gent_naar_terneuzen
regulatory_layer: AMVB
publication_date: '2012-09-25'
valid_from: '2012-09-26'
bwb_id: BWBR0005315
url: https://wetten.overheid.nl/BWBR0005315/2012-09-26
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 19 januari 1990, nr. S/J 30.057/90, Directoraat-
    Generaal Scheepvaart en Maritieme Zaken;

    Gelet op de artikelen 4, 18 en 31, tiende lid, van de Scheepvaartverkeerswet (Stb. 1988, 352);

    De Raad van State gehoord (advies van 29 mei 1990, nr. W09.90.0029);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 2 december 1991, nr. DGSM/J 31.880/91,
    Directoraat-Generaal Scheepvaart en Maritieme Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Het reglement is van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel1
  - number: 1.1.a
    text: |-
      het Kanaal van Gent naar Terneuzen vanaf de grens met België tot aan de sluizen van Terneuzen, alsmede het
      gebied van de Westsluis, de Middensluis en de Oostsluis te Terneuzen, de Westbuitenhaven en de Oostbuitenhaven te
      Terneuzen, tot aan de denkbeeldige lijn getrokken over de koppen van de havenhoofden;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel1
  - number: 1.1.b
    text: |-
      Zijkanaal *f* en Zijkanaal *g* voor zover gelegen ten zuiden van de denkbeeldige lijn getrokken over de meest
      zuidelijke punten van de hoofden van de oude sluis te Sas van Gent;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel1
  - number: 1.1.c
    text: |-
      Zijkanaal *a, b, d, e, h,* Zijkanaal *c* tot aan de grens tussen de gemeente Sas van Gent en Axel ter hoogte
      van Axelse Sassing, Zijkanaal *g* voor zover gelegen ten noorden van de denkbeeldige lijn getrokken over de
      meest zuidelijke punten van de hoofden van de oude sluis te Sas van Gent, de Noorder- en Zuiderkanaalhaven, de
      Massagoedhaven, de Ro-ro-haven en de Zevenaarhaven.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel1
  - number: '1.2'
    text: 'Het gebied beschreven in het eerste lid, onder *a*, wordt in dit reglement genoemd: kanaal.'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel1
  - number: '2.1'
    text: 'In dit reglement wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.1.a
    text: |-
      schip: een drijvend voorwerp, met inbegrip van een voorwerp zonder waterverplaatsing en een watervliegtuig,
      gebruikt of in staat om te worden gebruikt als een middel van verplaatsing te water;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.1.b
    text: 'zeeschip: een schip dat gewoonlijk de zee bevaart of hiertoe bestemd is;'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.1.c
    text: 'binnenschip: een schip dat gewoonlijk de binnenwateren bevaart of hiertoe bestemd is;'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.1.d
    text: |-
      bovenmaats zeeschip: een zeeschip dat wegens zijn afmetingen met inbegrip van zijn diepgang in verband met de
      toestand van het vaarwater als dusdanig door de terzake bevoegde autoriteit wordt aangegeven overeenkomstig de door
      haar vastgestelde en aan varenden bekend gemaakte normen;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.1.e
    text: |-
      sleepboot: een werktuiglijk voortbewogen schip dat sleepdienst verricht of assistentie verleent en hiertoe bestemd
      is;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.1.f
    text: 'zeilschip: een schip dat onder zeil is, mits de voortstuwingswerktuigen, indien aangebracht, niet worden gebruikt;'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.1.g
    text: 'klein schip: een schip met een lengte van minder dan 20 meter, behalve een sleepboot, een duwboot en een veerpont;'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.1.h
    text: 'samenstel: een sleep, een duwstel of een gekoppeld samenstel;'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.1.i
    text: |-
      veerpont: een schip dat een veerdienst onderhoudt, waarbij het vaarwater wordt overgestoken en dat door de bevoegde
      autoriteit als veerpont is aangeduid;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.1.j
    text: 'obstakel: een wrak, wrakstuk, tuig of voorwerp dat op de bodem van het vaarwater ligt of staat;'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.1.k
    text: |-
      bijzonder transport: een drijvend voorwerp dat in zodanige staat verkeert dat ernstige kans bestaat dat het bij de
      vaart de veiligheid van de scheepvaart in gevaar brengt, schade aan de werken veroorzaakt dan wel zinkt of lading
      verliest;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.1.l
    text: 'werktuiglijk voortbewogen schip: een schip, dat door eigen voortstuwingswerktuigen wordt voortbewogen;'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.1.m
    text: |-
      onmanoeuvreerbaar schip: een schip dat wegens een buitengewone omstandigheid niet in staat is te manoeuvreren zoals
      vereist volgens dit reglement en dat daardoor niet in staat is voor een ander schip uit te wijken;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.1.n
    text: |-
      beperkt manoeuvreerbaar schip: een schip dat door de aard van zijn werk beperkt is in zijn mogelijkheid om te
      manoeuvreren zoals vereist volgens dit reglement en daardoor niet in staat is voor een ander schip tijdig uit te
      wijken. Als beperkt manoeuvreerbaar schip wordt onder meer beschouwd:
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.1.n.1°
    text: een schip bezig met het leggen, onderhouden of het lichten van een navigatiemerk, een kabel of een pijpleiding;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.1.n.2°
    text: een schip bezig met bagger- of onderwaterwerkzaamheden of met hydrografische verrichtingen;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.1.o
    text: 'duwstel: een hecht samenstel van schepen waarvan er tenminste één is geplaatst vóór de duwboot;'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.1.p
    text: |-
      duwboot: een werktuiglijk voortbewogen schip dat deel uitmaakt van een duwstel, en gebouwd of ingericht is om dit
      door duwen voort te bewegen;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.1.q
    text: 'exploitant: de eigenaar, rompbevrachter of ieder ander die de zeggenschap heeft over het gebruik van een schip;'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.1.r
    text: |-
      waterscooter: klein schip dat, bij gebruikmaking van zijn mechanische middelen tot voortbeweging, sneller dan 20 km
      per uur ten opzichte van het water kan varen en gebouwd of ingericht is om door een of meer personen skiënd door of
      over het water te worden voortbewogen;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.1.s
    text: |-
      zeilplank: klein zeilschip voorzien van een vrij bewegende zeiltuigage die is gemonteerd op een in alle richtingen
      draaibare mastvoet en die tijdens het zeilen niet in een vaste positie wordt ondersteund.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: '2.2'
    text: 'In dit reglement wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.2.a
    text: 'bevoegde autoriteit:'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.2.a.1°
    text: |-
      voor de wateren in beheer bij het Rijk: de ambtenaar of ambtenaren die als zodanig worden aangewezen door Onze
      Minister van Verkeer en Waterstaat;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.2.a.2°
    text: |-
      voor de wateren in beheer bij een ander openbaar lichaam: het bestuur van dat openbaar lichaam, dan wel de
      ambtenaar of ambtenaren die als zodanig door het bestuur worden aangewezen;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.2.b
    text: |-
      kapitein of schipper: degene die over het schip of het samenstel het gezag voert of die het gezag in feite
      waarneemt;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.2.c
    text: |-
      verkeersaanwijzing: een door een daartoe bevoegd persoon aan een of meerdere verkeersdeelnemers gegeven gebod om
      een bepaald resultaat in het verkeersgedrag te bewerkstelligen of opgelegd verbod van een bepaald resultaat in
      het verkeersgedrag;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.2.d
    text: |-
      verkeersteken: een in, naast of boven een vaarwater aangebracht voorwerp of aangebrachte combinatie van voorwerpen
      waarmee aan het scheepvaartverkeer wordt gegeven:
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.2.d.1°
    text: een inlichting over de toestand van een bepaalde plaats in of een bepaald gedeelte van een vaarwater, of
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.2.d.2°
    text: |-
      een inlichting, aanbeveling, gebod of verbod onderscheidenlijk opheffing van een gebod of verbod voor het
      verkeersgedrag op een bepaalde plaats in of een bepaald gedeelte van een vaarwater.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.2.e
    text: |-
      bekendmaking met dezelfde strekking als een verkeersteken: een schriftelijke mededeling aan het scheepvaartverkeer
      waarmee aan dat verkeer wordt gegeven:
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.2.e.1°
    text: een inlichting over de toestand van een bepaalde plaats in of een bepaald gedeelte van het vaarwater, of
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.2.e.2°
    text: |-
      een inlichting, aanbeveling, gebod of verbod onderscheidenlijk opheffing van een gebod of verbod voor het
      verkeersgedrag op een bepaalde plaats in of een bepaald gedeelte van het vaarwater;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.2.f
    text: |-
      vaarwater: het gedeelte van de bij [artikel 1][ref1] bedoelde wateren dat door schepen kan worden bevaren;


      [ref1]: https://wetten.overheid.nl/BWBR0005315#Artikel1
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005315
        artikel: '1'
        hoofdstuk: '1'
  - number: 2.2.g
    text: 'varende: niet ten anker liggende, niet gemeerd zijnde en niet aan de grond zittend;'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.2.h
    text: |-
      assisteren: het bijstaan van een werktuiglijk voortbewogen schip door één of meer sleepboten die verbonden zijn aan
      of in aanraking zijn met het werktuiglijk voortbewogen schip;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.2.i
    text: 'hoogte:'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.2.i.1°
    text: |-
      voor alle schepen, uitgezonderd binnenschepen voorzien van een meetbrief: de hoogte boven de romp of de hoogte
      boven het hoogste doorlopende dek of, bij gebrek hieraan, boven het potdeksel;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.2.i.2°
    text: |-
      voor binnenschepen voorzien van een meetbrief: de hoogte boven het vlak gaande door de ijkmerken die het vlak van
      de grootste diepgang aangeven;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.2.j
    text: 'lengte en breedte van een schip: de lengte over alles en de grootste breedte buitenwerks;'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.2.k
    text: 'schepen in zicht van elkaar: vanaf het ene schip kan het andere met het oog worden waargenomen;'
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.2.l
    text: |-
      beperkt zicht: elke omstandigheid waarin het zicht wordt beperkt door mist, nevelig weer, sneeuwval, zware
      regenbuien, rook, damp of andere soortgelijke oorzaken;
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: 2.2.m
    text: |-
      keren: het schip dat varende is verandert zodanig van vaarrichting dat het komt te varen in een richting
      tegengesteld aan die waarin het voer.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel2
  - number: '3.1'
    text: |-
      De kapitein of schipper is verantwoordelijk voor de naleving van de bepalingen van dit reglement tenzij uit die
      bepalingen blijkt dat de naleving aan anderen is opgedragen.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel3
  - number: '3.2'
    text: |-
      Niets in dit reglement ontheft een schip, zijn reder, kapitein of schipper of bemanning van de verantwoordelijkheid
      voor de gevolgen van enige nalatigheid in de naleving van dit reglement, dan wel van veronachtzaming van enige
      voorzorgsmaatregel die volgens het gewone zeemansgebruik of door de bijzondere omstandigheden waarin het schip zich
      bevindt geboden is.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel3
  - number: '3.3'
    text: |-
      Bij het uitleggen en naleven van dit reglement moet goed rekening worden gehouden met alle gevaren voor de
      navigatie en voor aanvaring en met bijzondere omstandigheden, waaronder de beperkingen van de betrokken schepen,
      die ter vermijding van onmiddellijk gevaar een afwijken van dit reglement noodzakelijk kunnen maken.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel3
  - number: '3.4'
    text: |-
      De leden van de bemanning zijn verplicht te gehoorzamen aan de bevelen van de kapitein of de schipper, welke hun
      ter naleving van de voorschriften van dit reglement worden gegeven; zij moeten tot deze naleving, ook zonder bevel,
      hun volle medewerking verlenen.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel3
  - number: 3.5.a
    text: |-
      de kapitein of schipper moet gevolg geven aan een verkeersteken dat een verbod of een gebod bevat en rekening
      houden met een verkeersteken dat een aanbeveling of een inlichting bevat dan wel met een verkeersteken dat dient
      ter markering van het vaarwater of van obstakels die daarin voorkomen.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel3
  - number: 3.5.b
    text: |-
      Onderdeel *a* is van overeenkomstige toepassing ten aanzien van een bekendmaking met dezelfde strekking als een
      verkeersteken.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel3
  - number: '3.6'
    text: |-
      De schipper van een binnenschip dat één of meer andere binnenschepen voortbeweegt, is de schipper van het
      samenstel. Wanneer meer dan één binnenschip voor de voortbeweging zorgt, moet de schipper van het samenstel tijdig
      worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel3
  - number: '3.7'
    text: Indien een stilliggend schip geen kapitein of schipper heeft,
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel3
  - number: 3.7.a
    text: |-
      is de eigenaar of de gebruiker, ieder afzonderlijk, verantwoordelijk voor de naleving van [artikel 42][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005315#Artikel42
    url: https://wetten.overheid.nl/BWBR0005315/2012-09-26#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005315
        artikel: '42'
        hoofdstuk: '5'
  - number: 3.7.b
    text: |-
      is de wachtsman, bedoeld in [artikel 42, eerste lid][ref1], dan wel de persoon die toezicht houdt, bedoeld in
      [artikel 42, tweede lid][ref2], dan wel de persoon die luisterwacht houdt, bedoeld in [artikel 42, derde lid][ref3],
      verantwoordelijk voor de naleving van de [artikelen 9, vierde, zesde tot en met negende en twaalfde lid][ref4],
      [20][ref5], [25][ref6], [27][ref7], [29, zevende lid][ref8], [30][ref9], [31, derde en vijfde lid][ref10],
      [35, derde en vierde lid][ref11], en [43 tot en met 48][ref12].


