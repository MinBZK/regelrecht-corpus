  - number: '8'
    text: |-
      1 De aanvraag om een vergunning voor het oprichten van een inrichting, waarin splijtstoffen als bedoeld in
      [artikel 7, eerste lid][ref1], worden opgeslagen, bevat in ieder geval:

      a. een opgave en beschrijving van de plaats, waar de inrichting zal worden gevestigd, onder vermelding van alle
      terzake doende omstandigheden van geografische, geologische, klimatologische en andere aard;

      b. een opgave van de chemische en fysische toestand, de vorm, het gehalte en de verrijkingsgraad, zomede, voor wat
      bestraalde splijtstoffen betreft, een zo nauwkeurig mogelijke opgave van de activiteit der splijtstoffen, onder
      vermelding van de hoeveelheid der onderscheidene splijtstoffen, welke ten hoogste te eniger tijd in de inrichting
      aanwezig zal zijn;

      c. een globale opgave van het totaal aantal personen, dat bij normaal bedrijf in de inrichting werkzaam zal
      zijn, alsmede een opgave van het aantal leden van het personeel, dat rechtstreeks bij de opslag van splijtstoffen
      betrokken zal zijn, en van de onderlinge taakverdeling tussen die personeelsleden, zomede - voor wat betreft
      het toezichthoudend personeel - van de gronden, waarop zij geacht kunnen worden voldoende deskundigheid voor het
      verrichten van hun taak te bezitten;

      d. een veiligheidsrapport als bedoeld in [artikel 6, eerste lid, onder h][ref2];

      e. een risicoanalyse als bedoeld in [artikel 6, eerste lid, onder i][ref3];

      f. een opgave van de verzekering of andere financiële zekerheid als bedoeld in
      [artikel 6, eerste lid, onder j][ref4].

      2 Het eerste lid is van overeenkomstige toepassing op een aanvraag om een vergunning voor het in werking brengen of
      in werking houden van een inrichting als in dat lid bedoeld.


