  - number: 30d
    text: |-
      1 Bij de aanvraag tot het intrekken van een vergunning voor het ontmantelen van een inrichting als bedoeld in
      [artikel 15, onder b, van de wet][ref1] toont de houder van die vergunning ten genoegen van Onze Minister aan dat
      de ontmanteling is voltooid. Hierbij toont hij in ieder geval aan dat aan [artikel 30a][ref2] is voldaan.

      2 Onze Minister kan nadere regels stellen met betrekking tot de wijze waarop wordt aangetoond dat de ontmanteling
      is voltooid.


