      - id: ref4
        bwb_id: BWBR0002667
        artikel: '9'
        hoofdstuk: II
        paragraaf: '3'
  - number: 11.1.a
    text: |-
      een opgave van de vergunning, krachtens welke de betrokken inrichting is opgericht dan wel in werking gebracht
      of gehouden;
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel11
  - number: 11.1.b
    text: een beschrijving van de voorgenomen wijziging;
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel11
  - number: 11.1.c
    text: |-
      indien de aanvraag betrekking heeft op een inrichting als bedoeld in [artikel 6][ref1], [7][ref2] of [8][ref3] en
      de voorgenomen wijziging van invloed is op een of meer gegevens als vermeld in het ter verkrijging van de onder a
      bedoelde vergunning overgelegde veiligheidsrapport of de risicoanalyse, bedoeld in [artikel 6, onder h][ref4], een
      desbetreffende aanvulling hiervan;


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002667#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002667#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002667#Artikel6
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel11
