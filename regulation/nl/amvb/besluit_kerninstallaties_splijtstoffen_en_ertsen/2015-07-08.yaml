        artikel: '15'
  - number: 40a
    text: |-
      1 Onze Minister stelt een programma als bedoeld in artikel 5, eerste lid, onderdeel a, van richtlijn 2011/70/
      Euratom, vast voor het beheer van verbruikte splijtstoffen.

      2 Het programma bevat een uitwerking van de volgende uitgangspunten:

      a. de beperking van het ontstaan van verbruikte splijtstoffen tot het praktisch haalbare minimum, zowel wat de
      activiteit als het volume betreft;

      b. de onderlinge afhankelijkheden van alle stappen in het ontstaan en het beheer van verbruikte splijtstoffen;

      c. het veilig beheer van verbruikte splijtstoffen;

      d. voor de lange termijn passieve veiligheidsmaatregelen;

      e. een graduele aanpak bij de uitvoering van de maatregelen;

      f. de kosten voor het beheer van verbruikte splijtstoffen komen ten laste van degene die deze afvalstoffen hebben
      laten ontstaan;

      g. een empirisch onderbouwd en gedocumenteerd besluitvormingsproces in alle stadia van het beheer van verbruikte
      splijtstoffen.

      3 Het programma bevat tevens:

      a. de beleidsdoelstelling ten aanzien van het beheer van alle typen verbruikte splijtstoffen;

      b. de mijlpalen die voor de uitvoering van het programma nodig zijn en het tijdpad voor het bereiken van deze
      mijlpalen;

      c. een inventarisatie van alle verbruikte splijtstoffen en ramingen van toekomstige hoeveelheden;

      d. concepten, plannen en technische oplossingen voor het beheer van verbruikte splijtstoffen, van ontstaan tot
      eindberging;

      e. concepten of plannen voor de periode na de sluiting van een inrichting voor eindberging;

      f. onderzoeks-, ontwikkelings- en demonstratieactiviteiten die nodig zijn om oplossingen voor het beheer van
      verbruikte splijtstoffen toe te passen;

      g. de verantwoordelijkheid voor de uitvoering van het programma en de essentiële prestatie-indicatoren voor
      toezicht op de voortgang van de uitvoering van het programma;

      h. een beoordeling van de kosten van het nationale programma en de onderliggende basis en hypothesen voor deze
      beoordeling, met inbegrip van een tijdsprofiel;

      i. de financieringsregelingen ter uitvoering van het programma;

      j. het beleid ten aanzien van het verstrekken van informatie met betrekking tot het beheer van verbruikte
      splijtstoffen aan werknemers en het publiek;

      k. een overzicht van met andere lidstaten en derde landen gesloten overeenkomsten over het beheer van verbruikte
      splijtstoffen.
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel40a
  - number: '41'
    text: |-
      1 Het in [artikel 15, onder a, van de wet][ref1] vervatte verbod geldt niet voor het voorhanden hebben van
      splijtstoffen of ertsen, indien binnen een locatie:

      a. de activiteit van de radionucliden in de betrokken splijtstof of erts lager is dan de krachtens
      [artikel 3, eerste lid, aanhef en onder c, van het Besluit stralingsbescherming][ref2] vastgestelde waarde; of

      b. de activiteitsconcentratie van die stof of dat erts lager is dan de krachtens
      [artikel 3, eerste lid, aanhef en onder c, van het Besluit stralingsbescherming][ref3] vastgestelde waarde.

      2 Het eerste lid is niet van toepassing, indien:

      a. splijtstoffen of ertsen worden toegediend aan personen en, voorzover het de bescherming van mensen tegen
      ioniserende straling betreft, aan dieren voor:

      1°. het stellen van medische of veterinaire diagnoses;

      2°. therapie of (bio)medisch onderzoek;

      a. splijtstoffen of ertsen worden toegevoegd aan producten, bestemd voor gebruik op of in de directe omgeving van
      personen.

      3 Het bij of krachtens [artikel 25, derde, vierde en zevende lid, van het Besluit stralingsbescherming][ref4]
      bepaalde is van overeenkomstige toepassing.

      4 Bij regeling van Onze Minister kan worden bepaald dat het eerste lid niet van toepassing is in daarbij aangewezen
      categorieën van gevallen, waarin sprake is van een te hoog risico van blootstelling van werknemers of leden van
      de bevolking.

      5 Het in [artikel 15, onder a, van de wet][ref5] vervatte verbod geldt niet voor het voorhanden hebben van
      splijtstoffen of ertsen voor bij regeling van Onze Minister aangewezen handelingen die een beperkt risico van
      blootstelling van mensen tot gevolg hebben.


