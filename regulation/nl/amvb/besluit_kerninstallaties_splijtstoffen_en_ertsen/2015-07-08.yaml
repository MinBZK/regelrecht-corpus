      Onze Minister en Onze Minister van Sociale Zaken en Werkgelegenheid kunnen ten aanzien van inrichtingen als bedoeld
      in [artikel 15, onder b, van de wet][ref1] regels stellen waaraan het ontwerp en de bedrijfsvoering in verband met
      de voorkoming van schade moeten voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0003418#Artikel15
