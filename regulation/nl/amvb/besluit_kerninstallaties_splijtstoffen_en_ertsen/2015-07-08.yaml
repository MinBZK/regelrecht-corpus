  - number: 11.1.d
    text: |-
      indien de aanvraag betrekking heeft op een inrichting als bedoeld in [artikel 6][ref1], [7][ref2] of [8][ref3]
      en de voorgenomen wijziging van invloed is op een of meer gegevens als vermeld in de ter verkrijging van de
      onder a bedoelde vergunning overgelegde risicoanalyse, bedoeld in [artikel 6, eerste lid, onder i][ref4], een
      desbetreffende aanvulling van die risicoanalyse;


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002667#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002667#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002667#Artikel6
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel11
