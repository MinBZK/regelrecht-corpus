  - number: '4'
    text: |-
      1 De aanvraag om een vergunning voor het voorhanden hebben van splijtstoffen bevat in ieder geval:

      a. een opgave van de hoeveelheden, de chemische en fysische toestand, de vorm, het gehalte en de verrijkingsgraad,
      zomede, voor wat bestraalde splijtstoffen betreft, een zo nauwkeurig mogelijke opgave van de activiteit der
      splijtstoffen;

      b. een opgave van het doel, waarvoor de aanvrager de splijtstoffen voorhanden wenst te hebben;

      c. een opgave en beschrijving van de plaats, waar de splijtstoffen voorhanden worden gehouden, dan wel, indien ten
      aanzien van de inrichting of uitrusting, waarin de splijtstoffen voorhanden worden gehouden, een vergunning als
      bedoeld in [artikel 15, onder b of c, van de wet][ref1] is vereist, een opgave van die inrichting of uitrusting,
      onder verwijzing naar de ten aanzien daarvan verleende vergunning, dan wel naar de aanvraag om een zodanige
      vergunning;

      d. een beschrijving van de maatregelen die door of vanwege de aanvrager zullen worden getroffen ter voorkoming
      van schade;

      e. een risicoanalyse van de schade van het voorhanden hebben van de onder a bedoelde splijtstoffen buiten de onder
      c bedoelde plaats, inrichting of uitrusting;

      f. een opgave van alle handelingen en werkzaamheden met splijtstoffen, ertsen, radioactieve stoffen en
      toestellen binnen de locatie die meldingsplichtig of vergunningplichtig zijn krachtens dit besluit, het
      [Besluit stralingsbescherming][ref2] of het [Besluit vervoer splijtstoffen, ertsen en radioactieve stoffen][ref3].

      2 Indien de aanvraag betrekking heeft op een ingekapselde bron, bevat zij voorts een opgave van de chemische en
      fysische toestand en vorm waardoor deze splijtstoffen een ingekapselde bron vormen alsmede een aanduiding van de
      constructie en de kwaliteit van de bron.

      3 De aanvraag om een vergunning voor het voorhanden hebben van ertsen bevat in ieder geval:

      a. een opgave van de aard, de hoeveelheid en het gemiddelde uranium- of thoriumgehalte der ertsen;

      b. een opgave van het doel, waarvoor de aanvrager de ertsen voorhanden wenst te hebben;

      c. een opgave en beschrijving van de plaats, waar de ertsen voorhanden zullen worden gehouden;

      d. een beschrijving van de maatregelen, die door of vanwege de aanvrager zullen worden getroffen ter voorkoming
      van schade;

      e. een risicoanalyse van de schade van het voorhanden hebben van ertsen buiten de onder c bedoelde plaats;

      f. een opgave van alle handelingen en werkzaamheden met splijtstoffen, ertsen, radioactieve stoffen en
      toestellen binnen de locatie die meldingsplichtig of vergunningplichtig zijn krachtens dit besluit, het
      [Besluit stralingsbescherming][ref4] of het [Besluit vervoer splijtstoffen, ertsen en radioactieve stoffen][ref5].

      4 Indien de aanvraag betrekking heeft op een hoogactieve bron, bevat de aanvraag voorts:

      a. informatie over het volume van de bron, de bronhouder en de vaste afscherming van die bron;

      b. schriftelijk bewijs dat de krachtens [artikel 19][ref6] in samenhang met
      [artikel 20d, eerste lid, van het Besluit stralingsbescherming][ref7] vereiste financiële zekerheid is gesteld.


