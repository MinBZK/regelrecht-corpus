      - id: ref12
        bwb_id: BWBR0012702
        artikel: '78'
  - number: 18.1.b
    text: |-
      voor een lid van de bevolking dat zich buiten de locatie bevindt, als gevolg van de handeling waarvoor de
      vergunning is aangevraagd en ten gevolge van andere handelingen binnen en buiten deze locatie, een van de volgende
      doses wordt overschreden:
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel18
  - number: 18.1.b.1
    text: 'een effectieve dosis van 1 mSv in een kalenderjaar, en met inachtneming daarvan:'
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel18
  - number: 18.1.b.2
    text: een equivalente dosis van 50 mSv in een kalenderjaar voor de huid gemiddeld over enig huidoppervlak van 1 cm2;
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel18
  - number: 18.1.c
    text: |-
      de handeling waarvoor de vergunning is aangevraagd behoort tot een categorie, die in de krachtens
      [artikel 19][ref1] in samenhang met [artikel 4, tweede lid, van het Besluit stralingsbescherming][ref2] geldende
      regeling als gerechtvaardigd is bekendgemaakt, maar het specifieke karakter van deze handeling op grond van
      [artikel 4, eerste lid, van dat besluit][ref3] niet gerechtvaardigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel4
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002667
        artikel: '19'
        hoofdstuk: IIIa
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0012702
        artikel: '4'
  - number: '18.2'
    text: |-
      Een vergunning als bedoeld in [artikel 15, onder b, van de wet][ref1] wordt geweigerd, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 18.2.a
    text: |-
      de waarden van de gegevens in de risicoanalyse, bedoeld in [artikel 6, eerste lid, onder h][ref1], niet voldoen aan
      de in onderstaande tabel opgenomen limietwaarden;







                        Gebeurtenisfrequentie F per jaar


                        Maximaal toegestane effectieve dosis









                        personen vanaf 16 jaar


                        personen tot 16 jaar




                        F ≥ 10–1


                        0,1 mSv


                        0,04 mSv




                        10–1 > F ≥ 10–2


                        1 mSv


                        0,4 mSv




                        10–2 > F ≥ 10–4


                        10 mSv


                        4 mSv




                        F < 10–4


                        100 mSv


                        40 mSv


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel6
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002667
        artikel: '6'
        hoofdstuk: II
        paragraaf: '3'
  - number: 18.2.b
    text: dan wel uit die risico-analyse blijkt dat de effectieve schildklierdosis niet beperkt blijft tot 500 mSv.
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel18
  - number: '18.3'
    text: |-
      Een vergunning voor het oprichten, in werking brengen of houden of wijzigen van een inrichting,
      waarin kernenergie kan worden vrijgemaakt, kan worden geweigerd, indien de waarden in de krachtens
      [artikel 6, eerste lid, onder i][ref1], verrichte risicoanalyse een van de volgende waarden overschrijden:


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel6
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002667
        artikel: '6'
        hoofdstuk: II
        paragraaf: '3'
  - number: 18.3.a
    text: |-
      een kans van 10–6 per jaar dat een persoon, die zich permanent en onbeschermd buiten de desbetreffende inrichting
      zou bevinden, overlijdt als gevolg van een buiten-ontwerpongeval;
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel18
  - number: 18.3.b
    text: |-
      een kans van 10–5 per jaar dat buiten de desbetreffende inrichting een groep van ten minste 10 personen direct
      dodelijk slachtoffer is van een buiten-ontwerpongeval, of voor n maal meer direct dodelijke slachtoffers een kans
      die n2 maal kleiner is.
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel18
  - number: '19'
    text: |-
      Het bij of krachtens de [artikelen 1, derde lid][ref1],[ 3][ref2],
      [4, eerste, tweede, derde, zesde en zevende lid][ref3], [5][ref4], [6 tot en met 17][ref5],
      [19 tot en met 20f][ref6], [36][ref7], [38][ref8], [48 tot en met 64][ref9], [66][ref10],
      [71 tot en met 74][ref11], [76 tot en met 100][ref12], [112 tot en met 122, eerste lid][ref13], [123][ref14] en
      [124 van het Besluit stralingsbescherming][ref15] bepaalde is, met uitzondering van hetgeen daarin is bepaald over
      toestellen en meldingen, van overeenkomstige toepassing, met dien verstande dat bij de overeenkomstige toepassing
      van [artikel 124][ref16] in plaats van «die van dit besluit afwijken» wordt gelezen: die van de van overeenkomstige
      toepassing verklaarde artikelen afwijken.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0012702#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0012702#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0012702#Artikel19
      [ref7]: https://wetten.overheid.nl/BWBR0012702#Artikel36
      [ref8]: https://wetten.overheid.nl/BWBR0012702#Artikel38
      [ref9]: https://wetten.overheid.nl/BWBR0012702#Artikel48
      [ref10]: https://wetten.overheid.nl/BWBR0012702#Artikel66
      [ref11]: https://wetten.overheid.nl/BWBR0012702#Artikel71
      [ref12]: https://wetten.overheid.nl/BWBR0012702#Artikel76
      [ref13]: https://wetten.overheid.nl/BWBR0012702#Artikel112
      [ref14]: https://wetten.overheid.nl/BWBR0012702#Artikel123
      [ref15]: https://wetten.overheid.nl/BWBR0012702#Artikel124
      [ref16]: https://wetten.overheid.nl/BWBR0012702#Artikel124
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel19
