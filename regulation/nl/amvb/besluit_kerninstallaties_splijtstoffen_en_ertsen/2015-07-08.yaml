  - number: '5.1'
    text: 'De aanvraag om een vergunning voor het zich ontdoen van splijtstoffen bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel5
  - number: 5.1.a
    text: |-
      een opgave van de hoeveelheden, de chemische en fysische toestand, de vorm, het gehalte en de verrijkingsgraad,
      zomede een zo nauwkeurig mogelijke opgave van de activiteit der splijtstoffen;
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel5
  - number: 5.1.b
    text: |-
      een opgave en beschrijving van de plaats, waar en de wijze, waarop de aanvrager zich van de splijtstoffen wenst
