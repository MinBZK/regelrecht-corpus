      1 Het in [artikel 15, onder a, van de wet][ref1] vervatte verbod geldt niet voor het zich ontdoen van splijtstoffen
      of ertsen voor product- of materiaalhergebruik of van splijtstoffen of ertsen bevattende afvalstoffen, indien:

      a. de activiteit van de radionucliden in de betrokken splijtstoffen of ertsen in een kalenderjaar lager is dan
      de krachtens [artikel 3, eerste lid, aanhef en onder c, van het Besluit stralingsbescherming][ref2] vastgestelde
      waarde of

      b. de activiteitsconcentratie van die stof of dat erts lager is dan de krachtens
      [artikel 3, eerste lid, aanhef en onder c, van het Besluit stralingsbescherming][ref3] vastgestelde waarde.

      2 Het bij of krachtens [artikel 25, derde, vierde en zevende lid, van het Besluit stralingsbescherming][ref4] en
      [artikel 41, vierde lid, van dit besluit][ref5] bepaalde is van overeenkomstige toepassing.

      3 Het in [artikel 15, onder a, van de wet][ref6] vervatte verbod geldt niet voor het zich ontdoen van splijtstoffen
      of ertsen voor product- of materiaalhergebruik of van splijtstoffen of ertsen bevattende afvalstoffen, indien het
      betreft:

      a. ingekapselde bronnen die worden teruggenomen door degene die de bron heeft vervaardigd of geleverd;

      b. een feitelijke levering van splijtstoffen of ertsen door enkele overgave aan een derde met het oog op:

      1°. gebruik, product- of materiaalhergebruik van splijtstoffen of ertsen,

      2°. inzameling van splijtstoffen of ertsen bevattende afvalstoffen;

      c. een afgifte aan een krachtens [artikel 22, vierde lid, van de wet][ref7] aangewezen instelling voor ontvangst
      van in bezit genomen splijtstoffen of ertsen;

      d. het zich ontdoen van splijtstoffen of ertsen bevattende afvalstoffen door afgifte aan een door Onze Minister
      erkende ophaaldienst van splijtstoffen of ertsen bevattende afvalstoffen;

      e. een afgifte aan een door Onze Minister aangewezen instelling voor de ontvangst van splijtstoffen of ertsen
      bevattende afvalstoffen.

      4 Het derde lid geldt alleen indien de ondernemer zich ervan heeft vergewist dat de ontvanger in het bezit is van
      een vergunning voor de desbetreffende handeling of anderszins gerechtigd is de stoffen te ontvangen.

      5 Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref8] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref9] niet van toepassing op de aanvraag om een erkenning
      van een ophaaldienst of een aanwijzing van een instelling voor de ontvangst van splijtstoffen of ertsen bevattende
      afvalstoffen als bedoeld in het derde lid.


