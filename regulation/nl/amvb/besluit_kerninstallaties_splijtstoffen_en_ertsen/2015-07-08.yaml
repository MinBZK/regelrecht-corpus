  - number: '2'
    text: |-
      Dit besluit is niet van toepassing op het vervoeren, het voorhanden hebben bij opslag in verband met het vervoer en
      het binnen of buiten Nederlands grondgebied brengen of doen brengen van splijtstoffen of ertsen.
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel2
  - number: '3'
    text: |-
      1 De aanvraag om een vergunning voor handelingen binnen een inrichting als
      bedoeld in [artikel 15, onder b, van de wet][ref1], of als aangewezen krachtens
      [artikel 1.1, derde lid, van de Wet milieubeheer][ref2], wordt ingediend door degene die de inrichting drijft.

      2 Een aanvraag als bedoeld in het eerste lid betreft niet de handelingen die worden verricht door een persoon die
      in het bezit is van een vergunning voor het op steeds wisselende plaatsen verrichten van zodanige handelingen.

      3 De aanvraag bevat:

      a. naam en adres van de aanvrager;

      b. een feitelijke omschrijving van hetgeen de aanvrager met de betrokken splijtstoffen of ertsen wenst te doen
      onderscheidenlijk een aanduiding van de betrokken inrichting of uitrusting, onder vermelding van het gebruik, dat
      de aanvrager van die inrichting of uitrusting wenst te maken;

      c. voor zover een of meer der in de [artikelen 4 tot en met 11][ref3] vervatte bepalingen op de betrokken aanvraag
      van toepassing zijn, de gegevens, welke de aanvraag uit dien hoofde in het bijzonder dient te bevatten dan wel,
      ingeval zodanige gegevens in een bij de aanvraag behorende bijlage zijn vermeld, een korte aanduiding van de aard
      en de inhoud dezer gegevens met verwijzing naar de betrokken bijlage;

      d. een opgave van de tijdsduur, waarvoor de vergunning wordt verlangd;

      e. indien een vergunning wordt aangevraagd voor een handeling die in de krachtens [artikel 19][ref4] in samenhang
      met [artikel 4, tweede lid, van het Besluit stralingsbescherming][ref5] geldende regeling, als gerechtvaardigd is
      bekendgemaakt, een verwijzing naar die bekendmaking;

      f. indien een vergunning wordt aangevraagd voor een handeling die niet of als niet-
      gerechtvaardigd is bekendgemaakt in de krachtens [artikel 19][ref6] in samenhang met
      [artikel 4, tweede lid, van het Besluit stralingsbescherming][ref7] geldende regeling, een verzoek om
      rechtvaardiging van die handeling en tevens de gegevens met betrekking tot de economische, sociale en andere
      voordelen van de betrokken handeling en met betrekking tot de gezondheidsschade die erdoor kan worden toegebracht,
      die nodig zijn met het oog op de beoordeling van de gerechtvaardigdheid van de handeling.

      4 Aanvragen om een vergunning, welke vallen onder verschillende bepalingen van de [paragrafen 2][ref8] en
      [3][ref9], kunnen, voor zover die aanvragen betrekking hebben op dezelfde inrichting dan wel op inrichtingen,
      die tezamen een geheel vormen en die in elkaars onmiddellijke nabijheid zijn gelegen, in de vorm van een enkele,
      samengestelde aanvraag worden ingediend. Op zodanige aanvraag zijn alle bepalingen van toepassing, welke betrekking
      hebben op de afzonderlijke aanvragen, waaruit zij is samengesteld, met dien verstande dat in gevallen, waarin
      onverkorte toepassing dezer bepalingen zou leiden tot meervoudige vermelding van eenzelfde gegeven, met een
      enkelvoudige vermelding kan worden volstaan.

      5 Indien een aanvraag om een vergunning betrekking heeft op een inrichting of uitrusting, ten aanzien waarvan reeds
      eerder een aanvraag is ingediend, kan, voor zover bepaalde gegevens reeds bij de eerdere aanvraag zijn verstrekt en
      geen wijziging hebben ondergaan, naar die eerdere aanvraag worden verwezen.

      6 Onze Minister kan de indiening van verdere afschriften van de aanvraag of van daarbij behorende bijlagen
      verlangen.


