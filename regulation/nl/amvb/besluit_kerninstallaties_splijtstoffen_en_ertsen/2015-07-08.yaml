        artikel: '6'
        hoofdstuk: II
        paragraaf: '3'
  - number: '11.3'
    text: |-
      Dit artikel is niet van toepassing op een aanvraag om een vergunning als bedoeld in [artikel 10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel10
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002667
        artikel: '10'
        hoofdstuk: II
        paragraaf: '3'
  - number: 11a
    text: |-
      In gevallen waarin de vergunning betrekking heeft op het oprichten of wijzigen van een inrichting als bedoeld
      in [artikel 15, onder b, van de wet][ref1], dat tevens is aan te merken als een bouwactiviteit als bedoeld in
      [artikel 2.1, eerste lid, onder a, van de Wet algemene bepalingen omgevingsrecht][ref2], verstrekt de aanvrager:


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 11a.a
    text: |-
      indien de aanvraag om vergunning voor die bouwactiviteit tegelijk met de aanvraag om de vergunning krachtens deze
      wet is ingediend, een afschrift van de aanvraag om vergunning voor die bouwactiviteit bij zijn aanvraag;
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel11a
  - number: 11a.b
    text: |-
      indien de aanvraag om vergunning voor die bouwactiviteit niet tegelijk met de aanvraag om de vergunning krachtens
      deze wet wordt ingediend, een afschrift van de aanvraag om vergunning voor die bouwactiviteit aan het bevoegd gezag
      gelijktijdig met de indiening van die aanvraag.
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel11a
  - number: '15'
    text: |-
      Bij de voorbereiding van beschikkingen met betrekking waartoe op grond van [artikel 17][ref1] of
      [20, eerste lid, van de we][ref2]t [afdeling 3.4 van de Algemene wet bestuursrecht][ref3] van toepassing is, worden
      – anders dan als adviseurs – betrokken:.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '20'
      - id: ref3
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 15.a
    text: |-
      in gevallen waarin de beschikking een inrichting als bedoeld in [artikel 6][ref1],[ 7][ref2] of [8][ref3] betreft:
      de besturen van de provincie en de gemeente waar de inrichting geheel of in hoofdzaak is of zal zijn gelegen,
      de besturen van de provincies en gemeenten welker gebied is gelegen op minder dan 10 kilometer van de plaats
      waar de inrichting gelegen is of zal zijn, alsmede de organen die belast zijn met het kwalitatieve beheer van
      oppervlaktewateren die gelegen zijn op minder dan 10 kilometer van de plaats waar de inrichting gelegen is of zal
      zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002667#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002667#Artikel8
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002667
        artikel: '6'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002667
        artikel: '7'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0002667
        artikel: '8'
        hoofdstuk: II
        paragraaf: '3'
  - number: 15.b
    text: |-
      in gevallen waarin de beschikking een inrichting als bedoeld in [artikel 9][ref1] betreft: het bestuur van de
      gemeente of gemeenten, waar de inrichting gelegen is of zal zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel9
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002667
        artikel: '9'
        hoofdstuk: II
        paragraaf: '3'
  - number: '16'
    text: |-
      [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1] alsmede [afdeling 13.2 van de Wet milieubeheer][ref2] zijn
      niet van toepassing op de voorbereiding van beschikkingen ter zake van het voorhanden hebben of het zich ontdoen
      van splijtstoffen:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0003245
        afdeling: '13.2'
  - number: 16.a
    text: |-
      indien het betreft plutonium met een maximale activiteit van 37 gigabecquerel, mits dit plutonium op zodanige wijze
      is opgenomen in een omhulsel dat daardoor redelijkerwijze voldoende weerstand wordt geboden om elke verspreiding
      van of besmetting met dit plutonium te voorkomen;
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel16
  - number: 16.b
    text: indien het betreft verarmd uranium, natuurlijk uranium of natuurlijk thorium.
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel16
  - number: '17'
    text: |-
      Van het geven van een beschikking op de voorbereiding waarvan [afdeling 3.4 van de Algemene wet bestuursrecht][ref1]
      alsmede [afdeling 13.2 van de Wet milieubeheer][ref2] niet van toepassing zijn, wordt mededeling gedaan in de
      *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0003245
        afdeling: '13.2'
  - number: '18.1'
    text: |-
      Geen vergunning als bedoeld in [artikel 15 van de wet][ref1] wordt verleend indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel18
