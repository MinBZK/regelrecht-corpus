  - number: '35'
    text: |-
      1 Aan een vergunning als bedoeld in [artikel 15 van de wet][ref1] worden voorschriften met het oog op de veiligheid
      van de staat verbonden, indien de vergunning uitsluitend of mede betrekking heeft op het doen van verrichtingen:

      a. met gebruikmaking van gegevens, hulpmiddelen of materialen dan wel van een inrichting of een uitrusting, ten
      aanzien waarvan naar het oordeel van Onze Minister het belang van de veiligheid van de staat het opleggen van een
      verplichting tot geheimhouding of een beperking ten aanzien van het gebruik vereist, of

      b. waarbij onderzoekingen worden verricht of werkmethoden worden toegepast, ten aanzien waarvan naar het oordeel
      van Onze Minister het belang van de veiligheid van de staat het opleggen van een verplichting tot geheimhouding
      vereist, of

      c. welke blijkens een verklaring van Onze Minister van vitaal belang zijn voor de militaire of civiele verdediging.

      2 Voorschriften als in het eerste lid bedoeld kunnen de verplichting inhouden:

      a. ten aanzien van gegevens, hulpmiddelen, materialen, een inrichting of een uitrusting dan wel onderzoekingen of
      werkmethoden als in het eerste lid bedoeld de geheimhouding te verzekeren;

      b. gegevens, hulpmiddelen of materialen dan wel een inrichting of uitrusting als in het eerste lid bedoeld met
      inachtneming van in het voorschrift aangegeven beperkingen te gebruiken;

      c. terreinen, gebouwen en ruimten, waar verrichtingen als in het eerste lid bedoeld plaatsvinden dan wel gegevens,
      hulpmiddelen of materialen, met gebruikmaking waarvan zodanige verrichtingen plaatsvinden, worden bewaard, op een
      bij het voorschrift bepaalde wijze te beveiligen;

      d. het gebruik van gegevens, hulpmiddelen of materialen dan wel van een inrichting of uitrusting als in het
      eerste lid bedoeld, alsmede het aanwenden van uit zodanig gebruik voortvloeiende kennis op een bij het voorschrift
      bepaalde wijze te regelen;

      e. Onze Minister of in het voorschrift aangewezen Nederlandse controle-organen tijdig in kennis te stellen van een
      voorgenomen vervanging van de met de leiding van de onderneming of instelling, waaraan de vergunning is verleend,
      belaste persoon of personen;

      f. alle of bepaalde verrichtingen uitsluitend te laten plaatsvinden door personen, ten aanzien van wie Onze
      Minister heeft verklaard, dat naar zijn oordeel voldoende waarborgen aanwezig kunnen worden geacht, dat zij de
      verplichting met betrekking tot de geheimhouding naar behoren zullen vervullen;

      g. bij het voorschrift aangewezen organen, waaraan een taak is opgedragen terzake van de uitvoering van de wet,
      in het voorschrift omschreven inlichtingen te doen toekomen betreffende gegevens, hulpmiddelen of materialen,
      dan wel een inrichting of uitrusting als in het eerste lid bedoeld, alsmede een op het verstrekken van zodanige
      inlichtingen gerichte administratie te voeren, aan de hand waarvan de juistheid van de verstrekte inlichtingen op
      eenvoudige wijze kan worden aangetoond;

      h. Onze Minister of bij het voorschrift aangewezen Nederlandse controle-organen onverwijld in te lichten, indien
      ernstige inbreuken op de naleving van de met het oog op de veiligheid van de staat gegeven voorschriften dan wel
      spionage worden vermoed of ontdekt;

      i. een aan de onderneming of instelling verbonden functionaris aan te wijzen, speciaal belast met het treffen
      van maatregelen ter uitvoering van de met het oog op de veiligheid van de staat aan de vergunning verbonden
      voorschriften, alsmede met het toezicht op de naleving van die maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel35
    references:
