articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

              beheer van verbruikte splijtstoffen:

                alle activiteiten die te maken hebben met het hanteren, de voorbehandeling, de behandeling, het
      conditioneren, de opslag of de eindberging van verbruikte splijtstoffen, met uitzondering van het vervoer buiten
      het terrein van de faciliteit;




                *bron:*


                splijtstof of erts;




                *buiten-ontwerpongeval:*


                ongeval waarvan de kans dat het zich voordoet geringer is dan elk van de gepostuleerde begin-
      gebeurtenissen en waarbij niet is uit te sluiten dat door het vrijkomen van splijtstoffen of radioactieve
      stoffen de bij [artikel 18][ref1] vastgestelde limietwaarden voor de gepostuleerde begin-gebeurtenissen worden
      overschreden;




                *gehalte:*


                massagehalte van de elementen uranium, thorium en plutonium in splijtstoffen;




                *gepostuleerde begin-gebeurtenissen:*


                redelijkerwijs mogelijk te achten voorvallen die bij juist functioneren van de daartoe speciaal ontworpen
      veiligheidssystemen tot voorzienbare bedrijfsgevolgen of ongevalsomstandigheden leiden die een besmetting of een
      blootstelling van de omgeving kunnen veroorzaken;




                *gevaarlijke stoffen:*


                gevaarlijke stoffen als bedoeld in
      [artikel 1, eerste lid, van het Besluit risico’s zware ongevallen 2015][ref2];




                *handeling:*


                handeling als genoemd in [artikel 15 van de wet][ref3], niet zijnde het vervoeren van, het voorhanden
      hebben bij opslag in verband met vervoer, of het binnen of buiten Nederlands grondgebied brengen of doen brengen
      van splijtstoffen of ertsen, uitgezonderd bij een interventie, een ongeval of een radiologische noodsituatie;



              hoogactieve bron:

                ingekapselde bron die een radionuclide bevat waarvan de activiteit een waarde overstijgt die gelijk is
      aan of hoger is dan het voor die bron krachtens [artikel 3, eerste lid, van het Besluit stralingsbescherming][ref4]
      geldende activiteitsniveau;




                *ingekapselde bron:*


                splijtstoffen of ertsen die zijn ingebed in of gehecht aan vast dragermateriaal of zijn omgeven door een
      omhulling van materiaal met dien verstande dat hetzij het dragermateriaal hetzij de omhulling voldoende weerstand
      biedt om onder normale gebruiksomstandigheden elke verspreiding van splijtstoffen of ertsen te voorkomen;




                *lid van de bevolking:*


                een persoon uit de bevolking binnen of buiten een locatie, niet zijnde een werknemer gedurende zijn
      werktijd of een persoon die een radiologische verrichting ondergaat;




                *locatie:*


                inrichting of uitrusting als bedoeld in [artikel 15, onder b of c, van de wet][ref5] of als aangewezen
      krachtens [artikel 1.1, derde lid, van de Wet milieubeheer][ref6] of plaats waar een handeling wordt verricht;




                *natuurlijk uranium:*


                door een chemisch scheidingsproces verkregen uranium waarin de uraniumisotopen zich in de natuurlijke
      verhouding bevinden;




                *nucleaire drukapparatuur:*


                speciaal voor nucleair gebruik in inrichtingen als bedoeld in [artikel 15, onder b, van de wet][ref7]
      ontworpen drukapparatuur die bij defecten de verspreiding van radioactiviteit kan veroorzaken, met uitzondering van
      splijtstofstaven en opslag- en transportverpakkingen;




                *ondernemer:*


                degene onder wiens verantwoordelijkheid een handeling of werkzaamheid wordt verricht;




                *ontmantelingsplan:*


                plan met een beschrijving van de wijze waarop een inrichting als bedoeld in
      [artikel 15, onder b, van de wet][ref8] buiten gebruik wordt gesteld en ontmanteld;




                *Onze Minister:*


                Onze Minister van Economische Zaken, Landbouw en Innovatie;




                *splijtstof of erts bevattende afvalstof:*


                splijtstof die, of erts dat krachtens [artikel 19 van dit besluit][ref9] in samenhang met
      [artikel 38, eerste en tweede lid, van het Besluit stralingsbescherming][ref10] als zodanig is aangemerkt en niet
      wordt geloosd;



              verbruikte splijtstof:

                kernsplijtstof die bestraald is en permanent uit een reactorkern is verwijderd;




                *verrijkingsgraad:*


                massagehalte van uranium-235 en uranium-233 tezamen in verrijkt uranium;




                *verrijkt uranium:*


                uranium met een hoger massapercentage uranium-235 dan in natuurlijk uranium;




                *wet:*


                [Kernenergiewet][ref11].


