  - number: '15'
    text: |-
      Bij de voorbereiding van beschikkingen met betrekking waartoe op grond van [artikel 17][ref1] of
      [20, eerste lid, van de we][ref2]t [afdeling 3.4 van de Algemene wet bestuursrecht][ref3] van toepassing is, worden
      – anders dan als adviseurs – betrokken:.

      a. in gevallen waarin de beschikking een inrichting als bedoeld in [artikel 6][ref4],[ 7][ref5] of [8][ref6]
      betreft: de besturen van de provincie en de gemeente waar de inrichting geheel of in hoofdzaak is of zal zijn
      gelegen, de besturen van de provincies en gemeenten welker gebied is gelegen op minder dan 10 kilometer van de
      plaats waar de inrichting gelegen is of zal zijn, alsmede de organen die belast zijn met het kwalitatieve beheer
      van oppervlaktewateren die gelegen zijn op minder dan 10 kilometer van de plaats waar de inrichting gelegen is of
      zal zijn;

      b. in gevallen waarin de beschikking een inrichting als bedoeld in [artikel 9][ref7] betreft: het bestuur van de
      gemeente of gemeenten, waar de inrichting gelegen is of zal zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel20
