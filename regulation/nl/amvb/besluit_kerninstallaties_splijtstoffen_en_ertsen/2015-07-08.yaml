        artikel: '15'
  - number: '36'
    text: |-
      1 Aan een vergunning als bedoeld in [artikel 15 van de wet][ref1] worden voorschriften met het oog op de
      bewaring van splijtstoffen en ertsen verbonden, indien en voor zover zulks nodig is voor de bescherming van de in
      [artikel 15b, eerste lid, van de wet, onder a, b, d of f][ref2] bedoelde belangen.

      2 Voorschriften als bedoeld in het eerste lid kunnen de verplichting inhouden:

      a. splijtstoffen of ertsen te bewaren op een zodanige bij het voorschrift aan te geven plaats en wijze, dat er geen
      schade kan optreden;

      b. splijtstoffen of ertsen zodanig te bewaren, dat zij zo veel mogelijk zijn beveiligd tegen brand of het op andere
      wijze verloren gaan;

      c. een of meer aan de onderneming of instelling verbonden functionarissen aan te wijzen, speciaal belast met het
      treffen van maatregelen ter uitvoering van de met het oog op de bewaring aan de vergunning verbonden voorschriften,
      alsmede met het toezicht op de naleving van die maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel36
