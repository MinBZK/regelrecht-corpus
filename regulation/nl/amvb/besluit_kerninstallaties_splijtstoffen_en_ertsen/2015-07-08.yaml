  - number: '9'
    text: |-
      1 De aanvraag om een vergunning voor het oprichten van een inrichting, waarin onbestraalde splijtstoffen, welke
      geen plutonium of verrijkt uranium bevatten, kunnen worden vervaardigd, bewerkt of verwerkt, bevat in ieder geval:

      a. een opgave en beschrijving van de plaats, waar de inrichting zal worden gevestigd;

      b. een beschrijving van de inrichting;

      c. een opgave van de chemische en fysische toestand, de vorm en het gehalte der splijtstoffen, onder vermelding
      van de hoeveelheid der onderscheidene splijtstoffen, welke ten hoogste te eniger tijd in de inrichting aanwezig
      zal zijn;

      d. een opgave van het aantal personeelsleden, dat verantwoordelijk zal zijn voor het op deskundige wijze
      vervaardigen, bewerken, of verwerken van splijtstoffen, met vermelding van de gronden, waarop zij geacht kunnen
      worden voldoende deskundigheid te bezitten;

      e. een beschrijving van de maatregelen, welke door of vanwege de aanvrager zullen worden getroffen ter voorkoming
      van schade, waaronder begrepen de maatregelen ter voorkoming van schade buiten de inrichting;

      f. een risicoanalyse van de schade buiten de inrichting, welke is verbonden aan het vervaardigen, bewerken of
      verwerken in de inrichting van de onder c bedoelde splijtstoffen.

      2 Het eerste lid is van overeenkomstige toepassing op een aanvraag om een vergunning voor het in werking brengen of
      in werking houden van een inrichting als in dat lid bedoeld.
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel9
  - number: '10'
    text: |-
      1 Indien een aanvraag om een vergunning tot wijziging van een inrichting als bedoeld in de [artikelen 6][ref1],
      [7][ref2], [8][ref3] of [9][ref4] mede strekt tot het buiten gebruik stellen of ontmantelen van de inrichting of
      een deel daarvan, bevat de aanvraag in ieder geval:

      a. een opgave van de vergunning krachtens welke de betrokken inrichting is opgericht dan wel in werking gebracht
      of gehouden;

      b. een ontmantelingsplan.

      2 Een aanvraag om een vergunning als bedoeld in het eerste lid bevat tevens, indien het betrekking heeft op een
      inrichting:

      a. als bedoeld in de [artikelen 6][ref5], [7][ref6] of [8][ref7]: een veiligheidsrapport als bedoeld in
      [artikel 6, eerste lid, onder h][ref8], en een risicoanalyse als bedoeld in [artikel 6, eerste lid, onder i][ref9],

      b. als bedoeld in [artikel 9][ref10]: een beschrijving van maatregelen als bedoeld
      in [artikel 9, eerste lid, onder e][ref11], en een risicoanalyse als bedoeld in
      [artikel 9, eerste lid, onder f][ref12], met dien verstande dat het veiligheidsrapport, de beschrijving van
      maatregelen en de risicoanalyses betrekking hebben op de buitengebruikstelling of de ontmanteling.

      3 De aanvraag voor het wijzigen van een vergunning als bedoeld in het eerste lid, bevat in ieder geval:

      a. een opgave van de vergunning krachtens welke de betrokken inrichting buiten gebruik is gesteld of wordt
      ontmanteld;

      b. een beschrijving van de voorgenomen wijziging;

      c. indien de voorgenomen wijziging van invloed is op een of meer gegevens als vermeld in het ontmantelingsplan
      genoemd in het eerste lid, onder b, een desbetreffende aanvulling van dat plan.

      4 Gelijktijdig met de aanvraag om een vergunning voor het buiten gebruik stellen van een inrichting als bedoeld in
      het eerste lid, wordt een aanvraag ingediend om een vergunning voor het ontmantelen van die inrichting.


