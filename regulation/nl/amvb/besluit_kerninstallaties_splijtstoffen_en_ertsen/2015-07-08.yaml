  - number: '7'
    text: |-
      1 De aanvraag om een vergunning voor het oprichten van een inrichting, waarin splijtstoffen, welke plutonium of
      verrijkt uranium bevatten, of bestraalde splijtstoffen kunnen worden vervaardigd, bewerkt of verwerkt, bevat in
      ieder geval de gegevens, bedoeld in [artikel 6, eerste lid][ref1], met dien verstande dat:

      a. onder *b* in plaats van "het hoogste vermogen, waarop de inrichting zal werken" wordt gelezen: "de grootste
      hoeveelheid der onderscheidene splijtstoffen, welke in een bepaald tijdvak in de inrichting kan worden vervaardigd,
      bewerkt of verwerkt";

      b. telkens in plaats van "gebruikt" onderscheidenlijk "het gebruik" of "het vrijmaken van kernenergie" wordt
      gelezen: "vervaardigd, bewerkt of verwerkt" onderscheidenlijk "de vervaardiging, bewerking of verwerking".

      2 Het eerste lid is van overeenkomstige toepassing op een aanvraag om een vergunning voor het in werking brengen of
      in werking houden van een inrichting als in dat lid bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel6
