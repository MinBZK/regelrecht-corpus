        bwb_id: BWBR0012702
      - id: ref2
        bwb_id: BWBR0002668
  - number: '4.4'
    text: 'Indien de aanvraag betrekking heeft op een hoogactieve bron, bevat de aanvraag voorts:'
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel4
  - number: 4.4.a
    text: informatie over het volume van de bron, de bronhouder en de vaste afscherming van die bron;
