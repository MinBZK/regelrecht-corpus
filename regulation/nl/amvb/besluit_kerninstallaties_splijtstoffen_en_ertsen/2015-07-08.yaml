  - number: '21'
    text: |-
      1 Het is verboden in een inrichting als bedoeld in [artikel 15, onder b, van de wet][ref1], nucleaire
      drukapparatuur te gebruiken, die niet is goedgekeurd aan de hand van door Onze Minister daartoe in het belang van
      de veilige werking van zodanige apparatuur vastgestelde voorschriften.

      2 Onze Minister kan bij ministeriële regeling bepalen dat het in het eerste lid gestelde verbod mede geldt voor
      gebruik in een inrichting als bedoeld in [artikel 15, onder b, van de wet][ref2], van bij of krachtens die regeling
      aangewezen andere drukapparatuur die bij defecten de verspreiding van radioactiviteit kan veroorzaken.

      3 Goedkeuring van nucleaire drukapparatuur, die voor het in werking treden van dit artikel is verleend aan de
      hand van een keuring overeenkomstig het [Stoombesluit][ref3], wordt gelijkgesteld met goedkeuring, verleend na een
      keuring aan de hand van de krachtens het eerste lid vastgestelde voorschriften.

      4 Met de keuring zijn belast de door Onze Minister aangewezen instellingen. Onze Minister stelt bij ministeriële
      regeling regels met betrekking tot het aanwijzen van instellingen, bedoeld in de eerste volzin. Hij kan regels
      stellen met betrekking tot de wijze waarop de keuringen worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0002123
