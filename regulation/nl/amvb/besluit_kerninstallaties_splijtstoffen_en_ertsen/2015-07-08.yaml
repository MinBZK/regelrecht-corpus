      1 Het in [artikel 15, onder a, van de wet][ref1] vervatte verbod geldt niet voor het zich ontdoen van splijtstoffen
      of ertsen door middel van lozing in de lucht, in het openbare riool of in het oppervlaktewater, indien:

      a. bij lozing in de lucht, de activiteit van de in totaal in een kalenderjaar geloosde hoeveelheid splijtstoffen
      of ertsen bij het verlaten van de locatie via een lozingspunt lager is dan 1 radiotoxiciteitsequivalent voor
      inhalatie, als bedoeld in de [bijlage bij het Besluit stralingsbescherming](onbekend);

      b. bij lozing in het openbare riool, de activiteit van de in totaal in een kalenderjaar geloosde
      hoeveelheid splijtstoffen of ertsen bij het verlaten van de locatie via een lozingspunt lager is dan 10
      radiotoxiciteitsequivalenten voor ingestie, als bedoeld in de [bijlage bij het Besluit stralingsbescherming]
      (onbekend);

      c. bij lozing in het oppervlaktewater, de activiteit van de in totaal in een kalenderjaar geloosde
      hoeveelheid splijtstoffen of ertsen bij het verlaten van de locatie via een lozingspunt lager is dan 0,1
      radiotoxiciteitsequivalent voor ingestie, als bedoeld in de [bijlage bij het Besluit stralingsbescherming]
      (onbekend).

      2 De geloosde hoeveelheden, uitgedrukt in radiotoxiciteitsequivalenten, worden gecorrigeerd voor fysisch verval
      door middel van de correctiefactoren zoals aangegeven in de [bijlage bij het Besluit stralingsbescherming]
      (onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
