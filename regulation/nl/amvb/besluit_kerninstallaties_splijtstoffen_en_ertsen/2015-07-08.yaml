  - number: '6.1'
    text: |-
      De aanvraag om een vergunning voor het oprichten van een inrichting, waarin kernenergie kan worden vrijgemaakt,
      bevat in ieder geval:
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel6
  - number: 6.1.a
    text: |-
      een opgave en beschrijving van de plaats, waar de inrichting zal worden gevestigd, onder vermelding van alle
      terzake doende omstandigheden van geografische, geologische, klimatologische en andere aard;
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel6
  - number: 6.1.b
    text: |-
      een beschrijving van de inrichting met inbegrip van de daarin te bezigen installaties, alsmede van de werking van
      die inrichting en installaties, met opgave van de leveranciers van die onderdelen, welke voor de beoordeling van de
      veiligheid van belang zijn, en onder vermelding van het hoogste vermogen, waarop de inrichting zal werken;
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel6
  - number: 6.1.c
    text: |-
      een opgave van de chemische en fysische toestand, de vorm, het gehalte en de verrijkingsgraad der splijtstoffen,
      welke in de inrichting zullen worden gebruikt, onder vermelding van de hoeveelheid der onderscheidene
      splijtstoffen, welke ten hoogste te eniger tijd in de inrichting aanwezig zal zijn;
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel6
  - number: 6.1.d
    text: |-
      een beschrijving van de wijze, waarop de onder *c* bedoelde splijtstoffen in de inrichting zullen worden gebruikt,
      en van de wijze, waarop de splijtstoffen voor en na het gebruik zullen worden bewaard;
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel6
  - number: 6.1.e
    text: |-
      een globale opgave van het totaal aantal personen, dat bij normaal bedrijf in de inrichting werkzaam zal zijn,
      alsmede een opgave van het aantal deskundigen en het aantal andere leden van het personeel, dat rechtstreeks bij
      het vrijmaken van kernenergie betrokken zal zijn, en van de onderlinge taakverdeling tussen die personeelsleden,
      zomede - voor wat betreft toezichthoudend personeel - van de gronden, waarop zij geacht kunnen worden voldoende
      deskundigheid voor het verrichten van hun taak te bezitten;
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel6
  - number: 6.1.f
    text: |-
      een beschrijving van de wijze, waarop de aanvrager voornemens is zich na gebruik te ontdoen van de onder *c*
      bedoelde splijtstoffen;
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel6
  - number: 6.1.g
    text: |-
      een beschrijving van de wijze, waarop de aanvrager voornemens is zich te ontdoen van radioactieve stoffen, welke
      tijdens het gebruik van de onder *c* bedoelde splijtstoffen zullen ontstaan;
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel6
  - number: 6.1.h
    text: |-
      een veiligheidsrapport, inhoudende een beschrijving van de maatregelen, die door of vanwege de aanvrager
      zullen worden getroffen ter voorkoming van schade, of ter beperking van de kans op schade, waaronder begrepen
      de maatregelen ter voorkoming van schade buiten de inrichting, tijdens normaal bedrijf, en ter voorkoming van
      schade voortvloeiende uit de in die beschrijving te vermelden gepostuleerde begin-gebeurtenissen, alsmede een
      risicoanalyse van de schade buiten de inrichting als gevolg van die gebeurtenissen;
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel6
  - number: 6.1.i
    text: een risicoanalyse van de schade buiten de inrichting als gevolg van buiten-ontwerpongevallen;
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel6
  - number: 6.1.j
    text: |-
      een opgave van de verzekering of andere financiële zekerheid, welke de aanvrager ter voldoening aan de
      [Wet aansprakelijkheid kernongevallen][ref1] zal hebben en in stand houden, onder vermelding van alle ter zake
      doende gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0003234
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003234
  - number: '6.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een aanvraag om een vergunning voor het in werking brengen of
      in werking houden van een inrichting als in dat lid bedoeld.
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel6
  - number: '7.1'
    text: |-
      De aanvraag om een vergunning voor het oprichten van een inrichting, waarin splijtstoffen, welke plutonium of
      verrijkt uranium bevatten, of bestraalde splijtstoffen kunnen worden vervaardigd, bewerkt of verwerkt, bevat in
      ieder geval de gegevens, bedoeld in [artikel 6, eerste lid][ref1], met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel6
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002667
        artikel: '6'
        hoofdstuk: II
        paragraaf: '3'
  - number: 7.1.a
    text: |-
      onder *b* in plaats van "het hoogste vermogen, waarop de inrichting zal werken" wordt gelezen: "de grootste
      hoeveelheid der onderscheidene splijtstoffen, welke in een bepaald tijdvak in de inrichting kan worden vervaardigd,
      bewerkt of verwerkt";
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel7
  - number: 7.1.b
    text: |-
      telkens in plaats van "gebruikt" onderscheidenlijk "het gebruik" of "het vrijmaken van kernenergie" wordt gelezen:
      "vervaardigd, bewerkt of verwerkt" onderscheidenlijk "de vervaardiging, bewerking of verwerking".
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel7
  - number: '7.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een aanvraag om een vergunning voor het in werking brengen of
      in werking houden van een inrichting als in dat lid bedoeld.
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel7
  - number: '8.1'
    text: |-
      De aanvraag om een vergunning voor het oprichten van een inrichting, waarin splijtstoffen als bedoeld in
      [artikel 7, eerste lid][ref1], worden opgeslagen, bevat in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel7
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002667
        artikel: '7'
        hoofdstuk: II
        paragraaf: '3'
  - number: 8.1.a
    text: |-
      een opgave en beschrijving van de plaats, waar de inrichting zal worden gevestigd, onder vermelding van alle
      terzake doende omstandigheden van geografische, geologische, klimatologische en andere aard;
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel8
  - number: 8.1.b
    text: |-
      een opgave van de chemische en fysische toestand, de vorm, het gehalte en de verrijkingsgraad, zomede, voor wat
      bestraalde splijtstoffen betreft, een zo nauwkeurig mogelijke opgave van de activiteit der splijtstoffen, onder
      vermelding van de hoeveelheid der onderscheidene splijtstoffen, welke ten hoogste te eniger tijd in de inrichting
      aanwezig zal zijn;
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel8
  - number: 8.1.c
    text: |-
      een globale opgave van het totaal aantal personen, dat bij normaal bedrijf in de inrichting werkzaam zal zijn,
      alsmede een opgave van het aantal leden van het personeel, dat rechtstreeks bij de opslag van splijtstoffen
      betrokken zal zijn, en van de onderlinge taakverdeling tussen die personeelsleden, zomede - voor wat betreft
      het toezichthoudend personeel - van de gronden, waarop zij geacht kunnen worden voldoende deskundigheid voor het
      verrichten van hun taak te bezitten;
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel8
  - number: 8.1.d
    text: |-
      een veiligheidsrapport als bedoeld in [artikel 6, eerste lid, onder h][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel6
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002667
        artikel: '6'
        hoofdstuk: II
        paragraaf: '3'
  - number: 8.1.e
    text: |-
      een risicoanalyse als bedoeld in [artikel 6, eerste lid, onder i][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel6
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002667
        artikel: '6'
        hoofdstuk: II
        paragraaf: '3'
  - number: 8.1.f
    text: |-
      een opgave van de verzekering of andere financiële zekerheid als bedoeld in [artikel 6, eerste lid, onder j][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel6
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002667
        artikel: '6'
        hoofdstuk: II
        paragraaf: '3'
  - number: '8.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een aanvraag om een vergunning voor het in werking brengen of
      in werking houden van een inrichting als in dat lid bedoeld.
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel8
  - number: '9.1'
    text: |-
      De aanvraag om een vergunning voor het oprichten van een inrichting, waarin onbestraalde splijtstoffen, welke geen
      plutonium of verrijkt uranium bevatten, kunnen worden vervaardigd, bewerkt of verwerkt, bevat in ieder geval:
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel9
  - number: 9.1.a
    text: een opgave en beschrijving van de plaats, waar de inrichting zal worden gevestigd;
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel9
  - number: 9.1.b
    text: een beschrijving van de inrichting;
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel9
  - number: 9.1.c
    text: |-
      een opgave van de chemische en fysische toestand, de vorm en het gehalte der splijtstoffen, onder vermelding van de
      hoeveelheid der onderscheidene splijtstoffen, welke ten hoogste te eniger tijd in de inrichting aanwezig zal zijn;
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel9
  - number: 9.1.d
    text: |-
      een opgave van het aantal personeelsleden, dat verantwoordelijk zal zijn voor het op deskundige wijze vervaardigen,
      bewerken, of verwerken van splijtstoffen, met vermelding van de gronden, waarop zij geacht kunnen worden voldoende
      deskundigheid te bezitten;
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel9
  - number: 9.1.e
    text: |-
      een beschrijving van de maatregelen, welke door of vanwege de aanvrager zullen worden getroffen ter voorkoming van
      schade, waaronder begrepen de maatregelen ter voorkoming van schade buiten de inrichting;
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel9
  - number: 9.1.f
    text: |-
      een risicoanalyse van de schade buiten de inrichting, welke is verbonden aan het vervaardigen, bewerken of
      verwerken in de inrichting van de onder c bedoelde splijtstoffen.
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel9
  - number: '9.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een aanvraag om een vergunning voor het in werking brengen of
      in werking houden van een inrichting als in dat lid bedoeld.
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel9
  - number: '10.1'
    text: |-
      Indien een aanvraag om een vergunning tot wijziging van een inrichting als bedoeld in de [artikelen 6][ref1],
      [7][ref2], [8][ref3] of [9][ref4] mede strekt tot het buiten gebruik stellen of ontmantelen van de inrichting of
      een deel daarvan, bevat de aanvraag in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002667#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002667#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002667#Artikel9
