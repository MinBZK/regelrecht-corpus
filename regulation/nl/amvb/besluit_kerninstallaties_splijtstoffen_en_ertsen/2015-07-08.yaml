      dosislimieten, geldend krachtens [artikel 19][ref1] in samenhang met de [artikelen 4][ref2], [5][ref3],
      [6][ref4], [9][ref5], [10][ref6], [11][ref7], [12][ref8], [48][ref9], [76][ref10], [77][ref11] en
