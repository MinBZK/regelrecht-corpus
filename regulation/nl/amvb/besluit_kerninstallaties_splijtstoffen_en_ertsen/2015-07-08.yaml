      1 Een aanvraag om goedkeuring voor de wijze waarop financiële zekerheid wordt gesteld als bedoeld in
      [artikel 15f, eerste lid, van de wet][ref1] wordt ingediend bij Onze Minister met gelijktijdige toezending van een
      afschrift aan Onze Minister van Financiën.

      2 Een aanvraag om goedkeuring als bedoeld in het eerste lid bevat in elk geval de volgende gegevens:

      a. een overzicht van de verschillende kostenposten voor de buitengebruikstelling en de ontmanteling van
      de betrokken inrichting, bedoeld in [artikel 15, onder b, van de wet][ref2], waarbij wordt uitgegaan
      van het laatst door Onze Minister goedgekeurde ontmantelingsplan en de voorschriften die op grond van
      [artikel 27, vierde lid][ref3], aan de goedkeuring van het ontmantelingsplan zijn verbonden;

      b. een berekening van de kosten behorende bij de onder a bedoelde kostenposten, bepaald aan de hand van een
      algemeen aanvaarde methode en op basis van het prijspeil op het moment van de indiening van de aanvraag;

      c. een omrekening van de overeenkomstig onderdeel b bepaalde kosten naar de kosten op het moment van de
      buitengebruikstelling en de ontmanteling, bepaald aan de hand van een algemeen aanvaarde indexeringsmethode;

      d. een overzicht waaruit blijkt dat het bedrag van de berekening van de kosten op het moment van de
      buitengebruikstelling en de ontmanteling is gedekt door financiële zekerheid.

      3 Onze Minister kan nadere regels stellen met betrekking tot de aanvraag om goedkeuring.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15f
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0002667#Artikel27
