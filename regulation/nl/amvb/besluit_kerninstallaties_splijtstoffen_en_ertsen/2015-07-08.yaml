  - number: 30f
    text: |-
      1 De houder van een vergunning voor een inrichting als bedoeld in [artikel 15, onder b, van de wet][ref1]
      treft tijdig bij een krachtens [artikel 37, achtste lid, van het Besluit stralingsbescherming][ref2] of
      [artikel 42, derde lid, onder e][ref3], aangewezen instelling een voorziening voor de opslag van:

      a. de splijtstof of erts bevattende afvalstoffen die door het gebruik van die inrichting ontstaan,

      b. de splijtstof of erts bevattende afvalstoffen en de radioactieve afvalstoffen die terugkomen na opwerking van de
      splijtstoffen die in die inrichting zijn gebruikt en

      c. de radioactieve afvalstoffen die vrijkomen bij de buitengebruikstelling en de ontmanteling van die inrichting.

      2 Onze Minister kan regels stellen over de te treffen voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel37
