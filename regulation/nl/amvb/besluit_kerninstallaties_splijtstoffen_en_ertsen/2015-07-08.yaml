      1 Gelijktijdig met de aanvraag om een vergunning voor het buiten gebruik stellen en het ontmantelen van een
      inrichting als bedoeld in [artikel 15, onder b, van de wet][ref1], waarin kernenergie kan worden vrijgemaakt, wordt
      een aanvraag ingediend om goedkeuring voor de wijze waarop financiële zekerheid wordt gesteld.

      2 Indien het eerste lid van toepassing is, wordt in afwijking van [artikel 44a, tweede lid, onder a][ref2], bij
      het overzicht van de verschillende kostenposten voor de buitengebruikstelling en de ontmanteling uitgegaan van het
      ontmantelingsplan zoals dat is ingediend bij de aanvraag om een vergunning voor het buiten gebruik stellen en het
      ontmantelen van de inrichting.


