  - number: 11a
    text: |-
      In gevallen waarin de vergunning betrekking heeft op het oprichten of wijzigen van een inrichting als bedoeld
      in [artikel 15, onder b, van de wet][ref1], dat tevens is aan te merken als een bouwactiviteit als bedoeld in
      [artikel 2.1, eerste lid, onder a, van de Wet algemene bepalingen omgevingsrecht][ref2], verstrekt de aanvrager:

      a. indien de aanvraag om vergunning voor die bouwactiviteit tegelijk met de aanvraag om de vergunning krachtens
      deze wet is ingediend, een afschrift van de aanvraag om vergunning voor die bouwactiviteit bij zijn aanvraag;

      b. indien de aanvraag om vergunning voor die bouwactiviteit niet tegelijk met de aanvraag om de vergunning
      krachtens deze wet wordt ingediend, een afschrift van de aanvraag om vergunning voor die bouwactiviteit aan het
      bevoegd gezag gelijktijdig met de indiening van die aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel11a
