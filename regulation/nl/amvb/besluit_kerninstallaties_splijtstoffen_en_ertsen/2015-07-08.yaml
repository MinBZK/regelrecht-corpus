    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Ministers van Economische Zaken en van Sociale Zaken en Volksgezondheid van 8 mei 1968,
    no. 668/372 W.J.A., gedaan in overeenstemming met Onze Minister van Verkeer en Waterstaat, de Centrale Raad voor de
    Kernenergie gehoord;

    Gelet op de artikelen 16, 17, 19, eerste lid, 21, 26, 73 en 76, eerste lid, van de Kernenergiewet (Stb. 1963, 82);

    De Raad van State gehoord (advies van 10 juli 1968, no. 42);

    Gezien het nader rapport van Onze Minister van Economische Zaken en de Staatssecretaris van Sociale Zaken en
    Volksgezondheid van 3 september 1969, no. 669/609 W.J.A., uitgebracht in overeenstemming met Onze Minister van
    Verkeer en Waterstaat;

    Hebben goedgevonden en verstaan:
