    text: |-
      een beschrijving van de maatregelen die door of vanwege de aanvrager zullen worden getroffen ter voorkoming van
      schade;
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel4
  - number: 4.1.e
    text: |-
      een risicoanalyse van de schade van het voorhanden hebben van de onder a bedoelde splijtstoffen buiten de onder c
      bedoelde plaats, inrichting of uitrusting;
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel4
  - number: 4.1.f
    text: |-
      een opgave van alle handelingen en werkzaamheden met splijtstoffen, ertsen, radioactieve stoffen en
      toestellen binnen de locatie die meldingsplichtig of vergunningplichtig zijn krachtens dit besluit, het
      [Besluit stralingsbescherming][ref1] of het [Besluit vervoer splijtstoffen, ertsen en radioactieve stoffen][ref2].


