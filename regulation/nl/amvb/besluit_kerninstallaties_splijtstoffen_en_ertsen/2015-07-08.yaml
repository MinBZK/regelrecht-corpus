    text: |-
      1 De aanvraag om een vergunning voor het zich ontdoen van splijtstoffen bevat in ieder geval:

      a. een opgave van de hoeveelheden, de chemische en fysische toestand, de vorm, het gehalte en de verrijkingsgraad,
      zomede een zo nauwkeurig mogelijke opgave van de activiteit der splijtstoffen;

      b. een opgave en beschrijving van de plaats, waar en de wijze, waarop de aanvrager zich van de splijtstoffen wenst
      te ontdoen;

      c. een beschrijving van de maatregelen, welke door of vanwege de aanvrager zullen worden getroffen ter voorkoming
      van schade;

      d. een risicoanalyse van de schade buiten de onder b bedoelde plaats als gevolg van de handeling waarvoor
      vergunning wordt gevraagd;

      e. een opgave van alle handelingen en werkzaamheden met splijtstoffen, ertsen, radioactieve stoffen en
      toestellen binnen de locatie die meldingsplichtig of vergunningplichtig zijn krachtens dit besluit, het
      [Besluit stralingsbescherming][ref1] of het [Besluit vervoer splijtstoffen, ertsen en radioactieve stoffen][ref2].

      2 De aanvraag om een vergunning voor het zich ontdoen van ertsen bevat in ieder geval:

      a. een opgave van de aard, de hoeveelheid en het gemiddelde uranium- of thoriumgehalte der ertsen;

      b. een opgave en beschrijving van de plaats, waar en de wijze, waarop de aanvrager zich van de ertsen wenst te
      ontdoen;

      c. een beschrijving van de maatregelen, welke door of vanwege de aanvrager zullen worden getroffen ter voorkoming
      van schade;

      d. een risicoanalyse van de schade buiten de onder b bedoelde plaats als gevolg van de handeling waarvoor
      vergunning wordt gevraagd;

      e. een opgave van alle handelingen en werkzaamheden met splijtstoffen, ertsen, radioactieve stoffen en
      toestellen binnen de locatie die meldingsplichtig of vergunningplichtig zijn krachtens dit besluit, het
      [Besluit stralingsbescherming][ref3] of het [Besluit vervoer splijtstoffen, ertsen en radioactieve stoffen][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0012702
