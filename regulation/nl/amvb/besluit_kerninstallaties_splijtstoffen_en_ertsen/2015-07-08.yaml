  - number: 11.1.e
    text: |-
      indien de aanvraag betrekking heeft op een inrichting als bedoeld in [artikel 9][ref1] en de voorgenomen wijziging
      van invloed is op een of meer gegevens als vermeld in de ter verkrijging van de onder a bedoelde vergunning
      overgelegde risicoanalyse als bedoeld in [artikel 9, eerste lid, onder f][ref2], een desbetreffende aanvulling van
      die risicoanalyse.


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002667#Artikel9
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel11
