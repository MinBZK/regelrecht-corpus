        bwb_id: BWBR0002667
        artikel: '15'
        hoofdstuk: III
        paragraaf: '1'
  - number: '38'
    text: |-
      1 Aan een vergunning als bedoeld in [artikel 15, onder b][ref1], van de wet ten aanzien van een inrichting, bestemd
      voor de opwekking van thermische of elektrische energie voor de openbare energievoorziening, worden voorschriften
      met het oog op de energievoorziening verbonden, indien:

      a. een geregelde voorziening van voor die inrichting vereiste splijtstoffen niet in voldoende mate is gewaarborgd,
      dan wel

      b. het ononderbroken in bedrijf houden van de inrichting niet in voldoende mate is gewaarborgd.

      2 Voorschriften als bedoeld in het eerste lid, onder *a*, kunnen de verplichting inhouden tot het aanhouden van een
      voorraad splijtstoffen van bij het voorschrift te bepalen aard en samenstelling, in een daarbij te bepalen omvang,
      gedurende daarbij te bepalen tijdvakken.

      3 Voorschriften als bedoeld in het eerste lid, onder *b*, kunnen de verplichting inhouden om de inrichting op een
      landelijk koppelnet te doen aansluiten dan wel op een andere wijze te beschikken over een zodanig reservevermogen,
      dat de energievoorziening gedurende een bij het voorschrift te bepalen tijdvak is gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002667
        artikel: '15'
        hoofdstuk: III
        paragraaf: '1'
  - number: '39'
    text: |-
      Aan een vergunning als bedoeld in [artikel 15, onder b of c, van de wet][ref1], welke uitsluitend of mede
      betrekking heeft op een inrichting of uitrusting, waarop de [Wet aansprakelijkheid kernongevallen][ref2] dan wel
      de wet van 24 oktober 1973, houdende regelen inzake wettelijke aansprakelijkheid van exploitanten van nucleaire
      schepen (*Stb.* 536), van toepassing is, wordt met het oog op het zeker stellen van de betaling van de vergoeding,
      aan derden toekomend voor schade, hun toegebracht, het voorschrift verbonden tot het hebben en in stand houden
      van een zodanige verzekering of andere financiële zekerheid als waartoe de houder van de vergunning ingevolge die
      wettelijke regeling gehouden is.


      [ref1]: https://wetten.overheid.nl/BWBR0003418#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003234
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel39
    references:
