  - number: '10.3'
    text: 'De aanvraag voor het wijzigen van een vergunning als bedoeld in het eerste lid, bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel10
  - number: 10.3.a
    text: een opgave van de vergunning krachtens welke de betrokken inrichting buiten gebruik is gesteld of wordt ontmanteld;
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel10
  - number: 10.3.b
    text: een beschrijving van de voorgenomen wijziging;
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel10
  - number: 10.3.c
    text: |-
      indien de voorgenomen wijziging van invloed is op een of meer gegevens als vermeld in het ontmantelingsplan genoemd
      in het eerste lid, onder b, een desbetreffende aanvulling van dat plan.
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel10
  - number: '10.4'
    text: |-
      Gelijktijdig met de aanvraag om een vergunning voor het buiten gebruik stellen van een inrichting als bedoeld in
      het eerste lid, wordt een aanvraag ingediend om een vergunning voor het ontmantelen van die inrichting.
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel10
  - number: '11.1'
    text: |-
      De aanvraag om een vergunning voor het wijzigen van een inrichting als bedoeld in [artikel 6][ref1], [7][ref2],
      [8][ref3] of [9][ref4] bevat in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002667#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002667#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002667#Artikel9
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel11
    references:
