      Ter voorkoming van schade of ter beperking van de kans op schade buiten de inrichting kunnen aan een vergunning
      als bedoeld in [artikel 15, onder b][ref1], van de wet ook andere voorschriften worden verbonden dan bedoeld in
      [artikel 31, eerste lid][ref2].


