  - number: 30b
    text: |-
      Onze Minister en Onze Minister van Sociale Zaken en Werkgelegenheid kunnen regels stellen met betrekking
      tot de wijze waarop de buitengebruikstelling en de ontmanteling van een inrichting als bedoeld in
      [artikel 15, onder b, van de wet][ref1] plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
