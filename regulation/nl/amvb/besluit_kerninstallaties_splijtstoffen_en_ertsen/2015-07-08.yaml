        artikel: '15'
  - number: 30a
    text: |-
      1 Bij de ontmanteling van een inrichting als bedoeld in [artikel 15, onder b, van de wet][ref1] worden de
      feitelijke beperkingen die in de weg staan aan de realisatie van elke volgende functie op het terrein waarop de
      inrichting was gevestigd, weggenomen voor zover die beperkingen het gevolg zijn van die inrichting.

      2 Bij een vergunning voor het buiten gebruik stellen en het ontmantelen van een inrichting als bedoeld in
      [artikel 15, onder b, van de wet][ref2] kan Onze Minister in bijzondere omstandigheden toestaan dat wordt afgeweken
      van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel15
