  - number: '16'
    text: |-
      [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1] alsmede [afdeling 13.2 van de Wet milieubeheer][ref2] zijn
      niet van toepassing op de voorbereiding van beschikkingen ter zake van het voorhanden hebben of het zich ontdoen
      van splijtstoffen:

      a. indien het betreft plutonium met een maximale activiteit van 37 gigabecquerel, mits dit plutonium op zodanige
      wijze is opgenomen in een omhulsel dat daardoor redelijkerwijze voldoende weerstand wordt geboden om elke
      verspreiding van of besmetting met dit plutonium te voorkomen;

      b. indien het betreft verarmd uranium, natuurlijk uranium of natuurlijk thorium.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel16
