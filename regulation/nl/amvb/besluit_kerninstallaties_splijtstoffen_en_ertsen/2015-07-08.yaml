      1 Het in [artikel 15, onder a, van de wet][ref1] vervatte verbod geldt niet voor handelingen met een ingekapselde
      bron waarbij de krachtens [artikel 3, eerste lid, aanhef en onder c, van het Besluit stralingsbescherming][ref2]
      vastgestelde waarde voor de activiteit en de activiteitsconcentratie worden overschreden, indien:

      a. deze van een door Onze Minister goedgekeurd type is en

      b. deze onder normale bedrijfsomstandigheden op 0,1 meter van enige bereikbare buitenzijde daarvan geen hogere
      omgevingsdosisequivalent kan geven dan 1 μSv per uur.

      2 Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot keuringen als bedoeld in het
      eerste lid, onder a, en voor de opslag en de verwijdering van ingekapselde bronnen als bedoeld in het eerste lid.


