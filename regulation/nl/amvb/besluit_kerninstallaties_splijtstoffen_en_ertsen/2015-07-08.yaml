  - number: '18'
    text: |-
      1 Geen vergunning als bedoeld in [artikel 15 van de wet][ref1] wordt verleend indien:

      a. niet is voldaan aan de voorwaarden betreffende rechtvaardiging, optimalisatie, deskundigheid en
      dosislimieten, geldend krachtens [artikel 19][ref2] in samenhang met de [artikelen 4][ref3], [5][ref4],
      [6][ref5], [9][ref6], [10][ref7], [11][ref8], [12][ref9], [48][ref10], [76][ref11], [77][ref12] en
      [78 van het Besluit stralingsbescherming][ref13];

      b. voor een lid van de bevolking dat zich buiten de locatie bevindt, als gevolg van de handeling waarvoor de
      vergunning is aangevraagd en ten gevolge van andere handelingen binnen en buiten deze locatie, een van de volgende
      doses wordt overschreden:

      1. een effectieve dosis van 1 mSv in een kalenderjaar, en met inachtneming daarvan:

      2. een equivalente dosis van 50 mSv in een kalenderjaar voor de huid gemiddeld over enig huidoppervlak van 1 cm2;

      c. de handeling waarvoor de vergunning is aangevraagd behoort tot een categorie, die in de krachtens
      [artikel 19][ref14] in samenhang met [artikel 4, tweede lid, van het Besluit stralingsbescherming][ref15] geldende
      regeling als gerechtvaardigd is bekendgemaakt, maar het specifieke karakter van deze handeling op grond van
      [artikel 4, eerste lid, van dat besluit][ref16] niet gerechtvaardigd is.

      2 Een vergunning als bedoeld in [artikel 15, onder b, van de wet][ref17] wordt geweigerd, indien:

      a. de waarden van de gegevens in de risicoanalyse, bedoeld in [artikel 6, eerste lid, onder h][ref18], niet voldoen
      aan de in onderstaande tabel opgenomen limietwaarden;









                        Gebeurtenisfrequentie F per jaar


                        Maximaal toegestane effectieve dosis









                        personen vanaf 16 jaar


                        personen tot 16 jaar




                        F ≥ 10–1


                        0,1 mSv


                        0,04 mSv




                        10–1 > F ≥ 10–2


                        1 mSv


                        0,4 mSv




                        10–2 > F ≥ 10–4


                        10 mSv


                        4 mSv




                        F < 10–4


                        100 mSv


                        40 mSv






      b. dan wel uit die risico-analyse blijkt dat de effectieve schildklierdosis niet beperkt blijft tot 500 mSv.

      3 Een vergunning voor het oprichten, in werking brengen of houden of wijzigen van een inrichting,
      waarin kernenergie kan worden vrijgemaakt, kan worden geweigerd, indien de waarden in de krachtens
      [artikel 6, eerste lid, onder i][ref19], verrichte risicoanalyse een van de volgende waarden overschrijden:

      a. een kans van 10–6 per jaar dat een persoon, die zich permanent en onbeschermd buiten de desbetreffende
      inrichting zou bevinden, overlijdt als gevolg van een buiten-ontwerpongeval;

      b. een kans van 10–5 per jaar dat buiten de desbetreffende inrichting een groep van ten minste 10 personen direct
      dodelijk slachtoffer is van een buiten-ontwerpongeval, of voor n maal meer direct dodelijke slachtoffers een kans
      die n2 maal kleiner is.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
