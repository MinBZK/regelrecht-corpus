        artikel: '15'
  - number: '26'
    text: |-
      1 Een ontmantelingsplan bevat in ieder geval een beschrijving van:

      a. de periode waarin de buitengebruikstelling en de ontmanteling plaatsvinden;

      b. de planning van de buitengebruikstelling en de ontmanteling, waarbij een onderscheid wordt gemaakt in de
      verschillende fasen waarin de buitengebruikstelling en de ontmanteling plaatsvinden;

      c. de hoeveelheid en de activiteit van de splijtstoffen of radioactieve stoffen die zich in de verschillende fasen
      van de buitengebruikstelling en de ontmanteling in de inrichting zullen bevinden;

      d. de bij de buitengebruikstelling en de ontmanteling betrokken medewerkers, hun deskundigheid en onderlinge
      taakverdeling;

      e. de bij de buitengebruikstelling en de ontmanteling toe te passen technieken;

      f. de relevante milieuaspecten, in het bijzonder het beheer van radioactieve afvalstoffen die bij de
      buitengebruikstelling en de ontmanteling vrijkomen.

      2 Het ontmantelingsplan is gebaseerd op een wijze van buitengebruikstelling en ontmanteling die voldoet aan de
      [artikelen 30][ref1] en [30a][ref2] en de krachtens [artikel 30b][ref3] gestelde regels.

      3 Bij regeling van Onze Minister en Onze Minister van Sociale Zaken en Werkgelegenheid kunnen nadere regels worden
      gesteld met betrekking tot de inhoud van het ontmantelingsplan. Daarbij kan worden bepaald dat de gestelde regels
      slechts gelden in de aangegeven categorieën van gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0002667#Artikel30a
      [ref3]: https://wetten.overheid.nl/BWBR0002667#Artikel30b
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel26
