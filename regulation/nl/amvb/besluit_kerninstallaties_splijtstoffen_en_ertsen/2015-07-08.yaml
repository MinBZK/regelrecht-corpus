        artikel: 30b
        hoofdstuk: IIIa
  - number: '27'
    text: |-
      1 Het ontmantelingsplan van de houder van een vergunning voor het oprichten, het in werking brengen of het in
      werking houden van een inrichting als bedoeld in [artikel 15, onder b, van de wet][ref1] en wijzigingen van dat
      plan behoeven goedkeuring van Onze Minister.

      2 Goedkeuring wordt geweigerd indien het ontmantelingsplan niet voldoet aan de eisen die bij of krachtens dit
      besluit zijn gesteld.

      3 Onze Minister beslist op de aanvraag om goedkeuring van het ontmantelingsplan binnen zes maanden na ontvangst van
      de aanvraag.

      4 Onze Minister kan aan de goedkeuring voorschriften verbinden.

      5 Onze Minister kan de goedkeuring intrekken indien het ontmantelingsplan niet meer voldoet aan de eisen die
      daaraan bij of krachtens dit besluit zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: '28'
    text: |-
      De houder van een vergunning voor het oprichten, het in werking brengen of het in werking houden van een
      inrichting als bedoeld in [artikel 15, onder b, van de wet][ref1] handelt overeenkomstig het laatst goedgekeurde
      ontmantelingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: '29'
    text: |-
      1 Vanaf het tijdstip waarop een vergunning voor het in werking brengen van een inrichting als bedoeld in
      [artikel 15, onder b, van de wet][ref1] is verleend totdat een vergunning voor het buiten gebruik stellen van die
      inrichting is verleend, actualiseert de houder van de vergunning voor het in werking brengen of het in werking
      houden van die inrichting het ontmantelingsplan ten minste elke vijf jaar, of wanneer Onze Minister dit nodig acht.

      2 De actualisatie, bedoeld in het eerste lid, betreft in ieder geval:

      a. de planning van de buitengebruikstelling en de ontmanteling;

      b. de bij de buitengebruikstelling en de ontmanteling toe te passen technieken;

      c. wijzigingen van de inrichting voor zover deze gevolgen kunnen hebben voor de buitengebruikstelling of de
      ontmanteling.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: '30'
    text: |-
      1 De houder van een vergunning voor een inrichting als bedoeld in [artikel 15, onder b, van de wet][ref1] vangt aan
      met de buitengebruikstelling en de ontmanteling van die inrichting onmiddellijk nadat de normale bedrijfsvoering
      is beëindigd.

      2 Onze Minister kan in bijzondere omstandigheden toestaan dat op een later tijdstip met de buitengebruikstelling en
      de ontmanteling van de inrichting wordt aangevangen.

      3 De houder van een vergunning voor het buiten gebruik stellen en het ontmantelen van een inrichting als bedoeld in
      [artikel 15, onder b, van de wet][ref2] voltooit de buitengebruikstelling en de ontmanteling van die inrichting zo
      snel als redelijkerwijs mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel30
