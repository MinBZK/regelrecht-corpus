  - number: 10.1.a
    text: |-
      een opgave van de vergunning krachtens welke de betrokken inrichting is opgericht dan wel in werking gebracht of
      gehouden;
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel10
  - number: 10.1.b
    text: een ontmantelingsplan.
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel10
  - number: '10.2'
    text: |-
      Een aanvraag om een vergunning als bedoeld in het eerste lid bevat tevens, indien het betrekking heeft op een
      inrichting:
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel10
  - number: 10.2.a
    text: |-
      als bedoeld in de [artikelen 6][ref1], [7][ref2] of [8][ref3]: een veiligheidsrapport als bedoeld in
      [artikel 6, eerste lid, onder h][ref4], en een risicoanalyse als bedoeld in [artikel 6, eerste lid, onder i][ref5],


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002667#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002667#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002667#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0002667#Artikel6
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel10
