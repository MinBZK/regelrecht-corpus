  - number: 30c
    text: |-
      Onze Minister beslist op een aanvraag tot het intrekken van een vergunning voor het ontmantelen van een inrichting
      als bedoeld in [artikel 15, onder b, van de wet][ref1] binnen zes maanden na ontvangst van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel30c
