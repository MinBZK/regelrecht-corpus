  - number: '11'
    text: |-
      1 De aanvraag om een vergunning voor het wijzigen van een inrichting als bedoeld in [artikel 6][ref1], [7][ref2],
      [8][ref3] of [9][ref4] bevat in ieder geval:

      a. een opgave van de vergunning, krachtens welke de betrokken inrichting is opgericht dan wel in werking gebracht
      of gehouden;

      b. een beschrijving van de voorgenomen wijziging;

      c. indien de aanvraag betrekking heeft op een inrichting als bedoeld in [artikel 6][ref5], [7][ref6] of [8][ref7]
      en de voorgenomen wijziging van invloed is op een of meer gegevens als vermeld in het ter verkrijging van de onder
      a bedoelde vergunning overgelegde veiligheidsrapport of de risicoanalyse, bedoeld in [artikel 6, onder h][ref8],
      een desbetreffende aanvulling hiervan;

      d. indien de aanvraag betrekking heeft op een inrichting als bedoeld in [artikel 6][ref9], [7][ref10] of [8][ref11]
      en de voorgenomen wijziging van invloed is op een of meer gegevens als vermeld in de ter verkrijging van de
      onder a bedoelde vergunning overgelegde risicoanalyse, bedoeld in [artikel 6, eerste lid, onder i][ref12], een
      desbetreffende aanvulling van die risicoanalyse;

      e. indien de aanvraag betrekking heeft op een inrichting als bedoeld in [artikel 9][ref13] en de voorgenomen
      wijziging van invloed is op een of meer gegevens als vermeld in de ter verkrijging van de onder a bedoelde
      vergunning overgelegde risicoanalyse als bedoeld in [artikel 9, eerste lid, onder f][ref14], een desbetreffende
      aanvulling van die risicoanalyse.

      2 Indien de vergunning met betrekking tot een inrichting als bedoeld in [artikel 6][ref15], [7][ref16]
      of [8][ref17] is verkregen op een tijdstip waarop ter verkrijging van die vergunning geen risicoanalyse als bedoeld
      in [artikel 6, eerste lid, onder i][ref18], behoefde te worden overgelegd, wordt bij de aanvraag, bedoeld in het
      eerste lid, indien de voorgenomen wijziging van invloed is op een of meer van de gegevens die doorgaans worden
      vermeld in een zodanige risicoanalyse, een risicoanalyse als bedoeld in [artikel 6, eerste lid, onder i][ref19],
      gevoegd, die niet alleen betrekking heeft op de wijziging, maar ook op het in werking zijn van de inrichting.

      3 Dit artikel is niet van toepassing op een aanvraag om een vergunning als bedoeld in [artikel 10][ref20].


