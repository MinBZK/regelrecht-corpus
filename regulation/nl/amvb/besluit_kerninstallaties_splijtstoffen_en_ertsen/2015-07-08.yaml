        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '15'
  - number: '37'
    text: |-
      1 Aan een vergunning als bedoeld in [artikel 15, onder a][ref1], van de wet worden voorschriften met het oog op de
      energievoorziening verbonden, indien een geregelde voorziening met splijtstoffen of ertsen niet in voldoende mate
      is gewaarborgd.

      2 Voorschriften als bedoeld in het eerste lid kunnen de verplichting inhouden splijtstoffen of ertsen uitsluitend
      van bij het voorschrift aan te wijzen leveranciers te betrekken dan wel aan daarbij aan te wijzen afnemers te
      leveren.


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel37
    references:
