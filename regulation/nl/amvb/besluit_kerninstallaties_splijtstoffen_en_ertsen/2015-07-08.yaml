      constructie en de kwaliteit van de bron.
    url: https://wetten.overheid.nl/BWBR0002667/2015-07-08#Artikel4
  - number: '4.3'
    text: 'De aanvraag om een vergunning voor het voorhanden hebben van ertsen bevat in ieder geval:'
