    text: |-
      in gevallen waarin de beschikking een inrichting als bedoeld in [artikel 6][ref1] betreft, voor zover die
      inrichting is bestemd voor de productie van elektriciteit:


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel6
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel15
    references:
