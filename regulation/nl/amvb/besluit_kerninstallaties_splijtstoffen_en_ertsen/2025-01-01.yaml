      burgemeester en wethouders van de gemeenten waarvan het gebied is gelegen op minder dan twintig kilometer van de
      plaats waar de inrichting gelegen is of zal zijn, en
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel15
  - number: 15.a.3°
