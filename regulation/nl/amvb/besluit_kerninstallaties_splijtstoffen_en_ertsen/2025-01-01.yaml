      - id: ref2
        bwb_id: BWBR0002668
  - number: '4.4'
    text: 'Indien de aanvraag betrekking heeft op een hoogactieve bron, bevat de aanvraag voorts:'
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel4
  - number: 4.4.a
    text: informatie over het volume van de bron, de bronhouder en de vaste afscherming van die bron;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel4
  - number: 4.4.b
    text: |-
      schriftelijk bewijs dat de krachtens [artikel 19][ref1] in samenhang met
      [artikel 4.15, eerste lid, van het Besluit basisveiligheidsnormen stralingsbescherming][ref2] vereiste financiële
