      bijlage bij de Omgevingswet dat gelegen is op minder dan tien kilometer van de plaats waar de inrichting gelegen is
      of zal zijn;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel15
  - number: 15.c
    text: |-
      in gevallen waarin de beschikking een inrichting als bedoeld in [artikel 9][ref1] betreft: het college van
      burgemeester en wethouders van de gemeente of gemeenten, waar de inrichting gelegen is of zal zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel9
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002667
        artikel: '9'
        hoofdstuk: II
        paragraaf: '3'
  - number: '16'
    text: |-
      [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1] alsmede [afdeling 13.2 van de Wet milieubeheer][ref2] zijn
      niet van toepassing op de voorbereiding van beschikkingen ter zake van het voorhanden hebben of het zich ontdoen
      van splijtstoffen:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel16
    references:
