        artikel: '4'
  - number: '25'
    text: |-
      De houder van een vergunning voor het oprichten, het in werking brengen of het in werking houden van een inrichting
      als bedoeld in [artikel 15, onder b, van de wet][ref1] beschikt over een ontmantelingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: '26.1'
    text: 'Een ontmantelingsplan bevat in ieder geval een beschrijving van:'
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel26
  - number: 26.1.a
    text: de periode waarin de buitengebruikstelling en de ontmanteling plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel26
  - number: 26.1.b
    text: |-
      de planning van de buitengebruikstelling en de ontmanteling, waarbij een onderscheid wordt gemaakt in de
      verschillende fasen waarin de buitengebruikstelling en de ontmanteling plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel26
  - number: 26.1.c
    text: |-
      de hoeveelheid en de activiteit van de splijtstoffen of radioactieve stoffen die zich in de verschillende fasen van
      de buitengebruikstelling en de ontmanteling in de inrichting zullen bevinden;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel26
  - number: 26.1.d
    text: |-
      de bij de buitengebruikstelling en de ontmanteling betrokken medewerkers, hun deskundigheid en onderlinge
      taakverdeling;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel26
  - number: 26.1.e
    text: de bij de buitengebruikstelling en de ontmanteling toe te passen technieken;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel26
  - number: 26.1.f
    text: |-
      de relevante milieuaspecten, in het bijzonder het beheer van radioactieve afvalstoffen die bij de
      buitengebruikstelling en de ontmanteling vrijkomen.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel26
  - number: '26.2'
    text: |-
      Het ontmantelingsplan is gebaseerd op een wijze van buitengebruikstelling en ontmanteling die voldoet aan de
      [artikelen 30][ref1] en [30a][ref2] en de krachtens [artikel 30b][ref3] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0002667#Artikel30a
      [ref3]: https://wetten.overheid.nl/BWBR0002667#Artikel30b
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002667
        artikel: '30'
        hoofdstuk: IIIa
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0002667
        artikel: 30a
        hoofdstuk: IIIa
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0002667
        artikel: 30b
        hoofdstuk: IIIa
        paragraaf: '6'
  - number: '26.3'
    text: |-
      Bij regeling van Onze Minister en Onze Minister van Sociale Zaken en Werkgelegenheid kunnen nadere regels worden
      gesteld met betrekking tot de inhoud van het ontmantelingsplan. Daarbij kan worden bepaald dat de gestelde regels
      slechts gelden in de aangegeven categorieën van gevallen.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel26
  - number: '27.1'
    text: |-
      Het ontmantelingsplan van de houder van een vergunning voor het oprichten, het in werking brengen of het in werking
      houden van een inrichting als bedoeld in [artikel 15, onder b, van de wet][ref1] en wijzigingen van dat plan
      behoeven goedkeuring van de Autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: '27.2'
    text: |-
      Goedkeuring wordt geweigerd indien het ontmantelingsplan niet voldoet aan de eisen die bij of krachtens dit besluit
      zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel27
  - number: '27.3'
    text: |-
      De Autoriteit beslist op de aanvraag om goedkeuring van het ontmantelingsplan binnen zes maanden na ontvangst van
      de aanvraag.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel27
  - number: '27.4'
    text: De Autoriteit kan aan de goedkeuring voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel27
  - number: '27.5'
    text: |-
      De Autoriteit kan de goedkeuring intrekken indien het ontmantelingsplan niet meer voldoet aan de eisen die daaraan
      bij of krachtens dit besluit zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel27
  - number: '28'
    text: |-
      De houder van een vergunning voor het oprichten, het in werking brengen of het in werking houden van een
      inrichting als bedoeld in [artikel 15, onder b, van de wet][ref1] handelt overeenkomstig het laatst goedgekeurde
      ontmantelingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: '29.1'
    text: |-
      Vanaf het tijdstip waarop een vergunning voor het in werking brengen van een inrichting als bedoeld in
      [artikel 15, onder b, van de wet][ref1] is verleend totdat een vergunning voor het buiten gebruik stellen van die
      inrichting is verleend, actualiseert de houder van de vergunning voor het in werking brengen of het in werking
      houden van die inrichting het ontmantelingsplan ten minste elke vijf jaar, of wanneer de Autoriteit dit nodig acht.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: '29.2'
    text: 'De actualisatie, bedoeld in het eerste lid, betreft in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel29
  - number: 29.2.a
    text: de planning van de buitengebruikstelling en de ontmanteling;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel29
  - number: 29.2.b
    text: de bij de buitengebruikstelling en de ontmanteling toe te passen technieken;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel29
  - number: 29.2.c
    text: |-
      wijzigingen van de inrichting voor zover deze gevolgen kunnen hebben voor de buitengebruikstelling of de
      ontmanteling.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel29
  - number: '30.1'
    text: |-
      De houder van een vergunning voor een inrichting als bedoeld in [artikel 15, onder b, van de wet][ref1] vangt aan
      met de buitengebruikstelling en de ontmanteling van die inrichting onmiddellijk nadat de normale bedrijfsvoering
      is beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: '30.2'
    text: |-
      De Autoriteit kan in bijzondere omstandigheden toestaan dat op een later tijdstip met de buitengebruikstelling en
      de ontmanteling van de inrichting wordt aangevangen.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel30
  - number: '30.3'
    text: |-
      De houder van een vergunning voor het buiten gebruik stellen en het ontmantelen van een inrichting als bedoeld in
      [artikel 15, onder b, van de wet][ref1] voltooit de buitengebruikstelling en de ontmanteling van die inrichting zo
      snel als redelijkerwijs mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 30a.1
    text: |-
      Bij de ontmanteling van een inrichting als bedoeld in [artikel 15, onder b, van de wet][ref1] worden de feitelijke
      beperkingen die in de weg staan aan de realisatie van elke volgende functie op het terrein waarop de inrichting was
      gevestigd, weggenomen voor zover die beperkingen het gevolg zijn van die inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 30a.2
    text: |-
      Bij een vergunning voor het buiten gebruik stellen en het ontmantelen van een inrichting als bedoeld in
      [artikel 15, onder b, van de wet][ref1] kan de Autoriteit in bijzondere omstandigheden toestaan dat wordt afgeweken
      van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 30b
    text: |-
      Onze Minister en Onze Minister van Sociale Zaken en Werkgelegenheid kunnen regels stellen met betrekking
      tot de wijze waarop de buitengebruikstelling en de ontmanteling van een inrichting als bedoeld in
      [artikel 15, onder b, van de wet][ref1] plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel30b
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 30c
    text: |-
      De Autoriteit beslist op een aanvraag tot het intrekken van een vergunning voor het ontmantelen van een inrichting
      als bedoeld in [artikel 15, onder b, van de wet][ref1] binnen zes maanden na ontvangst van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel30c
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 30d.1
    text: |-
      Bij de aanvraag tot het intrekken van een vergunning voor het ontmantelen van een inrichting als bedoeld in
      [artikel 15, onder b, van de wet][ref1] toont de houder van die vergunning ten genoegen van de Autoriteit aan dat
      de ontmanteling is voltooid. Hierbij toont hij in ieder geval aan dat aan [artikel 30a][ref2] is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002667#Artikel30a
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel30d
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002667
        artikel: 30a
        hoofdstuk: IIIa
        paragraaf: '6'
  - number: 30d.2
    text: |-
      De Autoriteit kan bij verordening regels stellen met betrekking tot de wijze waarop wordt aangetoond dat de
      ontmanteling is voltooid.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel30d
  - number: 30e
    text: |-
      De in de [artikelen 26, derde lid][ref1], [30b][ref2] en [30d, tweede lid][ref3], bedoelde regels kunnen tevens
      betrekking hebben op radioactieve afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0002667#Artikel30b
      [ref3]: https://wetten.overheid.nl/BWBR0002667#Artikel30d
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel30e
    references:
      - id: ref1
        bwb_id: BWBR0002667
        artikel: '26'
        hoofdstuk: IIIa
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0002667
        artikel: 30b
        hoofdstuk: IIIa
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0002667
        artikel: 30d
        hoofdstuk: IIIa
        paragraaf: '6'
  - number: 30f.1
    text: |-
      De houder van een vergunning voor een inrichting als bedoeld in [artikel 15, onder b, van de wet][ref1] treft tijdig
      bij een krachtens [artikel 10.6, zevende lid, van het Besluit basisveiligheidsnormen stralingsbescherming][ref2] of
      [artikel 42, derde lid, onder e][ref3], aangewezen instelling een voorziening voor de opslag van:


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002667#Artikel42
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel30f
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0040179
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0002667
        artikel: '42'
        hoofdstuk: V
        paragraaf: '1'
  - number: 30f.1.a
    text: de splijtstof of erts bevattende afvalstoffen die door het gebruik van die inrichting ontstaan,
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel30f
  - number: 30f.1.b
    text: |-
      de splijtstof of erts bevattende afvalstoffen en de radioactieve afvalstoffen die terugkomen na opwerking van de
      splijtstoffen die in die inrichting zijn gebruikt en
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel30f
  - number: 30f.1.c
    text: de radioactieve afvalstoffen die vrijkomen bij de buitengebruikstelling en de ontmanteling van die inrichting.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel30f
  - number: 30f.2
    text: De Autoriteit kan bij verordening regels stellen over de te treffen voorziening.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel30f
  - number: 30g
    text: |-
      De vergunninghouder stelt de kosten die hij in rekening brengt voor het in werking houden van een inrichting
      waarin splijtstoffen worden opgeslagen als bedoeld in [artikel 15, onder b, van de wet][ref1], die op grond van
      [artikel 42, derde lid, onderdeel e][ref2], door de Autoriteit is aangewezen, vast op een transparante, objectieve
      en niet-discriminerende wijze. Tot de kosten behoren ook kosten die de vergunninghouder maakt voor onderzoek
      en ontwikkeling voor het beheer van verbruikte splijtstoffen, zoals dit in het nationaal programma, bedoeld in
      [artikel 40a][ref3], is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002667#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0002667#Artikel40a
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel30g
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002667
        artikel: '42'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002667
        artikel: 40a
        hoofdstuk: IVa
  - number: '31.1'
    text: |-
      Aan een vergunning als bedoeld in [artikel 15 van de wet][ref1] worden zodanige voorschriften verbonden, dat: -
      schade, zoveel als redelijkerwijs mogelijk is, wordt voorkomen;
        - in gevallen, waarin blootstelling of besmetting onvermijdelijk is, schade, zoveel als redelijkerwijs mogelijk is,
      wordt beperkt;
        - in gevallen, waarin blootstelling of besmetting onvermijdelijk is, het aantal aan ioniserende straling
      blootgestelde personen, met vermijding van een ontoelaatbaar te achten blootstelling of besmetting per persoon,
      zoveel als redelijkerwijs mogelijk is, wordt beperkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: '31.2'
    text: |-
      Tot de in het eerste lid bedoelde voorschriften behoren voorschriften om te verzekeren dat de gebruikte installatie
      en alles wat daartoe behoort in goede staat van onderhoud verkeert.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel31
  - number: '32'
    text: |-
      De houder van een vergunning voor een inrichting als bedoeld in [artikel 15, onder b, van de wet][ref1],
      is verplicht de lozingen van radioactief materiaal te controleren en deze te rapporteren aan de Autoriteit
      overeenkomstig bij verordening van de Autoriteit gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: '33'
    text: |-
      Ter voorkoming van schade of ter beperking van de kans op schade buiten de inrichting kunnen aan een vergunning
      als bedoeld in [artikel 15, onder b][ref1], van de wet ook andere voorschriften worden verbonden dan bedoeld in
      [artikel 31, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002667#Artikel31
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002667
        artikel: '31'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '35.1'
    text: |-
      Aan een vergunning als bedoeld in [artikel 15 van de wet][ref1] worden voorschriften met het oog op de veiligheid
      van de staat verbonden, indien de vergunning uitsluitend of mede betrekking heeft op het doen van verrichtingen:


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 35.1.a
    text: |-
      met gebruikmaking van gegevens, hulpmiddelen of materialen dan wel van een inrichting of een uitrusting, ten
      aanzien waarvan naar het oordeel van de Autoriteit het belang van de veiligheid van de staat het opleggen van een
      verplichting tot geheimhouding of een beperking ten aanzien van het gebruik vereist, of
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel35
  - number: 35.1.b
    text: |-
      waarbij onderzoekingen worden verricht of werkmethoden worden toegepast, ten aanzien waarvan naar het oordeel
      van de Autoriteit het belang van de veiligheid van de staat het opleggen van een verplichting tot geheimhouding
      vereist, of
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel35
  - number: 35.1.c
    text: welke blijkens een verklaring van de Autoriteit van vitaal belang zijn voor de militaire of civiele verdediging.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel35
  - number: '35.2'
    text: 'Voorschriften als in het eerste lid bedoeld kunnen de verplichting inhouden:'
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel35
  - number: 35.2.a
    text: |-
      ten aanzien van gegevens, hulpmiddelen, materialen, een inrichting of een uitrusting dan wel onderzoekingen of
      werkmethoden als in het eerste lid bedoeld de geheimhouding te verzekeren;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel35
  - number: 35.2.b
    text: |-
      gegevens, hulpmiddelen of materialen dan wel een inrichting of uitrusting als in het eerste lid bedoeld met
      inachtneming van in het voorschrift aangegeven beperkingen te gebruiken;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel35
  - number: 35.2.c
    text: |-
      terreinen, gebouwen en ruimten, waar verrichtingen als in het eerste lid bedoeld plaatsvinden dan wel gegevens,
      hulpmiddelen of materialen, met gebruikmaking waarvan zodanige verrichtingen plaatsvinden, worden bewaard, op een
      bij het voorschrift bepaalde wijze te beveiligen;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel35
  - number: 35.2.d
    text: |-
      het gebruik van gegevens, hulpmiddelen of materialen dan wel van een inrichting of uitrusting als in het eerste lid
      bedoeld, alsmede het aanwenden van uit zodanig gebruik voortvloeiende kennis op een bij het voorschrift bepaalde
      wijze te regelen;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel35
  - number: 35.2.e
    text: |-
      de Autoriteit of in het voorschrift aangewezen Nederlandse controle-organen tijdig in kennis te stellen van een
      voorgenomen vervanging van de met de leiding van de onderneming of instelling, waaraan de vergunning is verleend,
      belaste persoon of personen;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel35
  - number: 35.2.f
    text: |-
      alle of bepaalde verrichtingen uitsluitend te laten plaatsvinden door personen, ten aanzien van wie de Autoriteit
      heeft verklaard, dat naar zijn oordeel voldoende waarborgen aanwezig kunnen worden geacht, dat zij de verplichting
      met betrekking tot de geheimhouding naar behoren zullen vervullen;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel35
  - number: 35.2.g
    text: |-
      bij het voorschrift aangewezen organen, waaraan een taak is opgedragen terzake van de uitvoering van de wet, in het
      voorschrift omschreven inlichtingen te doen toekomen betreffende gegevens, hulpmiddelen of materialen, dan wel een
      inrichting of uitrusting als in het eerste lid bedoeld, alsmede een op het verstrekken van zodanige inlichtingen
      gerichte administratie te voeren, aan de hand waarvan de juistheid van de verstrekte inlichtingen op eenvoudige
      wijze kan worden aangetoond;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel35
  - number: 35.2.h
    text: |-
      de Autoriteit of bij het voorschrift aangewezen Nederlandse controle-organen onverwijld in te lichten, indien
      ernstige inbreuken op de naleving van de met het oog op de veiligheid van de staat gegeven voorschriften dan wel
      spionage worden vermoed of ontdekt;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel35
  - number: 35.2.i
    text: |-
      een aan de onderneming of instelling verbonden functionaris aan te wijzen, speciaal belast met het treffen
      van maatregelen ter uitvoering van de met het oog op de veiligheid van de staat aan de vergunning verbonden
      voorschriften, alsmede met het toezicht op de naleving van die maatregelen.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel35
  - number: '36.1'
    text: |-
      Aan een vergunning als bedoeld in [artikel 15 van de wet][ref1] worden voorschriften met het oog op de bewaring
      van splijtstoffen en ertsen verbonden, indien en voor zover zulks nodig is voor de bescherming van de in
      [artikel 15b, eerste lid, onder a, b of e, van de wet][ref2], bedoelde belangen.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel15b
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: 15b
  - number: '36.2'
    text: 'Voorschriften als bedoeld in het eerste lid kunnen de verplichting inhouden:'
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel36
  - number: 36.2.a
    text: |-
      splijtstoffen of ertsen te bewaren op een zodanige bij het voorschrift aan te geven plaats en wijze, dat er geen
      schade kan optreden;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel36
  - number: 36.2.b
    text: |-
      splijtstoffen of ertsen zodanig te bewaren, dat zij zo veel mogelijk zijn beveiligd tegen brand of het op andere
      wijze verloren gaan;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel36
  - number: 36.2.c
    text: |-
      een of meer aan de onderneming of instelling verbonden functionarissen aan te wijzen, speciaal belast met het
      treffen van maatregelen ter uitvoering van de met het oog op de bewaring aan de vergunning verbonden voorschriften,
      alsmede met het toezicht op de naleving van die maatregelen.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel36
  - number: '39'
    text: |-
      Aan een vergunning als bedoeld in [artikel 15, onder b of c, van de wet][ref1], welke uitsluitend of mede
      betrekking heeft op een inrichting of uitrusting, waarop de [Wet aansprakelijkheid kernongevallen][ref2] dan wel
      de wet van 24 oktober 1973, houdende regelen inzake wettelijke aansprakelijkheid van exploitanten van nucleaire
      schepen (*Stb.* 536), van toepassing is, wordt met het oog op het zeker stellen van de betaling van de vergoeding,
      aan derden toekomend voor schade, hun toegebracht, het voorschrift verbonden tot het hebben en in stand houden
      van een zodanige verzekering of andere financiële zekerheid als waartoe de houder van de vergunning ingevolge die
      wettelijke regeling gehouden is.


      [ref1]: https://wetten.overheid.nl/BWBR0003418#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003234
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003418
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0003234
  - number: '40.1'
    text: |-
      Aan een vergunning als bedoeld in [artikel 15 van de wet][ref1] worden voorschriften met het oog op de nakoming
      van internationale verplichtingen verbonden, indien die vergunning uitsluitend of mede strekt tot het doen van
      verrichtingen met gebruikmaking van gegevens, hulpmiddelen of materialen dan wel van een inrichting of uitrusting
      ten aanzien waarvan internationale overeenkomsten of besluiten van volkenrechtelijke organisaties, welke voor
      Nederland verbindend zijn en geheel of gedeeltelijk betrekking hebben op het gebied van de kernenergie of van de
      ioniserende straling, de staat verplichtingen opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: '40.2'
    text: 'Voorschriften als in het eerste lid bedoeld kunnen de verplichting inhouden:'
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel40
  - number: 40.2.a
    text: |-
      ten aanzien van gegevens, hulpmiddelen of materialen dan wel een inrichting of uitrusting als in het eerste lid
      bedoeld de geheimhouding te verzekeren of deze met inachtneming van in het voorschrift aangegeven beperkingen te
      gebruiken;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel40
  - number: 40.2.b
    text: |-
      aan bij het voorschrift aangewezen organen, waaraan een taak is opgedragen ter zake van de uitvoering van de in
      het eerste lid bedoelde overeenkomsten of besluiten, in het voorschrift omschreven inlichtingen te doen toekomen
      betreffende gegevens, hulpmiddelen of materialen dan wel een inrichting of uitrusting als in het eerste lid
      bedoeld, alsmede een op het verstrekken van zodanige inlichtingen gerichte administratie te voeren, aan de hand
      waarvan de juistheid van de verstrekte inlichtingen op eenvoudige wijze kan worden aangetoond.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel40
  - number: 40a.1
    text: |-
      Onze Minister stelt een programma als bedoeld in artikel 5, eerste lid, onderdeel a, van richtlijn 2011/70/Euratom,
      vast voor het beheer van verbruikte splijtstoffen.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel40a
  - number: 40a.2
    text: 'Het programma bevat een uitwerking van de volgende uitgangspunten:'
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel40a
  - number: 40a.2.a
    text: |-
      de beperking van het ontstaan van verbruikte splijtstoffen tot het praktisch haalbare minimum, zowel wat de
      activiteit als het volume betreft;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel40a
  - number: 40a.2.b
    text: de onderlinge afhankelijkheden van alle stappen in het ontstaan en het beheer van verbruikte splijtstoffen;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel40a
  - number: 40a.2.c
    text: het veilig beheer van verbruikte splijtstoffen;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel40a
  - number: 40a.2.d
    text: voor de lange termijn passieve veiligheidsmaatregelen;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel40a
  - number: 40a.2.e
    text: een graduele aanpak bij de uitvoering van de maatregelen;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel40a
  - number: 40a.2.f
    text: |-
      de kosten voor het beheer van verbruikte splijtstoffen komen ten laste van degene die deze afvalstoffen hebben
      laten ontstaan;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel40a
  - number: 40a.2.g
    text: |-
      een empirisch onderbouwd en gedocumenteerd besluitvormingsproces in alle stadia van het beheer van verbruikte
      splijtstoffen.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel40a
  - number: 40a.3
    text: 'Het programma bevat tevens:'
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel40a
  - number: 40a.3.a
    text: de beleidsdoelstelling ten aanzien van het beheer van alle typen verbruikte splijtstoffen;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel40a
  - number: 40a.3.b
    text: |-
      de mijlpalen die voor de uitvoering van het programma nodig zijn en het tijdpad voor het bereiken van deze
      mijlpalen;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel40a
  - number: 40a.3.c
    text: een inventarisatie van alle verbruikte splijtstoffen en ramingen van toekomstige hoeveelheden;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel40a
  - number: 40a.3.d
    text: |-
      concepten, plannen en technische oplossingen voor het beheer van verbruikte splijtstoffen, van ontstaan tot
      eindberging;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel40a
  - number: 40a.3.e
    text: concepten of plannen voor de periode na de sluiting van een inrichting voor eindberging;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel40a
  - number: 40a.3.f
    text: |-
      onderzoeks-, ontwikkelings- en demonstratieactiviteiten die nodig zijn om oplossingen voor het beheer van
      verbruikte splijtstoffen toe te passen;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel40a
  - number: 40a.3.g
    text: |-
      de verantwoordelijkheid voor de uitvoering van het programma en de essentiële prestatie-indicatoren voor toezicht
      op de voortgang van de uitvoering van het programma;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel40a
  - number: 40a.3.h
    text: |-
      een beoordeling van de kosten van het nationale programma en de onderliggende basis en hypothesen voor deze
      beoordeling, met inbegrip van een tijdsprofiel;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel40a
  - number: 40a.3.i
    text: de financieringsregelingen ter uitvoering van het programma;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel40a
  - number: 40a.3.j
    text: |-
      het beleid ten aanzien van het verstrekken van informatie met betrekking tot het beheer van verbruikte
      splijtstoffen aan werknemers en het publiek;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel40a
  - number: 40a.3.k
    text: |-
      een overzicht van met andere lidstaten en derde landen gesloten overeenkomsten over het beheer van verbruikte
      splijtstoffen.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel40a
  - number: '41.1'
    text: |-
      Het in [artikel 15, onder a, van de wet][ref1] vervatte verbod geldt niet voor het voorhanden hebben van
      splijtstoffen of ertsen, indien binnen een locatie:


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 41.1.a
    text: |-
      de activiteit van de radionucliden in de betrokken splijtstof of erts lager is dan de bij of krachtens
      [artikel 3.17 van het Besluit basisveiligheidsnormen stralingsbescherming][ref1] vastgestelde vrijstellingswaarde;
      of


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel3
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0040179
        artikel: '3'
  - number: 41.1.b
    text: |-
      de activiteitsconcentratie van die stof of dat erts lager is dan de bij of krachtens
      [artikel 3.17 van het Besluit basisveiligheidsnormen stralingsbescherming][ref1] vastgestelde vrijstellingswaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel3
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0040179
        artikel: '3'
  - number: '41.2'
    text: 'Het eerste lid is niet van toepassing, indien:'
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel41
  - number: 41.2.a
    text: |-
      splijtstoffen of ertsen worden toegediend aan personen en, voorzover het de bescherming van mensen tegen
      ioniserende straling betreft, aan dieren voor:
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel41
  - number: 41.2.a.1°
    text: het stellen van medische of veterinaire diagnoses;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel41
  - number: 41.2.a.2°
    text: therapie of (bio)medisch onderzoek;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel41
  - number: 41.2.a.3°
    text: het toevoegen van splijtstoffen of ertsen aan consumentenproducten.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel41
  - number: '41.3'
    text: |-
      Het bij of krachtens
      [artikel 3.17, tweede, derde en zesde lid, van het Besluit basisveiligheidsnormen stralingsbescherming][ref1]
      bepaalde is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel3
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0040179
        artikel: '3'
  - number: '41.4'
    text: |-
      Bij regeling van Onze Minister kan worden bepaald dat het eerste lid niet van toepassing is in daarbij aangewezen
      categorieën van gevallen, waarin sprake is van een te hoog risico van blootstelling van werknemers of leden van
      de bevolking.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel41
  - number: '41.5'
    text: |-
      Het in [artikel 15, onder a, van de wet][ref1] vervatte verbod geldt niet voor het voorhanden hebben van
      splijtstoffen of ertsen voor bij regeling van Onze Minister aangewezen handelingen die een beperkt risico van
      blootstelling van mensen tot gevolg hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: '41.6'
    text: |-
      In de gevallen, bedoeld in het vijfde lid, is een registratieplicht van toepassing.
      [Artikel 3.9 van het Besluit basisveiligheidsnormen stralingsbescherming][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel3
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0040179
        artikel: '3'
  - number: 41a
    text: |-
      Het in [artikel 15, onder a, van de wet][ref1] vervatte verbod geldt niet voor
      handelingen met apparaten die een ingekapselde bron bevatten waarbij de bij of krachtens
      [artikel 3.17 van het Besluit basisveiligheidsnormen stralingsbescherming][ref2] vastgestelde waarde voor de
      activiteit en de activiteitsconcentratie wordt overschreden, op voorwaarde dat:


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Artikel3
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0040179
        artikel: '3'
  - number: 41a.1°
    text: het apparaat behoort tot een bij verordening of beschikking van de Autoriteit goedgekeurd type;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel41a
  - number: 41a.2°
    text: |-
      het apparaat onder normale bedrijfsomstandigheden op 0,1 m van enige bereikbare buitenzijde daarvan geen hoger
      omgevingsdosisequivalenttempo veroorzaakt dan 1 microsievert per uur, en
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel41a
  - number: 41a.3°
    text: de Autoriteit voorwaarden voor recycling of verwijdering heeft vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel41a
  - number: '42.1'
    text: |-
      Het in [artikel 15, onder a, van de wet][ref1] vervatte verbod geldt niet voor het zich ontdoen van
      splijtstoffen of ertsen voor product- of materiaalhergebruik of van splijtstoffen of ertsen bevattende
      afvalstoffen, indien: de activiteitsconcentratie van de radionucliden in de betrokken splijtstoffen of
      ertsen lager is dan de desbetreffende bij of krachtens [artikel 3.20][ref2] of [3.21][ref3], in samenhang met
      [artikel 3.22, van het Besluit basisveiligheidsnormen stralingsbescherming][ref4] vastgestelde vrijgavewaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0040179#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0040179#Artikel3
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0040179
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0040179
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0040179
        artikel: '3'
  - number: '42.2'
    text: |-
      Het bepaalde bij of krachtens
      [artikel 3.17, tweede en zesde lid, van het Besluit basisveiligheidsnormen stralingsbescherming][ref1] en
      [artikel 41, vierde lid][ref2], van dit besluit is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002667#Artikel41
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0040179
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002667
        artikel: '41'
        hoofdstuk: V
        paragraaf: '1'
  - number: '42.3'
    text: |-
      Het in [artikel 15, onder a, van de wet][ref1] vervatte verbod geldt niet voor het zich ontdoen van splijtstoffen
      of ertsen voor product- of materiaalhergebruik of van splijtstoffen of ertsen bevattende afvalstoffen, indien het
      betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 42.3.a
    text: ingekapselde bronnen die worden teruggenomen door degene die de bron heeft vervaardigd of geleverd;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel42
  - number: 42.3.b
    text: 'een feitelijke levering van splijtstoffen of ertsen door enkele overgave aan een derde met het oog op:'
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel42
  - number: 42.3.b.1°
    text: gebruik, product- of materiaalhergebruik van splijtstoffen of ertsen,
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel42
  - number: 42.3.b.2°
    text: inzameling van splijtstoffen of ertsen bevattende afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel42
  - number: 42.3.c
    text: |-
      een afgifte aan een krachtens [artikel 22, vierde lid, van de wet][ref1] aangewezen instelling voor ontvangst van
      in bezit genomen splijtstoffen of ertsen;


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel22
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '22'
  - number: 42.3.d
    text: |-
      het zich ontdoen van splijtstoffen of ertsen bevattende afvalstoffen door afgifte aan een door de Autoriteit
      erkende ophaaldienst van splijtstoffen of ertsen bevattende afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel42
  - number: 42.3.e
    text: |-
      een afgifte aan een door de Autoriteit aangewezen instelling voor de ontvangst van splijtstoffen of ertsen
      bevattende afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel42
  - number: '42.4'
    text: |-
      Het derde lid geldt alleen indien de ondernemer zich ervan heeft vergewist dat de ontvanger in het bezit is van een
      vergunning voor de desbetreffende handeling of anderszins gerechtigd is de stoffen te ontvangen.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel42
  - number: '42.5'
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op de aanvraag om een erkenning
      van een ophaaldienst of een aanwijzing van een instelling voor de ontvangst van splijtstoffen of ertsen bevattende
      afvalstoffen als bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '43.1'
    text: |-
      Het in [artikel 15, onder a, van de wet][ref1] vervatte verbod geldt niet voor het zich ontdoen van splijtstoffen
      of ertsen door middel van lozing in de lucht, in het openbare riool of in het oppervlaktewater, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 43.1.a
    text: |-
      bij lozing in de lucht, de activiteit van de in totaal in een kalenderjaar geloosde hoeveelheid splijtstoffen
      of ertsen bij het verlaten van de locatie via een lozingspunt lager is dan 1 radiotoxiciteitsequivalent voor
      inhalatie, als bedoeld in [bijlage 2 bij het Besluit basisveiligheidsnormen stralingsbescherming][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0040179
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0040179
  - number: 43.1.b
    text: |-
      bij lozing in het openbare riool, de activiteit van de in totaal in een kalenderjaar
      geloosde hoeveelheid splijtstoffen of ertsen bij het verlaten van de locatie via een
      lozingspunt lager is dan 10 radiotoxiciteitsequivalenten voor ingestie, als bedoeld in
      [bijlage 2 bij het Besluit basisveiligheidsnormen stralingsbescherming][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0040179
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0040179
  - number: 43.1.c
    text: |-
      bij lozing in het oppervlaktewater, de activiteit van de in totaal in een kalenderjaar
      geloosde hoeveelheid splijtstoffen of ertsen bij het verlaten van de locatie via een
      lozingspunt lager is dan 0,1 radiotoxiciteitsequivalent voor ingestie, als bedoeld in
      [bijlage 2 bij het Besluit basisveiligheidsnormen stralingsbescherming][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040179
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0040179
  - number: '43.2'
    text: |-
      De geloosde hoeveelheden, uitgedrukt in radiotoxiciteitsequivalenten, worden
      gecorrigeerd voor fysisch verval door middel van de correctiefactoren zoals aangegeven in
      [bijlage 2 bij het Besluit basisveiligheidsnormen stralingsbescherming][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040179
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0040179
  - number: '44'
    text: |-
      Het in [artikel 15, onder b][ref1], van de wet vervatte verbod geldt niet voor het oprichten, in werking brengen,
      in werking houden of wijzigen van een inrichting, waarin splijtstoffen kunnen worden vervaardigd, bewerkt of
      verwerkt, dan wel splijtstoffen worden opgeslagen, in het geval, dat die inrichting niet is bestemd en niet wordt
      gebruikt voor een met de splijtstoffenkringloop verband houdend vervaardigingsproces of voor het voorhanden hebben
      van andere dan onbestraalde splijtstoffen en:


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002667
        artikel: '15'
        hoofdstuk: III
        paragraaf: '1'
  - number: 44.a
    text: de voorhanden splijtstoffen geen plutonium of verrijkt uranium bevatten, dan wel
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel44
  - number: 44.b
    text: |-
      de grootste hoeveelheid splijtstoffen, die te eniger tijd in de inrichting voorhanden wordt gehouden, niet meer
      bevat dan 375 gram plutonium-239, plutonium-241 of uranium-233, dan wel niet meer dan 600 gram uranium-235, met
      dien verstande, dat bij aanwezigheid van meer dan een van deze nucliden de som van de breuken, verkregen door
      het aantal grammen van ieder dier nucliden te delen door de voor dat nuclide hiervoor vastgestelde maximale
      hoeveelheid, niet groter mag zijn dan 1.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel44
  - number: 44a.1
    text: |-
      Een aanvraag om goedkeuring voor de wijze waarop financiële zekerheid wordt gesteld als bedoeld in
      [artikel 15f, eerste lid, van de wet][ref1] wordt ingediend bij Onze Minister met gelijktijdige toezending van een
      afschrift aan Onze Minister van Financiën.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15f
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: 15f
  - number: 44a.2
    text: 'Een aanvraag om goedkeuring als bedoeld in het eerste lid bevat in elk geval de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel44a
  - number: 44a.2.a
    text: |-
      een overzicht van de verschillende kostenposten voor de buitengebruikstelling en de ontmanteling van de betrokken
      inrichting, bedoeld in [artikel 15, onder b, van de wet][ref1], waarbij wordt uitgegaan van het laatst door de
      Autoriteit goedgekeurde ontmantelingsplan en de voorschriften die op grond van [artikel 27, vierde lid][ref2], aan
      de goedkeuring van het ontmantelingsplan zijn verbonden;


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002667#Artikel27
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002667
        artikel: '27'
        hoofdstuk: IIIa
        paragraaf: '6'
  - number: 44a.2.b
    text: |-
      een berekening van de kosten behorende bij de onder a bedoelde kostenposten, bepaald aan de hand van een algemeen
      aanvaarde methode en op basis van het prijspeil op het moment van de indiening van de aanvraag;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel44a
  - number: 44a.2.c
    text: |-
      een omrekening van de overeenkomstig onderdeel b bepaalde kosten naar de kosten op het moment van de
      buitengebruikstelling en de ontmanteling, bepaald aan de hand van een algemeen aanvaarde indexeringsmethode;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel44a
  - number: 44a.2.d
    text: |-
      een overzicht waaruit blijkt dat het bedrag van de berekening van de kosten op het moment van de
      buitengebruikstelling en de ontmanteling is gedekt door financiële zekerheid.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel44a
  - number: 44a.3
    text: Onze Minister kan nadere regels stellen met betrekking tot de aanvraag om goedkeuring.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel44a
  - number: 44b.1
    text: |-
      De houder van een vergunning voor het in werking brengen of het in werking houden van een inrichting als bedoeld
      in [artikel 15, onder b, van de wet][ref1] actualiseert de wijze waarop financiële zekerheid is gesteld nadat
      het ontmantelingsplan of een wijziging daarvan door de Autoriteit is goedgekeurd of wanneer Onze Minister of Onze
      Minister van Financiën dit nodig acht.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel44b
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 44b.2
    text: |-
      De vergunninghouder, bedoeld in het eerste lid, dient binnen zes maanden na goedkeuring van het ontmantelingsplan
      onderscheidenlijk binnen zes maanden nadat Onze Minister of Onze Minister van Financiën kenbaar heeft gemaakt
      actualisatie van de wijze waarop financiële zekerheid is gesteld, nodig te achten, een aanvraag om goedkeuring van
      de geactualiseerde financiële zekerheid in.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel44b
  - number: 44c.1
    text: |-
      Gelijktijdig met de aanvraag om een vergunning voor het buiten gebruik stellen en het ontmantelen van een
      inrichting als bedoeld in [artikel 15, onder b, van de wet][ref1] wordt een aanvraag ingediend om goedkeuring voor
      de wijze waarop financiële zekerheid wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel44c
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 44c.2
    text: |-
      Indien het eerste lid van toepassing is, wordt in afwijking van [artikel 44a, tweede lid, onder a][ref1], bij het
      overzicht van de verschillende kostenposten voor de buitengebruikstelling en de ontmanteling uitgegaan van het
      ontmantelingsplan zoals dat is ingediend bij de aanvraag om een vergunning voor het buiten gebruik stellen en het
      ontmantelen van de inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel44a
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel44c
    references:
      - id: ref1
        bwb_id: BWBR0002667
        artikel: 44a
        hoofdstuk: Va
  - number: 44d.1
    text: |-
      De houder van een vergunning voor het buiten gebruik stellen en het ontmantelen van een inrichting als bedoeld in
      [artikel 15, onder b, van de wet][ref1] actualiseert de wijze waarop financiële zekerheid is gesteld na wijziging
      van die vergunning, voor zover die wijziging betrekking heeft op het ontmantelingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel44d
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 44d.2
    text: |-
      De vergunninghouder, bedoeld in het eerste lid, dient binnen zes maanden na wijziging van de vergunning een
      aanvraag om goedkeuring van de geactualiseerde financiële zekerheid in.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel44d
  - number: 44e.1
    text: |-
      Aangewezen overeenkomstig [artikel 15f, achtste lid, van de wet][ref1], wordt de nucleaire inrichting van URENCO
      Nederland B.V. te Almelo.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15f
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel44e
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: 15f
  - number: 44e.2
    text: Dit hoofdstuk is van overeenkomstige toepassing op de inrichting, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel44e
  - number: '45.1'
    text: 'Dit besluit kan worden aangehaald als: Besluit kerninstallaties, splijtstoffen en ertsen.'
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel45
  - number: '45.2'
    text: Het treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel45
