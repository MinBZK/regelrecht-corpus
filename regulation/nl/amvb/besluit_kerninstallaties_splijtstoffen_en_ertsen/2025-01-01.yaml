articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *beheer van verbruikte splijtstoffen:*
      alle activiteiten die te maken hebben met het hanteren, de voorbehandeling, de behandeling, het conditioneren, de
      opslag, de opwerking of de eindberging van verbruikte splijtstoffen, met uitzondering van het vervoer buiten het
      terrein van de faciliteit;
        - *bron:* splijtstof of erts;
        - *buiten-ontwerpongeval:* ongeval waarvan de kans dat het zich voordoet geringer is dan elk van de gepostuleerde
      begin-gebeurtenissen en waarbij niet is uit te sluiten dat door het vrijkomen van splijtstoffen of radioactieve
      stoffen de bij [artikel 18][ref1] vastgestelde limietwaarden voor de gepostuleerde begin-gebeurtenissen worden
      overschreden;
        - *categorie I-, II- of III-materiaal:* met het oog op beveiliging op grond van
      [artikel 22, zevende of achtste lid][ref2], als categorie I-, II- of III- materiaal aangewezen splijtstoffen of
      ertsen als genoemd in [bijlage 1][ref3];
        - *compenserende maatregelen:* maatregelen van tijdelijke aard die het niet-beschikbaar zijn van structurele
      maatregelen volledig compenseren;
        - *gehalte:* massagehalte van de elementen uranium, thorium en plutonium in splijtstoffen;
        - *gepostuleerde begin-gebeurtenissen:* redelijkerwijs mogelijk te achten voorvallen die bij juist functioneren
      van de daartoe speciaal ontworpen veiligheidssystemen tot voorzienbare bedrijfsgevolgen of ongevalsomstandigheden
      leiden die een besmetting of een blootstelling van de omgeving kunnen veroorzaken;
        - *gevaarlijke stof:* gevaarlijke stof als bedoeld in artikel 3, tiende lid, van de Seveso-richtlijn;
        - *handeling:* handeling als genoemd in [artikel 15 van de wet][ref4], niet zijnde het vervoeren van, het
      voorhanden hebben bij opslag in verband met vervoer, of het binnen of buiten Nederlands grondgebied brengen of
      doen brengen van splijtstoffen of ertsen, uitgezonderd bij een interventie, een ongeval of een radiologische
      noodsituatie;
        - *hoogactieve bron:* hoogactieve bron als bedoeld in [artikel 1.2][ref5] in samenhang met
      [bijlage 1 van het Besluit basisveiligheidsnormen stralingsbescherming][ref6];
        - *ingekapselde bron:* splijtstoffen of ertsen welke permanent in een omhulsel zijn ingekapseld, dan wel gebonden
      zijn in vaste vorm teneinde onder normale gebruiksomstandigheden iedere verspreiding van splijtstoffen of ertsen
      te voorkomen;
        - *lid van de bevolking:* een persoon uit de bevolking binnen of buiten een locatie, niet zijnde een werknemer
      gedurende zijn werktijd of een persoon die een medische blootstelling ondergaat;
        - *locatie:* inrichting of uitrusting als bedoeld in [artikel 15, onder b of c, van de wet][ref7], locatie waarop
      een milieubelastende activiteit die is aangewezen in [hoofdstuk 3 van het Besluit activiteiten leefomgeving][ref8]
      wordt verricht of plaats waar een handeling wordt verricht;
        - *natuurlijk uranium:* door een chemisch scheidingsproces verkregen uranium waarin de uraniumisotopen zich in de
      natuurlijke verhouding bevinden;
        - *nucleaire drukapparatuur:* speciaal voor nucleair gebruik in inrichtingen als bedoeld in
      [artikel 15, onder b, van de wet][ref9] ontworpen drukapparatuur die bij defecten de verspreiding van
      radioactiviteit kan veroorzaken, met uitzondering van splijtstofstaven en opslag- en transportverpakkingen;
        - *Nuclear Security Recommendations on Physical Protection of Nuclear Material and Nuclear Facilities:* Nuclear
      Security Recommendations on Physical Protection of Nuclear Material and Nuclear Facilities (INFCIRC/225/
      revision 5, Nuclear Security Series-13, [http://www.pub.iaea.org/MTCD/publications/PDF/Pub1481_web.pdf](http://
      www.pub.iaea.org/MTCD/publications/PDF/Pub1481_web.pdf)), International Atomic Energy Agency, Vienna, 2011, of een
      bij verordening van de Autoriteit aangewezen revisie daarvan, met de ingangsdatum;
        - *ondernemer:* natuurlijke persoon, rechtspersoon of bestuursorgaan onder wiens verantwoordelijkheid een handeling
      wordt verricht of maatregel wordt uitgevoerd;
        - *ontmantelingsplan:* plan met een beschrijving van de wijze waarop een inrichting als bedoeld in
      [artikel 15, onder b, van de wet][ref10] buiten gebruik wordt gesteld en ontmanteld;
        - *Onze Minister:* Onze Minister van Infrastructuur en Milieu;
        - *referentiedreiging:* langetermijnanalyse van dreigingen van diefstal of sabotage van de in
      [bijlage 1][ref11] genoemde splijtstoffen of ertsen, of sabotage van inrichtingen als bedoeld in
      [artikel 15, onder b, van de wet][ref12], met inbegrip van de op die splijtstoffen of ertsen dan wel inrichtingen
      betrekking hebbende informatie en processen;
        - *schade:* nadelige gevolgen van ioniserende straling voor mensen, dieren, planten en goederen;
        - *Seveso-richtlijn:* Richtlijn 2012/18/EU van het Europees Parlement en de Raad van 4 juli 2012 betreffende de
      beheersing van de gevaren van zware ongevallen waarbij gevaarlijke stoffen zijn betrokken, houdende wijziging en
      vervolgens intrekking van Richtlijn 96/82/EG van de Raad (PbEU 2012, L 197);
        - *splijtstof of erts bevattende afvalstof:* splijtstof die, of erts
      dat krachtens [artikel 19 van dit besluit][ref13] in samenhang met
      [artikel 10.7, eerste en tweede lid, van het Besluit basisveiligheidsnormen stralingsbescherming][ref14] als
      zodanig is aangemerkt en niet wordt geloosd;
        - *verbruikte splijtstof:* kernsplijtstof die bestraald is en permanent uit een reactorkern is verwijderd;
        - *verrijkingsgraad:* massagehalte van uranium-235 en uranium-233 tezamen in verrijkt uranium;
        - *verrijkt uranium:* uranium met een hoger massapercentage uranium-235 dan in natuurlijk uranium;
        - *wet:* [Kernenergiewet][ref15].


