      voor een lid van de bevolking dat zich buiten de locatie bevindt, als gevolg van de handeling waarvoor de
      vergunning is aangevraagd en ten gevolge van andere handelingen binnen en buiten deze locatie, een van de volgende
      doses wordt overschreden of kan worden overschreden:
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel18
  - number: 18.1.b.1
    text: 'een effectieve dosis van 1 mSv in een kalenderjaar, en met inachtneming daarvan:'
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel18
  - number: 18.1.b.2
    text: een equivalente dosis van 50 mSv in een kalenderjaar voor de huid gemiddeld over enig huidoppervlak van 1 cm2;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel18
  - number: 18.1.c
    text: |-
      de handeling waarvoor de vergunning is aangevraagd behoort tot een categorie
      of soort, die in de krachtens [artikel 19][ref1] in samenhang met de krachtens
      [artikel 2.3 van het Besluit basisveiligheidsnormen stralingsbescherming][ref2] vastgestelde regeling is
      gerechtvaardigd, maar het specifieke karakter van deze handeling op grond van het eerste of tweede lid van dat
      artikel niet gerechtvaardigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Artikel2
