        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0002667
        artikel: '6'
        hoofdstuk: II
        paragraaf: '3'
  - number: 10.2.b
    text: |-
      als bedoeld in [artikel 9][ref1]: een beschrijving van maatregelen als bedoeld in
      [artikel 9, eerste lid, onder e][ref2], en een risicoanalyse als bedoeld in [artikel 9, eerste lid, onder f][ref3],
      met dien verstande dat het veiligheidsrapport, de beschrijving van maatregelen en de risicoanalyses betrekking
      hebben op de buitengebruikstelling of de ontmanteling.


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002667#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002667#Artikel9
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002667
        artikel: '9'
