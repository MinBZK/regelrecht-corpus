  - number: '1.2'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt onder «activiteit», «blootstelling», «deskundige»,
      «effectieve dosis» «eindberging», «equivalente dosis», «gezondheidsschade», «omgevingsdosisequivalent»,
      «radiotoxiciteitsequivalent», »richtlijn 2011/77/Euratom» en «wet» verstaan hetgeen daaronder wordt verstaan in
      [artikel 1.2][ref1] in samenhang met [bijlage 1 van het Besluit basisveiligheidsnormen stralingsbescherming][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0040179
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0040179
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0040179
  - number: '1.3'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt onder «besmetting», «lozing in de lucht», «lozing
      in het openbare riool» en «lozing in het oppervlaktewater» verstaan hetgeen daaronder wordt verstaan in
      [artikel 1.2][ref1] in samenhang met [bijlage 1 van het Besluit basisveiligheidsnormen stralingsbescherming][ref2],
      met dien verstande dat in plaats van «radioactieve stoffen» telkens «splijtstoffen of ertsen» wordt gelezen.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0040179
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0040179
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0040179
  - number: '1.5'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt onder «voorhanden hebben» mede verstaan: in bezit hebben,
      beheren, bewaren of anderszins feitelijk onder zich hebben, of het vervaardigen, bewerken, hanteren en opslaan, met
      uitzondering van het voorhanden hebben bij de opslag in verband met vervoer.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel1
  - number: '1.6'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt onder drukvaten, installatieleidingen,
      veiligheidsappendages en onder druk staande appendages verstaan hetgeen daaronder wordt verstaan in het
      [Warenwetbesluit drukapparatuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010586
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010586
  - number: 1a
    text: |-
      Het in [artikel 1, eerste lid, onder b, van de wet][ref1] bedoelde percentage van in splijtstoffen aanwezig
      uranium, plutonium of thorium is onderscheidenlijk een tiende, een tiende en drie, gerekend naar het gewicht.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel1
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '1'
  - number: '2'
    text: |-
      Dit besluit is niet van toepassing op het vervoeren, het voorhanden hebben bij opslag in verband met het vervoer en
      het binnen of buiten Nederlands grondgebied brengen of doen brengen van splijtstoffen of ertsen.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel2
  - number: '3.1'
    text: |-
      De aanvraag om een vergunning voor handelingen binnen een inrichting als bedoeld in
      [artikel 15, onder b, van de wet][ref1], of op een locatie waarop een milieubelastende activiteit die is aangewezen
      in [hoofdstuk 3 van het Besluit activiteiten leefomgeving][ref2] wordt verricht, wordt ingediend door degene die de
      inrichting drijft of de milieubelastende activiteit verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0041330#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0041330
        hoofdstuk: '3'
  - number: '3.2'
    text: |-
      Een aanvraag als bedoeld in het eerste lid betreft niet de handelingen die worden verricht door een persoon die in
      het bezit is van een vergunning voor het op steeds wisselende plaatsen verrichten van zodanige handelingen.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel3
  - number: '3.3'
    text: 'De aanvraag bevat:'
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel3
  - number: 3.3.a
    text: naam en adres van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel3
  - number: 3.3.b
    text: |-
      een feitelijke omschrijving van hetgeen de aanvrager met de betrokken splijtstoffen of ertsen wenst te doen
      onderscheidenlijk een aanduiding van de betrokken inrichting, uitrusting of locatie, onder vermelding van het
      gebruik, dat de aanvrager van die inrichting, uitrusting of locatie wenst te maken;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel3
  - number: 3.3.c
    text: |-
      voor zover een of meer der in de [artikelen 4 tot en met 11][ref1] vervatte bepalingen op de betrokken aanvraag van
      toepassing zijn, de gegevens, welke de aanvraag uit dien hoofde in het bijzonder dient te bevatten dan wel, ingeval
      zodanige gegevens in een bij de aanvraag behorende bijlage zijn vermeld, een korte aanduiding van de aard en de
      inhoud dezer gegevens met verwijzing naar de betrokken bijlage;


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel4
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002667
        artikel: '4'
        hoofdstuk: II
        paragraaf: '2'
  - number: 3.3.d
    text: een opgave van de tijdsduur, waarvoor de vergunning wordt verlangd;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel3
  - number: 3.3.e
    text: |-
      indien een vergunning wordt aangevraagd voor een handeling die in de krachtens [artikel 19][ref1] in samenhang
      met [artikel 2.3 van het Besluit basisveiligheidsnormen stralingsbescherming][ref2] geldende regeling, als
      gerechtvaardigd is bekendgemaakt, een verwijzing naar die bekendmaking;


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Artikel2
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002667
        artikel: '19'
        hoofdstuk: IIIa
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0040179
        artikel: '2'
  - number: 3.3.f
    text: |-
      indien een vergunning wordt aangevraagd voor een handeling die niet of als niet-
      gerechtvaardigd is bekendgemaakt in de krachtens [artikel 19][ref1] in samenhang met
      [artikel 2.3 van het Besluit basisveiligheidsnormen stralingsbescherming][ref2] geldende regeling, een verzoek
      om rechtvaardiging van die handeling en tevens de gegevens met betrekking tot de economische, sociale en andere
      voordelen van de betrokken handeling en met betrekking tot de gezondheidsschade die erdoor kan worden toegebracht,
      die nodig zijn met het oog op de beoordeling van de gerechtvaardigdheid van de handeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Artikel2
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002667
        artikel: '19'
        hoofdstuk: IIIa
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0040179
        artikel: '2'
  - number: '3.4'
    text: |-
      Aanvragen om een vergunning, welke vallen onder verschillende bepalingen van de [paragrafen 2][ref1] en [3][ref2],
      kunnen, voor zover die aanvragen betrekking hebben op dezelfde inrichting, uitrusting of locatie dan wel op
      inrichtingen, uitrustingen of locaties, die tezamen een geheel vormen en die in elkaars onmiddellijke nabijheid
      zijn gelegen, in de vorm van een enkele, samengestelde aanvraag worden ingediend. Op zodanige aanvraag zijn alle
      bepalingen van toepassing, welke betrekking hebben op de afzonderlijke aanvragen, waaruit zij is samengesteld, met
      dien verstande dat in gevallen, waarin onverkorte toepassing dezer bepalingen zou leiden tot meervoudige vermelding
      van eenzelfde gegeven, met een enkelvoudige vermelding kan worden volstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002667#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0002667#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002667
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002667
        hoofdstuk: II
        paragraaf: '3'
  - number: '3.5'
    text: |-
      Indien een aanvraag om een vergunning betrekking heeft op een inrichting, uitrusting of locatie, ten aanzien
      waarvan reeds eerder een aanvraag is ingediend, kan, voor zover bepaalde gegevens reeds bij de eerdere aanvraag
      zijn verstrekt en geen wijziging hebben ondergaan, naar die eerdere aanvraag worden verwezen.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel3
  - number: '3.6'
    text: De Autoriteit kan de indiening van verdere afschriften van de aanvraag of van daarbij behorende bijlagen verlangen.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel3
  - number: 3a.1
    text: |-
      Indien binnen een inrichting als bedoeld [in artikel 15, onder b, van de wet][ref1] of op een locatie waarop een
      milieubelastende activiteit die is aangewezen in [hoofdstuk 3 van het Besluit activiteiten leefomgeving][ref2]
      wordt verricht reeds splijtstoffen, ertsen of radioactieve stoffen voorhanden zijn, of toestellen worden
      gebruikt, heeft de risicoanalyse, bedoeld in de [artikelen 4, eerste lid, onder e, en derde lid, onder e][ref3],
      [5, eerste lid, onder d, en tweede lid, onder d][ref4], [6, eerste lid, onder h][ref5], en
      [9, eerste lid, onder f][ref6], betrekking op de totaal ten gevolge van die inrichting of die locatie ontvangen
      effectieve dosis. De berekening van de effectieve dosis, bedoeld in de eerste volzin, heeft geen betrekking op de
      effectieve dosis ten gevolge van handelingen van een persoon als bedoeld in [artikel 3, tweede lid][ref7].


