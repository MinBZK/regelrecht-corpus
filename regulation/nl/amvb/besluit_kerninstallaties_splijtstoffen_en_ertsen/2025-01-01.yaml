  - number: '23.2'
    text: Het eerste lid is niet van toepassing met betrekking tot gevaarlijke stoffen die tevens radioactief zijn.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel23
  - number: '24'
    text: |-
      Het veiligheidsrapport, bedoeld in [artikel 6, eerste lid, onder h][ref1], en het opgestelde preventiebeleid,
      bedoeld in [artikel 4.10, eerste en tweede lid, van het Besluit activiteiten leefomgeving][ref2], dan wel het
      veiligheidsrapport, bedoeld in [artikel 4.14, eerste en tweede lid, van dat besluit][ref3], kunnen tot één
      veiligheidsrapport worden gecombineerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0041330#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0041330#Artikel4
