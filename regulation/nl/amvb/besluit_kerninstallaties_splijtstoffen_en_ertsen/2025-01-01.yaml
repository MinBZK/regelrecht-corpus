  - number: '9.1'
    text: |-
      De aanvraag om een vergunning voor het oprichten van een inrichting, waarin onbestraalde splijtstoffen, welke geen
      plutonium of verrijkt uranium bevatten, kunnen worden vervaardigd, bewerkt of verwerkt, bevat in ieder geval:
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel9
  - number: 9.1.a
    text: een opgave en beschrijving van de plaats, waar de inrichting zal worden gevestigd;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel9
  - number: 9.1.b
    text: een beschrijving van de inrichting;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel9
  - number: 9.1.c
    text: |-
      een opgave van de chemische en fysische toestand, de vorm en het gehalte der splijtstoffen, onder vermelding van de
      hoeveelheid der onderscheidene splijtstoffen, welke ten hoogste te eniger tijd in de inrichting aanwezig zal zijn;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel9
  - number: 9.1.d
    text: |-
      een opgave van het aantal personeelsleden, dat verantwoordelijk zal zijn voor het op deskundige wijze vervaardigen,
      bewerken, of verwerken van splijtstoffen, met vermelding van de gronden, waarop zij geacht kunnen worden voldoende
      deskundigheid te bezitten;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel9
  - number: 9.1.e
    text: |-
      een beschrijving van de maatregelen, welke door of vanwege de aanvrager zullen worden getroffen ter voorkoming van
      schade, waaronder begrepen de maatregelen ter voorkoming van schade buiten de inrichting;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel9
  - number: 9.1.f
    text: |-
      een risicoanalyse van de schade buiten de inrichting, welke is verbonden aan het vervaardigen, bewerken of
      verwerken in de inrichting van de onder c bedoelde splijtstoffen.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel9
  - number: '9.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een aanvraag om een vergunning voor het in werking brengen of
      in werking houden van een inrichting als in dat lid bedoeld.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel9
  - number: '10.1'
    text: |-
      Indien een aanvraag om een vergunning tot wijziging van een inrichting als bedoeld in de [artikelen 6][ref1],
      [7][ref2], [8][ref3] of [9][ref4] mede strekt tot het buiten gebruik stellen of ontmantelen van de inrichting of
      een deel daarvan, bevat de aanvraag in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002667#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002667#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002667#Artikel9
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel10
    references:
