    text: |-
      de waarden van de gegevens in de risicoanalyse, bedoeld in [artikel 6, eerste lid, onder h][ref1], niet voldoen aan
      de in onderstaande tabel opgenomen grenswaarden;







                        Gebeurtenisfrequentie F per jaar


                        Maximaal toegestane effectieve dosis









                        personen vanaf 16 jaar


                        personen tot 16 jaar




                        F ≥ 10–1


                        0,1 mSv


                        0,04 mSv




                        10–1 > F ≥ 10–2


                        1 mSv


                        0,4 mSv




                        10–2 > F ≥ 10–4


                        10 mSv


                        4 mSv




                        F < 10–4


                        100 mSv


                        40 mSv


