  - number: '4.1'
    text: 'De aanvraag om een vergunning voor het voorhanden hebben van splijtstoffen bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel4
  - number: 4.1.a
    text: |-
      een opgave van de hoeveelheden, de chemische en fysische toestand, de vorm, het gehalte en de verrijkingsgraad,
      zomede, voor wat bestraalde splijtstoffen betreft, een zo nauwkeurig mogelijke opgave van de activiteit der
      splijtstoffen;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel4
  - number: 4.1.b
    text: een opgave van het doel, waarvoor de aanvrager de splijtstoffen voorhanden wenst te hebben;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel4
  - number: 4.1.c
    text: |-
      een opgave en beschrijving van de plaats, waar de splijtstoffen voorhanden worden gehouden, dan wel, indien ten
      aanzien van de inrichting of uitrusting, waarin de splijtstoffen voorhanden worden gehouden, een vergunning als
      bedoeld in [artikel 15, onder b of c, van de wet][ref1] is vereist, een opgave van die inrichting of uitrusting,
      onder verwijzing naar de ten aanzien daarvan verleende vergunning, dan wel naar de aanvraag om een zodanige
      vergunning;


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 4.1.d
    text: |-
      een beschrijving van de maatregelen die door of vanwege de aanvrager zullen worden getroffen ter voorkoming van
      schade;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel4
  - number: 4.1.e
    text: |-
      een risicoanalyse van de schade van het voorhanden hebben van de onder a bedoelde splijtstoffen buiten de onder c
      bedoelde plaats, inrichting of uitrusting;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel4
  - number: 4.1.f
    text: |-
      een opgave van alle handelingen met splijtstoffen, ertsen, radioactieve stoffen en toestellen
      binnen de locatie die kennisgevingsplichtig, registratieplichtig of vergunningplichtig zijn
      krachtens dit besluit, het [Besluit basisveiligheidsnormen stralingsbescherming][ref1] of het
      [Besluit vervoer splijtstoffen, ertsen en radioactieve stoffen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0040179
      [ref2]: https://wetten.overheid.nl/BWBR0002668
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel4
    references:
