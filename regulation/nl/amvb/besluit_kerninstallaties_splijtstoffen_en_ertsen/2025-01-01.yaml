        bwb_id: BWBR0003418
        artikel: '15'
  - number: '21.1'
    text: |-
      Het is verboden in een inrichting als bedoeld in [artikel 15, onder b, van de wet][ref1], nucleaire drukapparatuur
      te gebruiken die niet is goedgekeurd door een daartoe door de Autoriteit aangewezen instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: '21.2'
    text: |-
      De Autoriteit stelt in het belang van de veilige werking van nucleaire drukapparatuur in een inrichting als bedoeld
      in [artikel 15, onder b, van de wet][ref1], bij verordening de voorschriften vast waaraan die apparatuur moet
      voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: '21.3'
    text: |-
      De Autoriteit stelt bij verordening regels met betrekking tot het aanwijzen van de in het eerste lid bedoelde
      instellingen, de eisen waar deze instellingen aan moeten voldoen met het oog op de aanwijzing en de duur van de
      aanwijzing.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel21
  - number: '21.4'
    text: |-
      De houder van een vergunning voor een inrichting als bedoeld in [artikel 15, onder b, van de wet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 21.4.a
    text: 'laat voor de ingebruikneming van de nucleaire drukapparatuur in die inrichting verrichten:'
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel21
  - number: 21.4.a.1°
    text: een beoordeling van het ontwerp van de nucleaire drukapparatuur;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel21
  - number: 21.4.a.2°
    text: een keuring van de fabricage van de nucleaire drukapparatuur;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel21
  - number: 21.4.a.3°
    text: een keuring voor de ingebruikneming van de nucleaire drukapparatuur;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel21
  - number: 21.4.b
    text: |-
      laat nucleaire drukapparatuur gedurende het gebruik keuren overeenkomstig een door de Autoriteit goedgekeurd
      keuringsprogramma.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel21
  - number: '21.5'
    text: |-
      De Autoriteit stelt bij verordening regels vast met betrekking tot de wijze waarop de beoordelingen en keuringen,
      bedoeld in het vierde lid, worden verricht en goedkeuringen worden verleend.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel21
  - number: '21.6'
    text: |-
      Bij regeling van Onze Minister kan worden bepaald dat het in het eerste lid gestelde verbod mede geldt voor
      gebruik in een inrichting als bedoeld in [artikel 15, onder b, van de wet][ref1], van bij of krachtens die regeling
      aangewezen andere drukapparatuur die bij defecten de verspreiding van radioactiviteit kan veroorzaken. Het tweede
      tot en met achtste lid zijn van overeenkomstige toepassing voor zover dat bij of krachtens die regeling is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: '21.7'
    text: |-
      De houder van een vergunning voor een inrichting als bedoeld in [artikel 15, onder b, van de wet][ref1] houdt met
      betrekking tot nucleaire drukapparatuur, die in zijn inrichting wordt of is geïnstalleerd, een administratie bij
      volgens bij verordening van de Autoriteit te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: '21.8'
    text: |-
      Goedkeuring van nucleaire drukapparatuur, die voor het in werking treden van dit artikel is verleend aan de hand
      van een keuring overeenkomstig het Stoombesluit, wordt gelijkgesteld met goedkeuring, verleend na een keuring
      overeenkomstig de krachtens het tweede lid bij verordening vastgestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel21
  - number: '22.1'
    text: Een referentiedreiging of wijziging daarvan wordt door Onze Minister vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22
  - number: '22.2'
    text: |-
      Een referentiedreiging wordt na vaststelling medegedeeld aan de houders van een vergunning voor een inrichting als
      bedoeld in [artikel 15, onder b, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: '22.3'
    text: |-
      De houder van een vergunning voor een inrichting als bedoeld in [artikel 15, onder b, van de wet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 22.3.a
    text: |-
      treft de beveiligingsmaatregelen die redelijkerwijs nodig zijn om de inrichting of de in [bijlage 1][ref1]
      genoemde splijtstoffen of ertsen, die krachtens het zevende of achtste lid zijn aangewezen als categorie I-, II-
      of III-materiaal, te beveiligen tegen de dreigingen zoals omschreven in de referentiedreiging. Daarbij handelt de
      vergunninghouder overeenkomstig het goedgekeurde beveiligingspakket, bedoeld in [artikel 22a][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002667
      [ref2]: https://wetten.overheid.nl/BWBR0002667#Artikel22a
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002667
      - id: ref2
        bwb_id: BWBR0002667
        artikel: 22a
        hoofdstuk: IIIa
        paragraaf: '3'
  - number: 22.3.b
    text: |-
      treft in ieder geval de beveiligingsmaatregelen die nodig zijn om te voorkomen dat de in [bijlage 2][ref1] genoemde
      maximale waarde voor de hoeveelheid radioactiviteit geëmitteerd naar de lucht, bepaald overeenkomstig die bijlage,
      of de maximale waarden voor de effectieve dosis ontvangen door een lid van de bevolking of een werknemer als
      bedoeld in [artikel 1.2][ref2] juncto [bijlage 1 van het Besluit basisveiligheidsnormen stralingsbescherming][ref3],
      bepaald overeenkomstig bijlage 2 van dit besluit, worden overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0002667
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0040179
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002667
      - id: ref2
        bwb_id: BWBR0040179
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0040179
  - number: '22.4'
    text: |-
      De houder van een vergunning voor een inrichting als bedoeld in [artikel 15, onder b, van de wet][ref1], stemt de
      combinatie en het niveau van de beveiligingsmaatregelen af op:


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 22.4.1°
    text: de aard van het materiaal, bedoeld in het derde lid, onder a, en de inrichting, en
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22
  - number: 22.4.2°
    text: |-
      de omvang van de mogelijke gevolgen door blootstelling aan straling van mensen, dieren, planten en goederen in het
      geval van diefstal of sabotage van categorie I-, II- of III-materiaal of sabotage van de inrichting.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22
  - number: '22.5'
    text: |-
      De beveiligingsmaatregelen en nucleaire veiligheidsmaatregelen worden door de houder van een vergunning voor een
      inrichting als bedoeld in [artikel 15, onder b, van de wet][ref1], zodanig ontworpen en uitgevoerd dat deze elkaar
      complementeren en niet belemmeren. Hij treft zodanige maatregelen dat het ontstaan van mogelijke conflicten tussen
      de beveiligingsmaatregelen en nucleaire veiligheidsmaatregelen zoveel mogelijk wordt tegengegaan of, waar deze
      conflicten zich toch zouden voordoen, deze zo spoedig mogelijk worden opgeheven.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: '22.6'
    text: |-
      De houder van een vergunning als bedoeld in [artikel 15, onder b, van de wet][ref1], treft de organisatorische,
      bouwkundige, elektronische en informatiebeveiligingsmaatregelen die in samenhang ten minste weerstand bieden tegen
      de dreigingen uit de referentiedreiging en die zorgdragen voor een tijdige respons.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: '22.7'
    text: |-
      Bij verordening van de Autoriteit worden met het oog op de te treffen beveiligingsmaatregelen de in
      [bijlage 1][ref1] genoemde splijtstoffen of ertsen aangewezen als categorie I-, II- of III-materiaal,
      overeenkomstig de Table of Categorization of nuclear material behorend bij de Nuclear Security Recommendations on
      Physical Protection of Nuclear Material and Nuclear Facilities.


      [ref1]: https://wetten.overheid.nl/BWBR0002667
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002667
  - number: '22.8'
    text: |-
      De Autoriteit kan, in afwijking van de aanwijzing, bedoeld in het zevende lid, overeenkomstig de
      afwijkingsmogelijkheden zoals opgenomen in de Table of Categorization of nuclear material, bij verordening of
      besluit het daarbij aangewezen materiaal indelen in een andere categorie.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22
  - number: '22.9'
    text: |-
      Bij verordening van de Autoriteit worden nadere regels gesteld met betrekking tot de uitvoering van het derde tot
      en met zesde lid.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22
  - number: 22a.1
    text: |-
      De houder van een vergunning voor een inrichting als bedoeld in [artikel 15, onder b, van de wet][ref1], beschikt
      over een overeenkomstig [artikel 22b][ref2] goedgekeurd beveiligingspakket met een beschrijving van de wijze waarop
      de inrichting of het categorie I-, II- en III-materiaal wordt beveiligd. Het beveiligingspakket bevat ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002667#Artikel22b
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002667
        artikel: 22b
        hoofdstuk: IIIa
        paragraaf: '3'
  - number: 22a.1.a
    text: |-
      de aanwijzing van een beveiligingsdeskundige en diens plaatsvervanger die belast zijn met de uitvoering en naleving
      van de beveiligingsmaatregelen en die voldoen aan bij verordening van de Autoriteit gestelde opleidingseisen;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22a
  - number: 22a.1.b
    text: |-
      de aanwijzing van vertrouwensfuncties als bedoeld in [artikel 1 van de Wet veiligheidsonderzoeken][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel1
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0008277
        artikel: '1'
  - number: 22a.1.c
    text: |-
      een plan interne beveiligingsorganisatie dat ten minste een omschrijving bevat van de interne
      beveiligingsorganisatie en de daarmee verband houdende verantwoordelijkheden, taken en bevoegdheden, de getroffen
      beveiligingsmaatregelen voor daarbij genoemde gebeurtenissen en situaties, de aansluiting op een plan externe
      beveiligingsorganisatie en de eisen aan het management of managementsysteem;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22a
  - number: 22a.1.d
    text: een omschrijving van de getroffen en te nemen beveiligingsmaatregelen;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22a
  - number: 22a.1.e
    text: |-
      de aanwijzing van een alarmcentrale die de elektronische signaleringen ontvangt en beoordeelt en indien nodig
      assistentie vraagt aan de externe beveiligingsorganisatie, en de beveiliging daarvan;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22a
  - number: 22a.1.f
    text: de aanwijzing van een bedrijfsbeveiligingsdienst;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22a
  - number: 22a.1.g
    text: |-
      een evaluatieprogramma bestaande uit testen, controles, audits en oefeningen om de doeltreffendheid van de
      beveiligingsmaatregelen te kunnen beoordelen;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22a
  - number: 22a.1.h
    text: |-
      een procedure voor de registratie van personen die toegang hebben of kunnen verlenen tot een daarbij aangewezen
      gebied.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22a
  - number: 22a.2
    text: |-
      Tot de plannen en maatregelen, bedoeld in het eerste lid, behoort per onderdeel een tijdstip waarop zij zijn
      uitgevoerd, met een daarop gericht plan van aanpak.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22a
  - number: 22a.3
    text: |-
      De houder van een vergunning voor een inrichting als bedoeld in [artikel 15, onder b, van de wet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 22a.3.a
    text: |-
      treft de beveiligingsmaatregelen die redelijkerwijs nodig zijn om de alarmcentrale, bedoeld in het eerste
      lid, onderdeel e, te beveiligen tegen de dreigingen zoals omschreven in de referentiedreiging, bedoeld in
      [artikel 22, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel22b
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0002667
        artikel: 22b
        hoofdstuk: IIIa
        paragraaf: '3'
  - number: 22a.3.b
    text: |-
      verdeelt bij het treffen van de beveiligingsmaatregelen het terrein waarop de inrichting en de daarbij behorende
      gebouwen zich bevinden, voor zover van toepassing, in een observatiegebied, een beveiligd gebied en een vitaal
      gebied met een omschrijving van de wijze van beveiliging van deze gebieden en treft beveiligingsmaatregelen voor
      deze gebieden en de gebouwen daarbinnen.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22a
  - number: 22a.4
    text: |-
      Bij verordening van de Autoriteit worden nadere regels gesteld met betrekking tot het beveiligingspakket en de
      daarin opgenomen of op te nemen beveiligingsmaatregelen en het plan interne beveiligingsorganisatie.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22a
  - number: 22b.1
    text: |-
      Het beveiligingspakket, bedoeld in [artikel 22a, eerste lid][ref1], en wijzigingen daarvan die een negatief effect
      hebben of kunnen hebben op het niveau van de beveiliging, behoeven goedkeuring van de Autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel22a
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22b
    references:
      - id: ref1
        bwb_id: BWBR0002667
        artikel: 22a
        hoofdstuk: IIIa
        paragraaf: '3'
  - number: 22b.2
    text: |-
      Goedkeuring wordt in ieder geval geweigerd indien het beveiligingspakket niet voldoet aan de eisen die daaraan bij
      of krachtens dit besluit zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22b
  - number: 22b.3
    text: De Autoriteit kan aan de goedkeuring voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22b
  - number: 22b.4
    text: |-
      De Autoriteit kan de goedkeuring intrekken of de daaraan verbonden voorschriften intrekken of wijzigen, indien het
      beveiligingspakket niet meer voldoet aan de eisen die daaraan bij of krachtens dit besluit zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22b
  - number: 22b.5
    text: Goedgekeurde wijzigingen worden geregistreerd en opgenomen in het beveiligingspakket.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22b
  - number: 22b.6
    text: |-
      Indien een aanvraag om goedkeuring betrekking heeft op een wijziging van het beveiligingspakket en voorafgaand aan
      die aanvraag reeds meerdere wijzigingen van dat pakket zijn goedgekeurd, kan de Autoriteit bepalen dat in plaats
      van die aanvraag een aanvraag om goedkeuring van een daarbij te overleggen, volledig herzien beveiligingspakket
      wordt ingediend.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22b
  - number: 22c.1
    text: |-
      De houder van een vergunning voor een inrichting als bedoeld in [artikel 15, onder b, van de wet][ref1], wijzigt
      het beveiligingspakket, bedoeld in [artikel 22a][ref2], nadat de referentiedreiging is gewijzigd, of wanneer de
      Autoriteit dit nodig acht en dit schriftelijk heeft medegedeeld aan de vergunninghouder, waarbij in de kennisgeving
      is aangegeven wat de aard is van de aan te brengen wijzigingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002667#Artikel22a
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22c
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002667
        artikel: 22a
        hoofdstuk: IIIa
        paragraaf: '3'
  - number: 22c.2
    text: |-
      De houder van een vergunning voor een inrichting als bedoeld in [artikel 15, onder b, van de wet][ref1] dient
      binnen een jaar nadat de referentiedreiging is gewijzigd, respectievelijk binnen een jaar nadat de Autoriteit
      kenbaar heeft gemaakt wijziging van het beveiligingspakket nodig te achten, een aanvraag om goedkeuring van
      het in overeenstemming met de referentiedreiging, respectievelijk de kennisgeving van de Autoriteit, gewijzigde
      beveiligingspakket in.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22c
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 22c.3
    text: 'De termijnen, bedoeld in het tweede lid, kunnen door de Autoriteit worden gewijzigd indien:'
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22c
  - number: 22c.3.a
    text: |-
      de wijziging van de referentiedreiging, respectievelijk de door de Autoriteit nodig geachte wijzigingen van het
      beveiligingspakket, deze gewijzigde termijnen rechtvaardigen, en
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22c
  - number: 22c.3.b
    text: |-
      de wijzigingen binnen de door de Autoriteit gestelde termijn door de houder van een vergunning van een inrichting
      als bedoeld in [artikel 15, onder b, van de wet][ref1], redelijkerwijs mogelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22c
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 22d.1
    text: |-
      De houder van een vergunning voor een inrichting als bedoeld in [artikel 15, onder b, van de wet][ref1], meldt
      gebeurtenissen die aan onverkorte toepassing van het beveiligingspakket in de weg staan, onmiddellijk aan de
      Autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22d
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 22d.2
    text: |-
      De vergunninghouder neemt onmiddellijk compenserende maatregelen en legt deze onverwijld voor aan de op grond van
      [artikel 58, eerste lid, onderdeel a, van de wet][ref1] aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel58
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22d
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '58'
  - number: 22e
    text: |-
      Het [Geheimhoudingsbesluit Kernenergiewet][ref1] is van toepassing op de referentiedreiging en het
      beveiligingspakket, bedoeld in [artikel 22a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002768
      [ref2]: https://wetten.overheid.nl/BWBR0002667#Artikel22a
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22e
    references:
      - id: ref1
        bwb_id: BWBR0002768
      - id: ref2
        bwb_id: BWBR0002667
        artikel: 22a
        hoofdstuk: IIIa
        paragraaf: '3'
  - number: 22f.1
    text: |-
      De houder van een vergunning voor een inrichting als bedoeld in [artikel 15, onder b, van de wet][ref1], voert het
      evaluatieprogramma, bedoeld in [artikel 22a, eerste lid, onder g][ref2], uit.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002667#Artikel22a
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22f
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002667
        artikel: 22a
        hoofdstuk: IIIa
        paragraaf: '3'
  - number: 22f.2
    text: |-
      De houder van een vergunning voor een inrichting als bedoeld in [artikel 15, onder b, van de wet][ref1] beoordeelt
      het beveiligingspakket jaarlijks op doeltreffendheid en meldt binnen een maand na die beoordeling de resultaten
      ervan aan de Autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22f
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 22f.3
    text: |-
      De houder van een vergunning voor een inrichting als bedoeld in [artikel 15, onder b, van de wet][ref1], wijzigt
      het beveiligingspakket voor zover de resultaten van de in het tweede lid bedoelde beoordeling daartoe aanleiding
      geven. Hij biedt de wijziging binnen een jaar na het ontstaan van de aanleiding tot wijziging ter goedkeuring aan
      de Autoriteit aan. [Artikel 22c, derde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002667#Artikel22c
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22f
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002667
        artikel: 22c
        hoofdstuk: IIIa
        paragraaf: '3'
  - number: 22g.1
    text: |-
      De houder van een vergunning voor een inrichting als bedoeld in [artikel 15, onder b, van de wet][ref1], beoordeelt
      elke tien jaar of het beveiligingspakket, bedoeld in [artikel 22a, eerste lid][ref2], voldoet aan de stand van de
      techniek. Daartoe worden de getroffen beveiligingsmaatregelen vergeleken met de op dat moment meest doeltreffende
      technieken die economisch en technisch gezien redelijkerwijs haalbaar zijn voor het bereiken van een hoog niveau
      van beveiliging. Indien de houder van een vergunning voor een inrichting als bedoeld in artikel 15, onder b, van
      de wet op grond van de voorschriften in de vergunning een tienjaarlijkse evaluatie voor de nucleaire veiligheid en
      stralingsbescherming moet uitvoeren, dan wordt de beoordeling tegelijkertijd met deze evaluatie uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002667#Artikel22a
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22g
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002667
        artikel: 22a
        hoofdstuk: IIIa
        paragraaf: '3'
  - number: 22g.2
    text: |-
      De houder van een vergunning voor een inrichting als bedoeld in [artikel 15, onder b, van de wet][ref1] de past het
      beveiligingspakket, bedoeld in [artikel 22a, eerste lid][ref2], aan voor zover de resultaten van de in het eerste
      lid bedoelde beoordeling daartoe aanleiding geven.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002667#Artikel22a
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22g
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002667
        artikel: 22a
        hoofdstuk: IIIa
        paragraaf: '3'
  - number: 22g.3
    text: |-
      De Autoriteit kan de houder van een vergunning voor een inrichting als bedoeld in
      [artikel 15, onder b, van de wet][ref1] opdragen een of meer extra beoordelingen binnen het tijdvak van tien jaar
      te doen indien dat naar zijn oordeel met het oog op het niveau van beveiliging noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22g
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 22h
    text: |-
      Met het oog op een goede uitvoering van de [artikelen 22a tot en met 22g][ref1] kunnen bij verordening van de
      Autoriteit nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel22a
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22h
    references:
      - id: ref1
        bwb_id: BWBR0002667
        artikel: 22a
        hoofdstuk: IIIa
        paragraaf: '3'
  - number: 22i.1
    text: |-
      De houder van een vergunning als bedoeld in [artikel 15, onder a, van de wet][ref1], treft de
      beveiligingsmaatregelen die redelijkerwijs noodzakelijk nodig zijn om categorie I-, II- of III-materiaal en de
      daarop betrekking hebbende informatie en processen te beveiligen tegen diefstal en sabotage.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22i
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 22i.2
    text: |-
      De houder van een vergunning als bedoeld in [artikel 15, onder a, van de wet][ref1], houdt op persoonlijke of
      elektronische wijze toezicht op het categorie I-, II- of III- materiaal.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22i
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 22i.3
    text: 'De beveiligingsmaatregelen, bedoeld in het eerste en tweede lid, worden afgestemd op:'
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22i
  - number: 22i.3.a
    text: de aard van het categorie I-, II-, of III-materiaal;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22i
  - number: 22i.3.b
    text: de manier waarop het categorie I-, II-, of III-materiaal wordt gebruikt of opgeslagen;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22i
  - number: 22i.3.c
    text: de verplaatsbaarheid van het categorie I-, II-, of III-materiaal;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22i
  - number: 22i.3.d
    text: |-
      de mogelijke gevolgen voor mensen, dieren, planten en goederen door blootstelling aan ioniserende straling of het
      vrijkomen van het categorie I-, II-, of III-materiaal in geval van diefstal of sabotage;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22i
  - number: 22i.3.e
    text: |-
      de maatregelen die zijn of worden getroffen om de nadelige gevolgen van ioniserende straling voor mensen, dieren,
      planten en goederen te voorkomen of te beperken.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22i
  - number: 22j.1
    text: |-
      De houder van een vergunning als bedoeld in [artikel 15, onder a, van de wet][ref1] beschikt over een
      beveiligingsplan met een beschrijving van de wijze waarop het categorie I-, II- of III-materiaal wordt beveiligd.
      De eerste volzin geldt niet indien de vergunninghouder tevens houder van een vergunning voor een inrichting
      als bedoeld in artikel 15, onder b, van de wet is en voor de desbetreffende inrichting voldaan wordt aan
      [paragraaf 3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002667#HoofdstukIIIa
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22j
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002667
        hoofdstuk: IIIa
        paragraaf: '3'
  - number: 22j.2
    text: 'Het beveiligingsplan bevat ten minste een beschrijving van:'
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22j
  - number: 22j.2.a
    text: de aanwijzing van een vakbekwame beveiligingsverantwoordelijke en diens plaatsvervanger,
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22j
  - number: 22j.2.b
    text: de indeling van de te beveiligen splijtstoffen in categorie I-, II- of III-materiaal;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22j
  - number: 22j.2.c
    text: de manier waarop en de plaats waar het categorie I-, II- of III- materiaal wordt gebruikt of opgeslagen;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22j
  - number: 22j.2.d
    text: de getroffen en te treffen beveiligingsmaatregelen;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22j
  - number: 22j.2.e
    text: |-
      de organisatie van de beveiliging en het toezicht, waaronder taken en bevoegdheden, de te volgen procedures in
      geval van diefstal of sabotage van het categorie I-, II- of III- materiaal of een poging daartoe en afspraken met
      de politie of een particuliere beveiligingsdienst;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22j
  - number: 22j.2.f
    text: een evaluatieprogramma om de beveiligingsmaatregelen te beoordelen.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22j
  - number: 22j.3
    text: |-
      De houder van een vergunning als bedoeld in [artikel 15, onder a, van de wet][ref1] handelt in overeenstemming met
      het beveiligingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22j
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 22j.4
    text: |-
      De houder van een vergunning als bedoeld in [artikel 15, onder a, van de wet][ref1] draagt er zorg voor dat van het
      beveiligingsplan alleen personen kennis kunnen nemen voor wie dit noodzakelijk is voor het goed uitvoeren van hun
      functie en dat deze personen voorafgaand aan het kennisnemen een verklaring omtrent het gedrag of een verklaring
      als bedoeld in [artikel 1, eerste lid, onderdeel b, van de Wet][ref2] veiligheidsonderzoeken overleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel1
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22j
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '1'
  - number: 22j.5
    text: |-
      De houder van een vergunning als bedoeld in [artikel 15, onder a, van de wet][ref1] voert jaarlijks en na elke
      inbreuk op de beveiliging het evaluatieprogramma uit. Daarbij worden in ieder geval de beveiligingsmaatregelen
      gecontroleerd en getest en wordt het beveiligingsplan in een oefening toegepast. De vergunninghouder wijzigt het
      beveiligingsplan voor zover de resultaten van het evaluatieprogramma daartoe aanleiding geven.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22j
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 22j.6
    text: |-
      Bij verordening van de Autoriteit worden nadere regels gesteld met betrekking tot de uitvoering van
      [artikel 22i][ref1] en het eerste tot en met vijfde lid, waaronder in elk geval het beveiligingsplan en de
      beveiligingsmaatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel22i
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel22j
    references:
      - id: ref1
        bwb_id: BWBR0002667
        artikel: 22i
        hoofdstuk: IIIa
        paragraaf: '4'
  - number: '23.1'
    text: |-
      De [artikelen 4.3][ref1], [4.4][ref2], [4.6, eerste lid, aanhef en onder a, b en d][ref3],
      [4.9][ref4], [4.10, eerste en tweede lid][ref5], [4.11, eerste en tweede lid][ref6],
      [4.12, eerste lid][ref7],[ 4.13][ref8], [4.14, eerste en tweede lid][ref9], [4.19, aanhef en onder d][ref10],
      [4.22][ref11], [4.23, eerste tot en met derde lid][ref12], [4.24, eerste tot en met derde lid][ref13],
      [4.25][ref14], [4.26][ref15], [4.27][ref16], en [4.28 van het Besluit activiteiten leefomgeving][ref17],
      de [artikelen 8.13, tweede lid][ref18], en [8.38 van het Besluit kwaliteit leefomgeving][ref19]
      en de [artikelen 13.17][ref20], [13.20][ref21], [13.21][ref22], [13.22, derde lid][ref23], en
      [13.24 tot en met 13.28 van het Omgevingsbesluit][ref24] zijn van overeenkomstige toepassing op inrichtingen
      als bedoeld in [artikel 15, onder b, van de wet][ref25] waarin krachtens vergunning gevaarlijke stoffen aanwezig
      zijn of mogen zijn of kunnen ontstaan bij verlies van controle over de processen, in een hoeveelheid van ten
      minste de drempelwaarde, bedoeld in bijlage I, deel 1 of deel 2, bij de Seveso-richtlijn, met inachtneming van de
      aantekeningen bij die bijlage.


