  - number: '6.1'
    text: |-
      De aanvraag om een vergunning voor het oprichten van een inrichting, waarin kernenergie kan worden vrijgemaakt,
      bevat in ieder geval:
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel6
  - number: 6.1.a
    text: |-
      een opgave en beschrijving van de plaats, waar de inrichting zal worden gevestigd, onder vermelding van alle
      terzake doende omstandigheden van geografische, geologische, klimatologische, demografische, hydrologische,
      ecologische en andere aard;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel6
  - number: 6.1.b
    text: |-
      een beschrijving van de inrichting met inbegrip van de daarin te bezigen installaties, alsmede van de werking van
      die inrichting en installaties, met opgave van de leveranciers van die onderdelen, welke voor de beoordeling van de
      veiligheid van belang zijn, en onder vermelding van het hoogste vermogen, waarop de inrichting zal werken;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel6
  - number: 6.1.c
    text: |-
      een opgave van de chemische en fysische toestand, de vorm, het gehalte en de verrijkingsgraad der splijtstoffen,
      welke in de inrichting zullen worden gebruikt, onder vermelding van de hoeveelheid der onderscheidene
      splijtstoffen, welke ten hoogste te eniger tijd in de inrichting aanwezig zal zijn;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel6
  - number: 6.1.d
    text: |-
      een beschrijving van de wijze, waarop de onder *c* bedoelde splijtstoffen in de inrichting zullen worden gebruikt,
      en van de wijze, waarop de splijtstoffen voor en na het gebruik zullen worden bewaard;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel6
  - number: 6.1.e
    text: |-
      een globale opgave van het totaal aantal personen, dat bij normaal bedrijf in de inrichting werkzaam zal zijn,
      alsmede een opgave van het aantal deskundigen en het aantal andere leden van het personeel, dat rechtstreeks bij
      het vrijmaken van kernenergie betrokken zal zijn, en van de onderlinge taakverdeling tussen die personeelsleden,
      zomede - voor wat betreft toezichthoudend personeel - van de gronden, waarop zij geacht kunnen worden voldoende
      deskundigheid voor het verrichten van hun taak te bezitten;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel6
  - number: 6.1.f
    text: |-
      een beschrijving van de wijze, waarop de aanvrager voornemens is zich na gebruik te ontdoen van de onder *c*
      bedoelde splijtstoffen;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel6
  - number: 6.1.g
    text: |-
      een beschrijving van de wijze, waarop de aanvrager voornemens is zich te ontdoen van radioactieve stoffen, welke
      tijdens het gebruik van de onder *c* bedoelde splijtstoffen zullen ontstaan;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel6
  - number: 6.1.h
    text: |-
      een veiligheidsrapport, inhoudende een beschrijving van de maatregelen, die door of vanwege de aanvrager
      zullen worden getroffen ter voorkoming van schade, of ter beperking van de kans op schade, waaronder begrepen
      de maatregelen ter voorkoming van schade buiten de inrichting, tijdens normaal bedrijf, en ter voorkoming van
      schade voortvloeiende uit de in die beschrijving te vermelden gepostuleerde begin-gebeurtenissen, alsmede een
      risicoanalyse van de schade buiten de inrichting als gevolg van die gebeurtenissen;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel6
  - number: 6.1.i
    text: een risicoanalyse van de schade buiten de inrichting als gevolg van buiten-ontwerpongevallen;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel6
  - number: 6.1.j
    text: |-
      een opgave van de verzekering of andere financiële zekerheid, welke de aanvrager ter voldoening aan de
      [Wet aansprakelijkheid kernongevallen][ref1] zal hebben en in stand houden, onder vermelding van alle ter zake
      doende gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0003234
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003234
  - number: '6.2'
    text: |-
