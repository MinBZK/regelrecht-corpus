  - number: 11a
    text: |-
      In gevallen waarin de vergunning betrekking heeft op het oprichten of wijzigen van een inrichting als bedoeld in
      [artikel 15, onder b, van de wet][ref1], dat tevens is aan te merken als een omgevingsplanactiviteit als bedoeld
      in [artikel 5.1, eerste lid, aanhef en onder a, van de Omgevingswet][ref2], bestaande uit een bouwactiviteit of het
      in stand houden van een bouwwerk, of een omgevingsvergunning voor een bouwactiviteit als bedoeld in artikel 5.1,
      tweede lid, aanhef en onder a, van de Omgevingswet, verstrekt de aanvrager:


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel5
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '5'
  - number: 11a.a
    text: |-
      indien de aanvraag om die omgevingsvergunning tegelijk met de aanvraag om de vergunning krachtens de [wet][ref1] is
      ingediend, een afschrift van die aanvraag bij zijn aanvraag;


