  - number: 3a.2
    text: |-
      Bij regeling van Onze Minister en Onze Minister van Sociale Zaken en Werkgelegenheid kunnen regels worden gesteld
      met betrekking tot de risicoanalyses, bedoeld in de [artikelen 4, eerste lid, onder e, en derde lid, onder e][ref1],
