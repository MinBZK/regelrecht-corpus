        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0003245
        afdeling: '13.2'
  - number: 16.a
    text: |-
      indien het betreft plutonium met een maximale activiteit van 37 gigabecquerel, mits dit plutonium op zodanige wijze
      is opgenomen in een omhulsel dat daardoor redelijkerwijze voldoende weerstand wordt geboden om elke verspreiding
      van of besmetting met dit plutonium te voorkomen;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel16
  - number: 16.b
    text: indien het betreft verarmd uranium, natuurlijk uranium of natuurlijk thorium.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel16
  - number: '17'
    text: |-
      Van het geven van een beschikking op de voorbereiding waarvan [afdeling 3.4 van de Algemene wet bestuursrecht][ref1]
      alsmede [afdeling 13.2 van de Wet milieubeheer][ref2] niet van toepassing zijn, wordt mededeling gedaan in de
      *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
