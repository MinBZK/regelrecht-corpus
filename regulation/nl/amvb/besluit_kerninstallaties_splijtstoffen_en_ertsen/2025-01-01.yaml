  - number: 15.b.1°
    text: |-
      het college van gedeputeerde staten van de provincie, het bestuur van de veiligheidsregio en het college van
      burgemeester en wethouders van de gemeente waar de inrichting geheel of in hoofdzaak is of zal zijn gelegen;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel15
  - number: 15.b.2°
    text: |-
      de colleges van gedeputeerde staten van de provincies, de besturen van de veiligheidsregio’s en de colleges van
      burgemeester en wethouders van de gemeenten waarvan het gebied is gelegen op minder dan tien kilometer van de
      plaats waar de inrichting gelegen is of zal zijn, en
