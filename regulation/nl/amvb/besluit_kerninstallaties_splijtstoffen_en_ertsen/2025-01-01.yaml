  - number: '11.2'
    text: |-
      Indien de vergunning met betrekking tot een inrichting als bedoeld in [artikel 6][ref1], [7][ref2] of [8][ref3]
      is verkregen op een tijdstip waarop ter verkrijging van die vergunning geen risicoanalyse als bedoeld in
      [artikel 6, eerste lid, onder i][ref4], behoefde te worden overgelegd, wordt bij de aanvraag, bedoeld in het eerste
      lid, indien de voorgenomen wijziging van invloed is op een of meer van de gegevens die doorgaans worden vermeld in
      een zodanige risicoanalyse, een risicoanalyse als bedoeld in [artikel 6, eerste lid, onder i][ref5], gevoegd, die
      niet alleen betrekking heeft op de wijziging, maar ook op het in werking zijn van de inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002667#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002667#Artikel8
