        artikel: '6'
        hoofdstuk: II
        paragraaf: '3'
  - number: 18.2.b
    text: dan wel uit die risico-analyse blijkt dat de effectieve schildklierdosis niet beperkt blijft tot 500 mSv.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel18
  - number: '18.3'
    text: |-
      Een vergunning voor het oprichten, in werking brengen of houden of wijzigen van een inrichting,
      waarin kernenergie kan worden vrijgemaakt, kan worden geweigerd, indien de waarden in de krachtens
      [artikel 6, eerste lid, onder i][ref1], verrichte risicoanalyse een van de volgende waarden overschrijden:


      [ref1]: https://wetten.overheid.nl/BWBR0002667#Artikel6
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002667
        artikel: '6'
        hoofdstuk: II
        paragraaf: '3'
  - number: 18.3.a
    text: |-
      een kans van 10–6 per jaar dat een persoon, die zich permanent en onbeschermd buiten de desbetreffende inrichting
      zou bevinden, overlijdt als gevolg van een buiten-ontwerpongeval;
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel18
  - number: 18.3.b
    text: |-
      een kans van 10–5 per jaar dat buiten de desbetreffende inrichting een groep van ten minste 10 personen direct
      dodelijk slachtoffer is van een buiten-ontwerpongeval, of voor n maal meer direct dodelijke slachtoffers een kans
      die n2 maal kleiner is.
    url: https://wetten.overheid.nl/BWBR0002667/2025-01-01#Artikel18
