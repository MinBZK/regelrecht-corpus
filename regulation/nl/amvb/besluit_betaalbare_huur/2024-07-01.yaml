preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 28 maart 2024, nr. 2024-
    0000009230;

    Gelet op de artikelen 3, derde lid, en 10, eerste lid, van de Uitvoeringswet huurprijzen woonruimte en artikel
    2.24, eerste lid, van de Omgevingswet.

    De Afdeling advisering van de Raad van State gehoord (advies van 29 mei 2024, nr. W04.24.00064/I);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 25 juni 2024, nr.
    2024-0000019122;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0049892/2024-07-01#ArtikelAanhef
articles:
  - number: I
    text: |-
      In afwijking van [artikel 12, tweede lid, van het Besluit huurprijzen woonruimte][ref1] worden op 1 juli 2024 de
      krachtens dat besluit geldende maximale huurprijsgrenzen gewijzigd met de verhouding van het gemiddelde van de
      consumentenprijsindex van januari 2023 tot en met juni 2023 tot het gemiddelde van de consumentenprijsindex van
      januari 2022 tot en met juni 2022 maal 6/12, met dien verstande dat de op basis daarvan berekende bedragen naar
      boven worden afgerond op hele eurocenten.


      [ref1]: https://wetten.overheid.nl/BWBR0003237#Artikel12
    url: https://wetten.overheid.nl/BWBR0049892/2024-07-01#ArtikelI
    references:
      - id: ref1
        bwb_id: BWBR0003237
        artikel: '12'
  - number: III
    text: |-
      Als voor de inwerkingtreding van [artikel II][ref1] van dit besluit een ontwerp van een wijziging van het
      omgevingsplan of een projectbesluit ter inzage is gelegd of een aanvraag om een omgevingsvergunning voor
      een buitenplanse omgevingsplanactiviteit is ingediend, blijft het oude recht van toepassing tot het besluit
      onherroepelijk wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0049892#ArtikelII
    url: https://wetten.overheid.nl/BWBR0049892/2024-07-01#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0049892
        artikel: II
  - number: IV
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijkrelaties zendt binnen vijf jaar na het tijdstip van
      inwerkingtreding van dit besluit aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten
      van dit besluit in de praktijk. Vervolgens wordt telkens na vijf jaar een verslag gezonden aan de Staten-
      Generaal over de doeltreffendheid en de effecten van de hoogte van de liberalisatiegrens, bedoeld in
      [artikel 2, eerste lid, van het Besluit huurprijzen woonruimte][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003237#Artikel2
    url: https://wetten.overheid.nl/BWBR0049892/2024-07-01#ArtikelIV
    references:
      - id: ref1
        bwb_id: BWBR0003237
        artikel: '2'
  - number: V
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0049892/2024-07-01#ArtikelV
  - number: VI
    text: 'Dit besluit wordt aangehaald als: Besluit betaalbare huur.'
    url: https://wetten.overheid.nl/BWBR0049892/2024-07-01#ArtikelVI
