  - number: '9'
    text: |-
      Burgemeester en wethouders geven de bestemming aan van bijstand ter voorziening in de behoefte aan
      bedrijfskapitaal.
    url: https://wetten.overheid.nl/BWBR0007335/2003-07-01#Artikel9
  - number: '10'
    text: |-
      1 Burgemeester en wethouders nemen een nadere beslissing met betrekking tot de verleende bijstand, bedoeld
      in [artikel 23, eerste lid][ref1], van de wet, nadat zij het netto inkomen uit bedrijf of zelfstandig beroep
      definitief hebben vastgesteld aan de hand van de administratie. De zelfstandige legt deze binnen 6 maanden na
      afloop van het boekjaar over aan burgemeester en wethouders.

      2 Indien de verleende bijstand, vermeerderd met het in het desbetreffende boekjaar behaalde netto inkomen:

      a. minder is dan de jaarnorm, wordt ambtshalve voor het verschil bijstand verleend, met dien verstande dat de in
      totaal te verlenen bijstand niet meer bedraagt dan de jaarnorm berekend naar evenredigheid over de periode waarin
      over het desbetreffende boekjaar bijstand is verleend. De als geldlening verstrekte bijstand wordt omgezet in een
      bedrag om niet;

      b. gelijk is aan de jaarnorm, wordt de als geldlening verstrekte bijstand omgezet in een bedrag om niet;

      c. meer is dan de jaarnorm, wordt de bijstand ter grootte van het verschil teruggevorderd en wordt de rest van de
      als geldlening verstrekte bijstand omgezet in een bedrag om niet.


      [ref1]: https://wetten.overheid.nl/BWBR0007335#Artikel23
    url: https://wetten.overheid.nl/BWBR0007335/2003-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007335
        artikel: '23'
        hoofdstuk: IV
  - number: '11'
    text: |-
      In afwijking van [artikel 10][ref1] wordt, voor zover het eigen vermogen de vermogensgrens, genoemd in
      [artikel 3][ref2] of [13, tweede lid][ref3], overschrijdt, de renteloze geldlening gehandhaafd na afloop van het
      tijdvak waarin bijstand is verleend. Met ingang van het jaar volgend op het laatste jaar van de bijstandverlening
      wordt hierop een jaarlijkse aflossing van tenminste 10 procent voldaan. Voor zover de zelfstandige, naar het
      oordeel van burgemeester en wethouders, een deel van de verschuldigde aflossing niet kan voldoen, wordt uitstel van
      betaling verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0007335#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0007335#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007335#Artikel13
    url: https://wetten.overheid.nl/BWBR0007335/2003-07-01#Artikel11
