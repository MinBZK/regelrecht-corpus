        bwb_id: BWBR0007336
        artikel: '4'
  - number: '24'
    text: |-
      1 De voor de uitoefening van het bedrijf of zelfstandig beroep noodzakelijke bezittingen en de aanwezige schulden
      van de zelfstandige worden gewaardeerd op basis van de waarde in het economisch verkeer.

      2 In afwijking van het eerste lid worden de volgende vermogensbestanddelen als volgt gewaardeerd:

      a. onderhanden werken, halffabrikaten, eindprodukten en te velde staande gewassen worden gewaardeerd op basis van
      de gemaakte kosten, arbeidskosten daaronder begrepen;

      b. handelsvoorraden en grondstoffen worden gewaardeerd op basis van de aanschaffingswaarde, voor zover nodig
      gecorrigeerd met een aftrek wegens incourantheid;

      c. immateriële activa, zoals goodwill en melkquotum worden gewaardeerd op basis van de aankoopprijs, waarbij
      rekening wordt gehouden met de afschrijving;

      d. levensverzekeringen, die zijn aangegaan voor de financiering van onroerend goed, worden opgenomen tegen de
      contante waarde;

      e. aandelen in coöperaties en inkoopverenigingen alsmede andere vormen van ledenkapitaal worden gewaardeerd op
      basis van de fiscale boekwaarde;

      f. land en tuinbouwgrond wordt gewaardeerd op de waarde in verpachte staat.

      3 In afwijking van het tweede lid, onderdeel *a*, kunnen de meerjarige te velde staande gewassen of de
      plantopstanden in een bepaalde bedrijfstak worden gewaardeerd op de waarde in het economisch verkeer op het moment
      dat er in deze bedrijfstak sprake is van een crisissituatie; van een crisissituatie is sprake in het geval dat
      er in meer dan twee opeenvolgende jaren lage opbrengstprijzen zijn verkregen al dan niet in combinatie met lage
      fysieke opbrengsten als gevolg van slechte weersomstandigheden.

      4 Onder schulden wordt mede verstaan:

      a. uit de jaarrekening blijkende schulden wegens niet uitbetaald loon aan kinderen;

      b. reserveringen in verband met belastingclaims, die voortvloeien uit de vaststelling van de waarde van de
      bezittingen, bedoeld in het eerste en tweede lid;

      c. reserveringen in verband met de Wet Investeringsrekening.

      5 Burgemeester en wethouders laten, indien daartoe aanleiding bestaat, de onroerende goederen taxeren door een
      taxateur.

      6 Burgemeester en wethouders laten de waarde van de bezittingen opnieuw vaststellen indien gewijzigde
      omstandigheden daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0007335/2003-07-01#Artikel24
  - number: '25'
    text: |-
      De bijstand aan een ondernemer in de binnenvaart wordt verleend, indien hij verblijft op het grondgebied van:

      a. de provincies Groningen, Friesland en Drenthe: door burgemeester en wethouders van de gemeente Groningen;

      b. de provincies Overijssel en Flevoland: door burgemeester en wethouders van de gemeente Zwolle;

      c. de provincie Gelderland en de gemeenten Bergen, Boxmeer, Cuijk, Gennep, Grave, Lith, Mook en Middelaar, Oss en
      Ravenstein: door burgemeester en wethouders van de gemeente Nijmegen;

      d. de provincie Utrecht: door burgemeester en wethouders van de gemeente Nieuwegein;

      e. de provincie Noord-Holland: door burgemeester en wethouders van de gemeente Amsterdam;

      f. de provincie Zuid-Holland: door burgemeester en wethouders van de gemeente Rotterdam;

      g. de provincie Zeeland: door burgemeester en wethouders van de gemeente Terneuzen;

      h. de provincie Noord-Brabant, met uitzondering van de gemeenten Asten, Boxmeer, Budel, Cuijk, Deurne, Grave,
      Helmond, Lith, Mierlo, Oss, Ravenstein en Someren: door burgemeester en wethouders van de gemeente Geertruidenberg;

      i. de gemeenten Asten, Budel, Deurne, Helmond, Mierlo en Someren en de provincie Limburg, met uitzondering van de
      gemeenten Bergen, Gennep en Mook en Middelaar: door burgemeester en wethouders van de gemeente Maasbracht.
    url: https://wetten.overheid.nl/BWBR0007335/2003-07-01#Artikel25
  - number: '27'
    text: |-
      1 Onze Minister herziet de bedragen, genoemd in [de artikelen 3][ref1], [5][ref2], [6][ref3], [7][ref4],
      [11a][ref5], [12][ref6] en [13, tweede en derde lid][ref7], overeenkomstig [artikel 61 van de wet][ref8].

      2 Onze Minister herziet het rentepercentage, genoemd in [artikel 5][ref9], voor zover de rente die banken in
      rekening brengen bij het verstrekken van leningen aan bedrijven, daartoe aanleiding geeft.


