  - number: '20'
    text: |-
      De zelfstandige die niet aan de rente- en aflossingsverplichtingen voldoet, wordt door burgemeester en wethouders
      tot betaling gemaand. Indien de zelfstandige ook na een tweede aanmaning niet voldoet, worden het geleende bedrag
      en de achterstallige rente, beide verhoogd met de wettelijke rente, teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0007335/2003-07-01#Artikel20
  - number: '21'
    text: |-
      1 De zelfstandige die geheel of gedeeltelijk niet in staat is aan de rente- en aflossingsverplichtingen te voldoen,
      kan een met redenen omkleed verzoek om uitstel of verlaging van betaling indienen.

      2 Indien de zelfstandige tijdelijk niet in staat is aan de verplichtingen te voldoen en bijstand om niet ingevolge
      [artikel 8, tweede lid][ref1], niet mogelijk of ontoereikend is, kunnen burgemeester en wethouders, afhankelijk van
      de financiële omstandigheden van betrokkene:

      a. tijdelijk het bedrag van de aflossing verlagen;

      b. geheel of gedeeltelijk uitstel van het betalen van aflossing en rente verlenen.

      3 Uitstel van aflossing en betaling van rente op grond van het tweede lid, onderdeel *b*, wordt ten hoogste voor
      een periode van een jaar verleend. Burgemeester en wethouders kunnen zonodig deze periode tweemaal met ten hoogste
      een jaar verlengen. Over de gehele looptijd van de lening kan maximaal gedurende een aaneengesloten of onderbroken
      periode van drie jaar uitstel worden verleend.

      4 Het uitstel op grond van het tweede lid, onderdeel *b*, heeft bij voorrang betrekking op de aflossing. De
      vordering wegens uitstel van betaling van rente is niet rentedragend.

      5 Indien blijkt dat de zelfstandige duurzaam niet aan de verplichtingen kan voldoen of indien de periode van drie
      jaar bedoeld in het derde lid is verstreken, zijn de lening en de eventuele achterstallige rente terstond opeisbaar
      en worden deze teruggevorderd.

      6 Indien blijkt dat de financiële omstandigheden van de zelfstandige zodanig zijn dat deze geacht kan worden aan
      de verplichtingen te kunnen voldoen, worden de vanaf de vervaldatum achterstallige rente- en aflossingsbedragen
      terstond teruggevorderd. Indien hierbij sprake is van een toerekenbare tekortkoming in de nakoming, is over de
      achterstallige rente- en aflossingsbedragen de wettelijke rente verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0007335#Artikel8
    url: https://wetten.overheid.nl/BWBR0007335/2003-07-01#Artikel21
