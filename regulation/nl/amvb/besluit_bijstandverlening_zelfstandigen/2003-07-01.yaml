  - number: '5'
    text: |-
      Bijstand in de vorm van een geldlening ter voorziening in de behoefte aan bedrijfskapitaal wordt verleend met
      inachtneming van het volgende:

      a. de geldlening bedraagt voor een zelfstandige die reeds gedurende een redelijke termijn als zodanig werkzaam is
      geweest ten hoogste f 300 000 ; dit bedrag geldt per bedrijf of zelfstandig beroep;

      b. de rente van de geldlening bedraagt 7 procent per jaar gedurende de gehele looptijd van de geldlening;

      c. de looptijd van de geldlening is ten hoogste tien jaar.
    url: https://wetten.overheid.nl/BWBR0007335/2003-07-01#Artikel5
  - number: '6'
    text: |-
      Bijstand in de vorm van borgtocht ter voorziening in de behoefte aan bedrijfskapitaal wordt verleend met
      inachtneming van het volgende:

      a. de borgtocht kan worden aangegaan voor een zelfstandige die reeds gedurende een redelijke termijn als zodanig
      werkzaam is geweest tot ten hoogste f 300 000 ; dit bedrag geldt per bedrijf of zelfstandig beroep;

      b. de borgtocht heeft geen betrekking op de rente en kosten van die geldlening waarvoor borgtocht wordt aangegaan;

      c. de looptijd van de geldlening waarvoor borgtocht wordt aangegaan is ten hoogste tien jaar;

      d. de borgtocht kan alleen worden aangegaan met een bank;

      e. het bedrag dat de zelfstandige na uitwinning verschuldigd is, wordt aangemerkt als een lening, waarop
      [de artikelen 20][ref1] tot en met [23][ref2] van toepassing zijn;

      f. uitwinning door de bank kan slechts plaatsvinden na toestemming van burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0007335#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0007335#Artikel23
    url: https://wetten.overheid.nl/BWBR0007335/2003-07-01#Artikel6
