  - number: '22'
    text: |-
      Indien op grond van dit besluit een lening is verstrekt werken burgemeester en wethouders mee aan een
      schuldregeling of aan een akkoord voor zover dit noodzakelijk is voor de voortzetting van het bedrijf of
      zelfstandig beroep, of dit bij de beëindiging van het bedrijf of zelfstandig beroep tot stand kan komen. Deze
      medewerking wordt slechts verleend indien:

      a. het gedeelte van de lening dat door gestelde zekerheden wordt gedekt, buiten het akkoord blijft en

      b. alle concurrente schuldeisers evenredige medewerking verlenen.
    url: https://wetten.overheid.nl/BWBR0007335/2003-07-01#Artikel22
  - number: '23'
    text: |-
      1 Bij beëindiging van het bedrijf of zelfstandig beroep dient de lening, behoudens in het
      geval [artikel 22][ref1] toepassing vindt, volledig te worden terugbetaald. Gestelde zekerheden
      worden volledig uitgewonnen. In afwijking daarvan blijft, op verzoek van de betrokkene en
      voor zover mogelijk, een lening onder hypothecair verband, verbonden aan de eigen woning met
      bijbehorend erf, gehandhaafd of wordt deze tot de onbelaste waarde van deze woning gevestigd. De
      [artikelen 4, 5, 6, eerste, tweede en vierde lid, en 8 van het Besluit krediethypotheek bijstand][ref2], zijn van
      overeenkomstige toepassing.

      2 Indien na beëindiging van het bedrijf of zelfstandig beroep een deel van de lening resteert en deze niet met
      toepassing van het vorige lid onder hypothecair verband is verleend, wordt het resterende deel van de lening vanaf
      de beëindiging renteloos. Gedurende de periode van vijf jaar na beëindiging van het bedrijf of zelfstandig beroep
      dient 50 procent van het netto inkomen boven de bijstandsnorm als bedoeld in [hoofdstuk IV](onbekend), [afdeling 1]
      (onbekend), van de wet, besteed te worden voor aflossing van deze lening.


      [ref1]: https://wetten.overheid.nl/BWBR0007335#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0007336#Artikel4
    url: https://wetten.overheid.nl/BWBR0007335/2003-07-01#Artikel23
    references:
