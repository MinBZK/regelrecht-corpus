  - number: '12'
    text: |-
      1 Aan een beginnende zelfstandige als bedoeld in [artikel 8, tweede lid][ref1], van de wet, kan ter voorziening in
      de behoefte aan bedrijfskapitaal uitsluitend bijstand in de vorm van een geldlening of borgtocht worden verleend
      tot een bedrag van ten hoogste f 60 000 . Dit bedrag geldt per bedrijf of zelfstandig beroep. Het gestelde in
      [artikel 6, onder ][ref2], is van overeenkomstige toepassing.

      2 Toekenning van algemene bijstand als bedoeld in [artikel 8, tweede lid, van de wet][ref3] wordt beëindigd zodra
      het bedrijf of zelfstandig beroep niet meer levensvatbaar is.

      3 Burgemeester en wethouders onderzoeken of het bedrijf of zelfstandig beroep nog levensvatbaar is:

      a. 6 maanden na aanvang van de bijstandsverlening, bedoeld in [artikel 8, tweede lid, eerste zin][ref4], van de wet
      en daarna na een periode van respectievelijk 6 en 12 maanden;

      b. bij verlenging van de toekenning van algemene bijstand om redenen van medische of sociale aard als bedoeld in
      [artikel 8, tweede lid, tweede zin][ref5], van de wet en vervolgens telkens na een periode van 12 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0007335#Artikel8
