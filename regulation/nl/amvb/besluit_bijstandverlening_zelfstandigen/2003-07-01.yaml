  - number: '8'
    text: |-
      1 De op grond van [artikel 5][ref1] verleende bijstand wordt ambtshalve geheel of gedeeltelijk omgezet in een
      bedrag om niet, indien het netto inkomen in het boekjaar van de aanvraag dan wel in het daaraan voorafgaande jaar
      lager is dan de jaarnorm. Het bedrag om niet bedraagt het verschil tussen de jaarnorm en het netto inkomen doch ten
      hoogste het verschil tussen het eigen vermogen en de toepasselijke vermogensgrens bedoeld in [artikel 3][ref2]. De
      zelfstandige bepaalt het boekjaar waarover de bijstand wordt omgezet in een bedrag om niet.

      2 De op grond van [artikel 5][ref3] verschuldigde rente wordt ambtshalve kwijtgescholden en reeds betaalde
      rente terugbetaald, indien het netto inkomen in een of beide boekjaren volgend op het boekjaar van de aanvraag,
      lager is dan de jaarnorm. Het bedrag is ten hoogste de voor dat boekjaar geldende renteverplichting op grond van
      [artikel 5][ref4], doch niet meer dan het verschil tussen de jaarnorm en het netto inkomen in het boekjaar.

      3 Indien de bijstand is verleend in de vorm van borgtocht op grond van [artikel 6][ref5], zijn het eerste en
      tweede lid van overeenkomstige toepassing op de door de bank verstrekte lening. De aldus berekende bedragen worden
      verstrekt als een bedrag om niet. Aan deze bijstand wordt de voorwaarde verbonden dat het wordt aangewend ter
      aflossing of tot rentebetaling op de door de bank verstrekte lening.

      4 Het bedrag van de op grond van het eerste lid in een bedrag om niet omgezette bijstand, of het bedrag van de op
      grond van het tweede lid kwijtgescholden of terugbetaalde rente dan wel het op grond van het derde lid berekende
      bedrag om niet, kan tezamen met de over hetzelfde boekjaar verleende bijstand ingevolge paragraaf 3 van dit
      hoofdstuk, niet meer bedragen dan de jaarnorm.


      [ref1]: https://wetten.overheid.nl/BWBR0007335#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007335#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007335#Artikel5
