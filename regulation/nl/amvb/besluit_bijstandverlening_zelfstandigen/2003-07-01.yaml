  - number: '3'
    text: |-
      Bijstand in de vorm van een bedrag om niet als bedoeld in [artikel 22, tweede lid][ref1] en
      [artikel 23, tweede en derde lid][ref2], van de wet en [de artikelen 7][ref3], [8][ref4] en [10][ref5] van dit
      besluit:

      a. wordt niet verleend indien het eigen vermogen meer bedraagt dan f 282 000

      b. wordt, indien het eigen vermogen meer bedraagt dan f 77 800  doch minder dan f 282 000  slechts verleend indien
      dit eigen vermogen niet meer bedraagt dan 30 procent van het totaal vermogen.


