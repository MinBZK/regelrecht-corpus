articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. wet: de [Algemene bijstandswet][ref1];

      b. levensvatbaar bedrijf of zelfstandig beroep: het bedrijf of zelfstandig beroep waaruit de zelfstandige naar
      verwachting na bijstandverlening een inkomen zal verwerven dat, samen met het overige inkomen, toereikend is voor
      de voortzetting van het bedrijf of zelfstandig beroep en voor de voorziening in het bestaan;

      c. boekjaar: de periode van 12 maanden waarover de administratie van de zelfstandige wordt gevoerd;

      d. netto inkomen: het over het boekjaar verworven inkomen, bedoeld in [hoofdstuk IV][ref2], [afdeling 3](onbekend),
      [paragraaf 2](onbekend), van de wet;

      e. bruto inkomen: het over het boekjaar verworven inkomen, bedoeld in [hoofdstuk IV][ref3], [afdeling 3](onbekend),
      [paragraaf 2](onbekend), van de wet, zonder toepassing van [artikel 45][ref4] van de wet;

      f. jaarnorm: de tot een bedrag per boekjaar omgerekende som van de bijstandsnorm, bedoeld in [hoofdstuk IV][ref5],
      [afdeling 1](onbekend), [paragraaf 2](onbekend) en 3 van de wet en de verleende bijzondere bijstand;

      g. totaal vermogen: het vermogen, bedoeld in [artikel 51][ref6] van de wet, zonder aftrek van de aanwezige schulden
      en zonder de in [artikel 52, tweede lid, onderdeel ][ref7], van de wet bedoelde bezittingen in aanmerking te nemen;

      h. eigen vermogen: het verschil tussen het totaal vermogen en de aanwezige schulden;

      i. bank: kredietinstelling die is ingeschreven in [de afdelingen I](onbekend), onderafdeling 1, 2, 3, 5 of 6 of
      afdeling III van het register, bedoeld in [artikel 52, eerste lid, van de Wet toezicht kredietwezen 1992][ref8];

      j. onderzoek: een bedrijfseconomisch of bedrijfstechnisch onderzoek, waaronder begrepen de taxatie van
      vermogensbestanddelen, afgerond met een schriftelijke rapportage, voor zover dit onderzoek noodzakelijk is voor de
      uitvoering van dit besluit.


