        artikel: '15'
        hoofdstuk: III
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0007335
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: '17'
    text: |-
      Indien bijstand wordt verleend aan een zelfstandige die zijn bedrijf of zelfstandig beroep uitoefent in een
      samenwerkingsverband of in de vorm van een rechtspersoon, gelden de bedragen van de vermogensgrenzen, bedoeld in
      [artikel 3][ref1] en [artikel 13, tweede lid][ref2], voor ieder van de vennoten of leden afzonderlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0007335#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007335#Artikel13
    url: https://wetten.overheid.nl/BWBR0007335/2003-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007335
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007335
        artikel: '13'
        hoofdstuk: III
        paragraaf: '2'
  - number: '18'
    text: |-
      Ten aanzien van de zelfstandige die het bedrijf of zelfstandig beroep uitoefent in de vorm van een besloten
      vennootschap of een coöperatieve vereniging met wettelijke aansprakelijkheid, wordt onder netto inkomen als bedoeld
      in [artikel 1, onderdeel ][ref1], mede verstaan de naar evenredigheid van het aantal zelfstandigen in een boekjaar
      omgerekende netto winst van deze rechtspersoon verminderd met de hierover verschuldigde vennootschapsbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0007335#Artikel1
    url: https://wetten.overheid.nl/BWBR0007335/2003-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007335
        artikel: '1'
        hoofdstuk: I
  - number: '19'
    text: |-
      1 Burgemeester en wethouders leggen in de beschikking waarin de bijstand wordt toegekend in elk geval vast:

      a. indien de bijstand wordt verstrekt in de vorm van een lening op grond van [de artikelen 5][ref1] of [12][ref2]:

      1°. de verplichtingen tot betaling van rente en aflossing alsmede de betalingstermijnen;

      2°. dat het bedrag van de lening, behoudens in de gevallen waarin [artikel 8, tweede lid][ref3], van toepassing is
      en met inachtneming van [artikel 21][ref4], terstond opeisbaar is bij het niet nakomen van de verplichtingen tot
      betaling van rente en aflossing.

      b. indien de bijstand wordt verstrekt in de vorm van borgtocht op grond van [artikel 6][ref5], dat aan de
      verplichtingen opgenomen in de leningsovereenkomst met de bank dient te worden voldaan.

      2 In de beschikking tot toekenning van de bijstand wordt voorts opgenomen dat het bedrag van de lening terstond
      opeisbaar is:

      a. indien zij niet overeenkomstig de bestemming is besteed;

      b. op het moment dat de zelfstandige het bedrijf of zelfstandig beroep overdraagt of beëindigt;

      c. ingeval van surséance van betaling of faillissement van de zelfstandige, van één van de vennoten of leden
      waarmee het bedrijf of zelfstandig beroep in een samenwerkingsverband wordt uitgeoefend, of van de rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0007335#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007335#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0007335#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0007335#Artikel21
      [ref5]: https://wetten.overheid.nl/BWBR0007335#Artikel6
