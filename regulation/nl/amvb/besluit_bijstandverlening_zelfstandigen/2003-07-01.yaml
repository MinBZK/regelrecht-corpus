  - number: '7'
    text: |-
      Bijstand ter voorziening in de behoefte aan bedrijfskapitaal in de vorm van een bedrag om niet als bedoeld in
      [artikel 22, tweede lid, aanhef en onderdeel ][ref1], van de wet, wordt verleend tot ten hoogste f 15 000 ;
      dit bedrag geldt per bedrijf of zelfstandig beroep. Deze bijstand gaat niet samen met bijstand als bedoeld in
      [de artikelen 5][ref2] en [6][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007335#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0007335#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0007335#Artikel6
