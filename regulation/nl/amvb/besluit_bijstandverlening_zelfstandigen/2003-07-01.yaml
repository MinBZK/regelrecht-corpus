      1 Aan een zelfstandige wordt bijstand ter voorziening in de behoefte aan bedrijfskapitaal verleend met toepassing
      van paragraaf 2 van dit hoofdstuk.

      2 Aan een zelfstandige wordt bijstand ter voorziening in de algemeen noodzakelijke kosten van het bestaan verleend
      met toepassing van paragraaf 3 van dit hoofdstuk.

      3 Indien aan een zelfstandige bijstand wordt verleend zowel ter voorziening in de behoefte aan bedrijfskapitaal als
      ter voorziening in de algemeen noodzakelijke kosten van het bestaan, wordt de bijstand verleend met toepassing van
      [de artikelen 5][ref1], [6][ref2], [8][ref3] en [9][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007335#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007335#Artikel6
