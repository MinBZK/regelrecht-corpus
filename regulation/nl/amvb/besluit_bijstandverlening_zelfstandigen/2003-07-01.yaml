  - number: 11a
    text: |-
      Aan een persoon als bedoeld in [artikel 8, zesde lid, van de wet][ref1] kan bijstand worden verleend in de kosten,
      bedoeld in [artikel 8, zesde lid, onderdeel c, van de wet][ref2], tot een bedrag van ten hoogste f 5000,– .


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel8
