  - number: '13'
    text: |-
      1 Aan een oudere zelfstandige als bedoeld in [artikel 8, derde lid, aanhef en onderdeel ][ref1], van de wet, wordt
      bijstand verleend indien hij uit het bedrijf of zelfstandig beroep naar verwachting de eerstkomende jaren een bruto
      inkomen zal behalen dat gemiddeld minstens f 12 000  per boekjaar bedraagt.

      2 Bijstand in de vorm van een bedrag om niet wordt aan de oudere zelfstandige niet verleend indien het eigen
      vermogen meer bedraagt dan f 197 500 .

      3 Bijstand ter voorziening in de behoefte aan bedrijfskapitaal wordt aan de oudere zelfstandige slechts verleend
      tot ten hoogste f 15 000. Deze bijstand wordt verstrekt in de vorm van een bedrag om niet of, voor zover het
      eigen vermogen meer bedraagt dan f 197 500  in de vorm van een renteloze lening. Artikel 11 is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007335#Artikel8
    url: https://wetten.overheid.nl/BWBR0007335/2003-07-01#Artikel13
