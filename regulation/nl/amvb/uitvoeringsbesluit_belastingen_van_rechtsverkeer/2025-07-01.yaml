  - number: 5c
    text: |-
      1 De in [artikel 15, eerste lid, onderdeel h, van de wet][ref1] bedoelde vrijstelling wegens splitsing is van
      toepassing bij overgang van vermogen onder algemene titel in het kader van een splitsing van een rechtspersoon
      voor zover de verkrijgende rechtspersoon de gehele onderneming of een zelfstandig onderdeel daarvan, tezamen
      met de onroerende zaak die daartoe behoort en daaraan dienstbaar is, van de splitsende rechtspersoon verkrijgt.
      De eerste zin is slechts van toepassing indien de aandeelhouder van de splitsende rechtspersoon, als gevolg van
      de verkrijging van de bij die splitsing toegekende aandelen, onmiddellijk of middellijk een soortgelijk belang
      houdt in de verkrijgende rechtspersoon als de aandeelhouder had in de splitsende rechtspersoon op het tijdstip
      onmiddellijk voorafgaand aan de splitsing. Indien de verkregen onroerende zaak die behoort tot en dienstbaar
      is aan de onderneming of het zelfstandig onderdeel daarvan op het tijdstip van de verkrijging dienstbaar is aan
      het verkrijgen, vervreemden of exploiteren van die onroerende zaak, kan de vrijstelling alleen toepassing vinden
      indien de splitsende rechtspersoon of de aandeelhouder van de splitsende rechtspersoon het gehele belang in de
      verkrijgende rechtspersoon houdt.

      2 In afwijking van het eerste lid is de in [artikel 15, eerste lid, onderdeel h, van de wet][ref2] bedoelde
      vrijstelling wegens splitsing eveneens van toepassing indien, in het kader van een zuivere splitsing als bedoeld in
      [artikel 334cc van Boek 2 van het Burgerlijk Wetboek][ref3] of een vergelijkbare buitenlandse rechtsfiguur, niet de
      gehele onderneming of een zelfstandig onderdeel daarvan onder algemene titel overgaat, voor zover:

      a. de aandeelhouder van de splitsende rechtspersoon, ingeval de verkrijgende rechtspersoon aandelen in een
      rechtspersoon als bedoeld in [artikel 4, eerste lid, onderdeel a, van de wet][ref4] verkrijgt, een soortgelijk
      belang bij laatstgenoemde rechtspersoon houdt als hij had op het tijdstip onmiddellijk voorafgaand aan de zuivere
      splitsing en de aandeelhouder het gehele belang in de verkrijgende rechtspersoon houdt; of

      b. de aandeelhouder van de splitsende rechtspersoon, ingeval de verkrijgende rechtspersoon een andere onroerende
      zaak dan bedoeld in [artikel 4, eerste lid, onderdeel a, van de wet][ref5] verkrijgt, een gelijk belang bij
      de onroerende zaak houdt als hij had op het tijdstip onmiddellijk voorafgaand aan de zuivere splitsing en de
      aandeelhouder het gehele belang in de verkrijgende rechtspersoon houdt.

      3 De belasting die door toepassing van [artikel 15, eerste lid, onderdeel h, van de wet][ref6] niet is geheven is
      alsnog verschuldigd indien:

      a. ter zake van een splitsing als bedoeld in het eerste lid of tweede lid, onderdeel a, de gesplitste rechtspersoon
      dan wel de aandeelhouder van de gesplitste rechtspersoon binnen drie jaren na de splitsing het bij of in verband
      met de splitsing verkregen belang niet meer geheel houdt; of

      b. ter zake van een splitsing als bedoeld in het tweede lid, onderdeel b, de aandeelhouder van de gesplitste
      rechtspersoon binnen drie jaren na de splitsing niet meer het gehele belang in de verkrijgende rechtspersoon houdt.

      4 De belasting die door toepassing van [artikel 15, eerste lid, onderdeel h, van de wet][ref7] niet is geheven
      ter zake van een splitsing als bedoeld in het eerste lid is alsnog verschuldigd door die verkrijger die de van de
      gesplitste rechtspersoon verkregen onderneming of een zelfstandig onderdeel daarvan niet gedurende een periode van
      ten minste drie jaren na de splitsing geheel voortzet.

      5 Het derde lid blijft buiten toepassing:

      a. in geval van vervreemding van het belang, bedoeld in het derde lid, onderdeel a, of het gehele
      of een gedeelte van het belang, bedoeld in het derde lid, onderdeel b, in het kader van een fusie,
      splitsing of interne reorganisatie of een geruisloze terugkeer waarop de vrijstelling, bedoeld in
      [artikel 15, eerste lid, onderdeel h, van de wet][ref8], onderscheidenlijk artikel 15, eerste lid, onderdeel f,
      onder 2°, van de wet, van toepassing is en van toepassing blijft gedurende de resterende periode, bedoeld in het
      derde lid, en waarbij in overeenstemming met artikel 15, negende lid, van de wet aangifte is gedaan, behoudens de
      situatie dat [artikel 5b, vijfde lid][ref9], wordt toegepast; dan wel

      b. indien ten minste 75 percent van de aandelen van de rechtspersoon die wegens splitsing aandelen heeft toegekend,
      wordt verkregen door een andere rechtspersoon tegen toekenning van een door eigen aandelen vertegenwoordigd
      soortgelijk belang.

      6 Voor de toepassing van het vijfde lid, onderdeel b, wordt onder toekenning van aandelen mede begrepen het geval
      waarin naast de toekenning van aandelen tevens een bedrag in geld wordt betaald van ten hoogste 10 percent van de
      nominale waarde van de toegekende aandelen.

      7 Het vijfde lid is slechts van toepassing indien:

      a. het in het kader van een opvolgende rechtshandeling als bedoeld in het vijfde lid toegekende belang in de plaats
      komt van het belang, bedoeld in het derde lid, onderdeel a, en ook de resterende periode in de plaats van dat
      belang wordt gehouden; of

      b. het belang, bedoeld in het derde lid, onderdeel b, de resterende periode wordt gehouden door de opvolgende
      verkrijger.

      8 Het vierde lid blijft buiten toepassing ingeval de onderneming of een zelfstandig onderdeel daarvan wordt
      vervreemd in het kader van een opvolgende vrijgestelde rechtshandeling als bedoeld in het vijfde lid, onderdeel
      a, of een inbreng als bedoeld in [artikel 15, eerste lid, onderdeel e, onder 1°, van de wet][ref10] en deze
      onderneming of een zelfstandig onderdeel daarvan voor de resterende periode wordt voortgezet door de opvolgende
      verkrijger. In geval van een inbreng als bedoeld in artikel 15, eerste lid, onderdeel e, onder 1°, van de wet is
      de eerste zin slechts van toepassing indien het door de inbrengende rechtspersoon ter zake van die inbreng in de
      vennootschap verkregen belang soortgelijk is aan het belang dat de aandeelhouders in de inbrengende rechtspersoon
      hebben en dat soortgelijke belang gedurende de resterende periode wordt gehouden door de inbrengende rechtspersoon.

      9 Het vijfde tot en met het achtste lid blijven buiten toepassing ingeval de daar bedoelde rechtshandelingen in
      samenhang met de splitsing, bedoeld in het eerste of tweede lid, in overwegende mate gericht zijn op het ontgaan
      van belastingheffing.

      10 De in [artikel 15, eerste lid, onderdeel h, van de wet][ref11] bedoelde vrijstelling wegens splitsing is
      eveneens van toepassing op een uit de splitsing voortvloeiende verkrijging van aandelen in een verkrijgende
      rechtspersoon of een groepsmaatschappij daarvan, welke rechtspersoon of groepsmaatschappij kwalificeert als een
      rechtspersoon als bedoeld in [artikel 4, eerste lid, onderdeel a, van de wet][ref12] voor zover de in het kader
      van de splitsing verkregen onroerende zaak door de verkregen aandelen wordt vertegenwoordigd en de in artikel 15,
      eerste lid, onderdeel h, van de wet bedoelde vrijstelling in samenhang met dit artikel op de verkrijging van deze
      onroerende zaak van toepassing is.

      11 Voor de toepassing van dit artikel wordt onder rechtspersoon verstaan de naamloze vennootschap, de
      besloten vennootschap met beperkte aansprakelijkheid, de vereniging, de coöperatie alsmede de onderlinge
      waarborgmaatschappij, mits deze een in aandelen verdeeld kapitaal hebben. Onder rechtspersoon wordt mede verstaan
      het lichaam dat naar het recht van een andere staat is opgericht en naar aard en inrichting vergelijkbaar is met
      een rechtspersoon als bedoeld in dit lid.


