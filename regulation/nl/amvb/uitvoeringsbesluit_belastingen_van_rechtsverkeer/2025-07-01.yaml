  - number: 5a
    text: |-
      1 De in [artikel 15, eerste lid, onderdeel h, van de wet][ref1] bedoelde vrijstelling wegens fusie is van
      toepassing indien een vennootschap uitsluitend de gehele onderneming of een zelfstandig onderdeel daarvan van een
      andere vennootschap verkrijgt tegen toekenning van aandelen.

      2 Onder toekenning van aandelen wordt begrepen het geval waarin naast de toekenning van aandelen tevens een bedrag
      in geld wordt betaald van ten hoogste 10 percent van de waarde van hetgeen op de aandelen is gestort.

      3 De belasting die door toepassing van [artikel 15, eerste lid, onderdeel h, van de wet][ref2] niet is geheven ter
      zake van een fusie is alsnog verschuldigd, indien de inbrengende vennootschap binnen drie jaren na de fusie niet
      meer in het bezit is van alle bij of in verband met die fusie verkregen aandelen.

      4 De belasting die door toepassing van [artikel 15, eerste lid, onderdeel h, van de wet][ref3] niet is geheven ter
      zake van een fusie is alsnog verschuldigd, indien de onderneming niet gedurende een periode van ten minste drie
      jaren na de fusie door de verkrijgende vennootschap wordt voortgezet.

      5 Het derde lid blijft buiten toepassing in geval van vervreemding van de aandelen in het kader van een interne
      reorganisatie als bedoeld in [artikel 5b][ref4], een splitsing als bedoeld in [artikel 5c][ref5], dan wel indien
      ten minste 75 percent van de aandelen van de vennootschap die de in het eerste lid bedoelde aandelen heeft
      toegekend, wordt verkregen door een andere vennootschap tegen toekenning van eigen aandelen, met dien verstande dat
      de toegekende aandelen in de plaats komen van de in het derde lid bedoelde aandelen. Onder toekenning van aandelen
      wordt mede begrepen het geval waarin naast de toekenning van aandelen tevens een bedrag in geld wordt betaald van
      ten hoogste 10 percent van de nominale waarde van de toegekende aandelen.

      6 Het vierde lid blijft buiten toepassing in geval van vervreemding van de onderneming in het kader van een fusie
      als bedoeld in dit artikel, een interne reorganisatie als bedoeld in [artikel 5b][ref6], dan wel een splitsing als
      bedoeld in [artikel 5c][ref7].

      7 Voor de toepassing van dit artikel wordt onder vennootschap verstaan de naamloze vennootschap en de besloten
      vennootschap met beperkte aansprakelijkheid. Onder vennootschap wordt mede verstaan de vereniging, coöperatie en
      onderlinge waarborgmaatschappij met een in aandelen verdeeld kapitaal. Tevens wordt daaronder verstaan het lichaam
      dat naar het recht van een andere Staat is opgericht en naar aard en inrichting vergelijkbaar is met een lichaam
      als bedoeld in dit lid.


