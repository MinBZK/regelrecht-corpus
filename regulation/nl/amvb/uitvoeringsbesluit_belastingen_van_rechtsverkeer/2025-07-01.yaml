  - number: 5d
    text: |-
      1 De in [artikel 15, eerste lid, onderdeel h, van de wet][ref1] bedoelde vrijstelling is op een verkrijging door
      een vereniging als bedoeld in [artikel 6.33, onderdeel c, van de Wet inkomstenbelasting 2001][ref2] of een algemeen
      nut beogende instelling van toepassing:

      a. bij een juridische fusie tussen twee of meer van deze verenigingen of instellingen, indien in het kader
      daarvan alle activa en passiva van één of meer van de verdwijnende verenigingen of instellingen onder algemene
      titel overgaan op de verkrijgende vereniging of instelling of op een in het kader van de fusie nieuw opgerichte
      dergelijke vereniging of instelling, mits bij de overgang commerciële factoren geen rol spelen;

      b. bij een taakoverdracht tussen twee of meer van deze verenigingen of instellingen, indien in het kader daarvan
      alle activa en passiva die betrekking hebben op de overgedragen taak aan de verkrijgende vereniging of instelling
      worden overgedragen, mits bij de overdracht commerciële factoren geen rol spelen.

      2 De vrijstelling is niet van toepassing op de verkrijging indien de overdracht uitsluitend de exploitatie van
      onroerende zaken inhoudt of de afzonderlijke overdracht van onroerende zaken betreft of als de onroerende zaken
      niet worden aangewend voor de overgedragen taak.

      3 De belasting die door toepassing van [artikel 15, eerste lid, onderdeel h, van de wet][ref3] niet is
      geheven, is alsnog verschuldigd indien de verkrijgende vereniging of instelling binnen drie jaren na de
      fusie of taakoverdracht niet meer bestaat of niet meer aangemerkt wordt als een vereniging als bedoeld in
      [artikel 6.33, onderdeel c, van de Wet inkomstenbelasting 2001][ref4] of een algemeen nut beogende instelling.

      4 Het derde lid blijft buiten toepassing indien een verkrijgende vereniging of instelling niet langer als
      vereniging als bedoeld in [artikel 6.33, onderdeel c, van de Wet inkomstenbelasting 2001][ref5] of een algemeen nut
      beogende instelling wordt aangemerkt als gevolg van een juridische fusie als bedoeld in het eerste lid, onderdeel
      a, of als gevolg van een taakoverdracht als bedoeld in het eerste lid, onderdeel b, voor zover de belasting
      betrekking heeft op onroerende zaken die in het kader van deze juridische fusie zijn overgegaan of in het kader van
      deze taakoverdracht zijn overgedragen.

      5 Van commerciële factoren als bedoeld in het eerste lid, onderdeel b, is geen sprake indien:

      a. voor de activa en passiva die betrekking hebben op de overgedragen taak geen koopsom of andere prestatie wordt
      bedongen; of

      b. van overheidswege een overnamesom dient te worden bedongen tot een voorgeschreven waarde van de overgedragen
      activa, waarbij de totale waarde van de overgedragen passiva en een aanvullende koopsom of andere prestatie niet
      hoger is dan de waarde van die overnamesom.


