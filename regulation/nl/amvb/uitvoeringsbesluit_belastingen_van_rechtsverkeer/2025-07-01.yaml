  - number: 5bis
    text: |-
      1 De in [artikel 15, eerste lid, onderdeel h, van de wet][ref1] bedoelde vrijstelling wegens fusie is van
      toepassing bij overgang van vermogen onder algemene titel in het kader van een juridische fusie tussen
      rechtspersonen, mits die fusie hoofdzakelijk plaatsvindt op grond van zakelijke overwegingen. De eerste volzin
      blijft buiten toepassing in geval van een fusie waarop [artikel 5b, eerste lid][ref2], van toepassing is.

      2 De in [artikel 15, eerste lid, onderdeel h, van de wet][ref3] bedoelde vrijstelling wegens fusie is niet van
      toepassing dan wel de belasting die door toepassing van artikel 15, eerste lid, onderdeel h, van de wet niet is
      geheven is alsnog verschuldigd, indien:

      a. een aandeelhouder van een verdwijnende rechtspersoon, welke rechtspersoon op het tijdstip van de fusie
      kwalificeert als een rechtspersoon als bedoeld in [artikel 4, eerste lid, onderdeel a, van de wet][ref4], op dat
      tijdstip of op enig tijdstip in het daaraan voorafgaande jaar, al dan niet tezamen met een tot hetzelfde concern
      als gedefinieerd in [artikel 5b, tweede lid][ref5], behorend lichaam, een belang van ten minste een derde gedeelte
      in de verdwijnende rechtspersoon bezit of heeft bezeten, daarvoor als gevolg van de fusie geen in de plaats komend
      soortgelijk belang in de verkrijgende rechtspersoon of een groepsmaatschappij daarvan verkrijgt, dan wel dat
      soortgelijk belang binnen drie jaren na de fusie geheel of ten dele vervreemdt;

      b. een aandeelhouder van de verkrijgende rechtspersoon, welke rechtspersoon op het tijdstip van de fusie
      kwalificeert als een rechtspersoon als bedoeld in [artikel 4, eerste lid, onderdeel a, van de wet][ref6], op dat
      tijdstip of op enig tijdstip in het daaraan voorafgaande jaar, al dan niet tezamen met een tot hetzelfde concern
      als gedefinieerd in [artikel 5b, tweede lid][ref7], behorend lichaam, een belang van ten minste een derde gedeelte
      in de verkrijgende rechtspersoon bezit of heeft bezeten, dat belang binnen drie jaren na de fusie geheel of ten
      dele vervreemdt;

      c. een aandeelhouder van een verdwijnende rechtspersoon als gevolg van de fusie een belang van ten
      minste een derde gedeelte in de verkrijgende rechtspersoon of een groepsmaatschappij daarvan, welke
      rechtspersoon of groepsmaatschappij als gevolg van de fusie kwalificeert als een rechtspersoon als bedoeld in
      [artikel 4, eerste lid, onderdeel a, van de wet][ref8], verkrijgt en dat belang binnen drie jaren na de fusie
      geheel of ten dele vervreemdt;

      d. een aandeelhouder van de verkrijgende rechtspersoon of van een groepsmaatschappij daarvan als gevolg van de
      fusie een belang van ten minste een derde gedeelte in de verkrijgende rechtspersoon of de groepsmaatschappij
      daarvan, welke rechtspersoon of groepsmaatschappij als gevolg van de fusie kwalificeert als een rechtspersoon als
      bedoeld in [artikel 4, eerste lid, onderdeel a, van de wet][ref9], bezit en dat belang binnen drie jaren na de
      fusie geheel of ten dele vervreemdt.

      3 De belasting die door toepassing van [artikel 15, eerste lid, onderdeel h, van de wet][ref10] niet is geheven ter
      zake van een fusie is alsnog verschuldigd, indien de activiteiten van de fuserende rechtspersonen niet gedurende
      een periode van ten minste drie jaren na de fusie door de verkrijgende rechtspersoon in haar geheel worden
      voortgezet.

      4 Het tweede lid blijft buiten toepassing in geval van een vervreemding van het belang in het kader van een
      geruisloze terugkeer als bedoeld in [artikel 4a][ref11], een juridische fusie als bedoeld in dit artikel, een
      bedrijfsfusie als bedoeld in [artikel 5a][ref12], een interne reorganisatie als bedoeld in [artikel 5b][ref13],
      een splitsing als bedoeld in [artikel 5c][ref14], dan wel indien ten minste 75 percent van de aandelen van de
      verkrijgende vennootschap wordt verkregen door een andere vennootschap tegen toekenning van eigen aandelen,
      waaronder mede wordt begrepen het geval waarin naast toekenning van aandelen tevens een bedrag in geld wordt
      betaald van ten hoogste 10 percent van hetgeen op de aandelen is gestort. De eerste volzin is slechts van
      toepassing indien het toegekende belang in de plaats komt van het in het tweede lid bedoelde belang dan wel het in
      het tweede lid bedoelde belang de resterende periode in het bezit blijft bij de opvolgende verkrijger.

      5 Het derde lid blijft buiten toepassing in geval van vervreemding van de activiteiten in het kader van een inbreng
      als bedoeld in [artikel 4][ref15], een geruisloze terugkeer als bedoeld in [artikel 4a][ref16], een juridische
      fusie als bedoeld in dit artikel, een bedrijfsfusie als bedoeld in [artikel 5a][ref17], een interne reorganisatie
      als bedoeld in [artikel 5b][ref18], een splitsing als bedoeld in [artikel 5c][ref19], mits de in het derde lid
      bedoelde activiteiten gedurende de resterende periode door de opvolgende verkrijger worden voortgezet. In geval van
      een inbreng als bedoeld in artikel 4 is de eerste volzin slechts van toepassing indien het ter zake van de inbreng
      verkregen belang in de vennootschap de resterende periode blijft behouden.

      6 Het vierde en het vijfde lid blijven buiten toepassing ingeval de daargenoemde gebeurtenissen in samenhang met de
      juridische fusie in overwegende mate gericht zijn op het ontgaan van belastingheffing.

      7 De in [artikel 15, eerste lid, onderdeel h, van de wet][ref20] bedoelde vrijstelling is eveneens van
      toepassing op uit de fusie voortvloeiende verkrijgingen van een belang in een verkrijgende rechtspersoon of een
      groepsmaatschappij daarvan, welke rechtspersoon of groepsmaatschappij kwalificeert als een lichaam als bedoeld in
      [artikel 4, eerste lid, onderdeel a, van de wet][ref21].

      8 Voor de toepassing van dit artikel wordt onder rechtspersoon verstaan de naamloze vennootschap, de besloten
      vennootschap met beperkte aansprakelijkheid, de vereniging met volledige rechtsbevoegdheid, de coöperatie, de
      onderlinge waarborgmaatschappij, alsmede de stichting. Onder rechtspersoon wordt mede verstaan het lichaam dat naar
      het recht van een andere Staat is opgericht en naar aard en inrichting vergelijkbaar is met een lichaam als bedoeld
      in dit lid.


