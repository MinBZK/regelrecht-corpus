  - number: 9a
    text: |-
      1 Het verzoek om een vergunning voor een fiscaal vertegenwoordiger bevat de volgende gegevens:

      a. naam, adres en woon- of vestigingsplaats van de verzoeker;

      b. het beoogde tijdstip van aanvang van het fiscaal vertegenwoordigerschap; en

      c. naam, adres en woon- of vestigingsplaats van de verzekeraar die niet in Nederland woont of is gevestigd.

      2 Een vergunning voor een fiscaal vertegenwoordiger wordt slechts verleend indien de verzoeker:

      a. in Nederland woont of is gevestigd;

      b. in de afgelopen vijf jaren niet wegens overtreding van de wettelijke bepalingen inzake rijksbelastingen
      onherroepelijk is veroordeeld; en

      c. naar het oordeel van de inspecteur voldoende solvabel is.

      3 De verlening van een vergunning voor een fiscaal vertegenwoordiger is tevens gebonden aan de voorwaarde dat de
      verzoeker optreedt voor alle verzekeringen waarvoor assurantiebelasting is verschuldigd van de verzekeraar die niet
      in Nederland woont of is gevestigd.

      4 De inspecteur kan de vergunning intrekken of wijzigen:

      a. op verzoek van de fiscaal vertegenwoordiger met schriftelijke instemming van de verzekeraar die niet in
      Nederland woont of is gevestigd;

      b. op verzoek van de verzekeraar die niet in Nederland woont of is gevestigd; of

      c. indien de fiscaal vertegenwoordiger niet meer voldoet aan de voorwaarden waaronder de vergunning is verleend.

      5 De verzekeraar die niet in Nederland woont of is gevestigd wordt van de intrekking of wijziging van de vergunning
      in kennis gesteld, alsmede van de gronden waarop deze berust.
    url: https://wetten.overheid.nl/BWBR0002770/2025-07-01#Artikel9a
