      1 Onder waarde als bedoeld in [artikel 15, eerste lid, onderdeel p, onder 4°, van de wet][ref1], wordt verstaan de
      waarde, bedoeld in [artikel 9, eerste lid, van de wet][ref2], onder toepassing van [artikel 11 van de wet][ref3].

      2 Onder het totaal van de waarde van de woning of rechten waaraan deze is onderworpen en tot die woning behorende
      aanhorigheden als bedoeld in [artikel 15, eerste lid, onderdeel p, onder 4°, van de wet][ref4] wordt verstaan de
      som van de waarde van de huidige verkrijging en de waarde van eventuele eerdere verkrijgingen die plaatsvonden in
      de voorafgaande twaalf maanden en betrekking hebben op dezelfde woning of rechten waaraan deze is onderworpen of
      een aanhorigheid bij die woning, door dezelfde persoon.


