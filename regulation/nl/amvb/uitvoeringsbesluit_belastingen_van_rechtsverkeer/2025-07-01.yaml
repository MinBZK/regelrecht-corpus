  - number: '3'
    text: |-
      De vrijstelling, bedoeld in [artikel 15, eerste lid, onderdeel t, van de wet][ref1], is van toepassing onder de
      volgende voorwaarden:

      a. uit het verkoopregulerend beding bij de eerdere verkrijging blijkt een zelfbewoningsplicht voor de eerdere
      verkrijger;

      b. ten tijde van de eerdere verkrijging is de waarde van de woning, bedoeld in [artikel 52 van de wet][ref2],
      zonder rekening te houden met het verkoopregulerend beding, niet hoger dan de ten tijde van de eerdere verkrijging
      geldende woningwaardegrens, genoemd in [artikel 15, eerste lid, onderdeel p, onder 4° van de wet][ref3], dan wel
      niet hoger dan € 400.000 indien de woning is verkregen vóór 1 april 2021;

      c. de woning is bij de eerdere verkrijging verkregen met een koperskorting van ten minste 10% en ten hoogste 50%
      van de waarde van die woning ten tijde van de eerdere verkrijging;

      d. uit de notariële akte van levering waarin de verkrijging wordt vastgelegd blijkt dat is voldaan aan de
      onderdelen b en c;

      e. bij vervreemding door de natuurlijk persoon geldt dat de natuurlijk persoon de verkregen koperskorting geheel
      of gedeeltelijk moet terugbetalen aan de verkrijger, of dat de verkrijger in bepaalde mate deelt in de tussentijdse
      waardeontwikkeling.


