  - number: 5b
    text: |-
      1 De in [artikel 15, eerste lid, onderdeel h][ref1], bedoelde vrijstelling wegens interne reorganisatie is
      van toepassing indien een tot het concern behorende vennootschap onroerende zaken overdraagt aan een andere
      vennootschap van dat concern.

      2 Onder een concern wordt verstaan een vennootschap waarin niet een andere vennootschap het gehele of nagenoeg
      gehele belang heeft, samen met alle andere vennootschappen waarin zij het gehele of nagenoeg gehele belang heeft.

      3 De belasting die door toepassing van [artikel 15, eerste lid, onderdeel h, van de wet][ref2] niet is geheven
      wegens interne reorganisatie is alsnog verschuldigd, indien:

      a. de eerste vennootschap die het gehele of nagenoeg gehele belang heeft in zowel de vennootschap die de
      onroerende zaken verkrijgt als de vennootschap die de onroerende zaken overdraagt, binnen drie jaren na de interne
      reorganisatie geen geheel of nagenoeg geheel belang meer heeft in de vennootschap die de onroerende zaken heeft
      verkregen, waarbij een vennootschap die een geheel of nagenoeg geheel belang heeft in de eerstgenoemde vennootschap
      in de plaats kan treden van deze vennootschap; of

      b. de vennootschap die de onroerende zaken heeft overgedragen binnen drie jaren na de interne reorganisatie
      geen geheel of nagenoeg geheel belang meer heeft in de vennootschap die de onroerende zaken heeft verkregen,
      met dien verstande dat dit onderdeel slechts van toepassing is ingeval er geen vennootschap is die het gehele of
      nagenoeg gehele belang heeft in zowel de vennootschap die de onroerende zaken verkrijgt als de vennootschap die de
      onroerende zaken overdraagt.

      4 De belasting die door toepassing van [artikel 15, eerste lid, onderdeel h, van de wet][ref3] niet is geheven
      wegens interne reorganisatie is alsnog verschuldigd voorzover de overdragende vennootschap tot het concern is gaan
      behoren als gevolg van een andere gebeurtenis dan bedoeld in [artikel 5a, eerste en vijfde lid][ref4], waarbij geen
      overdrachtsbelasting verschuldigd was, indien de onroerende zaken zijn verkregen door die overdragende vennootschap
      vóór de hiervoor bedoelde gebeurtenis en de onderneming of de activiteiten van die vennootschap niet gedurende drie
      jaren binnen het concern zijn voortgezet.

      5 Het derde lid blijft buiten toepassing ingeval de vennootschap die de onroerende zaken verkrijgt op het tijdstip
      van de interne reorganisatie het gehele of nagenoeg gehele belang heeft in de vennootschap die de onroerende zaken
      overdraagt.

      6 Het derde lid blijft buiten toepassing ingeval de onroerende zaken niet meer in het bezit zijn van de
      vennootschap die de onroerende zaken heeft verkregen, tenzij:

      a. de onroerende zaken zijn overgedragen aan een vennootschap binnen het concern en ter zake van deze verkrijging
      geen beroep is gedaan op de vrijstelling als bedoeld in dit artikel;

      b. de onroerende zaken zijn overgedragen aan een vennootschap binnen het concern die het gehele of nagenoeg gehele
      belang heeft in de vennootschap die de onroerende zaken overdraagt; of

      c. de onroerende zaken zijn overgedragen aan een vennootschap buiten het concern en ter zake van deze verkrijging
      geen overdrachtsbelasting verschuldigd was.

      7 Het derde lid blijft buiten toepassing ingeval niet meer aan de in het derde lid bedoelde voorwaarden wordt
      voldaan als gevolg van een juridische fusie binnen het concern, mits de opvolgende verkrijger voor de toepassing
      van het derde lid de resterende periode in de plaats treedt van de verdwijnende vennootschap.

      8 Voor de toepassing van het tweede, derde en vijfde lid dient het gehele of nagenoeg gehele belang
      vertegenwoordigd te worden door het onmiddellijk of middellijk bezit van aandelen.

      9 Voor de toepassing van dit artikel wordt onder vennootschap verstaan de naamloze vennootschap en de besloten
      vennootschap met beperkte aansprakelijkheid. Onder vennootschap wordt mede verstaan de vereniging, coöperatie en
      onderlinge waarborgmaatschappij met een in aandelen verdeeld kapitaal, alsmede een stichting of vereniging zonder
      een in aandelen verdeeld kapitaal indien deze stichting of vereniging een overeenkomstige functie vervult als de
      eerstbedoelde vennootschap in het tweede lid. Tevens wordt daaronder verstaan het lichaam dat naar het recht van
      een andere Staat is opgericht en naar aard en inrichting vergelijkbaar is met een lichaam als bedoeld in dit lid.

      10 Voor de toepassing van dit artikel worden onder onroerende zaken mede verstaan fictieve onroerende zaken als
      bedoeld in [artikel 4, eerste lid, van de wet][ref5], rechten waaraan onroerende zaken of fictieve onroerende zaken
      zijn onderworpen, alsmede de economische eigendom van deze zaken of rechten.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002740#Artikel15
