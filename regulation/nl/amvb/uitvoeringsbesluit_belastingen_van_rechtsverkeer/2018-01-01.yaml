  - number: '2'
    text: |-
      De waarde van een canon, een retributie of een huur als is bedoeld in [artikel 11 van de wet][ref1], wordt bepaald
      met inachtneming van de bij dit besluit behorende bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel11
