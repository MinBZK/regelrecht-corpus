        artikel: '11'
  - number: '4'
    text: |-
      1 De in [artikel 15, eerste lid, onderdeel e, onder 1°, van de wet][ref1] bedoelde vrijstelling bij inbreng
      in een vennootschap die geen in aandelen verdeeld kapitaal heeft, van een onderneming, waaronder mede wordt
      verstaan de onderneming bestaande in een deelgerechtigdheid in een maatschap, vennootschap onder firma of
      commanditaire vennootschap, is van toepassing indien alle tot het ondernemingsvermogen behorende activa en
      passiva die een functie vervullen in de onderneming worden ingebracht tegen bijschrijving op de kapitaalrekening
      van de vennootschap van een bedrag dat ten minste 90 percent is van de waarde in het economische verkeer van het
      vermogen van de ingebrachte onderneming dan wel de boekwaarde van dat vermogen, zoals die geldt voor de heffing van
      inkomstenbelasting of vennootschapsbelasting, in gevallen waarin de ondernemer inbrengt met voorbehoud van stille
      reserves.

      2 In afwijking van het eerste lid is de aldaar bedoelde vrijstelling eveneens van toepassing indien de inbreng
      geen betrekking heeft op een onderneming maar op afzonderlijke onroerende zaken, mits de inbreng volgt op een
      verkrijging als bedoeld in [artikel 15, eerste lid, onderdeel f, onder 1° of 2°, van de wet][ref2], en de
      verkrijging en de inbreng uitsluitend plaatshebben in verband met de toetreding, uittreding of vervanging van
      vennoten, dan wel de toepassing van [artikel 14c van de Wet op de vennootschapsbelasting 1969][ref3]. De in dit lid
      bedoelde onroerende zaken moeten voorafgaand aan bedoelde verkrijging deel hebben uitgemaakt van het vermogen van
      de onderneming van de vennootschap en niet zijn gebruikt of bestemd voor gebruik in het kader van het verkrijgen,
      vervreemden, of exploiteren van onroerende zaken.

      3 De belasting die door toepassing van [artikel 15, eerste lid, onderdeel e, onder 1°, van de wet][ref4] niet
      is geheven ter zake van een inbreng is alsnog verschuldigd, indien de inbrenger binnen drie jaren na de inbreng
      niet meer vennoot is van de vennootschap, dan wel binnen die periode zijn bijschrijving wegens inbreng op de
      kapitaalrekening is verminderd, anders dan door afboeking van zijn aandeel in het verlies van de vennootschap. De
      bepaling is eveneens van toepassing bij het verlenen van een koopoptie op het aandeel of een deel van het aandeel
      van de inbrenger in het vermogen van de vennootschap.

      4 De belasting die door toepassing van [artikel 15, eerste lid, onderdeel e, onder 1°, van de wet][ref5] niet is
      geheven ter zake van een inbreng is alsnog verschuldigd, indien de onderneming niet gedurende een periode van ten
      minste drie jaren na de inbreng door de vennootschap wordt voortgezet.

      5 Het derde en vierde lid blijft buiten toepassing in geval van een inbreng als bedoeld in het eerste lid, dan wel
      een omzetting als bedoeld in [artikel 5][ref6].

      6 Onder kapitaalrekening wordt verstaan de rekening op de balans van de vennootschap waarop de deelgerechtigdheid
      van de vennoot in het vermogen van de vennootschap wordt opgenomen.

      7 Voor de toepassing van dit artikel worden onder onroerende zaken mede verstaan fictieve onroerende zaken als
      bedoeld in [artikel 4, eerste lid, van de wet][ref7], rechten waaraan onroerende zaken of fictieve onroerende zaken
      zijn onderworpen, alsmede de economische eigendom van deze zaken of rechten.


