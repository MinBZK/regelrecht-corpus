  - number: '5'
    text: |-
      1 De in [artikel 15, eerste lid, onderdeel e, onder 2°][ref1], bedoelde vrijstelling bij omzetting van een niet in
      de vorm van een naamloze vennootschap of besloten vennootschap met beperkte aansprakelijkheid gedreven onderneming,
      waaronder mede wordt verstaan de onderneming bestaande in een deelgerechtigdheid in een maatschap, vennootschap
      onder firma of commanditaire vennootschap, in een naamloze vennootschap of besloten vennootschap met beperkte
      aansprakelijkheid is van toepassing indien alle tot het ondernemingsvermogen behorende activa en passiva die een
      functie vervullen in de onderneming worden ingebracht tegen toekenning van aandelen, mits de oprichters van de
      vennootschap in het aandelenkapitaal geheel of nagenoeg geheel in dezelfde verhouding gerechtigd zijn als in het
      vermogen van de omgezette onderneming.

      2 Onder toekenning van aandelen wordt begrepen het geval waarin naast de toekenning van aandelen
      tevens een bedrag in geld wordt betaald van ten hoogste 10 percent van de waarde van hetgeen op
      de aandelen is gestort, met dien verstande dat ingeval de omzetting plaatsvindt met toepassing van
      [artikel 3.65 van de Wet inkomstenbelasting 2001][ref2], dit bedrag kan worden gesteld op het bedrag waarvoor de
      ondernemer op grond van de aan deze toepassing verbonden voorwaarden wordt gecrediteerd.

      3 De belasting die door toepassing van [artikel 15, eerste lid, onderdeel e, onder 2°, van de wet][ref3] niet is
      geheven ter zake van een omzetting is alsnog verschuldigd, indien de inbrenger binnen drie jaren na de omzetting
      niet meer in het bezit is van alle bij of in verband met die omzetting verkregen aandelen. De bepaling is eveneens
      van toepassing bij vervreemding van claims en het verlenen van een koopoptie op de aandelen, alsmede bij een gehele
      of gedeeltelijke terugbetaling van hetgeen op de aandelen is gestort.

      4 De belasting die door toepassing van [artikel 15, eerste lid, onderdeel e, onder 2°, van de wet][ref4] niet is
      geheven ter zake van een omzetting is alsnog verschuldigd, indien de onderneming niet gedurende een periode van ten
      minste drie jaren na de omzetting door de vennootschap wordt voortgezet.

      5 Het derde lid blijft buiten toepassing in geval van vervreemding van de aandelen in het kader van een splitsing
      als bedoeld in [artikel 5c][ref5], dan wel indien ten minste 75 percent van de aandelen van de opgerichte
      vennootschap wordt verkregen door een andere vennootschap tegen toekenning van eigen aandelen, met dien verstande
      dat de toegekende aandelen in de plaats komen van de in het derde lid bedoelde aandelen. Onder toekenning van
      aandelen wordt mede begrepen het geval waarin naast de toekenning van aandelen tevens een bedrag in geld wordt
      betaald van ten hoogste 10 percent van de nominale waarde van de toegekende aandelen.

      6 Het vierde lid blijft buiten toepassing in geval van vervreemding in het kader van een fusie als bedoeld in
      [artikel 5a][ref6], een interne reorganisatie als bedoeld in [artikel 5b][ref7], dan wel een splitsing als bedoeld
      in [artikel 5c][ref8].


