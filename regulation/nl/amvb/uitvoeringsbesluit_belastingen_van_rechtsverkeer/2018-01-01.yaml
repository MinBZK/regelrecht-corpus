  - number: 5c
    text: |-
      1 De in [artikel 15, eerste lid, onderdeel h, van de wet][ref1] bedoelde vrijstelling wegens splitsing is van
      toepassing wanneer sprake is van overgang van vermogen onder algemene titel in het kader van een splitsing van
      een vennootschap met in aandelen verdeeld kapitaal, behoudens in het geval dat de splitsing in overwegende mate
      is gericht op het ontgaan of uitstellen van belastingheffing. De splitsing wordt, tenzij het tegendeel aannemelijk
      wordt gemaakt, geacht in overwegende mate te zijn gericht op het ontgaan of uitstellen van belastingheffing indien
      de splitsing niet plaatsvindt op grond van zakelijke overwegingen zoals herstructurering of rationalisering van
      de actieve werkzaamheden van de splitsende en de verkrijgende rechtspersonen. Indien aandelen in de gesplitste
      rechtspersoon, dan wel in een verkrijgende rechtspersoon binnen drie jaar na de splitsing geheel of ten dele,
      direct of indirect worden vervreemd aan een lichaam dat niet met de gesplitste rechtspersoon en met de verkrijgende
      rechtspersonen is verbonden als bedoeld in [artikel 10a van de Wet op de vennootschapsbelasting 1969][ref2], worden
      zakelijke overwegingen niet aanwezig geacht, tenzij het tegendeel aannemelijk wordt gemaakt.

      2 Voor de toepassing van dit artikel wordt onder vennootschap verstaan de naamloze vennootschap, de besloten
      vennootschap met beperkte aansprakelijkheid, de open commanditaire vennootschap, alsmede andere vennootschappen
      waarvan het kapitaal geheel of ten dele in aandelen is verdeeld. Onder vennootschap wordt mede verstaan de
      vereniging, coöperatie en onderlinge waarborgmaatschappij met een in aandelen verdeeld kapitaal. Tevens wordt
      daaronder verstaan het lichaam dat naar het recht van een andere Staat is opgericht en dat naar aard en inrichting
      vergelijkbaar is met een lichaam als bedoeld in dit lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel15
