  url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Dit besluit verstaat onder wet: [Wet op belastingen van rechtsverkeer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002740
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002740
  - number: '2'
    text: |-
      De waarde van een canon, een retributie of een huur als is bedoeld in [artikel 11 van de wet][ref1], wordt bepaald
      met inachtneming van de bij dit besluit behorende bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel11
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '11'
  - number: '3'
    text: |-
      De termijn van zes maanden, genoemd in [artikel 13, eerste lid, van de wet][ref1], wordt verruimd tot 36 maanden
      indien de vorige verkrijging door een ander heeft plaatsgevonden tussen 31 augustus 2012 en 1 januari 2015.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel13
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '13'
  - number: 3a.1
    text: |-
      De termijn waarbinnen de verkrijging plaatsvindt, bedoeld in [artikel 15, zesde lid, van de wet][ref1], bedraagt 24
      maanden na het tijdstip van de eerste ingebruikneming of de ingangsdatum van de verhuur als deze vóór het tijdstip
      van de eerste ingebruikneming ligt en geldt indien het tijdstip van de eerste ingebruikneming of de ingangsdatum
      van de verhuur als deze vóór het tijdstip van de eerste ingebruikneming ligt, is gelegen tussen 31 oktober 2012 en
      1 januari 2015.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel15
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '15'
  - number: 3a.2
    text: |-
      De verkrijging wordt opgenomen in een notariële akte die wordt verleden binnen de termijn, genoemd in het eerste
      lid, waarbinnen de verkrijging plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel3a
  - number: '4.1'
    text: |-
      De in [artikel 15, eerste lid, onderdeel e, onder 1°, van de wet][ref1] bedoelde vrijstelling bij inbreng in
      een vennootschap die geen in aandelen verdeeld kapitaal heeft, van een onderneming, waaronder mede wordt verstaan
      de onderneming bestaande in een deelgerechtigdheid in een maatschap, vennootschap onder firma of commanditaire
      vennootschap, is van toepassing indien alle tot het ondernemingsvermogen behorende activa en passiva die
      een functie vervullen in de onderneming worden ingebracht tegen bijschrijving op de kapitaalrekening van de
      vennootschap van een bedrag dat ten minste 90 percent is van de waarde in het economische verkeer van het vermogen
      van de ingebrachte onderneming dan wel de boekwaarde van dat vermogen, zoals die geldt voor de heffing van
      inkomstenbelasting of vennootschapsbelasting, in gevallen waarin de ondernemer inbrengt met voorbehoud van stille
      reserves.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel15
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '15'
  - number: '4.2'
    text: |-
      In afwijking van het eerste lid is de aldaar bedoelde vrijstelling eveneens van toepassing indien de inbreng
      geen betrekking heeft op een onderneming maar op afzonderlijke onroerende zaken, mits de inbreng volgt op een
      verkrijging als bedoeld in [artikel 15, eerste lid, onderdeel f, onder 1° of 2°, van de wet][ref1], en de
      verkrijging en de inbreng uitsluitend plaatshebben in verband met de toetreding, uittreding of vervanging van
      vennoten, dan wel de toepassing van [artikel 14c van de Wet op de vennootschapsbelasting 1969][ref2]. De in dit lid
      bedoelde onroerende zaken moeten voorafgaand aan bedoelde verkrijging deel hebben uitgemaakt van het vermogen van
      de onderneming van de vennootschap en niet zijn gebruikt of bestemd voor gebruik in het kader van het verkrijgen,
      vervreemden, of exploiteren van onroerende zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel14c
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 14c
  - number: '4.3'
    text: |-
      De belasting die door toepassing van [artikel 15, eerste lid, onderdeel e, onder 1°, van de wet][ref1] niet
      is geheven ter zake van een inbreng is alsnog verschuldigd, indien de inbrenger binnen drie jaren na de inbreng
      niet meer vennoot is van de vennootschap, dan wel binnen die periode zijn bijschrijving wegens inbreng op de
      kapitaalrekening is verminderd, anders dan door afboeking van zijn aandeel in het verlies van de vennootschap. De
      bepaling is eveneens van toepassing bij het verlenen van een koopoptie op het aandeel of een deel van het aandeel
      van de inbrenger in het vermogen van de vennootschap.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel15
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '15'
  - number: '4.4'
    text: |-
      De belasting die door toepassing van [artikel 15, eerste lid, onderdeel e, onder 1°, van de wet][ref1] niet is
      geheven ter zake van een inbreng is alsnog verschuldigd, indien de onderneming niet gedurende een periode van ten
      minste drie jaren na de inbreng door de vennootschap wordt voortgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel15
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '15'
  - number: '4.5'
    text: |-
      Het derde en vierde lid blijft buiten toepassing in geval van een inbreng als bedoeld in het eerste lid, dan wel
      een omzetting als bedoeld in [artikel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002770#Artikel5
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002770
        artikel: '5'
        hoofdstuk: I
  - number: '4.6'
    text: |-
      Onder kapitaalrekening wordt verstaan de rekening op de balans van de vennootschap waarop de deelgerechtigdheid van
      de vennoot in het vermogen van de vennootschap wordt opgenomen.
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel4
  - number: '4.7'
    text: |-
      Voor de toepassing van dit artikel worden onder onroerende zaken mede verstaan fictieve onroerende zaken als
      bedoeld in [artikel 4, eerste lid, van de wet][ref1], rechten waaraan onroerende zaken of fictieve onroerende zaken
      zijn onderworpen, alsmede de economische eigendom van deze zaken of rechten.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel4
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '4'
  - number: 4a.1
    text: |-
      De in [artikel 15, eerste lid, onderdeel f, onder 2°, van de wet][ref1] bedoelde vrijstelling krachtens
      vereffening van het vermogen van een rechtspersoon is van toepassing wanneer de vereffening plaatsheeft in het
      kader van de voortzetting van een door een vennootschap gedreven onderneming door de aandeelhouders, als bedoeld
      in [artikel 14c van de Wet op de vennootschapsbelasting 1969][ref2]. Onder vennootschap wordt in de vorige
      volzin verstaan de naamloze vennootschap en de besloten vennootschap met beperkte aansprakelijkheid, mits deze
      vennootschappen uitsluitend natuurlijke personen als aandeelhouder hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel14c
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 14c
  - number: 4a.2
    text: |-
      De belasting die door toepassing van [artikel 15, eerste lid, onderdeel f, onder 2°, van de wet][ref1] niet is
      geheven ter zake van een vereffening is alsnog verschuldigd, indien de onderneming niet gedurende een periode van
      ten minste drie jaren na de vereffening door de verkrijger rechtstreeks wordt voortgezet of mede voortgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel15
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '15'
  - number: 4a.3
    text: |-
      Het tweede lid blijft buiten toepassing in geval van inbreng of omzetting van een onderneming, als bedoeld in
      [artikel 15, eerste lid, onderdeel e, onder 1°, onderscheidenlijk onder 2°, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel15
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '15'
  - number: '5.1'
    text: |-
      De in [artikel 15, eerste lid, onderdeel e, onder 2°][ref1], bedoelde vrijstelling bij omzetting van een niet in
      de vorm van een naamloze vennootschap of besloten vennootschap met beperkte aansprakelijkheid gedreven onderneming,
      waaronder mede wordt verstaan de onderneming bestaande in een deelgerechtigdheid in een maatschap, vennootschap
      onder firma of commanditaire vennootschap, in een naamloze vennootschap of besloten vennootschap met beperkte
      aansprakelijkheid is van toepassing indien alle tot het ondernemingsvermogen behorende activa en passiva die een
      functie vervullen in de onderneming worden ingebracht tegen toekenning van aandelen, mits de oprichters van de
      vennootschap in het aandelenkapitaal geheel of nagenoeg geheel in dezelfde verhouding gerechtigd zijn als in het
      vermogen van de omgezette onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0002770#Artikel15
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002770
        artikel: '15'
        hoofdstuk: III
  - number: '5.2'
    text: |-
      Onder toekenning van aandelen wordt begrepen het geval waarin naast de toekenning van aandelen
      tevens een bedrag in geld wordt betaald van ten hoogste 10 percent van de waarde van hetgeen op
      de aandelen is gestort, met dien verstande dat ingeval de omzetting plaatsvindt met toepassing van
      [artikel 3.65 van de Wet inkomstenbelasting 2001][ref1], dit bedrag kan worden gesteld op het bedrag waarvoor de
      ondernemer op grond van de aan deze toepassing verbonden voorwaarden wordt gecrediteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '5.3'
    text: |-
      De belasting die door toepassing van [artikel 15, eerste lid, onderdeel e, onder 2°, van de wet][ref1] niet is
      geheven ter zake van een omzetting is alsnog verschuldigd, indien de inbrenger binnen drie jaren na de omzetting
      niet meer in het bezit is van alle bij of in verband met die omzetting verkregen aandelen. De bepaling is eveneens
      van toepassing bij vervreemding van claims en het verlenen van een koopoptie op de aandelen, alsmede bij een gehele
      of gedeeltelijke terugbetaling van hetgeen op de aandelen is gestort.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel15
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '15'
  - number: '5.4'
    text: |-
      De belasting die door toepassing van [artikel 15, eerste lid, onderdeel e, onder 2°, van de wet][ref1] niet is
      geheven ter zake van een omzetting is alsnog verschuldigd, indien de onderneming niet gedurende een periode van ten
      minste drie jaren na de omzetting door de vennootschap wordt voortgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel15
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '15'
  - number: '5.5'
    text: |-
      Het derde lid blijft buiten toepassing in geval van vervreemding van de aandelen in het kader van een splitsing als
      bedoeld in [artikel 5c][ref1], dan wel indien ten minste 75 percent van de aandelen van de opgerichte vennootschap
      wordt verkregen door een andere vennootschap tegen toekenning van eigen aandelen, met dien verstande dat de
      toegekende aandelen in de plaats komen van de in het derde lid bedoelde aandelen. Onder toekenning van aandelen
      wordt mede begrepen het geval waarin naast de toekenning van aandelen tevens een bedrag in geld wordt betaald van
      ten hoogste 10 percent van de nominale waarde van de toegekende aandelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002770#Artikel5c
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002770
        artikel: 5c
        hoofdstuk: I
  - number: '5.6'
    text: |-
      Het vierde lid blijft buiten toepassing in geval van vervreemding in het kader van een fusie als bedoeld in
      [artikel 5a][ref1], een interne reorganisatie als bedoeld in [artikel 5b][ref2], dan wel een splitsing als bedoeld
      in [artikel 5c][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002770#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0002770#Artikel5b
      [ref3]: https://wetten.overheid.nl/BWBR0002770#Artikel5c
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002770
        artikel: 5a
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002770
        artikel: 5b
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0002770
        artikel: 5c
        hoofdstuk: I
  - number: 5bis.1
    text: |-
      De in [artikel 15, eerste lid, onderdeel h, van de wet][ref1] bedoelde vrijstelling wegens fusie is van toepassing
      bij overgang van vermogen onder algemene titel in het kader van een juridische fusie tussen rechtspersonen, mits
      die fusie hoofdzakelijk plaatsvindt op grond van zakelijke overwegingen. De eerste volzin blijft buiten toepassing
      in geval van een fusie waarop [artikel 5b, eerste lid][ref2], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002770#Artikel5b
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5bis
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002770
        artikel: 5b
        hoofdstuk: I
  - number: 5bis.2
    text: |-
      De in [artikel 15, eerste lid, onderdeel h, van de wet][ref1] bedoelde vrijstelling wegens fusie is niet van
      toepassing dan wel de belasting die door toepassing van artikel 15, eerste lid, onderdeel h, van de wet niet is
      geheven is alsnog verschuldigd, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel15
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5bis
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '15'
  - number: 5bis.2.a
    text: |-
      een aandeelhouder van een verdwijnende rechtspersoon, welke rechtspersoon op het tijdstip van de fusie kwalificeert
      als een rechtspersoon als bedoeld in [artikel 4, eerste lid, onderdeel a, van de wet][ref1], op dat tijdstip
      of op enig tijdstip in het daaraan voorafgaande jaar, al dan niet tezamen met een tot hetzelfde concern als
      gedefinieerd in [artikel 5b, tweede lid][ref2], behorend lichaam, een belang van ten minste een derde gedeelte in
      de verdwijnende rechtspersoon bezit of heeft bezeten, daarvoor als gevolg van de fusie geen in de plaats komend
      soortgelijk belang in de verkrijgende rechtspersoon of een groepsmaatschappij daarvan verkrijgt, dan wel dat
      soortgelijk belang binnen drie jaren na de fusie geheel of ten dele vervreemdt;


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002770#Artikel5b
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5bis
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0002770
        artikel: 5b
        hoofdstuk: I
  - number: 5bis.2.b
    text: |-
      een aandeelhouder van de verkrijgende rechtspersoon, welke rechtspersoon op het tijdstip van de fusie kwalificeert
      als een rechtspersoon als bedoeld in [artikel 4, eerste lid, onderdeel a, van de wet][ref1], op dat tijdstip
      of op enig tijdstip in het daaraan voorafgaande jaar, al dan niet tezamen met een tot hetzelfde concern als
      gedefinieerd in [artikel 5b, tweede lid][ref2], behorend lichaam, een belang van ten minste een derde gedeelte in
      de verkrijgende rechtspersoon bezit of heeft bezeten, dat belang binnen drie jaren na de fusie geheel of ten dele
      vervreemdt;


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002770#Artikel5b
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5bis
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0002770
        artikel: 5b
        hoofdstuk: I
  - number: 5bis.2.c
    text: |-
      een aandeelhouder van een verdwijnende rechtspersoon als gevolg van de fusie een belang van ten minste
      een derde gedeelte in de verkrijgende rechtspersoon of een groepsmaatschappij daarvan, welke rechtspersoon
      of groepsmaatschappij als gevolg van de fusie kwalificeert als een rechtspersoon als bedoeld in
      [artikel 4, eerste lid, onderdeel a, van de wet][ref1], verkrijgt en dat belang binnen drie jaren na de fusie
      geheel of ten dele vervreemdt;


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel4
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5bis
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '4'
  - number: 5bis.2.d
    text: |-
      een aandeelhouder van de verkrijgende rechtspersoon of van een groepsmaatschappij daarvan als gevolg van de fusie
      een belang van ten minste een derde gedeelte in de verkrijgende rechtspersoon of de groepsmaatschappij daarvan,
      welke rechtspersoon of groepsmaatschappij als gevolg van de fusie kwalificeert als een rechtspersoon als bedoeld in
      [artikel 4, eerste lid, onderdeel a, van de wet][ref1], bezit en dat belang binnen drie jaren na de fusie geheel of
      ten dele vervreemdt.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel4
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5bis
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '4'
  - number: 5bis.3
    text: |-
      De belasting die door toepassing van [artikel 15, eerste lid, onderdeel h, van de wet][ref1] niet is geheven ter
      zake van een fusie is alsnog verschuldigd, indien de activiteiten van de fuserende rechtspersonen niet gedurende
      een periode van ten minste drie jaren na de fusie door de verkrijgende rechtspersoon in haar geheel worden
      voortgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel15
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5bis
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '15'
  - number: 5bis.4
    text: |-
      Het tweede lid blijft buiten toepassing in geval van een vervreemding van het belang in het kader van een
      geruisloze terugkeer als bedoeld in [artikel 4a][ref1], een juridische fusie als bedoeld in dit artikel, een
      bedrijfsfusie als bedoeld in [artikel 5a][ref2], een interne reorganisatie als bedoeld in [artikel 5b][ref3],
      een splitsing als bedoeld in [artikel 5c][ref4], dan wel indien ten minste 75 percent van de aandelen van de
      verkrijgende vennootschap wordt verkregen door een andere vennootschap tegen toekenning van eigen aandelen,
      waaronder mede wordt begrepen het geval waarin naast toekenning van aandelen tevens een bedrag in geld wordt
      betaald van ten hoogste 10 percent van hetgeen op de aandelen is gestort. De eerste volzin is slechts van
      toepassing indien het toegekende belang in de plaats komt van het in het tweede lid bedoelde belang dan wel het in
      het tweede lid bedoelde belang de resterende periode in het bezit blijft bij de opvolgende verkrijger.


      [ref1]: https://wetten.overheid.nl/BWBR0002770#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0002770#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0002770#Artikel5b
      [ref4]: https://wetten.overheid.nl/BWBR0002770#Artikel5c
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5bis
    references:
      - id: ref1
        bwb_id: BWBR0002770
        artikel: 4a
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002770
        artikel: 5a
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0002770
        artikel: 5b
        hoofdstuk: I
      - id: ref4
        bwb_id: BWBR0002770
        artikel: 5c
        hoofdstuk: I
  - number: 5bis.5
    text: |-
      Het derde lid blijft buiten toepassing in geval van vervreemding van de activiteiten in het kader van een inbreng
      als bedoeld in [artikel 4][ref1], een geruisloze terugkeer als bedoeld in [artikel 4a][ref2], een juridische fusie
      als bedoeld in dit artikel, een bedrijfsfusie als bedoeld in [artikel 5a][ref3], een interne reorganisatie als
      bedoeld in [artikel 5b][ref4], een splitsing als bedoeld in [artikel 5c][ref5], mits de in het derde lid bedoelde
      activiteiten gedurende de resterende periode door de opvolgende verkrijger worden voortgezet. In geval van een
      inbreng als bedoeld in artikel 4 is de eerste volzin slechts van toepassing indien het ter zake van de inbreng
      verkregen belang in de vennootschap de resterende periode blijft behouden.


      [ref1]: https://wetten.overheid.nl/BWBR0002770#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002770#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0002770#Artikel5a
      [ref4]: https://wetten.overheid.nl/BWBR0002770#Artikel5b
      [ref5]: https://wetten.overheid.nl/BWBR0002770#Artikel5c
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5bis
    references:
      - id: ref1
        bwb_id: BWBR0002770
        artikel: '4'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002770
        artikel: 4a
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0002770
        artikel: 5a
        hoofdstuk: I
      - id: ref4
        bwb_id: BWBR0002770
        artikel: 5b
        hoofdstuk: I
      - id: ref5
        bwb_id: BWBR0002770
        artikel: 5c
        hoofdstuk: I
  - number: 5bis.6
    text: |-
      Het vierde en het vijfde lid blijven buiten toepassing ingeval de daargenoemde gebeurtenissen in samenhang met de
      juridische fusie in overwegende mate gericht zijn op het ontgaan van belastingheffing.
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5bis
  - number: 5bis.7
    text: |-
      De in [artikel 15, eerste lid, onderdeel h, van de wet][ref1] bedoelde vrijstelling is eveneens van toepassing
      op uit de fusie voortvloeiende verkrijgingen van een belang in een verkrijgende rechtspersoon of een
      groepsmaatschappij daarvan, welke rechtspersoon of groepsmaatschappij kwalificeert als een lichaam als bedoeld in
      [artikel 4, eerste lid, onderdeel a, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002740#Artikel4
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5bis
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002740
        artikel: '4'
  - number: 5bis.8
    text: |-
      Voor de toepassing van dit artikel wordt onder rechtspersoon verstaan de naamloze vennootschap, de besloten
      vennootschap met beperkte aansprakelijkheid, de vereniging met volledige rechtsbevoegdheid, de coöperatie, de
      onderlinge waarborgmaatschappij, alsmede de stichting. Onder rechtspersoon wordt mede verstaan het lichaam dat naar
      het recht van een andere Staat is opgericht en naar aard en inrichting vergelijkbaar is met een lichaam als bedoeld
      in dit lid.
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5bis
  - number: 5a.1
    text: |-
      De in [artikel 15, eerste lid, onderdeel h, van de wet][ref1] bedoelde vrijstelling wegens fusie is van toepassing
      indien een vennootschap uitsluitend de gehele onderneming of een zelfstandig onderdeel daarvan van een andere
      vennootschap verkrijgt tegen toekenning van aandelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel15
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '15'
  - number: 5a.2
    text: |-
      Onder toekenning van aandelen wordt begrepen het geval waarin naast de toekenning van aandelen tevens een bedrag in
      geld wordt betaald van ten hoogste 10 percent van de waarde van hetgeen op de aandelen is gestort.
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5a
  - number: 5a.3
    text: |-
      De belasting die door toepassing van [artikel 15, eerste lid, onderdeel h, van de wet][ref1] niet is geheven ter
      zake van een fusie is alsnog verschuldigd, indien de inbrengende vennootschap binnen drie jaren na de fusie niet
      meer in het bezit is van alle bij of in verband met die fusie verkregen aandelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel15
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '15'
  - number: 5a.4
    text: |-
      De belasting die door toepassing van [artikel 15, eerste lid, onderdeel h, van de wet][ref1] niet is geheven ter
      zake van een fusie is alsnog verschuldigd, indien de onderneming niet gedurende een periode van ten minste drie
      jaren na de fusie door de verkrijgende vennootschap wordt voortgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel15
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '15'
  - number: 5a.5
    text: |-
      Het derde lid blijft buiten toepassing in geval van vervreemding van de aandelen in het kader van een interne
      reorganisatie als bedoeld in [artikel 5b][ref1], een splitsing als bedoeld in [artikel 5c][ref2], dan wel indien
      ten minste 75 percent van de aandelen van de vennootschap die de in het eerste lid bedoelde aandelen heeft
      toegekend, wordt verkregen door een andere vennootschap tegen toekenning van eigen aandelen, met dien verstande dat
      de toegekende aandelen in de plaats komen van de in het derde lid bedoelde aandelen. Onder toekenning van aandelen
      wordt mede begrepen het geval waarin naast de toekenning van aandelen tevens een bedrag in geld wordt betaald van
      ten hoogste 10 percent van de nominale waarde van de toegekende aandelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002770#Artikel5b
      [ref2]: https://wetten.overheid.nl/BWBR0002770#Artikel5c
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0002770
        artikel: 5b
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002770
        artikel: 5c
        hoofdstuk: I
  - number: 5a.6
    text: |-
      Het vierde lid blijft buiten toepassing in geval van vervreemding van de onderneming in het kader van een fusie
      als bedoeld in dit artikel, een interne reorganisatie als bedoeld in [artikel 5b][ref1], dan wel een splitsing als
      bedoeld in [artikel 5c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002770#Artikel5b
      [ref2]: https://wetten.overheid.nl/BWBR0002770#Artikel5c
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0002770
        artikel: 5b
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002770
        artikel: 5c
        hoofdstuk: I
  - number: 5a.7
    text: |-
      Voor de toepassing van dit artikel wordt onder vennootschap verstaan de naamloze vennootschap, de besloten
      vennootschap met beperkte aansprakelijkheid, de open commanditaire vennootschap, alsmede andere vennootschappen
      welker kapitaal geheel of ten dele in aandelen is verdeeld. Onder vennootschap wordt mede verstaan de vereniging,
      coöperatie en onderlinge waarborgmaatschappij met een in aandelen verdeeld kapitaal. Tevens wordt daaronder
      verstaan het lichaam dat naar het recht van een andere Staat is opgericht en naar aard en inrichting vergelijkbaar
      is met een lichaam als bedoeld in dit lid.
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5a
  - number: 5b.1
    text: |-
      De in [artikel 15, eerste lid, onderdeel h][ref1], bedoelde vrijstelling wegens interne reorganisatie is
      van toepassing indien een tot het concern behorende vennootschap onroerende zaken overdraagt aan een andere
      vennootschap van dat concern.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel15
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '15'
  - number: 5b.2
    text: |-
      Onder een concern wordt verstaan een vennootschap waarin niet een andere vennootschap het gehele of nagenoeg gehele
      belang heeft, samen met alle andere vennootschappen waarin zij het gehele of nagenoeg gehele belang heeft.
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5b
  - number: 5b.3
    text: |-
      De belasting die door toepassing van [artikel 15, eerste lid, onderdeel h, van de wet][ref1] niet is geheven wegens
      interne reorganisatie is alsnog verschuldigd, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel15
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '15'
  - number: 5b.3.a
    text: |-
      de eerste vennootschap die het gehele of nagenoeg gehele belang heeft in zowel de vennootschap die de onroerende
      zaken verkrijgt als de vennootschap die de onroerende zaken overdraagt, binnen drie jaren na de interne
      reorganisatie geen geheel of nagenoeg geheel belang meer heeft in de vennootschap die de onroerende zaken heeft
      verkregen, waarbij een vennootschap die een geheel of nagenoeg geheel belang heeft in de eerstgenoemde vennootschap
      in de plaats kan treden van deze vennootschap; of
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5b
  - number: 5b.3.b
    text: |-
      de vennootschap die de onroerende zaken heeft overgedragen binnen drie jaren na de interne reorganisatie geen
      geheel of nagenoeg geheel belang meer heeft in de vennootschap die de onroerende zaken heeft verkregen, met
      dien verstande dat dit onderdeel slechts van toepassing is ingeval er geen vennootschap is die het gehele of
      nagenoeg gehele belang heeft in zowel de vennootschap die de onroerende zaken verkrijgt als de vennootschap die de
      onroerende zaken overdraagt.
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5b
  - number: 5b.4
    text: |-
      De belasting die door toepassing van [artikel 15, eerste lid, onderdeel h, van de wet][ref1] niet is geheven
      wegens interne reorganisatie is alsnog verschuldigd voorzover de overdragende vennootschap tot het concern is gaan
      behoren als gevolg van een andere gebeurtenis dan bedoeld in [artikel 5a, eerste en vijfde lid][ref2], waarbij geen
      overdrachtsbelasting verschuldigd was, indien de onroerende zaken zijn verkregen door die overdragende vennootschap
      vóór de hiervoor bedoelde gebeurtenis en de onderneming of de activiteiten van die vennootschap niet gedurende drie
      jaren binnen het concern zijn voortgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002770#Artikel5a
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002770
        artikel: 5a
        hoofdstuk: I
  - number: 5b.5
    text: |-
      Het derde lid blijft buiten toepassing ingeval de vennootschap die de onroerende zaken verkrijgt op het tijdstip
      van de interne reorganisatie het gehele of nagenoeg gehele belang heeft in de vennootschap die de onroerende zaken
      overdraagt.
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5b
  - number: 5b.6
    text: |-
      Het derde lid blijft buiten toepassing ingeval de onroerende zaken niet meer in het bezit zijn van de vennootschap
      die de onroerende zaken heeft verkregen, tenzij:
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5b
  - number: 5b.6.a
    text: |-
      de onroerende zaken zijn overgedragen aan een vennootschap binnen het concern en ter zake van deze verkrijging geen
      beroep is gedaan op de vrijstelling als bedoeld in dit artikel;
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5b
  - number: 5b.6.b
    text: |-
      de onroerende zaken zijn overgedragen aan een vennootschap binnen het concern die het gehele of nagenoeg gehele
      belang heeft in de vennootschap die de onroerende zaken overdraagt; of
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5b
  - number: 5b.6.c
    text: |-
      de onroerende zaken zijn overgedragen aan een vennootschap buiten het concern en ter zake van deze verkrijging geen
      overdrachtsbelasting verschuldigd was.
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5b
  - number: 5b.7
    text: |-
      Het derde lid blijft buiten toepassing ingeval niet meer aan de in het derde lid bedoelde voorwaarden wordt voldaan
      als gevolg van een juridische fusie binnen het concern, mits de opvolgende verkrijger voor de toepassing van het
      derde lid de resterende periode in de plaats treedt van de verdwijnende vennootschap.
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5b
  - number: 5b.8
    text: |-
      Voor de toepassing van het tweede, derde en vijfde lid dient het gehele of nagenoeg gehele belang vertegenwoordigd
      te worden door het onmiddellijk of middellijk bezit van aandelen.
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5b
  - number: 5b.9
    text: |-
      Voor de toepassing van dit artikel wordt onder vennootschap verstaan de naamloze vennootschap, de besloten
      vennootschap met beperkte aansprakelijkheid, de open commanditaire vennootschap, alsmede andere vennootschappen
      welker kapitaal geheel of ten dele in aandelen is verdeeld. Onder vennootschap wordt mede verstaan de vereniging,
      coöperatie en onderlinge waarborgmaatschappij met een in aandelen verdeeld kapitaal, alsmede een stichting of
      vereniging zonder een in aandelen verdeeld kapitaal indien deze stichting of vereniging een overeenkomstige functie
      vervult als de eerstbedoelde vennootschap in het tweede lid. Tevens wordt daaronder verstaan het lichaam dat naar
      het recht van een andere Staat is opgericht en naar aard en inrichting vergelijkbaar is met een lichaam als bedoeld
      in dit lid.
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5b
  - number: 5b.10
    text: |-
      Voor de toepassing van dit artikel worden onder onroerende zaken mede verstaan fictieve onroerende zaken als
      bedoeld in [artikel 4, eerste lid, van de wet][ref1], rechten waaraan onroerende zaken of fictieve onroerende zaken
      zijn onderworpen, alsmede de economische eigendom van deze zaken of rechten.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel4
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '4'
  - number: 5c.1
    text: |-
      De in [artikel 15, eerste lid, onderdeel h, van de wet][ref1] bedoelde vrijstelling wegens splitsing is van
      toepassing wanneer sprake is van overgang van vermogen onder algemene titel in het kader van een splitsing van
      een vennootschap met in aandelen verdeeld kapitaal, behoudens in het geval dat de splitsing in overwegende mate
      is gericht op het ontgaan of uitstellen van belastingheffing. De splitsing wordt, tenzij het tegendeel aannemelijk
      wordt gemaakt, geacht in overwegende mate te zijn gericht op het ontgaan of uitstellen van belastingheffing indien
      de splitsing niet plaatsvindt op grond van zakelijke overwegingen zoals herstructurering of rationalisering van
      de actieve werkzaamheden van de splitsende en de verkrijgende rechtspersonen. Indien aandelen in de gesplitste
      rechtspersoon, dan wel in een verkrijgende rechtspersoon binnen drie jaar na de splitsing geheel of ten dele,
      direct of indirect worden vervreemd aan een lichaam dat niet met de gesplitste rechtspersoon en met de verkrijgende
      rechtspersonen is verbonden als bedoeld in [artikel 10a van de Wet op de vennootschapsbelasting 1969][ref2], worden
      zakelijke overwegingen niet aanwezig geacht, tenzij het tegendeel aannemelijk wordt gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5c
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 10a
  - number: 5c.2
    text: |-
      Voor de toepassing van dit artikel wordt onder vennootschap verstaan de naamloze vennootschap, de besloten
      vennootschap met beperkte aansprakelijkheid, de open commanditaire vennootschap, alsmede andere vennootschappen
      waarvan het kapitaal geheel of ten dele in aandelen is verdeeld. Onder vennootschap wordt mede verstaan de
      vereniging, coöperatie en onderlinge waarborgmaatschappij met een in aandelen verdeeld kapitaal. Tevens wordt
      daaronder verstaan het lichaam dat naar het recht van een andere Staat is opgericht en dat naar aard en inrichting
      vergelijkbaar is met een lichaam als bedoeld in dit lid.
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5c
  - number: 5d.1
    text: |-
      De in [artikel 15, eerste lid, onderdeel h, van de wet][ref1] bedoelde vrijstelling is op een verkrijging door een
      instelling of vereniging als bedoeld in [artikel 6.33, onderdelen b en c, van de Wet inkomstenbelasting 2001][ref2]
      van toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5d
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '6'
  - number: 5d.1.a
    text: |-
      bij een juridische fusie tussen twee of meer van deze instellingen of verenigingen, indien in het kader daarvan
      alle activa en passiva van één of meer van de verdwijnende instellingen of verenigingen onder algemene titel
      overgaan op de verkrijgende instelling of vereniging of op een in het kader van de fusie nieuw opgerichte
      dergelijke instelling of vereniging, mits bij de overgang commerciële factoren geen rol spelen;
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5d
  - number: 5d.1.b
    text: |-
      bij een taakoverdracht tussen twee of meer van deze instellingen of verenigingen, indien in het kader daarvan alle
      activa en passiva die betrekking hebben op de overgedragen taak aan de verkrijgende instelling of vereniging worden
      overgedragen, mits bij de overdracht commerciële factoren geen rol spelen.
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5d
  - number: 5d.2
    text: |-
      De vrijstelling is niet van toepassing op de verkrijging indien de overdracht uitsluitend de exploitatie van
      onroerende zaken inhoudt of de afzonderlijke overdracht van onroerende zaken betreft of als de onroerende zaken
      niet worden aangewend voor de overgedragen taak.
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5d
  - number: 5d.3
    text: |-
      De belasting die door toepassing van [artikel 15, eerste lid, onderdeel h, van de wet][ref1] niet is geheven,
      is alsnog verschuldigd indien de verkrijgende instelling of vereniging binnen drie jaren na de fusie of
      taakoverdracht niet meer bestaat of niet meer aangemerkt wordt als een instelling of vereniging als bedoeld in
      [artikel 6.33, onderdelen b en c, van de Wet inkomstenbelasting 2001][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5d
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '6'
  - number: 5d.4
    text: |-
      Het derde lid blijft buiten toepassing indien een verkrijgende instelling of vereniging niet langer als instelling
      of vereniging als bedoeld in [artikel 6.33, onderdelen b en c, van de Wet inkomstenbelasting 2001][ref1] wordt
      aangemerkt als gevolg van een juridische fusie als bedoeld in het eerste lid, onderdeel a, of als gevolg van een
      taakoverdracht als bedoeld in het eerste lid, onderdeel b, voor zover de belasting betrekking heeft op onroerende
      zaken die in het kader van deze juridische fusie zijn overgegaan of in het kader van deze taakoverdracht zijn
      overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel5d
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
  - number: 6a
    text: |-
      Onder natuurgrond als bedoeld in [artikel 15, eerste lid, onderdeel s, van de wet][ref1],
      wordt verstaan grond bezet met houtopstanden en natuurterreinen als bedoeld in
      [artikel 1, eerste lid, onderdelen b en d, en tweede lid, van het Rangschikkingsbesluit Natuurschoonwet 1928][ref2]
      .


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0004914#Artikel1
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0004914
        artikel: '1'
  - number: '7.1'
    text: |-
      Met betrekking tot de belasting ter zake van een verkrijging van andere goederen dan bedoeld in
      [artikel 4, eerste lid, onderdelen a en b, van de wet][ref1], waarvan een onderhandse akte is opgemaakt op de voet
      van artikel II van de wet van 28 juni 1956 (*Stb.* 376), wordt aangifte gedaan door het aanbieden van die akte
      ter registratie. Het verschuldigde bedrag aan overdrachtsbelasting wordt vermeld in een aan de voet van de akte
      gestelde, door de verkrijger of namens deze door de persoon die de akte heeft opgesteld, ondertekende verklaring.
      Voor zover in de akte niet alle gegevens voorkomen waarvan kennisneming van belang kan zijn voor de heffing van de
      belasting, dienen deze te worden opgenomen in die verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel4
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '4'
  - number: '7.2'
    text: |-
      Ten aanzien van de inhoud van de akte, voor zover deze van belang is voor de heffing van de belasting, en de in het
      eerste lid bedoelde verklaring, zijn de wettelijke bepalingen met betrekking tot de aangifte van overeenkomstige
      toepassing als vormden die akte en verklaring te zamen de door de verkrijger gedane aangifte.
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel7
  - number: '7.3'
    text: |-
      De persoon die de in het eerste lid bedoelde akte heeft opgesteld, is hoofdelijk aansprakelijk voor de belasting
      welke is verschuldigd wegens de verkrijging waarvan de akte is opgemaakt, zulks tot het bedrag dat ingevolge de
      inhoud van die akte is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel7
  - number: 9a.1
    text: 'Het verzoek om een vergunning voor een fiscaal vertegenwoordiger bevat de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel9a
  - number: 9a.1.a
    text: naam, adres en woon- of vestigingsplaats van de verzoeker;
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel9a
  - number: 9a.1.b
    text: het beoogde tijdstip van aanvang van het fiscaal vertegenwoordigerschap; en
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel9a
  - number: 9a.1.c
    text: naam, adres en woon- of vestigingsplaats van de verzekeraar die niet in Nederland woont of is gevestigd.
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel9a
  - number: 9a.2
    text: 'Een vergunning voor een fiscaal vertegenwoordiger wordt slechts verleend indien de verzoeker:'
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel9a
  - number: 9a.2.a
    text: in Nederland woont of is gevestigd;
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel9a
  - number: 9a.2.b
    text: |-
      in de afgelopen vijf jaren niet wegens overtreding van de wettelijke bepalingen inzake rijksbelastingen
      onherroepelijk is veroordeeld; en
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel9a
  - number: 9a.2.c
    text: naar het oordeel van de inspecteur voldoende solvabel is.
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel9a
  - number: 9a.3
    text: |-
      De verlening van een vergunning voor een fiscaal vertegenwoordiger is tevens gebonden aan de voorwaarde dat de
      verzoeker optreedt voor alle verzekeringen waarvoor assurantiebelasting is verschuldigd van de verzekeraar die niet
      in Nederland woont of is gevestigd.
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel9a
  - number: 9a.4
    text: 'De inspecteur kan de vergunning intrekken of wijzigen:'
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel9a
  - number: 9a.4.a
    text: |-
      op verzoek van de fiscaal vertegenwoordiger met schriftelijke instemming van de verzekeraar die niet in Nederland
      woont of is gevestigd;
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel9a
  - number: 9a.4.b
    text: op verzoek van de verzekeraar die niet in Nederland woont of is gevestigd; of
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel9a
  - number: 9a.4.c
    text: indien de fiscaal vertegenwoordiger niet meer voldoet aan de voorwaarden waaronder de vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel9a
  - number: 9a.5
    text: |-
      De verzekeraar die niet in Nederland woont of is gevestigd wordt van de intrekking of wijziging van de vergunning
      in kennis gesteld, alsmede van de gronden waarop deze berust.
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel9a
  - number: '19.1'
    text: Dit besluit treedt in werking met ingang van 1 januari 1972.
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel19
  - number: '19.2'
    text: Dit besluit kan worden aangehaald als Uitvoeringsbesluit belastingen van rechtsverkeer.
    url: https://wetten.overheid.nl/BWBR0002770/2013-07-01#Artikel19
