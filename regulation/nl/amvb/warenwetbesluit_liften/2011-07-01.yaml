    text: |-
      Door de Arbeidsinspectie op grond van [artikel 11 van de Wet op de gevaarlijke werktuigen][ref1] verleende
      ontheffingen van het [Liftenbesluit I][ref2] ten aanzien van liften en bouwliften voor personenvervoer berusten na
      de inwerkingtreding van dit besluit op [artikel 16, tweede lid, van de wet][ref3].


