---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: warenwetbesluit_liften
regulatory_layer: AMVB
publication_date: '2008-06-27'
valid_from: '2011-07-01'
bwb_id: BWBR0008212
url: https://wetten.overheid.nl/BWBR0008212/2011-07-01
preamble:
  text: |-
    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 23 april 1996, Directie
    Arbeidsomstandigheden, nr. ARBO/APM/96/00974, gedaan in overeenstemming met Onze Minister van Economische Zaken en
    de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Gelet op richtlijn nr. 95/16/EG van het Europees Parlement en de Raad van de Europese Unie van 29 juni 1995 inzake
    de onderlinge aanpassing van de wetgevingen der Lid-Staten betreffende liften (PbEG L 213);

    Gelet op de artikelen 1, eerste lid, aanhef, en onderdelen a en b, 2, 3, eerste en tweede lid, 6, 12, derde lid,
    en 25a van de Wet op de gevaarlijke werktuigen, artikel 9, eerste lid, onder a, van de Mijnwet 1903 en artikel 26,
    eerste lid, onder b, van de Mijnwet continentaal plat, alsmede de artikelen 2 en 120 van de Woningwet;

    De Raad van State gehoord (advies van 21 juni 1996, nr. W12.96.0174);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 15 augustus 1996,
    Directie Arbeidsomstandigheden, nr. ARBO/APM/96/01500, uitgebracht in overeenstemming met Onze Minister van
    Economische Zaken en de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel1
  - number: 1.a
    text: |-
      wet: [Warenwet][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0001969
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001969
  - number: 1.b
    text: |-
      richtlijn: [richtlijn nr. 95/16/EG](31995L0016) van het Europees Parlement en de Raad van de Europese Unie van 29
      juni 1995 inzake de onderlinge aanpassing van de wetgevingen der Lid-Staten betreffende liften (PbEG L 213);
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel1
  - number: 1.c
    text: |-
      lift: een vast opgesteld hijs- of hefwerktuig in een gebouw of bouwwerk dat bepaalde niveaus bedient met behulp van
      een drager die langs starre, ten opzichte van het horizontale vlak meer dan 15 graden hellende geleiders beweegt of
      op een andere manier een vaste baan volgt, en dat bestemd is voor vervoer van: - personen,
        - personen en goederen;
        - alleen goederen indien de drager toegankelijk is, dat wil zeggen een persoon het zonder probleem kan betreden, en
      het is uitgerust met bedieningsapparatuur in de drager of binnen bereik van een persoon in de drager;
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel1
  - number: 1.d
    text: |-
      drager: een deel van een lift waarop personen of goederen zich bevinden om naar boven of beneden te worden
      gebracht;
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel1
  - number: 1.e
    text: |-
      modellift: een representatieve lift waarvan het technisch dossier laat zien hoe de in bijlage I van de richtlijn
      opgenomen essentiële veiligheids- en gezondheidseisen in acht worden genomen voor liften die zijn afgeleid van het
      met behulp van objectieve parameters gedefinieerde model en in welke liften identieke veiligheidscomponenten worden
      gebruikt;
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel1
  - number: 1.f
    text: |-
      veiligheidscomponenten: de in bijlage IV van de richtlijn genoemde onderdelen van liften die essentieel zijn voor
      de veilige werking;
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel1
  - number: 1.g
    text: |-
      Europese Economische Ruimte: het grondgebied waarop de Overeenkomst betreffende de Europese Economische Ruimte van
      toepassing is;
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel1
  - number: 1.h
    text: |-
      aangewezen aangemelde instelling: een krachtens [artikel 7a van de wet][ref1] in het kader van de richtlijn
      aangewezen en bij de Commissie van de Europese Gemeenschappen aangemelde instelling, dan wel een door een andere
      staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte in het kader van de richtlijn
      aangewezen en bij de Commissie van de Europese Gemeenschappen aangemelde instantie;


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel7a
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 7a
  - number: 1.i
    text: |-
      aangewezen instelling: een krachtens [artikel 7a van de wet][ref1] met betrekking tot de keuring van liften
      aangewezen instelling;


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel7a
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 7a
  - number: 1.j
    text: |-
      N, NEN of NEN-EN: door de Stichting Nederlands Normalisatie-Instituut uitgegeven norm, onderscheidenlijk Europese
      norm.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel1
  - number: '2'
    text: Voor de toepassing van dit besluit is een kooi betreedbaar indien een persoon er zonder moeite kan binnengaan.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel2
  - number: '3'
    text: |-
      Dit besluit en de daarop berustende bepalingen zijn eveneens van toepassing op liften en veiligheidscomponenten
      indien deze onroerend zijn.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel3
  - number: '4'
    text: 'Dit besluit is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel4
  - number: 4.a
    text: hijs- en hefwerktuigen met een snelheid van 0,15 m/s of minder;
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel4
  - number: 4.b
    text: bouwliften;
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel4
  - number: 4.c
    text: kabelinstallaties, met inbegrip van kabelsporen;
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel4
  - number: 4.d
    text: liften die speciaal zijn ontworpen en gebouwd voor militaire of politiële doeleinden;
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel4
  - number: 4.e
    text: hijs- en hefwerktuigen van waaruit werkzaamheden verricht kunnen worden;
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel4
  - number: 4.f
    text: mijnliften;
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel4
  - number: 4.g
    text: hijs- en hefwerktuigen voor het heffen van kunstenaars tijdens een optreden;
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel4
  - number: 4.h
    text: hijs- en hefwerktuigen die in vervoermiddelen zijn ingebouwd;
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel4
  - number: 4.i
    text: |-
      hijs- en hefwerktuigen die met een machine zijn verbonden en uitsluitend bestemd zijn om toegang tot de
      arbeidsplaats, inclusief onderhouds- en inspectiepunten op de machine, mogelijk te maken;
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel4
  - number: 4.j
    text: tandradbanen, en
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel4
  - number: 4.k
    text: roltrappen en rolpaden.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel4
  - number: 4b.1
    text: |-
      Het is verboden liften en veiligheidscomponenten te verhandelen, in bedrijf te stellen of te gebruiken, die
      niet voldoen aan de ten aanzien van de desbetreffende hefwerktuigen bij of krachtens dit besluit gestelde
      vervaardigingsvoorschriften.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel4b
  - number: 4b.2
    text: |-
      Het is verboden liften en veiligheidscomponenten te verhandelen of te gebruiken anders dan met inachtneming van de
      ten aanzien van de desbetreffende hefwerktuigen bij of krachtens dit besluit gestelde voorschriften met betrekking
      tot de aanduiding en het bezigen van vermeldingen.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel4b
  - number: 4b.3
    text: |-
      Het is verboden liften en veiligheidscomponenten te verhandelen of te gebruiken, indien de bij of krachtens
      dit besluit ten aanzien van de desbetreffende hefwerktuigen voorgeschreven overeenstemmingsbeoordelings- en
      keuringsprocedures niet in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel4b
  - number: 4b.4
    text: |-
      Het is verboden liften en veiligheidscomponenten te gebruiken anders dan met inachtneming van de ten aanzien van de
      desbetreffende hefwerktuigen bij of krachtens dit besluit gestelde voorschriften met betrekking tot het voorhanden
      zijn van documenten.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel4b
  - number: '5.1'
    text: |-
      Liften en veiligheidscomponenten zijn zodanig ontworpen en vervaardigd, hebben zodanige eigenschappen en zijn van
      zodanige vermeldingen voorzien dat zij geen gevaar opleveren voor de veiligheid of gezondheid van de mens of voor
      de veiligheid van zaken, met uitzondering van huisdieren, wanneer zij op passende wijze zijn geïnstalleerd en
      onderhouden en overeenkomstig hun bestemming worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel5
  - number: '5.2'
    text: Liften voldoen aan de in bijlage I van de richtlijn opgenomen essentiële veiligheids- en gezondheidseisen.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel5
  - number: '5.3'
    text: |-
      Veiligheidscomponenten voldoen aan de in bijlage I van de richtlijn opgenomen essentiële veiligheids-
      en gezondheidseisen of zijn zodanig dat de liften, waarop zij zijn aangebracht, aan deze veiligheids- en
      gezondheidseisen voldoen.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel5
  - number: '6.1'
    text: |-
      Liften en veiligheidscomponenten die voldoen aan de door Onze Minister aangewezen geharmoniseerde normen worden in
      zoverre vermoed te voldoen aan [artikel 5, tweede, respectievelijk, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008212#Artikel5
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008212
        artikel: '5'
        hoofdstuk: II
  - number: '6.2'
    text: |-
      De onderlinge overeenkomst tussen een serie voorzieningen of inrichtingen die aan de essentiële veiligheids- en
      gezondheidseisen, bedoeld in [artikel 5, tweede lid][ref1], voldoen, mag met behulp van berekeningen of aan de hand
      van het ontwerp worden aangetoond.


      [ref1]: https://wetten.overheid.nl/BWBR0008212#Artikel5
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008212
        artikel: '5'
        hoofdstuk: II
  - number: '7'
    text: |-
      Degene die verantwoordelijk is voor de verwezenlijking van het gebouw of het bouwwerk en degene die de lift in of
      aan het gebouw of bij het bouwwerk installeert stellen elkaar in kennis van de nodige gegevens en treffen passende
      maatregelen teneinde de goede werking van de lift te waarborgen.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel7
  - number: '8.1'
    text: |-
      Liften worden onderworpen aan een overeenstemmingsbeoordelingsprocedure overeenkomstig dit artikel, zijn
      voorzien van de in bijlage III van de richtlijn bedoelde CE-markering, in voorkomend geval gevolgd door het
      identificatienummer van de aangewezen aangemelde instelling, en gaan vergezeld van de in bijlage II, onder B,
      van de richtlijn bedoelde EG-verklaring van overeenstemming, die de in evengenoemde bijlage II, onder B, genoemde
      gegevens bevat.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel8
  - number: '8.2'
    text: 'De in het eerste lid bedoelde CE-markering mag uitsluitend worden aangebracht op:'
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel8
  - number: 8.2.a
    text: |-
      liften die zijn ontworpen in overeenstemming met een lift of model-lift waarvoor een certificaat van EG-
      typeonderzoek als bedoeld in bijlage V, onder B, van de richtlijn is afgegeven, of in overeenstemming met een
      lift waarvoor een kwaliteitsborgingssysteem is gehanteerd dat voldoet aan de eisen genoemd in bijlage XIII van
      de richtlijn, aangevuld met een controle van het ontwerp, wanneer dit niet geheel voldoet aan de geharmoniseerde
      normen, bedoeld in [artikel 6, eerste lid][ref1], en waarvoor tevens bij de bouw, installatie en keuring een van de
      volgende procedures is gevolgd:


      [ref1]: https://wetten.overheid.nl/BWBR0008212#Artikel6
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008212
        artikel: '6'
        hoofdstuk: II
  - number: 8.2.a.1
    text: de procedure van de eindcontrole, bedoeld in bijlage VI van de richtlijn, of
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel8
  - number: 8.2.a.2
    text: de procedure van het kwaliteitsborgingssysteem, bedoeld in bijlage XII van de richtlijn, of
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel8
  - number: 8.2.a.3
    text: de procedure van het kwaliteitsborgingssysteem, bedoeld in bijlage XIV van de richtlijn;
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel8
  - number: 8.2.b
    text: liften die de eenheidskeuring, bedoeld in bijlage X van de richtlijn, hebben ondergaan;
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel8
  - number: 8.2.c
    text: |-
      liften waarvoor het kwaliteitsborgingssysteem is gehanteerd, bedoeld in bijlage XIII van de richtlijn, aangevuld
      met een controle van het ontwerp wanneer dit niet geheel voldoet aan de geharmoniseerde normen, bedoeld in
      [artikel 6, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008212#Artikel6
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008212
        artikel: '6'
        hoofdstuk: II
  - number: '8.3'
    text: |-
      In het technisch dossier van een modellift als bedoeld in het tweede lid, onder *a*, moeten alle variaties tussen
      de modellift en de daarvan af te leiden liften duidelijk met vermelding van de maximale en minimale waarden worden
      aangegeven.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel8
  - number: '9.1'
    text: |-
      Veiligheidscomponenten worden onderworpen aan een overeenstemmingsbeoordelingsprocedure overeenkomstig het in dit
      artikel bepaalde, zijn voorzien van de in bijlage III van de richtlijn bedoelde CE-markering, in voorkomend geval
      gevolgd door het identificatienummer van de aangewezen aangemelde instelling, en gaan vergezeld van de in bijlage
      II, onder A, van de richtlijn bedoelde EG-verklaring van overeenstemming, die de in evengenoemde bijlage II, onder
      A, genoemde gegevens bevat.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel9
  - number: '9.2'
    text: 'De in het eerste lid bedoelde CE-markering mag uitsluitend worden aangebracht op:'
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel9
  - number: 9.2.a
    text: |-
      veiligheidscomponenten die zijn ontworpen in overeenstemming met een model van een veiligheidscomponent waarvoor
      een certificaat van EG-typeonderzoek als bedoeld in bijlage V, onder A, van de richtlijn is afgegeven en waarvoor
      de procedure van produktiecontroles, bedoeld in bijlage XI van de richtlijn, is gevolgd;
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel9
  - number: 9.2.b
    text: |-
      veiligheidscomponenten die zijn ontworpen in overeenstemming met een model van een veiligheidscomponent waarvoor
      een certificaat van EG-typeonderzoek als bedoeld in bijlage V, onder A, van de richtlijn is afgegeven en waarvoor
      de procedure van het kwaliteitsborgingssysteem, bedoeld in bijlage VIII van de richtlijn, is gehanteerd;
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel9
  - number: 9.2.c
    text: |-
      veiligheidscomponenten waarvoor de procedure van volledige kwaliteitsborging, bedoeld in bijlage IX van de
      richtlijn, is gehanteerd.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel9
  - number: '10.1'
    text: |-
      Degene die een EG-verklaring van overeenstemming als bedoeld in [artikel 9, eerste lid][ref1], afgeeft, bewaart een
      afschrift daarvan gedurende tien jaar nadat de vervaardiging van de veiligheidscomponent wordt stopgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0008212#Artikel9
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008212
        artikel: '9'
        hoofdstuk: III
  - number: '10.2'
    text: |-
      Degene die een EG-verklaring van overeenstemming als bedoeld in [artikel 8, eerste lid][ref1], afgeeft, bewaart een
      afschrift daarvan gedurende tien jaar na het in de handel brengen van de lift.


      [ref1]: https://wetten.overheid.nl/BWBR0008212#Artikel8
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008212
        artikel: '8'
        hoofdstuk: III
  - number: '10.3'
    text: |-
      Afschriften van de EG-verklaring van overeenstemming, alsmede van de verslagen van de proeven in verband met de
      eindcontrole, bedoeld in bijlage VI van de richtlijn, worden desgevraagd door de fabrikant aan de Commissie van de
      Europese Gemeenschappen, de lid-staten of andere aangewezen aangemelde instellingen ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel10
  - number: '11.1'
    text: |-
      Van voorgenomen wijzigingen in een lift, het model van een lift of het model van een veiligheidscomponent waarvoor
      een certificaat van EG-typeonderzoek is afgegeven, wordt de aangewezen aangemelde instelling die dit certificaat
      heeft afgegeven onverwijld in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel11
  - number: '11.2'
    text: |-
      De in het eerste lid bedoelde aangewezen aangemelde instelling beoordeelt de wijzigingen en deelt mee of het
      certificaat van EG-typeonderzoek voor de gewijzigde lift of het gewijzigde model geldig is dan wel aanvullingen
      behoeft.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel11
  - number: '11.3'
    text: |-
      Indien de in het eerste lid bedoelde aangewezen aangemelde instelling van oordeel is dat de wijzigingen van
      invloed kunnen zijn op de overeenstemming met de in bijlage I van de richtlijn opgenomen essentiële veiligheids- en
      gezondheidseisen, wordt de gewijzigde lift of het gewijzigde model aan het in bijlage V van de richtlijn bedoelde
      EG-typeonderzoek onderworpen en wordt bij goedkeuring een aanvulling op het oorspronkelijke certificaat afgegeven.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel11
  - number: '13'
    text: |-
      De verplichtingen van de [artikelen 8][ref1], [9][ref2] en [11][ref3] rusten tevens op degene die voor eigen
      gebruik een lift of veiligheidscomponent bouwt.


      [ref1]: https://wetten.overheid.nl/BWBR0008212#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0008212#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0008212#Artikel11
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008212
        artikel: '8'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0008212
        artikel: '9'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0008212
        artikel: '11'
        hoofdstuk: III
  - number: '14'
    text: |-
      Liften en veiligheidscomponenten die zijn voorzien van de CE-markering en vergezeld gaan van de EG-verklaring van
      overeenstemming worden vermoed te voldoen aan [artikel 5, tweede, respectievelijk derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008212#Artikel5
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008212
        artikel: '5'
        hoofdstuk: II
  - number: '15.1'
    text: |-
      De CE-markering, in voorkomend geval gevolgd door het identificatienummer van de aangewezen aangemelde instelling,
      en de minimumaanwijzingen, plaat en instructies, bedoeld in punt 5 van bijlage I van de richtlijn, worden duidelijk
      zichtbaar in iedere kooi aangebracht.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel15
  - number: '15.2'
    text: |-
      De CE-markering, in voorkomend geval gevolgd door het identificatienummer van de aangewezen aangemelde instelling,
      wordt op elke veiligheidscomponent aangebracht. Indien dit niet mogelijk is, wordt de CE-markering aangebracht op
      een etiket dat vast met de veiligheidscomponent is verbonden.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel15
  - number: '15.3'
    text: |-
      Op liften en veiligheidscomponenten worden geen merktekens aangebracht die derden kunnen misleiden omtrent de
      betekenis of grafische vorm van de CE-markering. Andere merktekens mogen worden aangebracht op voorwaarde dat de
      zichtbaarheid en leesbaarheid van de CE-markering er niet door worden verminderd.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel15
  - number: '16'
    text: |-
      De aangewezen aangemelde instelling trekt een door haar afgegeven certificaat van EG-typeonderzoek in, indien de
      essentiële veiligheids- en gezondheidseisen van bijlage I van de richtlijn zodanig zijn gewijzigd dat het model
      niet voldoet aan de gewijzigde eisen op het tijdstip waarop deze volgens de richtlijn van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel16
  - number: '17.1'
    text: |-
      Liften worden ten hoogste twaalf maanden na de eerste ingebruikneming en vervolgens telkens na verloop van ten
      hoogste achttien maanden door een aangewezen instelling gekeurd. Bij ministeriële regeling kan worden bepaald dat
      een aangewezen instelling kan verlangen dat een lift, in geval van door haar geconstateerde ernstige gebreken, na
      een kortere termijn dan de termijnen, genoemd in de eerste volzin, wordt onderzocht op de staat van veiligheid.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel17
  - number: '17.2'
    text: |-
      Liften als bedoeld in het eerste lid, die zullen worden gebruikt tijdens de bouwfase van het gebouw of bouwwerk
      worden vóór de eerste ingebruikneming en vervolgens telkens na verloop van ten hoogste drie maanden door een
      aangewezen instelling gekeurd. Het eerste lid, tweede volzin, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel17
  - number: '17.3'
    text: Liften worden vóór de ingebruikneming na elke herstelling of wijziging door een aangewezen instelling gekeurd.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel17
  - number: '17.4'
    text: |-
      Bij de keuring vóór de eerste ingebruikneming, bedoeld in het tweede lid, wordt gecontroleerd of de documenten van
      de voorgeschreven procedures, bedoeld in [artikel 8][ref1], aanwezig zijn en juist zijn. Bij de keuring voor de
      ingebruikneming na herstelling of wijziging, bedoeld in het derde lid, wordt getoetst of ten minste is voldaan aan
      de voor het desbetreffende hefwerktuig geldende vervaardigingsvoorschriften, bedoeld in [artikel 5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008212#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0008212#Artikel5
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008212
        artikel: '8'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0008212
        artikel: '5'
        hoofdstuk: II
  - number: '17.5'
    text: |-
      Bij de vervolgkeuringen, bedoeld in het eerste en tweede lid, wordt getoetst of nog ten minste is voldaan aan de
      voor het desbetreffende hefwerktuig geldende vervaardigingsvoorschriften van [artikel 5][ref1] en, voor wat betreft
      liften als bedoeld in het eerste lid, aan [artikel 7.21, eerste lid, van het Arbeidsomstandighedenbesluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008212#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel7
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008212
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '7'
  - number: '17.6'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van het vierde en vijfde lid.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel17
  - number: '17.7'
    text: |-
      Als blijk van goedkeuring brengt de instelling, bedoeld in het eerste tot en met vierde lid, op een duidelijk
      zichtbare plaats in de kooi of op het hefwerktuig een kenmerk aan, waarop tevens de herkeuringstermijn, genoemd in
      het eerste en tweede lid, wordt aangegeven.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel17
  - number: '17.8'
    text: |-
      De certificaathouder verstrekt Onze Minister of, indien Onze Minister een aangewezen instelling heeft aangewezen,
      deze instelling, desgevraagd kosteloos alle informatie die nodig is voor de uitvoering van het bepaalde bij of
      krachtens dit artikel.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel17
  - number: 17a.1
    text: |-
      Onze Minister of, indien Onze Minister een aangewezen instelling dan wel aangewezen aangemelde instelling heeft
      aangewezen, deze instelling, geeft op verzoek een certificaat van goedkeuring af wanneer hij respectievelijk zij
      heeft vastgesteld dat is voldaan aan de bij of krachtens [artikel 17, vierde, vijfde en zesde lid][ref1], gestelde
      keuringseisen.


      [ref1]: https://wetten.overheid.nl/BWBR0008212#Artikel17
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0008212
        artikel: '17'
        hoofdstuk: III
  - number: 17a.2
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de indiening van een verzoek, als
      bedoeld in het eerste lid, en de afhandeling van het verzoek.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel17a
  - number: 17a.3
    text: |-
      De kosten van het afgeven van een certificaat van goedkeuring zijn voor rekening van de verzoeker tot afgifte van
      het certificaat.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel17a
  - number: 17b.1
    text: |-
      De afgifte van een certificaat van goedkeuring als bedoeld in [artikel 17a][ref1], wordt geweigerd indien de
      verzoeker niet heeft voldaan aan het bij of krachtens dit besluit met betrekking het certificaat gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0008212#Artikel17a
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0008212
        artikel: 17a
        hoofdstuk: III
  - number: 17b.2
    text: |-
      Een certificaat van goedkeuring kan worden geschorst, ten nadele van de certificaathouder worden gewijzigd of
      ingetrokken:
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel17b
  - number: 17b.2.a
    text: |-
      op grond van feiten of omstandigheden waarvan Onze Minister of, indien Onze Minister een aangewezen instelling
      dan wel aangewezen aangemelde instelling heeft aangewezen, deze instelling, bij het afgeven van het certificaat
      redelijkerwijs niet op de hoogte kon zijn en op grond waarvan hij respectievelijk zij het certificaat niet of
      alleen met voorschriften, bedoeld in [artikel 7a, vierde lid, van de wet][ref1], zou hebben gegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel7a
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 7a
  - number: 17b.2.b
    text: |-
      op grond van door de certificaathouder verstrekte onjuiste inlichtingen over feiten en omstandigheden, mits de
      onjuistheid daarvan aan de certificaathouder bekend was of kon zijn;
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel17b
  - number: 17b.2.c
    text: |-
      indien de certificaathouder niet meer voldoet aan de bij of krachtens dit besluit met betrekking tot het
      certificaat gestelde eisen of zijn wettelijke verplichtingen niet meer naar behoren nakomt; of
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel17b
  - number: 17b.2.d
    text: |-
      indien de certificaathouder met zijn werkzaamheden, voor zover die door het certificaat worden gereguleerd, of door
      de wijze waarop hij de werkzaamheden verricht, ernstig gevaar veroorzaakt of kan veroorzaken voor personen.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel17b
  - number: '18.1'
    text: |-
      Een lift gaat vergezeld van een instructieboek en een liftboek als bedoeld in punt 6.2 van bijlage I van de
      richtlijn. Deze zijn gesteld in de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel18
  - number: '18.2'
    text: |-
      Een veiligheidscomponent gaat vergezeld van een instructieboek als bedoeld in punt 6.1 van bijlage I van de
      richtlijn.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel18
  - number: '18.3'
    text: |-
      Het certificaat van goedkeuring, bedoeld in [artikel 17a, eerste lid][ref1], en het liftboek, bedoeld
      in het eerste lid, of een afschrift daarvan worden desgevraagd getoond aan een ambtenaar als bedoeld in
      [artikel 25 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008212#Artikel17a
      [ref2]: https://wetten.overheid.nl/BWBR0001969#Artikel25
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008212
        artikel: 17a
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0001969
        artikel: '25'
  - number: 18a
    text: |-
      Een lift die niet geschikt is voor gebruik is op zodanige wijze buiten gebruik gesteld, dat deze niet door een
      liftgebruiker weer in gebruik te stellen is. Alle nodige veiligheidsmaatregelen zijn genomen om de bescherming van
      personen te waarborgen.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel18a
  - number: '19.1'
    text: |-
      Degene die een lift voorhanden heeft, die in gebruik of voor gebruik gereed is, of die een lift aflevert of
      tentoonstelt, zorgt ervoor dat die lift en de daarop aangebrachte veiligheidscomponenten in goede staat van
      onderhoud verkeren.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel19
  - number: '19.2'
    text: |-
      Degene die een lift voorhanden heeft of gebruikt zorgt ervoor dat die lift en de daarop aangebrachte
      veiligheidscomponenten overeenkomstig hun bestemming worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel19
  - number: '19.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing voor zover de lift hetzij is afgekeurd hetzij is onklaar gemaakt
      hetzij anderszins kennelijk niet meer voor gebruik is bestemd.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel19
  - number: 19a
    text: |-
      Degene die een lift zonder kooiafsluiting voorhanden heeft, welke bestemd is voor het vervoer van goederen onder
      begeleiding van een persoon, zorgt ervoor dat de lift slechts wordt bediend door mensen die met die bediening
      vertrouwd zijn.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel19a
  - number: 19b
    text: 'Degene die een lift bedient, bestuurt of belaadt, zorg ervoor dat:'
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel19b
  - number: 19b.a
    text: |-
      de toelaatbare belasting en het aantal toe te laten mensen, aangegeven op opschriften in de kooi, niet worden
      overschreden;
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel19b
  - number: 19b.b
    text: bij vervoer van goederen de belasting zo gelijkmatig mogelijk over het vloeroppervlak van de kooi wordt verdeeld;
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel19b
  - number: 19b.c
    text: |-
      ingeval van liften zonder kooiafsluiting, wagens voor het vervoer van goederen, benevens beweegbare onderdelen van
      die wagens, in de kooi zijn vastgezet.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel19b
  - number: '20'
    text: 'Degene die een lift voorhanden heeft, zorgt ervoor dat:'
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel20
  - number: 20.a
    text: |-
      in liftschachten geen leidingen of installaties worden aangebracht die niet voor de werking of veiligheid van de
      lift zijn vereist;
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel20
  - number: 20.b
    text: |-
      machinekamers, schijvenruimten en schachtputten niet worden gebruikt als bergruimte van voorwerpen, welke niet tot
      de lift behoren;
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel20
  - number: 20.c
    text: machinekamers, schijvenruimten en luiken, bestemd voor inspectie en onderhoud, zijn afgesloten met slot en sleutel;
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel20
  - number: 20.d
    text: |-
      de onder c bedoelde sleutels zijn voorzien van aanduidingen en op een uitsluitend voor bevoegden toegankelijke
      plaats worden bewaard;
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel20
  - number: 20.e
    text: |-
      nabij de tornmiddelen een aanwijzing is opgehangen, waarin is aangegeven, op welke wijze de machine kan worden
      getornd.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel20
  - number: '21'
    text: |-
      Degene die een lift voorhanden heeft, welke is voorzien van een merk van afkeuring zorgt ervoor dat de
      schachtdeuren van de lift niet zonder bijzondere hulpmiddelen kunnen worden geopend en op of nabij elke schachtdeur
      van de lift duidelijk en opvallend een opschrift is aangebracht waaruit blijkt dat de lift buiten dienst is
      gesteld.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel21
  - number: '22'
    text: |-
      [Artikel 4b, eerste tot en met derde lid][ref1], is niet van toepassing op het tentoonstellen en demonstreren op
      (jaar-)beurzen, exposities en bij demonstraties van liften of veiligheidscomponenten die niet in overeenstemming
      zijn met dit besluit, mits op een zichtbaar bord duidelijk is aangegeven dat zij niet in overeenstemming zijn
      met dit besluit en niet te koop zijn voordat zij door de fabrikant of zijn in de Europese Economische Ruimte
      gevestigde gemachtigde, in overeenstemming zijn gebracht met dit besluit. Bij demonstraties worden alle nodige
      veiligheidsmaatregelen genomen om de bescherming van de mens te waarborgen.


      [ref1]: https://wetten.overheid.nl/BWBR0008212#Artikel4b
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0008212
        artikel: 4b
        hoofdstuk: Ia
  - number: '23.1'
    text: 'Als aangewezen instelling of als aangewezen aangemelde instelling kan worden aangewezen een instelling die:'
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel23
  - number: 23.1.a
    text: rechtspersoonlijkheid heeft;
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel23
  - number: 23.1.b
    text: haar zetel of een vestiging in Nederland heeft;
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel23
  - number: 23.1.c
    text: |-
      onafhankelijk is van degenen die bij het resultaat van de uitvoering van de taken waarvoor zij is aangewezen belang
      hebben;
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel23
  - number: 23.1.d
    text: |-
      beschikt over voldoende deskundigheid en outillage om de uitvoering van de taken waarvoor zij is aangewezen, naar
      behoren te kunnen vervullen;
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel23
  - number: 23.1.e
    text: |-
      beschikt over een behoorlijke administratie, waarin de gegevens die samenhangen met en betrekking hebben op de
      uitvoering van haar taken, op een systematische wijze zijn vastgelegd. Aan de hand van deze gegevens zijn de
      gekeurde liften, alsmede de onderzochte kwaliteitssystemen afdoende te identificeren;
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel23
  - number: 23.1.f
    text: naar behoren functioneert.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel23
  - number: '23.2'
    text: |-
      In aanvulling op het eerste lid komen voor een aanwijzing als aangewezen aangemelde instelling slechts in
      aanmerking instellingen die ten minste voldoen aan de in bijlage VII van de richtlijn neergelegde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel23
  - number: '23.3'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel23
  - number: '24'
    text: |-
      De instelling verstrekt jaarlijks aan Onze Minister een afschrift van de polis van de afgesloten verzekering tegen
      wettelijke aansprakelijkheid tegen alle risico's die voortvloeien uit de uitoefening van de taken waarvoor zij
      is aangewezen.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel24
  - number: '25.1'
    text: |-
      Indien een wijziging plaatsvindt in de gegevens op grond waarvan de instelling is aangewezen, doet de instelling
      hiervan terstond mededeling aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel25
  - number: '25.2'
    text: |-
      Indien een instelling voornemens is een of meer van de taken waarvoor zij is aangewezen, te beëindigen, doet de
      instelling hiervan terstond mededeling aan Onze Minister en de certificaathouders. In dat geval worden door de
      instelling de gegevens, bedoeld in [artikel 23, eerste lid, onder e][ref1], overgedragen aan Onze Minister dan
      wel, na toestemming van Onze Minister en de certificaathouders, een andere instelling die voor dezelfde taken is
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0008212#Artikel23
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0008212
        artikel: '23'
        hoofdstuk: V
  - number: '26.1'
    text: |-
      Een aanvraag om aanwijzing gaat vergezeld van het bewijs dat is voldaan aan de criteria, bedoeld in
      [artikel 23, eerste lid][ref1], dan wel in geval van [artikel 23, tweede lid][ref2], tevens van bewijs dat is
      voldaan aan de voorwaarden, bedoeld in dat lid, dan wel van een verklaring waaruit de bereidheid blijkt om voor
      eigen rekening een onderzoek naar het voldoen aan deze criteria dan wel voorwaarden te ondergaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008212#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0008212#Artikel23
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0008212
        artikel: '23'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0008212
        artikel: '23'
        hoofdstuk: V
  - number: '26.2'
    text: |-
      Een aanwijzing kan worden geweigerd dan wel worden gewijzigd of ingetrokken indien niet of niet volledig is voldaan
      aan de bij de wet of bij of krachtens dit besluit gestelde voorschriften. Een aanwijzing kan worden ingetrokken
      indien de instelling gedurende een aaneengesloten periode van twee jaar geen werkzaamheden, waarvoor zij is
      aangewezen, heeft uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel26
  - number: '26.3'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel26
  - number: '27'
    text: |-
      Een wijziging van een van de bijlagen van de richtlijn waarnaar in dit besluit wordt verwezen, treedt voor de
      toepassing van dit besluit en de daarop gebaseerde bepalingen in werking met ingang van de dag waarop aan de
      betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel27
  - number: 27a
    text: |-
      Dit besluit is mede van toepassing op het voorhanden hebben en het gebruiken van een lift in de particuliere
      huishouding.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel27a
  - number: '28.1'
    text: |-
      Dit besluit is niet van toepassing op veiligheidscomponenten die zijn voorzien van het EEG-merkteken en vergezeld
      gaan van het certificaat van overeenstemming, bedoeld in artikel 6 van de regeling van de Staatssecretaris van
      Sociale Zaken en Werkgelegenheid van 16 juni 1987 ter uitvoering van de EEG-[richtlijnen 84/528/EEG](31984L0528)
      en [84/529/EEG](31984L0529) (hef- en verladingsapparatuur; liften met elektrische aandrijving) (*Stcrt.* 1987,
      124) en voor 1 juli 1999 in de handel zijn gebracht en in bedrijf zijn gesteld, voor zover zij niet alsnog in
      overeenstemming zijn gebracht met [artikel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008212#Artikel5
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0008212
        artikel: '5'
        hoofdstuk: II
  - number: '28.2'
    text: |-
      Met betrekking tot de veiligheidscomponenten, bedoeld in het eerste lid, waarop dit besluit niet wordt toegepast
      en waarop krachtens een of meer andere wettelijke regelingen de CE-markering wordt aangebracht, worden op de bij
      die veiligheidscomponenten gevoegde documenten, handleidingen of gebruiksaanwijzingen de in het *Publicatieblad van
      de Europese Gemeenschappen* bekendgemaakte referenties van de aan die wettelijke regelingen ten grondslag liggende
      richtlijnen vermeld.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel28
  - number: 28a.1
    text: |-
      De artikelen 5 en 8 zijn niet van toepassing op liften die zijn vervaardigd in overeenstemming met de
      vervaardigingsvoorschriften, bedoeld in artikel 28b en die voor 1 juli 1999 in de handel zijn gebracht en in
      bedrijf zijn gesteld, voor zover zij niet alsnog in overeenstemming zijn gebracht met artikel 5.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel28a
  - number: 28a.2
    text: |-
      Met betrekking tot de liften, bedoeld in het eerste lid, waarop de artikelen 5 en 8 niet worden toegepast en
      waarop krachtens een of meer andere wettelijke regelingen de CE-markering wordt aangebracht, worden op de bij
      die liften gevoegde documenten, handleidingen of gebruiksaanwijzingen de in het *Publicatieblad van de Europese
      Gemeenschappen* bekendgemaakte referenties van de aan die wettelijke regelingen ten grondslag liggende richtlijnen
      vermeld.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel28a
  - number: 28b
    text: |-
      De artikelen 5 en 8 zijn niet van toepassing op liften die tussen 16 augustus 1991 en 1 juli 1999 in bedrijf zijn
      gesteld en die geheel voldoen aan hetgeen ten aanzien van de vervaardiging is bepaald in de hoofdstukken 0 tot en
      met 16 en bijlage Z van NEN-EN 81-1, tweede druk, uitgegeven in september 1986, zoals gewijzigd in december 1989,
      in onderscheidenlijk NEN-EN 81-2, eerste druk, uitgegeven in mei 1989, met dien verstande dat in plaats van punt
      13.1.1.4 van die normen het volgende geldt: «De elektrische installatie van liften dient te voldoen aan de eisen
      vermeld in de geharmoniseerde documenten van het Europees Comité voor elektrotechnische normalisatie (CENELEC)
      welke zijn goedgekeurd door de nationale comités voor de elektrotechniek van de landen van de Europese Economische
      Gemeenschap».
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel28b
  - number: 28c.1
    text: |-
      De artikelen 5 en 8 zijn niet van toepassing ten aanzien van liften die vóór 16 augustus 1991 in bedrijf zijn
      gesteld en die
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel28c
  - number: 28c.1.a
    text: geheel voldoen aan de hoofdstukken II tot en met X en XII van N 1081, uitgegeven in december 1950, dan wel
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel28c
  - number: 28c.1.b
    text: |-
      voldoen aan de hoofdstukken II tot en met X en XII van N 1081, uitgegeven in december 1950, met uitzondering van
      de artikelen 5, derde lid, 8, tweede lid, 12, vijfde lid, 13, tweede lid, eerste volzin, 16, eerste tot en met
      vierde lid, 17, tweede en derde lid, 19, eerste lid, 20, derde lid, 21, laatste volzin, 22, tweede lid, 26, derde
      lid, tweede volzin, en vierde lid, 27, derde lid, 28, eerste lid, onder *a*, en tweede lid, onder *e*, 32, 34,
      eerste lid, onder *c*, en tweede lid, onder *a* en *b*, 41, derde lid, onder *b*2, en vierde lid, 42, tweede lid,
      43, eerste lid, 48, derde lid, en 49, tweede en vierde lid, vanaf de tweede volzin, mits zij voldoen aan de met
      de hiervoor genoemde bepalingen van N 1081 overeenkomende bepalingen van NEN 1081, uitgegeven in december 1971,
      zoals gewijzigd in februari 1989, met dien verstande dat, indien de kooiafsluitingen van een lift mechanisch worden
      aangedreven, de blokkeerinrichting in de kooi achterwege mag blijven, dan wel
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel28c
  - number: 28c.1.c
    text: |-
      geheel voldoen aan de hoofdstukken II tot en met X en XII van NEN 1081, uitgegeven in december 1971, zoals
      gewijzigd in februari 1989, dan wel
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel28c
  - number: 28c.1.d
    text: geheel voldoen aan de hoofdstukken 0 tot en met 16 van NEN-EN 81-1, eerste druk, uitgegeven in juni 1979.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel28c
  - number: 28c.2
    text: |-
      In afwijking van het eerste lid, aanhef en onderdelen a, b en c, moeten de daar bedoelde liften die in bedrijf
      zijn gesteld op of na 24 januari 1978 ten aanzien van kooitoegangen en de vloeroppervlakte van de kooi voldoen
      aan hetgeen daaromtrent is bepaald in NEN-EN 81-1, eerste druk, uitgegeven in juni 1979, met dien verstande dat
      voor liften met hydraulische aandrijving in punt 8.2.1 van die norm, in noot *c* onder tabel 1.1 in plaats van
      «0,16 m2», geldt: 0,50 m2. Het in de vorige volzin bepaalde geldt niet ten aanzien van liften voor de levering
      waarvan opdracht is gegeven vóór 24 oktober 1978 en die voor eerste keuring zijn gereed gekomen vóór 24 juli 1979.
    url: https://wetten.overheid.nl/BWBR0008212/2011-07-01#Artikel28c
  - number: 28d
    text: |-
      De [artikelen 5][ref1] en [8][ref2] zijn niet van toepassing op liften die tussen 16 augustus 1991 en 1 juli
      1997 in bedrijf zijn gesteld, indien voor de levering daarvan opdracht is gegeven vóór 16 augustus 1991, mits zij
      voldoen aan [artikel 28c, eerste lid, onderdeel c][ref3] en tevens aan [het tweede lid van dat artikel][ref4], dan
      wel in het geval van een lift met elektrische aandrijving aan [artikel 28c, eerste lid, onderdeel d][ref5].


