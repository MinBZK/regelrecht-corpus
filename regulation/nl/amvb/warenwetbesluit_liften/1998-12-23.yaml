---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: warenwetbesluit_liften
regulatory_layer: AMVB
publication_date: '2008-06-27'
valid_from: '1998-12-23'
bwb_id: BWBR0008212
url: https://wetten.overheid.nl/BWBR0008212/1998-12-23
preamble:
  text: |-
    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 23 april 1996, Directie
    Arbeidsomstandigheden, nr. ARBO/APM/96/00974, gedaan in overeenstemming met Onze Minister van Economische Zaken en
    de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Gelet op richtlijn nr. 95/16/EG van het Europees Parlement en de Raad van de Europese Unie van 29 juni 1995 inzake
    de onderlinge aanpassing van de wetgevingen der Lid-Staten betreffende liften (PbEG L 213);

    Gelet op de artikelen 1, eerste lid, aanhef, en onderdelen a en b, 2, 3, eerste en tweede lid, 6, 12, derde lid,
    en 25a van de Wet op de gevaarlijke werktuigen, artikel 9, eerste lid, onder a, van de Mijnwet 1903 en artikel 26,
    eerste lid, onder b, van de Mijnwet continentaal plat, alsmede de artikelen 2 en 120 van de Woningwet;

    De Raad van State gehoord (advies van 21 juni 1996, nr. W12.96.0174);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 15 augustus 1996,
    Directie Arbeidsomstandigheden, nr. ARBO/APM/96/01500, uitgebracht in overeenstemming met Onze Minister van
    Economische Zaken en de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel1
  - number: 1.1.a
    text: |-
      wet: [Wet op de gevaarlijke werktuigen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002087
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002087
  - number: 1.1.b
    text: |-
      richtlijn: [richtlijn nr. 95/16/EG](31995L0016) van het Europees Parlement en de Raad van de Europese Unie van 29
      juni 1995 inzake de onderlinge aanpassing van de wetgevingen der Lid-Staten betreffende liften (PbEG L 213);
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel1
  - number: 1.1.c
    text: |-
      lift: een vast opgesteld werktuig in gebouwen of bouwwerken dat bepaalde stopplaatsen van een gebouw of bouwwerk
      bedient, met behulp van een kooi die langs vaste, ten opzichte van het horizontale vlak meer dan 15 graden hellende
      leiders beweegt, en die bestemd is voor vervoer van - personen,
        - personen en goederen,
        - uitsluitend goederen indien de kooi betreedbaar is en uitgerust met bedieningsorganen die in de kooi of binnen
      het bereik van een zich aldaar bevindende persoon zijn gesitueerd;
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel1
  - number: 1.1.d
    text: |-
      modellift: een representatieve lift waarvan het technisch dossier laat zien hoe de in bijlage I van de richtlijn
      opgenomen essentiële veiligheids- en gezondheidseisen in acht worden genomen voor liften die zijn afgeleid van het
      met behulp van objectieve parameters gedefinieerde model en in welke liften identieke veiligheidscomponenten worden
      gebruikt;
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel1
  - number: 1.1.e
    text: |-
      veiligheidscomponenten: de in bijlage IV van de richtlijn genoemde onderdelen van liften die essentieel zijn voor
      de veilige werking;
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel1
  - number: 1.1.f
    text: |-
      kooi: een aan alle zijden, met inbegrip van de vloer en het plafond, met volle wanden afgesloten onderdeel van de
      lift waarin personen of goederen worden vervoerd;
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel1
  - number: 1.1.g
    text: |-
      Europese Economische Ruimte: het grondgebied waarop de Overeenkomst betreffende de Europese Economische Ruimte van
      toepassing is;
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel1
  - number: 1.1.h
    text: |-
      keuringsinstantie: een ingevolge artikel 5, eerste lid, van de wet in het kader van de richtlijn aangewezen dienst,
      instelling, onderzoekings-bureau of onderneming dan wel een door een andere lid-staat bij de Commissie van de
      Europese Gemeenschappen aangemelde instantie.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel1
  - number: '1.2'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt mede verstaan onder liften: vast opgestelde hefwerktuigen
      als bedoeld in het eerste lid, onder *c*, die een vaste baan in de ruimte volgen, maar niet langs vaste leiders
      bewegen.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel1
  - number: '2'
    text: Voor de toepassing van dit besluit is een kooi betreedbaar indien een persoon er zonder moeite kan binnengaan.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel2
  - number: '3.1'
    text: |-
      Als gevaarlijke werktuigen als bedoeld in artikel 1, eerste lid, onderdeel *a*, van de wet worden aangewezen
      liften.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel3
  - number: '3.2'
    text: |-
      Als beveiligingsmiddelen als bedoeld in artikel 1, eerste lid, onderdeel *b*, van de wet worden aangewezen
      veiligheidscomponenten.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel3
  - number: '4'
    text: 'Dit besluit is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel4
  - number: 4.a
    text: kabelbaaninstallaties, met inbegrip van kabelsporen, voor openbaar of niet-openbaar personenvervoer;
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel4
  - number: 4.b
    text: liften die speciaal zijn ontworpen en gebouwd voor militaire doeleinden of het handhaven van de orde;
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel4
  - number: 4.c
    text: mijnliften;
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel4
  - number: 4.d
    text: toneelhefwerktuigen;
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel4
  - number: 4.e
    text: liften die in vervoermiddelen zijn ingebouwd;
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel4
  - number: 4.f
    text: |-
      liften die met een machine zijn verbonden en uitsluitend bestemd zijn om de toegang tot de werkplek mogelijk te
      maken;
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel4
  - number: 4.g
    text: tandradbanen;
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel4
  - number: 4.h
    text: bouwliften bestemd voor het vervoer van personen.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel4
  - number: '5.1'
    text: |-
      Liften en veiligheidscomponenten zijn zodanig ontworpen en vervaardigd, hebben zodanige eigenschappen en zijn van
      zodanige vermeldingen voorzien dat zij geen gevaar opleveren voor de veiligheid of de gezondheid van personen of
      goederen, wanneer zij op passende wijze zijn geïnstalleerd en onderhouden en overeenkomstig hun bestemming worden
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel5
  - number: '5.2'
    text: Liften voldoen aan de in bijlage I van de richtlijn opgenomen essentiële veiligheids- en gezondheidseisen.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel5
  - number: '5.3'
    text: |-
      Veiligheidscomponenten voldoen aan de in bijlage I van de richtlijn opgenomen essentiële veiligheids-
      en gezondheidseisen of zijn zodanig dat de liften, waarop zij zijn aangebracht, aan deze veiligheids- en
      gezondheidseisen voldoen.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel5
  - number: '6.1'
    text: |-
      Liften en veiligheidscomponenten die voldoen aan de door Onze Minister aangewezen geharmoniseerde normen worden in
      zoverre vermoed te voldoen aan [artikel 5, tweede, respectievelijk, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008212#Artikel5
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008212
        artikel: '5'
        hoofdstuk: II
  - number: '6.2'
    text: |-
      De onderlinge overeenkomst tussen een serie voorzieningen of inrichtingen die aan de essentiële veiligheids- en
      gezondheidseisen, bedoeld in [artikel 5, tweede lid][ref1], voldoen, mag met behulp van berekeningen of aan de hand
      van het ontwerp worden aangetoond.


      [ref1]: https://wetten.overheid.nl/BWBR0008212#Artikel5
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008212
        artikel: '5'
        hoofdstuk: II
  - number: '7'
    text: |-
      Degene die verantwoordelijk is voor de verwezenlijking van het gebouw of het bouwwerk en degene die de lift
      installeert stellen elkaar in kennis van de nodige gegevens en treffen passende maatregelen teneinde de goede
      werking van de lift te waarborgen.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel7
  - number: '8.1'
    text: |-
      Liften worden onderworpen aan een overeenstemmingsbeoordelingsprocedure overeenkomstig dit artikel, zijn
      voorzien van de in bijlage III van de richtlijn bedoelde CE-markering, in voorkomend geval gevolgd door het
      identificatienummer van de keuringsinstantie, en gaan vergezeld van de in bijlage II, onder B, van de richtlijn
      bedoelde EG-verklaring van overeenstemming, die de in evengenoemde bijlage II, onder B, genoemde gegevens bevat.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel8
  - number: '8.2'
    text: 'De in het eerste lid bedoelde CE-markering mag uitsluitend worden aangebracht op:'
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel8
  - number: 8.2.a
    text: |-
      liften die zijn ontworpen in overeenstemming met een lift of model-lift waarvoor een certificaat van EG-
      typeonderzoek als bedoeld in bijlage V, onder B, van de richtlijn is afgegeven, of in overeenstemming met een
      lift waarvoor een kwaliteitsborgingssysteem is gehanteerd dat voldoet aan de eisen genoemd in bijlage XIII van
      de richtlijn, aangevuld met een controle van het ontwerp, wanneer dit niet geheel voldoet aan de geharmoniseerde
      normen, bedoeld in artikel 6, eerste lid, en waarvoor tevens bij de bouw, installatie en keuring een van de
      volgende procedures is gevolgd:
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel8
  - number: 8.2.a.1
    text: de procedure van de eindcontrole, bedoeld in bijlage VI van de richtlijn, of
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel8
  - number: 8.2.a.2
    text: de procedure van het kwaliteitsborgingssysteem, bedoeld in bijlage XII van de richtlijn, of
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel8
  - number: 8.2.a.3
    text: de procedure van het kwaliteitsborgingssysteem, bedoeld in bijlage XIV van de richtlijn;
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel8
  - number: 8.2.b
    text: liften die de eenheidskeuring, bedoeld in bijlage X van de richtlijn, hebben ondergaan;
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel8
  - number: 8.2.c
    text: |-
      liften waarvoor het kwaliteitsborgingssysteem is gehanteerd, bedoeld in bijlage XIII van de richtlijn, aangevuld
      met een controle van het ontwerp wanneer dit niet geheel voldoet aan de geharmoniseerde normen, bedoeld in artikel
      6, eerste lid.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel8
  - number: '8.3'
    text: |-
      In het technisch dossier van een modellift als bedoeld in het tweede lid, onder *a*, moeten alle variaties tussen
      de modellift en de daarvan af te leiden liften duidelijk met vermelding van de maximale en minimale waarden worden
      aangegeven.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel8
  - number: '9.1'
    text: |-
      Veiligheidscomponenten worden onderworpen aan een overeenstemmingsbeoordelingsprocedure overeenkomstig het in dit
      artikel bepaalde, zijn voorzien van de in bijlage III van de richtlijn bedoelde CE-markering, in voorkomend geval
      gevolgd door het identificatienummer van de keuringsinstantie, en gaan vergezeld van de in bijlage II, onder A,
      van de richtlijn bedoelde EG-verklaring van overeenstemming, die de in evengenoemde bijlage II, onder A, genoemde
      gegevens bevat.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel9
  - number: '9.2'
    text: 'De in het eerste lid bedoelde CE-markering mag uitsluitend worden aangebracht op:'
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel9
  - number: 9.2.a
    text: |-
      veiligheidscomponenten die zijn ontworpen in overeenstemming met een model van een veiligheidscomponent waarvoor
      een certificaat van EG-typeonderzoek als bedoeld in bijlage V, onder A, van de richtlijn is afgegeven en waarvoor
      de procedure van produktiecontroles, bedoeld in bijlage XI van de richtlijn, is gevolgd;
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel9
  - number: 9.2.b
    text: |-
      veiligheidscomponenten die zijn ontworpen in overeenstemming met een model van een veiligheidscomponent waarvoor
      een certificaat van EG-typeonderzoek als bedoeld in bijlage V, onder A, van de richtlijn is afgegeven en waarvoor
      de procedure van het kwaliteitsborgingssysteem, bedoeld in bijlage VIII van de richtlijn, is gehanteerd;
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel9
  - number: 9.2.c
    text: |-
      veiligheidscomponenten waarvoor de procedure van volledige kwaliteitsborging, bedoeld in bijlage IX van de
      richtlijn, is gehanteerd.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel9
  - number: '10.1'
    text: |-
      Degene die een EG-verklaring van overeenstemming als bedoeld in artikel 8, eerste lid, afgeeft, bewaart een
      afschrift daarvan gedurende tien jaar nadat de vervaardiging van de veiligheidscomponent wordt stopgezet.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel10
  - number: '10.2'
    text: |-
      Degene die een EG-verklaring van overeenstemming als bedoeld in artikel 9, eerste lid, afgeeft, bewaart een
      afschrift daarvan gedurende tien jaar na het in de handel brengen van de lift.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel10
  - number: '10.3'
    text: |-
      Afschriften van de EG-verklaring van overeenstemming, alsmede van de verslagen van de proeven in verband met de
      eindcontrole, bedoeld in bijlage VI van de richtlijn, worden desgevraagd door de fabrikant aan de Commissie van de
      Europese Gemeenschappen, de lid-staten of andere keuringsinstanties ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel10
  - number: '11.1'
    text: |-
      Van voorgenomen wijzigingen in een lift, het model van een lift of het model van een veiligheidscomponent waarvoor
      een certificaat van EG-typeonderzoek is afgegeven, wordt de keuringsinstantie die dit certificaat heeft afgegeven
      onverwijld in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel11
  - number: '11.2'
    text: |-
      De in het eerste lid bedoelde keuringsinstantie beoordeelt de wijzigingen en deelt mee of het certificaat van EG-
      typeonderzoek voor de gewijzigde lift of het gewijzigde model geldig is dan wel aanvullingen behoeft.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel11
  - number: '11.3'
    text: |-
      Indien de in het eerste lid bedoelde keuringsinstantie van oordeel is dat de wijzigingen van invloed kunnen zijn
      op de overeenstemming met de in bijlage I van de richtlijn opgenomen essentiële veiligheids- en gezondheidseisen,
      wordt de gewijzigde lift of het gewijzigde model aan het in bijlage V van de richtlijn bedoelde EG-typeonderzoek
      onderworpen en wordt bij goedkeuring een aanvulling op het oorspronkelijke certificaat afgegeven.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel11
  - number: '12'
    text: Een gedraging in strijd met de artikelen 8, 9, 10 en 11 is verboden.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel12
  - number: '13'
    text: |-
      De verplichtingen van de [artikelen 8][ref1], [9][ref2] en [11][ref3] rusten tevens op degene die voor eigen
      gebruik een lift of veiligheidscomponent bouwt.


      [ref1]: https://wetten.overheid.nl/BWBR0008212#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0008212#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0008212#Artikel11
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008212
        artikel: '8'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0008212
        artikel: '9'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0008212
        artikel: '11'
        hoofdstuk: III
  - number: '14'
    text: |-
      Liften en veiligheidscomponenten die zijn voorzien van de CE-markering en vergezeld gaan van de EG-verklaring van
      overeenstemming worden vermoed te voldoen aan [artikel 5, tweede, respectievelijk derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008212#Artikel5
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008212
        artikel: '5'
        hoofdstuk: II
  - number: '15.1'
    text: |-
      De CE-markering, in voorkomend geval gevolgd door het identificatienummer van de keuringsinstantie, en de
      minimumaanwijzingen, plaat en instructies, bedoeld in punt 5 van bijlage I van de richtlijn, worden duidelijk
      zichtbaar in iedere kooi aangebracht.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel15
  - number: '15.2'
    text: |-
      De CE-markering, in voorkomend geval gevolgd door het identificatienummer van de keuringsinstantie, wordt op elke
      veiligheidscomponent aangebracht. Indien dit niet mogelijk is, wordt de CE-markering aangebracht op een etiket dat
      vast met de veiligheidscomponent is verbonden.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel15
  - number: '15.3'
    text: |-
      Op liften en veiligheidscomponenten worden geen merktekens aangebracht die derden kunnen misleiden omtrent de
      betekenis of grafische vorm van de CE-markering. Andere merktekens mogen worden aangebracht op voorwaarde dat de
      zichtbaarheid en leesbaarheid van de CE-markering er niet door worden verminderd.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel15
  - number: '16'
    text: |-
      De keuringsinstantie trekt een door haar afgegeven certificaat van EG-typeonderzoek in, indien de essentiële
      veiligheids- en gezondheidseisen van bijlage I van de richtlijn zodanig zijn gewijzigd dat het model niet voldoet
      aan de gewijzigde eisen op het tijdstip waarop deze volgens de richtlijn van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel16
  - number: '17'
    text: |-
      Liften worden vóór de ingebruikneming, ten hoogste twaalf maanden na de ingebruikneming en vervolgens telkens na
      verloop van ten hoogste achttien maanden gekeurd. Indien bij de keuring blijkt dat een lift ten minste voldoet aan
      de vervaardigingsvoorschriften van artikel 5 wordt een certificaat van goedkeuring afgegeven.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel17
  - number: '18.1'
    text: |-
      Een lift gaat vergezeld van een instructieboek en een liftboek als bedoeld in punt 6.2 van bijlage I van de
      richtlijn.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel18
  - number: '18.2'
    text: |-
      Een veiligheidscomponent gaat vergezeld van een instructieboek als bedoeld in punt 6.1 van bijlage I van de
      richtlijn.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel18
  - number: '19.1'
    text: |-
      Degene die een lift voorhanden heeft, die in gebruik of voor gebruik gereed is, of die een lift aflevert of
      tentoonstelt, is verplicht ervoor te zorgen dat die lift en de daarop aangebrachte veiligheidscomponenten in goede
      staat van onderhoud verkeren.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel19
  - number: '19.2'
    text: |-
      Degene die een lift voorhanden heeft of gebruikt is verplicht ervoor te zorgen dat die lift en de daarop
      aangebrachte veiligheidscomponenten overeenkomstig hun bestemming worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel19
  - number: '19.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing voor zover de lift hetzij is afgekeurd hetzij is onklaar gemaakt
      hetzij anderszins kennelijk niet meer voor gebruik is bestemd.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel19
  - number: '20'
    text: 'Degene die een lift voorhanden heeft, is verplicht ervoor te zorgen dat:'
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel20
  - number: 20.a
    text: |-
      in liftschachten geen leidingen of installaties worden aangebracht die niet voor de werking of veiligheid van de
      lift zijn vereist;
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel20
  - number: 20.b
    text: |-
      machinekamers, schijvenruimten en schachtputten niet worden gebruikt als bergruimte van voorwerpen, welke niet tot
      de lift behoren;
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel20
  - number: 20.c
    text: machinekamers, schijvenruimten en luiken, bestemd voor inspectie en onderhoud, zijn afgesloten met slot en sleutel;
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel20
  - number: 20.d
    text: |-
      de onder c bedoelde sleutels zijn voorzien van aanduidingen en op een uitsluitend voor bevoegden toegankelijke
      plaats worden bewaard;
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel20
  - number: 20.e
    text: |-
      in de machinekamers een aanwijzing is opgehangen, waarin is aangegeven, op welke wijze de machine kan worden
      getornd.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel20
  - number: '21'
    text: |-
      Degene die een lift voorhanden heeft, welke is voorzien van een merk van afkeuring is verplicht er voor te zorgen
      dat de schachtdeuren van de lift niet zonder bijzondere hulpmiddelen kunnen worden geopend en op of nabij elke
      schachtdeur van de lift duidelijk en opvallend een opschrift is aangebracht waaruit blijkt dat de lift buiten
      dienst is gesteld.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel21
  - number: '22'
    text: |-
      Liften of veiligheidscomponenten die niet in overeenstemming zijn met dit besluit mogen op (jaar-)beurzen,
      exposities en bij demonstraties worden tentoongesteld en gedemonstreerd, mits op een zichtbaar bord is aangegeven
      dat de liften en veiligheidscomponenten niet in overeen-stemming zijn met dit besluit en niet te koop zijn voordat
      zij door de fabrikant of zijn in de Europese Economische Ruimte gevestigde gemachtigde, in overeenstemming zijn
      gebracht met dit besluit. Bij demonstraties zijn alle nodige veiligheidsmaatregelen genomen om de bescherming van
      personen te waarborgen.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel22
  - number: '23.1'
    text: |-
      Het is verboden een op een lift of een veiligheidscomponent aangebracht merk van afkeuring te verwijderen, te
      beschadigen of onleesbaar te maken.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel23
  - number: '23.2'
    text: |-
      Het verbod, bedoeld in het eerste lid, geldt niet ten aanzien van de ambtenaren die op grond van artikel 12, eerste
      lid, eerste zin, van de wet ten aanzien van liften en veiligheidscomponenten aangewezen zijn.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel23
  - number: '23.3'
    text: Bij ministeriële regeling worden ten aanzien van merken van afkeuring nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel23
  - number: '24.1'
    text: |-
      Indien naar het oordeel van Onze Minister bepaalde liften of veiligheidscomponenten die voorzien zijn van de CE-
      markering, op passende wijze zijn geïnstalleerd en worden onderhouden en overeenkomstig hun bestemming worden
      gebruikt, desondanks gevaar opleveren voor de veiligheid of de gezondheid van personen of goederen, kan hij
      de fabrikant, diens in de Europese Economische Ruimte gevestigde gemachtigde dan wel degene die deze liften of
      veiligheidscomponenten in de Europese Economische Ruimte in de handel brengt, gelasten om de bezitters dan wel de
      vermoedelijke bezitters van die liften of veiligheidscomponenten, onverwijld en op doeltreffende wijze op de hoogte
      te stellen van het gevaar.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel24
  - number: '24.2'
    text: |-
      Indien de fabrikant, diens in de Europese Economische Ruimte gevestigde gemachtigde dan wel degene die deze liften
      of veiligheidscomponenten in de Europese Economische Ruimte in de handel brengt, de krachtens het eerste lid
      gelaste maatregelen niet onverwijld of niet op doeltreffende wijze uitvoert, kan Onze Minister die maatregelen
      treffen op kosten van de genoemde personen.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel24
  - number: '24.3'
    text: |-
      Onze Minister geeft van de maatregelen of de intrekking daarvan onverwijld kennis aan betrokkenen en de Commissie
      van de Europese Gemeenschappen en doet daarvan mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel24
  - number: '25.1'
    text: |-
      Indien naar het oordeel van Onze Minister bepaalde liften of veiligheidscomponenten die voorzien zijn van de CE-
      markering, op passende wijze zijn geïnstalleerd en worden onderhouden en overeenkomstig hun bestemming worden
      gebruikt, gevaar opleveren voor de veiligheid of de gezondheid van personen of goederen, kan hij:
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel25
  - number: 25.1.a
    text: |-
      een verbod uitvaardigen tot het vervaardigen, het in Nederland invoeren, verhandelen en in bedrijf stellen van die
      liften of veiligheidscomponenten, of
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel25
  - number: 25.1.b
    text: |-
      de fabrikant, diens in de Europese Economische Ruimte gevestigde gemachtigde dan wel degene die deze liften of
      veiligheidscomponenten in de Europese Economische Ruimte in de handel brengt, verplichten om overeenkomstig de
      daarbij gegeven aanwijzingen passende maatregelen te nemen om die liften en veiligheidscomponenten zoveel mogelijk
      uit de handel te nemen.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel25
  - number: '25.2'
    text: |-
      Onze Minister neemt een maatregel krachtens het eerste lid in overeenstemming met Onze Ministers wie het mede
      aangaat.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel25
  - number: '25.3'
    text: |-
      Onze Minister geeft van de maatregelen of de intrekking daarvan onverwijld kennis aan betrokkenen en de Commissie
      van de Europese Gemeenschappen en doet daarvan mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel25
  - number: '25.4'
    text: Een gedraging in strijd met een krachtens het eerste lid genomen maatregel is verboden.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel25
  - number: '26.1'
    text: |-
      Voor een aanwijzing als keuringsinstantie komen in aanmerking instanties die ten minste voldoen aan de in bijlage
      VII van de richtlijn neergelegde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel26
  - number: '26.2'
    text: Bij ministeriële regeling kunnen aan de keuringsinstantie nadere voorwaarden worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel26
  - number: '27'
    text: |-
      Een wijziging van een van de bijlagen van de richtlijn waarnaar in dit besluit wordt verwezen, treedt voor
      de toepassing van dit besluit en de daarop gebaseerde bepalingen in werking met ingang van de dag waarop aan
      de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de
      Staatscourant wordt bekend gemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel27
  - number: 27a
    text: |-
      Artikel 10, derde lid, van de wet is mede van toepassing op het voorhanden hebben en het gebruiken van een lift in
      de huishouding.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel27a
  - number: '28.1'
    text: |-
      Dit besluit is niet van toepassing op liften en veiligheidscomponenten die voor 1 juli 1997 in bedrijf zijn
      gesteld.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel28
  - number: '28.2'
    text: 'Dit besluit is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel28
  - number: 28.2.a
    text: |-
      liften en veiligheidscomponenten die zijn vervaardigd in overeenstemming met de bepalingen van het
      [Liftenbesluit I][ref1] en voor 1 juli 1999 in de handel zijn gebracht en in bedrijf zijn gesteld, voor zover zij
      niet alsnog in overeenstemming zijn gebracht met artikel 5;


      [ref1]: https://wetten.overheid.nl/BWBR0002212
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002212
  - number: 28.2.b
    text: |-
      veiligheidscomponenten die zijn voorzien van het EEG-merkteken en vergezeld gaan van het certificaat van
      overeenstemming, bedoeld in artikel 6 van de regeling van de Staatssecretaris van Sociale Zaken en Werkgelegenheid
      van 16 juni 1987 ter uitvoering van de EEG-[richtlijnen 84/528/EEG](31984L0528) en [84/529/EEG](31984L0529) (hef-
      en verladingsapparatuur; liften met elektrische aandrijving) (Stcrt. 1987, 124) en voor 1 juli 1999 in de handel
      zijn gebracht en in bedrijf zijn gesteld, voor zover zij niet alsnog in overeenstemming zijn gebracht met artikel
      5.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel28
  - number: '28.3'
    text: |-
      Met betrekking tot de liften en veiligheidscomponenten, bedoeld in de voorgaande leden, waarop dit besluit niet
      wordt toegepast en waarop ingevolge een of meer andere wettelijke regelingen de CE-markering wordt aangebracht,
      worden op de bij die liften of veiligheidscompo-nenten gevoegde documenten, handleidingen of gebruiksaanwijzingen
      de in het Publikatieblad van de Europese Gemeenschappen bekend-gemaakte referenties van de aan die wettelijke
      regelingen ten grondslag liggende richtlijnen vermeld.
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel28
  - number: '33'
    text: 'Dit besluit treedt in werking met ingang van 1 juli 1997 met dien verstande dat:'
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel33
  - number: 33.a
    text: |-
      [artikel 29, onderdeel A][ref1], in werking treedt met ingang van de dag na de datum van uitgifte van het
      Staatsblad waarin dit besluit wordt geplaatst en terugwerkt tot en met 1 januari 1995,


      [ref1]: https://wetten.overheid.nl/BWBR0008212#Artikel29
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0008212
        artikel: '29'
        hoofdstuk: VII
  - number: 33.b
    text: |-
      [artikel 29, onderdeel B][ref1], in werking treedt met ingang van 1 januari 1997.


      [ref1]: https://wetten.overheid.nl/BWBR0008212#Artikel29
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0008212
        artikel: '29'
        hoofdstuk: VII
  - number: '34'
    text: 'Dit besluit wordt aangehaald als: Besluit liften.'
    url: https://wetten.overheid.nl/BWBR0008212/1998-12-23#Artikel34
