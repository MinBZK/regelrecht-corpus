articles:
  - number: '1'
    text: |-
      1 Er is een zone als bedoeld in [artikel 108, eerste lid, van de Wet geluidhinder][ref1] rond het industrieterrein
      Tweede Maasvlakte, voor zover deze zone ligt in het deel van de Noordzee dat niet gemeentelijk is ingedeeld.

      2 De grenzen van de zone zijn aangegeven op de kaart in de bij dit besluit behorende bijlage.

      3 Buiten de in het eerste lid bedoelde zone mag de geluidsbelasting vanwege het industrieterrein Tweede Maasvlakte
      de waarde van 50 dB(A) niet overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel108
    url: https://wetten.overheid.nl/BWBR0023850/2008-05-16#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '108'
  - number: '2'
    text: |-
      Als bevoegd gezag voor de uitoefening van de in de [Wet geluidhinder][ref1] vervatte bevoegdheden wordt het college
      van burgemeester en wethouders van de gemeente Rotterdam aangewezen. Dit betrekt het college van burgemeester en
      wethouders van de gemeente Westvoorne en provinciale staten van de provincie Zuid-Holland bij de uitvoering.


      [ref1]: https://wetten.overheid.nl/BWBR0003227
    url: https://wetten.overheid.nl/BWBR0023850/2008-05-16#Artikel2
