preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 30 oktober 2003, nr. HDJZ/AWW/2003-2080,
    Hoofddirectie Juridische Zaken;

    Gelet op richtlijn nr. 2001/56/EG van het Europees Parlement en de Raad van 27 september 2001 inzake de
    verwarming van motorvoertuigen en aanhangwagens daarvan en tot wijziging van Richtlijn 70/156/EEG van de Raad
    en tot intrekking van Richtlijn 78/548/EEG van de Raad (PbEG L 292) en de artikelen 21, 22, 26 en 34 van de
    Wegenverkeerswet 1994;

    De Raad van State gehoord (advies van 19 december 2003, nr. W09.030457/V);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 27 januari 2004, nr. HDJZ/AWW/2004-14,
    Hoofddirectie Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0016356/2004-05-09#ArtikelAanhef
articles:
  - number: II
    text: |-
      Op verzoek van de fabrikant wordt tot 9 mei 2004 voor personenauto's, alsmede voor verwarmingssystemen op brandstof
      voor personenauto's, bedrijfsauto's en aanhangwagens, een typegoedkeuring verleend als bedoeld in artikel 4, eerste
      lid, van [richtlijn nr. 2001/56/EG](32001L0056) van het Europees Parlement en de Raad van 27 september 2001 inzake
      de verwarming van motorvoertuigen en aanhangwagens daarvan en tot wijziging van [Richtlijn 70/156/EEG](31970L0156)
      van de Raad en tot intrekking van [Richtlijn 78/548/EEG](31978L0548) van de Raad (PbEU L 292).
    url: https://wetten.overheid.nl/BWBR0016356/2004-05-09#ArtikelII
  - number: III
    text: |-
      1 Dit besluit treedt, met uitzondering van [artikel I, onder G][ref1], in werking met ingang van de eerste dag na
      de datum van uitgifte van het Staatsblad waarin het wordt geplaatst.

      2 [Artikel I, onder G][ref2], treedt in werking met ingang van 9 mei 2004.


