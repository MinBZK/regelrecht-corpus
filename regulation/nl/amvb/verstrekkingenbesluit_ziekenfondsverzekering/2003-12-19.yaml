        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002520
        artikel: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002520
        artikel: '2'
        paragraaf: '1'
  - number: '34.2'
    text: |-
      De [artikelen 2, onder ][ref1], [6][ref2] en [8-10][ref3], treden in werking op een nader door Ons te bepalen
      tijdstip, dat voor de onderscheidene artikelen verschillend kan worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002520#Artikel2
