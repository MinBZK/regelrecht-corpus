$id: verstrekkingenbesluit_ziekenfondsverzekering
regulatory_layer: AMVB
publication_date: '2005-11-01'
valid_from: '2003-12-19'
bwb_id: BWBR0002520
url: https://wetten.overheid.nl/BWBR0002520/2003-12-19
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Volksgezondheid en de Staatssecretaris van Sociale Zaken
    en Volksgezondheid van 28 december 1965, Directoraat-Generaal van de Volksgezondheid, Directie Gezondheidszorg,
    Hoofdafdeling Gezondheidszorg I, nr. 132.299;

    Gelet op de artikelen 8, tweede lid, 9, 10, 13, eerste lid, 24, 30, 47, tweede lid, en 93 van de Ziekenfondswet
    (Stb. 1964, 392);

    De Raad van State gehoord (advies van 30 december 1965, nr. 65);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Volksgezondheid en de Staatssecretaris van
    Sociale Zaken en Volksgezondheid van 31 december 1965, Directoraat-Generaal voor de Volksgezondheid, Directie
    Gezondheidszorg, Hoofdafdeling Gezondheidszorg I, nr. 160.009;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel1
  - number: 1.a
    text: '"Onze Minister": Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel1
  - number: 1.b
    text: |-
      "specialist": een arts, die is ingeschreven in het specialistenregister van de Koninklijke Nederlandse Maatschappij
      tot Bevordering der Geneeskunst;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel1
  - number: 1.c
    text: |-
      "tandarts-specialist": een tandarts, die is ingeschreven in het specialistenregister voor mondheelkunde en
      chirurgische prothetiek, dan wel in het specialistenregister voor dentomaxillaire orthopaedie van de Nederlandsche
      Maatschappij tot Bevordering der Tandheelkunde;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel1
  - number: 1.d
    text: |-
      "huisarts": een arts, die is ingeschreven in het register van erkende huisartsen van de Koninklijke Nederlandse
      Maatschappij tot Bevordering der Geneeskunst;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel1
  - number: 1.e
    text: |-
      bedrijfsarts: een arts die als arts arbeid en gezondheid, bedrijfsarts, is ingeschreven in het register van
      erkende Sociaal Geneeskundigen, dat wordt bijgehouden door de Sociaal-Geneeskundigen Registratie Commissie van de
      Koninklijke Nederlandsche Maatschappij tot Bevordering der Geneeskunst;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel1
  - number: 1.f
    text: |-
      arbodienst: een arbodienst als bedoeld in
      [artikel 1, derde lid, onder j, van de Arbeidsomstandighedenwet 1998][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel1
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '1'
  - number: '2.1'
    text: |-
      De verzekerden hebben naast de verstrekkingen, genoemd in [artikel 8, eerste lid, van de Ziekenfondswet][ref1],
      aanspraak op:


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel8
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '8'
  - number: 2.1.a
    text: ziekenvervoer;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel2
  - number: 2.1.b
    text: hulp door een audiologisch centrum;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel2
  - number: 2.1.c
    text: erfelijkheidsadvisering;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel2
  - number: 2.1.d
    text: niet-klinische haemodialyse;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel2
  - number: 2.1.e
    text: chronische intermitterende beademing;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel2
  - number: 2.1.f
    text: onderzoek in het kader van tuberculose of tuberculose-infectie;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel2
  - number: 2.1.g
    text: hulp door een trombosedienst; een en ander met inachtneming van het bij of krachtens dit besluit bepaalde.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel2
  - number: '2.2'
    text: |-
      Indien het ziekenfonds als gevolg van de toepassing van [artikel 9, vijfde lid, van de Ziekenfondswet][ref1], een
      verzekerde heeft ingeschreven op naam van een persoon of instelling, wordt de desbetreffende verstrekking verleend
      door de betrokken persoon of diens waarnemer, onderscheidenlijk de betrokken instelling, een en ander onverlet
      hetgeen elders is bepaald omtrent het verlenen van de genoemde hulp door een andere persoon of instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel9
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '9'
  - number: 2a.1
    text: |-
      De aanspraak op een verstrekking kan slechts tot gelding worden gebracht voor zover de verzekerde, gelet op zijn
      behoefte en uit een oogpunt van doelmatige zorgverlening, redelijkerwijs daarop naar aard, inhoud en omvang is
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel2a
  - number: 2a.2
    text: |-
      Onverminderd hetgeen bij of krachtens dit besluit wordt bepaald, kan het ziekenfonds schriftelijk de voorwaarden
      vaststellen waaronder de aanspraken tot gelding worden gebracht.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel2a
  - number: '3.1'
    text: |-
      Huisartsenzorg te verlenen door een huisarts omvat genees- en heelkundige zorg naar de omvang bepaald door hetgeen
      in de kring der beroepsgenoten gebruikelijk is, met uitzondering van vaccinatie ten behoeve van preventie van
      influenza.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel3
  - number: '3.2'
    text: |-
      De plaats waar de in het eerste lid bedoelde zorg wordt verleend, wordt bepaald door hetgeen in de kring der
      beroepsgenoten gebruikelijk is.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel3
  - number: '5.1'
    text: 'Paramedische zorg omvat:'
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel5
  - number: 5.1.a
    text: |-
      door een huisarts, bedrijfsarts of specialist voorgeschreven zorg, te verlenen door heilgymnasten-masseurs,
      fysiotherapeuten en oefentherapeuten;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel5
  - number: 5.1.b
    text: |-
      door een huisarts, bedrijfsarts, specialist of tandarts-specialist voorgeschreven zorg, te verlenen door
      logopedisten;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel5
  - number: 5.1.c
    text: |-
      door een huisarts, bedrijfsarts, specialist of verpleeghuisarts voorgeschreven advisering, instructie, training of
      behandeling gedurende maximaal 10 uren per kalenderjaar, te verlenen door een ergotherapeut in zijn behandelruimte
      of ten huize van de verzekerde, met als doel de zelfzorg en zelfredzaamheid van de verzekerde te bevorderen of
      te herstellen.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel5
  - number: '5.2'
    text: |-
      Indien de zorg, bedoeld in het eerste lid, plaatsvindt op voorschrift van een bedrijfsarts, bestaat slechts
      aanspraak op deze zorg indien het ziekenfonds met de verwijzende bedrijfsarts of de arbodienst waaraan deze
      bedrijfsarts is verbonden, schriftelijk afspraken heeft gemaakt over de kwaliteit en doelmatigheid van de
      verwijzing, de wijze waarop afstemming en overleg plaatsvinden met personen of instellingen die aan de verzekerde
      zorg verlenen of kunnen verlenen, en de controle op de naleving van de afspraken.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel5
  - number: '5.3'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de omvang van de zorg, bedoeld in het eerste
      lid, onder a en b, de voorwaarden waaronder aanspraak bestaat en de plaats waar de zorg wordt verleend.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel5
  - number: '6'
    text: De verloskundige zorg omvat de door verloskundigen en huisartsen te verlenen verloskundige zorg.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel6
  - number: '7.1'
    text: |-
      De tandheelkundige zorg aan de verzekerde die de leeftijd van 18 jaren nog niet heeft bereikt omvat in de omvang en
      onder de voorwaarden nader door Onze Minister vast te stellen tandheelkundige zorg, te verlenen:
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel7
  - number: 7.1.a
    text: door of vanwege een instelling voor jeugdtandverzorging;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel7
  - number: 7.1.b
    text: door een tandarts;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel7
  - number: 7.1.c
    text: door een tandarts-specialist.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel7
  - number: '7.2'
    text: |-
      De tandheelkundige zorg aan de verzekerde die de leeftijd van 18 jaren heeft bereikt omvat in de omvang en onder
      de voorwaarden nader door Onze Minister vast te stellen tandheelkundige zorg, te verlenen door een tandarts of een
      tandarts-specialist.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel7
  - number: '7.3'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat de verzekerde een bijdrage is verschuldigd in de kosten van de
      zorg die hij ontvangt in verband met een ernstige tandheelkundige aandoening, een niet-tandheelkundige lichamelijke
      of een geestelijke aandoening.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel7
  - number: '7.4'
    text: Onze Minister kan bepalen dat de verzekerde
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel7
  - number: 7.4.a
    text: |-
      ingeval van verrichtingen van een bijzondere moeilijkheidsgraad danwel indien voor zodanige verrichtingen een
      multidisciplinaire diagnostiek of behandeling is aangewezen,
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel7
  - number: 7.4.b
    text: |-
      ingeval van verrichtingen onder bijzonder moeilijke omstandigheden door de samenhang met een niet-tandheelkundige
      lichamelijke of geestelijke aandoening danwel indien voor verrichtingen onder zodanige omstandigheden een
      multidisciplinaire diagnostiek of behandeling is aangewezen,
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel7
  - number: '7.5'
    text: De bijdrage wordt betaald aan degene die de zorg verleent.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel7
  - number: '8.1'
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel8
  - number: 8.1.a
    text: |-
      geneesmiddel: een geneesmiddel dat op grond van de [Wet op de Geneesmiddelenvoorziening][ref1] in Nederland mag
      worden afgeleverd;


      [ref1]: https://wetten.overheid.nl/BWBR0002290
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002290
  - number: 8.1.b
    text: |-
      specialité: een geneesmiddel als bedoeld in
      [artikel 1, eerste lid, onder h, van de Wet op de Geneesmiddelenvoorziening][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel1
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '1'
  - number: 8.1.c
    text: |-
      preparaat: een geneesmiddel als bedoeld in
      [artikel 1, eerste lid, onder i, van de Wet op de Geneesmiddelenvoorziening][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel1
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '1'
  - number: 8.1.d
    text: |-
      branded generic: een specialité dat in de handel wordt gebracht onder een benaming waarin de stofnaam is vermeld en
      waaraan een merkaanduiding is toegevoegd;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel8
  - number: 8.1.e
    text: 'combinatiepreparaat: een geneesmiddel dat meer dan een werkzaam bestanddeel bevat;'
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel8
  - number: 8.1.f
    text: |-
      geregistreerd geneesmiddel: een geneesmiddel dat is ingeschreven in het register, bedoeld in
      [artikel 3 van de Wet op de Geneesmiddelenvoorziening][ref1], of voor het in de handel brengen waarvan de
      Gemeenschap ingevolge de [Verordening (EEG) nr. 2309/93](31993R2309) van de Raad van de Europese Gemeenschappen van
      22 juli 1993 tot vaststelling van communautaire procedures voor het verlenen van vergunningen voor en het toezicht
      op geneesmiddelen voor menselijk en diergeneeskundig gebruik en tot oprichting van een Europees bureau voor de
      geneesmiddelenbeoordeling (*PbEG* L 214) een vergunning heeft afgegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel3
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '3'
  - number: 8.1.g
    text: |-
      deel IB van het registerdossier: het registerblad, inhoudende de gegevens, bedoeld in
      [artikel 2, eerste lid, onder h, van het Besluit registratie geneesmiddelen][ref1] of het registerblad, bedoeld
      in deel I, onderdeel B, van de bijlage van de [richtlijn nr. 75/318/EEG](31975L0318) van de Raad van de Europese
      Gemeenschappen van 20 mei 1975 betreffende de onderlinge aanpassing van de wetgevingen van de Lid-Staten inzake
      de analytische, toxicologisch-farmacologische en klinische normen en voorschriften betreffende proeven op
      farmaceutische specialiteiten (*PbEG* L 147/1);


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel2
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '2'
  - number: 8.1.h
    text: |-
      registratiehouder: degene te wiens naam een geneesmiddel in het register, bedoeld in
      [artikel 3, eerste lid, van de Wet op de Geneesmiddelenvoorziening][ref1] staat ingeschreven dan wel degene die
      voor een geneesmiddel een vergunning heeft ingevolge de [Verordening (EEG) nr. 2309/93](31993R2309) van de Raad
      van de Europese Gemeenschappen van 22 juli 1993 tot vaststelling van communautaire procedures voor het verlenen van
      vergunningen voor en het toezicht op geneesmiddelen voor menselijk en diergeneeskundig gebruik en tot oprichting
      van een Europees bureau voor de geneesmiddelenbeoordeling (*PbEG* L 214);


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel3
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '3'
  - number: 8.1.i
    text: 'Taxe: de Taxe, uitgegeven door de Z-index B.V.;'
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel8
  - number: 8.1.j
    text: |-
      Defined Daily Dose: de dagdosis van een geneesmiddel, als vastgesteld onder verantwoordelijkheid van het WHO
      Collaborating Centre for Drug Statistics Methodology;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel8
  - number: 8.1.k
    text: |-
      Anatomical Therapeutic Chemical Classification: de classificatie van geneesmiddelen, samengesteld onder
      verantwoordelijkheid van het WHO Collaborating Centre for Drug Statistics Methodology;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel8
  - number: 8.1.l
    text: |-
      standaardkuur: de totale hoeveelheid van het werkzaam bestanddeel van een geneesmiddel die, blijkens de dosering,
      vermeld in deel IB van het registerdossier, wordt gegeven;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel8
  - number: 8.1.m
    text: |-
      referentiehoeveelheid: die hoeveelheid van een werkzaam bestanddeel, in een farmaceutische vorm gebracht, waarmee,
      gegeven de standaarddosis en het gebruikelijke aantal keren per dag dat het geneesmiddel wordt gegeven om die
      standaarddosis te bereiken, de gebruikelijke dagelijkse dosering kan worden bereikt, met dien verstande dat bij
      keuze tussen een retardvorm en een niet-retardvorm wordt uitgegaan van de niet-retardvorm.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel8
  - number: '8.2'
    text: 'Bij de toepassing van deze paragraaf wordt uitsluitend acht geslagen op:'
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel8
  - number: 8.2.a
    text: deel IB van het registerdossier,
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel8
  - number: 8.2.b
    text: |-
      de publicaties onder auspiciën van de Wereldgezondheidsorganisatie over de Defined Daily Dose en de Anatomical
      Therapeutical Chemical Classification,
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel8
  - number: 8.2.c
    text: de in medisch-farmaceutische kringen gebruikelijke farmacologische en farmacotherapeutische handboeken,
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel8
  - number: 8.2.d
    text: |-
      publicaties in tijdschriften die in medisch-farmaceutische kringen als betrouwbare bronnen voor
      geneesmiddeleninformatie gelden,
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel8
  - number: 8.2.e
    text: gegevens afkomstig van farmaco-economisch onderzoek, en
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel8
  - number: 8.2.f
    text: |-
      andere gegevens en bescheiden die voldoen aan de regels ingevolge
      [artikel 2, zesde lid, van het Besluit registratie geneesmiddelen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel2
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '2'
  - number: '8.3'
    text: |-
      Bij ministeriële regeling kunnen voorwaarden worden gesteld waaraan farmaco-economisch onderzoek voor de toepassing
      van deze paragraaf moet voldoen.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel8
  - number: '9.1'
    text: 'Farmaceutische zorg omvat de aflevering van:'
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel9
  - number: 9.1.a
    text: de bij ministeriële regeling aangewezen geregistreerde geneesmiddelen;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel9
  - number: 9.1.b
    text: |-
      andere dan geregistreerde geneesmiddelen die op grond van de [Wet op de Geneesmiddelenvoorziening][ref1] in
      Nederland mogen worden afgeleverd, indien behandeling met die middelen als rationele farmacotherapie kan worden
      aangemerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0002290
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002290
  - number: 9.1.c
    text: polymere, oligomere, monomere en modulaire dieetpreparaten;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel9
  - number: 9.1.d
    text: verbandmiddelen.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel9
  - number: '9.2'
    text: 'Ingevolge het eerste lid, onder *a*, worden niet aangewezen:'
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel9
  - number: 9.2.a
    text: |-
      geneesmiddelen die op grond van de [Wet op de Geneesmiddelenvoorziening][ref1] zonder recept mogen worden
      afgeleverd en andere geneesmiddelen met eenzelfde werkzaam bestanddeel en in eenzelfde toedieningsvorm, tenzij
      aanwijzing van een geneesmiddel om bijzondere redenen noodzakelijk is te achten;


      [ref1]: https://wetten.overheid.nl/BWBR0002290
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002290
  - number: 9.2.b
    text: |-
      vaccins ter bescherming tegen besmettelijke ziekten, tenzij aanwijzing daarvan om bijzondere redenen noodzakelijk
      is te achten;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel9
  - number: 9.2.c
    text: |-
      geneesmiddelen als bedoeld in [artikel 1 van het Besluit homeopathische farmaceutische producten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005371#Artikel1
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005371
        artikel: '1'
  - number: 9.2.d
    text: |-
      geneesmiddelen waarvoor geen vergoedingslimiet als bedoeld in [artikel 11a][ref1] kan worden vastgesteld, tenzij
      Onze Minister in verband met de therapeutische waarde en de doelmatigheid van het geneesmiddel van oordeel is dat
      het belang van de volksgezondheid vergt dat verzekerden toegang tot dat middel hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0002520#Artikel11a
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002520
        artikel: 11a
        paragraaf: '5'
  - number: '9.3'
    text: 'In afwijking van het eerste lid omvat de farmaceutische zorg niet de aflevering van:'
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel9
  - number: 9.3.a
    text: geneesmiddelen, indien niet voldaan is aan de daarvoor bij ministeriële regeling vastgestelde voorwaarden;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel9
  - number: 9.3.b
    text: geneesmiddelen uit voorzorg of ter voorkoming van een ziekte aan verzekerde af te leveren met het oog op een reis;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel9
  - number: 9.3.c
    text: |-
      geneesmiddelen als bedoeld in de [artikelen 54][ref1] en
      [55 van het Besluit bereiding en aflevering van farmaceutische produkten][ref2], tenzij het een
      verzekerde betreft die lijdt aan een in Nederland zelden voorkomende ziekte, te wiens behoeve het
      ziekenfonds vooraf toestemming heeft verleend voor de aflevering van een geneesmiddel als bedoeld in
      [artikel 54, eerste lid, onder d, van dat besluit][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0003127#Artikel54
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '54'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '55'
      - id: ref3
        bwb_id: BWBR0003127
        artikel: '54'
  - number: 9.3.d
    text: |-
      dieetpreparaten, tenzij het een verzekerde betreft die lijdt aan een ernstige slikstoornis, een ernstige
      passagestoornis, een ernstige resorptiestoornis, een ernstige voedselallergie, een ernstige stofwisselingsstoornis,
      chronisch obstructief longlijden, cystische fibrose of een ernstige congenitaal hartfalen en bij dat hartfalen een
      dreigende groeiachterstand heeft;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel9
  - number: 9.3.e
    text: |-
      verbandmiddelen, tenzij het een verzekerde betreft met een ernstige aandoening waarbij een langdurige medische
      behandeling met deze middelen is aangewezen;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel9
  - number: 9.3.f
    text: |-
      een geneesmiddel als bedoeld in het eerste lid, onder b, dat gelijkwaardig of nagenoeg gelijkwaardig is aan enig
      niet aangewezen geregistreerd geneesmiddel.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel9
  - number: 9a.1
    text: |-
      Het ziekenfonds kan schriftelijk vaststellen dat de bij hem ingeschreven verzekerden in afwijking van artikel 9,
      eerste lid, aanhef en onder a, slechts aanspraak hebben op aflevering van de door hem aangewezen geregistreerde
      geneesmiddelen.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel9a
  - number: 9a.2
    text: |-
      De aanwijzing geschiedt zodanig dat de werkzame stoffen die voorkomen in de geneesmiddelen, aangewezen ingevolge
      artikel 9, eerste lid, aanhef en onder a, voor de verzekerden beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel9a
  - number: 9a.3
    text: |-
      Een beperking van de aanspraak als bedoeld in het eerste lid is niet van toepassing voor zover behandeling met een
      aangewezen geneesmiddel voor een verzekerde medisch niet verantwoord is.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel9a
  - number: '10.1'
    text: 'De verzekerde heeft slechts aanspraak op farmaceutische zorg indien de zorg is voorgeschreven door:'
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel10
  - number: 10.1.a
    text: een arts, tandarts of verloskundige wiens zorg de verzekerde ingevolge dit besluit heeft ingeroepen;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel10
  - number: 10.1.b
    text: |-
      een arts verbonden aan een consultatiebureau voor geboorteregeling, een persoon of instelling die zorg verleent als
      bedoeld in [artikel 8 van het Besluit zorgaanspraken AWBZ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014149#Artikel8
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0014149
        artikel: '8'
  - number: 10.1.c
    text: |-
      een arts die is verbonden aan een gemeentelijke gezondheidsdienst, en de zorg strekt ter behandeling van
      tuberculose of tuberculose-infectie.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel10
  - number: '10.2'
    text: |-
      De verzekerde heeft aanspraak op een van de geneesmiddelen die de stof bevatten waarvan de stofnaam is vermeld op
      het voorschrift.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel10
  - number: '11.1'
    text: 'De verzekerde heeft per voorschrift aanspraak op geneesmiddelen voor een periode van ten hoogste:'
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11
  - number: 11.1.a
    text: een half jaar, indien het orale anticonceptiva betreft;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11
  - number: 11.1.b
    text: |-
      drie maanden, indien het geneesmiddelen betreft ter behandeling van een chronische ziekte, met uitzondering van
      hypnotica of anxiolytica;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11
  - number: 11.1.c
    text: |-
      vijftien dagen, indien het geneesmiddelen ter bestrijding van acute aandoeningen met antibiotica of
      chemotherapeutica betreft;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11
  - number: 11.1.d
    text: een maand, in de overige gevallen.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11
  - number: '11.2'
    text: |-
      In afwijking van het eerste lid heeft de verzekerde, die wordt ingesteld op een voor hem nieuwe medicatie,
      aanspraak op aflevering van geneesmiddelen voor een periode van 15 dagen.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11
  - number: 11a
    text: |-
      Bij de aanwijzing van een geneesmiddel ingevolge [artikel 9, eerste lid, onder ][ref1], wordt vastgesteld of het
      geneesmiddel onderling vervangbaar is met een of meer andere geneesmiddelen. Tevens wordt voor de geneesmiddelen
      waarvan wordt vastgesteld dat zij onderling vervangbaar zijn met een of meer andere geneesmiddelen, een
      vergoedingslimiet vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002520#Artikel9
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0002520
        artikel: '9'
        paragraaf: '5'
  - number: 11b.1
    text: 'Geneesmiddelen worden als onderling vervangbaar aangemerkt, indien zij:'
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11b
  - number: 11b.1.a
    text: bij een gelijksoortig indicatiegebied kunnen worden toegepast,
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11b
  - number: 11b.1.b
    text: via een gelijke toedieningsweg worden toegediend, en
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11b
  - number: 11b.1.c
    text: in het algemeen voor dezelfde leeftijdscategorie zijn bestemd.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11b
  - number: 11b.2
    text: |-
      Bij de toedieningswegen wordt een onderscheid gemaakt in toediening door middel van injectie waarbij systemisch het
      gewenste effect wordt beoogd, toediening niet door middel van een injectie waarbij systemisch het gewenste effect
      wordt beoogd, toediening door middel van injectie waarbij lokaal het gewenste effect wordt beoogd en toediening
      niet door middel van een injectie waarbij lokaal het gewenste effect wordt beoogd.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11b
  - number: 11b.3
    text: 'In afwijking van het eerste en tweede lid worden geneesmiddelen niet als onderling vervangbaar aangemerkt, indien:'
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11b
  - number: 11b.3.a
    text: tussen die geneesmiddelen verschillen in eigenschappen bestaan,
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11b
  - number: 11b.3.b
    text: |-
      deze verschillen in eigenschappen zich voordoen of kunnen voordoen bij de gehele patiëntenpopulatie, bij welke de
      geneesmiddelen kunnen worden toegepast, en
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11b
  - number: 11b.3.c
    text: |-
      uit de gegevens en bescheiden, bedoeld in [artikel 8, tweede lid][ref1], blijkt dat deze verschillen in
      eigenschappen, tezamen genomen, bepalend zijn voor de keuze van het geneesmiddel door de arts.


      [ref1]: https://wetten.overheid.nl/BWBR0002520#Artikel8
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0002520
        artikel: '8'
        paragraaf: '5'
  - number: 11b.4
    text: |-
      In afwijking van het eerste en tweede lid worden geneesmiddelen die behoren tot een subgroep die alleen uit
      preparaten bestaat of alleen uit specialités onder dezelfde merknaam niet als onderling vervangbaar beschouwd.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11b
  - number: 11b.5
    text: |-
      In afwijking van het eerste, tweede en derde lid wordt een combinatiepreparaat als onderling vervangbaar
      aangemerkt met een in een groep van onderling vervangbare geneesmiddelen opgenomen geneesmiddel, niet zijnde een
      combinatiepreparaat, dat een werkzaam bestanddeel bevat dat voorkomt in het combinatiepreparaat, indien:
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11b
  - number: 11b.5.a
    text: |-
      alle werkzame bestanddelen van het combinatiepreparaat voorkomen in geneesmiddelen, niet zijnde
      combinatiepreparaten, die zijn opgenomen in een groep van onderling vervangbare geneesmiddelen, en
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11b
  - number: 11b.5.b
    text: |-
      de onder *a* bedoelde geneesmiddelen langs dezelfde toedieningsweg worden toegediend en in het algemeen voor
      dezelfde leeftijdscategorie zijn bestemd als het combinatiepreparaat.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11b
  - number: 11b.6
    text: |-
      Het vijfde lid is niet van toepassing op combinatiepreparaten van oestrogenen en progestagenen en
      combinatiepreparaten van thiazide- en kaliumsparende diuretica.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11b
  - number: 11c.1
    text: |-
      Voor de berekening van een vergoedingslimiet wordt uitgegaan van een standaarddosis van het werkzaam bestanddeel
      van het geneesmiddel.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11c
  - number: 11c.2
    text: |-
      De standaarddosis wordt bepaald op basis van de Defined Daily Dose, tenzij de Defined Daily Dose lager is dan de in
      Nederland geadviseerde minimale dosering of hoger is dan de in Nederland geadviseerde maximale dosering.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11c
  - number: 11c.3
    text: |-
      Indien een werkzaam bestanddeel onder verschillende zout- of estervormen in de handel is en bij de Defined
      Daily Dose geen onderscheid is gemaakt naar de zout- of estervorm, wordt de standaarddosis voor de verschillende
      zout- of estervormen, voor zover mogelijk, herleid tot de zout- of estervorm die het meest voorkomt in de in
      [artikel 8, tweede lid][ref1], genoemde bronnen.


      [ref1]: https://wetten.overheid.nl/BWBR0002520#Artikel8
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11c
    references:
      - id: ref1
        bwb_id: BWBR0002520
        artikel: '8'
        paragraaf: '5'
  - number: 11c.4
    text: |-
      Voor uitwendig toegepaste dermatologica geldt als standaarddosis 1 gram, 1 ml of 100 cm2, afhankelijk van de
      gehanteerde hoeveelheidsmaat.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11c
  - number: 11c.5
    text: |-
      De standaarddosis wordt zoveel mogelijk vastgesteld met overeenkomstige toepassing van de methodiek, gehanteerd bij
      de vaststelling van de Defined Daily Dose, indien:
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11c
  - number: 11c.5.a
    text: voor een geneesmiddel geen Defined Daily Dose is vastgesteld, of
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11c
  - number: 11c.5.b
    text: |-
      de Defined Daily Dose lager is dan de in Nederland geadviseerde minimale dosering of hoger is dan de in Nederland
      geadviseerde maximale dosering.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11c
  - number: 11c.6
    text: |-
      In afwijking van het eerste tot en met vijfde lid wordt bij geneesmiddelen waarvoor geldt dat de duur van de
      medicatie wordt bekort door de hoeveelheid per dag gegeven werkzame bestanddelen te verhogen, uitgegaan van de
      standaardkuur.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11c
  - number: 11c.7
    text: 'De vergoedingslimiet van een geneesmiddel wordt opnieuw vastgesteld, indien:'
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11c
  - number: 11c.7.a
    text: |-
      de Defined Daily Dose van dat geneesmiddel bij een herziening van de Defined Daily Doses van een categorie van
      geneesmiddelen in de Anatomical Therapeutic Chemical Classification op niveau 4 wordt gewijzigd ten opzichte van de
      Defined Daily Dose waarvan eerder bij de bepaling van de standaarddosis was uitgegaan,
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11c
  - number: 11c.7.b
    text: |-
      voor dat geneesmiddel de standaarddosis was bepaald overeenkomstig het vijfde lid, aanhef en onder *a*, en voor dat
      geneesmiddel een Defined Daily Dose wordt vastgesteld, of
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11c
  - number: 11c.7.c
    text: |-
      wijziging optreedt in de in Nederland geadviseerde minimale of maximale dosering van een geneesmiddel, bedoeld in
      het vijfde lid, aanhef en onder *b*, en die wijziging zou leiden tot een andere standaarddosis dan die waarvan bij
      de indeling van dat geneesmiddel in de desbetreffende groep van onderling vervangbare geneesmiddelen is uitgegaan.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11c
  - number: 11c.8
    text: |-
      Indien de Defined Daily Dose van een geneesmiddel of van geneesmiddelen, van de prijs waarvan is uitgegaan
      voor de berekening van een vergoedingslimiet, bij een herziening van de Defined Daily Dose van een categorie
      van geneesmiddelen in de Anatomical Therapeutic Chemical Classification op niveau 4 wordt gewijzigd, wordt de
      vergoedingslimiet voor de groep onderling vervangbare geneesmiddelen waartoe dat geneesmiddel behoort, opnieuw
      vastgesteld. Bij de berekening van de nieuwe vergoedingslimiet worden slechts betrokken de geneesmiddelen die
      betrokken zijn bij de eerdere berekening van de vergoedingslimiet.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11c
  - number: 11d.1
    text: |-
      Voor zover een groep van onderling vervangbare geneesmiddelen bestaat uit geneesmiddelen die voor een bij
      ministeriële regeling vast te stellen tijdstip geregistreerd waren en de prijs daarvan voorkwam in de op dat
      tijdstip geldende Taxe, wordt voor de berekening van de vergoedingslimiet voor de tot die groep behorende
      geneesmiddelen uitgegaan van de prijzen, vermeld in de bedoelde Taxe.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11d
  - number: 11d.2
    text: |-
      Indien een groep van onderling vervangbare geneesmiddelen bestaat uit geneesmiddelen die na het in het eerste lid
      bedoelde tijdstip geregistreerd zijn of waarvan de prijs voor het eerst voorkwam in een na dat tijdstip verschenen
      Taxe, wordt voor de berekening van de vergoedingslimiet voor de tot die groep behorende geneesmiddelen uitgegaan
      van de prijs van het geneesmiddel, waarvan de prijs het eerst in de Taxe is vermeld.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11d
  - number: 11d.3
    text: |-
      Bij de berekening van de vergoedingslimiet worden de prijzen van parallel geïmporteerde geneesmiddelen en van
      combinatiepreparaten als bedoeld in [artikel 11][ref1], buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002520#Artikel11b
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11d
    references:
      - id: ref1
        bwb_id: BWBR0002520
        artikel: 11b
        paragraaf: '5'
  - number: 11e.1
    text: Per groep van onderling vervangbare geneesmiddelen wordt een gemiddelde prijs berekend.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11e
  - number: 11e.2
    text: |-
      Voor de berekening van de gemiddelde prijs wordt de groep verdeeld in subgroepen van geneesmiddelen die hetzelfde
      werkzaam bestanddeel of dezelfde combinatie van werkzame bestanddelen hebben.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11e
  - number: 11e.3
    text: |-
      Binnen een subgroep wordt voor de specialité’s met eenzelfde merknaam, met uitzondering van de branded generics,
      een gemiddelde prijs per standaarddosis berekend.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11e
  - number: 11e.4
    text: |-
      Binnen een subgroep wordt voor andere geneesmiddelen dan die, bedoeld in het derde lid, een gemiddelde prijs per
      standaarddosis berekend. Die prijs is het gemiddelde van de laagste prijzen van de geneesmiddelen in dezelfde
      farmaceutische vorm.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11e
  - number: 11e.5
    text: |-
      Per subgroep worden de ingevolge het derde en vierde lid berekende gemiddelde prijzen per standaarddosis opgeteld
      en wordt die uitkomst gemiddeld, zodat een prijs per subgroep wordt verkregen.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11e
  - number: 11e.6
    text: Indien in de Taxe voor een specialité meer dan een prijs wordt vermeld, wordt uitgegaan van de laagste prijs.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11e
  - number: 11f.1
    text: |-
      Indien de groep van onderling vervangbare geneesmiddelen bestaat uit slechts een subgroep, is de in
      [artikel 11][ref1], bedoelde prijs per subgroep de basis voor de berekening van de vergoedingslimiet van de tot die
      groep behorende geneesmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002520#Artikel11e
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11f
    references:
      - id: ref1
        bwb_id: BWBR0002520
        artikel: 11e
        paragraaf: '5'
  - number: 11f.2
    text: 'Indien de groep van onderling vervangbare geneesmiddelen bestaat uit meer dan een subgroep, worden, indien:'
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11f
  - number: 11f.2.a
    text: |-
      de geneesmiddelen behoren tot een categorie in de Anatomical Therapeutic Chemical Classification op niveau 4, alle
      prijzen per subgroep bij elkaar opgeteld en wordt vervolgens het gemiddelde ervan berekend;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11f
  - number: 11f.2.b
    text: |-
      de geneesmiddelen behoren tot verschillende categorieën op niveau 4 van de Anatomical Therapeutic Chemical
      Classification, de prijzen voor de verschillende subgroepen, voor zover behorend tot dezelfde categorie, gemiddeld,
      worden de aldus berekende prijzen voor de afzonderlijke categorieën opnieuw gemiddeld en vormt het aldus verkregen
      gemiddelde de berekeningsbasis voor de bepaling van de vergoedingslimiet.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11f
  - number: 11g.1
    text: |-
      Indien er binnen een groep van onderling vervangbare geneesmiddelen een geneesmiddel is, waarvan de prijs per
      standaarddosis gelijk is aan de in [artikel 11][ref1] bedoelde berekeningsbasis, is de vergoedingslimiet voor de
      geneesmiddelen uit die groep gelijk aan de prijs per standaarddosis van dat geneesmiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0002520#Artikel11f
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11g
    references:
      - id: ref1
        bwb_id: BWBR0002520
        artikel: 11f
        paragraaf: '5'
  - number: 11g.2
    text: |-
      Indien er binnen een groep van onderling vervangbare geneesmiddelen geen geneesmiddel is waarvan de prijs per
      standaarddosis gelijk is aan de in [artikel 11][ref1] bedoelde berekeningsbasis, is de vergoedingslimiet voor de
      geneesmiddelen uit die groep gelijk aan de prijs per standaarddosis van het geneesmiddel die zo dicht mogelijk
      onder de berekeningsbasis ligt.


      [ref1]: https://wetten.overheid.nl/BWBR0002520#Artikel11f
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11g
    references:
      - id: ref1
        bwb_id: BWBR0002520
        artikel: 11f
        paragraaf: '5'
  - number: 11h.1
    text: |-
      Indien van een geneesmiddel verschillende toedieningssterkten bestaan, wordt de vergoedingslimiet, berekend
      overeenkomstig de [artikelen 11][ref1], voor het geneesmiddel met de kleinste toedieningssterkte gecorrigeerd door
      de ongecorrigeerde vergoedingslimiet te vermenigvuldigen met 2/10 maal het quotiënt van de referentiehoeveelheid en
      de kleinste toedieningssterkte van dat geneesmiddel, vermeerderd met 8/10.


      [ref1]: https://wetten.overheid.nl/BWBR0002520#Artikel11c
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11h
    references:
      - id: ref1
        bwb_id: BWBR0002520
        artikel: 11c
        paragraaf: '5'
  - number: 11h.2
    text: |-
      Voor geneesmiddelen die voor andere leeftijdscategorieën dan volwassenen zijn bestemd, is de referentiehoeveelheid
      de hoeveelheid die voorkomt in het preparaat van de hoogste hoeveelheid van die andere leeftijdscategorieën.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11h
  - number: 11h.3
    text: De dimensie van de referentiehoeveelheid moet gelijk zijn aan de dimensie van de kleinste toedieningsvorm.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11h
  - number: 11h.4
    text: |-
      Bij geneesmiddelen als bedoeld in de [artikelen 11][ref1], en [11][ref2], blijft het eerste tot en met het derde
      lid buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002520#Artikel11b
      [ref2]: https://wetten.overheid.nl/BWBR0002520#Artikel11c
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11h
    references:
      - id: ref1
        bwb_id: BWBR0002520
        artikel: 11b
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0002520
        artikel: 11c
        paragraaf: '5'
  - number: 11i.1
    text: |-
      De vergoedingslimiet van een combinatiepreparaat als bedoeld in [artikel 11][ref1], is gelijk aan de som van de
      vergoedingslimieten voor de geneesmiddelen, niet zijnde combinatiepreparaten, die de werkzame bestanddelen bevatten
      die in het combinatiepreparaat voorkomen en die langs dezelfde toedieningsweg worden toegediend en in het algemeen
      voor dezelfde leeftijdscategorie zijn bestemd als het combinatiepreparaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002520#Artikel11b
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11i
    references:
      - id: ref1
        bwb_id: BWBR0002520
        artikel: 11b
        paragraaf: '5'
  - number: 11i.2
    text: |-
      Indien de in het eerste lid bedoelde geneesmiddelen die geen combinatiepreparaten zijn, een in het
      combinatiepreparaat voorkomend werkzaam bestanddeel bevatten in een andere hoeveelheid of in een andere
      toedieningsvorm dan die welke in het combinatiepreparaat voorkomt, wordt uitgegaan van de vergoedingslimieten, die
      voor die geneesmiddelen zouden hebben gegolden indien die geneesmiddelen dat werkzaam bestanddeel zouden hebben
      bevat in de hoeveelheid en de toedieningsvorm die in het combinatiepreparaat voorkomt.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11i
  - number: 11j
    text: |-
      Voor zover de toepassing van de [artikelen 11][ref1] naar het oordeel van Onze Minister tot een uitkomst leidt die
      niet in overeenstemming is met de strekking daarvan, kan Onze Minister een besluit nemen in afwijking daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0002520#Artikel11b
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11j
    references:
      - id: ref1
        bwb_id: BWBR0002520
        artikel: 11b
        paragraaf: '5'
  - number: 11k.1
    text: |-
      De registratiehouder kan bij Onze Minister een aanvraag indienen om een geneesmiddel aan te wijzen ingevolge
      [artikel 9, eerste lid, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002520#Artikel9
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11k
    references:
      - id: ref1
        bwb_id: BWBR0002520
        artikel: '9'
        paragraaf: '5'
  - number: 11k.2
    text: |-
      De aanvraag geschiedt met gebruikmaking van een door Onze Minister vast te stellen formulier. Daarbij worden de
      gegevens en de bescheiden verschaft die voor de beslissing op de aanvraag nodig zijn. De datum van ontvangst wordt
      aan de aanvrager meegedeeld.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11k
  - number: 11k.3
    text: |-
      Indien de overgelegde gegevens en bescheiden onvoldoende zijn, stelt Onze Minister de aanvrager in de gelegenheid
      binnen een door hem te bepalen termijn de aanvraag aan te vullen.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11k
  - number: 11k.4
    text: Onze Minister hoort over de aanvraag het College zorgverzekeringen.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11k
  - number: 11k.5
    text: |-
      Onze Minister beslist binnen 90 dagen na ontvangst van de aanvraag. Deze termijn wordt opgeschort met ingang van
      de dag waarop Onze Minister de aanvrager uitnodigt de aanvraag aan te vullen, tot de dag waarop de aanvraag is
      aangevuld of de daarvoor gestelde termijn ongebruikt is verstreken.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11k
  - number: 11k.6
    text: |-
      De inhoud van het voorgenomen besluit voor zover betrekking hebben op de aanvraag wordt aan de aanvrager
      medegedeeld. Daarbij wordt tevens het oordeel van het College zorgverzekeringen toegezonden en wordt de motivering
      vermeld, tenzij redelijkerwijs kan worden aangenomen dat daaraan geen behoefte bestaat. Aan de aanvrager wordt
      meegedeeld welke rechtsmiddelen hem ter beschikking staan.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11k
  - number: 11k.7
    text: |-
      Het tweede tot en met het zesde lid zijn van overeenkomstige toepassing indien de registratiehouder verzoekt
      om herziening van een besluit ingevolge het eerste lid en hij daartoe nieuw gebleken feiten of veranderde
      omstandigheden aanvoert.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11k
  - number: 11k.8
    text: |-
      Indien Onze Minister voornemens is een geneesmiddel ambtshalve aan te wijzen ingevolge
      [artikel 9, eerste lid, onder a][ref1], dan wel zodanige aanwijzing te wijzigen, deelt hij de registratiehouder
      uiterlijk een maand voor de beoogde datum van inwerkingtreding de zakelijke inhoud van het voorgenomen besluit
      mede. Het vierde en zesde lid zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002520#Artikel9
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11k
    references:
      - id: ref1
        bwb_id: BWBR0002520
        artikel: '9'
        paragraaf: '5'
  - number: 11k.9
    text: |-
      Indien het een geneesmiddel betreft met dezelfde werkzame bestanddelen, van dezelfde sterkte en in dezelfde
      farmaceutische vorm als een geneesmiddel dat reeds ingevolge [artikel 9, eerste lid, onder ][ref1], is aangewezen,
      zijn het tweede tot en met vierde lid, het zesde lid, tweede volzin, en het zevende en achtste lid niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002520#Artikel9
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11k
    references:
      - id: ref1
        bwb_id: BWBR0002520
        artikel: '9'
        paragraaf: '5'
  - number: 11l.1
    text: |-
      De verzekerde is een bijdrage verschuldigd in de kosten van een geneesmiddel, dat is ingedeeld in een groep
      van onderling vervangbare geneesmiddelen, voor zover de toepasselijke vergoedingslimiet, omgerekend naar de
      desbetreffende hoeveelheid, lager is dan de inkoopprijs die vermeld staat in de Taxe, verhoogd met de over het
      verschil verschuldigde omzetbelasting. Een bijdrage is ook verschuldigd voor zover een geneesmiddel is bereid uit
      een geneesmiddel waarvoor een bijdrage is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11l
  - number: 11l.2
    text: De bijdrage wordt betaald aan degene die het geneesmiddel aflevert.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel11l
  - number: '12.1'
    text: |-
      Medisch-specialistische zorg, bedoeld in [artikel 8, eerste lid, onder a, van de Ziekenfondswet][ref1] omvat:


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel8
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '8'
  - number: 12.1.a
    text: |-
      genees-, heel- en verloskundige zorg naar de omvang bepaald door hetgeen in de kring der beroepsgenoten
      gebruikelijk is;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel12
  - number: 12.1.b
    text: |-
      bij ministeriële regeling aan te wijzen vormen van transplantaties van weefsel en organen alsmede vergoeding
      van bij die regeling nader te bepalen kosten, verband houdend met het verkrijgen van het meest passende
      transplantatiemateriaal, een en ander onder voorwaarden bij die regeling vast te stellen;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel12
  - number: 12.1.c
    text: met een pleeggezin overeengekomen verpleging in dat gezin.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel12
  - number: '12.2'
    text: |-
      Op de zorg, bedoeld in het eerste lid, bestaat slechts aanspraak op verwijzing van de huisarts van de verzekerde,
      op verwijzing van een bedrijfsarts of op verwijzing van de specialist naar wie de verzekerde werd verwezen. Indien
      het verloskundige zorg betreft bestaat eveneens aanspraak op die zorg op verwijzing van de verloskundige.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel12
  - number: '12.3'
    text: |-
      Indien de zorg, bedoeld in het eerste lid, plaatsvindt op verwijzing van een bedrijfsarts, bestaat slechts
      aanspraak op deze zorg indien het ziekenfonds met de verwijzende bedrijfsarts of de arbodienst waaraan deze
      bedrijfsarts is verbonden, schriftelijk afspraken heeft gemaakt over de kwaliteit en doelmatigheid van de
      verwijzing, de wijze waarop afstemming en overleg plaatsvinden met personen of instellingen die aan de verzekerde
      zorg verlenen of kunnen verlenen, en de controle op de naleving van de afspraken.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel12
  - number: '12.4'
    text: |-
      Bij ministeriële regeling kan de omvang van de in het eerste lid, onder a, bedoelde zorg worden beperkt en kan de
      aanspraak daarop afhankelijk worden gesteld van daarbij te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel12
  - number: '13.1'
    text: |-
      Medisch-specialistische zorg, bedoeld in [artikel 8, eerste lid, onder c, van de Ziekenfondswet][ref1] omvat
      genees-, heel- en verloskundige zorg naar de omvang bepaald door hetgeen in de kring der beroepsgenoten
      gebruikelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel8
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '8'
  - number: '13.2'
    text: |-
      Op de zorg, bedoeld in het eerste lid, bestaat slechts aanspraak op verwijzing van de huisarts van de verzekerde,
      op verwijzing van een bedrijfsarts of op verwijzing van de specialist naar wie de verzekerde werd verwezen. Indien
      het verloskundige zorg betreft bestaat eveneens aanspraak op die zorg op verwijzing van de verloskundige.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel13
  - number: '13.3'
    text: |-
      Indien de zorg, bedoeld in het eerste lid, plaatsvindt op verwijzing van een bedrijfsarts, bestaat slechts
      aanspraak op deze zorg indien het ziekenfonds met de verwijzende bedrijfsarts of de arbodienst waaraan deze
      bedrijfsarts is verbonden, schriftelijk afspraken heeft gemaakt over de kwaliteit en doelmatigheid van de
      verwijzing, de wijze waarop afstemming en overleg plaatsvinden met personen of instellingen die aan de verzekerde
      zorg verlenen of kunnen verlenen, en de controle op de naleving van de afspraken.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel13
  - number: '13.4'
    text: |-
      De plaats waar de in het eerste lid bedoelde zorg wordt verleend, wordt bepaald door hetgeen in de kring der
      beroepsgenoten gebruikelijk is.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel13
  - number: '13.5'
    text: |-
      Bij ministeriële regeling kan de omvang van de in het eerste lid bedoelde zorg worden beperkt en kan de
      verstrekking ervan afhankelijk worden gesteld van daarbij te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel13
  - number: '14.1'
    text: |-
      Op opneming gedurende het etmaal in een ziekenhuis bestaat slechts aanspraak voor zover er sprake is van verblijf
      in de laagste klasse en dit verblijf een onafgebroken periode van 365 dagen in een of meer ziekenhuizen niet te
      boven gaat.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel14
  - number: '14.2'
    text: Een onderbreking van ten hoogste 30 dagen wordt niet als onderbreking beschouwd.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel14
  - number: '14.3'
    text: |-
      In afwijking van het tweede lid tellen onderbrekingen wegens weekeinde- en vakantieverlof wel mee voor de
      berekening van de 365 dagen.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel14
  - number: 14a.1
    text: |-
      Op opneming in een ziekenhuis bestaat aanspraak indien en zolang de verzekerde redelijkerwijs op medisch-
      specialistische zorg in een ziekenhuis is aangewezen.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel14a
  - number: 14a.2
    text: |-
      Indien de verzekerde op grond van het eerste lid in verband met verloskundige zorg in een ziekenhuis verblijft,
      heeft zowel de moeder als het kind aanspraak op opneming in dat ziekenhuis.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel14a
  - number: 14a.3
    text: |-
      In afwijking van het eerste lid bestaat aanspraak op opneming gedurende het etmaal in een ziekenhuis
      tot vier weken nadat het ziekenfonds heeft vastgesteld dat een indicatiebesluit op grond van het
      [Zorgindicatiebesluit][ref1] is genomen waaruit blijkt dat de verzekerde is aangewezen op de zorg, bedoeld
      in [artikel 9 van het Besluit zorgaanspraken AWBZ][ref2], in verband met een somatische of psychogeriatrische
      aandoening.


      [ref1]: https://wetten.overheid.nl/BWBR0008946
      [ref2]: https://wetten.overheid.nl/BWBR0014149#Artikel9
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0008946
      - id: ref2
        bwb_id: BWBR0014149
        artikel: '9'
  - number: '15.1'
    text: Hulpmiddelen omvatten de middelen welke bij ministeriële regeling als zodanig zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel15
  - number: '15.2'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat hulpmiddelen in eigendom dan wel in bruikleen worden verschaft
      en kunnen regelen worden gesteld met betrekking tot wijziging of herstel van hulpmiddelen, het verstrekken van
      reserve-hulpmiddelen en de voorwaarden voor het verkrijgen van hulpmiddelen.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel15
  - number: '15.3'
    text: |-
      De kosten van normaal gebruik zijn, tenzij bij ministeriële regeling anders is bepaald, voor rekening van de
      verzekerde.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel15
  - number: '15.4'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat de verzekerde voor een hulpmiddel een bijdrage is verschuldigd ter
      grootte van:
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel15
  - number: 15.4.a
    text: |-
      het verschil tussen de aanschaffingskosten en het bij dat hulpmiddel vermelde bedrag, dat kan verschillen naar
      gelang de groep van verzekerden, waartoe de verzekerde behoort;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel15
  - number: 15.4.b
    text: een daarbij vermeld bedrag wegens besparing van kosten;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel15
  - number: 15.4.c
    text: |-
      een daarbij aangegeven percentage van de aanschaffingskosten, indien door toerekenbare onachtzaamheid of opzet van
      de verzekerde schade aan het hulpmiddel ontstaat.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel15
  - number: '15.5'
    text: De bijdrage wordt betaald aan de leverancier van het hulpmiddel, tenzij het ziekenfonds anders heeft bepaald.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel15
  - number: '16.1'
    text: 'Het ziekenvervoer omvat in de omvang en onder de voorwaarden, nader door Onze Minister vast te stellen:'
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel16
  - number: 16.1.a
    text: vervoer per auto;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel16
  - number: 16.1.b
    text: vergoeding voor vervoer in de laagste klasse van een openbaar middel van vervoer.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel16
  - number: '16.2'
    text: |-
      Onze Minister kan bepalen in welke gevallen aanspraak bestaat op vervoer met een ander vervoermiddel dan de in het
      vorige lid genoemde.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel16
  - number: '16.3'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat de verzekerde voor ziekenvervoer, anders dan ambulancevervoer als
      bedoeld in [artikel 1, eerste lid, van de Wet ambulancevervoer][ref1], een bijdrage in de kosten is verschuldigd
      tot een bij die regeling aangegeven maximum per 12 maanden voor zichzelf en zijn medeverzekerden te zamen.


      [ref1]: https://wetten.overheid.nl/BWBR0002757#Artikel1
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002757
        artikel: '1'
  - number: '16.4'
    text: De bijdrage wordt betaald aan de vervoerder.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel16
  - number: '17.1'
    text: |-
      Kraamzorg ten huize van de verzekerde, verleend onder verantwoordelijkheid van een kraamcentrum, omvat verzorging
      van moeder en kind, gedurende ten minste 24 en ten hoogste 80 uren, verdeeld over ten hoogste 10 dagen, te rekenen
      vanaf de dag van de bevalling.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel17
  - number: '17.2'
    text: |-
      Kraamzorg in een kraaminrichting of in een ziekenhuis zonder opnemingsindicatie als bedoeld in [artikel 14a][ref1],
      omvat verzorging en verpleging van moeder en kind, gedurende ten hoogste 10 dagen, te rekenen vanaf de dag van
      de bevalling.


      [ref1]: https://wetten.overheid.nl/BWBR0002520#Artikel14a
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002520
        artikel: 14a
  - number: '17.3'
    text: |-
      Op de kraamzorg, bedoeld in het eerste en tweede lid, bestaat aanspraak voor zover moeder en kind, gelet op hun
      behoefte, daarop redelijkerwijs zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel17
  - number: '17.4'
    text: |-
      Indien de verzekerde gedurende een deel van de periode, bedoeld in het eerste lid, verblijft in een ziekenhuis
      op grond van een opnemingsindicatie als bedoeld in [artikel 14a][ref1], behoudt zij voor de resterende kraamzorg,
      bedoeld in het eerste lid, aanspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0002520#Artikel14a
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002520
        artikel: 14a
  - number: '17.5'
    text: |-
      De verzekerde is een bij ministeriële regeling te bepalen bijdrage per uur verschuldigd, indien de kraamzorg
      wordt verleend ten huize van de verzekerde. Indien de kraamzorg wordt verleend in een kraaminrichting of in een
      ziekenhuis zonder opnemingsindicatie als bedoeld in [artikel 14a][ref1], is de verzekerde een bij ministeriële
      regeling te bepalen bijdrage per dag verschuldigd, vermeerderd met het bedrag waarmee het ingevolge de
      [Wet tarieven gezondheidszorg][ref2] vastgestelde of goedgekeurde tarief van de kraaminrichting of het ziekenhuis
      het bij die regeling te bepalen bedrag te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002520#Artikel14a
      [ref2]: https://wetten.overheid.nl/BWBR0003356
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002520
        artikel: 14a
      - id: ref2
        bwb_id: BWBR0003356
  - number: '17.6'
    text: De bijdrage wordt betaald aan degene die de hulp verleent.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel17
  - number: '18'
    text: |-
      De verzekerde wendt zich uiterlijk vijf maanden vóór de vermoedelijke datum van de bevalling met een aanvraag voor
      kraamzorg tot een kraamcentrum binnen wiens werkgebied de verzekerde woont.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel18
  - number: '19.1'
    text: 'Hulp door een audiologisch centrum omvat:'
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel19
  - number: 19.1.a
    text: onderzoek van de gehoorfunctie;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel19
  - number: 19.1.b
    text: advisering over de aan te schaffen gehoorapparatuur;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel19
  - number: 19.1.c
    text: voorlichting over het gebruik van de apparatuur;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel19
  - number: 19.1.d
    text: psycho-sociale hulp indien noodzakelijk in verband met problemen met de gestoorde gehoorfunctie.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel19
  - number: '19.2'
    text: |-
      Op hulp door een audiologisch centrum bestaat slechts aanspraak indien de verzekerde naar het centrum is verwezen
      door zijn huisarts, een bedrijfsarts, een kinderarts of een keel-, neus en oorarts.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel19
  - number: '19.3'
    text: |-
      Indien de zorg, bedoeld in het eerste lid, plaatsvindt op verwijzing van een bedrijfsarts, bestaat slechts
      aanspraak op deze zorg indien het ziekenfonds met de verwijzende bedrijfsarts of de arbodienst waaraan deze
      bedrijfsarts is verbonden, schriftelijk afspraken heeft gemaakt over de kwaliteit en doelmatigheid van de
      verwijzing, de wijze waarop afstemming en overleg plaatsvinden met personen of instellingen die aan de verzekerde
      zorg verlenen of kunnen verlenen, en de controle op de naleving van de afspraken.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel19
  - number: '19.4'
    text: |-
      Indien hulp door een audiologisch centrum langer dan zes weken is aangewezen, wordt tijdig voor het verstrijken
      van die periode toestemming aan het ziekenfonds gevraagd. Bij de aanvraag wordt een deugdelijke motivering van het
      audiologisch centrum overgelegd.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel19
  - number: '20.1'
    text: |-
      Hulp in het kader van erfelijkheidsadvisering omvat onderzoek naar en van erfelijke afwijkingen door middel van
      stamboomonderzoek, chromosoomonderzoek, biochemische diagnostiek, ultrageluidsonderzoek en DNA-onderzoek, het geven
      van erfelijkheidsadviezen en daarmee verband houdende psycho-sociale begeleiding, te verlenen door een instelling
      die een vergunning heeft op grond van [artikel 2 van de Wet op bijzondere medische verrichtingen][ref1] voor de
      toepassing van klinisch genetisch onderzoek en erfelijkheidsadvisering.


      [ref1]: https://wetten.overheid.nl/BWBR0008974#Artikel2
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0008974
        artikel: '2'
  - number: '20.2'
    text: |-
      Op hulp in het kader van erfelijkheidsadvisering bestaat slechts aanspraak op verwijzing van de huisarts van de
      verzekerde dan wel de specialist naar wie de verzekerde door de huisarts is verwezen.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel20
  - number: '21.1'
    text: |-
      De niet-klinische haemodialyse omvat de hulp, in de omvang en onder de voorwaarden nader door Onze Minister vast te
      stellen, die wordt verleend:
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel21
  - number: 21.1.a
    text: in een dialysecentrum,
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel21
  - number: 21.1.b
    text: ten huize van de verzekerde,
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel21
  - number: 21.1.c
    text: |-
      in een daartoe ingerichte ruimte voor gemeenschappelijk gebruik, in de laatste twee gevallen echter alleen, indien
      de hulp wordt verleend onder de verantwoordelijkheid van een dialysecentrum.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel21
  - number: '21.2'
    text: In het in het eerste lid, onder *b*, bedoelde geval omvat de verstrekking mede
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel21
  - number: 21.2.a
    text: |-
      vergoeding van de kosten voor redelijkerwijze te verrichten aanpassingen in en van de woning en voor het herstel
      van de woning in de oorspronkelijke staat,
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel21
  - number: 21.2.b
    text: vergoeding van de overige kosten die rechtstreeks met de thuisdialyse samenhangen,
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel21
  - number: '21.3'
    text: |-
      Het College zorgverzekeringen kan nadere regelen stellen met betrekking tot het bepaalde in het tweede lid en stelt
      tevens jaarlijks een bedrag vast, dat geldt als de in het tweede lid, onder *b*, bedoelde vergoeding.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel21
  - number: '21.4'
    text: |-
      Voor de niet-klinische haemodialyse dient een indicatie te bestaan. Onze Minister bepaalt wat onder een indicatie
      wordt verstaan.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel21
  - number: '22.1'
    text: |-
      De chronisch intermitterende beademing omvat in de omvang en onder de voorwaarden door Onze Minister vast te
      stellen:
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel22
  - number: 22.1.a
    text: |-
      het regelmatig verblijven gedurende minder dan 24 uur in een beademingscentrum ten behoeve van de mechanische
      beademing;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel22
  - number: 22.1.b
    text: |-
      het gebruik van de mechanische beademingsapparatuur ten huize van de verzekerde dan wel in een daartoe ingerichte
      lokaliteit, indien de beademing aldaar plaatsvindt vanwege en onder verantwoordelijkheid van een beademingscentrum
      als bedoeld onder *a*.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel22
  - number: '22.2'
    text: |-
      Voor de chronisch intermitterende beademing dient een indicatie te bestaan. Onze Minister bepaalt wat onder een
      indicatie wordt verstaan.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel22
  - number: '23.1'
    text: |-
      Revalidatiezorg van medisch-specialistische, paramedische, gedragswetenschappelijke en revalidatie-technische aard
      omvat onderzoek, behandeling en advisering te verlenen door een aan een instelling voor revalidatiezorg verbonden
      multidisciplinair team van deskundigen, staande onder leiding van een specialist.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel23
  - number: '23.2'
    text: |-
      Indien de revalidatiezorg wordt verleend in een instelling voor revalidatiezorg, gaat deze gepaard met meerdaagse
      dagbehandeling van enkele uren per dag of met meerdaagse opneming met verzorging en verpleging.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel23
  - number: '23.3'
    text: 'Op revalidatiezorg bestaat slechts aanspraak indien:'
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel23
  - number: 23.3.a
    text: |-
      deze hulp voor de verzekerde als meest doeltreffend is aangewezen ter voorkoming, vermindering of overwinning van
      een handicap die het gevolg is van stoornissen of beperkingen in het bewegingsvermogen, en
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel23
  - number: 23.3.b
    text: |-
      de verzekerde met die hulp in staat is een mate van zelfstandigheid te bereiken of te behouden die, gegeven diens
      beperkingen, redelijkerwijs mogelijk is.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel23
  - number: '23.4'
    text: |-
      Op revalidatiezorg, gepaard gaande met meerdaagse opneming, bestaat slechts aanspraak indien daarmee spoedig betere
      resultaten te verwachten zijn dan met revalidatiezorg zonder die opneming.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel23
  - number: '23.5'
    text: |-
      Op revalidatiezorg, gepaard gaande met meerdaagse opneming, bestaat slechts aanspraak gedurende een
      ononderbroken periode van ten hoogste 365 verpleegdagen in één of meer instellingen voor revalidatiezorg.
      [Artikel 14, tweede en derde lid][ref1], is voor de berekening van die periode van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002520#Artikel14
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002520
        artikel: '14'
        paragraaf: '6'
  - number: '23.6'
    text: |-
      Op revalidatiezorg bestaat slechts aanspraak indien deze tijdig voor de aanvang daarvan bij het ziekenfonds
      schriftelijk is gemeld, vergezeld van een deugdelijke motivering van de hulpverlener. Zodra blijkt dat de hulp
      langer zal duren dan twee maanden is voor voortzetting na die termijn toestemming van het ziekenfonds vereist. De
      aanvraag gaat vergezeld van een deugdelijke motivering van de hulpverlener. De verzekerde behoudt aanspraak op de
      hulp totdat op zijn aanvraag is beslist.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel23
  - number: 23a
    text: |-
      Onderzoek in het kader van de behandeling van tuberculose of tuberculose-infectie omvat onderzoek op aanvraag van
      een arts die verbonden is aan een gemeentelijke gezondheidsdienst.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel23a
  - number: '24'
    text: |-
      De omvang van de door een trombosedienst te verlenen hulp, zomede de voorwaarden waaronder deze hulp wordt
      verleend, worden door Onze Minister vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel24
  - number: 24a
    text: |-
      Op hulp, welke bij of krachtens dit besluit als verstrekking is geregeld, bestaat geen aanspraak, voor zover deze
      objectief voorzienbaar samenhangt met een onderzoek in een ziekenhuis dat of een behandeling in een ziekenhuis
      die niet behoort tot de verstrekking, bedoeld in [artikel 12 van dit besluit][ref1] of tot de zorg, omschreven in
      [artikel 14, eerste lid, van het Besluit zorgaanspraken AWBZ][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002520#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0014149#Artikel14
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0002520
        artikel: '12'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0014149
        artikel: '14'
  - number: '25.1'
    text: |-
      Overeenkomstig het bepaalde bij of krachtens de [artikelen 26-30][ref1] bestaat aanspraak op een verstrekking of
      een vergoeding wegens kosten van geneeskundige verzorging als bedoeld in [artikel 10 van de Ziekenfondswet][ref2],
      welke niet op de in [artikel 9 van de Ziekenfondswet][ref3] omschreven wijze is ingeroepen als gevolg van de
      volgende omstandigheden:


      [ref1]: https://wetten.overheid.nl/BWBR0002520#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel9
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002520
        artikel: '26'
        paragraaf: '16'
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0002460
        artikel: '9'
  - number: 25.1.a
    text: verblijf hier te lande buiten de woonplaats;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel25
  - number: 25.1.b
    text: |-
      verblijf buitenslands wegens beroepswerkzaamheden of wegens door het College zorgverzekeringen aan te geven
      redenen;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel25
  - number: 25.1.c
    text: het behoren tot de door het College zorgverzekeringen aan te wijzen groepen van verzekerden;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel25
  - number: 25.1.d
    text: het niet zijn ingeschreven bij een ziekenfonds;
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel25
  - number: 25.1.e
    text: |-
      door het College zorgverzekeringen aan te wijzen andere omstandigheden, waarin de hulp niet op de wijze als
      omschreven in [artikel 9 van de Ziekenfondswet][ref1] is ingeroepen, en met inachtneming van door hem aan te geven
      regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel9
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '9'
  - number: '25.2'
    text: |-
      Het bepaalde in het eerste lid is tevens van toepassing, indien het spoedeisende karakter van de geneeskundige hulp
      een uitstel hiervan redelijkerwijze niet gedoogde, voor zover die hulp hier te lande is verleend en voor zover die
      hulp noch krachtens de Verordeningen van de Raad van de Europese Gemeenschappen, dan wel de toepassing van zodanige
      verordening krachtens de Overeenkomst betreffende de Europese Economische Ruimte noch krachtens een verdrag inzake
      sociale zekerheid kon worden verleend.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel25
  - number: '26.1'
    text: |-
      In de omstandigheden als bedoeld in [artikel 25, eerste lid, onder ][ref1], bestaat, mits is voldaan aan door
      het College zorgverzekeringen vast te stellen voorwaarden, aanspraak op de verstrekkingen - of een gehele
      of gedeeltelijke vergoeding van de kosten hiervan - genoemd in [artikel 2][ref2], verleend door personen of
      instellingen, die in de verblijfplaats van de verzekerde of de naaste omgeving daarvan hun praktijk uitoefenen
      of zijn gevestigd en ter zake van de verlening van deze verstrekkingen een overeenkomst hebben gesloten met een
      ziekenfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0002520#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002520#Artikel2
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002520
        artikel: '25'
        paragraaf: '16'
      - id: ref2
        bwb_id: BWBR0002520
        artikel: '2'
        paragraaf: '1'
  - number: '26.2'
    text: |-
      Het bepaalde in het eerste lid is niet van toepassing op een verzekerde, die zich overeenkomstig de daarvoor
      gestelde regelen naar een ander ziekenfonds had moeten laten overschrijven.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel26
  - number: '27'
    text: |-
      In omstandigheden als bedoeld in [artikel 25, eerste lid, onder ][ref1], bestaat, mits is voldaan aan door het
      College zorgverzekeringen vast te stellen voorwaarden, aanspraak op een door het College zorgverzekeringen vast te
      stellen gehele of gedeeltelijke vergoeding van kosten van geneeskundige verzorging, welke redelijkerwijze niet kon
      worden uitgesteld tot de terugkomst in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0002520#Artikel25
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002520
        artikel: '25'
        paragraaf: '16'
  - number: '28'
    text: |-
      In de omstandigheden als bedoeld in [artikel 25, eerste lid, onder c][ref1], is het bepaalde in
      [artikel 26, eerste lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002520#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002520#Artikel26
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002520
        artikel: '25'
        paragraaf: '16'
      - id: ref2
        bwb_id: BWBR0002520
        artikel: '26'
        paragraaf: '16'
  - number: '29.1'
    text: |-
      In de omstandigheid als bedoeld in [artikel 25, eerste lid, onder d][ref1], bestaat, mits is voldaan aan door het
      College zorgverzekeringen ter zake vast te stellen voorwaarden, aanspraak op een door het College zorgverzekeringen
      vast te stellen gehele of gedeeltelijke vergoeding van kosten van geneeskundige verzorging, ingeroepen:


      [ref1]: https://wetten.overheid.nl/BWBR0002520#Artikel25
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002520
        artikel: '25'
        paragraaf: '16'
  - number: 29.1.a
    text: |-
      in de periode gelegen tussen het tijdstip van aanmelding als verzekerde overeenkomstig het bepaalde in het
      [Inschrijvingsbesluit ziekenfondsverzekering][ref1] en het tijdstip waarop het ziekenfonds het bewijs van
      inschrijving als bedoeld in [artikel 15][ref2] van dat besluit heeft verstrekt;


      [ref1]: https://wetten.overheid.nl/BWBR0002518
      [ref2]: https://wetten.overheid.nl/BWBR0002518#Artikel15
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002518
      - id: ref2
        bwb_id: BWBR0002518
        artikel: '15'
  - number: 29.1.b
    text: |-
      in de periode gelegen tussen het tijdstip waarop de verzekering een aanvang heeft genomen en het tijdstip van
      aanmelding als verzekerde overeenkomstig het bepaalde in het [Inschrijvingsbesluit ziekenfondsverzekering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002518
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002518
  - number: 29.1.c
    text: |-
      in de periode gedurende welke de inschrijving onder toepassing van [artikel 17, eerste lid, onder b of e][ref1],
      dan wel van [artikel 18, onder c, van het Inschrijvingsbesluit ziekenfondsverzekering][ref2] onderbroken is
      geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0002520#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002518#Artikel18
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002520
        artikel: '17'
        paragraaf: '9'
      - id: ref2
        bwb_id: BWBR0002518
        artikel: '18'
  - number: '29.2'
    text: |-
      Voor de toepassing van het bepaalde bij of krachtens het eerste lid kunnen premiën, betaald ten behoeve van
      verzekering voor geneeskundige verzorging, worden aangemerkt als kosten van geneeskundige verzorging.
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel29
  - number: '29.3'
    text: |-
      Voor de toepassing van het bepaalde bij of krachtens het eerste lid, aanhef en onder c, wordt met de periode
      gedurende welke de inschrijving onder toepassing van [artikel 17, eerste lid, onder b of e][ref1], dan wel
      van [artikel 18, onder c, van het Inschrijvingsbesluit ziekenfondsverzekering][ref2] onderbroken is geweest,
      gelijkgesteld de periode gelegen tussen het tijdstip met ingang waarvan de inschrijving onder toepassing van
      [artikel 17, eerste lid, onder b of e][ref3], dan wel van [artikel 18, onder c][ref4], is beëindigd en het tijdstip
      waarop de verplichte verzekering is geëindigd zonder dat voordien een hernieuwde inschrijving tot stand is gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002520#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002518#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0002520#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0002520#Artikel18
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002520
        artikel: '17'
        paragraaf: '9'
      - id: ref2
        bwb_id: BWBR0002518
        artikel: '18'
      - id: ref3
        bwb_id: BWBR0002520
        artikel: '17'
        paragraaf: '9'
      - id: ref4
        bwb_id: BWBR0002520
        artikel: '18'
        paragraaf: '9'
  - number: '30'
    text: |-
      In de omstandigheid, als bedoeld in het [tweede lid van artikel 25][ref1], bestaat, mits is voldaan aan door
      het College zorgverzekeringen vast te stellen voorwaarden, aanspraak op gehele of gedeeltelijke vergoeding
      van de kosten van hulp, verleend door aan een ziekenfonds verbonden medewerkers en tot een door het College
      zorgverzekeringen vast te stellen bedrag indien de hulp door anderen is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002520#Artikel25
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002520
        artikel: '25'
        paragraaf: '16'
  - number: '33'
    text: 'Dit besluit wordt aangehaald als: Verstrekkingenbesluit ziekenfondsverzekering.'
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel33
  - number: '34.1'
    text: |-
      Dit besluit treedt, met uitzondering van de [artikelen 2, onder ][ref1], [6][ref2] en [8-10][ref3], in werking op
      de tweede dag na die van zijn afkondiging en werkt terug tot 1 januari 1966.


      [ref1]: https://wetten.overheid.nl/BWBR0002520#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002520#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002520#Artikel2
    url: https://wetten.overheid.nl/BWBR0002520/2003-12-19#Artikel34
    references:
