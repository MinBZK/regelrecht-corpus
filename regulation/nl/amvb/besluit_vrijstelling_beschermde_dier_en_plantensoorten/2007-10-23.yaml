preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 18 februari 2000, nr.
    TRCJZ/2000/1689, Directie Juridische Zaken;

    Gelet op artikel 16, eerste lid, onderdeel c, van richtlijn nr. 92/43/EEG van de Raad van de Europese
    Gemeenschappen van 21 mei 1992 inzake de instandhouding van de natuurlijke habitats en de wilde flora- en fauna
    (PbEG L 206);

    Gelet op de artikelen 75, eerste lid en vierde lid, onderdelen a, b en c en 81, eerste lid, van de Flora- en
    faunawet;

    De Raad van State gehoord (advies van 26 mei 2000, nr. W11.00.0064/V);

    Gezien het nader rapport van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 21 november 2000, nr.
    TRCZ/2000/9599, Directie Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel1
  - number: 1.a
    text: |-
      wet: [Flora- en faunawet][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0009640
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009640
  - number: 1.b
    text: |-
      gesloten pootring: individueel gemerkte, naadloze, ononderbroken ring of manchet, zonder enige naad of las, waarmee
      op geen enkele wijze is geknoeid en waarvan het formaat zodanig is dat hij, nadat hij in de eerste levensdagen
      van de vogel is aangebracht, niet kan worden verwijderd wanneer de poot van de vogel zijn definitieve omvang heeft
      bereikt;
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel1
  - number: 1.c
    text: |-
      basisverordening: [verordening (EG) nr. 338/97](31997R0338) van de Raad van de Europese Unie van 9 december
      1996 inzake de bescherming van in het wild levende dier- en plantesoorten door controle op het desbetreffende
      handelsverkeer (PbEG 1997, L 61);
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel1
  - number: 1.d
    text: |-
      Habitatrichtlijn: [richtlijn nr. 92/43/EEG](31992L0043) van de Raad van de Europese Gemeenschappen van 21 mei 1992
      inzake de instandhouding van de natuurlijke habitats en de wilde flora en fauna (PbEG 1992, L 206);
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel1
  - number: 1.e
    text: |-
      Vogelrichtlijn: [richtlijn nr. 79/409/EEG](31979L0409) van de Raad van de Europese Gemeenschappen van 2 april 1979
      inzake het behoud van de vogelstand (PbEG 1979, L 103/1).
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel1
  - number: 1a
    text: |-
      Dit besluit berust op de [artikelen 75, eerste en vierde lid en vijfde lid, onderdelen a, b en c][ref1],
      [76, eerste lid][ref2], [77][ref3], en [81, eerste lid, van de Flora- en faunawet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel76
      [ref3]: https://wetten.overheid.nl/BWBR0009640#Artikel77
      [ref4]: https://wetten.overheid.nl/BWBR0009640#Artikel81
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '75'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '76'
      - id: ref3
        bwb_id: BWBR0009640
        artikel: '77'
      - id: ref4
        bwb_id: BWBR0009640
        artikel: '81'
  - number: '2.1'
    text: |-
      Als beschermde inheemse dier- en plantensoorten als bedoeld in [artikel 75, vijfde lid, van de wet][ref1] zijn
      aangewezen de dier- en plantensoorten, genoemd in [bijlage 1][ref2] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0011853
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '75'
      - id: ref2
        bwb_id: BWBR0011853
  - number: '2.2'
    text: |-
      Als aantal en soort als bedoeld in [artikel 75, vijfde lid, onderdeel b, van de wet][ref1] zijn aangewezen 10.000
      wilde eenden (*Anas platyrhynchos*) per jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel75
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '75'
  - number: '2.3'
    text: |-
      Als andere belangen als bedoeld in [artikel 75, vijfde lid, onderdeel c, van de wet][ref1] zijn aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel75
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '75'
  - number: 2.3.a
    text: |-
      de bepalingen inzake de gemeenschappelijke markt en een vrij verkeer van goederen van het Verdrag tot oprichting
      van de Europese Gemeenschap;
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel2
  - number: 2.3.b
    text: de bescherming van flora en fauna;
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel2
  - number: 2.3.c
    text: de veiligheid van het luchtverkeer;
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel2
  - number: 2.3.d
    text: de volksgezondheid of openbare veiligheid;
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel2
  - number: 2.3.e
    text: |-
      dwingende redenen van groot openbaar belang, met inbegrip van redenen van sociale of economische aard en voor het
      milieu wezenlijk gunstige effecten;
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel2
  - number: 2.3.f
    text: |-
      het voorkomen van ernstige schade aan vormen van eigendom, anders dan gewassen, vee, bossen, bedrijfsmatige
      visserij en wateren;
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel2
  - number: 2.3.g
    text: belangrijke overlast veroorzaakt door dieren, behorende tot een beschermde inheemse diersoort;
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel2
  - number: 2.3.h
    text: de uitvoering van werkzaamheden in het kader van bestendig beheer en onderhoud in de landbouw en in de bosbouw;
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel2
  - number: 2.3.i
    text: bestendig gebruik;
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel2
  - number: 2.3.j
    text: de uitvoering van werkzaamheden in het kader van ruimtelijke inrichting of ontwikkeling.
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel2
  - number: 2a
    text: |-
      In totaal kunnen ten hoogste 200 ontheffingen worden verleend voor het onder zich hebben van gefokte jachtvogels
      ten behoeve van de uitoefening van de jacht en de uitoefening van bevoegdheden toegekend in het kader van beheer
      en schadebestrijding.
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel2a
  - number: 2b.1
    text: |-
      Met betrekking tot de plantensoorten, genoemd in bijlage IV van de Habitatrichtlijn, en de plantensoorten, genoemd
      in [bijlage 1][ref1] bij dit besluit, kan van [artikel 8 van de wet][ref2] slechts vrijstelling of ontheffing worden
      verleend ten behoeve van de belangen, genoemd in [artikel 2, derde lid, onderdelen a, b, c, d, e of f][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011853
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011853#Artikel2
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0011853
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0011853
        artikel: '2'
        hoofdstuk: '1'
  - number: 2b.2
    text: |-
      In afwijking van het bepaalde in het eerste lid kan met betrekking tot de in het eerste lid bedoelde soorten tevens
      vrijstelling of ontheffing worden verleend van [artikel 8 van de wet][ref1] ten behoeve van de belangen, genoemd in
      [artikel 2, derde lid, onderdelen h, i en j][ref2], mits ten aanzien van de in het eerste lid bedoelde soorten:


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011853#Artikel2
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011853
        artikel: '2'
        hoofdstuk: '1'
  - number: 2b.2.a
    text: geen benutting of economisch gewin plaatsvindt en
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel2b
  - number: 2b.2.b
    text: |-
      zorgvuldig wordt gehandeld, hetgeen in elk geval inhoudt dat van de werkzaamheden of het gebruik geen wezenlijke
      invloed uitgaat op de in het eerste lid bedoelde soorten.
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel2b
  - number: 2b.3
    text: |-
      Het bepaalde in dit artikel is niet van toepassing op gekweekte planten, behorende tot een beschermde inheemse
      plantensoort die is vermeld in bijlage IV van de Habitatrichtlijn of in [bijlage 1][ref1] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0011853
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0011853
  - number: 2c.1
    text: |-
      Met betrekking tot de diersoorten, genoemd in bijlage IV van de Habitatrichtlijn, en de diersoorten, genoemd in
      [bijlage 1][ref1] bij dit besluit, kan:


