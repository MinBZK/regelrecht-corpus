      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0009640#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0011853#Artikel2
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel2d
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0009640
        artikel: '12'
      - id: ref4
        bwb_id: BWBR0011853
        artikel: '2'
        hoofdstuk: '1'
  - number: 2d.4.a
    text: geen benutting of economisch gewin plaatsvindt en
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel2d
  - number: 2d.4.b
    text: zorgvuldig wordt gehandeld.
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel2d
  - number: 2d.5
    text: 'Zorgvuldig handelen als bedoeld in het vierde lid, onderdeel b, houdt in elk geval in dat:'
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel2d
  - number: 2d.5.a
    text: van de werkzaamheden of het gebruik geen wezenlijke invloed uitgaat op de in het eerste lid bedoelde soorten en
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel2d
  - number: 2d.5.b
    text: |-
      voorafgaand en tijdens de werkzaamheden of het gebruik in redelijkheid alles is of zal worden verricht of gelaten
      om te voorkomen of zoveel mogelijk te beperken dat:
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel2d
  - number: 2d.5.b.1°
    text: |-
      de in het eerste lid bedoelde dieren worden gedood, verwond, gevangen, bemachtigd of met het oog daarop worden
      opgespoord;
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel2d
  - number: 2d.5.b.2°
    text: |-
      nesten, holen of andere voortplantings- of vaste rust- of verblijfplaatsen van de in het eerste lid bedoelde dieren
      worden beschadigd, vernield, uitgehaald, weggenomen of verstoord;
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel2d
  - number: 2d.5.b.3°
    text: eieren van de in het eerste lid bedoelde dieren worden beschadigd of vernield.
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel2d
  - number: 2d.6
    text: |-
      Het bepaalde in dit artikel is niet van toepassing op gefokte vogels, behorende tot een soort als bedoeld in
      [artikel 4, eerste lid, onderdeel b, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel4
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel2d
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '4'
  - number: '3'
    text: |-
      Met uitzondering van de [artikelen 11][ref1], [14][ref2] en [14a][ref3] en de [hoofdstukken 3 tot en met 5][ref4]
      is dit besluit niet van toepassing op planten of producten van planten, noch op dieren of eieren, nesten of
      producten van dieren, behorende tot soorten genoemd in de bijlagen van de basisverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0011853#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0011853#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0011853#Artikel14a
      [ref4]: https://wetten.overheid.nl/BWBR0011853#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011853
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0011853
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0011853
        artikel: 14a
        hoofdstuk: '2'
        paragraaf: '6'
      - id: ref4
        bwb_id: BWBR0011853
        hoofdstuk: '3'
  - number: '4.1'
    text: |-
      De verboden, bedoeld in de [artikelen 9 tot en met 11][ref1] en [13, eerste lid, van de wet][ref2], gelden niet ten
      aanzien van gefokte dieren behorende tot een bij ministeriële regeling aangewezen beschermde inheemse diersoort,
      alsmede voor producten van die dieren, voorzover de houder kan aantonen dat de dieren zijn gefokt, of, indien het
      producten betreft, dat de betrokken producten van gefokte dieren afkomstig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '13'
  - number: '4.2'
    text: |-
      De verboden, bedoeld in de [artikelen 9 tot en met 11][ref1] en [13, eerste lid, van de wet][ref2], gelden niet ten
      aanzien van edelherten, damherten en wilde zwijnen die met het oog op de productie van van die dieren afkomstige
      producten worden gehouden op terreinen kleiner dan 40 hectare, alsmede voor producten van die dieren, voorzover de
      houder kan aantonen dat de betrokken producten van die dieren afkomstig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '13'
  - number: '5.1'
    text: |-
      De verboden, bedoeld in de [artikelen 9 tot en met 12][ref1] en [13, eerste lid, van de wet][ref2], gelden niet
      ten aanzien van gefokte vogels behorende tot een beschermde inheemse diersoort, alsmede voor eieren, nesten of
      producten van die vogels, indien de houder kan aantonen dat de vogels zijn gefokt, of, indien het eieren, nesten of
      producten van die vogels betreft, dat de betrokken producten van gefokte vogels afkomstig zijn en voorzover:


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '13'
  - number: 5.1.a
    text: |-
      deze vogels zijn voorzien van een pootring als bedoeld in [artikel 6][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011853#Artikel6
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011853
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 5.1.b
    text: |-
      registratie heeft plaatsgevonden in de administratie bedoeld in [artikel 8][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0011853#Artikel8
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011853
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 5.1.c
    text: |-
      voldaan is aan de krachtens [artikel 18][ref1] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0011853#Artikel18
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011853
        artikel: '18'
        hoofdstuk: '5'
  - number: '5.2'
    text: |-
      Onze Minister kan ontheffing verlenen van de verplichting dat gefokte vogels voorzien dienen te zijn van een
      pootring voor bedrijfsmatig, met het oog op de productie, gefokte vogels.
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel5
  - number: '6.1'
    text: |-
      Gefokte vogels behorende tot een beschermde inheemse diersoort zijn voorzien van een door Onze Minister op
      aanvraag afgegeven gesloten pootring, dan wel van een gesloten pootring die door een overheidsorgaan van een andere
      staat dan Nederland, of een door een overheidsorgaan van een andere staat dan Nederland erkende organisatie, is
      afgegeven.
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel6
  - number: '6.2'
    text: Bij ministeriële regeling kunnen regels worden gesteld betreffende de afgifte en kenmerken van gesloten pootringen.
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel6
  - number: '7'
    text: |-
      De vrijstelling, bedoeld in [artikel 5, eerste lid][ref1], geldt eveneens voor gefokte vogels die voorzien zijn van
      een ander merkteken dan bedoeld in [artikel 6, eerste lid][ref2], dat door een overheidsorgaan van een andere staat
      dan Nederland, of een door een overheidsorgaan van een andere staat dan Nederland erkende organisatie is afgegeven,
      en voldoet aan de eisen die bij ministeriële regeling gesteld zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011853#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011853#Artikel6
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011853
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0011853
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '8'
    text: |-
      Door Onze Minister wordt een administratie bijgehouden waaruit blijkt aan wie, wanneer en met welke maten en
      registratienummers gesloten pootringen als bedoeld in [artikel 6][ref1] zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0011853#Artikel6
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011853
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '9.1'
    text: |-
      De verboden, bedoeld in de [artikelen 8][ref1] en [13, eerste lid, van de wet][ref2], gelden niet ten aanzien van
      planten of producten van planten, behorende tot een beschermde inheemse of uitheemse plantensoort, voorzover de
      houder kan aantonen dat de planten zijn gekweekt of, indien het producten betreft, dat de betrokken producten van
      gekweekte planten afkomstig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '13'
  - number: '9.2'
    text: |-
      De verboden, bedoeld in [artikel 13, eerste lid, van de wet][ref1], gelden niet ten aanzien van planten behorende
      tot de soort maretak (Viscum album), de soort wilde kievitsbloem (Fritillaria meleagris) of de soort zomerklokje
      (Leucojum aestivum), voorzover de houder kan aantonen dat de betrokken planten of producten op geoorloofde wijze
      elders dan in Nederland zijn verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
  - number: '9.3'
    text: |-
      De verboden, bedoeld in [artikel 13, eerste lid, van de wet][ref1], gelden niet ten aanzien van producten van
      planten, behorende tot een beschermde inheemse plantensoort, voorzover de houder kan aantonen dat de betrokken
      producten van planten op geoorloofde wijze elders dan in Nederland zijn verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
  - number: 9a
    text: |-
      De verboden op het onder zich hebben en vervoeren, bedoeld in [artikel 14, derde lid, van de wet][ref1], van in
      dat artikel bedoelde planten of dieren gelden niet ten aanzien van de grote waternavel (Hydrocotyle ranunculoides)
      voorzover die handelingen ten doel hebben planten behorende tot die soort te verdelgen.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel14
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '14'
  - number: '10'
    text: |-
      De verboden, bedoeld in [artikel 13, eerste lid, van de wet][ref1], gelden niet ten aanzien van producten van wild:


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
  - number: 10.a
    text: gedurende het tijdvak van de opening tot en met de tiende dag na de sluiting van de jacht op dat wild, dan wel;
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel10
  - number: 10.b
    text: gedurende het tijdvak vanaf de elfde dag na de sluiting tot de opening van de jacht op dat wild,
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel10
  - number: '11.1'
    text: |-
      De verboden op het onder zich hebben en vervoeren van producten van dieren, bedoeld in
      [artikel 13, eerste lid, van de wet][ref1], gelden niet ten aanzien van producten van dieren, behorende tot een
      beschermde inheemse diersoort, voorzover deze producten afkomstig zijn van bij ministeriële regeling aanwezen
      dieren, indien de houder van de betrokken producten kan aantonen dat deze zijn verworven overeenkomstig het
      bepaalde bij of krachtens [hoofdstuk V, titel III, afdeling 1, paragraaf 3, van de wet](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
  - number: '11.2'
    text: |-
      De verboden, bedoeld in [artikel 13, eerste lid, van de wet][ref1], gelden niet ten aanzien van producten
      van dieren, behorende tot een beschermde inheemse diersoort, voorzover deze producten afkomstig zijn van bij
      ministeriële regeling aangewezen dieren, indien de houder van de betrokken producten kan aantonen dat deze zijn
      verworven overeenkomstig het bepaalde bij of krachtens [hoofdstuk V, titel III, afdeling 1, paragraaf 3, van de
      wet](onbekend), dan wel op geoorloofde wijze elders dan in Nederland zijn verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
  - number: '12'
    text: |-
      De verboden, bedoeld in [artikel 13, eerste lid, van de wet][ref1], gelden niet ten aanzien van producten van
      dieren van de soorten zadelrob (Phoca groenlandica) en klapmuts (Cystophora cristata) voorzover deze afkomstig zijn
      van de traditionele jacht van de Inuit en evenmin ten aanzien van dieren van deze soorten.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
  - number: '13.1'
    text: |-
      De verboden op het vangen en bemachtigen van dieren behorende tot een beschermde inheemse diersoort, bedoeld
      in [artikel 9 van de wet][ref1], en van de verboden op het vervoeren en onder zich hebben van dieren, behorende
      tot een beschermde inheemse diersoort, bedoeld in [artikel 13, eerste lid, van de wet][ref2], gelden niet ten
      aanzien van beschermde inheemse kikkers, padden en salamanders indien de betrokken handelingen plaatsvinden ter
      veiligstelling van deze dieren tegen het verkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '13'
  - number: '13.2'
    text: |-
      De in het eerste lid genoemde vrijstelling geldt slechts voor het vervoer van de dieren over een afstand van ten
      hoogste 50 meter vanaf de vangplaats en voorzover de dieren na het vervoeren onmiddellijk weer in vrijheid worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel13
  - number: '14.1'
    text: |-
      De verboden op het vervoeren en onder zich hebben, bedoeld in [artikel 13, eerste lid, van de wet][ref1], gelden
      niet ten aanzien van zieke of gewonde dieren behorende tot een beschermde inheemse diersoort ten behoeve van opvang
      en verzorging.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
  - number: '14.2'
    text: |-
      De in het eerste lid genoemde vrijstelling geldt slechts voorzover de dieren binnen twaalf uur worden overgedragen
      aan personen of instanties die gerechtigd zijn de dieren onder zich te hebben.
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel14
  - number: '14.3'
    text: |-
      Met betrekking tot reeën, edelherten, damherten en wilde zwijnen geldt de vrijstelling, bedoeld in het eerste lid,
      uitsluitend indien vóór het vervoer melding is gemaakt bij de meldkamer van het regionale politiekorps in de regio
      waar een dier wordt aangetroffen van het aantal, de vindplaats en de soort zieke of gewonde dieren en voorzover dat
      vervoer geschiedt door een door de politie aangewezen vervoerder.
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel14
  - number: 14a.1
    text: |-
      De verboden op het vervoeren en onder zich hebben, bedoeld in [artikel 13, eerste lid, van de wet][ref1], gelden
      niet ten aanzien van keutels, braakballen, losse veren, haarballen, sterrenschot en afgeworpen geweien afkomstig
      van dieren, behorende tot een beschermde inheemse diersoort.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
  - number: 14a.2
    text: |-
      Voorzover de in het eerste lid bedoelde producten van dieren afkomstig zijn van of producten bevatten van
      vogelsoorten als bedoeld in [artikel 4, eerste lid, van de wet][ref1] of van diersoorten, genoemd in bijlage IV
      van de Habitatrichtlijn of in [bijlage 1][ref2] bij dit besluit, geldt de vrijstelling, bedoeld in het eerste lid,
      slechts als het vervoer of het onder zich hebben geschiedt met het oog op gebruik van deze producten bij onderzoek
      en onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011853
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011853
  - number: '16.1'
    text: |-
      De verboden op het onder zich hebben en vervoeren, bedoeld in [artikel 13, eerste lid, van de wet][ref1], gelden
      niet ten aanzien van de groene kikker (*Rana esculenta*), de bruine kikker (*Rana temporaria*) en de gewone pad
      (*Bufo bufo*), alsmede ten aanzien van eieren van deze soorten, voorzover het vervoer of het onder zich hebben
      geschiedt met het oog op gebruik van deze dieren of eieren van deze dieren bij onderzoek en onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
  - number: '16.2'
    text: |-
      De vrijstelling in het eerste lid geldt niet ten aanzien van groene kikkers, bruine kikkers en gewone padden
      waarvan de metamorfose is voltooid.
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel16
  - number: 16a
    text: |-
      De verboden, bedoeld in de [artikelen 10 tot en met 12 van de wet][ref1], gelden niet ten aanzien van weidevogels,
      behorende tot vogels als bedoeld in [artikel 4, eerste lid, onderdeel b, van de wet][ref2], ten behoeve van
      activiteiten bestemd en geschikt voor de bescherming van weidevogels, hun eieren en hun niet-vliegvlugge jongen
      tegen landbouwwerkzaamheden en vee.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel4
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '4'
  - number: 16b.1
    text: |-
      De verboden, bedoeld in de [artikelen 8 tot en met 12 van de wet][ref1], gelden niet bij:


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel8
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '8'
  - number: 16b.1.a
    text: |-
      de uitvoering van werkzaamheden in het kader van bestendig beheer of onderhoud van vaarwegen, watergangen,
      waterkeringen, oevers, vliegvelden, wegen, spoorwegen en bermen en in het kader van natuurbeheer;
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel16b
  - number: 16b.1.b
    text: de uitvoering van werkzaamheden in het kader van bestendig beheer of onderhoud in de landbouw en de bosbouw;
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel16b
  - number: 16b.1.c
    text: bestendig gebruik;
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel16b
  - number: 16b.1.d
    text: de uitvoering van werkzaamheden in het kader van ruimtelijke ontwikkeling en inrichting.
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel16b
  - number: 16b.2
    text: |-
      De vrijstellingen, bedoeld in het eerste lid, gelden ten aanzien van in het wild levende dieren en planten
      behorende tot:
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel16b
  - number: 16b.2.a
    text: bij ministeriële regeling aangewezen beschermde inheemse dier- en plantensoorten;
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel16b
  - number: 16b.2.b
    text: |-
      overige beschermde inheemse dier- en plantensoorten, mits de werkzaamheden en het gebruik aantoonbaar plaatsvinden
      overeenkomstig een door Onze Minister goedgekeurde gedragscode.
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel16b
  - number: 16b.3
    text: |-
      In afwijking van het tweede lid, onderdeel b, gelden de vrijstellingen, bedoeld in het eerste lid, onderdelen b
      en c, voor wat betreft [artikel 10 van de wet][ref1] niet ten aanzien van de soorten, genoemd in bijlage IV van de
      Habitatrichtlijn en in [bijlage 1][ref2] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011853
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0011853
  - number: 16b.4
    text: |-
      In afwijking van het tweede lid, onderdeel b, geldt de vrijstelling, bedoeld in het eerste lid, onderdeel d, niet
      ten aanzien van de soorten, genoemd in bijlage IV van de Habitatrichtlijn en in [bijlage 1][ref1] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0011853
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0011853
  - number: 16b.5
    text: |-
      Bij de in het tweede lid bedoelde ministeriële regeling worden niet aangewezen vogelsoorten als bedoeld in
      [artikel 4, eerste lid, onderdeel b, van de wet][ref1] en soorten, die genoemd worden in bijlage IV van de
      Habitatrichtlijn en in [bijlage 1][ref2] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011853
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011853
  - number: 16c.1
    text: |-
      Een gedragscode, als bedoeld in [artikel 16b, tweede lid, onderdeel b][ref1], wordt slechts goedgekeurd, indien
      hierin een wijze van uitvoering van werkzaamheden of gebruik is beschreven waarmee naar het oordeel van Onze
      Minister afdoende gewaarborgd is dat ten aanzien van de in [artikel 16b, tweede lid, onderdeel b][ref2], bedoelde
      soorten:


      [ref1]: https://wetten.overheid.nl/BWBR0011853#Artikel16b
      [ref2]: https://wetten.overheid.nl/BWBR0011853#Artikel16b
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel16c
    references:
      - id: ref1
        bwb_id: BWBR0011853
        artikel: 16b
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0011853
        artikel: 16b
        hoofdstuk: '3'
  - number: 16c.1.a
    text: geen benutting of economisch gewin plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel16c
  - number: 16c.1.b
    text: 'zorgvuldig wordt gehandeld, hetgeen inhoudt dat:'
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel16c
  - number: 16c.1.b.1°
    text: |-
      slechts werkzaamheden verricht worden of gebruik plaatsvindt waarvan geen wezenlijke invloed uitgaat op de in
      [artikel 16b, tweede lid, onderdeel b][ref1], bedoelde soorten;


      [ref1]: https://wetten.overheid.nl/BWBR0011853#Artikel16b
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel16c
    references:
      - id: ref1
        bwb_id: BWBR0011853
        artikel: 16b
        hoofdstuk: '3'
  - number: 16c.1.b.2°
    text: |-
      voor wat betreft dieren voorafgaand en tijdens de werkzaamheden of het gebruik in redelijkheid alles wordt verricht
      of gelaten om te voorkomen of zoveel mogelijk te beperken dat:
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel16c
  - number: 16c.1.b.2°.i
    text: |-
      de in [artikel 16b, tweede lid, onderdeel b][ref1], bedoelde dieren worden gedood, verwond, gevangen, bemachtigd of
      met het oog daarop worden opgespoord;


      [ref1]: https://wetten.overheid.nl/BWBR0011853#Artikel16b
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel16c
    references:
      - id: ref1
        bwb_id: BWBR0011853
        artikel: 16b
        hoofdstuk: '3'
  - number: 16c.1.b.2°.ii
    text: |-
      nesten, holen of andere voortplantings- of vaste rust- of verblijfplaatsen van de in
      [artikel 16b, tweede lid, onderdeel b][ref1], bedoelde dieren worden beschadigd, vernield, uitgehaald, weggenomen
      of verstoord;


      [ref1]: https://wetten.overheid.nl/BWBR0011853#Artikel16b
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel16c
    references:
      - id: ref1
        bwb_id: BWBR0011853
        artikel: 16b
        hoofdstuk: '3'
  - number: 16c.1.b.2°.iii
    text: |-
      eieren van de in [artikel 16b, tweede lid, onderdeel b][ref1], bedoelde dieren worden beschadigd of vernield.


      [ref1]: https://wetten.overheid.nl/BWBR0011853#Artikel16b
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel16c
    references:
      - id: ref1
        bwb_id: BWBR0011853
        artikel: 16b
        hoofdstuk: '3'
  - number: 16c.2
    text: |-
      Onze Minister kan het goedkeuringsbesluit intrekken, indien naar zijn oordeel de staat van instandhouding van de
      soorten, bedoeld in [artikel 16b, tweede lid, onderdeel b][ref1], of de trend in de staat van instandhouding van
      deze soorten daartoe noodzaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0011853#Artikel16b
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel16c
    references:
      - id: ref1
        bwb_id: BWBR0011853
        artikel: 16b
        hoofdstuk: '3'
  - number: 16d
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ten aanzien van de vrijstellingen, bedoeld
      in [artikel 16b, eerste lid][ref1], en ten aanzien van de goedkeuring van gedragscodes als bedoeld in
      [artikel 16c][ref2] waarbij onder andere onderscheid kan worden gemaakt tussen beschermde inheemse soorten.


      [ref1]: https://wetten.overheid.nl/BWBR0011853#Artikel16b
      [ref2]: https://wetten.overheid.nl/BWBR0011853#Artikel16c
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel16d
    references:
      - id: ref1
        bwb_id: BWBR0011853
        artikel: 16b
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0011853
        artikel: 16c
        hoofdstuk: '3'
  - number: 16e.1
    text: |-
      De verboden, bedoeld in de [artikelen 9 tot en met 11 van de wet][ref1], gelden niet ten aanzien van de
      huisspitsmuis (Crocidura russula) voorzover dit dier zich in of op gebouwen of daarbij behorende erven of roerende
      zaken bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel9
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel16e
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '9'
  - number: 16e.2
    text: |-
      De verboden, bedoeld in [artikel 9 tot en met 11 van de wet][ref1], gelden niet ten aanzien van de mol (Talpa
      europea) de bosmuis (Apodemus sylvaticus) en de veldmuis (Microtus arvalis).


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel9
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel16e
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '9'
  - number: 16f
    text: |-
      Het verbod, bedoeld in [artikel 15, tweede lid, van de wet][ref1], geldt niet ten aanzien van het binnen
      de bebouwde kom vangen van verwilderde katten (*Felis catus*) en verwilderde duiven (*Columba livia* forma
      *domestica*) met vangkooien.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel15
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel16f
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '15'
  - number: 16g
    text: |-
      De verboden op het onder zich hebben en vervoeren, bedoeld in [artikel 13, eerste lid, van de wet][ref1], gelden
      niet ten aanzien van de afvoer van planten en producten van planten, behorende tot een beschermde inheemse
      plantensoort, in verband met werkzaamheden als bedoeld in [artikel 16b, eerste lid][ref2], die verricht worden in
      overeenstemming met [artikel 16b][ref3] en de nadere regels die op grond van [artikel 16d][ref4] zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0011853#Artikel16b
      [ref3]: https://wetten.overheid.nl/BWBR0011853#Artikel16b
      [ref4]: https://wetten.overheid.nl/BWBR0011853#Artikel16d
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel16g
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0011853
        artikel: 16b
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0011853
        artikel: 16b
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0011853
        artikel: 16d
        hoofdstuk: '3'
  - number: 16h.1
    text: |-
      Het verbod, bedoeld in [artikel 14, eerste lid van de wet][ref1], geldt niet ten aanzien van dieren of eieren van
      dieren, behorende tot bij ministeriële regeling aangewezen diersoorten, ten behoeve van de bestrijding van ziekten,
      plagen of onkruiden.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel14
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel16h
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '14'
  - number: 16h.2
    text: |-
      De vrijstelling als bedoeld in het eerste lid kan bij ministeriële regeling naar gelang een soort of groep van
      soorten worden beperkt tot delen van Nederland of tot bepaalde categorieën gebieden.
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel16h
  - number: '17'
    text: |-
      Ter uitvoering van artikel 12 van de basisverordening worden bij ministeriële regeling plaatsen aangewezen waar
      planten behorende tot beschermde inheemse of uitheemse plantensoorten of dieren behorende tot beschermde inheemse
      of uitheemse diersoorten, alsmede producten van die planten of producten of eieren van die dieren, vanuit derde
      landen het grondgebied van Nederland dienen te worden binnengebracht en vanuit Nederland naar derde landen worden
      uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel17
  - number: 17a.1
    text: |-
      Ter uitvoering van artikel 13, eerste lid, onderdeel a, van de basisverordening is Onze Minister van Landbouw,
      Natuurbeheer en Visserij belast met de uitvoering van de basisverordening en de contacten met de Commissie.
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel17a
  - number: 17a.2
    text: |-
      Onze Minister van Landbouw, Natuurbeheer en Visserij kan nadere regels stellen voor een goede uitvoering van de
      basisverordening en de daarop gebaseerde uitvoeringsverordening.
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel17a
  - number: '18'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over het voeren van een administratie en verstrekken van
      gegevens met betrekking tot het onder zich hebben, ontvangen, verkopen, ten verkoop voorradig of voorhanden hebben
      en afleveren van dieren of planten, dan wel producten van die planten of producten of eieren van die dieren.
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel18
  - number: '19.1'
    text: |-
      [Artikel 6, eerste lid][ref1], geldt niet voor het onder zich hebben van gefokte vogels behorende tot soorten
      genoemd in [artikel 2 van de Jachtwet][ref2], voorzover deze op het tijdstip van inwerkingtreding van dit besluit
      werden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0011853#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002155#Artikel2
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011853
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002155
        artikel: '2'
  - number: '19.2'
    text: |-
      [Artikel 6, eerste lid][ref1], geldt niet voor het onder zich hebben van gefokte vogels behorende tot de soorten
      bedoeld in artikel 1, onder 2, van de Vogelwet 1936, voorzover deze op het tijdstip van inwerkingtreding van dit
      besluit werden gehouden overeenkomstig artikel 35 van de Vogelwet 1936 of de artikelen 6, eerste lid, onderdeel b,
      7, eerste lid, onderdeel a, 23 of 25 van het Vogelbesluit 1994.


      [ref1]: https://wetten.overheid.nl/BWBR0011853#Artikel6
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011853
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '20'
    text: |-
      Een wijziging van de in dit besluit genoemde verordening geldt voor de toepassing van dit besluit met ingang van de
      dag waarop de betrokken wijzigingsverordening in werking treedt.
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel20
  - number: '21'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel21
  - number: '22'
    text: 'Dit besluit wordt aangehaald als: Besluit vrijstelling beschermde dier- en plantensoorten.'
    url: https://wetten.overheid.nl/BWBR0011853/2007-10-23#Artikel22
