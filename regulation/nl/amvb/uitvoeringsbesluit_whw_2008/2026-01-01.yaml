  - number: '4.8'
    text: |-
      1 Een in het register onderwijsdeelnemers geregistreerde inschrijving voor een opleiding van eerste inschrijving
      van een student voor een associate degree-opleiding geldt als een bekostigde inschrijving op de peildatum, indien
      het totaal aantal eerder bekostigde inschrijvingen voor associate degree-opleidingen en bacheloropleidingen
      gezamenlijk kleiner is dan vier.

      2 Een in het register onderwijsdeelnemers geregistreerde inschrijving voor een opleiding van eerste inschrijving
      van een student voor een bacheloropleiding geldt als een bekostigde inschrijving op de peildatum, indien het totaal
      aantal eerder bekostigde inschrijvingen voor associate degree-opleidingen en bacheloropleidingen kleiner is dan de
      wettelijke studielast van de desbetreffende opleiding, gedeeld door 60.

      3 Een in het register onderwijsdeelnemers geregistreerde inschrijving voor een opleiding van eerste inschrijving
      van een student voor een masteropleiding geldt als een bekostigde inschrijving op de peildatum, indien het totaal
      aantal eerder bekostigde inschrijvingen voor masteropleidingen kleiner is dan de wettelijke studielast van de
      desbetreffende opleiding, gedeeld door 60.

      4 Dit artikel is niet van toepassing op inschrijvingen aan de Open Universiteit.
    url: https://wetten.overheid.nl/BWBR0006152/2026-01-01#Artikel4.8
  - number: 4.8a
    text: |-
      1 Een in het register onderwijsdeelnemers geregistreerde inschrijving van een student voor een onderwijseenheid van
      een bacheloropleiding van de Open Universiteit geldt als een bekostigde inschrijving indien

      a. de inschrijving heeft plaatsgevonden in de peilperiode,

      b. de student het collegegeld OU, bedoeld in [artikel 7.45b, eerste lid, van de wet][ref1], is verschuldigd en

      c. het totaal aantal studiepunten van de onderwijseenheden van bacheloropleidingen waarvoor de student zich
      blijkens het register onderwijsdeelnemers eerder, maar op of na 2 oktober 2015 bij de Open Universiteit heeft
      ingeschreven en die door het Rijk worden bekostigd, kleiner is dan de wettelijke studielast van de opleiding
      waartoe de onderwijseenheid behoort.

      2 De omvang van de bekostigde inschrijving wordt bepaald door het aantal studiepunten van de desbetreffende
      onderwijseenheid tot maximaal het verschil tussen de wettelijke studielast van de bacheloropleiding waarvan de
      onderwijseenheid deel uitmaakt en het totaal aantal studiepunten van onderwijseenheden van bacheloropleidingen
      waarvoor de student zich blijkens het register onderwijsdeelnemers eerder, maar op of na 2 oktober 2015 bij de Open
      Universiteit heeft ingeschreven en die door het Rijk worden bekostigd, te delen door 60.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op een inschrijving van een student voor een
      onderwijseenheid van een masteropleiding van de Open Universiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7.45b
    url: https://wetten.overheid.nl/BWBR0006152/2026-01-01#Artikel4.8a
    references:
