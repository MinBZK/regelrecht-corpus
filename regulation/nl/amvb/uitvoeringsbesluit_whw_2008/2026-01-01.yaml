  - number: '2.2'
    text: |-
      1 Het volledig wettelijk collegegeld, bedoeld in [artikel 7.45, eerste lid, van de wet][ref1], bedraagt voor het
      studiejaar 2018–2019 € 2.060.

      2 Het bedrag, genoemd in het eerste lid, wordt jaarlijks bij ministeriële regeling gewijzigd aan de hand van de
      consumentenprijsindex. De ministeriële regeling wordt vastgesteld voor 1 november voorafgaand aan het studiejaar
      waarvoor het gewijzigde collegegeld zal gelden. De wijziging wordt bepaald door de gemiddelde procentuele
      wijziging die de consumentenprijsindex over de periode mei tot en met april, voorafgaand aan de vaststelling van de
      ministeriële regeling, heeft ondergaan ten opzichte van dezelfde periode in het daaraan voorafgaande jaar. De aldus
      verkregen wijziging van het collegegeldbedrag wordt afgerond op het naastbij gelegen gehele getal.

      3 Onder de consumentenprijsindex, bedoeld in het tweede lid, wordt verstaan: de consumentenprijsindex «reeks alle
      huishoudens» zoals vastgesteld door het Centraal Bureau voor de Statistiek.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7.45
