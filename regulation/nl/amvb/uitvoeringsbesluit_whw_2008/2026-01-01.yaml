  - number: '4.20'
    text: |-
      1 Een bij ministeriële regeling vast te stellen deel van het onderzoekdeel wo wordt over de universiteiten verdeeld
      naar rato van de som van de aantallen bekostigde graden per opleiding, bedoeld in [artikel 4.9][ref1], die in de
      peilperiode onderzoek door een universiteit zijn verleend.

      2 Het aantal te bekostigen graden in een opleiding is gelijk aan het product van:

      a. het aantal graden, verleend in die opleiding;

      b. vermenigvuldigd met de factor 2 voor zover het een graad Master betreft; en

      c. vermenigvuldigd met een bij ministeriële regeling vast te stellen factor behorend bij het bekostigingsniveau
      voor het onderzoeksdeel van de desbetreffende opleiding.

      3 Onder de aantallen graden, bedoeld in het eerste lid, verleend door de Universiteit Maastricht, zijn begrepen
      de aantallen graden, vastgesteld overeenkomstig [artikel 4.12, tweede lid][ref2], verleend door de transnationale
      Universiteit Limburg, bedoeld in artikel 2.5a van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006152#Artikel4.9
      [ref2]: https://wetten.overheid.nl/BWBR0006152#Artikel4.12
