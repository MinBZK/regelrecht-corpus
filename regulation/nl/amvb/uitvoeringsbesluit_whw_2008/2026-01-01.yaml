  - number: '4.23'
    text: |-
      1 Bij ministeriële regeling worden bedragen vastgesteld, die uit het onderzoekdeel wo aan universiteiten worden
      toegekend in verband met toponderzoekscholen en bijzondere voorzieningen.

      2 De verdeling van het deel van het onderzoekdeel wo dat na toepassing van de [artikelen 4.20][ref1] en
      [4.21][ref2] en het eerste lid resteert, wordt, onverminderd [artikel 4.5][ref3], over de universiteiten, bedoeld
      in [artikel 1.1, onder 1°][ref4], bij ministeriële regeling vastgesteld.

      3 Indien een universiteit naar het oordeel van Onze Minister onvoldoende rekening houdt met de prioriteit-
      en posterioriteitstelling van de wetenschapsgebieden die zijn aangeduid in het wetenschapsbudget, bedoeld in
      [artikel 16a van de Wet op de Nederlandse organisatie voor wetenschappelijk onderzoek][ref5], wordt daarover en
      over de mogelijke gevolgen voor de bekostiging van de desbetreffende universiteit overleg gevoerd als bedoeld in
      [artikel 3.1 van de wet][ref6].

      4 Indien het overleg, bedoeld in het derde lid, daartoe aanleiding geeft, kan bij ministeriële regeling worden
      afgeweken van de verdeling, bedoeld in het tweede lid.

      5 Een herverdeling als bedoeld in het vierde lid kan per universiteit ten hoogste drie procent van de omvang van
      het bedrag strategische overwegingen voor die universiteit betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0006152#Artikel4.20
