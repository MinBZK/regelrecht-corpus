    text: |-
      Van 1 september 2017 tot en met 31 augustus 2023 wordt onder «opleiding van eerste inschrijving» begrepen:

      1° opleiding waarvoor een student het collegegeld, bedoeld in de [artikelen 7.43, eerste lid, van de wet][ref1], is
      verschuldigd en waarvoor geen vermindering of vrijstelling van het betalen van collegegeld op grond van de wet is
      verkregen, tenzij er sprake is van een vermindering als bedoeld in [artikel 7.48, derde en vierde lid][ref2];

      2° opleiding waarvoor een persoon die het collegegeld, bedoeld in [artikelen 7.43, tweede lid][ref3] of
      [7.44 van de wet][ref4] is verschuldigd, zich als eerste heeft ingeschreven, of

      3° opleiding waarvoor een student collegegeld als bedoeld in
      [artikel 17b van het Besluit experimenten flexibel hoger onderwijs][ref5] heeft betaald.


