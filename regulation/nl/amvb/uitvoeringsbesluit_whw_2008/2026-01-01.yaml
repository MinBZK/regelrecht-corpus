        artikel: '1.8'
  - number: '6.10'
    text: |-
      1 In de aanvraag beschrijft en onderbouwt het instellingsbestuur in ieder geval:

      a. de meerwaarde van de opleiding in het buitenland voor de kwaliteit van het hoger onderwijs in Nederland en
      de profilering van het Nederlandse hoger onderwijs in het buitenland en de meerwaarde van de opleiding in het
      buitenland voor het land van vestiging;

      b. de wijze waarop het onderwijs aan de opleiding in het buitenland zal worden vormgegeven;

      c. de wijze waarop de kwaliteit van het onderwijs aan de opleiding in het buitenland wordt geborgd en in hoeverre
      studenten en personeel van die opleiding daarbij medezeggenschap hebben;

      d. de financiële situatie van de instelling met in ieder geval de financiële planning van de opleiding in het
      buitenland en de wijze waarop financiële risico’s worden tegengegaan;

      e. de wijze waarop de continuïteit van de opleiding in Nederland is gewaarborgd;

      f. ingeval het een instellingsbestuur betreft van een bekostigde instelling als bedoeld in
      [artikel 1.8 van de wet][ref1], de maatregelen die worden getroffen om te voorkomen dat de middelen, bedoeld in
      [artikel 6.8, eerste lid][ref2], worden aangewend voor de opleiding in het buitenland;

      g. de beoogde omvang en schaal van het onderwijs in het buitenland, inclusief het beoogde aantal studenten, in
      verband met de beheersbaarheid van de vestiging in het buitenland;

      h. de wijze waarop de veiligheid en de rechten van de bij het onderwijs aan de opleiding in het buitenland
      betrokken personen, voor zover zij die rechten ontlenen aan de [wet][ref3], worden gewaarborgd;

      i. de wijze waarop wordt gewaarborgd dat de academische vrijheid aan de opleiding in het buitenland in acht wordt
      genomen;

      j. de opvattingen van de bevoegde overheidsinstanties in het land van vestiging over de vestiging van de opleiding
      in het buitenland;

      k. de mensenrechtensituatie en de sociale verhoudingen aan de opleiding in het buitenland en eventuele maatregelen
      die de instelling in verband daarmee neemt;

      l. de wijze waarop de samenwerking met een eventuele partnerorganisatie of partnerorganisaties zal worden
      vormgegeven;

      m. de wijze waarop is voorzien in het afbouwen van de opleiding in het buitenland in financiële en personele zin en
      ten opzichte van studenten, indien de opleiding in het buitenland zou worden beëindigd; en

      n. ingeval het een instellingsbestuur betreft van een bekostigde instelling als bedoeld in
      [artikel 1.8 van de wet][ref4], de wijze waarop de met de opleiding in het buitenland gegenereerde inkomsten worden
      herbestemd en de mate waarin die herbestemming bijdraagt aan de kwaliteit van het hoger onderwijs in Nederland en
      de profilering van het Nederlandse hoger onderwijs in het buitenland.

      2 Bij ministeriële regeling kunnen nadere voorschriften worden gesteld met betrekking tot het indienen van
      aanvragen, de daarbij te overleggen gegevens en bescheiden en de procedure.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1.8
      [ref2]: https://wetten.overheid.nl/BWBR0006152#Artikel6.8
      [ref3]: https://wetten.overheid.nl/BWBR0005682
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel1.8
