    text: |-
      1 Het accreditatieorgaan kan een erkenning ITK onder voorwaarden als bedoeld in
      [artikel 5.27, tweede lid, van de wet][ref1] verlenen indien sprake is van tekortkomingen die naar het oordeel
      van het accreditatieorgaan binnen twee jaar na de verlening kunnen worden weggenomen, op ten hoogste twee van de
      volgende kwaliteitsaspecten:

      a. de visie van de instelling op de kwaliteit van haar onderwijs, bedoeld in
      [artikel 5.23, derde lid, onderdeel a, van de wet][ref2];

      b. de vormgeving van de interne kwaliteitszorg, bedoeld in [artikel 5.23, derde lid, onderdeel b, van de wet][ref3];

      c. de effectiviteit van de interne kwaliteitszorg, bedoeld in
      [artikel 5.23, derde lid, onderdeel b, van de wet][ref4]; of

      d. het gevoerde beleid op het gebied van personeel en voorzieningen, bedoeld in
      [artikel 5.23, derde lid, onderdeel c, van de wet][ref5] dan wel de voorzieningen die de toegankelijkheid en
      studeerbaarheid voor studenten met een functiebeperking bevorderen, bedoeld in artikel 5.23, derde lid, onderdeel
      d, van de wet.

      2 In geval van toepassing van het eerste lid wordt de kwaliteitszorg van de instelling uiterlijk twee jaar na de
      verlening van de erkenning ITK onder voorwaarden, herbeoordeeld op de kwaliteitsaspecten als bedoeld in het eerste
      lid, onderdeel a tot en met d, voor zover deze tekortkomingen bevatten.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op de verlenging van de erkenning ITK onder
      voorwaarden, bedoeld in [artikel 5.27, tweede lid, van de wet][ref6].


