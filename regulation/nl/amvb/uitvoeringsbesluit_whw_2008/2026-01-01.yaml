  - number: '6.11'
    text: |-
      Onze minister wijst de aanvraag af indien niet voldoende aannemelijk is gemaakt dat het verzorgen van de opleiding
      in het buitenland van meerwaarde is voor de kwaliteit van het hoger onderwijs in Nederland en de profilering van
      het Nederlandse hoger onderwijs in het buitenland. Hiervan is in ieder geval sprake indien:

      a. accreditatie nieuwe opleiding onder voorwaarden is verleend als bedoeld in
      [artikel 5.9, tweede lid, van de wet][ref1];

      b. accreditatie bestaande opleiding onder voorwaarden is verleend als bedoeld in
      [artikel 5.17, tweede lid, van de wet][ref2];

      c. sprake is van accreditatie bestaande opleiding onder voorwaarden als bedoeld in [artikel 5.18 van de wet][ref3];

      d. de inspectie ingevolge [artikel 12a, vierde lid][ref4] j°
      [artikel 11, vierde lid, van de Wet op het onderwijstoezicht][ref5] heeft geoordeeld dat de desbetreffende
      instelling tekortschiet in de naleving van wettelijke voorschriften;

      e. de maatregelen om de kwaliteit van de opleiding in het buitenland te borgen, onvoldoende zijn;

      f. de financiële, organisatorische of bestuurlijke stabiliteit en continuïteit van de opleiding in Nederland of in
      het buitenland onvoldoende is gewaarborgd of de maatregelen die worden getroffen om financiële risico’s tegen te
      gaan, onvoldoende zijn;

      g. ingeval de aanvraag een instellingsbestuur betreft van een bekostigde instelling als bedoeld in
      [artikel 1.8 van de wet][ref6], de maatregelen die worden getroffen om te voorkomen dat de middelen, bedoeld in
      [artikel 6.8, eerste lid][ref7], worden aangewend voor de opleiding in het buitenland, onvoldoende zijn;

      h. vanwege de beoogde schaal en aantallen studenten het risico bestaat van onvoldoende beheersbaarheid van de
      vestiging in het buitenland;

      i. de veiligheid en de rechten van de bij de opleiding in het buitenland betrokken personen, voor zover zij die
      rechten ontlenen aan de [wet][ref8], onvoldoende worden gewaarborgd;

      j. de academische vrijheid aan de opleiding in het buitenland onvoldoende is gewaarborgd;

      k. het verzorgen van de opleiding in het buitenland schadelijk is voor de diplomatieke betrekkingen tussen
      Nederland en het land van vestiging of niet passend is in de diplomatieke betrekkingen met het desbetreffende land;

      l. de mensenrechtensituatie of de sociale verhoudingen aan de opleiding en eventuele maatregelen die de instelling
      in verband daarmee heeft genomen, daartoe aanleiding geven;

      m. de wijze waarop de eventuele samenwerking met een partnerorganisatie wordt vormgegeven, onvoldoende garandeert
      dat het instellingsbestuur zelf de opleiding in het buitenland verzorgt en de graden verleent;

      n. aannemelijk is dat de opvattingen van de bevoegde overheidsinstanties in het land van vestiging het verzorgen
      van de opleiding zoals beschreven in de aanvraag ingevolge [artikel 6.10][ref9], in ernstige mate belemmeren;

      o. onvoldoende is voorzien in waarborgen in financiële en personele zin en ten opzichte van studenten, indien de
      opleiding in het buitenland zou worden beëindigd; of

      p. ingeval de aanvraag een instellingsbestuur betreft van een bekostigde instelling als bedoeld in
      [artikel 1.8 van de wet][ref10], niet aannemelijk is dat de wijze van herbestemming van de inkomsten die met de
      opleiding in het buitenland worden gegenereerd, zal bijdragen aan de kwaliteit van het hoger onderwijs in Nederland
      of de profilering van het Nederlandse hoger onderwijs in het buitenland.


