  - number: '6.3'
    text: |-
      Bij de vaststelling van de regels voor uitkeringen wegens ziekte en arbeidsongeschiktheid draagt het
      bestuur er zorg voor dat de aanspraken van het personeel en het gewezen personeel ten minste gelijk, doch
      in elk geval ten minste gelijkwaardig zijn aan de aanspraken die het personeel zou hebben op grond van
      de [Ziektewet][ref1], de [Wet uitbreiding loondoorbetalingsplicht bij ziekte][ref2], onderscheidenlijk de
      [Wet Werk en Inkomen naar Arbeidsvermogen][ref3].


