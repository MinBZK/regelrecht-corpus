  - number: '3.9'
    text: |-
      1 Het accreditatieorgaan kan accreditatie nieuwe opleiding onder voorwaarden als bedoeld in
      [artikel 5.9, tweede lid, van de wet][ref1] of accreditatie bestaande opleiding onder voorwaarden als bedoeld in
      [artikel 5.17, tweede lid, van de wet][ref2] verlenen, indien:

      a. het accreditatieorgaan oordeelt dat de kwaliteit van de opleiding op het kwaliteitsaspect
      beoogd eindniveau, gelet op hetgeen internationaal gewenst en gangbaar is, bedoeld in de
      [artikelen 5.7, eerste lid, onderdeel a][ref3] en [5.12, onderdeel a, van de wet][ref4], geen tekortkomingen bevat;
      en

      b. een of meer van de andere kwaliteitsaspecten, bedoeld in de [artikelen 5.7][ref5] en [5.12, van de wet][ref6],
      tekortkomingen bevatten die naar het oordeel van het accreditatieorgaan binnen twee jaar na de verlening kunnen
      worden weggenomen.

      2 In geval van toepassing van het eerste lid wordt de opleiding uiterlijk twee jaar na de verlening van de
      accreditatie onder voorwaarden, herbeoordeeld op de kwaliteitsaspecten die tekortkomingen bevatten als bedoeld in
      het eerste lid, onderdeel b.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op het behoud van accreditatie bestaande opleiding
      onder voorwaarden als bedoeld in [artikel 5.18 van de wet][ref7] en op het behoud van accreditatie nieuwe opleiding
      als bedoeld in [artikel 5.19, tweede lid][ref8] j° [artikel 5.8, eerste lid, onderdeel c, van de wet][ref9].

      4 Accreditatie nieuwe opleiding onder voorwaarden als bedoeld in [artikel 5.9, tweede lid, van de wet][ref10]
      kan niet worden verleend in geval van een verzwaarde toets nieuwe opleiding voor de eerste opleiding
      die wordt verzorgd door een rechtspersoon die geaccrediteerde opleidingen wil verzorgen als bedoeld in
      [artikel 5.3, eerste lid, onderdeel d, van de wet][ref11].


