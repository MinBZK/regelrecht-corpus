  - number: '4.1'
    text: |-
      1 Onze Minister stelt jaarlijks, in overeenstemming met het desbetreffende onderdeel van zijn begroting, de omvang
      vast van de landelijk beschikbare rijksbijdrage voor de instellingen.

      2 De landelijk beschikbare rijksbijdrage, bedoeld in het eerste lid, bestaat uit:

      a. een onderwijsdeel wo,

      b. een onderwijsdeel hbo,

      c. een onderzoekdeel wo,

      d. een deel ontwerp en ontwikkeling hbo, en

      e. een deel ondersteuning geneeskundig onderwijs en onderzoek.
    url: https://wetten.overheid.nl/BWBR0006152/2026-01-01#Artikel4.1
  - number: '4.2'
    text: |-
      1 Het onderwijsdeel wo wordt overeenkomstig [afdeling 2][ref1] van dit hoofdstuk verdeeld over de instellingen die
      opleidingen in het wetenschappelijk onderwijs verzorgen.

      2 Het onderwijsdeel hbo wordt overeenkomstig [afdeling 2][ref2] van dit hoofdstuk verdeeld over de instellingen die
      opleidingen in het hoger beroepsonderwijs verzorgen.

      3 Het onderzoekdeel wo wordt overeenkomstig [afdeling 3, paragraaf 1][ref3], van dit hoofdstuk verdeeld over de
      universiteiten die opleidingen in het wetenschappelijk onderwijs verzorgen.

      4 Het deel ontwerp en ontwikkeling hbo, bedoeld in [artikel 4.1, tweede lid, onderdeel d][ref4], wordt
      overeenkomstig [afdeling 3, paragraaf 2][ref5] van dit hoofdstuk verdeeld over de hogescholen die opleidingen in
      het hoger beroepsonderwijs verzorgen.

      5 Het deel ondersteuning geneeskundig onderwijs en onderzoek, bedoeld in
      [artikel 4.1, tweede lid, onderdeel e][ref6], wordt overeenkomstig [afdeling 4][ref7] van dit hoofdstuk verdeeld
      over universiteiten.


