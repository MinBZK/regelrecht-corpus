  - number: '4.10'
    text: |-
      1 Het aantal bekostigde inschrijvingen voor een opleiding is het product van de factor behorend bij het
      bekostigingsniveau van de desbetreffende opleiding, bedoeld in het derde lid, en de som van het aantal bekostigde
      inschrijvingen voor die opleiding.

      2 Het aantal bekostigde graden voor een bacheloropleiding of masteropleiding is het product van de factor behorend
      bij het bekostigingsniveau van de desbetreffende opleiding, bedoeld in het derde lid, en de som van het aantal
      bekostigde graden dat in die opleiding is verleend.

      3 De factoren behorend bij het bekostigingsniveau voor het onderwijsdeel van de opleidingen worden vastgesteld bij
      ministeriële regeling. Deze factoren kunnen verschillen voor opleidingen in het wetenschappelijk onderscheidenlijk
      het hoger beroepsonderwijs, en voor associate degree-opleidingen, bacheloropleidingen onderscheidenlijk
      masteropleidingen.

      4 Indien in het kader van een gezamenlijke opleiding of gezamenlijke afstudeerrichting als bedoeld in
      [artikel 7.3c van de wet][ref1] sprake is van registratie van bekostigde bachelorgraden of mastergraden bij
      verschillende Nederlandse instellingen, wordt het aantal bekostigde graden dat het betreft bij elk van deze
      instellingen gedeeld door het aantal Nederlandse instellingen dat bij de gezamenlijke opleiding of gezamenlijke
      afstudeerrichting betrokken is.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7.3c
    url: https://wetten.overheid.nl/BWBR0006152/2026-01-01#Artikel4.10
