  - number: 7.1a
    text: |-
      In afwijking van
      [hoofdstuk 2 van het Besluit rechtspositie leden van de centrale directies en van colleges van bestuur][ref1],
      zoals dat luidde op het tijdstip voordat het werd ingetrokken, blijven ten aanzien van degene die voor
      1 juli 2001 is benoemd of aangesteld tot lid van een centrale directie of van een college van bestuur de
      rechtspositievoorschriften, zoals die jegens hem golden op 30 juni 2001, van kracht, indien en voor zolang de
      betrokkene niet schriftelijk binnen een door het bevoegd gezag vast te stellen termijn van tenminste drie maanden
      vanaf 1 juli 2001 aan het bevoegd gezag heeft medegedeeld dat hij ermee instemt dat zijn rechtspositie krachtens
      [artikel 2][ref2] wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0012613#Hoofdstuk2
