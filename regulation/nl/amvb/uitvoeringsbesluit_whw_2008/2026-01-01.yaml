  - number: 2.3a
    text: |-
      1 Een persoon die blijkens het register onderwijsdeelnemers sedert 1 september 1991 voor de eerste
      keer een opleiding volgt en zich voor het behalen van de aan die opleiding verbonden graad heeft
      ingeschreven voor een of meer andere opleidingen, is voor die andere opleiding of andere opleidingen
      wettelijk collegegeld verschuldigd, mits hij behoort tot één van de groepen van personen, bedoeld in
      [artikel 2.2 van de Wet studiefinanciering 2000][ref1], of de Surinaamse nationaliteit bezit.

      2 Een persoon, bedoeld in het eerste lid, komt uitsluitend in aanmerking voor de aanspraak, bedoeld in het eerste
      lid, indien:

      a. de inschrijving voor de andere opleiding of de andere opleidingen, bedoeld in het eerste lid, heeft
      plaatsgevonden voordat Onze Minister met betrekking tot de voor de eerste keer gevolgde opleiding de mededeling,
      bedoeld in [artikel 7.9d van de wet][ref2], heeft ontvangen; en

      b. die andere opleiding of die andere opleidingen waarop de aanspraak op wettelijk collegegeld betrekking heeft,
      door de betrokkene wordt gevolgd in de vorm van aaneengesloten studiejaren.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2.2
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7.9d
    url: https://wetten.overheid.nl/BWBR0006152/2026-01-01#Artikel2.3a
    references:
