    text: |-
      1 Onze Minister kan uit de onderwijsdelen wo en hbo, aan een universiteit onderscheidenlijk een hogeschool een
      bedrag toekennen dat bij ministeriële regeling wordt vastgesteld in relatie tot kwaliteit, kwetsbare opleidingen of
      bijzondere voorzieningen.

      2 Het gedeelte van een onderwijsdeel dat resteert na toepassing van het eerste lid en van [artikel 4.7][ref1] wordt
      over de universiteiten onderscheidenlijk hogescholen verdeeld volgens percentages, vastgesteld bij ministeriële
      regeling.


