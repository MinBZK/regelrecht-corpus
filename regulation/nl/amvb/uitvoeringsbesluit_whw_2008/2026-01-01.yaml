  - number: '4.24'
    text: |-
      1 Onze Minister kan uit het deel ontwerp en ontwikkeling hbo aan een instelling een bedrag toekennen dat bij
      ministeriële regeling wordt vastgesteld.

      2 Het gedeelte van het deel ontwerp en ontwikkeling hbo dat resteert nadat het eerste lid is toegepast, wordt over
      de hogescholen verdeeld naar rato van de verdeling van het onderwijsdeel hbo.
    url: https://wetten.overheid.nl/BWBR0006152/2026-01-01#Artikel4.24
  - number: '4.27'
    text: |-
      1 Uit het deel ondersteuning geneeskundig onderwijs en onderzoek wordt aan de rijksbijdrage van een universiteit
      waaraan een academisch ziekenhuis is verbonden, een bedrag toegevoegd voor rente en afschrijving, dat wordt
      samengesteld uit:

      a. het jaarlijkse afschrijvingsbedrag ter hoogte van 3,36 procent van een bij ministeriële regeling voor een
      begrotingsjaar vast te stellen investeringbedrag, totdat het investeringsbedrag volledig is afgeschreven, en

      b. de jaarlijks te berekenen rentevergoeding over het verschil tussen het investeringsbedrag en de som van
      het totaal van de vergoede afschrijvingsbedragen op het investeringsbedrag in dat jaar, met inbegrip van het
      afschrijvingsbedrag voor het begrotingsjaar waarvoor de rijksbijdrage wordt vastgesteld.

      2 Jaarlijks wordt bij ministeriële regeling het rentepercentage voor de berekening van de rentevergoeding
      vastgesteld.

      3 Van het deel ondersteuning geneeskundig onderwijs en onderzoek dat na toepassing van het eerste lid resteert
      wordt:

      a. 21 procent verdeeld naar rato van het aantal bekostigde inschrijvingen, bedoeld in [artikel 4.8][ref1], aan de
      opleidingen geneeskunde, geneeskunde-klinisch onderzoeker en arts-klinisch onderzoeker van de universiteit,

      b. 14 procent verdeeld naar rato van het aantal door de universiteit verleende bekostigde graden Master, bedoeld
      in [artikel 4.9][ref2], voor opleidingen geneeskunde, geneeskunde-klinisch onderzoeker en arts-klinisch onderzoeker
      van de universiteit,

      c. een bij ministeriële regeling vast te stellen bedrag toegevoegd aan de rijksbijdrage van de desbetreffende
      universiteit.

      4 Het deel van het deel ondersteuning geneeskundig onderwijs en onderzoek dat na toepassing van het eerste en derde
      lid resteert, wordt verdeeld volgens de percentages, vastgesteld bij ministeriële regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0006152#Artikel4.8
      [ref2]: https://wetten.overheid.nl/BWBR0006152#Artikel4.9
