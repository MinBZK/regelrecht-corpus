  - number: '2.1'
    text: |-
      1 De persoonlijke omstandigheden bedoeld in de [artikelen 7.8b, derde lid][ref1], en [7.9, derde lid][ref2], van de
      wet, zijn:

      a. ziekte van betrokkene,

      b. lichamelijke, zintuiglijke of andere functiestoornis van betrokkene,

      c. zwangerschap van betrokkene,

      d. bijzondere familie-omstandigheden,

      e. het lidmaatschap, daaronder begrepen het voorzitterschap, van:

      1. bij universiteiten: de universiteitsraad, faculteitsraad, het orgaan dat is ingesteld op grond
      van de medezeggenschapsregeling, bedoeld in [artikel 9.30, derde lid][ref3], onderscheidenlijk
      [artikel 9.51, tweede lid][ref4], van de wet, het bestuur van een opleiding of de opleidingscommissie, alsmede
      het lidmaatschap van het bestuur van een stichting die blijkens haar statuten tot doel heeft de exploitatie
      van voorzieningen, behorende tot de studentenvoorzieningen, dan wel van een daarmee naar het oordeel van het
      instellingsbestuur gelet op de taak gelijk te stellen orgaan,

      2. bij hogescholen: de medezeggenschapsraad, deelraad, studentencommissie of opleidingscommissie,

      f. andere in de regelingen, bedoeld in de [artikelen 7.8b, zesde lid][ref5], en [7.9, vijfde lid][ref6], van de wet
      door het instellingsbestuur aan te geven omstandigheden waarin betrokkene activiteiten ontplooit in het kader van
      de organisatie en het bestuur van de zaken van de instelling,

      g. het lidmaatschap van het bestuur van een studentenorganisatie van enige omvang met volledige rechtsbevoegdheid,
      dan wel van een vergelijkbare organisatie van enige omvang, bij wie de behartiging van het algemeen maatschappelijk
      belang op de voorgrond staat en die daartoe daadwerkelijk activiteiten ontplooit,

      h. andere in de onderwijs- en examenregeling, bedoeld in [artikel 7.13 van de wet][ref7], op grond van artikel
      7.13, tweede lid, onderdeel f, van de wet, vast te leggen persoonlijke omstandigheden,

      i. andere dan in de onderdelen a tot en met h bedoelde persoonlijke omstandigheden die, indien zij door het
      instellingsbestuur niet in de beoordeling zouden worden betrokken, zouden leiden tot een onbillijkheid van
      overwegende aard.

      2 Het instellingsbestuur kan voor de toepassing van het eerste lid, onderdeel *g*, nadere regels vaststellen
      omtrent het aantal bestuursleden dat ten hoogste per organisatie per studiejaar in aanmerking komt, zomede omtrent
      welke bestuursfuncties in aanmerking komen.


