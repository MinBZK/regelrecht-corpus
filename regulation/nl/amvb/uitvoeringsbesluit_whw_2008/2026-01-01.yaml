  - number: '4.12'
    text: |-
      1 Onder een opleiding, bedoeld in [artikel 4.10, eerste en tweede lid][ref1], verzorgd door de Universiteit
      Maastricht, is begrepen een opleiding verzorgd door de transnationale Universiteit Limburg, bedoeld in
      [artikel 2.5, lid 1a, onder b, van de wet][ref2].

      2 Bij de vaststelling van het aantal bekostigde inschrijvingen en het aantal bekostigde graden van de Universiteit
      Maastricht worden de op grond van [artikel 4.10, eerste en tweede lid][ref3], berekende aantallen vermeerderd met
      de aantallen inschrijvingen van personen met de Nederlandse nationaliteit, respectievelijk de aantallen graden
      van personen met de Nederlandse nationaliteit van de transnationale Universiteit Limburg. Onder de aantallen
      inschrijvingen en graden met de Nederlandse nationaliteit worden tevens begrepen de aantallen inschrijvingen en
      graden van ingeschrevenen die de Nederlandse noch de Belgische nationaliteit bezitten en die voor bekostiging door
      de Nederlandse overheid in aanmerking worden genomen op grond van artikel 7 van het Verdrag tussen het Koninkrijk
      der Nederlanden en de Vlaamse Gemeenschap van België inzake de transnationale Universiteit Limburg.

      3 Voor de toepassing van de [artikelen 4.9][ref4] en [4.20][ref5] gelden voor de Open Universiteit als bekostigde
      graden, de graden die zijn verleend in de peilperiode aan een persoon die voldoet aan het nationaliteitsvereiste
      als bedoeld in [artikel 2.2, eerste lid, van de Wet studiefinanciering 2000][ref6] of de Surinaamse nationaliteit
      heeft en die is ingeschreven bij de Open Universiteit voor een onderdeel van een bacheloropleiding, terwijl aan hem
      nog niet de graad Bachelor is verleend of voor een onderdeel van een masteropleiding, terwijl hem nog niet de graad
      Master is verleend.


