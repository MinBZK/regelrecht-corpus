  - number: 7.1b
    text: |-
      Ten aanzien van degenen die voor 19 maart 1997 wat betreft de openbare universiteiten dan wel voor 11 juli 1997
      wat betreft de Open Universiteit tot lid van een college van bestuur zijn benoemd, blijven de salarissen, toelagen
      en wachtgeldaanspraken, vastgesteld en toegekend op grond van de op 18 maart 1997 onderscheidenlijk de op 10 juli
      1997 geldende voorschriften gehandhaafd. Indien de salarisbedragen van de overeenkomstige salarisschaal van de
      laatstelijk afgesloten collectieve arbeidsovereenkomst voor de ambtenaren die krachtens een arbeidsovereenkomst met
      de Staat werkzaam zijn worden gewijzigd, is deze wijziging van toepassing op de salarisbedragen van de in de eerste
      volzin bedoelde salarissen.
    url: https://wetten.overheid.nl/BWBR0006152/2026-01-01#Artikel7.1b
