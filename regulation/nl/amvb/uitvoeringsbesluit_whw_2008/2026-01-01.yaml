preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Onderwijs en Wetenschappen, van 28 mei 1993, nr. 92077964/4685, directie
    Wetgeving en Juridische Zaken, gedaan mede namens Onze Minister van Landbouw, Natuurbeheer en Visserij;

    Gelet op artikel 6.13, derde lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek;

    Gezien het advies van de Onderwijsraad (advies van 21 december 1992, nr. OR 92000271/3 T);

    De Raad van State gehoord (advies van 2 augustus 1993, No. W05.93.0338);

    Gezien het nader rapport van de Staatssecretaris van Onderwijs en Wetenschappen, van 21 september 1993, nr.
    93064058/4685, directie Wetgeving en Juridische Zaken, uitgebracht mede namens Onze Minister van Landbouw,
    Natuurbeheer en Visserij;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006152/2026-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit wordt verstaan onder:

        - *academisch ziekenhuis:* academisch ziekenhuis als bedoeld in onderdeel j van de [bijlage van de wet](onbekend);
        - *accreditatieorgaan:* de Nederlands-Vlaamse Accreditatie Organisatie, bedoeld in artikel 1 van het Verdrag tussen
      het Koninkrijk der Nederlanden en de Vlaamse Gemeenschap van België inzake de accreditatie van opleidingen binnen
      het Nederlandse en Vlaamse hoger onderwijs, met bijlage; Den Haag, 3 september 2003 (Trb. 2003, 167);
        - *associate degree-opleiding:* associate degree-opleiding als bedoeld in [artikel 7.3a van de wet][ref1];
        - *bacheloropleiding:* bacheloropleiding als bedoeld in [artikel 7.3a van de wet][ref2];
        - *bekostigde graad:* een graad als bedoeld in [artikel 4.9][ref3];
        - *bekostigingsniveau:* bekostigingsniveau als bedoeld in [artikel 4.10, derde lid][ref4] en
      [artikel 4.20, tweede lid][ref5];
        - *erkenning ITK:* erkenning als bedoeld in [artikel 1.1, onderdeel s, van de wet][ref6];
        - *graad:* een blijkens het register onderwijsdeelnemers verleende graad Bachelor of graad Master als bedoeld in
      [artikel 7.10a, eerste of tweede lid, van de wet][ref7], die is verleend aan een persoon;
        - *hogeschool:* hogeschool als bedoeld in de onderdelen c, e en g van de bijlage van de wet;
        - *inspectie:* de inspectie, bedoeld in [artikel 1 van de Wet op het onderwijstoezicht][ref8];
        - *instelling:* instelling voor hoger onderwijs als bedoeld in de onderdelen a tot en met i van de [bijlage van de
      wet](onbekend);
        - *instellingsbestuur:* instellingsbestuur als bedoeld in [artikel 1.1, onderdeel j, van de wet][ref9];
        - *masteropleiding:* masteropleiding als bedoeld in [artikel 7.3a van de wet][ref10];
        - *onderwijsdeel hbo:* onderdeel van de landelijk beschikbare rijksbijdrage, bedoeld in
      [artikel 4.1, tweede lid, onderdeel b][ref11];
        - *onderwijsdeel wo:* onderdeel van de landelijk beschikbare rijksbijdrage, bedoeld in
      [artikel 4.1, tweede lid, onderdeel a][ref12];
        - *onderwijseenheid:* onderwijseenheid als bedoeld in [artikel 7.3, tweede lid, eerste volzin, van de wet][ref13];
        - *onderzoekdeel wo:* onderdeel van de landelijk beschikbare rijksbijdrage, bedoeld in
      [artikel 4.1, tweede lid, onderdeel c][ref14];
        - *ongedeelde opleiding:* opleiding als bedoeld in [artikel 18.15 van de wet][ref15];
        - *ontwerperscertificaat:* getuigschrift uitgereikt aan een technologisch ontwerper na het met goed gevolg afronden
      van onderwijs als bedoeld in bijlage 7 bij dit besluit;
        - *opleiding:* opleiding als bedoeld in de [wet][ref16];
        - *opleiding van eerste inschrijving:* 1° opleiding waarvoor een student het collegegeld, bedoeld in
      [artikel 7.45, eerste lid, van de wet][ref17], is verschuldigd en waarvoor geen vermindering of vrijstelling van
      het betalen van collegegeld op grond van de wet is verkregen, tenzij er sprake is van een vermindering als bedoeld
      in [artikel 7.48, derde en vierde lid][ref18], of, 2° opleiding waarvoor een persoon die het collegegeld, bedoeld
      in [artikel 7.45, tweede lid, van de wet][ref19] is verschuldigd, zich als eerste heeft ingeschreven;
        - *Onze Minister:* Onze Minister van Onderwijs, Cultuur en Wetenschap;
        - *peildatum:* 1 oktober in het tweede kalenderjaar voorafgaand aan het begrotingsjaar waarvoor de rijksbijdrage
      wordt vastgesteld;
        - *peilperiode:* periode van 2 oktober in het derde kalenderjaar voorafgaand aan het begrotingsjaar waarvoor de
      rijksbijdrage wordt vastgesteld, tot en met 1 oktober in het tweede kalenderjaar voorafgaand aan het begrotingsjaar
      waarvoor de rijksbijdrage wordt vastgesteld;
        - *peilperiode onderzoek:* peilperiode vermeerderd met twee onmiddellijk hieraan voorafgaande peilperiodes;
        - *promotie:* promotie als bedoeld in [artikel 7.18 van de wet][ref20];
        - *register:* de Registratie instellingen en opleidingen, bedoeld in [artikel 6.13, eerste lid, van de wet][ref21];
        - *register onderwijsdeelnemers:* register onderwijsdeelnemers als bedoeld in
      [artikel 4 van de Wet register onderwijsdeelnemers][ref22];
        - *student:* persoon die behoort tot een van de groepen van studerenden, bedoeld in
      [artikel 2.2, eerste lid, van de Wet studiefinanciering 2000][ref23] of de Surinaamse nationaliteit bezit en is
      ingeschreven voor: 1°. een bekostigde associate degree-opleiding en blijkens het register onderwijsdeelnemers
      sedert 1 september 1991 niet eerder bij een instelling in verband met het volgen van initieel onderwijs een graad
      Associate degree, een graad Bachelor of een graad Master als bedoeld in [artikel 7.10a, van de wet][ref24] heeft
      behaald; of 2°. een bekostigde bacheloropleiding en blijkens het register onderwijsdeelnemers sedert 1 september
      1991 niet eerder bij een instelling in verband met het volgen van initieel onderwijs een graad Bachelor als bedoeld
      in [artikel 7.10a, van de wet][ref25] heeft behaald; of 3°. een bekostigde masteropleiding en blijkens het register
      onderwijsdeelnemers sedert 1 september 1991 niet eerder bij een instelling in verband met het volgen van initieel
      onderwijs een graad Master als bedoeld in [artikel 7.10a, van de wet][ref26] heeft behaald;
        - *studiejaar:* studiejaar als bedoeld in de [wet][ref27];
        - *universiteit:* 1°. universiteit als bedoeld in de onderdelen a en b van de [bijlage van de wet](onbekend), 2°.
      de Open Universiteit, bedoeld in onderdeel h van de [bijlage van de wet](onbekend), en 3°. levensbeschouwelijke
      universiteit als bedoeld in onderdeel i van de [bijlage van de wet](onbekend);
        - *wet:* [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref28];
        - *wettelijke studielast:* aantal studiepunten dat een opleiding omvat, bedoeld in de
      [artikelen 7.4a, eerste tot en met zevende lid][ref29], en [7.4b, eerste tot en met zevende lid, van de wet][ref30].


