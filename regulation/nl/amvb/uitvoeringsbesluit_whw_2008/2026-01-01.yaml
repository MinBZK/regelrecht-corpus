  - number: '5.2'
    text: |-
      1 Voor de toepassing van dit hoofdstuk wordt onder leraren- of gezondheidszorgopleiding verstaan: een opleiding die
      is ingedeeld in het onderdeel onderwijs of gezondheidszorg van het register, bedoeld in [artikel 3.1][ref1] of een
      in [artikel 2.3][ref2] daarmee gelijkgestelde opleiding.

      2 Indien een persoon is ingeschreven voor een leraren- of gezondheidszorgopleiding, bedoeld in [artikel 2.3][ref3]
      wordt in afwijking van [artikel 1.1][ref4], in het onderdeel «student» het volgende gelezen:

        - *student:* persoon die behoort tot een van de groepen van studerenden, bedoeld in
      [artikel 2.2, eerste lid, van de Wet studiefinanciering 2000][ref5] of de Surinaamse nationaliteit bezit en
      blijkens het register onderwijsdeelnemers is ingeschreven voor: 1°. een bekostigde associate degree-opleiding
      leraren- of gezondheidszorg, terwijl hem nog niet de graad Associate degree of de graad Bachelor voor een leraren-
      of gezondheidszorgopleiding is verleend; 2°. een bekostigde bacheloropleiding leraren- of gezondheidszorg,
      terwijl hem nog niet een graad Bachelor voor een leraren- of gezondheidszorgopleiding is verleend; of 3°. een
      bekostigde masteropleiding leraren- of gezondheidszorg, terwijl hem nog niet de graad Master voor een leraren- of
      gezondheidszorgopleiding is verleend;

      3 Indien het tweede lid van toepassing is en de student is reeds een graad Associate degree of een graad Bachelor
      voor een andere opleiding dan een leraren- of gezondheidszorgopleiding verleend, blijven voor de toepassing van
      de [artikelen 4.8][ref6] en [4.8a][ref7] bij de inschrijving voor een associate degree-opleiding de bekostigde
      inschrijvingen voor een associate degree-opleiding en een bacheloropleiding voorafgaand aan het moment van de
      eerste graadverlening Associate degree en eerste graadverlening Bachelor voor een andere dan een leraren- of
      gezondheidszorgopleiding buiten beschouwing.

      4 Indien het tweede lid van toepassing is en de student is reeds een graad Bachelor voor een andere opleiding
      dan een leraren- of gezondheidszorgopleiding verleend, blijven voor de toepassing van de [artikelen 4.8][ref8] en
      [4.8a][ref9] bij de inschrijving voor een bacheloropleiding de bekostigde inschrijvingen voor een bacheloropleiding
      voorafgaande aan het moment van de eerste graadverlening Bachelor voor een andere opleiding dan een leraren- of
      gezondheidszorgopleiding en de bekostigde inschrijvingen voor een associate degree-opleiding voorafgaande aan het
      moment van de eerste graadverlening Associate degree buiten beschouwing.

      5 Indien het tweede lid van toepassing is en de student is reeds een graad Master voor een andere dan een leraren-
      of gezondheidszorgopleiding verleend, blijven voor de toepassing van de [artikelen 4.8][ref10] en [4.8a][ref11]
      bij de inschrijving voor een masteropleiding de bekostigde inschrijvingen voor een masteropleiding voorafgaand aan
      het moment van de verlening van de eerste graad Master voor een andere dan een leraren- of gezondheidszorgopleiding
      buiten beschouwing.

      6 Met de in het derde en vierde lid genoemde inschrijvingen voor een associate degree-opleiding worden
      gelijkgesteld de inschrijvingen voor een associate degree-programma.


