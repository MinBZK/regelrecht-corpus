      De [artikelen 2.4b][ref1], [2.4d][ref2], [2.4e][ref3] en [2.4f, derde en vierde lid][ref4], zoals deze luidden
      op 31 augustus 2024, blijven voor het studiejaar 2024–2025 van toepassing ten aanzien van een student die op
      1 september 2023 stond ingeschreven voor een opleiding als bedoeld in artikel 2.4d, eerste lid, onderdeel c, zoals
      dat luidde op 31 augustus 2024, met dien verstande dat voor de toepassing van artikel 2.4d, eerste lid, de student
      wordt geacht te voldoen aan de in onderdeel b van dat lid, bedoelde voorwaarde.


