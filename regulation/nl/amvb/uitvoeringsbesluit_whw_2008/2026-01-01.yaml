        artikel: '2.2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 7.9d
  - number: 2.3b
    text: |-
      In aanvulling op de groep van personen genoemd in [artikel 7.45a, eerste lid, eerste volzin, van de wet][ref1] is
      wettelijk collegegeld verschuldigd door de student die als vreemdeling in Nederland rechtmatig verblijf heeft op
      grond van [artikel 8, onderdelen g of h, van de Vreemdelingenwet 2000][ref2], voor zover:

      a. de student direct voorafgaand aan het rechtmatige verblijf, bedoeld in
      [artikel 8, onderdelen g of h, van de Vreemdelingenwet 2000][ref3] behoorde tot één van de groepen van personen,
      bedoeld in [artikel 2.2 van de Wet studiefinanciering 2000][ref4]; en

      b. wordt voldaan aan de aanvullende voorwaarden, genoemd in [artikel 7.45a, eerste lid, van de wet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7.45a
