      1 Het instellingsbestuur van een bekostigde instelling als bedoeld in [artikel 1.8 van de wet][ref1] wendt middelen
      verkregen ten laste van de rijksbegroting of anderszins uit hoofde van bij of krachtens de [wet][ref2] ingestelde
      heffingen verkregen middelen, alsmede de opbrengsten daarvan, waarover hij de beschikking heeft gekregen om de
      activiteiten in Nederland, bedoeld in [artikel 1.3 van de wet][ref3], te financieren, niet aan voor de kosten van
      een opleiding in het buitenland of van de voorbereiding op het verzorgen van die opleiding en het indienen van de
      desbetreffende aanvraag, bedoeld in [artikel 6.9][ref4].

      2 Het instellingsbestuur voert in voorkomend geval een afzonderlijke boekhouding voor de activiteiten betreffende
      de opleiding in het buitenland enerzijds en de activiteiten, bedoeld in [artikel 1.3 van de wet][ref5], anderzijds.
      De afzonderlijke boekhouding is zodanig ingericht dat de registratie van de lasten en baten van de verschillende
      activiteiten gescheiden zijn.

      3 Bij ministeriële regeling kunnen nadere voorschriften worden gesteld met betrekking tot de financiële
      verantwoording.


