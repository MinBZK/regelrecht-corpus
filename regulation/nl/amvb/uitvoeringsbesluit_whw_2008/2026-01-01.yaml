    text: |-
      1 Het accreditatieorgaan kan aan een accreditatie onder voorwaarden als bedoeld in de
      [artikelen 5.9, tweede lid][ref1], [5.17, tweede lid][ref2], [5.18][ref3] en [5.19, tweede lid, van de wet][ref4]
      respectievelijk een erkenning ITK onder voorwaarden als bedoeld in de [artikel 5.27, tweede lid, van de wet][ref5],
      voorwaarden verbinden die betrekking hebben op:

      a. de wijze waarop de tekortkomingen worden weggenomen;

      b. de wijze waarop en de termijn waarbinnen de herbeoordeling, bedoeld in [artikel 3.9, tweede lid][ref6] of
      [artikel 3.10, tweede lid][ref7], plaatsvindt; en

      c. de berichtgeving door het instellingsbestuur over de door het accreditatieorgaan gestelde voorwaarden aan
      studenten en andere belanghebbenden.

      2 Een accreditatie onder voorwaarden als bedoeld in [artikel 3.9, eerste lid][ref8] wordt ingetrokken indien
      niet wordt voldaan aan de voorwaarden, bedoeld in het eerste lid, of een of meer van de kwaliteitsaspecten bij de
      herbeoordeling ingevolge artikel 3.9, tweede lid, tekortkomingen bevatten.

      3 Een erkenning ITK onder voorwaarden als bedoeld in [artikel 3.10, eerste lid][ref9] wordt ingetrokken indien
      niet wordt voldaan aan de voorwaarden, bedoeld in het eerste lid, of een of meer van de kwaliteitsaspecten bij de
      herbeoordeling ingevolge 3.10, tweede lid, tekortkomingen bevatten.


