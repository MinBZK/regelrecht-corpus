  - number: '4.3'
    text: |-
      1 Het instellingsbestuur verstrekt uiterlijk 30 november in het tweede kalenderjaar voorafgaand aan het
      begrotingsjaar aan Onze Minister de ingevolge dit besluit voor de toepassing van [afdeling 2][ref1] en
      [artikel 4.20][ref2] noodzakelijke gegevens.

      2 Het instellingsbestuur heeft tot 15 april voorafgaand aan het begrotingsjaar de gelegenheid de aangeleverde
      gegevens, bedoeld in het eerste lid, te corrigeren.

      3 Gegevens die door het instellingsbestuur na 30 november in het tweede kalenderjaar voorafgaand aan het
      begrotingsjaar aan Onze Minister worden geleverd, worden niet tot de gegevens voor de bekostiging gerekend, tenzij
      deze als gevolg van een buiten het instellingsbestuur liggende oorzaak na 30 november zijn aangeleverd.

      4 Het instellingsbestuur van een universiteit verstrekt uiterlijk 15 april voorafgaand aan het begrotingsjaar Onze
      Minister een overzicht van het aantal proefschriften en ontwerperscertificaten, bedoeld in [artikel 4.21][ref3].

      5 Het instellingsbestuur van de Universiteit Maastricht verstrekt uiterlijk 15 april voorafgaand aan het
      begrotingsjaar Onze Minister tevens een overzicht van de aantallen inschrijvingen en van de aantallen graden,
      bedoeld in [artikel 4.12][ref4].

      6 Voor de toepassing van dit hoofdstuk en [hoofdstuk 5][ref5] wordt inzake de gegevens voorafgaand aan de
      peilperiode uitgegaan van de gegevens uit het register onderwijsdeelnemers zoals vastgelegd in een historisch
      bestand hoger onderwijs aan de hand van de door instellingen aan het register onderwijsdeelnemers aangeleverde
      gegevens over de periode 1 september 1991 tot en met 30 september 2008 inzake getuigschriften, graden en
      inschrijvingen voor zover deze bij ministeriële regeling zijn gelijkgesteld met bekostigde inschrijvingen en
      bekostigde graden als bedoeld in dit besluit.

      7 Aan het historisch bekostigingsbestand hoger onderwijs, bedoeld in het zesde lid, worden vanaf september
      2008 jaarlijks toegevoegd de bekostigde inschrijvingen en de bekostigde graden, vastgesteld op basis van
      [artikel 4.10][ref6].

      8 Indien de naam van een opleiding als bedoeld in [artikel 4.10, derde lid][ref7], wordt gewijzigd, terwijl
      het inhoudelijk dezelfde opleiding betreft en de code waarmee de opleiding in de Registratie instellingen en
      opleidingen staat niet is veranderd, blijft het bekostigingsniveau gelden dat van toepassing was op de opleiding
      voordat de naamwijziging plaatsvond.


