  - number: '4.21'
    text: |-
      1 Een bij ministeriële regeling vast te stellen deel van het onderzoeksdeel wo wordt over de universiteiten
      verdeeld naar rato van de som van de aantallen proefschriften die hebben geleid tot een promotie ten overstaan van
      het college voor promoties of de commissie bedoeld in [artikel 7.18, vierde lid van de wet][ref1] en de aantallen
      ontwerperscertificaten die in het tweede, derde en vierde kalenderjaar voorafgaand aan het begrotingsjaar door een
      universiteit zijn verleend aan een opleiding als bedoeld in de bijlage bij dit besluit.

      2 De op grond van het eerste lid in verband met de proefschriften en de ontwerperscertificaten per promotie en per
      ontwerperscertificaat toe te kennen bedragen worden bij ministeriële regeling vastgesteld.

      3 Indien vanwege toepassing van [artikel 7.18, zesde lid, van de wet][ref2] sprake is van gezamenlijke
      graadverlening bij verschillende Nederlandse instellingen wordt het aantal proefschriften dat het betreft bij
      elk van deze instellingen gedeeld door het aantal Nederlandse instellingen dat bij de gezamenlijke graadverlening
      betrokken is.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7.18
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7.18
