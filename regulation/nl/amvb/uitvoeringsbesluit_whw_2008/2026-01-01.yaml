      In dit hoofdstuk wordt verstaan onder instelling: een instelling voor hoger onderwijs als bedoeld in
      [artikel 1.1, onderdeel g, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0006152/2026-01-01#Artikel3.12
