  - number: '4.7'
    text: |-
      1 Uit elk van de onderwijsdelen wordt aan de rijksbijdrage van een instelling een bedrag toegevoegd dat gelijk
      is aan de som van de bedragen per opleiding, bedoeld in het tweede lid, voor alle opleidingen behorend tot de
      desbetreffende soort hoger onderwijs die door die instelling worden verzorgd.

      2 Het bedrag per opleiding is het product van het studentgebonden bedrag, bedoeld in het derde lid,
      en het aantal bekostigde inschrijvingen en graden voor die opleiding, vastgesteld overeenkomstig
      [artikel 4.10, eerste lid][ref1].

      3 Het studentgebonden bedrag per bekostigde inschrijving of bekostigde graad is:

      a. voor opleidingen in het wetenschappelijk onderwijs het quotiënt van een door Onze Minister te bepalen percentage
      van het onderwijsdeel wo, resterend na toepassing van [artikel 4.11, eerste lid][ref2], en de som van het aantal
      bekostigde inschrijvingen en bekostigde graden bij opleidingen in het wetenschappelijk onderwijs;

      b. voor opleidingen in het hoger beroepsonderwijs het quotiënt van een door Onze Minister te bepalen percentage
      van het onderwijsdeel hbo, resterend na toepassing van [artikel 4.11, eerste lid][ref3], en de som van het aantal
      bekostigde inschrijvingen en bekostigde graden bij opleidingen in het hoger beroepsonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0006152#Artikel4.10
      [ref2]: https://wetten.overheid.nl/BWBR0006152#Artikel4.11
      [ref3]: https://wetten.overheid.nl/BWBR0006152#Artikel4.11
