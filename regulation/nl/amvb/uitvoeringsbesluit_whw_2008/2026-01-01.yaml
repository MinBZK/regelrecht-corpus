        bwb_id: BWBR0005682
        artikel: 7.45b
  - number: '4.9'
    text: |-
      1 Onder bekostigde graad Bachelor wordt verstaan: een graad Bachelor als bedoeld in
      [artikel 7.10a van de wet][ref1], in de peilperiode verleend aan een student.

      2 Onder bekostigde graad Master wordt verstaan: een graad Master als bedoeld in [artikel 7.10a van de wet][ref2],
      in de peilperiode verleend aan een student.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7.10a
