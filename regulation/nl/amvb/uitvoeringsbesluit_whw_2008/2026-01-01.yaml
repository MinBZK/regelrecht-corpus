  - number: '6.9'
    text: |-
      Het instellingsbestuur dient een aanvraag om toestemming voor het verzorgen van een opleiding in het buitenland
      als bedoeld in [artikel 1.19a, eerste lid, van de wet][ref1] in bij Onze Minister. De aanvraag gaat in ieder geval
      vergezeld van:

      a. de gegevens in de Registratie instellingen en opleidingen, bedoeld in
      [artikel 6.14, derde lid, van de wet][ref2], van de opleiding in Nederland; en

      b. een schriftelijke verklaring van de voorafgaande instemming, bedoeld in [artikel 9.33, derde lid][ref3],
      respectievelijk [10.20, vierde lid, van de wet][ref4], van de universiteitsraad, respectievelijk de
      medezeggenschapsraad, met het besluit de beoogde opleiding in het buitenland te verzorgen als bedoeld in
      [artikel 1.19a, eerste lid, van de wet][ref5], indien de aanvrager een instellingsbestuur van een bekostigde
      instelling als bedoeld in [artikel 1.8 van de wet][ref6] is.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1.19a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel6.14
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel9.33
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel10.20
      [ref5]: https://wetten.overheid.nl/BWBR0005682#Artikel1.19a
      [ref6]: https://wetten.overheid.nl/BWBR0005682#Artikel1.8
