  - number: '6.12'
    text: |-
      1 Onze Minister besluit binnen twintig weken op de aanvraag. Onze Minister kan de inspectie en het
      accreditatieorgaan om advies vragen over de aanvraag, alvorens te besluiten.

      2 Ingeval Onze Minister positief op de aanvraag besluit en niet verdragsrechtelijk of, indien de aanvraag
      betrekking heeft op een land binnen het Koninkrijk der Nederlanden, bij onderlinge regeling als bedoeld in
      [artikel 38 van het Statuut voor het Koninkrijk der Nederlanden][ref1], is verzekerd dat het accreditatieorgaan
      en de inspectie toegang zullen hebben tot de beoogde opleiding in het buitenland om aldaar hun taken te kunnen
      uitoefenen, vermeldt Onze Minister in de beschikking dat de toestemming van kracht wordt op de dag waarop een
      verdrag dat of onderlinge regeling die in de vereiste toegang voorziet, in werking treedt.

      3 Onze Minister vermeldt in geval van een positief besluit in de beschikking de termijn waarbinnen de opleiding in
      het buitenland dient te worden gestart.


      [ref1]: https://wetten.overheid.nl/BWBR0002154#Artikel38
    url: https://wetten.overheid.nl/BWBR0006152/2026-01-01#Artikel6.12
    references:
      - id: ref1
        bwb_id: BWBR0002154
        artikel: '38'
  - number: '6.13'
    text: |-
      1 Het instellingsbestuur waaraan toestemming is verleend voor het verzorgen van een opleiding in het buitenland is
      verplicht de onderwijsactiviteiten aan de buitenlandse vestiging in financiële en personele zin en ten opzichte van
      studenten, zorgvuldig af te bouwen ingeval van beëindiging van het verzorgen van de opleiding in het buitenland.
      [Artikel 5.21 van de wet][ref1] is van overeenkomstige toepassing.

      2 Onze minister kan in het belang van de kwaliteit van het hoger onderwijs in Nederland of in het belang van
      de profilering van het Nederlandse hoger onderwijs in het buitenland andere voorschriften aan de toestemming
      verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5.21
    url: https://wetten.overheid.nl/BWBR0006152/2026-01-01#Artikel6.13
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5.21'
  - number: '6.14'
    text: |-
      1 De toestemming wordt ingetrokken, indien:

      a. het verzorgen van de opleiding in het buitenland ernstige schade toebrengt dan wel aannemelijk is dat het
      verzorgen van de opleiding in het buitenland ernstige schade zal toebrengen aan de kwaliteit van het hoger
      onderwijs in Nederland of aan de profilering van het Nederlandse hoger onderwijs in het buitenland;

      b. de academische vrijheid aan de opleiding niet in acht wordt genomen; of

      c. de veiligheid en rechten van de bij het onderwijs in het land van vestiging betrokken personen, voor zover zij
      die rechten ontlenen aan de [wet][ref1], niet langer kunnen worden gewaarborgd.

      2 Van ernstige schade als bedoeld in het eerste lid, onderdeel a, kan onder meer sprake zijn, indien:

      a. de wettelijke voorschriften voor het verzorgen van de opleiding in het buitenland niet worden nageleefd;

      b. de beheersbaarheid van de opleiding of vestiging, in het bijzonder vanwege het aantal studenten of de schaal,
      onvoldoende is;

      c. het verzorgen van de opleiding de diplomatieke betrekkingen tussen Nederland en het desbetreffende land
      verstoort;

      d. bij de instelling voor hoger onderwijs van het instellingsbestuur waaraan de toestemming is verleend,
      onevenredige bestuurlijke of financiële risico’s zijn ontstaan;

      e. de taakuitoefening van de inspectie of het accreditatieorgaan ten aanzien van de vestiging in het buitenland
      niet mogelijk is;

      f. de mensenrechtensituatie of de sociale verhoudingen aan de opleiding in het buitenland zich ongunstig
      ontwikkelen; of

      g. sprake is van een oordeel van de inspectie ingevolge [artikel 12a, vierde lid][ref2] j°
      [artikel 11, vierde lid, van de Wet op het onderwijstoezicht][ref3], inhoudende dat de desbetreffende instelling
      tekortschiet in de naleving van wettelijke voorschriften.

      3 Bij toepassing van het eerste lid kunnen aan de beschikking waarbij toestemming wordt ingetrokken, voorschriften
      worden gegeven ten behoeve van een zorgvuldige afwikkeling van de beëindiging van de opleiding in het buitenland.

      4 Onverminderd [artikel 5.21, tweede tot en met vierde lid, van de wet][ref4] vervalt de toestemming voor
      het verzorgen van opleidingen in het buitenland van rechtswege, indien de accreditatie van de opleiding niet
      wordt verlengd of wordt ingetrokken. Ook vervalt de toestemming als de opleiding in Nederland, bedoeld in
      [artikel 6.9, onderdeel a][ref5], niet meer bestaat.


