      verklaring van een accountant. De verklaring wordt uiterlijk 15 april voorafgaand aan het begrotingsjaar verstrekt.

      2 Bij ministeriële regeling worden voorschriften vastgesteld over de controle van de jaarrekening, de besteding
      van de rijksbijdrage en de juistheid van de door de instellingsbesturen opgegeven bekostigingsgegevens, daaronder
      begrepen voorschriften over de controle op de rechtmatigheid van de verkrijging van de rijksbijdrage en de
      rechtmatigheid en doelmatigheid van de besteding van de rijksbijdrage.

      3 Het tweede lid is van overeenkomstige toepassing op de Koninklijke Nederlandse Akademie van Wetenschappen en de
      Koninklijke Bibliotheek, genoemd in [artikel 1.2, onderdeel d, van de wet][ref2].


