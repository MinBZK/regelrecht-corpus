  - number: '3.1'
    text: |-
      Het register bestaat uit de volgende onderdelen:

      a. onderwijs,

      b. landbouw en natuurlijke omgeving,

      c. natuur,

      d. techniek,

      e. gezondheidszorg,

      f. economie,

      g. recht,

      h. gedrag en maatschappij,

      i. taal en cultuur, en

      j. sectoroverstijgend.
    url: https://wetten.overheid.nl/BWBR0006152/2026-01-01#Artikel3.1
  - number: '3.2'
    text: |-
      1 Het onderdeel onderwijs kent, naast opleidingen die niet onder een subonderdeel worden ondergebracht, het
      subonderdeel lerarenopleidingen op het gebied van de kunst.

      2 Het onderdeel taal en cultuur kent, naast opleidingen die niet onder een subonderdeel worden ondergebracht, het
      subonderdeel opleidingen op het gebied van de kunst.

      3 Het onderdeel sectoroverstijgend kent, naast opleidingen die niet onder een subonderdeel worden ondergebracht,
      het subonderdeel Onderwijs/Landbouw en Natuurlijke Omgeving/Natuur/Techniek/Gezondheid.
    url: https://wetten.overheid.nl/BWBR0006152/2026-01-01#Artikel3.2
  - number: '3.3'
    text: |-
      Onze Minister kan voorschriften geven voor de wijze waarop gegevens die in het register worden opgenomen, dienen te
      worden geleverd.
    url: https://wetten.overheid.nl/BWBR0006152/2026-01-01#Artikel3.3
  - number: '3.4'
    text: |-
      1 Op een daartoe ingediend verzoek kunnen gegevens die in het register zijn opgenomen, worden verstrekt. Bij dat
      verzoek wordt aangegeven welke gegevens worden verlangd alsmede de gewenste wijze van verstrekking.

      2 Binnen een maand na ontvangst van het verzoek, wordt aan aanvrager bekendgemaakt of het verzoek kan worden
      gehonoreerd. Indien het verzoek zal worden gehonoreerd, wordt tevens aangegeven binnen welke termijn dit zal
      geschieden alsmede of aan de verstrekking kosten zijn verbonden en zo ja, hoe hoog de verschuldigde vergoeding, met
      inachtneming van [artikel 3.5][ref1], zal zijn.

      3 De verstrekking kan slechts worden geweigerd als de gevraagde gegevens niet beschikbaar zijn, of de gevraagde
      wijze van verstrekking niet kan worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0006152#Artikel3.5
    url: https://wetten.overheid.nl/BWBR0006152/2026-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0006152
        artikel: '3.5'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '3.5'
    text: |-
      1 Indien een verzoek als bedoeld in [artikel 3.4][ref1] wordt gedaan door anderen dan de besturen van instellingen
      waarop de wet betrekking heeft, is voor het verstrekken van gegevens een vergoeding verschuldigd.

      2 De verschuldigde vergoeding is afhankelijk van:

      a. de tijd die aan het afhandelen van het verzoek wordt besteed, waarbij een tarief van € 26,32 per uur wordt
      berekend,

      b. de hoeveelheid te verstrekken gegevens, waarbij een tarief van € 34,03 per 1 000 records wordt berekend en een
      tarief van € 2,27 per 1 000 regels,

      c. de wijze van verstrekking van de gegevens, waarbij voor de gegevensdragers de kostprijs wordt berekend, en

      d. de administratiekosten van € 3,18 per aanvraag alsmede de verzendkosten, waarvoor de kostprijs wordt berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0006152#Artikel3.4
    url: https://wetten.overheid.nl/BWBR0006152/2026-01-01#Artikel3.5
