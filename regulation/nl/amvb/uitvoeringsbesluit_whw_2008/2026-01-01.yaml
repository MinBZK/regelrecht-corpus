  - number: '5.3'
    text: |-
      1 Voor de toepassing van [hoofdstuk 4][ref1] en dit hoofdstuk wordt onder een bacheloropleiding ook verstaan een
      inschrijving voor een ongedeelde opleiding van een persoon aan wie nog niet de graad Bachelor is verleend en bij
      wie het aantal eerder bekostigde inschrijvingen voor bachelor- en ongedeelde opleidingen kleiner is dan drie. Onder
      een masteropleiding wordt ook verstaan een inschrijving voor een ongedeelde opleiding van een persoon bij wie het
      aantal eerder bekostigde inschrijvingen voor bachelor- of ongedeelde opleidingen drie of meer bedraagt of aan wie
      de graad Bachelor is verleend. De studielast van deze masteropleiding is gelijk aan de studielast van de ongedeelde
      opleiding verminderd met 180.

      2 Voor de toepassing van [hoofdstuk 4][ref2] en dit hoofdstuk wordt voor een student aan wie reeds een graad voor
      een andere dan een leraren- of gezondheidszorgopleiding is verleend en bij wie het totaal aantal eerder bekostigde
      inschrijvingen voor een bachelor- of ongedeelde leraren- of gezondheidszorgopleiding kleiner is dan drie, een
      inschrijving voor een bachelor- of ongedeelde leraren- of gezondheidszorgopleiding beschouwd als een inschrijving
      voor een bacheloropleiding.

      3 Voor de toepassing van [hoofdstuk 4][ref3] en dit hoofdstuk wordt een inschrijving voor een ongedeelde
      leraren- of gezondheidszorgopleiding van een student aan wie reeds een graad voor een andere dan een leraren-
      of gezondheidszorgopleiding is verleend en bij wie het totaal aantal eerder bekostigde inschrijvingen voor een
      bachelor- of ongedeelde leraren- of gezondheidszorgopleiding drie of meer bedraagt of aan wie de graad Bachelor
      voor een leraren- of gezondheidszorgopleiding is verleend, beschouwd als een inschrijving voor een masteropleiding
      met een studielast die gelijk is aan de studielast van de ongedeelde opleiding verminderd met 180.

      4 Voor de toepassing van [hoofdstuk 4][ref4] en dit hoofdstuk wordt een inschrijving voor een universitaire
      lerarenopleiding als bedoeld in [artikel 18.64 van de wet][ref5] of voor een voortgezette hbo-opleiding als bedoeld
      in [artikel 18.20 van de wet][ref6] beschouwd als een inschrijving voor een masteropleiding.

      5 Voor de toepassing van [hoofdstuk 4][ref7] en dit hoofdstuk wordt als een student aan wie de graad Master is
      verleend, tevens beschouwd een student die:

      a. het afsluitend examen van een universitaire lerarenopleiding als bedoeld in [artikel 18.64 van de wet][ref8] met
      goed gevolg heeft afgelegd, of

      b. het afsluitend examen van een voortgezette hbo-opleiding als bedoeld in [artikel 18.20 van de wet][ref9] met
      goed gevolg heeft afgelegd.

      6 Voor de toepassing van [hoofdstuk 4][ref10] en dit hoofdstuk wordt een student die het afsluitend examen van een
      ongedeelde opleiding met goed gevolg heeft afgelegd beschouwd als een student aan wie zowel de graad Bachelor als
      de graad Master is verleend.


