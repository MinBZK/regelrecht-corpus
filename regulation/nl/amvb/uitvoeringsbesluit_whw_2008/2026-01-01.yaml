      1 Het [Besluit bovenwettelijke werkloosheidsregeling voor onderwijspersoneel primair onderwijs][ref1] zoals
      dat luidde op de dag voor inwerkingtreding van dit besluit, blijft voor de leden van colleges van bestuur van
      hogescholen van kracht op de uitkeringen die zijn ingegaan voor die datum of contractueel zijn vastgelegd voor die
      datum en pas na die datum ingaan.

      2 De uit deze overgangsbepaling voortvloeiende aanspraken gelden jegens het bevoegd gezag.


