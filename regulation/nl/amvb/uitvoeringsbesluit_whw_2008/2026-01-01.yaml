  - number: '2.3'
    text: |-
      1 In dit artikel wordt verstaan onder een opleiding op het gebied van onderwijs:

      a. een opleiding die is opgenomen in het onderdeel «onderwijs» van de Registratie instellingen en opleidingen,
      bedoeld in [artikel 3.1, aanhef en onder a][ref1];

      b. de volgende opleidingen op het gebied van landbouw en natuurlijke omgeving:

      1°. een bacheloropleiding Educatie en Kennismanagement Groene Sector;

      2°. een masteropleiding Leren en Innoveren; en

      3°. een associate degree-opleiding Onderwijsondersteuner Educatie en Kennismanagement Groene Sector;

      c. een bacheloropleiding pedagogische wetenschappen, onderwijskunde of onderwijswetenschappen in het
      wetenschappelijk onderwijs, uitsluitend voor zover:

      1°. de student gelijktijdig is ingeschreven aan een bacheloropleiding tot leraar basisonderwijs in het hoger
      beroepsonderwijs; en

      2°. de opleidingen, bedoeld in de aanhef en onderdeel 1°, een samenwerking zijn aangegaan en de beide opleidingen
      voor de student dusdanig op elkaar zijn afgestemd dat voor beide opleidingen een getuigschrift is te behalen in de
      periode van vier jaar.

      2 In dit artikel wordt verstaan onder een opleiding op het gebied van gezondheidszorg: een opleiding die
      is opgenomen in het onderdeel «gezondheidszorg» van de Registratie instellingen en opleidingen, bedoeld in
      [artikel 3.1, aanhef en onder e][ref2].

      3 Een persoon die zich volgens het register onderwijsdeelnemers voor de eerste keer inschrijft voor een
      associate degree-opleiding op het gebied van onderwijs of gezondheidszorg, nadat hij eerder een graad Associate
      degree, graad Bachelor of graad Master heeft behaald in verband met een opleiding op een ander gebied dan
      onderwijs of gezondheidszorg, is voor die opleiding op het gebied van onderwijs of gezondheidszorg niet meer
      dan het wettelijk collegegeld verschuldigd, mits hij behoort tot één van de groepen van personen, bedoeld in
      [artikel 2.2 van de Wet studiefinanciering 2000][ref3], of de Surinaamse nationaliteit bezit.

      4 Een persoon die zich, gerekend vanaf 1 september 1991, volgens het register onderwijsdeelnemers, voor
      de eerste keer inschrijft voor een bacheloropleiding op het gebied van onderwijs of gezondheidszorg, nadat
      hij eerder een bachelorgraad heeft behaald in verband met een opleiding op een ander gebied dan onderwijs
      of gezondheidszorg, is voor die opleiding op het gebied van onderwijs of gezondheidszorg niet meer dan
      het wettelijk collegegeld verschuldigd, mits hij behoort tot één van de groepen van personen, bedoeld in
      [artikel 2.2 van de Wet studiefinanciering 2000][ref4], of de Surinaamse nationaliteit bezit.

      5 Een persoon die zich, gerekend vanaf 1 september 1991, volgens het register onderwijsdeelnemers, voor
      de eerste keer inschrijft voor een masteropleiding op het gebied van onderwijs of gezondheidszorg, nadat
      hij eerder een mastergraad heeft behaald in verband met een opleiding op een ander gebied dan onderwijs
      of gezondheidszorg, is voor die opleiding op het gebied van onderwijs of gezondheidszorg niet meer dan
      het wettelijk collegegeld verschuldigd, mits hij behoort tot één van de groepen van personen, bedoeld in
      [artikel 2.2 van de Wet studiefinanciering 2000][ref5], of de Surinaamse nationaliteit bezit.

      6 Op de aanspraak op wettelijk collegegeld, bedoeld in het derde, vierde of vijfde lid, kan slechts een maal een
      beroep worden gedaan, hetzij in verband met een opleiding op het terrein van onderwijs, hetzij in verband met een
      opleiding op het terrein van gezondheidszorg.

      7 Met uitzondering van een student die gelijktijdig wordt ingeschreven voor de twee opleidingen, bedoeld in het
      eerste lid, onderdeel c, wordt een student die op grond van het derde, vierde of vijfde lid aanspraak maakt op
      wettelijk collegegeld voor een andere inschrijving niet vrijgesteld van het betalen van collegegeld als bedoeld in
      [artikel 7.48, eerste lid, van de wet][ref6].


