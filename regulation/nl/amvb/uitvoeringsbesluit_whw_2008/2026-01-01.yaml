  - number: '6.1'
    text: |-
      1 De bepalingen van dit hoofdstuk zijn regels voor onderzoekinstellingen en voor openbare universiteiten,
      academische ziekenhuizen en hogescholen, alsmede voorwaarden voor bekostiging van bijzondere universiteiten en
      hogescholen.

      2 In dit hoofdstuk wordt verstaan onder een onderzoekinstelling: de Koninklijke Nederlandse
      Akademie van Wetenschappen te Amsterdam en de Koninklijke Bibliotheek te ’s-Gravenhage, genoemd in
      [artikel 1.2, onder d, van de wet][ref1], alsmede de Nederlandse organisatie voor wetenschappelijk onderzoek,
      genoemd in [artikel 2 van de Wet op de Nederlandse organisatie voor wetenschappelijk onderzoek][ref2].

      3 In dit hoofdstuk wordt verstaan onder bestuur: het instellingsbestuur van een universiteit, hogeschool, de raad
      van bestuur van een academisch ziekenhuis of het algemeen bestuur van een onderzoekinstelling.

      4 Het bestuur of diens rechtsopvolger is gehouden de aanspraken van het personeel en het gewezen personeel die uit
      de [wet][ref3] voortvloeien of krachtens dit besluit worden vastgesteld dan wel bij of krachtens dit besluit worden
      gehandhaafd, te honoreren.

      5 Indien een rechtsopvolger als bedoeld in het vierde lid ontbreekt, waaronder tevens is begrepen het geval van
      een onherroepelijk vonnis tot faillietverklaring van de desbetreffende instelling, voorzien de besturen in het
      desbetreffende deelgebied er gezamenlijk in dat aan de verplichtingen van het vierde lid jegens het personeel en
      het gewezen personeel wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1.2
      [ref2]: https://wetten.overheid.nl/BWBR0004191#Artikel2
