  - number: '24'
    text: |-
      Indien op grond van [Hoofdstuk III][ref1] voor enig jaar subsidie is verleend, wordt niet tevens voor datzelfde
      jaar subsidie verstrekt op grond van [Hoofdstuk II][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004654#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0004654#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0004654/2003-06-18#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004654
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004654
        hoofdstuk: II
  - number: '25'
    text: |-
      Onze minister kan artikelen van dit besluit buiten toepassing laten of daarvan afwijken voor zover toepassing gelet
      op het belang dat dit besluit beoogt te beschermen zal leiden tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0004654/2003-06-18#Artikel25
  - number: '29'
    text: Dit besluit kan worden aangehaald als Besluit rijkssubsidiëring onderhoud monumenten.
    url: https://wetten.overheid.nl/BWBR0004654/2003-06-18#Artikel29
