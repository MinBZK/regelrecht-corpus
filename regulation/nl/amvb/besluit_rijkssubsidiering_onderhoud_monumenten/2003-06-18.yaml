      - id: ref2
        bwb_id: BWBR0004654
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '6'
    text: |-
      1 De eigenaar of huurder van een beschermd monument dat behoort tot de categorie, bedoeld in
      [artikel 3, eerste lid, onderdeel b][ref1], kan bij Onze minister een onderhoudsplan indienen met het verzoek met
      dat plan in te stemmen.

      2 Uit het onderhoudsplan dient te blijken dat de aanvrager over de periode waarop het onderhoudsplan betrekking
      heeft, jaarlijks meer dan € 11 340 aan kosten van onderhoudswerkzaamheden zal moeten besteden.

      3 Het onderhoudsplan dient door Onze minister te zijn ontvangen voordat met de onderhoudswerkzaamheden waarop het
      eerste jaar van het onderhoudsplan betrekking heeft, is begonnen.


      [ref1]: https://wetten.overheid.nl/BWBR0004654#Artikel3
    url: https://wetten.overheid.nl/BWBR0004654/2003-06-18#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004654
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '7'
    text: |-
      Indien een aanvrager met wiens onderhoudsplan Onze minister heeft ingestemd, in enig jaar van dat onderhoudsplan
      afwijkende onderhoudswerkzaamheden heeft verricht waarmee Onze minister niet heeft ingestemd, dan wel minder dan €
      11 340 aan kosten van onderhoudswerkzaamheden heeft besteed, vervalt de instemming.
    url: https://wetten.overheid.nl/BWBR0004654/2003-06-18#Artikel7
  - number: '8'
    text: |-
      1 De aanvraag om subsidie wordt door de eigenaar, de huurder, de pachter of degene die een uitsluitend recht heeft
      op een graf als bedoeld in [artikel 28 van de Wet op de lijkbezorging][ref1] ingediend uiterlijk 1 april van het
      jaar volgend op het jaar waarin de onderhoudswerkzaamheden zijn uitgevoerd.

      2 De aanvraag is vergezeld van de rekeningen van de uitgevoerde onderhoudswerkzaamheden en de daarop betrekking
      hebbende bewijzen van betaling.

      3 Indien bewijzen van betaling betrekking hebben op kosten van personeel dat in loondienst is bij de aanvrager is
      de aanvraag tevens vergezeld van een verklaring van een registeraccountant of een accountant-administratieconsulent
      waaruit blijkt hoeveel arbeidstijd door dat personeel aan die onderhoudswerkzaamheden is besteed.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel28
    url: https://wetten.overheid.nl/BWBR0004654/2003-06-18#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '28'
  - number: '9'
    text: |-
      1 Een aanvraag om subsidie is vergezeld van een bouwkundig inspectierapport dat is opgesteld niet eerder dan 2
      jaren voorafgaande aan het jaar waarop de aanvraag betrekking heeft.

      2 Overlegging van een bouwkundig inspectierapport als bedoeld in het eerste lid kan achterwege blijven indien het
      bij een eerdere aanvraag aan Onze minister is overgelegd.
    url: https://wetten.overheid.nl/BWBR0004654/2003-06-18#Artikel9
  - number: '11'
    text: |-
      In afwijking van [artikel 3, eerste lid, aanhef][ref1], kan Onze minister voor een periode van 10 jaar subsidie
      verstrekken voor onderhoudswerkzaamheden aan beschermde kerkgebouwen.


      [ref1]: https://wetten.overheid.nl/BWBR0004654#Artikel3
    url: https://wetten.overheid.nl/BWBR0004654/2003-06-18#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004654
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '12'
    text: |-
      De subsidie, bedoeld in [artikel 11][ref1], bedraagt 50% van de totale kosten van de onderhoudswerkzaamheden die
      gedurende 10 jaren verricht zijn volgens een door Onze minister goedgekeurd onderhoudsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0004654#Artikel11
    url: https://wetten.overheid.nl/BWBR0004654/2003-06-18#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004654
        artikel: '11'
        hoofdstuk: III
        paragraaf: '1'
  - number: '13'
    text: |-
      Subsidie als bedoeld in [artikel 11][ref1] wordt slechts verleend indien de financiële dekking van het gedeelte
      van 50% van de kosten van de voorgenomen onderhoudswerkzaamheden, dat niet door subsidie gedekt kan worden, naar
      genoegen van Onze minister zeker gesteld is.


      [ref1]: https://wetten.overheid.nl/BWBR0004654#Artikel11
    url: https://wetten.overheid.nl/BWBR0004654/2003-06-18#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004654
        artikel: '11'
        hoofdstuk: III
        paragraaf: '1'
  - number: '14'
    text: |-
      De aanvraag om subsidie als bedoeld in [artikel 11][ref1] wordt tezamen met een onderhoudsplan door de eigenaar
      of huurder ingediend voor 1 oktober van het jaar dat voorafgaat aan het eerste jaar waarop het onderhoudsplan
      betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0004654#Artikel11
    url: https://wetten.overheid.nl/BWBR0004654/2003-06-18#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004654
        artikel: '11'
        hoofdstuk: III
        paragraaf: '1'
  - number: '15'
    text: |-
      1 Indien de beschikking op een aanvraag als bedoeld in [artikel 14][ref1] een subsidieverlening inhoudt, vermeldt
      de beschikking het bedrag en, voorzover nodig, die onderdelen van het onderhoudsplan die door Onze minister niet
      zijn goedgekeurd.

      2 Onze minister deelt de beschikking, bedoeld in het eerste lid, dan wel een beschikking tot wijziging of
      intrekking van die beschikking, mede aan de Stichting Nationaal Restauratiefonds.


      [ref1]: https://wetten.overheid.nl/BWBR0004654#Artikel14
    url: https://wetten.overheid.nl/BWBR0004654/2003-06-18#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004654
        artikel: '14'
        hoofdstuk: III
        paragraaf: '2'
  - number: '16'
    text: |-
      De aanvrager, aan wie subsidie als bedoeld in [artikel 15, eerste lid][ref1], is verleend komt in aanmerking voor
      een door de Stichting Nationaal Restauratiefonds aan te bieden rekening-courantovereenkomst ten behoeve van de
      onderhoudswerkzaamheden onder door die stichting te bepalen voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0004654#Artikel15
    url: https://wetten.overheid.nl/BWBR0004654/2003-06-18#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004654
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
  - number: '17'
    text: |-
      1 Nadat subsidie is verleend, worden jaarlijks bij wijze van voorschot de door de aanvrager bij de Stichting
      Nationaal Restauratiefonds ingediende rekeningen voor 50% vergoed tot ten hoogste één tiende deel van de verleende
      subsidie.

      2 Indien aan een aanvrager in enig jaar minder dan het voor dat jaar voor hem beschikbare voorschot is betaald,
      wordt het verschil toegevoegd aan het bedrag dat in het volgende jaar bij wijze van voorschot aan hem kan worden
      betaald.
    url: https://wetten.overheid.nl/BWBR0004654/2003-06-18#Artikel17
  - number: '18'
    text: |-
      1 De eigenaar of huurder dient jaarlijks binnen dertien weken na afloop van het kalenderjaar een overzicht bij Onze
      minister in van:

      a. de verrichte onderhoudswerkzaamheden;

      b. de daarmee gemoeide kosten;

      c. schriftelijke bewijsstukken waaruit blijkt dat de in rekening gebrachte kosten betaald zijn.

      2 De eigenaar dient in het derde, zesde en negende jaar van de periode waarvoor een subsidie is verleend, een
      bouwkundig inspectierapport bij Onze minister in dat is opgesteld in het jaar waarin het wordt ingediend.
    url: https://wetten.overheid.nl/BWBR0004654/2003-06-18#Artikel18
  - number: '19'
    text: |-
      1 Bij de indiening van het tiende overzicht, bedoeld in [artikel 18][ref1], dient de eigenaar of huurder een
      aanvraag tot vaststelling van de subsidie in bij Onze minister.

      2 Een afschrift van de beschikking tot vaststelling van de subsidie zendt Onze minister aan de Stichting Nationaal
      Restauratiefonds.


      [ref1]: https://wetten.overheid.nl/BWBR0004654#Artikel18
    url: https://wetten.overheid.nl/BWBR0004654/2003-06-18#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004654
        artikel: '18'
        hoofdstuk: III
        paragraaf: '2'
  - number: '20'
    text: |-
      De aanvrager bericht zo spoedig mogelijk aan Onze minister indien er zich omstandigheden voordoen die van invloed
      kunnen zijn op de subsidieverlening onder overlegging van de relevante stukken.
    url: https://wetten.overheid.nl/BWBR0004654/2003-06-18#Artikel20
  - number: '22'
    text: |-
      De aanvrager stort teveel ontvangen voorschotten of subsidie onmiddellijk terug, tenzij Onze minister tot
      verrekening op andere wijze heeft besloten.
    url: https://wetten.overheid.nl/BWBR0004654/2003-06-18#Artikel22
  - number: '23'
    text: |-
      Onze minister kan een formulier vaststellen voor:

      a. het onderhoudsplan;

      b. de aanvraag, bedoeld in [artikel 8, eerste lid][ref1];

      c. de aanvraag, bedoeld in [artikel 14][ref2];

      d. de aanvraag, bedoeld in [artikel 19, eerste lid][ref3];

      e. het indienen van rekeningen als bedoeld in [artikel 17][ref4];

      f. het overzicht, bedoeld in [artikel 18][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0004654#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004654#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0004654#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0004654#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0004654#Artikel18
