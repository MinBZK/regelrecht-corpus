  - number: '5'
    text: |-
      In afwijking van [artikel 4, tweede lid][ref1], bedraagt de subsidie voor onderhoudswerkzaamheden ten behoeve
      van een monument als bedoeld in [artikel 3, eerste lid, onderdeel ][ref2], ten hoogste € 18 150 indien die zijn
      uitgevoerd overeenkomstig een door de eigenaar, huurder of pachter ingediend onderhoudsplan, waarmee Onze minister
      ingevolge paragraaf 2 heeft ingestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0004654#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004654#Artikel3
    url: https://wetten.overheid.nl/BWBR0004654/2003-06-18#Artikel5
