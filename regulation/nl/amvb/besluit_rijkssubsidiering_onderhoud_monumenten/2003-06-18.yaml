  - number: 2a
    text: |-
      Onze minister kan ieder jaar subsidieplafonds vaststellen voor de verstrekking van subsidie als bedoeld
      in de [artikelen 3][ref1] en [11][ref2]. Hij kan daarbij tevens voor één of meer categorieën, genoemd in
      [artikel 3, eerste lid][ref3], een subsidieplafond vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0004654#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004654#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0004654#Artikel3
