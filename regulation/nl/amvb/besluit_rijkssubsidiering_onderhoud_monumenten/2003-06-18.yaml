  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Welzijn, Volksgezondheid en Cultuur van 13 april 1989, DBC/U-5114;

    Gelet op artikel 34 van de Monumentenwet 1988 (Stb. 1988, 638) en artikel 237 b van de gemeentewet;

    Gehoord de Monumentenraad;

    De Raad van State gehoord (advies van 9 oktober 1989, nr. W13.89.0206);

    Gezien het nader rapport van Onze Minister van Welzijn, Volksgezondheid en Cultuur van 21 november 1989, RDMZ/BAZ/
    U-175634 ;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004654/2003-06-18#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. eigenaar: de natuurlijke persoon of de rechtspersoon, die het recht van eigendom of een ander zakelijk recht
      heeft op een beschermd monument;

      b. onderhoudswerkzaamheden: periodieke onderhoudswerkzaamheden aan een beschermd monument, welke werkzaamheden door
      Onze minister als zodanig worden aangemerkt en dienen om het beschermde monument als zodanig in stand te houden;

      c. bouwkundig inspectierapport: een rapport met betrekking tot een beschermd monument dat:

      1°. de technische staat van dat beschermde monument beschrijft;

      2°. opgesteld is door een ter zake deskundige instantie;

      d. onderhoudsplan: een plan met betrekking tot het onderhoud van een beschermd monument dat:

      1°. gebaseerd is op een bouwkundig inspectierapport;

      2°. gedetailleerd inzicht geeft in de voorgenomen onderhoudswerkzaamheden over een periode van 10 jaren alsmede in
      de kosten daarvan;

      e. drempelbedrag: een bedrag aan subsidie waaronder geen subsidie wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0004654/2003-06-18#Artikel1
  - number: '2'
    text: |-
      1 Subsidie wordt slechts verstrekt ten behoeve van een beschermd monument dat naar het oordeel van Onze minister in
      goede bouwkundige staat verkeert.

      2 Subsidie wordt niet verstrekt voor zover de kosten van de onderhoudswerkzaamheden op grond van een verzekering
      worden gedekt dan wel op grond van de [Wet op de omzetbelasting][ref1] op verschuldigde belasting in aftrek kunnen
      worden gebracht dan wel anderszins niet ten laste van de aanvrager komen.

      3 Subsidie wordt niet verstrekt voor zover in de kosten van de onderhoudswerkzaamheden subsidie is verleend op
      grond van een andere rijkssubsidieregeling.

      4 Subsidie wordt niet verstrekt aan de Staat, de provincies, de gemeenten, de waterschappen, de veenschappen en
      de veenpolders.

      5 In afwijking van het vierde lid kan aan een gemeente die eigenaar, huurder of pachter is van een beschermd
      monument dat behoort tot één van de categorieën, bedoeld in [artikel 3, eerste lid, onderdeel ][ref2], subsidie
      verstrekt worden in de kosten van onderhoudswerkzaamheden daaraan.

      6 Een subsidie ten laste van een begroting die nog niet is vastgesteld, wordt verleend onder de voorwaarde, bedoeld
      in [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002629
      [ref2]: https://wetten.overheid.nl/BWBR0004654#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel434
