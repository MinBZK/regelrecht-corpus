  - number: '4'
    text: |-
      1 Subsidie als bedoeld in [artikel 3][ref1] bedraagt 50% van de totale kosten van de onderhoudswerkzaamheden die
      zijn verricht in het jaar waarover de subsidie wordt aangevraagd.

      2 Voor monumenten als bedoeld in [artikel 3, eerste lid, onderdelen ][ref2], bedraagt de subsidie ten hoogste €
      5 672 per jaar en geldt een drempelbedrag van € 340.

      3 Voor monumenten als bedoeld in [artikel 3, eerste lid, onderdeel h][ref3], bedraagt de subsidie ten hoogste
      € 3 404 per jaar en geldt een drempelbedrag van € 136.

      4 Voor monumenten als bedoeld in [artikel 3, eerste lid, onderdelen ][ref4], bedraagt de subsidie ten hoogste € 681
      per jaar en geldt een drempelbedrag van € 91.

      5 Voor monumenten als bedoeld in [artikel 3, eerste lid, onderdeel p][ref5], bedraagt de subsidie ten hoogste
      € 1 702 per jaar en geldt een drempelbedrag van € 136.


      [ref1]: https://wetten.overheid.nl/BWBR0004654#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004654#Artikel3
