  - number: '3'
    text: |-
      1 Onze minister kan jaarlijks subsidie verstrekken voor onderhoudswerkzaamheden aan:

      a. kerkgebouwen;

      b. kastelen, historische buitenhuizen en buitenplaatsen;

      c. hofjes van liefdadigheid die als zodanig zijn gesticht en waarvan de bestemming sinds de stichting niet is
      gewijzigd;

      d. gemalen;

      e. opstallen op begraafplaatsen;

      f. rieten daken van boerderijen en van buiten het boerenerf gelegen schaapskooien, die in gebruik zijn ten behoeve
      van een agrarisch bedrijf;

      g.

      h. windmolens en watermolens, waarvan het gaande werk volledig of in overwegende mate in tact is, dan wel in die
      staat kan worden teruggebracht;

      i. orgels met uitzondering van de orgelkast;

      j. forten;

      k. fabrieksschoorstenen;

      l. gashouders;

      m. waterkrachtcentrales;

      n. watertorens;

      o. kranen;

      p. weegbruggen;

      q. locomotief- en rijtuigloodsen;

      r. luidklokken, beiaarden, uurwerken en op bouwwerken aangebrachte zonnewijzers;

      s. ruïnes.

      2 Subsidie wordt verstrekt aan de eigenaar, huurder of pachter van het monument of, indien subsidie wordt verstrekt
      ten behoeve van een monument als bedoeld in het eerste lid, onderdeel *e*, aan degene die een uitsluitend recht op
      een graf heeft als bedoeld in [artikel 28 van de Wet op de lijkbezorging][ref1].

      3 Subsidie wordt uitsluitend verstrekt, indien de onderhoudswerkzaamheden naar het oordeel van Onze minister sober
      en doelmatig zijn uitgevoerd; en

      a. betrekking hebben op het mechaniek van een monument of

      b. op het wind- en waterdicht houden van de buitenkant van een monument.

      4 Indien uit het register, bedoeld in [artikel 6 van de Monumentenwet 1988][ref2], blijkt dat een monument
      uitsluitend beschermd is vanwege één of meer met name genoemde onderdelen of objecten, wordt slechts subsidie
      verstrekt ten behoeve van die onderdelen of objecten.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel6
    url: https://wetten.overheid.nl/BWBR0004654/2003-06-18#Artikel3
