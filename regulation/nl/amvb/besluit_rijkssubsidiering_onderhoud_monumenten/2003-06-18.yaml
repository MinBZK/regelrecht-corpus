  - number: 2b
    text: |-
      Onze minister verdeelt de voor de verstrekking van subsidie als bedoeld in de [artikelen 3][ref1] en [11][ref2]
      beschikbare bedragen in de volgorde van ontvangst van de aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0004654#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004654#Artikel11
    url: https://wetten.overheid.nl/BWBR0004654/2003-06-18#Artikel2b
