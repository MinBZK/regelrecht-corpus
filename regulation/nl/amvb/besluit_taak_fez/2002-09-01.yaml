---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_taak_fez
regulatory_layer: AMVB
publication_date: '2017-04-07'
valid_from: '2002-09-01'
bwb_id: BWBR0005333
url: https://wetten.overheid.nl/BWBR0005333/2002-09-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Financiën van 13 juni 1991, nr. B91-161, Directoraat-Generaal van de
    Rijksbegroting, Directie Begrotingszaken;

    Gelet op artikel 32, aanhef en onder a, c en d, van de Comptabiliteitswet;

    Gezien het advies van de Algemene Rekenkamer van 22 augustus 1990, nr. 1030R;

    De Raad van State gehoord (advies van 10 september 1991, nr. W06.91.0303);

    Gezien het nader rapport van Onze Minister van Financiën van 13 december 1991, nr. B91-387, Directoraat-Generaal
    van de Rijksbegroting, Directie Begrotingszaken, en Centrale Directie Wetgeving, Juridische en Bestuurlijke Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Voor de toepassing van dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#Artikel1
  - number: 1.a
    text: |-
      FEZ: de centrale directie, bedoeld in [artikel 27, eerste lid, van de Comptabiliteitswet 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel27
    url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '27'
  - number: 1.b
    text: 'Onze minister: de minister, waaronder de betrokken FEZ ressorteert;'
    url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#Artikel1
  - number: 1.c
    text: 'de begroting: de begroting, inclusief de daarbij behorende toelichting, waarover Onze minister het beheer voert.'
    url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#Artikel1
  - number: '2.1'
    text: |-
      Voorstellen tot het nemen van besluiten, die financiële gevolgen kunnen hebben, worden door de betrokken hoofden
      van dienst zo vroeg mogelijk ter kennis gebracht van de directeur FEZ, die aan hen zijn inzichten met betrekking
      tot de financieel-economische en de budgettaire gevolgen meedeelt.
    url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#Artikel2
  - number: '2.2'
    text: |-
      Stukken omtrent zaken, die financiële gevolgen hebben of kunnen hebben, behoeven de medeparaaf van de directeur
      FEZ. Indien deze bezwaren heeft, pleegt hij overleg met het betrokken hoofd van dienst. Wanneer dat overleg niet
      tot overeenstemming leidt, brengt hij zijn bezwaren ter kennis van Onze minister.
    url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#Artikel2
  - number: '3.1'
    text: |-
      De directeur FEZ is verantwoordelijk voor de jaarlijkse opstelling van de ontwerp-begroting en van de daarmee
      samenhangende meerjarenramingen, welke opstelling geschiedt aan de hand van voorstellen van de hoofden van dienst.
    url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#Artikel3
  - number: '3.2'
    text: Hij beoordeelt de voorstellen met inachtneming van gegeven richtlijnen.
    url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#Artikel3
  - number: '3.3'
    text: |-
      Tezamen met een rapport waarin hij zijn oordeel over de voorstellen geeft, legt hij deze, zo nodig vergezeld van
      wijzigingsvoorstellen, aan Onze minister voor.
    url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#Artikel3
  - number: '3.4'
    text: |-
      Over wijzigingsvoorstellen, bedoeld in het derde lid, pleegt hij vooraf overleg met de betrokken hoofden van
      dienst.
    url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#Artikel3
  - number: '4'
    text: |-
      Onverminderd het bepaalde in de regels, bedoeld in [artikel 18 van de Comptabiliteitswet 2001][ref1], kan de
      directeur FEZ namens Onze minister nadere regels geven aan de hoofden van dienst met betrekking tot de in dat
      artikel bedoelde onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel18
    url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '18'
  - number: '5.1'
    text: |-
      De directeur FEZ draagt zorg voor het bevorderen en zonodig coördineren van het onderzoek naar de doelmatigheid
      van het beleid dat ten grondslag ligt aan de begroting, zowel tijdens de voorbereiding als periodiek tijdens
      de uitvoering van dit beleid. Voorts gaat hij na in hoeverre de uitkomsten van deze onderzoeken zijn of worden
      betrokken bij de begrotingsvoorbereiding. Hij rapporteert zijn bevindingen aan Onze minister en adviseert deze
      ter zake.
    url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#Artikel5
  - number: '5.2'
    text: |-
      De directeur FEZ oefent toezicht uit op de naleving van [artikel 17 van de Comptabiliteitswet 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel17
    url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '17'
  - number: '6'
    text: |-
      De directeur FEZ oefent toezicht uit op de uitvoering van de begroting door de hoofden van dienst. Dit toezicht
      heeft in het bijzonder betrekking op:
    url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#Artikel6
  - number: 6.a
    text: het mede waarborgen dat een ordelijk en controleerbaar financieel beheer wordt gevoerd;
    url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#Artikel6
  - number: 6.b
    text: de rechtmatige en doelmatige besteding van de bedragen die bij de begroting zijn toegestaan;
    url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#Artikel6
  - number: 6.c
    text: het niet overschrijden van aan de hoofden van dienst toegewezen budgetten;
    url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#Artikel6
  - number: 6.d
    text: |-
      de volledige, tijdige en doelmatige inning van de ontvangsten en de rechtmatige, doelmatige en tijdige betaling van
      de uitgaven;
    url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#Artikel6
  - number: 6.e
    text: |-
      het in acht nemen van de door Onze minister en de door Onze Minister van Financiën in het algemeen of voor bepaalde
      begrotingsposten gegeven voorschriften en gestelde voorwaarden voor de uitvoering van de begroting;
    url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#Artikel6
  - number: 6.f
    text: |-
      de wijze waarop de administraties, onder andere bedoeld in
      [artikel 26, eerste lid, van de Comptabiliteitswet 2001][ref1] door de hoofden van dienst worden bijgehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel26
    url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '26'
  - number: '7'
    text: |-
      De directeur FEZ is verantwoordelijk voor de opstelling van aanvullende begrotingsontwerpen (suppletore
      begrotingen).
    url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#Artikel7
  - number: '8'
    text: |-
      De directeur FEZ is verantwoordelijk voor de samenstelling van periodieke overzichten van verplichtingen, uitgaven
      en ontvangsten en van andere al dan niet periodieke overzichten, waarvoor de gegevens kunnen worden ontleend aan de
      administraties, bedoeld in [artikel 26, eerste lid, van de Comptabiliteitswet 2001][ref1], alsmede voor het opmaken
      van het jaarverslag, bedoeld in [artikel 51, eerste lid, van de Comptabiliteitswet 2001][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel51
    url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0013891
        artikel: '51'
  - number: '9'
    text: |-
      Onverminderd het bepaalde bij of krachtens de [artikelen 37, aanhef en onder b][ref1], [38][ref2] en
      [65 van de Comptabiliteitswet 2001][ref3], kan de directeur FEZ namens Onze minister nadere regels geven aan de
      hoofden van dienst met betrekking tot de in deze artikelen bedoelde onderwerpen. Hij pleegt over de te geven regels
      overleg met het hoofd van de departementale accountantsdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0013891#Artikel65
    url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '37'
      - id: ref2
        bwb_id: BWBR0013891
        artikel: '38'
      - id: ref3
        bwb_id: BWBR0013891
        artikel: '65'
  - number: '10'
    text: |-
      Indien de directeur FEZ van oordeel is dat op enigerlei wijze een meer doelmatig beheer kan worden gevoerd, dan wel
      dat vermeerdering van inkomsten mogelijk is, treedt hij over de te nemen maatregelen in overleg met de betrokken
      hoofden van dienst. Leidt dit overleg niet tot overeenstemming, dan vraagt de directeur FEZ hierover de beslissing
      van Onze minister.
    url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#Artikel10
  - number: '11'
    text: |-
      De directeur FEZ is bevoegd van het personeel ressorterend onder Onze minister, omtrent aangelegenheden waaraan
      financiële gevolgen zijn verbonden, rechtstreeks inlichtingen te vorderen, die hij naar zijn oordeel voor de
      uitoefening van zijn taak nodig heeft.
    url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#Artikel11
  - number: '12.1'
    text: |-
      De directeur FEZ draagt zorg voor de organisatie van het kasbeheer waarvoor Onze betrokken minister
      verantwoordelijk is.
    url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#Artikel12
  - number: '12.2'
    text: |-
      In afwijking van het eerste lid dragen bij de hoge colleges van staat en het Kabinet van de Koning de voorzitters
      van beide Kamers der Staten-Generaal, de vice-president van de Raad van State, de president van de Algemene
      Rekenkamer, de Nationale ombudsman, de Kanselier van de Kanselarij der Nederlandse Orden en de directeur van het
      Kabinet van de Koning zorg voor de organisatie van het kasbeheer, ieder met betrekking tot het betrokken onderdeel
      van de begroting van de hoge colleges van staat en het Kabinet van de Koning.
    url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#Artikel12
  - number: '12.3'
    text: |-
      In afwijking van het eerste lid draagt de thesaurier-generaal van het Ministerie van Financiën zorg voor de
      organisatie van het centrale kasbeheer bij het Rijk.
    url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#Artikel12
  - number: '13.1'
    text: |-
      De directeur FEZ doet, na overleg met het desbetreffende hoofd van dienst, de voorstellen
      tot aanwijzing en tot intrekking van een zodanige aanwijzing van de kasbeheerders, bedoeld in
      [artikel 1, tweede lid, onder i, van het Besluit kasbeheer 1998][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009347#Artikel1
    url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009347
        artikel: '1'
  - number: '13.2'
    text: |-
      Het bepaalde in het eerste lid is niet van toepassing op de aanwijzing en de intrekking van de aanwijzing van de
      personen die zijn belast met het beheer van de centrale kassen van het Rijk, dan wel met de ontvangst, de afgifte
      en de bewaring van de aan het Rijk toebehorende en toevertrouwde effecten.
    url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#Artikel13
  - number: '13.3'
    text: |-
      In afwijking van het eerste en tweede lid worden de voorstellen tot aanwijzing en tot intrekking van een zodanige
      aanwijzing van de kasbeheerders, bedoeld in [artikel 1, tweede lid, onder i, van het Besluit kasbeheer 1998][ref1],
      bij de hoge colleges van staat en het Kabinet van de Koning gedaan door de betrokken hoofden van dienst aan de
      voorzitters van beide Kamers der Staten-Generaal, aan de vice-president van de Raad van State, aan de president van
      de Algemene Rekenkamer, aan de Nationale ombudsman, aan de Kanselier van de Kanselarij der Nederlandse Orden en aan
      de directeur van het Kabinet van de Koning, ieder met betrekking tot het betrokken onderdeel van de begroting van
      de hoge colleges van staat en het Kabinet van de Koning.


      [ref1]: https://wetten.overheid.nl/BWBR0009347#Artikel1
    url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009347
        artikel: '1'
  - number: '14'
    text: De directeur FEZ is voorts belast met de taken die hem door Onze minister worden opgedragen.
    url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#Artikel14
  - number: '15.1'
    text: |-
      De directeur FEZ neemt deel aan het interdepartementale overleg van de directeuren FEZ van de ministeries en de
      leiding van het directoraat-generaal van de Rijksbegroting.
    url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#Artikel15
  - number: '15.2'
    text: Onze Minister van Financiën kan met betrekking tot dit overleg en de deelneming daaraan regels stellen.
    url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#Artikel15
  - number: '16.1'
    text: Het Besluit taak Centrale afdeling financieel-economische zaken (*Stb.* 1977, 426) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#Artikel16
  - number: '16.2'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin het
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#Artikel16
  - number: '16.3'
    text: 'Het kan worden aangehaald onder de titel: "Besluit Taak FEZ".'
    url: https://wetten.overheid.nl/BWBR0005333/2002-09-01#Artikel16
