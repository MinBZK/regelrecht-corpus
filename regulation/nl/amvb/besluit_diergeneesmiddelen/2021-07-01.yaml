  - number: 1.1.2
    text: |-
      Onder de vergunning voor het in de handel brengen van een referentiediergeneesmiddel worden mede verstaan alle
      vergunningen voor eventuele nieuwe diersoorten, andere concentraties, farmaceutische vormen, toedieningswijzen
      en aanbiedingsvormen ervan, alsmede iedere wijziging of uitbreiding die in of op het diergeneesmiddel wordt
      aangebracht.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel1.1
  - number: 1.1.3
    text: |-
      Onder dezelfde werkzame stof wordt verstaan: een substantie in de vorm van een zout, ester, ether, isomeer, mengsel
      van isomeren, complex of derivaat van een werkzame stof, tenzij de eigenschappen daarvan aanzienlijk afwijken wat
      betreft veiligheid of werkzaamheid.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel1.1
  - number: 1.1.4
    text: |-
      Onder vervaardiging van een werkzame stof wordt verstaan: vervaardiging van een grondstof als bedoeld in bijlage
      I, titel 1, deel 2, rubriek C, en bijlage I, titel 2, deel 2, rubriek C, bij [Richtlijn 2001/82/EG](32001L0082)
      alsmede de verschillende procédés met betrekking tot verdeling, verpakking of presentatie vóór de verwerking ervan
      in een diergeneesmiddel alsmede het invoeren, opnieuw verpakken en opnieuw etiketteren.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel1.1
  - number: 1.1.5
    text: |-
      Onder het vervaardigen van een diergeneesmiddel wordt mede verstaan het verrichten van één of meer deelbewerkingen
      die noodzakelijk zijn voor de vervaardiging, waaronder het bereiden, bewerken, verwerken, etiketteren, of verpakken
      waaronder het vullen en sluiten van de primaire verpakking van dat middel.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel1.1
  - number: 1.1.6
    text: 'Onder het vervaardigen van een diervoeder met medicinale werking wordt mede verstaan:'
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel1.1
  - number: 1.1.6.a
    text: |-
      het verrichten van één of meer deelbewerkingen die noodzakelijk zijn voor de vervaardiging, waaronder het bereiden,
      bewerken, verwerken, etiketteren, of verpakken waaronder het vullen en sluiten van de primaire verpakking van het
      diervoeder met medicinale werking;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel1.1
  - number: 1.1.6.b
    text: |-
      het bereiden van een halffabricaat dat bestaat uit een voormengsel met medicinale werking en één of meer
      diervoeders.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel1.1
  - number: 1.1.7
    text: 'Onder bijwerking wordt mede verstaan: vermoedelijke bijwerking.'
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel1.1
  - number: '1.2'
    text: |-
      Ingeval van twijfel of een substantie kan worden aangemerkt als diergeneesmiddel als bedoeld in
      [artikel 1.1 van de wet][ref1], wordt deze substantie in ieder geval beoordeeld als diergeneesmiddel volgens het
      bij of krachtens dit besluit gestelde, ook indien de desbetreffende substantie krachtens communautaire wetgeving
      als bedoeld in artikel 2, tweede lid, van [Richtlijn 2001/82/EG](32001L0082) binnen de werkingssfeer van een andere
      wet of EU-rechtshandeling valt.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel1
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '1'
  - number: 2.1.1
    text: |-
      Een aanvraag om een vergunning voor het in de handel brengen van een diergeneesmiddel als bedoeld in
      [artikel 2.19, eerste lid, van de wet][ref1] wordt ingediend bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 2.1.2
    text: |-
      Op een aanvraag als bedoeld in het eerste lid is [titel 4.1 van de Algemene wet bestuursrecht][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 2.1.3
    text: |-
      In afwijking van het eerste lid wordt een aanvraag van een vergunning voor het in de handel brengen van een
      diergeneesmiddel als bedoeld in artikel 3, eerste lid, van Verordening (EG) nr. 726/2004 bij de Europese Commissie
      ingediend.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.1
  - number: 2.1.4
    text: |-
      Bij ministeriële regeling worden met betrekking tot informatie als bedoeld in artikel 58, vijfde lid, van
      [Richtlijn 2001/82/EG](32001L0082) regels gesteld voor de uitvoering van de artikelen 3, derde en vierde lid, 41,
      tweede, derde en vierde lid, en 42 van Verordening (EG) nr. 726/2004 en 34, vierde lid, onderdeel e, van dezelfde
      verordening in samenhang met de artikelen 61, eerste en tweede lid, en 67, tweede alinea, van [Richtlijn 2001/82/
      EG](32001L0082).
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.1
  - number: '2.2'
    text: |-
      Een aanvraag als bedoeld in [artikel 2.1, eerste lid][ref1], wordt alleen in behandeling genomen indien de
      aanvrager is gevestigd in een EER-lidstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.3.1
    text: |-
      Een aanvraag als bedoeld in [artikel 2.1, eerste lid][ref1], gaat vergezeld van administratieve gegevens en
      wetenschappelijke documentatie waarmee de kwaliteit, de veiligheid en de werkzaamheid van het diergeneesmiddel
      kunnen worden aangetoond, waaronder de volgende documenten of een verklaring tot toegang tot deze documenten:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.3.1.a
    text: 'een dossier dat bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.3
  - number: 2.3.1.a.1°
    text: farmaceutische proeven, waaronder fysisch-chemische, biologische of microbiologische proeven,
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.3
  - number: 2.3.1.a.2°
    text: onschadelijkheids- en residuproeven,
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.3
  - number: 2.3.1.a.3°
    text: preklinische en klinische proeven,
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.3
  - number: 2.3.1.a.4°
    text: een evaluatie van de risico’s die het diergeneesmiddel voor het milieu inhoudt,
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.3
  - number: 2.3.1.a.5°
    text: een samenvatting van de productkenmerken, en
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.3
  - number: 2.3.1.b
    text: |-
      uitvoerige, kritische samenvattingen van de resultaten van proeven in de wetenschappelijke documentatie, bedoeld in
      onderdeel a, onder 1° tot en met 4°.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.3
  - number: 2.3.2
    text: |-
      De in het eerste lid bedoelde documenten worden opgesteld overeenkomstig de artikelen 12, derde lid, 14
      onderscheidenlijk 15 van [Richtlijn 2001/82/EG](32001L0082) in samenhang met bijlage I bij [Richtlijn 2001/82/
      EG](32001L0082).
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.3
  - number: 2.3.3
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld voor de uitvoering van het eerste en tweede lid en kunnen
      regels worden gesteld omtrent het overleggen van documenten die nodig zijn bij de behandeling van een aanvraag
      voorzover daartoe geen regels zijn gesteld in bijlage I bij [Richtlijn 2001/82/EG](32001L0082).
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.3
  - number: 2.4.1
    text: |-
      Indien een aanvraag als bedoeld in [artikel 2.1, eerste lid][ref1], is ingediend dan wel wordt ingediend
      voorafgaand aan, gelijktijdig met of nadat een aanvraag voor een vergunning voor het in de handel brengen van een
      overeenkomstig diergeneesmiddel met toepassing van [Richtlijn 2001/82/EG](32001L0082) in één of meer andere EER-
      lidstaten is ingediend of wordt ingediend, behandelt Onze Minister deze aanvraag uitsluitend, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.4.1.a
    text: |-
      de bij de aanvraag ingediende documenten, bedoeld in [artikel 2.3, eerste lid][ref1], identiek zijn aan de
      documenten die in andere lidstaten zijn ingediend of worden ingediend en


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.4.1.b
    text: een lijst van de EER-lidstaten waar een overeenkomstige aanvraag is ingediend, is bijgevoegd.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.4
  - number: 2.4.2
    text: |-
      Bij de behandeling van een aanvraag als bedoeld in het eerste lid draagt Onze Minister zorg voor uitvoering van de
      artikelen 31 tot en met 38 van [Richtlijn 2001/82/EG](32001L0082), met dien verstande dat onder:
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.4
  - number: 2.4.2.a
    text: |-
      een vertegenwoordiger als bedoeld in artikel 31, tweede lid, van [Richtlijn 2001/82/EG](32001L0082), wordt verstaan
      een door Onze Minister te benoemen vertegenwoordiger;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.4
  - number: 2.4.2.b
    text: |-
      een aanvrager als bedoeld in artikel 32, eerste lid, van [Richtlijn 2001/82/EG](32001L0082), wordt verstaan een
      aanvrager die een aanvraag bij Onze Minister heeft ingediend;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.4
  - number: 2.4.2.c
    text: |-
      een dossier als bedoeld in artikel 32, eerste lid, van [Richtlijn 2001/82/EG](32001L0082), wordt verstaan een
      aanvraag die de documenten, bedoeld in [artikel 2.3][ref1], alsmede een lijst van de EER-lidstaten waarop de
      aanvraag betrekking heeft, bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.4.3
    text: |-
      Indien bij de uitvoering van het tweede lid ingevolge artikel 33, vierde lid, van [Richtlijn 2001/82/EG]
      (32001L0082) uitvoering wordt gegeven aan de artikelen 36, 37 en 38 van die richtlijn en het mogelijk is een
      vergunning te verstrekken zonder afbreuk te doen aan de uitkomst van de procedure, bedoeld in de artikelen 36, 37
      en 38 van [Richtlijn 2001/82/EG](32001L0082) kan Onze Minister een al dan niet tijdelijke vergunning verstrekken
      met aan die vergunning verbonden voorschriften die betrekking hebben op het kunnen uitvoeren van maatregelen als
      bedoeld in [artikel 5.11, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel5
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '5'
  - number: 2.4.4
    text: |-
      Onze Minister kan bij ontbreken van specifieke communautaire wetgeving inzake het gebruik van een immunologisch
      diergeneesmiddel bij een dierziekte een beroep doen op artikel 71, eerste lid, van [Richtlijn 2001/82/EG]
      (32001L0082) om een behandeling van een aanvraag als bedoeld in het eerste lid te weigeren, indien het in de
      handel brengen van een immunologisch diergeneesmiddel een programma met betrekking tot een dierziekte doorkruist,
      moeilijkheden oplevert voor certificering van afwezigheid van een ziekte bij dieren of producten of wanneer de met
      het diergeneesmiddel te bestrijden ziekte nauwelijks voorkomt. Onze Minister stelt de Europese Commissie van een
      weigering op de hoogte.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.4
  - number: 2.5.1
    text: |-
      De termijn voor een beslissing op een aanvraag als bedoeld in [artikel 2.1, eerste lid][ref1], vangt aan nadat een
      aanvraag door Onze Minister als volledig is aangemerkt en bedraagt ten hoogste 210 dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.5.2
    text: |-
      Bij ministeriële regeling kan een kortere termijn worden vastgesteld voor het nemen van een besluit als bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.5
  - number: 2.6.1
    text: |-
      Onze Minister geeft een aanvrager de gelegenheid om de aanvraag schriftelijk aan te vullen als bedoeld
      in [artikel 4:5, eerste tot en met derde lid, van de Algemene wet bestuursrecht][ref1], of mondeling
      toe te lichten en schort daartoe de termijn, bedoeld in [artikel 2.5][ref2] met toepassing van
      [artikel 4:15, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref3] op indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 2.6.1.a
    text: |-
      de documenten, bedoeld in [artikel 2.3, eerste lid][ref1], niet alle benodigde gegevens of bescheiden bevatten voor
      het in behandeling nemen van een aanvraag, of


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.6.1.b
    text: |-
      de documenten, bedoeld in [artikel 2.3, eerste lid][ref1], onvoldoende gegevens bevatten om vast te kunnen
      stellen dat het diergeneesmiddel bij toepassing overeenkomstig de opgegeven voorschriften, bedoeld in
      [artikel 2.19, derde lid, onderdeel a, aanhef, van de wet][ref2] voldoet aan artikel 2.19, derde lid, onderdeel a,
      onder 1° en 2°, alsmede onderdeel b, c, d en g van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 2.6.2
    text: |-
      Een besluit tot opschorting als bedoeld in het eerste lid, laat de bevoegdheid tot opschorting, bedoeld in
      [artikel 4:15, eerste lid, onderdeel b, en tweede lid, van de Algemene wet bestuursrecht][ref1], onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '2.7'
    text: |-
      De behandeling van een aanvraag van een vergunning als bedoeld in [artikel 2.1, eerste lid][ref1], is
      opgeschort voor de duur van procedures als bedoeld in de [artikelen 2.4, tweede en derde lid][ref2],
      [2.23][ref3], [2.24][ref4] en [2.25][ref5], met dien verstande dat de termijn, bedoeld in
      [artikel 4:15 van de Algemene wet bestuursrecht][ref6], wordt opgeschort tot 30 dagen na de vaststelling van de
      algehele overeenstemming, bedoeld in artikel 32, vierde lid, en de kennisgeving van de beschikking, bedoeld in
      artikel 38, derde lid, tweede volzin, van [Richtlijn 2001/82/EG](32001L0082).


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref5
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 2.8.1
    text: |-
      Op een aanvraag van een vergunning als bedoeld in [artikel 2.1, eerste lid][ref1], is
      [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 2.8.2
    text: |-
      In afwijking van het eerste lid is [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] niet van toepassing
      op een aanvraag:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 2.8.2.a
    text: voor een eerste vergunning voor het in de handel brengen van een diergeneesmiddel;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.8
  - number: 2.8.2.b
    text: |-
      tot wijziging van een vergunning voor gevallen die bij ministeriële regeling worden aangewezen voor de uitvoering
      van artikel 39, eerste lid, van [Richtlijn 2001/82/EG](32001L0082),
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.8
  - number: 2.8.2.c
    text: tot verlenging van een vergunning voor het in de handel brengen.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.8
  - number: 2.8.3
    text: |-
      In afwijking van het eerste en tweede lid is [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] van
      overeenkomstige toepassing na 30 dagen na de kennisgeving van:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 2.8.3.a
    text: de algehele overeenstemming, bedoeld in artikel 32, vierde lid, van [Richtlijn 2001/82/EG](32001L0082), of
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.8
  - number: 2.8.3.b
    text: de beschikking bedoeld in artikel 38, derde lid, tweede volzin, van [Richtlijn 2001/82/EG](32001L0082),
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.8
  - number: 2.9.1
    text: |-
      Onze Minister weigert een vergunning als bedoeld in [artikel 2.1, eerste lid][ref1], te verstrekken indien:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.9.1.a
    text: |-
      de documenten, bedoeld in [artikel 2.3, eerste lid][ref1], niet volledig of niet juist zijn,


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.9.1.b
    text: |-
      door de Europese Commissie of een andere EER-lidstaat een aanvraag voor het verstrekken van een vergunning als
      bedoeld in artikel 5, eerste lid, eerste alinea, van [Richtlijn 2001/82/EG](32001L0082) in behandeling is genomen,
      of die vergunning is verleend, en de documenten, bedoeld in [artikel 2.3, eerste lid][ref1], niet overeenkomstig
      [artikel 2.1, vierde lid][ref2], of [artikel 2.4][ref3] zijn ingediend;


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.9.1.c
    text: |-
      de beoordeling van de positieve therapeutische effecten van het diergeneesmiddel in verhouding tot de risico’s
      verbonden aan de diergeneeskundige toepassing onder de beoogde gebruiksomstandigheden niet gunstig is;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.9
  - number: 2.9.1.d
    text: |-
      het diergeneesmiddel geen therapeutische werking heeft of de therapeutische werking onvoldoende is aangetoond,
      onverminderd [artikel 2.19, zesde lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 2.9.1.e
    text: 'de in het dossier opgegeven wachttermijn:'
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.9
  - number: 2.9.1.e.1°
    text: |-
      ontoereikend is als garantie dat een van een behandeld dier afkomstig voedingsmiddel geen residu bevat dat een
      gevaar oplevert voor de gezondheid van mensen, of
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.9
  - number: 2.9.1.e.2°
    text: onvoldoende is gemotiveerd;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.9
  - number: 2.9.1.f
    text: |-
      de bij de aanvraag voorgestelde etikettering of bijsluiter niet voldoet aan de eisen die bij ministeriële regeling
      krachtens [artikel 2.13, eerste lid][ref1] worden gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.9.1.g
    text: |-
      het diergeneesmiddel wordt aangeboden voor een toepassing die op grond van een EU-verordening of EU-besluit
      verboden is;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.9
  - number: 2.9.1.h
    text: |-
      de aanvraag betrekking heeft op bij EU-rechtshandeling aangewezen stoffen en niet wordt voldaan aan de
      voorschriften voor het in de handel brengen en de toepassing, die bij ministeriële regeling krachtens
      [artikel 8.4][ref1] wordt gesteld, of


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel8
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
  - number: 2.9.1.i
    text: |-
      voor de beoordeling van het diergeneesmiddel met betrekking tot de onderdelen a tot en met h, geen EU-verordening,
      EU-besluit of een bij ministeriële regeling in uitvoering te nemen EU-richtlijn is vastgesteld en het weigeren van
      de vergunning noodzakelijk is voor de bescherming van de volksgezondheid, de consument of de gezondheid van dieren,
      waaronder een geval als bedoeld in artikel 71, eerste lid, van [Richtlijn 2001/82/EG](32001L0082), waarbij de
      Europese Commissie van de toepassing van dat artikel op de hoogte wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.9
  - number: 2.9.2
    text: |-
      Onze Minister hanteert, bij de uitvoering van het eerste lid, beoordelingsmethoden als bedoeld in
      [artikel 2.19, vierde lid, van de wet][ref1], die door experts van de EER-lidstaten gezamenlijk zijn vastgesteld
      in verband met de uitvoering van [Richtlijn 2001/82/EG](32001L0082), voor zover deze beoordelingsmethoden bij
      ministeriële regeling zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 2.9.3
    text: |-
      Bij de beoordeling, bedoeld in het eerste lid, onderdeel c, van een diergeneesmiddel voor zoötechnische toepassing
      wordt in het bijzonder rekening gehouden met voordelen voor:
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.9
  - number: 2.9.3.a
    text: de gezondheid en het welzijn van het dier, en
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.9
  - number: 2.9.3.b
    text: de veiligheid voor de consument.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.9
  - number: 2.10.1
    text: |-
      Een vergunning als bedoeld in [artikel 2.1, eerste lid][ref1], voor een diergeneesmiddel met het oog op toepassing
      bij een of meer voor de productie van levensmiddelen bestemde diersoorten wordt slechts verstrekt, indien de
      farmacologisch werkzame stoffen van dat middel bij een krachtens Verordening (EG) nr. 470/2009 genomen EU-
      rechtshandeling zijn toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.10.2
    text: |-
      Bij de toepassing van het eerste lid geldt dat een aanvraag voor een diergeneesmiddel dat in de handel wordt
      gebracht voor een of meer voor de productie van levensmiddelen bestemde diersoorten en een of meer farmacologisch
      werkzame stoffen bevat, die niet krachtens de in het eerste lid bedoelde EU-rechtshandeling zijn toegelaten, niet
      eerder wordt ingediend dan zes maanden nadat een geldige aanvraag voor de vaststelling van maximumwaarden voor
      residuen volgens de bepalingen van Verordening (EG) nr. 470/2009 is gedaan.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.10
  - number: 2.11.1
    text: |-
      In afwijking van [artikel 2.10][ref1] kan Onze Minister een vergunning als bedoeld in
      [artikel 2.1, eerste lid][ref2], verstrekken voor een diergeneesmiddel dat een farmacologisch werkzame stof bevat
      in het geval:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.11.1.a
    text: |-
      die farmacologisch werkzame stof krachtens een krachtens [Verordening (EG) nr. 470/2009](32009R0470) vast te
      stellen EU-rechtshandeling kan worden toegelaten en
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.11
  - number: 2.11.1.b
    text: 'aan die vergunning voorschriften worden verbonden die inhouden dat:'
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.11
  - number: 2.11.1.b.1°
    text: |-
      dit diergeneesmiddel slechts wordt toegediend aan specifieke dieren van de familie van de paardachtigen, die niet
      bedoeld zijn voor de levering van dierlijke producten na de slacht, en
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.11
  - number: 2.11.1.b.2°
    text: |-
      het diergeneesmiddel slechts wordt toegepast bij een dier dat geregistreerd is volgens de vereisten van Verordening
      (EG) nr. 504/2008.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.11
  - number: 2.11.2
    text: |-
      De vergunning, bedoeld in het eerste lid, wordt niet verstrekt indien het diergeneesmiddel bestemd is voor de
      behandeling van een aandoening als omschreven in de erkende samenvatting van de kenmerken van het product, bij
      dieren waarvoor een ander diergeneesmiddel voor dieren van de familie van paardachtigen in de handel mag worden
      gebracht krachtens een vergunning als bedoeld in [artikel 2.1, eerste of derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.12.1
    text: 'De vergunning voor het in de handel brengen van een diergeneesmiddel omvat mede:'
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.12
  - number: 2.12.1.a
    text: de aanvraag en de aan de vergunning verbonden voorschriften;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.12
  - number: 2.12.1.b
    text: |-
      de documenten, bedoeld in [artikel 2.3, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.12.1.c
    text: een ambtshalve vastgesteld beoordelingsrapport met motivering.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.12
  - number: 2.12.2
    text: |-
      In afwijking van het eerste lid, onderdeel b, stelt Onze Minister bij de vergunning, bedoeld in het eerste lid,
      zo nodig een samenvatting van de productkenmerken vast, die afwijkt van de ingediende samenvatting, bedoeld in
      [artikel 2.3, eerste lid, onderdeel a, onder 5°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.12.3
    text: |-
      Het beoordelingsrapport, bedoeld in het eerste lid, onderdeel c, wordt bijgewerkt zodra nieuwe gegevens beschikbaar
      komen die voor de beoordeling van de kwaliteit, de veiligheid en de werkzaamheid van het diergeneesmiddel van
      belang zijn.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.12
  - number: 2.12.4
    text: |-
      Voorschriften die zijn verbonden aan een vergunning als bedoeld in het eerste lid, gelden voor een ieder die een
      handeling als bedoeld in het eerste lid verricht.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.12
  - number: '2.13'
    text: |-
      De houder van de vergunning, bedoeld in [artikel 2.12, eerste lid][ref1], draagt er zorg voor dat:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.13.a
    text: |-
      een diergeneesmiddel slechts in de handel wordt gebracht overeenkomstig regels inzake verpakking en informatie
      op, bij of in de verpakking waaronder etikettering, de primaire verpakking, de bijsluiter en de buitenverpakking,
      waaronder regels voor de uitvoering van Verordening (EG) nr. 504/2008 in verband met diergeneesmiddelen voor
      paardachtigen als bedoeld in [artikel 2.11][ref1], die bij ministeriële regeling worden gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.13.b
    text: |-
      tijdig een aanvraag wordt ingediend tot wijziging van de vergunning om te waarborgen dat het diergeneesmiddel
      volgens algemeen aanvaarde wetenschappelijke methoden wordt vervaardigd en gecontroleerd, rekening houdend met
      de vooruitgang van wetenschap en techniek, volgens regels die daartoe bij ministeriële regeling worden gesteld,
      waaronder regels voor de uitvoering van de diergeneesmiddelenbewaking;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.13
  - number: 2.13.c
    text: |-
      indien bij de wijziging, bedoeld in onderdeel b, een wijziging van een document als bedoeld in
      [artikel 2.3, eerste lid][ref1] nodig is, wordt onverwijld een aanvraag tot wijziging van de vergunning ingediend,
      tenzij een krachtens artikel 39, eerste lid, van [Richtlijn 2001/82/EG](32001L0082) door de Europese Commissie
      vastgestelde EU-rechtshandeling anders bepaald;


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.13.d
    text: |-
      voor het toezicht op de naleving door ambtenaren of andere personen als bedoeld in de
      [artikelen 8.1, eerste lid][ref1], en [10.2 van de wet][ref2] worden voldoende hoeveelheden van diergeneesmiddelen
      of andere substanties tot de uiterste gebruiksdatum beschikbaar gehouden die noodzakelijk zijn om de aanwezigheid
      van residuen van diergeneesmiddelen of andere substanties te kunnen onderzoeken en kunnen bij ministeriële regeling
      gevallen worden aangewezen waarbij tevens documenten over deze substanties worden overgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel10
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '10'
  - number: 2.13.e
    text: |-
      wordt bijgedragen aan de uitvoering van analysemethoden voor de opsporing van residuen van diergeneesmiddelen
      voor de uitvoering van Verordening (EU) nr. 2017/625 en daarop gebaseerde EU-rechtshandelingen bij een daartoe
      aangewezen referentielaboratorium;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.13
  - number: 2.13.f
    text: 'onverwijld en uit eigen beweging aan Onze Minister informatie wordt overgelegd:'
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.13
  - number: 2.13.f.1°
    text: |-
      die kan leiden tot wijziging van documenten als bedoeld in [artikel 2.3][ref1], waaronder een vermoedelijke
      overdracht van infectieuze stoffen of een andere non-conformiteit van het diergeneesmiddel;


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.13.f.2°
    text: |-
      met betrekking tot een door een bevoegde autoriteit van een land waar het diergeneesmiddel in de handel wordt
      gebracht opgelegd verbod of opgelegde beperking;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.13
  - number: 2.13.f.3°
    text: |-
      over de beoordeling, bedoeld in [artikel 2.9, eerste lid, onderdeel c][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.13.f.4°
    text: |-
      over iedere stap die is ondernomen om het in de handel brengen van een diergeneesmiddel op te schorten of uit de
      handel te nemen onder opgave van redenen van deze stap;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.13
  - number: 2.13.g
    text: |-
      op verzoek van ambtenaren of andere personen als bedoeld in de [artikelen 8.1, eerste lid][ref1], en
      [10.2 van de wet][ref2], worden gegevens verstrekt om te kunnen afwegen of de beoordeling bedoeld in
      [artikel 2.9, eerste lid, onderdeel c][ref3], gunstig blijft uitvallen;


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.13.h
    text: |-
      de datum waarop het diergeneesmiddel of de daarvan afgeleide aanbiedingsvorm daadwerkelijk in de handel wordt
      gebracht, tijdig aan Onze Minister wordt medegedeeld;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.13
  - number: 2.13.i
    text: |-
      de datum waarop de handel in het diergeneesmiddel of de daarvan afgeleide aanbiedingsvorm tijdelijk of definitief
      wordt stopgezet, behoudens uitzonderlijke omstandigheden, ten minste twee maanden van te voren en op de
      daadwerkelijke datum wordt medegedeeld aan Onze Minister;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.13
  - number: 2.13.j
    text: |-
      periodiek aan Onze Minister informatie wordt verstrekt volgens regels die bij ministeriële regeling worden gesteld
      met betrekking tot veiligheidsverslagen en gegevens over afzetvolume;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.13
  - number: 2.13.k
    text: |-
      de krachtens [artikel 8.4][ref1] gestelde regels voor de uitvoering van een EU-rechtshandeling, waarin stoffen zijn
      aangewezen en voorschriften zijn gesteld voor het in de handel brengen van deze stoffen, worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel8
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
  - number: 2.14.1
    text: |-
      De door Onze Minster aan een vergunning te verbinden voorschriften, bedoeld in
      [artikel 2.12, eerste lid, onderdeel a][ref1], hebben betrekking op:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.14.1.a
    text: |-
      de toepassing, bedoeld in [artikel 2.19, derde lid, onderdeel a, aanhef, van de wet][ref1], van het
      diergeneesmiddel in verband met:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 2.14.1.a.1°
    text: |-
      de gestelde werking, bedoeld in [artikel 2.19, derde lid, onderdeel a, onder 1°, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 2.14.1.a.2°
    text: |-
      het voorkomen van gevaren, bedoeld in [artikel 2.19, derde lid, onderdeel a, onder 2°, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 2.14.1.a.3°
    text: |-
      de eigenschappen, bedoeld in [artikel 2.19, derde lid, onderdeel b, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 2.14.1.a.4°
    text: |-
      de richtsnoeren en beginselen, bedoeld in [artikel 2.19, derde lid, onderdeel f, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 2.14.1.b
    text: |-
      de verpakking en informatie op, bij of in de verpakking als bedoeld in [artikel 2.13, onderdeel a][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.14.1.c
    text: |-
      de procedures die in verband met de veiligheid van het diergeneesmiddel in uitzonderlijke omstandigheden kunnen
      gelden, en kunnen inhouden dat:
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.14
  - number: 2.14.1.c.1°
    text: |-
      aan Onze Minister informatie wordt verstrekt over incidenten in verband met de toepassing en de te nemen
      maatregelen, en
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.14
  - number: 2.14.1.c.2°
    text: de voorschriften bij de vergunning die betrekking hebben op deze procedures jaarlijks worden herbeoordeeld.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.14
  - number: 2.14.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de gevallen waarin en de wijze waarop voorschriften als
      bedoeld in het eerste lid, worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.14
  - number: '2.15'
    text: |-
      De vergunning, bedoeld in [artikel 2.12, eerste lid][ref1], heeft een geldingsduur van vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.16.1
    text: |-
      De [artikelen 2.1 tot en met 2.15][ref1] zijn van toepassing op een aanvraag tot verlenging, wijziging of
      intrekking van een vergunning als bedoeld in [artikel 2.1, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.16
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.16.2
    text: |-
      In afwijking van het eerste lid zijn de [artikelen 2.7][ref1] en [2.8][ref2] niet van toepassing in het geval de
      termijn voor behandeling van een aanvraag tot verlenging, wijziging of intrekking van een vergunning als bedoeld in
      [artikel 2.19, eerste lid][ref3], op grond van het derde lid van dat artikel 60 dagen bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.16
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 2.16.3
    text: |-
      Een aanvraag als bedoeld in het eerste lid wordt slechts in behandeling genomen als deze is ingediend door de
      houder van de vergunning.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.16
  - number: 2.17.1
    text: |-
      Een aanvraag tot verlenging van een vergunning als bedoeld in [artikel 2.1, eerste lid][ref1], wordt ingediend ten
      minste 26 weken voordat de geldingsduur van de vergunning is verlopen.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.17.2
    text: |-
      Bij een aanvraag als bedoeld in het eerste lid kan de aanvrager in afwijking van [artikel 2.3, eerste lid][ref1],
      volstaan met indiening van een lijst van alle bij eerdere aanvragen ingediende documenten en alle daarin
      aangebrachte veranderingen, waaronder wijziging of uitbreiding van de informatie over de werking van het
      diergeneesmiddel als bedoeld in de [artikelen 6.1, eerste lid][ref2], en [6.2, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0032386#Artikel6
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '6'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0032386
        artikel: '6'
        hoofdstuk: '6'
  - number: 2.17.3
    text: |-
      Onze Minister verlengt een vergunning als bedoeld in [artikel 2.12, eerste lid][ref1], op een eerste aanvraag tot
      verlenging voor onbepaalde tijd.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.17.4
    text: |-
      In afwijking van het derde lid kan een vergunning tot vijf jaar worden verlengd bij gerechtvaardigde gronden in
      verband met de diergeneesmiddelenbewaking. Bij een volgende aanvraag wordt die vergunning voor onbepaalde tijd
      verlengd.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.17
  - number: 2.18.1
    text: |-
      Een aanvraag tot wijziging van een vergunning als bedoeld in [artikel 2.1, eerste lid][ref1], wordt slechts in
      behandeling genomen, indien de aanvraag betrekking heeft op een in die vergunning genoemde:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.18.1.a
    text: diersoort;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.18
  - number: 2.18.1.b
    text: concentratie van het diergeneesmiddel;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.18
  - number: 2.18.1.c
    text: farmaceutische vorm;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.18
  - number: 2.18.1.d
    text: toepassingswijze, of
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.18
  - number: 2.18.1.e
    text: aanbiedingsvorm.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.18
  - number: 2.18.2
    text: 'Onder een aanvraag tot wijziging van een vergunning als bedoeld in het eerste lid wordt mede verstaan:'
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.18
  - number: 2.18.2.a
    text: |-
      een aanvraag tot uitbreiding van een vergunning met een andere diersoort, een andere farmaceutische vorm,
      toepassingswijze of aanbiedingsvorm, of
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.18
  - number: 2.18.2.b
    text: 'iedere andere aanvraag tot wijziging met uitzondering van:'
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.18
  - number: 2.18.2.b.1°
    text: een wijziging zodanig dat niet langer sprake is van dezelfde werkzame stof, of
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.18
  - number: 2.18.2.b.2°
    text: een toevoeging van een andere werkzame stof.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.18
  - number: 2.18.3
    text: |-
      Een aanvraag van een wijziging van een vergunning als bedoeld in het tweede lid wordt in behandeling genomen
      als een eerste aanvraag tot verlening van een vergunning als bedoeld in [artikel 2.1, eerste lid][ref1], indien
      de aanvraag niet in overeenstemming is met een krachtens artikel 39, eerste lid, van [Richtlijn 2001/82/EG]
      (32001L0082) door de Europese Commissie vastgestelde EU-rechtshandeling.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.18.4
    text: |-
      Bij ministeriële regeling worden regels gesteld voor de behandeling van een aanvraag als bedoeld in het eerste lid
      en derde lid alsmede voor de behandeling van een aanvraag waarvoor krachtens artikel 39, eerste lid, van [Richtlijn
      2001/82/EG](32001L0082) door de Europese Commissie een EU-rechtshandeling is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.18
  - number: 2.18.5
    text: |-
      Elk voornemen tot wijziging van een vergunning die is verstrekt met toepassing van
      [artikelen 2.4, tweede lid][ref1], [2.23][ref2] of [2.24][ref3] wordt voorgelegd aan alle lidstaten die voor het in
      de handel brengen van het betrokken diergeneesmiddel een vergunning hebben verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 2.19.1
    text: |-
      De houder van de vergunning, bedoeld in [artikel 2.12, eerste lid][ref1], vraagt een wijziging of intrekking
      van die vergunning aan nadat in het Publicatieblad van de Europese Unie een wijziging is bekendgemaakt van een
      krachtens artikelen 14 en 27 van Verordening (EG) nr. 470/2009 vastgestelde EU-rechtshandeling met betrekking tot
      een farmacologisch werkzame stof in een diergeneesmiddel waarvoor de vergunning is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.19.2
    text: |-
      Onze Minister wijzigt de vergunning, bedoeld in het eerste lid, zo nodig ambtshalve, of trekt de vergunning
      zo nodig ambtshalve in, overeenkomstig de EU-rechtshandeling, bedoeld in het eerste lid, indien Onze Minister
      genoegzaam is gebleken dat er geen aanvraag als bedoeld in het eerste lid wordt ingediend.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.19
  - number: 2.19.3
    text: |-
      Onze Minister neemt in afwijking van het tweede lid en [artikel 2.16, eerste lid][ref1], een besluit tot wijziging
      of intrekking van de vergunning, bedoeld in het tweede lid, binnen 60 dagen na de bekendmaking, bedoeld in het
      eerste lid, als de in dat lid bedoelde EU-rechtshandeling, dat rechtvaardigt en indiening van een aanvraag tot
      wijziging of intrekking van de vergunning of de behandeling van die aanvraag niet afgewacht kan worden.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 2.19.4
    text: |-
      Het is een houder van een vergunning als bedoeld in het eerste lid toegestaan een aanvraag achterwege te laten,
      indien bij de bekendmaking, bedoeld in het eerste lid, de maximumresidulimiet is verhoogd en Onze Minister
      besluit dat een aanvraag naar zijn oordeel niet nodig is. Dit besluit wordt bekendgemaakt in overeenstemming met
      [artikel 3:42 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 2.20.1
    text: |-
      Onze Minister kan om te komen tot een beperking van indicaties of beschikbaarheid, wijziging van dosering of
      toevoeging van een contra-indicatie of voorzorgsmaatregel, de voorschriften bij een vergunning ambtshalve wijzigen
      of de vergunning, bedoeld in [artikel 2.12, eerste lid][ref1], schorsen, indien hij een ernstig vermoeden heeft dat
      de voorschriften, bedoeld in de [artikelen 2.13][ref2] of [2.14][ref3], niet worden nageleefd, het diergeneesmiddel
      niet voldoet aan [artikel 2.19, tweede en derde lid, van de wet][ref4] of hiervan is gebleken na de ontvangst van
      informatie als bedoeld in [artikel 6.1, eerste lid][ref5]. Het Bureau, de andere lidstaten en de houder van de
      vergunning worden onmiddellijk in kennis gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0032386#Artikel6
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.20
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0030250
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0032386
        artikel: '6'
        hoofdstuk: '6'
  - number: 2.20.2
    text: 'De vergunning wordt niet geschorst of gewijzigd dan nadat:'
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.20
  - number: 2.20.2.a
    text: een verzoek van de Europese Commissie tot het nemen van tijdelijke maatregelen is ontvangen, of
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.20
  - number: 2.20.2.b
    text: |-
      een EU-besluit is genomen na een procedure als bedoeld in [artikel 2.25, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.20
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 2.20.3
    text: 'In afwijking van het tweede lid kan een vergunning worden geschorst, indien er sprake is van:'
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.20
  - number: 2.20.3.a
    text: |-
      een noodgeval met betrekking tot bescherming van de gezondheid van mens of dier en het Bureau, de Europese
      Commissie en de andere EER-lidstaten daarvan uiterlijk op de volgende werkdag in kennis worden gesteld;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.20
  - number: 2.20.3.b
    text: |-
      een uitzonderlijk geval als bedoeld in [artikel 2.25, tweede lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.20
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 2.20.3.c
    text: |-
      een ander geval waarin de [artikelen 2.24][ref1] en [2.25][ref2] niet van toepassing zijn, waaronder een geval als
      bedoeld in artikel 71, eerste lid, van [Richtlijn 2001/82/EG](32001L0082).


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.20
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 2.20.4
    text: |-
      Onze Minister stelt de Europese Commissie op de hoogte van toepassing van artikel 71, eerste lid, van [Richtlijn
      2001/82/EG](32001L0082) als bedoeld in het derde lid, onder c.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.20
  - number: 2.21.1
    text: |-
      De vergunning, bedoeld in [artikel 2.12, eerste lid][ref1], kan, onverminderd
      [artikel 2.16, eerste en derde lid][ref2], ambtshalve worden ingetrokken, indien uit feiten of omstandigheden
      blijkt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.21
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 2.21.1.a
    text: |-
      de documenten, bedoeld in [artikel 2.3, eerste lid][ref1], zodanig onjuist of onvolledig zijn dat op de aanvraag
      een andere beslissing zou zijn genomen, indien bij de beoordeling daarvan de juiste gegevens bekend waren geweest;


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.21
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.21.1.b
    text: |-
      de voorschriften, bedoeld in de [artikelen 2.13][ref1] of [2.14][ref2] niet worden nageleefd, of


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.21
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.21.1.c
    text: |-
      het diergeneesmiddel niet voldoet aan het bij of krachtens [artikel 2.19, tweede en derde lid, van de wet][ref1]
      gestelde.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.21
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 2.21.2
    text: |-
      Onze Minister stelt het Bureau, andere EER-lidstaten en de houder van de vergunning onverwijld van het voornemen
      tot intrekking in kennis.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.21
  - number: 2.21.3
    text: |-
      Onze Minister trekt een vergunning niet in dan nadat een EU-besluit is genomen, indien er sprake is van intrekking
      vanwege een bijzonder geval als bedoeld in [artikel 2.24][ref1] of een voorgenomen besluit tot intrekking als
      bedoeld in [artikel 2.25][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.21
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 2.22.1
    text: |-
      De vergunning, bedoeld in [artikel 2.12, eerste lid][ref1], vervalt van rechtswege, indien het diergeneesmiddel na
      verstrekking van de vergunning gedurende een termijn van drie jaar niet daadwerkelijk in de handel is gebracht of
      niet meer daadwerkelijk in de handel is.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.22
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.22.2
    text: |-
      Onze Minister kan in uitzonderlijke omstandigheden of om redenen van gezondheid van mens of dier het vervallen van
      de termijn van drie jaar, bedoeld in het eerste lid, met een nader te bepalen termijn uitstellen in het belang van
      dierenwelzijn, diergezondheid, volksgezondheid of milieu.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.22
  - number: '2.23'
    text: |-
      Onze Minister kan indien voorafgaand aan, bij of na een besluit tot verstrekking, wijziging, schorsing of
      intrekking van een vergunning blijkt dat door verschillende EER-lidstaten onderling afwijkende besluiten zijn of
      worden genomen, deze aangelegenheid aan het Comité voorleggen om de communautaire procedure van de artikelen 34,
      eerste lid, 36 tot en met 38 van [Richtlijn 2001/82/EG](32001L0082) te volgen.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.23
  - number: 2.24.1
    text: |-
      Onze Minister volgt de communautaire procedure van de artikelen 35, eerste lid, 36 tot en met 38 van [Richtlijn
      2001/82/EG](32001L0082), indien in een bijzonder geval de belangen van de Europese Unie in het geding zijn en
      het besluit noodzakelijk lijkt in het bijzonder om rekening te houden met de gegevens die zijn verzameld bij de
      geneesmiddelenbewaking, bedoeld in titel VII, van [Richtlijn 2001/82/EG](32001L0082).
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.24
  - number: 2.24.2
    text: |-
      Bij de uitvoering van het eerste lid verstrekt Onze Minister aan het Comité alle beschikbare gegevens die met de
      betrokken procedure verband houden.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.24
  - number: 2.24.3
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op een houder van een vergunning voor het in de handel
      brengen van een diergeneesmiddel.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.24
  - number: 2.25.1
    text: |-
      Onze Minister legt een voorgenomen besluit tot wijziging, schorsing of intrekking van een vergunning die met
      toepassing van een communautaire procedure als bedoeld in de [artikelen 2.4, tweede lid][ref1], [2.23][ref2]
      of [2.24][ref3] is verstrekt of een voorgenomen wijziging van de aan die vergunning verbonden voorschriften,
      onverwijld voor aan het Bureau, indien dat besluit strekt tot bescherming van de gezondheid van mens of dier of
      bescherming van het milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.25
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 2.25.2
    text: |-
      Onze Minister kan in uitzonderlijke gevallen besluiten een vergunning, die met toepassing van de
      [artikelen 2.4, tweede lid][ref1], [2.23][ref2] of [2.24][ref3] is verstrekt, te schorsen, indien het voor de
      bescherming van de gezondheid van mens of dier of de bescherming van het milieu beslist noodzakelijk is dringende
      maatregelen te nemen. Onze Minister geeft de Europese Commissie en de andere EER-lidstaten uiterlijk op de volgende
      werkdag een motivering van het besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.25
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 2.25.3
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op vergunningen voor het in de handel brengen van een
      diergeneesmiddel, die vóór 1 januari 1995 verstrekt zijn en waarover het Comité, bedoeld in artikel 34, eerste lid,
      van [Richtlijn 2001/82/EG](32001L0082) een advies heeft uitgebracht.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.25
  - number: 2.26.1
    text: |-
      De vergunning, bedoeld in [artikel 2.12, eerste lid][ref1], wordt met uitzondering van de documenten, bedoeld in
      artikel 2.12, eerste lid, onderdeel b, bekendgemaakt in de Staatscourant en medegedeeld aan de aanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.26
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.26.2
    text: |-
      In afwijking van het eerste lid wordt het beoordelingsrapport, bedoeld in
      [artikel 2.12, eerste lid, onderdeel c][ref1], slechts bekendgemaakt met weglating van vertrouwelijke commerciële
      informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.26
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.26.3
    text: |-
      Onze Minister draagt zorg voor een register als bedoeld in [artikel 7.2, eerste lid, van de wet][ref1] waarin
      aantekening wordt gehouden van iedere vergunning en een besluit tot verlenging, wijziging, schorsing of intrekking
      daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel2.26
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7'
  - number: 3.1.1
    text: |-
      [Hoofdstuk 2][ref1] is van toepassing op een aanvraag als bedoeld in dit hoofdstuk, voor zover in de
      [paragrafen 2 tot en met 5][ref2] van dit hoofdstuk geen andersluidende bepalingen zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0032386
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0032386
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.1.2
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot een vergunning als bedoeld in het
      eerste lid in verband met de specifieke kenmerken van het diergeneesmiddel en de aard van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.1
  - number: 3.2.1
    text: |-
      De [artikelen 2.1, tweede lid][ref1], [2.2][ref2], [2.6][ref3],
      [2.9, eerste lid, onderdeel a en onderdelen c tot en met h][ref4], [2.13][ref5], [2.14][ref6],
      [2.18 tot en met 2.21, eerste en tweede lid][ref7], [2.23][ref8] en [2.26][ref9] zijn van overeenkomstige
      toepassing op een aanvraag tot ontheffing als bedoeld in [paragraaf 5][ref10] van dit hoofdstuk voor zover in die
      paragraaf geen andersluidende bepalingen zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref6]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref7]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref8]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref9]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref10]: https://wetten.overheid.nl/BWBR0032386#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref6
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref7
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref8
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref9
        bwb_id: BWBR0032386
        artikel: '2'
