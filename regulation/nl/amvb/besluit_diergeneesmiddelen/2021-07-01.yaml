  - number: 4.14.2
    text: 'Onverminderd het eerste lid kan Onze Minister een besluit tot intrekking nemen, indien:'
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.14
  - number: 4.14.2.a
    text: |-
      na een schriftelijke waarschuwing, voorschriften als bedoeld in [artikelen 4.8, onder a][ref1], niet worden
      nageleefd, of


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.14
    references:
      - id: ref1
