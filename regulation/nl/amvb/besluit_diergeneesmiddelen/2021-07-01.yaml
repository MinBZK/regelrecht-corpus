        paragraaf: '4'
  - number: 4.15.1
    text: |-
      De vergunning, bedoeld in [artikel 4.7][ref1], vervalt van rechtswege met betrekking tot een diergeneesmiddel
      dat is opgenomen in een lijst als bedoeld in [artikel 4.2, eerste lid, onderdeel a][ref2], indien de
      vergunning, bedoeld in [artikel 2.1, eerste lid][ref3], voor dat diergeneesmiddel is vervallen en, indien
      het diergeneesmiddel bestemd is voor uitvoer, door het derde land geen instemming met invoer als bedoeld in
      [artikel 4.6, onderdeel a][ref4], is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.15
    references:
      - id: ref1
