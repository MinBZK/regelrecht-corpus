        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 4.15.2
    text: |-
      Onze Minister kan in uitzonderlijke omstandigheden of om redenen van gezondheid van mens of dier het vervallen van
      de vergunning, bedoeld in het eerste lid, met een nader te bepalen termijn uitstellen.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.15
  - number: 4.16.1
    text: |-
      Een besluit tot verstrekking, wijziging of intrekking van een vergunning als bedoeld in [artikel 4.7][ref1] wordt
      bekendgemaakt in de Staatscourant en medegedeeld aan de aanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 4.16.2
    text: |-
      Onze Minister zendt na de bekendmaking, bedoeld in het eerste lid, aan het Bureau een kopie van de vergunning of
      hanteert daartoe een andere door de Europese Commissie aangewezen wijze van mededelen.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.16
  - number: 4.16.3
    text: |-
      Onze Minister draagt zorg voor een register als bedoeld in [artikel 7.2, eerste lid, van de wet][ref1] waarin
      aantekening wordt gehouden van iedere vergunning en een besluit tot verlenging, wijziging, schorsing of intrekking
      daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7'
  - number: 4.17.1
    text: |-
      Onze Minister draagt zorg voor een register als bedoeld in [artikel 7.2, eerste lid, van de wet][ref1]
      waarin aantekening wordt gehouden van iedere fabrikant en verdeler die over een substantie als bedoeld in
      [artikel 4.1, eerste lid, onderdeel b][ref2], met anabole, anti-infectieuze, anti-parasitaire, anti-inflammatoire,
      hormonale of psychotrope eigenschappen, waaronder diergeneesmiddelen, mag beschikken.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.17
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.17.2
    text: |-
      De verstrekking, wijziging of intrekking van een vergunning voor vervaardiging van een diergeneesmiddel of een
      vergunning voor het bezit van een substantie als bedoeld in [artikel 4.1, eerste lid, onderdeel b][ref1], of een
      melding als bedoeld in artikel 4.1, tweede lid, wordt vermeld in het register.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.17
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.18.1
    text: |-
      Het verbod, bedoeld in [artikel 2.19, eerste lid, van de wet][ref1] om zonder vergunning een diergeneesmiddel
      te bereiden is niet van toepassing in de gevallen waarin Onze Minister bij ministeriële regeling personen of
      instanties aanwijst die het onder bij die regeling te stellen voorwaarden is toegestaan een diergeneesmiddel in
      kleine hoeveelheden te vervaardigen, indien dat diergeneesmiddel:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.18
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 4.18.1.a
    text: wordt bereid, verdeeld of veranderd met het oog op de verpakking of de aanbiedingsvorm;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.18
  - number: 4.18.1.b
    text: ex tempore wordt bereid, of
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.18
  - number: 4.18.1.c
    text: |-
      bereid wordt met behulp van pathogene organismen en antigenen afkomstig van een of meer dieren van een houderij met
      het oog op toepassing bij dieren van diezelfde houderij.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.18
  - number: 4.18.2
    text: |-
      Bij de in het eerste lid bedoelde ministeriële regeling kunnen [artikel 4.8, onderdelen a, b, d, e, g en h][ref1],
      en [artikel 4.9, tweede lid][ref2], alsmede krachtens artikel 4.9, eerste lid, gestelde regels geheel of
      gedeeltelijk van overeenkomstige toepassing worden verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.18
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '4.19'
    text: |-
      Het verbod, bedoeld in [artikel 2.19, eerste lid, van de wet][ref1], om een diergeneesmiddel of substantie als
      bedoeld in [artikel 4.1][ref2] uit een EER-lidstaat zonder vergunning in te voeren is niet van toepassing in het
      geval de betrokken EER-lidstaat een vergunning voor vervaardiging of invoer overeenkomstig [Richtlijn 2001/82/EG]
      (32001L0082) heeft verstrekt en:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.19
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.19.a
    text: |-
      een vergunning als bedoeld in [artikel 2.1, eerste lid][ref1], is verstrekt, of


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.19
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 4.19.b
    text: |-
      het diergeneesmiddel of de substantie met toepassing van [artikel 4.22, onderdeel b][ref1], wordt uitgevoerd naar
      een land buiten de Europese Economische Ruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.19
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '7'
  - number: 4.20.1
    text: |-
      Degene die diergeneesmiddelen invoert waarvoor een vergunning voor vervaardiging of invoer als bedoeld in
      [artikel 4.19, eerste lid, aanhef][ref1], is verleend en die niet tevens houder is van een vergunning als bedoeld
      in [artikel 2.1, eerste lid][ref2], meldt een voornemen tot invoer van een diergeneesmiddel of substantie als
      bedoeld in [artikel 4.1, eerste lid][ref3], aan de houder van de vergunning, bedoeld in artikel 2.1, eerste lid,
      van dat diergeneesmiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.20.2
    text: |-
      Degene die diergeneesmiddelen invoert als bedoeld in het eerste lid, die een diergeneesmiddel of substantie invoert
      waarvoor geen vergunning voor het in handel brengen als bedoeld in artikel 38, eerste lid, van Verordening (EG)
      nr. 726/2004 is verstrekt, meldt dit aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.20
  - number: 4.20.3
    text: |-
      Diergeneesmiddelen als bedoeld in het eerste lid die worden ingevoerd uit een andere EER-lidstaat worden niet op
      kwaliteit gecontroleerd, indien degene die de diergeneesmiddelen invoert deze doet vergezellen van daartoe door een
      persoon als bedoeld in [artikel 4.2, eerste lid, onderdeel f][ref1], ondertekende controleverslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.20.4
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld voor toezicht en controle als bedoeld in
      [artikel 10.2 van de wet][ref1] inzake controle bij invoer vanuit EER-lidstaten.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel10
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '10'
  - number: 4.21.1
    text: |-
      Voor de aanvraag van een vergunning voor invoer van een diergeneesmiddel of een substantie als bedoeld in
      [artikel 4.1][ref1] uit andere landen dan EER-lidstaten of een aanvraag tot verlenging, wijziging of intrekking van
      een vergunning voor invoer is hoofdstuk 4, [paragrafen 1 tot en met 6][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032386
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.21.2
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld voor toezicht en controle als bedoeld in
      [artikel 10.2 van de wet][ref1] inzake de kwaliteit van diergeneesmiddelen die uit andere landen dan EER-lidstaten
      op Nederlands grondgebied worden binnengebracht, waaronder het verstrekken van documenten en het doen vergezellen
      van de diergeneesmiddelen of substanties van een kopie van de vergunning voor vervaardiging of overeenkomstige
      documenten uit het land waar de vervaardiging heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel10
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '10'
  - number: 4.21.3
    text: |-
      Onze Minister kan een vergunning voor invoer verlengen, wijzigen, schorsen of intrekken met overeenkomstige
      toepassing van de [artikelen 4.12][ref1], [4.13][ref2] en [4.14][ref3]. [Artikel 4.15][ref4] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
  - number: '4.22'
    text: |-
      Degene die een diergeneesmiddel of een substantie als bedoeld in [artikel 4.1][ref1] uitvoert, beschikt over:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.22
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.22.a
    text: |-
      een door Onze Minister verstrekte vergunning voor vervaardiging of bezit van dat diergeneesmiddel als bedoeld in
      [artikel 4.1, eerste lid][ref1], of voor invoer als bedoeld in [artikel 4.21][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.22
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '7'
  - number: 4.22.b
    text: |-
      een door een andere EER-lidstaat overeenkomstig artikel 44, eerste of derde lid, van [Richtlijn 2001/82/EG]
      (32001L0082), verstrekte vergunning voor vervaardiging, respectievelijk invoer van dat diergeneesmiddel.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.22
  - number: '4.23'
    text: |-
      Onze Minister verstrekt op aanvraag van een fabrikant of exporteur van een diergeneesmiddel of substantie als
      bedoeld in [artikel 4.1, eerste lid][ref1], of op verzoek van autoriteiten van een niet-EER-lidstaat volgens regels
      die Onze Minister voor uitvoering van artikel 93 van [Richtlijn 2001/82/EG](32001L0082) bij ministeriële regeling
      stelt, een certificaat waaruit blijkt dat een vergunning voor vervaardiging als bedoeld in artikel 4.1, eerste lid,
      is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.23
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '4.24'
    text: |-
      Bij een krachtens hoofdstuk 3, paragraaf 6, verleende vrijstelling of ontheffing kan tevens worden voorzien in een
      vrijstelling of ontheffing van krachtens dit hoofdstuk geldende bepalingen.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.24
  - number: 5.1.1
    text: |-
      Een aanvraag van een vergunning voor groothandel in diergeneesmiddelen met betrekking tot het bezit van, handel in
      en verstrekking van diergeneesmiddelen als bedoeld in [artikel 2.19, eerste lid, van de wet][ref1] wordt ingediend
      bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 5.1.2
    text: Het eerste lid is tevens van toepassing op een aanvraag van een vergunning voor kleinhandel.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.1
  - number: 5.1.3
    text: |-
      In afwijking van het tweede lid kunnen bij ministeriële regeling gevallen worden aangewezen, waarbij wordt volstaan
      met een melding, onder bij die ministeriële regeling gestelde voorschriften, voor diergeneesmiddelen die worden
      toegepast bij gezelschapsdieren, waaronder diersoorten als bedoeld in [artikel 3.19][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel3
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 5.1.4
    text: |-
      De [artikelen 4.3][ref1], [4.4][ref2], [4.5][ref3] en [4.10][ref4] zijn van overeenkomstige toepassing op een
      aanvraag als bedoeld in het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 5.2.1
    text: |-
      Een aanvraag als bedoeld in [artikel 5.1][ref1] gaat vergezeld van documenten waarin informatie wordt verstrekt
      over de wijze waarop de aanvrager zal voldoen aan regels die bij ministeriële regeling worden gesteld met
      betrekking tot onder meer de volgende onderwerpen:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel5
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 5.2.1.a
    text: de scholing van het personeel;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.2
  - number: 5.2.1.b
    text: de geschiktheid van de lokalen en installaties;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.2
  - number: 5.2.1.c
    text: de bewaring van diergeneesmiddelen;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.2
  - number: 5.2.1.d
    text: de behandeling van diergeneesmiddelen;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.2
  - number: 5.2.1.e
    text: het door een groothandel uit te voeren noodplan voor het uit de handel nemen van een diergeneesmiddel;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.2
  - number: 5.2.1.f
    text: de door een kleinhandel te nemen maatregelen voor het uit de handel nemen van een diergeneesmiddel.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.2
  - number: 5.2.2
    text: |-
      Bij ministeriële regeling kunnen in het belang van de diergezondheid, dierenwelzijn, volksgezondheid of het milieu
      regels worden gesteld die de houder van de vergunning in acht neemt bij het uitoefenen van de vergunning, waaronder
      regels die betrekking hebben op de in het eerste lid, onder a tot en met f, bedoelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.2
  - number: 5.2.3
    text: |-
      Een houder van een vergunning als bedoeld in [artikel 5.1][ref1] voert een administratie die voldoet aan eisen die
      bij ministeriële regeling worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel5
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 5.3.1
    text: |-
      Een apotheker die belast is met de leiding van een apotheek en is ingeschreven in het door de
      Inspectie gezondheidszorg en jeugd ingestelde register van gevestigde apothekers, bedoeld in
      [artikel 61, vijfde lid, van de Geneesmiddelenwet][ref1], heeft van rechtswege een vergunning voor kleinhandel als
      bedoeld in [artikel 5.1, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel5
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '61'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 5.3.2
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het ter hand stellen van
      diergeneesmiddelen door een apotheker.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.3
  - number: 5.4.1
    text: |-
      Een dierenarts heeft van rechtswege een vergunning voor kleinhandel voor het afleveren van diergeneesmiddelen aan
      houders van dieren voor die dieren waarvoor de dierenarts in de uitoefening van zijn beroep de medische zorg op
      zich heeft genomen.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.4
  - number: 5.4.2
    text: |-
      Een dierenarts die in een andere EER-lidstaat gevestigd is, is bevoegd voor toepassing bij dieren in de
      uitoefening van zijn beroep in Nederland diergeneesmiddelen te bezitten waarvoor geen vergunning als bedoeld in
      [artikel 2.12, eerste lid][ref1] van dit besluit is verstrekt, onder voorwaarden die bij ministeriële regeling
      worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 5.4.3
    text: |-
      In afwijking van het eerste lid is het een dierenarts toegestaan om het afleveren van een diergeneesmiddel door
      een andere persoon uit te laten voeren voor zover dit in overeenstemming is met de zorgplichten, bedoeld in
      [artikel 4.2 van de wet][ref1] en regels die bij ministeriële regeling met betrekking tot het afleveren door een
      andere persoon kunnen worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '4'
  - number: 5.4.4
    text: |-
      In afwijking van het eerste lid beschikken personen als bedoeld in [artikel 4.1, eerste lid][ref1], in samenhang
      met [artikel 4.3, eerste lid, van de wet][ref2] van rechtswege over een vergunning als bedoeld in het eerste lid,
      in gevallen die bij ministeriële regeling kunnen worden aangewezen, doch uitsluitend:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '4'
  - number: 5.4.4.1°
    text: |-
      indien het een persoon betreft, aan wie het volgens [artikel 5.8, eerste lid, onderdeel c][ref1], toegestaan is een
      diergeneesmiddel toe te passen, en


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel5
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.4.4.2°
    text: |-
      met in achtneming van de bij of krachtens de [wet][ref1] gestelde regels met betrekking tot onder meer de
      bekwaamheid van deze personen.


      [ref1]: https://wetten.overheid.nl/BWBR0030250
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0030250
  - number: 5.5.1
    text: |-
      Vergunningen als bedoeld in [artikelen 5.1][ref1], [5.3, eerste lid][ref2], en [5.4, eerste en vierde lid][ref3],
      kunnen op aanvraag of ambtshalve door Onze Minister worden gewijzigd of ingetrokken, indien niet wordt voldaan aan
      bij of krachtens de [artikelen 5.2][ref4], 5.3, of 5.4 gestelde regels of bij de vergunning gestelde voorschriften
      of beperkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0032386#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0032386#Artikel5
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0032386
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0032386
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 5.5.2
    text: 'De vergunning voor kleinhandel kan eveneens worden ingetrokken indien:'
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.5
  - number: 5.5.2.a
    text: |-
      met het diergeneesmiddel niet wordt omgegaan in overeenstemming met de informatie die krachtens wettelijk
      voorschrift of Verordening (EG) nr. 726/2004 is aangebracht op de verpakking van een diergeneesmiddel of diervoeder
      met medicinale werking of bij deze verpakking is gevoegd niet, of
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.5
  - number: 5.5.2.b
    text: |-
      niet in overeenstemming met de [artikelen 5.1][ref1] en [5.2 van het Besluit diergeneeskundigen][ref2] wordt
      gehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0035091#Artikel5
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0035091
        artikel: '5'
  - number: 5.6.1
    text: |-
      Een besluit tot verstrekking, wijziging of intrekking van een vergunning voor groothandel of een vergunning voor
      kleinhandel wordt bekendgemaakt in de Staatscourant en medegedeeld aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.6
  - number: 5.6.2
    text: |-
      Onze Minister draagt zorg voor een register als bedoeld in [artikel 7.2, eerste lid, van de wet][ref1] waarin
      aantekening wordt gehouden van iedere vergunning en een besluit tot verlenging, wijziging, schorsing of intrekking
      daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7'
  - number: 5.6.3
    text: |-
      De verstrekking, wijziging of intrekking van een vergunning voor groothandel met betrekking tot een
      diergeneesmiddel dat een substantie bevat met anabole, anti-infectieuze, anti-parasitaire, anti-inflammatoire,
      hormonale of psychotrope eigenschappen wordt vermeld in het register, bedoeld in [artikel 4.17][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '6'
  - number: 5.7.1
    text: 'Een houder van een vergunning voor groothandel levert een diergeneesmiddel slechts af aan:'
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.7
  - number: 5.7.1.a
    text: een houder van een vergunning voor vervaardiging;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.7
  - number: 5.7.1.b
    text: een houder van een vergunning voor invoer;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.7
  - number: 5.7.1.c
    text: een houder van een vergunning voor groothandel, of
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.7
  - number: 5.7.1.d
    text: een houder van een vergunning voor kleinhandel.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.7
  - number: 5.7.2
    text: |-
      Een houder van een vergunning voor kleinhandel kan, onverminderd [artikel 5.8][ref1], een diergeneesmiddel
      retourneren naar een houder van een vergunning als bedoeld in het eerste lid, onderdelen a tot en met c, of in
      kleine hoeveelheden afleveren aan een andere houder van een vergunning voor kleinhandel met toepassing van regels
      die bij ministeriële regeling worden gesteld voor de af te leveren hoeveelheden en soorten diergeneesmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel5
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.7.3
    text: |-
      Indien Onze Minister voornemens is een voordracht te doen tot vaststelling, wijziging, of intrekking van een
      algemene maatregel van bestuur als bedoeld in [artikel 2.21, vierde of vijfde lid, van de wet][ref1] inzake
      algemeen verbindend verklaring kan hij, indien een onmiddellijke voorziening vereist is, regelen stellen
      overeenkomstig de voorgenomen maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 5.7.4
    text: |-
      Een regeling als bedoeld in het derde lid blijft, behoudens eerdere intrekking, van kracht totdat de in dat lid
      bedoelde algemene maatregel van bestuur in werking treedt, doch uiterlijk tot twaalf maanden na het in werking
      treden van de regeling.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.7
  - number: '5.8'
    text: 'Bij ministeriële regeling wordt geregeld:'
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.8
  - number: 5.8.a
    text: in welke gevallen een diergeneesmiddel uitsluitend wordt afgeleverd na te zijn voorgeschreven;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.8
  - number: 5.8.b
    text: |-
      welke informatie een dierenarts of een andere persoon als bedoeld in [artikel 4.1, eerste lid, van de wet][ref1] op
      een recept vermeldt en op welke wijze het recept kan worden verstrekt;


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '4'
  - number: 5.8.c
    text: |-
      in welke gevallen bezit, controle of toepassing van een diergeneesmiddel wordt beperkt tot dierenartsen of andere
      personen als bedoeld in [artikel 4.1, eerste lid, van de wet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '4'
  - number: 5.8.d
    text: |-
      welke andere voorzieningen nodig zijn om te waarborgen dat de hoeveelheid die wordt voorgeschreven, afgeleverd of
      bereid, beperkt blijft tot hetgeen noodzakelijk is voor de beoogde behandeling of therapie.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.8
  - number: '5.9'
    text: |-
      Het verbod op het aanprijzen van diergeneesmiddelen, bedoeld in [artikel 2.19, eerste lid, van de wet][ref1]
      zonder vergunning is niet van toepassing op diergeneesmiddelen waarvoor een vergunning als bedoeld in
      [artikel 2.1, eerste lid][ref2], is verstrekt, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 5.9.a
    text: 'diergeneesmiddelen worden aangeprezen, die:'
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.9
  - number: 5.9.a.1°
    text: |-
      niet uitsluitend op recept verkrijgbaar zijn krachtens [artikel 5.8, eerste lid, onderdeel a][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel5
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.9.a.2°
    text: |-
      geen psychotrope of verdovende substanties bevatten, zoals die welke onder de verdragen van de Verenigde Naties van
      1961 en 1971 vallen, of
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.9
  - number: 5.9.b
    text: de aanprijzing, gezien de inhoud en de wijze waarop zij wordt geuit, kennelijk niet voor het publiek is bestemd.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.9
  - number: '5.10'
    text: |-
      Bij een krachtens hoofdstuk 3, paragraaf 6, verleende vrijstelling of ontheffing kan tevens worden voorzien
      in een vrijstelling of ontheffing van krachtens dit hoofdstuk geldende bepalingen, met uitzondering van
      [artikel 5.9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel5
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel5.10
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 6.1.1
    text: 'Onze Minister registreert informatie over:'
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel6.1
  - number: 6.1.1.a
    text: |-
      bijwerkingen, waaronder vermoedelijke bijwerkingen, onverwachte bijwerkingen en ernstige bijwerkingen, afkomstig
      van een houder van een vergunning als bedoeld in [artikel 6.1][ref1] of een dierenarts of andere persoon als
      bedoeld in [artikel 4.1, eerste lid, van de wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '4'
  - number: 6.1.1.b
    text: een lagere werkzaamheid;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel6.1
  - number: 6.1.1.c
    text: afwijkende toepassing;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel6.1
  - number: 6.1.1.d
    text: onderzoek naar de juistheid van de wachttermijn;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel6.1
  - number: 6.1.1.e
    text: potentiële milieuproblemen, en
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel6.1
  - number: 6.1.1.f
    text: |-
      informatie als bedoeld in [artikel 2.13, onderdeel f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 6.1.2
    text: |-
      Onze Minister zendt de informatie, bedoeld in het eerste lid, naar de bevoegde instanties van de EER-lidstaten en
      het Bureau.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel6.1
  - number: 6.2.1
    text: |-
      Een houder van de vergunning, bedoeld in [artikel 2.1, eerste lid][ref1], meldt een bijwerking, met in achtneming
      van de krachtens [artikel 2.13, onderdelen b en j][ref2], gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 6.2.2
    text: |-
      Onze Minister kan bij ministeriële regeling regelen in welke gevallen, binnen welke termijn en aan welke instanties
      of personen een dierenarts of een andere persoon als bedoeld in [artikel 4.1, eerste lid, van de wet][ref1] een
      bijwerking meldt.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '4'
  - number: 6.3.1
    text: |-
      De houder van de vergunning, bedoeld in [artikel 2.1, eerste lid][ref1] verstrekt informatie, bedoeld in
      [artikel 6.1, eerste lid][ref2], over zorgwekkende vraagstukken, waaronder alle bijwerkingen, die verband houden
      met de diergeneesmiddelenbewaking niet aan het publiek voordat Onze Minister deze informatie heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel6
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.3.2
    text: |-
      Onze Minister draagt er zorg voor dat de informatie, bedoeld in het eerste lid, permanent toegankelijk is en
      onverwijld door het publiek kan worden geraadpleegd.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel6.3
  - number: 6.3.3
    text: |-
      Een houder van de vergunning, bedoeld in [artikel 2.12, eerste lid][ref1], presenteert informatie als bedoeld in
      het eerste lid op een objectieve wijze en niet misleidend.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 6.3.4
    text: |-
      Bij de toepassing van het derde lid en [artikel 6.2, eerste lid][ref1], hanteert de houder van de
      vergunning, bedoeld in [artikel 2.12, eerste lid][ref2], op internationaal niveau aanvaarde terminologie voor
      diergeneesmiddelen overeenkomstig door de Europese Commissie vastgestelde richtsnoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '6.4'
    text: |-
      Dit hoofdstuk is van overeenkomstige toepassing op een krachtens hoofdstuk 3, paragraaf 6, verleende vrijstelling
      of ontheffing met uitzondering van een vrijstelling of ontheffing als bedoeld in de [artikelen 3.22][ref1] en
      [3.23][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel3
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '7.1'
    text: |-
      Het is verboden een handeling te verrichten die ertoe strekt een diervoeder met medicinale werking te bereiden,
      te bewerken, te verwerken, te verpakken, te etiketteren, in of buiten Nederland te brengen, aan te bieden of af
      te leveren:
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.1
  - number: 7.1.a
    text: zonder een krachtens dit hoofdstuk daartoe verstrekte vergunning voor vervaardiging of invoer;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.1
  - number: 7.1.b
    text: in strijd met een krachtens dit hoofdstuk aan een vergunning gestelde beperking, en
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.1
  - number: 7.1.c
    text: in strijd met bij of krachtens dit hoofdstuk gestelde regels.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.1
  - number: 7.2.1
    text: |-
      De houder van een vergunning voor vervaardiging als bedoeld in [artikel 7.1, onderdeel a][ref1], maakt gebruik van
      een voormengsel voor een diervoeder met medicinale werking waarvoor:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel7
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.2.1.a
    text: |-
      een vergunning voor het in de handel brengen van een diergeneesmiddel als bedoeld in de
      [artikelen 2.1, derde lid][ref1], of [2.12, eerste lid][ref2], is verstrekt, of een vrijstelling of ontheffing als
      bedoeld in hoofdstuk 3, paragraaf 6, is verleend, en


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 7.2.1.b
    text: |-
      een vergunning voor vervaardiging van een diergeneesmiddel als bedoeld in [artikel 4.7][ref1] of een vergunning
      voor invoer van een diergeneesmiddel als bedoeld in [artikel 4.21][ref2] is verstrekt dan wel een melding als
      bedoeld in [artikel 4.20][ref3] is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '7'
      - id: ref3
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '7'
  - number: 7.2.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing bij invoer door een houder van een vergunning voor invoer van een
      diervoeder met medicinale werking.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.2
  - number: 7.3.1
    text: |-
      De houder van een vergunning voor vervaardiging als bedoeld in [artikel 7.1, onderdeel a][ref1], maakt
      bij de bereiding van een diervoeder met medicinale werking gebruik van diervoeders, die voldoen aan
      het bij of krachtens de [artikelen 2.17][ref2] en [2.18][ref3] of [artikel 6.4][ref4] in samenhang met
      [artikel 2.18, tweede lid, van de wet][ref5] met betrekking tot diervoeders bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0032386#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0032386
        artikel: '6'
        hoofdstuk: '6'
      - id: ref5
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 7.3.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing bij invoer door een houder van een vergunning voor invoer van een
      diervoeder met medicinale werking.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.3
  - number: 7.4.1
    text: |-
      De houder van een vergunning voor vervaardiging als bedoeld in [artikel 7.1, onderdeel a][ref1], bereidt een
      diervoeder met medicinale werking uit niet meer dan één voormengsel voor een diervoeder met medicinale werking.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel7
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing bij invoer door een houder van een vergunning voor invoer van een
      diervoeder met medicinale werking.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.4
  - number: 7.5.1
    text: |-
      Een houder van een vergunning als bedoeld in [artikel 7.1, onderdeel a][ref1], heeft van rechtswege een vergunning
      voor kleinhandel als bedoeld in [artikel 5.1, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel5
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 7.5.2
    text: |-
      Het bij en krachtens de [artikelen 5.2, tweede tot en met vierde lid][ref1], [5.5 tot en met 5.10][ref2] bepaalde
      is van overeenkomstige toepassing op voormengsels voor diervoeder met medicinale werking en diervoeders met
      medicinale werking.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel5
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 7.6.1
    text: |-
      De houder van een vergunning voor vervaardiging als bedoeld in [artikel 7.1, onderdeel a][ref1], draagt er zorg
      voor dat:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel7
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.6.1.a
    text: 'een diervoeder met medicinale werking wordt bereid:'
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.6
  - number: 7.6.1.a.1°
    text: |-
      in bedrijfsruimtes en met technische installaties die voldoen aan regels die hieraan bij ministeriële regeling
      worden gesteld en die door een krachtens [artikel 10.2 van de wet][ref1] aangewezen toezichthouder vooraf zijn
      gecontroleerd;


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel10
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '10'
  - number: 7.6.1.a.2°
    text: in een eenheid met voldoende geschikte opslag- en controlemogelijkheden;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.6
  - number: 7.6.1.a.3°
    text: in een eenheid waar voldoende personeel met kennis en kwalificatie inzake mengtechnieken aanwezig is;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.6
  - number: 7.6.1.b
    text: het gebruikte diervoeder en het voormengsel tot een homogeen en stabiel product worden vermengd;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.6
  - number: 7.6.1.c
    text: ongewenste wisselwerking tussen diergeneesmiddelen en diervoeders uitgesloten is;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.6
  - number: 7.6.1.d
    text: het diervoeder met medicinale werking gedurende het voorgeschreven tijdvak houdbaar is;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.6
  - number: 7.6.1.e
    text: |-
      voor de bereiding van het diervoeder met medicinale werking gebruikte diervoerder niet dezelfde antibiotica of
      dezelfde coccidiostatica bevat als die welke in het voormengsel als werkzame stof is gebruikt;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.6
  - number: 7.6.1.f
    text: |-
      de krachtens [artikel 2.19, derde lid, onderdeel a, van de wet][ref1], voorgeschreven dagelijkse dosis van werkzame
      stoffen is opgenomen in een hoeveelheid voeder die ten minste de helft van het dagrantsoen van de behandelde dieren
      beslaat en, bij herkauwers, ten minste de helft van de dagelijkse behoefte aan niet-mineraal aanvullend voeder;


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 7.6.1.g
    text: |-
      de regels die bij ministeriële regeling worden gesteld inzake administratie van handelingen met voormengsels voor
      diervoeder met medicinale werking en diervoeders met medicinale werking worden nageleefd;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.6
  - number: 7.6.1.h
    text: |-
      de regels die bij ministeriële regeling worden gesteld inzake de opslag en bewaring van voormengsels voor
      diervoeder met medicinale werking en diervoeders met medicinale werking worden nageleefd;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.6
  - number: 7.6.1.i
    text: |-
      de regels die bij ministeriële regeling worden gesteld inzake verpakking, verzegeling, etikettering of andere
      op, bij of in de verpakking in overeenstemming met EU-rechtshandelingen aan te brengen informatie, vervoer en
      aflevering worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.6
  - number: 7.6.2
    text: Het eerste lid is van overeenkomstige toepassing bij invoer van een diervoeder met medicinale werking.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.6
  - number: 7.8.1
    text: |-
      Een aanvraag om een vergunning voor vervaardiging als bedoeld in [artikel 7.1, onderdeel a][ref1], wordt ingediend
      bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel7
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.8.2
    text: Bij ministeriële regeling worden regels gesteld omtrent de bij de aanvraag te overleggen documenten.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.8
  - number: 7.8.3
    text: |-
      De artikelen [4.3 tot en met 4.15][ref1], [4.16, eerste en derde lid][ref2], en [4.17][ref3] zijn van
      overeenkomstige toepassing met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '6'
  - number: 7.8.3.a
    text: |-
      in aanvulling op [artikel 4.6][ref1] een vergunning wordt geweigerd indien niet wordt voldaan aan het gestelde bij
      en krachtens de [artikelen 7.2 tot en met 7.6][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel7
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.8.3.b
    text: |-
      in aanvulling op de [artikelen 4.13][ref1] en [4.14][ref2] Onze minister een besluit tot schorsing of intrekking
      kan nemen indien niet wordt voldaan aan het gestelde bij en krachtens de [artikelen 7.2 tot en met 7.6][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0032386#Artikel7
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0032386
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.8.3.c
    text: |-
      daar waar verwezen wordt naar één of meerdere documenten als bedoeld in [artikel 4.2][ref1] moet worden gelezen de
      documenten, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 7.9.1
    text: |-
      Een aanvraag om een vergunning voor invoer als bedoeld in [artikel 7.1, onderdeel a][ref1], wordt ingediend bij
      Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel7
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.9
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.9.2
    text: |-
      De artikelen [7.8, tweede en derde lid][ref1], [4.19][ref2] en [4.21][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.9
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '7'
      - id: ref3
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '7'
  - number: 7.9.3
    text: |-
      In afwijking van [artikel 7.1][ref1] kan degene die een diervoeder met medicinale werking invoert, volstaan met een
      melding bij Onze Minister, indien het diervoeder:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel7
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.9
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.9.3.a
    text: |-
      bereid is uit een voormengsel voor diervoeder met medicinale werking waarvoor een EER-lidstaat een vergunning in
      overeenstemming met [Richtlijn 2001/82/EG](32001L0082) heeft verstrekt;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.9
  - number: 7.9.3.b
    text: |-
      dezelfde werkzame stoffen bevat als een voormengsel met medicinale werking waarvoor een vergunning als bedoeld in
      [artikel 2.1, derde lid][ref1], of [artikel 2.12, eerste lid][ref2], is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.9
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 7.9.3.c
    text: een soortgelijke kwalitatieve en kwantitatieve samenstelling als dat voormengsel bevat, en
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.9
  - number: 7.9.3.d
    text: |-
      de zending vergezeld gaat van een volledig ingevulde verklaring als bedoeld in artikel 10, derde lid, van
      [Richtlijn 90/167/EEG](31990L0167), die is afgegeven door de bevoegde instantie van de EER-lidstaat waaruit het
      diervoeder met medicinale werking afkomstig is.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.9
  - number: 7.10.1
    text: |-
      [Artikel 4.22][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.10
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '7'
  - number: 7.10.2
    text: |-
      Onze Minister verstrekt op aanvraag van een fabrikant of exporteur van een diervoeder met medicinale werking
      volgens regels die Onze Minister voor uitvoering van artikel 10, derde lid, van Richtlijn 90/167/EEG bij
      ministeriële regeling stelt, een verklaring als bedoeld in artikel 10, derde lid, in samenhang met bijlage B, van
      Richtlijn 90/167/EEG.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.10
  - number: '7.11'
    text: |-
      Onze Minister kan voor wetenschappelijke doeleinden ontheffing verlenen van het verbod, bedoeld in
      [artikel 2.19, eerste lid, van de wet][ref1] en van het verbod in [artikel 7.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel7
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7.11
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7A.1.1
    text: |-
      Degene die verantwoordelijk is voor een laboratorium, voorziening of andere ruimte waar zich een bij ministeriële
      regeling aangewezen ziekteverwekker bevindt, meldt dit bij Onze Minister, indien de ziekteverwekker:
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7A.1
  - number: 7A.1.1.a
    text: |-
      voor een periode van ten minste 30 aaneengesloten dagen in het laboratorium, de voorziening of de ruimte aanwezig
      is; of
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7A.1
  - number: 7A.1.1.b
    text: aldaar wordt gekweekt.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7A.1
  - number: 7A.1.2
    text: |-
      Indien de ziekteverwekker, bedoeld in het eerste lid, zich niet meer bevindt in het laboratorium, voorziening of
      ruimte doet degene die verantwoordelijk is, bedoeld in het eerste lid, hiervan melding bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7A.1
  - number: 7A.1.3
    text: |-
      De meldingen, bedoeld in het eerste en tweede lid, geschieden met gebruikmaking van een middel dat daartoe door
      Onze Minister beschikbaar is gesteld.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7A.1
  - number: 7A.2.1
    text: |-
      Bij ministeriële regeling kan worden geregeld dat het voorhanden of in voorraad hebben van bij die regeling
      aangewezen ziekteverwekkers uitsluitend is toegestaan aan door Onze Minister erkende laboratoria, voorzieningen of
      andere natuurlijke of rechtspersonen als bedoeld in artikel 16, eerste lid, van verordening (EU) 2016/429 van het
      Europees Parlement en de Raad van 9 maart 2016 betreffende overdraagbare dierziekten en tot wijziging en intrekking
      van bepaalde handelingen op het gebied van diergezondheid («diergezondheidswetgeving») (PbEU 2016, L84).
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7A.2
  - number: 7A.2.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de gevallen waarin een erkenning als bedoeld in het
      eerste lid wordt verleend, geschorst of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel7A.2
  - number: 8.1.1
    text: |-
      Alvorens een vergunning als bedoeld in de [artikelen 4.1][ref1], [4.21][ref2], [5.1, eerste en tweede lid][ref3],
      en [7.8][ref4] wordt verstrekt, wordt een preventief onderzoek uitgevoerd door personen als
      bedoeld in [artikel 8.1 van de wet][ref5] om te controleren of wordt voldaan aan de krachtens de
      [artikelen 4.9, eerste lid][ref6], en [5.2, eerste lid][ref7], gestelde regels en de lokalen, installaties en
      apparatuur voldoen aan de bij de aanvraag overgelegde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0032386#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0032386#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0030250#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref7]: https://wetten.overheid.nl/BWBR0032386#Artikel5
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '7'
      - id: ref3
        bwb_id: BWBR0032386
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0032386
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0030250
        artikel: '8'
      - id: ref6
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref7
        bwb_id: BWBR0032386
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 8.1.2
    text: |-
      Bij ministeriële regeling kunnen gevallen worden aangewezen, waarin een preventief onderzoek achterwege wordt
      gelaten.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel8.1
  - number: 8.2.1
    text: |-
      De krachtens [artikel 8.1, eerste lid, van de wet][ref1] aangewezen toezichthouder verstrekt na een controlebezoek
      bij een houder van een vergunning als bedoeld in de [artikelen 2.1, derde lid][ref2], [2.12, eerste lid][ref3], of
      [4.7][ref4] een verslag van de controle aan de houder van de vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 8.2.2
    text: |-
      Indien het in het eerste lid genoemde controlebezoek tot de conclusie leidt dat de houder van de vergunning zich
      aan de beginselen en richtsnoeren inzake goede fabricagepraktijken houdt, besluit Onze Minister binnen een termijn
      van negentig dagen na het bezoek een certificaat van goede fabricagepraktijken te verstrekken.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel8.2
  - number: 8.2.3
    text: |-
      De termijn, genoemd in het tweede lid, is niet van toepassing, indien een besluit wordt genomen na een
      controlebezoek op verzoek van een instantie voor de normalisatie van nomenclaturen en kwaliteitsnormen in de zin
      van het Verdrag inzake de samenstelling van een Europese Farmacopee (Trb. 1974, 42) met het oog op de afgifte van
      een certificaat van goede fabricagepraktijken waarin wordt vastgesteld of de fabricagepraktijk in overeenstemming
      is met de monografieën van de Europese Farmacopee.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel8.2
  - number: 8.2.4
    text: |-
      Indien een controlebezoek leidt tot een besluit van Onze Minister dat een certificaat voor goede
      fabricagepraktijken niet kan worden verleend, wordt dit besluit binnen een termijn van negentig dagen na het
      bezoek, bedoeld in het tweede lid, aan de houder van de vergunning bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel8.2
  - number: 8.2.5
    text: Onze Minister meldt een besluit als bedoeld in het tweede tot en met vierde lid aan het Bureau.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel8.2
  - number: '8.3'
    text: |-
      Bij ministeriële regeling worden regels gesteld voor controle en onderzoek met betrekking tot de bestanddelen,
      de tussenproducten en de vervaardiging van een diergeneesmiddel en kunnen regels worden gesteld voor controle van
      immunologische diergeneesmiddelen, waaronder administratieve controle en indien dat om redenen van volksgezondheid
      of diergezondheid noodzakelijk is een controle van het product in onverpakte vorm bij een officieel laboratorium
      voor geneesmiddelencontrole vóór het diergeneesmiddel in de handel wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel8.3
  - number: '8.4'
    text: |-
      Bij ministeriële regeling worden regels gesteld voor de uitvoering van EU-rechtshandelingen die betrekking hebben
      op bij die EU-rechtshandelingen aangewezen substanties over:
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel8.4
  - number: 8.4.a
    text: onderzoeken naar en controle op de aanwezigheid van deze substanties in diergeneesmiddelen;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel8.4
  - number: 8.4.b
    text: onderzoek naar en controle op de aanwezigheid van deze substanties in dieren of dierlijke producten, en
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel8.4
  - number: 8.4.c
    text: het houden van en de handel in dieren of dierlijke producten die deze substanties bevatten.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel8.4
  - number: 8.5.1
    text: |-
      Bij ministeriële regeling worden regels gesteld voor de uitvoering van EU-rechtshandelingen inzake onderzoek,
      controle, toezicht op de naleving en te nemen maatregelen ten aanzien van stoffen met anabole werking, niet
      toegestane stoffen, residuen van diergeneesmiddelen en contaminanten in:
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel8.5
  - number: 8.5.1.a
    text: diergeneesmiddelen;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel8.5
  - number: 8.5.1.b
    text: diervoeders;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel8.5
  - number: 8.5.1.c
    text: drinkwater, en
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel8.5
  - number: 8.5.1.d
    text: levende dieren alsmede producten daarvan, waaronder excreta en biologische vloeistoffen.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel8.5
  - number: 8.5.2
    text: |-
      De regels, bedoeld in het eerste lid, hebben betrekking op onderzoek, controle, toezicht en naar aanleiding daarvan
      te nemen maatregelen door:
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel8.5
  - number: 8.5.2.a
    text: |-
      de houder van de vergunning, bedoeld in de [artikelen 2.1, derde lid][ref1], [2.12, eerste lid][ref2], [4.7][ref3]
      en [5.1][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0032386#Artikel5
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel8.5
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0032386
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 8.5.2.b
    text: houders van dieren, waaronder bedrijven die landbouwhuisdieren op de markt brengen;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel8.5
  - number: 8.5.2.c
    text: bedrijven met een inrichting voor eerste verwerking van primaire producten van dierlijke oorsprong, en
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel8.5
  - number: 8.5.2.d
    text: |-
      inrichtingen, waar onderzoekswerkzaamheden plaatsvinden, ambtenaren en personen, waaronder laboratoria, officiële
      dierenartsen en assistenten alsmede andere toezichthouders.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel8.5
  - number: '8.6'
    text: |-
      Onverminderd de ambtshalve toepassing van de [artikelen 2.20, eerste lid][ref1], en [2.21, eerste lid][ref2], treft
      Onze Minister de nodige maatregelen om te bewerkstelligen dat de aflevering van een diergeneesmiddel wordt verboden
      en het diergeneesmiddel uit de handel wordt genomen wanneer:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel8.6
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 8.6.a
    text: |-
      blijkt dat de beoordeling, bedoeld in [artikel 2.9, eerste lid, onderdeel c, en derde lid][ref1], niet gunstig is;


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel8.6
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 8.6.b
    text: |-
      er geen therapeutische werking is als bedoeld in [artikel 2.9, eerste lid, onderdeel d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel8.6
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 8.6.c
    text: |-
      het diergeneesmiddel niet de kwalitatieve en kwantitatieve samenstelling heeft die in het dossier, bedoeld in
      [artikel 2.3, eerste lid, onderdeel a][ref1], is vermeld,


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel8.6
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 8.6.d
    text: |-
      de wachttermijn, bedoeld in [artikel 2.9, eerste lid, onderdeel e][ref1], ontoereikend is,


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel8.6
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 8.6.e
    text: 'de vervaardiging afwijkt van:'
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel8.6
  - number: 8.6.e.1°
    text: |-
      de wijze van vervaarding die is vermeld in de informatie, bedoeld in [artikel 4.2][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel8.6
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 8.6.e.2°
    text: |-
      de regels gesteld bij of krachtens de [artikelen 4.8][ref1] en [4.9][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel8.6
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '9.1'
    text: |-
      In afwijking van [hoofdstuk 3, paragraaf 2][ref1], is [artikel 2.3][ref2] voor de aanvraag van een vergunning
      voor het in de handel brengen van een homeopathisch diergeneesmiddel dat sinds 31 december 1993 in Nederland in de
      handel is en niet voldoet aan [artikel 3.4, eerste lid, onder b tot en met d][ref3], niet van toepassing, indien
      dat diergeneesmiddel voldoet aan eisen die bij ministeriële regeling aan deze diergeneesmiddelen worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032386#Artikel3
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0032386
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0032386
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '9.2'
    text: |-
      Voor een substantie aangewezen krachtens [artikel 19, onderdeel f, van het Diergeneesmiddelenbesluit][ref1] zoals
      dat gold op het tijdstip van de inwerkingtreding van dit besluit, geldt van rechtswege een vrijstelling van het
      verbod, bedoeld in [artikel 2.8, eerste lid, onderdeel c, van de wet][ref2] tot het moment waarop Onze Minister:


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0018901
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 9.2.a
    text: de vrijstelling intrekt of wijzigt, of
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel9.2
  - number: 9.2.b
    text: |-
      een vrijstelling verleent op grond van [artikel 3.16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel3
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 9.2a.1
    text: |-
      Besluiten, niet inhoudende een algemeen verbindend voorschrift, genomen bij of krachtens de Verordening PDV
      gemedicineerd voeder 2003, die golden onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van dit
      artikel, worden geacht te zijn genomen op grond van dit besluit, onder dezelfde voorschriften, beperkingen en
      voorwaarden.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel9.2a
  - number: 9.2a.2
    text: |-
      De op het tijdstip van inwerkingtreding van dit artikel aanhangige aanvragen, worden overeenkomstig dit besluit
      behandeld met inachtneming van de termijn die op dat tijdstip is verstreken sinds het tijdstip van indiening van
      de aanvraag.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel9.2a
  - number: '9.3'
    text: |-
      Bij ministeriële regeling worden regels gesteld voor de uitvoering van de volgende EU-rechtshandelingen en de
      krachtens die EU-rechtshandelingen vastgestelde EU-rechtshandelingen:
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel9.3
  - number: 9.3.a
    text: |-
      [Richtlijn 90/167/EEG](31990L0167) van de Raad van 26 maart 1990 tot vaststelling van de voorwaarden voor de
      bereiding, het in de handel brengen en het gebruik van diervoeders met medicinale werking (PbEG 1990, L 092);
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel9.3
  - number: 9.3.b
    text: |-
      [Richtlijn 96/22/EG](31996L0022) van de Raad van 29 april 1996 betreffende het verbod op het gebruik, in de
      veehouderij, van bepaalde stoffen met hormonale werking en van bepaalde stoffen met thyreostatische werking,
      alsmede van β-agonisten en tot intrekking van de [Richtlijnen 81/602/EEG](31981L0602), [88/146/EEG](31988L0146) en
      [88/299/EEG](31988L0299) (PbEG 1996, L 125);
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel9.3
  - number: 9.3.c
    text: '[Richtlijn 2001/82/EG](32001L0082);'
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel9.3
  - number: 9.3.d
    text: '[Richtlijn 2004/28/EG](32004L0028);'
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel9.3
  - number: 9.3.e
    text: '[Verordening (EG) nr. 726/2004](32004R0726);'
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel9.3
  - number: 9.3.f
    text: '[Verordening (EG) nr. 470/2009](32009R0470);'
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel9.3
  - number: 9.3.g
    text: Verordening (EU) nr. 2017/625.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel9.3
  - number: '9.4'
    text: |-
      Een krachtens dit besluit vast te stellen ministeriële regeling wordt vastgesteld door Onze Minister in
      overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport en na overleg met Onze Minister van Sociale
      Zaken en Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel9.4
  - number: '9.5'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel9.5
  - number: '9.6'
    text: 'Dit besluit wordt aangehaald als: Besluit diergeneesmiddelen.'
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel9.6
