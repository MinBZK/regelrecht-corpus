        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 4.13.2
    text: |-
      Onverminderd het eerste lid kan Onze Minister een besluit tot schorsing als bedoeld in het eerste lid, nemen,
      indien er een vermoeden bestaat dat:
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.13
  - number: 4.13.2.a
    text: |-
      ondanks een voorafgaande schriftelijke waarschuwing, voorschriften als bedoeld in [artikel 4.8, onder a][ref1],
      niet worden nageleefd, of


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.13
    references:
      - id: ref1
