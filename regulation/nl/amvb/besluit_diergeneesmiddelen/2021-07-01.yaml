    text: |-
      de documenten, bedoeld in [artikel 4.2., eerste lid][ref1], zodanig onjuist of onvolledig zijn dat op de aanvraag
      een andere beslissing zou zijn genomen, indien bij de beoordeling daarvan de juiste gegevens bekend waren geweest,
      of


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.13
    references:
