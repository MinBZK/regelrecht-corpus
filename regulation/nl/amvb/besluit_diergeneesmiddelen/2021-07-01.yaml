        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 4.14.1
    text: |-
      Onze Minister trekt een vergunning als bedoeld in [artikel 4.7][ref1], onverminderd [artikel 4.11][ref2], eerste
      lid, ambtshalve in, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.14
    references:
