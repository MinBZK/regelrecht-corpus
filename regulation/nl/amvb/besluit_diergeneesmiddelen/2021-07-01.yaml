        paragraaf: '6'
      - id: ref10
        bwb_id: BWBR0032386
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 3.2.2
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld in verband met de specifieke kenmerken van het
      diergeneesmiddel of het doel waarvoor de ontheffing kan worden verleend.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.2
  - number: '3.3'
    text: |-
      Deze paragraaf is niet van toepassing op diergeneesmiddelen met een indicatie voor toepassing als immunologisch
      diergeneesmiddel.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.3
  - number: 3.4.1
    text: |-
      Een aanvraag als bedoeld in [artikel 2.1, eerste lid][ref1], voor een homeopathisch diergeneesmiddel gaat in
      afwijking van [artikel 2.3, eerste lid, onderdelen a en b, en het tweede lid][ref2], in samenhang met bijlage I bij
      [richtlijn 2001/82/EG](32001L0082) en, indien de aanvraag betrekking heeft op een toepassing bij dieren die bestemd
      zijn of mede bestemd zijn voor de productie van levensmiddelen in overeenstemming met de artikelen 14 en 27 van
      Verordening (EG) nr. 470/2009, vergezeld van documenten waaruit blijkt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 3.4.1.a
    text: |-
      de wijze van bereiden beschreven staat in een Europese Farmacopee, dan wel in een door een lidstaat officieel
      gebruikte farmacopee;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.4
  - number: 3.4.1.b
    text: |-
      zowel op het etiket als in de bijsluiter van het diergeneesmiddel geen specifieke therapeutische indicatie wordt
      vermeld;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.4
  - number: 3.4.1.c
    text: de verdunningsgraad zodanig is dat de onschadelijkheid van het diergeneesmiddel gegarandeerd is, en
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.4
  - number: 3.4.1.d
    text: het diergeneesmiddel niet meer dan een deel per 10 000 van de oertinctuur bevat.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.4
  - number: 3.4.2
    text: |-
      [Artikel 2.9, eerste lid, onderdelen c, d en e][ref1] zijn niet van toepassing op de in het eerste lid bedoelde
      documenten.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 3.4.3
    text: |-
      In afwijking van [artikel 2.12, eerste lid, onderdeel c][ref1], is een beoordelingsrapport niet vereist bij de
      verstrekking van een vergunning voor een homeopathisch diergeneesmiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 3.4.4
    text: |-
      Indien de aanvraag is ingediend voor een reeks homeopathische diergeneesmiddelen, die van dezelfde grondstof of
      grondstoffen zijn afgeleid, gaat de aanvraag vergezeld van documenten die voldoen aan regels die bij ministeriële
      regeling worden gesteld om de kwaliteit en homogeniteit van partijen homeopathische diergeneesmiddelen vast te
      kunnen stellen.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.4
  - number: 3.4.5
    text: |-
      [Artikel 2.4, tweede lid][ref1], is op homeopathische diergeneesmiddelen als bedoeld in het eerste lid slechts
      van toepassing met betrekking tot de artikelen 32 en 33, eerste tot en met derde lid, van [Richtlijn 2001/82/EG]
      (32001L0082).


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 3.4.6
    text: |-
      De [artikelen 2.23][ref1] en [2.24][ref2] zijn niet van toepassing op een aanvraag voor een homeopathisch
      diergeneesmiddel als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 3.5.1
    text: |-
      Indien een aanvraag niet voldoet aan [artikel 3.4, eerste lid, onderdelen a tot en met d][ref1], wordt deze
      aangemerkt als een aanvraag als bedoeld in [artikel 2.3][ref2], tenzij het diergeneesmiddel in de handel wordt
      gebracht met het oog op toepassing bij gezelschapsdieren en exotische diersoorten, die niet bestemd zijn voor de
      productie van levensmiddelen en die voldoen aan regels die bij ministeriële regeling worden gesteld met betrekking
      tot het bij de aanvraag overleggen van documenten inzake:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 3.5.1.a
    text: de onschadelijkheidproeven, en
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.5
  - number: 3.5.1.b
    text: de preklinische en klinische proeven.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.5
  - number: 3.5.2
    text: Onze Minister stelt de Europese Commissie in kennis van de in het tweede lid bedoelde regels.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.5
  - number: 3.5.3
    text: |-
      [Artikel 2.4, tweede lid][ref1], is op diergeneesmiddelen voor toepassing bij gezelschapsdieren en exotische
      diersoorten slechts van toepassing met betrekking tot artikel 31 van [Richtlijn 2001/82/EG](32001L0082).


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 3.5.4
    text: |-
      De [artikelen 2.23][ref1] en [2.24][ref2] zijn niet van toepassing op diergeneesmiddelen voor toepassing bij
      gezelschapsdieren en exotische diersoorten.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 3.6.1
    text: |-
      Een aanvraag van een vergunning voor het in de handel brengen als bedoeld in [artikel 2.1, eerste lid][ref1], voor
      een generiek diergeneesmiddel kan worden ingediend, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 3.6.1.a
    text: |-
      ten minste een periode van acht jaar is verstreken nadat door een EER-lidstaat of de Europese Commissie een
      vergunning voor het in de handel brengen van een referentiediergeneesmiddel overeenkomstig [Richtlijn 2001/82/EG]
      (32001L0082); respectievelijk overeenkomstig Verordening (EG) nr. 726/2004, is verstrekt, en
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.6
  - number: 3.6.1.b
    text: relevante studies inzake biologische beschikbaarheid worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.6
  - number: 3.6.2
    text: |-
      Een aanvraag als bedoeld in het eerste lid gaat, in afwijking van
      [artikel 2.3, eerste lid, onderdeel a, onder 2° en 3°][ref1], niet vergezeld van de resultaten van:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 3.6.2.a
    text: de onschadelijkheids- en residuproeven, en
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.6
  - number: 3.6.2.b
    text: de klinische en preklinische proeven.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.6
  - number: 3.6.3
    text: |-
      Bij de toepassing van het eerste en tweede lid worden de orale farmaceutische vormen van het
      referentiediergeneesmiddel en het generieke diergeneesmiddel, dat voor rechtstreekse toepassing in de handel
      wordt gebracht en dat met betrekking tot de orale farmaceutische vorm gewijzigd is, beschouwd als één enkele
      farmaceutische vorm.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.6
  - number: 3.6.4
    text: |-
      In afwijking van het tweede lid worden resultaten van proeven overgelegd, indien bijlage I, Titel III, onder 1, bij
      [Richtlijn 2001/82/EG](32001L0082) dit bepaalt of krachtens [artikel 2.19, derde lid, onderdeel f, van de wet][ref1]
      richtsnoeren zijn aangewezen inzake de indiening van aanvullende gegevens voor de beoordeling van een generiek
      diergeneesmiddel dat mogelijk een werkzame stof bevat met eigenschappen die wat betreft veiligheid of werkzaamheid,
      aanzienlijk afwijken van de eigenschappen van de werkzame stof in het referentiediergeneesmiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 3.6.5
    text: |-
      Het eerste lid, onderdeel b, en vierde lid zijn niet van toepassing, indien een aanvrager niet gehouden kan worden
      een studie in te dienen volgens bij ministeriële regeling aangewezen richtsnoeren die door experts van de EER-
      lidstaten gezamenlijk zijn vastgesteld in verband met de uitvoering van [Richtlijn 2001/82/EG](32001L0082) of
      richtsnoeren, als bedoeld in [artikel 2.19, derde lid, onderdeel f, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 3.6.6
    text: |-
      Indien voor het referentiediergeneesmiddel, bedoeld in het eerste lid, onderdeel a, in een andere EER-lidstaat
      overeenkomstig [Richtlijn 2001/82/EG](32001L0082) een vergunning is verstrekt of was verstrekt, verzoekt Onze
      Minister aan deze EER-lidstaat om binnen een maand de volgende informatie aan te leveren:
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.6
  - number: 3.6.6.a
    text: |-
      een bevestiging van verstrekking van een vergunning voor het in de handel brengen van het
      referentiediergeneesmiddel;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.6
  - number: 3.6.6.b
    text: de volledige samenstelling van het product, en
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.6
  - number: 3.6.6.c
    text: zo nodig, andere relevante documenten.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.6
  - number: 3.6.7
    text: |-
      In afwijking van het eerste lid, onderdeel a, bedraagt de in dat onderdeel genoemde periode tien jaar voor
      aanvragen die vóór of op 30 oktober 2005 zijn ingediend.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.6
  - number: '3.7'
    text: |-
      In afwijking van [artikel 3.6, tweede lid][ref1], worden resultaten van onschadelijkheidsproeven, residuproeven,
      klinische proeven en preklinische proeven verstrekt, indien een diergeneesmiddel als bedoeld in artikel 3.6,
      eerste lid, als hybride diergeneesmiddel niet valt onder de definitie van generiek diergeneesmiddel, indien
      van zodanig diergeneesmiddel de biologische equivalentie niet aangetoond kan worden door een biologische-
      beschikbaarheidsstudie, of van dat geneesmiddel één of meer werkzame stoffen, een therapeutische indicatie,
      de concentratie, de farmaceutische vorm of de wijze van toediening zijn gewijzigd ten opzichte van het
      referentiediergeneesmiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel3
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.8.1
    text: |-
      In afwijking van [artikel 3.6, tweede lid, onderdeel b][ref1], worden bij een aanvraag voor een generiek
      diergeneesmiddel van biologische aard dat niet voldoet aan artikel 3.6, eerste, derde en vierde lid, resultaten
      van een preklinische proef of een klinische proef overgelegd, die passen bij de vereisten, bedoeld in
      [artikel 2.19, derde lid, van de wet][ref2], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 3.8.1.a
    text: een andere grondstof wordt gebruikt;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.8
  - number: 3.8.1.b
    text: het biologische diergeneesmiddel niet op dezelfde wijze wordt vervaardigd als het referentiediergeneesmiddel, of
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.8
  - number: 3.8.1.c
    text: |-
      het diergeneesmiddel om andere redenen niet aan [artikel 3.6, eerste, derde en vierde lid][ref1], voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel3
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.8.2
    text: |-
      De resultaten van de proeven, bedoeld in het eerste lid, worden overgelegd in overeenstemming met bijlage I
      bij [Richtlijn 2001/82/EG](32001L0082) en de krachtens [artikel 2.19, derde lid, onderdeel f, van de wet][ref1]
      aangewezen richtsnoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 3.8.3
    text: |-
      De aanvrager is niet gehouden resultaten van andere proeven te overleggen die zich in het dossier van het
      referentiediergeneesmiddel bevinden.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.8
  - number: 3.9.1
    text: |-
      Een generiek diergeneesmiddel waarvoor overeenkomstig de [artikelen 3.6][ref1], [3.7][ref2] of [3.8][ref3] een
      vergunning is verstrekt, kan slechts in de handel worden gebracht na:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0032386#Artikel3
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0032386
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.9.1.a
    text: |-
      een termijn van tien jaar of een met toepassing van het tweede lid van dit artikel verlengde termijn nadat de
      vergunning voor het in de handel brengen van het referentiediergeneesmiddel door de Europese Commissie of een EER-
      lidstaat is verstrekt, of
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.9
  - number: 3.9.1.b
    text: |-
      een termijn van dertien jaar nadat de eerdere vergunning is verstrekt, indien de vergunning is verstrekt voor het
      in de handel brengen van diergeneesmiddelen met het oog op toepassing bij bijen of vissen.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.9
  - number: 3.9.2
    text: |-
      De in het eerste lid, onderdeel a, bedoelde termijn wordt verlengd met één jaar per diersoort, tot ten
      hoogste dertien jaar voor een vergunning voor het in de handel brengen voor vier of meer voor de productie van
      levensmiddelen bestemde diersoorten, indien:
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.9
  - number: 3.9.2.a
    text: |-
      het referentiediergeneesmiddel een werkzame stof bevat die op 30 april 2004 nog niet door de Europese Commissie of
      een EER-lidstaat in een diergeneesmiddel is toegelaten;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.9
  - number: 3.9.2.b
    text: |-
      binnen een termijn van vijf jaar na de verstrekking van een vergunning voor het in de
      handel brengen van het referentiediergeneesmiddel een aanvraag tot wijziging als bedoeld in
      [artikel 2.18, eerste lid, onderdeel a][ref1], wordt verleend voor een uitbreiding van voorschriften als bedoeld
      in [artikel 2.19, derde lid, onderdeel a, aanhef, van de wet][ref2], met één of meer voor levensmiddelen bestemde
      diersoorten;


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 3.9.2.c
    text: |-
      het diergeneesmiddel een farmacologisch werkzame stof bevat die niet reeds is opgenomen in een krachtens
      Verordening (EG) nr. 470/2009 vastgestelde EU-rechtshandeling, en
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.9
  - number: 3.9.2.d
    text: |-
      de vergunninghouder een aanvraag heeft ingediend tot vaststelling van de maximumwaarden voor residuen van de
      farmacologisch werkzame stof in de diersoort waarop de uitbreiding betrekking heeft, overeenkomstig Verordening
      (EG) nr. 470/2009.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.9
  - number: 3.10.1
    text: |-
      In afwijking van [artikel 2.3][ref1] behoeft een aanvrager geen documenten of studies als bedoeld in die artikelen
      te overleggen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 3.10.1.a
    text: |-
      de werkzame stof in het diergeneesmiddel reeds ten minste tien jaar zonder problemen in de Europese Unie in
      de diergeneeskunde wordt gebruikt en een erkende werkzaamheid alsmede een aanvaardbaar veiligheidsniveau biedt
      overeenkomstig de eisen van bijlage I bij [Richtlijn 2001/82/EG](32001L0082), en
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.10
  - number: 3.10.1.b
    text: |-
      de aanvrager de resultaten van deze documenten of studies vervangt door een desbetreffende wetenschappelijke
      bibliografie, waaronder in voorkomend geval een beoordelingsrapport van het Bureau met betrekking tot met name de
      resultaten van onschadelijkheidsproeven.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.10
  - number: 3.10.2
    text: |-
      Wanneer een aanvrager als bedoeld in het eerste lid documenten overlegt die resultaten bevatten van nieuwe
      residustudies als bedoeld in een krachtens Verordening (EG) nr. 470/2009 vastgestelde EU-rechtshandeling of nieuwe
      klinische proeven als bedoeld in bijlage I bij [Richtlijn 2001/82/EG](32001L0082) met betrekking tot een voor
      de productie van levensmiddelen bestemde diersoort, kan een derde gedurende drie jaar na de verstrekking van de
      vergunning met betrekking tot de toepassing van het diergeneesmiddel bij die diersoort geen beroep doen op deze
      documenten.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.10
  - number: '3.11'
    text: |-
      In afwijking van [artikel 2.3][ref1] behoeft een aanvrager van een vergunning voor het in de handel brengen van
      een diergeneesmiddel dat meerdere werkzame stoffen bevat, geen documenten of studies te overleggen van iedere
      afzonderlijke werkzame stof in dit diergeneesmiddel, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 3.11.a
    text: |-
      de afzonderlijke farmacologsich werkzame stoffen zijn opgenomen in diergeneesmiddelen waarvoor eerder een
      vergunning voor het in de handel brengen van een diergeneesmiddel is verleend, en
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.11
  - number: 3.11.b
    text: |-
      met betrekking tot de samengevoegde werkzame stoffen resultaten van proeven als bedoeld in
      [artikel 2.3, eerste lid, onderdeel a, onder 2°][ref1], en indien nodig, resultaten van nieuwe proeven als bedoeld
      in artikel 2.3, eerste lid, onderdeel a, onder 3°, worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '3.12'
    text: |-
      In afwijking van de [artikelen 2.3][ref1] en [3.6, eerste lid, onderdeel b, en vierde lid][ref2], behoeft een
      aanvrager van een vergunning voor het in de handel brengen van een diergeneesmiddel geen documenten of studies te
      overleggen, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel3
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.12.a
    text: |-
      een houder van een eerder verstrekte vergunning voor het in de handel brengen van een diergeneesmiddel er door
      middel van een verklaring van toegang in toestemt dat bij de behandeling van de in de aanhef bedoelde aanvraag
      gebruik wordt gemaakt van documenten of studies die door de houder van de eerder verstrekte vergunning zijn
      overgelegd in het dossier bij die vergunning;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.12
  - number: 3.12.b
    text: |-
      het diergeneesmiddel waarvoor een aanvraag wordt ingediend dezelfde kwalitatieve en kwantitatieve samenstelling
      heeft, en
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.12
  - number: 3.12.c
    text: het diergeneesmiddel waarvoor een aanvraag wordt ingediend dezelfde farmaceutische vorm heeft.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.12
  - number: '3.13'
    text: |-
      Onder uitzonderlijke omstandigheden behoeft een aanvrager van een vergunning voor het in de handel brengen van
      een immunologisch diergeneesmiddel geen resultaten van bepaalde veldproeven te overleggen indien deze veldproeven
      om gemotiveerde redenen niet uitgevoerd kunnen worden, waaronder om reden van naleving van EU-verordeningen, EU-
      besluiten of nationale regelgeving voor de implementatie van EU-richtlijnen.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.13
  - number: 3.14.1
    text: |-
      Onze Minister besluit op aanvraag tot het verstrekken van een vergunning voor het in de handel brengen als bedoeld
      in [artikel 2.1, eerste lid][ref1], van een diergeneesmiddel voor parallelle invoer dat:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 3.14.1.a
    text: krachtens een vergunning in een andere EER-lidstaat in de handel wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.14
  - number: 3.14.1.b
    text: wordt ingevoerd vanuit een andere EER-lidstaat waar het diergeneesmiddel in de handel is gebracht;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.14
  - number: 3.14.1.c
    text: |-
      identiek is aan een diergeneesmiddel waarvoor reeds in Nederland een vergunning voor het in de handel brengen is
      verstrekt, en
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.14
  - number: 3.14.1.d
    text: |-
      afkomstig is van de onderneming die het in onderdeel c bedoelde diergeneesmiddel vervaardigt, een daarmee gelieerde
      onderneming, een onderneming die onder licentie het diergeneesmiddel vervaardigt of een onderneming die beschikt
      over een verklaring van toegang tot de documenten, bedoeld in [artikel 2.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 3.14.2
    text: |-
      In afwijking van het eerste lid, onderdelen c en d, en [artikel 2.3, eerste en tweede lid][ref1], en onverminderd
      [artikel 2.4][ref2], neemt Onze Minister een aanvraag als bedoeld in het eerste lid in behandeling indien de
      aanvraag betrekking heeft op een diergeneesmiddel dat voldoet aan het eerste lid, onderdelen a en b, en uit daartoe
      overlegde documenten blijkt dat in vergelijking met een in Nederland reeds in de handel gebracht diergeneesmiddel
      de samenstelling, wijze van toepassen en verpakking van het diergeneesmiddel geen wezenlijke verschillen vertoont
      in kwaliteit en werkzaamheid die van invloed kunnen zijn op de volksgezondheid, diergezondheid, dierenwelzijn of
      het milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 3.14.3
    text: |-
      De voorschriften die gelden voor het in de handel brengen van het in eerste lid, onderdeel c, bedoelde
      diergeneesmiddel gelden eveneens voor het diergeneesmiddel waarvoor krachtens het eerste lid, aanhef, een
      vergunning voor het in de handel brengen wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.14
  - number: 3.14.4
    text: |-
      De voorschriften die gelden voor het in de handel brengen van het diergeneesmiddel waarvoor reeds in Nederland een
      vergunning voor het in de handel brengen is verstrekt, bedoeld in eerste lid, onderdeel c, gelden eveneens voor het
      in handel brengen van een diergeneesmiddel waarvoor ingevolge het tweede lid een vergunning voor het in de handel
      brengen wordt verstrekt met uitzondering van door Onze Minister in afwijking van die voorschriften vast te stellen
      voorschriften in verband met wezenlijke verschillen als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.14
  - number: 3.14.5
    text: |-
      Onze Minister schorst een vergunning voor parallelle invoer zolang de vergunning, bedoeld in het eerste lid,
      onderdeel c, is geschorst.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.14
  - number: 3.14.6
    text: |-
      Onze Minister trekt een vergunning voor parallelle invoer in zodra de vergunning, bedoeld in het eerste lid,
      onderdeel c, anders dan op verzoek van de houder daarvan wordt ingetrokken dan wel van rechtswege vervalt.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.14
  - number: 3.14.7
    text: |-
      Na intrekking van de vergunning, bedoeld in het eerste lid, onderdeel c, op verzoek van de houder daarvan blijft de
      vergunning voor parallelle invoer van kracht gedurende een door Onze Minister te bepalen uitverkooptermijn, tenzij
      het bepalen van een uitverkooptermijn in strijd is met belangen van volksgezondheid, diergezondheid, dierenwelzijn
      of het milieu.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.14
  - number: 3.15.1
    text: |-
      Onze Minister besluit op aanvraag tot het verstrekken van een afgeleide vergunning voor het in de handel brengen
      van een diergeneesmiddel dat:
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.15
  - number: 3.15.1.a
    text: |-
      identiek is aan een diergeneesmiddel waarvoor reeds in Nederland een vergunning voor het in de handel brengen is
      verstrekt;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.15
  - number: 3.15.1.b
    text: |-
      afkomstig is van de onderneming die het in onderdeel a bedoelde diergeneesmiddel vervaardigt, een daarmee gelieerde
      onderneming, een onderneming die onder licentie het diergeneesmiddel vervaardigt of een onderneming die beschikt
      over een verklaring van toegang tot de documenten, bedoeld in [artikel 2.3][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 3.15.1.c
    text: |-
      voldoet aan onderdeel a, met uitzondering van merknaam, naam van de registratiehouder en uiterlijke vormgeving van
      de verpakking.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.15
  - number: 3.15.2
    text: |-
      De voorschriften die gelden voor het in de handel brengen van het in eerste lid, onderdeel a, bedoelde
      diergeneesmiddel gelden eveneens voor het diergeneesmiddel waarvoor krachtens het eerste lid een vergunning voor
      het in de handel brengen is verstrekt.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.15
  - number: 3.15.3
    text: Een afgeleide vergunning is geschorst zolang de vergunning, bedoeld in het eerste lid, onderdeel a, is geschorst.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.15
  - number: 3.15.4
    text: |-
      Onze Minister trekt een afgeleide vergunning in zodra de vergunning, bedoeld in het eerste lid, onderdeel a, anders
      dan op verzoek van de houder daarvan wordt ingetrokken dan wel van rechtswege vervalt.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.15
  - number: 3.15.5
    text: |-
      Na intrekking van de vergunning, bedoeld in het eerste lid, onderdeel a, op verzoek van de houder daarvan blijft
      de afgeleide vergunning van kracht gedurende een door Onze Minister te bepalen uitverkooptermijn, tenzij het
      bepalen van een uitverkooptermijn in strijd is met belangen van volksgezondheid, diergezondheid, dierenwelzijn of
      het milieu.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.15
  - number: '3.16'
    text: |-
      Onze Minister kan ambtshalve vrijstelling verlenen van het verbod, bedoeld in
      [artikel 2.19, eerste lid, van de wet][ref1] inzake het in de handel brengen van een diergeneesmiddel, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 3.16.a
    text: de werkzame substantie niet met het oog op toepassing als diergeneesmiddel op de markt wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.16
  - number: 3.16.b
    text: |-
      de fabrikant of importeur niet beweert dat sprake is van een voldoende werkzaamheid als bedoeld in
      [artikel 2.19, derde lid, onderdeel a, onder 1°, van de wet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 3.16.c
    text: |-
      het diergeneesmiddel naar het oordeel van Onze Minister aan het gestelde bij of krachtens
      [artikel 2.19, derde lid, onderdelen a tot en met c, van de wet][ref1] voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: '3.17'
    text: |-
      Onze Minister kan, in het belang van de diergezondheid en het dierenwelzijn, van het verbod, bedoeld in
      [artikel 2.19, eerste lid, van de wet][ref1] inzake het in de handel brengen van een diergeneesmiddel ambtshalve
      vrijstelling verlenen voor het in de handel brengen met het oog op toepassing van een diergeneesmiddel zonder
      vergunning, wanneer voor dit diergeneesmiddel door een andere EER-lidstaat overeenkomstig de procedures van
      [Richtlijn 2001/82/EG](32001L0082) een vergunning voor het in de handel brengen is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 3.18.1
    text: |-
      In het geval zich ernstige epizoötische ziekten voordoen, kan Onze Minister van het verbod, bedoeld in
      [artikel 2.19, eerste lid, van de wet][ref1] inzake het in de handel brengen van een diergeneesmiddel ambtshalve
      vrijstelling verlenen voor het zonder vergunning in de handel brengen van een immunologisch diergeneesmiddel indien
      er in Nederland of een andere EER-lidstaat geen geschikt diergeneesmiddel voorhanden is.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 3.18.2
    text: |-
      Een vrijstelling als bedoeld in het eerste lid wordt slechts verleend, indien de Europese Commissie vooraf door
      Onze Minister in kennis is gesteld van de gedetailleerde voorschriften voor de toepassing.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.18
  - number: 3.19.1
    text: |-
      Onze Minister kan van het verbod, bedoeld in [artikel 2.19, eerste lid, van de wet][ref1] inzake het in de handel
      brengen van een diergeneesmiddel ambtshalve vrijstelling verlenen voor diergeneesmiddelen die geen substanties
      bevatten die bij toepassing een veterinaire controle vereisen en die uitsluitend bestemd zijn voor toepassing bij:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 3.19.1.a
    text: aquariumvissen;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.19
  - number: 3.19.1.b
    text: kooivogels;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.19
  - number: 3.19.1.c
    text: postduiven;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.19
  - number: 3.19.1.d
    text: terrariumdieren;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.19
  - number: 3.19.1.e
    text: kleine knaagdieren;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.19
  - number: 3.19.1.f
    text: niet voor dierlijke producten gehouden fretten, of
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.19
  - number: 3.19.1.g
    text: niet voor dierlijke producten gehouden konijnen.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.19
  - number: 3.19.2
    text: |-
      Bij ministeriële regeling worden regels gesteld om te voorkomen dat diergeneesmiddelen als bedoeld in het eerste
      lid ten onrechte bij andere diersoorten worden toegepast.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.19
  - number: 3.19.3
    text: |-
      In afwijking van het eerste lid kan Onze Minister op aanvraag een ontheffing verlenen met overeenkomstige
      toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.19
  - number: 3.20.1
    text: |-
      Onze Minister kan van het verbod, bedoeld in [artikel 2.19, eerste lid, van de wet][ref1] inzake het in de
      handel brengen van een diergeneesmiddel ambtshalve vrijstelling verlenen voor het in de handel brengen van een
      immunologisch diergeneesmiddel, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.20
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 3.20.1.a
    text: een dier vanuit een derde land wordt ingevoerd of daarheen wordt uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.20
  - number: 3.20.1.b
    text: |-
      er in verband met de uitvoer of de invoer specifieke verplichte gezondheidsbepalingen van één van de betrokken
      landen moeten worden toegepast, en
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.20
  - number: 3.20.1.c
    text: toepassing van dit diergeneesmiddel in het derde land is toegestaan.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.20
  - number: 3.20.2
    text: |-
      Onze Minister stelt voorschriften of beperkingen als bedoeld in [artikel 7.5 van de wet][ref1] met betrekking tot
      controle op invoer en gebruik van het diergeneesmiddel, bedoeld in het eerste lid, onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.20
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7'
  - number: 3.20.3
    text: |-
      In afwijking van het eerste lid kan Onze Minister op aanvraag een ontheffing verlenen met overeenkomstige
      toepassing van het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.20
  - number: 3.21.1
    text: |-
      Onze Minister kan van de verboden, bedoeld in de [artikelen 2.8, eerste lid, onder b][ref1], en
      [2.25, eerste lid, van de wet][ref2] ambtshalve een vrijstelling verlenen voor de toepassing van een
      diergeneesmiddel op basis van een radioactieve isotoop.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.21
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 3.21.2
    text: |-
      In afwijking van het eerste lid kan Onze Minister op aanvraag een ontheffing verlenen met overeenkomstige
      toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.21
  - number: 3.22.1
    text: |-
      Onze Minister kan van het verbod, bedoeld in [artikel 2.19, eerste lid, van de wet][ref1] inzake het zonder
      vergunning in de handel brengen van een diergeneesmiddel en [artikel 2.25, eerste lid, van de wet][ref2] over het
      toepassen van diergeneesmiddelen, diervoeders, substanties, of andere stoffen of producten bij dieren, of op cel-
      of weefselcultures van dieren ambtshalve een vrijstelling verlenen, voor onder meer de volgende proeven:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 3.22.1.a
    text: de farmaceutische (fysisch-chemische, biologische of microbiologische) proeven;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.22
  - number: 3.22.1.b
    text: de onschadelijkheids- en residuproeven;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.22
  - number: 3.22.1.c
    text: de preklinische en klinische proeven, of
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.22
  - number: 3.22.1.d
    text: proeven ter evaluatie van de risico’s voor het milieu.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.22
  - number: 3.22.2
    text: |-
      Onze Minister bepaalt bij de vrijstelling, bedoeld in het eerste lid, dat een dier of een levensmiddel van een dier
      waarop een diergeneesmiddel is beproefd:
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.22
  - number: 3.22.2.a
    text: niet in de handel wordt gebracht, of
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.22
  - number: 3.22.2.b
    text: |-
      slechts wordt aangeboden voor de slacht respectievelijk in de handel wordt gebracht na een in overeenstemming met
      [artikel 5.2, derde lid, van het Besluit diergeneeskundigen][ref1], of de [artikelen 2.10][ref2] en [2.11][ref3]
      van dit besluit door Onze Minister vastgestelde wachttermijn.


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 3.22.3
    text: |-
      In afwijking van het eerste lid kan Onze Minister op aanvraag een ontheffing verlenen met overeenkomstige
      toepassing van het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.22
  - number: 3.22.4
    text: |-
      Bij ministeriële regeling kunnen onderzoeksinstellingen worden aangewezen die voor wetenschappelijk onderzoek,
      kwaliteitscontrole of toezicht op de naleving onder bij die regeling te stellen regels beschikken over een algemene
      ontheffing voor het toepassen van diergeneesmiddelen, diervoeders, substanties, of andere stoffen of producten bij
      dieren, of op cel- of weefselcultures van dieren met overeenkomstige toepassing van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.22
  - number: 3.23.1
    text: |-
      Onze Minister kan van de verboden, bedoeld in de [artikelen 2.8, eerste lid, onder b][ref1], en
      [2.25, eerste lid, van de wet][ref2] ambtshalve een vrijstelling verlenen voor de toepassing van diergeneesmiddelen
      op materiaal van dierlijke herkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 3.23.2
    text: |-
      In afwijking van het eerste lid kan Onze Minister op aanvraag een ontheffing verlenen met overeenkomstige
      toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel3.23
  - number: 4.1.1
    text: 'Een aanvraag van een vergunning voor:'
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.1
  - number: 4.1.1.a
    text: |-
      vervaardiging van een diergeneesmiddel als bedoeld in [artikel 2.19, eerste lid, van de wet][ref1],
      waaronder een substantie die een werkzame stof bevat die bij een dier kan worden toegepast als bedoeld in
      [artikel 1.1, onder het begrip «diergeneesmiddel», onderdeel 2°, van de wet][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel1
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '1'
  - number: 4.1.1.b
    text: |-
      het bezit van een diergeneesmiddel of substantie als bedoeld in onderdeel a, met anabole, anti-infectieuze, anti-
      parasitaire, anti-inflammatoire, hormonale of psychotrope eigenschappen,
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.1
  - number: 4.1.2
    text: |-
      Bij ministeriële regeling worden gevallen aangewezen waarin een verdeler van een substantie als bedoeld in het
      eerste lid, onderdelen a en b, kan volstaan met een melding.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.1
  - number: 4.2.1
    text: |-
      Een aanvraag als bedoeld in [artikel 4.1][ref1] gaat vergezeld van documenten die tenminste de volgende informatie
      bevatten:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.2.1.a
    text: |-
      een lijst van de diergeneesmiddelen of substanties, bedoeld in [artikel 4.1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.2.1.b
    text: een beschrijving van de farmaceutische vormen;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.2
  - number: 4.2.1.c
    text: |-
      een aanduiding van de plaats van vervaardiging of het bezit waaronder een beschrijving van de lokalen en wijze
      van bewaren;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.2
  - number: 4.2.1.d
    text: een beschrijving van de controles door het bedrijf;
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.2
  - number: 4.2.1.e
    text: een aanduiding van de technische uitrusting, en
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.2
  - number: 4.2.1.f
    text: |-
      een aanwijzing van tenminste één persoon die verantwoordelijk is voor de kwaliteitszorg bij de vervaardiging
      alsmede informatie over de opleiding van deze persoon.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.2
  - number: 4.2.2
    text: 'Bij ministeriële regeling worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.2
  - number: 4.2.2.a
    text: de verstrekking van de in het eerste lid, onderdelen a tot en met f, bedoelde documenten en
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.2
  - number: 4.2.2.b
    text: de aanwijzing, bedoeld in het eerste lid, onderdeel f.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.2
  - number: 4.2.3
    text: |-
      Bij ministeriële regeling worden eisen gesteld aan de opleiding van een persoon als bedoeld in het eerste lid,
      onderdeel f.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.2
  - number: 4.3.1
    text: |-
      De termijn voor een beslissing op een aanvraag als bedoeld in [artikel 4.1, eerste lid][ref1], bedraagt ten hoogste
      negentig dagen nadat een aanvraag door Onze Minister als volledig is aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.3.2
    text: |-
      Bij ministeriële regeling kan een andere termijn worden vastgesteld voor het nemen van een besluit als bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.3
  - number: 4.4.1
    text: |-
      Onze Minister geeft een aanvrager de gelegenheid om de aanvraag schriftelijk aan te vullen als bedoeld
      in [artikel 4:5, eerste tot en met derde lid, van de Algemene wet bestuursrecht][ref1], of mondeling toe
      te lichten, en schort daartoe de termijn, bedoeld in [artikel 4.3, eerste lid][ref2], met toepassing van
      [artikel 4.16, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref3] op indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
