    text: |-
      voorschriften als bedoeld in [artikel 4.8, onderdelen b tot en met g][ref1], of eisen als bedoeld in
      [artikel 4.9, eerste of tweede lid][ref2], niet worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.13
    references:
      - id: ref1
