    text: |-
      In afwijking van het eerste lid kunnen bij ministeriële regeling categorieën van diergeneesmiddelen of substanties
      als bedoeld in [artikel 4.1][ref1] worden aangewezen waarvoor een eerste vergunning voor vervaardiging met een
      bepaalde geldingsduur van ten minste vijf jaar wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.11.1
    text: |-
      De [artikelen 4.1 tot en met 4.5][ref1] zijn van overeenkomstige toepassing bij de behandeling van een aanvraag tot
      verlenging, wijziging of intrekking van een vergunning als bedoeld in [artikel 4.7][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 4.11.2
    text: |-
      In afwijking van het eerste lid bedraagt de termijn, bedoeld in [artikel 4.3][ref1], in verband met wijzigingen in
      één of meer van de documenten, bedoeld in [artikel 4.2, eerste lid][ref2], ten hoogste dertig dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.11.3
    text: |-
      Bij ministeriële regeling kunnen uitzonderlijke gevallen worden aangewezen waarvoor de termijn, bedoeld in het
      tweede lid, tot ten hoogste negentig dagen wordt verlengd.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.11
  - number: 4.11.4
    text: |-
      Een aanvraag als bedoeld in het eerste lid wordt slechts in behandeling genomen als deze is ingediend door de
      houder van de vergunning.
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.11
  - number: 4.12.1
    text: |-
      Een aanvraag tot verlenging of wijziging van een vergunning als bedoeld in [artikel 4.11][ref1] wordt ingediend
      ten minste negentig dagen voordat de geldingsduur, bedoeld in [artikel 4.10, tweede lid][ref2], is verlopen,
      respectievelijk het fabricageproces wordt veranderd.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 4.12.2
    text: |-
      Bij een aanvraag als bedoeld in het eerste lid kan de aanvrager in afwijking van [artikel 4.2, eerste lid][ref1],
      volstaan met indiening van een lijst van relevante eerder ingediende documenten en alle daarin aangebrachte
      veranderingen, voorzover het veranderingen van beperkte aard betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.12.3
    text: |-
      Onze Minister verlengt een vergunning als bedoeld in [artikel 4.7][ref1] op een eerste aanvraag tot verlenging,
      bedoeld in het eerste lid, voor onbepaalde tijd.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 4.12.4
    text: |-
      In afwijking van het derde lid kan een vergunning als bedoeld in dat lid tot vijf jaar worden verlengd indien een
      besluit is genomen als bedoeld in [artikel 2.17, vierde lid][ref1], eerste volzin. Bij een volgende aanvraag wordt
      die vergunning voor onbepaalde tijd verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 4.13.1
    text: |-
      Onze Minister schorst een vergunning als bedoeld in [artikel 4.7][ref1], indien hij een ernstig vermoeden heeft
      dat:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#Artikel4.13
    references:
