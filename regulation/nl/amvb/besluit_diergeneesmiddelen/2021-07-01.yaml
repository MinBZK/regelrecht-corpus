preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Economische Zaken, Landbouw, en Innovatie, van 13 juli
    2012, no. 283173, Directie Wetgeving en Juridische Zaken, gedaan in overeenstemming met Onze Minister van
    Volksgezondheid, Welzijn en Sport, en na overleg met de Staatssecretaris van Sociale Zaken en Werkgelegenheid;

    Gelet op

    Richtlijn 90/167/EEG van de Raad van 26 maart 1990 tot vaststelling van de voorwaarden voor de bereiding, het in de
    handel brengen en het gebruik van diervoeders met medicinale werking (PbEG 1990, L 092);

    Richtlijn 96/22/EG van de Raad van 29 april 1996 betreffende het verbod op het gebruik, in de veehouderij, van
    bepaalde stoffen met hormonale werking en van bepaalde stoffen met thyreostatische werking, alsmede van β-agonisten
    en tot intrekking van de Richtlijnen 81/602/EEG, 88/146/EEG en 88/299/EEG (PbEG 1996, L 125);

    Richtlijn 96/23/EG van de Raad van 29 april 1996 inzake controlemaatregelen ten aanzien van bepaalde stoffen en
    residuen daarvan in levende dieren en in producten daarvan en tot intrekking van de Richtlijnen 85/358/EEG en
    86/469/EEG en de Beschikkingen 89/187/EEG en 91/664/EEG (PbEG 1996, L 125);

    Richtlijn 2001/82/EG van het Europees Parlement en de Raad van 6 november 2001 tot vaststelling van een
    communautair wetboek betreffende geneesmiddelen voor diergeneeskundig gebruik (PbEG 2001, L 311);

    Richtlijn 2004/28/EG van het Europees Parlement en de Raad van 31 maart 2004 tot wijziging van Richtlijn 2001/82/
    EG tot vaststelling van een communautair wetboek betreffende geneesmiddelen voor diergeneeskundig gebruik (PbEU
    2004, L 136);

    Verordening (EG) nr. 726/2004 van het Europees Parlement en de Raad van de Europese Unie van 31 maart 2004 tot
    vaststelling van communautaire procedures voor het verlenen van vergunningen en het toezicht op geneesmiddelen voor
    menselijk en diergeneeskundig gebruik en tot oprichting van een Europees Geneesmiddelenbureau (PbEU 2004, L 136);

    Verordening (EG) nr. 470/2009 van het Europees Parlement en de Raad van 6 mei 2009 tot vaststelling van
    communautaire procedures voor het vaststellen van grenswaarden voor residuen van farmacologisch werkzame stoffen in
    levensmiddelen van dierlijke oorsprong (PbEU 2009, L 152);

    de artikelen 2.7, eerste lid, 2.8, tweede lid, onderdeel d, vierde lid, onderdeel b, en vijfde lid, 2.19, eerste
    en tweede lid, derde lid, onderdeel g, vierde en vijfde lid, 2.20, eerste en tweede lid, 2.21, eerste, vierde en
    vijfde lid, 2.22, eerste lid, 2.25, eerste en derde lid, 3.1, 6.2, eerste lid, 6.3, eerste lid, 7.1, 7.2, 7.3,
    derde lid, 7.4, 7.5, vierde lid, 7.8, 7.9, 10.2, en 11.1, eerste lid, van de Wet dieren;

    De Afdeling advisering van de Raad van State gehoord (advies van 12 september 2012 No. W15.12.0298/IV);

    Gezien het nader rapport van de Staatssecretaris van Economische Zaken, Landbouw en Innovatie van 31 oktober
    2012, no. 12332997, Directie Wetgeving en Juridische Zaken, uitgebracht in overeenstemming met Onze Minister van
    Volksgezondheid, Welzijn en Sport en na overleg met de Staatssecretaris van Sociale Zaken en Werkgelegenheid;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0032386/2021-07-01#ArtikelAanhef
articles:
  - number: 1.1.1
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *afwijkende toepassing:* toepassing van
      een diergeneesmiddel, waaronder mede een verkeerde toepassing of ernstig misbruik van het diergeneesmiddel wordt
      verstaan, die niet in overeenstemming is met de beschrijving in de samenvatting van de kenmerken van het product;
        - *apotheker:* apotheker als bedoeld in
      [artikel 3, eerste lid, van de Wet op de beroepen in de individuele gezondheidszorg][ref1] die zijn beroep
      uitoefent in een apotheek als bedoeld in [artikel 1, eerste lid, onderdeel oo, van de Geneesmiddelenwet][ref2];
        - *bereiding ex tempore:* bereiding volgens een formula officinalis of een formula magistralis;
        - *buitenverpakking:* verpakking waarin de primaire verpakking is geplaatst;
        - *Bureau:* bureau, bedoeld in artikel 1 van Verordening (EG) nr. 726/2004;
        - *bijsluiter:* informatieblad voor de gebruiker dat het geneesmiddel vergezelt bij de primaire verpakking in de
      buitenverpakking;
        - *bijwerking:* bijwerking bij een dier of een bijwerking bij de mens;
        - *bijwerking bij een dier:* reactie die schadelijk en ongewild is en optreedt bij doses die normaal bij dieren
      voor de profylaxe, diagnose of behandeling van een ziekte of voor het herstellen, verbeteren of wijzigen van een
      fysiologische functie worden gebruikt;
        - *bijwerking bij de mens:* reactie die schadelijk en onbedoeld is en bij een mens optreedt na blootstelling aan
      een diergeneesmiddel;
        - *concentratie van het diergeneesmiddel:* gehalte aan werkzame stoffen, uitgedrukt per doseringseenheid, volume-
      of gewichtseenheid in overeenstemming met de doseringsvorm;
        - *Comité:* Comité voor geneesmiddelen voor diergeneeskundig gebruik als bedoeld in artikel 34, eerste lid, van
      [Richtlijn 2001/82/EG](32001L0082);
        - *diergeneesmiddel van biologische aard:* diergeneesmiddel met een werkzame stof vervaardigd uit micro-organismen,
      organen en weefsels van plantaardige of dierlijke oorsprong, cellen en vloeistoffen, waaronder bloed en plasma,
      van menselijke of dierlijke oorsprong en biotechnologische celpreparaten, waaronder celsubstraten, ongeacht of zij
      recombinant zijn of niet, met inbegrip van primaire cellen;
        - *derde land:* land, niet zijnde een EER-lidstaat;
        - *diergeneesmiddelenbewaking:* systematisch verzamelen en beheren van gegevens over bijwerkingen en het gebruik
      en misbruik van diergeneesmiddelen waarvoor een vergunning als bedoeld in de [artikelen 2.1, derde lid][ref3],
      of [2.12, eerste lid][ref4], is verstrekt, alsmede het leggen van verband tussen deze gegevens en de algemeen
      beschikbare gegevens over diergeneesmiddelengebruik;
        - *EER-lidstaat:* lidstaat van de Europese Unie of een andere staat die partij is bij de Overeenkomst betreffende
      de Europese Economische Ruimte;
        - *ernstige bijwerking:* bijwerking die tot de dood leidt, levensgevaar oplevert, een significante handicap of
      lichamelijke ongeschiktheid veroorzaakt, tot een aangeboren afwijking of een geboorteafwijking leidt of leidt tot
      blijvende of langdurige gevolgen bij dieren;
        - *etikettering:* vermelding op de buitenverpakking of de primaire verpakking;
        - *Europese farmacopee:* handboek voor de analyse van een geneesmiddel dat is vastgesteld volgens het Verdrag
      inzake de samenstelling van een Europese farmacopee (PbEG 1974, 42);
        - *fabrikant:* degene die een vergunning als bedoeld in [artikel 4.1][ref5] is verstrekt;
        - *farmaceutische vorm:* fysieke vorm waarin een diergeneesmiddel in de handel is gebracht met het oog op
      toepassing bij een dier;
        - *farmacologisch werkzame stof:* substantie met farmacologische werking, waaronder een substantie die een werkzame
      stof is;
        - *farmacopee:* een door een EER-lidstaat vastgesteld handboek voor de analyse van een geneesmiddel of een Europese
      farmacopee;
        - *formula magistralis:* formule voor de bereiding van een diergeneesmiddel die in een apotheek volgens een
      voorschrift van een dierenarts voor een bepaald dier of een kleine groep dieren wordt vervaardigd;
        - *formula officinalis:* formule voor de bereiding van een diergeneesmiddel die in een apotheek volgens de
      voorschriften van een farmacopee voor een bepaald dier of een kleine groep dieren wordt vervaardigd en die voor
      directe verstrekking aan een eindgebruiker, waaronder de betrokken houder van dieren, is bestemd;
        - *graaddag:* eenheid van tijd en temperatuur voor de berekening van een wachttermijn bij vis;
        - *generiek diergeneesmiddel:* diergeneesmiddel met dezelfde kwalitatieve en kwantitatieve samenstelling
      aan werkzame stoffen en dezelfde farmaceutische vorm als het referentiegeneesmiddel, waarvan de biologische
      equivalentie met het referentiegeneesmiddel is aangetoond;
        - *groothandel:* handel in diergeneesmiddelen met uitzondering van verstrekking aan eindgebruikers, waaronder
      houders van dieren;
        - *invoer:* in Nederland brengen;
        - *importeur:* degene die een vergunning als bedoeld in [artikel 4.21, eerste lid][ref6], is verstrekt of die
      diergeneesmiddelen in Nederland brengt overeenkomstig de [artikelen 4.20][ref7] of 4.21, tweede lid;
        - *kleinhandel:* handel in diergeneesmiddelen met het oog op verstrekking aan eindgebruikers, waaronder het ter
      hand stellen aan personen die krachtens wettelijk voorschrift gerechtigd zijn een diergeneesmiddel toe te passen;
        - *officiële dierenarts:* dierenarts verbonden aan de Nederlandse Voedsel- en Warenautoriteit;
        - *onverwachte bijwerking:* bijwerking waarvan de aard, de ernst of het gevolg niet met de samenvatting van de
      kenmerken van het product verenigbaar is;
        - *primaire verpakking:* iedere vorm van verpakking die rechtstreeks met het diergeneesmiddel in aanraking komt;
        - *recept:* document dat bevat het schriftelijk of elektronisch voorschrijven van het bereiden of afleveren van een
      diergeneesmiddel of diervoeder met medicinale werking die door een dierenarts of andere daartoe gerechtigde persoon
      als bedoeld in [artikel 4.1, eerste lid, van de wet][ref8], wordt verstrekt;
        - *referentiediergeneesmiddel:* diergeneesmiddel waarvoor een eerste vergunning voor het in de handel brengen
      is afgegeven na het overleggen in Nederland of een andere EER-lidstaat van een volledig dossier als bedoeld in
      [artikel 2.3, eerste lid, onderdeel a][ref9], respectievelijk een volledig dossier als bedoeld in artikel 12, derde
      lid, van [Richtlijn 2001/82/EG](32001L0082);
        - *Richtlijn 96/22/EG:* [Richtlijn nr. 96/22/EG](31996L0022) van de Raad van de Europese Unie van 29 april 1996
      betreffende het verbod op het gebruik, in de veehouderij, van bepaalde stoffen met hormonale werking en van
      bepaalde stoffen met thyreostatische werking, alsmede van bèta-agonisten en tot intrekking van de [Richtlijnen
      81/602/EEG](31981L0602), [88/146/EEG](31988L0146) en [88/299/EEG](31988L0299) (PbEG 1996, L 125);
        - *Richtlijn 2001/82/EG:* [Richtlijn 2001/82/EG](32001L0082) van het Europees Parlement en de Raad van 6 november
      2001 tot vaststelling van een communautair wetboek betreffende geneesmiddelen voor diergeneeskundig gebruik (PbEG
      2001, L 311);
        - *Richtlijn 2004/28/EG:* [Richtlijn 2004/28/EG](32004L0028) van het Europees Parlement en de Raad van 31 maart
      2004 tot wijziging van [Richtlijn 2001/82/EG](32001L0082) tot vaststelling van een communautair wetboek betreffende
      geneesmiddelen voor diergeneeskundig gebruik (PbEU 2004, L 136);
        - *risico’s verbonden aan de diergeneeskundige toepassing:* a. elk risico voor de gezondheid
      van dieren of mensen bij toepassing overeenkomstig voorschriften, onder de gestelde werking,
      bedoeld in [artikel 2.19, derde lid, onderdeel a, van de wet][ref10] bij de opgegeven
      eigenschappen en kwalitatieve en kwantitatieve samenstelling, bedoeld in artikel 2.19, derde
      lid, onderdeel b, van de wet en b. elk risico van ongewenste effecten op het milieu als bedoel in
      [artikel 2.19, derde lid, onderdeel a, onder 2°, van de wet][ref11];
        - *uitvoer:* buiten Nederland brengen;
        - *veiligheidsverslag:* verslag dat de houder van een vergunning voor het in de handel brengen van een
      diergeneesmiddel periodiek verstrekt over onder meer alle bijwerkingen;
        - *verklaring van toegang:* document, ondertekend door een rechthebbende op voor een aanvraag relevante gegevens
      die door [Richtlijn 2001/82/EG](32001L0082) beschermd zijn, waarin verklaard wordt dat die gegevens gebruikt mogen
      worden bij een aanvraag tot verstrekking van een vergunning voor het in de handel brengen van een diergeneesmiddel
      als bedoeld in [artikel 2.19, eerste lid, van de wet][ref12];
        - *Verordening (EG) nr. 470/2009:* Verordening (EG) nr. 470/2009 van het Europees Parlement en de Raad van
      6 mei 2009 tot vaststelling van communautaire procedures voor het vaststellen van grenswaarden voor residuen van
      farmacologisch werkzame stoffen in levensmiddelen van dierlijke oorsprong, tot intrekking van Verordening (EEG)
      nr. 2377/90 van de Raad en tot wijziging van [Richtlijn 2001/82/EG](32001L0082) van het Europees Parlement en de
      Raad en van Verordening (EG) nr. 726/2004 van het Europees Parlement en de Raad (PbEG 2009, L 152);
        - *Verordening (EG) nr. 504/2008:* Verordening (EG) nr. 504/2008 van de Commissie van 6 juni 2008 ter uitvoering
      van de [Richtlijnen 90/426/EEG](31990L0426) en [90/427/EEG](31990L0427) van de Raad wat betreft methoden voor de
      identificatie van paardachtigen (PbEU 2008, L149);
        - *Verordening (EG) nr. 726/2004:* Verordening (EG) nr. 726/2004 van het Europees Parlement en de Raad van
      31 maart 2004 tot vaststelling van communautaire procedures voor het verlenen van vergunningen en het toezicht op
      geneesmiddelen voor menselijk en diergeneeskundig gebruik en tot oprichting van een Europees Geneesmiddelenbureau
      (PbEU 2004, L 136);
        - *Verordening (EU) nr. 2017/625:* verordening (EU) 2017/625 van het Europees Parlement en de Raad van 15 maart
      2017 betreffende officiële controles en andere officiële activiteiten die worden uitgevoerd om de toepassing
      van de levensmiddelen- en diervoederwetgeving en van de voorschriften inzake diergezondheid, dierenwelzijn,
      plantgezondheid en gewasbeschermingsmiddelen te waarborgen, tot wijziging van de [Verordeningen (EG) nr. 999/2001]
      (32001R0999), [(EG) nr. 396/2005](32005R0396), [(EG) nr. 1069/2009](32009R1069), [(EG) nr. 1107/2009](32009R1107),
      (EU) [nr. 1151/2012](32012R1151), (EU) [nr. 652/2014](32014R0652), (EU) [2016/429](32329R2016) en (EU) [2016/2031]
      (32031R2016) van het Europees Parlement en de Raad, de Verordeningen [(EG) nr. 1/2005](32005R0001) en [(EG) nr.
      1099/2009](32009R1099) van de Raad en de Richtlijnen [98/58/EG](31958R0098), [1999/74/EG](31974R1999), [2007/43/
      EG](31943R2007), [2008/119/EG](32019R2008) en [2008/120/EG](32020R2008) van de Raad, en tot intrekking van de
      Verordeningen [(EG) nr. 854/2004](32004R0854) en [(EG) nr. 882/2004](32004R0882) van het Europees Parlement en
      de Raad, de Richtlijnen [89/608/EEG](32508R0089), [89/662/EEG](32562R0089), [90/425/EEG](32325R0090), [91/496/
      EEG](32396R0091), [96/23/EG](31923R0096), [96/93/EG](31993R0096) en [97/78/EG](31978R0097) van de Raad en Besluit
      [92/438/EEG](32338R0092) van de Raad (verordening officiële controles) (Pb EU 2017 L 95);
        - *volledige aanvraag:* aanvraag waarbij alle vereiste documenten zijn overgelegd;
        - *wachttermijn:* termijn die, overeenkomstig de bij of krachtens de [wet][ref13] gestelde regels en de
      voorschriften bij de vergunning voor het in de handel brengen van een diergeneesmiddel, ten minste na de laatste
      toepassing van dat diergeneesmiddel aan een dier moet verstrijken alvorens tot productie van levensmiddelen,
      afkomstig van dat dier, kan worden overgegaan;
        - *werkzame stof:* substantie met een werking als omschreven onder het begrip diergeneesmiddel, bedoeld in
      [artikel 1.1 van de wet][ref14];
        - *wet:* [Wet dieren][ref15].


