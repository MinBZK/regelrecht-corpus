      1 Voor de afgifte van het certificaat scheepsgezondheidszorg B, heeft de aanvrager met goed gevolg een
      door Onze Minister erkende training en opleiding afgerond die voldoet aan [Richtlijn 92/29/EG](31992L0029)
      (Minimumvoorschriften inzake veiligheid en gezondheid ter bevordering van een betere medische hulpverlening aan
      boord van schepen); deze opleiding omvat in elk geval:

      a. kennis van de beginselen van de fysiologie, van de ziekteverschijnselen en van de therapie;

      b. elementaire kennis op het gebied van de preventieve gezondheidszorg, waaronder begrepen de hygiëne;

      c. elementaire kennis van profylactische maatregelen;

      d. praktische kennis van elementaire medische handelingen;

      e. kennis van de wijze van evacuatie van patiënten;

      f. kennis van de wijze waarop de middelen voor medische consultatie op afstand moeten worden gebruikt.

      2 Voor de afgifte van een certificaat scheepsgezondheidszorg O voldoet de aanvrager aan het eerste lid, en heeft
      ter verwerving van praktische kennis van elementaire medische handelingen, als bedoeld in het eerste lid, onderdeel
      d, een praktijk stage vervuld op een afdeling voor spoedeisende hulp in een algemeen ziekenhuis van een bij
      regeling van Onze Minister vast te stellen duur, dan wel met goed gevolg een vergelijkbare training voltooid die
      voldoet aan bij regeling van Onze Minister vast te stellen eisen.

      3 Voor de afgifte van een verlenging van de geldigheidsduur van het certificaat scheepsgezondheidszorg B heeft de
      aanvrager met goed gevolg een door Onze Minister erkende bijscholingscursus gevolgd die tenminste de in het eerste
      lid genoemde onderdelen a tot en met f omvat.

      4 Voor de afgifte van een verlenging van de geldigheidsduur van het certificaat scheepsgezondheidszorg O voldoet
      de aanvrager aan het derde lid en heeft een herhalingsstage vervuld op een afdeling voor spoedeisende hulp in
      een algemeen ziekenhuis van een bij regeling van Onze Minister vast te stellen duur, dan wel met goed gevolg een
      vergelijkbare training voltooid die voldoet aan bij regeling van Onze Minister vast te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel91
