  - number: '118'
    text: |-
      1 De kapitein en het bemanningslid aan wie, onder de verantwoordelijkheid van de kapitein, de zorg voor
      het gebruik en het beheer van de medische uitrusting is overgedragen zijn in het bezit van het certificaat
      scheepsgezondheidszorg-O (onbeperkt), bedoeld in [artikel 91, tweede lid][ref1], of, wanneer aan het schip een
      veiligheidscertificaat voor vrachtschepen dan wel veiligheidscertificaat voor passagierschepen voor beperkt
      vaargebied is afgegeven in die zin dat het schip uitsluitend reizen onderneemt in zeegebied A2, zoals omschreven
      in Hoofdstuk IV van het SOLAS-verdrag, van het certificaat scheepsgezondheidszorg-B (beperkt), bedoeld in
      [artikel 91, eerste lid][ref2].

      2 Voor de toepassing van het eerste lid worden bezitters van het kennisbewijs maritiem officier, middelbaar
      maritiem officier, stuurman werktuigkundige kleine schepen, baggeraarstuurman, wachtstuurman, stuurman grote
      zeilvaart en stuurman kleine zeilvaart en het diploma als derde stuurman voor de grote handelsvaart geacht in het
      bezit te zijn van het certificaat scheepsgezondheiszorg B.

      3 De in het eerste lid bedoelde personen volgen ten minste eenmaal in de vijf jaar een bijscholingscursus als
      bedoeld in [artikel 91, derde lid][ref3], die voor personen aan boord van vaartuigen met een veiligheidscertificaat
      voor vrachtschepen dan wel veiligheidscertificaat voor passagierschepen voor onbeperkt vaargebied mede een
      herhalingsstage, bedoeld in [artikel 91, vierde lid][ref4], omvat.

      4 Bij regeling van Onze Minister kunnen nadere regels worden gesteld ter uitvoering van dit artikel.


