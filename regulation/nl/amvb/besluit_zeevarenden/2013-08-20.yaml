  - number: '50'
    text: |-
      Een vaarbevoegdheidsbewijs als kapitein tot 3000 GT wordt afgegeven aan: de houder van het diploma als stuurman
      voor de kleine handelsvaart, afgegeven voor 3 mei 1988, die in het bezit is van:

      i. het certificaat radarnavigator, en

      ii. het algemeen certificaat voor de maritieme radiocommunicatie.
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel50
  - number: '51'
    text: |-
      Een vaarbevoegdheidsbewijs als kapitein op reizen nabij de kust, wordt afgegeven aan:

      a. de houder van het diploma als stuurman voor de kustsleepvaart, afgegeven voor de datum van het van kracht worden
      van dit besluit;

      b. de houder van het diploma als stuurman voor de beperkte kleine handelsvaart, afgegeven voor 3 mei 1988;

      c. de houder van het diploma als kapitein aannemersmaterieel met aantekening, uitgereikt krachtens artikel 8,
      derde lid, aanhef en onderdeel b, van de Wet op de zeevaartdiploma's in verband met artikel 24 van het Besluit
      Zeevaartdiploma's;

      d. de houder van het kennisbewijs schipper-machinist beperkt werkgebied, afgegeven voor de datum van het van kracht
      worden van dit besluit, die in het bezit is van:

      i. het beperkt certificaat voor de maritiem radiocommunicatie, en

      ii. een diensttijd heeft behaald van ten minste twee jaar,

      zo nodig aangevuld met de eisen die voortvloeien uit een overeenkomst met een andere staat binnen wiens territoir
      de reizen nabij de kust plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel51
  - number: '52'
    text: |-
      Een vaarbevoegdheidsbewijs als eerste stuurman tot 3000 GT wordt afgegeven aan:

      a. de houder van het diploma als stuurman voor de kleine handelsvaart, afgegeven voor 3 mei 1988, die in het bezit
      is van het algemeen certificaat voor de maritieme radiocommunicatie, en

      b. de houder van het diploma als stuurman voor de kleine handelsvaart met aantekening, uitgereikt krachtens artikel
      8, derde lid, aanhef en onderdeel a, van de Wet op de zeevaartdiploma's, in verband met artikel 23, aanhef en
      onderdeel a, van het Besluit zeevaartdiploma's, die in het bezit is van het algemeen certificaat voor de maritieme
      radiocommunicatie.
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel52
  - number: '53'
    text: |-
      Een vaarbevoegdheidsbewijs als eerste stuurman op reizen nabij de kust, wordt afgegeven aan:

      a. de houder van het diploma als stuurman voor de kustsleepvaart dan wel het diploma als stuurman voor de beperkte
      kleine handelsvaart, afgegeven voor de datum van inwerking treden van dit besluit die in het bezit is van het
      beperkt certificaat voor de maritieme radiocommunicatie;

      b. de houder van het diploma als stuurman/tweede schipper aannemersmaterieel met aantekening, uitgereikt krachtens
      artikel 8, derde lid, aanhef en onderdeel a, van de Wet op de zeevaartdiploma's, in verband met artikel 23, aanhef
      en onderdeel a, van het Besluit zeevaartdiploma's die in het bezit is van het beperkt certificaat voor de maritieme
      radiocommunicatie;

      c. de houder van het diploma als stuurman/tweede schipper aannemersmaterieel met aantekening, uitgereikt krachtens
      artikel 8, derde lid, aanhef en onderdeel b, van de Wet op de zeevaartdiploma's, in verband met artikel 24, van het
      Besluit zeevaartdiploma's die in het bezit is van het beperkt certificaat voor de maritieme radiocommunicatie; en

      d. de houder van het kennisbewijs schipper-machinist beperkt werkgebied, afgegeven voor de datum van het van kracht
      worden van dit besluit, die in het bezit is van het beperkt certificaat voor de maritieme radiocommunicatie, zo
      nodig aangevuld met de eisen die voortvloeien uit een overeenkomst met een andere staat binnen wiens territoir de
      reizen nabij de kust plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel53
  - number: '54'
    text: |-
      Een vaarbevoegdheidsbewijs als hoofdwerktuigkundige tot 3000 kW en hoofdwerktuigkundige op alle aannemersmaterieel,
      wordt afgegeven aan: de houder van het diploma als motordrijver met aantekening, uitgereikt krachtens artikel
      8, derde lid, aanhef en onderdeel a, van de Wet op de zeevaartdiploma's, in verband met artikel 23, aanhef en
      onderdeel b, van het Besluit zeevaartdiploma's, die een diensttijd heeft behaald van twee jaar.
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel54
  - number: '55'
    text: |-
      Een vaarbevoegdheidsbewijs als tweede werktuigkundige tot 3000 kW en tweede werktuigkundige op alle
      aannemersmaterieel wordt afgegeven aan:

      a. de houder van het diploma als motordrijver met aantekening, uitgereikt krachtens artikel 8, derde lid, aanhef en
      onderdeel a, van de Wet op de zeevaartdiploma's, in verband met artikel 23, aanhef en onderdeel b, van het Besluit
      zeevaartdiploma's;

      b. de houder van het diploma als scheepswerktuigkundige, uitgereikt krachtens artikel 8, derde lid, aanhef en
      onderdeel b, van de Wet op de zeevaartdiploma's, in verband met artikel 24 van het Besluit Zeevaartdiploma's;

      c. de houder van het diploma machinist aannemersmaterieel met aantekening, uitgereikt krachtens artikel 8,
      derde lid, aanhef en onderdeel b, van de Wet op de zeevaartdiploma's, in verband met artikel 24 van het Besluit
      Zeevaartdiploma's;

      d. De houder van een vrijstelling van het bezit van een diploma als scheepswerktuigkundige, voor de dienst aan
      boord van aannemersmaterieel, afgegeven op grond van artikel 11 van de Wet op de zeevaartdiploma’s zoals dit
      artikel luidde vóór 1 augustus 1988, mits hij op 1 februari 2002 tevens in het bezit was van een verklaring van
      geschiktheid en bekwaamheid als bedoeld in [artikel 119 van het Schepenbesluit 1965][ref1] zoals dit luidde vóór 1
      februari 2002.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel119
