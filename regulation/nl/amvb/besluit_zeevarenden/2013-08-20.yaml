      Voor de afgifte van het certificaat kapitein beperkt werkgebied zonder beperking in voortstuwingsvermogen, heeft de
      aanvrager met goed gevolg een door Onze Minister erkende opleiding en training kapitein beperkt werkgebied zonder
      beperking in voortstuwingsvermogen afgerond die ten minste de volgende aspecten omvat:

      a. karakteristieken van typen sleepboten;

      b. stabiliteit en krachten bij een voortstuwingsvermogen van 3000 kW en meer;

      c. technische- en milieutechnische aspecten;

      d. veiligheid van gebruikte materialen in relatie tot een voortstuwingsvermogen van 3000 kW en meer.
