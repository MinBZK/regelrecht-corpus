  - number: '106'
    text: |-
      1 Bij regeling van Onze Minister worden de medische eisen vastgesteld waaraan een keurling
      moet voldoen om in aanmerking te komen voor een geneeskundige verklaring als bedoeld in
      [artikel 40, eerste dan wel tweede lid, van de wet][ref1].

      2 Bij regeling van Onze Minister worden de procedures en andere voorschriften vastgesteld die in acht worden
      genomen bij elk van de onderzoeken, bedoeld in [artikel 105][ref2].

      3 Bij de vaststelling van medische eisen wordt bepaald ten aanzien van welke nieuwe medische eisen een ontheffing
      als bedoeld in [artikel 44, derde lid, van de wet][ref3] kan worden verleend.

      4 In afwijking van het vereiste in het eerste lid kan de Medisch Adviseur Scheepvaart aan een keurling ontheffing
      verlenen van één van de medische eisen indien naar zijn mening het niet voldoen aan die medische eis de veiligheid
      niet nadelig beïnvloedt.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0012778#Artikel105
      [ref3]: https://wetten.overheid.nl/BWBR0009124#Artikel44
