    text: |-
      Voor de afgifte van een vaarbevoegdheidsbewijs als kapitein, eerste stuurman of hoofdwerktuigkundige op grond
      van [artikel 22a van de wet][ref1] legt de aanvrager het in [artikel 92a][ref2] genoemde certificaat Wetgeving en
      Openbaar Gezag over.


