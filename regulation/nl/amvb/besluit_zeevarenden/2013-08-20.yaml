  - number: '37'
    text: |-
      Een vaarbevoegdheidsbewijs als wachtstuurman alle schepen wordt afgegeven aan officieren en oud-officieren van de
      Zeedienst der Koninklijke Marine, die in het bezit zijn van een getuigschrift van het Koninklijk Instituut voor
      de Marine en van de Zeewachtstandaard A, zoals vastgesteld door Onze Minister van Defensie, die daarna gedurende
      ten minste een jaar geplaatst zijn en dienst hebben gedaan als wachtsofficier op operationeel in de vaart zijnde
      oorlogsschepen, voor zoveel deze ervaring of een deel daarvan niet langer dan vier jaar geleden is opgedaan, en
      mits zij daarnaast in het bezit zijn van:

      a. een kennisbewijs ten aanzien van de Nederlandse en voornaamste internationale wettelijke voorschriften
      betreffende de zeescheepvaart;

      b. een kennisbewijs ten aanzien van het behandelen van lading op het niveau van wachtstuurman alle schepen, en

      c. het algemeen certificaat voor de maritieme radiocommunicatie.
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel37
  - number: '38'
    text: |-
      1 Een vaarbevoegdheidsbewijs als eerste stuurman alle schepen wordt afgegeven aan

      a. officieren en oud-officieren van de Zeedienst der Koninklijke Marine, met de rang van luitenant ter zee tweede
      klasse oudste categorie of een hogere rang, die

      1. in het bezit zijn van een getuigschrift van het Koninklijk Instituut voor de Marine;

      2. daarna gedurende ten minste vier jaar zijn geplaatst en dienst hebben gedaan als wachtsofficier op operationeel
      in de vaart zijnde oorlogsschepen, waarvan ten minste twee jaar in de evengenoemde rang of in een hogere rang, voor
      zoveel deze ervaring of een deel daarvan niet langer dan vier jaar geleden is opgedaan, en

      3. in het bezit zijn van de aantekening navigatieofficier, alsmede van:

      i. een kennisbewijs ten aanzien van de Nederlandse en voornaamste internationale wettelijke voorschriften
      betreffende de zeescheepvaart;

      ii. een kennisbewijs ten aanzien van het behandelen van lading op het niveau van wachtstuurman;

      iii. het algemeen certificaat voor de maritieme radiocommunicatie;

      iv. het certificaat radarnavigator;

      v. het certificaat scheepsmanagement-N, en

      vi. een diensttijd hebben behaald van ten minste een half jaar op schepen in de handelsvaart met een bruto-tonnage
      van 3000 of meer;

      b. de houder van een vaarbevoegdheidsbewijs, afgegeven op grond van [artikel 37][ref1], die in het bezit is van:

      i. het certificaat radarnavigator;

      ii. het certificaat scheepsmanagement-N, en

      iii. in de handelsvaart een diensttijd heeft behaald van één jaar.

      2 Een vaarbevoegdheidsbewijs als eerste stuurman op alle zeilschepen wordt afgegeven aan officieren en oud-
      officieren van de Zeedienst der Koninklijke Marine, met de rang van luitenant ter zee tweede klasse oudste
      categorie of een hogere rang, die:

      a. in het bezit zijn van een getuigschrift van het Koninklijk Instituut voor de Marine;

      b. in het bezit van het onder a genoemde getuigschrift gedurende ten minste vier jaar zijn geplaatst en dienst
      hebben gedaan als wachtsofficier op operationeel in de vaart zijnde oorlogsschepen, voor zoveel deze ervaring of
      een deel daarvan niet langer dan vier jaar geleden is opgedaan, en

      c. in het bezit zijn van de aantekening navigatieofficier, alsmede van:

      i. een kennisbewijs ten aanzien van de Nederlandse en voornaamste internationale wettelijke voorschriften
      betreffende de zeescheepvaart;

      ii. het certificaat grote zeilvaart;

      iii. het algemeen certificaat voor de maritieme radiocommunicatie, en

      iv. het certificaat radarnavigator.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel37
