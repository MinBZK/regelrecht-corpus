      Voor de afgifte van een vaarbevoegdheidsbewijs als gezel met de beperking tot de machinekamerdienst is ten minste
      vereist:

      1. het kennisbewijs als gezel machinekamerdienst; of

      2. een schriftelijke verklaring van de hoofdwerktuigkundige dat betrokkene met goed gevolg heeft aangetoond te
      voldoen aan de eisen van bekwaamheid als bedoeld in sectie A-III/4 van de STCW-Code;

      i. een ervaring heeft van ten minste een half jaar als aankomend gezel machinekamerdienst op zeeschepen;

      ii. in het bezit is van het certificaat basisveiligheidstraining, en hij

      iii. een leeftijd heeft bereikt van 16 jaar.
