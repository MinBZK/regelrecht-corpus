  - number: '120'
    text: |-
      1 Aan boord van een schip waarvan de voorgeschreven bemanning uit meer dan 9 personen bestaat, moet daarboven een
      gediplomeerde scheepskok belast zijn met de bereiding van de voeding.

      2 Onder een gediplomeerde scheepskok wordt verstaan een persoon van 18 jaar of ouder in het bezit van een door de
      Minister erkend diploma als scheepskok als bedoeld in [artikel 92][ref1].

      3 Onze Minister kan diploma's, door bevoegde autoriteiten in andere landen afgegeven op grond van het Verdrag
      betreffende het diploma van bekwaamheid als scheepskok, 1946, of van het Maritiem Arbeidsverdrag als gelijkwaardig
      aan Nederlandse diploma's erkennen.

      4 Onze Minister kan op een daartoe strekkend verzoek van de scheepsbeheerder in bijzondere omstandigheden
      ontheffing verlenen van de in het eerste lid bedoelde verplichting tot het gediplomeerd zijn van de scheepskok,
      indien de persoon ten aanzien van wie de ontheffing wordt verzocht een opleiding heeft genoten of instructies heeft
      gekregen op het gebied van voeding, persoonlijke hygiëne en de behandeling en opslag van levensmiddelen aan boord
      van schepen. De ontheffing geldt voor een specifiek tijdvak van ten hoogste een maand of tot aan het afmeren in de
      volgende aanloophaven.

      5 Aan een in het vierde lid bedoelde ontheffing kunnen voorschriften worden verbonden. Indien de voorschriften niet
      worden nageleefd kan Onze Minister een verleende ontheffing tussentijds intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel92
