  - number: 120a
    text: |-
      Aan boord van een schip waarvan de voorgeschreven bemanning uit minder dan tien personen bestaat, heeft eenieder
      die in de kombuis levensmiddelen verwerkt een opleiding genoten of instructie gekregen op het gebied van voeding,
      persoonlijke hygiëne en de behandeling en opslag van levensmiddelen aan boord van schepen.
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel120a
  - number: '121'
    text: |-
      1 Aan boord van een schip dat reizen onderneemt buiten het zeegebied A1, zoals omschreven in Hoofdstuk IV van
      het SOLAS-verdrag, is ten minste één persoon die als chef van de wacht, bedoeld in Sectie A-VIII/2, part 1, van
      de STCW-Code, kan optreden in het bezit van een algemeen certificaat maritieme radio-communicatie, afgegeven in
      overeenstemming met het bepaalde bij of krachtens het [Frequentiebesluit 2013][ref1]; een van deze personen is
      door de kapitein aangewezen als de verantwoordelijke persoon voor de afhandeling van radioberichtgeving tijdens
      noodgevallen. Alle andere personen die als chef van de wacht kunnen optreden zijn in het bezit zijn van het
      beperkte certificaat maritieme radiocommunicatie

      2 Aan boord van een schip dat uitsluitend reizen onderneemt in zeegebied A1, is ten minste één der personen die als
      chef van de wacht kunnen optreden in het bezit van het beperkt certificaat maritieme radiocommunicatie, afgegeven
      in overeenstemming met het bepaalde bij of krachtens het [Frequentiebesluit 2013][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032895
      [ref2]: https://wetten.overheid.nl/BWBR0032895
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel121
