      1 Bij regeling van Onze Minister wordt bepaald welke personen naast de kapitein bevoegd zijn tot het maken van de
      daarbij genoemde aanvullende aantekeningen of van wijzigingen in een monsterboekje of een voorlopig monsterboekje.

      2 Een monsterboekje of een voorlopig monsterboekje, waarin een ander dan een van de in het eerste lid bedoelde
      personen de daarbij genoemde aantekeningen of wijzigingen heeft aangebracht, is ongeldig.

      3 Degene, die onbevoegd aantekeningen of wijzigingen heeft aangebracht in een monsterboekje, draagt de kosten van
      de vervanging van dat monsterboekje.
