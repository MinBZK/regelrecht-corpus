      Onverminderd [artikel 8][ref1], geeft het bezit van het kennisbewijs als stuurman tot 3000 GT de aanvrager recht op
      het vaarbevoegdheidsbewijs als:

      a. eerste stuurman tot 3000 GT en eerste stuurman op alle aannemersmaterieel, indien hij in het bezit is van het
      algemeen certificaat voor de maritieme radiocommunicatie en de leeftijd heeft bereikt van 18 jaar;

      b. kapitein tot 3000 GT en kapitein op alle aannemersmaterieel, indien hij naast het certificaat genoemd onder a,
      in het bezit is van het certificaat radarnavigator, het certificaat scheepsmanagement-N en een diensttijd heeft van
      drie jaar als stuurman, dan wel twee jaar als stuurman, waarvan ten minste één jaar als eerste stuurman.


