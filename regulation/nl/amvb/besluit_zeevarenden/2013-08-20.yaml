      1 Voor de afgifte van het certificaat »Wetgeving en Openbaar Gezag» heeft de aanvrager met goed gevolg een door
      Onze Minister erkende opleiding wetgeving en openbaar gezag afgerond.

      2 Deze opleiding omvat in elk geval:

      a. kennis en inzicht in de Nederlandse wetgeving op de scheepvaart betrekking hebbende;

      b. kennis van de bepalingen en handleidingen inzake het uitoefenen van openbaar gezag aan boord, alsmede
      vaardigheid in de toepassing hiervan, en

      c. kennis van de maatregelen te nemen ter beveiliging van het schip en vaardigheid in het optreden in havens en op
      zee wat betreft veiligheidsaangelegenheden.
