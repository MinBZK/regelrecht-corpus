      Onverminderd [artikel 8][ref1], geeft het bezit van het kennisbewijs als baggeraar-machinist of als
      wachtwerktuigkundige alle schepen de aanvrager recht op het vaarbevoegdheidsbewijs voor alle schepen als:

      1. wachtwerktuigkundige, indien hij de leeftijd heeft bereikt van 18 jaar;

      2. tweede werktuigkundige, indien hij een diensttijd heeft van een jaar als werktuigkundige of als assistent-
      werktuigkundige in het kader van een opleiding tot werktuigkundige;

      3. hoofdwerktuigkundige, indien hij in het bezit is van

      i. het certificaat scheepsmanagement-W, en

      ii. een diensttijd heeft van drie jaar als werktuigkundige, waarvan ten minste een jaar in het bezit van de
      bevoegdheid als tweede werktuigkundige.


