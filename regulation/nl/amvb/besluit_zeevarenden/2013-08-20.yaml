  - number: '99'
    text: |-
      1 Alvorens het monsterboekje af te geven, met uitzondering van het voorlopig monsterboekje als bedoeld in
      [artikel 101, eerste lid, onder a][ref1], tekent Onze Minister in elk geval de volgende gegevens erin aan:

      a. van de houder:

      1°. naam en voornamen;

      2°. plaats en datum van geboorte;en

      3°. nationaliteit.

      b. de plaats en datum van afgifte;

      c. de datum, waarop de geldigheid vervalt.

      2 Voorts bevat het monsterboekje:

      a. een pasfoto als bedoeld in [artikel 98, eerste lid, onderdeel b][ref2];

      b. de handtekening van de houder.

      3 Een monsterboekje is slechts geldig indien het de handtekening van de houder bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0012778#Artikel98
