  - number: '117'
    text: |-
      1 De kapitein van elk schip draagt er zorg voor dat voor het ondernemen van een reis en gedurende de reis
      overeenkomstig Hoofdstuk III/10 van het SOLAS-verdrag voldoende sloepsgasten aan boord zijn die in het bezit zijn
      van het certificaat, bedoeld in [artikel 88][ref1].

      2 Voor de toepassing van het eerste lid worden kapiteins, stuurlieden en maritieme officieren geacht in het bezit
      te zijn van het certificaat als sloepsgast.

      3 De kapitein van elk schip dat is uitgerust met snelle hulpverleningsboten draagt er zorg voor dat voor het
      ondernemen van een reis en gedurende de reis voor iedere snelle hulpverleningsboot tenminste twee bemanningsleden
      beschikbaar zijn in het bezit van het certificaat van bekwaamheid in het gebruik van snelle hulpverleningsboten als
      bedoeld in [artikel 89][ref2].


