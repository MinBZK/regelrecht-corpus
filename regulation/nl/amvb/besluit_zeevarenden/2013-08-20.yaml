        paragraaf: '6'
  - number: '36'
    text: |-
      1 Kapiteins, stuurlieden en maritiem officieren van zeilschepen met een lengte van 40 meter of meer zijn, naast
      één der in [artikel 11, eerste, tweede of derde lid][ref1], genoemde kennisbewijzen of diploma’s in het bezit van
      het certificaat grote zeilvaart, dan wel in bezit van het in [artikel 11, vijfde lid][ref2], genoemde kennisbewijs
      grote zeilvaart.

      2 Bij regeling van Onze Minister worden regels gesteld met betrekking tot de bemanning van zeilschepen met een
      lengte van minder dan 40 meter.

      3 Onze Minister draagt er zorg voor dat op het vaarbevoegdheidsbewijs van kapiteins, stuurlieden en maritiem
      officieren die voldoen aan het eerste lid van dit artikel, de betreffende aantekening wordt gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel11
