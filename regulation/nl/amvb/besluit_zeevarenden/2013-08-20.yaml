    text: |-
      1 Voor de uitoefening door bemanningsleden van speciale taken en verantwoordelijkheden met betrekking tot de lading
      en de daarbij behorende uitrusting op tankschepen, is vereist:

      a. het bezit van een certificaat brandbestrijding in aanvulling op de opleiding en training die is voorgeschreven
      in [artikel 87][ref1];

      b. ten minste drie maanden goedgekeurde diensttijd op tankschepen; of

      c. een erkende cursus hebben gevolgd om zich vertrouwd te maken met de dienst aan boord van tankschepen, waarin
      ten minste het programma voor de cursus vervat in sectie AV/1, de paragrafen 2 tot en met 7, van de STCW-Code is
      behandeld.

      2 Onze Minister is bevoegd in plaats van de diensttijd, bedoeld in het eerste lid, onderdeel b, een kortere
      diensttijd toe te staan, onder voorwaarde dat:

      a. de diensttijd niet korter is dan een maand;

      b. het tankschip waarop de diensttijd is doorgebracht een bruto tonnage heeft van minder dan 3000;

      c. de duur van elke reis van het tankschip gedurende die periode niet langer is dan 72 uur, en

      d. de operationele kenmerken van het tankschip, het aantal reizen en het aantal beladingen en lossingen die
      gedurende deze periode worden gedaan, het mogelijk maken hetzelfde niveau van kennis en ervaring te verkrijgen.

      3 Kapiteins, eerste maritiem officieren, eerste stuurlieden, hoofdwerktuigkundigen, tweede werktuigkundigen en
      voorts iedereen die rechtstreeks verantwoordelijk is voor het laden, lossen en de te nemen voorzorgsmaatregelen
      tijdens de reis of de behandeling van de lading, voldoen naast het in het eerste lid, onderdelen b of c bepaalde,
      aan het volgende:

      a. zij hebben een ervaring van ten minste een half jaar op het gebied van hun taken op het type tankschip waarop
      zij varen, en

      b. zij zijn in het bezit van een voor het type tankschip bestemd veiligheidstrainingscertificaat, zoals is
      voorgeschreven in [artikel 71][ref2], [72][ref3] of [73][ref4];

      4 Onze Minister draagt er zorg voor dat op het vaarbevoegdheidsbewijs van kapiteins en officieren die voldoen aan
      het eerste, tweede of derde lid, de desbetreffende aantekening wordt gemaakt.


