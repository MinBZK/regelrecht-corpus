    text: |-
      Voor de afgifte van het kennisbewijs aanvulling stuurman handelsvaart is de aanvrager in het bezit van het
      kennisbewijs stuurman grote zeilvaart en

      a. voldoet hij tevens aan:

        - voorschrift II/1, de paragrafen 2.4.en 2.5 van de bijlage bij het STCW-Verdrag;
        - voorschrift II/2, paragraaf 2.2 van de bijlage bij het STCW-Verdrag;
        - voorschrift V/1, paragraaf 1.2, van de bijlage bij het STCW-Verdrag;

      b. heeft hij met goed gevolg examen afgelegd ter afsluiting van een opleiding die ten minste voldoet aan:

        - sectie A-II/1,de paragrafen 1 tot en met 6 van de STCW-Code in het bijzonder de functie behandeling en stuwen
      van lading;
        - sectie A-II/2, de paragrafen 1 tot en met 7, van de STCW-Code, in het bijzonder de functie behandeling en stuwen
      van lading en met uitzondering van de aspecten coördinatie reddingsacties, opstellen wachtschema's en orders,
      radarnavigatie, reageren op noodsituaties en personeelsmanagement; en
        - sectie A-V/1, de paragrafen 2 tot en met 7 van de STCW-Code.
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel60
  - number: '61'
    text: |-
