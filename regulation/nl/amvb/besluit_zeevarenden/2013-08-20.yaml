      1 Voor de afgifte van een type rating certificate voor de dienst aan boord van een hogesnelheidsvaartuig bestemd
      of gebezigd voor het vervoer van 36 passagiers of meer heeft de houder van tenminste het kennisbewijs wachtstuurman
      of wachtwerktuigkundige dan wel het diploma als derde stuurman voor de grote handelsvaart of het diploma A als
      scheepswerktuigkundige, met goed gevolg een door Onze Minister erkende opleiding en training afgerond die voldoet
      aan voorschrift 18.3.3 van de High Speed Craft Code.

      2 Voor de afgifte van een type rating certificate voor de dienst aan boord van een hogesnelheidsvaartuig bestemd
      of gebezigd voor het vervoer van minder dan 36 passagiers heeft de houder van tenminste het kennisbewijs schipper-
      machinist beperkt werkgebied met goed gevolg een door Onze Minister erkende opleiding en training afgerond die
      voldoet aan voorschrift 18.3.3 van de High Speed Craft Code.

      3 Een *type rating certificate* heeft een geldigheidsduur van maximaal twee jaar. Na afloop van de geldigheidsduur
      kan de geldigheid van het certificaat telkenmale met een periode van maximaal twee jaar worden verlengd mits de
      betrokkene aantoont dat hij in de afgelopen twee jaar tenminste een half jaar heeft dienst gedaan aan boord van
      het, in het certificaat genoemde, hogesnelheidsvaartuig.
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel85
  - number: '86'
    text: |-
      1 Voor afgifte van het certificaat grote zeilvaart voor de dienst aan boord van zeilschepen met een lengte
      van 40 meter of meer heeft de houder van een diploma of kennisbewijs als bedoeld in de [artikelen 58][ref1],
      [59][ref2], [62][ref3] of [63][ref4] met goed gevolg examen afgelegd ter afsluiting van een door Onze Minister
      erkende opleiding in de aspecten scheepsvormen, materialen en tuigage, behandeling van zeilschepen en dynamische
      stabiliteit van zeilschepen.

      2 Voor de afgifte van het kennisbewijs stuurman grote zeilvaart voldoet de aanvrager aan:

        - voorschrift II/1, paragrafen 2.4 en 2.5 van de bijlage bij het STCW-verdrag;
        - voorschrift II/2, paragraaf 4.3 van de bijlage bij het STCW-verdrag;
        - voorschrift IV/2, paragraaf 2.2 van de bijlage bij het STCW-verdrag; en
        - voorschrift VI/1 van de bijlage bij het STCW-verdrag;

      en heeft de aanvrager met goed gevolg examen afgelegd ter afsluiting van een opleiding die ten minste voldoet aan:

        - sectie A-II/1, de paragrafen 1 tot en met 6, van de STCW-Code, met uitzondering van de functie behandeling en
      stuwen van lading;
        - sectie A-II/2, de paragrafen 1 tot en met 7, van de STCW-Code, met uitzondering van de functie behandeling
      en stuwen van lading, en onder toevoeging van de aspecten materialen en tuigage, scheepsvormen, behandeling van
      zeilschepen en dynamische stabiliteit van zeilschepen,

      en heeft de aanvrager een vaartijd behaald van tenminste een jaar waarvan tenminste één seizoen aan boord van
      zeilschepen is doorgebracht en heeft hij in deze periode ten minste een half jaar wachtdienst op de brug gelopen
      onder toezicht van de kapitein, een bevoegde stuurman of een bevoegd maritiem officier.

      3 Bij regeling van Onze Minister worden regels gesteld met betrekking tot de beroepsvereisten voor de dienst aan
      boord van zeilschepen met een lengte van minder dan 40 meter.


