  - number: '16'
    text: |-
      Onverminderd [artikel 8][ref1], geeft het bezit van het kennisbewijs als stuurman-werktuigkundige kleine schepen de
      aanvrager recht op het vaarbevoegdheidsbewijs als:

      a. maritiem officier kleine schepen en maritiem officier op alle aannemersmaterieel;

      b. eerste stuurman tot 3000 GT en eerste stuurman op alle aannemersmaterieel, indien hij in het bezit is van het
      algemeen certificaat voor de maritieme radiocommunicatie en hij de leeftijd heeft bereikt van 18 jaar;

      c. tweede werktuigkundige tot 3000 kW en tweede werktuigkundige op alle aannemersmaterieel, indien hij de leeftijd
      heeft bereikt van 18 jaar en een diensttijd heeft van een jaar als werktuigkundige of als assistent-werktuigkundige
      in het kader van een opleiding tot maritiem officier kleine schepen;

      d. hoofdwerktuigkundige tot 3000 kW en hoofdwerktuigkundige op alle aannemersmaterieel, indien hij een diensttijd
      heeft van twee jaar als maritiem officier of als werktuigkundige, waarvan ten minste één jaar in het bezit van de
      bevoegdheid als tweede werktuigkundige;

      e. eerste maritiem officier kleine schepen en eerste maritiem officier op alle aannemersmaterieel, indien hij naast
      het certificaat genoemd in onderdeel b, een diensttijd heeft van twee jaar als maritiem officier;

      f. kapitein tot 3000 GT en kapitein op alle aannemersmaterieel, indien hij naast het certificaat genoemd in
      onderdeel b, in het bezit is van het certificaat radarnavigator, het certificaat scheepsmanagement-N, alsmede een
      diensttijd heeft van twee jaar als stuurman of maritiem officier, waarvan ten minste één jaar als eerste stuurman
      of eerste maritiem officier.


