        - sectie A-II/3, paragraaf 1, 2, 3, 4, 5 en 7 van de STCW-Code waaronder niet begrepen het bij verwijzing bepaalde
      in de secties A-VI/2, A-VI/3 en A-VI/4 van de STCW-Code;
        - sectie A-VI/1, paragraaf 2 van de STCW-Code, en heeft de aanvrager:
        - een goedgekeurde stage van ten minste een half jaar aan boord vervuld als onderdeel van de onder b bedoelde
      opleiding, onder bijhouding van een goedgekeurd stageboek, en tijdens deze stage gedurende ten minste een half jaar
      wachtdienst op de brug gelopen onder toezicht van de kapitein, van een bevoegde stuurman of een bevoegd maritiem
      officier.
