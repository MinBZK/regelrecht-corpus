  - number: '11'
    text: |-
      1 De kennisbewijzen voor de afgifte van een vaarbevoegdheidsbewijs om daarmee dienst te kunnen doen aan boord van
      schepen in de functie van kapitein, maritiem officier of stuurman zijn in neerdalende lijn:

      a. hoger maritiem officier;

      b. middelbaar maritiem officier; baggeraar-stuurman of wachtstuurman;

      c. stuurman-werktuigkundige kleine schepen of stuurman tot 3000 GT;

      d. schipper-machinist beperkt werkgebied.

      2 a. Met het kennisbewijs middelbaar maritiem officier wordt voor de verkrijging van een vaarbevoegdheidsbewijs
      gelijkgesteld het diploma als derde stuurman voor de grote handelsvaart tezamen met het diploma A als
      scheepswerktuigkundige.

      b. Met het kennisbewijs wachtstuurman wordt voor de verkrijging van een vaarbevoegdheids-bewijs gelijkgesteld het
      kennisbewijs stuurman grote zeilvaart tezamen met het kennisbewijs aanvulling stuurman handelsvaart.

      3 De diploma's, bedoeld in de Wet op de zeevaartdiploma's voor de afgifte van een vaarbevoegdheidsbewijs om daarmee
      dienst te kunnen doen aan boord van schepen in de functie van kapitein of stuurman zijn in neerdalende lijn:

      a. diploma als eerste stuurman voor de grote handelsvaart;

      b. diploma als tweede stuurman voor de grote handelsvaart;

      c. diploma als stuurman voor de grote sleepvaart;

      d. diploma als derde stuurman voor de grote handelsvaart.

      4 Met het diploma als derde stuurman voor de grote handelsvaart wordt voor de verkrijging van een
      vaarbevoegdheidsbewijs gelijkgesteld het diploma als stuurman voor de kleine handelsvaart tezamen met het
      aanvullingsdiploma als stuurman voor de kleine handelsvaart.

      5 Voor de dienst aan boord van zeilschepen wordt met het kennisbewijs wachtstuurman in combinatie met het
      certificaat grote zeilvaart, bedoeld in [artikel 86 van dit besluit][ref1], gelijkgesteld het kennisbewijs grote
      zeilvaart.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel86
