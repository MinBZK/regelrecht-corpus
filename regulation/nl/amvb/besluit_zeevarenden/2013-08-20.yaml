  - number: '107'
    text: |-
      1 Een geneeskundige verklaring van geschiktheid voor de zeevaart als bedoeld in [artikel 40 van de wet][ref1]
      wordt afgegeven met een geldigheidsduur van ten hoogste twee jaar dan wel een jaar indien het een verklaring met
      betrekking tot een persoon onder de leeftijd van achttien jaar betreft.

      2 Op medische gronden kan de keuringsarts een geneeskundige verklaring van geschiktheid voor de zeevaart als
      bedoeld in [artikel 40 van de wet][ref2] afgeven voor een kortere duur dan die, genoemd in het eerste lid.

      3 De keuringsarts kan voorts een geneeskundige verklaring van geschiktheid voor de zeevaart als bedoeld in artikel
      40 van de wet afgeven voor een beperkt vaargebied.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel40
