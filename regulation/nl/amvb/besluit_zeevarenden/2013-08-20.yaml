  - number: '39'
    text: |-
      1 Een vaarbevoegdheidsbewijs als kapitein alle schepen wordt afgegeven aan de houder van een bevoegdheid afgegeven
      op grond van [artikel 38, eerste lid][ref1], die een diensttijd heeft behaald van een jaar als eerste stuurman.

      2 Een vaarbevoegdheidsbewijs als kapitein alle zeilschepen wordt afgegeven aan de houder van een bevoegdheid
      afgegeven op grond van [artikel 38, tweede lid][ref2], die een diensttijd heeft behaald van een jaar als eerste
      stuurman aan boord van zeilschepen.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0012778#Artikel38
