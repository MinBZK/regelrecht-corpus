    text: |-
      1 Dit artikel is van toepassing op kapiteins, maritiem officieren, stuurlieden, werktuigkundigen en ander personeel
      aan boord van passagiersschepen.

      2 Alvorens hun taken aan boord van passagiersschepen worden opgedragen is er voor de betrokken zeevarenden een door
      Onze Minister goedgekeurd schriftelijk bewijs waaruit blijkt dat zij de opleiding en training, zoals vereist in
      het vierde tot en met het achtste lid, in overeenstemming met hun hoedanigheid, taken en verantwoordelijkheden, met
      goed gevolg hebben voltooid.

      3 Zeevarenden van wie verlangd wordt dat zij een opleiding hebben gevolgd in overeenstemming met het vierde,
      zevende en achtste lid, volgen passende herhalingscursussen met tussenpozen van niet meer dan vijf jaar of tonen
      aan dat zij in de afgelopen vijf jaar tenminste één jaar dienst hebben gedaan aan boord van passagierschepen.

      4 Voor personeel aan boord van passagiersschepen, aan wie in de alarmrol de taak wordt opgedragen om passagiers bij
      te staan in noodsituaties, is er het bewijs dat zij de training in groepsbegeleiding, bedoeld in [artikel 74][ref1]
      hebben voltooid.

      5 Voor kapiteins, maritiem officieren, stuurlieden, werktuigkundigen en ander personeel aan boord van
      passagiersschepen dat belast is met bijzondere taken en verantwoordelijkheden, is er het bewijs dat zij de
      familiarisatie-training voor het betreffende passagiersschip, bedoeld in [artikel 75][ref2], hebben voltooid.

      6 Voor personeel aan boord van passagiersschepen dat in de passagiersruimten direct betrokken is bij de
      dienstverlening aan passagiers, is er het bewijs dat zij de veiligheidstraining, bedoeld in [artikel 76][ref3],
      hebben voltooid.

      7 Kapiteins, eerste maritiem officieren, eerste stuurlieden en iedereen die aan boord van passagiersschepen
      die is belast met de directe verantwoordelijkheid voor het aan en van boord gaan van passagiers, het laden,
      lossen of vastzetten van de lading, zijn in het bezit van het certificaat passagiersveiligheid, bedoeld in
      [artikel 77][ref4].

      8 Kapiteins, eerste stuurlieden, eerste maritiem officieren, hoofdwerktuigkundigen, tweede werktuigkundigen
      en anderen aan boord van passagiersschepen die verantwoordelijkheid dragen voor de veiligheid van passagiers
      in noodsituaties zijn in het bezit van het certificaat crisisbeheersing en menselijk gedrag, bedoeld in
      [artikel 78][ref5].


