  - number: '34'
    text: |-
      1 Werktuigkundigen en maritiem officieren aan boord van schepen voorzien van een stoomvoortstuwingsinstallatie, met
      een voortstuwingsvermogen van 3000 kW of meer, hebben een erkende opleiding stoomvoortstuwing voltooid, bedoeld in
      artikel 84.

      2 Het eerste lid is niet van toepassing voor houders van het diploma C als scheepswerktuigkundige dan wel het
      diploma B als scheepswerktuigkundige, uitgereikt voor 1 januari 1989.

      3 Aan werktuigkundigen en maritiem officieren die voldoen aan het eerste lid wordt een kennisbewijs uitgereikt.

      4 Onze Minister draagt er zorg voor dat op het vaarbevoegdheidsbewijs van werktuigkundigen en maritiem officieren
      die voldoen aan dit artikel, de betreffende aantekening wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel34
  - number: '35'
    text: |-
      Kapiteins, maritiem officieren, stuurlieden en werktuigkundigen van hogesnelheidsvaartuigen zijn in het bezit van
      een *type rating certificate,* bedoeld in [artikel 85][ref1] voor het hogesnelheidsvaartuig waarop zij dienstdoen.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel85
