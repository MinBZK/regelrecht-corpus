    text: |-
      Een vaarbevoegdheidsbewijs als gezel wordt afgegeven aan: de houder van het certificaat scheepstechnicus,
      uitgereikt door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel56
  - number: '57'
    text: |-
      1 Een kennisbewijs wordt afgegeven door:

      a. een op grond van de [Wet op het hoger onderwijs en wetenschappelijk onderzoek (WHW)][ref1] bekostigde of
      aangewezen hogeschool, waarvan ten aanzien van de onderwijs- en examenregeling voor de nautische beroepen overleg
      is gevoerd, bedoeld in artikel 5.5 van de WHW;

      b. een instelling als bedoeld in de [Wet educatie en beroepsonderwijs, (WEB)][ref2] die nautische
      beroepsopleidingen verzorgd waarvoor door de Minister van Onderwijs, Cultuur en Wetenschappen in overeenstemming
      met Onze Minister eindtermen zijn vastgesteld, zoals bedoeld in [artikel 7.2.4 van de WEB][ref3]; of

      c. een door Onze Minister erkende opleiding of exameninstelling.

      2 Een certificaat wordt afgegeven door het bevoegd gezag van een door Onze Minister erkende opleiding, training,
      exameninstelling of een certificerende instelling op het gebied van persoonscertificatie.


