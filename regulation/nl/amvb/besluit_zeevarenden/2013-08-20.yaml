  - number: '32'
    text: |-
      1 In afwijking van [artikel 30][ref1] is dit artikel uitsluitend van toepassing op de bemanningsleden aan boord van
      ro-ro passagiersschepen.

      2 Alvorens hun taken aan boord van ro-ro passagiersschepen worden opgedragen zijn zeevarenden in het bezit van een
      document waaruit blijkt dat zij de opleiding en training, zoals vereist in het vierde tot en met het achtste lid,
      in overeenstemming met hun hoedanigheid, taken en verantwoordelijkheden, met goed gevolg hebben voltooid.

      3 Zeevarenden van wie verlangd wordt dat zij een opleiding en training hebben gevolgd in overeenstemming met het
      vierde, het zevende en het achtste lid, volgen passende herhalingscursussen met tussenpozen van niet meer dan vijf
      jaar of tonen aan dat zij in de voorafgaande vijf jaar tenminste één jaar dienst hebben gedaan aan boord van ro-
      ro passagierschepen.

      4 Kapiteins, maritiem officieren, stuurlieden, werktuigkundigen en ander personeel aan boord van ro-ro
      passagiersschepen aan wie in de alarmrol de taak wordt opgedragen om passagiers bij te staan in noodsituaties, zijn
      in bezit van het bewijs groepsbegeleiding, bedoeld in [artikel 79][ref2].

      5 Kapiteins, maritiem officieren, stuurlieden, werktuigkundigen en ander personeel aan boord van ro-ro
      passagiersschepen dat belast is met bijzondere taken en verantwoordelijkheden, zijn in het bezit van het bewijs
      familiarisatietraining voor het betreffende ro-ro passagiersschip, bedoeld in [artikel 80][ref3].

      6 Personeel aan boord van ro-ro passagiersschepen dat in de passagiersruimten direct betrokken is bij de
      dienstverlening aan passagiers, is in het bezit van het bewijs veiligheidstraining, bedoeld in [artikel 81][ref4].

      7 Kapiteins, eerste maritiem officieren, eerste stuurlieden, hoofdwerktuigkundigen, tweede werktuigkundigen en
      iedereen aan boord van ro-ro passagiersschepen, die belast is met de directe verantwoordelijkheid voor het aan
      en van boord gaan van passagiers, het laden, lossen of vastzetten van de lading of het sluiten van openingen in
      de romp zijn in het bezit van het certificaat passagiersveiligheid, ladingveiligheid en integriteit van de romp,
      bedoeld in [artikel 82][ref5].

      8 Kapiteins, eerste maritiem officieren, eerste stuurlieden, hoofdwerktuigkundigen, tweede werktuigkundigen
      en iedereen aan boord van ro-ro passagiersschepen die verantwoordelijkheid draagt voor de veiligheid van
      passagiers in noodsituaties zijn in het bezit van het certificaat crisisbeheersing en menselijk gedrag, bedoeld
      in [artikel 83][ref6].


