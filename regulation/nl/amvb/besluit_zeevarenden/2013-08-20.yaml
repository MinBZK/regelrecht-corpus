      Onverminderd [artikel 8][ref1], geeft het bezit van het kennisbewijs als werktuigkundige tot 3000 kW de aanvrager
      recht op het vaarbevoegdheidsbewijs als:

      a. tweede werktuigkundige tot 3000 kW en tweede werktuigkundige op alle aannemersmaterieel, indien hij de leeftijd
      heeft bereikt van 18 jaar en een diensttijd heeft van ten minste een jaar als werktuigkundige of als assistent-
      werktuigkundige in het kader van een opleiding tot werktuigkundige;

      b. hoofdwerktuigkundige tot 3000 kW en hoofdwerktuigkundige op alle aannemersmaterieel, mits hij een diensttijd
      heeft van twee jaar als werktuigkundige, waarvan tenminste één jaar in het bezit van de bevoegdheid als tweede
      werktuigkundige.


