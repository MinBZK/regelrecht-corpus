      - id: ref1
        bwb_id: BWBR0012778
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: '42'
    text: |-
      Een vaarbevoegdheidsbewijs als tweede werktuigkundige alle schepen wordt afgegeven aan officieren en gewezen
      officieren van de Technische Dienst van de Koninklijke Marine, die

      1. in het bezit zijn van het getuigschrift van het Koninklijk Instituut voor de Marine, en

      2. daarna ten minste een jaar dienst hebben gedaan op operationeel in de vaart zijnde oorlogsschepen, voor zoveel
      deze ervaring of een deel daarvan niet langer dan vier jaar geleden is opgedaan.
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel42
  - number: '43'
    text: |-
      Een vaarbevoegdheidsbewijs als hoofdwerktuigkundige alle schepen wordt afgegeven aan:

      a. officieren en gewezen officieren van de Technische Dienst, die

      1. in het bezit zijn van een getuigschrift van het Koninklijk Instituut voor de Marine, en

      2. daarna ten minste vijf jaar dienst hebben gedaan op operationeel in de vaart zijnde oorlogsschepen, voor zoveel
      deze ervaring of een deel daarvan niet langer dan vier jaar geleden is, en

      3. in het bezit zijn van het certificaat scheepsmanagement-W;

      b. de houder van een bevoegdheid afgegeven op grond van [artikel 42][ref1], die een diensttijd heeft behaald van:

      1. drie jaar als werktuigkundige, waarvan ten minste een jaar in het bezit van de bevoegdheid als tweede
      werktuigkundige, en

      2. in het bezit is van het certificaat scheepsmanagement-W.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel42
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '42'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: '44'
    text: |-
      Een vaarbevoegdheidsbewijs als wachtwerktuigkundige alle schepen en tweede werktuigkundige tot 3000 kW wordt
      afgegeven aan onderofficieren van de Technische Dienst Werktuigtechniek of Systemen en oud-onderofficieren
      Technische Dienst Werktuigtechniek of Systemen, die

      1. de rang van korporaal of hoger hebben bekleed, en

      2. ten minste een jaar dienst hebben gedaan op operationeel in de vaart zijnde oorlogsschepen, voor zoveel deze
      ervaring of een deel daarvan niet langer dan vier jaar geleden is.
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel44
  - number: '45'
    text: |-
      Een vaarbevoegdheidsbewijs als hoofdwerktuigkundige tot 3000 kW wordt afgegeven aan de houder van een
      vaarbevoegdheidsbewijs afgegeven op grond van [artikel 44][ref1], die een diensttijd heeft behaald van twee jaar,
      waarvan ten minste een jaar in het bezit van de bevoegdheid als tweede werktuigkundige.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel44
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '44'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: '46'
    text: |-
      Op de verkrijging van vaarbevoegdheidsbewijzen door de officieren, oud-officieren, onderofficieren en oud-
      onderofficieren die in deze paragraaf worden genoemd, is [artikel 8][ref1], met uitzondering van het eerste en het
      zevende lid, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel8
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '47'
    text: |-
      In plaats van de Zeewachtstandaard A of de Zeewachtstandaard M, genoemd in [artikel 37][ref1], onderscheidenlijk
      [artikel 40][ref2], kan de aanvrager van een vaarbevoegdheidsbewijs een ander door Onze Minister van Defensie
      afgegeven document overleggen, waaruit blijkt dat de betrokkene over een gelijkwaardig niveau van kennis en inzicht
      beschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0012778#Artikel40
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0012778
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: '48'
    text: |-
      Bij regeling van Onze Minister kunnen, na overleg met Onze Minister van Defensie, zo nodig in afwijking van
      de [artikelen 37 tot en met 47][ref1], regels worden vastgesteld voor de verkrijging van vaarbevoegdheden door
      officieren en schepelingen der Koninklijke Marine die dienst doen aan boord van een zeeschip dat met kustwachttaken
      is belast.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel37
