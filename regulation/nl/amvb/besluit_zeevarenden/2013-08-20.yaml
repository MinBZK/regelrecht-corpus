  - number: '110'
    text: |-
      1 Een geneeskundige kan Onze Minister verzoeken hem aan te wijzen als keuringsarts of, met betrekking
      tot medische keuringen als bedoeld in [artikel 40, tweede lid, van de wet][ref1], te erkennen
      als keuringsarts. Bij het verzoek wordt een geldig bewijs van registratie als arts, bedoeld in de
      [Wet op de beroepen in de individuele gezondheidszorg][ref2], overgelegd.

      2 Indien het verzoek is ingediend door een geneeskundige die in het buitenland zijn praktijk houdt, vergewist de
      Medisch Adviseur Scheepvaart zich van diens vakbekwaamheid.

      3 Onze Minister gaat niet over tot aanwijzing of erkenning van een geneeskundige indien diens onafhankelijkheid
      ten opzichte van werkgevers, werknemers of hun organisaties niet gewaarborgd is, of ingeval diens professionele
      kundigheden, praktijkervaring of beroepsuitrusting naar het oordeel van de Medisch Adviseur Scheepvaart,
      ressorterend onder Onze Minister, ontoereikend zijn.

      4 Bij het besluit van Onze Minister over de aanwijzing of erkenning worden het aantal reeds aangewezen of erkende
      geneeskundigen en de spreiding over het land in relatie tot de regionale of plaatselijke behoefte in aanmerking
      genomen.

      5 De aanwijzing of erkenning als keurend arts wordt afgegeven voor een periode van ten hoogste vijf jaren. Na
      afloop van deze periode kan een hernieuwd verzoek om aanwijzing of erkenning als keurend arts worden ingediend;
      bij dit hernieuwde verzoek wordt het bewijsstuk vermeld in het eerste lid overgelegd, tenzij het tweede lid van
      toepassing is.

      6 De aangewezen of erkende geneeskundige is verplicht de door Onze Minister, op aanbeveling van de Medisch Adviseur
      Scheepvaart, aangewezen nascholingscursussen te volgen. De kosten van deelname komen voor rekening van de betrokken
      geneeskundige.

      7 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de aanwijzing en de erkenning van
      geneeskundigen als keurend arts voor de scheepvaart.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0006251
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel110
    references:
