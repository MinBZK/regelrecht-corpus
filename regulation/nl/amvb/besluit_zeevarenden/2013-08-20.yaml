articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. de wet: de [Wet zeevarenden][ref1];

      b. ervaring: de diensttijd in jaren, in een bepaalde functie aan boord van in de vaart zijnde zeeschepen, gerekend
      met ingang van de dag van aanmonstering tot en met de dag van afmonstering;

      c. voortstuwingsvermogen: het maximale vermogen, uitgedrukt in kiloWatt, dat op het geldige bemanningscertificaat
      is vermeld;

      d. reizen nabij de kust: het gebruik van een schip met een bruto-tonnage van minder dan 500 GT en een
      voorststuwingsvermogen van minder dan 3000 kW, in een vaargebied dat zich uitstrekt tot dertig zeemijlen uit
      de kust, met dien verstande dat het schip ten hoogste twaalf uren varen verwijderd is van een op het geldige
      bemanningscertificaat met name genoemde werkhaven en nooit verder verwijderd is dan zes uren varen vanaf een
      beschutte haven of rede;

      e. reizen nabij de kust zonder beperking in voortstuwingsvermogen:

      het gebruik van een schip met een bruto tonnage van minder dan 500 GT en een voortstuwingsvermogen van 3000 kW of
      meer in een vaargebied dat zich uitstrekt tot dertig zeemijlen uit de kust, met dien verstande dat het schip ten
      hoogste twaalf uren varen verwijderd is van een op het geldige bemanningscertificaat met name genoemde werkhaven en
      nooit verder verwijderd is dan zes uren varen vanaf een beschutte haven of rede;

      f. tankschip: een schip, gebouwd of aangepast en gebruikt voor het vervoer in bulk van vloeibare producten;

      g. olietankschip: een tankschip gebouwd en gebezigd voor het vervoer in bulk van aardolie of aardolieproducten;

      h. chemicaliëntankschip: een tankschip gebouwd en gebezigd voor het vervoer in bulk van vloeibare producten die
      zijn opgenomen in hoofdstuk 17 van de Internationale Code inzake het vervoer van chemicaliën in bulk;

      i. gastankschip: een tankschip gebouwd en gebezigd voor het vervoer in bulk van vloeibaar gemaakt gas of ander
      product dat is opgenomen in hoofdstuk 19 van de Internationale Code inzake het vervoer van vloeibaar gemaakt gas;

      j passagiersschip: een schip bestemd of gebezigd voor het bedrijfsmatig vervoer van meer dan twaalf passagiers;

      k. ro-ro passagiersschip: een passagiersschip met ruimten voor ro-ro lading of ruimten van bijzondere aard, zoals
      bedoeld in Hoofdstuk II-2/A van het SOLAS-verdrag;

      l. hogesnelheidsvaartuig: een schip dat is staat is zich voort te bewegen met een snelheid in meters per seconde
      die gelijk of groter is dan 3,7 ▿ 0,1667, waarbij ▿ staat voor de waterverplaatsing in m3 op de ontwerpwaterlijn.

      m. zeilschip: een schip dat bestemd is en ingericht is om hoofdzakelijk door middel van zeilen te worden
      voortbewogen;

      n. STCW-Verdrag: het op 7 juli 1978 te Londen tot stand gekomen Internationaal Verdrag betreffende de normen voor
      zeevarenden inzake opleiding, diplomering en wachtdienst, 1978 (Trb. 1981, 144);

      o. STCW-Code: de Code inzake opleiding, diplomering en wachtdienst van zeevarenden, behorend bij het STCW-Verdrag
      (Trb. 1996, 249);

      p. geneeskundige verklaring: een verklaring als bedoeld in artikel 104;

      q. Medisch Adviseur Scheepvaart: de medisch adviseur scheepvaart van Onze Minister of diens plaatsvervanger;

      r. kW: kiloWatt;

      s. GT: de bruto inhoud van het schip, vastgesteld volgens de bepalingen krachtens de [Meetbrievenwet 1981][ref2];

      t. lengte: de lengte van een zeilschip die gelijk is aan 96 procent van de lengte van de lastlijn op 85 procent
      van de kleinste holte naar de mal gemeten vanaf de bovenzijde van de kielplaat, dan wel gelijk is aan de lengte van
      de voorzijde van de voorsteven tot aan de hartlijn van de roerkoning gemeten op deze lastlijn, indien deze laatste
      lengte groter is.

      u. kennisbewijs: het diploma of certificaat afgegeven door een instelling als bedoeld in de
      [Wet educatie en beroepsonderwijs (WEB)][ref3] dan wel een getuigschrift of verklaring afgegeven door een
      instelling als bedoeld in de [Wet hoger onderwijs en wetenschappelijk onderzoek (WHW)][ref4] of een certificaat
      afgeven door een door Onze Minister erkende opleiding waaruit blijkt dat een erkende opleiding met goed gevolg
      is afgesloten;

      v. High-Speed Craft Code: de ingevolge hoofdstuk X van het SOLAS-verdrag toepasselijke High-Speed Craft Code;

      w. aannemersmaterieel: schepen gebruikt voor het uitvoeren van bagger-, kust- en oeverwerken, met inbegrip van
      schepen gebruikt voor de bevoorrading van op zee gelegen mijnbouwinstallaties en sleepboten, mits gebruikt binnen
      een afstand gelegen binnen 200 zeemijlen vanuit een met name genoemde werkhaven;

      x. SOLAS-verdrag: het op 1 november 1974 te Londen totstandgekomen Verdrag voor de beveiliging van mensenlevens op
      zee (Trb. 1976, 157) en de bij dat verdrag behorende bindende protocollen, aanhangsels en bijlagen.

      2 Een werkhaven als bedoeld in dit besluit beschikt 24 uur per dag over nautische en technische ondersteuning ten
      behoeve van schepen die in gebruik zijn als aannemersmaterieel.


