  - number: '12'
    text: |-
      1 De kennisbewijzen voor de afgifte van een vaarbevoegdheidsbewijs om daarmee dienst te kunnen doen aan boord van
      schepen in de functie van maritiem officier of werktuigkundige zijn in neerdalende lijn:

      a. hoger maritiem officier;

      b. middelbaar maritiem officier; baggeraar-machinist of wachtwerktuigkundige;

      c. stuurman-werktuigkundige kleine schepen of werktuigkundige tot 3000 kW;

      d. schipper-machinist beperkt werkgebied.

      2 De diploma's, bedoeld in de Wet op de zeevaartdiploma's voor de afgifte van een vaarbevoegdheidsbewijs om daarmee
      dienst te kunnen doen aan boord van schepen in de functie van werktuigkundige zijn in neerdalende lijn:

      a. diploma C als scheepswerktuigkundige;

      b. diploma B als scheepswerktuigkundige;

      c. diploma A als scheepswerktuigkundige;

      d. diploma als motordrijver.

      3 Met het diploma als motordrijver worden voor de verkrijging van een vaarbevoegdheidsbewijs gelijkgesteld:
      het diploma als assistent scheepswerktuigkundige, het voorlopig diploma als scheepswerktuigkundige, alsmede het
      diploma als motordrijver zeevisvaart en het diploma voor de zeevisvaart W IV-v, uitgereikt krachtens de Wet op de
      Zeevischvaartdiploma's, Stb. 1935, 455.
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel12
  - number: '13'
    text: |-
      1 Het kennisbewijs voor de afgifte van een vaarbevoegdheidsbewijs om daarmee dienst te kunnen doen in de functie
      van kapitein of eerste stuurman van schepen op reizen nabij de kust, is het kennisbewijs als schipper-machinist
      beperkt werkgebied en het kennisbewijs als stuurman-werktuigkundige voor de zeevisvaart SW 5.

      2 De diploma's voor de afgifte van een vaarbevoegdheidsbewijs om daarmee dienst te kunnen doen in de functie
      van kapitein of stuurman van schepen op reizen nabij de kust, zijn het diploma als stuurman voor de kleine
      handelsvaart, het diploma als stuurman voor de kustsleepvaart, het diploma als stuurman voor de beperkte kleine
      handelsvaart, alsmede het diploma voor de zeevisvaart SW V.
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel13
  - number: '14'
    text: |-
      Onverminderd [artikel 8][ref1], geeft het bezit van het kennisbewijs als hoger maritiem officier of als middelbaar
      maritiem officier de aanvrager recht op het vaarbevoegdheidsbewijs voor alle schepen als:

      1. a. maritiem officier;

      b. wachtstuurman; en

      c. eerste stuurman tot 3000 GT, indien hij in het bezit is van

      i. het algemeen certificaat voor de maritieme radiocommunicatie, en

      ii. de leeftijd heeft bereikt van 18 jaar;

      d. wachtwerktuigkundige, indien hij de leeftijd heeft bereikt van 18 jaar;

      e. tweede werktuigkundige tot 3000 kW, indien hij de leeftijd heeft bereikt van 18 jaar en een diensttijd heeft van
      een jaar als werktuigkundige of als assistent-werktuigkundige in het kader van een opleiding tot maritiem officier;

      2. eerste stuurman, indien hij naast het genoemde in 1, onderdeel c, onder i, in het bezit is van

      i. het certificaat radarnavigator;

      ii. het certificaat scheepsmanagement-N, en

      iii. een diensttijd heeft van twee jaar als stuurman of maritiem officier;

      3. tweede werktuigkundige, indien hij een diensttijd heeft van een jaar als maritiem officier, werktuigkundige of
      als assistent-werktuigkundige in het kader van een opleiding tot maritiem officier;

      4. hoofdwerktuigkundige, indien hij in het bezit is van

      i. het certificaat scheepsmanagement-W, en

      ii. een diensttijd heeft van vier jaar als werktuigkundige of maritiem officier, waarvan ten minste een jaar als
      tweede werktuigkundige of eerste maritiem officier;

      5. eerste maritiem officier, indien hij naast het genoemde in 1, onderdeel c, onder i, 2, onder i en ii, 4, onder
      i, een diensttijd heeft van drie jaar als maritiem officier;

      6. kapitein, indien hij naast het genoemde in 1, onderdeel c, onder i, 2, onder i en ii, een diensttijd heeft van
      vier jaar als stuurman of maritiem officier, waarvan ten minste een jaar als eerste stuurman of eerste maritiem
      officier.


