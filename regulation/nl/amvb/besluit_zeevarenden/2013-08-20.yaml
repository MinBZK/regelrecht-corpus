  - number: '2'
    text: |-
      Dit besluit is niet van toepassing ten aanzien van vissersvaartuigen en zeilvaartuigen met een lengte van minder
      dan 12 meter.
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel2
  - number: '3'
    text: |-
      1 Op verzoek van de scheepsbeheerder kan Onze Minister ontheffing verlenen van de verplichting om het schip te
      bemannen in overeenstemming met het bemanningscertificaat indien blijkt dat:

      a. korte tijd voor het vertrek van het schip uit de haven een of meer leden van de bemanning niet beschikbaar zijn;

      b. dringende omstandigheden ertoe nopen het vertrek niet langer uit te stellen, en

      c. met de aan boord aanwezige bemanning, gelet op de bijzonderheden van de reis, het schip zonder gevaar voor het
      schip of andere zaken, voor personen, het milieu of de scheepvaart deze reis kan ondernemen.

      2 Op verzoek van de scheepsbeheerder kan Onze Minister een ontheffing als bedoeld in [artikel 25 van de wet][ref1]
      verlenen, indien:

      a. er onvoldoende bemanningsleden, in het bezit van de vereiste kwalificaties, voorhanden zijn,

      b. de ontheffing verleend wordt aan een bemanningslid dat in het bezit is van het vaarbevoegdheidsbewijs dat
      vereist is voor de relevante lagere functie, en

      c. met de aan boord aanwezige bemanning, gelet op de bijzonderheden van de reis, het schip zonder gevaar voor het
      schip of andere zaken, voor personen, het milieu of de scheepvaart deze reis kan ondernemen.

      3 Een ontheffing als bedoeld in [artikel 25 van de wet][ref2] wordt voor de functie van kapitein of
      hoofdwerktuigkundige slechts gegeven in zeer bijzondere omstandigheden die niet het gevolg zijn van het handelen
      of het nalaten te handelen van de zijde van de scheepsbeheerder en indien gedurende korte tijd de vervulling van
      die functie door een bemanningslid met een lagere bevoegdheid noodzakelijk is voor de voortzetting van de reis,
      en de veiligheid van het schip en de opvarenden, de veilige vaart ter zee en de bescherming van het mariene milieu
      gewaarborgd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel25
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel3
