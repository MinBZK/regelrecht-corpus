        hoofdstuk: '3'
        paragraaf: '6'
  - number: '40'
    text: |-
      Een vaarbevoegdheidsbewijs als eerste stuurman tot 3000 GT wordt afgegeven aan

      onderofficieren en oud-onderofficieren Operationele Dienst van de Koninklijke Marine, die

      1. in het bezit zijn van de Zeewachtstandaard M, zoals vastgesteld door Onze Minister van Defensie;

      2. ten minste een jaar geplaatst zijn en zelfstandig dienst hebben gedaan op de brug op operationeel in de vaart
      zijnde oorlogsschepen, voor zoveel deze ervaring of een deel daarvan niet langer dan vier jaar geleden is opgedaan,
      en zij daarnaast in het bezit zijn van:

      i. een kennisbewijs ten aanzien van de Nederlandse en voornaamste internationale wettelijke voorschriften
      betreffende de zeescheepvaart;

      ii. een kennisbewijs ten aanzien van het behandelen van lading op het niveau van stuurman tot 3000 GT;

      iii. het algemeen certificaat voor de maritieme radiocommunicatie;

      iv. het certificaat radarnavigator, en

      v. een diensttijd hebben behaald van ten minste drie maanden op schepen in de handelsvaart met een bruto tonnage
      van minder dan 3000.
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel40
  - number: '41'
    text: |-
      Een vaarbevoegdheidsbewijs als kapitein tot 3000 GT wordt afgegeven aan de houder van een vaarbevoegdheidsbewijs,
      afgegeven op grond van [artikel 40][ref1], die in het bezit is van

      i. het certificaat scheepsmanagement-N, en

      ii. een diensttijd heeft behaald van een jaar als eerste stuurman.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel40
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel41
