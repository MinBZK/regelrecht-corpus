        - voorschrift II/1, de paragrafen 2.4.en 2.5 van de bijlage bij het STCW-Verdrag;
        - voorschrift II/2, paragraaf 2.2 van de bijlage bij het STCW-Verdrag;
        - voorschrift V/1, paragraaf 1.2, van de bijlage bij het STCW-Verdrag;

      b. heeft de aanvrager met goed gevolg examen afgelegd ter afsluiting van een opleiding die ten minste voldoet aan:

        - sectie A-II/1, de paragrafen 1 tot en met 6 van de STCW-Code
        - sectie A-II/2, de paragrafen 1 tot en met 7, van de STCW-Code, met uitzondering van de aspecten
      coördinatie reddingsacties, opstellen wachtschema's en orders, radarnavigatie, reageren op noodsituaties en
      personeelsmanagement.
        - sectie A-V/1, de paragrafen 2 tot en met 7 van de STCW-Code, en

      c. heeft de aanvrager:

      een goedgekeurde stage aan boord vervuld van ten minste een jaar als onderdeel van de onder b bedoelde opleiding,
      onder bijhouding van een goedgekeurd stageboek, en tijdens deze stage gedurende ten minste een half jaar
      wachtdienst op de brug gelopen onder toezicht van de kapitein, een bevoegde stuurman of een bevoegd maritiem
      officier.
