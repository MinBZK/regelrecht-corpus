  - number: '4'
    text: |-
      1 De vaarbevoegdheden genoemd in dit besluit zijn niet geldig op vissersvaartuigen.

      2 De vaarbevoegdheden alle schepen zijn geldig op alle schepen.

      3 De vaarbevoegdheden als

      1. eerste maritiem officier kleine schepen, en

      2. maritiem officier kleine schepen zijn uitsluitend geldig op schepen van minder dan 3000 GT en een
      voorstuwingsvermogen van minder dan 3000 kW.

      4 De vaarbevoegdheden als kapitein tot 3000 GT en eerste stuurman tot 3000 GT zijn uitsluitend geldig op schepen
      van minder dan 3000 GT.

      5 De vaarbevoegdheden als

      1. hoofdwerktuigkundige tot 3000 kW, en

      2. tweede werktuigkundige tot 3000 kW zijn uitsluitend geldig op schepen met een voortstuwingsvermogen van minder
      dan 3000 kW.

      6 De vaarbevoegdheden zijn alleen geldig aan boord van olietankschepen, chemicaliën-tankschepen, gastankschepen,
      stoomschepen, zeilschepen of op een andere bij regeling van Onze Minister aan te wijzen categorie van schepen,
      indien dit uitdrukkelijk op het vaarbevoegdheidsbewijs is aangegeven.

      7 Een vaarbevoegdheid is uitgebreid of beperkt tot een bepaalde categorie schepen, een bepaald bruto-tonnage,
      een bepaald voortstuwingsvermogen respectievelijk een bepaald vaargebied, indien deze uitbreiding respectievelijk
      beperking uitdrukkelijk op het vaarbevoegdheidsbewijs is opgenomen.
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel4
  - number: '5'
    text: |-
      Bij regeling van Onze Minister wordt bepaald op welke wijze de in [artikel 4][ref1], genoemde aanvullingen dan wel
      beperkingen op vaarbevoegdheidsbewijzen worden aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel4
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '4'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '6'
    text: |-
      1 Tenzij uitdrukkelijk anders is bepaald wordt de ervaring of diensttijd uitgedrukt in jaren en behaald in ten
      minste de functie van wachtstuurman, wachtwerktuigkundige of maritiem officier.

      De functie van maritiem officier houdt in het afwisselend verantwoordelijk zijn voor de wacht op de brug dan wel
      aan dek, of in de machinekamer.

      2 Bij regeling van Onze Minister wordt bepaald:

      a. aan boord van welke categorieën schepen de ervaring voor een bepaalde vaarbevoegdheid wordt opgedaan;

      b. aan boord van welke grootte klasse of het voortstuwingsvermogen van schepen de ervaring moet zijn opgedaan, en

      c. welke ervaring, niet opgedaan aan boord van schepen, in aanmerking wordt genomen.
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel6
  - number: '7'
    text: |-
      Een vaarbevoegdheidsbewijs, met uitzondering van dat voor gezellen, is geldig tot ten hoogste vijf jaar na de datum
      van afgifte.
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel7
  - number: '8'
    text: |-
      1 Een vaarbevoegdheidsbewijs wordt afgegeven indien de aanvrager aantoont te voldoen aan de ingevolge dit besluit
      vereiste kennis en ervaring, mits het kennisbewijs ten hoogste vier jaar voor het indienen van de aanvraag is
      afgegeven.

      2 Een vaarbevoegdheidsbewijs of een aanvulling daarop kan vernieuwd worden, indien de houder in de periode van vijf
      jaar voorafgaand aan de datum van de aanvraag tot vernieuwing ten minste één jaar heeft dienstgedaan in een naar
      het oordeel van Onze Minister relevante functie waarvoor een vaarbevoegdheid is vereist en die door de houder op
      grond van de aan hem toegekende vaarbevoegdheden mocht worden vervuld, dan wel in een andere, bij regeling van Onze
      Minister vastgestelde, daarmee vergelijkbare functie.

      3 In het geval van vernieuwing als genoemd in het tweede lid, wordt het vaarbevoegdheidsbewijs dat is vernieuwd,
      ingenomen of zonodig ongeldig gemaakt.

      4 Een vaarbevoegdheidsbewijs, dat door verloop van de geldigheidsduur ongeldig is geworden, en dat niet op grond
      van het tweede lid kan worden vernieuwd, wordt op verzoek vernieuwd indien de aanvrager direct voorafgaand aan
      de aanvraag:

      a. een daartoe door Onze Minister erkende opleiding heeft gevolgd en met succes heeft afgesloten;

      b. gedurende drie maanden in een naar het oordeel van Onze Minister relevante functie boven de sterkte heeft
      gevaren, of

      c. op grond van een ontheffing, gedurende ten minste drie maanden in een naar het oordeel van Onze Minister
      relevante, maar lagere functie heeft gevaren dan waarvoor zijn ongeldig geworden vaarbevoegdheidsbewijs gold.

      5 Een vaarbevoegdheidsbewijs dat verloren is gegaan kan worden vervangen door een duplicaat vaarbevoegdheidsbewijs,
      waarvan de einddatum overeenkomt met de einddatum op het originele document.

      6 Indien de aanvrager van een duplicaat aanspraak kan maken op vernieuwing van het vaarbevoegdheidsbewijs, wordt
      hem desgevraagd met inachtneming van het tweede lid een vaarbevoegdheidsbewijs afgegeven.

      7 Het vierde lid is van overeenkomstige toepassing indien de eerste aanvraag van een vaarbevoegdheidsbewijs niet is
      ingediend binnen vier jaar na de datum waarop het kennisbewijs van de opleiding is afgegeven.

      8 De kosten van de afgifte van een vaarbevoegdheidsbewijs of een duplicaat-vaarbevoegdheidsbewijs worden bij de
      aanvraag voldaan.
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel8
  - number: '9'
    text: |-
      1 Onze Minister erkent een vaarbevoegdheidsbewijs, diploma of certificaat dat is afgegeven door een bevoegde
      autoriteit van een staat, niet zijnde een Lid-Staat van de Europese Unie, een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte of de Bondsstaat Zwitserland, indien ten aanzien van dat
      vaarbevoegdheidsbewijs, diploma of certificaat wordt voldaan aan de criteria, bedoeld in artikel 19, eerste tot
      en met zesde lid, van richtlijn nr. 2008/106/EG van het Europees Parlement en de Raad van de Europese Unie van
      19 november 2008 inzake het minimum opleidingsniveau van zeevarenden (PbEU L 323).

      2 Onze Minister kan tot 1 februari 2002 ten behoeve van zeevarenden die voor 1 augustus 1998 met hun opleiding
      of dienst aan boord zijn begonnen, andere criteria hanteren dan die genoemd in artikel 9, derde lid van de in het
      eerste lid genoemde richtlijn voor de erkenning van hun diploma of vaarbevoegdheidsbewijs.

      3 Indien een vaarbevoegdheidsbewijs, diploma of certificaat wordt erkend als gelijkwaardig aan een
      vaarbevoegdheidsbewijs met inachtneming van [artikel 4][ref1] wordt aan de aanvrager het overeenkomstige
      Nederlandse vaarbevoegdheidsbewijs van erkenning afgegeven.

      4 Voor de afgifte van een vaarbevoegdheidsbewijs als kapitein, eerste stuurman of hoofdwerktuigkundige legt de
      aanvrager het certificaat Wetgeving en Openbaar Gezag over.

      5 Het eerste tot en met derde lid zijn niet van toepassing op vaarbevoegdheidsbewijzen van gezellen.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel4
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel9
