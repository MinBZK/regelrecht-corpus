      - id: ref2
        bwb_id: BWBR0032895
  - number: '122'
    text: |-
      De scheepsbeheerder draagt er zorg voor dat:

      a. tussen alle bemanningsleden een doelmatige communicatie over veiligheidsaspecten kan plaatsvinden. Voorts dient
      hij zeker te stellen dat er op adequate wijze communicatie kan plaatsvinden tussen het schip en de autoriteiten te
      land, in een gemeenschappelijke taal of in de taal van de autoriteiten;

      b. aan boord van passagiersschepen een werktaal wordt vastgesteld die in het journaal wordt aangetekend;

      c. aan boord van passagiersschepen de bemanningsleden, die op de alarmrol zijn aangewezen om de passagiers in
      kritieke situaties te helpen, beschikken over voor dat doel toereikende communicatieve vaardigheden en duidelijk
      herkenbaar zijn en,

      d. onverminderd het bepaalde onder a, op olietankschepen, chemicaliëntankschepen en gastankschepen, de
      bemanningsleden in staat zijn met elkaar te communiceren in een of meer gemeenschappelijke werktalen.
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel122
  - number: '123'
    text: |-
      1 De scheepsbeheerder legt aan Onze Minister een verklaring in drievoud over, waarin hij voor ieder onderdeel van
      [artikel 122][ref1], voor zover het desbetreffende onderdeel betrekking heeft op zijn schip, nauwkeurig vermeldt op
      welke wijze hij ten aanzien van zijn schip uitvoering heeft gegeven aan zijn verplichtingen ingevolge dat artikel.

      2 Onze Minister registreert de overgelegde verklaring, bedoeld in het eerste lid, en zendt de eigenaar twee door
      hem ten teken van registratie gewaarmerkte afschriften van de verklaring.

      3 De eigenaar verschaft de kapitein een van de twee exemplaren van de geregistreerde verklaring, bedoeld in het
      tweede lid.

      4 De verklaring, bedoeld in het eerste lid, heeft een geldigheidsduur van vijf jaar.

      5 In afwijking van het vierde lid heeft de verklaring, bedoeld in het eerste lid, voor passagiersschepen een
      geldigheidsduur van één jaar.

      6 De verklaring bedoeld in het derde lid wordt door de kapitein in een voor iedereen toegankelijke plaats
      opgehangen.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel122
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '122'
        hoofdstuk: '7'
  - number: '124'
    text: |-
      Bij regeling van Onze Minister kunnen, ter uitvoering van Verdragen of van besluiten van volkenrechtelijke
      organisaties, nadere regels worden gesteld met betrekking tot de in dit besluit geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel124
  - number: 124a
    text: |-
      Bij regeling van Onze Minister kunnen ter uitvoering van de [Verordening (EG) nr. 725/2004](32004R0725) van het
      Europees Parlement en de Raad van 31 maart 2004 betreffende de verbetering van de beveiliging van zeeschepen
      en havenfaciliteiten (PbEG L 129) nadere regels worden gesteld omtrent de opleiding van de voorgeschreven
      scheepsbeveiligingsofficier.
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel124a
  - number: '125'
    text: |-
      De geneeskundige verklaringen van geschiktheid voor de zeevaart die zijn afgegeven voor het tijdstip waarop
      artikel I voor wat betreft de onderdelen F tot en met L en P van het besluit van 5 juli 2012 houdende wijziging van
      algemene maatregelen van bestuur op het terrein van de scheepvaart in verband met de implementatie van het Maritiem
      Arbeidsverdrag, 2006 in werking treedt, behouden hun geldigheid overeenkomstig de daarop aangegeven einddatum.
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel125
  - number: '126'
    text: 'Dit besluit wordt aangehaald als: Besluit zeevarenden handelsvaart en zeilvaart.'
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel126
