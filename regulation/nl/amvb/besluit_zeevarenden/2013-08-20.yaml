  - number: '104'
    text: |-
      Bij ministeriële regeling wordt het model van de geneeskundige verklaring van geschiktheid voor de zeevaart
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel104
  - number: '105'
    text: |-
      1 Ten behoeve van de afgifte van een geneeskundige verklaring als bedoeld in
      [artikel 40, eerste of tweede lid, van de wet][ref1], wordt het bemanningslid aan een medisch onderzoek onderworpen
      door een door Onze Minister daartoe als keuringsarts aangewezen onderscheidenlijk een door Onze Minister daartoe
      als keuringsarts erkend geneeskundige.

      2 Indien de keuringsarts twijfels heeft omtrent de medische geschiktheid dan wel wanneer in de medische eisen,
      bedoeld in [artikel 106, eerste lid][ref2], een specialistisch rapport is vereist, verwijst deze arts de keurling
      voor deelonderzoek door naar een specialist.

      3 Een geneeskundige verklaring zeevaart wordt afgegeven door een keuringsarts die heeft vastgesteld
      dat de keurling voldoet aan de voor die verklaring van toepassing zijnde medische eisen, bedoeld in
      [artikel 106, eerste lid][ref3].

      4 Indien de gekeurde gebruik wenst te maken van zijn recht om opnieuw te worden onderzocht, wordt hij onderzocht
      door een ingevolge [artikel 42, eerste lid, van de wet][ref4] als scheidsrechter aangewezen geneeskundige.

      5 De in dit besluit bedoelde onderzoeken worden verricht door geneeskundigen die niet de behandelend arts of
      specialist van de keurling zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0012778#Artikel106
      [ref3]: https://wetten.overheid.nl/BWBR0012778#Artikel106
      [ref4]: https://wetten.overheid.nl/BWBR0009124#Artikel42
