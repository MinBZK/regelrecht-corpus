  - number: '31'
    text: |-
      In plaats van de bewijzen en certificaten, genoemd in [artikel 74 tot en met 78][ref1], kan de scheepsbeheerder
      volstaan met het aantekenen van de door de bemanningsleden gevolgde opleiding of training in het krachtens
      [artikel 3, derde lid, van de wet][ref2] bij te houden overzicht.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel3
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel31
