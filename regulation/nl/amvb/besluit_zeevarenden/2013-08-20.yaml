  - number: '113'
    text: |-
      1 De Medisch Adviseur Scheepvaart kan geneeskundige verklaringen, afgegeven op grond van medische eisen die naar
      zijn oordeel ten minste gelijkwaardig zijn aan het geheel van de medische eisen die krachtens dit besluit worden
      gesteld, gelijkstellen met een krachtens dit besluit afgegeven geneeskundige verklaring van geschiktheid voor de
      zeevaart.

      2 Een geneeskundige verklaring als bedoeld in het eerste lid die niet op grond van dit besluit is afgegeven, mag
      niet langer dan twee jaren vóór de beoordeling zijn afgegeven.

      3 Bij toepassing van het eerste lid geeft de Medisch Adviseur Scheepvaart een geneeskundige verklaring af als
      genoemd in [artikel 40 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel40
    url: https://wetten.overheid.nl/BWBR0012778/2013-08-20#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '40'
  - number: '116'
    text: |-
      1 Bemanningsleden aan wie in de alarmrol van het schip een veiligheidstaak wordt opgedragen dan wel die een taak
      ten aanzien van het voorkomen van verontreiniging van de zee hebben, zijn in het bezit van een certificaat waaruit
      blijkt dat zij met goed gevolg een door Onze Minister erkende training en opleiding «basis veiligheid» als bedoeld
      in [artikel 87][ref1] hebben gevolgd, tenzij zij aan de hand van een monsterboekje of van een soortgelijk document
      kunnen aantonen dat zij reeds voor 1 augustus 1998 aan boord van zeeschepen werkzaam waren.

      2 Voor bemanningsleden met de functie van ten minste wachtstuurman, wachtwerktuigkundige of maritiem officier geldt
      het geldige vaarbevoegdheidsbewijs als het certificaat, bedoeld in het eerste lid.

      3 Elke andere zeevarende dan een bemanningslid als bedoeld in het eerste lid volgt, alvorens zijn taak aan boord te
      beginnen, een training voor persoonlijke veiligheid aan boord, teneinde:

      a. met de overige opvarenden over elementaire veiligheidszaken te kunnen spreken, begrip te hebben van de
      veiligheidssymbolen en de alarmseinen te kennen;

      b. te weten wat te doen indien: iemand over boord valt; vuur of rook wordt ontdekt; het sein «brandalarm» of «schip
      verlaten» wordt gegeven;

      c. te weten waar de reddingsgordels zich bevinden en hoe deze om te doen;

      d. alarm te slaan en bekend te zijn met het gebruik van handbrandblussers;

      e. te weten wat te doen bij een ongeluk voordat hulp wordt ingeroepen;

      f. de brand- en waterdichte deuren, met uitzondering van die ter afsluiting van openingen in de romp, te kunnen
      sluiten en openen, en

      g. te kunnen vaststellen waar de verzamelplaatsen bij het sein «schip verlaten», de plaatsen van inscheping in de
      reddingsloepen en de ontsnappingsroutes bij noodgevallen zich bevinden.

      4 Elk bemanningslid als bedoeld in het eerste lid, krijgt alvorens zijn taak aan boord te beginnen, voldoende
      informatie en instructie met betrekking tot de in het derde lid, onderdelen c, f en g genoemde onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel87
