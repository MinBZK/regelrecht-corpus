  - number: '15'
    text: |-
      Onverminderd [artikel 8][ref1], geeft het bezit van het kennisbewijs als baggeraar-stuurman, als wachtstuurman
      alle schepen dan wel het diploma als derde stuurman voor de grote handelsvaart de aanvrager recht op het
      vaarbevoegdheidsbewijs voor alle schepen als:

      1. a. wachtstuurman; en

      b. eerste stuurman tot 3000 GT, indien hij in het bezit is van

      i. het algemeen certificaat voor de maritieme radiocommunicatie, en

      ii. de leeftijd heeft bereikt van 18 jaar

      2. eerste stuurman, indien hij naast het genoemde in 1, onderdeel b, onder i, in het bezit is van

      i. het certificaat radarnavigator;

      ii. het certificaat scheepsmanagement-N, en

      iii. een diensttijd heeft van een jaar als stuurman;

      3. kapitein, indien hij naast het genoemde in 1, onderdeel b, onder i, 2, onder i en ii, een diensttijd heeft van
      drie jaar als stuurman, dan wel twee jaar als stuurman waarvan ten minste een jaar als eerste stuurman.


