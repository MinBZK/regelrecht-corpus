    text: |-
      1 Op een schip dat op een internationaal traject van meer dan drie dagen vaart, met een bemanning en overig
      personeel van honderd personen of meer die, in welke hoedanigheid ook, aan boord ten behoeve van het schip in
      dienst of tewerkgesteld zijn, inclusief stagiairs en leerlingen alsmede personen die werkzaam zijn als loods, is
      een arts aanwezig.

      2 Indien aan het eerste lid is voldaan, kan in afwijking van [artikel 118, eerste lid][ref1], voor
      de kapitein worden volstaan met het bezit van het certificaat scheepsgezondheidszorg B, bedoeld in
      [artikel 91, eerste lid][ref2].

      3 Bij regeling van Onze Minister kunnen, met inachtneming van het bepaalde bij of krachtens
      [artikel 21 van de wet][ref3], nadere eisen worden gesteld ten aanzien van de bekwaamheid van de in het eerste lid
      genoemde arts.


