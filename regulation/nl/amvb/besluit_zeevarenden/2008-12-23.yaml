    text: wachtstuurman; en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel15
  - number: 15.1.b
    text: eerste stuurman tot 3000 GT, indien hij in het bezit is van
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel15
  - number: 15.1.b.i
    text: het algemeen certificaat voor de maritieme radiocommunicatie, en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel15
  - number: 15.1.b.ii
    text: de leeftijd heeft bereikt van 18 jaar
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel15
  - number: '15.2'
    text: eerste stuurman, indien hij naast het genoemde in 1, onderdeel b, onder i, in het bezit is van
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel15
  - number: 15.2.i
    text: het certificaat radarnavigator;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel15
  - number: 15.2.ii
    text: het certificaat scheepsmanagement-N, en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel15
  - number: 15.2.iii
    text: een diensttijd heeft van een jaar als stuurman;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel15
  - number: '15.3'
    text: |-
      kapitein, indien hij naast het genoemde in 1, onderdeel b, onder i, 2, onder i en ii, een diensttijd heeft van drie
      jaar als stuurman, dan wel twee jaar als stuurman waarvan ten minste een jaar als eerste stuurman.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel15
  - number: '16'
    text: |-
      Onverminderd [artikel 8][ref1], geeft het bezit van het kennisbewijs als stuurman-werktuigkundige kleine schepen de
      aanvrager recht op het vaarbevoegdheidsbewijs als:


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel8
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 16.a
    text: maritiem officier kleine schepen en maritiem officier op alle aannemersmaterieel;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel16
  - number: 16.b
    text: |-
      eerste stuurman tot 3000 GT en eerste stuurman op alle aannemersmaterieel, indien hij in het bezit is van het
      algemeen certificaat voor de maritieme radiocommunicatie en hij de leeftijd heeft bereikt van 18 jaar;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel16
  - number: 16.c
    text: |-
      tweede werktuigkundige tot 3000 kW en tweede werktuigkundige op alle aannemersmaterieel, indien hij de leeftijd
      heeft bereikt van 18 jaar;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel16
  - number: 16.d
    text: |-
      hoofdwerktuigkundige tot 3000 kW en hoofdwerktuigkundige op alle aannemersmaterieel, indien hij een diensttijd
      heeft van twee jaar;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel16
  - number: 16.e
    text: |-
      eerste maritiem officier kleine schepen en eerste maritiem officier op alle aannemersmaterieel, indien hij naast
      het certificaat genoemd in onderdeel b, een diensttijd heeft van twee jaar als maritiem officier;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel16
  - number: 16.f
    text: |-
      kapitein tot 3000 GT en kapitein op alle aannemersmaterieel, indien hij naast het certificaat genoemd in onderdeel
      b, in het bezit is van het certificaat radarnavigator, het certificaat scheepsmanagement-N, alsmede een diensttijd
      heeft van twee jaar als stuurman of maritiem officier, waarvan ten minste één jaar als eerste stuurman of eerste
      maritiem officier.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel16
  - number: '17'
    text: |-
      Onverminderd [artikel 8][ref1], geeft het bezit van het kennisbewijs als stuurman tot 3000 GT de aanvrager recht op
      het vaarbevoegdheidsbewijs als:


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel8
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 17.a
    text: |-
      eerste stuurman tot 3000 GT en eerste stuurman op alle aannemersmaterieel, indien hij in het bezit is van het
      algemeen certificaat voor de maritieme radiocommunicatie en de leeftijd heeft bereikt van 18 jaar;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel17
  - number: 17.b
    text: |-
      kapitein tot 3000 GT en kapitein op alle aannemersmaterieel, indien hij naast het certificaat genoemd onder a, in
      het bezit is van het certificaat radarnavigator, het certificaat scheepsmanagement-N en een diensttijd heeft van
      drie jaar als stuurman, dan wel twee jaar als stuurman, waarvan ten minste één jaar als eerste stuurman.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel17
  - number: '18'
    text: |-
      Onverminderd [artikel 8][ref1], geeft het bezit van het kennisbewijs als baggeraar machinist, als
      wachtwerktuigkundige alle schepen dan wel het diploma A als scheepswerktuigkundige de aanvrager recht op het
      vaarbevoegdheidsbewijs voor alle schepen als:


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel8
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '18.1'
    text: wachtwerktuigkundige, indien hij de leeftijd heeft bereikt van 18 jaar;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel18
  - number: '18.2'
    text: tweede werktuigkundige, indien hij een diensttijd heeft van een jaar;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel18
  - number: '18.3'
    text: hoofdwerktuigkundige, indien hij in het bezit is van
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel18
  - number: 18.3.i
    text: het certificaat scheepsmanagement-W, en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel18
  - number: 18.3.ii
    text: |-
      een diensttijd heeft van drie jaar als werktuigkundige, waarvan ten minste een jaar in het bezit van de bevoegdheid
      als tweede werktuigkundige.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel18
  - number: '19'
    text: |-
      Onverminderd [artikel 8][ref1], geeft het bezit van het diploma als motordrijver de aanvrager recht op het
      vaarbevoegdheidsbewijs als:


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel8
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 19.a
    text: wachtwerktuigkundige alle schepen;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel19
  - number: 19.b
    text: |-
      tweede werktuigkundige tot 3000 kW en tweede werktuigkundige op alle aannemersmateriaal, indien hij de leeftijd
      heeft bereikt van 18 jaar;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel19
  - number: 19.c
    text: |-
      hoofdwerktuigkundige tot 3000 kW en hoofdwerktuigkundige op alle aannemersmateriaal, indien hij een diensttijd
      heeft van twee jaar als werktuigkundige waarvan tenminste een jaar in het bezit van de bevoegdheid als tweede
      werktuigkundige.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel19
  - number: '20'
    text: |-
      Onverminderd [artikel 8][ref1], geeft het bezit van het kennisbewijs als werktuigkundige tot 3000 kW de aanvrager
      recht op het vaarbevoegdheidsbewijs als:


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel8
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 20.a
    text: |-
      tweede werktuigkundige tot 3000 kW en tweede werktuigkundige op alle aannemersmaterieel, indien hij de leeftijd
      heeft bereikt van 18 jaar;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel20
  - number: 20.b
    text: |-
      hoofdwerktuigkundige tot 3000 kW en hoofdwerktuigkundige op alle aannemersmaterieel, mits hij een diensttijd
      heeft van twee jaar als werktuigkundige, waarvan tenminste één jaar in het bezit van de bevoegdheid als tweede
      werktuigkundige.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel20
  - number: '21'
    text: |-
      Onverminderd [artikel 8][ref1], geeft het bezit van het kennisbewijs als schipper-machinist beperkt werkgebied de
      aanvrager recht op het vaarbevoegdheidsbewijs als


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel8
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '21.1'
    text: eerste stuurman op reizen nabij de kust, indien hij in het bezit is van
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel21
  - number: 21.1.i
    text: het beperkt certificaat voor de maritieme radiocommunicatie, en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel21
  - number: 21.1.ii
    text: een leeftijd heeft bereikt van 18 jaar;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel21
  - number: '21.2'
    text: kapitein op reizen nabij de kust, indien hij, naast het genoemde in 1.i.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel21
  - number: 21.2.i
    text: een leeftijd heeft bereikt van 20 jaar, en hij
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel21
  - number: 21.2.ii
    text: |-
      een diensttijd heeft van een jaar, zo nodig aangevuld met de eisen die voortvloeien uit een overeenkomst met een
      andere staat binnen wiens territoir de reizen nabij de kust plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel21
  - number: '21.3'
    text: wachtwerktuigkundige op reizen nabij de kust.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel21
  - number: '22'
    text: |-
      Voor de afgifte van een vaarbevoegdheidsbewijs als radio-operator is vereist het algemeen certificaat maritieme
      radiocommunicatie, afgegeven in overeenstemming met het bepaalde bij of krachtens het [Frequentiebesluit][ref1] en
      de leeftijd van 18 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0009997
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009997
  - number: '23'
    text: |-
      Voor de afgifte van een vaarbevoegdheidsbewijs als radio-operator met de beperking tot het gebruik van VHF/
      UHF radio-communicatieapparatuur is vereist het beperkt certificaat maritieme radiocommunicatie, afgegeven in
      overeenstemming met het bepaalde bij of krachtens het [Frequentiebesluit][ref1] en de leeftijd van 18 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0009997
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009997
  - number: '24'
    text: 'Voor de afgifte van een vaarbevoegdheidsbewijs als gezel met de beperking tot de dekdienst is ten minste vereist:'
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel24
  - number: '24.1'
    text: het kennisbewijs als gezel dekdienst, of
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel24
  - number: '24.2'
    text: |-
      een schriftelijke verklaring van de kapitein dat betrokkene met goed gevolg heeft aangetoond te voldoen aan de
      eisen van bekwaamheid als bedoeld in sectie A-II/4 van de STCW-Code; en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel24
  - number: 24.2.i
    text: een ervaring heeft van ten minste een half jaar als aankomend gezel dekdienst op zeeschepen;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel24
  - number: 24.2.ii
    text: in het bezit is van het certificaat basisveiligheidstraining, en hij
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel24
  - number: 24.2.iii
    text: een leeftijd heeft bereikt van 16 jaar.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel24
  - number: '25'
    text: |-
      Voor de afgifte van een vaarbevoegdheidsbewijs als gezel met de beperking tot de machinekamerdienst is ten minste
      vereist:
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel25
  - number: '25.1'
    text: het kennisbewijs als gezel machinekamerdienst; of
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel25
  - number: '25.2'
    text: |-
      een schriftelijke verklaring van de hoofdwerktuigkundige dat betrokkene met goed gevolg heeft aangetoond te voldoen
      aan de eisen van bekwaamheid als bedoeld in sectie A-III/4 van de STCW-Code;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel25
  - number: 25.2.i
    text: een ervaring heeft van ten minste een half jaar als aankomend gezel machinekamerdienst op zeeschepen;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel25
  - number: 25.2.ii
    text: in het bezit is van het certificaat basisveiligheidstraining, en hij
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel25
  - number: 25.2.iii
    text: een leeftijd heeft bereikt van 16 jaar.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel25
  - number: '26'
    text: |-
      Onverminderd de [artikelen 14 tot en met 17][ref1] is de houder van een vaarbevoegdheidsbewijs als kapitein, eerste
      maritiem officier of eerste stuurman alle schepen alsmede als kapitein tot 3000 GT met ingang van 1 februari 2002
      in het bezit van het certificaat radarnavigator.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel14
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '27'
    text: |-
      Onverminderd de [artikelen 14 tot en met 17][ref1] is de houder van een vaarbevoegdheidsbewijs als kapitein, eerste
      maritiem officier, maritiem officier, eerste stuurman en wachtstuurman alle schepen, eerste maritiem officier en
      maritiem officier kleine schepen, alsmede eerste stuurman tot 3000 GT met ingang van 1 februari 2002 in het bezit
      van het certificaat brandbestrijding voor gevorderden.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel14
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '28'
    text: |-
      Onverminderd de [artikelen 14 tot en met 20][ref1] is de houder van een vaarbevoegdheidsbewijs als
      hoofdwerktuigkundige, tweede werktuigkundige of wachtwerktuigkundige alle schepen, alsmede als hoofdwerktuigkundige
      en tweede werktuigkundige tot 3000 kW met ingang van 1 februari 2002 in het bezit van het certificaat
      brandbestrijding voor gevorderden.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel14
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '29.1'
    text: |-
      Voor de uitoefening door bemanningsleden van speciale taken en verantwoordelijkheden met betrekking tot de lading
      en de daarbij behorende uitrusting op tankschepen, is vereist:
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel29
  - number: 29.1.a
    text: |-
      het bezit van een certificaat brandbestrijding in aanvulling op de opleiding en training die is voorgeschreven
      in [artikel 87][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel87
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '87'
        hoofdstuk: '4'
        paragraaf: '7'
  - number: 29.1.b
    text: ten minste drie maanden goedgekeurde diensttijd op tankschepen; of
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel29
  - number: 29.1.c
    text: |-
      een erkende cursus hebben gevolgd om zich vertrouwd te maken met de dienst aan boord van tankschepen, waarin
      ten minste het programma voor de cursus vervat in sectie AV/1, de paragrafen 2 tot en met 7, van de STCW-Code is
      behandeld.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel29
  - number: '29.2'
    text: |-
      De inspecteur-generaal is bevoegd in plaats van de diensttijd, bedoeld in het eerste lid, onderdeel b, een kortere
      diensttijd toe te staan, onder voorwaarde dat:
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel29
  - number: 29.2.a
    text: de diensttijd niet korter is dan een maand;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel29
  - number: 29.2.b
    text: het tankschip waarop de diensttijd is doorgebracht een bruto tonnage heeft van minder dan 3000;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel29
  - number: 29.2.c
    text: de duur van elke reis van het tankschip gedurende die periode niet langer is dan 72 uur, en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel29
  - number: 29.2.d
    text: |-
      de operationele kenmerken van het tankschip, het aantal reizen en het aantal beladingen en lossingen die gedurende
      deze periode worden gedaan, het mogelijk maken hetzelfde niveau van kennis en ervaring te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel29
  - number: '29.3'
    text: |-
      Kapiteins, eerste maritiem officieren, eerste stuurlieden, hoofdwerktuigkundigen, tweede werktuigkundigen en voorts
      iedereen die rechtstreeks verantwoordelijk is voor het laden, lossen en de te nemen voorzorgsmaatregelen tijdens
      de reis of de behandeling van de lading, voldoen naast het in het eerste lid, onderdelen b of c bepaalde, aan het
      volgende:
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel29
  - number: 29.3.a
    text: |-
      zij hebben een ervaring van ten minste een half jaar op het gebied van hun taken op het type tankschip waarop zij
      varen, en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel29
  - number: 29.3.b
    text: |-
      zij zijn in het bezit van een voor het type tankschip bestemd veiligheidstrainingscertificaat, zoals is
      voorgeschreven in [artikel 71][ref1], [72][ref2] of [73][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0012778#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0012778#Artikel73
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0012778
        artikel: '72'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0012778
        artikel: '73'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '29.4'
    text: |-
      De inspecteur-generaal draagt er zorg voor dat op het vaarbevoegdheidsbewijs van kapiteins en officieren die
      voldoen aan het eerste, tweede of derde lid, de desbetreffende aantekening wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel29
  - number: '30.1'
    text: |-
      Dit artikel is van toepassing op kapiteins, maritiem officieren, stuurlieden, werktuigkundigen en ander personeel
      aan boord van passagiersschepen.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel30
  - number: '30.2'
    text: |-
      Alvorens hun taken aan boord van passagiersschepen worden opgedragen is er voor de betrokken zeevarenden een
      door de inspecteur-generaal goedgekeurd schriftelijk bewijs waaruit blijkt dat zij de opleiding en training,
      zoals vereist in het vierde tot en met het achtste lid, in overeenstemming met hun hoedanigheid, taken en
      verantwoordelijkheden, met goed gevolg hebben voltooid.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel30
  - number: '30.3'
    text: |-
      Zeevarenden van wie verlangd wordt dat zij een opleiding hebben gevolgd in overeenstemming met het vierde, zevende
      en achtste lid, volgen passende herhalingscursussen met tussenpozen van niet meer dan vijf jaar of tonen aan dat
      zij in de afgelopen vijf jaar tenminste één jaar dienst hebben gedaan aan boord van passagierschepen.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel30
  - number: '30.4'
    text: |-
      Voor personeel aan boord van passagiersschepen, aan wie in de alarmrol de taak wordt opgedragen om passagiers bij
      te staan in noodsituaties, is er het bewijs dat zij de training in groepsbegeleiding, bedoeld in [artikel 74][ref1]
      hebben voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel74
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '74'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '30.5'
    text: |-
      Voor kapiteins, maritiem officieren, stuurlieden, werktuigkundigen en ander personeel aan boord van
      passagiersschepen dat belast is met bijzondere taken en verantwoordelijkheden, is er het bewijs dat zij de
      familiarisatie-training voor het betreffende passagiersschip, bedoeld in [artikel 75][ref1], hebben voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel75
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '75'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '30.6'
    text: |-
      Voor personeel aan boord van passagiersschepen dat in de passagiersruimten direct betrokken is bij de
      dienstverlening aan passagiers, is er het bewijs dat zij de veiligheidstraining, bedoeld in [artikel 76][ref1],
      hebben voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel76
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '76'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '30.7'
    text: |-
      Kapiteins, eerste maritiem officieren, eerste stuurlieden en iedereen die aan boord van passagiersschepen
      die is belast met de directe verantwoordelijkheid voor het aan en van boord gaan van passagiers, het laden,
      lossen of vastzetten van de lading, zijn in het bezit van het certificaat passagiersveiligheid, bedoeld in
      [artikel 77][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel77
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '77'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '30.8'
    text: |-
      Kapiteins, eerste stuurlieden, eerste maritiem officieren, hoofdwerktuigkundigen, tweede werktuigkundigen
      en anderen aan boord van passagiersschepen die verantwoordelijkheid dragen voor de veiligheid van passagiers
      in noodsituaties zijn in het bezit van het certificaat crisisbeheersing en menselijk gedrag, bedoeld in
      [artikel 78][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel78
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '78'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '31'
    text: |-
      In plaats van de bewijzen en certificaten, genoemd in [artikel 74 tot en met 78][ref1], kan de scheepsbeheerder
      volstaan met het aantekenen van de door de bemanningsleden gevolgde opleiding of training in het krachtens
      [artikel 3, derde lid, van de wet][ref2] bij te houden overzicht.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel3
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '74'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '3'
  - number: '32.1'
    text: |-
      In afwijking van [artikel 30][ref1] is dit artikel uitsluitend van toepassing op de bemanningsleden aan boord van
      ro-ro passagiersschepen.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel30
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '32.2'
    text: |-
      Alvorens hun taken aan boord van ro-ro passagiersschepen worden opgedragen zijn zeevarenden in het bezit van een
      document waaruit blijkt dat zij de opleiding en training, zoals vereist in het vierde tot en met het achtste lid,
      in overeenstemming met hun hoedanigheid, taken en verantwoordelijkheden, met goed gevolg hebben voltooid.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel32
  - number: '32.3'
    text: |-
      Zeevarenden van wie verlangd wordt dat zij een opleiding en training hebben gevolgd in overeenstemming met het
      vierde, het zevende en het achtste lid, volgen passende herhalingscursussen met tussenpozen van niet meer dan vijf
      jaar of tonen aan dat zij in de voorafgaande vijf jaar tenminste één jaar dienst hebben gedaan aan boord van ro-
      ro passagierschepen.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel32
  - number: '32.4'
    text: |-
      Kapiteins, maritiem officieren, stuurlieden, werktuigkundigen en ander personeel aan boord van ro-ro
      passagiersschepen aan wie in de alarmrol de taak wordt opgedragen om passagiers bij te staan in noodsituaties, zijn
      in bezit van het bewijs groepsbegeleiding, bedoeld in [artikel 79][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel79
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '79'
        hoofdstuk: '4'
        paragraaf: '5'
  - number: '32.5'
    text: |-
      Kapiteins, maritiem officieren, stuurlieden, werktuigkundigen en ander personeel aan boord van ro-ro
      passagiersschepen dat belast is met bijzondere taken en verantwoordelijkheden, zijn in het bezit van het bewijs
      familiarisatietraining voor het betreffende ro-ro passagiersschip, bedoeld in [artikel 80][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel80
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '80'
        hoofdstuk: '4'
        paragraaf: '5'
  - number: '32.6'
    text: |-
      Personeel aan boord van ro-ro passagiersschepen dat in de passagiersruimten direct betrokken is bij de
      dienstverlening aan passagiers, is in het bezit van het bewijs veiligheidstraining, bedoeld in [artikel 81][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel81
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '81'
        hoofdstuk: '4'
        paragraaf: '5'
  - number: '32.7'
    text: |-
      Kapiteins, eerste maritiem officieren, eerste stuurlieden, hoofdwerktuigkundigen, tweede werktuigkundigen en
      iedereen aan boord van ro-ro passagiersschepen, die belast is met de directe verantwoordelijkheid voor het aan
      en van boord gaan van passagiers, het laden, lossen of vastzetten van de lading of het sluiten van openingen in
      de romp zijn in het bezit van het certificaat passagiersveiligheid, ladingveiligheid en integriteit van de romp,
      bedoeld in [artikel 82][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel82
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '82'
        hoofdstuk: '4'
        paragraaf: '5'
  - number: '32.8'
    text: |-
      Kapiteins, eerste maritiem officieren, eerste stuurlieden, hoofdwerktuigkundigen, tweede werktuigkundigen en
      iedereen aan boord van ro-ro passagiersschepen die verantwoordelijkheid draagt voor de veiligheid van passagiers
      in noodsituaties zijn in het bezit van het certificaat crisisbeheersing en menselijk gedrag, bedoeld in
      [artikel 83][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel83
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '83'
        hoofdstuk: '4'
        paragraaf: '5'
  - number: '33'
    text: |-
      In plaats van de bewijzen en certificaten, genoemd in [artikel 79 tot en met 83][ref1], kan de scheepsbeheerder
      volstaan met het aantekenen van de door de bemanningsleden gevolgde opleiding of training in het krachtens
      [artikel 3, derde lid, van de wet ][ref2]bij te houden overzicht.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel3
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '79'
        hoofdstuk: '4'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '3'
  - number: '34.1'
    text: |-
      Werktuigkundigen en maritiem officieren aan boord van schepen voorzien van een stoomvoortstuwingsinstallatie, met
      een voortstuwingsvermogen van 3000 kW of meer, hebben een erkende opleiding stoomvoortstuwing voltooid, bedoeld in
      artikel 84.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel34
  - number: '34.2'
    text: |-
      Het eerste lid is niet van toepassing voor houders van het diploma C als scheepswerktuigkundige dan wel het diploma
      B als scheepswerktuigkundige, uitgereikt voor 1 januari 1989.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel34
  - number: '34.3'
    text: Aan werktuigkundigen en maritiem officieren die voldoen aan het eerste lid wordt een kennisbewijs uitgereikt.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel34
  - number: '34.4'
    text: |-
      De inspecteur-generaal draagt er zorg voor dat op het vaarbevoegdheidsbewijs van werktuigkundigen en maritiem
      officieren die voldoen aan dit artikel, de betreffende aantekening wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel34
  - number: '35'
    text: |-
      Kapiteins, maritiem officieren, stuurlieden en werktuigkundigen van hogesnelheidsvaartuigen zijn in het bezit van
      een *type rating certificate,* bedoeld in [artikel 85][ref1] voor het hogesnelheidsvaartuig waarop zij dienstdoen.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel85
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '85'
        hoofdstuk: '4'
        paragraaf: '6'
  - number: '36.1'
    text: |-
      Kapiteins, stuurlieden en maritiem officieren van zeilschepen met een lengte van 40 meter of meer zijn, naast één
      der in [artikel 11, eerste, tweede of derde lid][ref1], genoemde kennisbewijzen of diploma’s in het bezit van het
      certificaat grote zeilvaart, dan wel in bezit van het in [artikel 11, vijfde lid][ref2], genoemde kennisbewijs
      grote zeilvaart.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0012778#Artikel11
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012778
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '36.2'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld met betrekking tot de bemanning van zeilschepen met een lengte
      van minder dan 40 meter.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel36
  - number: '36.3'
    text: |-
      De inspecteur-generaal draagt er zorg voor dat op het vaarbevoegdheidsbewijs van kapiteins, stuurlieden en maritiem
      officieren die voldoen aan het eerste lid van dit artikel, de betreffende aantekening wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel36
  - number: '37'
    text: |-
      Een vaarbevoegdheidsbewijs als wachtstuurman alle schepen wordt afgegeven aan officieren en oud-officieren van de
      Zeedienst der Koninklijke Marine, die in het bezit zijn van een getuigschrift van het Koninklijk Instituut voor
      de Marine en van de Zeewachtstandaard A, zoals vastgesteld door Onze Minister van Defensie, die daarna gedurende
      ten minste een jaar geplaatst zijn en dienst hebben gedaan als wachtsofficier op operationeel in de vaart zijnde
      oorlogsschepen, voor zoveel deze ervaring of een deel daarvan niet langer dan vier jaar geleden is opgedaan, en
      mits zij daarnaast in het bezit zijn van:
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel37
  - number: 37.a
    text: |-
      een kennisbewijs ten aanzien van de Nederlandse en voornaamste internationale wettelijke voorschriften betreffende
      de zeescheepvaart;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel37
  - number: 37.b
    text: een kennisbewijs ten aanzien van het behandelen van lading op het niveau van wachtstuurman alle schepen, en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel37
  - number: 37.c
    text: het algemeen certificaat voor de maritieme radiocommunicatie.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel37
  - number: '38.1'
    text: Een vaarbevoegdheidsbewijs als eerste stuurman alle schepen wordt afgegeven aan
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel38
  - number: 38.1.a
    text: |-
      officieren en oud-officieren van de Zeedienst der Koninklijke Marine, met de rang van luitenant ter zee tweede
      klasse oudste categorie of een hogere rang, die
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel38
  - number: 38.1.a.1
    text: in het bezit zijn van een getuigschrift van het Koninklijk Instituut voor de Marine;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel38
  - number: 38.1.a.2
    text: |-
      daarna gedurende ten minste vier jaar zijn geplaatst en dienst hebben gedaan als wachtsofficier op operationeel in
      de vaart zijnde oorlogsschepen, waarvan ten minste twee jaar in de evengenoemde rang of in een hogere rang, voor
      zoveel deze ervaring of een deel daarvan niet langer dan vier jaar geleden is opgedaan, en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel38
  - number: 38.1.a.3
    text: 'in het bezit zijn van de aantekening navigatieofficier, alsmede van:'
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel38
  - number: 38.1.a.3.i
    text: |-
      een kennisbewijs ten aanzien van de Nederlandse en voornaamste internationale wettelijke voorschriften betreffende
      de zeescheepvaart;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel38
  - number: 38.1.a.3.ii
    text: een kennisbewijs ten aanzien van het behandelen van lading op het niveau van wachtstuurman;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel38
  - number: 38.1.a.3.iii
    text: het algemeen certificaat voor de maritieme radiocommunicatie;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel38
  - number: 38.1.a.3.iv
    text: het certificaat radarnavigator;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel38
  - number: 38.1.a.3.v
    text: het certificaat scheepsmanagement-N, en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel38
  - number: 38.1.a.3.vi
    text: |-
      een diensttijd hebben behaald van ten minste een half jaar op schepen in de handelsvaart met een bruto-tonnage van
      3000 of meer;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel38
  - number: 38.1.b
    text: |-
      de houder van een vaarbevoegdheidsbewijs, afgegeven op grond van [artikel 37][ref1], die in het bezit is van:


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel37
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 38.1.b.i
    text: het certificaat radarnavigator;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel38
  - number: 38.1.b.ii
    text: het certificaat scheepsmanagement-N, en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel38
  - number: 38.1.b.iii
    text: in de handelsvaart een diensttijd heeft behaald van één jaar.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel38
  - number: '38.2'
    text: |-
      Een vaarbevoegdheidsbewijs als eerste stuurman op alle zeilschepen wordt afgegeven aan officieren en oud-officieren
      van de Zeedienst der Koninklijke Marine, met de rang van luitenant ter zee tweede klasse oudste categorie of een
      hogere rang, die:
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel38
  - number: 38.2.a
    text: in het bezit zijn van een getuigschrift van het Koninklijk Instituut voor de Marine;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel38
  - number: 38.2.b
    text: |-
      in het bezit van het onder a genoemde getuigschrift gedurende ten minste vier jaar zijn geplaatst en dienst hebben
      gedaan als wachtsofficier op operationeel in de vaart zijnde oorlogsschepen, voor zoveel deze ervaring of een deel
      daarvan niet langer dan vier jaar geleden is opgedaan, en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel38
  - number: 38.2.c
    text: 'in het bezit zijn van de aantekening navigatieofficier, alsmede van:'
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel38
  - number: 38.2.c.i
    text: |-
      een kennisbewijs ten aanzien van de Nederlandse en voornaamste internationale wettelijke voorschriften betreffende
      de zeescheepvaart;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel38
  - number: 38.2.c.ii
    text: het certificaat grote zeilvaart;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel38
  - number: 38.2.c.iii
    text: het algemeen certificaat voor de maritieme radiocommunicatie, en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel38
  - number: 38.2.c.iv
    text: het certificaat radarnavigator.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel38
  - number: '39.1'
    text: |-
      Een vaarbevoegdheidsbewijs als kapitein alle schepen wordt afgegeven aan de houder van een bevoegdheid afgegeven op
      grond van [artikel 38, eerste lid][ref1], die een diensttijd heeft behaald van een jaar als eerste stuurman.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel38
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '38'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: '39.2'
    text: |-
      Een vaarbevoegdheidsbewijs als kapitein alle zeilschepen wordt afgegeven aan de houder van een bevoegdheid
      afgegeven op grond van [artikel 38, tweede lid][ref1], die een diensttijd heeft behaald van een jaar als eerste
      stuurman aan boord van zeilschepen.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel38
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '38'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: '40'
    text: |-
      Een vaarbevoegdheidsbewijs als eerste stuurman tot 3000 GT wordt afgegeven aan onderofficieren en oud-
      onderofficieren Operationele Dienst van de Koninklijke Marine, die
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel40
  - number: '40.1'
    text: in het bezit zijn van de Zeewachtstandaard M, zoals vastgesteld door Onze Minister van Defensie;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel40
  - number: '40.2'
    text: |-
      ten minste een jaar geplaatst zijn en zelfstandig dienst hebben gedaan op de brug op operationeel in de vaart
      zijnde oorlogsschepen, voor zoveel deze ervaring of een deel daarvan niet langer dan vier jaar geleden is opgedaan,
      en zij daarnaast in het bezit zijn van:
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel40
  - number: 40.2.i
    text: |-
      een kennisbewijs ten aanzien van de Nederlandse en voornaamste internationale wettelijke voorschriften betreffende
      de zeescheepvaart;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel40
  - number: 40.2.ii
    text: een kennisbewijs ten aanzien van het behandelen van lading op het niveau van stuurman tot 3000 GT;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel40
  - number: 40.2.iii
    text: het algemeen certificaat voor de maritieme radiocommunicatie;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel40
  - number: 40.2.iv
    text: het certificaat radarnavigator, en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel40
  - number: 40.2.v
    text: |-
      een diensttijd hebben behaald van ten minste drie maanden op schepen in de handelsvaart met een bruto tonnage van
      minder dan 3000.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel40
  - number: '41'
    text: |-
      Een vaarbevoegdheidsbewijs als kapitein tot 3000 GT wordt afgegeven aan de houder van een vaarbevoegdheidsbewijs,
      afgegeven op grond van [artikel 40][ref1], die in het bezit is van


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel40
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 41.i
    text: het certificaat scheepsmanagement-N, en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel41
  - number: 41.ii
    text: een diensttijd heeft behaald van een jaar als eerste stuurman.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel41
  - number: '42'
    text: |-
      Een vaarbevoegdheidsbewijs als tweede werktuigkundige alle schepen wordt afgegeven aan officieren en gewezen
      officieren van de Technische Dienst van de Koninklijke Marine, die
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel42
  - number: '42.1'
    text: in het bezit zijn van het getuigschrift van het Koninklijk Instituut voor de Marine, en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel42
  - number: '42.2'
    text: |-
      daarna ten minste een jaar dienst hebben gedaan op operationeel in de vaart zijnde oorlogsschepen, voor zoveel deze
      ervaring of een deel daarvan niet langer dan vier jaar geleden is opgedaan.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel42
  - number: '43'
    text: 'Een vaarbevoegdheidsbewijs als hoofdwerktuigkundige alle schepen wordt afgegeven aan:'
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel43
  - number: 43.a
    text: officieren en gewezen officieren van de Technische Dienst, die
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel43
  - number: 43.a.1
    text: in het bezit zijn van een getuigschrift van het Koninklijk Instituut voor de Marine, en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel43
  - number: 43.a.2
    text: |-
      daarna ten minste vijf jaar dienst hebben gedaan op operationeel in de vaart zijnde oorlogsschepen, voor zoveel
      deze ervaring of een deel daarvan niet langer dan vier jaar geleden is, en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel43
  - number: 43.a.3
    text: in het bezit zijn van het certificaat scheepsmanagement-W;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel43
  - number: 43.b
    text: |-
      de houder van een bevoegdheid afgegeven op grond van [artikel 42][ref1], die een diensttijd heeft behaald van:


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel42
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '42'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 43.b.1
    text: |-
      drie jaar als werktuigkundige, waarvan ten minste een jaar in het bezit van de bevoegdheid als tweede
      werktuigkundige, en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel43
  - number: 43.b.2
    text: in het bezit is van het certificaat scheepsmanagement-W.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel43
  - number: '44'
    text: |-
      Een vaarbevoegdheidsbewijs als wachtwerktuigkundige alle schepen en tweede werktuigkundige tot 3000 kW wordt
      afgegeven aan onderofficieren van de Technische Dienst Werktuigtechniek of Systemen en oud-onderofficieren
      Technische Dienst Werktuigtechniek of Systemen, die
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel44
  - number: '44.1'
    text: de rang van korporaal of hoger hebben bekleed, en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel44
  - number: '44.2'
    text: |-
      ten minste een jaar dienst hebben gedaan op operationeel in de vaart zijnde oorlogsschepen, voor zoveel deze
      ervaring of een deel daarvan niet langer dan vier jaar geleden is.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel44
  - number: '45'
    text: |-
      Een vaarbevoegdheidsbewijs als hoofdwerktuigkundige tot 3000 kW wordt afgegeven aan de houder van een
      vaarbevoegdheidsbewijs afgegeven op grond van [artikel 44][ref1], die een diensttijd heeft behaald van twee jaar,
      waarvan ten minste een jaar in het bezit van de bevoegdheid als tweede werktuigkundige.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel44
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '44'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: '46'
    text: |-
      Op de verkrijging van vaarbevoegdheidsbewijzen door de officieren, oud-officieren, onderofficieren en oud-
      onderofficieren die in deze paragraaf worden genoemd, is [artikel 8][ref1], met uitzondering van het eerste en het
      zevende lid, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel8
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '47'
    text: |-
      In plaats van de Zeewachtstandaard A of de Zeewachtstandaard M, genoemd in [artikel 37][ref1], onderscheidenlijk
      [artikel 40][ref2], kan de aanvrager van een vaarbevoegdheidsbewijs een ander door Onze Minister van Defensie
      afgegeven document overleggen, waaruit blijkt dat de betrokkene over een gelijkwaardig niveau van kennis en inzicht
      beschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0012778#Artikel40
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0012778
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: '48'
    text: |-
      Bij regeling van Onze Minister kunnen, na overleg met Onze Minister van Defensie, zo nodig in afwijking van
      de [artikelen 37 tot en met 47][ref1], regels worden vastgesteld voor de verkrijging van vaarbevoegdheden door
      officieren en schepelingen der Koninklijke Marine die dienst doen aan boord van een zeeschip dat met kustwachttaken
      is belast.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel37
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel48
    references:
      - id: ref1
