  - number: '49.2'
    text: |-
      Voor de verkrijging van een vaarbevoegdheidsbewijs als kapitein, eerste stuurman dan wel hoofdwerktuigkundige alle
      schepen is het bezit van het certificaat scheepsmanagement N of W niet vereist voor de houder van het diploma als
      eerste stuurman voor de grote handelsvaart respectievelijk het diploma C als scheepswerktuigkundige dan wel van
      het bewijs dat de bijscholingscursus 6000–9000 GT met goed gevolg werd afgesloten, alsmede voor degenen die voor de
      datum van inwerkingtreding van dit besluit dienst doen als kapitein of hoofdwerktuigkundige.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel49
  - number: '50'
    text: |-
      Een vaarbevoegdheidsbewijs als kapitein tot 3000 GT wordt afgegeven aan: de houder van het diploma als stuurman
      voor de kleine handelsvaart, afgegeven voor 3 mei 1988, die in het bezit is van:
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel50
  - number: 50.i
    text: het certificaat radarnavigator, en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel50
  - number: 50.ii
    text: het algemeen certificaat voor de maritieme radiocommunicatie.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel50
  - number: '51'
    text: 'Een vaarbevoegdheidsbewijs als kapitein op reizen nabij de kust, wordt afgegeven aan:'
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel51
  - number: 51.a
    text: |-
      de houder van het diploma als stuurman voor de kustsleepvaart, afgegeven voor de datum van het van kracht worden
      van dit besluit;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel51
  - number: 51.b
    text: de houder van het diploma als stuurman voor de beperkte kleine handelsvaart, afgegeven voor 3 mei 1988;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel51
  - number: 51.c
    text: |-
      de houder van het diploma als kapitein aannemersmaterieel met aantekening, uitgereikt krachtens artikel 8,
      derde lid, aanhef en onderdeel b, van de Wet op de zeevaartdiploma's in verband met artikel 24 van het Besluit
      Zeevaartdiploma's;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel51
  - number: 51.d
    text: |-
      de houder van het kennisbewijs schipper-machinist beperkt werkgebied, afgegeven voor de datum van het van kracht
      worden van dit besluit, die in het bezit is van:
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel51
  - number: 51.d.i
    text: het beperkt certificaat voor de maritiem radiocommunicatie, en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel51
  - number: 51.d.ii
    text: een diensttijd heeft behaald van ten minste twee jaar,
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel51
  - number: '52'
    text: 'Een vaarbevoegdheidsbewijs als eerste stuurman tot 3000 GT wordt afgegeven aan:'
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel52
  - number: 52.a
    text: |-
      de houder van het diploma als stuurman voor de kleine handelsvaart, afgegeven voor 3 mei 1988, die in het bezit is
      van het algemeen certificaat voor de maritieme radiocommunicatie, en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel52
  - number: 52.b
    text: |-
      de houder van het diploma als stuurman voor de kleine handelsvaart met aantekening, uitgereikt krachtens artikel
      8, derde lid, aanhef en onderdeel a, van de Wet op de zeevaartdiploma's, in verband met artikel 23, aanhef en
      onderdeel a, van het Besluit zeevaartdiploma's, die in het bezit is van het algemeen certificaat voor de maritieme
      radiocommunicatie.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel52
  - number: '53'
    text: 'Een vaarbevoegdheidsbewijs als eerste stuurman op reizen nabij de kust, wordt afgegeven aan:'
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel53
  - number: 53.a
    text: |-
      de houder van het diploma als stuurman voor de kustsleepvaart dan wel het diploma als stuurman voor de beperkte
      kleine handelsvaart, afgegeven voor de datum van inwerking treden van dit besluit die in het bezit is van het
      beperkt certificaat voor de maritieme radiocommunicatie;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel53
  - number: 53.b
    text: |-
      de houder van het diploma als stuurman/tweede schipper aannemersmaterieel met aantekening, uitgereikt krachtens
      artikel 8, derde lid, aanhef en onderdeel a, van de Wet op de zeevaartdiploma's, in verband met artikel 23, aanhef
      en onderdeel a, van het Besluit zeevaartdiploma's die in het bezit is van het beperkt certificaat voor de maritieme
      radiocommunicatie;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel53
  - number: 53.c
    text: |-
      de houder van het diploma als stuurman/tweede schipper aannemersmaterieel met aantekening, uitgereikt krachtens
      artikel 8, derde lid, aanhef en onderdeel b, van de Wet op de zeevaartdiploma's, in verband met artikel 24, van het
      Besluit zeevaartdiploma's die in het bezit is van het beperkt certificaat voor de maritieme radiocommunicatie; en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel53
  - number: 53.d
    text: |-
      de houder van het kennisbewijs schipper-machinist beperkt werkgebied, afgegeven voor de datum van het van kracht
      worden van dit besluit, die in het bezit is van het beperkt certificaat voor de maritieme radiocommunicatie, zo
      nodig aangevuld met de eisen die voortvloeien uit een overeenkomst met een andere staat binnen wiens territoir de
      reizen nabij de kust plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel53
  - number: '54'
    text: |-
      Een vaarbevoegdheidsbewijs als hoofdwerktuigkundige tot 3000 kW en hoofdwerktuigkundige op alle aannemersmaterieel,
      wordt afgegeven aan: de houder van het diploma als motordrijver met aantekening, uitgereikt krachtens artikel
      8, derde lid, aanhef en onderdeel a, van de Wet op de zeevaartdiploma's, in verband met artikel 23, aanhef en
      onderdeel b, van het Besluit zeevaartdiploma's, die een diensttijd heeft behaald van twee jaar.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel54
  - number: '55'
    text: |-
      Een vaarbevoegdheidsbewijs als tweede werktuigkundige tot 3000 kW en tweede werktuigkundige op alle
      aannemersmaterieel wordt afgegeven aan:
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel55
  - number: 55.a
    text: |-
      de houder van het diploma als motordrijver met aantekening, uitgereikt krachtens artikel 8, derde lid, aanhef en
      onderdeel a, van de Wet op de zeevaartdiploma's, in verband met artikel 23, aanhef en onderdeel b, van het Besluit
      zeevaartdiploma's;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel55
  - number: 55.b
    text: |-
      de houder van het diploma als scheepswerktuigkundige, uitgereikt krachtens artikel 8, derde lid, aanhef en
      onderdeel b, van de Wet op de zeevaartdiploma's, in verband met artikel 24 van het Besluit Zeevaartdiploma's;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel55
  - number: 55.c
    text: |-
      de houder van het diploma machinist aannemersmaterieel met aantekening, uitgereikt krachtens artikel 8, derde
      lid, aanhef en onderdeel b, van de Wet op de zeevaartdiploma's, in verband met artikel 24 van het Besluit
      Zeevaartdiploma's;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel55
  - number: 55.d
    text: |-
      De houder van een vrijstelling van het bezit van een diploma als scheepswerktuigkundige, voor de dienst aan
      boord van aannemersmaterieel, afgegeven op grond van artikel 11 van de Wet op de zeevaartdiploma’s zoals dit
      artikel luidde vóór 1 augustus 1988, mits hij op 1 februari 2002 tevens in het bezit was van een verklaring van
      geschiktheid en bekwaamheid als bedoeld in [artikel 119 van het Schepenbesluit 1965][ref1] zoals dit luidde vóór 1
      februari 2002.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel119
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '119'
  - number: '56'
    text: |-
      Een vaarbevoegdheidsbewijs als gezel wordt afgegeven aan: de houder van het certificaat scheepstechnicus,
      uitgereikt door de inspecteur-generaal.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel56
  - number: '57.1'
    text: 'Een kennisbewijs wordt afgegeven door:'
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel57
  - number: 57.1.a
    text: |-
      een op grond van de [Wet op het hoger onderwijs en wetenschappelijk onderzoek (WHW)][ref1] bekostigde of aangewezen
      hogeschool, waarvan ten aanzien van de onderwijs- en examenregeling voor de nautische beroepen overleg is gevoerd,
      bedoeld in artikel 5.5 van de WHW;


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 57.1.b
    text: |-
      een instelling als bedoeld in de [Wet educatie en beroepsonderwijs, (WEB)][ref1] die nautische beroepsopleidingen
      verzorgd waarvoor door de Minister van Onderwijs, Cultuur en Wetenschappen in overeenstemming met Onze Minister
      eindtermen zijn vastgesteld, zoals bedoeld in [artikel 7.2.4 van de WEB][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0007625
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 57.1.c
    text: een door Onze Minister erkende opleiding of exameninstelling.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel57
  - number: '57.2'
    text: |-
      Een certificaat wordt afgegeven door het bevoegd gezag van een door Onze Minister erkende opleiding, training,
      exameninstelling of een certificerende instelling op het gebied van persoonscertificatie.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel57
  - number: '58'
    text: Voor de afgifte van het kennisbewijs Hoger Maritiem Officier of Middelbaar Maritiem Officier,
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel58
  - number: 58.a
    text: |-
      voldoet de aanvrager aan: - voorschrift II/1, paragrafen 2.4 en 2.5 van de bijlage bij het STCW-Verdrag;
        - voorschrift II/2, paragraaf 2.2 van de bijlage bij het STCW-Verdrag;
        - voorschrift III/1, paragrafen 2.2 en 2.3, van de bijlage bij het STCW-Verdrag;
        - voorschrift III/2, paragraaf 2.2 van de bijlage bij het STCW-Verdrag;
        - voorschrift V/1, paragraaf 1.2, van de bijlage bij het STCW-Verdrag;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel58
  - number: 58.b
    text: |-
      heeft de aanvrager met goed gevolg examen afgelegd ter afsluiting van een opleiding die ten minste voldoet aan: -
      sectie A-II/1, paragraaf 1 tot en met 6, van de STCW-Code;
        - sectie A-II/2, paragraaf 1 tot en met 7, van de STCW-Code, met uitzondering van de aspecten coördinatie
      reddingsacties, opstellen wachtschema's en orders, radarnavigatie, reageren op noodsituaties en
      personeelsmanagement;
        - sectie A-III/1, paragraaf 1 tot en met 8, van de STCW-Code;
        - sectie A-III/2, paragraaf 1, 2, 3, 4, 5 en 7 van de STCW-Code, met uitzondering van het aspect
      personeelsmanagement;
        - sectie A-V/1, paragraaf 2 tot en met 7 van de STCW-Code, en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel58
  - number: 58.c
    text: |-
      heeft de aanvrager: een goedgekeurde stage aan boord vervuld van ten minste een jaar als onderdeel van de onder
      b bedoelde opleiding, onder bijhouding van een goedgekeurd stageboek, en tijdens deze stage gedurende ten minste
      een half jaar wachtdienst op de brug gelopen onder toezicht van de kapitein, een bevoegde stuurman of een bevoegd
      maritiem officier en gedurende ten minste een half jaar dienst gedaan in de machinekamer.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel58
  - number: '59'
    text: Voor de afgifte van het kennisbewijs Baggeraar-stuurman of wachtstuurman,
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel59
  - number: 59.a
    text: |-
      voldoet de aanvrager aan: - voorschrift II/1, de paragrafen 2.4.en 2.5 van de bijlage bij het STCW-Verdrag;
        - voorschrift II/2, paragraaf 2.2 van de bijlage bij het STCW-Verdrag;
        - voorschrift V/1, paragraaf 1.2, van de bijlage bij het STCW-Verdrag;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel59
  - number: 59.b
    text: |-
      heeft de aanvrager met goed gevolg examen afgelegd ter afsluiting van een opleiding die ten minste voldoet aan: -
      sectie A-II/1, de paragrafen 1 tot en met 6 van de STCW-Code
        - sectie A-II/2, de paragrafen 1 tot en met 7, van de STCW-Code, met uitzondering van de aspecten
      coördinatie reddingsacties, opstellen wachtschema's en orders, radarnavigatie, reageren op noodsituaties en
      personeelsmanagement.
        - sectie A-V/1, de paragrafen 2 tot en met 7 van de STCW-Code, en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel59
  - number: 59.c
    text: |-
      heeft de aanvrager: een goedgekeurde stage aan boord vervuld van ten minste een jaar als onderdeel van de onder
      b bedoelde opleiding, onder bijhouding van een goedgekeurd stageboek, en tijdens deze stage gedurende ten minste
      een half jaar wachtdienst op de brug gelopen onder toezicht van de kapitein, een bevoegde stuurman of een bevoegd
      maritiem officier.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel59
  - number: '60'
    text: |-
      Voor de afgifte van het kennisbewijs aanvulling stuurman handelsvaart is de aanvrager in het bezit van het
      kennisbewijs stuurman grote zeilvaart en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel60
  - number: 60.a
    text: |-
      voldoet hij tevens aan: - voorschrift II/1, de paragrafen 2.4.en 2.5 van de bijlage bij het STCW-Verdrag;
