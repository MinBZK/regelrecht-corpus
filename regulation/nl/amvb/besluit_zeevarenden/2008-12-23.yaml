$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_zeevarenden
regulatory_layer: AMVB
publication_date: '2025-04-11'
valid_from: '2008-12-23'
bwb_id: BWBR0012778
url: https://wetten.overheid.nl/BWBR0012778/2008-12-23
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 16 augustus 2000, kenmerk DGG/J-00/004155,
    Directoraat-Generaal Goederenvervoer, Stafafdeling Wetgeving, Bestuurlijke en Juridische Zaken;

    Gelet op de artikelen 16, 18, derde, vierde, vijfde en zesde lid, 19, eerste lid, 22, eerste lid, 25, eerste
    lid, 34, eerste lid, 36, 44, eerste lid, 64 en 71, eerste en vierde lid, van de Zeevaartbemanningswet, op
    de artikelen 5, eerste lid, en 24, eerste lid, onder e, van de Loodsenwet, op artikel 10, tweede lid, van de
    Scheepvaartverkeerswet, op het op 7 juli 1978 te Londen tot stand gekomen Internationale Verdrag betreffende
    de normen voor zeevarenden inzake opleiding, diplomering en wachtdienst, 1978 (Trb. 1981, 144), zoals dat is
    gewijzigd op 7 juli 1995 (Trb. 1996, 249), op Hoofdstuk III, voorschrift 10, en voorschrift 24–1.3, Hoofdstuk
    IV, voorschrift 16, Hoofdstuk V, voorschrift 13, onderdeel (c), en Hoofdstuk X, voorschrift 1, 2 en 3, van het
    op 1 november 1974 te Londen tot stand gekomen Internationale Verdrag tot beveiliging van mensenlevens op zee,
    1974, zoals dat is gewijzigd op 23 mei 1994 (Trb.1996, 18), op Richtlijn nr. 94/58/EG van de Raad van de Europese
    Unie van 22 november 1994 inzake het minimumopleidingsniveau van zeevarenden (PbEG L 319), op Richtlijn nr.98/35/
    EG van de Raad van de Europese Unie van 25 mei 1998 tot wijziging van Richtlijn 94/58/EG inzake het minimum-
    opleidingsniveau van zeevarenden (PbEG L 172), op artikel 10, zesde lid, van de Algemene wet erkenning EG-hoger-
    onderwijsdiploma's, op artikel 13 van de Algemene wet EG-beroepsopleidingen, op Richtlijn nr. 92/29/EEG van de
    Raad van de Europese Gemeenschappen van 31 maart 1992 betreffende de minimumvoorschriften inzake veiligheid en
    gezondheid ter bevordering van een betere medische hulpverlening aan boord van schepen (Pb EGL113), op het op 27
    juni 1946 te Seattle tot stand gekomen Verdrag No. 69 van de Internationale Arbeidsconferentie inzake het diploma
    van bekwaamheid als scheepskok, 1946 (Stb. I 328), op het op 27 juni 1946 te Seattle tot stand gekomen Verdrag No.
    73 van de Internationale Arbeidsconferentie inzake het geneeskundig onderzoek van zeelieden, 1946 (Stb. I 326) en
    op het op 27 juni 1946 te Seattle tot stand gekomen Verdrag No. 74 van de Internationale Arbeidsconferentie inzake
    de diplomering van volmatrozen (Stb. I 330);

    De Raad van State gehoord (advies van 3 november 2000, nr. WO9.00 0378/V);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 17 augustus 2001, kenmerk DGG/J-01/005164,
    Directoraat-Generaal Goederenvervoer, Stafafdeling Wetgeving en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel1
  - number: 1.1.a
    text: |-
      de wet: de [Zeevaartbemanningswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009124
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009124
  - number: 1.1.b
    text: |-
      ervaring: de diensttijd in jaren, in een bepaalde functie aan boord van in de vaart zijnde zeeschepen, gerekend met
      ingang van de dag van aanmonstering tot en met de dag van afmonstering;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel1
  - number: 1.1.c
    text: |-
      voortstuwingsvermogen: het maximale vermogen, uitgedrukt in kiloWatt, dat op het geldige bemanningscertificaat
      is vermeld;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel1
  - number: 1.1.d
    text: |-
      reizen nabij de kust: het gebruik van een schip met een bruto-tonnage van minder dan 500 GT en een
      voorststuwingsvermogen van minder dan 3000 kW, in een vaargebied dat zich uitstrekt tot dertig zeemijlen uit de
      kust, met dien verstande dat het schip ten hoogste twaalf uren varen verwijderd is van een op het certificaat van
      deugdelijkheid met name genoemde werkhaven en nooit verder verwijderd is dan zes uren varen vanaf een beschutte
      haven of rede;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel1
  - number: 1.1.e
    text: 'tankschip: een schip, gebouwd of aangepast en gebruikt voor het vervoer in bulk van vloeibare producten;'
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel1
  - number: 1.1.f
    text: 'olietankschip: een tankschip gebouwd en gebezigd voor het vervoer in bulk van aardolie of aardolieproducten;'
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel1
  - number: 1.1.g
    text: |-
      chemicaliëntankschip: een tankschip gebouwd en gebezigd voor het vervoer in bulk van vloeibare producten die zijn
      opgenomen in hoofdstuk 17 van de Internationale Code inzake het vervoer van chemicaliën in bulk;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel1
  - number: 1.1.h
    text: |-
      gastankschip: een tankschip gebouwd en gebezigd voor het vervoer in bulk van vloeibaar gemaakt gas of ander product
      dat is opgenomen in hoofdstuk 19 van de Internationale Code inzake het vervoer van vloeibaar gemaakt gas;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel1
  - number: 1.1.i
    text: 'passagiersschip: een schip bestemd of gebezigd voor het bedrijfsmatig vervoer van meer dan twaalf passagiers;'
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel1
  - number: 1.1.j
    text: |-
      ro-ro passagiersschip: een passagiersschip met ruimten voor ro-ro lading of ruimten van bijzondere aard, zoals
      bedoeld in Hoofdstuk II-2/A van het SOLAS-verdrag;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel1
  - number: 1.1.k
    text: |-
      hogesnelheidsvaartuig: een schip dat is staat is zich voort te bewegen met een snelheid in meters per seconde die
      gelijk of groter is dan 3,7 ▿ 0,1667, waarbij ▿ staat voor de waterverplaatsing in m3 op de ontwerpwaterlijn.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel1
  - number: 1.1.l
    text: 'zeilschip: een schip dat bestemd is en ingericht is om hoofdzakelijk door middel van zeilen te worden voortbewogen;'
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel1
  - number: 1.1.m
    text: |-
      STCW-Verdrag: het op 7 juli 1978 te Londen tot stand gekomen Internationaal Verdrag betreffende de normen voor
      zeevarenden inzake opleiding, diplomering en wachtdienst, 1978 (Trb. 1981, 144);
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel1
  - number: 1.1.n
    text: |-
      STCW-Code: de Code inzake opleiding, diplomering en wachtdienst van zeevarenden, behorend bij het STCW-Verdrag
      (Trb. 1996, 249);
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel1
  - number: 1.1.o
    text: 'geneeskundige verklaring: een verklaring als bedoeld in artikel 104;'
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel1
  - number: 1.1.p
    text: 'Medisch Adviseur Scheepvaart: de medisch adviseur van de inspecteur-generaal;'
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel1
  - number: 1.1.q
    text: 'kW: kiloWatt;'
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel1
  - number: 1.1.r
    text: |-
      GT: de bruto inhoud van het schip, vastgesteld volgens de bepalingen krachtens de [Meetbrievenwet 1981][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003378
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003378
  - number: 1.1.s
    text: |-
      lengte: de lengte van een zeilschip die gelijk is aan 96 procent van de lengte van de lastlijn op 85 procent van
      de kleinste holte naar de mal gemeten vanaf de bovenzijde van de kielplaat, dan wel gelijk is aan de lengte van
      de voorzijde van de voorsteven tot aan de hartlijn van de roerkoning gemeten op deze lastlijn, indien deze laatste
      lengte groter is.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel1
  - number: 1.1.t
    text: |-
      kennisbewijs: het diploma of certificaat afgegeven door een instelling als bedoeld in de
      [Wet educatie en beroepsonderwijs (WEB)][ref1] dan wel een getuigschrift of verklaring afgegeven door een
      instelling als bedoeld in de [Wet hoger onderwijs en wetenschappelijk onderzoek (WHW)][ref2] of een certificaat
      afgeven door een door Onze Minister erkende opleiding waaruit blijkt dat een erkende opleiding met goed gevolg
      is afgesloten;


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007625
      - id: ref2
        bwb_id: BWBR0005682
  - number: 1.1.u
    text: 'High-Speed Craft Code: de ingevolge hoofdstuk X van het SOLAS-verdrag toepasselijke High-Speed Craft Code;'
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel1
  - number: 1.1.v
    text: |-
      aannemersmaterieel: schepen gebruikt voor het uitvoeren van bagger-, kust- en oeverwerken, met inbegrip van schepen
      gebruikt voor de bevoorrading van op zee gelegen mijnbouwinstallaties en sleepboten, mits gebruikt binnen een
      afstand gelegen binnen 200 zeemijlen vanuit een met name genoemde werkhaven;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel1
  - number: 1.1.w
    text: |-
      SOLAS-verdrag: het op 1 november 1974 te Londen totstandgekomen Verdrag voor de beveiliging van mensenlevens op zee
      (Trb. 1976, 157) en de bij dat verdrag behorende bindende protocollen, aanhangsels en bijlagen.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel1
  - number: '1.2'
    text: |-
      Een werkhaven als bedoeld in dit besluit beschikt 24 uur per dag over nautische en technische ondersteuning ten
      behoeve van schepen die in gebruik zijn als aannemersmaterieel.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel1
  - number: '2'
    text: |-
      Dit besluit is niet van toepassing ten aanzien van vissersvaartuigen en zeilvaartuigen met een lengte van minder
      dan 12 meter.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel2
  - number: '3.1'
    text: |-
      Op verzoek van de scheepsbeheerder kan de inspecteur-generaal ontheffing verlenen van de verplichting om het schip
      te bemannen in overeenstemming met het bemanningscertificaat indien blijkt dat:
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel3
  - number: 3.1.a
    text: korte tijd voor het vertrek van het schip uit de haven een of meer leden van de bemanning niet beschikbaar zijn;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel3
  - number: 3.1.b
    text: dringende omstandigheden ertoe nopen het vertrek niet langer uit te stellen, en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel3
  - number: 3.1.c
    text: |-
      met de aan boord aanwezige bemanning, gelet op de bijzonderheden van de reis, het schip zonder gevaar voor het
      schip of andere zaken, voor personen, het milieu of de scheepvaart deze reis kan ondernemen.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel3
  - number: '3.2'
    text: |-
      Op verzoek van de scheepsbeheerder kan de inspecteur-generaal een ontheffing als bedoeld in
      [artikel 25 van de wet][ref1] verlenen, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel25
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '25'
  - number: 3.2.a
    text: er onvoldoende bemanningsleden, in het bezit van de vereiste kwalificaties, voorhanden zijn,
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel3
  - number: 3.2.b
    text: |-
      de ontheffing verleend wordt aan een bemanningslid dat in het bezit is van het vaarbevoegdheidsbewijs dat vereist
      is voor de relevante lagere functie, en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel3
  - number: 3.2.c
    text: |-
      met de aan boord aanwezige bemanning, gelet op de bijzonderheden van de reis, het schip zonder gevaar voor het
      schip of andere zaken, voor personen, het milieu of de scheepvaart deze reis kan ondernemen.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel3
  - number: '3.3'
    text: |-
      Een ontheffing als bedoeld in [artikel 25 van de wet][ref1] wordt voor de functie van kapitein of
      hoofdwerktuigkundige slechts gegeven in zeer bijzondere omstandigheden die niet het gevolg zijn van het handelen
      of het nalaten te handelen van de zijde van de scheepsbeheerder en indien gedurende korte tijd de vervulling van
      die functie door een bemanningslid met een lagere bevoegdheid noodzakelijk is voor de voortzetting van de reis,
      en de veiligheid van het schip en de opvarenden, de veilige vaart ter zee en de bescherming van het mariene milieu
      gewaarborgd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel25
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '25'
  - number: '4.1'
    text: De vaarbevoegdheden genoemd in dit besluit zijn niet geldig op vissersvaartuigen.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel4
  - number: '4.2'
    text: De vaarbevoegdheden alle schepen zijn geldig op alle schepen.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel4
  - number: '4.3'
    text: De vaarbevoegdheden als
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel4
  - number: 4.3.1
    text: eerste maritiem officier kleine schepen, en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel4
  - number: 4.3.2
    text: |-
      maritiem officier kleine schepen zijn uitsluitend geldig op schepen van minder dan 3000 GT en een
      voorstuwingsvermogen van minder dan 3000 kW.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel4
  - number: '4.4'
    text: |-
      De vaarbevoegdheden als kapitein tot 3000 GT en eerste stuurman tot 3000 GT zijn uitsluitend geldig op schepen van
      minder dan 3000 GT.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel4
  - number: '4.5'
    text: De vaarbevoegdheden als
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel4
  - number: 4.5.1
    text: hoofdwerktuigkundige tot 3000 kW, en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel4
  - number: 4.5.2
    text: |-
      tweede werktuigkundige tot 3000 kW zijn uitsluitend geldig op schepen met een voortstuwingsvermogen van minder dan
      3000 kW.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel4
  - number: '4.6'
    text: |-
      De vaarbevoegdheden zijn alleen geldig aan boord van olietankschepen, chemicaliën-tankschepen, gastankschepen,
      stoomschepen, zeilschepen of op een andere bij regeling van Onze Minister aan te wijzen categorie van schepen,
      indien dit uitdrukkelijk op het vaarbevoegdheidsbewijs is aangegeven.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel4
  - number: '4.7'
    text: |-
      Een vaarbevoegdheid is uitgebreid of beperkt tot een bepaalde categorie schepen, dan wel tot een bepaald bruto-
      tonnage respectievelijk een bepaald voortstuwingsvermogen indien deze uitbreiding respectievelijk beperking
      uitdrukkelijk op het vaarbevoegdheidsbewijs is opgenomen.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel4
  - number: '5'
    text: |-
      Bij regeling van Onze Minister wordt bepaald op welke wijze de in [artikel 4][ref1], genoemde aanvullingen dan wel
      beperkingen op vaarbevoegdheidsbewijzen worden aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel4
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '4'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '6.1'
    text: |-
      Tenzij uitdrukkelijk anders is bepaald wordt de ervaring of diensttijd uitgedrukt in jaren en behaald in ten minste
      de functie van wachtstuurman, wachtwerktuigkundige of maritiem officier. De functie van maritiem officier houdt in
      het afwisselend verantwoordelijk zijn voor de wacht op de brug dan wel aan dek, of in de machinekamer.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel6
  - number: '6.2'
    text: 'Bij regeling van Onze Minister wordt bepaald:'
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel6
  - number: 6.2.a
    text: aan boord van welke categorieën schepen de ervaring voor een bepaalde vaarbevoegdheid wordt opgedaan;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel6
  - number: 6.2.b
    text: aan boord van welke grootte klasse of het voortstuwingsvermogen van schepen de ervaring moet zijn opgedaan, en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel6
  - number: 6.2.c
    text: welke ervaring, niet opgedaan aan boord van schepen, in aanmerking wordt genomen.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel6
  - number: '7'
    text: |-
      Een vaarbevoegdheidsbewijs, met uitzondering van dat voor gezellen, is geldig tot ten hoogste vijf jaar na de datum
      van afgifte.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel7
  - number: '8.1'
    text: |-
      Een vaarbevoegdheidsbewijs wordt afgegeven indien de aanvrager aantoont te voldoen aan de ingevolge dit besluit
      vereiste kennis en ervaring, mits het kennisbewijs ten hoogste vier jaar voor het indienen van de aanvraag is
      afgegeven.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel8
  - number: '8.2'
    text: |-
      Een vaarbevoegdheidsbewijs of een aanvulling daarop kan vernieuwd worden, indien de houder in de periode van
      vijf jaar voorafgaand aan de datum van de aanvraag tot vernieuwing ten minste één jaar heeft dienstgedaan in een
      naar het oordeel van de inspecteur-generaal relevante functie waarvoor een vaarbevoegdheid is vereist en die door
      de houder op grond van de aan hem toegekende vaarbevoegdheden mocht worden vervuld, dan wel in een andere, bij
      regeling van Onze Minister vastgestelde, daarmee vergelijkbare functie.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel8
  - number: '8.3'
    text: |-
      In het geval van vernieuwing als genoemd in het tweede lid, wordt het vaarbevoegdheidsbewijs dat is vernieuwd,
      ingenomen of zonodig ongeldig gemaakt.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel8
  - number: '8.4'
    text: |-
      Een vaarbevoegdheidsbewijs, dat door verloop van de geldigheidsduur ongeldig is geworden, en dat niet op grond
      van het tweede lid kan worden vernieuwd, wordt op verzoek vernieuwd indien de aanvrager direct voorafgaand aan
      de aanvraag:
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel8
  - number: 8.4.a
    text: een daartoe door Onze Minister erkende opleiding heeft gevolgd en met succes heeft afgesloten;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel8
  - number: 8.4.b
    text: |-
      gedurende drie maanden in een naar het oordeel van de inspecteur-generaal relevante functie boven de sterkte heeft
      gevaren, of
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel8
  - number: 8.4.c
    text: |-
      op grond van een ontheffing, gedurende ten minste drie maanden in een naar het oordeel van de inspecteur-generaal
      relevante, maar lagere functie heeft gevaren dan waarvoor zijn ongeldig geworden vaarbevoegdheidsbewijs gold.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel8
  - number: '8.5'
    text: |-
      Een vaarbevoegdheidsbewijs dat verloren is gegaan kan worden vervangen door een duplicaat vaarbevoegdheidsbewijs,
      waarvan de einddatum overeenkomt met de einddatum op het originele document.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel8
  - number: '8.6'
    text: |-
      Indien de aanvrager van een duplicaat aanspraak kan maken op vernieuwing van het vaarbevoegdheidsbewijs, wordt hem
      desgevraagd met inachtneming van het tweede lid een vaarbevoegdheidsbewijs afgegeven.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel8
  - number: '8.7'
    text: |-
      Het vierde lid is van overeenkomstige toepassing indien de eerste aanvraag van een vaarbevoegdheidsbewijs niet is
      ingediend binnen vier jaar na de datum waarop het kennisbewijs van de opleiding is afgegeven.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel8
  - number: '8.8'
    text: |-
      De kosten van de afgifte van een vaarbevoegdheidsbewijs of een duplicaat-vaarbevoegdheidsbewijs worden bij de
      aanvraag voldaan.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel8
  - number: '9.1'
    text: |-
      Onze Minister erkent een vaarbevoegdheidsbewijs, diploma of certificaat dat is afgegeven door een bevoegde
      autoriteit van een staat, niet zijnde een Lid-Staat van de Europese Unie, een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte of de Bondsstaat Zwitserland, indien ten aanzien van dat
      vaarbevoegdheidsbewijs, diploma of certificaat wordt voldaan aan de criteria, bedoeld in artikel 18, derde lid, van
      [Richtlijn nr. 2001/25/EG](32001L0025) van het Europees Parlement en de Raad van de Europese Gemeenschappen van 4
      april 2001 inzake het minimumopleidingsniveau van zeevarenden (PbEG L 136).
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel9
  - number: '9.2'
    text: |-
      Onze Minister kan tot 1 februari 2002 ten behoeve van zeevarenden die voor 1 augustus 1998 met hun opleiding of
      dienst aan boord zijn begonnen, andere criteria hanteren dan die genoemd in artikel 9, derde lid van de in het
      eerste lid genoemde richtlijn voor de erkenning van hun diploma of vaarbevoegdheidsbewijs.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel9
  - number: '9.3'
    text: |-
      Indien een vaarbevoegdheidsbewijs, diploma of certificaat wordt erkend als gelijkwaardig aan een
      vaarbevoegdheidsbewijs met inachtneming van [artikel 4][ref1] wordt aan de aanvrager het overeenkomstige
      Nederlandse vaarbevoegdheidsbewijs van erkenning afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel4
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '4'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '9.4'
    text: |-
      Voor de afgifte van een vaarbevoegdheidsbewijs als kapitein, eerste stuurman of hoofdwerktuigkundige legt de
      aanvrager het certificaat Wetgeving en Openbaar Gezag over.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel9
  - number: '9.5'
    text: Het eerste tot en met derde lid zijn niet van toepassing op vaarbevoegdheidsbewijzen van gezellen.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel9
  - number: '10'
    text: |-
      Voor de afgifte van een vaarbevoegdheidsbewijs als kapitein, eerste stuurman of hoofdwerktuigkundige op grond
      van [artikel 22a van de wet][ref1] legt de aanvrager het in [artikel 92a][ref2] genoemde certificaat Wetgeving en
      Openbaar Gezag over.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel22a
      [ref2]: https://wetten.overheid.nl/BWBR0012778#Artikel92a
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: 22a
      - id: ref2
        bwb_id: BWBR0012778
        artikel: 92a
        hoofdstuk: '4'
        paragraaf: '9'
  - number: '11.1'
    text: |-
      De kennisbewijzen voor de afgifte van een vaarbevoegdheidsbewijs om daarmee dienst te kunnen doen aan boord van
      schepen in de functie van kapitein, maritiem officier of stuurman zijn in neerdalende lijn:
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel11
  - number: 11.1.a
    text: hoger maritiem officier;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel11
  - number: 11.1.b
    text: middelbaar maritiem officier; baggeraar-stuurman of wachtstuurman;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel11
  - number: 11.1.c
    text: stuurman-werktuigkundige kleine schepen of stuurman tot 3000 GT;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel11
  - number: 11.1.d
    text: schipper-machinist beperkt werkgebied.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel11
  - number: 11.2.a
    text: |-
      Met het kennisbewijs middelbaar maritiem officier wordt voor de verkrijging van een vaarbevoegdheidsbewijs
      gelijkgesteld het diploma als derde stuurman voor de grote handelsvaart tezamen met het diploma A als
      scheepswerktuigkundige.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel11
  - number: 11.2.b
    text: |-
      Met het kennisbewijs wachtstuurman wordt voor de verkrijging van een vaarbevoegdheids-bewijs gelijkgesteld het
      kennisbewijs stuurman grote zeilvaart tezamen met het kennisbewijs aanvulling stuurman handelsvaart.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel11
  - number: '11.3'
    text: |-
      De diploma's, bedoeld in de Wet op de zeevaartdiploma's voor de afgifte van een vaarbevoegdheidsbewijs om daarmee
      dienst te kunnen doen aan boord van schepen in de functie van kapitein of stuurman zijn in neerdalende lijn:
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel11
  - number: 11.3.a
    text: diploma als eerste stuurman voor de grote handelsvaart;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel11
  - number: 11.3.b
    text: diploma als tweede stuurman voor de grote handelsvaart;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel11
  - number: 11.3.c
    text: diploma als stuurman voor de grote sleepvaart;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel11
  - number: 11.3.d
    text: diploma als derde stuurman voor de grote handelsvaart.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel11
  - number: '11.4'
    text: |-
      Met het diploma als derde stuurman voor de grote handelsvaart wordt voor de verkrijging van een
      vaarbevoegdheidsbewijs gelijkgesteld het diploma als stuurman voor de kleine handelsvaart tezamen met het
      aanvullingsdiploma als stuurman voor de kleine handelsvaart.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel11
  - number: '11.5'
    text: |-
      Voor de dienst aan boord van zeilschepen wordt met het kennisbewijs wachtstuurman in combinatie met het certificaat
      grote zeilvaart, bedoeld in [artikel 86 van dit besluit][ref1], gelijkgesteld het kennisbewijs grote zeilvaart.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel86
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '86'
        hoofdstuk: '4'
        paragraaf: '6'
  - number: '12.1'
    text: |-
      De kennisbewijzen voor de afgifte van een vaarbevoegdheidsbewijs om daarmee dienst te kunnen doen aan boord van
      schepen in de functie van maritiem officier of werktuigkundige zijn in neerdalende lijn:
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel12
  - number: 12.1.a
    text: hoger maritiem officier;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel12
  - number: 12.1.b
    text: middelbaar maritiem officier; baggeraar-machinist of wachtwerktuigkundige;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel12
  - number: 12.1.c
    text: stuurman-werktuigkundige kleine schepen of werktuigkundige tot 3000 kW;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel12
  - number: 12.1.d
    text: schipper-machinist beperkt werkgebied.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel12
  - number: '12.2'
    text: |-
      De diploma's, bedoeld in de Wet op de zeevaartdiploma's voor de afgifte van een vaarbevoegdheidsbewijs om daarmee
      dienst te kunnen doen aan boord van schepen in de functie van werktuigkundige zijn in neerdalende lijn:
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel12
  - number: 12.2.a
    text: diploma C als scheepswerktuigkundige;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel12
  - number: 12.2.b
    text: diploma B als scheepswerktuigkundige;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel12
  - number: 12.2.c
    text: diploma A als scheepswerktuigkundige;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel12
  - number: 12.2.d
    text: diploma als motordrijver.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel12
  - number: '12.3'
    text: |-
      Met het diploma als motordrijver worden voor de verkrijging van een vaarbevoegdheidsbewijs gelijkgesteld: het
      diploma als assistent scheepswerktuigkundige, het voorlopig diploma als scheepswerktuigkundige, alsmede het
      diploma als motordrijver zeevisvaart en het diploma voor de zeevisvaart W IV-v, uitgereikt krachtens de Wet op de
      Zeevischvaartdiploma's, Stb. 1935, 455.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel12
  - number: '13.1'
    text: |-
      Het kennisbewijs voor de afgifte van een vaarbevoegdheidsbewijs om daarmee dienst te kunnen doen in de functie van
      kapitein of eerste stuurman van schepen op reizen nabij de kust, is het kennisbewijs als schipper-machinist beperkt
      werkgebied en het kennisbewijs als stuurman-werktuigkundige voor de zeevisvaart SW 5.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel13
  - number: '13.2'
    text: |-
      De diploma's voor de afgifte van een vaarbevoegdheidsbewijs om daarmee dienst te kunnen doen in de functie
      van kapitein of stuurman van schepen op reizen nabij de kust, zijn het diploma als stuurman voor de kleine
      handelsvaart, het diploma als stuurman voor de kustsleepvaart, het diploma als stuurman voor de beperkte kleine
      handelsvaart, alsmede het diploma voor de zeevisvaart SW V.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel13
  - number: '14'
    text: |-
      Onverminderd [artikel 8][ref1], geeft het bezit van het kennisbewijs als hoger maritiem officier of als middelbaar
      maritiem officier de aanvrager recht op het vaarbevoegdheidsbewijs voor alle schepen als:


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel8
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 14.1.a
    text: maritiem officier;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel14
  - number: 14.1.b
    text: wachtstuurman; en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel14
  - number: 14.1.c
    text: eerste stuurman tot 3000 GT, indien hij in het bezit is van
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel14
  - number: 14.1.c.i
    text: het algemeen certificaat voor de maritieme radiocommunicatie, en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel14
  - number: 14.1.c.ii
    text: de leeftijd heeft bereikt van 18 jaar;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel14
  - number: 14.1.d
    text: wachtwerktuigkundige, indien hij de leeftijd heeft bereikt van 18 jaar;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel14
  - number: '14.2'
    text: eerste stuurman, indien hij naast het genoemde in 1, onderdeel c, onder i, in het bezit is van
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel14
  - number: 14.2.i
    text: het certificaat radarnavigator;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel14
  - number: 14.2.ii
    text: het certificaat scheepsmanagement-N, en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel14
  - number: 14.2.iii
    text: een diensttijd heeft van twee jaar als stuurman of maritiem officier;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel14
  - number: '14.3'
    text: tweede werktuigkundige, indien hij een diensttijd heeft van een jaar;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel14
  - number: '14.4'
    text: hoofdwerktuigkundige, indien hij in het bezit is van
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel14
  - number: 14.4.i
    text: het certificaat scheepsmanagement-W, en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel14
  - number: 14.4.ii
    text: |-
      een diensttijd heeft van vier jaar als werktuigkundige of maritiem officier, waarvan ten minste een jaar als tweede
      werktuigkundige of eerste maritiem officier;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel14
  - number: '14.5'
    text: |-
      eerste maritiem officier, indien hij naast het genoemde in 1, onderdeel c, onder i, 2, onder i en ii, 4, onder i,
      een diensttijd heeft van drie jaar als maritiem officier;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel14
  - number: '14.6'
    text: |-
      kapitein, indien hij naast het genoemde in 1, onderdeel c, onder i, 2, onder i en ii, een diensttijd heeft van
      vier jaar als stuurman of maritiem officier, waarvan ten minste een jaar als eerste stuurman of eerste maritiem
      officier.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel14
  - number: '15'
    text: |-
      Onverminderd [artikel 8][ref1], geeft het bezit van het kennisbewijs als baggeraar-stuurman, als wachtstuurman
      alle schepen dan wel het diploma als derde stuurman voor de grote handelsvaart de aanvrager recht op het
      vaarbevoegdheidsbewijs voor alle schepen als:


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel8
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
