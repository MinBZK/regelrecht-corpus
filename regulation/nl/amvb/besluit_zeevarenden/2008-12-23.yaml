    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel82
  - number: '83'
    text: |-
      Voor de afgifte van het certificaat crisisbeheersing en menselijk gedrag, heeft de aanvrager met goed gevolg een
      door Onze Minister erkende opleiding en training afgerond die voldoet aan:
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel83
  - number: 83.a
    text: voorschrift V/2, paragraaf 8 van de bijlage bij het STCW-Verdrag, en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel83
  - number: 83.b
    text: sectie A-V/2, paragraaf 5 van de STCW-Code.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel83
  - number: '84'
    text: |-
      Voor de afgifte van het certificaat stoomvoortstuwing heeft de houder van ten minste het kennisbewijs
      wachtwerktuigkundige, dan wel van ten minste het diploma A als scheepswerktuigkundige, met goed gevolg examen
      afgelegd ter afsluiting van een door Onze Minister erkende opleiding die ten minste voldoet aan sectie A-III/1
      en sectie A-III/2 van de STCW-Code voor wat betreft de functie scheepswerktuigkunde, en met name de aspecten
      stoomketels, stoomturbines en veiligheidsvoorschriften.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel84
  - number: '85.1'
    text: |-
      Voor de afgifte van een type rating certificate voor de dienst aan boord van een hogesnelheidsvaartuig bestemd of
      gebezigd voor het vervoer van 36 passagiers of meer heeft de houder van tenminste het kennisbewijs wachtstuurman
      of wachtwerktuigkundige dan wel het diploma als derde stuurman voor de grote handelsvaart of het diploma A als
      scheepswerktuigkundige, met goed gevolg een door Onze Minister erkende opleiding en training afgerond die voldoet
      aan voorschrift 18.3.3 van de High Speed Craft Code.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel85
  - number: '85.2'
    text: |-
      Voor de afgifte van een type rating certificate voor de dienst aan boord van een hogesnelheidsvaartuig bestemd of
      gebezigd voor het vervoer van minder dan 36 passagiers heeft de houder van tenminste het kennisbewijs schipper-
      machinist beperkt werkgebied met goed gevolg een door Onze Minister erkende opleiding en training afgerond die
      voldoet aan voorschrift 18.3.3 van de High Speed Craft Code.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel85
  - number: '85.3'
    text: |-
      Een *type rating certificate* heeft een geldigheidsduur van maximaal twee jaar. Na afloop van de geldigheidsduur
      kan de geldigheid van het certificaat telkenmale met een periode van maximaal twee jaar worden verlengd mits de
      betrokkene aantoont dat hij in de afgelopen twee jaar tenminste een half jaar heeft dienst gedaan aan boord van
      het, in het certificaat genoemde, hogesnelheidsvaartuig.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel85
  - number: '86.1'
    text: |-
      Voor afgifte van het certificaat grote zeilvaart voor de dienst aan boord van zeilschepen met een lengte
      van 40 meter of meer heeft de houder van een diploma of kennisbewijs als bedoeld in de [artikelen 58][ref1],
      [59][ref2], [62][ref3] of [63][ref4] met goed gevolg examen afgelegd ter afsluiting van een door Onze Minister
      erkende opleiding in de aspecten scheepsvormen, materialen en tuigage, behandeling van zeilschepen en dynamische
      stabiliteit van zeilschepen.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0012778#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0012778#Artikel62
      [ref4]: https://wetten.overheid.nl/BWBR0012778#Artikel63
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012778
        artikel: '59'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0012778
        artikel: '62'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0012778
        artikel: '63'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '86.2'
    text: |-
      Voor de afgifte van het kennisbewijs stuurman grote zeilvaart voldoet de aanvrager aan: - voorschrift II/1,
      paragrafen 2.4 en 2.5 van de bijlage bij het STCW-verdrag;
        - voorschrift II/2, paragraaf 4.3 van de bijlage bij het STCW-verdrag;
        - voorschrift IV/2, paragraaf 2.2 van de bijlage bij het STCW-verdrag; en
        - voorschrift VI/1 van de bijlage bij het STCW-verdrag; en heeft de aanvrager met goed gevolg examen afgelegd ter
      afsluiting van een opleiding die ten minste voldoet aan: - sectie A-II/1, de paragrafen 1 tot en met 6, van de
      STCW-Code, met uitzondering van de functie behandeling en stuwen van lading;
        - sectie A-II/2, de paragrafen 1 tot en met 7, van de STCW-Code, met uitzondering van de functie behandeling
      en stuwen van lading, en onder toevoeging van de aspecten materialen en tuigage, scheepsvormen, behandeling van
      zeilschepen en dynamische stabiliteit van zeilschepen, en heeft de aanvrager een vaartijd behaald van tenminste een
      jaar waarvan tenminste één seizoen aan boord van zeilschepen is doorgebracht.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel86
  - number: '86.3'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld met betrekking tot de beroepsvereisten voor de dienst aan
      boord van zeilschepen met een lengte van minder dan 40 meter.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel86
  - number: '87'
    text: |-
      Voor de afgifte van het certificaat basisveiligheid heeft de aanvrager met goed gevolg een door Onze Minister
      erkende opleiding en training afgerond die voldoet aan: - voorschrift VI/1 van de bijlage bij het STCW-Verdrag, en
        - sectie A-VI/1, paragraaf 2 van de STCW-Code.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel87
  - number: '88'
    text: |-
      Voor de afgifte van het certificaat sloepsgast heeft de aanvrager met goed gevolg een door Onze Minister erkende
      opleiding en training afgerond die voldoet aan: - voorschrift VI/2, paragraaf 1 van de bijlage bij het STCW-
      Verdrag, en
        - sectie A-VI/2, paragraaf 1 tot en met 4, van de STCW-Code.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel88
  - number: '89'
    text: |-
      Voor de afgifte van het certificaat van bekwaamheid in het gebruik van snelle hulpverleningsboten voldoet de
      aanvrager aan: - voorschrift VI/2, paragraaf 2 van de bijlage bij het STCW-Verdrag, en
        - heeft de aanvrager met goed gevolg een door Onze Minister erkende opleiding en training afgerond die voldoet aan
      sectie A-VI/2, paragraaf 5 tot en met 8, van de STCW-Code.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel89
  - number: '90'
    text: |-
      Voor de afgifte van het certificaat brandbestrijding voor gevorderden heeft de aanvrager met goed gevolg een door
      Onze Minister erkende opleiding en training afgerond die voldoet aan: - voorschrift VI/3, van de bijlage bij het
      STCW-Verdrag, en
        - sectie A-VI/3 van de STCW-Code.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel90
  - number: '91.1'
    text: |-
      Voor de afgifte van het certificaat scheepsgezondheidszorg B, heeft de aanvrager met goed gevolg een door
      Onze Minister erkende training en opleiding afgerond die voldoet aan [Richtlijn 92/29/EG](31992L0029)
      (Minimumvoorschriften inzake veiligheid en gezondheid ter bevordering van een betere medische hulpverlening aan
      boord van schepen); deze opleiding omvat in elk geval:
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel91
  - number: 91.1.a
    text: kennis van de beginselen van de fysiologie, van de ziekteverschijnselen en van de therapie;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel91
  - number: 91.1.b
    text: elementaire kennis op het gebied van de preventieve gezondheidszorg, waaronder begrepen de hygiëne;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel91
  - number: 91.1.c
    text: elementaire kennis van profylactische maatregelen;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel91
  - number: 91.1.d
    text: praktische kennis van elementaire medische handelingen;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel91
  - number: 91.1.e
    text: kennis van de wijze van evacuatie van patiënten;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel91
  - number: 91.1.f
    text: kennis van de wijze waarop de middelen voor medische consultatie op afstand moeten worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel91
  - number: '91.2'
    text: |-
      Voor de afgifte van een certificaat scheepsgezondheidszorg O voldoet de aanvrager aan het eerste lid, en heeft ter
      verwerving van praktische kennis van elementaire medische handelingen, als bedoeld in het eerste lid, onderdeel d,
      een praktijk stage vervuld op een afdeling voor spoedeisende hulp in een algemeen ziekenhuis van een bij regeling
      van Onze Minister vast te stellen duur, dan wel met goed gevolg een vergelijkbare training voltooid die voldoet aan
      bij regeling van Onze Minister vast te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel91
  - number: '91.3'
    text: |-
      Voor de afgifte van een verlenging van de geldigheidsduur van het certificaat scheepsgezondheidszorg B heeft de
      aanvrager met goed gevolg een door Onze Minister erkende bijscholingscursus gevolgd die tenminste de in het eerste
      lid genoemde onderdelen a tot en met f omvat.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel91
  - number: '91.4'
    text: |-
      Voor de afgifte van een verlenging van de geldigheidsduur van het certificaat scheepsgezondheidszorg O voldoet
      de aanvrager aan het derde lid en heeft een herhalingsstage vervuld op een afdeling voor spoedeisende hulp in
      een algemeen ziekenhuis van een bij regeling van Onze Minister vast te stellen duur, dan wel met goed gevolg een
      vergelijkbare training voltooid die voldoet aan bij regeling van Onze Minister vast te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel91
  - number: '92.1'
    text: 'Voor de afgifte van het diploma als scheepskok heeft de aanvrager:'
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel92
  - number: 92.1.a
    text: |-
      met goed gevolg een door Onze Minister erkende opleiding en training afgerond die tenminste de volgende aspecten
      bevat: '- het bereiden van maaltijden;'
        - het bakken van brood;
        - het behandelen van vlees;
        - de kennis van de voedingswaarden van voedingsmiddelen;
        - het opstellen van goed samengestelde en gevarieerde menu's;
        - behandelen en opbergen van levensmiddelen;
        - kennis van hygiëne met betrekking tot de kombuis;
        - kennis van proviand administratie;
        - kennis van buitenlandse maten en gewichten, en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel92
  - number: 92.1.b
    text: een diensttijd behaald van ten minste en half jaar in de kombuis van een zeeschip.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel92
  - number: '92.2'
    text: |-
      In afwijking van lid 1, onder a en b, kan de inspecteur-generaal een diploma als scheepskok afgeven aan een
      aanvrager die aantoont dat hij op 1 augustus 1986 als scheepskok voer of als zodanig bij een rederij in dienst was
      en gedurende de daaraan voorafgaande periode een dienstverband van tenminste drie jaar als scheepskok heeft gehad
      met een Nederlandse zeewerkgever, en op die datum 23 jaar of ouder was.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel92
  - number: 92a.1
    text: |-
      Voor de afgifte van het certificaat »Wetgeving en Openbaar Gezag» heeft de aanvrager met goed gevolg een door Onze
      Minister erkende opleiding wetgeving en openbaar gezag afgerond.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel92a
  - number: 92a.2
    text: 'Deze opleiding omvat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel92a
  - number: 92a.2.a
    text: kennis en inzicht in de Nederlandse wetgeving op de scheepvaart betrekking hebbende;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel92a
  - number: 92a.2.b
    text: |-
      kennis van de bepalingen en handleidingen inzake het uitoefenen van openbaar gezag aan boord, alsmede vaardigheid
      in de toepassing hiervan, en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel92a
  - number: 92a.2.c
    text: |-
      kennis van de maatregelen te nemen ter beveiliging van het schip en vaardigheid in het optreden in havens en op zee
      wat betreft veiligheidsaangelegenheden.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel92a
  - number: '93.1'
    text: Bij regeling van Onze Minister wordt het model van de monsterrol vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel93
  - number: '93.2'
    text: |-
      Op de monsterrol worden naast de gegevens, genoemd in [artikel 33 van de wet][ref1] voor ieder bemanningslid
      aangetekend:


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel33
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '33'
  - number: 93.2.a
    text: de plaats en de dag van aanmonstering en de plaats en de dag van afmonstering;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel93
  - number: 93.2.b
    text: de geboortedatum;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel93
  - number: 93.2.c
    text: het nummer van het monsterboekje;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel93
  - number: 93.2.d
    text: de naam en roepletters van het schip.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel93
  - number: '93.3'
    text: Bij regeling van Onze Minister kan worden bepaald dat andere gegevens in de monsterrol worden vermeld.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel93
  - number: '94.1'
    text: |-
      Alvorens een schip voor de eerste maal naar zee vertrekt en vervolgens met tussenpozen van niet meer dan twaalf
      maanden wordt een monsterrol opgemaakt.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel94
  - number: '94.2'
    text: Bij elke wijziging in de bemanningssamenstelling wordt een monsterrol opgemaakt.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel94
  - number: '94.3'
    text: |-
      Ter uitvoering van [artikel 34, eerste lid, onderdeel d, van de wet][ref1] zendt de kapitein binnen een week na het
      opmaken, dan wel in de eerstvolgende haven de monsterrol aan de scheepsbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel34
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '34'
  - number: '94.4'
    text: De scheepsbeheerder houdt aantekening van de datum van ontvangst van monsterrollen.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel94
  - number: '94.5'
    text: |-
      De monsterrollen worden ten kantore van de scheepsbeheerder in Nederland bewaard en ter beschikking gehouden ten
      behoeve van het houden van toezicht door de inspecteur-generaal.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel94
  - number: '95'
    text: |-
      De scheepsbeheerder stelt de inspecteur-generaal telkenmale schriftelijk in kennis van het feit dat hij van de
      kapitein een opgemaakte monsterrol heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel95
  - number: '96'
    text: |-
      De scheepsbeheerder bewaart een monsterrol, nadat zij is vervangen of nadat de geldigheidsduur is verstreken,
      gedurende drie jaar na de vervangingsdatum of geldigheidsdatum.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel96
  - number: '97.1'
    text: De inspecteur-generaal geeft een monsterboekje af aan degene die bij de aanvraag voldoet aan het tweede lid.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel97
  - number: '97.2'
    text: 'Voor de afgifte van een monsterboekje komt uitsluitend in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel97
  - number: 97.2.a
    text: |-
      degene die aantoont dat met een scheepsbeheerder of zeewerkgever een arbeidsovereenkomst voor de vaart ter zee is
      aangegaan of zal worden aangegaan;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel97
  - number: 97.2.b
    text: degene die aantoont een opleiding te volgen voor een beroep waarvoor een vaarbevoegdheidsbewijs vereist is;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel97
  - number: 97.2.c
    text: degene die behoort tot een andere, door Onze Minister aan te wijzen categorie personen, of
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel97
  - number: 97.2.d
    text: |-
      degene die het monsterboekje naar het oordeel van de inspecteur-generaal ten behoeve van zijn beroepsuitoefening
      nodig heeft.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel97
  - number: '98.1'
    text: 'Bij het verzoek om afgifte van een monsterboekje worden de volgende bescheiden overgelegd:'
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel98
  - number: 98.1.a
    text: een geldig paspoort of ander geldig nationaliteitsbewijs van de houder;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel98
  - number: 98.1.b
    text: |-
      twee identieke, recente, goedgelijkende pasfoto's van de aanvrager, zo mogelijk zonder hoofddeksel, van ongeveer 4
      cm hoogte en 3 cm breedte, zodanig dat de afbeelding voor ongeveer drievierde de ene gelaatshelft en voor ongeveer
      één-vierde de andere weergeeft; de pasfoto's vertonen geen beschadigingen en zijn aan de achterzijde voorzien van
      de naam van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel98
  - number: 98.1.c
    text: |-
      een niet langer dan 6 maanden voor de aanvraag afgegeven, de aanvrager betreffend gewaarmerkt afschrift van de
      benodigde gegevens uit de basisadministratie persoonsgegevens van de gemeente waar de aanvrager is ingeschreven;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel98
  - number: 98.1.d
    text: |-
      de bewijsstukken, waardoor wordt aangetoond dat de aanvrager aan [artikel 97][ref1] voldoet;


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel97
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '97'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 98.1.e
    text: |-
      zo nodig aanvullende informatie, die nodig is om de gegevens, bedoeld in [artikel 99][ref1], in het monsterboekje
      te kunnen opnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel99
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '99'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '98.2'
    text: |-
      De aanvraag wordt niet in behandeling genomen dan nadat de kosten voor de afgifte van het monsterboekje zijn
      voldaan.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel98
  - number: '98.3'
    text: |-
      In plaats van de in het eerste lid, onderdeel a, genoemde documenten kunnen daarvan kopieën worden overgelegd, die
      door de ambtenaar van de afdeling bevolking van de gemeente waar de aanvrager is ingeschreven zijn gewaarmerkt of
      door een andere door de inspecteur-generaal geaccepteerde autoriteit.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel98
  - number: '98.4'
    text: |-
      In plaats van het in het eerste lid, onderdeel c, genoemde afschrift kan, indien de aanvrager zijn hoofdverblijf
      niet in Nederland heeft, worden volstaan met documenten die in het land van herkomst gebruikelijk zijn.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel98
  - number: '98.5'
    text: De inspecteur-generaal bepaalt de wijze van afgifte van het monsterboekje.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel98
  - number: '99.1'
    text: |-
      Alvorens het monsterboekje af te geven, met uitzondering van het voorlopig monsterboekje als bedoeld in
      [artikel 101, eerste lid, onder a][ref1], tekent de inspecteur-generaal in elk geval de volgende gegevens erin aan:


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel101
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '101'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 99.1.a
    text: 'van de houder:'
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel99
  - number: 99.1.a.1°
    text: naam en voornamen;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel99
  - number: 99.1.a.2°
    text: plaats en datum van geboorte;en
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel99
  - number: 99.1.a.3°
    text: nationaliteit.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel99
  - number: 99.1.b
    text: de plaats en datum van afgifte;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel99
  - number: 99.1.c
    text: de datum, waarop de geldigheid vervalt.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel99
  - number: '99.2'
    text: 'Voorts bevat het monsterboekje:'
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel99
  - number: 99.2.a
    text: |-
      een pasfoto als bedoeld in [artikel 98, eerste lid, onderdeel b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel98
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '98'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 99.2.b
    text: de handtekening van de houder.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel99
  - number: '99.3'
    text: Een monsterboekje is slechts geldig indien het de handtekening van de houder bevat.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel99
  - number: '100.1'
    text: |-
      Bij de aanvraag van een monsterboekje wegens verlies van het reeds afgegeven monsterboekje legt de aanvrager
      behalve de in [artikel 98, eerste lid, onderdelen a en b][ref1] genoemde bescheiden, een verklaring over waaruit
      blijkt dat de aanvrager van de vermissing van het monsterboekje aangifte heeft gedaan dan wel andere bewijsstukken
      met betrekking tot het verlies.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel98
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '98'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '100.2'
    text: |-
      Bij de aanvraag van een monsterboekje ter vernieuwing van het monsterboekje, respectievelijk het
      verlopen van de geldigheidsduur of het onbruikbaar worden van het monsterboekje legt de aanvrager het
      oude, respectievelijk onbruikbaar geworden monsterboekje over, alsmede twee pasfoto's'als bedoeld in
      [artikel 98, eerste lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel98
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '98'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '101.1'
    text: |-
      Onverminderd [artikel 97, tweede lid][ref1], kan in de volgende gevallen een voorlopig monsterboekje worden
      afgegeven:


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel97
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '97'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 101.1.a
    text: indien de aanvrager niet tijdig in Nederland een monsterboekje kan aanvragen;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel101
  - number: 101.1.b
    text: |-
      op verzoek van de zeevarende die aantoont het monsterboekje niet langer dan drie maanden nodig te hebben voor zijn
      werkzaamheden aan boord; of
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel101
  - number: 101.1.c
    text: |-
      indien naar het oordeel van de inspecteur-generaal niet zeker is dat de aanvrager een arbeidsovereenkomst met de
      scheepsbeheerder of de zeewerkgever zal kunnen sluiten.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel101
  - number: '101.2'
    text: |-
      In het geval, genoemd in het eerste lid, onderdeel a, wordt het monsterboekje ingevuld en afgegeven door de
      kapitein.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel101
  - number: '101.3'
    text: |-
      In de gevallen, genoemd in het eerste lid, onderdelen b en c, wordt het monsterboekje ingevuld en afgegeven door de
      inspecteur-generaal.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel101
  - number: '102'
    text: |-
      De [artikelen 97, tweede lid][ref1], [98][ref2] en [99][ref3] zijn van overeenkomstige toepassing bij de afgifte
      van een vervangend monsterboekje of een voorlopig monsterboekje.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel97
      [ref2]: https://wetten.overheid.nl/BWBR0012778#Artikel98
      [ref3]: https://wetten.overheid.nl/BWBR0012778#Artikel99
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '97'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012778
        artikel: '98'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0012778
        artikel: '99'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '103.1'
    text: |-
      Bij regeling van Onze Minister wordt bepaald welke personen naast de inspecteur-generaal en de kapitein bevoegd
      zijn tot het maken van de daarbij genoemde aanvullende aantekeningen of van wijzigingen in een monsterboekje of een
      voorlopig monsterboekje.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel103
  - number: '103.2'
    text: |-
      Een monsterboekje of een voorlopig monsterboekje, waarin een ander dan een van de in het eerste lid bedoelde
      personen de daarbij genoemde aantekeningen of wijzigingen heeft aangebracht, is ongeldig.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel103
  - number: '103.3'
    text: |-
      Degene, die onbevoegd aantekeningen of wijzigingen heeft aangebracht in een monsterboekje, draagt de kosten van de
      vervanging van dat monsterboekje.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel103
  - number: '104.1'
    text: |-
      Alle bemanningsleden aan boord van Nederlandse schepen zijn voorzien van een geldige geneeskundige verklaring
      zeevaart.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel104
  - number: '104.2'
    text: |-
      Een bemanningslid dat aan boord met een wachtfunctie is belast, is bovendien voorzien van een verklaring
      dat dit lid voldoet aan de medische eisen betreffende het gezichtsorgaan en het gehoor, bedoeld in
      [artikel 106, eerste lid, tweede volzin][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel106
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '106'
        hoofdstuk: '6'
  - number: '104.3'
    text: Het model voor de verklaringen, bedoeld in het eerste en tweede lid, wordt door Onze Minister vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel104
  - number: '105.1'
    text: |-
      Ten behoeve van de afgifte van een in [artikel 104][ref1] genoemde geneeskundige verklaring worden de
      bemanningsleden aan een daarop gericht medisch onderzoek onderworpen door een door Onze Minister daartoe als
      keuringsarts aangewezen geneeskundige.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel104
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '104'
        hoofdstuk: '6'
  - number: '105.2'
    text: |-
      Indien de keuringsarts twijfels heeft omtrent de medische geschiktheid dan wel wanneer in de medische eisen,
      bedoeld in [artikel 106, eerste lid][ref1], een specialistisch rapport is vereist, verwijst deze arts de keurling
      voor deelonderzoek door naar een specialist.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel106
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '106'
        hoofdstuk: '6'
  - number: '105.3'
    text: |-
      Een geneeskundige verklaring zeevaart wordt afgegeven door een keuringsarts die heeft vastgesteld
      dat de keurling voldoet aan de voor die verklaring van toepassing zijnde medische eisen, bedoeld in
      [artikel 106, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel106
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '106'
        hoofdstuk: '6'
  - number: '105.4'
    text: |-
      Indien de gekeurde gebruik wenst te maken van zijn recht om opnieuw te worden onderzocht, wordt hij onderzocht door
      een ingevolge [artikel 42, eerste lid, van de wet][ref1] als scheidsrechter aangewezen geneeskundige.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel42
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '42'
  - number: '105.5'
    text: |-
      De in dit besluit bedoelde onderzoeken worden verricht door geneeskundigen die niet de behandelend arts of
      specialist van de keurling zijn.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel105
  - number: '106.1'
    text: |-
      Bij regeling van Onze Minister worden de medische eisen vastgesteld waaraan de keurling moet voldoen om in
      aanmerking te komen voor de geneeskundige verklaring, bedoeld in [artikel 104][ref1]. Daarbij worden tevens de
      medische eisen betreffende het gezichtsorgaan en het gehoor vastgesteld voor bemanningsleden die aan boord een
      wachtfunctie vervullen.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel104
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '104'
        hoofdstuk: '6'
  - number: '106.2'
    text: |-
      Bij regeling van Onze Minister worden de procedures en andere voorschriften vastgesteld die in acht worden genomen
      bij elk van de onderzoeken, bedoeld in [artikel 105][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel105
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '105'
        hoofdstuk: '6'
  - number: '106.3'
    text: |-
      Bij de vaststelling van medische eisen wordt bepaald ten aanzien van welke nieuwe medische eisen een ontheffing als
      bedoeld in [artikel 44, tweede lid, van de wet][ref1] kan worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel44
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '44'
  - number: '106.4'
    text: |-
      In afwijking van het vereiste in het eerste lid kan de Medisch Adviseur Scheepvaart aan een keurling ontheffing
      verlenen van één van de medische eisen indien naar zijn mening het niet voldoen aan die medische eis de veiligheid
      niet nadelig beïnvloedt.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel106
  - number: '107.1'
    text: |-
      De geldigheid van een geneeskundige verklaring van geschiktheid voor de zeevaart als bedoeld in [artikel 104][ref1]
      vervalt na verloop van ten hoogste twee jaar na de datum van afgifte ervan.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel104
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '104'
        hoofdstuk: '6'
  - number: '107.2'
    text: |-
      Op medische gronden kan de keuringsarts een geneeskundige verklaring van geschiktheid voor de zeevaart als genoemd
      in [artikel 104][ref1] afgeven voor een kortere duur dan die, genoemd in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel104
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '104'
        hoofdstuk: '6'
  - number: '107.3'
    text: |-
      De keuringsarts kan voorts een geneeskundige verklaring van geschiktheid voor de zeevaart als bedoeld in
      [artikel 104][ref1] afgeven voor een beperkt vaargebied.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel104
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '104'
        hoofdstuk: '6'
  - number: '108.1'
    text: De keuringsarts kan de gekeurde tijdelijk of blijvend ongeschikt voor de zeevaart verklaren.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel108
  - number: '108.2'
    text: 'De gekeurde is:'
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel108
  - number: 108.2.a
    text: |-
      tijdelijk ongeschikt, indien op medische gronden wordt verwacht dat hij niet langer dan drie jaren voor de zeevaart
      ongeschikt zal zijn;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel108
  - number: 108.2.b
    text: |-
      blijvend ongeschikt, indien op medische gronden wordt verwacht dat hij langer dan drie jaren voor de zeevaart
      ongeschikt zal zijn.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel108
  - number: '109'
    text: |-
      De keuringsarts die het onderzoek uitvoert, neemt de in [artikel 106, eerste lid][ref1], bedoelde medische
      eisen, de in [artikel 106, tweede lid][ref2], bedoelde procedures en andere voorschriften, alsook voorzover van
      toepassing, de [artikelen 107][ref3] en [108][ref4] in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel106
      [ref2]: https://wetten.overheid.nl/BWBR0012778#Artikel106
      [ref3]: https://wetten.overheid.nl/BWBR0012778#Artikel107
      [ref4]: https://wetten.overheid.nl/BWBR0012778#Artikel108
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '106'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0012778
        artikel: '106'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0012778
        artikel: '107'
        hoofdstuk: '6'
      - id: ref4
        bwb_id: BWBR0012778
        artikel: '108'
        hoofdstuk: '6'
  - number: '110.1'
    text: |-
      Een geneeskundige kan Onze Minister verzoeken hem aan te wijzen als keuringsarts. Bij het verzoek wordt een geldig
      bewijs van registratie als arts, bedoeld in de [Wet op de beroepen in de individuele gezondheidszorg][ref1],
      overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006251
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0006251
  - number: '110.2'
    text: |-
      Indien het verzoek is ingediend door een geneeskundige die in het buitenland zijn praktijk houdt, vergewist de
      Medisch Adviseur Scheepvaart zich van diens vakbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel110
  - number: '110.3'
    text: |-
      Onze Minister gaat niet over tot aanwijzing van een geneeskundige indien diens onafhankelijkheid ten opzichte
      van werkgevers, werknemers of hun organisaties niet gewaarborgd is, of ingeval diens professionele kundigheden,
      praktijkervaring of beroepsuitrusting naar het oordeel van de Medisch Adviseur Scheepvaart, ressorterend onder Onze
      Minister, ontoereikend zijn.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel110
  - number: '110.4'
    text: |-
      Bij het besluit van Onze Minister over de aanwijzing worden het aantal reeds aangewezen geneeskundigen en de
      spreiding over het land in relatie tot de regionale of plaatselijke behoefte in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel110
  - number: '110.5'
    text: |-
      De aanwijzing als keurend arts wordt afgegeven voor een periode van ten hoogste vijf jaren. Na afloop van deze
      periode kan een hernieuwd verzoek om aanwijzing als keurend arts worden ingediend; bij dit hernieuwde verzoek wordt
      het bewijsstuk vermeld in het eerste lid overgelegd, tenzij het tweede lid van toepassing is.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel110
  - number: '110.6'
    text: |-
      De aangewezen geneeskundige is verplicht de door Onze Minister, op aanbeveling van de Medisch Adviseur
      Scheepvaart, aangewezen nascholingscursussen te volgen. De kosten van deelname komen voor rekening van de betrokken
      geneeskundige.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel110
  - number: '111'
    text: |-
      Onze Minister trekt, op advies van de Medisch Adviseur Scheepvaart, een aanwijzing in indien is gebleken dat de
      keuringsarts of scheidsrechter:
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel111
  - number: 111.a
    text: de algemeen geldende medische of ethische normen niet in acht neemt;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel111
  - number: 111.b
    text: |-
      zich bij herhaling niet houdt aan het gestelde in de [artikelen 105 tot en met 109][ref1] of zijn beroepsuitrusting
      niet toereikend is voor zijn taak als keuringsarts;


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel105
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '105'
        hoofdstuk: '6'
  - number: 111.c
    text: valse of vervalste verklaringen heeft afgegeven;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel111
  - number: 111.d
    text: niet meer in het betrokken register vermeld is als arts;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel111
  - number: 111.e
    text: onder curatele is gesteld wegens geestelijke stoornis;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel111
  - number: 111.f
    text: anderszins niet meer gerechtigd is de geneeskunst uit te oefenen;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel111
  - number: 111.g
    text: een daartoe strekkend verzoek heeft ingediend;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel111
  - number: 111.h
    text: diens onafhankelijkheid ten opzichte van werkgevers, werknemers of hun organisaties niet langer gewaarborgd is;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel111
  - number: 111.i
    text: |-
      een te gering aantal keuringen heeft verricht om door praktische ervaring zijn bekwaamheid als keuringsarts op peil
      te houden, of
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel111
  - number: 111.j
    text: heeft verzuimd een voor hem aangewezen nascholingscursus te volgen.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel111
  - number: '112.1'
    text: |-
      De kosten van een geneeskundig onderzoek, heronderzoek of specialistisch deelonderzoek als bedoeld in de
      [artikelen 40][ref1] en [42 van de wet][ref2] komen voor rekening van de scheepsbeheerder of werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel42
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '40'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '42'
  - number: '112.2'
    text: |-
      Voor zover er geen scheepsbeheerder of werkgever is aan te wijzen worden de kosten, bedoeld in het eerste lid,
      gedragen door degene die opdracht heeft gegeven voor het onderzoek.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel112
  - number: '112.3'
    text: |-
      De kosten van een geneeskundig onderzoek of specialistisch deelonderzoek als bedoeld in
      [artikel 23, tweede lid, van de wet][ref1] worden door het Rijk gedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel23
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '23'
  - number: '112.4'
    text: |-
      De kosten van een heronderzoek of een aanvullend specialistisch deelonderzoek, bedoeld in de [artikelen 40][ref1]
      en [42 van de wet][ref2] worden gedragen door het Rijk, voor zover zij naar het oordeel van Onze Minister
      redelijkerwijs niet voor rekening van de gekeurde behoren te komen.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel42
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '40'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '42'
  - number: '113.1'
    text: |-
      De Medisch Adviseur Scheepvaart kan geneeskundige verklaringen, afgegeven op grond van medische eisen die naar
      zijn oordeel ten minste gelijkwaardig zijn aan het geheel van de medische eisen die krachtens dit besluit worden
      gesteld, gelijkstellen met een of meer krachtens dit besluit afgegeven geneeskundige verklaringen van geschiktheid
      voor de zeevaart.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel113
  - number: '113.2'
    text: |-
      Een geneeskundige verklaring als bedoeld in het eerste lid die niet op grond van dit besluit is afgegeven, mag niet
      langer dan twee jaren vóór de beoordeling zijn afgegeven.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel113
  - number: '113.3'
    text: |-
      Bij toepassing van het eerste lid geeft de Medisch Adviseur Scheepvaart een geneeskundige verklaring af als genoemd
      in [artikel 104][ref1] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel104
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '104'
        hoofdstuk: '6'
  - number: '116.1'
    text: |-
      Bemanningsleden aan wie in de alarmrol van het schip een veiligheidstaak wordt opgedragen dan wel die een taak
      ten aanzien van het voorkomen van verontreiniging van de zee hebben, zijn in het bezit van een certificaat waaruit
      blijkt dat zij met goed gevolg een door Onze Minister erkende training en opleiding «basis veiligheid» als bedoeld
      in [artikel 87][ref1] hebben gevolgd, tenzij zij aan de hand van een monsterboekje of van een soortgelijk document
      kunnen aantonen dat zij reeds voor 1 augustus 1998 aan boord van zeeschepen werkzaam waren.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel87
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '87'
        hoofdstuk: '4'
        paragraaf: '7'
  - number: '116.2'
    text: |-
      Voor bemanningsleden met de functie van ten minste wachtstuurman, wachtwerktuigkundige of maritiem officier geldt
      het geldige vaarbevoegdheidsbewijs als het certificaat, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel116
  - number: '116.3'
    text: |-
      Overige bemanningsleden, die niet behoren tot de categorieën genoemd in het eerste of het tweede lid, krijgen
      voordat zij hun taken aan boord beginnen voldoende informatie en instructie ten einde:
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel116
  - number: 116.3.a
    text: |-
      met de overige opvarenden over elementaire veiligheidszaken te kunnen spreken, begrip te hebben van de
      veiligheidssymbolen en de alarmseinen te kennen;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel116
  - number: 116.3.b
    text: |-
      te weten wat te doen indien: iemand over boord valt; vuur of rook wordt ontdekt; het sein «brandalarm» of «schip
      verlaten» wordt gegeven;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel116
  - number: 116.3.c
    text: te weten waar de reddingsgordels zich bevinden en hoe deze om te doen;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel116
  - number: 116.3.d
    text: alarm te slaan en bekend te zijn met het gebruik van handbrandblussers;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel116
  - number: 116.3.e
    text: te weten wat te doen bij een ongeluk voordat hulp wordt ingeroepen;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel116
  - number: 116.3.f
    text: |-
      de brand- en waterdichte deuren, met uitzondering van die ter afsluiting van openingen in de romp, te kunnen
      sluiten en openen.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel116
  - number: '117.1'
    text: |-
      De kapitein van elk schip draagt er zorg voor dat voor het ondernemen van een reis en gedurende de reis
      overeenkomstig Hoofdstuk III/10 van het SOLAS-verdrag voldoende sloepsgasten aan boord zijn die in het bezit zijn
      van het certificaat, bedoeld in [artikel 88][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel88
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '88'
        hoofdstuk: '4'
        paragraaf: '7'
  - number: '117.2'
    text: |-
      Voor de toepassing van het eerste lid worden kapiteins, stuurlieden en maritieme officieren geacht in het bezit te
      zijn van het certificaat als sloepsgast.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel117
  - number: '117.3'
    text: |-
      De kapitein van elk schip dat is uitgerust met snelle hulpverleningsboten draagt er zorg voor dat voor het
      ondernemen van een reis en gedurende de reis voor iedere snelle hulpverleningsboot tenminste twee bemanningsleden
      beschikbaar zijn in het bezit van het certificaat van bekwaamheid in het gebruik van snelle hulpverleningsboten als
      bedoeld in [artikel 89][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel89
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '89'
        hoofdstuk: '4'
        paragraaf: '7'
  - number: '118.1'
    text: |-
      De kapitein en het bemanningslid aan wie, onder de verantwoordelijkheid van de kapitein, de zorg voor het
      gebruik en het beheer van de medische uitrusting is overgedragen zijn in het bezit van het certificaat
      scheepsgezondheidszorg-O (onbeperkt), bedoeld in [artikel 91, tweede lid][ref1], of, wanneer aan het schip een
      veiligheidscertificaat voor vrachtschepen dan wel veiligheidscertificaat voor passagierschepen voor beperkt
      vaargebied is afgegeven in die zin dat het schip uitsluitend reizen onderneemt in zeegebied A2, zoals omschreven
      in Hoofdstuk IV van het SOLAS-verdrag, van het certificaat scheepsgezondheidszorg-B (beperkt), bedoeld in
      [artikel 91, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0012778#Artikel91
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '91'
        hoofdstuk: '4'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0012778
        artikel: '91'
        hoofdstuk: '4'
        paragraaf: '8'
  - number: '118.2'
    text: |-
      Voor de toepassing van het eerste lid worden bezitters van het kennisbewijs maritiem officier, middelbaar maritiem
      officier, stuurman werktuigkundige kleine schepen, baggeraarstuurman, wachtstuurman, stuurman grote zeilvaart en
      stuurman kleine zeilvaart en het diploma als derde stuurman voor de grote handelsvaart geacht in het bezit te zijn
      van het certificaat scheepsgezondheiszorg B.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel118
  - number: '118.3'
    text: |-
      De in het eerste lid bedoelde personen volgen ten minste eenmaal in de vijf jaar een bijscholingscursus als
      bedoeld in [artikel 91, derde lid][ref1], die voor personen aan boord van vaartuigen met een veiligheidscertificaat
      voor vrachtschepen dan wel veiligheidscertificaat voor passagierschepen voor onbeperkt vaargebied mede een
      herhalingsstage, bedoeld in [artikel 91, vierde lid][ref2], omvat.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0012778#Artikel91
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '91'
        hoofdstuk: '4'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0012778
        artikel: '91'
        hoofdstuk: '4'
        paragraaf: '8'
  - number: '118.4'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel118
  - number: '119.1'
    text: |-
      Op een schip dat op een internationaal traject van meer dan drie dagen vaart, met een bemanning en overig personeel
      van honderd personen of meer die, in welke hoedanigheid ook, aan boord ten behoeve van het schip in dienst of
      tewerkgesteld zijn, inclusief stagiairs en leerlingen alsmede personen die werkzaam zijn als loods, is een arts
      aanwezig.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel119
  - number: '119.2'
    text: |-
      Indien aan het eerste lid is voldaan, kan in afwijking van [artikel 118, eerste lid][ref1], voor de kapitein worden
      volstaan met het bezit van het certificaat scheepsgezondheidszorg B, bedoeld in [artikel 91, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel118
      [ref2]: https://wetten.overheid.nl/BWBR0012778#Artikel91
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '118'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0012778
        artikel: '91'
        hoofdstuk: '4'
        paragraaf: '8'
  - number: '119.3'
    text: |-
      Bij regeling van Onze Minister kunnen, met inachtneming van het bepaalde bij of krachtens
      [artikel 21 van de wet][ref1], nadere eisen worden gesteld ten aanzien van de bekwaamheid van de in het eerste lid
      genoemde arts.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel21
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '21'
  - number: '120.1'
    text: |-
      Aan boord van een schip waarvan de voorgeschreven bemanning uit meer dan 9 personen bestaat, moet daarboven een
      gediplomeerde scheepskok belast zijn met de bereiding van de voeding.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel120
  - number: '120.2'
    text: |-
      Onder een gediplomeerde scheepskok wordt verstaan een persoon van 18 jaar of ouder in het bezit van een door de
      Minister erkend diploma als scheepskok als bedoeld in [artikel 92][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel92
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '92'
        hoofdstuk: '4'
        paragraaf: '9'
  - number: '120.3'
    text: |-
      Onze Minister kan diploma's, door bevoegde autoriteiten in andere landen afgegeven op grond van het Verdrag
      betreffende het diploma van bekwaamheid als scheepskok, 1946, als gelijkwaardig aan Nederlandse diploma's erkennen.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel120
  - number: '120.4'
    text: |-
      De inspecteur-generaal kan op een daartoe strekkend verzoek van de scheepsbeheerder voor een bepaalde tijd
      ontheffing verlenen van het eerste lid met betrekking tot het gediplomeerd zijn van de scheepskok, indien er naar
      zijn redelijk oordeel een onvoldoende aantal gediplomeerde scheepskoks ter beschikking staat.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel120
  - number: '120.5'
    text: |-
      Aan een in het vierde lid bedoelde ontheffing kunnen voorschriften worden verbonden. Indien de voorschriften niet
      worden nageleefd kan de inspecteur-generaal een verleende ontheffing tussentijds intrekken.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel120
  - number: '121.1'
    text: |-
      Aan boord van een schip dat reizen onderneemt buiten het zeegebied A1, zoals omschreven in Hoofdstuk IV van
      het SOLAS-verdrag, is ten minste één persoon die als chef van de wacht, bedoeld in Sectie A-VIII/2, part 1, van
      de STCW-Code, kan optreden in het bezit van een algemeen certificaat maritieme radio-communicatie, afgegeven
      in overeenstemming met het bepaalde bij of krachtens het [Frequentiebesluit][ref1]; een van deze personen is
      door de kapitein aangewezen als de verantwoordelijke persoon voor de afhandeling van radioberichtgeving tijdens
      noodgevallen. Alle andere personen die als chef van de wacht kunnen optreden zijn in het bezit zijn van het
      beperkte certificaat maritieme radiocommunicatie


      [ref1]: https://wetten.overheid.nl/BWBR0009997
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0009997
  - number: '121.2'
    text: |-
      Aan boord van een schip dat uitsluitend reizen onderneemt in zeegebied A1, is ten minste één der personen die als
      chef van de wacht kunnen optreden in het bezit van het beperkt certificaat maritieme radiocommunicatie, afgegeven
      in overeenstemming met het bepaalde bij of krachtens het [Frequentiebesluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009997
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0009997
  - number: '122'
    text: 'De scheepsbeheerder draagt er zorg voor dat:'
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel122
  - number: 122.a
    text: |-
      tussen alle bemanningsleden een doelmatige communicatie over veiligheidsaspecten kan plaatsvinden. Voorts dient
      hij zeker te stellen dat er op adequate wijze communicatie kan plaatsvinden tussen het schip en de autoriteiten te
      land, in een gemeenschappelijke taal of in de taal van de autoriteiten;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel122
  - number: 122.b
    text: aan boord van passagiersschepen een werktaal wordt vastgesteld die in het journaal wordt aangetekend;
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel122
  - number: 122.c
    text: |-
      aan boord van passagiersschepen de bemanningsleden, die op de alarmrol zijn aangewezen om de passagiers in kritieke
      situaties te helpen, beschikken over voor dat doel toereikende communicatieve vaardigheden en duidelijk herkenbaar
      zijn en,
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel122
  - number: 122.d
    text: |-
      onverminderd het bepaalde onder a, op olietankschepen, chemicaliëntankschepen en gastankschepen, de bemanningsleden
      in staat zijn met elkaar te communiceren in een of meer gemeenschappelijke werktalen.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel122
  - number: '123.1'
    text: |-
      De scheepsbeheerder legt aan de inspecteur-generaal een verklaring in drievoud over, waarin hij voor ieder
      onderdeel van [artikel 122][ref1], voor zover het desbetreffende onderdeel betrekking heeft op zijn schip,
      nauwkeurig vermeldt op welke wijze hij ten aanzien van zijn schip uitvoering heeft gegeven aan zijn verplichtingen
      ingevolge dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel122
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '122'
        hoofdstuk: '7'
  - number: '123.2'
    text: |-
      De inspecteur-generaal registreert de overgelegde verklaring, bedoeld in het eerste lid, en zendt de eigenaar twee
      door hem ten teken van registratie gewaarmerkte afschriften van de verklaring.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel123
  - number: '123.3'
    text: |-
      De eigenaar verschaft de kapitein een van de twee exemplaren van de geregistreerde verklaring, bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel123
  - number: '123.4'
    text: De verklaring, bedoeld in het eerste lid, heeft een geldigheidsduur van vijf jaar.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel123
  - number: '123.5'
    text: |-
      In afwijking van het vierde lid heeft de verklaring, bedoeld in het eerste lid, voor passagiersschepen een
      geldigheidsduur van één jaar.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel123
  - number: '123.6'
    text: De verklaring bedoeld in het derde lid wordt door de kapitein in een voor iedereen toegankelijke plaats opgehangen.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel123
  - number: '124'
    text: |-
      Bij regeling van Onze Minister kunnen, ter uitvoering van Verdragen of van besluiten van volkenrechtelijke
      organisaties, nadere regels worden gesteld met betrekking tot de in dit besluit geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel124
  - number: 124a
    text: |-
      Bij regeling van Onze Minister kunnen ter uitvoering van de [Verordening (EG) nr. 725/2004](32004R0725) van het
      Europees Parlement en de Raad van 31 maart 2004 betreffende de verbetering van de beveiliging van zeeschepen
      en havenfaciliteiten (PbEG L 129) nadere regels worden gesteld omtrent de opleiding van de voorgeschreven
      scheepsbeveiligingsofficier.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel124a
  - number: '125'
    text: |-
      De op het tijdstip van inwerkingtreding van de wet ten behoeve van de medische of scheidsrechterlijke keuring van
      zeevarenden aangewezen artsen en medisch specialisten blijven aangewezen tot het tijdstip dat de aanwijzing met
      inachtneming van dit besluit wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel125
  - number: '126'
    text: |-
      Het koninklijk besluit van 8 oktober 1937, tot vaststelling van een Algemeenen Maatregel van Bestuur ter
      uitvoering van artikel 2, derde lid, van de Wet op de Zeevaartdiploma’s 1935 (Staatsblad n°. 456), Stb. 579B wordt
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel126
  - number: '132'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop de [Hoofdstukken 2][ref1] en
      [4 van de Zeevaartbemanningswet][ref2] in werking treden.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0009124
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0009124
        hoofdstuk: '4'
  - number: 130_bis
    text: 'Dit besluit wordt aangehaald als: Besluit zeevaartbemanning handelsvaart en zeilvaart.'
    url: https://wetten.overheid.nl/BWBR0012778/2008-12-23#Artikel130
