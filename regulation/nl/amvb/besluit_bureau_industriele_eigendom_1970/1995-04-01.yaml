preamble:
  text: >-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.


    Op de voordracht van de Staatssecretaris van Economische Zaken van 18 november 1970, no. 670/540 Dir. W.J.A.;


    Gelet op artikel 4, tweede lid, van de Wet van 25 april 1963 (Stb. 221), houdende goedkeuring van het Benelux-
    Verdrag met eenvormige wet inzake de warenmerken, alsmede enkele daarmede verband houdende voorzieningen;


    De Raad van State gehoord (advies van 9 december 1970, no. 7);


    Gezien het nader rapport van voormelde Staatssecretaris van 15 december 1970, no. 670/581 Dir. W.J.A.;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002737/1995-04-01#ArtikelAanhef
articles:
  - number: '2'
    text: |-
      1 Met de leiding van het Bureau voor de industriële eigendom is een Directeur belast, behoudens dat voor de
      Octrooiraad gelden de voorschriften in dit reglement en in het [Octrooireglement][ref1] (*Stb.* 1921, 1083)
      gegeven.

      2 De Voorzitter van de Octrooiraad is tevens Directeur van het Bureau voor de industriële eigendom.

      3 Bij afwezigheid of ontstentenis van de Directeur worden zijn werkzaamheden verricht door de ondervoorzitters van
      de Octrooiraad in een door Onze Minister van Economische Zaken aangewezen volgorde.

      4 De Directeur is bevoegd een deel van zijn werkzaamheden onder zijn verantwoordelijkheid aan een ambtenaar bij het
      Bureau voor de industriële eigendom op te dragen.


      [ref1]: https://wetten.overheid.nl/BWBR0001908
    url: https://wetten.overheid.nl/BWBR0002737/1995-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001908
  - number: '3'
    text: >-
      1 De ambtenaren en het overige personeel bij het Bureau voor de industriële eigendom mogen buiten toestemming van
      Onze Minister van Economische Zaken geen ander bezoldigd ambt of bezoldigde betrekking bekleden. Zij mogen niet
      tevens zijn advocaat of octrooigemachtigde, noch middellijk of onmiddellijk betrokken zijn bij een onderneming
      tot het aanvragen van octrooien of tot het verrichten van depots van merken, van tekeningen of modellen of van
      topografieën van halfgeleiderprodukten of tot het verrichten van andere handelingen betreffende octrooien, merken,
      tekeningen of modellen of topografieën van halfgeleiderprodukten.


      2 Het is de ambtenaren en het overige personeel, bedoeld in het eerste lid, verboden octrooi aan te vragen.
    url: https://wetten.overheid.nl/BWBR0002737/1995-04-01#Artikel3
  - number: '4'
    text: >-
      Alvorens hun ambt of betrekking te aanvaarden leggen de ambtenaren en het overige personeel bij het Bureau voor de
      industriële eigendom, met uitzondering van de leden van de Octrooiraad, in handen van de Directeur de volgende eed
      of belofte af:


      "Ik zweer/beloof, dat ik ijverig, nauwgezet en onpartijdig de plichten zal vervullen, welke het ambt (de
      betrekking) van ...... medebrengt, en met name geheim zal houden hetgeen mij uit hoofde van mijn ambt bekend is van
      de aanhangige octrooiaanvragen, voor zover zij niet krachtens enig wettelijk voorschrift openbaar zijn, en stipt
      zal helpen uitvoeren de hierbij in aanmerking komende wetten en algemene maatregelen van bestuur, en dat ik om iets
      hoegenaamd in dit ambt te doen of te laten, van niemand middellijk of onmiddellijk enige belofte of enig geschenk
      zal aannemen.


      Zo waarlijk helpe mij God Almachtig!/Dat beloof ik.


      Ik verklaar, dat ik middellijk noch onmiddellijk, onder welke naam of voorwendsel dan ook, voor het verkrijgen van
      mijn aanstelling aan iemand, wie het ook zij, iets heb gegeven of beloofd.


      Dat verklaar ik".
    url: https://wetten.overheid.nl/BWBR0002737/1995-04-01#Artikel4
  - number: '5'
    text: >-
      1 Alle ambtenaren en al het overige personeel bij het Bureau voor de industriële eigendom zijn ondergeschikt aan de
      Directeur, die hun werkzaamheden regelt, daarop toezicht uitoefent en hun verlof tot afwezigheid geeft.


      2 Indien Onze Minister van Economische Zaken daartoe aanwijzing geeft, wordt door de Directeur een reglement voor
      de inrichting van de dienst en de werkzaamheden der ambtenaren en het overige personeel vastgesteld, dat alvorens
      van kracht te worden, de goedkeuring behoeft van Onze voornoemde Minister.
    url: https://wetten.overheid.nl/BWBR0002737/1995-04-01#Artikel5
  - number: '6'
    text: >-
      Opdrachten tot leveringen en werkzaamheden ten behoeve van het Bureau voor de industriële eigendom worden door of
      namens de Directeur verstrekt.
    url: https://wetten.overheid.nl/BWBR0002737/1995-04-01#Artikel6
  - number: '7'
    text: >-
      1 Het Bureau voor de industriële eigendom is, onverminderd het krachtens de eenvormige Beneluxwet op de warenmerken
      (*Trb.* 1962, 58) en de [eenvormige Beneluxwet inzake Tekeningen of Modellen](onbekend) (*Trb.* 1966, 292) ten
      aanzien van de openstelling van nationale diensten bepaalde, voor het publiek geopend op alle werkdagen, de
      zaterdag daaronder niet begrepen, tenminste van 10 tot 16 uur.


      2 De Directeur kan bepalen, dat het Bureau op een bepaalde werkdag voor het publiek gesloten zal zijn. Dit besluit
      behoeft de voorafgaande goedkeuring van Onze Minister van Economische Zaken; het wordt tijdig openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0002737/1995-04-01#Artikel7
  - number: '8'
    text: >-
      Jaarlijks, uiterlijk in de maand mei, wordt door de Directeur aan de Minister van Economische Zaken verslag
      uitgebracht van de werkzaamheden van het Bureau gedurende het laatst verlopen kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0002737/1995-04-01#Artikel8
  - number: '9'
    text: |-
      De Directeur, of de ambtenaar overeenkomstig [artikel 2, vierde lid][ref1], aangewezen, oefent alle bevoegdheden
      uit en vervult alle verplichtingen welke zijn overgelaten onderscheidenlijk opgedragen:

      a. aan de nationale dienst door of krachtens de eenvormige Beneluxwet op de warenmerken en de [eenvormige
      Beneluxwet inzake Tekeningen of Modellen](onbekend);

      b. aan het Bureau voor de industriële eigendom door de wet van 28 oktober 1987, houdende regelen
      inzake de bescherming van oorspronkelijke topografieën van halfgeleiderprodukten (*Stb.* 484), en de
      [Rijksoctrooiwet 1995][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002737#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007118
    url: https://wetten.overheid.nl/BWBR0002737/1995-04-01#Artikel9
