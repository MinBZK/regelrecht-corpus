---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_administratieve_verplichtingen_meststoffenwet
regulatory_layer: AMVB
publication_date: '2001-10-25'
valid_from: '2002-01-01'
bwb_id: BWBR0009000
url: https://wetten.overheid.nl/BWBR0009000/2002-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuurbeheer en Visserij van 8 juli 1997, nr. J. 977039,
    handelende in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Gelet op de artikelen 6 en 19 van de Meststoffenwet;

    De Raad van State gehoord (advies van 4 september 1997, no. W11.97.0420);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuurbeheer en Visserij van 29 oktober 1997, No.
    J. 9711401, uitgebracht in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en
    Milieubeheer;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel1
  - number: 1.a
    text: |-
      wet: [Meststoffenwet][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: 1.b
    text: |-
      producent van dierlijke meststoffen: persoon of rechtspersoon die, of samenwerkingsverband van personen of
      rechtspersonen dat dierlijke meststoffen produceert;
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel1
  - number: 1.c
    text: |-
      gebruiker van meststoffen: persoon of rechtspersoon of samenwerkingsverband van personen of rechtspersonen, niet
      zijnde producent van dierlijke meststoffen, op wiens of welks bedrijf meststoffen worden aangeleverd.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel1
  - number: 1.d
    text: |-
      afleveren: elk feitelijk overdragen van dierlijke meststoffen of overige organische meststoffen, dat erop is
      gericht de betreffende meststoffen buiten het bedrijf of de onderneming van de overdragende partij te brengen;
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel1
  - number: 1.e
    text: |-
      leverancier: persoon of rechtspersoon die, of samenwerkingsverband van personen of rechtspersonen dat dierlijke
      meststoffen of overige organische meststoffen aflevert;
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel1
  - number: 1.f
    text: |-
      afnemer: persoon of rechtspersoon die, of samenwerkingsverband van personen of rechtspersonen dat dierlijke
      meststoffen of overige organische meststoffen krijgt afgeleverd;
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel1
  - number: 1.g
    text: |-
      gewicht van de afgeleverde dierlijke meststoffen: geschat gewicht van de dierlijke meststoffen en, indien dit bij
      de aflevering bekend is, nettogewicht van de dierlijke meststoffen bepaald door weging, uitgedrukt in kilogrammen,
      bepaald overeenkomstig de krachtens [artikel 52 van de wet][ref1] gestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel52
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '52'
  - number: 1.h
    text: |-
      intermediaire onderneming: onderneming, niet zijnde een bedrijf, in het kader waarvan dierlijke meststoffen worden
      aangevoerd ten behoeve van handel, transport, opslag, be- of verwerking of anderszins;
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel1
  - number: 1.i
    text: |-
      afzet in het buitenland: aflevering buiten het Nederlandse grondgebied, anders dan ten behoeve van het gebruik op
      in grensgebieden gelegen landbouwgrond als bedoeld in de regels gesteld krachtens [artikel 53, onderdeel ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel53
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '53'
  - number: 1.j
    text: 'verdrag: Verdrag betreffende de overeenkomst tot internationaal vervoer van goederen over de weg (*Trb.* 1957, 84);'
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel1
  - number: 1.k
    text: |-
      CMR-vervoerdocument: vrachtbrief als bedoeld in [artikel 4][ref1] van het verdrag;


      [ref1]: https://wetten.overheid.nl/BWBR0009000#Artikel4
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009000
        artikel: '4'
        paragraaf: '2'
  - number: 1.l
    text: |-
      analyseren: bepalen van het gehalte fosfaat of stikstof in monsters van dierlijke meststoffen overeenkomstig de
      krachtens [artikel 52 van de wet][ref1]gestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel52
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '52'
  - number: 1.m
    text: 'laboratorium: laboratorium waar de dierlijke meststoffen of overige organische meststoffen worden geanalyseerd;'
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel1
  - number: 1.n
    text: |-
      gewicht van de afgeleverde overige organische meststoffen: geschat gewicht van de overige organische meststoffen
      en, indien dit bij de aflevering bekend is, nettogewicht van de overige organische meststoffen bepaald door
      weging, uitgedrukt in kilogrammen product en in kilogrammen droge stof, bepaald overeenkomstig de krachtens
      [artikel 52 van de wet][ref1] gestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel52
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '52'
  - number: 1.o
    text: |-
      hoeveelheid fosfaat en stikstof in de overige organische meststoffen: hoeveelheid
      fosfaat en stikstof in de overige organische meststoffen uitgedrukt in kilogrammen
      en vastgesteld overeenkomstig krachtens [artikel 52 van de wet][ref1] of
      [artikel 8 van het Besluit kwaliteit en gebruik overige organische meststoffen][ref2] gestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0009360#Artikel8
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '52'
      - id: ref2
        bwb_id: BWBR0009360
        artikel: '8'
  - number: '2.1'
    text: |-
      De producent van dierlijke meststoffen houdt een administratie bij met betrekking tot de door hem geproduceerde
      dierlijke meststoffen en de aantallen gehouden dieren van de onderscheiden diersoorten, onderverdeeld in
      categorieën per soort, die zijn opgenomen in [bijlage A bij de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: '2.2'
    text: |-
      De producent van dierlijke meststoffen en de gebruiker van meststoffen houden een administratie bij met betrekking
      tot de tot het bedrijf behorende oppervlakte landbouwgrond en natuurterrein en de aan hen afgeleverde andere
      meststoffen die fosfaat bevatten.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel2
  - number: '2.3'
    text: |-
      Indien de producent van dierlijke meststoffen of de gebruiker van meststoffen meer dan één bedrijf voert, wordt de
      administratie, bedoeld in het eerste of tweede lid, bijgehouden voor elk bedrijf afzonderlijk.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel2
  - number: '2.4'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de gegevens die de administratie bevat en de wijze waarop
      de administratie wordt opgemaakt.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel2
  - number: '2.5'
    text: |-
      De administratie heeft betrekking op een kalenderjaar en wordt afgesloten vóór de eerste februari volgend op het
      jaar waarop deze betrekking heeft, ook ingeval slechts in een gedeelte van het kalenderjaar dierlijke meststoffen
      worden geproduceerd of meststoffen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel2
  - number: '4.1'
    text: De administratie wordt tijdig, volledig en naar waarheid ingevuld en ondertekend.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel4
  - number: '4.2'
    text: |-
      De administratie en de daarop betrekking hebbende bewijsstukken worden gedurende vijf jaren na afloop van het
      kalenderjaar waarop deze betrekking hebben door de producent van dierlijke meststoffen en de gebruiker van
      meststoffen bewaard.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel4
  - number: '5.1'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de verstrekking aan een daartoe door Onze Minister
      aangewezen orgaan van:
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel5
  - number: 5.1.a
    text: gegevens uit de administratie;
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel5
  - number: 5.1.b
    text: |-
      gegevens betreffende de topografische ligging van de individuele percelen landbouwgrond en natuurterrein en
      de oppervlakte van de onderscheiden teelten op de percelen landbouwgrond, welke een wijziging betreffen van de
      gegevens die in het kader van [artikel 7a van de wet][ref1] zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel7a
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 7a
  - number: '5.2'
    text: Bij ministeriële regeling kunnen regels worden gesteld omtrent het verstrekken van nadere gegevens.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel5
  - number: 5a
    text: De gegevens, bedoeld in de artikelen 2 en 5, worden ten genoegen van Onze Minister gestaafd met bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel5a
  - number: '6.1'
    text: |-
      Personen of rechtspersonen, of samenwerkingsverbanden van personen of rechtspersonen die een intermediaire
      onderneming voeren kunnen in bij ministeriële regeling te bepalen gevallen worden verplicht tot het overleggen
      van bij die regeling bepaalde gegevens of tot het bijhouden van een administratie overeenkomstig bij die regeling
      gestelde regels.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel6
  - number: '6.2'
    text: |-
      [De artikelen 2, vierde en vijfde lid][ref1], [4][ref2],
      [5, eerste lid, aanhef en onderdeel a, en tweede lid][ref3], en [5a][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009000#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009000#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0009000#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0009000#Artikel5a
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009000
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009000
        artikel: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009000
        artikel: '5'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0009000
        artikel: 5a
        paragraaf: '2'
  - number: 6b
    text: |-
      [Artikel 2, eerste lid][ref1], is in een kalenderjaar niet van toepassing ten aanzien van een bedrijf dat op elk
      moment in het desbetreffende kalenderjaar voldoet aan elk van de volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0009000#Artikel2
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel6b
    references:
      - id: ref1
        bwb_id: BWBR0009000
        artikel: '2'
        paragraaf: '2'
  - number: 6b.a
    text: |-
      de veebezetting is niet groter dan twee grootvee-eenheden per hectare van de tot het bedrijf behorende oppervlakte
      landbouwgrond;
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel6b
  - number: 6b.b
    text: de veebezetting is niet groter dan drie grootvee-eenheden.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel6b
  - number: 6c.1
    text: |-
      [Artikel 2][ref1] is in een kalenderjaar niet van toepassing ten aanzien van een bedrijf dat op elk moment in het
      desbetreffende kalenderjaar voldoet aan elk van de volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0009000#Artikel2
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel6c
    references:
      - id: ref1
        bwb_id: BWBR0009000
        artikel: '2'
        paragraaf: '2'
  - number: 6c.1.a
    text: |-
      de veebezetting is niet groter dan twee grootvee-eenheden per hectare van de tot het bedrijf behorende oppervlakte
      landbouwgrond;
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel6c
  - number: 6c.1.b
    text: de veebezetting is niet groter dan drie grootvee-eenheden;
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel6c
  - number: 6c.1.c
    text: de tot het bedrijf behorende oppervlakte landbouwgrond is niet groter dan drie hectare;
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel6c
  - number: 6c.1.d
    text: |-
      de som van de tot dan toe in dat jaar aangevoerde dierlijke en overige organische meststoffen en de productie van
      meststoffen door de op dat moment gehouden dieren op jaarbasis, uitgedrukt in kilogrammen fosfaat, is per hectare
      van de op dat moment tot het bedrijf behorende oppervlakte landbouwgrond ten hoogste 85 kilogram fosfaat;
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel6c
  - number: 6c.1.e
    text: |-
      het bedrijf sluit geen mestafzetovereenkomst en is niet verplicht op grond van een mestafzetovereenkomst dierlijke
      meststoffen op het bedrijf aan te voeren.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel6c
  - number: 6c.2
    text: |-
      Op de vaststelling van de hoeveelheid aangevoerde dierlijke en overige organische meststoffen, bedoeld in het
      eerste lid, onderdeel d, is het bij en krachtens [artikel 17, tweede, derde en vierde lid, van de wet][ref1]
      bepaalde van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel17
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel6c
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '17'
  - number: 6c.3
    text: |-
      De productie van dierlijke meststoffen op jaarbasis, bedoeld in het eerste lid, onderdeel d, wordt vastgesteld op
      basis van het aantal op het desbetreffende moment gehouden dieren van de onderscheiden diercategorieën en op basis
      van de forfaitaire productienormen voor de onderscheiden diercategorieën, uitgedrukt in kilogrammen fosfaat per
      dier per jaar, opgenomen in [bijlage A bij de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel6c
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: 6d
    text: |-
      Voor de toepassing van [de artikelen 6b][ref1] en [6c, eerste lid, onderdelen a en b][ref2], geschiedt de
      omrekening van dieren van de onderscheiden diercategorieën naar grootvee-eenheden overeenkomstig de daarvoor in
      [bijlage A bij de wet][ref3] opgenomen normen.


      [ref1]: https://wetten.overheid.nl/BWBR0009000#Artikel6b
      [ref2]: https://wetten.overheid.nl/BWBR0009000#Artikel6c
      [ref3]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel6d
    references:
      - id: ref1
        bwb_id: BWBR0009000
        artikel: 6b
        paragraaf: 2a
      - id: ref2
        bwb_id: BWBR0009000
        artikel: 6c
        paragraaf: 2a
      - id: ref3
        bwb_id: BWBR0004054
  - number: '7.1'
    text: Bij aflevering van dierlijke meststoffen wordt door de leverancier en de afnemer een afleveringsbewijs opgemaakt.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel7
  - number: '7.2'
    text: 'Het afleveringsbewijs vermeldt onder meer:'
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel7
  - number: 7.2.a
    text: de in bijlage C bij de wet genoemde mestcode die op de afgeleverde dierlijke meststoffen van toepassing is;
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel7
  - number: 7.2.b
    text: het gewicht van de afgeleverde dierlijke meststoffen;
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel7
  - number: 7.2.c
    text: de mestnummers waaronder de leverancier en de afnemer bij het Bureau Heffingen zijn geregistreerd;
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel7
  - number: 7.2.d
    text: de naam en het adres van de leverancier en de afnemer.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel7
  - number: '7.3'
    text: |-
      Het afleveringsbewijs wordt overeenkomstig de daarbij aangegeven wijze, volledig en naar waarheid ingevuld en door
      de leverancier en de afnemer ondertekend.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel7
  - number: '7.4'
    text: |-
      De leverancier dient het origineel van het afleveringsbewijs binnen twee weken na de aflevering van de dierlijke
      meststoffen in bij het Bureau Heffingen.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel7
  - number: '7.5'
    text: Zowel de leverancier als de afnemer bewaart gedurende vijf jaren een afschrift van het afleveringsbewijs.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel7
  - number: '7.6'
    text: |-
      Indien het gewicht van de afgeleverde dierlijke meststoffen is bepaald door weging, wordt het bewijsstuk houdende
      het nettogewicht van de dierlijke meststoffen gedurende vijf jaren bewaard door de leverancier. Indien de dierlijke
      meststoffen, bedoeld in de vorige volzin, worden afgeleverd aan een afnemer, zijnde een intermediaire onderneming,
      wordt het in de vorige volzin bedoelde bewijsstuk gedurende vijf jaren bewaard door de afnemer.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel7
  - number: '8.1'
    text: Het afleveringsbewijs wordt vastgesteld bij ministeriële regeling en door het Bureau Heffingen verstrekt.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel8
  - number: '8.2'
    text: |-
      Ter zake van de ondertekening van het afleveringsbewijs kunnen de leverancier en de afnemer elkaar niet machtigen,
      behoudens in bij ministeriële regeling bepaalde gevallen en onder de daarbij aangegeven voorwaarden.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel8
  - number: '8.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het bewijsstuk houdende het
      nettogewicht van de dierlijke meststoffen, bedoeld in artikel 7, zesde lid.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel8
  - number: '9.1'
    text: |-
      Indien dierlijke meststoffen worden afgezet in het buitenland en sprake is van een vervoerovereenkomst als
      bedoeld in [artikel 1][ref1] van het verdrag, wordt in afwijking van [artikel 7, eerste en derde lid][ref2], het
      afleveringsbewijs opgemaakt en ondertekend door de leverancier. De leverancier vermeldt op het afleveringsbewijs
      tevens het nummer van het CMR-vervoerdocument dat betrekking heeft op de desbetreffende vracht dierlijke
      meststoffen en vermeldt op het CMR-vervoerdocument het nummer van het afleveringsbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0009000#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009000#Artikel7
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009000
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009000
        artikel: '7'
        paragraaf: '3'
  - number: '9.2'
    text: |-
      Indien een leverancier, zijnde een intermediaire onderneming, dierlijke meststoffen afzet in het buitenland middels
      een daartoe door hem gemachtigde vervoerder, wordt, in afwijking van [artikel 1, onderdeel ][ref1], de feitelijke
      overdracht van de meststoffen aan de vervoerder niet aangemerkt als aflevering en wordt die leverancier beschouwd
      als de leverancier van de dierlijke meststoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0009000#Artikel1
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009000
        artikel: '1'
        paragraaf: '1'
  - number: '9.3'
    text: De machtiging, bedoeld in het tweede lid, blijkt uit het CMR-vervoerdocument.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel9
  - number: '9.4'
    text: |-
      De leverancier, bedoeld in het eerste en tweede lid, bewaart zijn afschrift van het CMR-vervoerdocument gedurende
      vijf jaren.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel9
  - number: '10.1'
    text: |-
      Indien dierlijke meststoffen niet worden geanalyseerd wordt op het afleveringsbewijs tevens vermeld de
      hoeveelheid fosfaat en stikstof in de meststoffen, vastgesteld op grond van het geschat gewicht en de forfaitaire
      omrekennormen, genoemd in [bijlage C bij de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: '10.2'
    text: |-
      Indien dierlijke meststoffen niet worden geanalyseerd toont de leverancier de indiening van het afleveringsbewijs
      aan het Bureau Heffingen aan door middel van het door het Bureau Heffingen periodiek aan hem toegezonden overzicht
      van de van hem door het Bureau Heffingen ontvangen afleveringsbewijzen, dan wel op andere wijze.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel10
  - number: '11.1'
    text: |-
      Indien dierlijke meststoffen worden geanalyseerd zendt de leverancier, in afwijking van artikel 7, vierde lid, het
      afleveringsbewijs binnen twee weken na de aflevering van de dierlijke meststoffen aan het laboratorium.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel11
  - number: '11.2'
    text: |-
      Indien dierlijke meststoffen die worden geanalyseerd worden afgeleverd aan een afnemer, zijnde een intermediaire
      onderneming, rusten de verplichtingen, genoemd in het eerste lid, op de afnemer.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel11
  - number: '12.1'
    text: |-
      De leverancier en de afnemer houden ieder afzonderlijk een kwartaaloverzicht bij van de in dat kwartaal
      door of aan hen afgeleverde geanalyseerde hoeveelheden dierlijke meststoffen, de daarop betrekking hebbende
      analyseresultaten en het nettogewicht van de dierlijke meststoffen onder vermelding van de nummers van de betrokken
      afleveringsbewijzen.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel12
  - number: '12.2'
    text: |-
      Het kwartaaloverzicht wordt overeenkomstig de daarbij aangegeven wijze volledig en naar waarheid ingevuld en door
      de leverancier, onderscheidenlijk de afnemer ondertekend.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel12
  - number: '12.3'
    text: |-
      De leverancier en de afnemer dienen het kwartaaloverzicht uiterlijk binnen tien weken na afloop van ieder kwartaal
      in bij het bureau.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel12
  - number: '12.4'
    text: |-
      De leverancier, onderscheidenlijk afnemer, toont de indiening van het kwartaaloverzicht aan door middel van de door
      het bureau aan hem toegezonden bevestiging van ontvangst.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel12
  - number: '12.5'
    text: |-
      De door het laboratorium verstrekte analyseresultaten en een afschrift van het kwartaaloverzicht worden door de
      leverancier en de afnemer gedurende vijf jaren bewaard.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel12
  - number: '12.6'
    text: Het kwartaaloverzicht wordt opgesteld in de door Onze Minister voorgeschreven vorm.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel12
  - number: '12.7'
    text: Ten aanzien van de ondertekening van de kwartaaloverzichten kan geen machtiging plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel12
  - number: '13.1'
    text: |-
      Bij aflevering van overige organische meststoffen wordt door de leverancier en de afnemer een afleveringsbewijs
      opgemaakt.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel13
  - number: '13.2'
    text: 'Het afleveringsbewijs vermeldt onder meer:'
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel13
  - number: 13.2.a
    text: de soort en de vorm van de afgeleverde overige organische meststoffen;
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel13
  - number: 13.2.b
    text: het gewicht van de afgeleverde overige organische meststoffen;
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel13
  - number: 13.2.c
    text: de hoeveelheid fosfaat en stikstof in de afgeleverde overige organische meststoffen;
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel13
  - number: 13.2.d
    text: het mestnummer van de leverancier en de afnemer;
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel13
  - number: 13.2.e
    text: de naam en het adres van de leverancier en de afnemer.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel13
  - number: '13.3'
    text: Artikel 7, derde tot en met zesde lid, en artikel 8 zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel13
  - number: '14.1'
    text: |-
      Het is verboden afgeleverde dierlijke of overige organische meststoffen te vervoeren, tenzij desgevraagd het op de
      vracht betrekking hebbende en voor de afnemer bestemde afschrift van het afleveringsbewijs wordt overgelegd.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel14
  - number: '14.2'
    text: |-
      Het is verboden dierlijke meststoffen of overige organische meststoffen te vervoeren indien aflevering nog niet
      heeft plaatsgevonden, tenzij desgevraagd het op de vracht betrekking hebbende en door de vervoerder, als ware hij
      reeds leverancier, opgemaakte en ondertekende afleveringsbewijs wordt overgelegd.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel14
  - number: 14a
    text: |-
      Ingeval de mestafzetovereenkomst is gesteld op een door Onze Minister vastgesteld formulier alsmede op andere
      stukken, wordt, in zoverre in afwijking van artikel [58an, eerste lid, onderdeel b, van de wet][ref1], enkel het
      desbetreffende formulier verzonden aan het Bureau Heffingen en worden de andere stukken gedurende vijf jaren na
      afloop van het kalenderjaar waarop deze betrekking hebben door ieder van de bij de overeenkomst betrokken partijen
      bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58an
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58an
  - number: '15.1'
    text: |-
      Op verzoek van de producent van dierlijke meststoffen worden de voor zijn bedrijf geregistreerde gegevens
      betreffende de mestproductie geheel of gedeeltelijk doorgehaald.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel15
  - number: '15.2'
    text: Na gehele doorhaling is het niet-gebonden mestproductierecht van het bedrijf nihil.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel15
  - number: '15.3'
    text: |-
      Bij gedeeltelijke doorhaling neemt het niet-gebonden mestproductierecht van het bedrijf af met de door de producent
      aangegeven hoeveelheid.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel15
  - number: '15.4'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de gehele of gedeeltelijke doorhaling en het
      verzoek, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel15
  - number: '16'
    text: |-
      Het Uitvoeringsbesluit 30%-korting mestproductierechten voor varkens en kippen, het Besluit voorwaarden
      afzetovereenkomsten en het Besluit mestbank en mestboekhouding ([Meststoffenwet][ref1]) worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: '17'
    text: 'Dit besluit wordt aangehaald als: Besluit administratieve verplichtingen Meststoffenwet.'
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel17
  - number: '18'
    text: Dit besluit treedt in werking met ingang van 1 januari 1998.
    url: https://wetten.overheid.nl/BWBR0009000/2002-01-01#Artikel18
