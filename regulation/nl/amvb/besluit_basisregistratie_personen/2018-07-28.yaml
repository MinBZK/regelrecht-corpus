  - number: '45'
    text: |-
      1 Een overheidsorgaan of een derde die Onze Minister een verzoek doet om informatie ter beschikking te stellen die
      is verkregen door bewerking van gegevens uit de basisregistratie, verschaft bij dat verzoek:

      a. inlichtingen over het doel waarvoor de informatie wordt gevraagd;

      b. een precieze beschrijving van de informatie die wordt gevraagd;

      c. een aanduiding van het tijdstip waarop de informatie nodig is en de reden waarom de informatie op dat tijdstip
      nodig is.

      2 Het overheidsorgaan of de derde geeft aan waarom de informatie niet of niet tijdig op een andere manier kan
      worden verkregen.

      3 Onze Minister kan een verzoek in ieder geval weigeren voor zover:

      a. de verstrekking overwegend commercieel gebruik tot doel heeft;

      b. de behandeling van het verzoek of de verstrekking zodanig is dat het regulier beheer in de knel komt;

      c. de informatie niet tijdig ter beschikking kan worden gesteld, of

      d. de informatie tijdig op een andere manier kan worden verkregen.
    url: https://wetten.overheid.nl/BWBR0034306/2018-07-28#Artikel45
  - number: '46'
    text: |-
      Het college van burgemeester en wethouders of Onze Minister voldoet in ieder geval niet aan een verzoek van een
      betrokkene als bedoeld in [artikel 3.22, eerste en tweede lid][ref1], en [3.23, eerste lid, van de wet][ref2], voor
      zover de verstrekking van gegevens uit de basisregistratie heeft plaatsgevonden voor de uitvoering van de hieronder
      bedoelde taken en voor zover het overheidsorgaan waaraan of de derde aan wie de gegevens ter uitvoering van die
      taken zijn verstrekt, heeft aangegeven dat aan het verzoek van de betrokkene niet kan worden voldaan:

      a. taken op grond van de [artikelen 3][ref3], [4][ref4] en [49 van de Politiewet 2012][ref5] die worden uitgevoerd
      in het belang van de veiligheid van de staat of de voorkoming, opsporing en vervolging van strafbare feiten;

      b. taken op grond van [artikel 3 van de Wet op de bijzondere opsporingsdiensten][ref6];

      c. taken op grond van [artikel 36, eerste lid, onderdeel b, van de Gezondheidswet][ref7];

      d. taken op grond van
      [artikel 13, aanhef en onderdeel a, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref8];

      e. taken op grond van [artikel 110, eerste lid, van de Wet op het notarisambt][ref9],
      [artikel 30 van de Gerechtsdeurwaarderswet][ref10] of
      [artikel 1d, eerste lid, onderdeel c, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref11]
      ;

      f. de taken, bedoeld in [artikel 4.1.1, tweede lid, van de Wet maatschappelijke ondersteuning 2015][ref12].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3.22
