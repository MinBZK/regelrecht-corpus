articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *een autorisatiebesluit:* een besluit als bedoeld in [artikel 3.2][ref1] of [artikel 3.3 van de wet][ref2];
        - *de systeembeschrijving:* de beschrijving, bedoeld in [artikel 4][ref3];
        - *de wet:* de [Wet basisregistratie personen][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3.2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel3.3
