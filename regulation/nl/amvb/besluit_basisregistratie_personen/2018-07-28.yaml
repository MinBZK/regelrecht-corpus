    text: |-
      1 Niet verplicht tot het doen van aangifte van vertrek is de ingezetene die vanaf het tijdstip van het vertrek uit
      Nederland naar redelijke verwachting niet langer dan twee jaar buiten Nederland verblijft en die gedurende zijn
      verblijf buiten Nederland beroepshalve vaart aan boord van een schip dat in Nederland de thuishaven heeft.

      2 Het eerste lid is alleen van toepassing indien de betrokkene gedurende zijn verblijf buiten Nederland beschikt
      over een adres in Nederland.
    url: https://wetten.overheid.nl/BWBR0034306/2018-07-28#Artikel29
  - number: '30'
    text: |-
      1 De gevallen waarin de verplichtingen, vermeld in [artikel 2.38 van de wet][ref1], kunnen worden vervuld door de
      in [artikel 2.49, eerste lid, van de wet][ref2] bedoelde personen zijn de gevallen waarin de betrokkene zelf niet
      in staat is om in persoon te verschijnen vanwege:

      a. de toestand van zijn gezondheid, zo nodig onder overlegging van een schriftelijke verklaring ter zake van een
      behandelend arts, of

      b. verblijf in een penitentiaire instelling.

      2 In de gevallen, bedoeld in het eerste lid, is de betrokkene, in afwijking van
      [artikel 2.38, eerste lid, van de wet][ref3], niet verplicht zich in persoon te melden bij het college van
      burgemeester en wethouders.

      3 [Artikel 2.49, tweede lid, van de wet][ref4], is niet van toepassing op de in het eerste lid bedoelde gevallen.

      4 De gevallen, bedoeld in het eerste lid, aanhef en onderdeel a, zijn tevens de in
      [artikel 2.49, vierde lid, van de wet][ref5] bedoelde gevallen. Het tweede en derde lid zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2.38
