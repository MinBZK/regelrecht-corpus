  - number: '15'
    text: |-
      1 Categorieën van kosten, als bedoeld in [artikel 1.14, tweede lid, van de wet][ref1], zijn tevens de kosten in
      verband met de afstemming van gegevens van een betrokkene op de gegevens in de basisregistratie.

      2 Bij regeling van Onze Minister wordt bepaald welke berichten voor de toepassing van dit artikel worden aangemerkt
      als afstemmingsberichten.

      3 Als afstemmingsbericht wordt slechts aangemerkt een bericht:

      a. dat nodig is voor de systematische verstrekking van gegevens ter afstemming van de gegevens van een
      overheidsorgaan of derde op de gegevens in de basisregistratie;

      b. waarvan de verzending en ontvangst geschiedt op een wijze die op grond van [artikel 4][ref2] is beschreven in de
      systeembeschrijving, en

      c. dat als doel heeft de in het vijfde lid bedoelde verstrekking van gegevens mogelijk te maken.

      4 Voor afstemmingsberichten brengt Onze Minister, in afwijking van de [artikelen 12, tweede lid][ref3], [13][ref4]
      en [14][ref5], bij de overheidsorganen en derden een tarief per geregistreerde persoon in rekening.

      5 Onder geregistreerde persoon als bedoeld in het vierde lid wordt verstaan de persoon over wie het
      overheidsorgaan of de derde verzoekt gegevens verstrekt te krijgen op de wijze die is beschreven in
      [artikel 37, eerste lid, onderdeel a][ref6].

      6 De kosten in verband met de afstemming bestaan uit de kosten die naar verwachting zijn verbonden aan de
      verzending en ontvangst van afstemmingsberichten over het stelsel van berichtuitwisseling of met behulp van
      alternatieve media.

      7 Het tarief wordt vastgesteld bij regeling van Onze Minister. Het tarief wordt op een zodanige wijze vastgesteld
      dat door het totaal van de in rekening te brengen tarieven de kosten, bedoeld in het zesde lid, worden gedekt.

      8 Het autorisatiebesluit bepaalt met betrekking tot het overheidsorgaan of de derde het aantal geregistreerde
      personen als bedoeld in het vijfde lid en het aantal afstemmingsberichten dat door het overheidsorgaan of de derde
      over het stelstel van berichtuitwisseling wordt verzonden en ontvangen.

      9 Onze Minister stelt een raming vast van de verwachte kosten, alsmede van het verwachte aantal
      afstemmingsberichten.


