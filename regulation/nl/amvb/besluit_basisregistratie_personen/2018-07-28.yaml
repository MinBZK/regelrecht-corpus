  - number: '17'
    text: |-
      1 Categorieën van kosten, als bedoeld in [artikel 1.14, tweede lid, van de wet][ref1], zijn tevens de kosten in
      verband met de schriftelijke verstrekking van gegevens.

      2 Een college van burgemeester en wethouders dat schriftelijk gegevens verstrekt, kan bij de betrokkene aan wie de
      gegevens worden verstrekt in verband met de kosten, bedoeld in het eerste lid, een bijdrage in rekening brengen.
      Voor zover de verstrekking geschiedt door Onze Minister, kan deze bijdrage in rekening worden gebracht naast de
      bijdrage die op grond van de [artikelen 12, tweede lid][ref2], [13][ref3] en [14][ref4] voor de betrokkene wordt
      vastgesteld.

      3 Bij regeling van Onze Minister wordt vastgesteld welke bijdragen ten hoogste in rekening kunnen worden gebracht.


