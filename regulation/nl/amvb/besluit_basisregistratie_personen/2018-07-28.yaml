      - id: ref1
        bwb_id: BWBR0033715
        paragraaf: '4'
  - number: '27'
    text: |-
      1 Een bestuursorgaan als bedoeld in [artikel 2.34, eerste lid, van de wet][ref1], alsmede een bestuursorgaan dat
      op grond van artikel 2.34, tweede of vierde lid, van de wet is aangewezen, doet mededeling aan het college van
      burgemeester en wethouders van door hem geconstateerde afwijkingen tussen enerzijds gegevens die hij verstrekt
      heeft gekregen uit de basisregistratie of waarvan de verstrekking achterwege is gebleven en anderzijds gegevens
      waarvan hij op andere wijze kennis heeft gekregen, alsmede van de grond van zijn gerede twijfel als bedoeld in
      artikel 2.34, eerste lid, van de wet.

      2 Onze Minister kan nadere regels stellen omtrent de gevallen waarin en regels over de wijze waarop de mededeling
      wordt gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2.34
    url: https://wetten.overheid.nl/BWBR0034306/2018-07-28#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2.34'
  - number: '28'
    text: |-
      1 Het college van burgemeester en wethouders stelt het bestuursorgaan dat een mededeling als bedoeld in
      [artikel 2.34 van de wet][ref1] heeft gedaan, zo spoedig mogelijk doch uiterlijk binnen vijf werkdagen na de
      ontvangst van de mededeling ervan in kennis of deze mededeling aanleiding is geweest voor verbetering, aanvulling
      of verwijdering van gegevens in de basisregistratie, dan wel dat bij het gegeven een aantekening als bedoeld in
      [artikel 2.26 van de wet][ref2] is geplaatst in verband met het doen van een onderzoek naar de onjuistheid van
      het gegeven.

      2 Indien het college van burgemeester en wethouders besluit een aantekening als bedoeld in
      [artikel 2.26 van de wet][ref3] te plaatsen, stelt het college het bestuursorgaan dat de mededeling heeft gedaan na
      afloop van het onderzoek ervan in kennis of naar aanleiding van de mededeling gegevens in de basisregistratie zijn
      verbeterd, aangevuld of verwijderd.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2.34
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2.26
