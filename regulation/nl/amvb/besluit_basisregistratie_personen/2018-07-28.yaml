  - number: '52'
    text: |-
      1 Bij regeling van Onze Minister kan worden bepaald in welke gevallen [artikel 26][ref1] niet van toepassing is
      in verband met de overgang van de oude naar de nieuwe voorzieningen of de overgang van de oude naar de nieuwe
      berichtuitwisseling.

      2 Bij regeling van Onze Minister kunnen nadere regels worden gesteld in verband met de overgang, waarbij kan worden
      afgeweken van de [hoofdstukken 2][ref2] en [3][ref3] van dit besluit, voor zover de afwijking noodzakelijk is in
      verband met een goede bijhouding en verstrekking van gegevens in de basisregistratie gedurende de overgang van de
      oude naar de nieuwe voorzieningen of de overgang van de oude naar de nieuwe berichtuitwisseling.


