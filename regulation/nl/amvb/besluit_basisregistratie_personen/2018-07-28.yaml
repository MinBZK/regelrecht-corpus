  - number: '26'
    text: |-
      Bij het voldoen aan de verplichtingen, bedoeld in [hoofdstuk 2, afdeling 1, paragraaf 4, van de wet][ref1], wordt
      door een overheidsorgaan, indien bekend, het burgerservicenummer vermeld van de persoon of personen ten aanzien van
      wie gegevens, bescheiden of inlichtingen worden verstrekt of met betrekking tot wie mededelingen worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Paragraaf4
    url: https://wetten.overheid.nl/BWBR0034306/2018-07-28#Artikel26
