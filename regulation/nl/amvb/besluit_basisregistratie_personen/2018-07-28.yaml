  - number: '47'
    text: |-
      1 De onderzoeken, bedoeld in [artikel 4.3 van de wet][ref1], geschieden jaarlijks, uiterlijk op 31 december.

      2 De uitvoering van deze onderzoeken geschiedt met behulp van een door Onze Minister beschikbaar gesteld evaluatie-
      instrument.

      3 Onze Minister verstrekt ten behoeve van het onderzoek door een college van burgemeester en wethouders aan het
      college een op de ingezetenen van de gemeente betrekking hebbend overzicht van aandachtspunten.

      4 De uittreksels, bedoeld in [artikel 4.3 van de wet][ref2], bevatten de geaggregeerde resultaten van het
      onderzoek. Bij regeling van Onze Minister wordt voor de verschillende typen uittreksels het aggregatieniveau
      bepaald.

      5 De uittreksels worden jaarlijks, uiterlijk op 14 februari volgend op de uiterste datum dat het onderzoek, bedoeld
      in het eerste lid, dient plaats te vinden, verzonden.

      6 Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten aanzien van de uitvoering van de
      onderzoeken en de inhoud van de uittreksels.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel4.3
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel4.3
