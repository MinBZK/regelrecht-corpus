  - number: '12'
    text: |-
      1 Categorieën van kosten, als bedoeld in [artikel 1.14, tweede lid, van de wet][ref1] zijn de kosten in verband
      met:

      a. het beheer en het gebruik van de centrale voorzieningen;

      b. de verzending en ontvangst van berichten, waaronder begrepen de kosten in verband met het stelsel van
      berichtuitwisseling.

      2 De bijdrage van een betrokkene in de in het eerste lid bedoelde kosten wordt vastgesteld op basis van het aantal
      berichten dat ten laste van de betrokkene komt.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel1.14
    url: https://wetten.overheid.nl/BWBR0034306/2018-07-28#Artikel12
