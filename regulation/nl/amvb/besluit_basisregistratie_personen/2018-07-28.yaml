      1 De in [artikel 3.1, tweede lid, van de wet][ref1] bedoelde systematische verstrekking van gegevens aan
      overheidsorganen betreft de volgende wijzen van verstrekking overeenkomstig de systeembeschrijving:

      a. spontane verstrekking, zijnde de eenmalige verstrekking van de in een autorisatiebesluit vermelde gegevens
      over de door het overheidsorgaan aangegeven personen die deel uitmaken van de in het autorisatiebesluit aangegeven
      categorie van personen, of over personen over wie de in de basisregistratie opgenomen gegevens voldoen aan de in
      het autorisatiebesluit genoemde voorwaarden, gevolgd door de verstrekking van de wijzigingen die zich voordoen in
      deze gegevens;

      b. selectie- en conditionele verstrekking, zijnde de eenmalige of periodieke verstrekking van de in een
      autorisatiebesluit opgenomen gegevens over personen over wie de in de basisregistratie vermelde gegevens voldoen
      aan de in het autorisatiebesluit genoemde voorwaarden;

      c. verstrekking op basis van een zoekvraag, zijnde een verstrekking op verzoek van het overheidsorgaan, van
      gegevens die deel uitmaken van de in een autorisatiebesluit vermelde gegevens over, per verzoek, een in het
      autorisatiebesluit gemaximeerd aantal personen die deel uitmaken van de in het autorisatiebesluit bepaalde
      categorie van personen en over wie de gegevens voldoen aan de gegevens die in het verzoek van het overheidsorgaan
      zijn vermeld.

      2 Het eerste lid is van overeenkomstige toepassing op de systematische verstrekking van gegevens aan derden als
      bedoeld in [artikel 3.3 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3.1
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel3.3
    url: https://wetten.overheid.nl/BWBR0034306/2018-07-28#Artikel37
