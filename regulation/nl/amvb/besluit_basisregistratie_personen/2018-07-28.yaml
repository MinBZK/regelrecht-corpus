        bwb_id: BWBR0033715
        artikel: '4.6'
  - number: '49'
    text: |-
      Onze Minister stelt regels omtrent heffingen in verband met de verstrekking van gegevens uit:

      a. het persoonskaartenarchief, bedoeld in het Besluit bevolkingsboekhouding;

      b. het schakelregister, bedoeld in het Besluit bevolkingsboekhouding;

      c. het centraal archief van overledenen, bestaande uit de persoonskaarten, bedoeld in artikel 69, tweede lid, van
      het Besluit bevolkingsboekhouding.
    url: https://wetten.overheid.nl/BWBR0034306/2018-07-28#Artikel49
  - number: '50'
    text: |-
      1 Onze Minister raadpleegt de desbetreffende gemeenten, overheidsorganen waaraan en derden aan wie systematisch
      gegevens worden verstrekt, inzake de overgang, bedoeld in de [artikelen 4.15][ref1] en [4.16 van de wet][ref2].

      2 Onze Minister stelt een schema vast waarin voor een betrokkene of groep van betrokkenen een tijdstip wordt
      vastgesteld voor de overgang van de oude naar de nieuwe voorzieningen of berichtuitwisseling.

      3 Onze Minister kan verschillende tijdstippen vaststellen voor verschillende delen van de organisatie van de
      gemeente, het overheidsorgaan of de derde, of voor verschillende wijzen van verstrekking van gegevens.

      4 De betrokkenen dragen er zorg voor dat zij op het desbetreffende tijdstip gereed zijn om uitvoering te geven aan
      de [wet][ref3] met behulp van de nieuwe voorzieningen of de nieuwe berichtuitwisseling.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel4.15
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel4.16
      [ref3]: https://wetten.overheid.nl/BWBR0033715
