  - number: '11'
    text: |-
      1 Berichten tussen een gemeente en de centrale voorziening komen ten laste van de gemeente, waarbij een bericht
      dat door een gemeente via de centrale voorziening wordt verzonden aan een andere gemeente, ten laste komt van de
      gemeente die het bericht verzendt.

      2 Berichten aan of van een overheidsorgaan, anders dan organen van een gemeente, waaraan of een derde aan
      wie op grond van [artikel 3.2][ref1], [3.3][ref2] of [3.13 van de wet][ref3] gegevens worden verstrekt,
      komen ten laste van dat overheidsorgaan of die derde, met uitzondering van berichten in verband met
      [hoofdstuk 2, afdeling 1, paragraaf 4, van de wet][ref4].

      3 Het eerste lid is niet van toepassing op:

      a. berichten aan of van de centrale voorziening in verband met de bijhouding van gegevens;

      b. berichten in verband met de verstrekking van gegevens door een college van burgemeester en wethouders;

      c. synchronisatieberichten;

      d. berichten in verband met [artikel 2.34 van de wet][ref5].


