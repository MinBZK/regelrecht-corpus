        artikel: '2.67'
  - number: '34'
    text: |-
      1 Een aangewezen bestuursorgaan legt bij een verzoek om inschrijving als bedoeld in [artikel 2.68 van de wet][ref1]
      ten minste een opgave over van de volgende gegevens over de burgerlijke staat van de betrokkene: de geslachtsnaam,
      de voornamen, de geboortedatum en het geslacht.

      2 Het aangewezen bestuursorgaan legt daarnaast een opgave over van de data ingang en beëindiging rechtsgeldigheid
      van de in het eerste lid bedoelde gegevens voor zover deze bij het verzoek om inschrijving kunnen worden
      vastgesteld.

      3 Het aangewezen bestuursorgaan kan daarnaast een opgave overleggen van andere algemene gegevens voor zover de
      gegevens bij het verzoek om inschrijving kunnen worden vastgesteld.

      4 Een aangewezen bestuursorgaan legt bij een opgave als bedoeld in [artikel 2.70, derde lid, van de wet][ref2],
      in andere gevallen dan bedoeld in het eerste lid, ten minste de volgende gegevens over de betrokkene over: het
      burgerservicenummer en de gegevens die voor bijhouding in aanmerking komen.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2.68
