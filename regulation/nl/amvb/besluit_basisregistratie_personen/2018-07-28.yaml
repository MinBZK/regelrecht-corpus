      1 Indien door een ingezetene aangifte is gedaan van vertrek naar Aruba, Curaçao, Sint Maarten of een van de
      openbare lichamen, verstrekt Onze Minister de gegevens over de betrokkene die daartoe zijn aangewezen in de tabel
      die als [bijlage 6][ref1] bij dit besluit is gevoegd aan de desbetreffende verantwoordelijke voor de verwerking van
      gegevens in de basisadministratie van Aruba, Curaçao, Sint Maarten of het desbetreffende openbaar lichaam.

      2 Onze Minister verstrekt op verzoek van een verantwoordelijke voor de verwerking van gegevens in de
      basisadministratie van Aruba, Curaçao, Sint Maarten of een openbaar lichaam aan deze gegevens, voor zover deze
      gegevens noodzakelijk zijn in verband met de bijhouding van de basisadministratie van de verantwoordelijke. De
      verstrekking kan uitsluitend betrekking hebben op de gegevens over de betrokkene die daartoe zijn aangewezen in de
      tabel die als [bijlage 6][ref2] bij dit besluit is gevoegd.

      3 Onze Minister kan op verzoek van een verantwoordelijke voor de verwerking van gegevens in de basisadministratie
      van Aruba, Curaçao, Sint Maarten of een van de openbare lichamen aan hem gegevens verstrekken, ter bevordering
      van de afstemming van de basisadministratie van de verantwoordelijke op de basisregistratie. De verstrekking kan
      uitsluitend betrekking hebben op de gegevens over de betrokkene die daartoe zijn aangewezen in de tabel die als
      [bijlage 6][ref3] bij dit besluit is gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0034306
      [ref2]: https://wetten.overheid.nl/BWBR0034306
      [ref3]: https://wetten.overheid.nl/BWBR0034306
