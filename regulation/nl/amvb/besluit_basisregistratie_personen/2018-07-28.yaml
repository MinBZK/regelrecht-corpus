  - number: '4'
    text: |-
      De systeembeschrijving geeft een beschrijving van de aspecten die zijn aangeduid in de tabel die als
      [bijlage 2][ref1] bij dit besluit is gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0034306
    url: https://wetten.overheid.nl/BWBR0034306/2018-07-28#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0034306
  - number: '5'
    text: |-
      Een college van burgemeester en wethouders, Onze Minister, een aangewezen bestuursorgaan, een overheidsorgaan
      en een derde dragen er zorg voor dat zij uitvoering geven aan de [wet][ref1] op een wijze die overeenstemt met
      de systeembeschrijving. De uitvoering voor zover die op hen betrekking heeft, is aangeduid in de tabel die als
      [bijlage 3][ref2] bij dit besluit is gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0033715
      [ref2]: https://wetten.overheid.nl/BWBR0034306
    url: https://wetten.overheid.nl/BWBR0034306/2018-07-28#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0033715
      - id: ref2
        bwb_id: BWBR0034306
  - number: '6'
    text: |-
      1 Het college van burgemeester en wethouders treft ten aanzien van de gemeentelijke voorziening passende technische
      en organisatorische maatregelen ter beveiliging van de in de basisregistratie opgenomen gegevens tegen verlies of
      aantasting van deze gegevens en tegen onbevoegde kennisneming, wijziging of verstrekking van deze gegevens.

      2 Onze Minister treft ten aanzien van de centrale voorzieningen passende technische en organisatorische maatregelen
      ter beveiliging van de in de basisregistratie opgenomen gegevens tegen verlies of aantasting van deze gegevens en
      tegen onbevoegde kennisneming, wijziging of verstrekking van deze gegevens.

      3 De in het eerste en tweede lid bedoelde maatregelen omvatten ten minste:

      a. maatregelen gericht op personen die werkzaam zijn voor de verantwoordelijke voor de verwerking van gegevens in
      de basisregistratie;

      b. maatregelen gericht op de toegang tot gebouwen en ruimten waar in de basisregistratie opgenomen gegevens
      aanwezig zijn;

      c. maatregelen gericht op een deugdelijke werking en beveiliging van de apparatuur en programmatuur;

      d. maatregelen voor het geval de geheimhouding of integriteit van in de basisregistratie opgenomen gegevens is
      geschaad;

      e. maatregelen bij calamiteiten.

      4 Onze Minister kan regels stellen omtrent de bewaring van geschriften en andere bescheiden, ongeacht hun vorm, die
      de verantwoordelijke voor de verwerking van gegevens in de basisregistratie gebruikt of heeft gebruikt in verband
      met de verwerking van gegevens in de basisregistratie.
    url: https://wetten.overheid.nl/BWBR0034306/2018-07-28#Artikel6
  - number: '10'
    text: |-
      In deze paragraaf, [artikel 51][ref1] en de daarop berustende bepalingen wordt verstaan onder:

      a. *de betrokkene:* de betrokkene, bedoeld in [artikel 1.14, eerste lid, van de wet][ref2];

      b. *de bijdrage:* de bijdrage van de betrokkene in de kosten in verband met de uitvoering van de wet, bedoeld in
      [artikel 1.14, eerste lid, van de wet][ref3];

      c. *een bericht:* een logische eenheid van gegevens die wordt verzonden of verstrekt:

      1° via het stelsel van berichtuitwisseling, bedoeld in [artikel 1.9, vierde lid, van de wet][ref4];

      2° met behulp van alternatieve media, of

      3° op schriftelijke wijze;

      d. *een jaar:* een kalenderjaar.


