  - number: '48'
    text: |-
      1 De op grond van [artikel 4.6 van de wet][ref1] aan het college van burgemeester en wethouders verstrekte gegevens
      worden toegevoegd aan het persoonsregister.

      2 Onze Minister kan regels stellen omtrent de zorg voor het persoonsregister, het persoonskaartenarchief en
      het schakelregister. Daarbij kan worden bepaald dat het persoonsregister op een andere wijze dan in de vorm van
      persoonskaarten, bedoeld in het Besluit bevolkingsboekhouding, kan worden aangehouden en kan de vernietiging van
      persoonskaarten worden geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel4.6
    url: https://wetten.overheid.nl/BWBR0034306/2018-07-28#Artikel48
    references:
