  - number: '2'
    text: |-
      Authentieke gegevens als bedoeld in [artikel 1.6 van de wet][ref1] zijn de gegevens over ingezetenen die als
      zodanig zijn aangeduid in de tabel die als [bijlage 1][ref2] bij dit besluit is gevoegd en, met uitzondering van de
      gegevens over de burgerlijke staat van ingezetenen, als actuele gegevens zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel1.6
      [ref2]: https://wetten.overheid.nl/BWBR0034306
    url: https://wetten.overheid.nl/BWBR0034306/2018-07-28#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '1.6'
      - id: ref2
        bwb_id: BWBR0034306
  - number: '3'
    text: |-
      1 Onze Minister stelt een systeembeschrijving vast.

      2 De systeembeschrijving kan een onderdeel bevatten dat is toegesneden op gemeenten die gebruikmaken van een oude
      gemeentelijke voorziening als bedoeld in [artikel 4.15, eerste lid, van de wet][ref1], en een onderdeel dat is
      toegesneden op gemeenten die gebruik maken van een nieuwe gemeentelijke voorziening als bedoeld in dat lid.

      3 Voor het onderdeel dat is toegesneden op gemeenten die gebruikmaken van een oude voorziening
      kan verwezen worden naar de systeembeschrijving zoals deze laatstelijk werd gehanteerd onder de
      [Wet gemeentelijke basisadministratie persoonsgegevens][ref2].

      4 Het tweede en derde lid zijn van overeenkomstige toepassing ten aanzien van de uitwisseling van berichten met
      een overheidsorgaan waaraan of een derde aan wie systematisch gegevens worden verstrekt, met dien verstande dat het
      betreft de in [artikel 4.16 van de wet][ref3] bedoelde oude en nieuwe berichtuitwisseling.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel4.15
      [ref2]: https://wetten.overheid.nl/BWBR0006723
      [ref3]: https://wetten.overheid.nl/BWBR0033715#Artikel4.16
    url: https://wetten.overheid.nl/BWBR0034306/2018-07-28#Artikel3
