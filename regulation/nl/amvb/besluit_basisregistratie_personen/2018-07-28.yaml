      1 Onze Minister van Veiligheid en Justitie doet een mededeling aan het college van burgemeester en wethouders van
      de betrokken gemeente inzake het niet van toepassing zijn van [artikel 2.6 van de wet][ref1], als hij de identiteit
      van een vreemdeling als bedoeld in [artikel 21, eerste lid, onder f][ref2], deugdelijk heeft vastgesteld, de
      vreemdeling rechtmatig in Nederland verblijft en naar redelijke verwachting gedurende een half jaar ten minste twee
      derde van de tijd in Nederland verblijf zal houden.

      2 In afwijking van het eerste lid doet Onze Minister van Veiligheid en Justitie geen mededeling als bedoeld in
      het vorige lid omtrent de vreemdelingen, bedoeld in de [artikelen 30][ref3], [30a, eerste lid, onder a][ref4], of
      [30b, eerste lid, onder b, van de Vreemdelingenwet 2000][ref5].


