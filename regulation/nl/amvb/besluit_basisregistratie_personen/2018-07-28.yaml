      1 Onze Minister neemt bij een inschrijving als bedoeld in [artikel 2.67 van de wet][ref1] ten minste de volgende
      gegevens over de betrokkene op:

      a. over de burgerlijke staat: de geslachtsnaam, de voornamen, de geboortedatum, de geboorteplaats, het geboorteland
      of -gebied en het geslacht;

      b. over de nationaliteit: de nationaliteit of nationaliteiten, dan wel een aanduiding dat de betrokkene geen
      nationaliteit bezit, of een aanduiding dat de nationaliteit van de betrokkene niet kan worden vastgesteld.

      2 Onze Minister neemt daarnaast de data ingang en beëindiging rechtsgeldigheid van de in het eerste lid bedoelde
      gegevens op voor zover deze bij de inschrijving kunnen worden vastgesteld.

      3 Onze Minister neemt daarnaast andere algemene gegevens op voor zover de betrokkene daarom verzoekt en de gegevens
      bij de inschrijving kunnen worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2.67
    url: https://wetten.overheid.nl/BWBR0034306/2018-07-28#Artikel33
    references:
      - id: ref1
