  - number: '53'
    text: |-
      1 In afwijking van [artikel 13][ref1] geldt voor het jaar 2014 de
      abonnementsstructuur die Onze Minister voor dat jaar heeft vastgesteld op grond van
      [artikel 6 van het Besluit gemeentelijke basisadministratie persoonsgegevens][ref2] zoals dat luidde op de laatste
      dag voor de intrekking van de [Wet gemeentelijke basisadministratie persoonsgegevens][ref3].

      2 Voor de toepassing van [artikel 13, derde lid][ref4], wordt wat betreft het vaststellen van de
      abonnementsstructuur voor het jaar 2015, uitgegaan van vermindering van de bijdragen met de kosten, bedoeld in
      [artikel 4 van het Besluit gemeentelijke basisadministratie persoonsgegevens][ref5] zoals dat luidde op de laatste
      dag voor de intrekking van de [Wet gemeentelijke basisadministratie persoonsgegevens][ref6].

      3 Voor de toepassing van [artikel 14][ref7] wordt wat betreft het bij een betrokkene in rekening te brengen
      abonnementstarief voor het jaar 2014 gelet op het aantal netwerkberichten dat in het jaar 2013 ten laste van
      hem kwam op grond van het [Besluit gemeentelijke basisadministratie persoonsgegevens][ref8] zoals dat gold op de
      laatste dag voor de intrekking van de [Wet gemeentelijke basisadministratie persoonsgegevens][ref9].


