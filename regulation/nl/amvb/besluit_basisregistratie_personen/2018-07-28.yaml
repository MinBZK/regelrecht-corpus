      1 Categorieën van kosten, als bedoeld in [artikel 1.14, tweede lid, van de wet][ref1], zijn tevens de kosten
      in verband met de verzending van berichten met behulp van alternatieve media, tenzij deze kosten vallen onder
      [artikel 15][ref2] of de verzending verband houdt met een infrastructurele wijziging ten aanzien van een gemeente.

      2 Onze Minister kan bij de betrokkene aan wie de berichten worden verzonden in verband met de kosten, bedoeld
      in het eerste lid, een bijdrage in rekening brengen. Deze bijdrage kan in rekening worden gebracht naast de
      bijdrage die op grond van de [artikelen 12, tweede lid][ref3], [13][ref4] en [14][ref5] voor de betrokkene wordt
      vastgesteld.

      3 Bij regeling van Onze Minister wordt vastgesteld welke bijdragen ten hoogste in rekening kunnen worden gebracht.


