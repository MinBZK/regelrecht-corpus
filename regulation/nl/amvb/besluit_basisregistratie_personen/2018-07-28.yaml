  - number: '51'
    text: |-
      1 Onze Minister stelt in september van ieder kalenderjaar een korting vast voor het volgende jaar in verband met
      de toename van de kosten, bedoeld in [artikel 12][ref1], die gedurende dat jaar in verband met de overgang van de
      gemeentelijke basisadministratie persoonsgegevens naar de basisregistratie personen plaatsvindt.

      2 De ingevolge het eerste lid vastgestelde korting wordt in mindering gebracht op de kosten in verband met dat
      kalenderjaar bij de vaststelling van de abonnementsstructuur op grond van [artikel 13][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0034306#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0034306#Artikel13
