  - number: '44'
    text: |-
      1 [Artikel 3.13 van de wet][ref1] is van toepassing op een verstrekking uit de basisregistratie voor zover:

      a. het verzoek daartoe is gedaan door een instelling als bedoeld in
      [artikel 1.2 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2], een onderzoeksafdeling van een
      overheidsorgaan of een onderzoeksbureau;

      b. het onderzoek een algemeen belang dient;

      c. de verwerking voor het betreffende onderzoek noodzakelijk is;

      d. de verzoeker heeft aangetoond dat de nodige voorzieningen zijn getroffen teneinde te verzekeren dat de verdere
      verwerking van de verstrekte gegevens uitsluitend geschiedt ten behoeve van het onderzoek en dat ook overigens is
      voorzien in zodanige waarborgen dat de persoonlijke levenssfeer van de betrokkene niet onevenredig wordt geschaad,
      en

      e. de gegevens slechts in geanonimiseerde vorm aan anderen beschikbaar worden gesteld, tenzij de ingeschrevene
      uitdrukkelijk met de voorgenomen openbaarmaking van de hem betreffende gegevens heeft ingestemd.

      2 De verstrekking geschiedt door Onze Minister of door een college van burgemeester en wethouders

      3 Verstrekking door Onze Minister geschiedt overeenkomstig hetgeen bij of krachtens de wet is bepaald ten aanzien
      van systematische verstrekkingen, met uitzondering van [artikel 3.2, achtste lid, van de wet][ref3].

      4 Onze Minister maakt slechts gebruik van zijn bevoegdheid, bedoeld in het tweede lid, voor zover:

      a. de verzoeker heeft aangetoond dat het voor een goede uitvoering van het onderzoek noodzakelijk is dat
      verstrekking plaatsvindt overeenkomstig hetgeen krachtens de [artikelen 3.1][ref4] en [3.2 van de wet][ref5] is
      bepaald;

      b. aan de voorwaarden, genoemd in het eerste lid, is voldaan, en

      c. de Autoriteit persoonsgegevens over het verzoek is gehoord.


