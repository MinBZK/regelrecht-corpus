      1 Categorieën van kosten, als bedoeld in [artikel 1.14, tweede lid, van de wet][ref1], zijn tevens de kosten in
      verband met:

      a. de verstrekking van gegevens op grond van [artikel 3.13 van de wet][ref2];

      b. de verstrekking van gegevens, bedoeld in [artikel 37, eerste lid, onderdeel c][ref3].

      2 De bijdrage van een betrokkene in de in het eerste lid bedoelde kosten wordt vastgesteld op basis van de kosten
      van de verstrekking, met uitzondering van de kosten waartoe door de betrokkene al wordt bijgedragen op grond van de
      [artikelen 12, tweede lid][ref4], [13][ref5] en [14][ref6].

      3 De bijdrage kan door Onze Minister of door een college van burgemeester en wethouders in rekening worden
      gebracht. Voor zover de verstrekking geschiedt door Onze Minister, kan deze bijdrage in rekening worden gebracht
      naast de bijdrage die op grond van de [artikelen 12, tweede lid][ref7], [13][ref8] en [14][ref9] voor de betrokkene
      wordt vastgesteld.


