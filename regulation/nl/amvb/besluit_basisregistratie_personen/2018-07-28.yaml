        artikel: '1.14'
  - number: '13'
    text: |-
      1 Onze Minister stelt elk jaar de abonnementsstructuur vast die hij in het volgende jaar zal hanteren. De
      abonnementsstructuur bestaat uit verschillende abonnementsklassen met daarbij behorende bandbreedten van aantallen
      berichten en het daarbij behorende tarief in euro’s.

      2 Onze Minister bepaalt de abonnementsstructuur, gelet op:

      a. de voor het volgende jaar te verwachten kosten als bedoeld in [artikel 12][ref1], verminderd met het saldo over
      het vorige jaar;

      b. het voor het volgende jaar te verwachten aantal berichten dat ten laste van de betrokkenen komt.

      3 Het saldo over het vorige jaar wordt gevonden door de in [artikel 14, eerste tot en met derde lid][ref2],
      bedoelde bijdragen over dat jaar te verminderen met de kosten, bedoeld in [artikel 12][ref3], in dat jaar.

      4 Onze Minister deelt de abonnementsstructuur in september van elk jaar mede aan de betrokkenen.


      [ref1]: https://wetten.overheid.nl/BWBR0034306#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0034306#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0034306#Artikel12
