    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de vaststelling en de betaling van de
      bijdragen.
    url: https://wetten.overheid.nl/BWBR0034306/2018-07-28#Artikel20
  - number: '21'
    text: |-
      1 Voor inschrijving als ingezetene komen niet in aanmerking:

      a. de personen die door Onze Minister van Buitenlandse Zaken zijn aangewezen in verband met hun bijzondere
      verblijfsrechtelijke status;

      b. de in Nederland hun dienst uitoefenende militairen behorend tot de krijgsmacht van een vreemde mogendheid,
      aangesloten bij de Noord-Atlantische Verdragsorganisatie;

      c. de in Nederland hun dienst uitoefenende leden van het burgerpersoneel, die in dienst zijn bij de krijgsmacht
      van een vreemde mogendheid als bedoeld in onderdeel b, of die in dienst zijn van een hoofdkwartier als bedoeld
      in artikel 3 van het op 28 augustus 1952 te Parijs tot stand gekomen Protocol bij het op 19 juni 1951 te Londen
      gesloten Verdrag tussen de Staten die partij zijn bij het Noordatlantisch Verdrag – nopens de rechtspositie van hun
      krijgsmachten – nopens de rechtspositie van internationale militaire hoofdkwartieren, ingesteld uit hoofde van het
      Noordatlantisch Verdrag (Trb. 1953, 11) en beschikken over een door het hoofdkwartier afgegeven identiteitsbewijs;

      d. de echtgenoten of geregistreerde partners van personen als bedoeld in onderdeel b of c;

      e. de inwonende minderjarige kinderen van personen als bedoeld in onderdeel b, c of d;

      f. vreemdelingen die geen toelating hebben tot Nederland en verblijven in een door het Rijk beschikbaar gestelde
      accommodatie die uitsluitend bestemd is voor het bieden van tijdelijke opvang aan vreemdelingen, gedurende de
      eerste zes maanden van het verblijf in Nederland.

      2 Het eerste lid, aanhef en onderdelen b, c, d en e, is niet van toepassing op aldaar bedoelde personen die de
      Nederlandse nationaliteit bezitten.

      3 Het eerste lid, aanhef en onderdelen c, d, en e, is niet van toepassing op:

      a. aldaar bedoelde personen die reeds gedurende een jaar als ingezetene zijn ingeschreven;

      b. aldaar bedoelde personen die geen onderdaan zijn van een staat die is aangesloten bij de Noordatlantische
      Verdragsorganisatie;

      c. aldaar bedoelde personen die staatloos zijn.

      4 Het eerste lid, aanhef en onderdeel f, is niet van toepassing op de aldaar bedoelde personen:

      a. omtrent wie een mededeling is gedaan als bedoeld in [artikel 24a][ref1];

      b. van wie het verblijf in Nederland aanvangt door geboorte en omtrent wie door een ambtenaar van de burgerlijke
      stand in Nederland een geboorteakte is opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0034306#Artikel24a
    url: https://wetten.overheid.nl/BWBR0034306/2018-07-28#Artikel21
