      Ter uitvoering van [artikel 3.11 van de wet][ref1] wordt van systematische verstrekking van gegevens geen
      aantekening gehouden voor zover de verstrekking noodzakelijk is voor:

      a. de uitvoering van de taken van de Algemene Inlichtingen- en Veiligheidsdienst op grond van
      [artikel 8, tweede lid, van de Wet op de inlichtingen- en veiligheidsdiensten 2017][ref2], met inbegrip van
      werkzaamheden die ten behoeve van de Algemene Inlichtingen- en Veiligheidsdienst worden verricht op grond van
      [artikel 91 van die wet][ref3];

      b. de uitvoering van de taken van de Militaire Inlichtingen- en Veiligheidsdienst op grond van
      [artikel 10, tweede lid, van de Wet op de inlichtingen- en veiligheidsdiensten 2017][ref4], met inbegrip van
      werkzaamheden die ten behoeve van de Militaire Inlichtingen- en Veiligheidsdienst worden verricht op grond van
      [artikel 92 van die wet][ref5];

      c. de uitvoering van taken door de politie op grond van [artikel 3 van de Politiewet 2012][ref6] of door de
      Koninklijke marechaussee op grond van [artikel 4 van die wet][ref7], die verband houden met de bestrijding van
      zware of georganiseerde criminaliteit;

      d. de uitvoering van taken door de rijksrecherche op grond van [artikel 49 van de Politiewet 2012][ref8] die
      verband houden met onderzoeken in opdracht van het College van Procureurs-Generaal.


