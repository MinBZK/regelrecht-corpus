  - number: '31'
    text: |-
      De volgende bestuursorganen zijn wat betreft de genoemde taken bevoegd om Onze Minister een
      verzoek als bedoeld in [artikel 2.68, eerste lid, van de wet][ref1] of een opgave als bedoeld in
      [artikel 2.70, derde lid, onderdeel a, van de wet][ref2] te doen:

      a. de volgende organen binnen de Belastingdienst:

      1°. de directeur, de inspecteur en de ontvanger, bedoeld in
      [artikel 2, derde lid, onderdeel b, van de Algemene wet inzake rijksbelastingen][ref3],
      [artikel 2, eerste lid, onderdeel i, van de Invorderingswet 1990][ref4] en
      [artikel 1:3, eerste lid, onderdeel c, van de Algemene douanewet][ref5], wat betreft:

        - de heffing van rijksbelastingen op grond van de [Algemene wet inzake rijksbelastingen][ref6] en van andere
      heffingen, premies of bijdragen van het rijk voor zover bij of krachtens de wet opgedragen;
        - de invordering van belastingen, andere heffingen van het rijk en tegemoetkomingen op grond van de
      [Invorderingswet 1990][ref7];
        - de heffing en invordering van invoerrechten en accijnzen op grond van de [Algemene douanewet][ref8];
        - de toepassing van de [Algemene douanewet][ref9] met betrekking tot de taken, voortvloeiende uit het bepaalde in
      [artikel 1:1 van de Algemene douanewet][ref10];

      2°. de Belastingdienst/Toeslagen, bedoeld in
      [artikel 11, tweede lid, van de Algemene wet inkomensafhankelijke regelingen][ref11] en de ontvanger, bedoeld
      in [artikel 2, eerste lid, onderdeel i, van de Invorderingswet 1990][ref12], wat betreft de uitkering en
      terugvordering van tegemoetkomingen op grond van de [Algemene wet inkomensafhankelijke regelingen][ref13];

      b. de Sociale Verzekeringsbank wat betreft de taken op grond van
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref14] met uitzondering van de taken op
      grond van [artikel 35 van die wet][ref15] ten aanzien van verzekerden en bij de verzekerden behorende personen in
      de verzekerdenadministratie;

      c. het Uitvoeringsinstituut werknemersverzekeringen wat betreft de taken op grond van
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref16] met uitzondering van de taken op
      grond van [artikel 33 van die wet][ref17];

      d. het CAK wat betreft de taken op grond van [artikel 69 van de Zorgverzekeringswet][ref18];

      e.

      f. Onze Minister van Buitenlandse Zaken wat betreft de taken omtrent personen die in Nederland voorrechten en
      immuniteiten genieten op grond van het op 18 april 1961 te Wenen tot stand gekomen Verdrag van Wenen inzake
      diplomatiek verkeer met twee protocollen (Trb. 1962, 101), het op 24 april 1963 te Wenen tot stand gekomen
      Verdrag van Wenen inzake consulaire betrekkingen, met twee protocollen (Trb. 1965, 40), zetelovereenkomsten met in
      Nederland gevestigde internationale organisaties, Europese regelgeving of volkenrechtelijk gebruik.


