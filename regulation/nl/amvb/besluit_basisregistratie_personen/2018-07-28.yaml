        paragraaf: '3'
        afdeling: '1'
  - number: '22'
    text: |-
      1 Een persoon kan door Onze Minister van Buitenlandse Zaken worden aangewezen als persoon bedoeld in
      [artikel 21, eerste lid, onderdeel a][ref1], indien hij geen Nederlander is en behoort tot een van de volgende
      categorieën van personen:

      a. de leden van diplomatieke zendingen en van consulaire posten;

      b. de leden van het administratieve en technische personeel van diplomatieke zendingen en van consulaire posten;

      c. de inwonende gezinsleden van de in onderdeel a en b bedoelde personen;

      d. andere personen die krachtens internationaal recht een bijzondere verblijfsrechtelijke status hebben.

      2 Een persoon ten aanzien van wie een aanwijzing van kracht wordt, terwijl hij reeds als ingezetene is
      ingeschreven, wordt aangemerkt als een ingeschrevene die wegens zijn vertrek uit Nederland niet als ingezetene
      is ingeschreven.

      3 Een aanwijzing wordt niet van kracht of beëindigd voordat het college van burgemeester en wethouders de in
      [artikel 25][ref2] bedoelde mededeling heeft ontvangen.

      4 Het tweede lid is van overeenkomstige toepassing op een persoon die nog niet gedurende een jaar als ingezetene is
      ingeschreven en op wie [artikel 21, eerste lid, aanhef en onderdeel c, d of e][ref3], van toepassing wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0034306#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0034306#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0034306#Artikel21
    url: https://wetten.overheid.nl/BWBR0034306/2018-07-28#Artikel22
