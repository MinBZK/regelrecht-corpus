        artikel: '4'
      - id: ref3
        bwb_id: BWBR0031788
        artikel: '49'
  - number: 46.b
    text: |-
      taken op grond van [artikel 3 van de Wet op de bijzondere opsporingsdiensten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019919#Artikel3
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0019919
        artikel: '3'
  - number: 46.c
    text: |-
      taken op grond van [artikel 36, eerste lid, onderdeel b, van de Gezondheidswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002202#Artikel36
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002202
        artikel: '36'
  - number: 46.d
    text: |-
      taken op grond van
      [artikel 13, aanhef en onderdeel a, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel13
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '13'
  - number: 46.e
    text: |-
      taken op grond van [artikel 110, eerste lid, van de Wet op het notarisambt][ref1],
      [artikel 30 van de Gerechtsdeurwaarderswet][ref2] of
      [artikel 1d, eerste lid, onderdeel c, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel110
      [ref2]: https://wetten.overheid.nl/BWBR0012197#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0024282#Artikel1d
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '110'
      - id: ref2
        bwb_id: BWBR0012197
        artikel: '30'
      - id: ref3
        bwb_id: BWBR0024282
        artikel: 1d
  - number: 46.f
    text: |-
      de taken, bedoeld in [artikel 4.1.1, tweede lid, van de Wet maatschappelijke ondersteuning 2015][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
  - number: '47.1'
    text: |-
      De onderzoeken, bedoeld in [artikel 4.3 van de wet][ref1], geschieden jaarlijks, uiterlijk op een door Onze
      Minister vast te stellen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel4
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '4'
  - number: '47.2'
    text: |-
      De uitvoering van deze onderzoeken geschiedt met behulp van een door Onze Minister beschikbaar gesteld evaluatie-
      instrument.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel47
  - number: '47.3'
    text: |-
      Onze Minister verstrekt ten behoeve van het onderzoek door een college van burgemeester en wethouders aan het
      college een op de ingezetenen van de gemeente betrekking hebbend overzicht van aandachtspunten.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel47
  - number: '47.4'
    text: |-
      De uittreksels, bedoeld in [artikel 4.3 van de wet][ref1], bevatten de geaggregeerde resultaten van het onderzoek.
      Bij regeling van Onze Minister wordt voor de verschillende typen uittreksels het aggregatieniveau bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel4
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '4'
  - number: '47.5'
    text: De uittreksels worden jaarlijks uiterlijk op een door Onze Minister vast te stellen tijdstip verzonden.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel47
  - number: '47.6'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld ten aanzien van de uitvoering van de onderzoeken
      en de inhoud van de uittreksels.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel47
  - number: '48.1'
    text: |-
      De op grond van [artikel 4.6 van de wet][ref1] aan het college van burgemeester en wethouders verstrekte gegevens
      worden toegevoegd aan het persoonsregister.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel4
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '4'
  - number: '48.2'
    text: |-
      Onze Minister kan regels stellen omtrent de zorg voor het persoonsregister, het persoonskaartenarchief en het
      schakelregister. Daarbij kan worden bepaald dat het persoonsregister op een andere wijze dan in de vorm van
      persoonskaarten, bedoeld in het Besluit bevolkingsboekhouding, kan worden aangehouden en kan de vernietiging van
      persoonskaarten worden geregeld.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel48
  - number: '49'
    text: 'Onze Minister stelt regels omtrent heffingen in verband met de verstrekking van gegevens uit:'
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel49
  - number: 49.a
    text: het persoonskaartenarchief, bedoeld in het Besluit bevolkingsboekhouding;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel49
  - number: 49.b
    text: het schakelregister, bedoeld in het Besluit bevolkingsboekhouding;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel49
  - number: 49.c
    text: |-
      het centraal archief van overledenen, bestaande uit de persoonskaarten, bedoeld in artikel 69, tweede lid, van het
      Besluit bevolkingsboekhouding.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel49
  - number: '50.1'
    text: |-
      Onze Minister raadpleegt de desbetreffende gemeenten, overheidsorganen waaraan en derden aan wie systematisch
      gegevens worden verstrekt, inzake de overgang, bedoeld in de [artikelen 4.15][ref1] en [4.16 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel4
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '4'
  - number: '50.2'
    text: |-
      Onze Minister stelt een schema vast waarin voor een betrokkene of groep van betrokkenen een tijdstip wordt
      vastgesteld voor de overgang van de oude naar de nieuwe voorzieningen of berichtuitwisseling.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel50
  - number: '50.3'
    text: |-
      Onze Minister kan verschillende tijdstippen vaststellen voor verschillende delen van de organisatie van de
      gemeente, het overheidsorgaan of de derde, of voor verschillende wijzen van verstrekking van gegevens.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel50
  - number: '50.4'
    text: |-
      De betrokkenen dragen er zorg voor dat zij op het desbetreffende tijdstip gereed zijn om uitvoering te geven aan de
      [wet][ref1] met behulp van de nieuwe voorzieningen of de nieuwe berichtuitwisseling.


      [ref1]: https://wetten.overheid.nl/BWBR0033715
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0033715
  - number: '51.1'
    text: |-
      Onze Minister stelt in september van ieder kalenderjaar een korting vast voor het volgende jaar in verband met
      de toename van de kosten, bedoeld in [artikel 12][ref1], die gedurende dat jaar in verband met de overgang van de
      gemeentelijke basisadministratie persoonsgegevens naar de basisregistratie personen plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0034306#Artikel12
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0034306
        artikel: '12'
        hoofdstuk: '1'
        paragraaf: '4'
  - number: '51.2'
    text: |-
      De ingevolge het eerste lid vastgestelde korting wordt in mindering gebracht op de kosten in verband met dat
      kalenderjaar bij de vaststelling van de abonnementsstructuur op grond van [artikel 13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034306#Artikel13
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0034306
        artikel: '13'
        hoofdstuk: '1'
        paragraaf: '4'
  - number: '52.1'
    text: |-
      Bij regeling van Onze Minister kan worden bepaald in welke gevallen [artikel 26][ref1] niet van toepassing is
      in verband met de overgang van de oude naar de nieuwe voorzieningen of de overgang van de oude naar de nieuwe
      berichtuitwisseling.


      [ref1]: https://wetten.overheid.nl/BWBR0034306#Artikel26
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0034306
        artikel: '26'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '1'
  - number: '52.2'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld in verband met de overgang, waarbij kan worden
      afgeweken van de [hoofdstukken 2][ref1] en [3][ref2] van dit besluit, voor zover de afwijking noodzakelijk is in
      verband met een goede bijhouding en verstrekking van gegevens in de basisregistratie gedurende de overgang van de
      oude naar de nieuwe voorzieningen of de overgang van de oude naar de nieuwe berichtuitwisseling.


      [ref1]: https://wetten.overheid.nl/BWBR0034306#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0034306#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0034306
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0034306
        hoofdstuk: '3'
  - number: '53.1'
    text: |-
      In afwijking van [artikel 13][ref1] geldt voor het jaar 2014 de
      abonnementsstructuur die Onze Minister voor dat jaar heeft vastgesteld op grond van
      [artikel 6 van het Besluit gemeentelijke basisadministratie persoonsgegevens][ref2] zoals dat luidde op de laatste
      dag voor de intrekking van de [Wet gemeentelijke basisadministratie persoonsgegevens][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0034306#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0006933#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0006723
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0034306
        artikel: '13'
        hoofdstuk: '1'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0006933
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0006723
  - number: '53.2'
    text: |-
      Voor de toepassing van [artikel 13, derde lid][ref1], wordt wat betreft het vaststellen van de
      abonnementsstructuur voor het jaar 2015, uitgegaan van vermindering van de bijdragen met de kosten, bedoeld in
      [artikel 4 van het Besluit gemeentelijke basisadministratie persoonsgegevens][ref2] zoals dat luidde op de laatste
      dag voor de intrekking van de [Wet gemeentelijke basisadministratie persoonsgegevens][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0034306#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0006933#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0006723
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0034306
        artikel: '13'
        hoofdstuk: '1'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0006933
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0006723
  - number: '53.3'
    text: |-
      Voor de toepassing van [artikel 14][ref1] wordt wat betreft het bij een betrokkene in rekening te brengen
      abonnementstarief voor het jaar 2014 gelet op het aantal netwerkberichten dat in het jaar 2013 ten laste van
      hem kwam op grond van het [Besluit gemeentelijke basisadministratie persoonsgegevens][ref2] zoals dat gold op de
      laatste dag voor de intrekking van de [Wet gemeentelijke basisadministratie persoonsgegevens][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0034306#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0006933
      [ref3]: https://wetten.overheid.nl/BWBR0006723
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0034306
        artikel: '14'
        hoofdstuk: '1'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0006933
      - id: ref3
        bwb_id: BWBR0006723
  - number: '54'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip. Bij koninklijk besluit kunnen
      andere tijdstippen worden vastgesteld waarop de onderdelen van [artikel 31][ref1] in werking treden.


      [ref1]: https://wetten.overheid.nl/BWBR0034306#Artikel31
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0034306
        artikel: '31'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: '55'
    text: 'Dit besluit wordt aangehaald als: Besluit basisregistratie personen.'
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel55
