preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 10 oktober 2013, nr. 2013-
    0000602327;

    Gelet op richtlijn nr. 95/46/EG van het Europees Parlement en de Raad van de Europese Unie van 24 oktober
    1995 betreffende de bescherming van natuurlijke personen in verband met de verwerking van persoonsgegevens en
    betreffende het vrije verkeer van die gegevens (PbEG L 281) en de artikelen 1.6, 1.10, eerste lid, 1.14, tweede
    en derde lid, 2.6, 2.7, tweede en vierde lid, 2.31, 2.33, 2.34, derde lid, 2.37, 2.43, vijfde lid, 2.49, derde en
    vierde lid, 2.65, 2.67, tweede lid, 2.69, tweede lid j° 2.7, tweede en vierde lid, 2.70, tweede lid, 2.77, 2.78,
    derde lid, 2.79, tweede en derde lid, 3.1, tweede lid, 3.2, zevende lid, 3.3, eerste lid, 3.3, derde lid j° 3.2.
    zevende lid, 3.5, vierde lid, 3.6, tweede lid, 3.6, derde lid j° 3.5, vierde lid, 3.11, tweede lid, 3.12, 3.13,
    3.14, tweede lid, 3.22, vierde lid, 4.3, vijfde lid, 4.4, tweede lid, 4.5, derde en vierde lid j° 4.4, tweede lid,
    4.6 j° 4.4, tweede lid, 4.8, eerste lid, 4.12, 4.15, derde lid en 4.16, derde lid, van de Wet basisregistratie
    personen;

    De Afdeling advisering van de Raad van State gehoord (advies van 15 november 2013, nr. W04.13.0369/I);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 25 november 2013,
    nr. 2013-0000697925;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *een autorisatiebesluit:* een besluit als
      bedoeld in [artikel 3.2][ref1] of [artikel 3.3 van de wet][ref2];
        - *de systeembeschrijving:* de beschrijving, bedoeld in [artikel 4][ref3];
        - *de wet:* de [Wet basisregistratie personen][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0034306#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0033715
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0034306
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0033715
  - number: '2'
    text: |-
      Authentieke gegevens als bedoeld in [artikel 1.6 van de wet][ref1] zijn de gegevens over ingezetenen die als
      zodanig zijn aangeduid in de tabel die als [bijlage 1][ref2] bij dit besluit is gevoegd en, met uitzondering van de
      gegevens over de burgerlijke staat van ingezetenen, als actuele gegevens zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0034306
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0034306
  - number: '3.1'
    text: Onze Minister stelt een systeembeschrijving vast.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel3
  - number: '3.2'
    text: |-
      De systeembeschrijving kan een onderdeel bevatten dat is toegesneden op gemeenten die gebruikmaken van een oude
      gemeentelijke voorziening als bedoeld in [artikel 4.15, eerste lid, van de wet][ref1], en een onderdeel dat is
      toegesneden op gemeenten die gebruikmaken van een nieuwe gemeentelijke voorziening als bedoeld in dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel4
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '4'
  - number: '3.3'
    text: |-
      Voor het onderdeel dat is toegesneden op gemeenten die gebruikmaken van een oude voorziening
      kan verwezen worden naar de systeembeschrijving zoals deze laatstelijk werd gehanteerd onder de
      [Wet gemeentelijke basisadministratie persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006723
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006723
  - number: '3.4'
    text: |-
      Het tweede en derde lid zijn van overeenkomstige toepassing ten aanzien van de uitwisseling van berichten met een
      overheidsorgaan waaraan of een derde aan wie systematisch gegevens worden verstrekt, met dien verstande dat het
      betreft de in [artikel 4.16 van de wet][ref1] bedoelde oude en nieuwe berichtuitwisseling.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel4
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '4'
  - number: '4'
    text: |-
      De systeembeschrijving geeft een beschrijving van de aspecten die zijn aangeduid in de tabel die als
      [bijlage 2][ref1] bij dit besluit is gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0034306
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0034306
  - number: '5'
    text: |-
      Een college van burgemeester en wethouders, Onze Minister, een aangewezen bestuursorgaan, een overheidsorgaan
      en een derde dragen er zorg voor dat zij uitvoering geven aan de [wet][ref1] op een wijze die overeenstemt met
      de systeembeschrijving. De uitvoering voor zover die op hen betrekking heeft, is aangeduid in de tabel die als
      [bijlage 3][ref2] bij dit besluit is gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0033715
      [ref2]: https://wetten.overheid.nl/BWBR0034306
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0033715
      - id: ref2
        bwb_id: BWBR0034306
  - number: '6.1'
    text: |-
      Het college van burgemeester en wethouders treft ten aanzien van de gemeentelijke voorziening passende technische
      en organisatorische maatregelen ter beveiliging van de in de basisregistratie opgenomen gegevens tegen verlies of
      aantasting van deze gegevens en tegen onbevoegde kennisneming, wijziging of verstrekking van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel6
  - number: '6.2'
    text: |-
      Onze Minister treft ten aanzien van de centrale voorzieningen passende technische en organisatorische maatregelen
      ter beveiliging van de in de basisregistratie opgenomen gegevens tegen verlies of aantasting van deze gegevens en
      tegen onbevoegde kennisneming, wijziging of verstrekking van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel6
  - number: '6.3'
    text: 'De in het eerste en tweede lid bedoelde maatregelen omvatten ten minste:'
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel6
  - number: 6.3.a
    text: |-
      maatregelen gericht op personen die werkzaam zijn voor de verantwoordelijke voor de verwerking van gegevens in
      de basisregistratie;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel6
  - number: 6.3.b
    text: |-
      maatregelen gericht op de toegang tot gebouwen en ruimten waar in de basisregistratie opgenomen gegevens aanwezig
      zijn;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel6
  - number: 6.3.c
    text: maatregelen gericht op een deugdelijke werking en beveiliging van de apparatuur en programmatuur;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel6
  - number: 6.3.d
    text: |-
      maatregelen voor het geval de geheimhouding of integriteit van in de basisregistratie opgenomen gegevens is
      geschaad;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel6
  - number: 6.3.e
    text: maatregelen bij calamiteiten.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel6
  - number: '6.4'
    text: |-
      Onze Minister kan regels stellen omtrent de bewaring van geschriften en andere bescheiden, ongeacht hun vorm, die
      de verantwoordelijke voor de verwerking van gegevens in de basisregistratie gebruikt of heeft gebruikt in verband
      met de verwerking van gegevens in de basisregistratie.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel6
  - number: '10'
    text: |-
      In deze paragraaf, [artikel 51][ref1] en de daarop berustende bepalingen wordt verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0034306#Artikel51
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0034306
        artikel: '51'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '2'
  - number: 10.a
    text: |-
      *de betrokkene:* de betrokkene, bedoeld in [artikel 1.14, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel1
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '1'
  - number: 10.b
    text: |-
      *de bijdrage:* de bijdrage van de betrokkene in de kosten in verband met de uitvoering van de wet, bedoeld in
      [artikel 1.14, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel1
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '1'
  - number: 10.c
    text: '*een bericht:* een logische eenheid van gegevens die wordt verzonden of verstrekt:'
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel10
  - number: 10.c.1
    text: |-
      via het stelsel van berichtuitwisseling, bedoeld in [artikel 1.9, vierde lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel1
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '1'
  - number: 10.c.2
    text: met behulp van alternatieve media, of
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel10
  - number: 10.c.3
    text: op schriftelijke wijze;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel10
  - number: 10.d
    text: '*een jaar:* een kalenderjaar.'
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel10
  - number: '11.1'
    text: |-
      Berichten tussen een gemeente en de centrale voorziening komen ten laste van de gemeente, waarbij een bericht
      dat door een gemeente via de centrale voorziening wordt verzonden aan een andere gemeente, ten laste komt van de
      gemeente die het bericht verzendt.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel11
  - number: '11.2'
    text: |-
      Berichten aan of van een overheidsorgaan, anders dan organen van een gemeente, waaraan of een derde aan wie op
      grond van [artikel 3.2][ref1], [3.3][ref2] of [3.13 van de wet][ref3] gegevens worden verstrekt, komen ten laste
      van dat overheidsorgaan of die derde.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0033715
        artikel: '3'
  - number: '11.3'
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel11
  - number: 11.3.a
    text: berichten aan of van de centrale voorziening in verband met de bijhouding van gegevens;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel11
  - number: 11.3.b
    text: berichten in verband met de verstrekking van gegevens door een college van burgemeester en wethouders;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel11
  - number: 11.3.c
    text: synchronisatieberichten;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel11
  - number: 11.3.d
    text: |-
      berichten in verband met [artikel 2.34 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
  - number: 11.3.e
    text: |-
      berichten als bedoeld in de [artikelen 2.37d, eerste lid][ref1], en [2.37e, eerste lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
  - number: '11.4'
    text: 'Het tweede lid is niet van toepassing op berichten in verband met:'
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel11
  - number: 11.4.a
    text: |-
      [hoofdstuk 2, afdeling 1, paragraaf 4][ref1] en [paragraaf 4a, van de wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Paragraaf4
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Paragraaf4a
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0033715
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0033715
        paragraaf: 4a
  - number: 11.4.b
    text: steekproeven;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel11
  - number: 11.4.c
    text: synchronisatie;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel11
  - number: 11.4.d
    text: wijziging in de gemeentelijke indeling; en
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel11
  - number: 11.4.e
    text: conversie bij de invoering van een wijziging in de systeembeschrijving.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel11
  - number: '12.1'
    text: |-
      Categorieën van kosten als bedoeld in [artikel 1.14, tweede lid, van de wet][ref1], zijn de kosten in verband met:


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel1
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '1'
  - number: 12.1.a
    text: het beheer en het gebruik van de centrale voorzieningen;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel12
  - number: 12.1.b
    text: |-
      de verzending en ontvangst van berichten, waaronder begrepen de kosten in verband met het stelsel van
      berichtuitwisseling.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel12
  - number: '12.2'
    text: |-
      De bijdrage van een betrokkene in de in het eerste lid bedoelde kosten wordt vastgesteld op basis van het aantal
      berichten dat ten laste van de betrokkene komt.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel12
  - number: '13.1'
    text: |-
      Onze Minister stelt elk jaar de abonnementsstructuur vast die hij in het volgende jaar zal hanteren. De
      abonnementsstructuur bestaat uit verschillende abonnementsklassen met daarbij behorende bandbreedten van aantallen
      berichten en het daarbij behorende tarief in euro’s.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel13
  - number: '13.2'
    text: 'Onze Minister bepaalt de abonnementsstructuur, gelet op:'
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel13
  - number: 13.2.a
    text: |-
      de voor het volgende jaar te verwachten kosten als bedoeld in [artikel 12][ref1], verminderd met het saldo over het
      vorige jaar;


      [ref1]: https://wetten.overheid.nl/BWBR0034306#Artikel12
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0034306
        artikel: '12'
        hoofdstuk: '1'
        paragraaf: '4'
  - number: 13.2.b
    text: het voor het volgende jaar te verwachten aantal berichten dat ten laste van de betrokkenen komt.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel13
  - number: '13.3'
    text: |-
      Het saldo over het vorige jaar wordt gevonden door de in [artikel 14, eerste tot en met derde lid][ref1], bedoelde
      bijdragen over dat jaar te verminderen met de kosten, bedoeld in [artikel 12][ref2], in dat jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0034306#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0034306#Artikel12
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0034306
        artikel: '14'
        hoofdstuk: '1'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0034306
        artikel: '12'
        hoofdstuk: '1'
        paragraaf: '4'
  - number: '13.4'
    text: Onze Minister deelt de abonnementsstructuur in september van elk jaar mede aan de betrokkenen.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel13
  - number: '14.1'
    text: |-
      De bijdrage van een betrokkene, bedoeld in [artikel 12, tweede lid][ref1], bestaat uit een jaarlijkse betaling.
      Hiertoe brengt Onze Minister het abonnementstarief voor het lopende jaar in rekening dat behoort bij de
      abonnementsklasse waarin de betrokkene valt, gelet op het aantal berichten dat in het voorafgaande jaar ten laste
      van hem kwam.


      [ref1]: https://wetten.overheid.nl/BWBR0034306#Artikel12
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0034306
        artikel: '12'
        hoofdstuk: '1'
        paragraaf: '4'
  - number: '14.2'
    text: |-
      Indien het aantal berichten over het lopende jaar dat ten laste van de betrokkene komt, in een hogere
      abonnementsklasse valt dan de in het eerste lid bedoelde klasse, brengt Onze Minister, in afwijking van het eerste
      lid, het abonnementstarief voor het lopende jaar in rekening dat behoort bij die hogere klasse.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel14
  - number: '14.3'
    text: |-
      Onze Minister stelt het jaarlijks in rekening te brengen bedrag voor een betrokkene op nul vast, voor zover een
      voorziening is getroffen in de begroting van het Ministerie van Binnenlandse Zaken die in de plaats treedt van de
      bijdrage van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel14
  - number: '15.1'
    text: |-
      Categorieën van kosten als bedoeld in [artikel 1.14, tweede lid, van de wet][ref1], zijn tevens de kosten in
      verband met de afstemming van gegevens van een betrokkene op de gegevens in de basisregistratie.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel1
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '1'
  - number: '15.2'
    text: |-
      Bij regeling van Onze Minister wordt bepaald welke berichten voor de toepassing van dit artikel worden aangemerkt
      als afstemmingsberichten.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel15
  - number: '15.3'
    text: 'Als afstemmingsbericht wordt slechts aangemerkt een bericht:'
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel15
  - number: 15.3.a
    text: |-
      dat nodig is voor de systematische verstrekking van gegevens ter afstemming van de gegevens van een overheidsorgaan
      of derde op de gegevens in de basisregistratie;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel15
  - number: 15.3.b
    text: |-
      waarvan de verzending en ontvangst geschiedt op een wijze die op grond van [artikel 4][ref1] is beschreven in de
      systeembeschrijving, en


      [ref1]: https://wetten.overheid.nl/BWBR0034306#Artikel4
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0034306
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 15.3.c
    text: dat als doel heeft de in het vijfde lid bedoelde verstrekking van gegevens mogelijk te maken.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel15
  - number: '15.4'
    text: |-
      Voor afstemmingsberichten brengt Onze Minister, in afwijking van de [artikelen 12, tweede lid][ref1], [13][ref2] en
      [14][ref3], bij de overheidsorganen en derden een tarief per geregistreerde persoon in rekening.


      [ref1]: https://wetten.overheid.nl/BWBR0034306#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0034306#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0034306#Artikel14
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0034306
        artikel: '12'
        hoofdstuk: '1'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0034306
        artikel: '13'
        hoofdstuk: '1'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0034306
        artikel: '14'
        hoofdstuk: '1'
        paragraaf: '4'
  - number: '15.5'
    text: |-
      Onder geregistreerde persoon als bedoeld in het vierde lid wordt verstaan de persoon over wie het
      overheidsorgaan of de derde verzoekt gegevens verstrekt te krijgen op de wijze die is beschreven in
      [artikel 37, eerste lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034306#Artikel37
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0034306
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '15.6'
    text: |-
      De kosten in verband met de afstemming bestaan uit de kosten die naar verwachting zijn verbonden aan de verzending
      en ontvangst van afstemmingsberichten over het stelsel van berichtuitwisseling of met behulp van alternatieve
      media.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel15
  - number: '15.7'
    text: |-
      Het tarief wordt vastgesteld bij regeling van Onze Minister. Het tarief wordt op een zodanige wijze vastgesteld dat
      door het totaal van de in rekening te brengen tarieven de kosten, bedoeld in het zesde lid, worden gedekt.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel15
  - number: '15.8'
    text: |-
      Het autorisatiebesluit bepaalt met betrekking tot het overheidsorgaan of de derde het aantal geregistreerde
      personen als bedoeld in het vijfde lid en het aantal afstemmingsberichten dat door het overheidsorgaan of de derde
      over het stelstel van berichtuitwisseling wordt verzonden en ontvangen.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel15
  - number: '15.9'
    text: Onze Minister stelt een raming vast van de verwachte kosten, alsmede van het verwachte aantal afstemmingsberichten.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel15
  - number: '16.1'
    text: |-
      Categorieën van kosten als bedoeld in [artikel 1.14, tweede lid, van de wet][ref1], zijn tevens de kosten in
      verband met de verzending van berichten met behulp van alternatieve media, tenzij deze kosten vallen onder
      [artikel 15][ref2] of de verzending verband houdt met een infrastructurele wijziging ten aanzien van een gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0034306#Artikel15
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0034306
        artikel: '15'
        hoofdstuk: '1'
        paragraaf: '4'
  - number: '16.2'
    text: |-
      Onze Minister kan bij de betrokkene aan wie de berichten worden verzonden in verband met de kosten, bedoeld in het
      eerste lid, een bijdrage in rekening brengen. Deze bijdrage kan in rekening worden gebracht naast de bijdrage die
      op grond van de [artikelen 12, tweede lid][ref1], [13][ref2] en [14][ref3] voor de betrokkene wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0034306#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0034306#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0034306#Artikel14
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0034306
        artikel: '12'
        hoofdstuk: '1'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0034306
        artikel: '13'
        hoofdstuk: '1'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0034306
        artikel: '14'
        hoofdstuk: '1'
        paragraaf: '4'
  - number: '16.3'
    text: Bij regeling van Onze Minister wordt vastgesteld welke bijdragen ten hoogste in rekening kunnen worden gebracht.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel16
  - number: '17.1'
    text: |-
      Categorieën van kosten als bedoeld in [artikel 1.14, tweede lid, van de wet][ref1], zijn tevens de kosten in
      verband met de schriftelijke verstrekking van gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel1
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '1'
  - number: '17.2'
    text: |-
      Een college van burgemeester en wethouders dat schriftelijk gegevens verstrekt, kan bij de betrokkene aan wie de
      gegevens worden verstrekt in verband met de kosten, bedoeld in het eerste lid, een bijdrage in rekening brengen.
      Voor zover de verstrekking geschiedt door Onze Minister, kan deze bijdrage in rekening worden gebracht naast de
      bijdrage die op grond van de [artikelen 12, tweede lid][ref1], [13][ref2] en [14][ref3] voor de betrokkene wordt
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0034306#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0034306#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0034306#Artikel14
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0034306
        artikel: '12'
        hoofdstuk: '1'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0034306
        artikel: '13'
        hoofdstuk: '1'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0034306
        artikel: '14'
        hoofdstuk: '1'
        paragraaf: '4'
  - number: '17.3'
    text: Bij regeling van Onze Minister wordt vastgesteld welke bijdragen ten hoogste in rekening kunnen worden gebracht.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel17
  - number: '18.1'
    text: |-
      Categorieën van kosten als bedoeld in [artikel 1.14, tweede lid, van de wet][ref1], zijn tevens de kosten in
      verband met:


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel1
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '1'
  - number: 18.1.a
    text: |-
      de verstrekking van gegevens op grond van [artikel 3.13 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
  - number: 18.1.b
    text: |-
      de verstrekking van gegevens, bedoeld in [artikel 37, eerste lid, onderdeel c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034306#Artikel37
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0034306
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '18.2'
    text: |-
      De bijdrage van een betrokkene in de in het eerste lid bedoelde kosten wordt vastgesteld op basis van de kosten
      van de verstrekking, met uitzondering van de kosten waartoe door de betrokkene al wordt bijgedragen op grond van de
      [artikelen 12, tweede lid][ref1], [13][ref2] en [14][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0034306#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0034306#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0034306#Artikel14
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0034306
        artikel: '12'
        hoofdstuk: '1'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0034306
        artikel: '13'
        hoofdstuk: '1'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0034306
        artikel: '14'
        hoofdstuk: '1'
        paragraaf: '4'
  - number: '18.3'
    text: |-
      De bijdrage kan door Onze Minister of door een college van burgemeester en wethouders in rekening worden gebracht.
      Voor zover de verstrekking geschiedt door Onze Minister, kan deze bijdrage in rekening worden gebracht naast de
      bijdrage die op grond van de [artikelen 12, tweede lid][ref1], [13][ref2] en [14][ref3] voor de betrokkene wordt
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0034306#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0034306#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0034306#Artikel14
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0034306
        artikel: '12'
        hoofdstuk: '1'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0034306
        artikel: '13'
        hoofdstuk: '1'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0034306
        artikel: '14'
        hoofdstuk: '1'
        paragraaf: '4'
  - number: '19.1'
    text: |-
      Categorieën van kosten als bedoeld in [artikel 1.14, tweede lid, van de wet][ref1], zijn tevens de kosten in
      verband met het ter beschikking stellen van informatie op grond van [artikel 3.14 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '3'
  - number: '19.2'
    text: |-
      De bijdrage van een betrokkene in de in het eerste lid bedoelde kosten wordt, in afwijking van de
      [artikelen 12, tweede lid][ref1], [13][ref2] en [14][ref3], vastgesteld op basis van de kosten van de
      terbeschikkingstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0034306#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0034306#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0034306#Artikel14
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0034306
        artikel: '12'
        hoofdstuk: '1'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0034306
        artikel: '13'
        hoofdstuk: '1'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0034306
        artikel: '14'
        hoofdstuk: '1'
        paragraaf: '4'
  - number: '20'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de vaststelling en de betaling van de
      bijdragen.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel20
  - number: '21.1'
    text: 'Voor inschrijving als ingezetene komen niet in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel21
  - number: 21.1.a
    text: |-
      de personen die door Onze Minister van Buitenlandse Zaken zijn aangewezen in verband met hun bijzondere
      verblijfsrechtelijke status;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel21
  - number: 21.1.b
    text: |-
      de in Nederland hun dienst uitoefenende militairen behorend tot de krijgsmacht van een vreemde mogendheid,
      aangesloten bij de Noord-Atlantische Verdragsorganisatie;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel21
  - number: 21.1.c
    text: |-
      de in Nederland hun dienst uitoefenende leden van het burgerpersoneel, die in dienst zijn bij de krijgsmacht
      van een vreemde mogendheid als bedoeld in onderdeel b, of die in dienst zijn van een hoofdkwartier als bedoeld
      in artikel 3 van het op 28 augustus 1952 te Parijs tot stand gekomen Protocol bij het op 19 juni 1951 te Londen
      gesloten Verdrag tussen de Staten die partij zijn bij het Noord-Atlantisch Verdrag – nopens de rechtspositie
      van hun krijgsmachten – nopens de rechtspositie van internationale militaire hoofdkwartieren, ingesteld uit
      hoofde van het Noord-Atlantisch Verdrag (Trb. 1953, 11) en beschikken over een door het hoofdkwartier afgegeven
      identiteitsbewijs;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel21
  - number: 21.1.d
    text: de echtgenoten of geregistreerde partners van personen als bedoeld in onderdeel b of c;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel21
  - number: 21.1.e
    text: de inwonende minderjarige kinderen van personen als bedoeld in onderdeel b, c of d;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel21
  - number: 21.1.f
    text: |-
      vreemdelingen die geen toelating hebben tot Nederland en verblijven in een door het Rijk beschikbaar gestelde
      accommodatie die uitsluitend bestemd is voor het bieden van tijdelijke opvang aan vreemdelingen, gedurende de
      eerste zes maanden van het verblijf in Nederland.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel21
  - number: '21.2'
    text: |-
      Het eerste lid, aanhef en onderdelen b, c, d en e, is niet van toepassing op aldaar bedoelde personen die de
      Nederlandse nationaliteit bezitten.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel21
  - number: '21.3'
    text: 'Het eerste lid, aanhef en onderdelen c, d, en e, is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel21
  - number: 21.3.a
    text: aldaar bedoelde personen die reeds gedurende een jaar als ingezetene zijn ingeschreven;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel21
  - number: 21.3.b
    text: |-
      aldaar bedoelde personen die geen onderdaan zijn van een staat die is aangesloten bij de Noord-Atlantische
      Verdragsorganisatie;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel21
  - number: 21.3.c
    text: aldaar bedoelde personen die staatloos zijn.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel21
  - number: '21.4'
    text: 'Het eerste lid, aanhef en onderdeel f, is niet van toepassing op de aldaar bedoelde personen:'
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel21
  - number: 21.4.a
    text: |-
      omtrent wie een mededeling is gedaan als bedoeld in [artikel 24a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034306#Artikel24a
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0034306
        artikel: 24a
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '1'
  - number: 21.4.b
    text: |-
      van wie het verblijf in Nederland aanvangt door geboorte en omtrent wie door een ambtenaar van de burgerlijke stand
      in Nederland een geboorteakte is opgemaakt.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel21
  - number: '22.1'
    text: |-
      Een persoon kan door Onze Minister van Buitenlandse Zaken worden aangewezen als persoon bedoeld in
      [artikel 21, eerste lid, onderdeel a][ref1], indien hij geen Nederlander is en behoort tot een van de volgende
      categorieën van personen:


      [ref1]: https://wetten.overheid.nl/BWBR0034306#Artikel21
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0034306
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: 22.1.a
    text: de leden van diplomatieke zendingen en van consulaire posten;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel22
  - number: 22.1.b
    text: de leden van het administratieve en technische personeel van diplomatieke zendingen en van consulaire posten;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel22
  - number: 22.1.c
    text: de inwonende gezinsleden van de in onderdeel a en b bedoelde personen;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel22
  - number: 22.1.d
    text: andere personen die krachtens internationaal recht een bijzondere verblijfsrechtelijke status hebben.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel22
  - number: '22.2'
    text: |-
      Een persoon ten aanzien van wie een aanwijzing van kracht wordt, terwijl hij reeds als ingezetene is ingeschreven,
      wordt aangemerkt als een ingeschrevene die wegens zijn vertrek uit Nederland niet als ingezetene is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel22
  - number: '22.3'
    text: |-
      Een aanwijzing wordt niet van kracht of beëindigd voordat het college van burgemeester en wethouders de in
      [artikel 25][ref1] bedoelde mededeling heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0034306#Artikel25
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0034306
        artikel: '25'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '1'
  - number: '22.4'
    text: |-
      Het tweede lid is van overeenkomstige toepassing op een persoon die nog niet gedurende een jaar als ingezetene is
      ingeschreven en op wie [artikel 21, eerste lid, aanhef en onderdeel c, d of e][ref1], van toepassing wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0034306#Artikel21
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0034306
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: '23.1'
    text: |-
      De in [artikel 2.7, eerste lid, onderdeel a, van de wet][ref1] bedoelde algemene gegevens over ingezetenen zijn als
      zodanig nader bepaald in de tabel die als [bijlage 1][ref2] bij dit besluit is gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0034306
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0034306
  - number: '23.2'
    text: |-
      De in de tabel in [bijlage 1][ref1] bij dit besluit bedoelde gegevens in verband met het verblijfsrecht van de
      vreemdeling en de in [artikel 2.7, eerste lid, onderdeel b, van de wet][ref2] genoemde administratieve gegevens
      worden nader bepaald bij regeling van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0034306
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0034306
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
  - number: '24.1'
    text: |-
      Het college van burgemeester en wethouders zendt een afschrift van een beslissing om op grond van
      [artikel 2.10, tweede lid, van de wet][ref1] gegevens over een huwelijk, een geregistreerd partnerschap, een
      erkenning, of de geboortedatum van de betrokken persoon niet in de basisregistratie op te nemen, aan de korpschef
      als bedoeld in de [Vreemdelingenwet 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011823
  - number: '24.2'
    text: |-
      Het eerste lid is slechts van toepassing indien de in dat lid bedoelde gegevens betrekking hebben op een
      vreemdeling als bedoeld in de [Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 24a.1
    text: |-
      Onze Minister van Justitie en Veiligheid doet een mededeling aan het college van burgemeester en wethouders van de
      betrokken gemeente inzake het niet van toepassing zijn van [artikel 2.6 van de wet][ref1], als hij de identiteit
      van een vreemdeling als bedoeld in [artikel 21, eerste lid, onder f][ref2], deugdelijk heeft vastgesteld, de
      vreemdeling rechtmatig in Nederland verblijft en naar redelijke verwachting gedurende een half jaar ten minste twee
      derde van de tijd in Nederland verblijf zal houden.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0034306#Artikel21
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0034306
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: 24a.2
    text: |-
      In afwijking van het eerste lid doet Onze Minister van Justitie en Veiligheid geen mededeling als bedoeld in het
      vorige lid omtrent de vreemdelingen, bedoeld in de [artikelen 30][ref1], [30a, eerste lid, onder a][ref2], of
      [30b, eerste lid, onder b, van de Vreemdelingenwet 2000][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel30a
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel30b
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 30a
      - id: ref3
        bwb_id: BWBR0011823
        artikel: 30b
  - number: '25.1'
    text: |-
      Onze Minister van Buitenlandse Zaken doet van een aanwijzing als bedoeld in
      [artikel 21, eerste lid, onderdeel a][ref1], of van de beëindiging daarvan mededeling aan het college van
      burgemeester en wethouders van de betrokken gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0034306#Artikel21
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0034306
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: '25.2'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot de wijze waarop de mededelingen
      worden gedaan.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel25
  - number: '26'
    text: |-
      Bij het voldoen aan de verplichtingen, bedoeld in [hoofdstuk 2, afdeling 1, paragraaf 4][ref1] en
      [paragraaf 4a, van de wet][ref2], wordt door een overheidsorgaan, indien bekend, het burgerservicenummer vermeld
      van de persoon of personen ten aanzien van wie gegevens, bescheiden of inlichtingen worden verstrekt of met
      betrekking tot wie mededelingen worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Paragraaf4
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Paragraaf4a
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0033715
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0033715
        paragraaf: 4a
  - number: '27.1'
    text: |-
      Een bestuursorgaan als bedoeld in [artikel 2.34, eerste lid, van de wet][ref1], alsmede een bestuursorgaan dat
      op grond van artikel 2.34, tweede of vierde lid, van de wet is aangewezen, doet mededeling aan het college van
      burgemeester en wethouders van door hem geconstateerde afwijkingen tussen enerzijds gegevens die hij verstrekt
      heeft gekregen uit de basisregistratie of waarvan de verstrekking achterwege is gebleven en anderzijds gegevens
      waarvan hij op andere wijze kennis heeft gekregen, alsmede van de grond van zijn gerede twijfel.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
  - number: '27.2'
    text: |-
      Onze Minister kan nadere regels stellen omtrent de gevallen waarin en regels over de wijze waarop de mededeling
      wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel27
  - number: '28.1'
    text: |-
      Het college van burgemeester en wethouders stelt het bestuursorgaan dat een mededeling als bedoeld in
      [artikel 2.34 van de wet][ref1] heeft gedaan, zo spoedig mogelijk doch uiterlijk binnen vijf werkdagen na de
      ontvangst van de mededeling ervan in kennis of deze mededeling aanleiding is geweest voor verbetering, aanvulling
      of verwijdering van gegevens in de basisregistratie, dan wel dat bij het gegeven een aantekening als bedoeld in
      [artikel 2.26 van de wet][ref2] is geplaatst in verband met het doen van een onderzoek naar de onjuistheid van
      het gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
  - number: '28.2'
    text: |-
      Indien het college van burgemeester en wethouders besluit een aantekening als bedoeld in
      [artikel 2.26 van de wet][ref1] te plaatsen, stelt het college het bestuursorgaan dat de mededeling heeft gedaan na
      afloop van het onderzoek ervan in kennis of naar aanleiding van de mededeling gegevens in de basisregistratie zijn
      verbeterd, aangevuld of verwijderd.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
  - number: 28a
    text: |-
      De analysemethoden, bedoeld in [artikel 2.37c, vierde lid, van de wet][ref1] zien op:


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
  - number: 28a.a
    text: |-
      de analyse van mededelingen als bedoeld in [artikel 2.37b, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
  - number: 28a.b
    text: de analyse aan de hand van profielen;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28a
  - number: 28a.c
    text: een onderzoek naar patronen.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28a
  - number: 28b.1
    text: |-
      Een bestuursorgaan als bedoeld in [artikel 2.37b, eerste lid, van de wet][ref1] alsmede een derde als bedoeld in
      artikel 2.37b, derde lid, van de wet doet mededeling aan Onze Minister van door hem geconstateerde afwijkingen
      tussen enerzijds gegevens die hij verstrekt heeft gekregen uit de basisregistratie of waarvan de verstrekking
      achterwege is gebleven en anderzijds gegevens waarvan hij op andere wijze kennis heeft gekregen, alsmede de grond
      van zijn gerede twijfel.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
  - number: 28b.2
    text: |-
      De bestuursorganen, bedoeld in het eerste lid, kunnen aan Onze Minister de volgende andere categorieën gegevens
      verstrekken:
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28b
  - number: 28b.2.a
    text: administratieve gegevens;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28b
  - number: 28b.2.b
    text: gegevens over de samenstelling van de bewoning op een adres;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28b
  - number: 28b.2.c
    text: gegevens over de gezamenlijke huishouding op een adres;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28b
  - number: 28b.2.d
    text: gegevens over de rechtmatigheid van de bewoning op een adres.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28b
  - number: 28b.3
    text: Bij regeling van Onze Minister worden de gegevens, bedoeld in het tweede lid, nader bepaald.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28b
  - number: 28b.4
    text: Onze Minister kan nadere regels stellen over de wijze waarop de mededeling wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28b
  - number: 28c.1
    text: |-
      Een profiel als bedoeld in [artikel 2.37c, tweede lid, van de wet][ref1] bestaat uit een of meerdere
      selectiefactoren waarmee door Onze Minister uit de gegevens, bedoeld in artikel 2.37c, eerste lid, van de
      wet, gegevens betreffende het adres van een persoon worden geselecteerd voor een mededeling als bedoeld in
      [artikel 2.37d, eerste lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28c
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
  - number: 28c.2
    text: |-
      De selectiefactoren, bedoeld in het eerste lid, geven in onderlinge samenhang aanleiding tot gerede twijfel bij
      Onze Minister over de juistheid van de gegevens betreffende het adres van een persoon.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28c
  - number: 28c.3
    text: Bij regeling van Onze Minister wordt bepaald welke selectiefactoren een profiel vormen.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28c
  - number: 28d.1
    text: |-
      Een onderzoek naar patronen als bedoeld in [artikel 2.37c, tweede lid, van de wet][ref1] draagt bij aan de
      totstandkoming van een profiel als bedoeld in [artikel 28c][ref2]. Het onderzoek leidt niet tot een mededeling als
      bedoeld in [artikel 2.37d, eerste lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0034306#Artikel28c
      [ref3]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28d
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0034306
        artikel: 28c
        hoofdstuk: '2'
        paragraaf: 3a
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0033715
        artikel: '2'
  - number: 28d.2
    text: |-
      Een onderzoek als bedoeld in het eerste lid wordt niet gestart dan nadat daarover door Onze Minister
      overleg is gepleegd met representatieve vertegenwoordigingen van de gemeenten en de krachtens
      [artikel 2.37b, eerste lid, van de wet][ref1] aangewezen bestuursorganen, waarbij Onze Minister in ieder geval
      inzicht geeft in het beoogde doel van het onderzoek en de daarbij te verwerken categorieën gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28d
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
  - number: 28e.1
    text: |-
      Onze minister verwerkt bij de analyse van de mededeling als bedoeld in [artikel 28b, eerste lid][ref1], bij de
      toepassing van profielen als bedoeld in [artikel 28c, eerste lid][ref2] en het onderzoek naar patronen als bedoeld
      in [artikel 28d, eerste lid][ref3], de volgende categorieën gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0034306#Artikel28b
      [ref2]: https://wetten.overheid.nl/BWBR0034306#Artikel28c
      [ref3]: https://wetten.overheid.nl/BWBR0034306#Artikel28d
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28e
    references:
      - id: ref1
        bwb_id: BWBR0034306
        artikel: 28b
        hoofdstuk: '2'
        paragraaf: 3a
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0034306
        artikel: 28c
        hoofdstuk: '2'
        paragraaf: 3a
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0034306
        artikel: 28d
        hoofdstuk: '2'
        paragraaf: 3a
        afdeling: '1'
  - number: 28e.1.a
    text: |-
      Algemene gegevens als bedoeld in [artikel 2.7, eerste lid, onderdeel a, van de wet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28e
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
  - number: 28e.1.a.1
    text: gegevens over de burgerlijke staat;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28e
  - number: 28e.1.a.2
    text: |-
      gegevens over de bijhoudingsgemeente en het adres in die gemeente alsmede over het verblijf in Nederland en het
      vertrek uit Nederland;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28e
  - number: 28e.1.a.3
    text: gegevens over het woonadres van de niet-ingezetene;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28e
  - number: 28e.1.a.4
    text: gegevens over het tijdelijk verblijfsadres;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28e
  - number: 28e.1.a.5
    text: gegevens over het burgerservicenummer van de ingeschrevene;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28e
  - number: 28e.1.a.6
    text: |-
      gegevens over de burgerservicenummers van de ouders, de echtgenoot dan wel de geregistreerde partner, de eerdere
      echtgenoten of eerdere geregistreerde partners en de kinderen;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28e
  - number: 28e.1.a.7
    text: |-
      gegevens over het gebruik door de ingeschrevene van de geslachtsnaam van de echtgenoot, de geregistreerde partner,
      de eerdere echtgenoot of de eerdere geregistreerde partner.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28e
  - number: 28e.1.b
    text: |-
      Administratieve gegevens als bedoeld in [artikel 2.7, eerste lid, onderdeel b][ref1], en
      [artikel 2.69, eerste lid, onderdeel b, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28e
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
  - number: 28e.1.c
    text: |-
      Andere gegevens als bedoeld [artikel 2.37c, eerste lid, onderdeel c, van de wet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28e
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
  - number: 28e.1.c.1
    text: gegevens over de samenstelling van de bewoning op een adres;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28e
  - number: 28e.1.c.2
    text: gegevens over de gezamenlijke huishouding op een adres;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28e
  - number: 28e.1.c.3
    text: gegevens over de rechtmatigheid van de bewoning op een adres;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28e
  - number: 28e.1.c.4
    text: gegevens over het water- en energieverbruik op een adres;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28e
  - number: 28e.1.c.5
    text: gegevens over de resultaten van adresonderzoek;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28e
  - number: 28e.1.c.6
    text: gegevens over het gebruik en de bestemming van een pand of verblijfsobject;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28e
  - number: 28e.1.c.7
    text: kadastrale gegevens als bedoeld in artikel 48, tweede lid, Kadasterwet.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28e
  - number: 28e.2
    text: |-
      Bij regeling van Onze Minister worden de algemene gegevens bedoeld in het eerste lid, onderdeel a, de
      administratieve gegevens bedoeld in het eerste lid, onderdeel b, en de andere gegevens bedoeld in het eerste lid,
      onderdeel c, nader bepaald.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28e
  - number: 28f
    text: |-
      Een mededeling als bedoeld in [artikel 2.37d, eerste lid, van de wet][ref1] bevat de volgende categorieën gegevens
      van alle personen die zijn ingeschreven op het adres waar de mededeling op ziet:


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28f
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
  - number: 28f.a
    text: gegevens over de bijhoudingsgemeente en het adres in die gemeente;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28f
  - number: 28f.b
    text: gegevens over de burgerlijke staat waar het betreft de naam; en
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28f
  - number: 28f.c
    text: gegevens over het burgerservicenummer van de ingeschrevene.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28f
  - number: 28g.1
    text: |-
      De termijn, bedoeld in [artikel 2.37e, eerste lid, eerste volzin, van de wet][ref1] is vier weken.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28g
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
  - number: 28g.2
    text: |-
      De termijn, bedoeld in [artikel 2.37e, eerste lid, tweede volzin, van de wet][ref1] is zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28g
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
  - number: 28g.3
    text: |-
      Een kennisgeving van de resultaten als bedoeld in [artikel 2.37e, eerste lid, tweede volzin, van de wet][ref1]
      bevat de volgende categorieën gegevens van alle personen die ingeschreven zijn op het adres waar de kennisgeving
      op ziet:


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28g
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
  - number: 28g.3.a
    text: gegevens over de bijhoudingsgemeente en het adres in die gemeente;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28g
  - number: 28g.3.b
    text: gegevens over de burgerlijke staat waar het betreft de naam;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28g
  - number: 28g.3.c
    text: gegevens over het burgerservicenummer van de ingeschrevene; en
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28g
  - number: 28g.3.d
    text: |-
      gegevens over het resultaat van het onderzoek, bedoeld in [artikel 2.37a, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28g
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
  - number: 28g.4
    text: |-
      Bij regeling van Onze Minister worden nadere regels gesteld omtrent de wijze waarop de verstrekking van gegevens,
      bedoeld in de artikelen [2.37d][ref1] en [2.37e van de wet][ref2], plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel28g
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
  - number: '29.1'
    text: |-
      Niet verplicht tot het doen van aangifte van vertrek is de ingezetene die vanaf het tijdstip van het vertrek uit
      Nederland naar redelijke verwachting niet langer dan twee jaar buiten Nederland verblijft en die gedurende zijn
      verblijf buiten Nederland beroepshalve vaart aan boord van een schip dat in Nederland de thuishaven heeft.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel29
  - number: '29.2'
    text: |-
      Het eerste lid is alleen van toepassing indien de betrokkene gedurende zijn verblijf buiten Nederland beschikt over
      een adres in Nederland.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel29
  - number: '30.1'
    text: |-
      De gevallen waarin de verplichtingen, vermeld in [artikel 2.38 van de wet][ref1], kunnen worden vervuld door de in
      [artikel 2.49, eerste lid, van de wet][ref2] bedoelde personen zijn de gevallen waarin de betrokkene zelf niet in
      staat is om in persoon te verschijnen vanwege:


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
  - number: 30.1.a
    text: |-
      de toestand van zijn gezondheid, zo nodig onder overlegging van een schriftelijke verklaring ter zake van een
      behandelend arts, of
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel30
  - number: 30.1.b
    text: verblijf in een penitentiaire instelling.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel30
  - number: '30.2'
    text: |-
      In de gevallen, bedoeld in het eerste lid, is de betrokkene, in afwijking van
      [artikel 2.38, eerste lid, van de wet][ref1], niet verplicht zich in persoon te melden bij het college van
      burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
  - number: '30.3'
    text: |-
      [Artikel 2.49, tweede lid, van de wet][ref1], is niet van toepassing op de in het eerste lid bedoelde gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
  - number: '30.4'
    text: |-
      De gevallen, bedoeld in het eerste lid, aanhef en onderdeel a, zijn tevens de in
      [artikel 2.49, vierde lid, van de wet][ref1] bedoelde gevallen. Het tweede en derde lid zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
  - number: '30.5'
    text: |-
      De gevallen, bedoeld in het eerste lid, zijn tevens de in [artikel 2.43, vijfde lid, van de wet][ref1] bedoelde
      gevallen, voor zover het betreft het vierde lid van dat artikel. Het tweede lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
  - number: '31'
    text: |-
      De volgende bestuursorganen zijn wat betreft de genoemde taken bevoegd om Onze Minister een
      verzoek als bedoeld in [artikel 2.68, eerste lid, van de wet][ref1] of een opgave als bedoeld in
      [artikel 2.70, derde lid, onderdeel a, van de wet][ref2] te doen:


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
  - number: 31.a
    text: 'de volgende organen binnen de Belastingdienst:'
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel31
  - number: 31.a.1°
    text: |-
      de directeur, de inspecteur en de ontvanger, bedoeld in
      [artikel 2, derde lid, onderdeel b, van de Algemene wet inzake rijksbelastingen][ref1],
      [artikel 2, eerste lid, onderdeel i, van de Invorderingswet 1990][ref2] en
      [artikel 1:3, eerste lid, onderdeel c, van de Algemene douanewet][ref3], wat betreft: - de heffing van
      rijksbelastingen op grond van de [Algemene wet inzake rijksbelastingen][ref4] en van andere heffingen, premies of
      bijdragen van het Rijk voor zover bij of krachtens de wet opgedragen;
        - de invordering van belastingen, andere heffingen van het Rijk en tegemoetkomingen op grond van de
      [Invorderingswet 1990][ref5];
        - de heffing en invordering van invoerrechten en accijnzen op grond van de [Algemene douanewet][ref6];
        - de toepassing van de [Algemene douanewet][ref7] met betrekking tot de taken, voortvloeiende uit het bepaalde in
      [artikel 1:1 van de Algemene douanewet][ref8];


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0023746#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0002320
      [ref5]: https://wetten.overheid.nl/BWBR0004770
      [ref6]: https://wetten.overheid.nl/BWBR0023746
      [ref7]: https://wetten.overheid.nl/BWBR0023746
      [ref8]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0023746
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0002320
      - id: ref5
        bwb_id: BWBR0004770
      - id: ref6
        bwb_id: BWBR0023746
      - id: ref7
        bwb_id: BWBR0023746
      - id: ref8
        bwb_id: BWBR0023746
        artikel: '1'
  - number: 31.a.2°
    text: |-
      de Belastingdienst/Toeslagen, bedoeld in
      [artikel 11, tweede lid, van de Algemene wet inkomensafhankelijke regelingen][ref1] en de ontvanger, bedoeld
      in [artikel 2, eerste lid, onderdeel i, van de Invorderingswet 1990][ref2], wat betreft de uitkering en
      terugvordering van tegemoetkomingen op grond van de [Algemene wet inkomensafhankelijke regelingen][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0018472
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0018472
  - number: 31.b
    text: |-
      de Sociale Verzekeringsbank wat betreft de taken op grond van
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] met uitzondering van de taken op
      grond van [artikel 35 van die wet][ref2] ten aanzien van verzekerden en bij de verzekerden behorende personen in
      de verzekerdenadministratie;


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel35
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '35'
  - number: 31.c
    text: |-
      het Uitvoeringsinstituut werknemersverzekeringen wat betreft de taken op grond van
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] met uitzondering van de taken op
      grond van [artikel 33 van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel33
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '33'
  - number: 31.d
    text: |-
      het CAK wat betreft de taken op grond van [artikel 69 van de Zorgverzekeringswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel69
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '69'
  - number: 31.f
    text: 'Onze Minister van Buitenlandse Zaken wat betreft:'
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel31
  - number: 31.f.1°
    text: |-
      de taken omtrent personen die in Nederland voorrechten en immuniteiten genieten op grond van het op 18 april 1961
      te Wenen tot stand gekomen Verdrag van Wenen inzake diplomatiek verkeer met twee protocollen (Trb. 1962, 101), het
      op 24 april 1963 te Wenen tot stand gekomen Verdrag van Wenen inzake consulaire betrekkingen, met twee protocollen
      (Trb. 1965, 40), zetelovereenkomsten met in Nederland gevestigde internationale organisaties, Europese regelgeving
      of volkenrechtelijk gebruik; en
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel31
  - number: 31.f.2°
    text: |-
      de taken betreffende de aanvraag, verstrekking en uitreiking van nationale paspoorten, nooddocumenten, tweede
      paspoorten en Nederlandse identiteitskaarten op grond van onderscheidenlijk de [artikelen 26][ref1], [40][ref2] en
      [42 van de Paspoortwet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0005212#Artikel42
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0005212
        artikel: '40'
      - id: ref3
        bwb_id: BWBR0005212
        artikel: '42'
  - number: 31.g
    text: |-
      Onze Minister van Justitie en Veiligheid wat betreft de taken op
      grond van [artikel 14, eerste tot en met vierde lid][ref1], en
      [artikel 15, eerste lid, aanhef en onderdelen d en e, van de Rijkswet op het Nederlanderschap][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003738#Artikel15
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0003738
        artikel: '15'
  - number: 31.h
    text: |-
      Onze Minister van Onderwijs, Cultuur en Wetenschap wat betreft de taken op grond van
      [artikel 3.19 van de Wet studiefinanciering 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
  - number: '32.1'
    text: |-
      De in [artikel 2.69, eerste lid, onderdeel a, van de wet][ref1] bedoelde algemene gegevens over niet-ingezetenen
      zijn als zodanig nader bepaald in de tabel die als [bijlage 1][ref2] bij dit besluit is gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0034306
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0034306
  - number: '32.2'
    text: |-
      De in de tabel in [bijlage 1][ref1] bij dit besluit bedoelde gegevens in verband met het verblijfsrecht van de
      vreemdeling en de in [artikel 2.69, eerste lid, onderdeel b, van de wet][ref2] genoemde administratieve gegevens
      worden nader bepaald bij regeling van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0034306
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0034306
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
  - number: '33.1'
    text: |-
      Onze Minister neemt bij een inschrijving als bedoeld in [artikel 2.67 van de wet][ref1] ten minste de volgende
      gegevens over de betrokkene op:


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
  - number: 33.1.a
    text: |-
      over de burgerlijke staat: de geslachtsnaam, de voornamen, de geboortedatum, de geboorteplaats, het geboorteland of
      -gebied en het geslacht;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel33
  - number: 33.1.b
    text: |-
      over de nationaliteit: de nationaliteit of nationaliteiten, dan wel een aanduiding dat de betrokkene geen
      nationaliteit bezit, of een aanduiding dat de nationaliteit van de betrokkene niet kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel33
  - number: '33.2'
    text: |-
      Onze Minister neemt daarnaast de data ingang en beëindiging rechtsgeldigheid van de in het eerste lid bedoelde
      gegevens op voor zover deze bij de inschrijving kunnen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel33
  - number: '33.3'
    text: |-
      Onze Minister neemt daarnaast andere algemene gegevens op voor zover de betrokkene daarom verzoekt en de gegevens
      bij de inschrijving kunnen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel33
  - number: 33a
    text: |-
      De gevallen, bedoeld in [artikel 2.67, derde lid, van de wet][ref1], zijn de gevallen waarin de betrokkene niet in
      staat is om in persoon te verschijnen vanwege de toestand van zijn gezondheid. Zo nodig kan de overlegging worden
      verlangd van een schriftelijke verklaring ter zake van een behandelend arts.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
  - number: '34.1'
    text: |-
      Een aangewezen bestuursorgaan legt bij een verzoek om inschrijving als bedoeld in [artikel 2.68 van de wet][ref1]
      ten minste een opgave over van de volgende gegevens over de burgerlijke staat van de betrokkene: de geslachtsnaam,
      de voornamen, de geboortedatum en het geslacht.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
  - number: '34.2'
    text: |-
      Het aangewezen bestuursorgaan legt daarnaast een opgave over van de data ingang en beëindiging rechtsgeldigheid van
      de in het eerste lid bedoelde gegevens voor zover deze bij het verzoek om inschrijving kunnen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel34
  - number: '34.3'
    text: |-
      Het aangewezen bestuursorgaan kan daarnaast een opgave overleggen van andere algemene gegevens voor zover de
      gegevens bij het verzoek om inschrijving kunnen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel34
  - number: '34.4'
    text: |-
      Een aangewezen bestuursorgaan legt bij een opgave als bedoeld in [artikel 2.70, derde lid, van de wet][ref1],
      in andere gevallen dan bedoeld in het eerste lid, ten minste de volgende gegevens over de betrokkene over: het
      burgerservicenummer en de gegevens die voor bijhouding in aanmerking komen.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
  - number: '35'
    text: |-
      Degene die in persoon verschijnt in verband met een verzoek als bedoeld in [artikel 2.79 van de wet][ref1], legt
      daarbij ten minste over:


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
  - number: 35.a
    text: |-
      een op hem betrekking hebbend document als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 35.b
    text: een buitenlands paspoort of ander reisdocument dan wel een buitenlandse nationale identiteitskaart.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel35
  - number: 35a
    text: |-
      Het college van burgemeester en wethouders van de voormalige bijhoudingsgemeente neemt met betrekking tot een
      ingeschrevene die geen ingezetene meer is binnen vier weken na diens schriftelijk verzoek daartoe kosteloos op de
      persoonslijst van de ingeschrevene de gegevens op als bedoeld in [artikel 2.25 van de wet][ref1] waaruit blijkt dat
      deze geen gebruik maakt van de geslachtsnaam van de echtgenoot, de eerdere echtgenoot, de geregistreerde partner of
      de eerdere geregistreerde partner.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
  - number: 35b.1
    text: |-
      [Artikel 2.56a van de wet][ref1] is van overeenkomstige toepassing op de ingeschrevene die geen ingezetene meer is,
      ouder is van een kind als bedoeld in [artikel 2.7, eerste lid, onderdeel a, onder 2°, van de wet][ref2] en op het
      moment van de geboorte van het kind als ingezetene was ingeschreven in het persoonsregister, bedoeld in het Besluit
      bevolkingsboekhouding.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
  - number: 35b.2
    text: |-
      Het college van burgemeester en wethouders van de voormalige bijhoudingsgemeente is verantwoordelijk voor de
      bijhouding van de gegevens over het kind op de persoonslijst van de ouder, bedoeld in het eerste lid, op grond van
      het verzoek, bedoeld in [artikel 2.56a van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
  - number: '36'
    text: |-
      Een persoon die, in het kader van een aan Onze Minister gericht verzoek als bedoeld in
      [artikel 2.81, derde lid, van de wet][ref1] in samenhang met [artikel 2.55 van de wet][ref2], vraagt om
      verstrekking van een kopie van de persoonsgegevens, bedoeld in artikel 15, derde lid, van de verordening, waarvoor
      kosten in rekening kunnen worden gebracht op grond van de verordening, is een recht verschuldigd dat gelijk is
      aan het recht dat het college van burgemeester en wethouders van de gemeente waar de inschrijfvoorziening is
      ondergebracht heft op grond van [artikel 229 van de Gemeentewet][ref3] voor het uitvoeren van eenzelfde verzoek dat
      aan het college is gericht op grond van artikel 2.81, vierde lid, van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel229
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '229'
  - number: '37.1'
    text: |-
      De in [artikel 3.1, tweede lid, van de wet][ref1] bedoelde systematische verstrekking van gegevens aan
      overheidsorganen betreft de volgende wijzen van verstrekking overeenkomstig de systeembeschrijving:


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
  - number: 37.1.a
    text: |-
      spontane verstrekking, zijnde de eenmalige verstrekking van de in een autorisatiebesluit vermelde gegevens over
      de door het overheidsorgaan aangegeven personen die deel uitmaken van de in het autorisatiebesluit aangegeven
      categorie van personen, of over personen over wie de in de basisregistratie opgenomen gegevens voldoen aan de in
      het autorisatiebesluit genoemde voorwaarden, gevolgd door de verstrekking van de wijzigingen die zich voordoen in
      deze gegevens;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel37
  - number: 37.1.b
    text: |-
      selectie- en conditionele verstrekking, zijnde de eenmalige of periodieke verstrekking van de in een
      autorisatiebesluit opgenomen gegevens over personen over wie de in de basisregistratie vermelde gegevens voldoen
      aan de in het autorisatiebesluit genoemde voorwaarden;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel37
  - number: 37.1.c
    text: |-
      verstrekking op basis van een zoekvraag, zijnde een verstrekking op verzoek van het overheidsorgaan, van
      gegevens die deel uitmaken van de in een autorisatiebesluit vermelde gegevens over, per verzoek, een in het
      autorisatiebesluit gemaximeerd aantal personen die deel uitmaken van de in het autorisatiebesluit bepaalde
      categorie van personen en over wie de gegevens voldoen aan de gegevens die in het verzoek van het overheidsorgaan
      zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel37
  - number: '37.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de systematische verstrekking van gegevens aan derden als
      bedoeld in [artikel 3.3 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
  - number: '38'
    text: |-
      Bij de indiening van een verzoek tot het nemen van een autorisatiebesluit maakt een overheidsorgaan of een derde
      gebruik van een door Onze Minister vastgesteld aanvraagformulier.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel38
  - number: '39'
    text: |-
      De door derden verrichte werkzaamheden met een gewichtig maatschappelijk belang, bedoeld in
      [artikel 3.3 van de wet][ref1], de categorieën van derden die in verband met die werkzaamheden in aanmerking komen
      voor de systematische verstrekking van gegevens, de beperkingen ten aanzien van de gegevens die kunnen worden
      verstrekt en de bepaling of [artikel 3.21 van de wet][ref2] op de verstrekking van toepassing is, zijn aangeduid in
      de tabel die als [bijlage 4][ref3] bij dit besluit is gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0034306
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0034306
  - number: '40'
    text: |-
      Het college van burgemeester en wethouders weigert een verzoek tot verstrekking van gegevens als bedoeld
      in [artikel 3.5][ref1] of [artikel 3.6 van de wet][ref2], indien het aantal verstrekkingen per jaar aan
      het overheidsorgaan of de derde naar redelijke verwachting van het college meer zal zijn dan vijfduizend
      verstrekkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '3'
  - number: '41'
    text: |-
      De door derden verrichte werkzaamheden met een gewichtig maatschappelijk belang, bedoeld in
      [artikel 3.6 van de wet][ref1], de categorieën van derden die in verband met die werkzaamheden in aanmerking komen
      voor de verstrekking van gegevens, de beperkingen ten aanzien van de gegevens die kunnen worden verstrekt en de
      bepaling of [artikel 3.21 van de wet][ref2] op de verstrekking van toepassing is, zijn aangeduid in de tabel die
      als [bijlage 5][ref3] bij dit besluit is gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0034306
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0034306
  - number: '42'
    text: |-
      Ter uitvoering van [artikel 3.11 van de wet][ref1] wordt van systematische verstrekking van gegevens geen
      aantekening gehouden voor zover de verstrekking noodzakelijk is voor:


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
  - number: 42.a
    text: |-
      de uitvoering van de taken van de Algemene Inlichtingen- en Veiligheidsdienst op grond van
      [artikel 8, tweede lid, van de Wet op de inlichtingen- en veiligheidsdiensten 2017][ref1], met inbegrip van
      werkzaamheden die ten behoeve van de Algemene Inlichtingen- en Veiligheidsdienst worden verricht op grond van
      [artikel 91 van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel91
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '91'
  - number: 42.b
    text: |-
      de uitvoering van de taken van de Militaire Inlichtingen- en Veiligheidsdienst op grond van
      [artikel 10, tweede lid, van de Wet op de inlichtingen- en veiligheidsdiensten 2017][ref1], met inbegrip van
      werkzaamheden die ten behoeve van de Militaire Inlichtingen- en Veiligheidsdienst worden verricht op grond van
      [artikel 92 van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel92
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '92'
  - number: 42.c
    text: |-
      de uitvoering van taken door de politie op grond van [artikel 3 van de Politiewet 2012][ref1] of door de
      Koninklijke marechaussee op grond van [artikel 4 van die wet][ref2], die verband houden met de bestrijding van
      zware of georganiseerde criminaliteit;


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel4
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '4'
  - number: 42.d
    text: |-
      de uitvoering van taken door de rijksrecherche op grond van [artikel 49 van de Politiewet 2012][ref1] die verband
      houden met onderzoeken in opdracht van het College van Procureurs-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel49
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '49'
  - number: '43.1'
    text: |-
      Indien door een ingezetene aangifte is gedaan van vertrek naar Aruba, Curaçao, Sint Maarten of een van de openbare
      lichamen, verstrekt Onze Minister de gegevens over de betrokkene die daartoe zijn aangewezen in de tabel die
      als [bijlage 6][ref1] bij dit besluit is gevoegd aan de desbetreffende verantwoordelijke voor de verwerking van
      gegevens in de basisadministratie van Aruba, Curaçao, Sint Maarten of het desbetreffende openbaar lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0034306
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0034306
  - number: '43.2'
    text: |-
      Onze Minister verstrekt op verzoek van een verantwoordelijke voor de verwerking van gegevens in de
      basisadministratie van Aruba, Curaçao, Sint Maarten of een openbaar lichaam aan deze gegevens, voor zover deze
      gegevens noodzakelijk zijn in verband met de bijhouding van de basisadministratie van de verantwoordelijke. De
      verstrekking kan uitsluitend betrekking hebben op de gegevens over de betrokkene die daartoe zijn aangewezen in de
      tabel die als [bijlage 6][ref1] bij dit besluit is gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0034306
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0034306
  - number: '43.3'
    text: |-
      Onze Minister kan op verzoek van een verantwoordelijke voor de verwerking van gegevens in de basisadministratie
      van Aruba, Curaçao, Sint Maarten of een van de openbare lichamen aan hem gegevens verstrekken, ter bevordering
      van de afstemming van de basisadministratie van de verantwoordelijke op de basisregistratie. De verstrekking kan
      uitsluitend betrekking hebben op de gegevens over de betrokkene die daartoe zijn aangewezen in de tabel die als
      [bijlage 6][ref1] bij dit besluit is gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0034306
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0034306
  - number: 43a.1
    text: |-
      Onze Minister verstrekt op verzoek van een in [bijlage 7][ref1] bij dit besluit aangewezen autoriteit in een van
      de openbare lichamen, Aruba, Curaçao of Sint Maarten aan deze gegevens uit de basisregistratie, voor zover deze
      gegevens noodzakelijk zijn voor de uitvoering van de in bijlage 7 bij dit besluit aangewezen bij of krachtens een
      rijkswet aan de desbetreffende autoriteit opgedragen taak.


      [ref1]: https://wetten.overheid.nl/BWBR0034306
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0034306
  - number: 43a.2
    text: |-
      Onze Minister verstrekt op verzoek van autoriteiten in een van de openbare lichamen, Aruba, Curaçao of Sint Maarten
      aan deze gegevens uit de basisregistratie, voor zover deze gegevens noodzakelijk zijn voor de uitvoering van de in
      [bijlage 7][ref1] bij dit besluit aangewezen andere taken dan bedoeld in het eerste lid waarmee zij op grond van de
      voor hen geldende wetgeving zijn belast.


      [ref1]: https://wetten.overheid.nl/BWBR0034306
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0034306
  - number: 43a.3
    text: |-
      Verstrekking als bedoeld in het eerste en tweede lid betreft systematische verstrekking van gegevens.
      [Hoofdstuk 1, paragraaf 4][ref1], is van overeenkomstige toepassing op de vaststelling van de kosten in verband met
      die verstrekking en de wijze waarop deze kosten worden vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0034306#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0034306
        hoofdstuk: '1'
        paragraaf: '4'
  - number: '44.1'
    text: |-
      [Artikel 3.13 van de wet][ref1] is van toepassing op een verstrekking uit de basisregistratie voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
  - number: 44.1.a
    text: |-
      het verzoek daartoe is gedaan door een instelling als bedoeld in
      [artikel 1.2 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], een onderzoeksafdeling van een
      overheidsorgaan of een onderzoeksbureau;


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 44.1.b
    text: het onderzoek een algemeen belang dient;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel44
  - number: 44.1.c
    text: de verwerking voor het betreffende onderzoek noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel44
  - number: 44.1.d
    text: |-
      de verzoeker heeft aangetoond dat de nodige voorzieningen zijn getroffen teneinde te verzekeren dat de verdere
      verwerking van de verstrekte gegevens uitsluitend geschiedt ten behoeve van het onderzoek en dat ook overigens is
      voorzien in zodanige waarborgen dat de persoonlijke levenssfeer van de betrokkene niet onevenredig wordt geschaad,
      en
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel44
  - number: 44.1.e
    text: |-
      de gegevens slechts in geanonimiseerde vorm aan anderen beschikbaar worden gesteld, tenzij de ingeschrevene
      uitdrukkelijk met de voorgenomen openbaarmaking van de hem betreffende gegevens heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel44
  - number: '44.2'
    text: De verstrekking geschiedt door Onze Minister of door een college van burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel44
  - number: '44.3'
    text: |-
      Verstrekking door Onze Minister geschiedt overeenkomstig hetgeen bij of krachtens de wet is bepaald ten aanzien van
      systematische verstrekkingen, met uitzondering van [artikel 3.2, achtste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
  - number: '44.4'
    text: 'Onze Minister maakt slechts gebruik van zijn bevoegdheid, bedoeld in het tweede lid, voor zover:'
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel44
  - number: 44.4.a
    text: |-
      de verzoeker heeft aangetoond dat het voor een goede uitvoering van het onderzoek noodzakelijk is dat verstrekking
      plaatsvindt overeenkomstig hetgeen krachtens de [artikelen 3.1][ref1] en [3.2 van de wet][ref2] is bepaald;


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '3'
  - number: 44.4.b
    text: aan de voorwaarden, genoemd in het eerste lid, is voldaan, en
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel44
  - number: 44.4.c
    text: de Autoriteit persoonsgegevens over het verzoek is gehoord.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel44
  - number: '45.1'
    text: |-
      Een overheidsorgaan of een derde die Onze Minister een verzoek doet om informatie ter beschikking te stellen die is
      verkregen door bewerking van gegevens uit de basisregistratie, verschaft bij dat verzoek:
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel45
  - number: 45.1.a
    text: inlichtingen over het doel waarvoor de informatie wordt gevraagd;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel45
  - number: 45.1.b
    text: een precieze beschrijving van de informatie die wordt gevraagd;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel45
  - number: 45.1.c
    text: |-
      een aanduiding van het tijdstip waarop de informatie nodig is en de reden waarom de informatie op dat tijdstip
      nodig is.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel45
  - number: '45.2'
    text: |-
      Het overheidsorgaan of de derde geeft aan waarom de informatie niet of niet tijdig op een andere manier kan worden
      verkregen.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel45
  - number: '45.3'
    text: 'Onze Minister kan een verzoek in ieder geval weigeren voor zover:'
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel45
  - number: 45.3.a
    text: de verstrekking overwegend commercieel gebruik tot doel heeft;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel45
  - number: 45.3.b
    text: de behandeling van het verzoek of de verstrekking zodanig is dat het regulier beheer in de knel komt;
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel45
  - number: 45.3.c
    text: de informatie niet tijdig ter beschikking kan worden gesteld, of
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel45
  - number: 45.3.d
    text: de informatie tijdig op een andere manier kan worden verkregen.
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel45
  - number: '46'
    text: |-
      Het college van burgemeester en wethouders of Onze Minister voldoet in ieder geval niet aan een verzoek
      van een betrokkene als bedoeld in de [artikelen 3.22, eerste lid][ref1], [3.22a, eerste lid][ref2], en
      [3.23, derde lid, van de wet][ref3], voor zover de verstrekking van gegevens uit de basisregistratie heeft
      plaatsgevonden voor de uitvoering van de hieronder bedoelde taken en voor zover het overheidsorgaan waaraan of de
      derde aan wie de gegevens ter uitvoering van die taken zijn verstrekt, heeft aangegeven dat aan het verzoek van de
      betrokkene niet kan worden voldaan:


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0033715
        artikel: '3'
  - number: 46.a
    text: |-
      taken op grond van de [artikelen 3][ref1], [4][ref2] en [49 van de Politiewet 2012][ref3] die worden uitgevoerd in
      het belang van de veiligheid van de staat of de voorkoming, opsporing en vervolging van strafbare feiten;


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel49
    url: https://wetten.overheid.nl/BWBR0034306/2025-11-11#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0031788
