  - number: '9'
    text: |-
      De fabrikant is verplicht om:

      a. in elke lokaliteit waar diergeneesmiddelen worden bereid, verpakt of geëtiketteerd, en afgeleverd een voldoende
      aantal bevoegde en toereikend opgeleide personeelsleden aanwezig te hebben om aan de doelstelling van waarborging
      van de diergeneesmiddelenkwaliteit te kunnen voldoen;

      b. een taakomschrijving voor handen te hebben waarin de plichten van de leidinggevende en de toezichthoudende
      personen alsmede de overige personen die verantwoordelijk zijn voor het ten uitvoer leggen van de goede praktijken
      bij het vervaardigen van diergeneesmiddelen nauwkeurig staan omschreven, terwijl voorts de hiërarchische
      verhoudingen in een organisatieschema moeten zijn vastgelegd;

      c. de taakomschrijving en het organisatieschema overeenkomstig de interne procedures in zijn bedrijf te doen
      goedkeuren;

      d. het personeel, bedoeld in [onderdeel ][ref1], zodanige bevoegdheden voor de uitoefening van zijn taak te
      verlenen als het daarvoor redelijkerwijs nodig heeft;

      e. het personeel, bedoeld in [onderdeel ][ref2], een basisopleiding te doen volgen en voor voortdurende bijscholing
      in de theoretische en de praktische aspecten van de begrippen kwaliteitswaarborging en goede praktijken bij het
      vervaardigen zorg te dragen, en

      f. bedrijfshygiënische programma’s voor handen te hebben die afgestemd zijn op en in acht worden genomen
      bij de handelingen, genoemd in de ingevolge [artikel 21 van de wet][ref3] verstrekte vergunning, en die
      procedures omvatten met betrekking tot de gezondheid, de hygiëne en de kleding van het personeel, bedoeld in
      [onderdeel ][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006290#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006290#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0003818#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0006290#Artikel9
