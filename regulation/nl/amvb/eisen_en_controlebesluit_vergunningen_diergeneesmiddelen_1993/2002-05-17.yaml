preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuurbeheer en Visserij van 19 juli 1993, J. 9310021, gedaan in
    overeenstemming met de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur, na overleg met de Staatssecretaris
    van Sociale Zaken en Werkgelegenheid;

    Gelet op richtlijn nr. 90/676/EEG van de Raad van de Europese Gemeenschappen van 13 december 1990 (Pb EG L 373)
    tot wijziging van richtlijn 81/851/EEG betreffende de onderlinge aanpassing van de wetgevingen der Lid-Staten
    inzake geneesmiddelen voor diergeneeskundig gebruik, op richtlijn nr. 91/412/EEG van de Commissie van de Europese
    Gemeenschappen van 23 juli 1991 tot vastlegging van beginselen en richtsnoeren inzake goede praktijken bij het
    vervaardigen van geneesmiddelen voor diergeneeskundig gebruik (Pb EG L 228) en op de artikelen 23, 39, 40, vierde
    lid, en 42 van de Diergeneesmiddelenwet;

    Gezien het advies van de Vereniging van Fabrikanten en Importeurs van Diergeneesmiddelen in Nederland (Fidin), de
    Vereniging van Fabrikanten en Importeurs van Toevoegingsmiddelen (Nefato), het Produktschap voor Veevoeder en de
    Nederlandse Associatie van Fabrikanten en Importeurs Homeopathische en Fytotherapeutische Geneesmiddelen (Nehoma);

    De Raad van State gehoord (advies van 13 september 1993, nr. W11.93.0482);

    Gezien het nader rapport van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 23 november 1993,
    No. J. 9315400, Directie Juridische en Bedrijfsorganisatorische Zaken, uitgebracht in overeenstemming met de
    Staatssecretaris van Welzijn, Volksgezondheid en Cultuur, na overleg met de Staatssecretaris van Sociale Zaken
    en Werkgelegenheid;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006290/2002-05-17#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:








                  wet:


                  Diergeneesmiddelenwet;




                  [richtlijn nr. 2001/82/EG](32001L0082):


                  [richtlijn nr. 2001/82/EG](32001L0082) van het Europees Parlement en de Raad van de Europese Unie van
      6 november 2001 tot vaststelling van een communautair wetboek betreffende geneesmiddelen voor diergeneeskundig
      gebruik (PbEG L 311);




                  lid-staat:


                  lid-staat van de Europese Unie, niet zijnde Nederland;




                  EER-staat:


                  staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte, niet zijnde een
      lid-staat, Nederland of IJsland;




                  fabrikant:


                  degene die ingevolge artikel 21 van de wet een vergunning heeft voor het bereiden, verpakken of
      etiketteren, en afleveren van diergeneesmiddelen;




                  leverancier:


                  degene die ingevolge artikel 21 van de wet een vergunning heeft voor het afleveren van
      diergeneesmiddelen;




                  recipiënt:


                  verpakking die met het diergeneesmiddel in aanraking komt;




                  bereiden van een diergeneesmiddel:


                  het brengen in een farmaceutische vorm, het verrichten van één of meer deelbewerkingen welke
      noodzakelijk zijn met het oog op het brengen van een diergeneesmiddel in een farmaceutische vorm met inbegrip van
      het vullen en sluiten van de recipiënt;




                  verpakken van een diergeneesmiddel:


                  brengen van de recipiënt in de toestand waarin deze in het verkeer zal worden gebracht met inbegrip
      van in voorkomend geval het etiketteren, een en ander met inbegrip van het aanbrengen van de buitenverpakking of
      omdoos;




                  etiketteren van een diergeneesmiddel:


                  voorzien van een verpakt diergeneesmiddel van aanduidingen en vermeldingen;




                  kwaliteitswaarborging van een diergeneesmiddel:


                  geheel van regels dat tot doel heeft te garanderen dat een diergeneesmiddel de voor het gebruik
      waarvoor het bestemd is vereiste kwaliteit bezit;




                  goede praktijken bij het vervaardigen:


                  die aspecten van de kwaliteitswaarborging die ertoe strekken dat het diergeneesmiddel van constante
      kwaliteit is en volgens de aan het normale gebruik ervan aangepaste kwaliteitsnormen wordt bereid, verpakt,
      geëtiketteerd, afgeleverd en gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0006290/2002-05-17#Artikel1
  - number: '2'
    text: |-
      1 Ter verkrijging van een vergunning voor het bereiden, verpakken of etiketteren, en afleveren als bedoeld in
      [artikel 21 van de wet][ref1], wordt aangetoond dat is voldaan aan de [artikelen 6 tot en met 21][ref2] en het
      bepaalde krachtens [artikel 30][ref3] alsmede aan de door de Commissie van de Europese Gemeenschappen geformuleerde
      gedetailleerde richtsnoeren, bedoeld in artikel 51 van [richtlijn nr. 2001/82/EG](32001L0082).

      2 In afwijking van het eerste lid, wordt voor een vergunning voor het afleveren van een diergeneesmiddel aangetoond
      dat is voldaan aan de [artikelen 23 tot en met 25][ref4] en het bepaalde krachtens [artikel 30][ref5].

      3 een wijziging van artikel 51 van [richtlijn nr. 2001/82/EG](32001L0082) gaat voor de toepassing van het eerste
      lid gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
