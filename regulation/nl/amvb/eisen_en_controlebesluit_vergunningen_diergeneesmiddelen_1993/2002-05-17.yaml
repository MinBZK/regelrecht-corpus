        artikel: '21'
  - number: '17'
    text: |-
      1 De fabrikant van een diergeneesmiddel is verplicht:

      a. van elke partij diergeneesmiddelen in hun uiteindelijke eindverpakking, die gereed is voor aflevering, tenminste
      één jaar ná de houdbaarheidsdatum van de betrokken diergeneesmiddelen of bij ontbreken daarvan ten minste twee
      jaar te rekenen vanaf het moment van afleveren monsters aan te houden van voldoende grootte voor het verrichten van
      kwantitatieve en kwalitatieve controles, en

      b. monsters van gebruikte grondstoffen met uitzondering van oplosmiddelen, gassen en water ten minste gedurende
      twee jaar te bewaren, nadat van de betrokken partij diergeneesmiddelen aflevering plaatsvond, tenzij de in de
      desbetreffende specificatie aangegeven houdbaarheid van het betrokken diergeneesmiddel korter is.

      2 De monsters zijn zodanig verpakt en gemerkt dat zij te allen tijde kunnen worden geïdentificeerd. De verpakking
      mag niet zonder zichtbare, onherstelbare schade kunnen worden geopend.
    url: https://wetten.overheid.nl/BWBR0006290/2002-05-17#Artikel17
  - number: '18'
    text: |-
      Indien een fabrikant verrichtingen ter zake het bereiden, verpakken of etiketteren, en afleveren van
      diergeneesmiddelen, of daarop betrekking hebbende controle-handelingen uitbesteedt, wordt tussen hem en de
      opdrachtnemer in een schriftelijke overeenkomst ter zake de uitbestede verrichtingen duidelijk vastgelegd:

      a. de verantwoordelijkheden van elk der partijen, waarbij wordt vastgelegd dat de opdrachtnemer de beginselen en
      richtsnoeren inzake de goede praktijken bij het vervaardigen in acht zal nemen;

      b. de wijze waarop degene die verantwoordelijk is voor het vrijgeven van een partij diergeneesmiddelen zijn taak
      uitoefent;

      c. dat de opdrachtnemer zonder schriftelijke toestemming van de fabrikant geen werk of gedeelte van het werk dat
      hem krachtens de overeenkomst is toevertrouwd, ter uitvoering aan derden zal uitbesteden.
    url: https://wetten.overheid.nl/BWBR0006290/2002-05-17#Artikel18
  - number: '19'
    text: |-
      Een fabrikant voert in het kader van de kwaliteitswaarborging op regelmatige tijden controles uit om de toepassing
      en naleving van de goede praktijken bij het bereiden, verpakken of etiketteren te controleren en zo nodig ten
      aanzien daarvan aanpassingen en verbeteringen voor te stellen.

      De bevindingen van deze inspecties alsmede de daaruit voortgevloeide maatregelen worden schriftelijk vastgelegd in
      een document. Dit document wordt gedurende 5 jaar bewaard in het documentatiesysteem, bedoeld in artikel II.

      [Artikel 11][ref1] is op dit document van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006290#Artikel11
    url: https://wetten.overheid.nl/BWBR0006290/2002-05-17#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006290
        artikel: '11'
        hoofdstuk: II
        paragraaf: '4'
  - number: '20'
    text: |-
      1 Elke fabrikant beschikt over een deugdelijk systeem:

      a. voor de aanmelding van klachten ter zake diergeneesmiddelen en de behandeling daarvan, en

      b. voor het snel uit de handel kunnen nemen van diergeneesmiddelen.

      2 Een in het eerste lid bedoelde klacht wordt door de fabrikant terstond onderzocht, van welk onderzoek een verslag
      wordt opgemaakt.

      3 De fabrikant is verplicht Onze Minister onmiddellijk te informeren omtrent eventuele omstandigheden die tot het
      uit de handel nemen van het betrokken diergeneesmiddel kunnen leiden dan wel tot een beperking van het gebruik
      daarvan. De te geven informatie heeft zo mogelijk ook betrekking op andere landen waar het diergeneesmiddel is
      afgeleverd.
    url: https://wetten.overheid.nl/BWBR0006290/2002-05-17#Artikel20
  - number: '21'
    text: |-
      De fabrikant stelt Onze Minister onmiddellijk onder opgaaf van redenen in kennis van elke beslissing die door
      hem wordt genomen om het diergeneesmiddel uit de handel te nemen dan wel het afleveren hiervan op te schorten,
      indien deze beslissing betrekking heeft op de doeltreffendheid van het diergeneesmiddel of de bescherming van
      de volksgezondheid. In het laatste geval licht hij tevens de Minister van Welzijn, Volksgezondheid en Cultuur
      onmiddellijk in.
    url: https://wetten.overheid.nl/BWBR0006290/2002-05-17#Artikel21
  - number: '22'
    text: |-
      In afwijking van [de artikelen 3 tot en met 21][ref1], zijn voor een vergunning als
      bedoeld in [artikel 21 van de wet][ref2] voor het afleveren van een diergeneesmiddel de in
      [de artikelen 23 tot en met 25][ref3] vermelde regels van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006290#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0006290#Artikel23
    url: https://wetten.overheid.nl/BWBR0006290/2002-05-17#Artikel22
