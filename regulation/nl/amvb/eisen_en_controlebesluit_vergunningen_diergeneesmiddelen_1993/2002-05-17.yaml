  - number: '4'
    text: |-
      De fabrikant is verplicht er voor zorg te dragen dat de handelingen, genoemd in de ingevolge
      [artikel 21 van de wet][ref1] verstrekte vergunning, worden verricht overeenkomstig de gegevens zoals die zijn
      vermeld in het dossier op grond waarvan registratie van het betrokken diergeneesmiddel is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0006290/2002-05-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
  - number: '5'
    text: |-
      1 De fabrikant evalueert de methoden van bereiding, verpakking of etikettering alsmede de wijze van aflevering van
      de betrokken diergeneesmiddelen regelmatig in het licht van de wetenschappelijke en technische ontwikkelingen.

      2 Indien de evaluatie, bedoeld in het eerste lid, leidt tot een wijziging van de in dat lid bedoelde handelingen
      en tevens noopt tot een aanpassing van het ten behoeve van registratie verstrekte dossier, wordt deze wijziging aan
      Onze Minister ter goedkeuring voorgelegd.

      3 Op een wijziging als bedoeld in het tweede lid is artikel 5 van het Besluit registratie, substanties en
      bijwerkingen van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0006290/2002-05-17#Artikel5
  - number: '6'
    text: |-
      De fabrikant legt een doelmatig systeem van kwaliteitswaarborging voor diergeneesmiddelen ten uitvoer, waarbij de
      verantwoordelijke personen en het personeel van de verschillende diensten, bedoeld in paragraaf 2 , actief worden
      betrokken.
    url: https://wetten.overheid.nl/BWBR0006290/2002-05-17#Artikel6
  - number: '7'
    text: |-
      1 De fabrikant beschikt over ten minste één met betrekking tot de bedrijfsuitoefening deskundige persoon, die

      a. in het bezit is van een diploma, certificaat of ander bewijsstuk ter afsluiting van een hoger-onderwijsopleiding
      behaald dan wel erkend in een lid-staat van de Europese Gemeenschappen of van een opleiding die door Onze Minister
      als gelijkwaardig wordt erkend, die ten minste vier jaar theoretisch en praktisch onderwijs omvat in farmacie,
      geneeskunde diergeneeskunde, scheikunde, farmaceutische scheikunde en technologie of biologie, welke opleiding ten
      minste de in [bijlage I][ref1] genoemde basisvakken moet omvatten, en

      b. over een praktijkervaring beschikt met betrekking tot het uitvoeren van de controle vóór, tijdens en ná het
      bereidingsproces, van twee jaar bij een nominale opleidingsduur van vier jaar, één jaar bij een opleidingsduur van
      vijf jaar en een half jaar bij een opleidingsduur van ten minste zes jaar.

      2 Het ter beschikking hebben van de in het eerste lid bedoelde persoon is niet vereist indien de fabrikant zelf de
      in het eerste lid bedoelde deskundigheid en praktijkervaring bezit.

      3 Personen, van wie ten genoegen van Onze Minister is aangetoond dat zij vóór 1 oktober 1986 verantwoordelijk
      waren voor de in het eerste lid bedoelde controle, doch die niet een van de in dat lid genoemde opleidingen hebben
      voltooid, worden voor de toepassing van dit besluit gelijkgesteld met personen die een der genoemde opleidingen
      hebben voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0006290
    url: https://wetten.overheid.nl/BWBR0006290/2002-05-17#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006290
  - number: '8'
    text: |-
      De fabrikant is verplicht om:

      a. de persoon, bedoeld in [artikel 7][ref1], te allen tijde de gelegenheid te geven om te onderzoeken of:

      1. elke partij diergeneesmiddelen voldoet aan de regels, bedoeld in [de artikelen 12 tot en met 17][ref2], alsmede
      aan de in voorkomend geval in de vergunning, bedoeld in [artikel 21 van de wet][ref3], gestelde voorschriften.

      2. de volgens de gedetailleerde richtsnoeren, bedoeld in [artikel 3, eerste lid][ref4], vereiste documenten of
      protocollen aanwezig zijn.

      b. de door Onze Minister aangewezen ambtenaren onverwijld in kennis te stellen van het feit dat de in
      [artikel 7][ref5] bedoelde persoon zijn controlewerkzaamheden niet langer uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0006290#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006290#Artikel12
