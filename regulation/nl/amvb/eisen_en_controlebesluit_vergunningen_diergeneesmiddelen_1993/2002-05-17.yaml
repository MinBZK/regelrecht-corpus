      1 Dit besluit treedt met uitzondering van de [artikelen 5, derde lid][ref1], en [26, eerste lid][ref2], in werking
      met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin zij wordt geplaatst.

      2 [Artikel 5, derde lid][ref3], treedt in werking met ingang van de dag waarop het Besluit registratie, substanties
      en bijwerkingen in werking treedt.

      3 [Artikel 26, eerste lid][ref4], treedt in werking drie maanden na de dag waarop het onderhavige besluit in
      werking treedt.


