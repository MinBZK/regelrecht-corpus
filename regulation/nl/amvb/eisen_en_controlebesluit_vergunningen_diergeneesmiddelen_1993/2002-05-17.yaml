  - number: '16'
    text: |-
      1 Een verzoek als bedoeld in [artikel 15][ref1]:

      a. is met redenen omkleed;

      b. bevat een opgave van de desbetreffende onderzoeken en controles;

      c. bevat de naam en het adres van het laboratorium alsmede een omschrijving van de voor de controles te benutten
      lokaliteiten en uitrusting;

      d. bevat de naam en hoedanigheid van de in [artikel 7][ref2] bedoelde persoon die voor de uitbestede verrichtingen
      verantwoordelijk is, en

      e. bevat een afschrift van de schriftelijke overeenkomst ter zake de uitbestede verrichtingen, bedoeld in
      [de aanhef van artikel 18][ref3].

      2 Toestemming als bedoeld in [artikel 15][ref4] is niet vereist, indien één of meer controles of onderzoeken
      wegens tijdelijke bijzondere omstandigheden niet in het eigen bedrijf kunnen worden verricht of indien het externe
      laboratorium voor een dergelijk onderzoek reeds een vergunning heeft ingevolge [artikel 21 van de wet][ref5]. In
      zodanig geval wordt hiervan, onder opgave van redenen en met vermelding van de te verwachten tijdsduur, de naam
      en het adres van het laboratorium waar de controles zullen worden verricht, onverwijld kennis gegeven aan Onze
      Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006290#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0006290#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0006290#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0006290#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0003818#Artikel21
