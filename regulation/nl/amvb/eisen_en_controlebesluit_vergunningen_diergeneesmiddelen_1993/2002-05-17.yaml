  - number: '28'
    text: |-
      Het is verboden diergeneesmiddelen afkomstig uit een ander land dan een lid-staat of EER-staat uit te voeren naar
      een lid-staat of EER-staat, indien de zending niet vergezeld gaat van een gewaarmerkte kopie van de vergunning van
      de fabrikant voor het mogen bereiden van de desbetreffende diergeneesmiddelen.
    url: https://wetten.overheid.nl/BWBR0006290/2002-05-17#Artikel28
  - number: '29'
    text: |-
      Het is houders van een vergunning als bedoeld in [artikel 21 van de wet][ref1] verboden:

      a. diergeneesmiddelen te bereiden, te verpakken, te etiketteren of af te leveren met behulp van andere apparatuur
      dan die waarvoor de desbetreffende vergunning is verleend;

      b. een lokaliteit die bestemd is voor de bereiding van entstoffen of biologische diagnostica te gebruiken voor de
      bereiding van andere diergeneesmiddelen;

      c. verschillende levende entstoffen of biologische diagnostica in éénzelfde lokaliteit of gesloten systeem
      tegelijkertijd te bereiden, tenzij dit geschiedt in gescheiden en gesloten systemen;

      d. steriele en niet-steriele diergeneesmiddelen tegelijkertijd in éénzelfde lokaliteit te bereiden, tenzij de
      bereiding van de steriele diergeneesmiddelen in een gesloten systeem plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0006290/2002-05-17#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
  - number: '30'
    text: |-
      1 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de inrichting, het gebruik en
      de technische uitrusting van lokaliteiten waarin diergeneesmiddelen worden bereid, verpakt of geëtiketteerd dan
      wel anderszins worden gereed gemaakt voor aflevering, indien deze lokaliteiten zich bevinden bij of in de directe
      nabijheid van andere ruimten of terreinen, welke deel uitmaken van ondernemingen waarin de landbouw, de veeteelt of
      de pluimveeteelt dan wel de bereiding van of de handel in diervoeders plaatsvindt.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de inrichting, het gebruik en
      de technische uitrusting van de lokaliteiten waarin diergeneesmiddelen worden bereid, verpakt of geëtiketteerd
      dan wel anderszins worden gereed gemaakt voor aflevering, indien deze handelingen geschieden in combinatie met of
      naast andere door Onze Minister aan te wijzen werkzaamheden in beroep of bedrijf door of namens degene, die om een
      vergunning heeft gevraagd.
    url: https://wetten.overheid.nl/BWBR0006290/2002-05-17#Artikel30
  - number: '32'
    text: Het Eisen- en controlebesluit vergunningen diergeneesmiddelen wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006290/2002-05-17#Artikel32
  - number: '33'
    text: |-
      1 Een wijziging van één of meer onderdelen van de richtlijnen, genoemd in [de artikelen 1][ref1] en [27][ref2],
      treedt voor de toepassing van de artikelen uit dit besluit, waarin naar die onderdelen wordt verwezen, in werking
      met ingang van de dag waarop aan de betrokken wijziging uiterlijk uitvoering moet zijn gegeven.

      2 Onze Minister doet mededeling in de *Staatscourant* van een wijziging als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006290#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006290#Artikel27
    url: https://wetten.overheid.nl/BWBR0006290/2002-05-17#Artikel33
