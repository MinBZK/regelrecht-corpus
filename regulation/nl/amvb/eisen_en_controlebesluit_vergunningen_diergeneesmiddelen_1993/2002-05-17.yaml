  - number: '3'
    text: |-
      1 Het is de fabrikant verboden diergeneesmiddelen te bereiden, te verpakken of te etiketteren, en af te leveren,
      anders dan met in achtneming van de [artikelen 6][ref1] tot en met [21][ref2], en de door de Commissie van de
      Europese Gemeenschappen geformuleerde gedetailleerde richtsnoeren, bedoeld in artikel 51 van [richtlijn nr.
      2001/82/EG](32001L0082).

      2 De in het eerste lid bedoelde gedetailleerde richtsnoeren worden door Onze Minister ter inzage gelegd op
      werkdagen van 9.00 uur tot 16.00 uur in de bibliotheek van het Ministerie van Landbouw, Natuurbeheer en Visserij,
      Bezuidenhoutseweg 73 te ’s-Gravenhage.

      3 Onze Minister doet mededeling in de *Staatscourant* van richtsnoeren als bedoeld in het eerste lid en
      [artikel 2, eerste lid][ref3], alsmede van een wijziging hiervan.


      [ref1]: https://wetten.overheid.nl/BWBR0006290#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006290#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0006290#Artikel2
