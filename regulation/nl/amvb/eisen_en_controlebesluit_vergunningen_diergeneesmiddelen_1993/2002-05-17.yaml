  - number: '10'
    text: |-
      1 Lokaliteiten en apparatuur zijn zodanig gesitueerd, geplaatst, ontworpen, gebouwd, ingericht en onderhouden dat
      de overeenkomstig [artikel 21 van de wet][ref1] genoemde handelingen op passende wijze kunnen worden uitgevoerd.

      2 Een bouwplan of ontwerp van een lokaliteit of apparatuur bedoeld in het eerste lid alsmede de wijze waarop zij
      worden gebruikt is zoveel mogelijk op het verlagen van het risico van het maken van fouten en het mogelijk maken
      van doeltreffende schoon- en onderhoudswerkzaamheden gericht, teneinde besmetting, met inbegrip van kruisbesmetting
      en, in het algemeen, alle nadelige gevolgen voor de kwaliteit van de daarin aanwezige of de daarmede te behandelen
      grondstoffen, substanties en diergeneesmiddelen te voorkomen.

      3 Lokaliteiten en apparatuur die zijn bestemd voor handelingen die voor de kwaliteit van substanties of
      diergeneesmiddelen van wezenlijk belang zijn, worden regelmatig aan een controle onderworpen ten einde aan te
      tonen dat de betreffende lokaliteit voldoet en de apparatuur op de juiste wijze functioneert en de te verwachten
      resultaten oplevert.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0006290/2002-05-17#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
  - number: '11'
    text: |-
      1 De fabrikant beschikt over een documentatiesysteem met de specificaties, de voorschriften voor samenstelling,
      de bereidings- en verpakkingsvoorschriften ten aanzien van het betrokken diergeneesmiddel alsmede verdere
      procedures en de protocollen ten aanzien van de verschillende handelingen ter zake het bereiden, het verpakken,
      het etiketteren of het afleveren van dat diergeneesmiddel die door hem worden uitgevoerd. Deze documenten worden
      duidelijk en foutloos opgesteld en bijgewerkt.

      2 De algemene bereidings-, verpakkings-, etiketterings- of afleveringshandelingen en de omstandigheden waaronder
      deze moeten plaatsvinden, bedoeld in het eerste lid, alsmede de specifieke documenten bij deze handelingen ten
      aanzien van elke afzonderlijke partij worden vastgesteld vóórdat zij plaatsvinden.

      3 Aan de hand van de in het eerste en tweede lid bedoelde documenten kan het ontstaansverloop van elke
      geproduceerde partij worden nagegaan.

      4 Een document dat op een bepaalde partij betrekking heeft wordt ten minste één jaar ná de uiterste gebruiksdatum,
      zoals vermeld op de verpakking of het etiket van de tot die partij behorende diergeneesmiddelen, doch in elk geval
      ten minste vijf jaar na de waarmerking van dat document door de daartoe bevoegde persoon bewaard.

      5 Wanneer in plaats van schriftelijke documenten elektronische, fotografische of andere gegevensverwerkingssystemen
      worden gebruikt, heeft de fabrikant dit systeem zodanig gevalideerd dat blijkt dat de gegevens gedurende ten minste
      vijf jaar naar behoren kunnen worden opgeslagen.

      6 De in de systemen, bedoeld in het vijfde lid, opgeslagen gegevens kunnen voorts in gemakkelijk leesbare vorm ter
      beschikking worden gesteld.

      7 De langs de weg van elektronische gegevensverwerking opgeslagen gegevens worden tegen verlies van of tegen schade
      aan de gegevens beschermd door bijvoorbeeld duplicering of kopiëring op een andere gegevensdrager.
    url: https://wetten.overheid.nl/BWBR0006290/2002-05-17#Artikel11
  - number: '12'
    text: |-
      1 De bereiding, het verpakken of het etiketteren door een fabrikant van een diergeneesmiddel en de controle daarop
      geschiedt overeenkomstig de daarvoor in de documentatie, bedoeld in [artikel 11][ref1], opgenomen voorschriften en
      procedures en overeenkomstig de in het tweede tot en met vierde lid gestelde regels.

      2 Voldoende en adequate middelen zijn aanwezig om de vereiste controles te kunnen uitvoeren.

      3 Ten aanzien van de in het eerste lid bedoelde handelingen worden passende technische of organisatorische
      maatregelen genomen om kruisbesmetting en verwisselingen te voorkomen.

      4 Elke nieuwe bereidings-, verpakkings-, etiketterings- of afleveringswijze alsmede elke wijziging in reeds
      bestaande handelingen wordt gevalideerd. De kritische fasen van de hiervoren bedoelde handelingen worden regelmatig
      opnieuw gevalideerd.


      [ref1]: https://wetten.overheid.nl/BWBR0006290#Artikel11
    url: https://wetten.overheid.nl/BWBR0006290/2002-05-17#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006290
        artikel: '11'
        hoofdstuk: II
        paragraaf: '4'
  - number: '13'
    text: |-
      De fabrikant beschikt over een afdeling kwaliteitsbewaking, welke afdeling onder leiding staat van een persoon
      die daarvoor de kwalificaties bezit, bedoeld in [artikel 7][ref1], en onafhankelijk is ten opzichte van de andere
      afdelingen van het betrokken bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0006290#Artikel7
    url: https://wetten.overheid.nl/BWBR0006290/2002-05-17#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006290
        artikel: '7'
        hoofdstuk: II
        paragraaf: '2'
  - number: '14'
    text: |-
      1 De afdeling kwaliteitsbewaking beschikt over één of meer laboratoria voor kwaliteitscontrole waar steeds
      voldoende personeel aanwezig is en welke laboratoria voorts al die voorzieningen hebben om de noodzakelijke
      controles op en de noodzakelijke onderzoeken van de grondstoffen en de verpakkingsmaterialen alsmede de vereiste
      controles met betrekking tot substanties en diergeneesmiddelen te kunnen uitvoeren.

      2 Alvorens een fabrikant diergeneesmiddelen aflevert is hij verplicht er voor zorg te dragen dat de afdeling
      kwaliteitsbewaking:

      a. de betrokken diergeneesmiddelen aan een eindcontrole onderwerpt, waarbij behalve de analyse-resultaten ook
      andere belangrijk te achten gegevens worden betrokken, zoals de omstandigheden vooraf, tijdens en ná de bereiding,
      het verpakken en het etiketteren van de betrokken diergeneesmiddelen alsmede de uitkomsten van tijdens de bereiding
      daarvan uitgevoerde controles, en

      b. de documenten ter zake het bereiden, het verpakken en het etiketteren bestudeert en zorgvuldig nagaat of het af
      te leveren diergeneesmiddel met inbegrip van de uiteindelijke verpakking waarin het zich bevindt, voldoet aan de
      geldende specificaties.
    url: https://wetten.overheid.nl/BWBR0006290/2002-05-17#Artikel14
  - number: '15'
    text: |-
      Onze Minister kan op schriftelijk verzoek van de belanghebbende toestaan dat één of meer van de in
      [artikel 14, eerste of tweede lid][ref1], bedoelde verrichtingen worden uitgevoerd door een extern laboratorium,
      mits:

      a. wordt voldaan aan het ter zake de uitbesteding in [artikel 18][ref2] bepaalde, en

      b. een afschrift van de schriftelijke overeenkomst, bedoeld in [de aanhef van artikel 18][ref3], wordt overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006290#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0006290#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0006290#Artikel18
    url: https://wetten.overheid.nl/BWBR0006290/2002-05-17#Artikel15
