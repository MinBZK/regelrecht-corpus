        artikel: '23'
        hoofdstuk: III
  - number: '23'
    text: |-
      1 Het personeel is technisch voldoende geschoold om de opgedragen werkzaamheden naar behoren te kunnen verrichten.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de opleiding van het in het eerste lid
      bedoelde personeel.
    url: https://wetten.overheid.nl/BWBR0006290/2002-05-17#Artikel23
  - number: '24'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de controle van de administratie alsmede de wijze
      van verslaglegging hiervan door een leverancier.
    url: https://wetten.overheid.nl/BWBR0006290/2002-05-17#Artikel24
  - number: '25'
    text: |-
      De eisen met betrekking tot de lokaliteit, de inrichting en het gebruik van die lokaliteit alsmede de apparatuur
      zijn vermeld in [bijlage II][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0006290
    url: https://wetten.overheid.nl/BWBR0006290/2002-05-17#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006290
  - number: '26'
    text: |-
      1 Het is verboden diergeneesmiddelen uit een ander land dan een lid-staat of een EER-staat in te voeren, tenzij
      bij de aflevering van de partij onderscheidenlijk elk deel daarvan een bewijsstuk aanwezig is, waaruit blijkt dat
      bij het bereiden, verpakken en etiketteren de betrokken diergeneesmiddelen onderworpen zijn geweest aan normen
      voor goede praktijken bij het vervaardigen door een door Onze Minister erkende fabrikant welke normen ten minste
      gelijkwaardig zijn aan die in [de artikelen 6 tot en met 21][ref1].

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de wijze waarop een fabrikant als bedoeld
      in het eerste lid wordt erkend.


      [ref1]: https://wetten.overheid.nl/BWBR0006290#Artikel6
    url: https://wetten.overheid.nl/BWBR0006290/2002-05-17#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0006290
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: '27'
    text: |-
      1 Het is verboden diergeneesmiddelen in Nederland in te voeren anders dan met inachtneming van de leden 2 tot en
      met 9.

      2 Degene die diergeneesmiddelen invoert, draagt ervoor zorg dat door of onder verantwoordelijkheid van een
      persoon als bedoeld in [artikel 7][ref1] in Nederland wordt gecontroleerd dat de door hem ingevoerde partijen een
      volledige kwalitatieve analyse, een kwantitatieve analyse van ten minste alle werkzame bestanddelen en alle andere
      proefnemingen of controles hebben ondergaan die nodig zijn om de kwaliteit van de diergeneesmiddelen te waarborgen
      conform [de artikelen 6 tot en met 21][ref2].

      3 De in het tweede lid bedoelde controle vindt plaats voordat de partij in Nederland wordt bereid, verpakt,
      geëtiketteerd of afgeleverd.

      4 Het verloop en het resultaat van de in het tweede lid bedoelde controle worden in een protocol vastgelegd, dat
      wordt gedateerd en getekend door de persoon die de in het tweede lid bedoelde controle heeft uitgevoerd.

      5 De verplichtingen, genoemd in het tweede tot en met vierde lid gelden niet:

      a. ten aanzien van een uit een lid-staat of een EER-staat ingevoerde partij diergeneesmiddelen, die vergezeld is
      van de door een bevoegde persoon ondertekende controleverslagen waaruit blijkt dat de desbetreffende partij voldoet
      aan de in de betrokken lid-staat geldende regels alsmede aan de bij de registratie gegeven voorschriften;

      b. ten aanzien van diergeneesmiddelen, die als toevoegingsmiddel in diervoeder worden verwerkt overeenkomstig
      [richtlijn nr. 70/524/EEG](31970L0524) van de Raad van de Europese Gemeenschappen van 23 november 1970 betreffende
      toevoegingsmiddelen in de diervoeding (*Pb EG* L 270).

      6 Ten aanzien van uit derde landen ingevoerde partijen diergeneesmiddelen kan Onze Minister op aanvraag van degene
      die diergeneesmiddelen invoert ontheffing verlenen van het tweede lid, indien tussen de Europese Gemeenschap
      en het land van uitvoer passende afspraken zijn gemaakt om te waarborgen dat de fabrikant van de betreffende
      diergeneesmiddelen normen voor goede praktijken bij het vervaardigen hanteert die tenminste gelijkwaardig zijn aan
      die in [de artikelen 6 tot en met 21][ref3] en dat de in het tweede lid genoemde controles in dat land van uitvoer
      zijn verricht.

      7 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het in het zesde lid bedoelde verzoek.

      8 Onze Minister doet mededeling in de *Staatscourant* van de in het zesde lid bedoelde passende afspraken.

      9 De in het tweede lid bedoelde persoon houdt van elke door hem ingevoerde partij monsters aan van voldoende
      grootte voor het verrichten van kwalitatieve en kwantitatieve controles.

      10 Het bepaalde in [artikel 17, eerste lid, aanhef en onderdeel ][ref4], èn tweede lid, is op de in het achtste lid
      bedoelde monsters van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006290#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006290#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0006290#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0006290#Artikel17
    url: https://wetten.overheid.nl/BWBR0006290/2002-05-17#Artikel27
