  - number: 7.5.3
    text: |-
      Indien Onze Minister de gegevens en de accountantsverklaring niet voor binnen zesentwintig weken na het verstrijken
      van de termijn, bedoeld in [artikel 17b, derde lid, aanhef en onderdeel a, van de Financiële-verhoudingswet][ref1]
      heeft ontvangen, stelt Onze Minister de hoogte van de letters B, D, H, J, L, N, R, T, V en X, respectievelijk de
      letters Z en BB in de formule, bedoeld in het eerste lid, vast op nul.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17b
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel7.5
