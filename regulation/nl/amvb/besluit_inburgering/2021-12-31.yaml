        bwb_id: BWBR0008290
        artikel: 17b
  - number: 7.5.4
    text: |-
      Onze Minister stelt het prestatie-afhankelijke deel van de rijksbijdrage uiterlijk dertig weken na het verstrijken
      van de termijn, bedoeld in [artikel 17b, derde lid, aanhef en onderdeel a, van de Financiële-verhoudingswet][ref1],
      welke betrekking heeft op de jaarrekening van het jaar 2011, vast.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17b
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17b
  - number: 7.5.5
    text: |-
      Het prestatie-afhankelijke deel van de rijksbijdrage wordt vastgesteld onder voorbehoud van goedkeuring van
      de beschikbare middelen door de begrotingswetgever en kan worden verlaagd in verband met wijzigingen van de
      rijksbegroting voor het jaar 2012 dan wel het jaar 2013.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel7.5
  - number: 7.5.6
    text: |-
      Het prestatie-afhankelijke deel van de rijksbijdrage wordt verrekend met het voorschot dat is verleend ten behoeve
      van de jaren 2007 en 2008. Het uit de verrekening resulterende positieve of negatieve saldo wordt uiterlijk zes
      maanden na de vaststelling ervan aan een gemeente betaald.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel7.5
  - number: 7.6.1
    text: |-
      Het vaste en variabele deel van de rijksbijdrage voor een gemeente wordt berekend met de formule A = B + [ C x D ]
      + [ E x F ] + [ G x H ] + [ I x J ] + [ K x L ] waarin wordt voorgesteld: - met de letter A: het vaste en variabele
      deel van de rijksbijdrage;
        - met de letter B: het verleende voorschot op het vaste deel van de rijksbijdrage;
        - met de letter C: het aantal inburgeringsplichtigen aan wie het college in het jaar waarop het vaste en variabele
      deel van de rijksbijdrage betrekking hebben een handhavingsbeschikking bekend heeft gemaakt;
        - met de letter D: de bijdragevergoeding ten aanzien van de bekendmaking van een handhavingsbeschikking;
        - met de letter E: het aantal inburgeringsplichtigen aan wie het college in het jaar waarop het
      vaste en variabele deel van de rijksbijdrage betrekking hebben een kennisgeving als bedoeld in
      [artikel 5.3, derde lid][ref1], zoals dat luidde voor het tijdstip van inwerkingtreding van het
      __REF001___________________________________________________________________________________________________________
      _____________________________________________________________________________________ (Stb. 2012, 432), heeft
      verstrekt;
        - met de letter F: de bijdragevergoeding ten aanzien van de verstrekking van een
      kennisgeving als bedoeld in [artikel 5.3, derde lid][ref3], zoals dat luidde voor het
      tijdstip van inwerkingtreding van het besluit van 25 september 2012 tot wijziging van het
      __REF003___________________________________________________________________________________________________________
      ________________________________ (Stb. 2012, 432);
        - met de letter G: het aantal geestelijke bedienaren ten behoeve van wie het college in het jaar waarop het vaste
      en variabele deel van de rijksbijdrage betrekking hebben een inburgeringsvoorziening heeft vastgesteld;
        - met de letter H: de bijdragevergoeding ten aanzien van de vaststelling van een inburgeringsvoorziening voor een
      geestelijke bedienaar;
        - met de letter I: het aantal geestelijke bedienaren dat in het jaar waarop het vaste en variabele deel van
      de rijksbijdrage betrekking hebben, heeft deelgenomen aan het inburgeringsexamen of het examen, bedoeld in
      [artikel 2.3, eerste lid, onderdeel c][ref5], zoals dit luidde op 31 december 2014;
        - met de letter J: de bijdragevergoeding ten aanzien van de deelname door een geestelijke bedienaar aan het
      inburgeringsexamen of het examen, bedoeld in [artikel 2.3, eerste lid, onderdeel c][ref6], zoals dit luidde op
      31 december 2014;
        - met de letter K: het aantal geestelijke bedienaren dat in het jaar waarop het vaste en variabele deel van de
      rijksbijdrage betrekking hebben, heeft deelgenomen aan het aanvullend praktijkdeel van het inburgeringsexamen,
      bedoeld in [artikel 3.8, eerste lid][ref7], zoals dat luidde voor het tijdstip van inwerkingtreding van het
      __REF007___________________________________________________________________________________________________________
      _____________________________________________________________________________________ (Stb. 2012, 432);
        - met de letter L: de bijdragevergoeding ten aanzien van de deelname door een geestelijke
      bedienaar aan het aanvullend praktijkdeel van het inburgeringsexamen, bedoeld in
      [artikel 3.8, eerste lid][ref9], zoals dat luidde voor het tijdstip van inwerkingtreding van het
      __REF009___________________________________________________________________________________________________________
      ______________________________________________________________________________________ (Stb. 2012, 432).


