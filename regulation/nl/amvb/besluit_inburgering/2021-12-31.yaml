      betreffende onderdelen van het inburgeringsexamen te behalen, is vrijgesteld de inburgeringsplichtige die beschikt
      over het certificaat, bedoeld in [artikel 13, tweede lid, van de Wet inburgering nieuwkomers][ref1], alsmede
      de verklaring van het regionaal opleidingencentrum op grond waarvan dat certificaat is afgegeven, indien uit
      die verklaring blijkt dat voor het onderdeel Nederlands als tweede taal ten minste niveau 2 van de eindtermen
      Referentiekader Nederlands als Tweede Taal is behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel13
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '13'
  - number: 2.4.2
    text: |-
      Van de verplichting om kennis van de Nederlandse samenleving te verwerven en het betreffende onderdeel van het
      inburgeringsexamen te behalen, is vrijgesteld de inburgeringsplichtige die beschikt over het certificaat, bedoeld
      in [artikel 13, tweede lid, van de Wet inburgering nieuwkomers][ref1], alsmede de verklaring van het regionaal
      opleidingencentrum op grond waarvan dat certificaat is afgegeven, indien uit die verklaring blijkt dat voor het
      onderdeel Maatschappij Oriëntatie is behaald:


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel13
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '13'
  - number: 2.4.2.a
    text: |-
      het niveau van [artikel 11, eerste lid, onderdeel b, van die wet][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel11
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '11'
  - number: 2.4.2.b
    text: |-
      een score van de MO-Profieltoets van ten minste: 85%, indien die toets is afgelegd voor 1 september 2001,
      respectievelijk 80%, indien die toets is afgelegd na 31 augustus 2001.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.4
  - number: 2.4.3
    text: |-
      Bij regeling van Onze Minister kan worden voorzien in gedeeltelijke vrijstelling van de inburgeringsplicht op grond
      van andere diploma’s, certificaten of documenten dan genoemd in het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.4
  - number: 2.4a.1
    text: |-
      Van de verplichtingen om kennis van de Nederlandse samenleving te verwerven en het inburgeringsexamen te
      behalen, wordt voor wat betreft het onderdeel oriëntatie op de Nederlandse arbeidsmarkt, bedoeld in de
      [artikelen 2.10, eerste lid, onderdeel b][ref1], en [3.9, derde lid, onderdeel b][ref2], op verzoek vrijgesteld de
      inburgeringsplichtige die in een periode van twaalf maanden voorafgaande aan het verzoek:


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.4a
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0020674
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 2.4a.1.a
    text: in ten minste zes maanden minimaal 48 uur per maand werkzaamheden in loondienst heeft verricht;
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.4a
  - number: 2.4a.1.b
    text: |-
      winst uit een onderneming, bedoeld in [artikel 3.8 van de Wet inkomstenbelasting 2001][ref1], had die ten minste
      gelijk was aan (L / 40) * 48 * 6; of


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.4a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 2.4a.1.c
    text: |-
      in ten minste zes maanden bijstand ontving op grond van
      [artikel 2, eerste of tweede lid, van het Besluit bijstandverlening zelfstandigen 2004][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015711#Artikel2
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.4a
    references:
      - id: ref1
        bwb_id: BWBR0015711
        artikel: '2'
  - number: 2.4a.2
    text: |-
      In het eerste lid, onderdeel b, staat L voor het minimumloon, bedoeld in
      [artikel 8, eerste lid, onderdeel b, van de Wet minimumloon en minimumvakantiebijslag][ref1], met inbegrip van de
      vakantiebijslag, bedoeld in [artikel 15 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.4a
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '15'
  - number: 2.4a.3
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld over de toepassing van het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.4a
  - number: '2.5'
    text: |-
      Geheel vrijgesteld van de inburgeringsplicht is degene die een toets als bedoeld in
      [artikel 5, vierde lid, van de Wet inburgering nieuwkomers][ref1] met goed gevolg heeft afgelegd, als gevolg
      waarvan hij beschikt over een besluit inhoudende dat de vaststelling van een inburgeringsprogramma achterwege wordt
      gelaten,


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel5
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '5'
  - number: 2.5b
    text: |-
      De advisering met betrekking tot buitenlandse diploma’s, getuigschriften, certificaten of andere documenten die
      leiden tot gehele of gedeeltelijke vrijstelling van de inburgeringsplicht, wordt uitgevoerd door een of meer bij
      ministeriële regeling aangewezen organisaties.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.5b
  - number: 2.6.1
    text: |-
      Het verblijf in Nederland tijdens de leerplichtige leeftijd, bedoeld in
      [artikel 5, eerste lid, onderdeel b, van de wet][ref1], blijkt uit inschrijving als ingezetene in de
      basisregistratie personen.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel5
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '5'
  - number: 2.6.2
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de toepassing van het eerste lid en kan
      van het eerste lid worden afgeweken op grond van concrete aanwijzingen dat de inschrijving kennelijk onjuist was.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.6
  - number: 2.8.1
    text: |-
      In het kader van de aanvraagprocedure tot ontheffing van de inburgeringsplicht op grond van een
      psychische of lichamelijke belemmering, dan wel verstandelijke handicap als bedoeld in artikel
      6, eerste lid, van de wet, verzoekt Onze Minister een door hem aangewezen arts, niet zijnde de
      behandelend arts van de inburgeringsplichtige, die is ingeschreven in het register, bedoeld in
      [artikel 3, eerste lid, van de Wet op de beroepen in de individuele gezondheidszorg][ref1], een advies af te geven
      met betrekking tot de inburgeringsplichtige die de aanvraag tot ontheffing heeft ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
  - number: 2.8.2
    text: Onze Minister geeft binnen acht weken na ontvangst van de aanvraag een beschikking.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.8
  - number: 2.8.3
    text: |-
      Indien Onze Minister, op grond van het advies, bedoeld in het eerste lid, van oordeel is dat de
      inburgeringsplichtige het inburgeringsexamen slechts kan afleggen onder bijzondere examenomstandigheden die zijn
      aangepast aan de mogelijkheden van die inburgeringsplichtige, wordt in de beschikking vermeld welke bijzondere
      examenomstandigheden het betreft.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.8
  - number: 2.8.4
    text: |-
      De ontheffing kan worden verleend indien redelijkerwijs verwacht mag worden dat de aard en de ernst van de
      psychische of lichamelijke belemmering dan wel verstandelijke handicap zodanig zijn dat niet binnen vijf jaar na de
      aanvraag van de ontheffing aan de inburgeringsplicht kan worden voldaan.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.8
  - number: 2.8.5
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de verlening van de ontheffing alsmede
      omtrent het advies, bedoeld in het eerste lid, en omtrent de omstandigheden waaronder de kosten van dat advies
      worden vergoed.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.8
  - number: 2.8a.1
    text: |-
      Onze Minister verleent op aanvraag ontheffing van de inburgeringsplicht, indien Onze Minister van oordeel is dat
      een inburgeringsplichtige aantoonbaar voldoende is ingeburgerd.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.8a
  - number: 2.8a.2
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de verlening van de ontheffing.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.8a
  - number: 2.8b.1
    text: |-
      Een aanvraag tot ontheffing van de inburgeringsplicht op grond van door de inburgeringsplichtige aantoonbaar
      geleverde inspanningen als bedoeld in [artikel 6, tweede lid, van de wet][ref1], kan niet eerder worden
      ingediend dan zes maanden voor het verstrijken van de voor de inburgeringsplichtige geldende termijn, bedoeld in
      [artikel 7b, eerste lid, van de wet][ref2]. Onze Minister geeft binnen acht weken na ontvangst van de aanvraag
      een beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel7
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.8b
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '7'
  - number: 2.8b.2
    text: |-
      In bijzondere gevallen die de inburgeringsplichtige betreffen, kan Onze Minister ambtshalve besluiten tot het
      verlenen van de ontheffing.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.8b
  - number: 2.8b.3
    text: |-
      In afwijking van het eerste lid, kan de aanvraag tot ontheffing in bij ministeriële regeling aan te wijzen gevallen
      eerder worden ingediend dan zes maanden voor het verstrijken van de voor de inburgeringsplichtige geldende termijn,
      bedoeld in [artikel 7b, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7b
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.8b
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: 7b
  - number: 2.8b.4
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent het verlenen van de ontheffing.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.8b
  - number: '2.9'
    text: |-
      De inburgeringsplichtige verwerft de volgende vaardigheden in de Nederlandse taal op het niveau A2 van het Europees
      Raamwerk voor Moderne Vreemde Talen:
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.9
  - number: 2.9.a
    text: spreekvaardigheid;
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.9
  - number: 2.9.b
    text: luistervaardigheid;
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.9
  - number: 2.9.c
    text: schrijfvaardigheid;
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.9
  - number: 2.9.d
    text: leesvaardigheid.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.9
  - number: 2.10.1
    text: |-
      De inburgeringsplichtige verwerft kennis van de Nederlandse samenleving op het niveau van de bij regeling van Onze
      Minister vast te stellen eindtermen met betrekking tot de volgende onderdelen:
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.10
  - number: 2.10.1.a
    text: kennis van de Nederlandse maatschappij;
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.10
  - number: 2.10.1.b
    text: oriëntatie op de Nederlandse arbeidsmarkt.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.10
  - number: 2.10.2
    text: |-
      Van de in het eerste lid, onderdeel b, bedoelde te verwerven kennis is vrijgesteld de persoon die
      inburgeringsplichtig is geworden voor 1 januari 2015.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.10
  - number: 2.10a
    text: De inburgeringsplichtige verwerft in het participatieverklaringstraject kennis van de Nederlandse kernwaarden.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.10a
  - number: '2.11'
    text: |-
      De termijnen genoemd in de [artikelen 7a, eerste lid][ref1], en [7b, eerste lid, van de wet][ref2] worden verlengd
      met de duur van de periode, bedoeld in [artikel 2.2, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel7b
      [ref3]: https://wetten.overheid.nl/BWBR0020674#Artikel2
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0020611
        artikel: 7b
      - id: ref3
        bwb_id: BWBR0020674
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 2.12.1
    text: |-
      Een aanvraag tot verlenging van de voor de inburgeringsplichtige geldende termijnen, bedoeld in de
      [artikelen 7a, eerste lid][ref1], en [7b, eerste lid, van de wet][ref2], kan niet eerder worden ingediend dan zes
      maanden voor het verstrijken van die termijn. Onze Minister geeft binnen acht weken na ontvangst van de aanvraag
      een beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel7b
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0020611
        artikel: 7b
  - number: 2.12.2
    text: |-
      In bijzondere gevallen die de inburgeringsplichtige betreffen, kan Onze Minister ambtshalve besluiten tot
      verlenging van de voor de inburgeringsplichtige geldende termijnen, bedoeld in de [artikelen 7a, eerste lid][ref1],
      en [7b, eerste lid, van de wet][ref2]. De beschikking wordt niet eerder gegeven dan zes maanden voor het
      verstrijken van die termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel7b
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0020611
        artikel: 7b
  - number: 2.12.3
    text: In de beschikking wordt de duur van de verlenging vermeld.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.12
  - number: 2.12.4
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de verlenging van de termijn.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.12
  - number: 3.1.1
    text: Onze Minister stelt het inburgeringsexamen vast.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.1
  - number: 3.1.2
    text: |-
      Het inburgeringsexamen wordt wat betreft het onderdeel, bedoeld in
      [artikel 7, tweede lid, onderdeel a, van de wet][ref1], afgenomen door het college en wat betreft de onderdelen,
      bedoeld in artikel 7, tweede lid, onderdelen b en c, van de wet, afgenomen door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '7'
  - number: 3.1.3
    text: Bij regeling van Onze Minister worden regels gesteld omtrent de toepassing van het eerste en het tweede lid.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.1
  - number: 3.2.1
    text: |-
      Degene die wenst te worden toegelaten tot een of meer onderdelen van het inburgeringsexamen als bedoeld in
      [artikel 7, tweede lid, onderdelen b en c, van de wet][ref1], meldt zich daartoe schriftelijk aan overeenkomstig de
      door Onze Minister gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '7'
  - number: 3.2.2
    text: |-
      Degene die wenst te worden toegelaten tot het participatieverklaringstraject, bedoeld in
      [artikel 7, tweede lid, onderdeel a, van de wet][ref1], meldt zich daartoe schriftelijk bij het college aan voor
      deelname aan het participatieverklaringstraject op een van de door het college vastgestelde data.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '7'
  - number: 3.2.3
    text: Bij regeling van Onze Minister worden regels gesteld omtrent de toepassing van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.2
  - number: 3.2.4
    text: Onze Minister dan wel het college bevestigt de aanmelding schriftelijk.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.2
  - number: '3.3'
    text: |-
      Onze minister bepaalt voor welke onderdelen van het af te leggen inburgeringsexamen, welke doelgroepen
      inburgeringsplichtigen welk bedrag aan examengeld zijn verschuldigd en op welke wijze het verschuldigde examengeld
      wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.3
  - number: '3.4'
    text: |-
      Op verzoek van degene die het examen afneemt of daarop toezicht houdt, identificeert de kandidaat zich met een
      document als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 3.5.1
    text: |-
      Onze Minister dan wel het college stelt de kandidaat met een psychische of lichamelijke belemmering of
      verstandelijke handicap op diens verzoek in de gelegenheid het inburgeringsexamen dan wel een onderdeel daarvan af
      te leggen op een wijze die is aangepast aan zijn mogelijkheden.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.5
  - number: 3.5.2
    text: |-
      Indien Onze Minister bij de toepassing van [artikel 2.8][ref1] heeft geoordeeld dat de inburgeringsplichtige
      het inburgeringsexamen dan wel een onderdeel daarvan slechts kan afleggen op een wijze die is aangepast aan de
      mogelijkheden van die inburgeringsplichtige, legt de kandidaat bij de aanvraag de beschikking, bedoeld in het derde
      lid van dat artikel over.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '5'
  - number: 3.5.3
    text: |-
      In de overige gevallen legt de kandidaat een advies over van een door Onze Minister
      aangewezen onafhankelijke arts, die is ingeschreven in het betreffende register, bedoeld in
      [artikel 3, eerste lid, van de Wet op de beroepen in de individuele gezondheidszorg][ref1], waaruit blijkt dat hij
      het inburgeringsexamen dan wel een onderdeel daarvan slechts kan afleggen op een wijze die is aangepast aan zijn
      mogelijkheden.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
  - number: 3.5.4
    text: Bij regeling van Onze Minister worden regels gesteld over de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.5
  - number: 3.6.1
    text: |-
      Indien een kandidaat zich ten aanzien van een onderdeel van het inburgeringsexamen aan enige onregelmatigheid
      schuldig maakt of heeft gemaakt, kan Onze Minister het inburgeringsexamen ongeldig verklaren en bepalen dat de
      kandidaat het inburgeringsexamen of een onderdeel daarvan opnieuw moet afleggen.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.6
  - number: 3.6.2
    text: |-
      Indien de onregelmatigheid eerst na afloop van het examen wordt ontdekt, kan Onze Minister het examenresultaat
      ongeldig verklaren.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.6
  - number: 3.9.1
    text: |-
      Het inburgeringsexamen bestaat wat betreft het participatieverklaringstraject, bedoeld in
      [artikel 7, tweede lid, onderdeel a, van de wet][ref1], uit de volgende onderdelen:


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '7'
  - number: 3.9.1.a
    text: een inleiding op de Nederlandse kernwaarden;
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.9
  - number: 3.9.1.b
    text: de ondertekening van de participatieverklaring.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.9
  - number: 3.9.2
    text: |-
      Het inburgeringsexamen bestaat voor wat betreft de examinering van de mondelinge en schriftelijke vaardigheden in
      de Nederlandse taal, bedoeld in [artikel 7, tweede lid, onderdeel b, van de wet][ref1], uit de volgende onderdelen:


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '7'
  - number: 3.9.2.a
    text: leesvaardigheid;
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.9
  - number: 3.9.2.b
    text: luistervaardigheid;
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.9
  - number: 3.9.2.c
    text: schrijfvaardigheid;
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.9
  - number: 3.9.2.d
    text: spreekvaardigheid.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.9
  - number: 3.9.3
    text: |-
      Het inburgeringsexamen bestaat voor wat betreft de examinering van de kennis van de Nederlandse samenleving,
      bedoeld in [artikel 7, tweede lid, onderdeel c, van de wet][ref1], uit de volgende onderdelen:


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '7'
  - number: 3.9.3.a
    text: kennis van de Nederlandse maatschappij;
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.9
  - number: 3.9.3.b
    text: oriëntatie op de Nederlandse arbeidsmarkt.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.9
  - number: 3.9.4
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de onderdelen van het
      inburgeringsexamen, genoemd in het eerste tot en met derde lid.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.9
  - number: 3.9a.1
    text: |-
      Het participatieverklaringstraject wordt wat betreft het onderdeel inleiding op de Nederlandse kernwaarden
      afgelegd door het deelnemen aan een door of namens het college aangeboden inleiding op de Nederlandse
      kernwaarden en wat betreft het onderdeel ondertekenen van de participatieverklaring door het aanwezig zijn bij de
      ondertekeningsbijeenkomst en het aldaar ondertekenen van de participatieverklaring.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.9a
  - number: 3.9a.2
    text: |-
      De onderdelen leesvaardigheid, luistervaardigheid en spreekvaardigheid van het inburgeringsexamen worden afgelegd
      door middel van een door Onze Minister beheerd geautomatiseerd systeem.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.9a
  - number: 3.9a.3
    text: Het onderdeel schrijfvaardigheid van het inburgeringsexamen wordt schriftelijk afgelegd.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.9a
  - number: 3.9a.4
    text: |-
      Het onderdeel kennis van de Nederlandse samenleving van het inburgeringsexamen wordt voor wat betreft het onderdeel
      oriëntatie op de Nederlandse arbeidsmarkt afgelegd door middel van een praktijkexamen en voor wat betreft het
      onderwerp kennis van de Nederlandse maatschappij door middel van een door Onze Minister beheerd geautomatiseerd
      systeem.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.9a
  - number: 3.9a.5
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de wijze van examineren.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.9a
  - number: 3.9b.1
    text: |-
      Bij het participatieverklaringstraject worden door het college de aanwezigheid van de inburgeringsplichtige bij de
      inleiding op de Nederlandse kernwaarden, aanwezigheid bij de ondertekeningsbijeenkomst en de ondertekening van de
      participatieverklaring geregistreerd.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.9b
  - number: 3.9b.2
    text: |-
      De resultaten van de onderdelen leesvaardigheid en luistervaardigheid van het inburgeringsexamen worden beoordeeld
      door Onze Minister door middel van het geautomatiseerde systeem, bedoeld in [artikel 3.9a, tweede lid][ref1].
      Het onderdeel spreekvaardigheid van het inburgeringsexamen wordt voor een deel beoordeeld door middel van het
      geautomatiseerde systeem, bedoeld in artikel 3.9a, tweede lid, en voor het overige deel door een of meer door Onze
      Minister aan te wijzen beoordelaars.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.9b
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.9b.3
    text: Het onderdeel schrijfvaardigheid wordt beoordeeld door een of meer door Onze Minister aan te wijzen beoordelaars.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.9b
  - number: 3.9b.4
    text: |-
      Het onderdeel kennis van de Nederlandse samenleving van het inburgeringsexamen, bedoeld in
      [artikel 3.9a, vierde lid][ref1], wordt voor wat betreft het onderdeel kennis van de Nederlandse maatschappij
      door middel van een geautomatiseerd systeem beoordeeld en het praktijkexamen van het onderdeel oriëntatie op de
      Nederlandse arbeidsmarkt wordt door een of meer examinatoren beoordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.9b
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.9b.5
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de beoordeling van het examen.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.9b
  - number: 3.10.1
    text: Het inburgeringsdiploma wordt uitgereikt door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.10
  - number: 3.10.2
    text: Het inburgeringsdiploma wordt ondertekend door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.10
  - number: 3.10.3
    text: |-
      Duplicaten van inburgeringsdiploma’s worden tegen betaling van de kostprijs, uitsluitend door Onze Minister
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.10
  - number: '3.13'
    text: |-
      Bij regeling van Onze Minister worden normen voor de kwaliteit van de examinering vastgesteld die in ieder geval
      betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.13
  - number: 3.13.a
    text: de afname van de onderdelen van het inburgeringsexamen;
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.13
  - number: 3.13.b
    text: de voorwaarden voor toelating tot de onderdelen van het inburgeringsexamen;
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.13
  - number: 3.13.c
    text: de deskundigheid van de examinatoren en beoordelaars;
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.13
  - number: 3.13.d
    text: het vaststellen van de uitslag van de onderdelen van het inburgeringsexamen;
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.13
  - number: 3.13.e
    text: de waarborging van de kwaliteit van de examinering.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3.13
  - number: 3a.1
    text: |-
      Als instelling die een keurmerk als bedoeld in [artikel 12a, eerste lid, van de wet][ref1] kan afgeven, kan worden
      aangewezen de instelling die:


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel12a
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3a.1
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: 12a
  - number: 3a.1.a
    text: rechtspersoonlijkheid heeft;
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3a.1
  - number: 3a.1.b
    text: onafhankelijk is;
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3a.1
  - number: 3a.1.c
    text: beschikt over voldoende deskundigheid en toerusting om de uitvoering van deze taak naar behoren te vervullen; en
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3a.1
  - number: 3a.1.d
    text: naar behoren functioneert.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel3a.1
  - number: '4.1'
    text: |-
      Tenzij uitdrukkelijk anders is bepaald, zijn de bepalingen in dit hoofdstuk van overeenkomstige toepassing op de
      persoon, bedoeld in [artikel 5, tweede lid, van de wet][ref1], die rechtmatig verblijf verkrijgt als bedoeld in
      [artikel 8, onderdeel e of l, van de Vreemdelingenwet 2000][ref2] en die:


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 4.1.a
    text: |-
      anders dan voor een tijdelijk doel als bedoeld in [artikel 2.1][ref1] in Nederland verblijft;


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 4.1.b
    text: |-
      ouder dan 16 jaar is dan wel de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1] nog niet heeft bereikt;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 4.1.c
    text: minder dan acht jaren tijdens de leerplichtige leeftijd in Nederland heeft verbleven;
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.1
  - number: 4.1.d
    text: |-
      niet beschikt over een bij of krachtens algemene maatregel van bestuur aangewezen diploma, certificaat of ander
      document;
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.1
  - number: 4.1.e
    text: |-
      niet leerplichtig of kwalificatieplichtig is, dan wel een opleiding volgt waarvan de afronding leidt tot uitreiking
      van een bij of krachtens algemene maatregel van bestuur aangewezen diploma, certificaat of ander document.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.1
  - number: 4.1a.1
    text: |-
      Aan de inburgeringsplichtige kan, behoudens het bepaalde in [artikel 16, tweede lid, van de wet][ref1] op aanvraag
      een lening van ten hoogste € 10.000,– worden verstrekt ten behoeve van de kosten voor:


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel16
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.1a
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '16'
  - number: 4.1a.1.a
    text: |-
      het volgen van een cursus die opleidt tot de in artikel 7, tweede lid, onderdelen b en c, van de wet bedoelde
      onderdelen van het inburgeringsexamen of het staatsexamen Nederlands als tweede taal I of II als bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel c, van de Wet educatie en beroepsonderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.1a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 4.1a.1.b
    text: het afleggen van het staatsexamen, bedoeld in onderdeel a, of het inburgeringsexamen; of
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.1a
  - number: 4.1a.1.c
    text: het volgen van een alfabetiseringscursus.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.1a
  - number: 4.1a.2
    text: |-
      De hoogte van de lening wordt bepaald aan de hand van de hoogte van het overeenkomstig
      [artikel 8, eerste, tweede, derde en vijfde lid, van de Algemene wet inkomensafhankelijke regelingen][ref1]
      te berekenen toetsingsinkomen van de inburgeringsplichtige en diens partner als bedoeld in
      [artikel 3 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel3
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.1a
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0018472
        artikel: '3'
  - number: 4.1a.3
    text: |-
      Het tweede lid is niet van toepassing op de inburgeringsplichtige, bedoeld in het eerste lid, die rechtmatig
      verblijf heeft op grond van een:
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.1a
  - number: 4.1a.3.a
    text: verblijfsvergunning asiel voor bepaalde tijd; of
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.1a
  - number: 4.1a.3.b
    text: |-
      verblijfsvergunning regulier voor bepaalde tijd, verleend onder een beperking verband houdend met verblijf als
      familie- of gezinslid, voor verblijf bij:
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.1a
  - number: 4.1a.3.b.1°
    text: een houder van een verblijfsvergunning asiel voor bepaalde tijd,
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.1a
  - number: 4.1a.3.b.2°
    text: een houder van een verblijfsvergunning asiel voor onbepaalde tijd, of
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.1a
  - number: 4.1a.3.b.3°
    text: |-
      een houder van een EU-verblijfsvergunning voor langdurig ingezetenen die is verleend met een aantekening inzake
      internationale bescherming als bedoeld in [artikel 45c, eerste lid, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel45c
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.1a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 45c
  - number: 4.1a.4
    text: |-
      De lening ten behoeve van het volgen van een cursus wordt slechts verstrekt indien de
      inburgeringsplichtige een cursus volgt bij een cursusinstelling die in het bezit is van een
      certificaat als bedoeld in [artikel 9, eerste lid, van de wet][ref1] of een keurmerk als bedoeld in
      [artikel 12a, eerste lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel12a
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.1a
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: 12a
  - number: 4.1a.5
    text: |-
      De lening wordt niet verstrekt, indien de inburgeringsplichtige op grond van
      [artikel 4.1][ref1] zoals dat luidde voor het tijdstip van inwerkingtreding van het
      __REF001___________________________________________________________________________________________________________
      _____________________________________________________________________________________ (Stb. 2012, 432) een lening
      is verstrekt en deze nog niet geheel is terugbetaald of kwijtgescholden.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032034
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.1a
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032034
  - number: 4.1a.6
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot de toepassing van het eerste,
      tweede en vierde lid.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.1a
  - number: 4.2.1
    text: |-
      De inburgeringsplichtige heeft, behoudens het bepaalde in [artikel 16, eerste lid, tweede zin, van de wet][ref1],
      aanspraak op de lening gedurende de termijn, bedoeld in de [artikelen 7a, eerste lid][ref2], en
      [7b, eerste lid, van de wet][ref3], gedurende de verlengde termijn bedoeld in de artikelen 7a, derde lid, 7b,
      derde lid, en [8, eerste lid, aanhef en onderdeel a, van de wet][ref4] en gedurende de termijn, genoemd in
      de boetebeschikking, bedoeld in de [artikelen 29][ref5] en [32 van de wet][ref6]. Een persoon als bedoeld in
      [artikel 4.1][ref7] heeft aanspraak op de lening gedurende drie jaar nadat hij rechtmatig verblijf verkrijgt.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel7a
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel7b
      [ref4]: https://wetten.overheid.nl/BWBR0020611#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0020611#Artikel29
      [ref6]: https://wetten.overheid.nl/BWBR0020611#Artikel32
      [ref7]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: 7a
      - id: ref3
        bwb_id: BWBR0020611
        artikel: 7b
      - id: ref4
        bwb_id: BWBR0020611
        artikel: '8'
      - id: ref5
        bwb_id: BWBR0020611
        artikel: '29'
      - id: ref6
        bwb_id: BWBR0020611
        artikel: '32'
      - id: ref7
        bwb_id: BWBR0020674
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.2.2
    text: 'Het geleende bedrag wordt niet uitbetaald, indien de inburgeringsplichtige:'
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.2
  - number: 4.2.2.a
    text: |-
      niet langer ingezetene is in de zin van de [Wet basisregistratie personen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0033715
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0033715
  - number: 4.2.2.b
    text: |-
      als vreemdeling geen rechtmatig verblijf meer heeft in de zin van
      [artikel 8, onderdelen a, c, e en l van de Vreemdelingenwet 2000][ref1], dan wel, in de in
      [artikel 2.2, eerste lid][ref2], bedoelde gevallen, in de zin van artikel 8, onderdelen g of h, van de
      Vreemdelingenwet 2000;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel2
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0020674
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 4.2.2.c
    text: |-
      overeenkomstig [artikel 16, eerste lid, tweede zin, van de wet][ref1] geen of niet langer aanspraak heeft op een
      lening.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel16
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '16'
  - number: 4.2.3
    text: Bij regeling van Onze Minister worden regels gesteld over de betaling van de lening.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.2
  - number: 4.2.4
    text: |-
      Onze Minister verlengt ambtshalve de termijn van drie jaar, bedoeld in het eerste lid, tweede zin, indien dat
      noodzakelijk is in verband met de uitbraak van COVID-19.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.2
  - number: 4.3.1
    text: In de aanvraag vermeldt de aanvrager zijn burgerservicenummer.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.3
  - number: 4.3.2
    text: |-
      Bij de aanvraag overlegt de aanvrager een door hem ondertekende verklaring waarin hij Onze Minister machtigt het
      bedrag van de maandelijkse termijnen die hij op grond van [artikel 4.8][ref1] of [4.11][ref2] moet terugbetalen,
      automatisch van zijn bankrekening af te schrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0020674
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '4.4'
    text: Onze Minister geeft binnen acht weken na ontvangst van de aanvraag een beschikking.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.4
  - number: 4.5.1
    text: |-
      Onze Minister stelt jaarlijks voor 31 december ten behoeve van het daarop volgende jaar een rentepercentage vast
      dat gelijk is aan het gemiddeld effectief rendement over de maand oktober van dat jaar van de openbare lening,
      uitgegeven door de Staat der Nederlanden en toegelaten tot de notering aan de officiële markt ter beurze van
      Amsterdam, met een resterende looptijd van drie tot vijf jaren.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.5
  - number: 4.5.2
    text: |-
      Bij regeling van Onze Minister worden nadere regels gesteld omtrent de wijze waarop de rente wordt berekend over de
      aangegane lening.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.5
  - number: 4.6.1
    text: De terugbetalingsperiode beslaat ten hoogste tien jaren.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.6
  - number: 4.6.2
    text: |-
      De terugbetalingsperiode vangt aan op de eerste dag van de maand volgend op het in
      [artikel 17, eerste lid, onderdeel a of b, van de wet][ref1] bedoelde tijdstip. De terugbetalingsperiode kan op
      schriftelijk verzoek van de debiteur aanvangen op een eerder tijdstip, in welk geval de aanspraak op de lening
      vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel17
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '17'
  - number: 4.6.3
    text: |-
      Gedurende de in [artikel 17, eerste lid, aanhef, van de wet][ref1] bedoelde aanloopfase van zes maanden bestaat
      geen verplichting tot terugbetaling, doch is wel rente verschuldigd over het bedrag van de lening.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel17
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '17'
  - number: 4.6.4
    text: |-
      In afwijking van het tweede lid, vangt de terugbetalingsperiode voor een persoon als bedoeld in [artikel 4.1][ref1]
      aan zes maanden nadat drie jaar zijn verstreken sedert de verstrekking van de lening of, indien dat eerder is, zes
      maanden nadat aan de inburgeringsplicht is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.7.1
    text: |-
      De terugbetaling van de lening geschiedt in maandelijkse termijnbedragen, behoudens in de bij regeling van Onze
      Minister genoemde gevallen.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.7
  - number: 4.7.2
    text: |-
      De hoogte van het maandelijkse termijnbedrag wordt op basis van het aantal maanden van de terugbetalingsperiode tot
      een gelijk bedrag vastgesteld bij de aanvang van de aanloopfase, bedoeld in [artikel 4.6, derde lid][ref1], dan wel
      binnen acht weken na ontvangst van een verzoek als bedoeld in 4.6, tweede lid, tweede volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.7.3
    text: |-
      Bij regeling van Onze Minister worden nadere regels gesteld over de hoogte van het termijnbedrag alsmede de wijze
      waarop dit wordt berekend.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.7
  - number: 4.8.1
    text: |-
      Binnen acht weken na de aanvang van de aanloopfase, bedoeld in [artikel 4.6, derde lid][ref1], dan wel de ontvangst
      van een verzoek als bedoeld in artikel 4.6, tweede lid, tweede volzin, stelt Onze Minister het termijnbedrag vast
      dat de debiteur overeenkomstig de [artikelen 4.5 tot en met 4.7][ref2] maandelijks moet terugbetalen alsmede de
      periode waarbinnen dit moet gebeuren.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0020674
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.8.2
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld voor het geval de debiteur meer betaalt dan het
      termijnbedrag.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.8
  - number: '4.9'
    text: |-
      Indien de debiteur niet in staat is het overeenkomstig [artikel 4.8][ref1] vastgestelde termijnbedrag te
      voldoen, kan hij bij Onze Minister een aanvraag indienen om zijn draagkracht vast te stellen voor de resterende
      terugbetalingsperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.10.1
    text: |-
      Ter bepaling van de draagkracht van de debiteur wordt het toetsingsinkomen van de debiteur en dat van zijn partner
      als bedoeld in [artikel 3 van de Algemene wet inkomensafhankelijke regelingen][ref1] in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel3
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '3'
  - number: 4.10.2
    text: |-
      Het toetsingsinkomen wordt berekend overeenkomstig
      [artikel 8, eerste, tweede, derde en vijfde lid, van de Algemene wet inkomensafhankelijke regelingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel8
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '8'
  - number: 4.10.3
    text: |-
      Bij regeling van Onze Minister worden nadere regels gesteld ten aanzien van de wijze waarop de draagkracht van de
      debiteur wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.10
  - number: 4.11.1
    text: |-
      Onze Minister geeft binnen acht weken na ontvangst van de aanvraag, bedoeld in [artikel 4.9][ref1], een
      beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.11.2
    text: |-
      Indien het bedrag van de draagkracht lager is dan het overeenkomstig [artikel 4.8][ref1] vastgestelde
      termijnbedrag, wordt het termijnbedrag opnieuw vastgesteld met ingang van de eerste dag van de maand volgend op de
      maand waarin Onze Minister het nieuwe termijnbedrag aan de debiteur bekend heeft gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '4.12'
    text: Bij regeling van Onze Minister worden regels gesteld omtrent verzuim, aanmaning en de invordering van de schuld.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.12
  - number: 4.13.1
    text: |-
      De schuld kan op verzoek van de inburgeringsplichtige door Onze Minister in bij regeling van Onze Minister aan te
      wijzen gevallen geheel of gedeeltelijk worden kwijtgescholden.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.13
  - number: 4.13.2
    text: |-
      Onze Minister geeft binnen acht weken na ontvangst van de aanvraag van een debiteur om gehele of gedeeltelijke
      kwijtschelding een beschikking.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.13
  - number: 4.13.3
    text: |-
      Aan vreemdelingen als bedoeld in [artikel 4.1a, derde lid][ref1], die op of na 1 januari 2013 inburgeringsplichtig
      zijn geworden, wordt volledige kwijtschelding van de schuld ambtshalve verleend indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.13.3.a
    text: |-
      het participatieverklaringstraject, bedoeld in [artikel 7, tweede lid, onderdeel a, van de wet][ref1], is afgerond
      en de onderdelen van het inburgeringsexamen, bedoeld in artikel 7, tweede lid, onderdelen b en c, van de wet, zijn
      behaald;


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '7'
  - number: 4.13.3.b
    text: |-
      een vrijstelling van de inburgeringsplicht van toepassing is op grond van [artikel 5 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel5
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '5'
  - number: 4.13.3.c
    text: |-
      ontheffing is verleend van de inburgeringsplicht als bedoeld in
      [artikel 6, eerste tot en met derde lid, van de wet][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel6
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '6'
  - number: 4.13.3.d
    text: |-
      aan de vreemdeling het Nederlanderschap is verleend en hij op grond van
      [artikel 3, eerste lid, onderdeel c, van het Besluit naturalisatietoets][ref1] was vrijgesteld van het afleggen van
      de naturalisatietoets.


      [ref1]: https://wetten.overheid.nl/BWBR0013604#Artikel3
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0013604
        artikel: '3'
  - number: 4.13.4
    text: |-
      De kwijtschelding, bedoeld in het derde lid, wordt slechts verleend indien de omstandigheid, bedoeld in onderdeel
      a, b, c of d, zich heeft voorgedaan binnen de termijn, genoemd in [artikel 7a, eerste lid, van de wet][ref1]
      respectievelijk de termijn, genoemd in [artikel 7b, eerste lid, van de wet][ref2] of de met toepassing van
      artikel 7a, derde lid, van de wet respectievelijk artikel 7b, derde lid, van de wet of de bij of krachtens
      [artikel 8, eerste lid, aanhef en onderdeel a, van de wet][ref3] verlengde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel7b
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel8
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0020611
        artikel: 7b
      - id: ref3
        bwb_id: BWBR0020611
        artikel: '8'
  - number: 4.14.1
    text: |-
      De schuld die bij het einde van de terugbetalingsperiode resteert omdat overeenkomstig
      [artikel 4.11, tweede lid][ref1], het termijnbedrag opnieuw is vastgesteld, gaat op dat ogenblik teniet, met
      uitzondering van achterstallige termijnbedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.14
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.14.2
    text: De schuld die resteert bij het overlijden van de debiteur gaat op dat ogenblik teniet.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.14
  - number: '4.15'
    text: |-
      De termijnen, bedoeld in [artikel 4.2, eerste lid][ref1], worden verlengd met de duur van de periode, bedoeld in
      [artikel 2.2, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel2
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0020674
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '4.16'
    text: |-
      De [artikelen 3][ref1], [4][ref2] en [6, eerste lid, van de Algemene wet inkomensafhankelijke regelingen][ref3]
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0018472#Artikel6
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0018472
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0018472
        artikel: '6'
  - number: 5.1.1
    text: |-
      De maatschappelijke begeleiding, die de personen, bedoeld in [artikel 18, eerste lid, van de wet][ref1], naast het
      participatieverklaringstraject ontvangen, bevat in ieder geval de volgende componenten:


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel18
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '18'
  - number: 5.1.1.a
    text: praktische hulp bij het regelen van basisvoorzieningen;
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel5.1
  - number: 5.1.1.b
    text: hulp bij het starten van de inburgering; en
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel5.1
  - number: 5.1.1.c
    text: |-
      stimuleren van participatie en integratie door begeleiding en coaching en kennismaking met maatschappelijke
      organisaties.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel5.1
  - number: 5.1.2
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over de invulling van de in het eerste lid genoemde
      onderwerpen.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel5.1
  - number: 6.1.1
    text: 'Het Informatiesysteem Inburgering bevat uitsluitend persoonsgegevens van:'
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel6.1
  - number: 6.1.1.a
    text: inburgeringsplichtigen en gewezen inburgeringsplichtigen;
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel6.1
  - number: 6.1.1.b
    text: |-
      andere dan de in onderdeel a bedoelde personen, die deelnemen aan het inburgeringsexamen of aan wie een lening is
      verstrekt ten behoeve van het volgen van een inburgeringscursus of het afleggen van het inburgeringsexamen;
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel6.1
  - number: 6.1.1.c
    text: |-
      partners van inburgeringsplichtigen, indien overeenkomstig [artikel 4.1a, tweede lid][ref1], de hoogte van de
      lening wordt bepaald of overeenkomstig [artikel 4.10][ref2] de draagkracht van de debiteur wordt bepaald;


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0020674
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 6.1.1.d
    text: |-
      personen ten aanzien van wie is gebleken dat zij aansluitend op de leerplicht of kwalificatieplicht een opleiding
      volgen als bedoeld in [artikel 5, eerste lid, onderdeel e, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel5
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '5'
  - number: 6.1.1.e
    text: |-
      personen ten aanzien van wie op redelijke gronden kan worden vermoed dat zij inburgeringsplichtig zijn of kunnen
      worden.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel6.1
  - number: 6.1.2
    text: |-
      Het Informatiesysteem Inburgering bevat de in de bijlage bij dit besluit opgenomen gegevens. Persoonsgegevens
      worden opgenomen zoals deze zijn opgenomen in de basisregistratie personen.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel6.1
  - number: 6.1.3
    text: Bij regeling van Onze Minister kan de bijlage bij dit besluit worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel6.1
  - number: 6.2.1
    text: |-
