  - number: 7.5.2
    text: |-
      Het college verstrekt de gegevens, bedoeld in de letters B, D, H, J, L, N, R, T, V en X van het eerste lid, tezamen
      met de jaarrekening, bedoeld in [artikel 186 van de Gemeentewet][ref1], welke betrekking heeft op het jaar 2011.
      Het college verstrekt de gegevens, bedoeld in de letters Z en BB van het eerste lid, tezamen met de jaarrekening,
      bedoeld in [artikel 186 van de Gemeentewet][ref2], welke betrekking heeft op het jaar 2008. De jaarrekening is
      voorzien van de accountantsverklaring, bedoeld in [artikel 213, derde lid, van de Gemeentewet][ref3]. Het college
      vergewist zich ervan dat de gegevens zijn opgenomen in het Informatiesysteem Inburgering.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel186
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel186
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel213
