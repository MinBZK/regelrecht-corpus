  - number: 2.2.1
    text: |-
      De inburgeringsplicht eindigt niet, indien de vreemdeling direct aansluitend op de periode
      waarin hij op grond van [artikel 3, eerste lid, van de wet][ref1] inburgeringsplichtig was of
      op de termijn, bedoeld in [artikel 3.82, eerste lid, van het Vreemdelingenbesluit 2000][ref2],
      rechtmatig verblijf in de zin van [artikel 8, onderdeel g of h, van de Vreemdelingenwet 2000][ref3]
      heeft verkregen. In deze gevallen wordt de inburgeringsplicht tijdens de termijn, bedoeld in
      [artikel 3.82, eerste lid, van het Vreemdelingenbesluit 2000][ref4], geacht niet te zijn geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 2.2.2
    text: |-
