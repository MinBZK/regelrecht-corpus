        artikel: '47'
  - number: 6.2.4
    text: |-
      De instanties, genoemd in het eerste lid, verstrekken de gegevens zo spoedig mogelijk doch uiterlijk binnen twee
      weken na het ontstaan van de noodzaak tot opneming in het Informatiesysteem Inburgering.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel6.2
  - number: 6.2.5
    text: |-
      Bij regeling van Onze Minister kunnen andere instanties worden aangewezen ten aanzien waarvan de in het eerste
      lid bedoelde verplichting eveneens geldt of waaraan eveneens gegevens uit het Informatiesysteem Inburgering worden
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel6.2
  - number: 6.2.6
    text: |-
      In opdracht van Onze Minister kunnen ten behoeve van het verrichten van rechtmatigheids- en
      doelmatigheidsonderzoeken gegevens uit het Informatiesysteem Inburgering worden verstrekt die kunnen worden
      herleid tot een natuurlijk persoon. In de rapportages over deze onderzoeken worden geen tot die persoon herleidbare
      gegevens opgenomen.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel6.2
