      beleid, bedoeld in [artikel 47, tweede lid, onderdeel b, van de wet][ref1], geschiedt zodanig dat de gegevens niet
      kunnen worden herleid tot een natuurlijk persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel47
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel6.2
