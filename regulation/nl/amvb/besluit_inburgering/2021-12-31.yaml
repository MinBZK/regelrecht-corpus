        artikel: I
  - number: 7.7.4
    text: Onze Minister maakt de hoogte van de bijdragevergoedingen jaarlijks voor 15 september bekend.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel7.7
  - number: 7.8.1
    text: |-
      Gemeenten kunnen in onderling overleg besluiten tot een gezamenlijke aanwending van de aan hen te verstrekken
      rijksbijdragen.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel7.8
  - number: 7.8.2
    text: |-
      In geval van samenwerking als bedoeld in het eerste lid dragen de deelnemende gemeenten de hen bij of krachtens dit
      hoofdstuk toekomende rechten en de bij of krachtens dit hoofdstuk op hen rustende verplichtingen over aan een van
      hen, dan wel aan een openbaar lichaam als bedoeld in [artikel 8 van de Wet gemeenschappelijke regelingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '8'
  - number: 7.8.3
    text: |-
      De colleges wie het betreft stellen Onze Minister voor 1 september, voorafgaand aan het jaar waarop de samenwerking
      betrekking heeft, in kennis van de samenwerking. Deze kennisgeving bevat in ieder geval:
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel7.8
  - number: 7.8.3.a
    text: de namen van de deelnemende gemeenten;
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel7.8
  - number: 7.8.3.b
    text: |-
      de naam van de gemeente dan wel het openbaar lichaam aan wie de in het tweede lid genoemde rechten en
      verplichtingen zijn overgedragen;
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel7.8
  - number: 7.8.3.c
    text: |-
      een verklaring van de deelnemende gemeenten waaruit de in het tweede lid bedoelde overdracht van rechten en
      verplichtingen blijkt.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel7.8
  - number: 7.9.1
    text: |-
      Onze Minister kan de vastgestelde rijksbijdrage binnen een periode van vijf jaar na de bekendmaking ervan intrekken
      of ten nadele van de gemeente wijzigen:
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel7.9
  - number: 7.9.1.a
    text: |-
      indien er sprake is van feiten of omstandigheden waarvan Onze Minister bij de vaststelling van de rijksbijdrage
      redelijkerwijs niet op de hoogte kon zijn en op grond waarvan de rijksbijdrage lager zou zijn vastgesteld;
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel7.9
  - number: 7.9.1.b
    text: indien de vaststelling van de rijksbijdrage onjuist was en de gemeente dit wist of behoorde te weten;
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel7.9
  - number: 7.9.1.c
    text: |-
      indien de gemeente na de vaststelling van de rijksbijdrage niet heeft voldaan aan de regels en voorschriften,
      vastgesteld bij en krachtens dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel7.9
  - number: 7.9.2
    text: |-
      De intrekking of wijziging werkt terug tot en met het tijdstip waarop de rijksbijdrage is vastgesteld, tenzij bij
      de intrekking of wijziging anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel7.9
  - number: 7.10.1
    text: |-
      Bij het geheel of gedeeltelijk intrekken van de rijksbijdrage op grond van [artikel 7.9][ref1] besluit Onze
      Minister tot:


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel7
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel7.10
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '1'
  - number: 7.10.1.a
    text: het onmiddellijk terugvorderen van de middelen, of
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel7.10
  - number: 7.10.1.b
    text: het verrekenen van de middelen met nog te betalen rijksbijdragen.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel7.10
  - number: 7.10.2
    text: |-
      Indien Onze Minister toepassing geeft aan het eerste lid, onderdeel a, betaalt het college de middelen terug binnen
      drie maanden na de bekendmaking van het daartoe strekkende besluit van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel7.10
  - number: 7.10.3
    text: |-
      Na het verstrijken van de termijn, bedoeld in het tweede lid, is de gemeente zonder aanmaning of rechterlijke
      tussenkomst de wettelijke rente verschuldigd.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel7.10
  - number: 7.10.4
    text: |-
      Indien volledige terugvordering naar het oordeel van Onze Minister tot een onbillijkheid van overwegende aard
      leidt, stelt Onze Minister de terugvordering op een lager bedrag vast.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel7.10
  - number: '7.11'
    text: |-
      In deze afdeling wordt verstaan onder: nieuwe inburgeringsplichtigen: inburgeringsplichtigen als bedoeld in
      het besluit van de Staatssecretaris van Justitie van 12 juni 2007, nr. 2007/11, houdende wijziging van de
      Vreemdelingencirculaire 2000, aan wie geen persoonsvolgend budget is verstrekt.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel7.11
  - number: 7.12.1
    text: |-
      Op de vaststelling van de rijksbijdrage voor een gemeente ten behoeve van nieuwe inburgeringsplichtigen zijn de
      [artikelen 7.1 tot en met 7.7][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel7
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel7.12
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '1'
  - number: 7.12.2
    text: |-
      Op de vaststelling van de rijksbijdrage voor een gemeente ten behoeve van nieuwe inburgeringsplichtigen zijn de
      [artikelen 7.8 tot en met 7.10][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel7
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel7.12
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '1'
  - number: '7.13'
    text: |-
      De rijksbijdrage voor een gemeente ten behoeve van nieuwe inburgeringsplichtigen wordt berekend op de grondslag
      van:
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel7.13
  - number: 7.13.a
    text: |-
      het aantal nieuwe inburgeringsplichtigen, ten behoeve van wie het college voor de eerste keer een
      inburgeringsvoorziening, een duale inburgeringsvoorziening of een taalkennisvoorziening als bedoeld
      in [artikel 19, derde lid, van de wet][ref1], zoals die luidde voor de inwerkingtreding van de
      [Wet participatiebudget][ref2] heeft vastgesteld en aan wie geen lening is verstrekt, hetzij ten behoeve van wie
      die lening in zijn geheel is terugbetaald;


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0025039
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel7.13
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0025039
  - number: 7.13.b
    text: |-
      het aantal in onderdeel a bedoelde nieuwe inburgeringsplichtigen dat binnen drie kalenderjaren nadat voor hen de
      inburgeringsvoorziening is vastgesteld, heeft deelgenomen aan het inburgeringsexamen of het examen, bedoeld in
      [artikel 2.3, eerste lid, onderdeel c][ref1], zoals dit luidde op 31 december 2014.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel7.13
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 7.15.1
    text: |-
      De rijksbijdrage voor een gemeente ten behoeve van de nieuwe inburgeringsplichtigen wordt berekend met de formule:
      A = [ B x C ] + [ D x E] + [F x G] + [H x I] waarin wordt voorgesteld: - met de letter A: de rijksbijdrage ten
      behoeve van nieuwe inburgeringsplichtigen;
        - met de letter B: het aantal nieuwe inburgeringsplichtigen ten behoeve van wie het college voor de eerste keer
      een inburgeringsvoorziening heeft vastgesteld en aan wie geen lening is verstrekt, hetzij ten behoeve van wie die
      lening in zijn geheel is terugbetaald;
        - met de letter C: de bijdragevergoeding ten aanzien van de vaststelling van de inburgeringsvoorziening ten behoeve
      van nieuwe inburgeringsplichtigen;
        - met de letter D: het aantal in de letter B bedoelde nieuwe inburgeringsplichtigen dat binnen drie kalenderjaren
      nadat voor hen de inburgeringsvoorziening is vastgesteld, heeft deelgenomen aan het inburgeringsexamen of het
      examen, bedoeld in [artikel 2.3, eerste lid, onderdeel c][ref1], zoals dit luidde op 31 december 2014;
        - met de letter E: de bijdragevergoeding ten aanzien van de deelname aan een van de examens, bedoeld in letter D;
        - met de letter F: het aantal nieuwe inburgeringsplichtigen ten behoeve van wie het college voor de eerste keer een
      duale inburgeringsvoorziening heeft vastgesteld en aan wie geen lening is verstrekt, hetzij ten behoeve van wie die
      lening in zijn geheel is terugbetaald;
        - met de letter G: de bijdragevergoeding ten aanzien van de vaststelling van de duale inburgeringsvoorziening ten
      behoeve van nieuwe inburgeringsplichtigen;
        - met de letter H: het aantal nieuwe inburgeringsplichtigen ten behoeve van wie het college voor de eerste keer
      een taalkennisvoorziening als bedoeld in [artikel 19, derde lid, van de wet][ref2], zoals die luidde voor de
      inwerkingtreding van de [Wet participatiebudget][ref3] heeft vastgesteld en aan wie geen lening is verstrekt,
      hetzij ten behoeve van wie die lening in zijn geheel is terugbetaald;
        - met de letter I: de bijdragevergoeding ten aanzien van de vaststelling van de taalkennisvoorziening ten behoeve
      van nieuwe inburgeringsplichtigen.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0025039
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel7.15
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '19'
      - id: ref3
        bwb_id: BWBR0025039
  - number: 7.15.2
    text: |-
      Het college verstrekt de gegevens, bedoeld in de letters B, D, F en H van het eerste lid,
      tezamen met de jaarrekening, bedoeld in [artikel 186 van de Gemeentewet][ref1], welke betrekking
      heeft op het jaar 2011. De jaarrekening is voorzien van de accountantsverklaring, bedoeld in
      [artikel 213, derde lid, van de Gemeentewet][ref2]. Het college vergewist zich ervan dat de gegevens zijn opgenomen
      in het Informatiesysteem Inburgering.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel186
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel213
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel7.15
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '186'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '213'
  - number: 7.15.3
    text: |-
      Indien Onze Minister de gegevens en de accountantsverklaring niet binnen zesentwintig weken na het verstrijken van
      de termijn, bedoeld in [artikel 17b, derde lid, aanhef en onderdeel a, van de Financiële-verhoudingswet][ref1],
      heeft ontvangen, stelt Onze Minister de rijksbijdrage vast op nul.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17b
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel7.15
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17b
  - number: 7.15.4
    text: |-
      Onze Minister stelt de rijksbijdrage ten behoeve van nieuwe inburgeringsplichtigen
      uiterlijk dertig weken na het verstrijken van de termijn, bedoeld in
      [artikel 17b, derde lid, aanhef en onderdeel a, van de Financiële-verhoudingswet][ref1], vast.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17b
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel7.15
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17b
  - number: 7.15.5
    text: |-
      De rijksbijdrage wordt vastgesteld onder voorbehoud van goedkeuring van de beschikbare middelen door de
      begrotingswetgever en kan worden verlaagd in verband met wijzigingen van de rijksbegroting voor het jaar 2012 dan
      wel het jaar 2013.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel7.15
  - number: 7.15.6
    text: |-
      De rijksbijdrage wordt verrekend met het voorschot dat is verleend ten behoeve van de jaren 2007 en 2008. Het uit
      de verrekening resulterende positieve of negatieve saldo wordt uiterlijk zes maanden na de vaststelling ervan aan
      een gemeente betaald.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel7.15
  - number: 7.16.1
    text: |-
      Onze Minister stelt ten behoeve van de vaststelling van de rijksbijdrage voor een gemeente ten behoeve van nieuwe
      inburgeringsplichtigen jaarlijks de bijdragevergoedingen, bedoeld in [artikel 7.15][ref1], vast.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel7
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel7.16
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '2'
  - number: 7.16.2
    text: Onze Minister maakt de hoogte van de bijdragevergoedingen jaarlijks voor 15 november bekend.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel7.16
  - number: '9.1'
    text: Vrijgesteld van de inburgeringsplicht is degene die voor 1 januari 2015 inburgeringsplichtig is geworden en
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel9.1
  - number: 9.1.a
    text: |-
      beschikt over een diploma staatsexamen Nederlands als tweede taal I of II als bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel c, van de Wet educatie en beroepsonderwijs][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 9.1.b
    text: |-
      in aanmerking zou zijn gekomen voor een vrijstelling van de inburgeringsplicht op grond van
      [artikel 2.3, eerste lid, onderdeel b][ref1], zoals dit onderdeel luidde op 31 december 2014.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 9.3.1
    text: |-
      De inburgeringsplichtige die op 1 januari 2007 deelneemt aan een opleiding educatie als bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel d, van de Wet educatie en beroepsonderwijs][ref1], blijft toegelaten tot
      deze opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 9.3.2
    text: |-
      Het college kan de opleidingen educatie, bedoeld in het eerste lid, bekostigen uit het prestatie-afhankelijke deel
      van de rijksbijdrage dat betrekking heeft op het jaar 2007.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel9.3
  - number: 9.3.3
    text: |-
      Indien het college toepassing geeft aan het tweede lid, doet het college opgave van het daarmee gemoeide bedrag,
      alsmede het aantal opleidingen educatie, bedoeld in het eerste lid, tezamen met de jaarrekening, bedoeld in
      [artikel 186 van de Gemeentewet][ref1], welke betrekking heeft op het jaar 2007. De jaarrekening is voorzien van de
      accountantsverklaring, bedoeld in [artikel 213, derde lid, van de Gemeentewet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel186
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel213
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '186'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '213'
  - number: 9.8.1
    text: De wet en dit besluit treden in werking op 1 januari 2007.
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel9.8
  - number: 9.8.2
    text: |-
      [Artikel 65 van de wet][ref1] werkt terug tot en met 1 januari 2006.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel65
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel9.8
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '65'
  - number: '9.9'
    text: 'Dit besluit wordt aangehaald als: Besluit inburgering.'
    url: https://wetten.overheid.nl/BWBR0020674/2021-12-31#Artikel9.9
