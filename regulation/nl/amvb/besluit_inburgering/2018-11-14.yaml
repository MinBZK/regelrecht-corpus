  - number: '6.3'
    text: |-
      1 In het Informatiesysteem Inburgering opgenomen persoonsgegevens worden verwijderd:

      a. na verloop van twintig jaren, of

      b. indien de betrokken persoon is overleden.

      2 In afwijking van de in het eerste lid, onderdeel a, genoemde termijn worden de volgende gegevens van personen als
      bedoeld in [artikel 6.1, eerste lid, onderdeel a][ref1], verwijderd na verloop van vijftig jaar:

      a. burgerservicenummer;

      b. naamgegevens;

      c. adresgegevens;

      d. woonplaats;

      e. geboortedatum;

      f. gegevens die betrekking hebben op gehele of gedeeltelijke vrijstelling van de inburgeringsplicht;

      g. gegevens die betrekking hebben op een ontheffing van de inburgeringsplicht;

      h. de datum en de wijze waarop aan de inburgeringsplicht is voldaan;

      i. gegevens over een tijdelijke of definitief niet invorderbare schuld terzake van een lening.

      3 In afwijking van de in het eerste lid, onderdeel a, genoemde termijn worden de volgende gegevens van personen als
      bedoeld in [artikel 6.1, eerste lid, onderdeel b][ref2], verwijderd na verloop van vijftig jaar:

      a. burgerservicenummer;

      b. naamgegevens;

      c. adresgegevens;

      d. woonplaats;

      e. geboortedatum;

      f. de datum waarop het inburgeringsdiploma is behaald.

      4 De termijnen, genoemd in het eerste lid, onderdeel a, en in de aanhef van het tweede en derde lid, vangen aan op
      de dag waarop de gegevens in het Informatiesysteem Inburgering zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel6.1
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel6.1
