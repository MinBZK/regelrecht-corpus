  - number: '4.9'
    text: |-
      Indien de debiteur niet in staat is het overeenkomstig [artikel 4.8][ref1] vastgestelde termijnbedrag te
      voldoen, kan hij bij Onze Minister een aanvraag indienen om zijn draagkracht vast te stellen voor de resterende
      terugbetalingsperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4.8
    url: https://wetten.overheid.nl/BWBR0020674/2018-11-14#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4.8'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '4.10'
    text: |-
      1 Ter bepaling van de draagkracht van de debiteur wordt het toetsingsinkomen van de debiteur en dat van zijn
      partner als bedoeld in [artikel 3 van de Algemene wet inkomensafhankelijke regelingen][ref1] in aanmerking genomen.

      2 Het toetsingsinkomen wordt berekend overeenkomstig
      [artikel 8, eerste, tweede, derde en vijfde lid, van de Algemene wet inkomensafhankelijke regelingen][ref2].

      3 Bij regeling van Onze Minister worden nadere regels gesteld ten aanzien van de wijze waarop de draagkracht van de
      debiteur wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel8
