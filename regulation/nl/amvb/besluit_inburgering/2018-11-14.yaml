  - number: '9.1'
    text: |-
      Vrijgesteld van de inburgeringsplicht is degene die voor 1 januari 2015 inburgeringsplichtig is geworden en

      a. beschikt over een diploma staatsexamen Nederlands als tweede taal I of II als bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel c, van de Wet educatie en beroepsonderwijs][ref1], of

      b. in aanmerking zou zijn gekomen voor een vrijstelling van de inburgeringsplicht op grond van
      [artikel 2.3, eerste lid, onderdeel b][ref2], zoals dit onderdeel luidde op 31 december 2014.


