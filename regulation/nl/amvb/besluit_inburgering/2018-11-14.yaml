  - number: '3.10'
    text: |-
      1 Het inburgeringsdiploma wordt uitgereikt door Onze Minister.

      2 Het inburgeringsdiploma wordt ondertekend door Onze Minister.

      3 Duplicaten van inburgeringsdiploma’s worden tegen betaling van de kostprijs, uitsluitend door Onze Minister
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0020674/2018-11-14#Artikel3.10
  - number: '3.13'
    text: |-
      Bij regeling van Onze Minister worden normen voor de kwaliteit van de examinering vastgesteld die in ieder geval
      betrekking hebben op:

      a. de afname van de onderdelen van het inburgeringsexamen;

      b. de voorwaarden voor toelating tot de onderdelen van het inburgeringsexamen;

      c. de deskundigheid van de examinatoren en beoordelaars;

      d. het vaststellen van de uitslag van de onderdelen van het inburgeringsexamen;

      e. de waarborging van de kwaliteit van de examinering.
    url: https://wetten.overheid.nl/BWBR0020674/2018-11-14#Artikel3.13
  - number: 3a.1
    text: |-
      Als instelling die een keurmerk als bedoeld in [artikel 12a, eerste lid, van de wet][ref1] kan afgeven, kan worden
      aangewezen de instelling die:

      a. rechtspersoonlijkheid heeft;

      b. onafhankelijk is;

      c. beschikt over voldoende deskundigheid en toerusting om de uitvoering van deze taak naar behoren te vervullen; en

      d. naar behoren functioneert.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel12a
    url: https://wetten.overheid.nl/BWBR0020674/2018-11-14#Artikel3a.1
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: 12a
  - number: '4.1'
    text: |-
      Tenzij uitdrukkelijk anders is bepaald, zijn de bepalingen in dit hoofdstuk van overeenkomstige toepassing op de
      persoon, bedoeld in [artikel 5, tweede lid, van de wet][ref1], die rechtmatig verblijf verkrijgt als bedoeld in
      [artikel 8, onderdeel e of l, van de Vreemdelingenwet 2000][ref2] en die:

      a. anders dan voor een tijdelijk doel als bedoeld in [artikel 2.1][ref3] in Nederland verblijft;

      b. ouder dan 16 jaar is dan wel de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref4] nog niet heeft bereikt;

      c. minder dan acht jaren tijdens de leerplichtige leeftijd in Nederland heeft verbleven;

      d. niet beschikt over een bij of krachtens algemene maatregel van bestuur aangewezen diploma, certificaat of ander
      document;

      e. niet leerplichtig of kwalificatieplichtig is, dan wel een opleiding volgt waarvan de afronding leidt tot
      uitreiking van een bij of krachtens algemene maatregel van bestuur aangewezen diploma, certificaat of ander
      document.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0020674#Artikel2.1
      [ref4]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
