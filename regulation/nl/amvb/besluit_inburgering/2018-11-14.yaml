      - id: ref3
        bwb_id: BWBR0020674
        artikel: '2.2'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '2.12'
    text: |-
      1 Een aanvraag tot verlenging van de voor de inburgeringsplichtige geldende termijnen, bedoeld in de
      [artikelen 7a, eerste lid][ref1], en [7b, eerste lid, van de wet][ref2], kan niet eerder worden ingediend dan zes
      maanden voor het verstrijken van die termijn. Onze Minister geeft binnen acht weken na ontvangst van de aanvraag
      een beschikking.

      2 In bijzondere gevallen die de inburgeringsplichtige betreffen, kan Onze Minister ambtshalve besluiten tot
      verlenging van de voor de inburgeringsplichtige geldende termijnen, bedoeld in de [artikelen 7a, eerste lid][ref3],
      en [7b, eerste lid, van de wet][ref4]. De beschikking wordt niet eerder gegeven dan zes maanden voor het
      verstrijken van die termijn.

      3 In de beschikking wordt de duur van de verlenging vermeld.

      4 Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de verlenging van de termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel7b
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel7a
      [ref4]: https://wetten.overheid.nl/BWBR0020611#Artikel7b
