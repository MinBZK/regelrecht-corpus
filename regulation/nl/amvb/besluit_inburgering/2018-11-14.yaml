      1 Het verblijf in Nederland tijdens de leerplichtige leeftijd, bedoeld in
      [artikel 5, eerste lid, onderdeel b, van de wet][ref1], blijkt uit inschrijving als ingezetene in de
      basisregistratie personen.

      2 Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de toepassing van het eerste lid en
      kan van het eerste lid worden afgeweken op grond van concrete aanwijzingen dat de inschrijving kennelijk onjuist
      was.


