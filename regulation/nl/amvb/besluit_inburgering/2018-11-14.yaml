  - number: '4.2'
    text: |-
      1 De inburgeringsplichtige heeft, behoudens het bepaalde in [artikel 16, eerste lid, tweede zin, van de wet][ref1],
      aanspraak op de lening gedurende de termijn, bedoeld in de [artikelen 7a, eerste lid][ref2], en
      [7b, eerste lid, van de wet][ref3], gedurende de verlengde termijn bedoeld in de artikelen 7a, derde lid, 7b,
      derde lid, en [8, eerste lid, aanhef en onderdeel a, van de wet][ref4] en gedurende de termijn, genoemd in
      de boetebeschikking, bedoeld in de [artikelen 29][ref5] en [32 van de wet][ref6]. Een persoon als bedoeld in
      [artikel 4.1][ref7] heeft aanspraak op de lening gedurende drie jaar nadat hij rechtmatig verblijf verkrijgt.

      2 Het geleende bedrag wordt niet uitbetaald, indien de inburgeringsplichtige:

      a. niet langer ingezetene is in de zin van de [Wet basisregistratie personen][ref8];

      b. als vreemdeling geen rechtmatig verblijf meer heeft in de zin van
      [artikel 8, onderdelen a, c, e en l van de Vreemdelingenwet 2000][ref9], dan wel, in de in
      [artikel 2.2, eerste lid][ref10], bedoelde gevallen, in de zin van artikel 8, onderdelen g of h, van de
      Vreemdelingenwet 2000;

      c. overeenkomstig [artikel 16, eerste lid, tweede zin, van de wet][ref11] geen of niet langer aanspraak heeft op
      een lening.

      3 Bij regeling van Onze Minister worden regels gesteld over de betaling van de lening.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel7a
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel7b
      [ref4]: https://wetten.overheid.nl/BWBR0020611#Artikel8
