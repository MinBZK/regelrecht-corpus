  - number: '4.12'
    text: Bij regeling van Onze Minister worden regels gesteld omtrent verzuim, aanmaning en de invordering van de schuld.
    url: https://wetten.overheid.nl/BWBR0020674/2018-11-14#Artikel4.12
  - number: '4.13'
    text: |-
      1 De schuld kan op verzoek van de inburgeringsplichtige door Onze Minister in bij regeling van Onze Minister aan te
      wijzen gevallen geheel of gedeeltelijk worden kwijtgescholden.

      2 Onze Minister geeft binnen acht weken na ontvangst van de aanvraag van een debiteur om gehele of gedeeltelijke
      kwijtschelding een beschikking.

      3 Aan vreemdelingen als bedoeld in [artikel 4.1a, derde lid][ref1], die op of na 1 januari 2013
      inburgeringsplichtig zijn geworden, wordt volledige kwijtschelding van de schuld ambtshalve verleend indien:

      a. het participatieverklaringstraject, bedoeld in [artikel 7, tweede lid, onderdeel a, van de wet][ref2], binnen de
      termijn, [genoemd in artikel 7a, eerste lid, van de wet][ref3], of binnen de met toepassing van artikel 7a, derde
      lid, van de wet of de bij of krachtens [artikel 8, eerste lid, aanhef en onderdeel a, van de wet][ref4] gestelde
      regels verlengde termijn is afgerond en de onderdelen van het inburgeringsexamen, bedoeld in artikel 7, tweede lid,
      onderdelen b en c, van de wet, binnen de termijn, genoemd in [artikel 7b, eerste lid, van de wet][ref5], of de met
      toepassing van artikel 7b, derde lid, van de wet of de bij of krachtens artikel 8, eerste lid, aanhef en onderdeel
      a, van de wet gestelde regels verlengde termijn zijn behaald; of

      b. een vrijstelling van de inburgeringsplicht van toepassing is op grond van [artikel 5 van de wet][ref6]; of

      c. ontheffing is verleend van de inburgeringsplicht als bedoeld in
      [artikel 6, eerste tot en met derde lid, van de wet][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4.1a
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel7
