  - number: '2.1'
    text: |-
      1 Het doel van het verblijf in Nederland van de houder van een verblijfsvergunning voor bepaalde
      tijd als bedoeld in [artikel 14 van de Vreemdelingenwet 2000][ref1] is tijdelijk in de zin van
      [artikel 3, eerste lid, onderdeel a, van de wet][ref2], indien die verblijfsvergunning is verleend onder een
      beperking verband houdend met:

      a. uitwisseling, al dan niet in het kader van een verdrag;

      b. studie;

      c. seizoenarbeid;

      d. lerend werken;

      e. arbeid in loondienst;

      f. grensoverschrijdende dienstverlening;

      g. arbeid als niet-geprivilegieerd militair of niet-geprivilegieerd burgerpersoneel;

      h. arbeid als kennismigrant;

      i. verblijf als houder van de Europese blauwe kaart in de zin van richtlijn 2009/50/EG van de Raad van 25 mei
      2009 betreffende de voorwaarden voor toegang en verblijf van onderdanen van derde landen met het oog op een
      hooggekwalificeerde baan (PbEU L 155);

      j. onderzoek in de zin van richtlijn (EU) 2016/801;

      k. arbeid als zelfstandige;

      l. het zoeken en verrichten van arbeid al dan niet in loondienst;

      m. verblijf als familie- of gezinslid bij een persoon die voor een tijdelijk doel in Nederland verblijft;

      n. medische behandeling;

      o. het afwachten van een verzoek op grond van [artikel 17 van de Rijkswet op het Nederlanderschap][ref3];

      p. tijdelijke humanitaire gronden;

      q. verblijf als vermogende vreemdeling als bedoeld in [artikel 3.29a van het Vreemdelingenbesluit 2000][ref4];

      r. overplaatsing binnen een onderneming.

      2 Het doel van het verblijf van een houder van een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 14 van de Vreemdelingenwet 2000][ref5], verleend onder een andere beperking dan bedoeld in het eerste lid,
      is tijdelijk in de zin van [artikel 3, eerste lid, onderdeel a, van de wet][ref6], indien zulks met toepassing van
      [artikel 3.5, vierde lid, van het Vreemdelingenbesluit 2000][ref7] is bepaald.

      3 Het doel van het verblijf van de houder van een verblijfsvergunning als bedoeld in
      [artikel 8, onder b, c en d van de Vreemdelingenwet 2000][ref8] is niet tijdelijk in de zin van
      [artikel 3, eerste lid, onderdeel a, van de wet][ref9].

      4 Bij regeling van Onze Minister kunnen de beperkingen, bedoeld in het eerste en tweede lid, nader worden
      uitgewerkt.


