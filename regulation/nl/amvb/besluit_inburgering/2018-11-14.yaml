        artikel: '2.8'
        hoofdstuk: '2'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '3'
  - number: '3.6'
    text: |-
      1 Indien een kandidaat zich ten aanzien van een onderdeel van het inburgeringsexamen aan enige onregelmatigheid
      schuldig maakt of heeft gemaakt, kan Onze Minister het inburgeringsexamen ongeldig verklaren en bepalen dat de
      kandidaat het inburgeringsexamen of een onderdeel daarvan opnieuw moet afleggen.

      2 Indien de onregelmatigheid eerst na afloop van het examen wordt ontdekt, kan Onze Minister het examenresultaat
      ongeldig verklaren.
    url: https://wetten.overheid.nl/BWBR0020674/2018-11-14#Artikel3.6
  - number: '3.9'
    text: |-
      1 Het inburgeringsexamen bestaat wat betreft het participatieverklaringstraject, bedoeld in
      [artikel 7, tweede lid, onderdeel a, van de wet][ref1], uit de volgende onderdelen:

      a. een inleiding op de Nederlandse kernwaarden;

      b. de ondertekening van de participatieverklaring.

      2 Het inburgeringsexamen bestaat voor wat betreft de examinering van de mondelinge en schriftelijke vaardigheden in
      de Nederlandse taal, bedoeld in [artikel 7, tweede lid, onderdeel b, van de wet][ref2], uit de volgende onderdelen:

      a. leesvaardigheid;

      b. luistervaardigheid;

      c. schrijfvaardigheid;

      d. spreekvaardigheid.

      3 Het inburgeringsexamen bestaat voor wat betreft de examinering van de kennis van de Nederlandse samenleving,
      bedoeld in [artikel 7, tweede lid, onderdeel c, van de wet][ref3], uit de volgende onderdelen:

      a. kennis van de Nederlandse maatschappij;

      b. oriëntatie op de Nederlandse arbeidsmarkt.

      4 Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de onderdelen van het
      inburgeringsexamen, genoemd in het eerste tot en met derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel7
    url: https://wetten.overheid.nl/BWBR0020674/2018-11-14#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0020611
        artikel: '7'
  - number: 3.9a
    text: |-
      1 Het participatieverklaringstraject wordt wat betreft het onderdeel inleiding op de Nederlandse kernwaarden
      afgelegd door het deelnemen aan een door of namens het college aangeboden inleiding op de Nederlandse
      kernwaarden en wat betreft het onderdeel ondertekenen van de participatieverklaring door het aanwezig zijn bij de
      ondertekeningsbijeenkomst en het aldaar ondertekenen van de participatieverklaring.

      2 De onderdelen leesvaardigheid, luistervaardigheid en spreekvaardigheid van het inburgeringsexamen worden afgelegd
      door middel van een door Onze Minister beheerd geautomatiseerd systeem.

      3 Het onderdeel schrijfvaardigheid van het inburgeringsexamen wordt schriftelijk afgelegd.

      4 Het onderdeel kennis van de Nederlandse samenleving van het inburgeringsexamen wordt voor wat betreft het
      onderdeel oriëntatie op de Nederlandse arbeidsmarkt afgelegd door middel van een praktijkexamen en voor wat betreft
      het onderwerp kennis van de Nederlandse maatschappij door middel van een door Onze Minister beheerd geautomatiseerd
      systeem.

      5 Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de wijze van examineren.
    url: https://wetten.overheid.nl/BWBR0020674/2018-11-14#Artikel3.9a
  - number: 3.9b
    text: |-
      1 Bij het participatieverklaringstraject worden door het college de aanwezigheid van de inburgeringsplichtige bij
      de inleiding op de Nederlandse kernwaarden, aanwezigheid bij de ondertekeningsbijeenkomst en de ondertekening van
      de participatieverklaring geregistreerd.

      2 De resultaten van de onderdelen leesvaardigheid en luistervaardigheid van het inburgeringsexamen
      worden beoordeeld door Onze Minister door middel van het geautomatiseerde systeem, bedoeld in
      [artikel 3.9a, tweede lid][ref1]. Het onderdeel spreekvaardigheid van het inburgeringsexamen wordt voor een deel
      beoordeeld door middel van het geautomatiseerde systeem, bedoeld in artikel 3.9a, tweede lid, en voor het overige
      deel door de door Onze Minister aan te wijzen beoordelaars.

      3 Het onderdeel schrijfvaardigheid wordt beoordeeld door de door Onze Minister aan te wijzen beoordelaars.

      4 Het onderdeel kennis van de Nederlandse samenleving van het inburgeringsexamen, bedoeld in
      [artikel 3.9a, vierde lid][ref2], wordt voor wat betreft het onderdeel kennis van de Nederlandse maatschappij
      door middel van een geautomatiseerd systeem beoordeeld en het praktijkexamen van het onderdeel oriëntatie op de
      Nederlandse arbeidsmarkt wordt door examinatoren beoordeeld.

      5 Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de beoordeling van het examen.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3.9a
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel3.9a
    url: https://wetten.overheid.nl/BWBR0020674/2018-11-14#Artikel3.9b
