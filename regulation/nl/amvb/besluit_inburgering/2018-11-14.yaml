  - number: 2.8a
    text: |-
      1 Onze Minister verleent op aanvraag ontheffing van de inburgeringsplicht, indien Onze Minister van oordeel is dat
      een inburgeringsplichtige aantoonbaar voldoende is ingeburgerd.

      2 Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de verlening van de ontheffing.
    url: https://wetten.overheid.nl/BWBR0020674/2018-11-14#Artikel2.8a
  - number: 2.8b
    text: |-
      1 Een aanvraag tot ontheffing van de inburgeringsplicht op grond van door de inburgeringsplichtige aantoonbaar
      geleverde inspanningen als bedoeld in [artikel 6, tweede lid, van de wet][ref1], kan niet eerder worden
      ingediend dan zes maanden voor het verstrijken van de voor de inburgeringsplichtige geldende termijn, bedoeld in
      [artikel 7b, eerste lid, van de wet][ref2]. Onze Minister geeft binnen acht weken na ontvangst van de aanvraag
      een beschikking.

      2 In bijzondere gevallen die de inburgeringsplichtige betreffen, kan Onze Minister ambtshalve besluiten tot het
      verlenen van de ontheffing.

      3 Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent het verlenen van de ontheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel7
