  - number: '2.9'
    text: |-
      De inburgeringsplichtige verwerft de volgende vaardigheden in de Nederlandse taal op het niveau A2 van het Europees
      Raamwerk voor Moderne Vreemde Talen:

      a. spreekvaardigheid;

      b. luistervaardigheid;

      c. schrijfvaardigheid;

      d. leesvaardigheid.
    url: https://wetten.overheid.nl/BWBR0020674/2018-11-14#Artikel2.9
  - number: '2.10'
    text: |-
      1 De inburgeringsplichtige verwerft kennis van de Nederlandse samenleving op het niveau van de bij regeling van
      Onze Minister vast te stellen eindtermen met betrekking tot de volgende onderdelen:

      a. kennis van de Nederlandse maatschappij;

      b. oriëntatie op de Nederlandse arbeidsmarkt.

      2 Van de in het eerste lid, onderdeel b, bedoelde te verwerven kennis is vrijgesteld de persoon die
      inburgeringsplichtig is geworden voor 1 januari 2015.
    url: https://wetten.overheid.nl/BWBR0020674/2018-11-14#Artikel2.10
  - number: 2.10a
    text: De inburgeringsplichtige verwerft in het participatieverklaringstraject kennis van de Nederlandse kernwaarden.
    url: https://wetten.overheid.nl/BWBR0020674/2018-11-14#Artikel2.10a
  - number: '2.11'
    text: |-
      De termijnen genoemd in de [artikelen 7a, eerste lid][ref1], en [7b, eerste lid, van de wet][ref2] worden verlengd
      met de duur van de periode, bedoeld in [artikel 2.2, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel7b
      [ref3]: https://wetten.overheid.nl/BWBR0020674#Artikel2.2
    url: https://wetten.overheid.nl/BWBR0020674/2018-11-14#Artikel2.11
    references:
