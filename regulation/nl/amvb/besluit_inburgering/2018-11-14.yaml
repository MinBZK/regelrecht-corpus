  - number: '5.1'
    text: |-
      1 De maatschappelijke begeleiding, die de personen, bedoeld in [artikel 18, eerste lid, van de wet][ref1], naast
      het participatieverklaringstraject ontvangen, bevat in ieder geval de volgende componenten:

      a. praktische hulp bij het regelen van basisvoorzieningen;

      b. hulp bij het starten van de inburgering; en

      c. stimuleren van participatie en integratie door begeleiding en coaching en kennismaking met maatschappelijke
      organisaties.

      2 Bij ministeriële regeling worden nadere regels gesteld over de invulling van de in het eerste lid genoemde
      onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel18
    url: https://wetten.overheid.nl/BWBR0020674/2018-11-14#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '18'
  - number: '6.1'
    text: |-
      1 Het Informatiesysteem Inburgering bevat uitsluitend persoonsgegevens van:

      a. inburgeringsplichtigen en gewezen inburgeringsplichtigen;

      b. andere dan de in onderdeel a bedoelde personen, die deelnemen aan het inburgeringsexamen of aan wie een lening
      is verstrekt ten behoeve van het volgen van een inburgeringscursus of het afleggen van het inburgeringsexamen;

      c. partners van inburgeringsplichtigen, indien overeenkomstig [artikel 4.1a, tweede lid][ref1], de hoogte van de
      lening wordt bepaald of overeenkomstig [artikel 4.10][ref2] de draagkracht van de debiteur wordt bepaald;

      d. personen ten aanzien van wie is gebleken dat zij aansluitend op de leerplicht of kwalificatieplicht een
      opleiding volgen als bedoeld in [artikel 5, eerste lid, onderdeel e, van de wet][ref3];

      e. personen ten aanzien van wie op redelijke gronden kan worden vermoed dat zij inburgeringsplichtig zijn of kunnen
      worden.

      2 Het Informatiesysteem Inburgering bevat de in de bijlage bij dit besluit opgenomen gegevens. Persoonsgegevens
      worden opgenomen zoals deze zijn opgenomen in de basisregistratie personen.

      3 Bij regeling van Onze Minister kan de bijlage bij dit besluit worden gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4.1a
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel4.10
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel5
    url: https://wetten.overheid.nl/BWBR0020674/2018-11-14#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: 4.1a
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0020674
        artikel: '4.10'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0020611
        artikel: '5'
  - number: '6.2'
    text: |-
      1 De volgende instanties verstrekken ten behoeve van opneming in het Informatiesysteem Inburgering aan de beheerder
      daarvan uit eigen beweging of op verzoek alle gegevens die noodzakelijk zijn voor de uitvoering van de taken die
      bij of krachtens de [wet][ref1] aan die instanties zijn opgedragen:

      a. Onze Minister;

      b. de rijksbelastingdienst;

      c. de cursusinstellingen, bedoeld in [artikel 4.1a, vierde lid][ref2];

      d. de organisatie die belast is met het beheer van het in [artikel 4.1a, vierde lid][ref3] bedoelde keurmerk;

      e. het College voor toetsen en examens, genoemd in
      [artikel 2, eerste lid, van de Wet College voor toetsen en examens][ref4];

      f. Onze Minister van Onderwijs, Cultuur en Wetenschap;

      g. het Centraal Orgaan opvang asielzoekers;

      h. de door Onze Minister aangewezen organisaties die belast zijn met de uitvoering van een internationale
      diplomawaardering of een indicatie van het onderwijsniveau van een betrokkene ter ondersteuning van de in
      [artikel 2.10, eerste lid, onderdeel b][ref5], bedoelde oriëntatie op de Nederlandse arbeidsmarkt;

      i. het college.

      2 Onverminderd de gegevensverstrekking, bedoeld in [artikel 47, tweede lid, van de wet][ref6] aan Onze Minister,
      het college, Onze Minister van Veiligheid en Justitie en de rijksbelastingdienst worden gegevens die zijn opgenomen
      in het Informatiesysteem Inburgering slechts ter beschikking gesteld aan:

      a. Onze Minister van Onderwijs, Cultuur en Wetenschap;

      b. de cursusinstellingen, bedoeld in [artikel 4.1a, vijfde lid][ref7];

      c. de organisatie die belast is met het beheer van het in [artikel 4.1a, vijfde lid][ref8], bedoelde keurmerk.

      Deze gegevens worden niet gebruikt voor een ander doel dan genoemd in [artikel 47, tweede lid, van de wet][ref9].

      3 De verstrekking van gegevens met het oog op de evaluatie van bestaand beleid en de voorbereiding van toekomstig
      beleid, bedoeld in [artikel 47, tweede lid, onderdeel b, van de wet][ref10], geschiedt zodanig dat de gegevens niet
      kunnen worden herleid tot een natuurlijk persoon.

      4 De instanties, genoemd in het eerste lid, verstrekken de gegevens zo spoedig mogelijk doch uiterlijk binnen twee
      weken na het ontstaan van de noodzaak tot opneming in het Informatiesysteem Inburgering.

      5 Bij regeling van Onze Minister kunnen andere instanties worden aangewezen ten aanzien waarvan de in het eerste
      lid bedoelde verplichting eveneens geldt of waaraan eveneens gegevens uit het Informatiesysteem Inburgering worden
      verstrekt.

      6 In opdracht van Onze Minister kunnen ten behoeve van het verrichten van rechtmatigheids- en
      doelmatigheidsonderzoeken gegevens uit het Informatiesysteem Inburgering worden verstrekt die kunnen worden
      herleid tot een natuurlijk persoon. In de rapportages over deze onderzoeken worden geen tot die persoon herleidbare
      gegevens opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020611
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel4.1a
      [ref3]: https://wetten.overheid.nl/BWBR0020674#Artikel4.1a
      [ref4]: https://wetten.overheid.nl/BWBR0025364#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0020674#Artikel2.10
