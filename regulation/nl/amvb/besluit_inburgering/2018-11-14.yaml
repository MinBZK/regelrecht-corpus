  - number: '4.7'
    text: |-
      1 De terugbetaling van de lening geschiedt in maandelijkse termijnbedragen, behoudens in de bij regeling van Onze
      Minister genoemde gevallen.

      2 De hoogte van het maandelijkse termijnbedrag wordt op basis van het aantal maanden van de terugbetalingsperiode
      tot een gelijk bedrag vastgesteld bij de aanvang van de aanloopfase, bedoeld in [artikel 4.6, derde lid][ref1], dan
      wel binnen acht weken na ontvangst van een verzoek als bedoeld in 4.6, tweede lid, tweede volzin.

      3 Bij regeling van Onze Minister worden nadere regels gesteld over de hoogte van het termijnbedrag alsmede de wijze
      waarop dit wordt berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4.6
    url: https://wetten.overheid.nl/BWBR0020674/2018-11-14#Artikel4.7
    references:
