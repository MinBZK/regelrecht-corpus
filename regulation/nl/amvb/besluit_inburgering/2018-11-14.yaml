  - number: '3.1'
    text: |-
      1 Onze Minister stelt het inburgeringsexamen vast.

      2 Het inburgeringsexamen wordt wat betreft het onderdeel, bedoeld in
      [artikel 7, tweede lid, onderdeel a, van de wet][ref1], afgenomen door het college en wat betreft de onderdelen,
      bedoeld in artikel 7, tweede lid, onderdelen b en c, van de wet, afgenomen door Onze Minister.

      3 Bij regeling van Onze Minister worden regels gesteld omtrent de toepassing van het eerste en het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
    url: https://wetten.overheid.nl/BWBR0020674/2018-11-14#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '7'
  - number: '3.2'
    text: |-
      1 Degene die wenst te worden toegelaten tot een of meer onderdelen van het inburgeringsexamen als bedoeld in
      [artikel 7, tweede lid, onderdelen b en c, van de wet][ref1], meldt zich daartoe schriftelijk aan overeenkomstig de
      door Onze Minister gestelde regels.

      2 Degene die wenst te worden toegelaten tot het participatieverklaringstraject, bedoeld in
      [artikel 7, tweede lid, onderdeel a, van de wet][ref2], meldt zich daartoe schriftelijk bij het college aan voor
      deelname aan het participatieverklaringstraject op een van de door het college vastgestelde data.

      3 Bij regeling van Onze Minister worden regels gesteld omtrent de toepassing van het tweede lid.

      4 Onze Minister dan wel het college bevestigt de aanmelding schriftelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel7
    url: https://wetten.overheid.nl/BWBR0020674/2018-11-14#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '7'
  - number: '3.3'
    text: |-
      Onze minister bepaalt voor welke onderdelen van het af te leggen inburgeringsexamen, welke doelgroepen
      inburgeringsplichtigen welk bedrag aan examengeld zijn verschuldigd en op welke wijze het verschuldigde examengeld
      wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0020674/2018-11-14#Artikel3.3
  - number: '3.4'
    text: |-
      Op verzoek van degene die het examen afneemt of daarop toezicht houdt, identificeert de kandidaat zich met een
      document als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0020674/2018-11-14#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '3.5'
    text: |-
      1 Onze Minister dan wel het college stelt de kandidaat met een psychische of lichamelijke belemmering of
      verstandelijke handicap op diens verzoek in de gelegenheid het inburgeringsexamen dan wel een onderdeel daarvan af
      te leggen op een wijze die is aangepast aan zijn mogelijkheden.

      2 Indien Onze Minister bij de toepassing van [artikel 2.8][ref1] heeft geoordeeld dat de inburgeringsplichtige
      het inburgeringsexamen dan wel een onderdeel daarvan slechts kan afleggen op een wijze die is aangepast aan de
      mogelijkheden van die inburgeringsplichtige, legt de kandidaat bij de aanvraag de beschikking, bedoeld in het derde
      lid van dat artikel over.

      3 In de overige gevallen legt de kandidaat een advies over van een door Onze Minister
      aangewezen onafhankelijke arts, die is ingeschreven in het betreffende register, bedoeld in
      [artikel 3, eerste lid, van de Wet op de beroepen in de individuele gezondheidszorg][ref2], waaruit blijkt dat hij
      het inburgeringsexamen dan wel een onderdeel daarvan slechts kan afleggen op een wijze die is aangepast aan zijn
      mogelijkheden.

      4 Bij regeling van Onze Minister worden regels gesteld over de toepassing van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2.8
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel3
    url: https://wetten.overheid.nl/BWBR0020674/2018-11-14#Artikel3.5
    references:
      - id: ref1
