  - number: 4.1a
    text: |-
      1 Aan de inburgeringsplichtige kan, behoudens het bepaalde in [artikel 16, eerste lid, tweede zin, van de wet][ref1]
      op aanvraag een lening van ten hoogste € 10.000,– worden verstrekt ten behoeve van de kosten voor:

      a. het volgen bij een cursusinstelling van een cursus die opleidt tot de in artikel 7, tweede lid, onderdelen b en
      c, van de wet bedoelde onderdelen van het inburgeringsexamen en het staatsexamen Nederlands als tweede taal I of II
      als bedoeld in [artikel 7.3.1, eerste lid, onderdeel c, van de Wet educatie en beroepsonderwijs][ref2];

      b. het afleggen van het staatsexamen, bedoeld onder a of het inburgeringsexamen; of

      c. het volgen van een alfabetiseringscursus.

      2 De hoogte van de lening wordt bepaald aan de hand van de hoogte van het overeenkomstig
      [artikel 8, eerste, tweede, derde en vijfde lid, van de Algemene wet inkomensafhankelijke regelingen][ref3]
      te berekenen toetsingsinkomen van de inburgeringsplichtige en diens partner als bedoeld in
      [artikel 3 van die wet][ref4].

      3 Het tweede lid is niet van toepassing op de inburgeringsplichtige, bedoeld in het eerste lid, die rechtmatig
      verblijf heeft op grond van een:

      a. verblijfsvergunning asiel voor bepaalde tijd; of

      b. verblijfsvergunning regulier voor bepaalde tijd, verleend onder een beperking verband houdend met verblijf als
      familie- of gezinslid, voor verblijf bij:

      1°. een houder van een verblijfsvergunning asiel voor bepaalde tijd,

      2°. een houder van een verblijfsvergunning asiel voor onbepaalde tijd, of

      3°. een houder van een EU-verblijfsvergunning voor langdurig ingezetenen die is verleend met een aantekening inzake
      internationale bescherming als bedoeld in [artikel 45c, eerste lid, van de Vreemdelingenwet 2000][ref5].

      4 De lening ten behoeve van het volgen van een cursus als bedoeld in het eerste lid, onderdeel a, wordt slechts
      verstrekt indien de inburgeringsplichtige een cursus als bedoeld in het eerste lid, onderdeel a, volgt bij een
      cursusinstelling die in het bezit is van een certificaat als bedoeld in [artikel 9, eerste lid, van de wet][ref6]
      of een keurmerk als bedoeld in [artikel 12a, eerste lid, van de wet][ref7].

      5 De lening wordt niet verstrekt, indien de inburgeringsplichtige op grond van
      [artikel 4.1][ref8] zoals dat luidde voor het tijdstip van inwerkingtreding van het
      __REF001___________________________________________________________________________________________________________
      ____________________________________________________________________________________ (Stb. 2012, 432) een lening is
      verstrekt en deze nog niet geheel is terugbetaald of kwijtgescholden.

      6 Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot de toepassing van het
      eerste, tweede, derde en vijfde lid.


