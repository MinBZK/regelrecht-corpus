  - number: '4.11'
    text: |-
      1 Onze Minister geeft binnen acht weken na ontvangst van de aanvraag, bedoeld in [artikel 4.9][ref1], een
      beschikking.

      2 Indien het bedrag van de draagkracht lager is dan het overeenkomstig [artikel 4.8][ref2] vastgestelde
      termijnbedrag, wordt het termijnbedrag opnieuw vastgesteld met ingang van de eerste dag van de maand volgend op de
      maand waarin Onze Minister het nieuwe termijnbedrag aan de debiteur bekend heeft gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4.9
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel4.8
