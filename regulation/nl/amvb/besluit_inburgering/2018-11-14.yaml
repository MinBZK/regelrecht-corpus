  - number: '4.4'
    text: Onze Minister geeft binnen acht weken na ontvangst van de aanvraag een beschikking.
    url: https://wetten.overheid.nl/BWBR0020674/2018-11-14#Artikel4.4
  - number: '4.5'
    text: |-
      1 Onze Minister stelt jaarlijks voor 31 december ten behoeve van het daarop volgende jaar een rentepercentage vast
      dat gelijk is aan het gemiddeld effectief rendement over de maand oktober van dat jaar van de openbare lening,
      uitgegeven door de Staat der Nederlanden en toegelaten tot de notering aan de officiële markt ter beurze van
      Amsterdam, met een resterende looptijd van drie tot vijf jaren.

      2 Bij regeling van Onze Minister worden nadere regels gesteld omtrent de wijze waarop de rente wordt berekend over
      de aangegane lening.
    url: https://wetten.overheid.nl/BWBR0020674/2018-11-14#Artikel4.5
  - number: '4.6'
    text: |-
      1 De terugbetalingsperiode beslaat ten hoogste tien jaren.

      2 De terugbetalingsperiode vangt aan op de eerste dag van de maand volgend op het in
      [artikel 17, eerste of tweede lid, van de wet][ref1] bedoelde tijdstip. De terugbetalingsperiode kan op
      schriftelijk verzoek van de debiteur aanvangen op een eerder tijdstip, in welk geval de aanspraak op de lening
      vervalt.

      3 Gedurende de in [artikel 17, eerste of tweede lid, van de wet][ref2] bedoelde aanloopfase van zes maanden bestaat
      geen verplichting tot terugbetaling, doch is wel rente verschuldigd over het bedrag van de lening.

      4 In afwijking van het tweede lid, vangt de terugbetalingsperiode voor een persoon als bedoeld in
      [artikel 4.1][ref3] aan zes maanden nadat drie jaar zijn verstreken sedert de verstrekking van de lening of, indien
      dat eerder is, zes maanden nadat aan de inburgeringsplicht is voldaan.

      5 In afwijking van het tweede lid, vangt de terugbetalingsperiode voor een persoon die, overeenkomstig
      [artikel 16, eerste lid, tweede zin, van de wet][ref4], niet langer aanspraak heeft op een lening aan zes maanden
      nadat is vastgesteld dat de desbetreffende persoon niet langer aanspraak heeft op een lening.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0020674#Artikel4.1
      [ref4]: https://wetten.overheid.nl/BWBR0020611#Artikel16
    url: https://wetten.overheid.nl/BWBR0020674/2018-11-14#Artikel4.6
