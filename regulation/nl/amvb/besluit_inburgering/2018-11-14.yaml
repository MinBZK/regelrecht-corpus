        bwb_id: BWBR0020674
        artikel: '4.6'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '4.8'
    text: |-
      1 Binnen acht weken na de aanvang van de aanloopfase, bedoeld in [artikel 4.6, derde lid][ref1], dan wel
      de ontvangst van een verzoek als bedoeld in artikel 4.6, tweede lid, tweede volzin, stelt Onze Minister het
      termijnbedrag vast dat de debiteur overeenkomstig de [artikelen 4.5 tot en met 4.7][ref2] maandelijks moet
      terugbetalen alsmede de periode waarbinnen dit moet gebeuren.

      2 Bij regeling van Onze Minister kunnen regels worden gesteld voor het geval de debiteur meer betaalt dan het
      termijnbedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4.6
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel4.5
    url: https://wetten.overheid.nl/BWBR0020674/2018-11-14#Artikel4.8
