articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. wet: de [Wet inburgering][ref1];

      b. inburgeringsdiploma: het diploma, bedoeld in [artikel 7, vierde lid, onderdeel g, van de wet][ref2], ten bewijze
      waarvan het inburgeringsexamen is behaald;

      c. Informatiesysteem Inburgering: het informatiesysteem, bedoeld in [artikel 47 van de wet][ref3];

      d. rijksbijdrage: de rijksbijdrage, bedoeld in [artikel 52 van de wet][ref4], zoals dat artikel luidde voor de
      datum van inwerkingtreding van de [Wet participatiebudget][ref5];

      e. lening: de lening, bedoeld in [artikel 16 van de wet][ref6];

      f. Wet inburgering nieuwkomers: [Wet inburgering nieuwkomers][ref7] zoals die luidde op 31 december 2006.


