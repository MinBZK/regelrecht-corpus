  - number: '3.23'
    text: |-
      1 Het Kwaliteitscentrum examinering inburgering maakt een verklaring als bedoeld in [artikel 3.22][ref1] in de
      vijfde week na vaststelling daarvan openbaar.

      2 Tevens verstrekt het Kwaliteitscentrum examinering inburgering aan derden op verzoek een afschrift van de
      verklaring. Het Kwaliteitscentrum examinering inburgering kan een vergoeding van de kosten vragen overeenkomstig
      een door Onze Minister vast te stellen tarief voor de afgifte van een verklaring.

      3 Het Kwaliteitscentrum examinering inburgering verstrekt een verklaring niet eerder aan derden dan nadat deze op
      grond van het eerste lid openbaar is gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3.22
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel3.23
