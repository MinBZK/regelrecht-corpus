      Onze Minister verstrekt ambtshalve de in
      [artikel 4.17, eerste lid, onderdeel a, tweede lid, onderdeel a, of derde lid][ref1], bedoelde vergoeding binnen
      acht weken nadat de gewezen inburgeringsplichtige het examen heeft behaald.


