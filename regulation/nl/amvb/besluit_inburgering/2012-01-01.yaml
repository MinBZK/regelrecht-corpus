        artikel: '6'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '3'
  - number: 2.8a
    text: |-
      1 Het college verleent op aanvraag ontheffing van de inburgeringsplicht, indien het college van oordeel is dat een
      inburgeringsplichtige aantoonbaar voldoende is ingeburgerd.

      2 Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de verlening van de ontheffing.
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel2.8a
  - number: '2.9'
    text: |-
      1 De inburgeringsplichtige verwerft de volgende vaardigheden in de Nederlandse taal op het niveau A2 van het
      Europees Raamwerk voor Moderne Vreemde Talen:

      a. spreekvaardigheid;

      b. luistervaardigheid;

      c. gespreksvaardigheid;

      d. schrijfvaardigheid;

      e. leesvaardigheid.

      2 In afwijking van het eerste lid, onderdelen d en e, verwerft de oudkomer, niet zijnde een geestelijke bedienaar,
      de daargenoemde schriftelijke vaardigheden in de Nederlandse taal ten minste op het niveau A1 van het Europees
      Raamwerk voor Moderne Vreemde Talen.
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel2.9
  - number: '2.10'
    text: |-
      1 De inburgeringsplichtige verwerft kennis van de Nederlandse samenleving, op het niveau van de bij regeling van
      Onze Minister vast te stellen eindtermen. De te verwerven kennis van de Nederlandse samenleving heeft in ieder
      geval betrekking op:

      a. werk en inkomen;

      b. omgangsvormen, waarden en normen;

      c. wonen;

      d. gezondheid en gezondheidszorg;

      e. geschiedenis en geografie;

      f. instanties;

      g. staatsinrichting en rechtsstaat;

      h. onderwijs en opvoeding.

      2 Onverminderd het eerste lid, verwerft de inburgeringsplichtige die geestelijke bedienaar is, tevens op het niveau
      van de bij regeling van Onze Minister vast te stellen eindtermen kennis van de Nederlandse samenleving die naar het
      oordeel van Onze Minister noodzakelijk is voor de vervulling van zijn sociaal-maatschappelijke en pastorale taken.
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel2.10
  - number: '2.11'
    text: |-
      De termijn, genoemd in [artikel 7, eerste lid, van de wet][ref1] wordt verlengd met de duur van de periode, bedoeld
      in [artikel 2.2, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel2.2
