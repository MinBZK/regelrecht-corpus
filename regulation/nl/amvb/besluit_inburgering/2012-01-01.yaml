    text: |-
      1 De inburgeringsplichtige die op 1 januari 2007 deelneemt aan een opleiding educatie als bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel d, van de Wet educatie en beroepsonderwijs][ref1], blijft toegelaten tot
      deze opleiding.

      2 Het college kan de opleidingen educatie, bedoeld in het eerste lid, bekostigen uit het prestatie-afhankelijke
      deel van de rijksbijdrage dat betrekking heeft op het jaar 2007.

      3 Indien het college toepassing geeft aan het tweede lid, doet het college opgave van het daarmee gemoeide bedrag,
      alsmede het aantal opleidingen educatie, bedoeld in het eerste lid, tezamen met de jaarrekening, bedoeld in
      [artikel 186 van de Gemeentewet][ref2], welke betrekking heeft op het jaar 2007. De jaarrekening is voorzien van de
      accountantsverklaring, bedoeld in [artikel 213, derde lid, van de Gemeentewet][ref3].


