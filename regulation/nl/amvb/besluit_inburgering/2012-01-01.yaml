    text: |-
      1 Indien op grond van [artikel 23, vierde lid, van de wet][ref1] een inburgeringsvoorziening vervalt, roept het
      college de inburgeringsplichtige binnen zes weken op voor het onderzoek.

      2 Binnen zes weken na afloop van het onderzoek geeft het college ten aanzien van de inburgeringsplichtige voorzover
      van toepassing een beschikking waarin als gelijkwaardig inburgeringsalternatief een op dat tijdstip passende
      inburgeringsvoorziening is vastgesteld. Het bepaalde bij en krachtens de [artikelen 22, eerste lid][ref2], en
      [23, eerste, tweede en derde lid, van de wet][ref3] is van toepassing.


