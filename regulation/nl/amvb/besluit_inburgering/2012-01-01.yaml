        bwb_id: BWBR0002656
  - number: '7.1'
    text: |-
      1 De rijksbijdrage voor 2007 en 2008 voor een gemeente omvat een vast deel, een prestatie-afhankelijk deel en een
      variabel deel.

      2 Het vaste deel, bedoeld in het eerste lid, wordt vastgesteld met behulp van de verdeelsleutel, bedoeld in
      [artikel 7.2, tweede lid][ref1], zoals [dat artikel][ref2] luidde op 31 december 2008.

      3 Het prestatie-afhankelijke deel, bedoeld in het eerste lid, wordt berekend op de grondslag van:

      a. het aantal inburgeringsplichtigen, bedoeld in [artikel 19, eerste lid, van de wet][ref3], zoals die luidde op
      31 december 2008, ten behoeve van wie het college voor de eerste keer een inburgeringsvoorziening heeft vastgesteld
      en aan wie geen lening is verstrekt, hetzij ten behoeve van wie die lening in zijn geheel is terugbetaald;

      b. het aantal in onderdeel a bedoelde inburgeringsplichtigen dat binnen drie kalenderjaren nadat voor hen de
      inburgeringsvoorziening is vastgesteld, heeft deelgenomen aan het inburgeringsexamen;

      c. het aantal inburgeringsplichtigen, bedoeld in [artikel 19, eerste lid, van de wet][ref4], zoals die luidde op
      31 december 2008, ten behoeve van wie het college voor de eerste keer een gecombineerde inburgeringsvoorziening
      heeft vastgesteld en aan wie geen lening is verstrekt, hetzij ten behoeve van wie die lening in zijn geheel is
      terugbetaald;

      d. het aantal in onderdeel c bedoelde inburgeringsplichtigen dat binnen drie kalenderjaren nadat voor hen de
      gecombineerde inburgeringsvoorziening is vastgesteld, heeft deelgenomen aan het inburgeringsexamen;

      e. het aantal inburgeringsplichtigen, bedoeld in [artikel 19, tweede lid, onderdeel a, van de wet][ref5], zoals
      die luidde op 31 december 2008, ten behoeve van wie het college voor de eerste keer een inburgeringsvoorziening
      heeft vastgesteld en aan wie geen lening is verstrekt, hetzij ten behoeve van wie die lening in zijn geheel is
      terugbetaald;

      f. het aantal in onderdeel g bedoelde inburgeringsplichtigen dat binnen drie kalenderjaren nadat voor hen de
      inburgeringsvoorziening is vastgesteld, heeft deelgenomen aan het inburgeringsexamen;

      g. het aantal inburgeringsplichtigen, bedoeld in [artikel 19, tweede lid, onderdeel a, van de wet][ref6], zoals
      die luidde op 31 december 2008, ten behoeve van wie het college voor de eerste keer een gecombineerde
      inburgeringsvoorziening heeft vastgesteld en aan wie geen lening is verstrekt, hetzij ten behoeve van wie die
      lening in zijn geheel is terugbetaald;

      h. het aantal in onderdeel i bedoelde inburgeringsplichtigen dat binnen drie kalenderjaren nadat voor hen de
      gecombineerde inburgeringsvoorziening is vastgesteld, heeft deelgenomen aan het inburgeringsexamen;

      i. het aantal inburgeringsplichtigen ten behoeve van wie het college voor de eerste keer een duale
      inburgeringsvoorziening heeft vastgesteld en aan wie geen lening is verstrekt, hetzij ten behoeve van wie die
      lening in zijn geheel is terugbetaald;

      j. het aantal inburgeringsplichtigen ten behoeve van wie het college voor de eerste keer een taalkennisvoorziening
      als bedoeld in [artikel 19, derde lid, van de wet][ref7], zoals die luidde op 31 december 2008 heeft vastgesteld en
      aan wie geen lening is verstrekt, hetzij ten behoeve van wie die lening in zijn geheel is terugbetaald.

      4 Het variabele deel, bedoeld in het eerste lid, wordt vastgesteld op de grondslag van:

      a. het aantal inburgeringsplichtigen aan wie het college een handhavingsbeschikking bekend heeft gemaakt;

      b. het aantal inburgeringsplichtigen aan wie het college een kennisgeving als bedoeld in
      [artikel 5.3, derde lid][ref8], heeft verstrekt;

      c. het aantal geestelijke bedienaren ten behoeve van wie het college een inburgeringsvoorziening heeft vastgesteld;

      d. het aantal geestelijke bedienaren dat heeft deelgenomen aan het inburgeringsexamen;

      e. het aantal geestelijke bedienaren dat heeft deelgenomen aan het aanvullend praktijkdeel van het
      inburgeringsexamen, bedoeld in [artikel 3.8, eerste lid][ref9].


