  - number: 7.1a
    text: |-
      De inburgeringsplichtigen, bedoeld in het besluit van de Staatssecretaris van Justitie van 12 juni 2007, nr.
      2007/11, houdende wijziging van de Vreemdelingencirculaire 2000, worden voor de berekening van de rijksbijdrage in
      deze afdeling niet meegerekend.
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel7.1a
  - number: '7.5'
    text: |-
      1 Het prestatie-afhankelijke deel van de rijksbijdrage voor een gemeente wordt berekend met de formule:

      A = ( [ B x C ] + [ D x E ] + [ H x I ] + [ J x K ] + [ L x M ] + [ N x O ] + [ R x S ] + [ T x U ] + [V x W] + [X
      x Y] + [Z x AA] + [BB x CC] + DD) x EE

      waarin wordt voorgesteld:

        - met de letter A: het prestatie-afhankelijke deel van de rijksbijdrage;
        - met de letter B: het aantal inburgeringsplichtigen, bedoeld in [artikel 19, eerste lid, van de wet][ref1], zoals
      die luidde op 31 december 2008, ten behoeve van wie het college in het jaar waarop de prognose betrekking heeft
      voor de eerste keer een inburgeringsvoorziening heeft vastgesteld en aan wie geen lening is verstrekt, hetzij ten
      behoeve van wie die lening in zijn geheel is terugbetaald;
        - met de letter C: de bijdragevergoeding ten aanzien van de vaststelling van de inburgeringsvoorziening ten behoeve
      van inburgeringsplichtigen, bedoeld in [artikel 19, eerste lid, van de wet][ref2], zoals die luidde op 31 december
      2008;
        - met de letter D: het aantal inburgeringsplichtigen, bedoeld in [artikel 19, eerste lid, van de wet][ref3],
      zoals die luidde op 31 december 2008, ten behoeve van wie het college in het jaar waarop de prognose betrekking
      heeft voor de eerste keer een gecombineerde inburgeringsvoorziening heeft vastgesteld en aan wie geen lening is
      verstrekt, hetzij ten behoeve van wie die lening in zijn geheel is terugbetaald;
        - met de letter E: de bijdragevergoeding ten aanzien van de vaststelling van de
      gecombineerde inburgeringsvoorziening ten behoeve van inburgeringsplichtigen, bedoeld in
      [artikel 19, eerste lid, van de wet][ref4], zoals die luidde op 31 december 2008;
        - met de letter H: het aantal inburgeringsplichtigen, bedoeld in
      [artikel 19, tweede lid, onderdeel a, van de wet][ref5], zoals die luidde op 31 december 2008, ten behoeve van
      wie het college in het jaar waarop de prognose betrekking heeft voor de eerste keer een inburgeringsvoorziening
      heeft vastgesteld en aan wie geen lening is verstrekt, hetzij ten behoeve van wie die lening in zijn geheel is
      terugbetaald;
        - met de letter I: de bijdragevergoeding ten aanzien van de vaststelling van de inburgeringsvoorziening ten behoeve
      van inburgeringsplichtigen, bedoeld in [artikel 19, tweede lid, onderdeel a, van de wet][ref6], zoals die luidde op
      31 december 2008;
        - met de letter J: het aantal inburgeringsplichtigen, bedoeld in
      [artikel 19, tweede lid, onderdeel a, van de wet][ref7], zoals die luidde op 31 december 2008, ten behoeve
      van wie het college in het jaar waarop de prognose betrekking heeft voor de eerste keer een gecombineerde
      inburgeringsvoorziening heeft vastgesteld en aan wie geen lening is verstrekt, hetzij ten behoeve van wie die
      lening in zijn geheel is terugbetaald;
        - met de letter K: de bijdragevergoeding ten aanzien van de vaststelling van de
      gecombineerde inburgeringsvoorziening ten behoeve van inburgeringsplichtigen, bedoeld in
      [artikel 19, tweede lid, onderdeel a, van de wet][ref8], zoals die luidde op 31 december 2008;
        - met de letter L: het aantal in de letter B bedoelde inburgeringsplichtigen dat binnen twee jaren na het jaar
      waarop de prognose betrekking heeft, heeft deelgenomen aan het inburgeringsexamen of het examen, bedoeld in
      [artikel 2.3, eerste lid, onderdeel c][ref9];
        - met de letter M: de bijdragevergoeding ten aanzien van de deelname aan een van de examens, bedoeld in letter L;
        - met de letter N: het aantal in de letter D bedoelde inburgeringsplichtigen dat binnen twee jaren na het jaar
      waarop de prognose betrekking heeft, heeft deelgenomen aan het inburgeringsexamen of het examen, bedoeld in
      [artikel 2.3, eerste lid, onderdeel c][ref10];
        - met de letter O: de bijdragevergoeding ten aanzien van de deelname aan een van de examens, bedoeld in letter N;
        - met de letter R: het aantal in de letter H bedoelde inburgeringsplichtigen dat binnen twee jaren na het jaar
      waarop de prognose betrekking heeft, heeft deelgenomen aan het inburgeringsexamen of het examen, bedoeld in
      [artikel 2.3, eerste lid, onderdeel c][ref11];
        - met de letter S: de bijdragevergoeding ten aanzien van de deelname aan een van de examens, bedoeld in letter R;
        - met de letter T: het aantal in de letter J bedoelde inburgeringsplichtigen dat binnen twee jaren na het jaar
      waarop de prognose betrekking heeft, heeft deelgenomen aan het inburgeringsexamen of het examen, bedoeld in
      [artikel 2.3, eerste lid, onderdeel c][ref12];
        - met de letter U: de bijdragevergoeding ten aanzien van de deelname aan een van de examens, bedoeld in letter T;
        - met de letter V: het aantal inburgeringsplichtigen ten behoeve van wie het college in het jaar waarop de prognose
      betrekking heeft voor de eerste keer een duale inburgeringsvoorziening heeft vastgesteld en aan wie geen lening is
      verstrekt, hetzij ten behoeve van wie die lening in zijn geheel is terugbetaald;
        - met de letter W: de bijdragevergoeding ten aanzien van de vaststelling van de duale inburgeringsvoorziening;
        - met de letter X: het aantal inburgeringsplichtigen, niet zijnde geestelijke bedienaar, ten behoeve van wie het
      college in het jaar waarop de prognose betrekking heeft voor de eerste keer een taalkennisvoorziening als bedoeld
      in [artikel 19, derde lid, van de wet][ref13], zoals die luidde op 31 december 2008, heeft vastgesteld en aan wie
      geen lening is verstrekt, hetzij ten behoeve van wie die lening in zijn geheel is terugbetaald;
        - met de letter Y: de bijdragevergoeding ten aanzien van de vaststelling van de taalkennisvoorziening;
        - met de letter Z: het aantal door het college in 2007 op grond van de [Wet inburgering nieuwkomers][ref14] genomen
      beschikkingen omtrent een inburgeringsprogramma;
        - met de letters AA: de door Onze Minister vast te stellen vergoeding met betrekking tot een inburgeringsprogramma
      als bedoeld in de letter Z;
        - met de letters BB: het aantal door het college in 2007 en 2008 ontvangen afschriften, welke
      betrekking hebben op in 2007 aangevangen inburgeringsprogramma’s, van door het bevoegd gezag van een
      instelling ingevolge de [Wet inburgering nieuwkomers][ref15] uitgereikte verklaringen als bedoeld in
      [artikel 7.4.15, eerste lid, van de Wet educatie en beroepsonderwijs][ref16], zoals [dat artikel][ref17] luidde op
      31 december 2006;
        - met de letters CC: de door Onze Minister vast te stellen vergoeding met betrekking tot een verklaring als bedoeld
      in de letters BB;
        - met de letters DD: het bedrag, bedoeld in [artikel 9.3, derde lid][ref18];
        - met de letters EE: de door Onze Minister vast te stellen correctiefactor.

      2 Het college verstrekt de gegevens, bedoeld in de letters B, D, H, J, L, N, R, T, V en X van het
      eerste lid, tezamen met de jaarrekening, bedoeld in [artikel 186 van de Gemeentewet][ref19], welke
      betrekking heeft op het jaar 2011. Het college verstrekt de gegevens, bedoeld in de letters Z en BB van
      het eerste lid, tezamen met de jaarrekening, bedoeld in [artikel 186 van de Gemeentewet][ref20], welke
      betrekking heeft op het jaar 2008. De jaarrekening is voorzien van de accountantsverklaring, bedoeld in
      [artikel 213, derde lid, van de Gemeentewet][ref21]. Het college vergewist zich ervan dat de gegevens zijn
      opgenomen in het Informatiesysteem Inburgering.

      3 Indien Onze Minister de gegevens en de accountantsverklaring niet voor
      binnen zesentwintig weken na het verstrijken van de termijn, bedoeld in
      [artikel 17b, derde lid, aanhef en onderdeel a, van de Financiële-verhoudingswet][ref22] heeft ontvangen, stelt
      Onze Minister de hoogte van de letters B, D, H, J, L, N, R, T, V en X, respectievelijk de letters Z en BB in de
      formule, bedoeld in het eerste lid, vast op nul.

      4 Onze Minister stelt het prestatie-afhankelijke deel van de rijksbijdrage
      uiterlijk dertig weken na het verstrijken van de termijn, bedoeld in
      [artikel 17b, derde lid, aanhef en onderdeel a, van de Financiële-verhoudingswet][ref23], welke betrekking heeft
      op de jaarrekening van het jaar 2011, vast.

      5 Het prestatie-afhankelijke deel van de rijksbijdrage wordt vastgesteld onder voorbehoud van goedkeuring van
      de beschikbare middelen door de begrotingswetgever en kan worden verlaagd in verband met wijzigingen van de
      rijksbegroting voor het jaar 2012 dan wel het jaar 2013.

      6 Het prestatie-afhankelijke deel van de rijksbijdrage wordt verrekend met het voorschot dat is verleend ten
      behoeve van de jaren 2007 en 2008. Het uit de verrekening resulterende positieve of negatieve saldo wordt uiterlijk
      zes maanden na de vaststelling ervan aan een gemeente betaald.


