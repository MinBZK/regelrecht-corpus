  - number: '4.9'
    text: |-
      Indien de debiteur niet in staat is het overeenkomstig [artikel 4.8][ref1] vastgestelde bedrag van de termijn te
      voldoen, kan hij bij Onze Minister een aanvraag indienen om zijn draagkracht vast te stellen voor de resterende
      terugbetalingsperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4.8
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel4.9
