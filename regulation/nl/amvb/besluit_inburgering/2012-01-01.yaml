  - number: '7.13'
    text: |-
      De rijksbijdrage voor een gemeente ten behoeve van nieuwe inburgeringsplichtigen wordt berekend op de grondslag
      van:

      a. het aantal nieuwe inburgeringsplichtigen, ten behoeve van wie het college voor de eerste keer een
      inburgeringsvoorziening, een duale inburgeringsvoorziening of een taalkennisvoorziening als bedoeld
      in [artikel 19, derde lid, van de wet][ref1], zoals die luidde voor de inwerkingtreding van de
      [Wet participatiebudget][ref2] heeft vastgesteld en aan wie geen lening is verstrekt, hetzij ten behoeve van wie
      die lening in zijn geheel is terugbetaald;

      b. het aantal in onderdeel a bedoelde nieuwe inburgeringsplichtigen dat binnen drie kalenderjaren nadat voor hen
      de inburgeringsvoorziening is vastgesteld, heeft deelgenomen aan het inburgeringsexamen of het examen, bedoeld in
      [artikel 2.3, eerste lid, onderdeel c][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0025039
