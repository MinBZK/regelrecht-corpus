      1 In afwijking van de [artikelen 3.80a][ref1] en [3.103 van het Vreemdelingenbesluit 2000][ref2]
      wordt de aanvraag tot het wijzigen van een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 14 van de Vreemdelingenwet 2000][ref3] niet afgewezen op de grond dat de vreemdeling het
      inburgeringexamen, bedoeld in [artikel 13 van de wet][ref4], niet heeft behaald, indien de aanvraag is ingediend
      vóór 1 januari 2010 en de vreemdeling op dat tijdstip drie jaar houder was van een verblijfsvergunning.

      2 In afwijking van de [artikelen 3.96a][ref5], [3.103][ref6] en [3.107a van het Vreemdelingenbesluit 2000][ref7]
      wordt de aanvraag tot het verlenen van een verblijfsvergunning voor onbepaalde tijd als bedoeld in de
      [artikelen 20][ref8] en [33 van de Vreemdelingenwet 2000][ref9] niet afgewezen op de grond dat de vreemdeling het
      inburgeringexamen, bedoeld in [artikel 13 van de wet][ref10], niet heeft behaald, indien de aanvraag is ingediend
      vóór 1 januari 2010 en de vreemdeling op dat tijdstip vijf jaar houder was van een verblijfsvergunning.


