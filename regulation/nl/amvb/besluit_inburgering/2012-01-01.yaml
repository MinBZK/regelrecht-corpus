  - number: '5.3'
    text: |-
      1 Indien niet aan de inburgeringsplicht is voldaan, verstrekt het college informatie over de rechten en plichten
      van de inburgeringsplichtige die uit de [wet][ref1] voortvloeien.

      2 Binnen twaalf weken na afloop van het onderzoek geeft het college ten aanzien van de inburgeringsplichtige
      voorzover van toepassing een beschikking als bedoeld in de [artikelen 22, eerste lid][ref2], en
      [26 van de wet][ref3].

      3 Indien ten aanzien van de inburgeringsplichtige geen beschikking als bedoeld in de
      [artikelen 22, eerste lid][ref4], en [26 van de wet][ref5] wordt gegeven, stelt het college hem binnen
      twaalf weken na het onderzoek schriftelijk in kennis van de voor hem geldende termijn, bedoeld in
      [artikel 7, eerste lid, van de wet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0020611
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel22
