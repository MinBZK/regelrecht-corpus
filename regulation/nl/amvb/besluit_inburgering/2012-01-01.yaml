  - number: '4.20'
    text: |-
      1 Onze Minister verstrekt ambtshalve of op aanvraag de in
      [artikel 4.17, eerste lid, onderdeel b, of tweede lid, onderdeel b][ref1], bedoelde vergoeding, voorzover het
      bedrag daarvan het in [artikel 4.17, eerste lid, onderdeel a, onderscheidenlijk tweede lid, onderdeel a][ref2],
      bedoelde bedrag te boven gaat.

      2 Ambtshalve verstrekking geschiedt binnen acht weken nadat de gewezen inburgeringsplichtige het examen heeft
      behaald. Indien een aanvraag is gedaan, geeft Onze Minister binnen acht weken na ontvangst van de aanvraag een
      beschikking.

      3 Bij regeling van Onze Minister worden nadere regels gesteld omtrent de aanvraag en de betaling van de in
      [artikel 4.17, eerste lid, onderdeel b, en tweede lid, onderdeel b][ref3], bedoelde vergoedingen.


