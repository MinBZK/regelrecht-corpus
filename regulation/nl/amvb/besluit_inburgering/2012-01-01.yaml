        paragraaf: '1'
        afdeling: '3'
  - number: '3.20'
    text: |-
      1 Onze Minister is bevoegd tot het treffen van noodzakelijke voorzieningen, waaronder het intrekken van de
      aanwijzing, bedoeld in [artikel 3.17, eerste lid][ref1], indien het Kwaliteitscentrum examinering inburgering naar
      het oordeel van Onze Minister zijn taken ernstig verwaarloost.

      2 De voorzieningen, bedoeld in het eerste lid, worden niet eerder getroffen dan nadat het Kwaliteitscentrum
      examinering inburgering in de gelegenheid is gesteld om binnen een door Onze Minister te stellen termijn alsnog
      zijn taken naar behoren uit te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3.17
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel3.20
    references:
