  - number: '4.17'
    text: |-
      1 De in [artikel 18, eerste lid, van de wet][ref1] bedoelde vergoeding bestaat uit:

      a. een bij regeling van Onze Minister vast te stellen bedrag, of

      b. een bij regeling van Onze Minister vast te stellen gedeelte van de kosten die de gewezen inburgeringsplichtige
      heeft gemaakt ten behoeve van:

      1°. het volgen van een cursus bij een cursusinstelling die op het tijdstip waarop de inburgeringsplichtige zich
      voor de cursus heeft aangemeld, over het in [artikel 1, eerste lid, onderdeel j, van de wet][ref2] bedoelde
      keurmerk of certificaat beschikte, en

      2°. het inburgeringsexamen op de voor de betrokken inburgeringsplichtige op grond van
      [artikel 7, tweede lid, onderdeel a, van de wet][ref3] vastgestelde niveaus alsmede, indien
      de inburgeringsplichtige oudkomer is, het inburgeringsexamen op de niveaus, bedoeld in de
      [artikelen 2.9, eerste lid][ref4], en [2.10][ref5].

      2 Indien een inburgeringsplichtige binnen drie jaar het examen, bedoeld in
      [artikel 2.3, eerste lid, onderdeel c][ref6], heeft behaald, verstrekt Onze Minister aan die gewezen
      inburgeringsplichtige:

      a. een bij regeling van Onze Minister vast te stellen bedrag, of

      b. een bij regeling van Onze Minister vast te stellen gedeelte van de kosten die die gewezen inburgeringsplichtige
      heeft gemaakt ten behoeve van het volgen van een cursus bij een cursusinstelling als bedoeld in het eerste lid,
      onderdeel b, subonderdeel 1°.

      Indien de gewezen inburgeringsplichtige oudkomer was, wordt de termijn van drie jaar berekend vanaf het tijdstip
      waarop het college ten aanzien van hem toepassing aan [artikel 26 van de wet][ref7] gaf.

      3 Onverminderd het eerste lid, verstrekt Onze Minister een bij regeling van Onze Minister vast te stellen bedrag
      aan de gewezen oudkomer, niet zijnde een geestelijke bedienaar, die binnen drie jaar nadat het college ten aanzien
      van hem toepassing aan [artikel 26 van de wet][ref8] heeft gegeven, het inburgeringsexamen op de niveaus, bedoeld
      in de [artikelen 2.9, eerste lid][ref9], en [2.10][ref10], heeft behaald.

      4 Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de verstrekking van de bedragen,
      bedoeld in het tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel18
