  - number: '2.4'
    text: |-
      1 Van de verplichting om mondelinge en schriftelijke vaardigheden in de Nederlandse taal te verwerven en het
      betreffende deel van het inburgeringsexamen te behalen, is vrijgesteld de inburgeringsplichtige die beschikt
      over het certificaat, bedoeld in [artikel 13, tweede lid, van de Wet inburgering nieuwkomers][ref1], alsmede
      de verklaring van het regionaal opleidingencentrum op grond waarvan dat certificaat is afgegeven, indien uit
      die verklaring blijkt dat voor het onderdeel Nederlands als tweede taal ten minste de volgende niveaus van de
      eindtermen Referentiekader Nederlands als Tweede Taal zijn behaald:

      a. niveau 2 voor de onderdelen «Luisteren» en «Spreken», en

      b. niveau 1 voor de onderdelen «Lezen» en «Schrijven».

      2 Van de verplichting om kennis van de Nederlandse samenleving te verwerven en het betreffende deel van het
      inburgeringsexamen te behalen, is vrijgesteld de inburgeringsplichtige:

      a. die beschikt over het certificaat, bedoeld in [artikel 13, tweede lid, van de Wet inburgering nieuwkomers][ref2],
      alsmede de verklaring van het regionaal opleidingencentrum op grond waarvan dat certificaat is afgegeven, indien
      uit die verklaring blijkt dat voor het onderdeel Maatschappij Oriëntatie is behaald:

      1°. het niveau van [artikel 11, eerste lid, onderdeel b, van die wet][ref3], of

      2°. een score van de MO-Profieltoets van ten minste: 85%, indien die toets is afgelegd voor 1 september 2001,
      respectievelijk 80%, indien die toets is afgelegd na 31 augustus 2001;

      b. die kan aantonen dat hij in Nederland is geslaagd voor het toetsonderdeel van de kennis van de staatsinrichting
      en maatschappij van de naturalisatietoets, zoals deze gold voor 1 april 2007.

      3 Bij regeling van Onze Minister kan worden voorzien in gedeeltelijke vrijstelling van de inburgeringsplicht op
      grond van andere diploma’s, certificaten of documenten dan genoemd in het eerste of tweede lid.


