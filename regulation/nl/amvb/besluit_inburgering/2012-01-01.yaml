  - number: '6.2'
    text: |-
      1 De volgende instanties verstrekken ten behoeve van opneming in het Informatiesysteem Inburgering aan de beheerder
      daarvan uit eigen beweging of op verzoek alle gegevens die noodzakelijk zijn voor de uitvoering van de taken die
      bij of krachtens de [wet][ref1] aan die instanties zijn opgedragen:

      a. het college;

      b. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      c. Onze Minister van Justitie;

      d. de rijksbelastingdienst;

      e. de exameninstellingen;

      f. de cursusinstellingen;

      g. de organisatie die belast is met het beheer van het in [artikel 1, onderdeel j, van de wet][ref2] bedoelde
      keurmerk;

      h. het Kwaliteitscentrum examinering inburgering;

      i. het Uitvoeringsinstituut werknemersverzekeringen;

      j. Onze Minister;

      k. het College voor examens, genoemd in [artikel 2, eerste lid, van de Wet College voor examens][ref3];

      l. Onze Minister van Onderwijs, Cultuur en Wetenschap.

      2 Onverminderd de gegevensverstrekking aan het college, Onze Minister van Justitie en Onze Minister, bedoeld in
      [artikel 47, tweede lid, van de wet][ref4] worden gegevens die zijn opgenomen in het Informatiesysteem Inburgering
      slechts ter beschikking gesteld aan:

      a. de exameninstellingen;

      b. de cursusinstellingen;

      c. de organisatie die belast is met het beheer van het in [artikel 1, onderdeel j, van de wet][ref5] bedoelde
      keurmerk;

      d. het Kwaliteitscentrum examinering inburgering;

      e. het Uitvoeringsinstituut werknemersverzekeringen.

      Deze gegevens worden niet gebruikt voor een ander doel dan genoemd in [artikel 47, tweede lid, van de wet][ref6].

      3 De verstrekking van gegevens met het oog op de evaluatie van bestaand beleid en de voorbereiding van toekomstig
      beleid, bedoeld in [artikel 47, tweede lid, onderdeel b, van de wet][ref7], geschiedt zodanig dat de gegevens niet
      kunnen worden herleid tot een natuurlijk persoon.

      4 De gegevens omtrent de beschikking, vastgesteld op grond van de [artikelen 19a, tweede lid][ref8], [22][ref9]
      en [26 van de wet][ref10], en de kennisgeving, verstrekt op grond van [artikel 5.3, derde lid][ref11], alsmede de
      gegevens omtrent de overeenkomst, vastgesteld op grond van [artikel 24d, tweede lid, van de wet][ref12], worden
      door het college zo spoedig mogelijk doch uiterlijk binnen vier weken na de dagtekening van de beschikking, de
      kennisgeving dan wel de overeenkomst elektronisch verstrekt aan de beheerder van het Informatiesysteem Inburgering.
      Indien de gegevens na ommekomst van de in de eerste volzin genoemde termijn nog niet zijn verstrekt, worden deze
      alsnog door het college binnen vier weken schriftelijk verstrekt aan de beheerder ten behoeve van opname in het
      Informatiesysteem Inburgering.

      5 De instanties, genoemd in het eerste lid, onderdelen a en e tot en met h, verstrekken de overige gegevens
      zo spoedig mogelijk doch uiterlijk binnen twee weken na het ontstaan van de noodzaak tot opneming in het
      Informatiesysteem Inburgering.

      6 Bij regeling van Onze Minister kunnen andere instanties worden aangewezen ten aanzien waarvan de in het eerste
      lid bedoelde verplichting eveneens geldt of waaraan eveneens gegevens uit het Informatiesysteem Inburgering worden
      verstrekt.

      7 In opdracht van Onze Minister kunnen ten behoeve van het verrichten van rechtmatigheids- en
      doelmatigheidsonderzoeken gegevens uit het Informatiesysteem Inburgering worden verstrekt die kunnen worden
      herleid tot een natuurlijk persoon. In de rapportages over deze onderzoeken worden geen tot die persoon herleidbare
      gegevens opgenomen.


