  - number: '7.7'
    text: |-
      1 Onze Minister stelt ten behoeve van de vaststelling van de rijksbijdrage jaarlijks de bijdragevergoedingen,
      bedoeld in [artikel 7.5][ref1] en [7.6][ref2], vast.

      2 Onze Minister stelt ten behoeve van de vast te stellen hoogte van de bijdragevergoedingen jaarlijks de onderlinge
      verhouding vast tussen de indicatoren, bedoeld in [artikel 7.1, derde lid, onderdelen a, c, e en g][ref3], en
      artikel 7.1, vierde lid, onderdeel c, enerzijds en de indicatoren, bedoeld in artikel 7.1, derde lid, onderdelen b,
      d, f en h, en artikel 7.1, vierde lid, onderdelen d en e, anderzijds.

      3 Onze Minister stelt de bijdragevergoedingen vast aan de hand van de verhouding, bedoeld in het tweede lid, de
      hoogte van de eigen bijdrage, bedoeld in [artikel 23, tweede lid, van de wet][ref4] en een uitvalpercentage ter
      hoogte van 10%.

      4 Onze Minister maakt de hoogte van de bijdragevergoedingen jaarlijks voor 15 september bekend.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel7.5
