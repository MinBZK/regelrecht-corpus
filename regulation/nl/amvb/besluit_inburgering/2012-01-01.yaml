  - number: '3.8'
    text: |-
      1 Onverminderd [artikel 3.7][ref1] omvat het praktijkdeel van het inburgeringsexamen van de kandidaat die
      geestelijke bedienaar is, tevens een examen in de kennis, bedoeld in [artikel 2.10, tweede lid][ref2].

      2 In afwijking van [artikel 3.7, eerste lid][ref3], omvat het praktijkdeel een beoordeling van de taalvaardigheden,
      bedoeld in [artikel 2.9][ref4], in een aantal praktijksituaties ontleend aan de domeinen burgerschap, werk alsmede
      sociaal-maatschappelijke en pastorale dienstverlening.

      3 In afwijking van [artikel 3.7, derde en vierde lid][ref5], worden de daar genoemde onderdelen van het
      praktijkdeel afgenomen onderscheidenlijk beoordeeld door een door Onze Minister aan te wijzen exameninstelling.

      4 Het examen, bedoeld in het eerste lid, kan slechts worden afgelegd nadat de examens, bedoeld in
      [artikel 3.7][ref6] en het tweede lid, alsmede het centraal deel van het inburgeringsexamen is afgelegd.

      5 Bij regeling van Onze Minister kunnen regels worden gesteld omtrent het examen, bedoeld in het eerste lid, en de
      exameninstelling, bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3.7
