  - number: '4.7'
    text: |-
      1 De terugbetaling van de lening geschiedt in maandelijkse termijnen, behoudens in de bij regeling van Onze
      Minister genoemde gevallen.

      2 Het bedrag van de maandelijkse termijn wordt op basis van het aantal maanden van de terugbetalingsperiode tot een
      gelijk bedrag vastgesteld bij de aanvang van de aanloopfase, bedoeld in [artikel 4.6, vierde lid][ref1], dan wel
      binnen acht weken na ontvangst van een verzoek als bedoeld in [artikel 4.6, derde lid, tweede volzin][ref2].

      3 Bij regeling van Onze Minister worden nadere regels gesteld over de hoogte van het bedrag van de maandelijkse
      termijn alsmede de wijze waarop deze wordt berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4.6
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel4.6
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel4.7
