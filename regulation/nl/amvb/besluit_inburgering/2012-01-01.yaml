  - number: '7.8'
    text: |-
      1 Gemeenten kunnen in onderling overleg besluiten tot een gezamenlijke aanwending van de aan hen te verstrekken
      rijksbijdragen.

      2 In geval van samenwerking als bedoeld in het eerste lid dragen de deelnemende gemeenten de hen
      bij of krachtens dit hoofdstuk toekomende rechten en de bij of krachtens dit hoofdstuk op hen
      rustende verplichtingen over aan een van hen, dan wel aan een openbaar lichaam als bedoeld in
      [artikel 8 van de Wet gemeenschappelijke regelingen][ref1].

      3 De colleges wie het betreft stellen Onze Minister voor 1 september, voorafgaand aan het jaar waarop de
      samenwerking betrekking heeft, in kennis van de samenwerking. Deze kennisgeving bevat in ieder geval:

      a. de namen van de deelnemende gemeenten;

      b. de naam van de gemeente dan wel het openbaar lichaam aan wie de in het tweede lid genoemde rechten en
      verplichtingen zijn overgedragen;

      c. een verklaring van de deelnemende gemeenten waaruit de in het tweede lid bedoelde overdracht van rechten en
      verplichtingen blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '8'
  - number: '7.9'
    text: |-
      1 Onze Minister kan de vastgestelde rijksbijdrage binnen een periode van vijf jaar na de bekendmaking ervan
      intrekken of ten nadele van de gemeente wijzigen:

      a. indien er sprake is van feiten of omstandigheden waarvan Onze Minister bij de vaststelling van de rijksbijdrage
      redelijkerwijs niet op de hoogte kon zijn en op grond waarvan de rijksbijdrage lager zou zijn vastgesteld;

      b. indien de vaststelling van de rijksbijdrage onjuist was en de gemeente dit wist of behoorde te weten;

      c. indien de gemeente na de vaststelling van de rijksbijdrage niet heeft voldaan aan de regels en voorschriften,
      vastgesteld bij en krachtens dit hoofdstuk.

      2 De intrekking of wijziging werkt terug tot en met het tijdstip waarop de rijksbijdrage is vastgesteld, tenzij bij
      de intrekking of wijziging anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel7.9
  - number: '7.10'
    text: |-
      1 Bij het geheel of gedeeltelijk intrekken van de rijksbijdrage op grond van [artikel 7.9][ref1] besluit Onze
      Minister tot:

      a. het onmiddellijk terugvorderen van de middelen, of

      b. het verrekenen van de middelen met nog te betalen rijksbijdragen.

      2 Indien Onze Minister toepassing geeft aan het eerste lid, onderdeel a, betaalt het college de middelen terug
      binnen drie maanden na de bekendmaking van het daartoe strekkende besluit van Onze Minister.

      3 Na het verstrijken van de termijn, bedoeld in het tweede lid, is de gemeente zonder aanmaning of rechterlijke
      tussenkomst de wettelijke rente verschuldigd.

      4 Indien volledige terugvordering naar het oordeel van Onze Minister tot een onbillijkheid van overwegende aard
      leidt, stelt Onze Minister de terugvordering op een lager bedrag vast.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel7.9
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel7.10
