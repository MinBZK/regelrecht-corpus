  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister voor Vreemdelingenzaken en Integratie van 10 juli 2006, Directie Wetgeving,
    nr. 5430382/06/6;

    Gelet op de artikelen 3, tweede en derde lid, 5, eerste lid, onderdeel c, derde en vierde lid, 6, tweede lid,
    onderdeel b, 7, tweede lid, 13, vierde lid, 15, vierde, vijfde en zesde lid, 16, eerste, derde, vierde en vijfde
    lid, 18, eerste, derde en vierde lid, 19, eerste lid, onderdeel a, en tweede lid, 23, vijfde lid, 28, 31, derde
    lid, 47, tweede lid, onderdeel a, en derde lid, 48, tweede lid, onderdelen a en b, en derde lid, 52, derde lid, 64,
    vierde lid, en 73 van de Wet inburgering en de artikelen 16a, tweede lid, 21, zesde lid, en 34, tweede lid, van de
    Vreemdelingenwet 2000, de artikelen 64, negende lid, en 67, derde lid, van de Wet werk en bijstand en artikel 17,
    derde lid, van de Financiële-verhoudingswet;

    De Raad van State gehoord (advies van 23 oktober 2006, nr. W03.06.0323/I);

    Gezien het nader rapport van Onze Minister voor Vreemdelingenzaken en Integratie van 1 december 2006, Directie
    Wetgeving, nr. 5451387/06/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. wet: de [Wet inburgering][ref1];

      b. inburgeringsdiploma: het diploma, bedoeld in [artikel 14, tweede lid, van de wet][ref2];

      c. Kwaliteitscentrum examinering inburgering: de krachtens [artikel 3.17, eerste lid][ref3], aangewezen
      rechtspersoon;

      d. onderzoek: het onderzoek, bedoeld in [artikel 25 van de wet][ref4];

      e. Informatiesysteem Inburgering: het informatiesysteem, bedoeld in [artikel 47 van de wet][ref5];

      f. Bestand Potentiële Inburgeringsplichtigen: het bestand, bedoeld in [artikel 48 van de wet][ref6];

      g. potentiële inburgeringsplichtige: een persoon als bedoeld in
      [artikel 48, eerste lid, tweede volzin, van de wet][ref7];

      h. rijksbijdrage: de rijksbijdrage, bedoeld in [artikel 52 van de wet][ref8], zoals [dat artikel][ref9] luidde voor
      de datum van inwerkingtreding van de [Wet participatiebudget][ref10];

      i. handhavingsbeschikking: de beschikking, bedoeld in [artikel 26 van de wet][ref11], die niet tevens is gegeven op
      grond van [artikel 19a, tweede lid, onderdeel c][ref12], of [artikel 22, tweede lid, van de wet][ref13];

      j. inburgeringsvoorziening: de inburgeringsvoorzieningen, bedoeld in [hoofdstuk 5, paragrafen 2][ref14]
      en [3][ref15], van de wet, de [Regeling inburgering allochtone vrouwen G31][ref16], de
      [Regeling inburgering allochtone vrouwen niet-G31][ref17] en het extensieve deel van de Pilot inburgering
      allochtone vrouwen Taal Totaal;

      k. gecombineerde inburgeringsvoorziening: een inburgeringsvoorziening, gecombineerd met een voorziening gericht op
      arbeidsinschakeling als bedoeld in de [artikelen 20, eerste lid][ref18], en [24b, eerste lid, van de wet][ref19];

      l. lening: de lening, bedoeld in [artikel 16 van de wet][ref20];

      m. [Wet inburgering nieuwkomers][ref21]: [Wet inburgering nieuwkomers][ref22] zoals die luidde op 31 december 2006;

      n. persoonsvolgend budget: budget dat wordt verstrekt ten behoeve van de inburgering van een persoon
      als bedoeld in het besluit van de Staatssecretaris van Justitie van 12 juni 2007, nr. 2007/11, houdende
      wijziging van de Vreemdelingencirculaire 2000 (Stcrt. 2007, 111), die inburgeringsplichtig is op grond van de
      [artikelen 3 tot en met 6 van de wet][ref23] en die op 1 januari 2008 in een opvangvoorziening als bedoeld in
      [artikel 1, onderdeel d, van de Wet Centraal Orgaan opvang asielzoekers][ref24] verblijft;

      o. duale inburgeringsvoorziening: inburgeringsvoorziening die met het oog op de actieve deelname aan de Nederlandse
      samenleving mede voorziet in activiteiten die in samenhang, en ten minste voor een deel gelijktijdig, met het
      verwerven van mondelinge en schriftelijke vaardigheden in de Nederlandse taal en kennis van de Nederlandse
      samenleving worden uitgevoerd;

      p. instapvoorziening inburgering: een voorziening welke de inburgeringsplichtige of de vrijwillige inburgeraar in
      staat stelt zich voor te bereiden, teneinde aan de inburgeringsvoorziening te kunnen deelnemen.


