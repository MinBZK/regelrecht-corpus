  - number: '5.4'
    text: |-
      1 Een aanvraag tot verlenging van de voor de inburgeringsplichtige geldende termijn, bedoeld in
      [artikel 7, eerste lid, van de wet][ref1], kan niet eerder worden ingediend dan zes maanden voor het verstrijken
      van die termijn. Het college geeft binnen acht weken na ontvangst van de aanvraag een beschikking.

      2 In bijzondere gevallen die de inburgeringsplichtige betreffen, kan het college ambtshalve
      besluiten tot verlenging van de voor de inburgeringsplichtige geldende termijn, bedoeld in
      [artikel 7, eerste lid, van de wet][ref2]. De beschikking kan niet eerder worden gegeven dan zes maanden voor het
      verstrijken van die termijn.

      3 In de beschikking wordt de duur van de verlenging vermeld.

      4 Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de verlenging van de termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel7
