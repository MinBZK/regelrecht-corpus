  - number: '2.8'
    text: |-
      1 Bij de aanvraag tot ontheffing van de inburgeringsplicht op grond van een psychische of lichamelijke
      belemmering dan wel verstandelijke handicap als bedoeld in [artikel 6, eerste lid, van de wet][ref1],
      legt de inburgeringsplichtige een advies over van een door het college aangewezen
      onafhankelijke arts, die is ingeschreven in het betreffende register, bedoeld in
      [artikel 3, eerste lid, van de Wet op de beroepen in de individuele gezondheidszorg][ref2].

      2 Het college geeft binnen acht weken na ontvangst van de aanvraag een beschikking.

      3 Indien het college, op grond van het advies, bedoeld in het eerste lid, van oordeel is dat de
      inburgeringsplichtige het inburgeringsexamen slechts kan afleggen onder bijzondere examenomstandigheden die zijn
      aangepast aan de mogelijkheden van die inburgeringsplichtige, wordt in de beschikking vermeld welke bijzondere
      examenomstandigheden het betreft.

      4 De ontheffing kan worden verleend indien redelijkerwijs verwacht mag worden dat de aard en de ernst van de
      psychische of lichamelijke belemmering dan wel verstandelijke handicap zodanig zijn dat het inburgeringsexamen niet
      binnen vijf jaar na de aanvraag van de ontheffing kan worden behaald.

      5 Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de verlening van de ontheffing alsmede
      omtrent het advies, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel3
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel2.8
    references:
      - id: ref1
