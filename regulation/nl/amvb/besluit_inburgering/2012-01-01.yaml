  - number: '3.24'
    text: |-
      Het Kwaliteitscentrum examinering inburgering stelt een klachtenregeling vast inzake behandeling van klachten
      over gedragingen van personen die belast zijn met het uitoefenen van taken voor het Kwaliteitscentrum examinering
      inburgering.
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel3.24
  - number: '3.25'
    text: |-
      1 Het Kwaliteitscentrum examinering inburgering verstrekt desgevraagd aan Onze Minister de voor de uitvoering van
      zijn taak benodigde inlichtingen. Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voorzover
      dat voor de vervulling van zijn taak redelijkerwijs nodig is.

      2 De instelling en de exameninstelling verstrekken desgevraagd aan het Kwaliteitscentrum examinering inburgering
      alle voor de uitvoering van zijn taken, bedoeld in [artikel 3.17][ref1], benodigde inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3.17
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel3.25
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3.17'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: '3.26'
    text: |-
      1 De exameninstellingen zenden het Kwaliteitscentrum examinering inburgering jaarlijks een verslag over de
      afgenomen examens, waaruit blijkt op welke wijze de exameninstelling en de examinering voldoen aan de bij en
      krachtens de [wet][ref1] gestelde eisen.

      2 Bij regeling van Onze Minister kunnen regels worden gesteld omtrent de inrichting en openbaarmaking van de
      verslagen, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020611
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel3.26
    references:
      - id: ref1
        bwb_id: BWBR0020611
  - number: '4.1'
    text: |-
      1 De lening wordt verstrekt ten behoeve van:

      a. het volgen bij een cursusinstelling van een cursus die opleidt tot, alsmede het afleggen van:

      1°. het inburgeringsexamen op de voor de betrokken inburgeringsplichtige op grond van
      [artikel 7, tweede lid, onderdeel a, van de wet][ref1] vastgestelde niveaus, en

      2°. indien de inburgeringsplichtige oudkomer is, het inburgeringsexamen op de niveaus, bedoeld in de
      [artikelen 2.9, eerste lid][ref2], en [2.10][ref3], of

      b. het volgen bij een cursusinstelling van een cursus die opleidt tot het examen, bedoeld in
      [artikel 2.3, eerste lid, onderdeel c][ref4].

      2 De lening wordt slechts verstrekt indien de inburgeringsplichtige een cursus volgt of heeft gevolgd bij een
      cursusinstelling die op het tijdstip waarop de inburgeringsplichtige zich voor de cursus heeft aangemeld, in het
      bezit is van het in [artikel 1, onderdeel j, van de wet][ref5] bedoelde keurmerk of certificaat.

      3 De lening wordt niet verstrekt indien op enig moment voor de inburgeringsplichtige een inburgeringsvoorziening
      is vastgesteld, tenzij deze inburgeringsvoorziening op grond van [artikel 23, vierde lid, van de wet][ref6] is
      vervallen en geen beschikking als bedoeld in [artikel 4.25, tweede lid, eerste volzin][ref7], is vastgesteld.

      4 Een lening ten behoeve van het afleggen van het inburgeringsexamen wordt slechts verstrekt indien de
      inburgeringsplichtige tevens een lening ontvangt ten behoeve van het volgen van een cursus.

      5 De lening wordt niet verstrekt indien aan de inburgeringsplichtige een persoonsvolgend budget is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
