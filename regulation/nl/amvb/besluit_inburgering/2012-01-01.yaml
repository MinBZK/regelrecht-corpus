  - number: '2.3'
    text: |-
      1 Niet inburgeringsplichtig is degene die beschikt over:

      a. het inburgeringsdiploma;

      b. een op wettelijke basis uitgereikt diploma of getuigschrift van afronding van een opleiding van wetenschappelijk
      onderwijs, hoger beroepsonderwijs, algemeen voortgezet onderwijs, beroepsonderwijs of leerlingwezen, na onderwijs
      te hebben gevolgd in de Nederlandse taal;

      c. een diploma staatsexamen Nederlands als tweede taal I of II als bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel c, van de Wet educatie en beroepsonderwijs][ref1];

      d. een met een van de in onderdeel b genoemde diploma’s of getuigschriften vergelijkbaar diploma of ander document,
      behaald in het Nederlandstalig onderwijs in België, mits een voldoende is behaald voor het vak Nederlandse taal;

      e. een met een van de in onderdeel b genoemde diploma’s of getuigschriften vergelijkbaar diploma of ander document,
      behaald in het Nederlandstalig onderwijs in Suriname, mits een voldoende is behaald voor het vak Nederlandse taal;

      f. een diploma, certificaat of ander document, behaald in het Nederlandstalig onderwijs in de openbare lichamen
      Bonaire, Sint Eustatius of Saba, of in Aruba, Curaçao of Sint Maarten, ten bewijze van afronding van een bij
      regeling van Onze Minister aangewezen opleiding, mits een voldoende behaald is voor het vak Nederlandse taal;

      g. het diploma van het Europees baccalaureaat van de Europese school, bedoeld in het Statuut van de Europese school
      (Trb. 1957, 246), voor zover dat baccalaureaat het vak Nederlands als eerste of tweede taal omvat en voor dat vak
      een voldoende is behaald;

      h. het getuigschrift International Baccalaureate Middle Years Certificate, International General Certificate of
      Secondary Education of Internationaal Baccalaureaat, indien daartoe een cursus Engels-Nederlandstalig onderwijs
      of een cursus Internationaal Baccalaureaat met daarin het vak Nederlands is gevolgd en voor dat vak een voldoende
      is behaald;

      i. het certificaat, bedoeld in [artikel 5, eerste lid, van het Besluit naturalisatietoets][ref2], met daarop de
      in [artikel 5, tweede lid, van dat besluit][ref3] bedoelde aantekening dat de verzoeker beschikt over de vereiste
      kennis van de Nederlandse taal;

      j. het certificaat, bedoeld in [artikel 13, tweede lid, van de Wet inburgering nieuwkomers][ref4] alsmede de
      verklaring van het regionaal opleidingencentrum op grond waarvan dat certificaat is afgegeven, indien uit die
      verklaring blijkt dat ten minste de volgende niveaus zijn behaald:

      1°. de volgende niveaus van de eindtermen Referentiekader Nederlands als Tweede Taal:

        - niveau 2 voor de onderdelen «Luisteren» en «Spreken», en
        - niveau 1 voor de onderdelen «Lezen» en «Schrijven», en

      2°. voor het onderdeel Maatschappij Oriëntatie:

        - het niveau van [artikel 11, eerste lid, onderdeel b, van die wet][ref5], of
        - een score van de MO-Profieltoets van ten minste: 85%, indien die toets is afgelegd voor 1 september 2001,
      respectievelijk 80%, indien die toets is afgelegd na 31 augustus 2001;

      k. het certificaat, bedoeld in de [Regeling certificaat inburgering oudkomers][ref6], indien uit de vermelding
      daarop blijkt dat ten minste de volgende niveaus zijn behaald:

      1°. niveau NT2 2 voor de onderdelen «Luisteren» en «Spreken», en

      2°. niveau NT2 1 voor de onderdelen «Lezen» en «Schrijven», of

      l. het document, bedoeld in [artikel 2.7, tweede lid][ref7].

      2 Bij regeling van Onze Minister kan worden voorzien in vrijstelling van de inburgeringsplicht op grond van andere
      diploma’s, certificaten of documenten dan genoemd in het eerste lid.


