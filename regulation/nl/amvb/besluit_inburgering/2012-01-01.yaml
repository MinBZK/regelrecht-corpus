  - number: '4.2'
    text: |-
      1 De inburgeringsplichtige heeft aanspraak op de lening gedurende een periode van ten hoogste drie jaar gerekend
      vanaf de eerste dag van de maand volgend op de eerste verstrekking van de lening.

      2 Het geleende bedrag wordt niet uitgekeerd, indien de inburgeringsplichtige:

      a. niet langer ingezetene is in de zin van de [Wet gemeentelijke basisadministratie persoonsgegevens][ref1];

      b. als vreemdeling geen rechtmatig verblijf meer heeft in de zin van
      [artikel 8, onderdelen a tot en met e, dan wel l, van de Vreemdelingenwet 2000][ref2],
      dan wel, in de in [artikel 2.2, eerste lid][ref3], bedoelde gevallen, in de zin van
      [artikel 8, onderdelen g of h, van de Vreemdelingenwet 2000][ref4].

      3 Bij regeling van Onze Minister worden regels gesteld over de hoogte en de betaling van de lening.


      [ref1]: https://wetten.overheid.nl/BWBR0006723
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0020674#Artikel2.2
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel8
