  - number: '6.1'
    text: |-
      1 Het Informatiesysteem Inburgering bevat uitsluitend persoonsgegevens van:

      a. inburgeringsplichtigen en gewezen inburgeringsplichtigen;

      b. andere dan de in onderdeel a bedoelde personen, die deelnemen aan het inburgeringsexamen;

      c. vrijwillige inburgeraars, personen ten aanzien van wie op grond van
      [artikel 3, eerste lid, van de Wet participatiebudget][ref1] een inburgeringsvoorziening of taalkennisvoorziening
      is vastgesteld, alsmede andere dan de in onderdeel a of b bedoelde personen, ten aanzien van wie een naar het
      inburgeringsexamen toeleidende inburgeringsvoorziening is vastgesteld op grond van:

      1°. de [Regeling inburgering allochtone vrouwen G31][ref2],

      2°. de [Regeling inburgering allochtone vrouwen niet-G31][ref3],

      3°. de Pilot inburgering allochtone vrouwen Taal Totaal,

      4°. de [Uitvoeringsregeling brede doeluitkering sociaal, integratie en veiligheid][ref4], of

      5°. de [Regeling vrijwillige inburgering niet-G31 2007][ref5];

      d. partners van debiteuren als bedoeld in [artikel 4.10][ref6], indien overeenkomstig [dat artikel][ref7] de
      draagkracht van de debiteur wordt bepaald;

      e. kinderen van debiteuren als bedoeld in [artikel 4.10][ref8], indien overeenkomstig [dat artikel][ref9] de
      draagkracht van de debiteur wordt bepaald en van deze debiteur geen inkomensgegevens bij de rijksbelastingdienst
      bekend zijn;

      f. personen ten aanzien van wie na een onderzoek als bedoeld in [artikel 25 van de wet][ref10], dan wel
      na een onderzoek door Onze Minister naar het bezit van een diploma, certificaat of document als bedoeld in
      [artikel 2.3][ref11], is vastgesteld dat zij niet inburgeringsplichtig zijn;

      g. personen ten aanzien van wie is gebleken dat zij aansluitend op de leerplicht of kwalificatieplicht een
      opleiding volgen als bedoeld in [artikel 5, eerste lid, onderdeel e, van de wet][ref12];

      h. personen ten aanzien van wie op redelijke gronden kan worden vermoed dat zij inburgeringsplichtig zijn.

      2 Het Informatiesysteem Inburgering bevat de in de bijlage bij dit besluit opgenomen gegevens. Persoonsgegevens
      worden opgenomen zoals deze zijn opgenomen in de gemeentelijke basisadministratie persoonsgegevens.

      3 Bij regeling van Onze Minister kan de bijlage bij dit besluit worden gewijzigd.


