  - number: '3.9'
    text: |-
      1 Het centraal deel van het inburgeringsexamen bestaat uit:

      a. een elektronisch praktijkexamen,

      b. een toets gesproken Nederlands, en

      c. een examen in de kennis van de Nederlandse samenleving.

      2 De in het eerste lid genoemde examens worden afgelegd door middel van een door Onze Minister beheerd
      geautomatiseerd systeem.

      3 De resultaten van de in het eerste lid genoemde examens worden door Onze Minister beoordeeld door middel van
      het geautomatiseerde systeem, bedoeld in het tweede lid. De resultaten worden uitgedrukt in «geslaagd» of «niet
      geslaagd». De resultaten worden niet herbeoordeeld.

      4 De resultaten van het in het eerste lid genoemde examen waarbij het geautomatiseerde systeem niet tot een
      beoordeling heeft kunnen komen, worden beoordeeld door examinatoren.

      5 Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de examens, genoemd in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel3.9
  - number: '3.10'
    text: |-
      1 Het inburgeringsdiploma wordt uitgereikt door Onze Minister.

      2 Het inburgeringsdiploma wordt ondertekend door Onze Minister.

      3 Duplicaten van inburgeringsdiploma’s worden tegen betaling van de kostprijs, uitsluitend door Onze Minister
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel3.10
  - number: '3.11'
    text: |-
      1 De exameninstelling stelt een examencommissie in, die bestaat uit ten minste drie leden, onder wie ten minste
      twee examinatoren.

      2 De examencommissie heeft tot taak het afnemen van een of meer van de examens van het inburgeringsexamen.

      3 De leden van de examencommissie beschikken over relevante deskundigheid op het gebied van examinering en
      taalvaardigheidsonderwijs.

      4 Een examinator kan slechts worden benoemd tot lid van de examencommissie, indien hij de bij regeling van Onze
      Minister vastgestelde training met goed gevolg heeft afgerond.

      5 Bij de uitoefening van de taak, bedoeld in het tweede lid, heeft ten minste een van de examinatoren, bedoeld in
      het eerste lid, niet het inburgeringsonderwijs van de kandidaat verzorgd.

      6 Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de examencommissie.
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel3.11
  - number: '3.12'
    text: |-
      1 De exameninstelling stelt een onafhankelijke commissie van beroep in, dan wel sluit zich bij een dergelijke
      commissie aan.

      2 De commissie heeft tot taak de behandeling en beslechting van geschillen over beslissingen van de examencommissie
      of van de examinatoren terzake van het praktijkdeel van het inburgeringsexamen.

      3 De commissie bestaat uit een even aantal gewone leden en evenveel plaatsvervangende leden, een voorzitter, tevens
      lid, en een plaatsvervangend voorzitter.

      4 De leden en de plaatsvervangende leden maken geen deel uit van het bevoegd gezag van de exameninstelling of van
      een examencommissie als bedoeld in [artikel 3.11][ref1].

      5 De commissie stelt een onderzoek in alvorens te beslissen. Zij stelt bij haar beslissing zo nodig vast op welke
      wijze de kandidaat alsnog in de gelegenheid zal worden gesteld het examen geheel of gedeeltelijk af te leggen.

      6 De commissie maakt haar beslissing bekend aan de kandidaat, aan de ouders, voogden of verzorgers van de kandidaat
      indien deze minderjarig is, aan het bevoegd gezag van de exameninstelling en aan Onze Minister.

      7 Indien de commissie het beroep gegrond acht, vernietigt zij de beslissing geheel of gedeeltelijk. Zij kan bepalen
      dat opnieuw of alsnog in de zaak wordt beslist, dan wel dat het praktijkdeel van het inburgeringsexamen of enig
      onderdeel daarvan opnieuw wordt afgenomen onder door de commissie te stellen voorwaarden. De examencommissie of de
      examinator van wie de beslissing is vernietigd, voorziet voor zover nodig opnieuw in de zaak met inachtneming van
      de uitspraak van de commissie van beroep voor de praktijkexamens. De commissie kan daarvoor in haar uitspraak een
      termijn stellen.

      8 Indien onverwijlde spoed, gelet op de betrokken belangen, dit vereist, kan de commissie op verzoek van de
      kandidaat, in afwachting van de uitspraak in de hoofdzaak, een voorlopige voorziening treffen, na de desbetreffende
      examencommissie dan wel de desbetreffende examinator te hebben gehoord, althans behoorlijk te hebben opgeroepen.

      9 Herziening van een uitspraak van de commissie kan op verzoek van elk van beide partijen plaatsvinden op grond van
      nader gebleken feiten of omstandigheden die indien deze eerder bekend waren geweest tot een andere uitspraak zouden
      hebben kunnen leiden.

      10 De leden van de examencommissie en de examinatoren verstrekken aan de commissie de inlichtingen die de commissie
      voor de uitvoering van haar taak nodig oordeelt.

      11 Bij regeling van Onze Minister worden nadere regels gesteld omtrent de commissie van beroep. Daarbij worden in
      ieder geval regels gesteld omtrent de benoeming en het ontslag van de voorzitter, de plaatsvervangend voorzitter en
      de overige leden en plaatsvervangende leden.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3.11
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel3.12
