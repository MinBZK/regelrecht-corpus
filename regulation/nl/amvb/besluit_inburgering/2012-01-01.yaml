  - number: '4.4'
    text: Onze Minister geeft binnen acht weken na ontvangst van de aanvraag een beschikking.
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel4.4
  - number: '4.5'
    text: |-
      1 Onze Minister stelt jaarlijks vóór 1 december ten behoeve van het daarop volgende jaar een rentepercentage vast
      dat gelijk is aan het gemiddeld effectief rendement over de maand oktober van dat jaar van de openbare lening,
      uitgegeven door de Staat der Nederlanden en toegelaten tot de notering aan de officiële markt ter beurze van
      Amsterdam, met een resterende looptijd, zo dicht mogelijk bij 10 jaren, tussen 8 en 11 jaren.

      2 De renteberekening gaat in op de dag waarop het bedrag aan lening bij Onze Minister is afgeschreven.

      3 Bij regeling van Onze Minister worden nadere regels gesteld omtrent de wijze waarop de rente wordt berekend over
      de aangegane lening.

      4 In afwijking van het eerste lid geldt voor 2007 een rentepercentage dat door Onze Minister is vastgesteld vóór
      1 januari 2007.
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel4.5
  - number: '4.6'
    text: |-
      1 De terugbetalingsperiode beslaat ten hoogste drie jaren.

      2 In geval van wijziging van het bedrag van de maandelijkse termijn naar aanleiding van een verzoek tot
      draagkrachtvaststelling als bedoeld in [artikel 4.9][ref1], kan deze periode worden verlengd tot ten hoogste zeven
      jaren.

      3 De terugbetalingsperiode vangt aan op de eerste dag van de maand volgend op het in
      [artikel 17, eerste lid, van de wet][ref2] bedoelde tijdstip. De terugbetalingsperiode kan op schriftelijk verzoek
      van de debiteur aanvangen op een eerder tijdstip, in welk geval de aanspraak op de lening vervalt.

      4 Gedurende de in [artikel 17, eerste lid, van de wet][ref3] bedoelde aanloopfase van zes maanden bestaat geen
      verplichting tot terugbetaling, doch is wel rente verschuldigd over het bedrag van de lening.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4.9
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel17
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel4.6
