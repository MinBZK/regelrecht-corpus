  - number: '3.13'
    text: |-
      Bij regeling van Onze Minister worden normen voor de kwaliteit van de examinering vastgesteld die in ieder geval
      betrekking hebben op:

      a. de afname van de examens;

      b. de voorwaarden voor toelating tot de examens;

      c. de deskundigheid van de examinatoren;

      d. het vaststellen van de uitslag van de examens;

      e. de waarborging van de kwaliteit van de examinering.
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel3.13
  - number: '3.14'
    text: |-
      1 Een instelling kan slechts als exameninstelling in de zin van [artikel 15, eerste lid, van de wet][ref1] worden
      aangewezen, indien:

      a. de instelling een onderneming of rechtspersoon is die is ingeschreven in het handelsregister of een register
      dat wordt gehouden door een daartoe bevoegde instantie in een andere lidstaat van de Europese Unie dan wel in
      een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een daartoe strekkend of mede daartoe
      strekkend verdrag dat Nederland bindt, en dat een gelijkwaardig doel dient;

      b. de continuïteit van de instelling en de examinering redelijkerwijs zijn gewaarborgd, en

      c. de instelling beschikt over een examenreglement, waaruit blijkt dat de instelling en de examinering voldoen aan
      de bij en krachtens de [wet][ref2] gestelde eisen.

      2 Over de aanvraag tot aanwijzing wordt het Kwaliteitscentrum examinering inburgering gehoord.

      3 Bij de aanvraag legt de aanvrager in ieder geval het rapport van het onderzoek, bedoeld in
      [artikel 3.17, tweede lid, onderdeel a][ref3], over.

      4 Op de aanvraag wordt beslist binnen acht weken na ontvangst van de aanvraag.

      5 Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent het eerste lid alsmede omtrent de
      aanvraag en de behandeling daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0020611
      [ref3]: https://wetten.overheid.nl/BWBR0020674#Artikel3.17
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0020611
      - id: ref3
        bwb_id: BWBR0020674
        artikel: '3.17'
        hoofdstuk: '3'
