  - number: '6.4'
    text: |-
      1 Het Bestand Potentiële Inburgeringsplichtigen bevat de volgende persoonsgegevens van potentiële
      inburgeringsplichtigen, zoals deze zijn opgenomen in de gemeentelijke basisadministratie persoonsgegevens:

      a. burgerservicenummer;

      b. A-nummer;

      c. naamgegevens;

      d. geslacht;

      e. geboortedatum;

      f. geboorteplaats;

      g. geboorteland of land van herkomst;

      h. adresgegevens;

      i. woonplaats;

      j. nationaliteit;

      k. gegevens inzake vestiging in en vertrek uit Nederland.

      2 Het Bestand Potentiële Inburgeringsplichtigen bevat tevens de volgende persoonsgegevens van potentiële
      inburgeringsplichtigen, zoals deze bekend zijn bij Onze Minister van Justitie:

      a. gegevens inzake de aard van het verblijfsdoel;

      b. gegevens inzake het al dan niet rechtmatig verblijf in Nederland.
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel6.4
  - number: '6.5'
    text: |-
      1 De volgende instanties verstrekken aan de beheerder van het Bestand Potentiële Inburgeringsplichtigen uit eigen
      beweging of op verzoek alle gegevens die noodzakelijk zijn voor het bijhouden dan wel schonen van dat bestand:

      a. het college;

      b. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      c. Onze Minister van Justitie;

      d. Onze Minister;

      e. Onze Minister van Onderwijs, Cultuur en Wetenschap.

      2 Persoonsgegevens die zijn opgenomen in het Bestand Potentiële Inburgeringsplichtigen worden slechts ter
      beschikking gesteld aan het college, Onze Minister en het Uitvoeringsinstituut werknemersverzekeringen. Deze
      gegevens worden niet gebruikt voor een ander doel dan genoemd in [artikel 48, tweede lid, van de wet][ref1].

      3 De verstrekking, bedoeld in [artikel 48, tweede lid, onderdeel c, van de wet][ref2] geschiedt zodanig dat de
      gegevens niet kunnen worden herleid tot een natuurlijk persoon.

      4 Bij regeling van Onze Minister kunnen andere instanties worden aangewezen ten aanzien waarvan de in het
      eerste lid bedoelde verplichting eveneens geldt of waaraan eveneens gegevens uit het Bestand Potentiële
      Inburgeringsplichtigen worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel48
