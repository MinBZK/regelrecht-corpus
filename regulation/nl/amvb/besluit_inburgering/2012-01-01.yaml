  - number: '9.1'
    text: |-
      1 Op een door een inburgeringsplichtige vóór 1 januari 2007 tijdig ingediende aanvraag tot ontheffing als bedoeld
      in [artikel 3, eerste lid, onderdeel a, van de Wet inburgering nieuwkomers][ref1] of tot verlenging van de duur
      daarvan als bedoeld in [artikel 3, vierde lid, van die wet][ref2], waarop vóór die datum nog niet is beslist, wordt
      alsnog beslist met inachtneming van het bepaalde bij en krachtens [die wet][ref3].

      2 Indien de in het eerste lid bedoelde aanvraag wordt afgewezen, blijft het bepaalde bij en krachtens
      de [Wet inburgering nieuwkomers][ref4] op die inburgeringsplichtige van toepassing, onverminderd
      [artikel 7 van de wet][ref5].

      3 Indien aan een inburgeringsplichtige met toepassing van
      [artikel 3, eerste lid, onderdeel a, van de Wet inburgering nieuwkomers][ref6] een ontheffing voor bepaalde tijd is
      verleend, vangt de in [artikel 7, eerste lid, van de wet][ref7] bedoelde termijn niet eerder aan dan nadat de duur
      van die ontheffing is verstreken.

      4 Voor de toepassing van [artikel 64, eerste lid, van de wet][ref8] wordt de
      inburgeringsplichtige die vóór 1 januari 2007 tijdig een aanvraag tot ontheffing als bedoeld in
      [artikel 3, eerste lid, onderdeel c, van de Wet inburgering nieuwkomers][ref9] heeft ingediend, geacht te hebben
      voldaan aan de in [artikel 2, eerste lid, van die wet][ref10] bedoelde verplichting.

      5 Zolang het bepaalde bij en krachtens de [Wet inburgering nieuwkomers][ref11] op de inburgeringsplichtige van
      toepassing is, is ten aanzien van hem [§ 1 van hoofdstuk 5 van de wet][ref12] niet van toepassing.

      6 Ten aanzien van de inburgeringsplichtige op wie ingevolge [artikel 64, eerste lid, van de wet][ref13] dan wel
      het tweede of vierde lid van dit artikel het bepaalde bij en krachtens de [Wet inburgering nieuwkomers][ref14] van
      toepassing is, geldt dat in de [artikelen 2.3, eerste lid, onderdeel j, subonderdeel 1°, tweede streepje][ref15],
      en [2.4, eerste lid, onderdeel b][ref16], in plaats van «niveau 1» wordt gelezen: niveau 2.


