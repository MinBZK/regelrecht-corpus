  - number: '4.12'
    text: Bij regeling van Onze Minister worden regels gesteld omtrent verzuim, aanmaning en de invordering van de schuld.
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel4.12
  - number: '4.13'
    text: |-
      1 De schuld kan op verzoek van de inburgeringsplichtige door Onze Minister in bij regeling van Onze Minister aan te
      wijzen gevallen geheel of gedeeltelijk worden kwijtgescholden.

      2 Onze Minister geeft binnen acht weken na ontvangst van de aanvraag van een debiteur om gehele of gedeeltelijke
      kwijtschelding een beschikking.
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel4.13
  - number: '4.14'
    text: |-
      1 De schuld die bij het einde van de terugbetalingsperiode resteert omdat overeenkomstig
      [artikel 4.11, tweede lid][ref1], de termijn opnieuw is vastgesteld, gaat op dat ogenblik teniet, met uitzondering
      van achterstallige termijnen.

      2 De schuld die resteert bij het overlijden van de debiteur gaat op dat ogenblik teniet.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4.11
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel4.14
