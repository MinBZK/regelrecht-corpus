  - number: '2.5'
    text: |-
      Geheel vrijgesteld van de inburgeringsplicht is degene:

      a. ten aanzien van wie met toepassing van [artikel 5, tweede lid, van de Wet inburgering nieuwkomers][ref1] is
      besloten het vaststellen van een inburgeringsprogramma achterwege te laten;

      b. die een toets als bedoeld in [artikel 5, vierde lid, van de Wet inburgering nieuwkomers][ref2] met goed
      gevolg heeft afgelegd, als gevolg waarvan hij beschikt over een besluit inhoudende dat de vaststelling van een
      inburgeringsprogramma achterwege wordt gelaten, of

      c. die kan aantonen dat hij ingevolge [artikel 4 van het Besluit naturalisatietoets][ref3] de naturalisatietoets
      niet behoeft of behoefde af te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009544#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0013604#Artikel4
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel2.5
