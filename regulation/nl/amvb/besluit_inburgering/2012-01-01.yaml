    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot de wijze waarop het aantal oudkomers
      wordt vastgesteld aan wie het college in een door Onze Minister te bepalen tijdvak een handhavingsbeschikking
      bekendmaakt.
