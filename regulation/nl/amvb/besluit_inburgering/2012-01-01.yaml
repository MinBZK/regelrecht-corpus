      1 Onze Minister stelt ten behoeve van de vaststelling van de rijksbijdrage voor een gemeente ten behoeve van nieuwe
      inburgeringsplichtigen jaarlijks de bijdragevergoedingen, bedoeld in [artikel 7.15][ref1], vast.

      2 Onze Minister maakt de hoogte van de bijdragevergoedingen jaarlijks voor 15 november bekend.


