  - number: '7.6'
    text: |-
      1 Het vaste en variabele deel van de rijksbijdrage voor een gemeente wordt berekend met de formule A = B + [ C x
      D ] + [ E x F ] + [ G x H ] + [ I x J ] + [ K x L ]

      waarin wordt voorgesteld:

        - met de letter A: het vaste en variabele deel van de rijksbijdrage;
        - met de letter B: het verleende voorschot op het vaste deel van de rijksbijdrage;
        - met de letter C: het aantal inburgeringsplichtigen aan wie het college in het jaar waarop het vaste en variabele
      deel van de rijksbijdrage betrekking hebben een handhavingsbeschikking bekend heeft gemaakt;
        - met de letter D: de bijdragevergoeding ten aanzien van de bekendmaking van een handhavingsbeschikking;
        - met de letter E: het aantal inburgeringsplichtigen aan wie het college in het jaar waarop het vaste en variabele
      deel van de rijksbijdrage betrekking hebben een kennisgeving als bedoeld in [artikel 5.3, derde lid][ref1], heeft
      verstrekt;
        - met de letter F: de bijdragevergoeding ten aanzien van de verstrekking van een kennisgeving als bedoeld in
      [artikel 5.3, derde lid][ref2];
        - met de letter G: het aantal geestelijke bedienaren ten behoeve van wie het college in het jaar waarop het vaste
      en variabele deel van de rijksbijdrage betrekking hebben een inburgeringsvoorziening heeft vastgesteld;
        - met de letter H: de bijdragevergoeding ten aanzien van de vaststelling van een inburgeringsvoorziening voor een
      geestelijke bedienaar;
        - met de letter I: het aantal geestelijke bedienaren dat in het jaar waarop het vaste en variabele deel van
      de rijksbijdrage betrekking hebben, heeft deelgenomen aan het inburgeringsexamen of het examen, bedoeld in
      [artikel 2.3, eerste lid, onderdeel c][ref3];
        - met de letter J: de bijdragevergoeding ten aanzien van de deelname door een geestelijke bedienaar aan het
      inburgeringsexamen of het examen, bedoeld in [artikel 2.3, eerste lid, onderdeel c][ref4];
        - met de letter K: het aantal geestelijke bedienaren dat in het jaar waarop het vaste en variabele deel van de
      rijksbijdrage betrekking hebben, heeft deelgenomen aan het aanvullend praktijkdeel van het inburgeringsexamen,
      bedoeld in [artikel 3.8, eerste lid][ref5];
        - met de letter L: de bijdragevergoeding ten aanzien van de deelname door een geestelijke bedienaar aan het
      aanvullend praktijkdeel van het inburgeringsexamen, bedoeld in [artikel 3.8, eerste lid][ref6].

      2 Het college verstrekt de gegevens bedoeld in de letters C, E, G, I en K van het eerste lid, tezamen met de
      jaarrekening, bedoeld in [artikel 186 van de Gemeentewet][ref7], welke betrekking heeft op het jaar waarop het
      variabele deel van de rijksbijdrage betrekking heeft. De jaarrekening is voorzien van de accountantsverklaring,
      bedoeld in [artikel 213, derde lid, van de Gemeentewet][ref8]. Het college vergewist zich ervan dat de gegevens
      zijn opgenomen in het Informatiesysteem Inburgering.

      3 Indien Onze Minister de gegevens en de accountantsverklaring niet binnen zesentwintig weken na het verstrijken
      van de termijn, bedoeld in [artikel 17b, derde lid, aanhef en onderdeel a, van de Financiële-verhoudingswet][ref9]
      heeft ontvangen stelt Onze Minister de hoogte van de letters C, E, G, I en K in de formule, bedoeld in het eerste
      lid, vast op nul.

      4 Onze Minister stelt het vaste en variabele deel van de rijksbijdrage uiterlijk dertig weken na het verstrijken van
      de termijn, bedoeld in [artikel 17b, derde lid, aanhef en onderdeel a, van de Financiële-verhoudingswet][ref10],
      vast.

      5 Het vaste en variabele deel van de rijksbijdrage worden vastgesteld onder voorbehoud van goedkeuring van de
      beschikbare middelen door de begrotingswetgever en kunnen worden verlaagd in verband met wijzigingen van de
      rijksbegroting.

      6 Het vaste en variabele deel van de rijksbijdrage worden verrekend met het voorschot dat is verleend ten behoeve
      van de jaren 2007 en 2008. Het uit de verrekening resulterende positieve of negatieve saldo wordt uiterlijk zes
      maanden na de vaststelling ervan aan de gemeente betaald.


