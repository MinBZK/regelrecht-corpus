        artikel: '8'
  - number: '4.11'
    text: |-
      1 Onze Minister geeft binnen acht weken na ontvangst van de aanvraag, bedoeld in [artikel 4.9][ref1], een
      beschikking.

      2 Indien het bedrag van de draagkracht lager is dan het bedrag van de overeenkomstig [artikel 4.8][ref2]
      vastgestelde termijn, wordt zijn termijn opnieuw vastgesteld met ingang van de maand daaropvolgend. Daarbij wordt
      tevens zijn resterende terugbetalingsperiode bepaald.

      3 Indien het bedrag van de draagkracht hoger is dan het bedrag van de overeenkomstig [artikel 4.8][ref3]
      vastgestelde termijn, betaalt de debiteur het bedrag van de in [artikel 4.8][ref4] vastgestelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4.9
