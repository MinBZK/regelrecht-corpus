  - number: '2.6'
    text: |-
      1 Het verblijf in Nederland tijdens de leerplichtige leeftijd, bedoeld in
      [artikel 5, eerste lid, onderdeel b, van de wet][ref1], blijkt uit inschrijving als ingezetene in de gemeentelijke
      basisadministratie persoonsgegevens, dan wel inschrijving in de daaraan voorafgaande bevolkingsboekhouding.

      2 Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de inschrijving in de
      bevolkingsboekhouding, bedoeld in het eerste lid, en kan van het eerste lid worden afgeweken op grond van concrete
      aanwijzingen dat de inschrijving kennelijk onjuist was.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel5
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '5'
  - number: '2.7'
    text: |-
      1 Geheel vrijgesteld van de inburgeringsplicht is degene die beschikt over een document waaruit blijkt dat ten
      minste de volgende niveaus zijn behaald:

      a. vaardigheden in de Nederlandse taal op het niveau B1 van het Europees Raamwerk voor Moderne Vreemde Talen, en

      b. kennis van de Nederlandse samenleving op het krachtens [artikel 2.10, eerste lid][ref1], vastgestelde niveau.

      2 Door Onze Minister wordt op aanvraag een document verstrekt aan degene die een toets heeft afgelegd, waaruit
      blijkt dat hij beschikt over de in het eerste lid bedoelde vaardigheden en kennis.

      3 Een aanvraag als bedoeld in het tweede lid kan niet worden gedaan door degene:

      a. die reeds eerder de toets heeft afgelegd;

      b. die een lening heeft aangevraagd, of

      c. ten aanzien van wie een inburgeringsvoorziening is vastgesteld.

      4 Onze Minister stelt de toets vast en neemt deze af door middel van een geautomatiseerd systeem.
      [Artikel 3.5, eerste, derde en vierde lid][ref2], is van overeenkomstige toepassing.

      5 De toets wordt onder toezicht van Onze Minister afgelegd op een door Onze Minister vast te stellen tijdstip
      en in een door Onze Minister vast te stellen ruimte, nadat de aanvrager overeenkomstig door Onze Minister
      gestelde regels de terzake verschuldigde kosten heeft voldaan en zich met een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref3] heeft geïdentificeerd.

      6 Onze Minister beoordeelt de resultaten van de toets door middel van het geautomatiseerde systeem, bedoeld in het
      vierde lid. Deze resultaten worden niet herbeoordeeld.

      7 Bij regeling van Onze Minister worden het model van het document, bedoeld in het tweede lid, en de kosten,
      bedoeld in het vijfde lid, vastgesteld en kunnen nadere regels worden gesteld omtrent de toepassing van dit
      artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2.10
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel3.5
      [ref3]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel2.7
