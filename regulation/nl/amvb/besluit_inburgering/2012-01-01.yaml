      1 Indien het college een persoonlijk inburgeringsbudget als bedoeld in [artikel 19, tweede lid][ref1], of
      [artikel 24a, tweede lid, van de wet][ref2] aanbiedt, begeleidt het college de inburgeringsplichtige of de
      vrijwillige inburgeraar bij de vormgeving van zijn inburgering en de keuze van een inburgeringsbedrijf.

      2 Het voorstel van de inburgeringsplichtige of de vrijwillige inburgeraar behoeft de goedkeuring van het college.

      3 De gemeenteraad bepaalt bij verordening wie als enige partij of partijen met het inburgeringsbedrijf een
      overeenkomst met betrekking tot de inburgering van de inburgeringsplichtige of de vrijwillige inburgeraar sluit.


