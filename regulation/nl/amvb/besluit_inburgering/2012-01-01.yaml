        afdeling: '2'
  - number: '3.4'
    text: |-
      Op verzoek van degene die het examen afneemt of daarop toezicht houdt, identificeert de kandidaat zich met een
      document als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '3.5'
    text: |-
      1 Onze Minister stelt de kandidaat met een psychische of lichamelijke belemmering of verstandelijke handicap op
      diens verzoek in de gelegenheid het inburgeringsexamen dan wel een deel daarvan af te leggen op een wijze die is
      aangepast aan zijn mogelijkheden.

      2 Indien het college bij de toepassing van [artikel 2.8][ref1] heeft geoordeeld dat de inburgeringsplichtige
      het inburgeringsexamen dan wel een deel daarvan slechts kan afleggen op een wijze die is aangepast aan de
      mogelijkheden van die inburgeringsplichtige, legt de kandidaat bij de aanvraag de beschikking, bedoeld in het
      [derde lid van dat artikel][ref2] over.

      3 In de overige gevallen legt de kandidaat een advies over van een
      onafhankelijke arts, die is ingeschreven in het betreffende register, bedoeld in
      [artikel 3, eerste lid, van de Wet op de beroepen in de individuele gezondheidszorg][ref3], waaruit blijkt dat
      hij het inburgeringsexamen dan wel een deel daarvan slechts kan afleggen op een wijze die is aangepast aan zijn
      mogelijkheden.

      4 Bij regeling van Onze Minister worden regels gesteld over de toepassing van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2.8
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel2.8
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel3
