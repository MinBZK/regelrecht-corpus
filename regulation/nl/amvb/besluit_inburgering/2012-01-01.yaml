  - number: '3.1'
    text: |-
      1 Degene die wenst te worden toegelaten tot het praktijkdeel van het inburgeringsexamen, meldt zich daartoe aan
      overeenkomstig de door de exameninstelling gestelde regels.

      2 De exameninstelling bevestigt de aanmelding schriftelijk.
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel3.1
  - number: '3.2'
    text: |-
      1 Degene die wenst te worden toegelaten tot een examen van het centraal deel van het inburgeringsexamen, meldt zich
      daartoe schriftelijk aan bij Onze Minister overeenkomstig de door Onze Minister gestelde regels.

      2 Onze Minister bevestigt de aanmelding schriftelijk.
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel3.2
  - number: '3.3'
    text: |-
      1 Voor toelating tot de bij Onze Minister af te leggen examens is examengeld verschuldigd, dat overeenkomstig door
      Onze Minister vastgestelde regels wordt voldaan.

      2 Het examengeld voor de examens die bij Onze Minister worden afgelegd, wordt vastgesteld bij regeling van Onze
      Minister.

      3 Het examengeld voor de examens die bij een op grond van [artikel 3.14, eerste lid][ref1], aangewezen
      exameninstelling worden afgelegd, wordt vastgesteld door die exameninstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3.14
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel3.3
