  - number: '4.21'
    text: |-
      1 Geen recht op een vergoeding als bedoeld in
      [artikel 4.17, eerste lid, onderdeel a, en tweede lid, onderdeel a][ref1], heeft de gewezen inburgeringsplichtige
      voor wie een inburgeringsvoorziening is vastgesteld, tenzij deze inburgeringsvoorziening op grond van
      [artikel 23, vierde lid, van de wet][ref2] is vervallen en geen beschikking als bedoeld in artikel in
      [artikel 4.25, tweede lid, eerste volzin][ref3], is vastgesteld.

      2 Geen recht op een vergoeding als bedoeld in
      [artikel 4.17, eerste lid, onderdelen a en b, en tweede lid, onderdelen a en b][ref4], heeft degene die op het
      tijdstip waarop het inburgeringsexamen of het examen, bedoeld in [artikel 2.3, eerste lid, onderdeel c][ref5] is
      behaald, niet inburgeringsplichtig was, tenzij de inburgeringsplicht is geëindigd wegens:

      a. het bereiken van de 65-jarige leeftijd, of

      b. een andere omstandigheid en op dat tijdstip een schuld bestond uit een niet eerder dan drie jaar voor dat
      tijdstip overeenkomstig [artikel 4.1][ref6] verstrekte lening.

      3 Geen recht op een vergoeding als bedoeld in
      [artikel 4.17, eerste lid, onderdelen a en b, tweede lid, onderdelen a en b, en derde lid][ref7] heeft:

      a. de vreemdeling zonder rechtmatig verblijf in de zin van
      [artikel 8, onderdelen a tot en met e, dan wel l, van de Vreemdelingenwet 2000][ref8], tenzij het betreft
      een vreemdeling als bedoeld in [artikel 2.2, eerste lid][ref9], met rechtmatig verblijf in de zin van
      [artikel 8, onderdeel g of h, van de Vreemdelingenwet 2000][ref10];

      b. degene aan wie de vergoeding reeds eerder is verstrekt;

      c. degene aan wie een persoonsvolgend budget is verstrekt.


