  - number: '6.6'
    text: |-
      Onze Minister verwijdert de gegevens van een in het Bestand Potentiële Inburgeringsplichtigen opgenomen persoon,
      indien de betrokkene:

      a. is overleden;

      b. blijkens de gemeentelijke basisadministratie persoonsgegevens de Nederlandse nationaliteit heeft verkregen of
      uit Nederland is vertrokken, of

      c. in het Informatiesysteem Inburgering wordt opgenomen.
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel6.6
  - number: '6.7'
    text: Het Bestand Potentiële Inburgeringsplichtigen wordt opgeheven op 1 januari 2057.
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel6.7
  - number: '6.8'
    text: |-
      Met betrekking tot het Informatiesysteem Inburgering en het Bestand Potentiële Inburgeringsplichtigen is Onze
      Minister de verantwoordelijke in de zin van de [Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: '6.9'
    text: |-
      Onder «college» wordt voor de toepassing van dit hoofdstuk mede verstaan het college van burgemeester
      en wethouders van de gemeente waar een persoon wiens gegevens in het Informatiesysteem Inburgering
      of het Bestand Potentiële Inburgeringsplichtigen zijn opgenomen, woonplaats heeft in de zin van
      [titel 3 van Boek 1 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel6.9
    references:
