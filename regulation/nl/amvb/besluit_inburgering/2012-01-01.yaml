        artikel: '3.17'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: '3.21'
    text: |-
      1 Ter uitvoering van de taak, bedoeld in [artikel 3.17, tweede lid, onderdeel b][ref1], onderzoekt het
      Kwaliteitscentrum examinering inburgering jaarlijks de exameninstellingen en de examinering door de
      exameninstellingen.

      2 Het Kwaliteitscentrum examinering inburgering stelt de exameninstelling in kennis van de aanvangsdatum alsmede
      van de planning van het onderzoek, bedoeld in het eerste lid. Kennisgeving geschiedt ten minste vier weken voor
      aanvang van een onderzoek.

      3 Bij regeling van Onze Minister kunnen regels worden gesteld omtrent het in rekening brengen van een vergoeding
      ter zake van het onderzoek door het Kwaliteitscentrum examinering inburgering aan de exameninstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3.17
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel3.21
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3.17'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: '3.22'
    text: |-
      1 Het Kwaliteitscentrum examinering inburgering legt zijn oordeel na een onderzoek als bedoeld in
      [artikel 3.21, eerste lid][ref1], vast in een verklaring. Het Kwaliteitscentrum examinering inburgering verstrekt:

      a. een goedkeurende verklaring indien de exameninstelling en de examinering voldoen aan de bij en krachtens de
      [wet][ref2] gestelde eisen;

      b. een afkeurende verklaring indien de exameninstelling en de examinering niet voldoen aan de bij en krachtens de
      [wet][ref3] gestelde eisen, waarbij het naar het oordeel van het Kwaliteitscentrum examinering inburgering niet
      aannemelijk is dat dit binnen een half jaar alsnog het geval zal zijn, alsmede in gevallen als bedoeld in het derde
      lid, of

      c. een voorwaardelijke verklaring indien de exameninstelling en de examinering niet voldoen aan de bij en krachtens
      de [wet][ref4] gestelde eisen, waarbij het naar het oordeel van het Kwaliteitscentrum examinering inburgering
      aannemelijk is dat dit binnen een half jaar alsnog het geval zal zijn.

      2 Indien er naar het oordeel van het Kwaliteitscentrum examinering inburgering op enig moment tijdens het onderzoek
      sprake is van een zodanige afwijking van de bij en krachtens de [wet][ref5] gestelde eisen, dat vaststaat dat
      zonder verbeteringen aan het eind van het onderzoek een afkeurende verklaring zal worden afgegeven, meldt het
      Kwaliteitscentrum examinering inburgering dit onverwijld aan Onze Minister.

      3 Indien na het afgeven van een voorwaardelijke verklaring bij het eerstvolgende onderzoek blijkt dat opnieuw niet
      wordt voldaan aan de bij en krachtens de [wet][ref6] gestelde eisen, wordt een afkeurende verklaring afgegeven.

      4 Een verklaring wordt door het Kwaliteitscentrum examinering inburgering voorzien van een onderbouwing van het
      oordeel.

      5 Alvorens een verklaring vast te stellen, stelt het Kwaliteitscentrum examinering inburgering de exameninstelling
      in de gelegenheid van de ontwerpverklaring kennis te nemen en daarover overleg te voeren. Indien in het overleg
      geen overeenstemming is bereikt over door de exameninstelling gewenste wijzigingen in de ontwerpverklaring, wordt
      de door de exameninstelling aangegeven zienswijze in een bij de verklaring behorende bijlage opgenomen.

      6 Het Kwaliteitscentrum examinering inburgering zendt een verklaring onverwijld aan de exameninstelling. Indien
      het een goedkeurende verklaring betreft, meldt het Kwaliteitscentrum examinering inburgering dit aan Onze
      Minister. Indien het een afkeurende of voorwaardelijke verklaring betreft, zendt het Kwaliteitscentrum examinering
      inburgering een afschrift van die verklaring onverwijld aan Onze Minister.

      7 Bij regeling van Onze Minister kunnen regels worden gesteld omtrent de inrichting van de verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3.21
      [ref2]: https://wetten.overheid.nl/BWBR0020611
      [ref3]: https://wetten.overheid.nl/BWBR0020611
      [ref4]: https://wetten.overheid.nl/BWBR0020611
      [ref5]: https://wetten.overheid.nl/BWBR0020611
      [ref6]: https://wetten.overheid.nl/BWBR0020611
