  - number: '5.5'
    text: |-
      1 Een aanvraag tot verlening van ontheffing van de inburgeringsplicht als bedoeld in
      [artikel 31, tweede lid, onderdeel c, van de wet][ref1], kan niet eerder worden ingediend dan zes
      maanden voor het verstrijken van de voor de inburgeringsplichtige geldende termijn, bedoeld in
      [artikel 7, eerste lid, van de wet][ref2]. Het college geeft binnen acht weken na ontvangst van de aanvraag een
      beschikking.

      2 In bijzondere gevallen die de inburgeringsplichtige betreffen, kan het college ambtshalve besluiten tot het
      verlenen van ontheffing. De beschikking kan niet eerder worden gegeven dan zes maanden voor het verstrijken van de
      voor de inburgeringsplichtige geldende termijn, bedoeld in [artikel 7, eerste lid, van de wet][ref3].

      3 Het college kan op aanvraag de termijn, genoemd in het eerste lid, buiten toepassing laten, indien toepassing
      daarvan naar zijn oordeel, gelet op de door de inburgeringsplichtige aantoonbaar geleverde inspanningen om te
      voldoen aan de inburgeringsplicht, zou leiden tot een onbillijkheid van overwegende aard.

      4 Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent het verlenen van de ontheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel7
