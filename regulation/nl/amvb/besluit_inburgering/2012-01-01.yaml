      1 De overeenkomst, bedoeld in [artikel 24d, tweede lid, van de wet][ref1], bevat ten minste een omschrijving
      van de overeengekomen voorziening, alsmede een omschrijving van de rechten en verplichtingen van de vrijwillige
      inburgeraar ten aanzien van:

      a. de termijn waarbinnen de vrijwillige inburgeraar moet hebben deelgenomen aan het inburgeringsexamen dan wel het
      examen, bedoeld in [artikel 2.3, eerste lid, onderdeel c][ref2];

      b. de eventuele verschuldigdheid van de eigen bijdrage en de mogelijkheid van betaling in termijnen;

      c. de gevolgen van niet-nakoming van de overeenkomst.

      2 Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de overeenkomst, bedoeld in het eerste
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel24d
