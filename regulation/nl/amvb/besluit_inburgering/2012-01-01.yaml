  - number: '3.6'
    text: |-
      1 Indien een kandidaat zich ten aanzien van enig examen aan enige onregelmatigheid schuldig maakt of heeft gemaakt,
      kan de examencommissie op voorstel van de desbetreffende examinator het examen ongeldig verklaren en bepalen dat
      de kandidaat het examen of een onderdeel daarvan opnieuw moet afleggen. De examinator doet het voorstel zo spoedig
      mogelijk nadat de onregelmatigheid aan hem bekend is geworden.

      2 Indien de onregelmatigheid eerst na afloop van het examen wordt ontdekt, kan de exameninstelling Onze Minister
      voorstellen, het examenresultaat ongeldig te verklaren. De exameninstelling doet het voorstel zo spoedig mogelijk
      nadat de onregelmatigheid aan haar bekend is geworden.
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel3.6
  - number: '3.7'
    text: |-
      1 Het praktijkdeel van het inburgeringsexamen omvat een beoordeling van de taalvaardigheden, bedoeld in
      [artikel 2.9][ref1], in een aantal praktijksituaties ontleend aan de domeinen burgerschap, werk, ondernemerschap,
      maatschappelijke participatie alsmede onderwijs, gezondheid en opvoeding.

      2 Het praktijkdeel van het inburgeringsexamen bestaat uit een assessment, een portfolio dan wel een combinatie
      daarvan.

      3 Het assessment dan wel de combinatie van een assessment en een portfolio, wordt afgenomen door een
      exameninstelling die is aangewezen op grond van [artikel 3.14, eerste lid][ref2].

      4 Het portfolio wordt beoordeeld door een exameninstelling die is aangewezen op grond van
      [artikel 3.14, eerste lid][ref3], of Onze Minister.

      5 Het resultaat van het praktijkdeel wordt vastgesteld door de exameninstelling en uitgedrukt in «geslaagd» of
      «niet geslaagd».

      6 Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent het praktijkdeel van het
      inburgeringsexamen.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2.9
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel3.14
      [ref3]: https://wetten.overheid.nl/BWBR0020674#Artikel3.14
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel3.7
