  - number: '2.1'
    text: |-
      1 Het doel van het verblijf in Nederland van de houder van een verblijfsvergunning voor bepaalde
      tijd als bedoeld in [artikel 14 van de Vreemdelingenwet 2000][ref1] is tijdelijk in de zin van
      [artikel 3, eerste lid, onderdeel a, van de wet][ref2], indien die verblijfsvergunning is verleend onder een
      beperking verband houdend met:

      a. gezinsvorming of gezinshereniging met, dan wel verblijf als pleegkind bij, een persoon die voor een tijdelijk
      doel in Nederland verblijft;

      b. familiebezoek;

      c. het verrichten van arbeid;

      d. verblijf als kennismigrant;

      e. het zoeken en verrichten van arbeid;

      f. verblijf als stagiair of als practicant;

      g. de voorbereiding op of het volgen van een studie;

      h. verblijf als au pair;

      i. verblijf in het kader van uitwisseling;

      j. het ondergaan van medische behandeling of afwachten van herstel;

      k. de vervolging van mensenhandel;

      l. het afwachten van een verzoek op grond van [artikel 17 van de Rijkswet op het Nederlanderschap][ref3];

      m. verblijf als alleenstaande minderjarige vreemdeling;

      n. verblijf als vreemdeling die buiten zijn schuld niet uit Nederland kan vertrekken;

      o. verblijf als onderzoeker in de zin van richtlijn 2005/71/EG van de Raad van 12 oktober 2005 betreffende een
      specifieke procedure voor de toelating van onderdanen van derde landen met het oog op wetenschappelijk onderzoek
      (PbEU L 289);

      p. verblijf als houder van de Europese blauwe kaart.

      2 Het doel van het verblijf van een houder van een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 14 van de Vreemdelingenwet 2000][ref4], verleend onder een andere beperking dan bedoeld in het eerste lid,
      is tijdelijk in de zin van [artikel 3, eerste lid, onderdeel a, van de wet][ref5], indien zulks met toepassing van
      [artikel 3.5, vierde lid, van het Vreemdelingenbesluit 2000][ref6] is bepaald.

      3 Het doel van het verblijf van de houder van een verblijfsvergunning als bedoeld in de
      [artikelen 20][ref7], [28][ref8] en [33 van de Vreemdelingenwet 2000][ref9] is niet tijdelijk in de zin van
      [artikel 3, eerste lid, onderdeel a, van de wet][ref10].

      4 Bij regeling van Onze Minister kunnen de beperkingen, bedoeld in het eerste en tweede lid, nader worden
      uitgewerkt.


