  - number: '9.6'
    text: |-
      1 Onze Minister stelt ambtshalve een eenmalige rijksbijdrage vast, welke
      wordt verstrekt aan een gemeente, niet zijnde een gemeente, bedoeld in
      [artikel 1, onderdeel c, van het Besluit brede doeluitkering sociaal, integratie en veiligheid][ref1].

      2 De eenmalige rijksbijdrage wordt berekend met behulp van de formule: A = [B x C] + [D x E].

      3 In de formule, genoemd in het tweede lid, wordt voorgesteld:

        - met de letter A: de eenmalige rijksbijdrage;
        - met de letter B: het aantal door het college in 2006 op grond van de [Wet inburgering nieuwkomers][ref2] genomen
      beschikkingen omtrent een inburgeringsprogramma;
        - met de letter C: de door Onze Minister vast te stellen vergoeding met betrekking tot een inburgeringsprogramma
      als bedoeld in de letter B;
        - met de letter D: het aantal door het college in 2006, 2007 en 2008 ontvangen afschriften, welke
      betrekking hebben op in 2006 aangevangen inburgeringsprogramma’s, van door het bevoegd gezag van een
      instelling ingevolge de [Wet inburgering nieuwkomers][ref3] uitgereikte verklaringen als bedoeld in
      [artikel 7.4.15, eerste lid, van de Wet educatie en beroepsonderwijs][ref4], zoals dat artikel luidde op
      31 december 2006;
        - met de letter E: de door Onze Minister vast te stellen vergoeding met betrekking tot een verklaring als bedoeld
      in de letter D.

      4 Het college dient voor 1 april 2009 een schriftelijk verslag in over de activiteiten welke met betrekking tot de
      inburgering van nieuwkomers in 2007 en 2008 zijn verricht.

      5 Het college verstrekt de gegevens, bedoeld in het derde lid, letters B en D, tezamen met de jaarrekening, bedoeld
      in [artikel 186 van de Gemeentewet][ref5], welke betrekking heeft op het jaar 2008. De jaarrekening is voorzien van
      een accountantsverklaring, bedoeld in [artikel 213, derde lid, van de Gemeentewet][ref6].

      6 Indien Onze Minister de gegevens en de accountantsverklaring niet voor 1 september 2009 heeft ontvangen, stelt
      Onze Minister de hoogte van de letters B en D in de formule, genoemd in het derde lid, vast op nul.

      7 Onze Minister stelt de in het eerste lid bedoelde eenmalige rijksbijdrage vast voor 1 oktober 2009.

      8 De eenmalige rijksbijdrage wordt vastgesteld onder voorbehoud van goedkeuring van de beschikbare middelen door de
      begrotingswetgever en kan worden verlaagd in verband met wijzigingen van de rijksbegroting voor het jaar waarin de
      eenmalige rijksbijdrage wordt vastgesteld.

      9 Het bedrag van de vastgestelde eenmalige rijksbijdrage wordt binnen zes maanden na de vaststelling ervan aan
      een gemeente betaald onder verrekening met het voorschot dat ingevolge de [Wet inburgering nieuwkomers][ref7] is
      verleend ten behoeve van het jaar 2006. Indien de vaststelling van de eenmalige rijksbijdrage of de verrekening met
      het voorschot leidt tot een negatief bedrag, is Onze Minister bevoegd dat bedrag terug te vorderen.

      10 Bij regeling van Onze Minister kunnen regels worden gesteld omtrent de inrichting van het in het vierde lid
      bedoelde verslag.


