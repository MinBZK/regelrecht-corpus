  - number: '7.15'
    text: |-
      1 De rijksbijdrage voor een gemeente ten behoeve van de nieuwe inburgeringsplichtigen wordt berekend met de
      formule:

      A = [ B x C ] + [ D x E] + [F x G] + [H x I]

      waarin wordt voorgesteld:

        - met de letter A: de rijksbijdrage ten behoeve van nieuwe inburgeringsplichtigen;
        - met de letter B: het aantal nieuwe inburgeringsplichtigen ten behoeve van wie het college voor de eerste keer
      een inburgeringsvoorziening heeft vastgesteld en aan wie geen lening is verstrekt, hetzij ten behoeve van wie die
      lening in zijn geheel is terugbetaald;
        - met de letter C: de bijdragevergoeding ten aanzien van de vaststelling van de inburgeringsvoorziening ten behoeve
      van nieuwe inburgeringsplichtigen;
        - met de letter D: het aantal in de letter B bedoelde nieuwe inburgeringsplichtigen dat binnen drie kalenderjaren
      nadat voor hen de inburgeringsvoorziening is vastgesteld, heeft deelgenomen aan het inburgeringsexamen of het
      examen, bedoeld in [artikel 2.3, eerste lid, onderdeel c][ref1];
        - met de letter E: de bijdragevergoeding ten aanzien van de deelname aan een van de examens, bedoeld in letter D;
        - met de letter F: het aantal nieuwe inburgeringsplichtigen ten behoeve van wie het college voor de eerste keer een
      duale inburgeringsvoorziening heeft vastgesteld en aan wie geen lening is verstrekt, hetzij ten behoeve van wie die
      lening in zijn geheel is terugbetaald;
        - met de letter G: de bijdragevergoeding ten aanzien van de vaststelling van de duale inburgeringsvoorziening ten
      behoeve van nieuwe inburgeringsplichtigen;
        - met de letter H: het aantal nieuwe inburgeringsplichtigen ten behoeve van wie het college voor de eerste keer
      een taalkennisvoorziening als bedoeld in [artikel 19, derde lid, van de wet][ref2], zoals die luidde voor de
      inwerkingtreding van de [Wet participatiebudget][ref3] heeft vastgesteld en aan wie geen lening is verstrekt,
      hetzij ten behoeve van wie die lening in zijn geheel is terugbetaald;
        - met de letter I: de bijdragevergoeding ten aanzien van de vaststelling van de taalkennisvoorziening ten behoeve
      van nieuwe inburgeringsplichtigen.

      2 Het college verstrekt de gegevens, bedoeld in de letters B, D, F en H van het eerste lid,
      tezamen met de jaarrekening, bedoeld in [artikel 186 van de Gemeentewet][ref4], welke betrekking
      heeft op het jaar 2011. De jaarrekening is voorzien van de accountantsverklaring, bedoeld in
      [artikel 213, derde lid, van de Gemeentewet][ref5]. Het college vergewist zich ervan dat de gegevens zijn opgenomen
      in het Informatiesysteem Inburgering.

      3 Indien Onze Minister de gegevens en de accountantsverklaring niet binnen zesentwintig weken na het verstrijken
      van de termijn, bedoeld in [artikel 17b, derde lid, aanhef en onderdeel a, van de Financiële-verhoudingswet][ref6],
      heeft ontvangen, stelt Onze Minister de rijksbijdrage vast op nul.

      4 Onze Minister stelt de rijksbijdrage ten behoeve van nieuwe inburgeringsplichtigen
      uiterlijk dertig weken na het verstrijken van de termijn, bedoeld in
      [artikel 17b, derde lid, aanhef en onderdeel a, van de Financiële-verhoudingswet][ref7], vast.

      5 De rijksbijdrage wordt vastgesteld onder voorbehoud van goedkeuring van de beschikbare middelen door de
      begrotingswetgever en kan worden verlaagd in verband met wijzigingen van de rijksbegroting voor het jaar 2012 dan
      wel het jaar 2013.

      6 De rijksbijdrage wordt verrekend met het voorschot dat is verleend ten behoeve van de jaren 2007 en 2008. Het uit
      de verrekening resulterende positieve of negatieve saldo wordt uiterlijk zes maanden na de vaststelling ervan aan
      een gemeente betaald.


