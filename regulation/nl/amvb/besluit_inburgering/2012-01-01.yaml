  - number: '7.11'
    text: |-
      In deze afdeling wordt verstaan onder:

      nieuwe inburgeringsplichtigen: inburgeringsplichtigen als bedoeld in het besluit van de Staatssecretaris van
      Justitie van 12 juni 2007, nr. 2007/11, houdende wijziging van de Vreemdelingencirculaire 2000, aan wie geen
      persoonsvolgend budget is verstrekt.
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel7.11
  - number: '7.12'
    text: |-
      1 Op de vaststelling van de rijksbijdrage voor een gemeente ten behoeve van nieuwe inburgeringsplichtigen zijn de
      [artikelen 7.1 tot en met 7.7][ref1] niet van toepassing.

      2 Op de vaststelling van de rijksbijdrage voor een gemeente ten behoeve van nieuwe inburgeringsplichtigen zijn de
      [artikelen 7.8 tot en met 7.10][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel7.1
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel7.8
