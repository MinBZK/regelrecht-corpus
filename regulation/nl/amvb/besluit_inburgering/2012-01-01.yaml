      1 Het college roept de vreemdeling die inburgeringsplichtig of potentieel inburgeringsplichtig is, met uitzondering
      van de oudkomer en de potentieel inburgeringsplichtige oudkomer, op voor het onderzoek:

      a. indien hij in een opvangcentrum als bedoeld in
      [artikel 1, onderdeel d, van de Wet Centraal Orgaan opvang asielzoekers][ref1] verblijft, binnen zes weken
      nadat hij na vertrek uit het centrum voor de eerste keer aangifte van verblijf en adres als bedoeld in
      [artikel 65 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref2] heeft gedaan;

      b. in de overige gevallen, binnen zes weken na het ontstaan van de grond waarop de vreemdeling inburgeringsplichtig
      is geworden of waarop het college kan vermoeden dat de vreemdeling inburgeringsplichtig is geworden.

      2 Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent het eerste lid, onderdeel b.


