  - number: '4.8'
    text: |-
      1 Binnen acht weken na de aanvang van de aanloopfase, bedoeld in [artikel 4.6, vierde lid][ref1], dan wel de
      ontvangst van een verzoek als bedoeld in [artikel 4.6, derde lid, tweede volzin][ref2], stelt Onze Minister het
      bedrag vast dat de debiteur overeenkomstig de [artikelen 4.5 tot en met 4.7][ref3] maandelijks moet terugbetalen
      alsmede de periode waarbinnen dit moet gebeuren.

      2 Bij regeling van Onze Minister kunnen regels worden gesteld voor het geval de debiteur meer betaalt dan het
      bedrag van de in het eerste lid bedoelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4.6
