  - number: '4.23'
    text: |-
      De socialezekerheidswetten en socialezekerheidsregelingen, bedoeld in de [artikelen 19, vierde lid][ref1],
      [24a, vierde lid][ref2], en [24b, eerste lid, van de wet][ref3], zijn:

      a. de [Werkloosheidswet][ref4];

      b. de [Wet op de arbeidsongeschiktheidsverzekering][ref5];

      c. de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref6];

      d. de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref7];

      e. de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref8];

      f. de [Wet werk en arbeidsondersteuning jonggehandicapten][ref9];

      g. de [Wet werk en inkomen naar arbeidsvermogen][ref10];

      h. de [Tijdelijke wet beperking inkomensgevolgen arbeidsongeschiktheidscriteria][ref11];

      i. de [Tijdelijke regeling inkomensgevolgen herbeoordeelde arbeidsongeschikten][ref12];

      j. de [Wet inkomensvoorziening oudere werklozen][ref13].


