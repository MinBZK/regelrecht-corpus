  - number: '4.3'
    text: |-
      1 In de aanvraag vermeldt de aanvrager zijn burgerservicenummer.

      2 Bij de aanvraag overlegt de aanvrager een door hem ondertekende verklaring waarin hij Onze Minister machtigt het
      bedrag van de maandelijkse termijnen die hij op grond van [artikel 4.8][ref1] of [4.11][ref2] moet terugbetalen,
      automatisch van zijn bankrekening af te schrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4.8
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel4.11
