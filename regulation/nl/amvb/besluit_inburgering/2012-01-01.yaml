        afdeling: '3'
  - number: '3.15'
    text: |-
      1 Bij regeling van Onze Minister worden regels gesteld omtrent de gegevens en bescheiden die de instelling bij zijn
      verzoek om een onderzoek als bedoeld in [artikel 3.17, tweede lid, onderdeel a][ref1], verschaft.

      2 Het Kwaliteitscentrum examinering inburgering bevestigt de ontvangst van het verzoek om een onderzoek
      schriftelijk.

      3 Het Kwaliteitscentrum examinering inburgering stelt het rapport vast binnen zes weken na ontvangst van het
      verzoek om een onderzoek. Deze termijn wordt opgeschort met ingang van de dag waarop het Kwaliteitscentrum
      examinering inburgering de instelling uitnodigt het verzoek aan te vullen, tot de dag waarop het verzoek is
      aangevuld of de daarvoor door het Kwaliteitscentrum examinering inburgering gestelde termijn van ten hoogste vier
      weken ongebruikt is verstreken.

      4 Bij regeling van Onze Minister kunnen regels worden gesteld omtrent het in rekening brengen van een vergoeding
      ter zake van het onderzoek, bedoeld in het eerste lid, door het Kwaliteitscentrum examinering inburgering aan de
      instelling.

      5 Bij regeling van Onze Minister kunnen regels worden gesteld omtrent de inrichting van het onderzoek en het
      rapport.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3.17
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3.17'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: '3.16'
    text: |-
      1 De aanwijzing kan worden geschorst of ingetrokken, indien zij is verleend op grond van onjuiste of onvolledige
      gegevens of indien de exameninstelling niet voldoet aan de bij of krachtens de [wet][ref1] gestelde eisen.

      2 Een besluit als bedoeld in het eerste lid wordt niet genomen dan nadat de exameninstelling op grond van de
      bevindingen over de examinering een waarschuwing is gegeven, onder bepaling van de termijn waarbinnen aan die
      waarschuwing gevolg moet zijn gegeven.

      3 De instelling kan niet eerder dan na verloop van een jaar na de in het eerste lid bedoelde intrekking opnieuw
      overeenkomstig [artikel 3.14][ref2] worden aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0020611
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel3.14
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0020611
      - id: ref2
        bwb_id: BWBR0020674
        artikel: '3.14'
        hoofdstuk: '3'
        afdeling: '2'
  - number: '3.17'
    text: |-
      1 Het toezicht op de exameninstellingen wordt uitgeoefend door een door Onze Minister aangewezen rechtspersoon
      (Kwaliteitscentrum examinering inburgering).

      2 Het Kwaliteitscentrum examinering inburgering heeft tot taak het verrichten van onderzoek naar de mate waarin:

      a. een instelling die voornemens is een aanvraag tot aanwijzing als bedoeld in [artikel 3.14][ref1] in te dienen,
      voldoet aan de bij en krachtens de [wet][ref2] aan een exameninstelling gestelde eisen;

      b. de exameninstellingen en de examinering voldoen aan de bij en krachtens de [wet][ref3] gestelde eisen.

      3 Het Kwaliteitscentrum examinering inburgering verricht het onderzoek op zodanige wijze dat instellingen niet meer
      worden belast dan voor een zorgvuldig onderzoek noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3.14
      [ref2]: https://wetten.overheid.nl/BWBR0020611
      [ref3]: https://wetten.overheid.nl/BWBR0020611
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3.14'
        hoofdstuk: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0020611
      - id: ref3
        bwb_id: BWBR0020611
  - number: '3.18'
    text: |-
      1 Het bestuur van het Kwaliteitscentrum examinering inburgering richt een stelsel van kwaliteitszorg in en draagt
      er zorg voor dat wordt voorzien in een regelmatige beoordeling van de kwaliteit van de taakuitoefening, met
      betrokkenheid van onafhankelijke deskundigen.

      2 Het Kwaliteitscentrum examinering inburgering zendt jaarlijks voor 1 juli een jaarverslag aan Onze Minister. Het
      Kwaliteitscentrum examinering inburgering maakt in het jaarverslag de uitkomsten van de beoordeling, bedoeld in het
      eerste lid, en het voorgenomen beleid in het licht van die uitkomsten bekend.

      3 Het Kwaliteitscentrum examinering inburgering zendt jaarlijks voor 1 oktober een jaarwerkplan voor het
      daaropvolgende kalenderjaar aan Onze Minister.

      4 Bij regeling van Onze Minister kunnen regels worden gesteld over de inrichting van het jaarverslag en het
      jaarwerkplan.

      5 Het Kwaliteitscentrum examinering inburgering stelt jaarlijks voor 1 november een verslag op over zijn
      bevindingen over de exameninstellingen en de examinering in het voorafgaande studiejaar.
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel3.18
  - number: '3.19'
    text: |-
      1 Het Kwaliteitscentrum examinering inburgering zendt jaarlijks voor 1 oktober aan Onze Minister de begroting voor
      het daaropvolgende jaar.

      2 Het Kwaliteitscentrum examinering inburgering brengt jaarlijks voor 1 juli een jaarrekening over het voorafgaande
      kalenderjaar uit, die vergezeld gaat van een verklaring omtrent de getrouwheid en de rechtmatigheid, afgegeven
      door een accountant als bedoeld in [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1]. Het Kwaliteitscentrum
      examinering inburgering stelt de stukken, bedoeld in de eerste volzin, algemeen verkrijgbaar.

      3 Bij regeling van Onze Minister kunnen regels worden gesteld omtrent de verstrekking door Onze Minister aan het
      Kwaliteitscentrum examinering inburgering van een subsidie voor de op grond van [artikel 3.17][ref2] uit te voeren
      taken, en omtrent de inrichting van de begroting, de jaarrekening en aandachtspunten voor de accountantscontrole.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel3.17
    url: https://wetten.overheid.nl/BWBR0020674/2012-01-01#Artikel3.19
    references:
