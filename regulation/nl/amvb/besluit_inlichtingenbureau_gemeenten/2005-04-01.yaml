  - number: '4'
    text: |-
      1 De gegevensuitwisseling, bedoeld in [artikel 2, eerste lid, onderdelen b tot en met d][ref1], gebeurt
      elektronisch.

      2 Bij ministeriële regeling worden regels gesteld omtrent:

      a. de wijze en het tijdstip waarop de elektronische gegevensuitwisseling tussen burgemeester en wethouders en het
      Inlichtingenbureau plaatsvindt;

      b. het ontwerp van de elektronische voorzieningen, bedoeld in [artikel 2, eerste lid, onderdeel f][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013180#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013180#Artikel2
    url: https://wetten.overheid.nl/BWBR0013180/2005-04-01#Artikel4
