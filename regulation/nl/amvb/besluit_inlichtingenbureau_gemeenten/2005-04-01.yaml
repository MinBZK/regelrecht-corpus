  - number: '7'
    text: |-
      1 Het Inlichtingenbureau draagt zorg voor de zorgvuldige verwerking van:

      a. de gegevens bedoeld in [artikel 64, eerste lid, van de Wet SUWI][ref1];

      b. naam, adres, woonplaats en sociaal-fiscaalnummer van de personen over wie burgemeester en wethouders de opgaven
      en inlichtingen, bedoeld in [artikel 3][ref2], vragen, alsmede een vermelding van de gemeente die eerstgenoemde
      gegevens verstrekt;

      c. de gegevens over de wettelijke grondslag van de door burgemeester en wethouders aan de betreffende persoon
      verleende bijstand of uitkering op grond van de [WWB][ref3], de [IOAW][ref4], de [IOAZ][ref5]of de [WWIK][ref6], en
      de periode gedurende welke de bijstand of de uitkering is ontvangen;

      d. de door de instanties, bedoeld in [artikel 3][ref7], verstrekte opgaven en inlichtingen;

      e. de opgaven en inlichtingen, bedoeld in onderdeel d, die betrekking hebben op dezelfde periode, of een deel
      daarvan, als de gegevens, bedoeld in onderdeel c;

      f. de tijdstippen waarop de gevraagde en verstrekte opgaven en inlichtingen ontvangen zijn van en ter beschikking
      gesteld zijn aan een instantie als bedoeld in [artikel 3][ref8] onderscheidenlijk burgemeester en wethouders;

      g. het tijdstip waarop gegevens als bedoeld in [artikel 6, eerste lid][ref9], zijn verstrekt;

      h. de meldingen van burgemeester en wethouders, bedoeld in het tweede lid, eerste volzin, alsmede de tijdstippen
      waarop deze meldingen ontvangen onderscheidenlijk, op grond van [artikel 2, eerste lid, onderdeel d][ref10],
      doorgestuurd zijn.

      2 Indien aan burgemeester en wethouders blijkt dat de door het Inlichtingenbureau, op grond van
      [artikel 2, eerste lid, onderdeel c][ref11], aan hen ter beschikking gestelde opgaven en inlichtingen onjuist
      zijn, melden zij dit zo spoedig mogelijk aan het Inlichtingenbureau. Het Inlichtingenbureau maakt afspraken met
      de instanties, bedoeld in [artikel 4][ref12], over de wijze en het tijdstip waarop door burgemeester en wethouders
      gemelde onjuistheden worden doorgestuurd aan de instantie die de betreffende opgaven en inlichtingen heeft
      verstrekt.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent dit artikel.


