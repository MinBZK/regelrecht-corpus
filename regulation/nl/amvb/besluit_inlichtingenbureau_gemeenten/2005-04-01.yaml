  - number: '8'
    text: |-
      Het Inlichtingenbureau draagt zorg voor een doeltreffende voorlichting over zijn taken en werkwijze door ten minste
      het ter beschikking stellen van informatiemateriaal aan burgemeester en wethouders ten behoeve van personen over
      wie, op grond van [artikel 3][ref1], door hen opgaven en inlichtingen worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013180#Artikel3
    url: https://wetten.overheid.nl/BWBR0013180/2005-04-01#Artikel8
