        artikel: '2'
      - id: ref2
        bwb_id: BWBR0013180
        artikel: '2'
  - number: '5'
    text: |-
      1 Bij ministeriële regeling kunnen, na een daartoe door het Inlichtingenbureau gedaan voorstel, regels worden
      gesteld omtrent de mededeling door het UWV of de CWI aan het Inlichtingenbureau van wijzigingen in de eerder aan de
      desbetreffende instantie op grond van [artikel 3][ref1] gevraagde opgaven en inlichtingen.

      2 Tussen het Inlichtingenbureau en een instantie als bedoeld in [artikel 3][ref2], niet zijnde het UWV of de CWI,
      kan een regeling worden getroffen met betrekking tot de mededeling van wijzigingen in de eerder aan deze instantie
      op grond van voornoemde bepaling gevraagde opgaven en inlichtingen.

      3 Een regeling als bedoeld in het tweede lid regelt in elk geval:

      a. op welke gegevens de regeling betrekking heeft;

      b. op welk moment en op welke wijze de mededeling van wijzigingen wordt beëindigd.

      4 Een regeling als bedoeld in het tweede lid wordt, na goedkeuring door Onze Minister, door het Inlichtingenbureau
      gepubliceerd in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0013180#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013180#Artikel3
    url: https://wetten.overheid.nl/BWBR0013180/2005-04-01#Artikel5
