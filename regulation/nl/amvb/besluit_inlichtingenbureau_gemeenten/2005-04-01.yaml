      - id: ref1
        bwb_id: BWBR0013180
        artikel: '3'
  - number: '9'
    text: |-
      1 De kosten van het Inlichtingenbureau voor de uitvoering van de taken, bedoeld in [artikel 2, eerste lid][ref1],
      komen ten laste van de daartoe door Onze Minister toegekende rijksbijdrage.

      2 Het Inlichtingenbureau stelt hiertoe elk jaar een begroting en een jaarplan voor het komende kalenderjaar vast en
      biedt deze vóór een door Onze Minister vast te stellen datum aan hem aan.

      3 Onze Minister stelt jaarlijks vóór 1 december het budget voor de uitvoeringskosten van de het Inlichtingenbureau
      voor het eerstvolgende kalenderjaar vast. Hij kan besluiten dit budget te wijzigen. Het Inlichtingenbureau gaat
      met betrekking tot de uitvoering van zijn wettelijke taken geen verplichtingen aan en doet geen uitgaven die
      leiden tot overschrijden van het vastgestelde budget. Wanneer het budget niet is vastgesteld vóór 1 januari van het
      kalenderjaar waarop de begroting betrekking heeft, is het Inlichtingenbureau bevoegd, teneinde zijn activiteiten
      gaande te houden, te beschikken over ten hoogste een derde gedeelte van het budget dat laatstelijk voor een
      geheel jaar is vastgesteld. Onze Minister kan besluiten dat het Inlichtingenbureau in een geval als bedoeld in de
      vorige zin, kan beschikken over meer dan een derde gedeelte van het budget dat laatstelijk voor een geheel jaar
      is vastgesteld.

      4 Het Inlichtingenbureau stelt jaarlijks een jaarverslag en een jaarrekening op en biedt deze vóór
      15 maart van het kalenderjaar volgend op het jaar waarop deze betrekking hebben aan Onze Minister aan.
      Het Inlichtingenbureau beschrijft in zijn jaarverslag de taakuitoefening en het gevoerde beleid in het
      afgelopen jaar en legt in zijn jaarrekening rekening en verantwoording af over het financieel beheer,
      alsmede over de rechtmatigheid en doelmatigheid van de uitvoering van de taken, bedoeld in artikel
      2, eerste lid, in het verstreken boekjaar. De jaarrekening gaat vergezeld van een verklaring omtrent
      de getrouwheid, afgegeven door een door het Inlichtingenbureau aangewezen accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2]. Deze verklaring heeft mede betrekking op de
      rechtmatige besteding van de middelen door het Inlichtingenbureau. De accountant voegt bij de verklaring tevens een
      verslag van zijn bevindingen over de vraag of het beheer en de organisatie van het Inlichtingenbureau voldoen aan
      eisen van doelmatigheid.

      5 Bij ministeriële regeling kunnen regels worden gesteld omtrent de inhoud en de indiening van de begroting en
      ontwerpen daarvan, het jaarplan, het jaarverslag, de jaarrekening, de verklaring, bedoeld in het vierde lid, en het
      aan die verklaring ten grondslag liggende onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0013180#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0013180/2005-04-01#Artikel9
