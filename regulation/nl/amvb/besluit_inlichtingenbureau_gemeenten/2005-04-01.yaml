    text: |-
      Dit besluit berust mede op [artikel 64, tweede, zevende en achtste lid, van de Wet werk en bijstand][ref1] en
      [artikel 40, tweede, zevende en achtste lid, van de Wet werk en inkomen kunstenaars][ref2].


