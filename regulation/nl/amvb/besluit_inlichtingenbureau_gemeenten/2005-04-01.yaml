  - number: '10'
    text: |-
      Bij ministeriële regeling wordt bepaald vanaf welk tijdstip de gegevensverstrekking, bedoeld in
      [artikel 3, eerste lid][ref1], in elk geval door tussenkomst van het Inlichtingenbureau geschiedt. Dit tijdstip
      kan voor iedere gemeente, per instantie, bedoeld in [artikel 3, eerste lid][ref2], en voor per instantie te
      onderscheiden gegevens verschillend worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0013180#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013180#Artikel3
