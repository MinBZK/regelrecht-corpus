preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 19 oktober 2001, Directie
    Bijstandszaken, nr. BZ/BU/2001/62005;

    Gelet op artikel 63, tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen, artikel 122, tweede,
    zevende en achtste lid, van de Algemene bijstandswet, artikel 45, tweede, zevende en achtste lid, van de Wet
    inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers, en artikel 45, tweede, zevende
    en achtste lid, van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen;

    De Raad van State gehoord (advies van 28 november 2001, nr. W12.01.0542/IV);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid van 11 december 2001, Directie
    Bijstandszaken, nr. BZ/BU/2001/85149;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0013180/2005-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. Wet SUWI: [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];

      b. de CWI: de Centrale organisatie werk en inkomen;

      c. het UWV: het Uitvoeringsinstituut werknemersverzekeringen;

      d. WWB: [Wet werk en bijstand][ref2];

      e. IOAW:[ Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref3];

      f. IOAZ: [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref4];

      g. WWIK: [Wet werk en inkomen kunstenaars][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0013060
      [ref2]: https://wetten.overheid.nl/BWBR0015703
