  - number: '3'
    text: |-
      1 De opgaven en inlichtingen, bedoeld in [artikel 64, eerste lid, van de WWB][ref1],
      [artikel 45, eerste lid, van de IOAW][ref2], [artikel 45, eerste lid, van de IOAZ][ref3] en
      [artikel 40, eerste lid, van de WWIK][ref4], die door burgemeester en wethouders en door de in voornoemde
      bepalingen genoemde instanties door tussenkomst van het Inlichtingenbureau gevraagd onderscheidenlijk verstrekt
      worden, betreffen in het geval van:

      a. burgemeester en wethouders van andere gemeenten: gegevens betreffende de verstrekte bijstand of uitkering op
      grond van de [WWB][ref5], de [IOAW][ref6], de [IOAZ][ref7] of de [WWIK][ref8];

      b. het UWV: gegevens betreffende de inkomsten uit arbeid of uitkering op grond van verzekeringen en wetten die door
      het UWV worden uitgevoerd;

      c. de belastingdienst: gegevens betreffende vermogen als bedoeld in [artikel 34 van de WWB][ref9],
      [artikel 8 van de IOAZ][ref10] en [artikel 7 van de WWIK][ref11], en de voorlopige teruggaaf, bedoeld in de
      [Wet inkomstenbelasting 2001][ref12];

      d. de Informatie Beheer Groep: gegevens betreffende de verstrekte studiefinanciering en tegemoetkoming op grond
      van de [Wet studiefinanciering 2000][ref13] en de [Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref14], en
      inschrijvingen bij instellingen voor onderwijs als bedoelde in voornoemde wetten.

      2 Bij ministeriële regeling kan worden bepaald in welke gevallen tijdelijk, gedurende een periode van
      maximaal twee jaar, ook aan en door andere instanties, genoemd in [artikel 64, eerste lid, van de WWB][ref15],
      [artikel 45, eerste lid, van de IOAW][ref16], [artikel 45, eerste lid, van de IOAZ][ref17] of
      [artikel 40, eerste lid, van de WWIK][ref18], dan de in het eerste lid genoemde, opgaven en inlichtingen door
      tussenkomst van het Inlichtingenbureau worden gevraagd onderscheidenlijk verstrekt.


