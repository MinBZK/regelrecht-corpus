        artikel: '3'
  - number: '6'
    text: |-
      1 Het UWV slaat, ten behoeve van aan burgemeester en wethouders te verstrekken opgaven en inlichtingen, de door het
      Inlichtingenbureau aan hem verstrekte gegevens van bij hem op dat moment nog onbekende personen op.

      2 De gegevens, bedoeld in het eerste lid, worden door het UWV zodanig opgeslagen dat deze niet toegankelijk zijn
      tot het moment waarop er bij hem gegevens als bedoeld in [artikel 3, eerste lid, onderdeel b][ref1], over de
      betreffende persoon bekend zijn.

      3 De in het eerste lid bedoelde gegevens worden niet langer opgeslagen dan tot drie maanden nadat burgemeester en
      wethouders aan het Inlichtingenbureau hebben gemeld dat de betreffende persoon geen bijstand of uitkering op grond
      van de [WWB][ref2], de [IOAW][ref3], de [IOAZ][ref4] of de [WWIK][ref5] meer ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0013180#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0015703
      [ref3]: https://wetten.overheid.nl/BWBR0004044
