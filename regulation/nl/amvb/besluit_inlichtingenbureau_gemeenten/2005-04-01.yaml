        artikel: '3'
  - number: '11'
    text: |-
      Bij ministeriële regeling worden regels gesteld over de toepassing van [artikel 9, tweede en derde lid][ref1], met
      betrekking tot de vaststelling en indiening van de begroting en het jaarplan alsmede de vaststelling van het budget
      voor het kalenderjaar 2002.


