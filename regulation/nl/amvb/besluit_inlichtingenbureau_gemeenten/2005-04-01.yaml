  - number: '2'
    text: |-
      1 Het Inlichtingenbureau heeft tot taak:

      a. het ten behoeve van de gemeenten verrichten van de bij of krachtens de [artikelen 64][ref1], [66][ref2],
      [67][ref3] en [68 van de Wet SUWI][ref4] aan hem opgedragen werkzaamheden met betrekking tot het Gegevensregister
      Suwi, het Stelselontwerp Suwinet, de beheertaken ten behoeve van Suwinet en het jaarlijks verslag over het gebruik
      van Suwinet;

      b. het namens burgemeester en wethouders vragen van opgaven en inlichtingen aan instanties, en het ontvangen van
      door deze instanties verstrekte opgaven en inlichtingen, bedoeld in [artikel 3][ref5];

      c. het ter beschikking stellen aan burgemeester en wethouders van de opgaven en inlichtingen, bedoeld in
      [artikel 7, eerste lid, onderdeel e][ref6];

      d. het doorsturen van onjuistheden als bedoeld in [artikel 7, tweede lid][ref7], aan de instantie die de
      betreffende opgaven en inlichtingen heeft verstrekt;

      e. het ondersteunen van burgemeester en wethouders, bij de elektronische gegevensuitwisseling, bedoeld in
      [artikel 4, eerste lid][ref8];

      f. het beheren van de elektronische voorzieningen die benodigd zijn voor het uitvoeren van de taken, bedoeld in de
      onderdelen a tot en met d;

      g. het verwerken van de gegevens, bedoeld in [artikel 7, eerste lid][ref9];

      h. het geven van voorlichting over zijn taken en werkwijze, bedoeld in [artikel 8, eerste lid][ref10];

      i. het toetsen van plannen van Onze Minister met betrekking tot gegevensuitwisseling tussen gemeenten en derden op
      grond van de [WWB][ref11], de [IOAW][ref12], de [IOAZ][ref13], de [WWIK][ref14] en de [Wet SUWI][ref15].

      2 Het Inlichtingenbureau kan andere dan in het eerste lid genoemde taken vervullen indien Onze Minister daarvoor
      schriftelijke toestemming geeft. [Artikel 3.1, eerste lid, van het Besluit SUWI][ref16] is van overeenkomstige
      toepassing.


