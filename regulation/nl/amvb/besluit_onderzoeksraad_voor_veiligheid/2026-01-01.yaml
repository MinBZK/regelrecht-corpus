---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_onderzoeksraad_voor_veiligheid
regulatory_layer: AMVB
publication_date: '2025-11-14'
valid_from: '2026-01-01'
bwb_id: BWBR0017681
url: https://wetten.overheid.nl/BWBR0017681/2026-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 14 juni 2004, nr. PRO
    2004/67265, Directoraat-generaal Veiligheid, project PRO;

    Gelet op richtlijn nr. 94/56/EG van de Raad van de Europese Unie van 23 november 1994 houdende vaststelling van de
    grondbeginselen voor het onderzoek van ongevallen en incidenten in de burgerluchtvaart (PbEG L 319), richtlijn nr.
    96/82/EG van de Raad van de Europese Unie van 9 december 1996 betreffende de beheersing van de gevaren van zware
    ongevallen waarbij gevaarlijke stoffen zijn betrokken (PbEG L 010), richtlijn nr. 2002/59/EG inzake de invoering
    van een communautair monitorings- en informatiesysteem voor de zeescheepvaart (PbEG L 208) en richtlijn nr.
    1999/35/EG van de Raad van de Europese Unie van 29 april 1999 betreffende een stelsel van verplichte onderzoeken
    voor de veilige exploitatie van geregelde diensten met ro-ro-veerboten en hogesnelheidspassagiersvaartuigen (PbEG
    L 138) alsmede de artikelen 5, 28, 54, 56, tweede lid, 59, derde lid, 67, 68, 77, 78 en 96, eerste lid, van de
    Rijkswet Onderzoeksraad voor veiligheid;

    De Raad van State gehoord (advies van 2 september 2004, nr. W04.04.0254/I);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 6 december 2004, nr.
    PRO 2004/78765;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.a
    text: |-
      rijkswet: [Rijkswet Onderzoeksraad voor veiligheid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017613
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0017613
  - number: 1.1.b
    text: 'scheepvaartongeval: een gebeurtenis die heeft geresulteerd in het volgende:'
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.b.1°
    text: |-
      dodelijk of ernstig letsel aan een persoon overkomen, dat is veroorzaakt door of samenhangt met het functioneren
      van een schip;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.b.2°
    text: |-
      de vermissing van een persoon vanaf een schip, die is veroorzaakt door of samenhangt met het functioneren van het
      schip;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.b.3°
    text: de vermissing, vermoedelijke vermissing of het verlaten van een schip;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.b.4°
    text: schade aan een schip;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.b.5°
    text: het stranden of onbruikbaar worden van een schip;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.b.6°
    text: de betrokkenheid van een schip bij een aanvaring;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.b.7°
    text: schade die is veroorzaakt door of samenhangt met het functioneren van een schip;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.b.8°
    text: |-
      schade aan het milieu die is veroorzaakt door schade aan een of meerdere schepen, welke het gevolg is van of
      samenhangt met het functioneren van een schip;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.c
    text: 'zeer ernstig scheepvaartongeval: een gebeurtenis die heeft geresulteerd in:'
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.c.1°
    text: het overlijden van een persoon, dat het gevolg is van of samenhangt met het functioneren van een schip;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.c.2°
    text: |-
      zeer ernstige schade aan het milieu, die is veroorzaakt door schade aan een of meerdere schepen, welke het gevolg
      is van of samenhangt met het functioneren van een schip; of
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.c.3°
    text: een schip dat total loss is;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.d
    text: |-
      ernstig scheepvaartongeval: een gebeurtenis, zijnde een brand, een ontploffing, een stranding, een aanvaring, zwaar
      weer, ijsgang, het falen van de constructie, of een andere oorzaak, die heeft geresulteerd in:
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.d.1°
    text: |-
      schade aan de voortstuwing, of ernstige schade aan accommodatie of de constructie van een schip, die de
      zeewaardigheid daarvan aantast;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.d.2°
    text: het onmanoeuvreerbaar worden van een schip waardoor hulp van buiten noodzakelijk is, of
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.d.3°
    text: verontreiniging van het mariene milieu;.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.e
    text: |-
      scheepvaartincident: een gebeurtenis, geen scheepvaartongeval zijnde, veroorzaakt door of samenhangend met het
      functioneren van een schip en waarbij de veiligheid van het schip of van personen in gevaar is gebracht of waardoor
      ernstige schade aan het schip, aan mijnbouwinstallaties of aan het mariene milieu zou kunnen ontstaan;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.f
    text: |-
      luchtvaartongeval: een gebeurtenis die samenhangt met het gebruik van een luchtvaartuig en plaatsvindt tussen
      het tijdstip waarop een persoon zich aan boord begeeft met het voornemen een vlucht uit te voeren en het tijdstip
      waarop alle personen die zich met dit voornemen aan boord hebben begeven, zijn uitgestapt, en waarbij:
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.f.1°
    text: |-
      een persoon dodelijk of ernstig letsel heeft opgelopen als gevolg van het zich in het luchtvaartuig bevinden,
      direct contact met een onderdeel van het luchtvaartuig, inclusief de onderdelen die van het luchtvaartuig
      zijn losgeraakt of directe blootstelling aan de uitlaatstroom van de reactoren, behalve wanneer de letsels
      een natuurlijke oorzaak hebben, door de persoon zelf of door anderen zijn toegebracht, of wanneer de letsels
      verstekelingen treffen die zich buiten de normale voor passagiers en het personeel bedoelde ruimten ophouden, of
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.f.2°
    text: |-
      het luchtvaartuig schade of een structureel defect oploopt, waardoor afbreuk wordt gedaan aan zijn soliditeit,
      prestaties of vluchtkenmerken en die normaliter ingrijpende herstelwerkzaamheden of vervanging van het getroffen
      onderdeel noodzakelijk zouden maken, behalve wanneer het gaat om motorstoring of motorschade en de schade
      beperkt is tot de motor, de motorkap of motoronderdelen, dan wel om schade die beperkt is tot de propellers,
      de vleugelpunten, de antennes, de banden, de remmen, de stroomlijnkappen of tot deukjes of gaatjes in de
      vliegtuighuid, of
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.f.3°
    text: het luchtvaartuig vermist wordt of volledig onbereikbaar is;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.g
    text: |-
      luchtvaartincident: een gebeurtenis, geen luchtvaartongeval zijnde, die samenhangt met het functioneren van een
      luchtvaartuig en afbreuk doet of zou kunnen doen aan een veilige vluchtuitvoering;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.h
    text: |-
      ernstig luchtvaartincident: luchtvaartincident dat zich voordoet onder omstandigheden die erop wijzen dat bijna een
      luchtvaartongeval heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.i
    text: |-
      dodelijk letsel: letsel door een persoon bij een ongeval opgelopen, dat binnen dertig dagen na het tijdstip van het
      ongeval de dood tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.j
    text: 'ernstig letsel:'
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.j.1°
    text: |-
      met betrekking tot een scheepvaartongeval: letsel door een persoon bij een ongeval opgelopen, dat resulteert in een
      uitschakeling voor meer dan 72 uur, beginnend binnen zeven dagen na de datum waarop het letsel werd opgelopen;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.j.2°
    text: 'met betrekking tot een luchtvaartongeval: letsel door een persoon bij een ongeval opgelopen, dat:'
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.j.2°.A
    text: |-
      opneming in een ziekenhuis gedurende meer dan 48 uur vereist, welke aanvangt binnen zeven dagen na het oplopen van
      het letsel, of
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.j.2°.B
    text: de breuk van een bot tot gevolg heeft, uitgezonderd enkelvoudige breuken van vingers, tenen of de neus, of
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.j.2°.C
    text: |-
      gepaard gaat met scheurwonden die ernstige bloedingen of beschadigingen van zenuwen, spieren of pezen veroorzaken,
      of
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.j.2°.D
    text: gepaard gaat met letsel aan een inwendig orgaan, of
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.j.2°.E
    text: |-
      gepaard gaat met tweedegraads of derdegraads brandwonden of brandwonden over meer dan 5% van het lichaamsoppervlak,
      of
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.j.2°.F
    text: gepaard gaat met geconstateerde blootstelling aan besmettelijke stoffen of schadelijke straling;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.k
    text: |-
      staat van ontwerp: staat die rechtsmacht heeft over de organisatie die verantwoordelijk is voor het ontwerp van
      een luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.l
    text: |-
      staat van vervaardiging: staat die rechtsmacht heeft over de organisatie, die verantwoordelijk is voor de
      vervaardiging van een luchtvaartuig als zodanig;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.m
    text: |-
      staat van het voorval: staat op of boven het grondgebied waarvan, de territoriale wateren daaronder begrepen, een
      luchtvaartongeval of luchtvaartincident plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.n
    text: |-
      staat van de exploitant: staat waarin de exploitant van een luchtvaartuig zijn voornaamste plaats van bedrijvigheid
      heeft of, bij gebreke daarvan, de exploitant is gevestigd;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.o
    text: 'staat van registratie: staat waar een luchtvaartuig is geregistreerd;'
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.p
    text: |-
      exploitant van een luchtvaartuig: iedere natuurlijk persoon, iedere rechtspersoon met of zonder winstoogmerk
      of ieder overheidslichaam met of zonder rechtspersoonlijkheid dat een of meer luchtvaartuigen exploiteert of
      voornemens is te exploiteren;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.q
    text: |-
      staat met aanmerkelijk belang: in geval van een voorval met een zeeschip, staat die tot een van de bij ministeriële
      regeling aangewezen categorieën behoort;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.r
    text: |-
      spoorweg: een spoorwegsysteem van de Europese Unie als bedoeld in artikel 3, aanhef en
      onder 1, van de spoorwegveiligheidsrichtlijn, voor zover dat systeem is aangewezen in het
      [Besluit aanwijzing hoofdspoorwegen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017794
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0017794
  - number: 1.1.s
    text: |-
      ernstig ongeval in verband met een spoorweg: een botsing of ontsporing van treinen, waarbij ten minste één persoon
      omkomt of vijf of meer personen ernstig gewond raken of grote schade aan het rollend materieel, de infrastructuur
      of het milieu wordt veroorzaakt, dan wel een soortgelijk ongeval dat duidelijk consequenties heeft voor de
      regelgeving op het gebied van de veiligheid op het spoor of het veiligheidsbeheer, waarbij onder «grote schade»
      wordt verstaan schade waarvan de totale kosten onmiddellijk door de onderzoekende instantie op ten minste € 2
      miljoen kunnen worden geraamd;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.t
    text: |-
      spoorwegveiligheidsrichtlijn: richtlijn (EU) 2016/798 van het Europees Parlement en de Raad van 11 mei 2016 inzake
      veiligheid op het spoor (PbEU 2016, L 138);
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.u
    text: |-
      Nederlandse spoorwegveiligheidsinstantie: de door Onze Minister van Infrastructuur en Waterstaat aangewezen
      dienst, belast met de taken van de nationale veiligheidsinstantie, bedoeld in artikel 3, onderdeel 7, van de
      spoorwegveiligheidsrichtlijn;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: 1.1.v
    text: |-
      Europees Spoorwegbureau: het Spoorwegbureau van de Europese Unie, bedoeld in Verordening (EU) 2016/796 van het
      Europees Parlement en de Raad van 11 mei 2016 betreffende het Spoorwegbureau van de Europese Unie en tot intrekking
      van Verordening (EG) nr. 881/2004 (PbEU 2016, L 138).
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: '1.2'
    text: |-
      Onder een luchtvaartongeval wordt mede verstaan een gebeurtenis die samenhangt met het gebruik van een onbemand
      luchtvaartuig en plaatsvindt tijdens de periode vanaf de start tot en met de landing en waarbij de in het eerste
      lid, onderdeel f, onder 1° tot en met 3°, genoemde gevolgen zich hebben voorgedaan.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel1
  - number: '2.1'
    text: |-
      Op voorvallen niet in verband met een spoorweg, waarbij geen andere zaak of persoon is betrokken dan een
      zaak of persoon in gebruik bij onderscheidenlijk in de uitoefening van een functie ten behoeve van Onze
      Minister van Defensie of bij een buitenlandse krijgsmacht, dan wel ten behoeve van een organisatie waarvan
      het beheer is opgedragen aan Onze Minister van Defensie, zijn de [artikelen 3 tot en met 5][ref1], [8][ref2],
      [9, eerste lid, onderdelen a tot en met k, en tweede lid][ref3], en [10 tot en met 23][ref4] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017681#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0017681#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0017681#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0017681#Artikel10
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017681
        artikel: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0017681
        artikel: '8'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0017681
        artikel: '9'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0017681
        artikel: '10'
        paragraaf: '5'
  - number: '2.2'
    text: |-
      Indien bij een voorval als in het eerste lid bedoeld tevens een andere zaak of persoon is
      betrokken dan in dat lid bedoeld, zijn de [artikelen 3 tot en met 5][ref1], [8][ref2],
      [9, eerste lid, onderdelen a tot en met k, en tweede lid][ref3], en [10 tot en met 23][ref4] slechts van toepassing
      voorzover het die andere zaak of persoon betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0017681#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0017681#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0017681#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0017681#Artikel10
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017681
        artikel: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0017681
        artikel: '8'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0017681
        artikel: '9'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0017681
        artikel: '10'
        paragraaf: '5'
  - number: '2.3'
    text: |-
      De [artikelen 4][ref1], [5][ref2], [11a][ref3] en [11b][ref4] zijn niet van toepassing op scheepvaartongevallen,
      waarbij uitsluitend zijn betrokken:


      [ref1]: https://wetten.overheid.nl/BWBR0017681#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0017681#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0017681#Artikel11a
      [ref4]: https://wetten.overheid.nl/BWBR0017681#Artikel11b
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017681
        artikel: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0017681
        artikel: '5'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0017681
        artikel: 11a
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0017681
        artikel: 11b
        paragraaf: '5'
  - number: 2.3.a
    text: |-
      andere dan in het eerste lid bedoelde schepen in eigendom van of geëxploiteerd door een andere staat voor een niet-
      commerciële overheidsdienst;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel2
  - number: 2.3.b
    text: |-
      schepen die niet mechanisch worden voortgestuwd, houten schepen van eenvoudige bouw en niet voor handel gebruikte
      plezierjachten en pleziervaartuigen, tenzij deze voor commerciële doeleinden worden of zullen worden bemand en
      gebruikt voor het vervoer van meer dan 12 passagiers;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel2
  - number: 2.3.c
    text: vissersvaartuigen met een lengte van minder dan 15 meter.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel2
  - number: '2.4'
    text: |-
      Het bepaalde bij of krachtens dit besluit ten aanzien van de staat van de exploitant is slechts van toepassing
      indien:
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel2
  - number: 2.4.a
    text: |-
      het betrokken luchtvaartuig is geleasd door, gecharterd door of de beschikking daarover door uitwisseling is
      verkregen door een staat die niet tevens de staat is waar het luchtvaartuig is ingeschreven, en
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel2
  - number: 2.4.b
    text: |-
      deze staat, geheel of gedeeltelijk, de functies en verplichtingen van de laatstbedoelde staat, die voortvloeien uit
      annex 13 bij het op 7 december 1994 te Chicago tot stand gekomen Verdrag inzake de internationale burgerluchtvaart,
      vervult.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel2
  - number: '3.1'
    text: |-
      De raad stelt een onderzoek in naar luchtvaartongevallen, niet zijnde een luchtvaartongeval als bedoeld in
      [artikel 1, tweede lid][ref1], en ernstige luchtvaartincidenten, betreffende:


      [ref1]: https://wetten.overheid.nl/BWBR0017681#Artikel1
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0017681
        artikel: '1'
        paragraaf: '1'
  - number: 3.1.a
    text: een luchtvaartuig op of boven het grondgebied van Nederland met inbegrip van de territoriale zee,
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel3
  - number: 3.1.b
    text: een Nederlands luchtvaartuig boven volle zee of
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel3
  - number: 3.1.c
    text: |-
      een Nederlands luchtvaartuig in het buitenland, indien de betrokken staat geen onderzoek instelt, indien deze het
      onderzoek aan de Nederlandse autoriteiten overlaat of indien niet kan worden vastgesteld dat de plaats van het
      voorval binnen het grondgebied van enige staat ligt en niet met een andere staat wordt overeengekomen dat deze het
      onderzoek verricht.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel3
  - number: '3.2'
    text: |-
      De raad kan het onderzoek naar een luchtvaartongeval of een ernstig luchtvaartincident met een ander dan een
      Nederlands luchtvaartuig geheel of gedeeltelijk overlaten aan een andere staat indien deze naar zijn oordeel op
      voldoende deskundige wijze het onderzoek zal verrichten en deze met het instellen van een onderzoek instemt. Indien
      het luchtvaartongeval of een ernstig luchtvaartincident heeft plaatsgevonden op het grondgebied van een lidstaat
      van de Europese Unie kan het onderzoek waarbij een Nederlands luchtvaartuig is betrokken worden overgedragen aan
      een andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel3
  - number: '4.1'
    text: 'De raad stelt een onderzoek in naar een zeer ernstig scheepvaartongeval waarbij een zeeschip is betrokken, indien:'
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel4
  - number: 4.1.a
    text: |-
      een zeeschip dat op grond van voor Nederland geldende rechtsregels gerechtigd is de vlag van het Koninkrijk te
      voeren bij het ongeval is betrokken;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel4
  - number: 4.1.b
    text: |-
      het ongeval plaatsvindt in de Nederlandse binnenwateren of territoriale zee, bedoeld in
      [artikel 1, eerste lid, van de Wet grenzen Nederlandse territoriale zee][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003748#Artikel1
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003748
        artikel: '1'
  - number: 4.1.c
    text: Nederland een aanmerkelijk belang heeft bij dat ongeval.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel4
  - number: '4.2'
    text: |-
      Bij een ernstig scheepvaartongeval doet de raad een voorafgaande beoordeling om te besluiten of er een onderzoek
      wordt verricht. Wanneer de raad op basis van het voorafgaand onderzoek besluit geen onderzoek te doen, dan zendt de
      raad dit besluit aan de Europese Commissie.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel4
  - number: '5.1'
    text: |-
      Wanneer de raad onderzoek doet naar een scheepvaartongeval of -incident, waarbij een zeeschip is betrokken, en
      waarbij een andere staat een aanmerkelijk belang heeft, dan voert de raad het onderzoek uit in samenwerking met die
      staat, tenzij die staat daaraan geen medewerking verleent.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel5
  - number: '5.2'
    text: |-
      Wanneer de raad onderzoek doet naar een scheepvaartongeval of -incident, waarbij een zeeschip is betrokken, en
      dat plaats heeft gevonden in wateren onder andere dan Nederlandse jurisdictie, wordt het onderzoek uitgevoerd in
      samenwerking met de tot die wateren bevoegde staat of, indien Aruba, Curaçao of Sint Maarten ten aanzien van die
      wateren bevoegd zijn, met Aruba, Curaçao onderscheidenlijk Sint Maarten, tenzij die andere staat, Aruba, Curaçao
      onderscheidenlijk Sint Maarten daaraan geen medewerking verlenen.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel5
  - number: '5.3'
    text: |-
      In geval van samenwerking met een andere staat overlegt de raad met de daartoe bevoegde instantie van de staat
      of staten met een aanmerkelijk belang wie de leiding van een onderzoek op zich neemt. Totdat een andere staat
      de leiding overneemt, is de raad verantwoordelijk voor het onderzoek en de coördinatie met andere staten die een
      aanmerkelijk belang hebben.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel5
  - number: '5.4'
    text: |-
      Het onderzoek naar een scheepvaartongeval, waarbij een ro-ro-passagiersschip of hogesnelheidspassagiersvaartuig is
      betrokken en waarvoor de raad een onderzoeksverplichting heeft, wordt in ieder geval door de raad geleid, totdat de
      raad met het daartoe bevoegde onderzoeksorgaan van de staat of staten met een aanmerkelijk belang overeenstemming
      bereikt welke staat de leiding van het onderzoek overneemt.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel5
  - number: '5.5'
    text: |-
      Indien de raad de leiding heeft over een onderzoek naar een scheepvaartongeval, is samenwerking met een
      onderzoeksinstantie van een andere staat dan een lidstaat van de Europese Unie uitsluitend mogelijk onder de
      voorwaarden, gesteld in Richtlijn nr. 2009/18/EG van het Europees parlement en van de Raad van Europese Unie van
      23 april 2009 tot vaststelling van de grondbeginselen voor het onderzoek van ongevallen in de zeescheepvaartsector
      en tot wijziging van de Richtlijn 1999/35/EG van de Raad en Richtlijn 2002/59/EG van het Europees Parlement en de
      Raad (PbEU L 131).
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel5
  - number: '5.6'
    text: |-
      Indien een onderzoeksinstantie van een andere staat dan een lidstaat van de Europese Unie de leiding heeft over
      het onderzoek naar een scheepvaartongeval, is samenwerking door de raad met die onderzoeksinstantie uitsluitend
      mogelijk wanneer het onderzoek wordt uitgevoerd overeenkomstig de regels, gesteld in de Code of the International
      Standards and Recommended Practices for a Safety Investigation into a Marine Casualty or Marine Incident zoals
      vastgesteld bij resolutie MSC.255(84) van de International Maritime Organisation van 16 mei 2008.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel5
  - number: '6.1'
    text: |-
      De raad stelt een onderzoek in naar luchtvaartongevallen en ernstige luchtvaartincidenten waarbij luchtvaartuigen
      zijn betrokken die in gebruik zijn bij een krijgsmacht van twee of meer staten, aangesloten bij de Noord-
      Atlantische Verdragsorganisatie, op of boven het grondgebied van Nederland, met inbegrip van de territoriale zee,
      en schepen die in gebruik zijn bij Onze Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel6
  - number: '6.2'
    text: |-
      De raad laat het onderzoek, bedoeld in het eerste lid, over aan de staat waarbij het luchtvaartuig in gebruik is,
      indien deze dit wenst, tenzij er overwegende redenen zijn om dit niet te doen.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel6
  - number: '6.3'
    text: |-
      Indien een luchtvaartuig is betrokken dat in gebruik is bij een andere staat dan de staat die daarvan eigenaar
      is, kan deze laatste verlangen voor de toepassing van het tweede lid te worden aangemerkt als staat waarbij het
      luchtvaartuig in gebruik is.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel6
  - number: '7.1'
    text: |-
      In geval de raad een onderzoek instelt naar een voorval waarbij materieel, personeel of voorzieningen van een
      krijgsmacht van één van de andere staten, aangesloten bij de Noord-Atlantische Verdragsorganisatie, zijn betrokken,
      treedt de raad in overleg met de buitenlandse onderzoeksinstantie. De raad bepaalt in overleg met die instantie op
      welke wijze het onderzoek van het voorval wordt ingericht. Bij dit onderzoek neemt de raad binnen het kader van de
      rijkswet de op dit onderzoek van toepassing zijnde, in het kader van de Noord-Atlantische Verdragsorganisatie tot
      stand gebrachte voorschriften in acht, voorzover deze door Nederland zijn aanvaard.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel7
  - number: '7.2'
    text: |-
      De raad kan in overleg met de betrokken staat de in het eerste lid bedoelde procedure en voorschriften eveneens
      toepassen ten aanzien van het onderzoek van een voorval waarbij een krijgsmacht is betrokken van een staat die niet
      is aangesloten bij de Noord-Atlantische Verdragsorganisatie.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel7
  - number: '8.1'
    text: |-
      De raad stelt onverwijld een onderzoek in naar een zwaar ongeval als bedoeld in [richtlijn nr. 96/82/EG]
      (31996L0082) van de Raad van de Europese Unie van 9 december 1996 betreffende de beheersing van de gevaren van
      zware ongevallen waarbij gevaarlijke stoffen zijn betrokken (PbEG L 010).
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel8
  - number: '8.2'
    text: |-
      De raad is niet gehouden een in het eerste lid bedoeld onderzoek in te stellen indien één van de uitsluitingen,
      genoemd in artikel 4 van de in het eerste lid genoemde richtlijn, van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel8
  - number: 8a.1
    text: De raad stelt onverwijld een onderzoek in naar een ernstig ongeval in verband met een spoorweg.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel8a
  - number: 8a.2
    text: |-
      Indien niet kan worden vastgesteld of een ongeval als bedoeld in het eerste lid in Nederland of een ander land
      heeft plaatsgevonden, of indien het heeft plaatsgevonden op of vlakbij een grensinstallatie van Nederland en een
      ander land, worden tussen de raad en het bevoegde onderzoeksorgaan in het andere land afspraken gemaakt wie het
      onderzoek gaat verrichten of wordt afgesproken dat gezamenlijk onderzoek wordt verricht. Ingeval het onderzoek
      wordt verricht door de raad, wordt het orgaan in het andere land uitgenodigd aan het onderzoek deel te nemen en
      volledig over de uitkomsten van het onderzoek ingelicht.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel8a
  - number: 8b
    text: |-
      Bij een beslissing als bedoeld in [artikel 41, eerste lid, van de rijkswet][ref1], omtrent het instellen van een
      onderzoek naar een ongeval of incident in verband met een spoorweg, niet zijnde een ernstig ongeval in verband met
      een spoorweg, houdt de raad rekening met:


      [ref1]: https://wetten.overheid.nl/BWBR0017613#Artikel41
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0017613
        artikel: '41'
  - number: 8b.a
    text: de ernst van het ongeval of incident,
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel8b
  - number: 8b.b
    text: |-
      de vraag of het ongeval of incident deel uitmaakt van een reeks ongevallen of incidenten die van belang zijn voor
      het systeem als geheel,
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel8b
  - number: 8b.c
    text: de consequenties van het ongeval of incident voor de veiligheid op het spoor in de Europese Unie, en
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel8b
  - number: 8b.d
    text: |-
      verzoeken van infrastructuurbeheerders, spoorwegondernemingen, de Nederlandse spoorwegveiligheidsinstantie of
      andere lidstaten.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel8b
  - number: '9.1'
    text: |-
      Tot het melden aan de raad van voorvallen, bedoeld in [artikel 28, eerste lid, van de rijkswet][ref1], zijn
      gehouden:


      [ref1]: https://wetten.overheid.nl/BWBR0017613#Artikel28
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0017613
        artikel: '28'
  - number: 9.1.a
    text: |-
      in geval van een luchtvaartongeval of een ernstig luchtvaartincident op of boven Nederlands grondgebied met
      inbegrip van de territoriale zee: de gezagvoerder en de exploitant van een luchtvaartuig dat betrokken is bij het
      ongeval of het ernstige luchtvaartincident, en de betrokken luchtverkeersdienst;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel9
  - number: 9.1.b
    text: |-
      in geval van een luchtvaartongeval of een ernstig luchtvaartincident op of in de nabijheid van een in Nederland
      gelegen luchtvaartterrein: naast de personen, genoemd onder a, de betrokken havenmeester;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel9
  - number: 9.1.c
    text: |-
      in geval van een luchtvaartongeval of een ernstig luchtvaartincident met een Nederlands luchtvaartuig boven volle
      zee of in het buitenland: de gezagvoerder en de exploitant van het luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel9
  - number: 9.1.d
    text: |-
      in geval van een scheepvaartongeval of een scheepvaartincident dat voldoet aan de criteria, genoemd in
      [artikel 4, eerste lid, de onderdelen a tot en met c][ref1]: de kapitein en de exploitant van een schip dat
      betrokken is bij het ongeval, en daartoe door het bevoegde gezag, bedoeld in de Scheepvaartverkeerswet, aangewezen
      personen werkzaam bij de desbetreffende scheepvaartbegeleidingsdienst indien dat ongeval heeft plaatsgevonden in de
      Europese wateren;


      [ref1]: https://wetten.overheid.nl/BWBR0017681#Artikel4
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0017681
        artikel: '4'
        paragraaf: '3'
  - number: 9.1.e
    text: |-
      in geval van een scheepvaartongeval met andere schepen dan zeeschepen varende in de Europese wateren onder
      Nederlandse jurisdictie: de kapitein en de exploitant van het schip;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel9
  - number: 9.1.f
    text: |-
      in geval van een voorval in verband met een spoorweg of een andere railweg in Nederland: de exploitant van
      een railvoertuig dat betrokken is bij het voorval, de Nederlandse spoorwegveiligheidsinstantie, de betrokken
      verkeersleiding en de betrokken beheerder van de betrokken railweg of daarmee vergelijkbare geleider;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel9
  - number: 9.1.g
    text: |-
      in geval van een voorval in verband met een buisleiding in Nederland: de exploitant van een buisleiding die
      betrokken is bij het ongeval;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel9
  - number: 9.1.h
    text: |-
      in geval van een voorval als bedoeld in [artikel 47 van de Wet vervoer gevaarlijke stoffen][ref1]: Onze Minister
      van Verkeer en Waterstaat voorzover de voorvallen aan hem zijn gemeld;


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel47
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '47'
  - number: 9.1.i
    text: |-
      in geval van een voorval als bedoeld in [artikel 6.60 van de Wet luchtvaart][ref1]: Onze Minister van Verkeer en
      Waterstaat voorzover de voorvallen aan hem zijn gemeld;


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6'
  - number: 9.1.j
    text: |-
      in geval van een zwaar ongeval als bedoeld als bedoeld in [richtlijn nr. 96/82/EG](31996L0082) van de Raad van de
      Europese Unie van 9 december 1996 betreffende de beheersing van de gevaren van zware ongevallen waarbij gevaarlijke
      stoffen zijn betrokken (PbEG L 010): de exploitant van de inrichting als in de richtlijn bedoeld;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel9
  - number: 9.1.k
    text: |-
      in geval van een luchtvaartongeval of een ernstig luchtvaartincident als bedoeld in [artikel 6, eerste lid][ref1]:
      Onze Minister van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0017681#Artikel6
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0017681
        artikel: '6'
        paragraaf: '3'
  - number: '9.2'
    text: |-
      In geval internationale verdragen of regelingen Onze Minister wie het aangaat verplichten tot het melden van een
      voorval aan een andere staat, de Commissie van de Europese Gemeenschappen of een internationale organisatie, geeft
      de raad de ontvangen melding terstond door aan Onze Minister wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel9
  - number: '9.3'
    text: |-
      Bij een melding in geval van een voorval in verband met een spoorweg of een andere railweg in Nederland, wordt
      alle beschikbare informatie over het voorval verstrekt. In voorkomend geval wordt de melding geactualiseerd zodra
      ontbrekende informatie beschikbaar wordt.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel9
  - number: 9a.1
    text: |-
      Bij een beslissing van de raad als bedoeld in [artikel 41, eerste lid, van de rijkswet][ref1], om onderzoek te doen
      naar een scheepvaartongeval of incident, houdt de raad rekening met:


      [ref1]: https://wetten.overheid.nl/BWBR0017613#Artikel41
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0017613
        artikel: '41'
  - number: 9a.1.a
    text: de ernst van het ongeval of incident;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel9a
  - number: 9a.1.b
    text: het type vaartuig of lading dat betrokken is bij het ongeval of incident, en
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel9a
  - number: 9a.1.c
    text: |-
      de mogelijkheid dat het onderzoek ertoe bijdraagt dat toekomstige scheepvaartongevallen en -incidenten kunnen
      worden voorkomen.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel9a
  - number: 9a.2
    text: |-
      De raad start het onderzoek naar een scheepvaartongeval of -incident zo spoedig mogelijk, en in ieder geval binnen
      twee maanden, nadat het ongeval of incident plaatsvond.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel9a
  - number: '10.1'
    text: |-
      De gegevens die zijn verzameld of verkregen tijdens het onderzoek worden effectief gebruikt en naar behoren
      geanalyseerd.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel10
  - number: '10.2'
    text: |-
      In geval van een onderzoek naar een scheepvaartongeval worden de bevindingen van het onderzoek zo spoedig mogelijk
      na afsluiting van het onderzoek bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel10
  - number: '11'
    text: |-
      Bij ministeriële regeling worden regels gesteld over het toezenden van het rapport in concept aan andere staten,
      Aruba, Curaçao en Sint Maarten voor commentaar en over de voor het geven van commentaar te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel11
  - number: 11a
    text: |-
      De raad voert het onderzoek naar een scheepvaartongeval, waarbij een zeeschip is betrokken, uit overeenkomstig
      de methodologie, bedoeld in artikel 2, onder e, van de Verordening nr. 1406/2002 van het Europees Parlement en de
      Raad van de Europese Unie van 27 juni 2002 tot oprichting van een Europees Agentschap voor maritieme veiligheid
      (PbEG L 208). Afwijking van deze methodologie is mogelijk, voor zover de onderzoeker dit noodzakelijk acht voor het
      bereiken van de onderzoeksdoelstellingen.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel11a
  - number: 11b
    text: |-
      Bij een onderzoek naar een scheepvaartongeval, waarbij een zeeschip is betrokken, wordt voor aangelegenheden die
      niet reeds in de rijkswet en de daarop berustende bepalingen expliciet geregeld zijn, de Code of the International
      Standards and Recommended Practices for a Safety Investigation into a Marine Casualty or Marine Incident zoals
      vastgesteld bij resolutie MSC.255(84) van de International Maritime Organisation van 16 mei 2008 in acht genomen.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel11b
  - number: 11c
    text: |-
      Bij het onderzoek naar een scheepvaartongeval, een ernstig scheepvaartongeval of een zeer ernstig
      scheepvaartongeval wordt rekening gehouden met de relevante bepalingen van de IMO-richtsnoeren betreffende de
      billijke behandeling van zeelieden bij ongevallen op zee, bedoeld in artikel 3, vierde lid, van [richtlijn 2009/18/
      EG](32009L0018) van het Europees parlement en van de Raad van Europese Unie van 23 april 2009 tot vaststelling van
      de grondbeginselen voor het onderzoek van ongevallen in de zeescheepvaartsector en tot wijziging van de [Richtlijn
      1999/35/EG](31999L0035) van de Raad en [Richtlijn 2002/59/EG](32002L0059) van het Europees Parlement en de Raad
      (PbEU L 131).
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel11c
  - number: 11d.1
    text: |-
      De raad biedt in geval van een voorval in verband met een spoorweg of een andere railweg in Nederland aan
      de betrokken infrastructuurbeheerder en spoorwegondernemingen, de Nederlandse spoorwegveiligheidsinstantie,
      het Europees Spoorwegbureau, de slachtoffers en hun familieleden, de eigenaren van beschadigde eigendommen,
      fabrikanten, de betrokken noodhulpdiensten en vertegenwoordigers van het personeel en de gebruikers de mogelijkheid
      om relevante technische informatie te leveren om de kwaliteit van het onderzoeksrapport te verbeteren.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel11d
  - number: 11d.2
    text: |-
      De raad neemt de redelijke behoeften van de slachtoffers en hun familieleden in aanmerking en houdt hen op de
      hoogte van de voortgang van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel11d
  - number: 11e
    text: |-
      De raad publiceert in geval van een voorval in verband met een spoorweg of een andere railweg in Nederland ten
      minste eenmaal per jaar een tussentijdse verklaring over het onderzoek indien het eindrapport niet binnen twaalf
      maanden na het voorval kan worden uitgebracht. In de tussentijdse verklaring gaat de raad in op de voortgang van
      het onderzoek en eventuele veiligheidskwesties die aan het licht zijn gekomen.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel11e
  - number: 11f.1
    text: |-
      Indien de raad naar aanleiding van een onderzoek naar een voorval in verband met een spoorweg een aanbeveling doet,
      richt hij deze tot de Nederlandse spoorwegveiligheidsinstantie, en, als de aard van de aanbeveling dat vereist, tot
      andere bestuursorganen, andere lidstaten of het Europees Spoorwegbureau.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel11f
  - number: 11f.2
    text: |-
      De Nederlandse spoorwegveiligheidsinstantie en de in het eerste lid bedoelde andere bestuursorganen, andere
      lidstaten of het Europees Spoorwegbureau tot welke de aanbevelingen zijn gericht, laten de raad ten minste eenmaal
      per jaar weten welke maatregelen zij naar aanleiding van de aanbeveling hebben genomen of nog zullen nemen.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel11f
  - number: '12'
    text: |-
      Indien, in geval van een luchtvaartongeval, door de staat van registratie, de staat van de exploitant, de staat
      van ontwerp of de staat van vervaardiging een verzoek wordt gedaan om het luchtvaartuig, zijn inhoud of enig ander
      bewijsmateriaal ongestoord te laten, hangende het onderzoek door een vertegenwoordiger van de verzoekende staat,
      neemt de raad alle benodigde maatregelen om aan dit verzoek tegemoet te komen, voorzover dit redelijk uitvoerbaar
      en verenigbaar met de juiste uitvoering van het onderzoek is en met dien verstande dat het luchtvaartuig mag worden
      verplaatst om er personen, dieren, post en kostbaarheden uit te halen, om vernietiging door vuur of andere oorzaken
      te voorkomen of om gevaar of hinder voor de luchtvaart, ander transport of mensen te voorkomen en het niet een
      overmatige vertraging van het weer in dienst nemen van het luchtvaartuig tot gevolg heeft.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel12
  - number: '13'
    text: |-
      Bij ministeriële regeling worden regels gesteld over het in daarbij aangewezen gevallen toezenden van het
      rapport, aan een buitenlandse staat, de Commissie van de Europese Gemeenschappen, het Europees Spoorwegbureau, een
      internationale organisatie of andere derden.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel13
  - number: '14.1'
    text: |-
      Indien een luchtvaartongeval of ernstig luchtvaartincident buiten Nederland, de territoriale wateren daaronder
      begrepen, een Nederlands luchtvaartuig betreft of een luchtvaartuig waarvan de exploitant in Nederland is gevestigd
      of waarvan Nederland de staat van ontwerp of vervaardiging is, geeft Onze Minister van Verkeer en Waterstaat zo
      spoedig mogelijk aan de staat van het voorval alle relevante informatie over het betrokken luchtvaartuig en zijn
      bemanning.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel14
  - number: '14.2'
    text: |-
      In het geval, bedoeld in het eerste lid, deelt Onze Minister van Verkeer en Waterstaat de staat van het voorval ook
      mede of Nederland een vertegenwoordiger aanwijst. Indien Nederland dit doet, geeft bedoelde minister ook de naam
      van de vertegenwoordiger, bijzonderheden hoe met deze in contact kan worden getreden, alsmede de verwachte datum
      van aankomst van de vertegenwoordiger door.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel14
  - number: '15'
    text: |-
      Indien een luchtvaartongeval of ernstig luchtvaartincident buiten Nederland, de territoriale wateren daaronder
      begrepen, een luchtvaartuig betreft waarvan de exploitant in Nederland is gevestigd, stelt Onze Minister van
      Verkeer en Waterstaat zo spoedig mogelijk, met behulp van de meest geschikte en snelste middelen die beschikbaar
      zijn, de staat van het voorval en de staat van registratie op de hoogte van bijzonderheden inzake gevaarlijke
      stoffen aan boord van het luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel15
  - number: '16.1'
    text: |-
      Indien een onderzoek terzake van een luchtvaartongeval of ernstig luchtvaartincident met een ander dan een
      Nederlands luchtvaartuig waarvan de exploitant in Nederland is gevestigd of waarvan Nederland de staat van ontwerp
      of vervaardiging is, wordt ingesteld door de staat van registratie, geeft Onze Minister van Verkeer en Waterstaat
      desverzocht aan deze staat alle relevante informatie betreffende het betrokken luchtvaartuig en zijn bemanning.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel16
  - number: '16.2'
    text: |-
      In het geval, bedoeld in het eerste lid, deelt Onze Minister van Verkeer en Waterstaat de staat van registratie,
      ook mee of Nederland een vertegenwoordiger aanwijst. Indien Nederland dit doet, geeft bedoelde minister ook de naam
      van de vertegenwoordiger, bijzonderheden hoe met deze in contact kan worden getreden, alsmede de verwachte datum
      van aankomst van de vertegenwoordiger door.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel16
  - number: '17'
    text: |-
      Indien de staat die een onderzoek verricht terzake van een luchtvaartongeval met een luchtvaartuig met een
      startmassa van meer dan 2250 kg dat in Nederland is ingeschreven, waarvan de exploitant in Nederland woont of
      waarvan Nederland de staat van ontwerp of vervaardiging is, verzoekt om deelneming door Nederland, wijst Onze
      Minister van Verkeer en Waterstaat een vertegenwoordiger terzake van het onderzoek aan.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel17
  - number: '18'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de aanwijzing door Onze Minister van Verkeer
      en Waterstaat van vertegenwoordigers als bedoeld in de [artikelen 14, tweede lid][ref1], [16, tweede lid][ref2],
      en [17][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017681#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0017681#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0017681#Artikel17
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0017681
        artikel: '14'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0017681
        artikel: '16'
        paragraaf: '8'
      - id: ref3
        bwb_id: BWBR0017681
        artikel: '17'
        paragraaf: '8'
  - number: '19.1'
    text: |-
      De raad kan aan een onderzoek buiten Nederland, dat door een andere staat wordt ingesteld, deelnemen, voorzover die
      staat daarvoor toestemming geeft.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel19
  - number: '19.2'
    text: |-
      In geval de raad overeenkomstig het eerste lid aan een onderzoek deelneemt, meldt hij dit vooraf aan Onze Minister
      wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel19
  - number: '19.3'
    text: |-
      Onze Minister van Verkeer en Waterstaat kan aan de raad opdracht geven deel te nemen aan een onderzoek naar een
      luchtvaartongeval of ernstig luchtvaartincident in een andere staat.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel19
  - number: '19.4'
    text: |-
      Onze Minister van Verkeer en Waterstaat kan aan de raad opdracht geven deel te nemen aan een onderzoek dat door
      een andere staat wordt ingesteld naar een voorval met een zeeschip dat op grond van voor Nederland geldende
      rechtsregels gerechtigd is de vlag van het Koninkrijk te voeren.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel19
  - number: '20'
    text: |-
      Op verzoek van de staat die een onderzoek terzake van een luchtvaartongeval of luchtvaartincident verricht,
      verschaft Onze Minister van Verkeer en Waterstaat alle relevante informatie die hij beschikbaar heeft.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel20
  - number: '21.1'
    text: |-
      Indien voorafgaand aan een luchtvaartongeval of luchtvaartincident gebruik is gemaakt of normalerwijze gebruik zou
      moeten zijn gemaakt van faciliteiten of diensten in Nederland en Onze Minister van Verkeer en Waterstaat informatie
      heeft die wezenlijk is voor het onderzoek, verschaft hij deze aan de staat die het onderzoek verricht.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel21
  - number: '21.2'
    text: |-
      Indien een onderzoek een luchtvaartongeval of luchtvaartincident betreft met een luchtvaartuig dat in Nederland is
      ingeschreven of waarvan de exploitant in Nederland is gevestigd, verschaft Onze Minister van Verkeer en Waterstaat
      op verzoek van de staat die het onderzoek verricht, de wezenlijke informatie waarover hij beschikt, over elke
      organisatie waarvan de activiteiten direct of indirect de vlucht van het vliegtuig kunnen hebben beïnvloed.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel21
  - number: '22.1'
    text: |-
      Ingeval sprake is van een luchtvaartongeval of ernstig luchtvaartincident met een Nederlands luchtvaartuig of een
      luchtvaartuig waarvan de exploitant in Nederland is gevestigd, en het luchtvaartuig in een andere staat landt dan
      die waarin het ongeval of het incident zich heeft voorgedaan, verschaft Onze Minister van Verkeer en Waterstaat, op
      verzoek van de staat die het onderzoek verricht, aan deze staat de opnamen van de vluchtrecorder en, indien nodig,
      van de verbonden vluchtrecorders.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel22
  - number: '22.2'
    text: |-
      In geval sprake is van een ongeval met een zeeschip op zee dat op grond van voor Nederland geldende rechtsregels
      gerechtigd is de vlag van het Koninkrijk te voeren in onder jurisdictie van een andere lidstaat van de Europese
      Unie vallende wateren en die andere lidstaat naar het ongeval een onderzoek instelt, stelt Onze Minister van
      Verkeer en Waterstaat de gegevens die zijn verzameld met de reisgegevensrecorder ter beschikking van die andere
      lidstaat.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel22
  - number: '23.1'
    text: |-
      Op verzoek van een andere lidstaat van de Europese Unie of een van de overige staten die partij zijn bij de
      Overeenkomst betreffende de Europese Economische Ruimte die een onderzoek naar een luchtvaartongeval, naar een
      ernstig luchtvaartincident of naar een luchtvaartincident leidt, kan Onze Minister van Verkeer en Waterstaat de
      raad opdragen, binnen de grenzen van zijn mogelijkheden, kosteloos bijstand te verlenen.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel23
  - number: '23.2'
    text: |-
      Ingeval een luchtvaartongeval heeft plaatsgevonden in volle zee in de nabijheid van Nederland, geeft Onze Minister
      van Verkeer en Waterstaat aan de staat die het onderzoek verricht alle mogelijke bijstand.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel23
  - number: '23.3'
    text: |-
      Op verzoek van Aruba, Curaçao of Sint Maarten kan Onze Minister van Verkeer en Waterstaat de raad opdragen, binnen
      de grenzen van zijn mogelijkheden, bijstand te verlenen aan een vanwege de autoriteiten van een van die landen
      verricht onderzoek betreffende een scheepvaartongeval.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel23
  - number: '24.1'
    text: |-
      Ter bevordering van de coördinatie en het overleg maken de raad en het openbaar ministerie in Nederland, binnen
      een half jaar na inwerkingtreding van de rijkswet, afspraken over de samenwerking en informatie-uitwisseling in
      de gevallen waarin zowel de raad een onderzoek instelt naar een voorval als ook ten aanzien van hetzelfde voorval
      een opsporingsonderzoek wordt ingesteld met het oog op het opleggen van een strafrechtelijke sanctie. De afspraken
      behoeven de goedkeuring van Onze Minister en Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel24
  - number: '24.2'
    text: |-
      De afspraken over samenwerking en informatie-uitwisseling worden neergelegd in een samenwerkingsprotocol en
      omvatten in ieder geval:
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel24
  - number: 24.2.a
    text: de wijze waarop informatie wordt uitgewisseld over gelijktijdig lopende onderzoeken;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel24
  - number: 24.2.b
    text: |-
      hoe wordt omgegaan met voorwerpen en documenten die van belang zijn voor de onderzoeken, het horen van personen en
      noodzakelijk geachte secties op lijken;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel24
  - number: 24.2.c
    text: |-
      het wederzijds ter beschikking stellen van zaken die voor de onderzoeken van belang zijn en de teruggave van die
      zaken;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel24
  - number: 24.2.d
    text: de gevallen waarin en de wijze waarop ten aanzien van onderzoeken aan voorwerpen wordt samengewerkt;
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel24
  - number: 24.2.e
    text: |-
      de standaardprocedure die gehanteerd wordt wanneer zich een voorval daadwerkelijk voordoet en de wijze waarop
      geschillen worden geregeld.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel24
  - number: '24.3'
    text: |-
      Indien in een concreet geval zowel de raad een onderzoek instelt naar een voorval als een onderzoek wordt ingesteld
      met het oog op het opleggen van een strafrechtelijke sanctie, plegen de raad en het openbaar ministerie in
      Nederland, met inachtneming van het samenwerkingsprotocol, overleg over de inrichting van beide onderzoeken. In
      het overleg worden in ieder geval afspraken gemaakt over de inhoud van de te verrichten onderzoekshandelingen, de
      planning van deze onderzoekshandelingen in de tijd, de inbeslagneming van zaken en de instelling van een periodiek
      afstemmingsoverleg gedurende beide onderzoeken. De raad en het openbaar ministerie in Nederland kunnen zich bij het
      overleg laten vertegenwoordigen door personen onderscheidenlijk opsporingsdiensten die de feitelijke leiding hebben
      bij de onderzoeken.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel24
  - number: '25'
    text: |-
      Ter bevordering van de coördinatie en het overleg maken de raad en Onze Minister wie het aangaat, binnen een half
      jaar na inwerkingtreding van de rijkswet, afspraken over de samenwerking en informatie-uitwisseling in de gevallen
      waarin zowel de raad een onderzoek instelt naar een voorval als ook ten aanzien van hetzelfde voorval het opleggen
      van een bestuurlijke sanctie wordt overwogen. [Artikel 24, tweede en derde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017681#Artikel24
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0017681
        artikel: '24'
        paragraaf: '9'
  - number: '27.1'
    text: |-
      Behoudens het bepaalde in het tweede lid, treedt dit besluit in werking op het krachtens
      [artikel 97, eerste lid, eerste volzin, van de rijkswet][ref1] vastgestelde tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0017613#Artikel97
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0017613
        artikel: '97'
  - number: '27.2'
    text: |-
      Wat betreft het onderzoek naar ongevallen en incidenten met een zeeschip, niet zijnde een oorlogsschip,
      marinehulpschip of ander schip dat in gebruik is voor de uitvoering van de militaire taak, treedt dit besluit in
      werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel27
  - number: '28'
    text: 'Dit besluit wordt aangehaald als: Besluit Onderzoeksraad voor veiligheid.'
    url: https://wetten.overheid.nl/BWBR0017681/2026-01-01#Artikel28
