preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 27 september 2004, nr. HDJZ/AWW/2004-2262,
    Hoofddirectie Juridische Zaken;

    Gelet op richtlijn nr. 2003/37/EG van het Europees Parlement en de Raad van de Europese Unie van 26 mei 2003
    betreffende de typegoedkeuring van landbouw- of bosbouwtrekkers en aanhangwagens, verwisselbare getrokken machines,
    systemen, onderdelen en technische eenheden daarvan en tot intrekking van Richtlijn 74/150/EEG van de Raad (PbEU
    L 171), richtlijn nr. 2004/66/EG van de Raad van de Europese Unie van 26 april 2004 (PbEU L 168) tot aanpassing
    van de Richtlijnen 1999/45/EG, 2002/83/EG, 2003/37/EG en 2003/59/EG van het Europees Parlement en de Raad van de
    Europese Unie en de Richtlijnen 77/388/EEG, 91/414/EEG, 96/26/EG, 2003/48/EG en 2003/49/EG, op het gebied van vrij
    verkeer van goederen, vrijheid van dienstverlening, landbouw, vervoer en belastingen, in verband met de toetreding
    van Tsjechië, Estland, Cyprus, Letland, Litouwen, Hongarije, Malta, Polen, Slovenië en Slowakije en de artikelen
    21, eerste lid, 22, eerste lid, en 26, eerste lid, van de Wegenverkeerswet 1994;

    De Raad van State gehoord (advies van 22 november 2004, nr. W09.04.0472/V);

    Gezien het nader rapport van Onze voornoemde Minister van 25 januari 2005, nr. HDJZ/AWW/2005-117, Hoofddirectie
    Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0017986/2005-02-18#ArtikelAanhef
articles:
  - number: II
    text: |-
      [Artikel 3.10.1 van het Voertuigreglement][ref1] is tot 1 juli 2009 niet van toepassing op landbouw- of
      bosbouwtrekkers die beschikken over een typegoedkeuring die in een Lid-Staat van de Europese Gemeenschappen of
      in een andere Staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte voor 1 juli 2005
      is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel3.10.1
    url: https://wetten.overheid.nl/BWBR0017986/2005-02-18#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: 3.10.1
  - number: III
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0017986/2005-02-18#ArtikelIII
