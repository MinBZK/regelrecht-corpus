  - number: '10'
    text: |-
      De belanghebbende doet het verzoek om doorhaling, bedoeld in
      [artikel 58k, eerste lid, onderdeel b, van de wet][ref1] bij de melding.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58k
    url: https://wetten.overheid.nl/BWBR0012021/2002-10-01#Artikel10
