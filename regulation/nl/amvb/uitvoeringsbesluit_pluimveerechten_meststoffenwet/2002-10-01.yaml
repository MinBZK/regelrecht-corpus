    text: |-
      1 De in 1998 op het bedrijf geproduceerde hoeveelheid dierlijke meststoffen afkomstig van kippen en kalkoenen,
      bedoeld in [artikel 58k, eerste lid, onderdelen c en d, en tweede lid, onderdeel c, van de wet][ref1], en in
      de [artikelen 11, tweede lid][ref2], en [12, tweede lid][ref3], wordt bepaald door het gemiddeld aantal in 1998
      gehouden, uitgeschaarde of tijdelijk elders ter weiding ondergebrachte dieren, van de binnen deze diersoorten
      onderscheiden diercategorieën, opgenomen in [bijlage A bij de wet][ref4], zoals dit aantal met betrekking tot 1998
      en het desbetreffende bedrijf is opgegeven in de aangifte van de heffingen, bedoeld in de [artikelen 14][ref5]
      en [22 van de wet][ref6] dan wel, bij gebreke daarvan, zoals dit aantal is vermeld op de opgave, bedoeld in
      artikel 11 van de Regeling administratieve verplichtingen Meststoffenwet, te vermenigvuldigen met de forfaitaire
      productienormen voor de onderscheiden diercategorieën, uitgedrukt in kilogrammen fosfaat per dier per jaar,
      opgenomen in [bijlage A bij de wet][ref7].

      2 De gegevens van de aangifte en de correcties daarop, en van de opgave, worden slechts in aanmerking genomen
      voorzover deze door het Bureau Heffingen zijn ontvangen vóór 1 januari 2001.

      3 Indien in 1998 overdracht van het bedrijf heeft plaatsgevonden, wordt voor de toepassing van het eerste lid in
      aanmerking genomen de som van de door de vervreemder en door de verwerver van het bedrijf voor dat jaar ten aanzien
      van het bedrijf opgegeven aantallen kippen en kalkoenen, zoals deze aantallen over het gehele jaar zijn gemiddeld.

      4 [Artikel 58y, derde lid, van de wet][ref8] is van overeenkomstige toepassing op het in de
      [artikelen 4, tweede en derde lid][ref9], [14, vierde lid][ref10], en [15, tweede lid][ref11], bedoelde
      mestproductierecht.


