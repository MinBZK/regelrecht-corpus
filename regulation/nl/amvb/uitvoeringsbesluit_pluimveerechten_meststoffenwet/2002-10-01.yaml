  - number: '15'
    text: |-
      1 De omvang van het pluimveerecht van een daartoe aangemeld bedrijf ten aanzien waarvan ingevolge
      krachtens [artikel 59 van de wet][ref1] ontheffing is verleend van het uitbreidingsverbod,
      neergelegd in [artikel 55 van de wet][ref2], zoals dat luidde onmiddellijk vóór inwerkingtreding van
      [artikel 58c van de wet][ref3], en dat is ontstaan door splitsing in de periode tussen 5 november
      1998 en het tijdstip van inwerkingtreding van [artikel 58c van de wet][ref4], wordt in afwijking van
      [artikel 58g, eerste lid, van de wet][ref5] bepaald overeenkomstig het tweede lid, indien voldaan wordt aan de
      voorwaarde, gesteld in het derde lid.

      2 Het pluimveerecht komt overeen met het pluimveerecht zoals dat voor het oorspronkelijke bedrijf ingevolge
      [hoofdstuk V, titel 2, paragraaf 3, met uitzondering van artikel 58k, van de wet](onbekend) dan wel ingevolge
      [hoofdstuk 2, paragrafen 1 tot en met 4][ref6], of [artikel 15][ref7] zou hebben gegolden indien de splitsing
      niet had plaatsgevonden. Het pluimveerecht is niet hoger dan het op de dag voorafgaande aan het tijdstip van
      inwerkingtreding van [artikel 58c van de wet][ref8] voor het bedrijf geldende mestproductierecht.

      3 De belanghebbende doet bij de melding, bedoeld in het eerste lid, ten aanzien van het pluimveerecht van het
      bedrijf dat voor de splitsing, bedoeld in het eerste lid, tezamen met het overeenkomstig het eerste lid aangemelde
      bedrijf één bedrijf was, een kennisgeving van het vervallen van het pluimveerecht zoals dat onmiddellijk op het
      tijdstip van inwerkingtreding van [artikel 58c van de wet][ref9] gold.


