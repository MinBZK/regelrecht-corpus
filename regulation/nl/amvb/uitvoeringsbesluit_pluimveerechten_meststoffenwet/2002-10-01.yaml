      1 De melding, bedoeld in de [artikelen 14, eerste lid][ref1], en [15, eerste lid][ref2], wordt binnen zes weken
      na de inwerkingtreding van [artikel 58c van de wet][ref3] gedaan door de belanghebbende met gebruikmaking van een
      daartoe bestemd, door het Bureau Heffingen op verzoek van de belanghebbende ter beschikking gesteld formulier, dat
      overeenkomstig de op het formulier aangegeven wijze volledig en naar waarheid is ingevuld en door de belanghebbende
      is ondertekend.

      2 Bij gebreke van een overeenkomstig het eerste lid gedane melding treden de in de
      [artikelen 14, eerste lid][ref4], en [15, eerste lid][ref5], bedoelde genoemde gevolgen van de melding niet in.


