  - number: '5'
    text: |-
      Bij de melding wordt een afschrift van de milieuvergunning, onderscheidenlijk
      van de aanvraag van de milieuvergunning en van de aanvraag van de bouwvergunning,
      onderscheidenlijk van de melding en van de aanvraag van de bouwvergunning, bedoeld in
      __REF000___________________________________________________________________________________________________________
      _________________, waarop door het bevoegd gezag de datum van ontvangst is aangetekend, overgelegd. Bij gebreke van
      een dergelijke aantekening wordt tevens een door het bevoegd gezag afgegeven bewijs van ontvangst, waarin die datum
      is vermeld, overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58k
    url: https://wetten.overheid.nl/BWBR0012021/2002-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58k
  - number: '6'
    text: |-
      1 De milieuvergunning, bedoeld in [artikel 58k, eerste lid, onderdeel a, tweede gedachtestreepje, van de wet][ref1]
      is uiterlijk op 1 januari 2002 verleend.

      2 De belanghebbende geeft binnen zes weken na de verlening van de milieuvergunning hiervan kennis aan het Bureau
      Heffingen onder overlegging van een afschrift van de milieuvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58k
    url: https://wetten.overheid.nl/BWBR0012021/2002-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58k
  - number: '7'
    text: |-
      Binnen zes weken nadat de extra huisvesting, bedoeld in [artikel 58k, eerste lid, onderdeel a, van de wet][ref1] is
      gebouwd, geeft de belanghebbende hiervan kennis aan het Bureau Heffingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58k
    url: https://wetten.overheid.nl/BWBR0012021/2002-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58k
  - number: '8'
    text: |-
      De kennisgeving, bedoeld in de [artikelen 6, tweede lid][ref1], en [7, tweede lid][ref2], wordt gedaan met
      gebruikmaking van een daartoe bestemd, door het Bureau Heffingen op verzoek van de belanghebbende ter beschikking
      gesteld formulier, dat overeenkomstig de op het formulier aangegeven wijze volledig en naar waarheid is ingevuld en
      door de belanghebbende is ondertekend.


      [ref1]: https://wetten.overheid.nl/BWBR0012021#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0012021#Artikel7
    url: https://wetten.overheid.nl/BWBR0012021/2002-10-01#Artikel8
