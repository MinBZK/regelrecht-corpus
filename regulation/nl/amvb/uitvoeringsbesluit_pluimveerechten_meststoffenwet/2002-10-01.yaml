        artikel: 58k
  - number: '11'
    text: |-
      1 De omvang van het pluimveerecht van een bedrijf ten aanzien waarvan voldaan is aan de voorwaarden, gesteld in
      [artikel 58k, eerste lid, onderdeel c, van de wet][ref1] komt overeen met de overeenkomstig [hoofdstuk V, titel 2,
      paragraaf 3, met uitzondering van de artikelen 58k en 58m, van de wet](onbekend) bepaalde hoeveelheid, vermeerderd
      met de door de belanghebbende bij de melding aangegeven hoeveelheid fosfaat.

      2 De door de belanghebbende aangegeven hoeveelheid fosfaat komt ten hoogste overeen met de in 1998 geproduceerde
      hoeveelheid meststoffen afkomstig van kippen en kalkoenen, verminderd met de in het referentiejaar door deze
      diersoorten geproduceerde hoeveelheid meststoffen.

      3 [Artikel 58h, tweede en derde lid, van de wet][ref2] is van overeenkomstige toepassing op het tweede lid,
      met dien verstande dat in plaats van «het referentiejaar» wordt gelezen «1998», en dat van de op het bedrijf
      plaatsgevonden productie van dierlijke meststoffen afkomstig van varkens alleen de productie in de periode van
      1 januari tot 1 september 1998 in aanmerking wordt genomen.

      4 Voor de toepassing van het tweede lid wordt de in 1998 geproduceerde hoeveelheid dierlijke meststoffen afkomstig
      van kippen enkalkoenen slechts in aanmerking genomen voorzover deze hoeveelheid kleiner is dan de voor elk van
      de jaren 1995, 1996 en 1997 berekende hoeveelheid fosfaat die wordt bepaald door de som van het grondgebonden
      mestproductierecht en 83% van het niet-gebonden mestproductierecht, geldend voor het desbetreffende jaar, te
      verminderen met de in het desbetreffende jaar geproduceerde hoeveelheid dierlijke meststoffen afkomstig van andere
      in [bijlage A bij de wet][ref3] genoemde diersoorten dan kippen en kalkoenen.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58k
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58h
      [ref3]: https://wetten.overheid.nl/BWBR0004054
