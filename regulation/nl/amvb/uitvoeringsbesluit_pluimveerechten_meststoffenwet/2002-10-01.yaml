preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuurbeheer en Visserij van 5 oktober 2000, no. TRCJZ/2000/12288,
    Directie Juridische Zaken, gedaan in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening
    en Milieubeheer;

    Gelet op de artikelen 58k en 58t van de Meststoffenwet, artikel 61 van de Meststoffenwet voorzover het betreft
    hoofdstuk 2, paragraaf 5, van dit besluit, en artikel 21, eerste en tweede lid, van de Wet herstructurering
    varkenshouderij, voorzover het betreft artikel 18 van dit besluit;

    De Raad van State gehoord (advies van 14 december 2000, no. W11.00.0473/V);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuurbeheer en Visserij van 14 december 2000, no.
    TRCJZ/2000/15068, Directie Juridische Zaken, uitgebracht in overeenstemming met Onze Minister van Volkshuisvesting,
    Ruimtelijke Ordening en Milieubeheer;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0012021/2002-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. wet: [Meststoffenwet][ref1];

      b. melding: melding als bedoeld in [artikel 58k, eerste lid, aanhef, van de wet][ref2];

      c. referentiejaar: jaar dat ingevolge [artikel 58g, tweede en derde lid, van de wet][ref3] voor de toepassing van
      [hoofdstuk V, titel 2, paragraaf 3, van de wet](onbekend) als referentiejaar geldt;

      d. varkens: varkens als bedoeld in [artikel 1, onderdeel e, van de Wet herstructurering varkenshouderij][ref4];

      e. andere dieren: dieren van andere in [bijlage A bij de wet][ref5] opgenomen diersoorten dan varkens, kippen en
      kalkoenen;

      f. kennisgeving van het vervallen van het pluimveerecht: kennisgeving van het vervallen van het pluimveerecht als
      bedoeld in [artikel 58x van de wet][ref6].

      2 Voor de toepassing van hoofdstuk 2, paragraaf 5, wordt verstaan onder belanghebbende: belanghebbende als bedoeld
      in [artikel 58a, onderdeel g, van de wet][ref7].


