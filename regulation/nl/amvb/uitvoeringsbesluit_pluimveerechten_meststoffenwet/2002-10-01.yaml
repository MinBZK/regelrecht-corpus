  - number: '3'
    text: |-
      Een belanghebbende kan de melding slechts doen ten aanzien van één van de onderdelen van
      [artikel 58k, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58k
    url: https://wetten.overheid.nl/BWBR0012021/2002-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58k
  - number: '4'
    text: |-
      1 De omvang van het pluimveerecht van een bedrijf ten aanzien waarvan voldaan is aan de voorwaarden, gesteld
      in [artikel 58k, eerste lid, onderdeel a, van de wet][ref1] en gesteld in deze paragraaf, komt overeen met de
      overeenkomstig [hoofdstuk V, titel 2, paragraaf 3, met uitzondering van de artikelen 58k en 58m, van de wet]
      (onbekend) bepaalde hoeveelheid, vermeerderd met de door de belanghebbende bij de melding aangegeven hoeveelheid
      fosfaat.

      2 De door de belanghebbende aangegeven hoeveelheid fosfaat komt ten hoogste overeen met:

      a. het op 5 november 1998 voor het bedrijf geldende mestproductierecht, verminderd met de overeenkomstig [hoofdstuk
      V, titel 2, paragraaf 3, met uitzondering van de artikelen 58k en 58m, van de wet](onbekend) bepaalde hoeveelheid
      fosfaat, of, indien de aldus bepaalde hoeveelheid minder is,

      b. de hoeveelheid meststoffen afkomstig van het aantal kippen en kalkoenen waarmee het aantal op het bedrijf te
      houden kippen of kalkoenen kan worden vergroot ingevolge:

        - de milieuvergunning, bedoeld in [artikel 58k, eerste lid, onderdeel a, eerste gedachtestreepje, van de wet][ref2],
      dan wel
        - de naar aanleiding van de aanvraag, bedoeld in
      [artikel 58k, eerste lid, onderdeel a, tweede gedachtestreepje, van de wet][ref3] verleende milieuvergunning, dan
      wel
        - de melding, bedoeld in [artikel 58k, eerste lid, onderdeel a, derde gedachtestreepje, van de wet][ref4], ten
      opzichte van: 1°. het aantal dat kon worden gehouden op grond van de [Wet milieubeheer][ref5] voor de verlening
      van deze milieuvergunning, onderscheidenlijk voor deze melding, of, indien het aldus bepaalde aantal hoger is, 2°.
      het aantal dat zou kunnen worden gehouden indien het pluimveerecht zou worden bepaald overeenkomstig [hoofdstuk V,
      titel 2, paragraaf 3, met uitzondering van de artikelen 58k en 58m, van de wet](onbekend).

      3 De hoeveelheid meststoffen afkomstig van kippen, bedoeld in het tweede lid, onderdeel b, wordt slechts in
      aanmerking genomen voorzover de som van deze hoeveelheid fosfaat en de in het referentiejaar geproduceerde
      hoeveelheid dierlijke meststoffen afkomstig van kippen niet groter is dan de som van het op 5 november
      1998 voor het bedrijf geldende niet-gebonden mestproductierecht voor varkens en kippen en het grondgebonden
      mestproductierecht.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58k
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58k
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel58k
      [ref4]: https://wetten.overheid.nl/BWBR0004054#Artikel58k
      [ref5]: https://wetten.overheid.nl/BWBR0003245
