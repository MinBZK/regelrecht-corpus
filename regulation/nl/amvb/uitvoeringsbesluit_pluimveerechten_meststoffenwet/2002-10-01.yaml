  - number: '9'
    text: |-
      1 De omvang van het pluimveerecht van een bedrijf ten aanzien waarvan voldaan is aan de voorwaarden, gesteld
      in [artikel 58k, eerste lid, onderdeel b, van de wet][ref1] en gesteld in deze paragraaf, komt overeen met de
      overeenkomstig [hoofdstuk V, titel 2, paragraaf 3, met uitzondering van de artikelen 58k en 58m, van de wet]
      (onbekend) bepaalde hoeveelheid, vermeerderd met de door de belanghebbende bij de melding aangegeven hoeveelheid
      fosfaat.

      2 Ingeval de belanghebbende ingevolge [artikel 58k, eerste lid, onderdeel b, van de wet][ref2] een verzoek om
      doorhaling doet, en het voor het bedrijf geldende niet-gebonden mestproductierecht voor varkens en kippen ten
      gevolge van de registratie van een of meer na 11 april 1999 gedane kennisgevingen van verplaatsing per saldo is
      verkleind, dan komt de door de belanghebbende aangegeven hoeveelheid fosfaat ten hoogste overeen met:

        - het varkensrecht waarop de belanghebbende op grond van [hoofdstuk II][ref3] en
      [artikel 24 van de Wet herstructurering varkenshouderij][ref4] ten hoogste aanspraak kon maken, welk deel wordt
      uitgedrukt in kilogrammen fosfaat door vermenigvuldiging van het aantal varkenseenheden met 7,4 kilogram fosfaat,
      verminderd met
        - de hoeveelheid fosfaat waarmee de latente ruimte, bedoeld in
      [artikel 58k, eerste lid, onderdeel b, van de wet][ref5] de hoeveelheid fosfaat overstijgt die wordt bepaald
      door het op 31 december 2000 voor het bedrijf geldende niet-gebonden mestproductierecht te verminderen met de
      overeenkomstig [hoofdstuk V, titel 2, paragraaf 3, met uitzondering van de artikelen 58k en 58m, van de wet]
      (onbekend) bepaalde hoeveelheid fosfaat, althans voor zover deze laatstbedoelde hoeveelheid niet groter is dan het
      op 31 december 2000 geldende niet-gebonden mestproductierecht.

      3 De vermindering, bedoeld in het tweede lid, eerste gedachtestreepje, geschiedt ten hoogste voor een hoeveelheid
      fosfaat die overeenkomt met de hoeveelheid waarmee het niet-gebonden mestproductierecht geldend tot 1 januari 2001
      per saldo is verminderd ten gevolge van de registratie van kennisgevingen van verplaatsing die zijn gedaan na 11
      april 1999.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58k
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58k
      [ref3]: https://wetten.overheid.nl/BWBR0009542#HoofdstukII
      [ref4]: https://wetten.overheid.nl/BWBR0009542#Artikel24
      [ref5]: https://wetten.overheid.nl/BWBR0004054#Artikel58k
