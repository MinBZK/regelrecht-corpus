  - number: '13'
    text: |-
      1 De vergroting van de tot het bedrijf behorende oppervlakte landbouwgrond, bedoeld in
      [artikel 58k, eerste lid, onderdeel d, van de wet][ref1] is uiterlijk op 5 november 1998 schriftelijk bij het
      Bureau Heffingen gemeld.

      2 De grond waarmee de tot het bedrijf behorende oppervlakte landbouwgrond is uitgebreid was al vóór 6 november
      1998 daadwerkelijk in het kader van een normale bedrijfsvoering bij het bedrijf, bedoeld in [artikel 12][ref2]
      in gebruik.


