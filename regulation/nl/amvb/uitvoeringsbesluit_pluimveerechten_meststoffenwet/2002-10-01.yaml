  - number: '14'
    text: |-
      1 De omvang van het pluimveerecht van een daartoe aangemeld bedrijf wordt in afwijking van
      [artikel 58g, eerste lid, van de wet][ref1] bepaald overeenkomstig het tweede lid indien dit bedrijf is aangemeld
      voor de toepassing van [artikel 23 van het Besluit hardheidsgevallen herstructurering varkenshouderij][ref2],
      en de in [artikel 23, eerste lid, van dat besluit][ref3] bedoelde milieuvergunning, aanvraag, dan wel melding
      respectievelijk is verleend, ingediend of is gedaan ten behoeve van een vergroting van het aantal te houden kippen
      of kalkoenen op het desbetreffende bedrijf.

      2 Het pluimveerecht komt overeen met de overeenkomstig [hoofdstuk V, titel 2, paragraaf 3, met uitzondering van
      artikel 58k, van de wet](onbekend) bepaalde hoeveelheid, dan wel met de overeenkomstig de [paragrafen 1][ref4],
      [2][ref5], [3][ref6] of [4 van dit hoofdstuk][ref7] bepaalde hoeveelheid, vermeerderd met de door de
      belanghebbende bij de melding, bedoeld in het eerste lid aangegeven hoeveelheid fosfaat.

      3 De door de belanghebbende aangegeven hoeveelheid fosfaat komt ten hoogste overeen
      met de hoeveelheid fosfaat waarvoor [artikel 55a van de wet][ref8] ingevolge
      [artikel 23 van het Besluit hardheidsgevallen herstructurering varkenshouderij][ref9] ten aanzien van dat bedrijf
      buiten toepassing blijft.

      4 Indien 1997 het referentiejaar, bedoeld in [artikel 58g, tweede lid, van de wet][ref10] is, wordt
      voor de toepassing van het tweede lid in [artikel 58h, tweede en derde lid, van de wet][ref11] «niet-
      gebonden mestproductierecht voor varkens en kippen» gelezen als: niet-gebonden mestproductierecht
      voor varkens en kippen, verminderd met de hoeveelheid fosfaat waarvoor [artikel 55a][ref12] ingevolge
      [artikel 23 van het Besluit hardheidsgevallen herstructurering varkenshouderij][ref13] ten aanzien van dat bedrijf
      buiten toepassing blijft.

      5 Het pluimveerecht is niet hoger dan het op de dag voorafgaande aan het tijdstip van inwerkingtreding van
      [artikel 58c van de wet][ref14] voor het bedrijf geldende mestproductierecht.


