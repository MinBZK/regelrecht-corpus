  - number: '9'
    text: |-
      1 Bij haar advies, bedoeld in artikel 6, derde lid, van de wet, betrekt de commissie de krachtens
      [artikel 6 van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref1] gestelde regels met betrekking tot de
      toestemming.

      2 Bij de uitoefening van haar taak op grond van het eerste lid wordt aan de commissie een jurist toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002014#Artikel6
