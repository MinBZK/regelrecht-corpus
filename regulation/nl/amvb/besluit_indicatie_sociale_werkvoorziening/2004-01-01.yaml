  - number: '2'
    text: >-
      1 Een aanvraag tot indicatie wordt ingediend door of namens de betrokkene bij het gemeentebestuur waar betrokkene
      woonachtig is. Ondertekent de betrokkene de aanvraag tot indicatie niet zelf, dan wordt de reden daarvan vermeld.


      2 In de aanvraag wordt aangegeven of de betrokkene toestemming geeft tot het zo nodig raadplegen van behandelend
      artsen of psychologen en het gebruik maken van bij dezen aanwezige medische of psychologische gegevens.


      3 Bij de aanvraag wordt een bewijs van inschrijving in de gemeente alsmede een bewijs van inschrijving als
      werkzoekende bij de Centrale organisatie werk en inkomen overlegd.


      4 In afwijking van het eerste lid kan een aanvraag tot indicatie worden ingediend bij een ander gemeentebestuur,
      indien dat gemeentebestuur en het gemeentebestuur waar betrokkene woonachtig is daarmee instemmen.


      5 De aanvraag tot indicatie wordt door het gemeentebestuur binnen vier weken doorgeleid naar de commissie, bedoeld
      in artikel 12 van de wet.
    url: https://wetten.overheid.nl/BWBR0008954/2004-01-01#Artikel2
  - number: '3'
    text: |-
      1 Ten behoeve van de advisering over de aanvraag tot indicatie verricht de commissie, bedoeld in artikel 12, eerste
      lid, van de wet, met inachtneming van [bijlagen I][ref1], [II][ref2], [III][ref3] en [IV][ref4] behorend bij dit
      besluit, onderzoek naar:

      a. de beperkingen van betrokkene van lichamelijke, verstandelijke en psychische aard;

      b. de mogelijkheid, dat betrokkene in staat is passende arbeid te verrichten onder normale omstandigheden, zonder
      dat er sprake is van voorzieningen of maatregelen;

      c. de voorzieningen of maatregelen die voor betrokkene noodzakelijk zijn en de vraag of deze binnen redelijke
      grenzen in een normale arbeidsomgeving kunnen worden gerealiseerd;

      d. de mogelijkheid, dat betrokkene met de voorzieningen of maatregelen in staat is regelmatig arbeid in de sociale
      werkvoorziening te verrichten;

      e. de indeling in een arbeidshandicapcategorie als bedoeld in [artikel 6][ref5];

      f. de wenselijkheid en mogelijkheid, dat betrokkene in aanmerking komt voor begeleid werken;

      g. de wenselijkheid en mogelijkheid, dat betrokkene in aanmerking komt voor een scholingstraject.

      2 De commissie verricht haar onderzoek met inachtneming van het in [artikel 10][ref6] genoemde besluit.

      3 Bij de vastlegging van het onderzoek wordt gebruik gemaakt van het bij ministeriële regeling vastgestelde
      intakeprofiel.

      4 Van het onderzoek wordt ten behoeve van het gemeentebestuur schriftelijk rapport opgemaakt. In het rapport wordt
      verslag gedaan van de wijze waarop het onderzoek is verricht en van de bevindingen.


