  - number: '10'
    text: >-
      1 Het gemeentebestuur legt de taak en werkwijze van de commissie alsmede haar eigen taak en werkwijze bij de
      indicatie, herindicatie en voorgenomen opzegging van de dienstbetrekking vast in een besluit.


      2 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008954/2004-01-01#Artikel10
  - number: '11'
    text: >-
      1 Personen die op de dag voorafgaand aan de datum van inwerkingtreding van de wet op de wachtlijst staan, bedoeld
      in artikel 1, onder *b*, van het Besluit informatie sociale werkvoorziening, zoals dit besluit luidde tot die
      datum, worden binnen twee jaar na inwerkingtreding van de wet, doch in ieder geval vóórdat zij een dienstbetrekking
      of arbeidsovereenkomst als bedoeld in de wet aanvaarden, door het gemeentebestuur waar zij woonachtig zijn
      geïndiceerd.


      2 Personen, bedoeld in het eerste lid, die tot de doelgroep behoren, worden door het gemeentebestuur waar
      zij woonachtig zijn op de wachtlijst geplaatst op volgorde van de datum waarop zij waren toegelaten tot de
      personenkring van de Wet Sociale Werkvoorziening, zoals die wet luidde tot de datum van inwerkingtreding van de
      wet.
    url: https://wetten.overheid.nl/BWBR0008954/2004-01-01#Artikel11
  - number: '12'
    text: |-
      1 In afwijking van [artikel 7, zesde lid][ref1], wordt een persoon die op de dag voorafgaand aan de
      inwerkingtreding van de wet op de wachtlijst staat, bedoeld in artikel 1, onder *b*, van het Besluit informatie
      sociale werkvoorziening, zoals dit besluit luidde tot die datum, op zijn verzoek, door het gemeentebestuur
      wederom op de wachtlijst geplaatst op de volgorde van de datum waarop hij tot de personenkring van de Wet Sociale
      Werkvoorziening was toegelaten indien hij vanaf de wachtlijst arbeid gaat verrichten buiten het kader van de wet en
      vervolgens binnen drie jaar onvrijwillig werkloos wordt.

      2 In afwijking van [artikel 7, zevende lid][ref2], wordt een persoon die op de dag voorafgaand aan de
      inwerkingtreding van de wet werkzaam was met toepassing van de artikelen 11 en 12 van de Regeling samenloop
      arbeidsongeschikheidsuitkering met inkomsten uit arbeid en de Regeling vergoeding persoonlijke ondersteuning
      gehandicapte werknemers, zoals deze regelingen luidde tot die datum en die na die datum deze arbeidsovereenkomst
      heeft voortgezet, op zijn verzoek, door het gemeentebestuur op de wachtlijst geplaatst op de volgorde van de datum
      waarop hij tot genoemde regelingen was toegelaten en krijgt hij bij voorrang een arbeidsovereenkomst aangeboden,
      indien hij onvrijwillig werkloos wordt.

      3 In afwijking van [artikel 7, achtste lid][ref3], wordt een persoon die op de dag voorafgaand aan de
      inwerkingtreding van de wet een dienstbetrekking heeft krachtens de Wet Sociale Werkvoorziening zoals die luidde
      tot die datum en die na die datum deze dienstbetrekking heeft voortgezet, op zijn verzoek, door het gemeentebestuur
      wederom op de wachtlijst geplaatst op de volgorde van de datum waarop hij tot de personenkring van de Wet
      Sociale Werkvoorziening was toegelaten en krijgt hij bij voorrang een dienstbetrekking aangeboden, indien hij in
      aansluiting op zijn dienstbetrekking arbeid gaat verrichten buiten het kader van de wet en vervolgens binnen drie
      jaar onvrijwillig werkloos wordt. Daarbij wordt zijn nieuwe dienstbetrekking aangemerkt als een voortzetting van
      zijn eerdere dienstbetrekking in de zin van de wet.


