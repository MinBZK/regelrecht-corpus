  - number: '6'
    text: |-
      1 Bij de indicatie deelt het gemeentebestuur de betrokkene in een arbeidshandicapcategorie in, op grond van de
      noodzakelijke voorzieningen of maatregelen en van het prestatieniveau volgens de beslistabel van [bijlage II][ref1]
      behorend bij dit besluit.

      2 Bij de noodzakelijke voorzieningen of maatregelen wordt onderscheid gemaakt tussen verstrekkende voorzieningen en
      maatregelen en niet verstrekkende voorzieningen en maatregelen.

      3 Niet verstrekkende voorzieningen en maatregelen zijn:

      a. algemene voorzieningen voor gehandicapten betreffende toegankelijkheid, gebruik en veiligheid;

      b. eenmalige individuele aanpassingen in de werkplek en werkomgeving, voorzover de eenmalige kosten ervan niet de
      helft van het maximale subsidiebedrag per arbeidsplaats van 36 uur te boven gaan;

      c. individuele voorzieningen met structurele kosten, voorzover die kosten ervan niet een achtste van het maximale
      subsidiebedrag per arbeidsplaats van 36 uur te boven gaan;

      d. organisatorische aanpassingen aan functies die, na aanpassing, gewaardeerd worden op of boven een bij
      ministeriële regeling vastgesteld functieniveau.

      4 Verstrekkende voorzieningen of maatregelen zijn:

      a. combinaties van twee of meer van de niet verstrekkende voorzieningen en maatregelen;

      b. eenmalige individuele aanpassingen in de werkplek en de werkomgeving, voorzover deze de helft van het maximale
      subsidiebedrag te boven gaan;

      c. individuele voorzieningen met structurele kosten, voorzover die kosten een achtste van het maximale
      subsidiebedrag per arbeidsplaats van 36 uur te boven gaan;

      d. organisatorische aanpassingen die inherent zijn aan alle functies die gewaardeerd worden beneden het niveau
      vastgesteld op basis van het derde lid, onder *d*;

      e. speciale werkbegeleiding, waarbij speciale kennis en vaardigheden van de leidinggevende vereist zijn, of waarbij
      de noodzakelijke intensiteit van begeleiding meer dan 50% hoger is dan bij een soortgelijke functie onder normale
      werkomstandigheden het geval zou zijn.

      5 Betrokkene wordt bij het vaststellen van zijn prestatieniveau ingedeeld in één van de volgende categorieën:

      a. een prestatie van 50% of meer van een normale prestatie;

      b. een prestatie van minder dan 50% doch meer dan 10% van een normale prestatie;

      c. een prestatie van minder dan 10% van de normale prestatie.


      [ref1]: https://wetten.overheid.nl/BWBR0008954
