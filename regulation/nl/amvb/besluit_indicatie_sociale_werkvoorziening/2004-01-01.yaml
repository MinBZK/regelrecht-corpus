preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 8 juli 1997, directie Arbeidsmarkt, nr.
    AM/RAW/97/1421;


    Gelet op de artikelen 1, derde lid, 6, tweede lid, onderdeel a, 6, vierde lid, 11, vijfde lid, 12, derde lid, en
    15, derde lid, van de Wet sociale werkvoorziening;


    De Raad van State gehoord (advies van 12 augustus 1997, no. W12.97.0415);


    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid van 1 oktober 1997, directie
    Arbeidsmarkt, nr. AM/RAW/97/1946;


    Hebben goed gevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008954/2004-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. de wet: de [Wet sociale werkvoorziening][ref1];

      b. indicatie: de beschikking, bedoeld in artikel 11, eerste lid, van de wet;

      c. betrokkene: de persoon die voor indicatie is aangemeld dan wel die zich daartoe heeft aangemeld;

      d. sociale werkvoorziening: de arbeidsomgeving waar gewerkt wordt in een dienstbetrekking als bedoeld in artikel 2,
      eerste lid, van de wet;

      e. begeleid werken: de arbeid, bedoeld in hoofdstuk 3 van de wet;

      f. beperkingen van lichamelijke aard: alle beperkingen ten gevolge van stoornissen die niet van verstandelijke
      of psychische aard zijn, zoals gekwalificeerd in de internationale statistische classificatie van ziekten en
      aanverwante gezondheidsproblemen (ICD-10) en de internationale classificatie van stoornissen, beperkingen en
      handicaps (ICIDH) van de Wereld Gezondheidsorganisatie;

      g. beperkingen van verstandelijke aard: beperkingen ten gevolge van stoornissen die in de ICIDH zijn gekwalificeerd
      onder 12 en 13;

      h. beperkingen van psychische aard: beperkingen ten gevolge van stoornissen die in de ICIDH zijn gekwalificeerd
      onder 15 tot en met 19 en 23 tot en met 29;

      i. voorzieningen of maatregelen: voorzieningen of maatregelen met behulp waarvan door betrokkene arbeid kan worden
      verricht, die betrekking hebben op:

      1°. technische aanpassingen in de werkplek en werkomgeving;

      2°. organisatorische aanpassingen in het werk;

      3°. speciale begeleiding bij het werk;

      4°. aanpassing van de werktijd;

      5°. aanpassing van het werktempo.


      [ref1]: https://wetten.overheid.nl/BWBR0008903
    url: https://wetten.overheid.nl/BWBR0008954/2004-01-01#Artikel1
    references:
