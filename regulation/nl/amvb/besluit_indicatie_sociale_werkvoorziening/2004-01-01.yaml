  - number: '7'
    text: |-
      1 Het gemeentebestuur beheert een wachtlijst.

      2 Plaatsing op de wachtlijst geschiedt op volgorde van de datum van aanvraag tot indicatie.

      3 Bij de plaatsing op de wachtlijst worden ten minste de volgende gegevens van betrokkene vermeld:

      a. naam, adres, postcode en woonplaats;

      b. geboortedatum;

      c. geslacht;

      d. sofinummer;

      e. de datum van aanvraag en beschikking tot indicatie;

      f. de indeling in arbeidshandicapcategorie, onderscheiden naar indicaties voor de sociale werkvoorziening, begeleid
      werken en scholing, en

      g. het intakeprofiel, bedoeld in [artikel 3, derde lid][ref1].

      4 Betrokkene wordt van de wachtlijst gehaald met ingang van dag waarop hij:

      a. daartoe een schriftelijk verzoek indient bij het gemeentebestuur;

      b. een dienstbetrekking of arbeidsovereenkomst als bedoeld in de hoofdstukken 2 en 3 van de wet aanvaardt;

      c. andere arbeid dan bedoeld onder *b* aanvaardt, tenzij:

      1°. deze arbeid ook bijkomend zou worden verricht, indien betrokkene een dienstbetrekking of arbeidsovereenkomst
      als bedoeld in de hoofdstukken 2 en 3 van de wet, zou zijn aangegaan, of

      2°. deze arbeid wordt verricht in het kader van
      [artikel 7, eerste lid, onderdeel a, van de Wet werk en bijstand][ref2];

      d. wordt geïndiceerd voor dagopvang;

      e. na een herindicatie, bedoeld in [artikel 8][ref3], niet langer tot de doelgroep behoort;

      f. zich blijvend in een andere gemeente vestigt;

      g. de leeftijd van 65 jaar bereikt;

      h. overlijdt.

      5 Indien betrokkene die is geïndiceerd zich blijvend in een andere gemeente vestigt, worden zijn gegevens door
      de gemeente waar hij gevestigd was overgedragen aan de gemeente waar hij zich gevestigd heeft. De gemeente waar
      betrokkene zich gevestigd heeft plaatst betrokkene op de wachtlijst overeenkomstig het tweede lid.

      6 Een persoon die vanaf de wachtlijst arbeid gaat verrichten buiten het kader van de wet en vervolgens binnen drie
      jaar onvrijwillig werkloos wordt, wordt op zijn verzoek en indien hij tot de doelgroep behoort, door de gemeente op
      de oorspronkelijke datum van aanvraag tot indicatie op de wachtlijst geplaatst.

      7 Een persoon die begeleid werkt en vervolgens onvrijwillig werkloos wordt, wordt op zijn verzoek en indien hij
      tot de doelgroep behoort, door de gemeente op de oorspronkelijke datum van aanvraag tot indicatie op de wachtlijst
      geplaatst en bij voorrang een arbeidsovereenkomst aangeboden.

      8 Een persoon die in aansluiting op een dienstbetrekking of arbeidsovereenkomst als bedoeld in de wet arbeid gaat
      verrichten buiten het kader van de wet en vervolgens binnen drie jaar onvrijwillig werkloos wordt, wordt op zijn
      verzoek en indien hij tot de doelgroep behoort, door de gemeente op de oorspronkelijke datum van aanvraag tot
      indicatie op de wachtlijst geplaatst en bij voorrang een dienstbetrekking of een arbeidsovereenkomst aangeboden.

      9 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot personen die na een herindicatie niet
      langer tot de doelgroep behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0008954#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0008954#Artikel8
