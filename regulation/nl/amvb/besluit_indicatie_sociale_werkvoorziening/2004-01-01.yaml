  - number: '8'
    text: |-
      1 Telkens uiterlijk twee maanden voor het verstrijken van de geldigheidsduur van een indicatie wordt door het
      gemeentebestuur een advies ten behoeve van een herindicatie aangevraagd bij de commissie.

      2 Onverminderd het eerste lid, kan een aanvraag tot herindicatie op gemotiveerd verzoek van of namens
      betrokkene op een eerder tijdstip dan bedoeld in het eerste lid, bij het gemeentebestuur plaatsvinden.
      [Artikel 2, vijfde lid][ref1], is daarbij van overeenkomstige toepassing.

      3 De [artikelen 2, tweede en vierde lid][ref2], en [3][ref3] tot en met [7][ref4] van dit besluit zijn op een
      aanvraag tot herindicatie van overeenkomstige toepassing, met dien verstande dat zo nodig de geldigheidsduur van de
      indicatie, bedoeld in [artikel 5, derde lid, onder h][ref5], met maximaal 2 maanden wordt verlengd.

      4 De commissie betrekt, met inachtneming van het besluit bedoeld in [artikel 10][ref6], bij haar advies over de
      herindicatie de wijze van functioneren van betrokkene in de sociale werkvoorziening.

      5 Door of namens een werknemer die de dag voorafgaande aan de datum waarop de wet in werking treedt een
      dienstbetrekking is aangegaan met een gemeente op basis van de Wet Sociale Werkvoorziening, zoals deze luidde
      tot de datum van inwerkingtreding van de wet, kan bij het gemeentebestuur een aanvraag tot herindicatie worden
      ingediend indien die werknemer in aanmerking wenst te komen voor een arbeidsovereenkomst als bedoeld in hoofdstuk
      3 van de wet. Bij deze herindicatie wordt uitsluitend beoordeeld of betrokkene tot dergelijke arbeid in staat wordt
      geacht.

      6 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de uitvoering van dit artikel.


