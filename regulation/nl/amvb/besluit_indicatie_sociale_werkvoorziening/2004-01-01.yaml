  - number: '4'
    text: >-
      1 De commissie adviseert het gemeentebestuur over de aanvraag tot indicatie. Het advies bevat naast
      persoonsgegevens van betrokkene in ieder geval het schriftelijk rapport van het onderzoek.


      2 De commissie adviseert het gemeentebestuur binnen zes weken nadat zij de aanvraag tot indicatie van het
      gemeentebestuur heeft ontvangen, tenzij de commissie nader onderzoek wil verrichten. In dat geval adviseert de
      commissie binnen zes weken na ontvangst van de bevindingen van het nader onderzoek, doch in ieder geval binnen 16
      weken nadat zij de aanvraag tot indicatie van het gemeentebestuur heeft ontvangen.


      3 Bij ministeriële regeling worden regels gesteld met betrekking tot de wijze waarop de commissie haar standpunt
      bepaalt.
    url: https://wetten.overheid.nl/BWBR0008954/2004-01-01#Artikel4
  - number: '5'
    text: |-
      1 Het gemeentebestuur stelt de indicatie vast binnen vier weken na ontvangst van het advies van de commissie.

      2 Het gemeentebestuur kan uitsluitend aan een gemeenteambtenaar mandaat verlenen tot het nemen van een besluit als
      bedoeld in het eerste lid.

      3 De indicatie bevat:

      a. het advies van de commissie, bedoeld in [artikel 4, eerste lid][ref1];

      b. de vermelding of betrokkene tot de doelgroep behoort;

      c. de eventuele voorzieningen of maatregelen die in eerste aanleg noodzakelijk worden bevonden;

      d. de arbeidshandicapcategorie waarin betrokkene, conform [artikel 6][ref2], is ingedeeld;

      e. de vermelding of betrokkene in staat wordt geacht tot begeleid werken;

      f. de vermelding of betrokkene in staat wordt geacht deel te nemen aan een scholingstraject en van het daarbij
      voorgestelde scholings- en trainingsniveau;

      g. het intakeprofiel, bedoeld in [artikel 3, derde lid][ref3];

      h. de geldigheidsduur van de indicatie.

      4 De indicatie wordt zo spoedig mogelijk na vaststelling toegezonden aan de aanvrager en de in artikel 2, derde
      lid, van de wet bedoelde rechtspersoon.

      5 Bij ministeriële regeling worden regels gesteld met betrekking tot de geldigheidsduur van de indicatie.


      [ref1]: https://wetten.overheid.nl/BWBR0008954#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008954#Artikel6
