preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 18 juni 2004, nr. HDJZ/AWW/2004-1508,
    Hoofddirectie Juridische Zaken;

    Gelet op richtlijn nr. 2003/102/EG van het Europees Parlement en de Raad van 17 november 2003 betreffende de
    bescherming van voetgangers en andere kwetsbare weggebruikers voor en bij een botsing met een motorvoertuig en
    houdende wijziging van Richtlijn 70/156/EEG van de Raad (PbEG L 321) en de artikelen 22, eerste lid, 34, eerste lid
    en 71 van de Wegenverkeerswet 1994;

    De Raad van State gehoord (advies van 1 juli 2004, nr. W09.04.0259/V);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 14 juli 2004, nr. HDJZ/AWW/2004-1705,
    Hoofddirectie Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0017060/2004-08-20#ArtikelAanhef
articles:
  - number: II
    text: |-
      Op verzoek van de fabrikant wordt tot 1 oktober 2005 voor personenauto’s met een toegestane maximum massa van niet
      meer dan 2500 kg en bedrijfsauto’s die van een personenauto zijn afgeleid, met een toegestane maximummassa van
      niet meer dan 2500 kg, een typegoedkeuring verleend als bedoeld in artikel 2, eerste lid, van [richtlijn 2003/102/
      EG](32003L0102).
    url: https://wetten.overheid.nl/BWBR0017060/2004-08-20#ArtikelII
  - number: III
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0017060/2004-08-20#ArtikelIII
