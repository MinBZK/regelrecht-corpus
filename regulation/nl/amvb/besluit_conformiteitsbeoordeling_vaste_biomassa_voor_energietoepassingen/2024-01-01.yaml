  - number: 1a
    text: |-
      Dit besluit berust mede op [artikel 18.6, eerste lid, van de Omgevingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel18
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '18'
  - number: '2.1'
    text: |-
      Onze Minister voor Klimaat en Energie kan op aanvraag erkenning verlenen aan een
      conformiteitsbeoordelingsinstantie.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel2
  - number: '2.2'
    text: Onze Minister voor Klimaat en Energie beslist binnen 13 weken na de datum van ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel2
  - number: '2.3'
    text: |-
      De erkenning vermeldt ten minste de naam, adres en de vestigingsplaats van de conformiteitsbeoordelingsinstantie
      en de werkzaamheid die deze gerechtigd is uit te voeren, alsmede een specificatie van de categorie vaste biomassa
      waarvoor en de goedgekeurde certificatieschema’s of het verificatieprotocol volgens welke de werkzaamheid mag
      worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel2
  - number: '2.4'
    text: |-
      Onverminderd [artikel 3][ref1] wordt een erkenning voor een werkzaamheid gebaseerd op een accreditatie
      of een bewijsstuk waaruit ten genoegen van Onze Minister voor Klimaat en Energie blijkt dat de
      conformiteitsbeoordelingsinstantie in staat is bij de in de aanvraag aangegeven werkzaamheden te voldoen aan de bij
      of krachtens dit besluit gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0040209#Artikel3
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0040209
        artikel: '3'
        hoofdstuk: '2'
  - number: '2.5'
    text: Een erkenning wordt voor onbepaalde tijd verleend.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel2
  - number: '2.6'
    text: Een erkenning is niet overdraagbaar.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel2
  - number: '2.7'
    text: De erkenning wordt in de Staatscourant gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel2
  - number: '2.8'
    text: |-
      Onze Minister voor Klimaat en Energie houdt een actuele lijst bij van erkende conformiteitsbeoordelingsinstanties
      alsmede de werkzaamheden die deze mogen uitvoeren, onder specificatie van de categorie vaste biomassa waarvoor en
      de certificatieschema’s of het verificatieprotocol volgens welke de werkzaamheid wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel2
  - number: '2.9'
    text: Onze Minister voor Klimaat en Energie maakt de lijst op een door hem aan te wijzen website bekend.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel2
  - number: '3.1'
    text: |-
      Met een accreditatie als bedoeld bij of krachtens dit besluit wordt gelijkgesteld een accreditatie die is afgegeven
      door een instelling in een staat, niet zijnde een lidstaat van de Europese Unie of een staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte, die partij is bij een daartoe strekkend of mede daartoe
      strekkend verdrag dat Nederland bindt, op basis van onderzoekingen of documenten die een beschermingsniveau
      bieden dat naar het oordeel van Onze Minister voor Klimaat en Energie ten minste gelijkwaardig is aan het
      beschermingsniveau dat met de nationale accreditatie wordt geboden.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel3
  - number: '3.2'
    text: |-
      Met een accreditatie als bedoeld bij of krachtens dit besluit wordt gelijkgesteld een accreditatie die is afgegeven
      door een instelling die is aangesloten bij het International Accreditation Forum of de International Laboratory
      Accreditation Cooperation op basis van onderzoekingen of documenten die een beschermingsniveau bieden dat naar het
      oordeel van Onze Minister voor Klimaat en Energie ten minste gelijkwaardig is aan het beschermingsniveau dat met de
      nationale accreditatie wordt geboden.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel3
  - number: '3.3'
    text: |-
      Met een erkenning wordt gelijkgesteld een erkenning of een vergelijkbare beschikking afgegeven door een daartoe
      bevoegde instantie in een andere lidstaat van de Europese Unie dan wel in een staat, niet zijnde een lidstaat van
      de Europese Unie, die partij is bij een daartoe strekkend of mede daartoe strekkend verdrag dat Nederland bindt,
      op basis van voorwaarden die een beschermingsniveau bieden dat naar het oordeel van Onze Minister voor Klimaat en
      Energie ten minste gelijkwaardig is aan het beschermingsniveau dat bij of krachtens dit besluit wordt geboden.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel3
  - number: '3.4'
    text: |-
      [Artikel 2, achtste lid][ref1], is van overeenkomstige toepassing op de erkenning, bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0040209#Artikel2
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0040209
        artikel: '2'
        hoofdstuk: '2'
  - number: '4.1'
    text: |-
      Een aanvraag om erkenning wordt ingediend bij Onze Minister voor Klimaat en Energie met gebruikmaking van een door
      hem vastgesteld middel.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel4
  - number: '4.2'
    text: 'Bij de aanvraag worden ten minste de volgende gegevens verstrekt:'
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel4
  - number: 4.2.a
    text: de naam, het adres en de vestigingsplaats van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel4
  - number: 4.2.b
    text: |-
      de werkzaamheid waarop de aanvraag betrekking heeft, onder specificatie van de categorie vaste biomassa waarvoor en
      een of meer goedgekeurde certificatieschema’s of het verificatieprotocol volgens welke de aanvrager de werkzaamheid
      beoogt uit te voeren;
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel4
  - number: 4.2.c
    text: |-
      een accreditatie of een ander bewijsstuk waaruit ten genoegen van Onze Minister voor Klimaat en Energie blijkt dat
      de conformiteitsbeoordelingsinstantie in staat is bij het uitvoeren van de in de aanvraag aangegeven werkzaamheden
      te voldoen aan de bij of krachtens dit besluit gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel4
  - number: '5.1'
    text: |-
      Een erkenning wordt in ieder geval geweigerd indien de aanvrager in staat van faillissement verkeert of surseance
      van betaling heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel5
  - number: '5.2'
    text: |-
      Een erkenning kan geheel of gedeeltelijk worden geweigerd, indien de aanvrager of een bestuurder daarvan in de drie
      jaren voorafgaande aan de aanvraag [artikel 225 van het Wetboek van Strafrecht][ref1] heeft overtreden, voor zover
      de overtreding verband houdt met een werkzaamheid waarop de aanvraag betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel225
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '225'
  - number: '5.3'
    text: |-
      Indien er aanwijzingen zijn dat sprake is van een overtreding als bedoeld in het tweede lid, kan Onze Minister
      voor Klimaat en Energie de aanvrager verzoeken binnen een redelijke termijn een verklaring omtrent het gedrag
      als bedoeld in [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1], die niet ouder is dan twee
      maanden, te overleggen. Indien de aanvrager niet binnen de gestelde termijn aan dit verzoek voldoet, kan Onze
      Minister voor Klimaat en Energie de erkenning weigeren.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
  - number: '5.4'
    text: |-
      Een erkenning kan tevens worden geweigerd in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: '5.5'
    text: |-
      Voordat toepassing wordt gegeven aan het vierde lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: '6.1'
    text: Op verzoek van een erkende conformiteitsbeoordelingsinstantie kan de erkenning worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel6
  - number: '6.2'
    text: |-
      Een verzoek wordt in ieder geval ingediend indien de conformiteitsbeoordelingsinstantie erkend wil worden voor het
      verificatieprotocol of een of meer goedgekeurde certificatieschema’s waarop de erkenning geen betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel6
  - number: '6.3'
    text: |-
      Een verzoek tot wijziging wordt ingediend bij Onze Minister voor Klimaat en Energie met gebruikmaking van het
      middel, bedoeld in [artikel 4, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040209#Artikel4
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0040209
        artikel: '4'
        hoofdstuk: '2'
  - number: '6.4'
    text: |-
      Op het verzoek zijn de [artikelen 2, tweede lid][ref1], en [4, tweede lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0040209#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0040209#Artikel4
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0040209
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0040209
        artikel: '4'
        hoofdstuk: '2'
  - number: '7.1'
    text: |-
      Onze Minister voor Klimaat en Energie kan een erkenning voor een periode van ten hoogste vijf maanden, geheel of
      gedeeltelijk schorsen, indien:
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel7
  - number: 7.1.a
    text: |-
      het ingediende bewijsstuk, bedoeld in artikel 4, tweede lid, onderdeel c, niet meer bewijst dat de erkende
      conformiteitsbeoordelingsinstantie aan de bij of krachtens dit besluit gestelde eisen voldoet, totdat een nieuw
      bewijsstuk is verstrekt;
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel7
  - number: 7.1.b
    text: de erkende conformiteitsbeoordelingsinstantie niet meewerkt aan het houden van toezicht;
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel7
  - number: 7.1.c
    text: |-
      er naar aanleiding van het houden van toezicht geen gerechtvaardigd vertrouwen meer bestaat dat de erkende
      conformiteitsbeoordelingsinstantie aan de bij of krachtens dit besluit gestelde eisen voldoet.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel7
  - number: '7.2'
    text: 'Onze Minister voor Klimaat en Energie trekt de erkenning geheel of gedeeltelijk in, indien:'
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel7
  - number: 7.2.a
    text: |-
      bij de aanvraag onjuiste of onvolledige gegevens zijn verstrekt en kennis omtrent de juiste en volledige gegevens
      op het tijdstip van de verlening van de erkenning tot een andere beslissing zou hebben geleid;
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel7
  - number: 7.2.b
    text: |-
      de conformiteitsbeoordelingsinstantie bij de aanvraag om erkenning een accreditatie als bedoeld in
      [artikel 4, tweede lid, onderdeel c][ref1], heeft verstrekt en deze accreditatie is vervallen;


      [ref1]: https://wetten.overheid.nl/BWBR0040209#Artikel4
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0040209
        artikel: '4'
        hoofdstuk: '2'
  - number: 7.2.c
    text: |-
      de erkende conformiteitsbeoordelingsinstantie binnen acht weken na daartoe in de gelegenheid te zijn gesteld, geen
      nieuw bewijsstuk als bedoeld in het eerste lid heeft ingediend;
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel7
  - number: 7.2.d
    text: |-
      de erkende conformiteitsbeoordelingsinstantie in staat van faillissement verkeert of surseance van betaling heeft
      verkregen.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel7
  - number: '7.3'
    text: 'Onze Minister voor Klimaat en Energie kan een erkenning geheel of gedeeltelijk intrekken:'
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel7
  - number: 7.3.a
    text: op verzoek van de erkende conformiteitsbeoordelingsinstantie;
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel7
  - number: 7.3.b
    text: |-
      indien er aanwijzingen zijn dat sprake is van een overtreding van dit besluit dan wel van een overtreding als
      bedoeld in [artikel 5, tweede lid][ref1], en de conformiteitsbeoordelingsinstantie niet voldoet aan het verzoek van
      Onze Minister voor Klimaat en Energie om binnen een redelijke termijn een verklaring omtrent het gedrag als bedoeld
      in [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref2], die niet ouder is dan twee maanden,
      te overleggen;


      [ref1]: https://wetten.overheid.nl/BWBR0040209#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0040209
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '28'
  - number: 7.3.c
    text: |-
      in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].
      [Artikel 5, vijfde lid][ref2], is van overeenkomstige toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0040209#Artikel5
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0040209
        artikel: '5'
        hoofdstuk: '2'
  - number: 7.3.d
    text: |-
      indien de schorsing, bedoeld in het eerste lid, onderdelen b en c, niet heeft geleid tot hetgeen daarmee werd
      beoogd, dan wel er aanwijzingen zijn dat hetgeen met de schorsing werd beoogd niet binnen een redelijke termijn zal
      zijn gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel7
  - number: '7.4'
    text: |-
      De gedurende de schorsing of na de intrekking van een erkenning door de conformiteitsbeoordelingsinstantie
      afgegeven verklaringen worden niet langer als conformiteitsbeoordelingsverklaringen aangemerkt.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel7
  - number: '7.5'
    text: |-
      Indien Onze Minister voor Klimaat en Energie kan aantonen dat de voorafgaand aan de schorsing of intrekking
      afgegeven conformiteitsbeoordelingsverklaringen onterecht zijn afgegeven, worden die verklaringen niet langer
      aangemerkt als conformiteitsbeoordelingsverklaringen.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel7
  - number: '7.6'
    text: |-
      Onze Minister voor Klimaat en Energie verwerkt de schorsing en intrekking van erkenningen in de lijst, bedoeld in
      [artikel 2, achtste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040209#Artikel2
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0040209
        artikel: '2'
        hoofdstuk: '2'
  - number: '8.1'
    text: 'Een erkende conformiteitsbeoordelingsinstantie doet aan Onze Minister voor Klimaat en Energie onverwijld melding:'
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel8
  - number: 8.1.a
    text: van een door de rechtbank uitgesproken faillissement of surseance van betaling;
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel8
  - number: 8.1.b
    text: van een geschorste of vervallen accreditatie voor een werkzaamheid waarvoor een erkenning is afgegeven;
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel8
  - number: 8.1.c
    text: |-
      indien het ingediende bewijsstuk, bedoeld in [artikel 4, tweede lid, onderdeel c][ref1], voor een werkzaamheid
      waarvoor een erkenning is afgegeven, niet meer kan dienen als bewijs voor het gerechtvaardigde vertrouwen op grond
      waarvan de erkenning is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0040209#Artikel4
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0040209
        artikel: '4'
        hoofdstuk: '2'
  - number: '8.2'
    text: |-
      Een melding wordt ingediend bij Onze Minister voor Klimaat en Energie met gebruikmaking van het middel dat door hem
      beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel8
  - number: '9'
    text: Het is verboden een werkzaamheid uit te voeren in strijd met of zonder een daartoe verleende erkenning.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel9
  - number: '10.1'
    text: 'Onze Minister voor Klimaat en Energie kan op aanvraag van een schemabeheerder goedkeuring verlenen aan:'
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel10
  - number: 10.1.a
    text: een certificatieschema of een deel daarvan, of
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel10
  - number: 10.1.b
    text: een nieuwe versie van een certificatieschema of deel daarvan, of
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel10
  - number: 10.1.c
    text: een nieuwe versie van het deel van een certificatieschema waarvoor goedkeuring is verleend.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel10
  - number: '10.2'
    text: |-
      Onze Minister voor Klimaat en Energie verleent goedkeuring aan een certificatieschema dan wel dat deel ervan dat
      voldoet aan de beheerseisen en aan de duurzaamheidseisen waarvoor goedkeuring is aangevraagd.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel10
  - number: '10.3'
    text: |-
      Onze Minister voor Klimaat en Energie kan zich ten behoeve van de toepassing van het eerste lid laten adviseren
      door een daartoe door hem ingestelde adviescommissie.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel10
  - number: '10.4'
    text: |-
      Onze Minister voor Klimaat en Energie beslist binnen 35 weken na ontvangst van een aanvraag als bedoeld in het
      eerste lid, indien de adviescommissie om advies is gevraagd en binnen 13 weken indien de adviescommissie niet om
      advies is gevraagd.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel10
  - number: '10.5'
    text: De goedkeuring wordt in de Staatscourant gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel10
  - number: '10.6'
    text: |-
      Onze Minister voor Klimaat en Energie houdt een actuele lijst bij met goedgekeurde certificatieschema’s, onder
      specificatie van de categorie vaste biomassa en de duurzaamheidseisen waarop de goedkeuring betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel10
  - number: '10.7'
    text: Onze Minister voor Klimaat en Energie maakt de lijst op een door hem aan te wijzen website bekend.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel10
  - number: '11.1'
    text: |-
      Met een certificatieschema als bedoeld bij of krachtens dit besluit wordt gelijkgesteld een document dat is
      vastgesteld in een andere lidstaat van de Europese Unie dan wel in een staat, niet zijnde een lidstaat van de
      Europese Unie, die partij is bij een daartoe strekkend of mede daartoe strekkend verdrag dat Nederland bindt,
      en een beschermingsniveau biedt dat naar het oordeel van Onze Minister voor Klimaat en Energie ten minste
      gelijkwaardig is aan het beschermingsniveau dat met het certificatieschema wordt geboden.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel11
  - number: '11.2'
    text: |-
      [Artikel 10, zesde lid][ref1], is van overeenkomstige toepassing op het document, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0040209#Artikel10
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0040209
        artikel: '10'
        hoofdstuk: '3'
  - number: '12.1'
    text: |-
      Een aanvraag om goedkeuring van een certificatieschema als bedoeld in [artikel 10, eerste lid][ref1], wordt door de
      schemabeheerder ingediend bij Onze Minister voor Klimaat en Energie met gebruikmaking van een door hem vastgesteld
      middel.


      [ref1]: https://wetten.overheid.nl/BWBR0040209#Artikel10
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0040209
        artikel: '10'
        hoofdstuk: '3'
  - number: '12.2'
    text: 'Bij de aanvraag worden ten minste de volgende gegevens verstrekt:'
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel12
  - number: 12.2.a
    text: de naam, het adres en de vestigingsplaats van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel12
  - number: 12.2.b
    text: |-
      het certificatieschema of het deel daarvan waarop de aanvraag betrekking heeft, onder specificatie van de categorie
      vaste biomassa en de duurzaamheidseisen waarvoor de goedkeuring wordt aangevraagd;
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel12
  - number: 12.2.c
    text: |-
      stukken waaruit blijkt dat het certificatieschema of het deel daarvan waarop de aanvraag betrekking heeft, voldoet
      aan de beheerseisen en de duurzaamheidseisen waarvoor de goedkeuring wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel12
  - number: '12.3'
    text: |-
      Onverminderd het tweede lid, wordt een aanvraag als bedoeld in
      [artikel 10, eerste lid, aanhef en onderdelen b en c][ref1], uitsluitend in behandeling genomen indien duidelijk
      is wat de wijzigingen zijn in de versie waarvoor de goedkeuring wordt aangevraagd ten opzichte van de daaraan
      voorafgaande versie.


      [ref1]: https://wetten.overheid.nl/BWBR0040209#Artikel10
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0040209
        artikel: '10'
        hoofdstuk: '3'
  - number: '12.4'
    text: |-
      Onze Minister voor Klimaat en Energie kan nadere regels stellen met betrekking tot de gegevens, bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel12
  - number: '13.1'
    text: |-
      Onze Ministers wijzen bij regeling het verificatieprotocol aan dat bij verificatie wordt toegepast, onder
      specificatie van de categorie vaste biomassa en de duurzaamheidseisen.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel13
  - number: '13.2'
    text: Onze Minister voor Klimaat en Energie maakt het verificatieprotocol op een door hem aan te wijzen website bekend.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel13
  - number: '14.1'
    text: |-
      Met een verificatieprotocol wordt gelijkgesteld een document dat is vastgesteld in een andere lidstaat van de
      Europese Unie dan wel in een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een daartoe
      strekkend of mede daartoe strekkend verdrag dat Nederland bindt, en een beschermingsniveau biedt dat naar het
      oordeel van Onze Minister voor Klimaat en Energie ten minste gelijkwaardig is aan het beschermingsniveau dat met
      het verificatieprotocol wordt geboden.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel14
  - number: '14.2'
    text: |-
      Onze Minister voor Klimaat en Energie houdt een actuele lijst bij met gelijkgestelde documenten als bedoeld in het
      eerste lid, onder specificatie van de categorie vaste biomassa en de duurzaamheidseisen waarop het gelijkgestelde
      document betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel14
  - number: '15'
    text: |-
      Het is verboden een werkzaamheid uit te voeren in strijd met of zonder toepassing van een goedgekeurd
      certificatieschema of het verificatieprotocol.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel15
  - number: '16.1'
    text: |-
      Onze Ministers stellen bij regeling duurzaamheidseisen voor categorieën vaste biomassa vast die de schemabeheerder
      in acht neemt bij het opstellen of wijzigen van het certificatieschema en die zien op:
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel16
  - number: 16.1.a
    text: broeikasgasemissie;
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel16
  - number: 16.1.b
    text: reststromen uit natuur- en landschapsbeheer en agrarische reststromen;
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel16
  - number: 16.1.c
    text: koolstof en verandering in landgebruik;
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel16
  - number: 16.1.d
    text: duurzaam bosbeheer;
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel16
  - number: 16.1.e
    text: het handelsketensysteem.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel16
  - number: '16.2'
    text: De categorieën vaste biomassa zien in ieder geval op houtachtige biomassa uit bosbeheereenheden en op reststromen.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel16
  - number: '16.3'
    text: |-
      Onze Ministers stellen bij regeling de beheerseisen vast die de schemabeheerder in acht neemt bij het opstellen of
      wijzigen van een certificatieschema en die in ieder geval zien op:
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel16
  - number: 16.3.a
    text: de wijze van totstandkoming en de toegankelijkheid van het certificatieschema;
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel16
  - number: 16.3.b
    text: bevoegdheden en verplichtingen van de schemabeheerder.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel16
  - number: '17'
    text: |-
      Een erkende conformiteitsbeoordelingsinstantie toetst bij het uitvoeren van certificatie of verificatie
      aan een certificatieschema of het deel daarvan waaraan goedkeuring is verleend onderscheidenlijk aan het
      verificatieprotocol.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel17
  - number: '18.1'
    text: |-
      Een erkende conformiteitsbeoordelingsinstantie doet aan Onze Minister voor Klimaat en Energie onverwijld melding
      van de intrekking van een ten onrechte afgegeven conformiteitsbeoordelingsverklaring.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel18
  - number: '18.2'
    text: |-
      Onze Minister voor Klimaat en Energie merkt een door een erkende conformiteitsbeoordelingsinstantie afgegeven
      verklaring niet langer aan als conformiteitsbeoordelingsverklaring, indien geen gerechtvaardigd vertrouwen
      bestaat dat de hierin gespecificeerde categorie vaste biomassa is geproduceerd op een wijze die voldoet aan een de
      duurzaamheidseisen waarop de beoordeling betrekking heeft en die in de verklaring zijn gespecificeerd.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel18
  - number: '19'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens dit besluit zijn de bij regeling van Onze
      Ministers aangewezen ambtenaren belast.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel19
  - number: '20.1'
    text: |-
      Een conformiteitsbeoordelingsinstantie die binnen een door Onze Minister voor Klimaat en Energie bepaalde
      redelijke termijn van ten minste een maand na het tijdstip van inwerkingtreding van dit besluit een
      aanvraag om erkenning heeft ingediend, wordt met ingang van dat tijdstip aangemerkt als tijdelijk erkende
      conformiteitsbeoordelingsinstantie totdat onherroepelijk op de aanvraag is beslist.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel20
  - number: '20.2'
    text: |-
      Een certificatieschema waarvoor binnen een redelijke termijn als bedoeld in het eerste lid na het tijdstip van
      inwerkingtreding van dit besluit een aanvraag om goedkeuring is ingediend, wordt met ingang van dat tijdstip
      aangemerkt als tijdelijk goedgekeurd certificatieschema totdat onherroepelijk op de aanvraag is beslist.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel20
  - number: '20.3'
    text: |-
      Certificaten en verificatieverklaringen over vaste biomassa van een conformiteitsbeoordelingsinstantie als
      bedoeld in het eerste lid die voor het tijdstip van inwerkingtreding van dit besluit zijn afgegeven op grond
      van een certificatieschema als bedoeld in het tweede lid onderscheidenlijk een verificatieprotocol inzake de
      duurzaamheid van vaste biomassa, dat van toepassing was op het moment van afgifte, worden aangemerkt als tijdelijke
      conformiteitsbeoordelingsverklaringen totdat op de aanvraag om erkenning van die conformiteitsbeoordelingsinstantie
      onherroepelijk is beslist.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel20
  - number: '21'
    text: |-
      Dit besluit treedt in werking met ingang van 1 januari 2018. Indien het Staatsblad waarin dit besluit wordt
      geplaatst, wordt uitgegeven na 31 december 2017, treedt het besluit in werking met ingang van de dag na de datum
      van uitgifte van het Staatsblad waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel21
  - number: '22'
    text: 'Dit besluit wordt aangehaald als: Besluit conformiteitsbeoordeling vaste biomassa voor energietoepassingen.'
    url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#Artikel22
