preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Infrastructuur en Milieu en Onze Minister van Economische Zaken van
    14 juli 2017, nr. IENM/BSK-2017/143466, Hoofddirectie Bestuurlijke en Juridische Zaken;

    Gelet op artikel 11a.2 van de Wet milieubeheer en artikel 5.10, eerste lid, van de Wet algemene bepalingen
    omgevingsrecht;

    De Afdeling advisering van de Raad van State gehoord (advies van 11 oktober 2017, nr. W14. 17.0233/IV);

    Gezien het nader rapport van de Staatssecretaris van Infrastructuur en Milieu en Onze Minister van Economische
    Zaken, van 25 oktober 2017, nr. IENM/BSK-2017/254082, Hoofddirectie Bestuurlijke en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0040209/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *accreditatie:* accreditatie als bedoeld
      in artikel 2, onderdeel 10, juncto artikel 3 van de verordening;
        - *beheerseisen:* eisen vastgesteld op grond van [artikel 16, derde lid][ref1], die een schemabeheerder bij het
      opstellen of wijzigen van een certificatieschema in acht neemt en die betrekking hebben op de wijze waarop een
      schema tot stand komt dan wel wordt gewijzigd;
        - *certificatie:* conformiteitsbeoordeling, uitgevoerd door een conformiteitsbeoordelingsinstantie overeenkomstig
      het toepasselijke certificatieschema, resulterend in een certificaat;
        - *certificatieschema:* document waarin beschreven staat op welke wijze en op grond waarvan de
      conformiteitsbeoordelingsinstantie de certificatie verricht;
        - *conformiteitsbeoordelingsverklaring:* verklaring, afgegeven door een erkende conformiteitsbeoordelingsinstantie,
      dat een gerechtvaardigd vertrouwen bestaat dat de daarin gespecificeerde vaste biomassa is geproduceerd op een
      wijze die voldoet aan de daarop van toepassing zijnde duurzaamheidseisen die in de verklaring zijn gespecificeerd;
        - *duurzaamheidseisen:* eisen voor vaste biomassa ten behoeve van energietoepassingen die zijn vastgesteld
      op grond van [artikel 16, eerste lid][ref2], en die ten grondslag liggen aan het certificatieschema en het
      verificatieprotocol waaraan bij de werkzaamheid wordt getoetst in het belang van de bescherming van het milieu;
        - *erkende conformiteitsbeoordelingsinstantie:* rechtspersoon die door Onze Minister voor Klimaat en Energie
      is erkend voor het uitvoeren van een werkzaamheid en op basis daarvan is gerechtigd tot het afgeven van een
      conformiteitsbeoordelingsverklaring;
        - *erkenning:* beschikking van Onze Minister voor Klimaat en Energie dat een gerechtvaardigd vertrouwen bestaat dat
      de daarin genoemde conformiteitsbeoordelingsinstantie in staat is bij de daarin aangegeven werkzaamheden te voldoen
      aan de bij of krachtens dit besluit gestelde eisen;
        - *goedkeuring:* beschikking van Onze Minister voor Klimaat en Energie waarbij wordt vastgesteld dat het daarin
      genoemde certificatieschema voldoet aan de beheerseisen en duurzaamheidseisen, onder specificatie van de categorie
      vaste biomassa en de duurzaamheidseisen waarop het schema betrekking heeft en bij certificatie gebruikt mag worden;
        - *Onze Ministers:* Onze Minister van Infrastructuur en Milieu en Onze Minister voor Klimaat en Energie;
        - *Raad voor Accreditatie:* Raad voor Accreditatie als bedoeld in
      [artikel 1, onderdeel e, van de Wet aanwijzing nationale accreditatie-instantie][ref3];
        - *schemabeheerder:* rechtspersoon die op grond van eigendom, auteursrecht of overeenkomst, bevoegd is om een
      certificatieschema te beheren;
        - *vaste biomassa:* biologisch afbreekbare fractie van producten, afvalstoffen en residuen van de landbouw, de
      bosbouw, de visserij- en aquacultuursector en aanverwante bedrijfstakken, alsmede de biologisch afbreekbare fractie
      van industrieel en huishoudelijk afval;
        - *verificatie:* conformiteitsbeoordeling, uitgevoerd door een conformiteitsbeoordelingsinstantie overeenkomstig
      het verificatieprotocol, resulterend in een verificatieverklaring;
        - *verificatieprotocol:* normdocument voor verificatie dat op grond van [artikel 13][ref4] is aangewezen, met eisen
      voor de wijze waarop en op grond waarvan een erkende conformiteitsbeoordelingsinstantie de verificatie verricht;
        - *verordening:* verordening (EG) nr. 765/2008 van het Europees Parlement en de Raad van de Europese Unie van
      9 juli 2008 tot vaststelling van de eisen inzake accreditatie en markttoezicht betreffende het verhandelen van
      producten en tot intrekking van Verordening (EG) nr. 339/93 (PbEU 2008, L 218);
        - *werkzaamheid:* certificatie of verificatie.


      [ref1]: https://wetten.overheid.nl/BWBR0040209#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0040209#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0026591#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0040209#Artikel13
