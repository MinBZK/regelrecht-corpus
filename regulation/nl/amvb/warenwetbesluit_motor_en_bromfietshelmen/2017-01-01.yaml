  url: https://wetten.overheid.nl/BWBR0007500/2017-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. helm: motor- en bromfietshelm als bedoeld in artikel 60 van het Reglement verkeersregels en verkeerstekens 1990;

      b. reglement 22: de "Uniform provisions concerning the approval of protective helmets for drivers and passengers of
      motorcycles", behorende bij het op 20 maart 1958 te Genève tot stand gekomen Verdrag betreffende het aannemen van
      eenvormige goedkeuringsvoorwaarden en de wederzijdse erkenning van goedkeuring van uitrustingsstukken en onderdelen
      van motorvoertuigen gesloten (*Trb.* 1959; 83).
    url: https://wetten.overheid.nl/BWBR0007500/2017-01-01#Artikel1
  - number: '2'
    text: |-
      Het is verboden helmen te verhandelen anders dan met inachtneming van de voorschriften bij dit besluit gesteld met
      betrekking tot de aanduiding.
    url: https://wetten.overheid.nl/BWBR0007500/2017-01-01#Artikel2
  - number: '3'
    text: |-
      1 Helmen zijn voorzien van een aanduiding die overeenkomt met de aanduiding die in de bijlage behorende bij dit
      besluit als model is weergegeven.

      2 Helmen zijn uitsluitend van de in het eerste lid genoemde aanduiding voorzien indien deze is aangebracht naar
      aanleiding van goedkeuring van de helmen op grond van de bepalingen van reglement 22.

      3 Het eerste lid is niet van toepassing op helmen die voldoen aan voorschriften of normen die; op aanvraag van de
      belanghebbende, door Onze Minister zijn gelijkgesteld aan het veiligheidsniveau van reglement 22.

      4 Het eerste lid is niet van toepassing op helmen die zijn voorzien van een markering overeenkomstig NTA 8776:2016.
    url: https://wetten.overheid.nl/BWBR0007500/2017-01-01#Artikel3
  - number: '4'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0007500/2017-01-01#Artikel4
  - number: '5'
    text: 'Dit besluit wordt aangehaald als: Warenwetbesluit motor- en bromfietshelmen.'
    url: https://wetten.overheid.nl/BWBR0007500/2017-01-01#Artikel5
