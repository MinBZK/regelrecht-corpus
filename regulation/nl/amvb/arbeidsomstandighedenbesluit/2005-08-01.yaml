  - number: 9.22.5
    text: |-
      Een eis waarop [afdeling 2 van hoofdstuk 2][ref1] van toepassing is, die met een voorschrift dat is verbonden aan
      een op grond van een der wetten tot bescherming van het milieu verleende vergunning tot het oprichten, in werking
      brengen of houden, uitbreiden of wijzigen van een bedrijf of inrichting dan wel tot het veranderen van een daarin
      gebezigde werkwijze één of meer zodanige raakpunten heeft dat hij met dat voorschrift in strijd kan komen, stelt
      de daartoe aangewezen ambtenaar, bedoeld in [artikel 24 van de wet][ref2], niet dan na overleg met het gezag dat de
      vergunning heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.22
