  - number: 1.30.a
    text: tijdens, direct voor en direct na oefeningen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.30
  - number: 1.30.b
    text: |-
      ten aanzien van militaire vaartuigen, militaire luchtvaartuigen, bemande wapensystemen en eenheden met
      gereedstelling:
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.30
  - number: 1.30.b.1°
    text: |-
      voor zover afwijking van deze artikelen, hoofdstukken of afdelingen naar het oordeel van Onze Minister van Defensie
      noodzakelijk is in verband met de bouw, de constructie, de inrichting of de uitrusting van deze vaartuigen en
      wapensystemen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.30
  - number: 1.30.b.2°
    text: |-
      indien oorlogsschepen varen en indien militaire luchtvaartuigen en bemande wapensystemen als zodanig in gebruik
      zijn;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.30
  - number: 1.30.b.3°
    text: |-
      voor zover de operationele taakuitvoering van deze vaartuigen en wapensystemen of van de eenheden met
      gereedstelling naar het oordeel van Onze Minister van Defensie door de toepassing van deze artikelen, hoofdstukken
      of afdelingen wordt belemmerd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.30
  - number: '1.31'
    text: |-
      Voor zover [de wet][ref1] van toepassing is op arbeid verricht door defensiepersoneel is
      [artikel 10 van de wet][ref2] op arbeid verricht door defensiepersoneel:


      [ref1]: https://wetten.overheid.nl/BWBR0010346
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel10
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.31
    references:
      - id: ref1
        bwb_id: BWBR0010346
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '10'
  - number: 1.31.a
    text: dat belast is met enige politietaak of met bewakings- of beveiligingstaken, of
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.31
  - number: 1.31.b
    text: dat wachtdiensten verricht, of
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.31
  - number: 1.31.c
    text: |-
      dat is ingezet ter verlening van de bijstand, bedoeld in [artikel 1.29][ref1], onder *b*, aan de politie, van
      toepassing, voor zover een goede taakuitoefening door de toepassing van genoemd artikel niet wordt belemmerd.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.31
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '7'
  - number: '1.32'
    text: |-
      [Artikel 12 van de wet][ref1] is van toepassing behoudens:


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel12
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.32
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '12'
  - number: 1.32.a
    text: tijdens oefeningen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.32
  - number: 1.32.b
    text: op aangelegenheden die rechtstreeks betrekking hebben op het houden van oefeningen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.32
  - number: 1.32.c
    text: |-
      op aangelegenheden die rechtstreeks betrekking hebben op de arbeid, bedoeld in [artikel 1.29][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.32
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '7'
  - number: 1.33.1
    text: |-
      De [artikelen 27][ref1] en [28 van de wet][ref2] zijn niet van toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel28
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.33
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '28'
  - number: 1.33.1.a
    text: tijdens, direct voor en direct na oefeningen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.33
  - number: 1.33.1.b
    text: op eenheden met gereedstelling.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.33
  - number: 1.33.2
    text: |-
      De [artikelen 27][ref1] en [28 van de wet][ref2] zijn niet van toepassing op militaire vaartuigen, militaire
      luchtvaartuigen en bemande wapensystemen:


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel28
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.33
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '28'
  - number: 1.33.2.a
    text: |-
      indien oorlogsschepen varen en indien militaire luchtvaartuigen en bemande wapensystemen als zodanig in gebruik
      zijn;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.33
  - number: 1.33.2.b
    text: |-
      in de gevallen, bedoeld in [artikel 1.30, onder b, sub 3°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.33
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '7'
  - number: 1.33.3
    text: |-
      De [artikelen 27][ref1] en [28 van de wet][ref2] zijn van toepassing op het personeel van de Koninklijke
      Marechaussee, behoudens indien dit personeel daadwerkelijk bezig is met de uitvoering van de specifieke taken, die
      de Koninklijke Marechaussee in [artikel 6, eerste lid, van de Politiewet 1993][ref3] zijn opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0006299#Artikel6
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.33
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0006299
        artikel: '6'
  - number: 1.33.4
    text: |-
      In aanvulling op het derde lid, zijn de [artikelen 27][ref1] en [28 van de wet][ref2] van toepassing op de
      arbeid verricht door personeel van de Koninklijke Marechaussee in geval van de verlening van bijstand, bedoeld
      in [artikel 1.29, onder b][ref3], voor zover door de toepassing van die artikelen een goede uitoefening van die
      bijstandsverlening niet wordt belemmerd.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel1
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.33
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0008498
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '7'
  - number: '1.34'
    text: |-
      [Artikel 29 van de wet][ref1] is niet van toepassing op militair personeel.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel29
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.34
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '29'
  - number: '1.35'
    text: |-
      In deze afdeling wordt verstaan onder richtlijn: [Richtlijn nr. 94/33/EEG](31994L0033) van de Raad van de Europese
      Unie van 22 juni 1994 betreffende de bescherming van jongeren op het werk (*PbEG* L 216).
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.35
  - number: 1.36.1
    text: |-
      Indien in een bedrijf of inrichting een of meer jeugdige werknemers werkzaam zijn of plegen te zijn wordt in de
      risico-inventarisatie en -evaluatie, bedoeld in [artikel 5 van de wet][ref1], in het bijzonder aandacht besteed
      aan:


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.36
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
  - number: 1.36.1.a
    text: de leeftijd van de jeugdige werknemer;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.36
  - number: 1.36.1.b
    text: |-
      de specifieke gevaren op het gebied van arbeidsomstandigheden als gevolg van een gebrek aan werkervaring, het niet
      goed kunnen inschatten van gevaren en het niet voltooid zijn van de geestelijke of lichamelijke ontwikkeling van de
      jeugdige werknemer;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.36
  - number: 1.36.1.c
    text: de uitrusting en inrichting van de arbeidsplaats;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.36
  - number: 1.36.1.d
    text: de aard, de mate en de duur van de blootstelling aan stoffen, agentia en fysische factoren;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.36
  - number: 1.36.1.e
    text: de keuze en het gebruik van arbeidsmiddelen en persoonlijke beschermingsmiddelen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.36
  - number: 1.36.1.f
    text: het geheel van werkzaamheden in het bedrijf of de inrichting en de organisatie daarvan, en
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.36
  - number: 1.36.1.g
    text: het opleidingsniveau van de jeugdige werknemers en de aan hen te geven voorlichting.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.36
  - number: 1.36.2
    text: |-
      Voorts wordt in de risico-inventarisatie en -evaluatie bijzondere aandacht besteed aan de niet-volledige lijst van
      agentia, procédés en werkzaamheden, opgenomen in de bijlage bij de richtlijn.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.36
  - number: 1.37.1
    text: |-
      Indien in een bedrijf of inrichting jeugdige werknemers arbeid verrichten, wordt op die arbeid adequaat deskundig
      toezicht uitgeoefend. De inhoud en de mate van het toezicht is afhankelijk van de uit de risico-inventarisatie
      en -evaluatie, bedoeld in [artikel 5 van de wet][ref1], gebleken gevaren die kunnen ontstaan, indien deskundig
      toezicht ontbreekt.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.37
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
  - number: 1.37.2
    text: |-
      Indien uit de risico-inventarisatie en -evaluatie, bedoeld in [artikel 1.36][ref1], blijkt, dat jeugdige werknemers
      arbeid moeten verrichten waaraan specifieke gevaren, met name voor arbeidsongevallen als gevolg van een gebrek
      aan werkervaring, het niet goed kunnen inschatten van gevaren en het niet voltooid zijn van de geestelijke en
      lichamelijke ontwikkeling van de jeugdige werknemer, zijn verbonden, mag die arbeid slechts worden verricht, indien
      het deskundig toezicht zodanig is georganiseerd dat die gevaren worden voorkomen. Indien dat niet mogelijk is, mag
      die arbeid niet door jeugdige werknemers worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.37
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '8'
  - number: '1.38'
    text: |-
      In aanvulling op [artikel 18 van de wet][ref1] worden jeugdige werknemers in de gelegenheid gesteld om een
      arbeidsgezondheidskundig onderzoek te ondergaan, zodra uit de risico-inventarisatie en -evaluatie, bedoeld in
      [artikel 1.36][ref2], blijkt, dat jeugdige werknemers arbeid moeten verrichten waaraan specifieke gevaren, met name
      voor arbeidsongevallen als gevolg van het gebrek aan werkervaring, het niet goed kunnen inschatten van gevaren en
      het niet voltooid zijn van de geestelijke en lichamelijke ontwikkeling van de jeugdige werknemer, zijn verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel1
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.38
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '8'
  - number: '1.39'
    text: |-
      Deze afdeling en [paragraaf 4 van afdeling 5 van hoofdstuk 3][ref1],
      [paragraaf 2 van afdeling 10 van hoofdstuk 4][ref2], [paragraaf 3 van afdeling 6 van hoofdstuk 6][ref3] en
      [paragraaf 2 van afdeling 6 van hoofdstuk 7][ref4], zijn niet van toepassing op leerlingen en studenten in
      onderwijsinrichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk6
      [ref4]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.39
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0008498
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '10'
      - id: ref3
        bwb_id: BWBR0008498
        hoofdstuk: '6'
        paragraaf: '3'
        afdeling: '6'
      - id: ref4
        bwb_id: BWBR0008498
        hoofdstuk: '7'
        paragraaf: '2'
        afdeling: '6'
  - number: '1.40'
    text: |-
      In deze afdeling wordt verstaan onder richtlijn: [Richtlijn nr. 92/85/EEG](31992L0085) van de Raad van de Europese
      Gemeenschappen van 19 oktober 1992 betreffende maatregelen ter bevordering van de verbetering van de veiligheid en
      de gezondheid van werkneemsters tijdens de zwangerschap, na de bevalling en tijdens de lactatie (*PbEG* L 348).
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.40
  - number: '1.41'
    text: |-
      Indien in een bedrijf of inrichting een zwangere werknemer of een werknemer tijdens de lactatie werkzaam is of
      pleegt te zijn, wordt in de risico-inventarisatie en -evaluatie, bedoeld in [artikel 5 van de wet][ref1], in het
      bijzonder aandacht besteed aan de niet-limitatieve lijst van agentia, procédés en arbeidsomstandigheden, opgenomen
      in bijlage I bij de richtlijn


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.41
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
  - number: 1.42.1
    text: |-
      Onverminderd [artikel 4:5 van de Arbeidstijdenwet][ref1], organiseert de werkgever de arbeid van een zwangere
      werknemer en een werknemer tijdens de lactatie zodanig, richt de arbeidsplaats zodanig in, past een zodanige
      productie- en werkmethode toe en laat zodanige arbeidsmiddelen gebruiken, dat de arbeid voor die werknemer
      geen gevaren met zich kan brengen voor haar veiligheid en gezondheid en geen terugslag kan veroorzaken op de
      zwangerschap of lactatie.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.42
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '4'
  - number: 1.42.2
    text: |-
      Indien nakoming van het eerste lid redelijkerwijs niet mogelijk is, wordt door een tijdelijke aanpassing van de
      arbeid of door een tijdelijke aanpassing van de arbeids- en rusttijden voorkomen dat gevaar voor de veiligheid en
      gezondheid van de zwangere werknemer en de werknemer tijdens de lactatie wordt veroorzaakt, en wordt voorkomen dat
      een terugslag kan worden veroorzaakt op de zwangerschap of lactatie.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.42
  - number: 1.42.3
    text: |-
      Indien nakoming van het tweede lid redelijkerwijs niet mogelijk is, wordt aan de zwangere werknemer en de werknemer
      tijdens de lactatie tijdelijk andere arbeid gegeven.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.42
  - number: 1.42.4
    text: |-
      Indien nakoming van het derde lid redelijkerwijs niet mogelijk is, worden de zwangere werknemer en de werknemer
      tijdens de lactatie tijdelijk vrijgesteld van het verrichten van arbeid.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.42
  - number: 1.43.1
    text: |-
      Dit besluit is niet van toepassing op thuiswerk, tenzij uitdrukkelijk regels voor thuiswerk zijn gesteld. In
      dat laatste geval wordt onder werkgever mede verstaan thuiswerkgever en wordt onder werknemer mede verstaan
      thuiswerker.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.43
  - number: 1.43.2
    text: |-
      Indien een thuiswerker tevens een jeugdige werknemer is, zijn uitsluitend de bepalingen die voor de thuiswerker
      zijn vastgesteld van toepassing.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.43
  - number: '1.44'
    text: |-
      Van de thuiswerkers zijn gegevens beschikbaar omtrent naam, adres en woonplaats alsmede van de werkzaamheden die
      door de betreffende thuiswerkers worden verricht en van de stoffen, hulpmiddelen en werktuigen die daarbij worden
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.44
  - number: '1.45'
    text: |-
      Het is niet toegestaan aan de thuiswerker een grotere hoeveelheid aan grondstoffen, halffabrikaten en gerede
      producten in voorraad te geven of te laten houden dan voor de arbeid strikt noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.45
  - number: '1.46'
    text: |-
      Indien aan een thuiswerker in verband met het verrichten van arbeid een arbeidsongeval als bedoeld in
      [artikel 9, eerste lid, van de wet][ref1] overkomt, wordt door de thuiswerker hiervan onverwijld mededeling gedaan
      aan de thuiswerkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel9
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.46
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '9'
  - number: '2.1'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de gegevens die bij de schriftelijke
      mededeling van een arbeidsongeval, bedoeld in [artikel 9, eerste lid, van de wet][ref1] en de mededeling van een
      beroepsziekte, bedoeld in [artikel 9, derde lid, van de wet][ref2] worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel9
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '9'
  - number: '2.2'
    text: 'In deze afdeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.2
  - number: 2.2.a
    text: 'gevaarlijke stof: brandbare, extreem toxische, toxische of ontplofbare stof;'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.2
  - number: 2.2.b
    text: |-
      brandbare stof: een stof die een procestemperatuur heeft gelijk aan of hoger dan het vlampunt, bepaald met het
      toestel van Abel-Pensky voor vlampunten tot en met 65° C of bepaald met het toestel van Pensky-Martens voor
      vlampunten boven 65° C;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.2
  - number: 2.2.c
    text: 'extreem toxische stof:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.2
  - number: 2.2.c.1°
    text: |-
      een stof die acuut giftige eigenschappen bezit en daardoor gevaar voor de gezondheid kan opleveren bij een
      eenmalige betrekkelijk korte blootstelling, al dan niet met uitgestelde werking, en die als kenmerk heeft - dat
      de lethale concentratie 50 bij een blootstelling van de rat gedurende vier uur, kleiner is dan of gelijk is aan 20
      milligram per kubieke meter, of
        - dat de lethale dosis 50 oraal bij toediening aan de rat, kleiner is dan of gelijk is aan 1 milligram per
      kilogram, of
        - dat de lethale dosis 50 percutaan bij toediening aan de rat, kleiner is dan of gelijk is aan 2 milligram per
      kilogram;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.2
  - number: 2.2.c.2°
    text: |-
      de volgende voor de mens carcinogene stoffen met een hoge potentie: 2-acetylaminofluoreen, 4-aminobifenyl,
      benzidine, bischloormethylether, dialkylnitrosaminen, 4-dimethylaminoazobenzeen, methylnitroso-ureum, 2-
      naftylamine, 4-nitrobifenyl en 3-nitronaftylamine;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.2
  - number: 2.2.d
    text: |-
      toxische stof: een stof, niet zijnde een extreem toxische stof, die acuut giftige eigenschappen bezit en daardoor
      gevaar voor de gezondheid kan opleveren bij een eenmalige betrekkelijk korte blootstelling, al dan niet met
      uitgestelde werking, en die als kenmerk heeft dat de lethale concentratie 50 bij een blootstelling van de rat
      gedurende één uur, kleiner is dan of gelijk is aan 20 000 milligram per kubieke meter;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.2
  - number: 2.2.e
    text: |-
      ontplofbare stof: een stof die op grond van de [Wet milieugevaarlijke stoffen][ref1] voldoet aan de criteria voor
      indeling in de categorie «ontplofbaar», bedoeld in [artikel 34, tweede lid, onder a, van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003892
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel34
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0003892
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '34'
  - number: 2.2.f
    text: 'installatie: een installatie voor bewerking of een installatie voor opslag;'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.2
  - number: 2.2.g
    text: |-
      installatie voor bewerking: het stelsel van vaten, apparaten en leidingen dat ten aanzien van de omsloten stof een
      geheel vormt of kan vormen en dient voor de vervaardiging, bewerking, verwerking, verlading of vernietiging van
      deze stof;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.2
  - number: 2.2.h
    text: |-
      installatie voor opslag: de tanks, silo's, bunkers en verpakkingseenheden die dienen voor opslag met dien
      verstande, dat deze eenheden buiten de ruimtelijke begrenzing van een installatie voor bewerking zijn gelegen en
      waarbij wat betreft tanks, silo’s en bunkers elke eenheid als een op zich zelf staande installatie voor opslag moet
      worden beschouwd. Onder een installatie voor opslag worden mede begrepen voor het vervoer bestemde tanks en voor
      het vervoer van gevaarlijke stoffen bestemde verpakkingen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.2
  - number: 2.2.i
    text: |-
      procestemperatuur: de temperatuur die bij opslag of bij bewerking onder normale bedrijfscondities maximaal kan
      worden bereikt;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.2
  - number: 2.2.j
    text: |-
      omhulling: een constructie die een installatie voor bewerking of opslag omsluit, die de natuurlijke ventilatie van
      de omsloten installatie bemoeilijkt of verhindert en waarbinnen door werknemers regelmatig arbeid wordt verricht;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.2
  - number: 2.2.k
    text: |-
      grenswaarde: de hoeveelheid van een stof, uitgedrukt in kilogrammen, die bij plotseling vrijkomen het leven of de
      gezondheid van een op globaal 100 meter afstand van het emissiepunt verblijvende werknemer nog kan bedreigen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.2
  - number: 2.2.l
    text: |-
      zwaar ongeval: gebeurtenis als gevolg van onbeheersbare ontwikkelingen tijdens de bedrijfsuitoefening in een
      bedrijf of inrichting, waardoor hetzij onmiddellijk, hetzij na verloop van tijd ernstig gevaar voor de gezondheid
      van werknemers ontstaat en waarbij een of meer gevaarlijke stoffen zijn betrokken;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.2
  - number: 2.2.m
    text: |-
      scenario: de reeks van gebeurtenissen en omstandigheden die nodig zijn voor of leiden tot het vrijkomen van
      gevaarlijke stoffen, alsmede de reeks van gebeurtenissen die het effect weergeeft van het op deze wijze vrijkomen
      van gevaarlijke stoffen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.2
  - number: 2.3.1
    text: |-
      Deze afdeling is, met inachtneming van het derde en vierde lid en de [artikelen 2.3a][ref1] en [2.3b][ref2], van
      toepassing op bedrijven en inrichtingen waar één of meerdere installaties aanwezig zijn waarin zich een hoeveelheid
      gevaarlijke stoffen, uitgedrukt in kilogrammen, bevindt, ongeacht de hiermee beoogde handelingen, of door het
      onbeheersbaar worden van een industrieel chemisch proces een hoeveelheid van dergelijke stoffen, uitgedrukt
      in kilogrammen, kan worden gevormd, welke, vermenigvuldigd met de van toepassing zijnde omstandigheidsfactor
      of -factoren als bedoeld in [artikel 2.5][ref3], gelijk is aan of groter is dan de grenswaarde, bedoeld in
      [artikel 2.4][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 2.3.2
    text: |-
      Indien het eerste lid van toepassing is, is deze afdeling van overeenkomstige toepassing op arbeidsplaatsen gelegen
      in de nabijheid van het bedrijf of de inrichting waarvoor de werkgever verantwoordelijk is.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.3
  - number: 2.3.3
    text: |-
      Voor een installatie als bedoeld in het eerste lid waarin zich een stof of een groep van stoffen met een
      identieke grenswaarde onder verschillende omstandigheden bevindt, wordt elke onder dezelfde omstandigheden
      verkerende deelhoeveelheid van de stof of groep van stoffen vermenigvuldigd met de van toepassing zijnde
      omstandigheidsfactoren. Deze afdeling is van toepassing, indien de som van de al dan niet gecorrigeerde
      deelhoeveelheden gelijk is aan of groter is dan de grenswaarde van de desbetreffende stof of groep van stoffen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.3
  - number: 2.3.4
    text: |-
      Voor een installatie als bedoeld in het eerste lid waarin zich stoffen met verschillende grenswaarden bevinden,
      wordt elke hoeveelheid van een stof of groep van stoffen met een identieke grenswaarde vermenigvuldigd met
      de van toepassing zijnde omstandigheidsfactoren. Deze afdeling is van toepassing indien voor een van de in
      [artikel 2.4, eerste lid, onder a of b][ref1], of [artikel 2.4, tweede lid][ref2], genoemde categorieën van
      stoffen, de som van de quotiënten van de desbetreffende al dan niet gecorrigeerde hoeveelheden en grenswaarden van
      de tot die categorie behorende stoffen die in de installatie aanwezig zijn, gelijk is aan of groter is dan 1.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 2.3.5
    text: |-
      De in dit artikel bedoelde vermenigvuldiging met een omstandigheidsfactor of -factoren vindt geen toepassing ten
      aanzien van ontplofbare stoffen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.3
  - number: 2.3a.1
    text: |-
      In dit artikel wordt verstaan onder opslag in verband met vervoer van gevaarlijke stoffen: opslag van verpakte
      gevaarlijke stoffen als bedoeld in [artikel 2.2, onderdeel a][ref1], gedurende korte tijd en in afwachting van
      aansluitend vervoer naar een vooraf bekende ontvanger, met inbegrip van het laden en lossen van die stoffen en de
      overbrenging daarvan naar of van een andere tak van vervoer, voor zover daadwerkelijk in aansluitend vervoer is
      voorzien en de betrokken gevaarlijke stoffen in hun oorspronkelijke verpakking blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.3a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 2.3a.2
    text: |-
      Ten aanzien van een inrichting die tot een krachtens [artikel 1.1, derde lid, van de Wet milieubeheer][ref1]
      aangewezen categorie behoort en bestemd is voor de opslag in verband met vervoer van gevaarlijke stoffen, al
      dan niet in combinatie met andere stoffen en producten, waarin gevaarlijke stoffen krachtens vergunning op grond
      van [artikel 8.1 van de Wet milieubeheer][ref2] aanwezig mogen zijn, kan voor de toepassing van deze afdeling de
      berekening van de hoeveelheid gevaarlijke stoffen, bedoeld in [artikel 2.3][ref3], achterwege blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.3a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 2.3b.1
    text: 'Deze afdeling is:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.3b
  - number: 2.3b.1.a
    text: |-
      met uitzondering van [artikel 2.5f][ref1], niet van toepassing op bedrijven of inrichtingen waarop
      [paragraaf 3 van het Besluit risico's zware ongevallen 1999][ref2] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010475#Paragraaf3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.3b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0010475
        paragraaf: '3'
  - number: 2.3b.1.b
    text: |-
      niet van toepassing op bedrijven en inrichtingen waarop het [Besluit opslag- en transportbedrijven][ref1] van
      toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0011417
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.3b
    references:
      - id: ref1
        bwb_id: BWBR0011417
  - number: 2.3b.1.c
    text: |-
      niet van toepassing op arbeid verricht in de ondergrondse winningsindustrie en de winningsindustrie die delfstoffen
      wint met behulp van boringen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.3b
  - number: 2.3b.2
    text: |-
      De [artikelen 2.5a, eerste en tweede lid][ref1], en [2.5d, eerste lid, onder a][ref2], zijn niet van toepassing op
      bedrijven of inrichtingen waarop [paragraaf 2 van het Besluit risico's zware ongevallen 1999][ref3] van toepassing
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0010475#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.3b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0010475
        paragraaf: '2'
  - number: 2.4.1
    text: |-
      De in [artikel 2.3, eerste lid][ref1], bedoelde grenswaarde bedraagt:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 2.4.1.a
    text: 'voor brandbare stoffen: 10 000 kilogram;'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.4
  - number: 2.4.1.b
    text: 'voor extreem toxische stoffen: 1 kilogram;'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.4
  - number: 2.4.1.c
    text: |-
      voor ontplofbare stoffen: de hoeveelheid waarvan de explosie-energie equivalent is aan de explosie-energie van
      1000 kilogram trinitrotolueen, waarbij de explosie-energie van trinitrotolueen wordt gesteld op 4 600 kilojoule
      per kilogram.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.4
  - number: 2.4.2
    text: |-
      Voor toxische stoffen worden de grenswaarden, bedoeld in [artikel 2.3, eerste lid][ref1], afgeleid op basis
      van de toxicologische gegevens en de fysische omstandigheid bij 25° C van de grenswaarde voor chloor, waarbij
      de grenswaarde voor chloor op 300 kilogram wordt gesteld. Bij deze afleiding wordt uitgegaan van een lethale
      concentratie 50 bij een blootstelling van de rat gedurende één uur aan de stof.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
  - number: '2.5'
    text: |-
      De in [artikel 2.3, eerste lid][ref1], bedoelde omstandigheidsfactoren zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 2.5.a
    text: 'voor een stof die zich bevindt in een installatie voor bewerking: 1;'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5
  - number: 2.5.b
    text: 'voor een stof die zich bevindt in een installatie voor opslag: 0,01;'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5
  - number: 2.5.c
    text: 'voor een installatie die is opgesteld in de open lucht: 1;'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5
  - number: 2.5.d
    text: 'voor een installatie die is opgesteld in een omhulling: 10;'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5
  - number: 2.5.e
    text: |-
      voor een stof die in de vloeibare fase verkeert en waarvan de procestemperatuur gelijk is aan het atmosferisch
      kookpunt van die stof: 1; voor elke 10° C dat deze procestemperatuur boven het atmosferisch kookpunt ligt wordt
      deze factor verhoogd met 1 tot een maximum van 10, afgerond op een geheel getal, en voor elke 10° C dat de
      procestemperatuur onder het atmosferisch kookpunt ligt, wordt deze factor verminderd met 0,1 tot een minimum van
      0,1, afgerond op één decimaal;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5
  - number: 2.5.f
    text: |-
      voor een stof die in de vloeibare fase verkeert en waarvan de procestemperatuur lager is dan de
      omgevingstemperatuur, zijnde 25° C: 1; voor elke 50 °C dat het atmosferisch kookpunt van de desbetreffende stof
      onder de 25 °C ligt wordt deze factor verhoogd met 1 tot een maximum van 4, afgerond op hele getallen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5
  - number: 2.5.g
    text: |-
      voor procesomstandigheden waar zowel de onder *e*, als de onder *f* genoemde factoren van toepassing zijn, geldt
      een vermenigvuldigingsfactor die gelijk is aan de som van de vermenigvuldigingsfactoren *e* en *f*, verminderd met
      1 en met een maximum van 10;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5
  - number: 2.5.h
    text: 'voor een stof die in de gasfase verkeert: 10;'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5
  - number: 2.5.i
    text: 'voor een stof die in de vaste fase verkeert: 0,1.'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5
  - number: 2.5a.1
    text: |-
      De algemene doelstellingen en beginselen van het beleid inzake de beheersing van de risico's van zware ongevallen,
      bedoeld in [artikel 6, eerste lid, van de wet][ref1], worden schriftelijk vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel6
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '6'
  - number: 2.5a.2
    text: |-
      Voor de vaststelling en uitvoering van het beleid, bedoeld in het eerste lid, wordt een veiligheidsbeheerssysteem
      ingevoerd, dat mede wordt gebaseerd op de risico-inventarisatie en -evaluatie, bedoeld in [artikel 2.5b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 2.5a.3
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot het veiligheidsbeheerssysteem, bedoeld in
      het tweede lid.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5a
  - number: 2.5b.1
    text: |-
      In de risico-inventarisatie en -evaluatie, bedoeld in [artikel 5, eerste lid, van de wet][ref1], worden:


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5b
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
  - number: 2.5b.1.a
    text: |-
      de risico's van ongevallen met gevaarlijke stoffen systematisch geïdentificeerd en geëvalueerd aan de hand van
      daartoe door de werkgever vastgestelde procedures, zowel bij normale werking als bij abnormale werking van de
      installatie of het industrieel chemisch proces. Hierbij wordt tevens rekening gehouden met de aanwezigheid van
      andere stoffen die in een specifieke situatie bij kunnen dragen aan het risico van een zwaar ongeval;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5b
  - number: 2.5b.1.b
    text: |-
      de scenario's voor mogelijke zware ongevallen beschreven. Bij de keuze van de scenario's wordt rekening gehouden
      met externe gevaren voor de installatie. De kans op het ontstaan van een zwaar ongeval en het effect van een
      plaatsgevonden zwaar ongeval worden in de scenario's zoveel mogelijk gekwantificeerd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5b
  - number: 2.5b.2
    text: 'Op grond van de risico-inventarisatie en- evaluatie, bedoeld in het eerste lid, onder a, worden:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5b
  - number: 2.5b.2.a
    text: |-
      ter voorkoming van een zwaar ongeval alle technische en organisatorische maatregelen getroffen die nodig zijn om
      de veilige werking van de installaties te garanderen, zowel bij normaal bedrijf als bij tijdelijke onderbrekingen
      of onderhoud, dan wel bij wijziging van bestaande installaties of de bouw van nieuwe installaties. De eerste volzin
      is van overeenkomstige toepassing ten aanzien van alle opslagplaatsen, apparatuur en infrastructuur die samenhangen
      met de risico's van een zwaar ongeval binnen het bedrijf of de inrichting.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5b
  - number: 2.5b.2.b
    text: |-
      alle technische en organisatorische maatregelen getroffen om de gevolgen van een zwaar ongeval zoveel mogelijk
      te beperken.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5b
  - number: 2.5b.3
    text: |-
      Een beschrijving van de maatregelen, bedoeld in het tweede lid, wordt opgenomen in de scenariobeschrijvingen,
      bedoeld in het eerste lid, onder b.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5b
  - number: 2.5b.4
    text: |-
      Met de beschrijving van de scenario's, bedoeld in het eerste lid, onder b, en de beschrijving van de getroffen
      maatregelen, bedoeld in het derde lid, wordt aangetoond dat de risico's met betrekking tot zware ongevallen op
      adequate wijze worden beheerst.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5b
  - number: 2.5b.5
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de procedures, bedoeld in het eerste lid,
      onder a, en de beschrijving van scenario's, bedoeld in het eerste lid, onder b.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5b
  - number: 2.5c.1
    text: |-
      Ten behoeve van de planning voor noodsituaties wordt een intern noodplan opgesteld dat wordt gebaseerd op de
      risico-inventarisatie en -evaluatie, bedoeld in [artikel 2.5b, eerste lid][ref1], en de op grond hiervan getroffen
      maatregelen, bedoeld in [artikel 2.5b, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5c
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 2.5c.2
    text: |-
      Bij het opstellen van het intern noodplan wordt overleg gevoerd met de ondernemingsraad, de
      personeelsvertegenwoordiging, of, bij het ontbreken daarvan, met de belanghebbende werknemers.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5c
  - number: 2.5c.3
    text: Het intern noodplan wordt ten minste eenmaal per drie jaar beproefd, geëvalueerd en indien nodig gewijzigd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5c
  - number: 2.5c.4
    text: |-
      De werkgever zorgt ervoor dat de bedrijfshulpverleners en de hulpverleningsorganisaties, bedoeld in
      [artikel 2.16][ref1], alsmede de werknemers, de deskundigen, genoemd in [artikel 13 van de wet][ref2], en de
      deskundigen of arbodiensten, genoemd in de [artikelen 14][ref3] en [14a van de wet][ref4], desgewenst kennis kunnen
      nemen van het intern noodplan.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0010346#Artikel14a
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5c
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '13'
      - id: ref3
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref4
        bwb_id: BWBR0010346
        artikel: 14a
  - number: 2.5c.5
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de gegevens die in het noodplan worden
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5c
  - number: 2.5d.1
    text: |-
      Indien in het bedrijf of de inrichting of een onderdeel daarvan of in de toegepaste werkmethoden en
      productiemethoden een verandering van technische of organisatorische aard wordt aangebracht die voor de risico's
      van een zwaar ongeval belangrijke gevolgen kan hebben, of wanneer een verandering in het veiligheidsinzicht daartoe
      aanleiding geeft, wordt er voor zorg gedragen dat:
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5d
  - number: 2.5d.1.a
    text: |-
      het beleid, bedoeld in [artikel 2.5a, eerste lid][ref1], en het veiligheidsbeheerssysteem, bedoeld in
      [artikel 2.5a, tweede lid][ref2], opnieuw worden beoordeeld en indien nodig worden herzien;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5d
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 2.5d.1.b
    text: |-
      de risico-inventarisatie en -evaluatie, bedoeld in [artikel 2.5b, eerste lid, onder a][ref1], en de beschrijving
      van scenario's, bedoeld in [artikel 2.5b, eerste lid, onder b][ref2], opnieuw worden beoordeeld en indien nodig
      herzien;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5d
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 2.5d.1.c
    text: |-
      de getroffen maatregelen, bedoeld in [artikel 2.5b, tweede lid][ref1], en het intern noodplan, bedoeld in
      [artikel 2.5c][ref2], dienovereenkomstig worden aangepast aan de gewijzigde situatie.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5d
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 2.5d.2
    text: |-
      Onverminderd het eerste lid, wordt de risico-inventarisatie en -evaluatie, bedoeld in
      [artikel 2.5b, eerste lid, onder a][ref1], eenmaal per vijf jaar uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5d
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 2.5e.1
    text: |-
      In aanvulling op [artikel 14, eerste lid, van de wet][ref1] laat de werkgever zich bij de volgende taken bijstaan
      door de persoon, bedoeld in [artikel 14, eerste lid, van de wet][ref2] die belast is met de taak, bedoeld in
      [artikel 14, eerste lid, onderdeel a, van de wet][ref3], die door de werkgever is ingeschakeld of de arbodienst van
      de werkgever:


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel14
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5e
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0010346
        artikel: '14'
  - number: 2.5e.1.a
    text: |-
      de vastlegging van het beleid als bedoeld in [artikel 2.5a, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5e
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 2.5e.1.b
    text: |-
      het opstellen van een veiligheidsbeheerssysteem als bedoeld in [artikel 2.5a, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5e
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 2.5e.1.c
    text: |-
      het verrichten en opstellen van een aanvullende risico-inventarisatie en -evaluatie als bedoeld in
      [artikel 2.5b, eerste lid, onder a][ref1], waaronder mede begrepen het toetsen ervan;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5e
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 2.5e.1.d
    text: |-
      het opstellen van de beschrijvingen, bedoeld in [artikel 2.5b, eerste lid, onder b, en derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5e
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 2.5e.1.e
    text: |-
      het opstellen van een intern noodplan als bedoeld in [artikel 2.5c][ref1], waaronder mede begrepen het toetsen
      ervan;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5e
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 2.5e.1.f
    text: |-
      het doorvoeren van de wijzigingen, bedoeld in [artikel 2.5d][ref1], waaronder mede begrepen, voor zover van
      toepassing, het toetsen ervan.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5e
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 2.5e.2
    text: |-
      Onder de bijstand bij de taken, bedoeld in het eerste lid, wordt mede begrepen het adviseren over de uitvoering van
      deze taken.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5e
  - number: 2.5f
    text: |-
      Indien een zwaar ongeval gevolgen kan hebben voor de veiligheid van werknemers in naburige bedrijven of
      inrichtingen verstrekt de werkgever uit eigen beweging aan de betreffende bedrijven of inrichtingen algemene
      gegevens die noodzakelijk zijn voor de beoordeling van het risico voor de veiligheid van de werknemers in het
      naburige bedrijf of inrichting.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5f
  - number: 2.5g.1
    text: |-
      Aan een daartoe aangewezen ambtenaar als bedoeld in [artikel 24 van de wet][ref1] wordt door de werkgever
      schriftelijk gemeld:


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5g
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 2.5g.1.a
    text: |-
      de naam en het adres van de werkgever en, indien deze anders zijn, de naam en het adres van het bedrijf of de
      inrichting waarop [artikel 2.3][ref1] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5g
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 2.5g.1.b
    text: |-
      welke installaties onder de verplichting, bedoeld in [artikel 2.3, eerste lid][ref1], vallen;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5g
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 2.5g.1.c
    text: |-
      de naam en het adres van de deskundige persoon, bedoeld in [artikel 14, eerste lid, van de wet][ref1] of de
      arbodienst, die medewerking verleent bij de taken, bedoeld in [artikel 2.5e, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5g
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 2.5g.2
    text: |-
      Indien in het bedrijf of de inrichting of een onderdeel daarvan of in de werking van het bedrijf of de inrichting
      of een onderdeel daarvan een verandering van technische of organisatorische aard wordt aangebracht die voor de
      risico's van een zwaar ongeval met gevaarlijke stoffen belangrijke gevolgen kan hebben, wordt een nieuwe melding
      als bedoeld in het eerste lid gedaan.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5g
  - number: 2.5g.3
    text: 'De ambtenaar, bedoeld in het eerste lid, zendt onverwijld een kopie van de melding aan:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5g
  - number: 2.5g.3.a
    text: |-
      het bestuursorgaan dat bevoegd is een vergunning krachtens [artikel 8:1 van de Wet milieubeheer][ref1] te verlenen;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5g
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 2.5g.3.b
    text: |-
      burgemeester en wethouders van de gemeente waarin het bedrijf of de inrichting geheel of gedeeltelijk is gelegen,
      tenzij burgemeester en wethouders het bestuursorgaan als bedoeld onder a zijn;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5g
  - number: 2.5g.3.c
    text: het bestuur van de regionale brandweer binnen wier gebied het bedrijf of de inrichting is gelegen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5g
  - number: 2.5h
    text: |-
      Het bedrijf, de inrichting of het deel daarvan waarop deze afdeling van toepassing is of is aangewezen krachtens
      [artikel 6, tweede lid, van de wet][ref1], wordt niet in werking gebracht of gehouden en de verandering, bedoeld
      in [artikel 2.5d, eerste lid, aanhef][ref2], wordt niet doorgevoerd, alvorens is voldaan aan de verplichtingen,
      bedoeld in de [artikelen 2.5a][ref3], [2.5b][ref4], [2.5c][ref5], [2.5d][ref6] en [2.5g][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref6]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref7]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.5h
