      - id: ref3
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '5'
  - number: 4.56.2
    text: |-
      De concentratie van crocidolietstof in de lucht waaraan de werknemers in verband met de werkzaamheden, bedoeld in
      het eerste lid, worden blootgesteld mag de grenswaarde van 0,1 vezel per kubieke centimeter, vastgesteld, berekend
      of gemeten over een referentieperiode van acht uur, niet overschrijden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.56
  - number: 4.56.3
    text: |-
      De bij de werkzaamheden vrijgekomen crocidoliethoudende materialen mogen niet worden opgeslagen tezamen
      met crocidolietvrije materialen en worden zo spoedig mogelijk verzameld en afgevoerd overeenkomstig
      [artikel 4.45, tweede lid, onder c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.56
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '5'
  - number: 4.56.4
    text: |-
      [Artikel 4.45a][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.56
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '5'
  - number: 4.57.1
    text: |-
      Aan werknemers die arbeid verrichten waarbij gevaar voor blootstelling aan asbeststof of crocidolietstof bestaat,
      wordt overeenkomstig een schriftelijk plan doeltreffende voorlichting en doeltreffend onderricht gegeven over:
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.57
  - number: 4.57.1.a
    text: de mogelijke gevaren voor de gezondheid van blootstelling aan asbeststof of crocidolietstof;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.57
  - number: 4.57.1.b
    text: |-
      de noodzaak van het toezicht op het asbestgehalte of crocidolietgehalte in de lucht en de daarvoor geldende
      grenswaarden;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.57
  - number: 4.57.1.c
    text: de maatregelen inzake de persoonlijke en werkhygiëne;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.57
  - number: 4.57.1.d
    text: de maatregelen om de blootstelling aan asbeststof of crocidolietstof zo laag mogelijk te houden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.57
  - number: 4.57.2
    text: |-
      Aan werknemers die asbest of asbesthoudende producten dan wel crocidoliet of crocidoliethoudende producten
      slopen of verwijderen wordt, in aanvulling op het eerste lid, overeenkomstig een schriftelijk plan, doeltreffende
      voorlichting en doeltreffend onderricht gegeven over de aan voornoemde werkzaamheden verbonden gevaren voor de
      gezondheid en over de wijze waarop die gevaren zoveel mogelijk kunnen worden beperkt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.57
  - number: 4.58.1
    text: Het is verboden propaansulton (CAS-nummer 1120–71–4) te vervaardigen of te gebruiken.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.58
  - number: 4.58.2
    text: Het is verboden propaansulton, anders dan ten behoeve van doorvoer, in voorraad te houden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.58
  - number: 4.59.1
    text: 'Het is verboden de volgende stoffen te vervaardigen of te gebruiken:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.59
  - number: 4.59.1.a
    text: 2-naftylamine en de zouten daarvan (CAS-nummer 91–59–8);
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.59
  - number: 4.59.1.b
    text: 4-aminodifenyl en de zouten daarvan (CAS-nummer 92–67–1);
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.59
  - number: 4.59.1.c
    text: benzidine en de zouten daarvan (CAS-nummer 92–87–5);
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.59
  - number: 4.59.1.d
    text: 4-nitrodifenyl (CAS-nummer 92–93–3).
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.59
  - number: 4.59.2
    text: Het is verboden de in het eerste lid genoemde stoffen, anders dan ten behoeve van doorvoer, in voorraad te houden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.59
  - number: 4.59.3
    text: |-
      De in het eerste en tweede lid vervatte verboden zijn niet van toepassing, indien de stoffen in een mengsel of
      oplossing aanwezig zijn in een concentratie die kleiner is dan 0,1 gewichtsprocent.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.59
  - number: 4.60.1
    text: Het is verboden zandsteen te bewerken of te verwerken.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.60
  - number: 4.60.2
    text: 'Het eerste lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.60
  - number: 4.60.2.a
    text: |-
      op het bewerken of verwerken van zandsteen indien dit noodzakelijk is voor het behoud van monumenten als bedoeld in
      de [Monumentenwet 1988][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004471
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.60
    references:
      - id: ref1
        bwb_id: BWBR0004471
  - number: 4.60.2.b
    text: op het demonteren van zandsteen of zandsteendelen uit gebouwen, constructies of installaties, en
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.60
  - number: 4.60.2.c
    text: op het uitvoeren van wetenschappelijk onderzoek met zandsteen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.60
  - number: 4.60.3
    text: Het is verboden zandsteen in voorraad te houden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.60
  - number: 4.60.4
    text: 'Het derde lid is niet van toepassing met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.60
  - number: 4.60.4.a
    text: het in voorraad houden van zandsteen ten behoeve van de in het tweede lid, onder *a*, bedoelde werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.60
  - number: 4.60.4.b
    text: de doorvoer van zandsteen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.60
  - number: 4.60.4.c
    text: |-
      voorwerpen, welke geheel of ten dele uit zandsteen bestaan en welke voor hun bestemming gereed en volledig
      afgewerkt zijn.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.60
  - number: 4.61.1
    text: 'In dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.61
  - number: 4.61.1.a
    text: |-
      stralen: het met grote snelheid treffen van een voorwerp met korrels ten einde dat voorwerp te reinigen of te
      bewerken, met uitzondering van die bewerkingen waardoor een laag materiaal op het voorwerp wordt aangebracht;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.61
  - number: 4.61.1.b
    text: 'ontzanden: het stralen van een gietstuk ten einde dit te ontdoen van aanhangend vormzand.'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.61
  - number: 4.61.2
    text: |-
      Het is verboden te stralen met een stof die aan kwarts of een andere vorm van vrij kristallijn siliciumdioxyde meer
      dan 1% bevat.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.61
  - number: 4.61.3
    text: Het ontzanden mag slechts plaatsvinden in voor dat doel bestemde gesloten toestellen of ruimten.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.61
  - number: 4.61.4
    text: |-
      Het bij het ontzanden ontstane stof moet op doelmatige wijze worden afgezogen, uit de luchtstroom afgescheiden
      en verzameld.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.61
  - number: 4.61.5
    text: De bij het ontzanden afgezogen lucht mag niet worden afgevoerd naar een ruimte waarin personen moeten verblijven.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.61
  - number: '4.62'
    text: |-
      Voor zover de werkzaamheden, bedoeld in de [artikelen 4.59, eerste en tweede lid][ref1],
      en [4.60, eerste en derde lid][ref2], zijn toegestaan, is daarop, met inachtneming van
      [artikel 4.12, afdeling 2][ref3] van dit hoofdstuk van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.62
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '6'
      - id: ref3
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: 4.62a
    text: |-
      Voor de toepassing van deze afdeling wordt verstaan onder vluchtige organische stoffen: organische verbindingen
      en mengsels hiervan, die bij 293,15 K een dampspanning hebben van ten minste 0,01 kPa dan wel een overeenkomstige
      vluchtigheid bij de specifieke gebruiksomstandigheden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.62a
  - number: 4.62b
    text: |-
      Ten aanzien van bij ministeriële regeling aangewezen werkzaamheden wordt het gevaar van blootstelling van
      werknemers aan vluchtige organische stoffen zoveel mogelijk voorkomen door vluchtige organische stoffen te
      vervangen door onschadelijke of minder schadelijke stoffen of door producten die vluchtige organische stoffen
      bevatten te vervangen door bij ministeriële regeling ten aanzien van die werkzaamheden aangewezen producten.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.62b
  - number: 4.78.1
    text: |-
      Het is verboden om loodwit, loodsulfaat of producten die een van deze stoffen als bestanddeel bevatten, te
      gebruiken bij het schilderen van binnenwerk van gebouwen of vaartuigen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.78
  - number: 4.78.2
    text: |-
      Als stof in de zin van het eerste lid wordt niet beschouwd het loodsulfaat, dat bij de bereiding van chroomaatgeel
      is medegeprecipiteerd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.78
  - number: '4.79'
    text: |-
      Aan werknemers die met loodhoudende materialen of producten schilderwerk verrichten, dat niet op grond van
      [artikel 4.78][ref1] is verboden, wordt, in aanvulling op [artikel 4.10e][ref2], schriftelijk en adequaat
      voorlichtingsmateriaal verschaft over de bij die werkzaamheden in acht te nemen voorzorgsmaatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.79
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '6'
        afdeling: '1'
  - number: '4.80'
    text: |-
      In aanvulling op [artikel 3.23][ref1], zijn voor de werknemers die werkzaamheden verrichten, bestaande uit het
      aanbrengen of verwijderen van loodhoudende materialen of producten, doelmatige wasgelegenheden en doucheruimten
      beschikbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.80
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: '1'
  - number: '4.81'
    text: |-
      Deze afdeling is niet van toepassing op verven waarvan het pigment in de droge stof ten hoogste 2 gewichtsprocenten
      aan lood bevat.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.81
  - number: '4.82'
    text: 'Onder fosforlucifers wordt verstaan: lucifers waarin witte fosfor (CAS-nummer 12185–10–3) voorkomt.'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.82
  - number: 4.83.1
    text: Het is verboden fosforlucifers te vervaardigen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.83
  - number: 4.83.2
    text: Het is verboden fosforlucifers in voorraad te houden, anders dan ten behoeve van doorvoer.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.83
  - number: 4.84.1
    text: |-
      De [afdelingen 1 tot en met 8 van dit hoofdstuk][ref1] zijn niet van toepassing op biologische agentia.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.84
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '4'
        afdeling: '1'
  - number: 4.84.2
    text: 'In deze afdeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.84
  - number: 4.84.2.a
    text: |-
      biologische agentia: al dan niet genetisch gemodificeerde celculturen, menselijke endoparasieten en micro-
      organismen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.84
  - number: 4.84.2.b
    text: 'celcultuur: het kunstmatig kweken van cellen van meercellige organismen;'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.84
  - number: 4.84.2.c
    text: |-
      micro-organisme: een cellulaire of niet-cellulaire microbiologische entiteit met het vermogen tot vermenigvuldiging
      of tot overbrenging van genetisch materiaal;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.84
  - number: 4.84.2.d
    text: |-
      richtlijn: [richtlijn nr. 2000/54/EG](32000L0054) van het Europees Parlement en de Raad van de Europese Unie van 18
      september 2000 (Pb EG L 262) betreffende de bescherming van de werknemers tegen de risico's van blootstelling aan
      biologische agentia op het werk (zevende bijzondere richtlijn in de zin van artikel 16, lid 1, van [richtlijn nr.
      89/391/EEG](31989L0391)).
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.84
  - number: 4.84.3
    text: 'Voor de toepassing van deze afdeling worden biologische agentia in de volgende categorieën onderscheiden:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.84
  - number: 4.84.3.a
    text: 'categorie 1: een agens waarvan het onwaarschijnlijk is dat het bij de mens ziekten zal veroorzaken;'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.84
  - number: 4.84.3.b
    text: |-
      categorie 2: een agens dat bij mensen een ziekte kan veroorzaken en een gevaar voor de veiligheid en de gezondheid
      van de werknemers kan opleveren, maar waarvan het onwaarschijnlijk is dat het zich onder de bevolking verspreidt,
      terwijl er een effectieve profylaxe of behandeling bestaat;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.84
  - number: 4.84.3.c
    text: |-
      categorie 3: een agens dat bij mensen een ernstige ziekten kan veroorzaken en een groot gevaar voor de veiligheid
      en de gezondheid van de werknemers kan opleveren en waarvan het waarschijnlijk is dat het zich onder de bevolking
      verspreidt, terwijl er een effectieve profylaxe of behandeling bestaat;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.84
  - number: 4.84.3.d
    text: |-
      categorie 4: een agens dat bij mensen ernstige ziekten veroorzaakt en een groot gevaar voor de veiligheid en
      de gezondheid van de werknemers oplevert en waarvan het zeer waarschijnlijk is dat het zich onder de bevolking
      verspreidt, terwijl geen effectieve profylaxe of behandeling bestaat.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.84
  - number: 4.84.4
    text: |-
      In deze afdeling wordt uitgegaan van de categorie-indeling van biologische agentia zoals vastgesteld in bijlage III
      bij de richtlijn.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.84
  - number: '4.85'
    text: |-
      Indien een werknemer gerede kans loopt aan een of meer specifiek bij zijn arbeid voorkomende of naar verwachting
      voorkomende biologische agentia te worden blootgesteld, wordt, in het kader van de in [artikel 5 van de wet][ref1]
      bedoelde risico-inventarisatie en -evaluatie, de aard, de mate en de duur van de blootstelling beoordeeld teneinde
      het gevaar voor de werknemer te bepalen. Deze beoordeling geschiedt met inachtneming van met name:


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.85
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
  - number: 4.85.a
    text: |-
      de categorie of categorieën, waarin de biologische agentia waaraan werknemers kunnen worden blootgesteld, zijn
      ingedeeld;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.85
  - number: 4.85.b
    text: |-
      informatie over ziekten die werknemers kunnen oplopen of al hebben opgelopen als gevolg van blootstelling aan
      biologische agentia;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.85
  - number: 4.85.c
    text: |-
      mogelijke allergische of vergiftigingseffecten die de werknemers als gevolg van blootstelling aan biologische
      agentia ondervinden of kunnen ondervinden;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.85
  - number: 4.85.d
    text: |-
      de resultaten van de arbeidsgezondheidskundige onderzoeken, bedoeld in artikel 4.91, alsmede de ziekten waarvan
      bekend is dat een werknemer hieraan lijdt en de medicijnen waarvan bekend is dat die door een werknemer worden
      gebruikt, een en ander in statistische, niet tot individuen herleidbare vorm.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.85
  - number: 4.86.1
    text: |-
      Indien de arbeid gericht is op het werken met biologische agentia behorend tot categorie 2, 3 of 4 zijn de
      artikelen [4.87 tot en met 4.102][ref1] van toepassing .


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.86
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '9'
  - number: 4.86.2
    text: |-
      Indien uit de resultaten van de risico-inventarisatie en -evaluatie, bedoeld in [artikel 4.85][ref1], blijkt,
      dat werknemers bij het verrichten van andere arbeid dan die, bedoeld in het eerste lid, waaronder de in bijlage
      I bij de richtlijn genoemde werkzaamheden, een gerede kans lopen aan biologische agentia van categorie 2, 3 of 4
      te worden blootgesteld, zijn de [artikelen 4.87][ref2], [4.89][ref3], [4.91][ref4], [4.93][ref5], [4.95][ref6],
      [4.97][ref7], [4.98][ref8], [4.99, tweede lid][ref9], en [4.102][ref10] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
