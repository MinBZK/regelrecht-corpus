    text: |-
      de maatregelen, bedoeld in de [artikelen 4.3a, aanhef en onder d][ref1],
      [4.6a, vierde lid, onder b, c en e, en vijfde lid][ref2], [4.18][ref3], [4.19, aanhef en onder b en c][ref4],
      [4.20, eerste tot en met vierde lid][ref5], [4.45, eerste en tweede lid, onder a, c en d][ref6], en [4.51][ref7];


