  - number: 4.54.2
    text: |-
      In afwijking van [artikel 4.45, tweede lid, onder d][ref1], kunnen bij het uitvoeren van werkzaamheden als bedoeld
      in het eerste lid elektrisch of pneumatisch aangedreven verspanende werktuigen worden gebruikt met een toerental
      hoger dan 100 omwentelingen per minuut of met een lineaire zaagsnelheid groter dan 25 meter per minuut, indien
      deze zijn voorzien van een afzuigsysteem of een andere voorziening, zodanig dat de concentratie van asbest- of
      crocidolietstof in de lucht, bedoeld in [artikel 4.55, eerste lid, onder d][ref2], niet wordt overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.54
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
