        afdeling: '1'
  - number: '3.47'
    text: |-
      In aanvulling op dit hoofdstuk gelden voor zwangere werknemers en werknemers tijdens de lactatie tevens de in deze
      paragraaf genoemde voorschriften.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.47
  - number: '3.48'
    text: |-
      Voor zwangere werknemers en werknemers tijdens de lactatie is een geschikte, af te sluiten besloten ruimte
      beschikbaar, waarin gelegenheid is of onmiddellijk kan worden gemaakt voor het nemen van rust. In een zodanige
      ruimte is een deugdelijk, al of niet opvouwbaar bed of een deugdelijke rustbank beschikbaar.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.48
  - number: '4.1'
    text: 'In deze afdeling en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.1
  - number: 4.1.a
    text: |-
      gevaarlijke stoffen: stoffen, mengsels of oplossingen van stoffen waaraan werknemers bij de arbeid worden of
      kunnen worden blootgesteld die vanwege de eigenschappen van of de omstandigheden waaronder die stoffen, mengsels of
      oplossingen voorkomen gevaar voor de veiligheid of gezondheid dan wel hinder voor deze kunnen opleveren;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.1
  - number: 4.1.b
    text: |-
      grenswaarde: voor zover bij of krachtens deze afdeling of de [afdelingen 2][ref1] en [5][ref2] niet anders is
      bepaald, de limiet van de concentratie of van het tijdgewogen gemiddelde van de concentratie voor een gevaarlijke
      stof in de lucht in de ademhalingszone van een werknemer gedurende een bij of krachtens deze afdeling of de
      [afdelingen 2][ref3] en [5][ref4] gespecificeerde referentieperiode;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk4
