  - number: 4.55.1.c
    text: |-
      de voorzieningen die worden getroffen om de plaats waar de werkzaamheden worden verricht af te schermen van de
      overige ruimten;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.55
  - number: 4.55.1.d
    text: |-
      de maatregel om metingen te verrichten overeenkomstig het bepaalde krachtens [artikel 4.50, tweede lid][ref1],
      en om monsters te nemen overeenkomstig [artikel 4.50, achtste lid][ref2], nadat de ruimte is gereinigd,
      teneinde vast te stellen of de concentratie van asbeststof in de lucht niet hoger is dan 1/20 van de in
      [artikel 4.46, eerste lid][ref3], genoemde grenswaarde dan wel of de concentratie van crocidolietstof in de lucht
      niet hoger is dan 1/20 van de in [artikel 4.56, tweede lid][ref4], genoemde grenswaarde;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel4
