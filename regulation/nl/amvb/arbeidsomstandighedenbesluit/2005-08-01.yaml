  - number: 9.37.1
    text: |-
      [Paragraaf 2a van afdeling 1 van hoofdstuk 3][ref1] is tot 1 juli 2006 niet van toepassing op arbeidsplaatsen
      die gebieden bevatten waar een explosieve atmosfeer kan voorkomen die voor 30 juni 2003 in gebruik zijn genomen,
      behoudens indien de arbeidsplaats na deze laatste datum is gewijzigd, uitgebreid of verbouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.37
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '3'
        paragraaf: 2a
        afdeling: '1'
  - number: 9.37.2
    text: |-
      Artikel 3.5e, onder e, is niet van toepassing op arbeidsmiddelen voor gebruik op plaatsen waar een explosieve
      atmosfeer kan voorkomen die voor 30 juni 2003 in gebruik zijn genomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.37
  - number: 9.37a.1
    text: |-
      [Artikel 6.11c, tweede lid][ref1], is tot 6 juli 2010 niet van toepassing wanneer arbeidsmiddelen worden gebruikt
      die vóór 6 juli 2007 ter beschikking van de werknemers zijn gesteld en waarbij de grenswaarden voor blootstelling
      gezien de laatste technische ontwikkelingen en ondanks de uitvoering van organisatorische maatregelen niet in acht
      kunnen worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.37a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '2'
        afdeling: 3a
  - number: 9.37a.2
    text: |-
      In afwijking van het eerste lid is [artikel 6.11c, tweede lid][ref1], tot 6 juli 2014 niet van toepassing op
      arbeidsmiddelen die in de land- en bosbouw worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.37a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '2'
        afdeling: 3a
  - number: 9.37a.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de voorwaarden, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.37a
  - number: '9.38'
    text: |-
      Onze Minister zendt binnen 5 jaar na inwerkingtreding van dit besluit aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van dit besluit in de praktijk.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.38
  - number: '9.39'
    text: |-
      Een wijziging van een van de bijlagen bij een EG-richtlijn waarnaar in dit besluit wordt verwezen, gaat voor de
      toepassing van dit besluit en de daarop berustende bepalingen gelden met ingang van de dag waarop aan de betrokken
      wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de *Staatscourant* wordt
      bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.39
  - number: '9.40'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.40
  - number: '9.41'
    text: 'Dit besluit wordt aangehaald als: Arbeidsomstandighedenbesluit.'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.41
