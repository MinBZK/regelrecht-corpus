  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid en Onze Ministers van Onderwijs,
    Cultuur en Wetenschappen, Binnenlandse Zaken, Verkeer en Waterstaat, Justitie en de Staatssecretaris van Defensie
    van 12 juli 1996, Directie Wetgeving, Bestuurlijke en Juridische Aangelegenheden, nr. WBJA/W2/96/0407, gedaan mede
    namens de Minister-President, Minister van Algemene Zaken en in overeenstemming met de Minister van Economische
    Zaken;

    Gelet op de artikelen 1, 2, 4, 5, 6, 10, 20, 23a, 24, 24a, 25, 26, 27, 28, 30, 31a, 35, 36, en 41 van de
    Arbeidsomstandighedenwet en de artikelen 5 en 8 van de Winkeltijdenwet;

    Gezien het advies van de Sociaal-Economische Raad van 9 februari 1995, nr. 95/31 I en II;

    De Raad van State gehoord (advies van 24 september 1996, no.W12.960298);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid en Onze Ministers van
    Onderwijs, Cultuur en Wetenschappen, Binnenlandse Zaken, Verkeer en Waterstaat, Justitie en de Staatssecretaris van
    Defensie van 18 december 1996, Directie Wetgeving, Bestuurlijke en Juridische Aangelegenheden, nr. WBJA/W2/96/1537,
    uitgebracht mede namens de Minister-President, Minister van Algemene Zaken en in overeenstemming met de Minister
    van Economische Zaken ;

    Hebben goedgevonden en verstaan:
