        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '8'
        afdeling: '9'
      - id: ref10
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '9'
        afdeling: '9'
  - number: 4.86.3
    text: |-
      In alle, niet in het eerste en tweede lid bedoelde gevallen, wordt bij de arbeid de grootst mogelijke
      zorgvuldigheid, ordelijkheid en zindelijkheid in acht genomen en worden de noodzakelijke hygiënische voorzieningen
      getroffen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.86
  - number: 4.87.1
    text: |-
      Doeltreffende maatregelen worden genomen om te voorkomen dat werknemers tijdens hun arbeid kunnen worden
      blootgesteld aan biologische agentia in een zodanige mate dat schade kan worden toegebracht aan hun veiligheid
      of gezondheid.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.87
  - number: 4.87.2
    text: |-
      Ter naleving van het eerste lid worden zodanige technische of organisatorische maatregelen genomen, dat het gevaar
      voor blootstelling aan biologische agentia zoveel mogelijk bij de bron daarvan wordt voorkomen, waaronder mede
      is begrepen het toepassen van agentia waarbij werknemers, gelet op de eigenschappen van die agentia, de aard van
      de arbeid, de werkmethoden en de werkomstandigheden, aan zo min mogelijk gevaar voor hun veiligheid en gezondheid
      worden blootgesteld.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.87
  - number: 4.87.3
    text: |-
      Voor zover het op doeltreffende wijze voorkomen van blootstelling door het nemen van maatregelen als bedoeld in
      het tweede lid redelijkerwijs niet mogelijk is, worden de gevaren verbonden aan deze blootstelling zoveel als
      redelijkerwijs mogelijk is beperkt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.87
  - number: 4.87.4
    text: 'Ter uitvoering van het derde lid worden ten minste de volgende maatregelen genomen:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.87
  - number: 4.87.4.a
    text: de duur van de kans op blootstelling wordt zoveel mogelijk beperkt;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.87
  - number: 4.87.4.b
    text: |-
      het aantal werknemers dat gevaar loopt aan een of meer biologische agentia te worden blootgesteld is niet groter
      dan voor het verrichten van de arbeid strikt noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.87
  - number: 4.87.4.c
    text: |-
      er worden collectieve beschermingsmaatregelen genomen en, wanneer dit geen of geen afdoende bescherming biedt,
      worden persoonlijke beschermingsmiddelen ter beschikking gesteld;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.87
  - number: 4.87.4.d
    text: |-
      bij de arbeid wordt de grootst mogelijke ordelijkheid en zindelijkheid betracht om te voorkomen dan wel de kans te
      beperken dat een of meer biologische agentia buiten de arbeidsplaats terecht komen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.87
  - number: 4.87.4.e
    text: |-
      biologische agentia worden zodanig bewaard en vervoerd en afvalstoffen worden op zodanige wijze verzameld,
      opgeslagen en verwijderd, zo nodig na passende behandeling en voorzien van een deugdelijk opschrift, dat de kans
      op blootstelling zoveel mogelijk wordt voorkomen alsmede wordt voorkomen dat zij in handen van onbevoegden kunnen
      geraken;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.87
  - number: 4.87.4.f
    text: |-
      indien noodzakelijk en technisch mogelijk wordt onderzoek gedaan naar de aanwezigheid op de werkplek van
      biologische agentia buiten de eerste fysieke omhulling;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.87
  - number: 4.87.4.g
    text: |-
      op de arbeidsplaats is een doeltreffende schriftelijke werkinstructie voor de werknemers voorhanden, waarvan ten
      minste deel uitmaken de bij de arbeid in acht te nemen procedures, waaronder een regeling voor het veilig omgaan
      met en het vervoeren van biologische agentia binnen het bedrijf of de inrichting alsmede een doeltreffend noodplan
      voor het geval zich ongevallen of incidenten met biologische agentia voordoen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.87
  - number: '4.88'
    text: |-
      De plaatsen waar arbeid wordt verricht met biologische agentia worden duidelijk afgebakend en worden gemarkeerd met
      een signaal dat voldoet aan het bij of krachtens [afdeling 2 van hoofdstuk 8][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.88
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '8'
        afdeling: '2'
  - number: 4.89.1
    text: |-
      Op plaatsen waar gevaar bestaat voor blootstelling aan biologische agentia mag niet worden gerookt noch mag daar
      voedsel of drank worden genuttigd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.89
  - number: 4.89.2
    text: |-
      Werkkleding die voldoet aan [afdeling 1 van hoofdstuk 8][ref1] wordt aan de werknemers ter beschikking gesteld en
      wordt bij de arbeid gedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.89
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '8'
        afdeling: '1'
  - number: 4.89.3
    text: |-
      In aanvulling op [artikel 3.23][ref1] zijn voor de werknemers doelmatige sanitaire voorzieningen beschikbaar met
      inbegrip van douches, oogdouches en huidantiseptica.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.89
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: '1'
  - number: 4.89.4
    text: |-
      Indien aan de werknemer persoonlijke beschermingsmiddelen worden verstrekt, worden deze op een daartoe aangewezen
      plaats bewaard en na ieder gebruik gecontroleerd en gereinigd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.89
  - number: 4.89.5
    text: |-
      In aanvulling op [artikel 3.22][ref1] worden de werkkleding en andere persoonlijke beschermingsmiddelen waarin
      of waarop zich biologische agentia bevinden of kunnen bevinden, op een andere plaats opgeborgen dan de overige
      kleding.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.89
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: '1'
  - number: 4.89.6
    text: |-
      De in het vijfde lid bedoelde werkkleding en andere persoonlijke beschermingsmiddelen worden uitsluitend buiten
      het bedrijf of de inrichting gebracht indien dit geschiedt met het doel deze te laten reinigen, ontsmetten of
      vernietigen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.89
  - number: 4.89.7
    text: |-
      In gevallen als bedoeld in het zesde lid, worden de werkkleding en andere persoonlijke beschermingsmiddelen in een
      daartoe geschikte en gesloten verpakking vervoerd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.89
  - number: 4.90.1
    text: In een register wordt bijgehouden welke werknemers arbeid met biologische agentia van categorie 3 en 4 verrichten.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.90
  - number: 4.90.2
    text: |-
      In dit register wordt tevens per werknemer geregistreerd welke werkzaamheden hij heeft verricht en, voor zover dit
      te bepalen is, aan welk biologisch agens of welke biologische agentia hij als gevolg van deze werkzaamheden of als
      gevolg van een incident of ongeval, is of mogelijkerwijs is blootgesteld.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.90
  - number: 4.90.3
    text: |-
      Het in het eerste lid bedoelde register wordt ten minste tien jaar na de laatste blootstelling of mogelijke
      blootstelling bewaard.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.90
  - number: 4.90.4
    text: |-
      In geval een werknemer is blootgesteld of mogelijk is blootgesteld aan een biologisch agens dat infecties tot
      gevolg kan hebben die:
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.90
  - number: 4.90.4.a
    text: naar bekend is hardnekkig of latent kunnen zijn;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.90
  - number: 4.90.4.b
    text: op basis van de huidige stand van de techniek naar verwachting eerst jaren later kunnen worden onderkend;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.90
  - number: 4.90.4.c
    text: een lange incubatietijd hebben;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.90
  - number: 4.90.4.d
    text: ondanks behandeling steeds weer terugkeren, of
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.90
  - number: 4.90.4.e
    text: |-
      ernstige complicaties op lange termijn hebben, wordt het in het eerste lid bedoelde register een navenant langere
      tijd doch niet meer dan veertig jaar na de laatste blootstelling bewaard.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.90
  - number: 4.90.5
    text: Iedere werknemer heeft recht op inzage in de hem betreffende gegevens uit het register.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.90
  - number: 4.90.6
    text: |-
      Aan de deskundige persoon, bedoeld in [artikel 2.14a, tweede lid][ref1], of de arbodienst wordt desgevraagd inzage
      verschaft in het register, genoemd in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.90
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '3'
  - number: 4.91.1
    text: |-
      Iedere werknemer die arbeid verricht met biologische agentia wordt in aanvulling op [artikel 18 van de wet][ref1],
      in de gelegenheid gesteld bij de aanvang van die arbeid een arbeidsgezondheidskundig onderzoek te ondergaan.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel18
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.91
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '18'
  - number: 4.91.2
    text: |-
      Iedere werknemer die een infectie of ziekte heeft opgelopen als gevolg van blootstelling aan een biologisch
      agens, wordt, in aanvulling op het eerste lid, tussentijds in de gelegenheid gesteld een arbeidsgezondheidskundig
      onderzoek te ondergaan.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.91
  - number: 4.91.3
    text: |-
      Iedere werknemer die aan een zelfde biologisch agens is blootgesteld als gevolg waarvan een andere werknemer een
      infectie of ziekte heeft opgelopen, wordt, in aanvulling op het eerste lid, tussentijds in de gelegenheid gesteld
      een arbeidsgezondheidskundig onderzoek te ondergaan.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.91
  - number: 4.91.4
    text: |-
      Het arbeidsgezondheidskundig onderzoek vindt plaats met inachtneming van de praktische aanbevelingen, opgenomen in
      bijlage IV bij de richtlijn.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.91
  - number: 4.91.5
    text: |-
      Indien het resultaat van het arbeidsgezondheidskundig onderzoek daartoe aanleiding geeft, worden doeltreffende
      maatregelen genomen om schade voor de gezondheid van de betrokken werknemer door blootstelling aan biologische
      agentia te voorkomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.91
  - number: 4.91.6
    text: |-
      Voor zover mogelijk worden aan iedere werknemer die nog niet immuun is voor de biologische agentia waaraan hij is
      of waarschijnlijk zal worden blootgesteld, doeltreffende vaccins ter beschikking gesteld. Daarbij wordt bijlage VII
      bij de richtlijn in acht genomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.91
  - number: 4.91.7
    text: |-
      Op verzoek van de werkgever of de betrokken werknemer wordt het in dit artikel bedoelde onderzoek opnieuw
      uitgevoerd. Het resultaat van het hernieuwde onderzoek treedt in de plaats van het daaraan voorafgaande.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.91
  - number: 4.91.8
    text: Iedere werknemer heeft recht op inzage in het hem betreffende medisch dossier.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.91
  - number: 4.91.9
    text: |-
      De resultaten van het in dit artikel bedoelde arbeidsgezondheidskundig onderzoek worden in passende vorm
      geregistreerd en ten minste tien jaar na de laatste blootstelling of mogelijke blootstelling bewaard. In gevallen
      als bedoeld in [artikel 4.90, vierde lid][ref1], worden de resultaten een navenant langere tijd doch niet meer dan
      veertig jaar bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.91
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '9'
  - number: 4.91.10
    text: |-
      Iedere werknemer wordt geïnformeerd over de wijze waarop hij na beëindiging van de blootstelling in de gelegenheid
      wordt gesteld een arbeidsgezondheidskundig onderzoek te ondergaan.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.91
  - number: '4.92'
    text: |-
      De ondernemingsraad of de personeelsvertegenwoordiging of, bij het ontbreken daarvan, de belanghebbende werknemers
      wordt respectievelijk worden op de hoogte gesteld van ieder ongeval of incident dat zich heeft voorgedaan, zich
      bijna heeft voorgedaan of zich mogelijkerwijs heeft voorgedaan met biologische agentia en dat heeft geleid tot het
      vrijkomen, net niet vrijkomen of mogelijkerwijs vrijkomen van een agens of agentia van categorie 2, 3 of 4. Daarbij
      worden tevens de oorzaken van het ongeval of incident meegedeeld, alsmede de maatregelen die zijn genomen of zullen
      worden genomen om de gevolgen te verhelpen en verdere ongevallen of incidenten te voorkomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.92
  - number: 4.93.1
    text: |-
      Desgevraagd wordt de ondernemingsraad of de personeelsvertegenwoordiging, of worden, bij het ontbreken daarvan, de
      belanghebbende werknemers geïnformeerd over:
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.93
  - number: 4.93.1.a
    text: |-
      de wijze waarop de risico-inventarisatie en -evaluatie, bedoeld in [artikel 4.85][ref1], tot stand is gekomen en
      over het resultaat daarvan;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.93
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '9'
  - number: 4.93.1.b
    text: de werkzaamheden waarbij de werknemers aan biologische agentia worden of kunnen worden blootgesteld;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.93
  - number: 4.93.1.c
    text: het aantal werknemers dat aan biologische agentia wordt of kan worden blootgesteld;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.93
  - number: 4.93.1.d
    text: de naam en de functie van de persoon die verantwoordelijk is voor de veiligheid en de gezondheid op het werk;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.93
  - number: 4.93.1.e
    text: |-
      de genomen preventieve en beschermende maatregelen waaronder mede wordt verstaan de werkinstructie, bedoeld in
      [artikel 4.87, vierde lid][ref1], de toegepaste arbeidsprocédés en werkmethoden.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.93
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '9'
  - number: 4.93.2
    text: |-
      De ondernemingsraad of de personeelsvertegenwoordiging heeft of, bij het ontbreken daarvan, de belanghebbende
      werknemers hebben recht op inzage in de in dit artikel bedoelde informatie in statistische, niet tot individuen
      herleidbare vorm.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.93
  - number: 4.94.1
    text: |-
      Ten minste 30 dagen voordat voor de eerste maal arbeid met een of meer biologische agentia van categorie 2, 3 of
      4 wordt verricht, wordt hiervan een schriftelijke kennisgeving gezonden aan een daartoe aangewezen ambtenaar als
      bedoeld in [artikel 24, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.94
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 4.94.2
    text: 'Deze kennisgeving bevat ten minste de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.94
  - number: 4.94.2.a
    text: de naam en het adres van de werkgever;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.94
  - number: 4.94.2.b
    text: de naam en de functie van de persoon die verantwoordelijk is voor de veiligheid en de gezondheid op het werk;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.94
  - number: 4.94.2.c
    text: |-
      de resultaten van de in [artikel 4.85][ref1] bedoelde risico-inventarisatie en -evaluatie;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.94
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '9'
  - number: 4.94.2.d
    text: |-
      de categorie of categorieën en soort of soorten waartoe het biologische agens of de biologische agentia behoort
      respectievelijk behoren;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.94
  - number: 4.94.2.e
    text: de voorgenomen beschermende en preventieve maatregelen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.94
  - number: 4.94.3
    text: |-
      Met inachtneming van het eerste lid wordt tevens kennis gegeven van arbeid met ieder volgend nieuw biologisch agens
      van categorie 3 en ieder volgend biologisch agens van categorie 4.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.94
  - number: 4.94.4
    text: |-
      In afwijking van het eerste en derde lid wordt de in het eerste lid bedoelde ambtenaar in geval alleen
      diagnostische arbeid wordt verricht, hiervan slechts in kennis gesteld, indien deze arbeid voor de eerste maal
      wordt verricht.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.94
  - number: 4.94.5
    text: |-
      De in dit artikel bedoelde kennisgeving wordt opnieuw gedaan, indien er in de procédés of procedures veranderingen
      hebben plaatsgevonden die gevolgen kunnen hebben voor de veiligheid en de gezondheid van de werknemers, waardoor
      eerdere kennisgevingen zijn achterhaald.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.94
  - number: '4.95'
    text: |-
      Een daartoe aangewezen ambtenaar als bedoeld in [artikel 24, eerste lid, van de wet][ref1] wordt zo spoedig
      mogelijk schriftelijk op de hoogte gesteld van ieder ongeval of incident dat zich heeft voorgedaan en heeft geleid
      of mogelijkerwijs heeft geleid tot het vrijkomen van een of meer biologische agentia van categorie 3 of 4.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.95
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: '4.96'
    text: |-
      In geval de werkgever de werkzaamheden beëindigt worden het in [artikel 4.90][ref1] bedoelde register
      en de resultaten van het in [artikel 4.91][ref2] bedoelde arbeidsgezondheidskundig onderzoek, in
      geval deze bij de werkgever berusten, overgedragen aan een daartoe aangewezen ambtenaar als bedoeld in
      [artikel 24, eerste lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.96
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
        afdeling: '9'
      - id: ref3
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 4.97.1
    text: |-
      In aanvulling op [artikel 4.85][ref1] wordt bij de risico-inventarisatie en -evaluatie van gevaren, verbonden aan
      andere dan microbiologisch diagnostische arbeid in de gezondheidszorg en in de diergeneeskunde, aandacht besteed
      aan:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.97
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '9'
  - number: 4.97.1.a
    text: |-
      de onzekerheid omtrent de aanwezigheid van biologische agentia en de daaraan verbonden gevaren bij patiënten of
      dieren en in monsters of materiaal van patiënten of dieren;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.97
  - number: 4.97.1.b
    text: de aan de aard van het werk verbonden gevaren.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.97
  - number: 4.97.2
    text: |-
      Bij de in het eerste lid bedoelde arbeid worden ter bescherming van de veiligheid en de gezondheid van de betrokken
      werknemers doeltreffende maatregelen genomen. Deze bestaan in ieder geval uit:
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.97
  - number: 4.97.2.a
    text: het opstellen en bekend maken van ontsmettings- en desinfectieprocedures aan de betrokken werknemers;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.97
  - number: 4.97.2.b
    text: |-
      het opstellen en bekend maken van procedures voor een veilige omgang met en verwijdering van met biologische
      agentia besmet afvalmateriaal.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.97
  - number: '4.98'
    text: |-
      In isolatieafdelingen met patiënten of dieren die besmet zijn of mogelijkerwijs besmet zijn met biologische agentia
      van categorie 3 of 4, worden passende beschermingsmaatregelen als bedoeld in bijlage V, kolom A, bij de richtlijn
      getroffen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.98
  - number: 4.99.1
    text: |-
      In laboratoria en in ruimten waarin zich dieren bevinden die opzettelijk zijn besmet met biologische agentia van
      categorie 2, 3 of 4 dan wel dieren die drager zijn of mogelijk zouden kunnen zijn van biologische agentia van een
      van deze categorieën, worden, afhankelijk van de resultaten van de risico-inventarisatie en -evaluatie, bedoeld in
      [artikel 4.85][ref1], ten minste respectievelijk de beheersingsniveaus 2, 3 en 4 van bijlage V bij de richtlijn in
      acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.99
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '6'
        afdeling: '9'
  - number: 4.99.2
    text: |-
      Indien in de in het eerste lid bedoelde laboratoria arbeid wordt verricht met materiaal waarvan onzeker is of
      zich hierin biologische agentia van categorie 2, 3 of 4 bevinden en de arbeid niet is gericht op het werken met
      biologische agentia, wordt ten minste beheersingsniveau 2 van bijlage V bij de richtlijn in acht genomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.99
  - number: 4.100.1
    text: |-
      In geval biologische agentia van de categorie 2, 3 of 4 worden gebruikt in industriële procédés, worden,
      afhankelijk van de resultaten van de risico-inventarisatie en -evaluatie, bedoeld in [artikel 4.85][ref1], ten
      minste respectievelijk de beheersingsniveaus 2, 3 en 4 van bijlage VI bij de richtlijn in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.100
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '9'
  - number: 4.100.2
    text: |-
      Van industriële procédés, bedoeld in het eerste lid, is sprake indien de arbeid is gericht op het werken met
      biologische agentia van categorie 2, 3 of 4 in reactorvaten van tien liter of meer.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.100
  - number: '4.101'
    text: |-
      Indien arbeid als bedoeld in deze paragraaf wordt verricht met biologische agentia die niet op grond van bijlage
      III bij de richtlijn in een van de in [artikel 4.84, derde lid][ref1], bedoelde categorieën zijn ingedeeld, maar
      waarvan wel aanwijzingen bestaan dat deze agentia naar verwachting dienen te worden ingedeeld in categorie 3 of 4,
      wordt ten minste beheersingsniveau 3 van bijlage V respectievelijk VI bij de richtlijn in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.101
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '9'
  - number: '4.102'
    text: |-
      Aan werknemers die arbeid verrichten als bedoeld in [artikel 4.86, eerste en tweede lid][ref1] wordt voorlichting
      en onderricht gegeven, waarbij ten minste aandacht wordt besteed aan:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.102
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '9'
  - number: 4.102.a
    text: de mogelijke gevaren voor de gezondheid die zijn verbonden aan het werken met biologische agentia;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.102
  - number: 4.102.b
    text: de te treffen voorzorgsmaatregelen om blootstelling te voorkomen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.102
  - number: 4.102.c
    text: de te nemen actie in geval zich een ongeval voordoet met biologische agentia;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.102
  - number: 4.102.d
    text: de bestaande hygiënische voorschriften;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.102
  - number: 4.102.e
    text: het dragen en gebruiken van werkkleding en persoonlijke beschermingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.102
  - number: 4.103.1
    text: |-
      [Artikel 4.3][ref1] is niet van toepassing voor zover de [Wet vervoer gevaarlijke stoffen][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007606
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.103
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0007606
  - number: 4.103.2
    text: |-
      [Artikel 4.7][ref1] is niet van toepassing op tankschepen die zich buiten Nederland bevinden.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.103
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '1'
  - number: '4.104'
    text: |-
      In aanvulling op het bepaalde bij of krachtens dit hoofdstuk, gelden voor jeugdige werknemers tevens de in deze
      paragraaf genoemde voorschriften en verboden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.104
  - number: 4.105.1
    text: |-
      Jeugdige werknemers mogen geen arbeid verrichten met stoffen die voldoen aan de krachtens de [artikelen 34][ref1],
      derde lid, en [39 van de Wet milieugevaarlijke stoffen][ref2] vastgestelde criteria voor indeling in een of meer
      van de categorieën «zeer vergiftig», «vergiftig», «sensibiliserend», «kankerverwekkend», «mutageen» en «voor de
      voortplanting vergiftig», alsmede stoffen die voldoen aan de bij of krachtens die wet vastgestelde criteria voor
      toekenning van een van de volgende R-zinnen:


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel39
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.105
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '39'
  - number: 4.105.1.a
    text: gevaar voor cumulatieve effecten (R33);
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.105
  - number: 4.105.1.b
    text: gevaar voor ernstige schade aan de gezondheid bij langdurige blootstelling (R48).
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.105
  - number: 4.105.2
    text: |-
      Jeugdige werknemers mogen geen arbeid verrichten met biologische agentia van categorie 3 of 4, bedoeld in
      [afdeling 9][ref1] van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.105
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '4'
        afdeling: '9'
  - number: 4.105.3
    text: |-
      Voorts mogen jeugdige werknemers geen arbeid verrichten aan of met kuipen, bassins, leidingen of reservoirs waarin
      zich een of meer van de in het eerste of tweede lid bedoelde stoffen of biologische agentia bevinden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.105
  - number: '4.106'
    text: |-
      [Artikel 1.37, tweede lid][ref1], is van overeenkomstige toepassing op jeugdige werknemers die:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.106
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '8'
  - number: 4.106.a
    text: |-
      arbeid verrichten met stoffen die voldoen aan de krachtens de [artikelen 34][ref1], derde lid, en
      [39 van de Wet milieugevaarlijke stoffen][ref2] vastgestelde criteria voor indeling:


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel39
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.106
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '39'
  - number: 4.106.a.1
    text: in een of meer van de categorieën, «ontplofbaar», «bijtend» en «irriterend»;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.106
  - number: 4.106.a.2
    text: |-
      in de categorie «schadelijk», indien deze stoffen tevens voldoen aan de bij of krachtens de
      [Wet milieugevaarlijke stoffen][ref1] vastgestelde criteria voor toekenning van R-zin «onherstelbare effecten zijn
      niet uitgesloten» (R40);


      [ref1]: https://wetten.overheid.nl/BWBR0003892
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.106
    references:
      - id: ref1
        bwb_id: BWBR0003892
  - number: 4.106.b
    text: |-
      arbeid verrichten met persgassen, onder druk vloeibaar gemaakte gassen, door sterke temperatuurverlaging vloeibaar
      gemaakte gassen en opgeloste gassen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.106
  - number: 4.106.c
    text: |-
      arbeid verrichten aan of met kuipen, bassins, leidingen of reservoirs waarin zich een of meer van de onder *a* of
      *b* bedoelde stoffen of gassen bevinden;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.106
  - number: 4.106.d
    text: artikelen die ontplofbare stoffen bevatten, vervaardigen of hanteren.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.106
  - number: '4.107'
    text: |-
      In aanvulling op het bepaalde bij of krachtens dit hoofdstuk gelden voor zwangere werknemers en werknemers tijdens
      de lactatie tevens de in deze paragraaf genoemde voorschriften.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.107
  - number: '4.108'
    text: |-
      Het is een zwangere werknemer en een werknemer tijdens de lactatie verboden arbeid te verrichten met loodwit als
      bedoeld in [afdeling 7 van dit hoofdstuk][ref1] alsmede met metallisch lood en zijn ionverbindingen waarvoor op
      grond van [artikel 4.8b, tweede lid][ref2], een biologische grenswaarde is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.108
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '4'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
        afdeling: '1'
  - number: '4.109'
    text: |-
      Het is een zwangere werknemer verboden arbeid te verrichten met de biologische agentia Toxoplasma en Rubellavirus,
      bedoeld in [afdeling 9 van dit hoofdstuk][ref1], tenzij is gebleken dat zij hiervoor immuun is.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.109
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '4'
        afdeling: '9'
  - number: '4.110'
    text: 'Thuiswerk met gevaarlijke stoffen is uitsluitend toegestaan met een of meer van de volgende stoffen:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.110
  - number: 4.110.a
    text: |-
      stoffen die bij uitsluiting voldoen aan de krachtens de [artikelen 34][ref1], derde lid, en
      [39 van de Wet milieugevaarlijke stoffen][ref2] vastgestelde criteria voor indeling in de categorieën «schadelijk»,
      «irriterend», «ontvlambaar» en «milieugevaarlijk», tenzij deze stoffen voldoen aan de bij of krachtens die wet
      vastgestelde criteria voor toekenning van een van de volgende R-zinnen:


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel39
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.110
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '39'
  - number: 4.110.a.1°
    text: in droge toestand ontplofbaar (R1);
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.110
  - number: 4.110.a.2°
    text: vormt met metalen zeer gemakkelijk ontplofbare verbindingen (R4);
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.110
  - number: 4.110.a.3°
    text: ontploffingsgevaar door verwarming (R5);
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.110
  - number: 4.110.a.4°
    text: ontplofbaar met en zonder lucht (R6);
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.110
  - number: 4.110.a.5°
    text: reageert heftig met water (R14);
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.110
  - number: 4.110.a.6°
    text: kan ontplofbare peroxiden vormen (R19);
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.110
  - number: 4.110.a.7°
    text: vormt vergiftig gas in contact met water (R29);
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.110
  - number: 4.110.a.8°
    text: kan bij gebruik licht ontvlambaar worden (R30);
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.110
  - number: 4.110.a.9°
    text: vormt vergiftige gassen in contact met zuren (R31);
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.110
  - number: 4.110.a.10°
    text: vormt zeer vergiftige gassen in contact met zuren (R32);
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.110
  - number: 4.110.a.11°
    text: gevaar voor cumulatieve effecten (R33);
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.110
  - number: 4.110.a.12°
    text: onherstelbare effecten zijn niet uitgesloten (R40);
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.110
  - number: 4.110.a.13°
    text: ontploffingsgevaar bij verwarming in afgesloten toestand (R44);
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.110
  - number: 4.110.a.14°
    text: gevaar voor ernstige schade aan de gezondheid bij langdurige blootstelling (R48), en
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.110
  - number: 4.110.a.15°
    text: kan schadelijk zijn via de borstvoeding (R64);
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.110
  - number: 4.110.b
    text: |-
      stoffen die aan geen van de krachtens de [artikelen 34][ref1], derde lid, en
      [39 van de Wet milieugevaarlijke stoffen][ref2] vastgestelde criteria voor indeling voldoen, tenzij deze stoffen
      de bijzondere gevaarsaanduidingen dragen, genoemd in bijlage V, deel B, onderdeel 2° of 6° bij [richtlijn nr.
      1999/45/EG](31999L0045) van het Europees Parlement en de Raad van de Europese Unie van 31 mei 1999 betreffende de
      onderlinge aanpassing van de wettelijke en bestuursrechtelijke bepalingen van de lidstaten inzake de indeling, de
      verpakking en het kenmerken van gevaarlijke preparaten (PbEG L 200).


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel39
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.110
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '39'
  - number: '4.111'
    text: |-
      Met betrekking tot de in [artikel 4.110, onder a][ref1], genoemde stoffen, met uitzondering
      van stoffen die uitsluitend voldoen aan de krachtens de [artikelen 34, derde lid][ref2], en
      [39 van de Wet milieugevaarlijke stoffen][ref3] vastgestelde criteria voor indeling in de categorie
      «milieugevaarlijk», wordt in het kader van de risico-inventarisatie en -evaluatie, bedoeld in
      [artikel 5 van de wet][ref4], in ieder geval vastgesteld aan welke stoffen thuiswerkers worden of kunnen worden
      blootgesteld en wat de gevaren zijn die aan die stoffen zijn verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0003892#Artikel39
      [ref4]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.111
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
        afdeling: '10'
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '34'
      - id: ref3
        bwb_id: BWBR0003892
        artikel: '39'
      - id: ref4
        bwb_id: BWBR0010346
        artikel: '5'
  - number: 4.112.1
    text: |-
      Met betrekking tot de verpakking van een stof die gevaar voor de veiligheid en
      gezondheid kan opleveren alsmede met betrekking tot de sluiting van die verpakking, is
      [artikel 35, eerste tot en met derde lid, van de Wet milieugevaarlijke stoffen][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel35
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.112
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '35'
  - number: 4.112.2
    text: |-
      Op de verpakking van een stof, bedoeld in het eerste lid, worden de aanduidingen welke voor die stof op grond van
      het voldoen aan de criteria voor indeling in de categorieën, genoemd in [artikel 4.110, onder a][ref1], ten behoeve
      van de aflevering van die stof bij of krachtens de [Wet milieugevaarlijke stoffen][ref2] zijn voorgeschreven,
      opvallend en goed leesbaar vermeld, met uitzondering van de aanduidingen die betrekking hebben op de categorie
      «milieugevaarlijk».


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003892
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.112
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
        afdeling: '10'
      - id: ref2
        bwb_id: BWBR0003892
  - number: '4.113'
    text: |-
      Doeltreffende maatregelen zijn genomen om te voorkomen dat thuiswerkers bij hun arbeid kunnen worden blootgesteld
      aan stoffen in zodanige mate, dat schade kan worden toegebracht aan hun gezondheid of dat aan thuiswerkers hinder
      kan worden veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.113
  - number: '4.114'
    text: |-
      Indien met brandgevaarlijke stoffen wordt gewerkt, zijn in aanvulling op [afdeling 4 van hoofdstuk 2][ref1], aan de
      thuiswerker deugdelijke en doelmatige middelen voor het blussen of doven van een brand ter beschikking gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.114
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '2'
        afdeling: '4'
  - number: 4.115.1
    text: |-
      Indien stoffen aanwezig zijn die gevaar voor de veiligheid en de gezondheid van thuiswerkers kunnen opleveren, zijn
      zodanige voorzieningen getroffen dat het gevaar, dat zich met betrekking tot die stoffen een ongewilde gebeurtenis
      voordoet, zoveel mogelijk is vermeden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.115
  - number: 4.115.2
    text: |-
      Bij het verrichten van arbeid met stoffen als bedoeld in het eerste lid zijn zodanige voorzieningen getroffen, dat
      het gevaar, dat zich bij die arbeid een ongewilde gebeurtenis voordoet, zoveel mogelijk is vermeden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.115
  - number: 4.115.3
    text: |-
      Voorts zijn in aanvulling op [afdeling 4 van hoofdstuk 2][ref1] zodanige voorzieningen getroffen dat in geval zich
      een ongewilde gebeurtenis als bedoeld in het eerste respectievelijk het tweede lid voordoet, de gevolgen daarvan
      zoveel mogelijk worden beperkt.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.115
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '2'
        afdeling: '4'
  - number: '5.1'
    text: |-
      In deze afdeling wordt verstaan onder richtlijn: [Richtlijn nr. 90/269/EEG](31990L0269) van de Raad van de Europese
      Gemeenschappen van 29 mei 1990 betreffende de minimum veiligheids- en gezondheidsvoorschriften voor het handmatig
      hanteren van lasten met gevaar voor met name rugletsel voor de werknemers (*PbEG* L 156).
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel5.1
  - number: '5.2'
    text: |-
      De arbeid wordt zodanig georganiseerd, de arbeidsplaats wordt zodanig ingericht, een zodanige productieen
      werkmethode wordt toegepast of zodanige hulpmiddelen en persoonlijke beschermingsmiddelen, worden gebruikt, dat de
      fysieke belasting geen gevaren met zich kan brengen voor de veiligheid en de gezondheid van de werknemer.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel5.2
  - number: 5.3.1
    text: |-
      Voor zover de in [artikel 5.2][ref1] bedoelde gevaren redelijkerwijs niet kunnen worden voorkomen, wordt de arbeid
      zodanig georganiseerd, wordt de arbeidsplaats zodanig ingericht, wordt een zodanige productie- en werkmethode
      toegepast en worden zodanige hulpmiddelen en persoonlijke beschermingsmiddelen, gebruikt, dat die gevaren zoveel
      als redelijkerwijs mogelijk is worden beperkt.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '1'
  - number: 5.3.2
    text: |-
      Bij de uitvoering van het eerste lid worden in het kader van de risico-inventarisatie en -evaluatie,
      bedoeld in [artikel 5 van de wet][ref1], met inachtneming van bijlage I bij de richtlijn, de veiligheids- en
      gezondheidsaspecten van de fysieke belasting beoordeeld, waarbij met name gelet wordt op de kenmerken van de last,
      de vereiste lichamelijke inspanning, de kenmerken van de werkomgeving en de eisen van de taak.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
  - number: 5.4.1
    text: |-
      Aan een werknemer die arbeid verricht, welke geheel of gedeeltelijk zittend kan worden uitgevoerd, is daartoe een
      doelmatige zitgelegenheid ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel5.4
  - number: 5.4.2
    text: |-
      Aan werknemers die arbeid verrichten, welke staande moet worden uitgevoerd, doch waarbij het arbeidsproces hun
      toelaat van tijd tot tijd te gaan zitten, is een voldoende aantal doelmatige zitgelegenheden ter beschikking
      gesteld.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel5.4
  - number: 5.5.1
    text: |-
      Aan werknemers die arbeid verrichten waarbij sprake is van het handmatig hanteren van lasten wordt doeltreffende
      voorlichting en doeltreffend onderricht gegeven over:
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel5.5
  - number: 5.5.1.a
    text: de wijze waarop lasten gehanteerd worden;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel5.5
  - number: 5.5.1.b
    text: |-
      de aan het handmatig hanteren van lasten verbonden gevaren voor hun veiligheid en gezondheid en de te nemen
      maatregelen om deze gevaren zo veel mogelijk te beperken.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel5.5
  - number: 5.5.2
    text: |-
      Aan de betrokken werknemers wordt adequate informatie verstrekt over het gewicht van de te hanteren last en,
      wanneer het gewicht van de last niet gelijk verdeeld is, over het zwaartepunt of de zwaarste kant van die last.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel5.5
  - number: '5.6'
    text: Met betrekking tot fysieke belasting worden de bijlagen I en II bij de richtlijn in acht genomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel5.6
  - number: '5.7'
    text: 'In deze afdeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel5.7
  - number: 5.7.a
    text: 'beeldscherm: een alfanumeriek of grafisch scherm, ongeacht het gebruikte afbeeldingsprocédé;'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel5.7
  - number: 5.7.b
    text: |-
      werkplek: het beeldscherm en het geheel van de daarbij behorende beeldschermapparatuur waarvan een werknemer
      gebruik maakt, met inbegrip van de onmiddellijke werkomgeving.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel5.7
  - number: 5.8.1
    text: 'Deze afdeling is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel5.8
  - number: 5.8.1.a
    text: bestuurdersplaatsen op machines;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel5.8
  - number: 5.8.1.b
    text: computersystemen die in de eerste plaats bestemd zijn voor gebruik door het publiek;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel5.8
  - number: 5.8.1.c
    text: zogenoemde draagbare systemen die niet aanhoudend worden gebruikt op een werkplek;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel5.8
  - number: 5.8.1.d
    text: |-
      rekenmachines, kassa’s en andere apparatuur die voorzien zijn van een klein display voor gegevens of hoeveelheden,
      nodig voor het directe gebruik van die apparatuur;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel5.8
  - number: 5.8.1.e
    text: conventionele schrijfmachines met display.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel5.8
  - number: 5.8.2
    text: |-
      Voorts is deze afdeling niet van toepassing op arbeid waarbij een werknemer gewoonlijk minder dan twee uren per
      etmaal gebruik maakt van een beeldscherm.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel5.8
  - number: 5.9.1
    text: |-
      In de risico-inventarisatie en -evaluatie, bedoeld in [artikel 5 van de wet][ref1], wordt specifiek aandacht
      besteed aan de gevaren voor het gezichtsvermogen en die van de fysieke en psychische belasting als gevolg van
      arbeid aan een beeldscherm.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
  - number: 5.9.2
    text: |-
      Op basis van de uitkomsten van de in het eerste lid bedoelde risico-inventarisatie en -evaluatie worden
      doeltreffende maatregelen genomen om de desbetreffende gevaren te ondervangen, rekening houdend met de gevolgen van
      die gevaren en de onderlinge samenhang daartussen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel5.9
  - number: '5.10'
    text: |-
      De arbeid aan een beeldscherm is zodanig georganiseerd dat deze arbeid telkens na ten hoogste twee
      achtereenvolgende uren wordt afgewisseld door andersoortige arbeid of door een rusttijd, zodanig dat de belasting
      van het verrichten van de arbeid aan een beeldscherm wordt verlicht.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel5.10
  - number: 5.11.1
    text: |-
      Iedere werknemer die voor de eerste keer belast wordt met arbeid aan een beeldscherm wordt, in aanvulling
      op [artikel 18 van de wet][ref1], in de gelegenheid gesteld om vóór de aanvang van die arbeid een
      arbeidsgezondheidskundig onderzoek te ondergaan. Dit onderzoek heeft in ieder geval betrekking op de ogen en het
      gezichtsvermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel18
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel5.11
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '18'
  - number: 5.11.2
    text: |-
      De werknemer wordt opnieuw in de gelegenheid gesteld een onderzoek als bedoeld in het eerste lid, te ondergaan,
      indien zich bij hem gezichtsstoornissen voordoen die het gevolg kunnen zijn van het verrichten van arbeid aan een
      beeldscherm.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel5.11
  - number: 5.11.3
    text: |-
      Indien de resultaten van het onderzoek, bedoeld in het eerste en het tweede lid, dit vereisen, wordt de betrokken
      werknemer in de gelegenheid gesteld een oftalmologisch onderzoek te ondergaan.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel5.11
  - number: 5.11.4
    text: |-
      Indien de resultaten van het onderzoek, bedoeld in het eerste tot en met het derde lid, dit vereisen en normale
      oogcorrectiemiddelen niet kunnen worden gebruikt, worden aan de betrokken werknemer speciale, met de desbetreffende
      arbeid verband houdende, oogcorrectiemiddelen verstrekt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel5.11
  - number: '5.12'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de werkplek en de wisselwerking tussen de
      gebruikte programmatuur en de werknemers.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel5.12
  - number: '5.13'
    text: 'Afdeling 2 van dit hoofdstuk is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel5.13
  - number: 5.13.a
    text: bestuurdersplaatsen op een voertuig op een openbare weg of spoorweg;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel5.13
  - number: 5.13.b
    text: |-
      computersystemen in een luchtvaartuig, een zeeschip of een binnenvaartuig dan wel een voertuig op een openbare weg
      of spoorweg.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel5.13
  - number: '5.14'
    text: |-
      Op thuiswerk zijn de [afdelingen 1][ref1] en [2 van dit hoofdstuk][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '5'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008498
        hoofdstuk: '5'
        afdeling: '2'
  - number: 5.15.1
    text: |-
      De arbeidsplaats van een thuiswerker is zodanig ingericht dat de arbeid zoveel mogelijk zittend op ergonomisch
      verantwoorde wijze kan worden verricht. Daartoe zijn een doelmatige zitgelegenheid en een doelmatig werkblad of een
      doelmatige werktafel ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel5.15
  - number: 5.15.2
    text: |-
      Indien de thuiswerker reeds uit eigen hoofde beschikt over de in het eerste lid bedoelde voorzieningen, behoeven
      deze niet alsnog ter beschikking te worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel5.15
  - number: 6.1.1
    text: Het klimaat op de arbeidsplaats veroorzaakt geen schade aan de gezondheid van de werknemers.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.1
  - number: 6.1.2
    text: |-
      Het klimaat op de arbeidsplaats is zo behaaglijk en gelijkmatig als redelijkerwijs mogelijk. Daarbij wordt rekening
      gehouden met de aard van de werkzaamheden die door de werknemers worden verricht en de fysieke belasting die het
      gevolg is van die werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.1
  - number: 6.1.3
    text: Hinderlijke tocht op de arbeidsplaats wordt vermeden tenzij dat redelijkerwijs niet kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.1
  - number: 6.1.4
    text: |-
      Indien door het klimaat op de arbeidsplaats toch schade aan de gezondheid van de werknemers kan ontstaan, worden
      persoonlijke beschermingsmiddelen ter beschikking gesteld. Indien de ter beschikking gestelde persoonlijke
      beschermingsmiddelen schade aan de gezondheid niet kunnen voorkomen, wordt de duur van de arbeid in een zodanige
      mate beperkt of wordt de arbeid met een zodanige frequentie afgewisseld door een tijdelijk verblijf op een plaats
      waar een klimaat heerst als bedoeld in het eerste lid, dat geen schade aan de gezondheid ontstaat.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.1
  - number: 6.2.1
    text: Op de arbeidsplaats is voldoende niet verontreinigde lucht aanwezig.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.2
  - number: 6.2.2
    text: Luchtverversingsinstallaties zijn altijd bedrijfsklaar.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.2
  - number: 6.2.3
    text: |-
      Luchtverversingsinstallaties zijn voorzien van een controlesysteem dat storingen in de installatie signaleert voor
      zover dat noodzakelijk is voor de gezondheid van de werknemers.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.2
  - number: 6.2.4
    text: |-
      Het eerste lid is niet van toepassing op arbeidsplaatsen in een gebouw als bedoeld in
      [artikel 1, eerste lid, onder c, van de Woningwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
  - number: 6.2.5
    text: |-
      Een arbeidsplaats in een gebouw als bedoeld in [artikel 1, eerste lid, onder c, van de Woningwet][ref1]
      wordt slechts gebruikt indien het gebouw voldoet aan de bij of krachtens het [Bouwbesluit 2003][ref2] gegeven
      voorschriften met betrekking tot de van toepassing zijnde gebruiksfunctie in de zin van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0012727
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0012727
  - number: 6.3.1
    text: |-
      Arbeidsplaatsen en de directe toegangen daartoe zijn gedurende de aanwezigheid van de werknemers door daglicht,
      door kunstlicht of door beide voldoende en doelmatig verlicht.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.3
  - number: 6.3.2
    text: Het kunstlicht is zodanig aangebracht dat gevaar voor ongevallen is voorkomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.3
  - number: 6.3.3
    text: |-
      De voor kunstlicht gebruikte kleur mag de waarneming van de veiligheids- en gezondheidssignalering, bepaald bij of
      krachtens [afdeling 2 van hoofdstuk 8][ref1], niet wijzigen of beïnvloeden.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '8'
        afdeling: '2'
  - number: 6.4.1
    text: |-
      In een uitwendige scheidingsconstructie van een besloten ruimte waar overdag door iemand gemiddeld meer dan twee
      uur arbeid wordt verricht, zijn doorzichtige lichtopeningen aangebracht waardoor daglicht kan toetreden. Het
      gezamenlijk oppervlak van de lichtopeningen bedraagt ten minste 1/20 van het vloeroppervlak van die ruimte.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.4
  - number: 6.4.2
    text: |-
      De lichtopeningen mogen zich ook bevinden in de inwendige scheidingsconstructie van de besloten ruimte, voor zover
      die constructie niet de scheiding vormt met een andere besloten ruimte als bedoeld in het eerste lid of met een
      ruimte als bedoeld in [hoofdstuk 3, afdeling 1, paragraaf 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: '1'
  - number: 6.4.3
    text: |-
      Het eerste of tweede lid geldt niet indien daaraan redelijkerwijs niet kan worden voldaan. In dat geval wordt het
      vereiste minimum oppervlak aan lichtopeningen van 1/20 van het vloeroppervlak zo dicht mogelijk benaderd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.4
  - number: '6.5'
    text: In een besloten ruimte waar arbeid wordt verricht kan rechtstreeks invallend zonlicht worden geweerd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.5
  - number: '6.6'
    text: 'In deze afdeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.6
  - number: 6.6.a
    text: |-
      equivalent geluidsniveau in dB(A): het energetisch gemiddelde geluidsniveau gedurende een bepaalde
      beoordelingstijd, uitgedrukt in dB(A);
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.6
  - number: 6.6.b
    text: |-
      momentaan geluidsdrukniveau in Pa: de niet-gewogen geluidsdruk die wordt gemeten met een geluidsniveaumeter in de
      stand «peak-hold», uitgedrukt in Pa;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.6
  - number: 6.6.c
    text: |-
      geluidsdosisniveau in dB(A): het energetisch gemiddelde geluidsniveau gedurende een representatieve werkdag,
      uitgedrukt in dB(A).
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.6
  - number: 6.7.1
    text: |-
      Op elke arbeidsplaats wordt in het kader van de risico-inventarisatie en -evaluatie, bedoeld in
      [artikel 5 van de wet][ref1], het geluidsniveau beoordeeld en, indien nodig, gemeten teneinde te bepalen waar
      en in welke mate werknemers aan de in deze afdeling vastgestelde niveaus van schadelijk geluid kunnen worden
      blootgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
  - number: 6.7.2
    text: |-
      De beoordeling en de meting zijn representatief voor de blootstelling aan geluid op de arbeidsplaats gedurende de
      dagelijkse arbeidstijd. De beoordeling en de meting worden, in aanvulling op [artikel 5 van de wet][ref1], volgens
      een schriftelijk vastgelegd tijdschema periodiek herhaald en in ieder geval herzien, indien de omstandigheden zijn
      gewijzigd of er redenen zijn om aan te nemen dat de uitgevoerde beoordeling of meting onjuist is.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
  - number: 6.7.3
    text: |-
      De bij de meting gebruikte methoden en apparaten zijn aan de desbetreffende omstandigheden aangepast. Met name
      wordt daarbij gelet op de kenmerken van het te meten geluid en de omgevingsfactoren. De gebruikte methoden en
      apparaten zijn geschikt om te bepalen of de in deze afdeling vastgestelde niveaus van schadelijk geluid al dan niet
      worden overschreden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.7
  - number: 6.7.4
    text: |-
      De ondernemingsraad of de personeelsvertegenwoordiging of, bij het ontbreken daarvan, de belanghebbende werknemers
      wordt de gelegenheid gegeven een oordeel kenbaar te maken over de wijze van beoordeling en meting.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.7
  - number: 6.7.5
    text: |-
      De resultaten van de op grond van dit artikel uitgevoerde beoordelingen en metingen worden in passende vorm
      geregistreerd en gedurende ten minste tien jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.7
  - number: 6.7.6
    text: |-
      De in het vijfde lid bedoelde resultaten worden, voorzien van een toelichting, ter kennis gebracht van de
      ondernemingsraad of de personeelsvertegenwoordiging of, bij het ontbreken daarvan, van de belanghebbende
      werknemers.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.7
  - number: 6.8.1
    text: |-
      Machines, werktuigen, apparaten, installaties, vervoer- en transportmiddelen zijn van zodanige constructie, zijn
      zodanig ingericht, opgesteld of ondersteund en worden zodanig onderhouden, dat zij bij het in werking zijn op de
      arbeidsplaats geen equivalent geluidsniveau veroorzaken hoger dan 85 dB(A) of een momentaan geluidsdrukniveau hoger
      dan 200 Pa, tenzij dit redelijkerwijs niet kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.8
  - number: 6.8.2
    text: |-
      Het verrichten van werkzaamheden geschiedt zodanig, dat daarbij op de arbeidsplaats geen equivalent geluidsniveau
      veroorzaakt wordt hoger dan 85 dB(A) of een momentaan geluidsdrukniveau hoger dan 200 Pa, tenzij dit redelijkerwijs
      niet kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.8
  - number: 6.8.3
    text: |-
      Indien de uitzondering, genoemd in de laatste zinsnede van het eerste of tweede lid, van toepassing is, zijn
      doeltreffende voorzieningen getroffen waardoor zoveel mogelijk wordt voorkomen dat de in het eerste en tweede lid
      genoemde geluidsniveaus op de arbeidsplaats heersen, tenzij ook dat redelijkerwijs niet kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.8
  - number: 6.8.4
    text: |-
      De in het derde lid bedoelde voorzieningen worden vermeld in het plan van aanpak, bedoeld in
      [artikel 5 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
  - number: 6.8.5
    text: |-
      In gevallen waarin voorzieningen, getroffen op grond van het derde lid, de werknemers onvoldoende bescherming
      bieden tegen de in het eerste en tweede lid genoemde geluidsniveaus en in gevallen waarin het treffen van
      bedoelde voorzieningen redelijkerwijs niet kan worden gevergd, worden doeltreffende maatregelen genomen om de
      blootstellingsduur alsmede het aantal werknemers dat aan de desbetreffende geluidsniveaus wordt blootgesteld,
      zoveel mogelijk te beperken.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.8
  - number: 6.8.6
    text: Het vierde lid is van overeenkomstige toepassing op de in het vijfde lid bedoelde maatregelen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.8
  - number: 6.8.7
    text: |-
      In gevallen waarin werknemers kunnen worden blootgesteld aan een equivalent geluidsniveau op de arbeidsplaats
      van 80 dB(A) of hoger, worden persoonlijke beschermingsmiddelen in voldoende aantal beschikbaar gesteld. De
      persoonlijke beschermingsmiddelen bieden een demping van het geluid tot een equivalent geluidsniveau van 80 dB(A)
      of lager. Indien een zodanige demping technisch niet mogelijk is, wordt door de persoonlijke beschermingsmiddelen
      ten minste een demping van het geluid geboden tot beneden het equivalent geluidsniveau van 85 dB(A).
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.8
  - number: 6.8.8
    text: |-
      De betrokken werknemers wordt de gelegenheid geboden een oordeel over de keuze van de soort persoonlijke
      beschermingsmiddelen kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.8
  - number: 6.8.9
    text: |-
      Bij overschrijding van het equivalent geluidsniveau van 85 dB(A) of van het momentaan geluidsdrukniveau van 200 Pa,
      worden door de werknemers de persoonlijke beschermingsmiddelen gebruikt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.8
  - number: 6.8.10
    text: |-
      Het ongevalsgevaar als gevolg van het gebruik van de persoonlijke beschermingsmiddelen wordt zoveel mogelijk door
      middel van doeltreffende maatregelen beperkt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.8
  - number: 6.8.11
    text: |-
      De plaatsen waar overschrijding van ten minste een van de in het negende lid genoemde geluidsniveaus kan
      worden verwacht, zijn duidelijk afgebakend en gemarkeerd door signalen die voldoen aan het bij of krachtens
      [afdeling 2 van hoofdstuk 8][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '8'
        afdeling: '2'
  - number: 6.8.12
    text: |-
      Alleen werknemers die beroepshalve of uit hoofde van hun functie de in het elfde lid bedoelde plaatsen moeten
      betreden worden daar toegelaten.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.8
  - number: 6.8.13
    text: |-
      De belanghebbende werknemers en, indien aanwezig, de ondernemingsraad of de personeelsvertegenwoordiging, worden,
      in geval toepassing wordt gegeven aan de uitzonderingen, bedoeld in de laatste zinsnede van het eerste en tweede
      lid, en de laatste zinsnede van het derde lid, in kennis gesteld van de redenen daarvan alsmede van de op grond van
      het derde lid getroffen voorzieningen en de op grond van het vijfde lid genomen maatregelen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.8
  - number: 6.8.14
    text: |-
      Op een bij koninklijk besluit te bepalen tijdstip wordt het in het eerste en tweede lid genoemde geluidsniveau van
      85 dB(A) vervangen door 80 dB(A).
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.8
  - number: 6.9.1
    text: |-
      In gevallen waarin werknemers die bijzondere taken uitvoeren, in verband met het uitvoeren van deze taken moeten
      verblijven op een arbeidsplaats waar het niveau van het geluid van dag tot dag sterk wisselt en het redelijkerwijs
      niet gevergd kan worden dat de in artikel 6.8, derde en vijfde lid, bedoelde voorzieningen en maatregelen getroffen
      respectievelijk genomen worden, is het gemiddelde geluidsniveau, berekend of gemeten over een periode van een week
      niet hoger dan 85 dB(A) of een momentaan geluidsdrukniveau hoger dan 200 Pa, tenzij dat redelijkerwijs niet kan
      worden gevergd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.9
  - number: 6.9.2
    text: |-
      Voorts wordt in de gevallen, bedoeld in het eerste lid, periodiek, doch in ieder geval telkens indien er voor het
      geluid op de arbeidsplaats relevante veranderingen plaatsvinden in de arbeid of de omstandigheden waaronder deze
      arbeid wordt verricht, gecontroleerd of nog voldaan wordt aan het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.9
  - number: 6.10.1
    text: |-
      Werknemers die worden blootgesteld aan een geluidsdosisniveau van 80 dB(A) worden, in aanvulling op
      [artikel 18 van de wet][ref1], in de gelegenheid gesteld een arbeidsgezondheidskundig onderzoek in de vorm van een
      audiometrisch onderzoek te ondergaan.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel18
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.10
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '18'
  - number: 6.10.2
    text: |-
      Zolang de blootstelling aan het in het eerste lid genoemde geluidsniveau duurt, worden de betrokken werknemers met
      tussenpozen van vier jaar of met kortere tussenpozen indien dit naar het oordeel van de deskundige persoon, bedoeld
      in [artikel 2.14a, tweede lid][ref1], of de arbodienst noodzakelijk is, opnieuw in de gelegenheid gesteld om een
      audiometrisch onderzoek te ondergaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.10
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '3'
  - number: 6.10.3
    text: |-
      Aan de deskundige persoon, bedoeld in [artikel 2.14a, tweede lid][ref1], of de arbodienst wordt inzage gegeven in
      het register, bedoeld in [artikel 6.7, vijfde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel6
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.10
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '2'
        afdeling: '3'
  - number: 6.10.4
    text: |-
      De deskundige persoon, bedoeld in [artikel 2.14a, tweede lid][ref1], of de arbodienst wordt de gelegenheid geboden
      om te adviseren over de te nemen preventieve of persoonlijke beschermende maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.10
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '3'
  - number: 6.10.5
    text: De resultaten van het audiometrisch onderzoek worden gedurende ten minste 10 jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.10
  - number: 6.10.6
    text: |-
      De betrokken werknemer wordt in kennis gesteld van de resultaten van elk audiometrisch onderzoek dat hij op grond
      van dit artikel heeft ondergaan.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.10
  - number: '6.11'
    text: |-
      Aan werknemers die arbeid verrichten waarbij overschrijding van het equivalente geluidsniveau van 80 dB(A) of van
      het momentaan geluidsdrukniveau van 200 Pa kan worden verwacht, worden doeltreffende voorlichting en doeltreffend
      onderricht gegeven over:
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11
  - number: 6.11.a
    text: de mogelijke gevaren voor het gehoor als gevolg van blootstelling aan geluid;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11
  - number: 6.11.b
    text: de bestaande regelgeving met betrekking tot geluid en de op grond van deze regelgeving te nemen maatregelen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11
  - number: 6.11.c
    text: |-
      de gevallen waarin persoonlijke beschermingsmiddelen ter beschikking worden gesteld en de gevallen waarin en de
      wijze waarop de persoonlijke beschermingsmiddelen worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11
  - number: 6.11.d
    text: |-
      de inhoud en betekenis van een periodiek te herhalen audiometrisch onderzoek en de gevallen waarin aan werknemers
      de gelegenheid wordt geboden om een dergelijk onderzoek te ondergaan.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11
  - number: 6.11a.1
    text: 'In deze afdeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11a
  - number: 6.11a.1.a
    text: |-
      richtlijn: [richtlijn nr. 2002/44/EG](32002L0044) van het Europees Parlement en de Raad van de Europese Unie
      van 25 juni 2002 betreffende de minimumvoorschriften inzake gezondheid en veiligheid met betrekking tot de
      blootstelling van werknemers aan de risico’s van fysische agentia (trillingen) (PbEG L 177);
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11a
  - number: 6.11a.1.b
    text: |-
      hand-armtrillingen: mechanische trillingen die, wanneer zij op het hand-armsysteem van de mens worden overgebracht,
      risico's voor de gezondheid en veiligheid van de werknemers inhouden, met name vaat-, bot- of gewrichts-, zenuw-
      of spieraandoeningen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11a
  - number: 6.11a.1.c
    text: |-
      lichaamstrillingen: mechanische trillingen die, wanneer zij op het lichaam in zijn geheel worden overgebracht,
      risico's voor de gezondheid en veiligheid van de werknemers inhouden, met name aandoeningen van de lage rug en
      beschadigingen van de wervelkolom.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11a
  - number: 6.11a.2
    text: 'Voor de hand-armtrillingen wordt:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11a
  - number: 6.11a.2.a
    text: |-
      de grenswaarde voor dagelijkse blootstelling, herleid tot een standaardreferentieperiode van acht uur, vastgesteld
      op 5m/s2;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11a
  - number: 6.11a.2.b
    text: |-
      de actiewaarde voor dagelijkse blootstelling, herleid tot een standaardreferentieperiode van acht uur, vastgesteld
      op 2,5m/s2.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11a
  - number: 6.11a.3
    text: 'Voor lichaamstrillingen wordt:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11a
  - number: 6.11a.3.a
    text: |-
      de grenswaarde voor dagelijkse blootstelling, herleid tot een standaardreferentieperiode van acht uur, vastgesteld
      op 1,15 m/s2;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11a
  - number: 6.11a.3.b
    text: |-
      de actiewaarde voor dagelijkse blootstelling, herleid tot een standaardreferentieperiode van acht uur, vastgesteld
      op 0,5 m/s2.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11a
  - number: 6.11b.1
    text: |-
      In het kader van de risico-inventarisatie en -evaluatie, bedoeld in [artikel 5 van de wet][ref1], worden de niveaus
      van de mechanische trillingen waaraan de werknemer wordt blootgesteld, beoordeeld en indien nodig gemeten.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11b
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
  - number: 6.11b.2
    text: De beoordeling en de meting worden op zorgvuldige wijze gepland en met passende tussenpozen uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11b
  - number: 6.11b.3
    text: |-
      De meting vindt plaats voor hand-armtrillingen overeenkomstig punt 2 van deel A en voor lichaamstrillingen
      overeenkomstig punt 2 van deel B van de bijlage bij de richtlijn.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11b
  - number: 6.11b.4
    text: De resultaten van de meting worden in een passende vorm bewaard gedurende ten minste tien jaren.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11b
  - number: 6.11b.5
    text: 'Bij de beoordeling worden in ieder geval de volgende aspecten betrokken:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11b
  - number: 6.11b.5.a
    text: |-
      het niveau, de aard en de duur van de blootstelling, met inbegrip van eventuele blootstelling aan periodieke
      trillingen of herhaalde schokken;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11b
  - number: 6.11b.5.b
    text: |-
      de vastgelegde grenswaarden en actiewaarden voor de blootstelling, bedoeld in
      [artikel 6.11a, tweede en derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
        afdeling: 3a
  - number: 6.11b.5.c
    text: mogelijke gevolgen voor de gezondheid en veiligheid van werknemers met een verhoogd risico;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11b
  - number: 6.11b.5.d
    text: |-
      mogelijke indirecte gevolgen voor de veiligheid van werknemers die worden veroorzaakt door de wisselwerking tussen
      mechanische trillingen en de arbeidsplaats of andere arbeidsmiddelen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11b
  - number: 6.11b.5.e
    text: de informatie die door fabrikanten van de arbeidsmiddelen is verstrekt;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11b
  - number: 6.11b.5.f
    text: |-
      het bestaan van vervangend materieel dat ontworpen is om de niveaus van blootstelling aan mechanische trillingen
      te verminderen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11b
  - number: 6.11b.5.g
    text: |-
      voortzetting van de blootstelling aan lichaamstrillingen buiten normale werktijd onder verantwoordelijkheid van
      de werkgever;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11b
  - number: 6.11b.5.h
    text: bijzondere arbeidsomstandigheden, zoals het werken bij lage temperaturen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11b
  - number: 6.11b.5.i
    text: |-
      door de arbeidsgezondheidskundige onderzoeken, bedoeld in [artikel 6.11e][ref1], verkregen relevante informatie,
      met inbegrip van gepubliceerde informatie, voorzover dat mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '2'
        afdeling: 3a
  - number: 6.11b.6
    text: |-
      De beoordeling wordt regelmatig herzien, in ieder geval indien gewijzigde omstandigheden of resultaten van de
      arbeidsgezondheidskundige onderzoeken, bedoeld [artikel 6.11e][ref1], hiertoe aanleiding geven.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '2'
        afdeling: 3a
  - number: 6.11c.1
    text: |-
      Indien de actiewaarden, bedoeld in [artikel 6.11a, tweede lid, onderdeel b, en derde lid, onderdeel b][ref1], worden
      of kunnen worden overschreden, wordt, met inachtneming van [artikel 3, eerste lid, onderdeel b, van de wet][ref2]
      in de risico-inventarisatie en -evaluatie, bedoeld in [artikel 5 van de wet][ref3], en in het daarbij behorende
      plan van aanpak aandacht besteed aan:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11c
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
        afdeling: 3a
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0010346
        artikel: '5'
  - number: 6.11c.1.a
    text: alternatieve werkmethoden die de noodzaak van blootstelling aan mechanische trillingen verminderen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11c
  - number: 6.11c.1.b
    text: |-
      de keuze van de juiste arbeidsmiddelen, ergonomisch goed ontworpen en zo weinig mogelijk trillingen veroorzakend,
      rekening houdend met het te verrichten werk;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11c
  - number: 6.11c.1.c
    text: de verstrekking van hulpmiddelen om het risico van gezondheidsschade ten gevolge van trillingen te voorkomen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11c
  - number: 6.11c.1.d
    text: passende onderhoudsprogramma's voor de arbeidsmiddelen, de arbeidsplaats en de systemen op de arbeidsplaats;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11c
  - number: 6.11c.1.e
    text: het ontwerp en de indeling van de arbeidsplaats;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11c
  - number: 6.11c.1.f
    text: |-
      een adequate voorlichting en opleiding van de werknemers, opdat zij de arbeidsmiddelen veilig en juist gebruiken,
      zodanig dat de blootstelling aan mechanische trillingen zo gering mogelijk is;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11c
  - number: 6.11c.1.g
    text: beperking van de duur en intensiteit van de blootstelling;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11c
  - number: 6.11c.1.h
    text: passende werkschema's met voldoende rustpauzes;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11c
  - number: 6.11c.1.i
    text: het verschaffen van kleding die de blootgestelde werknemers beschermt tegen kou en vocht.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11c
  - number: 6.11c.2
    text: |-
      Werknemers worden niet blootgesteld aan trillingen boven de grenswaarde voor blootstelling, bedoeld in
      [artikel 6.11a, tweede lid, onderdeel a, en derde lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11c
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
        afdeling: 3a
  - number: 6.11c.3
    text: 'Indien de grenswaarde toch wordt overschreden:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11c
  - number: 6.11c.3.a
    text: |-
      worden onverwijld maatregelen getroffen om de blootstelling terug te brengen tot onder de grenswaarde voor
      blootstelling;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11c
  - number: 6.11c.3.b
    text: wordt de oorzaak van de overschrijding van de grenswaarde onderzocht;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11c
  - number: 6.11c.3.c
    text: |-
      worden de beschermings- en preventiemaatregelen aangepast om te voorkomen dat de grenswaarde opnieuw wordt
      overschreden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11c
  - number: 6.11c.4
    text: De werkgever stemt de maatregelen af op de behoeften van werknemers met een verhoogd risico.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11c
  - number: 6.11d
    text: |-
      Aan werknemers die aan risico’s in verband met mechanische trillingen op het werk worden blootgesteld, worden
      doeltreffende voorlichting en doeltreffend onderricht gegeven over:
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11d
  - number: 6.11d.a
    text: |-
      maatregelen die zijn genomen om de risico's in verband met mechanische trillingen weg te nemen of tot een minimum
      te beperken;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11d
  - number: 6.11d.b
    text: de grenswaarden en actiewaarden voor blootstelling;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11d
  - number: 6.11d.c
    text: |-
      de resultaten van de overeenkomstig [artikel 6.11b][ref1] verrichte beoordelingen en metingen van mechanische
      trillingen en de gezondheidsschade die de gebruikte arbeidsmiddelen kunnen veroorzaken;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11d
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '2'
        afdeling: 3a
  - number: 6.11d.d
    text: het nut van en de methode voor het opsporen en melden van symptomen van gezondheidsschade;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11d
  - number: 6.11d.e
    text: de omstandigheden waarin werknemers recht hebben op arbeidsgezondheidskundig onderzoek;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11d
  - number: 6.11d.f
    text: veilige werkmethoden om de blootstelling aan mechanische trillingen tot een minimum te beperken.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11d
  - number: 6.11e.1
    text: |-
      Iedere werknemer die voor de eerste keer wordt belast met werkzaamheden die blijkens de beoordeling, bedoeld
      in [artikel 6.11b, eerste lid][ref1], gevaren kunnen opleveren voor de veiligheid of gezondheid, wordt in
      aanvulling op [artikel 18 van de wet][ref2], in de gelegenheid gesteld om vóór de aanvang van de werkzaamheden een
      arbeidsgezondheidskundig onderzoek te ondergaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel18
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11e
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '2'
        afdeling: 3a
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '18'
  - number: 6.11e.2
    text: |-
      Indien bij een werknemer een aandoening wordt geconstateerd die het gevolg zou kunnen zijn van blootstelling aan
      mechanische trillingen, worden werknemers, die op soortgelijke wijze zijn blootgesteld aan mechanische trillingen,
      tussentijds in de gelegenheid gesteld een arbeidsgezondheidskundig onderzoek te ondergaan.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11e
  - number: 6.11e.3
    text: |-
      Op verzoek van de werkgever of de betrokken werknemer wordt het arbeidsgezondheidskundig onderzoek opnieuw
      uitgevoerd. De resultaten van het hernieuwde onderzoek treden in de plaats van het daaraan voorafgaande.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11e
  - number: 6.11e.4
    text: |-
      Wanneer bij een werknemer als gevolg van blootstelling aan mechanische trillingen een aantoonbare ziekte of
      een schadelijke invloed op de gezondheid is vastgesteld, wordt hij door de deskundige persoon, bedoeld in
      [artikel 2.14a, tweede lid][ref1], of de arbodienst, geïnformeerd over de wijze waarop hij na beëindiging van de
      blootstelling in de gelegenheid wordt gesteld een arbeidsgezondheidskundig onderzoek te ondergaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.11e
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '3'
  - number: 6.12.1
    text: |-
      Toestellen die schadelijke, niet-ioniserende elektromagnetische straling kunnen uitzenden bestaan uit deugdelijk
      materiaal, zijn van een deugdelijke constructie en verkeren in goede staat.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.12
  - number: 6.12.2
    text: |-
      De in het eerste lid bedoelde toestellen bevinden zich in een zodanige ruimte en zijn voorts zodanig ingericht,
      opgesteld of afgeschermd, dat bij het in werking zijn daarvan gezondheidsschade zoveel mogelijk wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.12
  - number: 6.12.3
    text: |-
      Indien bij het in werking zijn van een toestel als bedoeld in het eerste lid, het gevaar van gezondheidsschade
      ondanks de naleving van de voorschriften, bedoeld in het eerste en tweede lid, niet of niet geheel kan worden
      voorkomen, worden zodanige maatregelen getroffen, dat gezondheidsschade zoveel mogelijk wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.12
  - number: 6.12.4
    text: |-
      Indien de in het derde lid bedoelde maatregelen gezondheidsschade niet of niet voldoende kunnen voorkomen worden
      persoonlijke beschermingsmiddelen ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.12
  - number: 6.12.5
    text: De persoonlijke beschermingsmiddelen worden door de werknemers bij de arbeid gebruikt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.12
  - number: 6.12.6
    text: |-
      Bij ministeriële regeling kunnen niveaus worden vastgesteld, waarboven voor de toepassing van dit artikel die
      straling wordt geacht schadelijk te zijn.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.12
  - number: 6.13.1
    text: 'In het bij of krachtens deze afdeling bepaalde wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.13
  - number: 6.13.1.a
    text: |-
      duikarbeid: het verrichten van arbeid in een vloeistof of in een droge duikklok met inbegrip van het verblijf in
      die vloeistof of in die droge duikklok, waarbij voor de ademhaling gebruik wordt gemaakt van een gas onder een
      hogere druk dan de atmosferische druk;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.13
  - number: 6.13.1.b
    text: |-
      caissonarbeid: het verrichten van arbeid in een ruimte die onder een druk van ten minste 104 Pa boven de
      atmosferische druk staat en geheel of gedeeltelijk door een vloeistof wordt omgeven alsmede het verblijf in en het
      transport van en naar die ruimte;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.13
  - number: 6.13.1.c
    text: |-
      overige arbeid onder overdruk: het verrichten van andere arbeid dan duik- of caissonarbeid in een ruimte onder een
      druk van ten minste 104 Pa boven de atmosferische druk met inbegrip van het verblijf in die ruimte.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.13
  - number: 6.13.2
    text: |-
      Deze afdeling is mede van toepassing op de arbeid in of op een zeeschip die in rechtstreeks verband staat met de te
      verrichten arbeid onder overdruk.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.13
  - number: 6.13.3
    text: |-
      Op duikarbeid met Self-Contained Underwater Breathing Apparatus (SCUBA), bestaande uit de instructie van
      sportduikers tot een duikdiepte van maximaal 50 meter, met een decompressietijd van ten hoogste 20 minuten en met
      een partiële zuurstofdruk in het ademgas van maximaal 1,4.105 PA, zijn uitsluitend de [artikelen 6.14][ref1] en
      [6.15, eerste lid, onder a en b en d][ref2], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel6
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.13
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '5'
  - number: '6.14'
    text: |-
      Duikarbeid, caissonarbeid en overige arbeid onder overdruk worden verricht door een persoon, die in een zodanige
      lichamelijke en geestelijke toestand verkeert, dat hij in staat is de gevaren, die zijn verbonden aan de door hem
      te verrichten arbeid, te onderkennen en zo mogelijk te voorkomen of te beperken.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.14
  - number: 6.14a.1
    text: |-
      Personen, die worden belast met het verrichten van duikarbeid, caissonarbeid en overige arbeid onder overdruk
      worden voor de aanvang van die arbeid onderworpen aan een arbeidsgezondheidskundig onderzoek, dat gericht is op de
      bijzondere gevaren voor de gezondheid, waaraan zij bij de uitoefening van die arbeid kunnen blootstaan.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.14a
  - number: 6.14a.2
    text: |-
      Na een periode van ten hoogste twaalf maanden na het onderzoek, bedoeld in het eerste lid, wordt het
      arbeidsgezondheidskundig onderzoek herhaald en vervolgens telkens met een tussenperiode van ten hoogste twaalf
      maanden sinds het voorafgaande onderzoek.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.14a
  - number: 6.14a.3
    text: |-
      Het arbeidsgezondheidskundig onderzoek, bedoeld in het eerste en tweede lid, wordt uitgevoerd door een arts, die in
      het bezit is van een certificaat duikerarts, dat is afgegeven door Onze Minister of een certificerende instelling.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.14a
  - number: 6.14a.4
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de uitvoering van het
      arbeidsgezondheidskundig onderzoek. Deze regels kunnen betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.14a
  - number: 6.14a.4.a
    text: de gegevens, die bij het onderzoek worden overgelegd;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.14a
  - number: 6.14a.4.b
    text: de wijze waarop het onderzoek wordt uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.14a
  - number: 6.14a.4.c
    text: |-
      de wijze van beoordeling van de geschiktheid of ongeschiktheid van personen voor het verrichten van duikarbeid,
      caissonarbeid of overige arbeid onder overdruk;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.14a
  - number: 6.14a.4.d
    text: |-
      de wijze van registratie, verwerking en bewaring, alsmede de tijdsduur van bewaring van de uit het onderzoek
      verkregen gegevens.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.14a
  - number: 6.14a.5
    text: |-
      Een persoon verricht slechts duikarbeid, caissonarbeid of overige arbeid onder overdruk indien uit het
      arbeidsgezondheidskundig onderzoek blijkt, dat het verrichten van die arbeid op medische gronden toelaatbaar
      is. Indien uit de uitslag van het arbeidsgezondheidskundig onderzoek blijkt dat het verrichten van duikarbeid,
      caissonarbeid of overige arbeid onder overdruk slechts onder de daarin aangegeven beperkende voorschriften
      toelaatbaar is, worden deze voorschriften in acht genomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.14a
  - number: 6.14a.6
    text: |-
      Op verzoek van de werkgever of de onderzochte persoon wordt het in dit artikel bedoelde onderzoek één maal opnieuw
      uitgevoerd door een andere arts, die in het bezit is van een certificaat duikerarts als bedoeld in het derde lid.
      Het resultaat van het hernieuwde onderzoek treedt in de plaats van het daaraan voorafgaande.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.14a
  - number: 6.14b.1
    text: |-
      In verband met de uitvoering van arbeidsgezondheidskundige onderzoeken als bedoeld in
      [artikel 6.14a, eerste en tweede lid][ref1], kunnen voor de afgifte van het certificaat duikerarts, bedoeld
      in [artikel 6.14a, derde lid][ref2], bij ministeriële regeling verschillende vakbekwaamheids-, opleidings- of
      registratie-eisen worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel6
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.14b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '5'
  - number: 6.14b.2
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de gelijkstelling
      van in het buitenland afgegeven certificaten duikerarts met het certificaat duikerarts, bedoeld in
      [artikel 6.14a, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.14b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '5'
  - number: 6.15.1
    text: |-
      Indien duikarbeid, caissonarbeid en overige arbeid onder overdruk worden verricht, is met inachtneming van de stand
      van de techniek en rekening houdende met de specifiek te verrichten arbeid:
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.15
  - number: 6.15.1.a
    text: |-
      nabij de plaats waar de arbeid wordt verricht een deugdelijke schriftelijke werkinstructie aanwezig die ten minste
      de door de werknemers te treffen veiligheidsvoorzieningen alsmede de noodprocedures bevat;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.15
  - number: 6.15.1.b
    text: |-
      aan de werknemers deugdelijk materieel dat in goede staat verkeert en voldoende ademgas van goede kwaliteit ter
      beschikking gesteld;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.15
  - number: 6.15.1.c
    text: |-
      nabij de plaats waar de arbeid wordt verricht een daartoe opgeleid persoon aanwezig die de werknemers adequaat
      medisch begeleiden kan;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.15
  - number: 6.15.1.d
    text: nabij de plaats waar de arbeid wordt verricht een adequate eerste-hulpuitrusting aanwezig.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.15
  - number: 6.15.2
    text: |-
      De in het eerste lid, onder *c*, bedoelde persoon kan terstond in contact treden met een arts als bedoeld in
      [artikel 6.14a, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.15
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '5'
  - number: 6.16.1
    text: Duikarbeid wordt verricht door een of meer duikers die worden bijgestaan door een reserveduiker en een ploegleider.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.16
  - number: 6.16.2
    text: |-
      De reserveduiker verricht slechts duikarbeid bestaande uit het verlenen van hulp aan en het redden van in
      moeilijkheden geraakte duikers. Bij het gebruik van een duikklok is de reserveduiker in de klok aanwezig.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.16
  - number: 6.16.3
    text: |-
      De ploegleider is in het bezit van een certificaat duikploegleider, dat is afgegeven door Onze Minister of een
      certificerende instelling.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.16
  - number: 6.16.4
    text: |-
      In afwijking van het eerste lid, mag de ploegleider tevens als reserveduiker optreden, indien duikarbeid wordt
      verricht in een vloeistof die in overwegende mate uit water bestaat met een maximaal bereikbare diepte van 9 meter
      en een maximale stroomsnelheid van 0,5 meter per seconde en waarbij geen voorzienbare kans bestaat dat de duikers
      in die vloeistof in moeilijkheden raken.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.16
  - number: 6.16.5
    text: |-
      Een ieder die duikarbeid heeft verricht, houdt hiervan aantekening in een persoonlijk duiklogboek. In dit
      logboek worden, naast de aard van de duikarbeid, ten minste het gevolgde duikschema inclusief het gevolgde
      decompressieverloop alsmede de verblijftijd in de vloeistof aangetekend.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.16
  - number: 6.16.6
    text: |-
      De duikers en de reserveduiker zijn in het bezit van een certificaat duikarbeid met betrekking tot de soort arbeid
      die zij verrichten, dat is afgegeven door Onze Minister of een certificerende instelling.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.16
  - number: 6.16.7
    text: |-
      Indien duikarbeid wordt verricht is de persoon, bedoeld in [artikel 6.15, eerste lid, onder c][ref1], in het bezit
      van een certificaat duikmedische begeleiding, dat is afgegeven door Onze Minister of een certificerende instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.16
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '5'
  - number: 6.16.8
    text: |-
      Het certificaat duikploegleider, het certificaat duikarbeid en het certificaat duikmedische begeleiding, bedoeld
      in het derde respectievelijk het zesde en zevende lid, of afschriften daarvan zijn op de arbeidsplaats aanwezig en
      worden desgevraagd getoond aan een ambtenaar als bedoeld in [artikel 24 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.16
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 6.16.9
    text: |-
      Het zesde lid is niet van toepassing op degene die in het kader van een opleiding tot duiker duikarbeid verricht,
      mits dit gebeurt onder toezicht van een persoon die in het bezit is van een certificaat als bedoeld in dat lid.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.16
  - number: 6.16.10
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de gelijkstelling van in het
      buitenland afgegeven certificaten duikploegleider, certificaten duikarbeid of certificaten duikmedische begeleiding
      met de certificaten, bedoeld in het derde respectievelijk zesde en zevende lid.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.16
  - number: 6.17.1
    text: Duikarbeid die wordt verricht,
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.17
  - number: 6.17.1.a
    text: op een diepte groter dan 9 meter;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.17
  - number: 6.17.1.b
    text: bij een stroomsnelheid groter dan 0,5 meter per seconde;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.17
  - number: 6.17.1.c
    text: met voorgenomen decompressie;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.17
  - number: 6.17.1.d
    text: met een ademgas anders dan lucht;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.17
  - number: 6.17.1.e
    text: over een periode langer dan een week, of
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.17
  - number: 6.17.1.f
    text: |-
      ten behoeve van de ondergrondse winningsindustrie of de winningsindustrie die delfstoffen wint met behulp van
      boringen, wordt ten minste vijf werkdagen vóór de aanvang ervan schriftelijk gemeld bij een daartoe aangewezen
      ambtenaar als bedoeld in [artikel 24 van de wet][ref1] onder opgaaf van de plaats waar de arbeid zal worden
      verricht, het tijdstip waarop deze zal aanvangen, het vermoedelijke aantal betrokken werknemers en het aantal
      werknemers dat daadwerkelijk duikarbeid zal verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.17
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 6.17.2
    text: |-
      Indien de periode tussen de opdracht tot het verrichten van duikarbeid als bedoeld in het eerste lid en de
      uitvoering ervan wegens het onvoorziene en spoedeisende karakter van de duikarbeid korter is dan vijf werkdagen,
      dan wordt de duikarbeid zo spoedig mogelijk bij de ambtenaar, bedoeld in het eerste lid, gemeld.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.17
  - number: 6.17.3
    text: |-
      De in het eerste lid bedoelde schriftelijke melding gaat in geval van duikarbeid ten behoeve van de ondergrondse
      winningsindustrie of de winningsindustrie die delfstoffen wint met behulp van boringen, vergezeld van informatie
      over de veiligheids- en gezondheidsrisico's van de duiklocatie.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.17
  - number: 6.17.4
    text: Het eerste lid is niet van toepassing op arbeid die in het kader van een opleiding tot duiker wordt verricht.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.17
  - number: 6.18.1
    text: |-
      Bij de plaats waar duikarbeid in water wordt verricht op een diepte van meer dan 15 m of in een andere vloeistof
      onder een hogere druk dan 1,5.105 Pa boven de atmosferische druk, is een geschikte compressiekamer, voorzien van
      een personen- en medicijnsluis, aanwezig.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.18
  - number: 6.18.2
    text: |-
      Onverminderd het eerste lid is bij de plaats waar duikarbeid wordt verricht een compressiekamer aanwezig indien
      de reistijd tussen de duiklocatie en de dichtstbijzijnde behandelfaciliteit met compressiekamer meer dan 2 uur
      bedraagt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.18
  - number: 6.18.3
    text: 'De compressiekamer, bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.18
  - number: 6.18.3.a
    text: |-
      heeft een omvang en een inrichting die zijn afgestemd op het aantal personen dat duikarbeid verricht en de aard van
      de werkzaamheden, en
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.18
  - number: 6.18.3.b
    text: biedt ten minste plaats aan twee personen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.18
  - number: 6.18.4
    text: De compressiekamer wordt op de juiste wijze gebruikt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.18
  - number: 6.19.1
    text: Caissonarbeid wordt door ten minste twee personen verricht.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.19
  - number: 6.19.2
    text: |-
      Ten minste 30 dagen vóór het verrichten van caissonarbeid wordt een daartoe aangewezen ambtenaar als bedoeld
      in [artikel 24 van de wet][ref1] hiervan schriftelijk in kennis gesteld, onder overlegging van een deugdelijk
      werkplan.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.19
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 6.19.3
    text: |-
      Een caisson wordt gebouwd, geïnstalleerd, aangepast of gedemonteerd onder toezicht van een speciaal daarvoor
      aangewezen persoon.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.19
  - number: 6.19.4
    text: Caissons worden regelmatig door een speciaal daarvoor aangewezen persoon geïnspecteerd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.19
  - number: 6.20.1
    text: |-
      Bij de plaats waar caissonarbeid wordt verricht onder een hogere druk dan 1,5.105 Pa boven de atmosferische druk,
      is een geschikte compressiekamer, voorzien van een personen- en medicijnsluis, aanwezig.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.20
  - number: 6.20.2
    text: |-
      Onverminderd het eerste lid is bij de plaats waar caissonarbeid wordt verricht een compressiekamer aanwezig
      indien de reistijd tussen die plaats en de dichtstbijzijnde behandelfaciliteit met compressiekamer meer dan 2 uur
      bedraagt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.20
  - number: 6.20.3
    text: 'De compressiekamer, bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.20
  - number: 6.20.3.a
    text: |-
      heeft een omvang en een inrichting die zijn afgestemd op het aantal personen dat caissonarbeid verricht en de aard
      van de werkzaamheden, en
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.20
  - number: 6.20.3.b
    text: biedt ten minste plaats aan twee personen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.20
  - number: 6.20.4
    text: De compressiekamer wordt op de juiste wijze gebruikt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.20
  - number: 6.20a
    text: |-
      Op een arbeidsplaats in de ondergrondse winningsindustrie zijn naast de voorschriften van de
      [afdelingen 1 tot en met 5 van dit hoofdstuk][ref1] tevens de voorschriften van deze afdeling van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.20a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '6'
        afdeling: '1'
  - number: 6.20b.1
    text: |-
      Alle normaal toegankelijke ondergrondse werkterreinen worden behoorlijk geventileerd. Door middel van een
      permanente ventilatie wordt, met een voldoende veiligheidsmarge, gezorgd voor een atmosfeer:
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.20b
  - number: 6.20b.1.a
    text: die gezond is;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.20b
  - number: 6.20b.1.b
    text: |-
      waarin het explosiegevaar en het gevaar voor stofdeeltjes die ingeademd kunnen worden, onder controle wordt
      gehouden;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.20b
  - number: 6.20b.1.c
    text: |-
      waarin de arbeidsomstandigheden tijdens de werktijd adequaat zijn, gelet op de gebruikte werkmethoden en de fysieke
      belasting van de werknemers.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.20b
  - number: 6.20b.2
    text: |-
      Indien de natuurlijke ventilatie niet aan het eerste lid voldoet wordt de hoofdventilatie door een of meer
      mechanische ventilatoren verzorgd. Er worden maatregelen getroffen om een constante en continue ventilatie
      te garanderen. De onderdruk van de hoofdventilatoren wordt voortdurend gecontroleerd. Er is een automatische
      alarmering voor het geval de hoofdventilatoren onverwacht uitvallen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.20b
  - number: 6.20b.3
    text: 'De parameters van de ventilatie worden:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.20b
  - number: 6.20b.3.a
    text: regelmatig gemeten; en
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.20b
  - number: 6.20b.3.b
    text: de resultaten hiervan worden geregistreerd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.20b
  - number: 6.20b.4
    text: |-
      Er wordt een plattegrond gemaakt en regelmatig bijgewerkt met alle nuttige gegevens van het ventilatiesysteem.
      De plattegrond is op de arbeidsplaats aanwezig en wordt desgevraagd getoond aan een ambtenaar als bedoeld in
      [artikel 24 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.20b
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 6.20c
    text: |-
      In afwijking van de [artikelen 6.3][ref1] en [6.4][ref2] zijn de werkplekken voor zover mogelijk voorzien van
      voldoende kunstmatige verlichting voor de bescherming van de veiligheid en de gezondheid van de werknemers. De
      verlichtingsinstallaties zijn zodanig aangebracht dat het type verlichting geen ongevallenrisico voor de werknemers
      oplevert.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel6
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.20c
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '2'
  - number: 6.20d
    text: |-
      Op een arbeidsplaats in de winningsindustrie die delfstoffen wint met behulp van boringen zijn naast de
      voorschriften van de [afdelingen 1 tot en met 5 van dit hoofdstuk][ref1] tevens de voorschriften van deze afdeling
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.20d
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '6'
        afdeling: '1'
  - number: 6.20e
    text: |-
      Verlichtingsinstallaties zijn zodanig ontworpen dat operationele bedieningsruimten, vluchtwegen, inschepingszones
      en gevaarlijke zones gedurende de aanwezigheid van de werknemers verlicht zijn.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.20e
  - number: '6.21'
    text: |-
      Afdeling 3 van dit hoofdstuk is niet van toepassing op zeeschepen en luchtvaartuigen. Op zeeschepen en
      luchtvaartuigen zijn uitsluitend de artikelen 6.22 en 6.23 van toepassing.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.21
  - number: '6.22'
    text: |-
      In deze paragraaf wordt onder equivalent geluidsniveau in dB(A) verstaan: het energetisch gemiddelde geluidsniveau
      gedurende een bepaalde beoordelingstijd, uitgedrukt in dB(A).
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.22
  - number: 6.23.1
    text: |-
      Machines, werktuigen, apparaten, installaties aan boord van luchtvaartuigen en zeeschepen zijn van zodanige
      constructie, zijn zodanig ingericht, opgesteld of ondersteund en worden zodanig onderhouden, dat zij bij het
      in werking zijn op de arbeidsplaats geen equivalent geluidsniveau veroorzaken hoger dan 85 dB(A), tenzij dat
      redelijkerwijs niet kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.23
  - number: 6.23.2
    text: |-
      Het verrichten van werkzaamheden geschiedt zodanig, dat daarbij op de arbeidsplaats geen equivalent geluidsniveau
      veroorzaakt wordt hoger dan 85 dB(A), tenzij dat redelijkerwijs niet kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.23
  - number: 6.23.3
    text: |-
      Indien de uitzondering, genoemd in de laatste zinsnede van het eerste of tweede lid, van toepassing is, zijn
      doeltreffende voorzieningen getroffen waardoor zoveel mogelijk wordt voorkomen dat het in het eerste en tweede lid
      genoemde geluidsniveau op de arbeidsplaats heerst, tenzij ook dat redelijkerwijs niet kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.23
  - number: 6.23.4
    text: |-
      De in het derde lid bedoelde voorzieningen worden vermeld in het plan van aanpak, bedoeld in
      [artikel 5 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.23
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
  - number: 6.23.5
    text: |-
      In gevallen waarin de voorzieningen, getroffen op grond van het derde lid, de werknemers onvoldoende bescherming
      bieden tegen de in het eerste en tweede lid genoemde geluidsniveaus, en in gevallen waarin het treffen van
      bedoelde voorzieningen redelijkerwijs niet kan worden gevergd, worden doeltreffende maatregelen genomen om de
      blootstellingsduur alsmede het aantal werknemers dat aan de desbetreffende geluidsniveaus wordt blootgesteld,
      zoveel mogelijk te beperken.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.23
  - number: 6.23.6
    text: Het vierde lid is van overeenkomstige toepassing op de in het vijfde lid bedoelde maatregelen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.23
  - number: 6.23.7
    text: |-
      In gevallen, waarin werknemers kunnen worden blootgesteld aan een equivalent geluidsniveau van 80 dB(A) of
      hoger, worden persoonlijke beschermingsmiddelen in voldoende aantal beschikbaar gesteld. De persoonlijke
      beschermingsmiddelen bieden een demping van het geluid tot een equivalent geluidsniveau van 80 dB(A) of lager.
      Indien een zodanige demping technisch niet mogelijk is, wordt door de persoonlijke beschermingsmiddelen ten minste
      een demping van het geluid geboden tot beneden het equivalent geluidsniveau van 85 dB(A).
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.23
  - number: 6.23.8
    text: |-
      Bij overschrijding van het equivalent geluidsniveau van 85 dB(A) worden door de werknemers de persoonlijke
      beschermingsmiddelen gebruikt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.23
  - number: 6.23.9
    text: |-
      Op een bij koninklijk besluit te bepalen tijdstip wordt het in het eerste en tweede lid genoemde geluidsniveau van
      85 dB(A) vervangen door 80 dB(A).
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.23
  - number: 6.24.1
    text: |-
      Op luchtvaartuigen waarvoor vóór 1 januari 1997 een Nederlands of daaraan gelijkgesteld bewijs van luchtwaardigheid
      is afgegeven, zijn de [artikelen 6.3][ref1], [6.4][ref2] en [6.5][ref3] niet van toepassing, tenzij de naleving
      daarvan redelijkerwijs kan worden gevergd.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel6
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.24
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '2'
  - number: 6.24.2
    text: |-
      Op zeeschepen die vóór 1 januari 1994 zijn gebouwd, zijn de [artikelen 6.3][ref1] en [6.5][ref2] niet van
      toepassing, tenzij de naleving daarvan redelijkerwijs kan worden gevergd.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel6
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.24
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '2'
  - number: 6.24.3
    text: |-
      Artikel [6.4][ref1] is niet van toepassing op zeeschepen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.24
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '2'
  - number: 6.24.4
    text: |-
      Onder gebouwde zeeschepen wordt verstaan: hetgeen daaronder wordt verstaan in
      [artikel 1 van het Schepenbesluit 1965][ref1] of, voor zover het zeegaande vissersvaartuigen betreft,
      [artikel 2 van het Vissersvaartuigenbesluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004607#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.24
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004607
        artikel: '2'
  - number: 6.24.5
    text: |-
      Op voertuigen op een openbare weg of spoorweg die vóór 1 januari 1994 zijn gebouwd, zijn de [artikelen 6.3][ref1],
      [6.4][ref2] en [6.5][ref3] niet van toepassing, tenzij de naleving daarvan redelijkerwijs kan worden gevergd.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel6
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.24
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '2'
  - number: '6.25'
    text: |-
      De [artikelen 6.1][ref1], [6.2][ref2], [6.3][ref3] en [6.4][ref4] zijn niet van toepassing op arbeidsplaatsen in
      justitiële inrichtingen die vóór 1 september 1990 als zodanig in gebruik waren, voor zover de naleving daarvan
      redelijkerwijs niet kan worden gevergd.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0008498#Artikel6
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.25
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '2'
  - number: '6.26'
    text: |-
      In aanvulling op het bepaalde bij of krachtens dit hoofdstuk gelden voor jeugdige werknemers tevens de in deze
      paragraaf genoemde voorschriften en verboden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.26
  - number: 6.27.1
    text: |-
      Jeugdige werknemers mogen geen duikarbeid, caissonarbeid en overige arbeid onder overdruk, bedoeld in
      [artikel 6.13][ref1], verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.27
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '5'
  - number: 6.27.2
    text: |-
      Jeugdige werknemers mogen geen arbeid verrichten met toestellen die schadelijke niet-ioniserende elektromagnetische
      straling kunnen uitzenden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.27
  - number: 6.27.3
    text: |-
      Jeugdige werknemers mogen geen arbeid verrichten op een arbeidsplaats waar zij worden blootgesteld aan een
      equivalent geluidsniveau van 90 dB(A) of hoger.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.27
  - number: 6.27.4
    text: Jeugdige werknemers mogen niet worden blootgesteld aan schadelijke trillingen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.27
  - number: '6.28'
    text: |-
      In aanvulling op het bepaalde bij of krachtens dit hoofdstuk gelden voor zwangere werknemers tevens de in deze
      paragraaf genoemde voorschriften.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.28
  - number: '6.29'
    text: |-
      Het is een zwangere werknemer verboden duikarbeid, caissonarbeid en overige arbeid onder overdruk als bedoeld in
      [artikel 6.13][ref1] te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.29
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '5'
  - number: 6.29a
    text: |-
      Het is een zwangere werknemer en een werknemer tijdens de lactatie verboden arbeid te verrichten in de ondergrondse
      winningsindustrie.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.29a
  - number: 6.30.1
    text: Op de arbeidsplaats zijn de nodige voorzieningen voor een doelmatige kunstverlichting aanwezig.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.30
  - number: 6.30.2
    text: |-
      Indien de thuiswerker reeds uit eigen hoofde beschikt over de in het eerste lid bedoelde voorziening, behoeft de
      thuiswerkgever deze niet alsnog ter beschikking te stellen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.30
  - number: 6.31.1
    text: |-
      [Artikel 6.16, zesde lid][ref1], is niet van toepassing op leerlingen respectievelijk studenten in
      onderwijsinrichtingen indien deze leerlingen respectievelijk studenten duikwerkzaamheden verrichten die:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.31
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '5'
  - number: 6.31.1.a
    text: in het kader van wetenschappelijk onderzoek zijn;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.31
  - number: 6.31.1.b
    text: van lichte aard zijn, en
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.31
  - number: 6.31.1.c
    text: |-
      worden uitgevoerd door een duikploeg als bedoeld in [artikel 6.16, eerste lid][ref1], waarbij de leerling
      respectievelijk student functioneert als aanvullend lid van deze duikploeg.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.31
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '5'
  - number: 6.31.2
    text: |-
      De leerlingen respectievelijk studenten zijn bij het uitvoeren van de duikwerkzaamheden, bedoeld in het eerste lid,
      in het bezit van een bij ministeriële regeling aan te wijzen sportduikbrevet.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.31
  - number: 6.31.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel6.31
  - number: '7.1'
    text: |-
      Dit hoofdstuk is niet van toepassing op arbeidsmiddelen die op een zodanige manier zijn gedemonteerd of gesloopt,
      dat zij niet op eenvoudige wijze weer in gebruik genomen kunnen worden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.1
  - number: 7.2.1
    text: |-
      Een arbeidsmiddel wordt vermoed te voldoen aan de [artikelen 7.4, eerste en tweede lid][ref1], [7.7][ref2],
      [7.10][ref3], [7.13][ref4], [7.14][ref5], [7.15][ref6], [7.16][ref7], [7.17a][ref8], [7.17b][ref9], met
      uitzondering van het vierde lid, en [7.18b, eerste lid, onder a][ref10], indien het, overeenkomstig de daarvoor
      geldende EG-richtlijnen, is voorzien van een CE-markering, vergezeld van een EG-verklaring van overeenstemming, en
      het arbeidsmiddel overeenkomstig de daarbij behorende gebruiksvoorschriften wordt gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0008498#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0008498#Artikel7
      [ref6]: https://wetten.overheid.nl/BWBR0008498#Artikel7
      [ref7]: https://wetten.overheid.nl/BWBR0008498#Artikel7
      [ref8]: https://wetten.overheid.nl/BWBR0008498#Artikel7
      [ref9]: https://wetten.overheid.nl/BWBR0008498#Artikel7
      [ref10]: https://wetten.overheid.nl/BWBR0008498#Artikel7
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0008498
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0008498
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '3'
      - id: ref5
        bwb_id: BWBR0008498
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '3'
      - id: ref6
        bwb_id: BWBR0008498
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '3'
      - id: ref7
        bwb_id: BWBR0008498
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '3'
      - id: ref8
        bwb_id: BWBR0008498
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
        afdeling: '4'
      - id: ref9
        bwb_id: BWBR0008498
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
        afdeling: '4'
      - id: ref10
        bwb_id: BWBR0008498
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 2a
        afdeling: '4'
  - number: 7.2.2
    text: |-
      Indien een arbeidsmiddel slechts voor een of meer onderdelen is voorzien van een CE-markering, vergezeld van een
      EG-verklaring van overeenstemming, wordt slechts ten aanzien van dat onderdeel respectievelijk die onderdelen
      vermoed dat het arbeidsmiddel voldoet aan de in het eerste lid genoemde artikelen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.2
  - number: 7.2a
    text: 'In dit hoofdstuk wordt verstaan onder keuring: een onderzoek of een beproeving.'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.2a
  - number: 7.3.1
    text: |-
      Bij de keuze van de arbeidsmiddelen die de werkgever overweegt ter beschikking te stellen, wordt rekening
      gehouden met de uit de risico-inventarisatie en -evaluatie, bedoeld in [artikel 5 van de wet][ref1], gebleken
      specifieke kenmerken van de arbeid, met de omstandigheden waaronder deze wordt verricht, met de op de arbeidsplaats
      al bestaande gevaren en met de gevaren die daaraan zouden kunnen worden toegevoegd door het gebruik van de
      desbetreffende arbeidsmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
  - number: 7.3.2
    text: |-
      Om te voorkomen dat het gebruik van arbeidsmiddelen gevaren voor de veiligheid en gezondheid van de werknemers
      oplevert, worden de arbeidsmiddelen die op de arbeidsplaats ter beschikking van de werknemers worden gesteld,
      uitsluitend gebruikt voor het doel, op de wijze en op de plaats waarvoor zij zijn ingericht en bestemd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.3
  - number: 7.3.3
    text: Arbeidsmiddelen zijn voorts geschikt voor het uit te voeren werk of zijn daartoe behoorlijk aangepast.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.3
  - number: 7.3.4
    text: |-
      Voor zover het redelijkerwijs niet mogelijk is de gevaren bij het gebruik van de arbeidsmiddelen te voorkomen,
      worden zodanige maatregelen getroffen dat de gevaren zoveel mogelijk worden beperkt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.3
  - number: 7.4.1
    text: Een arbeidsmiddel bestaat uit deugdelijk materiaal.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.4
  - number: 7.4.2
    text: Een arbeidsmiddel is van een deugdelijke constructie.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.4
  - number: 7.4.3
    text: |-
      Een arbeidsmiddel is zodanig geplaatst of ingericht, dat het gevaar van verschuiven, omvallen, kantelen,
      oververhitting, brand, ontploffen, blikseminslag en directe of indirecte aanraking met elektriciteit zoveel
      mogelijk is voorkomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.4
  - number: 7.4.4
    text: Artikel 3.17 is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.4
  - number: 7.4a.1
    text: |-
      Een arbeidsmiddel waarvan de veiligheid afhangt van de wijze van installatie wordt na de installatie en voordat
      het voor de eerste maal in gebruik wordt genomen gekeurd op de juiste wijze van installatie en goed en veilig
      functioneren.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.4a
  - number: 7.4a.2
    text: |-
      Een arbeidsmiddel als bedoeld in het eerste lid, wordt voorts na elke montage op een nieuwe locatie of een nieuwe
      plek gekeurd op de juiste wijze van installatie en goed en veilig functioneren.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.4a
  - number: 7.4a.3
    text: |-
      Een arbeidsmiddel dat onderhevig is aan invloeden die leiden tot verslechteringen welke aanleiding kunnen geven tot
      het ontstaan van gevaarlijke situaties wordt, zo dikwijls dit ter waarborging van de goede staat noodzakelijk is,
      gekeurd, waarbij het zo nodig wordt beproefd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.4a
  - number: 7.4a.4
    text: |-
      Een arbeidsmiddel als bedoeld in het derde lid wordt voorts gekeurd, waarbij het zo nodig wordt beproefd,
      telkens wanneer zich uitzonderlijke gebeurtenissen hebben voorgedaan die schadelijke gevolgen kunnen hebben
      voor de veiligheid van het arbeidsmiddel. Als uitzonderlijke gebeurtenissen worden in ieder geval aangemerkt:
      natuurverschijnselen, veranderingen aan het arbeidsmiddel, ongevallen met het arbeidsmiddel en langdurige
      buitengebruikstelling van het arbeidsmiddel.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.4a
  - number: 7.4a.5
    text: Keuringen worden uitgevoerd door een deskundige natuurlijke persoon, rechtspersoon of instelling.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.4a
  - number: 7.4a.6
    text: |-
      Schriftelijke bewijsstukken van de uitgevoerde keuringen zijn op de arbeidsplaats aanwezig en worden desgevraagd
      getoond aan een ambtenaar als bedoeld in [artikel 24 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.4a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 7.4a.7
    text: |-
      Dit artikel is niet van toepassing op attractie- en speeltoestellen waarop het
      [Warenwetbesluit attractie- en speeltoestellen][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0008223
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.4a
    references:
      - id: ref1
        bwb_id: BWBR0008223
  - number: 7.4a.8
    text: |-
      Het eerste tot en met het vijfde lid zijn niet van toepassing op steigers waarop [artikel 7.34][ref1] van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel7
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.4a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
        afdeling: '5'
  - number: 7.4a.9
    text: 'Het eerste tot en met derde lid zijn niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.4a
  - number: 7.4a.9.a
    text: |-
      hijs- en hefwerktuigen en hijs- en hefgereedschappen aan boord van schepen waarop [artikel 7.29][ref1] van
      toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel7
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.4a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
        afdeling: '4'
  - number: 7.4a.9.b
    text: |-
      liften en bouwliften voor personenvervoer waarop het [Warenwetbesluit liften][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0008212
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.4a
    references:
      - id: ref1
        bwb_id: BWBR0008212
  - number: 7.4a.11
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op drukapparatuur waarop
      [artikel 12b van het Warenwetbesluit drukapparatuur][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel12b
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.4a
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: 12b
  - number: 7.4a.12
    text: 'Het derde lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.4a
  - number: 7.4a.12.a
    text: |-
      hijs- en hefgereedschap waarop [artikel 7.20][ref1] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel7
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.4a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 2a
        afdeling: '4'
  - number: 7.4a.12.b
    text: |-
      containers waarop het [Warenwetbesluit containers][ref1] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0003584
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.4a
    references:
      - id: ref1
        bwb_id: BWBR0003584
  - number: 7.4a.12.c
    text: |-
      hijskranen waarop de [artikelen 6d tot en met 6f van het Warenwetbesluit machines][ref1] van toepassing zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Artikel6d
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.4a
    references:
      - id: ref1
        bwb_id: BWBR0005577
        artikel: 6d
  - number: 7.4a.12.d
    text: |-
      transportsteigers waarop het [Warenwetbesluit liften][ref1] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0008212
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.4a
    references:
      - id: ref1
        bwb_id: BWBR0008212
  - number: 7.4a.12.e
    text: |-
      drukapparatuur waarop [artikel 12c van het Warenwetbesluit drukapparatuur][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel12c
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.4a
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: 12c
  - number: 7.4a.13
    text: |-
      Het vierde lid is ten aanzien van wijzigingen of reparaties niet van toepassing op drukapparatuur waarop
      [artikel 12c van het Warenwetbesluit][ref1] drukapparatuur van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel12c
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.4a
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: 12c
  - number: 7.5.1
    text: |-
      De nodige maatregelen worden genomen om ervoor te zorgen dat de arbeidsmiddelen tijdens de gehele gebruiksduur door
      toereikend onderhoud in een zodanige staat worden gehouden, dat gevaar voor de veiligheid en de gezondheid van de
      werknemers zoveel mogelijk is voorkomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.5
  - number: 7.5.2
    text: |-
      Onderhouds-, reparatie- en reinigingswerkzaamheden aan een arbeidsmiddel worden slechts uitgevoerd indien het
      arbeidsmiddel is uitgeschakeld en drukloos of spanningsloos is gemaakt. Indien dit niet mogelijk is worden
      doeltreffende maatregelen genomen om die werkzaamheden veilig te kunnen uitvoeren.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.5
  - number: 7.5.3
    text: Het tweede lid is van overeenkomstige toepassing op productie- en afstelwerkzaamheden met of aan een arbeidsmiddel.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.5
  - number: 7.5.4
    text: Een bij een arbeidsmiddel behorend onderhoudsboek wordt goed bijgehouden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.5
  - number: 7.5.5
    text: |-
      Montage en demontage van een arbeidsmiddel vindt op veilige wijze plaats, met inachtneming van de eventuele
      aanwijzingen van de fabrikant.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.5
  - number: 7.6.1
    text: |-
      Met betrekking tot arbeidsmiddelen waarvan het gebruik een specifiek gevaar voor de veiligheid van de werknemers
      kan opleveren blijft het gebruik voorbehouden aan werknemers die met het gebruik belast zijn.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.6
  - number: 7.6.2
    text: |-
      Werknemers die belast zijn met het ombouwen, onderhouden, repareren of reinigen van arbeidsmiddelen als bedoeld in
      het eerste lid, bezitten daartoe een specifieke deskundigheid en ervaring.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.6
  - number: 7.7.1
    text: |-
      Indien bewegende delen van een arbeidsmiddel gevaar opleveren, zijn zij van zodanige schermen of
      beveiligingsinrichtingen voorzien, dat het gevaar zoveel mogelijk wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.7
  - number: 7.7.2
    text: De schermen of beveiligingsinrichtingen zijn stevig uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.7
  - number: 7.7.3
    text: De schermen of beveiligingsinrichtingen leveren geen bijzondere gevaren op.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.7
  - number: 7.7.4
    text: |-
      De schermen of beveiligingsinrichtingen kunnen niet op eenvoudige wijze worden genegeerd of buiten werking worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.7
  - number: 7.7.5
    text: |-
      De schermen of beveiligingsinrichtingen zijn op voldoende afstand van de gevaarlijke zone van het arbeidsmiddel
      aangebracht.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.7
  - number: 7.7.6
    text: De schermen of beveiligingsinrichtingen belemmeren het zicht op de arbeid zo min mogelijk.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.7
  - number: 7.7.7
    text: |-
      De schermen of beveiligingsinrichtingen zijn op een zodanige wijze aangebracht dat de noodzakelijke onderhouds- en
      reparatiewerkzaamheden op veilige wijze kunnen worden uitgevoerd. Daarbij wordt zoveel mogelijk voorkomen dat de
      schermen of beveiligingsinrichtingen moeten worden gedemonteerd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.7
  - number: '7.8'
    text: In aanvulling op artikel 6.3 zijn werk- en onderhoudspunten van een arbeidsmiddel voldoende en doelmatig verlicht.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.8
  - number: '7.9'
    text: |-
      Zoveel mogelijk wordt voorkomen dat werknemers in de onmiddellijke nabijheid komen van een arbeidsmiddel of een
      onderdeel daarvan met een zeer hoge of zeer lage temperatuur. Indien dat niet mogelijk is, zijn doeltreffende
      maatregelen genomen om aanraking van dat arbeidsmiddel dan wel van dat onderdeel daarvan te voorkomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.9
  - number: '7.10'
    text: |-
      Alarmsignalen van een arbeidsmiddel zijn gemakkelijk en duidelijk waarneembaar en als zodanig goed herkenbaar. Zij
      voldoen aan het bij of krachtens [afdeling 2 van hoofdstuk 8][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.10
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '8'
        afdeling: '2'
  - number: 7.11.1
    text: |-
      Een arbeidsmiddel beschikt over duidelijk herkenbare voorzieningen waarmee het van zijn krachtbronnen kan worden
      losgekoppeld.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.11
  - number: 7.11.2
    text: |-
      Het na loskoppeling opnieuw aansluiten van een arbeidsmiddel op zijn krachtbron levert geen gevaar op voor de
      werknemers.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.11
  - number: 7.11a.1
    text: |-
      Een bij een arbeidsmiddel behorende gebruiksaanwijzing wordt in begrijpelijke vorm ter kennis gebracht van de
      betrokken werknemers.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.11a
  - number: 7.11a.2
    text: |-
      Indien het gebruik of de aanwezigheid van arbeidsmiddelen in de onmiddellijke werkomgeving gevaren voor
      de werknemers kunnen opleveren, worden zij hierop gewezen, ook indien de werknemers van deze middelen geen
      rechtstreeks gebruik maken.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.11a
  - number: '7.12'
    text: |-
      Op een arbeidsmiddel met een bedieningssysteem zijn naast de voorschriften van de [afdelingen 1][ref1] en
      [2][ref2] van dit hoofdstuk tevens de voorschriften van deze afdeling van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.12
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '7'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008498
        hoofdstuk: '7'
        afdeling: '2'
  - number: 7.13.1
    text: Een bedieningssysteem van een arbeidsmiddel is veilig.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.13
  - number: 7.13.2
    text: Een bedieningssysteem levert ook bij onopzettelijke handelingen geen gevaar op voor de werknemers.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.13
  - number: 7.13.3
    text: |-
      Bij de keuze van een bedieningssysteem wordt rekening gehouden met defecten, storingen en belastingen die bij het
      gebruik van het bedieningssysteem kunnen worden verwacht.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.13
  - number: 7.13.4
    text: |-
      Een bedieningssysteem is duidelijk zichtbaar en herkenbaar en is daartoe, waar nodig, op passende wijze van
      functionele aanduidingen voorzien.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.13
  - number: 7.13.5
    text: Een bedieningssysteem bevindt zich zoveel mogelijk buiten de gevaarlijke zone van het arbeidsmiddel.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.13
  - number: 7.13.6
    text: De plaats van het bedieningssysteem levert geen extra gevaren op voor de werknemers.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.13
  - number: 7.13.7
    text: |-
      Indien een arbeidsmiddel in werking kan worden gesteld of kan worden gestopt op een plaats van waar dat
      arbeidsmiddel niet geheel kan worden gezien, wordt, om de betrokken werknemers te beschermen, telkens tijdig voor
      het inwerkingstellen of stoppen van dat arbeidsmiddel een signaal gegeven dat voldoet aan het bij of krachtens
      [afdeling 2 van hoofdstuk 8][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.13
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '8'
        afdeling: '2'
  - number: 7.14.1
    text: |-
      Een arbeidsmiddel kan uitsluitend in werking worden gesteld door een opzettelijk verrichte handeling met een
      daarvoor bestemd bedieningssysteem.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.14
  - number: 7.14.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing voor het opnieuw in werking stellen na stilstand ongeacht
      de oorzaak daarvan, alsmede voor het bewerkstelligen van een belangrijke wijziging in de werking van het
      arbeidsmiddel, tenzij het opnieuw inwerkingstellen of deze wijziging geen gevaren voor personen kunnen opleveren.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.14
  - number: 7.14.3
    text: |-
      Het tweede lid is niet van toepassing, indien het inwerkingstellen of wijzigen van de werking van een arbeidsmiddel
      behoort tot het normale programma van een automatische cyclus.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.14
  - number: 7.15.1
    text: |-
      Een arbeidsmiddel kan op veilige wijze worden stopgezet met een daarvoor bestemd bedieningssysteem. Een
      bedieningssysteem stopt naar gelang het gevaar hetzij het gehele arbeidsmiddel hetzij onderdelen daarvan, zodanig
      dat het arbeidsmiddel in een veilige toestand is.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.15
  - number: 7.15.2
    text: |-
      Wanneer het arbeidsmiddel of onderdelen daarvan zijn stopgezet, wordt de energietoevoer naar het arbeidsmiddel of
      de onderdelen daarvan die het gevaar veroorzaken, onderbroken.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.15
  - number: 7.15.3
    text: |-
      De opdracht tot het stopzetten van een arbeidsmiddel of een onderdeel daarvan kan niet worden opgeheven door een
      opdracht tot starten van dat arbeidsmiddel of een onderdeel daarvan.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.15
  - number: '7.16'
    text: |-
      Een arbeidsmiddel beschikt over een noodstopvoorziening, indien dit met het oog op de gevaren van dat arbeidsmiddel
      en de normale tijd die nodig is om dat arbeidsmiddel stop te zetten noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.16
  - number: '7.17'
    text: |-
      Op de in deze afdeling genoemde specifieke arbeidsmiddelen en werkzaamheden zijn naast de voorschriften van de
      [afdelingen 1 tot en met 3][ref1] van dit hoofdstuk tevens de voorschriften van deze afdeling van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '7'
        afdeling: '1'
  - number: 7.17a.1
    text: |-
      Mobiele arbeidsmiddelen waarop een of meer personen kunnen worden vervoerd, zijn zodanig uitgerust dat het gevaar
      voor deze personen tijdens het vervoer zoveel mogelijk wordt beperkt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17a
  - number: 7.17a.2
    text: |-
      Mobiele arbeidsmiddelen, met uitzondering van heftrucks, waarmee een of meer personen kunnen worden vervoerd, zijn
      zodanig uitgerust dat onder de feitelijke gebruiksomstandigheden de gevaren als gevolg van het kantelen of omvallen
      van het mobiele arbeidsmiddel zoveel mogelijk worden beperkt door:
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17a
  - number: 7.17a.2.a
    text: een beschermingsconstructie die verhindert dat het mobiele arbeidsmiddel meer dan een kwartslag kantelt;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17a
  - number: 7.17a.2.b
    text: |-
      een constructie die ervoor zorgt dat er rond de te vervoeren personen voldoende vrije ruimte voorhanden is, wanneer
      het mobiele arbeidsmiddel zich meer dan een kwartslag kan bewegen, of
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17a
  - number: 7.17a.2.c
    text: andere voorzieningen met een gelijk veiligheidsniveau.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17a
  - number: 7.17a.3
    text: |-
      Het tweede lid is niet van toepassing indien het mobiele arbeidsmiddel tijdens het gebruik wordt gestabiliseerd of
      indien het mobiele arbeidsmiddel zodanig is ontworpen dat het niet kan kantelen of omvallen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17a
  - number: 7.17a.4
    text: |-
      Indien het gevaar bestaat dat de te vervoeren personen bij kanteling of omslaan bekneld kunnen raken tussen
      de delen van het mobiele arbeidsmiddel en de grond, is een systeem geïnstalleerd waarmee zij kunnen worden
      tegengehouden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17a
  - number: 7.17a.5
    text: |-
      Heftrucks waarmee een of meer personen kunnen worden vervoerd, zijn zodanig uitgerust, dat het gevaar van kantelen
      of de gevolgen daarvan zoveel mogelijk worden beperkt door:
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17a
  - number: 7.17a.5.a
    text: een bestuurderscabine;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17a
  - number: 7.17a.5.b
    text: een inrichting die verhindert dat de heftruck kantelt;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17a
  - number: 7.17a.5.c
    text: |-
      een inrichting die ervoor zorgt dat, indien de heftruck kantelt, er voor de te vervoeren personen voldoende vrije
      ruimte is tussen de grond en bepaalde delen van de heftruck;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17a
  - number: 7.17a.5.d
    text: |-
      een inrichting op elke zitplaats van de heftruck, waarmee de op de truck aanwezige personen zich op de zitplaats
      kunnen vastzetten, of
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17a
  - number: 7.17a.5.e
    text: andere voorzieningen met een gelijk veiligheidsniveau.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17a
  - number: 7.17a.6
    text: |-
      Indien het onverhoeds blokkeren van onderdelen voor de energie-overbrenging tussen het mobiele arbeidsmiddel en
      zijn hulpstukken of aanhangers specifieke gevaren kan opleveren, is dit arbeidsmiddel uitgerust met een voorziening
      die deze blokkering verhindert. Indien een dergelijke blokkering niet kan worden verhinderd, zijn zodanige
      maatregelen genomen dat de gevaren zoveel mogelijk worden beperkt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17a
  - number: 7.17a.7
    text: |-
      Mobiele arbeidsmiddelen zijn voorzien van middelen voor de bevestiging van onderdelen voor de energie-overbrenging,
      wanneer deze onderdelen vervuild of beschadigd kunnen raken doordat zij over de grond slepen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17a
  - number: 7.17b.1
    text: |-
      In aanvulling op [artikel 7.17a][ref1] is dit artikel van toepassing op mobiele arbeidsmiddelen met eigen
      aandrijving waarvan de verplaatsing gevaren voor de werknemers kan opleveren.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel7
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
        afdeling: '4'
  - number: 7.17b.2
    text: 'Mobiele arbeidsmiddelen worden uitgerust met:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17b
  - number: 7.17b.2.a
    text: voorzieningen om te vermijden dat zij door onbevoegden in werking kunnen worden gesteld;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17b
  - number: 7.17b.2.b
    text: |-
      een inrichting die automatisch verhindert dat het mobiele arbeidsmiddel, indien dit middel elektrisch wordt
      aangedreven, onverhoeds in beweging kan komen wanneer de bestuurder het middel verlaat of heeft verlaten;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17b
  - number: 7.17b.2.c
    text: |-
      doeltreffende voorzieningen ter beperking van de gevolgen van een eventuele botsing, indien verschillende, op rails
      rijdende arbeidsmiddelen tegelijkertijd worden verplaatst;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17b
  - number: 7.17b.2.d
    text: een rem- en stopvoorziening;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17b
  - number: 7.17b.2.e
    text: |-
      een noodvoorziening, voorzover die om veiligheidsredenen noodzakelijk is, welke voorziening bij het uitvallen
      van het hoofdsysteem van de rem- en stopvoorziening het mobiele arbeidsmiddel door gemakkelijk toegankelijke
      besturingsorganen of door automatische systemen het mobiele arbeidsmiddel kan afremmen en tot stilstand brengen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17b
  - number: 7.17b.2.f
    text: |-
      doeltreffende hulpmiddelen die een toereikend zicht voor de bestuurder mogelijk maken indien het directe
      gezichtsveld van hem ontoereikend is om de veiligheid van personen te waarborgen, en
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17b
  - number: 7.17b.2.g
    text: |-
      deugdelijke voorzieningen waarmee signalen kunnen worden gegeven die voldoen aan het bij of krachtens
      [afdeling 2 van hoofdstuk 8][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '8'
        afdeling: '2'
  - number: 7.17b.3
    text: |-
      Indien mobiele arbeidsmiddelen 's nachts of op donkere plaatsen worden gebruikt, zijn zij voorzien van een
      verlichtingsinstallatie die is aangepast aan het uit te voeren werk en die de werknemers voldoende veiligheid
      biedt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17b
  - number: 7.17b.4
    text: |-
      Indien mobiele arbeidsmiddelen, hun aanhangers, of ladingen brandgevaar voor personen kunnen opleveren, zijn zij
      voorzien van doeltreffende brandbestrijdingsmiddelen, tenzij de arbeidsplaats hiermee op voldoende korte afstand
      van deze arbeidsmiddelen, hun aanhangers of ladingen is uitgerust.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17b
  - number: 7.17b.5
    text: |-
      Indien mobiele arbeidsmiddelen op afstand worden bediend, komen zij automatisch tot stilstand wanneer zij het
      controlegebied verlaten.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17b
  - number: 7.17b.6
    text: |-
      Indien mobiele arbeidsmiddelen op afstand worden bediend en onder normale gebruiksomstandigheden werknemers kunnen
      aan- of klemrijden, zijn zij uitgerust met voorzieningen die bescherming tegen deze gevaren bieden, tenzij er
      andere geschikte voorzieningen aanwezig zijn om het gevaar van aanrijdingen te beperken.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17b
  - number: 7.17c.1
    text: |-
      Mobiele arbeidsmiddelen met een eigen aandrijving worden bediend door werknemers die daartoe een specifieke
      deskundigheid bezitten.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17c
  - number: 7.17c.2
    text: |-
      Het meerijden van werknemers op mobiele arbeidsmiddelen met eigen aandrijving is slechts toegestaan op speciaal
      daartoe ingerichte veilige plaatsen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17c
  - number: 7.17c.3
    text: |-
      Indien tijdens de verplaatsing van een arbeidsmiddel als bedoeld in het tweede lid, werkzaamheden worden
      uitgevoerd, wordt de snelheid van het arbeidsmiddel zo nodig aangepast.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17c
  - number: 7.17c.4
    text: |-
      Met een mobiel arbeidsmiddel worden niet meer personen en wordt niet meer gewicht aan goederen tegelijk vervoerd
      dan een veilig gebruik toelaat.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17c
  - number: 7.17c.5
    text: |-
      Indien een mobiel arbeidsmiddel zich binnen een werkzone waar werknemers zich kunnen bevinden, beweegt, worden
      doeltreffende verkeersregels vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17c
  - number: 7.17c.6
    text: |-
      Doeltreffende organisatorische maatregelen worden genomen om te voorkomen dat werknemers zich bevinden in de
      werkzone van mobiele arbeidsmiddelen met eigen aandrijving.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17c
  - number: 7.17c.7
    text: |-
      Indien voor de goede uitvoering van de werkzaamheden de aanwezigheid van werknemers in een werkzone als bedoeld
      in het zesde lid, is vereist, worden doeltreffende maatregelen genomen om te voorkomen dat zij door het mobiele
      arbeidsmiddel gewond raken.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17c
  - number: 7.17c.8
    text: |-
      Met een verbrandingsmotor uitgeruste mobiele arbeidsmiddelen worden op de arbeidsplaats niet gebruikt, tenzij is
      gezorgd voor voldoende schone lucht.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17c
  - number: 7.17c.9
    text: |-
      Een mobiel arbeidsmiddel wordt niet eerder door de bestuurder verlaten dan nadat is voorkomen dat het onverhoeds in
      beweging komt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17c
  - number: 7.17d
    text: |-
      Bij transport van werknemers over water worden doeltreffende maatregelen getroffen om de veiligheid van deze
      werknemers te waarborgen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.17d
  - number: 7.18.1
    text: |-
      Een hijs- of hefwerktuig is op of nabij de bedieningsplaats voorzien van een goed leesbare aanduiding, die voor
      elke gebruikelijke configuratie van dat werktuig de toegelaten bedrijfslast vermeldt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.18
  - number: 7.18.2
    text: |-
      Een hijs- of hefwerktuig wordt, behalve ten behoeve van beproeving, niet zwaarder belast dan de toegelaten
      bedrijfslast of bedrijfslasten noch zwaarder dan een veilig gebruik toelaat.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.18
  - number: 7.18.3
    text: Hijs- en hefwerktuigen worden bediend door personen die daartoe een specifieke deskundigheid bezitten.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.18
  - number: 7.18.4
    text: |-
      Een hijs- of hefwerktuig dat niet is bestemd of ingericht voor het hijsen of heffen van personen en waarbij de kans
      aanwezig is op foutief gebruik, wordt voorzien van een goed leesbare waarschuwing tegen personenvervoer.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.18
  - number: 7.18.5
    text: |-
      Hijs- en hefwerktuigen worden zodanig opgesteld dat het gevaar wordt beperkt dat de lasten de werknemers raken, dan
      wel ongewild op gevaarlijke wijze uit hun baan of in een vrije val raken of losraken.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.18
  - number: 7.18.6
    text: |-
      Doeltreffende maatregelen worden genomen om ervoor te zorgen dat werknemers zich niet ophouden onder hangende
      lasten.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.18
  - number: 7.18.7
    text: Hangende lasten worden niet verplaatst boven niet beschermde werkplekken waar zich in de regel werknemers bevinden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.18
  - number: 7.18.8
    text: |-
      Indien bij toepassing van de leden zes en zeven het goede verloop van de werkzaamheden niet kan worden
      gegarandeerd, worden passende procedures vastgesteld en toegepast om de veiligheid van de betrokken werknemers
      te waarborgen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.18
  - number: 7.18a.1
    text: |-
      In aanvulling op [artikel 7.18][ref1] is dit artikel van toepassing op het gebruik van hijs- en hefwerktuigen die
      dienen voor het hijsen of heffen van niet-geleide lasten.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel7
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.18a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 2a
        afdeling: '4'
  - number: 7.18a.2
    text: |-
      Wanneer twee of meer hijs- of hefwerktuigen zodanig op een werkplek worden geïnstalleerd of gemonteerd dat hun
      werkgebieden elkaar overlappen, worden doeltreffende maatregelen genomen om botsingen tussen de lasten of delen van
      deze werktuigen te voorkomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.18a
  - number: 7.18a.3
    text: |-
      Bij het gebruik van een mobiel hijs- of hefwerktuig worden doeltreffende maatregelen genomen om te voorkomen dat
      het werktuig kantelt, ongewild in beweging komt of wegglijdt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.18a
  - number: 7.18a.4
    text: Er wordt op toegezien dat de maatregelen, bedoeld in het derde lid, naar behoren worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.18a
  - number: 7.18a.5
    text: |-
      Wanneer de bediener van een hijs- of hefwerktuig noch rechtstreeks noch door middel van informatieverstrekkende
      hulpmiddelen de volledige baan van de last kan volgen, wordt een werknemer aangewezen die met de bediener in
      verbinding staat om deze te leiden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.18a
  - number: 7.18a.6
    text: |-
      Voorts worden verdere organisatorische maatregelen genomen om ongewilde botsingen van de last van het hijs- of
      hefwerktuig te voorkomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.18a
  - number: 7.18a.7
    text: |-
      Wanneer lasten met de hand worden vast- of losgemaakt, zijn de werkzaamheden zodanig georganiseerd dat de werknemer
      deze handelingen veilig kan verrichten en hierover direct of indirect controle behoudt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.18a
  - number: 7.18a.8
    text: |-
      Alle handelingen voor het hijsen of heffen worden correct gepland teneinde de veiligheid van de werknemers te
      garanderen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.18a
  - number: 7.18a.9
    text: De handelingen, bedoeld in het achtste lid, worden onder doeltreffend toezicht uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.18a
  - number: 7.18a.10
    text: |-
      Met name indien een last gelijktijdig wordt gehesen of geheven door twee of meer hijs- of hefwerktuigen wordt een
      procedure vastgesteld en toegepast om een goede coördinatie van de handelingen van de bedieners te waarborgen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.18a
  - number: 7.18a.11
    text: |-
      Indien hijs- of hefwerktuigen bij het geheel of gedeeltelijk uitvallen van de energietoevoer de lasten niet meer
      kunnen houden, zijn doeltreffende maatregelen genomen om te vermijden dat werknemers aan de daarmee verbonden
      gevaren worden blootgesteld.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.18a
  - number: 7.18a.12
    text: |-
      Op de lasten, bedoeld in het elfde lid, wordt voortdurend toezicht gehouden, tenzij de toegang tot de gevarenzone
      wordt verhinderd en de lasten volkomen veilig zijn vastgemaakt en worden vastgehouden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.18a
  - number: 7.18a.13
    text: |-
      In de open lucht gebruikte hijs- en hefwerktuigen worden stilgelegd zodra de weersomstandigheden zodanig
      verslechteren dat de bedrijfsveiligheid in gevaar komt en de werknemers aan gevaren worden blootgesteld. In dit
      geval worden doeltreffende beschermingsmaatregelen genomen, in het bijzonder om te verhinderen dat het hijs- of
      hefwerktuig kantelt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.18a
  - number: 7.18b.1
    text: |-
      In aanvulling op de [artikelen 7.18][ref1] en [7.18a][ref2] zijn hijs- en hefwerktuigen die zijn bestemd en
      ingericht voor het hijsen of heffen van personen, met zodanige voorzieningen uitgerust dat zoveel mogelijk wordt
      voorkomen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel7
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.18b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 2a
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 2a
        afdeling: '4'
  - number: 7.18b.1.a
    text: het hijs- of hefplatform voor personen naar beneden valt,
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.18b
  - number: 7.18b.1.b
    text: personen van dit platform vallen,
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.18b
  - number: 7.18b.1.c
    text: |-
      een persoon die van het hijs- of hefwerktuig gebruik maakt wordt verpletterd, beklemd raakt of wordt aangestoten,
      in het bijzonder als gevolg van een onopzettelijk contact met een voorwerp.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.18b
  - number: 7.18b.2
    text: |-
      Een hijs- of hefwerktuig als bedoeld in het eerste lid, heeft voorts een zodanige voorziening, dat bij een
      mankement aan het werktuig de veiligheid van personen die zich op het hijs- of hefplatform voor personen bevinden,
      zoveel mogelijk is gewaarborgd en dat hun bevrijding mogelijk is.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.18b
  - number: 7.18b.3
    text: |-
      Indien het gevaar, bedoeld in het eerste lid, onder a, om redenen in verband met de terreinomstandigheden en het
      hoogteverschil niet met behulp van een veiligheidsvoorziening kan worden vermeden, is in de ophanging van het hijs-
      of hefplatform een geschikte kabel, ketting of een andere voorziening met een verhoogde veiligheidscoëfficiënt
      toegepast.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.18b
  - number: 7.18b.4
    text: |-
      In het geval, bedoeld in het derde lid, wordt de goede staat van de in de ophanging toegepaste kabel, ketting of
      andere voorziening elke werkdag gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.18b
  - number: 7.20.1
    text: |-
      Hijs- en hefgereedschap wordt gekozen op grond van te hanteren lasten, de aanslagpunten, de haakvoorziening en
      de weersomstandigheden, daarbij rekening houdend met de wijze van aanslaan van de last en het te gebruiken hijs-
      of hefwerktuig.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.20
  - number: 7.20.2
    text: |-
      Hijs- en hefgereedschap, anders dan touwwerk of staalkabels, is voorzien van een goed leesbare aanduiding die de
      werklast vermeldt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.20
  - number: 7.20.3
    text: |-
      Samengesteld hijs- en hefgereedschap is duidelijk gemarkeerd om de gebruiker in staat te stellen de kenmerken ervan
      te kennen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.20
  - number: 7.20.4
    text: |-
      Hijs- en hefgereedschap wordt, behalve ten behoeve van beproeving, niet zwaarder belast dan de werklast noch
      zwaarder dan een veilig gebruik toelaat.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.20
  - number: 7.20.5
    text: Hijs- en hefgereedschap wordt zodanig opgeslagen dat het niet kan worden beschadigd of aangetast.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.20
  - number: 7.20.6
    text: |-
      Hijs- en hefgereedschap wordt ten minste eenmaal per jaar door een deskundige natuurlijke persoon, rechtspersoon of
      instelling op zijn goede staat onderzocht waarbij het zo nodig wordt beproefd. Deze persoon of instelling beschikt
      over de daarvoor benodigde uitrusting.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.20
  - number: 7.20.7
    text: |-
      In aanvulling op het zesde lid wordt kettingwerk, afhankelijk van de materiaalsoort, zo dikwijls als voor een
      veilig gebruik nodig is, aan een voor het betrokken materiaal geschikte warmtebehandeling onderworpen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.20
  - number: 7.20.8
    text: |-
      De warmtebehandeling, bedoeld in het zevende lid, wordt uitgevoerd door een deskundige natuurlijke persoon,
      rechtspersoon of instelling die beschikt over de daarvoor benodigde uitrusting.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.20
  - number: 7.20.9
    text: |-
      Bewijsstukken van de onderzoeken, beproevingen en warmte-behandelingen, bedoeld in het zesde en zevende
      lid, zijn op de arbeidsplaats aanwezig en worden desgevraagd getoond aan een ambtenaar als bedoeld in
      [artikel 24 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.20
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 7.21.1
    text: |-
      Indien zich in een schacht twee of meer liften bevinden, worden afdoende technische maatregelen genomen teneinde te
      voorkomen dat personen bij werkzaamheden in de schacht aan een van de liften, getroffen worden door onderdelen van
      een naastliggende lift.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.21
  - number: 7.21.2
    text: |-
      Indien het nemen van de maatregelen, bedoeld in het eerste lid, niet mogelijk is, wordt het in het eerste lid
      bedoelde gevaar voorkomen door stilzetting van de naastliggende lift.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.21
  - number: 7.22.1
    text: |-
      Met een hijs- of hefwerktuig dat uitsluitend is bestemd en ingericht voor het vervoer van goederen, mogen in de
      plaats van of te zamen met goederen geen personen worden vervoerd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.22
  - number: 7.22.2
    text: |-
      Het eerste lid is niet van toepassing op het vervoer van personen met behulp van een werkbak ten behoeve van het
      vanuit die werkbak verrichten van incidentele werkzaamheden van korte duur op plaatsen die moeilijk bereikbaar
      zijn, indien toepassing van andere, meer geëigende middelen om die plaatsen te bereiken, grotere gevaren zou
      meebrengen dan het vervoer van personen met een werkbak als vorenbedoeld, of de toepassing van zodanige middelen
      redelijkerwijs niet kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.22
  - number: 7.22.3
    text: 'In geval van toepassing van het tweede lid, gelden de volgende voorschriften:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.22
  - number: 7.22.3.a
    text: |-
      de werkbak, bedoeld in het tweede lid, is zodanig vervaardigd, ingericht, toegerust, bevestigd, verkeert in
      een zodanige staat van onderhoud en wordt op een zodanige wijze gebruikt, dat gevaar voor de veiligheid en de
      gezondheid van de werknemers zoveel mogelijk wordt voorkomen of beperkt;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.22
  - number: 7.22.3.b
    text: het hijs- of hefwerktuig is voldoende toegerust om in combinatie met een werkbak te worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.22
  - number: 7.22.3.c
    text: de bedieningsplaats van het hijs- of hefwerktuig is permanent bemand;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.22
  - number: 7.22.3.d
    text: de werknemers die worden gehesen of geheven beschikken over een doeltreffend communicatiemiddel, en
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.22
  - number: 7.22.3.e
    text: doeltreffende voorzieningen zijn getroffen om de werknemers bij gevaar te kunnen evacueren.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.22
  - number: 7.24.1
    text: |-
      In aanvulling op artikel 3.2 is de toegang tot een ruim van een schip of dek uitsluitend toegestaan door een vaste
      trap of, indien dit niet mogelijk is, een vaste ladder of klampen of voetopeningen van geschikte afmetingen, van
      voldoende sterkte en van een behoorlijke constructie dan wel andere deugdelijke toegangsmiddelen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.24
  - number: 7.24.2
    text: |-
      De in het eerste lid genoemde toegangsmiddelen zijn, indien dit redelijkerwijs mogelijk is, gescheiden van de
      luikopeningen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.24
  - number: 7.25.1
    text: |-
      Luiken die met behulp van hijs- of hefwerktuigen worden geplaatst of verwijderd, zijn uitgerust met goed
      toegankelijke en geschikte bevestigingen voor het vastmaken van hijsgereedschap.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.25
  - number: 7.25.2
    text: |-
      Indien luiken niet onderling verwisselbaar zijn, zijn zij duidelijk gemerkt om aan te geven tot welke ruimopening
      alsmede op welke plaats zij behoren.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.25
  - number: 7.25.3
    text: |-
      Motorisch of hydraulisch bediende luiken en overige motorisch of hydraulisch aangedreven scheepsuitrusting worden
      uitsluitend geplaatst of verwijderd door een daartoe bevoegde persoon.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.25
  - number: 7.25.4
    text: |-
      De in het derde lid bedoelde luiken en scheepsuitrusting worden uitsluitend geplaatst of verwijderd indien dit op
      veilige wijze kan gebeuren.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.25
  - number: 7.25.5
    text: |-
      Luikopeningen die niet zijn uitgerust met een doelmatig luikhoofd worden gesloten dan wel anderszins beveiligd
      zodra de laad- en loswerkzaamheden zijn beëindigd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.25
  - number: 7.25.6
    text: Luiken worden niet geplaatst of verwijderd, indien er in het ruim onder de luikopening arbeid wordt verricht.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.25
  - number: 7.25.7
    text: |-
      Luiken die niet afdoende tegen verplaatsing zijn geborgd, worden verwijderd voordat met laad- en loswerkzaamheden
      wordt begonnen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.25
  - number: 7.26.1
    text: |-
      Het opslaan of overslaan, laden of lossen, stuwen of anderszins verwerken van goederen of materialen op de kade, in
      loodsen of in het schip, geschiedt op veilige en ordelijke wijze, rekening houdend met de aard van die goederen of
      materialen en de verpakking daarvan.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.26
  - number: 7.26.2
    text: |-
      Lasten worden niet opgelicht of neergelaten, tenzij zij op veilige wijze aan het hijs- of hefwerktuig zijn
      aangeslagen of anderszins bevestigd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.26
  - number: 7.27.1
    text: |-
      Voor het veilig tuigen van laadbomen en het bijbehorende gerei zijn aan boord van het schip tuigplannen en alle
      daarop betrekking hebbende gegevens aanwezig. De tuigplannen worden desgevraagd getoond aan een ambtenaar als
      bedoeld in [artikel 24 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.27
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 7.27.2
    text: Voor eenmalig gebruik bestemde bind- of hijsmiddelen worden niet opnieuw gebruikt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.27
  - number: '7.28'
    text: |-
      Tijdens het laden en lossen van containers zijn deugdelijke middelen aanwezig die de veiligheid van de werknemers
      bij het aanbrengen of verwijderen van de sjorringen van de containers waarborgen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.28
  - number: 7.29.1
    text: |-
      In afwijking van [artikel 7.20, zesde, zevende, achtste en negende lid][ref1], gelden voor hijs- en hefwerktuigen
      alsmede hijs- en hefgereedschappen aan boord van schepen, die gebruikt worden voor het laden en lossen, de volgende
      bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel7
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.29
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 2a
        afdeling: '4'
  - number: 7.29.2
    text: |-
      Hijs- en hefwerktuigen met inbegrip van de daarbij behorende hulpstukken, onderdelen, bevestigingspunten,
      verankeringen en steunen, en hijs- en hefgereedschappen worden, voordat zij voor de eerste maal in gebruik worden
      genomen, doelmatig beproefd en op hun goede staat onderzocht.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.29
  - number: 7.29.3
    text: |-
      Werktuigen en gereedschappen als bedoeld in het tweede lid, worden na iedere belangrijke wijziging of herstelling
      die van invloed kan zijn op de veiligheid, doelmatig beproefd en op hun goede staat onderzocht.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.29
  - number: 7.29.4
    text: |-
      Werktuigen en gereedschappen als bedoeld in het tweede lid, worden, afhankelijk van de feitelijke belasting,
      regelmatig doch in ieder geval ten minste eenmaal per vijf jaar, doelmatig beproefd en op hun goede staat
      onderzocht.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.29
  - number: 7.29.5
    text: |-
      Hijs- en hefwerktuigen en hijs- en hefgereedschappen worden, afhankelijk van de feitelijke belasting, regelmatig
      doch in ieder geval ten minste eenmaal per jaar, op hun goede staat onderzocht.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.29
  - number: 7.29.6
    text: Hijs- en hefgereedschappen worden, afhankelijk van het gebruik, regelmatig op hun goede staat gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.29
  - number: 7.29.7
    text: |-
      Beproevingen en onderzoeken als bedoeld in het tweede tot en met vierde lid, worden uitgevoerd door Onze Minister
      of een certificerende instelling.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.29
  - number: 7.29.8
    text: |-
      Onderzoeken en controles als bedoeld in het vijfde en zesde lid, worden uitgevoerd door een deskundige natuurlijke
      persoon, rechtspersoon of instelling.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.29
  - number: 7.29.9
    text: |-
      Van de beproevingen en onderzoeken, bedoeld in het tweede tot en met vierde lid, worden door de certificerende
      instelling, bedoeld in het zevende lid, certificaten uitgereikt volgens een bij ministeriële regeling vastgesteld
      model.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.29
  - number: 7.29.10
    text: |-
      Aan boord van ieder schip wordt een register van hijs- en hefwerktuigen en hijs- en hefgereedschappen bijgehouden
      volgens een bij ministeriële regeling vastgesteld model, waarin de in het negende lid bedoelde certificaten worden
      opgenomen. In het register worden de bedrijfslast of bedrijfslasten van de hijs- en hefwerktuigen, de werklast van
      de hijs- en hefgereedschappen alsmede de tijdstippen en de resultaten van de in het tweede tot en met vijfde lid,
      bedoelde beproevingen en onderzoeken vermeld. De tijdstippen en het resultaat van de in het zesde lid bedoelde
      controles worden vermeld, indien bij de desbetreffende controles een defect is geconstateerd. Het register wordt
      desgevraagd getoond aan een ambtenaar als bedoeld in [artikel 24 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.29
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 7.30.1
    text: |-
      Stukken of voorwerpen die ten minste 1000 kilogram bruto wegen en die met een schip worden vervoerd zijn aan de
      buitenzijde op een duidelijke en duurzame wijze voorzien van een aanduiding van het gewicht van die stukken of
      voorwerpen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.30
  - number: 7.30.2
    text: |-
      Bij vervoer van stukken of voorwerpen als bedoeld in het eerste lid mag, in plaats van het gewicht, zo nauwkeurig
      mogelijk het gewicht bij benadering worden aangeduid:
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.30
  - number: 7.30.2.a
    text: |-
      indien de aard, samenstelling of afmeting van het stuk of het voorwerp een beletsel vormen om het juiste gewicht
      te bepalen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.30
  - number: 7.30.2.b
    text: indien het gewicht als gevolg van klimaatsinvloeden aan aanmerkelijke veranderingen onderhevig is.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.30
  - number: '7.31'
    text: |-
      Op een bouwplaats zijn naast de voorschriften van de [afdelingen 1 tot en met 4][ref1] van dit hoofdstuk tevens de
      voorschriften van deze afdeling van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.31
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '7'
        afdeling: '1'
  - number: 7.32.1
    text: |-
      Een torenkraan, mobiele kraan of funderingsmachine die behoort tot een bij ministeriële regeling omschreven
      categorie, mag slechts worden bediend door een persoon die:
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.32
  - number: 7.32.1.a
    text: |-
      in het bezit is van een certificaat van vakbekwaamheid dat is afgegeven door Onze Minister of een certificerende
      instelling;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.32
  - number: 7.32.1.b
    text: |-
      in een zodanige lichamelijke en geestelijke toestand verkeert, dat hij in staat is de aan de bediening van het
      desbetreffende arbeidsmiddel verbonden gevaren te onderkennen en te voorkomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.32
  - number: 7.32.2
    text: |-
      Het certificaat van vakbekwaamheid of een afschrift daarvan is op de arbeidsplaats aanwezig en wordt desgevraagd
      getoond aan een ambtenaar als bedoeld in [artikel 24, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.32
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 7.32.3
    text: |-
      Het eerste lid is niet van toepassing op degene die in het kader van een opleiding tot machinist een torenkraan,
      mobiele kraan of funderingsmachine bedient, mits dit gebeurt onder toezicht van een persoon die in het bezit is van
      een certificaat van vakbekwaamheid als bedoeld in het eerste lid, onder a.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.32
  - number: 7.32.4
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de gelijkstelling van diploma's,
      bekwaamheidsattesten of andere deskundigheidsbewijzen voor de bediening van torenkranen, mobiele kranen of
      funderingsmachines met een certificaat als bedoeld in het eerste lid, onder a.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.32
  - number: 7.33.1
    text: Ladders en trappen zijn voldoende sterk en stijf.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.33
  - number: 7.33.2
    text: |-
      Ladders en trappen zijn stabiel opgesteld en zo nodig vastgezet en van een voldoende lengte om in alle standen
      waarin zij worden gebruikt, een stevige steun voor handen en voeten te bieden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.33
  - number: 7.34.1
    text: Het opbouwen, wijzigen en afbreken van een steiger geschiedt onder toezicht van een ter zake deskundig persoon.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.34
  - number: 7.34.2
    text: |-
      De veiligheid van de constructie van een steiger wordt regelmatig door een ter zake deskundig persoon gecontroleerd
      doch in ieder geval vóór de ingebruikneming en verder na iedere wijziging in de constructie van de steiger, na
      iedere periode waarin de steiger niet is gebruikt, na abnormale weersomstandigheden alsmede na iedere andere
      gebeurtenis waardoor de veiligheid van de constructie van de steiger mogelijk is aangetast.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.34
  - number: 7.34.3
    text: Een steiger mag niet worden overbelast. Lasten worden zo gelijkmatig mogelijk over de steiger verdeeld.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.34
  - number: 7.34.4
    text: Verrijdbare steigers zijn beveiligd tegen ongewilde verplaatsingen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.34
  - number: 7.35.1
    text: |-
      Bestuurders en bedieners van grondverzet- en materiaalverladingsmachines bezitten daartoe een specifieke
      deskundigheid.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.35
  - number: 7.35.2
    text: |-
      Doeltreffende maatregelen worden genomen om te voorkomen dat grondverzet- en materiaalverladingsmachines ongewild
      in uitgravingen of in het water terechtkomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.35
  - number: 7.36a
    text: |-
      In de winningsindustrie in dagbouw, ondergronds of met behulp van boringen zijn naast de voorschriften van de
      [afdelingen 1 tot en met 4 van dit hoofdstuk][ref1] tevens de voorschriften van deze afdeling van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.36a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '7'
        afdeling: '1'
  - number: 7.36b.1
    text: |-
      Bij de keuze, de installatie, de ingebruikneming, de werking en het onderhoud van werktuigbouwkundige en
      elektrotechnische apparatuur wordt rekening gehouden met de veiligheid en gezondheid van de werknemers.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.36b
  - number: 7.36b.2
    text: |-
      Wanneer de apparatuur zich bevindt in een zone waar brand- of explosiegevaar als gevolg van de ontbranding van
      gassen, dampen of vluchtige vloeistoffen bestaat of kan bestaan, is zij aangepast aan gebruik in een dergelijke
      zone. Indien nodig wordt zij voorzien van afdoende beschermingsmiddelen en systemen ter beveiliging bij defecten.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.36b
  - number: 7.36b.3
    text: |-
      De mechanische apparatuur en installaties bezitten de nodige sterkte, zijn vrij van zichtbare gebreken en geschikt
      voor het gebruik waarvoor zij zijn bestemd. De elektrotechnische apparatuur en installaties hebben de nodige kracht
      en vermogen voor het gebruik waarvoor zij zijn bestemd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.36b
  - number: 7.36b.4
    text: |-
      Er wordt een doelmatig plan opgesteld voor het systematisch inspecteren, het onderhouden en, in voorkomend geval,
      het beproeven van de apparatuur en installaties. Onderhoud, inspectie en beproeving van enig onderdeel van de
      apparatuur en installaties wordt uitgevoerd door een daartoe aangewezen deskundig persoon. Er worden doelmatige
      inspectie- en beproevingsrapporten opgesteld en naar behoren bijgehouden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.36b
  - number: 7.36b.5
    text: |-
      In aanvulling op [artikel 7.16][ref1] zijn hijs- en hefwerktuigen die in de winningsindustrie met behulp van
      boringen worden gebruikt, voorzien van een doelmatige inrichting, waardoor het dalen van de last te allen tijde
      kan worden stopgezet, zo nodig de snelheid van het dalen kan worden geregeld en onverhoeds dalen van de last wordt
      belet.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel7
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.36b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '3'
  - number: 7.36b.6
    text: |-
      In de winningsindustrie met behulp van boringen worden hijs- en hefwerktuigen als bedoeld in [artikel 7.18b][ref1]
      slechts gebruikt voor het verrichten van incidentele werkzaamheden van korte duur op boorinstallaties indien de
      noodzaak daartoe is gebleken.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel7
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.36b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 2a
        afdeling: '4'
  - number: 7.36b.7
    text: |-
      Bij ministeriële regeling kunnen ten aanzien van het veilig gebruik van de hijs- en hefwerktuigen, bedoeld in het
      zesde lid, nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.36b
  - number: 7.37.1
    text: |-
      Hoofdstuk 7 is van toepassing op tewaterlatingsmiddelen voor reddingsmiddelen op zeeschepen voorzover geen afbreuk
      wordt gedaan aan het gebruiksdoel van deze middelen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.37
  - number: 7.37.2
    text: |-
      Artikel 7.4a, eerste tot en met derde lid, is, voorzover het betreft tewaterlatingsmiddelen voor reddingsmiddelen
      en mechanische loodsladders, niet van toepassing op zeeschepen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.37
  - number: 7.37.3
    text: |-
      Artikel 7.22, tweede en derde lid, is niet van toepassing op laad- en losgerei aan boord van zeeschepen en
      binnenvaartuigen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.37
  - number: 7.37.4
    text: |-
      Artikel 7.29 is niet van toepassing op vissersvaartuigen als bedoeld in [artikel 1 van de Schepenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel1
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.37
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: '1'
  - number: '7.38'
    text: |-
      In aanvulling op het bepaalde bij of krachtens dit hoofdstuk gelden voor jeugdige werknemers tevens de in deze
      paragraaf genoemde voorschriften en verboden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.38
  - number: '7.39'
    text: |-
      [Artikel 1.37, tweede lid][ref1], is van overeenkomstige toepassing op jeugdige werknemers die:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.39
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '8'
  - number: 7.39.a
    text: |-
      arbeid verrichten, bestaande in het besturen van trekkers en het in rechtstreeks verband daarmee aan- of afkoppelen
      van aanhangwagens of werktuigen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.39
  - number: 7.39.b
    text: arbeid verrichten met wilde, giftige of andere dieren die gevaar opleveren;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.39
  - number: 7.39.c
    text: dieren industrieel slachten;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.39
  - number: 7.39.d
    text: |-
      op basis van stukloon ongevarieerde, zich in een kort tijdsbestek herhalende arbeid verrichten, en arbeid
      verrichten waarbij het tempo op een zodanige wijze wordt beheerst dat de jeugdige werknemer zelf verhinderd wordt
      het tempo van de arbeid te beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.39
  - number: '7.40'
    text: |-
      Op thuiswerk zijn de [afdelingen 1][ref1], [2][ref2] en [3][ref3] van dit hoofdstuk van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk7
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.40
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '7'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008498
        hoofdstuk: '7'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0008498
        hoofdstuk: '7'
        afdeling: '3'
  - number: 7.41.1
    text: |-
      De voor de arbeid benodigde arbeidsmiddelen zijn, voor zover zij gevaar voor personen opleveren, voorzien van een
      doelmatige afscherming.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.41
  - number: 7.41.2
    text: |-
      De voor de arbeid benodigde arbeidsmiddelen met een bedieningssysteem zijn, zo dicht mogelijk bij de plaats van
      de persoon die het arbeidsmiddel bedient, voorzien van een zodanige inrichting dat dit arbeidsmiddel afzonderlijk,
      veilig en met zekerheid kan worden stilgezet en niet dan opzettelijk weer in beweging kan worden gebracht.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.41
  - number: 7.41.3
    text: De benodigde arbeidsmiddelen worden op de juiste wijze onderhouden en zonodig gerepareerd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.41
  - number: 7.42.1
    text: |-
      Aan de voor de arbeid benodigde arbeidsmiddelen met een bedieningssysteem welke gevaren van elektrische aard met
      zich brengen, zijn doeltreffende beveiligingen aangebracht, waarvan de werking zoveel mogelijk onafhankelijk is van
      degene die dat arbeidsmiddel bedient.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.42
  - number: 7.42.2
    text: |-
      Indien het in verband met de werkzaamheden noodzakelijk is dat elektrische apparatuur moet worden aangesloten
      of anderszins leidingen of kabels moeten worden aangelegd, gebeurt dit op een juiste wijze opdat daarvan door de
      thuiswerker veilig gebruik kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel7.42
  - number: 8.1.1
    text: |-
      Een door de werkgever aan de werknemer ter beschikking gesteld persoonlijk beschermingsmiddel is in overeenstemming
      met de betreffende bepalingen inzake ontwerp en constructie op het gebied van veiligheid en gezondheid, bedoeld
      in het [Warenwetbesluit persoonlijke beschermingsmiddelen][ref1]. De vorige volzin is slechts van toepassing voor
      zover bedoeld persoonlijk beschermingsmiddel onder het toepassingsgebied van genoemd besluit valt.


      [ref1]: https://wetten.overheid.nl/BWBR0005570
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0005570
  - number: 8.1.2
    text: 'In alle gevallen moet een persoonlijk beschermingsmiddel:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel8.1
  - number: 8.1.2.a
    text: geschikt zijn voor de te vermijden gevaren, zonder zelf een vergroot gevaar in te houden;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel8.1
  - number: 8.1.2.b
    text: beantwoorden aan de bestaande omstandigheden op de arbeidsplaats;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel8.1
  - number: 8.1.2.c
    text: afgestemd zijn op de ergonomische eisen en de vereisten met betrekking tot de gezondheid van de werknemers;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel8.1
  - number: 8.1.2.d
    text: na de nodige aanpassingen geschikt zijn voor de drager.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel8.1
  - number: 8.1.3
    text: |-
      Indien verschillende gevaren het tegelijkertijd dragen van meer dan één persoonlijk beschermingsmiddel noodzakelijk
      maken, zijn deze persoonlijke beschermingsmiddelen op elkaar afgestemd en blijven zij doelmatig tegen het
      betreffende gevaar of de betreffende gevaren.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel8.1
  - number: 8.1.4
    text: |-
      De keuze van het persoonlijk beschermingsmiddel en de wijze waarop dit gebruikt moet worden, met name wat betreft
      de duur van het dragen, worden bepaald afhankelijk van de ernst van het gevaar, de frequentie van de blootstelling
      aan het gevaar en de kenmerken van de arbeidsplaats van iedere werknemer afzonderlijk alsmede van de doelmatigheid
      van het persoonlijk beschermingsmiddel.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel8.1
  - number: 8.1.5
    text: |-
      Een persoonlijk beschermingsmiddel is in beginsel bestemd voor gebruik door één persoon. Indien de omstandigheden
      vereisen dat een persoonlijk beschermingsmiddel door meer dan één persoon gebruikt wordt, worden doeltreffende
      maatregelen genomen, opdat een dergelijk gebruik geen gezondheids- of hygiëneproblemen oplevert voor de
      onderscheiden gebruikers.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel8.1
  - number: 8.1.6
    text: |-
      Adequate gegevens over ieder persoonlijk beschermingsmiddel, nodig voor de toepassing van het eerste, tweede, derde
      en vierde lid, zijn in het bedrijf of de inrichting beschikbaar en worden zonodig doorgegeven.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel8.1
  - number: 8.1.7
    text: Persoonlijke beschermingsmiddelen worden slechts voor de beoogde doeleinden gebruikt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel8.1
  - number: 8.1.8
    text: Persoonlijke beschermingsmiddelen worden overeenkomstig de gebruiksaanwijzing gebruikt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel8.1
  - number: '8.2'
    text: |-
      Alvorens een persoonlijk beschermingsmiddel te kiezen maakt de werkgever, in het kader van de risico-inventarisatie
      en -evaluatie, bedoeld in [artikel 5 van de wet][ref1], een beoordeling van de uitrusting die hij voornemens is ter
      beschikking te stellen, teneinde na te gaan in hoeverre deze voldoet aan de in artikel 8.1, eerste, tweede en derde
      lid gestelde voorwaarden. Deze beoordeling omvat:


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
  - number: 8.2.a
    text: een risico-inventarisatie en -evaluatie van de gevaren die niet met andere middelen vermeden kunnen worden;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel8.2
  - number: 8.2.b
    text: |-
      een omschrijving van de kenmerken die de persoonlijke beschermingsmiddelen moeten bezitten om de onder *a*
      vermelde gevaren te kunnen ondervangen, rekening houdend met eventuele gevaarsbronnen die de persoonlijke
      beschermingsmiddelen zelf kunnen vormen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel8.2
  - number: 8.2.c
    text: |-
      een risico-inventarisatie en -evaluatie van de kenmerken van de betreffende persoonlijke beschermingsmiddelen die
      beschikbaar zijn, vergeleken met de onder *b* bedoelde kenmerken.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel8.2
  - number: 8.3.1
    text: |-
      Indien gevaar voor de veiligheid of de gezondheid van een werknemer op de arbeidsplaats aanwezig is of
      kan ontstaan, zijn voor de werknemers die aan dat gevaar blootstaan of kunnen blootstaan, persoonlijke
      beschermingsmiddelen in voldoende aantal beschikbaar.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel8.3
  - number: 8.3.2
    text: |-
      In de gevallen, bedoeld in het eerste lid, wordt ervoor gezorgd dat de werknemers de persoonlijke
      beschermingsmiddelen gebruiken.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel8.3
  - number: 8.3.3
    text: Persoonlijke beschermingsmiddelen worden onderhouden, gerepareerd en zindelijk gehouden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel8.3
  - number: 8.3.4
    text: |-
      Ten behoeve van het goed functioneren van persoonlijke beschermingsmiddelen vinden de noodzakelijke vervangingen
      daarvan plaats.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel8.3
  - number: 8.4.1
    text: |-
      Ter voorkoming of beperking van gevaren voor de veiligheid en de gezondheid van werknemers zorgt de werkgever
      ervoor dat, indien de gevaren op de arbeidsplaats of de gevaren van een arbeidsmiddel daartoe aanleiding geven,
      doeltreffende veiligheids- of gezondheidssignalering aanwezig is.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel8.4
  - number: 8.4.2
    text: Bij ministeriële regeling worden nadere regels gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel8.4
  - number: 8.14.1
    text: |-
      Afdeling 2 van dit hoofdstuk is niet van toepassing op de in of op een luchtvaartuig, een zeeschip
      of een binnenvaartuig dan wel een voertuig op de openbare weg, of spoorweg gebruikte veiligheids- of
      gezondheidssignalering, voor zover deze signalering op grond van enig ander wettelijk voorschrift is
      voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel8.14
  - number: 8.14.2
    text: |-
      De in artikel 8.4 bedoelde veiligheids- of gezondheidssignalering wordt, indien daar reden toe is, in of op de
      vervoermiddelen, genoemd in het eerste lid, gebruikt, wanneer deze zich bevinden op het terrein van het bedrijf of
      de inrichting.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel8.14
  - number: '8.15'
    text: Afdeling 1 van dit hoofdstuk is van overeenkomstige toepassing op thuiswerk.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel8.15
  - number: '9.1'
    text: |-
