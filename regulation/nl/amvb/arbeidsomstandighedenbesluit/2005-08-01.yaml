  - number: 9.34.1
    text: |-
      Artikel I, onderdelen A tot en met I, O, P, T en V van het Koninklijk besluit van 7 februari 2004 tot
      wijziging van het Arbeidsomstandighedenbesluit ter vervanging van de bepalingen met betrekking tot de
      arbeidsveiligheidsrapportage door aanvullende voorschriften met betrekking tot de risico-inventarisatie en
      -evaluatie en enige andere wijzigingen (Stb. 2004, 69) is tot twee jaar na de inwerkingtreding niet van toepassing
      tenzij dat besluit voor dat tijdstip wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.34
  - number: 9.34.2
    text: |-
      Ten aanzien van bedrijven of inrichtingen waar op de dag van de inwerkingtreding van het besluit, bedoeld
      in het eerste lid, over een arbeidsveiligheidsrapport als bedoeld in [artikel 2.2b][ref1], zoals dat artikel
      luidde op de dag voor de inwerkingtreding van voornoemd besluit, wordt beschikt, is, in afwijking van het
      eerste lid, het voornoemde besluit niet van toepassing tot het tijdstip waarop het arbeidsveiligheidsrapport
      had behoren te worden herzien op grond van [artikel 2.2b, tweede lid][ref2], zoals dat artikel luidde op de
      dag voor de inwerkingtreding van voornoemd besluit, doch uiterlijk tot vijf jaar na het tijdstip waarop het
      arbeidsveiligheidsrapport volledig is herzien en in zijn geheel aan de daartoe aangewezen ambtenaar, bedoeld in
      [artikel 24, eerste lid, van de wet][ref3] is toegezonden, tenzij dat besluit voor dat tijdstip wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.34
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 9.34.3
    text: |-
      De melding, bedoeld in [artikel 2.5g, eerste lid][ref1], ten aanzien van bedrijven of inrichtingen die in bedrijf
      zijn op de dag waarop het besluit, bedoeld in het eerste lid, ingevolge het eerste of het tweede lid wordt
      toegepast, vindt plaats binnen zes weken na de toepassing van voornoemd besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.34
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 9.34.4
    text: |-
      Het Arbeidsomstandighedenbesluit zoals dat luidde op de dag voor de inwerkingtreding van het besluit, bedoeld in
      het eerste lid, is van toepassing tot het tijdstip waarop ingevolge het eerste of het tweede lid het laatstgenoemde
      besluit wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.34
  - number: 9.36.1
    text: |-
      Indien jeugdige werknemers arbeid verrichten bestaande in het op de openbare weg besturen van trekkers en het
      in rechtstreeks verband daarmee aan- of afkoppelen van aanhangwagens of werktuigen, zijn zij in aanvulling op
      [artikel 7.39, onder a][ref1], in het bezit van een certificaat van vakbekwaamheid, dat is afgegeven door een door
      Onze Minister daartoe aangewezen instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel7
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.36
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
        afdeling: '6'
  - number: 9.36.2
    text: Dit artikel vervalt op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.36
  - number: 9.36a
    text: |-
      De [artikelen 7.17a][ref1], [7.17b][ref2], met uitzondering van het tweede lid, onder b en g,
      [7.18, vierde en vijfde lid][ref3], en [7.18b][ref4] zijn tot 5 december 2002 niet van toepassing op de in deze
      bepalingen bedoelde arbeidsmiddelen, indien zij reeds op 5 december 1998 op de arbeidsplaats ter beschikking
      stonden van de werknemers.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0008498#Artikel7
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.36a
    references:
      - id: ref1
