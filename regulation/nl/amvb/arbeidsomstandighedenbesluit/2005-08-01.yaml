        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: '1'
      - id: ref9
        bwb_id: BWBR0005181
        artikel: '1'
  - number: 3.1b
    text: |-
      Een arbeidsplaats in een gebouw als bedoeld in [artikel 1, eerste lid, onder c, van de Woningwet][ref1]
      wordt slechts gebruikt indien het gebouw voldoet aan de bij of krachtens het [Bouwbesluit 2003][ref2] gegeven
      voorschriften met betrekking tot de van toepassing zijnde gebruiksfunctie in de zin van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0012727
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.1b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0012727
  - number: 3.2.1
    text: |-
      Arbeidsplaatsen zijn veilig toegankelijk en kunnen veilig worden verlaten. Ze worden zodanig ontworpen, gebouwd,
      uitgerust, in bedrijf gesteld, gebruikt en onderhouden, dat gevaar voor de veiligheid en de gezondheid van de
      werknemers zoveel mogelijk is voorkomen. Voorts worden zij zindelijk, zoveel mogelijk vrij van stof en voor zover
      de veiligheid van de arbeidsplaats dat vereist, ordelijk gehouden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.2
  - number: 3.2.2
    text: |-
      Regelmatig wordt gecontroleerd of de op de arbeidsplaats ter bescherming van de werknemers aanwezige voorzieningen
      en genomen maatregelen nog adequaat functioneren.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.2
  - number: 3.2.3
    text: |-
      Geconstateerde gebreken met betrekking tot de in het tweede lid bedoelde voorzieningen en maatregelen die de
      veiligheid of de gezondheid kunnen beïnvloeden, worden zo snel mogelijk hersteld.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.2
  - number: 3.3.1
    text: |-
      Gebouwen en andere opstallen bestaan uit deugdelijk materiaal, zijn van een deugdelijke constructie en verkeren in
      een zodanige staat, dat er geen gevaar bestaat voor het geheel of gedeeltelijk instorten of omvallen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.3
  - number: 3.3.2
    text: |-
      De arbeidsplaats is zodanig ingericht, dat de daar aanwezige voorwerpen of stoffen geen gevaar voor de veiligheid
      of de gezondheid opleveren door instorten, verschuiven, omvallen of kantelen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.3
  - number: 3.4.1
    text: |-
      Elektrische installaties zijn zodanig ontworpen, ingericht, aangelegd, onderhouden en gekenmerkt, dat een
      veilig gebruik van elektriciteit zo goed mogelijk is gewaarborgd. Hiertoe zijn de nodige voorzieningen
      en beschermingsmaatregelen aangebracht, waaronder worden begrepen beveiligings-, meet-, controle- en
      signaleringstoestellen alsmede aarders, schakelaars, scheiders en contactdozen. Daarbij is rekening gehouden met
      bijzondere eisen die kunnen voortkomen uit de wijze van het gebruik, de gebruiksomstandigheden en de te verwachten
      uitwendige invloeden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.4
  - number: 3.4.2
    text: |-
      In een elektrische installatie zijn doeltreffende maatregelen genomen tegen het gevaar van brand, ontploffing,
      directe en indirecte aanraking en te dichte nadering.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.4
  - number: 3.4.3
    text: |-
      Van iedere elektrische installatie zijn duidelijke, steeds bijgewerkte schema’s beschikbaar alsmede alle overige
      gegevens die nodig zijn voor een veilig gebruik van de elektrische installatie.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.4
  - number: 3.4.4
    text: Het derde lid is niet van toepassing op elektrische installaties voor laagspanning van beperkte omvang.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.4
  - number: 3.5.1
    text: |-
      Elektrotechnische werkzaamheden en bedieningswerkzaamheden die gevaren kunnen opleveren, worden door deskundige,
      voldoend onderrichte en daartoe bevoegde werknemers uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5
  - number: 3.5.2
    text: |-
      Een ruimte waarin zich een elektrische installatie voor hoogspanning bevindt waarvan de delen niet of onvoldoende
      zijn beschermd tegen direkte of indirekte aanraking dan wel te dichte nadering, wordt slechts betreden in
      aanwezigheid van een tweede daartoe bevoegd persoon.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5
  - number: 3.5.3
    text: |-
      Werkzaamheden aan of in de nabijheid van een elektrische installatie worden slechts uitgevoerd, indien de
      installatie of het gedeelte waaraan of in de nabijheid waarvan wordt gewerkt, spanningsloos is.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5
  - number: 3.5.4
    text: |-
      In aanvulling op het derde lid zijn door de daartoe bevoegde werknemer tevens doeltreffende maatregelen genomen om
      een gevaarloos verloop van die werkzaamheden te waarborgen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5
  - number: 3.5.5
    text: |-
      Het derde en vierde lid zijn niet van toepassing op werkzaamheden die worden verricht aan of in de nabijheid van
      een elektrische installatie voor laagspanning, indien:
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5
  - number: 3.5.5.a
    text: de dringende noodzaak van het onder spanning uitvoeren van die werkzaamheden is aangetoond;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5
  - number: 3.5.5.b
    text: tot het uitvoeren van die werkzaamheden door de daartoe bevoegde werknemer uitdrukkelijk opdracht is gegeven, en
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5
  - number: 3.5.5.c
    text: |-
      de installatie tevens geschikt is voor het onder spanning uitvoeren van die werkzaamheden en door de daartoe
      bevoegde werknemer doeltreffende maatregelen zijn genomen om de aan die werkzaamheden verbonden gevaren te
      voorkomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5
  - number: 3.5.6
    text: |-
      Het derde en vierde lid zijn niet van toepassing op werkzaamheden die worden uitgevoerd aan of in de nabijheid van
      een elektrische installatie voor hoogspanning, bestaande uit:
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5
  - number: 3.5.6.a
    text: |-
      het nemen en opheffen van veiligheidsmaatregelen, waaronder begrepen het met geschikt materieel knippen of schieten
      van kabels;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5
  - number: 3.5.6.b
    text: het uitvoeren van metingen en beproevingen, of
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5
  - number: 3.5.6.c
    text: het reinigen van elektrisch materieel.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5
  - number: 3.5.7
    text: |-
      Werkzaamheden bestaande uit het reinigen van elektrisch materieel in een elektrische installatie voor hoogspanning
      als bedoeld in het zesde lid, onder c, worden slechts uitgevoerd, indien:
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5
  - number: 3.5.7.a
    text: tot het uitvoeren van die werkzaamheden door de daartoe bevoegde werknemer uitdrukkelijk opdracht is gegeven;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5
  - number: 3.5.7.b
    text: gebruik wordt gemaakt van de voor deze werkzaamheden geschikte reinigings- en arbeidsmiddelen, en
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5
  - number: 3.5.7.c
    text: |-
      de werknemers zich met de arbeidsmiddelen waarmee zij fysiek in contact staan, niet behoeven te begeven in de
      gevarenzone van de installatie of delen daarvan die onder spanning staan.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5
  - number: 3.5a
    text: 'Deze paragraaf is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5a
  - number: 3.5a.a
    text: gebieden die direct gebruikt worden voor en gedurende de medische behandeling van patiënten;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5a
  - number: 3.5a.b
    text: |-
      het gebruik van gastoestellen die vallen onder het [Besluit gastoestellen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005384
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5a
    references:
      - id: ref1
        bwb_id: BWBR0005384
  - number: 3.5a.c
    text: |-
      de vervaardiging, de bewerking, het gebruik, de opslag en het transport van springstoffen of chemisch instabiele
      stoffen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5a
  - number: 3.5a.d
    text: |-
      de winningsindustrie in dagbouw, de ondergrondse winningsindustrie en de winningsindustrie die delfstoffen wint met
      behulp van boringen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5a
  - number: 3.5a.e
    text: |-
      het gebruik van vervoermiddelen over land, over het water en door de lucht, met uitzondering van de voertuigen
      bedoeld voor gebruik op plaatsen waar zich een explosieve atmosfeer kan voordoen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5a
  - number: 3.5b.1
    text: |-
      Voor de toepassing van [artikel 19, tweede lid, van de wet][ref1] worden aangewezen de werkzaamheden verricht op
      arbeidsplaatsen waar explosieve atmosferen heersen of kunnen optreden.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel19
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5b
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '19'
  - number: 3.5b.2
    text: |-
      In aanvulling op [artikel 19, tweede lid, van de wet][ref1] coördineert de werkgever die verantwoordelijk is voor
      de arbeidsplaats, bedoeld in het eerste lid, de uitvoering van alle maatregelen inzake veiligheid en gezondheid.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel19
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5b
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '19'
  - number: 3.5c.1
    text: |-
      De gevaren in verband met explosieve atmosferen en de bijzondere risico's die daaruit kunnen voortvloeien,
      worden in het kader van de risico-inventarisatie en -evaluatie, bedoeld in [artikel 5 van de wet][ref1], voor
      de aanvang van de arbeid en bij iedere belangrijke wijziging, uitbreiding of verbouwing van de arbeidsplaats,
      de arbeidsmiddelen of het arbeidsproces, in hun geheel beoordeeld en schriftelijk vastgelegd in een
      explosieveiligheidsdocument.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5c
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
  - number: 3.5c.2
    text: 'Bij de beoordeling, bedoeld in het eerste lid, wordt in ieder geval rekening gehouden met:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5c
  - number: 3.5c.2.a
    text: de waarschijnlijkheid van het voorkomen en het voortduren van explosieve atmosferen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5c
  - number: 3.5c.2.b
    text: |-
      de waarschijnlijkheid dat ontstekingsbronnen, elektrostatische ontladingen daaronder begrepen, aanwezig zijn,
      actief worden en daadwerkelijk ontsteken;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5c
  - number: 3.5c.2.c
    text: de aanwezige installaties, de gebruikte stoffen, de processen en hun mogelijke wisselwerkingen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5c
  - number: 3.5c.2.d
    text: de omvang van de te verwachten gevolgen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5c
  - number: 3.5c.3
    text: |-
      Bij de beoordeling, bedoeld in het eerste lid, worden tevens ruimten in aanmerking genomen die via openingen
      verbonden zijn of kunnen worden verbonden met ruimten waar explosieve atmosferen kunnen voorkomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5c
  - number: 3.5c.4
    text: 'In het explosieveiligheidsdocument zijn ten minste vermeld:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5c
  - number: 3.5c.4.a
    text: een identificatie en beoordeling van de explosierisico's;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5c
  - number: 3.5c.4.b
    text: |-
      de wijze waarop de arbeidsplaatsen en de arbeidsmiddelen, met inbegrip van de alarminstallaties, met de vereiste
      aandacht voor de veiligheid zijn ontworpen, worden gebruikt of bediend en onderhouden;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5c
  - number: 3.5c.4.c
    text: |-
      welke gebieden zijn ingedeeld in zones als bedoeld in [artikel 3.5d, vijfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5c
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 2a
        afdeling: '1'
  - number: 3.5c.4.d
    text: |-
      de wijze waarop uitvoering is gegeven aan de maatregelen, bedoeld in de [artikelen 3.5d][ref1], [3.5e][ref2] en
      [3.5f][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5c
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 2a
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 2a
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 2a
        afdeling: '1'
  - number: 3.5c.4.e
    text: |-
      indien op arbeidsplaatsen als bedoeld in [artikel 3.5b, eerste lid][ref1], meerdere werkgevers arbeid doen
      verrichten, de wijze waarop voldaan is aan [artikel 19, tweede lid, van de wet][ref2] en het doel, de maatregelen
      en de wijze van uitvoering van de coördinatie, bedoeld in [artikel 3.5b, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5c
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 2a
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '19'
      - id: ref3
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 2a
        afdeling: '1'
  - number: 3.5d.1
    text: |-
      Doeltreffende maatregelen zijn genomen om het ontstaan van een explosieve atmosfeer op de arbeidsplaats te
      voorkomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5d
  - number: 3.5d.2
    text: |-
      Indien het voorkomen van het ontstaan van een explosieve atmosfeer, gezien de aard van het werk niet mogelijk is,
      worden in de hieronder aangegeven volgorde de volgende maatregelen genomen:
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5d
  - number: 3.5d.2.a
    text: |-
      de ontsteking van explosieve atmosferen wordt voorkomen, waarbij rekening wordt gehouden met elektrostatische
      ontladingen die van werknemers of de arbeidsplaats als ladingsdrager of ladingsproducent kunnen uitgaan;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5d
  - number: 3.5d.2.b
    text: de schadelijke gevolgen van een explosie worden beperkt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5d
  - number: 3.5d.3
    text: |-
      In aanvulling op de maatregelen, bedoeld in het eerste en tweede lid, wordt de mogelijkheid tot uitbreiding van een
      explosie beperkt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5d
  - number: 3.5d.4
    text: |-
      Indien werknemers of anderen door explosieve atmosferen gevaar kunnen lopen, wordt, in aanvulling op het eerste
      tot en met het derde lid, de arbeidsplaats zodanig ingericht dat veilig kan worden gewerkt en wordt er op de arbeid
      passend toezicht, met inbegrip van het gebruik van passende technische middelen, uitgeoefend. De inhoud en de mate
      van het toezicht is afhankelijk van de uit de beoordeling, bedoeld in [artikel 3.5c, eerste lid][ref1], gebleken
      gevaren.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5d
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 2a
        afdeling: '1'
  - number: 3.5d.5
    text: |-
      Indien uit de beoordeling, bedoeld in [artikel 3.5c, eerste lid][ref1], is gebleken dat er explosieve atmosferen
      kunnen voorkomen, worden gebieden waar deze atmosferen kunnen heersen ingedeeld in gevarenzones als bedoeld
      in bijlage I bij [richtlijn nr. 1999/92/EG](31999L0092) van het Europees Parlement en de Raad van de Europese
      Unie van 16 december 1999 (PbEG 2000, L 23) betreffende minimumvoorschriften voor de verbetering van de
      gezondheidsbescherming en van de veiligheid van werknemers die door explosieve atmosferen gevaar kunnen lopen
      (vijftiende bijzondere richtlijn in de zin van artikel 16, eerste lid, van [richtlijn nr. 89/391/EEG](31989L0391)).


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5d
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 2a
        afdeling: '1'
  - number: 3.5d.6
    text: |-
      Gevarenzones worden gemarkeerd door middel van waarschuwingsborden die voldoen aan de bepalingen, vastgesteld bij
      of krachtens [afdeling 2 van hoofdstuk 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5d
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '8'
        afdeling: '2'
  - number: 3.5e
    text: |-
      In de gevarenzones, bedoeld in [artikel 3.5d, vijfde lid][ref1], en met betrekking tot de installaties in gebieden
      zonder explosiegevaar die vereist zijn voor of bijdragen tot het explosieveilig gebruik van installaties die zich
      op plaatsen bevinden waar explosiegevaar heerst, worden in ieder geval de volgende maatregelen genomen:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5e
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 2a
        afdeling: '1'
  - number: 3.5e.a
    text: |-
      vrijkomende gassen, dampen, nevels of brandbaar stof die explosiegevaar kunnen doen ontstaan, worden op passende
      wijze afgevoerd en onschadelijk gemaakt;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5e
  - number: 3.5e.b
    text: |-
      indien een explosieve atmosfeer meerdere soorten ontvlambare of brandbare gassen, dampen, nevels of stoffen bevat,
      wordt bij de veiligheidsmaatregelen uitgegaan van het grootste mogelijke risico op basis van de beoordeling,
      bedoeld in [artikel 3.5c, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5e
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 2a
        afdeling: '1'
  - number: 3.5e.c
    text: |-
      installaties, apparaten, beveiligingssystemen en het installatiemateriaal, worden, met inachtneming van onderdeel
      e, slechts in gebruik genomen indien uit het explosieveiligheidsdocument op basis van de beoordeling, bedoeld in
      [artikel 3.5c, eerste lid][ref1], is gebleken dat aan het gebruik ervan geen explosiegevaar is verbonden;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5e
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 2a
        afdeling: '1'
  - number: 3.5e.d
    text: |-
      onderdeel c is van overeenkomstige toepassing op arbeidsmiddelen en de verbindingsstukken ervan die geen apparaten
      en beveiligingssystemen zijn als bedoeld in het [Warenwetbesluit explosieveilig materieel][ref1], indien hun
      opneming in de installaties aanleiding kan geven tot ontstekingsgevaar;


      [ref1]: https://wetten.overheid.nl/BWBR0007497
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5e
    references:
      - id: ref1
        bwb_id: BWBR0007497
  - number: 3.5e.e
    text: |-
      voor zover het explosieveiligheidsdocument op basis van de beoordeling, bedoeld in [artikel 3.5c, eerste lid][ref1],
      geen andere eisen stelt, worden in de gevarenzones apparaten en beveiligingssystemen gebruikt overeenkomstig de
      categorieën als bedoeld in het [Warenwetbesluit explosieveilig materieel][ref2] en toegepast volgens de navolgende
      principes:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007497
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5e
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 2a
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0007497
  - number: 3.5e.e.1°
    text: 'gevarenzone 0 of 20: categorie 1-apparatuur;'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5e
  - number: 3.5e.e.2°
    text: 'gevarenzone 1 of 21: categorie 1- of categorie 2-apparatuur;'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5e
  - number: 3.5e.e.3°
    text: 'gevarenzone 2 of 22: categorie 1-, categorie 2- of categorie 3-apparatuur;'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5e
  - number: 3.5e.f
    text: de nodige maatregelen worden getroffen ter voorkoming van verwisseling van installatiemateriaal;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5e
  - number: 3.5e.g
    text: |-
      in gebieden waar een explosieve atmosfeer kan ontstaan wordt aan werknemers werkkleding ter beschikking gesteld die
      voldoet aan [afdeling 1 van hoofdstuk 8][ref1] en die door de werknemers bij de arbeid steeds wordt gedragen;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5e
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '8'
        afdeling: '1'
  - number: 3.5e.h
    text: |-
      indien een toestand ontstaat waarin een explosie zich kan gaan voordoen, worden werknemers optisch of akoestisch
      gewaarschuwd en teruggetrokken;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5e
  - number: 3.5e.i
    text: |-
      voor de eerste inbedrijfstelling van een arbeidsplaats en bij iedere belangrijke wijziging, uitbreiding of
      verbouwing van de arbeidsplaats, arbeidsmiddelen of het arbeidsproces waarbij explosieve atmosferen kunnen
      voorkomen, wordt de explosieveiligheid van de gehele installatie gecontroleerd door een ter zake deskundig persoon.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5e
  - number: 3.5f
    text: |-
      Voor zover uit de resultaten van de beoordeling, bedoeld in [artikel 3.5c, eerste lid][ref1], hiertoe de noodzaak
      is gebleken, worden in aanvulling op [artikel 3.5e][ref2] de volgende maatregelen genomen:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5f
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 2a
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 2a
        afdeling: '1'
  - number: 3.5f.a
    text: schriftelijke instructies worden verstrekt met betrekking tot de uitvoering van de arbeid;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5f
  - number: 3.5f.b
    text: |-
      voor de aanvang van arbeid dat gevaar kan opleveren, wordt toestemming verleend door een daartoe bevoegde persoon
      om deze arbeid te verrichten;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5f
  - number: 3.5f.c
    text: |-
      apparaten en beveiligingssystemen worden, wanneer stroomuitval extra gevaren teweeg kan brengen, onafhankelijk van
      de rest van de installatie, bij stroomuitval in een veilige bedrijfstoestand gehandhaafd;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5f
  - number: 3.5f.d
    text: |-
      automatisch gestuurde apparaten en beveiligingssystemen die van de voorziene bedrijfsomstandigheden afwijken,
      worden zonder gevaar manueel uitgeschakeld. Deze ingrepen worden door bevoegde werknemers uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5f
  - number: 3.5f.e
    text: |-
      indien de noodstopinrichtingen in werking worden gesteld, wordt de opgeslagen energie zo snel en zo veilig mogelijk
      afgevoerd of geïsoleerd, zodat zij niet langer een bron van gevaar vormt;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5f
  - number: 3.5f.f
    text: |-
      vluchtmiddelen worden beschikbaar en gebruiksklaar gehouden zodat werknemers de gevaarlijke gebieden snel en veilig
      kunnen verlaten.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.5f
  - number: 3.6.1
    text: |-
      Doeltreffende maatregelen zijn genomen teneinde het mogelijk te maken dat de werknemer, indien een toestand
      ontstaat waarin direct gevaar voor zijn veiligheid of gezondheid aanwezig is, zich snel via de kortst mogelijke weg
      in veiligheid kan stellen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.6
  - number: 3.6.2
    text: |-
      Het aantal, de plaats en de afmetingen van de daartoe beschikbare vluchtwegen en nooduitgangen zijn afhankelijk
      van het gebruik, de uitrusting en de afmetingen van de arbeidsplaatsen alsmede van het maximum aantal werknemers en
      andere personen dat zich op deze plaatsen kan ophouden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.6
  - number: 3.7.1
    text: Vluchtwegen en nooduitgangen zijn vrij van obstakels.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.7
  - number: 3.7.2
    text: Nooduitgangen kunnen te allen tijde worden geopend.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.7
  - number: 3.7.3
    text: |-
      Deuren van nooduitgangen en deuren op het traject van de vluchtwegen zijn op eenvoudige wijze van binnen- uit naar
      buiten toe te openen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.7
  - number: 3.7.4
    text: Schuif- en draaideuren worden niet als nooduitgang gebruikt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.7
  - number: 3.7.5
    text: |-
      De vluchtwegen en nooduitgangen die bij het uitvallen van de verlichting slecht zichtbaar zijn, zijn voorzien van
      een adequate noodverlichting.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.7
  - number: 3.7.6
    text: |-
      De vluchtwegen, de deuren en poorten op het traject van de vluchtwegen alsmede de nooduitgangen zijn gemarkeerd
      door signalen die voldoen aan het bij of krachtens [afdeling 2 van hoofdstuk 8][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '8'
        afdeling: '2'
  - number: 3.8.1
    text: |-
      In aanvulling op [afdeling 4 van hoofdstuk 2][ref1] zijn op arbeidsplaatsen, afhankelijk van de aard van de arbeid
      die daar wordt verricht, de daaraan verbonden gevaren en het maximum aantal werknemers en andere personen dat zich
      daar bevindt, voldoende passende brandbestrijdingsmiddelen aanwezig.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '2'
        afdeling: '4'
  - number: 3.8.2
    text: Indien nodig zijn, in aanvulling op het eerste lid, branddetectoren en alarmsystemen aanwezig.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.8
  - number: 3.8.3
    text: Niet-automatische brandbestrijdingsmiddelen zijn gemakkelijk bereikbaar en gemakkelijk te bedienen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.8
  - number: 3.8.4
    text: |-
      Niet-automatische brandbestrijdingsmiddelen zijn voorzien van een signalering die voldoet aan het bij of krachtens
      [afdeling 2 van hoofdstuk 8][ref1] bepaalde. De signalering is duurzaam en op de juiste plaats aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '8'
        afdeling: '2'
  - number: '3.9'
    text: |-
      Arbeidsplaatsen waar werknemers bij het uitvallen van het kunstlicht aan bijzondere gevaren zijn blootgesteld,
      zijn voorzien van adequate noodverlichting. Indien noodverlichting niet mogelijk is, beschikken de werknemers over
      individuele verlichting.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.9
  - number: '3.10'
    text: |-
      Op arbeidsplaatsen waar gevaar voor verdrinking bestaat wordt dit gevaar zoveel mogelijk voorkomen en zijn
      doelmatige middelen voor het redden van drenkelingen op een goed zichtbare plaats beschikbaar.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.10
  - number: 3.11.1
    text: |-
      Vloeren van arbeidsplaatsen zijn zo veel mogelijk vrij van oneffenheden en gevaarlijke hellingen en zijn voorts zo
      veel mogelijk vast, stabiel en stroef.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.11
  - number: 3.11.2
    text: |-
      Het oppervlak van vloeren, muren en plafonds van arbeidsplaatsen is zodanig, dat deze ten behoeve van de hygiëne op
      de arbeidsplaats kunnen worden schoongemaakt en onderhouden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.11
  - number: 3.11.3
    text: |-
      Besloten ruimten waar arbeid wordt verricht zijn, rekening houdend met de aard van de werkzaamheden en de te
      leveren fysieke belasting, voldoende thermisch geïsoleerd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.11
  - number: 3.11.4
    text: |-
      Transparante of lichtdoorlatende wanden van arbeidsplaatsen zijn, voor zover mogelijk in verband met de aard van
      de arbeidsplaats:
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.11
  - number: 3.11.4.a
    text: duidelijk gemarkeerd en van veiligheidsmateriaal vervaardigd, of
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.11
  - number: 3.11.4.b
    text: op een zodanige wijze aangebracht of afgeschermd dat de werknemers niet gewond kunnen raken.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.11
  - number: 3.12.1
    text: Indien ramen, bovenlichtvoorzieningen en ventilatievoorzieningen geopend en gesloten kunnen worden,
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.12
  - number: 3.12.1.a
    text: kan dit op veilige wijze geschieden,
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.12
  - number: 3.12.1.b
    text: kunnen zij tevens op veilige wijze geregeld en vastgezet worden, en
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.12
  - number: 3.12.1.c
    text: leveren zij in geopende stand geen gevaar op.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.12
  - number: 3.12.2
    text: Ramen en bovenlichtvoorzieningen kunnen zonder gevaar worden schoongemaakt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.12
  - number: 3.13.1
    text: |-
      De plaats, het aantal en de afmeting van deuren, beweegbare hekken en andere doorgangen alsmede de materialen
      waarvan zij zijn vervaardigd, zijn afgestemd op de aard en het gebruik van de arbeidsplaats.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.13
  - number: 3.13.2
    text: Op transparante deuren is op ooghoogte een markering aangebracht.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.13
  - number: 3.13.3
    text: |-
      Afhankelijk van de aard van de arbeidsplaats en de arbeid die daar wordt verricht, zijn klapdeuren transparant of
      van transparante panelen voorzien.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.13
  - number: 3.13.4
    text: |-
      Indien deuren of andere doorgangen beschikken over transparante of lichtdoorlatende oppervlakten, zijn
      doeltreffende maatregelen genomen om te voorkomen dat werknemers door ongewild contact met die oppervlakten gewond
      raken.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.13
  - number: 3.13.5
    text: |-
      Deuren en beweegbare hekken die uit of van hun geleidingen kunnen raken zijn tegen uitlichten of aflopen dan wel
      tegen vallen geborgd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.13
  - number: 3.13.6
    text: |-
      Automatische deuren en hekken functioneren zodanig dat zij geen gevaar opleveren. Zij zijn uitgerust met
      gemakkelijk herkenbare beveiligingen die voorkomen dat werknemers gewond raken.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.13
  - number: 3.13.7
    text: |-
      Automatische deuren en hekken kunnen met de hand worden geopend, tenzij ze bij een stroomstoring automatisch
      opengaan.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.13
  - number: 3.13.8
    text: |-
      In de onmiddellijke nabijheid van deuren, beweegbare hekken of andere doorgangen die hoofdzakelijk voor verkeer
      van voertuigen of transportmiddelen zijn bestemd, bevinden zich, tenzij de doorgang voor voetgangers veilig is,
      afzonderlijke doorgangen voor voetgangers.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.13
  - number: 3.13.9
    text: |-
      De in het achtste lid bedoelde doorgangen voor voetgangers zijn duidelijk zichtbaar gemarkeerd en vrij van
      obstakels.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.13
  - number: 3.13.10
    text: |-
      Kettingen of soortgelijke voorzieningen die worden gebruikt om te verhinderen dat een bepaalde ruimte wordt
      betreden, zijn goed zichtbaar en op doelmatige wijze voorzien van verbods- of waarschuwingsborden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.13
  - number: 3.14.1
    text: |-
      De verbindingswegen op de arbeidsplaats zijn zodanig gelegen en ingericht dat zij op eenvoudige wijze, veilig en
      overeenkomstig hun bestemming, door voetgangers en voertuigen of transportmiddelen kunnen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.14
  - number: 3.14.2
    text: Voorkomen wordt dat werknemers die in de nabijheid van de verbindingswegen arbeid verrichten, gevaar lopen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.14
  - number: 3.14.3
    text: |-
      De afmeting van de verbindingswegen is afgestemd op het aantal gebruikers en de aard van de arbeid die in het
      bedrijf of de inrichting wordt verricht.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.14
  - number: 3.14.4
    text: |-
      Indien op de verbindingswegen, voor zover het niet de openbare weg betreft, voertuigen of transportmiddelen worden
      gebruikt, zijn de nodige verkeersregels vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.14
  - number: 3.14.5
    text: |-
      In gevallen als bedoeld in het vierde lid, is tevens een veilige ruimte voor de voetgangers gewaarborgd of zijn
      andere doeltreffende maatregelen ter bescherming van de voetgangers genomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.14
  - number: 3.14.6
    text: |-
      De voor voertuigen of transportmiddelen bestemde verbindingswegen zijn gelegen op voldoende afstand van de overige
      verbindingswegen op de arbeidsplaats.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.14
  - number: 3.14.7
    text: |-
      Voor zover het gebruik of de inrichting van de arbeidsplaats zulks vereist, zijn de verbindingswegen duidelijk
      afgebakend.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.14
  - number: 3.15.1
    text: |-
      De plaatsen waar door de aard van het werk gevaar, met inbegrip van valgevaar of gevaar voor vallende voorwerpen
      voorkomt of waar obstakels die niet verwijderd kunnen worden een gevaar voor de veiligheid vormen bij het
      verplaatsen van voertuigen of personen, worden duidelijk gemarkeerd door signalen die voldoen aan het bij of
      krachtens [afdeling 2 van hoofdstuk 8][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '8'
        afdeling: '2'
  - number: 3.15.2
    text: |-
      Alleen werknemers die beroepshalve of uit hoofde van hun functie de in het eerste lid bedoelde plaatsen moeten
      betreden, worden daar toegelaten.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.15
  - number: 3.16.1
    text: |-
      Bij het verrichten van arbeid waarbij valgevaar bestaat is zo mogelijk een veilige steiger, stelling, bordes of
      werkvloer aangebracht of is het gevaar tegengegaan door het aanbrengen van doelmatige hekwerken, leuningen of
      andere dergelijke voorzieningen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.16
  - number: 3.16.2
    text: |-
      Het eerste lid is niet van toepassing op arbeid, die op veilige wijze op een ladder, trap of dergelijke kan worden
      verricht.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.16
  - number: 3.16.3
    text: |-
      Indien de in het eerste lid genoemde voorzieningen niet of slechts ten dele kunnen worden aangebracht of indien het
      aanbrengen of wegnemen daarvan grotere gevaren meebrengt dan de arbeid ter beveiliging waarvan zij zouden moeten
      dienen, zijn ter voorkoming van het gevaar voldoende sterke en voldoende grote vangnetten op doelmatige plaatsen
      en wijze aangebracht of worden doelmatige veiligheidsgordels met vanglijnen van voldoende sterkte gebruikt dan
      wel worden andere technische middelen toegepast, die ten minste een zelfde mate van beveiliging van de in het
      eerste lid bedoelde arbeid geven. Daarbij hebben maatregelen gericht op collectieve bescherming de voorrang boven
      maatregelen gericht op individuele bescherming.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.16
  - number: '3.17'
    text: |-
      Het gevaar te worden getroffen of geraakt door voorwerpen, producten of onderdelen daarvan dan wel vloeistoffen
      of gassen, of het gevaar bekneld te raken tussen voorwerpen, producten of onderdelen daarvan, wordt voorkomen
      en indien dat niet mogelijk is zoveel mogelijk beperkt. [Artikel 3.16, derde lid, laatste volzin][ref1], is van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '1'
  - number: 3.18.1
    text: |-
      Roltrappen en -paden functioneren veilig en zijn uitgerust met de noodzakelijke veiligheidsvoorzieningen, waaronder
      begrepen gemakkelijk herkenbare en toegankelijke noodstopvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.18
  - number: 3.18.2
    text: |-
      Laadplatforms en -hellingen zijn afgestemd op de afmetingen van de te vervoeren ladingen. Zij beschikken over ten
      minste één uitgang.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.18
  - number: 3.18.3
    text: |-
      Laadplatforms met een lengte van meer dan 50 meter hebben aan beide zijden een uitgang, tenzij dat technisch niet
      mogelijk is.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.18
  - number: 3.19.1
    text: |-
      De afmetingen en het luchtvolume van de arbeidsplaats zijn zodanig dat de werknemer zonder gevaar voor de
      veiligheid of de gezondheid zijn arbeid kan verrichten.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.19
  - number: 3.19.2
    text: |-
      De afmetingen van de arbeidsplaats zijn zodanig dat de werknemer bij het verrichten van zijn arbeid over voldoende
      bewegingsruimte beschikt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.19
  - number: 3.19.3
    text: |-
      Indien in verband met de aard van de arbeid niet aan het tweede lid kan worden voldaan, is in de nabijheid een
      andere open of besloten ruimte met voldoende bewegingsvrijheid voor de betrokken werknemers beschikbaar.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.19
  - number: 3.20.1
    text: |-
      In het bedrijf of de inrichting of in de directe nabijheid daarvan is een gemakkelijk toegankelijke ruimte
      beschikbaar waar de werknemers de pauzes kunnen doorbrengen. Deze ruimte is daartoe geschikt alsmede, afhankelijk
      van het aantal werknemers, voldoende ruim bemeten en uitgerust met voldoende tafels en stoelen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.20
  - number: 3.20.2
    text: |-
      In de ruimte, bedoeld in het eerste lid, zijn doeltreffende maatregelen genomen ter bescherming van de niet-rokers
      tegen hinder van tabaksrook.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.20
  - number: '3.21'
    text: |-
      Voor werknemers die gedurende de tijdsruimte, gelegen tussen het einde en het begin van de dagelijkse arbeidstijd,
      plegen te verblijven in het bedrijf of de inrichting waar zij werkzaam zijn, is een nachtverblijf beschikbaar. Een
      nachtverblijf is adequaat ingericht en is uitsluitend bestemd voor personen van gelijk geslacht.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.21
  - number: 3.22.1
    text: Iedere werknemer beschikt over een plaats om zijn kleding op te hangen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.22
  - number: 3.22.2
    text: |-
      Voor werknemers die speciale werkkleding moeten dragen zijn doelmatige, voldoende ruime, van stoelen of banken
      voorziene en naar seksen gescheiden kleedruimten beschikbaar; deze ruimten zijn zoveel mogelijk gelegen in de
      nabijheid van de open of besloten ruimten waar de arbeid pleegt te worden verricht. Natte werkkleding kan zo nodig
      worden gedroogd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.22
  - number: 3.22.3
    text: |-
      In de kleedruimten kan kleding die de werknemers tijdens de arbeid niet dragen, op doelmatige wijze en afgesloten
      worden bewaard.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.22
  - number: 3.22.4
    text: |-
      Indien de omstandigheden zulks vereisen kunnen de speciale werkkleding en de persoonlijke kleding van de werknemers
      gescheiden van elkaar, op doelmatige wijze en afgesloten worden bewaard.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.22
  - number: 3.23.1
    text: |-
      Indien werknemers bloot staan aan vuil of stof is een wasruimte met een voldoende aantal wasbakken aanwezig. De
      wasbakken zijn functioneel geplaatst en naar seksen gescheiden; ze beschikken over koud en zonodig warm stromend
      water.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.23
  - number: 3.23.2
    text: |-
      Indien werknemers zodanig bloot staan aan vuil, stof of hoge temperaturen dat een reiniging van het lichaam nodig
      is die meer omvat dan die van handen en gezicht of zulks uit de aard van hun arbeid of de zorg voor de gezondheid
      voortvloeit, is tevens een doucheruimte met een voldoende aantal douches aanwezig. De doucheruimte is voldoende
      ruim, doelmatig ingericht en naar seksen gescheiden; de douches beschikken over warm en koud stromend water.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.23
  - number: 3.23.3
    text: |-
      Indien de douche- of wasruimten en de kleedruimten zich niet in dezelfde ruimte bevinden, zijn deze onderling
      gemakkelijk en binnendoor bereikbaar.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.23
  - number: 3.24.1
    text: |-
      In een bedrijf of inrichting waar werknemers werkzaam plegen te zijn, is voor de werknemers ten minste één toilet
      aanwezig.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.24
  - number: 3.24.2
    text: |-
      In een bedrijf of inrichting waar 10 of meer werknemers gelijktijdig werkzaam plegen te zijn, is voor iedere 15 of
      minder werknemers van hetzelfde geslacht ten minste één toilet aanwezig. Voor mannen mag voor een deel met urinoirs
      worden volstaan mits er ten minste één toilet voor iedere 25 of minder mannen aanwezig is.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.24
  - number: 3.24.3
    text: |-
      De toiletten en urinoirs zijn doelmatig ingericht en goed geventileerd; zij bevinden zich in de nabijheid van de
      ruimten waar de werknemers hun werkzaamheden verrichten.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.24
  - number: 3.24.4
    text: |-
      In een bedrijf of inrichting waar 10 of meer werknemers gelijktijdig werkzaam plegen te zijn, zijn de toiletten
      naar seksen gescheiden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.24
  - number: 3.24.5
    text: |-
      In of in de onmiddellijke nabijheid van de ruimten waarin de toiletten en urinoirs zich bevinden zijn voldoende
      wasbakken aanwezig. De wasbakken zijn doelmatig geplaatst en beschikken over stromend water.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.24
  - number: 3.25.1
    text: |-
      Indien de aard van de arbeid of de daaraan verbonden gevaren dit noodzakelijk maken, zijn, in aanvulling op
      afdeling 4 van hoofdstuk 2, in het bedrijf of de inrichting voldoende eerste-hulpposten aanwezig.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.25
  - number: 3.25.2
    text: In de eerste-hulpposten zijn duidelijk zichtbare instructies voor eerste hulp bij ongevallen aanwezig.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.25
  - number: 3.25.3
    text: In de eerste-hulpposten is een alarmnummer duidelijk zichtbaar aangebracht.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.25
  - number: 3.25.4
    text: De eerste-hulpposten zijn voorzien van de noodzakelijke eerste-hulpuitrusting.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.25
  - number: 3.25.5
    text: De eerste-hulpposten zijn gemakkelijk met brancards bereikbaar.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.25
  - number: 3.25.6
    text: |-
      De eerste-hulpposten en de eerste-hulpuitrusting zijn voorzien van een signalering die voldoet aan het bij of
      krachtens afdeling 2 van hoofdstuk 8 bepaalde.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.25
  - number: '3.26'
    text: |-
      Op een bouwplaats zijn naast de voorschriften van afdeling 1 tevens de voorschriften van deze afdeling van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.26
  - number: 3.27.1
    text: Een bouwplaats is gemarkeerd en afgebakend.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.27
  - number: 3.27.2
    text: Op een bouwplaats is voldoende drinkwater of andere alcoholvrije drank beschikbaar.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.27
  - number: 3.27.3
    text: Op een bouwplaats zijn zo nodig faciliteiten voor het bereiden van maaltijden beschikbaar.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.27
  - number: 3.28.1
    text: |-
      Werkplekken op een bouwplaats die niet op de begane grond zijn gesitueerd, zijn stabiel en stevig, waarbij rekening
      wordt gehouden met het aantal werknemers dat zich daar bevindt, de maximale belasting en de verdeling daarvan
      alsmede met externe invloeden. Zonodig zijn ten behoeve van de stabiliteit doeltreffende bevestigingsmiddelen
      aangebracht.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.28
  - number: 3.28.2
    text: |-
      De stabiliteit en de stevigheid worden regelmatig en in ieder geval na iedere relevante verandering van de hoogte
      of de diepte van de in het eerste lid bedoelde werkplekken, doeltreffend gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.28
  - number: 3.29.1
    text: |-
      Elektrische installaties die voor de aanvang van de werkzaamheden reeds op de bouwplaats aanwezig zijn, worden
      geïdentificeerd, gecontroleerd en duidelijk gekenmerkt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.29
  - number: 3.29.2
    text: |-
      Bovengrondse elektriciteitsleidingen worden zoveel mogelijk buiten de bouwplaats om geleid of spanningsloos
      gemaakt. Indien dat niet mogelijk is worden hekken of waarschuwingsborden geplaatst.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.29
  - number: 3.29.3
    text: |-
      Indien voertuigen onder elektriciteitsleidingen door moeten rijden worden beschermingen onder de leidingen
      aangebracht.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.29
  - number: 3.29.4
    text: |-
      Ondergrondse elektriciteitsleidingen, leidingen voor andere distributiesystemen en kabels worden voor de aanvang
      van grondverzetwerkzaamheden geïdentificeerd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.29
  - number: 3.29.5
    text: |-
      Doeltreffende maatregelen worden genomen om de gevaren voor werknemers die zijn verbonden aan beschadiging van de
      in het vierde lid bedoelde leidingen en kabels, zoveel mogelijk te voorkomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.29
  - number: 3.30.1
    text: |-
      In een bouwput, een tunnel, bij een uitgraving of andere ondergrondse werkzaamheden worden doeltreffende stut- of
      taludvoorzieningen aangebracht ter voorkoming van instorting of overstroming.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.30
  - number: 3.30.2
    text: |-
      Bij grondverzetwerkzaamheden worden de uitgegraven aarde, het gebruikte materiaal en de daarbij gebruikte
      voertuigen op veilige afstand van de uitgraving gehouden. Zonodig wordt rond de uitgraving doeltreffend hekwerk
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.30
  - number: 3.31.1
    text: |-
      Metaal- en betonconstructies alsmede de onderdelen daarvan, bekistingen, prefab-elementen of tijdelijke stutten en
      schoren worden slechts gemonteerd of gedemonteerd onder toezicht van een speciaal daartoe aangewezen persoon.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.31
  - number: 3.31.2
    text: |-
      Bekistingen, tijdelijke stutten en schoren kunnen zonder gevaar voor de werknemers de krachten dragen waaraan zij
      blootstaan.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.31
  - number: 3.32.1
    text: |-
      Op een arbeidsplaats in de winningsindustrie zijn naast de voorschriften van [afdeling 1][ref1], met uitzondering
      van [paragraaf 2a van die afdeling][ref2], tevens de voorschriften van deze afdeling van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.32
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008498
        hoofdstuk: '3'
        paragraaf: 2a
        afdeling: '1'
  - number: 3.32.2
    text: |-
      Deze afdeling is niet van toepassing op arbeid verricht in winningsindustrieën in dagbouw met behulp van
      baggermaterieel.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.32
  - number: 3.33.1
    text: |-
      Voor iedere arbeidsplaats in de winningsindustrie zijn schriftelijke instructies opgesteld, waarin de regels
      zijn opgenomen die moeten worden nageleefd om de veiligheid en de gezondheid van de werknemers alsmede het veilig
      gebruik van de arbeidsmiddelen te garanderen. Deze instructies bevatten tevens aanwijzingen voor het gebruik van de
      noodapparatuur en de te volgen handelwijze in noodsituaties.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.33
  - number: 3.33.2
    text: De instructies zijn op een goed toegankelijke plaats voor de werknemers beschikbaar.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.33
  - number: 3.34.1
    text: |-
      In zones waar gevaar voor verstikking, bedwelming of vergiftiging dan wel brand of explosie bestaat, zijn,
      overeenkomstig [artikel 4.6][ref1], de benodigde maatregelen genomen om dat gevaar te voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.34
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '1'
  - number: 3.34.2
    text: |-
      De in het eerste lid bedoelde maatregelen worden opgenomen in het veiligheids- en gezondheidsdocument, bedoeld in
      [artikel 2.42, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.34
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '6'
  - number: 3.35.1
    text: |-
      In aanvulling op afdeling 4 van hoofdstuk 2, zijn in zones waar gevaar voor verstikking, bedwelming of vergiftiging
      bestaat, doelmatige reanimatie-apparaten aanwezig.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.35
  - number: 3.35.2
    text: |-
      Op de arbeidsplaats in de winningsindustrie zijn voldoende werknemers aanwezig die de in het eerste lid genoemde
      apparaten kunnen bedienen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.35
  - number: 3.35.3
    text: De reanimatie-apparaten worden doelmatig onderhouden en opgeslagen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.35
  - number: '3.36'
    text: |-
      In aanvulling op [afdeling 4 van hoofdstuk 2][ref1], worden de in die afdeling bedoelde maatregelen inzake
      het beperken en bestrijden van brand opgenomen in het veiligheids- en gezondheidsdocument, bedoeld in
      [artikel 2.42, tweede lid, van dit besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.36
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '6'
  - number: 3.36a
    text: |-
      Op een arbeidsplaats in de winningsindustrie in dagbouw zijn naast de voorschriften van
      [afdeling 3 van dit hoofdstuk][ref1] tevens de voorschriften van deze afdeling van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.36a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '3'
        afdeling: '3'
  - number: 3.37.1
    text: |-
      Telkens voor de aanvang van werkzaamheden aan afgravings- of ontginningsfronten boven werkterreinen of
      verkeerswegen, wordt nagegaan of er geen instabiele massa’s of rotsblokken zijn. Losse steenblokken worden zo nodig
      verwijderd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37
  - number: 3.37.2
    text: Bij het ontginnen van fronten of steenhopen wordt gewaakt voor het ontstaan van instabiliteit.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37
  - number: 3.37a
    text: |-
      Op een arbeidsplaats in de ondergrondse winningsindustrie zijn naast de voorschriften van
      [afdeling 3 van dit hoofdstuk][ref1] tevens de voorschriften van deze afdeling van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '3'
        afdeling: '3'
  - number: 3.37b.1
    text: |-
      Er worden plattegronden gemaakt en regelmatig bijgewerkt, waarop de galerijen en de ontginningswerkzaamheden en
      alle bekende factoren die van invloed kunnen zijn op de ontginning en de veiligheid daarvan zijn aangegeven op
      een schaal die een duidelijke voorstelling mogelijk maakt. De plattegronden zijn op de arbeidsplaats aanwezig en
      worden desgevraagd getoond aan een ambtenaar als bedoeld in [artikel 24 van de wet][ref1]. De plattegronden zijn
      gemakkelijk toegankelijk en worden zolang bewaard als met het oog op de veiligheid noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37b
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 3.37b.2
    text: In de galerijen is een bewegwijzering aangebracht, zodat de werknemers zich gemakkelijk kunnen oriënteren.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37b
  - number: 3.37c.1
    text: |-
      Iedere ondergrondse ontginning staat via ten minste twee afzonderlijke uitgangen met de oppervlakte in verbinding.
      Deze uitgangen zijn degelijk geconstrueerd en gemakkelijk toegankelijk voor de werknemers die ondergrondse
      werkzaamheden verrichten.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37c
  - number: 3.37c.2
    text: |-
      Wanneer voor het gebruik van deze uitgangen een bijzondere krachtsinspanning nodig is, zijn zij uitgerust met
      mechanische transportmiddelen voor de werknemers.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37c
  - number: 3.37d.1
    text: |-
      Transportinstallaties worden zodanig aangelegd, gebruikt en onderhouden, dat de veiligheid en de gezondheid van de
      werknemers die ze besturen of gebruiken, of zich in de nabijheid daarvan ophouden, gewaarborgd is.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37d
  - number: 3.37d.2
    text: |-
      Bij vervoer van werknemers met mechanische transportmiddelen wordt gezorgd voor passende voorzieningen en speciale
      schriftelijke instructies.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37d
  - number: 3.37e.1
    text: |-
      Zo spoedig mogelijk na het delven worden er ondersteuningen aangebracht, tenzij dit vanwege de stabiliteit van het
      terrein niet noodzakelijk is voor de veiligheid van de werknemers. Deze ondersteuningen worden volgens schema's en
      schriftelijke instructies aangebracht.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37e
  - number: 3.37e.2
    text: Alle voor werknemers toegankelijke werkplekken worden regelmatig op de stabiliteit van het terrein onderzocht.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37e
  - number: 3.37e.3
    text: |-
      Bij het onderhoud van de ondersteuningen wordt rekening gehouden met de uitkomsten van het in het tweede lid
      bedoelde onderzoek.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37e
  - number: 3.37f.1
    text: |-
      In zones waar zich instortingen of waterdoorbraken kunnen voordoen, wordt een winningsprogramma opgesteld en
      uitgevoerd dat zoveel mogelijk gericht is op een veilig werksysteem en op de bescherming van de werknemers.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37f
  - number: 3.37f.2
    text: |-
      Er worden maatregelen genomen om de zones, bedoeld in het eerste lid, te kunnen herkennen, om de werknemers die in
      of in de nabijheid van die zones werken te beschermen en om de risico's te beheersen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37f
  - number: 3.37g.1
    text: Er worden maatregelen genomen om temperatuurstijgingen te voorkomen of vroegtijdig te signaleren.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37g
  - number: 3.37g.2
    text: Het gebruik van brandbare materialen wordt tot het strikt noodzakelijke minimum beperkt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37g
  - number: 3.37g.3
    text: |-
      De te gebruiken hydraulische vloeistoffen zijn voorzover mogelijk moeilijk ontvlambaar en voldoen aan specificaties
      en beproevingsvoorwaarden betreffende de brandbaarheid ervan alsmede aan criteria betreffende de hygiëne. Indien de
      te gebruiken hydraulische vloeistoffen niet aan de in de eerste volzin gestelde eisen voldoen, worden aanvullende
      maatregelen genomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37g
  - number: 3.37h
    text: |-
      In aanvulling op [artikel 3.9][ref1] beschikt elke werknemer over een voor het werk geschikte lamp.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37h
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '1'
  - number: 3.37i
    text: Het werk wordt zodanig georganiseerd dat op ieder moment kan worden vastgesteld wie er ondergronds is.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37i
  - number: 3.37j
    text: |-
      Op een arbeidsplaats in de winningsindustrie die delfstoffen wint met behulp van boringen zijn naast de
      voorschriften van [afdeling 3 van dit hoofdstuk][ref1] tevens de voorschriften van deze afdeling van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37j
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '3'
        afdeling: '3'
  - number: 3.37k.1
    text: |-
      In aanvulling op de [artikelen 3.2][ref1] en [3.3][ref2] zijn mijnbouwinstallaties zodanig ontworpen, gebouwd,
      ingericht, bediend, gecontroleerd en onderhouden dat zij aan de te verwachten omgevingskrachten weerstand kunnen
      bieden. Zij dienen een constructie en stevigheid te hebben die zijn afgestemd op het gebruik dat ervan wordt
      gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37k
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
  - number: 3.37k.2
    text: |-
      Op mijnbouwinstallaties worden zo nodig brandbarrières aangebracht met het oog op de afscheiding van zones waar
      brandrisico bestaat.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37k
  - number: 3.37k.3
    text: Op mijnbouwinstallaties is op een voldoende aantal doelmatig gekozen plaatsen goed drinkwater aanwezig.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37k
  - number: 3.37l.1
    text: |-
      In aanvulling op [artikel 3.14][ref1] worden er:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37l
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '1'
  - number: 3.37l.1.a
    text: |-
      doeltreffende maatregelen genomen ter verzekering van een veilig verkeer en vervoer op een mijnbouwinstallatie
      alsmede van een veilig op en van een mijnbouwinstallatie brengen van materieel, van materialen en van personen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37l
  - number: 3.37l.1.b
    text: |-
      doeltreffende instructies gegeven ter verzekering van een veilig verkeer en vervoer op een mijnbouwinstallatie
      alsmede van een veilig op en van een mijnbouwinstallatie brengen van materieel, van materialen en van personen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37l
  - number: 3.37l.2
    text: |-
      Personen worden slechts door middel van een daartoe geëigend hulpmiddel op of van een mijnbouwinstallatie gebracht,
      indien zij met deze wijze van vervoer hebben ingestemd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37l
  - number: 3.37l.3
    text: |-
      In verband met het veilig gebruik van een helikopterdek op een mijnbouwinstallatie worden werknemers aangewezen,
      die belast zijn met het toezicht op dit gebruik van het helikopterdek en daartoe over de noodzakelijke vaardigheid
      en deskundigheid beschikken.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37l
  - number: 3.37l.4
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37l
  - number: 3.37m
    text: |-
      Doelmatige veiligheidsapparatuur staat steeds gebruiksklaar en wordt in goede staat gehouden. Bij het onderhoud
      daarvan wordt naar behoren rekening gehouden met de uitgeoefende activiteiten.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37m
  - number: 3.37n.1
    text: |-
      Woon- en verblijfruimten op mijnbouwinstallaties hebben op elk niveau ten minste twee afzonderlijke nooduitgangen,
      die zo ver mogelijk van elkaar zijn gelegen en uitkomen in een veilige zone, een veilig verzamelpunt of een veilig
      evacuatiestation.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37n
  - number: 3.37n.2
    text: |-
      Een machinekamer op een mijnbouwinstallatie heeft tenminste twee tegenover elkaar gelegen uitgangen met voldoende
      trap- of ladderverbindingen vanaf de vloer van die machinekamer.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37n
  - number: 3.37n.3
    text: |-
      In afwijking van [artikel 3.7, vierde lid][ref1], zijn nooduitgangen op mijnbouwinstallaties voorzien van
      deuren die op eenvoudige wijze van binnenuit naar buiten toe zijn te openen of indien dit niet mogelijk is, van
      schuifdeuren.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37n
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '1'
  - number: 3.37o
    text: |-
      Bij de inrichting van de arbeidsplaatsen op het continentaal plat, bedoeld in
      [artikel 1, onder c, van de Mijnbouwwet][ref1], wordt in voorkomend geval met gehandicapte werknemers rekening
      gehouden. Dit geldt met name voor deuren, verbindingswegen, trappen, doucheruimten, wasruimten, toiletten en
      werkplekken die door gehandicapte werknemers worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel1
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37o
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '1'
  - number: 3.37p.1
    text: |-
      Arbeidsplaatsen waar door de aard van het werk gevarenzones, met inbegrip van valgevaar of gevaar voor vallende
      voorwerpen, voorkomen, worden zoveel mogelijk uitgerust met voorzieningen die beletten dat werknemers deze zones
      zonder toestemming betreden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37p
  - number: 3.37p.2
    text: Er worden doeltreffende maatregelen getroffen om de werknemers die de gevarenzones mogen betreden te beschermen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37p
  - number: 3.37q.1
    text: |-
      Indien de veiligheid en de gezondheid van de werknemers dat vereisen wordt bepaalde apparatuur in geval van nood
      vanaf geschikte locaties op afstand bediend.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37q
  - number: 3.37q.2
    text: |-
      De apparatuur, bedoeld in het eerste lid, omvat systemen voor het isoleren en afblazen van putten, installaties
      en pijpleidingen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37q
  - number: 3.37q.3
    text: |-
      Ten behoeve van de afstandsbediening, bedoeld in het eerste lid, zijn er controleposten op geschikte locaties die
      in geval van nood kunnen worden gebruikt, indien nodig met inbegrip van controleposten op veilige verzamelpunten en
      in evacuatiestations.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37q
  - number: 3.37q.4
    text: |-
      De apparatuur, bedoeld in het eerste lid, omvat tenminste systemen voor ventilatie, het in noodgevallen afsluiten
      van apparatuur die een ontbranding zou kunnen veroorzaken, het voorkomen van het ontsnappen van ontvlambare
      vloeistoffen en gassen, brandbeveiliging en putbewaking.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37q
  - number: 3.37r.1
    text: |-
      Indien de veiligheid en de gezondheid van de werknemers dat vereisen wordt iedere bemande arbeidsplaats uitgerust
      met:
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37r
  - number: 3.37r.1.a
    text: |-
      een audiovisueel systeem waarmee een alarmmelding zo nodig kan worden doorgestuurd naar elk bemand deel van de
      arbeidsplaats;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37r
  - number: 3.37r.1.b
    text: |-
      een luidsprekersysteem, dat duidelijk kan worden gehoord in alle delen van de installatie waar zich vaak werknemers
      ophouden;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37r
  - number: 3.37r.1.c
    text: een systeem waarmee de verbinding met het vasteland en de hulpdiensten kan worden onderhouden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37r
  - number: 3.37r.2
    text: |-
      Op mijnbouwinstallaties blijven de systemen, bedoeld in het eerste lid, in geval van nood operationeel.
      Het luidsprekersysteem wordt aangevuld met communicatiesystemen die niet afhankelijk zijn van kwetsbare
      stroomvoorzieningsinstallaties.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37r
  - number: 3.37r.3
    text: De voorzieningen voor het slaan van alarm zijn op doelmatige plaatsen aangebracht.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37r
  - number: 3.37r.4
    text: |-
      Indien werknemers aanwezig zijn op arbeidsplaatsen die normaliter niet door werknemers bemand zijn, is er een
      doelmatig communicatiesysteem.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37r
  - number: 3.37s.1
    text: |-
      Indien de veiligheid en de gezondheid van de werknemers dat vereisen worden er verzamelpunten vastgesteld, wordt
      een monsterrol bijgehouden en worden de hiervoor noodzakelijke maatregelen getroffen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37s
  - number: 3.37s.2
    text: 'Doelmatige maatregelen worden genomen om:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37s
  - number: 3.37s.2.a
    text: |-
      de evacuatiestations en de veilige verzamelpunten te beschermen tegen warmte en rook, en, zoveel mogelijk, tegen de
      gevolgen van explosies;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37s
  - number: 3.37s.2.b
    text: de vluchtroutes van en naar de evacuatiestations en verzamelpunten te allen tijde bruikbaar te laten blijven;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37s
  - number: 3.37s.2.c
    text: |-
      de evacuatiestations en de veilige verzamelpunten gemakkelijk bereikbaar te laten zijn vanuit de
      verblijfsaccommodatie en de werkruimten.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37s
  - number: 3.37s.3
    text: |-
      De maatregelen, bedoeld in het tweede lid, zijn zodanig dat ze de werknemers lang genoeg bescherming bieden om,
      indien nodig, in alle veiligheid een evacuatie- en reddingsoperatie te kunnen organiseren en uitvoeren.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37s
  - number: 3.37s.4
    text: |-
      Indien de veiligheid en de gezondheid van de werknemers dat vereisen, is een van de beschermde plaatsen, bedoeld
      in het eerste lid, voorzien van afstandbedieningssystemen voor noodgevallen als bedoeld in [artikel 3.37q][ref1] en
      van een communicatiesysteem als bedoeld in [artikel 3.37r, eerste lid, onder c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37s
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        afdeling: 3C
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        afdeling: 3C
  - number: 3.37s.5
    text: |-
      Op een mijnbouwinstallatie wordt voor elk veilig verzamelpunt een lijst opgesteld, bijgehouden en ter plaatse
      aangeplakt met de namen van de werknemers voor wie dat verzamelpunt is bestemd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37s
  - number: 3.37s.6
    text: |-
      Een lijst met de namen van de werknemers die in geval van nood speciale taken hebben wordt opgesteld en bijgehouden
      en op doelmatige plaatsen aangeplakt. De namen van deze werknemers worden eveneens vermeld in de schriftelijke
      instructies, bedoeld in [artikel 3.33][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37s
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3'
  - number: 3.37t.1
    text: |-
      Op een mijnbouwinstallatie zijn voor onmiddellijk gebruik voldoende geschikte middelen voor redding, evacuatie en
      voor directe ontsnapping in zee in noodgevallen beschikbaar.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37t
  - number: 3.37t.2
    text: |-
      Als evacuatie van werknemers moet geschieden langs moeilijke vluchtwegen of via plaatsen waar de lucht niet of
      mogelijk niet ingeademd kan worden, staat zelfreddingsapparatuur voor onmiddellijk gebruik op de werkplek ter
      beschikking van de werknemers.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37t
  - number: 3.37t.3
    text: 'Reddingsmiddelen als bedoeld in het eerste lid voldoen aan de volgende voorschriften:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37t
  - number: 3.37t.3.a
    text: ze zijn functioneel en zo nodig uitgerust met voorzieningen om lang genoeg te kunnen overleven;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37t
  - number: 3.37t.3.b
    text: er zijn er voldoende van om alle werknemers die zich in de installatie kunnen ophouden te kunnen evacueren;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37t
  - number: 3.37t.3.c
    text: het type is afgestemd op de arbeidsplaats;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37t
  - number: 3.37t.3.d
    text: |-
      ze zijn van betrouwbare materialen gemaakt, rekening houdend met de reddingsfunctie en de omstandigheden waarin ze
      eventueel zullen worden gebruikt of waarin ze gebruiksklaar worden gehouden; en
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37t
  - number: 3.37t.3.e
    text: |-
      ze hebben een kleur die opvalt wanneer ze worden gebruikt en zijn uitgerust met voorzieningen waarmee de gebruiker
      de aandacht van de redders kan trekken.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37t
  - number: 3.37t.4
    text: |-
      Het materiaal, dat nodig is in geval bij een ongeval vervoer per helikopter plaatsvindt, ligt gebruiksklaar
      opgeslagen in de onmiddellijke nabijheid van de helikopterlandingsplaats.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37t
  - number: 3.37u
    text: |-
      Op mijnbouwinstallaties worden branddetectie- en brandbeschermingssystemen, inrichtingen voor brandblussing of
      branddoving en alarmsystemen afgeschermd tegen ongelukken en wel op zodanige wijze dat hun functies in noodgevallen
      operationeel blijven. Zo nodig worden dergelijke systemen in dubbele uitvoering aangebracht.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37u
  - number: 3.37v.1
    text: |-
      Er wordt een noodplan opgesteld voor het geval dat iemand overboord valt of de arbeidsplaats moet worden
      geëvacueerd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37v
  - number: 3.37v.2
    text: |-
      Het noodplan, dat is gebaseerd op het veiligheids- en gezondheidsdocument, bedoeld in [artikel 2.42][ref1],
      voorziet in het gebruik van bijstandsboten en helicopters en bevat criteria voor de capaciteit en de reactietijd
      daarvan. De vereiste reactietijd wordt in het veiligheids- en gezondheidsdocument van elke installatie vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37v
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '6'
  - number: 3.37v.3
    text: |-
      De bijstandsboten zijn doelmatig ontworpen en uitgerust en voldoen aan de eisen in verband met evacuatie en
      redding.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37v
  - number: 3.37v.4
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste tot en met derde lid.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37v
  - number: 3.37w.1
    text: |-
      In aanvulling op [artikel 3.21][ref1] wordt, wanneer de aard, de omvang en de duur van de werkzaamheden op een
      mijnbouwinstallatie zulks vereisen, de nodige verblijfsaccommodatie ter beschikking gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37w
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: '1'
  - number: 3.37w.2
    text: |-
      Leidingen die in geval van lekkage direct gevaar voor de gezondheid kunnen opleveren worden buiten de accommodatie
      en de hiermee in verbinding staande gangen gehouden. Deze accommodatie:
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37w
  - number: 3.37w.2.a
    text: |-
      is afdoende beschermd tegen de gevolgen van explosies, binnendringen van rook en gas en het uitbreken
      en de verbreiding van brand, zoals omschreven in het veiligheids- en gezondheidsdocument, bedoeld in
      [artikel 2.42][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37w
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '6'
  - number: 3.37w.2.b
    text: |-
      is beschermd tegen weersomstandigheden en tegen geluids- en stankhinder en ontwikkeling van rookgassen uit andere
      ruimten, welke gevaarlijk voor de gezondheid kunnen zijn;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37w
  - number: 3.37w.2.c
    text: |-
      staat niet in rechtstreekse verbinding met besloten ruimten, waarin machines, ketels, tanks, drukvaten en
      dergelijke zijn opgesteld;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37w
  - number: 3.37w.2.d
    text: is afgescheiden van elke werkplek en ligt buiten gevarenzones;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37w
  - number: 3.37w.2.e
    text: |-
      staat, voorzover het een slaapverblijf betreft, niet in rechtstreekse verbinding met ontspanningsruimten, noch met
      ruimten voor het bereiden en bewaren van voedsel.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37w
  - number: 3.37w.3
    text: |-
      De verblijfsaccommodatie is voorzien van voldoende bedden of kooien, rekening houdend met het aantal werknemers dat
      naar verwachting in de installatie zal slapen. In een slaapverblijf bevinden zich ten hoogste twee slaapplaatsen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37w
  - number: 3.37w.4
    text: |-
      Elke verblijfsaccommodatie beschikt over voldoende plaats voor het opbergen van kleding en, indien daarin in de
      regel ten minste tien personen verblijven, een aparte was- en droogruimte.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37w
  - number: 3.37x
    text: |-
      Op een bemande mijnbouwinstallatie zijn voor het bereiden en bewaren van voedsel doelmatig ingerichte ruimten
      aanwezig, welke ruimten voor geen ander doel worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37x
  - number: 3.37y
    text: |-
      Tijdens de plaatsing van een mijnbouwinstallatie worden alle noodzakelijke maatregelen genomen om de veiligheid en
      de gezondheid van de werknemers te waarborgen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.37y
  - number: '3.38'
    text: |-
      In benzinestations zijn naast de voorschriften van afdeling 1 tevens de voorschriften van deze afdeling van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.38
  - number: 3.39.1
    text: |-
      Benzinestations, waarvan de winkel op werkdagen tussen 18.30 uur en 06.00 uur, op zondag, op Nieuwjaarsdag, op
      tweede Paasdag, op Hemelvaartsdag, op tweede Pinksterdag, op eerste Kerstdag, op tweede Kerstdag of op de dag,
      waarop de verjaardag van de Koning wordt gevierd, geopend is, zijn voorzien van:
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.39
  - number: 3.39.1.a
    text: een inwerpgeldkluis;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.39
  - number: 3.39.1.b
    text: |-
      een optische of akoestische alarminstallatie, tenzij het benzinestation is voorzien van een alarminstallatie als
      bedoeld in [artikel 3.40, onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.39
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '4'
  - number: 3.39.1.c
    text: |-
      een verlichtingsinstallatie welke gedurende ten minste vijftien minuten na sluiting van het benzinestation dat
      benzinestation blijft verlichten.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.39
  - number: 3.39.2
    text: |-
      Bij benzinestations waar een of meer benzinepompen worden bediend door een aldaar werkzame persoon, is de
      toegangsdeur tot de winkel in het benzinestation ten minste aan de binnenzijde afsluitbaar.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.39
  - number: 3.39.3
    text: |-
      Bij benzinestations waar geen enkele benzinepomp wordt bediend door een aldaar werkzame persoon, is de toegangsdeur
      tot de winkel in het benzinestation voorzien van een op afstand bedienbaar elektronisch sluitingsmechanisme dat
      uitsluitend vanuit de winkel kan worden bediend.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.39
  - number: '3.40'
    text: |-
      Voor benzinestations, waarvan de winkel tussen 21.00 uur en 06.00 uur geopend is, gelden in aanvulling op
      [artikel 3.39][ref1] de volgende voorschriften:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.40
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '4'
  - number: 3.40.a
    text: |-
      in de winkel in het benzinestation is ten minste één camera aanwezig die is aangesloten op een recorder, welke al
      dan niet met tijdsintervallen de camerabeelden opneemt;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.40
  - number: 3.40.b
    text: |-
      het benzinestation is voorzien van een alarminstallatie, welke langs telecommunicatieverbindingen zo nodig een
      alarmsignaal afgeeft bij een door Onze Minister van Justitie toegelaten alarmcentrale;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.40
  - number: 3.40.c
    text: |-
      de plaats in de winkel in een benzinestation waar de kassa zich bevindt, is omgeven door kogelwerend en slagvast
      materiaal dat tenminste voor een deel doorzichtig is, en
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.40
  - number: 3.40.d
    text: op het sluitingstijdstip van het benzinestation zijn tenminste twee aldaar werkzame personen ter plaatse aanwezig.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.40
  - number: '3.41'
    text: |-
      [Artikel 3.20][ref1] is niet van toepassing op leerlingen respectievelijk studenten in onderwijsinrichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.41
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: '1'
  - number: 3.42.1
    text: |-
      Op luchtvaartuigen, waarvoor vóór 1 januari 1997 een Nederlands of daaraan gelijk gesteld bewijs van
      luchtwaardigheid is afgegeven, zijn de [artikelen 3.4][ref1], [3.5][ref2], [3.7, vijfde lid][ref3], niet van
      toepassing, tenzij de naleving daarvan redelijkerwijs kan worden gevergd.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.42
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '1'
  - number: 3.42.2
    text: |-
      Op zeeschepen en binnenvaartuigen, die vóór 1 januari 1994 zijn gebouwd, zijn de [artikelen 3.7, vijfde lid][ref1],
      [3.20][ref2], [3.22][ref3], [3.23][ref4] en [3.24][ref5] niet van toepassing, tenzij de naleving daarvan
      redelijkerwijs kan worden gevergd.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0008498#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0008498#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.42
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: '1'
      - id: ref5
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: '1'
  - number: 3.42.3
    text: |-
      Onder gebouwde zeeschepen wordt verstaan: hetgeen daaronder wordt verstaan in
      [artikel 1 van het Schepenbesluit 1965][ref1] of, voor zover het zeegaande vissersvaartuigen betreft,
      [artikel 2 van het Vissersvaartuigenbesluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004607#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.42
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004607
        artikel: '2'
  - number: 3.42.4
    text: |-
      Op voertuigen op een openbare weg of spoorweg, die vóór 1 januari 1994 zijn gebouwd, is
      [artikel 3.7, vijfde lid][ref1], niet van toepassing, tenzij de naleving daarvan redelijkerwijs kan worden gevergd.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.42
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '1'
  - number: 3.42.5
    text: |-
      De [artikelen 3.4][ref1], [3.5][ref2] en [3.7, vijfde lid][ref3], zijn niet van toepassing op het in bedrijven of
      inrichtingen aanwezige rollende materieel van spoorwegondernemingen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.42
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '1'
  - number: 3.42.6
    text: |-
      De [artikelen 3.20 tot en met 3.25][ref1] zijn niet van toepassing op luchtvaartuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.42
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: '1'
  - number: 3.42.7
    text: |-
      De [artikelen 3.4][ref1], [3.5][ref2], [3.7, derde en vierde lid][ref3], [3.21, tweede volzin][ref4], en
      [3.25][ref5] zijn niet van toepassing op zeeschepen en binnenvaartuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0008498#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0008498#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.42
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
