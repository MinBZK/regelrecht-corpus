  - number: 1.1.5.c
    text: |-
      werknemer tijdens de lactatie: de werknemer die haar kind borstvoeding geeft en haar werkgever hiervan in kennis
      heeft gesteld;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.1
  - number: 1.1.5.d
    text: 'thuiswerkgever:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.1
  - number: 1.1.5.d.1°
    text: |-
