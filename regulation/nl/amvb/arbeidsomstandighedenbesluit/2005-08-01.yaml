        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
        afdeling: '1'
  - number: 4.52.2
    text: |-
      Het arbeidsgezondheidskundig onderzoek, bedoeld in [artikel 4.10a][ref1], omvat in ieder geval een specifiek
      onderzoek van de borstkas.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.52
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
        afdeling: '1'
  - number: 4.52.3
    text: |-
      Indien het resultaat van het arbeidsgezondheidskundig onderzoek, bedoeld in [artikel 4.10a][ref1], daartoe
      aanleiding geeft, worden doeltreffende maatregelen genomen om schade voor de gezondheid van de betrokken werknemer
      door blootstelling aan asbeststof te voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.52
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
        afdeling: '1'
  - number: 4.52.4
    text: |-
      Aan de deskundige persoon, bedoeld in [artikel 2.14a, tweede lid][ref1], of de arbodienst wordt inzage gegeven in
      de gegevens die in het register, bedoeld in [artikel 4.53][ref2], zijn vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.52
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
        afdeling: '5'
  - number: 4.53.1
    text: |-
      Van iedere werknemer die in verband met de arbeid wordt blootgesteld aan asbeststof wordt aantekening gehouden in
      een register, waarbij de aard en de duur van de arbeid alsmede de mate van de blootstelling worden vermeld.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.53
  - number: 4.53.2
    text: Iedere werknemer wordt in kennis gesteld van zijn persoonlijke gegevens in het register.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.53
  - number: 4.53.3
    text: |-
      De gegevens in het register worden, voorzien van een toelichting, in statistische, niet tot individuen herleidbare
      vorm, ter kennis gebracht van de ondernemingsraad of de personeelsvertegenwoordiging of, bij het ontbreken daarvan,
      van de belanghebbende werknemers.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.53
  - number: 4.54.1
    text: |-
      Op het slopen van gebouwen, constructies, apparaten, installaties en transportmiddelen waarin asbest of
      asbesthoudende producten dan wel crocidoliet of crocidoliethoudende producten is respectievelijk zijn verwerkt
      en bij het verwijderen van voornoemde stoffen of producten hieruit, zijn, met uitsluiting van de overige
      voorschriften van de [afdelingen 1][ref1] en [2][ref2] en de [paragrafen 3][ref3] en [4 van deze afdeling][ref4],
      de [artikelen 4.3a, aanhef en onder d][ref5], [4.6a, vierde lid, onder b, c en e, en vijfde lid][ref6],
      [4.10a][ref7], [4.10d, vierde lid][ref8], [4.18][ref9], [4.19, aanhef en onder b en c][ref10],
      [4.20, eerste tot en met vierde lid][ref11], [4.45, eerste en tweede lid, onder a, c en d][ref12], [4.51][ref13],
      [4.52][ref14] en [4.53][ref15] van overeenkomstige toepassing alsmede de artikelen [4.46][ref16] en [4.47][ref17],
      met dien verstande dat voor de toepassing van beide laatstgenoemde artikelen ten aanzien van crocidoliet de in
      [artikel 4.56, tweede lid,][ref18] genoemde grenswaarde geldt.


