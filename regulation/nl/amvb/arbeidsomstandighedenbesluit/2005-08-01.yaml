    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.1
  - number: 1.1.4.a
    text: |-
      fysieke belasting: de door een werknemer in verband met de arbeid in te nemen werkhouding, uit te voeren bewegingen
      of uit te oefenen krachten, onder meer bestaande uit het zitten en staan of uit het tillen, duwen, trekken, dragen
      of op een andere wijze verplaatsen of ondersteunen van een of meer lasten;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.1
  - number: 1.1.4.b
    text: |-
      persoonlijk beschermingsmiddel: iedere uitrusting die bestemd is om door de werknemer gedragen of vastgehouden te
      worden teneinde hem te beschermen tegen een of meer gevaren die zijn veiligheid of gezondheid op het werk kunnen
      bedreigen alsmede alle aanvullingen of accessoires die daartoe kunnen bijdragen met uitzondering van:
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.1
  - number: 1.1.4.b.1°
    text: |-
      gewone en uniforme werkkleding die niet specifiek bedoeld is om de veiligheid en de gezondheid van de werknemer
      te beschermen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.1
  - number: 1.1.4.b.2°
    text: sportuitrusting;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.1
  - number: 1.1.4.b.3°
    text: zelfverdedigings- of afschrikkingsmateriaal, en
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.1
  - number: 1.1.4.b.4°
    text: draagbare apparaten voor het opsporen en signaleren van gevaren en belastingsfactoren;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.1
  - number: 1.1.4.c
    text: |-
      veiligheids- of gezondheidssignalering: een signalering die, toegepast op een bepaald object, een bepaalde
      activiteit of een bepaalde situatie door middel van een bord, een kleur, een lichtsignaal, een akoestisch signaal,
      een mondelinge mededeling of een hand- of armsein een aanwijzing of een voorschrift verstrekt met betrekking tot de
      veiligheid of gezondheid op het werk.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.1
  - number: 1.1.5
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.1
  - number: 1.1.5.a
    text: 'jeugdige werknemer: een werknemer jonger dan 18 jaar;'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.1
  - number: 1.1.5.b
    text: 'zwangere werknemer: de werknemer die zwanger is en de werkgever hiervan in kennis heeft gesteld;'
