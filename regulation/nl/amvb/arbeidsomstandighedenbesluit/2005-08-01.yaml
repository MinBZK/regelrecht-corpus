  - number: 4.55.1.e
    text: een beschrijving van de aard, duur en plaats van de werkzaamheden alsmede van de werkmethode;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.55
  - number: 4.55.1.f
    text: |-
      een beschrijving van de werktuigen, machines, toestellen en overige hulpmiddelen die bij de werkzaamheden worden
      gebruikt;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.55
  - number: 4.55.1.g
    text: |-
      de naam van de in [artikel 4.54, vijfde lid][ref1], bedoelde persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.55
    references:
      - id: ref1
