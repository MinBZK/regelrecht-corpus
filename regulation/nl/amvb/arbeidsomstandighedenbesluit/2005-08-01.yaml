  - number: 4.1a.4
    text: |-
      Deze afdeling is, met inachtneming van het eerste lid, van overeenkomstige toepassing op arbeid waarbij werknemers
      kunnen worden blootgesteld aan een kankerverwekkend proces als bedoeld in [artikel 4.11, onderdeel c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.1a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: 4.2.1
    text: |-
      Indien werknemers worden of kunnen worden blootgesteld aan gevaarlijke stoffen, ongeacht of met deze stoffen
      daadwerkelijk arbeid wordt of zal worden verricht, worden, in het kader van de risico-inventarisatie en -evaluatie,
      bedoeld in [artikel 5 van de wet][ref1], de aard, de mate en de duur van die blootstelling beoordeeld teneinde de
      gevaren of de hinder voor de werknemers te bepalen.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
  - number: 4.2.2
    text: |-
      Met betrekking tot de aard van de blootstelling wordt in ieder geval vastgesteld aan welke gevaarlijke stoffen
      werknemers worden of kunnen worden blootgesteld, wat de gevaren zijn die aan die stoffen zijn verbonden, in welke
      situaties blootstelling zich kan voordoen en op welke wijze blootstelling kan plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.2
  - number: 4.2.3
    text: |-
      Met betrekking tot de mate van blootstelling wordt in ieder geval vastgesteld wat het blootstellingsniveau op
      de arbeidsplaats is. Voor het doeltreffend vast-stellen van het blootstellingsniveau wordt gebruik gemaakt van
      bestaande geschikte meetmethodes, tenzij dit niveau door middel van andere methodes doeltreffend kan worden
      bepaald.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.2
  - number: 4.2.4
    text: |-
      Voor zover het blootstellingsniveau alleen doeltreffend kan worden vastgesteld door middel van metingen, wordt
      gebruik gemaakt van een voor het doel van de meting geschikte en genormaliseerde meetmethode. Bij het ontbreken van
      een genormaliseerde meetmethode wordt de meting uitgevoerd volgens een andere voor het doel geschikte meetmethode.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.2
  - number: 4.2.5
    text: 'Bij de beoordeling bedoeld in het eerste lid, worden in ieder geval de volgende aspecten betrokken:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.2
  - number: 4.2.5.a
    text: |-
      de informatie over de veiligheid en gezondheid die door de leverancier van een gevaarlijke stof wordt verstrekt,
      waaronder begrepen de verplichte informatie die bij of krachtens wettelijk voorschrift wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.2
  - number: 4.2.5.b
    text: |-
      de toegepaste arbeidsprocédés en werkmethoden waarbij gevaarlijke stoffen zijn betrokken, waaronder begrepen de
      hoeveelheid gevaarlijke stoffen waaraan werknemers worden of kunnen worden blootgesteld;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.2
  - number: 4.2.5.c
    text: |-
      de redelijkerwijs voorzienbare gebeurtenissen, bedoeld in [artikel 4.2a, eerste lid, onder b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.2
    references:
      - id: ref1
