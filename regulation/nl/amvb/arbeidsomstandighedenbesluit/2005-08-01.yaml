  - number: 4.2.6
    text: |-
      Indien sprake is van verschillende gevaarlijke stoffen, wordt bij de beoordeling, bedoeld in het eerste lid, de
      mogelijke versterkende effecten betrokken die gevaarlijke stoffen op elkaar kunnen hebben.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.2
  - number: 4.2.7
    text: |-
      De beoordeling, bedoeld in het eerste lid, wordt regelmatig herzien, in ieder geval indien gewijzigde
      omstandigheden of de resultaten van de arbeidsgezondheidskundige onderzoeken, bedoeld in de [artikelen 4.10a][ref1]
      en [4.10b][ref2], hiertoe aanleiding geven.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.2
    references:
