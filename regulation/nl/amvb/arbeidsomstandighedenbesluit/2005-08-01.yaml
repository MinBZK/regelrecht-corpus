  - number: 9.9c.2
    text: |-
      Voor zover van de artikelen, bedoeld in het eerste lid, ontheffing onder voorschriften is verleend, wordt de
      handeling of het nalaten in strijd met die voorschriften mede aangemerkt als beboetbaar feit ter zake waarvan een
      boete van de tweede categorie kan worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.9c
  - number: '9.14'
    text: |-
      Vrijstelling of ontheffing van het in [artikel 4.59, eerste lid][ref1], vervatte verbod kan slechts verleend worden
      voor:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.14
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '6'
  - number: 9.14.a
    text: het gebruik van de stoffen voor onderzoek en proeven, met inbegrip van analyse;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.14
  - number: 9.14.b
    text: |-
      werkzaamheden die zijn gericht op de verwijdering van de stoffen die in een mengsel of oplossing aanwezig zijn in
      een concentratie die kleiner is dan 0,1 gewichtsprocent;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.14
  - number: 9.14.c
    text: |-
      productieprocessen waarbij de stoffen in een gesloten procesinstallatie worden vervaardigd en daarin worden omgezet
      in andere stoffen, zonder dat de stoffen daarbij, anders dan voor zover dat noodzakelijk is voor de controle op het
      productieproces en het onderhoud van de procesinstallatie, tussentijds uit de procesinstallatie worden genomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.14
  - number: '9.15'
    text: |-
      In gevallen waarin van de in [artikel 4.59][ref1] vervatte verboden vrijstelling is verleend worden:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.15
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '6'
  - number: 9.15.a
    text: |-
      indien het voornemen bestaat om een in de vrijstelling genoemde stof te vervaardigen, te
      gebruiken of in voorraad te houden, aan een daartoe aangewezen ambtenaar als bedoeld in
      [artikel 24, eerste lid, van de wet ][ref1]schriftelijk de volgende gegevens gemeld:


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.15
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 9.15.a.1°
    text: de identiteit van de stof die zal worden vervaardigd of gebruikt dan wel in voorraad zal worden gehouden;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.15
  - number: 9.15.a.2°
    text: de hoeveelheid van de stof die per jaar zal worden vervaardigd of gebruikt dan wel in voorraad zal worden gehouden;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.15
  - number: 9.15.a.3°
    text: de plaats waar de stof zal worden vervaardigd of gebruikt dan wel in voorraad zal worden gehouden;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.15
  - number: 9.15.a.4°
    text: de vormen van arbeid die met de stof zullen worden verricht;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.15
  - number: 9.15.a.5°
    text: het aantal werknemers dat bij de arbeid aan de stof zal kunnen worden blootgesteld;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.15
  - number: 9.15.a.6°
    text: de wijze waarop en de mate waarin werknemers bij de arbeid aan de stof zullen kunnen worden blootgesteld;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.15
  - number: 9.15.a.7°
    text: |-
      de maatregelen die zijn genomen om te voorkomen dat werknemers bij de arbeid aan de stof zullen worden
      blootgesteld;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.15
  - number: 9.15.b
    text: |-
      indien het voornemen bestaat om een belangrijke wijziging aan te brengen in de omstandigheden die ten
      grondslag liggen aan de gegevens die zijn overgelegd op grond van het onder *a* bedoelde voorschrift, de
      daar bedoelde gegevens opnieuw schriftelijk gemeld aan een daartoe aangewezen ambtenaar als bedoeld in
      [artikel 24, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.15
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 9.15.c
    text: |-
      de gegevens die zijn overgelegd op grond van de in de onder *a* en *b* bedoelde voorschriften ter kennis gebracht
      van de ondernemingsraad of de personeelsvertegenwoordiging of, bij het ontbreken daarvan, van de belanghebbende
      werknemers;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.15
  - number: 9.15.d
    text: |-
      naast de gegevens die ter kennis worden gebracht op grond van het onder *c* bedoelde voorschrift, tevens al die
      gegevens verstrekt die nodig zijn om de ondernemingsraad of de personeelsvertegenwoordiging of, bij het ontbreken
      daarvan, de belanghebbende werknemers doeltreffend in te lichten over de gevaren voor de gezondheid en de
      veiligheid die aan de stof zijn verbonden en de werkzaamheden die daarmee zullen worden verricht alsmede over de
      maatregelen die ter voorkoming van die gevaren worden genomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.15
  - number: 9.16.1
    text: |-
      Bij een verzoek om ontheffing van de in [artikel 4.59][ref1] vervatte verboden wordt de reden van het verzoek
      gegeven en worden de in [artikel 9.15, onder a][ref2], bedoelde gegevens overlegd.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel9
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.16
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
        afdeling: '3'
  - number: 9.16.2
    text: |-
      In gevallen waarin van de in [artikel 4.59][ref1] vervatte verboden ontheffing is verleend, wordt de
      ondernemingsraad of de personeelsvertegenwoordiging of worden, bij het ontbreken daarvan, de belanghebbende
      werknemers, doeltreffend schriftelijk ingelicht over de gevaren voor de gezondheid en de veiligheid die aan de
      stof zijn verbonden en de werkzaamheden die daarmee zullen worden verricht alsmede over de maatregelen die ter
      voorkoming van die gevaren worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.16
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '6'
  - number: 9.16a.1
    text: |-
      Vrijstelling of ontheffing van [artikel 4.62b][ref1] kan uitsluitend worden verleend in gevallen waarin het
      technisch niet uitvoerbaar is om onschadelijke of minder schadelijke stoffen of producten te gebruiken dan
      vluchtige organische stoffen of producten die deze stoffen bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.16a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        afdeling: 6A
  - number: 9.16a.2
    text: |-
      Op werkzaamheden waarvoor vrijstelling of ontheffing is verleend van [artikel 4.62b][ref1], is, in afwijking van
      [artikel 4.1a, derde lid][ref2], [artikel 4.9][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.16a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        afdeling: 6A
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
        afdeling: '1'
  - number: 9.17.1
    text: |-
      Vrijstelling of ontheffing van [artikel 6.8, zevende lid, derde volzin][ref1], kan uitsluitend worden verleend
      in gevallen waarin het redelijkerwijs niet mogelijk is om de blootstelling van werknemers te beperken tot
      het in [artikel 6.8, eerste en tweede lid][ref2], genoemde equivalente geluidsniveau en het technisch niet
      mogelijk is dat de persoonlijke beschermingsmiddelen een demping van het geluid bieden tot beneden het in
      [artikel 6.8, negende lid][ref3], genoemde equivalente geluidsniveau.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel6
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.17
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '2'
        afdeling: '3'
  - number: 9.17.2
    text: |-
      Aan een vrijstelling of ontheffing als bedoeld in het eerste lid, wordt in ieder geval het voorschrift verbonden
      dat de persoonlijke beschermingsmiddelen een demping bieden tot een zo laag mogelijk geluidsniveau.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.17
  - number: 9.17.3
    text: |-
      Vrijstelling of ontheffing van [artikel 6.8, zevende lid, eerste volzin, en negende en tiende lid][ref1], kan
      uitsluitend worden verleend in gevallen waarin door werknemers bijzondere taken worden uitgevoerd en in verband
      met het uitvoeren van deze taken het gebruik van de persoonlijke beschermingsmiddelen een verzwaring van het totale
      gevaar voor de veiligheid en de gezondheid van de betrokken werknemers met zich brengt en dit gevaar redelijkerwijs
      niet door doeltreffende maatregelen kan worden beperkt.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.17
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '2'
        afdeling: '3'
  - number: 9.17.4
    text: |-
      Aan vrijstellingen of ontheffingen, bedoeld in dit artikel, worden voorschriften verbonden om de duur en de mate
      van de blootstelling van de betrokken werknemers aan schadelijk geluid zoveel mogelijk te beperken.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.17
  - number: 9.17a
    text: |-
      Ontheffing van [artikel 6.11c, tweede lid][ref1], kan uitsluitend worden verleend indien:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.17a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '2'
        afdeling: 3a
  - number: 9.17a.a
    text: |-
      de blootstelling gewoonlijk onder de actiewaarden, bedoeld in
      [artikel 6.11a, tweede lid, onderdeel b, en derde lid, onderdeel b][ref1], blijft;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.17a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
        afdeling: 3a
  - number: 9.17a.b
    text: de overschrijding incidenteel van aard is;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.17a
  - number: 9.17a.c
    text: de gemiddelde blootstelling over een periode van 40 uur onder de grenswaarde voor blootstelling blijft;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.17a
  - number: 9.17a.d
    text: |-
      er bewijzen zijn dat de risico's van het blootstellingspatroon geringer zijn dan de risico's van blootstelling aan
      de grenswaarde voor blootstelling;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.17a
  - number: 9.17a.e
    text: de hieruit voortvloeiende risico’s tot een minimum beperkt worden;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.17a
  - number: 9.17a.f
    text: |-
      de betrokken werknemers en de ondernemingsraad of personeelsvertegenwoordiging of, bij het ontbreken daarvan, de
      belanghebbende werknemers vooraf over de aard en inhoud van de aanvraag tot ontheffing geraadpleegd zijn, en
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.17a
  - number: 9.17a.g
    text: de betrokken werknemers onder verscherpt gezondheidstoezicht staan.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.17a
  - number: 9.17b
    text: |-
      Voor zeeschepen en luchtvaartuigen kan vrijstelling van [artikel 6.11c, tweede lid][ref1], worden verleend,
      voorzover het betreft de grenswaarde, bedoeld in [artikel 6.11a, derde lid, onderdeel a][ref2], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel6
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.17b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '2'
        afdeling: 3a
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
        afdeling: 3a
  - number: 9.17b.a
    text: |-
      het gezien de stand van de techniek en de specifieke kenmerken van de arbeidsplaats, ondanks de uitvoering van
      technische en/of organisatorische maatregelen, niet mogelijk is om te voldoen aan de grenswaarde voor blootstelling
      aan lichaamstrillingen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel9.17b
  - number: 9.17b.b
