      de maatregelen genoemd in [artikel 4.47, derde lid][ref1], alsmede, voor zover zulks redelijkerwijs uitvoerbaar is,
      de maatregel om eerst asbest of asbesthoudende producten dan wel crocidoliet of crocidoliethoudende producten te
      verwijderen alvorens andere slooptechnieken toe te passen;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.55
    references:
