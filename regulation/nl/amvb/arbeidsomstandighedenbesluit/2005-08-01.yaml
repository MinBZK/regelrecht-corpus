        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
        afdeling: '5'
  - number: 4.55.2
    text: |-
      Het slopen of het verwijderen van asbest of asbesthoudende producten dan wel van crocidoliet of van
      crocidoliethoudende producten wordt volgens het in het eerste lid bedoelde werkplan uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.55
  - number: 4.56.1
    text: |-
      De [paragrafen 3][ref1], met uitzondering van [artikel 4.44][ref2], en [7][ref3] van deze afdeling zijn van
      toepassing op handelingen:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.56
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0008498
        hoofdstuk: '4'
        paragraaf: '7'
        afdeling: '5'
  - number: 4.56.1.a
    text: |-
      als bedoeld in [artikel 5 van het Productenbesluit asbest][ref1], waarbij crocidoliet en crocidoliethoudende
      producten zijn betrokken;


      [ref1]: https://wetten.overheid.nl/BWBR0017778#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.56
    references:
      - id: ref1
        bwb_id: BWBR0017778
        artikel: '5'
  - number: 4.56.1.b
    text: |-
      met crocidoliet of een crocidoliethoudend product dat wordt verwijderd in een inrichting als bedoeld in
      [artikel 1.1, vierde lid, van de Wet milieubeheer][ref1], met dien verstande dat voor de toepassing van de
      [artikelen 4.46][ref2] en [4.47][ref3] de in het tweede lid genoemde grenswaarde geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.56
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
      - id: ref2
