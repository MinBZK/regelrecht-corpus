        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '1'
  - number: 4.2.5.d
    text: |-
      voor zover van toepassing de grenswaarden die zijn vastgesteld bij of krachtens de [artikelen 4.8b][ref1],
      [4.16][ref2], [4.46][ref3] of [4.56][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel4
