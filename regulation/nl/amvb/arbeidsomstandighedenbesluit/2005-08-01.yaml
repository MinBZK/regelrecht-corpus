      wordt ingezet, waaronder begrepen de verlening van bijstand op grond van de
      [artikelen 58][ref1], [59][ref2] of [60 van de Politiewet 1993][ref3] of op grond van
      [artikel 146, tweede lid, van het Wetboek van Strafvordering][ref4] en de verlening van steun in het openbaar
      belang.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0006299#Artikel60
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel146
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.29
    references:
