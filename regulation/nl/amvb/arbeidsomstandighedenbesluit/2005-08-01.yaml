    text: arbeid verrichten waarbij gevaar voor instorting bestaat;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.46
  - number: 3.46.b
    text: |-
      arbeid verrichten aan, met of in de directe nabijheid van hoogspanningsinstallaties, bedoeld in
      [artikel 3.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.46
