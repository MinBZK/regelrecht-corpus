        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
        afdeling: '1'
  - number: 4.2.8
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot dit artikel. Deze regels kunnen
      betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.2
  - number: 4.2.8.a
    text: de methoden, bedoeld in het vierde lid, waarmee het blootstellingsniveau doeltreffend wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.2
  - number: 4.2.8.b
    text: het gebruik van bestaande geschikte meetmethoden voor blootstelling aan gevaarlijke stoffen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.2
  - number: 4.2.8.c
    text: de frequentie waarin het blootstellingsniveau wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.2
  - number: 4.2.8.d
    text: |-
      de technische specificaties van de apparatuur met behulp waarvan in dit artikel bedoelde metingen worden
      uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.2
  - number: 4.2.8.e
    text: de wijze waarop meetresultaten worden beoordeeld en geregistreerd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.2
  - number: 4.2a.1
    text: |-
      In aanvulling op [artikel 4.2][ref1] worden met betrekking tot gevaarlijke stoffen die, gelet op de aard van de
      bedrijvigheid, met enige regelmaat aanwezig zijn of worden toegepast, in de risico-inventarisatie en -evaluatie,
      bedoeld in [artikel 5 van de wet][ref2], voorts de volgende gegevens opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.2a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '5'
  - number: 4.2a.1.a
    text: |-
      de maatregelen die zijn genomen ter naleving van het bepaalde bij of krachtens deze afdeling, alsmede de
      [afdelingen 2][ref1] en [5 van dit hoofdstuk][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.2a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '4'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008498
        hoofdstuk: '4'
        afdeling: '5'
  - number: 4.2a.1.b
    text: |-
      de redelijkerwijs voorzienbare gebeurtenissen die kunnen leiden tot een aanzienlijke toename van de mate van
      blootstelling ook indien er maatregelen als bedoeld in onderdeel a zijn getroffen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.2a
  - number: 4.2a.2
    text: |-
      Indien op de arbeidsplaats in verband met de aard van de werkzaamheden die daar worden uitgevoerd, gevaarlijke
      stoffen plegen voor te komen die bij of krachtens de [Wet milieugevaarlijke stoffen][ref1] worden ingedeeld in
      de categorie« voor de voortplanting vergiftig», bedoeld in [artikel 34, tweede lid, onder n, van die wet][ref2],
      alsmede stoffen als bedoeld in [richtlijn nr. 67/548/EEG](31967L0548) van de Raad van de Europese Economische
      Gemeenschap van 27 juni 1967 betreffende de aanpassing van de wettelijke en bestuursrechtelijke bepalingen inzake
      de indeling, de verpakking en het kenmerken van gevaarlijke stoffen (PbEG L 196) die met de waarschuwingszin R64
      worden gekenmerkt overeenkomstig de criteria in paragraaf 3.2.8 van bijlage VI bij deze richtlijn, worden met
      betrekking tot die stoffen in de risico-inventarisatie en -evaluatie, bedoeld in [artikel 5 van de wet][ref3],
      tevens de volgende gegevens vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0003892
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.2a
    references:
      - id: ref1
        bwb_id: BWBR0003892
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '34'
      - id: ref3
        bwb_id: BWBR0010346
        artikel: '5'
  - number: 4.2a.2.a
    text: |-
      de hoeveelheid van de stof die per jaar pleegt te worden vervaardigd of gebruikt dan wel aanwezig pleegt te zijn in
      verband met opslag;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.2a
  - number: 4.2a.2.b
    text: het aantal werknemers dat arbeid pleegt te verrichten op de arbeidsplaats waar de stof pleegt voor te komen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.2a
  - number: 4.2a.2.c
    text: de vorm van de arbeid die met de stof pleegt te worden verricht;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.2a
  - number: 4.2a.2.d
    text: de wijze waarop de onder b bedoelde werknemers bij hun arbeid aan de stof worden of kunnen worden blootgesteld.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.2a
  - number: 4.2b
    text: |-
      Indien op de arbeidsplaats gevaarlijke stoffen aanwezig zijn, wordt de grootst mogelijke zorgvuldigheid,
      ordelijkheid en zindelijkheid in acht genomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.2b
  - number: 4.3.1
    text: |-
      Met betrekking tot de verpakking van een gevaarlijke stof alsmede met betrekking tot de sluiting van die
      verpakking, is [artikel 35, eerste tot en met derde lid, van de Wet milieugevaarlijke stoffen][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel35
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '35'
  - number: 4.3.2
    text: |-
      Op de verpakking van een stof die krachtens de [Wet milieugevaarlijke stoffen][ref1] bij de aflevering en bij
      het ter aflevering voorhanden hebben moet worden geëtiketteerd, worden de aanduidingen die voor die stof bij of
      krachtens genoemde wet ten behoeve van de aflevering van die stof zijn voorgeschreven, opvallend en goed leesbaar
      vermeld, met uitzondering van de aanduidingen die betrekking hebben op de categorie «milieugevaarlijk».


      [ref1]: https://wetten.overheid.nl/BWBR0003892
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0003892
  - number: 4.3.3
    text: |-
      Op de verpakking van een stof als bedoeld in het eerste lid, waarop
      [artikel 34 van de Wet milieugevaarlijke stoffen][ref1] niet van toepassing is, worden opvallend en goed leesbaar
      vermeld de naam van de stof en een aanduiding van de aard van het gevaar of de gevaren, verbonden aan die stof.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel34
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '34'
  - number: 4.3.4
    text: |-
      Dit artikel is niet van toepassing op bestrijdingsmiddelen als bedoeld in de [Bestrijdingsmiddelenwet 1962][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002380
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0002380
  - number: 4.3a
    text: |-
      In alle gevallen waarin arbeid wordt verricht waarbij werknemers kunnen worden blootgesteld aan gevaarlijke
      stoffen, worden, in het kader van [artikel 3 van de wet][ref1], de volgende maatregelen genomen om blootstelling
      van werknemers te voorkomen of te beperken tot een zo laag mogelijk niveau:


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.3a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '3'
  - number: 4.3a.a
    text: |-
      de arbeidsprocédés en werkmethoden zijn zodanig ontworpen en georganiseerd dat het risico op blootstelling wordt
      voorkomen of beperkt;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.3a
  - number: 4.3a.b
    text: er wordt gebruik gemaakt van adequate arbeidsmiddelen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.3a
  - number: 4.3a.c
    text: er wordt gebruik gemaakt van adequate voorzieningen bij het uitvoeren van reparatie- of onderhoudswerkzaamheden;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.3a
  - number: 4.3a.d
    text: |-
      gevaarlijke stoffen zijn in geen grotere hoeveelheid aanwezig en het aantal werknemers dat wordt of kan worden
      blootgesteld is niet groter dan voor het verrichten van de arbeid strikt noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.3a
  - number: 4.3a.e
    text: de mate en duur van de blootstelling wordt zoveel mogelijk beperkt;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.3a
  - number: 4.3a.f
    text: bij de arbeid zijn de noodzakelijke hygiënische voorzieningen getroffen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.3a
  - number: 4.3a.g
    text: er wordt gebruik gemaakt van doeltreffende middelen voor veilig opslaan, hanteren en vervoeren van stoffen, en
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.3a
  - number: 4.3a.h
    text: |-
      er wordt gebruik gemaakt van doeltreffende middelen voor het veilig verzamelen, opslaan en verwijderen van
      afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.3a
  - number: 4.4.1
    text: |-
      Voor zover uit de resultaten van de beoordeling, bedoeld in [artikel 4.2][ref1], blijkt dat er ten aanzien van
      aanwezige gevaarlijke stoffen gevaren voor de veiligheid of de gezondheid van de werknemers bestaan, en deze
      stoffen niet kunnen worden vervangen overeenkomstig [artikel 4.9, derde lid][ref2], of [artikel 4.17][ref3], zijn
      zodanige voorzieningen getroffen dat het gevaar, dat zich met betrekking tot die stoffen een ongewilde gebeurtenis
      voordoet, zoveel mogelijk is vermeden.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '2'
  - number: 4.4.2
    text: |-
      Bij het verrichten van arbeid met of in aanwezigheid van stoffen als bedoeld in het eerste lid, zijn zodanige
      voorzieningen getroffen, dat het gevaar dat zich bij die arbeid een ongewilde gebeurtenis voordoet, zoveel mogelijk
      is vermeden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.4
  - number: 4.4.3
    text: |-
      Het tweede lid is van overeenkomstige toepassing op het verrichten van arbeid aan, dan wel het verwijderen van
      reservoirs, installaties, verpakkingen of andere zaken waarin zich stoffen dan wel restanten van die stoffen als
      bedoeld in het eerste lid, bevinden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.4
  - number: 4.4.4
    text: |-
      Voorts zijn zodanige voorzieningen getroffen dat in geval zich een ongewilde gebeurtenis als bedoeld in het eerste,
      respectievelijk het tweede lid voordoet, de gevolgen daarvan zoveel mogelijk worden beperkt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.4
  - number: 4.4.5
    text: |-
      De voorzieningen, bedoeld in het eerste, tweede en vierde lid, zijn, voor zover van toepassing, in overeenstemming
      met het [Warenwetbesluit explosieveilig materieel][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007497
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0007497
  - number: 4.4.6
    text: |-
      In ruimten waarin arbeid als bedoeld in het tweede lid wordt uitgevoerd, zijn stoffen in geen grotere hoeveelheden
      aanwezig dan voor de bedrijfsvoering strikt noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.4
  - number: 4.4.7
    text: In ruimten als bedoeld in het zesde lid, zijn niet meer werknemers aanwezig dan noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.4
  - number: 4.4.8
    text: |-
      Arbeid met of in de aanwezigheid van stoffen als bedoeld in het eerste lid mag slechts worden verricht door
      personen die in een zodanige lichamelijke en geestelijke toestand verkeren en op het gebied van die arbeid over
      een zodanige basiskennis beschikken, dat zij voldoende in staat zijn de daaraan verbonden gevaren te onderkennen en
      te voorkomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.4
  - number: 4.5.1
    text: |-
      Op plaatsen waar stoffen aanwezig zijn die op grond van de [Wet milieugevaarlijke stoffen][ref1] voldoen aan
      de criteria voor indeling in een of meer van de categorieën« ontplofbaar», «zeer licht ontvlambaar», «licht
      ontvlambaar», «ontvlambaar», «zeer vergiftig»,« vergiftig», «sensibiliserend», «kankerverwekkend»,« mutageen» en
      «voor de voortplanting vergiftig», bedoeld in [artikel 34, tweede lid, van die wet][ref2], mag niet worden gerookt.


      [ref1]: https://wetten.overheid.nl/BWBR0003892
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel34
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0003892
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '34'
  - number: 4.5.2
    text: |-
      Plaatsen waar stoffen aanwezig zijn die op grond van de [Wet milieugevaarlijke stoffen][ref1] voldoen aan de
      criteria voor indeling in een of meer van de categorieën« zeer vergiftig», «vergiftig», «kankerverwekkend»,«
      mutageen» en «voor de voortplanting vergiftig», bedoeld in [artikel 34, tweede lid, van die wet][ref2], mogen niet
      tevens als slaapplaats worden gebruikt noch mag daar voedsel of drank worden genuttigd of bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0003892
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel34
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0003892
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '34'
  - number: 4.5.3
    text: |-
      Stoffen die op grond van de [Wet milieugevaarlijke stoffen][ref1] voldoen aan de criteria voor
      indeling in een of meer van de categorieën «zeer vergiftig», «vergiftig» en «bijtend», bedoeld in
      [artikel 34, tweede lid, van die wet][ref2], worden afgesloten bewaard zodat zij niet in handen van onbevoegden
      kunnen geraken.


      [ref1]: https://wetten.overheid.nl/BWBR0003892
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel34
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0003892
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '34'
  - number: 4.6.1
    text: |-
      Indien kan worden vermoed dat werknemers bij verblijf op een plaats of in een ruimte kunnen worden blootgesteld aan
      stoffen in een zodanige mate dat daardoor gevaar bestaat voor verstikking, bedwelming of vergiftiging dan wel brand
      of explosie, mag een werknemer zich niet op die plaats of in die ruimte begeven voordat uit een adequaat onderzoek
      is gebleken of dat gevaar aanwezig is.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.6
  - number: 4.6.2
    text: |-
      Indien uit het onderzoek, bedoeld in het eerste lid, blijkt dat het gevaar voor verstikking, bedwelming,
      vergiftiging, brand of explosie aanwezig is, worden doeltreffende maatregelen genomen zodat de werknemers die
      plaats of die ruimte zonder genoemde gevaren kunnen betreden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.6
  - number: 4.6.3
    text: |-
      Indien op een plaats of in een ruimte als bedoeld in het eerste lid, direct gevaar ontstaat, worden doeltreffende
      maatregelen genomen zodat de werknemers die deze plaats of deze ruimte hebben betreden, deze terstond kunnen
      verlaten. Indien dat niet mogelijk is en het toch noodzakelijk is om die plaats of die ruimte te betreden, dan
      mag dit alleen indien arbeidsmiddelen worden gebruikt die het desbetreffende gevaar niet zelf kunnen veroorzaken
      alsmede persoonlijke beschermingsmiddelen beschikbaar worden gesteld en gebruikt. Zo nodig worden de werknemers die
      de plaats op of de ruimte moeten betreden, permanent van buitenaf geobserveerd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.6
  - number: 4.6a.1
    text: |-
      Voor zover uit de resultaten van de beoordeling, bedoeld in [artikel 4.2][ref1], blijkt dat er gevaar voor de
      veiligheid of de gezondheid van de werknemers bestaat, zijn in aanvulling op [afdeling 4 van hoofdstuk 2][ref2]
      doeltreffende procedures opgesteld die in werking treden indien zich een ongewilde gebeurtenis als bedoeld in
      [artikel 4.4, eerste, respectievelijk tweede lid][ref3] voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.6a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008498
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '1'
  - number: 4.6a.2
    text: |-
      De procedures, bedoeld in het eerste lid, worden opgenomen in de risico-inventarisatie en -evaluatie, bedoeld in
      [artikel 5 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.6a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
  - number: 4.6a.3
    text: |-
      Op grond van de procedures, bedoeld in het eerste lid, zijn zodanige technische of organisatorische maatregelen
      genomen, dat wanneer zich een ongewilde gebeurtenis voordoet de gevolgen hiervan zoveel mogelijk worden beperkt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.6a
  - number: 4.6a.4
    text: 'Ter naleving van het derde lid worden in ieder geval de volgende maatregelen genomen:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.6a
  - number: 4.6a.4.a
    text: |-
      er worden onmiddellijk doeltreffende maatregelen genomen om de gevolgen van een ongewilde gebeurtenis zoveel
      mogelijk te beperken en wordt zo spoedig mogelijk zorg gedragen voor het herstel van de veilige toestand;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.6a
  - number: 4.6a.4.b
    text: |-
      de werknemers worden onverwijld ingelicht over de ongewilde gebeurtenis en wordt er zorg voor gedragen dat zij zich
      verwijderen uit de getroffen zone;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.6a
  - number: 4.6a.4.c
    text: |-
      betreden uitsluitend de werknemers of andere personen, belast met het uitvoeren van de noodzakelijke
      herstelwerkzaamheden, met gebruik van doeltreffende middelen en persoonlijke beschermingsmiddelen, de getroffen
      zone. Deze werknemers en andere personen zijn niet langer dan strikt noodzakelijk voor het herstel van de veilige
      toestand in de desbetreffende zone aanwezig;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.6a
  - number: 4.6a.4.d
    text: |-
      zijn in aanvulling op [afdeling 4 van hoofdstuk 2][ref1] doeltreffende waarschuwings- en andere
      communicatiesystemen beschikbaar ten behoeve van de signalering van een toegenomen risico voor de veiligheid en
      gezondheid en die voldoen aan het bepaalde bij of krachtens [afdeling 2 van hoofdstuk 8][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.6a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0008498
        hoofdstuk: '8'
        afdeling: '2'
  - number: 4.6a.4.e
    text: voorkomen wordt dat anderen dan de personen, bedoeld in onderdeel c, de getroffen zone betreden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.6a
  - number: 4.6a.5
    text: |-
      Indien zich een ongewilde gebeurtenis voordoet, wordt de ondernemingsraad of de personeelsvertegenwoordiging
      of worden, bij het ontbreken daarvan, de belanghebbende werknemers, zo spoedig mogelijk in kennis gesteld
      van de oorzaken van de ongewilde gebeurtenis, de hoogte van het blootstellingsniveau als bedoeld in
      [artikel 4.2, derde lid][ref1], en van de maatregelen die worden genomen om de oorzaken weg te nemen en
      blootstelling zoveel mogelijk te voorkomen of te beperken.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.6a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '1'
  - number: 4.6a.6
    text: |-
      De werkgever zorgt ervoor dat de bedrijfshulpverleners en de hulpverleningsorganisaties, bedoeld in
      [artikel 2.16][ref1], alsmede de deskundigen, genoemd in [artikel 13 van de wet][ref2], en de deskundigen of
      arbodiensten, genoemd in de [artikelen 14][ref3] en [14a van de wet][ref4], desgewenst kennis kunnen nemen van de
      maatregelen, bedoeld in het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0010346#Artikel14a
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.6a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '13'
      - id: ref3
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref4
        bwb_id: BWBR0010346
        artikel: 14a
  - number: 4.6a.7
    text: 'De informatie over de maatregelen, bedoeld in het zesde lid, omvat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.6a
  - number: 4.6a.7.a
    text: |-
      een beschrijving van de gevaren op grond van de beoordeling, bedoeld in [artikel 4.2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.6a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '1'
  - number: 4.6a.7.b
    text: |-
      een beschrijving van de redelijkerwijs voorzienbare specifieke gevaren op grond van de beoordeling, bedoeld in
      [artikel 4.2][ref1], die kunnen ontstaan bij een ongewilde gebeurtenis;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.6a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '1'
  - number: 4.6a.7.c
    text: |-
      een beschrijving van de voorzieningen die zijn getroffen ter naleving van
      [artikel 4.4, eerste, tweede en vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.6a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '1'
  - number: 4.6a.7.d
    text: een omschrijving van de procedures, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.6a
  - number: 4.7.1
    text: |-
      [Artikel 4.6][ref1] is niet van toepassing ten aanzien van de volgende werkzaamheden aan, op of in tankschepen van
      een bij ministeriële regeling aangewezen categorie;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '1'
  - number: 4.7.1.a
    text: het schoonmaken,
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.7
  - number: 4.7.1.b
    text: het onderhouden, herstellen of verbouwen,
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.7
  - number: 4.7.1.c
    text: |-
      het geheel of gedeeltelijk slopen, waarbij gevaar bestaat voor brand, explosie, vergiftiging, verstikking of
      bedwelming.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.7
  - number: 4.7.2
    text: |-
      De in het eerste lid bedoelde werkzaamheden worden op veilige wijze verricht door of onder toezicht van een persoon
      die beschikt over voldoende deskundigheid.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.7
  - number: 4.7.3
    text: |-
      Bij ministeriële regeling worden werkzaamheden aangewezen, die uitsluitend worden verricht, indien een
      gasdeskundige vooraf de gevaren voor de veiligheid en gezondheid van de werknemers heeft beoordeeld en een
      verklaring heeft afgegeven die voldoet aan een bij ministeriële regeling vast te stellen model.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.7
  - number: 4.7.4
    text: |-
      Een gasdeskundige als bedoeld in het derde lid, is in het bezit van een certificaat van vakbekwaamheid
      gasdeskundige, dat is afgegeven door Onze Minister of een certificerende instelling.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.7
  - number: 4.7.5
    text: |-
      Het certificaat van vakbekwaamheid gasdeskundige of een afschrift daarvan is op de arbeidsplaats aanwezig en wordt
      desgevraagd getoond aan een ambtenaar als bedoeld in [artikel 24 van de wet.][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 4.7.6
    text: Ten aanzien van de in het eerste lid bedoelde werkzaamheden worden bij ministeriële regeling nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.7
  - number: 4.8.1
    text: |-
      Arbeid waarbij voor demolitie, zijnde het springen van objecten of materialen, of voor onderhoud, gebruik wordt
      gemaakt van stoffen die op grond van de [Wet milieugevaarlijke stoffen][ref1] voldoen aan de criteria voor indeling
      in de categorie «ontplofbaar», bedoeld in [artikel 34, tweede lid, onder a, van die wet][ref2], wordt verricht
      volgens een vooraf opgesteld springplan of, bij de verkenning naar, opsporing of winning van delfstoffen, een
      vooraf opgesteld programma. De inhoud van het springplan of programma bevat een deugdelijke beschrijving van de uit
      te voeren werkzaamheden, de daaraan verbonden gevaren en de wijze waarop deze gevaren zoveel mogelijk voorkomen of
      beperkt zullen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0003892
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel34
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0003892
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '34'
  - number: 4.8.2
    text: |-
      Demolitie- en onderhoudswerkzaamheden als bedoeld in het eerste lid worden verricht door of onder voortdurend
      toezicht van een persoon die in het bezit is van een certificaat van vakbekwaamheid springmeester met betrekking
      tot de soort arbeid die wordt verricht dat is afgegeven door Onze Minister of een certificerende instelling.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.8
  - number: 4.8.3
    text: |-
      Werkzaamheden bestaande uit het springen van materialen ten behoeve van de opsporing of winning van delfstoffen
      als bedoeld in het eerste lid worden verricht door personen die in het bezit zijn van een getuigschrift van
      schietmeester dat is afgegeven door Onze Minister of een door Onze Minister daartoe aangewezen instelling.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.8
  - number: 4.8.4
    text: |-
      Het springplan of programma, bedoeld in het eerste lid, het certificaat van vakbekwaamheid springmeester,
      bedoeld in het tweede lid, dan wel het getuigschrift van schietmeester, bedoeld in het derde lid of een afschrift
      daarvan zijn op de arbeidsplaats beschikbaar en worden desgevraagd getoond aan de ambtenaren, bedoeld in
      [artikel 24 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 4.8.5
    text: |-
      Ten aanzien van de werkzaamheden, bedoeld in het eerste lid, worden bij ministeriële regeling nadere regels
      gesteld.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.8
  - number: 4.8a.1
    text: |-
      Arbeid waarbij professioneel vuurwerk als bedoeld in [artikel 1.1.1, eerste lid, van het Vuurwerkbesluit][ref1]
      tot ontbranding wordt gebracht, ten behoeve daarvan ter plaatse wordt opgebouwd, geïnstalleerd, gemonteerd,
      geassembleerd, dan wel na ontbranding verwijderd, wordt verricht volgens een vooraf opgesteld werkplan, dat een
      deugdelijke beschrijving bevat van de uit te voeren werkzaamheden, de daaraan verbonden gevaren en de wijze waarop
      deze gevaren zoveel mogelijk voorkomen of beperkt zullen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.8a
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
  - number: 4.8a.2
    text: |-
      De arbeid, bedoeld in het eerste lid, alsmede arbeid bestaande uit het bewerken van professioneel vuurwerk in een
      inrichting als bedoeld in [artikel 3.2.1 van het Vuurwerkbesluit][ref1], wordt verricht door of onder voortdurend
      toezicht van een persoon, die in het bezit is van een certificaat van vakbekwaamheid professioneel vuurwerk dat is
      afgegeven door Onze Minister of een certificerende instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.8a
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '3'
  - number: 4.8a.3
    text: |-
      Het in het eerste onderscheidenlijk tweede lid bedoelde werkplan en certificaat van vakbekwaamheid of een
      afschrift daarvan zijn op de arbeidsplaats aanwezig en worden desgevraagd getoond aan een ambtenaar als bedoeld in
      [artikel 24 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.8a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 4.8a.4
    text: |-
      Ten aanzien van de in het eerste en tweede lid bedoelde arbeid en het in het eerste lid bedoelde werkplan worden
      bij ministeriële regeling nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.8a
  - number: 4.8b.1
    text: |-
      Bij ministeriële regeling worden met betrekking tot in die regeling aangewezen gevaarlijke stoffen waarden voor
      beroepsmatige blootstelling vastgesteld betreffende de grens, waarboven de concentratie of gemiddelde concentratie
      van die stoffen in de lucht op de arbeidsplaats waaraan werknemers in verband met de arbeid worden blootgesteld,
      niet uitgaat.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.8b
  - number: 4.8b.2
    text: |-
      Bij ministeriële regeling worden met betrekking tot in die regeling aangewezen stoffen biologische waarden
      vastgesteld betreffende de grens, waarboven de concentratie van die stoffen in het betreffende biologische medium
      waaraan werknemers in verband met de arbeid worden blootgesteld, niet uitgaat.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.8b
  - number: 4.8b.3
    text: |-
      Bij overschrijding van een waarde als bedoeld in het eerste of tweede lid, worden, met inachtneming van
      [artikel 4.9][ref1], onverwijld doeltreffende maatregelen genomen om de concentratie terug te brengen tot beneden
      die waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.8b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
        afdeling: '1'
  - number: 4.8b.4
    text: |-
      Zolang de maatregelen, bedoeld in het derde lid, nog niet volledig ten uitvoer zijn gelegd of niet tot een
      doeltreffende bescherming leiden, wordt de arbeid alleen voortgezet, indien doeltreffende maatregelen zijn genomen
      om schade aan de gezondheid van de werknemers te voorkomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.8b
  - number: 4.9.1
    text: |-
      Voor zover uit de resultaten van de beoordeling, bedoeld in [artikel 4.2][ref1], blijkt dat er gevaar voor
      de veiligheid of de gezondheid van de werknemers bestaat dan wel dat er sprake is van hinder voor deze, zijn
      doeltreffende maatregelen genomen om te voorkomen dat de werknemers bij hun arbeid kunnen worden blootgesteld aan
      gevaarlijke stoffen in zodanige mate, dat hun veiligheid in gevaar kan worden gebracht, of dat schade kan worden
      toegebracht aan hun gezondheid of aan de werknemers hinder kan worden veroorzaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '1'
  - number: 4.9.2
    text: |-
      Ter naleving van het eerste lid zijn zodanige technische of organisatorische maatregelen genomen, dat het gevaar
      voor blootstelling zoveel mogelijk bij de bron daarvan wordt voorkomen of teruggebracht tot een niveau waarop geen
      schade aan de gezondheid kan optreden of waarbij aan de werknemers zo weinig mogelijk hinder wordt veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.9
  - number: 4.9.3
    text: |-
      Voor zover dit redelijkerwijs mogelijk is worden bij de toepassing van het tweede lid gevaarlijke stoffen
      vervangen door stoffen waarbij de werknemers, gelet op de eigenschappen van die stoffen, de aard van de arbeid, de
      werkmethoden en de werkomstandigheden, niet of minder gevaar voor hun veiligheid of gezondheid worden blootgesteld
      of waarbij aan de werknemers zo weinig mogelijk hinder wordt veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.9
  - number: 4.9.4
    text: |-
      Voor zover het op doeltreffende wijze voorkomen van blootstelling door het nemen van de maatregel, bedoeld in
      het derde lid, redelijkerwijs niet mogelijk is, vindt voor de toepassing van het tweede lid, voor zover dit
      redelijkerwijs mogelijk is, de productie en het gebruik van gevaarlijke stoffen plaats in een gesloten systeem.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.9
  - number: 4.9.5
    text: |-
      Voor zover het op doeltreffende wijze voorkomen van blootstelling door het nemen van maatregelen als bedoeld in
      het derde of vierde lid redelijkerwijs niet mogelijk is en de blootstelling wordt veroorzaakt doordat de lucht
      op plaatsen, waar werknemers in verband met de arbeid verblijven, wordt verontreinigd door die stoffen, wordt de
      verontreinigde lucht op doeltreffende wijze afgevoerd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.9
  - number: 4.9.6
    text: |-
      Voor zover het op doeltreffende wijze voorkomen van blootstelling door het nemen van maatregelen als bedoeld in het
      tweede lid redelijkerwijs niet mogelijk is en de blootstelling op andere wijze dan in het vijfde lid bedoeld wordt
      veroorzaakt, worden in aanvulling op de maatregelen, bedoeld in artikel 4.3a, maatregelen genomen om blootstelling
      van werknemers te beperken tot een zo laag mogelijk niveau als redelijkerwijs uitvoerbaar is door zoveel mogelijk
      mens en bron te scheiden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.9
  - number: 4.9.7
    text: |-
      Voor zover het op doeltreffende wijze afvoeren van de verontreinigde lucht, bedoeld in het vijfde lid, in verband
      met de aard van de arbeid of met de werkomstandigheden redelijkerwijs niet mogelijk is, worden de maatregelen,
      bedoeld in het zesde lid, genomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.9
  - number: 4.9.8
    text: |-
      Indien het redelijkerwijs niet mogelijk is om de blootstelling van werknemers te voorkomen of te beperken tot een
      voldoende laag niveau door middel van de in het zesde of zevende lid bedoelde maatregelen, worden aan de werknemers
      die worden of kunnen worden blootgesteld, persoonlijke beschermingsmiddelen ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.9
  - number: 4.9.9
    text: |-
      Indien de werkzaamheden worden verricht met gebruik van persoonlijke beschermingsmiddelen overeenkomstig het
      achtste lid, mag dit niet blijvend op deze wijze geschieden en wordt de duur van het dragen daarvan voor ieder van
      deze werknemers tot het strikt noodzakelijke beperkt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.9
  - number: 4.10.1
    text: |-
      Indien op grond van [artikel 4.9, vijfde lid][ref1], verontreinigde lucht wordt afgevoerd, is gelijktijdig
      voldoende toevoer van niet-verontreinigde lucht gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
        afdeling: '1'
  - number: 4.10.2
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het eerste lid. Deze regels kunnen onder meer
      betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.10
  - number: 4.10.2.a
    text: de kwaliteit van de lucht die wordt toegevoerd;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.10
  - number: 4.10.2.b
    text: |-
      de luchtcirculatie- of luchtverversingssystemen dan wel luchtreinigingsapparatuur die voor de toevoer van niet-
      verontreinigde lucht worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.10
  - number: 4.10.2.c
    text: de controle en het onderhoud van de onder *b* bedoelde systemen of apparatuur.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.10
  - number: 4.10.3
    text: |-
      Bij ministeriële regeling worden in het belang van de veiligheid of gezondheid gevallen aangewezen waarin het
      recirculeren van lucht is verboden of slechts is toegestaan met inachtneming van de bij die regeling te stellen
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.10
  - number: 4.10a.1
    text: |-
      Iedere werknemer die voor de eerste keer wordt belast met werkzaamheden die blijkens de beoordeling, bedoeld
      in [artikel 4.2][ref1], gevaren kunnen opleveren voor de veiligheid of gezondheid, wordt, in aanvulling
      op [artikel 18 van de wet][ref2], in de gelegenheid gesteld om vóór de aanvang van die werkzaamheden een
      arbeidsgezondheidskundig onderzoek te ondergaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel18
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.10a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '18'
  - number: 4.10a.2
    text: |-
      Indien bij een werknemer een aandoening wordt geconstateerd die het gevolg zou kunnen zijn van blootstelling aan
      gevaarlijke stoffen, worden werknemers, die op soortgelijke wijze zijn blootgesteld, tussentijds in de gelegenheid
      gesteld een arbeidsgezondheidskundig onderzoek te ondergaan.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.10a
  - number: 4.10a.3
    text: |-
      Op verzoek van de werkgever of de betrokken werknemer wordt het arbeidsgezondheidskundig onderzoek opnieuw
      uitgevoerd. De resultaten van het hernieuwde onderzoek treden in de plaats van het daaraan voorafgaande.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.10a
  - number: 4.10a.4
    text: |-
      Een werknemer als bedoeld in het eerste lid wordt geïnformeerd over de wijze waarop hij na beëindiging van de
      blootstelling in de gelegenheid wordt gesteld een arbeidsgezondheidskundig onderzoek te ondergaan.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.10a
  - number: 4.10b.1
    text: |-
      Iedere werknemer die wordt of kan worden blootgesteld aan gevaarlijke stoffen waarvoor een biologische grenswaarde
      als bedoeld in [artikel 4.8b, tweede lid][ref1], is vastgesteld, wordt in de gelegenheid gesteld om een
      arbeidsgezondheidskundig onderzoek te ondergaan:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.10b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
        afdeling: '1'
  - number: 4.10b.1.a
    text: vóór de aanvang van de blootstelling;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.10b
  - number: 4.10b.1.b
    text: bij het overschrijden van bij ministeriële regeling vastgestelde concentratiewaarden;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.10b
  - number: 4.10b.1.c
    text: in een bij ministeriële regeling vastgestelde frequentie van onderzoek.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.10b
  - number: 4.10b.2
    text: |-
      Het onderzoek als bedoeld in het eerste lid omvat onder meer een onderzoek naar het gehalte van de betreffende
      stof in het bij de biologische grenswaarde, bedoeld in [artikel 4.8b, tweede lid][ref1], vastgestelde biologische
      medium.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.10b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
        afdeling: '1'
  - number: 4.10b.3
    text: |-
      Bij ministeriële regeling kan worden bepaald dat het onderzoek als bedoeld in het tweede lid, in de in deze
      regeling bepaalde gevallen wordt vervangen door een meting van andere biologische indicatoren.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.10b
  - number: 4.10b.4
    text: |-
      Bij ministeriële regeling worden de methoden vastgesteld, volgens welke het gehalte van de desbetreffende stof,
      bedoeld in het tweede lid, wordt gemeten.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.10b
  - number: 4.10c.1
    text: |-
      De arbeidsgezondheidskundige onderzoeken, bedoeld in de [artikelen 4.10a][ref1] en [4.10b][ref2], vinden plaats
      met inachtneming van de praktische aanbevelingen, die op grond van artikel 12, tweede lid en bijlage II bij de
      [richtlijn 98/24/EG](31998L0024) van de Raad van de Europese Unie van 7 april 1998 (PbEG 1998, L 131) betreffende
      de bescherming van de gezondheid en de veiligheid van werknemers tegen risico's van chemische agentia op het werk
      (veertiende bijzondere richtlijn in de zin van artikel 16, lid 1, van [Richtlijn 89/391/EEG](31989L0391)), worden
      opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.10c
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
        afdeling: '1'
  - number: 4.10c.2
    text: |-
      Aan de deskundige persoon, bedoeld in [artikel 2.14a, tweede lid][ref1], of de arbodienst worden alle gegevens
      ter beschikking gesteld die nodig zijn om de blootstelling van de werknemers aan gevaarlijke stoffen te kunnen
      beoordelen en te kunnen adviseren over de periodiciteit en inhoud van de arbeidsgezondheidskundige onderzoeken,
      bedoeld in het eerste lid, de te nemen preventieve maatregelen of persoonlijke beschermende maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.10c
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '3'
  - number: 4.10d.1
    text: |-
      De deskundige persoon, bedoeld in [artikel 2.14a, tweede lid][ref1], of de arbodienst houdt van iedere werknemer
      die een arbeidsgezondheidskundig onderzoek als bedoeld in de [artikelen 4.10a][ref2] en [4.10b][ref3] heeft
      ondergaan, een persoonlijk medisch dossier bij.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.10d
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
        afdeling: '1'
  - number: 4.10d.2
    text: Iedere werknemer heeft recht op inzage in het hem betreffende medisch dossier.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.10d
  - number: 4.10d.3
    text: |-
      De resultaten van het arbeidsgezondheidskundig onderzoek worden, voorzien van een toelichting, in statistische,
      niet tot individuen herleidbare vorm ter kennis gebracht van de ondernemingsraad of de personeels-
      vertegenwoordiging of, bij het ontbreken daarvan, van de belanghebbende werknemers.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.10d
  - number: 4.10d.4
    text: |-
      De resultaten van het arbeidsgezondheidskundig onderzoek worden in passende vorm geregistreerd en voor iedere
      werknemer tot ten minste 40 jaar na beëindiging van diens blootstelling aan gevaarlijke stoffen bewaard, evenals
      de lijst van werknemers, bedoeld in [artikel 4.15][ref1], en het register van blootgestelde werknemers, bedoeld in
      [artikel 4.53, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.10d
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
        afdeling: '5'
  - number: 4.10d.5
    text: |-
      In geval de werkzaamheden in het bedrijf of de inrichting van de werkgever gedurende de termijn van 40 jaar,
      bedoeld in het vierde lid, worden gestaakt, worden de in het vierde lid bedoelde documenten overgedragen aan een
      daartoe aangewezen ambtenaar als bedoeld in [artikel 24, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.10d
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 4.10e.1
    text: |-
      Aan werknemers die arbeid verrichten waarbij gevaar bestaat voor blootstelling aan gevaarlijke stoffen wordt
      voorlichting en onderricht gegeven, waarbij ten minste aandacht wordt besteed aan:
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.10e
  - number: 4.10e.1.a
    text: |-
      de mogelijke gevaren voor de gezondheid die zijn verbonden aan het werken met gevaarlijke stoffen op grond van de
      resultaten van de beoordeling, bedoeld in [artikel 4.2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.10e
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '1'
  - number: 4.10e.1.b
    text: |-
      de aard van de blootstelling, bedoeld in [artikel 4.2, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.10e
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '1'
  - number: 4.10e.1.c
    text: |-
      de grenswaarden en de maatregelen bij overschrijding van deze waarden als bedoeld in de [artikelen 4.8b][ref1],
      [4.16][ref2] en [4.46][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.10e
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '5'
  - number: 4.10e.1.d
    text: de te treffen voorzorgsmaatregelen om blootstelling te voorkomen of te beperken;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.10e
  - number: 4.10e.1.e
    text: |-
      de te treffen voorzorgsmaatregelen om zoveel mogelijk te voorkomen dat zich met betrekking tot gevaarlijke stoffen
      een ongewilde gebeurtenis voordoet;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.10e
  - number: 4.10e.1.f
    text: de hygiënische maatregelen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.10e
  - number: 4.10e.1.g
    text: het dragen en gebruiken van persoonlijke beschermingsmiddelen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.10e
  - number: 4.10e.1.h
    text: de te nemen maatregelen in geval zich een ongewilde gebeurtenis voordoet met gevaarlijke stoffen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.10e
  - number: 4.10e.2
    text: |-
      De werknemers kunnen kennis nemen van de informatie over de veiligheid en gezondheid die door de leverancier van
      een gevaarlijke stof wordt verstrekt, waaronder begrepen de verplichte informatie die bij of krachtens wettelijk
      voorschrift wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.10e
  - number: 4.10e.3
    text: |-
      De wijze van voorlichting en onderricht is afgestemd op de resultaten van de beoordeling, bedoeld in
      [artikel 4.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.10e
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '1'
  - number: 4.10e.4
    text: De voorlichting en het onderricht worden geactualiseerd indien gewijzigde omstandigheden hiertoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.10e
  - number: '4.11'
    text: 'In deze afdeling en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.11
  - number: 4.11.a
    text: |-
      richtlijn: [Richtlijn nr. 2004/37/EG](32004L0037) van het Europees Parlement en de Raad van 29 april 2004
      betreffende de bescherming van de werknemers tegen de risico’s van blootstelling aan carcinogene of mutagene
      agentia op het werk (zesde bijzondere richtlijn in de zin van artikel 16, lid 1, van [Richtlijn 89/391/EEG]
      (31989L0391) van de Raad)(gecodificeerde versie) (Pb EU L 158);
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.11
  - number: 4.11.b
    text: 'kankerverwekkende stof:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.11
  - number: 4.11.b.1°
    text: |-
      een enkelvoudige stof die moet worden geclassificeerd als een categorie 1 of 2 carcinogeen volgens de criteria van
      bijlage VI bij [Richtlijn nr. 67/548/EEG](31967L0548) van de Raad van de Europese Gemeenschappen van 27 juni 1967
      betreffende de onderlinge aanpassing van de wettelijke en bestuursrechtelijke bepalingen inzake de indeling, de
      verpakking en het kenmerken van gevaarlijke stoffen (*PbEG* 196), alsmede een stof als bedoeld in bijlage I bij
      de richtlijn;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.11
  - number: 4.11.b.2°
    text: |-
      een meervoudige stof die bestaat uit een of meer stoffen als bedoeld onder 1°, waarbij de concentratiegrens is
      vastgesteld in bijlage I bij [Richtlijn nr. 67/548/EEG](31967L0548) van de Raad van de Europese Gemeenschappen van
      27 juni 1967 betreffende de onderlinge aanpassing van de wettelijke en bestuursrechtelijke bepalingen inzake de
      indeling, de verpakking en het kenmerken van gevaarlijke stoffen (*PbEG* 196) en, voor zover het een stof betreft
      die in laatstbedoelde bijlage niet is opgenomen of zonder concentratiegrens is opgenomen, een stof waarbij de
      concentratiegrens is vastgesteld in bijlage II, deel B, bij [richtlijn nr. 1999/45/EG](31999L0045) van het Europees
      Parlement en de Raad van de Europese Unie van 31 mei 1999 betreffende de onderlinge aanpassing van de wettelijke en
      bestuursrechtelijke bepalingen van de lidstaten inzake de indeling, de verpakking en het kenmerken van gevaarlijke
      preparaten (*PbEG* L 200) alsmede een meervoudige stof als bedoeld in bijlage I bij de richtlijn;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.11
  - number: 4.11.c
    text: |-
      kankerverwekkend proces: een proces als bedoeld in bijlage I bij de richtlijn alsmede een stof die vrijkomt bij een
      proces als bedoeld in bijlage I bij de richtlijn;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.11
  - number: 4.11.d
    text: |-
      mutagene stof: - een enkelvoudige stof die moet worden geclassificeerd als een categorie 1 of2 mutageen volgens
      de criteria van bijlage VI bij [richtlijn nr. 67/548/EEG](31967L0548) van de Raad van de Europese Economische
      Gemeenschap van 27 juni 1967 betreffende de onderlinge aanpassing van de wettelijke en bestuursrechtelijke
      bepalingen inzake de indeling, de verpakking en het kenmerken van gevaarlijke stoffen (PbEG L 196);
        - een meervoudige stof die bestaat uit een of meer stoffen als bedoeld onder 1°, waarbij de concentratiegrens
      is vastgesteld in bijlage I bij [richtlijn nr. 67/548/EEG](31967L0548) van de Raad van de Europese Economische
      Gemeenschap van 27 juni 1967 betreffende de onderlinge aanpassing van de wettelijke en bestuursrechtelijke
      bepalingen inzake de indeling, de verpakking en het kenmerken van gevaarlijke stoffen (PbEG L 196) en, voor zover
      het een stof betreft die in laatstbedoelde bijlage niet is opgenomen of zonder concentratiegrens is opgenomen, een
      stof waarbij de concentratiegrens is vastgesteld in bijlage II, deel B, bij [richtlijn nr. 1999/45/EG](31999L0045)
      van het Europees Parlement en de Raad van de Europese Unie van 31 mei 1999 betreffende de onderlinge aanpassing van
      de wettelijke en bestuursrechtelijke bepalingen van de lidstaten inzake de indeling, de verpakking en het kenmerken
      van gevaarlijke preparaten (PbEG L 200);
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.11
  - number: 4.11.e
    text: |-
      gevarenzone: plaats binnen een bedrijf of inrichting waar gevaar bestaat voor de gezondheid of veiligheid van
      werknemers als gevolg van blootstelling of de mogelijkheid van blootstelling aan kankerverwekkende stoffen en
      processen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.11
  - number: '4.12'
    text: |-
      Indien arbeid wordt verricht waarbij werknemers worden of kunnen worden blootgesteld aan kankerverwekkende of
      mutagene stoffen of kankerverwekkende processen, is naast [afdeling 1 van dit hoofdstuk][ref1], met inachtneming
      van [artikel 4.1a, eerste lid][ref2], tevens deze afdeling van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '4'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
  - number: '4.13'
    text: |-
      Indien arbeid wordt verricht waarbij werknemers als gevolg van hun werk worden of kunnen worden blootgesteld aan
      kankerverwekkende of mutagene stoffen of kankerverwekkende processen, worden met betrekking tot deze stoffen of
      processen die, gelet op de aard van de bedrijvigheid, met enige regelmaat aanwezig zijn of worden toegepast, in de
      risico-inventarisatie en -evaluatie, bedoeld in [artikel 5 van de wet][ref1], in ieder geval de volgende gegevens
      opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
  - number: 4.13.a
    text: 'met betrekking tot de identiteit:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.13
  - number: 4.13.a.1°
    text: |-
      in geval van een enkelvoudige stof: de chemische naam of namen dan wel het CAS-nummer of het nummer waaronder de
      stof is opgenomen in de lijst van stoffen, bedoeld in bijlage I bij [Richtlijn nr. 67/548/EEG](31967L0548) van
      de Raad van de Europese Gemeenschappen van 27 juni 1967 betreffende de onderlinge aanpassing van de wettelijke en
      bestuursrechtelijke bepalingen inzake de indeling, de verpakking en het kenmerken van gevaarlijke stoffen (*PbEG*
      196);
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.13
  - number: 4.13.a.2°
    text: |-
      in geval van een meervoudige stof: de handelsnaam of namen alsmede de chemische naam of namen en de
      gewichtspercentages van de component die aanleiding geeft tot indeling van de stof in de categorie carcinogeen of
      de categorie mutageen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.13
  - number: 4.13.a.3°
    text: 'in geval van een proces: de beschrijving van het proces en de chemische naam van de stoffen die daarbij vrijkomen;'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.13
  - number: 4.13.b
    text: |-
      de reden waarom het gebruik van een kankerverwekkende stof of het toepassen van een kankerverwekkend proces voor
      het verrichten van de arbeid strikt noodzakelijk is en vervanging technisch niet uitvoerbaar is;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.13
  - number: 4.13.c
    text: |-
      een aanduiding van de organisatorische eenheid of eenheden binnen het bedrijf of de inrichting waar een
      kankerverwekkende of mutagene stof pleegt voor te komen of een kankerverwekkend proces pleegt te worden toegepast;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.13
  - number: 4.13.d
    text: de benaming van het gevaar of de gevaren van de kankerverwekkende of mutagene stof of het kankerverwekkende proces;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.13
  - number: 4.13.e
    text: |-
      de hoeveelheid van de kankerverwekkende of mutagene stof die per jaar pleegt te worden vervaardigd of gebruikt
      dan wel aanwezig pleegt te zijn in verband met de opslag respectievelijk de frequentie waarmee een proces per jaar
      pleegt te worden toegepast;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.13
  - number: 4.13.f
    text: |-
      de soort arbeid die met de kankerverwekkende of mutagene stof pleegt te worden verricht of waarbij het
      kankerverwekkende proces pleegt te worden toegepast;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.13
  - number: 4.13.g
    text: |-
      het aantal werknemers dat aan een kankerverwekkende of mutagene stof of een kankerverwekkend proces pleegt te
      worden blootgesteld of kan worden blootgesteld;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.13
  - number: 4.13.h
    text: |-
      de wijze waarop de onder *g* bedoelde werknemers aan een kankerverwekkende of mutagene stof of een kankerverwekkend
      proces plegen te worden blootgesteld of kunnen worden blootgesteld, en
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.13
  - number: 4.15.1
    text: |-
      Er wordt een lijst bijgehouden van werknemers die belast zijn met werkzaamheden die blijkens de beoordeling,
      bedoeld in [artikel 4.2][ref1], gevaar opleveren voor de veiligheid en de gezondheid, onder vermelding van de
      blootstelling die zij hebben ondergaan voor zover hierover gegevens beschikbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '1'
  - number: 4.15.2
    text: |-
      Iedere werknemer heeft recht op inzage in de gegevens die in de lijst, bedoeld in het eerste lid, met betrekking
      tot hem zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.15
  - number: 4.16.1
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de grenswaarden waarboven het
      blootstellingsniveau of het gemiddelde blootstellingsniveau van kankerverwekkende of mutagene stoffen en stoffen
      die vrijkomen bij kankerverwekkende processen niet mag uitgaan.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.16
  - number: 4.16.2
    text: |-
      Bij overschrijding van een waarde als bedoeld in het eerste lid worden, met inachtneming van de
      [artikelen 4.17][ref1] en [4.18][ref2], onverwijld doeltreffende maatregelen genomen om die concentratie terug te
      brengen tot beneden die waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '2'
  - number: 4.16.3
    text: |-
      Zolang de maatregelen, bedoeld in het tweede lid, nog niet volledig ten uitvoer zijn gelegd of niet tot een
      doeltreffende bescherming leiden, mag de arbeid alleen worden voortgezet, indien doeltreffende maatregelen zijn
      genomen om schade aan de gezondheid van werknemers te voorkomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.16
  - number: '4.17'
    text: |-
      Zodanige technische en organisatorische maatregelen zijn genomen dat het gevaar van blootstelling van werknemers
      aan kankerverwekkende of mutagene stoffen en kankerverwekkende processen zoveel mogelijk bij de bron daarvan wordt
      voorkomen, met name door kankerverwekkende of mutagene stoffen en kankerverwekkende processen, voor zover dit
      technisch uitvoerbaar is, te vervangen door stoffen of processen waarbij de werknemers, gelet op de eigenschappen
      van die stoffen of processen, de aard van de arbeid, de werkmethoden en de werkomstandigheden, niet of minder aan
      gevaar voor hun veiligheid of gezondheid worden blootgesteld.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.17
  - number: 4.18.1
    text: |-
      Voor zover uit de resultaten van de in [artikel 4.2, eerste lid][ref1], bedoelde beoordeling blijkt dat er gevaar
      voor de gezondheid van de werknemers bestaat en dat het op doeltreffende wijze voorkomen van blootstelling door
      het nemen van maatregelen als bedoeld in [artikel 4.17][ref2] technisch niet uitvoerbaar is, wordt het gevaar
      van blootstelling, voor zover dit technisch uitvoerbaar is, bij de bron daarvan voorkomen of teruggebracht tot
      een niveau waarop geen schade aan de gezondheid kan optreden, met name door de productie en het gebruik van
      kankerverwekkende of mutagene stoffen of kankerverwekkende processen plaats te doen vinden in een gesloten systeem.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.18
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '2'
  - number: 4.18.2
    text: |-
      Indien het voorkomen van blootstelling of het terugbrengen van blootstelling tot een niveau waarop geen schade aan
      de gezondheid kan optreden als bedoeld in het eerste lid technisch niet uitvoerbaar is, worden kankerverwekkende of
      mutagene stoffen op doeltreffende wijze aan de bron verwijderd, onder meer door plaatselijke afvoer van de lucht,
      zo nodig aangevuld door algemene ventilatie, waarbij gelijktijdig voldoende toevoer van niet-verontreinigde lucht
      is gewaarborgd zonder dat hierbij gevaar ontstaat voor de volksgezondheid en het milieu.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.18
  - number: 4.18.3
    text: |-
      Indien de in het tweede lid bedoelde maatregelen technisch niet uitvoerbaar zijn, worden maatregelen genomen om
      blootstelling van werknemers te beperken tot een zo laag mogelijk niveau als technisch uitvoerbaar is door zoveel
      mogelijk mens en bron te scheiden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.18
  - number: 4.18.4
    text: |-
      Indien het technisch niet uitvoerbaar is om de blootstelling van werknemers te voorkomen of te beperken tot een
      voldoende laag niveau door middel van de in het derde lid bedoelde maatregelen, worden aan de werknemers die worden
      of kunnen worden blootgesteld, persoonlijke beschermingsmiddelen ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.18
  - number: 4.18.5
    text: |-
      Indien de werkzaamheden worden verricht met gebruik van persoonlijke beschermingsmiddelen overeenkomstig het vierde
      lid, mag dit niet blijvend op deze wijze geschieden en wordt de duur van het dragen daarvan voor ieder van deze
      werknemers tot het strikt noodzakelijke beperkt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.18
  - number: '4.19'
    text: |-
      In alle gevallen waarin arbeid wordt verricht waarbij werknemers als gevolg van hun werk kunnen worden blootgesteld
      aan kankerverwekkende of mutagene stoffen of kankerverwekkende processen, worden de volgende maatregelen genomen om
      blootstelling van werknemers te voorkomen of te beperken tot een zo laag mogelijk niveau:
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.19
  - number: 4.19.a
    text: |-
      de werknemers die worden of kunnen worden blootgesteld zijn voldoende vertrouwd met de aard van hun werkzaamheden
      en hebben voldoende kennis van de gevaren die aan de blootstelling zijn verbonden en van de voorzieningen die
      getroffen zijn of door hen moeten worden getroffen om die gevaren te voorkomen of te beperken;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.19
  - number: 4.19.b
    text: |-
      voorkomen wordt dat gevarenzones worden betreden door anderen dan de werknemers of andere personen die de zones in
      verband met hun arbeid moeten betreden;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.19
  - number: 4.19.c
    text: |-
      gevarenzones worden gemarkeerd door middel van waarschuwings- en veiligheidssignalen die voldoen aan het bij of
      krachtens [afdeling 2 van hoofdstuk 8][ref1] bepaalde;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.19
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '8'
        afdeling: '2'
  - number: 4.19.d
    text: |-
      gebruik wordt gemaakt van doeltreffende middelen voor veilig opslaan, hanteren en vervoeren van kankerverwekkende
      of mutagene stoffen door gebruik van hermetisch gesloten en duidelijk zichtbaar gekenmerkte houders, en
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.19
  - number: 4.19.e
    text: |-
      gebruik wordt gemaakt van doeltreffende middelen voor het veilig verzamelen, opslaan en verwijderen van
      afvalstoffen, met inbegrip van het gebruik van hermetisch gesloten en duidelijk zichtbaar gekenmerkte houders.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.19
  - number: 4.20.1
    text: Zones zijn ingericht waar de werknemers zonder gevaar voor blootstelling kunnen eten en drinken.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.20
  - number: 4.20.2
    text: |-
      Indien kans op blootstelling bestaat wordt aan werknemers werkkleding ter beschikking gesteld die voldoet aan
      [afdeling 1 van hoofdstuk 8][ref1] en die door de werknemers bij de arbeid steeds wordt gedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '8'
        afdeling: '1'
  - number: 4.20.3
    text: |-
      In aanvulling op [artikel 3.22][ref1] wordt de werkkleding op een andere plaats opgeborgen dan de overige kleding.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: '1'
  - number: 4.20.4
    text: |-
      In aanvulling op [artikel 3.23][ref1] zijn voor de werknemers doelmatige wasgelegenheden en doucheruimten
      beschikbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: '1'
  - number: 4.20.5
    text: |-
      Persoonlijke beschermingsmiddelen worden volgens instructie op de daartoe aangewezen plaats bewaard en na ieder
      gebruik gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.20
  - number: 4.23.1
    text: |-
      Het arbeidsgezondheidskundig onderzoek, bedoeld in [artikel 4.10a][ref1], vindt plaats met inachtneming van de
      praktische aanbevelingen, opgenomen in bijlage II bij de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.23
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
        afdeling: '1'
  - number: 4.23.2
    text: |-
      De deskundige persoon, bedoeld in [artikel 2.14a, tweede lid][ref1], of de arbodienst heeft recht op inzage
      in de in [artikel 4.15][ref2] bedoelde lijst van blootgestelde werknemers. Hem staan voorts alle gegevens ter
      beschikking die hij nodig heeft om de blootstelling van de werknemers aan kankerverwekkende of mutagene stoffen
      en kankerverwekkende processen te kunnen beoordelen en te kunnen adviseren over de periodiciteit en inhoud van het
      arbeidsgezondheidskundig onderzoek, bedoeld in het eerste lid, de te nemen preventieve maatregelen of persoonlijke
      beschermende maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.23
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '2'
  - number: 4.36.1
    text: |-
      Het gebruik van benzeen of van een product waarvan het gehalte aan benzeen meer dan 1 volume-procent bedraagt als
      oplos-, reinigings- of verdunningsmiddel is niet toegestaan, tenzij zulks geschiedt in een gesloten systeem of op
      een andere wijze waardoor in ten minste gelijke mate bescherming tegen blootstelling daaraan wordt geboden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.36
  - number: 4.36.2
    text: |-
      Indien van benzeen of van een product als bedoeld in het eerste lid gebruik wordt gemaakt anders dan als oplos-,
      reinigings- of verdunningsmiddel, wordt dit zoveel mogelijk uitgevoerd in een gesloten systeem.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.36
  - number: 4.36.3
    text: |-
      Het eerste en het tweede lid zijn van overeenkomstige toepassing ten aanzien van tetrachloorkoolstof,
      pentachloorethaan en 1.1.2.2.-tetrachloorethaan alsmede ten aanzien van een product waarvan het gehalte aan een van
      de vorengenoemde stoffen meer dan 1 volume-procent bedraagt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.36
  - number: 4.36.4
    text: |-
      Voor zover het gebruik van benzeen, van tetrachloorkoolstof, pentachloorethaan en 1.1.2.2.-tetrachloorethaan op
      grond van dit artikel is toegestaan, is daarop, met inachtneming van [artikel 4.12, afdeling 2][ref1] van dit
      hoofdstuk van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.36
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: 4.37.1
    text: 'In deze afdeling en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.37
  - number: 4.37.1.a
    text: 'asbest: stoffen die een of meer van de volgende vezelachtige silicaten bevatten:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.37
  - number: 4.37.1.a.1°
    text: actinoliet (Cas-nummer 77536–66–4);
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.37
  - number: 4.37.1.a.2°
    text: amosiet (Cas-nummer 12172–73–5);
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.37
  - number: 4.37.1.a.3°
    text: anthofylliet (Cas-nummer 77536–67–5);
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.37
  - number: 4.37.1.a.4°
    text: chrysotiel (Cas-nummer 12001–29–5);
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.37
  - number: 4.37.1.a.5°
    text: tremoliet (Cas-nummer 77536–68–6);
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.37
  - number: 4.37.1.b
    text: 'crocidoliet: stoffen die het vezelachtige silicaat crocidoliet (Cas-nummer 12001–28–4) bevatten;'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.37
  - number: 4.37.1.c
    text: 'asbesthoudende producten: producten die een of meer van de onder *a* genoemde vezelachtige silicaten bevatten;'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.37
  - number: 4.37.1.d
    text: 'crocidoliethoudende producten: producten die het onder *b* genoemde vezelachtige silicaat bevatten;'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.37
  - number: 4.37.1.e
    text: |-
      vezel: een deeltje dat langer is dan 5 micrometer, een breedte heeft van minder dan 3 micrometer en een lengte/
      breedteverhouding van meer dan 3/1.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.37
  - number: 4.37.2
    text: |-
      Stoffen of producten die zowel een of meer van de vezelachtige silicaten, bedoeld in het eerste lid, onder *a*,
      als het vezelachtige silicaat, bedoeld in het eerste lid, onder *b*, bevatten, worden voor de toepassing van dit
      besluit aangemerkt als crocidoliet respectievelijk als crocidoliethoudende producten.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.37
  - number: 4.37a
    text: |-
      Indien arbeid wordt verricht waarbij werknemers worden of kunnen worden blootgesteld aan asbest of asbesthoudende
      producten, crocidoliet of crocidoliethoudende producten, zijn naast de [afdelingen 1][ref1] en [2][ref2] van dit
      hoofdstuk, met inachtneming van de [artikelen 4.37b][ref3] en [4.37c][ref4], tevens deze afdeling van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.37a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '4'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008498
        hoofdstuk: '4'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '5'
      - id: ref4
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '5'
  - number: 4.37b.1
    text: |-
      In afwijking van [artikel 4.15][ref1] wordt [artikel 4.53][ref2] toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.37b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
        afdeling: '5'
  - number: 4.37b.2
    text: |-
      In afwijking van [artikel 4.16][ref1] wordt [artikel 4.46][ref2] toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.37b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '5'
  - number: 4.37b.3
    text: |-
      In afwijking van [artikel 4.20, vijfde lid][ref1], wordt [artikel 4.51, derde lid][ref2], toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.37b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
        afdeling: '5'
  - number: 4.37c.1
    text: |-
      Deze afdeling is van toepassing op handelingen met betrekking tot asbest of asbesthoudende producten dan wel
      crocidoliet of crocidoliethoudende producten indien de concentratie asbest of crocidoliet hoger is dan honderd
      milligram per kilogram droge stof als bedoeld in [artikel 2, onderdeel b, van het Productenbesluit asbest][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017778#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.37c
    references:
      - id: ref1
        bwb_id: BWBR0017778
        artikel: '2'
  - number: 4.37c.2
    text: |-
      De [paragrafen 3][ref1], [4][ref2] en [7][ref3] van deze afdeling zijn van toepassing op handelingen:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.37c
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0008498
        hoofdstuk: '4'
        paragraaf: '4'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0008498
        hoofdstuk: '4'
        paragraaf: '7'
        afdeling: '5'
  - number: 4.37c.2.a
    text: |-
      als bedoeld in [artikel 5 van het Productenbesluit asbest][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017778#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.37c
    references:
      - id: ref1
        bwb_id: BWBR0017778
        artikel: '5'
  - number: 4.37c.2.b
    text: |-
      met asbest of een asbesthoudend product dat wordt verwijderd in een inrichting als bedoeld in
      [artikel 1.1, vierde lid, van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.37c
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 4.37c.3
    text: |-
      Indien bij de handelingen, bedoeld in het tweede lid, crocidoliet of crocidoliethoudende producten zijn betrokken,
      is [paragraaf 6][ref1] van deze afdeling van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.37c
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '4'
        paragraaf: '6'
        afdeling: '5'
  - number: 4.37c.4
    text: |-
      Op het geheel of gedeeltelijk slopen van bouwwerken, met uitzondering van grondwerken, constructies,
      apparaten, installaties en transportmiddelen waarin asbest of asbesthoudende producten dan wel crocidoliet of
      crocidoliethoudende producten is respectievelijk zijn verwerkt en bij het verwijderen van voornoemde stoffen
      of producten hieruit zijn de [paragrafen 5][ref1] en [7][ref2] van deze afdeling van toepassing. Voorzover bij
      categorieën van werkzaamheden als bedoeld in de vorige volzin het blootstellingsniveau het actieniveau, bedoeld
      in [artikel 4.44][ref3], niet overschrijdt, kunnen bij ministeriële regeling die categorieën worden aangewezen als
      werkzaamheden waarop een of meer bepalingen van [paragraaf 5][ref4] niet van toepassing zijn, indien wordt voldaan
      aan de bij die regeling gestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.37c
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '4'
        paragraaf: '5'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0008498
        hoofdstuk: '4'
        paragraaf: '7'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '5'
      - id: ref4
        bwb_id: BWBR0008498
        hoofdstuk: '4'
        paragraaf: '5'
        afdeling: '5'
  - number: '4.44'
    text: |-
      De voorschriften van deze paragraaf zijn van toepassing, indien uit de beoordeling, bedoeld in
      [artikel 4.2, eerste lid][ref1], blijkt dat de concentratie van asbeststof in de lucht, waaraan werknemers in
      verband met de arbeid worden blootgesteld, lager is dan een van de volgende actieniveaus:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.44
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '1'
  - number: 4.44.a
    text: 0,10 vezel per kubieke centimeter, berekend of gemeten over een referentieperiode van acht uur;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.44
  - number: 4.44.b
    text: |-
      een gecumuleerde dosis van 6,00 vezeldagen per kubieke centimeter, berekend of gemeten over een periode van drie
      maanden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.44
  - number: 4.45.1
    text: De concentratie van asbeststof in de lucht wordt zo laag mogelijk gehouden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.45
  - number: 4.45.2
    text: 'Ter naleving van het eerste lid worden de volgende maatregelen genomen:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.45
  - number: 4.45.2.a
    text: |-
      gebouwen, installaties en uitrustingen die dienen voor het toepassen of het bewerken van asbest of van
      asbesthoudende producten worden zoveel mogelijk vrij van stof gehouden;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.45
  - number: 4.45.2.b
    text: asbest als grondstof wordt opgeborgen en vervoerd in een daartoe geschikte en gesloten verpakking;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.45
  - number: 4.45.2.c
    text: |-
      afvalstoffen, ontstaan als gevolg van het toepassen of bewerken van asbest of van asbesthoudende producten, worden
      zo spoedig mogelijk verzameld en afgevoerd in een daartoe geschikte en gesloten verpakking, voorzien van een etiket
      met de duidelijke en goed leesbare vermelding dat de inhoud daarvan asbest bevat;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.45
  - number: 4.45.2.d
    text: |-
      bij het uitvoeren van reparatie- of onderhoudswerkzaamheden worden geen elektrisch of pneumatisch aangedreven
      verspanende werktuigen met een toerental hoger dan 100 omwentelingen per minuut of met een lineaire zaagsnelheid
      groter dan 25 meter per minuut gebruikt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.45
  - number: 4.45a.1
    text: |-
      Indien de handelingen, bedoeld in [artikel 5, onderdelen e en f, van het Productenbesluit asbest][ref1] betrekking
      hebben op asbesthoudende grond, worden deze werkzaamheden begeleid door een persoon die in het bezit is van een
      certificaat van vakbekwaamheid arbeidshygiëne of veiligheidskunde als bedoeld in [artikel 2.7, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017778#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.45a
    references:
      - id: ref1
        bwb_id: BWBR0017778
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '3'
  - number: 4.45a.2
    text: |-
      Indien de handelingen, bedoeld in het eerste lid, in de buitenlucht plaatsvinden, wordt na het beëindigen
      van deze handelingen een visuele inspectie uitgevoerd op de aanwezigheid van asbest teneinde vast te stellen
      dat de concentratie asbest niet hoger is dan honderd milligram per kilogram droge stof als bedoeld in
      [artikel 2, onderdeel b, van het Productenbesluit asbest][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017778#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.45a
    references:
      - id: ref1
        bwb_id: BWBR0017778
        artikel: '2'
  - number: 4.45a.3
    text: |-
      Indien de handelingen, bedoeld in het eerste lid, niet in de buitenlucht plaatsvinden, is
      [artikel 4.55, eerste lid, onder d][ref1], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.45a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
        afdeling: '5'
  - number: 4.45a.4
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de visuele inspectie, bedoeld in
      het tweede lid.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.45a
  - number: 4.46.1
    text: |-
      De concentratie van asbeststof in de lucht mag de grenswaarde van 0,30 vezel per kubieke centimeter, vastgesteld,
      berekend of gemeten over een referentieperiode van acht uur, niet overschrijden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.46
  - number: 4.46.2
    text: |-
      Bij overschrijding van de in het eerste lid genoemde grenswaarde worden zo spoedig mogelijk doeltreffende
      maatregelen genomen om de concentratie terug te brengen tot beneden die waarde.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.46
  - number: 4.46.3
    text: |-
      Nadat de in het tweede lid bedoelde maatregelen zijn genomen wordt de concentratie gemeten overeenkomstig
      [artikel 4.50, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.46
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
        afdeling: '5'
  - number: 4.46.4
    text: |-
      De ondernemingsraad of de personeelsvertegenwoordiging of, bij het ontbreken daarvan, de belanghebbende werknemers
      wordt de gelegenheid gegeven een oordeel over de in het tweede lid bedoelde maatregelen kenbaar te maken. Hen wordt
      vervolgens kennis gegeven van de resultaten van de metingen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.46
  - number: 4.46.5
    text: |-
      Zolang de in het tweede lid bedoelde maatregelen om de concentratie terug te brengen nog niet volledig ten uitvoer
      zijn gelegd of niet tot een doeltreffende bescherming leiden, mag de arbeid op de betreffende arbeidsplaats alleen
      worden voortgezet indien de betrokken werknemers doeltreffend zijn beschermd tegen blootstelling aan asbeststof.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.46
  - number: 4.47.1
    text: |-
      Indien, gelet op de aard van de werkzaamheden, overschrijding van de in [artikel 4.46, eerste lid][ref1], genoemde
      grenswaarde kan worden verwacht en technische maatregelen ter beperking van de blootstelling van de werknemers
      redelijkerwijs niet uitvoerbaar zijn, mag tot het verrichten van deze werkzaamheden slechts worden overgegaan,
      indien doeltreffende maatregelen zijn genomen ter bescherming van de betrokken werknemers.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.47
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '5'
  - number: 4.47.2
    text: |-
      De ondernemingsraad of de personeelsvertegenwoordiging of, bij het ontbreken daarvan, de belanghebbende werknemers
      wordt de gelegenheid gegeven een oordeel over de in het eerste lid bedoelde maatregelen kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.47
  - number: 4.47.3
    text: 'Tot de maatregelen, bedoeld in het eerste lid, behoren in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.47
  - number: 4.47.3.a
    text: |-
      het ter beschikking stellen van persoonlijke beschermingsmiddelen, waarbij de duur van het dragen daarvan tot het
      strikt noodzakelijke wordt beperkt;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.47
  - number: 4.47.3.b
    text: |-
      het aanbrengen van waarschuwingsborden die voldoen aan het bij of krachtens [afdeling 2 van hoofdstuk 8][ref1]
      bepaalde, ter aanduiding dat een overschrijding van de in [artikel 4.46, eerste lid][ref2], genoemde grenswaarde
      kan worden verwacht.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.47
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '8'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '5'
  - number: '4.48'
    text: |-
      Indien uit de beoordeling, bedoeld in [artikel 4.2, eerste lid][ref1], blijkt dat de concentratie van asbeststof
      in de lucht waaraan werknemers in verband met de arbeid worden blootgesteld, gelijk is aan of hoger is dan de beide
      in [artikel 4.44][ref2] genoemde actieniveaus, gelden naast de voorschriften van paragraaf 3, tevens de in deze
      paragraaf genoemde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.48
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '5'
  - number: 4.49.1
    text: |-
      Aan een daartoe aangewezen ambtenaar als bedoeld in [artikel 24 van de wet][ref1] wordt schriftelijk gemeld:


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.49
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 4.49.1.a
    text: |-
      de soorten asbest of asbesthoudende producten alsmede de hoeveelheden van ieder van deze soorten of producten die
      worden toegepast of bewerkt;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.49
  - number: 4.49.1.b
    text: de werkzaamheden die met asbest of asbesthoudende producten worden verricht alsmede de werkmethoden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.49
  - number: 4.49.2
    text: |-
      Indien het voornemen bestaat om in de gegevens, bedoeld in het eerste lid, belangrijke wijziging aan
      te brengen, wordt dit voornemen schriftelijk gemeld aan een daartoe aangewezen ambtenaar als bedoeld in
      [artikel 24, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.49
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 4.49.3
    text: |-
      De op grond van het eerste en tweede lid gemelde gegevens worden ter kennis gebracht van de ondernemingsraad of de
      personeelsvertegenwoordiging of, bij het ontbreken daarvan, van de belanghebbende werknemers.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.49
  - number: 4.50.1
    text: |-
      De concentratie van asbeststof in de lucht waaraan de werknemers in verband met de arbeid worden blootgesteld
      wordt, in het kader van de risico-inventarisatie en -evaluatie, bedoeld in [artikel 5 van de wet][ref1], ten
      minste éénmaal in de drie maanden door middel van het nemen van monsters gemeten en voorts telkens wanneer
      zich een verandering in de werkmethoden en de omstandigheden van de blootstelling voordoet. Deze frequentie mag
      worden teruggebracht tot éénmaal per jaar, indien er geen verandering in de werkmethoden en de omstandigheden
      van de blootstelling heeft plaatsgevonden en uit de twee opeenvolgende voorafgaande metingen is gebleken dat de
      concentratie van asbeststof in de lucht niet meer bedroeg dan de helft van de in [artikel 4.46][ref2] genoemde
      grenswaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.50
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '5'
  - number: 4.50.2
    text: |-
      De metingen en monsterneming worden uitgevoerd volgens een bij ministeriële regeling vast te stellen methode of wel
      een andere methode, indien deze gelijkwaardige resultaten oplevert.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.50
  - number: 4.50.3
    text: |-
      De resultaten van de op grond van het eerste lid uitgevoerde metingen worden, voorzien van een toelichting, ter
      kennis gebracht van de ondernemingsraad of de personeelsvertegenwoordiging of, bij het ontbreken daarvan, van de
      belanghebbende werknemers.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.50
  - number: 4.50.4
    text: |-
      De metingen, bedoeld in het eerste lid, worden regelmatig volgens een tevoren opgesteld plan uitgevoerd, waarbij de
      monsterneming representatief is voor de blootstelling van de werknemers aan asbeststof.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.50
  - number: 4.50.5
    text: |-
      De ondernemingsraad of de personeelsvertegenwoordiging of, bij het ontbreken daarvan, de belanghebbende werknemers
      wordt de gelegenheid gegeven een oordeel over de wijze van monsterneming kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.50
  - number: 4.50.6
    text: |-
      Indien werknemers op een zelfde plaats identieke of gelijksoortige taken verrichten en dientengevolge aan dezelfde
      gevaren worden blootgesteld, mag de monsterneming voor deze werknemers op groepsbasis worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.50
  - number: 4.50.7
    text: |-
      De monsterneming wordt zodanig uitgevoerd dat hetzij door meting hetzij door berekening, gewogen in de tijd, de
      blootstelling van werknemers aan asbeststof kan worden vastgesteld die representatief is voor een referentieperiode
      van 8 uur.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.50
  - number: 4.50.8
    text: Het nemen van monsters wordt uitgevoerd door personeel dat de daarvoor vereiste deskundigheid bezit.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.50
  - number: 4.50.9
    text: |-
      De na het nemen van monsters uit te voeren monsteranalyse wordt uitgevoerd in laboratoria die daarvoor adequaat
      zijn toegerust alsmede ervaring hebben met de vereiste identificatietechnieken.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.50
  - number: 4.51.1
    text: |-
      De werkkleding mag uitsluitend buiten het bedrijf of de inrichting worden gebracht indien dit geschiedt met het
      doel deze te laten reinigen in daartoe adequaat uitgeruste wasserijen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.51
  - number: 4.51.2
    text: |-
      In gevallen als bedoeld in het eerste lid, wordt de werkkleding in een daartoe geschikte en gesloten verpakking
      vervoerd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.51
  - number: 4.51.3
    text: |-
      Wanneer beschermende uitrusting wordt verstrekt, wordt deze op een daartoe aangewezen plaats bewaard en na ieder
      gebruik gecontroleerd en gereinigd. Defecte uitrusting mag niet worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.51
  - number: 4.52.1
    text: |-
      Zolang de blootstelling aan asbeststof duurt, worden, in aanvulling op [artikel 4.10a, derde lid][ref1],
      de betrokken werknemers ten minste éénmaal in de drie jaar opnieuw in de gelegenheid gesteld om een
      arbeidsgezondheidskundig onderzoek als bedoeld in [artikel 4.10a][ref2] te ondergaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.52
    references:
      - id: ref1
