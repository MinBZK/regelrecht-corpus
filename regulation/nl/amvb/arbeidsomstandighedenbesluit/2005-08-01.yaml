    text: |-
      een medezeggenschapsraad als bedoeld in de [Wet medezeggenschap onderwijs 1992][ref1] of in
      [artikel 10.17 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005746
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0005746
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '10'
  - number: 1.3.4.b
    text: |-
      de studentenraad van de Open Universiteit, bedoeld in
      [artikel 11.13 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel11
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '11'
  - number: 1.4.1
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.4
  - number: 1.4.1.a
    text: 'justitieel personeel:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.4
  - number: 1.4.1.a.1°
    text: |-
      degenen, die krachtens publiekrechtelijke aanstelling in burgerlijke openbare dienst jegens het Rijk gehouden zijn
      tot het verrichten van arbeid in justitiële inrichtingen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.4
  - number: 1.4.1.a.2°
    text: |-
      degenen die onder gezag van het Rijk arbeid in een justitiële inrichting verrichten, met uitzondering van
      gedetineerden, verpleegden en jeugdigen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.4
  - number: 1.4.1.b
    text: |-
      gedetineerden, verpleegden en jeugdigen: degenen, die krachtens rechterlijke uitspraak of beschikking of door het
      openbaar gezag rechtens van hun vrijheid zijn beroofd en verblijven in een justitiële inrichting met uitzondering
      van de in het Militair Penitentiair Centrum Stroe gedetineerde militairen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.4
  - number: 1.4.1.c
    text: |-
      justitiële inrichting: een gevangenis of huis van bewaring als bedoeld in de Penitentiaire
      beginselenwet, een justitiële inrichting voor verpleging van ter beschikking gestelden als bedoeld
      in de [Beginselenwet verpleging ter beschikking gestelden][ref1] of een inrichting als bedoeld in de
      [Beginselenwet justitiële jeugdinrichtingen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008765
      [ref2]: https://wetten.overheid.nl/BWBR0011756
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.4
    references:
      - id: ref1
        bwb_id: BWBR0008765
      - id: ref2
        bwb_id: BWBR0011756
  - number: 1.4.2
    text: |-
      Onder justitiële inrichting wordt mede verstaan: het vervoer van gedetineerden, verpleegden en jeugdigen van en
      naar de justitiële inrichting alsmede alle andere arbeid die justitieel personeel verricht met gedetineerden,
      verpleegden en jeugdigen buiten de justitiële inrichting.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.4
  - number: '1.5'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.5
  - number: 1.5.a
    text: 'militair personeel:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.5
  - number: 1.5.a.1°
    text: |-
      de in werkelijke dienst zijnde militaire ambtenaren in de zin van
      [artikel 1, eerste en tweede lid, van de Militaire Ambtenarenwet 1931][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel1
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.5
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: '1'
  - number: 1.5.a.2°
    text: |-
      de in werkelijke dienst zijnde dienstplichtigen in de zin van de [artikelen 18][ref1], [19][ref2] en
      [21 van de Kaderwet dienstplicht][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0008589#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0008589#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0008589#Artikel21
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.5
    references:
      - id: ref1
        bwb_id: BWBR0008589
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0008589
        artikel: '19'
      - id: ref3
        bwb_id: BWBR0008589
        artikel: '21'
  - number: 1.5.b
    text: 'burgerpersoneel bij het Ministerie van Defensie:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.5
  - number: 1.5.b.1°
    text: |-
      degenen die krachtens publiekrechtelijke aanstelling in burgerlijke openbare dienst jegens het Rijk,
      vertegenwoordigd door de Minister van Defensie, gehouden zijn tot het verrichten van arbeid, behalve indien
      betrokkenen aan een derde ter beschikking worden gesteld voor het verrichten van arbeid, welke die derde gewoonlijk
      doet verrichten;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.5
  - number: 1.5.b.2°
    text: degenen die onder gezag van het Rijk, vertegenwoordigd door de Minister van Defensie, arbeid verrichten;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.5
  - number: 1.5.c
    text: 'defensiepersoneel: militair personeel en burgerpersoneel bij het Ministerie van Defensie;'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.5
  - number: 1.5.d
    text: |-
      oefening: iedere door defensiepersoneel onder oorlogsnabootsende omstandigheden in praktijk brengen van theoretisch
      onderwezen bekwaamheden teneinde aldus de bedrevenheid in het uitvoeren van oorlogstaken te verwerven, op te voeren
      of te onderhouden;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.5
  - number: 1.5.e
    text: |-
      militair vaartuig: een Nederlands oorlogsschip, marinehulpschip of een ander schip dat in gebruik is voor de
      uitvoering van de militaire taak;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.5
  - number: 1.5.f
    text: 'militair luchtvaartuig: een luchtvaartuig in beheer bij het Ministerie van Defensie;'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.5
  - number: 1.5.g
    text: |-
      bemand wapensysteem: ieder al dan niet voortbewogen wapensysteem, dat tijdens het gebruik wordt bemand of bediend
      met uitzondering van een licht persoonlijk wapen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.5
  - number: 1.5.h
    text: |-
      eenheid met gereedstelling: eenheid die, daartoe aangewezen, ingezet is dan wel gereed is of zich gereed moet
      houden voor inzet in krijgsmachtverband.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.5
  - number: 1.5a.1
    text: 'Als certificerende instelling kan worden aangewezen een instelling die:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.5a
  - number: 1.5a.1.a
    text: rechtspersoonlijkheid heeft;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.5a
  - number: 1.5a.1.b
    text: haar zetel of een vestiging in Nederland heeft;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.5a
  - number: 1.5a.1.c
    text: onafhankelijk is;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.5a
  - number: 1.5a.1.d
    text: |-
      beschikt over voldoende deskundigheid en outillage om de uitvoering van de taken waarvoor zij is aangewezen, naar
      behoren te kunnen vervullen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.5a
  - number: 1.5a.1.e
    text: |-
      beschikt over een registratiesysteem waarin de gegevens die samenhangen met en betrekking hebben op de uitvoering
      van haar taken, op een systematische wijze zijn vastgelegd. Aan de hand van deze gegevens is het gecertificeerde
      product of kwaliteitssysteem dan wel de gecertificeerde persoon afdoende te identificeren;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.5a
  - number: 1.5a.1.f
    text: naar behoren functioneert.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.5a
  - number: 1.5a.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.5a
  - number: 1.5b.1
    text: |-
      De certificerende instelling stelt jaarlijks voor 1 maart een verslag op van de door haar in verband met haar
      taak verrichte werkzaamheden en de rechtmatigheid en doeltreffendheid van haar werkzaamheden en werkwijze in het
      afgelopen kalenderjaar. Het verslag wordt aan Onze Minister toegezonden. Bij ministeriële regeling worden nadere
      regels gesteld met betrekking tot de onderwerpen die in ieder geval in het jaarverslag worden behandeld.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.5b
  - number: 1.5b.2
    text: |-
      De certificerende instelling verstrekt jaarlijks aan Onze Minister een afschrift van de polis van de afgesloten
      verzekering tegen wettelijke aansprakelijkheid tegen alle risico's die voortvloeien uit de uitoefening van de taken
      waarvoor zij is aangewezen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.5b
  - number: 1.5c.1
    text: |-
      Indien een wijziging plaatsvindt in de gegevens op grond waarvan de certificerende instelling is aangewezen, doet
      de instelling hiervan terstond mededeling aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.5c
  - number: 1.5c.2
    text: |-
      Indien een certificerende instelling voornemens is een of meer van de taken waarvoor zij is aangewezen, te
      beëindigen, doet de instelling hiervan terstond mededeling aan Onze Minister en de certificaathouders. In dat
      geval worden door de certificerende instelling de gegevens, bedoeld in [artikel 1.5a, eerste lid, onder e][ref1],
      overgedragen aan Onze Minister dan wel, na toestemming van Onze Minister en de certificaathouders, een andere
      certificerende instelling die voor dezelfde taken is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.5c
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: 1A
  - number: 1.5d.1
    text: |-
      Een aanvraag om aanwijzing gaat vergezeld van het bewijs dat is voldaan aan de criteria, bedoeld in
      [artikel 1.5a][ref1], dan wel van een verklaring waaruit de bereidheid blijkt om voor eigen rekening een onderzoek
      naar het voldoen aan deze criteria te ondergaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.5d
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: 1A
  - number: 1.5d.2
    text: |-
      Een aanwijzing kan worden geweigerd dan wel worden ingetrokken indien niet of niet volledig is voldaan aan de bij
      de wet of bij of krachtens deze afdeling gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.5d
  - number: 1.5e.1
    text: |-
      Een certificaat als bedoeld in [artikel 20, eerste lid, van de wet][ref1] wordt door Onze Minister of, indien
      Onze Minister een certificerende instelling heeft aangewezen, de certificerende instelling, op aanvraag afgegeven,
      indien wordt voldaan aan bij of krachtens de wet met betrekking tot het certificaat gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel20
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.5e
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '20'
  - number: 1.5e.2
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de gegevens die ten minste bij een aanvraag
      worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.5e
  - number: 1.5e.3
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de vergoeding die voor de afgifte van een
      certificaat ten hoogste verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.5e
  - number: 1.5e.4
    text: |-
      Een certificaat kan worden geweigerd of onder voorschriften worden afgegeven of verlengd dan wel ingetrokken,
      indien is gebleken dat niet of niet volledig is voldaan aan bij of krachtens de wet met betrekking tot het
      certificaat gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.5e
  - number: 1.5e.5
    text: |-
      Voorts kan een certificaat worden geweigerd dan wel ingetrokken indien de veiligheid of gezondheid van werknemers
      of derden door werkzaamheden die door het certificaat worden gereguleerd in gevaar wordt of kan worden gebracht.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.5e
  - number: 1.6.1
    text: |-
      In afwijking van de wet, dit besluit en de daarop berustende bepalingen wordt voor de toepassing
      daarvan ten aanzien van arbeid verricht in bekostigde onderwijsinrichtingen als bedoeld in
      [artikel 1.3, tweede lid, onder d][ref1], voor «de ondernemingsraad» gelezen «de dienstcommissie», en wordt ten
      aanzien van arbeid verricht door defensiepersoneel, voor zover de [Wet op de ondernemingsraden][ref2] niet van
      toepassing is, voor «de ondernemingsraad» gelezen «het overlegorgaan».


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002747
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002747
  - number: 1.6.2
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.6
  - number: 1.6.2.a
    text: |-
      dienstcommissie: een dienstcommissie als bedoeld in
      [artikel 9.58 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
  - number: 1.6.2.b
    text: |-
      overlegorgaan: een overlegorgaan als bedoeld in het [Algemeen militair ambtenarenreglement][ref1]
      en een overlegorgaan ingesteld krachtens [artikel 23 van de Kaderwet dienstplicht][ref2] alsmede
      een dienstcommissie als bedoeld in het [Burgerlijk ambtenarenreglement defensie][ref3] en het
      [Besluit georganiseerd overleg sector defensie][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003482
      [ref2]: https://wetten.overheid.nl/BWBR0008589#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0006040
      [ref4]: https://wetten.overheid.nl/BWBR0006042
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0003482
      - id: ref2
        bwb_id: BWBR0008589
        artikel: '23'
      - id: ref3
        bwb_id: BWBR0006040
      - id: ref4
        bwb_id: BWBR0006042
  - number: 1.7.1
    text: |-
      Ten aanzien van de aard en inhoud van het overleg met een dienstcommissie respectievelijk overlegorgaan, ten
      aanzien van de wijze waarop het overleg met een dienstcommissie respectievelijk overlegorgaan wordt gevoerd en ten
      aanzien van de bevoegdheden van een dienstcommissie respectievelijk overlegorgaan is van toepassing:
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.7
  - number: 1.7.1.a
    text: |-
      het [Rechtspositiereglement wetenschappelijk onderwijs][ref1] en onderzoek, of


      [ref1]: https://wetten.overheid.nl/BWBR0004192
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0004192
  - number: 1.7.1.b
    text: |-
      het [Algemeen militair ambtenarenreglement][ref1], de krachtens [artikel 23 van de Kaderwet dienstplicht][ref2]
      door Onze Minister van Defensie te stellen regels of het [Burgerlijk ambtenarenreglement defensie][ref3] dan wel
      het [Besluit georganiseerd overleg sector defensie][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003482
      [ref2]: https://wetten.overheid.nl/BWBR0008589#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0006040
      [ref4]: https://wetten.overheid.nl/BWBR0006042
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0003482
      - id: ref2
        bwb_id: BWBR0008589
        artikel: '23'
      - id: ref3
        bwb_id: BWBR0006040
      - id: ref4
        bwb_id: BWBR0006042
  - number: 1.7.2
    text: |-
      Voor zover de wet bepalingen bevat omtrent rechten van de ondernemingsraad of leden daarvan waaromtrent de in het
      eerste lid bedoelde regelingen geen bepalingen bevatten, is de wet van toepassing.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.7
  - number: 1.8.1
    text: |-
      Ten aanzien van degene op wie het [Algemeen Rijksambtenarenreglement][ref1] onderscheidenlijk
      het [Burgerlijk ambtenarenreglement defensie][ref2] van toepassing is en die als deskundige
      werknemer als bedoeld in [artikel 14, eerste lid, van de wet][ref3] werkzaam is, is
      [artikel 126d, tweede en derde lid, van het Algemeen Rijksambtenarenreglement][ref4] onderscheidenlijk
      [artikel 144, tweede en derde lid, van het Burgerlijk ambtenarenreglement defensie][ref5] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001950
      [ref2]: https://wetten.overheid.nl/BWBR0006040
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0001950#Artikel126d
      [ref5]: https://wetten.overheid.nl/BWBR0006040#Artikel144
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.8
    references:
      - id: ref1
        bwb_id: BWBR0001950
      - id: ref2
        bwb_id: BWBR0006040
      - id: ref3
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref4
        bwb_id: BWBR0001950
        artikel: 126d
      - id: ref5
        bwb_id: BWBR0006040
        artikel: '144'
  - number: 1.8.2
    text: |-
      Ten aanzien van degenen, bedoeld in het eerste lid, op wie een overeenkomstige regeling als het
      [Algemeen Rijksambtenarenreglement][ref1] van toepassing is, is voor zover nodig het eerste lid van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001950
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.8
    references:
      - id: ref1
        bwb_id: BWBR0001950
  - number: 1.8.3
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van degene op wie het
      [Rechtspositiereglement wetenschappelijk onderwijs][ref1] en onderzoek van toepassing is, met dien verstande dat
      in [artikel 126][ref2] in de plaats van artikel 6, tweede lid, onder *d* en *e*, wordt gelezen: [artikel 2.3]
      (onbekend), vierde lid, onder *c*, en [artikel 2.3, zesde lid, onder ](onbekend) en onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0004192
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel126d
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.8
    references:
      - id: ref1
        bwb_id: BWBR0004192
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 126d
  - number: '1.9'
    text: |-
      In afwijking van [artikel 14, tweede lid, van de wet][ref1] is ten aanzien van degene op wie het
      Rechtspositiereglement wetenschappelijk onderwijs en onderzoek van toepassing is en die als deskundige
      werknemer als bedoeld in [artikel 14, eerste lid, van de wet][ref2] werkzaam is, artikel 1.16 van het
      Rechtspositiereglement wetenschappelijk onderwijs en onderzoek van toepassing. Ten aanzien van degene op
      wie het [Algemeen militair ambtenarenreglement][ref3] of het [Burgerlijk ambtenarenreglement defensie][ref4]
      van toepassing is en die als deskundige werknemer als bedoeld in de vorige volzin werkzaam is, is
      [artikel 20 van het Besluit medezeggenschap defensie][ref5] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0003482
      [ref4]: https://wetten.overheid.nl/BWBR0006040
      [ref5]: https://wetten.overheid.nl/BWBR0010617#Artikel20
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.9
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0003482
      - id: ref4
        bwb_id: BWBR0006040
      - id: ref5
        bwb_id: BWBR0010617
        artikel: '20'
  - number: '1.10'
    text: |-
      Tenzij hierna anders is bepaald, zijn de wet en dit besluit van toepassing op werknemers in onderwijsinrichtingen
      en op overeenkomstige wijze van toepassing op leerlingen en studenten in onderwijsinrichtingen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.10
  - number: 1.11.1
    text: |-
      Voor bekostigde onderwijsinrichtingen als bedoeld in
      [artikel 1.3, tweede lid, onder a tot en met c, en onder e tot en met h][ref1], komen de rechten, bedoeld
      in [artikel 12, tweede en derde lid, van de wet][ref2], voor zover van toepassing, toe aan de leden van de
      medezeggenschapsraad.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel12
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '12'
  - number: 1.11.2
    text: |-
      Voor de in het eerste lid genoemde bekostigde onderwijsinrichtingen treedt voor de toepassing van
      [artikel 12, vierde en vijfde lid, van de wet][ref1] de medezeggenschapsraad in de plaats van de ondernemingsraad.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel12
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '12'
  - number: 1.11.3
    text: |-
      Voor de in het eerste lid genoemde bekostigde onderwijsinrichtingen worden de in de wet en dit besluit
      toekomende rechten en bevoegdheden met inachtneming van [artikel 1.13][ref1], uitgeoefend door de leden van de
      medezeggenschapsraad of, indien het betreft aangelegenheden van algemeen belang voor de bijzondere rechtstoestand
      van het personeel, door het overlegorgaan van het decentraal georganiseerd overleg respectievelijk van de
      instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '3'
  - number: '1.12'
    text: |-
      Voor de in [artikel 1.3, tweede lid, onder d][ref1], genoemde bekostigde onderwijsinrichting worden de in de wet
      en dit besluit toekomende rechten en bevoegdheden, met inachtneming van [artikel 1.13][ref2], uitgeoefend door
      de dienstcommissie, bedoeld in de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3] of, indien
      het betreft aangelegenheden van algemeen belang voor de bijzondere rechtstoestand van het personeel, door het
      overlegorgaan van het decentraal georganiseerd overleg respectievelijk van de instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.12
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0005682
  - number: 1.13.1
    text: |-
      [Artikel 3, eerste lid, onder c, van de wet][ref1] met uitzondering van de ergomische aspecten van de arbeid,
      en d, voor zover niet betrekking hebbend op de veiligheid en de gezondheid, is niet van toepassing op leerlingen
      respectievelijk studenten in onderwijsinrichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.13
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '3'
  - number: 1.13.2
    text: |-
      [Afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] geldt niet ten aanzien van leerlingen respectievelijk
      studenten in onderwijsinrichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
  - number: '1.14'
    text: |-
      Waar in de wet bepaalde verplichtingen worden opgelegd aan werknemers, zijn deze bepalingen niet van toepassing op
      leerlingen respectievelijk studenten in onderwijsinrichtingen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.14
  - number: '1.15'
    text: |-
      [Artikel 18 van de wet][ref1] is niet van toepassing op leerlingen respectievelijk studenten in
      onderwijsinrichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel18
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.15
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '18'
  - number: '1.16'
    text: 'Deze afdeling is van toepassing op arbeid verricht in de burgerlijke openbare dienst met uitzondering van arbeid:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.16
  - number: 1.16.a
    text: verricht in onderwijsinrichtingen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.16
  - number: 1.16.b
    text: verricht in justitiële inrichtingen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.16
  - number: 1.16.c
    text: |-
      verricht door burgerpersoneel, werkzaam bij het Ministerie van Defensie, met inbegrip van de daaronder
      ressorterende diensten en instellingen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.16
  - number: '1.17'
    text: |-
      Op arbeid verricht in de burgerlijke openbare dienst, welke gericht is op het daadwerkelijk
      uitoefenen van de taken, bedoeld in [artikel 2 van de Politiewet 1993][ref1], [artikel 141][ref2] of
      [142 van het Wetboek van Strafvordering][ref3], of [artikel 1, zesde lid, van de Brandweerwet 1985][ref4]
      voor zover deze taak betrekking heeft op het repressief optreden bij brand, ongevallen en rampen, zijn de
      [artikelen 10][ref5], [27][ref6], [28][ref7] en [29 van de wet][ref8] van toepassing voor zover door de toepassing
      van deze artikelen een goede taakuitoefening niet wordt belemmerd.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel142
      [ref4]: https://wetten.overheid.nl/BWBR0003764#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0010346#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0010346#Artikel27
      [ref7]: https://wetten.overheid.nl/BWBR0010346#Artikel28
      [ref8]: https://wetten.overheid.nl/BWBR0010346#Artikel29
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.17
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '142'
      - id: ref4
        bwb_id: BWBR0003764
        artikel: '1'
      - id: ref5
        bwb_id: BWBR0010346
        artikel: '10'
      - id: ref6
        bwb_id: BWBR0010346
        artikel: '27'
      - id: ref7
        bwb_id: BWBR0010346
        artikel: '28'
      - id: ref8
        bwb_id: BWBR0010346
        artikel: '29'
  - number: 1.18.1
    text: |-
      Ten aanzien van arbeid verricht in de burgerlijke openbare dienst,
      welke gericht is op het daadwerkelijk uitoefenen van taken, bedoeld in
      [artikel 6, tweede lid, onder a, van de Wet op de inlichtingen- en veiligheidsdiensten 2002][ref1], zijn de
      [artikelen 27][ref2], [28][ref3] en [29 van de wet][ref4] van toepassing voor zover door de toepassing van deze
      artikelen een goede taakuitoefening niet wordt belemmerd.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0010346#Artikel29
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.18
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '27'
      - id: ref3
        bwb_id: BWBR0010346
        artikel: '28'
      - id: ref4
        bwb_id: BWBR0010346
        artikel: '29'
  - number: 1.18.2
    text: |-
      Op arbeid verricht in rijksdienst geschiedt de toepassing van de wet met inachtneming van de voor de rijksdienst
      geldende nationale en internationale voorschriften ter beveiliging van gegevens, waarvan de geheimhouding door het
      belang van de staat of van zijn bondgenoten wordt geboden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.18
  - number: 1.18.3
    text: |-
      Op arbeid verricht in de burgerlijke openbare dienst door of ten behoeve van de inlichtingen- en
      veiligheidsdiensten geschiedt de toepassing van de wet bovendien met inachtneming van de aan de hoofden van deze
      diensten opgedragen zorg voor geheimhouding van de door hen verkregen gegevens en van de bronnen waaruit zij
      afkomstig zijn en voor het naar behoren waarborgen van de veiligheid van de personen van wier diensten bij het
      inwinnen van gegevens gebruik wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.18
  - number: 1.19.1
    text: |-
      De wet is niet van toepassing op arbeid verricht in respectievelijk op een zeeschip dat niet op grond van
      Nederlandse rechtsregels gerechtigd is de Nederlandse vlag te voeren en dat zich bevindt in de territoriale zee, op
      een van de andere in [artikel 10, eerste lid, van de Scheepvaartverkeerswet][ref1] bedoelde scheepvaartwegen of in
      de haven van Scheveningen.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel10
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.19
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '10'
  - number: 1.19.2
    text: |-
      Het eerste lid geldt niet ten aanzien van aanbouw, verbouwing, herstelling of sloping dan wel onderhoudsof
      reinigingswerkzaamheden en hiermee verband houdende andere werkzaamheden aan de in het eerste lid bedoelde schepen
      die zich in Nederland bevinden alsmede ten aanzien van laden en lossen, tenzij deze arbeid wordt verricht door een
      werknemer die behoort tot de bemanning van een zeeschip als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.19
  - number: 1.19.3
    text: |-
      De wet is niet van toepassing op arbeid verricht in respectievelijk op een luchtvaartuig als bedoeld in
      [artikel 1, aanhef en onder e, van de Luchtvaartwet][ref1], dat ter beschikking is gesteld aan een niet in
      Nederland gevestigde werkgever, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel1
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.19
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '1'
  - number: 1.19.3.a
    text: deze werkgever daarin of daarop door in meerderheid in Nederland woonachtige werknemers arbeid doet verrichten;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.19
  - number: 1.19.3.b
    text: |-
      het betreft laden en lossen, aanbouw, verbouwing, herstelling of sloping dan wel onderhouds- of
      reinigingswerkzaamheden en hiermee verband houdende andere werkzaamheden aan bedoelde luchtvaartuigen die zich in
      Nederland bevinden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.19
  - number: 1.19.4
    text: |-
      De wet is niet van toepassing op arbeid verricht in respectievelijk op een luchtvaartuig als bedoeld in
      [artikel 1, aanhef en onder f, van de Luchtvaartwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel1
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.19
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '1'
  - number: 1.19.5
    text: |-
      Het vierde lid geldt niet ten aanzien van laden en lossen, aanbouw, verbouwing, herstelling of sloping dan wel
      onderhouds- of reinigingswerkzaamheden en hiermee verband houdende andere werkzaamheden aan de in het vierde lid
      bedoelde luchtvaartuigen die zich in Nederland bevinden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.19
  - number: 1.20.1
    text: |-
      Op arbeid verricht in respectievelijk op een zeeschip of een luchtvaartuig is [artikel 29 van de wet][ref1]
      niet van toepassing, voor zover de toepassing van dat artikel in strijd komt met de verplichtingen
      die voortvloeien uit de uitoefening van de bevoegdheden van de kapitein respectievelijk de
      gezagvoerder, bedoeld in [artikel 341 van het Wetboek van Koophandel][ref2] respectievelijk
      [artikel 95, eerste lid, van de Regeling Toezicht Luchtvaart][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel341
      [ref3]: https://wetten.overheid.nl/BWBR0002309#Artikel95
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.20
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0001838
        artikel: '341'
      - id: ref3
        bwb_id: BWBR0002309
        artikel: '95'
  - number: 1.20.2
    text: |-
      Op arbeid verricht door de kapitein respectievelijk de gezagvoerder, bedoeld in het eerste lid, in respectievelijk
      op een zeeschip of een luchtvaartuig, is [artikel 29 van de wet][ref1] niet van toepassing voor zover de toepassing
      van dat artikel in strijd komt met de verplichtingen die voortvloeien uit het [Wetboek van Koophandel][ref2]
      respectievelijk de [Regeling Toezicht Luchtvaart][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0001838
      [ref3]: https://wetten.overheid.nl/BWBR0002309
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.20
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0001838
      - id: ref3
        bwb_id: BWBR0002309
  - number: 1.22.1
    text: |-
      De [artikelen 10][ref1], [27][ref2], [28][ref3] en [29 van de wet][ref4] zijn van toepassing op de in de justitiële
      inrichting door het justitieel personeel verrichte arbeid voor zover geen inbreuk wordt gemaakt op de orde, de
      veiligheid of de goede gang van zaken in de inrichting of op het ongestoord verloop van de tenuitvoerlegging
      van de vrijheidsbeneming en andere beperkingen die krachtens enige wettelijke bepaling door de daartoe bevoegde
      autoriteiten zijn opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0010346#Artikel29
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.22
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '27'
      - id: ref3
        bwb_id: BWBR0010346
        artikel: '28'
      - id: ref4
        bwb_id: BWBR0010346
        artikel: '29'
  - number: 1.22.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op gedetineerden, verpleegden en jeugdigen met dien verstande,
      dat in plaats van de [artikelen 10][ref1], [27][ref2], [28][ref3] en [29 van de wet][ref4] wordt gelezen de
      [artikelen 24, zesde lid][ref5], [27][ref6], [28][ref7] en[ 29 van de wet][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0010346#Artikel29
      [ref5]: https://wetten.overheid.nl/BWBR0010346#Artikel24
      [ref6]: https://wetten.overheid.nl/BWBR0010346#Artikel27
      [ref7]: https://wetten.overheid.nl/BWBR0010346#Artikel28
      [ref8]: https://wetten.overheid.nl/BWBR0010346#Artikel29
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.22
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '27'
      - id: ref3
        bwb_id: BWBR0010346
        artikel: '28'
      - id: ref4
        bwb_id: BWBR0010346
        artikel: '29'
      - id: ref5
        bwb_id: BWBR0010346
        artikel: '24'
      - id: ref6
        bwb_id: BWBR0010346
        artikel: '27'
      - id: ref7
        bwb_id: BWBR0010346
        artikel: '28'
      - id: ref8
        bwb_id: BWBR0010346
        artikel: '29'
  - number: '1.23'
    text: |-
      Ten aanzien van arbeid verricht door het justitieel personeel in de justitiële inrichtingen geschiedt de toepassing
      van de wet met inachtneming van de voor de rijksdienst geldende nationale en internationale voorschriften ter
      beveiliging van gegevens, waarvan de geheimhouding door het belang van de staat of van zijn bondgenoten wordt
      geboden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.23
  - number: '1.24'
    text: |-
      In afwijking van [artikel 5, vijfde lid, van de wet][ref1] kan een gedetineerde, verpleegde of jeugdige kennisnemen
      van de risico-inventarisatie en -evaluatie, voor zover de orde of de veiligheid in de justitiële inrichting
      daardoor niet in gevaar wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.24
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
  - number: '1.25'
    text: |-
      In afwijking van [artikel 12, eerste lid, van de wet][ref1] werken de directeur van de inrichting en de
      gedetineerden, verpleegden of jeugdigen zoveel mogelijk samen bij de uitvoering van het arbeidsomstandighedenbeleid
      van gedetineerden, verpleegden en jeugdigen binnen de justitiële inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel12
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.25
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '12'
  - number: '1.26'
    text: Tenzij in deze afdeling anders is bepaald is de wet van toepassing op arbeid verricht door defensiepersoneel.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.26
  - number: 1.27.1
    text: |-
      De toepassing van de wet met betrekking tot arbeid verricht door defensiepersoneel geschiedt met inachtneming
      van de voor het Ministerie van Defensie geldende nationale en internationale voorschriften ter beveiliging van
      gegevens, waarvan de geheimhouding door het belang van de staat of van zijn bondgenoten wordt geboden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.27
  - number: 1.27.2
    text: |-
      De toepassing van de wet met betrekking tot arbeid in de openbare dienst verricht door of ten behoeve van de
      militaire inlichtingen- en veiligheidsdiensten geschiedt bovendien met inachtneming van de aan de hoofden van
      deze diensten opgedragen zorg voor geheimhouding van de door hen verkregen gegevens en van de bronnen waaruit zij
      afkomstig zijn en voor het naar behoren waarborgen van de veiligheid van de personen van wier diensten bij het
      inwinnen van die gegevens gebruik wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.27
  - number: '1.28'
    text: |-
      De toepassing van de wet met betrekking tot arbeid verricht door defensiepersoneel geschiedt met inachtneming van
      internationale verplichtingen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.28
  - number: '1.29'
    text: 'De wet is niet van toepassing op arbeid verricht door defensiepersoneel:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.29
  - number: 1.29.a
    text: |-
      ten tijde van oorlog, oorlogsgevaar of andere daaraan verwante of daarmee verband
      houdende buitengewone omstandigheden, waaronder begrepen de gevallen als opgesomd in
      [artikel 71 van het Wetboek van Militair Strafrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel71
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel1.29
    references:
