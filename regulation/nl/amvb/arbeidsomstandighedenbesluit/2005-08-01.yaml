        paragraaf: '5'
        afdeling: '5'
  - number: 4.54.3
    text: |-
      Voordat met de in het eerste lid bedoelde werkzaamheden wordt begonnen zijn de locatie, de datum en het tijdstip
      waarop deze werkzaamheden zullen worden verricht, tijdig gemeld aan een daartoe aangewezen ambtenaar als bedoeld in
      [artikel 24, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.54
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 4.54.4
    text: |-
      Voorts wordt, voordat met de in het eerste lid bedoelde werkzaamheden wordt begonnen, een schriftelijk werkplan
      opgesteld dat doeltreffende maatregelen bevat ter bescherming van de veiligheid en de gezondheid van de betrokken
      werknemers.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.54
  - number: 4.54.5
    text: |-
      De in het eerste lid bedoelde werkzaamheden worden verricht door of onder toezicht van een persoon die in het bezit
      is van een certificaat van vakbekwaamheid verwijdering asbest en crocidoliet, dat is afgegeven door Onze Minister
      of een certificerende instelling.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.54
  - number: 4.54.6
    text: |-
      Het in het vierde lid respectievelijk vijfde lid, bedoelde werkplan en certificaat van vakbekwaamheid verwijdering
      asbest en crocidoliet of een afschrift daarvan zijn op de arbeidsplaats aanwezig en worden desgevraagd getoond aan
      een ambtenaar als bedoeld in [artikel 24, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.54
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 4.55.1
    text: |-
      Het in [artikel 4.54, vierde lid][ref1], bedoelde werkplan bevat:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel4.55
