  - number: '3.43'
    text: |-
      De [artikelen 3.20 tot en met 3.25][ref1] zijn niet van toepassing op arbeidsplaatsen in justitiële inrichtingen
      die vóór 1 september 1990 als zodanig in gebruik waren, voor zover de naleving daarvan redelijkerwijs niet kan
      worden gevergd.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.43
    references:
