        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: '1'
  - number: '3.44'
    text: |-
      De [artikelen 3.6][ref1] en [3.7][ref2] zijn van toepassing op arbeid verricht in de justitiële inrichting door
      justitieel personeel, gedetineerden of jeugdigen, voor zover geen inbreuk wordt gemaakt op de orde, de veiligheid
      of de goede gang van zaken in de justitiële inrichting of het ongestoord verloop van de tenuitvoerlegging van
      de vrijheidsbeneming of andere beperkingen die krachtens enige wet door de daartoe bevoegde autoriteiten zijn
      opgelegd. Daarbij worden in ieder geval zodanige technische en organisatorische maatregelen getroffen dat het
      justitieel personeel, de gedetineerden of jeugdigen zich in veiligheid kunnen stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.44
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
