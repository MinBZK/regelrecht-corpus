  - number: 3.42.8
    text: |-
      De [artikelen 3.20 tot en met 3.25][ref1] zijn niet van toepassing op voertuigen op een openbare weg of een
      spoorweg.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.42
