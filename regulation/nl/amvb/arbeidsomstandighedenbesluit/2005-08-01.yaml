  - number: '2.6'
    text: |-
      Ten aanzien van een zelfstandig werkende die een bedrijf of inrichting exploiteert waarop [artikel 2.3][ref1] van
      toepassing is, zijn de [artikelen 10][ref2], [11][ref3] en [19, eerste lid, van de wet][ref4] en deze afdeling van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0010346#Artikel19
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0010346
        artikel: '11'
      - id: ref4
        bwb_id: BWBR0010346
        artikel: '19'
  - number: 2.6a.1
    text: 'In deze afdeling en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.6a
  - number: 2.6a.1.a
    text: |-
      interne deskundige: deskundige persoon als bedoeld in [artikel 14, eerste lid, aanhef, van de wet][ref1] en
      die binnen het bedrijf of de inrichting werkzaam is krachtens een arbeidsovereenkomst of publiekrechtelijke
      aanstelling;


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.6a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
  - number: 2.6a.1.b
    text: |-
      externe deskundige: deskundige persoon als bedoeld in [artikel 14, eerste lid, aanhef, van de wet][ref1] en die
      niet binnen het bedrijf of de inrichting werkzaam is op een wijze als bedoeld in onderdeel a;


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.6a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
  - number: 2.6a.1.c
    text: |-
      interne arbodienst: een dienst als bedoeld in [artikel 14a, tweede lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14a
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.6a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: 14a
  - number: 2.6a.1.d
    text: |-
      externe arbodienst: een dienst als bedoeld in [artikel 14a, derde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14a
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.6a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: 14a
  - number: 2.6a.2
    text: |-
      Onder een interne arbodienst wordt mede verstaan een samenwerkingsverband tussen tenminste een interne deskundige
      en externe deskundigen die tezamen de taken, bedoeld in [artikel 14, eerste lid, van de wet][ref1] uitvoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.6a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
  - number: 2.7.1
    text: |-
      Binnen een arbodienst zijn deskundigen werkzaam op het terrein van de arbeids- en bedrijfsgeneeskunde, de
      arbeidshygiëne, de veiligheidskunde en de arbeids- en organisatiekunde.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.7
  - number: 2.7.2
    text: |-
      Een deskundige beschikt over voldoende deskundigheid en ervaring op een vakgebied als bedoeld in het eerste lid,
      indien hij in het bezit is van een certificaat van vakbekwaamheid arbeids- en bedrijfsgeneeskunde, arbeidshygiëne,
      veiligheidskunde dan wel arbeids- en organisatiekunde, dat is afgegeven door Onze Minister of een certificerende
      instelling.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.7
  - number: '2.8'
    text: |-
      Indien op een of meer vakgebieden diploma's zijn vereist voor de afgifte van een certificaat van vakbekwaamheid
      als bedoeld in [artikel 2.7, tweede lid][ref1], wordt met die diploma's gelijkgesteld een door Onze Minister of
      een door Onze Minister aangewezen instelling op een van deze vakgebieden afgegeven EG-verklaring als bedoeld in de
      [Algemene wet erkenning EG-hoger-onderwijsdiploma's][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006317
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0006317
  - number: 2.9.1
    text: 'Een arbodienst:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.9
  - number: 2.9.1.a
    text: vervult zijn taken met inachtneming van de stand van de wetenschap en van de professionele dienstverlening;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.9
  - number: 2.9.1.b
    text: |-
      adviseert inzake het voeren van een gestructureerd, systematisch en adequaat arbeidsomstandighedenen
      ziekteverzuimbeleid op een wijze die het meest bijdraagt aan de effectuering daarvan, waarbij met name rekening
      wordt gehouden met bijzondere groepen van werknemers en waarbij tevens binnen het bedrijf of de inrichting
      plaatsgevonden gebeurtenissen worden betrokken;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.9
  - number: 2.9.1.c
    text: |-
      onderkent en beoordeelt de gevaren, zowel van het technisch systeem als van de organisatie en het menselijk gedrag,
      waarbij tevens binnen het bedrijf of de inrichting plaatsgevonden gebeurtenissen worden betrokken;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.9
  - number: 2.9.1.d
    text: evalueert de dienstverlening;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.9
  - number: 2.9.1.e
    text: draagt zorg voor de continuïteit van de dienstverlening, en
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.9
  - number: 2.9.1.f
    text: behandelt klachten over de dienstverlening.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.9
  - number: 2.9.2
    text: Bij ministeriële regeling worden nadere regels gesteld met betrekking tot het functioneren van de arbodienst.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.9
  - number: 2.10.1
    text: Een externe arbodienst bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.10
  - number: 2.10.2
    text: |-
      Behoudens ten aanzien van het samenwerkingsverband, bedoeld in [artikel 2.6a, tweede lid][ref1], is op elk van
      de in [artikel 2.7, eerste lid][ref2], genoemde vakgebieden ten minste één deskundige werkzaam krachtens een
      arbeidsovereenkomst of publiekrechtelijke aanstelling voor onbepaalde tijd.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '3'
  - number: '2.11'
    text: |-
      Een arbodienst beschikt over zodanige huisvesting en outillage dat de bescherming van de persoonlijke levenssfeer
      van de werknemers van de aangesloten bedrijven is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.11
  - number: 2.12.1
    text: |-
      De externe arbodienst of de werkgever van de interne arbodienst doet desgevraagd statistische gegevens met
      betrekking tot de uitoefening van de taken toekomen aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.12
  - number: 2.12.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de aard van de in het eerste lid bedoelde
      gegevens en de vorm waarin alsmede de frequentie waarmee deze gegevens worden toegezonden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.12
  - number: 2.13.1
    text: |-
      Het samenwerkingsverband, bedoeld in [artikel 2.6a, tweede lid][ref1], wordt vastgelegd in een schriftelijke
      overeenkomst tussen de werkgever en de externe deskundigen of de werkgever van deze deskundigen. In deze
      overeenkomst wordt in ieder geval de taakverdeling vastgelegd tussen de interne deskundige en de externe
      deskundigen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '3'
  - number: 2.13.2
    text: |-
      Het samenwerkingsverband wordt aangegaan voor een periode die in ieder geval even lang is als de geldigheidsduur
      van het certificaat arbodienst, bedoeld in [artikel 2.14, tweede lid][ref1], dat ten behoeve van dat
      samenwerkingsverband wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '3'
  - number: 2.14.1
    text: |-
      Een externe arbodienst is in het bezit van een certificaat arbodienst dat is afgegeven door Onze Minister of een
      certificerende instelling.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.14
  - number: 2.14.2
    text: |-
      De werkgever van een interne arbodienst is ten behoeve van zijn interne arbodienst in het bezit van een certificaat
      arbodienst dat is afgegeven door Onze Minister of een certificerende instelling.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.14
  - number: 2.14.3
    text: |-
      Indien een aan een externe arbodienst afgegeven certificaat arbodienst wordt ingetrokken, niet wordt
      verlengd of indien aan de verlenging daarvan voorschriften zijn verbonden, doet de dienst daarvan terstond
      mededeling aan de werkgever te wiens behoeve de taken worden uitgeoefend, en aan de ondernemingsraad of de
      personeelsvertegenwoordiging. Bij het ontbreken van een ondernemingsraad of personeelsvertegenwoordiging zorgt
      de werkgever ervoor dat de belanghebbende werknemers zo spoedig mogelijk van deze mededeling op de hoogte worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.14
  - number: 2.14.4
    text: |-
      Indien een ten behoeve van een interne arbodienst afgegeven certificaat arbodienst wordt ingetrokken, niet wordt
      verlengd of indien aan de verlenging daarvan voorschriften zijn verbonden, doet de werkgever daarvan terstond
      mededeling aan de ondernemingsraad of de personeelsvertegenwoordiging of, bij het ontbreken daarvan, aan de
      belanghebbende werknemers alsmede, ingeval sprake is van een samenwerkingsverband, aan de betrokken externe
      deskundigen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.14
  - number: 2.14a.1
    text: |-
      Bij de taak, bedoeld in [artikel 14, eerste lid, onderdeel a, van de wet][ref1] wordt bijstand verleend door een
      deskundige die in het bezit is van tenminste een van de certificaten, bedoeld in [artikel 2.7, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.14a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '3'
  - number: 2.14a.2
    text: |-
      Bij de taken, bedoeld in [artikel 14, eerste lid, onderdelen b en c, van de wet][ref1] wordt bijstand verleend
      door een deskundige die in het bezit is van een certificaat van vakbekwaamheid arbeids- en bedrijfsgeneeskunde als
      bedoeld in [artikel 2.7, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.14a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '3'
  - number: 2.14a.3
    text: |-
      Bij de taak, bedoeld in [artikel 14, eerste lid, onderdeel d, van de wet][ref1] wordt bijstand verleend door een
      deskundige die in het bezit is van tenminste een van de certificaten, bedoeld in [artikel 2.7, tweede lid][ref2].
      Indien deze deskundige niet in het bezit is van een certificaat van vakbekwaamheid arbeids- en bedrijfsgeneeskunde,
      wordt voor de bijstand bij deze taak voorts een deskundige ingeschakeld die in het bezit is van voornoemd
      certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.14a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '3'
  - number: 2.14a.4
    text: |-
      Ten aanzien van de deskundigen zijn de [artikelen 2.9][ref1], [2.11][ref2] en [2.12][ref3] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.14a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '3'
  - number: 2.14b.1
    text: |-
      De verplichting een deskundige of een arbodienst in te schakelen bij de taak, bedoeld in
      [artikel 14, eerste lid, onderdeel a, van de wet][ref1] geldt niet ten aanzien van de werkgever:


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.14b
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
  - number: 2.14b.1.a
    text: die werknemers arbeid laat verrichten voor een tijdsduur van in totaal ten hoogste 40 uren per week, of
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.14b
  - number: 2.14b.1.b
    text: |-
      met in de regel ten hoogste 10 werknemers, indien gebruik wordt gemaakt van een model voor het opstellen van een
      risico-inventarisatie en -evaluatie.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.14b
  - number: 2.14b.2
    text: 'Het model, bedoeld in het eerste lid, onderdeel b, voldoet aan de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.14b
  - number: 2.14b.2.a
    text: |-
      het model is opgenomen in een collectieve arbeidsovereenkomst of in een regeling door een daartoe bevoegd
      bestuursorgaan en heeft een onverplicht karakter;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.14b
  - number: 2.14b.2.b
    text: |-
      het model is getoetst door ten minste een deskundige die in het bezit is van een certificaat als bedoeld in
      [artikel 2.7, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.14b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '3'
  - number: 2.14b.3
    text: |-
      De werkgever houdt bij het gebruikmaken van het model rekening met de specifieke omstandigheden in het bedrijf of
      de inrichting.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.14b
  - number: 2.14b.4
    text: 'Bij de toepassing van het eerste lid wordt buiten beschouwing gelaten:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.14b
  - number: 2.14b.4.a
    text: |-
      de tijdsduur van arbeid die een werkgever laat verrichten door personen onderscheidenlijk het aantal personen die
      geen werknemer zijn in de zin van de [Ziektewet][ref1] omdat de arbeid onbezoldigd wordt verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.14b
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 2.14b.4.b
    text: |-
      de tijdsduur van arbeid verricht door een directeur-grootaandeelhouder onderscheidenlijk de persoon van directeur-
      grootaandeelhouder als bedoeld in de [Regeling aanwijzing directeur-grootaandeelhouder][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009232
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.14b
    references:
      - id: ref1
        bwb_id: BWBR0009232
  - number: 2.14c
    text: |-
      De verplichting een deskundige of een arbodienst in te schakelen bij de taak, bedoeld in
      [artikel 14, eerste lid, onderdeel b, van de wet][ref1] geldt niet ten aanzien van de werkgever die uitsluitend:


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.14c
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
  - number: 2.14c.a
    text: personen onder zijn gezag arbeid laat verrichten zonder arbeidsovereenkomst of publiekrechtelijke aanstelling;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.14c
  - number: 2.14c.b
    text: |-
      personen arbeid laat verrichten op incidentele oproep, jegens wie na afloop van de oproep geen
      loondoorbetalingsplicht bij ziekte op grond van [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref1] bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.14c
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
  - number: '2.16'
    text: 'In deze afdeling en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.16
  - number: 2.16.a
    text: |-
      bedrijfshulpverlener: de door een werkgever op grond van [artikel 15, eerste lid, van de wet][ref1] met
      bedrijfshulpverleningstaken belaste werknemer;


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel15
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.16
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '15'
  - number: 2.16.b
    text: |-
      bedrijfshulpverlening: de daadwerkelijke uitvoering van de taken op het gebied van de bedrijfshulpverlening,
      bedoeld in [artikel 15, tweede lid, van de wet][ref1], zulks zo nodig in samenwerking met de
      hulpverleningsorganisaties die bij een ongeval of brand een taak hebben;


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel15
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.16
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '15'
  - number: 2.16.c
    text: |-
      ongeval: een aan een of meer in een bedrijf of inrichting aanwezige werknemers of andere personen overkomen
      gebeurtenis, niet zijnde brand, die schade aan de gezondheid tot vrijwel onmiddellijk gevolg heeft gehad of direct
      gevaar voor de veiligheid of de gezondheid van die werknemers of andere personen doet ontstaan;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.16
  - number: 2.16.d
    text: |-
      hulpverleningsorganisaties: gespecialiseerde organisaties voor hulpverlening die in het kader van de openbare
      veiligheid of gezondheid opereren.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.16
  - number: '2.17'
    text: 'Bij de organisatie van bedrijfshulpverlening wordt ten minste rekening gehouden met de volgende factoren:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.17
  - number: 2.17.a
    text: de aard, de grootte en de ligging van het bedrijf of de inrichting;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.17
  - number: 2.17.b
    text: |-
      de in het bedrijf of de inrichting aanwezige gevaren en de voor het bedrijf of de inrichting maatgevend geachte
      brandscenario’s bij de bepaling waarvan rekening is gehouden met eventueel voor het bedrijf of de inrichting door
      de overheid van toepassing verklaarde uitgangspunten van beveiliging tegen brand;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.17
  - number: 2.17.c
    text: |-
      het redelijkerwijs te verwachten aantal aanwezige werknemers en andere personen alsmede de tijdstippen waarop zij
      aanwezig zijn of plegen te zijn;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.17
  - number: 2.17.d
    text: |-
      het redelijkerwijs te verwachten aantal personen dat zich bij een ongeval of brand niet zelfstandig in veiligheid
      kan brengen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.17
  - number: 2.17.e
    text: de opkomsttijd en mogelijkheden van brandweer en andere hulpverleningsorganisaties;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.17
  - number: 2.17.f
    text: de aanwezigheid van een infrastructuur op het gebied van de arbeidsomstandigheden;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.17
  - number: 2.17.g
    text: de mogelijkheid om met andere arbeidsorganisaties samen te werken;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.17
  - number: 2.17.h
    text: de inschakeling van externe deskundigen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.17
  - number: 2.18.1
    text: |-
      De bedrijfshulpverlening wordt zodanig georganiseerd dat binnen enkele minuten na het plaatsvinden van een ongeval
      of brand de bedrijfshulpverleningstaken op adequate wijze kunnen worden vervuld.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.18
  - number: 2.18.2
    text: |-
      Zodanige organisatorische maatregelen worden genomen dat bij een ongeval of brand na aankomst van
      hulpverleningsorganisaties deze op adequate wijze kunnen worden bijgestaan.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.18
  - number: 2.18.3
    text: |-
      Onder alle omstandigheden en met inachtneming van [artikel 2.19][ref1] zijn bedrijfshulpverleners bereikbaar en
      beschikbaar om bij een ongeval of brand de bedrijfshulpverleningstaken te vervullen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '4'
  - number: 2.18.4
    text: |-
      Indien de veiligheid of de gezondheid van andere werknemers in de nabije omgeving kunnen worden bedreigd, worden
      door de betrokken werkgevers op het gebied van de bedrijfshulpverlening zodanige organisatorische maatregelen
      genomen dat de betrokken bedrijfshulpverleners bij een ongeval of brand over en weer bijstand kunnen verlenen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.18
  - number: 2.19.1
    text: |-
      Het aantal bedrijfshulpverleners is zodanig dat onder alle omstandigheden de vervulling van de taken op het gebied
      van de bedrijfshulpverlening gewaarborgd is.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.19
  - number: 2.19.2
    text: |-
      Onverminderd het eerste lid is in een bedrijf of inrichting waar ten hoogste 250 werknemers werkzaam plegen te
      zijn, ten minste één bedrijfshulpverlener per 50 of minder aanwezige werknemers aanwezig. Indien in een bedrijf of
      inrichting slechts één werknemer aanwezig is, beschikt deze over doeltreffende middelen om zich bij een ongeval of
      brand snel in veiligheid te kunnen stellen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.19
  - number: 2.19.3
    text: |-
      Onverminderd het eerste lid zijn in een bedrijf of inrichting waar meer dan 250 werknemers werkzaam plegen te zijn,
      in afwijking van het tweede lid, ten minste vijf bedrijfshulpverleners aanwezig. Het tweede lid, laatste volzin, is
      van toepassing.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.19
  - number: 2.19.4
    text: |-
      Indien werkgevers ter uitvoering van hun taken op het gebied van de bedrijfshulpverlening gezamenlijke
      bedrijfshulpverlening organiseren, worden de afspraken dienaangaande schriftelijk vastgelegd. In dat geval worden
      voor de toepassing van deze afdeling de betrokken bedrijven of inrichtingen als een geheel beschouwd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.19
  - number: 2.19.5
    text: |-
      De werkgevers die afspraken hebben gemaakt als bedoeld in het vierde lid worden geacht aan de verplichtingen
      op grond van deze afdeling te hebben voldaan, indien de bedrijfshulpverlening voor het geheel van de betrokken
      bedrijven of inrichtingen gewaarborgd is.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.19
  - number: '2.20'
    text: |-
      Ten behoeve van de werknemers zijn voldoende biljetten opgehangen waarop op eenvoudige wijze is aangegeven wat te
      doen indien zich een ongeval of brand voordoet.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.20
  - number: 2.21.1
    text: De bedrijfshulpverleners zijn zodanig opgeleid, dat de bedrijfshulpverlening gewaarborgd is.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.21
  - number: 2.21.2
    text: |-
      Bij ministeriële regeling kunnen voor daarbij aan te wijzen categorieën bedrijven of inrichtingen of in verband
      met bijzondere gevaren, regels worden gesteld met betrekking tot opleiding, deskundigheid en ervaring van
      bedrijfshulpverleners.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.21
  - number: '2.22'
    text: |-
      Voor bedrijfshulpverleners worden herhalingscursussen en oefeningen of andere activiteiten georganiseerd
      waaraan de bedrijfshulpverleners deelnemen. Deze cursussen, oefeningen of activiteiten zijn van een zodanige
      inhoud en frequentie dat de kennis en vaardigheden van de bedrijfshulpverleners op het voor een adequate
      bedrijfshulpverlening vereiste niveau gehandhaafd blijven.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.22
  - number: '2.23'
    text: 'In deze afdeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.23
  - number: 2.23.a
    text: |-
      richtlijn: [Richtlijn nr. 92/57/EEG](31992L0057) van de Raad van de Europese Gemeenschappen van 24 juni 1992
      betreffende de minimumvoorschriften inzake veiligheid en gezondheid voor tijdelijke en mobiele bouwplaatsen (*PbEG*
      L 245);
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.23
  - number: 2.23.b
    text: |-
      coördinator voor de ontwerpfase: degene die belast is met de in [artikel 2.30][ref1] genoemde taken inzake
      veiligheid en gezondheid gedurende de studie-, de ontwerp- en de uitwerkingsfase van het ontwerp van een bouwwerk;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.23
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '5'
  - number: 2.23.c
    text: |-
      coördinator voor de uitvoeringsfase: degene die belast is met de in [artikel 2.34][ref1] genoemde taken inzake
      veiligheid en gezondheid gedurende de totstandbrenging van een bouwwerk.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.23
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '5'
  - number: '2.24'
    text: |-
      Voor de toepassing van [artikel 16, achtste lid, van de wet][ref1] worden aangewezen de opdrachtgever, de
      ontwerpende en de uitvoerende partij.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel16
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.24
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '16'
  - number: '2.25'
    text: |-
      Deze afdeling is niet van toepassing op arbeid verricht in winningsindustrieën als bedoeld in de
      [afdelingen 6][ref1] en [6a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.25
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '2'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0008498
        hoofdstuk: '2'
        afdeling: 6A
  - number: 2.26.1
    text: |-
      Overeenkomstig het bij ministeriële regeling voorgeschreven model wordt een daartoe aangewezen ambtenaar als
      bedoeld in [artikel 24, eerste lid, van de wet][ref1] vóór de aanvang van de werkzaamheden op de bouwplaats, in
      kennis gesteld van de voorgenomen totstandbrenging van een bouwwerk, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.26
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 2.26.1.a
    text: |-
      de geraamde duur van de totstandbrenging van het bouwwerk meer dan 30 werkdagen beslaat en op die bouwplaats meer
      dan 20 werknemers tegelijkertijd arbeid zullen gaan verrichten, of
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.26
  - number: 2.26.1.b
    text: met de totstandbrenging van het bouwwerk meer dan 500 mensdagen zullen zijn gemoeid.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.26
  - number: 2.26.2
    text: |-
      De kennisgeving wordt zichtbaar op de bouwplaats aangebracht. Indien met betrekking tot de in de kennisgeving
      vermelde gegevens veranderingen optreden, wordt deze dienovereenkomstig gewijzigd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.26
  - number: 2.27.1
    text: |-
      Ten aanzien van een bouwwerk als bedoeld in bijlage II bij de richtlijn of een bouwwerk ten aanzien waarvan een
      kennisgeving als bedoeld in [artikel 2.26][ref1] wordt gedaan, wordt een veiligheids- en gezondheidsplan opgesteld,
      waarin ten minste vermeld worden:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.27
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '5'
  - number: 2.27.1.a
    text: een beschrijving van het tot stand te brengen bouwwerk;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.27
  - number: 2.27.1.b
    text: |-
      een overzicht van de bij de totstandbrenging van het bouwwerk betrokken natuurlijke of rechtspersonen op de
      bouwplaats;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.27
  - number: 2.27.1.c
    text: de naam van de coördinator voor de ontwerpfase;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.27
  - number: 2.27.1.d
    text: de naam van de coördinator voor de uitvoeringsfase;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.27
  - number: 2.27.1.e
    text: |-
      de risico-inventarisatie en -evaluatie van de gevaren overeenkomstig [artikel 5 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.27
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
  - number: 2.27.1.f
    text: |-
      de wijze waarop uitvoering wordt gegeven aan de samenwerking tussen werkgevers en in voorkomende gevallen
      zelfstandig werkenden op de bouwplaats, welke voorzieningen daarbij zullen worden getroffen en op welke wijze op
      die voorzieningen toezicht zal worden uitgeoefend;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.27
  - number: 2.27.1.g
    text: |-
      de wijze waarop uitvoering wordt gegeven aan de samenwerking en het overleg tussen werkgevers en werknemers op de
      bouwplaats en de wijze waarop de voorlichting en het onderricht van deze werknemers plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.27
  - number: 2.27.2
    text: |-
      In de ontwerpfase van het bouwproces worden in ieder geval de gegevens, bedoeld in het eerste lid, onder *a*,
      *c*, en *e*, vermeld. De gegevens, bedoeld in het eerste lid, onder *b*, *d*, *f* en *g*, worden in de ontwerpfase
      vermeld, tenzij deze gegevens in die fase redelijkerwijs niet kenbaar zijn. In dat geval geschiedt de invulling
      daarvan vóór de aanvang van de werkzaamheden in de uitvoeringsfase van het bouwproces.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.27
  - number: 2.27.3
    text: |-
      Indien met betrekking tot de in het eerste lid bedoelde gegevens gedurende de ontwerpfase of uitvoeringsfase van
      het bouwproces veranderingen optreden wordt het plan dienovereenkomstig gewijzigd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.27
  - number: 2.27.4
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.27
  - number: '2.28'
    text: |-
      Ten behoeve van een bouwplaats waar twee of meer werkgevers dan wel één werkgever en een of meer zelfstandig
      werkenden dan wel twee of meer zelfstandig werkenden arbeid doen of gaan verrichten in verband met de
      totstandbrenging van een bouwwerk, worden een of meer cordinatoren voor de ontwerpfase aangesteld.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.28
  - number: '2.29'
    text: |-
      In de studie-, de ontwerp- en de uitwerkingsfase van het ontwerp van een bouwwerk worden bij de bouwkundige,
      technische of organisatorische keuzen in verband met de planning van de verschillende onderdelen van het
      bouwwerk of de fasen waarin het bouwwerk of de onderdelen daarvan tot stand worden gebracht, alsmede bij de
      raming van de duur van deze onderdelen of fasen, de [artikelen 3][ref1], [5, eerste en derde lid][ref2], en
      [8 van de wet][ref3] in acht genomen. Voor zover van toepassing wordt daarbij tevens rekening gehouden met
      veiligheids- en gezondheidsplannen als bedoeld in [artikel 2.27][ref4], die gedurende de ontwerpfase met betrekking
      tot verschillende onderdelen van het bouwwerk of de fasen waarin het bouwwerk of de onderdelen daarvan tot stand
      worden gebracht, zijn of worden opgesteld en met dossiers als bedoeld in [artikel 2.30, onder ][ref5] alsmede met
      de wijzigingen daarvan op grond van [artikel 2.34, onder g][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref6]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.29
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0010346
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '5'
      - id: ref5
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '5'
      - id: ref6
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '5'
  - number: '2.30'
    text: 'De coördinator voor de ontwerpfase heeft tot taak om:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.30
  - number: 2.30.a
    text: |-
      de uitvoering van [artikel 2.29][ref1] te coördineren;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.30
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '5'
  - number: 2.30.b
    text: |-
      te zorgen voor de opstelling van een veiligheids- en gezondheidsplan als bedoeld in [artikel 2.27][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.30
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '5'
  - number: 2.30.c
    text: |-
      een dossier samen te stellen, waarin de voor de veiligheid en gezondheid van werknemers van belang zijnde
      bouwkundige en technische kenmerken of kenmerken betreffende de inrichting of outillage van het bouwwerk zijn
      beschreven waarmee bij het verrichten van mogelijke latere werkzaamheden aan het bouwwerk rekening moet worden
      gehouden, dat is bestemd voor de eigenaar of beheerder van het bouwwerk dan wel degene die kan beslissen over de
      uitvoering van bedoelde werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.30
  - number: '2.31'
    text: 'Overeenkomstig het bij of krachtens deze paragraaf bepaalde:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.31
  - number: 2.31.a
    text: |-
      zorgt de opdrachtgever ervoor dat de bij of krachtens de [artikelen 2.26 tot en met 2.29][ref1] gestelde
      voorschriften worden nageleefd;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.31
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '5'
  - number: 2.31.b
    text: 'neemt de opdrachtgever zodanige maatregelen en richt hij de werkzaamheden zodanig in dat:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.31
  - number: 2.31.b.1°
    text: |-
      door de coördinator voor de ontwerpfase de taken worden uitgeoefend, bedoeld in [artikel 2.30][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.31
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '5'
  - number: 2.31.b.2°
    text: de coördinator voor de ontwerpfase zijn taken naar behoren kan vervullen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.31
  - number: 2.31.c
    text: |-
      zorgt de opdrachtgever ervoor dat het veiligheids- en gezondheidsplan, bedoeld in [artikel 2.27][ref1], deel
      uitmaakt van het bestek betreffende het bouwwerk.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.31
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '5'
  - number: 2.32.1
    text: |-
      Ten aanzien van een opdrachtgever-consument zorgt de ontwerpende partij ervoor dat wordt voldaan aan
      [artikel 2.31][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.32
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '5'
  - number: 2.32.2
    text: |-
      Indien twee of meer ontwerpende partijen zich ieder afzonderlijk jegens de opdrachtgever-consument hebben verbonden
      om een deel van het ontwerp van een bouwwerk tot stand te brengen, wordt in een schriftelijke overeenkomst tussen
      deze partijen vastgelegd door wie aan de verplichtingen, bedoeld in [artikel 2.31][ref1], wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.32
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '5'
  - number: '2.33'
    text: |-
      Ten behoeve van een bouwplaats waar twee of meer werkgevers dan wel één werkgever en een of meer zelfstandig
      werkenden dan wel twee of meer zelfstandig werkenden arbeid gaan of doen verrichten in verband met de
      totstandbrenging van een bouwwerk, worden een of meer coördinatoren voor de uitvoeringsfase aangesteld.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.33
  - number: '2.34'
    text: 'De coördinator voor de uitvoeringsfase heeft tot taak om:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.34
  - number: 2.34.a
    text: |-
      de door werkgevers respectievelijk zelfstandig werkenden op grond van de [artikelen 2.38][ref1] en [2.39][ref2]
      te nemen maatregelen bij de technische of organisatorische keuzen in verband met de planning van de verschillende
      onderdelen van het bouwwerk of de fasen waarin het bouwwerk of de onderdelen daarvan tot stand worden gebracht,
      alsmede bij de raming van de duur van de uitvoering van deze onderdelen of fasen, te coördineren, opdat die
      werkgevers en, indien nodig ter bescherming van de veiligheid en gezondheid van de werknemers, zelfstandig
      werkenden op de bouwplaats, de betreffende maatregelen op samenhangende wijze toepassen;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.34
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '5'
  - number: 2.34.b
    text: |-
      de samenwerking tussen de werkgevers die tegelijkertijd of elkaar opvolgend arbeid doen verrichten te organiseren
      en te coördineren als bedoeld in [artikel 2.27, eerste lid, onder f][ref1] en daarbij in voorkomende gevallen mede
      de op de bouwplaats werkzame zelfstandig werkenden te betrekken;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.34
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '5'
  - number: 2.34.c
    text: |-
      het in [artikel 2.27, eerste lid, onder f][ref1] bedoelde toezicht te coördineren;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.34
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '5'
  - number: 2.34.d
    text: de voorlichting van werknemers op de bouwplaats te coördineren;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.34
  - number: 2.34.e
    text: de nodige maatregelen te nemen opdat alleen bevoegde personen de bouwplaats kunnen betreden;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.34
  - number: 2.34.f
    text: |-
      ervoor te zorgen dat de gegevens, bedoeld in [artikel 2.27, eerste lid, onder b, d, f en g][ref1], voor zover
      nodig, in het veiligheids- en gezondheidsplan worden vermeld;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.34
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '5'
  - number: 2.34.g
    text: |-
      ervoor te zorgen dat het veiligheids- en gezondheidsplan, bedoeld in [artikel 2.27][ref1], en het dossier, bedoeld
      in [artikel 2.30, onder c][ref2], worden aangepast indien de voortgang van het bouwwerk of de onderdelen daarvan
      daartoe aanleiding geven;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.34
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '5'
  - number: 2.34.h
    text: |-
      zo nodig aanwijzingen te geven indien werkgevers of zelfstandig werkenden naar zijn oordeel niet of in onvoldoende
      mate of op onjuiste wijze uitvoering geven aan een samenhangende toepassing van hun verplichtingen als bedoeld
      onder *a* en *b*.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.34
  - number: 2.35.1
    text: |-
      De opdrachtgever zorgt ervoor dat de verplichtingen, bedoeld in de [artikelen 2.33][ref1] en [2.34][ref2], zijn
      vastgelegd in een schriftelijke overeenkomst met de uitvoerende partij.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.35
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '5'
  - number: 2.35.2
    text: |-
      Indien twee of meer uitvoerende partijen zich ieder afzonderlijk jegens de opdrachtgever verbonden hebben om
      een deel van het bouwwerk tot stand te brengen, zorgt de opdrachtgever ervoor dat de verplichtingen, bedoeld
      in de [artikelen 2.33][ref1] en [2.34][ref2], zijn vastgelegd in een schriftelijke overeenkomst met een van die
      uitvoerende partijen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.35
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '5'
  - number: 2.36.1
    text: |-
      Ten aanzien van een opdrachtgever-consument zorgt de ontwerpende partij ervoor dat wordt voldaan aan
      [artikel 2.35][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.36
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '5'
  - number: 2.36.2
    text: |-
      [Artikel 2.32, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.36
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '5'
  - number: 2.37.1
    text: |-
      Overeenkomstig de [artikelen 2.33][ref1] en [2.34][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.37
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '5'
  - number: 2.37.1.a
    text: zorgt de uitvoerende partij ervoor dat een coördinator voor de uitvoeringsfase wordt aangesteld;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.37
  - number: 2.37.1.b
    text: 'neemt de uitvoerende partij zodanige maatregelen en richt hij de werkzaamheden zodanig in dat:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.37
  - number: 2.37.1.b.1°
    text: |-
      door de coördinator voor de uitvoeringsfase de taken worden uitgeoefend, bedoeld in [artikel 2.34][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.37
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '5'
  - number: 2.37.1.b.2°
    text: de coördinator voor de uitvoeringsfase zijn taken naar behoren kan vervullen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.37
  - number: 2.37.2
    text: |-
      De uitvoerende partij zorgt ervoor dat de wijze waarop uitvoering wordt gegeven aan de samenwerking en het overleg
      tussen werkgevers en werknemers op de bouwplaats op passende wijze wordt gecoördineerd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.37
  - number: 2.38.1
    text: |-
      Bij de uitvoering van zijn verplichtingen op grond van de [artikelen 3][ref1],[ 5][ref2], [8][ref3] en
      [19, eerste lid, van de wet][ref4] neemt de werkgever, die met betrekking tot de totstandbrenging van een bouwwerk
      op een bouwplaats arbeid doet verrichten, doeltreffende maatregelen ter bescherming van de veiligheid en de
      gezondheid van zijn werknemers op die bouwplaats. Deze maatregelen hebben met name betrekking op:


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0010346#Artikel19
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.38
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0010346
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0010346
        artikel: '19'
  - number: 2.38.1.a
    text: |-
      het in goede orde en met voldoende bescherming van de veiligheid en gezondheid van de werknemers in stand houden
      van de bouwplaats;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.38
  - number: 2.38.1.b
    text: |-
      de veilige plaatsing van de verschillende werkplekken op de bouwplaats, rekening houdend met de
      toegangsmogelijkheden tot die bouwplaats en de verbindingswegen daarop;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.38
  - number: 2.38.1.c
    text: het interne transport van de verschillende materialen op de bouwplaats;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.38
  - number: 2.38.1.d
    text: |-
      het onderhoud, de controle vóór inbedrijfstelling en de periodieke controle van installaties en toestellen,
      teneinde gebreken te voorkomen die de veiligheid en gezondheid van werknemers in gevaar kunnen brengen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.38
  - number: 2.38.1.e
    text: |-
      de afbakening en inrichting van zones voor definitieve en tussenopslag van verschillende materialen, met name in
      geval van gevaarlijke materialen of stoffen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.38
  - number: 2.38.1.f
    text: de voorzieningen voor de verwijdering van gebruikte gevaarlijke materialen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.38
  - number: 2.38.1.g
    text: de opslag en de verwijdering of de afvoer van afval en puin;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.38
  - number: 2.38.1.h
    text: |-
      de aanpassing van de daadwerkelijke duur van de uit te voeren werkzaamheden met betrekking tot de totstandbrenging
      van het bouwwerk of de fasen waarin die werkzaamheden worden uitgevoerd, afhankelijk van de ontwikkeling met
      betrekking tot de voortgang van het bouwwerk op de bouwplaats;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.38
  - number: 2.38.1.i
    text: de samenwerking met andere werkgevers en zelfstandig werkenden op de bouwplaats;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.38
  - number: 2.38.1.j
    text: de wisselwerking met exploitatiewerkzaamheden op of in de nabijheid van de bouwplaats.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.38
  - number: 2.38.2
    text: |-
      De mede op grond van het eerste lid te nemen maatregelen voldoen in ieder geval aan de [afdelingen 1][ref1] en
      [2 van hoofdstuk 3][ref2] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.38
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008498
        hoofdstuk: '3'
        afdeling: '2'
  - number: 2.38.3
    text: |-
      De werkgever is verplicht tot naleving van en medewerking aan het veiligheids- en gezondheidsplan, bedoeld in
      [artikel 2.27][ref1], voor zover en op de wijze als daarin ten aanzien van de door hem te verrichten of te doen
      verrichten werkzaamheden is bepaald en daarbij rekening te houden met de aanwijzingen van de coördinator voor de
      uitvoeringsfase.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.38
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '5'
  - number: 2.38.4
    text: |-
      Voor zover de werkgever met betrekking tot de totstandbrenging van een bouwwerk op een
      bouwplaats zelf arbeid verricht, zijn ter bescherming van de veiligheid en de gezondheid
      van de werknemers op die bouwplaats [artikel 11 van de wet][ref1], [hoofdstuk 7][ref2] en de
      [artikelen 8.1, eerste tot en met vijfde lid, en zevende lid][ref3], [8.2][ref4] en [8.3][ref5] van dit besluit ten
      aanzien van hem van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk7
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0008498#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0008498#Artikel8
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.38
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0008498
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0008498
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0008498
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '1'
      - id: ref5
        bwb_id: BWBR0008498
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '1'
  - number: '2.39'
    text: |-
      Ten aanzien van een zelfstandig werkende die met betrekking tot de totstandbrenging van een bouwwerk op een
      bouwplaats arbeid verricht, zijn ter bescherming van de veiligheid en de gezondheid van de werknemers op die
      bouwplaats de [artikelen 11][ref1] en [19, eerste lid, van de wet][ref2], [artikel 2.38][ref3], [hoofdstuk 7][ref4]
      en de [artikelen 8.1, eerste tot en met vijfde lid, en zevende lid][ref5], [8.2][ref6] en [8.3][ref7] van dit
      besluit van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk7
      [ref5]: https://wetten.overheid.nl/BWBR0008498#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0008498#Artikel8
      [ref7]: https://wetten.overheid.nl/BWBR0008498#Artikel8
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.39
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '19'
      - id: ref3
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '5'
      - id: ref4
        bwb_id: BWBR0008498
        hoofdstuk: '7'
      - id: ref5
        bwb_id: BWBR0008498
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '1'
      - id: ref6
        bwb_id: BWBR0008498
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '1'
      - id: ref7
        bwb_id: BWBR0008498
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '1'
  - number: '2.40'
    text: |-
      Deze afdeling is niet van toepassing op arbeid verricht in winningsindustrieën in dagbouw met behulp van
      baggermaterieel.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.40
  - number: 2.41.1
    text: |-
      Indien bemande arbeidsplaatsen in de winningsindustrie in gebruik zijn wordt toezicht uitgeoefend door een
      verantwoordelijke persoon.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.41
  - number: 2.41.2
    text: |-
      Werkzaamheden waaraan een bijzonder gevaar is verbonden worden uitsluitend opgedragen aan vakbekwaam personeel met
      voldoende ervaring en uitgevoerd overeenkomstig de verstrekte instructies.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.41
  - number: 2.41.3
    text: |-
      Op arbeidsplaatsen in de winningsindustrie worden met regelmatige tussenpozen de nodige veiligheidsoefeningen
      gehouden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.41
  - number: 2.41.4
    text: |-
      Situaties die een ernstig gevaar vormen worden onverwijld gemeld aan een daartoe aangewezen ambtenaar als bedoeld
      in [artikel 24 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.41
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 2.41.5
    text: Op de arbeidsplaats wordt op een te begrijpen wijze gecommuniceerd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.41
  - number: 2.41.6
    text: |-
      Opdat in geval van nood onmiddellijk hulp-, vlucht-, evacuatie- en reddingsmaatregelen kunnen worden genomen,
      worden, in aanvulling op [afdeling 4 van hoofdstuk 2][ref1], de nodige alarm- of andere communicatiesystemen ter
      beschikking gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.41
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '2'
        afdeling: '4'
  - number: 2.41.7
    text: |-
      Indien op een arbeidsplaats in de winningsindustrie slechts één werknemer aanwezig is, beschikt deze over
      telecommunicatiemiddelen om zich met anderen in verbinding te kunnen stellen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.41
  - number: 2.42.1
    text: |-
      Voor de toepassing van [artikel 19, tweede lid, van de wet][ref1] worden aangewezen de werkzaamheden verricht in
      de winningsindustrie in dagbouw, de ondergrondse winningsindustrie en de winningsindustrie die delfstoffen wint met
      behulp van boringen.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel19
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '19'
  - number: 2.42.2
    text: |-
      Voor de aanvang van het werk wordt een veiligheids- en gezondheidsdocument opgesteld, waarin ten minste vermeld
      worden:
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42
  - number: 2.42.2.a
    text: |-
      de risico-inventarisatie en -evaluatie van de gevaren, bedoeld in [artikel 5 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
  - number: 2.42.2.b
    text: |-
      de maatregelen, bedoeld in [artikel 5 van de wet][ref1], waarbij met name aandacht is besteed aan de
      maatregelen die zijn of worden genomen om aan de voorschriften van deze afdeling en de [afdelingen 1][ref2],
      met uitzondering van [paragraaf 2a van die afdeling][ref3], [3][ref4], [3A][ref5], [3B][ref6] en
      [3C van hoofdstuk 3 van dit besluit][ref7] te voldoen;


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk3
      [ref5]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk3
      [ref6]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk3
      [ref7]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0008498
        hoofdstuk: '3'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0008498
        hoofdstuk: '3'
        paragraaf: 2a
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0008498
        hoofdstuk: '3'
        afdeling: '3'
      - id: ref5
        bwb_id: BWBR0008498
        hoofdstuk: '3'
        afdeling: 3A
      - id: ref6
        bwb_id: BWBR0008498
        hoofdstuk: '3'
        afdeling: 3B
      - id: ref7
        bwb_id: BWBR0008498
        hoofdstuk: '3'
        afdeling: 3C
  - number: 2.42.2.c
    text: |-
      de maatregelen die zijn genomen om herhaling van ongevallen met ernstig letsel, dodelijke ongevallen of situaties
      als bedoeld in [artikel 2.41, vierde lid][ref1], te voorkomen;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '6'
  - number: 2.42.2.d
    text: |-
      de wijze waarop voldaan is aan [artikel 19, tweede lid, van de wet][ref1], indien op de arbeidsplaats in de
      winningsindustrie meerdere werkgevers arbeid doen verrichten;


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel19
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '19'
  - number: 2.42.2.e
    text: |-
      de gegevens waaruit blijkt dat het ontwerp, het gebruik en het onderhoud van de arbeidsplaats in de
      winningsindustrie alsmede de arbeidsmiddelen veilig zijn.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42
  - number: 2.42.3
    text: |-
      In aanvulling op het tweede lid, onder *d*, coördineert de werkgever die verantwoordelijk is voor de arbeidsplaats
      in de winningsindustrie, de uitvoering van alle maatregelen inzake veiligheid en gezondheid en geeft hij in het
      veiligheids- en gezondheidsdocument het doel, de maatregelen en de wijze van uitvoering van deze coördinatie aan.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42
  - number: 2.42.4
    text: |-
      Het veiligheids- en gezondheidsdocument wordt herzien bij iedere belangrijke wijziging, uitbreiding of verbouwing
      van de arbeidsplaats in de winningsindustrie.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42
  - number: 2.42.5
    text: |-
      Een afschrift van het veiligheids- en gezondheidsdocument wordt gezonden aan de ondernemingsraad of
      personeelsvertegenwoordiging of bij het ontbreken daarvan, aan de belanghebbende werknemers.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42
  - number: 2.42.6
    text: De werkzaamheden worden overeenkomstig het veiligheids- en gezondheidsdocument uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42
  - number: 2.42a.1
    text: |-
      Wanneer de veiligheid en de gezondheid van de werknemers dat vereisen, wordt een systeem van werkvergunningen
      toegepast voor de uitvoering van gevaarlijke werkzaamheden en voor de uitvoering van gewoonlijk ongevaarlijke
      werkzaamheden die in combinatie met andere werkzaamheden ernstige risico's met zich mee kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42a
  - number: 2.42a.2
    text: |-
      De werkvergunning wordt door een verantwoordelijke persoon gegeven voor de aanvang van de werkzaamheden en daarbij
      wordt aangegeven aan welke voorschriften moet worden voldaan en welke voorzorgsmaatregelen moeten worden genomen
      voor, tijdens en na de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42a
  - number: 2.42b
    text: |-
      Op doelmatige plaatsen is een register aanwezig waarin van degenen die werkzaamheden verrichten in de
      winningsindustrie in dagbouw, de ondergrondse winningsindustrie en de winningsindustrie met behulp van boringen
      zijn vermeld:
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42b
  - number: 2.42b.a
    text: naam, voornamen, geslacht;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42b
  - number: 2.42b.b
    text: |-
      aard, nummer en een afschrift van een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42b
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 2.42b.c
    text: gegevens en data betreffende indiensttreding en tewerkstelling;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42b
  - number: 2.42b.d
    text: de onderscheiden functies, waarin zij zijn tewerkgesteld en de data van tewerkstelling daarin;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42b
  - number: 2.42b.e
    text: |-
      data en aard van geneeskundige onderzoeken en geneeskundige verklaringen, voorzover deze op grond van dit besluit
      zijn vereist;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42b
  - number: 2.42b.f
    text: |-
      gegevens van certificaten, voorzover die voor het verrichten van de werkzaamheden op grond van dit besluit en het
      [Mijnbouwbesluit][ref1] zijn vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0014394
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42b
    references:
      - id: ref1
        bwb_id: BWBR0014394
  - number: 2.42c.1
    text: |-
      In aanvulling op [artikel 9, eerste lid, van de wet][ref1] doet de werkgever tevens onverwijld mededeling aan een
      daartoe aangewezen ambtenaar als bedoeld in [artikel 24 van de wet][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42c
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 2.42c.1.a
    text: |-
      van alle belangrijke bij het verkeer of vervoer voorgekomen bijzondere gebeurtenissen die de veiligheid in gevaar
      hebben gebracht of hadden kunnen brengen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42c
  - number: 2.42c.1.b
    text: |-
      wanneer de veiligheid op enigerlei wijze wordt bedreigd of personen zich in levensgevaar bevinden of bevonden
      hebben;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42c
  - number: 2.42c.1.c
    text: |-
      van alle bij het gebruik, het vervoer of de opslag van ontplofbare stoffen opgetreden voorvallen, die de veiligheid
      in gevaar hadden kunnen brengen of hebben gebracht.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42c
  - number: 2.42c.2
    text: |-
      Eenmaal per maand wordt van alle ongevallen en andere voorvallen die de veiligheid in gevaar hebben
      gebracht of hadden kunnen brengen, opgave gedaan aan een daartoe aangewezen ambtenaar als bedoeld in
      [artikel 24 van de wet][ref1], voorzover er geen melding is gedaan als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42c
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 2.42d
    text: |-
      Op een arbeidsplaats in de winningsindustrie die delfstoffen wint met behulp van boringen zijn naast de
      voorschriften van [afdeling 6][ref1] van dit hoofdstuk tevens de voorschriften van deze afdeling van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42d
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '2'
        afdeling: '6'
  - number: 2.42e.1
    text: |-
      Voor het uitvoeren van een zo goed mogelijk arbeidsomstandighedenbeleid, bedoeld in [artikel 3 van de wet][ref1],
      is een veiligheids- en gezondheidszorgsysteem aanwezig. Dit systeem omvat het geheel van beleid, organisatie,
      planning, uitvoering, monitoring, evaluatie, doorlichting en verbetering, dat wordt gehanteerd voor de beheersing
      van de veiligheid en de gezondheid.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42e
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '3'
  - number: 2.42e.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42e
  - number: 2.42f.1
    text: |-
      Onverminderd [artikel 2.42][ref1] blijkt uit het veiligheids- en gezondheidsdocument dat alle nodige maatregelen
      zijn genomen om de veiligheid en de gezondheid van de werknemers zowel in normale situaties als in noodsituaties te
      beschermen. Hiertoe bevat het document het volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42f
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '6'
  - number: 2.42f.1.a
    text: |-
      een opgave van de aan de arbeidsplaats verbonden specifieke risicobronnen, met inbegrip van elke activiteit op
      die plaats, die ongevallen kunnen teweegbrengen met ernstige gevolgen voor de veiligheid en de gezondheid van de
      betrokken werknemers;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42f
  - number: 2.42f.1.b
    text: een evaluatie van de risico's van de in onderdeel a bedoelde specifieke bronnen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42f
  - number: 2.42f.1.c
    text: |-
      het bewijs dat afdoende voorzorgsmaatregelen zijn genomen om de in onderdeel a bedoelde ongevallen te vermijden, de
      uitbreiding van ongevallen te beperken en de arbeidsplaats in noodsituaties op een doelmatige en beheerste wijze te
      kunnen evacueren;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42f
  - number: 2.42f.1.d
    text: |-
      het bewijs dat er een veiligheids- en gezondheidszorgsysteem als bedoeld in [artikel 2.42e][ref1] gehanteerd wordt
      dat adequaat is om de voorschriften bij of krachtens dit besluit die betrekking hebben op de veiligheid en de
      bescherming van de gezondheid van de werknemers, zowel in gewone situaties als in noodsituaties na te leven.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42f
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 6A
  - number: 2.42f.2
    text: |-
      Bij de planning en tenuitvoerlegging van alle in [artikel 3.2, eerste lid, tweede volzin][ref1], bedoelde fasen
      worden de in het desbetreffende veiligheids- en gezondheidsdocument vermelde procedures en uitvoeringsbepalingen in
      acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42f
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
  - number: 2.42f.3
    text: |-
      De verschillende werkgevers die verantwoordelijk zijn voor de verschillende arbeidsplaatsen werken in voorkomend
      geval samen bij het opstellen van de veiligheids- en gezondheidsdocumenten, bedoeld in [artikel 2.42][ref1], en het
      voorbereiden van de maatregelen die nodig zijn om de veiligheid en de gezondheid van de werknemers te garanderen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42f
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '6'
  - number: 2.42f.4
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste, tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42f
  - number: 2.42g
    text: |-
      Op alle normaliter bemenste arbeidsplaatsen worden op gezette tijden veiligheidsoefeningen gehouden die erop
      gericht zijn:
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42g
  - number: 2.42g.a
    text: |-
      werknemers aan wie in noodgevallen concrete taken worden opgedragen, waarbij noodapparatuur moet worden gebruikt,
      gehanteerd of bediend, hierin te trainen en na te gaan of zij bekwaam zijn die taken te vervullen;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42g
  - number: 2.42g.b
    text: |-
      alle bij de oefeningen gebruikte noodapparatuur te controleren, schoon te maken en zo nodig opnieuw op te laden
      of te vervangen en alle gebruikte draagbare apparatuur opnieuw naar de plaats te brengen waar zij zich normaliter
      bevindt;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42g
  - number: 2.42g.c
    text: na te gaan of de reddingsvaartuigen gebruiksklaar zijn.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42g
  - number: 2.42h.1
    text: De werknemers worden getraind in het uitvoeren van de handelingen die in noodgevallen moeten worden verricht.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42h
  - number: 2.42h.2
    text: |-
      Op mijnbouwinstallaties waar werknemers langere tijd verblijven zijn bij helikopterbewegingen op het helikopterdek
      voldoende werknemers aanwezig die tot taak hebben bij noodgevallen in actie te komen. Deze werknemers zijn hiertoe
      voldoende getraind.
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42h
  - number: 2.42h.3
    text: |-
      In aanvulling op het eerste en tweede lid worden werknemers die werkzaam zijn op mijnbouwinstallaties ook getraind
      in het uitvoeren van de handelingen die op een specifieke arbeidsplaats moeten worden verricht. Deze handelingen
      worden voor de desbetreffende arbeidsplaats nader omschreven in het in [artikel 2.42][ref1] bedoelde veiligheids-
      en gezondheidsdocument.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42h
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '6'
  - number: 2.42h.4
    text: |-
      Werknemers die werkzaam zijn op mijnbouwinstallaties worden getraind in de toepassing van overlevingstechnieken,
      met inachtneming van de criteria die zijn vastgesteld in het in [artikel 2.42][ref1] bedoelde veiligheids- en
      gezondheidsdocument.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42h
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '6'
  - number: 2.42i
    text: |-
      Voor zover de [Wet op de ondernemingsraden][ref1] niet van toepassing is, vindt raadpleging en deelneming van de
      werknemers plaats overeenkomstig artikel 11 van [richtlijn 89/391/EEG](31989L0391) van de Raad van de Europese
      Gemeenschappen van 12 juni 1989 betreffende de tenuitvoerlegging van maatregelen ter bevordering van de verbetering
      van de veiligheid en gezondheid van de werknemers op het werk (Pb EG L 183).


      [ref1]: https://wetten.overheid.nl/BWBR0002747
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.42i
    references:
      - id: ref1
        bwb_id: BWBR0002747
  - number: 2.43.1
    text: |-
      Voor de toepassing van dit artikel wordt onder nachtdienst verstaan hetgeen daaronder wordt verstaan in de
      [Arbeidstijdenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007671
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.43
    references:
      - id: ref1
        bwb_id: BWBR0007671
  - number: 2.43.2
    text: |-
      Iedere werknemer die voor de eerste keer arbeid in nachtdienst gaat verrichten wordt, in aanvulling
      op [artikel 18 van de wet][ref1], in de gelegenheid gesteld om vóór de aanvang van die arbeid een
      arbeidsgezondheidskundig onderzoek te ondergaan.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel18
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.43
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '18'
  - number: '2.44'
    text: |-
      De [afdelingen 2][ref1], [4][ref2] en [7 van dit hoofdstuk][ref3] zijn niet van toepassing op arbeid verricht in
      respectievelijk op een luchtvaartuig, een zeeschip of een binnenvaartuig dan wel een voertuig op een openbare weg
      of een spoorweg.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.44
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008498
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0008498
        hoofdstuk: '2'
        afdeling: '7'
  - number: '2.45'
    text: |-
      Op thuiswerk zijn de [afdelingen 3][ref1] en [4 van dit hoofdstuk][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel2.45
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0008498
        hoofdstuk: '2'
        afdeling: '4'
  - number: '3.1'
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.1
  - number: 3.1.a
    text: 'elektrische installatie: een samenstel van elektrisch materieel, leidingen en bijbehoren van leidingen;'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.1
  - number: 3.1.b
    text: |-
      elektrisch materieel: delen of gedeelten van een elektrische installatie die dienen voor de opwekking, het
      transport en de toepassing van elektrische energie;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.1
  - number: 3.1.c
    text: |-
      explosieve atmosfeer: een mengsel van lucht en brandbare stoffen in de vorm van gassen, dampen, nevels of stof,
      onder atmosferische omstandigheden waarin de verbranding zich na ontsteking uitbreidt tot het gehele niet verbrande
      mengsel;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.1
  - number: 3.1.d
    text: |-
      gebruik van elektriciteit: iedere activiteit met betrekking tot een elektrische installatie waaronder in ieder
      geval wordt begrepen de bouw, ingebruikneming of buitengebruikstelling, bediening, reparatie, ombouwing, onderhoud
      en inspectie alsmede het werken in de nabijheid van een elektrische installatie;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.1
  - number: 3.1.e
    text: |-
      hoogspanning: een spanning waarvan de waarde bij wisselspanning hoger is dan 1000 Volt effectief tussen de fasen
      of 600 Volt effectief tussen een fase en aarde en bij gelijkspanning hoger is dan 1500 Volt tussen de polen of 900
      Volt tussen een van de polen en aarde;
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.1
  - number: 3.1.f
    text: 'laagspanning: een spanning met een waarde lager dan hoogspanning.'
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.1
  - number: 3.1a
    text: |-
      De [artikelen 3.3, eerste lid][ref1],[ 3.4, eerste lid][ref2], wat betreft het ontwerp en de inrichting van
      tot een gebouw als bedoeld in [artikel 1, eerste lid, onder c, van de Woningwet][ref3] behorende elektrische
      installaties, [3.6, tweede lid][ref4], [3.7, vijfde lid][ref5], [3.11, eerste lid][ref6], wat betreft het
      voorschrift dat vloeren van arbeidsplaatsen zoveel mogelijk vrij van gevaarlijke hellingen zijn en voorts
      zoveel mogelijk vast en stabiel, en derde lid, [3.18, tweede lid, tweede zin, en derde lid][ref7], en
      [3.24, eerste lid, en tweede lid, eerste zin][ref8], zijn niet van toepassing op arbeidsplaatsen in een gebouw als
      bedoeld in [artikel 1, eerste lid, onder c, van de Woningwet][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0008498#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0008498#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0008498#Artikel3
      [ref7]: https://wetten.overheid.nl/BWBR0008498#Artikel3
      [ref8]: https://wetten.overheid.nl/BWBR0008498#Artikel3
      [ref9]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0008498/2005-08-01#Artikel3.1a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '1'
      - id: ref5
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '1'
      - id: ref6
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '1'
      - id: ref7
        bwb_id: BWBR0008498
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '1'
      - id: ref8
