  - number: '7.20'
    text: |-
      1 Hijs- en hefgereedschap wordt gekozen op grond van te hanteren lasten, de aanslagpunten, de haakvoorziening en
      de weersomstandigheden, daarbij rekening houdend met de wijze van aanslaan van de last en het te gebruiken hijs-
      of hefwerktuig.

      2 Hijs- en hefgereedschap, anders dan touwwerk of staalkabels, is voorzien van een goed leesbare aanduiding die de
      werklast vermeldt.

      3 Samengesteld hijs- en hefgereedschap is duidelijk gemarkeerd om de gebruiker in staat te stellen de kenmerken
      ervan te kennen.

      4 Hijs- en hefgereedschap wordt, behalve ten behoeve van beproeving, niet zwaarder belast dan de werklast noch
      zwaarder dan een veilig gebruik toelaat.

      5 Hijs- en hefgereedschap wordt zodanig opgeslagen dat het niet kan worden beschadigd of aangetast.

      6 Hijs- en hefgereedschap wordt ten minste eenmaal per jaar door een deskundige natuurlijke persoon, rechtspersoon
      of instelling op zijn goede staat onderzocht waarbij het zo nodig wordt beproefd. Deze persoon of instelling
      beschikt over de daarvoor benodigde uitrusting.

      7 In aanvulling op het zesde lid wordt kettingwerk, afhankelijk van de materiaalsoort, zo dikwijls als voor een
      veilig gebruik nodig is, aan een voor het betrokken materiaal geschikte warmtebehandeling onderworpen.

      8 De warmtebehandeling, bedoeld in het zevende lid, wordt uitgevoerd door een deskundige natuurlijke persoon,
      rechtspersoon of instelling die beschikt over de daarvoor benodigde uitrusting.

      9 Bewijsstukken van de onderzoeken, beproevingen en warmte-behandelingen, bedoeld in het zesde en zevende
      lid, zijn op de arbeidsplaats aanwezig en worden desgevraagd getoond aan een ambtenaar als bedoeld in
      [artikel 24 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.20
