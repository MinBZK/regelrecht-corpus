  - number: 1.5a
    text: |-
      1 Als certificerende instelling kan worden aangewezen een instelling die:

      a. rechtspersoonlijkheid heeft;

      b. haar zetel of een vestiging in Nederland heeft;

      c. onafhankelijk is;

      d. beschikt over voldoende deskundigheid en outillage om de uitvoering van de taken waarvoor zij is aangewezen,
      naar behoren te kunnen vervullen;

      e. beschikt over een registratiesysteem waarin de gegevens die samenhangen met en betrekking hebben op de
      uitvoering van haar taken, op een systematische wijze zijn vastgelegd. Aan de hand van deze gegevens is het
      gecertificeerde product of kwaliteitssysteem dan wel de gecertificeerde persoon afdoende te identificeren;

      f. naar behoren functioneert.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel1.5a
  - number: 1.5b
    text: |-
      1 De certificerende instelling stelt jaarlijks voor 1 maart een verslag op van de door haar in verband met haar
      taak verrichte werkzaamheden en de rechtmatigheid en doeltreffendheid van haar werkzaamheden en werkwijze in het
      afgelopen kalenderjaar. Het verslag wordt aan Onze Minister toegezonden. Bij ministeriële regeling worden nadere
      regels gesteld met betrekking tot de onderwerpen die in ieder geval in het jaarverslag worden behandeld.

      2 De certificerende instelling verstrekt jaarlijks aan Onze Minister een afschrift van de polis van de afgesloten
      verzekering tegen wettelijke aansprakelijkheid tegen alle risico's die voortvloeien uit de uitoefening van de taken
      waarvoor zij is aangewezen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel1.5b
  - number: 1.5c
    text: |-
      1 Indien een wijziging plaatsvindt in de gegevens op grond waarvan de certificerende instelling is aangewezen, doet
      de instelling hiervan terstond mededeling aan Onze Minister.

      2 Indien een certificerende instelling voornemens is een of meer van de taken waarvoor zij is aangewezen, te
      beëindigen, doet de instelling hiervan terstond mededeling aan Onze Minister en de certificaathouders. In dat
      geval worden door de certificerende instelling de gegevens, bedoeld in [artikel 1.5a, eerste lid, onder e][ref1],
      overgedragen aan Onze Minister dan wel, na toestemming van Onze Minister en de certificaathouders, een andere
      certificerende instelling die voor dezelfde taken is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1.5a
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel1.5c
