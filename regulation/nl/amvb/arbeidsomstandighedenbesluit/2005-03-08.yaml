  - number: '2.31'
    text: |-
      Overeenkomstig het bij of krachtens deze paragraaf bepaalde:

      a. zorgt de opdrachtgever ervoor dat de bij of krachtens de [artikelen 2.26 tot en met 2.29][ref1] gestelde
      voorschriften worden nageleefd;

      b. neemt de opdrachtgever zodanige maatregelen en richt hij de werkzaamheden zodanig in dat:

      1°. door de coördinator voor de ontwerpfase de taken worden uitgeoefend, bedoeld in [artikel 2.30][ref2];

      2°. de coördinator voor de ontwerpfase zijn taken naar behoren kan vervullen;

      c. zorgt de opdrachtgever ervoor dat het veiligheids- en gezondheidsplan, bedoeld in [artikel 2.27][ref3], deel
      uitmaakt van het bestek betreffende het bouwwerk.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2.26
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2.30
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel2.27
