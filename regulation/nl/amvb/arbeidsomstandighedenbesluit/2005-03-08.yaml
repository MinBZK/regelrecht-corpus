  - number: 1.5e
    text: |-
      1 Een certificaat als bedoeld in [artikel 20, eerste lid, van de wet][ref1] wordt door Onze Minister of, indien
      Onze Minister een certificerende instelling heeft aangewezen, de certificerende instelling, op aanvraag afgegeven,
      indien wordt voldaan aan bij of krachtens de wet met betrekking tot het certificaat gestelde eisen.

      2 Bij ministeriële regeling worden regels gesteld met betrekking tot de gegevens die ten minste bij een aanvraag
      worden verstrekt.

      3 Bij ministeriële regeling worden regels gesteld met betrekking tot de vergoeding die voor de afgifte van een
      certificaat ten hoogste verschuldigd is.

      4 Een certificaat kan worden geweigerd of onder voorschriften worden afgegeven of verlengd dan wel ingetrokken,
      indien is gebleken dat niet of niet volledig is voldaan aan bij of krachtens de wet met betrekking tot het
      certificaat gestelde eisen.

      5 Voorts kan een certificaat worden geweigerd dan wel ingetrokken indien de veiligheid of gezondheid van werknemers
      of derden door werkzaamheden die door het certificaat worden gereguleerd in gevaar wordt of kan worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel20
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel1.5e
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '20'
  - number: '1.6'
    text: |-
      1 In afwijking van de wet, dit besluit en de daarop berustende bepalingen wordt voor de toepassing
      daarvan ten aanzien van arbeid verricht in bekostigde onderwijsinrichtingen als bedoeld in
      [artikel 1.3, tweede lid, onder d][ref1], voor «de ondernemingsraad» gelezen «de dienstcommissie», en wordt ten
      aanzien van arbeid verricht door defensiepersoneel, voor zover de [Wet op de ondernemingsraden][ref2] niet van
      toepassing is, voor «de ondernemingsraad» gelezen «het overlegorgaan».

      2 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. dienstcommissie: een dienstcommissie als bedoeld in
      [artikel 9.58 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3];

      b. overlegorgaan: een overlegorgaan als bedoeld in het [Algemeen militair ambtenarenreglement][ref4]
      en een overlegorgaan ingesteld krachtens [artikel 23 van de Kaderwet dienstplicht][ref5] alsmede
      een dienstcommissie als bedoeld in het [Burgerlijk ambtenarenreglement defensie][ref6] en het
      [Besluit georganiseerd overleg sector defensie][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1.3
      [ref2]: https://wetten.overheid.nl/BWBR0002747
