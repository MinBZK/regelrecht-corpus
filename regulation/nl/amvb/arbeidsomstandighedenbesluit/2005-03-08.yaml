        artikel: '7.18'
        hoofdstuk: '7'
        paragraaf: 2a
        afdeling: '4'
  - number: 7.18b
    text: |-
      1 In aanvulling op de [artikelen 7.18][ref1] en [7.18a][ref2] zijn hijs- en hefwerktuigen die zijn bestemd en
      ingericht voor het hijsen of heffen van personen, met zodanige voorzieningen uitgerust dat zoveel mogelijk wordt
      voorkomen dat:

      a. het hijs- of hefplatform voor personen naar beneden valt,

      b. personen van dit platform vallen,

      c. een persoon die van het hijs- of hefwerktuig gebruik maakt wordt verpletterd, beklemd raakt of wordt
      aangestoten, in het bijzonder als gevolg van een onopzettelijk contact met een voorwerp.

      2 Een hijs- of hefwerktuig als bedoeld in het eerste lid, heeft voorts een zodanige voorziening, dat bij een
      mankement aan het werktuig de veiligheid van personen die zich op het hijs- of hefplatform voor personen bevinden,
      zoveel mogelijk is gewaarborgd en dat hun bevrijding mogelijk is.

      3 Indien het gevaar, bedoeld in het eerste lid, onder a, om redenen in verband met de terreinomstandigheden en het
      hoogteverschil niet met behulp van een veiligheidsvoorziening kan worden vermeden, is in de ophanging van het hijs-
      of hefplatform een geschikte kabel, ketting of een andere voorziening met een verhoogde veiligheidscoëfficiënt
      toegepast.

      4 In het geval, bedoeld in het derde lid, wordt de goede staat van de in de ophanging toegepaste kabel, ketting of
      andere voorziening elke werkdag gecontroleerd.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel7.18
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel7.18a
