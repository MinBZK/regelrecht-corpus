  - number: '4.57'
    text: |-
      1 Aan werknemers die arbeid verrichten waarbij gevaar voor blootstelling aan asbeststof of crocidolietstof bestaat,
      wordt overeenkomstig een schriftelijk plan doeltreffende voorlichting en doeltreffend onderricht gegeven over:

      a. de mogelijke gevaren voor de gezondheid van blootstelling aan asbeststof of crocidolietstof;

      b. de noodzaak van het toezicht op het asbestgehalte of crocidolietgehalte in de lucht en de daarvoor geldende
      grenswaarden;

      c. de maatregelen inzake de persoonlijke en werkhygiëne;

      d. de maatregelen om de blootstelling aan asbeststof of crocidolietstof zo laag mogelijk te houden.

      2 Aan werknemers die asbest of asbesthoudende producten dan wel crocidoliet of crocidoliethoudende producten
      slopen of verwijderen wordt, in aanvulling op het eerste lid, overeenkomstig een schriftelijk plan, doeltreffende
      voorlichting en doeltreffend onderricht gegeven over de aan voornoemde werkzaamheden verbonden gevaren voor de
      gezondheid en over de wijze waarop die gevaren zoveel mogelijk kunnen worden beperkt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.57
  - number: '4.58'
    text: |-
      1 Het is verboden propaansulton (CAS-nummer 1120–71–4) te vervaardigen of te gebruiken.

      2 Het is verboden propaansulton, anders dan ten behoeve van doorvoer, in voorraad te houden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.58
  - number: '4.59'
    text: |-
      1 Het is verboden de volgende stoffen te vervaardigen of te gebruiken:

      a. 2-naftylamine en de zouten daarvan (CAS-nummer 91–59–8);

      b. 4-aminodifenyl en de zouten daarvan (CAS-nummer 92–67–1);

      c. benzidine en de zouten daarvan (CAS-nummer 92–87–5);

      d. 4-nitrodifenyl (CAS-nummer 92–93–3).

      2 Het is verboden de in het eerste lid genoemde stoffen, anders dan ten behoeve van doorvoer, in voorraad te
      houden.

      3 De in het eerste en tweede lid vervatte verboden zijn niet van toepassing, indien de stoffen in een mengsel of
      oplossing aanwezig zijn in een concentratie die kleiner is dan 0,1 gewichtsprocent.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.59
  - number: '4.60'
    text: |-
      1 Het is verboden zandsteen te bewerken of te verwerken.

      2 Het eerste lid is niet van toepassing:

      a. op het bewerken of verwerken van zandsteen indien dit noodzakelijk is voor het behoud van monumenten als bedoeld
      in de [Monumentenwet 1988][ref1];

      b. op het demonteren van zandsteen of zandsteendelen uit gebouwen, constructies of installaties, en

      c. op het uitvoeren van wetenschappelijk onderzoek met zandsteen.

      3 Het is verboden zandsteen in voorraad te houden.

      4 Het derde lid is niet van toepassing met betrekking tot:

      a. het in voorraad houden van zandsteen ten behoeve van de in het tweede lid, onder *a*, bedoelde werkzaamheden;

      b. de doorvoer van zandsteen;

      c. voorwerpen, welke geheel of ten dele uit zandsteen bestaan en welke voor hun bestemming gereed en volledig
      afgewerkt zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004471
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.60
    references:
      - id: ref1
        bwb_id: BWBR0004471
  - number: '4.61'
    text: |-
      1 In dit artikel wordt verstaan onder:

      a. stralen: het met grote snelheid treffen van een voorwerp met korrels ten einde dat voorwerp te reinigen of te
      bewerken, met uitzondering van die bewerkingen waardoor een laag materiaal op het voorwerp wordt aangebracht;

      b. ontzanden: het stralen van een gietstuk ten einde dit te ontdoen van aanhangend vormzand.

      2 Het is verboden te stralen met een stof die aan kwarts of een andere vorm van vrij kristallijn siliciumdioxyde
      meer dan 1% bevat.

      3 Het ontzanden mag slechts plaatsvinden in voor dat doel bestemde gesloten toestellen of ruimten.

      4 Het bij het ontzanden ontstane stof moet op doelmatige wijze worden afgezogen, uit de luchtstroom afgescheiden
      en verzameld.

      5 De bij het ontzanden afgezogen lucht mag niet worden afgevoerd naar een ruimte waarin personen moeten verblijven.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.61
  - number: '4.62'
    text: |-
      Voor zover de werkzaamheden, bedoeld in de [artikelen 4.59, eerste en tweede lid][ref1],
      en [4.60, eerste en derde lid][ref2], zijn toegestaan, is daarop, met inachtneming van
      [artikel 4.12, afdeling 2][ref3] van dit hoofdstuk van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.59
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4.60
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel4.12
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.62
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4.59'
        hoofdstuk: '4'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4.60'
        hoofdstuk: '4'
        afdeling: '6'
      - id: ref3
        bwb_id: BWBR0008498
        artikel: '4.12'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: 4.62a
    text: |-
      Voor de toepassing van deze afdeling wordt verstaan onder vluchtige organische stoffen: organische verbindingen
      en mengsels hiervan, die bij 293,15 K een dampspanning hebben van ten minste 0,01 kPa dan wel een overeenkomstige
      vluchtigheid bij de specifieke gebruiksomstandigheden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.62a
  - number: 4.62b
    text: |-
      Ten aanzien van bij ministeriële regeling aangewezen werkzaamheden wordt het gevaar van blootstelling van
      werknemers aan vluchtige organische stoffen zoveel mogelijk voorkomen door vluchtige organische stoffen te
      vervangen door onschadelijke of minder schadelijke stoffen of door producten die vluchtige organische stoffen
      bevatten te vervangen door bij ministeriële regeling ten aanzien van die werkzaamheden aangewezen producten.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.62b
  - number: '4.78'
    text: |-
      1 Het is verboden om loodwit, loodsulfaat of producten die een van deze stoffen als bestanddeel bevatten, te
      gebruiken bij het schilderen van binnenwerk van gebouwen of vaartuigen.

      2 Als stof in de zin van het eerste lid wordt niet beschouwd het loodsulfaat, dat bij de bereiding van
      chroomaatgeel is medegeprecipiteerd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.78
  - number: '4.79'
    text: |-
      Aan werknemers die met loodhoudende materialen of producten schilderwerk verrichten, dat niet op grond van
      [artikel 4.78][ref1] is verboden, wordt, in aanvulling op [artikel 4.10e][ref2], schriftelijk en adequaat
      voorlichtingsmateriaal verschaft over de bij die werkzaamheden in acht te nemen voorzorgsmaatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.78
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4.10e
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.79
    references:
      - id: ref1
        bwb_id: BWBR0008498
