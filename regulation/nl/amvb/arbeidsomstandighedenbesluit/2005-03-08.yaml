  - number: '1.7'
    text: |-
      1 Ten aanzien van de aard en inhoud van het overleg met een dienstcommissie respectievelijk overlegorgaan, ten
      aanzien van de wijze waarop het overleg met een dienstcommissie respectievelijk overlegorgaan wordt gevoerd en ten
      aanzien van de bevoegdheden van een dienstcommissie respectievelijk overlegorgaan is van toepassing:

      a. het [Rechtspositiereglement wetenschappelijk onderwijs][ref1] en onderzoek, of

      b. het [Algemeen militair ambtenarenreglement][ref2], de krachtens [artikel 23 van de Kaderwet dienstplicht][ref3]
      door Onze Minister van Defensie te stellen regels of het [Burgerlijk ambtenarenreglement defensie][ref4] dan wel
      het [Besluit georganiseerd overleg sector defensie][ref5].

      2 Voor zover de wet bepalingen bevat omtrent rechten van de ondernemingsraad of leden daarvan waaromtrent de in het
      eerste lid bedoelde regelingen geen bepalingen bevatten, is de wet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004192
