  - number: 4.37c
    text: |-
      1 Deze afdeling is van toepassing op handelingen met betrekking tot asbest of asbesthoudende producten dan wel
      crocidoliet of crocidoliethoudende producten indien de concentratie asbest of crocidoliet hoger is dan honderd
      milligram per kilogram droge stof als bedoeld in [artikel 2, onderdeel b, van het Productenbesluit asbest][ref1].

      2 De [paragrafen 3][ref2], [4][ref3] en [7][ref4] van deze afdeling zijn van toepassing op handelingen:

      a. als bedoeld in [artikel 5 van het Productenbesluit asbest][ref5];

      b. met asbest of een asbesthoudend product dat wordt verwijderd in een inrichting als bedoeld in
      [artikel 1.1, vierde lid, van de Wet milieubeheer][ref6].

      3 Indien bij de handelingen, bedoeld in het tweede lid, crocidoliet of crocidoliethoudende producten zijn
      betrokken, is [paragraaf 6][ref7] van deze afdeling van toepassing.

      4 Op het geheel of gedeeltelijk slopen van bouwwerken, met uitzondering van grondwerken, constructies,
      apparaten, installaties en transportmiddelen waarin asbest of asbesthoudende producten dan wel crocidoliet of
      crocidoliethoudende producten is respectievelijk zijn verwerkt en bij het verwijderen van voornoemde stoffen
      of producten hieruit zijn de [paragrafen 5][ref8] en [7][ref9] van deze afdeling van toepassing. Voorzover bij
      categorieën van werkzaamheden als bedoeld in de vorige volzin het blootstellingsniveau het actieniveau, bedoeld in
      [artikel 4.44][ref10], niet overschrijdt, kunnen bij ministeriële regeling die categorieën worden aangewezen als
      werkzaamheden waarop een of meer bepalingen van [paragraaf 5][ref11] niet van toepassing zijn, indien wordt voldaan
      aan de bij die regeling gestelde voorschriften.


