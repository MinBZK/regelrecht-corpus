  - number: 4.8a
    text: |-
      1 Arbeid waarbij professioneel vuurwerk als bedoeld in [artikel 1.1.1, eerste lid, van het Vuurwerkbesluit][ref1]
      tot ontbranding wordt gebracht, ten behoeve daarvan ter plaatse wordt opgebouwd, geïnstalleerd, gemonteerd,
      geassembleerd, dan wel na ontbranding verwijderd, wordt verricht volgens een vooraf opgesteld werkplan, dat een
      deugdelijke beschrijving bevat van de uit te voeren werkzaamheden, de daaraan verbonden gevaren en de wijze waarop
      deze gevaren zoveel mogelijk voorkomen of beperkt zullen worden.

      2 De arbeid, bedoeld in het eerste lid, alsmede arbeid bestaande uit het bewerken van professioneel vuurwerk in een
      inrichting als bedoeld in [artikel 3.2.1 van het Vuurwerkbesluit][ref2], wordt verricht door of onder voortdurend
      toezicht van een persoon, die in het bezit is van een certificaat van vakbekwaamheid professioneel vuurwerk dat is
      afgegeven door Onze Minister of een certificerende instelling.

      3 Het in het eerste onderscheidenlijk tweede lid bedoelde werkplan en certificaat van vakbekwaamheid of een
      afschrift daarvan zijn op de arbeidsplaats aanwezig en worden desgevraagd getoond aan een ambtenaar als bedoeld in
      [artikel 24 van de wet][ref3].

      4 Ten aanzien van de in het eerste en tweede lid bedoelde arbeid en het in het eerste lid bedoelde werkplan worden
      bij ministeriële regeling nadere regels gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel3.2.1
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel24
