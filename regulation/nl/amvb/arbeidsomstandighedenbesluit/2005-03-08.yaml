  - number: '1.5'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. militair personeel:

      1°. de in werkelijke dienst zijnde militaire ambtenaren in de zin van
      [artikel 1, eerste en tweede lid, van de Militaire Ambtenarenwet 1931][ref1];

      2°. de in werkelijke dienst zijnde dienstplichtigen in de zin van de [artikelen 18][ref2], [19][ref3] en
      [21 van de Kaderwet dienstplicht][ref4];

      b. burgerpersoneel bij het Ministerie van Defensie:

      1°. degenen die krachtens publiekrechtelijke aanstelling in burgerlijke openbare dienst jegens het Rijk,
      vertegenwoordigd door de Minister van Defensie, gehouden zijn tot het verrichten van arbeid, behalve indien
      betrokkenen aan een derde ter beschikking worden gesteld voor het verrichten van arbeid, welke die derde gewoonlijk
      doet verrichten;

      2°. degenen die onder gezag van het Rijk, vertegenwoordigd door de Minister van Defensie, arbeid verrichten;

      c. defensiepersoneel: militair personeel en burgerpersoneel bij het Ministerie van Defensie;

      d. oefening: iedere door defensiepersoneel onder oorlogsnabootsende omstandigheden in praktijk brengen van
      theoretisch onderwezen bekwaamheden teneinde aldus de bedrevenheid in het uitvoeren van oorlogstaken te verwerven,
      op te voeren of te onderhouden;

      e. militair vaartuig: een Nederlands oorlogsschip, marinehulpschip of een ander schip dat in gebruik is voor de
      uitvoering van de militaire taak;

      f. militair luchtvaartuig: een luchtvaartuig in beheer bij het Ministerie van Defensie;

      g. bemand wapensysteem: ieder al dan niet voortbewogen wapensysteem, dat tijdens het gebruik wordt bemand of
      bediend met uitzondering van een licht persoonlijk wapen;

      h. eenheid met gereedstelling: eenheid die, daartoe aangewezen, ingezet is dan wel gereed is of zich gereed moet
      houden voor inzet in krijgsmachtverband.


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel1
