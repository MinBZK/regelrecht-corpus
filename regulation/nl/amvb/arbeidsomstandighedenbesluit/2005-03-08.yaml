  - number: 7.17c
    text: |-
      1 Mobiele arbeidsmiddelen met een eigen aandrijving worden bediend door werknemers die daartoe een specifieke
      deskundigheid bezitten.

      2 Het meerijden van werknemers op mobiele arbeidsmiddelen met eigen aandrijving is slechts toegestaan op speciaal
      daartoe ingerichte veilige plaatsen.

      3 Indien tijdens de verplaatsing van een arbeidsmiddel als bedoeld in het tweede lid, werkzaamheden worden
      uitgevoerd, wordt de snelheid van het arbeidsmiddel zo nodig aangepast.

      4 Met een mobiel arbeidsmiddel worden niet meer personen en wordt niet meer gewicht aan goederen tegelijk vervoerd
      dan een veilig gebruik toelaat.

      5 Indien een mobiel arbeidsmiddel zich binnen een werkzone waar werknemers zich kunnen bevinden, beweegt, worden
      doeltreffende verkeersregels vastgesteld.

      6 Doeltreffende organisatorische maatregelen worden genomen om te voorkomen dat werknemers zich bevinden in de
      werkzone van mobiele arbeidsmiddelen met eigen aandrijving.

      7 Indien voor de goede uitvoering van de werkzaamheden de aanwezigheid van werknemers in een werkzone als bedoeld
      in het zesde lid, is vereist, worden doeltreffende maatregelen genomen om te voorkomen dat zij door het mobiele
      arbeidsmiddel gewond raken.

      8 Met een verbrandingsmotor uitgeruste mobiele arbeidsmiddelen worden op de arbeidsplaats niet gebruikt, tenzij is
      gezorgd voor voldoende schone lucht.

      9 Een mobiel arbeidsmiddel wordt niet eerder door de bestuurder verlaten dan nadat is voorkomen dat het onverhoeds
      in beweging komt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.17c
  - number: 7.17d
    text: |-
      Bij transport van werknemers over water worden doeltreffende maatregelen getroffen om de veiligheid van deze
      werknemers te waarborgen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.17d
  - number: '7.18'
    text: |-
      1 Een hijs- of hefwerktuig is op of nabij de bedieningsplaats voorzien van een goed leesbare aanduiding, die voor
      elke gebruikelijke configuratie van dat werktuig de toegelaten bedrijfslast vermeldt.

      2 Een hijs- of hefwerktuig wordt, behalve ten behoeve van beproeving, niet zwaarder belast dan de toegelaten
      bedrijfslast of bedrijfslasten noch zwaarder dan een veilig gebruik toelaat.

      3 Hijs- en hefwerktuigen worden bediend door personen die daartoe een specifieke deskundigheid bezitten.

      4 Een hijs- of hefwerktuig dat niet is bestemd of ingericht voor het hijsen of heffen van personen en waarbij de
      kans aanwezig is op foutief gebruik, wordt voorzien van een goed leesbare waarschuwing tegen personenvervoer.

      5 Hijs- en hefwerktuigen worden zodanig opgesteld dat het gevaar wordt beperkt dat de lasten de werknemers raken,
      dan wel ongewild op gevaarlijke wijze uit hun baan of in een vrije val raken of losraken.

      6 Doeltreffende maatregelen worden genomen om ervoor te zorgen dat werknemers zich niet ophouden onder hangende
      lasten.

      7 Hangende lasten worden niet verplaatst boven niet beschermde werkplekken waar zich in de regel werknemers
      bevinden.

      8 Indien bij toepassing van de leden zes en zeven het goede verloop van de werkzaamheden niet kan worden
      gegarandeerd, worden passende procedures vastgesteld en toegepast om de veiligheid van de betrokken werknemers
      te waarborgen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.18
  - number: 7.18a
    text: |-
      1 In aanvulling op [artikel 7.18][ref1] is dit artikel van toepassing op het gebruik van hijs- en hefwerktuigen die
      dienen voor het hijsen of heffen van niet-geleide lasten.

      2 Wanneer twee of meer hijs- of hefwerktuigen zodanig op een werkplek worden geïnstalleerd of gemonteerd dat hun
      werkgebieden elkaar overlappen, worden doeltreffende maatregelen genomen om botsingen tussen de lasten of delen van
      deze werktuigen te voorkomen.

      3 Bij het gebruik van een mobiel hijs- of hefwerktuig worden doeltreffende maatregelen genomen om te voorkomen dat
      het werktuig kantelt, ongewild in beweging komt of wegglijdt.

      4 Er wordt op toegezien dat de maatregelen, bedoeld in het derde lid, naar behoren worden uitgevoerd.

      5 Wanneer de bediener van een hijs- of hefwerktuig noch rechtstreeks noch door middel van informatieverstrekkende
      hulpmiddelen de volledige baan van de last kan volgen, wordt een werknemer aangewezen die met de bediener in
      verbinding staat om deze te leiden.

      6 Voorts worden verdere organisatorische maatregelen genomen om ongewilde botsingen van de last van het hijs- of
      hefwerktuig te voorkomen.

      7 Wanneer lasten met de hand worden vast- of losgemaakt, zijn de werkzaamheden zodanig georganiseerd dat de
      werknemer deze handelingen veilig kan verrichten en hierover direct of indirect controle behoudt.

      8 Alle handelingen voor het hijsen of heffen worden correct gepland teneinde de veiligheid van de werknemers te
      garanderen.

      9 De handelingen, bedoeld in het achtste lid, worden onder doeltreffend toezicht uitgevoerd.

      10 Met name indien een last gelijktijdig wordt gehesen of geheven door twee of meer hijs- of hefwerktuigen wordt
      een procedure vastgesteld en toegepast om een goede coördinatie van de handelingen van de bedieners te waarborgen.

      11 Indien hijs- of hefwerktuigen bij het geheel of gedeeltelijk uitvallen van de energietoevoer de lasten niet
      meer kunnen houden, zijn doeltreffende maatregelen genomen om te vermijden dat werknemers aan de daarmee verbonden
      gevaren worden blootgesteld.

      12 Op de lasten, bedoeld in het elfde lid, wordt voortdurend toezicht gehouden, tenzij de toegang tot de
      gevarenzone wordt verhinderd en de lasten volkomen veilig zijn vastgemaakt en worden vastgehouden.

      13 In de open lucht gebruikte hijs- en hefwerktuigen worden stilgelegd zodra de weersomstandigheden zodanig
      verslechteren dat de bedrijfsveiligheid in gevaar komt en de werknemers aan gevaren worden blootgesteld. In dit
      geval worden doeltreffende beschermingsmaatregelen genomen, in het bijzonder om te verhinderen dat het hijs- of
      hefwerktuig kantelt.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel7.18
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.18a
    references:
