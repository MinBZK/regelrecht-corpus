  - number: 9.9c
    text: |-
      1 Als beboetbaar feit ter zake waarvan een boete kan worden opgelegd van de tweede categorie, wordt aangemerkt de
      handeling of het nalaten in strijd met de voorschriften welke zijn opgenomen in de volgende artikelen:

      a. van hoofdstuk 1: [artikel 1.37, tweede lid][ref1];

      b. van hoofdstuk 2: [artikel 2.42, zesde lid][ref2] en [2.42f, tweede lid][ref3];

      c. van hoofdstuk 3: de [artikelen 3.1b][ref4], [3.3][ref5], [3.4, eerste en tweede lid][ref6],
      [3.5, derde, vierde en zevende lid][ref7], [3.5d, eerste, tweede en derde lid][ref8],
      [3.5e, onder a, b, e en h][ref9], [3.5f, onder f][ref10], [3.6][ref11], [3.7, eerste en tweede lid][ref12],
      [3.10][ref13], [3.16, eerste en derde lid][ref14], [3.17][ref15], [3.18, eerste lid][ref16],
      [3.28, eerste lid][ref17], [3.29, tweede, derde en vijfde lid][ref18], [3.30][ref19], [3.31, tweede lid][ref20],
      [3.34, eerste lid][ref21], [3.35, eerste en tweede lid][ref22], [3.37c][ref23], [3.37d][ref24], [3.37e][ref25],
      [3.37f, tweede lid][ref26], [3.37g][ref27], [3.37h][ref28], [3.37k][ref29], [3.37l, eerste lid, onder a][ref30],
      [3.37m][ref31], [3.37n][ref32], [3.37p][ref33], [3.37q, eerste en derde lid][ref34], [3.37r][ref35],
      [3.37s, tweede tot en met vierde lid][ref36], [3.37t][ref37], [3.37u][ref38], [3.37w, tweede lid][ref39], en
      [3.37y][ref40] en [3.46][ref41];

      d. van hoofdstuk 4: de [artikelen 4.3a][ref42], [4.4, eerste tot en met vierde lid][ref43], [4.6, derde lid][ref44],
      [4.6a, derde en vierde lid, onder a en c][ref45], [4.7, derde lid][ref46], [4.8a, eerste lid][ref47],
      [4.8b, derde en vierde lid][ref48], [4.9, eerste tot en met achtste lid][ref49], [4.10, eerste lid][ref50],
      [4.16, tweede en derde lid][ref51], [4.17][ref52], [4.18, eerste tot en met vierde lid][ref53],
      [4.19, onderdelen d en e][ref54], [4.36, tweede en derde lid][ref55], [4.45, eerste lid][ref56],
      [4.45a, tweede lid][ref57], [4.46, eerste, tweede en vijfde lid][ref58], [4.47, eerste lid][ref59],
      [4.52, derde lid][ref60], [4.54, tweede lid][ref61], [4.55, eerste lid, onderdeel d, en tweede lid][ref62],
      [4.56, tweede en derde lid][ref63], [4.61, derde tot en met vijfde lid][ref64], [4.62b][ref65],
      [4.87, eerste tot en met derde lid][ref66], [4.91, vijfde lid][ref67], [4.98][ref68], [4.99][ref69],
      [4.100, eerste lid][ref70], [4.101][ref71], [4.106][ref72], [4.113][ref73] en [4.115][ref74];

      e. van hoofdstuk 5 : de [artikelen 5.2][ref75] en [5.3, eerste lid][ref76];

      f. van hoofdstuk 6: de [artikelen 6.2, vijfde lid][ref77],
      [6.8, eerste tot en met derde lid, vijfde en zevende lid][ref78], [6.9, eerste lid][ref79],
      [6.12, eerste tot en met vierde lid][ref80], [6.15, eerste lid, onderdelen b en d][ref81],
      [6.15a, eerste en tweede lid][ref82], [6.16, eerste lid][ref83], [6.16, tweede lid][ref84], [6.18][ref85],
      [6.19, eerste lid][ref86], [6.20][ref87], [6.20b, eerste, tweede en derde lid, onder a][ref88], [6.20c][ref89],
      [6.20e][ref90] en [6.23, eerste tot en met derde lid, vijfde en zevende lid][ref91];

      g. van hoofdstuk 7: de [artikelen 7.4][ref92], [7.5, eerste tot en met derde lid, en vijfde lid][ref93],
      [7.7][ref94], [7.9][ref95], [7.11][ref96], [7.14, eerste lid][ref97], [7.15][ref98],
      [7.16][ref99], [7.17a, eerste en tweede lid, en vierde tot en met zesde lid][ref100],
      [7.17b, tweede lid, onderdelen c, d, e en f, vijfde en zesde lid][ref101],
      [7.17c, tweede tot en met vierde lid, en achtste lid][ref102],
      [7.18, tweede lid, en vijfde tot en met zevende lid][ref103], [7.18a, tweede, derde, elfde en dertiende lid][ref104],
