  - number: '4.46'
    text: |-
      1 De concentratie van asbeststof in de lucht mag de grenswaarde van 0,30 vezel per kubieke centimeter, vastgesteld,
      berekend of gemeten over een referentieperiode van acht uur, niet overschrijden.

      2 Bij overschrijding van de in het eerste lid genoemde grenswaarde worden zo spoedig mogelijk doeltreffende
      maatregelen genomen om de concentratie terug te brengen tot beneden die waarde.

      3 Nadat de in het tweede lid bedoelde maatregelen zijn genomen wordt de concentratie gemeten overeenkomstig
      [artikel 4.50, tweede lid][ref1].

      4 De ondernemingsraad of de personeelsvertegenwoordiging of, bij het ontbreken daarvan, de belanghebbende
      werknemers wordt de gelegenheid gegeven een oordeel over de in het tweede lid bedoelde maatregelen kenbaar te
      maken. Hen wordt vervolgens kennis gegeven van de resultaten van de metingen.

      5 Zolang de in het tweede lid bedoelde maatregelen om de concentratie terug te brengen nog niet volledig ten
      uitvoer zijn gelegd of niet tot een doeltreffende bescherming leiden, mag de arbeid op de betreffende arbeidsplaats
      alleen worden voortgezet indien de betrokken werknemers doeltreffend zijn beschermd tegen blootstelling aan
      asbeststof.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.50
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.46
