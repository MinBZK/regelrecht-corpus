  - number: '4.80'
    text: |-
      In aanvulling op [artikel 3.23][ref1], zijn voor de werknemers die werkzaamheden verrichten, bestaande uit het
      aanbrengen of verwijderen van loodhoudende materialen of producten, doelmatige wasgelegenheden en doucheruimten
      beschikbaar.


