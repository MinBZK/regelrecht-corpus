  - number: '4.2'
    text: |-
      1 Indien werknemers worden of kunnen worden blootgesteld aan gevaarlijke stoffen, ongeacht of met deze stoffen
      daadwerkelijk arbeid wordt of zal worden verricht, worden, in het kader van de risico-inventarisatie en -evaluatie,
      bedoeld in [artikel 5 van de wet][ref1], de aard, de mate en de duur van die blootstelling beoordeeld teneinde de
      gevaren of de hinder voor de werknemers te bepalen.

      2 Met betrekking tot de aard van de blootstelling wordt in ieder geval vastgesteld aan welke gevaarlijke stoffen
      werknemers worden of kunnen worden blootgesteld, wat de gevaren zijn die aan die stoffen zijn verbonden, in welke
      situaties blootstelling zich kan voordoen en op welke wijze blootstelling kan plaatsvinden.

      3 Met betrekking tot de mate van blootstelling wordt in ieder geval vastgesteld wat het blootstellingsniveau
      op de arbeidsplaats is. Voor het doeltreffend vast-stellen van het blootstellingsniveau wordt gebruik gemaakt
      van bestaande geschikte meetmethodes, tenzij dit niveau door middel van andere methodes doeltreffend kan worden
      bepaald.

      4 Voor zover het blootstellingsniveau alleen doeltreffend kan worden vastgesteld door middel van metingen, wordt
      gebruik gemaakt van een voor het doel van de meting geschikte en genormaliseerde meetmethode. Bij het ontbreken van
      een genormaliseerde meetmethode wordt de meting uitgevoerd volgens een andere voor het doel geschikte meetmethode.

      5 Bij de beoordeling bedoeld in het eerste lid, worden in ieder geval de volgende aspecten betrokken:

      a. de informatie over de veiligheid en gezondheid die door de leverancier van een gevaarlijke stof wordt verstrekt,
      waaronder begrepen de verplichte informatie die bij of krachtens wettelijk voorschrift wordt verstrekt;

      b. de toegepaste arbeidsprocédés en werkmethoden waarbij gevaarlijke stoffen zijn betrokken, waaronder begrepen de
      hoeveelheid gevaarlijke stoffen waaraan werknemers worden of kunnen worden blootgesteld;

      c. de redelijkerwijs voorzienbare gebeurtenissen, bedoeld in [artikel 4.2a, eerste lid, onder b][ref2];

      d. voor zover van toepassing de grenswaarden die zijn vastgesteld bij of krachtens de [artikelen 4.8b][ref3],
      [4.16][ref4], [4.46][ref5] of [4.56][ref6];

      e. de preventieve maatregelen die zijn genomen ter naleving van de [artikelen 4.3a][ref7] en [4.9][ref8], of,
      indien van toepassing, de [artikelen 4.17 tot en met 4.20][ref9], [4.45][ref10] en[ 4.51;][ref11]

      f. voor zover van toepassing, de resultaten van de arbeidsgezondheidskundige onderzoeken, bedoeld in de
      [artikelen 4.10a][ref12] en [4.10b][ref13].

      6 Indien sprake is van verschillende gevaarlijke stoffen, wordt bij de beoordeling, bedoeld in het eerste lid, de
      mogelijke versterkende effecten betrokken die gevaarlijke stoffen op elkaar kunnen hebben.

      7 De beoordeling, bedoeld in het eerste lid, wordt regelmatig herzien, in ieder geval indien
      gewijzigde omstandigheden of de resultaten van de arbeidsgezondheidskundige onderzoeken, bedoeld in de
      [artikelen 4.10a][ref14] en [4.10b][ref15], hiertoe aanleiding geven.

      8 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot dit artikel. Deze regels kunnen
      betrekking hebben op:

      a. de methoden, bedoeld in het vierde lid, waarmee het blootstellingsniveau doeltreffend wordt bepaald;

      b. het gebruik van bestaande geschikte meetmethoden voor blootstelling aan gevaarlijke stoffen;

      c. de frequentie waarin het blootstellingsniveau wordt bepaald;

      d. de technische specificaties van de apparatuur met behulp waarvan in dit artikel bedoelde metingen worden
      uitgevoerd;

      e. de wijze waarop meetresultaten worden beoordeeld en geregistreerd.


