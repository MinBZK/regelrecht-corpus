  - number: '2.37'
    text: |-
      1 Overeenkomstig de [artikelen 2.33][ref1] en [2.34][ref2]:

      a. zorgt de uitvoerende partij ervoor dat een coördinator voor de uitvoeringsfase wordt aangesteld;

      b. neemt de uitvoerende partij zodanige maatregelen en richt hij de werkzaamheden zodanig in dat:

      1°. door de coördinator voor de uitvoeringsfase de taken worden uitgeoefend, bedoeld in [artikel 2.34][ref3];

      2°. de coördinator voor de uitvoeringsfase zijn taken naar behoren kan vervullen.

      2 De uitvoerende partij zorgt ervoor dat de wijze waarop uitvoering wordt gegeven aan de samenwerking en het
      overleg tussen werkgevers en werknemers op de bouwplaats op passende wijze wordt gecoördineerd.


