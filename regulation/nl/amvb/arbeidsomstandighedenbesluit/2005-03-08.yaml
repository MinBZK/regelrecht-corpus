        bwb_id: BWBR0010346
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '19'
  - number: 3.5c
    text: |-
      1 De gevaren in verband met explosieve atmosferen en de bijzondere risico's die daaruit kunnen voortvloeien,
      worden in het kader van de risico-inventarisatie en -evaluatie, bedoeld in [artikel 5 van de wet][ref1], voor
      de aanvang van de arbeid en bij iedere belangrijke wijziging, uitbreiding of verbouwing van de arbeidsplaats,
      de arbeidsmiddelen of het arbeidsproces, in hun geheel beoordeeld en schriftelijk vastgelegd in een
      explosieveiligheidsdocument.

      2 Bij de beoordeling, bedoeld in het eerste lid, wordt in ieder geval rekening gehouden met:

      a. de waarschijnlijkheid van het voorkomen en het voortduren van explosieve atmosferen;

      b. de waarschijnlijkheid dat ontstekingsbronnen, elektrostatische ontladingen daaronder begrepen, aanwezig zijn,
      actief worden en daadwerkelijk ontsteken;

      c. de aanwezige installaties, de gebruikte stoffen, de processen en hun mogelijke wisselwerkingen;

      d. de omvang van de te verwachten gevolgen.

      3 Bij de beoordeling, bedoeld in het eerste lid, worden tevens ruimten in aanmerking genomen die via openingen
      verbonden zijn of kunnen worden verbonden met ruimten waar explosieve atmosferen kunnen voorkomen.

      4 In het explosieveiligheidsdocument zijn ten minste vermeld:

      a. een identificatie en beoordeling van de explosierisico's;

      b. de wijze waarop de arbeidsplaatsen en de arbeidsmiddelen, met inbegrip van de alarminstallaties, met de vereiste
      aandacht voor de veiligheid zijn ontworpen, worden gebruikt of bediend en onderhouden;

      c. welke gebieden zijn ingedeeld in zones als bedoeld in [artikel 3.5d, vijfde lid][ref2];

      d. de wijze waarop uitvoering is gegeven aan de maatregelen, bedoeld in de [artikelen 3.5d][ref3], [3.5e][ref4]
      en [3.5f][ref5];

      e. indien op arbeidsplaatsen als bedoeld in [artikel 3.5b, eerste lid][ref6], meerdere werkgevers arbeid doen
      verrichten, de wijze waarop voldaan is aan [artikel 19, tweede lid, van de wet][ref7] en het doel, de maatregelen
      en de wijze van uitvoering van de coördinatie, bedoeld in [artikel 3.5b, tweede lid][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
