    text: |-
      Een ieder die werkgever noch werknemer is, is verplicht tot naleving van de voorschriften en verboden welke zijn
      opgenomen in de volgende artikelen:

      a. van hoofdstuk 2: de [artikelen 2.6][ref1] en [2.39][ref2];

      b. van hoofdstuk 3: de [artikelen 3.4][ref3], [3.5][ref4], [3.16][ref5], [3.39][ref6] en [3.40][ref7];

      c. van hoofdstuk 4: de [artikelen 4.7][ref8], [4.8][ref9], [4.8a][ref10], [4.45, eerste lid][ref11],
      [4.45a, eerste lid][ref12], [4.46, eerste lid][ref13], [4.54][ref14], [4.55][ref15],
