        afdeling: '1'
  - number: '4.13'
    text: |-
      Indien arbeid wordt verricht waarbij werknemers als gevolg van hun werk worden of kunnen worden blootgesteld aan
      kankerverwekkende of mutagene stoffen of kankerverwekkende processen, worden met betrekking tot deze stoffen of
      processen die, gelet op de aard van de bedrijvigheid, met enige regelmaat aanwezig zijn of worden toegepast, in de
      risico-inventarisatie en -evaluatie, bedoeld in [artikel 5 van de wet][ref1], in ieder geval de volgende gegevens
      opgenomen:

      a. met betrekking tot de identiteit:

      1°. in geval van een enkelvoudige stof: de chemische naam of namen dan wel het CAS-nummer of het nummer waaronder
      de stof is opgenomen in de lijst van stoffen, bedoeld in bijlage I bij [Richtlijn nr. 67/548/EEG](31967L0548) van
      de Raad van de Europese Gemeenschappen van 27 juni 1967 betreffende de onderlinge aanpassing van de wettelijke en
      bestuursrechtelijke bepalingen inzake de indeling, de verpakking en het kenmerken van gevaarlijke stoffen (*PbEG*
      196);

      2°. in geval van een meervoudige stof: de handelsnaam of namen alsmede de chemische naam of namen en de
      gewichtspercentages van de component die aanleiding geeft tot indeling van de stof in de categorie carcinogeen of
      de categorie mutageen;

      3°. in geval van een proces: de beschrijving van het proces en de chemische naam van de stoffen die daarbij
      vrijkomen;

      b. de reden waarom het gebruik van een kankerverwekkende stof of het toepassen van een kankerverwekkend proces voor
      het verrichten van de arbeid strikt noodzakelijk is en vervanging technisch niet uitvoerbaar is;

      c. een aanduiding van de organisatorische eenheid of eenheden binnen het bedrijf of de inrichting waar een
      kankerverwekkende of mutagene stof pleegt voor te komen of een kankerverwekkend proces pleegt te worden toegepast;

      d. de benaming van het gevaar of de gevaren van de kankerverwekkende of mutagene stof of het kankerverwekkende
      proces;

      e. de hoeveelheid van de kankerverwekkende of mutagene stof die per jaar pleegt te worden vervaardigd of gebruikt
      dan wel aanwezig pleegt te zijn in verband met de opslag respectievelijk de frequentie waarmee een proces per jaar
      pleegt te worden toegepast;

      f. de soort arbeid die met de kankerverwekkende of mutagene stof pleegt te worden verricht of waarbij het
      kankerverwekkende proces pleegt te worden toegepast;

      g. het aantal werknemers dat aan een kankerverwekkende of mutagene stof of een kankerverwekkend proces pleegt te
      worden blootgesteld of kan worden blootgesteld;

      h. de wijze waarop de onder *g* bedoelde werknemers aan een kankerverwekkende of mutagene stof of een
      kankerverwekkend proces plegen te worden blootgesteld of kunnen worden blootgesteld, en


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.13
