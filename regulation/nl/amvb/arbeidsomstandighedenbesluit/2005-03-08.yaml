  - number: '9.14'
    text: |-
      Vrijstelling of ontheffing van het in [artikel 4.59, eerste lid][ref1], vervatte verbod kan slechts verleend worden
      voor:

      a. het gebruik van de stoffen voor onderzoek en proeven, met inbegrip van analyse;

      b. werkzaamheden die zijn gericht op de verwijdering van de stoffen die in een mengsel of oplossing aanwezig zijn
      in een concentratie die kleiner is dan 0,1 gewichtsprocent;

      c. productieprocessen waarbij de stoffen in een gesloten procesinstallatie worden vervaardigd en daarin worden
      omgezet in andere stoffen, zonder dat de stoffen daarbij, anders dan voor zover dat noodzakelijk is voor de
      controle op het productieproces en het onderhoud van de procesinstallatie, tussentijds uit de procesinstallatie
      worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.59
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel9.14
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4.59'
        hoofdstuk: '4'
        afdeling: '6'
  - number: '9.15'
    text: |-
      In gevallen waarin van de in [artikel 4.59][ref1] vervatte verboden vrijstelling is verleend worden:

      a. indien het voornemen bestaat om een in de vrijstelling genoemde stof te vervaardigen,
      te gebruiken of in voorraad te houden, aan een daartoe aangewezen ambtenaar als bedoeld in
      [artikel 24, eerste lid, van de wet ][ref2]schriftelijk de volgende gegevens gemeld:

      1°. de identiteit van de stof die zal worden vervaardigd of gebruikt dan wel in voorraad zal worden gehouden;

      2°. de hoeveelheid van de stof die per jaar zal worden vervaardigd of gebruikt dan wel in voorraad zal worden
      gehouden;

      3°. de plaats waar de stof zal worden vervaardigd of gebruikt dan wel in voorraad zal worden gehouden;

      4°. de vormen van arbeid die met de stof zullen worden verricht;

      5°. het aantal werknemers dat bij de arbeid aan de stof zal kunnen worden blootgesteld;

      6°. de wijze waarop en de mate waarin werknemers bij de arbeid aan de stof zullen kunnen worden blootgesteld;

      7°. de maatregelen die zijn genomen om te voorkomen dat werknemers bij de arbeid aan de stof zullen worden
      blootgesteld;

      b. indien het voornemen bestaat om een belangrijke wijziging aan te brengen in de omstandigheden die ten
      grondslag liggen aan de gegevens die zijn overgelegd op grond van het onder *a* bedoelde voorschrift, de
      daar bedoelde gegevens opnieuw schriftelijk gemeld aan een daartoe aangewezen ambtenaar als bedoeld in
      [artikel 24, eerste lid, van de wet][ref3];

      c. de gegevens die zijn overgelegd op grond van de in de onder *a* en *b* bedoelde voorschriften ter kennis
      gebracht van de ondernemingsraad of de personeelsvertegenwoordiging of, bij het ontbreken daarvan, van de
      belanghebbende werknemers;

      d. naast de gegevens die ter kennis worden gebracht op grond van het onder *c* bedoelde voorschrift, tevens
      al die gegevens verstrekt die nodig zijn om de ondernemingsraad of de personeelsvertegenwoordiging of, bij het
      ontbreken daarvan, de belanghebbende werknemers doeltreffend in te lichten over de gevaren voor de gezondheid en
      de veiligheid die aan de stof zijn verbonden en de werkzaamheden die daarmee zullen worden verricht alsmede over de
      maatregelen die ter voorkoming van die gevaren worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.59
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel9.15
