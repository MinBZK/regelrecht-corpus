  - number: 3.1b
    text: |-
      Een arbeidsplaats in een gebouw als bedoeld in [artikel 1, eerste lid, onder c, van de Woningwet][ref1]
      wordt slechts gebruikt indien het gebouw voldoet aan de bij of krachtens het [Bouwbesluit 2003][ref2] gegeven
      voorschriften met betrekking tot de van toepassing zijnde gebruiksfunctie in de zin van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0012727
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.1b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0012727
  - number: '3.2'
    text: |-
      1 Arbeidsplaatsen zijn veilig toegankelijk en kunnen veilig worden verlaten. Ze worden zodanig ontworpen, gebouwd,
      uitgerust, in bedrijf gesteld, gebruikt en onderhouden, dat gevaar voor de veiligheid en de gezondheid van de
      werknemers zoveel mogelijk is voorkomen. Voorts worden zij zindelijk, zoveel mogelijk vrij van stof en voor zover
      de veiligheid van de arbeidsplaats dat vereist, ordelijk gehouden.

      2 Regelmatig wordt gecontroleerd of de op de arbeidsplaats ter bescherming van de werknemers aanwezige
      voorzieningen en genomen maatregelen nog adequaat functioneren.

      3 Geconstateerde gebreken met betrekking tot de in het tweede lid bedoelde voorzieningen en maatregelen die de
      veiligheid of de gezondheid kunnen beïnvloeden, worden zo snel mogelijk hersteld.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.2
  - number: '3.3'
    text: |-
      1 Gebouwen en andere opstallen bestaan uit deugdelijk materiaal, zijn van een deugdelijke constructie en verkeren
      in een zodanige staat, dat er geen gevaar bestaat voor het geheel of gedeeltelijk instorten of omvallen.

      2 De arbeidsplaats is zodanig ingericht, dat de daar aanwezige voorwerpen of stoffen geen gevaar voor de veiligheid
      of de gezondheid opleveren door instorten, verschuiven, omvallen of kantelen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.3
  - number: '3.4'
    text: |-
      1 Elektrische installaties zijn zodanig ontworpen, ingericht, aangelegd, onderhouden en gekenmerkt, dat
      een veilig gebruik van elektriciteit zo goed mogelijk is gewaarborgd. Hiertoe zijn de nodige voorzieningen
      en beschermingsmaatregelen aangebracht, waaronder worden begrepen beveiligings-, meet-, controle- en
      signaleringstoestellen alsmede aarders, schakelaars, scheiders en contactdozen. Daarbij is rekening gehouden met
      bijzondere eisen die kunnen voortkomen uit de wijze van het gebruik, de gebruiksomstandigheden en de te verwachten
      uitwendige invloeden.

      2 In een elektrische installatie zijn doeltreffende maatregelen genomen tegen het gevaar van brand, ontploffing,
      directe en indirecte aanraking en te dichte nadering.

      3 Van iedere elektrische installatie zijn duidelijke, steeds bijgewerkte schema’s beschikbaar alsmede alle overige
      gegevens die nodig zijn voor een veilig gebruik van de elektrische installatie.

      4 Het derde lid is niet van toepassing op elektrische installaties voor laagspanning van beperkte omvang.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.4
  - number: '3.5'
    text: |-
      1 Elektrotechnische werkzaamheden en bedieningswerkzaamheden die gevaren kunnen opleveren, worden door deskundige,
      voldoend onderrichte en daartoe bevoegde werknemers uitgevoerd.

      2 Een ruimte waarin zich een elektrische installatie voor hoogspanning bevindt waarvan de delen niet of onvoldoende
      zijn beschermd tegen direkte of indirekte aanraking dan wel te dichte nadering, wordt slechts betreden in
      aanwezigheid van een tweede daartoe bevoegd persoon.

      3 Werkzaamheden aan of in de nabijheid van een elektrische installatie worden slechts uitgevoerd, indien de
      installatie of het gedeelte waaraan of in de nabijheid waarvan wordt gewerkt, spanningsloos is.

      4 In aanvulling op het derde lid zijn door de daartoe bevoegde werknemer tevens doeltreffende maatregelen genomen
      om een gevaarloos verloop van die werkzaamheden te waarborgen.

      5 Het derde en vierde lid zijn niet van toepassing op werkzaamheden die worden verricht aan of in de nabijheid van
      een elektrische installatie voor laagspanning, indien:

      a. de dringende noodzaak van het onder spanning uitvoeren van die werkzaamheden is aangetoond;

      b. tot het uitvoeren van die werkzaamheden door de daartoe bevoegde werknemer uitdrukkelijk opdracht is gegeven, en

      c. de installatie tevens geschikt is voor het onder spanning uitvoeren van die werkzaamheden en door de daartoe
      bevoegde werknemer doeltreffende maatregelen zijn genomen om de aan die werkzaamheden verbonden gevaren te
      voorkomen.

      6 Het derde en vierde lid zijn niet van toepassing op werkzaamheden die worden uitgevoerd aan of in de nabijheid
      van een elektrische installatie voor hoogspanning, bestaande uit:

      a. het nemen en opheffen van veiligheidsmaatregelen, waaronder begrepen het met geschikt materieel knippen of
      schieten van kabels;

      b. het uitvoeren van metingen en beproevingen, of

      c. het reinigen van elektrisch materieel.

      7 Werkzaamheden bestaande uit het reinigen van elektrisch materieel in een elektrische installatie voor
      hoogspanning als bedoeld in het zesde lid, onder c, worden slechts uitgevoerd, indien:

      a. tot het uitvoeren van die werkzaamheden door de daartoe bevoegde werknemer uitdrukkelijk opdracht is gegeven;

      b. gebruik wordt gemaakt van de voor deze werkzaamheden geschikte reinigings- en arbeidsmiddelen, en

      c. de werknemers zich met de arbeidsmiddelen waarmee zij fysiek in contact staan, niet behoeven te begeven in de
      gevarenzone van de installatie of delen daarvan die onder spanning staan.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.5
  - number: 3.5a
    text: |-
      Deze paragraaf is niet van toepassing op:

      a. gebieden die direct gebruikt worden voor en gedurende de medische behandeling van patiënten;

      b. het gebruik van gastoestellen die vallen onder het [Besluit gastoestellen][ref1];

      c. de vervaardiging, de bewerking, het gebruik, de opslag en het transport van springstoffen of chemisch instabiele
      stoffen;

      d. de winningsindustrie in dagbouw, de ondergrondse winningsindustrie en de winningsindustrie die delfstoffen wint
      met behulp van boringen;

      e. het gebruik van vervoermiddelen over land, over het water en door de lucht, met uitzondering van de voertuigen
      bedoeld voor gebruik op plaatsen waar zich een explosieve atmosfeer kan voordoen.


      [ref1]: https://wetten.overheid.nl/BWBR0005384
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.5a
    references:
      - id: ref1
        bwb_id: BWBR0005384
  - number: 3.5b
    text: |-
      1 Voor de toepassing van [artikel 19, tweede lid, van de wet][ref1] worden aangewezen de werkzaamheden verricht op
      arbeidsplaatsen waar explosieve atmosferen heersen of kunnen optreden.

      2 In aanvulling op [artikel 19, tweede lid, van de wet][ref2] coördineert de werkgever die verantwoordelijk is voor
      de arbeidsplaats, bedoeld in het eerste lid, de uitvoering van alle maatregelen inzake veiligheid en gezondheid.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel19
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.5b
    references:
