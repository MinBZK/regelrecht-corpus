  - number: 3.5e
    text: |-
      In de gevarenzones, bedoeld in [artikel 3.5d, vijfde lid][ref1], en met betrekking tot de installaties in gebieden
      zonder explosiegevaar die vereist zijn voor of bijdragen tot het explosieveilig gebruik van installaties die zich
      op plaatsen bevinden waar explosiegevaar heerst, worden in ieder geval de volgende maatregelen genomen:

      a. vrijkomende gassen, dampen, nevels of brandbaar stof die explosiegevaar kunnen doen ontstaan, worden op passende
      wijze afgevoerd en onschadelijk gemaakt;

      b. indien een explosieve atmosfeer meerdere soorten ontvlambare of brandbare gassen, dampen, nevels of stoffen
      bevat, wordt bij de veiligheidsmaatregelen uitgegaan van het grootste mogelijke risico op basis van de beoordeling,
      bedoeld in [artikel 3.5c, eerste lid][ref2];

      c. installaties, apparaten, beveiligingssystemen en het installatiemateriaal, worden, met inachtneming van
      onderdeel e, slechts in gebruik genomen indien uit het explosieveiligheidsdocument op basis van de beoordeling,
      bedoeld in [artikel 3.5c, eerste lid][ref3], is gebleken dat aan het gebruik ervan geen explosiegevaar is
      verbonden;

      d. onderdeel c is van overeenkomstige toepassing op arbeidsmiddelen en de verbindingsstukken ervan die geen
      apparaten en beveiligingssystemen zijn als bedoeld in het [Warenwetbesluit explosieveilig materieel][ref4], indien
      hun opneming in de installaties aanleiding kan geven tot ontstekingsgevaar;

      e. voor zover het explosieveiligheidsdocument op basis van de beoordeling, bedoeld in
      [artikel 3.5c, eerste lid][ref5], geen andere eisen stelt, worden in de gevarenzones
      apparaten en beveiligingssystemen gebruikt overeenkomstig de categorieën als bedoeld in het
      [Warenwetbesluit explosieveilig materieel][ref6] en toegepast volgens de navolgende principes:

      1°. gevarenzone 0 of 20: categorie 1-apparatuur;

      2°. gevarenzone 1 of 21: categorie 1- of categorie 2-apparatuur;

      3°. gevarenzone 2 of 22: categorie 1-, categorie 2- of categorie 3-apparatuur;

      f. de nodige maatregelen worden getroffen ter voorkoming van verwisseling van installatiemateriaal;

      g. in gebieden waar een explosieve atmosfeer kan ontstaan wordt aan werknemers werkkleding ter beschikking gesteld
      die voldoet aan [afdeling 1 van hoofdstuk 8][ref7] en die door de werknemers bij de arbeid steeds wordt gedragen;

      h. indien een toestand ontstaat waarin een explosie zich kan gaan voordoen, worden werknemers optisch of akoestisch
      gewaarschuwd en teruggetrokken;

      i. voor de eerste inbedrijfstelling van een arbeidsplaats en bij iedere belangrijke wijziging, uitbreiding
      of verbouwing van de arbeidsplaats, arbeidsmiddelen of het arbeidsproces waarbij explosieve atmosferen kunnen
      voorkomen, wordt de explosieveiligheid van de gehele installatie gecontroleerd door een ter zake deskundig persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3.5d
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel3.5c
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel3.5c
      [ref4]: https://wetten.overheid.nl/BWBR0007497
