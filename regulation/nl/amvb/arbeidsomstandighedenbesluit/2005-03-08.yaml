  - number: '9.20'
    text: |-
      Vrijstellingen of ontheffingen worden slechts verleend voor beperkte duur en worden in ieder geval ingetrokken
      wanneer de redenen waarom zij zijn verleend, zijn vervallen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel9.20
  - number: '9.22'
    text: |-
      1 Omtrent de wijze waarop de voorschriften, gesteld krachtens de [artikelen 6, eerste lid][ref1],
      en [16 van de wet][ref2] moeten worden nageleefd kan een eis worden gesteld overeenkomstig
      [artikel 27, eerste lid, van de wet][ref3].

      2 Het eerste lid geldt niet in de gevallen, bedoeld in [artikel 1.33][ref4].

      3 Het eerste lid geldt voorts niet ten aanzien van de volgende artikelen:

      a. van hoofdstuk 1: de [artikelen 1.26 tot en met 1.32][ref5] en [1.34][ref6];

      b. van hoofdstuk 2: [artikel 2.37, tweede lid][ref7];

      c. van hoofdstuk 4: de [artikelen 4.5, eerste en tweede lid][ref8], [4.58][ref9], [4.59][ref10],
      [4.60, eerste en derde lid][ref11], [4.61, tweede lid][ref12], [4.78][ref13], [4.83][ref14], [4.105][ref15],
      [4.108][ref16], [4.109][ref17] en [4.110][ref18];

      d. van hoofdstuk 6: de artikelen [6.27][ref19], [6.29][ref20] en [6.29a][ref21].

      4 Bij het stellen van een eis aan een werkgever of werknemer, waarop zowel [afdeling 2][ref22] als
      [afdeling 4][ref23] of [6 van hoofdstuk 1][ref24] van toepassing is, wordt het ter zake in [afdeling 4][ref25] of
      [6][ref26] bepaalde in acht genomen.

      5 Een eis waarop [afdeling 2 van hoofdstuk 2][ref27] van toepassing is, die met een voorschrift dat is verbonden
      aan een op grond van een der wetten tot bescherming van het milieu verleende vergunning tot het oprichten, in
      werking brengen of houden, uitbreiden of wijzigen van een bedrijf of inrichting dan wel tot het veranderen van een
      daarin gebezigde werkwijze één of meer zodanige raakpunten heeft dat hij met dat voorschrift in strijd kan komen,
      stelt de daartoe aangewezen ambtenaar, bedoeld in [artikel 24 van de wet][ref28], niet dan na overleg met het gezag
      dat de vergunning heeft verleend.

      6 Bij het stellen van een eis aan een werkgever of werknemer, waarop [afdeling 4][ref29] of
      [6 van hoofdstuk 1][ref30] van toepassing is, wordt het ter zake in die afdeling bepaalde in acht genomen.

      7 Indien ten aanzien van een of meer bepalingen van dit besluit overeenkomstig
      [artikel 27, eerste lid, van de wet][ref31], een eis tot naleving is gesteld, kan in die situatie van het
      betreffende voorschrift respectievelijk de betreffende voorschriften geen ontheffing meer worden verleend.


