  - number: '2.4'
    text: |-
      1 De in [artikel 2.3, eerste lid][ref1], bedoelde grenswaarde bedraagt:

      a. voor brandbare stoffen: 10 000 kilogram;

      b. voor extreem toxische stoffen: 1 kilogram;

      c. voor ontplofbare stoffen: de hoeveelheid waarvan de explosie-energie equivalent is aan de explosie-energie van
      1000 kilogram trinitrotolueen, waarbij de explosie-energie van trinitrotolueen wordt gesteld op 4 600 kilojoule
      per kilogram.

      2 Voor toxische stoffen worden de grenswaarden, bedoeld in [artikel 2.3, eerste lid][ref2], afgeleid op basis
      van de toxicologische gegevens en de fysische omstandigheid bij 25° C van de grenswaarde voor chloor, waarbij
      de grenswaarde voor chloor op 300 kilogram wordt gesteld. Bij deze afleiding wordt uitgegaan van een lethale
      concentratie 50 bij een blootstelling van de rat gedurende één uur aan de stof.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2.3
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2.3
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel2.4
