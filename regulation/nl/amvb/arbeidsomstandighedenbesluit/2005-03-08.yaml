  - number: '1.10'
    text: |-
      Tenzij hierna anders is bepaald, zijn de wet en dit besluit van toepassing op werknemers in onderwijsinrichtingen
      en op overeenkomstige wijze van toepassing op leerlingen en studenten in onderwijsinrichtingen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel1.10
  - number: '1.11'
    text: |-
      1 Voor bekostigde onderwijsinrichtingen als bedoeld in
      [artikel 1.3, tweede lid, onder a tot en met c, en onder e tot en met h][ref1], komen de rechten, bedoeld
      in [artikel 12, tweede en derde lid, van de wet][ref2], voor zover van toepassing, toe aan de leden van de
      medezeggenschapsraad.

      2 Voor de in het eerste lid genoemde bekostigde onderwijsinrichtingen treedt voor de toepassing van
      [artikel 12, vierde en vijfde lid, van de wet][ref3] de medezeggenschapsraad in de plaats van de ondernemingsraad.

      3 Voor de in het eerste lid genoemde bekostigde onderwijsinrichtingen worden de in de wet en dit besluit
      toekomende rechten en bevoegdheden met inachtneming van [artikel 1.13][ref4], uitgeoefend door de leden van de
      medezeggenschapsraad of, indien het betreft aangelegenheden van algemeen belang voor de bijzondere rechtstoestand
      van het personeel, door het overlegorgaan van het decentraal georganiseerd overleg respectievelijk van de
      instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1.3
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0008498#Artikel1.13
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel1.11
