  - number: '7.41'
    text: |-
      1 De voor de arbeid benodigde arbeidsmiddelen zijn, voor zover zij gevaar voor personen opleveren, voorzien van een
      doelmatige afscherming.

      2 De voor de arbeid benodigde arbeidsmiddelen met een bedieningssysteem zijn, zo dicht mogelijk bij de plaats van
      de persoon die het arbeidsmiddel bedient, voorzien van een zodanige inrichting dat dit arbeidsmiddel afzonderlijk,
      veilig en met zekerheid kan worden stilgezet en niet dan opzettelijk weer in beweging kan worden gebracht.

      3 De benodigde arbeidsmiddelen worden op de juiste wijze onderhouden en zonodig gerepareerd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.41
  - number: '7.42'
    text: |-
      1 Aan de voor de arbeid benodigde arbeidsmiddelen met een bedieningssysteem welke gevaren van elektrische aard met
      zich brengen, zijn doeltreffende beveiligingen aangebracht, waarvan de werking zoveel mogelijk onafhankelijk is van
      degene die dat arbeidsmiddel bedient.

      2 Indien het in verband met de werkzaamheden noodzakelijk is dat elektrische apparatuur moet worden aangesloten
      of anderszins leidingen of kabels moeten worden aangelegd, gebeurt dit op een juiste wijze opdat daarvan door de
      thuiswerker veilig gebruik kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.42
  - number: '8.1'
    text: |-
      1 Een door de werkgever aan de werknemer ter beschikking gesteld persoonlijk beschermingsmiddel is in
      overeenstemming met de betreffende bepalingen inzake ontwerp en constructie op het gebied van veiligheid en
      gezondheid, bedoeld in het [Warenwetbesluit persoonlijke beschermingsmiddelen][ref1]. De vorige volzin is slechts
      van toepassing voor zover bedoeld persoonlijk beschermingsmiddel onder het toepassingsgebied van genoemd besluit
      valt.

      2 In alle gevallen moet een persoonlijk beschermingsmiddel:

      a. geschikt zijn voor de te vermijden gevaren, zonder zelf een vergroot gevaar in te houden;

      b. beantwoorden aan de bestaande omstandigheden op de arbeidsplaats;

      c. afgestemd zijn op de ergonomische eisen en de vereisten met betrekking tot de gezondheid van de werknemers;

      d. na de nodige aanpassingen geschikt zijn voor de drager.

      3 Indien verschillende gevaren het tegelijkertijd dragen van meer dan één persoonlijk beschermingsmiddel
      noodzakelijk maken, zijn deze persoonlijke beschermingsmiddelen op elkaar afgestemd en blijven zij doelmatig tegen
      het betreffende gevaar of de betreffende gevaren.

      4 De keuze van het persoonlijk beschermingsmiddel en de wijze waarop dit gebruikt moet worden, met name wat betreft
      de duur van het dragen, worden bepaald afhankelijk van de ernst van het gevaar, de frequentie van de blootstelling
      aan het gevaar en de kenmerken van de arbeidsplaats van iedere werknemer afzonderlijk alsmede van de doelmatigheid
      van het persoonlijk beschermingsmiddel.

      5 Een persoonlijk beschermingsmiddel is in beginsel bestemd voor gebruik door één persoon. Indien de omstandigheden
      vereisen dat een persoonlijk beschermingsmiddel door meer dan één persoon gebruikt wordt, worden doeltreffende
      maatregelen genomen, opdat een dergelijk gebruik geen gezondheids- of hygiëneproblemen oplevert voor de
      onderscheiden gebruikers.

      6 Adequate gegevens over ieder persoonlijk beschermingsmiddel, nodig voor de toepassing van het eerste, tweede,
      derde en vierde lid, zijn in het bedrijf of de inrichting beschikbaar en worden zonodig doorgegeven.

      7 Persoonlijke beschermingsmiddelen worden slechts voor de beoogde doeleinden gebruikt.

      8 Persoonlijke beschermingsmiddelen worden overeenkomstig de gebruiksaanwijzing gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0005570
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0005570
  - number: '8.2'
    text: |-
      Alvorens een persoonlijk beschermingsmiddel te kiezen maakt de werkgever, in het kader van de risico-inventarisatie
      en -evaluatie, bedoeld in [artikel 5 van de wet][ref1], een beoordeling van de uitrusting die hij voornemens is ter
      beschikking te stellen, teneinde na te gaan in hoeverre deze voldoet aan de in artikel 8.1, eerste, tweede en derde
      lid gestelde voorwaarden. Deze beoordeling omvat:

      a. een risico-inventarisatie en -evaluatie van de gevaren die niet met andere middelen vermeden kunnen worden;

      b. een omschrijving van de kenmerken die de persoonlijke beschermingsmiddelen moeten bezitten om de onder
      *a* vermelde gevaren te kunnen ondervangen, rekening houdend met eventuele gevaarsbronnen die de persoonlijke
      beschermingsmiddelen zelf kunnen vormen;

      c. een risico-inventarisatie en -evaluatie van de kenmerken van de betreffende persoonlijke beschermingsmiddelen
      die beschikbaar zijn, vergeleken met de onder *b* bedoelde kenmerken.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
  - number: '8.3'
    text: |-
      1 Indien gevaar voor de veiligheid of de gezondheid van een werknemer op de arbeidsplaats aanwezig is of
      kan ontstaan, zijn voor de werknemers die aan dat gevaar blootstaan of kunnen blootstaan, persoonlijke
      beschermingsmiddelen in voldoende aantal beschikbaar.

      2 In de gevallen, bedoeld in het eerste lid, wordt ervoor gezorgd dat de werknemers de persoonlijke
      beschermingsmiddelen gebruiken.

      3 Persoonlijke beschermingsmiddelen worden onderhouden, gerepareerd en zindelijk gehouden.

      4 Ten behoeve van het goed functioneren van persoonlijke beschermingsmiddelen vinden de noodzakelijke vervangingen
      daarvan plaats.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel8.3
  - number: '8.4'
    text: |-
      1 Ter voorkoming of beperking van gevaren voor de veiligheid en de gezondheid van werknemers zorgt de werkgever
      ervoor dat, indien de gevaren op de arbeidsplaats of de gevaren van een arbeidsmiddel daartoe aanleiding geven,
      doeltreffende veiligheids- of gezondheidssignalering aanwezig is.

      2 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel8.4
  - number: '8.14'
    text: |-
      1 Afdeling 2 van dit hoofdstuk is niet van toepassing op de in of op een luchtvaartuig, een zeeschip
      of een binnenvaartuig dan wel een voertuig op de openbare weg, of spoorweg gebruikte veiligheids- of
      gezondheidssignalering, voor zover deze signalering op grond van enig ander wettelijk voorschrift is
      voorgeschreven.

      2 De in artikel 8.4 bedoelde veiligheids- of gezondheidssignalering wordt, indien daar reden toe is, in of op de
      vervoermiddelen, genoemd in het eerste lid, gebruikt, wanneer deze zich bevinden op het terrein van het bedrijf of
      de inrichting.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel8.14
  - number: '8.15'
    text: Afdeling 1 van dit hoofdstuk is van overeenkomstige toepassing op thuiswerk.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel8.15
