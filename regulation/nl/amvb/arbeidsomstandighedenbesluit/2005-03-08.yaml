  - number: 3.37t
    text: |-
      1 Op een mijnbouwinstallatie zijn voor onmiddellijk gebruik voldoende geschikte middelen voor redding, evacuatie en
      voor directe ontsnapping in zee in noodgevallen beschikbaar.

      2 Als evacuatie van werknemers moet geschieden langs moeilijke vluchtwegen of via plaatsen waar de lucht niet
      of mogelijk niet ingeademd kan worden, staat zelfreddingsapparatuur voor onmiddellijk gebruik op de werkplek ter
      beschikking van de werknemers.

      3 Reddingsmiddelen als bedoeld in het eerste lid voldoen aan de volgende voorschriften:

      a. ze zijn functioneel en zo nodig uitgerust met voorzieningen om lang genoeg te kunnen overleven;

      b. er zijn er voldoende van om alle werknemers die zich in de installatie kunnen ophouden te kunnen evacueren;

      c. het type is afgestemd op de arbeidsplaats;

      d. ze zijn van betrouwbare materialen gemaakt, rekening houdend met de reddingsfunctie en de omstandigheden waarin
      ze eventueel zullen worden gebruikt of waarin ze gebruiksklaar worden gehouden; en

      e. ze hebben een kleur die opvalt wanneer ze worden gebruikt en zijn uitgerust met voorzieningen waarmee de
      gebruiker de aandacht van de redders kan trekken.

      4 Het materiaal, dat nodig is in geval bij een ongeval vervoer per helikopter plaatsvindt, ligt gebruiksklaar
      opgeslagen in de onmiddellijke nabijheid van de helikopterlandingsplaats.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.37t
  - number: 3.37u
    text: |-
      Op mijnbouwinstallaties worden branddetectie- en brandbeschermingssystemen, inrichtingen voor brandblussing of
      branddoving en alarmsystemen afgeschermd tegen ongelukken en wel op zodanige wijze dat hun functies in noodgevallen
      operationeel blijven. Zo nodig worden dergelijke systemen in dubbele uitvoering aangebracht.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.37u
  - number: 3.37v
    text: |-
      1 Er wordt een noodplan opgesteld voor het geval dat iemand overboord valt of de arbeidsplaats moet worden
      geëvacueerd.

      2 Het noodplan, dat is gebaseerd op het veiligheids- en gezondheidsdocument, bedoeld in [artikel 2.42][ref1],
      voorziet in het gebruik van bijstandsboten en helicopters en bevat criteria voor de capaciteit en de reactietijd
      daarvan. De vereiste reactietijd wordt in het veiligheids- en gezondheidsdocument van elke installatie vermeld.

      3 De bijstandsboten zijn doelmatig ontworpen en uitgerust en voldoen aan de eisen in verband met evacuatie en
      redding.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste tot en met derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2.42
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.37v
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2.42'
        hoofdstuk: '2'
        afdeling: '6'
  - number: 3.37w
    text: |-
      1 In aanvulling op [artikel 3.21][ref1] wordt, wanneer de aard, de omvang en de duur van de werkzaamheden op een
      mijnbouwinstallatie zulks vereisen, de nodige verblijfsaccommodatie ter beschikking gesteld.

      2 Leidingen die in geval van lekkage direct gevaar voor de gezondheid kunnen opleveren worden buiten de
      accommodatie en de hiermee in verbinding staande gangen gehouden. Deze accommodatie:

      a. is afdoende beschermd tegen de gevolgen van explosies, binnendringen van rook en gas en het uitbreken
      en de verbreiding van brand, zoals omschreven in het veiligheids- en gezondheidsdocument, bedoeld in
      [artikel 2.42][ref2];

      b. is beschermd tegen weersomstandigheden en tegen geluids- en stankhinder en ontwikkeling van rookgassen uit
      andere ruimten, welke gevaarlijk voor de gezondheid kunnen zijn;

      c. staat niet in rechtstreekse verbinding met besloten ruimten, waarin machines, ketels, tanks, drukvaten en
      dergelijke zijn opgesteld;

      d. is afgescheiden van elke werkplek en ligt buiten gevarenzones;

      e. staat, voorzover het een slaapverblijf betreft, niet in rechtstreekse verbinding met ontspanningsruimten, noch
      met ruimten voor het bereiden en bewaren van voedsel.

      3 De verblijfsaccommodatie is voorzien van voldoende bedden of kooien, rekening houdend met het aantal
      werknemers dat naar verwachting in de installatie zal slapen. In een slaapverblijf bevinden zich ten hoogste twee
      slaapplaatsen.

      4 Elke verblijfsaccommodatie beschikt over voldoende plaats voor het opbergen van kleding en, indien daarin in de
      regel ten minste tien personen verblijven, een aparte was- en droogruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3.21
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2.42
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.37w
    references:
