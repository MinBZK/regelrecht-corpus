        artikel: '2.42'
        hoofdstuk: '2'
        afdeling: '6'
  - number: 3.37x
    text: |-
      Op een bemande mijnbouwinstallatie zijn voor het bereiden en bewaren van voedsel doelmatig ingerichte ruimten
      aanwezig, welke ruimten voor geen ander doel worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.37x
  - number: 3.37y
    text: |-
      Tijdens de plaatsing van een mijnbouwinstallatie worden alle noodzakelijke maatregelen genomen om de veiligheid en
      de gezondheid van de werknemers te waarborgen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.37y
  - number: '3.38'
    text: |-
      In benzinestations zijn naast de voorschriften van afdeling 1 tevens de voorschriften van deze afdeling van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.38
  - number: '3.39'
    text: |-
      1 Benzinestations, waarvan de winkel op werkdagen tussen 18.30 uur en 06.00 uur, op zondag, op Nieuwjaarsdag, op
      tweede Paasdag, op Hemelvaartsdag, op tweede Pinksterdag, op eerste Kerstdag, op tweede Kerstdag of op de dag,
      waarop de verjaardag van de Koning wordt gevierd, geopend is, zijn voorzien van:

      a. een inwerpgeldkluis;

      b. een optische of akoestische alarminstallatie, tenzij het benzinestation is voorzien van een alarminstallatie als
      bedoeld in [artikel 3.40, onder ][ref1];

      c. een verlichtingsinstallatie welke gedurende ten minste vijftien minuten na sluiting van het benzinestation dat
      benzinestation blijft verlichten.

      2 Bij benzinestations waar een of meer benzinepompen worden bediend door een aldaar werkzame persoon, is de
      toegangsdeur tot de winkel in het benzinestation ten minste aan de binnenzijde afsluitbaar.

      3 Bij benzinestations waar geen enkele benzinepomp wordt bediend door een aldaar werkzame persoon, is
      de toegangsdeur tot de winkel in het benzinestation voorzien van een op afstand bedienbaar elektronisch
      sluitingsmechanisme dat uitsluitend vanuit de winkel kan worden bediend.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3.40
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.39
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3.40'
        hoofdstuk: '3'
        afdeling: '4'
  - number: '3.40'
    text: |-
      Voor benzinestations, waarvan de winkel tussen 21.00 uur en 06.00 uur geopend is, gelden in aanvulling op
      [artikel 3.39][ref1] de volgende voorschriften:

      a. in de winkel in het benzinestation is ten minste één camera aanwezig die is aangesloten op een recorder, welke
      al dan niet met tijdsintervallen de camerabeelden opneemt;

      b. het benzinestation is voorzien van een alarminstallatie, welke langs telecommunicatieverbindingen zo nodig een
      alarmsignaal afgeeft bij een door Onze Minister van Justitie toegelaten alarmcentrale;

      c. de plaats in de winkel in een benzinestation waar de kassa zich bevindt, is omgeven door kogelwerend en slagvast
      materiaal dat tenminste voor een deel doorzichtig is, en

      d. op het sluitingstijdstip van het benzinestation zijn tenminste twee aldaar werkzame personen ter plaatse
      aanwezig.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3.39
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.40
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3.39'
        hoofdstuk: '3'
        afdeling: '4'
  - number: '3.41'
    text: |-
      [Artikel 3.20][ref1] is niet van toepassing op leerlingen respectievelijk studenten in onderwijsinrichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3.20
