  - number: 4.10c
    text: |-
      1 De arbeidsgezondheidskundige onderzoeken, bedoeld in de [artikelen 4.10a][ref1] en [4.10b][ref2], vinden plaats
      met inachtneming van de praktische aanbevelingen, die op grond van artikel 12, tweede lid en bijlage II bij de
      [richtlijn 98/24/EG](31998L0024) van de Raad van de Europese Unie van 7 april 1998 (PbEG 1998, L 131) betreffende
      de bescherming van de gezondheid en de veiligheid van werknemers tegen risico's van chemische agentia op het werk
      (veertiende bijzondere richtlijn in de zin van artikel 16, lid 1, van [Richtlijn 89/391/EEG](31989L0391)), worden
      opgesteld.

      2 Aan de arbodienst worden alle gegevens ter beschikking gesteld die nodig zijn om de blootstelling van de
      werknemers aan gevaarlijke stoffen te kunnen beoordelen en te kunnen adviseren over de periodiciteit en inhoud
      van de arbeidsgezondheidskundige onderzoeken, bedoeld in het eerste lid, de te nemen preventieve maatregelen of
      persoonlijke beschermende maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.10a
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4.10b
