      [9.15, onder a, sub 1° tot en met 4°, en onder b][ref22];

      d. van hoofdstuk 6: de [artikelen 6.14a][ref23], 6.15a, [6.16][ref24], [6.17][ref25], [6.18][ref26],
      [6.19, eerste lid][ref27], en [6.20][ref28];

      e. van hoofdstuk 7: [artikel 7.4, eerste en tweede lid][ref29], voor zover het betreft landbouwtrekkers die 800 kg
      of meer wegen, en [artikel 7.32, eerste en tweede lid][ref30].


