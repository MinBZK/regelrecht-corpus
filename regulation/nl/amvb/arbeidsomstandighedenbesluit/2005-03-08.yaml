  - number: '7.5'
    text: |-
      1 De nodige maatregelen worden genomen om ervoor te zorgen dat de arbeidsmiddelen tijdens de gehele gebruiksduur
      door toereikend onderhoud in een zodanige staat worden gehouden, dat gevaar voor de veiligheid en de gezondheid van
      de werknemers zoveel mogelijk is voorkomen.

      2 Onderhouds-, reparatie- en reinigingswerkzaamheden aan een arbeidsmiddel worden slechts uitgevoerd indien
      het arbeidsmiddel is uitgeschakeld en drukloos of spanningsloos is gemaakt. Indien dit niet mogelijk is worden
      doeltreffende maatregelen genomen om die werkzaamheden veilig te kunnen uitvoeren.

      3 Het tweede lid is van overeenkomstige toepassing op productie- en afstelwerkzaamheden met of aan een
      arbeidsmiddel.

      4 Een bij een arbeidsmiddel behorend onderhoudsboek wordt goed bijgehouden.

      5 Montage en demontage van een arbeidsmiddel vindt op veilige wijze plaats, met inachtneming van de eventuele
      aanwijzingen van de fabrikant.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.5
  - number: '7.6'
    text: |-
      1 Met betrekking tot arbeidsmiddelen waarvan het gebruik een specifiek gevaar voor de veiligheid van de werknemers
      kan opleveren blijft het gebruik voorbehouden aan werknemers die met het gebruik belast zijn.

      2 Werknemers die belast zijn met het ombouwen, onderhouden, repareren of reinigen van arbeidsmiddelen als bedoeld
      in het eerste lid, bezitten daartoe een specifieke deskundigheid en ervaring.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.6
  - number: '7.7'
    text: |-
      1 Indien bewegende delen van een arbeidsmiddel gevaar opleveren, zijn zij van zodanige schermen of
      beveiligingsinrichtingen voorzien, dat het gevaar zoveel mogelijk wordt voorkomen.

      2 De schermen of beveiligingsinrichtingen zijn stevig uitgevoerd.

      3 De schermen of beveiligingsinrichtingen leveren geen bijzondere gevaren op.

      4 De schermen of beveiligingsinrichtingen kunnen niet op eenvoudige wijze worden genegeerd of buiten werking worden
      gesteld.

      5 De schermen of beveiligingsinrichtingen zijn op voldoende afstand van de gevaarlijke zone van het arbeidsmiddel
      aangebracht.

      6 De schermen of beveiligingsinrichtingen belemmeren het zicht op de arbeid zo min mogelijk.

      7 De schermen of beveiligingsinrichtingen zijn op een zodanige wijze aangebracht dat de noodzakelijke onderhouds-
      en reparatiewerkzaamheden op veilige wijze kunnen worden uitgevoerd. Daarbij wordt zoveel mogelijk voorkomen dat de
      schermen of beveiligingsinrichtingen moeten worden gedemonteerd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.7
  - number: '7.8'
    text: In aanvulling op artikel 6.3 zijn werk- en onderhoudspunten van een arbeidsmiddel voldoende en doelmatig verlicht.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.8
  - number: '7.9'
    text: |-
      Zoveel mogelijk wordt voorkomen dat werknemers in de onmiddellijke nabijheid komen van een arbeidsmiddel of een
      onderdeel daarvan met een zeer hoge of zeer lage temperatuur. Indien dat niet mogelijk is, zijn doeltreffende
      maatregelen genomen om aanraking van dat arbeidsmiddel dan wel van dat onderdeel daarvan te voorkomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.9
  - number: '7.10'
    text: |-
      Alarmsignalen van een arbeidsmiddel zijn gemakkelijk en duidelijk waarneembaar en als zodanig goed herkenbaar. Zij
      voldoen aan het bij of krachtens [afdeling 2 van hoofdstuk 8][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.10
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '8'
        afdeling: '2'
  - number: '7.11'
    text: |-
      1 Een arbeidsmiddel beschikt over duidelijk herkenbare voorzieningen waarmee het van zijn krachtbronnen kan worden
      losgekoppeld.

      2 Het na loskoppeling opnieuw aansluiten van een arbeidsmiddel op zijn krachtbron levert geen gevaar op voor de
      werknemers.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.11
  - number: 7.11a
    text: |-
      1 Een bij een arbeidsmiddel behorende gebruiksaanwijzing wordt in begrijpelijke vorm ter kennis gebracht van de
      betrokken werknemers.

      2 Indien het gebruik of de aanwezigheid van arbeidsmiddelen in de onmiddellijke werkomgeving gevaren voor
      de werknemers kunnen opleveren, worden zij hierop gewezen, ook indien de werknemers van deze middelen geen
      rechtstreeks gebruik maken.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.11a
  - number: '7.12'
    text: |-
      Op een arbeidsmiddel met een bedieningssysteem zijn naast de voorschriften van de [afdelingen 1][ref1] en
      [2][ref2] van dit hoofdstuk tevens de voorschriften van deze afdeling van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.12
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '7'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008498
        hoofdstuk: '7'
        afdeling: '2'
  - number: '7.13'
    text: |-
      1 Een bedieningssysteem van een arbeidsmiddel is veilig.

      2 Een bedieningssysteem levert ook bij onopzettelijke handelingen geen gevaar op voor de werknemers.

      3 Bij de keuze van een bedieningssysteem wordt rekening gehouden met defecten, storingen en belastingen die bij het
      gebruik van het bedieningssysteem kunnen worden verwacht.

      4 Een bedieningssysteem is duidelijk zichtbaar en herkenbaar en is daartoe, waar nodig, op passende wijze van
      functionele aanduidingen voorzien.

      5 Een bedieningssysteem bevindt zich zoveel mogelijk buiten de gevaarlijke zone van het arbeidsmiddel.

      6 De plaats van het bedieningssysteem levert geen extra gevaren op voor de werknemers.

      7 Indien een arbeidsmiddel in werking kan worden gesteld of kan worden gestopt op een plaats van waar dat
      arbeidsmiddel niet geheel kan worden gezien, wordt, om de betrokken werknemers te beschermen, telkens tijdig voor
      het inwerkingstellen of stoppen van dat arbeidsmiddel een signaal gegeven dat voldoet aan het bij of krachtens
      [afdeling 2 van hoofdstuk 8][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.13
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '8'
        afdeling: '2'
  - number: '7.14'
    text: |-
      1 Een arbeidsmiddel kan uitsluitend in werking worden gesteld door een opzettelijk verrichte handeling met een
      daarvoor bestemd bedieningssysteem.

      2 Het eerste lid is van overeenkomstige toepassing voor het opnieuw in werking stellen na stilstand ongeacht
      de oorzaak daarvan, alsmede voor het bewerkstelligen van een belangrijke wijziging in de werking van het
      arbeidsmiddel, tenzij het opnieuw inwerkingstellen of deze wijziging geen gevaren voor personen kunnen opleveren.

      3 Het tweede lid is niet van toepassing, indien het inwerkingstellen of wijzigen van de werking van een
      arbeidsmiddel behoort tot het normale programma van een automatische cyclus.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.14
  - number: '7.15'
    text: |-
      1 Een arbeidsmiddel kan op veilige wijze worden stopgezet met een daarvoor bestemd bedieningssysteem. Een
      bedieningssysteem stopt naar gelang het gevaar hetzij het gehele arbeidsmiddel hetzij onderdelen daarvan, zodanig
      dat het arbeidsmiddel in een veilige toestand is.

      2 Wanneer het arbeidsmiddel of onderdelen daarvan zijn stopgezet, wordt de energietoevoer naar het arbeidsmiddel of
      de onderdelen daarvan die het gevaar veroorzaken, onderbroken.

      3 De opdracht tot het stopzetten van een arbeidsmiddel of een onderdeel daarvan kan niet worden opgeheven door een
      opdracht tot starten van dat arbeidsmiddel of een onderdeel daarvan.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.15
  - number: '7.16'
    text: |-
      Een arbeidsmiddel beschikt over een noodstopvoorziening, indien dit met het oog op de gevaren van dat arbeidsmiddel
      en de normale tijd die nodig is om dat arbeidsmiddel stop te zetten noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.16
  - number: '7.17'
    text: |-
      Op de in deze afdeling genoemde specifieke arbeidsmiddelen en werkzaamheden zijn naast de voorschriften van de
      [afdelingen 1 tot en met 3][ref1] van dit hoofdstuk tevens de voorschriften van deze afdeling van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.17
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '7'
        afdeling: '1'
  - number: 7.17a
    text: |-
      1 Mobiele arbeidsmiddelen waarop een of meer personen kunnen worden vervoerd, zijn zodanig uitgerust dat het gevaar
      voor deze personen tijdens het vervoer zoveel mogelijk wordt beperkt.

      2 Mobiele arbeidsmiddelen, met uitzondering van heftrucks, waarmee een of meer personen kunnen worden vervoerd,
      zijn zodanig uitgerust dat onder de feitelijke gebruiksomstandigheden de gevaren als gevolg van het kantelen of
      omvallen van het mobiele arbeidsmiddel zoveel mogelijk worden beperkt door:

      a. een beschermingsconstructie die verhindert dat het mobiele arbeidsmiddel meer dan een kwartslag kantelt;

      b. een constructie die ervoor zorgt dat er rond de te vervoeren personen voldoende vrije ruimte voorhanden is,
      wanneer het mobiele arbeidsmiddel zich meer dan een kwartslag kan bewegen, of

      c. andere voorzieningen met een gelijk veiligheidsniveau.

      3 Het tweede lid is niet van toepassing indien het mobiele arbeidsmiddel tijdens het gebruik wordt gestabiliseerd
      of indien het mobiele arbeidsmiddel zodanig is ontworpen dat het niet kan kantelen of omvallen.

      4 Indien het gevaar bestaat dat de te vervoeren personen bij kanteling of omslaan bekneld kunnen raken tussen
      de delen van het mobiele arbeidsmiddel en de grond, is een systeem geïnstalleerd waarmee zij kunnen worden
      tegengehouden.

      5 Heftrucks waarmee een of meer personen kunnen worden vervoerd, zijn zodanig uitgerust, dat het gevaar van
      kantelen of de gevolgen daarvan zoveel mogelijk worden beperkt door:

      a. een bestuurderscabine;

      b. een inrichting die verhindert dat de heftruck kantelt;

      c. een inrichting die ervoor zorgt dat, indien de heftruck kantelt, er voor de te vervoeren personen voldoende
      vrije ruimte is tussen de grond en bepaalde delen van de heftruck;

      d. een inrichting op elke zitplaats van de heftruck, waarmee de op de truck aanwezige personen zich op de zitplaats
      kunnen vastzetten, of

      e. andere voorzieningen met een gelijk veiligheidsniveau.

      6 Indien het onverhoeds blokkeren van onderdelen voor de energie-overbrenging tussen het mobiele arbeidsmiddel en
      zijn hulpstukken of aanhangers specifieke gevaren kan opleveren, is dit arbeidsmiddel uitgerust met een voorziening
      die deze blokkering verhindert. Indien een dergelijke blokkering niet kan worden verhinderd, zijn zodanige
      maatregelen genomen dat de gevaren zoveel mogelijk worden beperkt.

      7 Mobiele arbeidsmiddelen zijn voorzien van middelen voor de bevestiging van onderdelen voor de energie-
      overbrenging, wanneer deze onderdelen vervuild of beschadigd kunnen raken doordat zij over de grond slepen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.17a
  - number: 7.17b
    text: |-
      1 In aanvulling op [artikel 7.17a][ref1] is dit artikel van toepassing op mobiele arbeidsmiddelen met eigen
      aandrijving waarvan de verplaatsing gevaren voor de werknemers kan opleveren.

      2 Mobiele arbeidsmiddelen worden uitgerust met:

      a. voorzieningen om te vermijden dat zij door onbevoegden in werking kunnen worden gesteld;

      b. een inrichting die automatisch verhindert dat het mobiele arbeidsmiddel, indien dit middel elektrisch wordt
      aangedreven, onverhoeds in beweging kan komen wanneer de bestuurder het middel verlaat of heeft verlaten;

      c. doeltreffende voorzieningen ter beperking van de gevolgen van een eventuele botsing, indien verschillende, op
      rails rijdende arbeidsmiddelen tegelijkertijd worden verplaatst;

      d. een rem- en stopvoorziening;

      e. een noodvoorziening, voorzover die om veiligheidsredenen noodzakelijk is, welke voorziening bij het uitvallen
      van het hoofdsysteem van de rem- en stopvoorziening het mobiele arbeidsmiddel door gemakkelijk toegankelijke
      besturingsorganen of door automatische systemen het mobiele arbeidsmiddel kan afremmen en tot stilstand brengen;

      f. doeltreffende hulpmiddelen die een toereikend zicht voor de bestuurder mogelijk maken indien het directe
      gezichtsveld van hem ontoereikend is om de veiligheid van personen te waarborgen, en

      g. deugdelijke voorzieningen waarmee signalen kunnen worden gegeven die voldoen aan het bij of krachtens
      [afdeling 2 van hoofdstuk 8][ref2] bepaalde.

      3 Indien mobiele arbeidsmiddelen 's nachts of op donkere plaatsen worden gebruikt, zijn zij voorzien van een
      verlichtingsinstallatie die is aangepast aan het uit te voeren werk en die de werknemers voldoende veiligheid
      biedt.

      4 Indien mobiele arbeidsmiddelen, hun aanhangers, of ladingen brandgevaar voor personen kunnen opleveren, zijn zij
      voorzien van doeltreffende brandbestrijdingsmiddelen, tenzij de arbeidsplaats hiermee op voldoende korte afstand
      van deze arbeidsmiddelen, hun aanhangers of ladingen is uitgerust.

      5 Indien mobiele arbeidsmiddelen op afstand worden bediend, komen zij automatisch tot stilstand wanneer zij het
      controlegebied verlaten.

      6 Indien mobiele arbeidsmiddelen op afstand worden bediend en onder normale gebruiksomstandigheden werknemers
      kunnen aan- of klemrijden, zijn zij uitgerust met voorzieningen die bescherming tegen deze gevaren bieden, tenzij
      er andere geschikte voorzieningen aanwezig zijn om het gevaar van aanrijdingen te beperken.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel7.17a
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk8
