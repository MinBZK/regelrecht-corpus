  - number: '4.50'
    text: |-
      1 De concentratie van asbeststof in de lucht waaraan de werknemers in verband met de arbeid worden blootgesteld
      wordt, in het kader van de risico-inventarisatie en -evaluatie, bedoeld in [artikel 5 van de wet][ref1], ten
      minste éénmaal in de drie maanden door middel van het nemen van monsters gemeten en voorts telkens wanneer
      zich een verandering in de werkmethoden en de omstandigheden van de blootstelling voordoet. Deze frequentie mag
      worden teruggebracht tot éénmaal per jaar, indien er geen verandering in de werkmethoden en de omstandigheden
      van de blootstelling heeft plaatsgevonden en uit de twee opeenvolgende voorafgaande metingen is gebleken dat de
      concentratie van asbeststof in de lucht niet meer bedroeg dan de helft van de in [artikel 4.46][ref2] genoemde
      grenswaarde.

      2 De metingen en monsterneming worden uitgevoerd volgens een bij ministeriële regeling vast te stellen methode of
      wel een andere methode, indien deze gelijkwaardige resultaten oplevert.

      3 De resultaten van de op grond van het eerste lid uitgevoerde metingen worden, voorzien van een toelichting, ter
      kennis gebracht van de ondernemingsraad of de personeelsvertegenwoordiging of, bij het ontbreken daarvan, van de
      belanghebbende werknemers.

      4 De metingen, bedoeld in het eerste lid, worden regelmatig volgens een tevoren opgesteld plan uitgevoerd, waarbij
      de monsterneming representatief is voor de blootstelling van de werknemers aan asbeststof.

      5 De ondernemingsraad of de personeelsvertegenwoordiging of, bij het ontbreken daarvan, de belanghebbende
      werknemers wordt de gelegenheid gegeven een oordeel over de wijze van monsterneming kenbaar te maken.

      6 Indien werknemers op een zelfde plaats identieke of gelijksoortige taken verrichten en dientengevolge aan
      dezelfde gevaren worden blootgesteld, mag de monsterneming voor deze werknemers op groepsbasis worden uitgevoerd.

      7 De monsterneming wordt zodanig uitgevoerd dat hetzij door meting hetzij door berekening, gewogen in de tijd, de
      blootstelling van werknemers aan asbeststof kan worden vastgesteld die representatief is voor een referentieperiode
      van 8 uur.

      8 Het nemen van monsters wordt uitgevoerd door personeel dat de daarvoor vereiste deskundigheid bezit.

      9 De na het nemen van monsters uit te voeren monsteranalyse wordt uitgevoerd in laboratoria die daarvoor adequaat
      zijn toegerust alsmede ervaring hebben met de vereiste identificatietechnieken.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4.46
