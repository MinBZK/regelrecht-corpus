  - number: 2.42a
    text: |-
      1 Wanneer de veiligheid en de gezondheid van de werknemers dat vereisen, wordt een systeem van werkvergunningen
      toegepast voor de uitvoering van gevaarlijke werkzaamheden en voor de uitvoering van gewoonlijk ongevaarlijke
      werkzaamheden die in combinatie met andere werkzaamheden ernstige risico's met zich mee kunnen brengen.

      2 De werkvergunning wordt door een verantwoordelijke persoon gegeven voor de aanvang van de werkzaamheden en
      daarbij wordt aangegeven aan welke voorschriften moet worden voldaan en welke voorzorgsmaatregelen moeten worden
      genomen voor, tijdens en na de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel2.42a
  - number: 2.42b
    text: |-
      Op doelmatige plaatsen is een register aanwezig waarin van degenen die werkzaamheden verrichten in de
      winningsindustrie in dagbouw, de ondergrondse winningsindustrie en de winningsindustrie met behulp van boringen
      zijn vermeld:

      a. naam, voornamen, geslacht;

      b. aard, nummer en een afschrift van een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1];

      c. gegevens en data betreffende indiensttreding en tewerkstelling;

      d. de onderscheiden functies, waarin zij zijn tewerkgesteld en de data van tewerkstelling daarin;

      e. data en aard van geneeskundige onderzoeken en geneeskundige verklaringen, voorzover deze op grond van dit
      besluit zijn vereist;

      f. gegevens van certificaten, voorzover die voor het verrichten van de werkzaamheden op grond van dit besluit en
      het [Mijnbouwbesluit][ref2] zijn vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0014394
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel2.42b
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0014394
  - number: 2.42c
    text: |-
      1 In aanvulling op [artikel 9, eerste lid, van de wet][ref1] doet de werkgever tevens onverwijld mededeling aan een
      daartoe aangewezen ambtenaar als bedoeld in [artikel 24 van de wet][ref2]:

      a. van alle belangrijke bij het verkeer of vervoer voorgekomen bijzondere gebeurtenissen die de veiligheid in
      gevaar hebben gebracht of hadden kunnen brengen;

      b. wanneer de veiligheid op enigerlei wijze wordt bedreigd of personen zich in levensgevaar bevinden of bevonden
      hebben;

      c. van alle bij het gebruik, het vervoer of de opslag van ontplofbare stoffen opgetreden voorvallen, die de
      veiligheid in gevaar hadden kunnen brengen of hebben gebracht.

      2 Eenmaal per maand wordt van alle ongevallen en andere voorvallen die de veiligheid in gevaar hebben
      gebracht of hadden kunnen brengen, opgave gedaan aan een daartoe aangewezen ambtenaar als bedoeld in
      [artikel 24 van de wet][ref3], voorzover er geen melding is gedaan als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel24
