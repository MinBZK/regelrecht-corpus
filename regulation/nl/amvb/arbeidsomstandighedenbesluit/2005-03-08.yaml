      1 Indien op grond van het bepaalde bij of krachtens dit besluit persoonlijke beschermingsmiddelen of hulpmiddelen
      aan de werknemer ter beschikking zijn gesteld, is de werknemer verplicht die persoonlijke beschermingsmiddelen
      en hulpmiddelen overeenkomstig de daarvoor geldende voorschriften te gebruiken en zindelijk te houden. De vorige
      volzin is niet van toepassing op de gevallen, bedoeld in [artikel 6.8, zevende lid, eerste volzin][ref1].

      2 Voorts is de werknemer verplicht tot naleving van de voorschriften en verboden welke zijn opgenomen in de
      volgende artikelen:

      a. van hoofdstuk 2: de [artikelen 2.22][ref2] en [2.42g][ref3];

      b. van hoofdstuk 3: [artikel 3.5][ref4];

      c. van hoofdstuk 4: de [artikelen 4.2b][ref5], [4.4, achtste lid][ref6], [4.5][ref7],
      [4.6, eerste lid][ref8], [4.6a, vierde lid, onder c][ref9], [4.7, tweede, vierde en vijfde lid][ref10],
      [4.8, tweede, derde en vierde lid][ref11], [4.8a, tweede en derde lid][ref12], [4.19, onder a][ref13],
      [4.45, eerste lid][ref14], [4.46, vijfde lid][ref15], [4.47 eerste lid][ref16], [4.51][ref17],
      [4.54, vijfde en zesde lid][ref18], [4.56, derde lid][ref19], [4.58, eerste lid][ref20],
      [4.59, eerste lid][ref21], [4.60, eerste lid][ref22], [4.61, tweede, derde, vierde en vijfde lid][ref23],
      [4.78][ref24], [4.83, eerste lid][ref25], [4.86, derde lid][ref26], [4.87, vierde lid, onder d][ref27],
      [4.89, eerste en vierde lid][ref28], [4.108][ref29] en [4.109][ref30], alsmede ten aanzien van arbeid met asbest of
      asbesthoudende producten en crocidoliet of crocidoliethoudende producten als bedoeld in [artikel 4.37][ref31], de
      [artikelen 4.19, aanhef en onder a][ref32], en [4.20, derde lid][ref33];

      d. van hoofdstuk 6: de [artikelen 6.8, tweede lid][ref34], [6.14][ref35], [6.14a, vijfde lid][ref36],
      [6.15, eerste lid, onder c][ref37], [6.16, eerste tot en met derde lid en vijfde tot en met achtste lid][ref38],
      [6.18, vierde lid][ref39], [6.19, eerste lid][ref40], [6.20, vierde lid][ref41] en [6.29][ref42];

      e. van hoofdstuk 7: de [artikelen 7.5, tweede en derde lid][ref43],
      [7.13, zevende lid][ref44], [7.17c, tweede, derde, vierde, achtste en negende lid][ref45],
      [7.18, tweede, vijfde tot en met zevende lid, en achtste lid][ref46], wat betreft de toepassing van de vastgestelde
      procedures, bedoeld in dit lid, [7.18a, tweede lid, derde lid, tiende lid][ref47], wat betreft de toepassing van de
      vastgestelde procedure, bedoeld in dit lid, en dertiende lid,[ 7.20, vierde lid][ref48], [7.21, tweede lid][ref49],
      [7.22, eerste, tweede en derde lid, onder c][ref50], [7.24, eerste lid][ref51], [7.25, zesde lid][ref52], en
      [7.32, eerste en tweede lid][ref53].

      3 De in dit artikel genoemde verplichtingen voor werknemers zijn niet van toepassing op leerlingen en studenten
      in onderwijsinrichtingen.


