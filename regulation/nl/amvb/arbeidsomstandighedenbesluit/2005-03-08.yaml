    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. justitieel personeel:

      1°. degenen, die krachtens publiekrechtelijke aanstelling in burgerlijke openbare dienst jegens het Rijk gehouden
      zijn tot het verrichten van arbeid in justitiële inrichtingen;

      2°. degenen die onder gezag van het Rijk arbeid in een justitiële inrichting verrichten, met uitzondering van
      gedetineerden, verpleegden en jeugdigen;

      b. gedetineerden, verpleegden en jeugdigen: degenen, die krachtens rechterlijke uitspraak of beschikking of
      door het openbaar gezag rechtens van hun vrijheid zijn beroofd en verblijven in een justitiële inrichting met
      uitzondering van de in het Militair Penitentiair Centrum Stroe gedetineerde militairen;

      c. justitiële inrichting: een gevangenis of huis van bewaring als bedoeld in de Penitentiaire
      beginselenwet, een justitiële inrichting voor verpleging van ter beschikking gestelden als bedoeld
      in de [Beginselenwet verpleging ter beschikking gestelden][ref1] of een inrichting als bedoeld in de
      [Beginselenwet justitiële jeugdinrichtingen][ref2].

      2 Onder justitiële inrichting wordt mede verstaan: het vervoer van gedetineerden, verpleegden en jeugdigen van
      en naar de justitiële inrichting alsmede alle andere arbeid die justitieel personeel verricht met gedetineerden,
      verpleegden en jeugdigen buiten de justitiële inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0008765
      [ref2]: https://wetten.overheid.nl/BWBR0011756
