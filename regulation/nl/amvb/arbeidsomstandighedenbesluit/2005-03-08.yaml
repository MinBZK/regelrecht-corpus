  - number: '7.38'
    text: |-
      In aanvulling op het bepaalde bij of krachtens dit hoofdstuk gelden voor jeugdige werknemers tevens de in deze
      paragraaf genoemde voorschriften en verboden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.38
  - number: '7.39'
    text: |-
      [Artikel 1.37, tweede lid][ref1], is van overeenkomstige toepassing op jeugdige werknemers die:

      a. arbeid verrichten, bestaande in het besturen van trekkers en het in rechtstreeks verband daarmee aan- of
      afkoppelen van aanhangwagens of werktuigen;

      b. arbeid verrichten met wilde, giftige of andere dieren die gevaar opleveren;

      c. dieren industrieel slachten;

      d. op basis van stukloon ongevarieerde, zich in een kort tijdsbestek herhalende arbeid verrichten, en arbeid
      verrichten waarbij het tempo op een zodanige wijze wordt beheerst dat de jeugdige werknemer zelf verhinderd wordt
      het tempo van de arbeid te beïnvloeden.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1.37
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.39
