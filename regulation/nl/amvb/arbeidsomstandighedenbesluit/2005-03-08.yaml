  - number: '4.49'
    text: |-
      1 Aan een daartoe aangewezen ambtenaar als bedoeld in [artikel 24 van de wet][ref1] wordt schriftelijk gemeld:

      a. de soorten asbest of asbesthoudende producten alsmede de hoeveelheden van ieder van deze soorten of producten
      die worden toegepast of bewerkt;

      b. de werkzaamheden die met asbest of asbesthoudende producten worden verricht alsmede de werkmethoden.

      2 Indien het voornemen bestaat om in de gegevens, bedoeld in het eerste lid, belangrijke wijziging aan
      te brengen, wordt dit voornemen schriftelijk gemeld aan een daartoe aangewezen ambtenaar als bedoeld in
      [artikel 24, eerste lid, van de wet][ref2].

      3 De op grond van het eerste en tweede lid gemelde gegevens worden ter kennis gebracht van de ondernemingsraad of
      de personeelsvertegenwoordiging of, bij het ontbreken daarvan, van de belanghebbende werknemers.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel24
