  - number: '2.24'
    text: |-
      Voor de toepassing van [artikel 16, achtste lid, van de wet][ref1] worden aangewezen de opdrachtgever, de
      ontwerpende en de uitvoerende partij.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel16
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel2.24
