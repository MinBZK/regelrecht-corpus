      1 Een torenkraan, mobiele kraan of funderingsmachine die behoort tot een bij ministeriële regeling omschreven
      categorie, mag slechts worden bediend door een persoon die:

      a. in het bezit is van een certificaat van vakbekwaamheid dat is afgegeven door Onze Minister of een certificerende
      instelling;

      b. in een zodanige lichamelijke en geestelijke toestand verkeert, dat hij in staat is de aan de bediening van het
      desbetreffende arbeidsmiddel verbonden gevaren te onderkennen en te voorkomen.

      2 Het certificaat van vakbekwaamheid of een afschrift daarvan is op de arbeidsplaats aanwezig en wordt desgevraagd
      getoond aan een ambtenaar als bedoeld in [artikel 24, eerste lid, van de wet][ref1].

      3 Het eerste lid is niet van toepassing op degene die in het kader van een opleiding tot machinist een torenkraan,
      mobiele kraan of funderingsmachine bedient, mits dit gebeurt onder toezicht van een persoon die in het bezit is van
      een certificaat van vakbekwaamheid als bedoeld in het eerste lid, onder a.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de gelijkstelling van diploma's,
      bekwaamheidsattesten of andere deskundigheidsbewijzen voor de bediening van torenkranen, mobiele kranen of
      funderingsmachines met een certificaat als bedoeld in het eerste lid, onder a.


