  - number: '1.22'
    text: |-
      1 De [artikelen 10][ref1], [27][ref2], [28][ref3] en [29 van de wet][ref4] zijn van toepassing op de in de
      justitiële inrichting door het justitieel personeel verrichte arbeid voor zover geen inbreuk wordt gemaakt
      op de orde, de veiligheid of de goede gang van zaken in de inrichting of op het ongestoord verloop van de
      tenuitvoerlegging van de vrijheidsbeneming en andere beperkingen die krachtens enige wettelijke bepaling door de
      daartoe bevoegde autoriteiten zijn opgelegd.

      2 Het eerste lid is van overeenkomstige toepassing op gedetineerden, verpleegden en jeugdigen met dien verstande,
      dat in plaats van de [artikelen 10][ref5], [27][ref6], [28][ref7] en [29 van de wet][ref8] wordt gelezen de
      [artikelen 24, zesde lid][ref9], [27][ref10], [28][ref11] en[ 29 van de wet][ref12].


