  - number: '2.35'
    text: |-
      1 De opdrachtgever zorgt ervoor dat de verplichtingen, bedoeld in de [artikelen 2.33][ref1] en [2.34][ref2], zijn
      vastgelegd in een schriftelijke overeenkomst met de uitvoerende partij.

      2 Indien twee of meer uitvoerende partijen zich ieder afzonderlijk jegens de opdrachtgever verbonden hebben om
      een deel van het bouwwerk tot stand te brengen, zorgt de opdrachtgever ervoor dat de verplichtingen, bedoeld
      in de [artikelen 2.33][ref3] en [2.34][ref4], zijn vastgelegd in een schriftelijke overeenkomst met een van die
      uitvoerende partijen.


