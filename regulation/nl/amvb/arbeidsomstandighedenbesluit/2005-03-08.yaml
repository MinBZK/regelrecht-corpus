  - number: '4.87'
    text: |-
      1 Doeltreffende maatregelen worden genomen om te voorkomen dat werknemers tijdens hun arbeid kunnen worden
      blootgesteld aan biologische agentia in een zodanige mate dat schade kan worden toegebracht aan hun veiligheid
      of gezondheid.

      2 Ter naleving van het eerste lid worden zodanige technische of organisatorische maatregelen genomen, dat het
      gevaar voor blootstelling aan biologische agentia zoveel mogelijk bij de bron daarvan wordt voorkomen, waaronder
      mede is begrepen het toepassen van agentia waarbij werknemers, gelet op de eigenschappen van die agentia, de
      aard van de arbeid, de werkmethoden en de werkomstandigheden, aan zo min mogelijk gevaar voor hun veiligheid en
      gezondheid worden blootgesteld.

      3 Voor zover het op doeltreffende wijze voorkomen van blootstelling door het nemen van maatregelen als bedoeld
      in het tweede lid redelijkerwijs niet mogelijk is, worden de gevaren verbonden aan deze blootstelling zoveel als
      redelijkerwijs mogelijk is beperkt.

      4 Ter uitvoering van het derde lid worden ten minste de volgende maatregelen genomen:

      a. de duur van de kans op blootstelling wordt zoveel mogelijk beperkt;

      b. het aantal werknemers dat gevaar loopt aan een of meer biologische agentia te worden blootgesteld is niet groter
      dan voor het verrichten van de arbeid strikt noodzakelijk is;

      c. er worden collectieve beschermingsmaatregelen genomen en, wanneer dit geen of geen afdoende bescherming biedt,
      worden persoonlijke beschermingsmiddelen ter beschikking gesteld;

      d. bij de arbeid wordt de grootst mogelijke ordelijkheid en zindelijkheid betracht om te voorkomen dan wel de kans
      te beperken dat een of meer biologische agentia buiten de arbeidsplaats terecht komen;

      e. biologische agentia worden zodanig bewaard en vervoerd en afvalstoffen worden op zodanige wijze verzameld,
      opgeslagen en verwijderd, zo nodig na passende behandeling en voorzien van een deugdelijk opschrift, dat de kans
      op blootstelling zoveel mogelijk wordt voorkomen alsmede wordt voorkomen dat zij in handen van onbevoegden kunnen
      geraken;

      f. indien noodzakelijk en technisch mogelijk wordt onderzoek gedaan naar de aanwezigheid op de werkplek van
      biologische agentia buiten de eerste fysieke omhulling;

      g. op de arbeidsplaats is een doeltreffende schriftelijke werkinstructie voor de werknemers voorhanden, waarvan ten
      minste deel uitmaken de bij de arbeid in acht te nemen procedures, waaronder een regeling voor het veilig omgaan
      met en het vervoeren van biologische agentia binnen het bedrijf of de inrichting alsmede een doeltreffend noodplan
      voor het geval zich ongevallen of incidenten met biologische agentia voordoen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.87
  - number: '4.88'
    text: |-
      De plaatsen waar arbeid wordt verricht met biologische agentia worden duidelijk afgebakend en worden gemarkeerd met
      een signaal dat voldoet aan het bij of krachtens [afdeling 2 van hoofdstuk 8][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.88
