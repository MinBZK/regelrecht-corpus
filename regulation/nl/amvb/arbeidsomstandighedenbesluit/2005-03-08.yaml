        afdeling: '1'
  - number: '4.104'
    text: |-
      In aanvulling op het bepaalde bij of krachtens dit hoofdstuk, gelden voor jeugdige werknemers tevens de in deze
      paragraaf genoemde voorschriften en verboden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.104
  - number: '4.105'
    text: |-
      1 Jeugdige werknemers mogen geen arbeid verrichten met stoffen die voldoen aan de krachtens de
      [artikelen 34][ref1], derde lid, en [39 van de Wet milieugevaarlijke stoffen][ref2] vastgestelde criteria voor
      indeling in een of meer van de categorieën «zeer vergiftig», «vergiftig», «sensibiliserend», «kankerverwekkend»,
      «mutageen» en «voor de voortplanting vergiftig», alsmede stoffen die voldoen aan de bij of krachtens die wet
      vastgestelde criteria voor toekenning van een van de volgende R-zinnen:

      a. gevaar voor cumulatieve effecten (R33);

      b. gevaar voor ernstige schade aan de gezondheid bij langdurige blootstelling (R48).

      2 Jeugdige werknemers mogen geen arbeid verrichten met biologische agentia van categorie 3 of 4, bedoeld in
      [afdeling 9][ref3] van dit hoofdstuk.

      3 Voorts mogen jeugdige werknemers geen arbeid verrichten aan of met kuipen, bassins, leidingen of reservoirs
      waarin zich een of meer van de in het eerste of tweede lid bedoelde stoffen of biologische agentia bevinden.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.105
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '39'
      - id: ref3
        bwb_id: BWBR0008498
        hoofdstuk: '4'
        afdeling: '9'
  - number: '4.106'
    text: |-
      [Artikel 1.37, tweede lid][ref1], is van overeenkomstige toepassing op jeugdige werknemers die:

      a. arbeid verrichten met stoffen die voldoen aan de krachtens de [artikelen 34][ref2], derde lid, en
      [39 van de Wet milieugevaarlijke stoffen][ref3] vastgestelde criteria voor indeling:

      1. in een of meer van de categorieën, «ontplofbaar», «bijtend» en «irriterend»;

      2. in de categorie «schadelijk», indien deze stoffen tevens voldoen aan de bij of krachtens de
      [Wet milieugevaarlijke stoffen][ref4] vastgestelde criteria voor toekenning van R-zin «onherstelbare effecten zijn
      niet uitgesloten» (R40);

      b. arbeid verrichten met persgassen, onder druk vloeibaar gemaakte gassen, door sterke temperatuurverlaging
      vloeibaar gemaakte gassen en opgeloste gassen;

      c. arbeid verrichten aan of met kuipen, bassins, leidingen of reservoirs waarin zich een of meer van de onder *a*
      of *b* bedoelde stoffen of gassen bevinden;

      d. artikelen die ontplofbare stoffen bevatten, vervaardigen of hanteren.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1.37
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0003892#Artikel39
      [ref4]: https://wetten.overheid.nl/BWBR0003892
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.106
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1.37'
        hoofdstuk: '1'
        afdeling: '8'
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '34'
      - id: ref3
        bwb_id: BWBR0003892
        artikel: '39'
      - id: ref4
        bwb_id: BWBR0003892
  - number: '4.107'
    text: |-
      In aanvulling op het bepaalde bij of krachtens dit hoofdstuk gelden voor zwangere werknemers en werknemers tijdens
      de lactatie tevens de in deze paragraaf genoemde voorschriften.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.107
  - number: '4.108'
    text: |-
      Het is een zwangere werknemer en een werknemer tijdens de lactatie verboden arbeid te verrichten met loodwit als
      bedoeld in [afdeling 7 van dit hoofdstuk][ref1] alsmede met metallisch lood en zijn ionverbindingen waarvoor op
      grond van [artikel 4.8b, tweede lid][ref2], een biologische grenswaarde is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4.8b
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.108
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '4'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: 4.8b
        hoofdstuk: '4'
        paragraaf: '4'
        afdeling: '1'
  - number: '4.109'
    text: |-
      Het is een zwangere werknemer verboden arbeid te verrichten met de biologische agentia Toxoplasma en Rubellavirus,
      bedoeld in [afdeling 9 van dit hoofdstuk][ref1], tenzij is gebleken dat zij hiervoor immuun is.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.109
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '4'
        afdeling: '9'
  - number: '4.110'
    text: |-
      Thuiswerk met gevaarlijke stoffen is uitsluitend toegestaan met een of meer van de volgende stoffen:

      a. stoffen die bij uitsluiting voldoen aan de krachtens de [artikelen 34][ref1], derde lid, en
      [39 van de Wet milieugevaarlijke stoffen][ref2] vastgestelde criteria voor indeling in de categorieën «schadelijk»,
      «irriterend», «ontvlambaar» en «milieugevaarlijk», tenzij deze stoffen voldoen aan de bij of krachtens die wet
      vastgestelde criteria voor toekenning van een van de volgende R-zinnen:

      1°. in droge toestand ontplofbaar (R1);

      2°. vormt met metalen zeer gemakkelijk ontplofbare verbindingen (R4);

      3°. ontploffingsgevaar door verwarming (R5);

      4°. ontplofbaar met en zonder lucht (R6);

      5°. reageert heftig met water (R14);

      6°. kan ontplofbare peroxiden vormen (R19);

      7°. vormt vergiftig gas in contact met water (R29);

      8°. kan bij gebruik licht ontvlambaar worden (R30);

      9°. vormt vergiftige gassen in contact met zuren (R31);

      10°. vormt zeer vergiftige gassen in contact met zuren (R32);

      11°. gevaar voor cumulatieve effecten (R33);

      12°. onherstelbare effecten zijn niet uitgesloten (R40);

      13°. ontploffingsgevaar bij verwarming in afgesloten toestand (R44);

      14°. gevaar voor ernstige schade aan de gezondheid bij langdurige blootstelling (R48), en

      15°. kan schadelijk zijn via de borstvoeding (R64);

      b. stoffen die aan geen van de krachtens de [artikelen 34][ref3], derde lid, en
      [39 van de Wet milieugevaarlijke stoffen][ref4] vastgestelde criteria voor indeling voldoen, tenzij deze stoffen
      de bijzondere gevaarsaanduidingen dragen, genoemd in bijlage V, deel B, onderdeel 2° of 6° bij [richtlijn nr.
      1999/45/EG](31999L0045) van het Europees Parlement en de Raad van de Europese Unie van 31 mei 1999 betreffende de
      onderlinge aanpassing van de wettelijke en bestuursrechtelijke bepalingen van de lidstaten inzake de indeling, de
      verpakking en het kenmerken van gevaarlijke preparaten (PbEG L 200).


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0003892#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0003892#Artikel39
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.110
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '39'
      - id: ref3
        bwb_id: BWBR0003892
        artikel: '34'
      - id: ref4
        bwb_id: BWBR0003892
        artikel: '39'
  - number: '4.111'
    text: |-
      Met betrekking tot de in [artikel 4.110, onder a][ref1], genoemde stoffen, met uitzondering
      van stoffen die uitsluitend voldoen aan de krachtens de [artikelen 34, derde lid][ref2], en
      [39 van de Wet milieugevaarlijke stoffen][ref3] vastgestelde criteria voor indeling in de categorie
      «milieugevaarlijk», wordt in het kader van de risico-inventarisatie en -evaluatie, bedoeld in
      [artikel 5 van de wet][ref4], in ieder geval vastgesteld aan welke stoffen thuiswerkers worden of kunnen worden
      blootgesteld en wat de gevaren zijn die aan die stoffen zijn verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.110
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0003892#Artikel39
      [ref4]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.111
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4.110'
        hoofdstuk: '4'
        paragraaf: '4'
        afdeling: '10'
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '34'
      - id: ref3
        bwb_id: BWBR0003892
        artikel: '39'
      - id: ref4
        bwb_id: BWBR0010346
        artikel: '5'
  - number: '4.112'
    text: |-
      1 Met betrekking tot de verpakking van een stof die gevaar voor de veiligheid en
      gezondheid kan opleveren alsmede met betrekking tot de sluiting van die verpakking, is
      [artikel 35, eerste tot en met derde lid, van de Wet milieugevaarlijke stoffen][ref1] van overeenkomstige
      toepassing.

      2 Op de verpakking van een stof, bedoeld in het eerste lid, worden de aanduidingen welke voor die stof op grond van
      het voldoen aan de criteria voor indeling in de categorieën, genoemd in [artikel 4.110, onder a][ref2], ten behoeve
      van de aflevering van die stof bij of krachtens de [Wet milieugevaarlijke stoffen][ref3] zijn voorgeschreven,
      opvallend en goed leesbaar vermeld, met uitzondering van de aanduidingen die betrekking hebben op de categorie
      «milieugevaarlijk».


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4.110
      [ref3]: https://wetten.overheid.nl/BWBR0003892
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.112
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4.110'
        hoofdstuk: '4'
        paragraaf: '4'
        afdeling: '10'
      - id: ref3
        bwb_id: BWBR0003892
  - number: '4.113'
    text: |-
      Doeltreffende maatregelen zijn genomen om te voorkomen dat thuiswerkers bij hun arbeid kunnen worden blootgesteld
      aan stoffen in zodanige mate, dat schade kan worden toegebracht aan hun gezondheid of dat aan thuiswerkers hinder
      kan worden veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.113
  - number: '4.114'
    text: |-
      Indien met brandgevaarlijke stoffen wordt gewerkt, zijn in aanvulling op [afdeling 4 van hoofdstuk 2][ref1], aan de
      thuiswerker deugdelijke en doelmatige middelen voor het blussen of doven van een brand ter beschikking gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.114
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '2'
        afdeling: '4'
  - number: '4.115'
    text: |-
      1 Indien stoffen aanwezig zijn die gevaar voor de veiligheid en de gezondheid van thuiswerkers kunnen opleveren,
      zijn zodanige voorzieningen getroffen dat het gevaar, dat zich met betrekking tot die stoffen een ongewilde
      gebeurtenis voordoet, zoveel mogelijk is vermeden.

      2 Bij het verrichten van arbeid met stoffen als bedoeld in het eerste lid zijn zodanige voorzieningen getroffen,
      dat het gevaar, dat zich bij die arbeid een ongewilde gebeurtenis voordoet, zoveel mogelijk is vermeden.

      3 Voorts zijn in aanvulling op [afdeling 4 van hoofdstuk 2][ref1] zodanige voorzieningen getroffen dat in geval
      zich een ongewilde gebeurtenis als bedoeld in het eerste respectievelijk het tweede lid voordoet, de gevolgen
      daarvan zoveel mogelijk worden beperkt.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.115
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '2'
        afdeling: '4'
  - number: '5.1'
    text: |-
      In deze afdeling wordt verstaan onder richtlijn: [Richtlijn nr. 90/269/EEG](31990L0269) van de Raad van de Europese
      Gemeenschappen van 29 mei 1990 betreffende de minimum veiligheids- en gezondheidsvoorschriften voor het handmatig
      hanteren van lasten met gevaar voor met name rugletsel voor de werknemers (*PbEG* L 156).
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel5.1
  - number: '5.2'
    text: |-
      De arbeid wordt zodanig georganiseerd, de arbeidsplaats wordt zodanig ingericht, een zodanige productieen
      werkmethode wordt toegepast of zodanige hulpmiddelen en persoonlijke beschermingsmiddelen, worden gebruikt, dat de
      fysieke belasting geen gevaren met zich kan brengen voor de veiligheid en de gezondheid van de werknemer.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel5.2
  - number: '5.3'
    text: |-
      1 Voor zover de in [artikel 5.2][ref1] bedoelde gevaren redelijkerwijs niet kunnen worden voorkomen, wordt
      de arbeid zodanig georganiseerd, wordt de arbeidsplaats zodanig ingericht, wordt een zodanige productie- en
      werkmethode toegepast en worden zodanige hulpmiddelen en persoonlijke beschermingsmiddelen, gebruikt, dat die
      gevaren zoveel als redelijkerwijs mogelijk is worden beperkt.

      2 Bij de uitvoering van het eerste lid worden in het kader van de risico-inventarisatie en -evaluatie,
      bedoeld in [artikel 5 van de wet][ref2], met inachtneming van bijlage I bij de richtlijn, de veiligheids- en
      gezondheidsaspecten van de fysieke belasting beoordeeld, waarbij met name gelet wordt op de kenmerken van de last,
      de vereiste lichamelijke inspanning, de kenmerken van de werkomgeving en de eisen van de taak.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel5.2
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '5.2'
        hoofdstuk: '5'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '5'
  - number: '5.4'
    text: |-
      1 Aan een werknemer die arbeid verricht, welke geheel of gedeeltelijk zittend kan worden uitgevoerd, is daartoe een
      doelmatige zitgelegenheid ter beschikking gesteld.

      2 Aan werknemers die arbeid verrichten, welke staande moet worden uitgevoerd, doch waarbij het arbeidsproces
      hun toelaat van tijd tot tijd te gaan zitten, is een voldoende aantal doelmatige zitgelegenheden ter beschikking
      gesteld.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel5.4
  - number: '5.5'
    text: |-
      1 Aan werknemers die arbeid verrichten waarbij sprake is van het handmatig hanteren van lasten wordt doeltreffende
      voorlichting en doeltreffend onderricht gegeven over:

      a. de wijze waarop lasten gehanteerd worden;

      b. de aan het handmatig hanteren van lasten verbonden gevaren voor hun veiligheid en gezondheid en de te nemen
      maatregelen om deze gevaren zo veel mogelijk te beperken.

      2 Aan de betrokken werknemers wordt adequate informatie verstrekt over het gewicht van de te hanteren last en,
      wanneer het gewicht van de last niet gelijk verdeeld is, over het zwaartepunt of de zwaarste kant van die last.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel5.5
  - number: '5.6'
    text: Met betrekking tot fysieke belasting worden de bijlagen I en II bij de richtlijn in acht genomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel5.6
  - number: '5.7'
    text: |-
      In deze afdeling wordt verstaan onder:

      a. beeldscherm: een alfanumeriek of grafisch scherm, ongeacht het gebruikte afbeeldingsprocédé;

      b. werkplek: het beeldscherm en het geheel van de daarbij behorende beeldschermapparatuur waarvan een werknemer
      gebruik maakt, met inbegrip van de onmiddellijke werkomgeving.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel5.7
  - number: '5.8'
    text: |-
      1 Deze afdeling is niet van toepassing op:

      a. bestuurdersplaatsen op machines;

      b. computersystemen die in de eerste plaats bestemd zijn voor gebruik door het publiek;

      c. zogenoemde draagbare systemen die niet aanhoudend worden gebruikt op een werkplek;

      d. rekenmachines, kassa’s en andere apparatuur die voorzien zijn van een klein display voor gegevens of
      hoeveelheden, nodig voor het directe gebruik van die apparatuur;

      e. conventionele schrijfmachines met display.

      2 Voorts is deze afdeling niet van toepassing op arbeid waarbij een werknemer gewoonlijk minder dan twee uren per
      etmaal gebruik maakt van een beeldscherm.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel5.8
  - number: '5.9'
    text: |-
      1 In de risico-inventarisatie en -evaluatie, bedoeld in [artikel 5 van de wet][ref1], wordt specifiek aandacht
      besteed aan de gevaren voor het gezichtsvermogen en die van de fysieke en psychische belasting als gevolg van
      arbeid aan een beeldscherm.

      2 Op basis van de uitkomsten van de in het eerste lid bedoelde risico-inventarisatie en -evaluatie worden
      doeltreffende maatregelen genomen om de desbetreffende gevaren te ondervangen, rekening houdend met de gevolgen van
      die gevaren en de onderlinge samenhang daartussen.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
  - number: '5.10'
    text: |-
      De arbeid aan een beeldscherm is zodanig georganiseerd dat deze arbeid telkens na ten hoogste twee
      achtereenvolgende uren wordt afgewisseld door andersoortige arbeid of door een rusttijd, zodanig dat de belasting
      van het verrichten van de arbeid aan een beeldscherm wordt verlicht.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel5.10
  - number: '5.11'
    text: |-
      1 Iedere werknemer die voor de eerste keer belast wordt met arbeid aan een beeldscherm wordt, in aanvulling
      op [artikel 18 van de wet][ref1], in de gelegenheid gesteld om vóór de aanvang van die arbeid een
      arbeidsgezondheidskundig onderzoek te ondergaan. Dit onderzoek heeft in ieder geval betrekking op de ogen en het
      gezichtsvermogen.

      2 De werknemer wordt opnieuw in de gelegenheid gesteld een onderzoek als bedoeld in het eerste lid, te ondergaan,
      indien zich bij hem gezichtsstoornissen voordoen die het gevolg kunnen zijn van het verrichten van arbeid aan een
      beeldscherm.

      3 Indien de resultaten van het onderzoek, bedoeld in het eerste en het tweede lid, dit vereisen, wordt de betrokken
      werknemer in de gelegenheid gesteld een oftalmologisch onderzoek te ondergaan.

      4 Indien de resultaten van het onderzoek, bedoeld in het eerste tot en met het derde lid, dit vereisen en normale
      oogcorrectiemiddelen niet kunnen worden gebruikt, worden aan de betrokken werknemer speciale, met de desbetreffende
      arbeid verband houdende, oogcorrectiemiddelen verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel18
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel5.11
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '18'
  - number: '5.12'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de werkplek en de wisselwerking tussen de
      gebruikte programmatuur en de werknemers.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel5.12
  - number: '5.13'
    text: |-
      Afdeling 2 van dit hoofdstuk is niet van toepassing op:

      a. bestuurdersplaatsen op een voertuig op een openbare weg of spoorweg;

      b. computersystemen in een luchtvaartuig, een zeeschip of een binnenvaartuig dan wel een voertuig op een openbare
      weg of spoorweg.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel5.13
  - number: '5.14'
    text: |-
      Op thuiswerk zijn de [afdelingen 1][ref1] en [2 van dit hoofdstuk][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '5'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008498
        hoofdstuk: '5'
        afdeling: '2'
  - number: '5.15'
    text: |-
      1 De arbeidsplaats van een thuiswerker is zodanig ingericht dat de arbeid zoveel mogelijk zittend op ergonomisch
      verantwoorde wijze kan worden verricht. Daartoe zijn een doelmatige zitgelegenheid en een doelmatig werkblad of een
      doelmatige werktafel ter beschikking gesteld.

      2 Indien de thuiswerker reeds uit eigen hoofde beschikt over de in het eerste lid bedoelde voorzieningen, behoeven
      deze niet alsnog ter beschikking te worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel5.15
  - number: '6.1'
    text: |-
      1 Het klimaat op de arbeidsplaats veroorzaakt geen schade aan de gezondheid van de werknemers.

      2 Het klimaat op de arbeidsplaats is zo behaaglijk en gelijkmatig als redelijkerwijs mogelijk. Daarbij wordt
      rekening gehouden met de aard van de werkzaamheden die door de werknemers worden verricht en de fysieke belasting
      die het gevolg is van die werkzaamheden.

      3 Hinderlijke tocht op de arbeidsplaats wordt vermeden tenzij dat redelijkerwijs niet kan worden gevergd.

      4 Indien door het klimaat op de arbeidsplaats toch schade aan de gezondheid van de werknemers kan ontstaan,
      worden persoonlijke beschermingsmiddelen ter beschikking gesteld. Indien de ter beschikking gestelde persoonlijke
      beschermingsmiddelen schade aan de gezondheid niet kunnen voorkomen, wordt de duur van de arbeid in een zodanige
      mate beperkt of wordt de arbeid met een zodanige frequentie afgewisseld door een tijdelijk verblijf op een plaats
      waar een klimaat heerst als bedoeld in het eerste lid, dat geen schade aan de gezondheid ontstaat.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel6.1
  - number: '6.2'
    text: |-
      1 Op de arbeidsplaats is voldoende niet verontreinigde lucht aanwezig.

      2 Luchtverversingsinstallaties zijn altijd bedrijfsklaar.

      3 Luchtverversingsinstallaties zijn voorzien van een controlesysteem dat storingen in de installatie signaleert
      voor zover dat noodzakelijk is voor de gezondheid van de werknemers.

      4 Het eerste lid is niet van toepassing op arbeidsplaatsen in een gebouw als bedoeld in
      [artikel 1, eerste lid, onder c, van de Woningwet][ref1].

      5 Een arbeidsplaats in een gebouw als bedoeld in [artikel 1, eerste lid, onder c, van de Woningwet][ref2]
      wordt slechts gebruikt indien het gebouw voldoet aan de bij of krachtens het [Bouwbesluit 2003][ref3] gegeven
      voorschriften met betrekking tot de van toepassing zijnde gebruiksfunctie in de zin van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0012727
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0012727
  - number: '6.3'
    text: |-
      1 Arbeidsplaatsen en de directe toegangen daartoe zijn gedurende de aanwezigheid van de werknemers door daglicht,
      door kunstlicht of door beide voldoende en doelmatig verlicht.

      2 Het kunstlicht is zodanig aangebracht dat gevaar voor ongevallen is voorkomen.

      3 De voor kunstlicht gebruikte kleur mag de waarneming van de veiligheids- en gezondheidssignalering, bepaald bij
      of krachtens [afdeling 2 van hoofdstuk 8][ref1], niet wijzigen of beïnvloeden.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '8'
        afdeling: '2'
  - number: '6.4'
    text: |-
      1 In een uitwendige scheidingsconstructie van een besloten ruimte waar overdag door iemand gemiddeld meer dan
      twee uur arbeid wordt verricht, zijn doorzichtige lichtopeningen aangebracht waardoor daglicht kan toetreden. Het
      gezamenlijk oppervlak van de lichtopeningen bedraagt ten minste 1/20 van het vloeroppervlak van die ruimte.

      2 De lichtopeningen mogen zich ook bevinden in de inwendige scheidingsconstructie van de besloten ruimte, voor
      zover die constructie niet de scheiding vormt met een andere besloten ruimte als bedoeld in het eerste lid of met
      een ruimte als bedoeld in [hoofdstuk 3, afdeling 1, paragraaf 5][ref1].

      3 Het eerste of tweede lid geldt niet indien daaraan redelijkerwijs niet kan worden voldaan. In dat geval wordt het
      vereiste minimum oppervlak aan lichtopeningen van 1/20 van het vloeroppervlak zo dicht mogelijk benaderd.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: '1'
  - number: '6.5'
    text: In een besloten ruimte waar arbeid wordt verricht kan rechtstreeks invallend zonlicht worden geweerd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel6.5
  - number: '6.6'
    text: |-
      In deze afdeling wordt verstaan onder:

      a. equivalent geluidsniveau in dB(A): het energetisch gemiddelde geluidsniveau gedurende een bepaalde
      beoordelingstijd, uitgedrukt in dB(A);

      b. momentaan geluidsdrukniveau in Pa: de niet-gewogen geluidsdruk die wordt gemeten met een geluidsniveaumeter in
      de stand «peak-hold», uitgedrukt in Pa;

      c. geluidsdosisniveau in dB(A): het energetisch gemiddelde geluidsniveau gedurende een representatieve werkdag,
      uitgedrukt in dB(A).
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel6.6
  - number: '6.7'
    text: |-
      1 Op elke arbeidsplaats wordt in het kader van de risico-inventarisatie en -evaluatie, bedoeld in
      [artikel 5 van de wet][ref1], het geluidsniveau beoordeeld en, indien nodig, gemeten teneinde te bepalen waar
      en in welke mate werknemers aan de in deze afdeling vastgestelde niveaus van schadelijk geluid kunnen worden
      blootgesteld.

      2 De beoordeling en de meting zijn representatief voor de blootstelling aan geluid op de arbeidsplaats gedurende de
      dagelijkse arbeidstijd. De beoordeling en de meting worden, in aanvulling op [artikel 5 van de wet][ref2], volgens
      een schriftelijk vastgelegd tijdschema periodiek herhaald en in ieder geval herzien, indien de omstandigheden zijn
      gewijzigd of er redenen zijn om aan te nemen dat de uitgevoerde beoordeling of meting onjuist is.

      3 De bij de meting gebruikte methoden en apparaten zijn aan de desbetreffende omstandigheden aangepast. Met name
      wordt daarbij gelet op de kenmerken van het te meten geluid en de omgevingsfactoren. De gebruikte methoden en
      apparaten zijn geschikt om te bepalen of de in deze afdeling vastgestelde niveaus van schadelijk geluid al dan niet
      worden overschreden.

      4 De ondernemingsraad of de personeelsvertegenwoordiging of, bij het ontbreken daarvan, de belanghebbende
      werknemers wordt de gelegenheid gegeven een oordeel kenbaar te maken over de wijze van beoordeling en meting.

      5 De resultaten van de op grond van dit artikel uitgevoerde beoordelingen en metingen worden in passende vorm
      geregistreerd en gedurende ten minste tien jaar bewaard.

      6 De in het vijfde lid bedoelde resultaten worden, voorzien van een toelichting, ter kennis gebracht van
      de ondernemingsraad of de personeelsvertegenwoordiging of, bij het ontbreken daarvan, van de belanghebbende
      werknemers.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '5'
  - number: '6.8'
    text: |-
      1 Machines, werktuigen, apparaten, installaties, vervoer- en transportmiddelen zijn van zodanige constructie, zijn
      zodanig ingericht, opgesteld of ondersteund en worden zodanig onderhouden, dat zij bij het in werking zijn op de
      arbeidsplaats geen equivalent geluidsniveau veroorzaken hoger dan 85 dB(A) of een momentaan geluidsdrukniveau hoger
      dan 200 Pa, tenzij dit redelijkerwijs niet kan worden gevergd.

      2 Het verrichten van werkzaamheden geschiedt zodanig, dat daarbij op de arbeidsplaats geen equivalent geluidsniveau
      veroorzaakt wordt hoger dan 85 dB(A) of een momentaan geluidsdrukniveau hoger dan 200 Pa, tenzij dit redelijkerwijs
      niet kan worden gevergd.

      3 Indien de uitzondering, genoemd in de laatste zinsnede van het eerste of tweede lid, van toepassing is, zijn
      doeltreffende voorzieningen getroffen waardoor zoveel mogelijk wordt voorkomen dat de in het eerste en tweede lid
      genoemde geluidsniveaus op de arbeidsplaats heersen, tenzij ook dat redelijkerwijs niet kan worden gevergd.

      4 De in het derde lid bedoelde voorzieningen worden vermeld in het plan van aanpak, bedoeld in
      [artikel 5 van de wet][ref1].

      5 In gevallen waarin voorzieningen, getroffen op grond van het derde lid, de werknemers onvoldoende bescherming
      bieden tegen de in het eerste en tweede lid genoemde geluidsniveaus en in gevallen waarin het treffen van
      bedoelde voorzieningen redelijkerwijs niet kan worden gevergd, worden doeltreffende maatregelen genomen om de
      blootstellingsduur alsmede het aantal werknemers dat aan de desbetreffende geluidsniveaus wordt blootgesteld,
      zoveel mogelijk te beperken.

      6 Het vierde lid is van overeenkomstige toepassing op de in het vijfde lid bedoelde maatregelen.

      7 In gevallen waarin werknemers kunnen worden blootgesteld aan een equivalent geluidsniveau op de arbeidsplaats
      van 80 dB(A) of hoger, worden persoonlijke beschermingsmiddelen in voldoende aantal beschikbaar gesteld. De
      persoonlijke beschermingsmiddelen bieden een demping van het geluid tot een equivalent geluidsniveau van 80 dB(A)
      of lager. Indien een zodanige demping technisch niet mogelijk is, wordt door de persoonlijke beschermingsmiddelen
      ten minste een demping van het geluid geboden tot beneden het equivalent geluidsniveau van 85 dB(A).

      8 De betrokken werknemers wordt de gelegenheid geboden een oordeel over de keuze van de soort persoonlijke
      beschermingsmiddelen kenbaar te maken.

      9 Bij overschrijding van het equivalent geluidsniveau van 85 dB(A) of van het momentaan geluidsdrukniveau van 200
      Pa, worden door de werknemers de persoonlijke beschermingsmiddelen gebruikt.

      10 Het ongevalsgevaar als gevolg van het gebruik van de persoonlijke beschermingsmiddelen wordt zoveel mogelijk
      door middel van doeltreffende maatregelen beperkt.

      11 De plaatsen waar overschrijding van ten minste een van de in het negende lid genoemde geluidsniveaus kan
      worden verwacht, zijn duidelijk afgebakend en gemarkeerd door signalen die voldoen aan het bij of krachtens
      [afdeling 2 van hoofdstuk 8][ref2] bepaalde.

      12 Alleen werknemers die beroepshalve of uit hoofde van hun functie de in het elfde lid bedoelde plaatsen moeten
      betreden worden daar toegelaten.

      13 De belanghebbende werknemers en, indien aanwezig, de ondernemingsraad of de personeelsvertegenwoordiging,
      worden, in geval toepassing wordt gegeven aan de uitzonderingen, bedoeld in de laatste zinsnede van het eerste en
      tweede lid, en de laatste zinsnede van het derde lid, in kennis gesteld van de redenen daarvan alsmede van de op
      grond van het derde lid getroffen voorzieningen en de op grond van het vijfde lid genomen maatregelen.

      14 Op een bij koninklijk besluit te bepalen tijdstip wordt het in het eerste en tweede lid genoemde geluidsniveau
      van 85 dB(A) vervangen door 80 dB(A).


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0008498
        hoofdstuk: '8'
        afdeling: '2'
  - number: '6.9'
    text: |-
      1 In gevallen waarin werknemers die bijzondere taken uitvoeren, in verband met het uitvoeren van deze taken moeten
      verblijven op een arbeidsplaats waar het niveau van het geluid van dag tot dag sterk wisselt en het redelijkerwijs
      niet gevergd kan worden dat de in artikel 6.8, derde en vijfde lid, bedoelde voorzieningen en maatregelen getroffen
      respectievelijk genomen worden, is het gemiddelde geluidsniveau, berekend of gemeten over een periode van een week
      niet hoger dan 85 dB(A) of een momentaan geluidsdrukniveau hoger dan 200 Pa, tenzij dat redelijkerwijs niet kan
      worden gevergd.

      2 Voorts wordt in de gevallen, bedoeld in het eerste lid, periodiek, doch in ieder geval telkens indien er voor het
      geluid op de arbeidsplaats relevante veranderingen plaatsvinden in de arbeid of de omstandigheden waaronder deze
      arbeid wordt verricht, gecontroleerd of nog voldaan wordt aan het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel6.9
  - number: '6.10'
    text: |-
      1 Werknemers die worden blootgesteld aan een geluidsdosisniveau van 80 dB(A) worden, in aanvulling op
      [artikel 18 van de wet][ref1], in de gelegenheid gesteld een arbeidsgezondheidskundig onderzoek in de vorm van een
      audiometrisch onderzoek te ondergaan.

      2 Zolang de blootstelling aan het in het eerste lid genoemde geluidsniveau duurt, worden de betrokken werknemers
      met tussenpozen van vier jaar of met kortere tussenpozen indien dit naar het oordeel van de arbodienst noodzakelijk
      is, opnieuw in de gelegenheid gesteld om een audiometrisch onderzoek te ondergaan.

      3 Aan de arbodienst wordt inzage gegeven in het register, bedoeld in [artikel 6.7, vijfde lid][ref2].

      4 De arbodienst wordt de gelegenheid geboden om te adviseren over de te nemen preventieve of persoonlijke
      beschermende maatregelen.

      5 De resultaten van het audiometrisch onderzoek worden gedurende ten minste 10 jaar bewaard.

      6 De betrokken werknemer wordt in kennis gesteld van de resultaten van elk audiometrisch onderzoek dat hij op grond
      van dit artikel heeft ondergaan.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel6.7
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel6.10
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '6.7'
        hoofdstuk: '6'
        paragraaf: '2'
        afdeling: '3'
  - number: '6.11'
    text: |-
      Aan werknemers die arbeid verrichten waarbij overschrijding van het equivalente geluidsniveau van 80 dB(A) of van
      het momentaan geluidsdrukniveau van 200 Pa kan worden verwacht, worden doeltreffende voorlichting en doeltreffend
      onderricht gegeven over:

      a. de mogelijke gevaren voor het gehoor als gevolg van blootstelling aan geluid;

      b. de bestaande regelgeving met betrekking tot geluid en de op grond van deze regelgeving te nemen maatregelen;

      c. de gevallen waarin persoonlijke beschermingsmiddelen ter beschikking worden gesteld en de gevallen waarin en de
      wijze waarop de persoonlijke beschermingsmiddelen worden gebruikt;

      d. de inhoud en betekenis van een periodiek te herhalen audiometrisch onderzoek en de gevallen waarin aan
      werknemers de gelegenheid wordt geboden om een dergelijk onderzoek te ondergaan.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel6.11
  - number: '6.12'
    text: |-
      1 Toestellen die schadelijke, niet-ioniserende elektromagnetische straling kunnen uitzenden bestaan uit deugdelijk
      materiaal, zijn van een deugdelijke constructie en verkeren in goede staat.

      2 De in het eerste lid bedoelde toestellen bevinden zich in een zodanige ruimte en zijn voorts zodanig ingericht,
      opgesteld of afgeschermd, dat bij het in werking zijn daarvan gezondheidsschade zoveel mogelijk wordt voorkomen.

      3 Indien bij het in werking zijn van een toestel als bedoeld in het eerste lid, het gevaar van gezondheidsschade
      ondanks de naleving van de voorschriften, bedoeld in het eerste en tweede lid, niet of niet geheel kan worden
      voorkomen, worden zodanige maatregelen getroffen, dat gezondheidsschade zoveel mogelijk wordt voorkomen.

      4 Indien de in het derde lid bedoelde maatregelen gezondheidsschade niet of niet voldoende kunnen voorkomen worden
      persoonlijke beschermingsmiddelen ter beschikking gesteld.

      5 De persoonlijke beschermingsmiddelen worden door de werknemers bij de arbeid gebruikt.

      6 Bij ministeriële regeling kunnen niveaus worden vastgesteld, waarboven voor de toepassing van dit artikel die
      straling wordt geacht schadelijk te zijn.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel6.12
  - number: '6.13'
    text: |-
      1 In het bij of krachtens deze afdeling bepaalde wordt verstaan onder:

      a. duikarbeid: het verrichten van arbeid in een vloeistof of in een droge duikklok met inbegrip van het verblijf
      in die vloeistof of in die droge duikklok, waarbij voor de ademhaling gebruik wordt gemaakt van een gas onder een
      hogere druk dan de atmosferische druk;

      b. caissonarbeid: het verrichten van arbeid in een ruimte die onder een druk van ten minste 104 Pa boven de
      atmosferische druk staat en geheel of gedeeltelijk door een vloeistof wordt omgeven alsmede het verblijf in en het
      transport van en naar die ruimte;

      c. overige arbeid onder overdruk: het verrichten van andere arbeid dan duik- of caissonarbeid in een ruimte onder
      een druk van ten minste 104 Pa boven de atmosferische druk met inbegrip van het verblijf in die ruimte.

      2 Deze afdeling is mede van toepassing op de arbeid in of op een zeeschip die in rechtstreeks verband staat met de
      te verrichten arbeid onder overdruk.

      3 Op duikarbeid met Self-Contained Underwater Breathing Apparatus (SCUBA), bestaande uit de instructie van
      sportduikers tot een duikdiepte van maximaal 50 meter, met een decompressietijd van ten hoogste 20 minuten en met
      een partiële zuurstofdruk in het ademgas van maximaal 1,4.105 PA, zijn uitsluitend de [artikelen 6.14][ref1] en
      [6.15, eerste lid, onder a en b en d][ref2], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6.14
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel6.15
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel6.13
