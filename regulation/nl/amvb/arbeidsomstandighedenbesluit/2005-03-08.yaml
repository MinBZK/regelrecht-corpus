  - number: '4.53'
    text: |-
      1 Van iedere werknemer die in verband met de arbeid wordt blootgesteld aan asbeststof wordt aantekening gehouden in
      een register, waarbij de aard en de duur van de arbeid alsmede de mate van de blootstelling worden vermeld.

      2 Iedere werknemer wordt in kennis gesteld van zijn persoonlijke gegevens in het register.

      3 De gegevens in het register worden, voorzien van een toelichting, in statistische, niet tot individuen
      herleidbare vorm, ter kennis gebracht van de ondernemingsraad of de personeelsvertegenwoordiging of, bij het
      ontbreken daarvan, van de belanghebbende werknemers.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.53
  - number: '4.54'
    text: |-
      1 Op het slopen van gebouwen, constructies, apparaten, installaties en transportmiddelen waarin asbest of
      asbesthoudende producten dan wel crocidoliet of crocidoliethoudende producten is respectievelijk zijn verwerkt
      en bij het verwijderen van voornoemde stoffen of producten hieruit, zijn, met uitsluiting van de overige
      voorschriften van de [afdelingen 1][ref1] en [2][ref2] en de [paragrafen 3][ref3] en [4 van deze afdeling][ref4],
      de [artikelen 4.3a, aanhef en onder d][ref5], [4.6a, vierde lid, onder b, c en e, en vijfde lid][ref6],
      [4.10a][ref7], [4.10d, vierde lid][ref8], [4.18][ref9], [4.19, aanhef en onder b en c][ref10],
      [4.20, eerste tot en met vierde lid][ref11], [4.45, eerste en tweede lid, onder a, c en d][ref12], [4.51][ref13],
      [4.52][ref14] en [4.53][ref15] van overeenkomstige toepassing alsmede de artikelen [4.46][ref16] en [4.47][ref17],
      met dien verstande dat voor de toepassing van beide laatstgenoemde artikelen ten aanzien van crocidoliet de in
      [artikel 4.56, tweede lid,][ref18] genoemde grenswaarde geldt.

      2 In afwijking van [artikel 4.45, tweede lid, onder d][ref19], kunnen bij het uitvoeren van werkzaamheden als
      bedoeld in het eerste lid elektrisch of pneumatisch aangedreven verspanende werktuigen worden gebruikt met een
      toerental hoger dan 100 omwentelingen per minuut of met een lineaire zaagsnelheid groter dan 25 meter per minuut,
      indien deze zijn voorzien van een afzuigsysteem of een andere voorziening, zodanig dat de concentratie van asbest-
      of crocidolietstof in de lucht, bedoeld in [artikel 4.55, eerste lid, onder d][ref20], niet wordt overschreden.

      3 Voordat met de in het eerste lid bedoelde werkzaamheden wordt begonnen zijn de locatie, de datum en het tijdstip
      waarop deze werkzaamheden zullen worden verricht, tijdig gemeld aan een daartoe aangewezen ambtenaar als bedoeld in
      [artikel 24, eerste lid, van de wet][ref21].

      4 Voorts wordt, voordat met de in het eerste lid bedoelde werkzaamheden wordt begonnen, een schriftelijk werkplan
      opgesteld dat doeltreffende maatregelen bevat ter bescherming van de veiligheid en de gezondheid van de betrokken
      werknemers.

      5 De in het eerste lid bedoelde werkzaamheden worden verricht door of onder toezicht van een persoon die in het
      bezit is van een certificaat van vakbekwaamheid verwijdering asbest en crocidoliet, dat is afgegeven door Onze
      Minister of een certificerende instelling.

      6 Het in het vierde lid respectievelijk vijfde lid, bedoelde werkplan en certificaat van vakbekwaamheid
      verwijdering asbest en crocidoliet of een afschrift daarvan zijn op de arbeidsplaats aanwezig en worden desgevraagd
      getoond aan een ambtenaar als bedoeld in [artikel 24, eerste lid, van de wet][ref22].


