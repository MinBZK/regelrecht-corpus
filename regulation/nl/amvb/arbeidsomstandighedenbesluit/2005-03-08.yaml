  - number: '4.90'
    text: |-
      1 In een register wordt bijgehouden welke werknemers arbeid met biologische agentia van categorie 3 en 4
      verrichten.

      2 In dit register wordt tevens per werknemer geregistreerd welke werkzaamheden hij heeft verricht en, voor zover
      dit te bepalen is, aan welk biologisch agens of welke biologische agentia hij als gevolg van deze werkzaamheden of
      als gevolg van een incident of ongeval, is of mogelijkerwijs is blootgesteld.

      3 Het in het eerste lid bedoelde register wordt ten minste tien jaar na de laatste blootstelling of mogelijke
      blootstelling bewaard.

      4 In geval een werknemer is blootgesteld of mogelijk is blootgesteld aan een biologisch agens dat infecties tot
      gevolg kan hebben die:

      a. naar bekend is hardnekkig of latent kunnen zijn;

      b. op basis van de huidige stand van de techniek naar verwachting eerst jaren later kunnen worden onderkend;

      c. een lange incubatietijd hebben;

      d. ondanks behandeling steeds weer terugkeren, of

      e. ernstige complicaties op lange termijn hebben, wordt het in het eerste lid bedoelde register een navenant
      langere tijd doch niet meer dan veertig jaar na de laatste blootstelling bewaard.

      5 Iedere werknemer heeft recht op inzage in de hem betreffende gegevens uit het register.

      6 Aan de arbodienst wordt desgevraagd inzage verschaft in het register, genoemd in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.90
  - number: '4.91'
    text: |-
      1 Iedere werknemer die arbeid verricht met biologische agentia wordt in aanvulling op
      [artikel 18 van de wet][ref1], in de gelegenheid gesteld bij de aanvang van die arbeid een arbeidsgezondheidskundig
      onderzoek te ondergaan.

      2 Iedere werknemer die een infectie of ziekte heeft opgelopen als gevolg van blootstelling aan een biologisch
      agens, wordt, in aanvulling op het eerste lid, tussentijds in de gelegenheid gesteld een arbeidsgezondheidskundig
      onderzoek te ondergaan.

      3 Iedere werknemer die aan een zelfde biologisch agens is blootgesteld als gevolg waarvan een andere werknemer een
      infectie of ziekte heeft opgelopen, wordt, in aanvulling op het eerste lid, tussentijds in de gelegenheid gesteld
      een arbeidsgezondheidskundig onderzoek te ondergaan.

      4 Het arbeidsgezondheidskundig onderzoek vindt plaats met inachtneming van de praktische aanbevelingen, opgenomen
      in bijlage IV bij de richtlijn.

      5 Indien het resultaat van het arbeidsgezondheidskundig onderzoek daartoe aanleiding geeft, worden doeltreffende
      maatregelen genomen om schade voor de gezondheid van de betrokken werknemer door blootstelling aan biologische
      agentia te voorkomen.

      6 Voor zover mogelijk worden aan iedere werknemer die nog niet immuun is voor de biologische agentia waaraan hij is
      of waarschijnlijk zal worden blootgesteld, doeltreffende vaccins ter beschikking gesteld. Daarbij wordt bijlage VII
      bij de richtlijn in acht genomen.

      7 Op verzoek van de werkgever of de betrokken werknemer wordt het in dit artikel bedoelde onderzoek opnieuw
      uitgevoerd. Het resultaat van het hernieuwde onderzoek treedt in de plaats van het daaraan voorafgaande.

      8 Iedere werknemer heeft recht op inzage in het hem betreffende medisch dossier.

      9 De resultaten van het in dit artikel bedoelde arbeidsgezondheidskundig onderzoek worden in passende vorm
      geregistreerd en ten minste tien jaar na de laatste blootstelling of mogelijke blootstelling bewaard. In gevallen
      als bedoeld in [artikel 4.90, vierde lid][ref2], worden de resultaten een navenant langere tijd doch niet meer dan
      veertig jaar bewaard.

      10 Iedere werknemer wordt geïnformeerd over de wijze waarop hij na beëindiging van de blootstelling in de
      gelegenheid wordt gesteld een arbeidsgezondheidskundig onderzoek te ondergaan.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4.90
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.91
