  - number: 4.10b
    text: |-
      1 Iedere werknemer die wordt of kan worden blootgesteld aan gevaarlijke stoffen waarvoor een biologische
      grenswaarde als bedoeld in [artikel 4.8b, tweede lid][ref1], is vastgesteld, wordt in de gelegenheid gesteld om een
      arbeidsgezondheidskundig onderzoek te ondergaan:

      a. vóór de aanvang van de blootstelling;

      b. bij het overschrijden van bij ministeriële regeling vastgestelde concentratiewaarden;

      c. in een bij ministeriële regeling vastgestelde frequentie van onderzoek.

      2 Het onderzoek als bedoeld in het eerste lid omvat onder meer een onderzoek naar het gehalte van de betreffende
      stof in het bij de biologische grenswaarde, bedoeld in [artikel 4.8b, tweede lid][ref2], vastgestelde biologische
      medium.

      3 Bij ministeriële regeling kan worden bepaald dat het onderzoek als bedoeld in het tweede lid, in de in deze
      regeling bepaalde gevallen wordt vervangen door een meting van andere biologische indicatoren.

      4 Bij ministeriële regeling worden de methoden vastgesteld, volgens welke het gehalte van de desbetreffende stof,
      bedoeld in het tweede lid, wordt gemeten.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.8b
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4.8b
