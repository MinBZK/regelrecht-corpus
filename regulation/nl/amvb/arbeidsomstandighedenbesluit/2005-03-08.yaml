  - number: '4.86'
    text: |-
      1 Indien de arbeid gericht is op het werken met biologische agentia behorend tot categorie 2, 3 of 4 zijn de
      artikelen [4.87 tot en met 4.102][ref1] van toepassing .

      2 Indien uit de resultaten van de risico-inventarisatie en -evaluatie, bedoeld in [artikel 4.85][ref2], blijkt,
      dat werknemers bij het verrichten van andere arbeid dan die, bedoeld in het eerste lid, waaronder de in bijlage
      I bij de richtlijn genoemde werkzaamheden, een gerede kans lopen aan biologische agentia van categorie 2, 3 of 4
      te worden blootgesteld, zijn de [artikelen 4.87][ref3], [4.89][ref4], [4.91][ref5], [4.93][ref6], [4.95][ref7],
      [4.97][ref8], [4.98][ref9], [4.99, tweede lid][ref10], en [4.102][ref11] van toepassing.

      3 In alle, niet in het eerste en tweede lid bedoelde gevallen, wordt bij de arbeid de grootst mogelijke
      zorgvuldigheid, ordelijkheid en zindelijkheid in acht genomen en worden de noodzakelijke hygiënische voorzieningen
      getroffen.


