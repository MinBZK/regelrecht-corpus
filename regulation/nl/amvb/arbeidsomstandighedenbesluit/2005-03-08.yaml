  - number: 2.3b
    text: |-
      1 Deze afdeling is:

      a. met uitzondering van [artikel 2.5f][ref1], niet van toepassing op bedrijven of inrichtingen waarop
      [paragraaf 3 van het Besluit risico's zware ongevallen 1999][ref2] van toepassing is;

      b. niet van toepassing op bedrijven en inrichtingen waarop het [Besluit opslag- en transportbedrijven][ref3] van
      toepassing is;

      c. niet van toepassing op arbeid verricht in de ondergrondse winningsindustrie en de winningsindustrie die
      delfstoffen wint met behulp van boringen.

      2 De [artikelen 2.5a, eerste en tweede lid][ref4], en [2.5d, eerste lid, onder a][ref5], zijn niet van toepassing
      op bedrijven of inrichtingen waarop [paragraaf 2 van het Besluit risico's zware ongevallen 1999][ref6] van
      toepassing is.


