  - number: '2.30'
    text: |-
      De coördinator voor de ontwerpfase heeft tot taak om:

      a. de uitvoering van [artikel 2.29][ref1] te coördineren;

      b. te zorgen voor de opstelling van een veiligheids- en gezondheidsplan als bedoeld in [artikel 2.27][ref2];

      c. een dossier samen te stellen, waarin de voor de veiligheid en gezondheid van werknemers van belang zijnde
      bouwkundige en technische kenmerken of kenmerken betreffende de inrichting of outillage van het bouwwerk zijn
      beschreven waarmee bij het verrichten van mogelijke latere werkzaamheden aan het bouwwerk rekening moet worden
      gehouden, dat is bestemd voor de eigenaar of beheerder van het bouwwerk dan wel degene die kan beslissen over de
      uitvoering van bedoelde werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2.29
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2.27
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel2.30
