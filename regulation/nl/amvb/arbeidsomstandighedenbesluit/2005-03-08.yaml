  - number: '9.23'
    text: |-
      1 De volgende besluiten worden ingetrokken:

      a. het Veiligheidsbesluit voor fabrieken of werkplaatsen 1938;

      b. het Electrotechnisch Veiligheidsbesluit 1938;

      c. het Veiligheidsbesluit-loodwit;

      d. het Veiligheidsbesluit electrische schrikdraden;

      e. het Landbouwveiligheidsbesluit;

      f. het Veiligheidsbesluit Stuwadoorsarbeid;

      g. het Zandsteenbesluit;

      h. het Veiligheidsbesluit Binnenvaart;

      i. het Zandstraalbesluit;

      j. het Veiligheidsbesluit Tankschepen;

      k. het Besluit verplichtstelling arbeidsveiligheidsrapport;

      l. het Arbeidsomstandighedenbesluit burgerlijke openbare dienst;

      m. het Arbeidsomstandighedenbesluit defensie;

      n. het Loodbesluit;

      o. het Asbestbesluit Arbeidsomstandighedenwet;

      p. het Arbeidsomstandighedenbesluit Justitiële Rijksinrichtingen;

      q. het Besluit verplichtstelling jaarplan;

      r. het Veiligheidsbesluit restgroepen;

      s. het Besluit specifieke gezondheidsschadelijke stoffen;

      t. het Arbeidsomstandighedenbesluit onderwijs;

      u. het Herkeuringsbesluit Arbeidsomstandighedenwet;

      v. het Besluit beeldschermwerk;

      w. het Besluit fysieke belasting;

      x. het Besluit arbeidsplaatsen;

      y. het Besluit arbeidsmiddelen;

      z. het Arbeidsomstandighedenbesluit persoonlijke beschermingsmiddelen;

      aa. het Besluit veiligheids- en gezondheidssignalering;

      ab. het Besluit arbodiensten;

      ac. het Besluit bedrijfshulpverlening Arbeidsomstandighedenwet;

      ad. het Besluit kankerverwekkende stoffen en processen;

      ae. het Besluit zwangere werkneemsters;

      af. het Besluit biologische agentia;

      ag. het Bouwprocesbesluit Arbeidsomstandighedenwet;

      ah. het Arbeidsomstandighedenbesluit winningsindustrie in dagbouw;

      ai. het Besluit thuiswerk;

      aj. het Besluit arbeid onder overdruk.

      2 De Arbeidsomstandighedenregeling vervoermiddelen wordt ingetrokken.

      3 Het Arbeidsbesluit jeugdigen wordt ingetrokken.

      4 Het Besluit spanninggevers voor schrikdraden wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel9.23
  - number: '9.34'
    text: |-
      1 Artikel I, onderdelen A tot en met I, O, P, T en V van het Koninklijk besluit van 7 februari 2004 tot
      wijziging van het Arbeidsomstandighedenbesluit ter vervanging van de bepalingen met betrekking tot de
      arbeidsveiligheidsrapportage door aanvullende voorschriften met betrekking tot de risico-inventarisatie en
      -evaluatie en enige andere wijzigingen (Stb. 2004, 69) is tot twee jaar na de inwerkingtreding niet van toepassing
      tenzij dat besluit voor dat tijdstip wordt toegepast.

      2 Ten aanzien van bedrijven of inrichtingen waar op de dag van de inwerkingtreding van het besluit, bedoeld
      in het eerste lid, over een arbeidsveiligheidsrapport als bedoeld in [artikel 2.2b][ref1], zoals dat artikel
      luidde op de dag voor de inwerkingtreding van voornoemd besluit, wordt beschikt, is, in afwijking van het
      eerste lid, het voornoemde besluit niet van toepassing tot het tijdstip waarop het arbeidsveiligheidsrapport
      had behoren te worden herzien op grond van [artikel 2.2b, tweede lid][ref2], zoals dat artikel luidde op de
      dag voor de inwerkingtreding van voornoemd besluit, doch uiterlijk tot vijf jaar na het tijdstip waarop het
      arbeidsveiligheidsrapport volledig is herzien en in zijn geheel aan de daartoe aangewezen ambtenaar, bedoeld in
      [artikel 24, eerste lid, van de wet][ref3] is toegezonden, tenzij dat besluit voor dat tijdstip wordt toegepast.

      3 De melding, bedoeld in [artikel 2.5g, eerste lid][ref4], ten aanzien van bedrijven of inrichtingen die in
      bedrijf zijn op de dag waarop het besluit, bedoeld in het eerste lid, ingevolge het eerste of het tweede lid wordt
      toegepast, vindt plaats binnen zes weken na de toepassing van voornoemd besluit.

      4 Het Arbeidsomstandighedenbesluit zoals dat luidde op de dag voor de inwerkingtreding van het besluit, bedoeld in
      het eerste lid, is van toepassing tot het tijdstip waarop ingevolge het eerste of het tweede lid het laatstgenoemde
      besluit wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2.2b
