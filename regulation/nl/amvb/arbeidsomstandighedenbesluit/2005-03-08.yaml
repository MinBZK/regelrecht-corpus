  - number: '1.33'
    text: |-
      1 De [artikelen 27][ref1] en [28 van de wet][ref2] zijn niet van toepassing:

      a. tijdens, direct voor en direct na oefeningen;

      b. op eenheden met gereedstelling.

      2 De [artikelen 27][ref3] en [28 van de wet][ref4] zijn niet van toepassing op militaire vaartuigen, militaire
      luchtvaartuigen en bemande wapensystemen:

      a. indien oorlogsschepen varen en indien militaire luchtvaartuigen en bemande wapensystemen als zodanig in gebruik
      zijn;

      b. in de gevallen, bedoeld in [artikel 1.30, onder b, sub 3°][ref5].

      3 De [artikelen 27][ref6] en [28 van de wet][ref7] zijn van toepassing op het personeel van de Koninklijke
      Marechaussee, behoudens indien dit personeel daadwerkelijk bezig is met de uitvoering van de specifieke taken, die
      de Koninklijke Marechaussee in [artikel 6, eerste lid, van de Politiewet 1993][ref8] zijn opgedragen.

      4 In aanvulling op het derde lid, zijn de [artikelen 27][ref9] en [28 van de wet][ref10] van toepassing op de
      arbeid verricht door personeel van de Koninklijke Marechaussee in geval van de verlening van bijstand, bedoeld
      in [artikel 1.29, onder b][ref11], voor zover door de toepassing van die artikelen een goede uitoefening van die
      bijstandsverlening niet wordt belemmerd.


