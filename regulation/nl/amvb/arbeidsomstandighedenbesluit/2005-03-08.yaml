  - number: '4.45'
    text: |-
      1 De concentratie van asbeststof in de lucht wordt zo laag mogelijk gehouden.

      2 Ter naleving van het eerste lid worden de volgende maatregelen genomen:

      a. gebouwen, installaties en uitrustingen die dienen voor het toepassen of het bewerken van asbest of van
      asbesthoudende producten worden zoveel mogelijk vrij van stof gehouden;

      b. asbest als grondstof wordt opgeborgen en vervoerd in een daartoe geschikte en gesloten verpakking;

      c. afvalstoffen, ontstaan als gevolg van het toepassen of bewerken van asbest of van asbesthoudende producten,
      worden zo spoedig mogelijk verzameld en afgevoerd in een daartoe geschikte en gesloten verpakking, voorzien van een
      etiket met de duidelijke en goed leesbare vermelding dat de inhoud daarvan asbest bevat;

      d. bij het uitvoeren van reparatie- of onderhoudswerkzaamheden worden geen elektrisch of pneumatisch aangedreven
      verspanende werktuigen met een toerental hoger dan 100 omwentelingen per minuut of met een lineaire zaagsnelheid
      groter dan 25 meter per minuut gebruikt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.45
  - number: 4.45a
    text: |-
      1 Indien de handelingen, bedoeld in [artikel 5, onderdelen e en f, van het Productenbesluit asbest][ref1]
      betrekking hebben op asbesthoudende grond, worden deze werkzaamheden begeleid door een persoon die in
      het bezit is van een certificaat van vakbekwaamheid arbeidshygiëne of veiligheidskunde als bedoeld in
      [artikel 2.7, tweede lid][ref2].

      2 Indien de handelingen, bedoeld in het eerste lid, in de buitenlucht plaatsvinden, wordt na het beëindigen
      van deze handelingen een visuele inspectie uitgevoerd op de aanwezigheid van asbest teneinde vast te stellen
      dat de concentratie asbest niet hoger is dan honderd milligram per kilogram droge stof als bedoeld in
      [artikel 2, onderdeel b, van het Productenbesluit asbest][ref3].

      3 Indien de handelingen, bedoeld in het eerste lid, niet in de buitenlucht plaatsvinden, is
      [artikel 4.55, eerste lid, onder d][ref4], van toepassing.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de visuele inspectie, bedoeld in
      het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0017778#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2.7
      [ref3]: https://wetten.overheid.nl/BWBR0017778#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0008498#Artikel4.55
