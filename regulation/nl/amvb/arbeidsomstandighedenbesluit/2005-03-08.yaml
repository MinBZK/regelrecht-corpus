  - number: '2.32'
    text: |-
      1 Ten aanzien van een opdrachtgever-consument zorgt de ontwerpende partij ervoor dat wordt voldaan aan
      [artikel 2.31][ref1].

      2 Indien twee of meer ontwerpende partijen zich ieder afzonderlijk jegens de opdrachtgever-consument hebben
      verbonden om een deel van het ontwerp van een bouwwerk tot stand te brengen, wordt in een schriftelijke
      overeenkomst tussen deze partijen vastgelegd door wie aan de verplichtingen, bedoeld in [artikel 2.31][ref2], wordt
      voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2.31
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2.31
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel2.32
