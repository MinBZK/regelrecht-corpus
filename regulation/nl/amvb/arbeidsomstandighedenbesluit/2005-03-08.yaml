  - number: '4.92'
    text: |-
      De ondernemingsraad of de personeelsvertegenwoordiging of, bij het ontbreken daarvan, de belanghebbende werknemers
      wordt respectievelijk worden op de hoogte gesteld van ieder ongeval of incident dat zich heeft voorgedaan, zich
      bijna heeft voorgedaan of zich mogelijkerwijs heeft voorgedaan met biologische agentia en dat heeft geleid tot het
      vrijkomen, net niet vrijkomen of mogelijkerwijs vrijkomen van een agens of agentia van categorie 2, 3 of 4. Daarbij
      worden tevens de oorzaken van het ongeval of incident meegedeeld, alsmede de maatregelen die zijn genomen of zullen
      worden genomen om de gevolgen te verhelpen en verdere ongevallen of incidenten te voorkomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.92
  - number: '4.93'
    text: |-
      1 Desgevraagd wordt de ondernemingsraad of de personeelsvertegenwoordiging, of worden, bij het ontbreken daarvan,
      de belanghebbende werknemers geïnformeerd over:

      a. de wijze waarop de risico-inventarisatie en -evaluatie, bedoeld in [artikel 4.85][ref1], tot stand is gekomen en
      over het resultaat daarvan;

      b. de werkzaamheden waarbij de werknemers aan biologische agentia worden of kunnen worden blootgesteld;

      c. het aantal werknemers dat aan biologische agentia wordt of kan worden blootgesteld;

      d. de naam en de functie van de persoon die verantwoordelijk is voor de veiligheid en de gezondheid op het werk;

      e. de genomen preventieve en beschermende maatregelen waaronder mede wordt verstaan de werkinstructie, bedoeld in
      [artikel 4.87, vierde lid][ref2], de toegepaste arbeidsprocédés en werkmethoden.

      2 De ondernemingsraad of de personeelsvertegenwoordiging heeft of, bij het ontbreken daarvan, de belanghebbende
      werknemers hebben recht op inzage in de in dit artikel bedoelde informatie in statistische, niet tot individuen
      herleidbare vorm.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.85
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4.87
