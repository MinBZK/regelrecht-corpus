  - number: '7.30'
    text: |-
      1 Stukken of voorwerpen die ten minste 1000 kilogram bruto wegen en die met een schip worden vervoerd zijn aan
      de buitenzijde op een duidelijke en duurzame wijze voorzien van een aanduiding van het gewicht van die stukken
      of voorwerpen.

      2 Bij vervoer van stukken of voorwerpen als bedoeld in het eerste lid mag, in plaats van het gewicht, zo nauwkeurig
      mogelijk het gewicht bij benadering worden aangeduid:

      a. indien de aard, samenstelling of afmeting van het stuk of het voorwerp een beletsel vormen om het juiste gewicht
      te bepalen;

      b. indien het gewicht als gevolg van klimaatsinvloeden aan aanmerkelijke veranderingen onderhevig is.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.30
  - number: '7.31'
    text: |-
      Op een bouwplaats zijn naast de voorschriften van de [afdelingen 1 tot en met 4][ref1] van dit hoofdstuk tevens de
      voorschriften van deze afdeling van toepassing.


