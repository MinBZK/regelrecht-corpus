  - number: '9.18'
    text: |-
      1 Vrijstelling of ontheffing van de [artikelen 7.24 tot en met 7.28][ref1] kan uitsluitend worden verleend:

      a. ten aanzien van plaatsen waar het verkeer onregelmatig is;

      b. ten aanzien van binnenvaartuigen met een lengte van minder dan 55 meter, zeeschepen kleiner dan 500 GT of
      vissersvaartuigen als bedoeld in [artikel 1 van de Schepenwet][ref2].

      2 Vrijstelling of ontheffing van [artikel 7.29][ref3] kan uitsluitend worden verleend:

      a. ten aanzien van plaatsen waar het verkeer onregelmatig is;

      b. ten aanzien van binnenschepen met een lengte van minder dan 55 meter of zeeschepen kleiner dan 500 GT.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel7.24
      [ref2]: https://wetten.overheid.nl/BWBR0001876#Artikel1
