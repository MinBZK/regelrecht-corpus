  - number: 4.10d
    text: |-
      1 De arbodienst houdt van iedere werknemer die een arbeidsgezondheidskundig onderzoek als bedoeld in de
      [artikelen 4.10a][ref1] en [4.10b][ref2] heeft ondergaan, een persoonlijk medisch dossier bij.

      2 Iedere werknemer heeft recht op inzage in het hem betreffende medisch dossier.

      3 De resultaten van het arbeidsgezondheidskundig onderzoek worden, voorzien van een toelichting, in
      statistische, niet tot individuen herleidbare vorm ter kennis gebracht van de ondernemingsraad of de personeels-
      vertegenwoordiging of, bij het ontbreken daarvan, van de belanghebbende werknemers.

      4 De resultaten van het arbeidsgezondheidskundig onderzoek worden in passende vorm geregistreerd en voor iedere
      werknemer tot ten minste 40 jaar na beëindiging van diens blootstelling aan gevaarlijke stoffen bewaard, evenals
      de lijst van werknemers, bedoeld in [artikel 4.15][ref3], en het register van blootgestelde werknemers, bedoeld in
      [artikel 4.53, eerste lid][ref4].

      5 In geval de werkzaamheden in het bedrijf of de inrichting van de werkgever gedurende de termijn van 40 jaar,
      bedoeld in het vierde lid, worden gestaakt, worden de in het vierde lid bedoelde documenten overgedragen aan een
      daartoe aangewezen ambtenaar als bedoeld in [artikel 24, eerste lid, van de wet][ref5].


