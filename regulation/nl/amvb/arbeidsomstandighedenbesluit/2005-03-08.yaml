        bwb_id: BWBR0008498
        hoofdstuk: '8'
        afdeling: '2'
  - number: '4.89'
    text: |-
      1 Op plaatsen waar gevaar bestaat voor blootstelling aan biologische agentia mag niet worden gerookt noch mag daar
      voedsel of drank worden genuttigd.

      2 Werkkleding die voldoet aan [afdeling 1 van hoofdstuk 8][ref1] wordt aan de werknemers ter beschikking gesteld en
      wordt bij de arbeid gedragen.

      3 In aanvulling op [artikel 3.23][ref2] zijn voor de werknemers doelmatige sanitaire voorzieningen beschikbaar met
      inbegrip van douches, oogdouches en huidantiseptica.

      4 Indien aan de werknemer persoonlijke beschermingsmiddelen worden verstrekt, worden deze op een daartoe aangewezen
      plaats bewaard en na ieder gebruik gecontroleerd en gereinigd.

      5 In aanvulling op [artikel 3.22][ref3] worden de werkkleding en andere persoonlijke beschermingsmiddelen waarin
      of waarop zich biologische agentia bevinden of kunnen bevinden, op een andere plaats opgeborgen dan de overige
      kleding.

      6 De in het vijfde lid bedoelde werkkleding en andere persoonlijke beschermingsmiddelen worden uitsluitend buiten
      het bedrijf of de inrichting gebracht indien dit geschiedt met het doel deze te laten reinigen, ontsmetten of
      vernietigen.

      7 In gevallen als bedoeld in het zesde lid, worden de werkkleding en andere persoonlijke beschermingsmiddelen in
      een daartoe geschikte en gesloten verpakking vervoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel3.23
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel3.22
