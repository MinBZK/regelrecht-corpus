  - number: 3.5d
    text: |-
      1 Doeltreffende maatregelen zijn genomen om het ontstaan van een explosieve atmosfeer op de arbeidsplaats te
      voorkomen.

      2 Indien het voorkomen van het ontstaan van een explosieve atmosfeer, gezien de aard van het werk niet mogelijk is,
      worden in de hieronder aangegeven volgorde de volgende maatregelen genomen:

      a. de ontsteking van explosieve atmosferen wordt voorkomen, waarbij rekening wordt gehouden met elektrostatische
      ontladingen die van werknemers of de arbeidsplaats als ladingsdrager of ladingsproducent kunnen uitgaan;

      b. de schadelijke gevolgen van een explosie worden beperkt.

      3 In aanvulling op de maatregelen, bedoeld in het eerste en tweede lid, wordt de mogelijkheid tot uitbreiding van
      een explosie beperkt.

      4 Indien werknemers of anderen door explosieve atmosferen gevaar kunnen lopen, wordt, in aanvulling op het eerste
      tot en met het derde lid, de arbeidsplaats zodanig ingericht dat veilig kan worden gewerkt en wordt er op de arbeid
      passend toezicht, met inbegrip van het gebruik van passende technische middelen, uitgeoefend. De inhoud en de mate
      van het toezicht is afhankelijk van de uit de beoordeling, bedoeld in [artikel 3.5c, eerste lid][ref1], gebleken
      gevaren.

      5 Indien uit de beoordeling, bedoeld in [artikel 3.5c, eerste lid][ref2], is gebleken dat er explosieve
      atmosferen kunnen voorkomen, worden gebieden waar deze atmosferen kunnen heersen ingedeeld in gevarenzones als
      bedoeld in bijlage I bij [richtlijn nr. 1999/92/EG](31999L0092) van het Europees Parlement en de Raad van de
      Europese Unie van 16 december 1999 (PbEG 2000, L 23) betreffende minimumvoorschriften voor de verbetering van
      de gezondheidsbescherming en van de veiligheid van werknemers die door explosieve atmosferen gevaar kunnen lopen
      (vijftiende bijzondere richtlijn in de zin van artikel 16, eerste lid, van [richtlijn nr. 89/391/EEG](31989L0391)).

      6 Gevarenzones worden gemarkeerd door middel van waarschuwingsborden die voldoen aan de bepalingen, vastgesteld bij
      of krachtens [afdeling 2 van hoofdstuk 8][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3.5c
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel3.5c
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.5d
