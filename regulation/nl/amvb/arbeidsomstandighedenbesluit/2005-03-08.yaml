  - number: '6.24'
    text: |-
      1 Op luchtvaartuigen waarvoor vóór 1 januari 1997 een Nederlands of daaraan gelijkgesteld bewijs van
      luchtwaardigheid is afgegeven, zijn de [artikelen 6.3][ref1], [6.4][ref2] en [6.5][ref3] niet van toepassing,
      tenzij de naleving daarvan redelijkerwijs kan worden gevergd.

      2 Op zeeschepen die vóór 1 januari 1994 zijn gebouwd, zijn de [artikelen 6.3][ref4] en [6.5][ref5] niet van
      toepassing, tenzij de naleving daarvan redelijkerwijs kan worden gevergd.

      3 Artikel [6.4][ref6] is niet van toepassing op zeeschepen.

      4 Onder gebouwde zeeschepen wordt verstaan: hetgeen daaronder wordt verstaan in
      [artikel 1 van het Schepenbesluit 1965][ref7] of, voor zover het zeegaande vissersvaartuigen betreft,
      [artikel 2 van het Vissersvaartuigenbesluit][ref8].

      5 Op voertuigen op een openbare weg of spoorweg die vóór 1 januari 1994 zijn gebouwd, zijn de
      [artikelen 6.3][ref9], [6.4][ref10] en [6.5][ref11] niet van toepassing, tenzij de naleving daarvan redelijkerwijs
      kan worden gevergd.


