  - number: '4.56'
    text: |-
      1 De [paragrafen 3][ref1], met uitzondering van [artikel 4.44][ref2], en [7][ref3] van deze afdeling zijn van
      toepassing op handelingen:

      a. als bedoeld in [artikel 5 van het Productenbesluit asbest][ref4], waarbij crocidoliet en crocidoliethoudende
      producten zijn betrokken;

      b. met crocidoliet of een crocidoliethoudend product dat wordt verwijderd in een inrichting als bedoeld in
      [artikel 1.1, vierde lid, van de Wet milieubeheer][ref5], met dien verstande dat voor de toepassing van de
      [artikelen 4.46][ref6] en [4.47][ref7] de in het tweede lid genoemde grenswaarde geldt.

      2 De concentratie van crocidolietstof in de lucht waaraan de werknemers in verband met de werkzaamheden, bedoeld in
      het eerste lid, worden blootgesteld mag de grenswaarde van 0,1 vezel per kubieke centimeter, vastgesteld, berekend
      of gemeten over een referentieperiode van acht uur, niet overschrijden.

      3 De bij de werkzaamheden vrijgekomen crocidoliethoudende materialen mogen niet worden opgeslagen tezamen
      met crocidolietvrije materialen en worden zo spoedig mogelijk verzameld en afgevoerd overeenkomstig
      [artikel 4.45, tweede lid, onder c][ref8].

      4 [Artikel 4.45a][ref9] is van overeenkomstige toepassing.


