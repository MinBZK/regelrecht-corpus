  - number: 4.1a
    text: |-
      1 De [artikelen 4.3a, onderdelen g en h][ref1], [4.8b][ref2], [4.9][ref3], en [4.10c][ref4] zijn niet
      van toepassing op kankerverwekkende of mutagene stoffen en kankerverwekkende processen als bedoeld in
      [afdeling 2 van dit hoofdstuk][ref5] en op asbest of asbesthoudende producten en crocidoliet of crocidoliethoudende
      producten als bedoeld in [afdeling 5 van dit hoofdstuk][ref6].

      2 [Artikel 4.6a][ref7] is niet van toepassing op bedrijven, inrichtingen of delen daarvan waarop het
      [Besluit risico's zware ongevallen 1999][ref8] of [afdeling 2 van hoofdstuk 2][ref9] van toepassing is.

      3 [Artikel 4.9][ref10] is niet van toepassing op:

      a. vluchtige organische stoffen en producten die deze stoffen bevatten als bedoeld in [afdeling 6A][ref11], voor
      zover daarop de vervangingsplicht, bedoeld in [artikel 4.62b][ref12], van toepassing is;

      b. loodwit als bedoeld in [afdeling 7 van dit hoofdstuk][ref13].

      4 Deze afdeling is, met inachtneming van het eerste lid, van overeenkomstige toepassing op arbeid
      waarbij werknemers kunnen worden blootgesteld aan een kankerverwekkend proces als bedoeld in
      [artikel 4.11, onderdeel c][ref14].


