  - number: '1.35'
    text: |-
      In deze afdeling wordt verstaan onder richtlijn: [Richtlijn nr. 94/33/EEG](31994L0033) van de Raad van de Europese
      Unie van 22 juni 1994 betreffende de bescherming van jongeren op het werk (*PbEG* L 216).
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel1.35
  - number: '1.36'
    text: |-
      1 Indien in een bedrijf of inrichting een of meer jeugdige werknemers werkzaam zijn of plegen te zijn wordt in de
      risico-inventarisatie en -evaluatie, bedoeld in [artikel 5 van de wet][ref1], in het bijzonder aandacht besteed
      aan:

      a. de leeftijd van de jeugdige werknemer;

      b. de specifieke gevaren op het gebied van arbeidsomstandigheden als gevolg van een gebrek aan werkervaring, het
      niet goed kunnen inschatten van gevaren en het niet voltooid zijn van de geestelijke of lichamelijke ontwikkeling
      van de jeugdige werknemer;

      c. de uitrusting en inrichting van de arbeidsplaats;

      d. de aard, de mate en de duur van de blootstelling aan stoffen, agentia en fysische factoren;

      e. de keuze en het gebruik van arbeidsmiddelen en persoonlijke beschermingsmiddelen;

      f. het geheel van werkzaamheden in het bedrijf of de inrichting en de organisatie daarvan, en

      g. het opleidingsniveau van de jeugdige werknemers en de aan hen te geven voorlichting.

      2 Voorts wordt in de risico-inventarisatie en -evaluatie bijzondere aandacht besteed aan de niet-volledige lijst
      van agentia, procédés en werkzaamheden, opgenomen in de bijlage bij de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel1.36
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
  - number: '1.37'
    text: |-
      1 Indien in een bedrijf of inrichting jeugdige werknemers arbeid verrichten, wordt op die arbeid adequaat deskundig
      toezicht uitgeoefend. De inhoud en de mate van het toezicht is afhankelijk van de uit de risico-inventarisatie
      en -evaluatie, bedoeld in [artikel 5 van de wet][ref1], gebleken gevaren die kunnen ontstaan, indien deskundig
      toezicht ontbreekt.

      2 Indien uit de risico-inventarisatie en -evaluatie, bedoeld in [artikel 1.36][ref2], blijkt, dat jeugdige
      werknemers arbeid moeten verrichten waaraan specifieke gevaren, met name voor arbeidsongevallen als gevolg van een
      gebrek aan werkervaring, het niet goed kunnen inschatten van gevaren en het niet voltooid zijn van de geestelijke
      en lichamelijke ontwikkeling van de jeugdige werknemer, zijn verbonden, mag die arbeid slechts worden verricht,
      indien het deskundig toezicht zodanig is georganiseerd dat die gevaren worden voorkomen. Indien dat niet mogelijk
      is, mag die arbeid niet door jeugdige werknemers worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel1.36
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel1.37
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '1.36'
        hoofdstuk: '1'
        afdeling: '8'
  - number: '1.38'
    text: |-
      In aanvulling op [artikel 18 van de wet][ref1] worden jeugdige werknemers in de gelegenheid gesteld om een
      arbeidsgezondheidskundig onderzoek te ondergaan, zodra uit de risico-inventarisatie en -evaluatie, bedoeld in
      [artikel 1.36][ref2], blijkt, dat jeugdige werknemers arbeid moeten verrichten waaraan specifieke gevaren, met name
      voor arbeidsongevallen als gevolg van het gebrek aan werkervaring, het niet goed kunnen inschatten van gevaren en
      het niet voltooid zijn van de geestelijke en lichamelijke ontwikkeling van de jeugdige werknemer, zijn verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel1.36
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel1.38
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '1.36'
        hoofdstuk: '1'
        afdeling: '8'
  - number: '1.39'
    text: |-
      Deze afdeling en [paragraaf 4 van afdeling 5 van hoofdstuk 3][ref1],
      [paragraaf 2 van afdeling 10 van hoofdstuk 4][ref2], [paragraaf 3 van afdeling 6 van hoofdstuk 6][ref3] en
      [paragraaf 2 van afdeling 6 van hoofdstuk 7][ref4], zijn niet van toepassing op leerlingen en studenten in
      onderwijsinrichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk3
