  - number: '7.21'
    text: |-
      1 Indien zich in een schacht twee of meer liften bevinden, worden afdoende technische maatregelen genomen teneinde
      te voorkomen dat personen bij werkzaamheden in de schacht aan een van de liften, getroffen worden door onderdelen
      van een naastliggende lift.

      2 Indien het nemen van de maatregelen, bedoeld in het eerste lid, niet mogelijk is, wordt het in het eerste lid
      bedoelde gevaar voorkomen door stilzetting van de naastliggende lift.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.21
  - number: '7.22'
    text: |-
      1 Met een hijs- of hefwerktuig dat uitsluitend is bestemd en ingericht voor het vervoer van goederen, mogen in de
      plaats van of te zamen met goederen geen personen worden vervoerd.

      2 Het eerste lid is niet van toepassing op het vervoer van personen met behulp van een werkbak ten behoeve van
      het vanuit die werkbak verrichten van incidentele werkzaamheden van korte duur op plaatsen die moeilijk bereikbaar
      zijn, indien toepassing van andere, meer geëigende middelen om die plaatsen te bereiken, grotere gevaren zou
      meebrengen dan het vervoer van personen met een werkbak als vorenbedoeld, of de toepassing van zodanige middelen
      redelijkerwijs niet kan worden gevergd.

      3 In geval van toepassing van het tweede lid, gelden de volgende voorschriften:

      a. de werkbak, bedoeld in het tweede lid, is zodanig vervaardigd, ingericht, toegerust, bevestigd, verkeert in
      een zodanige staat van onderhoud en wordt op een zodanige wijze gebruikt, dat gevaar voor de veiligheid en de
      gezondheid van de werknemers zoveel mogelijk wordt voorkomen of beperkt;

      b. het hijs- of hefwerktuig is voldoende toegerust om in combinatie met een werkbak te worden gebruikt;

      c. de bedieningsplaats van het hijs- of hefwerktuig is permanent bemand;

      d. de werknemers die worden gehesen of geheven beschikken over een doeltreffend communicatiemiddel, en

      e. doeltreffende voorzieningen zijn getroffen om de werknemers bij gevaar te kunnen evacueren.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.22
  - number: '7.24'
    text: |-
      1 In aanvulling op artikel 3.2 is de toegang tot een ruim van een schip of dek uitsluitend toegestaan door een
      vaste trap of, indien dit niet mogelijk is, een vaste ladder of klampen of voetopeningen van geschikte afmetingen,
      van voldoende sterkte en van een behoorlijke constructie dan wel andere deugdelijke toegangsmiddelen.

      2 De in het eerste lid genoemde toegangsmiddelen zijn, indien dit redelijkerwijs mogelijk is, gescheiden van de
      luikopeningen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.24
  - number: '7.25'
    text: |-
      1 Luiken die met behulp van hijs- of hefwerktuigen worden geplaatst of verwijderd, zijn uitgerust met goed
      toegankelijke en geschikte bevestigingen voor het vastmaken van hijsgereedschap.

      2 Indien luiken niet onderling verwisselbaar zijn, zijn zij duidelijk gemerkt om aan te geven tot welke ruimopening
      alsmede op welke plaats zij behoren.

      3 Motorisch of hydraulisch bediende luiken en overige motorisch of hydraulisch aangedreven scheepsuitrusting worden
      uitsluitend geplaatst of verwijderd door een daartoe bevoegde persoon.

      4 De in het derde lid bedoelde luiken en scheepsuitrusting worden uitsluitend geplaatst of verwijderd indien dit op
      veilige wijze kan gebeuren.

      5 Luikopeningen die niet zijn uitgerust met een doelmatig luikhoofd worden gesloten dan wel anderszins beveiligd
      zodra de laad- en loswerkzaamheden zijn beëindigd.

      6 Luiken worden niet geplaatst of verwijderd, indien er in het ruim onder de luikopening arbeid wordt verricht.

      7 Luiken die niet afdoende tegen verplaatsing zijn geborgd, worden verwijderd voordat met laad- en loswerkzaamheden
      wordt begonnen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.25
  - number: '7.26'
    text: |-
      1 Het opslaan of overslaan, laden of lossen, stuwen of anderszins verwerken van goederen of materialen op de kade,
      in loodsen of in het schip, geschiedt op veilige en ordelijke wijze, rekening houdend met de aard van die goederen
      of materialen en de verpakking daarvan.

      2 Lasten worden niet opgelicht of neergelaten, tenzij zij op veilige wijze aan het hijs- of hefwerktuig zijn
      aangeslagen of anderszins bevestigd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.26
  - number: '7.27'
    text: |-
      1 Voor het veilig tuigen van laadbomen en het bijbehorende gerei zijn aan boord van het schip tuigplannen en alle
      daarop betrekking hebbende gegevens aanwezig. De tuigplannen worden desgevraagd getoond aan een ambtenaar als
      bedoeld in [artikel 24 van de wet][ref1].

      2 Voor eenmalig gebruik bestemde bind- of hijsmiddelen worden niet opnieuw gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.27
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: '7.28'
    text: |-
      Tijdens het laden en lossen van containers zijn deugdelijke middelen aanwezig die de veiligheid van de werknemers
      bij het aanbrengen of verwijderen van de sjorringen van de containers waarborgen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.28
  - number: '7.29'
    text: |-
      1 In afwijking van [artikel 7.20, zesde, zevende, achtste en negende lid][ref1], gelden voor hijs- en hefwerktuigen
      alsmede hijs- en hefgereedschappen aan boord van schepen, die gebruikt worden voor het laden en lossen, de volgende
      bepalingen.

      2 Hijs- en hefwerktuigen met inbegrip van de daarbij behorende hulpstukken, onderdelen, bevestigingspunten,
      verankeringen en steunen, en hijs- en hefgereedschappen worden, voordat zij voor de eerste maal in gebruik worden
      genomen, doelmatig beproefd en op hun goede staat onderzocht.

      3 Werktuigen en gereedschappen als bedoeld in het tweede lid, worden na iedere belangrijke wijziging of herstelling
      die van invloed kan zijn op de veiligheid, doelmatig beproefd en op hun goede staat onderzocht.

      4 Werktuigen en gereedschappen als bedoeld in het tweede lid, worden, afhankelijk van de feitelijke belasting,
      regelmatig doch in ieder geval ten minste eenmaal per vijf jaar, doelmatig beproefd en op hun goede staat
      onderzocht.

      5 Hijs- en hefwerktuigen en hijs- en hefgereedschappen worden, afhankelijk van de feitelijke belasting, regelmatig
      doch in ieder geval ten minste eenmaal per jaar, op hun goede staat onderzocht.

      6 Hijs- en hefgereedschappen worden, afhankelijk van het gebruik, regelmatig op hun goede staat gecontroleerd.

      7 Beproevingen en onderzoeken als bedoeld in het tweede tot en met vierde lid, worden uitgevoerd door Onze Minister
      of een certificerende instelling.

      8 Onderzoeken en controles als bedoeld in het vijfde en zesde lid, worden uitgevoerd door een deskundige
      natuurlijke persoon, rechtspersoon of instelling.

      9 Van de beproevingen en onderzoeken, bedoeld in het tweede tot en met vierde lid, worden door de certificerende
      instelling, bedoeld in het zevende lid, certificaten uitgereikt volgens een bij ministeriële regeling vastgesteld
      model.

      10 Aan boord van ieder schip wordt een register van hijs- en hefwerktuigen en hijs- en hefgereedschappen
      bijgehouden volgens een bij ministeriële regeling vastgesteld model, waarin de in het negende lid bedoelde
      certificaten worden opgenomen. In het register worden de bedrijfslast of bedrijfslasten van de hijs- en
      hefwerktuigen, de werklast van de hijs- en hefgereedschappen alsmede de tijdstippen en de resultaten van
      de in het tweede tot en met vijfde lid, bedoelde beproevingen en onderzoeken vermeld. De tijdstippen en het
      resultaat van de in het zesde lid bedoelde controles worden vermeld, indien bij de desbetreffende controles
      een defect is geconstateerd. Het register wordt desgevraagd getoond aan een ambtenaar als bedoeld in
      [artikel 24 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel7.20
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel24
