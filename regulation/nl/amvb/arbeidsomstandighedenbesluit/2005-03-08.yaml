      1 Hoofdstuk 7 is van toepassing op tewaterlatingsmiddelen voor reddingsmiddelen op zeeschepen voorzover geen
      afbreuk wordt gedaan aan het gebruiksdoel van deze middelen.

      2 Artikel 7.4a, eerste tot en met derde lid, is, voorzover het betreft tewaterlatingsmiddelen voor reddingsmiddelen
      en mechanische loodsladders, niet van toepassing op zeeschepen.

      3 Artikel 7.22, tweede en derde lid, is niet van toepassing op laad- en losgerei aan boord van zeeschepen en
      binnenvaartuigen.

      4 Artikel 7.29 is niet van toepassing op vissersvaartuigen als bedoeld in [artikel 1 van de Schepenwet][ref1].


