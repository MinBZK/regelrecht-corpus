  - number: '2.40'
    text: |-
      Deze afdeling is niet van toepassing op arbeid verricht in winningsindustrieën in dagbouw met behulp van
      baggermaterieel.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel2.40
  - number: '2.41'
    text: |-
      1 Indien bemande arbeidsplaatsen in de winningsindustrie in gebruik zijn wordt toezicht uitgeoefend door een
      verantwoordelijke persoon.

      2 Werkzaamheden waaraan een bijzonder gevaar is verbonden worden uitsluitend opgedragen aan vakbekwaam personeel
      met voldoende ervaring en uitgevoerd overeenkomstig de verstrekte instructies.

      3 Op arbeidsplaatsen in de winningsindustrie worden met regelmatige tussenpozen de nodige veiligheidsoefeningen
      gehouden.

      4 Situaties die een ernstig gevaar vormen worden onverwijld gemeld aan een daartoe aangewezen ambtenaar als bedoeld
      in [artikel 24 van de wet][ref1].

      5 Op de arbeidsplaats wordt op een te begrijpen wijze gecommuniceerd.

      6 Opdat in geval van nood onmiddellijk hulp-, vlucht-, evacuatie- en reddingsmaatregelen kunnen worden genomen,
      worden, in aanvulling op [afdeling 4 van hoofdstuk 2][ref2], de nodige alarm- of andere communicatiesystemen ter
      beschikking gesteld.

      7 Indien op een arbeidsplaats in de winningsindustrie slechts één werknemer aanwezig is, beschikt deze over
      telecommunicatiemiddelen om zich met anderen in verbinding te kunnen stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel2.41
    references:
