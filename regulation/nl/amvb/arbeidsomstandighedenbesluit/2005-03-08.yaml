  - number: 4.3a
    text: |-
      In alle gevallen waarin arbeid wordt verricht waarbij werknemers kunnen worden blootgesteld aan gevaarlijke
      stoffen, worden, in het kader van [artikel 3 van de wet][ref1], de volgende maatregelen genomen om blootstelling
      van werknemers te voorkomen of te beperken tot een zo laag mogelijk niveau:

      a. de arbeidsprocédés en werkmethoden zijn zodanig ontworpen en georganiseerd dat het risico op blootstelling wordt
      voorkomen of beperkt;

      b. er wordt gebruik gemaakt van adequate arbeidsmiddelen;

      c. er wordt gebruik gemaakt van adequate voorzieningen bij het uitvoeren van reparatie- of onderhoudswerkzaamheden;

      d. gevaarlijke stoffen zijn in geen grotere hoeveelheid aanwezig en het aantal werknemers dat wordt of kan worden
      blootgesteld is niet groter dan voor het verrichten van de arbeid strikt noodzakelijk is;

      e. de mate en duur van de blootstelling wordt zoveel mogelijk beperkt;

      f. bij de arbeid zijn de noodzakelijke hygiënische voorzieningen getroffen;

      g. er wordt gebruik gemaakt van doeltreffende middelen voor veilig opslaan, hanteren en vervoeren van stoffen, en

      h. er wordt gebruik gemaakt van doeltreffende middelen voor het veilig verzamelen, opslaan en verwijderen van
      afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.3a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '3'
  - number: '4.4'
    text: |-
      1 Voor zover uit de resultaten van de beoordeling, bedoeld in [artikel 4.2][ref1], blijkt dat er ten aanzien
      van aanwezige gevaarlijke stoffen gevaren voor de veiligheid of de gezondheid van de werknemers bestaan, en deze
      stoffen niet kunnen worden vervangen overeenkomstig [artikel 4.9, derde lid][ref2], of [artikel 4.17][ref3], zijn
      zodanige voorzieningen getroffen dat het gevaar, dat zich met betrekking tot die stoffen een ongewilde gebeurtenis
      voordoet, zoveel mogelijk is vermeden.

      2 Bij het verrichten van arbeid met of in aanwezigheid van stoffen als bedoeld in het eerste lid, zijn zodanige
      voorzieningen getroffen, dat het gevaar dat zich bij die arbeid een ongewilde gebeurtenis voordoet, zoveel mogelijk
      is vermeden.

      3 Het tweede lid is van overeenkomstige toepassing op het verrichten van arbeid aan, dan wel het verwijderen van
      reservoirs, installaties, verpakkingen of andere zaken waarin zich stoffen dan wel restanten van die stoffen als
      bedoeld in het eerste lid, bevinden.

      4 Voorts zijn zodanige voorzieningen getroffen dat in geval zich een ongewilde gebeurtenis als bedoeld in het
      eerste, respectievelijk het tweede lid voordoet, de gevolgen daarvan zoveel mogelijk worden beperkt.

      5 De voorzieningen, bedoeld in het eerste, tweede en vierde lid, zijn, voor zover van toepassing, in
      overeenstemming met het [Warenwetbesluit explosieveilig materieel][ref4].

      6 In ruimten waarin arbeid als bedoeld in het tweede lid wordt uitgevoerd, zijn stoffen in geen grotere
      hoeveelheden aanwezig dan voor de bedrijfsvoering strikt noodzakelijk is.

      7 In ruimten als bedoeld in het zesde lid, zijn niet meer werknemers aanwezig dan noodzakelijk is.

      8 Arbeid met of in de aanwezigheid van stoffen als bedoeld in het eerste lid mag slechts worden verricht door
      personen die in een zodanige lichamelijke en geestelijke toestand verkeren en op het gebied van die arbeid over
      een zodanige basiskennis beschikken, dat zij voldoende in staat zijn de daaraan verbonden gevaren te onderkennen en
      te voorkomen.


