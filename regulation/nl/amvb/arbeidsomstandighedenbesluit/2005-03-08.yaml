  - number: '1.8'
    text: |-
      1 Ten aanzien van degene op wie het [Algemeen Rijksambtenarenreglement][ref1] onderscheidenlijk
      het [Burgerlijk ambtenarenreglement defensie][ref2] van toepassing is en die als deskundige
      werknemer als bedoeld in [artikel 14, eerste lid, van de wet][ref3] werkzaam is, is
      [artikel 126d, tweede en derde lid, van het Algemeen Rijksambtenarenreglement][ref4] onderscheidenlijk
      [artikel 144, tweede en derde lid, van het Burgerlijk ambtenarenreglement defensie][ref5] van overeenkomstige
      toepassing.

      2 Ten aanzien van degenen, bedoeld in het eerste lid, op wie een overeenkomstige regeling als het
      [Algemeen Rijksambtenarenreglement][ref6] van toepassing is, is voor zover nodig het eerste lid van overeenkomstige
      toepassing.

      3 Het eerste lid is van overeenkomstige toepassing ten aanzien van degene op wie het
      [Rechtspositiereglement wetenschappelijk onderwijs][ref7] en onderzoek van toepassing is, met dien verstande dat
      in [artikel 126][ref8] in de plaats van artikel 6, tweede lid, onder *d* en *e*, wordt gelezen: [artikel 2.3]
      (onbekend), vierde lid, onder *c*, en [artikel 2.3, zesde lid, onder ](onbekend) en onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0001950
      [ref2]: https://wetten.overheid.nl/BWBR0006040
