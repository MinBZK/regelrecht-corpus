  - number: '1.32'
    text: |-
      [Artikel 12 van de wet][ref1] is van toepassing behoudens:

      a. tijdens oefeningen;

      b. op aangelegenheden die rechtstreeks betrekking hebben op het houden van oefeningen;

      c. op aangelegenheden die rechtstreeks betrekking hebben op de arbeid, bedoeld in [artikel 1.29][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel12
