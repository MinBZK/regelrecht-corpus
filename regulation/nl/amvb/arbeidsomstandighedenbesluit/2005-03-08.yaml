      [7.22, eerste lid][ref108], [7.25, zesde lid][ref109], [7.26][ref110], [7.27, tweede lid][ref111], [7.33][ref112],
      [7.34, derde en vierde lid][ref113], [7.36b, eerste tot en met derde, vijfde en zesde lid][ref114], [7.39][ref115],
      [7.41, eerste en tweede lid][ref116];

      h. van de [Arbeidsomstandighedenregeling][ref117]: de [artikelen 4.3][ref118],
      [4.4, eerste tot en met derde lid][ref119], [4.6, eerste en tweede lid][ref120], [4.7][ref121],
      [4.9, eerste en tweede lid][ref122], [4.11][ref123], [4.12][ref124] en [4.30, zevende lid][ref125].

      2 Voor zover van de artikelen, bedoeld in het eerste lid, ontheffing onder voorschriften is verleend, wordt de
      handeling of het nalaten in strijd met die voorschriften mede aangemerkt als beboetbaar feit ter zake waarvan een
      boete van de tweede categorie kan worden opgelegd.


