  - number: '7.33'
    text: |-
      1 Ladders en trappen zijn voldoende sterk en stijf.

      2 Ladders en trappen zijn stabiel opgesteld en zo nodig vastgezet en van een voldoende lengte om in alle standen
      waarin zij worden gebruikt, een stevige steun voor handen en voeten te bieden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.33
  - number: '7.34'
    text: |-
      1 Het opbouwen, wijzigen en afbreken van een steiger geschiedt onder toezicht van een ter zake deskundig persoon.

      2 De veiligheid van de constructie van een steiger wordt regelmatig door een ter zake deskundig persoon
      gecontroleerd doch in ieder geval vóór de ingebruikneming en verder na iedere wijziging in de constructie van de
      steiger, na iedere periode waarin de steiger niet is gebruikt, na abnormale weersomstandigheden alsmede na iedere
      andere gebeurtenis waardoor de veiligheid van de constructie van de steiger mogelijk is aangetast.

      3 Een steiger mag niet worden overbelast. Lasten worden zo gelijkmatig mogelijk over de steiger verdeeld.

      4 Verrijdbare steigers zijn beveiligd tegen ongewilde verplaatsingen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.34
  - number: '7.35'
    text: |-
      1 Bestuurders en bedieners van grondverzet- en materiaalverladingsmachines bezitten daartoe een specifieke
      deskundigheid.

      2 Doeltreffende maatregelen worden genomen om te voorkomen dat grondverzet- en materiaalverladingsmachines ongewild
      in uitgravingen of in het water terechtkomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.35
  - number: 7.36a
    text: |-
      In de winningsindustrie in dagbouw, ondergronds of met behulp van boringen zijn naast de voorschriften van de
      [afdelingen 1 tot en met 4 van dit hoofdstuk][ref1] tevens de voorschriften van deze afdeling van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk7
