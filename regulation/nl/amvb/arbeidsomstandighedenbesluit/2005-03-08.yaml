  - number: '3.42'
    text: |-
      1 Op luchtvaartuigen, waarvoor vóór 1 januari 1997 een Nederlands of daaraan gelijk gesteld bewijs van
      luchtwaardigheid is afgegeven, zijn de [artikelen 3.4][ref1], [3.5][ref2], [3.7, vijfde lid][ref3], niet van
      toepassing, tenzij de naleving daarvan redelijkerwijs kan worden gevergd.

      2 Op zeeschepen en binnenvaartuigen, die vóór 1 januari 1994 zijn gebouwd, zijn de
      [artikelen 3.7, vijfde lid][ref4], [3.20][ref5], [3.22][ref6], [3.23][ref7] en [3.24][ref8] niet van toepassing,
      tenzij de naleving daarvan redelijkerwijs kan worden gevergd.

      3 Onder gebouwde zeeschepen wordt verstaan: hetgeen daaronder wordt verstaan in
      [artikel 1 van het Schepenbesluit 1965][ref9] of, voor zover het zeegaande vissersvaartuigen betreft,
      [artikel 2 van het Vissersvaartuigenbesluit][ref10].

      4 Op voertuigen op een openbare weg of spoorweg, die vóór 1 januari 1994 zijn gebouwd, is
      [artikel 3.7, vijfde lid][ref11], niet van toepassing, tenzij de naleving daarvan redelijkerwijs kan worden
      gevergd.

      5 De [artikelen 3.4][ref12], [3.5][ref13] en [3.7, vijfde lid][ref14], zijn niet van toepassing op het in bedrijven
      of inrichtingen aanwezige rollende materieel van spoorwegondernemingen.

      6 De [artikelen 3.20 tot en met 3.25][ref15] zijn niet van toepassing op luchtvaartuigen.

      7 De [artikelen 3.4][ref16], [3.5][ref17], [3.7, derde en vierde lid][ref18], [3.21, tweede volzin][ref19], en
      [3.25][ref20] zijn niet van toepassing op zeeschepen en binnenvaartuigen.

      8 De [artikelen 3.20 tot en met 3.25][ref21] zijn niet van toepassing op voertuigen op een openbare weg of een
      spoorweg.


