  - number: '4.19'
    text: |-
      In alle gevallen waarin arbeid wordt verricht waarbij werknemers als gevolg van hun werk kunnen worden blootgesteld
      aan kankerverwekkende of mutagene stoffen of kankerverwekkende processen, worden de volgende maatregelen genomen om
      blootstelling van werknemers te voorkomen of te beperken tot een zo laag mogelijk niveau:

      a. de werknemers die worden of kunnen worden blootgesteld zijn voldoende vertrouwd met de aard van hun
      werkzaamheden en hebben voldoende kennis van de gevaren die aan de blootstelling zijn verbonden en van de
      voorzieningen die getroffen zijn of door hen moeten worden getroffen om die gevaren te voorkomen of te beperken;

      b. voorkomen wordt dat gevarenzones worden betreden door anderen dan de werknemers of andere personen die de zones
      in verband met hun arbeid moeten betreden;

      c. gevarenzones worden gemarkeerd door middel van waarschuwings- en veiligheidssignalen die voldoen aan het bij of
      krachtens [afdeling 2 van hoofdstuk 8][ref1] bepaalde;

      d. gebruik wordt gemaakt van doeltreffende middelen voor veilig opslaan, hanteren en vervoeren van
      kankerverwekkende of mutagene stoffen door gebruik van hermetisch gesloten en duidelijk zichtbaar gekenmerkte
      houders, en

      e. gebruik wordt gemaakt van doeltreffende middelen voor het veilig verzamelen, opslaan en verwijderen van
      afvalstoffen, met inbegrip van het gebruik van hermetisch gesloten en duidelijk zichtbaar gekenmerkte houders.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.19
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '8'
        afdeling: '2'
  - number: '4.20'
    text: |-
      1 Zones zijn ingericht waar de werknemers zonder gevaar voor blootstelling kunnen eten en drinken.

      2 Indien kans op blootstelling bestaat wordt aan werknemers werkkleding ter beschikking gesteld die voldoet aan
      [afdeling 1 van hoofdstuk 8][ref1] en die door de werknemers bij de arbeid steeds wordt gedragen.

      3 In aanvulling op [artikel 3.22][ref2] wordt de werkkleding op een andere plaats opgeborgen dan de overige
      kleding.

      4 In aanvulling op [artikel 3.23][ref3] zijn voor de werknemers doelmatige wasgelegenheden en doucheruimten
      beschikbaar.

      5 Persoonlijke beschermingsmiddelen worden volgens instructie op de daartoe aangewezen plaats bewaard en na ieder
      gebruik gecontroleerd.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel3.22
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel3.23
