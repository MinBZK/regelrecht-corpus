      1 [Artikel 3, eerste lid, onder c, van de wet][ref1] met uitzondering van de ergomische aspecten van de arbeid,
      en d, voor zover niet betrekking hebbend op de veiligheid en de gezondheid, is niet van toepassing op leerlingen
      respectievelijk studenten in onderwijsinrichtingen.

      2 [Afdeling 4.1.2 van de Algemene wet bestuursrecht][ref2] geldt niet ten aanzien van leerlingen respectievelijk
      studenten in onderwijsinrichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
