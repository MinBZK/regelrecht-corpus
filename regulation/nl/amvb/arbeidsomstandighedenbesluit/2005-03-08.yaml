  - number: '1.40'
    text: |-
      In deze afdeling wordt verstaan onder richtlijn: [Richtlijn nr. 92/85/EEG](31992L0085) van de Raad van de Europese
      Gemeenschappen van 19 oktober 1992 betreffende maatregelen ter bevordering van de verbetering van de veiligheid en
      de gezondheid van werkneemsters tijdens de zwangerschap, na de bevalling en tijdens de lactatie (*PbEG* L 348).
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel1.40
  - number: '1.41'
    text: |-
      Indien in een bedrijf of inrichting een zwangere werknemer of een werknemer tijdens de lactatie werkzaam is of
      pleegt te zijn, wordt in de risico-inventarisatie en -evaluatie, bedoeld in [artikel 5 van de wet][ref1], in het
      bijzonder aandacht besteed aan de niet-limitatieve lijst van agentia, procédés en arbeidsomstandigheden, opgenomen
      in bijlage I bij de richtlijn


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel1.41
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
  - number: '1.42'
    text: |-
      1 Onverminderd [artikel 4:5 van de Arbeidstijdenwet][ref1], organiseert de werkgever de arbeid van een zwangere
      werknemer en een werknemer tijdens de lactatie zodanig, richt de arbeidsplaats zodanig in, past een zodanige
      productie- en werkmethode toe en laat zodanige arbeidsmiddelen gebruiken, dat de arbeid voor die werknemer
      geen gevaren met zich kan brengen voor haar veiligheid en gezondheid en geen terugslag kan veroorzaken op de
      zwangerschap of lactatie.

      2 Indien nakoming van het eerste lid redelijkerwijs niet mogelijk is, wordt door een tijdelijke aanpassing van de
      arbeid of door een tijdelijke aanpassing van de arbeids- en rusttijden voorkomen dat gevaar voor de veiligheid en
      gezondheid van de zwangere werknemer en de werknemer tijdens de lactatie wordt veroorzaakt, en wordt voorkomen dat
      een terugslag kan worden veroorzaakt op de zwangerschap of lactatie.

      3 Indien nakoming van het tweede lid redelijkerwijs niet mogelijk is, wordt aan de zwangere werknemer en de
      werknemer tijdens de lactatie tijdelijk andere arbeid gegeven.

      4 Indien nakoming van het derde lid redelijkerwijs niet mogelijk is, worden de zwangere werknemer en de werknemer
      tijdens de lactatie tijdelijk vrijgesteld van het verrichten van arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel45
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel1.42
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: 4:5
  - number: '1.43'
    text: |-
      1 Dit besluit is niet van toepassing op thuiswerk, tenzij uitdrukkelijk regels voor thuiswerk zijn gesteld.
      In dat laatste geval wordt onder werkgever mede verstaan thuiswerkgever en wordt onder werknemer mede verstaan
      thuiswerker.

      2 Indien een thuiswerker tevens een jeugdige werknemer is, zijn uitsluitend de bepalingen die voor de thuiswerker
      zijn vastgesteld van toepassing.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel1.43
  - number: '1.44'
    text: |-
      Van de thuiswerkers zijn gegevens beschikbaar omtrent naam, adres en woonplaats alsmede van de werkzaamheden die
      door de betreffende thuiswerkers worden verricht en van de stoffen, hulpmiddelen en werktuigen die daarbij worden
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel1.44
  - number: '1.45'
    text: |-
      Het is niet toegestaan aan de thuiswerker een grotere hoeveelheid aan grondstoffen, halffabrikaten en gerede
      producten in voorraad te geven of te laten houden dan voor de arbeid strikt noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel1.45
  - number: '1.46'
    text: |-
      Indien aan een thuiswerker in verband met het verrichten van arbeid een arbeidsongeval als bedoeld in
      [artikel 9, eerste lid, van de wet][ref1] overkomt, wordt door de thuiswerker hiervan onverwijld mededeling gedaan
      aan de thuiswerkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel9
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel1.46
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '9'
  - number: '2.1'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de gegevens die bij de schriftelijke
      mededeling van een arbeidsongeval, bedoeld in [artikel 9, eerste lid, van de wet][ref1] en de mededeling van een
      beroepsziekte, bedoeld in [artikel 9, derde lid, van de wet][ref2] worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel9
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '9'
  - number: '2.2'
    text: |-
      In deze afdeling wordt verstaan onder:

      a. gevaarlijke stof: brandbare, extreem toxische, toxische of ontplofbare stof;

      b. brandbare stof: een stof die een procestemperatuur heeft gelijk aan of hoger dan het vlampunt, bepaald met
      het toestel van Abel-Pensky voor vlampunten tot en met 65° C of bepaald met het toestel van Pensky-Martens voor
      vlampunten boven 65° C;

      c. extreem toxische stof:

      1°. een stof die acuut giftige eigenschappen bezit en daardoor gevaar voor de gezondheid kan opleveren bij een
      eenmalige betrekkelijk korte blootstelling, al dan niet met uitgestelde werking, en die als kenmerk heeft

        - dat de lethale concentratie 50 bij een blootstelling van de rat gedurende vier uur, kleiner is dan of gelijk is
      aan 20 milligram per kubieke meter, of
        - dat de lethale dosis 50 oraal bij toediening aan de rat, kleiner is dan of gelijk is aan 1 milligram per
      kilogram, of
        - dat de lethale dosis 50 percutaan bij toediening aan de rat, kleiner is dan of gelijk is aan 2 milligram per
      kilogram;

      2°. de volgende voor de mens carcinogene stoffen met een hoge potentie: 2-acetylaminofluoreen, 4-aminobifenyl,
      benzidine, bischloormethylether, dialkylnitrosaminen, 4-dimethylaminoazobenzeen, methylnitroso-ureum, 2-
      naftylamine, 4-nitrobifenyl en 3-nitronaftylamine;

      d. toxische stof: een stof, niet zijnde een extreem toxische stof, die acuut giftige eigenschappen bezit en
      daardoor gevaar voor de gezondheid kan opleveren bij een eenmalige betrekkelijk korte blootstelling, al dan niet
      met uitgestelde werking, en die als kenmerk heeft dat de lethale concentratie 50 bij een blootstelling van de rat
      gedurende één uur, kleiner is dan of gelijk is aan 20 000 milligram per kubieke meter;

      e. ontplofbare stof: een stof die op grond van de [Wet milieugevaarlijke stoffen][ref1] voldoet aan de criteria
      voor indeling in de categorie «ontplofbaar», bedoeld in [artikel 34, tweede lid, onder a, van die wet][ref2];

      f. installatie: een installatie voor bewerking of een installatie voor opslag;

      g. installatie voor bewerking: het stelsel van vaten, apparaten en leidingen dat ten aanzien van de omsloten stof
      een geheel vormt of kan vormen en dient voor de vervaardiging, bewerking, verwerking, verlading of vernietiging van
      deze stof;

      h. installatie voor opslag: de tanks, silo's, bunkers en verpakkingseenheden die dienen voor opslag met dien
      verstande, dat deze eenheden buiten de ruimtelijke begrenzing van een installatie voor bewerking zijn gelegen en
      waarbij wat betreft tanks, silo’s en bunkers elke eenheid als een op zich zelf staande installatie voor opslag moet
      worden beschouwd. Onder een installatie voor opslag worden mede begrepen voor het vervoer bestemde tanks en voor
      het vervoer van gevaarlijke stoffen bestemde verpakkingen;

      i. procestemperatuur: de temperatuur die bij opslag of bij bewerking onder normale bedrijfscondities maximaal kan
      worden bereikt;

      j. omhulling: een constructie die een installatie voor bewerking of opslag omsluit, die de natuurlijke ventilatie
      van de omsloten installatie bemoeilijkt of verhindert en waarbinnen door werknemers regelmatig arbeid wordt
      verricht;

      k. grenswaarde: de hoeveelheid van een stof, uitgedrukt in kilogrammen, die bij plotseling vrijkomen het leven of
      de gezondheid van een op globaal 100 meter afstand van het emissiepunt verblijvende werknemer nog kan bedreigen;

      l. zwaar ongeval: gebeurtenis als gevolg van onbeheersbare ontwikkelingen tijdens de bedrijfsuitoefening in een
      bedrijf of inrichting, waardoor hetzij onmiddellijk, hetzij na verloop van tijd ernstig gevaar voor de gezondheid
      van werknemers ontstaat en waarbij een of meer gevaarlijke stoffen zijn betrokken;

      m. scenario: de reeks van gebeurtenissen en omstandigheden die nodig zijn voor of leiden tot het vrijkomen van
      gevaarlijke stoffen, alsmede de reeks van gebeurtenissen die het effect weergeeft van het op deze wijze vrijkomen
      van gevaarlijke stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0003892
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel34
