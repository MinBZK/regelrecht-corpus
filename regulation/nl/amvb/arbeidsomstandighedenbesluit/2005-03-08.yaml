  - number: '1.31'
    text: |-
      Voor zover [de wet][ref1] van toepassing is op arbeid verricht door defensiepersoneel is
      [artikel 10 van de wet][ref2] op arbeid verricht door defensiepersoneel:

      a. dat belast is met enige politietaak of met bewakings- of beveiligingstaken, of

      b. dat wachtdiensten verricht, of

      c. dat is ingezet ter verlening van de bijstand, bedoeld in [artikel 1.29][ref3], onder *b*, aan de politie, van
      toepassing, voor zover een goede taakuitoefening door de toepassing van genoemd artikel niet wordt belemmerd.


      [ref1]: https://wetten.overheid.nl/BWBR0010346
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel10
