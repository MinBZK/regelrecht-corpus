  - number: '9.19'
    text: |-
      Geen vrijstelling of ontheffing wordt verleend van de voorschriften en verboden, bedoeld in de volgende artikelen
      en de daarop berustende bepalingen:

      a. van hoofdstuk 1: de [artikelen van de afdelingen 8][ref1] en [9][ref2];

      b. van hoofdstuk 2: de [artikelen van de afdelingen 5][ref3], [6][ref4] en [6a][ref5];

      c. van hoofdstuk 3: [artikel 3.1b][ref6], de [artikelen van paragraaf 2a van afdeling 1][ref7] en van de
      [afdelingen 2][ref8], [3][ref9], [3a][ref10], [3b][ref11] en [3c][ref12] en de [paragrafen 4][ref13] en
      [5 van afdeling 5][ref14];

      d. van hoofdstuk 4: [de artikelen van afdeling 1][ref15], met uitzondering van de [artikelen 4.3][ref16],
      [4.5][ref17], [4.7][ref18] en [4.8][ref19], de [artikelen van de afdelingen 2][ref20], [3][ref21] en
      [4][ref22], de artikelen van de [paragrafen 3][ref23], [4][ref24], [6][ref25] en [7 van afdeling 5][ref26], de
      [artikelen van de afdelingen 7][ref27], [8][ref28] en [9][ref29] en de [artikelen van de paragrafen 2][ref30] en
      [3 van afdeling 10][ref31];

      e. van hoofdstuk 5: de [artikelen van de afdelingen 1][ref32] en [2][ref33] en [artikel 5.14][ref34];

      f. van hoofdstuk 6: de [artikelen van de afdelingen 1][ref35] en [2][ref36],
      __REF002___________________________________________________________________________________________________________
      ___________, [afdeling 5a][ref38] en de [artikelen van de paragrafen 3][ref39] en [4 van afdeling 6][ref40];

      g. van hoofdstuk 7: de [artikelen van de afdelingen 2][ref41], [3][ref42], [4][ref43], met uitzondering van de
      [artikelen 7.17b, tweede lid, onder b][ref44], [7.20, zesde tot en met achtste lid][ref45], en [7.21][ref46]
      en de [artikelen van de afdeling 5][ref47], met uitzondering van [artikel 7.32][ref48], [afdeling 5a][ref49] en
      [paragraaf 2 van afdeling 6][ref50];

      h. van hoofdstuk 8: de [artikelen van de afdelingen 1][ref51] en [2][ref52];

      i. van hoofdstuk 9: de [artikelen 9.15][ref53] en [9.16][ref54].


