  - number: '4.55'
    text: |-
      1 Het in [artikel 4.54, vierde lid][ref1], bedoelde werkplan bevat:

      a. de maatregelen genoemd in [artikel 4.47, derde lid][ref2], alsmede, voor zover zulks redelijkerwijs uitvoerbaar
      is, de maatregel om eerst asbest of asbesthoudende producten dan wel crocidoliet of crocidoliethoudende producten
      te verwijderen alvorens andere slooptechnieken toe te passen;

      b. de maatregelen, bedoeld in de [artikelen 4.3a, aanhef en onder d][ref3],
      [4.6a, vierde lid, onder b, c en e, en vijfde lid][ref4], [4.18][ref5], [4.19, aanhef en onder b en c][ref6],
      [4.20, eerste tot en met vierde lid][ref7], [4.45, eerste en tweede lid, onder a, c en d][ref8], en [4.51][ref9];

      c. de voorzieningen die worden getroffen om de plaats waar de werkzaamheden worden verricht af te schermen van de
      overige ruimten;

      d. de maatregel om metingen te verrichten overeenkomstig het bepaalde krachtens [artikel 4.50, tweede lid][ref10],
      en om monsters te nemen overeenkomstig [artikel 4.50, achtste lid][ref11], nadat de ruimte is gereinigd,
      teneinde vast te stellen of de concentratie van asbeststof in de lucht niet hoger is dan 1/20 van de in
      [artikel 4.46, eerste lid][ref12], genoemde grenswaarde dan wel of de concentratie van crocidolietstof in de lucht
      niet hoger is dan 1/20 van de in [artikel 4.56, tweede lid][ref13], genoemde grenswaarde;

      e. een beschrijving van de aard, duur en plaats van de werkzaamheden alsmede van de werkmethode;

      f. een beschrijving van de werktuigen, machines, toestellen en overige hulpmiddelen die bij de werkzaamheden worden
      gebruikt;

      g. de naam van de in [artikel 4.54, vijfde lid][ref14], bedoelde persoon.

      2 Het slopen of het verwijderen van asbest of asbesthoudende producten dan wel van crocidoliet of van
      crocidoliethoudende producten wordt volgens het in het eerste lid bedoelde werkplan uitgevoerd.


