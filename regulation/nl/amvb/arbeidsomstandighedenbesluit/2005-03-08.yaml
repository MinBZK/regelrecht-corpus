  - number: 2.6a
    text: |-
      In deze afdeling en de daarop berustende bepalingen wordt verstaan onder:

      a. deskundigen: deskundige werknemers en andere deskundige personen als bedoeld in
      [artikel 14, eerste lid, van de wet][ref1], die werkzaam zijn in een arbodienst;

      b. interne arbodienst: een dienst als bedoeld in [artikel 14, derde lid, tweede volzin, van de wet][ref2],
      bestaande uit deskundige werknemers;

      c. externe arbodienst: een dienst als bedoeld in [artikel 14, derde lid, tweede volzin, van de wet][ref3],
      bestaande uit andere deskundige personen.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
