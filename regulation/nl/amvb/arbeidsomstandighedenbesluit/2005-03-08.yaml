  - number: '1.30'
    text: |-
      [Artikel 3, eerste lid, van de wet][ref1] en de op [artikel 16 van de wet][ref2] gebaseerde [artikelen 1.37][ref3]
      en [1.41][ref4], de [afdelingen 5][ref5] en [6 van hoofdstuk 2][ref6], de [hoofdstukken 3][ref7], [4][ref8],
      [5][ref9], [6][ref10] en [7][ref11] en de [afdelingen 1][ref12] en[ 2 van hoofdstuk 8][ref13] van dit besluit zijn
      niet van toepassing:

      a. tijdens, direct voor en direct na oefeningen;

      b. ten aanzien van militaire vaartuigen, militaire luchtvaartuigen, bemande wapensystemen en eenheden met
      gereedstelling:

      1°. voor zover afwijking van deze artikelen, hoofdstukken of afdelingen naar het oordeel van Onze Minister van
      Defensie noodzakelijk is in verband met de bouw, de constructie, de inrichting of de uitrusting van deze vaartuigen
      en wapensystemen;

      2°. indien oorlogsschepen varen en indien militaire luchtvaartuigen en bemande wapensystemen als zodanig in gebruik
      zijn;

      3°. voor zover de operationele taakuitvoering van deze vaartuigen en wapensystemen of van de eenheden met
      gereedstelling naar het oordeel van Onze Minister van Defensie door de toepassing van deze artikelen, hoofdstukken
      of afdelingen wordt belemmerd.


