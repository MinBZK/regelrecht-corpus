  - number: 2.5e
    text: |-
      1 In aanvulling op [artikel 14, derde lid, van de wet][ref1] houdt het verlenen van bijstand op grond van de wet in
      elk geval tevens in het verlenen van medewerking aan, waaronder mede begrepen het adviseren over:

      a. de vastlegging van het beleid als bedoeld in [artikel 2.5a, eerste lid][ref2];

      b. het opstellen van een veiligheidsbeheerssysteem als bedoeld in [artikel 2.5a, tweede lid][ref3];

      c. het verrichten en opstellen van een aanvullende risico-inventarisatie en -evaluatie als bedoeld in
      [artikel 2.5b, eerste lid, onder a][ref4], waaronder mede begrepen het toetsen ervan;

      d. het opstellen van de beschrijvingen, bedoeld in [artikel 2.5b, eerste lid, onder b, en derde lid][ref5];

      e. het opstellen van een intern noodplan als bedoeld in [artikel 2.5c][ref6], waaronder mede begrepen het toetsen
      ervan;

      f. het doorvoeren van de wijzigingen, bedoeld in [artikel 2.5d][ref7], waaronder mede begrepen, voor zover van
      toepassing, het toetsen ervan.

      2 Met betrekking tot de taken, bedoeld in het eerste lid, laat de werkgever zich bijstaan door een arbodienst.


