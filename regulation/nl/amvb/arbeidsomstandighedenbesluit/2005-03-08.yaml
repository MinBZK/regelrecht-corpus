  - number: '4.23'
    text: |-
      1 Het arbeidsgezondheidskundig onderzoek, bedoeld in [artikel 4.10a][ref1], vindt plaats met inachtneming van de
      praktische aanbevelingen, opgenomen in bijlage II bij de richtlijn.

      2 De arbodienst heeft recht op inzage in de in [artikel 4.15][ref2] bedoelde lijst van blootgestelde werknemers.
      Hem staan voorts alle gegevens ter beschikking die hij nodig heeft om de blootstelling van de werknemers aan
      kankerverwekkende of mutagene stoffen en kankerverwekkende processen te kunnen beoordelen en te kunnen adviseren
      over de periodiciteit en inhoud van het arbeidsgezondheidskundig onderzoek, bedoeld in het eerste lid, de te nemen
      preventieve maatregelen of persoonlijke beschermende maatregelen.


