  - number: '4.81'
    text: |-
      Deze afdeling is niet van toepassing op verven waarvan het pigment in de droge stof ten hoogste 2 gewichtsprocenten
      aan lood bevat.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.81
  - number: '4.82'
    text: 'Onder fosforlucifers wordt verstaan: lucifers waarin witte fosfor (CAS-nummer 12185–10–3) voorkomt.'
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.82
  - number: '4.83'
    text: |-
      1 Het is verboden fosforlucifers te vervaardigen.

      2 Het is verboden fosforlucifers in voorraad te houden, anders dan ten behoeve van doorvoer.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.83
  - number: '4.84'
    text: |-
      1 De [afdelingen 1 tot en met 8 van dit hoofdstuk][ref1] zijn niet van toepassing op biologische agentia.

      2 In deze afdeling wordt verstaan onder:

      a. biologische agentia: al dan niet genetisch gemodificeerde celculturen, menselijke endoparasieten en micro-
      organismen;

      b. celcultuur: het kunstmatig kweken van cellen van meercellige organismen;

      c. micro-organisme: een cellulaire of niet-cellulaire microbiologische entiteit met het vermogen tot
      vermenigvuldiging of tot overbrenging van genetisch materiaal;

      d. richtlijn: [richtlijn nr. 2000/54/EG](32000L0054) van het Europees Parlement en de Raad van de Europese Unie van
      18 september 2000 (Pb EG L 262) betreffende de bescherming van de werknemers tegen de risico's van blootstelling
      aan biologische agentia op het werk (zevende bijzondere richtlijn in de zin van artikel 16, lid 1, van [richtlijn
      nr. 89/391/EEG](31989L0391)).

      3 Voor de toepassing van deze afdeling worden biologische agentia in de volgende categorieën onderscheiden:

      a. categorie 1: een agens waarvan het onwaarschijnlijk is dat het bij de mens ziekten zal veroorzaken;

      b. categorie 2: een agens dat bij mensen een ziekte kan veroorzaken en een gevaar voor de veiligheid en de
      gezondheid van de werknemers kan opleveren, maar waarvan het onwaarschijnlijk is dat het zich onder de bevolking
      verspreidt, terwijl er een effectieve profylaxe of behandeling bestaat;

      c. categorie 3: een agens dat bij mensen een ernstige ziekten kan veroorzaken en een groot gevaar voor de
      veiligheid en de gezondheid van de werknemers kan opleveren en waarvan het waarschijnlijk is dat het zich onder de
      bevolking verspreidt, terwijl er een effectieve profylaxe of behandeling bestaat;

      d. categorie 4: een agens dat bij mensen ernstige ziekten veroorzaakt en een groot gevaar voor de veiligheid en
      de gezondheid van de werknemers oplevert en waarvan het zeer waarschijnlijk is dat het zich onder de bevolking
      verspreidt, terwijl geen effectieve profylaxe of behandeling bestaat.

      4 In deze afdeling wordt uitgegaan van de categorie-indeling van biologische agentia zoals vastgesteld in bijlage
      III bij de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.84
    references:
