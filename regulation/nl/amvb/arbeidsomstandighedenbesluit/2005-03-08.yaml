  - number: '4.44'
    text: |-
      De voorschriften van deze paragraaf zijn van toepassing, indien uit de beoordeling, bedoeld in
      [artikel 4.2, eerste lid][ref1], blijkt dat de concentratie van asbeststof in de lucht, waaraan werknemers in
      verband met de arbeid worden blootgesteld, lager is dan een van de volgende actieniveaus:

      a. 0,10 vezel per kubieke centimeter, berekend of gemeten over een referentieperiode van acht uur;

      b. een gecumuleerde dosis van 6,00 vezeldagen per kubieke centimeter, berekend of gemeten over een periode van
      drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.2
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.44
