        bwb_id: BWBR0010346
        artikel: '5'
  - number: 2.5c
    text: |-
      1 Ten behoeve van de planning voor noodsituaties wordt een intern noodplan opgesteld dat wordt gebaseerd op de
      risico-inventarisatie en -evaluatie, bedoeld in [artikel 2.5b, eerste lid][ref1], en de op grond hiervan getroffen
      maatregelen, bedoeld in [artikel 2.5b, tweede lid][ref2].

      2 Bij het opstellen van het intern noodplan wordt overleg gevoerd met de ondernemingsraad, de
      personeelsvertegenwoordiging, of, bij het ontbreken daarvan, met de belanghebbende werknemers.

      3 Het intern noodplan wordt ten minste eenmaal per drie jaar beproefd, geëvalueerd en indien nodig gewijzigd.

      4 De werkgever zorgt ervoor dat de bedrijfshulpverleners en de hulpverleningsorganisaties,
      bedoeld in [artikel 2.16][ref3], alsmede de werknemers, andere personen en diensten, bedoeld in
      [artikel 14, eerste lid, van de wet][ref4], desgewenst kennis kunnen nemen van het intern noodplan.

      5 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de gegevens die in het noodplan worden
      opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2.5b
