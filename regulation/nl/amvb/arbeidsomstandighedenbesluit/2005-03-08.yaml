  - number: 2.42g
    text: |-
      Op alle normaliter bemenste arbeidsplaatsen worden op gezette tijden veiligheidsoefeningen gehouden die erop
      gericht zijn:

      a. werknemers aan wie in noodgevallen concrete taken worden opgedragen, waarbij noodapparatuur moet worden
      gebruikt, gehanteerd of bediend, hierin te trainen en na te gaan of zij bekwaam zijn die taken te vervullen;

      b. alle bij de oefeningen gebruikte noodapparatuur te controleren, schoon te maken en zo nodig opnieuw op te laden
      of te vervangen en alle gebruikte draagbare apparatuur opnieuw naar de plaats te brengen waar zij zich normaliter
      bevindt;

      c. na te gaan of de reddingsvaartuigen gebruiksklaar zijn.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel2.42g
  - number: 2.42h
    text: |-
      1 De werknemers worden getraind in het uitvoeren van de handelingen die in noodgevallen moeten worden verricht.

      2 Op mijnbouwinstallaties waar werknemers langere tijd verblijven zijn bij helikopterbewegingen op het
      helikopterdek voldoende werknemers aanwezig die tot taak hebben bij noodgevallen in actie te komen. Deze werknemers
      zijn hiertoe voldoende getraind.

      3 In aanvulling op het eerste en tweede lid worden werknemers die werkzaam zijn op mijnbouwinstallaties ook
      getraind in het uitvoeren van de handelingen die op een specifieke arbeidsplaats moeten worden verricht. Deze
      handelingen worden voor de desbetreffende arbeidsplaats nader omschreven in het in [artikel 2.42][ref1] bedoelde
      veiligheids- en gezondheidsdocument.

      4 Werknemers die werkzaam zijn op mijnbouwinstallaties worden getraind in de toepassing van overlevingstechnieken,
      met inachtneming van de criteria die zijn vastgesteld in het in [artikel 2.42][ref2] bedoelde veiligheids- en
      gezondheidsdocument.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2.42
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2.42
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel2.42h
