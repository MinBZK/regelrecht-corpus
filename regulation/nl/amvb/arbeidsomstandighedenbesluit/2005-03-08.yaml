  - number: '2.33'
    text: |-
      Ten behoeve van een bouwplaats waar twee of meer werkgevers dan wel één werkgever en een of meer zelfstandig
      werkenden dan wel twee of meer zelfstandig werkenden arbeid gaan of doen verrichten in verband met de
      totstandbrenging van een bouwwerk, worden een of meer coördinatoren voor de uitvoeringsfase aangesteld.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel2.33
  - number: '2.34'
    text: |-
      De coördinator voor de uitvoeringsfase heeft tot taak om:

      a. de door werkgevers respectievelijk zelfstandig werkenden op grond van de [artikelen 2.38][ref1] en [2.39][ref2]
      te nemen maatregelen bij de technische of organisatorische keuzen in verband met de planning van de verschillende
      onderdelen van het bouwwerk of de fasen waarin het bouwwerk of de onderdelen daarvan tot stand worden gebracht,
      alsmede bij de raming van de duur van de uitvoering van deze onderdelen of fasen, te coördineren, opdat die
      werkgevers en, indien nodig ter bescherming van de veiligheid en gezondheid van de werknemers, zelfstandig
      werkenden op de bouwplaats, de betreffende maatregelen op samenhangende wijze toepassen;

      b. de samenwerking tussen de werkgevers die tegelijkertijd of elkaar opvolgend arbeid doen verrichten te
      organiseren en te coördineren als bedoeld in [artikel 2.27, eerste lid, onder f][ref3] en daarbij in voorkomende
      gevallen mede de op de bouwplaats werkzame zelfstandig werkenden te betrekken;

      c. het in [artikel 2.27, eerste lid, onder f][ref4] bedoelde toezicht te coördineren;

      d. de voorlichting van werknemers op de bouwplaats te coördineren;

      e. de nodige maatregelen te nemen opdat alleen bevoegde personen de bouwplaats kunnen betreden;

      f. ervoor te zorgen dat de gegevens, bedoeld in [artikel 2.27, eerste lid, onder b, d, f en g][ref5], voor zover
      nodig, in het veiligheids- en gezondheidsplan worden vermeld;

      g. ervoor te zorgen dat het veiligheids- en gezondheidsplan, bedoeld in [artikel 2.27][ref6], en het dossier,
      bedoeld in [artikel 2.30, onder c][ref7], worden aangepast indien de voortgang van het bouwwerk of de onderdelen
      daarvan daartoe aanleiding geven;

      h. zo nodig aanwijzingen te geven indien werkgevers of zelfstandig werkenden naar zijn oordeel niet of in
      onvoldoende mate of op onjuiste wijze uitvoering geven aan een samenhangende toepassing van hun verplichtingen als
      bedoeld onder *a* en *b*.


