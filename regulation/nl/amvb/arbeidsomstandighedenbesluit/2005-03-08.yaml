  - number: '4.37'
    text: |-
      1 In deze afdeling en de daarop berustende bepalingen wordt verstaan onder:

      a. asbest: stoffen die een of meer van de volgende vezelachtige silicaten bevatten:

      1°. actinoliet (Cas-nummer 77536–66–4);

      2°. amosiet (Cas-nummer 12172–73–5);

      3°. anthofylliet (Cas-nummer 77536–67–5);

      4°. chrysotiel (Cas-nummer 12001–29–5);

      5°. tremoliet (Cas-nummer 77536–68–6);

      b. crocidoliet: stoffen die het vezelachtige silicaat crocidoliet (Cas-nummer 12001–28–4) bevatten;

      c. asbesthoudende producten: producten die een of meer van de onder *a* genoemde vezelachtige silicaten bevatten;

      d. crocidoliethoudende producten: producten die het onder *b* genoemde vezelachtige silicaat bevatten;

      e. vezel: een deeltje dat langer is dan 5 micrometer, een breedte heeft van minder dan 3 micrometer en een lengte/
      breedteverhouding van meer dan 3/1.

      2 Stoffen of producten die zowel een of meer van de vezelachtige silicaten, bedoeld in het eerste lid, onder *a*,
      als het vezelachtige silicaat, bedoeld in het eerste lid, onder *b*, bevatten, worden voor de toepassing van dit
      besluit aangemerkt als crocidoliet respectievelijk als crocidoliethoudende producten.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.37
  - number: 4.37a
    text: |-
      Indien arbeid wordt verricht waarbij werknemers worden of kunnen worden blootgesteld aan asbest of asbesthoudende
      producten, crocidoliet of crocidoliethoudende producten, zijn naast de [afdelingen 1][ref1] en [2][ref2] van dit
      hoofdstuk, met inachtneming van de [artikelen 4.37b][ref3] en [4.37c][ref4], tevens deze afdeling van toepassing.


