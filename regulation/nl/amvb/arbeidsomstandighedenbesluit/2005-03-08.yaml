  - number: '4.47'
    text: |-
      1 Indien, gelet op de aard van de werkzaamheden, overschrijding van de in [artikel 4.46, eerste lid][ref1],
      genoemde grenswaarde kan worden verwacht en technische maatregelen ter beperking van de blootstelling van de
      werknemers redelijkerwijs niet uitvoerbaar zijn, mag tot het verrichten van deze werkzaamheden slechts worden
      overgegaan, indien doeltreffende maatregelen zijn genomen ter bescherming van de betrokken werknemers.

      2 De ondernemingsraad of de personeelsvertegenwoordiging of, bij het ontbreken daarvan, de belanghebbende
      werknemers wordt de gelegenheid gegeven een oordeel over de in het eerste lid bedoelde maatregelen kenbaar te
      maken.

      3 Tot de maatregelen, bedoeld in het eerste lid, behoren in ieder geval:

      a. het ter beschikking stellen van persoonlijke beschermingsmiddelen, waarbij de duur van het dragen daarvan tot
      het strikt noodzakelijke wordt beperkt;

      b. het aanbrengen van waarschuwingsborden die voldoen aan het bij of krachtens [afdeling 2 van hoofdstuk 8][ref2]
      bepaalde, ter aanduiding dat een overschrijding van de in [artikel 4.46, eerste lid][ref3], genoemde grenswaarde
      kan worden verwacht.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.46
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk8
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel4.46
