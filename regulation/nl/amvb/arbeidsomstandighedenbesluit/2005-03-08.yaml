  - number: '1.1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder wet:
      [Arbeidsomstandighedenwet 1998][ref1].

      2 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. bouwplaats: elke tijdelijke of mobiele arbeidsplaats waar civieltechnische werken of bouwwerken tot stand
      worden gebracht, waarvan een niet-uitputtende lijst is opgenomen in bijlage I bij de richtlijn, bedoeld in
      [artikel 2.23, onder a][ref2];

      b. bouwwerk: een civieltechnisch werk of bouwwerk als bedoeld onder a;

      c. opdrachtgever: degene voor wiens rekening een bouwwerk tot stand wordt gebracht;

      d. opdrachtgever-consument: de natuurlijke persoon die niet handelt in de uitoefening van een beroep of bedrijf,
      voor wiens rekening een bouwwerk tot stand wordt gebracht;

      e. ontwerpende partij: degene die zich jegens de opdrachtgever of de opdrachtgever-consument verbonden heeft om in
      het bouwproces de ontwerpende functie te vervullen;

      f. uitvoerende partij: degene die zich jegens de opdrachtgever of de opdrachtgever-consument verbonden heeft om in
      het bouwproces de uitvoerende functie te vervullen.

      3 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. arbeidsplaats in de winningsindustrie: iedere arbeidsplaats die direkt of indirekt verband houdt met de
      winningsindustrie in dagbouw, de ondergrondse winningsindustrie of de winningsindustrie die delfstoffen wint met
      behulp van boringen;

      b. delfstoffen: een natuurlijke concentratie of afzetting van ertsen, mineralen of substanties van organische
      oorsprong in of op de bodem, in vaste, vloeibare of gasvormige toestand, met inbegrip van op de bodem of
      onmiddellijk onder de oppervlakte daarvan aanwezige schelpen, grind, zand en klei;

      c. winningsindustrie in dagbouw: elke industrie die:

      1°. delfstoffen wint in de open lucht;

      2°. prospectiewerkzaamheden verricht met het oog op de winning van delfstoffen in de open lucht, of

      3°. delfstoffen gereed maakt voor de verkoop, met uitzondering van werkzaamheden in verband met de verwerking van
      deze delfstoffen;

      d. ondergrondse winningsindustrie: elke industrie die:

      1°. ondergronds delfstoffen wint anders dan door middel van boorgaten;

      2°. prospectiewerkzaamheden verricht met het oog op deze winning;

      3°. delfstoffen gereed maakt voor de verkoop, met uitzondering van werkzaamheden in verband met de verwerking van
      deze delfstoffen, of

      4°. stoffen opslaat als bedoeld in [artikel 1, onder i, van de Mijnbouwwet][ref3].

      e. winningsindustrie die delfstoffen wint met behulp van boringen:elke industrie die:

      1°. delfstoffen wint door middel van boorgaten;

      2°. prospectiewerkzaamheden verricht met het oog op deze winning;

      3°. delfstoffen gereed maakt voor de verkoop, met uitzondering van werkzaamheden in verband met de verwerking van
      deze delfstoffen;

      4°. stoffen opslaat als bedoeld in [artikel 1, onder i, van de Mijnbouwwet][ref4], of

      5°. aardwarmte opspoort of wint als bedoeld in [artikel 1, onder g en h, van de Mijnbouwwet][ref5].

      f. mijnbouwinstallatie: een installatie als bedoeld in [artikel 1, onder o, van de Mijnbouwwet][ref6].

      4 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. fysieke belasting: de door een werknemer in verband met de arbeid in te nemen werkhouding, uit te voeren
      bewegingen of uit te oefenen krachten, onder meer bestaande uit het zitten en staan of uit het tillen, duwen,
      trekken, dragen of op een andere wijze verplaatsen of ondersteunen van een of meer lasten;

      b. persoonlijk beschermingsmiddel: iedere uitrusting die bestemd is om door de werknemer gedragen of vastgehouden
      te worden teneinde hem te beschermen tegen een of meer gevaren die zijn veiligheid of gezondheid op het werk kunnen
      bedreigen alsmede alle aanvullingen of accessoires die daartoe kunnen bijdragen met uitzondering van:

      1°. gewone en uniforme werkkleding die niet specifiek bedoeld is om de veiligheid en de gezondheid van de werknemer
      te beschermen;

      2°. sportuitrusting;

      3°. zelfverdedigings- of afschrikkingsmateriaal, en

      4°. draagbare apparaten voor het opsporen en signaleren van gevaren en belastingsfactoren;

      c. veiligheids- of gezondheidssignalering: een signalering die, toegepast op een bepaald object, een bepaalde
      activiteit of een bepaalde situatie door middel van een bord, een kleur, een lichtsignaal, een akoestisch signaal,
      een mondelinge mededeling of een hand- of armsein een aanwijzing of een voorschrift verstrekt met betrekking tot de
      veiligheid of gezondheid op het werk.

      5 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. jeugdige werknemer: een werknemer jonger dan 18 jaar;

      b. zwangere werknemer: de werknemer die zwanger is en de werkgever hiervan in kennis heeft gesteld;

      c. werknemer tijdens de lactatie: de werknemer die haar kind borstvoeding geeft en haar werkgever hiervan in kennis
      heeft gesteld;

      d. thuiswerkgever:

      1°. de werkgever, bedoeld in [artikel 1, eerste lid, onder ][ref7], voor zover hij een ander in een woning arbeid
      doet verrichten;

      2°. de werkgever, bedoeld in [artikel 1, tweede lid, onderdeel a, onder 2°, van de wet][ref8], voor zover hij in
      het kader van de uitoefening van een beroep of bedrijf een ander krachtens een overeenkomst tot aanneming van werk
      of krachtens een overeenkomst van opdracht in een woning arbeid doet verrichten, tenzij die ander zelfstandig een
      beroep of bedrijf uitoefent waarin hij zich in de regel ook tegenover derden tot het verrichten van dergelijke
      arbeid verplicht;

      e. thuiswerker: de ander, bedoeld onder d;

      f. thuiswerk: de arbeid, bedoeld onder d;, met uitzondering van:

      1°. arbeid verricht aan of ten behoeve van het vervaardigen, veranderen, herstellen, versieren, afwerken of op een
      andere wijze tot gebruik geschikt maken of meer geschikt maken of geschikt houden van de woning;

      2°. arbeid van verplegende, verzorgende of huishoudelijke aard, geboden aan personen in verband met ziekte,
      herstel, ouderdom, gehandicapt zijn, overlijden, psycho-sociale en relationele problemen.

      6 In dit besluit en de daarop berustende bepalingen wordt verstaan onder certificerende instelling: een door Onze
      Minister krachtens [artikel 20, tweede lid, van de wet][ref9] aangewezen instelling die beslist over de afgifte van
      een certificaat als bedoeld in [artikel 20, eerste lid, van de wet][ref10].

      7 Waar in dit besluit de woorden «bedrijf» en «inrichting» worden gebruikt om een plaats aan te duiden, omvatten
      deze mede een andere plaats waar werknemers arbeid verrichten.


