  - number: 9.9a
    text: |-
      1 Als een strafbaar feit wordt aangemerkt de handeling of het nalaten in strijd met de voorschriften en verboden
      welke zijn opgenomen in de volgende artikelen:

      a. van hoofdstuk 2: de [artikelen 2.5a, eerste en tweede lid][ref1], [2.5b, eerste tot en met vierde lid][ref2],
      [2.5c, eerste, derde en vierde lid][ref3], [2.5d][ref4], [2.5e, tweede lid][ref5], [2.5f][ref6],
      [2.5g, eerste en tweede lid][ref7], [2.5h][ref8], [2.42e][ref9], en [2.42f, eerste en derde lid][ref10];

      b. van hoofdstuk 3: [3.37v][ref11].

      c. van hoofdstuk 4: de [artikelen 4.5, eerste en tweede lid][ref12], [4.6, eerste en tweede lid][ref13],
      [4.36, eerste en derde lid][ref14], [4.58][ref15], [4.59, eerste en tweede lid][ref16],
      [4.60, eerste en derde lid][ref17], [4.61, tweede lid][ref18], [4.78, eerste lid][ref19], [4.83][ref20],
      [4.105][ref21], [4.108][ref22], [4.109][ref23] en [4.110][ref24];

      d. van hoofdstuk 6: de [artikelen 6.27][ref25], [6.29][ref26] en [6.29a][ref27];

      e. van de [Arbeidsomstandighedenregeling][ref28]: de [artikelen 2.0][ref29], [2.0a][ref30], [2.0b][ref31],
      [2.0c][ref32] en [4.18, eerste en tweede lid][ref33].

      2 Voor zover van de artikelen, bedoeld in het eerste lid, ontheffing onder voorschriften is verleend, wordt de
      handeling of het nalaten in strijd met die voorschriften mede aangemerkt als een strafbaar feit.


