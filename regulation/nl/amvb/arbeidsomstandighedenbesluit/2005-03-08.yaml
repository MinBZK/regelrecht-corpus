  - number: '3.6'
    text: |-
      1 Doeltreffende maatregelen zijn genomen teneinde het mogelijk te maken dat de werknemer, indien een toestand
      ontstaat waarin direct gevaar voor zijn veiligheid of gezondheid aanwezig is, zich snel via de kortst mogelijke weg
      in veiligheid kan stellen.

      2 Het aantal, de plaats en de afmetingen van de daartoe beschikbare vluchtwegen en nooduitgangen zijn afhankelijk
      van het gebruik, de uitrusting en de afmetingen van de arbeidsplaatsen alsmede van het maximum aantal werknemers en
      andere personen dat zich op deze plaatsen kan ophouden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.6
  - number: '3.7'
    text: |-
      1 Vluchtwegen en nooduitgangen zijn vrij van obstakels.

      2 Nooduitgangen kunnen te allen tijde worden geopend.

      3 Deuren van nooduitgangen en deuren op het traject van de vluchtwegen zijn op eenvoudige wijze van binnen- uit
      naar buiten toe te openen.

      4 Schuif- en draaideuren worden niet als nooduitgang gebruikt.

      5 De vluchtwegen en nooduitgangen die bij het uitvallen van de verlichting slecht zichtbaar zijn, zijn voorzien van
      een adequate noodverlichting.

      6 De vluchtwegen, de deuren en poorten op het traject van de vluchtwegen alsmede de nooduitgangen zijn gemarkeerd
      door signalen die voldoen aan het bij of krachtens [afdeling 2 van hoofdstuk 8][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '8'
        afdeling: '2'
  - number: '3.8'
    text: |-
      1 In aanvulling op [afdeling 4 van hoofdstuk 2][ref1] zijn op arbeidsplaatsen, afhankelijk van de aard van de
      arbeid die daar wordt verricht, de daaraan verbonden gevaren en het maximum aantal werknemers en andere personen
      dat zich daar bevindt, voldoende passende brandbestrijdingsmiddelen aanwezig.

      2 Indien nodig zijn, in aanvulling op het eerste lid, branddetectoren en alarmsystemen aanwezig.

      3 Niet-automatische brandbestrijdingsmiddelen zijn gemakkelijk bereikbaar en gemakkelijk te bedienen.

      4 Niet-automatische brandbestrijdingsmiddelen zijn voorzien van een signalering die voldoet aan het bij of
      krachtens [afdeling 2 van hoofdstuk 8][ref2] bepaalde. De signalering is duurzaam en op de juiste plaats
      aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0008498
        hoofdstuk: '8'
        afdeling: '2'
  - number: '3.9'
    text: |-
      Arbeidsplaatsen waar werknemers bij het uitvallen van het kunstlicht aan bijzondere gevaren zijn blootgesteld,
      zijn voorzien van adequate noodverlichting. Indien noodverlichting niet mogelijk is, beschikken de werknemers over
      individuele verlichting.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.9
  - number: '3.10'
    text: |-
      Op arbeidsplaatsen waar gevaar voor verdrinking bestaat wordt dit gevaar zoveel mogelijk voorkomen en zijn
      doelmatige middelen voor het redden van drenkelingen op een goed zichtbare plaats beschikbaar.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.10
  - number: '3.11'
    text: |-
      1 Vloeren van arbeidsplaatsen zijn zo veel mogelijk vrij van oneffenheden en gevaarlijke hellingen en zijn voorts
      zo veel mogelijk vast, stabiel en stroef.

      2 Het oppervlak van vloeren, muren en plafonds van arbeidsplaatsen is zodanig, dat deze ten behoeve van de hygiëne
      op de arbeidsplaats kunnen worden schoongemaakt en onderhouden.

      3 Besloten ruimten waar arbeid wordt verricht zijn, rekening houdend met de aard van de werkzaamheden en de te
      leveren fysieke belasting, voldoende thermisch geïsoleerd.

      4 Transparante of lichtdoorlatende wanden van arbeidsplaatsen zijn, voor zover mogelijk in verband met de aard van
      de arbeidsplaats:

      a. duidelijk gemarkeerd en van veiligheidsmateriaal vervaardigd, of

      b. op een zodanige wijze aangebracht of afgeschermd dat de werknemers niet gewond kunnen raken.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.11
  - number: '3.12'
    text: |-
      1 Indien ramen, bovenlichtvoorzieningen en ventilatievoorzieningen geopend en gesloten kunnen worden,

      a. kan dit op veilige wijze geschieden,

      b. kunnen zij tevens op veilige wijze geregeld en vastgezet worden, en

      c. leveren zij in geopende stand geen gevaar op.

      2 Ramen en bovenlichtvoorzieningen kunnen zonder gevaar worden schoongemaakt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.12
  - number: '3.13'
    text: |-
      1 De plaats, het aantal en de afmeting van deuren, beweegbare hekken en andere doorgangen alsmede de materialen
      waarvan zij zijn vervaardigd, zijn afgestemd op de aard en het gebruik van de arbeidsplaats.

      2 Op transparante deuren is op ooghoogte een markering aangebracht.

      3 Afhankelijk van de aard van de arbeidsplaats en de arbeid die daar wordt verricht, zijn klapdeuren transparant of
      van transparante panelen voorzien.

      4 Indien deuren of andere doorgangen beschikken over transparante of lichtdoorlatende oppervlakten, zijn
      doeltreffende maatregelen genomen om te voorkomen dat werknemers door ongewild contact met die oppervlakten gewond
      raken.

      5 Deuren en beweegbare hekken die uit of van hun geleidingen kunnen raken zijn tegen uitlichten of aflopen dan wel
      tegen vallen geborgd.

      6 Automatische deuren en hekken functioneren zodanig dat zij geen gevaar opleveren. Zij zijn uitgerust met
      gemakkelijk herkenbare beveiligingen die voorkomen dat werknemers gewond raken.

      7 Automatische deuren en hekken kunnen met de hand worden geopend, tenzij ze bij een stroomstoring automatisch
      opengaan.

      8 In de onmiddellijke nabijheid van deuren, beweegbare hekken of andere doorgangen die hoofdzakelijk voor verkeer
      van voertuigen of transportmiddelen zijn bestemd, bevinden zich, tenzij de doorgang voor voetgangers veilig is,
      afzonderlijke doorgangen voor voetgangers.

      9 De in het achtste lid bedoelde doorgangen voor voetgangers zijn duidelijk zichtbaar gemarkeerd en vrij van
      obstakels.

      10 Kettingen of soortgelijke voorzieningen die worden gebruikt om te verhinderen dat een bepaalde ruimte wordt
      betreden, zijn goed zichtbaar en op doelmatige wijze voorzien van verbods- of waarschuwingsborden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.13
  - number: '3.14'
    text: |-
      1 De verbindingswegen op de arbeidsplaats zijn zodanig gelegen en ingericht dat zij op eenvoudige wijze, veilig en
      overeenkomstig hun bestemming, door voetgangers en voertuigen of transportmiddelen kunnen worden gebruikt.

      2 Voorkomen wordt dat werknemers die in de nabijheid van de verbindingswegen arbeid verrichten, gevaar lopen.

      3 De afmeting van de verbindingswegen is afgestemd op het aantal gebruikers en de aard van de arbeid die in het
      bedrijf of de inrichting wordt verricht.

      4 Indien op de verbindingswegen, voor zover het niet de openbare weg betreft, voertuigen of transportmiddelen
      worden gebruikt, zijn de nodige verkeersregels vastgesteld.

      5 In gevallen als bedoeld in het vierde lid, is tevens een veilige ruimte voor de voetgangers gewaarborgd of zijn
      andere doeltreffende maatregelen ter bescherming van de voetgangers genomen.

      6 De voor voertuigen of transportmiddelen bestemde verbindingswegen zijn gelegen op voldoende afstand van de
      overige verbindingswegen op de arbeidsplaats.

      7 Voor zover het gebruik of de inrichting van de arbeidsplaats zulks vereist, zijn de verbindingswegen duidelijk
      afgebakend.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.14
  - number: '3.15'
    text: |-
      1 De plaatsen waar door de aard van het werk gevaar, met inbegrip van valgevaar of gevaar voor vallende voorwerpen
      voorkomt of waar obstakels die niet verwijderd kunnen worden een gevaar voor de veiligheid vormen bij het
      verplaatsen van voertuigen of personen, worden duidelijk gemarkeerd door signalen die voldoen aan het bij of
      krachtens [afdeling 2 van hoofdstuk 8][ref1] bepaalde.

      2 Alleen werknemers die beroepshalve of uit hoofde van hun functie de in het eerste lid bedoelde plaatsen moeten
      betreden, worden daar toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '8'
        afdeling: '2'
  - number: '3.16'
    text: |-
      1 Bij het verrichten van arbeid waarbij valgevaar bestaat is zo mogelijk een veilige steiger, stelling, bordes
      of werkvloer aangebracht of is het gevaar tegengegaan door het aanbrengen van doelmatige hekwerken, leuningen of
      andere dergelijke voorzieningen.

      2 Het eerste lid is niet van toepassing op arbeid, die op veilige wijze op een ladder, trap of dergelijke kan
      worden verricht.

      3 Indien de in het eerste lid genoemde voorzieningen niet of slechts ten dele kunnen worden aangebracht of indien
      het aanbrengen of wegnemen daarvan grotere gevaren meebrengt dan de arbeid ter beveiliging waarvan zij zouden
      moeten dienen, zijn ter voorkoming van het gevaar voldoende sterke en voldoende grote vangnetten op doelmatige
      plaatsen en wijze aangebracht of worden doelmatige veiligheidsgordels met vanglijnen van voldoende sterkte gebruikt
      dan wel worden andere technische middelen toegepast, die ten minste een zelfde mate van beveiliging van de in het
      eerste lid bedoelde arbeid geven. Daarbij hebben maatregelen gericht op collectieve bescherming de voorrang boven
      maatregelen gericht op individuele bescherming.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.16
  - number: '3.17'
    text: |-
      Het gevaar te worden getroffen of geraakt door voorwerpen, producten of onderdelen daarvan dan wel vloeistoffen
      of gassen, of het gevaar bekneld te raken tussen voorwerpen, producten of onderdelen daarvan, wordt voorkomen
      en indien dat niet mogelijk is zoveel mogelijk beperkt. [Artikel 3.16, derde lid, laatste volzin][ref1], is van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3.16
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3.16'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '1'
  - number: '3.18'
    text: |-
      1 Roltrappen en -paden functioneren veilig en zijn uitgerust met de noodzakelijke veiligheidsvoorzieningen,
      waaronder begrepen gemakkelijk herkenbare en toegankelijke noodstopvoorzieningen.

      2 Laadplatforms en -hellingen zijn afgestemd op de afmetingen van de te vervoeren ladingen. Zij beschikken over ten
      minste één uitgang.

      3 Laadplatforms met een lengte van meer dan 50 meter hebben aan beide zijden een uitgang, tenzij dat technisch niet
      mogelijk is.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.18
  - number: '3.19'
    text: |-
      1 De afmetingen en het luchtvolume van de arbeidsplaats zijn zodanig dat de werknemer zonder gevaar voor de
      veiligheid of de gezondheid zijn arbeid kan verrichten.

      2 De afmetingen van de arbeidsplaats zijn zodanig dat de werknemer bij het verrichten van zijn arbeid over
      voldoende bewegingsruimte beschikt.

      3 Indien in verband met de aard van de arbeid niet aan het tweede lid kan worden voldaan, is in de nabijheid een
      andere open of besloten ruimte met voldoende bewegingsvrijheid voor de betrokken werknemers beschikbaar.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.19
  - number: '3.20'
    text: |-
      1 In het bedrijf of de inrichting of in de directe nabijheid daarvan is een gemakkelijk toegankelijke ruimte
      beschikbaar waar de werknemers de pauzes kunnen doorbrengen. Deze ruimte is daartoe geschikt alsmede, afhankelijk
      van het aantal werknemers, voldoende ruim bemeten en uitgerust met voldoende tafels en stoelen.

      2 In de ruimte, bedoeld in het eerste lid, zijn doeltreffende maatregelen genomen ter bescherming van de niet-
      rokers tegen hinder van tabaksrook.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.20
  - number: '3.21'
    text: |-
      Voor werknemers die gedurende de tijdsruimte, gelegen tussen het einde en het begin van de dagelijkse arbeidstijd,
      plegen te verblijven in het bedrijf of de inrichting waar zij werkzaam zijn, is een nachtverblijf beschikbaar. Een
      nachtverblijf is adequaat ingericht en is uitsluitend bestemd voor personen van gelijk geslacht.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.21
  - number: '3.22'
    text: |-
      1 Iedere werknemer beschikt over een plaats om zijn kleding op te hangen.

      2 Voor werknemers die speciale werkkleding moeten dragen zijn doelmatige, voldoende ruime, van stoelen of banken
      voorziene en naar seksen gescheiden kleedruimten beschikbaar; deze ruimten zijn zoveel mogelijk gelegen in de
      nabijheid van de open of besloten ruimten waar de arbeid pleegt te worden verricht. Natte werkkleding kan zo nodig
      worden gedroogd.

      3 In de kleedruimten kan kleding die de werknemers tijdens de arbeid niet dragen, op doelmatige wijze en afgesloten
      worden bewaard.

      4 Indien de omstandigheden zulks vereisen kunnen de speciale werkkleding en de persoonlijke kleding van de
      werknemers gescheiden van elkaar, op doelmatige wijze en afgesloten worden bewaard.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.22
  - number: '3.23'
    text: |-
      1 Indien werknemers bloot staan aan vuil of stof is een wasruimte met een voldoende aantal wasbakken aanwezig. De
      wasbakken zijn functioneel geplaatst en naar seksen gescheiden; ze beschikken over koud en zonodig warm stromend
      water.

      2 Indien werknemers zodanig bloot staan aan vuil, stof of hoge temperaturen dat een reiniging van het lichaam nodig
      is die meer omvat dan die van handen en gezicht of zulks uit de aard van hun arbeid of de zorg voor de gezondheid
      voortvloeit, is tevens een doucheruimte met een voldoende aantal douches aanwezig. De doucheruimte is voldoende
      ruim, doelmatig ingericht en naar seksen gescheiden; de douches beschikken over warm en koud stromend water.

      3 Indien de douche- of wasruimten en de kleedruimten zich niet in dezelfde ruimte bevinden, zijn deze onderling
      gemakkelijk en binnendoor bereikbaar.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.23
  - number: '3.24'
    text: |-
      1 In een bedrijf of inrichting waar werknemers werkzaam plegen te zijn, is voor de werknemers ten minste één toilet
      aanwezig.

      2 In een bedrijf of inrichting waar 10 of meer werknemers gelijktijdig werkzaam plegen te zijn, is voor iedere
      15 of minder werknemers van hetzelfde geslacht ten minste één toilet aanwezig. Voor mannen mag voor een deel met
      urinoirs worden volstaan mits er ten minste één toilet voor iedere 25 of minder mannen aanwezig is.

      3 De toiletten en urinoirs zijn doelmatig ingericht en goed geventileerd; zij bevinden zich in de nabijheid van de
      ruimten waar de werknemers hun werkzaamheden verrichten.

      4 In een bedrijf of inrichting waar 10 of meer werknemers gelijktijdig werkzaam plegen te zijn, zijn de toiletten
      naar seksen gescheiden.

      5 In of in de onmiddellijke nabijheid van de ruimten waarin de toiletten en urinoirs zich bevinden zijn voldoende
      wasbakken aanwezig. De wasbakken zijn doelmatig geplaatst en beschikken over stromend water.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.24
  - number: '3.25'
    text: |-
      1 Indien de aard van de arbeid of de daaraan verbonden gevaren dit noodzakelijk maken, zijn, in aanvulling op
      afdeling 4 van hoofdstuk 2, in het bedrijf of de inrichting voldoende eerste-hulpposten aanwezig.

      2 In de eerste-hulpposten zijn duidelijk zichtbare instructies voor eerste hulp bij ongevallen aanwezig.

      3 In de eerste-hulpposten is een alarmnummer duidelijk zichtbaar aangebracht.

      4 De eerste-hulpposten zijn voorzien van de noodzakelijke eerste-hulpuitrusting.

      5 De eerste-hulpposten zijn gemakkelijk met brancards bereikbaar.

      6 De eerste-hulpposten en de eerste-hulpuitrusting zijn voorzien van een signalering die voldoet aan het bij of
      krachtens afdeling 2 van hoofdstuk 8 bepaalde.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.25
  - number: '3.26'
    text: |-
      Op een bouwplaats zijn naast de voorschriften van afdeling 1 tevens de voorschriften van deze afdeling van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.26
  - number: '3.27'
    text: |-
      1 Een bouwplaats is gemarkeerd en afgebakend.

      2 Op een bouwplaats is voldoende drinkwater of andere alcoholvrije drank beschikbaar.

      3 Op een bouwplaats zijn zo nodig faciliteiten voor het bereiden van maaltijden beschikbaar.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.27
  - number: '3.28'
    text: |-
      1 Werkplekken op een bouwplaats die niet op de begane grond zijn gesitueerd, zijn stabiel en stevig,
      waarbij rekening wordt gehouden met het aantal werknemers dat zich daar bevindt, de maximale belasting en de
      verdeling daarvan alsmede met externe invloeden. Zonodig zijn ten behoeve van de stabiliteit doeltreffende
      bevestigingsmiddelen aangebracht.

      2 De stabiliteit en de stevigheid worden regelmatig en in ieder geval na iedere relevante verandering van de hoogte
      of de diepte van de in het eerste lid bedoelde werkplekken, doeltreffend gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.28
  - number: '3.29'
    text: |-
      1 Elektrische installaties die voor de aanvang van de werkzaamheden reeds op de bouwplaats aanwezig zijn, worden
      geïdentificeerd, gecontroleerd en duidelijk gekenmerkt.

      2 Bovengrondse elektriciteitsleidingen worden zoveel mogelijk buiten de bouwplaats om geleid of spanningsloos
      gemaakt. Indien dat niet mogelijk is worden hekken of waarschuwingsborden geplaatst.

      3 Indien voertuigen onder elektriciteitsleidingen door moeten rijden worden beschermingen onder de leidingen
      aangebracht.

      4 Ondergrondse elektriciteitsleidingen, leidingen voor andere distributiesystemen en kabels worden voor de aanvang
      van grondverzetwerkzaamheden geïdentificeerd.

      5 Doeltreffende maatregelen worden genomen om de gevaren voor werknemers die zijn verbonden aan beschadiging van de
      in het vierde lid bedoelde leidingen en kabels, zoveel mogelijk te voorkomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.29
  - number: '3.30'
    text: |-
      1 In een bouwput, een tunnel, bij een uitgraving of andere ondergrondse werkzaamheden worden doeltreffende stut- of
      taludvoorzieningen aangebracht ter voorkoming van instorting of overstroming.

      2 Bij grondverzetwerkzaamheden worden de uitgegraven aarde, het gebruikte materiaal en de daarbij gebruikte
      voertuigen op veilige afstand van de uitgraving gehouden. Zonodig wordt rond de uitgraving doeltreffend hekwerk
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.30
  - number: '3.31'
    text: |-
      1 Metaal- en betonconstructies alsmede de onderdelen daarvan, bekistingen, prefab-elementen of tijdelijke stutten
      en schoren worden slechts gemonteerd of gedemonteerd onder toezicht van een speciaal daartoe aangewezen persoon.

      2 Bekistingen, tijdelijke stutten en schoren kunnen zonder gevaar voor de werknemers de krachten dragen waaraan
      zij blootstaan.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.31
  - number: '3.32'
    text: |-
      1 Op een arbeidsplaats in de winningsindustrie zijn naast de voorschriften van [afdeling 1][ref1], met uitzondering
      van [paragraaf 2a van die afdeling][ref2], tevens de voorschriften van deze afdeling van toepassing.

      2 Deze afdeling is niet van toepassing op arbeid verricht in winningsindustrieën in dagbouw met behulp van
      baggermaterieel.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.32
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008498
        hoofdstuk: '3'
        paragraaf: 2a
        afdeling: '1'
  - number: '3.33'
    text: |-
      1 Voor iedere arbeidsplaats in de winningsindustrie zijn schriftelijke instructies opgesteld, waarin de regels
      zijn opgenomen die moeten worden nageleefd om de veiligheid en de gezondheid van de werknemers alsmede het veilig
      gebruik van de arbeidsmiddelen te garanderen. Deze instructies bevatten tevens aanwijzingen voor het gebruik van de
      noodapparatuur en de te volgen handelwijze in noodsituaties.

      2 De instructies zijn op een goed toegankelijke plaats voor de werknemers beschikbaar.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.33
  - number: '3.34'
    text: |-
      1 In zones waar gevaar voor verstikking, bedwelming of vergiftiging dan wel brand of explosie bestaat, zijn,
      overeenkomstig [artikel 4.6][ref1], de benodigde maatregelen genomen om dat gevaar te voorkomen.

      2 De in het eerste lid bedoelde maatregelen worden opgenomen in het veiligheids- en gezondheidsdocument, bedoeld in
      [artikel 2.42, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.6
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2.42
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.34
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4.6'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '2.42'
        hoofdstuk: '2'
        afdeling: '6'
  - number: '3.35'
    text: |-
      1 In aanvulling op afdeling 4 van hoofdstuk 2, zijn in zones waar gevaar voor verstikking, bedwelming of
      vergiftiging bestaat, doelmatige reanimatie-apparaten aanwezig.

      2 Op de arbeidsplaats in de winningsindustrie zijn voldoende werknemers aanwezig die de in het eerste lid genoemde
      apparaten kunnen bedienen.

      3 De reanimatie-apparaten worden doelmatig onderhouden en opgeslagen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.35
  - number: '3.36'
    text: |-
      In aanvulling op [afdeling 4 van hoofdstuk 2][ref1], worden de in die afdeling bedoelde maatregelen inzake
      het beperken en bestrijden van brand opgenomen in het veiligheids- en gezondheidsdocument, bedoeld in
      [artikel 2.42, tweede lid, van dit besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2.42
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.36
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '2.42'
        hoofdstuk: '2'
        afdeling: '6'
  - number: 3.36a
    text: |-
      Op een arbeidsplaats in de winningsindustrie in dagbouw zijn naast de voorschriften van
      [afdeling 3 van dit hoofdstuk][ref1] tevens de voorschriften van deze afdeling van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.36a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '3'
        afdeling: '3'
  - number: '3.37'
    text: |-
      1 Telkens voor de aanvang van werkzaamheden aan afgravings- of ontginningsfronten boven werkterreinen of
      verkeerswegen, wordt nagegaan of er geen instabiele massa’s of rotsblokken zijn. Losse steenblokken worden zo nodig
      verwijderd.

      2 Bij het ontginnen van fronten of steenhopen wordt gewaakt voor het ontstaan van instabiliteit.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.37
  - number: 3.37a
    text: |-
      Op een arbeidsplaats in de ondergrondse winningsindustrie zijn naast de voorschriften van
      [afdeling 3 van dit hoofdstuk][ref1] tevens de voorschriften van deze afdeling van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.37a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '3'
        afdeling: '3'
  - number: 3.37b
    text: |-
      1 Er worden plattegronden gemaakt en regelmatig bijgewerkt, waarop de galerijen en de ontginningswerkzaamheden
      en alle bekende factoren die van invloed kunnen zijn op de ontginning en de veiligheid daarvan zijn aangegeven op
      een schaal die een duidelijke voorstelling mogelijk maakt. De plattegronden zijn op de arbeidsplaats aanwezig en
      worden desgevraagd getoond aan een ambtenaar als bedoeld in [artikel 24 van de wet][ref1]. De plattegronden zijn
      gemakkelijk toegankelijk en worden zolang bewaard als met het oog op de veiligheid noodzakelijk is.

      2 In de galerijen is een bewegwijzering aangebracht, zodat de werknemers zich gemakkelijk kunnen oriënteren.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.37b
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 3.37c
    text: |-
      1 Iedere ondergrondse ontginning staat via ten minste twee afzonderlijke uitgangen met de oppervlakte in
      verbinding. Deze uitgangen zijn degelijk geconstrueerd en gemakkelijk toegankelijk voor de werknemers die
      ondergrondse werkzaamheden verrichten.

      2 Wanneer voor het gebruik van deze uitgangen een bijzondere krachtsinspanning nodig is, zijn zij uitgerust met
      mechanische transportmiddelen voor de werknemers.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.37c
  - number: 3.37d
    text: |-
      1 Transportinstallaties worden zodanig aangelegd, gebruikt en onderhouden, dat de veiligheid en de gezondheid van
      de werknemers die ze besturen of gebruiken, of zich in de nabijheid daarvan ophouden, gewaarborgd is.

      2 Bij vervoer van werknemers met mechanische transportmiddelen wordt gezorgd voor passende voorzieningen en
      speciale schriftelijke instructies.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.37d
  - number: 3.37e
    text: |-
      1 Zo spoedig mogelijk na het delven worden er ondersteuningen aangebracht, tenzij dit vanwege de stabiliteit van
      het terrein niet noodzakelijk is voor de veiligheid van de werknemers. Deze ondersteuningen worden volgens schema's
      en schriftelijke instructies aangebracht.

      2 Alle voor werknemers toegankelijke werkplekken worden regelmatig op de stabiliteit van het terrein onderzocht.

      3 Bij het onderhoud van de ondersteuningen wordt rekening gehouden met de uitkomsten van het in het tweede lid
      bedoelde onderzoek.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.37e
  - number: 3.37f
    text: |-
      1 In zones waar zich instortingen of waterdoorbraken kunnen voordoen, wordt een winningsprogramma opgesteld en
      uitgevoerd dat zoveel mogelijk gericht is op een veilig werksysteem en op de bescherming van de werknemers.

      2 Er worden maatregelen genomen om de zones, bedoeld in het eerste lid, te kunnen herkennen, om de werknemers die
      in of in de nabijheid van die zones werken te beschermen en om de risico's te beheersen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.37f
  - number: 3.37g
    text: |-
      1 Er worden maatregelen genomen om temperatuurstijgingen te voorkomen of vroegtijdig te signaleren.

      2 Het gebruik van brandbare materialen wordt tot het strikt noodzakelijke minimum beperkt.

      3 De te gebruiken hydraulische vloeistoffen zijn voorzover mogelijk moeilijk ontvlambaar en voldoen aan
      specificaties en beproevingsvoorwaarden betreffende de brandbaarheid ervan alsmede aan criteria betreffende de
      hygiëne. Indien de te gebruiken hydraulische vloeistoffen niet aan de in de eerste volzin gestelde eisen voldoen,
      worden aanvullende maatregelen genomen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.37g
  - number: 3.37h
    text: |-
      In aanvulling op [artikel 3.9][ref1] beschikt elke werknemer over een voor het werk geschikte lamp.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3.9
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.37h
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3.9'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '1'
  - number: 3.37i
    text: Het werk wordt zodanig georganiseerd dat op ieder moment kan worden vastgesteld wie er ondergronds is.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.37i
  - number: 3.37j
    text: |-
      Op een arbeidsplaats in de winningsindustrie die delfstoffen wint met behulp van boringen zijn naast de
      voorschriften van [afdeling 3 van dit hoofdstuk][ref1] tevens de voorschriften van deze afdeling van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.37j
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '3'
        afdeling: '3'
  - number: 3.37k
    text: |-
      1 In aanvulling op de [artikelen 3.2][ref1] en [3.3][ref2] zijn mijnbouwinstallaties zodanig ontworpen, gebouwd,
      ingericht, bediend, gecontroleerd en onderhouden dat zij aan de te verwachten omgevingskrachten weerstand kunnen
      bieden. Zij dienen een constructie en stevigheid te hebben die zijn afgestemd op het gebruik dat ervan wordt
      gemaakt.

      2 Op mijnbouwinstallaties worden zo nodig brandbarrières aangebracht met het oog op de afscheiding van zones waar
      brandrisico bestaat.

      3 Op mijnbouwinstallaties is op een voldoende aantal doelmatig gekozen plaatsen goed drinkwater aanwezig.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3.2
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel3.3
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.37k
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3.2'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '3.3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
  - number: 3.37l
    text: |-
      1 In aanvulling op [artikel 3.14][ref1] worden er:

      a. doeltreffende maatregelen genomen ter verzekering van een veilig verkeer en vervoer op een mijnbouwinstallatie
      alsmede van een veilig op en van een mijnbouwinstallatie brengen van materieel, van materialen en van personen;

      b. doeltreffende instructies gegeven ter verzekering van een veilig verkeer en vervoer op een mijnbouwinstallatie
      alsmede van een veilig op en van een mijnbouwinstallatie brengen van materieel, van materialen en van personen.

      2 Personen worden slechts door middel van een daartoe geëigend hulpmiddel op of van een mijnbouwinstallatie
      gebracht, indien zij met deze wijze van vervoer hebben ingestemd.

      3 In verband met het veilig gebruik van een helikopterdek op een mijnbouwinstallatie worden werknemers aangewezen,
      die belast zijn met het toezicht op dit gebruik van het helikopterdek en daartoe over de noodzakelijke vaardigheid
      en deskundigheid beschikken.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3.14
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.37l
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3.14'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '1'
  - number: 3.37m
    text: |-
      Doelmatige veiligheidsapparatuur staat steeds gebruiksklaar en wordt in goede staat gehouden. Bij het onderhoud
      daarvan wordt naar behoren rekening gehouden met de uitgeoefende activiteiten.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.37m
  - number: 3.37n
    text: |-
      1 Woon- en verblijfruimten op mijnbouwinstallaties hebben op elk niveau ten minste twee afzonderlijke
      nooduitgangen, die zo ver mogelijk van elkaar zijn gelegen en uitkomen in een veilige zone, een veilig verzamelpunt
      of een veilig evacuatiestation.

      2 Een machinekamer op een mijnbouwinstallatie heeft tenminste twee tegenover elkaar gelegen uitgangen met voldoende
      trap- of ladderverbindingen vanaf de vloer van die machinekamer.

      3 In afwijking van [artikel 3.7, vierde lid][ref1], zijn nooduitgangen op mijnbouwinstallaties voorzien van
      deuren die op eenvoudige wijze van binnenuit naar buiten toe zijn te openen of indien dit niet mogelijk is, van
      schuifdeuren.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3.7
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.37n
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3.7'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '1'
  - number: 3.37o
    text: |-
      Bij de inrichting van de arbeidsplaatsen op het continentaal plat, bedoeld in
      [artikel 1, onder c, van de Mijnbouwwet][ref1], wordt in voorkomend geval met gehandicapte werknemers rekening
      gehouden. Dit geldt met name voor deuren, verbindingswegen, trappen, doucheruimten, wasruimten, toiletten en
      werkplekken die door gehandicapte werknemers worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel1
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.37o
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '1'
  - number: 3.37p
    text: |-
      1 Arbeidsplaatsen waar door de aard van het werk gevarenzones, met inbegrip van valgevaar of gevaar voor vallende
      voorwerpen, voorkomen, worden zoveel mogelijk uitgerust met voorzieningen die beletten dat werknemers deze zones
      zonder toestemming betreden.

      2 Er worden doeltreffende maatregelen getroffen om de werknemers die de gevarenzones mogen betreden te beschermen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.37p
  - number: 3.37q
    text: |-
      1 Indien de veiligheid en de gezondheid van de werknemers dat vereisen wordt bepaalde apparatuur in geval van nood
      vanaf geschikte locaties op afstand bediend.

      2 De apparatuur, bedoeld in het eerste lid, omvat systemen voor het isoleren en afblazen van putten, installaties
      en pijpleidingen.

      3 Ten behoeve van de afstandsbediening, bedoeld in het eerste lid, zijn er controleposten op geschikte locaties die
      in geval van nood kunnen worden gebruikt, indien nodig met inbegrip van controleposten op veilige verzamelpunten en
      in evacuatiestations.

      4 De apparatuur, bedoeld in het eerste lid, omvat tenminste systemen voor ventilatie, het in noodgevallen afsluiten
      van apparatuur die een ontbranding zou kunnen veroorzaken, het voorkomen van het ontsnappen van ontvlambare
      vloeistoffen en gassen, brandbeveiliging en putbewaking.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.37q
  - number: 3.37r
    text: |-
      1 Indien de veiligheid en de gezondheid van de werknemers dat vereisen wordt iedere bemande arbeidsplaats uitgerust
      met:

      a. een audiovisueel systeem waarmee een alarmmelding zo nodig kan worden doorgestuurd naar elk bemand deel van
      de arbeidsplaats;

      b. een luidsprekersysteem, dat duidelijk kan worden gehoord in alle delen van de installatie waar zich vaak
      werknemers ophouden;

      c. een systeem waarmee de verbinding met het vasteland en de hulpdiensten kan worden onderhouden.

      2 Op mijnbouwinstallaties blijven de systemen, bedoeld in het eerste lid, in geval van nood operationeel.
      Het luidsprekersysteem wordt aangevuld met communicatiesystemen die niet afhankelijk zijn van kwetsbare
      stroomvoorzieningsinstallaties.

      3 De voorzieningen voor het slaan van alarm zijn op doelmatige plaatsen aangebracht.

      4 Indien werknemers aanwezig zijn op arbeidsplaatsen die normaliter niet door werknemers bemand zijn, is er een
      doelmatig communicatiesysteem.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.37r
  - number: 3.37s
    text: |-
      1 Indien de veiligheid en de gezondheid van de werknemers dat vereisen worden er verzamelpunten vastgesteld, wordt
      een monsterrol bijgehouden en worden de hiervoor noodzakelijke maatregelen getroffen.

      2 Doelmatige maatregelen worden genomen om:

      a. de evacuatiestations en de veilige verzamelpunten te beschermen tegen warmte en rook, en, zoveel mogelijk, tegen
      de gevolgen van explosies;

      b. de vluchtroutes van en naar de evacuatiestations en verzamelpunten te allen tijde bruikbaar te laten blijven;

      c. de evacuatiestations en de veilige verzamelpunten gemakkelijk bereikbaar te laten zijn vanuit de
      verblijfsaccommodatie en de werkruimten.

      3 De maatregelen, bedoeld in het tweede lid, zijn zodanig dat ze de werknemers lang genoeg bescherming bieden om,
      indien nodig, in alle veiligheid een evacuatie- en reddingsoperatie te kunnen organiseren en uitvoeren.

      4 Indien de veiligheid en de gezondheid van de werknemers dat vereisen, is een van de beschermde plaatsen, bedoeld
      in het eerste lid, voorzien van afstandbedieningssystemen voor noodgevallen als bedoeld in [artikel 3.37q][ref1] en
      van een communicatiesysteem als bedoeld in [artikel 3.37r, eerste lid, onder c][ref2].

      5 Op een mijnbouwinstallatie wordt voor elk veilig verzamelpunt een lijst opgesteld, bijgehouden en ter plaatse
      aangeplakt met de namen van de werknemers voor wie dat verzamelpunt is bestemd.

      6 Een lijst met de namen van de werknemers die in geval van nood speciale taken hebben wordt opgesteld en
      bijgehouden en op doelmatige plaatsen aangeplakt. De namen van deze werknemers worden eveneens vermeld in de
      schriftelijke instructies, bedoeld in [artikel 3.33][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3.37q
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel3.37r
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel3.33
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.37s
