  - number: '6.14'
    text: |-
      Duikarbeid, caissonarbeid en overige arbeid onder overdruk worden verricht door een persoon, die in een zodanige
      lichamelijke en geestelijke toestand verkeert, dat hij in staat is de gevaren, die zijn verbonden aan de door hem
      te verrichten arbeid, te onderkennen en zo mogelijk te voorkomen of te beperken.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel6.14
  - number: 6.14a
    text: |-
      1 Personen, die worden belast met het verrichten van duikarbeid, caissonarbeid en overige arbeid onder overdruk
      worden voor de aanvang van die arbeid onderworpen aan een arbeidsgezondheidskundig onderzoek, dat gericht is op de
      bijzondere gevaren voor de gezondheid, waaraan zij bij de uitoefening van die arbeid kunnen blootstaan.

      2 Na een periode van ten hoogste twaalf maanden na het onderzoek, bedoeld in het eerste lid, wordt het
      arbeidsgezondheidskundig onderzoek herhaald en vervolgens telkens met een tussenperiode van ten hoogste twaalf
      maanden sinds het voorafgaande onderzoek.

      3 Het arbeidsgezondheidskundig onderzoek, bedoeld in het eerste en tweede lid, wordt uitgevoerd door een arts,
      die in het bezit is van een certificaat duikerarts, dat is afgegeven door Onze Minister of een certificerende
      instelling.

      4 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de uitvoering van het
      arbeidsgezondheidskundig onderzoek. Deze regels kunnen betrekking hebben op:

      a. de gegevens, die bij het onderzoek worden overgelegd;

      b. de wijze waarop het onderzoek wordt uitgevoerd;

      c. de wijze van beoordeling van de geschiktheid of ongeschiktheid van personen voor het verrichten van duikarbeid,
      caissonarbeid of overige arbeid onder overdruk;

      d. de wijze van registratie, verwerking en bewaring, alsmede de tijdsduur van bewaring van de uit het onderzoek
      verkregen gegevens.

      5 Een persoon verricht slechts duikarbeid, caissonarbeid of overige arbeid onder overdruk indien uit het
      arbeidsgezondheidskundig onderzoek blijkt, dat het verrichten van die arbeid op medische gronden toelaatbaar
      is. Indien uit de uitslag van het arbeidsgezondheidskundig onderzoek blijkt dat het verrichten van duikarbeid,
      caissonarbeid of overige arbeid onder overdruk slechts onder de daarin aangegeven beperkende voorschriften
      toelaatbaar is, worden deze voorschriften in acht genomen.

      6 Op verzoek van de werkgever of de onderzochte persoon wordt het in dit artikel bedoelde onderzoek één maal
      opnieuw uitgevoerd door een andere arts, die in het bezit is van een certificaat duikerarts als bedoeld in het
      derde lid. Het resultaat van het hernieuwde onderzoek treedt in de plaats van het daaraan voorafgaande.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel6.14a
  - number: 6.14b
    text: |-
      1 In verband met de uitvoering van arbeidsgezondheidskundige onderzoeken als bedoeld in
      [artikel 6.14a, eerste en tweede lid][ref1], kunnen voor de afgifte van het certificaat duikerarts, bedoeld
      in [artikel 6.14a, derde lid][ref2], bij ministeriële regeling verschillende vakbekwaamheids-, opleidings- of
      registratie-eisen worden gesteld.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de gelijkstelling
      van in het buitenland afgegeven certificaten duikerarts met het certificaat duikerarts, bedoeld in
      [artikel 6.14a, derde lid][ref3].


