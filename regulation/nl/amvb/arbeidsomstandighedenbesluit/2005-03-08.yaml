  - number: 3.5f
    text: |-
      Voor zover uit de resultaten van de beoordeling, bedoeld in [artikel 3.5c, eerste lid][ref1], hiertoe de noodzaak
      is gebleken, worden in aanvulling op [artikel 3.5e][ref2] de volgende maatregelen genomen:

      a. schriftelijke instructies worden verstrekt met betrekking tot de uitvoering van de arbeid;

      b. voor de aanvang van arbeid dat gevaar kan opleveren, wordt toestemming verleend door een daartoe bevoegde
      persoon om deze arbeid te verrichten;

      c. apparaten en beveiligingssystemen worden, wanneer stroomuitval extra gevaren teweeg kan brengen, onafhankelijk
      van de rest van de installatie, bij stroomuitval in een veilige bedrijfstoestand gehandhaafd;

      d. automatisch gestuurde apparaten en beveiligingssystemen die van de voorziene bedrijfsomstandigheden afwijken,
      worden zonder gevaar manueel uitgeschakeld. Deze ingrepen worden door bevoegde werknemers uitgevoerd;

      e. indien de noodstopinrichtingen in werking worden gesteld, wordt de opgeslagen energie zo snel en zo veilig
      mogelijk afgevoerd of geïsoleerd, zodat zij niet langer een bron van gevaar vormt;

      f. vluchtmiddelen worden beschikbaar en gebruiksklaar gehouden zodat werknemers de gevaarlijke gebieden snel en
      veilig kunnen verlaten.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3.5c
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel3.5e
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.5f
