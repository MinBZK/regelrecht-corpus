  - number: '4.6'
    text: |-
      1 Indien kan worden vermoed dat werknemers bij verblijf op een plaats of in een ruimte kunnen worden blootgesteld
      aan stoffen in een zodanige mate dat daardoor gevaar bestaat voor verstikking, bedwelming of vergiftiging dan wel
      brand of explosie, mag een werknemer zich niet op die plaats of in die ruimte begeven voordat uit een adequaat
      onderzoek is gebleken of dat gevaar aanwezig is.

      2 Indien uit het onderzoek, bedoeld in het eerste lid, blijkt dat het gevaar voor verstikking, bedwelming,
      vergiftiging, brand of explosie aanwezig is, worden doeltreffende maatregelen genomen zodat de werknemers die
      plaats of die ruimte zonder genoemde gevaren kunnen betreden.

      3 Indien op een plaats of in een ruimte als bedoeld in het eerste lid, direct gevaar ontstaat, worden doeltreffende
      maatregelen genomen zodat de werknemers die deze plaats of deze ruimte hebben betreden, deze terstond kunnen
      verlaten. Indien dat niet mogelijk is en het toch noodzakelijk is om die plaats of die ruimte te betreden, dan
      mag dit alleen indien arbeidsmiddelen worden gebruikt die het desbetreffende gevaar niet zelf kunnen veroorzaken
      alsmede persoonlijke beschermingsmiddelen beschikbaar worden gesteld en gebruikt. Zo nodig worden de werknemers die
      de plaats op of de ruimte moeten betreden, permanent van buitenaf geobserveerd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.6
  - number: 4.6a
    text: |-
      1 Voor zover uit de resultaten van de beoordeling, bedoeld in [artikel 4.2][ref1], blijkt dat er gevaar voor de
      veiligheid of de gezondheid van de werknemers bestaat, zijn in aanvulling op [afdeling 4 van hoofdstuk 2][ref2]
      doeltreffende procedures opgesteld die in werking treden indien zich een ongewilde gebeurtenis als bedoeld in
      [artikel 4.4, eerste, respectievelijk tweede lid][ref3] voordoet.

      2 De procedures, bedoeld in het eerste lid, worden opgenomen in de risico-inventarisatie en -evaluatie, bedoeld in
      [artikel 5 van de wet][ref4].

      3 Op grond van de procedures, bedoeld in het eerste lid, zijn zodanige technische of organisatorische maatregelen
      genomen, dat wanneer zich een ongewilde gebeurtenis voordoet de gevolgen hiervan zoveel mogelijk worden beperkt.

      4 Ter naleving van het derde lid worden in ieder geval de volgende maatregelen genomen:

      a. er worden onmiddellijk doeltreffende maatregelen genomen om de gevolgen van een ongewilde gebeurtenis zoveel
      mogelijk te beperken en wordt zo spoedig mogelijk zorg gedragen voor het herstel van de veilige toestand;

      b. de werknemers worden onverwijld ingelicht over de ongewilde gebeurtenis en wordt er zorg voor gedragen dat zij
      zich verwijderen uit de getroffen zone;

      c. betreden uitsluitend de werknemers of andere personen, belast met het uitvoeren van de noodzakelijke
      herstelwerkzaamheden, met gebruik van doeltreffende middelen en persoonlijke beschermingsmiddelen, de getroffen
      zone. Deze werknemers en andere personen zijn niet langer dan strikt noodzakelijk voor het herstel van de veilige
      toestand in de desbetreffende zone aanwezig;

      d. zijn in aanvulling op [afdeling 4 van hoofdstuk 2][ref5] doeltreffende waarschuwings- en andere
      communicatiesystemen beschikbaar ten behoeve van de signalering van een toegenomen risico voor de veiligheid en
      gezondheid en die voldoen aan het bepaalde bij of krachtens [afdeling 2 van hoofdstuk 8][ref6];

      e. voorkomen wordt dat anderen dan de personen, bedoeld in onderdeel c, de getroffen zone betreden.

      5 Indien zich een ongewilde gebeurtenis voordoet, wordt de ondernemingsraad of de personeelsvertegenwoordiging
      of worden, bij het ontbreken daarvan, de belanghebbende werknemers, zo spoedig mogelijk in kennis gesteld
      van de oorzaken van de ongewilde gebeurtenis, de hoogte van het blootstellingsniveau als bedoeld in
      [artikel 4.2, derde lid][ref7], en van de maatregelen die worden genomen om de oorzaken weg te nemen en
      blootstelling zoveel mogelijk te voorkomen of te beperken.

      6 De werkgever zorgt ervoor dat bedrijfshulpverleners en hulpverleningsorganisaties als bedoeld
      in [artikel 2.16][ref8] alsmede de werknemers, andere personen en diensten als bedoeld in
      [artikel 14, eerste lid, van de wet][ref9], desgewenst kennis kunnen nemen van de maatregelen, bedoeld in het
      vierde lid.

      7 De informatie over de maatregelen, bedoeld in het zesde lid, omvat in ieder geval:

      a. een beschrijving van de gevaren op grond van de beoordeling, bedoeld in [artikel 4.2][ref10];

      b. een beschrijving van de redelijkerwijs voorzienbare specifieke gevaren op grond van de beoordeling, bedoeld in
      [artikel 4.2][ref11], die kunnen ontstaan bij een ongewilde gebeurtenis;

      c. een beschrijving van de voorzieningen die zijn getroffen ter naleving van
      [artikel 4.4, eerste, tweede en vierde lid][ref12];

      d. een omschrijving van de procedures, bedoeld in het eerste lid.


