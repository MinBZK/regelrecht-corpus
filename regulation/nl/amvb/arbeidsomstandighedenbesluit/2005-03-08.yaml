  - number: '6.15'
    text: |-
      1 Indien duikarbeid, caissonarbeid en overige arbeid onder overdruk worden verricht, is met inachtneming van de
      stand van de techniek en rekening houdende met de specifiek te verrichten arbeid:

      a. nabij de plaats waar de arbeid wordt verricht een deugdelijke schriftelijke werkinstructie aanwezig die ten
      minste de door de werknemers te treffen veiligheidsvoorzieningen alsmede de noodprocedures bevat;

      b. aan de werknemers deugdelijk materieel dat in goede staat verkeert en voldoende ademgas van goede kwaliteit ter
      beschikking gesteld;

      c. nabij de plaats waar de arbeid wordt verricht een daartoe opgeleid persoon aanwezig die de werknemers adequaat
      medisch begeleiden kan;

      d. nabij de plaats waar de arbeid wordt verricht een adequate eerste-hulpuitrusting aanwezig.

      2 De in het eerste lid, onder *c*, bedoelde persoon kan terstond in contact treden met een arts als bedoeld in
      [artikel 6.14a, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6.14a
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel6.15
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: 6.14a
        hoofdstuk: '6'
        afdeling: '5'
  - number: '6.16'
    text: |-
      1 Duikarbeid wordt verricht door een of meer duikers die worden bijgestaan door een reserveduiker en een
      ploegleider.

      2 De reserveduiker verricht slechts duikarbeid bestaande uit het verlenen van hulp aan en het redden van in
      moeilijkheden geraakte duikers. Bij het gebruik van een duikklok is de reserveduiker in de klok aanwezig.

      3 De ploegleider is in het bezit van een certificaat duikploegleider, dat is afgegeven door Onze Minister of een
      certificerende instelling.

      4 In afwijking van het eerste lid, mag de ploegleider tevens als reserveduiker optreden, indien duikarbeid wordt
      verricht in een vloeistof die in overwegende mate uit water bestaat met een maximaal bereikbare diepte van 9 meter
      en een maximale stroomsnelheid van 0,5 meter per seconde en waarbij geen voorzienbare kans bestaat dat de duikers
      in die vloeistof in moeilijkheden raken.

      5 Een ieder die duikarbeid heeft verricht, houdt hiervan aantekening in een persoonlijk duiklogboek. In dit
      logboek worden, naast de aard van de duikarbeid, ten minste het gevolgde duikschema inclusief het gevolgde
      decompressieverloop alsmede de verblijftijd in de vloeistof aangetekend.

      6 De duikers en de reserveduiker zijn in het bezit van een certificaat duikarbeid met betrekking tot de soort
      arbeid die zij verrichten, dat is afgegeven door Onze Minister of een certificerende instelling.

      7 Indien duikarbeid wordt verricht is de persoon, bedoeld in [artikel 6.15, eerste lid, onder c][ref1], in het
      bezit van een certificaat duikmedische begeleiding, dat is afgegeven door Onze Minister of een certificerende
      instelling.

      8 Het certificaat duikploegleider, het certificaat duikarbeid en het certificaat duikmedische begeleiding, bedoeld
      in het derde respectievelijk het zesde en zevende lid, of afschriften daarvan zijn op de arbeidsplaats aanwezig en
      worden desgevraagd getoond aan een ambtenaar als bedoeld in [artikel 24 van de wet][ref2].

      9 Het zesde lid is niet van toepassing op degene die in het kader van een opleiding tot duiker duikarbeid verricht,
      mits dit gebeurt onder toezicht van een persoon die in het bezit is van een certificaat als bedoeld in dat lid.

      10 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de gelijkstelling van in het
      buitenland afgegeven certificaten duikploegleider, certificaten duikarbeid of certificaten duikmedische begeleiding
      met de certificaten, bedoeld in het derde respectievelijk zesde en zevende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6.15
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel6.16
