  - number: 1.5d
    text: |-
      1 Een aanvraag om aanwijzing gaat vergezeld van het bewijs dat is voldaan aan de criteria, bedoeld in
      [artikel 1.5a][ref1], dan wel van een verklaring waaruit de bereidheid blijkt om voor eigen rekening een onderzoek
      naar het voldoen aan deze criteria te ondergaan.

      2 Een aanwijzing kan worden geweigerd dan wel worden ingetrokken indien niet of niet volledig is voldaan aan de bij
      de wet of bij of krachtens deze afdeling gestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1.5a
