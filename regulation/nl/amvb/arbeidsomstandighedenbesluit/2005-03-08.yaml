  - number: '6.17'
    text: |-
      1 Duikarbeid die wordt verricht,

      a. op een diepte groter dan 9 meter;

      b. bij een stroomsnelheid groter dan 0,5 meter per seconde;

      c. met voorgenomen decompressie;

      d. met een ademgas anders dan lucht;

      e. over een periode langer dan een week, of

      f. ten behoeve van de ondergrondse winningsindustrie of de winningsindustrie die delfstoffen wint met behulp van
      boringen, wordt ten minste vijf werkdagen vóór de aanvang ervan schriftelijk gemeld bij een daartoe aangewezen
      ambtenaar als bedoeld in [artikel 24 van de wet][ref1] onder opgaaf van de plaats waar de arbeid zal worden
      verricht, het tijdstip waarop deze zal aanvangen, het vermoedelijke aantal betrokken werknemers en het aantal
      werknemers dat daadwerkelijk duikarbeid zal verrichten.

      2 Indien de periode tussen de opdracht tot het verrichten van duikarbeid als bedoeld in het eerste lid en de
      uitvoering ervan wegens het onvoorziene en spoedeisende karakter van de duikarbeid korter is dan vijf werkdagen,
      dan wordt de duikarbeid zo spoedig mogelijk bij de ambtenaar, bedoeld in het eerste lid, gemeld.

      3 De in het eerste lid bedoelde schriftelijke melding gaat in geval van duikarbeid ten behoeve van de ondergrondse
      winningsindustrie of de winningsindustrie die delfstoffen wint met behulp van boringen, vergezeld van informatie
      over de veiligheids- en gezondheidsrisico's van de duiklocatie.

      4 Het eerste lid is niet van toepassing op arbeid die in het kader van een opleiding tot duiker wordt verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel6.17
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: '6.18'
    text: |-
      1 Bij de plaats waar duikarbeid in water wordt verricht op een diepte van meer dan 15 m of in een andere vloeistof
      onder een hogere druk dan 1,5.105 Pa boven de atmosferische druk, is een geschikte compressiekamer, voorzien van
      een personen- en medicijnsluis, aanwezig.

      2 Onverminderd het eerste lid is bij de plaats waar duikarbeid wordt verricht een compressiekamer aanwezig indien
      de reistijd tussen de duiklocatie en de dichtstbijzijnde behandelfaciliteit met compressiekamer meer dan 2 uur
      bedraagt.

      3 De compressiekamer, bedoeld in het eerste lid:

      a. heeft een omvang en een inrichting die zijn afgestemd op het aantal personen dat duikarbeid verricht en de aard
      van de werkzaamheden, en

      b. biedt ten minste plaats aan twee personen.

      4 De compressiekamer wordt op de juiste wijze gebruikt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel6.18
  - number: '6.19'
    text: |-
      1 Caissonarbeid wordt door ten minste twee personen verricht.

      2 Ten minste 30 dagen vóór het verrichten van caissonarbeid wordt een daartoe aangewezen ambtenaar als bedoeld
      in [artikel 24 van de wet][ref1] hiervan schriftelijk in kennis gesteld, onder overlegging van een deugdelijk
      werkplan.

      3 Een caisson wordt gebouwd, geïnstalleerd, aangepast of gedemonteerd onder toezicht van een speciaal daarvoor
      aangewezen persoon.

      4 Caissons worden regelmatig door een speciaal daarvoor aangewezen persoon geïnspecteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel6.19
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: '6.20'
    text: |-
      1 Bij de plaats waar caissonarbeid wordt verricht onder een hogere druk dan 1,5.105 Pa boven de atmosferische druk,
      is een geschikte compressiekamer, voorzien van een personen- en medicijnsluis, aanwezig.

      2 Onverminderd het eerste lid is bij de plaats waar caissonarbeid wordt verricht een compressiekamer aanwezig
      indien de reistijd tussen die plaats en de dichtstbijzijnde behandelfaciliteit met compressiekamer meer dan 2 uur
      bedraagt.

      3 De compressiekamer, bedoeld in het eerste lid:

      a. heeft een omvang en een inrichting die zijn afgestemd op het aantal personen dat caissonarbeid verricht en de
      aard van de werkzaamheden, en

      b. biedt ten minste plaats aan twee personen.

      4 De compressiekamer wordt op de juiste wijze gebruikt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel6.20
  - number: 6.20a
    text: |-
      Op een arbeidsplaats in de ondergrondse winningsindustrie zijn naast de voorschriften van de
      [afdelingen 1 tot en met 5 van dit hoofdstuk][ref1] tevens de voorschriften van deze afdeling van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel6.20a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '6'
        afdeling: '1'
  - number: 6.20b
    text: |-
      1 Alle normaal toegankelijke ondergrondse werkterreinen worden behoorlijk geventileerd. Door middel van een
      permanente ventilatie wordt, met een voldoende veiligheidsmarge, gezorgd voor een atmosfeer:

      a. die gezond is;

      b. waarin het explosiegevaar en het gevaar voor stofdeeltjes die ingeademd kunnen worden, onder controle wordt
      gehouden;

      c. waarin de arbeidsomstandigheden tijdens de werktijd adequaat zijn, gelet op de gebruikte werkmethoden en de
      fysieke belasting van de werknemers.

      2 Indien de natuurlijke ventilatie niet aan het eerste lid voldoet wordt de hoofdventilatie door een of meer
      mechanische ventilatoren verzorgd. Er worden maatregelen getroffen om een constante en continue ventilatie
      te garanderen. De onderdruk van de hoofdventilatoren wordt voortdurend gecontroleerd. Er is een automatische
      alarmering voor het geval de hoofdventilatoren onverwacht uitvallen.

      3 De parameters van de ventilatie worden:

      a. regelmatig gemeten; en

      b. de resultaten hiervan worden geregistreerd.

      4 Er wordt een plattegrond gemaakt en regelmatig bijgewerkt met alle nuttige gegevens van het ventilatiesysteem.
      De plattegrond is op de arbeidsplaats aanwezig en wordt desgevraagd getoond aan een ambtenaar als bedoeld in
      [artikel 24 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel6.20b
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 6.20c
    text: |-
      In afwijking van de [artikelen 6.3][ref1] en [6.4][ref2] zijn de werkplekken voor zover mogelijk voorzien van
      voldoende kunstmatige verlichting voor de bescherming van de veiligheid en de gezondheid van de werknemers. De
      verlichtingsinstallaties zijn zodanig aangebracht dat het type verlichting geen ongevallenrisico voor de werknemers
      oplevert.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6.3
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel6.4
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel6.20c
    references:
