  - number: '4.15'
    text: |-
      1 Er wordt een lijst bijgehouden van werknemers die belast zijn met werkzaamheden die blijkens de beoordeling,
      bedoeld in [artikel 4.2][ref1], gevaar opleveren voor de veiligheid en de gezondheid, onder vermelding van de
      blootstelling die zij hebben ondergaan voor zover hierover gegevens beschikbaar zijn.

      2 Iedere werknemer heeft recht op inzage in de gegevens die in de lijst, bedoeld in het eerste lid, met betrekking
      tot hem zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.2
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4.2'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '1'
  - number: '4.16'
    text: |-
      1 Bij ministeriële regeling worden regels gesteld met betrekking tot de grenswaarden waarboven het
      blootstellingsniveau of het gemiddelde blootstellingsniveau van kankerverwekkende of mutagene stoffen en stoffen
      die vrijkomen bij kankerverwekkende processen niet mag uitgaan.

      2 Bij overschrijding van een waarde als bedoeld in het eerste lid worden, met inachtneming van de
      [artikelen 4.17][ref1] en [4.18][ref2], onverwijld doeltreffende maatregelen genomen om die concentratie terug te
      brengen tot beneden die waarde.

      3 Zolang de maatregelen, bedoeld in het tweede lid, nog niet volledig ten uitvoer zijn gelegd of niet tot een
      doeltreffende bescherming leiden, mag de arbeid alleen worden voortgezet, indien doeltreffende maatregelen zijn
      genomen om schade aan de gezondheid van werknemers te voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.17
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4.18
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.16
