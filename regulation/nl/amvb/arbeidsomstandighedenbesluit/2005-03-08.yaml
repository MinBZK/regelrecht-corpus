        afdeling: 6A
  - number: '2.26'
    text: |-
      1 Overeenkomstig het bij ministeriële regeling voorgeschreven model wordt een daartoe aangewezen ambtenaar als
      bedoeld in [artikel 24, eerste lid, van de wet][ref1] vóór de aanvang van de werkzaamheden op de bouwplaats, in
      kennis gesteld van de voorgenomen totstandbrenging van een bouwwerk, indien:

      a. de geraamde duur van de totstandbrenging van het bouwwerk meer dan 30 werkdagen beslaat en op die bouwplaats
      meer dan 20 werknemers tegelijkertijd arbeid zullen gaan verrichten, of

      b. met de totstandbrenging van het bouwwerk meer dan 500 mensdagen zullen zijn gemoeid.

      2 De kennisgeving wordt zichtbaar op de bouwplaats aangebracht. Indien met betrekking tot de in de kennisgeving
      vermelde gegevens veranderingen optreden, wordt deze dienovereenkomstig gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel2.26
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: '2.27'
    text: |-
      1 Ten aanzien van een bouwwerk als bedoeld in bijlage II bij de richtlijn of een bouwwerk ten aanzien waarvan een
      kennisgeving als bedoeld in [artikel 2.26][ref1] wordt gedaan, wordt een veiligheids- en gezondheidsplan opgesteld,
      waarin ten minste vermeld worden:

      a. een beschrijving van het tot stand te brengen bouwwerk;

      b. een overzicht van de bij de totstandbrenging van het bouwwerk betrokken natuurlijke of rechtspersonen op de
      bouwplaats;

      c. de naam van de coördinator voor de ontwerpfase;

      d. de naam van de coördinator voor de uitvoeringsfase;

      e. de risico-inventarisatie en -evaluatie van de gevaren overeenkomstig [artikel 5 van de wet][ref2];

      f. de wijze waarop uitvoering wordt gegeven aan de samenwerking tussen werkgevers en in voorkomende gevallen
      zelfstandig werkenden op de bouwplaats, welke voorzieningen daarbij zullen worden getroffen en op welke wijze op
      die voorzieningen toezicht zal worden uitgeoefend;

      g. de wijze waarop uitvoering wordt gegeven aan de samenwerking en het overleg tussen werkgevers en werknemers op
      de bouwplaats en de wijze waarop de voorlichting en het onderricht van deze werknemers plaatsvindt.

      2 In de ontwerpfase van het bouwproces worden in ieder geval de gegevens, bedoeld in het eerste lid, onder *a*,
      *c*, en *e*, vermeld. De gegevens, bedoeld in het eerste lid, onder *b*, *d*, *f* en *g*, worden in de ontwerpfase
      vermeld, tenzij deze gegevens in die fase redelijkerwijs niet kenbaar zijn. In dat geval geschiedt de invulling
      daarvan vóór de aanvang van de werkzaamheden in de uitvoeringsfase van het bouwproces.

      3 Indien met betrekking tot de in het eerste lid bedoelde gegevens gedurende de ontwerpfase of uitvoeringsfase van
      het bouwproces veranderingen optreden wordt het plan dienovereenkomstig gewijzigd.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2.26
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel2.27
