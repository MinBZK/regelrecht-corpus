  - number: '4.7'
    text: |-
      1 [Artikel 4.6][ref1] is niet van toepassing ten aanzien van de volgende werkzaamheden aan, op of in tankschepen
      van een bij ministeriële regeling aangewezen categorie;

      a. het schoonmaken,

      b. het onderhouden, herstellen of verbouwen,

      c. het geheel of gedeeltelijk slopen, waarbij gevaar bestaat voor brand, explosie, vergiftiging, verstikking of
      bedwelming.

      2 De in het eerste lid bedoelde werkzaamheden worden op veilige wijze verricht door of onder toezicht van een
      persoon die beschikt over voldoende deskundigheid.

      3 Bij ministeriële regeling worden werkzaamheden aangewezen, die uitsluitend worden verricht, indien een
      gasdeskundige vooraf de gevaren voor de veiligheid en gezondheid van de werknemers heeft beoordeeld en een
      verklaring heeft afgegeven die voldoet aan een bij ministeriële regeling vast te stellen model.

      4 Een gasdeskundige als bedoeld in het derde lid, is in het bezit van een certificaat van vakbekwaamheid
      gasdeskundige, dat is afgegeven door Onze Minister of een certificerende instelling.

      5 Het certificaat van vakbekwaamheid gasdeskundige of een afschrift daarvan is op de arbeidsplaats aanwezig en
      wordt desgevraagd getoond aan een ambtenaar als bedoeld in [artikel 24 van de wet.][ref2]

      6 Ten aanzien van de in het eerste lid bedoelde werkzaamheden worden bij ministeriële regeling nadere regels
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.6
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.7
