  - number: 9.16a
    text: |-
      1 Vrijstelling of ontheffing van [artikel 4.62b][ref1] kan uitsluitend worden verleend in gevallen waarin het
      technisch niet uitvoerbaar is om onschadelijke of minder schadelijke stoffen of producten te gebruiken dan
      vluchtige organische stoffen of producten die deze stoffen bevatten.

      2 Op werkzaamheden waarvoor vrijstelling of ontheffing is verleend van [artikel 4.62b][ref2], is, in afwijking van
      [artikel 4.1a, derde lid][ref3], [artikel 4.9][ref4] van toepassing.


