        afdeling: '6'
  - number: 2.42e
    text: |-
      1 Voor het uitvoeren van een zo goed mogelijk arbeidsomstandighedenbeleid, bedoeld in [artikel 3 van de wet][ref1],
      is een veiligheids- en gezondheidszorgsysteem aanwezig. Dit systeem omvat het geheel van beleid, organisatie,
      planning, uitvoering, monitoring, evaluatie, doorlichting en verbetering, dat wordt gehanteerd voor de beheersing
      van de veiligheid en de gezondheid.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel3
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel2.42e
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '3'
  - number: 2.42f
    text: |-
      1 Onverminderd [artikel 2.42][ref1] blijkt uit het veiligheids- en gezondheidsdocument dat alle nodige maatregelen
      zijn genomen om de veiligheid en de gezondheid van de werknemers zowel in normale situaties als in noodsituaties te
      beschermen. Hiertoe bevat het document het volgende:

      a. een opgave van de aan de arbeidsplaats verbonden specifieke risicobronnen, met inbegrip van elke activiteit op
      die plaats, die ongevallen kunnen teweegbrengen met ernstige gevolgen voor de veiligheid en de gezondheid van de
      betrokken werknemers;

      b. een evaluatie van de risico's van de in onderdeel a bedoelde specifieke bronnen;

      c. het bewijs dat afdoende voorzorgsmaatregelen zijn genomen om de in onderdeel a bedoelde ongevallen te vermijden,
      de uitbreiding van ongevallen te beperken en de arbeidsplaats in noodsituaties op een doelmatige en beheerste wijze
      te kunnen evacueren;

      d. het bewijs dat er een veiligheids- en gezondheidszorgsysteem als bedoeld in [artikel 2.42e][ref2] gehanteerd
      wordt dat adequaat is om de voorschriften bij of krachtens dit besluit die betrekking hebben op de veiligheid en de
      bescherming van de gezondheid van de werknemers, zowel in gewone situaties als in noodsituaties na te leven.

      2 Bij de planning en tenuitvoerlegging van alle in [artikel 3.2, eerste lid, tweede volzin][ref3], bedoelde fasen
      worden de in het desbetreffende veiligheids- en gezondheidsdocument vermelde procedures en uitvoeringsbepalingen in
      acht genomen.

      3 De verschillende werkgevers die verantwoordelijk zijn voor de verschillende arbeidsplaatsen werken in voorkomend
      geval samen bij het opstellen van de veiligheids- en gezondheidsdocumenten, bedoeld in [artikel 2.42][ref4], en het
      voorbereiden van de maatregelen die nodig zijn om de veiligheid en de gezondheid van de werknemers te garanderen.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste, tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2.42
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2.42e
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel3.2
      [ref4]: https://wetten.overheid.nl/BWBR0008498#Artikel2.42
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel2.42f
