      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder onderwijsinrichting: een bekostigde of een
      aangewezen onderwijsinrichting.

      2 In dit besluit en de daarop berustende bepalingen wordt verstaan onder bekostigde onderwijsinrichting:

      a. een openbare of een geheel of gedeeltelijk uit de openbare kas bekostigde bijzondere school als bedoeld in de
      [Wet op het primair onderwijs][ref1];

      b. een openbare of een geheel of gedeeltelijk uit de openbare kas bekostigde bijzondere school als bedoeld in de
      [Wet op de expertisecentra][ref2];

      c. een openbare of een geheel of gedeeltelijk uit de openbare kas bekostigde bijzondere school, cursus of
      inrichting als bedoeld in en onder de werking van de [Wet op het voortgezet onderwijs][ref3];

      d. een openbare of een geheel of gedeeltelijk uit de openbare kas bekostigde bijzondere instelling, genoemd in de
      bijlage behorende bij de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref4], onder *a* en *b*;

      e. een openbare of een geheel of gedeeltelijk uit de openbare kas bekostigde bijzondere instelling, genoemd in de
      bijlage behorende bij de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref5], onder *c* tot en met
      *g*;

      f. de Open Universiteit te Heerlen, genoemd in de bijlage behorende bij de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref6], onder *h*;

      g. een school als bedoeld in de [Experimentenwet onderwijs][ref7];

      h. een openbare of een geheel of gedeeltelijk uit openbare kas bekostigde bijzondere instelling voor educatie en
      beroepsonderwijs als bedoeld in de Wet educatie beroepsonderwijs.

      3 In dit besluit en de daarop berustende bepalingen wordt verstaan onder aangewezen onderwijsinrichting:

      a. een school als bedoeld in [artikel 56 van de Wet op het voortgezet onderwijs][ref8];

      b. een instelling als bedoeld in [artikel 6.9 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref9];

      c. een instelling als bedoeld in [artikel 1.4.1 van de Wet educatie en beroepsonderwijs][ref10].

      4 In dit besluit en de daarop berustende bepalingen wordt verstaan onder medezeggenschapsraad:

      a. een medezeggenschapsraad als bedoeld in de [Wet medezeggenschap onderwijs 1992][ref11] of in
      [artikel 10.17 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref12];

      b. de studentenraad van de Open Universiteit, bedoeld in
      [artikel 11.13 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref13].


