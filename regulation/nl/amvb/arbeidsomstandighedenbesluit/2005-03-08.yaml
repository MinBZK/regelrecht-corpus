  - number: 4.10e
    text: |-
      1 Aan werknemers die arbeid verrichten waarbij gevaar bestaat voor blootstelling aan gevaarlijke stoffen wordt
      voorlichting en onderricht gegeven, waarbij ten minste aandacht wordt besteed aan:

      a. de mogelijke gevaren voor de gezondheid die zijn verbonden aan het werken met gevaarlijke stoffen op grond van
      de resultaten van de beoordeling, bedoeld in [artikel 4.2][ref1];

      b. de aard van de blootstelling, bedoeld in [artikel 4.2, eerste lid][ref2];

      c. de grenswaarden en de maatregelen bij overschrijding van deze waarden als bedoeld in de [artikelen 4.8b][ref3],
      [4.16][ref4] en [4.46][ref5];

      d. de te treffen voorzorgsmaatregelen om blootstelling te voorkomen of te beperken;

      e. de te treffen voorzorgsmaatregelen om zoveel mogelijk te voorkomen dat zich met betrekking tot gevaarlijke
      stoffen een ongewilde gebeurtenis voordoet;

      f. de hygiënische maatregelen;

      g. het dragen en gebruiken van persoonlijke beschermingsmiddelen;

      h. de te nemen maatregelen in geval zich een ongewilde gebeurtenis voordoet met gevaarlijke stoffen.

      2 De werknemers kunnen kennis nemen van de informatie over de veiligheid en gezondheid die door de leverancier van
      een gevaarlijke stof wordt verstrekt, waaronder begrepen de verplichte informatie die bij of krachtens wettelijk
      voorschrift wordt verstrekt;

      3 De wijze van voorlichting en onderricht is afgestemd op de resultaten van de beoordeling, bedoeld in
      [artikel 4.2][ref6].

      4 De voorlichting en het onderricht worden geactualiseerd indien gewijzigde omstandigheden hiertoe aanleiding
      geven.


