  - number: 2.5f
    text: |-
      Indien een zwaar ongeval gevolgen kan hebben voor de veiligheid van werknemers in naburige bedrijven of
      inrichtingen verstrekt de werkgever uit eigen beweging aan de betreffende bedrijven of inrichtingen algemene
      gegevens die noodzakelijk zijn voor de beoordeling van het risico voor de veiligheid van de werknemers in het
      naburige bedrijf of inrichting.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel2.5f
  - number: 2.5g
    text: |-
      1 Aan een daartoe aangewezen ambtenaar als bedoeld in [artikel 24 van de wet][ref1] wordt door de werkgever
      schriftelijk gemeld:

      a. de naam en het adres van de werkgever en, indien deze anders zijn, de naam en het adres van het bedrijf of de
      inrichting waarop [artikel 2.3][ref2] van toepassing is;

      b. welke installaties onder de verplichting, bedoeld in [artikel 2.3, eerste lid][ref3], vallen;

      c. de naam en het adres van de arbodienst die medewerking verleent bij de uitvoering van de taken, bedoeld in
      [artikel 2.5e, eerste lid][ref4].

      2 Indien in het bedrijf of de inrichting of een onderdeel daarvan of in de werking van het bedrijf of de inrichting
      of een onderdeel daarvan een verandering van technische of organisatorische aard wordt aangebracht die voor de
      risico's van een zwaar ongeval met gevaarlijke stoffen belangrijke gevolgen kan hebben, wordt een nieuwe melding
      als bedoeld in het eerste lid gedaan.

      3 De ambtenaar, bedoeld in het eerste lid, zendt onverwijld een kopie van de melding aan:

      a. het bestuursorgaan dat bevoegd is een vergunning krachtens [artikel 8:1 van de Wet milieubeheer][ref5] te
      verlenen;

      b. burgemeester en wethouders van de gemeente waarin het bedrijf of de inrichting geheel of gedeeltelijk is
      gelegen, tenzij burgemeester en wethouders het bestuursorgaan als bedoeld onder a zijn;

      c. het bestuur van de regionale brandweer binnen wier gebied het bedrijf of de inrichting is gelegen.


