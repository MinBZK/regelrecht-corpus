        bwb_id: BWBR0008498
        hoofdstuk: '4'
        afdeling: '1'
  - number: '4.85'
    text: |-
      Indien een werknemer gerede kans loopt aan een of meer specifiek bij zijn arbeid voorkomende of naar verwachting
      voorkomende biologische agentia te worden blootgesteld, wordt, in het kader van de in [artikel 5 van de wet][ref1]
      bedoelde risico-inventarisatie en -evaluatie, de aard, de mate en de duur van de blootstelling beoordeeld teneinde
      het gevaar voor de werknemer te bepalen. Deze beoordeling geschiedt met inachtneming van met name:

      a. de categorie of categorieën, waarin de biologische agentia waaraan werknemers kunnen worden blootgesteld, zijn
      ingedeeld;

      b. informatie over ziekten die werknemers kunnen oplopen of al hebben opgelopen als gevolg van blootstelling aan
      biologische agentia;

      c. mogelijke allergische of vergiftigingseffecten die de werknemers als gevolg van blootstelling aan biologische
      agentia ondervinden of kunnen ondervinden;

      d. de resultaten van de arbeidsgezondheidskundige onderzoeken, bedoeld in artikel 4.91, alsmede de ziekten waarvan
      bekend is dat een werknemer hieraan lijdt en de medicijnen waarvan bekend is dat die door een werknemer worden
      gebruikt, een en ander in statistische, niet tot individuen herleidbare vorm.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.85
