  - number: '4.10'
    text: |-
      1 Indien op grond van [artikel 4.9, vijfde lid][ref1], verontreinigde lucht wordt afgevoerd, is gelijktijdig
      voldoende toevoer van niet-verontreinigde lucht gewaarborgd.

      2 Bij ministeriële regeling worden regels gesteld met betrekking tot het eerste lid. Deze regels kunnen onder meer
      betrekking hebben op:

      a. de kwaliteit van de lucht die wordt toegevoerd;

      b. de luchtcirculatie- of luchtverversingssystemen dan wel luchtreinigingsapparatuur die voor de toevoer van niet-
      verontreinigde lucht worden gebruikt;

      c. de controle en het onderhoud van de onder *b* bedoelde systemen of apparatuur.

      3 Bij ministeriële regeling worden in het belang van de veiligheid of gezondheid gevallen aangewezen waarin het
      recirculeren van lucht is verboden of slechts is toegestaan met inachtneming van de bij die regeling te stellen
      voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.9
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.10
