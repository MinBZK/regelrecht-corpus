        afdeling: '2'
  - number: '4.17'
    text: |-
      Zodanige technische en organisatorische maatregelen zijn genomen dat het gevaar van blootstelling van werknemers
      aan kankerverwekkende of mutagene stoffen en kankerverwekkende processen zoveel mogelijk bij de bron daarvan wordt
      voorkomen, met name door kankerverwekkende of mutagene stoffen en kankerverwekkende processen, voor zover dit
      technisch uitvoerbaar is, te vervangen door stoffen of processen waarbij de werknemers, gelet op de eigenschappen
      van die stoffen of processen, de aard van de arbeid, de werkmethoden en de werkomstandigheden, niet of minder aan
      gevaar voor hun veiligheid of gezondheid worden blootgesteld.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.17
  - number: '4.18'
    text: |-
      1 Voor zover uit de resultaten van de in [artikel 4.2, eerste lid][ref1], bedoelde beoordeling blijkt dat er
      gevaar voor de gezondheid van de werknemers bestaat en dat het op doeltreffende wijze voorkomen van blootstelling
      door het nemen van maatregelen als bedoeld in [artikel 4.17][ref2] technisch niet uitvoerbaar is, wordt het
      gevaar van blootstelling, voor zover dit technisch uitvoerbaar is, bij de bron daarvan voorkomen of teruggebracht
      tot een niveau waarop geen schade aan de gezondheid kan optreden, met name door de productie en het gebruik van
      kankerverwekkende of mutagene stoffen of kankerverwekkende processen plaats te doen vinden in een gesloten systeem.

      2 Indien het voorkomen van blootstelling of het terugbrengen van blootstelling tot een niveau waarop geen
      schade aan de gezondheid kan optreden als bedoeld in het eerste lid technisch niet uitvoerbaar is, worden
      kankerverwekkende of mutagene stoffen op doeltreffende wijze aan de bron verwijderd, onder meer door plaatselijke
      afvoer van de lucht, zo nodig aangevuld door algemene ventilatie, waarbij gelijktijdig voldoende toevoer van niet-
      verontreinigde lucht is gewaarborgd zonder dat hierbij gevaar ontstaat voor de volksgezondheid en het milieu.

      3 Indien de in het tweede lid bedoelde maatregelen technisch niet uitvoerbaar zijn, worden maatregelen genomen om
      blootstelling van werknemers te beperken tot een zo laag mogelijk niveau als technisch uitvoerbaar is door zoveel
      mogelijk mens en bron te scheiden.

      4 Indien het technisch niet uitvoerbaar is om de blootstelling van werknemers te voorkomen of te beperken tot een
      voldoende laag niveau door middel van de in het derde lid bedoelde maatregelen, worden aan de werknemers die worden
      of kunnen worden blootgesteld, persoonlijke beschermingsmiddelen ter beschikking gesteld.

      5 Indien de werkzaamheden worden verricht met gebruik van persoonlijke beschermingsmiddelen overeenkomstig het
      vierde lid, mag dit niet blijvend op deze wijze geschieden en wordt de duur van het dragen daarvan voor ieder van
      deze werknemers tot het strikt noodzakelijke beperkt.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.2
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4.17
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.18
