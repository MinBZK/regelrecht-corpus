  - number: '6.26'
    text: |-
      In aanvulling op het bepaalde bij of krachtens dit hoofdstuk gelden voor jeugdige werknemers tevens de in deze
      paragraaf genoemde voorschriften en verboden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel6.26
  - number: '6.27'
    text: |-
      1 Jeugdige werknemers mogen geen duikarbeid, caissonarbeid en overige arbeid onder overdruk, bedoeld in
      [artikel 6.13][ref1], verrichten.

      2 Jeugdige werknemers mogen geen arbeid verrichten met toestellen die schadelijke niet-ioniserende
      elektromagnetische straling kunnen uitzenden.

      3 Jeugdige werknemers mogen geen arbeid verrichten op een arbeidsplaats waar zij worden blootgesteld aan een
      equivalent geluidsniveau van 90 dB(A) of hoger.

      4 Jeugdige werknemers mogen niet worden blootgesteld aan schadelijke trillingen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6.13
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel6.27
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '6.13'
        hoofdstuk: '6'
        afdeling: '5'
  - number: '6.28'
    text: |-
      In aanvulling op het bepaalde bij of krachtens dit hoofdstuk gelden voor zwangere werknemers tevens de in deze
      paragraaf genoemde voorschriften.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel6.28
  - number: '6.29'
    text: |-
      Het is een zwangere werknemer verboden duikarbeid, caissonarbeid en overige arbeid onder overdruk als bedoeld in
      [artikel 6.13][ref1] te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6.13
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel6.29
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '6.13'
        hoofdstuk: '6'
        afdeling: '5'
  - number: 6.29a
    text: |-
      Het is een zwangere werknemer en een werknemer tijdens de lactatie verboden arbeid te verrichten in de ondergrondse
      winningsindustrie.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel6.29a
  - number: '6.30'
    text: |-
      1 Op de arbeidsplaats zijn de nodige voorzieningen voor een doelmatige kunstverlichting aanwezig.

      2 Indien de thuiswerker reeds uit eigen hoofde beschikt over de in het eerste lid bedoelde voorziening, behoeft de
      thuiswerkgever deze niet alsnog ter beschikking te stellen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel6.30
  - number: '6.31'
    text: |-
      1 [Artikel 6.16, zesde lid][ref1], is niet van toepassing op leerlingen respectievelijk studenten in
      onderwijsinrichtingen indien deze leerlingen respectievelijk studenten duikwerkzaamheden verrichten die:

      a. in het kader van wetenschappelijk onderzoek zijn;

      b. van lichte aard zijn, en

      c. worden uitgevoerd door een duikploeg als bedoeld in [artikel 6.16, eerste lid][ref2], waarbij de leerling
      respectievelijk student functioneert als aanvullend lid van deze duikploeg.

      2 De leerlingen respectievelijk studenten zijn bij het uitvoeren van de duikwerkzaamheden, bedoeld in het eerste
      lid, in het bezit van een bij ministeriële regeling aan te wijzen sportduikbrevet.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6.16
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel6.16
