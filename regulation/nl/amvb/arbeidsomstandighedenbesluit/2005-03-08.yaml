  - number: '4.36'
    text: |-
      1 Het gebruik van benzeen of van een product waarvan het gehalte aan benzeen meer dan 1 volume-procent bedraagt als
      oplos-, reinigings- of verdunningsmiddel is niet toegestaan, tenzij zulks geschiedt in een gesloten systeem of op
      een andere wijze waardoor in ten minste gelijke mate bescherming tegen blootstelling daaraan wordt geboden.

      2 Indien van benzeen of van een product als bedoeld in het eerste lid gebruik wordt gemaakt anders dan als oplos-,
      reinigings- of verdunningsmiddel, wordt dit zoveel mogelijk uitgevoerd in een gesloten systeem.

      3 Het eerste en het tweede lid zijn van overeenkomstige toepassing ten aanzien van tetrachloorkoolstof,
      pentachloorethaan en 1.1.2.2.-tetrachloorethaan alsmede ten aanzien van een product waarvan het gehalte aan een van
      de vorengenoemde stoffen meer dan 1 volume-procent bedraagt.

      4 Voor zover het gebruik van benzeen, van tetrachloorkoolstof, pentachloorethaan en 1.1.2.2.-tetrachloorethaan
      op grond van dit artikel is toegestaan, is daarop, met inachtneming van [artikel 4.12, afdeling 2][ref1] van dit
      hoofdstuk van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.12
