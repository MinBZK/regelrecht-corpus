  - number: '4.51'
    text: |-
      1 De werkkleding mag uitsluitend buiten het bedrijf of de inrichting worden gebracht indien dit geschiedt met het
      doel deze te laten reinigen in daartoe adequaat uitgeruste wasserijen.

      2 In gevallen als bedoeld in het eerste lid, wordt de werkkleding in een daartoe geschikte en gesloten verpakking
      vervoerd.

      3 Wanneer beschermende uitrusting wordt verstrekt, wordt deze op een daartoe aangewezen plaats bewaard en na ieder
      gebruik gecontroleerd en gereinigd. Defecte uitrusting mag niet worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.51
  - number: '4.52'
    text: |-
      1 Zolang de blootstelling aan asbeststof duurt, worden, in aanvulling op [artikel 4.10a, derde lid][ref1],
      de betrokken werknemers ten minste éénmaal in de drie jaar opnieuw in de gelegenheid gesteld om een
      arbeidsgezondheidskundig onderzoek als bedoeld in [artikel 4.10a][ref2] te ondergaan.

      2 Het arbeidsgezondheidskundig onderzoek, bedoeld in [artikel 4.10a][ref3], omvat in ieder geval een specifiek
      onderzoek van de borstkas.

      3 Indien het resultaat van het arbeidsgezondheidskundig onderzoek, bedoeld in [artikel 4.10a][ref4], daartoe
      aanleiding geeft, worden doeltreffende maatregelen genomen om schade voor de gezondheid van de betrokken werknemer
      door blootstelling aan asbeststof te voorkomen.

      4 Aan de arbodienst wordt inzage gegeven in de gegevens die in het register, bedoeld in [artikel 4.53][ref5], zijn
      vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.10a
