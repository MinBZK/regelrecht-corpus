  - number: 2.42d
    text: |-
      Op een arbeidsplaats in de winningsindustrie die delfstoffen wint met behulp van boringen zijn naast de
      voorschriften van [afdeling 6][ref1] van dit hoofdstuk tevens de voorschriften van deze afdeling van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk2
