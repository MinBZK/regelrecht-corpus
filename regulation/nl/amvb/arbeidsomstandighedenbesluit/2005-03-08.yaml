  - number: '4.94'
    text: |-
      1 Ten minste 30 dagen voordat voor de eerste maal arbeid met een of meer biologische agentia van categorie 2, 3 of
      4 wordt verricht, wordt hiervan een schriftelijke kennisgeving gezonden aan een daartoe aangewezen ambtenaar als
      bedoeld in [artikel 24, eerste lid, van de wet][ref1].

      2 Deze kennisgeving bevat ten minste de volgende gegevens:

      a. de naam en het adres van de werkgever;

      b. de naam en de functie van de persoon die verantwoordelijk is voor de veiligheid en de gezondheid op het werk;

      c. de resultaten van de in [artikel 4.85][ref2] bedoelde risico-inventarisatie en -evaluatie;

      d. de categorie of categorieën en soort of soorten waartoe het biologische agens of de biologische agentia behoort
      respectievelijk behoren;

      e. de voorgenomen beschermende en preventieve maatregelen.

      3 Met inachtneming van het eerste lid wordt tevens kennis gegeven van arbeid met ieder volgend nieuw biologisch
      agens van categorie 3 en ieder volgend biologisch agens van categorie 4.

      4 In afwijking van het eerste en derde lid wordt de in het eerste lid bedoelde ambtenaar in geval alleen
      diagnostische arbeid wordt verricht, hiervan slechts in kennis gesteld, indien deze arbeid voor de eerste maal
      wordt verricht.

      5 De in dit artikel bedoelde kennisgeving wordt opnieuw gedaan, indien er in de procédés of procedures
      veranderingen hebben plaatsgevonden die gevolgen kunnen hebben voor de veiligheid en de gezondheid van de
      werknemers, waardoor eerdere kennisgevingen zijn achterhaald.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4.85
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.94
    references:
      - id: ref1
        bwb_id: BWBR0010346
