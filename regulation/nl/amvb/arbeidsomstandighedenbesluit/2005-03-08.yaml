  - number: '2.38'
    text: |-
      1 Bij de uitvoering van zijn verplichtingen op grond van de [artikelen 3][ref1],[ 5][ref2], [8][ref3] en
      [19, eerste lid, van de wet][ref4] neemt de werkgever, die met betrekking tot de totstandbrenging van een bouwwerk
      op een bouwplaats arbeid doet verrichten, doeltreffende maatregelen ter bescherming van de veiligheid en de
      gezondheid van zijn werknemers op die bouwplaats. Deze maatregelen hebben met name betrekking op:

      a. het in goede orde en met voldoende bescherming van de veiligheid en gezondheid van de werknemers in stand houden
      van de bouwplaats;

      b. de veilige plaatsing van de verschillende werkplekken op de bouwplaats, rekening houdend met de
      toegangsmogelijkheden tot die bouwplaats en de verbindingswegen daarop;

      c. het interne transport van de verschillende materialen op de bouwplaats;

      d. het onderhoud, de controle vóór inbedrijfstelling en de periodieke controle van installaties en toestellen,
      teneinde gebreken te voorkomen die de veiligheid en gezondheid van werknemers in gevaar kunnen brengen;

      e. de afbakening en inrichting van zones voor definitieve en tussenopslag van verschillende materialen, met name in
      geval van gevaarlijke materialen of stoffen;

      f. de voorzieningen voor de verwijdering van gebruikte gevaarlijke materialen;

      g. de opslag en de verwijdering of de afvoer van afval en puin;

      h. de aanpassing van de daadwerkelijke duur van de uit te voeren werkzaamheden met betrekking tot de
      totstandbrenging van het bouwwerk of de fasen waarin die werkzaamheden worden uitgevoerd, afhankelijk van de
      ontwikkeling met betrekking tot de voortgang van het bouwwerk op de bouwplaats;

      i. de samenwerking met andere werkgevers en zelfstandig werkenden op de bouwplaats;

      j. de wisselwerking met exploitatiewerkzaamheden op of in de nabijheid van de bouwplaats.

      2 De mede op grond van het eerste lid te nemen maatregelen voldoen in ieder geval aan de [afdelingen 1][ref5] en
      [2 van hoofdstuk 3][ref6] van dit besluit.

      3 De werkgever is verplicht tot naleving van en medewerking aan het veiligheids- en gezondheidsplan, bedoeld in
      [artikel 2.27][ref7], voor zover en op de wijze als daarin ten aanzien van de door hem te verrichten of te doen
      verrichten werkzaamheden is bepaald en daarbij rekening te houden met de aanwijzingen van de coördinator voor de
      uitvoeringsfase.

      4 Voor zover de werkgever met betrekking tot de totstandbrenging van een bouwwerk op een
      bouwplaats zelf arbeid verricht, zijn ter bescherming van de veiligheid en de gezondheid
      van de werknemers op die bouwplaats [artikel 11 van de wet][ref8], [hoofdstuk 7][ref9] en de
      [artikelen 8.1, eerste tot en met vijfde lid, en zevende lid][ref10], [8.2][ref11] en [8.3][ref12] van dit besluit
      ten aanzien van hem van overeenkomstige toepassing.


