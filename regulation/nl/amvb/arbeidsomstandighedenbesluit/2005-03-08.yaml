  - number: 7.2a
    text: 'In dit hoofdstuk wordt verstaan onder keuring: een onderzoek of een beproeving.'
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.2a
  - number: '7.3'
    text: |-
      1 Bij de keuze van de arbeidsmiddelen die de werkgever overweegt ter beschikking te stellen, wordt rekening
      gehouden met de uit de risico-inventarisatie en -evaluatie, bedoeld in [artikel 5 van de wet][ref1], gebleken
      specifieke kenmerken van de arbeid, met de omstandigheden waaronder deze wordt verricht, met de op de arbeidsplaats
      al bestaande gevaren en met de gevaren die daaraan zouden kunnen worden toegevoegd door het gebruik van de
      desbetreffende arbeidsmiddelen.

      2 Om te voorkomen dat het gebruik van arbeidsmiddelen gevaren voor de veiligheid en gezondheid van de werknemers
      oplevert, worden de arbeidsmiddelen die op de arbeidsplaats ter beschikking van de werknemers worden gesteld,
      uitsluitend gebruikt voor het doel, op de wijze en op de plaats waarvoor zij zijn ingericht en bestemd.

      3 Arbeidsmiddelen zijn voorts geschikt voor het uit te voeren werk of zijn daartoe behoorlijk aangepast.

      4 Voor zover het redelijkerwijs niet mogelijk is de gevaren bij het gebruik van de arbeidsmiddelen te voorkomen,
      worden zodanige maatregelen getroffen dat de gevaren zoveel mogelijk worden beperkt.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
  - number: '7.4'
    text: |-
      1 Een arbeidsmiddel bestaat uit deugdelijk materiaal.

      2 Een arbeidsmiddel is van een deugdelijke constructie.

      3 Een arbeidsmiddel is zodanig geplaatst of ingericht, dat het gevaar van verschuiven, omvallen, kantelen,
      oververhitting, brand, ontploffen, blikseminslag en directe of indirecte aanraking met elektriciteit zoveel
      mogelijk is voorkomen.

      4 Artikel 3.17 is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel7.4
  - number: 7.4a
    text: |-
      1 Een arbeidsmiddel waarvan de veiligheid afhangt van de wijze van installatie wordt na de installatie en voordat
      het voor de eerste maal in gebruik wordt genomen gekeurd op de juiste wijze van installatie en goed en veilig
      functioneren.

      2 Een arbeidsmiddel als bedoeld in het eerste lid, wordt voorts na elke montage op een nieuwe locatie of een nieuwe
      plek gekeurd op de juiste wijze van installatie en goed en veilig functioneren.

      3 Een arbeidsmiddel dat onderhevig is aan invloeden die leiden tot verslechteringen welke aanleiding kunnen geven
      tot het ontstaan van gevaarlijke situaties wordt, zo dikwijls dit ter waarborging van de goede staat noodzakelijk
      is, gekeurd, waarbij het zo nodig wordt beproefd.

      4 Een arbeidsmiddel als bedoeld in het derde lid wordt voorts gekeurd, waarbij het zo nodig wordt beproefd,
      telkens wanneer zich uitzonderlijke gebeurtenissen hebben voorgedaan die schadelijke gevolgen kunnen hebben
      voor de veiligheid van het arbeidsmiddel. Als uitzonderlijke gebeurtenissen worden in ieder geval aangemerkt:
      natuurverschijnselen, veranderingen aan het arbeidsmiddel, ongevallen met het arbeidsmiddel en langdurige
      buitengebruikstelling van het arbeidsmiddel.

      5 Keuringen worden uitgevoerd door een deskundige natuurlijke persoon, rechtspersoon of instelling.

      6 Schriftelijke bewijsstukken van de uitgevoerde keuringen zijn op de arbeidsplaats aanwezig en worden desgevraagd
      getoond aan een ambtenaar als bedoeld in [artikel 24 van de wet][ref1].

      7 Dit artikel is niet van toepassing op attractie- en speeltoestellen waarop het
      [Warenwetbesluit attractie- en speeltoestellen][ref2] van toepassing is.

      8 Het eerste tot en met het vijfde lid zijn niet van toepassing op steigers waarop [artikel 7.34][ref3] van
      toepassing is.

      9 Het eerste tot en met derde lid zijn niet van toepassing op:

      a. hijs- en hefwerktuigen en hijs- en hefgereedschappen aan boord van schepen waarop [artikel 7.29][ref4] van
      toepassing is;

      b. liften en bouwliften voor personenvervoer waarop het [Warenwetbesluit liften][ref5] van toepassing is;.

      c. stoom- en damptoestellen waarop het [Stoombesluit ][ref6]van toepassing is.

      10

      11 Het eerste en tweede lid zijn niet van toepassing op drukapparatuur, samenstellen en druksystemen waarop
      [artikel 12b van het Warenwetbesluit drukapparatuur][ref7] van toepassing is.

      12 Het derde lid is niet van toepassing op:

      a. hijs- en hefgereedschap waarop [artikel 7.20][ref8] van toepassing is;

      b. containers waarop het [Warenwetbesluit containers][ref9] van toepassing is;

      c. hijskranen waarop de [artikelen 6d tot en met 6f van het Warenwetbesluit machines][ref10] van toepassing zijn;

      d. transportsteigers waarop het [Warenwetbesluit liften][ref11] van toepassing is.


