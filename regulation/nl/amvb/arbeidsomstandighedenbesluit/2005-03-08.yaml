        afdeling: '1'
  - number: 6.20e
    text: |-
      Verlichtingsinstallaties zijn zodanig ontworpen dat operationele bedieningsruimten, vluchtwegen, inschepingszones
      en gevaarlijke zones gedurende de aanwezigheid van de werknemers verlicht zijn.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel6.20e
  - number: '6.21'
    text: |-
      Afdeling 3 van dit hoofdstuk is niet van toepassing op zeeschepen en luchtvaartuigen. Op zeeschepen en
      luchtvaartuigen zijn uitsluitend de artikelen 6.22 en 6.23 van toepassing.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel6.21
  - number: '6.22'
    text: |-
      In deze paragraaf wordt onder equivalent geluidsniveau in dB(A) verstaan: het energetisch gemiddelde geluidsniveau
      gedurende een bepaalde beoordelingstijd, uitgedrukt in dB(A).
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel6.22
  - number: '6.23'
    text: |-
      1 Machines, werktuigen, apparaten, installaties aan boord van luchtvaartuigen en zeeschepen zijn van zodanige
      constructie, zijn zodanig ingericht, opgesteld of ondersteund en worden zodanig onderhouden, dat zij bij het
      in werking zijn op de arbeidsplaats geen equivalent geluidsniveau veroorzaken hoger dan 85 dB(A), tenzij dat
      redelijkerwijs niet kan worden gevergd.

      2 Het verrichten van werkzaamheden geschiedt zodanig, dat daarbij op de arbeidsplaats geen equivalent geluidsniveau
      veroorzaakt wordt hoger dan 85 dB(A), tenzij dat redelijkerwijs niet kan worden gevergd.

      3 Indien de uitzondering, genoemd in de laatste zinsnede van het eerste of tweede lid, van toepassing is, zijn
      doeltreffende voorzieningen getroffen waardoor zoveel mogelijk wordt voorkomen dat het in het eerste en tweede lid
      genoemde geluidsniveau op de arbeidsplaats heerst, tenzij ook dat redelijkerwijs niet kan worden gevergd.

      4 De in het derde lid bedoelde voorzieningen worden vermeld in het plan van aanpak, bedoeld in
      [artikel 5 van de wet][ref1].

      5 In gevallen waarin de voorzieningen, getroffen op grond van het derde lid, de werknemers onvoldoende bescherming
      bieden tegen de in het eerste en tweede lid genoemde geluidsniveaus, en in gevallen waarin het treffen van
      bedoelde voorzieningen redelijkerwijs niet kan worden gevergd, worden doeltreffende maatregelen genomen om de
      blootstellingsduur alsmede het aantal werknemers dat aan de desbetreffende geluidsniveaus wordt blootgesteld,
      zoveel mogelijk te beperken.

      6 Het vierde lid is van overeenkomstige toepassing op de in het vijfde lid bedoelde maatregelen.

      7 In gevallen, waarin werknemers kunnen worden blootgesteld aan een equivalent geluidsniveau van 80 dB(A)
      of hoger, worden persoonlijke beschermingsmiddelen in voldoende aantal beschikbaar gesteld. De persoonlijke
      beschermingsmiddelen bieden een demping van het geluid tot een equivalent geluidsniveau van 80 dB(A) of lager.
      Indien een zodanige demping technisch niet mogelijk is, wordt door de persoonlijke beschermingsmiddelen ten minste
      een demping van het geluid geboden tot beneden het equivalent geluidsniveau van 85 dB(A).

      8 Bij overschrijding van het equivalent geluidsniveau van 85 dB(A) worden door de werknemers de persoonlijke
      beschermingsmiddelen gebruikt.

      9 Op een bij koninklijk besluit te bepalen tijdstip wordt het in het eerste en tweede lid genoemde geluidsniveau
      van 85 dB(A) vervangen door 80 dB(A).


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
