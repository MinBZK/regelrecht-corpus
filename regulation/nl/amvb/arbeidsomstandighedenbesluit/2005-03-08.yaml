  - number: '1.20'
    text: |-
      1 Op arbeid verricht in respectievelijk op een zeeschip of een luchtvaartuig is [artikel 29 van de wet][ref1]
      niet van toepassing, voor zover de toepassing van dat artikel in strijd komt met de verplichtingen
      die voortvloeien uit de uitoefening van de bevoegdheden van de kapitein respectievelijk de
      gezagvoerder, bedoeld in [artikel 341 van het Wetboek van Koophandel][ref2] respectievelijk
      [artikel 95, eerste lid, van de Regeling Toezicht Luchtvaart][ref3].

      2 Op arbeid verricht door de kapitein respectievelijk de gezagvoerder, bedoeld in het eerste lid, in
      respectievelijk op een zeeschip of een luchtvaartuig, is [artikel 29 van de wet][ref4] niet van toepassing
      voor zover de toepassing van dat artikel in strijd komt met de verplichtingen die voortvloeien uit het
      [Wetboek van Koophandel][ref5] respectievelijk de [Regeling Toezicht Luchtvaart][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel341
      [ref3]: https://wetten.overheid.nl/BWBR0002309#Artikel95
