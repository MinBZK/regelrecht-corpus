  - number: '3.45'
    text: |-
      In aanvulling op het bepaalde bij of krachtens dit hoofdstuk gelden voor jeugdige werknemers tevens de in deze
      paragraaf genoemde voorschriften en verboden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.45
  - number: '3.46'
    text: |-
      [Artikel 1.37, tweede lid][ref1], is van overeenkomstige toepassing op jeugdige werknemers die:

      a. arbeid verrichten waarbij gevaar voor instorting bestaat;

      b. arbeid verrichten aan, met of in de directe nabijheid van hoogspanningsinstallaties, bedoeld in
      [artikel 3.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1.37
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel3.1
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel3.46
