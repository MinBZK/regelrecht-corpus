        afdeling: '9'
  - number: '4.95'
    text: |-
      Een daartoe aangewezen ambtenaar als bedoeld in [artikel 24, eerste lid, van de wet][ref1] wordt zo spoedig
      mogelijk schriftelijk op de hoogte gesteld van ieder ongeval of incident dat zich heeft voorgedaan en heeft geleid
      of mogelijkerwijs heeft geleid tot het vrijkomen van een of meer biologische agentia van categorie 3 of 4.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.95
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: '4.96'
    text: |-
      In geval de werkgever de werkzaamheden beëindigt worden het in [artikel 4.90][ref1] bedoelde register
      en de resultaten van het in [artikel 4.91][ref2] bedoelde arbeidsgezondheidskundig onderzoek, in
      geval deze bij de werkgever berusten, overgedragen aan een daartoe aangewezen ambtenaar als bedoeld in
      [artikel 24, eerste lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.90
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4.91
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.96
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4.90'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4.91'
        hoofdstuk: '4'
        paragraaf: '4'
        afdeling: '9'
      - id: ref3
        bwb_id: BWBR0010346
        artikel: '24'
  - number: '4.97'
    text: |-
      1 In aanvulling op [artikel 4.85][ref1] wordt bij de risico-inventarisatie en -evaluatie van gevaren, verbonden aan
      andere dan microbiologisch diagnostische arbeid in de gezondheidszorg en in de diergeneeskunde, aandacht besteed
      aan:

      a. de onzekerheid omtrent de aanwezigheid van biologische agentia en de daaraan verbonden gevaren bij patiënten of
      dieren en in monsters of materiaal van patiënten of dieren;

      b. de aan de aard van het werk verbonden gevaren.

      2 Bij de in het eerste lid bedoelde arbeid worden ter bescherming van de veiligheid en de gezondheid van de
      betrokken werknemers doeltreffende maatregelen genomen. Deze bestaan in ieder geval uit:

      a. het opstellen en bekend maken van ontsmettings- en desinfectieprocedures aan de betrokken werknemers;

      b. het opstellen en bekend maken van procedures voor een veilige omgang met en verwijdering van met biologische
      agentia besmet afvalmateriaal.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.85
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.97
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4.85'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '9'
  - number: '4.98'
    text: |-
      In isolatieafdelingen met patiënten of dieren die besmet zijn of mogelijkerwijs besmet zijn met biologische agentia
      van categorie 3 of 4, worden passende beschermingsmaatregelen als bedoeld in bijlage V, kolom A, bij de richtlijn
      getroffen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.98
  - number: '4.99'
    text: |-
      1 In laboratoria en in ruimten waarin zich dieren bevinden die opzettelijk zijn besmet met biologische agentia van
      categorie 2, 3 of 4 dan wel dieren die drager zijn of mogelijk zouden kunnen zijn van biologische agentia van een
      van deze categorieën, worden, afhankelijk van de resultaten van de risico-inventarisatie en -evaluatie, bedoeld in
      [artikel 4.85][ref1], ten minste respectievelijk de beheersingsniveaus 2, 3 en 4 van bijlage V bij de richtlijn in
      acht genomen.

      2 Indien in de in het eerste lid bedoelde laboratoria arbeid wordt verricht met materiaal waarvan onzeker is of
      zich hierin biologische agentia van categorie 2, 3 of 4 bevinden en de arbeid niet is gericht op het werken met
      biologische agentia, wordt ten minste beheersingsniveau 2 van bijlage V bij de richtlijn in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.95
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.99
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4.95'
        hoofdstuk: '4'
        paragraaf: '6'
        afdeling: '9'
  - number: '4.100'
    text: |-
      1 In geval biologische agentia van de categorie 2, 3 of 4 worden gebruikt in industriële procédés, worden,
      afhankelijk van de resultaten van de risico-inventarisatie en -evaluatie, bedoeld in [artikel 4.85][ref1], ten
      minste respectievelijk de beheersingsniveaus 2, 3 en 4 van bijlage VI bij de richtlijn in acht genomen.

      2 Van industriële procédés, bedoeld in het eerste lid, is sprake indien de arbeid is gericht op het werken met
      biologische agentia van categorie 2, 3 of 4 in reactorvaten van tien liter of meer.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.85
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.100
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4.85'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '9'
  - number: '4.101'
    text: |-
      Indien arbeid als bedoeld in deze paragraaf wordt verricht met biologische agentia die niet op grond van bijlage
      III bij de richtlijn in een van de in [artikel 4.84, derde lid][ref1], bedoelde categorieën zijn ingedeeld, maar
      waarvan wel aanwijzingen bestaan dat deze agentia naar verwachting dienen te worden ingedeeld in categorie 3 of 4,
      wordt ten minste beheersingsniveau 3 van bijlage V respectievelijk VI bij de richtlijn in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.84
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.101
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4.84'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '9'
  - number: '4.102'
    text: |-
      Aan werknemers die arbeid verrichten als bedoeld in [artikel 4.86, eerste en tweede lid][ref1] wordt voorlichting
      en onderricht gegeven, waarbij ten minste aandacht wordt besteed aan:

      a. de mogelijke gevaren voor de gezondheid die zijn verbonden aan het werken met biologische agentia;

      b. de te treffen voorzorgsmaatregelen om blootstelling te voorkomen;

      c. de te nemen actie in geval zich een ongeval voordoet met biologische agentia;

      d. de bestaande hygiënische voorschriften;

      e. het dragen en gebruiken van werkkleding en persoonlijke beschermingsmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.86
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.102
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4.86'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '9'
  - number: '4.103'
    text: |-
      1 [Artikel 4.3][ref1] is niet van toepassing voor zover de [Wet vervoer gevaarlijke stoffen][ref2] van toepassing
      is.

      2 [Artikel 4.7][ref3] is niet van toepassing op tankschepen die zich buiten Nederland bevinden.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.3
      [ref2]: https://wetten.overheid.nl/BWBR0007606
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel4.7
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel4.103
    references:
