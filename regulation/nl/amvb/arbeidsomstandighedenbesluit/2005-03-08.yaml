  - number: 2.5a
    text: |-
      1 De algemene doelstellingen en beginselen van het beleid inzake de beheersing van de risico's van zware
      ongevallen, bedoeld in [artikel 6, eerste lid, van de wet][ref1], worden schriftelijk vastgelegd.

      2 Voor de vaststelling en uitvoering van het beleid, bedoeld in het eerste lid, wordt een veiligheidsbeheerssysteem
      ingevoerd, dat mede wordt gebaseerd op de risico-inventarisatie en -evaluatie, bedoeld in [artikel 2.5b][ref2].

      3 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot het veiligheidsbeheerssysteem, bedoeld
      in het tweede lid.


