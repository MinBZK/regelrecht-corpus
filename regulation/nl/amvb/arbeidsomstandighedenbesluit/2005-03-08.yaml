  - number: 4.2a
    text: |-
      1 In aanvulling op [artikel 4.2][ref1] worden met betrekking tot gevaarlijke stoffen die, gelet op de aard van de
      bedrijvigheid, met enige regelmaat aanwezig zijn of worden toegepast, in de risico-inventarisatie en -evaluatie,
      bedoeld in [artikel 5 van de wet][ref2], voorts de volgende gegevens opgenomen:

      a. de maatregelen die zijn genomen ter naleving van het bepaalde bij of krachtens deze afdeling, alsmede de
      [afdelingen 2][ref3] en [5 van dit hoofdstuk][ref4];

      b. de redelijkerwijs voorzienbare gebeurtenissen die kunnen leiden tot een aanzienlijke toename van de mate van
      blootstelling ook indien er maatregelen als bedoeld in onderdeel a zijn getroffen.

      2 Indien op de arbeidsplaats in verband met de aard van de werkzaamheden die daar worden uitgevoerd, gevaarlijke
      stoffen plegen voor te komen die bij of krachtens de [Wet milieugevaarlijke stoffen][ref5] worden ingedeeld in
      de categorie« voor de voortplanting vergiftig», bedoeld in [artikel 34, tweede lid, onder n, van die wet][ref6],
      alsmede stoffen als bedoeld in [richtlijn nr. 67/548/EEG](31967L0548) van de Raad van de Europese Economische
      Gemeenschap van 27 juni 1967 betreffende de aanpassing van de wettelijke en bestuursrechtelijke bepalingen inzake
      de indeling, de verpakking en het kenmerken van gevaarlijke stoffen (PbEG L 196) die met de waarschuwingszin R64
      worden gekenmerkt overeenkomstig de criteria in paragraaf 3.2.8 van bijlage VI bij deze richtlijn, worden met
      betrekking tot die stoffen in de risico-inventarisatie en -evaluatie, bedoeld in [artikel 5 van de wet][ref7],
      tevens de volgende gegevens vermeld:

      a. de hoeveelheid van de stof die per jaar pleegt te worden vervaardigd of gebruikt dan wel aanwezig pleegt te zijn
      in verband met opslag;

      b. het aantal werknemers dat arbeid pleegt te verrichten op de arbeidsplaats waar de stof pleegt voor te komen;

      c. de vorm van de arbeid die met de stof pleegt te worden verricht;

      d. de wijze waarop de onder b bedoelde werknemers bij hun arbeid aan de stof worden of kunnen worden blootgesteld.


