        artikel: '24'
      - id: ref2
        bwb_id: BWBR0008498
        hoofdstuk: '2'
        afdeling: '4'
  - number: '2.42'
    text: |-
      1 Voor de toepassing van [artikel 19, tweede lid, van de wet][ref1] worden aangewezen de werkzaamheden verricht in
      de winningsindustrie in dagbouw, de ondergrondse winningsindustrie en de winningsindustrie die delfstoffen wint met
      behulp van boringen.

      2 Voor de aanvang van het werk wordt een veiligheids- en gezondheidsdocument opgesteld, waarin ten minste vermeld
      worden:

      a. de risico-inventarisatie en -evaluatie van de gevaren, bedoeld in [artikel 5 van de wet][ref2];

      b. de maatregelen, bedoeld in [artikel 5 van de wet][ref3], waarbij met name aandacht is besteed aan de
      maatregelen die zijn of worden genomen om aan de voorschriften van deze afdeling en de [afdelingen 1][ref4],
      met uitzondering van [paragraaf 2a van die afdeling][ref5], [3][ref6], [3A][ref7], [3B][ref8] en
      [3C van hoofdstuk 3 van dit besluit][ref9] te voldoen;

      c. de maatregelen die zijn genomen om herhaling van ongevallen met ernstig letsel, dodelijke ongevallen of
      situaties als bedoeld in [artikel 2.41, vierde lid][ref10], te voorkomen;

      d. de wijze waarop voldaan is aan [artikel 19, tweede lid, van de wet][ref11], indien op de arbeidsplaats in de
      winningsindustrie meerdere werkgevers arbeid doen verrichten;

      e. de gegevens waaruit blijkt dat het ontwerp, het gebruik en het onderhoud van de arbeidsplaats in de
      winningsindustrie alsmede de arbeidsmiddelen veilig zijn.

      3 In aanvulling op het tweede lid, onder *d*, coördineert de werkgever die verantwoordelijk is voor de
      arbeidsplaats in de winningsindustrie, de uitvoering van alle maatregelen inzake veiligheid en gezondheid en
      geeft hij in het veiligheids- en gezondheidsdocument het doel, de maatregelen en de wijze van uitvoering van deze
      coördinatie aan.

      4 Het veiligheids- en gezondheidsdocument wordt herzien bij iedere belangrijke wijziging, uitbreiding of verbouwing
      van de arbeidsplaats in de winningsindustrie.

      5 Een afschrift van het veiligheids- en gezondheidsdocument wordt gezonden aan de ondernemingsraad of
      personeelsvertegenwoordiging of bij het ontbreken daarvan, aan de belanghebbende werknemers.

      6 De werkzaamheden worden overeenkomstig het veiligheids- en gezondheidsdocument uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel5
