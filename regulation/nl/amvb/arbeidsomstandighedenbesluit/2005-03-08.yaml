  - number: '1.19'
    text: |-
      1 De wet is niet van toepassing op arbeid verricht in respectievelijk op een zeeschip dat niet op grond van
      Nederlandse rechtsregels gerechtigd is de Nederlandse vlag te voeren en dat zich bevindt in de territoriale zee, op
      een van de andere in [artikel 10, eerste lid, van de Scheepvaartverkeerswet][ref1] bedoelde scheepvaartwegen of in
      de haven van Scheveningen.

      2 Het eerste lid geldt niet ten aanzien van aanbouw, verbouwing, herstelling of sloping dan wel onderhoudsof
      reinigingswerkzaamheden en hiermee verband houdende andere werkzaamheden aan de in het eerste lid bedoelde schepen
      die zich in Nederland bevinden alsmede ten aanzien van laden en lossen, tenzij deze arbeid wordt verricht door een
      werknemer die behoort tot de bemanning van een zeeschip als bedoeld in het eerste lid.

      3 De wet is niet van toepassing op arbeid verricht in respectievelijk op een luchtvaartuig als bedoeld in
      [artikel 1, aanhef en onder e, van de Luchtvaartwet][ref2], dat ter beschikking is gesteld aan een niet in
      Nederland gevestigde werkgever, tenzij:

      a. deze werkgever daarin of daarop door in meerderheid in Nederland woonachtige werknemers arbeid doet verrichten;

      b. het betreft laden en lossen, aanbouw, verbouwing, herstelling of sloping dan wel onderhouds- of
      reinigingswerkzaamheden en hiermee verband houdende andere werkzaamheden aan bedoelde luchtvaartuigen die zich in
      Nederland bevinden.

      4 De wet is niet van toepassing op arbeid verricht in respectievelijk op een luchtvaartuig als bedoeld in
      [artikel 1, aanhef en onder f, van de Luchtvaartwet][ref3].

      5 Het vierde lid geldt niet ten aanzien van laden en lossen, aanbouw, verbouwing, herstelling of sloping dan wel
      onderhouds- of reinigingswerkzaamheden en hiermee verband houdende andere werkzaamheden aan de in het vierde lid
      bedoelde luchtvaartuigen die zich in Nederland bevinden.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel1
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel1.19
    references:
      - id: ref1
