  - number: 7.36b
    text: |-
      1 Bij de keuze, de installatie, de ingebruikneming, de werking en het onderhoud van werktuigbouwkundige en
      elektrotechnische apparatuur wordt rekening gehouden met de veiligheid en gezondheid van de werknemers.

      2 Wanneer de apparatuur zich bevindt in een zone waar brand- of explosiegevaar als gevolg van de ontbranding van
      gassen, dampen of vluchtige vloeistoffen bestaat of kan bestaan, is zij aangepast aan gebruik in een dergelijke
      zone. Indien nodig wordt zij voorzien van afdoende beschermingsmiddelen en systemen ter beveiliging bij defecten.

      3 De mechanische apparatuur en installaties bezitten de nodige sterkte, zijn vrij van zichtbare gebreken en
      geschikt voor het gebruik waarvoor zij zijn bestemd. De elektrotechnische apparatuur en installaties hebben de
      nodige kracht en vermogen voor het gebruik waarvoor zij zijn bestemd.

      4 Er wordt een doelmatig plan opgesteld voor het systematisch inspecteren, het onderhouden en, in voorkomend geval,
      het beproeven van de apparatuur en installaties. Onderhoud, inspectie en beproeving van enig onderdeel van de
      apparatuur en installaties wordt uitgevoerd door een daartoe aangewezen deskundig persoon. Er worden doelmatige
      inspectie- en beproevingsrapporten opgesteld en naar behoren bijgehouden.

      5 In aanvulling op [artikel 7.16][ref1] zijn hijs- en hefwerktuigen die in de winningsindustrie met behulp van
      boringen worden gebruikt, voorzien van een doelmatige inrichting, waardoor het dalen van de last te allen tijde
      kan worden stopgezet, zo nodig de snelheid van het dalen kan worden geregeld en onverhoeds dalen van de last wordt
      belet.

      6 In de winningsindustrie met behulp van boringen worden hijs- en hefwerktuigen als bedoeld in
      [artikel 7.18b][ref2] slechts gebruikt voor het verrichten van incidentele werkzaamheden van korte duur op
      boorinstallaties indien de noodzaak daartoe is gebleken.

      7 Bij ministeriële regeling kunnen ten aanzien van het veilig gebruik van de hijs- en hefwerktuigen, bedoeld in het
      zesde lid, nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel7.16
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel7.18b
