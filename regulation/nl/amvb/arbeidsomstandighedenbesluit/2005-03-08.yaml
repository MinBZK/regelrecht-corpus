  - number: 2.5d
    text: |-
      1 Indien in het bedrijf of de inrichting of een onderdeel daarvan of in de toegepaste werkmethoden en
      productiemethoden een verandering van technische of organisatorische aard wordt aangebracht die voor de risico's
      van een zwaar ongeval belangrijke gevolgen kan hebben, of wanneer een verandering in het veiligheidsinzicht daartoe
      aanleiding geeft, wordt er voor zorg gedragen dat:

      a. het beleid, bedoeld in [artikel 2.5a, eerste lid][ref1], en het veiligheidsbeheerssysteem, bedoeld in
      [artikel 2.5a, tweede lid][ref2], opnieuw worden beoordeeld en indien nodig worden herzien;

      b. de risico-inventarisatie en -evaluatie, bedoeld in [artikel 2.5b, eerste lid, onder a][ref3], en de beschrijving
      van scenario's, bedoeld in [artikel 2.5b, eerste lid, onder b][ref4], opnieuw worden beoordeeld en indien nodig
      herzien;

      c. de getroffen maatregelen, bedoeld in [artikel 2.5b, tweede lid][ref5], en het intern noodplan, bedoeld in
      [artikel 2.5c][ref6], dienovereenkomstig worden aangepast aan de gewijzigde situatie.

      2 Onverminderd het eerste lid, wordt de risico-inventarisatie en -evaluatie, bedoeld in
      [artikel 2.5b, eerste lid, onder a][ref7], eenmaal per vijf jaar uitgevoerd.


