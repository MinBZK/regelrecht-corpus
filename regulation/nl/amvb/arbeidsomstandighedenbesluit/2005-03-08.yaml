  - number: '2.7'
    text: |-
      1 Binnen een arbodienst zijn deskundigen werkzaam op het terrein van de arbeids- en bedrijfsgeneeskunde, de
      arbeidshygiëne, de veiligheidskunde en de arbeids- en organisatiekunde.

      2 Een deskundige beschikt over voldoende deskundigheid en ervaring op een vakgebied als bedoeld in het eerste lid,
      indien hij in het bezit is van een certificaat van vakbekwaamheid arbeids- en bedrijfsgeneeskunde, arbeidshygiëne,
      veiligheidskunde dan wel arbeids- en organisatiekunde, dat is afgegeven door Onze Minister of een certificerende
      instelling.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel2.7
  - number: '2.8'
    text: |-
      Indien op een of meer vakgebieden diploma's zijn vereist voor de afgifte van een certificaat van vakbekwaamheid
      als bedoeld in [artikel 2.7, tweede lid][ref1], wordt met die diploma's gelijkgesteld een door Onze Minister of
      een door Onze Minister aangewezen instelling op een van deze vakgebieden afgegeven EG-verklaring als bedoeld in de
      [Algemene wet erkenning EG-hoger-onderwijsdiploma's][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2.7
      [ref2]: https://wetten.overheid.nl/BWBR0006317
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2.7'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0006317
  - number: '2.9'
    text: |-
      1 Een arbodienst:

      a. vervult zijn taken met inachtneming van de stand van de wetenschap en van de algemeen erkende regelen der
      techniek;

      b. adviseert inzake het voeren van een gestructureerd, systematisch en adequaat arbeidsomstandighedenen
      ziekteverzuimbeleid op een wijze die het meest bijdraagt aan de effectuering daarvan, waarbij met name rekening
      wordt gehouden met bijzondere groepen van werknemers en waarbij tevens binnen het bedrijf of de inrichting
      plaatsgevonden gebeurtenissen worden betrokken;

      c. onderkent en beoordeelt de gevaren, zowel van het technisch systeem als van de organisatie en het menselijk
      gedrag, waarbij tevens binnen het bedrijf of de inrichting plaatsgevonden gebeurtenissen worden betrokken;

      d. evalueert de dienstverlening;

      e. draagt zorg voor de continuïteit van de dienstverlening, en

      f. behandelt klachten over de dienstverlening.

      2 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot het functioneren van de arbodienst.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel2.9
  - number: '2.10'
    text: |-
      1 Een externe arbodienst bezit rechtspersoonlijkheid en heeft in hoofdzaak tot doel het vervullen van de taken,
      bedoeld in [artikel 14, derde lid, van de wet][ref1].

      2 Op elk van de in [artikel 2.7, eerste lid][ref2], genoemde vakgebieden is ten minste één deskundige werkzaam
      krachtens een arbeidsovereenkomst of publiekrechtelijke aanstelling voor onbepaalde tijd.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2.7
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '2.7'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '2.11'
    text: |-
      Een arbodienst beschikt over zodanige huisvesting en outillage dat de bescherming van de persoonlijke levenssfeer
      van de werknemers van de aangesloten bedrijven is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel2.11
  - number: '2.12'
    text: |-
      1 De externe arbodienst of de werkgever van de interne arbodienst doet desgevraagd statistische gegevens met
      betrekking tot de uitoefening van de taken toekomen aan Onze Minister.

      2 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de aard van de in het eerste lid
      bedoelde gegevens en de vorm waarin alsmede de frequentie waarmee deze gegevens worden toegezonden.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel2.12
  - number: '2.14'
    text: |-
      1 Een externe arbodienst is in het bezit van een certificaat arbodienst dat is afgegeven door Onze Minister of een
      certificerende instelling.

      2 De werkgever van een interne arbodienst is ten behoeve van zijn interne arbodienst in het bezit van een
      certificaat arbodienst dat is afgegeven door Onze Minister of een certificerende instelling.

      3 Indien een aan een externe arbodienst afgegeven certificaat arbodienst wordt ingetrokken, niet wordt
      verlengd of indien aan de verlenging daarvan voorschriften zijn verbonden, doet de dienst daarvan terstond
      mededeling aan de werkgever te wiens behoeve de taken worden uitgeoefend, en aan de ondernemingsraad of de
      personeelsvertegenwoordiging. Bij het ontbreken van een ondernemingsraad of personeelsvertegenwoordiging zorgt
      de werkgever ervoor dat de belanghebbende werknemers zo spoedig mogelijk van deze mededeling op de hoogte worden
      gesteld.

      4 Indien een ten behoeve van een interne arbodienst afgegeven certificaat arbodienst wordt ingetrokken, niet wordt
      verlengd of indien aan de verlenging daarvan voorschriften zijn verbonden, doet de werkgever daarvan terstond
      mededeling aan de ondernemingsraad of de personeelsvertegenwoordiging of, bij het ontbreken daarvan, aan de
      belanghebbende werknemers.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel2.14
  - number: '2.16'
    text: |-
      In deze afdeling en de daarop berustende bepalingen wordt verstaan onder:

      a. bedrijfshulpverlener: de door een werkgever op grond van [artikel 15, eerste lid, van de wet][ref1] met
      bedrijfshulpverleningstaken belaste werknemer;

      b. bedrijfshulpverlening: de daadwerkelijke uitvoering van de taken op het gebied van de bedrijfshulpverlening,
      bedoeld in [artikel 15, tweede lid, van de wet][ref2], zulks zo nodig in samenwerking met de
      hulpverleningsorganisaties die bij een ongeval of brand een taak hebben;

      c. ongeval: een aan een of meer in een bedrijf of inrichting aanwezige werknemers of andere personen overkomen
      gebeurtenis, niet zijnde brand, die schade aan de gezondheid tot vrijwel onmiddellijk gevolg heeft gehad of direct
      gevaar voor de veiligheid of de gezondheid van die werknemers of andere personen doet ontstaan;

      d. hulpverleningsorganisaties: gespecialiseerde organisaties voor hulpverlening die in het kader van de openbare
      veiligheid of gezondheid opereren.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel15
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel2.16
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '15'
  - number: '2.17'
    text: |-
      Bij de organisatie van bedrijfshulpverlening wordt ten minste rekening gehouden met de volgende factoren:

      a. de aard, de grootte en de ligging van het bedrijf of de inrichting;

      b. de in het bedrijf of de inrichting aanwezige gevaren en de voor het bedrijf of de inrichting maatgevend geachte
      brandscenario’s bij de bepaling waarvan rekening is gehouden met eventueel voor het bedrijf of de inrichting door
      de overheid van toepassing verklaarde uitgangspunten van beveiliging tegen brand;

      c. het redelijkerwijs te verwachten aantal aanwezige werknemers en andere personen alsmede de tijdstippen waarop
      zij aanwezig zijn of plegen te zijn;

      d. het redelijkerwijs te verwachten aantal personen dat zich bij een ongeval of brand niet zelfstandig in
      veiligheid kan brengen;

      e. de opkomsttijd en mogelijkheden van brandweer en andere hulpverleningsorganisaties;

      f. de aanwezigheid van een infrastructuur op het gebied van de arbeidsomstandigheden;

      g. de mogelijkheid om met andere arbeidsorganisaties samen te werken;

      h. de inschakeling van externe deskundigen.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel2.17
  - number: '2.18'
    text: |-
      1 De bedrijfshulpverlening wordt zodanig georganiseerd dat binnen enkele minuten na het plaatsvinden van een
      ongeval of brand de bedrijfshulpverleningstaken op adequate wijze kunnen worden vervuld.

      2 Zodanige organisatorische maatregelen worden genomen dat bij een ongeval of brand na aankomst van
      hulpverleningsorganisaties deze op adequate wijze kunnen worden bijgestaan.

      3 Onder alle omstandigheden en met inachtneming van [artikel 2.19][ref1] zijn bedrijfshulpverleners bereikbaar en
      beschikbaar om bij een ongeval of brand de bedrijfshulpverleningstaken te vervullen.

      4 Indien de veiligheid of de gezondheid van andere werknemers in de nabije omgeving kunnen worden bedreigd, worden
      door de betrokken werkgevers op het gebied van de bedrijfshulpverlening zodanige organisatorische maatregelen
      genomen dat de betrokken bedrijfshulpverleners bij een ongeval of brand over en weer bijstand kunnen verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2.19
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2.19'
        hoofdstuk: '2'
        afdeling: '4'
  - number: '2.19'
    text: |-
      1 Het aantal bedrijfshulpverleners is zodanig dat onder alle omstandigheden de vervulling van de taken op het
      gebied van de bedrijfshulpverlening gewaarborgd is.

      2 Onverminderd het eerste lid is in een bedrijf of inrichting waar ten hoogste 250 werknemers werkzaam plegen te
      zijn, ten minste één bedrijfshulpverlener per 50 of minder aanwezige werknemers aanwezig. Indien in een bedrijf of
      inrichting slechts één werknemer aanwezig is, beschikt deze over doeltreffende middelen om zich bij een ongeval of
      brand snel in veiligheid te kunnen stellen.

      3 Onverminderd het eerste lid zijn in een bedrijf of inrichting waar meer dan 250 werknemers werkzaam plegen te
      zijn, in afwijking van het tweede lid, ten minste vijf bedrijfshulpverleners aanwezig. Het tweede lid, laatste
      volzin, is van toepassing.

      4 Indien werkgevers ter uitvoering van hun taken op het gebied van de bedrijfshulpverlening gezamenlijke
      bedrijfshulpverlening organiseren, worden de afspraken dienaangaande schriftelijk vastgelegd. In dat geval worden
      voor de toepassing van deze afdeling de betrokken bedrijven of inrichtingen als een geheel beschouwd.

      5 De werkgevers die afspraken hebben gemaakt als bedoeld in het vierde lid worden geacht aan de verplichtingen
      op grond van deze afdeling te hebben voldaan, indien de bedrijfshulpverlening voor het geheel van de betrokken
      bedrijven of inrichtingen gewaarborgd is.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel2.19
  - number: '2.20'
    text: |-
      Ten behoeve van de werknemers zijn voldoende biljetten opgehangen waarop op eenvoudige wijze is aangegeven wat te
      doen indien zich een ongeval of brand voordoet.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel2.20
  - number: '2.21'
    text: |-
      1 De bedrijfshulpverleners zijn zodanig opgeleid, dat de bedrijfshulpverlening gewaarborgd is.

      2 Bij ministeriële regeling kunnen voor daarbij aan te wijzen categorieën bedrijven of inrichtingen of in
      verband met bijzondere gevaren, regels worden gesteld met betrekking tot opleiding, deskundigheid en ervaring van
      bedrijfshulpverleners.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel2.21
  - number: '2.22'
    text: |-
      Voor bedrijfshulpverleners worden herhalingscursussen en oefeningen of andere activiteiten georganiseerd
      waaraan de bedrijfshulpverleners deelnemen. Deze cursussen, oefeningen of activiteiten zijn van een zodanige
      inhoud en frequentie dat de kennis en vaardigheden van de bedrijfshulpverleners op het voor een adequate
      bedrijfshulpverlening vereiste niveau gehandhaafd blijven.
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel2.22
  - number: '2.23'
    text: |-
      In deze afdeling wordt verstaan onder:

      a. richtlijn: [Richtlijn nr. 92/57/EEG](31992L0057) van de Raad van de Europese Gemeenschappen van 24 juni 1992
      betreffende de minimumvoorschriften inzake veiligheid en gezondheid voor tijdelijke en mobiele bouwplaatsen (*PbEG*
      L 245);

      b. coördinator voor de ontwerpfase: degene die belast is met de in [artikel 2.30][ref1] genoemde taken inzake
      veiligheid en gezondheid gedurende de studie-, de ontwerp- en de uitwerkingsfase van het ontwerp van een bouwwerk;

      c. coördinator voor de uitvoeringsfase: degene die belast is met de in [artikel 2.34][ref2] genoemde taken inzake
      veiligheid en gezondheid gedurende de totstandbrenging van een bouwwerk.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2.30
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2.34
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel2.23
