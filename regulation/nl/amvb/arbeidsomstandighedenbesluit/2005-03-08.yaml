        artikel: 2.5b
        hoofdstuk: '2'
        afdeling: '2'
  - number: 2.5b
    text: |-
      1 In de risico-inventarisatie en -evaluatie, bedoeld in [artikel 5, eerste lid, van de wet][ref1], worden:

      a. de risico's van ongevallen met gevaarlijke stoffen systematisch geïdentificeerd en geëvalueerd aan de hand
      van daartoe door de werkgever vastgestelde procedures, zowel bij normale werking als bij abnormale werking van
      de installatie of het industrieel chemisch proces. Hierbij wordt tevens rekening gehouden met de aanwezigheid van
      andere stoffen die in een specifieke situatie bij kunnen dragen aan het risico van een zwaar ongeval;

      b. de scenario's voor mogelijke zware ongevallen beschreven. Bij de keuze van de scenario's wordt rekening gehouden
      met externe gevaren voor de installatie. De kans op het ontstaan van een zwaar ongeval en het effect van een
      plaatsgevonden zwaar ongeval worden in de scenario's zoveel mogelijk gekwantificeerd.

      2 Op grond van de risico-inventarisatie en- evaluatie, bedoeld in het eerste lid, onder a, worden:

      a. ter voorkoming van een zwaar ongeval alle technische en organisatorische maatregelen getroffen die nodig zijn om
      de veilige werking van de installaties te garanderen, zowel bij normaal bedrijf als bij tijdelijke onderbrekingen
      of onderhoud, dan wel bij wijziging van bestaande installaties of de bouw van nieuwe installaties. De eerste volzin
      is van overeenkomstige toepassing ten aanzien van alle opslagplaatsen, apparatuur en infrastructuur die samenhangen
      met de risico's van een zwaar ongeval binnen het bedrijf of de inrichting.

      b. alle technische en organisatorische maatregelen getroffen om de gevolgen van een zwaar ongeval zoveel mogelijk
      te beperken.

      3 Een beschrijving van de maatregelen, bedoeld in het tweede lid, wordt opgenomen in de scenariobeschrijvingen,
      bedoeld in het eerste lid, onder b.

      4 Met de beschrijving van de scenario's, bedoeld in het eerste lid, onder b, en de beschrijving van de getroffen
      maatregelen, bedoeld in het derde lid, wordt aangetoond dat de risico's met betrekking tot zware ongevallen op
      adequate wijze worden beheerst.

      5 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de procedures, bedoeld in het eerste
      lid, onder a, en de beschrijving van scenario's, bedoeld in het eerste lid, onder b.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008498/2005-03-08#Artikel2.5b
    references:
