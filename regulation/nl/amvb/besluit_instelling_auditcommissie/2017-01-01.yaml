$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_instelling_auditcommissie
regulatory_layer: AMVB
publication_date: '2016-12-16'
valid_from: '2017-01-01'
bwb_id: BWBR0024324
url: https://wetten.overheid.nl/BWBR0024324/2017-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Justitie van 24 april 2007, Directie Wetgeving, nr. 5479513/07/6;

    Gelet op artikel 21a Wet toezicht accountantsorganisaties en artikel 391 lid 5 en 6 van boek 2 van het Burgerlijk
    Wetboek;

    De Raad van State gehoord (advies van 14 juni 2007, nr. W03.07.0114/II);

    Gezien het nader rapport van 15 juli 2008, nr. 5552473/08/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0024324/2017-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Voor de toepassing van dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0024324/2017-01-01#Artikel1
  - number: 1.a
    text: |-
      *organisatie van openbaar belang:* een organisatie van openbaar belang als bedoeld in
      [artikel 1, eerste lid, onderdeel l, van de Wet toezicht accountantsorganisaties][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel1
    url: https://wetten.overheid.nl/BWBR0024324/2017-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '1'
  - number: 1.b
    text: |-
      *richtlijn:* richtlijn 2006/43/EG van het Europees Parlement en de Raad van 17 mei 2006 betreffende de wettelijke
      controles van jaarrekeningen en geconsolideerde jaarrekeningen, tot wijziging van de Richtlijnen 78/660/EEG en
      83/349/EEG van de Raad, en houdende intrekking van Richtlijn 84/253/EEG van de Raad (PbEU 2006, L 157);
    url: https://wetten.overheid.nl/BWBR0024324/2017-01-01#Artikel1
  - number: 1.c
    text: |-
      *EU-verordening:* Verordening (EU) nr. 537/2014 van het Europees Parlement en de Raad van 16 april 2014 betreffende
      specifieke eisen voor de wettelijke controles van financiële overzichten van organisaties van openbaar belang (PbEU
      2014, L 158).
    url: https://wetten.overheid.nl/BWBR0024324/2017-01-01#Artikel1
  - number: '2.1'
    text: |-
      Een auditcommissie is voor de toepassing van dit artikel samengesteld uit leden van de raad van commissarissen of
      uit leden van het bestuur die niet belast zijn met het uitvoerend bestuur.
    url: https://wetten.overheid.nl/BWBR0024324/2017-01-01#Artikel2
  - number: '2.2'
    text: 'Een organisatie van openbaar belang stelt een auditcommissie in dat de volgende taken uitoefent:'
    url: https://wetten.overheid.nl/BWBR0024324/2017-01-01#Artikel2
  - number: 2.2.a
    text: |-
      het in kennis stellen van het bestuur of de raad van commissarissen van de rechtspersoon van het resultaat van
      de wettelijke controle, waarbij wordt toegelicht op welke wijze de wettelijke controle heeft bijgedragen aan de
      integriteit van de financiële verslaggeving en welke rol de auditcommissie in dat proces heeft gespeeld;
    url: https://wetten.overheid.nl/BWBR0024324/2017-01-01#Artikel2
  - number: 2.2.b
    text: |-
      het monitoren van het financiële-verslaggevingsproces en het doen van voorstellen om de integriteit van het proces
      te waarborgen;
    url: https://wetten.overheid.nl/BWBR0024324/2017-01-01#Artikel2
  - number: 2.2.c
    text: |-
      het monitoren van de doeltreffendheid van het interne beheersingssysteem, het eventuele interne auditsysteem en het
      risicomanagementsysteem met betrekking tot de financiële verslaggeving van de rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0024324/2017-01-01#Artikel2
  - number: 2.2.d
    text: |-
      het monitoren van de wettelijke controle van de jaarrekening en de geconsolideerde jaarrekening, in het
      bijzonder de uitvoering van de controle met inachtneming van de beoordeling van de Autoriteit Financiële Markten
      overeenkomstig artikel 26, zesde lid, van de EU-verordening;
    url: https://wetten.overheid.nl/BWBR0024324/2017-01-01#Artikel2
  - number: 2.2.e
    text: |-
      het beoordelen en monitoren van de onafhankelijkheid van de externe accountant bedoeld in
      [artikel 1, eerste lid, onderdeel f, van de Wet toezicht accountantsorganisaties][ref1] of de
      accountantsorganisatie dan wel het auditkantoor bedoeld in artikel 1, eerste lid, onderdelen a en c van die wet,
      waarbij met name wordt gelet op de verlening van nevendiensten aan de rechtspersoon;


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel1
    url: https://wetten.overheid.nl/BWBR0024324/2017-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '1'
  - number: 2.2.f
    text: |-
      het vaststellen van de procedure voor de selectie van de externe accountant of de accountantsorganisatie dan wel
      het auditkantoor en de voordracht tot verlening van de opdracht tot het verrichten van de wettelijke controle
      overeenkomstig artikel 16 van de EU-verordening.
    url: https://wetten.overheid.nl/BWBR0024324/2017-01-01#Artikel2
  - number: '2.3'
    text: |-
      Bij de samenstelling van de auditcommissie wordt rekening gehouden met de benodigde deskundigheid van de leden
      gezamenlijk die relevant is voor de sector waarin de rechtspersoon actief is. De meerderheid van de leden,
      waaronder de voorzitter, is onafhankelijk van de rechtspersoon. De voorzitter wordt benoemd door de raad van
      commissarissen of door de leden van het bestuur die niet belast zijn met het uitvoerend bestuur dan wel door de
      leden van de auditcommissie. Ten minste één lid is deskundig op het gebied van financiële verslaggeving of de
      controle van de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0024324/2017-01-01#Artikel2
  - number: '2.4'
    text: |-
      In afwijking van het tweede lid kan een orgaan worden aangewezen dat de taken van de auditcommissie uitoefent. Het
      derde lid is van overeenkomstige toepassing. In het bestuursverslag wordt opgave gedaan van het aangewezen orgaan
      en de samenstelling daarvan.
    url: https://wetten.overheid.nl/BWBR0024324/2017-01-01#Artikel2
  - number: '3'
    text: 'Dit besluit is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0024324/2017-01-01#Artikel3
  - number: 3.a
    text: |-
      een dochtermaatschappij als bedoeld in [artikel 24a, eerste lid, van boek 2 van het Burgerlijk Wetboek][ref1]
      van een rechtspersoon die voldoet aan artikel 39 leden 1, 2 en 5 van de richtlijn en artikel 11, leden 1 en 2, en
      artikel 16, lid 5, van de EU-verordening;


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24a
    url: https://wetten.overheid.nl/BWBR0024324/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24a
  - number: 3.b
    text: |-
      een bank waarop een vrijstelling als bedoeld in
      [artikel 3:111, eerste lid, van de Wet op het financieel toezicht][ref1] van toepassing is indien een centrale
      kredietinstelling de in [artikel 2, tweede lid][ref2], genoemde taken heeft opgedragen aan een auditcommissie
      waarvan de samenstelling voldoet aan artikel 2, eerste en derde lid;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024324#Artikel2
    url: https://wetten.overheid.nl/BWBR0024324/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0024324
        artikel: '2'
  - number: 3.a
    text: |-
      een beleggingsinstelling of icbe als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1] die is
      opgenomen in het register als bedoeld in [artikel 1:107 van de Wet op het financieel toezicht][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0024324/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 3.b
    text: |-
      een entiteit voor securitisatiedoeleinden als bedoeld in [artikel 1 van het Besluit prudentiële regels Wft][ref1],
      mits de onderneming aan het publiek bekend maakt waarom zij het niet dienstig acht een auditcommissie in te
      stellen, of een orgaan aan te wijzen in de zin van [artikel 2, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0024324#Artikel2
    url: https://wetten.overheid.nl/BWBR0024324/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0024324
        artikel: '2'
  - number: '4'
    text: |-
      Dit besluit is van toepassing op een bestuursverslag dat betrekking heeft op een boekjaar dat aanvangt op of na 1
      januari 2008.
    url: https://wetten.overheid.nl/BWBR0024324/2017-01-01#Artikel4
  - number: '5'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0024324/2017-01-01#Artikel5
  - number: '6'
    text: 'Dit besluit wordt aangehaald als: Besluit instelling auditcommissie.'
    url: https://wetten.overheid.nl/BWBR0024324/2017-01-01#Artikel6
