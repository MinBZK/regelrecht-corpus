preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op voordracht van Onze Minister van Landbouw en Visserij van 20 juni 1974, No. J. 1210, Directie Juridische en
    Bedrijfsorganisatorische Zaken;

    Gelet op artikel 2, tweede lid, van de Uitvoeringswet Visserijverdrag 1967 (Stb. 1973. 476);

    De Raad van State gehoord (advies van 3 juli 1974, No. 14);

    Gezien het nader rapport van Onze voornoemde Minister van Landbouw en Visserij van 12 juli 1974, No. J. 1356,
    Directie Juridische en Bedrijfsorganisatorische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002930/1998-03-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Dit besluit verstaat onder:

      a. "wet": de [Uitvoeringswet Visserijverdrag 1967][ref1];

      b. "document": het document bedoeld in artikel 2, eerste lid van de wet;

      c. "vissersvaartuig": een vaartuig als bedoeld in artikel 1, eerste lid, onder *b*, van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002897
    url: https://wetten.overheid.nl/BWBR0002930/1998-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002897
  - number: '2'
    text: |-
      Het document is van het als bijlage bij dit besluit gevoegd model.

      Het document wordt gedrukt op wit papier.
    url: https://wetten.overheid.nl/BWBR0002930/1998-03-01#Artikel2
  - number: '3'
    text: |-
      Bij de aanvrage ter verkrijging van een document moeten worden overgelegd:

      a. enig bewijsstuk van eigendom van het vissersvaartuig, waarop de aanvrage betrekking heeft;

      b. bescheiden waaruit blijkt dat het vaartuig voor ten minste twee derde gedeelte toebehoort aan één of meer
      natuurlijke personen of rechtspersonen als bedoeld in [artikel 1, tweede lid, onderdelen ][ref1];

      c. een afschrift van het bewijs, bedoeld in
      [artikel 6, vijfde lid, van het Besluit registratie vissersvaartuigen 1998][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002897#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009353#Artikel6
    url: https://wetten.overheid.nl/BWBR0002930/1998-03-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002897
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0009353
        artikel: '6'
  - number: '4'
    text: |-
      1 Dit besluit kan worden aangehaald als "Besluit nationaliteitsbewijs vissersvaartuigen".

      2 Dit besluit treedt in werking op het tijdstip, waarop de wet in werking treedt.
    url: https://wetten.overheid.nl/BWBR0002930/1998-03-01#Artikel4
