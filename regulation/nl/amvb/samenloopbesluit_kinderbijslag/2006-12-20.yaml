articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder de wet: de [Algemene Kinderbijslagwet][ref1] (*Stb.* 1990, 128).


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0005361/2006-12-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: '2'
    text: |-
      Indien voor een kind, dat niet als eigen kind, aangehuwd kind of pleegkind behoort tot een huishouden, over
      eenzelfde tijdvak recht op kinderbijslag bestaat voor twee personen van wie één persoon krachtens overeenkomst of
      rechterlijke uitspraak verplicht is bijdragen te leveren voor levensonderhoud ten behoeve van dat kind, wordt de
      kinderbijslag, waarop laatstbedoeld persoon recht heeft, niet betaald.
    url: https://wetten.overheid.nl/BWBR0005361/2006-12-20#Artikel2
  - number: '3'
    text: |-
      In afwijking van [artikel 2 van dit besluit][ref1] en van [artikel 18, vierde lid, van de wet][ref2], wordt de
      kinderbijslag betaald aan degene die de hoogste bijdrage in het onderhoud van het kind levert indien:

      a. voor een kind over eenzelfde tijdvak recht op kinderbijslag bestaat voor twee personen;

      b. één van deze personen, tot wiens huishouden het kind niet behoort, krachtens overeenkomst of rechterlijke
      uitspraak, verplicht is bijdragen te leveren voor levensonderhoud ten behoeve van dat kind;

      c. deze overeenkomst of uitspraak tot stand is gekomen vóór 1 januari 1982, en

      d. deze overeenkomst of rechterlijke uitspraak geen bepaling bevat op grond waarvan de kinderbijslag waarop de
      laatstgenoemd persoon recht heeft, aan de andere persoon moet worden afgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005361#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel18
    url: https://wetten.overheid.nl/BWBR0005361/2006-12-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005361
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '18'
  - number: '4'
    text: |-
      Indien voor een kind:

      a. jonger dan 16 jaar dat hetzij door of in verband met het volgen van onderwijs of van een beroepsopleiding,
      hetzij door of in verband met ziekte of gebreken vermoedelijk het eerstkomende jaar niet als eigen kind, aangehuwd
      kind of pleegkind tot een huishouden zal behoren, of

      b. van 16 jaar of ouder dat niet als eigen kind, aangehuwd kind of pleegkind tot een huishouden behoort,

      recht bestaat op kinderbijslag voor twee of meer personen, in andere situaties dan bedoeld in
      [artikel 18, tweede lid, van de wet][ref1], en in [artikel 2][ref2], waarbij geen van die personen het kind
      grotendeels onderhoudt, wordt, in afwijking van [artikel 18, vijfde lid, van de wet][ref3], de kinderbijslag
      betaald aan degene die de hoogste bijdrage in het onderhoud van het kind levert, alsmede aan degene die de op één
      na hoogste bijdrage in het onderhoud van dit kind levert. Aan andere personen wordt geen kinderbijslag betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005361#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002368#Artikel18
    url: https://wetten.overheid.nl/BWBR0005361/2006-12-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0005361
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0002368
        artikel: '18'
  - number: '5'
    text: |-
      Indien de samenloop, bedoeld in [artikel 4, onderdeel b][ref1], betrekking heeft op een kind van 18 jaar of ouder,
      waarbij een persoon dit kind grotendeels onderhoudt en een ander persoon dit kind in belangrijke mate onderhoudt,
      wordt, in afwijking van [artikel 18, vijfde lid, van de wet][ref2], de kinderbijslag aan elk van deze personen
      betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005361#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel18
    url: https://wetten.overheid.nl/BWBR0005361/2006-12-20#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005361
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '18'
  - number: 5a
    text: |-
      1 Indien twee personen op basis van een overeenkomst een kind overwegend in gelijke mate verzorgen en onderhouden,
      zonder met elkaar een gemeenschappelijke huishouding te voeren, wordt, tenzij in de overeenkomst anders is
      overeengekomen, de kinderbijslag waarop één van deze personen voor dit kind recht heeft, gelijk verdeeld betaald
      aan deze personen terwijl de kinderbijslag waarop de andere persoon recht heeft, niet wordt uitbetaald.

      2 Indien twee of meer personen recht hebben op kinderbijslag voor eenzelfde kind en niet duidelijk is tot wiens
      huishouden het kind behoort, wordt, tenzij duidelijk is wat deze personen daarover zijn overeengekomen, de
      kinderbijslag waarop één van deze personen voor dit kind recht heeft, gelijkelijk verdeeld over de huishoudens
      waartoe deze personen behoren en uitbetaald aan één persoon per huishouden terwijl de kinderbijslag waarop de
      andere personen recht hebben, niet wordt uitbetaald.
    url: https://wetten.overheid.nl/BWBR0005361/2006-12-20#Artikel5a
  - number: '6'
    text: Dit besluit kan worden aangehaald onder de titel "Samenloopbesluit kinderbijslag".
    url: https://wetten.overheid.nl/BWBR0005361/2006-12-20#Artikel6
