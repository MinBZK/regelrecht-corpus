---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_in_vitro_diagnostica
regulatory_layer: AMVB
publication_date: '2020-05-07'
valid_from: '2016-01-01'
bwb_id: BWBR0012610
url: https://wetten.overheid.nl/BWBR0012610/2016-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport van 26 oktober 2000, GMV/MH 2120408,
    gedaan na bekendmaking van het ontwerp van dit besluit in de Staatscourant van 27 oktober 1999, nr. 207;

    Gelet op

    – Richtlijn 98/79/EG van het Europees Parlement en de Raad van 27 oktober 1998 betreffende medische hulpmiddelen
    voor in-vitro diagnostiek (PbEG L 331), artikel 3, eerste lid, van de Wet op de medische hulpmiddelen;

    De Raad van State gehoord (advies van 16 maart 2001, No. W13.00.0503/III);

    Gezien het nader rapport van Onze Minister van Volksgezondheid, Welzijn en Sport van juni 2001, GMV/L 2166009.

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel1
  - number: 1.1.a
    text: |-
      *in-vitro diagnosticum:* een medisch hulpmiddel dat een reagens, een reactief product, een kalibratiemateriaal,
      een controlemateriaal, een kit, een instrument, een apparaat, een toestel of een systeem is dat afzonderlijk of
      in combinatie wordt gebruikt en door de fabrikant is bestemd om te worden gebruikt voor het in-vitro onderzoek van
      specimens die afkomstig zijn van het menselijk lichaam, met inbegrip van donorbloed en -weefsel, uitsluitend of
      hoofdzakelijk met het doel om informatie te verschaffen: - over een fysiologische of pathologische toestand, of
        - over een aangeboren afwijking, of
        - om de veiligheid en de mate van verenigbaarheid met potentiële ontvangers te bepalen, of
        - om de uitwerking van therapeutische maatregelen te toetsen.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel1
  - number: 1.1.b
    text: |-
      *hoog-risicodiagnosticum*: een in-vitrodiagnosticum, uitsluitend of hoofdzakelijk bedoeld voor: - het detecteren,
      confirmeren en kwantificeren van de aanwezigheid in menselijke specimens van merkers van besmetting met HIV, HTLV I
      en II, en hepatitis B, C en D;
        - de bepaling van tumormerkstoffen;
        - de diagnose van erfelijke ziekten;
        - voorspellend genetisch onderzoek.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel1
  - number: 1.1.c
    text: |-
      *controle- en kalibratiemateriaal:*een stof, materiaal of artikel, door de fabrikant ontworpen om een
      maatverhouding aan te geven, dan wel om de prestatiekenmerken van een in-vitro diagnosticum in relatie tot de
      bestemming, te controleren;
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel1
  - number: 1.1.d
    text: |-
      *recipiënt voor specimens:*een medisch hulpmiddel, al dan niet van het vacuümtype, dat door de fabrikant speciaal
      is bestemd om specimens afkomstig van het menselijk lichaam rechtstreeks op te vangen en te bewaren met het oog op
      in-vitro diagnostiek;
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel1
  - number: 1.1.e
    text: |-
      *hulpstuk:* een product dat geen in-vitro diagnosticum is maar door de fabrikant speciaal is bestemd om samen met
      een in-vitro diagnosticum te worden gebruikt zodat dat in-vitro diagnosticum overeenkomstig zijn bestemming kan
      worden aangewend;
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel1
  - number: 1.1.f
    text: |-
      *voor zelftesten bestemd in-vitro diagnosticum:*een in-vitro diagnosticum dat door de fabrikant is bestemd om door
      leken in een thuissituatie te kunnen worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel1
  - number: 1.1.g
    text: |-
      *voor doeltreffendheidsonderzoek bestemd in-vitro diagnosticum:*een in-vitro diagnosticum dat door de fabrikant is
      bestemd om één of meerdere malen op zijn prestatievermogen te worden onderzocht in medische laboratoria of in een
      andere daarvoor geschikte omgeving buiten zijn eigen bedrijfsruimten;
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel1
  - number: 1.1.h
    text: |-
      *nieuw type in-vitro diagnosticum:* een type in-vitro diagnosticum: - dat zich voor wat betreft de te onderzoeken
      stof of een andere parameter onderscheidt van een ander type dat de voorgaande drie jaar ononderbroken in een
      lidstaat in de handel is geweest, of
        - bij de toepassing waarvan gebruik wordt gemaakt van een analysetechnologie die gedurende drie voorafgaande jaren
      niet permanent bij een te onderzoeken stof of een andere parameter is gebezigd;
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel1
  - number: 1.1.i
    text: '*fabrikant:* de persoon, rechtspersoon daaronder begrepen, of diens gemachtigde, die:'
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel1
  - number: 1.1.i.1°
    text: |-
      verantwoordelijk is voor het ontwerp, de vervaardiging, de verpakking en de etikettering van een in-vitro
      diagnosticum met het oog op het in de handel brengen ervan onder eigen naam, ongeacht of deze verrichtingen door
      diezelfde persoon of onder zijn verantwoordelijkheid door een derde worden uitgevoerd; of
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel1
  - number: 1.1.i.2°
    text: |-
      één of meer geprefabriceerde producten assembleert, verpakt, behandelt, vernieuwt of etiketteert of tot in-vitro
      diagnosticum bestemt om deze producten onder eigen naam in de handel te brengen;
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel1
  - number: 1.1.j
    text: |-
      *gemachtigde:* de in een lidstaat gevestigde persoon, rechtspersoon daaronder begrepen die, na daartoe
      uitdrukkelijk door de fabrikant te zijn aangewezen, namens die fabrikant handelt en in diens plaats in rechte
      kan worden aangesproken ten aanzien van de verplichtingen die bij of krachtens dit besluit aan de fabrikant zijn
      opgelegd;
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel1
  - number: 1.1.k
    text: |-
      *bestemming:* het gebruik waartoe het in-vitro diagnosticum is bestemd volgens de aanwijzingen die de fabrikant op
      het etiket, de gebruiksaanwijzing of in het reclamemateriaal verschaft;
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel1
  - number: 1.1.l
    text: |-
      *in de handel brengen:*het voor het eerst tegen betaling of kosteloos afleveren van een in-vitro diagnosticum dat
      niet is bestemd voor doeltreffendheidsonderzoek, met het oog op de distributie of het gebruik ervan op de markt van
      een lidstaat, ongeacht of het gaat om een nieuw of een vernieuwd in-vitro diagnosticum;
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel1
  - number: 1.1.m
    text: '*aangemelde instantie:* de ter uitvoering van artikel 15 van de richtlijn aangewezen instantie;'
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel1
  - number: 1.1.n
    text: |-
      *lidstaat:*de staat die lid is van de Europese Unie, alsmede de staat die partij is bij de Overeenkomst betreffende
      de Europese Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel1
  - number: 1.1.o
    text: |-
      *richtlijn:* [Richtlijn nr. 98/79/EG](31998L0079) van het Europees Parlement en de Raad van 27 oktober 1998
      betreffende medische hulpmiddelen voor in-vitro diagnostiek (PbEG L 331) naar de tekst zoals deze bij die richtlijn
      is vastgesteld;
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel1
  - number: 1.1.p
    text: '*CE-markering:*de markering overeenkomstig het model opgenomen in bijlage X van de richtlijn.'
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel1
  - number: '1.2'
    text: |-
      Onder een in-vitro diagnosticum wordt eveneens begrepen: - een recipiënt voor specimens;
        - een product voor laboratoriumgebruik, uit de kenmerken waarvan blijkt dat het door de fabrikant speciaal is
      bestemd om bij in-vitro diagnostiek te worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel1
  - number: '1.3'
    text: |-
      Onder een hulpstuk wordt niet begrepen een onder de toepassing van het [Besluit medische hulpmiddelen][ref1]
      vallend invasief medisch hulpmiddel voor het nemen van specimens, alsmede een medisch hulpmiddel dat rechtstreeks
      in aanraking met het menselijk lichaam wordt gebracht om specimens te verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0007307
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007307
  - number: '1.4'
    text: |-
      Onder een fabrikant wordt niet begrepen een persoon, rechtspersoon daaronder begrepen, die in-vitro diagnostica die
      reeds in de handel zijn gebracht, assembleert voor een individuele patiënt, of aanpast overeenkomstig hun beoogde
      bestemming.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel1
  - number: '1.5'
    text: |-
      Een wijziging van een of meer bijlagen van de richtlijn gaat voor de toepassing van dit besluit gelden met ingang
      van de dag waarop aan de betrokken wijziging uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel1
  - number: '2.1'
    text: |-
      Dit besluit is mede van toepassing op het hulpstuk en op de software die voor de goede werking van het in-vitro
      diagnosticum benodigd zijn.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel2
  - number: '2.2'
    text: |-
      Dit besluit is niet van toepassing op een in-vitro diagnosticum dat uitsluitend wordt toegepast door één en
      dezelfde instelling in de zin van [artikel 1, eerste lid, Wet kwaliteit, klachten en geschillen zorg][ref1]
      en binnen de bedrijfsruimte waarin het is vervaardigd of in een belendende ruimte, zonder dat er sprake is van
      aflevering aan een andere rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel1
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '1'
  - number: '3.1'
    text: |-
      Het is de fabrikant verboden een in-vitro diagnosticum voorhanden te hebben of af te leveren indien niet is voldaan
      aan de [artikelen 4 tot en met 8][ref1] en [10][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012610#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0012610#Artikel10
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012610
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0012610
        artikel: '10'
  - number: '3.2'
    text: |-
      Het is een ander dan de fabrikant verboden een in-vitro diagnosticum voorhanden te hebben of af te leveren indien
      met betrekking tot het in-vitro diagnosticum niet is voldaan aan de [artikelen 12][ref1] en [13][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012610#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0012610#Artikel13
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012610
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0012610
        artikel: '13'
  - number: '3.3'
    text: |-
      Het is verboden een in-vitro diagnosticum voor het eerst toe te passen indien het in-vitro diagnosticum niet met
      inachtneming van de [artikelen 4 tot en met 8][ref1], [10][ref2], [12][ref3] en [13][ref4] is afgeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0012610#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0012610#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0012610#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0012610#Artikel13
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012610
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0012610
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0012610
        artikel: '12'
      - id: ref4
        bwb_id: BWBR0012610
        artikel: '13'
  - number: '3.4'
    text: 'Het is aan anderen dan de hieronder genoemden verboden een hoog-risicodiagnosticum aan gebruikers af te leveren:'
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel3
  - number: 3.4.a
    text: een arts;
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel3
  - number: 3.4.b
    text: een apotheker.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel3
  - number: '4.1'
    text: |-
      De fabrikant die een in-vitro diagnosticum in de handel brengt, deelt alvorens de aflevering plaatsvindt, aan de
      daartoe door Onze Minister aangewezen overheidsinstantie mee:
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel4
  - number: 4.1.a
    text: |-
      zijn woonplaats in de zin van [artikel 10, Boek 1, van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel10
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '10'
  - number: 4.1.b
    text: |-
      met betrekking tot de reagentia, de reactieve producten, het calibratie- en controlemateriaal, de gegevens in
      termen van gemeenschappelijke technologische kenmerken of de te onderzoeken stoffen, alsmede alle belangrijke
      wijzigingen daarvan, met inbegrip van beëindiging van het in de handel brengen;
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel4
  - number: 4.1.c
    text: met betrekking tot de overige in-vitro diagnostica, de passende gegevens;
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel4
  - number: 4.1.d
    text: |-
      met betrekking tot de in bijlage II van de richtlijn bedoelde in-vitro diagnostica, alsmede de in-vitro diagnostica
      die voor zelftesten zijn bestemd: - alle gegevens ter identificatie van deze in-vitro diagnostica;
        - de analytische, en in voorkomend geval, de in bijlage I, deel A, punt 3, van de richtlijn, bedoelde diagnostische
      parameters;
        - de resultaten van het in bijlage VIII van de richtlijn bedoelde doeltreffendheidsonderzoek;
        - de certificaten alsmede alle belangrijke wijzigingen daarvan, met inbegrip van beëindiging van het in de handel
      brengen.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel4
  - number: '4.2'
    text: |-
      Indien de in het eerste lid bedoelde kennisgeving betrekking heeft op een nieuw type in-vitro diagnosticum,
      voorzien van de CE-markering, vermeldt de fabrikant dit in de kennisgeving. In dit geval kan de in het eerste lid
      bedoelde overheidsinstantie gedurende twee jaar na het in de handel brengen van dat in-vitro diagnosticum van de
      fabrikant verlangen dat deze een rapport indient over de ervaring die met het in-vitro diagnosticum is opgedaan.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel4
  - number: '4.3'
    text: De buiten een lidstaat gevestigde fabrikant wijst een gemachtigde aan.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel4
  - number: '5.1'
    text: |-
      Een in-vitro diagnosticum voldoet aan de in bijlage I van de richtlijn opgenomen eisen, met inachtneming van de
      bestemming van het betrokken in-vitro diagnosticum.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel5
  - number: '5.2'
    text: |-
      Onze Minister wijst ter uitvoering van artikel 5 van de richtlijn gemeenschappelijke technische specificaties
      aan bij het voldoen waaraan de in-vitro diagnostica, vermeld in bijlage II, onder lijst A, van de richtlijn en
      voorzover van toepassing, de in-vitro diagnostica vermeld in bijlage II, onder lijst B, van de richtlijn worden
      beschouwd te voldoen aan de in het eerste lid bedoelde eisen.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel5
  - number: '5.3'
    text: |-
      Onze Minister wijst ter uitvoering van artikel 5 van de richtlijn normen aan, bij het voldoen waaraan in-vitro
      diagnostica worden beschouwd te voldoen aan de in het eerste lid bedoelde eisen.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel5
  - number: '5.4'
    text: |-
      De referenties van de aangewezen gemeenschappelijke technische specificaties en normen worden in de Staatscourant
      bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel5
  - number: '6.1'
    text: |-
      De in bijlage I, deel B, punt 8, van de richtlijn bedoelde informatie die aan de gebruiker moet worden verstrekt,
      is opgesteld in de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel6
  - number: '6.2'
    text: |-
      Indien het in-vitro diagnosticum is bestemd om uitsluitend te worden afgeleverd aan een instelling waar in een
      professionele omgeving in-vitro diagnostiek plaatsvindt, kan in afwijking van het eerste lid de in dat lid bedoelde
      informatie in de Engelse taal zijn opgesteld, onder de voorwaarde dat de persoon die het in-vitro diagnosticum voor
      het eerst gaat toepassen beschikt over een adequate beheersing van de Engelse taal.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel6
  - number: '6.3'
    text: |-
      Indien een in-vitro diagnosticum is bestemd om uitsluitend aan een in een andere lidstaat gevestigde gebruiker of
      persoon die het in-vitro diagnosticum voor het eerst gaat toepassen te worden afgeleverd, kan in afwijking van het
      eerste lid de in dat lid bedoelde informatie worden opgesteld in de door die lidstaat vastgestelde taal.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel6
  - number: '7.1'
    text: Een in-vitro diagnosticum is voorzien van de CE-markering.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel7
  - number: '7.2'
    text: |-
      Een in-vitro diagnosticum is slechts voorzien van de CE-markering indien het aan de in bijlage I van de richtlijn
      opgenomen eisen voldoet.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel7
  - number: '7.3'
    text: De CE-markering wordt niet aangebracht op een product dat niet een in-vitro diagnosticum is.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel7
  - number: '7.4'
    text: |-
      In afwijking van het eerste lid is een in-vitro diagnosticum dat voor doeltreffendheidsonderzoek is bestemd, niet
      voorzien van de CE-markering.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel7
  - number: '7.5'
    text: |-
      De CE-markering is vergezeld van het identificatienummer van de aangemelde instantie die de in de bijlagen III,
      IV, VI en VII van de richtlijn bedoelde procedures heeft uitgevoerd of van de aangemelde instantie die de door een
      andere lidstaat vastgestelde procedures heeft uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel7
  - number: '7.6'
    text: |-
      De CE-markering en het in het vijfde lid bedoelde identificatienummer zijn zichtbaar, leesbaar en onuitwisbaar
      aangebracht op het in-vitro diagnosticum, voorzover dat technisch uitvoerbaar is, op de gebruiksaanwijzing en op de
      verpakking waarin het in-vitro diagnosticum in de handel wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel7
  - number: '7.7'
    text: |-
      Een in-vitro diagnosticum is niet voorzien van een markering of opschrift waardoor verwarring zou kunnen
      ontstaan over de betekenis of de grafische vormgeving van de CE-markering; indien op het in-vitro diagnosticum,
      de verpakking of op de gebruiksaanwijzing andere markeringen zijn aangebracht, dan verminderen zij niet de
      zichtbaarheid en leesbaarheid van de CE-markering.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel7
  - number: '8.1'
    text: Dit artikel is niet van toepassing op een in-vitro diagnosticum dat voor doeltreffendheidsonderzoek is bestemd.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel8
  - number: '8.2'
    text: |-
      Voor de beoordeling of een in bijlage II, onder lijst A, van de richtlijn bedoeld in-vitro diagnosticum aan de in
      [artikel 5, eerste lid][ref1], bedoelde eisen voldoet volgt de fabrikant, teneinde de CE-markering aan te brengen,
      één van de volgende procedures:


      [ref1]: https://wetten.overheid.nl/BWBR0012610#Artikel5
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0012610
        artikel: '5'
  - number: 8.2.a
    text: de in bijlage IV van de richtlijn omschreven procedure inzake de EG-verklaring van overeenstemming, of
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel8
  - number: 8.2.b
    text: |-
      de in bijlage V van de richtlijn omschreven procedure inzake het EG-typeonderzoek in combinatie met de in bijlage
      VII van de richtlijn omschreven procedure inzake de EG-verklaring van overeenstemming.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel8
  - number: '8.3'
    text: |-
      Voor de beoordeling of een in bijlage II, onder lijst B, van de richtlijn bedoeld in-vitro diagnosticum aan de in
      [artikel 5, eerste lid][ref1], bedoelde eisen voldoet volgt de fabrikant, teneinde de CE-markering aan te brengen,
      één van de volgende procedures:


      [ref1]: https://wetten.overheid.nl/BWBR0012610#Artikel5
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0012610
        artikel: '5'
  - number: 8.3.a
    text: |-
      de in bijlage IV van de richtlijn omschreven procedure inzake de EG-verklaring van overeenstemming, met
      uitzondering van de onder de punten 4 en 6 van die bijlage omschreven procedure, of
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel8
  - number: 8.3.b
    text: de in bijlage V van de richtlijn omschreven procedure inzake het EG-typeonderzoek in combinatie met
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel8
  - number: 8.3.b.1
    text: hetzij de in bijlage VI van de richtlijn omschreven procedure inzake de EG-keuring;
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel8
  - number: 8.3.b.2
    text: hetzij de in bijlage VII van de richtlijn omschreven procedure inzake de EG-verklaring van overeenstemming.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel8
  - number: '8.4'
    text: |-
      Voor de beoordeling of een in-vitro diagnosticum dat is bestemd voor zelftesten, aan de in
      [artikel 5, eerste lid][ref1], bedoelde eisen voldoet volgt de fabrikant de in bijlage III van de richtlijn
      omschreven procedure inzake de EG-verklaring van overeenstemming of de in het tweede of derde lid bedoelde
      procedure. Indien de fabrikant de in bijlage III van de richtlijn omschreven procedure volgt, stelt hij vóór het in
      de handel brengen van het in-vitro diagnosticum de in die bijlage bedoelde verklaring van overeenstemming op.


      [ref1]: https://wetten.overheid.nl/BWBR0012610#Artikel5
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0012610
        artikel: '5'
  - number: '8.5'
    text: |-
      Voor de beoordeling of een ander in-vitro diagnosticum dan bedoeld in het tweede tot en met het vierde lid, aan
      de in [artikel 5, eerste lid][ref1], bedoelde eisen voldoet volgt de fabrikant de in bijlage III van de richtlijn
      omschreven procedure inzake de EG-verklaring van overeenstemming met uitzondering van de in punt 6 van die bijlage
      omschreven procedure. Vóór het in de handel brengen van het in-vitro diagnosticum stelt hij de in die bijlage
      bedoelde verklaring van overeenstemming op.


      [ref1]: https://wetten.overheid.nl/BWBR0012610#Artikel5
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0012610
        artikel: '5'
  - number: '8.6'
    text: |-
      Onze Minister kan ter uitvoering van artikel 14 van de richtlijn of het krachtens dat artikel bepaalde: - de in
      bijlage II van de richtlijn opgenomen lijsten van in-vitro diagnostica wijzigen of uitbreiden;
        - voor de beoordeling van een in-vitro diagnosticum of een categorie van in-vitro diagnostica, in afwijking van het
      tweede tot en met vijfde lid,éé n of meer van de in die leden bedoelde andere procedures aanwijzen.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel8
  - number: '8.7'
    text: |-
      In geval een conformiteitsbeoordelingsprocedure de tussenkomst van een aangemelde instantie vooronderstelt, wendt
      de fabrikant zich tot een aangemelde instantie van zijn keuze in het kader van de taken waarvoor die instantie
      is aangemeld.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel8
  - number: '8.8'
    text: |-
      Tijdens de conformiteitsbeoordelingsprocedure houdt de fabrikant en, indien deze daarbij betrokken is, de
      aangemelde instantie rekening met de beschikbare resultaten van beoordelings- en keuringswerkzaamheden die
      eventueel overeenkomstig de bepalingen van dit besluit in een tussenstadium van de fabricage hebben plaatsgevonden.
      De aangemelde instantie houdt voorts rekening met alle relevante informatie over de kenmerken en de prestaties van
      de in-vitro diagnostica en met name ook met de resultaten van eventuele relevante proeven en keuringen die reeds
      zijn uitgevoerd overeenkomstig de daarop betrekking hebbende bepalingen zoals die golden onmiddellijk voor het
      tijdstip van inwerkingtreding van dit besluit.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel8
  - number: '8.9'
    text: |-
      De fabrikant houdt de in het tweede tot en met vijfde lid bedoelde EG-verklaring van overeenstemming, de
      in de bijlagen III tot en met VIII van de richtlijn bedoelde technische documentatie, alsmede de door de
      aangemelde instantie opgestelde besluiten, rapporten en certificaten gedurende een periode van vijf jaar na
      het moment waarop het laatste desbetreffende in-vitro diagnosticum is vervaardigd, ter beschikking van de in
      [artikel 4, eerste lid][ref1], bedoelde overheidsinstantie.


      [ref1]: https://wetten.overheid.nl/BWBR0012610#Artikel4
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0012610
        artikel: '4'
  - number: '8.10'
    text: |-
      De fabrikant verstrekt de aangemelde instantie iedere inlichting die voor de vervulling van haar taak
      redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel8
  - number: '8.11'
    text: |-
      Een krachtens de bijlagen III, IV of V van de richtlijn genomen beslissing vervalt na een door de aangemelde
      instantie te bepalen termijn van maximaal vijf jaar. Op aanvraag van de fabrikant kan de aangemelde instantie deze
      periode met termijnen van telkenmale maximaal vijf jaar verlengen.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel8
  - number: '8.12'
    text: |-
      De bepalingen van dit artikel en van [artikel 3, derde lid][ref1], zijn van overeenkomstige toepassing op een
      persoon, rechtspersoon daaronder begrepen, die een in-vitro diagnosticum vervaardigt en voor het eerst toepast
      zonder dit af te leveren.


      [ref1]: https://wetten.overheid.nl/BWBR0012610#Artikel3
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0012610
        artikel: '3'
  - number: '8.13'
    text: |-
      Met de in het tweede tot en met vijfde lid bedoelde procedures worden gelijkgesteld de door de daartoe bevoegde
      autoriteiten van de andere lidstaten in het kader van de richtlijn vastgestelde procedures.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel8
  - number: '9.1'
    text: |-
      Ter uitvoering van artikel 15 van de richtlijn kan Onze Minister één of meer instanties aanwijzen die de in
      [artikel 8][ref1] bedoelde procedures uitvoeren, doch slechts indien die instanties voldoen aan de in bijlage
      IX van de richtlijn opgenomen criteria. In zodanige aanwijzing worden in elk geval de specifieke taken van de
      instantie vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0012610#Artikel8
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0012610
        artikel: '8'
  - number: '9.2'
    text: |-
      Onze Minister wijst ter uitvoering van de richtlijn normen aan, bij het voldoen waaraan een instantie wordt
      beschouwd te voldoen aan de in het eerste lid bedoelde criteria.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel9
  - number: '9.3'
    text: |-
      Wanneer de instantie constateert dat de fabrikant niet heeft voldaan of niet langer voldoet aan de van
      toepassing zijnde eisen van dit besluit of wanneer geen verklaring had mogen worden afgegeven, moet zij, rekening
      houdend met het evenredigheidsbeginsel, de afgegeven verklaring schorsen, intrekken of beperken, tenzij de
      fabrikant er door invoering van een geschikte corrigerende maatregel voor zorgt dat aan bovengenoemde eisen
      wordt voldaan. In geval van schorsing, intrekking of beperking van de verklaring of indien ingrijpen van de in
      [artikel 4, eerste lid][ref1], bedoelde overheidsinstantie nodig zou zijn, stelt zij die overheidsinstantie daarvan
      in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0012610#Artikel4
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0012610
        artikel: '4'
  - number: '9.4'
    text: |-
      De instantie stelt desgevraagd de in [artikel 4, eerste lid][ref1], bedoelde overheidsinstantie en de andere
      aangemelde instanties in kennis van de afgegeven of geweigerde certificaten en stelt desgevraagd alle relevante
      informatie ter beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0012610#Artikel4
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0012610
        artikel: '4'
  - number: '9.5'
    text: Ter uitvoering van artikel 15 van de richtlijn kan Onze Minister aan de aanwijzing voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel9
  - number: '9.6'
    text: |-
      Onze Minister trekt de aanwijzing in indien de instantie niet voldoet aan het eerste, derde en vierde lid, of aan
      de op grond van het vijfde lid door de minister gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel9
  - number: '10.1'
    text: |-
      Voor de in-vitro diagnostica die voor doeltreffendheidsonderzoek zijn bestemd, volgt de fabrikant de in bijlage
      VIII van de richtlijn bedoelde procedure en stelt de in die bijlage bedoelde verklaring op alvorens die in-vitro
      diagnostica ter beschikking te stellen.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel10
  - number: '10.2'
    text: |-
      In afwijking van [artikel 5, eerste lid][ref1], behoeft een in-vitro diagnosticum dat is bestemd voor
      doeltreffendheidsonderzoek, op het punt waarop het onderzoek is gericht en op andere door de fabrikant genoemde
      aspecten, niet te voldoen aan de in bijlage I van de richtlijn bedoelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0012610#Artikel5
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012610
        artikel: '5'
  - number: '11'
    text: |-
      De [artikelen 5][ref1], [6][ref2] en [7][ref3] zijn niet van toepassing op in-vitro diagnostica die op beurzen,
      tentoonstellingen, demonstraties en soortgelijke gelegenheden worden gepresenteerd, op voorwaarde dat: - deze
      in-vitro diagnostica niet op specimens, afkomstig van de deelnemers aan die gelegenheden, voor het eerst worden
      toegepast;
        - op duidelijke en zichtbare wijze is aangegeven dat de in-vitro diagnostica niet aan de bepalingen van dit besluit
      voldoen en niet kunnen worden afgeleverd en voor het eerst worden toegepast alvorens deze door de fabrikant met die
      bepalingen in overeenstemming zijn gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0012610#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0012610#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0012610#Artikel7
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0012610
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0012610
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0012610
        artikel: '7'
  - number: '12'
    text: |-
      De in [artikel 3, tweede lid][ref1], bedoelde persoon draagt zorg dat de in-vitro diagnostica die hij voorhanden
      heeft, op deugdelijke, zindelijke, ordelijke wijze en met inachtneming van de in bijlage I, deel B, punt 8.4, onder
      h, van de richtlijn bedoelde voorwaarden worden bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0012610#Artikel3
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0012610
        artikel: '3'
  - number: '13'
    text: |-
      Een in-vitro diagnosticum wordt door de in [artikel 3, tweede lid][ref1], bedoelde persoon niet afgeleverd:


      [ref1]: https://wetten.overheid.nl/BWBR0012610#Artikel3
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012610
        artikel: '3'
  - number: 13.a
    text: |-
      ingeval het in-vitro diagnosticum voor doeltreffendheidsonderzoek is bestemd, indien niet is voldaan aan
      [artikel 10][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012610#Artikel10
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012610
        artikel: '10'
  - number: 13.b
    text: |-
      ingeval het in-vitro diagnosticum in de handel is gebracht: - indien het niet aan de in de
      [artikelen 5, eerste lid][ref1], [6, eerste lid][ref2], en [7, eerste lid][ref3], bedoelde eisen voldoet;
        - nadat de in bijlage I, deel B, punt 8.4, onder e, van de richtlijn bedoelde uiterste gebruiksdatum is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0012610#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0012610#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0012610#Artikel7
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012610
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0012610
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0012610
        artikel: '7'
  - number: 13a.1
    text: |-
      Apothekers die hun beroep in een apotheek uitoefenen leveren een hoog-risicodiagnosticum aan een gebruiker af met
      inachtneming van het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel13a
  - number: 13a.2
    text: |-
      Het hoog-risicodiagnosticum is voorzien van een door de fabrikant opgestelde bijsluiter, die de volgende
      aanvullende gegevens bevat: - een adequate voorlichting over de ernst van de mogelijke aandoening en over het
      belang van medische begeleiding bij het gebruik van het hoog-risicodiagnosticum;
        - een gebruiksaanwijzing, voldoende toegankelijk voor de niet-professionele gebruiker om het hoog-
      risicodiagnosticum op de juiste wijze te gebruiken en de testresultaten op de juiste wijze te interpreteren;
        - een presentatie van de testresultaten op een voor de niet-professionele gebruiker gemakkelijk te begrijpen wijze;
        - informatie over de mogelijkheid van een vals positieve of vals negatieve uitslag;
        - een advies over te nemen maatregelen in geval van een positieve, negatieve of onduidelijke uitslag;
        - een advies dat de gebruiker geen medische beslissing neemt zonder een arts te raadplegen onder vermelding van de
      relevante professionele hulpverlenende instanties.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel13a
  - number: 13a.3
    text: |-
      De aflevering wordt voorafgegaan door voorlichting over: - de mogelijkheid om zich in het kader van de medische
      begeleiding anoniem te laten testen;
        - het belang van medische begeleiding ingeval de test een positieve uitslag oplevert;
        - het juiste gebruik van het hoog-risicodiagnosticum;
        - de juiste interpretatie van de testresultaten.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel13a
  - number: '15.1'
    text: |-
      In afwijking van [artikel 3, eerste lid][ref1], is het de fabrikant tot 7 december 2003 toegestaan om in-vitro
      diagnostica voorhanden te hebben of af te leveren indien met betrekking tot die in-vitro diagnostica is voldaan aan
      de bij of krachtens de wet gestelde voorschriften zoals die golden op 6 december 1998.


      [ref1]: https://wetten.overheid.nl/BWBR0012610#Artikel3
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0012610
        artikel: '3'
  - number: '15.2'
    text: |-
      In afwijking van [artikel 3, tweede lid][ref1], is het de in dat lid bedoelde persoon toegestaan om de in het
      eerste lid bedoelde in-vitro diagnostica tot 7 december 2005 voorhanden te hebben of af te leveren indien met
      betrekking tot die in-vitro diagnostica is voldaan aan de bij of krachtens de wet gestelde voorschriften zoals die
      golden op 6 december 1998.


      [ref1]: https://wetten.overheid.nl/BWBR0012610#Artikel3
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0012610
        artikel: '3'
  - number: '15.3'
    text: |-
      In afwijking van [artikel 3, derde lid][ref1], is het toegestaan om in-vitro diagnostica voor het eerst toe te
      passen die vóór 6 december 1998 zijn afgeleverd of die overeenkomstig het eerste of tweede lid zijn afgeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0012610#Artikel3
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0012610
        artikel: '3'
  - number: '15.4'
    text: |-
      Met betrekking tot de in de voorgaande leden bedoelde in-vitro diagnostica, waarop dit besluit niet wordt toegepast
      en waarop ingevolge één of meer wettelijke regelingen een CE-markering wordt aangebracht, worden op de bij die
      in-vitro diagnostica gevoegde documenten, handleidingen of gebruiksaanwijzingen de in het Publicatieblad van de
      Europese Gemeenschappen bekendgemaakte referenties van de aan die wettelijke regelingen ten grondslag liggende
      richtlijnen vermeld.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel15
  - number: '16'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het Staatsblad waarin het
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel16
  - number: '17'
    text: 'Dit besluit wordt aangehaald als: Besluit in-vitro diagnostica.'
    url: https://wetten.overheid.nl/BWBR0012610/2016-01-01#Artikel17
