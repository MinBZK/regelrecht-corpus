  - number: VIII
    text: |-
      Na de inwerkingtreding van dit besluit is de Regeling nadere regels
      zorgaanspraken AWBZ tevens gebaseerd op de [artikelen 14, vijfde lid][ref1], en
      [16, derde lid, van het Besluit zorgaanspraken bijzondere ziektekostenverzekering][ref2].


