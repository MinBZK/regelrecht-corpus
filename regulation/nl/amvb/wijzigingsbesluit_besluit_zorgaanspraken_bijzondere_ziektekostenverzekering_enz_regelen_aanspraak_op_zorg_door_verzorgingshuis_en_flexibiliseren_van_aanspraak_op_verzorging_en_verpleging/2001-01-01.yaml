articles:
  - number: VII
    text: |-
      De verzekerde die op 31 december 2000 in het genot is van zorg door een verpleeginrichting als bedoeld in
      het [Besluit zorgaanspraken bijzondere ziektekostenverzekering][ref1] of een verzorgingshuis als bedoeld
      in de [Overgangswet verzorgingshuizen][ref2] en ten aanzien van wie een indicatiebesluit op grond van de
      [artikelen 9a][ref3] en [9b van de Algemene Wet Bijzondere Ziektekosten][ref4] is afgegeven, waaruit blijkt dat hij
      op die zorg is aangewezen, heeft gedurende de geldigheidsduur van het indicatiebesluit aanspraak op voortzetting
      van deze zorg volgens de geldende voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0005283
      [ref2]: https://wetten.overheid.nl/BWBR0008252
      [ref3]: https://wetten.overheid.nl/BWBR0002614#Artikel9a
      [ref4]: https://wetten.overheid.nl/BWBR0002614#Artikel9b
    url: https://wetten.overheid.nl/BWBR0011361/2001-01-01#ArtikelVII
