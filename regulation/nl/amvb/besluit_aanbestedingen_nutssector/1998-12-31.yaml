---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_aanbestedingen_nutssector
regulatory_layer: AMVB
publication_date: '2005-09-06'
valid_from: '1998-12-31'
bwb_id: BWBR0005948
url: https://wetten.overheid.nl/BWBR0005948/1998-12-31
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 25 juni 1992, 92050280 WJA/W, gedaan in
    overeenstemming met Onze Ministers van Verkeer en Waterstaat, van Binnenlandse Zaken en van Volkshuisvesting,
    Ruimtelijke Ordening en Milieubeheer;

    Gelet op richtlijn 90/531/EEG van de Raad van de Europese Gemeenschappen van 17 september 1990, betreffende
    de procedures voor het plaatsen van opdrachten in de sectoren water- en energievoorziening, vervoer en
    telecommunicatie ( PbEG L 297), alsmede op de artikelen 2 en 3 van de Raamwet EEG-voorschriften aanbestedingen en
    op artikel 34, tweede lid, van de Comptabiliteitswet;

    De Raad van State gehoord (advies van 26 oktober 1992, nr. W10.92 0276);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 1 april 1993, nr. 93024459 WJA/W, uitgebracht
    in overeenstemming met Onze voornoemde Ministers;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel1
  - number: 1.b
    text: |-
      [richtlijn 93/38/EEG](31993L0038): [richtlijn nr. 93/38/EEG](31993L0038) van de Raad van de Europese Gemeenschappen
      van 14 juni 1993, houdende coördinatie van de procedures voor het plaatsen van opdrachten in de sectoren water- en
      energievoorziening, vervoer en telecommunicatie (PbEG L 199), naar de tekst zoals deze laatstelijk is gewijzigd bij
      [richtlijn nr. 98/4/EG](31998L0004) van het Europees Parlement en de Raad van de Europese Unie van 16 februari 1998
      (PbEG L 101);.
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel1
  - number: 1.c
    text: |-
      [richtlijn 92/13/EEG](31992L0013): [richtlijn 92/13/EEG](31992L0013) van de Raad van Europese Gemeenschappen van
      25 februari 1992, tot coördinatie van de wettelijke en bestuursrechtelijke bepalingen betreffende de toepassing
      van de communautaire voorschriften inzake de procedures voor het plaatsen van opdrachten door diensten die werkzaam
      zijn in de sectoren water- en energievoorziening, vervoer en telecommunicatie (*PbEG* L 76), naar de tekst zoals
      deze laatstelijk voor de toepassing van de Overeenkomst betreffende de Europese Economische Ruimte is gewijzigd
      bij Besluit van het Gemengd Comité van de EER Nr. 7/94 van 21 maart 1994 tot wijziging van Protocol 47 en sommige
      bijlagen bij de EER-Overeenkomst (*PbEG* L 160);
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel1
  - number: 1.d
    text: |-
      een aanbestedende dienst: een dienst als bedoeld in [artikel 2, eerste tot en met vijfde lid][ref1], juncto artikel
      1 van [richtlijn 93/38/EEG](31993L0038);


      [ref1]: https://wetten.overheid.nl/BWBR0005948#Artikel2
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005948
        artikel: '2'
  - number: 1.e
    text: 'de Commissie: de Commissie van de Europese Gemeenschappen;'
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel1
  - number: 1.f
    text: |-
      de Overeenkomst inzake overheidsopdrachten: de op 15 april 1994 te Marrakech totstandgekomen Overeenkomst inzake
      overheidsopdrachten (Trb.1994, 235).
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel1
  - number: '2.1'
    text: |-
      Voor het plaatsen van opdrachten voor leveringen, voor de uitvoering van werken en voor het verrichten van diensten
      als bedoeld in artikel 1, onder 4°, van [richtlijn 93/38/EEG](31993L0038), die voldoen aan het bepaalde in artikel
      14, eerste tot en met dertiende lid, van de richtlijn en die niet in de artikelen 6 tot en met 13 van de richtlijn
      van toepassing zijn uitgesloten, passen de aanbestedende diensten de artikelen 4, tweede tot en met vierde lid, 5,
      15 tot en met 20, 21, eerste tot en met derde lid en vijfde lid, 22, 24, eerste en derde lid, 25, eerste en vijfde
      lid, 26, 27, 28, eerste tot en met vijfde lid, eerste volzin, en zesde lid, eerste volzin, 29, tweede lid, 31 tot
      en met 34, 35, eerste lid, 36, eerste tot en met vijfde lid, en 41, eerste, derde en vierde lid, van de richtlijn
      toe.
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel2
  - number: '2.2'
    text: |-
      Voor het uitschrijven van prijsvragen voor ontwerpen als bedoeld in artikel 1, onder 16°, van [richtlijn 93/38/
      EEG](31993L0038), die voldoen aan het bepaalde in artikel 23, eerste en tweede lid, van de richtlijn, passen de
      aanbestedende diensten de artikelen 21, vierde en vijfde lid, 23, derde tot en met zesde lid, 24, eerste lid, en
      25, eerste en vijfde lid, van de richtlijn toe.
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel2
  - number: '2.3'
    text: |-
      Aanbestedende diensten kunnen overeenkomstig artikel 30 van [richtlijn 93/38/EEG](31993L0038) een systeem van
      erkenning van geschiktheid van leveranciers, aannemers of dienstverrichters opzetten en beheren.
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel2
  - number: '2.4'
    text: |-
      Ten aanzien van de toepassing van artikel 31, tweede lid, van [richtlijn 93/38/EEG](31993L0038) is
      [artikel 4 van het Besluit overheidsaanbestedingen][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006009#Artikel4
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006009
        artikel: '4'
  - number: 2a
    text: |-
      Aanbestedende diensten passen bij een procedure voor het plaatsen van een opdracht tegenover aannemers,
      leveranciers en dienstverleners in de lidstaten van de Europese Unie de voorwaarden, bedoeld in de Overeenkomst
      inzake overheidsopdrachten, toe, indien zij deze voorwaarden voor diezelfde procedure toepassen ten aanzien
      van aannemers, leveranciers en dienstverleners uit andere staten die partij bij de Overeenkomst inzake
      overheidsopdrachten zijn en deze voorwaarden gunstiger voor hen zijn dan de voorwaarden, bedoeld in [richtlijn
      93/38/EEG](31993L0038).
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel2a
  - number: 2b
    text: |-
      Aanbestedende diensten kunnen elke andere vorm van inschrijving dan schriftelijk, rechtstreeks of via de post,
      toestaan, indien zij er voor zorgen dat:
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel2b
  - number: 2b.a
    text: elke inschrijving alle informatie bevat die voor de beoordeling ervan nodig is;
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel2b
  - number: 2b.b
    text: het vertrouwelijk karakter van de inschrijvingen, in afwachting van de beoordeling ervan, wordt gerespecteerd;
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel2b
  - number: 2b.c
    text: |-
      de inschrijvingen, indien zulks om redenen van juridisch bewijs noodzakelijk is, zo snel mogelijk schriftelijk of
      door toezending van een gewaarmerkt afschrift worden bevestigd en
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel2b
  - number: 2b.d
    text: het openen van de inhoud van de inschrijvingen plaatsvindt na het verstrijken van de termijn voor indiening.
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel2b
  - number: '3.1'
    text: |-
      Indien aanbestedende diensten gebruik maken van de mogelijkheid van de verificatieregeling, bedoeld in artikel 3
      van [richtlijn 92/13/EEG](31992L0013), zijn de artikelen 4 tot en met 7 van die richtlijn van toepassing.
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel3
  - number: '3.2'
    text: |-
      Onze Minister wijst de in artikel 6, tweede lid, van [richtlijn 92/13/EEG](31992L0013) bedoelde personen,
      beroepsgroepen of personeel van instellingen aan. Van de desbetreffende aanwijzing wordt mededeling gedaan in de
      *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel3
  - number: '3.3'
    text: 'Onze Minister verleent een aanwijzing op grond van het vorige lid alleen indien:'
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel3
  - number: 3.3.a
    text: |-
      de betrokken personen, beroepsgroepen of personeel van instellingen van de Raad voor Accreditatie of van een met
      de Raad vergelijkbare accreditatie-instelling een accreditatie hebben verkregen op basis van de norm NEN-EN 45503,
      zoals deze in maart 1996 luidde, en
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel3
  - number: 3.3.b
    text: zij erin toestemmen dat de Raad of de accreditatie-instelling Onze Minister inzicht verschaft in hun functioneren.
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel3
  - number: '4'
    text: |-
      Indien de Commissie toepassing geeft aan de procedures, bedoeld in artikel 8 van [richtlijn 92/13/
      EEG](31992L0013), verlenen de betrokken aanbestedende diensten hun medewerking daaraan overeenkomstig
      [artikel 8, derde tot en met vijfde lid][ref1], van deze richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005948#Artikel8
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005948
        artikel: '8'
  - number: '5.1'
    text: |-
      Degene, bedoeld in artikel 9, eerste lid, van [richtlijn 92/13/EEG](31992L0013), kan een verzoek indienen om
      toepassing van de bemiddelingsprocedure van de [artikelen 10][ref1] en [11][ref2] van deze richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005948#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005948#Artikel11
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005948
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0005948
        artikel: '11'
  - number: '5.2'
    text: |-
      Het verzoek, bedoeld in het eerste lid, wordt schriftelijk ingediend bij de Commissie of bij het Ministerie van
      Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel5
  - number: '5.3'
    text: |-
      Indien de Commissie toepassing geeft aan de procedure, bedoeld in de artikelen 9 tot en met 11 van de [richtlijn
      92/13/EEG](31992L0013), verlenen de betrokken aanbestedende diensten hun medewerking daaraan overeenkomstig de
      [artikelen 10, tweede tot en met zevende lid][ref1], en [11, eerste lid][ref2], van deze richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005948#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005948#Artikel11
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005948
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0005948
        artikel: '11'
  - number: '6'
    text: |-
      De aanbestedende diensten zenden aan Onze Minister de gegevens die deze nodig heeft voor
      de in [artikel 7][ref1] bedoelde informatieverstrekking aan de Commissie. De aanbestedende
      diensten nemen daarbij, voor zover van toepassing, de nadere voorschriften in acht, bedoeld in
      [artikel 3, tweede lid, van de Raamwet EEG-voorschriften aanbestedingen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005948#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005937#Artikel3
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005948
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005937
        artikel: '3'
  - number: '7.1'
    text: |-
      Onze Minister stelt de Commissie in kennis van de in de lijsten van aanbestedende diensten aan te brengen
      wijzigingen, bedoeld in artikel 2, zesde lid, van [richtlijn 93/38/EEG](31993L0038).
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel7
  - number: '7.2'
    text: |-
      Onze Minister zendt ieder jaar aan de Commissie het statistische overzicht, bedoeld in artikel 42, eerste lid en
      lid 1bis, van [richtlijn 93/38/EEG](31993L0038).
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel7
  - number: '8.1'
    text: |-
      De aanbestedende diensten verstrekken de Commissie op haar verzoek informatie omtrent de activiteiten, produkten
      en diensten die naar hun mening van de werking van [richtlijn 93/38/EEG](31993L0038) zijn uitgezonderd op grond
      van artikel 6, eerste lid, artikel 7, eerste lid, of artikel 8, eerste lid, van de richtlijn, alsmede gegevens als
      bedoeld in artikel 13, tweede lid, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel8
  - number: '8.2'
    text: |-
      De aanbestedende diensten bewaren de gegevens, bedoeld in artikel 41, eerste lid, van [richtlijn 93/38/EEG]
      (31993L0038), gedurende tenminste vier jaren na de datum waarop de opdracht is gegund, en verstrekken gedurende dit
      tijdsbestek de Commissie op haar verzoek de noodzakelijke informatie.
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel8
  - number: '8.3'
    text: |-
      De aanbestedende diensten verstrekken de Commissie de informatie, bedoeld in de artikelen 24, eerste lid, en 34,
      vijfde lid, vijfde volzin, van [richtlijn 93/38/EEG](31993L0038).
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel8
  - number: '9'
    text: '[Vervallen.]'
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel9
  - number: '10.1'
    text: |-
      Indien een besluit van de Commissie als bedoeld in artikel 3, vierde lid, van [richtlijn 93/38/EEG](31993L0038)
      van toepassing is, passen aanbestedende diensten die werkzaam zijn op het gebied van de verkenning, opsporing of
      winning van delfstoffen als bedoeld in artikel 3, eerste lid, van de richtlijn, in afwijking van het bepaalde in
      [artikel 2, eerste en tweede lid][ref1], de bepalingen van het tweede tot en met het vierde lid toe.


      [ref1]: https://wetten.overheid.nl/BWBR0005948#Artikel2
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005948
        artikel: '2'
  - number: '10.2'
    text: |-
      Het plaatsen van opdrachten voor de uitvoering van werken, voor leveringen en voor het verrichten van diensten
      geschiedt op niet-discriminerende wijze.
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel10
  - number: '10.3'
    text: |-
      Voorafgaand aan de opdracht worden de volgende gegevens gepubliceerd in het Publikatieblad van de Europese
      Gemeenschappen dan wel in een landelijk verspreid dagblad:
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel10
  - number: 10.3.a
    text: |-
      de naam, het adres, het telefoon-, het telex- en het telefaxnummer alsmede het telegramadres van de aanbestedende
      dienst zelf of van de instelling waarbij nadere informatie over de opdracht kan worden verkregen;
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel10
  - number: 10.3.b
    text: |-
      een aanduiding van de aard en van de hoeveelheid van het uit te voeren werk, de te verrichten levering of de te
      verrichten dienst;
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel10
  - number: 10.3.c
    text: een korte aanduiding van de wijze van aanbesteding.
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel10
  - number: '10.4'
    text: |-
      Aan de Commissie wordt informatie verstrekt inzake de toekenning van opdrachten onder de overeenkomstig artikel 3,
      tweede lid, onderdeel *b*, van [richtlijn 93/38/EEG](31993L0038) vastgestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel10
  - number: '11'
    text: Dit besluit treedt in werking met ingang van de dag na de datum van *Staatsblad* waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel11
  - number: '12'
    text: 'Dit besluit wordt aangehaald als: Besluit aanbestedingen nutssector.'
    url: https://wetten.overheid.nl/BWBR0005948/1998-12-31#Artikel12
