  - number: 21a
    text: |-
      1 Het varkensrecht en het fokzeugenrecht van een daartoe aangemeld bedrijf worden, in zoverre in afwijking van
      [artikel 2, eerste lid][ref1], bepaald overeenkomstig deze paragraaf, voorzover het betreft een bedrijf waarop:

      a. [artikel 8, eerste lid, van de wet][ref2] van toepassing is en ten aanzien waarvan in de periode na 1995 tot 10
      juli 1997 een overdracht heeft plaatsgevonden,

      b. [artikel 8, vierde lid, van de wet][ref3] van toepassing is en ten aanzien waarvan in de periode na 1995 tot 10
      juli 1997 een overdracht heeft plaatsgevonden, dan wel

      c. [artikel 11, zesde lid, van de wet][ref4] van toepassing is en ten aanzien waarvan in de periode na 1995 tot 10
      juli 1997 een samenvoeging heeft plaatsgevonden.

      2 Een bedrijf als bedoeld in het eerste lid komt uitsluitend voor de toepassing van deze paragraaf in aanmerking
      indien ten aanzien van het bedrijf is voldaan aan elk van de volgende voorwaarden:

      a. de verkrijger van het overgedragen, onderscheidenlijk na samenvoeging ontstane, bedrijf heeft,
      indien de overdracht, onderscheidenlijk de samenvoeging, in 1996 plaatsvond, overeenkomstig
      [artikel 6, vierde lid van de wet][ref5], opgave gedaan van het gemiddeld in 1996 op het bedrijf gehouden aantal
      varkens, onderscheidenlijk fokzeugen;

      b. de mestproductie afkomstig van varkens is in 1997 ten minste 5% van het niet-gebonden mestproductierecht voor
      varkens en kippen geldend met betrekking tot dat jaar;

      c. het niet-gebonden mestproductierecht voor varkens en kippen is per saldo niet verkleind ten gevolge van
      na de overdracht, onderscheidenlijk samenvoeging, of, ingeval meerdere overdrachten of samenvoegingen hebben
      plaatsgevonden, na de laatste van die overdrachten of samenvoegingen, tot 10 juli 1997 gedane kennisgevingen van
      verplaatsing met betrekking tot dat recht.


