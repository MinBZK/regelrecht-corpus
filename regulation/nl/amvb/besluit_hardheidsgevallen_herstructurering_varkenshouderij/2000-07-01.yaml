  - number: '2'
    text: |-
      1 Met betrekking tot een daartoe aangemeld bedrijf, niet zijnde een bedrijf als bedoeld in
      [artikel 8, eerste of vierde lid, van de wet][ref1], of een door samenvoeging ontstaan bedrijf als bedoeld
      in [artikel 11, zesde lid, van de wet][ref2], wordt met ingang van het tijdstip van inwerkingtreding van
      [artikel 15 van de wet][ref3] de hoogte van het varkensrecht en het fokzeugenrecht bepaald overeenkomstig de
      [hoofdstukken 1][ref4], [2][ref5] en [4][ref6] van dit besluit, onder de in dit besluit geregelde voorwaarden
      en beperkingen. Ten aanzien van dit bedrijf wordt het grondgebonden deel van het varkensrecht, onderscheidenlijk
      fokzeugenrecht, bepaald overeenkomstig [artikel 1, onderdeel o, onderscheidenlijk p, van de wet][ref7], tenzij in
      dit besluit anders is bepaald.

      2 Ten aanzien van een bedrijf als bedoeld in het eerste lid blijven, tenzij in dit besluit anders is bepaald,
      [hoofdstuk II van de wet][ref8] en [artikel 55a van de Meststoffenwet][ref9] buiten toepassing.

      3 De belanghebbende doet de in het eerste lid bedoelde melding binnen zes weken na inwerkingtreding van dit
      besluit bij het Bureau Heffingen, met gebruikmaking van een daartoe door Onze Minister vastgesteld formulier,
      dat overeenkomstig de op het formulier aangegeven wijze volledig en naar waarheid is ingevuld en door de
      belanghebbende is ondertekend. Bij gebreke van een overeenkomstig [de eerste volzin][ref10] gedane melding worden
      de [hoofdstukken 1][ref11], [2][ref12] en [4][ref13] van dit besluit ten aanzien van het desbetreffende bedrijf van
      de belanghebbende niet toegepast.

      4 Een belanghebbende kan de in het eerste lid bedoelde melding slechts doen ten aanzien van één van de
      [paragrafen 1 tot en met 7C van hoofdstuk 2][ref14], tenzij in dat hoofdstuk anders is bepaald.

      5 Indien een belanghebbende behalve de melding, bedoeld in het eerste lid, tevens een melding heeft gedaan als
      bedoeld in de [artikelen 7 tot en met 11][ref15] en [14 van de wet][ref16], wordt ingeval van meldingen die naar
      hun inhoud tegenstrijdig zijn, slechts de op grond van dit besluit gedane melding in aanmerking genomen.

      6 Een melding op grond van de [artikelen 9][ref17] en [10 van de wet][ref18] geldt ten aanzien van
      [paragraaf 6 van hoofdstuk 2][ref19] tevens als een melding op grond van dit besluit.


