preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuurbeheer en Visserij van 27 april 1998, nr. J. 983658;

    Gelet op de artikelen 25 en 33 van de Wet herstructurering varkenshouderij en op de artikelen 7, derde lid, 55,
    zesde lid, en 61, eerste lid, van de Meststoffenwet;

    De Raad van State gehoord (advies van 3 juni 1998, no. W11.98.0173);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuurbeheer en Visserij van 15 juni 1998, nr. J. 985482;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009705/2000-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. wet: [Wet herstructurering varkenshouderij][ref1];

      b. aangifte overschotheffing, afsluitformulier 1995, afsluitformulier 1996, vrijstellingsverklaring,
      vrijstellingsverklaring 1995, vrijstellingsverklaring 1996, grondgebonden mestproductierecht, belanghebbende,
      verplaatsing, kennisgeving van verplaatsing en registratie van een kennisgeving van verplaatsing: hetgeen daaronder
      wordt verstaan in [artikel 5 van de wet][ref2];

      c. doorhaling: doorhaling als bedoeld in [artikel 7, derde lid, van de Meststoffenwet][ref3];

      d. milieuvergunning: vergunning als bedoeld in [artikel 8.1 van de Wet milieubeheer][ref4];

      e. aangifte overschotheffing 1994: aangifte overschotheffing die betrekking heeft op het jaar 1994;

      f. aangifte overschotheffing 1997: aangifte overschotheffing die betrekking heeft op het jaar 1997;

      g. afsluitformulier 1997: Afsluitformulier bijzondere gebruiksnormen 1997 (125-) of Afsluitformulier
      mestboekhouding 1997 (110–125) als bedoeld in artikel 1, eerste lid, van de Regeling vaststelling
      afsluitformulieren 1997;

      h. vrijstellingsverklaring 1997: vrijstellingsverklaring die betrekking heeft op het jaar 1997;

      i. inrichting: hetgeen daaronder wordt verstaan in [artikel 1.1, eerste lid, van de Wet milieubeheer][ref5].

      2 Voor de toepassing van dit besluit:

      a. worden het niet-gebonden mestproductierecht en het grondgebonden mestproductierecht telkens in aanmerking
      genomen zoals deze, al naar gelang het geval, op het desbetreffende tijdstip dan wel met betrekking tot het
      desbetreffende jaar voor het desbetreffende bedrijf door het Bureau Heffingen zijn geregistreerd;

      b. wordt het niet-gebonden mestproductierecht voor varkens en kippen geldend met betrekking tot onderscheidenlijk
      1995, 1996 en 1997, telkens vermenigvuldigd met 10/7;

      c. worden de gegevens van de aangifte overschotheffing – daaronder begrepen de correcties –, het afsluitformulier
      1995, het afsluitformulier 1996, de vrijstellingsverklaring 1995 en de vrijstellingsverklaring 1996 slechts in
      aanmerking genomen voorzover deze vóór 10 juli 1997 door het Bureau Heffingen zijn ontvangen;

      d. worden de gegevens van de aangifte overschotheffing 1997 – daaronder begrepen de correcties –, het
      afsluitformulier 1997 en de vrijstellingsverklaring 1997, in zoverre in afwijking van onderdeel c, slechts in
      aanmerking genomen voorzover deze vóór 21 oktober 1998 door het Bureau Heffingen zijn ontvangen.

      3 De mestproductie afkomstig van de onderscheiden in bijlage A bij de Meststoffenwet genoemde diersoorten
      wordt voor de toepassing van dit besluit overeenkomstig [artikel 55, negende lid, van de Meststoffenwet][ref6]
      vastgesteld op basis van het in het desbetreffende jaar gemiddeld op het bedrijf gehouden aantal dieren van
      de onderscheiden diersoorten en diercategorieën daarbinnen, zoals dat aantal blijkt uit onderscheidenlijk
      de aangifte overschotheffing 1994, de opgave, bedoeld in [artikel 7, tweede lid][ref7], juncto
      [artikel 6, vierde lid, van de wet][ref8], de opgave, bedoeld in [artikel 6, vierde lid, van de wet][ref9], of de
      aangifte overschotheffing 1997, of bij gebreke van deze aangifte, het afsluitformulier 1997, dan wel, bij gebreke
      daarvan, de vrijstellingsverklaring 1997.


