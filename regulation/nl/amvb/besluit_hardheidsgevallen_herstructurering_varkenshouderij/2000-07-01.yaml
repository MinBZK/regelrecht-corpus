  - number: '21'
    text: |-
      1 Bij de bepaling van het grondgebonden deel van het varkensrecht, onderscheidenlijk fokzeugenrecht, blijft
      buiten beschouwing het aantal varkenseenheden dat wordt bepaald door het aantal kilogrammen fosfaat waarvoor de
      ontheffing, bedoeld in [artikel 20, eerste lid][ref1], met betrekking tot 1996 geldt, te delen door 7,4 kilogram
      fosfaat.

      2 Ingeval het varkensrecht, onderscheidenlijk fokzeugenrecht, wordt bepaald op grond van [artikel 7][ref2] van de
      wet, wordt in het eerste lid in plaats van «1996» gelezen: 1995.

      3 Ingeval het varkensrecht, onderscheidenlijk fokzeugenrecht, wordt bepaald overeenkomstig [paragraaf 6B][ref3]
      of [7B van dit hoofdstuk][ref4], wordt in het eerste lid in plaats van «1996» gelezen: 1997.


