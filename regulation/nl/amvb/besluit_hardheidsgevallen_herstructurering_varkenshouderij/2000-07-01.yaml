  - number: '25'
    text: |-
      1 De [artikelen 12][ref1], [13][ref2] juncto artikel [41, derde lid][ref3], en [14 van de wet][ref4] zijn
      van overeenkomstige toepassing op het overeenkomstig dit besluit bepaalde varkensrecht, onderscheidenlijk
      fokzeugenrecht.

      2 [Artikel 24 van de wet][ref5] is van overeenkomstige toepassing op het overeenkomstig dit besluit
      bepaalde varkensrecht en fokzeugenrecht, met dien verstande dat voor de toepassing van dit besluit
      in het eerste lid van dat artikel in plaats van «de [artikelen 6][ref6],[7][ref7] en [11][ref8]»
      wordt gelezen «de [artikelen 4, eerste lid][ref9], [8, eerste lid, onderdeel c, en tweede lid][ref10],
      [10, tweede lid, onderdeel d][ref11], [21d, eerste en tweede lid][ref12], en [21f, tweede lid, onderdeel b][ref13],
      van dit besluit» en in plaats van «de [artikelen 1][ref14] en [8 tot en met 13][ref15]» wordt gelezen: de
      [artikelen 6, eerste lid][ref16], [12][ref17], [14][ref18], [19, eerste lid][ref19], [19b, tweede lid][ref20],
      [21][ref21], [21b, eerste lid][ref22], en [21f, eerste lid][ref23], van dit besluit.


