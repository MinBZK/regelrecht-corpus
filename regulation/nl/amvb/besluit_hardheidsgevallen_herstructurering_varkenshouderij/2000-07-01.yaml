  - number: '5'
    text: |-
      1 Indien in 1994, 1995 of 1996 registratie van een kennisgeving van verplaatsing met betrekking tot het
      niet-gebonden mestproductierecht voor varkens en kippen heeft plaatsgevonden, of na 1996 registratie heeft
      plaatsgevonden van een dergelijke uiterlijk op 9 juli 1997 gedane kennisgeving, wordt het overeenkomstig
      [artikel 4][ref1] bepaalde varkensrecht vergroot voor het bedrijf waarheen is verplaatst, en verkleind tot ten
      minste nihil voor het bedrijf waarvan het niet-gebonden mestproductierecht afkomstig is.

      2 Op de in het eerste lid bedoelde vergroting, onderscheidenlijk verkleining, is
      [artikel 10, tweede en vierde lid, onderscheidenlijk derde en vierde lid, van de wet][ref2], van overeenkomstige
      toepassing, met dien verstande dat in [artikel 10, derde lid, van de wet][ref3] in plaats van «[artikel 7][ref4]»
      wordt gelezen« [artikel 4][ref5] van dit besluit» en in plaats van «1995» wordt gelezen: 1994.

      3 Indien de in het eerste lid bedoelde registratie evenwel plaatsvond in 1994, is in afwijking
      van het tweede lid op de in het eerste lid bedoelde vergroting, onderscheidenlijk verkleining,
      [artikel 9, tweede en vijfde lid, onderscheidenlijk derde, vierde en vijfde lid, van de wet][ref6], van
      overeenkomstige toepassing, met dien verstande dat in het tweede, derde en vierde lid van dat artikel in plaats van
      «1996» telkens wordt gelezen: 1994.

      4 De vergroting, bedoeld in het derde lid, vindt slechts plaats voorzover het varkensrecht daardoor niet groter
      wordt dan zowel het met betrekking tot 1995 als het met betrekking tot 1996 bepaalde aantal varkenseenheden,
      bedoeld in [artikel 4, tweede lid][ref7].


