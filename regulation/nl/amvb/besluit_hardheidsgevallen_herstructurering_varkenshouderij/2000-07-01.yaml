  - number: '11'
    text: |-
      1 De in [artikel 10][ref1] bedoelde vergroting betreft het fokzeugenrecht voorzover de vergroting
      niet meer is dan het aantal varkenseenheden dat overeenkomt met het aantal fokzeugen dat ingevolge de
      verleende milieuvergunning, bedoeld in [artikel 9, eerste lid, onderdelen a en b][ref2], onderscheidenlijk
      ingevolge de in [artikel 9, eerste lid, tweede volzin][ref3], bedoelde milieuvergunning in samenhang met
      de overeenkomstig [artikel 8.19 van de Wet milieubeheer][ref4] gedane meldingen, dan wel ingevolge het
      [Besluit melkrundveehouderijen milieubeheer][ref5] of het [Besluit akkerbouwbedrijven milieubeheer][ref6] in
      samenhang met de in [artikel 9, eerste lid, onderdeel c][ref7], bedoelde meldingen, ten hoogste mag worden
      gehouden.

      2 Voor de toepassing van het eerste lid worden:

      a. in de verleende milieuvergunning, onderscheidenlijk in de in [artikel 9, eerste lid, tweede volzin][ref8],
      bedoelde milieuvergunning dan wel in de in het eerste lid bedoelde meldingen genoemde fokzeugen, kraamzeugen, guste
      en dragende zeugen aangemerkt als fokzeugen als bedoeld in [bijlage A, onderdeel 1, onder b, bij de wet][ref9];

      b. in de verleende milieuvergunning, onderscheidenlijk in de in [artikel 9, eerste lid, tweede volzin][ref10],
      bedoelde milieuvergunning dan wel in de in het eerste lid bedoelde meldingen genoemde biggen, al dan niet gespeend,
      buiten beschouwing gelaten, tenzij het gaat om biggen die worden gehuisvest in een stal of stalruimte die blijkens
      de milieuvergunning of de melding uitsluitend is bestemd voor het houden van biggen, in welk geval de biggen worden
      aangemerkt als biggen als bedoeld in bijlage A, onderdeel 5, van de wet.


