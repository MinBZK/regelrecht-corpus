  - number: 19d
    text: |-
      1 Het varkensrecht en het fokzeugenrecht van het bedrijf, bedoeld in [artikel 19c][ref1], worden vergroot met het
      bij de melding, bedoeld in [artikel 2][ref2], aangegeven aantal varkenseenheden dat ten hoogste overeenkomt met het
      verschil tussen het in 1997 gemiddeld op het bedrijf gehouden aantal varkens, onderscheidenlijk fokzeugen, en het
      in 1996 gemiddeld op het bedrijf gehouden aantal varkens, onderscheidenlijk fokzeugen.

      2 [Artikel 6, vierde, vijfde en zesde lid, van de wet][ref3] is van overeenkomstige toepassing, met
      dien verstande dat in plaats van «1996» telkens wordt gelezen «1996, onderscheidenlijk 1997,» en in
      [artikel 6, vierde lid, van de wet][ref4] in plaats van «in de aangifte overschotheffing 1996, bij gebreke
      daarvan, op het afsluitformulier 1996, dan wel, bij gebreke daarvan, op de vrijstellingsverklaring 1996» wordt
      gelezen: in de aangifte overschotheffing 1996, onderscheidenlijk de aangifte overschotheffing 1997, of bij gebreke
      daarvan, op het afsluitformulier 1996, onderscheidenlijk het afsluitformulier 1997, of bij gebreke daarvan, op de
      vrijstellingsverklaring 1996, onderscheidenlijk de vrijstellingsverklaring 1997.

      3 Indien het varkensrecht overeenkomstig [artikel 7 van de wet][ref5] is bepaald, wordt in het eerste lid in plaats
      van «1996» gelezen: 1995.

      4 Indien het varkensrecht overeenkomstig [paragraaf 1 van dit hoofdstuk][ref6] is bepaald, wordt in het eerste lid
      in plaats van «1996» gelezen: 1994.


