  - number: '16'
    text: |-
      Het overeenkomstig hoofdstuk II, uitgezonderd [artikel 14][ref1], en [artikel 24][ref2] van de wet bepaalde
      fokzeugenrecht van een daartoe aangemeld bedrijf wordt overeenkomstig deze paragraaf vergroot, indien met
      betrekking tot het desbetreffende bedrijf na 1992 en vóór 10 juli 1997 ten behoeve van een vergroting van het
      aantal te houden fokzeugen onder vermindering van het aantal te houden andere varkens dan fokzeugen:

      a. door het bevoegd gezag een milieuvergunning is verleend,

      b. een aanvraag is ingediend om een milieuvergunning en deze naar aanleiding van de aanvraag uiterlijk op 1 januari
      2001 is verleend, dan wel

      c. bij het bevoegd gezag overeenkomstig [artikel 8.19 van de Wet milieubeheer][ref3] dan
      wel overeenkomstig [artikel 4 van het Besluit melkrundveehouderijen milieubeheer][ref4] of
      [artikel 3 van het Besluit akkerbouwbedrijven milieubeheer][ref5] een of meer meldingen zijn gedaan.

      Een overeenkomstig [artikel 8.19 van de Wet milieubeheer][ref6] gedane melding wordt slechts in aanmerking genomen
      voorzover deze betrekking heeft op een verandering van de inrichting die overeenkomstig de op het tijdstip van de
      melding voor de inrichting geldende milieuvergunning kon leiden tot een uitbreiding van het aantal fokzeugen.


