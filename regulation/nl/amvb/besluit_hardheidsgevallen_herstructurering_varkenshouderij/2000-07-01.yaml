  - number: '26'
    text: |-
      1 Een bedrijf komt uitsluitend voor de toepassing van [hoofdstuk 2][ref1] in aanmerking indien de belanghebbende
      bij de melding, bedoeld in [artikel 2][ref2], verzoekt om doorhaling van de ten aanzien van het bedrijf
      geregistreerde gegevens betreffende het niet-gebonden mestproductierecht voor varkens en kippen geldend op de dag
      voorafgaand aan het tijdstip van inwerkingtreding van [artikel 15 van de wet][ref3].

      2 Voor de toepassing van het eerste lid is [artikel 41, derde lid, van de wet][ref4] van overeenkomstige
      toepassing.

      3 De doorhaling betreft de hoeveelheid die wordt bepaald door het verschil tussen het overeenkomstig dit besluit
      bepaalde varkensrecht en het grondgebonden deel daarvan achtereenvolgens te vermenigvuldigen met 100/90 en 7,4
      kilogram fosfaat en het product te vermeerderen met de latente ruimte.

      4 Bij de doorhaling neemt het niet-gebonden mestproductierecht voor varkens en kippen van het bedrijf af met de
      hoeveelheid, bedoeld in het derde lid, tot een hoeveelheid van ten minste nihil.

      5 Indien het varkensrecht is bepaald overeenkomstig [hoofdstuk 2, paragraaf 1][ref5], wordt de latente
      ruimte bepaald door overeenkomstige toepassing van [artikel 55a, vierde lid, van de Meststoffenwet][ref6]
      met dien verstande dat in dat lid en in [artikel 1, eerste lid, onderdeel ad, van die wet][ref7]
      in plaats van «1996» telkens wordt gelezen «1994», en in plaats van
      «[artikel 5, eerste lid, onderdeel c, van de Wet herstructurering varkenshouderij][ref8]» wordt gelezen:
      [artikel 1, eerste lid, onderdeel e][ref9], van dit besluit.

      6 Indien het varkensrecht is bepaald overeenkomstig [hoofdstuk 2][ref10], paragraaf 2, [4][ref11] of [7A][ref12],
      komt de latente ruimte overeen met 11% van het overeenkomstig [artikel 8, eerste lid][ref13], onderscheidenlijk
      [artikel 14][ref14], aangegeven deel van het aantal kilogrammen fosfaat dat wordt bepaald door het niet-gebonden
      mestproductierecht voor varkens en kippen geldend met betrekking tot 1996 te verminderen met 10%.

      7 Indien het varkensrecht is vergroot overeenkomstig [hoofdstuk 2, paragraaf 3][ref15], wordt de latente ruimte
      bepaald door het niet-gebonden mestproductierecht voor varkens en kippen zoals dat zou gelden op 1 januari 1998
      indien geen rekening wordt gehouden met na 9 juli 1997 gedane kennisgevingen van verplaatsing met betrekking tot
      dit recht, achtereenvolgens te verminderen met:

      a. het aantal kilogrammen fosfaat dat wordt bepaald door het verschil tussen het overeenkomstig hoofdstuk II,
      paragraaf 3, vergrote varkensrecht en het grondgebonden deel daarvan te vermenigvuldigen met 100/90, het product
      vervolgens te vermeerderen met dit grondgebonden deel en deze som te vermenigvuldigen met 7,4 kilogram fosfaat,

      b. de mestproductie afkomstig van de in 1996 gehouden dieren van andere diersoorten dan varkens en kippen,
      voorzover deze mestproductie groter is dan de som van het grondgebonden mestproductierecht zoals dat zou gelden
      op 1 januari 1998 indien geen rekening wordt gehouden met wijzigingen in de oppervlakte tot het bedrijf behorende
      landbouwgrond van na 9 juli 1997, en het niet-gebonden mestproductierecht voor deze diersoorten zoals zou gelden
      op 1 januari 1998 indien geen rekening wordt gehouden met na 9 juli 1997 gedane kennisgevingen van verplaatsing met
      betrekking tot dit recht, en

      c. de mestproductie afkomstig van de in 1996 gehouden kippen.

      De latente ruimte is ten minste nihil.

      8 Indien het varkensrecht is bepaald overeenkomstig [hoofdstuk 2][ref16], [paragrafen 5][ref17],
      [6][ref18], [6B][ref19] of [7][ref20], wordt de latente ruimte bepaald overeenkomstig
      [artikel 55a, vierde lid, onderscheidenlijk vijfde lid, eerste volzin, van de Meststoffenwet][ref21].

      9 Indien het varkensrecht is bepaald overeenkomstig [hoofdstuk 2, paragraaf 6A][ref22], wordt de latente
      ruimte van elk van de tot de inrichting behorende bedrijven per afzonderlijk bedrijf bepaald overeenkomstig
      [artikel 55a, vierde lid, onderscheidenlijk vijfde lid, eerste volzin, van de Meststoffenwet][ref23].

      10 Indien het varkensrecht is bepaald overeenkomstig [hoofdstuk 2, paragraaf 7B][ref24], wordt de latente
      ruimte bepaald overeenkomstig het zevende lid, met dien verstande dat in [onderdeel a][ref25] in plaats van
      «[paragraaf 3][ref26]» wordt gelezen« [paragraaf 7B][ref27]» en in plaats van «in 1996» telkens wordt gelezen:
      in 1997.

      11 Indien het varkensrecht is bepaald overeenkomstig [hoofdstuk 2, paragraaf 7C][ref28], wordt de latente ruimte
      bepaald overeenkomstig [artikel 55a, vijfde lid, tweede volzin, van de Meststoffenwet][ref29].

      12 In afwijking in zoverre van het derde lid vindt geen doorhaling van de latente ruimte plaats ten aanzien
      van een daartoe aangemeld bedrijf voor het bij de melding aangegeven aantal kilogrammen fosfaat dat ten hoogste
      overeenkomt met het niet-benutte deel van het niet-gebonden mestproductierecht voor varkens en kippen, indien
      voldaan is aan elk van de voorwaarden, bedoeld in [artikel 23][ref30]. [Artikel 23][ref31] is voor het in de eerste
      volzin bedoelde bedrijf van overeenkomstige toepassing, met dien verstande dat indien het varkensrecht is bepaald
      overeenkomstig hoofdstuk 2, paragraaf 1, in dat artikel in plaats van «1996» telkens wordt gelezen: 1994.

      13 Voor de toepassing van het derde lid en het zevende lid, onderdeel a, is
      [artikel 55a, derde lid, van de Meststoffenwet][ref32] van overeenkomstige toepassing.

      14 Voor de toepassing van het zesde lid is [artikel 24 van de wet][ref33] van overeenkomstige toepassing.

      15 Indien het varkensrecht wordt bepaald overeenkomstig [artikel 7 van de wet][ref34], wordt in het zevende lid in
      plaats van «1996» telkens gelezen: 1995.


