  - number: '8'
    text: |-
      1 Het varkensrecht van het bedrijf, bedoeld in [artikel 7][ref1], komt overeen met het bij de melding, bedoeld
      in [artikel 2][ref2], aangegeven deel van het aantal varkenseenheden dat wordt bepaald door de som van het
      grondgebonden mestproductierecht geldend met betrekking tot 1996 en 89% van het met betrekking tot dat jaar
      geldende niet-gebonden mestproductierecht voor varkens en kippen te verminderen met achtereenvolgens:

      a. de mestproductie afkomstig van de in 1996 gehouden dieren van andere diersoorten dan varkens en kippen,
      voorzover deze mestproductie groter is dan het niet-gebonden mestproductierecht voor deze diersoorten geldend met
      betrekking tot dat jaar,

      b. de mestproductie van de in 1996 gehouden kippen, en

      c. 10% van het aantal kilogrammen fosfaat, zijnde ten minste nihil, dat wordt bepaald door het niet-gebonden
      mestproductierecht voor varkens en kippen geldend met betrekking tot 1996 te verminderen met de som van a en b,

      en dit verschil te delen door 7,4 kilogram fosfaat.

      2 De in het eerste lid bedoelde vermindering met 10% is niet van toepassing op het aantal varkens dat groter is
      dan het aantal dat wordt bepaald door het niet-gebonden mestproductierecht voor varkens en kippen geldend met
      betrekking tot 1996 te delen door 7,4 kilogram fosfaat.

      3 Indien in 1994, 1995 of 1996 op het bedrijf mestproductie afkomstig van fokzeugen heeft plaatsgevonden, is het
      fokzeugenrecht gelijk aan het varkensrecht, bedoeld in het eerste lid. Bij gebreke van een dergelijke mestproductie
      is het fokzeugenrecht nihil, behoudens indien uit [paragraaf 5][ref3] anders volgt.

      4 De [artikelen 9][ref4] en [10 van de wet ][ref5]zijn van overeenkomstige toepassing op het overeenkomstig deze
      paragraaf bepaalde varkensrecht, onderscheidenlijk fokzeugenrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel7
