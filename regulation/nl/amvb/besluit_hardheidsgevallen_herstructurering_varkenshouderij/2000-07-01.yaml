  - number: '15'
    text: |-
      1 Het fokzeugenrecht is gelijk aan het varkensrecht, voorzover het fokzeugenrecht niet groter is
      dan het aantal varkenseenheden dat overeenkomt met het aantal fokzeugen dat ingevolge de verleende
      milieuvergunning, bedoeld in [artikel 9, eerste lid, onderdelen a en b][ref1], onderscheidenlijk
      ingevolge de in [artikel 9, eerste lid, tweede volzin][ref2], bedoelde milieuvergunning dan wel het
      [Besluit melkrundveehouderijen milieubeheer][ref3] of het [Besluit akkerbouwbedrijven milieubeheer][ref4], ten
      hoogste mag worden gehouden. [Artikel 11, tweede lid][ref5], is van overeenkomstige toepassing.

      2 De [artikelen 9][ref6] en [10 van de wet][ref7] zijn van overeenkomstige toepassing op het overeenkomstig deze
      paragraaf bepaalde varkensrecht, onderscheidenlijk fokzeugenrecht.

      3 Deze paragraaf blijft buiten toepassing indien het op grond van deze paragraaf bepaalde
      varkensrecht minder dan 110% zou zijn van het varkensrecht, zoals dat door toepassing van
      [hoofdstuk II, uitgezonderd artikel 14, en artikel 24 van de wet][ref8] zou worden bepaald.


