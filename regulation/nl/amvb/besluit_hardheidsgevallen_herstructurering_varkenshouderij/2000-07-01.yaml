  - number: 21b
    text: |-
      1 Het varkensrecht van een bedrijf als bedoeld in [artikel 21a][ref1] komt overeen met het bij de melding, bedoeld
      in [artikel 2][ref2], aangegeven deel van het aantal varkenseenheden dat wordt bepaald door 90% van het met 11%
      verminderde niet-gebonden mestproductierecht voor varkens en kippen geldend met betrekking tot 1996 te delen door
      7,4 kilogram fosfaat.

      2 Het fokzeugenrecht komt overeen met een percentage van het varkensrecht, welk percentage wordt bepaald
      door het in 1994 gemiddeld op het bedrijf gehouden aantal fokzeugen te delen door het in 1994 gemiddeld
      op het bedrijf gehouden aantal varkens en de uitkomst te vermenigvuldigen met 100. De in de eerste volzin
      bedoelde aantallen fokzeugen en varkens zijn de aantallen die met betrekking tot het bedrijf zijn opgegeven
      in de aangifte overschotheffing 1994, met dien verstande dat ten aanzien van een bedrijf als bedoeld in
      [artikel 21a, eerste lid, onderdeel c][ref3], wordt uitgegaan van de opgave met betrekking tot een van de
      oorspronkelijke bedrijven, zoals dat bij de melding is aangegeven door de belanghebbende. Bij gebreke van een
      overeenkomstig de tweede volzin gedane opgave is het fokzeugenrecht nihil.

      3 De [artikelen 9][ref4] en [10][ref5] van de wet zijn van overeenkomstige toepassing op het overeenkomstig het
      eerste en tweede lid bepaalde varkensrecht, onderscheidenlijk fokzeugenrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel21a
