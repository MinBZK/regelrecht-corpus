  - number: '27'
    text: |-
      1 Voor de toepassing van [artikel 26, derde lid][ref1], wordt van de latente ruimte slechts het percentage in
      aanmerking genomen dat overeenkomt met het percentage dat de mestproductie afkomstig van de in 1996 gehouden
      varkens uitmaakt van de mestproductie afkomstig van de in 1996 gehouden varkens, kippen en dieren van andere
      diersoorten dan varkens en kippen. De mestproductie afkomstig van andere diersoorten dan varkens en kippen wordt
      slechts in aanmerking genomen voor zover deze groter is dan de som van het met betrekking tot 1996 geldende niet-
      gebonden mestproductierecht voor andere diersoorten dan varkens en kippen en het met betrekking tot 1996 geldende
      grondgebonden mestproductierecht.

      2 Voor de toepassing van [artikel 26, vijfde, onderscheidenlijk tiende lid][ref2], wordt in het eerste lid in
      plaats van «1996» telkens gelezen: 1994, onderscheidenlijk 1997.

      3 Voor de toepassing van [artikel 26, zevende, achtste en negende lid][ref3], wordt in het eerste lid in plaats
      van «1996» telkens gelezen: 1995 of 1996, al naar gelang het varkensrecht en het fokzeugenrecht, bedoeld in
      onderscheidenlijk [artikel 9, eerste lid][ref4], [16][ref5], [19, eerste lid,][ref6][19a, eerste lid][ref7],
      [19d, eerste lid][ref8], en [20][ref9] zijn bepaald overeenkomstig [artikel 7][ref10] of
      [artikel 6 van de wet][ref11].

      4 Het eerste lid is niet van toepassing indien het varkensrecht is bepaald overeenkomstig
      [hoofdstuk 2, paragraaf 2][ref12], onderscheidenlijk [4][ref13], [7A][ref14] of [7C][ref15], van dit besluit.


