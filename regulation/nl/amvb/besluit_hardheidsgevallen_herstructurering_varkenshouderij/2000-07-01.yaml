  - number: '19'
    text: |-
      1 Het varkensrecht en het fokzeugenrecht van een daartoe aangemeld bedrijf waarvan het niet-gebonden
      mestproductierecht voor varkens en kippen ten gevolge van de registratie in of na 1996 van een uiterlijk
      op 9 juli 1997 gedane kennisgeving van verplaatsing met betrekking tot dat recht is verkleind, en de tot
      het bedrijf behorende oppervlakte landbouwgrond dan wel het niet gebonden mestproductierecht voor andere
      diersoorten dan varkens en kippen in de periode van 1 januari 1996 tot 10 juli 1997 is vergroot, worden bepaald
      overeenkomstig [hoofdstuk II, uitgezonderd artikel 14, en artikel 24 van de wet][ref1], met dien verstande dat
      de [artikelen 9][ref2] en [10 van de wet][ref3] wat de in die artikelen bedoelde verkleiningen betreft, buiten
      toepassing blijven, voorzover de som van die verkleiningen overeenkomt met 90% van het aantal varkenseenheden dat
      wordt bepaald door:

      a. het aantal hectaren waarmee de tot het bedrijf behorende oppervlakte landbouwgrond in de periode van 1 januari
      1996 tot 10 juli 1997 per saldo is vergroot, te vermenigvuldigen met 125 kilogram fosfaat en de uitkomst te delen
      door 7,4 kilogram fosfaat, dan wel

      b. het aantal kilogrammen fosfaat waarmee het niet gebonden mestproductierecht voor andere diersoorten dan varkens
      en kippen ten gevolge van in of na 1996 uiterlijk op 9 juli 1997 gedane kennisgevingen van verplaatsing met
      betrekking tot dat recht per saldo is vergroot, te delen door 7,4 kilogram fosfaat.

      2 Indien het varkensrecht en het fokzeugenrecht worden bepaald overeenkomstig [artikel 7 van de wet][ref4], wordt
      in het eerste lid in plaats van «1996» telkens gelezen «1995» en wordt in plaats van «De [artikelen 9][ref5] en
      [10][ref6]» gelezen: De [artikelen 7, vierde lid en vijfde lid, laatste volzin][ref7], en [10][ref8].

      3 Indien het varkensrecht en het fokzeugenrecht worden bepaald overeenkomstig [paragraaf 1][ref9],[2][ref10],
      [4][ref11], [5][ref12], [7][ref13], [7A][ref14], [7B][ref15] of [7C van dit hoofdstuk][ref16], is het eerste
      lid van overeenkomstige toepassing, met dien verstande dat in dat lid in plaats van «de [artikelen 9][ref17]
      en [10][ref18] van de wet» wordt gelezen: de [artikelen 5, eerste, tweede en derde lid][ref19],
      [8, vierde lid][ref20], [15, tweede lid][ref21], [21b, derde lid][ref22], onderscheidenlijk 21f, vierde lid, van
      dit hoofdstuk.

      4 Indien het varkensrecht en het fokzeugenrecht worden bepaald overeenkomstig [paragraaf 1][ref23] van dit besluit,
      wordt in het eerste lid in plaats van «1996» telkens gelezen «1994».


