  - number: '23'
    text: |-
      1 In afwijking van [artikel 22][ref1] blijft [artikel 55a van de Meststoffenwet][ref2] buiten toepassing ten
      aanzien van een daartoe aangemeld bedrijf, voor het bij de melding aangegeven aantal kilogrammen fosfaat dat
      ten hoogste overeenkomt met het niet-benutte deel van het niet-gebonden mestproductierecht voor varkens en
      kippen, indien met betrekking tot het bedrijf na 1992 en vóór 10 juli 1997 ten behoeve van een vergroting van het
      aantal te houden dieren van in [bijlage A bij de Meststoffenwet][ref3] opgenomen andere diersoorten dan varkens,
      onderverdeeld in categorieën binnen die diersoorten:

      a. door het bevoegd gezag een milieuvergunning is verleend,

      b. een aanvraag is ingediend om een milieuvergunning en deze naar aanleiding van de aanvraag uiterlijk op 1 januari
      2001 is verleend, dan wel

      c. bij het bevoegd gezag overeenkomstig [artikel 8.19 van de Wet milieubeheer][ref4] dan
      wel overeenkomstig [artikel 4 van het Besluit melkrundveehouderijen milieubeheer][ref5] of
      [artikel 3 van het Besluit akkerbouwbedrijven milieubeheer][ref6] een of meer meldingen zijn gedaan.

      Een overeenkomstig [artikel 8.19 van de Wet milieubeheer][ref7] gedane melding wordt slechts in aanmerking genomen
      voorzover deze betrekking heeft op een verandering van de inrichting die overeenkomstig de op het tijdstip van
      de melding voor de inrichting geldende milieuvergunning kon leiden tot een uitbreiding van het aantal dieren van
      in [bijlage A bij de Meststoffenwet][ref8] opgenomen andere diersoorten dan varkens, onderverdeeld in categorieën
      binnen die diersoorten.

      2 [Artikel 2, derde lid][ref9], is van overeenkomstige toepassing op de in het eerste lid bedoelde melding.

      3 Het niet-benutte deel van het niet-gebonden mestproductierecht voor varkens en kippen komt overeen met het aantal
      kilogrammen fosfaat dat wordt bepaald door het niet-gebonden mestproductierecht voor varkens en kippen zoals dat
      zou gelden op 1 januari 1998 indien geen rekening wordt gehouden met na 9 juli 1997 gedane kennisgevingen van
      verplaatsing met betrekking tot dit recht, achtereenvolgens te verminderen met:

      a. het aantal kilogrammen fosfaat dat wordt bepaald door het verschil tussen het overeenkomstig
      [hoofdstuk II, uitgezonderd artikel 14, en artikel 24 van de wet][ref10] bepaalde varkensrecht en het grondgebonden
      deel daarvan achtereenvolgens te vermenigvuldigen met 100/90 en 7,4 kilogram fosfaat,

      b. de mestproductie afkomstig van de in 1996 gehouden dieren van andere diersoorten dan varkens en kippen,
      voorzover deze mestproductie groter is dan de som van het grondgebonden mestproductierecht zoals dat zou gelden
      op 1 januari 1998 indien geen rekening wordt gehouden met wijzigingen in de oppervlakte tot het bedrijf behorende
      landbouwgrond na 9 juli 1997, en het niet-gebonden mestproductierecht voor deze diersoorten zoals dat zou gelden
      op 1 januari 1998 indien geen rekening wordt gehouden met na 9 juli 1997 gedane kennisgevingen van verplaatsing met
      betrekking tot dit recht, en

      c. de mestproductie afkomstig van de in 1996 gehouden kippen.

      4 Een bedrijf komt uitsluitend voor de toepassing van dit artikel in aanmerking indien ten aanzien van het
      bedrijf is voldaan aan elk van de voorwaarden, bedoeld in [artikel 9, tweede lid, onderdelen a, b, d en e][ref11],
      met dien verstande dat voor de toepassing van dit hoofdstuk in dat artikel in plaats van «varkens» telkens
      wordt gelezen «dieren van de in [bijlage A bij de Meststoffenwet][ref12] opgenomen andere diersoorten dan
      varkens, onderverdeeld in categorieën binnen die diersoorten», en voorts onder de voorwaarde dat uiterlijk
      op 1 januari 2003 op het bedrijf extra huisvesting aanwezig is voor tenminste het aantal dieren van de in
      [bijlage A bij de Meststoffenwet][ref13] opgenomen andere diersoorten dan varkens, onderverdeeld in categorieën
      binnen die diersoorten, dat overeenkomt met 85% van het aantal kilogrammen fosfaat waarmee het niet-gebonden
      mestproductierecht voor varkens en kippen op grond van dit artikel is vergroot.

      5 Indien het varkensrecht wordt bepaald overeenkomstig [artikel 7 van de wet][ref14], wordt in het derde lid en
      voor de toepassing van het vierde lid in plaats van «1996» telkens gelezen: 1995.

      6 Voor de toepassing van dit artikel is [artikel 9, vierde en vijfde, lid][ref15] van overeenkomstige toepassing,
      met dien verstande dat in die artikelleden in plaats van «varkens» telkens wordt gelezen: dieren van de in
      [bijlage A bij de Meststoffenwet][ref16] opgenomen andere diersoorten dan varkens.

      7 Voor de toepassing van het derde lid, onderdeel a, is [artikel 55a, derde lid, van de Meststoffenwet][ref17] van
      overeenkomstige toepassing.


