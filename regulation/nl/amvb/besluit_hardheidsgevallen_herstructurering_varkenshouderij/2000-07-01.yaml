  - number: 19b
    text: |-
      1 Het varkensrecht en het fokzeugenrecht van elk van de bedrijven die behoren tot een inrichting als bedoeld in
      [artikel 19][ref1] komen overeen met het met betrekking tot het desbetreffende bedrijf bij de melding, bedoeld in
      [artikel 2][ref2], aangegeven deel van het voor de bedrijven gezamenlijk beschikbare aantal varkenseenheden.

      2 Het voor de bedrijven gezamenlijk beschikbare aantal varkenseenheden komt overeen met de som van de
      varkensrechten, onderscheidenlijk fokzeugenrechten, zoals deze voor elk van de bedrijven afzonderlijk zouden
      gelden indien deze zouden zijn bepaald overeenkomstig [hoofdstuk II][ref3], uitgezonderd [artikel 14][ref4],
      en [artikel 24 van de wet][ref5]. Deze som wordt verhoogd met 90% van het aantal varkenseenheden dat wordt
      bepaald door de som van het aantal hectaren waarmee de tot de bedrijven van de inrichting behorende oppervlakte
      landbouwgrond in de periode van 1 januari 1994 tot en met 9 juli 1997 per saldo is vergroot, te vermenigvuldigen
      met 125 kilogram fosfaat en de uitkomst te delen door 7,4 kilogram fosfaat. De verhoging betreft het grondgebonden
      deel van het varkensrecht, onderscheidenlijk fokzeugenrecht, en is niet meer dan de som van de verkleiningen die op
      grond van de artikelen 9 en 10 van de wet in de periode van 1 januari 1994 tot en met 9 juli 1997 per saldo op de
      tot de inrichting behorende bedrijven hebben plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0009705#Artikel2
