  - number: 21d
    text: |-
      1 Het varkensrecht, onderscheidenlijk het fokzeugenrecht, van het bedrijf, bedoeld in [artikel 21c][ref1], wordt
      vergroot met het bij de melding, bedoeld in [artikel 2][ref2], aangegeven aantal varkenseenheden dat ten hoogste
      overeenkomt met het aantal dat wordt bepaald door het in 1997 gemiddeld op het bedrijf gehouden aantal varkens,
      onderscheidenlijk fokzeugen, te verminderen met het in 1996 gemiddeld op het bedrijf gehouden aantal varkens,
      onderscheidenlijk fokzeugen, en op de uitkomst 10% in mindering te brengen.

      2 De in het eerste lid bedoelde vermindering met 10% is niet van toepassing op het aantal varkens,
      onderscheidenlijk fokzeugen, dat groter is dan het aantal dat wordt bepaald door het niet-gebonden
      mestproductierecht voor varkens en kippen geldend met betrekking tot 1997 te delen door 7,4 kilogram fosfaat en de
      uitkomst te verminderen met het in 1996 gemiddeld op het bedrijf gehouden aantal varkens.

      3 Voor de toepassing van het eerste lid is [artikel 4, tweede lid][ref3], van overeenkomstige toepassing, met dien
      verstande dat in plaats van «in 1994» wordt gelezen: in 1997.

      4 [Artikel 6, vierde, vijfde en zesde lid, van de wet][ref4] is van overeenkomstige toepassing, met
      dien verstande dat in plaats van «1996» telkens wordt gelezen «1996, onderscheidenlijk 1997,» en in
      [artikel 6, vierde lid, van de wet][ref5] in plaats van «in de aangifte overschotheffing 1996, bij gebreke
      daarvan, op het afsluitformulier 1996, dan wel, bij gebreke daarvan, op de vrijstellingsverklaring 1996» wordt
      gelezen: in de aangifte overschotheffing 1996, onderscheidenlijk de aangifte overschotheffing 1997; bij gebreke
      daarvan, op het afsluitformulier 1996, onderscheidenlijk het afsluitformulier 1997; bij gebreke daarvan, op de
      vrijstellingsverklaring 1996, onderscheidenlijk de vrijstellingsverklaring 1997.

      5 Indien het varkensrecht overeenkomstig [artikel 7 van de wet ][ref6]is bepaald, wordt in het eerste lid in plaats
      van «1996» gelezen: 1995.


