  - number: 21e
    text: |-
      Het varkensrecht en het fokzeugenrecht van een daartoe aangemeld bedrijf worden bepaald overeenkomstig deze
      paragraaf, indien ten aanzien van het bedrijf de mestproductie afkomstig van varkens in 1994, 1995 en 1996
      gemiddeld ten minste 25% en in 1996 ten minste 5% was van de som van het niet-gebonden mestproductierecht voor
      varkens en kippen geldend met betrekking tot het desbetreffende jaar en het met betrekking tot dat jaar geldende
      grondgebonden mestproductierecht.
    url: https://wetten.overheid.nl/BWBR0009705/2000-07-01#Artikel21e
  - number: 21f
    text: |-
      1 Het varkensrecht van een bedrijf als bedoeld in [artikel 21e][ref1] komt overeen met 90% van het aantal
      varkenseenheden dat wordt bepaald door het door de belanghebbende daartoe bij de melding, bedoeld in
      [artikel 2][ref2], aangegeven deel van het niet-gebonden mestproductierecht voor varkens en kippen geldend met
      betrekking tot 1996 te delen door 7,4 kilogram fosfaat en op de uitkomst 18% in mindering te brengen.

      2 Het fokzeugenrecht komt overeen met het bij de melding, bedoeld in [artikel 2][ref3], aangegeven deel van het
      aantal varkenseenheden dat naar keuze van de belanghebbende wordt bepaald door:

      a. een percentage van het varkensrecht, welk percentage wordt bepaald door het in 1994 gemiddeld op het bedrijf
      gehouden aantal fokzeugen te delen door het in 1994 gemiddeld op het bedrijf gehouden aantal varkens en de uitkomst
      te vermenigvuldigen met 100, dan wel

      b. het in 1996 gemiddeld op het bedrijf gehouden aantal fokzeugen, verminderd met 10%.

      3 De in het tweede lid, onderdeel a, bedoelde aantallen varkens en fokzeugen zijn de aantallen die met betrekking
      tot het bedrijf zijn opgegeven in de aangifte overschotheffing 1994. Indien het fokzeugenrecht wordt bepaald
      overeenkomstig het tweede lid, onderdeel b, is [artikel 6, derde, vierde, vijfde en zesde lid, van de wet][ref4]
      van overeenkomstige toepassing, met dien verstande dat in plaats van «varkens, onderscheidenlijk fokzeugen,»
      telkens wordt gelezen: fokzeugen.

      4 De [artikelen 9][ref5] en [10 van de wet][ref6] zijn van overeenkomstige toepassing op het overeenkomstig het
      eerste en tweede lid bepaalde varkensrecht, onderscheidenlijk fokzeugenrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel21e
