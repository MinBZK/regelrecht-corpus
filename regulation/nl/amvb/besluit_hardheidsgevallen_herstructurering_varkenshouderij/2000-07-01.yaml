  - number: 19a
    text: |-
      1 Het varkensrecht van daartoe aangemelde bedrijven die behoren tot één en dezelfde inrichting wordt bepaald
      overeenkomstig deze paragraaf indien voldaan is aan elk van de volgende voorwaarden:

      a. er is sprake van een inrichting die beschikt over een vóór 1 januari 1994 verleende milieuvergunning en die twee
      of meer op 9 juli 1997 bij het Bureau Heffingen geregistreerde bedrijven omvat;

      b. er heeft op ten minste één van de tot de inrichting behorende bedrijven per saldo een verkleining plaatsgevonden
      van het niet-gebonden mestproductierecht voor varkens en kippen ten gevolge van de registratie van een in de
      periode van 1 januari 1994 tot en met 9 juli 1997 gedane kennisgeving van verplaatsing met betrekking tot dat
      recht, terwijl de tot het bedrijf behorende oppervlakte landbouwgrond alsmede de som van het grondgebonden
      mestproductierecht en het niet-gebonden mestproductierecht voor varkens en kippen van ten minste één ander tot de
      inrichting behorend bedrijf in de periode van 1 januari 1994 tot en met 9 juli 1997 per saldo is vergroot;

      c. de mestproductie van varkens bedroeg in 1997 ten minste 5% van de som van het niet-gebonden mestproductierecht
      voor varkens en kippen, zoals dat met betrekking tot 1997 voor elk van de tot de inrichting behorende bedrijven
      gold, vermeerderd met de som van het voor elk van de bedrijven met betrekking tot dat jaar geldende grondgebonden
      mestproductierecht;

      d. de vergroting van de tot het bedrijf behorende oppervlakte landbouwgrond is uiterlijk op 21 oktober 1998
      schriftelijk bij het Bureau Heffingen gemeld;

      e. de grond waarmee de tot het bedrijf behorende oppervlakte landbouwgrond is uitgebreid, was al vóór 10 juli 1997
      in het kader van een normale bedrijfsvoering daadwerkelijk in gebruik bij het desbetreffende bedrijf.

      2 Bij de melding, bedoeld in [artikel 2][ref1], wordt een afschrift van de met betrekking tot de inrichting
      geldende milieuvergunning overgelegd aan het Bureau Heffingen. Indien de milieuvergunning is verleend na 1 januari
      1994, worden op verzoek van het Bureau Heffingen binnen de daarbij aangegeven termijn alle eerdere met betrekking
      tot die inrichting verleende milieuvergunningen aan dat bureau overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel2
