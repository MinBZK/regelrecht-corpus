    text: |-
      De vergroting van het varkensrecht, bedoeld in [artikel 10][ref1], betreft het grondgebonden deel van het
      varkensrecht, voorzover het aantal varkenseenheden dat overeenkomt met de vergroting groter is dan het aantal
      varkenseenheden dat wordt bepaald door 90% van het in de aanhef van [artikel 10, tweede lid][ref2], bedoelde niet-
      gebonden mestproductierecht voor varkens en kippen te delen door 7,4 kilogram fosfaat en de uitkomst te verminderen
      tot ten minste nihil met het verschil tussen het overeenkomstig hoofdstuk II, uitgezonderd [artikel 14][ref3], en
      [artikel 24 van de wet ][ref4]bepaalde varkensrecht en het grondgebonden deel daarvan.


