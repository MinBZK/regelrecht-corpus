  - number: '10'
    text: |-
      1 Het varkensrecht van het bedrijf, bedoeld in [artikel 9][ref1], wordt vergroot met het bij de melding, bedoeld
      in [artikel 2][ref2], aangegeven aantal varkenseenheden dat ten hoogste overeenkomt met het niet-benutte deel van
      het mestproductierecht.

      2 Het niet-benutte deel van het mestproductierecht, bedoeld in het eerste lid, komt overeen met het aantal
      varkenseenheden dat wordt bepaald door de som van het grondgebonden mestproductierecht zoals dat zou gelden op
      1 januari 1998 indien geen rekening wordt gehouden met wijzigingen in de oppervlakte tot het bedrijf behorende
      landbouwgrond van na 9 juli 1997, en het niet-gebonden mestproductierecht voor varkens en kippen zoals dat
      zou gelden op 1 januari 1998 indien geen rekening wordt gehouden met na 9 juli 1997 gedane kennisgevingen van
      verplaatsing met betrekking tot dit recht, achtereenvolgens te verminderen met:

      a. het aantal kilogrammen fosfaat dat wordt bepaald door het verschil tussen het overeenkomstig
      [hoofdstuk II, uitgezonderd artikel 14, en artikel 24 van de wet][ref3] bepaalde varkensrecht en het grondgebonden
      deel daarvan te vermenigvuldigen met 100/90, het product vervolgens te vermeerderen met dit grondgebonden deel en
      deze som te vermenigvuldigen met 7,4 kilogram fosfaat,

      b. de mestproductie afkomstig van de in 1996 gehouden dieren van andere diersoorten dan varkens en kippen,
      voorzover deze mestproductie groter is dan het niet-gebonden mestproductierecht voor deze diersoorten zoals dat
      zou gelden op 1 januari 1998 indien geen rekening wordt gehouden met na 9 juli 1997 gedane kennisgevingen van
      verplaatsing met betrekking tot dit recht,

      c. de mestproductie afkomstig van de in 1996 gehouden kippen, en

      d. 10% van het aantal kilogrammen fosfaat, zijnde ten minste nihil, dat wordt bepaald door het in de aanhef
      bedoelde niet-gebonden mestproductierecht voor varkens en kippen te verminderen met de som van a, b en c,

      en dit verschil te delen door 7,4 kilogram fosfaat.

      3 Indien het varkensrecht overeenkomstig [artikel 7 van de wet][ref4] is bepaald, wordt in het tweede lid in plaats
      van «1996» telkens gelezen: 1995.

      4 Voor de toepassing van het tweede lid, onderdeel a, is [artikel 55a, derde lid, van de Meststoffenwet][ref5] van
      overeenkomstige toepassing.


