  - number: '7'
    text: |-
      1 Het varkensrecht en het fokzeugenrecht van een daartoe aangemeld bedrijf worden bepaald overeenkomstig
      deze paragraaf, indien in de periode van 1 januari 1995 tot 10 juli 1997 een overdracht van het bedrijf heeft
      plaatsgevonden en wordt voldaan aan [artikel 3, eerste lid][ref1], met dien verstande dat in dat lid in plaats van
      «zowel ten aanzien van 1995 als ten aanzien van 1996» wordt gelezen: ten aanzien van elk van de jaren 1994, 1995
      en 1996.

      2 Een bedrijf komt uitsluitend voor de toepassing van deze paragraaf in aanmerking indien ten aanzien van het
      bedrijf is voldaan aan elk van de volgende voorwaarden:

      a. de mestproductie afkomstig van varkens is in 1994, 1995 of 1996 ten minste 125 kilogram fosfaat en ten minste
      5% van de som van het niet-gebonden mestproductierecht voor varkens en kippen geldend met betrekking tot het
      desbetreffende jaar en het met betrekking tot dat jaar geldende grondgebonden mestproductierecht;

      b. het niet-gebonden mestproductierecht voor varkens en kippen is per saldo niet verkleind ten gevolge van
      de registratie van na de overdracht, bedoeld in het eerste lid, of, ingeval één of meer overdrachten hebben
      plaatsgevonden, na de laatste van die overdrachten, tot 10 juli 1997 gedane kennisgevingen van verplaatsing met
      betrekking tot dat recht.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel3
