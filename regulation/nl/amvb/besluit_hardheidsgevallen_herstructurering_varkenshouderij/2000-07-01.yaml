  - number: '9'
    text: |-
      1 Het overeenkomstig hoofdstuk II, uitgezonderd [artikel 14][ref1], en [artikel 24][ref2] van de wet bepaalde
      varkensrecht, onderscheidenlijk fokzeugenrecht, van een daartoe aangemeld bedrijf wordt overeenkomstig deze
      paragraaf vergroot, indien met betrekking tot het desbetreffende bedrijf na 1992 en vóór 10 juli 1997 ten behoeve
      van een vergroting van het aantal te houden varkens:

      a. door het bevoegd gezag een milieuvergunning is verleend,

      b. een aanvraag is ingediend om een milieuvergunning, die naar aanleiding van de aanvraag uiterlijk op 1 januari
      2001 is verleend, dan wel

      c. bij het bevoegd gezag overeenkomstig [artikel 8.19 van de Wet milieubeheer][ref3] dan
      wel overeenkomstig [artikel 4 van het Besluit melkrundveehouderijen milieubeheer][ref4] of
      [artikel 3 van het Besluit akkerbouwbedrijven milieubeheer][ref5] een of meer meldingen zijn gedaan.

      Een overeenkomstig [artikel 8.19 van de Wet milieubeheer][ref6] gedane melding wordt slechts in aanmerking genomen
      voorzover deze betrekking heeft op een verandering van de inrichting die overeenkomstig de op het tijdstip van de
      melding voor de inrichting geldende milieuvergunning kon leiden tot een uitbreiding van het aantal varkens.

      2 Een bedrijf komt uitsluitend voor de toepassing van deze paragraaf in aanmerking indien ten aanzien van het
      bedrijf is voldaan aan elk van de volgende voorwaarden:

      a. het niet-gebonden mestproductierecht voor varkens en kippen is per saldo niet verkleind ten gevolge van de
      registratie van kennisgevingen van verplaatsingen met betrekking tot dat recht die zijn gedaan in de periode van
      1 januari 1996 tot 10 juli 1997 of, ingeval het bedrijf na 1 januari 1996 door samenvoeging is ontstaan of een of
      meerdere malen is overgedragen, in de periode gelegen tussen die samenvoeging of de laatste van die overdrachten en
      10 juli 1997;

      b. uiterlijk op 1 januari 2003 is binnen de inrichting extra huisvesting gebouwd voor ten minste 75%
      van het aantal varkens waarvoor extra huisvesting diende te worden gebouwd om alle varkens die mogen
      worden gehouden ingevolge de verleende milieuvergunning, bedoeld in het eerste lid, onderdelen a en b,
      onderscheidenlijk ingevolge de milieuvergunning, bedoeld in de tweede volzin van dat lid dan wel het
      [Besluit melkrundveehouderijen milieubeheer][ref7] of het [Besluit akkerbouwbedrijven milieubeheer][ref8],
      te kunnen huisvesten overeenkomstig de verleende milieuvergunning, onderscheidenlijk overeenkomstig
      de in het eerste lid, tweede volzin, bedoelde milieuvergunning in samenhang met de overeenkomstig
      [artikel 8.19 van de Wet milieubeheer][ref9] gedane meldingen, dan wel overeenkomstig het
      [Besluit melkrundveehouderijen milieubeheer][ref10] of het [Besluit akkerbouwbedrijven milieubeheer][ref11] in
      samenhang met de in het eerste lid, onderdeel c, bedoelde meldingen;.

      c. uiterlijk op 1 januari 2003 is op het bedrijf huisvesting voor varkens aanwezig voor tenminste het aantal
      varkens dat overeenkomt met 85% van het op grond van deze paragraaf vergrote varkensrecht;

      d. bij de melding, bedoeld in [artikel 2][ref12], wordt een afschrift van de vergunning, bedoeld in het eerste
      lid, onderdeel a, de aanvraag, bedoeld in het eerste lid, onderdeel b, onderscheidenlijk de meldingen, bedoeld
      in het eerste lid, onderdeel c en, in voorkomend geval, de milieuvergunning, bedoeld in de tweede volzin van het
      eerste lid, waarop door het bevoegd gezag de datum van ontvangst is aangetekend, overgelegd. Bij gebreke van een
      dergelijke aantekening wordt tevens een door het bevoegd gezag afgegeven bewijs van ontvangst, waarin die datum is
      vermeld, overgelegd;

      e. binnen zes weken na de verlening van de milieuvergunning, bedoeld in het eerste lid, onderdeel b, dan wel,
      indien die verlening vóór de inwerkingtreding van dit besluit heeft plaatsgevonden, binnen zes weken na die
      inwerkingtreding, wordt een afschrift van de milieuvergunning overgelegd aan het Bureau Heffingen. Op verzoek van
      het Bureau Heffingen wordt binnen de daarbij aangegeven termijn de milieuvergunning aan dat bureau overgelegd.

      3 Indien het varkensrecht overeenkomstig [artikel 7 van de wet][ref13] is bepaald, wordt in het tweede lid,
      onderdeel a, in plaats van «1996» telkens gelezen: 1995.

      4 Indien het bedrijf na 10 juli 1997 met betrekking tot dezelfde inrichting
      overeenkomstig [artikel 8.19 van de Wet milieubeheer][ref14], onderscheidenlijk
      [artikel 4 van het Besluit melkrundveehouderijen milieubeheer][ref15] of
      [artikel 3 van het Besluit akkerbouwbedrijven milieubeheer][ref16], een melding heeft gedaan dan wel een nieuwe
      aanvraag voor een milieuvergunning heeft gedaan die niet ziet op een verdere uitbreiding van de varkensstapel,
      treedt de melding dan wel de nieuwe aanvraag, onderscheidenlijk de uiterlijk op 1 januari 2001 naar aanleiding van
      die aanvraag verleende milieuvergunning, voor de toepassing van het tweede lid, onderdelen b en e, in de plaats van
      de meldingen bedoeld in het eerste lid, onderdeel c, onderscheidenlijk van de in onderdeel b van dat lid bedoelde
      aanvraag dan wel van de milieuvergunning, bedoeld in het eerste lid, onderdeel a. Een afschrift van de melding,
      onderscheidenlijk de nieuwe aanvraag, wordt aan het Bureau Heffingen overgelegd.

      5 Binnen zes weken nadat de huisvesting voor varkens, bedoeld in het tweede lid, onderdelen b en c, is
      gerealiseerd, dan wel, indien de huisvesting vóór de inwerkingtreding van het onderhavige artikellid heeft
      plaatsgevonden, binnen zes weken na inwerkingtreding van dat lid, geeft de belanghebbende hiervan kennis aan het
      Bureau Heffingen met gebruikmaking van een daartoe door Onze Minister vastgesteld formulier met toelichting, dat
      overeenkomstig de op het formulier aangeven wijze volledig en naar waarheid is ingevuld en door de belanghebbende
      is ondertekend.

      6 Deze paragraaf blijft buiten toepassing indien de vergroting minder dan 10% van het overeenkomstig
      [hoofdstuk II, uitgezonderd artikel 14, en artikel 24 van de wet][ref17] bepaalde varkensrecht zou zijn.


