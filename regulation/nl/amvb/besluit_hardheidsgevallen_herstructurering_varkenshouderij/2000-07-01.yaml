  - number: 19e
    text: |-
      De vergroting van het varkensrecht en het fokzeugenrecht betreft het grondgebonden deel van het varkensrecht,
      onderscheidenlijk het fokzeugenrecht.
    url: https://wetten.overheid.nl/BWBR0009705/2000-07-01#Artikel19e
  - number: '20'
    text: |-
      1 Het varkensrecht en het fokzeugenrecht van een daartoe aangemeld bedrijf waaraan vóór 1994 met betrekking tot
      de productie van dierlijke meststoffen een ontheffing op grond van [artikel 16 van de Meststoffenwet][ref1],
      zoals dat luidde tot 1 januari 1998, is verleend met een geldigheid voor een periode tot tenminste
      het tijdstip van inwerkingtreding van [artikel 15 van de wet][ref2], worden bepaald overeenkomstig
      [hoofdstuk II][ref3] en [artikel 24 van de wet][ref4] en deze paragraaf, waarbij voor de toepassing van
      [artikel 6, zesde lid, van de wet][ref5] de in dat lid bedoelde som wordt vermeerderd met het aantal
      kilogrammen fosfaat waarvoor de ontheffing met betrekking tot 1996 geldt, en voor de toepassing van
      [artikel 13 van de wet][ref6] de in dat artikel bedoelde som wordt vermeerderd met het aantal kilogrammen fosfaat
      waarvoor de ontheffing met betrekking tot 1998 geldt.

      2 Indien het varkensrecht en het fokzeugenrecht worden bepaald overeenkomstig [paragraaf 3][ref7], [4][ref8],
      [5][ref9], [6][ref10], [6A][ref11], [6B][ref12] of [7B van dit hoofdstuk][ref13], is het eerste lid van
      overeenkomstige toepassing, voorzover de [artikelen 6, zesde lid][ref14], en [13][ref15], van de wet, daarbij
      overeenkomstige toepassing vinden en met dien verstande dat:

      a. voor de toepassing van [artikel 10, tweede lid][ref16], de in dat lid bedoelde som wordt vermeerderd met het
      aantal kilogrammen fosfaat waarvoor de ontheffing met betrekking tot 1997 geldt;

      b. voor de toepassing van [artikel 14][ref17] de in dat lid bedoelde som wordt vermeerderd met het aantal
      kilogrammen fosfaat waarvoor de ontheffing met betrekking tot 1996 geldt.


