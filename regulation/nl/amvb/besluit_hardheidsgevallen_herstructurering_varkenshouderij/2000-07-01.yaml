  - number: '24'
    text: |-
      Voor producenten van dierlijke meststoffen op een bedrijf met op de dag voorafgaand aan het tijdstip
      van inwerkingtreding van [artikel 15 van de Wet herstructurering varkenshouderij][ref1] een niet-
      gebonden mestproductierecht voor andere diersoorten dan varkens en kippen wordt voor de toepassing van
      [artikel 55a, eerste lid, van de Meststoffenwet][ref2] in plaats van de tweede volzin van dat artikellid gelezen:
      De vermindering geschiedt ten aanzien van het de dag voorafgaand aan het tijdstip van inwerkingtreding van
      [artikel 15 van de Wet herstructurering varkenshouderij][ref3] geldende niet-gebonden mestproductierecht voor
      varkens en kippen.


