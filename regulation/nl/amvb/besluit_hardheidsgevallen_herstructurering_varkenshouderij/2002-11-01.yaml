  - number: 19g.2
    text: |-
      De gegevens van de in het eerste lid bedoelde opgave worden slechts in aanmerking genomen als deze voor 10 juli
      1997 zijn ontvangen door de Dienst Landelijke service bij regelingen van het ministerie van Landbouw, Natuurbeheer
      en Visserij, onderscheidenlijk de teller, bedoeld in artikel 1, onderdeel c, Regeling landbouwtelling 1995.
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel19g
  - number: 19g.3
    text: |-
      Voor de toepassing van het eerste lid worden in de opgave vermelde: - biggen tot 20 kilogram die nog bij de zeug
      worden gehouden niet in aanmerking genomen;
        - biggen tot 20 kilogram die niet meer bij de zeug worden gehouden aangemerkt als biggen als bedoeld in
      [bijlage A, onderdeel 5, van de wet][ref1];
        - vleesvarkens van 20 tot 50 kilogram en vleesvarkens van 50 kilogram en meer aangemerkt als vleesvarkens als
      bedoeld in [bijlage A, onderdeel 7, van de wet][ref2];
        - opfokzeugjes en -beertjes van 20 tot 50 kilogram aangemerkt als opfokzeugen als bedoeld in
      [bijlage A, onderdeel 2, onder a, van de wet][ref3];
        - niet gedekte opfokzeugen van 50 kilogram en meer aangemerkt als opfokzeugen als bedoeld in
      [bijlage A, onderdeel 2, onder b, van de wet][ref4];
        - gedekte, al dan niet drachtige zeugen, zeugen die bij de biggen worden gehouden en overige, guste fokzeugen
      aangemerkt als fokzeugen als bedoeld in [bijlage A, onderdeel 1, onder a, van de wet][ref5];
        - niet dekrijpe opfokberen van 50 kilogram en meer aangemerkt als opfokberen als bedoeld in
      [bijlage A, onderdeel 3, van de wet][ref6];
        - dekrijpe beren aangemerkt als dekberen als bedoeld in [bijlage A, onderdeel 4, van de wet][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0009542
      [ref2]: https://wetten.overheid.nl/BWBR0009542
