        artikel: '24'
        hoofdstuk: '3'
  - number: 16.a
    text: door het bevoegd gezag een milieuvergunning is verleend,
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel16
  - number: 16.b
    text: |-
      een aanvraag is ingediend om een milieuvergunning en deze naar aanleiding van de aanvraag uiterlijk op 1 januari
      2001 is verleend, dan wel
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel16
  - number: 16.c
    text: |-
      bij het bevoegd gezag overeenkomstig [artikel 8.19 van de Wet milieubeheer][ref1] dan wel
      overeenkomstig [artikel 4 van het Besluit melkrundveehouderijen milieubeheer][ref2] of
      [artikel 3 van het Besluit akkerbouwbedrijven milieubeheer][ref3] een of meer meldingen zijn gedaan. Een
      overeenkomstig [artikel 8.19 van de Wet milieubeheer][ref4] gedane melding wordt slechts in aanmerking genomen
      voorzover deze betrekking heeft op een verandering van de inrichting die overeenkomstig de op het tijdstip van de
      melding voor de inrichting geldende milieuvergunning kon leiden tot een uitbreiding van het aantal fokzeugen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005158#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0006449#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel16
    references:
      - id: ref1
