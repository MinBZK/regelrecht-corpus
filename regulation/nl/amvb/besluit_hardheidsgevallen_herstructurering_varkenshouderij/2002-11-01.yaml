        paragraaf: '4'
  - number: '21.1'
    text: |-
      Bij de bepaling van het grondgebonden deel van het varkensrecht, onderscheidenlijk fokzeugenrecht, blijft
      buiten beschouwing het aantal varkenseenheden dat wordt bepaald door het aantal kilogrammen fosfaat waarvoor de
      ontheffing, bedoeld in [artikel 20, eerste lid][ref1], met betrekking tot 1996 geldt, te delen door 7,4 kilogram
      fosfaat.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel20
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0009705
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '7'
  - number: '21.2'
    text: |-
      Ingeval het varkensrecht, onderscheidenlijk fokzeugenrecht, wordt bepaald op grond van [artikel 7][ref1] van de
      wet, wordt in het eerste lid in plaats van «1996» gelezen: 1995.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel7
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0009705
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '21.3'
    text: |-
      Ingeval het varkensrecht, onderscheidenlijk fokzeugenrecht, wordt bepaald overeenkomstig [paragraaf 6B][ref1]
      of [7B van dit hoofdstuk][ref2], wordt in het eerste lid in plaats van «1996» gelezen: 1997.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0009705#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0009705
        hoofdstuk: '2'
        paragraaf: 6B
      - id: ref2
        bwb_id: BWBR0009705
        hoofdstuk: '2'
        paragraaf: 7B
  - number: 21a.1
    text: |-
      Het varkensrecht en het fokzeugenrecht van een daartoe aangemeld bedrijf worden, in zoverre in afwijking van
      [artikel 2, eerste lid][ref1], bepaald overeenkomstig deze paragraaf, voorzover het betreft een bedrijf waarop:


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel2
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0009705
        artikel: '2'
        hoofdstuk: '1'
  - number: 21a.1.a
    text: |-
      [artikel 8, eerste lid, van de wet][ref1] van toepassing is en ten aanzien waarvan in de periode na 1995 tot 10
      juli 1997 een overdracht heeft plaatsgevonden,


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel8
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '8'
  - number: 21a.1.b
    text: |-
      [artikel 8, vierde lid, van de wet][ref1] van toepassing is en ten aanzien waarvan in de periode na 1995 tot 10
      juli 1997 een overdracht heeft plaatsgevonden, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel8
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '8'
  - number: 21a.1.c
    text: |-
      [artikel 11, zesde lid, van de wet][ref1] van toepassing is en ten aanzien waarvan in de periode na 1995 tot 10
      juli 1997 een samenvoeging heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel11
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '11'
  - number: 21a.2
    text: |-
      Een bedrijf als bedoeld in het eerste lid komt uitsluitend voor de toepassing van deze paragraaf in aanmerking
      indien ten aanzien van het bedrijf is voldaan aan elk van de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel21a
  - number: 21a.2.a
    text: |-
      de verkrijger van het overgedragen, onderscheidenlijk na samenvoeging ontstane, bedrijf heeft,
      indien de overdracht, onderscheidenlijk de samenvoeging, in 1996 plaatsvond, overeenkomstig
      [artikel 6, vierde lid van de wet][ref1], opgave gedaan van het gemiddeld in 1996 op het bedrijf gehouden aantal
      varkens, onderscheidenlijk fokzeugen;


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel6
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '6'
  - number: 21a.2.b
    text: |-
      de mestproductie afkomstig van varkens is in 1997 ten minste 5% van het niet-gebonden mestproductierecht voor
      varkens en kippen geldend met betrekking tot dat jaar;
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel21a
  - number: 21a.2.c
    text: |-
      het niet-gebonden mestproductierecht voor varkens en kippen is per saldo niet verkleind ten gevolge van na
      de overdracht, onderscheidenlijk samenvoeging, of, ingeval meerdere overdrachten of samenvoegingen hebben
      plaatsgevonden, na de laatste van die overdrachten of samenvoegingen, tot 10 juli 1997 gedane kennisgevingen van
      verplaatsing met betrekking tot dat recht.
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel21a
  - number: 21b.1
    text: |-
      Het varkensrecht van een bedrijf als bedoeld in [artikel 21a][ref1] komt overeen met het bij de melding, bedoeld
      in [artikel 2][ref2], aangegeven deel van het aantal varkenseenheden dat wordt bepaald door 90% van het met 11%
      verminderde niet-gebonden mestproductierecht voor varkens en kippen geldend met betrekking tot 1996 te delen door
      7,4 kilogram fosfaat.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel21a
      [ref2]: https://wetten.overheid.nl/BWBR0009705#Artikel2
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel21b
    references:
      - id: ref1
        bwb_id: BWBR0009705
        artikel: 21a
        hoofdstuk: '2'
        paragraaf: 7A
      - id: ref2
        bwb_id: BWBR0009705
        artikel: '2'
        hoofdstuk: '1'
  - number: 21b.2
    text: |-
      Het fokzeugenrecht komt overeen met een percentage van het varkensrecht, welk percentage wordt bepaald door het in
      1994 gemiddeld op het bedrijf gehouden aantal fokzeugen te delen door het in 1994 gemiddeld op het bedrijf gehouden
      aantal varkens en de uitkomst te vermenigvuldigen met 100. De in de eerste volzin bedoelde aantallen fokzeugen en
      varkens zijn de aantallen die met betrekking tot het bedrijf zijn opgegeven in de aangifte overschotheffing 1994,
      met dien verstande dat ten aanzien van een bedrijf als bedoeld in [artikel 21a, eerste lid, onderdeel c][ref1],
      wordt uitgegaan van de opgave met betrekking tot een van de oorspronkelijke bedrijven, zoals dat bij de melding
      is aangegeven door de belanghebbende. Bij gebreke van een overeenkomstig de tweede volzin gedane opgave is het
      fokzeugenrecht nihil.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel21a
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel21b
    references:
      - id: ref1
        bwb_id: BWBR0009705
        artikel: 21a
        hoofdstuk: '2'
        paragraaf: 7A
  - number: 21b.3
    text: |-
      De [artikelen 9][ref1] en [10][ref2] van de wet zijn van overeenkomstige toepassing op het overeenkomstig het
      eerste en tweede lid bepaalde varkensrecht, onderscheidenlijk fokzeugenrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel10
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel21b
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '10'
  - number: 21c
    text: |-
      Het overeenkomstig [hoofdstuk II][ref1], uitgezonderd [artikel 14][ref2], en [artikel 24 van de wet][ref3]
      bepaalde varkensrecht, onderscheidenlijk fokzeugenrecht, van een daartoe aangemeld bedrijf wordt overeenkomstig
      deze paragraaf vergroot, indien de mestproductie afkomstig van varkens in 1994, 1995 en 1996 gemiddeld minder
      dan 5% en in 1997 ten minste 25% was van de som van het niet-gebonden mestproductierecht voor varkens en kippen
      geldend met betrekking tot het desbetreffende jaar en het met betrekking tot dat jaar geldende grondgebonden
      mestproductierecht.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0009542#Artikel24
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel21c
    references:
      - id: ref1
        bwb_id: BWBR0009542
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0009542
        artikel: '24'
  - number: 21d.1
    text: |-
      Het varkensrecht, onderscheidenlijk het fokzeugenrecht, van het bedrijf, bedoeld in [artikel 21c][ref1], wordt
      vergroot met het bij de melding, bedoeld in [artikel 2][ref2], aangegeven aantal varkenseenheden dat ten hoogste
      overeenkomt met het aantal dat wordt bepaald door het in 1997 gemiddeld op het bedrijf gehouden aantal varkens,
      onderscheidenlijk fokzeugen, te verminderen met het in 1996 gemiddeld op het bedrijf gehouden aantal varkens,
      onderscheidenlijk fokzeugen, en op de uitkomst 10% in mindering te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel21c
      [ref2]: https://wetten.overheid.nl/BWBR0009705#Artikel2
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel21d
    references:
      - id: ref1
        bwb_id: BWBR0009705
        artikel: 21c
        hoofdstuk: '2'
        paragraaf: 7B
      - id: ref2
        bwb_id: BWBR0009705
        artikel: '2'
        hoofdstuk: '1'
  - number: 21d.2
    text: |-
      De in het eerste lid bedoelde vermindering met 10% is niet van toepassing op het aantal varkens, onderscheidenlijk
      fokzeugen, dat groter is dan het aantal dat wordt bepaald door het niet-gebonden mestproductierecht voor varkens en
      kippen geldend met betrekking tot 1997 te delen door 7,4 kilogram fosfaat en de uitkomst te verminderen met het in
      1996 gemiddeld op het bedrijf gehouden aantal varkens.
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel21d
  - number: 21d.3
    text: |-
      Voor de toepassing van het eerste lid is [artikel 4, tweede lid][ref1], van overeenkomstige toepassing, met dien
      verstande dat in plaats van «in 1994» wordt gelezen: in 1997.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel4
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel21d
    references:
      - id: ref1
        bwb_id: BWBR0009705
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 21d.4
    text: |-
      [Artikel 6, vierde, vijfde en zesde lid, van de wet][ref1] is van overeenkomstige toepassing, met
      dien verstande dat in plaats van «1996» telkens wordt gelezen «1996, onderscheidenlijk 1997,» en in
      [artikel 6, vierde lid, van de wet][ref2] in plaats van «in de aangifte overschotheffing 1996, bij gebreke
      daarvan, op het afsluitformulier 1996, dan wel, bij gebreke daarvan, op de vrijstellingsverklaring 1996» wordt
      gelezen: in de aangifte overschotheffing 1996, onderscheidenlijk de aangifte overschotheffing 1997; bij gebreke
      daarvan, op het afsluitformulier 1996, onderscheidenlijk het afsluitformulier 1997; bij gebreke daarvan, op de
      vrijstellingsverklaring 1996, onderscheidenlijk de vrijstellingsverklaring 1997.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel6
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel21d
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '6'
  - number: 21d.5
    text: |-
      Indien het varkensrecht overeenkomstig [artikel 7 van de wet ][ref1]is bepaald, wordt in het eerste lid in plaats
      van «1996» gelezen: 1995.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel7
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel21d
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '7'
  - number: 21e
    text: |-
      Het varkensrecht en het fokzeugenrecht van een daartoe aangemeld bedrijf worden bepaald overeenkomstig deze
      paragraaf, indien ten aanzien van het bedrijf de mestproductie afkomstig van varkens in 1994, 1995 en 1996
      gemiddeld ten minste 25% en in 1996 ten minste 5% was van de som van het niet-gebonden mestproductierecht voor
      varkens en kippen geldend met betrekking tot het desbetreffende jaar en het met betrekking tot dat jaar geldende
      grondgebonden mestproductierecht.
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel21e
  - number: 21f.1
    text: |-
      Het varkensrecht van een bedrijf als bedoeld in [artikel 21e][ref1] komt overeen met 90% van het aantal
      varkenseenheden dat wordt bepaald door het door de belanghebbende daartoe bij de melding, bedoeld in
      [artikel 2][ref2], aangegeven deel van het niet-gebonden mestproductierecht voor varkens en kippen geldend met
      betrekking tot 1996 te delen door 7,4 kilogram fosfaat en op de uitkomst 18% in mindering te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel21e
      [ref2]: https://wetten.overheid.nl/BWBR0009705#Artikel2
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel21f
    references:
      - id: ref1
        bwb_id: BWBR0009705
        artikel: 21e
        hoofdstuk: '2'
        paragraaf: 7C
      - id: ref2
        bwb_id: BWBR0009705
        artikel: '2'
        hoofdstuk: '1'
  - number: 21f.2
    text: |-
      Het fokzeugenrecht komt overeen met het bij de melding, bedoeld in [artikel 2][ref1], aangegeven deel van het
      aantal varkenseenheden dat naar keuze van de belanghebbende wordt bepaald door:


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel2
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel21f
    references:
      - id: ref1
        bwb_id: BWBR0009705
        artikel: '2'
        hoofdstuk: '1'
  - number: 21f.2.a
    text: |-
      een percentage van het varkensrecht, welk percentage wordt bepaald door het in 1994 gemiddeld op het bedrijf
      gehouden aantal fokzeugen te delen door het in 1994 gemiddeld op het bedrijf gehouden aantal varkens en de uitkomst
      te vermenigvuldigen met 100, dan wel
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel21f
  - number: 21f.2.b
    text: het in 1996 gemiddeld op het bedrijf gehouden aantal fokzeugen, verminderd met 10%.
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel21f
  - number: 21f.3
    text: |-
      De in het tweede lid, onderdeel a, bedoelde aantallen varkens en fokzeugen zijn de aantallen die met betrekking
      tot het bedrijf zijn opgegeven in de aangifte overschotheffing 1994. Indien het fokzeugenrecht wordt bepaald
      overeenkomstig het tweede lid, onderdeel b, is [artikel 6, derde, vierde, vijfde en zesde lid, van de wet][ref1]
      van overeenkomstige toepassing, met dien verstande dat in plaats van «varkens, onderscheidenlijk fokzeugen,»
      telkens wordt gelezen: fokzeugen.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel6
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel21f
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '6'
  - number: 21f.4
    text: |-
      De [artikelen 9][ref1] en [10 van de wet][ref2] zijn van overeenkomstige toepassing op het overeenkomstig het
      eerste en tweede lid bepaalde varkensrecht, onderscheidenlijk fokzeugenrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel10
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel21f
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '10'
  - number: '22.1'
    text: |-
      Voor producenten van dierlijke meststoffen die in 1996, onderscheidenlijk 1995, op een bedrijf waarvan
      het varkensrecht en het fokzeugenrecht uitsluitend zijn bepaald overeenkomstig [hoofdstuk II][ref1] en
      [artikel 24 van de wet][ref2], dieren hielden van andere in [bijlage A bij de Meststoffenwet][ref3] opgenomen
      diersoorten dan varkens, wordt voor de toepassing van [artikel 55a, eerste lid, van de Meststoffenwet][ref4]
      van de latente ruimte, bepaald overeenkomstig het vierde lid, onderscheidenlijk het vijfde lid, eerste
      volzin, van dat artikel, slechts het percentage in aanmerking genomen dat overeenkomt met het percentage
      dat de mestproductie afkomstig van de in 1996, onderscheidenlijk 1995, gehouden varkens uitmaakt van de
      mestproductie afkomstig van de in 1996, onderscheidenlijk 1995, gehouden varkens, kippen en dieren van andere in
      [bijlage A bij de Meststoffenwet][ref5] opgenomen diersoorten dan varkens en kippen.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0004054
      [ref4]: https://wetten.overheid.nl/BWBR0004054#Artikel55a
      [ref5]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009542
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '24'
      - id: ref3
        bwb_id: BWBR0004054
      - id: ref4
        bwb_id: BWBR0004054
        artikel: 55a
      - id: ref5
        bwb_id: BWBR0004054
  - number: '22.2'
    text: |-
      Voor de toepassing van het eerste lid wordt de mestproductie afkomstig van andere diersoorten dan varkens en
      kippen slechts in aanmerking genomen voor zover deze groter is dan de som van het met betrekking tot 1996,
      onderscheidenlijk 1995, geldende niet-gebonden mestproductierecht voor andere diersoorten dan varkens en kippen en
      het met betrekking tot het betreffende jaar geldende grondgebonden mestproductierecht.
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel22
  - number: '23.1'
    text: |-
      In afwijking van [artikel 22][ref1] blijft [artikel 55a van de Meststoffenwet][ref2] buiten toepassing ten aanzien
      van een daartoe aangemeld bedrijf, voor het bij de melding aangegeven aantal kilogrammen fosfaat dat ten hoogste
      overeenkomt met het niet-benutte deel van het niet-gebonden mestproductierecht voor varkens en kippen, indien met
      betrekking tot het bedrijf na 1992 en vóór 10 juli 1997 ten behoeve van een vergroting van het aantal te houden
      dieren van in [bijlage A bij de Meststoffenwet][ref3] opgenomen andere diersoorten dan varkens, onderverdeeld in
      categorieën binnen die diersoorten:


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel55a
      [ref3]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009705
        artikel: '22'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: 55a
      - id: ref3
        bwb_id: BWBR0004054
  - number: 23.1.a
    text: door het bevoegd gezag een milieuvergunning is verleend,
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel23
  - number: 23.1.b
    text: |-
      een aanvraag is ingediend om een milieuvergunning en deze naar aanleiding van de aanvraag uiterlijk op 1 januari
      2001 is verleend, dan wel
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel23
  - number: 23.1.c
    text: |-
      bij het bevoegd gezag overeenkomstig [artikel 8.19 van de Wet milieubeheer][ref1] dan wel
      overeenkomstig [artikel 4 van het Besluit melkrundveehouderijen milieubeheer][ref2] of
      [artikel 3 van het Besluit akkerbouwbedrijven milieubeheer][ref3] een of meer meldingen zijn gedaan. Een
      overeenkomstig [artikel 8.19 van de Wet milieubeheer][ref4] gedane melding wordt slechts in aanmerking genomen
      voorzover deze betrekking heeft op een verandering van de inrichting die overeenkomstig de op het tijdstip van
      de melding voor de inrichting geldende milieuvergunning kon leiden tot een uitbreiding van het aantal dieren van
      in [bijlage A bij de Meststoffenwet][ref5] opgenomen andere diersoorten dan varkens, onderverdeeld in categorieën
      binnen die diersoorten.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005158#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0006449#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005158
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0006449
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref5
        bwb_id: BWBR0004054
  - number: '23.2'
    text: |-
      [Artikel 2, derde lid][ref1], is van overeenkomstige toepassing op de in het eerste lid bedoelde melding.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel2
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009705
        artikel: '2'
        hoofdstuk: '1'
  - number: '23.3'
    text: |-
      Het niet-benutte deel van het niet-gebonden mestproductierecht voor varkens en kippen komt overeen met het aantal
      kilogrammen fosfaat dat wordt bepaald door het niet-gebonden mestproductierecht voor varkens en kippen zoals dat
      zou gelden op 1 januari 1998 indien geen rekening wordt gehouden met na 9 juli 1997 gedane kennisgevingen van
      verplaatsing met betrekking tot dit recht, achtereenvolgens te verminderen met:
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel23
  - number: 23.3.a
    text: |-
      het aantal kilogrammen fosfaat dat wordt bepaald door het verschil tussen het overeenkomstig
      [hoofdstuk II, uitgezonderd artikel 14, en artikel 24 van de wet][ref1] bepaalde varkensrecht en het grondgebonden
      deel daarvan achtereenvolgens te vermenigvuldigen met 100/90 en 7,4 kilogram fosfaat,


      [ref1]: https://wetten.overheid.nl/BWBR0009542#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009542
        hoofdstuk: II
  - number: 23.3.b
    text: |-
      de mestproductie afkomstig van de in 1996 gehouden dieren van andere diersoorten dan varkens en kippen, voorzover
      deze mestproductie groter is dan de som van het grondgebonden mestproductierecht zoals dat zou gelden op 1 januari
      1998 indien geen rekening wordt gehouden met wijzigingen in de oppervlakte tot het bedrijf behorende landbouwgrond
      na 9 juli 1997, en het niet-gebonden mestproductierecht voor deze diersoorten zoals dat zou gelden op 1 januari
      1998 indien geen rekening wordt gehouden met na 9 juli 1997 gedane kennisgevingen van verplaatsing met betrekking
      tot dit recht, en
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel23
  - number: 23.3.c
    text: de mestproductie afkomstig van de in 1996 gehouden kippen.
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel23
  - number: '23.4'
    text: |-
      Een bedrijf komt uitsluitend voor de toepassing van dit artikel in aanmerking indien ten aanzien van het
      bedrijf is voldaan aan elk van de voorwaarden, bedoeld in [artikel 9, tweede lid, onderdelen b, d en e][ref1],
      met dien verstande dat voor de toepassing van dit hoofdstuk in dat artikel in plaats van «varkens» telkens
      wordt gelezen «dieren van de in [bijlage A bij de Meststoffenwet][ref2] opgenomen andere diersoorten dan
      varkens, onderverdeeld in categorieën binnen die diersoorten», en voorts onder de voorwaarde dat uiterlijk
      op 1 januari 2003 op het bedrijf extra huisvesting aanwezig is voor tenminste het aantal dieren van de in
      [bijlage A bij de Meststoffenwet][ref3] opgenomen andere diersoorten dan varkens, onderverdeeld in categorieën
      binnen die diersoorten, dat overeenkomt met 85% van het aantal kilogrammen fosfaat waarmee het niet-gebonden
      mestproductierecht voor varkens en kippen op grond van dit artikel is vergroot.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004054
      [ref3]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009705
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004054
      - id: ref3
        bwb_id: BWBR0004054
  - number: '23.5'
    text: |-
      Indien het varkensrecht wordt bepaald overeenkomstig [artikel 7 van de wet][ref1], wordt in het derde lid en voor
      de toepassing van het vierde lid in plaats van «1996» telkens gelezen: 1995.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel7
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '7'
  - number: '23.6'
    text: |-
      Voor de toepassing van dit artikel is [artikel 9, vierde en vijfde, lid][ref1] van overeenkomstige toepassing,
      met dien verstande dat in die artikelleden in plaats van «varkens» telkens wordt gelezen: dieren van de in
      [bijlage A bij de Meststoffenwet][ref2] opgenomen andere diersoorten dan varkens.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009705
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004054
  - number: '23.7'
    text: |-
      Voor de toepassing van het derde lid, onderdeel a, is [artikel 55a, derde lid, van de Meststoffenwet][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel55a
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 55a
  - number: '24'
    text: |-
      Voor producenten van dierlijke meststoffen op een bedrijf met op de dag voorafgaand aan het tijdstip
      van inwerkingtreding van [artikel 15 van de Wet herstructurering varkenshouderij][ref1] een niet-
      gebonden mestproductierecht voor andere diersoorten dan varkens en kippen wordt voor de toepassing van
      [artikel 55a, eerste lid, van de Meststoffenwet][ref2] in plaats van de tweede volzin van dat artikellid gelezen:
      De vermindering geschiedt ten aanzien van het de dag voorafgaand aan het tijdstip van inwerkingtreding van
      [artikel 15 van de Wet herstructurering varkenshouderij][ref3] geldende niet-gebonden mestproductierecht voor
      varkens en kippen.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel55a
      [ref3]: https://wetten.overheid.nl/BWBR0009542#Artikel15
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: 55a
      - id: ref3
        bwb_id: BWBR0009542
        artikel: '15'
  - number: '25.1'
    text: |-
      De [artikelen 12][ref1], [13][ref2] juncto artikel [41, derde lid][ref3], en [14 van de wet][ref4] zijn
      van overeenkomstige toepassing op het overeenkomstig dit besluit bepaalde varkensrecht, onderscheidenlijk
      fokzeugenrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0009542#Artikel41
      [ref4]: https://wetten.overheid.nl/BWBR0009542#Artikel14
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '13'
      - id: ref3
        bwb_id: BWBR0009542
        artikel: '41'
      - id: ref4
        bwb_id: BWBR0009542
        artikel: '14'
  - number: '25.2'
    text: |-
      [Artikel 24 van de wet][ref1] is van overeenkomstige toepassing op het overeenkomstig dit besluit
      bepaalde varkensrecht en fokzeugenrecht, met dien verstande dat voor de toepassing van dit besluit
      in het eerste lid van dat artikel in plaats van «de [artikelen 6][ref2],[7][ref3] en [11][ref4]»
      wordt gelezen «de [artikelen 4, eerste lid][ref5], [8, eerste lid, onderdeel c, en tweede lid][ref6],
      [10, tweede lid, onderdeel d][ref7], [21d, eerste en tweede lid][ref8], en [21f, tweede lid, onderdeel b][ref9],
      van dit besluit» en in plaats van «de [artikelen 1][ref10] en [8 tot en met 13][ref11]» wordt gelezen: de
      [artikelen 6, eerste lid][ref12], [12][ref13], [14][ref14], [19, eerste lid][ref15], [19b, tweede lid][ref16],
      [21][ref17], [21b, eerste lid][ref18], en [21f, eerste lid][ref19], van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel24
