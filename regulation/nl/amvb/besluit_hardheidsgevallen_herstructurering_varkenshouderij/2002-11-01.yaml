  - number: '18'
    text: |-
      Deze paragraaf is van overeenkomstige toepassing indien het varkensrecht en het fokzeugenrecht van een bedrijf
      worden bepaald overeenkomstig [paragraaf 1][ref1], [2][ref2], [3][ref3], [6][ref4], [6B][ref5], [7][ref6],
      [7A][ref7], [7B][ref8] of [7C van dit hoofdstuk][ref9], met dien verstande dat, indien deze rechten worden bepaald
      overeenkomstig [paragraaf 3][ref10], voor de toepassing van dit artikel wordt uitgegaan van het fokzeugenrecht vóór
      de vergroting overeenkomstig [artikel 11][ref11].


