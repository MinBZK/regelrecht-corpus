        artikel: '8'
  - number: '17.1'
    text: |-
      Het fokzeugenrecht van het bedrijf, bedoeld in [artikel 16][ref1], wordt vergroot met het bij de melding,
      bedoeld in [artikel 2][ref2], aangegeven aantal varkenseenheden dat ten hoogste overeenkomt met het verschil
      tussen het fokzeugenrecht en het varkensrecht, of, indien dat minder is, met het aantal fokzeugen dat ingevolge
      de verleende milieuvergunning, bedoeld in [artikel 16, eerste lid, onderdelen a en b][ref3], onderscheidenlijk
      ingevolge de in [artikel 16, eerste lid, tweede volzin][ref4], bedoelde milieuvergunning dan wel het
      [Besluit melkrundveehouderijen milieubeheer][ref5] of het [Besluit akkerbouwbedrijven milieubeheer][ref6], ten
      hoogste mag worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009705#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0009705#Artikel16
