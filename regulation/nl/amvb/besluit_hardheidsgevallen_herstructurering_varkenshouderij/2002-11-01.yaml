      - id: ref7
        bwb_id: BWBR0009705
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '11.2'
    text: 'Voor de toepassing van het eerste lid worden:'
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel11
  - number: 11.2.a
    text: |-
      in de verleende milieuvergunning, onderscheidenlijk in de in [artikel 9, eerste lid, tweede volzin][ref1], bedoelde
      milieuvergunning dan wel in de in het eerste lid bedoelde meldingen genoemde fokzeugen, kraamzeugen, guste en
      dragende zeugen aangemerkt als fokzeugen als bedoeld in [bijlage A, onderdeel 1, onder b, bij de wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009542
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009705
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009542
  - number: 11.2.b
    text: |-
      in de verleende milieuvergunning, onderscheidenlijk in de in [artikel 9, eerste lid, tweede volzin][ref1], bedoelde
      milieuvergunning dan wel in de in het eerste lid bedoelde meldingen genoemde biggen, al dan niet gespeend, buiten
      beschouwing gelaten, tenzij het gaat om biggen die worden gehuisvest in een stal of stalruimte die blijkens de
      milieuvergunning of de melding uitsluitend is bestemd voor het houden van biggen, in welk geval de biggen worden
      aangemerkt als biggen als bedoeld in bijlage A, onderdeel 5, van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel9
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009705
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '12'
    text: |-
      De vergroting van het varkensrecht, bedoeld in [artikel 10][ref1], betreft het grondgebonden deel van het
      varkensrecht, voorzover het aantal varkenseenheden dat overeenkomt met de vergroting groter is dan het aantal
      varkenseenheden dat wordt bepaald door 90% van het in de aanhef van [artikel 10, tweede lid][ref2], bedoelde niet-
      gebonden mestproductierecht voor varkens en kippen te delen door 7,4 kilogram fosfaat en de uitkomst te verminderen
      tot ten minste nihil met het verschil tussen het overeenkomstig hoofdstuk II, uitgezonderd [artikel 14][ref3], en
      [artikel 24 van de wet ][ref4]bepaalde varkensrecht en het grondgebonden deel daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009705#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0009705#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0009542#Artikel24
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009705
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009705
        artikel: '10'
        hoofdstuk: '2'
