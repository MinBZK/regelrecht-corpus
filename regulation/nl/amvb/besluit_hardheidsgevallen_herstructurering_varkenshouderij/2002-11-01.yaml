        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 20.2.b
    text: |-
      voor de toepassing van [artikel 14][ref1] de in dat lid bedoelde som wordt vermeerderd met het aantal kilogrammen
      fosfaat waarvoor de ontheffing met betrekking tot 1996 geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel14
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel20
