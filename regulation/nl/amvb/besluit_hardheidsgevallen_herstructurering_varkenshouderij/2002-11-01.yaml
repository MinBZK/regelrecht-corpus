  - number: '26.1'
    text: |-
      Een bedrijf komt uitsluitend voor de toepassing van [hoofdstuk 2][ref1] in aanmerking indien de belanghebbende bij
      de melding, bedoeld in [artikel 2][ref2], verzoekt om doorhaling van de ten aanzien van het bedrijf geregistreerde
      gegevens betreffende het niet-gebonden mestproductierecht voor varkens en kippen geldend op de dag voorafgaand aan
      het tijdstip van inwerkingtreding van [artikel 15 van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0009705#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0009542#Artikel15
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0009705
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0009705
        artikel: '2'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0009542
        artikel: '15'
  - number: '26.2'
    text: |-
      Voor de toepassing van het eerste lid is [artikel 41, derde lid, van de wet][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel41
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '41'
  - number: '26.3'
    text: |-
      De doorhaling betreft de hoeveelheid die wordt bepaald door het verschil tussen het overeenkomstig dit besluit
      bepaalde varkensrecht en het grondgebonden deel daarvan achtereenvolgens te vermenigvuldigen met 100/90 en 7,4
      kilogram fosfaat en het product te vermeerderen met de latente ruimte.
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel26
  - number: '26.4'
    text: |-
      Bij de doorhaling neemt het niet-gebonden mestproductierecht voor varkens en kippen van het bedrijf af met de
      hoeveelheid, bedoeld in het derde lid, tot een hoeveelheid van ten minste nihil.
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel26
  - number: '26.5'
    text: |-
      Indien het varkensrecht is bepaald overeenkomstig [hoofdstuk 2, paragraaf 1][ref1], wordt de latente ruimte bepaald
      door overeenkomstige toepassing van [artikel 55a, vierde lid, van de Meststoffenwet][ref2] met dien verstande dat
      in dat lid en in [artikel 1, eerste lid, onderdeel ad, van die wet][ref3] in plaats van «1996» telkens wordt gelezen
      «1994», en in plaats van «[artikel 5, eerste lid, onderdeel c, van de Wet herstructurering varkenshouderij][ref4]»
      wordt gelezen: [artikel 1, eerste lid, onderdeel e][ref5], van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel55a
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0009542#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0009705#Artikel1
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0009705
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: 55a
      - id: ref3
        bwb_id: BWBR0004054
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0009542
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0009705
        artikel: '1'
        hoofdstuk: '1'
  - number: '26.6'
    text: |-
      Indien het varkensrecht is bepaald overeenkomstig [hoofdstuk 2][ref1], paragraaf 2, [4][ref2] of [7A][ref3],
      komt de latente ruimte overeen met 11% van het overeenkomstig [artikel 8, eerste lid][ref4], onderscheidenlijk
      [artikel 14][ref5], aangegeven deel van het aantal kilogrammen fosfaat dat wordt bepaald door het niet-gebonden
      mestproductierecht voor varkens en kippen geldend met betrekking tot 1996 te verminderen met 10%.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0009705#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0009705#Hoofdstuk2
      [ref4]: https://wetten.overheid.nl/BWBR0009705#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0009705#Artikel14
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0009705
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0009705
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0009705
        hoofdstuk: '2'
        paragraaf: 7A
      - id: ref4
        bwb_id: BWBR0009705
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0009705
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '26.7'
    text: |-
      Indien het varkensrecht is vergroot overeenkomstig [hoofdstuk 2, paragraaf 3][ref1], wordt de latente ruimte
      bepaald door het niet-gebonden mestproductierecht voor varkens en kippen zoals dat zou gelden op 1 januari 1998
      indien geen rekening wordt gehouden met na 9 juli 1997 gedane kennisgevingen van verplaatsing met betrekking tot
      dit recht, achtereenvolgens te verminderen met:


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0009705
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 26.7.a
    text: |-
      het aantal kilogrammen fosfaat dat wordt bepaald door het verschil tussen het overeenkomstig hoofdstuk II,
      paragraaf 3, vergrote varkensrecht en het grondgebonden deel daarvan te vermenigvuldigen met 100/90, het product
      vervolgens te vermeerderen met dit grondgebonden deel en deze som te vermenigvuldigen met 7,4 kilogram fosfaat,
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel26
  - number: 26.7.b
    text: |-
      de mestproductie afkomstig van de in 1996 gehouden dieren van andere diersoorten dan varkens en kippen, voorzover
      deze mestproductie groter is dan de som van het grondgebonden mestproductierecht zoals dat zou gelden op 1 januari
      1998 indien geen rekening wordt gehouden met wijzigingen in de oppervlakte tot het bedrijf behorende landbouwgrond
      van na 9 juli 1997, en het niet-gebonden mestproductierecht voor deze diersoorten zoals zou gelden op 1 januari
      1998 indien geen rekening wordt gehouden met na 9 juli 1997 gedane kennisgevingen van verplaatsing met betrekking
      tot dit recht, en
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel26
  - number: 26.7.c
    text: de mestproductie afkomstig van de in 1996 gehouden kippen.
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel26
  - number: '26.8'
    text: |-
      Indien het varkensrecht is bepaald overeenkomstig [hoofdstuk 2, paragrafen 5][ref1],
      [6][ref2], [6B][ref3], [6C][ref4] of [7][ref5], wordt de latente ruimte bepaald overeenkomstig
      [artikel 55a, vierde lid, onderscheidenlijk vijfde lid, eerste volzin, van de Meststoffenwet][ref6], met
      dien verstande dat, indien het varkensrecht is bepaald overeenkomstig [hoofdstuk 2, paragraaf 6C][ref7], de
      mestproductie wordt bepaald overeenkomstig [artikel 55, achtste lid, van de Meststoffenwet][ref8] en voor de
      toepassing van dat lid: - het gemiddeld in 1996 of 1995 op het bedrijf gehouden aantal varkens het overeenkomstig
      [artikel 19g][ref9] bepaalde aantal is;
        - het gemiddeld in 1996 of 1995 op het bedrijf gehouden aantal dieren van andere diersoorten dan varkens, het
      aantal is dat met betrekking tot het desbetreffende bedrijf en het desbetreffende jaar is opgegeven overeenkomstig
      de artikelen 4 en 5 van de Regeling landbouwtelling 1996 of de artikelen 4 en 5 van de Regeling landbouwtelling
      1995, verminderd met 10%.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0009705#Hoofdstuk2
