  - number: '20.2'
    text: |-
      Indien het varkensrecht en het fokzeugenrecht worden bepaald overeenkomstig [paragraaf 3][ref1], [4][ref2],
      [5][ref3], [6][ref4], [6A][ref5], [6B][ref6] of [7B van dit hoofdstuk][ref7], is het eerste lid van
      overeenkomstige toepassing, voorzover de [artikelen 6, zesde lid][ref8], en [13][ref9], van de wet, daarbij
      overeenkomstige toepassing vinden en met dien verstande dat:


