  - number: '19.1'
    text: |-
      Het varkensrecht en het fokzeugenrecht van een daartoe aangemeld bedrijf waarvan het niet-gebonden
      mestproductierecht voor varkens en kippen ten gevolge van de registratie in of na 1996 van een uiterlijk
      op 9 juli 1997 gedane kennisgeving van verplaatsing met betrekking tot dat recht is verkleind, en de tot
      het bedrijf behorende oppervlakte landbouwgrond dan wel het niet gebonden mestproductierecht voor andere
      diersoorten dan varkens en kippen in de periode van 1 januari 1996 tot 10 juli 1997 is vergroot, worden bepaald
      overeenkomstig [hoofdstuk II, uitgezonderd artikel 14, en artikel 24 van de wet][ref1], met dien verstande dat
      de [artikelen 9][ref2] en [10 van de wet][ref3] wat de in die artikelen bedoelde verkleiningen betreft, buiten
      toepassing blijven, voorzover de som van die verkleiningen overeenkomt met 90% van het aantal varkenseenheden dat
      wordt bepaald door:


      [ref1]: https://wetten.overheid.nl/BWBR0009542#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0009542#Artikel10
