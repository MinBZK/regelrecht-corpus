        artikel: '24'
  - number: 19c.1
    text: |-
      Het overeenkomstig [hoofdstuk II][ref1], uitgezonderd [artikel 14][ref2], en [artikel 24 van de wet][ref3],
      dan wel overeenkomstig [paragraaf 1][ref4], [2][ref5], [4][ref6], [5][ref7],[ 7][ref8], [7A][ref9]
      of [7C van dit hoofdstuk][ref10], bepaalde varkensrecht, onderscheidenlijk fokzeugenrecht, van een daartoe
      aangemeld bedrijf wordt overeenkomstig deze paragraaf vergroot indien de tot het bedrijf behorende oppervlakte
      landbouwgrond in de periode van 1 januari 1996 tot 10 juli 1997 per saldo is vergroot.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0009542#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0009705#Hoofdstuk2
      [ref5]: https://wetten.overheid.nl/BWBR0009705#Hoofdstuk2
      [ref6]: https://wetten.overheid.nl/BWBR0009705#Hoofdstuk2
      [ref7]: https://wetten.overheid.nl/BWBR0009705#Hoofdstuk2
      [ref8]: https://wetten.overheid.nl/BWBR0009705#Hoofdstuk2
      [ref9]: https://wetten.overheid.nl/BWBR0009705#Hoofdstuk2
      [ref10]: https://wetten.overheid.nl/BWBR0009705#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel19c
    references:
      - id: ref1
