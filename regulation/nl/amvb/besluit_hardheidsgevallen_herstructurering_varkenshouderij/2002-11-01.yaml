    text: |-
      het aantal hectaren waarmee de tot het bedrijf behorende oppervlakte landbouwgrond in de periode van 1 januari 1996
      tot 10 juli 1997 per saldo is vergroot, te vermenigvuldigen met 125 kilogram fosfaat en de uitkomst te delen door
      7,4 kilogram fosfaat, dan wel
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel19
  - number: 19.1.b
    text: |-
