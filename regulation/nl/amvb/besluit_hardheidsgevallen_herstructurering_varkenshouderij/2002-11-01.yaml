        hoofdstuk: '2'
        paragraaf: '1'
  - number: 19a.1
    text: |-
      Het varkensrecht van daartoe aangemelde bedrijven die behoren tot één en dezelfde inrichting wordt bepaald
      overeenkomstig deze paragraaf indien voldaan is aan elk van de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel19a
  - number: 19a.1.a
    text: |-
      er is sprake van een inrichting die beschikt over een vóór 1 januari 1994 verleende milieuvergunning en die twee of
      meer op 9 juli 1997 bij het Bureau Heffingen geregistreerde bedrijven omvat;
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel19a
  - number: 19a.1.b
    text: |-
      er heeft op ten minste één van de tot de inrichting behorende bedrijven per saldo een verkleining plaatsgevonden
      van het niet-gebonden mestproductierecht voor varkens en kippen ten gevolge van de registratie van een in de
      periode van 1 januari 1994 tot en met 9 juli 1997 gedane kennisgeving van verplaatsing met betrekking tot dat
      recht, terwijl de tot het bedrijf behorende oppervlakte landbouwgrond alsmede de som van het grondgebonden
      mestproductierecht en het niet-gebonden mestproductierecht voor varkens en kippen van ten minste één ander tot de
      inrichting behorend bedrijf in de periode van 1 januari 1994 tot en met 9 juli 1997 per saldo is vergroot;
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel19a
  - number: 19a.1.c
    text: |-
      de mestproductie van varkens bedroeg in 1997 ten minste 5% van de som van het niet-gebonden mestproductierecht
      voor varkens en kippen, zoals dat met betrekking tot 1997 voor elk van de tot de inrichting behorende bedrijven
      gold, vermeerderd met de som van het voor elk van de bedrijven met betrekking tot dat jaar geldende grondgebonden
      mestproductierecht;
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel19a
  - number: 19a.1.d
    text: |-
      de vergroting van de tot het bedrijf behorende oppervlakte landbouwgrond is uiterlijk op 21 oktober 1998
      schriftelijk bij het Bureau Heffingen gemeld;
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel19a
  - number: 19a.1.e
    text: |-
      de grond waarmee de tot het bedrijf behorende oppervlakte landbouwgrond is uitgebreid, was al vóór 10 juli 1997 in
      het kader van een normale bedrijfsvoering daadwerkelijk in gebruik bij het desbetreffende bedrijf.
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel19a
  - number: 19a.2
    text: |-
      Bij de melding, bedoeld in [artikel 2][ref1], wordt een afschrift van de met betrekking tot de inrichting geldende
      milieuvergunning overgelegd aan het Bureau Heffingen. Indien de milieuvergunning is verleend na 1 januari 1994,
      worden op verzoek van het Bureau Heffingen binnen de daarbij aangegeven termijn alle eerdere met betrekking tot die
      inrichting verleende milieuvergunningen aan dat bureau overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel2
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0009705
        artikel: '2'
        hoofdstuk: '1'
  - number: 19b.1
    text: |-
      Het varkensrecht en het fokzeugenrecht van elk van de bedrijven die behoren tot een inrichting als bedoeld in
      [artikel 19][ref1] komen overeen met het met betrekking tot het desbetreffende bedrijf bij de melding, bedoeld in
      [artikel 2][ref2], aangegeven deel van het voor de bedrijven gezamenlijk beschikbare aantal varkenseenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0009705#Artikel2
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0009705
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0009705
        artikel: '2'
        hoofdstuk: '1'
  - number: 19b.2
    text: |-
      Het voor de bedrijven gezamenlijk beschikbare aantal varkenseenheden komt overeen met de som van de
      varkensrechten, onderscheidenlijk fokzeugenrechten, zoals deze voor elk van de bedrijven afzonderlijk zouden
      gelden indien deze zouden zijn bepaald overeenkomstig [hoofdstuk II][ref1], uitgezonderd [artikel 14][ref2],
      en [artikel 24 van de wet][ref3]. Deze som wordt verhoogd met 90% van het aantal varkenseenheden dat wordt
      bepaald door de som van het aantal hectaren waarmee de tot de bedrijven van de inrichting behorende oppervlakte
      landbouwgrond in de periode van 1 januari 1994 tot en met 9 juli 1997 per saldo is vergroot, te vermenigvuldigen
      met 125 kilogram fosfaat en de uitkomst te delen door 7,4 kilogram fosfaat. De verhoging betreft het grondgebonden
      deel van het varkensrecht, onderscheidenlijk fokzeugenrecht, en is niet meer dan de som van de verkleiningen die op
      grond van de artikelen 9 en 10 van de wet in de periode van 1 januari 1994 tot en met 9 juli 1997 per saldo op de
      tot de inrichting behorende bedrijven hebben plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0009542#Artikel24
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0009542
        hoofdstuk: II
      - id: ref2
