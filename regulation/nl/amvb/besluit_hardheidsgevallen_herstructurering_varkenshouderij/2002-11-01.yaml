  - number: '26.9'
    text: |-
      Indien het varkensrecht is bepaald overeenkomstig [hoofdstuk 2, paragraaf 6A][ref1], wordt de latente
      ruimte van elk van de tot de inrichting behorende bedrijven per afzonderlijk bedrijf bepaald overeenkomstig
      [artikel 55a, vierde lid, onderscheidenlijk vijfde lid, eerste volzin, van de Meststoffenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel55a
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0009705
        hoofdstuk: '2'
        paragraaf: 6A
      - id: ref2
        bwb_id: BWBR0004054
        artikel: 55a
  - number: '26.10'
    text: |-
      Indien het varkensrecht is bepaald overeenkomstig [hoofdstuk 2, paragraaf 7B][ref1], wordt de latente
      ruimte bepaald overeenkomstig het zevende lid, met dien verstande dat in [onderdeel a][ref2] in plaats van
      «[paragraaf 3][ref3]» wordt gelezen« [paragraaf 7B][ref4]» en in plaats van «in 1996» telkens wordt gelezen:
      in 1997.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0009705#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0009705#Hoofdstuk2
      [ref4]: https://wetten.overheid.nl/BWBR0009705#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0009705
        hoofdstuk: '2'
        paragraaf: 7B
      - id: ref2
        bwb_id: BWBR0009705
        artikel: '26'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0009705
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0009705
        hoofdstuk: '2'
        paragraaf: 7B
  - number: '26.11'
    text: |-
      Indien het varkensrecht is bepaald overeenkomstig [hoofdstuk 2, paragraaf 7C][ref1], wordt de latente ruimte
      bepaald overeenkomstig [artikel 55a, vijfde lid, tweede volzin, van de Meststoffenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel55a
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0009705
        hoofdstuk: '2'
        paragraaf: 7C
      - id: ref2
        bwb_id: BWBR0004054
        artikel: 55a
  - number: '26.12'
    text: |-
      In afwijking in zoverre van het derde lid vindt geen doorhaling van de latente ruimte plaats ten aanzien van een
      daartoe aangemeld bedrijf voor het bij de melding aangegeven aantal kilogrammen fosfaat dat ten hoogste overeenkomt
      met het niet-benutte deel van het niet-gebonden mestproductierecht voor varkens en kippen, indien voldaan is aan
      elk van de voorwaarden, bedoeld in [artikel 23][ref1]. [Artikel 23][ref2] is voor het in de eerste volzin bedoelde
      bedrijf van overeenkomstige toepassing, met dien verstande dat indien het varkensrecht is bepaald overeenkomstig
      hoofdstuk 2, paragraaf 1, in dat artikel in plaats van «1996» telkens wordt gelezen: 1994.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0009705#Artikel23
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0009705
        artikel: '23'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0009705
        artikel: '23'
        hoofdstuk: '3'
  - number: '26.13'
    text: |-
      Voor de toepassing van het derde lid en het zevende lid, onderdeel a, is
      [artikel 55a, derde lid, van de Meststoffenwet][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel55a
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 55a
  - number: '26.14'
    text: |-
      Voor de toepassing van het zesde lid is [artikel 24 van de wet][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel24
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '24'
  - number: '26.15'
    text: |-
      Indien het varkensrecht wordt bepaald overeenkomstig [artikel 7 van de wet][ref1], wordt in het zevende lid in
      plaats van «1996» telkens gelezen: 1995.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel7
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '7'
  - number: '27.1'
    text: |-
      Voor de toepassing van [artikel 26, derde lid][ref1], wordt van de latente ruimte slechts het percentage in
      aanmerking genomen dat overeenkomt met het percentage dat de mestproductie afkomstig van de in 1996 gehouden
      varkens uitmaakt van de mestproductie afkomstig van de in 1996 gehouden varkens, kippen en dieren van andere
      diersoorten dan varkens en kippen. De mestproductie afkomstig van andere diersoorten dan varkens en kippen wordt
      slechts in aanmerking genomen voor zover deze groter is dan de som van het met betrekking tot 1996 geldende niet-
      gebonden mestproductierecht voor andere diersoorten dan varkens en kippen en het met betrekking tot 1996 geldende
      grondgebonden mestproductierecht.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel26
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0009705
        artikel: '26'
        hoofdstuk: '4'
  - number: '27.2'
    text: |-
      Voor de toepassing van [artikel 26, vijfde, onderscheidenlijk tiende lid][ref1], wordt in het eerste lid in plaats
      van «1996» telkens gelezen: 1994, onderscheidenlijk 1997.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel26
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0009705
        artikel: '26'
        hoofdstuk: '4'
  - number: '27.3'
    text: |-
      Voor de toepassing van [artikel 26, zevende, achtste en negende lid][ref1], wordt in het eerste lid in plaats
      van «1996» telkens gelezen: 1995 of 1996, al naar gelang het varkensrecht en het fokzeugenrecht, bedoeld in
      onderscheidenlijk [artikel 9, eerste lid][ref2], [16][ref3], [19, eerste lid,][ref4][19a, eerste lid][ref5],
      [19d, eerste lid][ref6], [19f][ref7] en [20][ref8] zijn bepaald overeenkomstig [artikel 7][ref9] of
      [artikel 6 van de wet][ref10].


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0009705#Artikel9
