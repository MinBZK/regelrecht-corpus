  - number: '20.1'
    text: |-
      Het varkensrecht en het fokzeugenrecht van een daartoe aangemeld bedrijf waaraan vóór 1994 met betrekking tot
      de productie van dierlijke meststoffen een ontheffing op grond van [artikel 16 van de Meststoffenwet][ref1],
      zoals dat luidde tot 1 januari 1998, is verleend met een geldigheid voor een periode tot tenminste
      het tijdstip van inwerkingtreding van [artikel 15 van de wet][ref2], worden bepaald overeenkomstig
      [hoofdstuk II][ref3] en [artikel 24 van de wet][ref4] en deze paragraaf, waarbij voor de toepassing van
      [artikel 6, zesde lid, van de wet][ref5] de in dat lid bedoelde som wordt vermeerderd met het aantal
      kilogrammen fosfaat waarvoor de ontheffing met betrekking tot 1996 geldt, en voor de toepassing van
      [artikel 13 van de wet][ref6] de in dat artikel bedoelde som wordt vermeerderd met het aantal kilogrammen fosfaat
      waarvoor de ontheffing met betrekking tot 1998 geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0009542#HoofdstukII
      [ref4]: https://wetten.overheid.nl/BWBR0009542#Artikel24
      [ref5]: https://wetten.overheid.nl/BWBR0009542#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0009542#Artikel13
