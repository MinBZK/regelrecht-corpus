preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuurbeheer en Visserij van 27 april 1998, nr. J. 983658;

    Gelet op de artikelen 25 en 33 van de Wet herstructurering varkenshouderij en op de artikelen 7, derde lid, 55,
    zesde lid, en 61, eerste lid, van de Meststoffenwet;

    De Raad van State gehoord (advies van 3 juni 1998, no. W11.98.0173);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuurbeheer en Visserij van 15 juni 1998, nr. J. 985482;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel1
  - number: 1.1.a
    text: |-
      wet: [Wet herstructurering varkenshouderij][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009542
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009542
  - number: 1.1.b
    text: |-
      aangifte overschotheffing, afsluitformulier 1995, afsluitformulier 1996, vrijstellingsverklaring,
      vrijstellingsverklaring 1995, vrijstellingsverklaring 1996, grondgebonden mestproductierecht, belanghebbende,
      verplaatsing, kennisgeving van verplaatsing en registratie van een kennisgeving van verplaatsing: hetgeen daaronder
      wordt verstaan in [artikel 5 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel5
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '5'
  - number: 1.1.c
    text: |-
      doorhaling: doorhaling als bedoeld in [artikel 7, derde lid, van de Meststoffenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel7
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '7'
  - number: 1.1.d
    text: |-
      milieuvergunning: vergunning als bedoeld in [artikel 8.1 van de Wet milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 1.1.e
    text: 'aangifte overschotheffing 1994: aangifte overschotheffing die betrekking heeft op het jaar 1994;'
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel1
  - number: 1.1.f
    text: 'aangifte overschotheffing 1997: aangifte overschotheffing die betrekking heeft op het jaar 1997;'
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel1
  - number: 1.1.g
    text: |-
      afsluitformulier 1997: Afsluitformulier bijzondere gebruiksnormen 1997 (125-) of Afsluitformulier mestboekhouding
      1997 (110–125) als bedoeld in artikel 1, eerste lid, van de Regeling vaststelling afsluitformulieren 1997;
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel1
  - number: 1.1.h
    text: 'vrijstellingsverklaring 1997: vrijstellingsverklaring die betrekking heeft op het jaar 1997;'
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel1
  - number: 1.1.i
    text: |-
      inrichting: hetgeen daaronder wordt verstaan in [artikel 1.1, eerste lid, van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: '1.2'
    text: 'Voor de toepassing van dit besluit:'
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel1
  - number: 1.2.a
    text: |-
      worden het niet-gebonden mestproductierecht en het grondgebonden mestproductierecht telkens in aanmerking genomen
      zoals deze, al naar gelang het geval, op het desbetreffende tijdstip dan wel met betrekking tot het desbetreffende
      jaar voor het desbetreffende bedrijf door het Bureau Heffingen zijn geregistreerd;
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel1
  - number: 1.2.b
    text: |-
      wordt het niet-gebonden mestproductierecht voor varkens en kippen geldend met betrekking tot onderscheidenlijk
      1995, 1996 en 1997, telkens vermenigvuldigd met 10/7;
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel1
  - number: 1.2.c
    text: |-
      worden de gegevens van de aangifte overschotheffing – daaronder begrepen de correcties –, het afsluitformulier
      1995, het afsluitformulier 1996, de vrijstellingsverklaring 1995 en de vrijstellingsverklaring 1996 slechts in
      aanmerking genomen voorzover deze vóór 10 juli 1997 door het Bureau Heffingen zijn ontvangen;
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel1
  - number: 1.2.d
    text: |-
      worden de gegevens van de aangifte overschotheffing 1997 – daaronder begrepen de correcties –, het afsluitformulier
      1997 en de vrijstellingsverklaring 1997, in zoverre in afwijking van onderdeel c, slechts in aanmerking genomen
      voorzover deze vóór 21 oktober 1998 door het Bureau Heffingen zijn ontvangen.
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel1
  - number: '1.3'
    text: |-
      De mestproductie afkomstig van de onderscheiden in bijlage A bij de Meststoffenwet genoemde diersoorten wordt
      voor de toepassing van dit besluit overeenkomstig [artikel 55, negende lid, van de Meststoffenwet][ref1]
      vastgesteld op basis van het in het desbetreffende jaar gemiddeld op het bedrijf gehouden aantal dieren van
      de onderscheiden diersoorten en diercategorieën daarbinnen, zoals dat aantal blijkt uit onderscheidenlijk
      de aangifte overschotheffing 1994, de opgave, bedoeld in [artikel 7, tweede lid][ref2], juncto
      [artikel 6, vierde lid, van de wet][ref3], de opgave, bedoeld in [artikel 6, vierde lid, van de wet][ref4], of de
      aangifte overschotheffing 1997, of bij gebreke van deze aangifte, het afsluitformulier 1997, dan wel, bij gebreke
      daarvan, de vrijstellingsverklaring 1997.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0009705#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0009542#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0009542#Artikel6
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '55'
      - id: ref2
