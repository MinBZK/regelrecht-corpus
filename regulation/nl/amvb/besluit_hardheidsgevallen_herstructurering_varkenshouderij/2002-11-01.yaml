  - number: '27.4'
    text: |-
      Het eerste lid is niet van toepassing indien het varkensrecht is bepaald overeenkomstig
      [hoofdstuk 2, paragraaf 2][ref1], onderscheidenlijk [4][ref2], [7A][ref3] of [7C][ref4], van dit besluit.


