        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0009542
        artikel: '24'
  - number: '13.1'
    text: |-
      Het varkensrecht en het fokzeugenrecht van een daartoe aangemeld bedrijf worden in afwijking van
      [paragraaf 3][ref1] bepaald overeenkomstig deze paragraaf, indien is voldaan aan elk van de voorwaarden, bedoeld
      in [artikel 9, eerste en tweede lid][ref2], en bovendien de mestproductie afkomstig van andere diersoorten dan
      varkens in 1996 ten minste 125 kilogram fosfaat bedraagt en ten minste 5% is van de som van het niet-gebonden
      mestproductierecht voor varkens en kippen geldend met betrekking tot 1996 en het met betrekking tot dat jaar
      geldende grondgebonden mestproductierecht.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0009705#Artikel9
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009705
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009705
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '13.2'
    text: |-
      [Artikel 9, vierde en vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel9
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009705
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '14'
    text: |-
      Het varkensrecht van het bedrijf, bedoeld in [artikel 13][ref1], komt overeen met het bij de melding, bedoeld
      in [artikel 2][ref2], aangegeven deel van het aantal varkenseenheden, dat wordt bepaald door de som van het
      grondgebonden mestproductierecht geldend met betrekking tot 1996 en 90% van het met 11% verminderde niet-gebonden
      mestproductierecht voor varkens en kippen geldend met betrekking tot dat jaar, te delen door 7,4 kilogram fosfaat.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0009705#Artikel2
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009705
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0009705
        artikel: '2'
        hoofdstuk: '1'
  - number: '15.1'
    text: |-
      Het fokzeugenrecht is gelijk aan het varkensrecht, voorzover het fokzeugenrecht niet groter is
      dan het aantal varkenseenheden dat overeenkomt met het aantal fokzeugen dat ingevolge de verleende
      milieuvergunning, bedoeld in [artikel 9, eerste lid, onderdelen a en b][ref1], onderscheidenlijk
      ingevolge de in [artikel 9, eerste lid, tweede volzin][ref2], bedoelde milieuvergunning dan wel het
      [Besluit melkrundveehouderijen milieubeheer][ref3] of het [Besluit akkerbouwbedrijven milieubeheer][ref4], ten
      hoogste mag worden gehouden. [Artikel 11, tweede lid][ref5], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009705#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0005158
      [ref4]: https://wetten.overheid.nl/BWBR0006449
      [ref5]: https://wetten.overheid.nl/BWBR0009705#Artikel11
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009705
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
