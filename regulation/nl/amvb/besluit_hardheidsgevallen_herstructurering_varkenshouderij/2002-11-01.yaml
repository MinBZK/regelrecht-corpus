        hoofdstuk: '2'
        paragraaf: 7C
  - number: 19c.2
    text: |-
      Een bedrijf komt uitsluitend voor de toepassing van deze paragraaf in aanmerking indien ten aanzien van het bedrijf
      is voldaan aan elk van de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel19c
  - number: 19c.2.a
    text: |-
      de vergroting van de tot het bedrijf behorende oppervlakte landbouwgrond is uiterlijk op 21 oktober 1998
      schriftelijk bij het Bureau Heffingen gemeld;
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel19c
  - number: 19c.2.b
    text: |-
      de grond waarmee de tot het bedrijf behorende oppervlakte landbouwgrond is uitgebreid, was al vóór 10 juli 1997
      daadwerkelijk in het kader van een normale bedrijfsvoering in gebruik bij het in het eerste lid bedoelde bedrijf;
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel19c
  - number: 19c.2.c
    text: |-
      de in 1997 gerealiseerde mestproductie van varkens was ten minste 25% groter dan de in 1996 gerealiseerde
      mestproductie van varkens en deze vergroting ging gepaard met ten minste eenzelfde vergroting van zowel het
      grondgebonden mestproductierecht als de som van het grondgebonden mestproductierecht en het niet-gebonden
      mestproductierecht voor varkens en kippen.
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel19c
  - number: 19d.1
    text: |-
      Het varkensrecht en het fokzeugenrecht van het bedrijf, bedoeld in [artikel 19c][ref1], worden vergroot met het
      bij de melding, bedoeld in [artikel 2][ref2], aangegeven aantal varkenseenheden dat ten hoogste overeenkomt met het
      verschil tussen het in 1997 gemiddeld op het bedrijf gehouden aantal varkens, onderscheidenlijk fokzeugen, en het
      in 1996 gemiddeld op het bedrijf gehouden aantal varkens, onderscheidenlijk fokzeugen.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel19c
      [ref2]: https://wetten.overheid.nl/BWBR0009705#Artikel2
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel19d
    references:
      - id: ref1
        bwb_id: BWBR0009705
        artikel: 19c
        hoofdstuk: '2'
        paragraaf: 6B
      - id: ref2
        bwb_id: BWBR0009705
        artikel: '2'
        hoofdstuk: '1'
  - number: 19d.2
    text: |-
      [Artikel 6, vierde, vijfde en zesde lid, van de wet][ref1] is van overeenkomstige toepassing, met
      dien verstande dat in plaats van «1996» telkens wordt gelezen «1996, onderscheidenlijk 1997,» en in
      [artikel 6, vierde lid, van de wet][ref2] in plaats van «in de aangifte overschotheffing 1996, bij gebreke
      daarvan, op het afsluitformulier 1996, dan wel, bij gebreke daarvan, op de vrijstellingsverklaring 1996» wordt
      gelezen: in de aangifte overschotheffing 1996, onderscheidenlijk de aangifte overschotheffing 1997, of bij gebreke
      daarvan, op het afsluitformulier 1996, onderscheidenlijk het afsluitformulier 1997, of bij gebreke daarvan, op de
      vrijstellingsverklaring 1996, onderscheidenlijk de vrijstellingsverklaring 1997.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel6
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel19d
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '6'
  - number: 19d.3
    text: |-
      Indien het varkensrecht overeenkomstig [artikel 7 van de wet][ref1] is bepaald, wordt in het eerste lid in plaats
      van «1996» gelezen: 1995.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel7
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel19d
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '7'
  - number: 19d.4
    text: |-
      Indien het varkensrecht overeenkomstig [paragraaf 1 van dit hoofdstuk][ref1] is bepaald, wordt in het eerste lid
      in plaats van «1996» gelezen: 1994.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel19d
    references:
      - id: ref1
        bwb_id: BWBR0009705
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 19e
    text: |-
      De vergroting van het varkensrecht en het fokzeugenrecht betreft het grondgebonden deel van het varkensrecht,
      onderscheidenlijk het fokzeugenrecht.
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel19e
  - number: 19f
    text: |-
      In zoverre in afwijking van [artikel 2, eerste lid][ref1], worden het varkensrecht en het fokzeugenrecht van
      een daartoe aangemeld bedrijf bepaald overeenkomstig deze paragraaf indien is voldaan aan elk van de volgende
      voorwaarden: '- ten aanzien van het bedrijf is geen opgave als bedoeld in de [artikelen 6, vierde lid][ref2], en'
      [7, tweede lid, van de wet][ref3] gedaan;
        - het grondgebonden mestproductierecht van het bedrijf was zowel in 1996 als in 1995 tenminste 75% van de som van
      het grondgebonden mestproductierecht en het niet-gebonden mestproductierecht voor varkens en kippen;
        - toepassing van deze paragraaf leidt tot een vergroting van het varkensrecht ten opzichte van het overeenkomstig
      [artikel 8 van de wet][ref4] bepaalde varkensrecht met tenminste 10%.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0009542#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0009542#Artikel8
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel19f
    references:
      - id: ref1
        bwb_id: BWBR0009705
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0009542
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0009542
        artikel: '8'
  - number: 19g.1
    text: |-
      Het varkensrecht en het fokzeugenrecht van het bedrijf, bedoeld in [artikel 19f][ref1], worden bepaald
      overeenkomstig [hoofdstuk II][ref2], uitgezonderd [artikel 8][ref3], en [artikel 24 van de wet][ref4], met dien
      verstande dat, in afwijking van de [artikelen 6, vierde lid][ref5], en [7, tweede lid, van de wet][ref6], het
      gemiddeld in 1996 of 1995 op het bedrijf gehouden aantal varkens, onderscheidenlijk fokzeugen, het aantal is dat
      met betrekking tot het desbetreffende bedrijf en het desbetreffende jaar is opgegeven overeenkomstig de artikelen
      4 en 5 van de Regeling landbouwtelling 1996 of de artikelen 4 en 5 van de Regeling landbouwtelling 1995, verminderd
      met 10%.


