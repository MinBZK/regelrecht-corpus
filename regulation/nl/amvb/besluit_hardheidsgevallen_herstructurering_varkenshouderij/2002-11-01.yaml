        bwb_id: BWBR0006449
      - id: ref5
        bwb_id: BWBR0009705
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '15.2'
    text: |-
      De [artikelen 9][ref1] en [10 van de wet][ref2] zijn van overeenkomstige toepassing op het overeenkomstig deze
      paragraaf bepaalde varkensrecht, onderscheidenlijk fokzeugenrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel10
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '10'
  - number: '15.3'
    text: |-
      Deze paragraaf blijft buiten toepassing indien het op grond van deze paragraaf bepaalde
      varkensrecht minder dan 110% zou zijn van het varkensrecht, zoals dat door toepassing van
      [hoofdstuk II, uitgezonderd artikel 14, en artikel 24 van de wet][ref1] zou worden bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009542
        hoofdstuk: II
  - number: '16'
    text: |-
      Het overeenkomstig hoofdstuk II, uitgezonderd [artikel 14][ref1], en [artikel 24][ref2] van de wet bepaalde
      fokzeugenrecht van een daartoe aangemeld bedrijf wordt overeenkomstig deze paragraaf vergroot, indien met
      betrekking tot het desbetreffende bedrijf na 1992 en vóór 15 november 1997 ten behoeve van een vergroting van het
      aantal te houden fokzeugen onder vermindering van het aantal te houden andere varkens dan fokzeugen:


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0009705#Artikel24
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel16
    references:
