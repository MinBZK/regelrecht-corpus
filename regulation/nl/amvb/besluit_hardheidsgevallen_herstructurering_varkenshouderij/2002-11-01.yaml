        artikel: '6'
      - id: ref4
        bwb_id: BWBR0009542
        artikel: '6'
  - number: '2.1'
    text: |-
      Met betrekking tot een daartoe aangemeld bedrijf, niet zijnde een bedrijf als bedoeld in
      [artikel 8, eerste of vierde lid, van de wet][ref1], of een door samenvoeging ontstaan bedrijf als bedoeld
      in [artikel 11, zesde lid, van de wet][ref2], wordt met ingang van het tijdstip van inwerkingtreding van
      [artikel 15 van de wet][ref3] de hoogte van het varkensrecht en het fokzeugenrecht bepaald overeenkomstig de
      [hoofdstukken 1][ref4], [2][ref5] en [4][ref6] van dit besluit, onder de in dit besluit geregelde voorwaarden
      en beperkingen. Ten aanzien van dit bedrijf wordt het grondgebonden deel van het varkensrecht, onderscheidenlijk
      fokzeugenrecht, bepaald overeenkomstig [artikel 1, onderdeel o, onderscheidenlijk p, van de wet][ref7], tenzij in
      dit besluit anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0009542#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0009705#Hoofdstuk1
      [ref5]: https://wetten.overheid.nl/BWBR0009705#Hoofdstuk2
      [ref6]: https://wetten.overheid.nl/BWBR0009705#Hoofdstuk4
      [ref7]: https://wetten.overheid.nl/BWBR0009542#Artikel1
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0009542
        artikel: '15'
      - id: ref4
        bwb_id: BWBR0009705
        hoofdstuk: '1'
      - id: ref5
        bwb_id: BWBR0009705
        hoofdstuk: '2'
      - id: ref6
        bwb_id: BWBR0009705
        hoofdstuk: '4'
      - id: ref7
        bwb_id: BWBR0009542
        artikel: '1'
  - number: '2.2'
    text: |-
      Ten aanzien van een bedrijf als bedoeld in het eerste lid blijven, tenzij in dit besluit anders is bepaald,
      [hoofdstuk II van de wet][ref1] en [artikel 55a van de Meststoffenwet][ref2] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel55a
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009542
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004054
        artikel: 55a
  - number: '2.3'
    text: |-
      De belanghebbende doet de in het eerste lid bedoelde melding binnen zes weken na inwerkingtreding van dit
      besluit bij het Bureau Heffingen, met gebruikmaking van een daartoe door Onze Minister vastgesteld formulier,
      dat overeenkomstig de op het formulier aangegeven wijze volledig en naar waarheid is ingevuld en door de
      belanghebbende is ondertekend. Bij gebreke van een overeenkomstig [de eerste volzin][ref1] gedane melding worden de
      [hoofdstukken 1][ref2], [2][ref3] en [4][ref4] van dit besluit ten aanzien van het desbetreffende bedrijf van de
      belanghebbende niet toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009705#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0009705#Hoofdstuk2
      [ref4]: https://wetten.overheid.nl/BWBR0009705#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009705
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0009705
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0009705
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0009705
        hoofdstuk: '4'
  - number: '2.4'
    text: |-
      Een belanghebbende kan de in het eerste lid bedoelde melding slechts doen ten aanzien van één van de
      [paragrafen 1 tot en met 7C van hoofdstuk 2][ref1], tenzij in dat hoofdstuk anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009705
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '2.5'
    text: |-
      Indien een belanghebbende behalve de melding, bedoeld in het eerste lid, tevens een melding heeft gedaan als
      bedoeld in de [artikelen 7 tot en met 11][ref1] en [14 van de wet][ref2], wordt ingeval van meldingen die naar hun
      inhoud tegenstrijdig zijn, slechts de op grond van dit besluit gedane melding in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel14
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '14'
  - number: '2.6'
    text: |-
      Een melding op grond van de [artikelen 9][ref1] en [10 van de wet][ref2] geldt ten aanzien van
      [paragraaf 6 van hoofdstuk 2][ref3] tevens als een melding op grond van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0009705#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0009705
        hoofdstuk: '2'
        paragraaf: '6'
  - number: '3.1'
    text: |-
      Het varkensrecht en het fokzeugenrecht van een daartoe aangemeld bedrijf worden bepaald overeenkomstig deze
      paragraaf, indien de latente ruimte zowel ten aanzien van 1995 als ten aanzien van 1996 tenminste 11% bedraagt
      van het niet-gebonden mestproductierecht voor varkens en kippen geldend met betrekking tot het desbetreffende
      jaar. De latente ruimte wordt bepaald door de som van het niet-gebonden mestproductierecht voor varkens en kippen
      geldend met betrekking tot het desbetreffende jaar en het met betrekking tot dat jaar geldende grondgebonden
      mestproductierecht te verminderen met:
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel3
  - number: 3.1.a
    text: |-
      de mestproductie afkomstig van de in het desbetreffende jaar gehouden dieren van andere diersoorten dan varkens
      en kippen, voorzover deze mestproductie groter is dan het niet-gebonden mestproductierecht voor deze diersoorten
      geldend met betrekking tot dat jaar, en
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel3
  - number: 3.1.b
    text: de mestproductie afkomstig van de in het desbetreffende jaar gehouden varkens en kippen.
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel3
  - number: '3.2'
    text: |-
      Een bedrijf komt uitsluitend voor de toepassing van deze paragraaf in aanmerking indien ten aanzien van het bedrijf
      is voldaan aan elk van de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel3
  - number: 3.2.a
    text: |-
      de mestproductie afkomstig van varkens is in 1995 of 1996 ten minste 125 kilogram fosfaat en ten minste 5% van de
      som van het niet-gebonden mestproductierecht voor varkens en kippen geldend met betrekking tot het desbetreffende
      jaar en het met betrekking tot dat jaar geldende grondgebonden mestproductierecht;
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel3
  - number: 3.2.b
    text: |-
      het niet-gebonden mestproductierecht voor varkens en kippen is per saldo niet verkleind ten gevolge van de
      registratie van kennisgevingen van verplaatsingen met betrekking tot dat recht die zijn gedaan in de periode van
      1 januari 1994 tot 10 juli 1997 of, ingeval het bedrijf na 1 januari 1994 door samenvoeging is ontstaan of een of
      meer keren is overgedragen, in de periode gelegen tussen die samenvoeging of de laatste van die overdrachten en 10
      juli 1997;
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel3
  - number: 3.2.c
    text: |-
      het blijkens de aangifte overschotheffing 1994 in 1994 gemiddeld op het bedrijf gehouden aantal varkens bedraagt
      ten minste 110% van zowel het in 1995 als het in 1996 gemiddeld op het bedrijf gehouden aantal varkens zoals
      dat aantal blijkt uit de opgave, bedoeld in [artikel 7, tweede lid][ref1], juncto [artikel 6, vierde lid][ref2],
      onderscheidenlijk bedoeld in [artikel 6, vierde lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009705#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0009542#Artikel6
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009705
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009705
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0009542
        artikel: '6'
  - number: '3.3'
    text: |-
      Het tweede lid, onderdeel c, is niet van toepassing indien het niet-gebonden mestproductierecht voor varkens en
      kippen geldend op 1 januari 1994 per saldo met ten minste 10% is vergroot ten gevolge van de registratie van in
      1994 en 1995 gedane kennisgevingen van verplaatsing met betrekking tot dit recht.
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel3
  - number: '4.1'
    text: |-
      Het varkensrecht en het fokzeugenrecht van het bedrijf, bedoeld in [artikel 3][ref1], komen overeen met het in 1994
      gemiddeld op het bedrijf gehouden aantal varkens, onderscheidenlijk fokzeugen, verminderd met 10%.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel3
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009705
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '4.2'
    text: |-
      Voor de toepassing van het eerste lid wordt het in 1994 gemiddeld op het bedrijf gehouden aantal varkens,
      onderscheidenlijk fokzeugen, slechts in aanmerking genomen voorzover dit aantal lager is dan zowel het voor 1995
      als 1996 berekende aantal varkenseenheden, dat wordt bepaald door de som van het grondgebonden mestproductierecht
      geldend met betrekking tot het desbetreffende jaar en 89% van het met betrekking tot dat jaar geldende niet-
      gebonden mestproductierecht voor varkens en kippen te verminderen met achtereenvolgens:
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel4
  - number: 4.2.a
    text: |-
      de mestproductie afkomstig van de in het desbetreffende jaar gehouden dieren van andere diersoorten dan varkens
      en kippen, voorzover deze mestproductie groter is dan het niet-gebonden mestproductierecht voor deze diersoorten
      geldend met betrekking tot dat jaar, en
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel4
  - number: 4.2.b
    text: de mestproductie afkomstig van de in het desbetreffende jaar gehouden kippen,
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel4
  - number: '4.3'
    text: |-
      [Artikel 6, derde, vierde, vijfde en zesde lid, van de wet][ref1] is van overeenkomstige toepassing, met dien
      verstande dat in plaats van «1996» telkens wordt gelezen «1994» en in [artikel 6, vierde lid, van de wet][ref2] in
      plaats van «in de aangifte overschotheffing 1996, bij gebreke daarvan, op het afsluitformulier 1996, dan wel, bij
      gebreke daarvan, op de vrijstellingsverklaring 1996» wordt gelezen: in de aangifte overschotheffing 1994.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel6
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '6'
  - number: '5.1'
    text: |-
      Indien in 1994, 1995 of 1996 registratie van een kennisgeving van verplaatsing met betrekking tot het niet-gebonden
      mestproductierecht voor varkens en kippen heeft plaatsgevonden, of na 1996 registratie heeft plaatsgevonden van
      een dergelijke uiterlijk op 9 juli 1997 gedane kennisgeving, wordt het overeenkomstig [artikel 4][ref1] bepaalde
      varkensrecht vergroot voor het bedrijf waarheen is verplaatst, en verkleind tot ten minste nihil voor het bedrijf
      waarvan het niet-gebonden mestproductierecht afkomstig is.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel4
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009705
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '5.2'
    text: |-
      Op de in het eerste lid bedoelde vergroting, onderscheidenlijk verkleining, is
      [artikel 10, tweede en vierde lid, onderscheidenlijk derde en vierde lid, van de wet][ref1], van overeenkomstige
      toepassing, met dien verstande dat in [artikel 10, derde lid, van de wet][ref2] in plaats van «[artikel 7][ref3]»
      wordt gelezen« [artikel 4][ref4] van dit besluit» en in plaats van «1995» wordt gelezen: 1994.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0009705#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0009705#Artikel4
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0009705
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0009705
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '5.3'
    text: |-
      Indien de in het eerste lid bedoelde registratie evenwel plaatsvond in 1994, is in afwijking
      van het tweede lid op de in het eerste lid bedoelde vergroting, onderscheidenlijk verkleining,
      [artikel 9, tweede en vijfde lid, onderscheidenlijk derde, vierde en vijfde lid, van de wet][ref1], van
      overeenkomstige toepassing, met dien verstande dat in het tweede, derde en vierde lid van dat artikel in plaats van
      «1996» telkens wordt gelezen: 1994.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel9
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '9'
  - number: '5.4'
    text: |-
      De vergroting, bedoeld in het derde lid, vindt slechts plaats voorzover het varkensrecht daardoor niet groter wordt
      dan zowel het met betrekking tot 1995 als het met betrekking tot 1996 bepaalde aantal varkenseenheden, bedoeld in
      [artikel 4, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel4
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009705
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '6.1'
    text: |-
      Het grondgebonden deel van het overeenkomstig deze paragraaf bepaalde varkensrecht, onderscheidenlijk
      fokzeugenrecht, is het deel van het varkensrecht, onderscheidenlijk fokzeugenrecht, overeenkomend met het op
      het tijdstip van inwerkingtreding van [artikel 15 van de wet][ref1] geldende varkensrecht, onderscheidenlijk
      fokzeugenrecht, verminderd met 90% van het aantal varkenseenheden dat wordt bepaald door het niet-gebonden
      mestproductierecht voor varkens en kippen geldend met betrekking tot 1994 te delen door 7,4 kilogram fosfaat.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel15
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '15'
  - number: '6.2'
    text: |-
      Voor de toepassing van de [artikelen 15, eerste en tweede lid][ref1], en [16, tweede lid, van de wet][ref2]
      wordt onder het grondgebonden deel van het varkensrecht, onderscheidenlijk fokzeugenrecht, niet begrepen het
      op het tijdstip van inwerkingtreding van [artikel 15 van de wet][ref3] geldende varkensrecht, onderscheidenlijk
      fokzeugenrecht, voor zover dat als gevolg van de toepassing van [artikel 5][ref4] is vergroot ten opzichte van het
      varkensrecht, onderscheidenlijk fokzeugenrecht, zoals dat is bepaald op grond van [artikel 4][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0009542#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0009705#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0009705#Artikel4
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '16'
      - id: ref3
        bwb_id: BWBR0009542
        artikel: '15'
      - id: ref4
        bwb_id: BWBR0009705
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0009705
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '7.1'
    text: |-
      Het varkensrecht en het fokzeugenrecht van een daartoe aangemeld bedrijf worden bepaald overeenkomstig deze
      paragraaf, indien in de periode van 1 januari 1995 tot 10 juli 1997 een overdracht van het bedrijf heeft
      plaatsgevonden en wordt voldaan aan [artikel 3, eerste lid][ref1], met dien verstande dat in dat lid in plaats van
      «zowel ten aanzien van 1995 als ten aanzien van 1996» wordt gelezen: ten aanzien van elk van de jaren 1994, 1995
      en 1996.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel3
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009705
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '7.2'
    text: |-
      Een bedrijf komt uitsluitend voor de toepassing van deze paragraaf in aanmerking indien ten aanzien van het bedrijf
      is voldaan aan elk van de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel7
  - number: 7.2.a
    text: |-
      de mestproductie afkomstig van varkens is in 1994, 1995 of 1996 ten minste 125 kilogram fosfaat en ten minste
      5% van de som van het niet-gebonden mestproductierecht voor varkens en kippen geldend met betrekking tot het
      desbetreffende jaar en het met betrekking tot dat jaar geldende grondgebonden mestproductierecht;
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel7
  - number: 7.2.b
    text: |-
      het niet-gebonden mestproductierecht voor varkens en kippen is per saldo niet verkleind ten gevolge van de
      registratie van na de overdracht, bedoeld in het eerste lid, of, ingeval één of meer overdrachten hebben
      plaatsgevonden, na de laatste van die overdrachten, tot 10 juli 1997 gedane kennisgevingen van verplaatsing met
      betrekking tot dat recht.
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel7
  - number: '8.1'
    text: |-
      Het varkensrecht van het bedrijf, bedoeld in [artikel 7][ref1], komt overeen met het bij de melding, bedoeld
      in [artikel 2][ref2], aangegeven deel van het aantal varkenseenheden dat wordt bepaald door de som van het
      grondgebonden mestproductierecht geldend met betrekking tot 1996 en 89% van het met betrekking tot dat jaar
      geldende niet-gebonden mestproductierecht voor varkens en kippen te verminderen met achtereenvolgens:


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009705#Artikel2
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009705
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009705
        artikel: '2'
        hoofdstuk: '1'
  - number: 8.1.a
    text: |-
      de mestproductie afkomstig van de in 1996 gehouden dieren van andere diersoorten dan varkens en kippen, voorzover
      deze mestproductie groter is dan het niet-gebonden mestproductierecht voor deze diersoorten geldend met betrekking
      tot dat jaar,
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel8
  - number: 8.1.b
    text: de mestproductie van de in 1996 gehouden kippen, en
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel8
  - number: 8.1.c
    text: |-
      10% van het aantal kilogrammen fosfaat, zijnde ten minste nihil, dat wordt bepaald door het niet-gebonden
      mestproductierecht voor varkens en kippen geldend met betrekking tot 1996 te verminderen met de som van a en b,
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel8
  - number: '8.2'
    text: |-
      De in het eerste lid bedoelde vermindering met 10% is niet van toepassing op het aantal varkens dat groter is
      dan het aantal dat wordt bepaald door het niet-gebonden mestproductierecht voor varkens en kippen geldend met
      betrekking tot 1996 te delen door 7,4 kilogram fosfaat.
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel8
  - number: '8.3'
    text: |-
      Indien in 1994, 1995 of 1996 op het bedrijf mestproductie afkomstig van fokzeugen heeft plaatsgevonden, is het
      fokzeugenrecht gelijk aan het varkensrecht, bedoeld in het eerste lid. Bij gebreke van een dergelijke mestproductie
      is het fokzeugenrecht nihil, behoudens indien uit [paragraaf 5][ref1] anders volgt.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009705
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '8.4'
    text: |-
      De [artikelen 9][ref1] en [10 van de wet ][ref2]zijn van overeenkomstige toepassing op het overeenkomstig deze
      paragraaf bepaalde varkensrecht, onderscheidenlijk fokzeugenrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel10
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '10'
  - number: '9.1'
    text: |-
      Het overeenkomstig hoofdstuk II, uitgezonderd [artikel 14][ref1], en [artikel 24][ref2] van de wet bepaalde
      varkensrecht, onderscheidenlijk fokzeugenrecht, van een daartoe aangemeld bedrijf wordt overeenkomstig deze
      paragraaf vergroot, indien met betrekking tot het desbetreffende bedrijf na 1992 en vóór 10 juli 1997 ten behoeve
      van een vergroting van het aantal te houden varkens:


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0009705#Artikel24
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009705
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0009705
        artikel: '24'
        hoofdstuk: '3'
  - number: 9.1.a
    text: door het bevoegd gezag een milieuvergunning is verleend,
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel9
  - number: 9.1.b
    text: |-
      een aanvraag is ingediend om een milieuvergunning, die naar aanleiding van de aanvraag uiterlijk op 1 januari 2001
      is verleend, dan wel
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel9
  - number: 9.1.c
    text: |-
      bij het bevoegd gezag overeenkomstig [artikel 8.19 van de Wet milieubeheer][ref1] dan wel
      overeenkomstig [artikel 4 van het Besluit melkrundveehouderijen milieubeheer][ref2] of
      [artikel 3 van het Besluit akkerbouwbedrijven milieubeheer][ref3] een of meer meldingen zijn gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005158#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0006449#Artikel3
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005158
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0006449
        artikel: '3'
  - number: '9.2'
    text: |-
      Een bedrijf komt uitsluitend voor de toepassing van deze paragraaf in aanmerking indien ten aanzien van het bedrijf
      is voldaan aan elk van de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel9
  - number: 9.2.b
    text: |-
      uiterlijk op 1 januari 2003 is binnen de inrichting extra huisvesting gebouwd voor ten minste 75%
      van het aantal varkens waarvoor extra huisvesting diende te worden gebouwd om alle varkens die mogen
      worden gehouden ingevolge de verleende milieuvergunning, bedoeld in het eerste lid, onderdelen a en b,
      onderscheidenlijk ingevolge de milieuvergunning, bedoeld in de tweede volzin van dat lid dan wel het
      [Besluit melkrundveehouderijen milieubeheer][ref1] of het [Besluit akkerbouwbedrijven milieubeheer][ref2],
      te kunnen huisvesten overeenkomstig de verleende milieuvergunning, onderscheidenlijk overeenkomstig
      de in het eerste lid, tweede volzin, bedoelde milieuvergunning in samenhang met de overeenkomstig
      [artikel 8.19 van de Wet milieubeheer][ref3] gedane meldingen, dan wel overeenkomstig het
      [Besluit melkrundveehouderijen milieubeheer][ref4] of het [Besluit akkerbouwbedrijven milieubeheer][ref5] in
      samenhang met de in het eerste lid, onderdeel c, bedoelde meldingen;.


      [ref1]: https://wetten.overheid.nl/BWBR0005158
      [ref2]: https://wetten.overheid.nl/BWBR0006449
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0005158
      [ref5]: https://wetten.overheid.nl/BWBR0006449
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005158
      - id: ref2
        bwb_id: BWBR0006449
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0005158
      - id: ref5
        bwb_id: BWBR0006449
  - number: 9.2.c
    text: |-
      uiterlijk op 1 januari 2003 is op het bedrijf huisvesting voor varkens aanwezig voor tenminste het aantal varkens
      dat overeenkomt met 85% van het op grond van deze paragraaf vergrote varkensrecht;
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel9
  - number: 9.2.d
    text: |-
      bij de melding, bedoeld in [artikel 2][ref1], wordt een afschrift van de vergunning, bedoeld in het eerste lid,
      onderdeel a, de aanvraag, bedoeld in het eerste lid, onderdeel b, onderscheidenlijk de meldingen, bedoeld in
      het eerste lid, onderdeel c en, in voorkomend geval, de milieuvergunning, bedoeld in de tweede volzin van het
      eerste lid, waarop door het bevoegd gezag de datum van ontvangst is aangetekend, overgelegd. Bij gebreke van een
      dergelijke aantekening wordt tevens een door het bevoegd gezag afgegeven bewijs van ontvangst, waarin die datum is
      vermeld, overgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel2
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009705
        artikel: '2'
        hoofdstuk: '1'
  - number: 9.2.e
    text: |-
      binnen zes weken na de verlening van de milieuvergunning, bedoeld in het eerste lid, onderdeel b, dan wel,
      indien die verlening vóór de inwerkingtreding van dit besluit heeft plaatsgevonden, binnen zes weken na die
      inwerkingtreding, wordt een afschrift van de milieuvergunning overgelegd aan het Bureau Heffingen. Op verzoek van
      het Bureau Heffingen wordt binnen de daarbij aangegeven termijn de milieuvergunning aan dat bureau overgelegd.
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel9
  - number: '9.4'
    text: |-
      Indien het bedrijf na 10 juli 1997 met betrekking tot dezelfde inrichting
      overeenkomstig [artikel 8.19 van de Wet milieubeheer][ref1], onderscheidenlijk
      [artikel 4 van het Besluit melkrundveehouderijen milieubeheer][ref2] of
      [artikel 3 van het Besluit akkerbouwbedrijven milieubeheer][ref3], een melding heeft gedaan dan wel een nieuwe
      aanvraag voor een milieuvergunning heeft gedaan die niet ziet op een verdere uitbreiding van de varkensstapel,
      treedt de melding dan wel de nieuwe aanvraag, onderscheidenlijk de uiterlijk op 1 januari 2001 naar aanleiding van
      die aanvraag verleende milieuvergunning, voor de toepassing van het tweede lid, onderdelen b en e, in de plaats van
      de meldingen bedoeld in het eerste lid, onderdeel c, onderscheidenlijk van de in onderdeel b van dat lid bedoelde
      aanvraag dan wel van de milieuvergunning, bedoeld in het eerste lid, onderdeel a. Een afschrift van de melding,
      onderscheidenlijk de nieuwe aanvraag, wordt aan het Bureau Heffingen overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005158#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0006449#Artikel3
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005158
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0006449
        artikel: '3'
  - number: '9.5'
    text: |-
      Binnen zes weken nadat de huisvesting voor varkens, bedoeld in het tweede lid, onderdelen b en c, is gerealiseerd,
      dan wel, indien de huisvesting vóór de inwerkingtreding van het onderhavige artikellid heeft plaatsgevonden, binnen
      zes weken na inwerkingtreding van dat lid, geeft de belanghebbende hiervan kennis aan het Bureau Heffingen met
      gebruikmaking van een daartoe door Onze Minister vastgesteld formulier met toelichting, dat overeenkomstig de op
      het formulier aangeven wijze volledig en naar waarheid is ingevuld en door de belanghebbende is ondertekend.
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel9
  - number: '9.6'
    text: |-
      Deze paragraaf blijft buiten toepassing indien de vergroting minder dan 10% van het overeenkomstig
      [hoofdstuk II, uitgezonderd artikel 14, en artikel 24 van de wet][ref1] bepaalde varkensrecht zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009542
        hoofdstuk: II
  - number: '10.1'
    text: |-
      Het varkensrecht van het bedrijf, bedoeld in [artikel 9][ref1], wordt vergroot met het bij de melding, bedoeld
      in [artikel 2][ref2], aangegeven aantal varkenseenheden dat ten hoogste overeenkomt met het niet-benutte deel van
      het mestproductierecht.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009705#Artikel2
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009705
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009705
        artikel: '2'
        hoofdstuk: '1'
  - number: '10.2'
    text: |-
      Het niet-benutte deel van het mestproductierecht, bedoeld in het eerste lid, komt overeen met het aantal
      varkenseenheden dat wordt bepaald door de som van het grondgebonden mestproductierecht zoals dat zou gelden op
      1 januari 1998 indien geen rekening wordt gehouden met wijzigingen in de oppervlakte tot het bedrijf behorende
      landbouwgrond van na 9 juli 1997, en het niet-gebonden mestproductierecht voor varkens en kippen zoals dat
      zou gelden op 1 januari 1998 indien geen rekening wordt gehouden met na 9 juli 1997 gedane kennisgevingen van
      verplaatsing met betrekking tot dit recht, achtereenvolgens te verminderen met:
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel10
  - number: 10.2.a
    text: |-
      het aantal kilogrammen fosfaat dat wordt bepaald door het verschil tussen het overeenkomstig
      [hoofdstuk II, uitgezonderd artikel 14, en artikel 24 van de wet][ref1] bepaalde varkensrecht en het grondgebonden
      deel daarvan te vermenigvuldigen met 100/90, het product vervolgens te vermeerderen met dit grondgebonden deel en
      deze som te vermenigvuldigen met 7,4 kilogram fosfaat,


      [ref1]: https://wetten.overheid.nl/BWBR0009542#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009542
        hoofdstuk: II
  - number: 10.2.b
    text: |-
      de mestproductie afkomstig van de in 1996 gehouden dieren van andere diersoorten dan varkens en kippen, voorzover
      deze mestproductie groter is dan het niet-gebonden mestproductierecht voor deze diersoorten zoals dat zou gelden
      op 1 januari 1998 indien geen rekening wordt gehouden met na 9 juli 1997 gedane kennisgevingen van verplaatsing met
      betrekking tot dit recht,
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel10
  - number: 10.2.c
    text: de mestproductie afkomstig van de in 1996 gehouden kippen, en
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel10
  - number: 10.2.d
    text: |-
      10% van het aantal kilogrammen fosfaat, zijnde ten minste nihil, dat wordt bepaald door het in de aanhef bedoelde
      niet-gebonden mestproductierecht voor varkens en kippen te verminderen met de som van a, b en c,
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel10
  - number: 10.2.en
    text: dit verschil te delen door 7,4 kilogram fosfaat.
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel10
  - number: '10.3'
    text: |-
      Indien het varkensrecht overeenkomstig [artikel 7 van de wet][ref1] is bepaald, wordt in het tweede lid in plaats
      van «1996» telkens gelezen: 1995.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel7
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '7'
  - number: '10.4'
    text: |-
      Voor de toepassing van het tweede lid, onderdeel a, is [artikel 55a, derde lid, van de Meststoffenwet][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel55a
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 55a
  - number: '11.1'
    text: |-
      De in [artikel 10][ref1] bedoelde vergroting betreft het fokzeugenrecht voorzover de vergroting niet meer
      is dan het aantal varkenseenheden dat overeenkomt met het aantal fokzeugen dat ingevolge de verleende
      milieuvergunning, bedoeld in [artikel 9, eerste lid, onderdelen a en b][ref2], onderscheidenlijk
      ingevolge de in [artikel 9, eerste lid, tweede volzin][ref3], bedoelde milieuvergunning in samenhang met
      de overeenkomstig [artikel 8.19 van de Wet milieubeheer][ref4] gedane meldingen, dan wel ingevolge het
      [Besluit melkrundveehouderijen milieubeheer][ref5] of het [Besluit akkerbouwbedrijven milieubeheer][ref6] in
      samenhang met de in [artikel 9, eerste lid, onderdeel c][ref7], bedoelde meldingen, ten hoogste mag worden
      gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009705#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0009705#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0005158
      [ref6]: https://wetten.overheid.nl/BWBR0006449
      [ref7]: https://wetten.overheid.nl/BWBR0009705#Artikel9
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel11
