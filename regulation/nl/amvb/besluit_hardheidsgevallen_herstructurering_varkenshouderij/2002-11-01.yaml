  - number: '17.2'
    text: |-
      De [artikelen 9, tweede tot en met zesde lid][ref1], en [11, tweede lid][ref2], zijn van overeenkomstige
      toepassing, met dien verstande dat in plaats van «varkensrecht» telkens wordt gelezen «fokzeugenrecht», en in
      plaats van «varkens» telkens wordt gelezen: fokzeugen.


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009705#Artikel11
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel17
