  - number: 20.2.a
    text: |-
      voor de toepassing van [artikel 10, tweede lid][ref1], de in dat lid bedoelde som wordt vermeerderd met het aantal
      kilogrammen fosfaat waarvoor de ontheffing met betrekking tot 1997 geldt;


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Artikel10
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel20
    references:
