      kippen ten gevolge van in of na 1996 uiterlijk op 9 juli 1997 gedane kennisgevingen van verplaatsing met betrekking
      tot dat recht per saldo is vergroot, te delen door 7,4 kilogram fosfaat.
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel19
  - number: '19.2'
    text: |-
