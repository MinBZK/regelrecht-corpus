  - number: '19.4'
    text: |-
      Indien het varkensrecht en het fokzeugenrecht worden bepaald overeenkomstig [paragraaf 1][ref1] van dit besluit,
      wordt in het eerste lid in plaats van «1996» telkens gelezen «1994».


      [ref1]: https://wetten.overheid.nl/BWBR0009705#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0009705/2002-11-01#Artikel19
    references:
