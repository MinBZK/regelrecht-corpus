articles:
  - number: VII
    text: |-
      1 Op verzoek van degene die een inrichting drijft waarvoor onmiddellijk voorafgaand aan het tijdstip van
      inwerkingtreding van dit besluit en ter voldoening aan de op dat moment in het [Vuurwerkbesluit][ref1] gestelde
      regels:

      a. door het bevoegd gezag het voornemen bekend is gemaakt tot intrekking van een vergunning als bedoeld in
      [artikel 8.1 van de Wet milieubeheer][ref2] voor het opslaan, herverpakken of bewerken van vuurwerk, of

      b. schriftelijk vastgelegde afspraken zijn gemaakt tussen het bevoegd gezag en degene die de inrichting drijft tot
      beëindiging van de activiteiten van de inrichting,

      blijven [artikel 5.3.2, tweede tot en met vierde lid][ref3], en de voorschriften opgenomen in
      [bijlagen 1 tot en met 3][ref4] zoals die gaan gelden ingevolge dit besluit, buiten toepassing tot uiterlijk 1
      november 2004.

      2 Op verzoek van degene die een inrichting drijft waarvoor voor 1 maart 2002 een melding was gedaan krachtens het
      Besluit opslag vuurwerk milieubeheer en waarvoor onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding
      van dit besluit en met het oog op de op dat moment in het [Vuurwerkbesluit][ref5] gestelde regels schriftelijk
      vastgelegde afspraken zijn gemaakt tussen het bevoegd gezag en degene die de inrichting drijft tot beëindiging van
      de activiteiten van de inrichting, blijven [artikel 5.3.2, tweede tot en met vierde lid][ref6], en de voorschriften
      opgenomen in [bijlagen 1][ref7] en [3][ref8] zoals die gaan gelden ingevolge dit besluit buiten toepassing tot
      uiterlijk 1 november 2004.


