  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 18 juli
    2003, nr. MJZ 2003071607, Centrale Directie Juridische Zaken, Afdeling Wetgeving, gedaan in overeenstemming met
    Onze Minister van Verkeer en Waterstaat;

    Gelet op artikel 24 van de Wet milieugevaarlijke stoffen, artikel 3 van de Wet vervoer gevaarlijke stoffen en de
    artikelen 5.1, 5.3, 8.2, tweede lid, 8.42, tweede lid, en 8.44 van de Wet milieubeheer;

    De Raad van State gehoord (advies van 3 november 2003, nr. W08.03.0324/V);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van
    14 januari 2004, nr. MJZ2004002938, Centrale Directie Juridische Zaken, Afdeling Wetgeving, uitgebracht in
    overeenstemming met Onze Minister van Verkeer en Waterstaat;

    Hebben goedgevonden en verstaan:
