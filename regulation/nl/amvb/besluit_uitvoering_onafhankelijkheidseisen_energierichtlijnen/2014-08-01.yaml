$id: besluit_uitvoering_onafhankelijkheidseisen_energierichtlijnen
regulatory_layer: AMVB
publication_date: '2025-11-12'
valid_from: '2014-08-01'
bwb_id: BWBR0031810
url: https://wetten.overheid.nl/BWBR0031810/2014-08-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Minister van Economische Zaken, Landbouw en Innovatie van 12 april 2012, nr. WJZ /
    12047118);

    Gelet op artikel 9 van richtlijn 2009/72/EG van het Europees Parlement en de Raad van 13 juli 2009 betreffende
    gemeenschappelijke regels voor de interne markt voor elektriciteit en artikel 9 van richtlijn 2009/73/EG van het
    Europees Parlement en de Raad van 13 juli 2009 betreffende gemeenschappelijke regels voor de interne markt voor
    aardgas en de artikelen 10Aa, zevende lid, en 10b, vijfde lid, van de Elektriciteitswet 1998, en 2b, zesde lid, 2c,
    vijfde lid, en 9b, tweede lid, van de Gaswet;

    De Afdeling advisering van de Raad van State gehoord (advies van 3 mei 2012, nr. W15.12.0120/IV);

    Gezien het nader rapport van Onze Minister van Economische Zaken, Landbouw en Innovatie van 9 juli 2012, nr. WJZ /
    12062418);

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0031810/2014-08-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0031810/2014-08-01#Artikel1
  - number: 1.1.a
    text: |-
      *interconnector-beheerder elektriciteit of gas:* een interconnector-beheerder als bedoeld in
      [artikel 1, eerste lid, onder at, van de Elektriciteitswet 1998][ref1] en [artikel 2b van de Gaswet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel2b
    url: https://wetten.overheid.nl/BWBR0031810/2014-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 2b
  - number: 1.1.b
    text: |-
      *zeggenschap:* rechten, overeenkomsten of andere middelen die, afzonderlijk of tezamen, met inachtneming van
      alle feitelijke of juridische omstandigheden, het mogelijk maken een beslissende invloed uit te oefenen op de
      activiteiten van een onderneming, met name:
    url: https://wetten.overheid.nl/BWBR0031810/2014-08-01#Artikel1
  - number: 1.1.b.1°
    text: eigendoms- of gebruiksrechten op alle vermogensbestanddelen van een onderneming of delen daarvan;
    url: https://wetten.overheid.nl/BWBR0031810/2014-08-01#Artikel1
  - number: 1.1.b.2
    text: |-
      rechten of overeenkomsten die een beslissende invloed verschaffen op de samenstelling, het stemgedrag of de
      besluiten van de organen van een onderneming.
    url: https://wetten.overheid.nl/BWBR0031810/2014-08-01#Artikel1
  - number: '1.2'
    text: |-
      In dit besluit wordt onder enig recht in ieder geval verstaan het recht om stemrechten uit te oefenen, de
      bevoegdheid om leden aan te wijzen van de Raad van Bestuur, de raad van toezicht of een rechtspersoon die het
      bedrijf juridisch vertegenwoordigt of het hebben van een meerderheidsaandeel.
    url: https://wetten.overheid.nl/BWBR0031810/2014-08-01#Artikel1
  - number: '2.1'
    text: |-
      Natuurlijke personen, rechtspersonen en vennootschappen oefenen geen directe of indirecte zeggenschap uit over
      een rechtspersoon of vennootschap die elektriciteit of gas produceert, levert of daarin handelt en, gelijktijdig,
      directe of indirecte zeggenschap of enig recht uit over de netbeheerder van het landelijk hoogspanningsnet, de
      netbeheerder van het landelijk gastransportnet, een interconnector-beheerder elektriciteit of gas, of diens netten.
    url: https://wetten.overheid.nl/BWBR0031810/2014-08-01#Artikel2
  - number: '2.2'
    text: |-
      Natuurlijke personen, rechtspersonen en vennootschappen oefenen geen directe of indirecte zeggenschap uit over
      de netbeheerder van het landelijk hoogspanningsnet, de netbeheerder van het landelijk gastransportnet, een
      interconnector-beheerder elektriciteit of gas, of diens netten en, gelijktijdig, directe of indirecte zeggenschap
      of enig recht uit over een rechtspersoon of vennootschap die elektriciteit of gas produceert, levert of daarin
      handelt.
    url: https://wetten.overheid.nl/BWBR0031810/2014-08-01#Artikel2
  - number: '3'
    text: |-
      Indien de netbeheerder van het landelijk hoogspanningsnet of de netbeheerder van het landelijk gastransportnet,
      of een interconnector-beheerder, deelneemt aan een gemeenschappelijke onderneming, waaraan ook een of meer
      buitenlandse instellingen deelnemen die op grond van nationale wettelijke regels zijn belast met het beheer van
      een transmissiesysteem als bedoeld in artikel 2, onderdeel 4, van de richtlijnen, dan is het niet noodzakelijk dat
      die gemeenschappelijke onderneming beschikt over de eigendom van het landelijk hoogspanningsnet of het landelijk
      gastransportnet.
    url: https://wetten.overheid.nl/BWBR0031810/2014-08-01#Artikel3
  - number: '4.1'
    text: |-
      Indien een gasopslagbedrijf voldoet aan de voorwaarden, bedoeld in
      [artikel 9b, eerste lid, onderdelen a en b, van de Gaswet][ref1], dan dient dit bedrijf eveneens te voldoen aan de
      volgende eisen:


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel9b
    url: https://wetten.overheid.nl/BWBR0031810/2014-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 9b
  - number: 4.1.a
    text: |-
      de personen die verantwoordelijk zijn voor het beheer van het gasopslagbedrijf nemen niet deel in
      bedrijfsstructuren van het geïntegreerde gasbedrijf die direct of indirect verantwoordelijk zijn voor het
      dagelijkse beheer van de productie en levering van aardgas;
    url: https://wetten.overheid.nl/BWBR0031810/2014-08-01#Artikel4
  - number: 4.1.b
    text: |-
      er moeten passende maatregelen worden genomen zodat personen die verantwoordelijk zijn voor het beheer van het
      gasopslagbedrijf onafhankelijk kunnen functioneren;
    url: https://wetten.overheid.nl/BWBR0031810/2014-08-01#Artikel4
  - number: 4.1.c
    text: |-
      het gasopslagbedrijf heeft effectieve beslissingsbevoegdheid, onafhankelijk van het geïntegreerde gasbedrijf,
      wat de activa betreft die noodzakelijk zijn voor de exploitatie, het onderhoud en de ontwikkeling van de
      opslaginstallaties;
    url: https://wetten.overheid.nl/BWBR0031810/2014-08-01#Artikel4
  - number: 4.1.d
    text: |-
      het gasopslagbedrijf heeft een nalevingprogramma met maatregelen die moeten worden genomen om discriminerend en
      concurrentieverstorend gedrag uit te sluiten. Het nalevingsprogramma bevat de specifieke verplichtingen van de
      werknemers ter verwezenlijking van die doelstellingen.
    url: https://wetten.overheid.nl/BWBR0031810/2014-08-01#Artikel4
  - number: '4.2'
    text: |-
      Een gasbedrijf overlegt een verslag over de uitvoering van het nalevingsprogramma, bedoeld in het eerste lid, onder
      d, jaarlijks aan de Autoriteit Consument en Markt en publiceert dit verslag jaarlijks op geschikte wijze.
    url: https://wetten.overheid.nl/BWBR0031810/2014-08-01#Artikel4
  - number: '5'
    text: 'Dit besluit wordt aangehaald als: Besluit uitvoering onafhankelijkheidseisen energierichtlijnen.'
    url: https://wetten.overheid.nl/BWBR0031810/2014-08-01#Artikel5
  - number: '6'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0031810/2014-08-01#Artikel6
