  - number: '3'
    text: |-
      1 De gegevens, bedoeld in [artikel 2, onderdeel f][ref1], zijn:

      a. een opgave van de naam, de geboortedatum, de geboorteplaats, de nationaliteit, het privé-adres, het telefoon- en
      faxnummer en de functie;

      b. een curriculum vitae;

      c. een opgave van de relevante diploma’s;

      d. een kopie van een geldig identiteitsbewijs; en

      e. een opgave van referenten.

      2 Het [artikel 2, onderdelen g en l, onder 2°][ref2], is niet van toepassing ten aanzien van personen wier
      betrouwbaarheid voor de toepassing van de [wet][ref3] door een toezichthouder reeds is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0022748#Artikel2
