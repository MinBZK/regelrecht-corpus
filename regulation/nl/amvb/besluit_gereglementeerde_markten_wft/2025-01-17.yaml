  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Financiën van 5 oktober 2007, nr. FM 2007-2455 M;

    Gelet op richtlijn nr. 2004/39EG van het Europees Parlement en de Raad van de Europese Unie van 21 april 2004
    betreffende markten voor financiële instrumenten, tot wijziging van de richtlijnen nr. 85/611/EEG en 93/6/EEG van
    de Raad en van richtlijn nr. 2000/12/EG van het Europees Parlement en de Raad en houdende intrekking van Richtlijn
    93/22/EEG van de Raad (PbEU L 145) en richtlijn nr. 2006/73/EG van de Commissie van de Europese Gemeenschappen
    van 10 augustus 2006 tot uitvoering van Richtlijn 2004/39/EG van het Europees Parlement en de Raad wat betreft de
    door beleggingsondernemingen in acht te nemen organisatorische eisen en voorwaarden voor de bedrijfsuitoefening
    en wat betreft de definitie van begrippen voor de toepassing van genoemde richtlijn (PbEU L 241) alsmede de
    artikelen 3:17, tweede lid, aanhef en onderdeel c, 4:11, derde lid, 4:14, tweede lid, 4:16, tweede en derde lid,
    4:18c, vierde lid, 4:19, vierde lid, 4:20, eerste, tweede, derde en vierde lid, 4:22, eerste lid, 4:23, derde lid,
    onderdelen a en b, 4:24, vierde lid, onderdeel e, en vijfde lid, 4:25, eerste lid, 4:87, derde lid, 4:88, derde
    lid, 4:90, tweede lid, 4:90b, tiende lid, 4:90d, en vierde lid, 5:27, tweede en vijfde lid, van de Wet op het
    financieel toezicht;

    De Raad van State gehoord (advies van 17 oktober 2007, no. W06.07.0368/III);

    Gezien het nader rapport van Onze Minister van Financiën van 19 oktober 2007, FM 2007-2645 M;

    Hebben goedgevonden en verstaan:
