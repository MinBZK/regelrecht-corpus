  - number: 4a
    text: |-
      Een marktexploitant is, mede voor de toepassing van [artikel 5:29a, eerste lid, van de wet][ref1], significant
      indien hij door de Autoriteit Financiële Markten, gelet op zijn omvang, interne organisatie en aard, schaal en
      complexiteit van werkzaamheden als significant wordt aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel529a
    url: https://wetten.overheid.nl/BWBR0022748/2025-01-17#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 5:29a
  - number: 4b
    text: |-
      De systemen, procedures en regelingen, bedoeld in [artikel 5:30a, tweede lid, van de wet][ref1], zijn in staat om:

      a. de verhouding tussen het aantal niet-uitgevoerde orders en het aantal transacties dat door een deelnemer of lid
      in het handelssysteem kan worden ingevoerd te beperken;

      b. de orderstroom af te remmen indien het risico bestaat dat de systeemcapaciteit wordt bereikt; en

      c. de minimale verhandelingseenheid op de gereglementeerde markt te beperken en te handhaven.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel530a
    url: https://wetten.overheid.nl/BWBR0022748/2025-01-17#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 5:30a
  - number: 4c
    text: |-
      De parameters, bedoeld in [artikel 5:30a, derde lid, van de wet][ref1], houden rekening met de liquiditeit van
      de verschillende categorieën activa, de aard van het marktmodel en de soorten gebruikers en zijn geschikt om
      aanzienlijke verstoringen van de ordelijke werking van de gereglementeerde markt te voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel530a
    url: https://wetten.overheid.nl/BWBR0022748/2025-01-17#Artikel4c
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 5:30a
  - number: 4d
    text: |-
      De overeenkomst, bedoeld in [artikel 5:30b, eerste lid, onderdeel a, van de wet][ref1] bepaalt in ieder geval dat:

      a. de verplichtingen van de beleggingsonderneming waaronder de verplichtingen van de beleggingsonderneming met
      betrekking tot de liquiditeitsverschaffing op de gereglementeerde markt; en

      b. de kortingen of andere voordelen die de gereglementeerde markt aan een beleggingsonderneming biedt om de
      gereglementeerde markt op regelmatige en voorspelbare basis van liquiditeit te voorzien en eventuele andere rechten
      van de beleggingsonderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel530b
    url: https://wetten.overheid.nl/BWBR0022748/2025-01-17#Artikel4d
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 5:30b
  - number: 4e
    text: |-
      1

      De regelingen, bedoeld in [artikel 5:30d, eerste lid, van de wet][ref1] zijn:

      a. afgestemd op het liquiditeitsprofiel van het desbetreffende financieel instrument op verschillende markten en op
      het gemiddelde verschil tussen de biedprijzen en laatprijzen en houden rekening met de wenselijkheid van redelijk
      stabiele prijzen, waarbij de verdere verkleining van het verschil tussen de biedprijzen en laatprijzen niet onnodig
      wordt beperkt; en

      b. zo opgezet dat de omvang van de minimale verhandelingseenheid is afgestemd op elk afzonderlijk financieel
      instrument.

      2 Toepassing van de regelingen, bedoeld in [artikel 5:30d, eerste lid, van de wet][ref2], belet niet dat
      gereglementeerde markten orders die aanzienlijk van omvang zijn matchen op de mid-point van de actuele biedprijzen
      en laatprijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel530d
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel530d
    url: https://wetten.overheid.nl/BWBR0022748/2025-01-17#Artikel4e
