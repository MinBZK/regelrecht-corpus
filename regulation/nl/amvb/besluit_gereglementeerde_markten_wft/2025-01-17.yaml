articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder wet: [Wet op het financieel toezicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0022748/2025-01-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '2'
    text: |-
      De gegevens, bedoeld in [artikel 5:27, tweede lid, van de wet][ref1] zijn:

      a. een opgave van de naam, het adres en het telefoon- en faxnummer van de marktexploitant;

      b. indien de marktexploitant een rechtspersoon is, een opgave van de statutaire zetel, de statutaire naam en de
      handelsnaam of handelsnamen;

      c. indien de marktexploitant is ingeschreven in het handelsregister, een opgave van het nummer van inschrijving;

      d. indien aanwezig, een gewaarmerkt afschrift van de statuten;

      e. een opgave van activiteiten die de marktexploitant voornemens is te verrichten;

      f. gegevens op basis waarvan de Autoriteit Financiële Markten kan beoordelen of voldaan wordt aan
      [artikel 5:29, eerste lid, van de wet][ref2];

      g. gegevens op basis waarvan de Autoriteit Financiële Markten kan beoordelen of voldaan wordt aan
      [artikel 5:29, tweede lid, van de wet][ref3];

      h. een beschrijving van de regels van de gereglementeerde markt, bedoeld in de [artikelen 5:30][ref4] en
      [5:32, eerste lid, van de wet][ref5];

      i. gegevens op basis waarvan de Autoriteit Financiële Markten kan beoordelen of voldaan wordt aan hetgeen ingevolge
      [artikel 5:30, aanhef en onderdeel f, van de wet][ref6] is bepaald met betrekking tot de financiële middelen om een
      ordelijke werking van de gereglementeerde markt te bevorderen;

      j. gegevens op basis waarvan de Autoriteit Financiële Markten kan beoordelen of voldaan wordt aan de
      [artikelen 5:30a, tweede en derde lid][ref7], [5:30b, eerste lid][ref8], [5:30c, eerste lid][ref9],
      [5:30d, eerste lid en ][ref10][5:30e, eerste lid, van de wet][ref11];

      k. een beschrijving van de regels inzake de toelating van financiële instrumenten tot de handel op de
      gereglementeerde markt, bedoeld in [artikel 5:32a, eerste lid, onderdeel a, van de wet][ref12];

      l. een beschrijving van de regels inzake de toegang tot de handel op of het lidmaatschap van de gereglementeerde
      markt, bedoeld in [artikel 5:32b, van de wet][ref13]; en

      m. indien van toepassing:

      1°. een opgave van de omvang van een gekwalificeerde deelneming als bedoeld in [artikel 5:32d van de wet][ref14] in
      een aanvrager, bedoeld in [artikel 5:27, eerste lid, van de wet][ref15];

      2°. gegevens op basis waarvan de Autoriteit Financiële Markten of, in voorkomend geval, de Minister van Financiën
      kan beoordelen of voldaan wordt aan hetgeen is bepaald met betrekking tot de betrouwbaarheid van de houder van een
      gekwalificeerde deelneming in de aanvrager die op grond hiervan het beleid van de betrokken onderneming zou kunnen
      bepalen of mede bepalen of zou bepalen of mede bepalen; en

      3°. bescheiden waaruit de financiële positie en de juridische groepsstructuur van de houder van een gekwalificeerde
      deelneming in de aanvrager blijken.


