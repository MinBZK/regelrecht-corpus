---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_meldingplichtige_bouwwerken
regulatory_layer: AMVB
publication_date: '2002-08-08'
valid_from: '2000-04-03'
bwb_id: BWBR0005495
url: https://wetten.overheid.nl/BWBR0005495/2000-04-03
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 6 maart
    1992, nr. MJZ06392031, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Gelet op artikel 42, eerste lid, van de Woningwet (Stb. 1991, 439) en artikel 18a van de Wet op de Ruimtelijke
    Ordening (Stb. 1985, 626);

    De Raad van State gehoord (advies van 22 april 1992, no. W08.92.0109);

    Gezien het nader rapport van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 23
    april 1992, nr. MJZ 23492070, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005495/2000-04-03#ArtikelAanhef
articles:
  - number: '1'
    text: 'Voor de toepassing van de bij dit besluit gegeven voorschriften wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005495/2000-04-03#Artikel1
  - number: 1.a
    text: 'NEN: door de Stichting Nederlands Normalisatie-Instituut uitgegeven norm;'
    url: https://wetten.overheid.nl/BWBR0005495/2000-04-03#Artikel1
  - number: 1.b
    text: 'bruto-inhoud: bruto-inhoud als bedoeld in NEN 2580.'
    url: https://wetten.overheid.nl/BWBR0005495/2000-04-03#Artikel1
  - number: '2'
    text: |-
      Voor de toepassing van [artikel 42 van de Woningwet][ref1] komen in aanmerking:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel42
    url: https://wetten.overheid.nl/BWBR0005495/2000-04-03#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '42'
  - number: 2.a
    text: |-
      een gebouw op een zij- of achtererf van een woning of een ander gebouw dan wel op een standplaats, ten dienste
      van een groter genot van het gebruik van die woning, dat andere gebouw dan wel de op die standplaats geplaatste
      woonwagen, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0005495/2000-04-03#Artikel2
  - number: 2.a.1°
    text: de bruto-inhoud niet meer is dan 50 m3;
    url: https://wetten.overheid.nl/BWBR0005495/2000-04-03#Artikel2
  - number: 2.a.2°
    text: de breedte niet meer is dan 3 m;
    url: https://wetten.overheid.nl/BWBR0005495/2000-04-03#Artikel2
  - number: 2.a.3°
    text: de hoogte, gemeten vanaf het aansluitend terrein, niet meer is dan 2,7 m;
    url: https://wetten.overheid.nl/BWBR0005495/2000-04-03#Artikel2
  - number: 2.a.4°
    text: de afstand tot de voorgevelrooilijn ten minste 3 m is, en
    url: https://wetten.overheid.nl/BWBR0005495/2000-04-03#Artikel2
  - number: 2.a.5°
    text: |-
      de toevoeging van het gebouw niet tot gevolg mag hebben dat het oorspronkelijk bij de woning of het andere gebouw
      aansluitende terrein dan wel het bij de woonwagen aansluitende deel van de standplaats voor meer dan 50% is
      bebouwd;
    url: https://wetten.overheid.nl/BWBR0005495/2000-04-03#Artikel2
  - number: 2.b
    text: 'een aan- of uitbouw aan een zij- of achtergevel van een woning of een ander gebouw, met dien verstande dat:'
    url: https://wetten.overheid.nl/BWBR0005495/2000-04-03#Artikel2
  - number: 2.b.1°
    text: de bruto-inhoud niet meer is dan 50 m3;
    url: https://wetten.overheid.nl/BWBR0005495/2000-04-03#Artikel2
  - number: 2.b.2°
    text: de breedte niet meer is dan 3 m;
    url: https://wetten.overheid.nl/BWBR0005495/2000-04-03#Artikel2
  - number: 2.b.3°
    text: de hoogte, gemeten vanaf het aansluitend terrein, niet meer is dan 2,7 m;
    url: https://wetten.overheid.nl/BWBR0005495/2000-04-03#Artikel2
  - number: 2.b.4°
    text: de afstand tot de voorgevelrooilijn ten minste 3 m is, en
    url: https://wetten.overheid.nl/BWBR0005495/2000-04-03#Artikel2
  - number: 2.b.5°
    text: |-
      de oppervlakte die ingevolge het geldende bestemmingsplan voor bebouwing in aanmerking komt, met niet meer dan 15%
      wordt overschreden;
    url: https://wetten.overheid.nl/BWBR0005495/2000-04-03#Artikel2
  - number: 2.c
    text: 'een dakkapel, voor zover gelegen op het achterdakvlak, met dien verstande dat:'
    url: https://wetten.overheid.nl/BWBR0005495/2000-04-03#Artikel2
  - number: 2.c.1°
    text: de breedte niet meer dan ½ van de breedte van het dakvlak beslaat;
    url: https://wetten.overheid.nl/BWBR0005495/2000-04-03#Artikel2
  - number: 2.c.2°
    text: de bovenzijde ten minste 0,5 m onder de noklijn is gelegen, en
    url: https://wetten.overheid.nl/BWBR0005495/2000-04-03#Artikel2
  - number: 2.c.3°
    text: de onderzijde in het dakvlak is geplaatst;
    url: https://wetten.overheid.nl/BWBR0005495/2000-04-03#Artikel2
  - number: 2.d
    text: |-
      een gebouw ten behoeve van een openbare nutsvoorziening, het openbaar vervoer of het wegverkeer, met dien verstande
      dat:
    url: https://wetten.overheid.nl/BWBR0005495/2000-04-03#Artikel2
  - number: 2.d.1°
    text: de bruto-inhoud niet meer is dan 50 m3;
    url: https://wetten.overheid.nl/BWBR0005495/2000-04-03#Artikel2
  - number: 2.d.2°
    text: de breedte niet meer is dan 3 m, en
    url: https://wetten.overheid.nl/BWBR0005495/2000-04-03#Artikel2
  - number: 2.d.3°
    text: de hoogte, gemeten vanaf het aansluitend terrein, niet meer is dan 2,7 m;
    url: https://wetten.overheid.nl/BWBR0005495/2000-04-03#Artikel2
  - number: 2.e
    text: |-
      een bouwwerk, geen gebouw zijnde, ten behoeve van het ontvangen van telecommunicatiesignalen met een grotere
      doorsnede dan 1 m, voor zover gelegen op het achtererf van een woning of een ander gebouw, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0005495/2000-04-03#Artikel2
  - number: 2.e.1°
    text: de doorsnede niet groter is dan 2 m, en
    url: https://wetten.overheid.nl/BWBR0005495/2000-04-03#Artikel2
  - number: 2.e.2°
    text: de hoogte, gemeten vanaf het aansluitende terrein, niet meer is dan 3 m;
    url: https://wetten.overheid.nl/BWBR0005495/2000-04-03#Artikel2
  - number: 2.f
    text: |-
      een bouwwerk, geen gebouw zijnde, voor wegaanduiding en verkeersgeleiding ten dienste van het weg-, spoorweg-,
      water- of luchtverkeer, voor zover dat bouwwerk niet een bouwwerk is als bedoeld in artikel 43, eerste lid,
      onderdeel *f*, van de [Woningwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0005495/2000-04-03#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: 2.g
    text: het aanbrengen van zonwering of een rolluik aan een woning of een ander gebouw.
    url: https://wetten.overheid.nl/BWBR0005495/2000-04-03#Artikel2
  - number: '3'
    text: |-
      [Artikel 2][ref1] is niet van toepassing, indien een bouwwerk als bedoeld in dat artikel wordt gebouwd aan, bij of
      op een monument als bedoeld in de [Monumentenwet 1988][ref2] (*Stb.* 638) of in een provinciale of gemeentelijke
      monumentenverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0005495#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004471
    url: https://wetten.overheid.nl/BWBR0005495/2000-04-03#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005495
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004471
  - number: '5'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0005495/2000-04-03#Artikel5
  - number: '6'
    text: Dit besluit kan worden aangehaald als Besluit meldingplichtige bouwwerken.
    url: https://wetten.overheid.nl/BWBR0005495/2000-04-03#Artikel6
