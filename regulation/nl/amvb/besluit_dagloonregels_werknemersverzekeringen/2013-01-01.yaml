preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 1 juni 2005, Directie Sociale
    Verzekeringen, nr. SV/F&W/05/38929;

    Gelet op de artikelen 15, tweede lid, van de Ziektewet, 14, tweede lid, van de Wet op de
    arbeidsongeschiktheidsverzekering, 13, derde lid, van de Wet werk en inkomen naar arbeidsvermogen, en 45, tweede
    lid, van de Werkloosheidswet;

    De Raad van State gehoord (advies van 7 juli 2005, nr. W12.05.0218/IV);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid van 5 oktober 2005, Directie
    Sociale Verzekeringen, nr. SV/F&W/05/76328;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0018842/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. *ZW*: [Ziektewet][ref1];

      b. *WAO*: [Wet op de arbeidsongeschiktheidsverzekering][ref2];

      c. *WW*: [Werkloosheidswet][ref3];

      d. *Wet WIA*: [Wet werk en inkomen naar arbeidsvermogen][ref4];

      e. *WML*: [Wet minimumloon en minimumvakantiebijslag][ref5];

      f. *ZW-dagloon*: het dagloon, bedoeld in [artikel 15, eerste lid, van de ZW][ref6];

      g. *WAO*-dagloon: het dagloon, bedoeld in [artikel 14, eerste lid, van de WAO][ref7];

      h. *WIA*-dagloon: het dagloon, bedoeld in [artikel 13, eerste lid, van de Wet WIA][ref8];

      i. *WW-dagloon*: het dagloon, bedoeld in [artikel 45, eerste lid, van de WW][ref9];

      j. *loon*: het loon, bedoeld in
      [hoofdstuk 3, afdeling 1, paragraaf 1, van de Wet financiering sociale verzekeringen][ref10],
      met uitzondering van het eindheffingsbestanddeel, bedoeld in
      [artikel 31, eerste lid, onderdeel a, van de Wet op de loonbelasting 1964][ref11] ten aanzien
      waarvan de werkgever met toestemming van de inspecteur van de rijksbelastingdienst geen
      correctiebericht als bedoeld in [artikel 28a van die wet][ref12] heeft ingediend en met
      uitzondering van een uitkering die de werknemer heeft genoten op grond van de aanspraak, bedoeld in
      [artikel 39d, tweede lid of derde lid, van de Wet op de loonbelasting 1964][ref13], zonder dat er sprake is van
      onbetaald extra verlof;

      k. *dagloondagen*: maandag tot en met vrijdag;

      l. *aanvullingen*: de aanvullingen, bedoeld in
      [artikel 16, tweede lid, onderdeel a, onder 1°, van de Wet financiering sociale verzekeringen][ref14];

      m. *arbeidsongeschikt(heid)*: ongeschikt(heid) tot het verrichten van zijn of haar arbeid, bedoeld
      in [artikel 19, eerste en tweede lid, van de ZW][ref15], arbeidsongeschikt(heid), bedoeld in
      [artikel 18, eerste lid, van de WAO][ref16] of volledige en gedeeltelijke arbeidsgeschikt(heid), bedoeld in
      [artikel 46 van de Wet WIA][ref17];

      n. *arbeidsurenverlies*: het arbeidsurenverlies, bedoeld in [artikel 16, eerste lid, van de WW][ref18];

      o. *aangiftetijdvak*: het tijdvak van vier weken dan wel één maand waarop de aangifte waarop de ingehouden
      loonbelasting wordt afgedragen, betrekking heeft;

      p. *gebroken aangiftetijdvak*: een aangiftetijdvak dat deels binnen en deels buiten het refertejaar valt;

      q. *refertejaar*: de periode van één jaar die eindigt op de laatste dag van het aangiftetijdvak voorafgaande
      aan het aangiftetijdvak waarin de arbeidsongeschiktheid dan wel het arbeidsurenverlies is ingetreden, of die
      eindigt, in geval de arbeidsongeschiktheid als bedoeld in de [WAO][ref19] of de [Wet WIA][ref20] is ingetreden in
      gelijktijdige dienstbetrekkingen, op de laatste dag van het aangiftetijdvak dat het eerst voor het intreden van de
      arbeidsongeschiktheid is geëindigd;

      r. minimumloon: het minimumloon per maand, bedoeld in [artikel 8, eerste lid, onderdeel a, van de WML][ref21],
      gedeeld door 21,75;

      s. *minimumjeugdloonpercentage*: een percentage als bedoeld in [artikel 8, derde lid, van de WML][ref22];

      t. *verlof*: een tussen de werkgever en werknemer voor een gedeelte of het geheel van de arbeidstijd overeengekomen
      periode van verlof, waarin de werknemer geen arbeid jegens de werkgever verricht;

      u. *WAO-vervolgdagloon*: het vervolgdagloon, bedoeld in [artikel 21b van de WAO][ref23].

      2 In dit besluit wordt onder vakantiebijslag niet verstaan vakantiebijslag voldaan overeenkomstig
      [artikel 18, eerste lid, van de WML][ref24].

      3 [Artikel 40, tweede lid, van de WAO][ref25] is voor de bepaling van het refertejaar, bedoeld in het eerste lid,
      onderdeel q, van overeenkomstige toepassing.

      4 Indien op de dag, bedoeld in [artikel 54, tweede lid, van de Wet WIA][ref26] geen recht op een
      werkhervattingsuitkering gedeeltelijk arbeidsgeschikten als bedoeld in [hoofdstuk 7 van de Wet WIA][ref27], is
      ontstaan omdat de werknemer op die dag niet gedeeltelijk arbeidsgeschikt is, en op die dag, of op een eerdere
      dag als gevolg van het eindigen van de dienstbetrekking, een arbeidsurenverlies is ingetreden, wordt voor de
      bepaling van het refertejaar in aanmerking genomen: de periode van één jaar die eindigt op de laatste dag van het
      aangiftetijdvak voorafgaande aan het aangiftetijdvak waarin de arbeidsongeschiktheid is ingetreden. De in de eerste
      zin bedoelde periode van één jaar eindigt, in geval de arbeidsongeschiktheid als bedoeld in de [WAO][ref28] of de
      [Wet WIA][ref29] is ingetreden in gelijktijdige dienstbetrekkingen, op de laatste dag van het aangiftetijdvak dat
      het eerst voor het intreden van de arbeidsongeschiktheid is geëindigd.


