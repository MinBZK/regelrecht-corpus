    text: |-
      Het WW-dagloon van de werknemer, die in privaatrechtelijke of publiekrechtelijke dienstbetrekking staat, en die
      recht heeft op uitkering:

      a. op grond van [artikel 18 van de WW][ref1]; of

      b. op grond van werkloosheid die verband houdt met een verleende ontheffing krachtens
      [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref2],

      wordt vastgesteld overeenkomstig [artikel 11][ref3], waarbij het arbeidsongeschikt worden of het intreden van
      arbeidsongeschiktheid wordt aangemerkt als het intreden van arbeidsurenverlies.


