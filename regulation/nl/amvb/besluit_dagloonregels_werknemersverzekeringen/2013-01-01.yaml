  - number: '11'
    text: |-
      1 Het ZW-dagloon van de werknemer, bedoeld in de [artikelen 29b][ref1] en [29d van de ZW][ref2], is, in afwijking
      van [artikel 3, eerste lid][ref3], de uitkomst van de volgende berekening:

      ((A – B – C) + D + E) / F

      waarbij:

      A staat voor het loon dat de werknemer, uit de dienstbetrekking waarin hij wegens ziekte arbeidsongeschikt
      is geworden, heeft genoten in het laatste aangiftetijdvak voorafgaande aan het aangiftetijdvak waarin die
      arbeidsongeschiktheid is ingetreden;

      B staat voor de bedragen aan vakantiebijslag die de werknemer, uit de dienstbetrekking waarin hij wegens ziekte
      arbeidsongeschikt is geworden, onder die titel in dat laatste aangiftetijdvak heeft genoten;

      C staat voor de bedragen die de werknemer, uit de dienstbetrekking waarin hij wegens ziekte arbeidsongeschikt is
      geworden, in dat laatste aangiftetijdvak onder die titel heeft genoten aan uitkeringen die het karakter hebben van
      een extra periodiek salaris;

      D staat voor het bedrag dat de werknemer, uit de dienstbetrekking waarin hij wegens ziekte arbeidsongeschikt is
      geworden, in dat laatste aangiftetijdvak heeft opgebouwd aan vakantiebijslag;

      E staat voor het bedrag dat de werknemer, uit de dienstbetrekking waarin hij wegens ziekte arbeidsongeschikt is
      geworden, in dat laatste aangiftetijdvak heeft opgebouwd aan uitkeringen als bedoeld onder C;

      F staat voor het aantal dagloondagen in dat laatste aangiftetijdvak binnen de dienstbetrekking waarin hij
      wegens ziekte arbeidsongeschikt is geworden, dan wel indien het een aangiftetijdvak van een maand betreft en de
      betreffende dienstbetrekking dat gehele tijdvak heeft geduurd, voor 21,75.

      2 Het dagloon van de werknemer, bedoeld in het eerste lid, die in het laatste aangiftetijdvak voorafgaande aan het
      aangiftetijdvak waarin hij wegens ziekte arbeidsongeschikt is geworden niet in de dienstbetrekking stond waaruit
      hij arbeidsongeschikt is geworden, is, in afwijking van [artikel 3, eerste lid][ref4], de uitkomst van de volgende
      berekening:

      ((A – B – C) + D + E) / F

      waarbij:

      A staat voor het loon dat de werknemer, uit de dienstbetrekking waarin hij wegens ziekte arbeidsongeschikt is
      geworden, voorafgaande aan het intreden van die arbeidsongeschiktheid heeft genoten in het aangiftetijdvak waarin
      die arbeidsongeschiktheid is ingetreden;

      B staat voor de bedragen aan vakantiebijslag die de werknemer, uit de dienstbetrekking waarin hij wegens ziekte
      arbeidsongeschikt is geworden, voorafgaande aan het intreden van die arbeidsongeschiktheid, onder die titel in dat
      aangiftetijdvak heeft genoten;

      C staat voor de bedragen die de werknemer, uit de dienstbetrekking waarin hij wegens ziekte arbeidsongeschikt is
      geworden, voorafgaande aan het intreden van die arbeidsongeschiktheid, in dat aangiftetijdvak heeft genoten aan
      uitkeringen die het karakter hebben van een extra periodiek salaris;

      D staat voor het bedrag dat de werknemer, uit de dienstbetrekking waarin hij wegens ziekte arbeidsongeschikt is
      geworden, voorafgaande aan het intreden van die arbeidsongeschiktheid, in dat aangiftetijdvak heeft opgebouwd aan
      vakantiebijslag;

      E staat voor het bedrag dat de werknemer, uit de dienstbetrekking waarin hij wegens ziekte arbeidsongeschikt is
      geworden, voorafgaande aan het intreden van die arbeidsongeschiktheid, in dat aangiftetijdvak heeft opgebouwd aan
      uitkeringen als bedoeld onder C;

      F staat voor het aantal dagloondagen in dat aangiftetijdvak in de dienstbetrekking waarin hij wegens ziekte
      arbeidsongeschikt is geworden, voorafgaande aan het intreden van die arbeidsongeschiktheid wegens ziekte.

      3 Indien bij de toepassing van het tweede lid F nul is, is het dagloon in afwijking van het tweede lid, de uitkomst
      van de volgende berekening:

      A / B

      waarbij:

      A staat voor het overeengekomen loon van de werknemer in de dienstbetrekking waarin hij wegens ziekte
      arbeidsongeschikt tot het verrichten van werkzaamheden is geworden over het aangiftetijdvak waarin die
      arbeidsongeschiktheid is ingetreden;

      B staat voor het aantal dagloondagen in het aangiftetijdvak waarin de arbeidsongeschiktheid is ingetreden, dan wel
      indien het een aangiftetijdvak van een maand betreft, voor 21,75.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29b
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel29d
      [ref3]: https://wetten.overheid.nl/BWBR0018842#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0018842#Artikel3
