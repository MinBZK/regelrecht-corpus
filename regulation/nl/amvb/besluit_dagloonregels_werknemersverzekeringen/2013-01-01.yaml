  - number: '17'
    text: |-
      1 Het WW-dagloon van de werknemer die binnen 24 maanden na de dag van beëindiging van een eerdere dienstbetrekking
      een andere dienstbetrekking is aangegaan, wordt, bij beëindiging van deze nieuwe dienstbetrekking binnen 36
      maanden na die eerdere beëindiging, niet lager vastgesteld dan op het WW-dagloon dat gold of zou hebben gegolden
      vanwege die eerdere dienstbetrekking. Het dagloon wordt in aanmerking genomen naar de mate waarin de nieuwe
      dienstbetrekking in de plaats is gekomen van de eerdere dienstbetrekking.

      2 De in het eerste lid genoemde termijn van 24 maanden wordt verlengd met in deze periode gelegen perioden van
      arbeidsongeschiktheid.

      3 Het eerste lid is van overeenkomstige toepassing op het vast te stellen WW-dagloon vanwege alle doch binnen
      de termijn van 36 maanden na de dag van beëindiging van de in het eerste lid bedoelde eerdere dienstbetrekking
      aangegane en beëindigde nieuwe dienstbetrekkingen.

      4 Indien de werknemer op de dag van het beëindigen van de eerste dienstbetrekking de leeftijd van 55 jaar had
      bereikt, is de in het eerste en derde lid genoemde termijn van 36 maanden niet van toepassing.

      5 Het eerste lid is niet van toepassing op het vaststellen van het WW-dagloon indien de eerste dienstbetrekking
      is beëindigd:

      a. als gevolg van verwijtbare werkloosheid van de werknemer;

      b. als gevolg van het bereiken van de leeftijd waarop het uit deze dienstbetrekking voortvloeiende
      ouderdomspensioen aanvangt.
    url: https://wetten.overheid.nl/BWBR0018842/2013-01-01#Artikel17
