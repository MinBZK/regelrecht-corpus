  - number: '2'
    text: |-
      1 Voor de toepassing van dit besluit wordt de werknemer geacht zijn loon te hebben genoten in het aangiftetijdvak
      waarover de werkgever van dat loon opgave heeft gedaan.

      2 Voorzover het loon bestaat uit een uitkering op grond van de [ZW][ref1], de [WW][ref2], de [WAO][ref3], de
      [Wet WIA][ref4] of [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref5], wordt bij de berekening
      van het dagloon in de plaats van die uitkering als loon in aanmerking genomen:

      ((100 x A) / B) – (C + D)

      waarbij:

      A staat voor de uitkering op grond van de [ZW][ref6], de [WW][ref7], de [WAO][ref8], de [Wet WIA][ref9] of
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref10];

      B staat voor:

      a. 70, dan wel

      b. indien het uitkeringspercentage van de uitkeringen op grond van de [ZW][ref11], de [WAO][ref12],
      [hoofdstuk 6 van de Wet WIA][ref13], [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref14] of
      [hoofdstuk IV van de WW][ref15] hoger is dan 70%, het uitkeringspercentage waarnaar de uitkering is berekend; of

      c. 100, indien de [artikelen 53][ref16] of [63 van de Wet WIA][ref17] van toepassing zijn, dan wel

      d. indien de teller van de factor, bedoeld in [artikel 53][ref18] of [63 van de wet WIA][ref19] lager is, de waarde
      van die teller;

      C staat voor toeslagen op de uitkering op grond van de [Toeslagenwet][ref20]; en

      D staat voor aanvullingen op de uitkering.

      3 Voorzover het tweede lid van toepassing is wordt, bij de toepassing van [artikel 3][ref21], als genoten
      respectievelijk opgebouwde vakantiebijslag in aanmerking genomen:

      (100 x A) / B

      waarbij:

      A staat voor de in het in aanmerking te nemen tijdvak daadwerkelijk genoten respectievelijk opgebouwde
      vakantiebijslag;

      B gelijk is aan de factor B, bedoeld in het tweede lid.

      4 Onder loon wordt mede begrepen het loon waarvan de werknemer aantoont dat dit in het refertejaar vorderbaar maar
      niet tevens inbaar is geworden. Voor de toepassing van dit besluit wordt de werknemer geacht dit loon te hebben
      genoten in het aangiftetijdvak waarin het vorderbaar is geworden. Indien in het refertejaar een uitkering als
      bedoeld in het tweede lid is genoten, waarbij in het dagloon loon als bedoeld in de eerste zin is meegerekend,
      wordt, indien dat loon in het refertejaar inbaar is geworden, dat loon bij de dagloonberekening buiten beschouwing
      gelaten.

      5 Onder loon worden mede begrepen de inkomsten, bedoeld in [artikel 16, derde lid, van de WW][ref22], waarop
      de werknemer recht heeft in verband met de beëindiging van de dienstbetrekking, voorzover die inkomsten worden
      toegerekend aan perioden die in het refertejaar vallen.

      6 Het loon dat in een gebroken aangiftetijdvak in aanmerking wordt genomen bij de dagloonvaststelling is de
      uitkomst van de volgende berekening:

      ((A – B – C) x Y) / Z

      waarbij:

      A staat voor het totale loon dat de werknemer in dat gebroken aangiftetijdvak heeft genoten;

      B staat voor de bedragen aan vakantiebijslag die de werknemer onder die titel in dat gebroken aangiftetijdvak heeft
      genoten;

      C staat voor de bedragen die de werknemer in dat gebroken aangiftetijdvak onder die titel heeft genoten aan
      uitkeringen die het karakter hebben van een extra periodiek salaris;

      Y staat voor het totale aantal dagloondagen binnen het refertejaar in dat gebroken aangiftetijdvak waarop de
      werknemer bij de werkgever in dienst was;

      Z staat voor het totale aantal dagloondagen in dat gebroken aangiftetijdvak waarop de werknemer bij de werkgever in
      dienst was.

      7 Indien Z nul is wordt de uitkomst van de berekening van het zesde lid op nihil gesteld.


