      Indien aan een wijziging van de [Wet op de loonbelasting 1964][ref1] of een daarop gebaseerde
      regeling terugwerkende kracht is verleend, wordt bij de vaststelling van het dagloon met betrekking
      tot een recht op uitkering dat is ontstaan voor de datum van de inwerkingtreding van die wijziging,
      in afwijking van [artikel 2, eerste lid][ref2], onder loon verstaan het loon dat op grond van
      [hoofdstuk 3, afdeling 1, paragraaf 1, van de Wet financiering sociale verzekeringen][ref3] zou hebben gegolden
      zonder die wijziging.


