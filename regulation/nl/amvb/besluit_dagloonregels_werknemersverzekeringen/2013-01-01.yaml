  - number: '4'
    text: |-
      1 Indien in het refertejaar door de werknemer in een aangiftetijdvak geen loon of minder loon is genoten in
      verband met verlof of omdat hij de bedongen arbeid niet heeft verricht wegens arbeidsongeschiktheid, zwangerschap
      of bevalling, wordt bij het vaststellen van het loon in dat aangiftetijdvak in aanmerking genomen het loon,
      genoten bij dezelfde werkgever in het laatste aan dat verlof of die arbeidsongeschiktheid voorafgaande en in het
      refertejaar gelegen aangiftetijdvak, waarin die situatie zich niet heeft voorgedaan. De eerste zin geldt voorzover
      [artikel 2, tweede lid][ref1], niet van toepassing is.

      2 Indien geen voorafgaand aangiftetijdvak als bedoeld in het eerste lid wordt gevonden, wordt in aanmerking genomen
      het loon bij dezelfde werkgever over het in het refertejaar gelegen aangiftetijdvak, gelegen direct na afloop van
      dat verlof, dan wel die arbeidsongeschiktheid.

      3 Indien noch een laatste aan het verlof of aan de arbeidsongeschiktheid voorafgaand aangiftetijdvak als bedoeld
      in het eerste lid noch een direct na afloop van dat verlof of die arbeidsongeschiktheid gelegen aangiftetijdvak als
      bedoeld in het tweede lid wordt gevonden, wordt voor ieder in het refertejaar gelegen aangiftetijdvak waarin door
      de werknemer geen of minder loon is genoten in verband met de in het eerste lid genoemde omstandigheden, het voor
      dat aangiftetijdvak geldende overeengekomen loon in aanmerking genomen.

      4 Dit artikel blijft buiten toepassing, indien de vaststelling van het loon met toepassing van dit artikel leidt
      tot een lager loon dan de vaststelling van het loon zonder toepassing van dit artikel.


