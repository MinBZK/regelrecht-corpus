  - number: '3'
    text: |-
      1 Het dagloon is de uitkomst van de volgende berekening:

      ((A – B – C) + D + E) / 261

      waarbij:

      A staat voor het loon dat de werknemer in het refertejaar heeft genoten;

      B staat voor de bedragen aan vakantiebijslag die de werknemer onder die titel in de volledige aangiftetijdvakken in
      het refertejaar heeft genoten;

      C staat voor de bedragen die de werknemer in de volledige aangiftetijdvakken in het refertejaar onder die titel
      heeft genoten aan uitkeringen die het karakter hebben van een extra periodiek salaris;

      D staat voor het bedrag dat de werknemer in het refertejaar heeft opgebouwd aan vakantiebijslag;

      E staat voor het bedrag dat de werknemer in het refertejaar heeft opgebouwd aan uitkeringen als bedoeld onder C.

      2 Indien het minimumloon is herzien tussen het einde van het refertejaar en de eerste dag waarop recht
      bestaat op een uitkering op grond van de [ZW][ref1], de[ WW][ref2], de [WAO][ref3], de [Wet WIA][ref4] of
      de[ Wet arbeid en zorg][ref5] wordt de uitkomst van het eerste lid herzien in de mate waarin het minimumloon is
      herzien.


