      1 In afwijking van [artikel 13, tweede tot en met vierde lid][ref1], vindt de evenredige verlaging respectievelijk
      herziening plaats overeenkomstig het tweede lid van dit artikel indien:

      a. de werknemer zijn recht op uitkering op grond van de [WW][ref2] ontleent aan artikel 71, eerste lid, onder
      a ii of b ii, van [verordening (EEG) nr. 1408/71](31971R1408) van de Raad van de Europese gemeenschappen van 14
      juni 1971 betreffende de toepassing van de socialezekerheidsregelingen op loontrekkenden en hun gezinnen, die zich
      binnen de gemeenschap verplaatsen (PbEG L 149);

      b. aan de werknemer op grond van die verordening overeenkomstig de bepalingen van de [WAO][ref3] een
      arbeidsongeschiktheidsuitkering is toegekend, waarvan het bedrag is bepaald naar de verhouding tussen enerzijds de
      duur van de Nederlandse verzekering en anderzijds de totale duur van

      1°. de tijdvakken van Nederlandse verzekering en

      2°. de tijdvakken van verzekering of arbeid, vervuld ingevolge de sociale wetgeving van een andere lidstaat of van
      andere lidstaten; en

      c. de werknemer geen recht heeft op toekenning van een invaliditeitsuitkering van een of meer lidstaten, dan
      wel dergelijke invaliditeitsuitkeringen alle zijn ingetrokken, omdat niet of niet meer wordt voldaan aan de
      openingsvoorwaarden voor het recht op invaliditeitsuitkering.

      2 De evenredige verlaging of herziening vindt plaats door het WAO-dagloon of WAO-vervolgdagloon te vermenigvuldigen
      met de breuk

      (100 – (A x B)) / 100

      waarbij:

      A staat voor het midden van de arbeidsongeschiktheidsklasse die bij de vaststelling of hernieuwde vaststelling in
      acht wordt genomen;

      B staat voor de verhouding, bedoeld in het eerste lid, onderdeel b.


