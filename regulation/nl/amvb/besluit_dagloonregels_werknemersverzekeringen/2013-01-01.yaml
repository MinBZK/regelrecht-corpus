      1 Indien de werknemer op de eerste dag waarop recht bestaat op uitkering op grond van de [ZW][ref1], de
      [Wet WIA][ref2], de [WAO][ref3], de [Wet arbeid en zorg][ref4] of de [WW][ref5] jonger is dan 23 jaar en het op
      grond van [paragraaf 1 tot en met 6 ][ref6]berekende dagloon bij verjaring minder bedraagt dan het minimumloon,
      dat behoort bij de leeftijd van de werknemer bij zijn verjaring, vermeerderd met de vakantiebijslag, bedoeld in
      [artikel 15 van de WML][ref7], wordt dat dagloon bij zijn verjaring verhoogd door het te vermenigvuldigen met
      een breuk waarvan de teller wordt gevormd door het minimumjeugdloonpercentage dat verbonden is aan de leeftijd
      van de werknemer of door 100 indien de werknemer de leeftijd van 23 jaar heeft bereikt, en de noemer door het
      minimumjeugdloonpercentage dat verbonden is aan de leeftijd van de werknemer op de laatste dag voor zijn verjaring.

      2 Het verhoogde dagloon bedraagt niet meer dan het minimumloon, dat behoort bij de leeftijd van de werknemer na
      verjaring, vermeerderd met de vakantiebijslag, bedoeld in [artikel 15 van de WML][ref8].


