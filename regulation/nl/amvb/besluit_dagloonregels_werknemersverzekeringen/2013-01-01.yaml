  - number: '6'
    text: |-
      1 Het dagloon van de werknemer die vanaf de aanvang van het refertejaar tot en met de laatste dag van de eerste
      volledige maand van dat jaar geen loon als bedoeld in [artikel 2][ref1] ontving wordt vastgesteld door bij de
      toepassing van [artikel 3][ref2] «261» te vervangen door: het aantal dagloondagen vanaf en met inbegrip van de
      dag waarop de werkzaamheden als werknemer zijn gestart tot het einde van het refertejaar. Daarbij wordt rekening
      gehouden met het loon dat de werknemer vanaf de start van de werkzaamheden in het refertejaar heeft ontvangen, en
      met de bedragen die de werknemer vanaf dat moment in het refertejaar heeft opgebouwd aan vakantiebijslag en aan
      uitkeringen die het karakter hebben van een extra periodiek salaris.

      2 Het dagloon van de werknemer, bedoeld in het eerste lid, die in het refertejaar geen loon heeft genoten, is in
      afwijking van het eerste lid de uitkomst van de volgende berekening:

      ((A – B – C ) + D + E) / F

      waarbij:

      A staat voor het loon dat de werknemer in het aangiftetijdvak waarin de arbeidsongeschiktheid of het
      arbeidsurenverlies is ingetreden, voor dat intreden heeft genoten;

      B staat voor de bedragen aan vakantiebijslag die de werknemer onder die titel in het aangiftetijdvak waarin de
      arbeidsongeschiktheid of het arbeidsurenverlies is ingetreden voor dat intreden heeft genoten;

      C staat voor de bedragen die de werknemer in het aangiftetijdvak waarin de arbeidsongeschiktheid of het
      arbeidsurenverlies is ingetreden, voor dat intreden onder die titel heeft genoten aan uitkeringen die het karakter
      hebben van een extra periodiek salaris;

      D staat voor het bedrag dat de werknemer in het aangiftetijdvak waarin de arbeidsongeschiktheid of het
      arbeidsurenverlies is ingetreden, voor dat intreden heeft opgebouwd aan vakantiebijslag;

      E staat voor het bedrag dat de werknemer in het aangiftetijdvak waarin de arbeidsongeschiktheid of het
      arbeidsurenverlies is ingetreden, voor dat intreden heeft opgebouwd aan uitkeringen als bedoeld onder C;

      F staat voor het in dat aangiftetijdvak gelegen aantal dagloondagen waarover de werknemer loon heeft genoten,
      voordat de arbeidsongeschiktheid of het arbeidsurenverlies is ingetreden.

      3 Indien F nul is wordt de uitkomst van de berekening van het tweede lid op nihil gesteld.

      4 Dit artikel is niet van toepassing, indien de werknemer in verband met verlof geen loon heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0018842#Artikel2
