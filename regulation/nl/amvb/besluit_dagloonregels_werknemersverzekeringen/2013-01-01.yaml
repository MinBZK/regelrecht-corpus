      1 Bij het vaststellen van het WW-dagloon van de werknemer, op wie in verband met opeenvolgende verliezen van
      arbeidsuren [artikel 2 van het Besluit nadere regeling verlies van arbeidsuren][ref1] van toepassing is, eindigt
      bij toepassing van [artikel 3, eerste lid][ref2], het refertejaar op de laatste dag van het aangiftetijdvak
      voorafgaand aan het aangiftetijdvak waarin het eerste verlies van arbeidsuren is ingetreden.

      2 Het WW-dagloon van de werknemer, op wie in verband met opeenvolgende verliezen van arbeidsuren
      [artikel 3 van het Besluit nadere regeling verlies van arbeidsuren][ref3] van toepassing is, wordt vastgesteld door
      de berekening op grond van [artikel 3, eerste lid][ref4], te vervangen door:

      (A + B) x C / D

      waarbij:

      A staat voor het dagloon dat ten grondslag ligt aan de uitkering terzake van zijn arbeidsurenverlies waarbij
      op grond van [artikel 3 van het Besluit nadere regeling verlies van arbeidsuren][ref5] een daaropvolgend
      arbeidsurenverlies wordt samengeteld;

      B staat voor de evenredige verhoging van het dagloon, in de mate waarin het minimumloon in de periode bedoeld in C
      is herzien;

      C staat voor het gemiddelde aantal gewerkte arbeidsuren in de kalenderweek van het voorgaande arbeidsurenverlies
      tot en met de kalenderweek voorafgaande aan die waarin het volgende arbeidsurenverlies plaatsvindt;

      D staat voor het gemiddelde aantal gewerkte arbeidsuren voorafgaande aan het voorgaande arbeidsurenverlies.


