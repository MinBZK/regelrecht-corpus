  - number: '12'
    text: |-
      1 Het ZW-dagloon van de persoon, die op de dag van het ontstaan van zijn ongeschiktheid tot werken op grond van
      [artikel 7 van de ZW][ref1] als werknemer wordt aangemerkt, wordt vastgesteld op het WW-dagloon.

      2 Indien de uitkering op grond van de [WW][ref2] in verband met niet volledig arbeidsurenverlies is vastgesteld of
      op die uitkering inkomsten uit arbeid worden verrekend met toepassing van [artikel 35aa WW][ref3], wordt het ZW-
      dagloon, bedoeld in het eerste lid, vastgesteld op 100/70 van het bedrag van de WW-uitkering per dag over de vier
      kalenderweken voorafgaande aan de dag van het ontstaan van de arbeidsongeschiktheid.

      3 Voor de toepassing van dit besluit is de maandag de eerste dag van de kalenderweek.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel35aa
