      1 Het dagloon bedraagt ten hoogste het op grond van
      [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref1] geldende bedrag met betrekking tot
      een loontijdvak van een dag.

      2 Indien een werknemer gelijktijdig aanspraak heeft op meerdere uitkeringen op grond van de [ZW][ref2], de
      [WW][ref3], de [Wet arbeid en zorg][ref4], de [WAO][ref5] of de [Wet WIA][ref6] en de som van de uitkeringen op
      grond van die wetten per dag meer bedraagt dan 70% van het bedrag, bedoeld in het eerste lid, worden de aan die
      uitkeringen ten grondslag liggende daglonen zodanig evenredig verminderd dat de som van de uitkeringen per dag niet
      langer meer bedraagt dan 70% van het bedrag, bedoeld in het eerste lid.

      3 Indien van een uitkering als bedoeld in het tweede lid het uitkeringspercentage hoger is dan 70 % wordt 70% van
      het bedrag, bedoeld in het eerste lid, verhoogd met:

      ((A – 70) / 100) x B

      waarbij:

      A staat voor het hogere uitkeringspercentage;

      B staat voor het dagloon van de uitkering, waarvoor het uitkeringspercentage A geldt.


