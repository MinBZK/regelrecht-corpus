  - number: '5'
    text: |-
      1 Indien de werknemer bij aanvang van het refertejaar jonger is dan 23 jaar en het op grond van [hoofdstuk 2][ref1]
      van dit besluit berekende dagloon minder bedraagt dan het minimumloon dat behoort bij de leeftijd van de
      werknemer op de eerste dag waarop recht bestaat op uitkering, vermeerderd met de vakantiebijslag bedoeld in
      [artikel 15 van de WML][ref2], wordt dat dagloon verhoogd door het te vermenigvuldigen met

      A / B

      waarbij:

      A staat voor het minimumjeugdloonpercentage dat verbonden is aan de leeftijd van de werknemer op de eerste dag
      waarop recht bestaat op uitkering of indien de werknemer op die dag de leeftijd van 23 jaar heeft bereikt, voor
      100;

      B staat voor het minimumjeugdloonpercentage dat verbonden is aan de leeftijd van de werknemer bij aanvang van het
      refertejaar.

      2 Het verhoogde dagloon bedraagt niet meer dan het minimumloon, dat behoort bij de leeftijd van de
      werknemer op de eerste dag waarop recht bestaat op uitkering, vermeerderd met de vakantiebijslag, bedoeld in
      [artikel 15 van de WML][ref3].

      3 Indien bij de vaststelling van het dagloon [artikel 6][ref4], [11][ref5] of [16][ref6] van toepassing is, wordt
      bij de toepassing het eerste lid voor «bij aanvang van het refertejaar» gelezen: bij aanvang van het tijdvak
      waarover het loon in aanmerking wordt genomen.


