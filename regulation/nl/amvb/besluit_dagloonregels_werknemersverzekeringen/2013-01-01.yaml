  - number: '10'
    text: |-
      1 Bij het vaststellen van het ZW-, WIA- of WAO-dagloon van de persoon, wiens aanspraak op
      ziekengeld onderscheidenlijk arbeidsongeschiktheidsuitkering berust op [artikel 46 van de ZW][ref1],
      [artikel 10 van de Wet WIA][ref2] of [artikel 17 van de WAO][ref3], eindigt het refertejaar op de laatste dag van
      het aangiftetijdvak voorafgaand aan het aangiftetijdvak waarin de verzekering is geëindigd.

      2 Het ZW-dagloon van de persoon, bedoeld in het eerste lid, die laatstelijk verzekerd was op grond van
      [artikel 7 van de ZW][ref4] wegens het ontvangen van een uitkering op grond van de [WW][ref5], wordt vastgesteld
      overeenkomstig [artikel 12][ref6].

      3 Het dagloon van de persoon, wiens aanspraak op uitkering berust op
      [artikel 3:10, eerste en tweede lid, van de Wet arbeid en zorg][ref7], wordt bepaald overeenkomstig
      [artikel 11][ref8], met dien verstande dat waar in [artikel 11][ref9] wordt uitgegaan van hetgeen uit de
      dienstbetrekking waarin de arbeidsongeschiktheid is ingetreden is genoten in een bepaald aangiftetijdvak, bij de
      vaststelling van dit dagloon wordt uitgegaan van hetgeen de persoon als werknemer of gelijkgestelde als bedoeld in
      [artikel 3:6, eerste lid, van die wet][ref10] heeft genoten in het aangiftetijdvak voorafgaande aan het tijdstip,
      dat hij niet langer werknemer of die gelijkgestelde was.


