        artikel: '16'
  - number: 1.1.o
    text: |-
      *aangiftetijdvak*: het tijdvak van vier weken dan wel één maand waarop de aangifte waarop de ingehouden
      loonbelasting wordt afgedragen, betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel1
  - number: 1.1.p
    text: '*gebroken aangiftetijdvak*: een aangiftetijdvak dat deels binnen en deels buiten het refertejaar valt;'
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel1
  - number: 1.1.q
    text: |-
      *refertejaar*: de periode van één jaar die eindigt op de laatste dag van het aangiftetijdvak voorafgaande
      aan het aangiftetijdvak waarin de arbeidsongeschiktheid dan wel het arbeidsurenverlies is ingetreden, of die
      eindigt, in geval de arbeidsongeschiktheid als bedoeld in de [WAO][ref1] of de [Wet WIA][ref2] is ingetreden in
      gelijktijdige dienstbetrekkingen, op de laatste dag van het aangiftetijdvak dat het eerst voor het intreden van de
      arbeidsongeschiktheid is geëindigd;


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0019057
  - number: 1.1.r
    text: |-
      minimumloon: het minimumloon per maand, bedoeld in [artikel 8, eerste lid, onderdeel a, van de WML][ref1], gedeeld
      door 21,75;


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
  - number: 1.1.s
    text: |-
      *minimumjeugdloonpercentage*: een percentage als bedoeld in [artikel 8, derde lid, van de WML][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
  - number: 1.1.t
    text: |-
      *verlof*: een tussen de werkgever en werknemer voor een gedeelte of het geheel van de arbeidstijd overeengekomen
      periode van verlof, waarin de werknemer geen arbeid jegens de werkgever verricht;
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel1
  - number: 1.1.u
    text: |-
      *WAO-vervolgdagloon*: het vervolgdagloon, bedoeld in [artikel 21b van de WAO][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel21b
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel1
