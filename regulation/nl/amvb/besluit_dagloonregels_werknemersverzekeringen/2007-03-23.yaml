  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 1 juni 2005, Directie Sociale
    Verzekeringen, nr. SV/F&W/05/38929;

    Gelet op de artikelen 15, tweede lid, van de Ziektewet, 14, tweede lid, van de Wet op de
    arbeidsongeschiktheidsverzekering, 13, derde lid, van de Wet werk en inkomen naar arbeidsvermogen, en 45, tweede
    lid, van de Werkloosheidswet;

    De Raad van State gehoord (advies van 7 juli 2005, nr. W12.05.0218/IV);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid van 5 oktober 2005, Directie
    Sociale Verzekeringen, nr. SV/F&W/05/76328;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#ArtikelAanhef
