        artikel: 130h
  - number: '25'
    text: Dit besluit treedt in werking met ingang van 29 december 2005.
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel25
  - number: '26'
    text: 'Dit besluit wordt aangehaald als: Besluit dagloonregels werknemersverzekeringen.'
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel26
