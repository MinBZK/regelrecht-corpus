        artikel: '53'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '63'
  - number: 2.2.d
    text: |-
      indien de teller van de factor, bedoeld in [artikel 53][ref1] of [63 van de wet WIA][ref2] lager is, de waarde van
      die teller;


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel63
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '53'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '63'
  - number: '2.3'
    text: |-
      Voorzover het tweede lid van toepassing is wordt, bij de toepassing van [artikel 3][ref1], als genoten
      respectievelijk opgebouwde vakantiebijslag in aanmerking genomen: (100 x A) / B waarbij: A staat voor de in het in
      aanmerking te nemen tijdvak daadwerkelijk genoten respectievelijk opgebouwde vakantiebijslag; B gelijk is aan de
      factor B, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0018842#Artikel3
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018842
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '2.4'
    text: |-
      Onder loon wordt mede begrepen het loon waarvan de werknemer aantoont dat dit in het refertejaar vorderbaar maar
      niet tevens inbaar is geworden. Voor de toepassing van dit besluit wordt de werknemer geacht dit loon te hebben
      genoten in het aangiftetijdvak waarin het vorderbaar is geworden. Indien in het refertejaar een uitkering als
      bedoeld in het tweede lid is genoten, waarbij in het dagloon loon als bedoeld in de eerste zin is meegerekend,
      wordt, indien dat loon in het refertejaar inbaar is geworden, dat loon bij de dagloonberekening buiten beschouwing
      gelaten.
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel2
  - number: '2.5'
    text: |-
      Onder loon worden mede begrepen de inkomsten, bedoeld in [artikel 16, derde lid, van de WW][ref1], waarop de
      werknemer recht heeft in verband met de beëindiging van de dienstbetrekking, voorzover die inkomsten worden
      toegerekend aan perioden die in het refertejaar vallen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '16'
  - number: '2.6'
    text: |-
      Het loon dat in een gebroken aangiftetijdvak in aanmerking wordt genomen bij de dagloonvaststelling is de uitkomst
      van de volgende berekening: ((A – B – C) x Y) / Z waarbij: A staat voor het totale loon dat de werknemer in dat
      gebroken aangiftetijdvak heeft genoten; B staat voor de bedragen aan vakantiebijslag die de werknemer onder die
      titel in dat gebroken aangiftetijdvak heeft genoten; C staat voor de bedragen die de werknemer in dat gebroken
      aangiftetijdvak onder die titel heeft genoten aan uitkeringen die het karakter hebben van een extra periodiek
      salaris; Y staat voor het totale aantal dagloondagen binnen het refertejaar in dat gebroken aangiftetijdvak
      waarop de werknemer bij de werkgever in dienst was; Z staat voor het totale aantal dagloondagen in dat gebroken
      aangiftetijdvak waarop de werknemer bij de werkgever in dienst was.
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel2
  - number: '2.7'
    text: Indien Z nul is wordt de uitkomst van de berekening van het zesde lid op nihil gesteld.
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel2
  - number: '3.1'
    text: |-
      Het dagloon is de uitkomst van de volgende berekening: ((A – B – C) + D + E) / 261 waarbij: A staat voor het loon
      dat de werknemer in het refertejaar heeft genoten; B staat voor de bedragen aan vakantiebijslag die de werknemer
      onder die titel in de volledige aangiftetijdvakken in het refertejaar heeft genoten; C staat voor de bedragen die
      de werknemer in de volledige aangiftetijdvakken in het refertejaar onder die titel heeft genoten aan uitkeringen
      die het karakter hebben van een extra periodiek salaris; D staat voor het bedrag dat de werknemer in het
      refertejaar heeft opgebouwd aan vakantiebijslag; E staat voor het bedrag dat de werknemer in het refertejaar heeft
      opgebouwd aan uitkeringen als bedoeld onder C.
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel3
  - number: '3.2'
    text: |-
      Indien het minimumloon is herzien tussen het einde van het refertejaar en de eerste dag waarop recht
      bestaat op een uitkering op grond van de [ZW][ref1], de[ WW][ref2], de [WAO][ref3], de [Wet WIA][ref4] of
      de[ Wet arbeid en zorg][ref5] wordt de uitkomst van het eerste lid herzien in de mate waarin het minimumloon is
      herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0019057
      [ref5]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0002524
      - id: ref4
        bwb_id: BWBR0019057
      - id: ref5
        bwb_id: BWBR0013008
  - number: '4.1'
    text: |-
      Indien in het refertejaar door de werknemer in een aangiftetijdvak geen loon of minder loon is genoten in
      verband met verlof of omdat hij de bedongen arbeid niet heeft verricht wegens arbeidsongeschiktheid, zwangerschap
      of bevalling, wordt bij het vaststellen van het loon in dat aangiftetijdvak in aanmerking genomen het loon,
      genoten bij dezelfde werkgever in het laatste aan dat verlof of die arbeidsongeschiktheid voorafgaande en in het
      refertejaar gelegen aangiftetijdvak, waarin die situatie zich niet heeft voorgedaan. De eerste zin geldt voorzover
      [artikel 2, tweede lid][ref1], niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0018842#Artikel2
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018842
        artikel: '2'
        hoofdstuk: '1'
  - number: '4.2'
    text: |-
      Indien geen voorafgaand aangiftetijdvak als bedoeld in het eerste lid wordt gevonden, wordt in aanmerking genomen
      het loon bij dezelfde werkgever over het in het refertejaar gelegen aangiftetijdvak, gelegen direct na afloop van
      dat verlof, dan wel die arbeidsongeschiktheid.
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel4
  - number: '4.3'
    text: |-
      Indien noch een laatste aan het verlof of aan de arbeidsongeschiktheid voorafgaand aangiftetijdvak als bedoeld in
      het eerste lid noch een direct na afloop van dat verlof of die arbeidsongeschiktheid gelegen aangiftetijdvak als
      bedoeld in het tweede lid wordt gevonden, wordt voor ieder in het refertejaar gelegen aangiftetijdvak waarin door
      de werknemer geen of minder loon is genoten in verband met de in het eerste lid genoemde omstandigheden, het voor
      dat aangiftetijdvak geldende overeengekomen loon in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel4
  - number: '5.1'
    text: |-
      Indien de werknemer bij aanvang van het refertejaar jonger is dan 23 jaar en het op grond van [hoofdstuk 2][ref1]
      van dit besluit berekende dagloon minder bedraagt dan het minimumloon dat behoort bij de leeftijd van de
      werknemer op de eerste dag waarop recht bestaat op uitkering, vermeerderd met de vakantiebijslag bedoeld in
      [artikel 15 van de WML][ref2], wordt dat dagloon verhoogd door het te vermenigvuldigen met A / B waarbij: A staat
      voor het minimumjeugdloonpercentage dat verbonden is aan de leeftijd van de werknemer op de eerste dag waarop
      recht bestaat op uitkering of indien de werknemer op die dag de leeftijd van 23 jaar heeft bereikt, voor 100; B
      staat voor het minimumjeugdloonpercentage dat verbonden is aan de leeftijd van de werknemer bij aanvang van het
      refertejaar.


      [ref1]: https://wetten.overheid.nl/BWBR0018842#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018842
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '15'
  - number: '5.2'
    text: |-
      Het verhoogde dagloon bedraagt niet meer dan het minimumloon, dat behoort bij de leeftijd van de werknemer
      op de eerste dag waarop recht bestaat op uitkering, vermeerderd met de vakantiebijslag, bedoeld in
      [artikel 15 van de WML][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '15'
  - number: '5.3'
    text: |-
      Indien bij de vaststelling van het dagloon [artikel 6][ref1], [11][ref2] of [16][ref3] van toepassing is, wordt bij
      de toepassing het eerste lid voor «bij aanvang van het refertejaar» gelezen: bij aanvang van het tijdvak waarover
      het loon in aanmerking wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0018842#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0018842#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0018842#Artikel16
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018842
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018842
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0018842
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: '6.1'
    text: |-
      Het dagloon van de werknemer die vanaf de aanvang van het refertejaar tot en met de laatste dag van de eerste
      volledige maand van dat jaar geen loon als bedoeld in [artikel 2][ref1] ontving wordt vastgesteld door bij de
      toepassing van [artikel 3][ref2] «261» te vervangen door: het aantal dagloondagen vanaf en met inbegrip van de
      dag waarop de werkzaamheden als werknemer zijn gestart tot het einde van het refertejaar. Daarbij wordt rekening
      gehouden met het loon dat de werknemer vanaf de start van de werkzaamheden in het refertejaar heeft ontvangen, en
      met de bedragen die de werknemer vanaf dat moment in het refertejaar heeft opgebouwd aan vakantiebijslag en aan
      uitkeringen die het karakter hebben van een extra periodiek salaris.


      [ref1]: https://wetten.overheid.nl/BWBR0018842#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018842#Artikel3
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018842
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0018842
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '6.2'
    text: |-
      Het dagloon van de werknemer, bedoeld in het eerste lid, die in het refertejaar geen loon heeft genoten, is in
      afwijking van het eerste lid de uitkomst van de volgende berekening: ((A – B – C ) + D + E) / F waarbij: A staat
      voor het loon dat de werknemer in het aangiftetijdvak waarin de arbeidsongeschiktheid of het arbeidsurenverlies
      is ingetreden, voor dat intreden heeft genoten; B staat voor de bedragen aan vakantiebijslag die de werknemer
      onder die titel in het aangiftetijdvak waarin de arbeidsongeschiktheid of het arbeidsurenverlies is ingetreden
      voor dat intreden heeft genoten; C staat voor de bedragen die de werknemer in het aangiftetijdvak waarin de
      arbeidsongeschiktheid of het arbeidsurenverlies is ingetreden, voor dat intreden onder die titel heeft genoten
      aan uitkeringen die het karakter hebben van een extra periodiek salaris; D staat voor het bedrag dat de werknemer
      in het aangiftetijdvak waarin de arbeidsongeschiktheid of het arbeidsurenverlies is ingetreden, voor dat intreden
      heeft opgebouwd aan vakantiebijslag; E staat voor het bedrag dat de werknemer in het aangiftetijdvak waarin de
      arbeidsongeschiktheid of het arbeidsurenverlies is ingetreden, voor dat intreden heeft opgebouwd aan uitkeringen
      als bedoeld onder C; F staat voor het in dat aangiftetijdvak gelegen aantal dagloondagen waarover de werknemer loon
      heeft genoten, voordat de arbeidsongeschiktheid of het arbeidsurenverlies is ingetreden.
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel6
  - number: '6.3'
    text: Indien F nul is wordt de uitkomst van de berekening van het tweede lid op nihil gesteld.
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel6
  - number: '6.4'
    text: Dit artikel is niet van toepassing, indien de werknemer in verband met verlof geen loon heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel6
  - number: '7.1'
    text: |-
      Het WW-, WIA- of WAO-dagloon van de werknemer, die aantoont dat zijn per tijdseenheid overeengekomen loon is
      verlaagd op of nadat hij de leeftijd van 55 jaar heeft bereikt, wordt vastgesteld door bij de toepassing van
      [artikel 3][ref1] het loon dat de werknemer in het refertejaar heeft genoten te vervangen door: het loon dat deze
      werknemer zou hebben genoten indien deze verlaging niet zou hebben plaatsgevonden, tot ten hoogste 9/7 deel van dat
      lagere loon.


      [ref1]: https://wetten.overheid.nl/BWBR0018842#Artikel3
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0018842
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '7.2'
    text: |-
      Het eerste lid is slechts van toepassing op de werknemer die onmiddellijk voordat zijn arbeidsurenverlies of
      arbeidsongeschiktheid is ingetreden in dienstbetrekking stond tot dezelfde werkgever of diens rechtsopvolger als
      waarmee de vermindering van loon is overeengekomen.
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel7
  - number: '8'
    text: |-
      Indien een werknemer, die recht heeft op een uitkering op grond van de [WAO][ref1] of de [Wet WIA][ref2] op of na
      de dag waarop hij de leeftijd van 45 jaar heeft bereikt, met arbeid inkomen is gaan verwerven in verband waarmee
      zijn uitkering op grond van de [WAO][ref3] of de [Wet WIA][ref4] wordt beëindigd, binnen vijf jaar na de datum
      waarop die uitkering is beëindigd opnieuw recht heeft op een uitkering op grond van de [Wet WIA][ref5], wordt het
      Wet WIA-dagloon niet lager vastgesteld dan het WAO- of Wet WIA-dagloon dat voor de berekening van de laatstelijk
      ontvangen uitkering op grond van de [WAO][ref6] of de [Wet WIA][ref7] in aanmerking werd genomen, zoals dat vanaf
      de datum van beëindiging van die laatste uitkering tot aan de datum van het nieuwe recht op uitkering op grond van
      [artikel 15, eerste lid, van de WAO][ref8], dan wel [artikel 14, eerste lid, van de Wet WIA][ref9] zou zijn herzien
      indien de uitkering op grond van de [WAO][ref10] of de [Wet WIA][ref11] niet zou zijn beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0019057
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0019057
      [ref5]: https://wetten.overheid.nl/BWBR0019057
      [ref6]: https://wetten.overheid.nl/BWBR0002524
      [ref7]: https://wetten.overheid.nl/BWBR0019057
      [ref8]: https://wetten.overheid.nl/BWBR0002524#Artikel15
      [ref9]: https://wetten.overheid.nl/BWBR0019057#Artikel14
      [ref10]: https://wetten.overheid.nl/BWBR0002524
      [ref11]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0019057
      - id: ref3
        bwb_id: BWBR0002524
      - id: ref4
        bwb_id: BWBR0019057
      - id: ref5
        bwb_id: BWBR0019057
      - id: ref6
        bwb_id: BWBR0002524
      - id: ref7
        bwb_id: BWBR0019057
      - id: ref8
        bwb_id: BWBR0002524
        artikel: '15'
      - id: ref9
        bwb_id: BWBR0019057
        artikel: '14'
      - id: ref10
        bwb_id: BWBR0002524
      - id: ref11
        bwb_id: BWBR0019057
  - number: '9.1'
    text: |-
      Bij het vaststellen van het ZW- of WW-dagloon van de werknemer die tijdens het refertejaar in twee of meer
      dienstbetrekkingen stond, wordt slechts in aanmerking genomen het loon uit de dienstbetrekking uit hoofde waarvan
      de werknemer arbeidsongeschikt of werkloos is geworden, alsmede uit de overige dienstbetrekkingen naar de mate
      waarin die dienstbetrekking daarvoor in de plaats is gekomen.
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel9
  - number: '9.2'
    text: |-
      Bij het vaststellen van het ZW- of WW-dagloon van de werknemer die tijdens het refertejaar een uitkering op grond
      van de [ZW][ref1], de [WW][ref2], de[ WAO][ref3], de [Wet WIA][ref4] of de [Wet arbeid en zorg][ref5] genoot worden
      het op grond van [artikel 2, tweede en derde lid][ref6], vastgestelde loon en de vakantiebijslag in aanmerking
      genomen naar de mate waarin de uitkering, waarvoor het dagloon wordt vastgesteld, in de plaats is gekomen van de in
      het in aanmerking te nemen tijdvak genoten uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0019057
      [ref5]: https://wetten.overheid.nl/BWBR0013008
      [ref6]: https://wetten.overheid.nl/BWBR0018842#Artikel2
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0002524
      - id: ref4
        bwb_id: BWBR0019057
      - id: ref5
        bwb_id: BWBR0013008
      - id: ref6
        bwb_id: BWBR0018842
        artikel: '2'
        hoofdstuk: '1'
  - number: '10.1'
    text: |-
      Bij het vaststellen van het ZW-, WIA- of WAO-dagloon van de persoon, wiens aanspraak op ziekengeld
      onderscheidenlijk arbeidsongeschiktheidsuitkering berust op [artikel 46 van de ZW][ref1],
      [artikel 10 van de Wet WIA][ref2] of [artikel 17 van de WAO][ref3], eindigt het refertejaar op de laatste dag van
      het aangiftetijdvak voorafgaand aan het aangiftetijdvak waarin de verzekering is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel17
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '46'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '17'
  - number: '10.2'
    text: |-
      Het ZW-dagloon van de persoon, bedoeld in het eerste lid, die laatstelijk verzekerd was op grond van
      [artikel 7 van de ZW][ref1] wegens het ontvangen van een uitkering op grond van de [WW][ref2], wordt vastgesteld
      overeenkomstig [artikel 12][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0018842#Artikel12
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0018842
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '10.3'
    text: |-
      Het dagloon van de persoon, wiens aanspraak op uitkering berust op
      [artikel 3:10, eerste en tweede lid, van de Wet arbeid en zorg][ref1], wordt bepaald overeenkomstig
      [artikel 11][ref2], met dien verstande dat waar in [artikel 11][ref3] wordt uitgegaan van hetgeen uit de
      dienstbetrekking waarin de arbeidsongeschiktheid is ingetreden is genoten in een bepaald aangiftetijdvak, bij de
      vaststelling van dit dagloon wordt uitgegaan van hetgeen de persoon als werknemer of gelijkgestelde als bedoeld in
      [artikel 3:6, eerste lid, van die wet][ref4] heeft genoten in het aangiftetijdvak voorafgaande aan het tijdstip,
      dat hij niet langer werknemer of die gelijkgestelde was.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018842#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0018842#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0018842
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0018842
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '11.1'
    text: |-
      Het ZW-dagloon van de werknemer, bedoeld in [artikel 29b van de ZW][ref1], is, in afwijking van
      [artikel 3, eerste lid][ref2], de uitkomst van de volgende berekening: ((A – B – C) + D + E) / F waarbij: A staat
      voor het loon dat de werknemer, uit de dienstbetrekking waarin hij wegens ziekte arbeidsongeschikt is geworden,
      heeft genoten in het laatste aangiftetijdvak voorafgaande aan het aangiftetijdvak waarin die arbeidsongeschiktheid
      is ingetreden; B staat voor de bedragen aan vakantiebijslag die de werknemer, uit de dienstbetrekking waarin hij
      wegens ziekte arbeidsongeschikt is geworden, onder die titel in dat laatste aangiftetijdvak heeft genoten; C staat
      voor de bedragen die de werknemer, uit de dienstbetrekking waarin hij wegens ziekte arbeidsongeschikt is geworden,
      in dat laatste aangiftetijdvak onder die titel heeft genoten aan uitkeringen die het karakter hebben van een extra
      periodiek salaris; D staat voor het bedrag dat de werknemer, uit de dienstbetrekking waarin hij wegens ziekte
      arbeidsongeschikt is geworden, in dat laatste aangiftetijdvak heeft opgebouwd aan vakantiebijslag; E staat voor
      het bedrag dat de werknemer, uit de dienstbetrekking waarin hij wegens ziekte arbeidsongeschikt is geworden, in dat
      laatste aangiftetijdvak heeft opgebouwd aan uitkeringen als bedoeld onder C; F staat voor het aantal dagloondagen
      in dat laatste aangiftetijdvak binnen de dienstbetrekking waarin hij wegens ziekte arbeidsongeschikt is geworden,
      dan wel indien het een aangiftetijdvak van een maand betreft en de betreffende dienstbetrekking dat gehele tijdvak
      heeft geduurd, voor 21,75.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29b
      [ref2]: https://wetten.overheid.nl/BWBR0018842#Artikel3
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 29b
      - id: ref2
        bwb_id: BWBR0018842
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '11.2'
    text: |-
      Het dagloon van de werknemer, bedoeld in het eerste lid, die in het laatste aangiftetijdvak voorafgaande aan het
      aangiftetijdvak waarin hij wegens ziekte arbeidsongeschikt is geworden niet in de dienstbetrekking stond waaruit
      hij arbeidsongeschikt is geworden, is, in afwijking van [artikel 3, eerste lid][ref1], de uitkomst van de volgende
      berekening: '((A – B – C) + D + E) / F waarbij: A staat voor het loon dat de werknemer, uit de dienstbetrekking'
      waarin hij wegens ziekte arbeidsongeschikt is geworden, voorafgaande aan het intreden van die arbeidsongeschiktheid
      heeft genoten in het aangiftetijdvak waarin die arbeidsongeschiktheid is ingetreden; B staat voor de bedragen aan
      vakantiebijslag die de werknemer, uit de dienstbetrekking waarin hij wegens ziekte arbeidsongeschikt is geworden,
      voorafgaande aan het intreden van die arbeidsongeschiktheid, onder die titel in dat aangiftetijdvak heeft genoten;
      C staat voor de bedragen die de werknemer, uit de dienstbetrekking waarin hij wegens ziekte arbeidsongeschikt is
      geworden, voorafgaande aan het intreden van die arbeidsongeschiktheid, in dat aangiftetijdvak heeft genoten aan
      uitkeringen die het karakter hebben van een extra periodiek salaris; D staat voor het bedrag dat de werknemer, uit
      de dienstbetrekking waarin hij wegens ziekte arbeidsongeschikt is geworden, voorafgaande aan het intreden van die
      arbeidsongeschiktheid, in dat aangiftetijdvak heeft opgebouwd aan vakantiebijslag; E staat voor het bedrag dat de
      werknemer, uit de dienstbetrekking waarin hij wegens ziekte arbeidsongeschikt is geworden, voorafgaande aan het
      intreden van die arbeidsongeschiktheid, in dat aangiftetijdvak heeft opgebouwd aan uitkeringen als bedoeld onder
      C; F staat voor het aantal dagloondagen in dat aangiftetijdvak in de dienstbetrekking waarin hij wegens ziekte
      arbeidsongeschikt is geworden, voorafgaande aan het intreden van die arbeidsongeschiktheid wegens ziekte.


      [ref1]: https://wetten.overheid.nl/BWBR0018842#Artikel3
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0018842
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '11.3'
    text: |-
      Indien bij de toepassing van het tweede lid F nul is, is het dagloon in afwijking van het tweede lid, de
      uitkomst van de volgende berekening: A / B waarbij: A staat voor het overeengekomen loon van de werknemer in de
      dienstbetrekking waarin hij wegens ziekte arbeidsongeschikt tot het verrichten van werkzaamheden is geworden over
      het aangiftetijdvak waarin die arbeidsongeschiktheid is ingetreden; B staat voor het aantal dagloondagen in het
      aangiftetijdvak waarin de arbeidsongeschiktheid is ingetreden, dan wel indien het een aangiftetijdvak van een maand
      betreft, voor 21,75.
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel11
  - number: '12.1'
    text: |-
      Het ZW-dagloon van de persoon, die op de dag van het ontstaan van zijn ongeschiktheid tot werken op grond van
      [artikel 7 van de ZW][ref1] als werknemer wordt aangemerkt, wordt vastgesteld op het WW-dagloon.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel7
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '7'
  - number: '12.2'
    text: |-
      Indien de uitkering op grond van de [WW][ref1] in verband met niet volledig arbeidsurenverlies is vastgesteld,
      wordt het ZW-dagloon, bedoeld in het eerste lid, vastgesteld op 100/70 van het bedrag van de WW-uitkering per dag
      over de vier kalenderweken voorafgaande aan de dag van het ontstaan van de arbeidsongeschiktheid.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '12.3'
    text: Voor de toepassing van dit besluit is de maandag de eerste dag van de kalenderweek.
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel12
  - number: '13.1'
    text: |-
      Het WW-dagloon van de werknemer die op de dag voorafgaande aan de eerste werkloosheidsdag een
      arbeidsongeschiktheidsuitkering op grond van de [WAO][ref1] heeft ontvangen naar een arbeidsongeschiktheid
      van 80% of meer, is, indien die uitkering met ingang van de eerste werkloosheidsdag wordt
      ingetrokken dan wel niet meer wordt uitbetaald op grond van [artikel 43, eerste lid][ref2], of
      [artikel 44, eerste lid, onderdeel a, van de WAO][ref3], gelijk aan het laatstelijk geldende WAO-dagloon.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel44
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '43'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '44'
  - number: '13.2'
    text: |-
      Het WW-dagloon van de werknemer die op de eerste werkloosheidsdag, of op de eerste dag van herleving van het recht
      op werkloosheidsuitkering, een uitkering op grond van de [WAO][ref1] naar een arbeidsongeschiktheid van minder dan
      80% ontvangt, wordt vastgesteld door evenredige verlaging van het laatstelijk geldende WAO-dagloon. Het WW-dagloon
      wordt in aanmerking genomen naar de mate waarin de uitkering, waarvoor het dagloon wordt vastgesteld, in de plaats
      is gekomen voor de uitkering op grond van de [WAO][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0002524
  - number: '13.3'
    text: Indien op een tijdstip na de in het tweede lid bedoelde dagloonvaststelling
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel13
  - number: 13.3.a
    text: de werknemer wordt ingedeeld in een andere arbeidsongeschiktheidsklasse, of
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel13
  - number: 13.3.b
    text: |-
      diens arbeidsongeschiktheidsuitkering niet meer volledig wordt uitbetaald op grond van
      [artikel 44, eerste lid, onderdeel b, van de WAO][ref1], wordt het WW-dagloon opnieuw vastgesteld. Het WW-dagloon
      wordt in aanmerking genomen naar de mate waarin de uitkering, waarvoor het dagloon wordt vastgesteld, in de plaats
      is gekomen voor de uitkering op grond van de [WAO][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0002524
  - number: '13.4'
    text: |-
      De vaststelling, bedoeld in het tweede lid, en de hernieuwde vaststelling, bedoeld in het derde lid, geschieden
      volgens de volgende berekening: A x (100 – B) / 100 waarin: A staat voor het WAO-dagloon, bedoeld in het tweede
      lid; en B staat voor het midden van de arbeidsongeschiktheidsklasse die bij de vaststelling of hernieuwde
      vaststelling in acht wordt genomen.
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel13
  - number: '13.5'
    text: |-
      Voor de werknemer, bedoeld in het tweede lid, wiens arbeidsongeschiktheidsuitkering op een tijdstip na de
      in dat lid bedoelde dagloonberekening wordt ingetrokken dan wel niet meer wordt uitbetaald op grond van
      [artikel 43, eerste lid][ref1], of [artikel 44, eerste lid, onderdeel a, van de WAO][ref2], is het WW-dagloon het
      in de eerste zin van het tweede lid bedoelde WAO-dagloon respectievelijk het zesde lid bedoelde WAO-vervolgdagloon.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel44
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '43'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '44'
  - number: '13.6'
    text: |-
      Indien de arbeidsongeschiktheidsuitkering laatstelijk was gebaseerd op een WAO-vervolgdagloon wordt bij de
      toepassing van het eerste, tweede, vierde en vijfde lid voor «WAO-dagloon» gelezen: WAO-vervolgdagloon.
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel13
  - number: '13.7'
    text: |-
      Voor de toepassing van het eerste en tweede lid wordt met het ontvangen van een WAO-uitkering gelijkgesteld: het
      zouden hebben ontvangen van een dergelijke uitkering indien de [artikelen 25][ref1], [28][ref2], [30][ref3] of
      [33][ref4] van die wet niet van toepassing zouden zijn geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel30
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel33
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '30'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: '33'
  - number: '13.8'
    text: |-
      Dit artikel is niet van toepassing zolang bij de vaststelling van de mate van arbeidsongeschiktheid rekening
      wordt gehouden met de arbeid die de werknemer na het intreden van zijn arbeidsongeschiktheid heeft verricht in de
      dienstbetrekking waaruit hij werkloos is geworden.
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel13
  - number: '13.9'
    text: |-
      Dit artikel is evenmin van toepassing indien de werknemer, bedoeld in het tweede lid, een wachtgeld als bedoeld
      in [artikel 1, onderdeel r, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref1] ontleent of mede
      ontleent aan de dienstbetrekking waaraan hij zijn uitkering op grond van de [WAO][ref2] ontleent of mede ontleent,
      tenzij hij aan die dienstbetrekking tevens een recht op uitkering op grond van de [WW][ref3] ontleent.


      [ref1]: https://wetten.overheid.nl/BWBR0009267#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009267
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0004045
  - number: '13.10'
    text: |-
      De dagloonvaststelling op grond van het eerste lid is van overeenkomstige toepassing voor de werknemer die
      voorafgaande aan de eerste werkloosheidsdag een arbeidsongeschiktheidsuitkering op grond van de [Wet WIA][ref1]
      ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0019057
  - number: '14.1'
    text: |-
      In afwijking van [artikel 13, tweede tot en met vierde lid][ref1], vindt de evenredige verlaging respectievelijk
      herziening plaats overeenkomstig het tweede lid van dit artikel indien:


      [ref1]: https://wetten.overheid.nl/BWBR0018842#Artikel13
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0018842
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: 14.1.a
    text: |-
      de werknemer zijn recht op uitkering op grond van de [WW][ref1] ontleent aan artikel 71, eerste lid, onder a ii of
      b ii, van [verordening (EEG) nr. 1408/71](31971R1408) van de Raad van de Europese gemeenschappen van 14 juni 1971
      betreffende de toepassing van de socialezekerheidsregelingen op loontrekkenden en hun gezinnen, die zich binnen de
      gemeenschap verplaatsen (PbEG L 149);


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 14.1.b
    text: |-
      aan de werknemer op grond van die verordening overeenkomstig de bepalingen van de [WAO][ref1] een
      arbeidsongeschiktheidsuitkering is toegekend, waarvan het bedrag is bepaald naar de verhouding tussen enerzijds de
      duur van de Nederlandse verzekering en anderzijds de totale duur van


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 14.1.b.1°
    text: de tijdvakken van Nederlandse verzekering en
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel14
  - number: 14.1.b.2°
    text: |-
      de tijdvakken van verzekering of arbeid, vervuld ingevolge de sociale wetgeving van een andere lidstaat of van
      andere lidstaten; en
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel14
  - number: 14.1.c
    text: |-
      de werknemer geen recht heeft op toekenning van een invaliditeitsuitkering van een of meer lidstaten, dan
      wel dergelijke invaliditeitsuitkeringen alle zijn ingetrokken, omdat niet of niet meer wordt voldaan aan de
      openingsvoorwaarden voor het recht op invaliditeitsuitkering.
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel14
  - number: '14.2'
    text: |-
      De evenredige verlaging of herziening vindt plaats door het WAO-dagloon of WAO-vervolgdagloon te vermenigvuldigen
      met de breuk (100 – (A x B)) / 100 waarbij: A staat voor het midden van de arbeidsongeschiktheidsklasse die bij de
      vaststelling of hernieuwde vaststelling in acht wordt genomen; B staat voor de verhouding, bedoeld in het eerste
      lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel14
  - number: '15.1'
    text: |-
      Bij het vaststellen van het WW-dagloon van de werknemer, op wie in verband met opeenvolgende verliezen van
      arbeidsuren [artikel 2 van het Besluit nadere regeling verlies van arbeidsuren][ref1] van toepassing is, eindigt
      bij toepassing van [artikel 3, eerste lid][ref2], het refertejaar op de laatste dag van het aangiftetijdvak
      voorafgaand aan het aangiftetijdvak waarin het eerste verlies van arbeidsuren is ingetreden.


      [ref1]: https://wetten.overheid.nl/BWBR0004096#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018842#Artikel3
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004096
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0018842
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '15.2'
    text: |-
      Het WW-dagloon van de werknemer, op wie in verband met opeenvolgende verliezen van arbeidsuren
      [artikel 3 van het Besluit nadere regeling verlies van arbeidsuren][ref1] van toepassing is, wordt vastgesteld
      door de berekening op grond van [artikel 3, eerste lid][ref2], te vervangen door: (A + B) x C / D waarbij: A staat
      voor het dagloon dat ten grondslag ligt aan de uitkering terzake van zijn arbeidsurenverlies waarbij op grond van
      [artikel 3 van het Besluit nadere regeling verlies van arbeidsuren][ref3] een daaropvolgend arbeidsurenverlies
      wordt samengeteld; B staat voor de evenredige verhoging van het dagloon, in de mate waarin het minimumloon in
      de periode bedoeld in C is herzien; C staat voor het gemiddelde aantal gewerkte arbeidsuren in de kalenderweek
      van het voorgaande arbeidsurenverlies tot en met de kalenderweek voorafgaande aan die waarin het volgende
      arbeidsurenverlies plaatsvindt; D staat voor het gemiddelde aantal gewerkte arbeidsuren voorafgaande aan het
      voorgaande arbeidsurenverlies.


      [ref1]: https://wetten.overheid.nl/BWBR0004096#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018842#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0004096#Artikel3
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004096
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0018842
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004096
        artikel: '3'
  - number: '16'
    text: |-
      Het WW-dagloon van de werknemer, die in privaatrechtelijke of publiekrechtelijke dienstbetrekking staat, en die
      recht heeft op uitkering:
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel16
  - number: 16.a
    text: |-
      op grond van [artikel 18 van de WW][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel18
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '18'
  - number: 16.b
    text: |-
      op grond van werkloosheid die verband houdt met een verleende ontheffing krachtens
      [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002014#Artikel8
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002014
        artikel: '8'
  - number: '17.1'
    text: |-
      Het WW-dagloon van de werknemer die uiterlijk binnen 12 maanden na de dag van beëindiging van een eerdere
      dienstbetrekking een andere dienstbetrekking is aangegaan, wordt, bij beëindiging van deze nieuwe dienstbetrekking
      binnen 36 maanden na die eerdere beëindiging, niet lager vastgesteld dan op het WW-dagloon dat gold of zou hebben
      gegolden vanwege die eerdere dienstbetrekking. Het dagloon wordt in aanmerking genomen naar de mate waarin de
      nieuwe dienstbetrekking in de plaats is gekomen van de eerdere dienstbetrekking.
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel17
  - number: '17.2'
    text: |-
      De in het eerste lid genoemde termijn van 12 maanden wordt verlengd met in deze periode gelegen perioden van
      arbeidsongeschiktheid.
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel17
  - number: '17.3'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op het vast te stellen WW-dagloon vanwege alle doch binnen
      de termijn van 36 maanden na de dag van beëindiging van de in het eerste lid bedoelde eerdere dienstbetrekking
      aangegane en beëindigde nieuwe dienstbetrekkingen.
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel17
  - number: '17.4'
    text: |-
      Indien de werknemer op de dag van het beëindigen van de eerste dienstbetrekking de leeftijd van 55 jaar had bereikt
      is het eerste lid van toepassing op het vast te stellen WW-dagloon vanwege alle aangegane en beëindigde nieuwe
      dienstbetrekkingen.
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel17
  - number: '17.5'
    text: |-
      Het eerste lid is niet van toepassing op het vaststellen van het WW-dagloon indien de eerste dienstbetrekking is
      beëindigd:
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel17
  - number: 17.5.a
    text: als gevolg van verwijtbare werkloosheid van de werknemer;
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel17
  - number: 17.5.b
    text: |-
      als gevolg van het bereiken van de leeftijd waarop het uit deze dienstbetrekking voortvloeiende ouderdomspensioen
      aanvangt.
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel17
  - number: '18.1'
    text: |-
      Bij de vaststelling van het WW-dagloon van de werknemer die in het refertejaar, anders dan in een vaste
      dienstbetrekking, uitsluitend of vrijwel uitsluitend op basis van losse optredens als musicus of artiest werkzaam
      is geweest, wordt, bij de toepassing van [artikel 3, eerste lid][ref1], voorzover het betreft het loon dat met die
      optredens is verworven, rekening gehouden met 100/70 van dat loon.


      [ref1]: https://wetten.overheid.nl/BWBR0018842#Artikel3
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0018842
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '18.2'
    text: |-
      Indien het eerste lid van toepassing is, is [artikel 6][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018842#Artikel6
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0018842
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '19'
    text: |-
      Het WIA-dagloon van de werknemer, die gedeeltelijk arbeidsongeschikt is als bedoeld in
      [artikel 46, derde lid, van de Wet WIA][ref1], bedraagt ten hoogste het maatmaninkomen, dat op grond van
      [artikel 46, derde lid][ref2], wordt vastgesteld vermenigvuldigd met het aantal uren van de urenomvang, bedoeld in
      [artikel 9, onderdeel b, van het Schattingsbesluit arbeidsongeschiktheidswetten][ref3], gedeeld door vijf.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0011478#Artikel9
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '46'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '46'
      - id: ref3
        bwb_id: BWBR0011478
        artikel: '9'
  - number: '20'
    text: |-
      In de gevallen waarin de [artikelen 48, eerste lid, onderdelen b en c][ref1], en
      [55, eerste lid, onderdelen b en c, van de Wet WIA][ref2] van toepassing zijn, wordt het WIA-dagloon niet
      lager vastgesteld dan het dagloon dat op grond van de [Wet WIA][ref3] in aanmerking zou zijn genomen als de
      uitkering zou zijn ingetreden op de in [artikel 47, tweede lid][ref4], en [54, tweede lid van de Wet WIA][ref5]
      bedoelde dag, zoals dat dagloon vanaf die dag tot aan de datum van het recht op uitkering op grond van
      [artikel 14, eerste lid, van de Wet WIA][ref6] zou zijn herzien, indien het recht op uitkering op grond van de
      [Wet WIA][ref7] op die dag zou zijn ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0019057
      [ref4]: https://wetten.overheid.nl/BWBR0019057#Artikel47
      [ref5]: https://wetten.overheid.nl/BWBR0019057#Artikel54
      [ref6]: https://wetten.overheid.nl/BWBR0019057#Artikel14
      [ref7]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '48'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '55'
      - id: ref3
        bwb_id: BWBR0019057
      - id: ref4
        bwb_id: BWBR0019057
        artikel: '47'
      - id: ref5
        bwb_id: BWBR0019057
        artikel: '54'
      - id: ref6
        bwb_id: BWBR0019057
        artikel: '14'
      - id: ref7
        bwb_id: BWBR0019057
  - number: '21.1'
    text: |-
      Indien de werknemer op de eerste dag waarop recht bestaat op uitkering op grond van de [ZW][ref1], de
      [Wet WIA][ref2], de [WAO][ref3], de [Wet arbeid en zorg][ref4] of de [WW][ref5] jonger is dan 23 jaar en het op
      grond van [paragraaf 1 tot en met 6 ][ref6]berekende dagloon bij verjaring minder bedraagt dan het minimumloon,
      dat behoort bij de leeftijd van de werknemer bij zijn verjaring, vermeerderd met de vakantiebijslag, bedoeld in
      [artikel 15 van de WML][ref7], wordt dat dagloon bij zijn verjaring verhoogd door het te vermenigvuldigen met
      een breuk waarvan de teller wordt gevormd door het minimumjeugdloonpercentage dat verbonden is aan de leeftijd
      van de werknemer of door 100 indien de werknemer de leeftijd van 23 jaar heeft bereikt, en de noemer door het
      minimumjeugdloonpercentage dat verbonden is aan de leeftijd van de werknemer op de laatste dag voor zijn verjaring.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0019057
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0013008
      [ref5]: https://wetten.overheid.nl/BWBR0004045
      [ref6]: https://wetten.overheid.nl/BWBR0018842#Hoofdstuk2
      [ref7]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0019057
      - id: ref3
        bwb_id: BWBR0002524
      - id: ref4
        bwb_id: BWBR0013008
      - id: ref5
