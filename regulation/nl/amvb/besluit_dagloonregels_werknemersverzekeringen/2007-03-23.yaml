        bwb_id: BWBR0002524
        artikel: 21b
  - number: '1.2'
    text: |-
      In dit besluit wordt onder vakantiebijslag niet verstaan vakantiebijslag voldaan overeenkomstig
      [artikel 18, eerste lid, van de WML][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel18
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '18'
  - number: '1.3'
    text: |-
      [Artikel 40, tweede lid, van de WAO][ref1] is voor de bepaling van het refertejaar, bedoeld in het eerste lid,
      onderdeel q, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel40
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '40'
  - number: '2.1'
    text: |-
      Voor de toepassing van dit besluit wordt de werknemer geacht zijn loon te hebben genoten in het aangiftetijdvak
      waarover de werkgever van dat loon opgave heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel2
  - number: '2.2'
    text: |-
      Voorzover het loon bestaat uit een uitkering op grond van de [ZW][ref1], de [WW][ref2], de [WAO][ref3], de
      [Wet WIA][ref4] of [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref5], wordt bij de berekening
      van het dagloon in de plaats van die uitkering als loon in aanmerking genomen: ((100 x A) / B) – (C + D) waarbij:
      A staat voor de uitkering op grond van de [ZW][ref6], de [WW][ref7], de [WAO][ref8], de [Wet WIA][ref9] of
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref10]; B staat voor:


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0019057
      [ref5]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
      [ref6]: https://wetten.overheid.nl/BWBR0001888
      [ref7]: https://wetten.overheid.nl/BWBR0004045
      [ref8]: https://wetten.overheid.nl/BWBR0002524
      [ref9]: https://wetten.overheid.nl/BWBR0019057
      [ref10]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0002524
      - id: ref4
        bwb_id: BWBR0019057
      - id: ref5
        bwb_id: BWBR0013008
        paragraaf: '1'
      - id: ref6
        bwb_id: BWBR0001888
      - id: ref7
        bwb_id: BWBR0004045
      - id: ref8
        bwb_id: BWBR0002524
      - id: ref9
        bwb_id: BWBR0019057
      - id: ref10
        bwb_id: BWBR0013008
        paragraaf: '1'
  - number: 2.2.a
    text: 70, dan wel
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel2
  - number: 2.2.b
    text: |-
      indien het uitkeringspercentage van de uitkeringen op grond van de [ZW][ref1], de [WAO][ref2],
      [hoofdstuk 6 van de Wet WIA][ref3], [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref4] of
      [hoofdstuk IV van de WW][ref5] hoger is dan 70%, het uitkeringspercentage waarnaar de uitkering is berekend; of


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk6
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
      [ref5]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel2
