        bwb_id: BWBR0018842
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref7
        bwb_id: BWBR0002638
        artikel: '15'
  - number: '21.2'
    text: |-
      Het verhoogde dagloon bedraagt niet meer dan het minimumloon, dat behoort bij de leeftijd van de werknemer na
      verjaring, vermeerderd met de vakantiebijslag, bedoeld in [artikel 15 van de WML][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '15'
  - number: '22.1'
    text: |-
      Het dagloon bedraagt ten hoogste het op grond van
      [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref1] geldende bedrag met betrekking tot
      een loontijdvak van een dag.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel17
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '17'
  - number: '22.2'
    text: |-
      Indien een werknemer gelijktijdig aanspraak heeft op meerdere uitkeringen op grond van de [ZW][ref1], de
      [WW][ref2], de [Wet arbeid en zorg][ref3], de [WAO][ref4] of de [Wet WIA][ref5] en de som van de uitkeringen op
      grond van die wetten per dag meer bedraagt dan 70% van het bedrag, bedoeld in het eerste lid, worden de aan die
      uitkeringen ten grondslag liggende daglonen zodanig evenredig verminderd dat de som van de uitkeringen per dag niet
      langer meer bedraagt dan 70% van het bedrag, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0013008
      [ref4]: https://wetten.overheid.nl/BWBR0002524
      [ref5]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0013008
      - id: ref4
        bwb_id: BWBR0002524
      - id: ref5
        bwb_id: BWBR0019057
  - number: '22.3'
    text: |-
      Indien van een uitkering als bedoeld in het tweede lid het uitkeringspercentage hoger is dan 70 % wordt 70%
      van het bedrag, bedoeld in het eerste lid, verhoogd met: ((A – 70) / 100) x B waarbij: A staat voor het hogere
      uitkeringspercentage; B staat voor het dagloon van de uitkering, waarvoor het uitkeringspercentage A geldt.
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel22
  - number: '23'
    text: |-
      Indien aan een wijziging van de [Wet op de loonbelasting 1964][ref1] of een daarop gebaseerde
      regeling terugwerkende kracht is verleend, wordt bij de vaststelling van het dagloon met betrekking
      tot een recht op uitkering dat is ontstaan voor de datum van de inwerkingtreding van die wijziging,
      in afwijking van [artikel 2, eerste lid][ref2], onder loon verstaan het loon dat op grond van
      [hoofdstuk 3, afdeling 1, paragraaf 1, van de Wet financiering sociale verzekeringen][ref3] zou hebben gegolden
      zonder die wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0002471
      [ref2]: https://wetten.overheid.nl/BWBR0018842#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Paragraaf1
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002471
      - id: ref2
        bwb_id: BWBR0018842
        artikel: '2'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0017745
        paragraaf: '1'
  - number: '24.1'
    text: |-
      Op het loon, dat is genoten in aangiftetijdvakken voorafgaand aan de dag
      waarop dit besluit in werking treedt en voorafgaande aan de dag, waarop
      [artikel 48, derde lid, van de Invoeringswet Wet financiering sociale verzekeringen][ref1] in
      werking treedt, blijven de bepalingen van de [Coördinatiewet Sociale Verzekeringen][ref2],
      zoals die luidde op de dag voorafgaande aan de dag van inwerkingtreding van
      [artikel 48, derde lid, van de Invoeringswet Wet financiering sociale verzekeringen][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017747#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0002126
      [ref3]: https://wetten.overheid.nl/BWBR0017747#Artikel48
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0017747
        artikel: '48'
      - id: ref2
        bwb_id: BWBR0002126
      - id: ref3
        bwb_id: BWBR0017747
        artikel: '48'
  - number: '24.2'
    text: |-
      Indien de werknemer in de aangiftetijdvakken in refertejaren gelegen vóór 1 januari 2007 loon heeft genoten, waarin
      bedragen aan vakantiebijslag en van extra periodiek salaris zijn opgenomen, blijft [artikel 3, eerste lid][ref1],
      voor de dagloonberekening buiten aanmerking en wordt het dagloon berekend door het loon, dat de werknemer heeft
      genoten in het refertejaar te delen door 261.


      [ref1]: https://wetten.overheid.nl/BWBR0018842#Artikel3
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0018842
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '24.3'
    text: |-
      Het tweede lid is van overeenkomstige toepassing voor de dagloonberekening, bedoeld
      in[ artikel 2, zesde lid][ref1],[ 6, tweede lid][ref2], en [11, eerste en tweede lid][ref3], met dien verstande,
      dat daarbij alleen het loon, dat de werknemer heeft genoten in aanmerking wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0018842#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018842#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0018842#Artikel11
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0018842
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0018842
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0018842
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '24.4'
    text: |-
      [Artikel 12][ref1] zoals dat luidde op de dag voor inwerkingtreding van artikel I, onderdeel B, onder 1, 2, 3 of
      4, van het besluit van 28 september 2006 tot wijziging van enige algemene maatregelen van bestuur in verband met de
      inwerkingtreding van de Wet wijziging WW-stelsel en in verband met enige technische verbeteringen (Stb. 435) blijft
      van toepassing met betrekking tot een recht op uitkering waarvan de eerste werkloosheidsdag is gelegen voor de dag
      van inwerkingtreding van het desbetreffende subonderdeel alsmede op een recht op vervolguitkering dat is ontstaan
      op grond van [artikel 130h, eerste lid, aanhef en onderdelen b of c, of tweede lid, van de WW][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018842#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel130h
    url: https://wetten.overheid.nl/BWBR0018842/2007-03-23#Artikel24
    references:
