---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_uitgifte_staatsblad_en_staatscourant
regulatory_layer: AMVB
publication_date: '2009-02-03'
valid_from: '1989-01-13'
bwb_id: BWBR0004484
url: https://wetten.overheid.nl/BWBR0004484/1989-01-13
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Justitie van 22 juli 1988, nr. 343/688, gedaan mede namens Onze Minister van
    Binnenlandse Zaken;

    Gelet op artikel 89 van de Grondwet en artikel 8 van de Bekendmakingswet (Stb. 1988, 18);

    De Raad van State gehoord (advies van 28 oktober 1988, nr. WO3.88.0432);

    Gezien het nader rapport van Onze Ministeries van Justitie en van Binnenlandse Zaken van 30 december 1988, nr.
    580/288;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004484/1989-01-13#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004484/1989-01-13#Artikel1
  - number: 1.a
    text: |-
      Onze Minister: - in [hoofdstuk 2][ref1]: Onze Minister van Justitie;
        - in [hoofdstuk 3][ref2]: Onze Minister van Binnenlandse Zaken;


      [ref1]: https://wetten.overheid.nl/BWBR0004484#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0004484#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0004484/1989-01-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004484
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0004484
        hoofdstuk: '3'
  - number: 1.b
    text: |-
      de uitgever: het in [artikel 2][ref1] bedoelde bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0004484#Artikel2
    url: https://wetten.overheid.nl/BWBR0004484/1989-01-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004484
        artikel: '2'
        hoofdstuk: '1'
  - number: '2'
    text: |-
      Onze Ministers van Justitie en van Binnenlandse Zaken sluiten overeenkomsten tot het produceren, uitgeven en aan
      het publiek ter beschikking stellen van het *Staatsblad* onderscheidenlijk van de *Staatscourant* met een bedrijf
      dat ervoor zorg draagt daartoe over voldoende technische en organisatorische middelen te beschikken.
    url: https://wetten.overheid.nl/BWBR0004484/1989-01-13#Artikel2
  - number: '3'
    text: |-
      Onze Ministers van Justitie en van Binnenlandse Zaken bereiden de nodige vervangende voorzieningen voor, voor
      het geval door gebreken in de uitvoering van een overeenkomst als bedoeld in [artikel 2][ref1] of anderszins de
      uitgifte van het *Staatsblad* onderscheidenlijk van de *Staatscourant* stagneert.


      [ref1]: https://wetten.overheid.nl/BWBR0004484#Artikel2
    url: https://wetten.overheid.nl/BWBR0004484/1989-01-13#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004484
        artikel: '2'
        hoofdstuk: '1'
  - number: '4'
    text: |-
      In het *Staatsblad* wordt opgenomen al hetgeen waarvan een wet of koninklijk besluit bekendmaking in het
      *Staatsblad* voorschrijft, alsmede datgene wat in verband hiermee naar het oordeel van Onze Minister moet worden
      vermeld.
    url: https://wetten.overheid.nl/BWBR0004484/1989-01-13#Artikel4
  - number: '5.1'
    text: |-
      Wetten en koninklijke besluiten die in het *Staatsblad* moeten worden geplaatst, worden daartoe na de in
      [artikel 47 van de Grondwet][ref1] bedoelde ondertekening aan Onze Minister toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel47
    url: https://wetten.overheid.nl/BWBR0004484/1989-01-13#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '47'
  - number: '5.2'
    text: |-
      De als eerste ondertekenende minister of staatssecretaris draagt er zorg voor dat de toezending op een zodanig
      tijdstip plaatsvindt dat plaatsing in het *Staatsblad* tijdig kan geschieden.
    url: https://wetten.overheid.nl/BWBR0004484/1989-01-13#Artikel5
  - number: '6.1'
    text: Het *Staatsblad* wordt uitgegeven op door Onze Minister te bepalen tijdstippen.
    url: https://wetten.overheid.nl/BWBR0004484/1989-01-13#Artikel6
  - number: '6.2'
    text: Op het *Staatsblad* wordt de datum van uitgifte vermeld.
    url: https://wetten.overheid.nl/BWBR0004484/1989-01-13#Artikel6
  - number: '7'
    text: |-
      Wetten en koninklijke besluiten worden na plaatsing in het *Staatsblad* door Onze Minister teruggezonden aan het
      Kabinet der Koningin.
    url: https://wetten.overheid.nl/BWBR0004484/1989-01-13#Artikel7
  - number: '8'
    text: Voor publikatie in het *Staatsblad* worden geen kosten in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0004484/1989-01-13#Artikel8
  - number: '9.1'
    text: |-
      Het *Staatsblad* is bij abonnement en per afzonderlijk nummer voor het publiek verkrijgbaar. Afzonderlijke nummers
      zijn reeds op de dag van uitgifte verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0004484/1989-01-13#Artikel9
  - number: '9.2'
    text: |-
      Onze Minister maakt jaarlijks in de *Staatscourant* de in overleg tussen hem en de uitgever vastgestelde tarieven
      bekend.
    url: https://wetten.overheid.nl/BWBR0004484/1989-01-13#Artikel9
  - number: '10.1'
    text: De *Staatscourant* verschijnt dagelijks, met uitzondering van zondag, zaterdag en algemeen erkende feestdagen.
    url: https://wetten.overheid.nl/BWBR0004484/1989-01-13#Artikel10
  - number: '10.2'
    text: |-
      Onder algemeen erkende feestdagen worden verstaan de in [artikel 3 van de Algemene Termijnenwet][ref1] (*Stb.*
      1964, 314) als zodanig genoemde en de bij of krachtens dat artikel daarmee gelijkgestelde dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0002448#Artikel3
    url: https://wetten.overheid.nl/BWBR0004484/1989-01-13#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002448
        artikel: '3'
  - number: '10.3'
    text: |-
      In bijzondere gevallen verschijnt de *Staatscourant* op verzoek van Onze Minister op een in het eerste lid
      uitgezonderde dag.
    url: https://wetten.overheid.nl/BWBR0004484/1989-01-13#Artikel10
  - number: '11'
    text: 'In de *Staatscourant* worden opgenomen:'
    url: https://wetten.overheid.nl/BWBR0004484/1989-01-13#Artikel11
  - number: 11.a
    text: |-
      al hetgeen waarvan een wet, koninklijk besluit of ministerieel besluit bekendmaking in de *Staatscourant*
      voorschrijft;
    url: https://wetten.overheid.nl/BWBR0004484/1989-01-13#Artikel11
  - number: 11.b
    text: door Onze Minister aangewezen categorieën van publikaties, afkomstig van de centrale overheid.
    url: https://wetten.overheid.nl/BWBR0004484/1989-01-13#Artikel11
  - number: '12'
    text: |-
      De eerste ondertekenaar van een publikatie als bedoeld in [artikel 11][ref1] bepaalt het tijdstip van plaatsing van
      de publikatie in de *Staatscourant* en draagt er zorg voor dat de toezending op een zodanig tijdstip plaatsvindt
      dat de plaatsing tijdig kan geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0004484#Artikel11
    url: https://wetten.overheid.nl/BWBR0004484/1989-01-13#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004484
        artikel: '11'
        hoofdstuk: '3'
  - number: '13.1'
    text: |-
      In de *Staatscourant* kunnen voorts, voor zover verenigbaar met het karakter van de *Staatscourant* als officieel
      publikatieblad van het Koninkrijk der Nederlanden, worden opgenomen:
    url: https://wetten.overheid.nl/BWBR0004484/1989-01-13#Artikel13
  - number: 13.1.a
    text: |-
      nieuws en beschouwingen met betrekking tot activiteiten van de centrale overheid en daarmee verband houdende
      maatschappelijke vraagstukken;
    url: https://wetten.overheid.nl/BWBR0004484/1989-01-13#Artikel13
  - number: 13.1.b
    text: |-
      andere publikaties van overheidsinstellingen of -organen dan bedoeld in [artikel 11][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004484#Artikel11
    url: https://wetten.overheid.nl/BWBR0004484/1989-01-13#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004484
        artikel: '11'
        hoofdstuk: '3'
  - number: 13.1.c
    text: publikaties van anderen.
    url: https://wetten.overheid.nl/BWBR0004484/1989-01-13#Artikel13
  - number: '13.2'
    text: Onze Minister kan met betrekking tot het bepaalde in het eerste lid algemene of bijzondere aanwijzingen geven.
    url: https://wetten.overheid.nl/BWBR0004484/1989-01-13#Artikel13
  - number: '14.1'
    text: |-
      Onze Minister kan bepalen dat daarvoor in aanmerking komende categorieën van publikaties in afzonderlijke
      permanente bijvoegsels bij de *Staatscourant* worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0004484/1989-01-13#Artikel14
  - number: '14.2'
    text: |-
      Met inachtneming van het bepaalde in [artikel 4, tweede lid, van de Bekendmakingswet][ref1], kan een publikatie
      die daarvoor wegens haar omvang in aanmerking komt, in een afzonderlijk supplement bij de *Staatscourant* worden
      opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel4
    url: https://wetten.overheid.nl/BWBR0004484/1989-01-13#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '4'
  - number: '15'
    text: |-
      Voor andere publikaties dan die van vanwege het Rijk vastgestelde algemeen verbindende voorschriften kunnen
      advertentiekosten in rekening worden gebracht.
    url: https://wetten.overheid.nl/BWBR0004484/1989-01-13#Artikel15
  - number: '16'
    text: |-
      De *Staatscourant* en de bijvoegsels bij de *Staatscourant* zijn bij abonnement en per afzonderlijk nummer voor
      het publiek verkrijgbaar. Afzonderlijke nummers zijn met ingang van de eerstvolgende verschijningsdag, bedoeld in
      [artikel 10, eerste lid][ref1], verkrijgbaar, alsmede in bijzondere, door Onze Minister te bepalen, gevallen op de
      dag van verschijning.


      [ref1]: https://wetten.overheid.nl/BWBR0004484#Artikel10
    url: https://wetten.overheid.nl/BWBR0004484/1989-01-13#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004484
        artikel: '10'
        hoofdstuk: '3'
  - number: '17'
    text: |-
      Onze Minister maakt jaarlijks in de *Staatscourant* de in overleg tussen hem en de uitgever vastgestelde tarieven
      bekend voor:
    url: https://wetten.overheid.nl/BWBR0004484/1989-01-13#Artikel17
  - number: 17.a
    text: abonnementen op de *Staatscourant* en afzonderlijke nummers, inclusief supplementen;
    url: https://wetten.overheid.nl/BWBR0004484/1989-01-13#Artikel17
  - number: 17.b
    text: abonnementen op bijvoegsels bij de *Staatscourant* en afzonderlijke nummers daarvan;
    url: https://wetten.overheid.nl/BWBR0004484/1989-01-13#Artikel17
  - number: 17.c
    text: advertenties in de *Staatscourant*, in supplementen en in bijvoegsels.
    url: https://wetten.overheid.nl/BWBR0004484/1989-01-13#Artikel17
  - number: '18'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0004484/1989-01-13#Artikel18
  - number: '19'
    text: Dit besluit kan worden aangehaald als Besluit uitgifte Staatsblad en Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004484/1989-01-13#Artikel19
