        artikel: '5'
      - id: ref3
        bwb_id: BWBR0003205
        artikel: '6'
  - number: '8'
    text: |-
      1 De ijkinstelling verricht het onderzoek, bedoeld in [artikel 5:18 van de Algemene wet bestuursrecht][ref1], van
      tapmaatflessen voorzien van het EEG-teken bij de fabrikanten en importeurs van zodanige flessen volgens een door
      Onze Minister aan te wijzen steekproefmethode.

      2 Indien bij een onderzoek als bedoeld in het eerste lid niet wordt voldaan aan het bij de toegepaste
      steekproefmethode behorende goedkeurcriterium, levert dit ten aanzien van alle tapmaatflessen, die behoren
      tot de partij waaruit de steekproef is getrokken, het vermoeden op dat zij niet voldoen aan het bepaalde in
      [artikel 6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel518
      [ref2]: https://wetten.overheid.nl/BWBR0003205#Artikel6
    url: https://wetten.overheid.nl/BWBR0003205/1998-09-11#Artikel8
    references:
