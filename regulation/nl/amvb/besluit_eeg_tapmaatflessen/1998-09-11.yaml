articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      tapmaatflessen: gesloten of afsluitbare flessen, vervaardigd van glas of enig ander materiaal waarvan de
      eigenschappen ter zake van stijfheid en vormvastheid dezelfde metrologische waarborgen bieden als glas, welke
      flessen:

      a. bestemd zijn voor opslag, vervoer of aflevering daarin van een vloeistof;

      b. een nominaal volume hebben van niet minder dan 0,05 liter doch niet meer dan 5 liter, en

      c. zodanige metrologische eigenschappen zoals kenmerken van vorm en regelmaat van vervaardiging bezitten dat zij
      na vulling tot een bepaald niveau of tot een bepaald gedeelte van hun strijkvolle inhoud te zamen met een daartoe
      geschikte lengtemaat als meetmiddel kunnen worden gebruikt ter bepaling van de hoeveelheid vloeistof, die zij
      bevatten;

      nominaal volume van een tapmaatfles (Vn): het op een tapmaatfles aangegeven vloeistofvolume, dat die fles bij 20°C
      wordt geacht te bevatten, indien deze is gevuld onder de gebruiksomstandigheden waarvoor die fles is bestemd;

      strijkvolle inhoud van een tapmaatfles: het vloeistofvolume, dat een tapmaatfles bij 20°C bevat, indien deze tot
      het strijkvlak is gevuld;

      werkelijk volume van een tapmaatfles: het vloeistofvolume, dat een tapmaatfles bij 20°C bij vulling overeenkomstig
      de voor die fles bestemde methode bevat;

      EEG-teken: het teken 3 (gespiegelde epsilon);

      wet: de [IJkwet][ref1] (*Stb.* 1989, 10);

      Onze Minister: Onze Minister van Economische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0009082
    url: https://wetten.overheid.nl/BWBR0003205/1998-09-11#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009082
  - number: '2'
    text: |-
      1 Een fabrikant van tapmaatflessen kan bij de ijkinstelling schriftelijk de goedkeuring van een identificatieteken
      voor door hem vervaardigde tapmaatflessen aanvragen.

      2 De ijkinstelling verleent zijn goedkeuring aan een identificatieteken, indien het naar zijn oordeel geschikt is
      om als zodanig door de betrokken fabrikant te worden gebruikt.

      3 De ijkinstelling doet van de goedkeuring van een identificatieteken binnen één maand mededeling aan de bevoegde
      diensten van de andere Lid-Staten van de Europese Unie, de andere Staten die partij zijn bij de Overeenkomst
      betreffende de Europese Economische Ruimte en aan de Commissie van de Europese Gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0003205/1998-09-11#Artikel2
  - number: '3'
    text: |-
      Tapmaatflessen mogen uitsluitend zijn voorzien van het EEG-teken, indien zij voldoen aan het bepaalde in de
      [artikelen 4][ref1], [5][ref2] en [6][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003205#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003205#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0003205#Artikel6
    url: https://wetten.overheid.nl/BWBR0003205/1998-09-11#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003205
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0003205
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0003205
        artikel: '6'
  - number: '4'
    text: |-
      1 Het EEG-teken moet zijn aangebracht op het zijvlak, de onderrand of de bodem; dat teken moet ten minste 3 mm
      hoog zijn.

      2 Op één der in het eerste lid aangegeven plaatsen moeten de volgende aanduidingen zijn aangebracht:

      a. het nominale volume in liter, centiliter of milliliter, weergegeven in cijfers met een minimale hoogte van 6
      mm bij een nominaal volume van meer dan 100 cl, van 4 mm bij een nominaal volume van meer dan 20 cl doch niet meer
      dan 100 cl en van 3 mm bij een nominaal volume van 20 cl of minder, en gevolgd door het symbool of de naam van de
      gebruikte meeteenheid;

      b. het identificatieteken van de fabrikant, waarvoor een door de ijkinstelling of een door de bevoegde dienst van
      een andere Lid-Staat van de Europese Unie of een andere Staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte verleende goedkeuring geldt.

      3 Op de bodem of de onderrand moet of moeten - al naar gelang de voor die fles bestemde vulmethode of vulmethoden -
      zijn aangebracht:

      a. de aanduiding van de strijkvolle inhoud in centiliter, weergegeven in cijfers en niet gevolgd door het symbool
      of de naam van die meeteenheid;

      b. de aanduiding van de afstand in millimeter tussen het strijkvlak en het met het nominale volume overeenkomende
      vulniveau, weergegeven in cijfers, gevolgd door het symbool mm.

      4 De cijfers, bedoeld in het derde lid, moeten een minimale hoogte hebben, gelijk aan die welke voor het weergeven
      van het nominale volume van de betrokken fles in het tweede lid, onder *a*, is voorgeschreven.

      5 Het EEG-teken en de in het tweede en derde lid bedoelde aanduidingen moeten onuitwisbaar, gemakkelijk leesbaar en
      goed zichtbaar zijn; de in het derde lid bedoelde aanduidingen moeten op zodanige wijze zijn aangebracht, dat geen
      verwarring kan ontstaan met de aanduidingen, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0003205/1998-09-11#Artikel4
  - number: '5'
    text: |-
      Aanduidingen in woord of beeld, die verward kunnen worden met het EEG-teken of met aanduidingen als bedoeld in
      [artikel 4, eerste, tweede of derde lid][ref1], mogen op tapmaatflessen niet aanwezig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003205#Artikel4
    url: https://wetten.overheid.nl/BWBR0003205/1998-09-11#Artikel5
    references:
