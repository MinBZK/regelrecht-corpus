    url: https://wetten.overheid.nl/BWBR0003205/1998-09-11#Artikel6
  - number: '7'
    text: |-
      Het is een fabrikant en een importeur van tapmaatflessen verboden van het EEG-teken voorziene tapmaatflessen ten
      verkoop voorhanden te hebben, ten verkoop aan te bieden of in de handel te brengen, indien ten aanzien van die
      tapmaatflessen niet wordt voldaan aan het bepaalde in de [artikelen 4][ref1], [5][ref2] en [6][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003205#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003205#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0003205#Artikel6
    url: https://wetten.overheid.nl/BWBR0003205/1998-09-11#Artikel7
    references:
