        artikel: '12'
        paragraaf: '4'
  - number: 2a
    text: |-
      1 Vleesbereidingen en gehakt vlees worden op hygiënische wijze bereid, behandeld, bewerkt, verwerkt en verhandeld,
      en voorzien van passende etikettering.

      2 Onze Minister stelt ter uitvoering van [richtlijn 94/65/EG](31994L0065) bij ministeriële regeling nadere regels
      vast inzake het eerste lid, met dien verstande dat daarbij gebruik wordt gemaakt van de mogelijkheden, bedoeld
      in [artikel 4][ref1], [artikel 5, vijfde lid][ref2], en [artikel 6][ref3], van [richtlijn 94/65/EG](31994L0065).
      De afwijking, bedoeld in [artikel 5, vijfde lid][ref4], eerste alinea, van [richtlijn 94/65/EG](31994L0065), zal
      uitsluitend gelden voor werkplaatsen die:

      a. per week niet meer dan 7,5 ton vleesbereidingen produceren; of

      b. op grond van [artikel 10 van het Besluit produktie en handel vers vlees][ref5] zijn erkend en per week niet meer
      dan 5 ton vleesbereidingen produceren.


      [ref1]: https://wetten.overheid.nl/BWBR0009675#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009675#Artikel5
