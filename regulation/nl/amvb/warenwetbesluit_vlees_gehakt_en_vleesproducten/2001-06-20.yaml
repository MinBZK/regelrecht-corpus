  - number: '2'
    text: |-
      1 Het is verboden vlees, wildezwijnenvlees, separatorvlees, gehakt vlees, vleesbereidingen, gehakt, en
      vleesproducten, te bereiden of te verhandelen die niet voldoen aan de bij of krachtens dit besluit met betrekking
      tot hun samenstelling gestelde eisen.

      2 Het is verboden vleesbereidingen en gehakt vlees te bereiden, te behandelen, te bewerken, of te verwerken anders
      dan met inachtneming van de krachtens dit besluit gestelde voorschriften.

      3 Het is verboden vleesbereidingen en gehakt vlees te bereiden, te behandelen, te bewerken, of te verwerken anders
      dan in werkplaatsen die krachtens dit besluit zijn erkend.

      4 Het is verboden vleesbereidingen en gehakt vlees te verhandelen, niet zijnde verhandeling aan de eindverbruiker,
      anders dan in een verpakking die voldoet aan de krachtens dit besluit gestelde eisen.

      5 Het is verboden met gebruikmaking van de bij dit besluit aangegeven aanduidingen andere waren te verhandelen dan
      die waaraan die aanduidingen bij dit besluit zijn voorbehouden.

      6 Het is verboden vlees, gehakt of vleesproducten te verhandelen anders dan met inachtneming van
      [artikel 12][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009675#Artikel12
    url: https://wetten.overheid.nl/BWBR0009675/2001-06-20#Artikel2
    references:
