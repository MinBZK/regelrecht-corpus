  - number: '3'
    text: |-
      Bij de bereiding van eetwaren wordt geen gebruik gemaakt van:

      a. fijnverdeelde beenderen;

      b. fijnverdeeld kraakbeen;

      c. uit beenderen of uit kraakbeen bereide producten, met uitzondering van gelatine of bouillon;

      d. darmen die ten gevolge van een bewerking kleurstoffen en andere stoffen dan die, eigen aan vlees of
      vleesproducten, aan de waar kunnen afgeven;

      e. bloed en daarvan afgeleide producten waaraan andere levensmiddelenadditieven zijn toegevoegd dan die welke
      ter zake zijn toegelaten krachtens het [Warenwetbesluit Levensmiddelenadditieven][ref1] onder de daarbij vermelde
      voorwaarden;

      f. schildklierweefsel.


      [ref1]: https://wetten.overheid.nl/BWBR0005456
    url: https://wetten.overheid.nl/BWBR0009675/2001-06-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005456
  - number: 3a
    text: |-
      Separatorvlees van:

      a. kopbeenderen en poten onder het kniegewricht of onder het spronggewricht van andere slachtdieren dan runderen,
      schapen en geiten;

      b. runderen, schapen en geiten; of

      c. varkensstaarten;

      wordt niet bereid, verhandeld of verwerkt in eet- of drinkwaren.
    url: https://wetten.overheid.nl/BWBR0009675/2001-06-20#Artikel3a
  - number: 3b
    text: Trichinella is niet aantoonbaar in 10,0 gram wildezwijnenvlees..
    url: https://wetten.overheid.nl/BWBR0009675/2001-06-20#Artikel3b
  - number: '4'
    text: |-
      Het zetmeelgehalte van een op de voet van [artikel 6][ref1], [7][ref2], [8][ref3],[ 9][ref4] of [10][ref5]
      aangeduide, gepaneerde waar bedraagt ten hoogste 6%.


