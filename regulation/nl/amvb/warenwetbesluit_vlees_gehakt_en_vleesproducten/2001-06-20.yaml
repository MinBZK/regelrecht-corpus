  - number: '5'
    text: |-
      1 Het Federgetal van gehakt, en van een andere eetwaar met ten minste 80% vlees, is ten hoogste 4,0.

      2 Het eerste lid is niet van toepassing indien de daar bedoelde waar:

      a. zich bevindt in azijn, in een waterige keukenzoutoplossing, of in een andere waterige oplossing; of

      b. bereid is met gelei.

      3 Het eerste lid is niet van toepassing op een als *bloedworst, balkenbrij, bakleverworst, hoofdkaas, beuling,
      preskop* of *zure zult* aangeduide eetwaar.

      4 In afwijking van het eerste lid mag gehakt, of een andere eetwaar met ten minste 80% vlees, een hoger Federgetal
      dan 4,0 hebben, voor zover de aanduiding van die waar vergezeld gaat van beschrijvende vermeldingen waardoor de
      consument in staat is die waar te onderscheiden van een in het eerste lid bedoelde waar met een Federgetal van ten
      hoogste 4,0.
    url: https://wetten.overheid.nl/BWBR0009675/2001-06-20#Artikel5
  - number: '6'
    text: |-
      De aanduiding *vlees* mag uitsluitend worden gebezigd voor vlees, niet zijnde bloed, voor zover die aanduiding
      vergezeld gaat van de naam van het soort slachtdier waarvan het vlees afkomstig is.
    url: https://wetten.overheid.nl/BWBR0009675/2001-06-20#Artikel6
  - number: '7'
    text: |-
      De aanduiding *gehakt* mag uitsluitend worden gebezigd voor gehakt met een vetgehalte van ten hoogste 35%, voor
      zover die aanduiding vergezeld gaat van:

        - de naam van het soort slachtdier; of
        - in volgorde van afnemend gewicht, de namen van de soorten slachtdieren; waarvan het vlees afkomstig is.
    url: https://wetten.overheid.nl/BWBR0009675/2001-06-20#Artikel7
  - number: '8'
    text: |-
      De aanduiding *half om half* mag uitsluitend worden gebezigd voor gehakt dat voor de ene helft van runderen en
      voor de andere helft van varkens afkomstig is, waarbij in de onderlinge verhouding een afwijking van 10% absoluut
      is toegestaan.
    url: https://wetten.overheid.nl/BWBR0009675/2001-06-20#Artikel8
  - number: '9'
    text: |-
      De aanduiding *tartaar* mag uitsluitend worden gebezigd voor gehakt dat afkomstig is van runderen, met een
      vetgehalte van ten hoogste 10%.
    url: https://wetten.overheid.nl/BWBR0009675/2001-06-20#Artikel9
  - number: '10'
    text: |-
      De aanduiding *gehakte biefstuk* mag uitsluitend worden gebezigd voor gehakt dat afkomstig is van runderen, met een
      vetgehalte van ten hoogste 6%.
    url: https://wetten.overheid.nl/BWBR0009675/2001-06-20#Artikel10
  - number: '12'
    text: |-
      De vermelding *mager* of *magere* mag worden gebezigd bij:

      a. vlees en vleesproducten, uitsluitend voorzover het vetgehalte van de waar ten hoogste 20% bedraagt;

      b. gehakt van mager vlees, uitsluitend voorzover het vetgehalte van de waar ten hoogste 7% bedraagt.
    url: https://wetten.overheid.nl/BWBR0009675/2001-06-20#Artikel12
  - number: '13'
    text: |-
      1 Als methoden van onderzoek welke bij uitsluiting beslissend zijn voor de vaststelling of al dan niet is voldaan
      aan de bij dit besluit gestelde regels, worden aangewezen chromatografische, fysische, chemische en andere
      scheidingsmethoden, organoleptische bepalingsmethoden en detectiemethoden, alsmede de daartoe door een andere lid-
      staat van de Europese Unie aangewezen methoden.

      2 Onze Minister kan nadere regels vaststellen inzake het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009675/2001-06-20#Artikel13
  - number: '14'
    text: Het Vlees- en vleeswarenbesluit (Warenwet) 1987 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009675/2001-06-20#Artikel14
  - number: '15'
    text: |-
      1 Dit besluit treedt in werking met ingang van 1 juli 1998, met dien verstande dat voorverpakte eetwaren die zijn
      aangeduid op de voet van artikel 6, tweede lid, van het Vlees- en vleeswarenbesluit (Warenwet) 1987 zoals dat
      luidde onmiddellijk vóór 1 juli 1998, nog verhandeld mogen worden tot 14 februari 2000.

      2 [Artikel 11][ref1] is niet van toepassing voor zover overeenkomstig een ter uitvoering van [richtlijn 97/4/EG]
      (31997L0004) in het [Warenwetbesluit Etikettering van levensmiddelen][ref2] getroffen maatregel een kwantitatieve
      vermelding van ingrediënten wordt gebezigd, en vervalt met ingang van 14 februari 2000.


