preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 3 oktober 1997, nr. GZB/
    VVB/975553, gedaan in overeenstemming met Onze Ministers van Economische Zaken en van Landbouw, Natuurbeheer en
    Visserij;

    Gelet op beschikking nr. 97/534/EG van de Commissie van 30 juli 1997 houdende verbod, in verband met overdraagbare
    spongiforme encefalopathieën, op het gebruik van risicomateriaal (PbEG L 216), op artikel 11, eerste lid, van de
    Wijzigingswet 1988 Warenwet, alsmede op artikel 4, eerste lid, onder a, artikel 8, onder b en c, artikel 12 en
    artikel 14 van de Warenwet;

    De Raad van State gehoord (advies van 18 december 1997, no. W13.97.0642);

    Gezien het nader rapport van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 2 juni 1998 met
    nummer GZB/VVB/982331, uitgebracht in overeenstemming met Onze Ministers van Economische Zaken en van Landbouw,
    Natuurbeheer en Visserij;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009675/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. *slachtdier:* runderen (de soorten Bubalus bubalis en Bison bison daaronder begrepen), varkens, schapen, geiten
      en eenhoevigen en niet-gedomesticeerde landzoogdieren, niet zijnde lagomorfen, die in gevangenschap zijn gekweekt,
      gehouden en geslacht;

      b. *vlees:* alle voor menselijke consumptie geschikte delen van als landbouwhuisdier gehouden slachtdieren;

      c. *separatorvlees:* vlees dat machinaal is afgescheiden van beenderen met daaraan vastzittend vlees;

      d. *gehakt vlees:* vlees dat in kleine stukken is gehakt of door een gehaktmolen is gehaald;

      e. *kruiderijen:* zout voor menselijke consumptie, mosterd, specerijen en aromatische extracten daarvan,
      aromatische kruiden en aromatische extracten daarvan;

      f. *vleesbereiding:* vlees waaraan eet- of drinkwaren, kruiderijen of levensmiddelenadditieven zijn toegevoegd,
      of dat een behandeling heeft ondergaan in een mate die niet volstaat om de inwendige celstructuur van het vlees te
      veranderen zodat de kenmerken van vers vlees niet zijn verdwenen;

      g. *gehakt:* al dan niet toebereide vleesbereiding, niet zijnde separatorvlees, afkomstig van één of meer
      slachtdieren, die:

        - door hakken, malen of op andere wijze min of meer sterk verkleind is; zodanig kneedbaar is dat het tot
      verschillende vormen te bewerken is; en
        - geen vleesvreemd eiwit bevat;

      h. *vleesproduct:* product bereid van of met zodanig behandeld vlees dat, aan de hand van het snijvlak van de
      hartdoorsnijding, de verdwijning van de kenmerken van vers vlees kan worden geconstateerd, met uitzondering van
      vlees dat alleen een koudebehandeling heeft ondergaan, gehakt vlees en vleesbereidingen;

      i. *zetmeelgehalte:* gehalte aan watervrij zetmeel;

      j. *procentueel gehalte aan organisch niet-vet:* het percentage dat wordt verkregen door het percentage 100 te
      verminderen met het procentuele water-, vet-, zetmeel- en asgehalte van de waar;

      k. *Federgetal:* het quotiënt van het procentuele watergehalte en het procentuele gehalte aan organisch niet-vet
      van de waar;

      l. *startercultuur:* reincultuur van één type micro-organisme of een mengsel van meer dan één type micro-
      organismen, beide bedoeld om een fermentatieproces te sturen en te versnellen;

      m. *%:* massaprocent;

      n. *wildezwijnenvlees*: spiervlees afkomstig van varkens die niet in gevangenschap zijn gekweekt, niet in
      gevangenschap zijn gehouden en niet in gevangenschap zijn geslacht;

      o. *verordening (EG) 1760/2000*: [verordening (EG) nr. 1760/2000](32000R1760) van het Europees Parlement en de Raad
      van de Europese Unie van 17 juli 2000 (PbEG L 204) tot vaststelling van een identificatie- en registratieregeling
      voor runderen en inzake de etikettering van rundvlees en rundvleesproducten en tot intrekking van [verordening (EG)
      nr. 820/97](31997R0820) van de Raad van de Europese Unie;

      p. *verordening (EG) 1825/2000*: [verordening (EG) nr. 1825/2000](32000R1825) van de Commissie van de Europese
      Gemeenschappen van 25 augustus 2000 tot vaststelling van de uitvoeringsbepalingen van [verordening (EG)
      nr. 1760/2000](32000R1760) van het Europees Parlement en de Raad van de Europese Unie met betrekking tot de
      etikettering van rundvlees en van rundvleesproducten (PbEG L 216);

      q. *verordening (EG) 1333/2008:* verordening (EG) nr. 1333/2008 van het Europees Parlement en de Raad van de
      Europese Unie van 16 december 2008 inzake levensmiddelenadditieven (PbEU L 354);

      r. *verordening (EU) 1169/2011:* Verordening (EU) nr. 1169/2011 van het Europees Parlement en de Raad van
      25 oktober 2011 betreffende de verstrekking van voedselinformatie aan consumenten, tot wijziging van Verordeningen
      (EG) nr. 1924/2006 en (EG) nr. 1925/2006 van het Europees Parlement en de Raad en tot intrekking van Richtlijn
      87/250/EEG van de Commissie, Richtlijn 90/496/EEG van de Raad, Richtlijn 1999/10/EG van de Commissie, Richtlijn
      2000/13/EG van het Europees Parlement en de Raad, Richtlijnen 2002/67/EG en 2008/5/EG van de Commissie, en
      Verordening (EG) nr. 608/2004 van de Commissie (PbEU 2011, L 304).

      2 De darm of het darmvervangend omhulsel van in dit besluit bedoelde waren is geen verpakkingsmateriaal als bedoeld
      in artikel 2, tweede lid, onder e, van verordening (EU) 1169/2011.

      3 Voor vlees, gehakt en vleesproducten wordt een startercultuur aangemerkt als technisch hulpmiddel, bedoeld in
      artikel 20, onderdeel b, onder ii, van Verordening (EU) nr. 1169/2011 van het Europees Parlement en de Raad van
      25 oktober 2011 betreffende de verstrekking van voedselinformatie aan consumenten, tot wijziging van Verordeningen
      (EG) nr. 1924/2006 en (EG) nr. 1925/2006 van het Europees Parlement en de Raad en tot intrekking van Richtlijn
      87/250/EEG van de Commissie, Richtlijn 90/496/EEG van de Raad, Richtlijn 1999/10/EG van de Commissie, Richtlijn
      2000/13/EG van het Europees Parlement en de Raad, Richtlijnen 2002/67/EG en 2008/5/EG van de Commissie, en
      Verordening (EG) nr. 608/2004 van de Commissie (PbEU 2011, L 304).
    url: https://wetten.overheid.nl/BWBR0009675/2026-01-01#Artikel1
  - number: '2'
    text: |-
      1 Het is verboden vlees, wilde zwijnenvlees, separatorvlees, gehakt vlees, vleesbereidingen, gehakt en
      vleesproducten te bereiden, te behandelen, te bewerken, te verwerken, te verpakken, te bewaren, te vervoeren of te
      verhandelen anders dan met inachtneming van de bij of krachtens dit besluit gestelde voorschriften.

      2 Het is verboden met gebruikmaking van de bij dit besluit aangegeven aanduidingen en vermeldingen andere waren te
      verhandelen dan die waaraan die aanduidingen en vermeldingen bij dit besluit zijn voorbehouden.

      3 Het is verboden te handelen in strijd met de artikelen 11, 13, eerste, tweede en vijfde lid, 14, 15 en 15bis
      van [verordening (EG) 1760/2000](32000R1760) en met de artikelen 1, 2, tweede lid, 4, eerste en tweede lid, 5bis,
      eerste lid, 5ter, 5quater, eerste en tweede lid, en 7, eerste en vierde lid, van [verordening (EG) 1825/2000]
      (32000R1825).
    url: https://wetten.overheid.nl/BWBR0009675/2026-01-01#Artikel2
  - number: '3'
    text: |-
      Bij de bereiding van eetwaren wordt geen gebruik gemaakt van:

      a. fijnverdeelde beenderen;

      b. fijnverdeeld kraakbeen;

      c. uit beenderen of uit kraakbeen bereide producten, met uitzondering van gelatine of bouillon;

      d. darmen die ten gevolge van een bewerking kleurstoffen en andere stoffen dan die, eigen aan vlees of
      vleesproducten, aan de waar kunnen afgeven;

      e. bloed en daarvan afgeleide producten waaraan andere levensmiddelenadditieven zijn toegevoegd dan die welke ter
      zake zijn toegelaten bij of krachtens verordening (EG) 1333/2008 onder de daarbij vermelde voorwaarden;

      f. schildklierweefsel.
    url: https://wetten.overheid.nl/BWBR0009675/2026-01-01#Artikel3
  - number: 3a
    text: |-
      Separatorvlees van:

      a. kopbeenderen en poten onder het kniegewricht of onder het spronggewricht van andere slachtdieren dan runderen,
      schapen en geiten;

      b. runderen, schapen en geiten; of

      c. varkensstaarten;

      wordt niet bereid, verhandeld of verwerkt in eet- of drinkwaren.
    url: https://wetten.overheid.nl/BWBR0009675/2026-01-01#Artikel3a
  - number: 3b
    text: Trichinella is niet aantoonbaar in 10,0 gram wildezwijnenvlees.
    url: https://wetten.overheid.nl/BWBR0009675/2026-01-01#Artikel3b
  - number: '4'
    text: |-
      1 Het zetmeelgehalte van een op de voet van [artikel 6][ref1], [7][ref2], [8][ref3],[ 9][ref4] of [10][ref5]
      aangeduide, gepaneerde waar bedraagt ten hoogste 6%.

      2 Het eerste lid is niet van toepassing op:

      a. een voorverpakt levensmiddel als bedoeld in artikel 2, tweede lid, onder e, van verordening (EU) 1169/2011; of

      b. een onverpakte waar ten aanzien waarvan de hoeveelheid vlees voor het publiek duidelijk zichtbaar is aangebracht
      op het voorwerp waarin of waarop de waar zich bevindt, of op een onmiddellijk boven bedoeld voorwerp geplaatst(e)
      bord of kaart.


      [ref1]: https://wetten.overheid.nl/BWBR0009675#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009675#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0009675#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0009675#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0009675#Artikel10
    url: https://wetten.overheid.nl/BWBR0009675/2026-01-01#Artikel4
