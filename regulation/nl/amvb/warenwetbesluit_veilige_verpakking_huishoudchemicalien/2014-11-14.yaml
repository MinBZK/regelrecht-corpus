articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. huishoudchemicaliën:

      1° stoffen en preparaten waarvan de verpakking krachtens de verordening (EG) nr. 1272/2008 van het
      Europees Parlement en de Raad van de Europese Unie van 16 december 2008 betreffende de indeling,
      etikettering en verpakking van stoffen en mengsels tot wijziging en intrekking van de Richtlijnen 67/548/
      EEG en 1999/45/EG en tot wijziging van Verordening (EG) nr. 1907/2006 (PbEU L 353) respectievelijk het
      [Besluit verpakking en aanduiding milieugevaarlijke stoffen en preparaten][ref1] moet zijn geëtiketteerd als zeer
      vergiftig, vergiftig of bijtend;

      2° preparaten waarvan de verpakking krachtens het
      [Besluit verpakking en aanduiding milieugevaarlijke stoffen en preparaten][ref2] moet zijn geëtiketteerd als
      «schadelijk: kan longschade veroorzaken na verslikken»;

      3°. preparaten die methanol bevatten in een concentratie van 3 procent of meer;

      4°. preparaten die dichloormethaan bevatten in een concentratie van 1 procent of meer;

      5°. stoffen en preparaten waarvan de verpakking krachtens de verordening (EG) nr. 1272/2008 van het Europees
      Parlement en de Raad van de Europese Unie van 16 december 2008 betreffende de indeling, etikettering en
      verpakking van stoffen en mengsels tot wijziging en intrekking van de Richtlijnen 67/548/EEG en 1999/45/EG en tot
      wijziging van Verordening (EG) nr. 1907/2006 (PbEU L 353) respectievelijk het Besluit verpakking en aanduiding
      milieugevaarlijke stoffen of preparaten moet zijn geëtiketteerd als schadelijk, zeer licht ontvlambaar of licht
      ontvlambaar;

      6°. preparaten waarvan de verpakking krachtens het
      [Besluit verpakking en aanduiding milieugevaarlijke stoffen en preparaten][ref3] van een etikettering moet zijn
      voorzien;

      en die zich bevinden in een verpakking die bestemd of geschikt is om met de inhoud in de particuliere sfeer te
      worden gebruikt;

      b. kinderveilige sluiting: een sluiting die, aangebracht op de verpakking, voldoet aan NEN-EN-ISO 8317:2004 /
      C1:2007;

      c. voelbare gevaarsaanduiding: een aanduiding die voldoet aan NEN-EN-ISO 11683:1997.


      [ref1]: https://wetten.overheid.nl/BWBR0004220
      [ref2]: https://wetten.overheid.nl/BWBR0004220
      [ref3]: https://wetten.overheid.nl/BWBR0004220
    url: https://wetten.overheid.nl/BWBR0006448/2014-11-14#Artikel1
