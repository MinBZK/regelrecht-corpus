  - number: '2'
    text: |-
      1 Het is verboden huishoudchemicaliën te verhandelen, indien de verpakking daarvan niet voldoet aan de in dit
      besluit gestelde eisen.

      2 Het is verboden huishoudchemicaliën te verhandelen anders dan met inachtneming van de voorschriften, bij dit
      besluit gesteld met betrekking tot hun aanduiding of het bezigen van vermeldingen of voorstellingen.

      3 Het is verboden huishoudchemicaliën te verhandelen, indien niet is voldaan aan [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006448#Artikel6
    url: https://wetten.overheid.nl/BWBR0006448/2014-11-14#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006448
        artikel: '6'
  - number: '3'
    text: |-
      1 De verpakking van huishoudchemicaliën als bedoeld in [artikel 1, onderdeel ][ref1] is voorzien van een
      kinderveilige sluiting.

      2 Het eerste lid is niet van toepassing op huishoudchemicaliën als bedoeld in [artikel 1, onderdeel ][ref2], die
      worden verhandeld als aërosol als bedoeld in het [Warenwetbesluit drukverpakkingen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006448#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006448#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007965
    url: https://wetten.overheid.nl/BWBR0006448/2014-11-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006448
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006448
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0007965
  - number: '4'
    text: |-
      De verpakking van huishoudchemicaliën als bedoeld in [artikel 1, onderdeel ][ref1], is voorzien van een voelbare
      gevaarsaanduiding.


      [ref1]: https://wetten.overheid.nl/BWBR0006448#Artikel1
    url: https://wetten.overheid.nl/BWBR0006448/2014-11-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006448
        artikel: '1'
  - number: '5'
    text: |-
      De verpakking van huishoudchemicaliën als bedoeld in [artikel 1, onderdeel ][ref1], mag

        - geen vorm hebben of afbeelding dragen die de actieve nieuwsgierigheid van kinderen kan wekken of prikkelen, of de
      gebruikers in verwarring kan brengen ten aanzien van de aard van het produkt;
        - geen aanbiedingsvorm hebben of benaming dragen die wordt gebruikt voor levensmiddelen, diervoeders,
      geneesmiddelen of cosmetische produkten.


      [ref1]: https://wetten.overheid.nl/BWBR0006448#Artikel1
    url: https://wetten.overheid.nl/BWBR0006448/2014-11-14#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006448
        artikel: '1'
  - number: '6'
    text: |-
      1 Degene die huishoudchemicaliën waarvan de verpakking moet zijn voorzien van een kinderveilige sluiting, voor het
      eerst in de handel brengt, is in het bezit van een certificaat waaruit blijkt dat:

        - de sluiting, aangebracht op de verpakking, voldoet aan de norm, bedoeld in [artikel 1, onderdeel ][ref1];
        - de toegepaste sluiting zodanig is, dat het niet noodzakelijk is de doeltreffendheid van de kinderveilige sluiting
      te onderzoeken volgens genoemde norm.

      2 Het eerste lid is niet van toepassing indien de verpakking slechts met behulp van een stuk gereedschap kan worden
      geopend.

      3 Een certificaat als bedoeld in het eerste lid moet zijn afgegeven door een instelling die voldoet aan NEN-EN-ISO/
      IEC 17025:2005.


      [ref1]: https://wetten.overheid.nl/BWBR0006448#Artikel1
    url: https://wetten.overheid.nl/BWBR0006448/2014-11-14#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006448
        artikel: '1'
  - number: '7'
    text: Het Besluit kinderveilige verpakkingen huishoudchemicaliën (Warenwet) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006448/2014-11-14#Artikel7
