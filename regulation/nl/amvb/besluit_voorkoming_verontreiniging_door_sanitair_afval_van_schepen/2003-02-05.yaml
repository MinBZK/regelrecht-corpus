preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 15 juli 2002, nr. HDJZ/SCH/2002–1942, gedaan mede
    namens Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Gelet op Bijlage IV van het op 4 oktober 1991 te Madrid tot stand gekomen Protocol betreffende milieubescherming
    bij het Verdrag inzake Antarctica, met Bijlagen (Trb. 1992, 110), en op de artikelen 5, 7, 10 en38 van de Wet
    voorkoming verontreiniging door schepen;

    De Raad van State gehoord (advies van 19 september 2002, no. W09.02.0315/V);

    Gezien het nader rapport van de Staatssecretaris van Verkeer en Waterstaat van 18 december 2002, nr. HDJZ/SCH/2002–
    3247, uitgebracht mede namens de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0014542/2003-02-05#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. Antarctisch gebied: gebied ten zuiden van 60° zuiderbreedte;

      b. sanitair afval:

      1°. spoelwater en andere soorten afval afkomstig van toiletten, urinoirs en spuigaten van waterclosets;

      2°. spoelwater afkomstig van medische ruimten via wastafels, badkuipen en spuigaten in dergelijke ruimten;

      3°. spoelwater afkomstig uit ruimten waarin zich levende dieren, niet zijnde huisdieren, bevinden;

      4°. ander afvalwater indien vermengd met spoelwater, bedoeld onder 1°, 2° en 3°.
    url: https://wetten.overheid.nl/BWBR0014542/2003-02-05#Artikel1
  - number: '2'
    text: |-
      De[ artikelen 3 tot en met 6][ref1] zijn van toepassing op schepen die zich in het Antarctisch gebied bevinden.


      [ref1]: https://wetten.overheid.nl/BWBR0014542#Artikel3
    url: https://wetten.overheid.nl/BWBR0014542/2003-02-05#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0014542
        artikel: '3'
  - number: '3'
    text: |-
      Aan boord van een schip zijn één of meer verzameltanks met voldoende capaciteit voor het opslaan van sanitair afval
      aanwezig.
    url: https://wetten.overheid.nl/BWBR0014542/2003-02-05#Artikel3
  - number: '4'
    text: |-
      1 Het is verboden sanitair afval te lozen binnen 12 zeemijlen van het land of van ijsplaten.

      2 Het lozen van sanitair afval vanuit een verzameltank buiten het in het eerste lid bedoelde gebied geschiedt in
      een matig tempo waarbij het schip, voor zover mogelijk, de vaarroute vervolgt met een snelheid van ten minste vier
      knopen.

      3 Het eerste en tweede lid zijn niet van toepassing op schepen waarvoor een certificaat is afgegeven voor het
      vervoer van ten hoogste 10 personen.
    url: https://wetten.overheid.nl/BWBR0014542/2003-02-05#Artikel4
  - number: '5'
    text: |-
      [Artikel 4, eerste lid][ref1], is niet van toepassing in noodgevallen die verband houden met de veiligheid van het
      schip en opvarenden, of het redden van mensenlevens op zee.


      [ref1]: https://wetten.overheid.nl/BWBR0014542#Artikel4
    url: https://wetten.overheid.nl/BWBR0014542/2003-02-05#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0014542
        artikel: '4'
  - number: '6'
    text: |-
      1 Aan boord van elk schip wordt elke lozing van sanitair afval bijgehouden
      in een sanitair-afvaljournaal dan wel in het journaal, bedoeld in
      [artikel 8c, eerste lid, van het Besluit voorkoming verontreiniging door vuilnis van schepen][ref1].

      2 [Artikel 8c, derde tot en met zesde lid, van het Besluit voorkoming verontreiniging door vuilnis van schepen][ref2]
      is van overeenkomstige toepassing.

      3 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de inrichting van het sanitair-
      afvaljournaal.


      [ref1]: https://wetten.overheid.nl/BWBR0004469#Artikel8c
      [ref2]: https://wetten.overheid.nl/BWBR0004469#Artikel8c
    url: https://wetten.overheid.nl/BWBR0014542/2003-02-05#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004469
        artikel: 8c
      - id: ref2
        bwb_id: BWBR0004469
        artikel: 8c
  - number: '7'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0014542/2003-02-05#Artikel7
  - number: '8'
    text: 'Dit besluit wordt aangehaald als: Besluit voorkoming verontreiniging door sanitair afval van schepen.'
    url: https://wetten.overheid.nl/BWBR0014542/2003-02-05#Artikel8
