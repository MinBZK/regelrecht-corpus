regulatory_layer: AMVB
publication_date: '2020-09-09'
valid_from: '2020-10-01'
bwb_id: BWBR0033723
url: https://wetten.overheid.nl/BWBR0033723/2020-10-01
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 22 mei 2013, kenmerk 118705-
    104010-WJZ, in overeenstemming met de Staatssecretaris van Veiligheid en Justitie, Onze Minister van Onderwijs,
    Cultuur en Wetenschap en Onze Minister van Sociale Zaken en Werkgelegenheid;

    Gelet op de artikelen 5a, vijfde lid, van de Beginselenwet justitiële jeugdinrichtingen, 7b, vijfde lid, van de
    Beginselenwet verpleging ter beschikking gestelden, 5b, vijfde lid, van de Penitentiaire beginselenwet, 9a, vijfde
    lid, van de Wet Centraal Orgaan opvang asielzoekers, artikel 16 van het Wetboek van Strafrecht, 16, negende lid,
    van de Leerplichtwet 1969, 1.3.9, vijfde lid, van de Wet educatie en beroepsonderwijs, 5, vijfde lid, van de Wet
    op de expertisecentra, 1.21, vijfde lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek, 4b,
    vijfde lid, van de Wet op het primair onderwijs, 3a, vijfde lid, van de Wet op het voortgezet onderwijs, 1.51a,
    vijfde lid en 2.9a, vijfde lid, van de Wet kinderopvang en kwaliteitseisen peuterspeelzalen, 3a, vijfde lid, van
    de Kwaliteitswet zorginstellingen, 10b, tweede lid en 21f, vierde lid, van de Wet maatschappelijke ondersteuning,
    40a van de Wet op de beroepen in de individuele gezondheidszorg, 13b, derde lid en 25a, derde lid, van de Wet op de
    jeugdzorg en 15a, vijfde lid, van de Wet publieke gezondheid;

    De Afdeling advisering van de Raad van State gehoord (advies van 20 juni 2013, No. W13.13.0150/III);

    Gezien het nader rapport van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 12 juli 2013, kenmerk
    128161-106041-WJZ, uitgebracht in overeenstemming met de Staatssecretaris van Veiligheid en Justitie, Onze Minister
    van Onderwijs, Cultuur en Wetenschap en Onze Minister van Sociale Zaken en Werkgelegenheid;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0033723/2020-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0033723/2020-10-01#Artikel1
  - number: 1.a
    text: '*meldcode:* meldcode huiselijk geweld en kindermishandeling;'
    url: https://wetten.overheid.nl/BWBR0033723/2020-10-01#Artikel1
  - number: 1.b
    text: '*melding:* melding aan Veilig Thuis van huiselijk geweld of kindermishandeling of van een vermoeden daarvan;'
    url: https://wetten.overheid.nl/BWBR0033723/2020-10-01#Artikel1
  - number: 1.c
    text: |-
      *verwijsindex risicojongeren:* verwijsindex risico-jongeren als bedoeld in [artikel 7.1.2.1 van de Jeugdwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0033723/2020-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
  - number: 1.d
    text: |-
      *cliënt:* vermoedelijk slachtoffer, pleger of getuige van huiselijk geweld of kindermishandeling met wie de
      professional beroepsmatig in contact staat;
    url: https://wetten.overheid.nl/BWBR0033723/2020-10-01#Artikel1
  - number: 1.e
    text: '*betrokkene:* betrokkene als bedoeld in artikel 4, onderdeel 1, van de Algemene verordening gegevensbescherming;'
    url: https://wetten.overheid.nl/BWBR0033723/2020-10-01#Artikel1
  - number: 1.f
    text: |-
      *kindcheck:* gestandaardiseerde controle of een cliënt verantwoordelijk is voor de verzorging en opvoeding van een
      of meer minderjarigen, met het oog op de veiligheid van die minderjarigen;
    url: https://wetten.overheid.nl/BWBR0033723/2020-10-01#Artikel1
  - number: 1.g
    text: |-
      *Veilig Thuis:* Veilig Thuis-organisatie als bedoeld in
      [artikel 4.1.1 van de Wet maatschappelijke ondersteuning 2015][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0033723/2020-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
  - number: '2.1'
    text: 'Een meldcode bevat ten minste de volgende elementen:'
    url: https://wetten.overheid.nl/BWBR0033723/2020-10-01#Artikel2
  - number: 2.1.a
    text: |-
      een stappenplan, inhoudende een omschrijving van de stappen voor het omgaan door professionals met signalen van
      huiselijk geweld of kindermishandeling;
    url: https://wetten.overheid.nl/BWBR0033723/2020-10-01#Artikel2
  - number: 2.1.b
    text: |-
      een afwegingskader op basis waarvan de professionals het risico op en de aard en de ernst van het huiselijk geweld
      of de kindermishandeling wegen en dat hen in staat stelt te beoordelen of sprake is van dusdanig ernstig huiselijk
      geweld of ernstige kindermishandeling, dan wel van een vermoeden daarvan, dat een melding is aangewezen;
    url: https://wetten.overheid.nl/BWBR0033723/2020-10-01#Artikel2
  - number: 2.1.c
    text: |-
      een toebedeling van verantwoordelijkheden aan de diverse groepen medewerkers binnen de organisatie waar de
      meldcode wordt vastgesteld bij de stappen, bedoeld onder a, inclusief vermelding van de functie van degene die
      eindverantwoordelijk is voor de beslissing over het al dan niet doen van een melding;
    url: https://wetten.overheid.nl/BWBR0033723/2020-10-01#Artikel2
  - number: 2.1.d
    text: |-
      specifieke aandacht, indien van toepassing, voor bijzondere vormen van geweld, die speciale kennis en vaardigheden
      van personeel vereisen;
    url: https://wetten.overheid.nl/BWBR0033723/2020-10-01#Artikel2
  - number: 2.1.e
    text: |-
      indien sprake is van een op grond van [artikel 7.1.1.2 van de Jeugdwet][ref1] meldingsbevoegde instantie of
      functionaris, specifieke aandacht voor de mogelijkheid van het gebruik van de verwijsindex risicojongeren;


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0033723/2020-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
  - number: 2.1.f
    text: voor zover van toepassing instructies voor het uitvoeren van een kindcheck bij cliënten;
    url: https://wetten.overheid.nl/BWBR0033723/2020-10-01#Artikel2
  - number: 2.1.g
    text: |-
      specifieke aandacht voor de wijze waarop professionals moeten omgaan met gegevens waarvan zij het vertrouwelijk
      karakter kennen of redelijkerwijs moeten vermoeden.
    url: https://wetten.overheid.nl/BWBR0033723/2020-10-01#Artikel2
  - number: '2.2'
    text: 'Het in het eerste lid, onder a, bedoelde stappenplan, bevat ten minste de volgende stappen:'
    url: https://wetten.overheid.nl/BWBR0033723/2020-10-01#Artikel2
  - number: 2.2.a
    text: het in kaart brengen van de signalen van huiselijk geweld of kindermishandeling;
    url: https://wetten.overheid.nl/BWBR0033723/2020-10-01#Artikel2
  - number: 2.2.b
    text: collegiale consultatie en zo nodig raadplegen van Veilig Thuis of een deskundige op het gebied van letselduiding;
    url: https://wetten.overheid.nl/BWBR0033723/2020-10-01#Artikel2
  - number: 2.2.c
    text: een gesprek met de cliënt;
    url: https://wetten.overheid.nl/BWBR0033723/2020-10-01#Artikel2
  - number: 2.2.d
    text: het toepassen van het afwegingskader, bedoeld in het eerste lid, onderdeel b;
    url: https://wetten.overheid.nl/BWBR0033723/2020-10-01#Artikel2
  - number: 2.2.e
    text: 'het beslissen over:'
    url: https://wetten.overheid.nl/BWBR0033723/2020-10-01#Artikel2
  - number: 2.2.e.1°
    text: het doen van een melding, en
    url: https://wetten.overheid.nl/BWBR0033723/2020-10-01#Artikel2
  - number: 2.2.e.2°
    text: het inzetten van de noodzakelijke hulp.
    url: https://wetten.overheid.nl/BWBR0033723/2020-10-01#Artikel2
  - number: '6'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0033723/2020-10-01#Artikel6
  - number: '7'
    text: 'Dit besluit wordt aangehaald als: Besluit verplichte meldcode huiselijk geweld en kindermishandeling.'
    url: https://wetten.overheid.nl/BWBR0033723/2020-10-01#Artikel7
