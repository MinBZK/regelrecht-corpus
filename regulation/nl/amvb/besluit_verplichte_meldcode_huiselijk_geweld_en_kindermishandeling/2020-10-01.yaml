    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0033723/2020-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *meldcode:* meldcode huiselijk geweld en kindermishandeling;

      b. *melding:* melding aan Veilig Thuis van huiselijk geweld of kindermishandeling of van een vermoeden daarvan;

      c. *verwijsindex risicojongeren:* verwijsindex risico-jongeren als bedoeld in
      [artikel 7.1.2.1 van de Jeugdwet][ref1];

      d. *cliënt:* vermoedelijk slachtoffer, pleger of getuige van huiselijk geweld of kindermishandeling met wie de
      professional beroepsmatig in contact staat;

      e. *betrokkene:* betrokkene als bedoeld in artikel 4, onderdeel 1, van de Algemene verordening gegevensbescherming;

      f. *kindcheck:* gestandaardiseerde controle of een cliënt verantwoordelijk is voor de verzorging en opvoeding van
      een of meer minderjarigen, met het oog op de veiligheid van die minderjarigen;

      g. *Veilig Thuis:* Veilig Thuis-organisatie als bedoeld in
      [artikel 4.1.1 van de Wet maatschappelijke ondersteuning 2015][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7.1.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel4.1.1
    url: https://wetten.overheid.nl/BWBR0033723/2020-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: 7.1.2.1
      - id: ref2
        bwb_id: BWBR0035362
        artikel: 4.1.1
  - number: '2'
    text: |-
      1 Een meldcode bevat ten minste de volgende elementen:

      a. een stappenplan, inhoudende een omschrijving van de stappen voor het omgaan door professionals met signalen van
      huiselijk geweld of kindermishandeling;

      b. een afwegingskader op basis waarvan de professionals het risico op en de aard en de ernst van het huiselijk
      geweld of de kindermishandeling wegen en dat hen in staat stelt te beoordelen of sprake is van dusdanig ernstig
      huiselijk geweld of ernstige kindermishandeling, dan wel van een vermoeden daarvan, dat een melding is aangewezen;

      c. een toebedeling van verantwoordelijkheden aan de diverse groepen medewerkers binnen de organisatie waar de
      meldcode wordt vastgesteld bij de stappen, bedoeld onder a, inclusief vermelding van de functie van degene die
      eindverantwoordelijk is voor de beslissing over het al dan niet doen van een melding;

      d. specifieke aandacht, indien van toepassing, voor bijzondere vormen van geweld, die speciale kennis en
      vaardigheden van personeel vereisen;

      e. indien sprake is van een op grond van [artikel 7.1.1.2 van de Jeugdwet][ref1] meldingsbevoegde instantie of
      functionaris, specifieke aandacht voor de mogelijkheid van het gebruik van de verwijsindex risicojongeren;

      f. voor zover van toepassing instructies voor het uitvoeren van een kindcheck bij cliënten;

      g. specifieke aandacht voor de wijze waarop professionals moeten omgaan met gegevens waarvan zij het vertrouwelijk
      karakter kennen of redelijkerwijs moeten vermoeden.

      2 Het in het eerste lid, onder a, bedoelde stappenplan, bevat ten minste de volgende stappen:

      a. het in kaart brengen van de signalen van huiselijk geweld of kindermishandeling;

      b. collegiale consultatie en zo nodig raadplegen van Veilig Thuis of een deskundige op het gebied van
      letselduiding;

      c. een gesprek met de cliënt;

      d. het toepassen van het afwegingskader, bedoeld in het eerste lid, onderdeel b;

      e. het beslissen over:

      1°. het doen van een melding, en

      2°. het inzetten van de noodzakelijke hulp.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7.1.1.2
    url: https://wetten.overheid.nl/BWBR0033723/2020-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: 7.1.1.2
    machine_readable:
      execution:
        produces:
          legal_character: TOETS
        parameters:
          - name: heeft_stappenplan
            type: boolean
            required: true
            description: De meldcode bevat een stappenplan als bedoeld in artikel 2 lid 1 onder a
          - name: heeft_afwegingskader
            type: boolean
            required: true
            description: De meldcode bevat een afwegingskader als bedoeld in artikel 2 lid 1 onder b
          - name: heeft_verantwoordelijkheidsverdeling
            type: boolean
            required: true
            description: De meldcode bevat een toebedeling van verantwoordelijkheden als bedoeld in artikel 2 lid 1 onder c
          - name: bijzondere_vormen_van_toepassing
            type: boolean
            required: true
            description: Er is sprake van bijzondere vormen van geweld die speciale kennis en vaardigheden vereisen (artikel 2 lid 1 onder d)
          - name: heeft_aandacht_bijzondere_vormen
            type: boolean
            required: false
            description: De meldcode bevat specifieke aandacht voor bijzondere vormen van geweld (vereist indien bijzondere_vormen_van_toepassing)
          - name: is_meldingsbevoegde_instantie
            type: boolean
            required: true
            description: De instantie of functionaris is meldingsbevoegd op grond van artikel 7.1.1.2 Jeugdwet (artikel 2 lid 1 onder e)
          - name: heeft_aandacht_verwijsindex
            type: boolean
            required: false
            description: De meldcode bevat aandacht voor de verwijsindex risicojongeren (vereist indien is_meldingsbevoegde_instantie)
          - name: kindcheck_van_toepassing
            type: boolean
            required: true
            description: De kindcheck is van toepassing op de organisatie (artikel 2 lid 1 onder f)
          - name: heeft_kindcheck_instructies
            type: boolean
            required: false
            description: De meldcode bevat instructies voor het uitvoeren van een kindcheck (vereist indien kindcheck_van_toepassing)
          - name: heeft_instructies_vertrouwelijke_gegevens
            type: boolean
            required: true
            description: De meldcode bevat instructies voor omgaan met vertrouwelijke gegevens (artikel 2 lid 1 onder g)
          - name: stappenplan_heeft_signalen_kaartbrengen
            type: boolean
            required: true
            description: Het stappenplan bevat het in kaart brengen van signalen (artikel 2 lid 2 onder a)
          - name: stappenplan_heeft_collegiale_consultatie
            type: boolean
            required: true
            description: Het stappenplan bevat collegiale consultatie en raadplegen van Veilig Thuis (artikel 2 lid 2 onder b)
          - name: stappenplan_heeft_gesprek_client
            type: boolean
            required: true
            description: Het stappenplan bevat een gesprek met de cliënt (artikel 2 lid 2 onder c)
          - name: stappenplan_heeft_afwegingskader_toepassen
            type: boolean
            required: true
            description: Het stappenplan bevat het toepassen van het afwegingskader (artikel 2 lid 2 onder d)
          - name: stappenplan_heeft_beslissing_melding_en_hulp
            type: boolean
            required: true
            description: Het stappenplan bevat de beslissing over het doen van een melding en het inzetten van hulp (artikel 2 lid 2 onder e)
        output:
          - name: meldcode_voldoet_aan_vereisten_lid1
            type: boolean
            description: De meldcode voldoet aan de minimumeisen van artikel 2 lid 1 (elementen a t/m g)
          - name: stappenplan_voldoet_aan_vereisten
            type: boolean
            description: Het stappenplan voldoet aan de minimumeisen van artikel 2 lid 2 (stappen a t/m e)
          - name: meldcode_voldoet_aan_minimumeisen
            type: boolean
            description: De meldcode voldoet aan alle minimumeisen van artikel 2
        actions:
          # Element d: specifieke aandacht bijzondere vormen (indien van toepassing)
          - output: vereiste_d_voldaan
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $bijzondere_vormen_van_toepassing
                    value: true
                  then: $heeft_aandacht_bijzondere_vormen
              default: true
          # Element e: aandacht voor verwijsindex risicojongeren (indien meldingsbevoegd)
          - output: vereiste_e_voldaan
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $is_meldingsbevoegde_instantie
                    value: true
                  then: $heeft_aandacht_verwijsindex
              default: true
          # Element f: kindcheck instructies (voor zover van toepassing)
          - output: vereiste_f_voldaan
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $kindcheck_van_toepassing
                    value: true
                  then: $heeft_kindcheck_instructies
              default: true
          # Lid 1: alle vereiste elementen aanwezig
          - output: meldcode_voldoet_aan_vereisten_lid1
            value:
              operation: AND
              conditions:
                - operation: EQUALS
                  subject: $heeft_stappenplan
                  value: true
                - operation: EQUALS
                  subject: $heeft_afwegingskader
                  value: true
                - operation: EQUALS
                  subject: $heeft_verantwoordelijkheidsverdeling
                  value: true
                - operation: EQUALS
                  subject: $vereiste_d_voldaan
                  value: true
                - operation: EQUALS
                  subject: $vereiste_e_voldaan
                  value: true
                - operation: EQUALS
                  subject: $vereiste_f_voldaan
                  value: true
                - operation: EQUALS
                  subject: $heeft_instructies_vertrouwelijke_gegevens
                  value: true
          # Lid 2: alle vereiste stappen in het stappenplan aanwezig
          - output: stappenplan_voldoet_aan_vereisten
            value:
              operation: AND
              conditions:
                - operation: EQUALS
                  subject: $stappenplan_heeft_signalen_kaartbrengen
                  value: true
                - operation: EQUALS
                  subject: $stappenplan_heeft_collegiale_consultatie
                  value: true
                - operation: EQUALS
                  subject: $stappenplan_heeft_gesprek_client
                  value: true
                - operation: EQUALS
                  subject: $stappenplan_heeft_afwegingskader_toepassen
                  value: true
                - operation: EQUALS
                  subject: $stappenplan_heeft_beslissing_melding_en_hulp
                  value: true
          # Totaaloordeel: meldcode voldoet aan alle minimumeisen
          - output: meldcode_voldoet_aan_minimumeisen
            value:
              operation: AND
              conditions:
                - operation: EQUALS
                  subject: $meldcode_voldoet_aan_vereisten_lid1
                  value: true
                - operation: EQUALS
                  subject: $stappenplan_voldoet_aan_vereisten
                  value: true
  - number: '6'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0033723/2020-10-01#Artikel6
  - number: '7'
    text: 'Dit besluit wordt aangehaald als: Besluit verplichte meldcode huiselijk geweld en kindermishandeling.'
    url: https://wetten.overheid.nl/BWBR0033723/2020-10-01#Artikel7
