$id: besluit_verplichte_meldcode_huiselijk_geweld_en_kindermishandeling
regulatory_layer: AMVB
publication_date: '2020-09-09'
valid_from: '2013-07-31'
bwb_id: BWBR0033723
url: https://wetten.overheid.nl/BWBR0033723/2013-07-31
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 22 mei 2013, kenmerk 118705-
    104010-WJZ, in overeenstemming met de Staatssecretaris van Veiligheid en Justitie, Onze Minister van Onderwijs,
    Cultuur en Wetenschap en Onze Minister van Sociale Zaken en Werkgelegenheid;

    Gelet op de artikelen 5a, vijfde lid, van de Beginselenwet justitiële jeugdinrichtingen, 7b, vijfde lid, van de
    Beginselenwet verpleging ter beschikking gestelden, 5b, vijfde lid, van de Penitentiaire beginselenwet, 9a, vijfde
    lid, van de Wet Centraal Orgaan opvang asielzoekers, artikel 16 van het Wetboek van Strafrecht, 16, negende lid,
    van de Leerplichtwet 1969, 1.3.9, vijfde lid, van de Wet educatie en beroepsonderwijs, 5, vijfde lid, van de Wet
    op de expertisecentra, 1.21, vijfde lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek, 4b,
    vijfde lid, van de Wet op het primair onderwijs, 3a, vijfde lid, van de Wet op het voortgezet onderwijs, 1.51a,
    vijfde lid en 2.9a, vijfde lid, van de Wet kinderopvang en kwaliteitseisen peuterspeelzalen, 3a, vijfde lid, van
    de Kwaliteitswet zorginstellingen, 10b, tweede lid en 21f, vierde lid, van de Wet maatschappelijke ondersteuning,
    40a van de Wet op de beroepen in de individuele gezondheidszorg, 13b, derde lid en 25a, derde lid, van de Wet op de
    jeugdzorg en 15a, vijfde lid, van de Wet publieke gezondheid;

    De Afdeling advisering van de Raad van State gehoord (advies van 20 juni 2013, No. W13.13.0150/III);

    Gezien het nader rapport van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 12 juli 2013, kenmerk
    128161-106041-WJZ, uitgebracht in overeenstemming met de Staatssecretaris van Veiligheid en Justitie, Onze Minister
    van Onderwijs, Cultuur en Wetenschap en Onze Minister van Sociale Zaken en Werkgelegenheid;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0033723/2013-07-31#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0033723/2013-07-31#Artikel1
  - number: 1.a
    text: '*meldcode:* meldcode huiselijk geweld en kindermishandeling;'
    url: https://wetten.overheid.nl/BWBR0033723/2013-07-31#Artikel1
  - number: 1.b
    text: '*melding:* melding van huiselijk geweld of kindermishandeling of een vermoeden daarvan;'
    url: https://wetten.overheid.nl/BWBR0033723/2013-07-31#Artikel1
  - number: 1.c
    text: |-
      *verwijsindex risicojongeren:* verwijsindex risico-jongeren als bedoeld in
      [artikel 2d, eerste lid, van de Wet op de jeugdzorg][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel2d
    url: https://wetten.overheid.nl/BWBR0033723/2013-07-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 2d
  - number: 1.d
    text: |-
      *cliënt:* vermoedelijk slachtoffer, pleger of getuige van huiselijk geweld of kindermishandeling waarmee de
      professional beroepsmatig in contact staat;
    url: https://wetten.overheid.nl/BWBR0033723/2013-07-31#Artikel1
  - number: 1.e
    text: |-
      *betrokkene:* betrokkene als bedoeld in [artikel 1 van de Wet bescherming persoonsgegevens][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0033723/2013-07-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
  - number: 1.f
    text: |-
      *kindcheck:* gestandaardiseerde controle of een cliënt verantwoordelijk is voor de verzorging en opvoeding van een
      of meer minderjarigen, met het oog op de veiligheid van hen.
    url: https://wetten.overheid.nl/BWBR0033723/2013-07-31#Artikel1
  - number: '2.1'
    text: 'Een meldcode bevat ten minste de volgende elementen:'
    url: https://wetten.overheid.nl/BWBR0033723/2013-07-31#Artikel2
  - number: 2.1.a
    text: |-
      een stappenplan, inhoudende een omschrijving van de stappen voor het omgaan door professionals met signalen van
      huiselijk geweld of kindermishandeling;
    url: https://wetten.overheid.nl/BWBR0033723/2013-07-31#Artikel2
  - number: 2.1.b
    text: |-
      een toebedeling van verantwoordelijkheden aan de diverse groepen medewerkers binnen de organisatie waar de meldcode
      wordt vastgesteld bij de stappen, bedoeld onder a, inclusief vermelding van degene die eindverantwoordelijk is voor
      de beslissing over het al dan niet doen van een melding;
    url: https://wetten.overheid.nl/BWBR0033723/2013-07-31#Artikel2
  - number: 2.1.c
    text: |-
      specifieke aandacht, indien van toepassing, voor bijzondere vormen van geweld, die speciale kennis en vaardigheden
      van personeel vereisen;
    url: https://wetten.overheid.nl/BWBR0033723/2013-07-31#Artikel2
  - number: 2.1.d
    text: |-
      indien sprake is van een op grond van [artikel 2b van de Wet op de jeugdzorg][ref1] meldingsbevoegde instantie of
      functionaris, specifieke aandacht voor de mogelijkheid van het gebruik van de verwijsindex risicojongeren;


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel2b
    url: https://wetten.overheid.nl/BWBR0033723/2013-07-31#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 2b
  - number: 2.1.e
    text: voor zover van toepassing instructies voor het uitvoeren van een kindcheck bij cliënten;
    url: https://wetten.overheid.nl/BWBR0033723/2013-07-31#Artikel2
  - number: 2.1.f
    text: |-
      specifieke aandacht voor de wijze waarop professionals moeten omgaan met gegevens waarvan zij het vertrouwelijk
      karakter kennen of redelijkerwijs moeten vermoeden.
    url: https://wetten.overheid.nl/BWBR0033723/2013-07-31#Artikel2
  - number: '2.2'
    text: 'Het in het eerste lid, onder a, bedoelde stappenplan, bevat ten minste de volgende stappen:'
    url: https://wetten.overheid.nl/BWBR0033723/2013-07-31#Artikel2
  - number: 2.2.a
    text: het in kaart brengen van de signalen van huiselijk geweld en kindermishandeling;
    url: https://wetten.overheid.nl/BWBR0033723/2013-07-31#Artikel2
  - number: 2.2.b
    text: |-
      collegiale consultatie en zo nodig raadplegen van het steunpunt huiselijk geweld, het advies- en meldpunt
      kindermishandeling of een deskundige op het gebied van letselduiding;
    url: https://wetten.overheid.nl/BWBR0033723/2013-07-31#Artikel2
  - number: 2.2.c
    text: een gesprek met de cliënt;
    url: https://wetten.overheid.nl/BWBR0033723/2013-07-31#Artikel2
  - number: 2.2.d
    text: |-
      het wegen van het risico op en de aard en de ernst van het huiselijk geweld of de kindermishandeling en bij twijfel
      altijd raadplegen van het steunpunt huiselijk geweld of het advies- en meldpunt kindermishandeling, en
    url: https://wetten.overheid.nl/BWBR0033723/2013-07-31#Artikel2
  - number: 2.2.e
    text: 'beslissen: zelf hulp bieden of hulp organiseren dan wel het doen van een melding.'
    url: https://wetten.overheid.nl/BWBR0033723/2013-07-31#Artikel2
  - number: '3.1'
    text: |-
      Indien een steunpunt huiselijk geweld in het kader van een melding persoonsgegevens heeft verkregen, verstrekt
      het steunpunt aan degene op wie de persoonsgegevens betrekking hebben inlichtingen over de herkomst van de
      persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0033723/2013-07-31#Artikel3
  - number: '3.2'
    text: |-
      In afwijking van het eerste lid verstrekt het steunpunt huiselijk geweld geen inlichtingen over de herkomst van de
      persoonsgegevens die het naar aanleiding van een melding heeft verkregen indien:
    url: https://wetten.overheid.nl/BWBR0033723/2013-07-31#Artikel3
  - number: 3.2.a
    text: |-
      een persoon die in een beroepsmatige of hulpverlenende relatie tot de betrokkene of zijn gezin staat, de
      persoonsgegevens naar aanleiding van een melding heeft verstrekt en het verstrekken van die inlichtingen:
    url: https://wetten.overheid.nl/BWBR0033723/2013-07-31#Artikel3
  - number: 3.2.a.1
    text: een bedreiging vormt of kan vormen voor de betrokkene of andere leden van het gezin waartoe de betrokkene behoort;
    url: https://wetten.overheid.nl/BWBR0033723/2013-07-31#Artikel3
  - number: 3.2.a.2
    text: een bedreiging vormt of kan vormen voor die persoon of medewerkers van die persoon;
    url: https://wetten.overheid.nl/BWBR0033723/2013-07-31#Artikel3
  - number: 3.2.a.3
    text: |-
      leidt of kan leiden tot een verstoring van de vertrouwensrelatie met de betrokkene of het gezin waartoe de
      betrokkene behoort;
    url: https://wetten.overheid.nl/BWBR0033723/2013-07-31#Artikel3
  - number: 3.2.b
    text: het andere personen betreft dan die bedoeld onder a, behoudens voor zover zij daarvoor toestemming hebben gegeven.
    url: https://wetten.overheid.nl/BWBR0033723/2013-07-31#Artikel3
  - number: '6'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0033723/2013-07-31#Artikel6
  - number: '7'
    text: 'Dit besluit wordt aangehaald als: Besluit verplichte meldcode huiselijk geweld en kindermishandeling.'
    url: https://wetten.overheid.nl/BWBR0033723/2013-07-31#Artikel7
