$id: besluit_alternatieve_verdeling_nummers
regulatory_layer: AMVB
publication_date: '2002-11-12'
valid_from: '2013-04-01'
bwb_id: BWBR0014124
url: https://wetten.overheid.nl/BWBR0014124/2013-04-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Verkeer en Waterstaat van 13 juni 2002 nr. HDJZ 2002/1494,
    Hoofddirectie Juridische Zaken;

    Gelet op artikel 4.2, zevende lid, van de Telecommunicatiewet;

    De Raad van State gehoord (advies van 25 juli 2002, nr. W09.02.0253/V);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 10 oktober 2002, nr. DGTP/02/03582, Directie
    Wetgeving en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0014124/2013-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014124/2013-04-01#Artikel1
  - number: 1.a
    text: |-
      wet: [Telecommunicatiewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009950
    url: https://wetten.overheid.nl/BWBR0014124/2013-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009950
  - number: 1.b
    text: |-
      nummers waarop de procedure van veiling van toepassing is: nummers waarvan Onze Minister in een nummerplan heeft
      vastgesteld dat ze van uitzonderlijke economische waarde zijn en dat de procedure van veiling van toepassing is;
    url: https://wetten.overheid.nl/BWBR0014124/2013-04-01#Artikel1
  - number: 1.c
    text: |-
      nummers waarop de procedure van loten van toepassing is: nummers, niet zijnde nummers waarop de procedure van
      veiling van toepassing is.
    url: https://wetten.overheid.nl/BWBR0014124/2013-04-01#Artikel1
  - number: '2.1'
    text: |-
      Indien er meerdere aanvragen om toekenning van een nummer waarop de procedure van veiling van toepassing is, bij
      de Autoriteit Consument en Markt zijn ingediend, stelt de Autoriteit Consument en Markt de aanvragers in kennis van
      het feit dat meerdere aanvragen zijn ingediend en dat de procedure van veiling wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0014124/2013-04-01#Artikel2
  - number: '2.2'
    text: |-
      Indien er op dezelfde dag meerdere aanvragen om toekenning van een nummer waarop de procedure van loting van
      toepassing is, bij de Autoriteit Consument en Markt zijn ingediend, stelt de Autoriteit Consument en Markt de
      aanvragers in kennis van het feit dat meerdere aanvragen zijn ingediend en dat de procedure van loting wordt
      toegepast.
    url: https://wetten.overheid.nl/BWBR0014124/2013-04-01#Artikel2
  - number: '2.3'
    text: |-
      Bij toepassing van de procedure van veiling of van loting stelt de Autoriteit Consument en Markt het tijdstip vast
      waarop de veiling of de loting aanvangt alsmede de periode waarbinnen de veiling of de loting moet zijn beëindigd.
    url: https://wetten.overheid.nl/BWBR0014124/2013-04-01#Artikel2
  - number: '2.4'
    text: |-
      In de in het eerste en tweede lid bedoelde kennisgevingen wordt door de Autoriteit Consument en Markt mededeling
      gedaan van:
    url: https://wetten.overheid.nl/BWBR0014124/2013-04-01#Artikel2
  - number: 2.4.a
    text: het tijdstip van aanvang van de veiling onderscheidenlijk de loting;
    url: https://wetten.overheid.nl/BWBR0014124/2013-04-01#Artikel2
  - number: 2.4.b
    text: de periode waarbinnen de veiling onderscheidenlijk de loting plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0014124/2013-04-01#Artikel2
  - number: 2.4.c
    text: de beperkingen waaronder de toekenning wordt verleend;
    url: https://wetten.overheid.nl/BWBR0014124/2013-04-01#Artikel2
  - number: 2.4.d
    text: de aan de toekenning te verbinden voorschriften.
    url: https://wetten.overheid.nl/BWBR0014124/2013-04-01#Artikel2
  - number: '3.1'
    text: 'Tot de veiling worden slechts toegelaten aanvragers die:'
    url: https://wetten.overheid.nl/BWBR0014124/2013-04-01#Artikel3
  - number: 3.1.a
    text: |-
      een aanvraag bij de Autoriteit Consument en Markt hebben ingediend voor toekenning van een nummer waarop
      de procedure van veiling van toepassing is en aan wie de Autoriteit Consument en Markt overeenkomstig
      [artikel 2][ref1] mededeling heeft gedaan, en


      [ref1]: https://wetten.overheid.nl/BWBR0014124#Artikel2
    url: https://wetten.overheid.nl/BWBR0014124/2013-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014124
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.1.b
    text: |-
      op grond van bij of krachtens de wet gestelde regels in aanmerking komen voor toekenning van het aangevraagde
      nummer.
    url: https://wetten.overheid.nl/BWBR0014124/2013-04-01#Artikel3
  - number: '3.2'
    text: 'Tot de loting worden slechts toegelaten aanvragers die:'
    url: https://wetten.overheid.nl/BWBR0014124/2013-04-01#Artikel3
  - number: 3.2.a
    text: |-
      een aanvraag bij de Autoriteit Consument en Markt hebben ingediend voor toekenning van een nummer waarop de
      procedure van loting van toepassing is en aan wie de Autoriteit Consument en Markt overeenkomstig [artikel 2][ref1]
      mededeling heeft gedaan, en


      [ref1]: https://wetten.overheid.nl/BWBR0014124#Artikel2
    url: https://wetten.overheid.nl/BWBR0014124/2013-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014124
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.2.b
    text: |-
      op grond van bij of krachtens de wet gestelde regels in aanmerking komen voor toekenning van het aangevraagde
      nummer.
    url: https://wetten.overheid.nl/BWBR0014124/2013-04-01#Artikel3
  - number: '4.1'
    text: |-
      Indien uit [artikel 3, eerste lid, onderdeel b][ref1], voorvloeit dat slechts één aanvrager in aanmerking komt
      voor toekenning van het aangevraagde nummer waarop de procedure van veiling van toepassing is, kent de Autoriteit
      Consument en Markt dat nummer aan deze aanvrager toe zonder toepassing van een veiling.


      [ref1]: https://wetten.overheid.nl/BWBR0014124#Artikel3
    url: https://wetten.overheid.nl/BWBR0014124/2013-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0014124
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '4.2'
    text: |-
      Indien uit [artikel 3, tweede lid, onderdeel b][ref1], voortvloeit dat slechts één aanvrager in aanmerking komt
      voor toekenning van het aangevraagde nummer waarop de procedure van loting van toepassing is, kent de Autoriteit
      Consument en Markt dat nummer aan deze aanvrager toe zonder toepassing van een loting.


      [ref1]: https://wetten.overheid.nl/BWBR0014124#Artikel3
    url: https://wetten.overheid.nl/BWBR0014124/2013-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0014124
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '5.1'
    text: |-
      Bij ministeriële regeling kunnen in het kader van de behandeling van een aanvraag om toekenning van nummers waarop
      de procedure van veiling van toepassing is, regels worden gesteld omtrent de aanvraagprocedure en de wijze waarop
      de veiling geschiedt.
    url: https://wetten.overheid.nl/BWBR0014124/2013-04-01#Artikel5
  - number: '5.2'
    text: 'In het geval van een veiling hebben de in het eerste lid bedoelde regels in elk geval betrekking op:'
    url: https://wetten.overheid.nl/BWBR0014124/2013-04-01#Artikel5
  - number: 5.2.a
    text: de wijze waarop een bod wordt uitgebracht;
    url: https://wetten.overheid.nl/BWBR0014124/2013-04-01#Artikel5
  - number: 5.2.b
    text: de eisen die aan een geldig bod worden gesteld;
    url: https://wetten.overheid.nl/BWBR0014124/2013-04-01#Artikel5
  - number: 5.2.c
    text: maatregelen ten behoeve van een ongestoord verloop van de veiling;
    url: https://wetten.overheid.nl/BWBR0014124/2013-04-01#Artikel5
  - number: 5.2.d
    text: |-
      de bij de veiling toe te passen methode ter vaststelling van het bod waarvan de uitbrenger in aanmerking komt voor
      toekenning van het nummer;
    url: https://wetten.overheid.nl/BWBR0014124/2013-04-01#Artikel5
  - number: 5.2.e
    text: |-
      de eisen die gesteld worden met betrekking tot de wijze van betaling en het tijdstip waarop degene aan wie het
      nummer wordt toegekend deze betaling verricht moet hebben;
    url: https://wetten.overheid.nl/BWBR0014124/2013-04-01#Artikel5
  - number: 5.2.f
    text: |-
      de gevallen waarin, de termijn waarbinnen en de voorwaarden waaronder er opnieuw wordt geveild zonder dat er sprake
      is van een nieuwe veilingprocedure;
    url: https://wetten.overheid.nl/BWBR0014124/2013-04-01#Artikel5
  - number: 5.2.g
    text: de gevallen waarin, de termijn waarbinnen en de voorwaarden waaronder de veiling geschorst kan worden.
    url: https://wetten.overheid.nl/BWBR0014124/2013-04-01#Artikel5
  - number: '5.3'
    text: |-
      Bij ministeriële regeling kunnen in het kader van de behandeling van een aanvraag om toekenning van nummers waarop
      de procedure van loting van toepassing is regels worden gesteld omtrent de wijze waarop de loting geschiedt. Deze
      regels hebben in elk geval betrekking op maatregelen ten behoeve van een ongestoord verloop van de loting.
    url: https://wetten.overheid.nl/BWBR0014124/2013-04-01#Artikel5
  - number: '7'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0014124/2013-04-01#Artikel7
  - number: '8'
    text: 'Dit besluit wordt aangehaald als: Besluit alternatieve verdeling nummers.'
    url: https://wetten.overheid.nl/BWBR0014124/2013-04-01#Artikel8
