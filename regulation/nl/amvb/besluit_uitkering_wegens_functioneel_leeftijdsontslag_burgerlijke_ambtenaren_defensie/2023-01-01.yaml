  - number: '2.1'
    text: |-
      In dit besluit wordt verstaan onder bezoldiging: de bezoldiging in de zin van het
      [Inkomstenbesluit burgerlijke ambtenaren defensie][ref1] vermeerderd met de vakantie-uitkering, berekend over een
      maand, waarop de betrokkene op de dag voorafgaand aan zijn ontslag aanspraak had of bij waarneming van zijn functie
      zou hebben gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0018191
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018191
  - number: '2.2'
    text: |-
      In afwijking van het in het eerste lid bepaalde maken de waarnemingstoelage, bedoeld in de
      [artikel 17 van het Inkomstenbesluit burgerlijke ambtenaren defensie][ref1] en de aflopende toelage onregelmatige
      dienst, bedoeld in de [artikel 21 van dat besluit][ref2] en de over die toelagen berekende vakantie-uitkering geen
      deel uit van de bezoldiging.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0018191#Artikel21
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0018191
        artikel: '21'
  - number: '2.3'
    text: |-
      Indien de betrokkene geen ambtenaar is in de zin van het [Inkomstenbesluit burgerlijke ambtenaren defensie][ref1]
      geldt als bezoldiging hetgeen met het in het eerste en het tweede lid daaromtrent bepaalde overeenkomt.


      [ref1]: https://wetten.overheid.nl/BWBR0018191
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018191
  - number: '2.4'
    text: |-
      Indien de door een betrokkene over de laatste aan het ontslag voorafgaande twaalf volle kalendermaanden genoten
      bezoldiging in de zin van het in het eerste lid genoemde besluit, dan wel hetgeen daarmede overeenkomt, alsmede
      de over die maanden genoten vakantie-uitkering dan wel verkregen aanspraak daarop geheel of gedeeltelijk uit
      wisselende inkomsten waaronder begrepen de evengenoemde aanspraken bestonden, geldt in zoverre in afwijking van
      het eerste lid als bezoldiging, met inachtneming van het in het tweede en derde lid bepaalde, het gemiddelde van
      die inkomsten.
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel2
  - number: '2.5'
    text: |-
      Indien in de bezoldiging, omschreven in het eerste tot en met het vierde lid, anders dan ten gevolge van periodieke
      verhoging van het salaris, wijziging zou zijn gekomen wanneer de betrokkene op die bezoldiging in dienst zou zijn
      gebleven, zal van de dag van inwerkingtreding van die wijziging af het aldus gewijzigd bedrag als bezoldiging
      gelden.
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel2
  - number: '2.6'
    text: |-
      Voor betrekkingen die geleidelijk worden opgeheven, alsmede in bijzondere gevallen, kan Onze Minister van het
      hiervoren bepaalde ten gunste van de betrokkene afwijken.
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel2
  - number: '3.1'
    text: |-
      De betrokkene die is geboren na 31 december 1949 heeft recht op een uitkering zoals bedoeld in [artikel 4][ref1]
      jo [artikel 4c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006041#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006041#Artikel4c
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006041
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0006041
        artikel: 4c
  - number: '3.2'
    text: Onze Minister beslist over de toekenning van uitkering op aanvraag door de betrokkene.
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel3
  - number: '4.1'
    text: |-
      De uitkering bedraagt gedurende 60 maanden 80% van de bezoldiging vermeerderd met zoveel - doch ten hoogste tien
        - malen 0,5% van die bezoldiging als het totaal aantal volle voor pensioen geldige dienstjaren, die medetellen
      voor de pensioenberekening krachtens het pensioenreglement, op de dag van ingang van het ontslag meer dan dertig
      bedraagt en vervolgens 70% van die bezoldiging. Het bedrag van de uitkering daalt echter niet beneden het bedrag
      van het pensioen, waarop de betrokkene recht zou hebben, indien hij uit de betrekking waaruit hij met recht op
      uitkering is ontslagen, op de dag van ontslag zou zijn gepensioneerd.
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel4
  - number: '4.2'
    text: |-
      Onder diensttijd bedoeld in het eerste lid wordt verstaan, voor zover gelegen vóór 1 januari 1996: de tijd zoals
      die voor de betrokkene per 31 december 1995 meetelt voor de pensioenberekening, bedoeld in de Algemene burgerlijke
      pensioenwet; voor zover gelegen op of na 1 januari 1996: de tijd gedurende welke betrokkene overheidswerknemer is
      in de zin van de [Wet privatisering ABP][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007791
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007791
  - number: '4.3'
    text: |-
      Bij de berekening van het bedrag van het pensioen, bedoeld in het eerste lid, wordt mede in aanmerking genomen de
      diensttijd, bedoeld in artikel 5.1, tweede lid, van het pensioenreglement die de betrokkene bij het bereiken van de
      pensioengerechtigde leeftijd zal kunnen aanwijzen.
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel4
  - number: '4.4'
    text: |-
      Voor de toepassing van het eerste lid wordt de eventuele diensttijd, bedoeld in artikel D 1, tweede lid, van de
      Algemene burgerlijke pensioenwet zoals deze luidde op 31 december 1995, mede in aanmerking genomen. Het verzoek als
      bedoeld in artikel D 2 van genoemde wet wordt daarbij geacht te zijn gedaan.
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel4
  - number: '4.5'
    text: |-
      Wanneer aan de betrokkene na de dag van ingang van het ontslag ter zake waarvan de uitkering is toegekend, een
      overheidspensioen, anders dan ten laste van de Stichting Pensioenfonds ABP, wordt toegekend, vindt zo nodig
      herberekening plaats zowel van het bedrag der uitkering als van het bedrag van het pensioen, genoemd in het eerste
      lid, met ingang van de dag waarop eerstbedoeld pensioen is ingegaan.
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel4
  - number: 4c.1
    text: |-
      De in [artikel 4][ref1] genoemde uitkering die ingaat vóór het bereiken van de leeftijd van 60 jaar wordt, in
      afwijking van [artikel 9, eerste lid, onder c][ref2], gecontinueerd totdat, voor zover daarop recht bestaat, met
      het versterkt ouderdomspensioen het niveau van de uitkering wordt bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0006041#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006041#Artikel9
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel4c
    references:
      - id: ref1
        bwb_id: BWBR0006041
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0006041
        artikel: '9'
  - number: 4c.2
    text: |-
      De in [artikel 4][ref1] genoemde uitkering die ingaat op of na het bereiken van de leeftijd van 60 jaar wordt, voor
      zover daarop recht bestaat, verminderd met het bedrag van het versterkt ouderdomspensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0006041#Artikel4
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel4c
    references:
      - id: ref1
        bwb_id: BWBR0006041
        artikel: '4'
  - number: 4c.3
    text: |-
      Indien de ambtenaar aan wie ontslag is verleend en wiens uitkering ingaat op of na het bereiken van de leeftijd
      van 60 jaar niet of niet tijdig het versterkt ouderdomspensioen aanvraagt, en hem dit redelijkerwijs kan worden
      verweten, wordt, voor de periode waarin hij dientengevolge geen versterkt ouderdomspensioen ontvangt, voor de
      toepassing van dit artikel rekening gehouden met de uitkering die hij vanaf de ontslagdatum zou hebben genoten
      indien hij het voornoemde versterkt ouderdomspensioen wel tijdig zou hebben aangevraagd.
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel4c
  - number: 4c.4
    text: |-
      Ingeval naast de in [artikel 4][ref1] genoemde uitkering inkomsten uit of in verband met arbeid of bedrijf als
      bedoeld in [artikel 5][ref2] worden genoten, wordt op de uitkering een vermindering toegepast. In voorkomend
      geval wordt een vermindering toegepast boven de vermindering die reeds krachtens het tweede lid plaatsvindt. Deze
      vermindering is gelijk aan het bedrag waarmede de onverminderde uitkering krachtens artikel 4 vermeerderd met het
      totaal bedrag van de inkomsten, bedoeld in artikel 5, tezamen de laatstelijk genoten bezoldiging te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0006041#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006041#Artikel5
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel4c
    references:
      - id: ref1
        bwb_id: BWBR0006041
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0006041
        artikel: '5'
  - number: '5.1'
    text: |-
      De inkomsten, die de betrokkene geniet of gaat genieten uit of in verband met arbeid of bedrijf, ter hand genomen
      met ingang van of na de dag van het ontslag, ter zake waarvan de uitkering is toegekend, worden met de uitkering
      verrekend over de maand waarop deze inkomsten betrekking hebben of geacht kunnen worden betrekking te hebben. Deze
      verrekening geschiedt aldus dat de uitkering wordt verminderd met het bedrag waarmede de uitkering, vermeerderd met
      die inkomsten, de bezoldiging overschrijdt.
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel5
  - number: '5.2'
    text: |-
      Het eerste lid vindt overeenkomstige toepassing ten aanzien van inkomsten uit of in verband met arbeid of bedrijf
      ter hand genomen gedurende non-activiteit, vakantie of verlof onmiddellijk voorafgaande aan het ontslag ter zake
      waarvan de uitkering is toegekend.
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel5
  - number: '5.3'
    text: |-
      Wanneer de betrokkene arbeid of bedrijf ter hand heeft genomen vóór de dag van het ontslag, anders dan bedoeld in
      de voorgaande leden en na die dag uit die arbeid of dat bedrijf inkomsten of meer inkomsten gaat genieten, is het
      eerste lid van toepassing, tenzij de betrokkene aannemelijk maakt, dat die inkomsten of vermeerdering van inkomsten
      of een gedeelte daarvan noch het gevolg zijn van een verhoogde werkzaamheid noch verband houden met het ontslag, in
      welk geval de inkomsten, die meerdere inkomsten of dat gedeelte daarvan niet in aanmerking worden genomen voor de
      toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel5
  - number: '5.4'
    text: |-
      In afwijking van het bepaalde in de voorgaande leden wordt een tweede uitkering in mindering gebracht op de
      eerste uitkering. In het geval tevens inkomsten als bedoeld in het eerste en derde lid worden genoten, worden deze
      inkomsten, na toepassing van de vorige volzin, op de voet van het eerste lid met de tweede uitkering verrekend.
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel5
  - number: '5.5'
    text: In bijzondere gevallen kan Onze Minister van het hierboven bepaalde ten gunste van de betrokkene afwijken.
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel5
  - number: '6.1'
    text: |-
      De betrokkene is verplicht van het ter hand nemen van enige arbeid of bedrijf terstond mededeling te doen aan Onze
      Minister onder opgave, voor zover mogelijk, van de inkomsten, die hij uit die werkzaamheden zal trekken. Zijn de
      inkomsten niet vooraf op te geven, dan doet hij tijdig vóór het verschijnen van elke uitkeringstermijn opgave van
      de inkomsten, die hij sinds het ter hand nemen van de werkzaamheden of sinds de vorige opgave heeft genoten. Onze
      Minister geeft nadere voorschriften aangaande het doen van mededelingen door de betrokkene met betrekking tot de
      inkomsten uit of in verband met arbeid of bedrijf.
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel6
  - number: '6.2'
    text: |-
      Brengt de aard van de werkzaamheden of van de inkomsten mede, dat de inkomsten over een langere termijn moeten
      worden berekend, dan geschiedt de opgave dienovereenkomstig en wordt op de uitkering een vermindering toegepast
      van een voorlopig vastgesteld bedrag onder voorbehoud van verrekening aan het eind van de evenbedoelde termijn.
      Ten aanzien van deze verrekening is [artikel 5, eerste lid][ref1], van toepassing, met dien verstande, dat zij
      geschiedt over de in de vorige volzin bedoelde langere termijn in plaats van over iedere maand afzonderlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0006041#Artikel5
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006041
        artikel: '5'
  - number: '6.3'
    text: Onze Minister kan bij de vaststelling van het bedrag van de vermindering van de opgave van de betrokkene afwijken.
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel6
  - number: '6.4'
    text: |-
      Het eerste, tweede en derde lid vinden overeenkomstige toepassing ten aanzien van de arbeid of bedrijf en de
      inkomsten daaruit, bedoeld in [artikel 5, tweede en derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006041#Artikel5
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006041
        artikel: '5'
  - number: '6.5'
    text: |-
      De betrokkene aan wie uitkering is toegekend, wordt door het aanvaarden van de uitkering geacht erin toe
      te stemmen, dat allen, die daarvoor naar het oordeel van Onze Minister in aanmerking komen, omtrent zijn
      omstandigheden alle inlichtingen geven, welke voor de uitvoering van dit besluit noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel6
  - number: '7'
    text: |-
      Onze Minister kan bepalen, dat inkomsten welke zijn genoten uit hoofde van overwerk, bij wijze van gratificatie,
      ter zake van een vrijwillige verbintenis bij het Korps Nationale Reserve, bij de politie als vrijwillige ambtenaar,
      aangesteld voor de uitvoering van de politietaak of bij andere door Onze Minister aan te wijzen reserveorganen,
      geheel of ten dele niet worden aangemerkt als inkomsten.
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel7
  - number: 7a.1
    text: |-
      Indien de betrokkene ongeschikt is tot het verrichten van zijn arbeid wegens ziekte, is hij verplicht daarvan
      terstond mededeling te doen aan Onze Minister. De betrokkene is eveneens verplicht zijn herstel terstond te melden.
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel7a
  - number: 7a.2
    text: |-
      De uitkering wordt niet uitbetaald voor de duur dat de betrokkene de in het eerste lid bedoelde verplichting niet
      nakomt.
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel7a
  - number: '8'
    text: |-
      Indien de betrokkene ongeschikt is tot het verrichten van zijn arbeid wegens ziekte, kan hij door Onze Minister
      worden verplicht zich geneeskundig te doen onderzoeken.
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel8
  - number: '9.1'
    text: 'Het recht op uitkering eindigt:'
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel9
  - number: 9.1.a
    text: |-
      behoudens het bepaalde in het tweede lid, met ingang van de dag waarop de betrokkene recht verkrijgt op een
      uitkering op grond van de [WAO][ref1] of de [Wet WIA][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0019057
  - number: 9.1.b
    text: met ingang van de dag volgende op die waarop de betrokkene is overleden;
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel9
  - number: 9.1.c
    text: |-
      met ingang van de eerste dag van de maand volgend op die waarin de betrokkene de pensioengerechtigde leeftijd heeft
      bereikt.
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel9
  - number: '9.2'
    text: |-
      In afwijking van het eerste lid, onderdeel *a*, eindigt het recht op uitkering indien de betrokkene
      arbeidsongeschikt is voor het vervullen van de betrekking die hij gedurende de met recht op uitkering doorgebrachte
      tijd bekleedde en waarin hij deelnemer was in de zin van het pensioenreglement, met ingang van de dag waarop
      betrokkene uit bedoelde betrekking wordt ontslagen.
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel9
  - number: '9.3'
    text: 'Het recht op uitkering kan geheel of ten dele vervallen worden verklaard indien de betrokkene:'
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel9
  - number: 9.3.a
    text: zich zodanig gedraagt dat hij, ware hij in dienst gebleven, zou zijn ontslagen;
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel9
  - number: 9.3.b
    text: |-
      weigert mee te werken aan een onderzoek tot vaststelling van zijn arbeidsongeschiktheid ter verkrijging van een
      uitkering op grond van de [WAO][ref1] of de [Wet WIA][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0019057
  - number: '9.4'
    text: |-
      In afwijking van [artikel 1][ref1] wordt voor de betrokkene aan wie voor 1 januari 2018 ontslag is verleend,
      verstaan onder pensioengerechtigde leeftijd: de leeftijd van 65 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006041#Artikel1
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006041
        artikel: '1'
  - number: '10.1'
    text: |-
      Indien en voorzover de aan betrokkene toegekende uitkering op grond van de [WAO][ref1] of de [Wet WIA][ref2],
      eventueel vermeerderd met een invaliditeitspensioen of een ABP ArbeidsongeschiktheidsPensioen, lager is dan de
      uitkering waarop hij aanspraak zou hebben gehad, indien er geen sprake zou zijn van arbeidsongeschiktheid, wordt
      hem het verschil bij wijze van toelage uitgekeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0019057
  - number: '10.2'
    text: |-
      De betrokkene die na afloop van de periode van 52 weken, bedoeld in [artikel 19 van de WAO][ref1], geen
      uitkering op grond van de [WAO][ref2] aanvraagt dan wel die na afloop van de periode van 104 weken, bedoeld in
      [artikel 23 van de Wet WIA][ref3], geen uitkering ingevolge de [Wet WIA][ref4] aanvraagt, wordt voor de toepassing
      van dit besluit behandeld alsof hem een uitkering op grond van de WAO dan wel is toegekend waarbij hij volledig en
      duurzaam arbeidsongeschikt is.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '23'
      - id: ref4
        bwb_id: BWBR0019057
  - number: '10.3'
    text: |-
      Indien de uitkering op grond van de [WAO][ref1] of de [Wet WIA][ref2] van de betrokkene die ter zake van dezelfde
      dienstverhouding aanspraak heeft op een uitkering en een uitkering op grond van de WAO of de Wet WIA, als gevolg
      van een handelen of nalaten een vermindering ondergaat, of het recht daarop geheel of gedeeltelijk wordt geweigerd,
      wordt bedoelde uitkering op grond van de WAO of de Wet WIA voor de toepassing van dit besluit geacht onverminderd
      te zijn genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0019057
  - number: '11'
    text: |-
      Ten aanzien van de betrokkene, die na zijn ontslag uit hoofde van ziekte of arbeidsongeschiktheid nog aanspraken
      in verband met de betrekking, waaruit hij is ontslagen, heeft of krijgt, wordt de uitkering dan wel de toelage
      bedoeld in [artikel 10][ref1] tot het einde van de periode, waarover die aanspraken bestaan, verminderd met het
      bedrag daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0006041#Artikel10
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006041
        artikel: '10'
  - number: '12'
    text: |-
      Indien de betrokkene de gegevens, die noodzakelijk zijn voor de vaststelling of de vermindering van de uitkering
      niet, niet volledig of onjuist verstrekt, kan worden bepaald, dat de uitkering, zolang zulks het geval is, niet of
      slechts gedeeltelijk wordt uitbetaald.
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel12
  - number: '13.1'
    text: |-
      De uitkering over een maand berekend, wordt in maandelijkse termijnen betaald. Met toestemming van de betrokkene
      kan de uitbetaling in langere termijnen geschieden.
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel13
  - number: '13.2'
    text: |-
      Zo spoedig mogelijk na het overlijden van de betrokkene aan wie uitkering is toegekend, wordt aan de weduwe
      of weduwnaar, van wie de overledene niet duurzaam gescheiden leefde, een bedrag uitgekeerd gelijk aan de
      bezoldiging over een tijdvak van drie maanden. Wordt op de uitkering een vermindering toegepast krachtens de
      [artikelen 4a][ref1], [5, eerste lid][ref2], [6][ref3] en [12][ref4], of wordt [artikel 9, derde lid][ref5],
      toegepast, dan is de in de eerste volzin bedoelde uitkering gelijk aan het bedrag van de uitkering die de
      betrokkene op de dag van het overlijden ontving, over een tijdvak van drie maanden. Ingeval recht bestaat op
      twee uitkeringen als bedoeld in [artikel 1, onderdeel j][ref6], en geen vermindering, anders dan krachtens
      [artikel 5, vijfde lid, eerste volzin][ref7], krachtens enige bepaling van dit besluit wordt toegepast, wordt
      meerbedoelde uitkering gesteld op het bedrag van de hoogste bezoldiging, waarvan de betreffende uitkering is
      afgeleid, over een tijdvak van drie maanden. Indien zulks wel het geval is, wordt op het bedrag der uitkering
      in mindering gebracht de uitkering wegens overlijden, waarop aanspraak bestaat uit hoofde van een andere
      dienstbetrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0006041#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0006041#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0006041#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0006041#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0006041#Artikel9
      [ref6]: https://wetten.overheid.nl/BWBR0006041#Artikel1
      [ref7]: https://wetten.overheid.nl/BWBR0006041#Artikel5
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006041
        artikel: 4a
      - id: ref2
        bwb_id: BWBR0006041
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0006041
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0006041
        artikel: '12'
      - id: ref5
        bwb_id: BWBR0006041
        artikel: '9'
      - id: ref6
        bwb_id: BWBR0006041
        artikel: '1'
      - id: ref7
        bwb_id: BWBR0006041
        artikel: '5'
  - number: '13.3'
    text: |-
      Voor de toepassing van [dit artikel][ref1] wordt onder weduwe of weduwnaar mede verstaan de achtergebleven
      geregistreerde partner dan wel de achtergebleven partner die is aangemeld bij de Stichting Pensioenfonds ABP en
      door het bestuur van dat fonds als zodanig is aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006041#Artikel13
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006041
        artikel: '13'
  - number: '13.4'
    text: |-
      De in het derde lid bedoelde gelijkstelling is niet van toepassing indien die aanmerking als partner anders dan
      door overlijden van de betrokken ambtenaar is geëindigd.
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel13
  - number: '13.5'
    text: |-
      Laat de overledene geen weduwe of geen weduwnaar na van wie hij, onderscheidenlijk zij, niet duurzaam gescheiden
      leefde, dan geschiedt de uitkering van het in het tweede lid bedoelde bedrag ten behoeve van de minderjarige
      kinderen van de overledene, of minderjarige kinderen waarover de overledene ten tijde van het overlijden de
      pleegouderlijke zorg droeg. Onder pleegouderlijke zorg wordt verstaan de zorg voor het onderhoud en de opvoeding
      van het kind, als was het een eigen kind, onafhankelijk van enige verplichting daartoe of van het genieten van een
      vergoeding daarvoor. Ontbreken ook zodanige kinderen, dan geschiedt de uitkering van het in het tweede lid bedoelde
      bedrag aan degenen die geheel of grotendeels afhankelijk waren van de inkomsten van de overledene.
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel13
  - number: '13.6'
    text: |-
      Op de uitkering, bedoeld in het tweede of derde lid, wordt in mindering gebracht het bedrag van de uitkering waarop
      de nagelaten betrekkingen van de gewezen ambtenaar ter zake van diens overlijden aanspraak kunnen maken krachtens
      [artikel 62, zevende lid, van het Burgerlijk ambtenarenreglement defensie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel62
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '62'
  - number: '13.7'
    text: |-
      Laat de overledene geen betrekkingen, als bedoeld in het tweede, derde of vierde lid na, dan kan het aldaar
      bedoelde bedrag geheel of ten dele worden uitgekeerd voor de betaling van de kosten van de laatste ziekte en van de
      lijkbezorging, indien zijn nalatenschap voor de betaling van die kosten ontoereikend is.
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel13
  - number: '15'
    text: |-
      Een uitkering op grond van de Regeling functioneel leeftijdsontslag toegekend terzake van een ontslag uit de
      burgerlijke openbare dienst bij het Ministerie van Defensie, wordt gelijkgesteld met een uitkering, toegekend op
      grond van dit besluit.
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel15
  - number: 15a
    text: |-
      Na inwerkingtreding van de [Wet normalisering rechtspositie ambtenaren][ref1] berust dit besluit op
      [artikel 12o van de Wet ambtenaren defensie][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0039393
      [ref2]: https://wetten.overheid.nl/BWBR0001952#Artikel12o
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0039393
      - id: ref2
        bwb_id: BWBR0001952
        artikel: 12o
  - number: '16'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst en werkt terug tot en met 1 april 1993.
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel16
  - number: '17'
    text: |-
      Dit besluit wordt aangehaald als "Besluit uitkering wegens functioneel leeftijdsontslag burgerlijke ambtenaren
      defensie",
    url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#Artikel17
