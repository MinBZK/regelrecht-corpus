preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Defensie van 1 februari 1993, nr. PAV2210/93002671;

    Gelet op de artikelen 125 van de Ambtenarenwet 1929;

    De Raad van State gehoord (advies van 29 maart 1993, nr. WO7.93.0066);

    Gezien het nader rapport van Onze Minister van Defensie van 16 juni 1993, nr. PAV2210/93008947;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006041/2023-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: - *ABP ArbeidsongeschiktheidsPensioen:* een ABP ArbeidsongeschiktheidsPensioen
      krachtens het pensioenreglement;
        - *arbeidsongeschiktheid:* arbeidsongeschiktheid in de zin van [artikel 18, eerste lid, van de WAO][ref1] en als
      bedoeld in de [artikelen 4][ref2] en [5 van de Wet WIA][ref3];
        - *betrokkene:* de gewezen ambtenaar in de zin van het [Burgerlijk ambtenarenreglement defensie][ref4], aan wie
      ontslag bedoeld onder b van dit artikel is verleend;
        - *extra opbouw ouderdomspensioen:* het verschil tussen de opbouw conform artikel 7.5 van het pensioenreglement en
      de opbouw conform de overgangsbepaling B bij artikel 7.5 van het pensioenreglement;
        - *invaliditeitspensioen:* een invaliditeitspensioen krachtens het pensioenreglement;
        - *ontslag:* een ontslag als bedoeld in [artikel 119 van het Burgerlijk ambtenarenreglement defensie][ref5] zoals
      dat op 31 december 2005 gold dan wel [artikel 171a van het Burgerlijk ambtenarenreglement defensie][ref6];
        - *Onze Minister:* Onze Minister van Defensie;
        - *pensioen:* een pensioen krachtens het pensioenreglement;
        - *pensioengerechtigde leeftijd:* de pensioengerechtigde leeftijd die voor de betrokkene geldt op grond van
      [artikel 7a van de Algemene Ouderdomswet][ref7];
        - *pensioenreglement:* het pensioenreglement Stichting Pensioenfonds ABP;
        - *Stichting Pensioenfonds ABP:* de Stichting Pensioenfonds ABP, bedoeld in
      [artikel 6 van de Wet privatisering ABP][ref8];
        - *uitkering:* de uitkering bedoeld in [artikel 3][ref9] van dit besluit;
        - *versterkt ouderdomspensioen:* het bedrag aan ouderdomspensioen dat voortvloeit uit het flexibel pensioen
      ingevolge het pensioenreglement, alsook de extra inkoop ouderdomspensioen ingevolge overgangsbepaling D bij artikel
      7.5 van het pensioenreglement en extra opbouw ouderdomspensioen.
        - *WAO:* de [Wet op de arbeidsongeschiktheidsverzekering][ref10];
        - *Wet WIA:* [Wet Werk en inkomen naar arbeidsvermogen][ref11];


