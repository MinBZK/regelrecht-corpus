  - number: 4a
    text: |-
      1 De in [artikel 4][ref1] genoemde uitkering wordt, voor zover daarop recht bestaat, verminderd met het bedrag
      van het flexibel pensioen krachtens het Pensioenreglement van de Stichting Pensioenfonds Abp, het bedrag van de
      basisuitkering krachtens het Reglement FPU en het bedrag van de aanvullende uitkering krachtens het Reglement FPU.

      2 Indien het bedrag van de basisuitkering is verminderd in verband met samenloop van andere inkomsten, wordt voor
      de toepassing van het eerste lid niettemin uitgegaan van het onverminderde bedrag.

      3 Indien de op grond van [artikel 119 van het Burgerlijk ambtenarenreglement defensie][ref2] ontslagen ambtenaar
      niet of niet tijdig de basisuitkering, de aanvullende uitkering en het flexibel pensioen aanvraagt, en hem dit
      redelijkerwijs kan worden verweten, wordt, voor de periode waarin hij dientengevolge geen of niet alle voornoemde
      uitkeringen ontvangt, voor de toepassing van dit artikel rekening gehouden met de uitkeringen die hij vanaf de
      ontslagdatum zou hebben genoten indien hij de voornoemde uitkeringen wel tijdig zou hebben aangevraagd.

      4 Indien als gevolg van handelingen of nalaten van handelingen door de ambtenaar de basisuitkering of de
      aanvullende uitkering geheel of ten dele vervallen zijn verklaard dan wel geheel of gedeeltelijk worden geweigerd,
      worden deze uitkeringen voor de toepassing van dit artikel steeds aangemerkt als uitkeringen die onverminderd zijn
      genoten.

      5 Ingeval naast de in [artikel 4][ref3] genoemde uitkering inkomsten uit of in verband met arbeid of bedrijf
      als bedoeld in [artikel 5][ref4] worden genoten, wordt op de uitkering in voorkomend geval boven de vermindering
      die reeds krachtens het eerste lid van dit artikel plaatsvindt, een vermindering toegepast. Deze vermindering is
      gelijk aan het bedrag waarmede de onverminderde uitkering krachtens [artikel 4][ref5] vermeerderd met het totaal
      bedrag van de inkomsten, bedoeld in [artikel 5][ref6], en verminderd met het bedrag van de inkomsten dat reeds in
      mindering is gebracht op de basisuitkering krachtens het Reglement FPU tezamen de laatstelijk genoten bezoldiging
      te boven gaat.


