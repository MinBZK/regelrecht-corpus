articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. Onze Minister: Onze Minister van Defensie;

      b. ontslag: een ontslag als bedoeld in [artikel 119 van het Burgerlijk ambtenarenreglement defensie][ref1];

      c. betrokkene: de gewezen ambtenaar in de zin van het [Burgerlijk ambtenarenreglement defensie][ref2], aan wie
      ontslag bedoeld [onder ][ref3] is verleend;

      d. Stichting Pensioenfonds ABP: de Stichting Pensioenfonds ABP, bedoeld in
      [artikel 6 van de Wet privatisering ABP][ref4];

      e. pensioenreglement: het pensioenreglement Stichting Pensioenfonds ABP;

      f. pensioen: een pensioen krachtens het pensioenreglement;

      g. invaliditeitspensioen: een invaliditeitspensioen krachtens het pensioenreglement;

      h. arbeidsongeschiktheid: arbeidsongeschiktheid in de zin van artikel 18, eerste lid, van de WAO;

      i. *WAO*: de [Wet op de arbeidsongeschiktheidsverzekering][ref5];

      j. uitkering: de uitkering bedoeld in [artikel 3][ref6] van dit besluit;

      k. Reglement FPU: het Reglement flexibel pensioen en uittreden ter zake van basisuitkering en aanvullende uitkering
      als bedoeld in artikel 6, tweede lid, van de Centrale vut-overeenkomst overheids- en onderwijspersoneel.


