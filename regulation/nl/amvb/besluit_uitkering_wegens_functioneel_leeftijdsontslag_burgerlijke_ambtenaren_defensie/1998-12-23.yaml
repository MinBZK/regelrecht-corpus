  - number: 4b
    text: |-
      Voor zover betrokkene de mogelijkheid tot vrijwillige voortzetting van zijn pensioenopbouw benut, waardoor ook na
      het bereiken van de leeftijd van 62 jaar zijn pensioenopbouw voor de helft plaatsvindt, zal namens hem de hiervoor
      verschuldigde premie worden betaald, met dien verstande dat hiervan geen groter deel ten laste van betrokkene komt
      dan de pensioenpremie, bedoeld in artikel 4.4, vierde lid, van het Pensioenreglement.
    url: https://wetten.overheid.nl/BWBR0006041/1998-12-23#Artikel4b
  - number: '5'
    text: |-
      1 De inkomsten, die de betrokkene geniet of gaat genieten uit of in verband met arbeid of bedrijf, ter hand genomen
      met ingang van of na de dag van het ontslag, ter zake waarvan de uitkering is toegekend, worden met de uitkering
      verrekend over de maand waarop deze inkomsten betrekking hebben of geacht kunnen worden betrekking te hebben. Deze
      verrekening geschiedt aldus dat de uitkering wordt verminderd met het bedrag waarmede de uitkering, vermeerderd met
      die inkomsten, de bezoldiging overschrijdt.

      2 Het eerste lid vindt overeenkomstige toepassing ten aanzien van inkomsten uit of in verband met arbeid of bedrijf
      ter hand genomen gedurende non-activiteit, vakantie of verlof onmiddellijk voorafgaande aan het ontslag ter zake
      waarvan de uitkering is toegekend.

      3 Wanneer de betrokkene arbeid of bedrijf ter hand heeft genomen vóór de dag van het ontslag, anders dan bedoeld in
      de voorgaande leden en na die dag uit die arbeid of dat bedrijf inkomsten of meer inkomsten gaat genieten, is het
      eerste lid van toepassing, tenzij de betrokkene aannemelijk maakt, dat die inkomsten of vermeerdering van inkomsten
      of een gedeelte daarvan noch het gevolg zijn van een verhoogde werkzaamheid noch verband houden met het ontslag, in
      welk geval de inkomsten, die meerdere inkomsten of dat gedeelte daarvan niet in aanmerking worden genomen voor de
      toepassing van het eerste lid.

      4 Voor de toepassing van dit artikel wordt een uitkering op grond van de Algemene
      Arbeidsongeschiktheidswet, zoals die wet luidde op de dag voorafgaand aan de inwerkingtreding van de
      [Invoeringswet nieuwe en gewijzigde arbeidsongeschiktheidsregelingen][ref1], alsmede een uitkering krachtens de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2] aangemerkt als inkomsten in verband met arbeid.

      5 In afwijking van het bepaalde in de voorgaande leden wordt een tweede uitkering als bedoeld in
      [artikel 1, onderdeel j][ref3], in mindering gebracht op de eerste uitkering.

      In het geval tevens inkomsten als bedoeld in het eerste en derde lid worden genoten, worden deze inkomsten, na
      toepassing van de eerste volzin, op de voet van het eerste lid met de tweede uitkering verrekend.

      6 In bijzondere gevallen kan Onze Minister van het hierboven bepaalde ten gunste van de betrokkene afwijken.


      [ref1]: https://wetten.overheid.nl/BWBR0008658
      [ref2]: https://wetten.overheid.nl/BWBR0008656
      [ref3]: https://wetten.overheid.nl/BWBR0006041#Artikel1
