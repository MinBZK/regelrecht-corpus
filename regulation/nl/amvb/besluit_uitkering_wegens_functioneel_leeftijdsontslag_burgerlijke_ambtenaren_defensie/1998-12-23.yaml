  - number: '3'
    text: |-
      1 De betrokkene heeft recht op uitkering met ingang van de dag van ingang van zijn ontslag.

      2 Onze Minister beslist over de toekenning van uitkering op aanvraag door de betrokkene.
    url: https://wetten.overheid.nl/BWBR0006041/1998-12-23#Artikel3
  - number: '4'
    text: |-
      1 De uitkering bedraagt gedurende 60 maanden 80% van de bezoldiging vermeerderd met zoveel - doch ten hoogste tien
        - malen 0,5% van die bezoldiging als het totaal aantal volle voor pensioen geldige dienstjaren, die medetellen
      voor de pensioenberekening krachtens het pensioenreglement, op de dag van ingang van het ontslag meer dan dertig
      bedraagt en vervolgens 70% van die bezoldiging. Het bedrag van de uitkering daalt echter niet beneden het bedrag
      van het pensioen, waarop de betrokkene recht zou hebben, indien hij uit de betrekking waaruit hij met recht op
      uitkering is ontslagen, op de dag van ontslag zou zijn gepensioneerd.

      2 Onder diensttijd bedoeld in het eerste lid wordt verstaan, voor zover gelegen vóór 1 januari 1996:

      de tijd zoals die voor de betrokkene per 31 december 1995 meetelt voor de pensioenberekening, bedoeld in de
      Algemene burgerlijke pensioenwet;

      voor zover gelegen op of na 1 januari 1996:

      de tijd gedurende welke betrokkene overheidswerknemer is in de zin van de [Wet privatisering ABP][ref1].

      3 Bij de berekening van het bedrag van het pensioen, bedoeld in het eerste lid, wordt mede in aanmerking genomen de
      diensttijd, bedoeld in artikel 5.1, tweede lid, van het pensioenreglement die de betrokkene bij het bereiken van de
      leeftijd van 65 jaar zal kunnen aanwijzen.

      4 Voor de toepassing van het eerste lid wordt de eventuele diensttijd, bedoeld in artikel D 1, tweede lid, van de
      Algemene burgerlijke pensioenwet zoals deze luidde op 31 december 1995, mede in aanmerking genomen. Het verzoek als
      bedoeld in artikel D 2 van genoemde wet wordt daarbij geacht te zijn gedaan.

      5 Wanneer aan de betrokkene na de dag van ingang van het ontslag ter zake waarvan de uitkering is toegekend,
      een overheidspensioen, anders dan ten laste van de Stichting Pensioenfonds ABP, wordt toegekend, vindt zo nodig
      herberekening plaats zowel van het bedrag der uitkering als van het bedrag van het pensioen, genoemd in het eerste
      lid, met ingang van de dag waarop eerstbedoeld pensioen is ingegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007791
    url: https://wetten.overheid.nl/BWBR0006041/1998-12-23#Artikel4
