  - number: '6'
    text: |-
      1 De betrokkene is verplicht van het ter hand nemen van enige arbeid of bedrijf terstond mededeling te doen aan
      Onze Minister onder opgave, voor zover mogelijk, van de inkomsten, die hij uit die werkzaamheden zal trekken. Zijn
      de inkomsten niet vooraf op te geven, dan doet hij tijdig vóór het verschijnen van elke uitkeringstermijn opgave
      van de inkomsten, die hij sinds het ter hand nemen van de werkzaamheden of sinds de vorige opgave heeft genoten.

      Onze Minister geeft nadere voorschriften aangaande het doen van mededelingen door de betrokkene met betrekking tot
      de inkomsten uit of in verband met arbeid of bedrijf.

      2 Brengt de aard van de werkzaamheden of van de inkomsten mede, dat de inkomsten over een langere termijn moeten
      worden berekend, dan geschiedt de opgave dienovereenkomstig en wordt op de uitkering een vermindering toegepast
      van een voorlopig vastgesteld bedrag onder voorbehoud van verrekening aan het eind van de evenbedoelde termijn.
      Ten aanzien van deze verrekening is [artikel 5, eerste lid][ref1], van toepassing, met dien verstande, dat zij
      geschiedt over de in de vorige volzin bedoelde langere termijn in plaats van over iedere maand afzonderlijk.

      3 Onze Minister kan bij de vaststelling van het bedrag van de vermindering van de opgave van de betrokkene
      afwijken.

      4 Het eerste, tweede en derde lid vinden overeenkomstige toepassing ten aanzien van de arbeid of bedrijf en de
      inkomsten daaruit, bedoeld in [artikel 5, tweede en derde lid][ref2].

      5 De betrokkene aan wie uitkering is toegekend, wordt door het aanvaarden van de uitkering geacht erin toe
      te stemmen, dat allen, die daarvoor naar het oordeel van Onze Minister in aanmerking komen, omtrent zijn
      omstandigheden alle inlichtingen geven, welke voor de uitvoering van dit besluit noodzakelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006041#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006041#Artikel5
