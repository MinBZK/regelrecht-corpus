  - number: '7'
    text: |-
      Onze Minister kan bepalen, dat inkomsten welke zijn genoten uit hoofde van overwerk, bij wijze van gratificatie,
      ter zake van een vrijwillige verbintenis bij het Korps Nationale Reserve, bij de Reserve Rijks- en Gemeentepolitie
      of bij andere door Onze Minister aan te wijzen reserveorganen, geheel of ten dele niet worden aangemerkt als
      inkomsten.
    url: https://wetten.overheid.nl/BWBR0006041/1998-12-23#Artikel7
  - number: 7a
    text: |-
      1 Indien de betrokkene ongeschikt is tot het verrichten van zijn arbeid wegens ziekte, is hij verplicht daarvan
      terstond mededeling te doen aan Onze Minister. De betrokkene is eveneens verplicht zijn herstel terstond te melden.

      2 De uitkering wordt niet uitbetaald voor de duur dat de betrokkene de in het eerste lid bedoelde verplichting
      niet nakomt.
    url: https://wetten.overheid.nl/BWBR0006041/1998-12-23#Artikel7a
  - number: '8'
    text: |-
      Indien de betrokkene ongeschikt is tot het verrichten van zijn arbeid wegens ziekte, kan hij door Onze Minister
      worden verplicht zich geneeskundig te doen onderzoeken.
    url: https://wetten.overheid.nl/BWBR0006041/1998-12-23#Artikel8
  - number: '9'
    text: |-
      1 Het recht op uitkering eindigt:

      a. behoudens het bepaalde in het tweede lid, met ingang van de dag waarop de betrokkene recht verkrijgt op een
      uitkering op grond van de WAO;

      b. met ingang van de dag volgende op die waarop de betrokkene is overleden;

      c. met ingang van de eerste dag van de maand volgend op die waarin de betrokkene de leeftijd van 65 jaar heeft
      bereikt.

      2 In afwijking van het eerste lid, onderdeel *a*, eindigt het recht op uitkering indien de betrokkene
      arbeidsongeschikt is voor het vervullen van de betrekking die hij gedurende de met recht op uitkering doorgebrachte
      tijd bekleedde en waarin hij deelnemer was in de zin van het pensioenreglement, met ingang van de dag waarop
      betrokkene uit bedoelde betrekking wordt ontslagen.

      3 Het recht op uitkering kan geheel of ten dele vervallen worden verklaard indien de betrokkene:

      a. zich zodanig gedraagt dat hij, ware hij in dienst gebleven, zou zijn ontslagen;

      b. weigert mee te werken aan een onderzoek tot vaststelling van zijn arbeidsongeschiktheid ter verkrijging van een
      uitkering op grond van de WAO.
    url: https://wetten.overheid.nl/BWBR0006041/1998-12-23#Artikel9
  - number: '10'
    text: |-
      1 Indien en voorzover de aan betrokkene toegekende uitkering op grond van de WAO, eventueel vermeerderd met een
      invaliditeitspensioen, lager is dan de uitkering waarop hij aanspraak zou hebben gehad, indien er geen sprake zou
      zijn van arbeidsongeschiktheid, wordt hem het verschil bij wijze van toelage uitgekeerd.

      2 De betrokkene die na afloop van de periode van 52 weken, bedoeld in artikel 19 van de WAO, geen uitkering op
      grond van de WAO aanvraagt, wordt voor de toepassing van dit besluit behandeld alsof hem een uitkering op grond van
      de WAO is toegekend berekend naar een mate van arbeidsongeschiktheid van 80% of meer.

      3 Indien de uitkering op grond van de WAO van de betrokkene die ter zake van dezelfde dienstverhouding aanspraak
      heeft op een uitkering en een uitkering op grond van de WAO, als gevolg van een handelen of nalaten een
      vermindering ondergaat, of het recht daarop geheel of gedeeltelijk wordt geweigerd, wordt bedoelde uitkering op
      grond van de WAO voor de toepassing van dit besluit geacht onverminderd te zijn genoten.
    url: https://wetten.overheid.nl/BWBR0006041/1998-12-23#Artikel10
  - number: '11'
    text: |-
      Ten aanzien van de betrokkene, die na zijn ontslag uit hoofde van ziekte of arbeidsongeschiktheid nog aanspraken
      in verband met de betrekking, waaruit hij is ontslagen, heeft of krijgt, wordt de uitkering dan wel de toelage
      bedoeld in [artikel 10][ref1] tot het einde van de periode, waarover die aanspraken bestaan, verminderd met het
      bedrag daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0006041#Artikel10
    url: https://wetten.overheid.nl/BWBR0006041/1998-12-23#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006041
        artikel: '10'
  - number: '12'
    text: |-
      Indien de betrokkene de gegevens, die noodzakelijk zijn voor de vaststelling of de vermindering van de uitkering
      niet, niet volledig of onjuist verstrekt, kan worden bepaald, dat de uitkering, zolang zulks het geval is, niet of
      slechts gedeeltelijk wordt uitbetaald.
    url: https://wetten.overheid.nl/BWBR0006041/1998-12-23#Artikel12
  - number: '13'
    text: |-
      1 De uitkering over een maand berekend, wordt in maandelijkse termijnen betaald. Met toestemming van de betrokkene
      kan de uitbetaling in langere termijnen geschieden.

      2 Zo spoedig mogelijk na het overlijden van de betrokkene aan wie uitkering is toegekend, wordt aan de weduwe
      of weduwnaar, van wie de overledene niet duurzaam gescheiden leefde, een bedrag uitgekeerd gelijk aan de
      bezoldiging over een tijdvak van drie maanden. Wordt op de uitkering een vermindering toegepast krachtens de
      [artikelen 4a][ref1], [5, eerste lid][ref2], [6][ref3] en [12][ref4], of wordt [artikel 9, derde lid][ref5],
      toegepast, dan is de in de eerste volzin bedoelde uitkering gelijk aan het bedrag van de uitkering die de
      betrokkene op de dag van het overlijden ontving, over een tijdvak van drie maanden. Ingeval recht bestaat op
      twee uitkeringen als bedoeld in [artikel 1, onderdeel j][ref6], en geen vermindering, anders dan krachtens
      [artikel 5, vijfde lid, eerste volzin][ref7], krachtens enige bepaling van dit besluit wordt toegepast, wordt
      meerbedoelde uitkering gesteld op het bedrag van de hoogste bezoldiging, waarvan de betreffende uitkering is
      afgeleid, over een tijdvak van drie maanden. Indien zulks wel het geval is, wordt op het bedrag der uitkering
      in mindering gebracht de uitkering wegens overlijden, waarop aanspraak bestaat uit hoofde van een andere
      dienstbetrekking.

      3 Voor de toepassing van [dit artikel][ref8] wordt onder weduwe of weduwnaar mede verstaan de achtergebleven
      geregistreerde partner dan wel de achtergebleven partner die is aangemeld bij de Stichting Pensioenfonds ABP en
      door het bestuur van dat fonds als zodanig is aangemerkt.

      4 De in het derde lid bedoelde gelijkstelling is niet van toepassing indien die aanmerking als partner anders dan
      door overlijden van de betrokken ambtenaar is geëindigd.

      5 Laat de overledene geen weduwe of geen weduwnaar na van wie hij, onderscheidenlijk zij, niet duurzaam gescheiden
      leefde, dan geschiedt de uitkering van het in het tweede lid bedoelde bedrag ten behoeve van de minderjarige
      kinderen van de overledene, of minderjarige kinderen waarover de overledene ten tijde van het overlijden de
      pleegouderlijke zorg droeg.

      Onder pleegouderlijke zorg wordt verstaan de zorg voor het onderhoud en de opvoeding van het kind, als was het een
      eigen kind, onafhankelijk van enige verplichting daartoe of van het genieten van een vergoeding daarvoor. Ontbreken
      ook zodanige kinderen, dan geschiedt de uitkering van het in het tweede lid bedoelde bedrag aan degenen die geheel
      of grotendeels afhankelijk waren van de inkomsten van de overledene.

      6 Op de uitkering, bedoeld in het tweede of derde lid, wordt in mindering gebracht het bedrag van de uitkering
      waarop de nagelaten betrekkingen van de gewezen ambtenaar ter zake van diens overlijden aanspraak kunnen maken
      krachtens [artikel 62, zevende lid, van het Burgerlijk ambtenarenreglement defensie][ref9].

      7 Laat de overledene geen betrekkingen, als bedoeld in het tweede, derde of vierde lid na, dan kan het aldaar
      bedoelde bedrag geheel of ten dele worden uitgekeerd voor de betaling van de kosten van de laatste ziekte en van de
      lijkbezorging, indien zijn nalatenschap voor de betaling van die kosten ontoereikend is.


