    text: |-
      1 In dit besluit wordt verstaan onder bezoldiging: de bezoldiging in de zin van het
      [Bezoldigingsbesluit burgerlijke ambtenaren defensie][ref1] vermeerderd met de vakantie-uitkering, berekend over
      een maand, waarop de betrokkene op de dag voorafgaand aan zijn ontslag aanspraak had of bij waarneming van zijn
      functie zou hebben gehad.

      2 In afwijking van het in het eerste lid bepaalde gelden de toelagen, genoemd in de artikelen 13 en 17, eerste lid,
      van het in het eerste lid genoemde besluit en de over die toelagen berekende vakantie-uitkering niet als deel van
      de bezoldiging.

      3 Indien de betrokkene geen ambtenaar is in de zin van het
      [Bezoldigingsbesluit burgerlijke ambtenaren defensie][ref2] geldt als bezoldiging hetgeen met het in het eerste en
      het tweede lid daaromtrent bepaalde overeenkomt.

      4 Indien de door een betrokkene over de laatste aan het ontslag voorafgaande twaalf volle kalendermaanden genoten
      bezoldiging in de zin van het in het eerste lid genoemde besluit, dan wel hetgeen daarmede overeenkomt, alsmede
      de over die maanden genoten vakantie-uitkering dan wel verkregen aanspraak daarop geheel of gedeeltelijk uit
      wisselende inkomsten waaronder begrepen de evengenoemde aanspraken bestonden, geldt in zoverre in afwijking van
      het eerste lid als bezoldiging, met inachtneming van het in het tweede en derde lid bepaalde, het gemiddelde van
      die inkomsten.

      5 Indien in de bezoldiging, omschreven in het eerste tot en met het vierde lid, anders dan ten gevolge van
      periodieke verhoging van het salaris, wijziging zou zijn gekomen wanneer de betrokkene op die bezoldiging in
      dienst zou zijn gebleven, zal van de dag van inwerkingtreding van die wijziging af het aldus gewijzigd bedrag als
      bezoldiging gelden.

      6 Voor betrekkingen die geleidelijk worden opgeheven, alsmede in bijzondere gevallen, kan Onze Minister van het
      hiervoren bepaalde ten gunste van de betrokkene afwijken.


      [ref1]: https://wetten.overheid.nl/BWBR0006038
      [ref2]: https://wetten.overheid.nl/BWBR0006038
