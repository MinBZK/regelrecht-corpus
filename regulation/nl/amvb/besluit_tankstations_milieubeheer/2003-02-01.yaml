        artikel: '8'
  - number: '9.3'
    text: |-
      In gevallen waarin met betrekking tot een tankstation voor het wegverkeer de bij dit besluit gestelde regels
      overeenkomstig het eerste lid gaan gelden voor of met ingang van 1 juli 1995, gelden de voorschriften die zijn
      opgenomen in de bij dit besluit behorende [bijlage I][ref1], [onder 2.2][ref2], met ingang van 1 juli 1997.


      [ref1]: https://wetten.overheid.nl/BWBR0006423
      [ref2]: https://wetten.overheid.nl/BWBR0006423
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006423
      - id: ref2
        bwb_id: BWBR0006423
  - number: '9.4'
    text: |-
      In gevallen waarin een tankstation voor het wegverkeer is opgericht na 1 januari 1992, doch voor 1 juli 1996,
      gelden de voorschriften die zijn opgenomen in de bij dit besluit behorende [bijlage I][ref1], [onder 2.2][ref2],
      met ingang van 1 juli 1997.


      [ref1]: https://wetten.overheid.nl/BWBR0006423
      [ref2]: https://wetten.overheid.nl/BWBR0006423
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006423
      - id: ref2
        bwb_id: BWBR0006423
  - number: '9.5'
    text: |-
      Indien de bodem van een tankstation dat is opgericht vóór 1 januari 1987, wordt gesaneerd, geschiedt dit
      overeenkomstig de Handleiding bodemsanering tankstations.
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel9
  - number: '10.1'
    text: |-
      Degene die een tankstation voor het wegverkeer drijft, dat is opgericht vóór 1 januari 1992, meldt binnen vier
      weken na het in werking treden van dit besluit aan het bevoegd gezag dat hij het tankstation in werking heeft. De
      melding wordt gedaan op een formulier waarvan het model wordt vastgesteld door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel10
  - number: '10.2'
    text: |-
      Een melding als bedoeld in het eerste lid van dit artikel is niet vereist, indien voor het tankstation voor het
      wegverkeer al eerder een kennisgeving of melding met gebruikmaking van het meldingsformulier, opgenomen in bijlage
      III bij het werkprogramma of een kennisgeving of melding als bedoeld in het vierde lid, is gedaan.
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel10
  - number: '10.3'
    text: |-
      Degene die een tankstation voor het wegverkeer drijft dat is opgericht vóór 1 januari 1992, meldt binnen vier weken
      na het tijdstip waarop de artikelen 2 en 3 op dit tankstation van toepassing worden aan het bevoegd gezag en de
      inspecteur dat hij het tankstation voor het wegverkeer in werking heeft. De melding wordt gedaan op een formulier
      waarvan het model wordt vastgesteld door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel10
  - number: '10.4'
    text: |-
      De melding als bedoeld in het derde lid van dit artikel is niet vereist, indien voor het tankstation voor het
      wegverkeer een kennisgeving als bedoeld in artikel 1*a* van het Hinderbesluit of een melding als bedoeld in
      [artikel 8.19, tweede lid, van de Wet milieubeheer][ref1] is gedaan, met gebruikmaking van het formulier opgenomen
      in bijlage IV bij het werkprogramma dan wel een formulier als bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: '12'
    text: |-
      Dit besluit treedt in werking met ingang van 1 maart 1994 met uitzondering van [artikel 8][ref1], dat in werking
      treedt met ingang van 1 juli 1995.


      [ref1]: https://wetten.overheid.nl/BWBR0006423#Artikel8
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel12
    references:
