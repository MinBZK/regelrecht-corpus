        bwb_id: BWBR0006423
        artikel: '8'
  - number: '2.1'
    text: |-
      Degene die een tankstation voor het wegverkeer type A drijft, dient, behalve aan de voorschriften die aan de
      vergunning zijn verbonden, te voldoen aan de voorschriften, die zijn opgenomen in de bij dit besluit behorende
      [bijlage I][ref1], alsmede aan de krachtens deze voorschriften door het bevoegd gezag gestelde nadere eisen.
      De voorschriften, opgenomen in [bijlage I][ref2], zijn niet van toepassing op drukapparatuur, samenstellen
      en druksystemen waarop het [Besluit drukapparatuur][ref3] van toepassing is, voor zover de voorschriften
      betrekking hebben op het ontwerp, de fabricage, de overeenstemmingsbeoordeling en de ingebruikneming, bedoeld in
      [dat besluit][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006423
      [ref2]: https://wetten.overheid.nl/BWBR0006423
      [ref3]: https://wetten.overheid.nl/BWBR0010586
      [ref4]: https://wetten.overheid.nl/BWBR0010586
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006423
      - id: ref2
        bwb_id: BWBR0006423
      - id: ref3
        bwb_id: BWBR0010586
      - id: ref4
        bwb_id: BWBR0010586
  - number: '2.2'
    text: |-
      Een beschikking waarin nadere eisen worden gesteld, wordt gezonden aan de inspecteur. Tevens wordt zij
      bekendgemaakt door kennisgeving in één of meer dag-, nieuws-, of huis-aan-huisbladen.
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel2
  - number: '3'
    text: |-
      Degene die een tankstation voor het wegverkeer type B drijft, dient te voldoen aan de voorschriften die
      zijn opgenomen in de bij dit besluit behorende [bijlagen I][ref1] en [II][ref2], alsmede aan de krachtens
      deze voorschriften door het bevoegd gezag gestelde nadere eisen. De voorschriften, opgenomen in de
      [bijlagen I][ref3] en [II][ref4], zijn niet van toepassing op drukapparatuur, samenstellen en druksystemen
      waarop het [Besluit drukapparatuur][ref5] van toepassing is, voor zover de voorschriften betrekking hebben op
      het ontwerp, de fabricage, de overeenstemmingsbeoordeling en de ingebruikneming, bedoeld in [dat besluit][ref6].
      [Artikel 2, tweede lid][ref7], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006423
      [ref2]: https://wetten.overheid.nl/BWBR0006423
      [ref3]: https://wetten.overheid.nl/BWBR0006423
      [ref4]: https://wetten.overheid.nl/BWBR0006423
      [ref5]: https://wetten.overheid.nl/BWBR0010586
      [ref6]: https://wetten.overheid.nl/BWBR0010586
      [ref7]: https://wetten.overheid.nl/BWBR0006423#Artikel2
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006423
      - id: ref2
        bwb_id: BWBR0006423
      - id: ref3
        bwb_id: BWBR0006423
      - id: ref4
        bwb_id: BWBR0006423
      - id: ref5
        bwb_id: BWBR0010586
      - id: ref6
        bwb_id: BWBR0010586
      - id: ref7
        bwb_id: BWBR0006423
        artikel: '2'
  - number: '4.1'
    text: |-
      Degene die voornemens is een tankstation voor het wegverkeer type B op te richten meldt dit ten minste vier weken
      voor het oprichten aan het bevoegd gezag en de inspecteur.
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel4
  - number: '4.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot het uitbreiden of wijzigen van een tankstation
      voor het wegverkeer type B, dan wel met betrekking tot het veranderen van de werking daarvan. Deze melding is niet
      vereist indien eerder een melding overeenkomstig het bepaalde in dit artikel is gedaan en door dit uitbreiden,
      wijzigen of veranderen van de werking van het tankstation voor het wegverkeer geen afwijking ontstaat van de bij
      die melding eerder versterkte gegevens.
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel4
  - number: '4.3'
    text: |-
      Bij een melding als bedoeld in het eerste en tweede lid wordt in ieder geval het tijdstip vermeld, waarop het
      tankstation voor het wegverkeer of de uitbreiding of wijziging daarvan in werking zal worden gebracht dan wel
      de verandering van de werking daarvan verwezenlijkt zal zijn, en worden de resultaten van een onderzoek zoals
      voorgeschreven in [artikel 5, eerste en tweede lid][ref1], en alle andere gegevens verstrekt, die in de bij dit
      besluit behorende [bijlage III][ref2] zijn aangegeven. De melding wordt gedaan op een formulier waarvan het model
      wordt vastgesteld door Onze Minister. Onze Minister kan daarbij nadere regels stellen met betrekking tot de in
      [bijlage III][ref3] bedoelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0006423#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006423
      [ref3]: https://wetten.overheid.nl/BWBR0006423
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006423
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0006423
      - id: ref3
        bwb_id: BWBR0006423
  - number: '4.4'
    text: |-
      Degene die een melding heeft gedaan als bedoeld in het eerste of het tweede lid, stelt het bevoegd gezag zodanig
      tijdig in kennis van een wijziging van het in het derde lid bedoelde tijdstip, dat het bevoegd gezag in staat is
      voorafgaand aan dat tijdstip te controleren of aan de in [bijlage I][ref1] en II opgenomen voorschriften wordt
      voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006423
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006423
  - number: '5.1'
    text: |-
      Ingeval van het oprichten van een tankstation voor het wegverkeer is degene die het tankstation drijft, verplicht
      tot het uitvoeren van een verkennend onderzoek tankstations, waarbij de voorgenomen aktiviteiten op het tankstation
      bepalend zijn voor de te maken keuzen in het verkennend onderzoek tankstations. Hij geeft het bevoegd gezag vóór
      het in werking brengen van het tankstation kennis van de resultaten van dit onderzoek.
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel5
  - number: '5.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot een uitbreiding of wijziging van een
      tankstation voor het wegverkeer, voor zover dit uitbreiden of wijzigen tot gevolg heeft dat een ondergrondse tank,
      een vulpunt van een ondergrondse tank of een afleverzuil op een lokatie komt te liggen, waarop een eerder verricht
      onderzoek als bedoeld in het eerste, derde of vierde lid geen betrekking had.
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel5
  - number: '5.3'
    text: |-
      Degene die een tankstation voor het wegverkeer drijft, dat is opgericht vóór 1 januari 1992, geeft het bevoegd
      gezag, vóór het tijdstip waarop de artikelen 2 en 3 op dit tankstation van toepassing worden, kennis van de
      resultaten van een verkennend onderzoek tankstations.
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel5
  - number: '5.4'
    text: |-
      Degene die een tankstation drijft dat op of na 1 januari 1992 en voor het tijdstip van in werking treden van dit
      besluit is opgericht, geeft het bevoegd gezag vóór 1 september 1994 kennis van de resultaten van een verkennend
      onderzoek tankstations.
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel5
  - number: '5.5'
    text: |-
      Indien een bodemsanering bij een tankstation voor het wegverkeer is uitgevoerd en een afsluitend evaluatie-
      onderzoek heeft plaatsgevonden, worden de resultaten van dat evaluatie-onderzoek aan het bevoegd gezag overgelegd
      binnen vier weken nadat die resultaten aan degene die de inrichting drijft, bekend zijn geworden. In voorkomende
      gevallen maakt het bevoegd gezag gebruik van de resultaten van het evaluatie-onderzoek in plaats van de resultaten
      van het verkennend onderzoek tankstations.
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel5
  - number: '6.1'
    text: |-
      Ingeval van het buiten gebruik stellen van een tankstation voor het wegverkeer is degene die het tankstation
      drijft, verplicht tot het uitvoeren van een verkennend onderzoek tankstations. Hij geeft het bevoegd gezag
      binnen zes maanden na het tijdstip van het buiten gebruik stellen kennis van de resultaten van dit onderzoek. De
      verplichting tot het uitvoeren van een verkennend onderzoek tankstations geldt niet indien een door Onze Minister
      aangewezen rechtspersoon zich heeft verplicht de bodemsanering bij het tankstation te bekostigen.
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel6
  - number: '6.2'
    text: |-
      Indien een tankstation voor het wegverkeer waarvoor eerder een onderzoek als bedoeld in [artikel 5][ref1] is
      verricht, zodanig wordt gewijzigd dat een lokatie waarop een ondergrondse tank, vulpunt of afleverzuil was gelegen,
      buiten gebruik wordt gesteld, is voor een dergelijke lokatie het eerste lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006423#Artikel5
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006423
        artikel: '5'
  - number: '7.1'
    text: |-
      Op verzoek van degene die op of in een gedeelte van de bodem ten aanzien waarvan hem de nodige bevoegdheid
      ontbreekt, een onderzoek naar de aanwezigheid van verontreiniging van de bodem ingevolge dit besluit dient te
      verrichten, kan het bevoegd gezag de rechthebbenden ten aanzien van dat gedeelte van de bodem een verplichting
      opleggen als bedoeld in [artikel 70 van de Wet bodembescherming](onbekend).
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel7
  - number: '7.2'
    text: 'Degene die een verzoek doet als bedoeld in het eerste lid, verstrekt bij het verzoek de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel7
  - number: 7.2.a
    text: de naam en het adres van de verzoeker en de rechthebbenden;
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel7
  - number: 7.2.b
    text: de kadastrale gegevens van de plaats waar het onderzoek dient te worden verricht;
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel7
  - number: 7.2.c
    text: een omschrijving van de aard en de omvang van het onderzoek;
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel7
  - number: 7.2.d
    text: het tijdstip waarop het onderzoek dient te worden verricht;
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel7
  - number: 7.2.e
    text: een omschrijving van de handelingen die de rechthebbenden in het belang van het onderzoek dienen na te laten.
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel7
  - number: '8.1'
    text: |-
      Degene die een tankstation voor het wegverkeer drijft, stelt financiële zekerheid ter dekking van de
      aansprakelijkheid die voortvloeit uit verontreiniging van de bodem als gevolg van het drijven van het tankstation.
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel8
  - number: '8.2'
    text: |-
      De zekerheid bedraagt € 226 890,11 per ondergrondse tank. Bij aanwezigheid van meer dan zes ondergrondse tanks
      bedraagt de zekerheid in totaal € 1 361 340,65.
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel8
  - number: '8.3'
    text: |-
      De zekerheid wordt in stand gehouden tot vier weken nadat de resultaten van een verkennend onderzoek overeenkomstig
      [artikel 6, eerste lid][ref1], aan het bevoegd gezag zijn gemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006423#Artikel6
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006423
        artikel: '6'
  - number: '8.4'
    text: |-
      Indien bij een melding als bedoeld in [artikel 6, eerste lid][ref1], blijkt dat de bodem is verontreinigd, wordt
      de financiële zekerheid, in afwijking van het bepaalde in het derde lid, in stand gehouden tot het tijdstip waarop
      gedeputeerde staten aan degene die het tankstation voor het wegverkeer drijft, schriftelijk verklaren dat de door
      hen nodig geachte maatregelen zijn genomen. Degene die het tankstation voor het wegverkeer drijft, kan gedeputeerde
      staten schriftelijk verzoeken om een verklaring als bedoeld in de eerste volzin. Gedeputeerde staten beslissen op
      het verzoek uiterlijk vier weken nadat het is verzonden.


      [ref1]: https://wetten.overheid.nl/BWBR0006423#Artikel6
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006423
        artikel: '6'
  - number: 8e
    text: |-
      Burgemeester en wethouders van de gemeenten Amsterdam, 's-Gravenhage, Rotterdam en Utrecht, van gemeenten
      die zijn aangewezen krachtens [artikel 88, negende lid, van de Wet bodembescherming][ref1] en, indien
      is voldaan aan de tweede volzin, het bestuur van een regionaal openbaar lichaam als bedoeld in de
      [Kaderwet bestuur in verandering][ref2], worden voor de toepassing van [artikel 8, vierde lid][ref3],
      gelijkgesteld met gedeputeerde staten. De gelijkstelling van het bestuur van een regionaal openbaar lichaam
      vindt toepassing indien de in [artikel 8, vierde lid][ref4], bedoelde bevoegdheden met toepassing van
      [artikel 20 van de Kaderwet bestuur in verandering][ref5] aan dat bestuur zijn overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0006620
      [ref3]: https://wetten.overheid.nl/BWBR0006423#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0006423#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0006620#Artikel20
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel8e
