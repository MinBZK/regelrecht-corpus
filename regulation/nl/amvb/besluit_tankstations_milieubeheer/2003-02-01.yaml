preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 5 april 1993, nr.
    MJZ05493032, Centrale Directie Juridische Zaken, afdeling Wetgeving;

    Gelet op de artikelen 8.40, 8.41, 8.42, 8.44 en 21.8 van de Wet milieubeheer en, voor zover het betreft de
    artikelen 7 en 8 van dit besluit, de artikelen 10, 17, eerste en tweede lid, en 44 van de Wet bodembescherming;

    De Raad van State gehoord (advies van 23 september 1993, nr. W08.93.0214);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 19
    januari 1994, nr. MJZ19194002, Centrale Directie Juridische Zaken, afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel1
  - number: 1.a
    text: |-
      tankstation voor het wegverkeer: een inrichting die bestemd is voor de openbare verkoop aan derden van benzine of
      dieselolie voor motorvoertuigen voor het wegverkeer;
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel1
  - number: 1.b
    text: |-
      tankstation voor het wegverkeer type A: een tankstation voor het wegverkeer niet zijnde een tankstation voor het
      wegverkeer type B;
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel1
  - number: 1.c
    text: 'tankstation voor het wegverkeer type B: een tankstation voor het wegverkeer, voor zover:'
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel1
  - number: 1.c.1°
    text: |-
      het tankstation geen deel uitmaakt van een inrichting, waar ook andere werkzaamheden worden verricht dan het
      afleveren van motorbrandstoffen, het wassen van motorvoertuigen of het verlenen van service aan het wegverkeer;
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel1
  - number: 1.c.2°
    text: LPG niet aanwezig is in een stationair reservoir;
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel1
  - number: 1.c.3°
    text: |-
      op het bewaren van propaan anders dan in spuitbussen of gasflessen het
      [Besluit voorzieningen en installaties milieubeheer][ref1] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0012897
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012897
  - number: 1.c.4°
    text: |-
      ten hoogste vier flessen brandbaar gas, elk met een waterinhoud van ten hoogste 60 liter, of ten hoogste zes
      flessen zuurstof, elk met een waterinhoud van ten hoogste 50 liter, aanwezig zijn en deze gassen bovendien
      uitsluitend ten behoeve van lassen of snijden worden gebezigd;
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel1
  - number: 1.c.5°
    text: geen bovengrondse bewaring van K1- of K2-produkten in tanks plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel1
  - number: 1.c.6°
    text: |-
      bovengrondse bewaring van gasolie, lichte stookolie, smeerolie of afgewerkte olie in tanks niet meer kan bedragen
      dan 3000 liter per soort;
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel1
  - number: 1.c.7°
    text: |-
      ondergrondse bewaring van benzine of gasolie, alsmede huisbrandolie, lichte stookolie of afgewerkte olie
      uitsluitend plaatsvindt in tanks vervaardigd van staal of kunststof, die niet onder gebouwen zijn gelegen;
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel1
  - number: 1.c.8°
    text: |-
      de kortste afstand tussen een woning van derden of een gevoelig object van derden en een afleverzuil waar
      aflevering van benzine of gasolie, zonder direct toezicht mogelijk is, ten minste 20 m bedraagt;
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel1
  - number: 1.c.9°
    text: |-
      aflevering van benzine of gasolie niet plaatsvindt met behulp van een pomp die zich onder het vloeistofniveau in de
      tank bevindt en
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel1
  - number: 1.c.10°
    text: het tankstation voor het wegverkeer niet is gelegen in een stiltegebied;
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel1
  - number: 1.d
    text: |-
      tankstation voor het wegverkeer klasse I: een tankstation voor het wegverkeer dat op 1 juli 1991 geheel of
      gedeeltelijk gelegen was in een grondwaterbeschermingsgebied;
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel1
  - number: 1.e
    text: |-
      tankstation voor het wegverkeer klasse II: een tankstation voor het wegverkeer, niet zijnde een tankstation voor
      het wegverkeer klasse I, waar, op 1 maart 1994 één of meer ondergrondse tanks aanwezig zijn die niet zijn voorzien
      van een kathodische bescherming als omschreven in voorschrift 5.1.3.2 van CPR 9-1 en die niet zijn gelegen in grond
      waarvan door middel van een bodemweerstandrapport is aangetoond dat de specifieke elektrische weerstand meer dan 50
      ohm.m bedraagt;
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel1
  - number: 1.f
    text: |-
      tankstation voor het wegverkeer klasse III: een tankstation voor het wegverkeer, niet zijnde een tankstation voor
      het wegverkeer klasse I of II, waar, op 1 maart 1994 één of meer ondergrondse tanks aanwezig zijn die vóór 1 juli
      1976 zijn geplaatst en waarvan op of na laatstgenoemd tijdstip geen beoordeling overeenkomstig de voorschriften
      5.2.1.3 en 5.2.1.4 van CPR 9-1 (introductiekeuring) heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel1
  - number: 1.g
    text: |-
      tankstation voor het wegverkeer klasse IV: een tankstation voor het wegverkeer, niet zijnde een tankstation voor
      het wegverkeer klasse I, II of III;
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel1
  - number: 1.h
    text: |-
      bevoegd gezag: het bestuursorgaan dat bevoegd is of zou zijn een vergunning krachtens
      [artikel 8.1 van de Wet milieubeheer][ref1] voor de betrokken inrichting te verlenen;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 1.i
    text: |-
      stiltegebied: een gebied, aangewezen overeenkomstig [artikel 1.2, tweede lid, onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 1.j
    text: |-
      grondwaterbeschermingsgebied: een gebied dat krachtens [artikel 1.2, tweede lid, onder ][ref1] bij de provinciale
      milieuverordening is aangewezen en waarvoor regels zijn gesteld ter bescherming van het grondwater met het oog op
      de waterwinning;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 1.k
    text: 'werkprogramma: werkprogramma milieumaatregelen bij tankstations, uitgegeven door Onze Minister, 10 september 1991;'
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel1
  - number: 1.l
    text: |-
      Handleiding bodemsanering tankstations: de Handleiding bodemsanering tankstations, zoals opgenomen in bijlage VI
      bij het werkprogramma, dan wel de door Onze Minister aangewezen gewijzigde tekst van de Handleiding;
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel1
  - number: 1.m
    text: |-
      verkennend onderzoek tankstations: onderzoek naar het aanwezig zijn van verontreinigingen van de bodem
      overeenkomstig het verkennend onderzoek tankstations, zoals beschreven in de Handleiding bodemsanering
      tankstations;
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel1
  - number: 1.n
    text: |-
      woning: een gebouw of deel van een gebouw dat voor bewoning wordt gebruikt of daartoe is bestemd, met uitzondering
      van dienst- of bedrijfswoningen, die op industrieterreinen zijn gelegen, met een gemiddelde dichtheid aan dienst-
      of bedrijfswoningen van ten hoogste één per hectare;
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel1
  - number: 1.o
    text: 'gevoelige objecten:'
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel1
  - number: 1.o.1°
    text: sporthallen en zwembaden;
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel1
  - number: 1.o.2°
    text: winkels;
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel1
  - number: 1.o.3°
    text: hotels, restaurants en kantoorgebouwen;
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel1
  - number: 1.o.4°
    text: bedrijfsgebouwen;
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel1
  - number: 1.o.5°
    text: speeltuinen, sportvelden, openluchtzwembaden, campings, volkstuin-complexen en ander recreatieterreinen;
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel1
  - number: 1.o.6°
    text: |-
      bejaardenoorden, verpleeginrichtingen, ziekenhuizen en sanatoria, zwakzinnigeninrichtingen en psychiatrische
      ziekenhuizen, gezinsvervangende tehuizen;
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel1
  - number: 1.o.7°
    text: scholen;
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel1
  - number: 1.o.8°
    text: |-
      telefooncentrales, gebouwen met vluchtleidingsapparatuur, elektriciteitscentrales, hoofdschakelstations van de
      Nederlandse Spoorwegen en andere kwetsbare objecten et een hoge infrastructurele waarde;
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel1
  - number: 1.o.9°
    text: |-
      installaties, en bovengrondse opslagtanks voor brandbare, explosieve of giftige stoffen, alsmede plaatsen ten
      behoeve van de bewaring van gasflessen waarvan de gezamenlijke inhoud meer dan 2500 liter (waterinhoud) bedraagt;
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel1
  - number: 1.p
    text: |-
      garant: degene die contractueel instaat voor de financiële dekking van de aansprakelijkheid als bedoeld in
      [artikel 8, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006423#Artikel8
    url: https://wetten.overheid.nl/BWBR0006423/2003-02-01#Artikel1
    references:
