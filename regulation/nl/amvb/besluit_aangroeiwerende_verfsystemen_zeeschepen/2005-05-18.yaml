regulatory_layer: AMVB
publication_date: '2006-12-21'
valid_from: '2005-05-18'
bwb_id: BWBR0017553
url: https://wetten.overheid.nl/BWBR0017553/2005-05-18
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 8 juli 2004, nr. HDJZ/SCH/2004-1628, Hoofddirectie
    Juridische Zaken, gedaan mede namens de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en
    Milieubeheer;

    Gelet op verordening (EG) nr. 782/2003 van het Europees Parlement en de Raad van de Europese Unie van 14 april 2003
    houdende een verbod op organische tinverbindingen op schepen (PbEU L 115) en de artikelen 1, onderdeel h, 7 en 8
    van de Wet voorkoming verontreiniging door schepen;

    De Raad van State gehoord (advies van 16 september 2004, nr. W09.04.0335/V);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 12 november 2004, nr. HDJZ/SCH/2004-
    2724, Hoofddirectie Juridische Zaken, uitgebracht mede namens de Staatssecretaris van Volkshuisvesting, Ruimtelijke
    Ordening en Milieubeheer;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0017553/2005-05-18#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder de verordening: [verordening (EG) nr.
      782/2003](32003R0782) van het Europees Parlement en de Raad van de Europese Unie van 14 april 2003 houdende een
      verbod op organische tinverbindingen op schepen (PbEU L 115).
    url: https://wetten.overheid.nl/BWBR0017553/2005-05-18#Artikel1
  - number: '2.1'
    text: |-
      Overeenstemming met de artikelen 4 en 5 van de verordening is een eis als bedoeld in
      [artikel 7, eerste lid, van de Wet voorkoming verontreiniging door schepen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel7
    url: https://wetten.overheid.nl/BWBR0017553/2005-05-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '7'
  - number: '2.2'
    text: |-
      Ten behoeve van een schip dat op grond van artikel 6, eerste lid, onderdeel a, van de verordening wordt
      gecertificeerd, wordt door de inspecteur-generaal een AFS-certificaat als bedoeld in artikel 2, zevende lid, van de
      verordening afgegeven.
    url: https://wetten.overheid.nl/BWBR0017553/2005-05-18#Artikel2
  - number: '4'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld betreffende de aanvraag tot het afgeven van een
      certificaat en de daarbij te overleggen bescheiden.
    url: https://wetten.overheid.nl/BWBR0017553/2005-05-18#Artikel4
  - number: '6'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0017553/2005-05-18#Artikel6
  - number: '7'
    text: 'Dit besluit wordt aangehaald als: Besluit aangroeiwerende verfsystemen zeeschepen.'
    url: https://wetten.overheid.nl/BWBR0017553/2005-05-18#Artikel7
