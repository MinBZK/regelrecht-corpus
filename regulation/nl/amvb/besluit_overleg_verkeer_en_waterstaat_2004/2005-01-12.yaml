articles:
  - number: '1'
    text: |-
      1 Er zijn de volgende organen voor het geïnstitutionaliseerd overleg over onderdelen van het beleid inzake verkeer
      en waterstaat:

      a. het Overlegorgaan Water en Noordzee (OWN), waarin overleg wordt gevoerd over het beleid ten aanzien van water en
      Noordzee-aangelegenheden;

      b. het Overlegorgaan Goederenvervoer (OGV), waarin overleg wordt gevoerd over het beleid ten aanzien van het
      goederenvervoer en de luchtvaart;

      c. het Overlegorgaan Personenvervoer (OPV), waarin overleg wordt gevoerd over het beleid ten aanzien van het
      personenvervoer;

      d. het Overlegorgaan Oppervlaktedelfstoffen (OOD), waarin overleg wordt gevoerd over het beleid ten aanzien van de
      voorziening in oppervlaktedelfstoffen.

