  - number: '18'
    text: >-
      Wanneer aan de burgemeester toestemming is verleend langer dan zes weken buiten de gemeente te verblijven, kan
      Onze Minister, de commissaris gehoord, daarbij bepalen dat gedurende die langere periode de bezoldiging en de
      ambtstoelage geheel of gedeeltelijk worden ingehouden.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel18
  - number: '20'
    text: >-
      Indien een burgemeester langer dan acht dagen wegens ziekte zijn ambt niet kan vervullen, geeft hij daarvan kennis
      aan de commissaris.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel20
  - number: '21'
    text: |-
      De burgemeester geniet bedrijfsgeneeskundige begeleiding overeenkomstig
      [hoofdstuk VI, paragraaf 2, van het Algemeen Rijksambtenarenreglement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#HoofdstukVI
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001950
        hoofdstuk: VI
  - number: '23'
    text: |-
      1 Het college van burgemeester en wethouders kent een burgemeester die naar het oordeel
      van een arts een structurele functionele beperking heeft, ten laste van de gemeente op
      aanvraag een tegemoetkoming toe voor de bekostiging van een voorziening als bedoeld in
      [artikel 35, tweede en derde lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1].

      2 Het gestelde bij of krachtens [artikel 35, vijfde lid, van de Wet werk en inkomen naar arbeidsvermogen][ref2] is
      van overeenkomstige toepassing, met dien verstande dat uitsluitend een financiële tegemoetkoming wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel35
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '35'
  - number: '24'
    text: >-
      1 Voor de toepassing van dit artikel wordt verstaan onder:


      a. *een ziekte:* een ziekte die in overwegende mate haar oorzaak vindt in de uitoefening van de aan het ambt
      verbonden werkzaamheden;


      b. *een dienstongeval:* een ongeval dat plaatsvindt tijdens de uitoefening van de aan het ambt verbonden
      werkzaamheden.


      2 De burgemeester ontvangt een vergoeding voor de noodzakelijk gemaakte kosten in verband met een geneeskundige
      behandeling of verzorging of overige kosten, indien deze in overwegende mate hun oorzaak vinden in een ziekte of
      een dienstongeval:


      a. voor zover deze kosten ten laste van de burgemeester blijven en


      b. voor zover de ziekte of het dienstongeval niet aan eigen schuld of onvoorzichtigheid te wijten is.


      3 In bijzondere gevallen kan het college van burgemeester en wethouders bepalen dat overige schade aangemerkt wordt
      als voortvloeiend uit de ziekte of het dienstongeval, naar redelijkheid en billijkheid en gehoord de vergadering
      van de fractievoorzitters van alle partijen in de raad.


      4 Onder overige schade valt niet het gederfde inkomen.


      5 Als de schade van de ziekte of het dienstongeval is ontstaan tijdens zijn ambtsperiode en voortduurt na zijn
      aftreden is dit artikel van overeenkomstige toepassing op de gewezen burgemeester.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel24
  - number: '25'
    text: >-
      Indien het college van burgemeester en wethouders ten behoeve van een veilige woon- en werkplek van de burgemeester
      kosten maakt, die in het kader van het stelsel bewaken en beveiligen zijn aangemerkt als werkgeverskosten, komen
      deze ten laste van de gemeente.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel25
  - number: '26'
    text: De vrouwelijke burgemeester heeft in verband met haar bevalling aanspraak op zwangerschaps- en bevallingsverlof.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel26
  - number: '27'
    text: |-
      1 De burgemeester die na 31 december 1988 als ouder in een familierechtelijke betrekking is komen te staan tot een
      kind, heeft aanspraak op ouderschapsverlof.

      2 Het gestelde in [artikel 33][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel33g
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 33g
  - number: '30'
    text: >-
      1 Op aanvraag wordt ten laste van de gemeente aan de burgemeester voor de uitoefening van het ambt een computer,
      bijbehorende apparatuur en software in bruikleen ter beschikking gesteld.


      2 Indien geen computer en bijbehorende apparatuur en software ter beschikking is gesteld wordt door het college
      van burgemeester en wethouders aan de burgemeester op aanvraag voor de uitoefening van het ambt, een tegemoetkoming
      verleend voor de


      a. aanschaf van een computer, bijbehorende apparatuur en software of,


      b. gebruik van een eigen computer, bijbehorende apparatuur en software.


      3 Op aanvraag wordt ten laste van de gemeente aan de burgemeester voor de uitoefening van het ambt
      communicatieapparatuur in bruikleen ter beschikking gesteld.


      4 Op aanvraag wordt door het college van burgemeester en wethouders een vergoeding aan de burgemeester verleend
      voor de aanleg- en de abonnementskosten voor de internetverbinding voor de in het eerste of het tweede lid genoemde
      computerapparatuur.


      5 Onze Minister kan bij ministeriële regeling nadere regels stellen over het ter beschikking stellen van computer-
      en communicatieapparatuur en de tegemoetkoming, bedoeld in het tweede lid en de vergoeding, bedoeld in het vierde
      lid.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel30
  - number: '31'
    text: >-
      1 De burgemeester heeft ten laste van de gemeente aanspraak op een vergoeding van verhuiskosten bij verhuizing
      ingeval van:


      a. benoeming in de gemeente,


      b. vertrek uit de ambtswoning of vertrek uit de gemeente, binnen uiterlijk één jaar na eervol ontslag of niet-
      herbenoeming, indien de vertrekkende burgemeester geen aanspraak kan maken op enig andere verhuiskostenvergoeding.


      2 Indien de burgemeester na benoeming nog niet over woonruimte in de gemeente beschikt, heeft hij ten laste van de
      gemeente aanspraak op een vergoeding van reis- en pensionkosten.


      3 De burgemeester heeft tevens aanspraak op een vergoeding van verhuiskosten ten laste van de gemeente ingeval van
      het na benoeming betrekken van tijdelijke huisvesting.


      4 Onze Minister stelt bij ministeriële regeling nadere regels over hoogte van de vergoedingen en de voorwaarden
      voor de aanspraak.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel31
  - number: '32'
    text: >-
      1 De burgemeester heeft ten laste van de gemeente aanspraak op:


      a. een vergoeding van kosten voor woon-werkverkeer;


      b. een vergoeding van reis- en verblijfkosten voor reizen gemaakt voor de uitoefening van het ambt.


      2 Onze Minister stelt bij ministeriële regeling nadere regels over hoogte van de vergoedingen en de voorwaarden
      voor de aanspraak.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel32
  - number: 32a
    text: >-
      Indien aan de burgemeester een dienstauto ter beschikking is gesteld en hij voor het gebruik van deze dienstauto
      loon- en inkomstenbelasting is verschuldigd, kan het college van burgemeester en wethouders bepalen dat deze
      belastingheffing door de gemeente aan de burgemeester wordt vergoed. De vergoeding betreft ten hoogste de
      verschuldigde loon- en inkomstenbelasting voor het gebruik van de dienstauto.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel32a
  - number: '34'
    text: >-
      1 Aan een kandidaat voor het ambt van burgemeester worden reis- en verblijfskosten vergoed die zijn gemaakt in
      verband met een bezoek aan Onze Minister, aan de commissaris of aan de vertrouwenscommissie.


      2 Onze Minister stelt bij ministeriële regeling nadere regels over hoogte van de vergoeding en de voorwaarden voor
      de aanspraak.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel34
  - number: '35'
    text: >-
      1 Voor het bewonen van een ambtswoning wordt op de bezoldiging een korting toegepast van 18%.


      2 Indien het college van burgemeester en wethouders de economische huurwaarde van de ambtswoning lager vaststelt
      dan 18% van de bezoldiging, stelt het college de korting, in afwijking van het eerste lid, vast op dat lagere
      percentage.


      3 Indien de burgemeester een ambtswoning bewoont, draagt hij de onderhoudskosten welke volgens de wet en het
      plaatselijk gebruik ten laste van de huurder zijn.


      4 Indien de burgemeester voor het gebruik van een ambtswoning loon- en inkomstenbelasting is verschuldigd, vergoedt
      de gemeente deze belasting aan de burgemeester.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel35
  - number: '36'
    text: |-
      Als eindheffingsbestanddeel als bedoeld in
      [artikel 31, eerste lid, onderdeel f, van de Wet op de loonbelasting 1964][ref1] worden aangewezen:

      a. de ambtstoelage, bedoeld in [artikel 16, eerste lid][ref2];

      b. de verstrekkingen, bedoeld in [artikel 30, eerste en derde lid][ref3];

      c. de vergoeding, bedoeld in [artikel 36a, eerste en tweede lid][ref4];

      d. de vergoeding, bedoeld in [artikel 30, vijfde lid][ref5];

      e. de vergoedingen, bedoeld in [artikel 32, eerste lid][ref6], voor zover deze niet worden gerekend tot een
      vergoeding als bedoeld in [artikel 31a, tweede lid, onderdelen a en b, van de Wet op de loonbelasting 1964][ref7];

      f. de vergoeding, bedoeld in [artikel 32a][ref8];

      g. de vergoeding, bedoeld in [artikel 35, vierde lid][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0006743#Artikel16
