  - number: '48'
    text: |-
      1 Over aangelegenheden van algemeen belang voor de rechtstoestand van de burgemeesters wordt niet beslist dan nadat
      daarover overleg is gepleegd met de vertegenwoordiging van de burgemeesters, te weten het Georganiseerd Overleg
      burgemeesters.

      2 Zodanig overleg vindt niet plaats, indien de aangelegenheid moet worden behandeld in het in de
      [artikelen 105 tot en met 112 van het Algemeen Rijksambtenarenreglement][ref1] geregelde overleg, hierna te noemen
      het centraal Georganiseerd Overleg.

      3 Indien een aangelegenheid, welke wordt behandeld in het centraal Georganiseerd Overleg, van bijzondere betekenis
      is voor de rechtstoestand van burgemeesters, kan Onze Minister het advies van de in het eerste lid bedoelde
      vertegenwoordiging inwinnen.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel105
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '105'
  - number: '49'
    text: >-
      Een tot het centraal Georganiseerd Overleg toegelaten centrale van verenigingen van ambtenaren is bevoegd tot
      aanwijzing van een lid en een plaatsvervangend lid in het Georganiseerd Overleg burgemeesters, mits de bij die
      centrale aangesloten verenigingen gezamenlijk tenminste 3 procent van het totale aantal burgemeesters tot haar
      leden tellen. Zij is tevens bevoegd het aangewezen lid of het plaatsvervangend lid te doen bijstaan door een door
      haar aan te wijzen vertegenwoordiger. Elk lid brengt een stem uit.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel49
  - number: '50'
    text: |-
      1 Een centrale van verenigingen van ambtenaren die van de bevoegdheid tot aanwijzing heeft gebruik gemaakt, geeft
      in het begin van ieder kalenderjaar aan Onze Minister kennis van het aantal burgemeesters, dat lid is van bij haar
      aangesloten verenigingen.

      2 Een door een centrale gedane aanwijzing vervalt van rechtswege op de eerste dag van het kalenderjaar,
      volgende op de dag waarop zij blijkens de in het eerste lid bedoelde kennisgeving niet meer voldoet aan de in
      [artikel 49][ref1] gestelde eis van 3 procent.

      3 Schorsing of intrekking van de toelating van een centrale tot het centraal Georganiseerd Overleg brengt van
      rechtswege mede schorsing of intrekking van de toelating tot het in [artikel 48][ref2] bedoelde overleg.


      [ref1]: https://wetten.overheid.nl/BWBR0006743#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0006743#Artikel48
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0006743
        artikel: '49'
      - id: ref2
        bwb_id: BWBR0006743
        artikel: '48'
  - number: '51'
    text: |-
      1 Het Georganiseerd Overleg burgemeesters staat onder leiding van Onze Minister.

      2 Het overleg wordt door Onze Minister of door ambtenaren die daartoe door Onze Minister zijn aangewezen gevoerd.
      In het laatste geval staat het overleg onder leiding van de door Onze Minister uit die ambtenaren aangewezen
      voorzitter of plaatsvervangend voorzitter. Een door Onze Minister aangewezen ambtenaar staat de voorzitter als
      secretaris terzijde.

      3 De in [artikel 48][ref1] bedoelde aangelegenheden worden door Onze Minister aan het Georganiseerd Overleg
      burgemeesters voorgelegd.

      4 Ieder der krachtens [artikel 49][ref2] tot het overleg toegelaten centrales is bevoegd aan de voorzitter bepaalde
      onderwerpen, behorende tot de in [artikel 48][ref3] bedoelde, ter plaatsing op de agenda op te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0006743#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0006743#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0006743#Artikel48
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0006743
        artikel: '48'
      - id: ref2
        bwb_id: BWBR0006743
        artikel: '49'
      - id: ref3
        bwb_id: BWBR0006743
        artikel: '48'
  - number: '52'
    text: >-
      1 Het standpunt van de vertegenwoordiging der burgemeesters over de haar voorgelegde dan wel op aanvraag van haar
      zijde in het overleg besproken aangelegenheden wordt schriftelijk aan Onze Minister bevestigd.


      2 Indien in die vertegenwoordiging een minderheidsstandpunt blijkt te bestaan, wordt daarvan desverlangd in het
      geschrift, bedoeld in het eerste lid, melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel52
  - number: '53'
    text: >-
      Indien over een aangelegenheid in afwijking van het standpunt van de meerderheid der
      burgemeestersvertegenwoordiging wordt beslist, brengt de voorzitter de redenen van deze afwijking ter kennis van
      het Georganiseerd Overleg burgemeesters.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel53
  - number: '54'
    text: Het Georganiseerd Overleg burgemeesters wordt gevoerd op plaats, dag en uur, door de voorzitter te bepalen.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel54
  - number: '55'
    text: Onze Minister stelt, na raadpleging van de vertegenwoordiging van de burgemeesters, een reglement van orde vast.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel55
  - number: '56'
    text: >-
      Het verhandelde in het Georganiseerd Overleg burgemeesters is geheim, voor zover het reglement van orde niet anders
      bepaalt.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel56
  - number: '57'
    text: |-
      [De artikelen 58 tot en met 60][ref1] zijn slechts van toepassing op geschillen inzake aangelegenheden als bedoeld
      in [artikel 48][ref2], voor zover die aangelegenheden uitsluitend de rechtstoestand van burgemeesters betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0006743#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0006743#Artikel48
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0006743
        artikel: '58'
      - id: ref2
        bwb_id: BWBR0006743
        artikel: '48'
  - number: '58'
    text: >-
      Indien de voorzitter dan wel een of meer van de centrales in het Georganiseerd Overleg burgemeesters tot het
      oordeel komen dat dit overleg niet tot een uitkomst zal leiden die de instemming van alle deelnemers aan dat
      overleg zal hebben, brengen zij dat oordeel binnen drie dagen nadat zij daarvan in het overleg blijk hebben
      gegeven, schriftelijk ter kennis van de overige deelnemers aan het overleg.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel58
  - number: '59'
    text: |-
      1 Binnen vijf dagen na de kennisgeving, bedoeld in [artikel 58][ref1], schrijft de voorzitter een
      overlegvergadering uit. De vergadering moet worden gehouden binnen zeven dagen nadat deze is uitgeschreven.

      2 Tenzij door de voorzitter en de vertegenwoordiging van de burgemeesters wordt besloten het overleg voort te
      zetten dan wel te beëindigen, wordt in de vergadering nagegaan of overeenstemming bestaat over de vraag wat het
      onderwerp en de inhoud van het geschil is en of een oplossing van dat geschil zal worden gezocht door middel van
      voortzetting van het overleg nadat het advies is ingewonnen van de Advies- en Arbitragecommissie, dan wel door
      middel van onderwerping van het geschil aan een arbitrale uitspraak van de Advies- en Arbitragecommissie.

      3 Tot het inwinnen van het advies is zowel de voorzitter als de vertegenwoordiging van de burgemeesters bevoegd.

      4 Voor onderwerping van het geschil aan arbitrage is overeenstemming vereist tussen alle deelnemers aan het
      overleg.


      [ref1]: https://wetten.overheid.nl/BWBR0006743#Artikel58
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0006743
        artikel: '58'
  - number: '60'
    text: |-
      1 Binnen drie dagen na de vergadering, bedoeld in [artikel 59][ref1], wordt de aanvraag om advies ter kennis
      gebracht van de voorzitter van de Advies- en Arbitragecommissie. De aanvraag wordt ondertekend door de deelnemers
      aan het overleg die zich voor inwinning hebben uitgesproken en bevat tenminste het onderwerp en de inhoud van
      het geschil. Indien in de vergadering, bedoeld in het vorige artikel, geen overeenstemming is bereikt tussen alle
      deelnemers aan het overleg over de vraag wat het onderwerp en de inhoud van het geschil is, brengen de overige
      deelnemers aan het overleg hun visie op het onderwerp en de inhoud van het geschil eveneens binnen drie dagen na
      eerdergenoemde vergadering ter kennis van de voorzitter van de Advies- en Arbitragecommissie.

      2 De eerste volzin van het eerste lid is van overeenkomstige toepassing ten aanzien van het onderwerpen van het
      geschil aan een arbitrale uitspraak. De aanvraag daartoe wordt ondertekend door alle deelnemers aan het overleg en
      dient tenminste te bevatten:

      a. het onderwerp en de inhoud van het geschil;

      b. de standpunten van alle deelnemers aan het overleg omtrent onderwerp en inhoud van het geschil.


      [ref1]: https://wetten.overheid.nl/BWBR0006743#Artikel59
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0006743
        artikel: '59'
  - number: '61'
    text: |-
      Geschillen welke ingevolge de voorgaande artikelen in aanmerking worden gebracht voor het inwinnen van advies dan
      wel aan arbitrage worden onderworpen, worden daartoe voorgelegd aan de Advies- en Arbitragecommissie, bedoeld in
      [artikel 110g, eerste lid, van het Algemeen Rijksambtenarenreglement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel110g
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 110g
  - number: '62'
    text: |-
      Ten aanzien van de werkwijze van de Advies- en Arbitragecommissie is [artikel 110][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel110h
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 110h
  - number: '63'
    text: >-
      1 De Advies- en Arbitragecommissie besluit bij meerderheid van stemmen.


      2 Het advies of de uitspraak moet inhouden:


      a. de namen van de deelnemers die het advies of de arbitrale uitspraak hebben aangevraagd;


      b. een overzicht van de standpunten van alle deelnemers over het onderwerp en over de inhoud van het geschil;


      c. het advies dan wel de beslissing en de redenen die daaraan ten grondslag liggen.


      3 Het advies of de uitspraak wordt gedagtekend en door ieder der optredende leden van de Advies- en
      Arbitragecommissie ondertekend.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel63
  - number: '64'
    text: Binnen twee weken na ontvangst van het advies wordt het overleg over het geschil voortgezet.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel64
  - number: '65'
    text: De uitspraak van de Advies- en Arbitragecommissie heeft bindende kracht.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel65
  - number: 65b
