        artikel: '35'
  - number: 36a
    text: >-
      1 Indien een burgemeester in verband met de uitoefening van het ambt lid is van een beroepsvereniging, vergoedt de
      gemeente de contributie van die beroepsvereniging.


      2 De kosten voor niet-partijpolitiek georiënteerde scholing in verband met de vervulling van het ambt van de
      burgemeester komen ten laste van de gemeente.


      3 Het college van burgemeester en wethouders kan over de in het tweede lid bedoelde scholing nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel36a
  - number: '37'
    text: >-
      De burgemeester onthoudt zich van gedragingen die de goede uitoefening of het aanzien van het ambt schaden of
      kunnen schaden.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel37
  - number: '38'
    text: >-
      1 Indien een burgemeester die in het buitenland verblijft, overweegt wegens dringende redenen van dienstbelang
      terug te keren naar zijn gemeente, legt hij dit voor aan de commissaris van de Koning.


      2 Indien de commissaris het in het eerste lid genoemde voornemen redelijk acht, wordt aan een burgemeester ten
      laste van de gemeente een schadeloosstelling toegekend.


      3 De schadeloosstelling betreft uitsluitend de direct uit de terugkeer voortvloeiende kosten van de burgemeester
      en in voorkomend geval die van zijn meereizende gezinsleden. Het college van burgemeester en wethouders stelt de
      hoogte van de schadeloosstelling vast.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel38
  - number: '39'
    text: De burgemeester kan in het belang van een goede uitoefening van het ambt worden geschorst.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel39
  - number: '40'
    text: >-
      Het schorsingsbesluit bevat in ieder geval een aanduiding van het tijdstip waarop de schorsing ingaat en een zo
      nauwkeurig mogelijke aanduiding van de duur der schorsing.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel40
  - number: '41'
    text: >-
      Gedurende een schorsing is het de burgemeester als zodanig niet toegestaan de gemeentelijke dienstgebouwen te
      betreden.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel41
  - number: '42'
    text: >-
      1 De burgemeester wordt op zijn aanvraag ontslagen of na afloop van de benoemingstermijn niet herbenoemd.


      2 Aan de burgemeester die ontslag vraagt met het oog op een FPU-uitkering, wordt ontslag verleend, indien het
      bestuur van de Stichting fonds vrijwillig vervroegd uittreden overheidspersoneel en het bestuur van de Stichting
      Pensioenfonds ABP op grond van een desbetreffende aanvraag hebben vastgesteld dat na het ontslag recht bestaat op
      de FPU-uitkering. Het ontslag gaat niet eerder in dan met ingang van de dag waarop het recht op de FPU-uitkering
      ontstaat. Met een aanvraag tot ontslag wordt gelijkgesteld een verzoek om niet te worden herbenoemd.


      3 Het ontslag op grond van dit artikel wordt eervol verleend, tenzij naar het oordeel van Onze Minister
      zwaarwichtige redenen zich daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel42
  - number: '43'
    text: >-
      Aan de burgemeester wordt met ingang van de eerste dag van de maand, volgend op die waarin hij de leeftijd van 70
      jaar heeft bereikt, eervol ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel43
  - number: '44'
    text: |-
      1 Anders dan op eigen aanvraag, kan aan de burgemeester ontslag worden verleend op grond van:

      a. ongeschiktheid wegens ziekte tot het vervullen van zijn ambt;

      b. onbekwaamheid of ongeschiktheid voor het door hem beklede ambt, anders dan uit hoofde van ziekten of gebreken;

      c. opheffing van de gemeente;

      d. een aanbeveling van de gemeenteraad tot ontslag wegens een verstoorde verhouding tussen de burgemeester en de
      raad als bedoeld in [artikel 61b, tweede lid, van de Gemeentewet][ref1];

      e. andere gronden.

      2 Een ontslag als bedoeld in het eerste lid, onderdeel a, kan slechts plaatsvinden indien:

      a. er sprake is van ongeschiktheid wegens ziekte tot het vervullen van zijn ambt gedurende een ononderbroken
      periode van zes maanden,

      b. herstel van zijn ziekte niet binnen een periode van zes maanden na de in onderdeel a genoemde termijn van zes
      maanden te verwachten is.

      3 Bij de beoordeling of er sprake is van een situatie, als bedoeld in het tweede lid, onderdeel b, wordt
      een medisch onderzoek ingesteld door een of meer door Onze Minister aangewezen geneeskundigen, en, indien de
      burgemeester dit wenst, een door de burgemeester aangewezen geneeskundige. De burgemeester is verplicht medewerking
      te verlenen aan het onderzoek en wordt schriftelijk in kennis gesteld van het starten van het onderzoek en de in de
      vorige zin bedoelde mogelijkheid. Indien de burgemeester geen medewerking verleent, is de in het tweede lid, onder
      b, genoemde voorwaarde niet van toepassing.

      4 Voordat Onze Minister het ontslag op grond van het eerste lid, onderdeel a, verleent, onderzoekt hij of het
      mogelijk is de burgemeester na zijn ontslag binnen zijn gezagsbereik andere arbeid aan te bieden.

      5 Het ontslag op grond van het eerste lid, onder a, b en c van dit artikel wordt eervol verleend. Het ontslag op
      grond van het eerste lid, onder d en e, van dit artikel wordt eervol verleend, tenzij naar het oordeel van Onze
      Minister zwaarwichtige redenen zich daartegen verzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel61b
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 61b
  - number: '45'
    text: >-
      Niet-herbenoeming vindt niet plaats dan nadat de burgemeester in de gelegenheid is gesteld door Onze Minister te
      worden gehoord.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel45
  - number: 46c
    text: |-
      1 De burgemeester van 61 jaar of ouder van wie de gemeente wordt opgeheven en aan wie met ingang van de datum van
      herindeling ontslag wordt verleend met het oog op een FPU-uitkering, ontvangt ten laste van het Rijk een aanvulling
      op deze uitkering tot aan de pensioengerechtigde leeftijd, tenzij hij aanspraak maakt op de extra uitkering,
      bedoeld in [artikel 46e][ref1] of [47b][ref2].

      2 De aanvulling bedraagt een percentage van de grondslag, die geldt voor de vaststelling van de FPU-uitkering. Het
      percentage is:

      a. 15% indien de burgemeester op de dag voorafgaand aan de datum van herindeling nog geen 63 jaar is;

      b. 25% indien de burgemeester op de dag voorafgaand aan de datum van herindeling 63 jaar of ouder is.

      3 De aanvulling wordt slechts toegekend voorzover de aanvulling en de FPU-uitkering tezamen niet meer bedragen
      dan de grondslag die geldt voor de vaststelling van de FPU-uitkering, met dien verstande dat voor deze berekening
      buiten beschouwing blijft:

      a. een verlaging van de FPU-uitkering, omdat aanspraken niet worden opgenomen met de bedoeling deze om te zetten in
      recht op ouderdomspensioen en nabestaandenpensioen;

      b. een verlaging van de FPU-uitkering, omdat het bedrag van de aanspraak wordt verminderd in verband met inkomsten
      naast de FPU-uitkering;

      c. een verhoging van de FPU-uitkering, als gevolg van een individuele aanvullende regeling.

      4 Dit artikel is van overeenkomstige toepassing op een burgemeester jonger dan 61 jaar, indien hij op de datum van
      het ontslag met het oog op een FPU-uitkering, een diensttijd heeft van 40 jaar of meer als bedoeld in artikel 4 van
      de Regeling flexibel pensioen en uittreden.


      [ref1]: https://wetten.overheid.nl/BWBR0006743#Artikel46e
      [ref2]: https://wetten.overheid.nl/BWBR0006743#Artikel47b
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel46c
    references:
      - id: ref1
        bwb_id: BWBR0006743
        artikel: 46e
      - id: ref2
        bwb_id: BWBR0006743
        artikel: 47b
  - number: 46e
    text: >-
      1 De burgemeester aan wie ontslag is verleend met het oog op een FPU-uitkering en die tenminste 1 jaar het ambt van
      burgemeester heeft uitgeoefend, ontvangt tot aan de pensioengerechtigde leeftijd naast de FPU-uitkering een extra
      uitkering ten laste van de gemeenten gezamenlijk.


      2 De extra uitkering bedraagt maandelijks het bedrag dat resulteert uit de vermenigvuldiging van 0,5833 procent van
      de grondslag, die geldt voor de vaststelling van de FPU-uitkering, met het aantal maanden dat de burgemeester het
      ambt van burgemeester heeft uitgeoefend, gedeeld door het totaal aantal maanden gelegen tussen de datum van ingang
      van de FPU-uitkering en de datum van ingang van het ouderdomspensioen. Voor deze berekening wordt voor het aantal
      maanden dat de burgemeester het ambt heeft uitgeoefend, ten hoogste van 120 maanden uitgegaan.


      3 De extra uitkering wordt slechts toegekend voorzover de extra uitkering en de FPU-uitkering tezamen niet meer
      bedragen dan de grondslag, die geldt voor de vaststelling van de FPU-uitkering, met dien verstande dat voor deze
      berekening buiten beschouwing blijft:


      a. een verlaging van de FPU-uitkering, omdat aanspraken niet worden opgenomen met de bedoeling deze om te zetten in
      recht op ouderdomspensioen of nabestaandenpensioen;


      b. een verlaging van de FPU-uitkering, omdat het bedrag van de aanspraak wordt verminderd in verband met inkomsten
      naast de FPU-uitkering;


      c. een verhoging van de FPU-uitkering, als gevolg van een individuele aanvullende regeling.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel46e
  - number: 46f
    text: |-
      Indien de gewezen burgemeester die de extra uitkering, bedoeld in [artikel 46e][ref1], ontvangt met de waarneming
      van het ambt van burgemeester wordt belast, vervalt tijdelijk de aanspraak op de extra uitkering voor de duur
      van het waarnemerschap. Indien hij uit het waarnemerschap wordt ontheven, ontleent hij geen nieuwe aanspraken aan
      [artikel 46e][ref2] en bij toepassing van [artikel 46h][ref3] of 47a worden reeds toegekende bedragen van de extra
      uitkering in mindering gebracht op de eenmalige uitkering, bedoeld in die artikelen.


      [ref1]: https://wetten.overheid.nl/BWBR0006743#Artikel46e
      [ref2]: https://wetten.overheid.nl/BWBR0006743#Artikel46e
      [ref3]: https://wetten.overheid.nl/BWBR0006743#Artikel46h
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel46f
