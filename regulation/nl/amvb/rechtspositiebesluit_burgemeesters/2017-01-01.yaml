        bwb_id: BWBR0006743
        artikel: 46h
  - number: 46g
    text: |-
      1 Bij overlijden van de gewezen burgemeester die de extra uitkering, bedoeld in [artikel 46e][ref1], ontvangt,
      wordt aan de nabestaanden, bedoeld in [artikel 47][ref2], een eenmalige extra uitkering toegekend ten laste van de
      gemeenten gezamenlijk.

      2 De eenmalige uitkering bedraagt het bedrag dat resulteert uit de vermenigvuldiging van 57,14% van de maandelijkse
      extra uitkering, betaald in de maand voorafgaand aan het overlijden van betrokkene, met het aantal maanden gelegen
      tussen de datum van overlijden en de datum dat het ouderdomspensioen zou zijn ingegaan.

      3 Indien de aanspraak op de extra uitkering op grond van [artikel 46f][ref3] tijdelijk is vervallen, wordt voor
      de toepassing van dit artikel uitgegaan van de extra uitkering die zou zijn toegekend indien de uitkering niet in
      verband met het waarnemerschap was vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0006743#Artikel46e
      [ref2]: https://wetten.overheid.nl/BWBR0006743#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0006743#Artikel46f
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel46g
