  - number: 14b
    text: >-
      1 De burgemeester heeft ten laste van het Rijk recht op een aanvulling op de bezoldiging bij eervol ontslag wegens
      benoeming tot burgemeester van een andere gemeente, indien daar een lagere bezoldiging aan is verbonden.


      2 De aanvulling bedraagt het verschil tussen de laatstgenoten bezoldiging, aangepast volgens de algemene
      salariswijzigingen van het personeel in de sector Rijk, en de bezoldiging, verbonden aan de benoeming tot
      burgemeester in de andere gemeente.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel14b
  - number: 14c
    text: >-
      1 Zo spoedig mogelijk na afloop van het kalenderjaar, verstrekt de burgemeester aan Onze Minister dan wel aan een
      door hem aangewezen instantie:


      a. een opgave van de neveninkomsten welke hij over dat kalenderjaar of over een gedeelte daarvan heeft genoten,
      dan wel


      b. een verklaring dat hij geen neveninkomsten heeft genoten of niet meer dan 14% van de bezoldiging op jaarbasis
      aan neveninkomsten heeft genoten over dat jaar of, indien hij het ambt van burgemeester vervulde gedurende een
      gedeelte van het kalenderjaar, een evenredig deel daarvan, dan wel


      c. een verklaring dat een opgave van neveninkomsten achterwege zal blijven.


      2 In afwijking van het eerste lid, vermindert het college van burgemeester en wethouders op verzoek van de
      burgemeester diens bezoldiging reeds gedurende het kalenderjaar met een bedrag waarmee hij verwacht dat zijn
      bezoldiging zal worden verrekend vanwege zijn neveninkomsten.


      3 Onze Minister, dan wel een door hem aangewezen instantie, deelt het college van burgemeester en wethouders
      het bedrag van de bezoldiging dat teruggevorderd dient te worden, mede en verstrekt een afschrift daarvan aan de
      burgemeester.


      4 Het college van burgemeester en wethouders vordert, indien Onze Minister dan wel een door hem aangewezen
      instantie constateert dat er sprake is van te verrekenen neveninkomsten, het teveel aan ontvangen bezoldiging terug
      van de burgemeester.


      5 Indien de burgemeester geen informatie kan verstrekken, meldt hij dit binnen zes maanden onder opgaaf van redenen
      aan Onze Minister, dan wel aan een door hem aangewezen instantie. De burgemeester meldt tevens een redelijke
      termijn waarop hij deze informatie alsnog zal verstrekken.


      6 In het geval genoemd in het eerste lid, onderdeel c, alsmede indien de burgemeester binnen zes maanden na afloop
      van het kalenderjaar geen opgave of verklaring, als bedoeld in het eerste lid, heeft ingezonden, of niet heeft
      voldaan aan het vijfde lid, stelt het college van burgemeester en wethouders de bezoldiging over het afgelopen
      jaar vast op 65% van de bezoldiging op jaarbasis, tenzij het uit anderen hoofde kan vaststellen tot welk bedrag er
      verrekend zou moeten worden.


      7 Op verzoek van de burgemeester kan het college van burgemeester en wethouders besluiten de verrekening of
      terugbetaling in termijnen te laten plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel14c
  - number: '15'
    text: >-
      De burgemeester heeft aanspraak op een vakantie-uitkering overeenkomstig de regels, die te dien aanzien voor het
      personeel in de sector Rijk zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel15
  - number: 15a
    text: >-
      De burgemeester heeft recht op een eindejaarsuitkering overeenkomstig de regels die te dien aanzien voor het
      personeel in de sector Rijk zijn vastgesteld. De eindejaarsuitkering wordt vervolgens verhoogd met 1,5% van de
      jaarlijkse bezoldiging.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel15a
  - number: '16'
    text: >-
      1 De burgemeester ontvangt een ambtstoelage voor de aan de uitoefening van het ambt verbonden kosten ten bedrage
      van € 381,03 per maand.


      2 Het bedrag genoemd in het eerste lid wordt per 1 januari van elk jaar bij ministeriële regeling gewijzigd aan de
      hand van de consumentenprijsindex, geldend voor de maand september van het voorafgaande kalenderjaar.


      3 De burgemeester heeft na eervol ontslag of niet-herbenoeming voor een periode van drie maanden aanspraak op een
      ambtstoelage ter hoogte van de helft van het voor hem bij ontslag of niet-herbenoeming geldende bedrag.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel16
  - number: '17'
    text: |-
      1 De wethouder die op grond van [artikel 77, eerste lid, van de Gemeentewet][ref1] gedurende meer dan dertig dagen
      onafgebroken het ambt van burgemeester waarneemt en die zijn wethouderschap in deeltijd uitoefent, ontvangt een
      bezoldiging verbonden aan een voltijds-wethouderschap. Op deze bezoldiging wordt de bezoldiging verbonden aan zijn
      wethouderschap in deeltijd in mindering gebracht.

      2 Het raadslid dat op grond van [artikel 77, tweede lid, van de Gemeentewet][ref2] gedurende meer dan dertig
      dagen onafgebroken het ambt van burgemeester waarneemt, ontvangt voor die tijd de voor dat ambt vastgestelde
      minimumbezoldiging. Op deze bezoldiging wordt de vergoeding als raadslid in mindering gebracht. Tijdens de
      waarneming zijn de [artikelen 15][ref3] en [32][ref4] van overeenkomstige toepassing.

      3 Degene die op grond van [artikel 78 van de Gemeentewet][ref5] als waarnemend burgemeester is aangewezen, is dit
      besluit van overeenkomstige toepassing, met uitzondering van de [artikelen 14c][ref6] en [39 tot en met 41][ref7],
      de [artikelen 43 tot en met 46c][ref8] en de [artikelen 48 tot en met 65][ref9].

      4 Indien een waarnemend burgemeester, aangewezen op grond van [artikel 78 van de Gemeentewet][ref10],
      tevens burgemeester van een andere gemeente is en de beide gemeenten met overeenkomstige toepassing van
      [artikel 5, tweede lid][ref11], worden ingedeeld in een hogere inwonersklasse dan klasse 2, wordt de bezoldiging
      bepaald op het bedrag dat behoort bij die hogere inwonersklasse.

      5 Indien een waarnemend burgemeester, aangewezen op grond van [artikel 78 van de Gemeentewet][ref12], tevens
      burgemeester van een andere gemeente is, kan in afwijking van [artikel 14][ref13], de verhouding waarin de
      bezoldiging en de aanspraken, bedoeld in dat artikel, ten laste van de gemeenten komen, door Onze Minister worden
      vastgesteld.

      6 Onze Minister kan in bijzondere gevallen, de commissaris gehoord:

      a. de vergoeding, bedoeld in het eerste en tweede lid, zo nodig met inachtneming van de laatste volzin van
      het eerste lid, op een hoger bedrag bepalen, tot ten hoogste de voor het ambt vastgestelde maximum- of vaste
      bezoldiging, vermeerderd met de bijdrage, bedoeld in [artikel 16][ref14];

      b. een vergoeding als bedoeld in de [artikelen 31][ref15] en [32][ref16] toekennen.


