  - number: '9'
    text: >-
      De aanspraak op de bezoldiging begint op de dag dat de benoeming ingaat en eindigt met ingang van de dag waarop het
      ontslag ingaat of met ingang van de dag volgend op die van het overlijden.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel9
  - number: '11'
    text: |-
      Indien een gemeente door toename van het aantal inwoners of op grond van een besluit als bedoeld in
      [artikel 7][ref1] wordt ingedeeld in een hogere inwonersklasse, wordt de bezoldiging van de burgemeester
      overeenkomstig de tabel in [bijlage I][ref2] aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0006743#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006743
