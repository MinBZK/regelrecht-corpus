  - number: '14'
    text: >-
      Wanneer dezelfde persoon burgemeester is van meer dan één gemeente komen de bezoldiging en alle overige financiële
      aanspraken als bedoeld in dit besluit, in verhouding tot het inwonertal naar boven afgerond op een veelvoud van
      100, ten laste van elke gemeente.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel14
  - number: 14a
    text: |-
      1 Een burgemeester die benoemd wordt tot burgemeester van een andere gemeente, ontvangt indien die andere gemeente
      in een gelijke inwonersklasse is geplaatst, een toelage op de bezoldiging.

      2 De toelage komt ten laste van de gemeente en bedraagt:

      a. gedurende het eerste en tweede jaar na de benoeming eenderde van het verschil tussen de bezoldiging behorende
      bij de inwonersklasse waarin de gemeente is ingedeeld en de bezoldiging behorende bij de eerstvolgende hogere
      inkomensklasse;

      b. gedurende het derde en vierde jaar na de benoeming tweederde van het verschil tussen de bezoldiging behorende
      bij de inwonersklasse waarin de gemeente is ingedeeld en de bezoldiging behorende bij de eerstvolgende hogere
      inkomensklasse;

      c. gedurende de volgende jaren het verschil tussen de bezoldiging behorende bij de inwonersklasse waarin de
      gemeente is ingedeeld en de bezoldiging behorende bij de eerstvolgende hogere inkomensklasse.

      3 De burgemeester behoudt aanspraak op de toelage zolang hij het ambt vervult in een gemeente van een gelijke
      inwonersklasse als bedoeld in het eerste lid.

      4 Indien de burgemeester het ambt vervult in een gemeente als bedoeld in [artikel 7][ref1], behoudt hij de toelage
      na afloop van het tijdvak, bedoeld in dat artikel.

      5 De toelage wordt voor de toepassing van de [artikelen 9][ref2], [11][ref3], [12][ref4], [15][ref5] en [15a][ref6]
      gerekend tot de bezoldiging.


      [ref1]: https://wetten.overheid.nl/BWBR0006743#Artikel7
