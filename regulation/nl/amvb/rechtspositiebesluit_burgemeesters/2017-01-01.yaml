    text: |-
      1 De gemeenten worden ten behoeve van de vaststelling van de bezoldiging van de burgemeester ingedeeld in
      inwonersklassen overeenkomstig de volgende tabel:








                    Klasse


                    Aantal inwoners






                    1


                    Tot en met 8.000




                    2


                    8.001–14.000




                    3


                    14.001–24.000




                    4


                    24.001–40.000




                    5


                    40.001–60.000




                    6


                    60.001–100.000




                    7


                    100.001–150.000




                    8


                    150.001–375.000




                    9


                    375.001 en meer






      2 Indien in gemeenten het ambt van burgemeester door dezelfde persoon wordt vervuld, worden deze gemeenten voor de
      indeling in een inwonersklasse als één gemeente aangemerkt waarbij de inwoners van de gemeenten worden samengeteld.
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel5
  - number: '6'
    text: |-
      1 Een gemeente gaat voor de toepassing van [artikel 5][ref1] in verband met de toeneming van het aantal inwoners
      over naar een hogere klasse met ingang van het jaar waarin op 1 januari het aantal inwoners van die gemeente de
      minimumgrens van de volgende klasse bereikt heeft en blijkt dat zij die grens ook heeft bereikt op:

      a. 1 januari van het volgende jaar;

      b. de dag voorafgaande aan een wijziging van de gemeentelijke indeling waarbij zij is betrokken.

      2 Overgang van een gemeente naar een lagere klasse in verband met de vermindering van het aantal inwoners
      vindt plaats met ingang van het jaar waarin het aantal inwoners van de gemeente op 1 januari voor de tweede
      achtereenvolgende maal beneden de minimumgrens van de klasse, waarin de gemeente tot dusver ingedeeld was, gedaald
      is.

      3 Voor gemeenten waarvan het aantal inwoners ten gevolge van grenscorrectie of wijziging van de gemeentelijke
      indeling wijziging heeft ondergaan, vindt de overgang naar een hogere of lagere klasse plaats met ingang van de
      datum van de grenscorrectie of wijziging van de gemeentelijke indeling. Hierbij geldt het aantal inwoners, zoals
      dit voor de eerste maal na die datum met inachtneming van die grenscorrectie of wijziging van de gemeentelijke
      indeling door het Centraal Bureau voor de Statistiek wordt openbaar gemaakt.

      4 Voor de eerste indeling van nieuwingestelde gemeenten vindt het derde lid overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006743#Artikel5
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel6
