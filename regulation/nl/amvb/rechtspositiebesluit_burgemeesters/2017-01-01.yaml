        artikel: 46f
  - number: '47'
    text: |-
      1 Zo spoedig mogelijk na het overlijden van de burgemeester wordt aan de weduwe of weduwnaar van wie de overleden
      burgemeester niet duurzaam gescheiden leefde ten laste van de gemeente een bedrag uitgekeerd, gelijk aan de
      bezoldiging, vermeerderd met de vakantie-uitkering, over drie maanden, berekend naar het tijdstip van overlijden.
      Indien de overledene geen weduwe of weduwnaar van wie de overleden burgemeester niet duurzaam gescheiden leefde
      nalaat, geschiedt de uitkering ten behoeve van de minderjarige wettige of natuurlijke kinderen, of minderjarige
      kinderen waarover de overledene de pleegouderlijke zorg droeg. Onder pleegouderlijke zorg wordt verstaan de zorg
      voor het onderhoud en de opvoeding van het kind als was het een eigen kind, onafhankelijk van enige verplichting
      daartoe of van het genieten van een vergoeding daarvoor. Ontbreken ook zodanige kinderen dan geschiedt de uitkering
      aan degenen die geheel of gedeeltelijk afhankelijk waren van de bezoldiging van de burgemeester.

      2 Voor de toepassing van dit artikel wordt onder weduwe of weduwnaar mede verstaan de achtergebleven geregistreerde
      partner alsmede degene met wie de overleden burgemeester ongehuwd samenleefde en een gezamenlijke huishouding heeft
      gevoerd als bedoeld in [artikel 3, derde en vierde lid, van de Algemene nabestaandenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel3
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '3'
  - number: 47a
    text: |-
      1 Onverminderd [artikel 47][ref1] wordt bij overlijden van de burgemeester, indien hij tenminste 1 jaar het ambt
      van burgemeester heeft uitgeoefend, aan de nabestaanden, bedoeld in dat artikel, een eenmalige extra uitkering
      toegekend ten laste van de gemeenten gezamenlijk.

      2 Voor de vaststelling van de eenmalige uitkering wordt als grondslag gehanteerd de grondslag die zou gelden voor
      de vaststelling van een FPU-uitkering.

      3 De eenmalige uitkering bedraagt het bedrag dat resulteert uit de vermenigvuldiging van 0,3333 procent van
      de grondslag met het aantal maanden dat de burgemeester het ambt van burgemeester heeft uitgeoefend. Voor deze
      berekening wordt voor het aantal maanden dat de burgemeester het ambt heeft uitgeoefend, ten hoogste van 120
      maanden uitgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006743#Artikel47
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel47a
    references:
      - id: ref1
        bwb_id: BWBR0006743
        artikel: '47'
  - number: 47b
    text: |-
      1 Indien een burgemeester van 62 jaar of ouder aangeeft gebruik te willen maken van de mogelijkheid van vervroegd
      uittreden, maar naar het oordeel van Onze Minister bijzondere bestuurlijke omstandigheden in de gemeente zich
      zodanig verzetten tegen het ontslag van de burgemeester dat het ontslag niet wordt verleend, kan Onze Minister bij
      besluit een eenmalige extra uitkering toekennen.

      2 Onze Minister wint ter voorbereiding van zijn oordeel het advies in van de commissaris en van de gemeenteraad.

      3 De eenmalige uitkering bedraagt ten hoogste het bedrag dat totaal als extra uitkering, bedoeld in
      [artikel 46c][ref1], zou zijn uitgekeerd indien aan de burgemeester het ontslag met het oog op een FPU-uitkering
      zou zijn verleend op de datum dat de gemeenteraad het in het tweede lid bedoelde advies heeft vastgesteld.

      4 De uitkering vindt plaats op de pensioengerechtigde leeftijd van betrokkene. Indien de burgemeester voor dat
      tijdstip alsnog ontslag wordt verleend, bestaat er geen aanspraak op een aanvulling als bedoeld in artikel 46a of
      op een uitkering als bedoeld in de [artikelen 46c][ref2] of [46f][ref3]. Bij overlijden van de burgemeester voor de
      pensioengerechtigde leeftijd is [artikel 47a][ref4] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006743#Artikel46c
      [ref2]: https://wetten.overheid.nl/BWBR0006743#Artikel46c
      [ref3]: https://wetten.overheid.nl/BWBR0006743#Artikel46f
      [ref4]: https://wetten.overheid.nl/BWBR0006743#Artikel47a
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel47b
