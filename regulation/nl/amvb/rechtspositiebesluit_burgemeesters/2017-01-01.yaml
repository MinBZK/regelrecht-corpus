        artikel: '5'
  - number: '7'
    text: |-
      1 Op grond van bijzondere omstandigheden kunnen gedeputeerde staten, de gemeenteraad gehoord, een gemeente voor
      de toepassing van [artikel 5][ref1] voor een bepaald tijdvak in een hogere klasse plaatsen dan die, waartoe zij op
      grond van haar aantal inwoners behoort.

      2 Gedeputeerde staten kunnen na afloop van het tijdvak, bedoeld in het eerste lid, een nieuw tijdvak vaststellen.

      3 Van het tot verhoging strekkende besluit doen gedeputeerde staten onmiddellijk schriftelijk mededeling aan Onze
      Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006743#Artikel5
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel7
