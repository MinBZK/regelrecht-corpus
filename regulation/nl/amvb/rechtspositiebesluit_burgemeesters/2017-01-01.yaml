articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop rustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      b. bezoldiging: het bedrag per maand, waarop een burgemeester met inachtneming van
      [de artikelen 5 tot en met 14b][ref1] en [17][ref2] van dit besluit aanspraak kan maken;

      c. het aantal inwoners van een gemeente: het aantal inwoners volgens de door het Centraal Bureau voor de Statistiek
      openbaar gemaakte bevolkingscijfers per 1 januari;

      d. de commissaris: de commissaris van de Koning in de provincie waarin de gemeente is gelegen;

      e. gedeputeerde staten: het college van gedeputeerde staten van de provincie waarin de gemeente is gelegen;

      f. waarnemend burgemeester: degene die op grond van [artikel 78 van de Gemeentewet][ref3] door de commissaris is
      aangewezen om de burgemeester te vervangen;

      g. FPU-uitkering: de uitkering op grond van de Regeling flexibel pensioen en uittreden, bedoeld in
      artikel 3 van de Centrale vut-overeenkomst overheids- en onderwijspersoneel en artikel 1.5 van het
      Pensioenreglement van de Stichting pensioenfonds ABP, waarbij onder de Centrale vut-overeenkomst
      overheids- en onderwijspersoneel wordt verstaan de overeenkomst die is aangegaan op grond van
      [artikel 2 van de Wet kaderregeling vut overheidspersoneel][ref4] en onder het Pensioenreglement van de Stichting
      Pensioenfonds ABP wordt verstaan het reglement van die stichting dat is vastgesteld met inachtneming van de
      overeenkomst, bedoeld in [artikel 4, eerste lid, van de Wet privatisering ABP][ref5];

      h. Advies- en Arbitragecommissie: de Advies- en Arbitragecommissie, bedoeld in [artikel 110][ref6].


