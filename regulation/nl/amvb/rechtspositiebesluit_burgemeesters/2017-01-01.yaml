  - number: 47c
    text: |-
      Onze Minister besluit over de toekenning van de extra uitkeringen en eenmalige extra uitkeringen, bedoeld in de
      [artikelen 46c][ref1], [46e][ref2], [46f][ref3], en [47a][ref4]. De uitbetaling van deze uitkeringen en van de
      uitkering, bedoeld in [artikel 47b][ref5], geschiedt door de Stichting Pensioenfonds ABP.


      [ref1]: https://wetten.overheid.nl/BWBR0006743#Artikel46c
      [ref2]: https://wetten.overheid.nl/BWBR0006743#Artikel46e
