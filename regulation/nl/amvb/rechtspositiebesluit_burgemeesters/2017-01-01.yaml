        artikel: '5'
  - number: '8'
    text: |-
      1 De bezoldiging van de burgemeester wordt bepaald overeenkomstig de tabel in [bijlage I][ref1] bij dit besluit.

      2 De bezoldiging van de burgemeester van meer dan één gemeente wordt bepaald overeenkomstig de tabel in
      [bijlage I][ref2] bij dit besluit met dien verstande dat wordt uitgegaan van de bezoldiging behorende bij de
      eerstvolgende hogere inwonersklasse.

      3 Als de bezoldiging van het personeel in de sector Rijk wijziging ondergaat, worden de bedragen genoemd in de
      bijlage bij ministeriële regeling overeenkomstig gewijzigd.

      4 Indien aan het personeel in de sector Rijk een eenmalige uitkering wordt toegekend, ontvangt de burgemeester een
      uitkering op gelijke voet.

      5 Onze Minister doet het Georganiseerd Overleg burgemeesters mededeling indien het derde of vierde lid van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0006743
      [ref2]: https://wetten.overheid.nl/BWBR0006743
    url: https://wetten.overheid.nl/BWBR0006743/2017-01-01#Artikel8
