  - number: '12'
    text: |-
      De overgang van een gemeente naar een lagere klasse als bedoeld in [artikel 6, tweede lid][ref1], is niet van
      invloed op de bezoldiging van de op dat tijdstip in dienst zijnde burgemeester.


      [ref1]: https://wetten.overheid.nl/BWBR0006743#Artikel6
