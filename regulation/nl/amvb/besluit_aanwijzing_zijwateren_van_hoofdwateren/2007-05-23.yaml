  - number: '2'
    text: |-
      1 De zijwateren die in open verbinding staan met een hoofdwater worden gerekend tot de wateren in beheer bij het
      Rijk.

      2 De niet bevaarbare zijwateren in de bebouwde kom worden niet gerekend tot de wateren in beheer bij het Rijk.
    url: https://wetten.overheid.nl/BWBR0010970/2007-05-23#Artikel2
  - number: '3'
    text: |-
      De volgende zijwateren van het hoofdwater het Zoommeer worden niet gerekend tot de wateren in beheer bij het Rijk:

      a) de rivier de Dintel vanaf de uitwateringen- en scheepvaartsluis;

      b) de Steenbergsche Vliet vanaf de uitwaterings- en scheepvaartsluis.
    url: https://wetten.overheid.nl/BWBR0010970/2007-05-23#Artikel3
  - number: '4'
    text: |-
      De volgende zijwateren van de hoofdwateren de Boven-Rijn, het Bijlandsch Kanaal, de Waal, het Pannerdensch Kanaal,
      de Neder-Rijn, de Lek bovenstrooms Schoonhoven, de IJssel, het Keteldiep en het Kattendiep worden niet gerekend tot
      de wateren in beheer bij het Rijk:

      a) de wateren gelegen in afwateringseenheden alsmede de vrij afstromende gedeelten van wateren, voor zover het de
      bevoegdheden of verplichtingen betreft die de [Wet op de waterhuishouding][ref1] aan de kwantiteitsbeheerder van
      die wateren toekent;

      b) de wateren gelegen in de polder de Nijenbeker en Wilpsche Klei.


      [ref1]: https://wetten.overheid.nl/BWBR0004575
    url: https://wetten.overheid.nl/BWBR0010970/2007-05-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004575
  - number: '5'
    text: |-
      De volgende zijwateren van de hoofdwateren de Boven Merwede, de Nieuwe Merwede, het Hollandsch Diep, het
      Haringvliet, de Lek benedenstrooms Schoonhoven, de Hollandsche IJssel van Krimpen aan de IJssel tot de Waaiersluis,
      de Nieuwe Maas, de Nieuwe Waterweg, de Bergsche Maas, het Heusdensch Kanaal, de Afgedamde Maas, de Amer, de
      Biesbosch, de Beneden Merwede, de Noord, de Dordtsche Kil, de Oude Maas en het Spui worden niet gerekend tot
      wateren in beheer bij het Rijk:

      a) de wateren gelegen in afwateringseenheden;

      b) de wateren die in open verbinding staan met de Donge of de Amertak;

      c) het havenkanaal van Middelharnis vanaf de keersluis, en de haven van Middelharnis;

      d) de Oude Haven van Numansdorp.
    url: https://wetten.overheid.nl/BWBR0010970/2007-05-23#Artikel5
  - number: '6'
    text: |-
      De volgende zijwateren van het hoofdwater de Maas, het bedijkt gedeelte, worden niet gerekend tot de wateren in
      beheer bij het Rijk:

      a) het Burgemeester Deelenkanaal vanaf de schutsluis te Macharen;

      b) de haven van Oss.
    url: https://wetten.overheid.nl/BWBR0010970/2007-05-23#Artikel6
  - number: '7'
    text: |-
      De volgende zijwateren van het onbedijkte gedeelte van het hoofdwater de Maas worden niet gerekend tot de wateren
      in beheer bij het Rijk:

      a) de vrij afstromende gedeelten van wateren, voor zover het de bevoegdheden of verplichtingen betreft die de
      [Wet op de waterhuishouding][ref1] aan de kwantiteitsbeheerder van die wateren toekent;

      b) de wateren die door gronden of door een kunstwerk van het onbedijkte gedeelte van de Maas worden gescheiden,
      voor zover het de bevoegdheden of verplichtingen betreft die de [Wet op de waterhuishouding][ref2] aan de
      kwantiteitsbeheerder van die wateren toekent.


      [ref1]: https://wetten.overheid.nl/BWBR0004575
      [ref2]: https://wetten.overheid.nl/BWBR0004575
    url: https://wetten.overheid.nl/BWBR0010970/2007-05-23#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004575
      - id: ref2
        bwb_id: BWBR0004575
  - number: '8'
    text: |-
      De volgende zijwateren van de hoofdwateren het Ketelmeer, het IJsselmeer, het Markermeer met inbegrip van het
      Oostvaardersdiep, de Gouwzee, het IJmeer, het Gooimeer, het Eemmeer, het Wolderwijd, het Nijkerkernauw, het
      Nuldernauw, het Veluwemeer, het Drontermeer en het Vossemeer worden niet gerekend tot de wateren in beheer bij
      het Rijk:

      a) de wateren gelegen in de afwateringseenheden langs deze hoofdwateren die afwateren op een stelsel dat binnen de
      hoogwaterkering of de hoogwaterkerende gronden is gelegen;

      b) de spaarbekkens van de naamloze vennootschap Waterleidingbedrijf Noord-Holland en de naamloze vennootschap
      Watertransportmaatschappij Rijn-Kennemerland bij Andijk;

      c) de Aanloophaven te Huizen vanaf de keersluis.
    url: https://wetten.overheid.nl/BWBR0010970/2007-05-23#Artikel8
  - number: '9'
    text: |-
      Het volgende zijwater van het hoofdwater de Twenthekanalen wordt niet gerekend tot de wateren in beheer bij het
      Rijk: het Kanaal Almelo-Nordhorn vanaf de brug in de Haven Noordzijde.
    url: https://wetten.overheid.nl/BWBR0010970/2007-05-23#Artikel9
  - number: '10'
    text: |-
      De volgende zijwateren van de hoofdwateren het Zwolsche Diep, het Zwarte Water en het Zwolle-IJsselkanaal worden
      niet gerekend tot de wateren in beheer bij het Rijk:

      a) de wateren die zijn gelegen in afwateringseenheden, voor zover het de bevoegdheden of verplichtingen betreft die
      de [Wet op de waterhuishouding][ref1] aan de kwantiteitsbeheerder van die wateren toekent;

      b) het Meppelerdiep vanaf de Grote Kolksluis en de Meppelersluis te Zwartsluis, uitsluitend voor de toepassing van
      de [Wet verontreiniging oppervlaktewateren][ref2];

      c) de wateren die via het Meppelerdiep in open verbinding staan met het Zwarte Water;

      d) de Soestwetering, de Nieuwe Wetering en de stadswateren van Zwolle en de wateren die via deze wateren met
      genoemde hoofdwateren in open verbinding staan;

      e) de stadsgracht Hasselt vanaf de keersluis;

      f) de Dedemsvaart vanaf de keersluis bij het gemaal Galgenrak.


      [ref1]: https://wetten.overheid.nl/BWBR0004575
      [ref2]: https://wetten.overheid.nl/BWBR0002682
    url: https://wetten.overheid.nl/BWBR0010970/2007-05-23#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004575
      - id: ref2
        bwb_id: BWBR0002682
  - number: '11'
    text: |-
      De volgende zijwateren van het hoofdwater het Zwarte Meer worden niet gerekend tot de oppervlaktewateren in beheer
      bij het Rijk:

      a) de wateren gelegen in afwateringseenheden, voor zover het de bevoegdheden of verplichtingen betreft die de
      [Wet op de waterhuishouding][ref1] aan de kwantiteitsbeheerder aan die wateren toekent;

      b) de wateren gelegen in afwateringseenheden buiten de hoogwaterkering van Genemuiden tot IJsselmuiden, alsmede
      het Ganzendiep, de Goot en de Veneriete en de wateren die via de Goot, het Ganzendiep en de Veneriete in open
      verbinding staan met genoemd hoofdwater;

      c) de wateren in afwateringseenheden op het Kampereiland;

      d) het Kadoelermeer vanaf de Kadoeler Keersluis en de wateren in open verbinding met het Kadoelermeer.


      [ref1]: https://wetten.overheid.nl/BWBR0004575
    url: https://wetten.overheid.nl/BWBR0010970/2007-05-23#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004575
  - number: '12'
    text: |-
      De volgende zijwateren van de hoofdwateren het Lekkanaal, het Amsterdam-Rijnkanaal, het IJ, het Noordzeekanaal en
      de Buitenhaven van IJmuiden worden niet gerekend tot de wateren in beheer bij het Rijk:

      a) de Velserbeek;

      b) het Open Havenfront, de Oosterdoktoegang, het Oosterdok en de wateren die via deze zijwateren in open verbinding
      staan met een hoofdwater;

      c) de Westerdoktoegang, het Westerdok en de wateren die via deze zijwateren in open verbinding staan met een
      hoofdwater;

      d) het Westerkanaal en de wateren die via dat kanaal in open verbinding staan met een hoofdwater;

      e) het Lozingskanaal vanaf de Zeeburgersluis;

      f) het kanaal aan de westzijde van het Amsterdam-Rijnkanaal bij stroomkilometer 0,970 vanaf de inlaat ten behoeve
      van de gemeente Amsterdam;

      g) het Nieuwe Diep vanaf de kering aan de westzijde en de wateren die via dit gedeelte van het Nieuwe Diep in open
      verbinding staan met een hoofdwater;

      h) de Diemen vanaf de kering en de wateren die via dit gedeelte van de Diemen in open verbinding staan met een
      hoofdwater;

      i) de Muider Trekvaart vanaf de schotbalkkering bij de energiecentrale en de wateren die via dit gedeelte van de
      Muider Trekvaart in open verbinding staan met een hoofdwater;

      j) het Smal Weesp vanaf de keersluis en het Gaasp vanaf de schut-sluis met de brug te Driemond en de wateren die
      via dit gedeelte van het Smal Weesp en het Gaasp in open verbinding staan met een hoofdwater;

      k) de Vecht;

      l) de Nieuwe Wetering, nabij Nieuwersluis, vanaf de keersluis aan de westzijde en de schotbalkkering aan de
      oostzijde en de wateren die via deze gedeelten van de Nieuwe Wetering, in open verbinding staan met een hoofdwater;

      m) de Kerkvaart vanaf de keersluis aan de westzijde en vanaf de schutsluis aan de oostzijde en de wateren die via
      dit gedeelte van de Kerkvaart in open verbinding staan met een hoofdwater;

      n) De Leidsche Rijn vanaf het gemaal de Aanvoerder en de wateren die via dit gedeelte van de Leidsche Rijn in open
      verbinding staan met een hoofdwater;

      o) het kanaal aan de oostzijde van het Amsterdam-Rijnkanaal (stroomkilometer 42,5) langs het Tweede Veld.
    url: https://wetten.overheid.nl/BWBR0010970/2007-05-23#Artikel12
