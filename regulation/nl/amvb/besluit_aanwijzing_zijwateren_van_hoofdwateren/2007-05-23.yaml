  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Verkeer en Waterstaat van 14 juli 1999, nr. HKW/R 1999/6684,
    Hoofdkantoor van de Waterstaat, Stafdienst Bestuurlijk Juridische Zaken;

    Gelet op artikel 2 van de Wet op de waterhuishouding en artikel 3, eerste lid, van de Wet verontreiniging
    oppervlaktewateren;

    Gezien het advies van de Staatscommissie voor de Waterstaatswetgeving (advies van 9 juni 1999, nrSt-99/24);

    De Raad van State gehoord (advies van 17 september 1999, nr. W09.99.0383/V);

    Gezien het nader rapport van de Staatssecretaris van Verkeer en Waterstaat van 8 december 1999, nr. HKW/
    R/1999/10637, Hoofdkantoor van de Waterstaat, Stafdienst Bestuurlijk Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0010970/2007-05-23#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. hoofdwateren: oppervlaktewateren in beheer bij het Rijk, vermeld in de [bijlage bij de Uitvoeringsregeling
      waterhuishouding](onbekend);

      b. zijwateren: oppervlaktewateren die in verbinding staan met een hoofdwater;

      c. bebouwde kom: bebouwde kom als bedoeld in [artikel 20a van de Wegenverkeerswet 1994][ref1];

      d. niet bevaarbare wateren: oppervlaktewateren zonder bevaarbaarheidsklasse;

      e. afwateringseenheid: stelsel van waterlopen dat door dijken of kaden wordt omsloten en dat door middel van een
      kunstwerk kan afwateren op een hoofdwater of op een andere afwateringseenheid;

      f. haven: oppervlaktewateren die onder de naam «haven» bekend staan of die «aanlegplaats voor schepen» als functie
      hebben;

      g. kunstwerk: een waterstaatswerk als bedoeld in [artikel 1, eerste lid, Wet beheer rijkswaterstaatswerken][ref2]
      dat voor een functionele afsluiting, scheiding of overstort zorgt;

      h. hoogwaterkering of hoog waterkerende gronden: duinen, kunstwerken, dijken of primaire waterkeringen als bedoeld
      in de [Wet op de waterkering][ref3] of andere natuurlijke of kunstmatige omstandigheden die het water bij hoge
      stand keren dan wel het zijwater scheiden van het hoofdwater;

      i. vrij afstromende gedeelte van een water: het gedeelte bovenstrooms van de uitmonding van dat oppervlaktewater in
      een ander oppervlaktewater.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel20a
      [ref2]: https://wetten.overheid.nl/BWBR0008331#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007801
    url: https://wetten.overheid.nl/BWBR0010970/2007-05-23#Artikel1
