      aan de daartoe aangewezen vertegenwoordigers van de deelnemende bestuursorganen aan een Regionaal Informatie-
      en Expertisecentrum, voor zover het betreft politiegegevens die relevant zijn voor het geïntegreerd handhavend
      optreden bij de bestrijding van georganiseerde criminaliteit en er tussen de betreffende bestuursorganen
      schriftelijke afspraken zijn gemaakt over de gevallen waarin en de voorwaarden waaronder de gegevens worden
      verstrekt. Politiegegevens die worden verwerkt overeenkomstig de artikelen 9 en 10, eerste lid, onderdelen a en
      c, van de wet, kunnen uitsluitend aan die vertegenwoordigers worden verstrekt ten behoeve van het analyseren van
      handhavingsknelpunten, het verrichten van integrale casusanalyses en het bepalen en uitvoeren van de uit deze
      analyses voortvloeiende interventies, en voor zover het gegevens betreffen die worden verwerkt overeenkomstig de
      artikelen 9 en 10, eerste lid, onderdeel a, van de wet, slechts na instemming van het openbaar ministerie.

