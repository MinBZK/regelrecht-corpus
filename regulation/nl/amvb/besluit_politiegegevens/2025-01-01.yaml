  - number: 5:2
    text: |-
      1 Indien politiegegevens zonder voorafgaand verzoek tot doorgifte worden ontvangen van een derde land of van
      een internationale organisatie, beoordeelt de ontvangende autoriteit in Nederland onmiddellijk of deze gegevens
      noodzakelijk zijn voor het doel waarvoor zij zijn doorgegeven.

      2 Indien krachtens het recht van het derde land specifieke beperkingen op de verwerking van politiegegevens gelden,
      ziet de ontvangende autoriteit in Nederland toe op inachtneming van de beperkingen indien deze door de doorgevende
      autoriteit zijn gemeld.

      3 Indien politiegegevens worden ontvangen van een derde land of van een internationale organisatie, wordt de
      doorgevende instantie desgevraagd geïnformeerd over de verwerking van de doorgegeven gegevens en het daardoor
      behaalde resultaat.
    url: https://wetten.overheid.nl/BWBR0023086/2025-01-01#Artikel52
  - number: 5:3
    text: |-
      1 Aan personen of instanties in een andere lidstaat van de Europese Unie, die zijn belast met de voorkoming en
      opsporing van strafbare feiten in de betreffende lidstaat, worden politiegegevens doorgezonden onder gelijke
      voorwaarden als aan politieambtenaren in Nederland, voor zover zij deze behoeven voor een goede uitvoering van die
      taak en behoudens de toepassing van de gronden, bedoeld in het tweede lid.

      2 De doorzending kan worden geweigerd of aan beperkende voorwaarden worden onderworpen indien dit:

      a. een geval betreft als bedoeld in [artikel 2:13][ref1];

      b. strijdig zou zijn met of schade zou toebrengen aan essentiële nationale veiligheidsbelangen;

      c. het welslagen van een lopend onderzoek naar een strafbaar feit of de veiligheid van een persoon in gevaar zou
      brengen;

      d. de beschermde essentiële belangen van een rechtspersoon disproportioneel zou schaden;

      e. betrekking heeft op een strafbaar feit dat in Nederland strafbaar is gesteld met een gevangenisstraf van een
      jaar of minder;

      f. betrekking heeft op een aangelegenheid die naar Nederlands recht geen strafbaar feit is;

      g. betrekking heeft op politiegegevens die uitsluitend kunnen worden doorgezonden na instemming van de officier van
      justitie en deze geen toestemming geeft voor de doorzending;

      h. betrekking heeft op politiegegevens die zijn verkregen van een andere lidstaat of van een derde land en deze
      geen toestemming geeft voor de doorzending;

      i. betrekking heeft op politiegegevens die niet behoren tot de in deel B van bijlage II bij [Verordening (EU)
      2016/794](32016R0794) opgesomde categorieën persoonsgegevens en niet nodig is voor, en niet in verhouding staat
      tot, het bereiken van het doel waarvoor om doorzending van de gegevens is verzocht.

      3 Aan personen of instanties in een andere lidstaat, als bedoeld in het eerste lid, worden politiegegevens
      doorgezonden, voor zover zij deze behoeven ter voorkoming van strafbare feiten en ter handhaving van de openbare
      orde in verband met grootschalige evenementen. De politiegegevens kunnen uitsluitend worden doorgezonden indien
      definitieve veroordelingen of andere feiten het vermoeden rechtvaardigen dat de desbetreffende personen tijdens
      de evenementen strafbare feiten zullen plegen of dat zij een gevaar voor de openbare orde en veiligheid vormen.
      De politiegegevens worden doorgezonden onder de voorwaarde dat deze worden vernietigd zodra de doeleinden zijn
      verwezenlijkt, in elk geval uiterlijk na één jaar.

      4 De gegevens worden doorgezonden onder de voorwaarde dat deze slechts kunnen worden verwerkt voor het doel
      waarvoor ze zijn doorgezonden.

      5 De gegevens worden doorgezonden onder de voorwaarde dat deze door de ontvangende autoriteit worden vernietigd
      zodra de doeleinden zijn verwezenlijkt.

      6 Indien dit uit de wet voortvloeit kunnen bij de doorzending termijnen worden gesteld, na afloop waarvan de
      doorgezonden gegevens door de ontvangende autoriteit moeten worden vernietigd, behoudens wanneer verdere verwerking
      noodzakelijk is voor een lopend onderzoek, de vervolging van strafbare feiten of de tenuitvoerlegging van straffen.

      7 In afwijking van het vierde lid kunnen in specifieke omstandigheden door de doorzendende autoriteit specifieke
      beperkingen worden gesteld aan de verdere verwerking van de doorgezonden politiegegevens, voor zover deze
      beperkingen ook van toepassing zijn op de beschikbaarstelling van de gegevens aan andere politieambtenaren in
      Nederland.

      8 [Artikel 5:1, tweede, derde en vierde lid][ref2], en [artikel 5:2][ref3] zijn van overeenkomstige toepassing.

      9 In de grensgebieden kan de doorzending in verband met de strafrechtelijke handhaving van de rechtsorde
      of de handhaving van de openbare orde zonder tussenkomst van een landelijke eenheid, bedoeld in
      [artikel 25, eerste lid, onderdeel b, van de Politiewet 2012][ref4], plaatsvinden voor zover dit voortvloeit uit
      een verdrag waarbij ook België of Duitsland als verdragsluitende partij betrokken zijn of uit een besluit, bedoeld
      in artikel 34, tweede lid, van het Verdrag betreffende de werking van de Europese Unie. Op doorzending in de
      grensgebieden waarvoor geen tussenkomst van een landelijke eenheid, bedoeld in de vorige volzin, vereist is, is het
      tweede lid niet van toepassing.

      10 Op een daartoe strekkend verzoek van de personen of instanties, bedoeld in het eerste lid, vindt doorzending van
      door de Financiële inlichtingen eenheid ter beschikking gestelde persoonsgegevens voor het gebruik van die gegevens
      voor een ander doel dan bedoeld in de [artikelen 8][ref5], [9][ref6], [10][ref7] of [13 van de wet][ref8] slechts
      plaats nadat daartoe toestemming is verleend door het hoofd van de Financiële inlichtingen eenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0023086#Artikel213
