  - number: 3:1
    text: |-
      De misdrijven, bedoeld in [artikel 10, eerste lid, onderdeel a, onder 3°, van de wet][ref1] die gezien hun aard of
      samenhang met andere door de betrokkene begane misdrijven een ernstige inbreuk op de rechtsorde opleveren, zijn:

      a. de misdrijven, bedoeld in de [artikelen 311, eerste lid, onder 3° tot en met 5°][ref2],
      en [416 van het Wetboek van Strafrecht][ref3], voor zover de feiten een schade van ten
      minste € 25 000 veroorzaakt hebben en betrokkene tevens een misdrijf als bedoeld in
      [artikel 10, eerste lid, onderdeel a, onder 1° en 2°, van de wet][ref4] heeft begaan;

      b. de misdrijven, bedoeld in [241][ref5], [245, eerste lid][ref6], en [252][ref7] en
      [273f van het Wetboek van Strafrecht][ref8];

      c. de misdrijven, bedoeld in de [artikelen 177][ref9], [178][ref10], [361][ref11]
      en [363 van het Wetboek van Strafrecht][ref12] en de [artikelen 179][ref13] en
      [180 van het Wetboek van Strafrecht][ref14] in verband met de [artikelen 181][ref15] en
      [182 van dat wetboek][ref16];

      d. de misdrijven, bedoeld in de [artikelen 225][ref17], [226][ref18], [227][ref19], [231][ref20] en
      [232 van het Wetboek van Strafrecht][ref21], voor zover de feiten een schade van ten minste € 50 000 veroorzaakt
      hebben;

      e. de misdrijven, bedoeld in de [artikelen 191][ref22] en [197a van het Wetboek van Strafrecht][ref23];

      f. het misdrijf, bedoeld in [artikel 3, eerste lid, onderdeel A, van de Opiumwet][ref24];

      g. de misdrijven, bedoeld in de [artikelen 26][ref25] en [31 van de Wet wapens en munitie][ref26], voor zover de
      feiten betrekking hebben op het voorhanden hebben van vuurwapens en explosieven.


