  - number: 6a:5
    text: |-
      1 In afwijking van [artikel 4:2, eerste lid][ref1], kunnen politiegegevens die worden verwerkt overeenkomstig de
      [artikelen 8][ref2] en [13, eerste lid, van de wet][ref3] en voor zover zij deze behoeven voor een goede uitvoering
      van hun taak, worden verstrekt aan:

      a. het Waarborgfonds Motorverkeer, als bedoeld in
      [artikel 15, eerste lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen BES][ref4], voor zover het
      betreft gegevens omtrent de personalia en de verblijfplaats van benadeelden en zij deze gegevens behoeven voor
      de hulp aan benadeelden ten behoeve van het geldend maken van een recht op schadevergoeding, als bedoeld in
      [artikel 17 van de Wet aansprakelijkheidsverzekering motorrijtuigen BES][ref5];

      b. degene die namens een reclasseringsinstelling reclasseringswerkzaamheden verricht ten behoeve van die
      werkzaamheden;

      c. de voogdijraad ten behoeve van de uitvoering van één van de bij wet aan de voogdijraad opgedragen taken;

      d. Onze Minister van Asiel en Migratie ten behoeve van het verwerken van gegevens omtrent de identiteit van
      vreemdelingen en de verdere verstrekking van die gegevens aan instanties die zijn betrokken bij de uitvoering van
      de [Wet toelating en uitzetting BES][ref6], ten behoeve van de vaststelling van de identiteit vreemdelingen, en
      aan andere instanties met een publieke taak belast, ten behoeve van registratie, identificatie en verificatie van
      vreemdelingen, hun documenten of hun verblijfsrechtelijke positie;

      e. de Onderzoeksraad voor veiligheid, bedoeld in [artikel 2, van de Rijkswet Onderzoeksraad voor veiligheid][ref7],
      ten behoeve van de uitvoering van de in die wet opgedragen taken;

      f. benadeelden van strafbare feiten, waaronder begrepen de personen die in verband met die feiten in hun rechten
      zijn getreden of ingevolge enige wettelijke bepaling terzake van die rechten een recht van verhaal hebben gekregen,
      voor zover zij deze gegevens behoeven om in rechte voor hun belangen op te kunnen komen;

      g. de door Onze Minister van Justitie en Veiligheid aangewezen organisatie, ten behoeve van de verzending van
      beschikkingen en transacties en de tenuitvoerlegging van ontnemings- en schadevergoedingsmaatregelen;

      h. de Dienst Terugkeer en Vertrek, voor zover het betreft gegevens over vreemdelingen die zijn verkregen in het
      kader van de uitoefening van het toezicht, bedoeld in [artikel 22a van de Wet toelating en uitzetting BES][ref8],
      of de opsporing van strafbare feiten, ten behoeve van de begeleiding van de terugkeer of het vertrek uit de
      openbare lichamen Bonaire, Sint Eustatius en Saba van vreemdelingen die geen toelating tot verblijf hebben;

      2 [Artikel 4:2, tweede lid][ref9], is van toepassing.

      3 Politiegegevens die worden verwerkt overeenkomstig de [artikelen 8][ref10] en [13, eerste lid, van de wet][ref11]
      kunnen, voor zover zij deze behoeven voor een goede uitvoering van hun taak, worden verstrekt aan de
      door Onze Minister van Sociale Zaken en Werkgelegenheid respectievelijk Onze Minister van Financiën
      aangewezen ambtenaren, die zijn belast met het toezicht op de naleving van het bepaalde bij of
      krachtens de [Wet arbeid vreemdelingen BES][ref12] respectievelijk de [hoofdstukken I][ref13] en
      [VIII van de Belastingwet BES][ref14] ten behoeve van de inschatting van de veiligheidsrisico’s met betrekking tot
      de uitoefening van vorenbedoeld toezicht.

      4 Politiegegevens die worden verwerkt overeenkomstig de [artikelen 8][ref15] en [13, eerste lid, van de wet][ref16],
      kunnen worden verstrekt aan de basisadministratie persoonsgegevens van een van de openbare lichamen Bonaire, Sint
      Eustatius of Saba, bedoeld in [artikel 2 van de Wet basisadministraties persoonsgegevens BES][ref17], met het oog
      op de signalering van veranderingen in de gegevens die in de basisadministraties zijn opgenomen.


