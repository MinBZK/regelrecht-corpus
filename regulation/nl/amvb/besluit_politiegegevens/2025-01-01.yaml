      3 De politiegegevens, bedoeld in het tweede lid, worden door leden van het openbaar ministerie beoordeeld in
      het kader van de adviserende taak voor de uitvoering van de bovenbedoelde wetten en kunnen, in het kader van
      vorenbedoelde taak, worden verstrekt aan de personen en instanties, genoemd in het tweede lid. Aan de verstrekking
      van de politiegegevens kunnen door de leden van het openbaar ministerie nadere voorwaarden worden gesteld. Die
      voorwaarden kunnen onder meer betreffen het ter beschikking stellen of doorgeven van die gegevens of inlichtingen
      aan derden.

      4 De politiegegevens, bedoeld in het tweede en derde lid, die zijn verstrekt aan de personen en instanties, bedoeld
      in het tweede lid, worden niet langer dan gedurende een termijn van twaalf maanden na de datum van verkrijgen
      bewaard. De gegevens kunnen langer worden bewaard met bijzondere toestemming van het openbaar ministerie. Daarbij
      kunnen nadere voorwaarden worden gesteld.

      5 Politiegegevens die worden verwerkt overeenkomstig de [artikelen 8][ref125], [9][ref126],
      [10, eerste lid, onderdelen a en c][ref127], en [13, eerste lid, van de wet][ref128], kunnen worden verstrekt aan
      de volgende personen en instanties, voor zover zij deze behoeven voor het nemen van de besluiten waarmee zij zijn
      belast op grond van de hiernavolgende wetten:

        - Onze Minister van Justitie en Veiligheid, ten behoeve van: a. het nemen van een beslissing op
      grond van de [Wet wapens en munitie][ref129]; b. het nemen van een beslissing op grond van de
      [Wet particuliere beveiligingsorganisaties en recherchebureaus][ref130]; c. een onderzoek naar de betrouwbaarheid
      van een buitengewoon opsporingsambtenaar en het nemen van een beslissing hieromtrent op grond van de
      [artikelen 17][ref131] en [35 van het Besluit buitengewoon opsporingsambtenaar][ref132]; d. het nemen van
      beslissingen omtrent het register van verrichters en aanbieders van buitengerechtelijke incassowerkzaamheden op
      grond van de [Wet kwaliteit incassodienstverlening][ref133].
        - Onze Minister van Defensie, ten behoeve van: a. het houden van toezicht op de
      [Wet particuliere beveiligingsorganisaties en recherchebureaus][ref134]; b. het houden van toezicht op
      de naleving van de [Wet wapens en munitie][ref135]; c. het houden van toezicht op de naleving van de
      [Wet explosieven voor civiel gebruik][ref136]; d. de bij of krachtens de [Vreemdelingenwet 2000][ref137] opgedragen
      taken.
        - de korpschef, ten behoeve van: a. het nemen van beschikkingen omtrent het verlenen of intrekken van een
      omgevingsvergunning voor een jachtgeweeractiviteit op grond van de [Omgevingswet][ref138]; b. het nemen
      van een beslissing op grond van de [Wet particuliere beveiligingsorganisaties en recherchebureaus][ref139];
      c. het nemen van beschikkingen omtrent het verlenen of intrekken van een erkenning op grond van
      de [Wet explosieven voor civiel gebruik][ref140]; d. het nemen van een beslissing omtrent de
      [Wet wapens en munitie][ref141]; e. de hem bij of krachtens de [Vreemdelingenwet 2000][ref142] opgedragen taken.
        - de burgemeester, ten behoeve van het nemen van een beslissing omtrent: a. de verlening, weigering of intrekking
      van een vergunning of ontheffing op grond van de [Alcoholwet][ref143]; b. het nemen van een beslissing omtrent een
      vergunning op grond van de [Wet op de kansspelen][ref144].
        - de werkgever van een ambtenaar van politie, bedoeld in [artikel 1, onderdeel k, van de wet][ref145], ten behoeve
