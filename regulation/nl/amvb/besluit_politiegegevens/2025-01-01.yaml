  - number: 4:1
    text: |-
      1 Politiegegevens die worden verwerkt overeenkomstig
      [artikel 13, eerste lid, onderdeel a en onderdeel d, van de wet][ref1], kunnen, voor zover zij deze behoeven voor
      een goede uitvoering van hun taak, worden verstrekt aan:

      a. de Immigratie- en Naturalisatiedienst, ten behoeve van:

      1°. het vaststellen van de identiteit van personen;

      2°. het nemen van beslissingen omtrent de erkenning als referent en de toelating, het verblijf en de
      ongewenstverklaring als bedoeld in de [Vreemdelingenwet 2000][ref2], en van beslissingen op grond van de
      [Rijkswet op het Nederlanderschap][ref3] of een verdrag dan wel een voor Nederland bindend besluit van een
      volkenrechtelijke organisatie, als bedoeld in [artikel 112 van de Vreemdelingenwet 2000][ref4];

      3°. het opstellen van profielen voor de geautomatiseerde behandeling van aanvragen en voor de uitoefening van het
      toezicht op de naleving van de wettelijke voorschriften met betrekking tot vreemdelingen en tot referenten als
      bedoeld in de [artikelen 47][ref5] en [47a van de Vreemdelingenwet 2000][ref6];

      b. luchtvaartmaatschappijen, als bedoeld in [artikel 1, onderdeel h, van de Luchtvaartwet][ref7], voor zover
      het gaat om personalia en gegevens betreffende de datum van retourvervoer ten behoeve van het voorkomen van
      overtredingen van de [Opiumwet][ref8] en de bescherming van de gezondheid van personen door het weigeren van
      het vervoer van personen van en naar bepaald aangewezen buitenlandse bestemmingen en er met de betreffende
      luchtvaartmaatschappijen schriftelijke afspraken zijn gemaakt over de waarborgen rond de gegevensverstrekking.

      c. Onze Minister van Buitenlandse Zaken, ten behoeve van de uitvoering van opdrachten tot signalering van personen
      in het buitenland en het nemen van een beslissing omtrent de afgifte van een paspoort of omtrent de verlening of
      verlenging van een visum;

      d. Onze Minister van Asiel en Migratie, ten behoeve van het nemen van een beslissing omtrent de verlening of
      wijziging van een machtiging tot voorlopig verblijf.

      2 De op grond van het eerste lid, onder b verstrekte gegevens met betrekking tot individuele personen worden door
      de luchtvaartmaatschappijen niet langer verwerkt dan gedurende een termijn van ten hoogste zesendertig maanden na
      de datum van de aanhouding van de betrokkene, die aanleiding geeft tot opneming van de gegevens op de lijst.


