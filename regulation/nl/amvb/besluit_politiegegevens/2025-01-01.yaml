  - number: 4:3
    text: |-
      1 Politiegegevens die worden verwerkt overeenkomstig de [artikelen 8][ref1], [9][ref2],
      [10, eerste lid, onderdelen a en c][ref3] en [13 van de wet][ref4] kunnen, voor zover zij deze behoeven voor een
      goede uitvoering van hun taak, worden verstrekt aan:

      a. Onze Minister van Justitie en Veiligheid, ten behoeve van:

      1°. de controle van rechtspersonen met het oog op de voorkoming en bestrijding van misbruik van rechtspersonen,
      waaronder het plegen van misdrijven en overtredingen van financieel-economische aard door of door middel van deze
      rechtspersonen, bedoeld in [artikel 2, eerste lid, van de Wet controle op rechtspersonen][ref5];

      2°. de uitvoering van [artikel 5, eerste lid, van de Gratiewet][ref6];

      3°. de beoordeling van de benoeming, de herbenoeming of het ontslag van de leden van de commissies van toezicht bij
      de inrichtingen, bedoeld in onderdeel c, alsmede van de leden van de commissies van toezicht op de arrestantenzorg,
      bedoeld in [artikel 50, eerste lid, van het Besluit beheer politie][ref7];

      4°. het afgeven van een verklaring omtrent het gedrag, bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref8] en de verdere verstrekking van die gegevens
      aan de Adviescommissie VOG-politiegegevens, bedoeld in [artikel 35a, vierde lid, van die wet][ref9], ten behoeve
      van de toepassing van [artikel 44a van het Besluit justitiële en strafvorderlijke gegevens][ref10];

      5°. de taakuitvoering van de Financiële inlichtingen eenheid, bedoeld in
      [artikel 13 van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref11] en
      [artikel 3.2 van de Wet ter voorkoming van witwassen en financieren van terrorisme BES][ref12];

      6°. de tenuitvoerlegging van een geldboete als bedoeld in [artikel 23 van het Wetboek van Strafrecht][ref13],
      van de verbeurdverklaring van niet in beslaggenomen voorwerpen, bedoeld in
      [artikel 34 van het Wetboek van Strafrecht][ref14] of van een maatregel als
      bedoeld in de [artikelen 36b, eerste lid][ref15], [36e, eerste lid][ref16], of
      [36f, eerste lid, van het Wetboek van Strafrecht;][ref17]

      7°. de inspectie, bedoeld in [artikel 57, eerste lid, van de Wet veiligheidsregio’s][ref18], met het
      oog op de uitvoering van de taken, bedoeld in [artikel 65, eerste lid, van de Politiewet 2012][ref19]
      en op de uitvoering van een bevel, als bedoeld in de [artikelen 126nba, eerste lid][ref20],
      [126uba, eerste lid][ref21] en [126zpa, eerste lid, van het Wetboek van Strafvordering][ref22],
      door de ambtenaren, bedoeld in [artikel 141, onderdeel d][ref23], en de personen, bedoeld in
      [artikel 142, eerste lid, onderdeel b, van het Wetboek van Strafvordering][ref24];

      8°. de Passagiersinformatie-eenheid, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ____________________, met het oog op de uitvoering van haar taken, bedoeld in de
      [artikelen 6, eerste lid, onder a en b][ref26], en [14, tweede lid, van die wet][ref27];

      9°. het doen en uitvoeren van verzoeken om internationale rechtshulp in stafzaken;

      10°. de uitvoering van de taken, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ____, door het Nationaal Cyber Security Centrum.

      b. de burgemeester ten behoeve van:

      1°. de beoordeling van een verzoek tot het verkrijgen van het Nederlanderschap op grond van de
      [Rijkswet op het Nederlanderschap][ref29];

      2°. de afgifte van de woonverklaring, bedoeld in
      [artikel 10b, vierde lid, van de Wet bijzondere maatregelen grootstedelijke problematiek][ref30].

      c. de directeuren van inrichtingen, bedoeld in
      [artikel 1, onderdeel b, van de Penitentiaire beginselenwet][ref31], van de inrichtingen, bedoeld in
      [artikel 1, onderdeel b, van de Beginselenwet verpleging ter beschikking gestelden en van de inrichtingen][ref32],
      bedoeld in [artikel 1, onderdeel b, van de Beginselenwet justitiële jeugdinrichtingen][ref33], en functionarissen
      van de Dienst Justitiële inrichtingen van het Ministerie van Justitie en Veiligheid, ten behoeve van:

      1. het nemen van beslissingen over hetzij de indienstneming of het ontslag van personeel, hetzij de toelating tot
      de inrichting van personen die niet worden ingesloten in de inrichting, voor zover dat noodzakelijk is voor de orde
      of veiligheid in de inrichting respectievelijk de voorziening;

      2. het nemen van beslissingen over het verlaten van de inrichting bij wijze van verlof;

      3. het nemen van beslissingen over de erkenning van een penitentiair programma, bedoeld in
      [artikel 4, eerste lid, van de Penitentiaire beginselenwet][ref34], of een scholing- en trainingprogramma, bedoeld
      in [artikel 3, eerste lid, van de Beginselenwet justitiële inrichtingen][ref35];

      4. het treffen van maatregelen met betrekking tot de voorkoming van strafbare feiten door of met betrekking
      tot gedetineerden, de handhaving van de orde en veiligheid in de justitiële inrichting, of de ongestoorde
      tenuitvoerlegging van de vrijheidsbeneming.

      d. Onze Minister van Justitie en Veiligheid, ten behoeve van de uitoefening van de bevoegdheid, bedoeld in
      [artikel 37q van de Luchtvaartwet][ref36], en de commandant van de Koninklijke marechaussee, voor zover de
      uitoefening van die bevoegdheid aan hem is gemandateerd;

      e. de korpschef, ten behoeve van zijn adviserende taak in het kader van:

      1°. de uitvoering van [artikel 3B.1 van het Vuurwerkbesluit][ref37];

      2°. de benoeming en de herbenoeming van de leden van de commissies van toezicht op de arrestantenzorg, bedoeld in
      [artikel 50, eerste lid, van het Besluit beheer politie][ref38];

      f. het bevoegde gezag, bedoeld in
      [artikel 1, eerste lid, onderdeel l, van het Besluit algemene rechtspositie politie][ref39], ten behoeve van
      het verrichten van een onderzoek naar de betrouwbaarheid als bedoeld in [artikel 48q, eerste lid][ref40],
      [48s, tweede lid][ref41], [48x, eerste en tweede lid, van de Politiewet 2012][ref42];

      g. het Bureau bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref43], ten behoeve van de
      uitoefening van de in [die wet][ref44] aan het bureau opgedragen taak;

      h. de Immigratie- en Naturalisatiedienst, ten behoeve van de taken, bedoeld in
      [artikel 4:1, eerste lid, onderdeel a, onder 2° en 3°][ref45];

      i. de burgemeester en de commissaris van de Koning, ten behoeve van hun adviserende taak, bedoeld in het
      [Reglement op de Orde van de Nederlandse Leeuw en de Orde van Oranje-Nassau][ref46] en Onze Minister van Defensie
      met het oog op de toekenning van bij koninklijk besluit te verlenen onderscheidingen;

      j. gedragsdeskundigen, voor zover het betreft auditieve of audiovisuele registraties van het verhoor van een
      persoon naar aanleiding van een ernstig strafbaar feit, voor het beoordelen van het verhoor en het opstellen van
      een deskundigenrapportage ten behoeve van het strafrechtelijk onderzoek, het gerechtelijk vooronderzoek of het
      onderzoek ter terechtzitting;

      k. Onze Minister van Defensie en de onder hem ressorterende bevelvoerende militairen van een oorlogsschip,
      inrichting van de zeemacht, compagnie, eskadron, batterij of squadron of een hogere eenheid, voor zover het betreft
      gegevens omtrent:

      1°. de toepassing van vrijheidsbenemende dwangmiddelen jegens een militair, ten behoeve van het nemen van
      maatregelen met betrekking tot de operationele gereedheid van de eenheid; of

      2°. de betrokkenheid van een militair bij de verdenking van een overtreding van de [Opiumwet][ref47] of een
      misdrijf, ten behoeve van het nemen van besluiten inzake schorsing of ontslag van militaire ambtenaren, als bedoeld
      in [artikel 12 van de Militaire Ambtenarenwet 1931][ref48];

      l. bestuursorganen en rechtspersonen met een overheidstaak, bedoeld in
      [artikel 1, eerste lid, van de Wet bevordering integriteitsbeoordelingen openbaar bestuur][ref49], voor zover dat
      noodzakelijk is in de gevallen waarin zij bevoegd zijn tot toepassing van die [wet][ref50], uitsluitend voor zover
      het betreft gegevens omtrent de betrokkene, bedoeld in artikel 1, eerste lid, van die wet. Indien de betrokkene
      een rechtspersoon is betreffen de gegevens zowel de rechtspersoon als de bestuurders, alsmede de gegevens met
      betrekking tot strafbare feiten waaraan [artikel 51, tweede lid, onder 2°, van het Wetboek van Strafrecht][ref51]
      ten grondslag heeft gelegen. Indien een bestuurder een rechtspersoon is betreffen de gegevens eveneens deze
      rechtspersoon, alsmede de bestuurders daarvan. Indien de betrokkene een maatschap of vennootschap onder firma is
      betreffen de gegevens de maten, dan wel de vennoten, uitgezonderd de gegevens betreffende de vennoot en commandite,
      alsmede de gegevens met betrekking tot strafbare feiten waaraan artikel 51, tweede lid, onder 2°, van het Wetboek
      van Strafrecht ten grondslag heeft gelegen. Indien de vennoten of maten rechtspersoonlijkheid bezitten betreffen de
      gegevens deze rechtspersonen, alsmede de bestuurders daarvan;

      m. het college van burgemeester en wethouders voor zover het
      gegevens behoeft voor de handhaving van de voorschriften, bedoeld in
      [artikel 10b, vijfde lid, van de Wet bijzondere maatregelen grootstedelijke problematiek][ref52];

      n. bestuursorganen, ten behoeve van het nemen van een beslissing omtrent de toepassing van
      [artikel 6 van de Tijdelijke wet bestuurlijke maatregelen terrorismebestrijding][ref53], uitsluitend voor
      zover het betreft gegevens omtrent de aanvrager, subsidieontvanger of houder van een vergunning, ontheffing of
      erkenning als bedoeld in artikel 6, onderdeel a, van die wet. Indien deze aanvrager, subsidieontvanger of houder
      een rechtspersoon is, betreffen de gegevens zowel de rechtspersoon als de bestuurders, alsmede de gegevens met
      betrekking tot strafbare feiten waaraan [artikel 51, tweede lid, onder 2°, van het Wetboek van Strafrecht][ref54]
      ten grondslag heeft gelegen. Indien een bestuurder een rechtspersoon is betreffen de gegevens eveneens deze
      rechtspersoon, alsmede de bestuurders daarvan. Indien de aanvrager, subsidieontvanger of houder een maatschap
      of vennootschap onder firma is betreffen de gegevens de maten, dan wel de vennoten, uitgezonderd de gegevens
      betreffende de vennoot en commandite, alsmede de gegevens met betrekking tot strafbare feiten waaraan artikel
      51, tweede lid, onder 2°, van het Wetboek van Strafrecht ten grondslag heeft gelegen. Indien de vennoten of maten
      rechtspersoonlijkheid bezitten betreffen de gegevens deze rechtspersonen, alsmede de bestuurders daarvan;

      o. de hulpofficier van justitie, de functionarissen, bedoeld in de
      __REF000___________________________________________________________________________________________________________
      _________________, het hoofd van de bijzondere opsporingsdienst en de direct toezichthouder, bedoeld in
      [artikel 1 van het Besluit buitengewoon opsporingsambtenaar][ref56], ten behoeve van:

      1°. de geweldsregistratie, bedoeld in
      __REF000___________________________________________________________________________________________________________
      _______________________;

      2°. de behandeling en beoordeling van de geweldsregistratie, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ___;

      p. de raad van bestuur van de kansspelautoriteit, bedoeld in
      [artikel 33a van de Wet op de kansspelen][ref59] ten behoeve van het betrouwbaarheidsonderzoek, bedoeld in
      [artikel 31i van de Wet op de kansspelen][ref60]. De te verstrekken gegevens betreffen uitsluitend de in
      [artikel 3.4, eerste lid, van het Besluit kansspelen op afstand][ref61] genoemde personen. Indien het daarbij gaat
      om een rechtspersoon, betreffen de gegevens zowel de rechtspersoon zelf als de bestuurders, alsmede de gegevens met
      betrekking tot strafbare feiten waaraan [artikel 51, tweede lid, onder 2°, van het Wetboek van Strafrecht][ref62]
      ten grondslag heeft gelegen. Indien een bestuurder een rechtspersoon is betreffen de gegevens eveneens deze
      rechtspersoon, alsmede de bestuurders daarvan. Indien de betrokkene een maatschap of vennootschap onder firma is
      betreffen de gegevens de maten, dan wel de vennoten, uitgezonderd de gegevens betreffende de vennoot en commandite,
      alsmede de gegevens met betrekking tot strafbare feiten waaraan artikel 51, tweede lid, onder 2°, van het Wetboek
      van Strafrecht ten grondslag heeft gelegen. Indien de vennoten of maten rechtspersoonlijkheid bezitten betreffen de
      gegevens deze rechtspersonen, alsmede de bestuurders daarvan;

      q. deskundigen als bedoeld in [artikel 51i van het Wetboek van Strafvordering][ref63] ten behoeve van de uitvoering
