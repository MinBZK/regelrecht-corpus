  - number: 4:2
    text: |-
      1 Politiegegevens die worden verwerkt overeenkomstig de [artikelen 8][ref1] en [13, eerste lid, van de wet][ref2],
      kunnen, voor zover zij deze behoeven voor een goede uitvoering van hun taak, worden verstrekt aan:

      a. de commissie, bedoeld in [artikel 8 van de Wet schadefonds geweldsmisdrijven][ref3], ten behoeve van het nemen
      van een beslissing op een verzoek tot uitkering uit het schadefonds geweldsmisdrijven;

      b. de navolgende instanties die hulp aan slachtoffers verlenen:

      1°. de stichting slachtofferhulp Nederland, ten behoeve van het behartigen van belangen van slachtoffers van
      strafbare feiten of verkeersongevallen;

      2°. de stichting Perspectief Herstelbemiddeling, voor wat betreft gegevens over slachtoffers van strafbare feiten
      en verkeersongevallen en, in bijzondere of ernstige gevallen, gegevens uit het proces-verbaal, ten behoeve van de
      bemiddeling tussen die slachtoffers en verdachten of veroordeelden, en;

      3°. de stichting Comensha, voor wat betreft gegevens over slachtoffers van mensenhandel en de aanmeldende
      autoriteit, ten behoeve van de coördinatie van de opvang en verzorging van slachtoffers van mensenhandel en de
      registratie van gegevens over mensenhandel;

      c. de Stichting Processen Verbaal, voor zover het gegevens betreft inzake aanrijdingen of aanvaringen, ten behoeve
      van een goede uitvoering van haar taak;

      d. het Waarborgfonds Motorverkeer, als bedoeld in
      [artikel 23, eerste lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref4], voor zover het betreft
      gegevens omtrent de personalia en de verblijfplaats van benadeelden en zij deze gegevens behoeven voor de
      hulp aan benadeelden ten behoeve van het geldend maken van een recht op schadevergoeding, als bedoeld in de
      [artikelen 25, eerste lid][ref5], en [26a, eerste en tweede lid, van die wet][ref6];

      e. de Stichting Centraal Bureau Rijvaardigheidsbewijzen, ten behoeve van:

        - het onderzoek, bedoeld in de [artikelen 101][ref7] en [142 van het Reglement rijbewijzen][ref8], en het betreft
      overtreding van [artikel 6][ref9] of [artikel 8 van de Wegenverkeerswet 1994][ref10], of
        - de vervulling van de in de [artikelen 130 tot en met 134a van de Wegenverkeerswet 1994][ref11] aan de Divisie
      Vorderingen van het bureau opgedragen taak;

      f. Halt-bureaus, voor zover zij zijn aangewezen door Onze Minister van Justitie en Veiligheid, ten behoeve van de
      alternatieve afdoening van de strafbare feiten, gepleegd door minderjarigen;

      g. reclasseringswerkers als bedoeld in [artikel 6 van de Reclasseringsregeling 1995][ref12], ten behoeve van
      het uitvoeren van de werkzaamheden, bedoeld in [hoofdstuk 3 van die Regeling][ref13] en de indicatiestelling ten
      behoeve van de forensische zorg;

      h. de Dienst Wegverkeer, ten behoeve van het uitvoeren van de taken van de dienst op grond van
      [artikel 2 van de Regeling taken Dienst Wegverkeer][ref14];

      i. het college van burgemeesters en wethouders, ten behoeve van de uitvoering van de taken, bedoeld
      in de [artikelen 2.3, eerste en zesde lid][ref15], en [2.4, eerste lid, van de Jeugdwet][ref16],
      de gecertificeerde instelling, bedoeld in [artikel 1.1 van de Jeugdwet][ref17], ten behoeve van
      de uitvoering van een kinderbeschermingsmaatregel of jeugdreclassering en Veilig Thuis, bedoeld in
      [artikel 1.1.1. van de Wet maatschappelijke ondersteuning 2015][ref18], ten behoeve van de uitvoering van de taken,
      bedoeld in a[rtikel 4.1.1, tweede lid, van die wet][ref19];

      j. de raad voor de kinderbescherming, ten behoeve van de uitvoering van één van de bij wet aan de raad opgedragen
      taken;

      k. Onze Minister van Justitie en Veiligheid, ten behoeve van:

      1°. het verwerken van gegevens over jeugdigen in het Cliënt Volgsysteem jeugdcriminaliteit, ter ondersteuning van
      de voorkoming en bestrijding van jeugdcriminaliteit;

      2°. het verwerken van gegevens omtrent de identiteit van verdachten en veroordeelden in de strafrechtsketendatabank
      en de verdere verstrekking van die gegevens aan de functionarissen en organen die met de toepassing van het
      strafrecht zijn belast, ten behoeve van de vaststelling van de identiteit van verdachten en veroordeelden;

      3°. het vergelijken van deze gegevens, voor zover deze DNA-profielen van overleden personen
      betreffen wier identiteit onbekend is, met de DNA-profielen van de personen, bedoeld in
      [artikel 14, vierde lid, onder d tot en met f, van het Besluit DNA-onderzoek in strafzaken][ref20], ten behoeve van
      de vaststelling van de identiteit van deze overleden personen;

      4°. het verzoek tot weigering of vervallenverklaring van een reisdocument, op grond van
      [artikel 23 van de Paspoortwet][ref21];

      l. de Onderzoeksraad voor veiligheid, bedoeld in [artikel 2 van de Rijkswet Onderzoeksraad voor veiligheid][ref22],
      ten behoeve van de uitvoering van de in [die wet][ref23] opgedragen taken;

      m. de door Onze Minister van Economische Zaken aangewezen dienst, bedoeld in
      [artikel 1, onderdeel b, van het Besluit inbeslaggenomen voorwerpen][ref24], voor zover het betreft gegevens met
      betrekking tot het proces-verbaal en de kennisgeving van inbeslagneming, ten behoeve van een goede toepassing van
      het [Besluit inbeslaggenomen voorwerpen][ref25];

      n. benadeelden van strafbare feiten, waaronder begrepen de personen die in verband met die feiten in hun rechten
      zijn getreden of ingevolge enige wettelijke bepaling terzake van die rechten een recht van verhaal hebben gekregen,
      voor zover zij deze gegevens behoeven om in rechte voor hun belangen op te kunnen komen;

      o.

      p. Onze Minister van Justitie en Veiligheid, ten behoeve van de verzending van beschikkingen en transacties;

      q. de Dienst Terugkeer en Vertrek, voor zover het betreft gegevens over vreemdelingen die zijn
      verkregen in het kader van de uitoefening van het toezicht, bedoeld in de [artikelen 46][ref26] en
      [47 van de Vreemdelingenwet 2000][ref27], of de opsporing van strafbare feiten, ten behoeve van de begeleiding van
      de terugkeer of het vertrek uit Nederland van vreemdelingen die niet rechtmatig in Nederland verblijven.

      r. de Nederlandse Voedsel- en Warenautoriteit van Onze Minister van Economische Zaken, ten behoeve van het uitvoeren
      van de taak, bedoeld in [artikel 3.1, tweede lid, van de Uitvoeringsregeling rechtstreekse betalingen GLB][ref28];

      s. een verzekeringsmaatschappij, de korpschef of de Minister van Defensie, ten behoeve van de beoordeling van de
      wettelijke aansprakelijkheid van de politie of van de Minister van Defensie en de vaststelling van een verplichting
      tot schadeloosstelling van derden;

      t. het Nederlands Instituut voor Forensische Psychiatrie en Psychologie, ten behoeve van het opstellen van de
      rapportages pro justitia en de indicatieadvisering;

      u.

      v. het Centraal Orgaan opvang asielzoekers, ten behoeve van het uitvoeren van de taken, bedoeld in
      [artikel 3, eerste lid, onderdelen a en b, van de Wet Centraal Orgaan opvang asielzoekers][ref29];

      w. het Landelijk Bureau Inning Onderhoudsbijdragen, voor wat betreft gegevens over de
      verblijfplaats van een persoon, ten behoeve van de inning van bijdragen of uitkeringen, bedoeld in
      [artikel 2, derde lid, van de Wet Landelijk Bureau Inning Onderhoudsbijdragen][ref30];

      x. de Minister van Defensie, ten behoeve van het nemen van een beslissing over de ongeldigverklaring van een door
      die minister afgegeven militair rijbewijs of rijmachtiging;

      y. Onze Minister van Asiel en Migratie, ten behoeve van het verwerken van gegevens omtrent de identiteit van
      vreemdelingen in de Basisvoorziening Vreemdelingen en de verdere verstrekking van die gegevens aan instanties die
      zijn betrokken bij de uitvoering van de [Vreemdelingenwet 2000][ref31], ten behoeve van de vaststelling van de
      identiteit van vreemdelingen, en aan andere instanties met een publieke taak belast, ten behoeve van registratie,
      identificatie en verificatie van vreemdelingen, hun documenten of hun verblijfsrechtelijke positie;

      z. het agentschap Basisadministratie Persoonsgegevens en Reisdocumenten van Onze Minister van Binnenlandse Zaken
      en Koninkrijksrelaties met het oog op de weigering of vervallenverklaring van reisdocumenten zoals bedoeld in
      [artikel 24, onder b, van de Paspoortwet][ref32];

      aa. de inspecteur, bedoeld in [artikel 1:3, eerste lid, onderdeel c, van de Algemene douanewet][ref33], voor zover
      hij deze gegevens behoeft voor een goede uitvoering van de in die wet aan hem opgedragen taken;

      ab. de burgemeester ten behoeve van de uitoefening van de bevoegdheid, bedoeld in
      [artikel 151d, tweede lid, van de Gemeentewet][ref34], en de bestuursrechtelijke handhaving van die bevoegdheid,
      voor zover het gegevens betreft met betrekking tot gedragingen die in of vanuit de woning of het erf behorend bij
      die woning of in de onmiddellijke nabijheid van die woning of dat erf ernstige hinder voor omwonenden veroorzaken.

      2 Politiegegevens die worden verwerkt overeenkomstig de [artikelen 8][ref35] en [13, eerste lid, van de wet][ref36]
      kunnen, voor zover zij deze behoeven voor een goede uitvoering van hun taak, worden verstrekt aan ambtenaren die
      bij of krachtens de [wet][ref37] zijn belast met het houden van toezicht op de naleving van de bij ministeriële
      regeling aangewezen wetgeving, voor zover het betreft gegevens over de naleving van die wetgeving, en er tussen
      de verwerkingsverantwoordelijke en de betreffende ambtenaren afspraken zijn gemaakt over welke gegevens verstrekt
      worden, in welke gevallen en onder welke voorwaarden. De verwerkingsverantwoordelijke legt deze afspraken vast.

      3 Politiegegevens die worden verwerkt overeenkomstig de [artikelen 8][ref38] en [13, eerste lid, van de wet][ref39]
      kunnen, voor zover zij deze behoeven voor een goede uitvoering van hun taak, worden verstrekt aan de
      door Onze Minister van Sociale Zaken en Werkgelegenheid respectievelijk Onze Minister van Financiën
      aangewezen ambtenaren, die zijn belast met het toezicht op de naleving van het bepaalde bij of
      krachtens de [Wet arbeid vreemdelingen][ref40] respectievelijk de [Invorderingswet 1990][ref41], de
      [Algemene wet inzake rijksbelastingen][ref42] en de [Algemene douanewet][ref43] ten behoeve van de inschatting van
      de veiligheidsrisico’s met betrekking tot de uitoefening van vorenbedoeld toezicht.

      4 Politiegegevens die worden verwerkt overeenkomstig de [artikelen 8][ref44] en
      [13, eerste lid, van de wet][ref45], kunnen worden verstrekt aan het college van burgemeester en wethouders en de
      Minister van Binnenlandse Zaken en Koninkrijksrelaties, met het oog op signalering van veranderingen in de gegevens
      die in de basisregistratie personen zijn opgenomen.


