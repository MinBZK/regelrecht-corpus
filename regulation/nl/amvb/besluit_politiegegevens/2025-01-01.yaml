  - number: 5:4
    text: |-
      Indien politiegegevens worden ontvangen van een andere lidstaat van de Europese Unie ten aanzien van de verwerking
      waarvan door de bevoegde autoriteit van de doorzendende lidstaat op grond van het nationale recht specifieke
      voorwaarden zijn gesteld en de ontvangende autoriteit daarvan in kennis is gesteld, ziet de ontvangende bevoegde
      autoriteit in Nederland toe op de naleving van die voorwaarden.
    url: https://wetten.overheid.nl/BWBR0023086/2025-01-01#Artikel54
  - number: 5:5
    text: |-
      1 Doorzending van politiegegevens betreffende de voorkoming en opsporing van strafbare feiten, aan
      politieautoriteiten in een andere lidstaat van de Europese Unie kan rechtstreeks plaatsvinden door middel van de
      geautomatiseerde vergelijking van de categorieën van politiegegevens, bedoeld in het tweede lid.

      2 De vergelijking van gegevens, bedoeld in het eerste lid, vindt plaats in afzonderlijke gevallen en betreft
      dactyloscopische gegevens.

      3 Indien bij de gegevensvergelijking wordt vastgesteld dat gegevens overeenkomen dan worden
      uitsluitend de overeenkomende gegevens doorgezonden. Voor doorzending van nadere, met betrekking
      tot de overeenkomende gegevens beschikbare persoon- of zaaksgegevens is een verzoek, als bedoeld in
      [artikel 5.1.1 van het Wetboek van Strafvordering][ref1], vereist. De verdere verwerking van de doorgezonden
      politiegegevens is uitsluitend toegestaan met het oog op:

      a. de vaststelling of de vergeleken profielen overeenstemmen;

      b. de voorbereiding en indiening van een verzoek om rechtshulp;

      c. de protocollering van de gegevens.

      Na afloop van de gegevensvergelijking worden de doorgezonden gegevens onverwijld gewist, tenzij verdere verwerking
      noodzakelijk is ten behoeve van de doelen, als bedoeld in onderdeel b of c.

      4 De doorzending vindt uitsluitend plaats aan ambtenaren die werkzaam zijn bij daartoe aangewezen nationale
      politiële contactpunten en die zijn geautoriseerd voor de geautomatiseerde vergelijking van de politiegegevens.
      De lijst van ambtenaren, die zijn geautoriseerd tot de geautomatiseerde bevraging of vergelijking als bedoeld
      in het eerste lid, wordt desgevraagd ter beschikking gesteld aan de andere lidstaten en aan de Autoriteit
      persoonsgegevens.

      5 [Artikel 23, vierde lid, van de wet][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel5.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel23
