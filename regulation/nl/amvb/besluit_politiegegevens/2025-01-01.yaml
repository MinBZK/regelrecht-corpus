  - number: 3:2
    text: |-
      De categorieën van misdrijven, bedoeld in [artikel 10, eerste lid, onderdeel b, van de wet][ref1], die door hun
      omvang of ernst of hun samenhang met andere misdrijven een ernstig gevaar voor de rechtsorde opleveren, zijn:

      a. terroristische misdrijven als bedoeld in [artikel 83 van het Wetboek van Strafrecht][ref2];

      b. mensenhandel als bedoeld in [artikel 273f van het Wetboek van Strafrecht][ref3];

      c. mensensmokkel als bedoeld in [artikel 197a van het Wetboek van Strafrecht][ref4];

      d. de omkoping van een ambtenaar als bedoeld in de [artikelen 177, eerste lid][ref5] en
      [363, eerste lid][ref6], van een toekomstig ambtenaar als bedoeld in de artikelen 177, tweede lid en
      363, tweede lid, of van een voormalig ambtenaar als bedoeld in de [artikelen 178a, tweede lid][ref7] en
      [364a, tweede lid van het Wetboek van Strafrecht][ref8].


