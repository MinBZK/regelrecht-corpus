      Politiegegevens die worden verwerkt overeenkomstig de [artikelen 8][ref1], [9][ref2], [10][ref3] en
      [13 van de wet][ref4] kunnen, voor zover zij deze behoeven voor een goede uitvoering van hun taak, worden verstrekt
      aan:

      a. Onze Minister van Justitie en Veiligheid en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties,
      ten behoeve van het verrichten van dreiging- en risico-evaluaties en het vaststellen van bewakings- en
      beveiligingsopdrachten en adviezen door de evaluatiedriehoek, met het oog op het bewaken en beveiligen van
      personen, objecten en diensten;

      b. Onze Minister van Justitie en Veiligheid, ten behoeve van het nemen van een beslissing omtrent de toepassing van
      de [artikelen 2 tot en met 4 van de Tijdelijke wet bestuurlijke maatregelen terrorismebestrijding][ref5].


