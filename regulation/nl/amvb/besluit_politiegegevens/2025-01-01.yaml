    text: |-
      1 De doorzending van politiegegevens aan Europol vindt plaats door tussenkomst van een landelijke eenheid, bedoeld
      in [artikel 5:1, tweede lid][ref1].

      2 De doorzending van politiegegevens aan Europol kan worden geweigerd indien:

      a. wezenlijke nationale veiligheidsbelangen worden geschaad,

      b. het welslagen van lopende onderzoeken of de veiligheid van personen in gevaar wordt gebracht, of

      c. informatie wordt bekend gemaakt die betrekking heeft op specifieke inlichtingendiensten of -activiteiten op het
      gebied van de staatsveiligheid.

      3 [Artikel 2:13, tweede lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023086#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0023086#Artikel213
