  - number: 2:13
    text: |-
      1 Het ter beschikking stellen van politiegegevens kan alleen worden geweigerd of aan beperkende voorwaarden worden
      onderworpen in het geval:

      a. het gegevens betreft omtrent informanten of andere personen als bedoeld in
      [artikel 12, vijfde lid van de wet][ref1];

      b. gevaar voor leven of gezondheid van betrokkene of derden is te duchten;

      c. van een verwerking voor een intern integriteitonderzoek onder verantwoordelijkheid van de korpschef;

      d. van een verwerking door de rijksrecherche onder verantwoordelijkheid van het College van procureurs-generaal;

      e. het gegevens betreft die worden verwerkt op grond van [artikel 10, eerste lid, onderdeel b van de wet][ref2];

      f. van een verwerking voor een door het College van procureurs-generaal als embargo-onderzoek aangemerkt
      onderzoek met een zeer groot belang van afscherming vanwege afbreukrisico’s, levensbedreigende risico’s, politieke
      gevoeligheid of publiciteitsgevoeligheid van het onderzoek.

      2 De terbeschikkingstelling van persoonsgegevens, die worden verwerkt door de Financiële inlichtingen eenheid, kan
      gemotiveerd worden geweigerd tenzij:

      a. de terbeschikkingstelling van de gegevens plaatsvindt ten behoeve van verdere verwerking met het oog op het
      doel, bedoeld in [artikel 10, eerste lid, onderdeel a, van de wet][ref3];

      b. uit de gegevens zelf een redelijk vermoeden voortvloeit dat een bepaalde persoon een misdrijf heeft begaan;

      c. de terbeschikkingstelling van de gegevens plaatsvindt op grond van
      [artikel 16, eerste lid, onderdeel a, van de wet][ref4], en deze gegevens redelijkerwijs van belang kunnen zijn ter
      voorkoming of opsporing van misdrijven als bedoeld in [artikel 3:1][ref5].

      3 Op een daartoe strekkend verzoek door de Financiële inlichtingen eenheid ter beschikking gestelde
      persoonsgegevens worden slechts verwerkt voor een ander doel dan bedoeld in de [artikelen 8][ref6], [9][ref7],
      [10][ref8] of [13 van de wet][ref9] nadat daartoe toestemming is verleend door het hoofd van de Financiële
      inlichtingen eenheid.


