        artikel: 4a
  - number: 6:1b
    text: |-
      De inhoud van de overeenkomst of rechtshandeling, bedoeld in [artikel 6c, tweede lid, van de wet][ref1]
      bevat het onderwerp en de duur van de verwerking, de aard en het doel van de verwerking, het soort gegevens
      waarop de wet van toepassing is, de categorieën van betrokkenen en de verplichtingen en de rechten van de
      verwerkingsverantwoordelijke, en met name wordt daarin bepaald dat de verwerker:

      a. uitsluitend volgens de instructies van de verwerkingsverantwoordelijke handelt;

      b. er zorg voor draagt dat de tot het verwerken van politiegegevens gemachtigde personen zich ertoe hebben
      verplicht vertrouwelijkheid in acht te nemen of door een passende wettelijke verplichting daaraan gebonden zijn;

      c. de verwerkingsverantwoordelijke met passende middelen bijstaat om naleving van de bepalingen betreffende de
      rechten van de betrokkene te verzekeren;

      d. na afloop van de gegevensverwerkingsdiensten, naargelang de keuze van de verwerkingsverantwoordelijke, alle
      gegevens wist of hem deze ter beschikking stelt, en bestaande kopieën verwijdert, tenzij opslag van die gegevens
      verplicht is;

      e. de verwerkingsverantwoordelijke alle informatie ter beschikking stelt die nodig is om nakoming van in dit
      artikel gestelde voorschriften aan te tonen;

      f. aan de in dit artikel gestelde voorschriften voldoet bij de inschakeling van een andere verwerker en bij die
      inschakeling overeenkomstig [artikel 6c, vierde lid, van de wet][ref2], handelt.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel6c
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel6c
