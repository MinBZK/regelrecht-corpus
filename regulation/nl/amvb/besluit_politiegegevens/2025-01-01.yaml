  - number: 5:6
    text: |-
      1 Aan de politieambtenaar uit een andere lidstaat van de Europese Unie, die is toegevoegd aan een gemeenschappelijk
      onderzoeksteam als bedoeld in [artikel 5.2.1 van het Wetboek van Strafvordering][ref1] dat is gevestigd in
      Nederland, kunnen politiegegevens worden doorgezonden op gelijke voet als aan Nederlandse politieambtenaren, voor
      zover zij deze behoeven voor de doeleinden waarvoor het gemeenschappelijke onderzoeksteam is ingesteld.

      2 Aan de Nederlandse politieambtenaar die is toegevoegd aan een gemeenschappelijk onderzoeksteam als bedoeld in
      [artikel 5.2.1 van het Wetboek van Strafvordering][ref2] dat is gevestigd in een andere lidstaat van de Europese
      Unie, kunnen politiegegevens worden doorgezonden met het oog op de gebruikmaking daarvan voor de doeleinden
      waarvoor het gemeenschappelijke onderzoeksteam is ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel5.2.1
