      b. de ambtenaren van Onze Minister van Buitenlandse Zaken, ten behoeve van het doel, bedoeld in
      [artikel 4:1, eerste lid, onderdeel c][ref7];

      c. de personen, werkzaam bij de Financiële inlichtingen eenheid, ten behoeve van de taak van het meldpunt,
      bedoeld in [artikel 13 van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref8] en
      [artikel 3.2 van de Wet ter voorkoming van witwassen en financieren van terrorisme BES][ref9];

      d. de ambtenaren die werkzaam zijn bij de nationale politiële contactpunten, bedoeld in
      [artikel 5:3, vierde lid][ref10];

      e. de ambtenaren, werkzaam bij de Passagiersinformatie-eenheid, bedoeld in
      __REF000___________________________________________________________________________________________________________
