      f. de ambtenaren van Onze Minister van Justitie en Veiligheid, ten behoeve van het doel, bedoeld
      in [artikel 4:3, eerste lid, onderdeel a, onder 4°][ref12], voor functies aangewezen op grond van
      [artikel 35a, eerste lid, van de Wet justitiële en strafvorderlijke gegevens][ref13];

      g. de functionarissen van de Dienst Justitiële Inrichtingen van het ministerie van Justitie en Veiligheid, ten
