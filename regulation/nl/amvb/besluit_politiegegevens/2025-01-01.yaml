  - number: 6:1a
    text: |-
      1 De verwerkingsverantwoordelijke evalueert en actualiseert de maatregelen, bedoeld in
      [artikel 4a, eerste lid, onderdeel a, van de wet][ref1].

      2 Wanneer zulks in verhouding staat tot de verwerkingsactiviteiten omvatten de maatregelen, bedoeld in het eerste
      lid, de uitvoering van een passend gegevensbeschermingsbeleid door de verwerkingsverantwoordelijke.

      3 De verwerkingsverantwoordelijke of de verwerker treft, na beoordeling van de risico’s, maatregelen om:

      a. te verhinderen dat onbevoegden toegang krijgen tot apparatuur voor de verwerking van persoonsgegevens;

      b. te verhinderen dat onbevoegden gegevensdragers lezen, kopiëren, wijzigen of verwijderen;

      c. te verhinderen dat onbevoegden gegevens invoeren of opgeslagen persoonsgegevens inzien, wijzigen of verwijderen;

      d. te verhinderen dat onbevoegden systemen voor geautomatiseerde gegevensverwerking gebruiken met behulp van
      datatransmissieapparatuur;

      e. ervoor te zorgen dat personen die geautoriseerd zijn om een systeem voor geautomatiseerde gegevensverwerking te
      gebruiken, uitsluitend toegang hebben tot de gegevens waarop hun autorisatie betrekking heeft;

      f. ervoor te zorgen dat kan worden nagegaan en vastgesteld aan welke organen persoonsgegevens zijn of kunnen worden
      verstrekt of beschikbaar gesteld met behulp van datatransmissieapparatuur;

      g. ervoor te zorgen dat later kan worden nagegaan en vastgesteld welke persoonsgegevens wanneer en door wie in een
      systeem voor geautomatiseerde gegevensverwerking zijn ingevoerd;

      h. te verhinderen dat onbevoegden persoonsgegevens lezen, kopiëren, wijzigen of verwijderen tijdens de doorgifte
      van persoonsgegevens of het vervoer van gegevensdragers;

      i. ervoor te zorgen dat de geïnstalleerde systemen in geval van storing opnieuw kunnen worden ingezet;

      j. ervoor te zorgen dat de functies van het systeem werken, dat eventuele functionele storingen worden gesignaleerd
      en dat opgeslagen persoonsgegevens niet kunnen worden beschadigd door het verkeerd functioneren van het systeem.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel4a
    url: https://wetten.overheid.nl/BWBR0023086/2025-01-01#Artikel61a
    references:
