  - number: 6a:4
    text: |-
      In afwijking van [artikel 3:2][ref1] zijn de categorieën van misdrijven, bedoeld in
      [artikel 10, eerste lid, onderdeel b, van de wet][ref2], die door hun omvang of ernst of hun samenhang met andere
      misdrijven een ernstig gevaar voor de rechtsorde opleveren:

      a. terroristische misdrijven als bedoeld in [artikel 84a van het Wetboek van Strafrecht BES][ref3];

      b. mensenhandel als bedoeld in [artikel 286f van het Wetboek van Strafrecht BES][ref4];

      c. mensensmokkel als bedoeld in [artikel 203a van het Wetboek van Strafrecht BES][ref5];

      d. de omkoping van een ambtenaar als bedoeld in de [artikelen 183, eerste lid][ref6], [183a eerste lid][ref7],
      [378, eerste lid][ref8], en [379, eerste lid][ref9], van een toekomstig ambtenaar als bedoeld in
      de [artikelen 183, tweede lid][ref10], [183a, tweede lid][ref11], [378, tweede lid][ref12], en
      [379, tweede lid][ref13], of van een voormalig ambtenaar als bedoeld in de [artikelen 184a, tweede lid][ref14], en
      [380a, tweede lid, van het Wetboek van Strafrecht BES][ref15].


