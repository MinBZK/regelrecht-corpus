      1 Aan de volgende daartoe bepaald aangewezen personen kunnen op grond van
      [artikel 23, tweede lid, van de wet][ref1], rechtstreeks politiegegevens, die worden verwerkt op grond van de
      [artikelen 8][ref2], [9][ref3] of [10, eerste lid, onderdelen a en c][ref4], en [13 van de wet][ref5] worden
