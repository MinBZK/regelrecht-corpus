    text: |-
      1 Bij het Meldpunt Ongebruikelijke Transacties worden persoonsgegevens verwerkt over de volgende categorieën van
      personen:

      a. personen ten aanzien van wie een melding heeft plaatsgevonden van een verrichte of voorgenomen ongebruikelijke
      transactie;

      b. personen die als opdrachtgever, begeleider, tussenpersoon, begunstigde of lastgever betrokken zijn bij een
      verrichte of voorgenomen ongebruikelijke transactie;

      c. personen, ten aanzien van wie een redelijk vermoeden bestaat van het plegen van een misdrijf en personen die
      zijn veroordeeld terzake van het plegen van een misdrijf, indien noodzakelijk voor het doel van het meldpunt
      ongebruikelijke transacties;

      d. personen, die betrokken zijn bij een verrichte of voorgenomen financiële transactie, ten aanzien waarvan
      een melding heeft plaatsgevonden op grond van de [Wet melding ongebruikelijke transacties BES][ref1] of bij een
      meldpunt in een land binnen het Koninkrijk of in een ander land;

      e. personen, die betrokken zijn bij een verdachte transactie;

      f. personen, die werkzaam zijn bij het meldpunt ongebruikelijke transacties, bij de politie, bij justitie, bij
      een instantie belast met het toezicht op de personen en instellingen die onder de wettelijke meldplicht vallen dan
      wel met enige publiekrechtelijke taak, bij een instelling of bij een buitenlands meldpunt, die als contactpersoon
      optreden voor wat betreft de verstrekking van gegevens door of aan het meldpunt;

      g. personen, ten aanzien van wie een voor het doel van het meldpunt relevante relatie met een gemelde
      ongebruikelijke transactie bekend is geworden of vermoedelijk bekend zal worden, en deze relatie een andere is dan
      die bedoeld in de voorgaande onderdelen.

      2 De gegevens, bedoeld in het eerste lid, worden verwijderd zodra zij niet langer noodzakelijk zijn voor het doel
      van de verwerking. De gegevens worden vernietigd uiterlijk vijf jaar na de datum van laatste opneming.


      [ref1]: https://wetten.overheid.nl/BWBR0028598
    url: https://wetten.overheid.nl/BWBR0023086/2011-09-21#Artikel66
