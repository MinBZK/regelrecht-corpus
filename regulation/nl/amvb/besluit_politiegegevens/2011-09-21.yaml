      1 Voor een mededeling als bedoeld in [artikel 25, eerste lid, van de wet][ref1], kan de verantwoordelijke ter
      vergoeding van kosten een bedrag van ten hoogste € 4,50 in rekening brengen aan betrokkene.

      2 De betaling van de geldsom geschiedt door betaling met een wettig betaalmiddel of op enige andere door de
      verantwoordelijke toegestane wijze van betaling.

      3 Bij regeling van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties en Onze Minister van Defensie kan
      het bedrag, bedoeld in het eerste lid, jaarlijks worden aangepast.


