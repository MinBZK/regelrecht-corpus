      1 Twee jaren na inwerkingtreding van de [wet][ref1], en vervolgens eenmaal in de vier jaren, laat de
      verantwoordelijke de uitvoering van de bij of krachtens de [wet][ref2] gegeven regels door een privacy audit
      controleren, op bij regeling van Onze Ministers te bepalen wijze.

      2 De controle heeft betrekking op de wijze waarop het verwerken van politiegegevens is georganiseerd, de
      maatregelen en procedures die daarop van toepassing zijn en de werking van deze maatregelen en procedures.

      3 Een onafhankelijke auditor die voldoet aan de bij regeling van Onze Ministers te stellen eisen van werkwijze,
      deskundigheid en betrouwbaarheid voert de controle uit.

      4 De hercontrole, bedoeld in [artikel 33, derde lid, van de wet][ref3], vindt plaats op bij regeling van Onze
      Ministers te bepalen wijze.

      5 Bij regeling van Onze Ministers kan bepaald worden dat ter voorbereiding op de controle, bedoeld in het eerste
      lid, interne audits plaatsvinden en kunnen regels worden gesteld over de wijze waarop deze audits worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0022463
