  - number: 2:9
    text: |-
      De verantwoordelijke draagt er zorg voor dat de ambtenaren van politie, bedoeld in de
      [artikelen 2:1 tot en met 2:5][ref1], beschikken over voldoende kennis en vaardigheden op het gebied van:

      a. het informatieproces binnen de politie, meer in het bijzonder de verschillende vormen van verwerking van
      politiegegevens,

      b. de wet- en regelgeving die relevant is voor de verwerking van politiegegevens, en

      c. methoden en technieken van informatieanalyse.

      De eisen inzake kennis en vaardigheden verschillen naar gelang van de aard van de verwerking waartoe de ambtenaar
      wordt geautoriseerd. Indien noodzakelijk kunnen deze eisen bij regeling van Onze Ministers worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0023086#Artikel21
