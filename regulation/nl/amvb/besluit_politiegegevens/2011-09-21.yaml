    text: |-
      1 Verstrekking van politiegegevens betreffende de voorkoming en opsporing van strafbare feiten, aan
      politieautoriteiten in een andere lidstaat van de Europese Unie kan rechtstreeks plaatsvinden door middel van de
      geautomatiseerde vergelijking van de categorieën van politiegegevens, bedoeld in het tweede lid.

      2 De vergelijking van gegevens, bedoeld in het eerste lid, vindt plaats in afzonderlijke gevallen en betreft
      dactyloscopische gegevens.

      3 Indien bij de gegevensvergelijking wordt vastgesteld dat gegevens overeenkomen dan worden
      uitsluitend de overeenkomende gegevens verstrekt. Voor verstrekking van nadere, met betrekking tot
      de overeenkomende gegevens beschikbare persoon- of zaaksgegevens is een verzoek, als bedoeld in
      [artikel 552h van het Wetboek van Strafvordering][ref1], vereist. De verdere verwerking van de verstrekte
      politiegegevens is uitsluitend toegestaan met het oog op:

      a. de vaststelling of de vergeleken profielen overeenstemmen;

      b. de voorbereiding en indiening van een verzoek om rechtshulp;

      c. de protocollering van de gegevens.

      Na afloop van de gegevensvergelijking worden de verstrekte gegevens onverwijld gewist, tenzij verdere verwerking
      noodzakelijk is ten behoeve van de doelen, als bedoeld in onderdeel b of c.

      4 De verstrekking vindt uitsluitend plaats aan ambtenaren die werkzaam zijn bij daartoe aangewezen nationale
      politiële contactpunten en die zijn geautoriseerd voor de geautomatiseerde vergelijking van de politiegegevens.
      De lijst van ambtenaren, die zijn geautoriseerd tot de geautomatiseerde bevraging of vergelijking als bedoeld in
      het eerste lid, wordt desgevraagd ter beschikking gesteld aan de andere lidstaten en aan het College bescherming
      persoonsgegevens.

      5 [Artikel 23, derde lid, van de wet][ref2] is van overeenkomstige toepassing.

      6 Het bepaalde in [artikel 5:1, zevende lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel552h
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0023086#Artikel51
