    text: |-
      Aan de volgende daartoe bepaald aangewezen personen kunnen op grond van [artikel 23, tweede lid, van de wet][ref1],
      rechtstreeks politiegegevens, die worden verwerkt op grond van de [artikelen 8][ref2], [9][ref3] of
      [10, eerste lid, onderdelen a en c][ref4], en [13 van de wet][ref5] worden verstrekt, voor zover zij deze behoeven
      voor de volgende doeleinden:

      a. de ambtenaren van de Immigratie- en Naturalisatiedienst, ten behoeve van het doel, bedoeld in
      [artikel 4:1, eerste lid, onderdeel a][ref6];

      b. de ambtenaren van Onze Minister van Buitenlandse Zaken, ten behoeve van het doel, bedoeld in
      [artikel 4:1, eerste lid, onderdeel c][ref7];

      c. de personen, werkzaam bij het Meldpunt Ongebruikelijke Transacties, ten behoeve van de taak van het meldpunt,
      bedoeld in [artikel 13 van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref8];

      d. de ambtenaren die werkzaam zijn bij de nationale politiële contactpunten, bedoeld in
      [artikel 5:3, vierde lid][ref9].


