  - number: 6a:7
    text: |-
      1 Politiegegevens die worden verwerkt overeenkomstig de [artikelen 8][ref1], [9][ref2],
      [10, eerste lid, onderdelen a en c][ref3] juncto [artikel 36c, eerste lid, onder c][ref4], en [13 van de wet][ref5]
      kunnen worden verstrekt aan leden van het openbaar ministerie met het oog op het verder verstrekken aan het
      openbaar ministerie in het Europese deel van Nederland ten behoeve van de adviserende taak van laatstbedoeld
      openbaar ministerie in het kader van de uitvoering van de wetten, genoemd in [artikel 4:3, tweede lid][ref6], en,
      door tussenkomst van dat openbaar ministerie in het kader van vorenbedoelde taak, verder worden verstrekt aan:

      a. de Nederlandsche Bank, ten behoeve van de uitoefening van de taken, genoemd in
      [artikel 4:3, tweede lid, onderdeel a][ref7];

      b. Onze Minister van Financiën ten behoeve van de uitoefening van de taken, genoemd in
      [artikel 4:3, tweede lid, onderdeel b][ref8];

      c. de Autoriteit Financiële Markten, ten behoeve van de taken, genoemd in
      [artikel 4:3, tweede lid, onderdeel c][ref9].

      2 [Artikel 6a:6, derde en vierde lid][ref10], is van toepassing.


