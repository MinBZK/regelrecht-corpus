    text: |-
      1 Voor de toepassing van:

      a. [artikel 2:4, eerste lid][ref1], wordt in plaats van «de ambtenaren van politie die werkzaam zijn bij
      een daartoe ingerichte eenheid die specifiek is belast met de verwerking van politiegegevens als bedoeld in
      [artikel 10, eerste lid, onderdeel b, van de wet][ref2]» gelezen: de daartoe door de verantwoordelijke aangewezen
      ambtenaren van politie;

      b. [artikel 2:5, eerste lid][ref3], wordt in plaats van «de ambtenaren van politie die zijn belast met de
      verwerking van politiegegevens als bedoeld in [artikel 10, eerste lid, onderdeel a, van de wet][ref4]» gelezen: de
      daartoe door de verantwoordelijke aangewezen ambtenaren van politie;

      c. [artikel 2:5, tweede lid][ref5], wordt in plaats van «de ambtenaren van politie die zijn belast met de
      verwerking van politiegegevens als bedoeld in [artikel 10, eerste lid, onderdeel c, van de wet][ref6]» gelezen: de
      daartoe door de verantwoordelijke aangewezen ambtenaren van politie;

      d. [artikel 2:7, eerste lid][ref7], wordt in plaats van
      «[artikel 14, eerste lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref8]» gelezen:
      [artikel 3, eerste lid, van de Wet melding ongebruikelijke transacties BES][ref9];

      e. [artikel 2:8][ref10] wordt in plaats van «kunnen worden geautoriseerd de ambtenaren van politie die
      werkzaam zijn bij een eenheid die met de uitvoering van deze taak is belast» gelezen: kunnen daartoe door de
      verantwoordelijke aangewezen ambtenaren van politie worden belast;

      f. [artikel 2:10, tweede lid][ref11], wordt in plaats van «het hoofd van de betreffende eenheid die is belast met
      de verwerking van politiegegevens, bedoeld in [artikel 10, eerste lid, onderdelen a, b of c, van de wet][ref12],
      dan wel het hoofd van een eenheid met een vergelijkbare taak of hun plaatsvervanger» gelezen: de ambtenaren van
      politie die daartoe door de verantwoordelijke zijn aangewezen.

      g. [artikel 2:13, eerste lid, onder d][ref13], wordt in plaats van «rijksrecherche» gelezen «recherche» en in
      plaats van «het College van procureurs-generaal» gelezen: de procureur-generaal;

      h. [artikel 2:13, eerste lid, onder f][ref14], wordt in plaats van «het College van procureurs-generaal» gelezen:
      de procureur-generaal;

      i. [artikel 2:13, tweede lid][ref15], wordt in plaats van «De terbeschikkingstelling van persoonsgegevens,
      die worden verwerkt door het Meldpunt Ongebruikelijke Transacties, kan worden geweigerd» gelezen: Onverminderd
      [artikel 6 van de Wet melding ongebruikelijke transacties BES][ref16], kan de terbeschikkingstelling van
      persoonsgegevens, die worden verwerkt door het Meldpunt Ongebruikelijke Transacties, worden geweigerd;

      j. [artikel 2:13, tweede lid, onderdeel c][ref17], wordt in plaats van
      «[artikel 16, eerste lid, onderdeel c][ref18]» gelezen «[artikel 36d, eerste lid, onderdeel a][ref19]» en in plaats
      van «[artikel 3:1][ref20]» gelezen: [artikel 6a:3][ref21].;

      k. [artikel 4:1, eerste lid, onderdeel b][ref22], wordt in plaats
      van «[artikel 1, onderdeel h, van de Luchtvaartwet][ref23]» gelezen
      «[artikel 1, eerste lid, onderdeel i van de Luchtvaartwet BES][ref24]» en wordt in plaats van «[Opiumwet][ref25]»
      gelezen: [Opiumwet 1960 BES][ref26];

      l. [artikel 4:6, onder c][ref27], wordt in plaats van «bedoeld in
      [artikel 13 van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref28]» gelezen: bedoeld in
      [artikel 3, eerste lid, van de Wet melding ongebruikelijke transacties BES][ref29];

      m. [artikel 4:7, eerste lid, onder b][ref30], wordt in plaats van «de burgemeester» telkens gelezen: de
      gezaghebber;

      n. [artikel 5:1, eerste lid, aanhef][ref31], wordt in plaats van «in een land binnen het Koninkrijk, in een ander
      land of in de openbare lichamen Bonaire, Sint Eustatius en Saba» gelezen «in een land binnen het Koninkrijk of in
      een ander land' en wordt in plaats van «het Europese deel van Nederland» gelezen «de openbare lichamen Bonaire,
      Sint Eustatius en Saba» en wordt in plaats van «land dan wel het openbare lichaam» gelezen: land;

      o. [artikel 5:1, eerste lid, onder c][ref32], wordt in plaats van
      «[artikel 1, onderdeel g, van de Politiewet 1993][ref33]» gelezen:
      __REF002___________________________________________________________________________________________________________
      _______________________;

      p. [artikel 5:1, tweede lid][ref35], wordt in plaats van «dat land of de openbare lichamen» gelezen: dat land.

      q. [artikel 5:1, derde lid][ref36], wordt in plaats van «het Korps landelijke politiediensten» gelezen «de officier
      van justitie» en vervalt de tweede zin;

      r. [artikel 5:1, zesde lid][ref37], wordt in plaats van «burgemeester» gelezen: gezaghebber.

      s. [artikel 5:1, zevende lid][ref38], wordt in plaats van «van een land binnen het Koninkrijk, van een ander land
      of van de openbare lichamen Bonaire, Sint Eustatius en Saba» gelezen: van een ander land.

      t. [artikel 5:1, achtste lid][ref39], wordt in plaats van «in de openbare lichamen Bonaire, Sint Eustatius en Saba
      of in een land binnen het Koninkrijk of in een ander land» gelezen: in een land binnen het Koninkrijk of in een
      ander land.

      u. [artikel 6:3, eerste lid][ref40], wordt in plaats van «€ 4,50» gelezen: USD 5;

      v. [artikel 6:4, vierde en vijfde lid][ref41], wordt telkens na «[paragraaf 3][ref42]» ingevoegd: en
      [artikel 36d][ref43].

      w. [artikel 6:4, zesde lid][ref44], wordt in plaats van «[artikel 16, eerste lid, onderdeel c][ref45],» gelezen:
      [artikel 36d, eerste lid, onderdeel a][ref46],;

      x. [artikel 6:6, eerste lid, onderdeel d][ref47], wordt in plaats van «op grond van
