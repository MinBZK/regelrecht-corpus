  - number: 2:11
    text: |-
      Indien bij de gegevensvergelijking, bedoeld in [artikel 11 van de wet][ref1], gegevens overeenkomen, worden de
      verbanden op de volgende wijze zichtbaar gemaakt:

      a. bij gegevens, voorzien van een codering als bedoeld in [artikel 2:12, onderdeel a][ref2], en bij gegevens als
      bedoeld in [artikel 8 van de wet][ref3], zijn de gerelateerde gegevens zichtbaar;

      b. bij gegevens, als bedoeld in de [artikelen 9][ref4] en [10, eerste lid, onderdelen a en c van de wet][ref5],
      zijn de overeenkomende gegevens zichtbaar en zijn de andere gerelateerde gegevens na instemming van de daartoe
      bevoegde functionaris zichtbaar;

      c. bij gegevens, voorzien van een code als bedoeld in het [artikel 2:12, onderdeel b][ref6], zijn de overeenkomende
      gegevens gedeeltelijk zichtbaar en de andere gerelateerde gegevens na instemming van de daartoe bevoegde
      functionaris zichtbaar;

      d. bij gegevens, voorzien van een code als bedoeld in het [artikel 2:12, onderdeel c][ref7], en bij gegevens als
      bedoeld in [artikel 10, eerste lid, onderdeel b van de wet][ref8], zijn de overeenkomende gegevens niet zichtbaar.


