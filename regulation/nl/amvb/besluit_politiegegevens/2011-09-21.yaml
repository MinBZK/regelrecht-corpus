    text: |-
      1 De schriftelijke vastlegging van het doel van het onderzoek, bedoeld in
      [artikel 9, tweede lid, van de wet][ref1], omvat een omschrijving van het onderwerp waar het onderzoek op is
      gericht en op welk deel van de uitoefening van de politietaak het onderzoek betrekking heeft.

      2 Indien politiegegevens geautomatiseerd worden vergeleken met andere gegevens of in combinatie met elkaar worden
      verwerkt, als bedoeld in [artikel 11, eerste, tweede, vierde en vijfde lid van de wet][ref2], worden van die
      verwerking de volgende gegevens vastgelegd:

      a. de gegevens die voor de rechtstreekse raadpleging zijn gebruikt;

      b. de identiteit of het kenmerk van de politieambtenaar die de rechtstreekse raadpleging heeft uitgevoerd;

      c. de gegevens op grond waarvan kan worden nagegaan welke gegevens ter beschikking zijn gesteld voor verdere
      verwerking voor een doel, als bedoeld in [artikel 9][ref3] of [10 van de wet][ref4];

      3 Het bepaalde in het tweede lid is van overeenkomstige toepassing indien politiegegevens ter beschikking
      worden gesteld voor hernieuwde verwerking op grond van [artikel 9][ref5] of [10 van de wet][ref6], bedoeld in
      [artikel 14, derde lid, van de wet][ref7].

      4 Indien politiegegevens op grond van [paragraaf 3 van de wet][ref8] worden verstrekt, worden van die verstrekking
      de volgende gegevens vastgelegd:

      a. de identiteit van de verzoeker;

      b. de datum van de verstrekking;

      c. een omschrijving van de verstrekte gegevens;

      d. het doel van de verstrekking.

      5 Indien politiegegevens op grond van [paragraaf 3 van de wet][ref9] rechtstreeks langs geautomatiseerde weg, als
      bedoeld in [artikel 23, tweede lid, van de wet][ref10] worden verstrekt, worden van die verstrekking de volgende
      gegevens vastgelegd:

      a. een uniek kenmerk van de verzoeker;

      b. de gegevens die ten behoeve van de gegevensvergelijking door de verzoeker zijn ingebracht;

      c. de gegevens op grond waarvan kan worden nagegaan welke gegevens naar aanleiding van de gegevensvergelijking zijn
      verstrekt inclusief de mededeling van het niet voorhanden zijn van een gegeven;

      d. de datum en het tijdstip van de verstrekking.

      6 De verplichtingen van het vierde en vijfde lid zijn niet van toepassing op de verstrekking van gegevens op grond
      van [artikel 16, eerste lid, onderdeel c, van de wet][ref11].


