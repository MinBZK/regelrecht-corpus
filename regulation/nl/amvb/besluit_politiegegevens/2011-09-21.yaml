  - number: 4:3
    text: |-
      1 Politiegegevens die worden verwerkt overeenkomstig de [artikelen 8][ref1], [9][ref2],
      [10, eerste lid, onderdelen a en c][ref3] en [13 van de wet][ref4] kunnen, voor zover zij deze behoeven voor een
      goede uitvoering van hun taak, worden verstrekt aan:

      a. Onze Minister van Justitie, ten behoeve van:

        - de controle van rechtspersonen met het oog op de voorkoming en bestrijding van misbruik van rechtspersonen,
      waaronder het plegen van misdrijven en overtredingen van financieel-economische aard door of door middel van deze
      rechtspersonen, bedoeld in [artikel 2, eerste lid, van de Wet controle op rechtspersonen][ref5];
        - de uitvoering van [artikel 5, eerste lid, van de Gratiewet][ref6];
        - de beoordeling van de benoeming, de herbenoeming of het ontslag van de leden van de commissies van toezicht bij
      de inrichtingen, bedoeld in onderdeel d;
        - het afgeven van een verklaring omtrent het gedrag, bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref7];
        - de taakuitvoering van het Meldpunt Ongebruikelijke Transacties;
        - de tenuitvoerlegging van een maatregel als bedoeld in
      [artikel 36e, eerste lid, van het Wetboek van Strafrecht][ref8], door het Centraal Justitieel Incassobureau.

      b. de burgemeester ten behoeve van de beoordeling van een verzoek tot het verkrijgen van het Nederlanderschap op
      grond van de [Rijkswet op het Nederlanderschap][ref9];

      c. de directeuren van inrichtingen, bedoeld in
      [artikel 1, onderdeel b, van de Penitentiaire beginselenwet][ref10], van de inrichtingen, bedoeld in
      [artikel 1, onderdeel b, van de Beginselenwet verpleging ter beschikking gestelden en van de inrichtingen][ref11],
      bedoeld in [artikel 1, onderdeel b, van de Beginselenwet justitiële jeugdinrichtingen][ref12], en functionarissen
      van de Dienst Justitiële inrichtingen van het Ministerie van Justitie, ten behoeve van:

      1. het nemen van beslissingen over hetzij de aanstelling of het ontslag van personeel, hetzij de toelating tot de
      inrichting van personen die niet worden ingesloten in de inrichting, voor zover dat noodzakelijk is voor de orde of
      veiligheid in de inrichting respectievelijk de voorziening;

      2. het nemen van beslissingen over het verlaten van de inrichting bij wijze van verlof;

      3. het nemen van beslissingen over de erkenning van een penitentiair programma, bedoeld in
      [artikel 4, eerste lid, van de Penitentiaire beginselenwet][ref13], of een scholing- en trainingprogramma, bedoeld
      in [artikel 3, eerste lid, van de Beginselenwet justitiële inrichtingen][ref14];

      4. het treffen van maatregelen met betrekking tot de voorkoming van strafbare feiten door of met betrekking
      tot gedetineerden, de handhaving van de orde en veiligheid in de justitiële inrichting, of de ongestoorde
      tenuitvoerlegging van de vrijheidsbeneming.

      d. de commandant van de Koninklijke marechaussee, ten behoeve van de uitoefening van de bevoegdheid, bedoeld in
      [artikel 37s van de Luchtvaartwet][ref15];

      e. de korpschef van een regionaal politiekorps, ten behoeve van zijn adviserende taak in het kader van de
      uitvoering van [artikel 3B.1 van het Vuurwerkbesluit][ref16];

      f. het bevoegde gezag, bedoeld in
      [artikel 1, eerste lid, onderdeel l, van het Besluit algemene rechtspositie politie][ref17] en het bevoegde
      gezag, bedoeld in [artikel 1, eerste lid, onderdeel e, van het Besluit rechtspositie vrijwillige politie][ref18],
      ten behoeve van het verrichten van een onderzoek als bedoeld in [artikel 8a, eerste lid][ref19], en
      [artikel 8b, eerste lid, van het Besluit algemene rechtspositie politie][ref20] en [artikel 4a, eerste lid][ref21],
      en [artikel 4b, eerste lid, van het Besluit rechtspositie vrijwillige politie][ref22], of voor het
      verrichten van een onderzoek naar de betrouwbaarheid en geschiktheid ten aanzien van personen die
      anderszins werkzaamheden verrichten voor een politiekorps, een voorziening tot samenwerking als bedoeld in
      [artikel 1, eerste lid, onderdeel g, van het Besluit algemene rechtspositie politie][ref23], het Landelijk
      selectie- en opleidingsinstituut politie, het Politie onderwijs- en kenniscentrum of de rijksrecherche en waarvoor
      de gezagdragende instanties justitiële gegevens als bedoeld in het [Besluit justitiële gegevens][ref24] vragen;

      g. het Bureau bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref25], ten behoeve van de
      uitoefening van de in [die wet][ref26] aan het bureau opgedragen taak;

      h. de Immigratie- en Naturalisatiedienst, ten behoeve van het nemen van beslissingen omtrent de toelating,
      het verblijf of de ongewenstverklaring, als bedoeld in de [Vreemdelingenwet 2000][ref27], de Rijkswet op het
      Nederlanderschap of een verdrag dan wel een voor Nederland bindend besluit van een volkenrechtelijke organisatie,
      als bedoeld in [artikel 112 van de Vreemdelingenwet 2000][ref28];

      i. de burgemeester en de commissaris van de Koning, ten behoeve van hun adviserende taak, bedoeld in het
      [Reglement op de Orde van de Nederlandse Leeuw en de Orde van Oranje-Nassau][ref29] en Onze Minister van Defensie
      met het oog op de toekenning van bij koninklijk besluit te verlenen onderscheidingen;

      j. gedragsdeskundigen, voor zover het betreft auditieve of audiovisuele registraties van het verhoor van een
      persoon naar aanleiding van een ernstig strafbaar feit, voor het beoordelen van het verhoor en het opstellen van
      een deskundigenrapportage ten behoeve van het strafrechtelijk onderzoek, het gerechtelijk vooronderzoek of het
      onderzoek ter terechtzitting;

      k. Onze Minister van Defensie en de onder hem ressorterende bevelvoerende militairen van een oorlogsschip,
      inrichting van de zeemacht, compagnie, eskadron, batterij of squadron of een hogere eenheid, voor zover het betreft
      gegevens omtrent:

      1°. de toepassing van vrijheidsbenemende dwangmiddelen jegens een militair, ten behoeve van het nemen van
      maatregelen met betrekking tot de operationele gereedheid van de eenheid; of

      2°. de betrokkenheid van een militair bij de verdenking van een overtreding van de [Opiumwet][ref30] of een
      misdrijf, ten behoeve van het nemen van besluiten inzake schorsing of ontslag van militaire ambtenaren, als bedoeld
      in [artikel 12 van de Militaire Ambtenarenwet 1931][ref31].

      2 Politiegegevens, als bedoeld in het eerste lid kunnen, door tussenkomst van het openbaar ministerie, worden
      verstrekt aan de hierna te noemen personen of instanties:

      a. De Nederlandsche Bank N.V., ten behoeve van:

      1°. het verkrijgen van inzicht in de voornemens, handelingen en antecedenten, bedoeld
      in [artikel 5 van het Besluit prudentiële regels Wft][ref32], ter vaststelling van de
      betrouwbaarheid van een persoon als bedoeld in de [artikelen 3:9, eerste lid][ref33], en
      [3:99, eerste lid, van de Wet op het financieel toezicht][ref34] en ter beoordeling van de
      integere bedrijfsuitoefening onderscheidenlijk de integere bedrijfsvoering, bedoeld in de
      [artikelen 3:10, eerste lid][ref35], en [3:17, eerste lid, van die wet][ref36];

      2°. het verkrijgen van inzicht in de voornemens, handelingen en antecedenten, bedoeld in artikel 2, eerste lid, van
      de Beleidsregel inzake de betrouwbaarheid van (kandidaat)(mede)beleidsbepalers van en houders van gekwalificeerde
      deelnemingen in onder toezicht staande instellingen (Stcrt. 2005, 20), ter vaststelling van de betrouwbaarheid van
      een persoon als bedoeld in [artikel 3, eerste lid, onderdelen a, b en c, van de Wet toezicht trustkantoren][ref37]
      en ter beoordeling van de integere bedrijfsvoering, bedoeld in de artikelen 3, eerste lid, onderdeel f, en
      [10, eerste lid, van die wet][ref38];

      3°. het verkrijgen van inzicht in de voornemens, handelingen en antecedenten, bedoeld in
      [artikel 31 van het Besluit uitvoering Pensioenwet en Wet verplichte beroepspensioenregeling][ref39],
      ter vaststelling van de betrouwbaarheid van een persoon als
      bedoeld in [artikel 105, vijfde lid, van de Pensioenwet][ref40] en
      [artikel 110, vijfde lid, van de Wet verplichte beroepspensioenregeling][ref41] en ter beoordeling van de
      beheerste en integere bedrijfsvoering, bedoeld in [artikel 143, eerste lid, van de Pensioenwet][ref42] en
      [artikel 138, eerste lid, van de Wet verplichte beroepspensioenregeling][ref43];

      b. Onze Minister van Financiën, ten behoeve van het verkrijgen van inzicht in de voornemens, handelingen
      en antecedenten, bedoeld in artikel 2 van de Beleidsregel inzake de betrouwbaarheid van (kandidaat)
      (mede)beleidsbepalers van en houders van gekwalificeerde deelnemingen in onder toezicht staande
      instellingen (Stcrt. 2005, 20), ter vaststelling van de betrouwbaarheid van een persoon als bedoeld in
      [artikelen 2, tweede lid, onderdelen a, b, c of d, van de Wet inzake de geldtransactiekantoren][ref44]
      en ter beoordeling van de integere bedrijfsvoering, bedoeld in de artikelen 2, eerste en tweede lid,
      [4, tweede lid][ref45], [5, tweede lid][ref46], en [9, eerste lid, van die wet][ref47];

      c. de Stichting Autoriteit Financiële Markten, te behoeve van:

      1°. het verkrijgen van inzicht in de voornemens, handelingen en antecedenten, bedoeld
      in [artikel 12 van het Besluit gedragstoezicht financiële ondernemingen Wft][ref48],
      ter vaststelling van de betrouwbaarheid van een persoon als bedoeld in
      [artikel 4:10, eerste lid, van de Wet op het financieel toezicht][ref49] en ter beoordeling van
      de integere bedrijfsuitoefening onderscheidenlijk de integere bedrijfsvoering, bedoeld in de
      [artikelen 4:11, eerste lid][ref50], [4:14, eerste lid][ref51], en [4:15, eerste lid, van die wet][ref52];

      2°. het verkrijgen van inzicht in de voornemens, handelingen en antecedenten, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________ (Stcrt. 2006, 190), ter vaststelling van de betrouwbaarheid
      van een persoon als bedoeld in [artikel 15, eerste lid, van de Wet toezicht accountantsorganisaties][ref54]
      en [artikelen 5 van het Besluit toezicht accountantsorganisaties][ref55] en ter beoordeling van de integere
      bedrijfsvoering, bedoeld in [artikel 21, eerste lid, van die wet][ref56].

      3 De politiegegevens, bedoeld in het tweede lid, worden door leden van het openbaar ministerie beoordeeld in
      het kader van de adviserende taak voor de uitvoering van de bovenbedoelde wetten en kunnen, in het kader van
      vorenbedoelde taak, worden verstrekt aan de personen en instanties, genoemd in het tweede lid. Aan de verstrekking
      van de politiegegevens kunnen door de leden van het openbaar ministerie nadere voorwaarden worden gesteld. Die
      voorwaarden kunnen onder meer betreffen het ter beschikking stellen of doorgeven van die gegevens of inlichtingen
      aan derden.

      4 De politiegegevens, bedoeld in het tweede en derde lid, die zijn verstrekt aan de personen en instanties, bedoeld
      in het tweede lid, worden niet langer dan gedurende een termijn van twaalf maanden na de datum van verkrijgen
      bewaard. De gegevens kunnen langer worden bewaard met bijzondere toestemming van het openbaar ministerie. Daarbij
      kunnen nadere voorwaarden worden gesteld.

      5 Politiegegevens die worden verwerkt overeenkomstig de [artikelen 8][ref57], [9][ref58],
      [10, eerste lid, onderdelen a en c][ref59], en [13, eerste lid, van de wet][ref60], kunnen worden verstrekt aan
      de volgende personen en instanties, voor zover zij deze behoeven voor het nemen van de besluiten waarmee zij zijn
      belast op grond van de hiernavolgende wetten:

        - de Minister van Justitie, ten behoeve van het nemen van een beslissing op grond van de
      [Wet wapens en munitie][ref61];
        - de Minister van Justitie, ten behoeve van het nemen van een beslissing op grond van de
      [Wet particuliere beveiligingsorganisaties en recherchebureaus][ref62];
        - de korpschef, ten behoeve van het nemen van beschikkingen omtrent het verlenen of intrekken van jachtakten op
      grond van de [Flora- en faunawet][ref63];
        - het college van burgemeester en wethouders, de burgemeester, gedeputeerde staten of de commissaris van de
      Koningin, ten behoeve van het nemen van een beslissing omtrent de verlening, weigering of intrekking van een
      vergunning op grond van de [Drank- en Horecawet][ref64];
        - de burgemeester, ten behoeve van het nemen van een beslissing omtrent een vergunning op grond van de
      [Wet op de kansspelen][ref65].

      6 Politiegegevens die worden verstrekt in de gevallen, bedoeld in het vijfde lid, kunnen tevens worden verstrekt
      aan een bestuursorgaan dat beslist naar aanleiding van een ingesteld bezwaar of administratief beroep.


