  - number: 4:1
    text: |-
      1 Politiegegevens die worden verwerkt overeenkomstig
      [artikel 13, eerste lid, onderdeel a en onderdeel d, van de wet][ref1], kunnen, voor zover zij deze behoeven voor
      een goede uitvoering van hun taak, worden verstrekt aan:

      a. de Immigratie- en Naturalisatiedienst, ten behoeve van het vaststellen van de identiteit van personen;

      b. luchtvaartmaatschappijen, als bedoeld in [artikel 1, onderdeel h, van de Luchtvaartwet][ref2], voor zover
      het gaat om personalia en gegevens betreffende de datum van retourvervoer ten behoeve van het voorkomen van
      overtredingen van de [Opiumwet][ref3] en de bescherming van de gezondheid van personen door het weigeren van
      het vervoer van personen van en naar bepaald aangewezen buitenlandse bestemmingen en er met de betreffende
      luchtvaartmaatschappijen schriftelijke afspraken zijn gemaakt over de waarborgen rond de gegevensverstrekking.

      c. Onze Minister van Buitenlandse Zaken, ten behoeve van de uitvoering van opdrachten tot signalering van personen
      in het buitenland en het nemen van een beslissing omtrent de afgifte van een paspoort of omtrent de verlening of
      verlenging van een visum.

      2 De op grond van het eerste lid, onder b verstrekte gegevens met betrekking tot individuele personen worden door
      de luchtvaartmaatschappijen niet langer verwerkt dan gedurende een termijn van ten hoogste zesendertig maanden na
      de datum van de aanhouding van de betrokkene, die aanleiding geeft tot opneming van de gegevens op de lijst.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0001941
