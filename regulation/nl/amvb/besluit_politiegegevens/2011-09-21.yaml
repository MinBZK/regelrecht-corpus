  - number: 2:12
    text: |-
      De functionaris, bedoeld in [artikel 2:10][ref1], kan, indien noodzakelijk voor de goede uitvoering van de
      gegevensvergelijking, bedoeld in [artikel 11 van de wet][ref2], politiegegevens voorzien van één van de navolgende
      codes:

      a. instemming met verdere verwerking van politiegegevens;

      b. vertrouwelijke verwerking als bedoeld in [artikel 2:13, eerste lid, onderdelen a en b][ref3];

      c. vertrouwelijke verwerking als bedoeld in [artikel 2:13, eerste lid, onderdelen c, d, e en f][ref4].


