  - number: 4:2
    text: |-
      1 Politiegegevens die worden verwerkt overeenkomstig de [artikelen 8][ref1] en [13, eerste lid, van de wet][ref2],
      kunnen, voor zover zij deze behoeven voor een goede uitvoering van hun taak, worden verstrekt aan:

      a. de commissie, bedoeld in [artikel 8 van de Wet schadefonds geweldsmisdrijven][ref3], ten behoeve van het nemen
      van een beslissing op een verzoek tot uitkering uit het schadefonds geweldsmisdrijven;

      b. de stichting slachtofferhulp Nederland, ten behoeve van het behartigen van belangen van slachtoffers van
      strafbare feiten of verkeersongevallen;

      c. de Stichting Processen Verbaal, voor zover het gegevens betreft inzake aanrijdingen of aanvaringen, ten behoeve
      van een goede uitvoering van haar taak;

      d. het Waarborgfonds Motorverkeer, als bedoeld in
      [artikel 23, eerste lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref4], voor zover het
      betreft gegevens omtrent de personalia en de verblijfplaats van benadeelden en zij deze gegevens behoeven voor
      de hulp aan benadeelden ten behoeve van het geldend maken van een recht op schadevergoeding, als bedoeld in
      [artikel 25, eerste lid, van die wet][ref5];

      e. de Stichting Centraal Bureau Rijvaardigheidsbewijzen, ten behoeve van:

        - het onderzoek, bedoeld in de [artikelen 101][ref6] en [142 van het Reglement rijbewijzen][ref7], en het betreft
      overtreding van [artikel 6][ref8] of [artikel 8 van de Wegenverkeerswet 1994][ref9], of
        - de vervulling van de in de [artikelen 130 tot en met 134a van de Wegenverkeerswet 1994][ref10] aan de Divisie
      Vorderingen van het bureau opgedragen taak;

      f. Halt-bureaus, voor zover zij zijn aangewezen door Onze Minister van Justitie op grond van
      [artikel 48g van de Wet Justitie-subsidies][ref11], ten behoeve van de alternatieve afdoening van de strafbare
      feiten, gepleegd door minderjarigen;

      g. reclasseringswerkers als bedoeld in [artikel 6 van de Reclasseringsregeling 1995][ref12], ten behoeve van
      het uitvoeren van de werkzaamheden, bedoeld in [hoofdstuk 3 van die Regeling][ref13] en de indicatiestelling ten
      behoeve van de forensische zorg;

      h. de Dienst Wegverkeer, ten behoeve van het uitvoeren van de taken van de dienst op grond van
      [artikel 2 van de Regeling taken Dienst Wegverkeer][ref14];

      i. de stichting, bedoeld in [artikel 1, van de Wet op de jeugdzorg][ref15], ten behoeve
      van de uitvoering van één van de taken als bedoeld in [artikel 5, eerste lid][ref16], en
      [artikel 10, eerste lid, onderdelen a tot en met e, van die wet][ref17] of een door Onze Minister van
      Veiligheid en Justitie aanvaarde rechtspersoon, bedoeld in de [artikelen 254, tweede lid][ref18], en
      [302, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref19], ten behoeve van de uitvoering van één van de taken
      als bedoeld in [artikel 10, eerste lid, onderdelen a en b, van de Wet op de jeugdzorg][ref20];

      j. de raad voor de kinderbescherming, ten behoeve van de uitvoering van één van de bij wet aan de raad opgedragen
      taken;

      k. Onze Minister van Justitie, ten behoeve van:

      1°. het verwerken van gegevens over jeugdigen in het Cliënt Volgsysteem jeugdcriminaliteit, ter ondersteuning van
      de voorkoming en bestrijding van jeugdcriminaliteit;

      2°. het verwerken van gegevens omtrent de identiteit van verdachten en veroordeelden in de strafrechtsketendatabank
      en de verdere verstrekking van die gegevens aan de functionarissen en organen die met de toepassing van het
      strafrecht zijn belast, ten behoeve van de vaststelling van de identiteit van verdachten en veroordeelden;

      3°. het verwerken van gegevens omtrent de identiteit van vreemdelingen in de Basisvoorziening Vreemdelingen
      en de verdere verstrekking van die gegevens aan instanties die zijn betrokken bij de uitvoering van de
      [Vreemdelingenwet 2000][ref21], ten behoeve van de vaststelling van de identiteit van vreemdelingen, en aan
      andere instanties met een publieke taak belast, ten behoeve van registratie, identificatie en verificatie van
      vreemdelingen, hun documenten of hun verblijfsrechtelijke positie.

      l. de Onderzoeksraad voor veiligheid, bedoeld in [artikel 2 van de Rijkswet Onderzoeksraad voor veiligheid][ref22],
      ten behoeve van de uitvoering van de in [die wet][ref23] opgedragen taken;

      m. de door Onze Minister van Landbouw, Natuur en Voedselkwaliteit aangewezen dienst, bedoeld in
      [artikel 1, onderdeel d, van het Besluit inbeslaggenomen voorwerpen][ref24], voor zover het betreft gegevens met
      betrekking tot het proces-verbaal en de kennisgeving van inbeslagneming, ten behoeve van een goede toepassing van
      het [Besluit inbeslaggenomen voorwerpen][ref25];

      n. benadeelden van strafbare feiten, waaronder begrepen de personen die in verband met die feiten in hun rechten
      zijn getreden of ingevolge enige wettelijke bepaling terzake van die rechten een recht van verhaal hebben gekregen,
      voor zover zij deze gegevens behoeven om in rechte voor hun belangen op te kunnen komen;

      o. de Inspectie voor de Openbare Orde en Veiligheid van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties,
      ten behoeve van het toetsen van de taakuitvoering dan wel het beheer van de politie of het verrichten van
      onderzoek, bedoeld in [artikel 53a, eerste lid, onderdelen b, c en d, van de Politiewet 1993][ref26];

      p. de Minister van Justitie, ten behoeve van de verzending van beschikkingen en transacties en de tenuitvoerlegging
      van ontnemings- en schadevergoedingsmaatregelen door het Centraal Justitieel Incassobureau;

      q. de Dienst Terugkeer en Vertrek, voor zover het betreft gegevens over vreemdelingen die zijn
      verkregen in het kader van de uitoefening van het toezicht, bedoeld in de [artikelen 46][ref27] en
      [47 van de Vreemdelingenwet 2000][ref28], of de opsporing van strafbare feiten, ten behoeve van de begeleiding van
      de terugkeer of het vertrek uit Nederland van vreemdelingen die niet rechtmatig in Nederland verblijven.

      r. de Algemene Inspectiedienst van Onze Minister van Landbouw, Natuur en Voedselkwaliteit, ten behoeve van het
      uitvoeren van de taak, bedoeld in [artikel 67 van de Regeling GLB-inkomenssteun 2006][ref29];

      s. een verzekeringsmaatschappij of de Minister van Defensie, ten behoeve van de beoordeling van de wettelijke
      aansprakelijkheid van het desbetreffende politiekorps of van de Minister van Defensie en de vaststelling van een
      verplichting tot schadeloosstelling van derden;

      t. het Nederlands Instituut voor Forensische Psychiatrie en Psychologie, ten behoeve van het opstellen van de
      rapportages pro justitia en de indicatieadvisering;

      u. de leden van een commissie als bedoeld in [artikel 61, tweede lid, onderdeel a, van de Politiewet 1993][ref30],
      die zijn belast met de behandeling van, en advisering over, klachten over gedragingen van ambtenaren van politie,
      en de personen die zijn belast met de ondersteuning van de leden van die commissie;

      v. het Centraal Orgaan opvang asielzoekers, ten behoeve van de huisvesting van een vreemdeling en de handhaving van
      de orde en veiligheid in het aanmeldcentrum;

      w. het Landelijk Bureau Inning Onderhoudsbijdragen, voor wat betreft gegevens over de
      verblijfplaats van een persoon, ten behoeve van de inning van bijdragen of uitkeringen, bedoeld in
      [artikel 2, derde lid, van de Wet Landelijk Bureau Inning Onderhoudsbijdragen][ref31];

      x. de Minister van Defensie, ten behoeve van het nemen van een beslissing over de ongeldigverklaring van een door
      die minister afgegeven militair rijbewijs of rijmachtiging.

      2 Politiegegevens die worden verwerkt overeenkomstig de [artikelen 8][ref32] en [13, eerste lid, van de wet][ref33]
      kunnen, voor zover zij deze behoeven voor een goede uitvoering van hun taak, worden verstrekt aan ambtenaren die
      bij of krachtens de [wet][ref34] zijn belast met het houden van toezicht op de naleving van de bij regeling van
      Onze Ministers aangewezen wetgeving, voor zover het betreft gegevens over de naleving van die wetgeving, en er
      tussen de verantwoordelijke en de betreffende ambtenaren afspraken zijn gemaakt over welke gegevens verstrekt
      worden, in welke gevallen en onder welke voorwaarden. De verantwoordelijke legt deze afspraken vast.

      3 Politiegegevens die worden verwerkt overeenkomstig de [artikelen 8][ref35] en [13, eerste lid, van de wet][ref36]
      kunnen, voor zover zij deze behoeven voor een goede uitvoering van hun taak, worden verstrekt aan de
      door Onze Minister van Sociale Zaken en Werkgelegenheid respectievelijk Onze Minister van Financiën
      aangewezen ambtenaren, die zijn belast met het toezicht op de naleving van het bepaalde bij of
      krachtens de [Wet arbeid vreemdelingen][ref37] respectievelijk de [Invorderingswet 1990][ref38] en de
      [Algemene wet inzake rijksbelastingen][ref39] ten behoeve van de inschatting van de veiligheidsrisico’s met
      betrekking tot de uitoefening van vorenbedoeld toezicht.

      4 Politiegegevens, die worden verwerkt overeenkomstig de [artikelen 8][ref40] en
      [13, eerste lid, van de wet][ref41], kunnen worden verstrekt aan de gemeentelijke basisadministratie
      persoonsgegevens, bedoeld in [artikel 2 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref42], met
      het oog op signalering van veranderingen in de gegevens die in de basisadministratie zijn opgenomen.


