      1 Aan Europol worden gegevens verstrekt ten behoeve van de vervulling van de doelstelling en taken van die dienst
      op grond van de Europol-Overeenkomst.

      2 De gegevens worden verstrekt door tussenkomst van het Korps landelijke politiediensten. Daartoe kan gebruik
      worden gemaakt van Nederlandse verbindingsofficieren die bij Europol worden geplaatst.

      3 De verstrekking van gegevens kan in afzonderlijke gevallen worden geweigerd indien de gronden, bedoeld in artikel
      4, vijfde lid, van de Europol-Overeenkomst van toepassing zijn.
