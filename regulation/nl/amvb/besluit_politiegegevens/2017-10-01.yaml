  - number: 6a:3
    text: |-
      In afwijking van [artikel 3:1][ref1] zijn de misdrijven, bedoeld
      in [artikel 10, eerste lid, onderdeel a, onder 3°][ref2] juncto
      [artikel 36c, eerste lid, onderdeel c, van de wet][ref3] die gezien hun aard of samenhang met andere door de
      betrokkene begane misdrijven een ernstige inbreuk op de rechtsorde opleveren:

      a. de misdrijven bedoeld in de artikelen [324, onderdelen 4° en 5°][ref4], en
      [artikel 431 van het Wetboek van Strafrecht BES][ref5], voor zover de feiten een
      schade van ten minste USD 14 000 veroorzaakt hebben en betrokkene tevens een misdrijf
      als bedoeld in [artikel 10, eerste lid, onderdeel a, onder 1° en 2°][ref6], juncto
      [artikel 36c, eerste lid, onderdeel c, van de wet][ref7] heeft begaan;

      b. de misdrijven, bedoeld in de [artikelen 246][ref8], [253][ref9], [256][ref10], [256a][ref11], [257][ref12],
      [258][ref13] en [286f van het Wetboek van Strafrecht BES][ref14];

      c. de misdrijven, bedoeld in de [artikelen 183][ref15], [184][ref16], [377][ref17]
      en [379 van het Wetboek van Strafrecht BES][ref18] en de [artikelen 185][ref19] en
      [186 van het Wetboek van Strafrecht BES][ref20] in verband met de [artikelen 187][ref21] en
      [188 van dat wetboek][ref22];

      d. de misdrijven, bedoeld in de [artikelen 230][ref23], [231][ref24], [232][ref25], [236][ref26] en
      [237 van het Wetboek van Strafrecht BES][ref27], voor zover de feiten een schade van ten minste USD 28 000
      veroorzaakt hebben;

      e. de misdrijven, bedoeld in de [artikelen 196a][ref28] en [203a van het Wetboek van Strafrecht BES][ref29];

      f. de misdrijven, bedoeld in de [artikelen 3a, eerste lid][ref30] en
      [4, eerste lid, onderdelen b, c en d, telkens onder A van de Opiumwet 1960 BES][ref31];

      g. de misdrijven, bedoeld in de [artikelen 3][ref32] en [5 van de Vuurwapenwet BES][ref33], voor zover de feiten
      betrekking hebben op het voorhanden hebben van vuurwapens en explosieven.


