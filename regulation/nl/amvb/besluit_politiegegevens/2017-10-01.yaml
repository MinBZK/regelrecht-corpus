  - number: 2:8
    text: |-
      Voor het verwerken van gegevens met het oog op het uitvoeren van:

      a. een taak ten dienste van de justitie, bedoeld in [artikel 13, eerste lid, onderdeel e, van de wet][ref1],

      b. een taak ten behoeve van het verkrijgen van landelijk inzicht in een specialistisch onderwerp als bedoeld in
      [artikel 13, tweede lid, van de wet][ref2] of

      c. de geautomatiseerde vergelijking met het oog op de melding van verschillende verwerkingen jegens eenzelfde
      persoon, bedoeld in [artikel 13, derde lid van de wet][ref3],

      kunnen worden geautoriseerd de ambtenaren van politie die werkzaam zijn bij een team dat met de uitvoering van deze
      taak is belast.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel13
