  - number: 6a:6
    text: |-
      1 In afwijking van [artikel 4:3, eerste lid][ref1], kunnen politiegegevens die worden verwerkt
      overeenkomstig de [artikelen 8][ref2], [9][ref3], [10, eerste lid, onderdelen a en c][ref4] juncto
      [artikel 36c, eerste lid, onder c][ref5], en [13 van de wet][ref6] en voor zover zij deze behoeven voor een goede
      uitvoering van hun taak, worden verstrekt aan:

      a. Onze Minister van Veiligheid en Justitie, ten behoeve van:

        - de uitvoering van [artikel 5, eerste lid, van de Gratiewet][ref7];
        - de beoordeling van de benoeming, de herbenoeming of het ontslag van de leden van de commissies van toezicht bij
      de gestichten, bedoeld in [artikel 41 van de Wet beginselen gevangeniswezen BES][ref8];
        - het afgeven van een verklaring omtrent het gedrag als bedoeld in de
      [Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag BES][ref9];
        - de taakuitvoering van het Meldpunt Ongebruikelijke Transacties.

      b. de directeuren van de gestichten, bedoeld in [artikel 2 van de Wet beginselen gevangeniswezen BES][ref10] en de
      functionarissen van de Dienst Justitiële inrichtingen van het Ministerie van Justitie, ten behoeve van:

      1. het nemen van beslissingen over hetzij de aanstelling of het ontslag van personeel, hetzij de toelating tot het
      gesticht van personen die niet worden ingesloten in het gesticht, voor zover dat noodzakelijk is voor de orde of
      veiligheid in het gesticht respectievelijk de voorziening;

      2. het nemen van beslissingen over het verlaten van het gesticht bij wijze van verlof;

      3. het treffen van maatregelen met betrekking tot de voorkoming van strafbare feiten door of met betrekking
      tot gedetineerden, de handhaving van de orde en veiligheid in het justitiële gesticht, of de ongestoorde
      tenuitvoerlegging van de vrijheidsbeneming.

      c. de commandant van de Koninklijke marechaussee, ten behoeve van de uitoefening van de controle, bedoeld in
      [artikel 22, derde lid, van de Luchtvaartwet BES][ref11];

      d. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties ten behoeve van het verrichten van een onderzoek
      naar de betrouwbaarheid en geschiktheid ten aanzien van ambtenaren van politie van het politiekorps voor Bonaire,
      Sint Eustatius en Saba;

      e. de Immigratie- en Naturalisatiedienst, ten behoeve van het nemen van beslissingen omtrent de toelating,
      het verblijf of de ongewenstverklaring, als bedoeld in de [Wet toelating en uitzetting BES][ref12], de
      [Rijkswet op het Nederlanderschap][ref13] of een verdrag dan wel een voor Nederland bindend besluit van een
      volkenrechtelijke organisatie, als bedoeld in [artikel 25 van de Wet toelating en uitzetting BES][ref14];

      f. de Rijksvertegenwoordiger en de gezaghebber van Bonaire, Sint Eustatius of Saba, ten behoeve van hun adviserende
      taak, bedoeld in het [Reglement op de Orde van de Nederlandse Leeuw en de Orde van Oranje-Nassau][ref15];

      g. gedragsdeskundigen, voor zover het betreft auditieve of audiovisuele registraties van het verhoor van een
      persoon naar aanleiding van een ernstig strafbaar feit, voor het beoordelen van het verhoor en het opstellen van
      een deskundigenrapportage ten behoeve van het strafrechtelijk onderzoek, het gerechtelijk vooronderzoek of het
      onderzoek ter terechtzitting;

      h. Onze Minister van Veiligheid en Justitie, ten behoeve van het verrichten van een onderzoek naar de
      betrouwbaarheid en geschiktheid ten aanzien van personen die anders dan als ambtenaar van politie werkzaamheden
      verrichten voor het politiekorps voor Bonaire, Sint Eustatius en Saba alsmede buitengewone agenten van politie.

      2 In afwijking van [artikel 4:3, tweede lid][ref16], kunnen politiegegevens als bedoeld in het eerste lid worden
      verstrekt aan leden van het openbaar ministerie ten behoeve van de adviserende taak in het kader van de uitvoering
      van de hierna te noemen wetten en door tussenkomst van dat openbaar ministerie in het kader van vorenbedoelde taak,
      verder worden verstrekt aan:

      a. de Nederlandsche Bank, ten behoeve van:

        - het verkrijgen van inzicht in de voornemens, handelingen en antecedenten, bedoeld in
      [artikel 3:1 van het Besluit financiële markten BES][ref17], ter vaststelling van de betrouwbaarheid van een
      persoon, als bedoeld in [artikel 3:4, eerste lid, van de Wet financiële markten BES][ref18];
        - het verkrijgen van inzicht in de voornemens, handelingen en antecedenten, bedoeld in
      [artikel 4, eerste lid, van het Besluit Pensioenwet BES][ref19], ter vaststelling van de betrouwbaarheid van een
      persoon, als bedoeld in [artikel 5a, vijfde lid, Pensioenwet BES][ref20];

      b. de Autoriteit Financiële Markten, ten behoeve van het verkrijgen van inzicht in de voornemens,
      handelingen en antecedenten, bedoeld in [artikel 3:1 van het Besluit financiële markten BES][ref21],
      ter vaststelling van de betrouwbaarheid van een persoon, als bedoeld in
      [artikel 3:4, eerste lid, van de Wet financiële markten BES][ref22].

      3 Aan de verdere verstrekking van de op grond van het tweede lid verstrekte politiegegevens kunnen door het
      openbaar ministerie nadere voorwaarden worden gesteld. Die voorwaarden kunnen onder meer betreffen het ter
      beschikking stellen of doorgeven van die gegevens of inlichtingen daarover aan derden.

      4 De op grond van het tweede lid verstrekte gegevens worden door de in dat lid genoemde personen en instanties niet
      langer dan gedurende een termijn van twaalf maanden na datum van verkrijgen bewaard. Gegevens die door de leden
      van het openbaar ministerie verder zijn verstrekt, kunnen langer worden bewaard met bijzondere toestemming van het
      openbaar ministerie. Daarbij kunnen nadere voorwaarden worden gesteld.

      5 Politiegegevens die worden verwerkt overeenkomstig de [artikelen 8][ref23], [9][ref24],
      [10, eerste lid, onderdelen a en c][ref25], en [13, eerste lid, van de wet][ref26], kunnen worden verstrekt aan
      Onze Minister van Veiligheid en Justitie en de gezaghebber, ten behoeve van het nemen van een beslissing op grond
      van de [Wapenwet BES][ref27] en de [Vuurwapenwet BES][ref28]. Deze gegevens kunnen tevens worden verstrekt aan een
      bestuursorgaan dat beslist naar aanleiding van een ingesteld administratief beroep.


