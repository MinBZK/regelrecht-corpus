  - number: 5:7
    text: |-
      1 Aan Europol worden politiegegevens verstrekt ten behoeve van de vervulling van de doelstelling en taken van die
      dienst, voor zover dat voortvloeit uit een richtlijn of verordening op grond van hoofdstuk 4 of hoofdstuk 5 van
      Titel V van het verdrag betreffende de Europese Unie. De politiegegevens worden verstrekt door tussenkomst van de
      landelijke eenheid, bedoeld in [artikel 5:1, derde lid][ref1].

      2 De verstrekking van gegevens aan Europol kan worden geweigerd indien:

      a. wezenlijke nationale veiligheidsbelangen worden geschaad,

      b. het welslagen van lopende onderzoeken of de veiligheid van personen in gevaar wordt gebracht, of

      c. informatie wordt bekend gemaakt die betrekking heeft op specifieke inlichtingendiensten of -activiteiten op het
      gebied van de staatsveiligheid.


      [ref1]: https://wetten.overheid.nl/BWBR0023086#Artikel51
    url: https://wetten.overheid.nl/BWBR0023086/2017-10-01#Artikel57
