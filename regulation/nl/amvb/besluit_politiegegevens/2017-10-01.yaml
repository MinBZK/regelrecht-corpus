  - number: 2:4
    text: |-
      1 Voor het verwerken van gegevens met het oog op het verkrijgen van inzicht in de betrokkenheid van
      personen bij handelingen die kunnen wijzen op het beramen of plegen van de misdrijven bedoeld in
      [artikel 10, eerste lid, onderdeel b, van de wet][ref1] kunnen worden geautoriseerd de ambtenaren van politie die
      werkzaam zijn bij een daartoe ingericht team dat specifiek is belast met de verwerking van politiegegevens als
      bedoeld in [artikel 10, eerste lid, onderdeel b, van de wet][ref2].

      2 In bijzondere gevallen kan de verantwoordelijke andere ambtenaren van politie autoriseren voor de verwerking,
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel10
