  - number: 5:4
    text: |-
      1 Indien politiegegevens worden ontvangen van een andere lidstaat van de Europese Unie, kunnen deze slechts worden
      verwerkt voor het doel waarvoor ze zijn verstrekt. Tevens is verdere verwerking mogelijk voor de doelen, genoemd in
      [artikel 5:3, vierde lid][ref1].

      2 Indien door de verstrekkende lidstaat op grond van het nationale recht termijnen zijn gesteld, na afloop waarvan
      de verstrekte gegevens moeten worden vernietigd, ziet de ontvangende autoriteit in Nederland erop toe dat de
      gegevens daadwerkelijk worden vernietigd.

      3 [Artikel 5:2][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023086#Artikel53
