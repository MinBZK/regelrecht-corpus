      1 Politiegegevens die worden verwerkt overeenkomstig de [artikelen 8][ref1], [9][ref2],
      [10, eerste lid, onderdelen a en c][ref3] en [13 van de wet][ref4] kunnen worden verstrekt aan leden van het
      openbaar ministerie met het oog op het verder verstrekken aan het openbaar ministerie in de openbare lichamen
      Bonaire, Sint Eustatius en Saba ten behoeve van de adviserende taak van laatstbedoeld openbaar ministerie in het
      kader van de uitvoering van de wetten, genoemd in [artikel 6a:6, tweede lid, onderdelen a en b][ref5], en, door
      tussenkomst van dat openbaar ministerie in het kader van vorenbedoelde taak, verder worden verstrekt aan:

      a. de Nederlandsche Bank ten behoeve van de uitoefening van de taken, genoemd in
      [artikel 6a:6, tweede lid, onderdeel a.][ref6]

      b. de Autoriteit Financiële Markten ten behoeve van de uitoefening van de taken, genoemd in
      [artikel 6a:6, tweede lid, onderdeel b][ref7].

      2 [Artikel 4:3, derde en vierde lid][ref8], is van toepassing.


