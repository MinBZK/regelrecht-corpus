      1 In de gevallen waarin de verantwoordelijke beslist tot verstrekking van politiegegevens op grond van
      [artikel 19][ref1] of [artikel 20, eerste lid, van de wet][ref2], worden geen politiegegevens verstrekt die worden
      verwerkt overeenkomstig [artikel 9][ref3] of [artikel 10 van de wet][ref4].

      2 Indien dringend noodzakelijk voor een goede uitvoering van de politietaak kan de verantwoordelijke in
