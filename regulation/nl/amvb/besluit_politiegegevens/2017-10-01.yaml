  - number: 3:1
    text: |-
      De misdrijven, bedoeld in [artikel 10, eerste lid, onderdeel a, onder 3°, van de wet][ref1] die gezien hun aard of
      samenhang met andere door de betrokkene begane misdrijven een ernstige inbreuk op de rechtsorde opleveren, zijn:

      a. de misdrijven, bedoeld in de [artikelen 311, eerste lid, onder 3° tot en met 5°][ref2],
      en [416 van het Wetboek van Strafrecht][ref3], voor zover de feiten een schade van ten
      minste € 25 000 veroorzaakt hebben en betrokkene tevens een misdrijf als bedoeld in
      [artikel 10, eerste lid, onderdeel a, onder 1° en 2°, van de wet][ref4] heeft begaan;

      b. de misdrijven, bedoeld in de [artikelen 240b][ref5], [247][ref6], [248a][ref7], [248b][ref8], [249][ref9],
      [250][ref10] en [273f van het Wetboek van Strafrecht][ref11];

      c. de misdrijven, bedoeld in de [artikelen 177][ref12], [178][ref13], [361][ref14]
      en [363 van het Wetboek van Strafrecht][ref15] en de [artikelen 179][ref16] en
      [180 van het Wetboek van Strafrecht][ref17] in verband met de [artikelen 181][ref18] en
      [182 van dat wetboek][ref19];

      d. de misdrijven, bedoeld in de [artikelen 225][ref20], [226][ref21], [227][ref22], [231][ref23] en
      [232 van het Wetboek van Strafrecht][ref24], voor zover de feiten een schade van ten minste € 50 000 veroorzaakt
      hebben;

      e. de misdrijven, bedoeld in de [artikelen 191][ref25] en [197a van het Wetboek van Strafrecht][ref26];

      f. het misdrijf, bedoeld in [artikel 3, eerste lid, onderdeel A, van de Opiumwet][ref27];

      g. de misdrijven, bedoeld in de [artikelen 26][ref28] en [31 van de Wet wapens en munitie][ref29], voor zover de
      feiten betrekking hebben op het voorhanden hebben van vuurwapens en explosieven.


