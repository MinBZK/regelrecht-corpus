  - number: 6a:2
    text: |-
      1 Voor de toepassing van:

      a. [artikel 2:4, eerste lid][ref1], wordt in plaats van «de ambtenaren van politie die werkzaam zijn bij
      een daartoe ingericht team dat specifiek is belast met de verwerking van politiegegevens als bedoeld in
      [artikel 10, eerste lid, onderdeel b, van de wet][ref2]» gelezen: de daartoe door de verantwoordelijke aangewezen
      ambtenaren van politie;

      b. [artikel 2:5, eerste lid][ref3], wordt in plaats van «de ambtenaren van politie die zijn belast met de
      verwerking van politiegegevens als bedoeld in [artikel 10, eerste lid, onderdeel a, van de wet][ref4]» gelezen: de
      daartoe door de verantwoordelijke aangewezen ambtenaren van politie;

      c. [artikel 2:5, tweede lid][ref5], wordt in plaats van «de ambtenaren van politie die zijn belast met de
      verwerking van politiegegevens als bedoeld in [artikel 10, eerste lid, onderdeel c, van de wet][ref6]» gelezen: de
      daartoe door de verantwoordelijke aangewezen ambtenaren van politie;

      d. [artikel 2:7, eerste lid][ref7], wordt in plaats van
      «[artikel 14, eerste lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref8]» gelezen:
      [artikel 3:3, eerste lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme BES][ref9];

      e. [artikel 2:8][ref10] wordt in plaats van «kunnen worden geautoriseerd de ambtenaren van politie die werkzaam
      zijn bij een team dat met de uitvoering van deze taak is belast» gelezen: kunnen daartoe door de verantwoordelijke
      aangewezen ambtenaren van politie worden belast;

      f. [artikel 2:10, tweede lid][ref11], wordt in plaats van «het hoofd van het betreffende team dat is belast met de
      verwerking van politiegegevens, bedoeld in [artikel 10, eerste lid, onderdelen a, b of c, van de wet][ref12], dan
      wel het hoofd van een team met een vergelijkbare taak of hun plaatsvervanger» gelezen: de ambtenaren van politie
      die daartoe door de verantwoordelijke zijn aangewezen;

      g. [artikel 2:13, eerste lid, onderdeel c][ref13], wordt in plaats van «de korpschef» gelezen: de korpsbeheerder;

      h. [artikel 2:13, eerste lid, onder d][ref14], wordt in plaats van «rijksrecherche» gelezen «recherche» en in
      plaats van «het College van procureurs-generaal» gelezen: de procureur-generaal;

      i. [artikel 2:13, eerste lid, onder f][ref15], wordt in plaats van «het College van procureurs-generaal» gelezen:
      de procureur-generaal;

      j.

      k. [artikel 2:13, tweede lid, onderdeel c][ref16], wordt in plaats van
      «[artikel 16, eerste lid, onderdeel c][ref17]» gelezen «[artikel 36d, eerste lid, onderdeel a][ref18]» en in plaats
      van «[artikel 3:1][ref19]» gelezen: [artikel 6a:3][ref20];

      l. [artikel 4:1, eerste lid, onderdeel b][ref21], wordt in plaats
      van «[artikel 1, onderdeel h, van de Luchtvaartwet][ref22]» gelezen
      «[artikel 1, eerste lid, onderdeel i van de Luchtvaartwet BES][ref23]» en wordt in plaats van «[Opiumwet][ref24]»
      gelezen: [Opiumwet 1960 BES][ref25];

      m. [artikel 4:2, eerste lid, onderdeel aa][ref26], wordt in plaats van «bedoeld in
      [artikel 1:3, eerste lid, onderdeel c, van de Algemene douanewet][ref27]» gelezen: bedoeld in
      [artikel 1.1, onderdeel h, van de Douane- en Accijnswet BES][ref28];

      n. [artikel 4:7, eerste lid, onder b][ref29], wordt in plaats van «de burgemeester» telkens gelezen: de
      gezaghebber;

      o. [artikel 5:1, eerste lid, aanhef][ref30], wordt in plaats van «in een land binnen het Koninkrijk, in een ander
      land of in de openbare lichamen Bonaire, Sint Eustatius en Saba» gelezen «in een land binnen het Koninkrijk of in
      een ander land' en wordt in plaats van «het Europese deel van Nederland» gelezen «de openbare lichamen Bonaire,
      Sint Eustatius en Saba» en wordt in plaats van «land dan wel het openbare lichaam» gelezen: land;

      p. [artikel 5:1, eerste lid, onder c][ref31], wordt in plaats van
      «[artikel 1, eerste lid, onderdeel i, van de Politiewet 2012][ref32]» gelezen:
      __REF002___________________________________________________________________________________________________________
      _______________________;

      q. [artikel 5:1, tweede lid][ref34], wordt in plaats van «dat land of de openbare lichamen» gelezen: dat land;

      r. [artikel 5:1, derde lid][ref35], wordt in plaats van «een landelijke eenheid als bedoeld in
      [artikel 25, eerste lid, onderdeel b, van de Politiewet 2012][ref36]» gelezen «de officier van justitie» en vervalt
      de tweede zin;

      s. [artikel 5:1, zesde lid][ref37], wordt in plaats van «burgemeester» gelezen: gezaghebber;

      t. [artikel 5:1, zevende lid][ref38], wordt in plaats van «van een land binnen het Koninkrijk, van een ander land
      of van de openbare lichamen Bonaire, Sint Eustatius en Saba» gelezen: van een ander land;

      u. [artikel 5:1, achtste lid][ref39], wordt in plaats van «in de openbare lichamen Bonaire, Sint Eustatius en Saba
      of in een land binnen het Koninkrijk of in een ander land» gelezen: in een land binnen het Koninkrijk of in een
      ander land;

      v. [artikel 6:3, eerste lid][ref40], wordt in plaats van «€ 4,50» gelezen: USD 5;

      w. [artikel 6:4, vierde en vijfde lid][ref41], wordt telkens na «[paragraaf 3][ref42]» ingevoegd: en
      [artikel 36d][ref43];

      x. [artikel 6:4, zesde lid][ref44], wordt in plaats van «[artikel 16, eerste lid, onderdeel c][ref45],» gelezen:
      [artikel 36d, eerste lid, onderdeel a,][ref46];

      y. [artikel 6:6, eerste lid, onderdeel d][ref47], wordt in plaats van «op grond van de
      [Wet ter voorkoming van witwassen en financieren van terrorisme BES][ref48]» gelezen: op grond van de
      [Wet ter voorkoming van witwassen en financieren van terrorisme][ref49].

      2 De [artikelen 2:3, derde lid][ref50], [2:4, tweede lid][ref51], [4:2, derde en vierde lid][ref52],
      [4:3, derde tot en met zesde lid][ref53], [4:3a][ref54], [4:4, tweede gedachtestreepje][ref55],
