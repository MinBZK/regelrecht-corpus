  - number: 2:3
    text: |-
      1 Voor het verwerken van politiegegevens met het oog op de controle en het beheer van een informant
      alsmede de beoordeling en verantwoording van het gebruik van informantgegevens, bedoeld in
      [artikel 12, eerste lid, van de wet][ref1], kunnen worden geautoriseerd de ambtenaren van politie
      die werkzaam zijn bij een team dat is belast met de verwerking van politiegegevens als bedoeld in
      [artikel 10, eerste lid, onderdeel a of c, van de wet][ref2].

      2 Voor het verwerken van politiegegevens als bedoeld in [artikel 6:1, eerste lid, onderdeel a][ref3], kunnen worden
      geautoriseerd de ambtenaren van politie die werkzaam zijn bij een team dat is belast met infiltratie, pseudo-koop
      of -dienstverlening en stelselmatige inwinning van informatie.

      3 Voor het verwerken van politiegegevens als bedoeld in [artikel 6:1, eerste lid, onderdeel b][ref4], kunnen worden
      geautoriseerd de ambtenaren van politie die werkzaam zijn bij een dienst van een landelijke eenheid als bedoeld in
      [artikel 25, eerste lid, onderdeel b, van de Politiewet 2012][ref5] die is belast met werkzaamheden op het terrein
      van getuigenbescherming.

      4 Voor het geautomatiseerd vergelijken van politiegegevens, bedoeld in [artikel 12, vierde lid, van de wet][ref6],
      kunnen worden geautoriseerd de ambtenaren van politie die werkzaam zijn bij een team dat is belast met de
      verwerking van politiegegevens als bedoeld in [artikel 10, eerste lid, onderdeel a of c, van de wet][ref7].

      5 De ambtenaren van politie, bedoeld in de vorige leden van dit artikel, worden slechts geautoriseerd voor de
      verwerking van politiegegevens, voor zover dat dringend noodzakelijk is voor een goede uitvoering van hun taak.

      6 Voor het verwerken van identificerende gegevens van een informant kunnen uitsluitend worden geautoriseerd het
      hoofd van het team, bedoeld in [artikel 2.10, tweede lid][ref8], of diens plaatsvervanger.


