  - number: 5:2
    text: |-
      1 Indien politiegegevens zonder voorafgaand verzoek tot verstrekking worden ontvangen van een ander land of van een
      internationaal orgaan, beoordeelt de ontvangende autoriteit in Nederland onmiddellijk of deze gegevens noodzakelijk
      zijn voor het doel waarvoor zij zijn verstrekt.

      2 Indien krachtens het recht van het andere land specifieke beperkingen op de verwerking van politiegegevens
      gelden, ziet de ontvangende autoriteit in Nederland toe op inachtneming van de beperkingen indien deze door de
      verstrekkende autoriteit zijn gemeld.

      3 Indien politiegegevens worden ontvangen van een ander land of van een internationale organisatie, wordt de
      verstrekkende instantie desgevraagd geïnformeerd over de verwerking van de verstrekte gegevens en het daardoor
      behaalde resultaat.
    url: https://wetten.overheid.nl/BWBR0023086/2017-10-01#Artikel52
  - number: 5:3
    text: |-
      1 Aan personen of instanties in een andere lidstaat van de Europese Unie, die zijn belast met de voorkoming
      en opsporing van strafbare feiten in de betreffende lidstaat, worden politiegegevens verstrekt onder gelijke
      voorwaarden als aan politieambtenaren in Nederland, voor zover zij deze behoeven voor een goede uitvoering van die
      taak en behoudens de toepassing van de gronden, bedoeld in het tweede lid.

      2 De verstrekking kan worden geweigerd of aan beperkende voorwaarden worden onderworpen indien dit:

      a. een geval betreft als bedoeld in [artikel 2:13][ref1];

      b. essentiële nationale veiligheidsbelangen zou schaden;

      c. het welslagen van een lopend onderzoek of een verwerking, bedoeld in
      [artikel 10, eerste lid, onderdeel a, van de wet][ref2] of de veiligheid van personen in gevaar zou brengen;

      d. duidelijk disproportioneel of irrelevant zou zijn met het oog op de doelen waarvoor om verstrekking van de
      gegevens is verzocht;

      e. betrekking heeft op een strafbaar feit dat in Nederland strafbaar is gesteld met een gevangenisstraf van één
      jaar of minder;

      f. betrekking heeft op politiegegevens die uitsluitend kunnen worden verstrekt na instemming van de officier van
      justitie en deze geen toestemming geeft voor de verstrekking;

      g. betrekking heeft op politiegegevens die zijn verkregen van een andere lidstaat of van een derde land en deze
      geen toestemming geeft voor de verstrekking.

      3 Aan personen of instanties in een andere lidstaat, als bedoeld in het eerste lid, worden politiegegevens
      verstrekt, voor zover zij deze behoeven ter voorkoming van strafbare feiten en ter handhaving van de openbare orde
      in verband met grootschalige evenementen. De politiegegevens kunnen uitsluitend worden verstrekt indien definitieve
      veroordelingen of andere feiten het vermoeden rechtvaardigen dat de desbetreffende personen tijdens de evenementen
      strafbare feiten zullen plegen of dat zij een gevaar voor de openbare orde en veiligheid vormen. De politiegegevens
      worden verstrekt onder de voorwaarde dat deze worden vernietigd zodra de doeleinden zijn verwezenlijkt, in elk
      geval uiterlijk na één jaar.

      4 De gegevens worden verstrekt onder de voorwaarde dat deze slechts kunnen worden verwerkt voor het doel waarvoor
      ze zijn verstrekt. Onverminderd specifieke regels in een richtlijn of verordening op grond van hoofdstuk 4 of
      hoofdstuk 5 van Titel V van het verdrag betreffende de werking van de Europese Unie is tevens verdere verwerking
      door de bevoegde autoriteit in de ontvangende lidstaat mogelijk voor de volgende doelen:

      a. de voorkoming, opsporing of vervolging van andere strafbare feiten of de tenuitvoerlegging van andere straffen
      dan die waarvoor de gegevens waren verstrekt;

      b. andere gerechtelijke en administratieve procedures die rechtstreeks verband houden met de voorkoming, de
      opsporing en de vervolging van strafbare feiten en de tenuitvoerlegging van straffen;

      c. de voorkoming van een onmiddellijke en ernstige bedreiging van de openbare veiligheid, of,

      d. een ander doel, met voorafgaande instemming van de verantwoordelijke of van de betrokkene.

      5 De gegevens worden verstrekt onder de voorwaarde dat deze door de ontvangende autoriteit worden vernietigd zodra
      de doeleinden zijn verwezenlijkt.

      6 Indien dit uit de wet voortvloeit kunnen bij de verstrekking termijnen worden gesteld, na afloop waarvan de
      verstrekte gegevens door de ontvangende autoriteit moeten worden vernietigd, behoudens wanneer verdere verwerking
      noodzakelijk is voor een lopend onderzoek, de vervolging van strafbare feiten of de tenuitvoerlegging van straffen.

      7 In afwijking van het vierde lid kunnen in specifieke omstandigheden door de verstrekkende autoriteit specifieke
      beperkingen worden gesteld aan de verdere verwerking van de verstrekte politiegegevens, voor zover deze beperkingen
      ook van toepassing zijn op de beschikbaarstelling van de gegevens aan andere politieambtenaren in Nederland.

      8 [Artikel 5:1, derde, vierde en zevende lid][ref3] en [artikel 5:2][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023086#Artikel213
