  - number: 5:8
    text: |-
      1 Aan Eurojust worden politiegegevens verstrekt ten behoeve van de vervulling van de doelstelling en taken van die
      organisatie, voor zover dat voorvloeit uit een richtlijn of verordening op grond van hoofdstuk 4 of hoofdstuk 5 van
      Titel V van het verdrag betreffende de Europese Unie. De politiegegevens worden verstrekt door tussenkomst van het
      nationale lid van Eurojust.

      2 De verstrekking van politiegegevens aan Eurojust kan worden geweigerd indien wezenlijke nationale
      veiligheidsbelangen worden geschaad of de veiligheid van een persoon in gevaar wordt gebracht.

      3 Politiegegevens worden verstrekt aan het nationale lid van Eurojust, voor zover hij deze behoeft in verband met
      de doelstelling en taken, bedoeld in het eerste lid. Het tweede lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0023086/2017-10-01#Artikel58
  - number: 5:9
    text: |-
      1 Politiegegevens, die zijn ontvangen van een lidstaat van de Europese Unie, kunnen worden doorgegeven aan
      autoriteiten in een derde land of aan een internationaal orgaan, belast met de preventie, de opsporing of de
      vervolging van strafbare feiten dan wel de tenuitvoerlegging van straffen, voor zover zij deze behoeven voor
      een goede uitvoering van die taken en de lidstaat, waarvan de gegevens afkomstig zijn, heeft ingestemd met die
      doorgifte.

      2 In afwijking van het eerste lid kunnen politiegegevens zonder voorafgaande toestemming worden doorgegeven indien
      dit van essentieel belang is ter voorkoming van een onmiddellijke en ernstige bedreiging van de openbare veiligheid
      van een lidstaat of derde land land of voor wezenlijke belangen van een lidstaat, en de toestemming niet tijdig kan
      worden verkregen. De voor het verlenen van de toestemming bevoegde autoriteit wordt onverwijld geïnformeerd.
    url: https://wetten.overheid.nl/BWBR0023086/2017-10-01#Artikel59
  - number: 5:10
    text: |-
      1 Politiegegevens, die zijn ontvangen van een andere lidstaat van de Europese Unie, kunnen worden doorgegeven aan
      een instantie met een particuliere taak indien:

      a. de bevoegde autoriteit van de lidstaat, waarvan de gegevens afkomstig zijn, heeft ingestemd met die doorgifte;

      b. geen gerechtvaardigde belangen van de betrokkene zich tegen doorgifte verzetten, en

      c. in bijzondere gevallen de doorgifte essentieel is voor de persoon of instantie die de gegevens doorgeeft aan de
      betreffende instantie ten behoeve van:

      1°. de uitvoering van haar wettelijke taken;

      2°. de preventie, het onderzoek, de opsporing of de vervolging van strafbare feiten en de tenuitvoerlegging van
      straffen;

      3°. het voorkomen van een onmiddellijke en ernstige bedreiging van de openbare veiligheid, of

      4°. het voorkomen van een ernstige schending van de rechten van personen.

      2 Bij de doorgifte, bedoeld in het eerste lid, wordt medegedeeld voor welk doel de gegevens uitsluitend verder
      mogen worden verwerkt.
    url: https://wetten.overheid.nl/BWBR0023086/2017-10-01#Artikel510
  - number: 6:1
    text: |-
      1 Het bepaalde in [artikel 12, eerste lid, van de wet][ref1] is van overeenkomstige toepassing op de volgende
      categorieën van personen:

      a. infiltranten;

      b. personen die in aanmerking zijn gebracht voor beschermingsmaatregelen, als bedoeld in het
      [Besluit getuigenbescherming][ref2].

      2 De verwerking, als bedoeld in het eerste lid, onderdeel a, vindt slechts plaats omtrent:

      a. verdachten;

      b. personen in de omgeving van de verdachte wier handelen van invloed kan zijn op het doel van de verwerking, als
      bedoeld in het eerste lid, en de bescherming van de infiltrant;

      c. infiltranten;

      d. begeleiders;

      e. opsporingsambtenaren;

      f. leden van het openbaar ministerie.

      3 De verwerking, als bedoeld in het eerste lid, onderdeel b, vindt slechts plaats omtrent:

      a. getuigen ten aanzien van wie een dreiging bestaat;

      b. personen in de omgeving van de getuigen;

      c. verdachten;

      d. personen in de omgeving van de verdachte wier handelen van invloed kan zijn op het doel van de verwerking, als
      bedoeld in het eerste lid, en de bescherming van de getuige;

      e. begeleiders;

      f. opdrachtgevers.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0019359
