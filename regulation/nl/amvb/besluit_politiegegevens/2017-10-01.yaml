  - number: 5:1
    text: |-
      1 Aan autoriteiten in een land binnen het Koninkrijk, in een ander land of in de openbare lichamen Bonaire, Sint
      Eustatius en Saba, die zijn belast met de uitvoering van de politietaak, kunnen politiegegevens worden verstrekt,
      voorzover dit noodzakelijk is voor de goede uitvoering van de politietaak in het Europese deel van Nederland, dan
      wel voorzover dit noodzakelijk is voor de goede uitvoering van de politietaak in het desbetreffende land dan wel
      het openbare lichaam ingeval van:

      a. de opsporing van een ernstig misdrijf of de voorkoming van een ernstig gevaar voor de openbare orde,

      b. een verzoek met betrekking tot een bepaalde persoon of een bepaald geval, of

      c. de uitvoering van taken die overeenkomen met de taken ten dienste van de justitie, als bedoeld in
      [artikel 1, eerste lid, onderdeel i, van de Politiewet 2012][ref1], op grond van een verzoek met betrekking tot een
      bepaalde persoon of een bepaald geval.

      2 De gegevens worden verstrekt onder de algemene voorwaarde dat deze slechts kunnen worden verwerkt voor het
      doel waarvoor ze zijn verstrekt. In bijzondere gevallen kunnen de verstrekte gegevens verder worden verwerkt ten
      behoeve van de voorkoming van een onmiddellijke en ernstige bedreiging van de openbare veiligheid. Op verzoek van
      de ontvangende persoon of instantie kan de verantwoordelijke instemmen met de verdere verwerking van verstrekte
      gegevens voor een ander doel voor zover dit noodzakelijk is voor de goede uitvoering van de politietaak in dat land
      of de openbare lichamen.

      3 De verstrekking van politiegegevens, die worden verwerkt in verband met de strafrechtelijke handhaving van
      de rechtsorde of de handhaving van de openbare orde, vindt plaats door tussenkomst van een landelijke eenheid
      als bedoeld in [artikel 25, eerste lid, onderdeel b, van de Politiewet 2012][ref2]. De verstrekking kan zonder
      tussenkomst van deze landelijke eenheid plaatsvinden overeenkomstig afspraken met politieautoriteiten in het
      buitenland, voor zover deze afspraken zijn goedgekeurd door Onze Minister van Veiligheid en Justitie.

      4 In de grensgebieden kan de verstrekking, bedoeld in de eerste zin van het derde lid, zonder tussenkomst van de
      landelijke eenheid, bedoeld in het derde lid, plaatsvinden voor zover dit voortvloeit uit een verdrag waar ook
      België of Duitsland als verdragssluitende partij bij betrokken zijn of uit een besluit, bedoeld in artikel 34,
      tweede lid van, het Verdrag betreffende de Europese Unie.

      5 Politiegegevens die betrekking hebben op de in [artikel 5 van de wet][ref3] genoemde kenmerken worden slechts
      verstrekt indien dit met het oog op een juiste beantwoording van een door een buitenlandse politieautoriteit
      gestelde vraag onvermijdelijk is.

      6 Het bepaalde in het eerste lid is niet van toepassing op politiegegevens die worden verwerkt op grond van
      [artikel 10, eerste lid, onderdeel b van de wet][ref4]. Verstrekking van gegevens die worden verwerkt op grond van
      [artikel 10, eerste lid, onderdeel a of onderdeel c, van de wet][ref5] vindt slechts plaats na instemming van de
      betrokken officier van justitie, respectievelijk de betrokken burgemeester.

      7 Voor zover mogelijk controleert de verstrekkende autoriteit in Nederland de kwaliteit van de politiegegevens
      voordat de gegevens worden verstrekt en wordt aan de verstrekte gegevens informatie toegevoegd aan de hand waarvan
      de ontvanger de mate van juistheid, volledigheid, actualiteit en betrouwbaarheid kan beoordelen.

      8 Als blijkt dat onjuiste gegevens zijn verstrekt deelt de verstrekkende autoriteit dit onverwijld mee aan de
      personen of instanties van de lidstaat aan wie de gegevens zijn verstrekt, met het verzoek de gegevens onmiddellijk
      te corrigeren, te wissen of af te schermen.

      9 Politiegegevens die worden verwerkt door het Meldpunt Ongebruikelijke Transacties kunnen worden verstrekt aan van
      overheidswege aangewezen administratieve of politiële meldpunten in de openbare lichamen Bonaire, Sint Eustatius en
      Saba of in een land binnen het Koninkrijk of in een ander land die een vergelijkbare taak hebben als het meldpunt.
      Het bepaalde in het derde lid vindt geen toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0022463#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0022463#Artikel10
