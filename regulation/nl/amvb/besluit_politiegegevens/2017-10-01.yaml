  - number: 4:3
    text: |-
      1 Politiegegevens die worden verwerkt overeenkomstig de [artikelen 8][ref1], [9][ref2],
      [10, eerste lid, onderdelen a en c][ref3] en [13 van de wet][ref4] kunnen, voor zover zij deze behoeven voor een
      goede uitvoering van hun taak, worden verstrekt aan:

      a. Onze Minister van Veiligheid en Justitie, ten behoeve van:

        - de controle van rechtspersonen met het oog op de voorkoming en bestrijding van misbruik van rechtspersonen,
      waaronder het plegen van misdrijven en overtredingen van financieel-economische aard door of door middel van deze
      rechtspersonen, bedoeld in [artikel 2, eerste lid, van de Wet controle op rechtspersonen][ref5];
        - de uitvoering van [artikel 5, eerste lid, van de Gratiewet][ref6];
        - de beoordeling van de benoeming, de herbenoeming of het ontslag van de leden van de commissies van toezicht bij
      de inrichtingen, bedoeld in onderdeel c, alsmede van de leden van de commissies van toezicht op de arrestantenzorg,
      bedoeld in [artikel 50, eerste lid, van het Besluit beheer politie][ref7];
        - het afgeven van een verklaring omtrent het gedrag, bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref8];
        - de taakuitvoering van het Meldpunt Ongebruikelijke Transacties, bedoeld in
      [artikel 13 van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref9] en
      [artikel 3.2 van de Wet ter voorkoming van witwassen en financieren van terrorisme BES][ref10];
        - de tenuitvoerlegging van een maatregel als bedoeld in
      [artikel 36e, eerste lid, van het Wetboek van Strafrecht][ref11], door het Centraal Justitieel Incassobureau.

      b. de burgemeester ten behoeve van:

      1°. de beoordeling van een verzoek tot het verkrijgen van het Nederlanderschap op grond van de
      [Rijkswet op het Nederlanderschap][ref12];

      2°. de afgifte van de woonverklaring, bedoeld in
      [artikel 10b, vierde lid, van de Wet bijzondere maatregelen grootstedelijke problematiek][ref13].

      c. de directeuren van inrichtingen, bedoeld in
      [artikel 1, onderdeel b, van de Penitentiaire beginselenwet][ref14], van de inrichtingen, bedoeld in
      [artikel 1, onderdeel b, van de Beginselenwet verpleging ter beschikking gestelden en van de inrichtingen][ref15],
      bedoeld in [artikel 1, onderdeel b, van de Beginselenwet justitiële jeugdinrichtingen][ref16], en functionarissen
      van de Dienst Justitiële inrichtingen van het Ministerie van Veiligheid en Justitie, ten behoeve van:

      1. het nemen van beslissingen over hetzij de aanstelling of het ontslag van personeel, hetzij de toelating tot de
      inrichting van personen die niet worden ingesloten in de inrichting, voor zover dat noodzakelijk is voor de orde of
      veiligheid in de inrichting respectievelijk de voorziening;

      2. het nemen van beslissingen over het verlaten van de inrichting bij wijze van verlof;

      3. het nemen van beslissingen over de erkenning van een penitentiair programma, bedoeld in
      [artikel 4, eerste lid, van de Penitentiaire beginselenwet][ref17], of een scholing- en trainingprogramma, bedoeld
      in [artikel 3, eerste lid, van de Beginselenwet justitiële inrichtingen][ref18];

      4. het treffen van maatregelen met betrekking tot de voorkoming van strafbare feiten door of met betrekking
      tot gedetineerden, de handhaving van de orde en veiligheid in de justitiële inrichting, of de ongestoorde
      tenuitvoerlegging van de vrijheidsbeneming.

      d. de commandant van de Koninklijke marechaussee, ten behoeve van de uitoefening van de bevoegdheid, bedoeld in
      [artikel 37s van de Luchtvaartwet][ref19];

      e. de korpschef, ten behoeve van zijn adviserende taak in het kader van:

      1°. de uitvoering van [artikel 3B.1 van het Vuurwerkbesluit][ref20];

      2°. de benoeming en de herbenoeming van de leden van de commissies van toezicht op de arrestantenzorg, bedoeld in
      [artikel 50, eerste lid, van het Besluit beheer politie][ref21];

      f. het bevoegde gezag, bedoeld in
      [artikel 1, eerste lid, onderdeel l, van het Besluit algemene rechtspositie politie][ref22] en het bevoegde
      gezag, bedoeld in [artikel 1, eerste lid, onderdeel e, van het Besluit rechtspositie vrijwillige politie][ref23],
      ten behoeve van het verrichten van een onderzoek als bedoeld in [artikel 8a, eerste lid][ref24], en
      [artikel 8b, eerste lid, van het Besluit algemene rechtspositie politie][ref25] en [artikel 4a, eerste lid][ref26],
      en [artikel 4b, eerste lid, van het Besluit rechtspositie vrijwillige politie][ref27], of voor het verrichten
      van een onderzoek naar de betrouwbaarheid en geschiktheid ten aanzien van personen die anderszins werkzaamheden
      verrichten voor de politie, het Landelijk selectie- en opleidingsinstituut politie, het Politie onderwijs- en
      kenniscentrum of de rijksrecherche en waarvoor de gezagdragende instanties justitiële gegevens als bedoeld in het
      [Besluit justitiële gegevens][ref28] vragen;

      g. het Bureau bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref29], ten behoeve van de
      uitoefening van de in [die wet][ref30] aan het bureau opgedragen taak;

      h. de Immigratie- en Naturalisatiedienst, ten behoeve van de taken, bedoeld in
      [artikel 4:1, eerste lid, onderdeel a, onder 2° en 3°][ref31];

      i. de burgemeester en de commissaris van de Koning, ten behoeve van hun adviserende taak, bedoeld in het
      [Reglement op de Orde van de Nederlandse Leeuw en de Orde van Oranje-Nassau][ref32] en Onze Minister van Defensie
      met het oog op de toekenning van bij koninklijk besluit te verlenen onderscheidingen;

      j. gedragsdeskundigen, voor zover het betreft auditieve of audiovisuele registraties van het verhoor van een
      persoon naar aanleiding van een ernstig strafbaar feit, voor het beoordelen van het verhoor en het opstellen van
      een deskundigenrapportage ten behoeve van het strafrechtelijk onderzoek, het gerechtelijk vooronderzoek of het
      onderzoek ter terechtzitting;

      k. Onze Minister van Defensie en de onder hem ressorterende bevelvoerende militairen van een oorlogsschip,
      inrichting van de zeemacht, compagnie, eskadron, batterij of squadron of een hogere eenheid, voor zover het betreft
      gegevens omtrent:

      1°. de toepassing van vrijheidsbenemende dwangmiddelen jegens een militair, ten behoeve van het nemen van
      maatregelen met betrekking tot de operationele gereedheid van de eenheid; of

      2°. de betrokkenheid van een militair bij de verdenking van een overtreding van de [Opiumwet][ref33] of een
      misdrijf, ten behoeve van het nemen van besluiten inzake schorsing of ontslag van militaire ambtenaren, als bedoeld
      in [artikel 12 van de Militaire Ambtenarenwet 1931][ref34];

      l. bestuursorganen en rechtspersonen met een overheidstaak, bedoeld in
      [artikel 1, eerste lid, onder a, van de Wet bevordering integriteitsbeoordelingen openbaar bestuur][ref35],
      voor zover dat noodzakelijk is in de gevallen waarin zij bevoegd zijn tot toepassing van die [wet][ref36],
      uitsluitend voor zover het betreft gegevens omtrent de betrokkene, bedoeld in artikel 1, eerste
      lid, onder e, van die wet. Indien de betrokkene een rechtspersoon is betreffen de gegevens zowel de
      rechtspersoon als de bestuurders, alsmede de gegevens met betrekking tot strafbare feiten waaraan
      [artikel 51, tweede lid, onder 2°, van het Wetboek van Strafrecht][ref37] ten grondslag heeft gelegen. Indien
      een bestuurder een rechtspersoon is betreffen de gegevens eveneens deze rechtspersoon, alsmede de bestuurders
      daarvan. Indien de betrokkene een maatschap of vennootschap onder firma is betreffen de gegevens de maten, dan
      wel de vennoten, uitgezonderd de gegevens betreffende de vennoot en commandite, alsmede de gegevens met betrekking
      tot strafbare feiten waaraan artikel 51, tweede lid, onder 2°, van het Wetboek van Strafrecht ten grondslag heeft
      gelegen. Indien de vennoten of maten rechtspersoonlijkheid bezitten betreffen de gegevens deze rechtspersonen,
      alsmede de bestuurders daarvan;

      m. het college van burgemeester en wethouders voor zover het
      gegevens behoeft voor de handhaving van de voorschriften, bedoeld in
      [artikel 10b, vijfde lid, van de Wet bijzondere maatregelen grootstedelijke problematiek][ref38];

      n. bestuursorganen, ten behoeve van het nemen van een beslissing omtrent de toepassing van
      [artikel 6 van de Tijdelijke wet bestuurlijke maatregelen terrorismebestrijding][ref39], uitsluitend voor
      zover het betreft gegevens omtrent de aanvrager, subsidieontvanger of houder van een vergunning, ontheffing of
      erkenning als bedoeld in artikel 6, onderdeel a, van die wet. Indien deze aanvrager, subsidieontvanger of houder
      een rechtspersoon is, betreffen de gegevens zowel de rechtspersoon als de bestuurders, alsmede de gegevens met
      betrekking tot strafbare feiten waaraan [artikel 51, tweede lid, onder 2°, van het Wetboek van Strafrecht][ref40]
      ten grondslag heeft gelegen. Indien een bestuurder een rechtspersoon is betreffen de gegevens eveneens deze
      rechtspersoon, alsmede de bestuurders daarvan. Indien de aanvrager, subsidieontvanger of houder een maatschap
      of vennootschap onder firma is betreffen de gegevens de maten, dan wel de vennoten, uitgezonderd de gegevens
      betreffende de vennoot en commandite, alsmede de gegevens met betrekking tot strafbare feiten waaraan artikel
      51, tweede lid, onder 2°, van het Wetboek van Strafrecht ten grondslag heeft gelegen. Indien de vennoten of maten
      rechtspersoonlijkheid bezitten betreffen de gegevens deze rechtspersonen, alsmede de bestuurders daarvan.

      2 Politiegegevens, als bedoeld in het eerste lid kunnen, door tussenkomst van het openbaar ministerie, worden
      verstrekt aan de hierna te noemen personen of instanties:

      a. De Nederlandsche Bank N.V., ten behoeve van:

      1°. het verkrijgen van inzicht in de voornemens, handelingen en antecedenten, bedoeld
      in [artikel 5 van het Besluit prudentiële regels Wft][ref41], ter vaststelling van de
      betrouwbaarheid van een persoon als bedoeld in de [artikelen 3:9, eerste lid][ref42], en
      [3:99, eerste lid, van de Wet op het financieel toezicht][ref43] en ter beoordeling van de
      integere bedrijfsuitoefening onderscheidenlijk de integere bedrijfsvoering, bedoeld in de
      [artikelen 3:10, eerste lid][ref44], en [3:17, eerste lid, van die wet][ref45];

      2°. het verkrijgen van inzicht in de voornemens, handelingen en antecedenten, bedoeld in artikel 2, eerste lid, van
      de Beleidsregel inzake de betrouwbaarheid van (kandidaat)(mede)beleidsbepalers van en houders van gekwalificeerde
      deelnemingen in onder toezicht staande instellingen (Stcrt. 2005, 20), ter vaststelling van de betrouwbaarheid van
      een persoon als bedoeld in [artikel 3, eerste lid, onderdelen a, b en c, van de Wet toezicht trustkantoren][ref46]
      en ter beoordeling van de integere bedrijfsvoering, bedoeld in de artikelen 3, eerste lid, onderdeel f, en
      [10, eerste lid, van die wet][ref47];

      3°. het verkrijgen van inzicht in de voornemens, handelingen en antecedenten, bedoeld in
      [artikel 31 van het Besluit uitvoering Pensioenwet en Wet verplichte beroepspensioenregeling][ref48],
      ter vaststelling van de betrouwbaarheid van een persoon als
      bedoeld in [artikel 105, vijfde lid, van de Pensioenwet][ref49] en
      [artikel 110, vijfde lid, van de Wet verplichte beroepspensioenregeling][ref50] en ter beoordeling van de
      beheerste en integere bedrijfsvoering, bedoeld in [artikel 143, eerste lid, van de Pensioenwet][ref51] en
      [artikel 138, eerste lid, van de Wet verplichte beroepspensioenregeling][ref52];

      b. Onze Minister van Financiën, ten behoeve van het verkrijgen van inzicht in de voornemens, handelingen
      en antecedenten, bedoeld in artikel 2 van de Beleidsregel inzake de betrouwbaarheid van (kandidaat)
      (mede)beleidsbepalers van en houders van gekwalificeerde deelnemingen in onder toezicht staande
      instellingen (Stcrt. 2005, 20), ter vaststelling van de betrouwbaarheid van een persoon als bedoeld in
      [artikelen 2, tweede lid, onderdelen a, b, c of d, van de Wet inzake de geldtransactiekantoren][ref53]
      en ter beoordeling van de integere bedrijfsvoering, bedoeld in de artikelen 2, eerste en tweede lid,
      [4, tweede lid][ref54], [5, tweede lid][ref55], en [9, eerste lid, van die wet][ref56];

      c. de Stichting Autoriteit Financiële Markten, te behoeve van:

      1°. het verkrijgen van inzicht in de voornemens, handelingen en antecedenten, bedoeld
      in [artikel 12 van het Besluit gedragstoezicht financiële ondernemingen Wft][ref57],
      ter vaststelling van de betrouwbaarheid van een persoon als bedoeld in
      [artikel 4:10, eerste lid, van de Wet op het financieel toezicht][ref58] en ter beoordeling van
      de integere bedrijfsuitoefening onderscheidenlijk de integere bedrijfsvoering, bedoeld in de
      [artikelen 4:11, eerste lid][ref59], [4:14, eerste lid][ref60], en [4:15, eerste lid, van die wet][ref61];

      2°. het verkrijgen van inzicht in de voornemens, handelingen en antecedenten, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________ (Stcrt. 2006, 190), ter vaststelling van de betrouwbaarheid
      van een persoon als bedoeld in [artikel 15, eerste lid, van de Wet toezicht accountantsorganisaties][ref63]
      en [artikelen 5 van het Besluit toezicht accountantsorganisaties][ref64] en ter beoordeling van de integere
      bedrijfsvoering, bedoeld in [artikel 21, eerste lid, van die wet][ref65].

      3 De politiegegevens, bedoeld in het tweede lid, worden door leden van het openbaar ministerie beoordeeld in
      het kader van de adviserende taak voor de uitvoering van de bovenbedoelde wetten en kunnen, in het kader van
      vorenbedoelde taak, worden verstrekt aan de personen en instanties, genoemd in het tweede lid. Aan de verstrekking
      van de politiegegevens kunnen door de leden van het openbaar ministerie nadere voorwaarden worden gesteld. Die
      voorwaarden kunnen onder meer betreffen het ter beschikking stellen of doorgeven van die gegevens of inlichtingen
      aan derden.

      4 De politiegegevens, bedoeld in het tweede en derde lid, die zijn verstrekt aan de personen en instanties, bedoeld
      in het tweede lid, worden niet langer dan gedurende een termijn van twaalf maanden na de datum van verkrijgen
      bewaard. De gegevens kunnen langer worden bewaard met bijzondere toestemming van het openbaar ministerie. Daarbij
      kunnen nadere voorwaarden worden gesteld.

      5 Politiegegevens die worden verwerkt overeenkomstig de [artikelen 8][ref66], [9][ref67],
      [10, eerste lid, onderdelen a en c][ref68], en [13, eerste lid, van de wet][ref69], kunnen worden verstrekt aan
      de volgende personen en instanties, voor zover zij deze behoeven voor het nemen van de besluiten waarmee zij zijn
      belast op grond van de hiernavolgende wetten:

        - Onze Minister van Veiligheid en Justitie, ten behoeve van het nemen van een beslissing op grond van de
      [Wet wapens en munitie][ref70];
        - Onze Minister van Veiligheid en Justitie, ten behoeve van het nemen van een beslissing op grond van de
      [Wet particuliere beveiligingsorganisaties en recherchebureaus][ref71];
        - Onze Minister van Veiligheid en Justitie, ten behoeve van een onderzoek naar de betrouwbaarheid van een
      buitengewoon opsporingsambtenaar en het nemen van een beslissing hieromtrent op grond van de [artikelen 17][ref72]
      en [35 van het Besluit buitengewoon opsporingsambtenaar][ref73];
        - de korpschef, ten behoeve van het nemen van beschikkingen omtrent het verlenen of intrekken van jachtakten op
      grond van de [Wet natuurbescherming][ref74];
        - de burgemeester, omtrent de verlening, weigering of intrekking van een vergunning op grond van de
      [Drank- en Horecawet][ref75];
        - de burgemeester, ten behoeve van het nemen van een beslissing omtrent een vergunning op grond van de
      [Wet op de kansspelen][ref76].

      6 Politiegegevens die worden verstrekt in de gevallen, bedoeld in het vijfde lid, kunnen tevens worden verstrekt
      aan een bestuursorgaan dat beslist naar aanleiding van een ingesteld bezwaar of administratief beroep.

      7 Politiegegevens die worden verwerkt overeenkomstig de [artikelen 8][ref77], [9][ref78],
      [10, eerste lid, onderdelen a en c][ref79], en [13, eerste lid, van de wet][ref80], kunnen worden verstrekt
      aan de daartoe aangewezen vertegenwoordigers van de deelnemende bestuursorganen aan een Regionaal Informatie-
      en Expertisecentrum, voor zover het betreft politiegegevens die relevant zijn voor het geïntegreerd handhavend
      optreden bij de bestrijding van georganiseerde criminaliteit en er tussen de betreffende bestuursorganen
      schriftelijke afspraken zijn gemaakt over de gevallen waarin en de voorwaarden waaronder de gegevens worden
      verstrekt. Politiegegevens die worden verwerkt overeenkomstig de artikelen 9 en 10, eerste lid, onderdelen a en
      c, van de wet, kunnen uitsluitend aan die vertegenwoordigers worden verstrekt ten behoeve van het analyseren van
      handhavingsknelpunten, het verrichten van integrale casusanalyses en het bepalen en uitvoeren van de uit deze
      analyses voortvloeiende interventies, en voor zover het gegevens betreffen die worden verwerkt overeenkomstig de
      artikelen 9 en 10, eerste lid, onderdeel a, van de wet, slechts na instemming van het openbaar ministerie.

      8 Politiegegevens die worden verwerkt overeenkomstig de [artikelen 8][ref81], [9][ref82],
      [10, eerste lid, onderdelen a en c][ref83], en [13 van de wet][ref84] kunnen, door tussenkomst van het openbaar
      ministerie, worden verstrekt aan bestuursorganen indien deze verstrekking noodzakelijk is voor de uitvoering van de
      aan hen opgelegde taak of taken, bedoeld in:

      a. [artikel 7d van de Algemene Kinderbijslagwet][ref85];

      b. de [artikelen 32g, eerste lid][ref86], en [32h, eerste lid, van de Algemene nabestaandenwet][ref87];

      c. [artikel 8d, eerste, tweede en derde lid, van de Algemene Ouderdomswet][ref88];

      d. [artikel 2, eerste lid, onder q, van de Algemene Wet Inkomensafhankelijke regelingen][ref89];

      e. [artikel 13, eerste lid, aanhef en onderdeel h, van de Participatiewet][ref90];

      f. de [artikelen 2b, eerste lid, aanhef en onderdeel k][ref91], en [6aa, eerste lid, van de Remigratiewet][ref92];

      g. [artikel 2, elfde lid, van de Toeslagenwet][ref93];

      h. [artikel 19, eerste lid, aanhef en onderdeel n, van de Werkloosheidswet][ref94];

      i. [artikel 7a, derde lid, onderdeel f, van de Wet algemene ouderdomsverzekering BES][ref95];

