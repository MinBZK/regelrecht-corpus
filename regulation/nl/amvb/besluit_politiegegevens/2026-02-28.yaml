preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Justitie, mede namens Onze Minister van Binnenlandse Zaken en
    Koninkrijksrelaties en Onze Minister van Defensie van 11 juni 2007, nr. 5488670/07/6;

    Gelet op de artikelen 6, zesde en zevende lid, 10, eerste lid, onderdeel a, onder 3°, en onderdeel b, 11, derde
    lid, 12, vijfde lid, 13, vierde lid, 15, tweede lid, 17, zesde lid, 18, eerste lid, 21, 22, tweede lid, 23, tweede
    lid, 31, eerste lid, 32, vierde lid, 33, vijfde lid, en 46, eerste lid, van de Wet politiegegevens en artikel 4,
    tweede lid, van de Wet melding ongebruikelijke transacties;

    De Raad van State gehoord (advies van 7 augustus 2007, nr. W03.07.0163/II);

    Gezien het nader rapport van Onze Minister van Justitie, mede namens Onze Minister van Binnenlandse Zaken en
    Koninkrijksrelaties en Onze Minister van Defensie van 5 december 2007, nr. 5516760/07/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#ArtikelAanhef
articles:
  - number: 1:1
    text: |-
      In dit besluit en de daarop rustende bepalingen wordt verstaan onder wet: de [Wet politiegegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022463
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0022463
  - number: 2:1
    text: |-
      Voor het in combinatie met elkaar verwerken van politiegegevens, bedoeld in [artikel 8, derde lid, van de wet][ref1]
      kunnen worden geautoriseerd de ambtenaren van politie die zijn belast met taken of werkzaamheden op het gebied van
      de coördinatie van het informatieproces ter ondersteuning van een goede uitvoering van de politietaak.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel8
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '8'
  - number: 2:2.1
    text: |-
      Voor het geautomatiseerd vergelijken van politiegegevens, bedoeld in [artikel 11, eerste lid, van de wet][ref1],
      kunnen worden geautoriseerd de ambtenaren van politie die zijn belast met de taken of werkzaamheden, bedoeld
      in [artikel 2:1][ref2]. In voorkomende gevallen kunnen daarvoor tevens worden geautoriseerd de ambtenaren
      van politie die werkzaam zijn bij een team dat is belast met de verwerking van politiegegevens als bedoeld in
      [artikel 10, eerste lid, onderdeel a, b of c, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0023086#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0023086
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '10'
  - number: 2:2.2
    text: |-
      Voor het geautomatiseerd vergelijken alsmede het in combinatie met elkaar verwerken van politiegegevens, bedoeld
      in [artikel 11, tweede onderscheidenlijk vierde lid, van de wet][ref1], kunnen worden geautoriseerd de ambtenaren
      van politie die werkzaam zijn bij een team dat is belast met de verwerking van politiegegevens als bedoeld in
      [artikel 10, eerste lid, onderdeel a, b of c, van de wet][ref2]. In voorkomende gevallen kunnen daarvoor tevens
      worden geautoriseerd de ambtenaren van politie die zijn belast met de taken of werkzaamheden als bedoeld in
      [artikel 2:1][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0023086#Artikel2
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0023086
        artikel: '2'
        paragraaf: '2'
  - number: 2:2.3
    text: |-
      De ambtenaren van politie, bedoeld in de laatste zin van het tweede lid, worden slechts geautoriseerd voor
      de verwerking van politiegegevens, voor zover dat dringend noodzakelijk is voor een goede uitvoering van de
      politietaak en in overeenstemming met het hoofd van het in het tweede lid bedoelde team.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel22
  - number: 2:3.1
    text: |-
      Voor het verwerken van politiegegevens met het oog op de controle en het beheer van een informant
      alsmede de beoordeling en verantwoording van het gebruik van informantgegevens, bedoeld in
      [artikel 12, eerste lid, van de wet][ref1], kunnen worden geautoriseerd de ambtenaren van politie
      die werkzaam zijn bij een team dat is belast met de verwerking van politiegegevens als bedoeld in
      [artikel 10, eerste lid, onderdeel a of c, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '10'
  - number: 2:3.2
    text: |-
      Voor het verwerken van politiegegevens als bedoeld in [artikel 6:1, eerste lid, onderdeel a][ref1], kunnen worden
      geautoriseerd de ambtenaren van politie die werkzaam zijn bij een team dat is belast met infiltratie, pseudo-koop
      of -dienstverlening en stelselmatige inwinning van informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0023086#Artikel6
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0023086
        artikel: '6'
        paragraaf: '6'
  - number: 2:3.3
    text: |-
      Voor het verwerken van politiegegevens als bedoeld in [artikel 6:1, eerste lid, onderdeel b][ref1], kunnen worden
      geautoriseerd de ambtenaren van politie die werkzaam zijn bij een dienst van een landelijke eenheid als bedoeld in
      [artikel 25, eerste lid, onderdeel b, van de Politiewet 2012][ref2] die is belast met werkzaamheden op het terrein
      van getuigenbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0023086#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel25
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0023086
        artikel: '6'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '25'
  - number: 2:3.4
    text: |-
      Voor het geautomatiseerd vergelijken van politiegegevens, bedoeld in [artikel 12, vierde lid, van de wet][ref1],
      kunnen worden geautoriseerd de ambtenaren van politie die werkzaam zijn bij een team dat is belast met de
      verwerking van politiegegevens als bedoeld in [artikel 10, eerste lid, onderdeel a of c, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '10'
  - number: 2:3.5
    text: |-
      De ambtenaren van politie, bedoeld in de vorige leden van dit artikel, worden slechts geautoriseerd voor de
      verwerking van politiegegevens, voor zover dat dringend noodzakelijk is voor een goede uitvoering van hun taak.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel23
  - number: 2:3.6
    text: |-
      Voor het verwerken van identificerende gegevens van een informant kunnen uitsluitend worden geautoriseerd het hoofd
      van het team, bedoeld in [artikel 2.10, tweede lid][ref1], of diens plaatsvervanger.


      [ref1]: https://wetten.overheid.nl/BWBR0023086#Artikel2
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0023086
        artikel: '2'
        paragraaf: '2'
  - number: 2:4.1
    text: |-
      Voor het verwerken van gegevens met het oog op het verkrijgen van inzicht in de betrokkenheid van
      personen bij handelingen die kunnen wijzen op het beramen of plegen van de misdrijven bedoeld in
      [artikel 10, eerste lid, onderdeel b, van de wet][ref1] kunnen worden geautoriseerd de ambtenaren van politie die
      werkzaam zijn bij een daartoe ingericht team dat specifiek is belast met de verwerking van politiegegevens als
      bedoeld in [artikel 10, eerste lid, onderdeel b, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '10'
  - number: 2:4.2
    text: |-
      Indien bij de toepassing van het eerste lid de te verwerken gegevens betrekking hebben op de categorie
      misdrijven van ambtelijke omkoping, bedoeld in [artikel 3:2, onderdeel d][ref1], kunnen uitsluitend worden
      geautoriseerd de bij een daartoe ingericht team werkzame ambtenaren van de rijksrecherche, bedoeld in
      [artikel 2, onderdeel d, van de Politiewet 2012][ref2], dat specifiek is belast met de verwerking van die gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0023086#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0023086
        artikel: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '2'
  - number: 2:4.3
    text: |-
      In bijzondere gevallen kan de verwerkingsverantwoordelijke andere ambtenaren van politie autoriseren voor de
      verwerking, bedoeld in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel24
  - number: 2:5.1
    text: |-
      Voor het verwerken van gegevens met het oog op het verkrijgen van inzicht in de betrokkenheid van personen bij
      het beramen of plegen van de misdrijven, bedoeld in [artikel 10, eerste lid, onderdeel a, van de wet][ref1] kunnen
      worden geautoriseerd de ambtenaren van politie die zijn belast met de verwerking van politiegegevens als bedoeld
      in [artikel 10, eerste lid, onderdeel a, van de wet][ref2]. In voorkomende gevallen kunnen daarvoor tevens worden
      geautoriseerd de ambtenaren van politie die zijn belast met taken of werkzaamheden op het gebied van de coördinatie
      van het informatieproces ter ondersteuning van een goede uitvoering van de politietaak.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '10'
  - number: 2:5.2
    text: |-
      Voor het verwerken van gegevens met het oog op het verkrijgen van inzicht in de betrokkenheid van
      personen bij handelingen die, gezien hun aard of frequentie of het georganiseerde verband waarin
      zij worden gepleegd, een ernstige schending van de openbare orde vormen, kunnen worden geautoriseerd
      de ambtenaren van politie die zijn belast met de verwerking van politiegegevens als bedoeld in
      [artikel 10, eerste lid, onderdeel c, van de wet][ref1]. In voorkomende gevallen kunnen daarvoor tevens worden
      geautoriseerd de ambtenaren van politie die zijn belast met taken en werkzaamheden op het gebied van de coördinatie
      van het informatieproces ter ondersteuning van de goede uitvoering van de politietaak.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '10'
  - number: 2:5.3
    text: |-
      De ambtenaren van politie, bedoeld in de laatste zin van het tweede lid, worden slechts geautoriseerd voor
      de verwerking van politiegegevens, voor zover dat dringend noodzakelijk is voor een goede uitvoering van de
      politietaak en in overeenstemming met het hoofd van het betreffende team.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel25
  - number: 2:6
    text: |-
      De categorieën van ambtenaren die in aanmerking kunnen komen voor de autorisaties, bedoeld in de
      [artikelen 2:3][ref1], [2:4][ref2] en [2:5, eerste lid][ref3], worden aangewezen in overeenstemming met de officier
      van justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0023086#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0023086#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0023086#Artikel2
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0023086
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0023086
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0023086
        artikel: '2'
        paragraaf: '2'
  - number: 2:7.1
    text: |-
      Voor het verwerken van gegevens met het oog op het doel, bedoeld in
      [artikel 14, eerste lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref1],
      kunnen worden geautoriseerd de personen die betrokken zijn bij het bewerken en analyseren van gegevens over
      ongebruikelijke transacties.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel14
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '14'
  - number: 2:7.2
    text: |-
      De autorisaties kunnen, namens de verwerkingsverantwoordelijke, worden verstrekt door het hoofd van de Financiële
      inlichtingen eenheid.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel27
  - number: 2:8
    text: 'Voor het verwerken van gegevens met het oog op het uitvoeren van:'
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel28
  - number: 2:8.a
    text: |-
      een taak ten dienste van de justitie, bedoeld in [artikel 13, eerste lid, onderdeel e, van de wet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel13
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '13'
  - number: 2:8.b
    text: |-
      een taak ten behoeve van het verkrijgen van landelijk inzicht in een specialistisch onderwerp als bedoeld in
      [artikel 13, tweede lid, van de wet][ref1] of


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel13
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '13'
  - number: 2:8.c
    text: |-
      de geautomatiseerde vergelijking met het oog op de melding van verschillende verwerkingen jegens eenzelfde persoon,
      bedoeld in [artikel 13, derde lid van de wet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel13
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '13'
  - number: 2:9
    text: |-
      De verwerkingsverantwoordelijke draagt er zorg voor dat de ambtenaren van politie, bedoeld in de
      [artikelen 2:1 tot en met 2:5][ref1], beschikken over voldoende kennis en vaardigheden op het gebied van:


      [ref1]: https://wetten.overheid.nl/BWBR0023086#Artikel2
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0023086
        artikel: '2'
        paragraaf: '2'
  - number: 2:9.a
    text: |-
      het informatieproces binnen de politie, meer in het bijzonder de verschillende vormen van verwerking van
      politiegegevens,
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel29
  - number: 2:9.b
    text: de wet- en regelgeving die relevant is voor de verwerking van politiegegevens, en
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel29
  - number: 2:9.c
    text: methoden en technieken van informatieanalyse.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel29
  - number: 2:10.1
    text: |-
      Als functionaris, bedoeld in de [artikelen 9, derde lid][ref1], [11, eerste, tweede en vierde lid][ref2] en
      [13, derde lid, van de wet][ref3], kunnen worden aangewezen de leider van het betreffende onderzoek of zijn
      plaatsvervanger.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel13
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel210
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '13'
  - number: 2:10.2
    text: |-
      Als functionaris, bedoeld in de [artikelen 10, vijfde lid][ref1], [11, tweede en vierde lid][ref2] en
      [13, derde lid, van de wet][ref3], kunnen worden aangewezen het hoofd van het betreffende team dat is belast met
      de verwerking van politiegegevens, bedoeld in [artikel 10, eerste lid, onderdelen a, b of c, van de wet][ref4], dan
      wel het hoofd van een team met een vergelijkbare taak of hun plaatsvervangers.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel210
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '13'
      - id: ref4
        bwb_id: BWBR0022463
        artikel: '10'
  - number: 2:11
    text: |-
      Indien bij de gegevensvergelijking, bedoeld in [artikel 11 van de wet][ref1], gegevens overeenkomen, worden de
      verbanden op de volgende wijze zichtbaar gemaakt:


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel11
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel211
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '11'
  - number: 2:11.a
    text: |-
      bij gegevens, voorzien van een codering als bedoeld in [artikel 2:12, onderdeel a][ref1], en bij gegevens als
      bedoeld in [artikel 8 van de wet][ref2], zijn de gerelateerde gegevens zichtbaar;


      [ref1]: https://wetten.overheid.nl/BWBR0023086#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel8
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel211
    references:
      - id: ref1
        bwb_id: BWBR0023086
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '8'
  - number: 2:11.b
    text: |-
      bij gegevens, als bedoeld in de [artikelen 9][ref1] en [10, eerste lid, onderdelen a en c van de wet][ref2], zijn
      de overeenkomende gegevens zichtbaar en zijn de andere gerelateerde gegevens na instemming van de daartoe bevoegde
      functionaris zichtbaar;


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel211
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '10'
  - number: 2:11.c
    text: |-
      bij gegevens, voorzien van een code als bedoeld in het [artikel 2:12, onderdeel b][ref1], zijn de overeenkomende
      gegevens gedeeltelijk zichtbaar en de andere gerelateerde gegevens na instemming van de daartoe bevoegde
      functionaris zichtbaar;


      [ref1]: https://wetten.overheid.nl/BWBR0023086#Artikel2
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel211
    references:
      - id: ref1
        bwb_id: BWBR0023086
        artikel: '2'
        paragraaf: '2'
  - number: 2:11.d
    text: |-
      bij gegevens, voorzien van een code als bedoeld in het [artikel 2:12, onderdeel c][ref1], en bij gegevens als
      bedoeld in [artikel 10, eerste lid, onderdeel b van de wet][ref2], zijn de overeenkomende gegevens niet zichtbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0023086#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel211
    references:
      - id: ref1
        bwb_id: BWBR0023086
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '10'
  - number: 2:12
    text: |-
      De functionaris, bedoeld in [artikel 2:10][ref1], kan, indien noodzakelijk voor de goede uitvoering van de
      gegevensvergelijking, bedoeld in [artikel 11 van de wet][ref2], politiegegevens voorzien van één van de navolgende
      codes:


      [ref1]: https://wetten.overheid.nl/BWBR0023086#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel11
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel212
    references:
      - id: ref1
        bwb_id: BWBR0023086
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '11'
  - number: 2:12.a
    text: instemming met verdere verwerking van politiegegevens;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel212
  - number: 2:12.b
    text: |-
      vertrouwelijke verwerking als bedoeld in [artikel 2:13, eerste lid, onderdelen a en b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023086#Artikel2
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel212
    references:
      - id: ref1
        bwb_id: BWBR0023086
        artikel: '2'
        paragraaf: '2'
  - number: 2:12.c
    text: |-
      vertrouwelijke verwerking als bedoeld in [artikel 2:13, eerste lid, onderdelen c, d, e en f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023086#Artikel2
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel212
    references:
      - id: ref1
        bwb_id: BWBR0023086
        artikel: '2'
        paragraaf: '2'
  - number: 2:13.1
    text: |-
      Het ter beschikking stellen van politiegegevens kan alleen worden geweigerd of aan beperkende voorwaarden worden
      onderworpen in het geval:
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel213
  - number: 2:13.1.a
    text: |-
      het gegevens betreft omtrent informanten of andere personen als bedoeld in
      [artikel 12, vijfde lid van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel12
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel213
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '12'
  - number: 2:13.1.b
    text: gevaar voor leven of gezondheid van betrokkene of derden is te duchten;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel213
  - number: 2:13.1.c
    text: van een verwerking voor een intern integriteitonderzoek onder verantwoordelijkheid van de korpschef;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel213
  - number: 2:13.1.d
    text: van een verwerking door de rijksrecherche onder verantwoordelijkheid van het College van procureurs-generaal;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel213
  - number: 2:13.1.e
    text: |-
      het gegevens betreft die worden verwerkt op grond van [artikel 10, eerste lid, onderdeel b van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel213
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '10'
  - number: 2:13.1.f
    text: |-
      van een verwerking voor een door het College van procureurs-generaal als embargo-onderzoek aangemerkt onderzoek met
      een zeer groot belang van afscherming vanwege afbreukrisico’s, levensbedreigende risico’s, politieke gevoeligheid
      of publiciteitsgevoeligheid van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel213
  - number: 2:13.2
    text: |-
      De terbeschikkingstelling van persoonsgegevens, die worden verwerkt door de Financiële inlichtingen eenheid, kan
      gemotiveerd worden geweigerd tenzij:
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel213
  - number: 2:13.2.a
    text: |-
      de terbeschikkingstelling van de gegevens plaatsvindt ten behoeve van verdere verwerking met het oog op het doel,
      bedoeld in [artikel 10, eerste lid, onderdeel a, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel213
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '10'
  - number: 2:13.2.b
    text: uit de gegevens zelf een redelijk vermoeden voortvloeit dat een bepaalde persoon een misdrijf heeft begaan;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel213
  - number: 2:13.2.c
    text: |-
      de terbeschikkingstelling van de gegevens plaatsvindt op grond van
      [artikel 16, eerste lid, onderdeel a, van de wet][ref1], en deze gegevens redelijkerwijs van belang kunnen zijn ter
      voorkoming of opsporing van misdrijven als bedoeld in [artikel 3:1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0023086#Artikel3
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel213
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0023086
        artikel: '3'
        paragraaf: '3'
  - number: 2:13.3
    text: |-
      Op een daartoe strekkend verzoek door de Financiële inlichtingen eenheid ter beschikking gestelde persoonsgegevens
      worden slechts verwerkt voor een ander doel dan bedoeld in de [artikelen 8][ref1], [9][ref2], [10][ref3] of
      [13 van de wet][ref4] nadat daartoe toestemming is verleend door het hoofd van de Financiële inlichtingen eenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0022463#Artikel13
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel213
