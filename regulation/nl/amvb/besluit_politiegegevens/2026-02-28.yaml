  - number: 6a:6.3
    text: |-
      Aan de verdere verstrekking van de op grond van het tweede lid verstrekte politiegegevens kunnen door het openbaar
      ministerie nadere voorwaarden worden gesteld. Die voorwaarden kunnen onder meer betreffen het ter beschikking
      stellen of doorgeven van die gegevens of inlichtingen daarover aan derden.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel6a6
  - number: 6a:6.4
    text: |-
      De op grond van het tweede lid verstrekte gegevens worden door de in dat lid genoemde personen en instanties niet
      langer dan gedurende een termijn van twaalf maanden na datum van verkrijgen bewaard. Gegevens die door de leden
      van het openbaar ministerie verder zijn verstrekt, kunnen langer worden bewaard met bijzondere toestemming van het
      openbaar ministerie. Daarbij kunnen nadere voorwaarden worden gesteld.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel6a6
  - number: 6a:6.5
    text: |-
      Politiegegevens die worden verwerkt overeenkomstig de [artikelen 8][ref1], [9][ref2],
      [10, eerste lid, onderdelen a en c][ref3], en [13, eerste lid, van de wet][ref4], kunnen worden verstrekt aan
      Onze Minister van Justitie en Veiligheid en de gezaghebber, ten behoeve van het nemen van een beslissing op grond
      van de [Wapenwet BES][ref5] en de [Vuurwapenwet BES][ref6]. Deze gegevens kunnen tevens worden verstrekt aan een
      bestuursorgaan dat beslist naar aanleiding van een ingesteld administratief beroep.


