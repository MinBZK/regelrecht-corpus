      [363, eerste lid][ref2], van een toekomstig ambtenaar als bedoeld in de artikelen 177, tweede lid en
      363, tweede lid, of van een voormalig ambtenaar als bedoeld in de [artikelen 178a, tweede lid][ref3] en
      [364a, tweede lid van het Wetboek van Strafrecht][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel177
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel363
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel178a
