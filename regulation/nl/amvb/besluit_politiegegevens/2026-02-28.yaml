  - number: 4:1.1
    text: |-
      Politiegegevens die worden verwerkt overeenkomstig
      [artikel 13, eerste lid, onderdeel a en onderdeel d, van de wet][ref1], kunnen, voor zover zij deze behoeven voor
      een goede uitvoering van hun taak, worden verstrekt aan:


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel13
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '13'
  - number: 4:1.1.a
    text: 'de Immigratie- en Naturalisatiedienst, ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel41
  - number: 4:1.1.a.1°
    text: het vaststellen van de identiteit van personen;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel41
  - number: 4:1.1.a.2°
    text: |-
      het nemen van beslissingen omtrent de erkenning als referent en de toelating, het verblijf en de
      ongewenstverklaring als bedoeld in de [Vreemdelingenwet 2000][ref1], en van beslissingen op grond van de
      [Rijkswet op het Nederlanderschap][ref2] of een verdrag dan wel een voor Nederland bindend besluit van een
      volkenrechtelijke organisatie, als bedoeld in [artikel 112 van de Vreemdelingenwet 2000][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0011823
      [ref2]: https://wetten.overheid.nl/BWBR0003738
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel112
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0011823
      - id: ref2
        bwb_id: BWBR0003738
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '112'
  - number: 4:1.1.a.3°
    text: |-
      het opstellen van profielen voor de geautomatiseerde behandeling van aanvragen en voor de uitoefening van het
      toezicht op de naleving van de wettelijke voorschriften met betrekking tot vreemdelingen en tot referenten als
      bedoeld in de [artikelen 47][ref1] en [47a van de Vreemdelingenwet 2000][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel47a
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '47'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 47a
  - number: 4:1.1.b
    text: |-
      luchtvaartmaatschappijen, als bedoeld in [artikel 1, onderdeel h, van de Luchtvaartwet][ref1], voor zover het gaat
      om personalia en gegevens betreffende de datum van retourvervoer ten behoeve van het voorkomen van overtredingen
      van de [Opiumwet][ref2] en de bescherming van de gezondheid van personen door het weigeren van het vervoer van
      personen van en naar bepaald aangewezen buitenlandse bestemmingen en er met de betreffende luchtvaartmaatschappijen
      schriftelijke afspraken zijn gemaakt over de waarborgen rond de gegevensverstrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001941
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001941
  - number: 4:1.1.c
    text: |-
      Onze Minister van Buitenlandse Zaken, ten behoeve van de uitvoering van opdrachten tot signalering van personen
      in het buitenland en het nemen van een beslissing omtrent de afgifte van een paspoort of omtrent de verlening of
      verlenging van een visum;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel41
  - number: 4:1.1.d
    text: |-
      Onze Minister van Asiel en Migratie, ten behoeve van het nemen van een beslissing omtrent de verlening of wijziging
      van een machtiging tot voorlopig verblijf.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel41
  - number: 4:1.2
    text: |-
      De op grond van het eerste lid, onder b verstrekte gegevens met betrekking tot individuele personen worden door de
      luchtvaartmaatschappijen niet langer verwerkt dan gedurende een termijn van ten hoogste zesendertig maanden na de
