      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel273f
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 273f
  - number: 3:2.c
