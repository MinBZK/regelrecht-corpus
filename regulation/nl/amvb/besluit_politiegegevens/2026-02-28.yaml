  - number: 4:6.2
    text: |-
      De op grond van [artikel 4:3, vijfde lid][ref1], te verstrekken politiegegevens aan de korpschef of Onze Minister
      van Defensie kunnen op grond van [artikel 23, derde lid, van de wet][ref2] rechtstreeks worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0023086#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel23
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel46
    references:
