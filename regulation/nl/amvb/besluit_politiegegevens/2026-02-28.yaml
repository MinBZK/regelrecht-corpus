        bwb_id: BWBR0023086
        artikel: '4'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '23'
  - number: 4:7.1
    text: |-
      Politiegegevens, die worden verwerkt op grond van de [artikelen 8][ref1] en [13, eerste lid, van de wet][ref2],
      kunnen slechts worden verstrekt ten behoeve van beleidsinformatie en wetenschappelijk onderzoek en statistiek nadat
      aan de betrokken onderzoeker daartoe schriftelijk toestemming is verleend door:


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel13
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '13'
  - number: 4:7.1.a
    text: |-
      Onze Minister van Justitie en Veiligheid, indien het gegevens betreft die worden verwerkt met het oog op de
      uitvoering van een taak onder het gezag van de officier van justitie, of
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel47
  - number: 4:7.1.b
    text: |-
      de burgemeester, indien het gegevens betreft die worden verwerkt met het oog op de uitvoering van een taak onder
      het gezag van de burgemeester.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel47
  - number: 4:7.2
    text: De toestemming, bedoeld in het eerste lid, wordt slechts gegeven indien
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel47
  - number: 4:7.2.a
    text: het onderzoek het algemeen belang dient;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel47
  - number: 4:7.2.b
    text: de organisatie van de politie niet onnodig wordt belast;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel47
  - number: 4:7.2.c
    text: het onderzoek zonder de betrokken gegevens niet kan worden uitgevoerd, en
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel47
  - number: 4:7.2.d
    text: de persoonlijke levenssfeer van de betreffende personen niet onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel47
  - number: 4:7.3
    text: Aan de toestemming, bedoeld in het eerste lid, kunnen voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel47
  - number: 4:7.4
    text: |-
      De toestemming, bedoeld in het eerste lid, wordt ter kennis gebracht van de betreffende
      verwerkingsverantwoordelijke en geldt als machtiging tot het verstrekken van de omschreven gegevens.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel47
  - number: 4:7.5
    text: |-
      Rechtstreekse benadering van personen, over wie politiegegevens worden verwerkt, door de onderzoeker vindt niet
      plaats, tenzij dit uitdrukkelijk is toegestaan bij de toestemming ingevolge het eerste lid. Deze toestemming kan
      slechts worden verleend indien rechtstreekse benadering voor het doel van het onderzoek onvermijdelijk is.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel47
  - number: 4:7.6
    text: |-
      Indien politiegegevens, als bedoeld in de [artikelen 8][ref1], [9][ref2], [10][ref3] of [13 van de wet][ref4],.op
      grond van [artikel 18, tweede lid, van de wet][ref5] worden verstrekt ten behoeve van het in het eerste lid
      omschreven doel, is het bepaalde in het tweede, derde, vierde en vijfde lid van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0022463#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0022463#Artikel18
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0022463
        artikel: '13'
      - id: ref5
        bwb_id: BWBR0022463
        artikel: '18'
  - number: 4:8
    text: |-
      Bij de verstrekking van politiegegevens aan derden, op grond van de [artikelen 19][ref1] en [20 van de wet][ref2],
      wijst de verwerkingsverantwoordelijke de betrokken personen en instanties op de geheimhoudingsplicht, bedoeld in
      [artikel 7, tweede lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel7
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '20'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '7'
  - number: 5:1.1
    text: |-
      Aan de bevoegde autoriteiten in een derde land of aan internationale organisaties kunnen politiegegevens worden
      doorgegeven onder de algemene voorwaarde dat deze slechts kunnen worden verwerkt voor het doel waarvoor ze zijn
      doorgegeven. In bijzondere gevallen kunnen de doorgegeven gegevens verder worden verwerkt ten behoeve van de
      voorkoming van een onmiddellijke en ernstige bedreiging van de openbare veiligheid. Op verzoek van de ontvangende
      persoon of instantie kan de verwerkingsverantwoordelijke instemmen met de verdere verwerking van doorgegeven
      gegevens voor een ander doel voor zover dit noodzakelijk is voor de goede uitvoering van de politietaak in dat
      land.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel51
  - number: 5:1.2
    text: |-
      De doorgifte van politiegegevens, die worden verwerkt in verband met de strafrechtelijke handhaving van de
      rechtsorde of de handhaving van de openbare orde, vindt plaats door tussenkomst van een landelijke eenheid als
      bedoeld in [artikel 25, eerste lid, onderdeel b, van de Politiewet 2012][ref1]. De doorgifte kan zonder tussenkomst
      van deze landelijke eenheid plaatsvinden overeenkomstig afspraken met politieautoriteiten in het derde land of met
      de betrokken internationale organisatie, voor zover deze afspraken zijn goedgekeurd door Onze Minister van Justitie
      en Veiligheid.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel25
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '25'
  - number: 5:1.3
    text: |-
      Politiegegevens die betrekking hebben op de in [artikel 5 van de wet][ref1] genoemde kenmerken worden slechts
      doorgegeven indien dit met het oog op een juiste beantwoording van een door een buitenlandse politieautoriteit
      gestelde vraag onvermijdelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel5
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '5'
  - number: 5:1.4
    text: |-
      Politiegegevens die worden verwerkt op grond van [artikel 10, eerste lid, onderdeel b, van de wet][ref1] worden
      niet doorgegeven. Doorgifte van gegevens die worden verwerkt op grond van artikel 10, eerste lid, onderdeel a of
      onderdeel c, van de wet vindt slechts plaats na instemming van de betrokken officier van justitie, respectievelijk
      de betrokken burgemeester.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '10'
  - number: 5:1.5
    text: |-
      De gegevens worden verstrekt onder de voorwaarde dat deze door de ontvangende autoriteit worden vernietigd zodra
      de doeleinden zijn verwezenlijkt. Indien dit uit de wet voortvloeit, kunnen bij de verstrekking termijnen worden
      gesteld, na afloop waarvan de verstrekte gegevens door de ontvangende autoriteit moeten worden vernietigd,
      behoudens wanneer verdere verwerking noodzakelijk is voor een lopend onderzoek, de vervolging van strafbare feiten
      of de tenuitvoerlegging van straffen.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel51
  - number: 5:1.6
    text: |-
      Politiegegevens die worden verwerkt door de Financiële inlichtingen eenheid kunnen worden doorgegeven aan van
      overheidswege aangewezen administratieve of politiële meldpunten in derde landen die een vergelijkbare taak hebben
      als het meldpunt. Het bepaalde in het tweede lid vindt geen toepassing.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel51
  - number: 5:1.7
    text: |-
      Als blijkt dat onjuiste gegevens zijn verstrekt deelt de verstrekkende autoriteit dit onverwijld mee aan de
      personen of instanties van de lidstaat aan wie de gegevens zijn verstrekt, met het verzoek de gegevens onmiddellijk
      te corrigeren, te wissen of af te schermen.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel51
  - number: 5:2.1
    text: |-
      Indien politiegegevens zonder voorafgaand verzoek tot doorgifte worden ontvangen van een derde land of van een
      internationale organisatie, beoordeelt de ontvangende autoriteit in Nederland onmiddellijk of deze gegevens
      noodzakelijk zijn voor het doel waarvoor zij zijn doorgegeven.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel52
  - number: 5:2.2
    text: |-
      Indien krachtens het recht van het derde land specifieke beperkingen op de verwerking van politiegegevens gelden,
      ziet de ontvangende autoriteit in Nederland toe op inachtneming van de beperkingen indien deze door de doorgevende
      autoriteit zijn gemeld.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel52
  - number: 5:2.3
    text: |-
      Indien politiegegevens worden ontvangen van een derde land of van een internationale organisatie, wordt de
      doorgevende instantie desgevraagd geïnformeerd over de verwerking van de doorgegeven gegevens en het daardoor
      behaalde resultaat.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel52
  - number: 5:3.1
    text: |-
      Aan personen of instanties in een andere lidstaat van de Europese Unie, die zijn belast met de voorkoming en
      opsporing van strafbare feiten in de betreffende lidstaat, worden politiegegevens doorgezonden onder gelijke
      voorwaarden als aan politieambtenaren in Nederland, voor zover zij deze behoeven voor een goede uitvoering van die
      taak en behoudens de toepassing van de gronden, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel53
  - number: 5:3.2
    text: 'De doorzending kan worden geweigerd of aan beperkende voorwaarden worden onderworpen indien dit:'
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel53
  - number: 5:3.2.a
    text: |-
      een geval betreft als bedoeld in [artikel 2:13][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023086#Artikel2
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0023086
        artikel: '2'
        paragraaf: '2'
  - number: 5:3.2.b
    text: strijdig zou zijn met of schade zou toebrengen aan essentiële nationale veiligheidsbelangen;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel53
  - number: 5:3.2.c
    text: |-
      het welslagen van een lopend onderzoek naar een strafbaar feit of de veiligheid van een persoon in gevaar zou
      brengen;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel53
  - number: 5:3.2.d
    text: de beschermde essentiële belangen van een rechtspersoon disproportioneel zou schaden;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel53
  - number: 5:3.2.e
    text: |-
      betrekking heeft op een strafbaar feit dat in Nederland strafbaar is gesteld met een gevangenisstraf van een jaar
      of minder;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel53
  - number: 5:3.2.f
    text: betrekking heeft op een aangelegenheid die naar Nederlands recht geen strafbaar feit is;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel53
  - number: 5:3.2.g
    text: |-
      betrekking heeft op politiegegevens die uitsluitend kunnen worden doorgezonden na instemming van de officier van
      justitie en deze geen toestemming geeft voor de doorzending;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel53
  - number: 5:3.2.h
    text: |-
      betrekking heeft op politiegegevens die zijn verkregen van een andere lidstaat of van een derde land en deze geen
      toestemming geeft voor de doorzending;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel53
  - number: 5:3.2.i
    text: |-
      betrekking heeft op politiegegevens die niet behoren tot de in deel B van bijlage II bij [Verordening (EU)
      2016/794](32016R0794) opgesomde categorieën persoonsgegevens en niet nodig is voor, en niet in verhouding staat
      tot, het bereiken van het doel waarvoor om doorzending van de gegevens is verzocht.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel53
  - number: 5:3.3
    text: |-
      Aan personen of instanties in een andere lidstaat, als bedoeld in het eerste lid, worden politiegegevens
      doorgezonden, voor zover zij deze behoeven ter voorkoming van strafbare feiten en ter handhaving van de openbare
      orde in verband met grootschalige evenementen. De politiegegevens kunnen uitsluitend worden doorgezonden indien
      definitieve veroordelingen of andere feiten het vermoeden rechtvaardigen dat de desbetreffende personen tijdens
      de evenementen strafbare feiten zullen plegen of dat zij een gevaar voor de openbare orde en veiligheid vormen.
      De politiegegevens worden doorgezonden onder de voorwaarde dat deze worden vernietigd zodra de doeleinden zijn
      verwezenlijkt, in elk geval uiterlijk na één jaar.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel53
  - number: 5:3.4
    text: |-
      De gegevens worden doorgezonden onder de voorwaarde dat deze slechts kunnen worden verwerkt voor het doel waarvoor
      ze zijn doorgezonden.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel53
  - number: 5:3.5
    text: |-
      De gegevens worden doorgezonden onder de voorwaarde dat deze door de ontvangende autoriteit worden vernietigd zodra
      de doeleinden zijn verwezenlijkt.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel53
  - number: 5:3.6
    text: |-
      Indien dit uit de wet voortvloeit kunnen bij de doorzending termijnen worden gesteld, na afloop waarvan de
      doorgezonden gegevens door de ontvangende autoriteit moeten worden vernietigd, behoudens wanneer verdere verwerking
      noodzakelijk is voor een lopend onderzoek, de vervolging van strafbare feiten of de tenuitvoerlegging van straffen.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel53
  - number: 5:3.7
    text: |-
      In afwijking van het vierde lid kunnen in specifieke omstandigheden door de doorzendende autoriteit specifieke
      beperkingen worden gesteld aan de verdere verwerking van de doorgezonden politiegegevens, voor zover deze
      beperkingen ook van toepassing zijn op de beschikbaarstelling van de gegevens aan andere politieambtenaren in
      Nederland.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel53
  - number: 5:3.8
    text: |-
      [Artikel 5:1, tweede, derde en vierde lid][ref1], en [artikel 5:2][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023086#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0023086#Artikel5
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0023086
        artikel: '5'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0023086
        artikel: '5'
        paragraaf: '5'
  - number: 5:3.9
    text: |-
      In de grensgebieden kan de doorzending in verband met de strafrechtelijke handhaving van de rechtsorde
      of de handhaving van de openbare orde zonder tussenkomst van een landelijke eenheid, bedoeld in
      [artikel 25, eerste lid, onderdeel b, van de Politiewet 2012][ref1], plaatsvinden voor zover dit voortvloeit uit
      een verdrag waarbij ook België of Duitsland als verdragsluitende partij betrokken zijn of uit een besluit, bedoeld
      in artikel 34, tweede lid, van het Verdrag betreffende de werking van de Europese Unie. Op doorzending in de
      grensgebieden waarvoor geen tussenkomst van een landelijke eenheid, bedoeld in de vorige volzin, vereist is, is het
      tweede lid niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel25
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '25'
  - number: 5:3.10
    text: |-
      Op een daartoe strekkend verzoek van de personen of instanties, bedoeld in het eerste lid, vindt doorzending van
      door de Financiële inlichtingen eenheid ter beschikking gestelde persoonsgegevens voor het gebruik van die gegevens
      voor een ander doel dan bedoeld in de [artikelen 8][ref1], [9][ref2], [10][ref3] of [13 van de wet][ref4] slechts
      plaats nadat daartoe toestemming is verleend door het hoofd van de Financiële inlichtingen eenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0022463#Artikel13
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0022463
        artikel: '13'
  - number: 5:3.11
    text: |-
      De doorzending van politiegegevens met het oog op het voorkomen, onderzoeken, opsporen of vervolgen van
      terroristische misdrijven als bedoeld in de [artikelen 83][ref1] en [83b van het Wetboek van Strafrecht][ref2],
      blijft voor zover het de personen betreft, bedoeld in bijlage II, deel B, punt 1, onder a en b, bij [Verordening
      (EU) 2016/794](32016R0794) van 11 mei 2016, beperkt tot de categorieën persoonsgegevens die zijn vermeld in bijlage
      II, deel B, punt 2, bij die verordening. De vorige zin is niet van toepassing voor zover het doorzenden van de
      gegevens voortvloeit uit een rechtsinstrument betreffende de wederzijdse erkenning van beslissingen in strafzaken
      op grond van het verdrag betreffende de werking van de Europese Unie of om het doorzenden van de gegevens is
      verzocht op grond van een toepasselijk verdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel83b
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '83'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 83b
  - number: 5:4
    text: |-
      Indien politiegegevens worden ontvangen van een andere lidstaat van de Europese Unie ten aanzien van de verwerking
      waarvan door de bevoegde autoriteit van de doorzendende lidstaat op grond van het nationale recht specifieke
      voorwaarden zijn gesteld en de ontvangende autoriteit daarvan in kennis is gesteld, ziet de ontvangende bevoegde
      autoriteit in Nederland toe op de naleving van die voorwaarden.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel54
  - number: 5:5.1
    text: |-
      Doorzending van politiegegevens betreffende de voorkoming en opsporing van strafbare feiten, aan
      politieautoriteiten in een andere lidstaat van de Europese Unie kan rechtstreeks plaatsvinden door middel van de
      geautomatiseerde vergelijking van de categorieën van politiegegevens, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel55
  - number: 5:5.2
    text: |-
      De vergelijking van gegevens, bedoeld in het eerste lid, vindt plaats in afzonderlijke gevallen en betreft
      dactyloscopische gegevens.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel55
  - number: 5:5.3
    text: |-
      Indien bij de gegevensvergelijking wordt vastgesteld dat gegevens overeenkomen dan worden
      uitsluitend de overeenkomende gegevens doorgezonden. Voor doorzending van nadere, met betrekking
      tot de overeenkomende gegevens beschikbare persoon- of zaaksgegevens is een verzoek, als bedoeld in
      [artikel 5.1.1 van het Wetboek van Strafvordering][ref1], vereist. De verdere verwerking van de doorgezonden
      politiegegevens is uitsluitend toegestaan met het oog op:


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel5
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '5'
  - number: 5:5.3.a
    text: de vaststelling of de vergeleken profielen overeenstemmen;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel55
  - number: 5:5.3.b
    text: de voorbereiding en indiening van een verzoek om rechtshulp;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel55
  - number: 5:5.3.c
    text: de protocollering van de gegevens.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel55
  - number: 5:5.4
    text: |-
      De doorzending vindt uitsluitend plaats aan ambtenaren die werkzaam zijn bij daartoe aangewezen nationale politiële
      contactpunten en die zijn geautoriseerd voor de geautomatiseerde vergelijking van de politiegegevens. De lijst van
      ambtenaren, die zijn geautoriseerd tot de geautomatiseerde bevraging of vergelijking als bedoeld in het eerste lid,
      wordt desgevraagd ter beschikking gesteld aan de andere lidstaten en aan de Autoriteit persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel55
  - number: 5:5.5
    text: |-
      [Artikel 23, vierde lid, van de wet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel23
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '23'
  - number: 5:6.1
    text: |-
      Aan de politieambtenaar uit een andere lidstaat van de Europese Unie, die is toegevoegd aan een gemeenschappelijk
      onderzoeksteam als bedoeld in [artikel 5.2.1 van het Wetboek van Strafvordering][ref1] dat is gevestigd in
      Nederland, kunnen politiegegevens worden doorgezonden op gelijke voet als aan Nederlandse politieambtenaren, voor
      zover zij deze behoeven voor de doeleinden waarvoor het gemeenschappelijke onderzoeksteam is ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel5
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '5'
  - number: 5:6.2
    text: |-
      Aan de Nederlandse politieambtenaar die is toegevoegd aan een gemeenschappelijk onderzoeksteam als bedoeld in
      [artikel 5.2.1 van het Wetboek van Strafvordering][ref1] dat is gevestigd in een andere lidstaat van de Europese
      Unie, kunnen politiegegevens worden doorgezonden met het oog op de gebruikmaking daarvan voor de doeleinden
      waarvoor het gemeenschappelijke onderzoeksteam is ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel5
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '5'
  - number: 5:7.1
    text: |-
      De doorzending van politiegegevens aan Europol vindt plaats door tussenkomst van een landelijke eenheid, bedoeld in
      [artikel 5:1, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023086#Artikel5
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0023086
        artikel: '5'
        paragraaf: '5'
  - number: 5:7.2
    text: 'De doorzending van politiegegevens aan Europol kan worden geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel57
  - number: 5:7.2.a
    text: wezenlijke nationale veiligheidsbelangen worden geschaad,
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel57
  - number: 5:7.2.b
    text: het welslagen van lopende onderzoeken of de veiligheid van personen in gevaar wordt gebracht, of
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel57
  - number: 5:7.2.c
    text: |-
      informatie wordt bekend gemaakt die betrekking heeft op specifieke inlichtingendiensten of -activiteiten op het
      gebied van de staatsveiligheid.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel57
  - number: 5:7.3
    text: |-
      De doorzending van politiegegevens aan Europol met het oog op het voorkomen, onderzoeken, opsporen of vervolgen van
      terroristische misdrijven als bedoeld in [artikel 83][ref1] en [83b van het wetboek van Strafrecht][ref2] en andere
      strafbare feiten die vallen onder de bevoegdheid van Europol, zoals vermeld in bijlage I bij [Verordening (EU)
      2016/794](32016R0794) van 11 mei 2016, blijft voor zover het de personen betreft, bedoeld in bijlage II, deel B,
      punt 1, onder a en b, bij die verordening, beperkt tot de categorieën persoonsgegevens die zijn vermeld in bijlage
      II, deel B, punt 2, bij die verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel83b
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '83'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 83b
  - number: 5:7.4
    text: |-
      [Artikel 2:13, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023086#Artikel2
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0023086
        artikel: '2'
        paragraaf: '2'
  - number: 5:7a
    text: |-
      Politiegegevens betreffende terroristische misdrijven als bedoeld in de [artikelen 83][ref1] en
      [83b van het Wetboek van Strafrecht][ref2] die via Europol van andere lidstaten worden ontvangen en twee of
      meer lidstaten treffen of kunnen treffen, worden uitsluitend verwerkt met het oog op het voorkomen, onderzoeken,
      opsporen of vervolgen van die misdrijven en andere strafbare feiten die vallen onder de bevoegdheid van Europol,
      zoals vermeld in bijlage I bij [Verordening (EU) 2016/794](32016R0794) van 11 mei 2016.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel83b
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel57a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '83'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 83b
  - number: 5:8.1
    text: De doorzending van politiegegevens aan Eurojust vindt plaats door tussenkomst van het nationale lid van Eurojust.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel58
  - number: 5:8.2
    text: |-
      De doorzending van politiegegevens aan Eurojust kan worden geweigerd indien wezenlijke nationale
      veiligheidsbelangen worden geschaad of de veiligheid van personen in gevaar wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel58
  - number: 5:8.3
    text: |-
      Politiegegevens worden doorgezonden aan het nationale lid van Eurojust, voor zover hij deze behoeft in verband
      met de uit een rechtsinstrument op grond van het Verdrag betreffende de werking van de Europese Unie voortkomende
      doelstelling en taken van deze organisatie. Het tweede lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel58
  - number: 6:1.1
    text: |-
      Het bepaalde in [artikel 12, eerste lid, van de wet][ref1] is van overeenkomstige toepassing op de volgende
      categorieën van personen:


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel12
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '12'
  - number: 6:1.1.a
    text: infiltranten;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel61
  - number: 6:1.1.b
    text: |-
      personen die in aanmerking zijn gebracht voor beschermingsmaatregelen, als bedoeld in het
      [Besluit getuigenbescherming][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019359
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0019359
  - number: 6:1.2
    text: 'De verwerking, als bedoeld in het eerste lid, onderdeel a, vindt slechts plaats omtrent:'
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel61
  - number: 6:1.2.a
    text: verdachten;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel61
  - number: 6:1.2.b
    text: |-
      personen in de omgeving van de verdachte wier handelen van invloed kan zijn op het doel van de verwerking, als
      bedoeld in het eerste lid, en de bescherming van de infiltrant;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel61
  - number: 6:1.2.c
    text: infiltranten;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel61
  - number: 6:1.2.d
    text: begeleiders;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel61
  - number: 6:1.2.e
    text: opsporingsambtenaren;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel61
  - number: 6:1.2.f
    text: leden van het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel61
  - number: 6:1.3
    text: 'De verwerking, als bedoeld in het eerste lid, onderdeel b, vindt slechts plaats omtrent:'
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel61
  - number: 6:1.3.a
    text: getuigen ten aanzien van wie een dreiging bestaat;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel61
  - number: 6:1.3.b
    text: personen in de omgeving van de getuigen;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel61
  - number: 6:1.3.c
    text: verdachten;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel61
  - number: 6:1.3.d
    text: |-
      personen in de omgeving van de verdachte wier handelen van invloed kan zijn op het doel van de verwerking, als
      bedoeld in het eerste lid, en de bescherming van de getuige;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel61
  - number: 6:1.3.e
    text: begeleiders;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel61
  - number: 6:1.3.f
    text: opdrachtgevers.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel61
  - number: 6:1a.1
    text: |-
      De verwerkingsverantwoordelijke evalueert en actualiseert de maatregelen, bedoeld in
      [artikel 4a, eerste lid, onderdeel a, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel4a
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel61a
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: 4a
  - number: 6:1a.2
    text: |-
      Wanneer zulks in verhouding staat tot de verwerkingsactiviteiten omvatten de maatregelen, bedoeld in het eerste
      lid, de uitvoering van een passend gegevensbeschermingsbeleid door de verwerkingsverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel61a
  - number: 6:1a.3
    text: 'De verwerkingsverantwoordelijke of de verwerker treft, na beoordeling van de risico’s, maatregelen om:'
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel61a
  - number: 6:1a.3.a
    text: te verhinderen dat onbevoegden toegang krijgen tot apparatuur voor de verwerking van persoonsgegevens;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel61a
  - number: 6:1a.3.b
    text: te verhinderen dat onbevoegden gegevensdragers lezen, kopiëren, wijzigen of verwijderen;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel61a
  - number: 6:1a.3.c
    text: te verhinderen dat onbevoegden gegevens invoeren of opgeslagen persoonsgegevens inzien, wijzigen of verwijderen;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel61a
  - number: 6:1a.3.d
    text: |-
      te verhinderen dat onbevoegden systemen voor geautomatiseerde gegevensverwerking gebruiken met behulp van
      datatransmissieapparatuur;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel61a
  - number: 6:1a.3.e
    text: |-
      ervoor te zorgen dat personen die geautoriseerd zijn om een systeem voor geautomatiseerde gegevensverwerking te
      gebruiken, uitsluitend toegang hebben tot de gegevens waarop hun autorisatie betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel61a
  - number: 6:1a.3.f
    text: |-
      ervoor te zorgen dat kan worden nagegaan en vastgesteld aan welke organen persoonsgegevens zijn of kunnen worden
      verstrekt of beschikbaar gesteld met behulp van datatransmissieapparatuur;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel61a
  - number: 6:1a.3.g
    text: |-
      ervoor te zorgen dat later kan worden nagegaan en vastgesteld welke persoonsgegevens wanneer en door wie in een
      systeem voor geautomatiseerde gegevensverwerking zijn ingevoerd;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel61a
  - number: 6:1a.3.h
    text: |-
      te verhinderen dat onbevoegden persoonsgegevens lezen, kopiëren, wijzigen of verwijderen tijdens de doorgifte van
      persoonsgegevens of het vervoer van gegevensdragers;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel61a
  - number: 6:1a.3.i
    text: ervoor te zorgen dat de geïnstalleerde systemen in geval van storing opnieuw kunnen worden ingezet;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel61a
  - number: 6:1a.3.j
    text: |-
      ervoor te zorgen dat de functies van het systeem werken, dat eventuele functionele storingen worden gesignaleerd en
      dat opgeslagen persoonsgegevens niet kunnen worden beschadigd door het verkeerd functioneren van het systeem.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel61a
  - number: 6:1b
    text: |-
      De inhoud van de overeenkomst of rechtshandeling, bedoeld in [artikel 6c, tweede lid, van de wet][ref1]
      bevat het onderwerp en de duur van de verwerking, de aard en het doel van de verwerking, het soort gegevens
      waarop de wet van toepassing is, de categorieën van betrokkenen en de verplichtingen en de rechten van de
      verwerkingsverantwoordelijke, en met name wordt daarin bepaald dat de verwerker:


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel6c
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel61b
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: 6c
  - number: 6:1b.a
    text: uitsluitend volgens de instructies van de verwerkingsverantwoordelijke handelt;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel61b
  - number: 6:1b.b
    text: |-
      er zorg voor draagt dat de tot het verwerken van politiegegevens gemachtigde personen zich ertoe hebben verplicht
      vertrouwelijkheid in acht te nemen of door een passende wettelijke verplichting daaraan gebonden zijn;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel61b
  - number: 6:1b.c
    text: |-
      de verwerkingsverantwoordelijke met passende middelen bijstaat om naleving van de bepalingen betreffende de rechten
      van de betrokkene te verzekeren;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel61b
  - number: 6:1b.d
    text: |-
      na afloop van de gegevensverwerkingsdiensten, naargelang de keuze van de verwerkingsverantwoordelijke, alle
      gegevens wist of hem deze ter beschikking stelt, en bestaande kopieën verwijdert, tenzij opslag van die gegevens
      verplicht is;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel61b
  - number: 6:1b.e
    text: |-
      de verwerkingsverantwoordelijke alle informatie ter beschikking stelt die nodig is om nakoming van in dit artikel
      gestelde voorschriften aan te tonen;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel61b
  - number: 6:1b.f
    text: |-
      aan de in dit artikel gestelde voorschriften voldoet bij de inschakeling van een andere verwerker en bij die
      inschakeling overeenkomstig [artikel 6c, vierde lid, van de wet][ref1], handelt.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel6c
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel61b
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: 6c
  - number: 6:2
    text: |-
      Over de verwerkingen bedoeld in [artikel 13, eerste, tweede en derde lid, van de wet][ref1], wordt tevoren
      schriftelijk vastgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel13
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '13'
  - number: 6:2.a
    text: ten behoeve van welk specifiek doel ter ondersteuning van de politietaak de gegevens verder worden verwerkt;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel62
  - number: 6:2.b
    text: |-
      de categorieën van personen over wie gegevens ten behoeve van het betreffende doel verder worden verwerkt en de
      soorten van de over hen op te nemen gegevens;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel62
  - number: 6:2.c
    text: de termijn waarbinnen dan wel de gevallen waarin het verder verwerken van de betreffende gegevens wordt beëindigd;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel62
  - number: 6:2.d
    text: |-
      de frequentie waarmee de gegevens ter voldoening aan de onder c bedoelde verplichting tot beëindiging van de
      verwerking worden gecontroleerd;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel62
  - number: 6:2.e
    text: de verantwoordelijke of verantwoordelijken die de gegevens verder verwerken;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel62
  - number: 6:2.f
    text: indien sprake is van een bewerker, degene die als bewerker optreedt.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel62
  - number: 6:4.1
    text: |-
      De schriftelijke vastlegging van het doel van het onderzoek, bedoeld in [artikel 9, tweede lid, van de wet][ref1],
      omvat een omschrijving van het onderwerp waar het onderzoek op is gericht en op welk deel van de uitoefening van de
      politietaak het onderzoek betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel9
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '9'
  - number: 6:4.2
    text: |-
      Indien politiegegevens op grond van [paragraaf 3 van de wet][ref1] worden verstrekt, worden van die verstrekking de
      volgende gegevens vastgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Paragraaf3
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0022463
        paragraaf: '3'
  - number: 6:4.2.a
    text: de identiteit van de verzoeker;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel64
  - number: 6:4.2.b
    text: de datum van de verstrekking;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel64
  - number: 6:4.2.c
    text: een omschrijving van de verstrekte gegevens;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel64
  - number: 6:4.2.d
    text: het doel van de verstrekking.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel64
  - number: 6:4.3
    text: |-
      Indien politiegegevens op grond van [paragraaf 3 van de wet][ref1] rechtstreeks langs geautomatiseerde weg, als
      bedoeld in [artikel 23, tweede lid, van de wet][ref2] worden verstrekt, worden van die verstrekking de volgende
      gegevens vastgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Paragraaf3
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel23
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0022463
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '23'
  - number: 6:4.3.a
    text: een uniek kenmerk van de verzoeker;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel64
  - number: 6:4.3.b
    text: de gegevens die ten behoeve van de gegevensvergelijking door de verzoeker zijn ingebracht;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel64
  - number: 6:4.3.c
    text: |-
      de gegevens op grond waarvan kan worden nagegaan welke gegevens naar aanleiding van de gegevensvergelijking zijn
      verstrekt inclusief de mededeling van het niet voorhanden zijn van een gegeven;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel64
  - number: 6:4.3.d
    text: de datum en het tijdstip van de verstrekking.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel64
  - number: 6:4.4
    text: |-
      De verplichtingen van het tweede en derde lid zijn niet van toepassing op de verstrekking van gegevens op grond van
      [artikel 16, eerste lid, onderdeel a, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel16
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '16'
  - number: 6:5.1
    text: |-
      Twee jaren na inwerkingtreding van de [wet][ref1], en vervolgens eenmaal in de vier jaren, laat de
      verwerkingsverantwoordelijke de uitvoering van de bij of krachtens de [wet][ref2] gegeven regels door een privacy
      audit controleren, op bij ministeriële regeling te bepalen wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0022463
      [ref2]: https://wetten.overheid.nl/BWBR0022463
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0022463
      - id: ref2
        bwb_id: BWBR0022463
  - number: 6:5.2
    text: |-
      De controle heeft betrekking op de wijze waarop het verwerken van politiegegevens is georganiseerd, de maatregelen
      en procedures die daarop van toepassing zijn en de werking van deze maatregelen en procedures.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel65
  - number: 6:5.3
    text: |-
      Een onafhankelijke auditor die voldoet aan de bij ministeriële regeling te stellen eisen van werkwijze,
      deskundigheid en betrouwbaarheid voert de controle uit.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel65
  - number: 6:5.4
    text: |-
      De hercontrole, bedoeld in [artikel 33, derde lid, van de wet][ref1], vindt plaats op bij ministeriële regeling te
      bepalen wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel33
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '33'
  - number: 6:5.5
    text: |-
      Bij ministeriële regeling kan bepaald worden dat ter voorbereiding op de controle, bedoeld in het eerste lid,
      interne audits plaatsvinden en kunnen regels worden gesteld over de wijze waarop deze audits worden verricht.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel65
  - number: 6:6.1
    text: 'Bij de Financiële inlichtingen eenheid worden persoonsgegevens verwerkt over de volgende categorieën van personen:'
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel66
  - number: 6:6.1.a
    text: |-
      personen ten aanzien van wie een melding heeft plaatsgevonden van een verrichte of voorgenomen ongebruikelijke
      transactie;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel66
  - number: 6:6.1.b
    text: |-
      personen die als opdrachtgever, begeleider, tussenpersoon, begunstigde of lastgever betrokken zijn bij een
      verrichte of voorgenomen ongebruikelijke transactie;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel66
  - number: 6:6.1.c
    text: |-
      personen, ten aanzien van wie een redelijk vermoeden bestaat van het plegen van een misdrijf en personen die
      zijn veroordeeld terzake van het plegen van een misdrijf, indien noodzakelijk voor het doel van de Financiële
      inlichtingen eenheid;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel66
  - number: 6:6.1.d
    text: |-
      personen, die betrokken zijn bij een verrichte of voorgenomen financiële transactie, ten aanzien waarvan een melding
      heeft plaatsgevonden op grond van de [Wet ter voorkoming van witwassen en financieren van terrorisme BES][ref1] of
      bij een meldpunt in een land binnen het Koninkrijk of in een ander land;


      [ref1]: https://wetten.overheid.nl/BWBR0030824
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0030824
  - number: 6:6.1.e
    text: personen, die betrokken zijn bij een verdachte transactie;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel66
  - number: 6:6.1.f
    text: |-
      personen, die werkzaam zijn bij de Financiële inlichtingen eenheid, bij de politie, bij justitie, bij een instantie
      belast met het toezicht op de personen en instellingen die onder de wettelijke meldplicht vallen dan wel met enige
      publiekrechtelijke taak, bij een instelling of bij een buitenlands meldpunt, die als contactpersoon optreden voor
      wat betreft de verstrekking van gegevens door of aan het meldpunt;
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel66
  - number: 6:6.1.g
    text: |-
      personen, ten aanzien van wie een voor het doel van het meldpunt relevante relatie met een gemelde ongebruikelijke
      transactie bekend is geworden of vermoedelijk bekend zal worden, en deze relatie een andere is dan die bedoeld in
      de voorgaande onderdelen.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel66
  - number: 6:6.2
    text: |-
      De gegevens, bedoeld in het eerste lid, worden verwijderd zodra zij niet langer noodzakelijk zijn voor het doel van
      de verwerking. De gegevens worden vernietigd uiterlijk vijf jaar na de datum van laatste opneming.
    url: https://wetten.overheid.nl/BWBR0023086/2026-02-28#Artikel66
  - number: 6a:1
    text: |-
