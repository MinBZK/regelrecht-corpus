  - number: 4:4
    text: |-
      Politiegegevens die worden verwerkt overeenkomstig de [artikelen 8][ref1], [9][ref2], [10][ref3] en
      [13 van de wet][ref4] kunnen, voor zover zij deze behoeven voor een goede uitvoering van hun taak, worden verstrekt
      aan Onze Minister van Justitie en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties ten behoeve van:

        - het verrichten van dreiging- en risico-evaluaties en het vaststellen van bewaking- en beveiligingsopdrachten en
      adviezen door de evaluatiedriehoek, met het oog op het bewaken en beveiligen van personen, objecten en diensten;
        - het nemen van een beslissing omtrent een maatregel strekkende tot beperking van de vrijheid van beweging, als
      voorzien in de Wet bestuurlijke maatregelen nationale veiligheid.


