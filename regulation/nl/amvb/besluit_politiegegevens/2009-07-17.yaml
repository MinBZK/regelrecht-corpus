      1 Over de verwerkingen bedoeld in [artikel 13, eerste, tweede en derde lid, van de wet][ref1], wordt tevoren
      schriftelijk vastgelegd:

      a. ten behoeve van welk specifiek doel ter ondersteuning van de politietaak de gegevens verder worden verwerkt;

      b. de categorieën van personen over wie gegevens ten behoeve van het betreffende doel verder worden verwerkt en de
      soorten van de over hen op te nemen gegevens;

      c. de termijn waarbinnen dan wel de gevallen waarin het verder verwerken van de betreffende gegevens wordt
      beëindigd;

      d. de frequentie waarmee de gegevens ter voldoening aan de onder c bedoelde verplichting tot beëindiging van de
      verwerking worden gecontroleerd;

      e. de verantwoordelijke of verantwoordelijken die de gegevens verder verwerken;

      f. indien sprake is van een bewerker, degene die als bewerker optreedt.

      2 Over de verwerkingen bedoeld in [artikel 13, eerste lid, van de wet][ref2], wordt bovendien tevoren schriftelijk
      vastgelegd welke van de betreffende gegevens voor de korpsen rechtstreeks raadpleegbaar worden gesteld en welke aan
      de korpsen ter beschikking worden gesteld voor zover zij deze nodig hebben voor de uitvoering van de politietaak.

      3 De op grond van het eerste en tweede lid schriftelijk vastgelegde gegevens worden ter inzage gelegd gedurende de
      tijd dat de gegevens ingevolge [artikel 32, derde lid, van de wet][ref3] beschikbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel13
