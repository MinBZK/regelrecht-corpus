    text: |-
      1 Politiegegevens, die worden verwerkt op grond van de [artikelen 8][ref1] en [13, eerste lid, van de wet][ref2],
      kunnen slechts worden verstrekt ten behoeve van beleidsinformatie en wetenschappelijk onderzoek en statistiek nadat
      aan de betrokken onderzoeker daartoe schriftelijk toestemming is verleend door:

      a. Onze Minister van Justitie, indien het gegevens betreft die worden verwerkt met het oog op de uitvoering van een
      taak onder het gezag van de officier van justitie, of

      b. de burgemeester, indien het gegevens betreft die worden verwerkt met het oog op de uitvoering van een taak onder
      het gezag van de burgemeester.

      2 De toestemming, bedoeld in het eerste lid, wordt slechts gegeven indien

      a. het onderzoek het algemeen belang dient;

      b. de organisatie van de politie niet onnodig wordt belast;

      c. het onderzoek zonder de betrokken gegevens niet kan worden uitgevoerd, en

      d. de persoonlijke levenssfeer van de betreffende personen niet onevenredig wordt geschaad.

      3 Aan de toestemming, bedoeld in het eerste lid, kunnen voorwaarden worden verbonden.

      4 De toestemming, bedoeld in het eerste lid, wordt ter kennis gebracht van de betreffende verantwoordelijke en
      geldt als machtiging tot het verstrekken van de omschreven gegevens.

      5 Rechtstreekse benadering van personen, over wie politiegegevens worden verwerkt, door de onderzoeker vindt niet
      plaats, tenzij dit uitdrukkelijk is toegestaan bij de toestemming ingevolge het eerste lid. Deze toestemming kan
      slechts worden verleend indien rechtstreekse benadering voor het doel van het onderzoek onvermijdelijk is.

      6 Indien politiegegevens, als bedoeld in de [artikelen 8][ref3], [9][ref4], [10][ref5] of
      [13 van de wet][ref6],.op grond van [artikel 18, tweede lid, van de wet][ref7] worden verstrekt ten behoeve van het
      in het eerste lid omschreven doel, is het bepaalde in het tweede, derde, vierde en vijfde lid van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel13
