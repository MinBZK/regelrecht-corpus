    text: |-
      1 Politiegegevens die worden verwerkt overeenkomstig de [artikelen 8][ref1], [9][ref2],
      [10, eerste lid, onderdelen a en c][ref3] en [13 van de wet][ref4] kunnen, voor zover zij deze behoeven voor een
      goede uitvoering van hun taak, worden verstrekt aan:

      a. Onze Minister van Justitie, ten behoeve van:

        - het afgeven van een verklaring van geen bezwaar in verband met de oprichting van een naamloze of besloten
      vennootschap dan wel de wijziging van de statuten daarvan;
        - de uitvoering van [artikel 5, eerste lid, van de Gratiewet][ref5];
        - de beoordeling van de benoeming, de herbenoeming of het ontslag van de leden van de commissies van toezicht bij
      de inrichtingen, bedoeld in onderdeel d;
        - het afgeven van een verklaring omtrent het gedrag, bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref6];
        - de taakuitvoering van het Meldpunt Ongebruikelijke Transacties.

      b. de burgemeester ten behoeve van de beoordeling van een verzoek tot het verkrijgen van het Nederlanderschap op
      grond van de Rijkswet op het Nederlanderschap;

      c. de directeuren van inrichtingen, bedoeld in
      [artikel 1, onderdeel b, van de Penitentiaire beginselenwet][ref7], van de inrichtingen, bedoeld in
      [artikel 1, onderdeel b, van de Beginselenwet verpleging ter beschikking gestelden en van de inrichtingen][ref8],
      bedoeld in [artikel 1, onderdeel b, van de Beginselenwet justitiële jeugdinrichtingen][ref9], en functionarissen
      van de Dienst Justitiële inrichtingen van het Ministerie van Justitie, ten behoeve van:

      1. het nemen van beslissingen over hetzij de aanstelling of het ontslag van personeel, hetzij de toelating tot de
      inrichting van personen die niet worden ingesloten in de inrichting, voor zover dat noodzakelijk is voor de orde of
      veiligheid in de inrichting respectievelijk de voorziening;

      2. het nemen van beslissingen over het verlaten van de inrichting bij wijze van verlof;

      3. het nemen van beslissingen over de erkenning van een penitentiair programma, bedoeld in
      [artikel 4, eerste lid, van de Penitentiaire beginselenwet][ref10], of een scholing- en trainingprogramma, bedoeld
      in [artikel 3, eerste lid, van de Beginselenwet justitiële inrichtingen][ref11];

      4. het treffen van maatregelen met betrekking tot de voorkoming van strafbare feiten door of met betrekking
      tot gedetineerden, de handhaving van de orde en veiligheid in de justitiële inrichting, of de ongestoorde
      tenuitvoerlegging van de vrijheidsbeneming.

      d. de commandant van de Koninklijke marechaussee, ten behoeve van de uitoefening van de bevoegdheid, bedoeld in
      [artikel 37s van de Luchtvaartwet][ref12];

      e. de korpschef van een regionaal politiekorps, ten behoeve van zijn adviserende taak in het kader van de
      uitvoering van [artikel 3.3.2 van het Vuurwerkbesluit][ref13];

      f. het bevoegde gezag, bedoeld in
      [artikel 1, eerste lid, onderdeel l, van het Besluit algemene rechtspositie politie][ref14] en het bevoegde
      gezag, bedoeld in [artikel 1, eerste lid, onderdeel e, van het Besluit rechtspositie vrijwillige politie][ref15],
      ten behoeve van het verrichten van een onderzoek als bedoeld in [artikel 8a, eerste lid][ref16], en
      [artikel 8b, eerste lid, van het Besluit algemene rechtspositie politie][ref17] en [artikel 4a, eerste lid][ref18],
      en [artikel 4b, eerste lid, van het Besluit rechtspositie vrijwillige politie][ref19], of voor het
      verrichten van een onderzoek naar de betrouwbaarheid en geschiktheid ten aanzien van personen die
      anderszins werkzaamheden verrichten voor een politiekorps, een voorziening tot samenwerking als bedoeld in
      [artikel 1, eerste lid, onderdeel g, van het Besluit algemene rechtspositie politie][ref20], het Landelijk
      selectie- en opleidingsinstituut politie, het Politie onderwijs- en kenniscentrum of de rijksrecherche en waarvoor
      de gezagdragende instanties justitiële gegevens als bedoeld in het [Besluit justitiële gegevens][ref21] vragen;

      g. het Bureau bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref22], ten behoeve van de
      uitoefening van de in [die wet][ref23] aan het bureau opgedragen taak;

      h. de Immigratie- en Naturalisatiedienst, ten behoeve van het nemen van beslissingen omtrent de toelating,
      het verblijf of de ongewenstverklaring, als bedoeld in de [Vreemdelingenwet 2000][ref24], de Rijkswet op het
      Nederlanderschap of een verdrag dan wel een voor Nederland bindend besluit van een volkenrechtelijke organisatie,
      als bedoeld in [artikel 112 van de Vreemdelingenwet 2000][ref25];

      i. de burgemeester en de commissaris van de Koning, ten behoeve van hun adviserende taak, bedoeld in het
      [Reglement op de Orde van de Nederlandsche Leeuw en de Orde van Oranje-Nassau][ref26];

      j. gedragsdeskundigen, voor zover het betreft auditieve of audiovisuele registraties van het verhoor van een
      persoon naar aanleiding van een ernstig strafbaar feit, voor het beoordelen van het verhoor en het opstellen van
      een deskundigenrapportage ten behoeve van het strafrechtelijk onderzoek, het gerechtelijk vooronderzoek of het
      onderzoek ter terechtzitting.

      2 Politiegegevens, als bedoeld in het eerste lid, kunnen worden verstrekt aan leden van het openbaar ministerie ten
      behoeve van de adviserende taak in het kader van de uitvoering van de hierna te noemen wetten en, door tussenkomst
      van het openbaar ministerie in het kader van vorenbedoelde taak, verder worden verstrekt aan de hierna te noemen
      personen of instanties:

      a. de Nederlandsche Bank, ten behoeve van:

        - het verkrijgen van inzicht in de voornemens, handelingen en antecedenten, bedoeld
      in [artikel 5 van het Besluit prudentiële regels Wft][ref27], ter vaststelling van
      de betrouwbaarheid van een persoon, als bedoeld in [artikel 3:9, derde lid][ref28], en
      [artikel 3:99, derde lid van de Wet op het financieel toezicht][ref29];
        - het verkrijgen van inzicht in de voornemens, handelingen en antecedenten, bedoeld in
      [artikel 2 van de Beleidsregel betrouwbaarheidstoetsing][ref30], ter vaststelling van de betrouwbaarheid van
      personen, als bedoeld in [artikel 4][ref31] en [11, van de Wet toezicht trustkantoren][ref32];
        - het verkrijgen van inzicht in de voornemens, handelingen en antecedenten, bedoeld in
      [artikel 31 van het Besluit uitvoering Pensioenwet][ref33] en [Besluit verplichte beroepspensioenregeling][ref34],
      ter vaststelling van de betrouwbaarheid van personen, als bedoeld in
      [artikel 105, vijfde lid van de Pensioenwet][ref35] en artikel 110, vijfde lid van het Besluit verplichte
      beroepspensioenregeling.

      b. Onze Minister van Financiën, ten behoeve van het verkrijgen van inzicht in de voornemens, handelingen
      en antecedenten, bedoeld in [artikel 2 van de Beleidsregel betrouwbaarheidstoetsing][ref36], ter
      vaststelling van de betrouwbaarheid van personen, als bedoeld in [artikelen 2][ref37], [4][ref38] en
      [5 van de Wet inzake de geldtransactiekantoren][ref39];

      c. de Autoriteit Financiële Markten, ten behoeve van:

        - het verkrijgen van inzicht in de voornemens, handelingen en antecedenten, bedoeld
      in [artikel 10 van het Besluit gedragstoezicht financiële ondernemingen Wft][ref40],
      ter vaststelling van de betrouwbaarheid van een persoon, als bedoeld in
      [artikel 4:10, derde lid van de Wet op het financieel toezicht][ref41];
        - het verkrijgen van inzicht in de voornemens, handelingen en antecedenten, bedoeld in artikel 2
      van de Beleidsregel 06-01 inzake de betrouwbaarheidstoetsing van (kandidaat)(mede)beleidsbepalers
      van accountantsorganisaties, ter vaststelling van de betrouwbaarheid van personen, als bedoeld in
      [artikel 15 van de Wet toezicht accountantsorganisaties][ref42] en de [artikelen 5][ref43], [6][ref44] en
      [7 van het Besluit toezicht accountantsorganisaties][ref45].

      3 Aan de verdere verstrekking van de op grond van het tweede lid verstrekte politiegegevens kunnen door het
      openbaar ministerie nadere voorwaarden worden gesteld. Die voorwaarden kunnen onder meer betreffen het ter
      beschikking stellen of doorgeven van die gegevens of inlichtingen daarover aan derden.

      4 De op grond van het tweede lid verstrekte gegevens worden door de in dat lid genoemde personen en instanties niet
      langer dan gedurende een termijn van twaalf maanden na datum van verkrijgen bewaard. Gegevens die door de leden
      van het openbaar ministerie verder zijn verstrekt, kunnen langer worden bewaard met bijzondere toestemming van het
      openbaar ministerie. Daarbij kunnen nadere voorwaarden worden gesteld.

      5 Politiegegevens die worden verwerkt overeenkomstig de [artikelen 8][ref46], [9][ref47],
      [10, eerste lid, onderdelen a en c][ref48], en [13, eerste lid, van de wet][ref49], kunnen worden verstrekt aan
      de volgende personen en instanties, voor zover zij deze behoeven voor het nemen van de besluiten waarmee zij zijn
      belast op grond van de hiernavolgende wetten:

        - de Minister van Justitie, ten behoeve van het nemen van een beslissing op grond van de
      [Wet wapens en munitie][ref50];
        - de Minister van Justitie, ten behoeve van het nemen van een beslissing op grond van de
      [Wet particuliere beveiligingsorganisaties en recherchebureaus][ref51];
        - de korpschef, ten behoeve van het nemen van beschikkingen omtrent het verlenen of intrekken van jachtakten op
      grond van de [Flora- en faunawet][ref52];
        - het college van burgemeester en wethouders, de burgemeester, gedeputeerde staten of de commissaris van de
      Koningin, ten behoeve van het nemen van een beslissing omtrent de verlening, weigering of intrekking van een
      vergunning op grond van de [Drank- en Horecawet][ref53];
        - de burgemeester, ten behoeve van het nemen van een beslissing omtrent een vergunning op grond van de
      [Wet op de kansspelen][ref54].

      6 Politiegegevens die worden verstrekt in de gevallen, bedoeld in het vijfde lid, kunnen tevens worden verstrekt
      aan een bestuursorgaan dat beslist naar aanleiding van een ingesteld bezwaar of administratief beroep.


