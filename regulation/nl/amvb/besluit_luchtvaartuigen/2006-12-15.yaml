  - number: '15'
    text: |-
      1 Onze Minister kan de volgende bewijzen van luchtwaardigheid afgeven:

      a. het standaard-BvL,

      b. het speciaal-BvL, of

      c. het export-BvL

      2 Het bewijs, bedoeld in het eerste lid, onder a, is geldig voor het internationaal uitvoeren van vluchten.

      3 Het bewijs, bedoeld in het eerste lid, onder b, is slechts geldig voor het uitvoeren van vluchten binnen het
      vluchtinformatiegebied Amsterdam.

      4 Het bewijs, bedoeld in het eerste lid, onder c houdt, in combinatie met een bewijs als bedoeld in het eerste lid,
      onder a, een toestemming in tot het uitvoeren van vluchten.

      5 De aan het bewijs van luchtwaardigheid als bedoeld in het eerste lid onder a of b verbonden voorschriften of
      beperkingen, worden neergelegd in een bijlage bij het bewijs van luchtwaardigheid.
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel15
  - number: '16'
    text: |-
      1 Onze Minister geeft op aanvraag aan de houder van een luchtvaartuig een standaard-BvL af, indien het
      luchtvaartuig in staat is om op veilige wijze vluchten uit te voeren, en:

      a. het luchtvaartuig is ontworpen en geproduceerd in Nederland en het luchtvaartuig, alsmede onderdelen
      en uitrustingsstukken daarvan, voldoen aan het door Onze Minister afgegeven type-certificaat, dat voor het
      desbetreffende type is afgegeven, de van toepassing zijnde aanvullende type-certificaten en de aanwijzingen,
      bedoeld in [artikel 3.22, tweede lid, van de wet][ref1],

      b. het luchtvaartuig voldoet aan het type-certificaat dat door Onze Minister is afgegeven op basis van een door de
      JAA uitgevoerde certificatieprocedure, de van toepassing zijnde aanvullende type-certificaten en de aanwijzingen,
      bedoeld in [artikel 3.22, tweede lid, van de wet][ref2],

      c. het luchtvaartuig geproduceerd is in en afkomstig is uit een staat waarmee Onze Minister een overeenkomst heeft
      gesloten, aangaande wederzijdse erkenning van bewijzen van luchtwaardigheid, en

      1°. het luchtvaartuig voldoet aan een door Onze Minister afgegeven type-certificaat, de van toepassing zijnde
      aanvullende type-certificaten en de aanwijzingen, bedoeld in [artikel 3.22, tweede lid, van de wet][ref3], en
      voldoet aan de bijzondere eisen die op de datum van aanvraag van het bewijs van luchtwaardigheid van toepassing
      zijn en ter kennis zijn gebracht van de betrokken staat of staten, of

      2°. het luchtvaartuig voldoet aan een door Onze Minister goedgekeurd type-ontwerp, de van toepassing zijnde
      aanwijzingen, bedoeld in [artikel 3.22, tweede lid, van de wet][ref4], is ontworpen en geproduceerd overeenkomstig
      de van toepassing zijnde regelingen van de betrokken staat en voldoet aan de bijzondere eisen die op de datum van
      aanvraag van het bewijs van luchtwaardigheid van toepassing zijn en ter kennis zijn gebracht van de betrokken staat
      of staten, of

      d. het luchtvaartuig geproduceerd is in of afkomstig is uit een staat waarmee Onze Minister geen overeenkomst
      heeft gesloten aangaande wederzijdse erkenning van bewijzen van luchtwaardigheid, en indien het luchtvaartuig
      voldoet aan een door Onze Minister goedgekeurd type-ontwerp en de van toepassing zijnde aanwijzingen, bedoeld in
      [artikel 3.22, tweede lid, van de wet][ref5], en is ontworpen en geproduceerd, overeenkomstig de van toepassing
      zijnde regelingen van de staat van oorsprong.

      2 Bij ministeriële regeling worden nadere regels gesteld omtrent het in het eerste lid bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3.22
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel3.22
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel3.22
      [ref4]: https://wetten.overheid.nl/BWBR0005555#Artikel3.22
      [ref5]: https://wetten.overheid.nl/BWBR0005555#Artikel3.22
