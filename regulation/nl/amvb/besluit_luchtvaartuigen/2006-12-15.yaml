  - number: '14'
    text: |-
      1 Bij ministeriële regeling worden de voorwaarden bepaald waaronder vluchten worden uitgevoerd ter verkrijging van
      een type-certificaat, een wijziging van een type-certificaat dan wel een aanvullend type-certificaat.

      2 Bij ministeriële regeling worden nadere regels gesteld betreffende:

      a. de aanvraag, de aanvrager en de afgifte van een type-certificaat, dan wel van een aanvullend type-certificaat en
      van de wijziging van een type-certificaat of een aanvullend type-certificaat,

      b. de wijze waarop de aanvrager aantoont dat hij aan alle op hem van toepassing zijnde eisen voldoet,

      c. een aanvraag waarop [artikel 4, tweede lid][ref1], en [artikel 10, tweede lid][ref2], van toepassing is en de
      wijze waarop deze wordt ingediend, en

      d. de overdracht alsmede de procedure van aanvraag om afgifte, wijziging, schorsing en intrekking van een type-
      certificaat dan wel van een aanvullend type-certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0012651#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0012651#Artikel10
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel14
