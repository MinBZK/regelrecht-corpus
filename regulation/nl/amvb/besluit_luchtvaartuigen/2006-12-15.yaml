  - number: '45'
    text: |-
      Bij ministeriële regeling kunnen regels worden gegeven met betrekking tot startinrichtingen voor luchtvaartuigen
      zonder voortstuwingsinrichtingen.
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel45
  - number: '46'
    text: |-
      1 Een vergoeding is verschuldigd voor:

      a. de behandeling van de aanvraag om wijziging dan wel doorhaling van de inschrijving;

      b. de afgifte en vernieuwing van een bewijs van inschrijving,

      c. de behandeling van de aanvraag om afgifte, wijziging of overdracht van een type-certificaat, een aanvullend
      type-certificaat, een ontwerpgoedkeuring van een onderdeel of een bewijs van luchtwaardigheid of de verlenging van
      zulk een bewijs, dan wel de vernieuwing van een bewijs van luchtwaardigheid of de aanvraag van een ontheffing;

      d. de behandeling van de aanvraag om afgifte, wijziging of vernieuwing van een geluidscertificaat, een
      geluidsverklaring of een aanvullende geluidsverklaring, en

      e. de behandeling van de aanvraag om afgifte, verlenging, vernieuwing of wijziging van een erkenning of van een aan
      een erkenning verbonden machtiging.

      2 Bij ministeriële regeling wordt de hoogte van de vergoedingen, bedoeld in het eerste lid, vastgesteld.

      3 Bij ministeriële regeling wordt de wijze van betaling van de verschuldigde vergoeding vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel46
  - number: '47'
    text: |-
      1 De beslissing op een aanvraag voor de toepassing van de handelingen in
      [artikel 46, eerste lid, onderdelen a tot en met c][ref1], voor zover die aanvraag betrekking heeft op een bewijs
      van luchtwaardigheid of een ontheffing, wordt slechts genomen nadat is gebleken dat de verschuldigde vergoeding
      is betaald.

      2 De beslissing op een aanvraag voor de toepassing van de handelingen in
      [artikel 46, eerste lid, onderdeel c][ref2], voor zover die betrekking heeft op type-certificaten, aanvullende
      type-certificaten en erkenningen en machtigingen, en onderdeel d wordt slechts genomen nadat is gebleken dat alle
      voorafgaande facturen ten aanzien van de gevraagde handeling, verstuurd tot 30 dagen voorafgaande aan de datum van
      de beslissing, zijn voldaan.

      3 Wanneer na de betaling van de verschuldigde vergoeding degene, die een aanvraag als bedoeld in het eerste lid,
      heeft ingediend, verzoekt die aanvraag als niet ingediend te beschouwen, kan hem op zijn verzoek een, nader door
      Onze Minister in elk geval afzonderlijk te bepalen, bedrag worden terugbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0012651#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0012651#Artikel46
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel47
