  - number: '2'
    text: |-
      1 In het Nederlandse register voor burgerluchtvaartuigen worden luchtvaartuigen ingeschreven:

      a. die zijn vervaardigd in een lidstaat van de Europese Unie of in een van de Staten die partij zijn bij de
      Overeenkomst betreffende de Europese Economische Ruimte, en die niet zijn uitgevoerd, of ten aanzien waarvan, bij
      het in het vrije verkeer brengen, de vereiste douaneformaliteiten zijn vervuld, en

      b. ten aanzien waarvan het beheer met het oog op een voortdurende luchtwaardigheid, door de aanvrager, dan wel door
      diens vertegenwoordiger vanuit een vestiging in Nederland wordt gevoerd.

      2 De aanvrager, die krachtens geldige titel een luchtvaartuig onder zich heeft, is:

      a. een onderdaan van een lidstaat van de Europese Unie of van een van de Staten die partij zijn bij de Overeenkomst
      betreffende de Europese Economische Ruimte,

      b. een ingezetene van een lidstaat van de Europese Unie of van een van de Staten die partij zijn bij de
      Overeenkomst betreffende de Europese Economische Ruimte, niet zijnde een onderdaan van een lidstaat van de Europese
      Unie of van een van de Staten die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte, of

      c. een rechtspersoon welke in overeenstemming met de wetgeving van een lidstaat van de Europese Unie of van een van
      de Staten die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte is opgericht en waarvan
      de statutaire zetel of feitelijke zetel, zich bevindt in een lidstaat van de Europese Unie of van een van de Staten
      die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte.

      3 Onze Minister van Financiën kan ontheffing verlenen van de in het eerste lid, onder a, bedoelde
      douaneformaliteiten. Aan de ontheffing kunnen voorwaarden worden verbonden. Bij het niet nakomen van een aan de
      ontheffing verbonden voorwaarde kan Onze Minister van Financiën de ontheffing intrekken.

      4 Indien de aanvrager geen woonplaats heeft in Nederland dan wel, indien het om een rechtspersoon gaat, de
      statutaire zetel, hoofdbestuur of hoofdvestiging niet in Nederland is gevestigd, dient het beheer, bedoeld in het
      eerste lid, onder b, te worden uitgevoerd door een vertegenwoordiger van de aanvrager met woonplaats in Nederland,
      dan wel, door een nevenvestiging van de rechtspersoon in Nederland.

      5 Indien de aanvrager het in het eerste lid, onder b, bedoelde beheer heeft uitbesteed, rusten de verplichtingen
      terzake van de voortdurende luchtwaardigheid op de in het vierde lid bedoelde vertegenwoordiger dan wel op de
      nevenvestiging als rechtspersoon.

      6 De aanvrager is gehouden aan de uitbesteding, bedoeld in het vijfde lid, de schriftelijke voorwaarde te verbinden
      dat hij te allen tijde opdrachten kan verstrekken in verband met de nakoming van de hem krachtens dit besluit
      terzake van de voortdurende luchtwaardigheid opgedragen verplichtingen.

      7 Indien de aanvrager, bedoeld in het tweede lid, niet tevens de eigenaar is van het luchtvaartuig, dan is het
      tweede lid van overeenkomstige toepassing op de eigenaar.

      8 Indien de eigenaar, bedoeld in het zevende lid, niet voldoet aan het tweede lid, schrijft Onze Minister het
      luchtvaartuig in het register voor burgerluchtvaartuigen in, tenzij de eigenaar afkomstig is uit een land waarmee
      Nederland de diplomatieke banden heeft verbroken.
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel2
  - number: '3'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot:

      a. de procedure van aanvraag tot afgifte, wijziging of doorhaling van een inschrijving in het register voor
      burgerluchtvaartuigen, alsmede de gegevens welke bij deze procedure worden verstrekt,

      b. de vernieuwing van het inschrijvingsbewijs.
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel3
  - number: '4'
    text: |-
      1 Onze Minister geeft op aanvraag van een JAA-persoon een type-certificaat af, indien:

      a. de aanvrager een DOA-JA heeft,

      b. het te certificeren product aan de eisen, genoemd in [artikel 5][ref1] voldoet, of indien niet volledig aan alle
      veiligheidseisen is voldaan, het veiligheidsniveau op andere wijze is gegarandeerd, en

      c. het product geen eigenschappen heeft waardoor het gebruik, waarvoor het type-certificaat is aangevraagd,
      onveilig is.

      2 Het eerste lid, onder a, is niet van toepassing indien het ontwerp van het product overeenkomstig bij
      ministeriële regeling vast te stellen regels van eenvoudige aard is en de aanvrager heeft aangetoond dat zijn
      organisatie van een adequate kwaliteitsborging is voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0012651#Artikel5
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel4
