  - number: '10'
    text: |-
      1 Onze Minister geeft op aanvraag van een JAA-persoon een aanvullend type-certificaat af, indien:

      a. het een aanvraag betreft in verband met een ingrijpende wijziging van het type-ontwerp, dan wel van een
      onderdeel van een product waarvoor een aanvullend type-certificaat is afgegeven,

      b. de aanvrager beschikt over een DOA-JA,

      c. is voldaan aan de vereisten gesteld in [artikel 8, eerste lid][ref1], en

      d. de aanvrager zijn aanvraag zelf met eigen gegevens onderbouwt, dan wel de aanvrager een overeenkomst heeft
      gesloten met de houder van het type-certificaat, waarin deze verklaart geen technische bezwaren te hebben tegen
      de ingediende beschrijving van de wijziging en zich verbindt om de houder van het aanvullende type-certificaat te
      ondersteunen bij diens verplichtingen ten aanzien van de voortdurende luchtwaardigheid.

      2 Het eerste lid, onder b, is niet van toepassing indien het ontwerp van de wijziging naar het oordeel van
      Onze Minister van eenvoudige aard is en de aanvrager heeft aangetoond dat zijn organisatie van een adequate
      kwaliteitsborging is voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0012651#Artikel8
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel10
