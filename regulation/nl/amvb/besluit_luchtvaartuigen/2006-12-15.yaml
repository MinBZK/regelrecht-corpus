preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op voordracht van Onze Minister van Verkeer en Waterstaat van 3 oktober 2000 nr. DGRLD/DLB/L00.420136, Directoraat-
    Generaal Rijksluchtvaartdienst gedaan in overeenstemming met de Staatssecretaris van Defensie;

    Gelet op de artikelen 1.2, tweede en derde lid, 3.3, tweede lid, 3.7, 3.9, eerste lid, 3.10, eerste lid, 3.11,
    eerste lid, onder b, 3.13, eerste lid, onder c, tweede, derde lid, 3.15, eerste lid, 3.22, eerste lid, onder b,
    3.23, 3.25, eerste tot en met derde lid, 3.26, eerste lid, 3.29 en 3.31 van de Wet luchtvaart en artikel 14, tweede
    lid, van de Luchtvaartwet;

    De Raad van State gehoord (advies van 17 november 2000, nr. W09.00.0470/V);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 3 juli 2001, nr. DGRLD/DLB/L01.421030,
    Directoraat-Generaal Rijksluchtvaartdienst, uitgebracht in overeenstemming met de Staatssecretaris van Defensie;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en in de op dit besluit gebaseerde regelingen wordt verstaan onder:

        - aanvullende geluidsverklaring: verklaring als bedoeld in [artikel 3.19c, tweede lid, van de wet][ref1],
        - BvL: Bewijs van Luchtwaardigheid,
        - certificaat van vrijgave: verklaring dat de voortstuwingsinrichting, de propeller of het onderdeel aan de van
      toepassing zijnde eisen voldoet (Authorised Release Certificate; JAA Form One),
        - certificaat van vrijgave voor gebruik: verklaring dat het onderhoud in overeenstemming met de van toepassing
      zijnde eisen is uitgevoerd (Certificate of Release to Service),
        - DOA-JA: een erkenning voor het ontwerpen van producten en wijzigingen van producten als bedoeld in JAR 21 subpart
      JA (Design Organisation Approval),
        - DOA-JB: een erkenning voor het ontwerpen van onderdelen als bedoeld in JAR 21 subpart JB (Design Organisation
      Approval),
        - export-BvL: een bewijs waarin de status van het luchtvaartuig betreffende de luchtwaardigheid wordt aangegeven,
      getoetst volgens de eisen van het importerende land,
        - geluidscertificaat: certificaat als bedoeld in [artikel 3.19b, eerste lid, van de wet][ref2],
        - geluidsverklaring: verklaring als bedoeld in [artikel 3.19c, eerste lid, van de wet][ref3],
        - geringe wijziging: een wijziging of herstel van een type-ontwerp die geen wezenlijk effect heeft op het gewicht,
      het zwaartepunt, de structurele sterkte, betrouwbaarheid, operationele karakteristieken, of andere karakteristieken
      die de luchtwaardigheid van het product raken,
        - ingrijpende wijziging: een wijziging van een type-ontwerp, niet zijnde een geringe wijziging en elke wijziging
      die een merkbare verandering van de geluidsproductie ten gevolge zou kunnen hebben,
        - ICAO-verdrag: het op 7 december 1944 te Chicago tot stand gekomen verdrag inzake de internationale
      burgerluchtvaart (Trb.1973,109),
        - ICAO-staat: een staat die het ICAO-verdrag heeft bekrachtigd,
        - ICAO Annex 16, Vol. I: boekdeel 1 van bijlage 16 bij het ICAO-verdrag,
        - JAA: het op 11 september 1990 op Cyprus gesloten samenwerkingsverband tussen een aantal Europese
      burgerluchtvaartautoriteiten (Joint Aviation Authorities),
        - JAA-land: een land waarvan de burgerluchtvaartautoriteit is toegetreden tot de JAA en bij ministeriële regeling
      als bedoeld in [artikel 3.20 van de Wet luchtvaart][ref4] is aangewezen,
        - JAA-persoon: een natuurlijk persoon woonachtig in of een rechtspersoon gevestigd in een JAA-land,
        - JAR: technisch voorschrift, vastgesteld door de JAA (Joint Aviation Requirements),
        - JAR 21: JAR betreffende certificatieprocedures voor luchtvaartuigen, aanverwante producten en onderdelen,
        - JAR 145: JAR betreffende erkende onderhoudsbedrijven,
        - JAR-AWO: JAR betreffende vluchten onder alle weersomstandigheden,
        - JPA: goedgekeurd onderdeel voor inbouw in een typegecertificeerd product als bedoeld in JAR 21, subpart P (Joint
      Part Approval),
        - JTSO: een minimum prestatie standaard voor bepaalde onderdelen als bedoeld in JAR 21, subpart O, (Joint Technical
      Standard Order),
        - MLA: land-, amfibie- of watervliegtuig met niet meer dan twee zitplaatsen, een overtreksnelheid die niet hoger
      is dan 35.1 knopen gecalibreerde luchtsnelheid en een maximum startmassa van niet meer dan: 300 kg voor een
      landvliegtuig, eenzitter; 450 kg voor een landvliegtuig, tweezitter; 330 kg voor een amfibie- of watervliegtuig,
      eenzitter, of 495 kg voor een amfibie- of watervliegtuig, tweezitter, mits een micro light die als watervliegtuig
      en als landvliegtuig gebruikt kan worden binnen beide daarvoor geldende massalimieten valt (Micro Light Aeroplane),
        - MOA: een erkenning voor het onderhoud van vliegtuigen, helicopters en luchtschepen of onderdelen daarvan, als
      bedoeld in JAR 145 (Maintenance Organisation Approval),
        - onderdeel: elk deel dat is geïnstalleerd in of bevestigd aan een luchtvaartuig en dat bestemd is voor gebruik van
      dat luchtvaartuig tijdens de vlucht,
        - Onze Minister: Onze Minister van Verkeer en Waterstaat,
        - POA: een erkenning voor het vervaardigen van producten en onderdelen als bedoeld in JAR 21 subpart G (Production
      Organisation Approval),
        - primair certificerende autoriteit: de autoriteit die het eerste type-certificaat heeft afgegeven,
        - product: een luchtvaartuig, een voortstuwingsinrichting of een propeller,
        - standaard-BvL: een bewijs van luchtwaardigheid als bedoeld in het ICAO-verdrag,
        - speciaal-BvL: een bewijs van luchtwaardigheid, niet zijnde een standaard-BvL,
        - type-certificaat: het geheel van documenten omvattende het type-ontwerp, de operationele beperkingen, het
      gegevensblad, de luchtwaardigheidsregelgeving en alle andere voorschriften en beperkingen zoals voorgeschreven in
      de van toepassing zijnde eisen,
        - type-ontwerp: het geheel van documenten omvattende alle tekeningen en specificaties benodigd om de configuratie,
      de eigenschappen van het ontwerp vast te leggen, informatie over materialen, processen en productiemethodieken,
      luchtwaardigheidsbeperkingen ten behoeve van het onderhoud en alle gegevens die nodig zijn om de luchtwaardigheid
      en voor zover van toepassing de geluidsproductie vast te stellen van latere producten van het type,
        - verklaring van conformiteit: verklaring dat het luchtvaartuig of het onderdeel aan het goedgekeurde ontwerp
      voldoet (Statement of Conformity),
        - verklaring van overeenstemming: verklaring dat het ontwerp voor een luchtvaartuig of onderdeel aan de van
      toepassing zijnde eisen voldoet (Statement of Compliance),
        - [verordening (EEG) 3922/91](31991R3922): [verordening (EEG) nr. 3922/91](31991R3922) van de Raad van de Europese
      Gemeenschappen van 16 december 1991 inzake de harmonisatie van technische en administratieve procedures op het
      gebied van de burgerluchtvaart (PbEG L 373),
        - wet: [Wet luchtvaart][ref5].

      2 Met uitzondering van het derde, het vijfde en het zevende lid, is dit besluit uitsluitend van toepassing op
      luchtvaartuigen, voortstuwingsinrichtingen, propellers, onderdelen en erkenningen bestemd voor de burgerluchtvaart.

      3 [Hoofdstuk 3 van de wet][ref6] en dit besluit zijn niet van toepassing op de volgende soorten luchtvaartuigen:

      a. modelvliegtuigen, waarvan de totale massa ten hoogste 25 kilogram bedraagt,

      b. ballonnen, die op zeeniveau in de internationale standaard atmosfeer in geheel gevulde toestand een diameter
      van ten hoogste 2.00 meter of een inhoud van ten hoogste 4.00 kubieke meter hebben, alsmede aan elkaar gekoppelde
      ballonnen waarvan de gezamenlijke diameter en inhoud deze waarden niet te boven gaan,

      c. toestellen, zwaarder dan lucht en niet voorzien van een voortstuwingsinrichting, die door middel van een
      ankerkabel of lijn zijn verbonden met het aardoppervlak (kabelvlieger),

      d. luchtschepen, die op zeeniveau in de internationale standaard atmosfeer in geheel gevulde toestand een grootste
      afmeting hebben van maximaal 5.00 meter of een inhoud van ten hoogste 4.00 kubieke meter,

      e. toestellen, zwaarder dan lucht in de vorm van een scherm met harnas, die met een lijn of lijnen zijn bevestigd
      aan een voertuig of vaartuig, waardoor ze in de lucht kunnen worden gehouden (valschermzweeftoestel),

      f. ballonnen, die tijdens het in de lucht houden permanent zijn bevestigd aan het aardoppervlak (kabelballon),

      g. valschermen als bedoeld in [artikel 1, onderdeel b, van de Regeling valschermspringen][ref7],

      h. zeilvliegtuigen,

      i. schermzweeftoestellen,

      j. amateurbouwluchtvaartuigen ingeschreven in andere lidstaten van de European Civil Aviation Conference.

      4 Het bepaalde bij en krachtens [paragraaf 3.2.1. van de wet][ref8] omtrent type-certificaten, het bepaalde
      bij [paragraaf 3.2.3. van de wet][ref9] omtrent bewijzen van bevoegdheid voor onderhoud en het bepaalde bij
      [artikel 20, tweede lid][ref10], is niet van toepassing op de volgende soorten luchtvaartuigen:

      a. amateurbouwluchtvaartuigen,

      b. MLA's.

      5 Bij ministeriële regeling dan wel bij regeling van Onze Minister van Defensie kunnen voorschriften en beperkingen
      worden opgenomen ten aanzien van de in het derde en vierde lid genoemde luchtvaartuigen.

      6 [Artikel 3.5 van de wet][ref11] is niet van toepassing op de luchtvaartuigen als bedoeld in
      [artikel 3.6 van de wet][ref12].

      7 Het verbod, bedoeld in [artikel 3.8, eerste lid, onderdeel b, van de wet][ref13], is niet van toepassing op
      militaire luchtvaartuigen die hetzij automatisch, hetzij op afstand worden bestuurd, en die worden gebruikt als
      doel voor schietoefeningen dan wel voor het slepen van een doel voor schietoefeningen mits wordt voldaan aan de
      volgende voorwaarden:

      a. boven Nederland wordt met het luchtvaartuig uitsluitend gevlogen in een gebied waarin het burgerluchtverkeer is
      verboden of beperkt,

      b. met het luchtvaartuig wordt uitsluitend gevlogen indien de door Onze Minister van Defensie vastgestelde
      instructies in acht worden genomen met betrekking tot:

      1°. een veilige lancering,

      2°. het voor en na elke vlucht uitvoeren van een functionele en een technische inspectie,

      3°. het onderhoud van het luchtvaartuig,

      4°. het per parachute op een veilige wijze en binnen het aangewezen landingsgebied doen landen van het
      luchtvaartuig,

      c. het luchtvaartuig is uitgerust met een zodanige veiligheidsvoorziening dat bij verstoring van of bij het
      verloren gaan van het radiocontact tussen luchtvaartuig en bedieningsstation, de vlucht van het luchtvaartuig wordt
      afgebroken en de landing per parachute wordt ingezet,

      d. het luchtvaartuig is uitgerust met een zodanige veiligheidsvoorziening dat bij het uitvallen van de besturing
      als gevolg van stroomstoring de landing per parachute wordt ingezet.


