  - number: 12b
    text: |-
      1 Onze Minister wijzigt op aanvraag van de houder, zijnde een niet-JAA-persoon, welke houder tevens de houder
      is van het relevante type-certificaat, het aanvullend type-certificaat in verband met een ingrijpende wijziging
      van het ontwerp, waar het aanvullend type-certificaat betrekking op heeft, indien is voldaan aan de in
      [artikel 9][ref1] genoemde voorwaarden.

      2 Onze Minister geeft op aanvraag van de houder van een aanvullend type-certificaat, zijnde een niet-JAA-persoon,
      welke niet de houder is van het relevante type-certificaat, in verband met een ingrijpende wijziging van het
      ontwerp, waar het aanvullende type-certificaat betrekking op heeft, een nieuw aanvullend type-certificaat af.
      [Artikel 11][ref2] is van overeenkomstige toepassing.

      3 Onze Minister wijzigt op aanvraag van de houder, zijnde een niet-JAA-persoon, het aanvullend type-certificaat,
      waarbij de primaire certificerende autoriteit, de autoriteit van een JAA-land is, in verband met een geringe
      wijziging van het ontwerp, waar het aanvullende type-certificaat betrekking op heeft, indien het gewijzigde product
      aan de van toepassing zijnde eisen voldoet.

      4 Onze Minister geeft op aanvraag van de houder van een aanvullend type-certificaat, zijnde een niet-JAA-persoon,
      waarbij de primaire certificerende autoriteit, de autoriteit is van een niet-JAA-land, in verband met een geringe
      wijziging van het ontwerp, waar het aanvullende type-certificaat betrekking op heeft, een nieuw aanvullend type-
      certificaat af. [Artikel 11][ref3] is van overeenkomstige toepassing.

      5 [Artikel 12a, vierde en vijfde lid][ref4], is van overeenkomstige toepassing.


