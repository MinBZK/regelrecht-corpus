        hoofdstuk: III
        paragraaf: '2'
  - number: '11'
    text: |-
      Onze Minister geeft op aanvraag van een niet-JAA-persoon een aanvullend type-certificaat af, indien:

      a. is voldaan aan de vereisten gesteld in [artikel 9, eerste en derde lid][ref1], en

      b. de aanvrager een overeenkomst heeft gesloten met de houder van het type-certificaat, waarin deze verklaart
      geen technische bezwaren te hebben tegen de ingediende beschrijving van de wijziging en zich verbindt samen met
      de houder van het aanvullende type-certificaat de verplichtingen ten aanzien van voortdurende luchtwaardigheid
      te zullen nakomen, dan wel in de overeenkomst, bedoeld in [artikel 6, eerste lid, onder b][ref2], afspraken zijn
      gemaakt omtrent de voortdurende luchtwaardigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0012651#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0012651#Artikel6
