      1 De houder van een aanvullend type-certificaat, zijnde een JAA-persoon, is bevoegd tot overdracht van het
      aanvullend type-certificaat aan een houder van een daarvoor naar het oordeel van Onze Minister toegeruste DOA-JA.

      2 De houder van een aanvullend type-certificaat, zijnde een JAA-persoon, is verplicht:

      a. te voldoen aan JAR 21.3;

      b. het aanvullend type-certificaat op verzoek van de minister ter beschikking te stellen;

      c. alle ontwerp-informatie, tekeningen, test- en inspectierapporten ter beschikking te houden van de minister;

      d. kopieën van handboeken op verzoek aan de minister ter beschikking te stellen, en

      e. de instructies over voortdurende luchtwaardigheid aan de houders van het betreffende luchtvaartuig ter
      beschikking te stellen en op verzoek aan andere personen, die gehouden zijn deze instructies na te leven.

      3 De houder van een aanvullend type-certificaat, zijnde een niet-JAA-persoon, is verplicht te voldoen aan de
      onderdelen b tot en met e van het tweede lid.

      4 De houder van een aanvullend type-certificaat, zijnde een niet-JAA-persoon, is bevoegd tot overdracht van het
      type-certificaat aan een niet-JAA-persoon:

      a. die bereid is de verplichtingen, bedoeld in het tweede lid, op zich te nemen;

      b. ten aanzien van wie Onze Minister op grond van de in [artikel 6, eerste lid, onderdeel b][ref1], bedoelde
      gezamenlijke procedures constateert dat hij aan de verplichtingen kan voldoen.


