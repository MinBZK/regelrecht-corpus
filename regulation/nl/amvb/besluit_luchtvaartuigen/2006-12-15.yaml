        artikel: '6'
        hoofdstuk: III
        paragraaf: '1'
  - number: '44'
    text: |-
      1 Dit hoofdstuk is van overeenkomstige toepassing op een erkenning of een machtiging in de zin van
      [artikel 23][ref1] of een toestemming in de zin van [artikel 41][ref2], voor producten of onderdelen waarvoor geen
      JAR's gelden.

      2 In afwijking van het eerste lid, kunnen bij ministeriële regeling andere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0012651#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0012651#Artikel41
