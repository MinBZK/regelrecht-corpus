        paragraaf: '1'
  - number: '6'
    text: |-
      1 Onze Minister geeft op aanvraag van een niet-JAA-persoon een type-certificaat af indien:

      a. de staat waarvan de aanvrager ingezetene is, dan wel waarin hij is gevestigd, een ICAO-staat is,

      b. Onze Minister met de onder a bedoelde staat een bilaterale overeenkomst heeft gesloten, die is bekrachtigd
      dan wel beide staten een multilaterale overeenkomst hebben bekrachtigd, op basis waarvan gezamenlijke procedures
      zijn vastgesteld aangaande het aantonen dat aan de eisen voor afgifte van type-certificaten, aanvullende type-
      certificaten en bewijzen van luchtwaardigheid is voldaan,

      c. Onze Minister op grond van de onder b bedoelde gezamenlijke procedures constateert, dat aan de van toepassing
      zijnde eisen is voldaan, of indien niet aan alle veiligheidseisen is voldaan, het veiligheidsniveau op andere wijze
      is gegarandeerd,

      d. het oorspronkelijke type-certificaat dan wel een daaraan gelijkwaardig document door de bevoegde autoriteit van
      de staat van uitvoer aan de aanvrager is afgegeven,

      e. het product geen eigenschappen heeft waardoor het gebruik waarvoor certificatie is aangevraagd, onveilig is, en

      f. voorzieningen zijn getroffen om de voortdurende luchtwaardigheid te garanderen.

      2 [Artikel 5][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012651#Artikel5
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012651
        artikel: '5'
        hoofdstuk: III
        paragraaf: '1'
  - number: '7'
    text: |-
      1 De houder van een type-certificaat, zijnde een JAA-persoon, is bevoegd tot overdracht van het type-certificaat
      aan een houder van een daarvoor door Onze Minister goedgekeurde DOA-JA.

      2 De houder van een type-certificaat, zijnde een JAA-persoon, is verplicht:

      a. tot hetgeen JAR 21.3 voorschrijft,

      b. het type-certificaat op verzoek aan de minister ter beschikking stellen,

      c. alle ontwerp-informatie, tekeningen, test- en inspectierapporten ter beschikking te houden van de minister;

      d. kopieën van handboeken op verzoek aan de minister ter beschikking te stellen,

      e. met de fabrikant het ontwerp en de productie op elkaar af te stemmen en de voortdurende luchtwaardigheid van het
      product te waarborgen, en

      f. de instructies over voortdurende luchtwaardigheid aan de houders van het betreffende luchtvaartuig ter
      beschikking te stellen en op verzoek aan andere personen, die gehouden zijn deze instructies na te leven.

      3 De houder van een type-certificaat, zijnde een niet-JAA-persoon, is verplicht te voldoen aan de onderdelen b tot
      en met f van het tweede lid.

      4 De houder van een type-certificaat, zijnde een niet-JAA-persoon, is bevoegd tot overdracht van het type-
      certificaat aan een niet-JAA-persoon:

      a. die bereid is de verplichtingen, bedoeld in het tweede lid, op zich te nemen;

      b. ten aanzien van wie Onze minister op grond van de in [artikel 6, eerste lid, onderdeel b][ref1], bedoelde
      gezamenlijke procedures constateert dat hij aan de verplichtingen kan voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0012651#Artikel6
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0012651
        artikel: '6'
        hoofdstuk: III
        paragraaf: '1'
  - number: '8'
    text: |-
      1 Onze Minister wijzigt op aanvraag van de houder, zijnde een JAA-persoon, het type-certificaat, in verband met een
      ingrijpende wijziging van een type-ontwerp, indien:

      a. het gewijzigde product aan de van toepassing zijnde eisen voldoet, of indien niet aan alle veiligheidseisen is
      voldaan, het veiligheidsniveau op andere wijze is gegarandeerd, en

      b. het product geen eigenschappen heeft waardoor het gebruik, waarvoor wijziging van het type-certificaat is
      aangevraagd, onveilig is.

      2 Onze Minister wijzigt op aanvraag van een JAA-persoon, het type-certificaat in verband met een geringe wijziging
      van het type-ontwerp, indien:

      a. Onze Minister deze wijziging als gering classificeert, het gewijzigde product aan de van toepassing zijnde eisen
      voldoet, of

      b. de classificatie als geringe wijziging door een houder van een DOA-JA is gedaan volgens een procedure, waarmee
      Onze Minister heeft ingestemd, en het gewijzigde product aan de van toepassing zijnde eisen voldoet.

      3 De eisen, bedoeld in het eerste en tweede lid, zijn de eisen waarnaar het type-certificaat verwijst.

      4 Indien de technische ontwikkeling van de eisen daartoe aanleiding geeft, dan wel indien die eisen niet adequaat
      zijn, kunnen, in afwijking van het derde lid, bij ministeriële regeling in het belang van de veiligheid:

      a. eisen van toepassing worden verklaard die gelden op het moment waarop de aanvraag wordt ingediend en eventueel
      wijzigingen op die eisen, en

      b. speciale eisen worden gesteld en eventueel wijzigingen op die eisen, die noodzakelijk zijn om een voldoende
      luchtwaardigheidsniveau te waarborgen.
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel8
  - number: '9'
    text: |-
      1 Onze Minister wijzigt op aanvraag van de houder het type-certificaat, zijnde een niet-JAA-persoon in verband met
      een ingrijpende wijziging van het type-ontwerp, indien:

      a. is voldaan aan [artikel 6, eerste lid, onder a en b][ref1],

      b. de bevoegde autoriteit van de staat van uitvoer met deze wijziging heeft ingestemd,

      c. Onze Minister op grond van de in [artikel 6, eerste lid, onder b][ref2], bedoelde gezamenlijke procedures
      constateert dat het gewijzigde product aan de van toepassing zijnde eisen voldoet, of indien niet aan alle
      veiligheidseisen is voldaan, het veiligheidsniveau op andere wijze is gegarandeerd, en

      d.het product geen eigenschappen heeft waardoor het voor het gebruik waarvoor certificatie is aangevraagd, onveilig
      is.

      2 Onze Minister wijzigt op aanvraag van de houder het type-certificaat dat is afgegeven door een autoriteit van een
      niet-JAA-land in verband met een geringe wijziging van het type-ontwerp, indien Onze Minister op grond van de in
      [artikel 6, eerste lid, onder b][ref3], bedoelde gezamenlijke procedures constateert dat het gewijzigde product aan
      de van toepassing zijnde eisen voldoet.

      3 [Artikel 8, derde en vierde lid][ref4], zijn van overeenkomstige toepassing.


