        artikel: '23'
        hoofdstuk: VI
  - number: '34'
    text: |-
      Onze Minister verleent op aanvraag van een JAA-persoon een JTSO-machtiging, indien:

      a. de aanvrager houder is van een POA,

      b. de aanvrager tevens houder is van een DOA-JA, wanneer Onze Minister heeft bepaald dat de JTSO van dat onderdeel
      kwalitatieve ontwerpeisen bevat, en

      c. het onderdeel voldoet aan de van toepassing zijnde JTSO en de aanvrager een verklaring van overeenstemming heeft
      afgegeven.
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel34
  - number: '35'
    text: |-
      1 De houder van een JTSO-machtiging is bevoegd tot het produceren van een onderdeel dat aan de van toepassing
      zijnde JTSO voldoet en tot het aanbrengen van een JTSO-merkteken op dat onderdeel.

      2 De houder van een JTSO-machtiging is verplicht:

      a. tot het produceren van elk onderdeel in overeenstemming met de POA,

      b. van elk onderdeel een geactualiseerd databestand bij te houden,

      c. van elk onderdeel de vereiste handboeken bij te houden,

      d. met de fabrikant het ontwerp en de productie op elkaar af te stemmen en de voortdurende luchtwaardigheid van het
      product te waarborgen,

      e. ieder onderdeel te identificeren in overeenstemming met JAR 21, subpart Q, en

      f. te voldoen aan JAR 21.3.
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel35
  - number: '36'
    text: |-
      Onze Minister verleent op aanvraag van een niet-JAA-persoon een JTSO-machtiging, indien:

      a. een verklaring van overeenstemming is afgegeven via de bevoegde autoriteit van de staat van uitvoer, en

      b. is aangetoond dat het onderdeel volgens de met de staat van uitvoervastgestelde gezamenlijke procedures, bedoeld
      in [artikel 6, eerste lid, onder b][ref1], voldoet aan de van toepassing zijnde JTSO.


      [ref1]: https://wetten.overheid.nl/BWBR0012651#Artikel6
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0012651
        artikel: '6'
        hoofdstuk: III
        paragraaf: '1'
  - number: '37'
    text: |-
      Onze Minister verleent op aanvraag een JPA-machtiging, indien de aanvrager beschikt over een POA voor de
      betreffende onderdelen, en

      a. indien het gaat om een wijzigingsonderdeel, Onze Minister met de installatie daarvan als een geringe wijziging
      heeft ingestemd, of

      b. indien het een vervangingsonderdeel betreft, Onze Minister het bewijs heeft geaccepteerd dat het aan de
      ontwerpeisen voldoet.
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel37
  - number: '38'
    text: |-
      1 De houder van een JPA-machtiging is bevoegd tot het aanbrengen van een JPA-merkteken op een onderdeel, zoals
      bepaald in JAR 21, subpart Q.

      2 De houder van een JPA-machtiging is verplicht:

      a. tot het produceren van elk onderdeel in overeenstemming met de POA,

      b. met de fabrikant het ontwerp en de productie op elkaar af te stemmen en de voortdurende luchtwaardigheid van het
      product te waarborgen, en

      c. te voldoen aan JAR 21.3.
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel38
  - number: '39'
    text: |-
      1 Een DOA-JA, DOA-JB, POA, een MOA en een erkenning bedoeld in [artikel 23, eerste lid, onder e][ref1], worden
      verleend voor ten hoogste twee jaren.

      2 De JTSO- en de JPA-machtiging zijn geldig zolang de POA waaraan zij zijn verbonden, geldig is.


      [ref1]: https://wetten.overheid.nl/BWBR0012651#Artikel23
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0012651
        artikel: '23'
        hoofdstuk: VI
  - number: '40'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld omtrent:

      a. de aanvraag, de wijziging en de verlenging van een erkenning,

      b. de procedure van aanvraag, verlenging, wijziging, schorsing of intrekking van een erkenning,

      c. de wijze waarop de aanvrager aantoont dat hij aan de gestelde eisen voldoet, en

      d. het model en de uitvoering van het certificaat van vrijgave, het certificaat van vrijgave voor gebruik, de
      verklaring van conformiteit en de verklaring van overeenstemming.
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel40
  - number: '41'
    text: |-
      1 Onze Minister verleent op aanvraag van een JAA-persoon toestemming om een individueel product of een onderdeel
      daarvan te produceren in overeenstemming met het ontwerp, indien de aanvrager:

      a. een productie-inspectiesysteem heeft dat waarborgt dat het product of onderdeel aan het ontwerp voldoet en
      geschikt is voor veilig gebruik, en

      b. over een handboek beschikt, waarin het productie-inspectiesysteem omschreven.

      2 Bij ministeriële regeling worden nadere regels gesteld omtrent het in het eerste lid bepaalde.

      3 De toestemming geldt voor de in de beschikking genoemde werkzaamheden waarvoor de houder de in [artikel 42][ref1]
      bedoelde bevoegdheden heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0012651#Artikel42
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0012651
        artikel: '42'
        hoofdstuk: VI
  - number: '42'
    text: |-
      1 Degene die toestemming heeft verkregen als bedoeld in [artikel 41, eerste lid][ref1], is bevoegd tot de afgifte
      van een verklaring van conformiteit voor ieder, op basis van die toestemming, geproduceerd product of onderdeel.

      2 Onze Minister bekrachtigt de in het eerste lid bedoelde verklaring in het geval van:

      a. een eerste eigendomsoverdracht,

      b. een aanvraag voor een bewijs van luchtwaardigheid, of

      c. een aanvraag voor een certificaat van vrijgave ten aanzien van de luchtwaardigheid, indien het product of
      onderdeel naar zijn oordeel voldoet aan het ontwerp en geschikt is voor veilig gebruik.

      3 Degene die toestemming heeft verkregen als bedoeld in [artikel 41, eerste lid][ref2], is verplicht:

      a. het in [artikel 41, eerste lid, onder b][ref3], bedoelde handboek te gebruiken en actueel te houden,

      b. voorafgaand aan de afgifte van een verklaring als bedoeld in het eerste lid, vast te stellen dat het product dan
      wel het onderdeel voldoet aan het van toepassing zijnde ontwerp en geschikt is voor veilig gebruik,

      c. alle geproduceerde producten of onderdelen in het kader van toezicht tijdig aan Onze Minister ter beschikking
      te stellen,

      d. gegevens te bewaren volgens bij ministeriële regeling te stellen regels,

      e. afwijkingen van een product of onderdeel van het van toepassing zijnde ontwerp, die worden geconstateerd na
      afgifte van een verklaring van conformiteit als bedoeld in het eerste lid, te melden aan de houder van het ontwerp
      en mee te werken aan het onderzoek of die afwijkingen tot een onveilige situatie kunnen leiden,

      f. de onder e bedoelde afwijkingen te melden aan Onze Minister op een bij ministeriële regeling te bepalen wijze,

      g. de onder e bedoelde afwijkingen te melden aan alle andere betrokkenen bij het productieproces,

      h. assistentie te verlenen aan de houder van het ontwerp om de voortdurende luchtwaardigheid te waarborgen, en

      i. te voldoen aan bij ministeriële regeling te stellen eisen ten aanzien van veranderingen die de degene die
      toestemming heeft verkregen als bedoeld in [artikel 41][ref4], betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0012651#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0012651#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0012651#Artikel41
      [ref4]: https://wetten.overheid.nl/BWBR0012651#Artikel41
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel42
