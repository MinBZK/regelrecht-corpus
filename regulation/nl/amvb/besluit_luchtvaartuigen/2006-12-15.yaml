  - number: 12a
    text: |-
      1 Onze Minister wijzigt op aanvraag van de houder, zijnde een JAA-persoon, welke houder tevens de houder is van
      het relevante type-certificaat, het aanvullend type-certificaat in verband met een ingrijpende wijziging van het
      ontwerp, waar het aanvullend type-certificaat betrekking op heeft, indien wordt voldaan aan de in artikel 8, eerste
      lid, genoemde voorwaarden.

      2 Onze Minister geeft op aanvraag van de houder van een aanvullend type-certificaat, zijnde een JAA-persoon,
      welke niet de houder is van het relevante type-certificaat, in verband met een ingrijpende wijziging van het
      ontwerp, waar het aanvullende type-certificaat betrekking op heeft, een nieuw aanvullend type-certificaat af.
      [Artikel 10][ref1] is van overeenkomstige toepassing.

      3 Onze Minister wijzigt op aanvraag van de houder, zijnde een JAA-persoon, het aanvullende type-certificaatin
      verband met een geringe wijziging van het ontwerp, waar het aanvullend type-certificaat betrekking op heeft,
      indien:

      a. Onze Minister deze wijziging als gering classificeert en het gewijzigde product aan de van toepassing zijnde
      eisen voldoet, of

      b. de classificatie als geringe wijziging door een houder van een DOA-JA is gedaan volgens een procedure, waarmee
      Onze Minister heeft ingestemd, en het gewijzigde product aan de van toepassing zijnde eisen voldoet.

      4 De eisen, bedoeld in het eerste tot en met derde lid, zijn de eisen waarnaar het aanvullend type-certificaat
      verwijst.

      5 Indien de technische ontwikkeling van de eisen daartoe aanleiding geeft, dan wel indien die eisen niet adequaat
      zijn, kunnen, in afwijking van het derde lid, bij ministeriële regeling in het belang van de veiligheid:

      a. eisen van toepassing worden verklaard die gelden op het moment waarop de aanvraag wordt ingediend en eventueel
      wijzigingen op die eisen, en

      b. speciale eisen worden gesteld en eventueel wijzigingen op die eisen, die noodzakelijk zijn om een voldoende
      luchtwaardigheidsniveau te waarborgen.


      [ref1]: https://wetten.overheid.nl/BWBR0012651#Artikel10
