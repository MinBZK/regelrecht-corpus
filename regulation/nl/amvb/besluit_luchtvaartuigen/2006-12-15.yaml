        paragraaf: '1'
  - number: '5'
    text: |-
      1 De eisen bedoeld in [artikel 4, eerste lid, onder b][ref1], zijn:

      a. voor grote vliegtuigen: de luchtwaardigheidseisen in JAR-25,

      b. voor kleine vliegtuigen: de luchtwaardigheidseisen in JAR-23,

      c. voor zeer lichte vliegtuigen: de luchtwaardigheidseisen in JAR VLA,

      d. voor vliegtuigen die in staat zijn tot een automatische landing: de luchtwaardigheidseisen in JAR-AWO,

      e. voor grote helicopters: de luchtwaardigheidseisen in JAR 29,

      f. voor kleine helicopters: de luchtwaardigheidseisen in JAR 27,

      g. voor zweefvliegtuigen en motorzweefvliegtuigen: de luchtwaardigheidseisen in JAR 22,

      h. luchtschepen: de luchtwaardigheidseisen, zoals bepaald bij ministeriële regeling,

      i. voor landbouwluchtvaartuigen: de luchtwaardigheidseisen, zoals bepaald bij ministeriële regeling,

      j. voor sleepvliegtuigen: de luchtwaardigheidseisen, zoals bepaald bij ministeriële regeling,

      k. voor bemande vrije ballonnen en hetelucht-luchtschepen: de luchtwaardigheidseisen, zoals bepaald bij
      ministeriële regeling,

      l. voor luchtvaartuigen met voortstuwingsinrichting: de geluidseisen van ICAO Annex 16, Vol. I,

      m. voor voortstuwingsinrichtingen: de in JAR-E opgenomen luchtwaardigheidseisen,

      n. voor hulpaggregaten: de in JAR-APU opgenomen luchtwaardigheidseisen,

      o. voor propellers: de in JAR-P opgenomen luchtwaardigheidseisen, en

      p. voor uitrustingsstukken: de in JAR-TSO opgenomen luchtwaardigheidseisen.

      2 Bij ministeriële regeling kunnen eisen worden gesteld voor andere dan de in het eerste lid genoemde
      luchtvaartuigen.

      3 Tenzij Onze Minister besluit tot eerdere inwerkingtreding, treedt een wijziging van een van de JAR's en de
      geldende JAA-procedures, die zijn vermeld in de Bijlage II bij [verordening (EEG) 3922/91](31991R3922), in werking
      met ingang van de dag waarop overeenkomstig artikel 11 van die verordening de betrokken wijziging is aangebracht.

      4 Tenzij Onze Minister besluit tot eerdere inwerkingtreding, treedt een wijziging van de overige JAR's
      onderscheidenlijk een wijziging van ICAO Annex 16 Vol.1, in werking op het moment dat deze wijziging door de JAA is
      vastgesteld onderscheidenlijk door ICAO van toepassing is verklaard.

      5 De eisen waaraan moet zijn voldaan, zijn de eisen zoals die gelden op de dag waarop de aanvraag wordt ingediend,
      tenzij:

      a. bij ministeriële regeling in het belang van de veiligheid later van kracht geworden wijzigingen van toepassing
      worden verklaard,

      b. de aanvrager verzoekt om later van kracht geworden wijzigingen van de van toepassing zijnde JAR op zijn aanvraag
      van toepassing te verklaren, of

      c. de aanvrager verzoekt om de luchtwaardigheidseisen van toepassing te verklaren zoals die in Nederland golden
      op het moment van zijn oorspronkelijke aanvraag van een type-certificaat bij de bevoegde autoriteit van een staat
      waarmee Onze Minister een overeenkomst heeft gesloten als bedoeld in [artikel 6, onder b][ref2], die voor hetzelfde
      ontwerp een type-certificaat heeft afgegeven op basis van eisen die niet gelijkwaardig zijn aan de in het eerste
      lid bedoelde eisen.

      6 In het geval de aanvrager een verzoek indient in de zin van het vijfde lid, onder b, toont hij ook aan dat het
      ontwerp voldoet aan alle andere wijzigingen van de van toepassing zijnde JAR, die bij ministeriële regeling van
      toepassing zijn verklaard.

      7 Bij ministeriële regeling worden in het belang van de veiligheid aanvullende eisen gesteld ten opzichte van de
      van toepassing zijnde eisen, indien die eisen, de luchtwaardigheid onvoldoende waarborgen, omdat:

      a. het product nieuwe of ongewone ontwerp-aspecten heeft,

      b. het voorgenomen gebruik van het product ongebruikelijk is, of

      c. ervaring met soortgelijke producten heeft geleerd dat zich onveilige omstandigheden kunnen ontwikkelen.


      [ref1]: https://wetten.overheid.nl/BWBR0012651#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0012651#Artikel6
