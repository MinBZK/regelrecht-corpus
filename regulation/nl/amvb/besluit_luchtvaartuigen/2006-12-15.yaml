  - number: '43'
    text: |-
      Elk product en onderdeel afkomstig uit een niet-JAA-land voldoet aan een type-certificaat of JTSO, dan wel,
      indien het om standaardonderdelen gaat, is in overeenstemming met de gezamenlijke procedures, bedoeld in
      [artikel 6, eerste lid, onder b][ref1], die met de betreffende staat zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0012651#Artikel6
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel43
    references:
      - id: ref1
