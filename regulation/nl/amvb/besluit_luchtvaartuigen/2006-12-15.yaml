  - number: '17'
    text: |-
      Onze Minister geeft op aanvraag van de houder van een luchtvaartuig een speciaal-BvL af indien het luchtvaartuig in
      staat is om op veilige wijze vluchten uit te voeren en voldoet aan bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel17
  - number: '18'
    text: |-
      1 Onze Minister geeft op aanvraag aan de houder van een nieuw luchtvaartuig het export-BvL af, indien:

      a. Onze Minister met de staat van invoer een overeenkomst heeft gesloten aangaande de erkenning van het export-BvL,

      b. het luchtvaartuig voldoet aan een type-ontwerp dat acceptabel is voor de bevoegde autoriteit van de staat van
      invoer;

      c. het luchtvaartuig is geproduceerd door een houder van een POA, dan wel door degene die toestemming heeft
      verkregen, als bedoeld in artikel 41,

      d. het luchtvaartuig voldoet aan de aanvullende eisen voor invoer die de bevoegde autoriteit van de staat van
      invoer stelt,

      e. de bij ministeriële regeling vereiste documentatie is overgelegd,

      f. het luchtvaartuig is geïdentificeerd overeenkomstig JAR 21, subpart Q, en

      g. het luchtvaartuig zich op een zodanige plaats bevindt, dat Onze Minister kan vaststellen dat aan de onder b tot
      en met f, gestelde eisen is voldaan.

      2 Het eerste lid is van overeenkomstige toepassing op gebruikte luchtvaartuigen, met uitzondering van onderdeel c,
      en met dien verstande dat de houder beschikt over een standaard-BvL, dan wel het luchtvaartuig in aanmerking komt
      voor een standaard-BvL.

      3 Aan de eisen in het eerste lid, onder b tot en met e en het tweede lid, behoeft niet te worden voldaan, indien de
      bevoegde autoriteit van de staat van invoer daarmee instemt.

      4 In het geval beschreven in het derde lid, worden afwijkingen van het product ten opzichte van het type-
      certificaat op het exportbewijs als uitzonderingen opgenomen.
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel18
  - number: '19'
    text: |-
      1 Een standaard-BvL voor een zweefvliegtuig of een motorzweefvliegtuig wordt afgegeven of verlengd voor een periode
      van ten hoogste 2 jaren.

      2 Een standaard-BvL voor een luchtvaartuig niet zijnde zweefvliegtuig of een motorzweefvliegtuig wordt afgegeven of
      verlengd voor een periode van ten hoogste 1 jaar.

      3 Een speciaal-BvL, wordt afgegeven of verlengd voor een periode van ten hoogste 1 jaar.

      4 Het export-BvL wordt eenmalig afgegeven.
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel19
  - number: '20'
    text: |-
      1 De houder van een bewijs van luchtwaardigheid is verplicht zijn vliegtuig, helicopter dan wel luchtschip, die
      voor commercieel vervoer worden gebruikt, te laten onderhouden door de houder van een MOA, dan wel door een door
      Onze Minister op grond van [artikel 3.28 van de wet][ref1] erkend bedrijf.

      2 De houder van een bewijs van luchtwaardigheid laat andere dan de in het eerste lid bedoelde luchtvaartuigen,
      onderhouden door de houder van een MOA, door de houder van een erkenning inzake onderhoud als bedoeld in
      [artikel 23, eerste lid, onder e][ref2], dan wel door de houder van een bewijs van bevoegdheid inzake onderhoud
      ingevolge [artikel 3.30 van de wet][ref3].

      3 Onderhoud van luchtvaartuigen geschiedt overeenkomstig de bij ministeriële regeling te stellen eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3.28
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel3.30
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3.28'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '23'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '3.30'
  - number: '21'
    text: |-
      1 De houder van een bewijs van luchtwaardigheid, met uitzondering van de houder van een export-BvL, is verplicht:

      a. alle op basis van de van toepassing zijnde JAR vereiste informatie in een bij ministeriële regeling te bepalen
      taal ter beschikking te hebben, en

      b. de identificatie-eisen voor producten en onderdelen van JAR 21, subpart Q na te komen.

      2 De houder van een export-BvL is verplicht:

      a. aan de autoriteit van de staat van invoer alle informatie te verschaffen ten behoeve van het goed functioneren
      van het luchtvaartuig, alsmede de assemblagegegevens indien een luchtvaartuig niet geassembleerd wordt ingevoerd,

      b. het niet geassembleerde luchtvaartuig goed te verpakken tijdens vervoer of opslag, en

      c. tijdelijke installaties aan het luchtvaartuig ten behoeve van het vervoer na aankomst in de staat van invoer
      te verwijderen.
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel21
  - number: '22'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld omtrent:

      a. de aanvraag van de verschillende bewijzen van luchtwaardigheid,

      b. de wijziging, overdracht, verlenging en vernieuwing van een bewijs van luchtwaardigheid,

      c. de procedure van aanvraag, afgifte, wijziging, schorsing en intrekking van een bewijs van luchtwaardigheid, en

      d. de wijze waarop de houder van een luchtvaartuig kan aantonen dat het noodzakelijke onderhoud heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel22
  - number: 22a
    text: |-
      Onze Minister geeft op aanvraag aan de houder van een luchtvaartuig een geluidscertificaat af, indien het
      luchtvaartuig voldoet aan de geluidseisen, bedoeld in [artikel 5, eerste lid, onderdeel l][ref1], en:

      a. het luchtvaartuig voldoet aan het type-certificaat en de van toepassing zijnde aanvullende type-certificaten die
      door Onze Minister zijn afgegeven of erkend, of

      b. het luchtvaartuig voldoet aan een door Onze Minister goedgekeurd type-ontwerp en is ontworpen en geproduceerd
      overeenkomstig de van toepassing zijnde regelingen van de staat van oorsprong.


      [ref1]: https://wetten.overheid.nl/BWBR0012651#Artikel5
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0012651
        artikel: '5'
        hoofdstuk: III
        paragraaf: '1'
  - number: 22b
    text: |-
      1 Op het geluidscertificaat vermeldt Onze Minister de gegevens die zijn vastgelegd ten behoeve van de afgifte van
      het typecertificaat en de eventueel van toepassing zijnde aanvullende type-certificaten.

      2 Indien de in het eerste lid bedoelde gegevens niet beschikbaar zijn, kan Onze Minister op het geluidscertificaat
      vermelden:

      a. de gegevens welke zijn vastgelegd bij een goedgekeurd type-ontwerp;

      b. de gegevens van een door Onze Minister met betrekking tot het desbetreffende luchtvaartuig geaccepteerd
      meetrapport;

      c. de gegevens op basis van een door Onze Minister geaccepteerde conservatieve schatting van de geluidsproductie;

      d. de limietwaarden van de geluidsproductie.
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel22b
  - number: 22c
    text: |-
      1 Op aanvraag van de houder van een luchtvaartuig waarvoor geen geluidseisen gelden kan Onze Minister voor het
      geluid relevante gegevens op een geluidsverklaring vermelden. Hiertoe legt de aanvrager met betrekking tot dat
      luchtvaartuig geluidsniveaus vast aan de hand van een naar het oordeel van Onze Minister adequate en betrouwbare
      meetmethode. De aanvrager verstrekt de gegevens over de geluidsniveaus aan Onze Minister.

      2 Onze Minister kan op aanvraag van de houder van een luchtvaartuig waarvoor geluidseisen gelden de voor het
      geluid relevante gegevens op een aanvullende geluidsverklaring vermelden. Hiertoe worden met betrekking tot dat
      luchtvaartuig geluidsniveaus vastgelegd en overgelegd aan de hand van een naar het oordeel van Onze Minister
      adequate en betrouwbare meetmethode.
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel22c
  - number: 22d
    text: |-
      Bij ministeriële regeling worden nadere regels vastgesteld omtrent:

      a. de procedure van aanvraag van een (voorlopig) geluidscertificaat, een (voorlopige) geluidsverklaring of een
      (voorlopige) aanvullende geluidsverklaring;

      b. de procedure van wijziging, overdracht, schorsing, intrekking, verlenging en vernieuwing van een (voorlopig)
      geluidscertificaat, een (voorlopige) geluidsverklaring of een (voorlopige) aanvullende geluidsverklaring.
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel22d
  - number: '23'
    text: |-
      1 Onze Minister kan de volgende erkenningen verlenen:

      a. een DOA-JA,

      b. een DOA-JB,

      c. een POA,

      d. een MOA, of

      e. een erkenning voor werkzaamheden die verband houden met de luchtwaardigheid en de geluidsproductie van producten
      of onderdelen, met uitzondering van werkzaamheden die reeds onder een van de erkenningen in de onderdelen a tot en
      met d vallen.

      2 Onze Minister kan aan een POA tevens één van de volgende machtigingen verbinden:

      a. een JTSO-machtiging, en

      b. een JPA-machtiging.
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel23
  - number: '24'
    text: |-
      1 Onze Minister verleent op aanvraag van een JAA-persoon een DOA-JA, indien:

      a. de aanvrager een organisatie met inbegrip van een kwaliteitssysteem heeft dat waarborgt dat de ontwerpen aan de
      eisen voldoen, en

      b. de aanvrager een handboek heeft waarin zijn organisatie, de procedures, de ontwerpen en de aan het personeel te
      stellen eisen worden omschreven.

      2 Bij ministeriële regeling worden nadere regels gesteld omtrent het in het eerste lid bepaalde.

      3 Een DOA-JA geldt voor de in de erkenning genoemde ontwerp-werkzaamheden, de categorieën producten, de specifieke
      producten en wijzigingen daarvan, en geeft de taken aan ten aanzien van de luchtwaardigheid en de geluidsproductie
      van die producten.
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel24
  - number: '25'
    text: |-
      1 Onze Minister kan aan de houder van een DOA-JA een of meer van de volgende bevoegdheden verlenen, die worden
      opgenomen in zijn erkenning:

      a. technische documentatie te keuren,

      b. ontwerp-wijzigingen te classificeren als een ingrijpende of geringe wijziging van het type-ontwerp, op basis van
      een door Onze Minister overeengekomen procedure,

      c. geringe wijzigingen van het type-ontwerp te keuren, op basis van een door Onze Minister vastgestelde procedure,

      d. informatie en instructies uit te geven die betrekking hebben op de wijziging van het type-ontwerp en te
      verklaren dat ze zijn goedgekeurd op basis van een door Onze Minister overeengekomen procedure,

      e. tekstuele wijzigingen van de minimum uitrustingslijst en van het vlieghandboek te keuren, deze uit te geven en
      te verklaren dat ze zijn goedgekeurd, op basis van een door Onze Minister vastgestelde procedure,

      f. ingrijpende wijzigingen van het type-ontwerp voor zover het betreft herstel te keuren, op basis van een door
      Onze Minister vastgestelde procedure.

      2 De houder van een DOA-JA is verplicht:

      a. het in [artikel 24, eerste lid, onder b][ref1], bedoelde handboek actueel te houden,

      b. dit handboek als een bindende instructie te gebruiken,

      c. de ontwerpen indien nodig aan te passen aan de van toepassing zijnde eisen, en

      d. aan Onze Minister informatie of instructies te overhandigen die betrekking hebben op de vereiste activiteiten
      van JAR 21.3(d) zodat voldaan wordt aan de aanwijzingen, bedoeld in [artikel 3.22 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012651#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel3.22
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0012651
        artikel: '24'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '3.22'
  - number: '26'
    text: |-
      1 Onze Minister verleent op aanvraag van een JAA-persoon een DOA-JB, indien:

      a. de aanvrager een organisatie met inbegrip van een kwaliteitssysteem heeft dat waarborgt dat de ontwerpen aan de
      eisen voldoen, en

      b. de aanvrager een handboek heeft waarin zijn organisatie, de procedures, de ontwerpen en de aan het personeel te
      stellen eisen worden omschreven.

      2 Bij ministeriële regeling worden nadere regels gesteld omtrent het in het eerste lid bepaalde.

      3 Een DOA-JB geldt voor de in de erkenning genoemde ontwerpwerkzaamheden, de categorieën onderdelen en geeft de
      werkzaamheden aan die mogen worden uitgevoerd ten aanzien van de luchtwaardigheid van die onderdelen.
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel26
  - number: '27'
    text: |-
      De houder van een DOA-JB is verplicht:

      a. het in [artikel 26, eerste lid, onder b][ref1], bedoelde handboek actueel te houden, en

      b. dit handboek als een bindende instructie te gebruiken.


      [ref1]: https://wetten.overheid.nl/BWBR0012651#Artikel26
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0012651
        artikel: '26'
        hoofdstuk: VI
  - number: '28'
    text: |-
      1 Onze Minister verleent op aanvraag van een JAA-persoon een POA, indien:

      a. de aanvrager een organisatie met inbegrip van een kwaliteitssysteem heeft dat waarborgt dat ieder geproduceerd
      product of onderdeel aan het van toepassing zijnde ontwerp voldoet en geschikt is voor veilig gebruik, en

      b. de aanvrager een handboek heeft waarin de organisatie wordt omschreven.

      2 Bij ministeriële regeling worden nadere regels gesteld omtrent het in het eerste lid bepaalde.

      3 Een POA geldt voor de in de erkenning genoemde productiewerkzaamheden, de producten dan wel de categorieën
      onderdelen waarvoor de houder de in [artikel 29, eerste lid][ref1], bedoelde bevoegdheden heeft.

      4 [Artikel 5, vierde lid][ref2], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012651#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0012651#Artikel5
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0012651
        artikel: '29'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0012651
        artikel: '5'
        hoofdstuk: III
        paragraaf: '1'
  - number: '29'
    text: |-
      1 De houder van een POA is bevoegd tot:

      a. het afgeven van een verklaring van conformiteit voor een luchtvaartuig, ter verkrijging van een bewijs van
      luchtwaardigheid, zonder nader onderzoek,

      b. het afgeven van een certificaat van vrijgave voor voortstuwingsinrichtingen, propellers en onderdelen, en

      c. het onderhouden van nieuwe, door hem geproduceerde, luchtvaartuigen en ten aanzien van dat onderhoud een
      certificaat van vrijgave voor gebruik af te geven.

      2 De houder van een POA is verplicht:

      a. het in [artikel 28, eerste lid, onder b][ref1], bedoelde handboek te gebruiken en actueel te houden,

      b. voorafgaand aan de afgifte van een van de documenten, bedoeld in het eerste lid, vast te stellen dat het product
      dan wel onderdeel voldoet aan het van toepassing zijnde ontwerp, het noodzakelijke onderhoud is uitgevoerd en het
      product dan wel onderdeel geschikt is voor veilig gebruik,

      c. gegevens te bewaren volgens bij ministeriële regeling te stellen regels,

      d. afwijkingen van een product of onderdeel van het van toepassing zijnde ontwerp, die worden geconstateerd na
      afgifte door de houder van een POA van een van de documenten, bedoeld in het eerste lid, te melden aan de houder
      van het type-certificaat, dan wel aan de houder van het goedgekeurde ontwerp en mee te werken aan het onderzoek of
      die afwijkingen tot een onveilige situatie kunnen leiden,

      e. de onder d, bedoelde afwijkingen aan Onze Minister te melden op een bij ministeriële regeling te bepalen wijze,

      f. de onder d, bedoelde afwijkingen te melden aan alle andere betrokkenen bij het productieproces,

      g. assistentie te verlenen aan de houder van het type-certificaat, dan wel aan de houder van het goedgekeurde
      ontwerp om de voortdurende luchtwaardigheid te waarborgen,

      h. de door hem vervaardigde producten van een merkteken te voorzien overeenkomstig JAR 21 Subpart Q, en

      i. te voldoen aan bij ministeriële regeling te stellen eisen ten aanzien van veranderingen die de houder van een
      POA betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0012651#Artikel28
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0012651
        artikel: '28'
        hoofdstuk: VI
  - number: '30'
    text: |-
      1 Onze Minister verleent op aanvraag van een JAA-persoon een MOA, indien:

      a. de aanvrager een organisatie met inbegrip van een kwaliteitssysteem heeft dat waarborgt dat ieder onderhouden
      product of onderdeel ten aanzien van het uitgevoerde onderhoud aan de van toepassing zijnde eisen voldoet en
      geschikt is voor veilig gebruik, en

      b. de aanvrager een handboek heeft waarin de organisatie wordt omschreven.

      2 Onze Minister verleent op aanvraag van een niet-JAA-persoon een MOA, indien:

      a. de aanvrager voldoet aan het eerste lid,

      b. de aanvrager heeft aangetoond dat er een noodzaak is om in een niet-JAA-land producten of onderdelen te
      onderhouden door de houder van een MOA, en

      c. de aanvraag wordt ondersteund door de JAA.

      3 Bij ministeriële regeling worden nadere regels gesteld omtrent het in het eerste en tweede lid bepaalde.

      4 Een MOA geldt voor de in de erkenning genoemde werkzaamheden, producten dan wel categorieën onderdelen, waarvoor
      de houder de in [artikel 31, eerste lid][ref1], bedoelde bevoegdheden heeft.

      5 [Artikel 5, derde lid][ref2], is van toepassing.

      6 Bij ministeriële regeling kan een van de eisen, bedoeld in het eerste lid, worden uitgezonderd en kunnen
      aanvullende eisen worden gesteld om een gelijkwaardig veiligheidsniveau te garanderen.


      [ref1]: https://wetten.overheid.nl/BWBR0012651#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0012651#Artikel5
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0012651
        artikel: '31'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0012651
        artikel: '5'
        hoofdstuk: III
        paragraaf: '1'
  - number: '31'
    text: |-
      1 De houder van een MOA is, voor zover opgenomen in zijn erkenning, bevoegd tot:

      a. het onderhouden van luchtvaartuigen of onderdelen daarvan waarvoor hij erkend is, op de locaties die in de
      erkenning zijn genoemd,

      b. het onder zijn verantwoordelijkheid uitbesteden van onderhoud,

      c. het op iedere locatie uitvoeren van onderhoud aan luchtvaartuigen waarvoor hij is erkend, dat nodig is
      als gevolg van het in onbruikbare staat zijn van het luchtvaartuig dan wel het ondersteunen van incidenteel
      lijnonderhoud, volgens een procedure waarmee Onze Minister heeft ingestemd,

      d. onderhoud van een luchtvaartuig waarvoor hij is erkend op een in het handboek genoemde locatie voor
      lijnonderhoud waar klein onderhoud kan worden gedaan, en

      e. de afgifte van een certificaat van vrijgave voor gebruik ten aanzien van het bepaalde onder a tot en met d.

      2 De houder van een MOA is verplicht:

      a. het in [artikel 30, eerste lid, onder b][ref1], bedoelde handboek te gebruiken en actueel te houden,

      b. zeker te stellen dat, voorafgaande aan de afgifte van het document, bedoeld in het eerste lid onder e, het
      vereiste onderhoud naar behoren is uitgevoerd en het luchtvaartuig of onderdeel als gevolg van dat onderhoud
      geschikt is voor veilig gebruik,

      c. gegevens te bewaren volgens bij ministeriële regeling te stellen regels,

      d. te melden aan de houder van het type-certificaat, dan wel aan de houder van het goedgekeurde ontwerp dat een
      product of onderdeel, in een zodanige staat verkeert dat het luchtvaartuig ernstig in gevaar gebracht kan worden of
      dat de geluidsproductie in aanzienlijke mate nadelig beïnvloed kan worden,

      e. de onder d bedoelde staat te melden aan Onze Minister op een bij ministeriële regeling te bepalen wijze,

      f. de onder d bedoelde staat te melden aan de houder van het luchtvaartuig, en

      g. te voldoen aan bij ministeriële regeling te stellen eisen ten aanzien van veranderingen die de houder van een
      MOA betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0012651#Artikel30
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0012651
        artikel: '30'
        hoofdstuk: VI
  - number: '32'
    text: |-
      1 Onze Minister verleent op aanvraag een erkenning als bedoeld in [artikel 23, eerste lid onder e][ref1], indien:

      a. de aanvrager een organisatie met inbegrip van een kwaliteitssysteem heeft dat waarborgt dat de resultaten van de
      werkzaamheden aan de van toepassing zijnde eisen voldoen en niet tot een onveilige situatie kunnen leiden, en

      b. de aanvrager een handboek heeft waarin de organisatie wordt omschreven.

      2 Bij ministeriële regeling worden nadere regels gesteld omtrent het in het eerste lid bepaalde.

      3 Een erkenning geldt voor de in de erkenning genoemde werkzaamheden, producten dan wel categorieën onderdelen,
      waarvoor de houder de in [artikel 33, eerste lid][ref2], bedoelde bevoegdheden heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0012651#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0012651#Artikel33
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0012651
        artikel: '23'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0012651
        artikel: '33'
        hoofdstuk: VI
  - number: '33'
    text: |-
      1 De houder van een erkenning als bedoeld in [artikel 32][ref1], is bevoegd tot:

      a. de werkzaamheden die zijn opgenomen in de erkenning, en

      b. de afgifte van een certificaat van vrijgave dan wel een certificaat van vrijgave voor gebruik ten aanzien van
      het bepaalde onder a.

      2 De houder van een erkenning als bedoeld in [artikel 32][ref2], is verplicht:

      a. het in [artikel 32, eerste lid, onder b][ref3], bedoelde handboek te gebruiken en actueel te houden,

      b. voorafgaande aan de afgifte van een document bedoeld in het eerste lid onder b, vast te stellen dat de
      resultaten van de werkzaamheden voldoen aan de van toepassing zijnde eisen, de werkzaamheden naar behoren zijn
      uitgevoerd en de resultaten niet tot onveilige situaties kunnen leiden,

      c. gegevens te bewaren volgens bij ministeriële regeling te stellen regels,

      d. in het geval van een ontwerperkenning de ontwerpen indien nodig aan te passen aan de van toepassing zijnde
      eisen,

      e. in het geval van een ontwerperkenning alle proefprogramma's of proeven in het kader van toezicht tijdig aan Onze
      Minister ter beschikking te stellen,

      f. in het geval van een productie-erkenning, afwijkingen van een product of onderdeel van het van toepassing zijnde
      ontwerp, die worden geconstateerd na afgifte van een certificaat als bedoeld in het eerste lid, onder b, te melden
      aan de houder van het type-certificaat, dan wel aan de houder van het goedgekeurde ontwerp en mee te werken aan het
      onderzoek of die afwijkingen tot een onveilige situatie kunnen leiden,

      g. in het geval van een productie-erkenning de onder f bedoelde afwijkingen te melden aan alle andere betrokkenen
      bij het productieproces,

      h. in het geval van een onderhoudserkenning een zodanige staat van een product of onderdeel, die het luchtvaartuig
      ernstig in gevaar kan brengen, te melden aan de houder van het type-certificaat, dan wel aan de houder van het
      goedgekeurde ontwerp,

      i. in het geval van een onderhoudserkenning de onder h bedoelde staat te melden aan de houder van het
      luchtvaartuig,

      j. in het geval van een productie- of onderhoudserkenning de onder f en h bedoelde afwijkingen en staat te melden
      aan Onze Minister op een bij ministeriële regeling te bepalen wijze,

      k. te voldoen aan bij ministeriële regeling te stellen eisen ten aanzien van veranderingen die de houder van een
      erkenning betreffen, en

      l. in het geval van een erkenning als bedoeld in [artikel 23, eerste lid, onderdeel e][ref4], de bij ministeriële
      regeling vastgestelde meetgegevens en meetresultaten op een bij die regeling vastgestelde wijze aan Onze Minister
      ter beschikking te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0012651#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0012651#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0012651#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0012651#Artikel23
    url: https://wetten.overheid.nl/BWBR0012651/2006-12-15#Artikel33
