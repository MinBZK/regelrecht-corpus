---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: reglement_van_de_raad_voor_het_kwekersrecht
regulatory_layer: AMVB
publication_date: '2005-12-20'
valid_from: '1994-09-30'
bwb_id: BWBR0002569
url: https://wetten.overheid.nl/BWBR0002569/1994-09-30
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Minister van Landbouw en Visserij van 15 februari 1967, no. J. 505, Directie Juridische
    en Bedrijfsorganisatorische Zaken;

    Gelet op de artikelen 4, tweede lid, 15, eerste lid, 18, tweede lid, 27, 39, 47 en 57 van de Zaaizaad- en
    Plantgoedwet;

    De Raad van State gehoord (advies van 8 maart 1967, no. 50);

    Gezien het nader rapport van Onze voornoemde Minister van 29 maart 1967, no. J. 809, Directie Juridische en
    Bedrijfsorganisatorische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van het bij of krachtens dit besluit bepaalde wordt verstaan onder "wet": De
      [Zaai- en Plantgoedwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002541
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002541
  - number: '2'
    text: |-
      De Centrale Afdeling bestaat uit de voorzitter, de vice-voorzitter van de Afdeling Landbouwgewassen en de vice-
      voorzitter van de Afdeling Tuinbouwgewassen.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel2
  - number: '3.1'
    text: De Afdeling Landbouwgewassen en de Afdeling Tuinbouwgewassen bestaan ieder uit vijf leden en een vice-voorzitter.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel3
  - number: '3.2'
    text: Zij worden voorgezeten door de voorzitter of de vice-voorzitter van de betrokken afdeling.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel3
  - number: '4'
    text: De Afdeling van Beroep bestaat uit vier leden en een vice-voorzitter, die de afdeling voorzit.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel4
  - number: '5.1'
    text: |-
      De voorzitter, de vice-voorzitters en de overige leden van de Raad zullen, elk naar de wijze zijner godsdienstige
      gezindheid, alvorens in bediening te treden, de navolgende eed (verklaring en belofte) afleggen: "Ik zweer
      (beloof), dat ik ijverig, nauwgezet en onpartijdig de plichten zal vervullen, welke het ambt van voorzitter
      (vice-voorzitter, lid) van de Raad voor het Kwekersrecht meebrengt, en met name aan de in de afdelingen te nemen
      beslissingen naar eigen overtuiging zal meewerken, geheim zal houden, hetgeen mij uit hoofde van mijn ambt bekend
      is geworden, voor zover dit niet ter openbare kennis is gebracht, alsmede stiptelijk zal helpen uitvoeren de
      wettelijke voorschriften, op de [Zaaizaad- en Plantgoedwet][ref1] betrekking hebbende en dat ik, om iets hoegenaamd
      in dit ambt te doen of te laten, van niemand middellijk of onmiddellijk enige belofte of enig geschenk zal
      aannemen. Dat zweer (beloof) ik. Ik verklaar dat ik middellijk noch onmiddellijk, onder welke naam of voorwendsel
      ook, voor het verkrijgen van mijn aanstelling aan iemand, wie het ook zij, iets heb gegeven of beloofd. Dat
      verklaar ik".


      [ref1]: https://wetten.overheid.nl/BWBR0002541
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002541
  - number: '5.2'
    text: Van het afleggen van de eed (belofte) en de verklaring als hiervoren genoemd, wordt een akte opgemaakt.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel5
  - number: '6'
    text: |-
      Namens de voorzitter roept de secretaris vergaderingen van de Raad bijeen. Bij elke vergadering van de Raad of een
      der Afdelingen is de secretaris of een adjunct-secretaris aanwezig.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel6
  - number: '7.1'
    text: |-
      In de Afdeling Landbouwgewassen, onderscheidenlijk de Afdeling Tuinbouwgewassen wordt beraadslaagd en beslist met
      de voorzitter of vice-voorzitter en twee leden.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel7
  - number: '7.2'
    text: |-
      De voorzitter of vice-voorzitter kan bepalen, dat een beslissing van een der in het eerste lid genoemde Afdelingen
      de bekrachtiging behoeft van de Centrale Afdeling.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel7
  - number: '7.3'
    text: De Afdeling van Beroep beslist met meerderheid van stemmen. Bij staking van stemmen beslist de vice-voorzitter.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel7
  - number: '8.1'
    text: Het Nederlands Rassenregister wordt gehouden door de Raad.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel8
  - number: '8.2'
    text: |-
      Het register ligt voor belanghebbenden ter inzage bij het bureau van de Raad op alle dagen, waarop de Rijksdienst
      is geopend, tussen 10-12 uur en 14-16 uur.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel8
  - number: '9.1'
    text: 'Het Nederlands Rassenregister bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel9
  - number: 9.1.a
    text: het Register van aanvragen;
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel9
  - number: 9.1.b
    text: het Register van inschrijving.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel9
  - number: '9.2'
    text: De Raad stelt de inrichting van het register vast met inachtneming van het hierna volgende.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel9
  - number: '9.3'
    text: 'In het Register van aanvragen worden aangetekend of ingeschreven:'
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel9
  - number: 9.3.a
    text: |-
      de aanvragen tot inschrijving ingevolge [artikel 18, tweede lid][ref1], en de aanvragen tot verlening van
      kwekersrecht ingevolge [artikel 35 van de wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002569#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002541
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002569
        artikel: '18'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002541
  - number: 9.3.b
    text: |-
      hetgeen betrekking heeft op de onder *a* bedoelde aanvragen en waarvan aantekening of inschrijving bij of krachtens
      de wet wordt voorgeschreven of door de Raad dienstig wordt geoordeeld;
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel9
  - number: 9.3.c
    text: de beslissing van de Raad.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel9
  - number: '9.4'
    text: 'In het Register van inschrijving worden ingeschreven of aangetekend:'
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel9
  - number: 9.4.a
    text: |-
      de rassen bedoeld in [artikel 18 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002541
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002541
  - number: 9.4.b
    text: |-
      hetgeen betrekking heeft op de ingeschreven rassen en waarvan inschrijving of aantekening bij of krachtens de wet
      wordt voorgeschreven of door de Raad dienstig wordt geoordeeld.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel9
  - number: '9.5'
    text: Iedere inschrijving en aantekening wordt van een dagtekening voorzien.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel9
  - number: '10.1'
    text: |-
      Bij de Raad ingediende en tot de Raad gerichte stukken worden, ter bepaling van het tijdstip, waarop zij zijn
      ingediend, onmiddellijk na ontvangst voorzien van een stempel, houdende uur, dag, maand en jaar van die ontvangst.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel10
  - number: '10.2'
    text: |-
      Stukken, welke worden bezorgd buiten de uren, waarop het bureau van de Raad is geopend, worden, behoudens
      tegenbewijs, geacht te zijn ontvangen op het eerstvolgende tijdstip, waarop het bureau wordt geopend.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel10
  - number: '10.3'
    text: |-
      Indien verscheidene stukken op hetzelfde uur zijn afgestempeld, worden deze geacht te zijn ontvangen in volgorde
      van agendering.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel10
  - number: '10.4'
    text: |-
      Indien in één stuk verschillende zaken worden behandeld, worden zij geacht te zijn ontvangen in de volgorde als
      vermeld in dat stuk.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel10
  - number: '10.5'
    text: Bij bezorging van stukken anders dan per post wordt op verlangen een ontvangstbewijs afgegeven.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel10
  - number: '11'
    text: De ondertekening van stukken moet, indien dit verlangd wordt, gelegaliseerd worden.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel11
  - number: '13.1'
    text: |-
      De oproeping van aanvragers, verzoekers en andere belanghebbenden en van getuigen en deskundigen, die de Raad wenst
      te horen, geschiedt schriftelijk, met opgave van dag en uur, voor de verschijning bepaald.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel13
  - number: '13.2'
    text: |-
      Bij de oproeping moet tussen de dag der verzending en die der verschijning een termijn van tenminste 3 dagen worden
      in acht genomen.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel13
  - number: '14.1'
    text: Van het verhoor van getuigen en deskundigen wordt een akte opgemaakt.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel14
  - number: '14.2'
    text: Van de door getuigen en deskundigen afgelegde eed (belofte) wordt in de akte melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel14
  - number: '14.3'
    text: Onze Minister stelt regelen vast met betrekking tot de geldelijke vergoedingen.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel14
  - number: '14.4'
    text: |-
      De toelegging van de krachtens het vorige lid vast te stellen vergoedingen geschiedt door de voorzitter, die de
      zaak heeft behandeld.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel14
  - number: '15'
    text: |-
      De beslissingen van de Raad zijn gedagtekend en worden door degene die de zaak heeft voorgezeten en behandeld in de
      Afdeling, alsmede door de betrokken secretaris ondertekend.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel15
  - number: '16'
    text: |-
      De [artikelen 35, derde en vierde lid][ref1], en [36 van de wet][ref2] zijn ten aanzien van aanvragen tot
      inschrijving van rassen ingevolge het bepaalde in [artikel 18, tweede lid, van de wet][ref3], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0002541#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0002541#Artikel18
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0002541
        artikel: '36'
      - id: ref3
        bwb_id: BWBR0002541
        artikel: '18'
  - number: '17.1'
    text: |-
      Een aanvrage ingevolge [artikel 18, tweede lid][ref1], en ingevolge [artikel 35 van de wet][ref2] moet in tweevoud
      worden ingediend op een door de Raad ter beschikking gesteld aanvraagformulier, met bijbehorend beschrijvingsblad,
      dat voor de onderscheiden gewassen of groepen van gewassen verschillend kan zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002569#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002541#Artikel35
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002569
        artikel: '18'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002541
        artikel: '35'
  - number: '17.2'
    text: |-
      Het beschrijvingsblad dient mede te bevatten de wijze waarop het ras is gewonnen en indien het betreft een aanvrage
      ingevolge [artikel 18, tweede lid, van de wet][ref1], de gegevens, waaruit van de eigen kweekarbeid blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel18
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '18'
  - number: '17.3'
    text: |-
      De aanvrage wordt voorzien van een volgnummer, dat gehandhaafd blijft tot de aanvrage is ingetrokken of de daarop
      gegeven eindbeslissing kracht van gewijsde heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel17
  - number: '18.1'
    text: |-
      Het teeltmateriaal wordt geacht tegelijk met de aanvrage ter beschikking van de Raad te zijn gesteld, indien het
      binnen twee weken na het tijdstip, waarop de aanvrage ingevolge [artikel 10][ref1] is ingediend, is ontvangen op
      een door de Raad aan te wijzen plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0002569#Artikel10
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002569
        artikel: '10'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '18.2'
    text: De Raad kan op verzoek van de aanvrager de in het eerste lid bedoelde termijn verlengen met ten hoogste 6 maanden.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel18
  - number: '18.3'
    text: |-
      Indien na verloop van de vastgestelde termijn het teeltmateriaal niet is ontvangen, wordt de aanvrage geacht te
      zijn ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel18
  - number: '18.4'
    text: De Raad kan nadere eisen stellen met betrekking tot het benodigde teeltmateriaal en de verpakking daarvan.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel18
  - number: '18.5'
    text: |-
      De Raad maakt door publikatie in de *Staatscourant* bekend, voor welke tijdstippen het voor het onderzoek benodigde
      teeltmateriaal voor de onderscheiden gewassen moet zijn ontvangen om in het eerstvolgende seizoen onderzocht te
      kunnen worden.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel18
  - number: '19.1'
    text: 'In het Register van aanvragen worden van de aanvrage aangetekend:'
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel19
  - number: 19.1.a
    text: de naam, voornamen en adres van de aanvrager of aanvragers en van de gemachtigde, zo deze is aangewezen;
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel19
  - number: 19.1.b
    text: de naam van het gewas, waartoe het ras behoort;
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel19
  - number: 19.1.c
    text: de benaming van het ras of de voorlopige aanduiding;
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel19
  - number: 19.1.d
    text: het in artikel 10 bedoelde tijdstip;
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel19
  - number: 19.1.e
    text: het in artikel 17 bedoelde volgnummer;
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel19
  - number: 19.1.f
    text: de opgave, of het een voorlopige aanvrage betreft.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel19
  - number: '19.2'
    text: |-
      Zo spoedig mogelijk na de aantekening in het Register van aanvragen wordt de aanvrager of de gemachtigde kennis
      gegeven van de dagtekening en het volgnummer van de aanvrage.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel19
  - number: '19.3'
    text: |-
      Tevens wordt door de Raad zo spoedig mogelijk mededeling van de aantekening van een aanvrage of voorlopige aanvrage
      gedaan in de *Nederlandse Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel19
  - number: '21.1'
    text: |-
      De Raad kan een of meer deskundigen aanwijzen onder bepaling van het voorwerp van onderzoek; hiervan wordt
      mededeling gedaan aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel21
  - number: '21.2'
    text: |-
      De Raad is bevoegd vaste deskundigen of vaste commissies van deskundigen te benoemen, onder vaststelling van hun
      taak.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel21
  - number: '21.3'
    text: |-
      De aanvrager is verplicht, zo dikwijls de Raad zulks voor het onderzoek nodig acht, binnen een te stellen termijn
      een door de Raad vast te stellen hoeveelheid teeltmateriaal kosteloos ter beschikking van de Raad te stellen.
      Artikel 18, derde en vierde lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel21
  - number: '22.1'
    text: |-
      De beslissing tot verlening van kwekersrecht of de beslissing tot inschrijving van een ras als bedoeld in
      [artikel 18, tweede lid, van de wet][ref1] wordt aangetekend in het Register van aanvragen zodra deze beslissing
      kracht van gewijsde heeft gekregen.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel18
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '18'
  - number: '22.2'
    text: De inschrijving van een ras geschiedt in het Register van inschrijving onder toekenning van een volgnummer.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel22
  - number: '23'
    text: |-
      Binnen een maand na inschrijving in het Register van inschrijving, wordt aan de aanvrager een bewijs van
      inschrijving verstrekt, waarvan het model wordt vastgesteld door de Raad.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel23
  - number: '24.1'
    text: |-
      Een verzoek tot nietigverklaring of opeising moet naast het bepaalde in [artikel 54, tweede lid][ref1], en
      [55, vierde lid van de wet][ref2] de benaming van het ras en de naam van het gewas, waartoe het ras behoort,
      bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0002541#Artikel55
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '54'
      - id: ref2
        bwb_id: BWBR0002541
        artikel: '55'
  - number: '24.2'
    text: |-
      De Raad zendt een afschrift van het verzoekschrift aan de houder van het kwekersrecht, onder vaststelling van de
      termijn, binnen welke hij door het inzenden van een bezwaarschrift van antwoord kan dienen.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel24
  - number: '24.3'
    text: |-
      De Raad is bevoegd de termijn, bedoeld in het vorige lid, te verlengen of nadere schriftelijke toelichting van
      partijen te verlangen of toe te staan.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel24
  - number: '24.4'
    text: |-
      Van het binnenkomen van een dergelijk verzoek wordt kennis gegeven aan de belanghebbenden, van wier bestaan uit het
      register blijkt. Deze worden op hun verzoek door de Raad gehoord.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel24
  - number: '24.5'
    text: De Raad beslist niet dan na partijen te hebben gehoord of althans behoorlijk daartoe te hebben opgeroepen.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel24
  - number: '25.1'
    text: |-
      Het verzoek tot het verlenen van een licentie door de Raad moet met redenen omkleed zijn en in ieder geval
      bevatten de mededeling, onder welke voorwaarden verzoeker licentie wenst te verkrijgen en zo mogelijk onder welke
      voorwaarden de houder van het kwekersrecht hem licentie wil verlenen.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel25
  - number: '25.2'
    text: Het verzoek moet tevens de benaming van het ras en de naam van het gewas, waartoe het ras behoort, bevatten.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel25
  - number: '25.3'
    text: |-
      De Raad zendt een afschrift van het verzoek aan de houder van het kwekersrecht onder vaststelling van de termijn,
      binnen welke hij van antwoord kan dienen.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel25
  - number: '25.4'
    text: |-
      De Raad is bevoegd de termijn, bedoeld in het vorige lid, te verlengen of nadere schriftelijke toelichting van
      partijen te verlangen of toe te staan.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel25
  - number: '26.1'
    text: Het voorstel tot het doen van een openbaar aanbod tot licentieverlening wordt schriftelijk bij de Raad ingediend.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel26
  - number: '26.2'
    text: |-
      Indien de Raad zich verenigt met de voorwaarden tot licentieverlening, doet hij hiervan mededeling aan de houder
      van het kwekersrecht, waarbij hij zodanige aanwijzingen geeft als hij in het belang van de voorziening van de markt
      met teeltmateriaal tegen redelijke voorwaarden gewenst acht.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel26
  - number: '27'
    text: |-
      Indien de houder van het kwekersrecht de voorwaarden, waaronder de licenties als bedoeld in
      [artikel 44, tweede lid, van de wet][ref1] zijn verleend, wil wijzigen, brengt hij de voorgenomen wijzigingen
      schriftelijk ter kennis van de Raad. [Artikel 26, tweede lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0002569#Artikel26
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0002569
        artikel: '26'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '28'
    text: |-
      In de kennisgeving als bedoeld in [artikel 44, zesde lid, van de wet][ref1], deelt de Raad de houder van het
      kwekersrecht tevens mede, welke wijzigingen van de voorwaarden hij wenselijk acht. De houder van het kwekersrecht
      dient het voorstel tot wijziging van de voorwaarden schriftelijk bij de Raad in.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel44
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '44'
  - number: '29'
    text: Onze Minister kan nadere voorschriften geven met betrekking tot de werkwijze van de Raad.
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel29
  - number: '30.1'
    text: Dit besluit kan worden aangehaald als "Reglement van de Raad voor het Kwekersrecht".
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel30
  - number: '30.2'
    text: |-
      Het treedt in werking met ingang van het tijdstip, waarop de [Zaaizaad- en Plantgoedwet][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0002541
    url: https://wetten.overheid.nl/BWBR0002569/1994-09-30#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002541
