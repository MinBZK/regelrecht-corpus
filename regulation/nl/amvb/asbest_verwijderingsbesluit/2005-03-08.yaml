---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: asbest_verwijderingsbesluit
regulatory_layer: AMVB
publication_date: '2005-12-27'
valid_from: '2005-03-08'
bwb_id: BWBR0006006
url: https://wetten.overheid.nl/BWBR0006006/2005-03-08
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 15 april 1992,
    nr. MJZ 15492051, Centrale Directie Juridische Zaken, Afdeling Wetgeving, gedaan mede namens Onze Minister van
    Sociale Zaken en Werkgelegenheid en de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur;

    Gelet op artikel 7 van richtlijn nr. 87/217/EEG van de Raad van de Europese Gemeenschappen van 19 maart 1987,
    inzake voorkoming en vermindering van verontreiniging van het milieu door asbest (PbEG L 85) en op deartikelen 24,
    35, vierde lid, en 39, derde lid, van de Wet milieugevaarlijke stoffen alsmede, voor zover het betreft het slopen
    van bouwwerken, op de artikelen 8, achtste lid, juncto 8, tweede lid, onderdelen d en h, en 110, eerste lid, van
    de Woningwet;

    De Raad van State gehoord (advies van 12 november 1992, nr. W08.92.0174);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 18
    mei 1993, nr. MJZ18593019, Centrale Directie Juridische Zaken, Afdeling Wetgeving, uitgebracht mede namens Onze
    Minister van Sociale Zaken en Werkgelegenheid en de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel1
  - number: 1.a
    text: |-
      asbest: de vezelachtige silicaten actinoliet (Cas-nummer 77536-66-4), amosiet (Cas-nummer 12172-73-5), anthofylliet
      (Cas-nummer 77536-67-5), chrysotiel (Cas-nummer 12001-29-5), crocidoliet (Cas-nummer 12001-28-4) en tremoliet (Cas-
      nummer 77536-68-6), alsmede produkten waarin die vezelachtige silicaten zijn verwerkt;
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel1
  - number: 1.b
    text: |-
      object: apparaat, transportmiddel, constructie of installatie, niet zijnde een bouwwerk in de zin van de
      [Woningwet][ref1] (*Stb.* 1991, 439);


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: 1.c
    text: |-
      deskundig bedrijf: bedrijf dat voldoet aan de eisen ter zake van asbestverwijdering onderscheidenlijk
      asbestonderzoek, zoals die zijn gesteld door een door de Raad voor Accreditatie erkende certificatie-instelling, op
      grond waarvan het bedrijf is gemachtigd een ingevolge [artikel 11][ref1] bedoeld merkteken te voeren;


      [ref1]: https://wetten.overheid.nl/BWBR0006006#Artikel11
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006006
        artikel: '11'
        paragraaf: '5'
  - number: 1.d
    text: 'Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;'
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel1
  - number: 1.e
    text: |-
      hechtgebonden asbest: asbest in een product met een kwaliteitsfactor van 0,35 of meer, bepaald volgens een bij
      ministeriële regeling vastgestelde methode.
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel1
  - number: '2'
    text: 'In de bouwverordening wordt bepaald dat:'
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel2
  - number: 2.a
    text: |-
      Onverminderd het ter zake bepaalde in de bouwverordening het verboden is een bouwwerk te slopen zonder of in
      afwijking van een vergunning van burgemeester en wethouders (sloopvergunning), voor zover in dat bouwwerk asbest
      aanwezig is.
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel2
  - number: 2.b
    text: |-
      Het onder *a* bepaalde niet van toepassing is ten aanzien van bij de bouwverordening aangegeven gevallen, mits
      het voornemen tot slopen bij burgemeester en wethouders is gemeld en door hen overeenkomstig bij die verordening
      gegeven voorschriften binnen acht dagen na de dag waarop het voornemen tot slopen is gemeld, is medegedeeld dat
      geen sloopvergunning is vereist.
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel2
  - number: 2.c
    text: |-
      Indien burgemeester en wethouders ten aanzien van een bij de bouwverordening aangegeven geval, niet binnen de
      termijn, bedoeld onder *b*, hebben medegedeeld dat geen sloopvergunning is vereist, de mededeling van rechtswege
      is gedaan.
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel2
  - number: 2.d
    text: |-
      Burgemeester en wethouders aan een mededeling als bedoeld onder *b*, voorschriften kunnen verbinden met betrekking
      tot de verwijdering, opslag en afvoer van asbest binnen een bij die mededeling aangegeven termijn.
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel2
  - number: 2.e
    text: |-
      Een mededeling als bedoeld onder *b*, in elk geval wordt gedaan indien de melding betrekking heeft op het slopen
      van asbestbevattende vloerbedekking uit een tot bewoning bestemd gebouw. De houder van een mededeling als bedoeld
      onder *b* of *c*, tenminste verplicht is het gestelde in een door Onze Minister uitgegeven publikatie ter zake
      van het slopen van asbestbevattende vloerbedekking in acht te nemen. De houder van een zodanige mededeling voorts
      verplicht is ter zake van de afvoer van asbestbevattende vloerbedekking de in de gemeente geldende voorschriften in
      acht te nemen.
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel2
  - number: 2.f
    text: |-
      Indien ter zake van een geval als bedoeld onder *b*, door Onze Minister een publikatie is uitgegeven, de houder van
      een mededeling als bedoeld onder *b* of *c*, die op een zodanig geval betrekking heeft, tenminste verplicht is het
      gestelde in die publikatie in acht te nemen. De houder van een zodanige mededeling voorts verplicht is de ter zake
      van de afvoer in de gemeente geldende voorschriften in acht te nemen.
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel2
  - number: 2.g
    text: Een aanvraag om sloopvergunning tevens geldt als melding van het voornemen tot slopen als bedoeld onder *b*.
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel2
  - number: 2.h
    text: |-
      Burgemeester en wethouders eisen, voor zover de aanvraag is gericht op het verkrijgen van een sloopvergunning,
      de overlegging van een door een deskundig bedrijf opgesteld onderzoeksrapport waaruit in elk geval blijkt of
      en op welke plaatsen in het te slopen bouwwerk zich asbest bevindt en een door een deskundig bedrijf opgesteld
      onderzoeksrapport niet hoeft te worden overlegd indien naar het oordeel van burgemeester en wethouders in voldoende
      mate is aangetoond of en waar zich asbest in het bouwwerk bevindt.
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel2
  - number: '3'
    text: 'In de bouwverordening wordt voorts bepaald dat:'
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel3
  - number: 3.a
    text: |-
      De houder van een sloopvergunning het slopen, voor zover dat betrekking heeft op asbest, opdraagt aan een deskundig
      bedrijf.
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel3
  - number: 3.b
    text: |-
      De houder van een sloopvergunning een afschrift van de sloopvergunning ter hand stelt aan het bedrijf, bedoeld
      onder *a*, dat het slopen krachtens aanneming van werk zal uitvoeren.
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel3
  - number: 3.c
    text: |-
      De houder van een sloopvergunning, indien een rapport als bedoeld in [artikel 2, onder ][ref1], is opgesteld, een
      exemplaar van dat rapport dan wel het schriftelijk stuk waarmee naar het oordeel van burgemeester en wethouders
      in voldoende mate is aangetoond waar zich asbest in het bouwwerk bevindt, ter hand stelt aan het bedrijf, bedoeld
      onder *a*, dat het slopen krachtens aanneming van werk zal uitvoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0006006#Artikel2
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006006
        artikel: '2'
        paragraaf: '2'
  - number: 3.d
    text: |-
      De houder van een sloopvergunning, indien de sloopwerkzaamheden waarop de vergunning betrekking heeft, krachtens
      aanneming van werk worden uitgevoerd, verplicht is het slopen, voor zover dat betrekking heeft op asbest, voordat
      met de werkzaamheden wordt begonnen schriftelijk te melden aan de regiodirecteur van de Arbeidsinspectie binnen
      wiens regio de werkzaamheden worden uitgevoerd. Hij daarbij tevens mededeelt welk bedrijf de werkzaamheden uitvoert
      en het tijdstip waarop met de werkzaamheden wordt begonnen.
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel3
  - number: 3.e
    text: |-
      Onverminderd [artikel 4, onder ][ref1], de houder van een sloopvergunning het uit het bouwwerk afkomstige,
      opgeslagen asbest, bedoeld in [artikel 4, onder ][ref2], overeenkomstig door burgemeester en wethouders bij de
      vergunning te stellen voorschriften afvoert binnen een in de vergunning gestelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006006#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006006#Artikel4
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006006
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006006
        artikel: '4'
        paragraaf: '2'
  - number: 3a
    text: |-
      In de bouwverordening wordt voorts bepaald dat de[ artikelen 2][ref1] en [3][ref2] niet van toepassing zijn,
      indien het slopen, voor zover dat betrekking heeft op asbest, uitsluitend bestaat uit het in het kader van de
      uitoefening van beroep of bedrijf:


      [ref1]: https://wetten.overheid.nl/BWBR0006006#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006006#Artikel3
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0006006
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006006
        artikel: '3'
        paragraaf: '2'
  - number: 3a.a
    text: 'als één geheel verwijderen van:'
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel3a
  - number: 3a.a.1°
    text: verwarmingstoestellen waarin zich asbest bevindt,
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel3a
  - number: 3a.a.2°
    text: |-
      asbestbevattende warmteblokken van verwarmingstoestellen die een nominale belasting kleiner dan of gelijk aan een
      bovenwaarde van 130 kilowatt hebben, of
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel3a
  - number: 3a.a.3°
    text: onder verwarmingstoestellen geklemde, asbestbevattende platen waarin de asbestvezels hechtgebonden zijn,
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel3a
  - number: 3a.b
    text: 'geheel of gedeeltelijk verwijderen van asbestbevattende pakkingen met uitzondering van het:'
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel3a
  - number: 3a.b.1°
    text: |-
      geheel of gedeeltelijk verwijderen van asbestbevattende pakkingen uit verwarmingstoestellen die een nominale
      belasting groter dan een bovenwaarde van 2250 kilowatt hebben, of
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel3a
  - number: 3a.b.2°
    text: |-
      in het kader van het verwijderen van verwarmingstoestellen geheel of gedeeltelijk verwijderen van asbestbevattende
      pakkingen die zich tussen ketelleden bevinden, of
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel3a
  - number: 3a.c
    text: geheel of gedeeltelijk verwijderen van asbestbevattende rem- en frictiematerialen.
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel3a
  - number: 3b
    text: |-
      In de bouwverordening wordt voorts bepaald dat in afwijking van [artikel 3][ref1] ten aanzien van het in het kader
      van beroep of bedrijf slopen van een tuinbouwkas, voor zover dat slopen betrekking heeft op het verwijderen van
      asbestbevattende voegkit:


      [ref1]: https://wetten.overheid.nl/BWBR0006006#Artikel3
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0006006
        artikel: '3'
        paragraaf: '2'
  - number: 3b.a
    text: de bij ministeriële regeling gegeven voorschriften worden toegepast;
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel3b
  - number: 3b.b
    text: |-
      de houder van de sloopvergunning een afschrift van die vergunning ter hand stelt aan degene die het slopen van een
      tuinbouwkas uitvoert;
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel3b
  - number: 3b.c
    text: |-
      de houder van de sloopvergunning, indien een rapport als bedoeld in [artikel 2, onder h][ref1], is opgesteld, een
      afschrift van dat rapport dan wel van het schriftelijk stuk waarmee naar het oordeel van burgemeester en wethouders
      in voldoende mate is aangetoond waar zich asbest in de tuinbouwkas bevindt, ter hand stelt aan degene die het
      slopen van die kas uitvoert, en


      [ref1]: https://wetten.overheid.nl/BWBR0006006#Artikel2
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0006006
        artikel: '2'
        paragraaf: '2'
  - number: 3b.d
    text: |-
      de houder van de sloopvergunning zorgdraagt voor de afvoer van het verwijderde, met asbestbevattende voegkit
      verontreinigde sloopmateriaal binnen een door burgemeester en wethouders in de sloopvergunning gestelde termijn.
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel3b
  - number: '4'
    text: 'In de bouwverordening wordt voorts bepaald dat:'
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel4
  - number: 4.a
    text: |-
      Voor zover redelijkerwijs uitvoerbaar, eerst het in het bouwwerk aanwezige asbest wordt verwijderd, voordat het
      bouwwerk wordt gesloopt, met uitzondering van het slopen van een tuinbouwkas, voor zover dat slopen betrekking
      heeft op het verwijderen van asbestbevattende voegkit.
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel4
  - number: 4.b
    text: |-
      Bij de verwijdering van het asbest uit een bouwwerk de beste bestaande technieken worden toegepast om
      verontreiniging van het milieu met asbest te voorkomen.
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel4
  - number: 4.c
    text: |-
      Het gestelde onder b niet van toepassing is, indien een mededeling als bedoeld in
      [artikel 2, onderdeel b of c][ref1], is gedaan, of in een geval als bedoeld in [artikel 3a][ref2] of[ 3b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006006#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006006#Artikel3a
      [ref3]: https://wetten.overheid.nl/BWBR0006006#Artikel3b
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006006
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006006
        artikel: 3a
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006006
        artikel: 3b
        paragraaf: '2'
  - number: 4.d
    text: |-
      Indien werkzaamheden als bedoeld in [artikel 3a][ref1] of [ 3b][ref2] worden verricht, die werkzaamheden zodanig
      worden verricht dat verontreiniging van het milieu met asbest wordt voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006006#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0006006#Artikel3b
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006006
        artikel: 3a
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006006
        artikel: 3b
        paragraaf: '2'
  - number: 4.e
    text: |-
      Verwijderd asbest en met asbest verontreinigd afval onmiddellijk worden verzameld en in afgesloten niet-
      luchtdoorlatend verpakkingsmateriaal worden opgeslagen, met uitzondering van met asbestbevattende voegkit
      verontreinigde roeden en verontreinigd glas die bij het slopen van een tuinbouwkas vrijkomen.
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel4
  - number: 4.f
    text: |-
      Indien asbest als bedoeld onder e, door vorm of formaat niet in niet-luchtdoorlatend verpakkingsmateriaal kan
      worden opgeslagen, het asbest in een afgesloten container wordt opgeslagen.
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel4
  - number: 4.g
    text: |-
      Niet-luchtdoorlatend verpakkingsmateriaal, waarin asbest als bedoeld onder e, is opgeslagen, wordt opgeslagen in
      een afgesloten container of afgesloten opslagplaats.
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel4
  - number: 4.h
    text: 'Niet-luchtdoorlatend verpakkingsmateriaal of containers, waarin asbest is opgeslagen als bedoeld onder e, f of g:'
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel4
  - number: 4.h.a
    text: |-
      op duidelijke wijze worden voorzien van de aanduidingen voorgeschreven op grond van het
      [Productenbesluit asbest][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0017778
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0017778
  - number: 4.h.b
    text: zodanig worden afgevoerd dat verontreiniging van het milieu met asbest wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel4
  - number: '5.1'
    text: |-
      Degene die in het kader van de uitoefening van beroep of bedrijf voornemens is een object waarin zich asbest
      bevindt geheel of gedeeltelijk uit elkaar te nemen of te doen nemen en zich van dat asbest te ontdoen, is
      verplicht:
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel5
  - number: 5.1.a
    text: |-
      het uit elkaar nemen op te dragen aan een deskundig bedrijf, voor zover het betrekking heeft op de delen waar het
      asbest zich in bevindt, en
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel5
  - number: 5.1.b
    text: aan dat bedrijf mede te delen waar het asbest zich bevindt.
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel5
  - number: '5.2'
    text: |-
      Indien zich in een object asbest bevindt, maar niet vaststaat waar dat asbest zich in het object bevindt, is degene
      die in het kader van de uitoefening van beroep of bedrijf voornemens is dat object geheel of gedeeltelijk uit
      elkaar te nemen of te doen nemen en zich van dat asbest te ontdoen, verplicht:
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel5
  - number: 5.2.a
    text: door een deskundig bedrijf te laten onderzoeken waar dat asbest zich bevindt;
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel5
  - number: 5.2.b
    text: |-
      het uit elkaar nemen op te dragen aan een deskundig bedrijf, voor zover het betrekking heeft op de delen waar het
      asbest zich in bevindt, en
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel5
  - number: 5.2.c
    text: aan dat bedrijf het resultaat van het onderzoek, bedoeld in onderdeel *a*, over te leggen.
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel5
  - number: '5.3'
    text: |-
      Indien een redelijk vermoeden bestaat dat zich in een object asbest bevindt, is degene die in het kader van de
      uitoefening van beroep of bedrijf voornemens is dat object geheel of gedeeltelijk uit elkaar te nemen of te doen
      nemen en zich van dat asbest te ontdoen, verplicht:
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel5
  - number: 5.3.a
    text: door een deskundig bedrijf te laten onderzoeken of en waar zich in het object asbest bevindt;
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel5
  - number: 5.3.b
    text: |-
      indien zich in het object asbest bevindt, het uit elkaar nemen op te dragen aan een deskundig bedrijf, voor zover
      het betrekking heeft op de delen waar het asbest zich in bevindt en
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel5
  - number: 5.3.c
    text: aan dat bedrijf het resultaat van het onderzoek, bedoeld in onderdeel *a*, over te leggen.
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel5
  - number: '5.4'
    text: |-
      Degene die ingevolge het eerste, het tweede of het derde lid verplicht is het geheel of gedeeltelijk uit elkaar
      nemen van het object op te dragen aan een deskundig bedrijf dient het uit elkaar nemen van de delen waar het asbest
      zich in bevindt, voordat met de werkzaamheden wordt begonnen schriftelijk te melden aan het districtshoofd van
      de Arbeidsinspectie binnen wiens district de werkzaamheden worden uitgevoerd. Daarbij deelt hij tevens mede welk
      bedrijf de werkzaamheden uitvoert en het tijdstip waarop met de werkzaamheden wordt begonnen.
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel5
  - number: '6.1'
    text: |-
      Voor zover redelijkerwijs uitvoerbaar, dient het asbest uit een object te worden verwijderd, voordat het object
      geheel of gedeeltelijk uit elkaar wordt genomen.
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel6
  - number: '6.2'
    text: |-
      Bij de verwijdering van asbest uit een object worden de beste bestaande technieken toegepast om verontreiniging van
      het milieu met asbest te voorkomen.
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel6
  - number: '7.1'
    text: |-
      Verwijderd asbest en met asbest verontreinigd afval dienen onmiddellijk te worden verzameld en in afgesloten niet-
      luchtdoorlatend verpakkingsmateriaal te worden opgeslagen.
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel7
  - number: '7.2'
    text: |-
      Indien asbest als bedoeld in het eerste lid, door vorm of formaat niet in niet-luchtdoorlatend verpakkingsmateriaal
      kan worden opgeslagen, dient het asbest in een afgesloten container te worden opgeslagen.
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel7
  - number: '7.3'
    text: |-
      Niet-luchtdoorlatend verpakkingsmateriaal, waarin asbest is opgeslagen als bedoeld in het eerste lid, wordt
      opgeslagen in een afgesloten container of afgesloten opslagplaats.
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel7
  - number: '7.4'
    text: |-
      Niet-luchtdoorlatend verpakkingsmateriaal of containers, waarin asbest is opgeslagen als bedoeld in het eerste,
      tweede of derde lid, worden:
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel7
  - number: 7.4.a
    text: |-
      op duidelijke wijze voorzien van de aanduidingen voorgeschreven op grond van het [Productenbesluit asbest][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0017778
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017778
  - number: 7.4.b
    text: zodanig afgevoerd dat verontreiniging van het milieu met asbest wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel7
  - number: '8.1'
    text: |-
      De[ artikelen 5][ref1], [6][ref2] en [7][ref3] zijn niet van toepassing op het geheel of gedeeltelijk uit elkaar
      nemen van asbestbevattende waterleidingbuizen, gasleidingbuizen of rioolleidingbuizen alsmede de bij water-, gas-
      of rioolleidingbuizen behorende asbestbevattende mantelbuizen, voor zover deze deel uitmaken van een ondergronds
      water-, gas- of rioolleidingnet.


      [ref1]: https://wetten.overheid.nl/BWBR0006006#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006006#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0006006#Artikel7
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006006
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006006
        artikel: '6'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0006006
        artikel: '7'
        paragraaf: '3'
  - number: '8.2'
    text: |-
      De[ artikelen 5][ref1] en [6, tweede lid][ref2], zijn niet van toepassing op het:


      [ref1]: https://wetten.overheid.nl/BWBR0006006#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006006#Artikel6
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006006
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006006
        artikel: '6'
        paragraaf: '3'
  - number: 8.2.a
    text: 'als één geheel verwijderen van:'
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel8
  - number: 8.2.a.1°
    text: verwarmingstoestellen waarin zich asbest bevindt,
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel8
  - number: 8.2.a.2°
    text: |-
      asbestbevattende warmteblokken van verwarmingstoestellen die een nominale belasting kleiner dan of gelijk aan een
      bovenwaarde van 130 kilowatt hebben, of
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel8
  - number: 8.2.a.3°
    text: onder verwarmingstoestellen geklemde, asbestbevattende platen waarin de asbestvezels hechtgebonden zijn,
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel8
  - number: 8.2.b
    text: 'geheel of gedeeltelijk verwijderen van asbestbevattende pakkingen met uitzondering van het:'
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel8
  - number: 8.2.b.1°
    text: |-
      geheel of gedeeltelijk verwijderen van asbestbevattende pakkingen uit verwarmingstoestellen die een nominale
      belasting groter dan een bovenwaarde van 2250 kilowatt hebben, of
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel8
  - number: 8.2.b.2°
    text: |-
      in het kader van het verwijderen van verwarmingstoestellen geheel of gedeeltelijk verwijderen van asbestbevattende
      pakkingen die zich tussen ketelleden bevinden, of
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel8
  - number: 8.2.c
    text: geheel of gedeeltelijk verwijderen van asbestbevattende rem- en frictiematerialen.
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel8
  - number: '8.3'
    text: |-
      De breukvlakken van de uit elkaar genomen buizen, bedoeld in het eerste lid, worden ingesmeerd met latex op
      waterbasis of in niet-luchtdoorlatend verpakkingsmateriaal verpakt, terwijl de genoemde buizen onmiddellijk worden
      verzameld in een niet-lekkende container.
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel8
  - number: '8.4'
    text: |-
      Een container als bedoeld in het derde lid, waarin buizen als bedoeld in het eerste lid, zijn opgeslagen, wordt
      opgeslagen in een afgesloten opslagplaats.
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel8
  - number: '8.5'
    text: |-
      [Artikel 7, vierde lid][ref1], is van overeenkomstige toepassing op een container als bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006006#Artikel7
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006006
        artikel: '7'
        paragraaf: '3'
  - number: '8.6'
    text: |-
      Werkzaamheden als bedoeld in het eerste en tweede lid, worden zodanig verricht dat verontreiniging van het milieu
      met asbest wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel8
  - number: '9'
    text: |-
      In de gemeentelijke bouwverordening wordt bepaald dat overtreding van de[ artikelen 2][ref1], [3][ref2],
      [3b][ref3] en [4][ref4] een strafbaar feit is als bedoeld in [artikel 110, eerste lid, van de Woningwet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0006006#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006006#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0006006#Artikel3b
      [ref4]: https://wetten.overheid.nl/BWBR0006006#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0005181#Artikel110
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006006
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006006
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006006
        artikel: 3b
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0006006
        artikel: '4'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0005181
        artikel: '110'
  - number: '10.1'
    text: |-
      Voor zolang er nog geen deskundig bedrijf is dat voldoet aan de eisen ter zake van asbestverwijdering,
      wordt een bedrijf gelijkgesteld met een ter zake van de verwijdering van asbest deskundig bedrijf,
      indien bij het slopen of het uit elkaar nemen een persoon aanwezig is die in het bezit is van een
      certificaat verwijdering asbest en crocidoliet, dat is afgegeven door Onze Minister van Sociale
      Zaken en Werkgelegenheid of een door hem daartoe aangewezen instelling zoals voorgeschreven in
      [artikel 4.54, vierde lid, van het Arbeidsomstandighedenbesluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: '10.2'
    text: |-
      Indien ingevolge [artikel 1, onder ][ref1], eisen zijn gesteld ter zake van asbestverwijdering en Onze Minister
      een merkteken als bedoeld in [artikel 1, onder ][ref2], heeft aangewezen, worden niet-deskundige bedrijven voor een
      periode van anderhalf jaar gelijkgesteld met een deskundig bedrijf, indien wordt voldaan aan het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006006#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006006#Artikel1
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006006
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006006
        artikel: '1'
        paragraaf: '1'
  - number: '10.3'
    text: |-
      Een bedrijf dat niet gemachtigd is een merkteken te voeren als bedoeld in [artikel 11][ref1], wordt voor het
      uitvoeren van werkzaamheden op ten minste twee en ten hoogste drie projectlocaties met een deskundig bedrijf
      gelijkgesteld, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0006006#Artikel11
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006006
        artikel: '11'
        paragraaf: '5'
  - number: 10.3.a
    text: |-
      het bedrijf bij een door de Raad voor Accreditatie erkende certificatie-instelling een schriftelijke aanvraag
      heeft ingediend voor de verwerving van een procescertificaat voor het verwijderen van asbest onderscheidenlijk
      voor asbestonderzoek,
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel10
  - number: 10.3.b
    text: |-
      het bedrijf voor het tijdstip waarop met de feitelijke uitvoering van de desbetreffende werkzaamheden wordt
      begonnen, voldoet aan de theoretische eisen ter zake van asbestverwijdering onderscheidenlijk asbestonderzoek als
      bedoeld in [artikel 1, onder c][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0006006#Artikel1
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006006
        artikel: '1'
        paragraaf: '1'
  - number: 10.3.c
    text: |-
      het bedrijf door tussenkomst van de onder a bedoelde certificatie-instelling in het bezit is van een schriftelijke
      toestemming van de Stichting Bouwkwaliteit te Rijswijk voor het verwijderen van asbest onderscheidenlijk het
      uitvoeren van asbestonderzoek op in die toestemming aangegeven projectlocaties en het bedrijf uitsluitend asbest
      verwijdert onderscheidenlijk asbestonderzoek uitvoert op die projectlocaties.
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel10
  - number: '11'
    text: |-
      Bij ministeriële regeling wijst Onze Minister de onderscheidene merktekens, bedoeld in [artikel 1, onder ][ref1],
      aan.


      [ref1]: https://wetten.overheid.nl/BWBR0006006#Artikel1
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006006
        artikel: '1'
        paragraaf: '1'
  - number: '12.1'
    text: |-
      De[ artikelen 2, onder ][ref1], [3, onder ][ref2], [4][ref3], [9][ref4] en [11][ref5] van dit besluit treden
      in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt geplaatst,
      met dien verstande dat voor zover de bouwverordening in overeenstemming is gebracht met deze artikelen met
      uitzondering van [artikel 11][ref6], vóórdat artikel 17*a*, tweede lid, onderdeel *b*, van het Asbestbesluit
      Arbeidsomstandighedenwet in werking is getreden, de desbetreffende voorschriften van de bouwverordening
      eerst rechtskracht krijgen bij inwerkingtreding van genoemd artikelonderdeel van het Asbestbesluit
      Arbeidsomstandighedenwet.


      [ref1]: https://wetten.overheid.nl/BWBR0006006#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006006#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0006006#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0006006#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0006006#Artikel11
      [ref6]: https://wetten.overheid.nl/BWBR0006006#Artikel11
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006006
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006006
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006006
        artikel: '4'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0006006
        artikel: '9'
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0006006
        artikel: '11'
        paragraaf: '5'
      - id: ref6
        bwb_id: BWBR0006006
        artikel: '11'
        paragraaf: '5'
  - number: '12.2'
    text: |-
      De overige artikelen van dit besluit treden in werking met ingang van de dag waarop artikel 17*a*, tweede
      lid, onderdeel *b*, van het Asbestbesluit Arbeidsomstandighedenwet in werking treedt, met uitzondering van
      de[ artikelen 2, onder ][ref1], [3, onder ][ref2], en [5, tweede en derde lid][ref3], die in werking treden op een
      bij koninklijk besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0006006#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006006#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0006006#Artikel5
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006006
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006006
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006006
        artikel: '5'
        paragraaf: '3'
  - number: '13'
    text: 'Dit besluit kan worden aangehaald als: Asbest-verwijderingsbesluit.'
    url: https://wetten.overheid.nl/BWBR0006006/2005-03-08#Artikel13
