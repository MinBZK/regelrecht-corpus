---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_beheer_overtollige_rijksgoederen
regulatory_layer: AMVB
publication_date: '2002-08-20'
valid_from: '1977-08-27'
bwb_id: BWBR0003117
url: https://wetten.overheid.nl/BWBR0003117/1977-08-27
preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van de Staatssecretaris van Financiën, A. de Goede, van 12 juli 1977, nr. 477-3738, Directoraat-
    Generaal van de Rijksbegroting, Directie Begrotingszaken;

    Gelet op artikel 22 van de Comptabiliteitswet 1976;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003117/1977-08-27#ArtikelAanhef
articles:
  - number: '1'
    text: 'Voor de toepassing van dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003117/1977-08-27#Artikel1
  - number: 1.a
    text: |-
      zaken: lichamelijke zaken, die eigendom zijn van de Staat, en aan de Staat toebehorende zakelijke rechten andere
      dan zekerheidsrechten op lichamelijke zaken;
    url: https://wetten.overheid.nl/BWBR0003117/1977-08-27#Artikel1
  - number: 1.b
    text: 'een dienst: een organisatie-eenheid overeenkomstig de indeling van de rijksbegroting;'
    url: https://wetten.overheid.nl/BWBR0003117/1977-08-27#Artikel1
  - number: 1.c
    text: 'een fonds: een begrotingsfonds in de zin van artikel 87, eerste lid, van de Comptabiliteitswet 1976;'
    url: https://wetten.overheid.nl/BWBR0003117/1977-08-27#Artikel1
  - number: 1.d
    text: 'een bedrijf: een staatsbedrijf in de zin van artikel 88, eerste lid, van de Comptabiliteitswet 1976;'
    url: https://wetten.overheid.nl/BWBR0003117/1977-08-27#Artikel1
  - number: 1.e
    text: 'overdracht respectievelijk overdragen: overdracht respectievelijk overdragen in materieel beheer.'
    url: https://wetten.overheid.nl/BWBR0003117/1977-08-27#Artikel1
  - number: '2'
    text: |-
      Zaken, welke niet meer nodig zijn voor de dienst, het fonds of het bedrijf, waaronder zij ressorteren, worden
      overgedragen aan de dienst der Domeinen.
    url: https://wetten.overheid.nl/BWBR0003117/1977-08-27#Artikel2
  - number: '3.1'
    text: |-
      In afwijking van het bepaalde in [artikel 2][ref1] kunnen zonder tussenkomst van de dienst der Domeinen:


      [ref1]: https://wetten.overheid.nl/BWBR0003117#Artikel2
    url: https://wetten.overheid.nl/BWBR0003117/1977-08-27#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003117
        artikel: '2'
  - number: 3.1.a)
    text: |-
      zaken als in dat artikel bedoeld worden overgedragen tussen diensten, voor welke de uitgaven zijn geraamd in
      hetzelfde hoofdstuk van de rijksbegroting;
    url: https://wetten.overheid.nl/BWBR0003117/1977-08-27#Artikel3
  - number: 3.1.b)
    text: |-
      roerende zaken als in dat artikel bedoeld worden overgedragen tussen een dienst en een fonds of een bedrijf,
      ressorterende onder hetzelfde departement;
    url: https://wetten.overheid.nl/BWBR0003117/1977-08-27#Artikel3
  - number: 3.1.c)
    text: |-
      roerende zaken, welke om technische of economische redenen niet meer bruikbaar zijn voor de dienst, het fonds
      of het bedrijf, waaronder zij ressorteren, ter vervanging worden ingeruild bij de aankoop van naar hun aard
      vergelijkbare roerende zaken ten behoeve van diensten, fondsen en bedrijven, ressorterende onder hetzelfde
      departement.
    url: https://wetten.overheid.nl/BWBR0003117/1977-08-27#Artikel3
  - number: '3.2'
    text: |-
      Indien een onroerende zaak wordt overgedragen tussen diensten behorende tot verschillende onderdelen van een
      departement doet het hoofd van dat departement daarvan mededeling aan de dienst der Domeinen.
    url: https://wetten.overheid.nl/BWBR0003117/1977-08-27#Artikel3
  - number: '4'
    text: |-
      Zaken, welke ingevolge [artikel 2 onder][ref1] het beheer van de dienst der Domeinen zijn gekomen, worden indien
      het belang van het Rijk dit meebrengt overgedragen aan een dienst, fonds of bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0003117#Artikel2
    url: https://wetten.overheid.nl/BWBR0003117/1977-08-27#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003117
        artikel: '2'
  - number: '5'
    text: |-
      Ruiling van onroerende zaken tussen diensten, voor welke de uitgaven zijn geraamd in verschillende hoofdstukken van
      de rijksbegroting, alsmede ruiling van onroerende zaken, waarbij een fonds of bedrijf is betrokken, geschiedt door
      tussenkomst van de dienst der Domeinen.
    url: https://wetten.overheid.nl/BWBR0003117/1977-08-27#Artikel5
  - number: '6.1'
    text: |-
      Onroerende zaken, welke voor een dienst, fonds of bedrijf, waaronder zij ressorteren, tijdelijk of gedeeltelijk
      niet nodig zijn, worden indien het belang van het Rijk dit meebrengt door de dienst der Domeinen aan een andere
      dienst, fonds of bedrijf of aan derden in gebruik gegeven.
    url: https://wetten.overheid.nl/BWBR0003117/1977-08-27#Artikel6
  - number: '6.2'
    text: |-
      In afwijking van het bepaalde in het eerste lid kunnen zaken, als in dat lid bedoeld, zonder tussenkomst van de
      dienst der Domeinen, in gebruik worden gegeven tussen diensten, voor welke de uitgaven zijn geraamd in hetzelfde
      hoofdstuk van de rijksbegroting en tussen een dienst, fonds of bedrijf ressorterende onder hetzelfde departement.
    url: https://wetten.overheid.nl/BWBR0003117/1977-08-27#Artikel6
  - number: '6.3'
    text: |-
      In afwijking van het bepaalde in het eerste lid geschiedt ingebruikgeving van onroerende zaken, dienende voor de
      huisvesting met de zorg waarvoor de Rijksgebouwendienst is belast, door deze dienst.
    url: https://wetten.overheid.nl/BWBR0003117/1977-08-27#Artikel6
  - number: '6.4'
    text: |-
      Voor de toepassing van het bepaalde in de voorgaande leden worden onder onroerende zaken mede verstaan zaken ten
      aanzien waarvan aan de Staat een niet zakelijk recht tot gebruik is verleend.
    url: https://wetten.overheid.nl/BWBR0003117/1977-08-27#Artikel6
  - number: '7'
    text: Ons besluit van 9 november 1956, *Stb.* 534 (Comptabiliteitsbesluit 1956) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003117/1977-08-27#Artikel7
  - number: '8.1'
    text: 'Dit besluit kan worden aangehaald onder de titel: "Besluit beheer overtollige rijksgoederen".'
    url: https://wetten.overheid.nl/BWBR0003117/1977-08-27#Artikel8
  - number: '8.2'
    text: |-
      Het treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin het is
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0003117/1977-08-27#Artikel8
