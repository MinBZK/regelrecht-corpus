  - number: '15'
    text: |-
      1 Het totale televisieprogramma-aanbod van de landelijke publieke mediadienst dat bestaat uit oorspronkelijk
      Nederlandstalige producties is voor ten minste 95% voorzien van ondertiteling ten behoeve van personen met een
      auditieve beperking.

      2 Voor de toepassing van het eerste lid worden buiten beschouwing gelaten:

      a. reclame- en telewinkelboodschappen inclusief omlijsting;

      b. televisieprogramma-aanbod dat wordt verspreid voor Nederlandstaligen in het buitenland; en

      c. visual radio-aanbod.
    url: https://wetten.overheid.nl/BWBR0025036/2022-01-01#Artikel15
  - number: '16'
    text: |-
      Inkomsten uit programmabladen van een omroeporganisatie kunnen jaarlijks tot ten hoogste het bedrag dat nodig is om
      een eventueel verlies van de desbetreffende omroeporganisatie te dekken, worden besteed aan verenigingsactiviteiten
      als bedoeld in [artikel 2.136 van de wet][ref1]. Bij de bepaling van het resultaat blijven veranderingen in de
      waarde van materiële vaste activa als gevolg van herwaarderingen buiten beschouwing. De gebruikelijke jaarlijkse
      afschrijvingen van de materiële vaste activa worden niet als herwaarderingen aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.136
    url: https://wetten.overheid.nl/BWBR0025036/2022-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.136'
  - number: 16a
    text: |-
      Omroeporganisaties die een erkenning of een voorlopige erkenning als bedoeld in [artikel 2.23 van de wet][ref1]
      hebben verkregen, kunnen netto inkomsten uit contributies en verenigingsactiviteiten als bedoeld in
      [artikel 2.136 van de wet][ref2] tot een bedrag van € 750.000 reserveren voor die verenigingsactiviteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.23
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.136
    url: https://wetten.overheid.nl/BWBR0025036/2022-01-01#Artikel16a
