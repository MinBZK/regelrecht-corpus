      onmiddellijk in.

      2 Een beschikking tot intrekking van een verleende toestemming op grond van [artikel 26, tweede lid][ref2],
      gaat niet eerder in dan nadat de bevoegde militaire autoriteit van het voornemen daartoe en de gronden waarop
      de beschikking berust in kennis is gesteld en deze in de gelegenheid is gesteld binnen een redelijke termijn
      schriftelijke en desgewenst mondelinge opmerkingen te maken.


