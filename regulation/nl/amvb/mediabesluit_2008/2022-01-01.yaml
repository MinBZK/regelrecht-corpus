  - number: '2'
    text: |-
      De NOS verzorgt in ieder geval het volgende media-aanbod:

      a. de dagelijkse nieuwsvoorziening;

      b. de verslaggeving over Nederlandse en Europese parlementaire aangelegenheden;

      c. de verslaggeving van nationale feest- en gedenkdagen;

      d. de actuele sportverslaggeving, waaronder in ieder geval de competitie- en bekerwedstrijden en internationale
      evenementen;

      e. de verslaglegging van andere nationale en internationale gebeurtenissen van bijzondere aard, waaronder
      staatsbezoeken;

      f. de nieuwsvoorziening ten behoeve van de regio;

      g. de nieuwsvoorziening ten behoeve van de jeugd;

      h. de nieuwsvoorziening ten behoeve van personen met een auditieve beperking; en

      i. aanbod van dienstverlenende aard, waaronder informatie ten behoeve van scheepvaart, verkeer, visserij, en land-
      en tuinbouw.
    url: https://wetten.overheid.nl/BWBR0025036/2022-01-01#Artikel2
  - number: '3'
    text: |-
      De NTR verzorgt in ieder geval het volgende media-aanbod:

      a. achtergrondinformatie en beschouwingen over politieke en maatschappelijke ontwikkelingen, onder meer op het
      gebied van economie, wetenschap en techniek;

      b. aanbod ten behoeve van maatschappelijke doelgroepen die elders niet of niet voldoende tot hun recht komen;

      c. aanbod dat betrekking heeft op etnische en culturele minderheden;

      d. aanbod van culturele aard, waaronder kunst, dat elders niet of niet voldoende tot zijn recht komt; en

      e. aanbod van educatieve aard ten behoeve van de jeugd.
    url: https://wetten.overheid.nl/BWBR0025036/2022-01-01#Artikel3
  - number: 3a
    text: |-
      In deze paragraaf worden onder evaluatie en evaluatiecommissie verstaan de evaluatie onderscheidenlijk
      de evaluatie, bedoeld in [artikel 2.184 van de wet][ref1], en de evaluatiecommissie, bedoeld in
      [artikel 2.185 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.184
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.185
    url: https://wetten.overheid.nl/BWBR0025036/2022-01-01#Artikel3a
