  - number: '24'
    text: |-
      Het Commissariaat kan zonodig de omroepzender of omroepzenders aanwijzen die voor de omroepdienst bedoeld in
      [artikel 23][ref1], wordt gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0025036#Artikel23
    url: https://wetten.overheid.nl/BWBR0025036/2022-01-01#Artikel24
    references:
