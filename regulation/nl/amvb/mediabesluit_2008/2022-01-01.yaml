  - number: 3c
    text: |-
      1 Bij de evaluatie van een afzonderlijke omroeporganisatie die een erkenning als bedoeld in
      [artikel 2.23, eerste lid, van de wet][ref1] heeft verkregen, betrekt de evaluatiecommissie voorts:

      a. de wijze waarop de missie en de identiteit van de omroeporganisatie zijn geformuleerd en uitgewerkt in
      doelstellingen voor het media-aanbod en het publieksbereik; en

      b. de mate waarin de omroeporganisatie in onderdeel a bedoelde doelstellingen heeft gerealiseerd.

      2 Bij de evaluatie van een omroepvereniging die een voorlopige erkenning als bedoeld in
      [artikel 2.23, tweede lid, van de wet][ref2] heeft verkregen, betrekt de evaluatiecommissie voorts:

      a. de criteria, bedoeld in het eerste lid; en

      b. de mate waarin deze instelling heeft voldaan aan de eis om zich naar stroming en naar voorgenomen media-
      aanbod wat betreft genre, inhoud en doelgroepen zodanig te onderscheiden van de erkende omroeporganisaties dat
      de verscheidenheid van het media-aanbod van de landelijke publieke mediadienst is vergroot en een vernieuwende
      bijdrage is geleverd aan de uitvoering van de publieke mediaopdracht op landelijk niveau.

      3 Bij de evaluatie van de NOS en de NTR betrekt de evaluatiecommissie voorts:

      a. de wijze waarop deze instellingen de taken, bedoeld in [artikel 2.34a, eerste en tweede lid, van de wet][ref3]
      onderscheidenlijk [artikel 2.35, eerste lid, van de wet][ref4], en in het bijzonder de taken, bedoeld in
      [artikel 2][ref5] onderscheidenlijk [artikel 3][ref6], hebben uitgevoerd;

      b. de mate waarin deze instellingen eigen doelstellingen voor media-aanbod en publieksbereik hebben gerealiseerd;
      en

      c. de wijze waarop deze instellingen zorg dragen voor interne pluriformiteit van hun media-aanbod als bedoeld in
      [artikel 2.34e van de wet][ref7] onderscheidenlijk [artikel 2.37a van de wet][ref8].


