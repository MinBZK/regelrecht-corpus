        bwb_id: BWBR0025028
        artikel: '2.108'
  - number: 14b
    text: |-
      Het percentage, bedoeld in [artikel 2.116, eerste lid, van de wet][ref1] is 25.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.116
