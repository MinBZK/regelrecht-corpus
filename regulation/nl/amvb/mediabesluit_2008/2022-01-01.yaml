        artikel: '2.185'
  - number: 3b
    text: |-
      1 Bij de evaluatie van elke afzonderlijke landelijke publieke media-instelling betrekt de evaluatiecommissie de
      wijze waarop deze instelling heeft bijgedragen aan de uitvoering van de publieke mediaopdracht door het aanbieden
      van media-aanbod dat:

      a. evenwichtig, pluriform, gevarieerd en kwalitatief hoogstaand is en zich tevens kenmerkt door een grote
      verscheidenheid naar vorm en inhoud;

      b. op evenwichtige wijze een beeld van de samenleving geeft en de pluriformiteit van onder de bevolking levende
      overtuigingen, opvattingen en interesses op maatschappelijk, cultureel en levensbeschouwelijk gebied weerspiegelt;

      c. gericht is op en een relevant bereik heeft onder zowel een breed en algemeen publiek als bevolkings- en
      leeftijdgroepen van verschillende omvang en samenstelling met in het bijzonder aandacht voor kleine doelgroepen;

      d. onafhankelijk is van commerciële invloeden en, behoudens het bepaalde bij of krachtens de wet, van
      overheidsinvloeden;

      e. voldoet aan hoge journalistieke en professionele kwaliteitseisen; en

      f. voor iedereen toegankelijk is.

      2 Bij de evaluatie van elke afzonderlijke landelijke publieke media-instelling betrekt de evaluatiecommissie
      voorts de wijze waarop deze instelling heeft bijgedragen aan het volgen en stimuleren van technologische
      ontwikkelingen en het benutten van de mogelijkheden om media-aanbod aan het publiek aan te bieden via nieuwe media-
      en verspreidingstechnieken.

      3 Bij de evaluatie, bedoeld in het eerste en tweede lid, betrekt de evaluatiecommissie de wijze waarop deze
      instelling heeft bijgedragen aan realisering van doelstellingen voor het media-aanbod en het publieksbereik van
      het concessiebeleidsplan, bedoeld in [artikel 2.20 van de wet][ref1], en van de prestatieovereenkomst, bedoeld in
      [artikel 2.22 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.20
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.22
    url: https://wetten.overheid.nl/BWBR0025036/2022-01-01#Artikel3b
