  - number: '5'
    text: |-
      Het aandeel reclame- en telewinkelboodschappen, inclusief omlijsting, in het programma-aanbod van de regionale en
      lokale publieke mediadiensten bedraagt per programmakanaal niet meer dan tien procent van de totale duur van het
      programma-aanbod op het programmakanaal per jaar.
    url: https://wetten.overheid.nl/BWBR0025036/2022-01-01#Artikel5
  - number: 5a
    text: |-
      Het aandeel reclame- en telewinkelboodschappen in het programma-aanbod van de landelijke publieke mediadienst
      bedraagt:

      a. per televisieprogrammakanaal niet meer dan vijf procent van de totale duur van het programma-aanbod op dat
      kanaal per jaar;

      b. per radioprogrammakanaal niet meer dan tien procent van het programma-aanbod op dat kanaal per jaar.
    url: https://wetten.overheid.nl/BWBR0025036/2022-01-01#Artikel5a
  - number: '6'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop inzicht wordt gegeven in de financiën
      die betrekking hebben op de verzorging van reclame- en telewinkelboodschappen in het media-aanbod van de regionale
      en lokale publieke mediadiensten.
    url: https://wetten.overheid.nl/BWBR0025036/2022-01-01#Artikel6
  - number: '7'
    text: |-
      In deze paragraaf wordt onder «vermijdbare uitingen» verstaan vermijdbare uitingen anders dan reclame- of
      telewinkelboodschappen die onmiskenbaar tot gevolg hebben dat de afname van producten of diensten wordt bevorderd.
    url: https://wetten.overheid.nl/BWBR0025036/2022-01-01#Artikel7
  - number: '8'
    text: |-
      Uitingen anders dan reclame- of telewinkelboodschappen zijn onvermijdbaar, als het uitingen betreft die behoren
      tot het normale straatbeeld en die zonder opzet en zonder nadruk gedurende enkele seconden in het media-aanbod
      voorkomen.
    url: https://wetten.overheid.nl/BWBR0025036/2022-01-01#Artikel8
  - number: '9'
    text: |-
      1 In media-aanbod van informatieve of educatieve aard zijn vermijdbare uitingen in de vorm van het tonen of
      vermelden van een product of dienst toegestaan, mits:

      a. de vertoning of vermelding past binnen de context van het media-aanbod;

      b. de vertoning of vermelding geen afbreuk doet aan de formule of de integriteit van het media-aanbod;

      c. de vertoning of vermelding niet op een overdreven of overdadige wijze plaatsvindt; en

      d. er geen sprake is van specifieke aanprijzingen van deze producten of diensten.

      2 Het eerste lid is van overeenkomstige toepassing op ander media-aanbod, met uitzondering van media-aanbod dat in
      het bijzonder bestemd is voor kinderen jonger dan twaalf jaar.
    url: https://wetten.overheid.nl/BWBR0025036/2022-01-01#Artikel9
  - number: '10'
    text: |-
      1 Onverminderd [artikel 9][ref1] mag media-aanbod van informatieve of educatieve aard vermijdbare uitingen in
      de vorm van het tonen of vermelden van namen of (beeld)merken van bepaalde producten of diensten of van namen
      van bedrijven of instellingen bevatten. Op deze uitingen is [artikel 9, eerste lid][ref2], van overeenkomstige
      toepassing.

      2 In afwijking van [artikel 9, eerste lid, aanhef en onderdeel d][ref3], mag media-aanbod van informatieve
      of educatieve aard vermijdbare uitingen bevatten die bestaan uit het aankondigen en recenseren van boeken,
      video’s, compact discs en soortgelijke culturele uitingen, alsmede van toneel-, muziek- en filmuitvoeringen,
      tentoonstellingen en soortgelijke evenementen van kunstzinnige aard.


      [ref1]: https://wetten.overheid.nl/BWBR0025036#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0025036#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0025036#Artikel9
