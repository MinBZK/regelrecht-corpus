        bwb_id: BWBR0025036
        artikel: '23'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '25'
    text: |-
      1 Een aanvraag voor de toestemming bedoeld in [artikel 23][ref1] wordt ingediend bij Onze Minister van Defensie,
      die deze voorzien van zijn opmerkingen binnen vier weken doorzendt aan het Commissariaat. Het Commissariaat zendt
      een afschrift van de aanvraag aan Onze Minister van Economische Zaken.

      2 De aanvraag gaat vergezeld van:

      a. een omschrijving van het doel van de aanvraag;

      b. een aanduiding van het gebied waarbinnen de omroepdienst zal worden verspreid;

      c. een verklaring van de auteursrechthebbenden aan de autoriteiten van de desbetreffende Navo-lidstaat waaruit
      blijkt dat geen auteursrechtelijke toestemming zal worden verleend voor de verspreiding van de mediadienst buiten
      de in [artikel 23][ref2] omschreven doelgroep en het aangeduide gebied; en

      d. een omschrijving van de te gebruiken omroepzender.


      [ref1]: https://wetten.overheid.nl/BWBR0025036#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0025036#Artikel23
    url: https://wetten.overheid.nl/BWBR0025036/2022-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0025036
        artikel: '23'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
