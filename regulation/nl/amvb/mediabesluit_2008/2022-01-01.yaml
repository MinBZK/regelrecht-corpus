  - number: '26'
    text: |-
      1 Het Commissariaat trekt de toestemming in:

      a. als niet meer wordt voldaan aan de voorwaarden van [artikel 23, eerste en tweede lid][ref1]; of

      b. op gronden ontleend aan de veiligheid van de staat.

      2 Het Commissariaat kan de toestemming intrekken als niet wordt voldaan aan [artikel 23, derde lid][ref2].

      3 Het Commissariaat maakt zijn voornemen tot intrekking van de toestemming kenbaar aan Onze Minister van Defensie
      en Onze Minister van Economische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0025036#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0025036#Artikel23
