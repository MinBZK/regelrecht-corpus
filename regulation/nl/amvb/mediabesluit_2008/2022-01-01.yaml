  - number: '29'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over:

      a. de nadere voorwaarden voor het verkrijgen van subsidie;

      b. de verplichtingen die het Stimuleringsfonds aan een subsidieontvanger kan opleggen;

      c. de indiening en wijze van behandeling van aanvragen;

      d. de hoogte van subsidies en de wijze van berekening daarvan;

      e. de wijze waarop de beschikbare financiële middelen voor de verschillende subsidies worden verdeeld als een
      subsidieplafond is vastgesteld;

      f. de verlening van voorschotten; en

      g. de intrekking, wijziging en terugvordering van subsidies.
    url: https://wetten.overheid.nl/BWBR0025036/2022-01-01#Artikel29
  - number: 29a
    text: |-
      1 De voorzitter en de andere leden van het bestuur van de Stichting Radio Nederland Wereldomroep, bedoeld in
      artikel in [artikel 78 van de Mediawet][ref1], zoals dat artikel op 31 december 2008 luidde, zijn met ingang van
      1 januari 2009 voorzitter onderscheidenlijk lid van de eerste raad van toezicht van de Stichting Radio Nederland
      Wereldomroep, bedoeld in [artikel 2.74 van de wet][ref2], voor het resterende gedeelte van hun benoemingstermijn.

      2 De leden van de programmaraad van de Stichting Radio Nederland Wereldomroep, bedoeld in
      [artikel 81 van de Mediawet][ref3], zoals dat artikel op 31 december 2008 luidde, zijn met ingang
      van 1 januari 2009 lid van de adviesraad van de Stichting Radio Nederland Wereldomroep, bedoeld in
      [artikel 2.80 van de wet][ref4], voor het resterende gedeelte van hun benoemingstermijn.


