        artikel: '2.23'
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2.136'
  - number: '17'
    text: |-
      1 Het totale programma-aanbod op een televisieprogrammakanaal van een commerciële media-instelling met een bereik
      van ten minste 75 procent van alle huishoudens in Nederland dat bestaat uit oorspronkelijk Nederlandstalige
      producties, is voor ten minste 50% voorzien van ondertiteling ten behoeve van personen met een auditieve beperking.

      2 Voor de toepassing van het eerste lid worden buiten beschouwing gelaten:

      a. reclame- en telewinkelboodschappen inclusief omlijsting; en

      b. visual radio-aanbod.
    url: https://wetten.overheid.nl/BWBR0025036/2022-01-01#Artikel17
  - number: '18'
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *lijst:* evenementenlijst die is opgenomen in de bij dit besluit behorende bijlage.
    url: https://wetten.overheid.nl/BWBR0025036/2022-01-01#Artikel18
  - number: '19'
    text: |-
      1 De evenementen, genoemd in onderdeel A van de lijst, die als televisieprogramma worden verspreid, worden in ieder
      geval verspreid op een open televisieprogrammakanaal door middel van volledige rechtstreekse verslaggeving.

      2 In afwijking van het eerste lid behoeven de in dat lid bedoelde evenementen, die geheel of gedeeltelijk
      plaatsvinden tussen 00.00 uur en 07.00 uur, niet door middel van volledige rechtstreekse verslaggeving te worden
      verspreid.

      3 In afwijking van het eerste lid behoeven wedstrijden die deel uitmaken van de in dat lid bedoelde evenementen en
      die gelijktijdig plaatsvinden niet alle door middel van volledige rechtstreekse verslaggeving te worden verspreid,
      als ten minste een van deze wedstrijden wordt verspreid door middel van volledige rechtstreekse verslaggeving op
      een open televisiekanaal.
    url: https://wetten.overheid.nl/BWBR0025036/2022-01-01#Artikel19
  - number: '20'
    text: |-
      1 De evenementen, genoemd in onderdeel B van de lijst, die als televisieprogramma worden verspreid, worden in ieder
      geval verspreid op een open televisieprogrammakanaal door middel van gedeeltelijke rechtstreekse verslaggeving.

      2 De verslaggeving van evenementen, bedoeld in het eerste lid, heeft de in onderdeel B van de lijst vermelde
      minimumduur.
    url: https://wetten.overheid.nl/BWBR0025036/2022-01-01#Artikel20
  - number: '21'
    text: |-
      1 De evenementen, genoemd in onderdeel C van de lijst, die als televisieprogramma worden verspreid, worden in ieder
      geval verspreid op een open televisieprogrammakanaal door middel van gedeeltelijke uitgestelde verslaggeving.

      2 In afwijking van het eerste lid behoeven de in dat lid bedoelde evenementen niet door middel van
      gedeeltelijke uitgestelde verslaggeving te worden verspreid, als deze evenementen worden verspreid op een open
      televisieprogrammakanaal door middel van volledige rechtstreekse verslaggeving.

      3 De verslaggeving van de evenementen, bedoeld in het eerste lid, heeft de in onderdeel C van de lijst vermelde
      minimumduur.

      4 De verslaggeving van de evenementen, bedoeld in het eerste lid, vindt plaats op de dag van het evenement of
      een onderdeel daarvan, met dien verstande dat de verslaggeving van de wedstrijden van de hoogste divisie van het
      nationaal betaald voetbal uiterlijk aanvangt op de in onderdeel C van de lijst vermelde tijdstippen.
    url: https://wetten.overheid.nl/BWBR0025036/2022-01-01#Artikel21
  - number: '22'
    text: |-
      1 Voor de toepassing van [artikel 6.24 van de wet][ref1] worden twee of meer instellingen als één instelling
      aangemerkt, als:

      a. een instelling direct of indirect zodanige zeggenschap of feitelijke invloed heeft in één of meer instellingen
      dat deze in belangrijke mate het beleid van die instelling of instellingen kan bepalen of aanmerkelijke invloed
      heeft op de inhoud van dat beleid; of

      b. een natuurlijk persoon of groep van natuurlijke personen direct of indirect een zodanige zeggenschap of
      feitelijke invloed heeft in twee of meer instellingen dat deze in belangrijke mate het beleid van die instellingen
      kan bepalen of aanmerkelijke invloed heeft op de inhoud van dat beleid.

      2 Bij ministeriële regeling kan in overeenstemming met Onze Minister van Economische Zaken worden bepaald dat
      in afwijking van [artikel 6.24, eerste lid, van de wet][ref2] voor de verspreiding van radioprogramma-aanbod
      van eenzelfde instelling meer frequentieruimte mag worden gebruikt dan één FM-frequentie of samenstel van FM
      frequenties.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel6.24
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel6.24
