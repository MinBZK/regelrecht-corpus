articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

        - *visual radio:* televisieprogramma dat bestaat uit een radioprogramma dat is voorzien van beelden;
        - *wet:* [Mediawet 2008][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025028
    url: https://wetten.overheid.nl/BWBR0025036/2022-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0025028
  - number: 1a
    text: |-
      1 De NPO maakt voorafgaand aan de start van een experiment betreffende een aanbodkanaal als bedoeld in
      [artikel 2.21a van de wet][ref1] de uitvoering van dat experiment bekend.

      2 De bekendmaking gaat vergezeld van een beschrijving van het experiment die in elk geval bevat:

      a. de positie van het experiment binnen de publieke mediaopdracht, bedoeld in [artikel 2.1 van de wet][ref2], en de
      relatie met het andere media-aanbod van de landelijke publieke mediadienst;

      b. de doelstellingen van het experiment waaronder het beoogde publieksbereik, de doelgroepen en de behoeften van
      het publiek, mede in het licht van bestaand marktaanbod; en

      c. de duur en wijze van financiering van het experiment en de manier waarop het experiment wordt geëvalueerd.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.21a
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0025036/2022-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: 2.21a
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2.1'
  - number: 1b
    text: |-
      1 In de begroting, bedoeld in [artikel 2.147 van de wet][ref1], wordt een beschrijving gegeven van:

      a. de experimenten die worden uitgevoerd; en

      b. de voorgenomen experimenten in het komende kalenderjaar.

      2 [Artikel 1a, tweede lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.147
      [ref2]: https://wetten.overheid.nl/BWBR0025036#Artikel1a
    url: https://wetten.overheid.nl/BWBR0025036/2022-01-01#Artikel1b
