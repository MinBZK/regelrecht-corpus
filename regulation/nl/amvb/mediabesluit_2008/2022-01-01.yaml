  - number: 1c
    text: |-
      1 Een experiment is in duur beperkt tot een looptijd van maximaal een jaar, gerekend vanaf het tijdstip waarop het
      desbetreffende aanbodkanaal voor het publiek beschikbaar is.

      2 Als binnen de maximale looptijd van een experiment het desbetreffende aanbodkanaal in het concessiebeleidsplan,
      bedoeld in [artikel 2.20 van de wet][ref1], of in de begroting, bedoeld in [artikel 2.147 van de wet][ref2], met
      het oog op de instemming als bedoeld in [artikel 2.21, derde lid onderscheidenlijk vierde lid, van de wet][ref3] is
      opgenomen, kan het experiment worden voortgezet, totdat over de instemming is beslist.

      3 Een experiment heeft een beperkt publieksbereik, tenzij dit niet mogelijk is vanwege technische omstandigheden of
      tot onevenredig hoge kosten leidt.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.20
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.147
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel2.21
    url: https://wetten.overheid.nl/BWBR0025036/2022-01-01#Artikel1c
