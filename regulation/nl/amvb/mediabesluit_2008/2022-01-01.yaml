      - id: ref4
        bwb_id: BWBR0025028
        artikel: '2.80'
  - number: 29b
    text: |-
      De eerste benoeming van de leden van de raad van toezicht van de NOS op grond van [artikel 2.34c van de wet][ref1],
      zoals dat artikel luidt met ingang van het tijdstip waarop artikel Ia van de wet van 2 juli 2009 tot wijziging
      van de Mediawet 2008 in verband met de erkenning en de financiering van de publieke omroep in werking is getreden,
      geschiedt niet op voordracht van de raad van toezicht van de NOS.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.34c
    url: https://wetten.overheid.nl/BWBR0025036/2022-01-01#Artikel29b
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: 2.34c
  - number: 29c
    text: |-
      1 In afwijking van [artikel 5a, aanhef en onder a][ref1], bedraagt het daar genoemde percentage:

      a. in 2022 niet meer dan negen procent;

      b. in 2023 niet meer dan acht procent;

      c. in 2024 niet meer dan zeven procent;

      d. in 2025 niet meer dan zes procent.

      2 Onze Minister kan bij ministeriële regeling, indien dit naar zijn oordeel noodzakelijk is in verband met de
      financiering van de landelijke publieke mediadienst, de in het eerste lid genoemde percentages bijstellen, met niet
      meer dan een procent naar boven of beneden.


      [ref1]: https://wetten.overheid.nl/BWBR0025036#Artikel5a
    url: https://wetten.overheid.nl/BWBR0025036/2022-01-01#Artikel29c
    references:
      - id: ref1
        bwb_id: BWBR0025036
        artikel: 5a
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '3'
  - number: '30'
    text: |-
      In afwijking van artikel 15, eerste lid, bedraagt het daarin genoemde percentage voor een algemeen
      televisieprogrammakanaal of een televisieprogrammakanaal, niet zijnde een algemeen televisieprogrammakanaal:

      a. in 2017 ten minste 95% respectievelijk ten minste 50%;

      b. in 2018 ten minste 95% respectievelijk ten minste 85%.
    url: https://wetten.overheid.nl/BWBR0025036/2022-01-01#Artikel30
