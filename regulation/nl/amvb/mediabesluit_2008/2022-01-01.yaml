  - number: '23'
    text: |-
      1 Het Commissariaat verleent toestemming voor het verzorgen van een omroepdienst via een omroepzender binnen een
      gebied van beperkte omvang, welke omroepdienst uitsluitend bestemd is voor in Nederland gelegerde militairen van
      buitenlandse strijdkrachten en hun gezinnen.

      2 De toestemming wordt verleend aan de bevoegde militaire autoriteiten van een bij de Noord-atlantische
      verdragsorganisatie (Navo) aangesloten land waarvan strijdkrachten in Nederland zijn gelegerd, voor het gebruik
      door instellingen of personen van de buitenlandse strijdkrachten die daartoe door hen worden aangewezen.

      3 Ten aanzien van het gebruik van de toestemming zijn de [artikelen 2.89][ref1], [2.90][ref2],
      [2.106 tot en met 2.109][ref3], [2.114][ref4] voor zover het betreft de [artikelen 2.107][ref5] en [2.108][ref6],
      [2.124][ref7], [2.141, eerste lid][ref8], [2.142][ref9], [4.1 tot en met 4.6][ref10], [7.11][ref11], [7.18][ref12]
      en [7.19, eerste lid, onderdeel a, van de wet][ref13] van overeenkomstige toepassing.


