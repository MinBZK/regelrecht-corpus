      2 Als [artikel 2.71, derde lid, van de wet][ref2] op een lokale publieke media-instelling van toepassing is, zijn
      de gedeelten, bedoeld in [artikel 2.71, vierde lid, onderdelen a en b, van de wet][ref3], ten minste de helft.


