  - number: '11'
    text: |-
      In media-aanbod zijn vermijdbare uitingen in de vorm van het tonen of vermelden van de naam van een bedrijf of
      instelling toegestaan, mits:

      a. de naam uitsluitend betrekking heeft op de benaming van een sportvereniging of sportwedstrijd;

      b. de naam niet met nadruk wordt getoond of vermeld; en

      c. de naamgeving, voor zover het de benaming van een Nederlandse sportvereniging betreft, is erkend door de
      desbetreffende bij het NOC*NSF aangesloten sportorganisatie.
    url: https://wetten.overheid.nl/BWBR0025036/2022-01-01#Artikel11
  - number: '12'
    text: |-
      1 Media-aanbod dat bestaat uit het verslag of de weergave van een evenement dat in Nederland plaatsvindt of is
      geproduceerd door of in opdracht van een publieke media-instelling, mag vermijdbare uitingen bevatten als:

      a. het evenement niet voornamelijk bestemd is om als media-aanbod verspreid te worden; en

      b. de uitingen niet overheersend zijn.

      2 Media-aanbod dat bestaat uit het verslag of de weergave van een evenement dat in het buitenland plaatsvindt en
      niet is geproduceerd door of in opdracht van een publieke media-instelling, mag vermijdbare uitingen bevatten als:

      a. het evenement niet voornamelijk bestemd is om als media-aanbod te worden verspreid; en

      b. de uitingen niet langer of met meer nadruk in het media-aanbod voorkomen dan nodig is voor een evenwichtige
      registratie en presentatie.
    url: https://wetten.overheid.nl/BWBR0025036/2022-01-01#Artikel12
  - number: '13'
    text: |-
      1 Media-aanbod dat bestaat uit het verslag of de weergave van een evenement dat niet voornamelijk bestemd is om als
      media-aanbod te worden verspreid, mag vermijdbare uitingen bevatten die bestaan uit vertoning of vermelding van de
      namen of (beeld)merken van personen, bedrijven of instellingen, die een belangrijke, schriftelijk overeengekomen
      bijdrage hebben geleverd aan de totstandkoming van het evenement.

      2 De uitingen:

      a. vinden plaats aan het begin of het einde van het verslag of de weergave;

      b. duren ten hoogste vijf seconden;

      c. bestaan uitsluitend uit stilstaande beelden als het een evenement betreft waarvan het verslag of de weergave is
      geproduceerd door of in opdracht van een publieke media-instelling; en

      d. hebben niet de aard van een reclameboodschap.

      3 Het eerste en tweede lid zijn niet van toepassing ten aanzien van personen, bedrijven of instellingen, die:

      a. zich voornamelijk bezighouden met de productie of verkoop van sigaretten of andere tabaksproducten; of

      b. gebruik maken van namen of (beeld)merken die tevens worden gebruikt door personen, bedrijven of instellingen als
      bedoeld onder a, of daarmee een zo sterke gelijkenis vertonen dat het publiek redelijkerwijs de indruk krijgt dat
      het mede de naam of het (beeld)merk van een persoon, bedrijf of instelling als bedoeld onder a betreft.
    url: https://wetten.overheid.nl/BWBR0025036/2022-01-01#Artikel13
  - number: '14'
    text: |-
      1 Media-aanbod dat bestaat uit een film die voor een zaal publiek is of wordt vertoond, of een bewerking daarvan,
      mag vermijdbare uitingen bevatten die bestaan uit het tonen of vermelden van namen, (beeld-)merken, producten of
      diensten van personen, bedrijven of instellingen, als die uitingen in het media-aanbod voorkomen in dezelfde vorm
      en in ten hoogste dezelfde hoeveelheid als in de voor een zaal publiek bestemde versie van de film.

      2 Uit het buitenland aangekocht media-aanbod dat ten behoeve van het buitenlandse publiek als zodanig is verspreid,
      mag vermijdbare uitingen bevatten die bestaan uit het tonen of vermelden van namen, (beeld-)merken, producten of
      diensten van personen, bedrijven of instellingen, als die uitingen in het media-aanbod voorkomen in dezelfde vorm
      en in ten hoogste dezelfde hoeveelheid als in de ten behoeve van het buitenlandse publiek verspreide inhoud van het
      media-aanbod.
    url: https://wetten.overheid.nl/BWBR0025036/2022-01-01#Artikel14
  - number: 14a
    text: |-
      Bij regeling van het Commissariaat kan worden bepaald dat in andere gevallen dan die bedoeld in de
      [artikelen 9 tot en met 14][ref1] vermijdbare uitingen in het media-aanbod zijn toegestaan, voor zover het betreft
      uitingen in het kader van:

      a. zelfpromotie;

      b. de vertoning of vermelding van sponsors van evenementen;

      c. liefdadigheidsacties;

      d. de vertoning of vermelding van boek- en filmtitels en culturele evenementen in de titel van een programma in
      andere gevallen dan bedoeld in [artikel 2.108, tweede en derde lid, van de wet][ref2]; en

      e. de vertoning of vermelding van (co)producenten, derden die bijdragen hebben verstrekt die niet als sponsoring
      worden aangemerkt, facilitaire bedrijven, auteursrechthebbenden, vacaturebanken, loterijen en opname- en
      uitzendlocaties.

      De in de eerste volzin bedoelde regeling wordt door Onze Minister goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0025036#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.108
    url: https://wetten.overheid.nl/BWBR0025036/2022-01-01#Artikel14a
