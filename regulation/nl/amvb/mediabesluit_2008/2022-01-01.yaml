    text: |-
      1 De totale kosten voor de landelijke publieke mediadienst van experimenten in enig
      kalenderjaar bedragen niet meer dan 2 procent van het totaal van de budgetten, bedoeld in
      [artikel 2.149, eerste lid, onderdelen a tot en met d en f, van de wet][ref1].

      2 De NPO vermeldt in het verslag, bedoeld in [artikel 2.58 van de wet][ref2], de uitgevoerde experimenten en de
      kosten per experiment in het afgelopen kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.149
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.58
