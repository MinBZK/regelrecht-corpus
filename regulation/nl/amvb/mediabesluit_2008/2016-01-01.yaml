  - number: '36'
    text: 'Dit besluit wordt aangehaald als: Mediabesluit 2008.'
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel36
  - number: '37'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld, en de verschillende artikelen of onderdelen daarvan
      kunnen terugwerken tot en met een bij het koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel37
