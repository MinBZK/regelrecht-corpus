  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Onderwijs, Cultuur en Wetenschap, van 18 november 2008, nr. WJZ/75071
    (8238), directie Wetgeving en Juridische Zaken;

    Gelet op de artikelen 2.23, tweede lid, 2.35, tweede lid, 2.70, onderdeel b, 2.71, vierde lid, 2.89, tweede lid,
    2.93, 2.95, eerste lid, onderdeel a, 2.123, 2.136, eerste lid, 3.25, 5.1, eerste lid, 5.2, 6.24, tweede en derde
    lid, 6.27 en 8.20 van de Mediawet 2008;

    De Raad van State gehoord (advies van 10 december 2008, nr. 08.003330);

    Gezien het nader rapport van Onze Minister van Onderwijs, Cultuur en Wetenschap, van 17 december 2008, nr.
    WJZ/88447 (8238), directie Wetgeving en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: - *wet:* [Mediawet 2008][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0025028
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0025028
  - number: 1a.1
    text: |-
      De NPO maakt voorafgaand aan de start van een experiment betreffende een aanbodkanaal als bedoeld in
      [artikel 2.21a van de wet][ref1] de uitvoering van dat experiment bekend.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
  - number: 1a.2
    text: 'De bekendmaking gaat vergezeld van een beschrijving van het experiment die in elk geval bevat:'
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel1a
  - number: 1a.2.a
    text: |-
      de positie van het experiment binnen de publieke mediaopdracht, bedoeld in [artikel 2.1 van de wet][ref1], en de
      relatie met het andere media-aanbod van de landelijke publieke mediadienst;


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
  - number: 1a.2.b
    text: |-
      de doelstellingen van het experiment waaronder het beoogde publieksbereik, de doelgroepen en de behoeften van het
      publiek, mede in het licht van bestaand marktaanbod; en
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel1a
  - number: 1a.2.c
    text: de duur en wijze van financiering van het experiment en de manier waarop het experiment wordt geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel1a
  - number: 1b.1
    text: |-
      In de begroting, bedoeld in [artikel 2.147 van de wet][ref1], wordt een beschrijving gegeven van:


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
  - number: 1b.1.a
    text: de experimenten die worden uitgevoerd; en
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel1b
  - number: 1b.1.b
    text: de voorgenomen experimenten in het komende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel1b
  - number: 1b.2
    text: |-
      [Artikel 1a, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025036#Artikel1a
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0025036
        artikel: 1a
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: 1c.1
    text: |-
      Een experiment is in duur beperkt tot een looptijd van maximaal een jaar, gerekend vanaf het tijdstip waarop het
      desbetreffende aanbodkanaal voor het publiek beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel1c
  - number: 1c.2
    text: |-
      Als binnen de maximale looptijd van een experiment het desbetreffende aanbodkanaal in het concessiebeleidsplan,
      bedoeld in [artikel 2.20 van de wet][ref1], of in de begroting, bedoeld in [artikel 2.147 van de wet][ref2], met
      het oog op de instemming als bedoeld in [artikel 2.21, derde lid onderscheidenlijk vierde lid, van de wet][ref3] is
      opgenomen, kan het experiment worden voortgezet, totdat over de instemming is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel1c
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0025028
        artikel: '2'
  - number: 1c.3
    text: |-
      Een experiment heeft een beperkt publieksbereik, tenzij dit niet mogelijk is vanwege technische omstandigheden of
      tot onevenredig hoge kosten leidt.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel1c
  - number: 1d.1
    text: |-
      De totale kosten voor de landelijke publieke mediadienst van experimenten in enig
      kalenderjaar bedragen niet meer dan 2 procent van het totaal van de budgetten, bedoeld in
      [artikel 2.149, eerste lid, onderdelen a tot en met d en f, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel1d
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
  - number: 1d.2
    text: |-
      De NPO vermeldt in het verslag, bedoeld in [artikel 2.58 van de wet][ref1], de uitgevoerde experimenten en de
      kosten per experiment in het afgelopen kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel1d
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
  - number: '2'
    text: 'De NOS verzorgt in ieder geval het volgende media-aanbod:'
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel2
  - number: 2.a
    text: de dagelijkse nieuwsvoorziening;
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel2
  - number: 2.b
    text: de verslaggeving over Nederlandse en Europese parlementaire aangelegenheden;
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel2
  - number: 2.c
    text: de verslaggeving van nationale feest- en gedenkdagen;
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel2
  - number: 2.d
    text: |-
      de actuele sportverslaggeving, waaronder in ieder geval de competitie- en bekerwedstrijden en internationale
      evenementen;
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel2
  - number: 2.e
    text: |-
      de verslaglegging van andere nationale en internationale gebeurtenissen van bijzondere aard, waaronder
      staatsbezoeken;
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel2
  - number: 2.f
    text: de nieuwsvoorziening ten behoeve van de jeugd;
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel2
  - number: 2.g
    text: de nieuwsvoorziening ten behoeve van personen met een auditieve beperking; en
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel2
  - number: 2.h
    text: |-
      aanbod van dienstverlenende aard, waaronder informatie ten behoeve van scheepvaart, verkeer, visserij, en land-
      en tuinbouw.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel2
  - number: '3'
    text: 'De NTR verzorgt in ieder geval het volgende media-aanbod:'
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel3
  - number: 3.a
    text: |-
      achtergrondinformatie en beschouwingen over politieke en maatschappelijke ontwikkelingen, onder meer op het gebied
      van economie, wetenschap en techniek;
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel3
  - number: 3.b
    text: aanbod ten behoeve van maatschappelijke doelgroepen die elders niet of niet voldoende tot hun recht komen;
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel3
  - number: 3.c
    text: aanbod dat betrekking heeft op etnische en culturele minderheden;
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel3
  - number: 3.d
    text: aanbod van culturele aard, waaronder kunst;
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel3
  - number: 3.e
    text: aanbod van educatieve aard ten behoeve van de jeugd; en
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel3
  - number: 3.f
    text: consumentenvoorlichting.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel3
  - number: 3a
    text: |-
      In deze paragraaf worden onder evaluatie en evaluatiecommissie verstaan de evaluatie onderscheidenlijk
      de evaluatie, bedoeld in [artikel 2.184 van de wet][ref1], en de evaluatiecommissie, bedoeld in
      [artikel 2.185 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2'
  - number: 3b.1
    text: |-
      Bij de evaluatie van elke afzonderlijke landelijke publieke media-instelling betrekt de evaluatiecommissie de wijze
      waarop deze instelling heeft bijgedragen aan de uitvoering van de publieke mediaopdracht door het aanbieden van
      media-aanbod dat:
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel3b
  - number: 3b.1.a
    text: |-
      evenwichtig, pluriform, gevarieerd en kwalitatief hoogstaand is en zich tevens kenmerkt door een grote
      verscheidenheid naar vorm en inhoud;
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel3b
  - number: 3b.1.b
    text: |-
      op evenwichtige wijze een beeld van de samenleving geeft en de pluriformiteit van onder de bevolking levende
      overtuigingen, opvattingen en interesses op maatschappelijk, cultureel en levensbeschouwelijk gebied weerspiegelt;
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel3b
  - number: 3b.1.c
    text: |-
      gericht is op en een relevant bereik heeft onder zowel een breed en algemeen publiek als bevolkings- en
      leeftijdgroepen van verschillende omvang en samenstelling met in het bijzonder aandacht voor kleine doelgroepen;
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel3b
  - number: 3b.1.d
    text: |-
      onafhankelijk is van commerciële invloeden en, behoudens het bepaalde bij of krachtens de wet, van
      overheidsinvloeden;
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel3b
  - number: 3b.1.e
    text: voldoet aan hoge journalistieke en professionele kwaliteitseisen; en
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel3b
  - number: 3b.1.f
    text: voor iedereen toegankelijk is.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel3b
  - number: 3b.2
    text: |-
      Bij de evaluatie van elke afzonderlijke landelijke publieke media-instelling betrekt de evaluatiecommissie voorts
      de wijze waarop deze instelling heeft bijgedragen aan het volgen en stimuleren van technologische ontwikkelingen
      en het benutten van de mogelijkheden om media-aanbod aan het publiek aan te bieden via nieuwe media- en
      verspreidingstechnieken.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel3b
  - number: 3b.3
    text: |-
      Bij de evaluatie, bedoeld in het eerste en tweede lid, betrekt de evaluatiecommissie de wijze waarop deze
      instelling heeft bijgedragen aan realisering van doelstellingen voor het media-aanbod en het publieksbereik van
      het concessiebeleidsplan, bedoeld in [artikel 2.20 van de wet][ref1], en van de prestatieovereenkomst, bedoeld in
      [artikel 2.22 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2'
  - number: 3c.1
    text: |-
      Bij de evaluatie van een afzonderlijke omroeporganisatie die een erkenning als bedoeld in
      [artikel 2.23, eerste lid, van de wet][ref1] heeft verkregen, betrekt de evaluatiecommissie voorts:


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel3c
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
  - number: 3c.1.a
    text: |-
      de wijze waarop de missie en de identiteit van de omroeporganisatie zijn geformuleerd en uitgewerkt in
      doelstellingen voor het media-aanbod en het publieksbereik; en
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel3c
  - number: 3c.1.b
    text: de mate waarin de omroeporganisatie in onderdeel a bedoelde doelstellingen heeft gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel3c
  - number: 3c.2
    text: |-
      Bij de evaluatie van een omroepvereniging die een voorlopige erkenning als bedoeld in
      [artikel 2.23, tweede lid, van de wet][ref1] heeft verkregen, betrekt de evaluatiecommissie voorts:


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel3c
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
  - number: 3c.2.a
    text: de criteria, bedoeld in het eerste lid; en
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel3c
  - number: 3c.2.b
    text: |-
      de mate waarin deze instelling heeft voldaan aan de eis om zich naar stroming en naar voorgenomen media-aanbod
      wat betreft genre, inhoud en doelgroepen zodanig te onderscheiden van de erkende omroeporganisaties dat de
      verscheidenheid van het media-aanbod van de landelijke publieke mediadienst is vergroot en een vernieuwende
      bijdrage is geleverd aan de uitvoering van de publieke mediaopdracht op landelijk niveau.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel3c
  - number: 3c.3
    text: 'Bij de evaluatie van de NOS en de NTR betrekt de evaluatiecommissie voorts:'
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel3c
  - number: 3c.3.a
    text: |-
      de wijze waarop deze instellingen de taken, bedoeld in [artikel 2.34a, eerste en tweede lid, van de wet][ref1]
      onderscheidenlijk [artikel 2.35, eerste lid, van de wet][ref2], en in het bijzonder de taken, bedoeld in
      [artikel 2][ref3] onderscheidenlijk [artikel 3][ref4], hebben uitgevoerd;


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0025036#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0025036#Artikel3
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel3c
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0025036
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0025036
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '1'
  - number: 3c.3.b
    text: de mate waarin deze instellingen eigen doelstellingen voor media-aanbod en publieksbereik hebben gerealiseerd; en
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel3c
  - number: 3c.3.c
    text: |-
      de wijze waarop deze instellingen zorg dragen voor interne pluriformiteit van hun media-aanbod als bedoeld in
      [artikel 2.34e van de wet][ref1] onderscheidenlijk [artikel 2.37a van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel3c
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2'
  - number: '4.1'
    text: |-
      Het programma-aanbod van de regionale en de lokale publieke mediadienst bedoeld in
      [artikel 2.70, aanhef en onderdeel b, van de wet][ref1], bestaat voor ten minste vijftig procent uit aanbod dat
      door de media-instelling zelf of uitsluitend in haar opdracht is geproduceerd.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
  - number: '4.2'
    text: |-
      Als [artikel 2.71, derde lid, van de wet][ref1] op een lokale publieke media-instelling van toepassing is, zijn de
      gedeelten, bedoeld in [artikel 2.71, vierde lid, onderdelen a en b, van de wet][ref2], ten minste de helft.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2'
  - number: 4a
    text: |-
