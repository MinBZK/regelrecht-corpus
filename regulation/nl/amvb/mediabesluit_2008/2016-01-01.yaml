  - number: '35.1'
    text: |-
      Voor zover ter zake van het besluit en de regeling, bedoeld in de [artikelen 31][ref1] en [32][ref2], nog sprake
      is van bestuursrechtelijke afdoening, met inbegrip van bezwaar- en beroepsprocedures, vindt deze overeenkomstig het
      besluit en de regeling, bedoeld in de [artikelen 31][ref3] en [32][ref4], plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0025036#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0025036#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0025036#Artikel31
      [ref4]: https://wetten.overheid.nl/BWBR0025036#Artikel32
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel35
