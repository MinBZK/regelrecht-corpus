      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
  - number: 4b
    text: |-
      Bij ministeriële regeling worden regels gesteld over de inhoud, de inrichting en het tijdstip van indiening van
      een aanvraag voor een bijdrage als bedoeld in [artikel 2.170, tweede lid, van de wet][ref1] en over de inhoud en
      inrichting van de begroting van een regionale publieke media-instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
  - number: '5'
    text: |-
      Het aandeel reclame- en telewinkelboodschappen, inclusief omlijsting, in het programma-aanbod van de publieke
      mediadiensten bedraagt per programmakanaal niet meer dan tien procent van de totale duur van het programma-aanbod
      op het programmakanaal per jaar.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel5
  - number: '6'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop inzicht wordt gegeven in de financiën
      die betrekking hebben op de verzorging van reclame- en telewinkelboodschappen in het media-aanbod van de regionale
      en lokale publieke mediadiensten.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel6
  - number: '7'
    text: |-
      In deze paragraaf wordt onder «vermijdbare uitingen» verstaan vermijdbare uitingen anders dan reclame- of
      telewinkelboodschappen die onmiskenbaar tot gevolg hebben dat de afname van producten of diensten wordt bevorderd.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel7
  - number: '8'
    text: |-
      Uitingen anders dan reclame- of telewinkelboodschappen zijn onvermijdbaar, als het uitingen betreft die behoren
      tot het normale straatbeeld en die zonder opzet en zonder nadruk gedurende enkele seconden in het media-aanbod
      voorkomen.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel8
  - number: '9.1'
    text: |-
      In media-aanbod van informatieve of educatieve aard zijn vermijdbare uitingen in de vorm van het tonen of vermelden
      van een product of dienst toegestaan, mits:
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel9
  - number: 9.1.a
    text: de vertoning of vermelding past binnen de context van het media-aanbod;
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel9
  - number: 9.1.b
    text: de vertoning of vermelding geen afbreuk doet aan de formule of de integriteit van het media-aanbod;
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel9
  - number: 9.1.c
    text: de vertoning of vermelding niet op een overdreven of overdadige wijze plaatsvindt; en
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel9
  - number: 9.1.d
    text: er geen sprake is van specifieke aanprijzingen van deze producten of diensten.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel9
  - number: '9.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op ander media-aanbod, met uitzondering van media-aanbod dat in
      het bijzonder bestemd is voor kinderen jonger dan twaalf jaar.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel9
  - number: '10.1'
    text: |-
      Onverminderd [artikel 9][ref1] mag media-aanbod van informatieve of educatieve aard vermijdbare uitingen in de vorm
      van het tonen of vermelden van namen of (beeld)merken van bepaalde producten of diensten of van namen van bedrijven
      of instellingen bevatten. Op deze uitingen is [artikel 9, eerste lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025036#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0025036#Artikel9
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0025036
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0025036
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '3'
  - number: '10.2'
    text: |-
      In afwijking van [artikel 9, eerste lid, aanhef en onderdeel d][ref1], mag media-aanbod van informatieve
      of educatieve aard vermijdbare uitingen bevatten die bestaan uit het aankondigen en recenseren van boeken,
      video’s, compact discs en soortgelijke culturele uitingen, alsmede van toneel-, muziek- en filmuitvoeringen,
      tentoonstellingen en soortgelijke evenementen van kunstzinnige aard.


      [ref1]: https://wetten.overheid.nl/BWBR0025036#Artikel9
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0025036
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '3'
  - number: '11'
    text: |-
      In media-aanbod zijn vermijdbare uitingen in de vorm van het tonen of vermelden van de naam van een bedrijf of
      instelling toegestaan, mits:
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel11
  - number: 11.a
    text: de naam uitsluitend betrekking heeft op de benaming van een sportvereniging of sportwedstrijd;
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel11
  - number: 11.b
    text: de naam niet met nadruk wordt getoond of vermeld; en
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel11
  - number: 11.c
    text: |-
      de naamgeving, voor zover het de benaming van een Nederlandse sportvereniging betreft, is erkend door de
      desbetreffende bij het NOC*NSF aangesloten sportorganisatie.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel11
  - number: '12.1'
    text: |-
      Media-aanbod dat bestaat uit het verslag of de weergave van een evenement dat in Nederland plaatsvindt of is
      geproduceerd door of in opdracht van een publieke media-instelling, mag vermijdbare uitingen bevatten als:
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel12
  - number: 12.1.a
    text: het evenement niet voornamelijk bestemd is om als media-aanbod verspreid te worden; en
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel12
  - number: 12.1.b
    text: de uitingen niet overheersend zijn.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel12
  - number: '12.2'
    text: |-
      Media-aanbod dat bestaat uit het verslag of de weergave van een evenement dat in het buitenland plaatsvindt en niet
      is geproduceerd door of in opdracht van een publieke media-instelling, mag vermijdbare uitingen bevatten als:
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel12
  - number: 12.2.a
    text: het evenement niet voornamelijk bestemd is om als media-aanbod te worden verspreid; en
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel12
  - number: 12.2.b
    text: |-
      de uitingen niet langer of met meer nadruk in het media-aanbod voorkomen dan nodig is voor een evenwichtige
      registratie en presentatie.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel12
  - number: '13.1'
    text: |-
      Media-aanbod dat bestaat uit het verslag of de weergave van een evenement dat niet voornamelijk bestemd is om als
      media-aanbod te worden verspreid, mag vermijdbare uitingen bevatten die bestaan uit vertoning of vermelding van de
      namen of (beeld)merken van personen, bedrijven of instellingen, die een belangrijke, schriftelijk overeengekomen
      bijdrage hebben geleverd aan de totstandkoming van het evenement.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel13
  - number: '13.2'
    text: 'De uitingen:'
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel13
  - number: 13.2.a
    text: vinden plaats aan het begin of het einde van het verslag of de weergave;
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel13
  - number: 13.2.b
    text: duren ten hoogste vijf seconden;
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel13
  - number: 13.2.c
    text: |-
      bestaan uitsluitend uit stilstaande beelden als het een evenement betreft waarvan het verslag of de weergave is
      geproduceerd door of in opdracht van een publieke media-instelling; en
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel13
  - number: 13.2.d
    text: hebben niet de aard van een reclameboodschap.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel13
  - number: '13.3'
    text: 'Het eerste en tweede lid zijn niet van toepassing ten aanzien van personen, bedrijven of instellingen, die:'
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel13
  - number: 13.3.a
    text: zich voornamelijk bezighouden met de productie of verkoop van sigaretten of andere tabaksproducten; of
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel13
  - number: 13.3.b
    text: |-
      gebruik maken van namen of (beeld)merken die tevens worden gebruikt door personen, bedrijven of instellingen als
      bedoeld onder a, of daarmee een zo sterke gelijkenis vertonen dat het publiek redelijkerwijs de indruk krijgt dat
      het mede de naam of het (beeld)merk van een persoon, bedrijf of instelling als bedoeld onder a betreft.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel13
  - number: '14.1'
    text: |-
      Media-aanbod dat bestaat uit een film die voor een zaal publiek is of wordt vertoond, of een bewerking daarvan,
      mag vermijdbare uitingen bevatten die bestaan uit het tonen of vermelden van namen, (beeld-)merken, producten of
      diensten van personen, bedrijven of instellingen, als die uitingen in het media-aanbod voorkomen in dezelfde vorm
      en in ten hoogste dezelfde hoeveelheid als in de voor een zaal publiek bestemde versie van de film.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel14
  - number: '14.2'
    text: |-
      Uit het buitenland aangekocht media-aanbod dat ten behoeve van het buitenlandse publiek als zodanig is verspreid,
      mag vermijdbare uitingen bevatten die bestaan uit het tonen of vermelden van namen, (beeld-)merken, producten of
      diensten van personen, bedrijven of instellingen, als die uitingen in het media-aanbod voorkomen in dezelfde vorm
      en in ten hoogste dezelfde hoeveelheid als in de ten behoeve van het buitenlandse publiek verspreide inhoud van het
      media-aanbod.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel14
  - number: 14a
    text: |-
      Bij regeling van het Commissariaat kan worden bepaald dat in andere gevallen dan die bedoeld in de
      [artikelen 9 tot en met 14][ref1] vermijdbare uitingen in het media-aanbod zijn toegestaan, voor zover het betreft
      uitingen in het kader van:


      [ref1]: https://wetten.overheid.nl/BWBR0025036#Artikel9
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0025036
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '3'
  - number: 14a.a
    text: zelfpromotie;
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel14a
  - number: 14a.b
    text: de vermelding van sponsors van evenementen;
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel14a
  - number: 14a.c
    text: liefdadigheidsacties;
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel14a
  - number: 14a.d
    text: |-
      de vermelding van boek- en filmtitels en culturele evenementen in de titel van een programma in andere gevallen dan
      bedoeld in [artikel 2.108, tweede en derde lid, van de wet][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
  - number: 14a.e
    text: |-
      de vermelding van (co)producenten, derden die bijdragen hebben verstrekt die niet als sponsoring worden aangemerkt,
      facilitaire bedrijven, auteursrechthebbenden, vacaturebanken, loterijen en opname- en uitzendlocaties.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel14a
  - number: 14b
    text: |-
      Het percentage, bedoeld in [artikel 2.116, eerste lid, van de wet][ref1] is 16,5.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
  - number: '15.1'
    text: |-
      In dit artikel wordt onder «themakanaal» verstaan een televisieprogrammakanaal, niet zijnde een algemeen
      televisieprogrammakanaal.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel15
  - number: '15.2'
    text: |-
      Het totale televisieprogramma-aanbod van de landelijke publieke mediadienst dat bestaat uit oorspronkelijk
      Nederlandstalige producties, is op de algemene televisieprogrammakanalen en op de themakanalen voor ten minste
      95% onderscheidenlijk voor ten minste 50% voorzien van ondertiteling ten behoeve van personen met een auditieve
      beperking.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel15
  - number: '15.3'
    text: |-
      Voor de toepassing van dit artikel worden reclame- en telewinkelboodschappen inclusief omlijsting buiten
      beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel15
  - number: '16'
    text: |-
      Inkomsten uit programmabladen van een omroeporganisatie kunnen jaarlijks tot ten hoogste het bedrag dat nodig is om
      een eventueel verlies van de desbetreffende omroeporganisatie te dekken, worden besteed aan verenigingsactiviteiten
      als bedoeld in [artikel 2.136 van de wet][ref1]. Bij de bepaling van het resultaat blijven veranderingen in de
      waarde van materiële vaste activa als gevolg van herwaarderingen buiten beschouwing. De gebruikelijke jaarlijkse
      afschrijvingen van de materiële vaste activa worden niet als herwaarderingen aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
  - number: 16a
    text: |-
      Omroeporganisaties die een erkenning of een voorlopige erkenning als bedoeld in [artikel 2.23 van de wet][ref1]
      hebben verkregen, kunnen netto inkomsten uit contributies en verenigingsactiviteiten als bedoeld in
      [artikel 2.136 van de wet][ref2] tot een bedrag van € 750.000 reserveren voor die verenigingsactiviteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2'
  - number: '17.1'
    text: |-
      Het totale programma-aanbod op een televisieprogrammakanaal van een commerciële media-instelling met een bereik van
      ten minste 75 procent van alle huishoudens in Nederland dat bestaat uit oorspronkelijk Nederlandstalige producties,
      is voor ten minste 50% voorzien van ondertiteling ten behoeve van personen met een auditieve beperking.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel17
  - number: '17.2'
    text: |-
      Voor de toepassing van dit artikel worden reclame- en telewinkelboodschappen inclusief omlijsting buiten
      beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel17
  - number: '18'
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *lijst:* evenementenlijst die is opgenomen in de bij dit besluit behorende
      bijlage.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel18
  - number: '19.1'
    text: |-
      De evenementen, genoemd in onderdeel A van de lijst, die als televisieprogramma worden verspreid, worden in ieder
      geval verspreid op een open televisieprogrammakanaal door middel van volledige rechtstreekse verslaggeving.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel19
  - number: '19.2'
    text: |-
      In afwijking van het eerste lid behoeven de in dat lid bedoelde evenementen, die geheel of gedeeltelijk
      plaatsvinden tussen 00.00 uur en 07.00 uur, niet door middel van volledige rechtstreekse verslaggeving te worden
      verspreid.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel19
  - number: '19.3'
    text: |-
      In afwijking van het eerste lid behoeven wedstrijden die deel uitmaken van de in dat lid bedoelde evenementen en
      die gelijktijdig plaatsvinden niet alle door middel van volledige rechtstreekse verslaggeving te worden verspreid,
      als ten minste een van deze wedstrijden wordt verspreid door middel van volledige rechtstreekse verslaggeving op
      een open televisiekanaal.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel19
  - number: '20.1'
    text: |-
      De evenementen, genoemd in onderdeel B van de lijst, die als televisieprogramma worden verspreid, worden in ieder
      geval verspreid op een open televisieprogrammakanaal door middel van gedeeltelijke rechtstreekse verslaggeving.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel20
  - number: '20.2'
    text: |-
      De verslaggeving van evenementen, bedoeld in het eerste lid, heeft de in onderdeel B van de lijst vermelde
      minimumduur.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel20
  - number: '21.1'
    text: |-
      De evenementen, genoemd in onderdeel C van de lijst, die als televisieprogramma worden verspreid, worden in ieder
      geval verspreid op een open televisieprogrammakanaal door middel van gedeeltelijke uitgestelde verslaggeving.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel21
  - number: '21.2'
    text: |-
      In afwijking van het eerste lid behoeven de in dat lid bedoelde evenementen niet door middel van
      gedeeltelijke uitgestelde verslaggeving te worden verspreid, als deze evenementen worden verspreid op een open
      televisieprogrammakanaal door middel van volledige rechtstreekse verslaggeving.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel21
  - number: '21.3'
    text: |-
      De verslaggeving van de evenementen, bedoeld in het eerste lid, heeft de in onderdeel C van de lijst vermelde
      minimumduur.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel21
  - number: '21.4'
    text: |-
      De verslaggeving van de evenementen, bedoeld in het eerste lid, vindt plaats op de dag van het evenement of een
      onderdeel daarvan, met dien verstande dat de verslaggeving van de wedstrijden van de hoogste divisie van het
      nationaal betaald voetbal uiterlijk aanvangt op de in onderdeel C van de lijst vermelde tijdstippen.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel21
  - number: '22.1'
    text: |-
      Voor de toepassing van [artikel 6.24 van de wet][ref1] worden twee of meer instellingen als één instelling
      aangemerkt, als:


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel6
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '6'
  - number: 22.1.a
    text: |-
      een instelling direct of indirect zodanige zeggenschap of feitelijke invloed heeft in één of meer instellingen dat
      deze in belangrijke mate het beleid van die instelling of instellingen kan bepalen of aanmerkelijke invloed heeft
      op de inhoud van dat beleid; of
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel22
  - number: 22.1.b
    text: |-
      een natuurlijk persoon of groep van natuurlijke personen direct of indirect een zodanige zeggenschap of feitelijke
      invloed heeft in twee of meer instellingen dat deze in belangrijke mate het beleid van die instellingen kan bepalen
      of aanmerkelijke invloed heeft op de inhoud van dat beleid.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel22
  - number: '22.2'
    text: |-
      Bij ministeriële regeling kan in overeenstemming met Onze Minister van Economische Zaken worden bepaald dat
      in afwijking van [artikel 6.24, eerste lid, van de wet][ref1] voor de verspreiding van radioprogramma-aanbod
      van eenzelfde instelling meer frequentieruimte mag worden gebruikt dan één FM-frequentie of samenstel van FM
      frequenties.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel6
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '6'
  - number: '23.1'
    text: |-
      Het Commissariaat verleent toestemming voor het verzorgen van een omroepdienst via een omroepzender binnen een
      gebied van beperkte omvang, welke omroepdienst uitsluitend bestemd is voor in Nederland gelegerde militairen van
      buitenlandse strijdkrachten en hun gezinnen.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel23
  - number: '23.2'
    text: |-
      De toestemming wordt verleend aan de bevoegde militaire autoriteiten van een bij de Noord-atlantische
      verdragsorganisatie (Navo) aangesloten land waarvan strijdkrachten in Nederland zijn gelegerd, voor het gebruik
      door instellingen of personen van de buitenlandse strijdkrachten die daartoe door hen worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel23
  - number: '23.3'
    text: |-
      Ten aanzien van het gebruik van de toestemming zijn de [artikelen 2.89][ref1], [2.90][ref2],
      [2.106 tot en met 2.109][ref3], [2.114][ref4] voor zover het betreft de [artikelen 2.107][ref5] en [2.108][ref6],
      [2.124][ref7], [2.141, eerste lid][ref8], [2.142][ref9], [4.1 tot en met 4.6][ref10], [7.11][ref11], [7.18][ref12]
      en [7.19, eerste lid, onderdeel a, van de wet][ref13] van overeenkomstige toepassing.


