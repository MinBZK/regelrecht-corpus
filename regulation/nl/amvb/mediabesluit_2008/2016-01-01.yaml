        hoofdstuk: '7'
  - number: '35.2'
    text: |-
      Bestaande aanspraken en verplichtingen op grond van het besluit en de regeling, bedoeld in de [artikelen 31][ref1]
      en [32][ref2], blijven in stand.


      [ref1]: https://wetten.overheid.nl/BWBR0025036#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0025036#Artikel32
