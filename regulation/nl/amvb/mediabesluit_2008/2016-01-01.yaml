    text: |-
      Na inwerkingtreding van dit besluit berust
      [artikel 8 van de Regeling aanwijzing en gebruik frequentieruimte commerciële radio-omroep 2003][ref1] op
      [artikel 22, tweede lid][ref2], van dit besluit.


