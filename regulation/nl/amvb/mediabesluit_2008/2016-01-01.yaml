  - number: '24'
    text: |-
      Het Commissariaat kan zonodig de omroepzender of omroepzenders aanwijzen die voor de omroepdienst bedoeld in
      [artikel 23][ref1], wordt gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0025036#Artikel23
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0025036
        artikel: '23'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '25.1'
    text: |-
      Een aanvraag voor de toestemming bedoeld in [artikel 23][ref1] wordt ingediend bij Onze Minister van Defensie, die
      deze voorzien van zijn opmerkingen binnen vier weken doorzendt aan het Commissariaat. Het Commissariaat zendt een
      afschrift van de aanvraag aan Onze Minister van Economische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0025036#Artikel23
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0025036
        artikel: '23'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '25.2'
    text: 'De aanvraag gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel25
  - number: 25.2.a
    text: een omschrijving van het doel van de aanvraag;
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel25
  - number: 25.2.b
    text: een aanduiding van het gebied waarbinnen de omroepdienst zal worden verspreid;
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel25
  - number: 25.2.c
    text: |-
      een verklaring van de auteursrechthebbenden aan de autoriteiten van de desbetreffende Navo-lidstaat waaruit blijkt
      dat geen auteursrechtelijke toestemming zal worden verleend voor de verspreiding van de mediadienst buiten de in
      [artikel 23][ref1] omschreven doelgroep en het aangeduide gebied; en


      [ref1]: https://wetten.overheid.nl/BWBR0025036#Artikel23
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0025036
        artikel: '23'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 25.2.d
    text: een omschrijving van de te gebruiken omroepzender.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel25
  - number: '26.1'
    text: 'Het Commissariaat trekt de toestemming in:'
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel26
  - number: 26.1.a
    text: |-
      als niet meer wordt voldaan aan de voorwaarden van [artikel 23, eerste en tweede lid][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0025036#Artikel23
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0025036
        artikel: '23'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 26.1.b
    text: op gronden ontleend aan de veiligheid van de staat.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel26
  - number: '26.2'
    text: |-
      Het Commissariaat kan de toestemming intrekken als niet wordt voldaan aan [artikel 23, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025036#Artikel23
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0025036
        artikel: '23'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '26.3'
    text: |-
      Het Commissariaat maakt zijn voornemen tot intrekking van de toestemming kenbaar aan Onze Minister van Defensie en
      Onze Minister van Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel26
  - number: '27.1'
    text: |-
      Een beschikking tot intrekking van een verleende toestemming op grond van [artikel 26, eerste lid][ref1], gaat
      onmiddellijk in.


      [ref1]: https://wetten.overheid.nl/BWBR0025036#Artikel26
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0025036
        artikel: '26'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '27.2'
    text: |-
      Een beschikking tot intrekking van een verleende toestemming op grond van [artikel 26, tweede lid][ref1], gaat niet
      eerder in dan nadat de bevoegde militaire autoriteit van het voornemen daartoe en de gronden waarop de beschikking
      berust in kennis is gesteld en deze in de gelegenheid is gesteld binnen een redelijke termijn schriftelijke en
      desgewenst mondelinge opmerkingen te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0025036#Artikel26
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0025036
        artikel: '26'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '28.1'
    text: |-
      De bevoegde militaire autoriteit gebruikt de aan hem verleende toestemming geheel voor de omroepdienst, bedoeld
      in [artikel 23][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025036#Artikel23
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0025036
        artikel: '23'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '28.2'
    text: |-
      Aan het begin en aan het eind van het dagelijks verzorgde programma-aanbod wordt vermeld dat het verzorgde
      programma-aanbod uitsluitend bestemd is voor de in Nederland gelegerde militairen van de strijdkrachten van de
      desbetreffende Navo-lidstaat en hun gezinnen.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel28
  - number: '29'
    text: 'Bij ministeriële regeling kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel29
  - number: 29.a
    text: de nadere voorwaarden voor het verkrijgen van subsidie;
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel29
  - number: 29.b
    text: de verplichtingen die het Stimuleringsfonds aan een subsidieontvanger kan opleggen;
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel29
  - number: 29.c
    text: de indiening en wijze van behandeling van aanvragen;
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel29
  - number: 29.d
    text: de hoogte van subsidies en de wijze van berekening daarvan;
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel29
  - number: 29.e
    text: |-
      de wijze waarop de beschikbare financiële middelen voor de verschillende subsidies worden verdeeld als een
      subsidieplafond is vastgesteld;
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel29
  - number: 29.f
    text: de verlening van voorschotten; en
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel29
  - number: 29.g
    text: de intrekking, wijziging en terugvordering van subsidies.
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel29
  - number: 29a.1
    text: |-
      De voorzitter en de andere leden van het bestuur van de Stichting Radio Nederland Wereldomroep, bedoeld in
      artikel in [artikel 78 van de Mediawet][ref1], zoals dat artikel op 31 december 2008 luidde, zijn met ingang van
      1 januari 2009 voorzitter onderscheidenlijk lid van de eerste raad van toezicht van de Stichting Radio Nederland
      Wereldomroep, bedoeld in [artikel 2.74 van de wet][ref2], voor het resterende gedeelte van hun benoemingstermijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '78'
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2'
  - number: 29a.2
    text: |-
      De leden van de programmaraad van de Stichting Radio Nederland Wereldomroep, bedoeld in
      [artikel 81 van de Mediawet][ref1], zoals dat artikel op 31 december 2008 luidde, zijn met ingang
      van 1 januari 2009 lid van de adviesraad van de Stichting Radio Nederland Wereldomroep, bedoeld in
      [artikel 2.80 van de wet][ref2], voor het resterende gedeelte van hun benoemingstermijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '81'
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2'
  - number: 29b
    text: |-
      De eerste benoeming van de leden van de raad van toezicht van de NOS op grond van [artikel 2.34c van de wet][ref1],
      zoals dat artikel luidt met ingang van het tijdstip waarop artikel Ia van de wet van 2 juli 2009 tot wijziging
      van de Mediawet 2008 in verband met de erkenning en de financiering van de publieke omroep in werking is getreden,
      geschiedt niet op voordracht van de raad van toezicht van de NOS.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025036/2016-01-01#Artikel29b
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
