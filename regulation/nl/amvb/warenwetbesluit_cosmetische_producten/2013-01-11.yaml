---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: warenwetbesluit_cosmetische_producten
regulatory_layer: AMVB
publication_date: '2011-03-22'
valid_from: '2013-01-11'
bwb_id: BWBR0007603
url: https://wetten.overheid.nl/BWBR0007603/2013-01-11
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 24 mei 1995, DGVgz/VVP/C 951180,
    gedaan in overeenstemming met Onze Minister van Economische Zaken;

    Gelet op richtlijn 93/35/EEG van de Raad van de Europese Gemeenschappen 14 juni 1993 tot zesde wijziging van
    Richtlijn 76/768/EEG betreffende de onderlinge aanpassing van de wetgevingen der Lid-Staten inzake kosmetische
    produkten (Pb EG L 151), alsmede op de artikelen 4, eerste lid, 6, 8, onderdeel c, 12, 13, 14 van de Warenwet en op
    artikel 11, eerste lid, van de Wijzigingswet 1988 Warenwet;

    De Raad van State gehoord (advies van 24 juli 1995, No. W13.95.0289);

    Gezien het nader rapport van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 27 september 1995,
    DGVgz/VVP/C951859, uitgebracht in overeenstemming met Onze Minister van Economische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel1
  - number: 1.a
    text: |-
      cosmetische producten: alle stoffen en mengsels die bestemd zijn om in aanraking te worden gebracht met de
      verschillende delen van het menselijk lichaamsoppervlak (opperhuid, beharing, haar, nagels, lippen en uitwendige
      geslachtsorganen) of met de tanden en kiezen en de mondslijmvliezen, met het uitsluitende of hoofdzakelijke oogmerk
      deze te reinigen, te parfumeren, het uiterlijk ervan te wijzigen of lichaamsgeuren te corrigeren of voornoemde
      lichaamsdelen te beschermen of in goede staat te houden;
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel1
  - number: 1.b
    text: |-
      recipiënt: de verpakking van het cosmetisch product welke rechtstreeks in aanraking komt met het cosmetisch
      product;
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel1
  - number: 1.c
    text: |-
      prototype: een eerste model of ontwerp dat niet in partijen wordt geproduceerd en op basis waarvan het cosmetisch
      product in de eindsamenstelling waarin het wordt verhandeld en ter beschikking van de consument wordt gesteld,
      wordt gekopieerd of definitief ontwikkeld;
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel1
  - number: 1.d
    text: |-
      [richtlijn 67/548/EEG](31967L0548): [richtlijn nr. 67/548/EEG](31967L0548) van de Raad van de Europese
      Gemeenschappen van 27 juni 1967 betreffende de aanpassing van de wettelijke en bestuursrechtelijke bepalingen
      inzake de indeling, de verpakking en het kenmerken van gevaarlijke stoffen (PbEG L 196);
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel1
  - number: 1.e
    text: |-
      [richtlijn 76/768/EEG](31976L0768): [richtlijn nr. 76/768/EEG](31976L0768) van de Raad van 27 juli 1976 van de
      Europese Gemeenschappen betreffende de onderlinge aanpassing van de wetgevingen der Lid-Staten inzake kosmetische
      producten (PbEG L 262);
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel1
  - number: 1.f
    text: |-
      alternatieve methode: een methode waarbij op wetenschappelijk verantwoorde wijze, geen gebruik wordt gemaakt van
      proefdieren, of, als een dergelijke methode niet beschikbaar is, waarbij dierproeven worden verricht en waarbij
      gebruik wordt gemaakt van een zo gering mogelijk aantal dieren, waarbij dieren betrokken zijn met de laagste graad
      van neurofysiologische gevoeligheid, en zo min mogelijk pijn, lijden, ongemak of blijvend letsel wordt berokkend,
      en die de grootste kans bieden op bevredigende resultaten;
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel1
  - number: 1.g
    text: |-
      dierproef: een proef als bedoeld in artikel 2, onderdeel d, van [richtlijn nr. 86/609/EEG](31986L0609) van de Raad
      van 24 november 1986 inzake de onderlinge aanpassing van de wettelijke en bestuursrechtelijke bepalingen van de
      Lid-Staten betreffende de bescherming van dieren die voor experimentele en andere wetenschappelijke doeleinden
      worden gebruikt (PbEG L 358).
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel1
  - number: '2.1'
    text: |-
      Het is verboden cosmetische producten te verhandelen die niet voldoen aan de in of krachtens dit besluit gestelde
      eisen.
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel2
  - number: '2.2'
    text: |-
      Het is verboden cosmetische producten te verhandelen anders dan met inachtneming van de voorschriften in of
      krachtens dit besluit gesteld met betrekking tot het bezigen van vermeldingen.
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel2
  - number: '2.3'
    text: |-
      Het is de in [artikel 6, eerste lid][ref1], genoemde personen verboden cosmetische producten af te leveren
      anders dan met inachtneming van de voorschriften in of krachtens dit besluit gesteld ten aanzien van de
      [artikel 6, eerste lid, onder a tot en met h][ref2], genoemde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0007603#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007603#Artikel6
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007603
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0007603
        artikel: '6'
  - number: '2.4'
    text: |-
      Het is verboden cosmetische producten te verhandelen anders dan met inachtneming van de voorschriften krachtens dit
      besluit gesteld ten aanzien van de in [artikel 3, tweede lid, onder g, i en j][ref1], genoemde onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0007603#Artikel3
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007603
        artikel: '3'
  - number: '2.5'
    text: |-
      Het is verboden cosmetische producten te verhandelen indien met betrekking tot de ingrediënten, combinaties van
      ingrediënten of de eindsamenstelling van deze producten dierproeven zijn verricht, voorzover die dierproeven zijn
      verricht in het belang van de eisen gesteld bij of krachtens dit besluit.
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel2
  - number: '2.6'
    text: |-
      In afwijking van het vijfde lid is het toegestaan cosmetische producten te verhandelen ten behoeve waarvan
      ingrediënten, combinaties van ingrediënten of de eindsamenstelling van deze producten in verband met toxiciteit bij
      herhaalde toediening, toxiciteit met betrekking tot de voortplanting en toxicokinetiek, zijn beproefd voor zover
      geen andere methode wordt gebruikt dan een door Onze Minister voor die beproeving aangewezen alternatieve methode,
      vanaf het tijdstip dat deze alternatieve methode is aangewezen.
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel2
  - number: '2.7'
    text: Onze Minister stelt nadere regels over welke methode als alternatieve methode wordt aangemerkt.
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel2
  - number: '3.1'
    text: |-
      Cosmetische producten mogen de gezondheid van de mens niet schaden wanneer zij onder normale of redelijkerwijze te
      voorziene gebruiksvoorwaarden worden aangewend.
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel3
  - number: '3.2'
    text: 'Onze Minister kan met het oog op het eerste lid nadere regels stellen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel3
  - number: 3.2.a
    text: een indicatieve opsomming van groepen van cosmetische producten;
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel3
  - number: 3.2.b
    text: stoffen die niet in cosmetische producten mogen voorkomen;
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel3
  - number: 3.2.c
    text: |-
      stoffen die al dan niet onder bepaalde voorwaarden, zoals toepassingsgebied, maximale concentratie, het plaatsen
      van gebruiksvoorwaarden en waarschuwingsteksten, in cosmetische producten mogen voorkomen;
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel3
  - number: 3.2.d
    text: toegelaten stoffen van bepaalde groepen grondstoffen, zoals kleurstoffen, conserveermiddelen, UV-filters;
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel3
  - number: 3.2.e
    text: eisen voor de chemische zuiverheid van de grondstoffen voor cosmetische producten;
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel3
  - number: 3.2.f
    text: eisen voor de microbiologische gesteldheid van cosmetische producten;
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel3
  - number: 3.2.g
    text: chemische en biologische methoden van onderzoek;
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel3
  - number: 3.2.h
    text: een indicatieve inventaris van cosmetische ingrediënten;
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel3
  - number: 3.2.i
    text: de geheimhouding van te vermelden ingrediënten;
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel3
  - number: 3.2.j
    text: de productiemethode volgens de goede productiepraktijken.
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel3
  - number: '4.1'
    text: |-
      Cosmetische producten aanwezig in een verpakking die bestemd of geschikt is om met de inhoud aan de verbruiker te
      worden afgeleverd, moeten zijn voorzien van:
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel4
  - number: 4.1.a
    text: |-
      een vermelding van de naam of de handelsnaam en het adres of de vestigingsplaats van de fabrikant, zijn
      gevolmachtigde, degene voor wiens rekening een cosmetisch product gefabriceerd is of degene die verantwoordelijk
      is voor het in de handel brengen van het cosmetisch product in Nederland, voor zover dit niet geschiedt vanuit
      een lidstaat van de Europese Unie dan wel de Europese Economische Ruimte, met dien verstande dat de vermelding mag
      worden afgekort voor zover de afkorting de identificatie van de onderneming mogelijk maakt;
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel4
  - number: 4.1.b
    text: |-
      een vermelding van het land van oorsprong indien het cosmetisch product buiten het grondgebied van de Europese Unie
      is vervaardigd;
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel4
  - number: 4.1.c
    text: |-
      een vermelding van de nominale hoeveelheid op het tijdstip van verpakking, aangegeven in gewicht of volume, tenzij
      er sprake is van verpakkingen die minder dan 5 gram of 5 milliliter bevatten, gratis monsters of verpakkingen
      voor eenmalig gebruik dan wel van voorverpakte cosmetische producten waarvoor details van gewicht of volume niet
      belangrijk zijn, die alvorens te worden verhandeld, per vast aantal stuks worden verpakt en waarvan het aantal
      stuks is vermeld op de verpakking waarin zij worden verhandeld dan wel zichtbaar in die verpakking is te bepalen;
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel4
  - number: 4.1.d
    text: |-
      een vermelding van de datum van minimale houdbaarheid in de volgorde maand, jaar of in de volgorde dag, maand, jaar
      en voorafgegaan door de woorden «bij voorkeur te gebruiken vóór eind ...» ofwel door een aanwijzing waar deze datum
      op de verpakking te vinden is;
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel4
  - number: 4.1.e
    text: |-
      een vermelding van de aanwijzingen omtrent het bewaren indien het tijdstip van minimale houdbaarheid afhankelijk is
      van een bijzondere wijze van bewaren;
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel4
  - number: 4.1.f
    text: een vermelding van het batch- of codenummer dat het mogelijk maakt de partij te identificeren;
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel4
  - number: 4.1.g
    text: |-
      een vermelding van gebruiksvoorwaarden en waarschuwingen die mede betrekking kunnen hebben op professioneel gebruik
      indien en voor zover deze ingevolge [artikel 3][ref1] zijn voorgeschreven;


      [ref1]: https://wetten.overheid.nl/BWBR0007603#Artikel3
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007603
        artikel: '3'
  - number: 4.1.h
    text: |-
      een vermelding van de functie van het cosmetisch product, behalve wanneer deze blijkt uit de aanbiedingsvorm van
      het cosmetisch product;
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel4
  - number: 4.1.i
    text: |-
      de lijst van ingrediënten in volgorde van afnemend gewicht op het tijdstip van de verwerking waarbij de lijst
      wordt voorafgegaan door het woord "ingrediënten"; mengsels van reuk- en smaakstoffen en grondstoffen daarvan
      worden aangegeven door het woord "parfum" of "aroma" en voor decoratieve cosmetische producten die in verschillende
      tinten op de markt worden gebracht, mogen alle in het gamma gebruikte kleurstoffen worden vermeld op voorwaarde
      dat de woorden "kan ... bevatten" of het symbool «+/–» worden toegevoegd. De aanwezigheid van stoffen waarvan
      de vermelding in de kolom «Andere beperkingen en eisen» in bijlage III van [richtlijn 76/768/EEG](31976L0768) is
      voorgeschreven, wordt in de lijst vermeld, ongeacht de functie van die stoffen in het product.
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel4
  - number: '4.2'
    text: |-
      De in het eerste lid bedoelde vermeldingen moeten duidelijk zichtbaar, gemakkelijk leesbaar en onuitwisbaar op de
      recipiënt en de verpakking zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel4
  - number: '4.3'
    text: |-
      In afwijking van het eerste lid, onderdeel *d*, mag de datum van minimale houdbaarheid worden vervangen door de
      vermelding van de plaats van de datum op de verpakkingseenheid waar deze voorkomt.
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel4
  - number: '4.4'
    text: |-
      In afwijking van het eerste lid, onderdeel d, wordt bij cosmetische producten die langer dan dertig maanden na
      verpakking nog houdbaar zijn, door middel van de bij dit besluit behorende [bijlage 1][ref1] opgenomen symbool
      gevolgd door de aanduiding van de periode in maand of jaar, aangegeven hoe lang het product na opening zonder enig
      risico door de consument kan worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0007603
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007603
  - number: '4.5'
    text: |-
      In afwijking van het eerste lid, onderdeel *i*, mogen ingrediënten waarvan de concentratie minder dan 1% bedraagt
      in willekeurige volgorde worden vermeld na de ingrediënten waarvan de concentratie meer dan 1% bedraagt, en
      mogen kleurstoffen na de overige ingrediënten, in willekeurige volgorde worden vermeld overeenkomstig het Colour
      Indexnummer of de kleuraanduiding.
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel4
  - number: '4.6'
    text: |-
      In afwijking van het eerste lid kunnen de in dat lid, onderdeel *i*, bedoelde vermeldingen achterwege blijven
      indien het betreft: - onzuiverheden van de gebruikte grondstoffen;
        - technische hulpstoffen die bij de bereiding worden gebruikt, maar niet meer in het cosmetisch product aanwezig
      zijn;
        - stoffen die in de absoluut noodzakelijke hoeveelheden worden gebruikt als oplosmiddel of als dragers van mengsels
      van reuk- en smaakstoffen.
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel4
  - number: '4.7'
    text: |-
      In afwijking van het tweede lid wordt de vermelding van het eerste lid, onderdeel *f*, bij een geringe afmeting van
      de recipiënt uitsluitend op de verpakking aangebracht.
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel4
  - number: '4.8'
    text: |-
      In afwijking van het tweede lid wordt de vermelding van het eerste lid, onderdeel *i*, ten minste op de verpakking
      aangebracht.
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel4
  - number: '4.9'
    text: |-
      In afwijking van het tweede en achtste lid worden de in het eerste lid, onderdelen *g* en *i*, bedoelde
      vermeldingen aangebracht op een bijsluiter, etiket, strook of kaart, gevoegd bij het cosmetisch eindproduct, indien
      het in de praktijk onmogelijk is deze vermeldingen voor wat betreft de in het eerste lid, onderdeel *g*, bedoelde
      vermeldingen op de recipiënt en de verpakking en voor wat betreft de in het eerste lid, onderdeel *i*, bedoelde
      vermeldingen op de verpakking aan te brengen; de consument wordt door middel van een verkorte aanduiding of het
      in [bijlage 2][ref1] bij dit besluit aangegeven symbool op de recipiënt en de verpakking verwezen naar dit etiket,
      deze bijsluiter, strook of kaart voor de in acht te nemen gebruiksvoorschriften en waarschuwingen onderscheidenlijk
      de te vermelden ingrediënten.


      [ref1]: https://wetten.overheid.nl/BWBR0007603
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007603
  - number: '4.10'
    text: |-
      In afwijking van het negende lid worden de vermeldingen, bedoeld in het eerste lid, onderdeel *i*, vermeld op een
      mededeling in de onmiddellijke nabijheid van de verpakking waarin het cosmetische product te koop wordt aangeboden,
      indien het in het geval van zeep en badparels of andere kleine producten, vanwege vorm of omvang ondoenlijk is deze
      vermeldingen aan te brengen op een etiket, strook of kaart, gevoegd bij het product, of op een bijsluiter.
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel4
  - number: '4.11'
    text: |-
      De vermeldingen, bedoeld in het eerste lid, onderdelen *c*, *d*, *e*, *g* en *h*, moeten in de Nederlandse taal
      worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel4
  - number: '4.12'
    text: |-
      De ingrediënten, bedoeld in het eerste lid, onderdeel *i*, moeten worden aangeduid volgens de door de Commissie
      van de Europese Gemeenschappen vastgestelde nomenclatuur van ingrediënten of, indien deze ontbreekt, met de
      chemische benaming, de benaming van de Europese Farmacopee, de internationale triviale benaming van de Wereld
      Gezondheidsorganisatie, het Einecsnummer, de lupacnaam of het CAS- of Colour Index-nummer.
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel4
  - number: '4.13'
    text: |-
      De vermeldingen bedoeld in het eerste lid, onderdelen *a*, *d*, *e*, *f*, *h* en *i*, worden bij niet voorverpakte
      cosmetische producten of bij cosmetische producten die op de plaats van verkoop op verzoek van de koper worden
      verpakt of worden voorverpakt met het oog op de onmiddellijke verkoop ervan, aangebracht op een mededeling in
      de onmiddellijke nabijheid van het te koop aangeboden product dan wel op een informatieblad of folder die aan de
      koper wordt meegegeven; bij een vermelding als bedoeld in het eerste lid, onderdeel *g*, welke uitsluitend wordt
      aangebracht op een informatieblad of folder die aan de koper wordt meegegeven, worden de vermeldingen bedoeld in
      het eerste lid, onderdelen *a*, *d*, *e*, *f*, *h*, en *i*, eveneens uitsluitend op eerdergenoemd informatieblad of
      folder aangebracht.
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel4
  - number: '5'
    text: |-
      De fabrikant, zijn gevolmachtigde, degene voor wiens rekening een cosmetisch product gefabriceerd is of degene
      die verantwoordelijk is voor het in de handel brengen van het cosmetisch product in Nederland, voor zover dit
      niet geschiedt vanuit een lidstaat van de Europese Unie dan wel de Europese Economische Ruimte, vermeldt alleen
      dan dat het product niet op dieren is getest, indien de fabrikant en zijn leveranciers geen dierproeven hebben
      uitgevoerd of laten uitvoeren met het cosmetisch product in de eindsamenstelling waarin het wordt verhandeld
      en ter beschikking van de consument wordt gesteld, het prototype daarvan of enig ingrediënt daarvan, en evenmin
      ingrediënten hebben aangewend die door anderen op dieren zijn getest met het doel nieuwe cosmetische producten
      te ontwikkelen.
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel5
  - number: '6.1'
    text: |-
      De fabrikant, zijn gevolmachtigde, degene voor wiens rekening een cosmetisch product gefabriceerd is of degene
      die verantwoordelijk is voor het in de handel brengen van het cosmetisch product in Nederland, voor zover dit
      niet geschiedt vanuit een lidstaat van de Europese Unie dan wel de Europese Economische Ruimte, houdt op het in
      [artikel 4, eerste lid, onderdeel a][ref1], genoemde adres de volgende gegevens ter gerede beschikking van de in
      [artikel 25 van de Warenwet][ref2] bedoelde ambtenaren:


      [ref1]: https://wetten.overheid.nl/BWBR0007603#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001969#Artikel25
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007603
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0001969
        artikel: '25'
  - number: 6.1.a
    text: de kwalitatieve en kwantitatieve samenstelling van het product;
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel6
  - number: 6.1.b
    text: |-
      de fysisch-chemische en microbiologische specificaties van de grondstoffen en van het cosmetisch product en de
      eisen inzake zuiverheid en microbiologische controle van de cosmetische producten;
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel6
  - number: 6.1.c
    text: |-
      de beoordeling van de veiligheid van het cosmetisch product voor de gezondheid van de mens waarbij de fabrikant
      rekening houdt met het algemene toxicologische profiel, de chemische structuur en het blootstellingsniveau van
      de ingrediënten. Hij houdt hierbij rekening met de specifieke blootstellingskenmerken van de plaatsen waarop het
      product zal worden aangebracht of met die van de doelgroep. Hij verricht ten minste een specifieke beoordeling van
      cosmetische producten die bestemd zijn voor kinderen beneden de leeftijd van drie jaar, en cosmetische producten
      die uitsluitend bestemd zijn voor uitwendige intieme hygiëne;
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel6
  - number: 6.1.d
    text: |-
      naam en adres van de personen die over een diploma beschikken van een gereglementeerd beroep als bedoeld in
      [artikel 1 van de Algemene wet erkenning EG-beroepsopleidingen][ref1] in de farmacie, toxicologie, dermatologie,
      geneeskunde, biologie, scheikunde en die verantwoordelijk zijn voor de beoordeling, bedoeld in onderdeel c;


      [ref1]: https://wetten.overheid.nl/BWBR0006781#Artikel1
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006781
        artikel: '1'
  - number: 6.1.e
    text: de bestaande gegevens inzake de voor de gezondheid van de mens ongewenste bijwerkingen van het cosmetisch product;
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel6
  - number: 6.1.f
    text: |-
      bewijzen van de werking waarop voor het cosmetisch product aanspraak wordt gemaakt wanneer de aard van de werking
      of het cosmetisch product zulks rechtvaardigt;
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel6
  - number: 6.1.g
    text: |-
      gegevens over eventuele dierproeven die door de fabrikant, zijn gevolmachtigde, degene voor wiens rekening
      een cosmetisch product gefabriceerd is of degene die verantwoordelijk is voor het in de handel brengen van het
      cosmetisch product in Nederland, voor zover dit niet geschiedt vanuit een lidstaat van de Europese Unie dan
      wel de Europese Economische Ruimte, zijn verricht betreffende de ontwikkeling of veiligheidsbeoordeling van het
      product of de ingrediënten daarvan, met inbegrip van eventuele dierproeven die zijn verricht om te voldoen aan de
      voorschriften van niet-lidstaten van de Europese Unie dan wel de Europese Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel6
  - number: 6.1.h
    text: gegevens over de productiemethode volgens goede productiepraktijken.
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel6
  - number: '6.2'
    text: |-
      De in het eerste lid, onderdeel c, bedoelde beoordeling wordt uitgevoerd overeenkomstig de beginselen van goede
      laboratoriumpraktijken als vastgesteld bij [richtlijn nr. 2004/10/EG](32004L0010) van het Europees Parlement en de
      Raad van 11 februari 2004 betreffende de onderlinge aanpassing van de wettelijke en bestuursrechtelijke bepalingen
      inzake de toepassing van de beginselen van goede laboratoriumpraktijken en het toezicht op de toepassing ervan voor
      tests op chemische stoffen (gecodificeerde versie) (PbEU L 50).
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel6
  - number: '6.3'
    text: |-
      Een wijziging van de in het tweede lid genoemde richtlijn, gaat voor de toepassing van het in dat lid bepaalde,
      gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel6
  - number: '6.4'
    text: De in het eerste lid bedoelde gegevens moeten beschikbaar zijn in de Nederlandse, Engelse, Duitse of Franse taal.
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel6
  - number: '6.5'
    text: |-
      De fabrikant, zijn gevolmachtigde, degene voor wiens rekening een cosmetisch product gefabriceerd is of
      degene die verantwoordelijk is voor het in de handel brengen van het cosmetisch product in Nederland, voor
      zover dit voor de eerste maal geschiedt binnen het grondgebied waarop het Verdrag betreffende de Europese
      Unie dan wel de Overeenkomst betreffende de Europese Economische Ruimte van toepassing is, stelt de in
      [artikel 25 van de Warenwet][ref1] bedoelde ambtenaren in kennis van het adres van de plaatsen van productie of van
      eerste invoer in Nederland, alvorens deze producten worden verhandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel25
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '25'
  - number: '6.6'
    text: |-
      In afwijking van het eerste lid, onderdeel a, worden voor het mengsel van reukstoffen en parfums deze gegevens
      beperkt tot de benaming en het codenummer van het mengsel alsmede de identiteit van de leverancier.
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel6
  - number: '6.7'
    text: |-
      In afwijking van het eerste lid, onderdeel c, kan de fabrikant ingeval eenzelfde product op verschillende plaatsen
      in de Europese Unie wordt geproduceerd, één enkele plaats van productie kiezen waar de in het eerste lid, onderdeel
      c, bedoelde gegevens ter beschikking worden gehouden. Hij deelt de gekozen plaats mede wanneer hem dit in het kader
      van controles wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel6
  - number: '6.8'
    text: |-
      Onverminderd de intellectuele eigendomsrechten en het handelsgeheim verstrekt de fabrikant, zijn gevolmachtigde,
      degene voor wiens rekening een cosmetisch product gefabriceerd is of degene die verantwoordelijk is voor het in de
      handel brengen van het cosmetisch product in Nederland, voor zover dit niet geschiedt vanuit een lidstaat van de
      Europese Unie dan wel de Europese Economische Ruimte:
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel6
  - number: 6.8.a
    text: |-
      informatie als bedoeld in het eerste lid, onderdeel a, met betrekking tot de kwalitatieve samenstelling van het
      product, en onderdeel e;
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel6
  - number: 6.8.b
    text: |-
      informatie als bedoeld in het eerste lid, onderdeel a, met betrekking tot de kwantitatieve samenstelling van het
      product voor zover het stoffen betreft waarvoor de criteria van een of meer van de volgende gevarenklassen of
      categorieën van bijlage I bij verordening (EG) nr. 1272/2008 van het Europees Parlement en de Raad van de Europese
      Unie van 16 december 2008 betreffende de indeling, etikettering en verpakking van stoffen en mengsels tot wijziging
      en intrekking van de Richtlijnen 67/548/EEG en 1999/45/EG en tot wijziging van Verordening (EG) nr. 1907/2006 (PbEU
      L 353) vervuld zijn:.
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel6
  - number: 6.8.b.1
    text: |-
      de gevarenklassen 2.1 tot en met 2.4, 2.6 en 2.7, 2.8 typen A en B, 2.9, 2.10, 2.12, 2.13 categorieën 1 en 2, 2.14
      categorieën 1 en 2, en 2.15 typen A tot en met F;
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel6
  - number: 6.8.b.2
    text: |-
      de gevarenklassen 3.1 tot en met 3.6, 3.7 schadelijke effecten op de seksuele functie en de vruchtbaarheid of de
      ontwikkeling, 3.8 andere effecten dan een narcotische werking, 3.9 en 3.10;
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel6
  - number: 6.8.b.3
    text: de gevarenklasse 4.1;
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel6
  - number: 6.8.b.4
    text: de gevarenklasse 5.1.
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel6
  - number: '6.9'
    text: |-
      Onze Minister stelt in overeenstemming met Onze Minister van Economische Zaken, Landbouw en Innovatie nadere regels
      ten behoeve van de informatieverstrekking, bedoeld in het achtste lid.
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel6
  - number: 6a
    text: |-
      Een wijziging van [richtlijn 67/548/EEG](31967L0548) en bijlage III van [richtlijn 76/768/EEG](31976L0768), gaat
      voor toepassing van respectievelijk [artikel 6, achtste lid][ref1] en [artikel 4, eerste lid, onderdeel i][ref2],
      gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij
      ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007603#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007603#Artikel4
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0007603
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0007603
        artikel: '4'
  - number: 6b
    text: |-
      Het is verboden te handelen in strijd met artikel 16, derde lid, tweede alinea, van verordening (EG) nr. 1223/2009
      van het Europees Parlement en de Raad van de Europese Unie van 30 november 2009 betreffende cosmetische producten
      (PbEU L 342).
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel6b
  - number: '7.1'
    text: Het [Cosmeticabesluit (Warenwet) 1979](onbekend) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel7
  - number: '7.2'
    text: |-
      Na de inwerkingtreding van dit besluit berust de Stoffenregeling Cosmetica op [artikel 3, tweede lid][ref1], van
      dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0007603#Artikel3
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007603
        artikel: '3'
  - number: '8.1'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel8
  - number: '8.2'
    text: |-
      In afwijking van het eerste lid treden de [artikelen 4, eerste lid, onderdelen ][ref1], wat betreft onderdeel *h*,
      twaalfde en dertiende lid, 5 en 6 op 1 januari 1997 in werking met dien verstande dat de cosmetische producten
      welke voor 1 januari 1997 zijn geproduceerd, tot en met 31 december 1997 mogen worden verhandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0007603#Artikel4
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007603
        artikel: '4'
  - number: '9'
    text: 'Dit besluit wordt aangehaald als: Warenwetbesluit cosmetische producten.'
    url: https://wetten.overheid.nl/BWBR0007603/2013-01-11#Artikel9
