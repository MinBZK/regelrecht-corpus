  - number: '25.1'
    text: |-
      De beschrijving van de financiële opzet, bedoeld in [artikel 24, onderdeel h][ref1], bevat in ieder geval een
      beschrijving van de wijze waarop wordt voldaan aan de vereisten ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel24
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: '24'
        paragraaf: '9'
  - number: 25.1.a
    text: |-
      de technische voorzieningen, het minimaal vereist eigen vermogen en het vereist eigen vermogen, bedoeld in de
      [artikelen 126][ref1], [131][ref2] en [132 van de Pensioenwet][ref3] of de [artikelen 121][ref4], [126][ref5] en
      [127 van de Wet verplichte beroepspensioenregeling][ref6];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel126
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel131
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel132
