      - id: ref3
        bwb_id: BWBR0018831
        artikel: '130'
      - id: ref4
        bwb_id: BWBR0018831
        artikel: '131'
  - number: 25.1.d
    text: |-
      het beleid inzake voorwaardelijke toeslagverlening, bedoeld in [artikel 137 van de Pensioenwet][ref1] dan wel
      [artikel 132 van de Wet verplichte beroepspensioenregeling][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel137
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel132
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel25
