    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel24
  - number: 24.j
    text: |-
      de systematiek van de vaststelling van de parameters, zoals die op grond van [artikel 144 van de Pensioenwet][ref1]
      en [artikel 139 van de Wet verplichte beroepspensioenregeling][ref2] worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel144
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel139
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel24
