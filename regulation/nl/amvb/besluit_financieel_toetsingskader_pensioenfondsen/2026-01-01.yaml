                    1
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel23a
  - number: 23b
    text: |-
      Fondsen gebruiken voor uitvoering van een scenario-analyse een uniforme set met 10.000 economische scenario’s die
      door De Nederlandsche Bank beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel23b
  - number: '24'
    text: |-
      De actuariële en bedrijfstechnische nota, bedoeld in [artikel 145 van de Pensioenwet][ref1] of
      [artikel 140 van de Wet verplichte beroepspensioenregeling][ref2], bevat in ieder geval een beschrijving van:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel145
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel140
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '145'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '140'
  - number: 24.a
    text: |-
      de hoofdlijnen van het interne beheersingssysteem, zoals voorgeschreven bij of krachtens
      [artikel 143 van de Pensioenwet][ref1] of [artikel 138 van de Wet verplichte beroepspensioenregeling][ref2], en van
      de opzet van de administratieve organisatie en interne controle, bedoeld in [artikel 18, eerste lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel143
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel138
      [ref3]: https://wetten.overheid.nl/BWBR0020871#Artikel18
