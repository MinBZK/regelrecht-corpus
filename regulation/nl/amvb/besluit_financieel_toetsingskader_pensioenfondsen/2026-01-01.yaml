  - number: 24.b
    text: |-
      voor zover van toepassing procedures en criteria voor de aansluiting van werkgevers bij het betreffende fonds en
      voor het verkrijgen van het deelnemerschap van hun werknemers;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel24
  - number: 24.c
    text: de hoofdlijnen van de uitvoeringsovereenkomst dan wel het uitvoeringsreglement;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel24
  - number: 24.d
    text: |-
      de hoofdlijnen van de reeds verworven en nog te verwerven pensioenaanspraken en -rechten die voor de deelnemers,
      gewezen deelnemers, pensioengerechtigden of andere aanspraakgerechtigden voortvloeien uit het pensioenreglement;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel24
  - number: 24.e
    text: |-
      de uit het pensioenreglement en de uitvoeringsovereenkomst dan wel het uitvoeringsreglement voortvloeiende risico’s
      die in eigen beheer zijn gehouden dan wel zijn verzekerd of overgedragen;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel24
  - number: 24.f
    text: de risicohouding;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel24
  - number: 24.g
    text: de kwantitatieve normen die gehanteerd worden ten behoeve van de haalbaarheidstoets;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel24
  - number: 24.h
    text: de financiële opzet;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel24
  - number: 24.i
