  - number: '25.2'
    text: |-
      Bij de beschrijving, bedoeld in het eerste lid, wordt rekening gehouden met de overige verplichtingen van het
      fonds.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel25
  - number: '25.3'
    text: |-
      De beschrijving van de financiële opzet bevat tevens een beschrijving van de organisatiestructuur met betrekking
      tot het bepalen en uitvoeren van het beleggingsbeleid, bedoeld in [artikel 18, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel18
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: '18'
        paragraaf: '8'
  - number: '26'
    text: |-
      De beschrijving van de financiële sturingsmiddelen, bedoeld in [artikel 24, onderdeel i][ref1], bevat in ieder
      geval een beschrijving van de inzetbaarheid van de sturingsmogelijkheden van het fonds ten aanzien van het
      premiebeleid, het beleggingsbeleid en het beleid met betrekking tot de aanpassingen van de aanspraken en inzake
      voorwaardelijke toeslagverlening. Daarbij wordt aangegeven welke effecten met de genoemde sturingsmiddelen worden
      bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel24
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: '24'
        paragraaf: '9'
  - number: '27'
    text: |-
      De beschrijving van het beleggingsbeleid, bedoeld in [artikel 25, eerste lid, onderdeel c][ref1], bevat in ieder
      geval een beschrijving van:


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel25
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: '25'
        paragraaf: '9'
  - number: 27.a
    text: het strategisch beleggingsbeleid en het beleggingsplan;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel27
  - number: 27.b
    text: de cyclus voor het beleggingsbeleid;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel27
  - number: 27.c
    text: de opzet van de uitvoering van de vermogensbeheeractiviteiten;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel27
  - number: 27.d
    text: de wijze van risicometing en -beheersing, met name van marktrisico’s en kredietrisico’s; en
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel27
  - number: 27.e
    text: de opzet van de resultaatsevaluatie met betrekking tot de onderwerpen genoemd onder a, c en d.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel27
  - number: '28'
    text: |-
      Voor zover risico’s zijn overgedragen of verzekerd kunnen de beschrijvingen, bedoeld in de [artikelen 25][ref1]
      en [27][ref2], beperkt blijven tot een verwijzing naar hetgeen in de ten behoeve van de overdracht of verzekering
      afgesloten overeenkomsten is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0020871#Artikel27
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: '25'
        paragraaf: '9'
      - id: ref2
        bwb_id: BWBR0020871
        artikel: '27'
        paragraaf: '9'
  - number: '29'
    text: |-
      De beschrijvingen die de actuariële en bedrijfstechnische nota bevat op grond van de
      [artikelen 24 tot en met 28][ref1] zijn zodanig dat De Nederlandsche Bank op basis van die beschrijvingen tot
      een oordeel kan komen over de wijze waarop voldaan wordt aan [artikel 25][ref2] en de financieel normerende
      artikelen binnen de [Pensioenwet][ref3] of [artikel 35][ref4] en de financieel normerende artikelen van de
      [Wet verplichte beroepspensioenregeling][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0020871#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0020809
      [ref4]: https://wetten.overheid.nl/BWBR0020871#Artikel35
      [ref5]: https://wetten.overheid.nl/BWBR0018831
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: '24'
        paragraaf: '9'
      - id: ref2
        bwb_id: BWBR0020871
        artikel: '25'
        paragraaf: '9'
      - id: ref3
        bwb_id: BWBR0020809
      - id: ref4
        bwb_id: BWBR0020871
        artikel: '35'
        paragraaf: '11'
      - id: ref5
        bwb_id: BWBR0018831
  - number: 29a
    text: |-
      De verklaring inzake beleggingsbeginselen, bedoeld in [artikel 145, eerste lid, van de Pensioenwet][ref1] dan wel
      [artikel 140, eerste lid, van de Wet verplichte beroepspensioenregeling][ref2], omvat in ieder geval onderwerpen
      als de strategische allocatie van activa in het licht van de aard en de looptijd van de pensioenverplichtingen,
      de toegepaste wegingmethoden voor beleggingsrisico’s, de risicohouding, het gevoerde risicoprofiel, de
      risicobeheerprocedures en de wijze waarop in het beleggingsbeleid rekening wordt gehouden met milieu en klimaat,
      mensenrechten en sociale verhoudingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel145
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel140
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '145'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '140'
  - number: 29b
    text: |-
      Een financieel crisisplan als bedoeld in [artikel 145, tweede lid, van de Pensioenwet][ref1] dan wel
      [artikel 140, tweede lid, van de Wet verplichte beroepspensioenregeling][ref2] omvat in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel145
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel140
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel29b
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '145'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '140'
  - number: 29b.a
    text: |-
      een beschrijving van een of meer financiële situaties waarin het fonds niet aan de vereisten van het vereist eigen
      vermogen voldoet en gevaar loopt niet aan de vereisten van het minimaal vereist vermogen te gaan voldoen;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel29b
  - number: 29b.b
    text: |-
      een beschrijving van een of meer risico’s die naar het oordeel van het fonds kunnen leiden tot situaties die als
      financiële crisissituatie kunnen worden aangemerkt;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel29b
  - number: 29b.c
    text: |-
      een beschrijving van de maatregelen die het fonds ter beschikking staan ter bestrijding van situaties
      als bedoeld in onderdeel a en [artikel 145, tweede lid, onderdeel a, van de Pensioenwet][ref1] dan wel
      [artikel 140, tweede lid, onderdeel a, van de Wet verplichte beroepspensioenregeling][ref2], waarbij wordt
      beschreven hoe het fonds deze maatregelen verwacht in te zetten;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel145
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel140
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel29b
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '145'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '140'
  - number: 29b.d
    text: een indicatie van het financiële effect van de inzet van de ter beschikking staande maatregelen;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel29b
  - number: 29b.e
    text: |-
      de berekening van het niveau van de beleidsdekkingsgraad vanaf welke naar verwachting vermindering van
      pensioenaanspraken en pensioenrechten nodig zijn om te voldoen aan de vereisten ten aanzien van het vereist eigen
      vermogen; en
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel29b
  - number: 29b.f
    text: |-
      een beschrijving van de wijze waarop bij het inzetten van maatregelen op evenwichtige wijze rekening wordt
      gehouden met de belangen van de belanghebbenden van het fonds, waarbij wordt opgenomen hoe een vermindering van
      pensioenaanspraken en pensioenrechten zal worden verdeeld en of, en zo ja hoe, deze zal worden gespreid.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel29b
  - number: '30.1'
    text: |-
      De staten en de door een fonds op grond van [artikel 203, derde en vierde lid, van de Pensioenwet][ref1] dan wel
      [artikel 197, derde en vierde lid, van de Wet verplichte beroepspensioenregeling][ref2] te verstrekken gegevens
      hebben betrekking op:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel203
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel197
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '203'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '197'
  - number: 30.1.a
    text: 'het fonds en zijn organisatie met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.1.a.1°
    text: het aantal medewerkers;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.1.a.2°
    text: uitbesteding;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.1.a.3°
    text: de medebeleidsbepalers;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.1.a.4°
    text: deskundigheidsbevordering van het bestuur;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.1.a.5°
    text: |-
      de persoongegevens van de accountant, bedoeld in [artikel 147, vijfde lid, van de Pensioenwet][ref1]
      en [artikel 142, vijfde lid, van de Wet verplichte beroepspensioenregeling][ref2],
      de actuaris bedoeld in [artikel 147, vierde lid, van de Pensioenwet][ref3] en
      [artikel 142, vierde lid, van de Wet verplichte beroepspensioenregeling][ref4] en de adviserende actuaris;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel147
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel142
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel147
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel142
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '147'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '142'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '147'
      - id: ref4
        bwb_id: BWBR0018831
        artikel: '142'
  - number: 30.1.a.6°
    text: de accountantsverklaring;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.1.a.7°
    text: het verantwoordingsorgaan;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.1.a.8°
    text: het interne toezicht;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.1.a.9°
    text: het belanghebbendenorgaan; en
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.1.a.10°
    text: het bestuursmodel;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.1.b
    text: een bestuursverslag;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.1.c
    text: |-
      de balans, bestaande uit een enkelvoudige balans en, indien van toepassing, een geconsolideerde balans, een
      toelichting op de balans alsmede:
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.1.c.1°
    text: |-
      een specificatie van de activa met betrekking tot immateriële activa, onroerende zaken, niet geconsolideerde en
      geconsolideerde deelnemingen, indien van toepassing, verzekeringsdeel technische voorzieningen, overige activa en
      beleggingen voor risico deelnemers;
