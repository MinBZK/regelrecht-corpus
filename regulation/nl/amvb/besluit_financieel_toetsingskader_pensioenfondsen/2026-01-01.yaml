  - number: 36a
    text: |-
      Het Besluit financieel toetsingskader pensioenfondsen, zoals dat luidde op de dag voor het tijdstip van
      inwerkingtreding van het [Besluit toekomst pensioenen][ref1] of het Besluit van 22 juni 2023 tot wijziging
      van het Besluit financieel toetsingskader pensioenfondsen en het Besluit uitvoering Pensioenwet en Wet
      verplichte beroepspensioenregeling vanwege vaststelling van de parameters vanaf inwerkingtreding van de
      Wet toekomst pensioenen (Stb. 2023, 219), blijft van toepassing tot het tijdstip dat de pensioenuitvoerder
      overgaat op uitvoering van een gewijzigde pensioenovereenkomst dan wel beroepspensioenregeling, maar uiterlijk
      tot en met 31 december 2027. In afwijking van de vorige zin zijn vanaf het tijdstip van inwerkingtreding
      van [artikel II, onderdelen E, G, K en L van het Besluit toekomst pensioenen][ref2] of het tijdstip van
      inwerkingtreding van artikel I van het Besluit van 22 juni 2023 tot wijziging van het Besluit financieel
      toetsingskader pensioenfondsen en het Besluit uitvoering Pensioenwet en Wet verplichte beroepspensioenregeling
      vanwege vaststelling van de parameters vanaf inwerkingtreding van de Wet toekomst pensioenen van toepassing:
      het verval van de [artikelen 15c][ref3] en [23][ref4], en de [artikelen 23a][ref5], [23b][ref6], [36][ref7],
      [36a][ref8] en [36b][ref9].


