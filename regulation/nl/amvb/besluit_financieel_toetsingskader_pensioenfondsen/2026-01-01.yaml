        artikel: '127'
  - number: 25.1.b
    text: het premiebeleid;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel25
  - number: 25.1.c
    text: |-
      het beleggingsbeleid en het aangaan van leningen, bedoeld in de [artikelen 135][ref1]
      en [136 van de Pensioenwet][ref2] of de [artikelen 130][ref3] en
      [131 van de Wet verplichte beroepspensioenregeling][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel135
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel136
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel130
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel131
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel25
    references:
