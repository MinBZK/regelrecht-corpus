    text: |-
      het beleid waarin invulling wordt gegeven aan het projectierendement of de vaste daling, bedoeld in
      [artikel 63a van de Pensioenwet][ref1] of [artikel 75a van de Wet verplichte beroepspensioenregeling][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel63a
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel75a
