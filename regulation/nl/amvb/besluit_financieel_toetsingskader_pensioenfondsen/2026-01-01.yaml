  - number: 36b
    text: |-
      Een fonds dat voor het tijdstip van inwerkingtreding van het Besluit van 22 juni 2023 tot wijziging
      van het Besluit financieel toetsingskader pensioenfondsen en het Besluit uitvoering Pensioenwet en
      Wet verplichte beroepspensioenregeling vanwege vaststelling van de parameters vanaf inwerkingtreding
      van de Wet toekomst pensioenen (Stb. 2023, 219) het rendement op vastrentende waarden, bedoeld in
      [artikel 23a, eerste lid, onderdelen f en g][ref1], heeft vastgezet voor een periode van vijf jaar
      op basis van de actuele marktrente bij aanvang van deze periode kan eenmalig, in afwijking van
      [artikel 4, derde lid, onderdeel b][ref2], zoals dat luidde op de dag voor het tijdstip van inwerkingtreding
      van het [Besluit toekomst pensioenen][ref3], voor de premievaststelling vanaf het jaar 2024 het rendement op
      vastrentende waarden opnieuw vastzetten voor een periode van vijf jaar op basis van de actuele marktrente bij
      aanvang van deze periode.


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel23a
      [ref2]: https://wetten.overheid.nl/BWBR0020871#Artikel4
