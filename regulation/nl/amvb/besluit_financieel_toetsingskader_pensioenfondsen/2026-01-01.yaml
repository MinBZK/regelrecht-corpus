      [ref5]: https://wetten.overheid.nl/BWBR0018831#Artikel126
      [ref6]: https://wetten.overheid.nl/BWBR0018831#Artikel127
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel25
