  - number: 30.1.i.1°
    text: de leeftijdsopbouw en de technische voorzieningen; en
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.1.i.2°
    text: de geografische spreiding van deelnemers en premies;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.1.j
    text: 'de door het fonds uitgevoerde pensioenregeling met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.1.j.1°
    text: de kenmerken van de pensioenregeling; en
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.1.j.2°
    text: het aantal deelnemers;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.1.k
    text: specificatie van premiegegevens, tenzij sprake is van een gesloten fonds;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.1.l
    text: 'verzekering, met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.1.l.1°
    text: garantiecontracten;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.1.l.2°
    text: risicoverzekering; en
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.1.l.3°
    text: kapitaalcontracten.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.1.m
    text: verplichtingen van het fonds voor risico van de deelnemers;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.1.n
    text: informatie over een herstelplan of overbruggingsplan;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.1.o
    text: informatie over de haalbaarheidstoets;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.1.p
    text: informatie over toeslagverlening;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.1.q
    text: informatie over vermindering van pensioenaanspraken en pensioenrechten en pensioenvermogens of kapitalen;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.1.r
    text: |-
      uitvoering van een inkoopregeling als bedoeld in het
      [Uitvoeringsbesluit pensioenaspecten Sociaal Akkoord 2004][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018605
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0018605
  - number: 30.1.s
    text: |-
      een besluit tot wijziging van een pensioenregeling in de verslagperiode met betrekking tot de kenmerken van de
      pensioenregeling;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.1.t
    text: informatie over de risicohouding;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.1.u
    text: |-
      informatie over het projectierendement of de vaste daling voor de vaststelling van de hoogte van het pensioen in de
      uitkeringsfase en de spreidingstermijn;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.1.v
