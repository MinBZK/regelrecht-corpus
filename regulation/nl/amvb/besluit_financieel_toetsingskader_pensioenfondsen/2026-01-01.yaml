  - number: '36.3'
    text: |-
      Voor de toepassing van het tweede lid wordt een aanpassing van het strategisch beleggingsbeleid op grond van
      [artikel 47, vijfde lid, van het Besluit uitvoering Pensioenwet en Wet verplichte beroepspensioenregeling][ref1]
      aangemerkt als aanpassing op grond van het tweede lid.


