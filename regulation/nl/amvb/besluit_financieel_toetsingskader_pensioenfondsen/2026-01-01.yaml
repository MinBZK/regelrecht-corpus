---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_financieel_toetsingskader_pensioenfondsen
regulatory_layer: AMVB
publication_date: '2025-12-10'
valid_from: '2026-01-01'
bwb_id: BWBR0020871
url: https://wetten.overheid.nl/BWBR0020871/2026-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 24 oktober 2006, Directie
    Arbeidsverhoudingen, nr. AV/PB/2006/84673;

    Gelet op de artikelen 116, tweede lid, 126, derde lid, 128, derde lid, 131, tweede lid, 132, derde lid, 135, tweede
    lid, 136, tweede lid, 137, tweede lid, 138, zesde lid, 140, vijfde lid, 141, derde lid, 143, tweede lid, 144,
    vierde lid, 145, tweede lid, 147, zesde lid, en 203, vierde lid van de Pensioenwet en de artikelen 114, tweede lid,
    121, derde lid, 123, derde lid, 126, tweede lid, 127, derde lid, 130, tweede lid, 131, tweede lid, 132, tweede lid,
    133, zesde lid, 135, vijfde lid, 136, derde lid, 138, tweede lid, 139, vierde lid, 140, tweede lid, 142, zesde lid,
    en 197, vierde lid, van de Wet verplichte beroepspensioenregeling;

    De Raad van State gehoord (advies van 16 november 2006, nr. W1206.0450/IV);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid van 13 december 2006, Directie
    Arbeidsverhoudingen, nr. AV/PB/2006/101170A:

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel1
  - number: 1.a
    text: 'De Nederlandsche Bank: De Nederlandsche Bank N.V.;'
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel1
  - number: 1.b
    text: 'fonds:'
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel1
  - number: 1.b.1°
    text: |-
      pensioenfonds als bedoeld in [artikel 1 van de Pensioenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
  - number: 1.b.2°
    text: |-
      beroepspensioenfonds als bedoeld in [artikel 1 van de Wet verplichte beroepspensioenregeling][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel1
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '1'
  - number: 1b
    text: |-
      Voor zover het vermogen van een fonds een afgescheiden vermogen bij een algemeen pensioenfonds wordt, is ten
      aanzien van dit afgescheiden vermogen sprake van voortzetting van de toepassing van het financieel toetsingskader
      zoals dit bij het fonds werd toegepast.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel1b
  - number: '2.1'
    text: |-
      Het bestuur van een fonds stelt de hoogte van de technische voorzieningen vast op basis van de contante
      waarde van de verwachte uitgaande kasstromen die voortvloeien uit de tot de datum van vaststelling opgebouwde
      pensioenverplichtingen.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel2
  - number: '2.2'
    text: |-
      De contante waarde wordt vastgesteld op basis van een door De Nederlandsche Bank gepubliceerde actuele
      rentetermijnstructuur.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel2
  - number: '2.3'
    text: |-
      Een fonds stelt de omvang van de verwachte uitgaande kasstromen vast op basis van verwachte marktontwikkelingen
      en voor het fonds prudente verzekeringstechnische grondslagen waaronder begrepen de voorzienbare trend in
      overlevingskansen.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel2
  - number: '3.1'
    text: |-
      Een fonds dient ieder jaar vóór 1 juli de berekening van de technische voorzieningen per het einde van het
      voorafgaande jaar in bij De Nederlandsche Bank.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel3
  - number: '3.2'
    text: |-
      Onverminderd het eerste lid, dient een fonds desgevraagd een berekening van de technische voorzieningen in bij De
      Nederlandsche Bank indien De Nederlandsche Bank tekenen ontwaart van een ontwikkeling die het eigen vermogen, de
      liquiditeit of de bedrijfsvoering van het fonds in gevaar kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel3
  - number: '5.1'
    text: 'Het eigen vermogen van een fonds wordt met name gevormd door de volgende vermogensbestanddelen:'
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel5
  - number: 5.1.a
    text: het gestorte aandelenkapitaal of waarborgkapitaal vermeerderd met de ledenrekeningen;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel5
  - number: 5.1.b
    text: de reserves;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel5
  - number: 5.1.c
    text: het onverdeelde positieve of negatieve resultaat;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel5
  - number: 5.1.d
    text: het cumulatief preferent aandelenkapitaal;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel5
  - number: 5.1.e
    text: de achtergestelde leningen;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel5
  - number: 5.1.f
    text: de effecten met onbepaalde looptijd en andere vermogensinstrumenten; en
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel5
  - number: 5.1.g
    text: de helft van het obligo van het geplaatste kapitaal of van het in aandelen verdeeld waarborgkapitaal.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel5
  - number: '5.2'
    text: |-
      Het eigen vermogen van een fonds wordt verminderd met het bedrag van de eigen aandelen die rechtstreeks door het
      fonds worden gehouden en met het bedrag van de immateriële activa.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel5
  - number: '6'
    text: |-
      De vorming van eigen vermogen ten behoeve van toezeggingen die in de toekomst leiden tot een wijziging van de
      pensioenovereenkomst en als gevolg daarvan tot een toename van de pensioenverplichtingen, is een activiteit die
      verband houdt met pensioen en kan overeenkomstig [artikel 116 van de Pensioenwet][ref1] door een pensioenfonds
      worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel116
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '116'
  - number: '7.1'
    text: |-
      De ledenrekeningen, bedoeld in [artikel 5, eerste lid, onder a][ref1], worden alleen meegeteld als onderdeel van
      het eigen vermogen, wanneer de statuten bepalen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel5
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: '5'
        paragraaf: '4'
  - number: 7.1.a
    text: |-
      vanaf deze rekeningen alleen betalingen aan de leden plaatsvinden als daardoor het eigen vermogen niet daalt
      beneden het vereiste niveau, bedoeld in [artikel 11][ref1], dan wel bij liquidatie van het fonds, als alle andere
      schulden zijn voldaan;


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel11
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: '11'
        paragraaf: '4'
  - number: 7.1.b
    text: |-
      elke betaling vanaf deze ledenrekeningen voor andere doeleinden dan de individuele opzegging van het lidmaatschap
      niet eerder plaatsvindt dan nadat dertig dagen zijn verstreken na melding daarvan aan De Nederlandsche Bank; en
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel7
  - number: 7.1.c
    text: De Nederlandsche Bank kan besluiten dat een voorgenomen betaling niet mag plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel7
  - number: '7.2'
    text: |-
      De statutaire bepalingen met betrekking tot de ledenrekeningen worden niet gewijzigd dan nadat daarvoor toestemming
      van De Nederlandsche Bank is verkregen.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel7
  - number: '8.1'
    text: |-
      Het cumulatief preferent aandelenkapitaal en de achtergestelde leningen, bedoeld in
      [artikel 5, eerste lid, onder d en e][ref1], worden meegeteld tot een maximum van vijftig procent van het minimaal
      vereist eigen vermogen of van het eigen vermogen als dat lager is dan het minimaal vereist eigen vermogen, waarbij
      niet meer dan de helft van dat maximum in de vorm van achtergestelde leningen met vaste looptijd, of het cumulatief
      preferent aandelenkapitaal met vaste termijn, mits bindende overeenkomsten gelden op grond waarvan, in geval van
      liquidatie van het fonds, de achtergestelde leningen of preferente aandelen achtergesteld worden bij de vorderingen
      van alle andere crediteuren en pas worden terugbetaald als alle andere schulden zijn voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel5
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: '5'
        paragraaf: '4'
  - number: '8.2'
    text: |-
      Achtergestelde leningen als bedoeld in het eerste lid mogen meetellen tot een maximum van vijftig procent van het
      vereist eigen vermogen of van het eigen vermogen als dat lager is dan het vereist eigen vermogen.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel8
  - number: '8.3'
    text: De achtergestelde leningen worden meegeteld voor zover bedragen zijn gestort.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel8
  - number: '8.4'
    text: |-
      Achtergestelde leningen met een vaste looptijd worden meegeteld als de oorspronkelijke looptijd ten minste vijf
      jaar bedraagt. De hoogte tot welke de achtergestelde lening wordt meegeteld als onderdeel van het eigen vermogen
      wordt lineair verlaagd gedurende ten minste de vijf jaar die voorafgaan aan de datum van de aflossing.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel8
  - number: '8.5'
    text: |-
      Achtergestelde leningen zonder een vaste looptijd worden meegeteld als deze worden of zullen worden afgelost
      met een opzeggingstermijn van ten minste vijf jaar of De Nederlandsche Bank aflossing heeft toegestaan. Het
      verzoek om toestemming voor de aflossing ontvangt De Nederlandsche Bank ten minste zes maanden voor de beoogde
      aflossingsdatum.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel8
  - number: '8.6'
    text: |-
      De leningsovereenkomst bevat geen bepaling op grond waarvan de achtergestelde lening voor het einde van de
      looptijd, anders dan bij liquidatie van het fonds, wordt afgelost.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel8
  - number: '8.7'
    text: |-
      In afwijking van het zesde lid kan De Nederlandsche Bank toestemming verlenen voor vervroegde terugbetaling van
      achtergestelde leningen met een vaste looptijd, wanneer het initiatief hiertoe uitgaat van het fonds en het eigen
      vermogen niet onder het vereiste niveau daalt.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel8
  - number: '8.8'
    text: De leningsovereenkomst wordt niet gewijzigd dan nadat daarvoor toestemming van De Nederlandsche Bank is verkregen.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel8
  - number: '9.1'
    text: |-
      De effecten met onbepaalde looptijd en andere vermogensinstrumenten, bedoeld in
      [artikel 5, eerste lid, onder f][ref1], worden voor het totaal van deze effecten en van de achtergestelde leningen,
      bedoeld in [artikel 8, eerste lid][ref2], meegeteld tot een maximum van vijftig procent van het totaal van het
      eigen vermogen of het minimaal vereist eigen vermogen, naar gelang welk bedrag het laagst is, voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0020871#Artikel8
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: '5'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0020871
        artikel: '8'
        paragraaf: '4'
  - number: 9.1.a
    text: in de emissieovereenkomst is vastgelegd dat het fonds de rentebetaling uit kan stellen;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel9
  - number: 9.1.b
    text: |-
      de vorderingen op het fonds uit hoofde van de genoemde effecten zijn achtergesteld ten opzichte van overige
      vorderingen;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel9
  - number: 9.1.c
    text: |-
      in de emissieovereenkomst is vastgelegd dat verliezen kunnen worden gecompenseerd met het bedrag van de lening en
      nog te betalen rente; en
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel9
  - number: 9.1.d
    text: bedragen zijn gestort.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel9
  - number: '9.2'
    text: |-
      De aflossing van de effecten met onbepaalde looptijd en andere vermogensinstrumenten vindt niet plaats dan nadat
      daarvoor toestemming van De Nederlandsche Bank is verkregen.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel9
  - number: '10'
    text: |-
      Van het obligo van het geplaatste kapitaal of van het in aandelen verdeelde waarborgkapitaal wordt de helft
      meegeteld tot een maximum van vijftig procent van het eigen vermogen of het minimaal vereist eigen vermogen,
      naargelang welk bedrag het laagst is, mits van het geplaatste kapitaal minimaal vijfentwintig procent is gestort.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel10
  - number: '11.1'
    text: Het minimaal vereist eigen vermogen bedraagt het totaal van de in dit artikel beschreven berekeningen.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel11
  - number: '11.2'
    text: |-
      Voor pensioenregelingen waarbij door het fonds beleggingsrisico wordt gelopen, wordt vier procent van het bedrag
      van de bruto technische voorzieningen vermenigvuldigd met de verhouding tussen de bruto technische voorzieningen
      onder aftrek van de overdrachten uit hoofde van verzekering en de bruto technische voorzieningen aan het eind van
      het afgelopen boekjaar. Dit verhoudingsgetal is ten minste vijfentachtig procent.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel11
  - number: '11.3'
    text: |-
      Voor pensioenregelingen waarbij door het fonds geen beleggingsrisico wordt gelopen en de beheerslasten voor een
      periode van meer dan vijf jaar zijn vastgelegd, wordt één procent van de technische voorzieningen aan het einde van
      het boekjaar gerekend, overeenkomstig het tweede lid.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel11
  - number: '11.4'
    text: |-
      Voor pensioenregelingen waarbij door het fonds geen beleggingsrisico wordt gelopen en de beheerslasten voor een
      periode van vijf jaar of minder zijn vastgelegd, wordt vijfentwintig procent van de netto beheerslasten in verband
      met de bedrijfsuitoefening in het afgelopen boekjaar gerekend.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel11
  - number: '11.5'
    text: |-
      Voor pensioenregelingen met risicokapitaal bij overlijden, wordt 0,3 procent van het aanwezige risicokapitaal
      vermenigvuldigd met de verhouding tussen het risicokapitaal dat ten laste van het fonds blijft na aftrek van de
      overdrachten uit hoofde van verzekering en het risicokapitaal in het afgelopen boekjaar. Dit verhoudingsgetal is
      ten minste vijftig procent.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel11
  - number: '11.6'
    text: |-
      Voor zover het fonds arbeidsongeschiktheidspensioen of premievrijstelling bij arbeidsongeschiktheid uitvoert, wordt
      de hoogste uitkomst van de volgende berekeningen gerekend:
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel11
  - number: 11.6.a
    text: |-
      achttien procent van de in het afgelopen boekjaar geboekte dan wel verdiende premies, naargelang welk bedrag het
      hoogst is en van de in rekening gebrachte poliskosten, voor zover deze premies en kosten niet meer bedragen dan
      € 50 miljoen, vermeerderd met zestien procent van deze premies en kosten voor zover deze meer bedragen dan € 50
      miljoen. De uitkomst van deze berekening wordt vermenigvuldigd met de verhouding tussen de schaden die voor eigen
      rekening komen van het fonds na overdracht uit hoofde van verzekering en de bruto schaden in de afgelopen drie
      boekjaren. Dit verhoudingsgetal is ten minste vijftig procent;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel11
  - number: 11.6.b
    text: |-
      zesentwintig procent van de gemiddeld geboekte bruto schaden in de afgelopen drie boekjaren en van de gemiddelde
      toevoeging aan de schadevoorziening in deze jaren, voor zover deze schaden en toevoeging niet meer bedragen dan
      € 35 miljoen, vermeerderd met drieëntwintig procent van deze schaden en toevoeging, voor zover deze meer bedragen
      dan € 35 miljoen. De uitkomst van deze berekening wordt vermenigvuldigd met de verhouding tussen de schaden
      die voor eigen rekening komen van het fonds na overdracht uit hoofde van verzekering en de bruto schaden in de
      afgelopen drie boekjaren. Dit verhoudingsgetal is ten minste vijftig procent.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel11
  - number: '11.7'
    text: |-
      Indien de hoogste uitkomst van de berekeningen, bedoeld in het zesde lid, lager is dan in het afgelopen boekjaar,
      is de uitkomst ten minste gelijk aan de uitkomst van het afgelopen boekjaar vermenigvuldigd met de verhouding
      tussen de technische voorzieningen voor te betalen schaden onder aftrek van de overdrachten uit verzekering aan
      het einde van het afgelopen boekjaar en de technische voorzieningen voor te betalen schaden onder aftrek van de
      overdrachten uit verzekering aan het begin van het afgelopen boekjaar. Dit verhoudingsgetal is ten hoogste honderd
      procent.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel11
  - number: '11.8'
    text: |-
      De Nederlandsche Bank kan tegen de op verzekering gebaseerde verlaging van het minimaal vereist eigen vermogen
      overeenkomstig het tweede, vijfde, zesde en zevende lid, bedenkingen naar voren brengen indien:
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel11
  - number: 11.8.a
    text: |-
      de aard of de kwaliteit van de overdracht uit hoofde van verzekering sinds het afgelopen boekjaar sterk is
      gewijzigd; of
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel11
  - number: 11.8.b
    text: er nauwelijks of geen risico-overdracht plaatsvindt uit hoofde van verzekering.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel11
  - number: 11a.1
    text: |-
      Een fonds dat pensioenregelingen uitvoert waarbij door het fonds geen beleggingsrisico wordt gelopen, beoordeelt op
      31 december van ieder jaar of voldaan wordt aan de vereisten ten aanzien van het minimaal vereist eigen vermogen.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel11a
  - number: 11a.2
    text: |-
      Indien het fonds, bedoeld in het eerste lid, op 31 december van het lopende boekjaar niet voldoet aan de
      vereisten ten aanzien van het minimaal vereist eigen vermogen, beoordeelt het fonds of het op 31 december van het
      voorafgaande boekjaar voldeed aan deze vereisten.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel11a
  - number: 11a.3
    text: |-
      Indien het fonds, bedoeld in het eerste lid, zowel op 31 december van het lopende boekjaar als op 31 december van
      het voorafgaande boekjaar niet voldeed aan de in [artikel 11][ref1] gestelde vereisten ten aanzien van het minimaal
      vereist eigen vermogen, neemt het fonds direct maatregelen zodat het op 31 december van het lopende boekjaar
      voldoet aan de vereisten ten aanzien van het minimaal vereist eigen vermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel11
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: '11'
        paragraaf: '4'
  - number: '12.1'
    text: |-
      Voor de berekening van het vereist eigen vermogen hanteert het fonds een standaardmodel waarin door middel van
      risicofactoren voor de gehele balans van activa en passiva rekening wordt gehouden met:
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel12
  - number: 12.1.a
    text: het renterisico;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel12
  - number: 12.1.b
    text: het aandelen- en vastgoedrisico;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel12
  - number: 12.1.c
    text: het valutarisico;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel12
  - number: 12.1.d
    text: het grondstoffenrisico;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel12
  - number: 12.1.e
    text: het kredietrisico;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel12
  - number: 12.1.f
    text: het verzekeringtechnisch risico;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel12
  - number: 12.1.g
    text: het liquiditeitsrisico;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel12
  - number: 12.1.h
    text: het concentratierisico;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel12
  - number: 12.1.i
    text: het operationeel risico; en
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel12
  - number: 12.1.j
    text: het actief beheer.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel12
  - number: '12.2'
    text: |-
      In aanvulling op het standaardmodel, bedoeld in het eerste lid, hanteert een fonds, na voorafgaande toestemming
      van De Nederlandsche Bank, een of meer partiële modellen, indien het risicoprofiel van het fonds niet voldoende
      aansluit op de uitgangspunten van het standaardmodel.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel12
  - number: '12.3'
    text: |-
      In afwijking van het eerste lid kan een fonds, na voorafgaande toestemming van De Nederlandsche Bank, voor de
      berekening van het vereist eigen vermogen een intern model hanteren.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel12
  - number: '12.4'
    text: |-
      Voor de berekening van het vereist eigen vermogen kan een fonds dat zijn risico’s heeft verzekerd bij een
      verzekeraar, in afwijking van het eerste lid, onderdeel e, en het tweede en derde lid, voor het verzekerde deel het
      kredietrisico buiten beschouwing laten.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel12
  - number: '12.5'
    text: |-
      De Nederlandsche Bank kan nadere regels stellen inzake de scenariomethode indien innovatieve beleggingsinstrumenten
      daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel12
  - number: '12.6'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het standaardmodel en de omvang, de inhoud en
      de samenhang van de risicofactoren, bedoeld in het eerste lid, en met betrekking tot de in het tweede en derde lid
      bedoelde situaties.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel12
  - number: 12a.1
    text: De vaststelling van de beleidsdekkingsgraad vindt plaats per het einde van een kalendermaand.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel12a
  - number: 12a.2
    text: |-
      De berekening van de beleidsdekkingsgraad wordt gebaseerd op de dekkingsgraden per het einde van elk van de twaalf
      kalendermaanden voorafgaand aan het moment van vaststelling.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel12a
  - number: '13.1'
    text: |-
      De waarden worden op zodanige wijze belegd dat de veiligheid, de kwaliteit, de liquiditeit en het rendement van de
      portefeuille als geheel zijn gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel13
  - number: '13.2'
    text: |-
      Waarden die ter dekking van de technische voorzieningen worden aangehouden, worden belegd op een wijze die strookt
      met de aard en de duur van de verwachte toekomstige pensioenuitkeringen.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel13
  - number: '13.3'
    text: |-
      De waarden worden hoofdzakelijk op gereglementeerde markten belegd. Beleggingen in niet tot de handel op een
      gereglementeerde financiële markt toegelaten waarden worden tot een prudent niveau beperkt.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel13
  - number: '13.4'
    text: |-
      Beleggingen in derivaten zijn toegestaan voor zover deze bijdragen aan een vermindering van het risicoprofiel of
      een doeltreffend portefeuillebeheer vergemakkelijken. Het fonds vermijdt een bovenmatig risico met betrekking tot
      een en dezelfde tegenpartij en tot andere derivatenverrichtingen.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel13
  - number: '13.5'
    text: |-
      De waarden worden naar behoren gediversifieerd zodat een bovenmatige afhankelijkheid van of vertrouwen in bepaalde
      waarden, of een bepaalde emittent van waarden of groep van ondernemingen en risicoaccumulatie in de portefeuille
      als geheel worden vermeden.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel13
  - number: '13.6'
    text: |-
      Onder waardering op marktwaarde als bedoeld in [artikel 135, eerste lid, onder c, van de Pensioenwet][ref1] en
      [artikel 130, eerste lid, onder b, van de Wet verplichte beroepspensioenregeling][ref2] wordt verstaan: het bedrag
      waarvoor een actief kan worden verhandeld of een passief kan worden afgewikkeld tussen terzake goed geïnformeerde
      partijen, die tot een transactie bereid en onafhankelijk van elkaar zijn. Bij de waardering van een vordering van
      een fonds op een verzekeraar uit hoofde van een verzekering als bedoeld in [artikel 12, vierde lid][ref3], kan het
      kredietrisico op die verzekeraar buiten beschouwing worden gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel135
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel130
      [ref3]: https://wetten.overheid.nl/BWBR0020871#Artikel12
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '135'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '130'
      - id: ref3
        bwb_id: BWBR0020871
        artikel: '12'
        paragraaf: '4'
  - number: '13.7'
    text: |-
      Onder een gereglementeerde markt als bedoeld in het derde lid wordt verstaan: een multilateraal systeem dat
      meerdere koop- en verkoopintenties van derden met betrekking tot financiële instrumenten – binnen dit systeem en
      volgens de niet-discretionaire regels van dit systeem – samenbrengt of het samenbrengen daarvan vergemakkelijkt op
      zodanige wijze dat er een overeenkomst uit voortvloeit met betrekking tot financiële instrumenten die volgens de
      regels en de systemen van die markt tot de handel zijn toegelaten, en dat regelmatig en overeenkomstig de geldende
      regels inzake de vergunningverlening en het doorlopende toezicht werkt.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel13
  - number: '13.8'
    text: |-
      Onder blootstelling aan beleggingsrisico wordt verstaan; de effectieve blootstelling aan zakelijke waardenrisico.
      Zakelijke waarden zijn alle beleggingen die niet onder kredietrisicovrije vastrentende waarden vallen, waarbij voor
      vastrentende waarden met kredietrisico een systematiek van mapping toegepast wordt op basis van de tabel, bedoeld
      in [artikel 23a, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel23a
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: 23a
        paragraaf: 8a
  - number: 13a.1
    text: |-
      Een fonds stelt voor de langere termijn een strategisch beleggingsbeleid vast dat aansluit op de doelstellingen en
      beleidsuitgangspunten, waaronder de risicohouding, van het fonds en is gebaseerd op gedegen onderzoek.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel13a
  - number: 13a.2
    text: |-
      Het strategisch beleggingsbeleid bevat in ieder geval een beschrijving van de beleggingsdoelstelling, de
      samenstelling van de beoogde beleggingsportefeuille en de mate waarin van de beoogde beleggingsportefeuille kan
      worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel13a
  - number: 13a.3
    text: |-
      Het fonds vertaalt het strategisch beleggingsbeleid naar een beleggingsplan. In het beleggingsplan neemt het fonds
      concrete en gedetailleerde richtniveaus en bandbreedtes per beleggingscategorie op. Het fonds stelt daarbij beleid
      op voor de beheersing van de relevante risico’s.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel13a
  - number: 13a.4
    text: |-
      Het fonds onderbouwt dat het strategisch beleggingsbeleid en het beleggingsplan passen binnen de prudent person
      regel.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel13a
  - number: 13a.5
    text: |-
      Een fonds stelt een beleggingscyclus vast op grond waarvan het strategisch beleggingsbeleid, het beleggingsplan en
      de uitvoering periodiek worden geëvalueerd en herbeoordeeld.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel13a
  - number: '14.1'
    text: |-
      Leningen als bedoeld in [artikel 136 van de Pensioenwet][ref1] en
      [artikel 131 van de Wet verplichte beroepspensioenregeling][ref2], zijn tijdelijk indien deze worden aangegaan voor
      een periode van niet langer dan een jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel136
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel131
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '136'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '131'
  - number: '14.2'
    text: |-
      Van een liquiditeitsdoelstelling, als bedoeld in [artikel 136 van de Pensioenwet][ref1] en
      [artikel 131 van de Wet verplichte beroepspensioenregeling][ref2], is sprake als het fonds tijdelijk niet kan
      voldoen aan zijn verplichtingen of de betreffende lening wordt aangegaan ter verbetering van het risicoprofiel van
      het fonds.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel136
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel131
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '136'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '131'
  - number: '15.1'
    text: |-
      Een fonds stelt beleid vast met betrekking tot voorwaardelijke toeslagverlening waarin is vastgelegd of en zo ja,
      in welke mate, toeslagverlening wordt beoogd. Indien sprake is van toeslagverlening op basis van een maatstaf als
      lonen, prijzen of een vast percentage van de pensioenaanspraken of pensioenrechten wordt deze maatstaf weergegeven.
      Verder wordt een beschrijving opgenomen van de methodiek die wordt gehanteerd bij incidentele toeslagverlening
      om in het verleden niet toegekende toeslag of in het verleden doorgevoerde vermindering van pensioenaanspraken en
      pensioenrechten te compenseren.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel15
  - number: '15.2'
    text: |-
      De beleidsdekkingsgraad waaronder geen toeslag wordt verleend, bedoeld in
      [artikel 137, tweede lid, onderdeel a, van de Pensioenwet][ref1] dan wel
      [artikel 132, tweede lid, onderdeel a, van de Wet verplichte beroepspensioenregeling][ref2], is 110%.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel137
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel132
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '137'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '132'
  - number: '15.3'
    text: |-
      Voor de toepassing van [artikel 137, tweede lid, onderdeel b, van de Pensioenwet][ref1] dan wel
      [artikel 132, tweede lid, onderdeel b, van de Wet verplichte beroepspensioenregeling][ref2] wordt de volgende
      rekenregel toegepast. Eerst wordt de omvang van het voor toeslagverlening beschikbare vermogen boven de
      beleidsdekkingsgraad van 110%, bedoeld in het tweede lid, bepaald. Vervolgens wordt de hoogte van de toeslag
      zodanig bepaald dat wanneer deze jaarlijks wordt toegekend de contante waarde van alle toeslagen maximaal gelijk
      is aan de hoogte van dit vermogen. De hierbij gehanteerde discontovoet is maximaal gelijk aan het verwachte
      bruto rendement op aandelen, bedoeld in [artikel 23a, eerste lid, onderdeel b][ref3], verminderd met de uniforme
      kostenafslag voor beleggingskosten, bedoeld in artikel 23a, eerste lid, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel137
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel132
      [ref3]: https://wetten.overheid.nl/BWBR0020871#Artikel23a
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '137'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '132'
      - id: ref3
        bwb_id: BWBR0020871
        artikel: 23a
        paragraaf: 8a
  - number: '15.4'
    text: |-
      Een fonds dat een op de minimale verwachtingswaarden voor de groeivoeten van het prijs- of loonindexcijfer, bedoeld
      in [artikel 23a, eerste lid, onderdeel a, en tweede lid][ref1], gebaseerde maatstaf hanteert voor voorwaardelijke
      toeslagverlening stelt de op grond van de rekenregel in het derde lid berekende toeslag vast als percentage van
      de maatstaf en past voor de bepaling van de hoogte van de toeslagverlening dit percentage toe op de voor het
      betreffende jaar relevante gerealiseerde waarde van de maatstaf voor toeslagverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel23a
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: 23a
        paragraaf: 8a
  - number: '15.5'
    text: Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel15
  - number: 15a.1
    text: |-
      Voor de toepassing van dit artikel en [artikel 15b][ref1] wordt onder een toeslagendepot verstaan: een
      bestemmingsreserve die geen onderdeel uitmaakt van de dekkingsgraad van het fonds en als enige doel heeft het
      gedurende een bepaalde tijd financieren van toeslagverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel15b
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: 15b
        paragraaf: '6'
  - number: 15a.2
    text: |-
      [Artikel 137, tweede lid, van de Pensioenwet][ref1] dan wel
      [artikel 132, tweede lid, van de Wet verplichte beroepspensioenregeling][ref2] is gedurende een periode van
      maximaal tien jaar niet van toepassing ten aanzien van een toeslagendepot dat vanaf 1 januari 2015 is ingesteld om
      een deel van de deelnemers, gewezen deelnemers, andere aanspraakgerechtigden of pensioengerechtigden van een fonds
      door toeslagverlening te compenseren vanwege:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel137
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel132
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '137'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '132'
  - number: 15a.2.a
    text: |-
      een fusie van fondsen met een verschillende dekkingsgraad of een collectieve waardeoverdracht
      bij liquidatie van een fonds als bedoeld in [artikel 84 van de Pensioenwet][ref1] dan wel
      [artikel 92 van de Wet verplichte beroepspensioenregeling][ref2] waarbij het overdragende fonds en het ontvangende
      fonds een verschillende dekkingsgraad hebben;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel92
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '84'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '92'
  - number: 15a.2.b
    text: |-
      een collectieve wijziging van de pensioenovereenkomsten of een wijziging van de beroepspensioenregeling die inhoudt
      dat onvoorwaardelijke toeslagverlening is gewijzigd in voorwaardelijke toeslagverlening; of
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel15a
  - number: 15a.2.c
    text: 'een collectieve wijziging van de pensioenovereenkomsten die inhoudt dat:'
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel15a
  - number: 15a.2.c.1°
    text: bij een uitkeringsovereenkomst wordt overgegaan op een premie die voor meerdere jaren wordt vastgesteld; of
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel15a
  - number: 15a.2.c.2°
    text: |-
      wordt overgegaan op een premieovereenkomst, waarbij de premie onmiddellijk na het beschikbaar stellen wordt
      aangewend voor een aanspraak op uitkering.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel15a
  - number: 15a.3
    text: |-
      [Artikel 137, tweede lid, van de Pensioenwet][ref1] dan wel
      [artikel 132, tweede lid, van de Wet verplichte beroepspensioenregeling][ref2] is tot uiterlijk 1 januari 2025 niet
      van toepassing ten aanzien van een toeslagendepot dat voor 1 januari 2015 is ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel137
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel132
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '137'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '132'
  - number: 15a.4
    text: |-
      Indien een nieuw fonds is opgericht vanwege een omstandigheid als bedoeld in het tweede lid, onderdeel b of c,
      en uitsluitend het deel van de belanghebbenden van het oude fonds waarvoor het perspectief op toeslagverlening
      is verslechterd door deze omstandigheid, belanghebbende wordt bij het nieuwe fonds kan, in afwijking van het
      tweede lid, het toeslagendepot zijn ingesteld om alle belanghebbenden bij het nieuwe fonds te compenseren.
      [Artikel 15b, eerste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel15b
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: 15b
        paragraaf: '6'
  - number: 15a.5
    text: |-
      Er wordt geen toeslag verleend uit een toeslagendepot als bedoeld in het tweede en derde lid, indien het fonds
      gezien de beleidsdekkingsgraad niet voldoet aan de bij of krachtens [artikel 131 van de Pensioenwet][ref1] dan
      wel [artikel 126 van de Wet verplichte beroepspensioenregeling][ref2] gestelde eisen ten aanzien van het minimaal
      vereist eigen vermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel131
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel126
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '131'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '126'
  - number: 15b.1
    text: |-
      Uit een toeslagendepot als bedoeld in [artikel 15a, tweede lid][ref1], kan toeslag worden verleend aan het deel
      van de deelnemers, gewezen deelnemers, andere aanspraakgerechtigden of pensioengerechtigden van het fonds waarvoor
      wordt aangetoond dat de omstandigheden, bedoeld in artikel 15a, tweede lid, hebben geleid tot een verslechtering
      van het perspectief op toeslagverlening. Bij de omstandigheden, bedoeld in artikel 15a, tweede lid, onderdeel c,
      toont het fonds dit aan door middel van een scenarioanalyse.


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel15a
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: 15a
        paragraaf: '6'
  - number: 15b.2
    text: |-
      De periode van maximaal tien jaar, bedoeld in [artikel 15a, tweede lid][ref1], wordt berekend vanaf het moment
      dat de fusie van de fondsen of de collectieve waardeoverdracht, bedoeld in artikel 15a, tweede lid, onderdeel
      a, heeft plaatsgevonden of de collectieve wijziging van de pensioenovereenkomsten dan wel de wijziging van de
      beroepspensioenregeling, bedoeld in artikel 15a, tweede lid, onderdeel b of c, is ingegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel15a
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: 15a
        paragraaf: '6'
  - number: 15b.3
    text: 'Een toeslagendepot wordt als volgt gefinancierd:'
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel15b
  - number: 15b.3.a
    text: |-
      een toeslagendepot als bedoeld in [artikel 15a, tweede lid, onderdeel a][ref1], rechtstreeks uit de middelen
      van het bij de fusie of collectieve waardeoverdracht betrokken fonds met de hoogste dekkingsgraad, waarbij de
      omvang van een dergelijk toeslagendepot niet groter is dan het vermogen dat correspondeert met het verschil in
      dekkingsgraad van de bij de fusie of collectieve waardeoverdracht betrokken fondsen direct voorafgaand aan de fusie
      of collectieve waardeoverdracht;


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel15a
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: 15a
        paragraaf: '6'
  - number: 15b.3.b
    text: |-
      een toeslagendepot als bedoeld in [artikel 15a, tweede lid, onderdeel b][ref1], door een daarvoor bestemde premie
      of door een eenmalige storting van de werkgever;


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel15a
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: 15a
        paragraaf: '6'
  - number: 15b.3.c
    text: |-
      een toeslagendepot als bedoeld in [artikel 15a, tweede lid, onderdeel c][ref1], door een eenmalige storting van de
      werkgever; of


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel15a
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: 15a
        paragraaf: '6'
  - number: 15b.3.d
    text: |-
      een toeslagendepot als bedoeld in [artikel 15a, derde lid][ref1], door een daarvoor bestemde premie mits de
      afspraken daartoe voor 1 januari 2015 zijn vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel15a
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: 15a
        paragraaf: '6'
  - number: 15b.4
    text: |-
      De regeling met betrekking tot een toeslagendepot als bedoeld in [artikel 15a, tweede lid][ref1], wordt vastgelegd
      in de uitvoeringsovereenkomst of het uitvoeringsreglement. Daarbij wordt in ieder geval vastgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel15a
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: 15a
        paragraaf: '6'
  - number: 15b.4.a
    text: de reden voor de instelling van het toeslagendepot;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel15b
  - number: 15b.4.b
    text: de financiering van het toeslagendepot;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel15b
  - number: 15b.4.c
    text: |-
      een omschrijving van de groep deelnemers, gewezen deelnemers, andere aanspraakgerechtigden of pensioengerechtigden
      die toeslag krijgen uit het toeslagendepot; en
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel15b
  - number: 15b.4.d
    text: onder welke voorwaarden toeslag wordt verleend uit het toeslagendepot.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel15b
  - number: '16.1'
    text: |-
      Het herstelplan, bedoeld in [artikel 138 van de Pensioenwet][ref1] of
      [artikel 133 van de Wet verplichte beroepspensioenregeling][ref2], bevat in ieder geval een beschrijving van:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel138
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel133
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '138'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '133'
  - number: 16.1.a
    text: |-
      de oorzaak van het, gezien de beleidsdekkingsgraad, niet meer voldoen aan de bij of krachtens
      [artikel 132 van de Pensioenwet][ref1] of [artikel 127 van de Wet verplichte beroepspensioenregeling][ref2]
      gestelde vereisten ten aanzien van het vereist eigen vermogen;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel127
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '132'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '127'
  - number: 16.1.b
    text: de voorziene ontwikkeling van de technische voorzieningen en de waarden;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel16
  - number: 16.1.c
    text: |-
      de concrete maatregelen waardoor, gezien de beleidsdekkingsgraad, het eigen vermogen binnen de looptijd van het
      herstelplan op het vereiste niveau komt, waarbij rekening wordt gehouden met de naar verwachting toe te kennen
      toeslagverlening en de overige verplichtingen van het fonds.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel16
  - number: '16.2'
    text: |-
      Het herstelplan is ten aanzien van het eerste lid, onderdelen b en c, gebaseerd op een deterministische analyse op
      basis van een dekkingsgraadsjabloon.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel16
  - number: '16.3'
    text: |-
      Bij het indienen van het herstelplan onderbouwt het fonds waarom vanuit het belang van deelnemers, gewezen
      deelnemers, andere aanspraakgerechtigden en pensioengerechtigden een bepaalde looptijd van het herstelplan is
      gekozen.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel16
  - number: '16.4'
    text: |-
      De in het eerste lid, onder c, bedoelde maatregelen mogen er niet toe leiden dat het risico dat niet wordt voldaan
      aan de in het eerste lid, onder a, genoemde vereisten ten aanzien van het vereist eigen vermogen, doelbewust wordt
      vergroot ten opzichte van de situatie waarin wel werd voldaan aan de in [artikel 132 van de Pensioenwet][ref1] of
      [artikel 127 van de Wet verplichte beroepspensioenregeling][ref2] opgenomen vereisten.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel127
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '132'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '127'
  - number: '16.5'
    text: |-
      Het vierde lid is van overeenkomstige toepassing in de periode tussen het moment dat het fonds vaststelt dat niet
      wordt voldaan aan de in het eerste lid, onderdeel a, genoemde vereisten ten aanzien van het vereist eigen vermogen
      en de ingangsdatum van het herstelplan.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel16
  - number: '16.6'
    text: Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel16
  - number: '18.1'
    text: |-
      Een fonds beschikt over goede administratieve en boekhoudkundige procedures en adequate interne
      controlemechanismen, stelt in het kader van het risicobeheer schriftelijk beleid vast ten aanzien van de beheersing
      van te lopen risico’s en draagt zorg voor de uitvoering van dat beleid. Het fonds evalueert het beleid ten
      minste driejaarlijks en past het beleid na een belangrijke wijziging zo spoedig mogelijk aan. Het risicobeheer is
      doeltreffend en goed geïntegreerd in de organisatiestructuur en de besluitvormingsprocessen.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel18
  - number: '18.2'
    text: |-
      Het fonds stelt onder meer strategieën, processen en rapportageprocedures schriftelijk vast om op individueel
      en geaggregeerd niveau de risico’s waaraan het fonds en de door het fonds uitgevoerde pensioenregelingen zijn of
      kunnen worden blootgesteld regelmatig te onderkennen, meten, bewaken en beheren en hierover te rapporteren. Hierbij
      worden ook de onderlinge afhankelijkheden en relaties tussen de in de vorige zin genoemde risico’s beschreven.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel18
  - number: '18.3'
    text: |-
      Onder risico’s als bedoeld in het eerste en tweede lid worden in ieder geval de risico’s verstaan die zich, voor
      zover van toepassing, bij het fonds of derden waaraan de werkzaamheden zijn uitbesteed op de volgende terreinen
      kunnen voordoen:
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel18
  - number: 18.3.a
    text: aangaan van pensioenverplichtingen en reservevorming;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel18
  - number: 18.3.b
    text: afgestemd beheer van activa en passiva;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel18
  - number: 18.3.c
    text: beleggingen, met name derivaten, securitisaties en vergelijkbare verbintenissen;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel18
  - number: 18.3.d
    text: beheer van het liquiditeits- en concentratierisico;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel18
  - number: 18.3.e
    text: beheer van het operationele risico;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel18
  - number: 18.3.f
    text: verzekering en andere risicobeperkingstechnieken;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel18
  - number: 18.3.g
    text: |-
      milieu en klimaat, mensenrechten en sociale verhoudingen met betrekking tot de beleggingsportefeuille en het beheer
      daarvan; en
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel18
  - number: 18.3.h
    text: |-
      netwerk- en informatiesystemen als bedoeld in [Verordening (EU) 2022/2554](32022R2554) van het Europees Parlement
      en de Raad van 14 december 2022 betreffende digitale operationele weerbaarheid voor de financiële sector en
      tot wijziging van de [Verordeningen (EG) nr. 1060/2009](32009R1060), [(EU) nr. 648/2012](32012R0648), [(EU)
      nr. 600/2014](32014R0600), [(EU) nr. 909/2014](32014R0909) en [(EU) 2016/1011](32016R1011) (PbEU 2022, L 333).
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel18
  - number: '18.4'
    text: |-
      Een fonds waarborgt dat de beheerste bedrijfsvoering geschiedt met in achtneming van [Verordening (EU) 2022/2554]
      (32022R2554) van het Europees Parlement en de Raad van 14 december 2022 betreffende digitale operationele
      weerbaarheid voor de financiële sector en tot wijziging van de [Verordeningen (EG) nr. 1060/2009](32009R1060),
      [(EU) nr. 648/2012](32012R0648), [(EU) nr. 600/2014](32014R0600), [(EU) nr. 909/2014](32014R0909) en [(EU)
      2016/1011](32016R1011) (PbEU 2022, L 333).
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel18
  - number: '18.5'
    text: |-
      Een fonds neemt bij de uitvoering van een premieovereenkomst of premieregeling in de opbouwfase of een variabele
      uitkering de beleggingsrisico’s die deelnemers, gewezen deelnemers of pensioengerechtigden lopen vanuit hun oogpunt
      in aanmerking bij het opstellen en uitvoeren van het beleid ten aanzien van de beheersing van te lopen risico’s.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel18
  - number: '18.6'
    text: |-
      De risicobeheerfunctie, bedoeld in [artikel 143a, eerste lid, van de Pensioenwet][ref1] dan wel
      [artikel 138a, eerste lid, van de Wet verplichte beroepspensioenregeling][ref2] wordt zodanig opgezet dat zij
      bevorderlijk is voor het risicobeheer.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel143a
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel138a
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 143a
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 138a
  - number: '18.7'
    text: |-
      Een algemeen pensioenfonds draagt er zorg voor dat de administratieve en boekhoudkundige procedures, bedoeld
      in het eerste lid, de scheiding waarborgen tussen de afgescheiden vermogens die per collectiviteitkring worden
      aangehouden.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel18
  - number: 18a.1
    text: |-
      Een fonds legt schriftelijk een duidelijke organisatiestructuur vast met betrekking tot het bepalen en uitvoeren
      van het beleggingsbeleid. Bij deze organisatiestructuur wordt in ieder geval het risicobeheer vorm gegeven
      en waarborgt het fonds een zorgvuldig en transparant besluitvormingsproces. Het risicobeheer is adequaat en
      onafhankelijk.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel18a
  - number: 18a.2
    text: |-
      Een fonds draagt er zorg voor dat er een balans is tussen omvang, aard en complexiteit van de
      beleggingsportefeuille enerzijds en de aanwezige kennis en ervaring en het risicobeheer anderzijds.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel18a
  - number: 18b.1
    text: |-
      Een fonds voert in het kader van het risicobeheer ten minste driejaarlijks een eigenrisicobeoordeling uit en legt
      de resultaten hiervan schriftelijk vast. In geval van een significante wijziging in het risicoprofiel van het
      fonds of door het fonds uitgevoerde pensioenregelingen vindt zo spoedig mogelijk een eigenrisicobeoordeling plaats,
      met dien verstande dat bij een significante wijziging in het risicoprofiel van een specifieke pensioenregeling de
      eigenrisicobeoordeling beperkt mag blijven tot die pensioenregeling.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel18b
  - number: 18b.2
    text: 'De eigenrisicobeoordeling en de vastlegging van de resultaten hiervan omvat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel18b
  - number: 18b.2.a
    text: |-
      een beschrijving van de wijze waarop de eigenrisicobeoordeling in het managementproces en de
      besluitvormingsprocessen van het fonds is geïntegreerd;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel18b
  - number: 18b.2.b
    text: |-
      indien het fonds de risicobeheerfunctie, interne auditfunctie of actuariële functie uitbesteedt aan de bijdragende
      onderneming, een beschrijving van de wijze waarop belangenconflicten met de bijdragende onderneming worden
      voorkomen of beheerst;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel18b
  - number: 18b.2.c
    text: een beoordeling van de doelmatigheid van het risicobeheer;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel18b
  - number: 18b.2.d
    text: |-
      een beoordeling van de totale financieringsbehoeften van het fonds met, indien van toepassing, een beschrijving van
      het herstelplan;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel18b
  - number: 18b.2.e
    text: |-
      een beoordeling van de risico’s voor de deelnemers, gewezen deelnemers, andere aanspraakgerechtigden en
      pensioengerechtigden met betrekking tot hun pensioenaanspraken en pensioenrechten en de effectiviteit van eventuele
      corrigerende maatregelen, in voorkomend geval rekening houdend met:
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel18b
  - number: 18b.2.e.1°
    text: de mogelijkheden tot toeslagverlening;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel18b
  - number: 18b.2.e.2°
    text: |-
      de mogelijkheden tot vermindering van de pensioenaanspraken en pensioenrechten, waaronder de mate waarin de
      pensioenaanspraken en pensioenrechten kunnen worden verminderd, onder welke voorwaarden en door wie;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel18b
  - number: 18b.2.f
    text: |-
      een kwalitatieve beoordeling van de mechanismen ter bescherming van de pensioenuitkeringen, waaronder in voorkomend
      geval garanties, convenanten of een andere soort financiële steun van de bijdragende onderneming, verzekering
      of herverzekering door een onderneming die valt onder [Richtlijn 2009/138/EG](32009L0138) van het Europees
      Parlement en de Raad van 25 november 2009 betreffende de toegang tot en uitoefening van het verzekerings- en het
      herverzekeringsbedrijf (Solvabiliteit II) (PbEU 2009, L 335);
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel18b
  - number: 18b.2.g
    text: een kwalitatieve beoordeling van de operationele risico's; en
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel18b
  - number: 18b.2.h
    text: |-
      voor zover van toepassing, een beoordeling van nieuwe of opkomende risico’s, met inbegrip van risico's die met
      klimaatverandering, het gebruik van hulpbronnen en het milieu verband houden, sociale risico's en risico's in
      verband met de waardevermindering van activa als gevolg van veranderde regelgeving.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel18b
  - number: 18b.3
    text: |-
      Het fonds beschikt voor de toepassing van het tweede lid over methoden om de risico's te detecteren en te
      beoordelen waaraan het fonds op korte en op lange termijn is of kan worden blootgesteld en die gevolgen kunnen
      hebben voor de mogelijkheid van het fonds om aan haar verplichtingen te voldoen. De gebruikte methoden worden
      beschreven in de vastlegging van de resultaten van de eigenrisicobeoordeling.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel18b
  - number: 18b.4
    text: Het fonds neemt de eigenrisicobeoordeling in aanmerking bij het nemen van strategische beslissingen.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel18b
  - number: 18b.5
    text: |-
      Het fonds zendt een door het bestuur gewaarmerkt afschrift van de resultaten van de eigenrisicobeoordeling of de
      wijzigingen in de resultaten van de eigenrisicobeoordeling binnen twee weken na de totstandkoming daarvan aan de
      toezichthouder.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel18b
  - number: '19'
    text: |-
      Een fonds draagt zorg voor een systematische analyse van integriteitrisico’s en stelt aan de hand van deze analyse
      een integriteitbeleid vast en draagt zorg voor de uitvoering van dat beleid.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel19
  - number: 19a.1
    text: Een fonds beschikt over procedures en maatregelen met betrekking tot de omgang met en vastlegging van incidenten.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel19a
  - number: 19a.2
    text: |-
      Onder een incident als bedoeld in dit artikel wordt verstaan: een gedraging of gebeurtenis die een ernstig gevaar
      vormt voor de integere uitoefening van het bedrijf van een fonds.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel19a
  - number: 19a.3
    text: |-
      Een fonds neemt naar aanleiding van een incident maatregelen die zijn gericht op het beheersen van de opgetreden
      risico’s en het voorkomen van herhaling.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel19a
  - number: 19a.4
    text: Een fonds informeert de Nederlandsche Bank onverwijld omtrent incidenten.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel19a
  - number: '20.1'
    text: |-
      Een fonds beschikt over procedures en maatregelen met betrekking tot het tegengaan van verstrengeling van privé-
      belangen met de belangen van het fonds van personen die het beleid van het fonds bepalen, leden van het orgaan dat
      is belast met het toezicht op het beleid en de algemene gang van zaken van het fonds en andere werknemers of andere
      personen die in opdracht van het fonds op structurele basis werkzaamheden voor het fonds verrichten.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel20
  - number: '20.2'
    text: |-
      Een fonds voorkomt dat sprake is van personele unies op het niveau van beleidsbepalers of medebeleidsbepalers
      tussen het fonds en derden waaraan werkzaamheden worden uitbesteed, tenzij sprake is van uitbesteding van
      werkzaamheden aan de werkgever.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel20
  - number: '20.3'
    text: |-
      Een fonds beschikt over een gedragscode die voor bestuurders en medewerkers van het fonds voorschriften geeft ter
      voorkoming van belangenconflicten en van misbruik en oneigenlijk gebruik van de bij het fonds aanwezige informatie
      of zaken.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel20
  - number: '20.4'
    text: De Nederlandsche Bank kan regels stellen met betrekking tot de inhoud van de gedragscode, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel20
  - number: '21'
    text: |-
      Een fonds voert een beleid gericht op het duurzaam beheersen van te lopen financiële risico’s en andere dan
      financiële risico’s.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel21
  - number: 21a.1
    text: |-
      Het beleid, bedoeld in [artikel 21][ref1], houdt mede in dat het fonds een beleid inzake beloningen voert dat niet
      aanmoedigt tot het nemen van meer risico’s dan voor het fonds aanvaardbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel21
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: '21'
        paragraaf: '8'
  - number: 21a.2
    text: |-
      Het fonds legt het beleid inzake beloningen schriftelijk vast en draagt er zorg voor dit beleid te implementeren
      en in stand te houden. Het beleid is afgestemd op de omvang en organisatie van het fonds en op de aard, omvang en
      complexiteit van zijn bedrijf, is in overeenstemming met de werkzaamheden, het risicoprofiel, de doelstellingen,
      het langetermijnbelang, de financiële stabiliteit en de prestaties van het fonds als geheel, en draagt bij aan een
      deugdelijk, prudent en doeltreffend bestuur van het fonds.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel21a
  - number: 21a.3
    text: |-
      Het beleid inzake beloningen omschrijft de beloningscomponenten en beloningsstructuren die ertoe zouden kunnen
      bijdragen dat het fonds meer risico’s neemt dan voor hem aanvaardbaar is, alsmede de te volgen procedures en
      maatregelen die dergelijke beloningscomponenten en beloningsstructuren voorkomen en beheersen.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel21a
  - number: 21a.4
    text: Het fonds maakt zijn beleid inzake beloningen openbaar.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel21a
  - number: 21a.5
    text: Het fonds evalueert en actualiseert het beleid inzake beloningen ten minste driejaarlijks.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel21a
  - number: 21a.6
    text: 'De Nederlandsche Bank kan regels stellen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel21a
  - number: 21a.6.a
    text: |-
      de wijze waarop het beleid inzake beloningen wordt opgesteld en vastgesteld of goedgekeurd, uitgevoerd, geëvalueerd
      en aangepast;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel21a
  - number: 21a.6.b
    text: |-
      de wijze waarop vorm wordt gegeven aan beloningscomponenten en beloningsstructuren en de wijze waarop de risico’s
      die uit het beleid en de uitvoering daarvan voortvloeien, worden beheerst; en
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel21a
  - number: 21a.6.c
    text: de inhoud en wijze van openbaarmaking van het beleid inzake beloningen.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel21a
  - number: 21b
    text: |-
      Een fonds draagt er zorg voor dat voor de beoordeling van de kredietwaardigheid van de activa niet uitsluitend of
      mechanisch wordt uitgegaan van ratings, uitgegeven door een ratingbureau.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel21b
  - number: '22.1'
    text: |-
      Een fonds voert periodiek een haalbaarheidstoets uit die op basis van een stochastische analyse inzicht geeft in de
      samenhang tussen de financiële opzet, het verwachte pensioenresultaat en de risico’s die daarbij gelden. Er is een
      aanvangshaalbaarheidstoets en een jaarlijkse haalbaarheidstoets.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel22
  - number: '22.2'
    text: |-
      Een fonds voert een aanvangshaalbaarheidstoets uit bij uitvoering van een nieuwe pensioenregeling en bij
      significante wijzigingen.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel22
  - number: '22.3'
    text: 'De aanvangshaalbaarheidstoets laat zien:'
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel22
  - number: 22.3.a
    text: |-
      dat het verwachte pensioenresultaat op fondsniveau boven de door het fonds te kiezen ondergrens voor dit
      pensioenresultaat blijft;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel22
  - number: 22.3.b
    text: dat het premiebeleid over de gehele berekeningshorizon voldoende realistisch en haalbaar is;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel22
  - number: 22.3.c
    text: |-
      indien van toepassing dat het fonds voldoende herstelcapaciteit heeft om naar verwachting vanuit de situatie dat
      aan de vereisten voor het minimaal vereist eigen vermogen wordt voldaan, binnen de looptijd van het herstelplan aan
      de vereisten voor het vereist eigen vermogen te voldoen; en
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel22
  - number: 22.3.d
    text: |-
      dat het pensioenresultaat op fondsniveau in het slechtweerscenario niet teveel afwijkt van het verwachte
      pensioenresultaat op fondsniveau, waarbij het fonds hiervoor de maximale afwijking vaststelt.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel22
  - number: '22.4'
    text: |-
      De toetsing van het derde lid, onderdelen a, b, en d, wordt gedaan vanuit de feitelijke financiële positie van het
      fonds. De toetsing van het derde lid, onderdelen a en b wordt ook gedaan vanuit een dekkingsgraad waarbij aan de
      vereisten van het vereist eigen vermogen wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel22
  - number: '22.5'
    text: |-
      Bij de jaarlijkse haalbaarheidstoets wordt vanuit de feitelijke financiële positie van een fonds
      beoordeeld in hoeverre wordt voldaan aan het derde lid, onderdelen a en d, op basis van de bij de laatste
      aanvangshaalbaarheidstoets door het fonds gekozen normering bij deze onderdelen.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel22
  - number: '22.6'
    text: |-
      Indien bij de jaarlijkse haalbaarheidstoets blijkt dat niet wordt voldaan aan het derde lid, onderdeel a of d, treedt
      het fonds in overleg met de vertegenwoordigers, bedoeld in [artikel 102a, eerste lid, van de Pensioenwet][ref1] dan
      wel [artikel 109a, eerste lid, van de Wet verplichte beroepspensioenregeling][ref2], om te bezien of maatregelen
      genomen moeten worden.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel102a
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel109a
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 102a
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 109a
  - number: '22.7'
    text: |-
      De haalbaarheidstoets omvat een aantal prognosejaren, gerekend vanaf de rapportagedatum en werkt met de
      scenariosets, bedoeld in [artikel 23b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel23b
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: 23b
        paragraaf: 8a
  - number: '22.8'
    text: |-
      Bij ministeriele regeling kunnen regels worden gesteld over de haalbaarheidstoets en over de voorwaarden waaronder
      in het kader van de transitie kan worden bepaald dat de haalbaarheidstoets, in afwijking van het eerste lid, niet
      jaarlijks behoeft te worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel22
  - number: 22a.1
    text: |-
      Een fonds legt schriftelijk beleid vast met betrekking tot de interne audit en draagt zorg voor de uitvoering van
      dat beleid. Het fonds evalueert het beleid ten minste driejaarlijks en past het beleid na een belangrijke wijziging
      zo spoedig mogelijk aan.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel22a
  - number: 22a.2
    text: |-
      De interne auditfunctie, bedoeld in [artikel 143a, eerste lid, van de Pensioenwet](onbekend) dan wel [artikel 138a,
      eerste lid, van de Wet verplichte beroepspensioenregeling](onbekend) is belast met de interne audit. In het kader
      van de interne auditfunctie wordt onder meer geëvalueerd of de interne controlemechanismen en andere procedures en
      maatregelen ter waarborging van de beheerste en integere bedrijfsvoering, in voorkomend geval met inbegrip van de
      uitbestede werkzaamheden, adequaat en doeltreffend zijn.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel22a
  - number: 22b.1
    text: |-
      Een fonds legt schriftelijk beleid vast met betrekking tot de actuariële activiteiten en draagt zorg voor de
      uitvoering van dat beleid. Het fonds evalueert het beleid ten minste driejaarlijks en past het beleid na een
      belangrijke wijziging zo spoedig mogelijk aan.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel22b
  - number: 22b.2
    text: |-
      De actuariële functie, bedoeld in [artikel 143a, eerste lid, van de Pensioenwet](onbekend) dan wel [artikel
      138a, eerste lid, van de Wet verplichte beroepspensioenregeling](onbekend) is belast met de volgende actuariële
      activiteiten:
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel22b
  - number: 22b.2.a
    text: het houden van toezicht op de berekening van de technische voorzieningen;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel22b
  - number: 22b.2.b
    text: |-
      het beoordelen van de betrouwbaarheid en adequaatheid van de berekening van de technische voorzieningen, waaronder
      in ieder geval wordt verstaan:
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel22b
  - number: 22b.2.b.1°
    text: |-
      het beoordelen of de bij de berekening van de technische voorzieningen gehanteerde methodieken, onderliggende
      modellen en aannamen passend zijn;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel22b
  - number: 22b.2.b.2°
    text: |-
      het beoordelen of er voldoende gegevens worden gebruikt bij de berekening van de technische voorzieningen en het
      beoordelen van de kwaliteit van die gegevens; en
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel22b
  - number: 22b.2.b.3°
    text: het toetsen van de bij de berekening van de technische voorzieningen gehanteerde aannames aan de praktijk;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel22b
  - number: 22b.2.c
    text: het beoordelen van de algehele gedragslijn voor het aangaan van pensioenverplichtingen;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel22b
  - number: 22b.2.d
    text: |-
      het beoordelen van de adequaatheid van de verzekeringsregelingen ingeval het fonds dergelijke
      verzekeringsregelingen heeft; en
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel22b
  - number: 22b.2.e
    text: het ertoe bijdragen dat het risicobeheer doeltreffend wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel22b
  - number: 22c.1
    text: |-
      Een fonds stelt de houders van de risicobeheerfunctie, interne auditfunctie en actuariële functie in staat deze
      functies op een objectieve, eerlijke en onafhankelijke manier te vervullen.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel22c
  - number: 22c.2
    text: |-
      De risicobeheerfunctie en actuariële functie kunnen door dezelfde persoon worden
      uitgeoefend, met uitzondering van de situatie waarin de actuariële functie wordt vervuld
      door de actuaris, bedoeld in [artikel 147, vierde lid, van de Pensioenwet][ref1] en
      [artikel 142, vierde lid, van de Wet verplichte beroepspensioenregeling][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel147
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel142
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel22c
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '147'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '142'
  - number: 22c.3
    text: |-
      De risicobeheerfunctie, interne auditfunctie en actuariële functie kunnen worden uitgeoefend door personen die
      een soortgelijke functie tevens bij de werkgever uitoefenen, mits het fonds adequate maatregelen vastlegt die
      waarborgen dat eventuele belangenconflicten met de werkgever worden voorkomen of beheerst.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel22c
  - number: 22c.4
    text: |-
      De rapportage door de houders van de risicobeheerfunctie, interne auditfunctie en actuariële functie op grond van
      [artikel 143a, tweede lid, van de Pensioenwet](onbekend) dan wel [artikel 138a, tweede lid, van de Wet verplichte
      beroepspensioenregeling](onbekend) gebeurt periodiek schriftelijk. Hierbij wordt tevens vermeld welke personen
      betrokken waren bij het uitoefenen van de risicobeheerfunctie, interne auditfunctie of actuariële functie en,
      indien van toepassing, aan welke derden werkzaamheden in het kader van de functie zijn uitbesteed.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel22c
  - number: 23a.1
    text: |-
      Bij toepassing van de regels, bedoeld in
      [artikel 144, eerste lid, aanhef en onderdeel a, b en c, van de Pensioenwet][ref1] dan wel
      [artikel 139, eerste lid, aanhef en onderdeel a, b en c, van de Wet verplichte beroepspensioenregeling][ref2] gaat
      een fonds uit van:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel144
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel139
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '144'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '139'
  - number: 23a.1.a
    text: minimale verwachtingswaarden voor de prijs- en looninflatie van 2% respectievelijk 2,4% per jaar;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel23a
  - number: 23a.1.b
    text: |-
      een verwacht bruto meetkundig rendement op beursgenoteerde aandelen van maximaal 5,4% met daarbij een kostenafslag
      voor beleggingskosten van 20 basispunten en een standaarddeviatie van 20%;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel23a
  - number: 23a.1.c
    text: |-
      een verwacht bruto meetkundig rendement op overige zakelijke waarden van maximaal 7% met daarbij een kostenafslag
      van 180 basispunten en een standaarddeviatie van 25%;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel23a
  - number: 23a.1.d
    text: |-
      een verwacht bruto meetkundig rendement op grondstoffen van maximaal 3,5% met daarbij een kostenafslag van 20
      basispunten en een standaarddeviatie van 20%;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel23a
  - number: 23a.1.e
    text: |-
      een verwacht bruto meetkundig rendement op niet-beursgenoteerd vastgoed van maximaal 4,4% met daarbij een
      kostenafslag van 60 basispunten en een standaarddeviatie van 15%;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel23a
  - number: 23a.1.f
    text: |-
      een maximaal verwacht bruto meetkundig rendement op risicovrije vastrentende waarden conform de toekomstige
      rentetermijnstructuur met daarbij een kostenafslag van 20 basispunten en een standaarddeviatie van 8% daarbij
      rekening houdend met de looptijd van de vastrentende waarden; en
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel23a
  - number: 23a.1.g
    text: |-
      een maximaal verwacht meetkundig rendement voor vastrentende waarden met kredietrisico als een combinatie van het
      rendement op risicovrije vastrentende waarden en het rendement op beursgenoteerde aandelen op basis van de tabel,
      bedoeld in het vijfde lid, met daarbij een kostenafslag en een standaarddeviatie eveneens gebaseerd op deze tabel.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel23a
  - number: 23a.2
    text: |-
      In afwijking van het eerste lid, onderdeel a, bedragen de minimale verwachtingswaarden voor de prijs- en
      looninflatie voor de hele looptijd van de ramingen de door het Centraal Planbureau meest recente vastgestelde
      ramingen van de prijs- en looninflatie.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel23a
  - number: 23a.3
    text: |-
      Een fonds kan na instemming van De Nederlandsche Bank afwijken van de minimale verwachtingswaarden, bedoeld in
      het eerste lid, onderdeel a, en het tweede lid, indien de specifieke omstandigheden van het fonds dat noodzakelijk
      maken.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel23a
  - number: 23a.4
    text: |-
      De toekomstige rentetermijnstructuur, bedoeld in het eerste lid, onderdeel f, kan worden afgeleid uit de
      rentetermijnstructuur, bedoeld in [artikel 2, tweede lid][ref1], waarbij het fonds vanaf jaar t+5 van die
      toekomstige rentetermijnstructuur gemotiveerd en na toestemming van De Nederlandsche Bank kan afwijken.


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel2
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: '2'
        paragraaf: '2'
  - number: 23a.5
    text: |-
      De tabel, bedoeld in het eerste lid, onderdeel g, luidt als volgt:







                    *Rating*


                    *Gewicht vastrentende waarden*


                    *Gewicht aandelen*






                    AAA


                    100%


                    0%




                    AA


                    90%


                    10%




                    A


                    85%


                    15%




                    BBB


                    80%


                    20%




                    High Yield


                    40%


                    60%




           Vastrentende waarden zonder rating hebben geen aparte gewichten. Deze waarden worden verdeeld over twee andere
      categorieën: de kortlopende vorderingen en liquide middelen worden toegekend aan de categorie AAA en de overige
      vastrentende waarden zonder rating aan de categorie High Yield.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel23a
  - number: 23a.6
    text: |-
      Voor het omrekenen van rendementen naar het portefeuillerendement wordt gebruik gemaakt van onderstaande
      correlatietabel. Voor de omrekening van het meetkundig naar het rekenkundig gemiddelde geldt de formule:
      rekenkundig gemiddelde = meetkundig gemiddelde + ½ σ2:










