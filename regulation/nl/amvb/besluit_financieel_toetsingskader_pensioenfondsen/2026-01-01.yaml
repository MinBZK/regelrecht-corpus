    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.1.w
    text: informatie over de solidariteits- of risicodelingsreserve;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.1.x
    text: informatie over het compensatiedepot en andere voorzieningen;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.1.y
    text: |-
      informatie over de risicobereidheid van het fonds ten aanzien van onderscheidenlijke risicocategorieën alsmede over
      opgetreden overschrijdingen daarvan;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.1.z
    text: |-
      informatie over opgetreden incidenten als bedoeld in [artikel 19a][ref1], alsmede over de analyse en afhandeling
      daarvan;


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel19a
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: 19a
        paragraaf: '8'
  - number: 30.1.aa
    text: |-
      informatie over bedreigingen van de beheerste en integere bedrijfsvoering, alsmede over geplande en uitgevoerde
      risico- en dreigingsanalyses;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.1.ab
    text: |-
      informatie over geplande evaluaties en over uitgevoerde evaluaties door de interne auditfunctie zoals bedoeld in
      [artikel 22a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel22a
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: 22a
        paragraaf: '8'
  - number: '30.2'
    text: 'Het fonds verstrekt in geval van wijzigingen tevens informatie over:'
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.2.a
    text: de door het fonds uitgevoerde pensioenregeling of pensioenregelingen;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.2.b
    text: de gevolgen van deze wijziging voor de toeslagverlening; en
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: 30.2.c
    text: de kenmerken van de pensioenregeling.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel30
  - number: '31'
    text: |-
      De door een verzekeraar of een premiepensioeninstelling op grond
      van [artikel 203, derde en vierde lid, van de Pensioenwet][ref1] of
      [artikel 197, derde en vierde lid, van de Wet verplichte beroepspensioenregeling][ref2] te verstrekken gegevens
      hebben uitsluitend betrekking op [artikel 30, eerste lid, onderdeel i en j en tweede lid, onderdeel b en c][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel203
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel197
      [ref3]: https://wetten.overheid.nl/BWBR0020871#Artikel30
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '203'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '197'
      - id: ref3
        bwb_id: BWBR0020871
        artikel: '30'
        paragraaf: '10'
  - number: '32'
    text: |-
      De Nederlandsche Bank stelt, met inachtneming van [hoofdstuk 7 van de Pensioenwet][ref1] en
      [hoofdstuk 6 van de Wet verplichte beroepspensioenregeling][ref2] alsmede met inachtneming van
      [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref3] en de internationale standaarden voor jaarrekeningen die door
      de Commissie van de Europese Gemeenschappen van toepassing zijn verklaard overeenkomstig artikel 3 van [verordening
      (EG) Nr. 1606/2002](32002R1606) van het Europees Parlement en de Raad van de Europese Unie van 19 juli 2002
      (PbEG L 243), regels met betrekking tot de te verstrekken gegevens, bedoeld in [artikel 30][ref4]. Deze omvatten
      uitsluitend:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0003045
      [ref4]: https://wetten.overheid.nl/BWBR0020871#Artikel30
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0020809
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0018831
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0003045
      - id: ref4
        bwb_id: BWBR0020871
        artikel: '30'
        paragraaf: '10'
  - number: 32.a
    text: de modellen waarin de gegevens worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel32
  - number: 32.b
    text: |-
      de reikwijdte en de mate van detaillering van de te verstrekken gegevens; deze omvatten geen uitbreiding of nadere
      rubricering van de in [artikel 30][ref1] geduide gegevens;


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel30
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: '30'
        paragraaf: '10'
  - number: 32.c
    text: de waardering van de posten;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel32
  - number: 32.d
    text: de te hanteren valuta en rekeneenheid;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel32
  - number: 32.e
    text: de afronding;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel32
  - number: 32.f
    text: |-
      de termijn waarbinnen de gegevens worden verstrekt; deze is niet korter dan noodzakelijk voor de uitoefening van
      het toezicht op de naleving van de [Pensioenwet][ref1] en de [Wet verplichte beroepspensioenregeling][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020809
      [ref2]: https://wetten.overheid.nl/BWBR0018831
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0020809
      - id: ref2
        bwb_id: BWBR0018831
  - number: 32.g
    text: |-
      de frequentie waarmee de gegevens worden verstrekt; deze bedraagt minimaal één maal en maximaal twaalf maal per
      jaar.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel32
  - number: '33.1'
    text: |-
      Het fonds, de verzekeraar en de premiepensioeninstelling verstrekken de gegevens, bedoeld in de
      [artikelen 30][ref1] en [31][ref2], langs elektronische weg aan De Nederlandsche Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0020871#Artikel31
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: '30'
        paragraaf: '10'
      - id: ref2
        bwb_id: BWBR0020871
        artikel: '31'
        paragraaf: '10'
  - number: '33.2'
    text: 'Het bestuur van het fonds zendt langs elektronische weg de volgende controleverklaringen aan De Nederlandsche Bank:'
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel33
  - number: 33.2.a
    text: |-
      de verklaring van de accountant inhoudende dat de gegevens, bedoeld in het eerste
      lid, gelijk zijn aan de gegevens waaromtrent de accountant een verklaring omtrent
      de getrouwheid als bedoeld in [artikel 147, vijfde lid, van de Pensioenwet][ref1] of
      [artikel 142, vijfde lid, van de Wet verplichte beroepspensioenregeling][ref2] heeft afgegeven en ten bewijze
      waarvan de staten door hem zijn gewaarmerkt; en


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel147
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel142
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '147'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '142'
  - number: 33.2.b
    text: |-
      de verklaring van de actuaris inhoudende dat de gegevens, bedoeld in het eerste lid, gelijk zijn aan de
      door hem gewaarmerkte actuariële staten, waaronder een actuarieel verslag voorzien van een verklaring van
      de actuaris als bedoeld in [artikel 147, derde lid, onderdeel h, en vierde lid, van de Pensioenwet][ref1] of
      [artikel 142, derde lid, onderdeel h, en vierde lid, van de Wet verplichte beroepspensioenregeling][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel147
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel142
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '147'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '142'
  - number: '33.3'
    text: |-
      De Nederlandsche Bank kan regels stellen met betrekking tot de inhoud van de controleverklaringen, bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel33
  - number: '34.1'
    text: |-
      De Nederlandsche Bank verstrekt de in [artikel 203 van de Pensioenwet][ref1] of
      [artikel 197 van de Wet verplichte beroepspensioenregeling][ref2] bedoelde gegevens op verzoek aan:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel203
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel197
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '203'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '197'
  - number: 34.1.a
    text: de Sociaal Economische Raad;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel34
  - number: 34.1.b
    text: de Stichting van de Arbeid; en
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel34
  - number: 34.1.c
    text: het Centraal Planbureau.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel34
  - number: '34.2'
    text: |-
      De Nederlandsche Bank kan de in [artikel 203 van de Pensioenwet][ref1] of
      [artikel 197 van de Wet verplichte beroepspensioenregeling][ref2] bedoelde gegevens verstrekken aan:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel203
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel197
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '203'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '197'
  - number: 34.2.a
    text: de Vereniging van Bedrijfstakpensioenfondsen;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel34
  - number: 34.2.b
    text: de Stichting voor Ondernemingspensioenfondsen;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel34
  - number: 34.2.c
    text: het Verbond van Verzekeraars; en
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel34
  - number: 34.2.d
    text: de Unie van Beroepspensioenfondsen;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel34
  - number: '34.3'
    text: De Nederlandsche Bank kan de in het eerste lid bedoelde gegevens verstrekken aan derden.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel34
  - number: '34.4'
    text: Onze Minister kan regels stellen ten aanzien van de gegevensverstrekking, bedoeld in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel34
  - number: '36.1'
    text: |-
      Een fonds dat op het tijdstip van inwerkingtreding van [artikel I, onderdeel P][ref1], en
      [artikel II, onderdeel N, van de Wet aanpassing financieel toetsingskader][ref2] gezien de beleidsdekkingsgraad
      niet beschikt over het vereist eigen vermogen, kan eenmalig het strategisch beleggingsbeleid aanpassen in afwijking
      van [artikel 16, vierde en vijfde lid][ref3], mits ten tijde van de aanpassing gezien de beleidsdekkingsgraad ten
      minste wordt beschikt over het minimaal vereist eigen vermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0036084#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0036084#ArtikelII
      [ref3]: https://wetten.overheid.nl/BWBR0020871#Artikel16
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0036084
        artikel: I
      - id: ref2
        bwb_id: BWBR0036084
        artikel: II
      - id: ref3
        bwb_id: BWBR0020871
        artikel: '16'
        paragraaf: '7'
  - number: '36.2'
    text: |-
      Onverminderd het eerste lid kan een fonds dat op het tijdstip van inwerkingtreding van de
      [Wet toekomst pensioenen][ref1] gezien de beleidsdekkingsgraad niet beschikt over het vereist eigen vermogen,
      eenmalig, na dit in het implementatieplan, bedoeld in [artikel 150i van de Pensioenwet][ref2] dan wel
      [artikel 145h van de Wet verplichte beroepspensioenregeling][ref3] te hebben onderbouwd, het strategisch
      beleggingsbeleid aanpassen in afwijking van [artikel 16, vierde en vijfde lid][ref4], mits dit past bij de
      risicohoudingen per cohort die voor het implementatieplan zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0048328
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel150i
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel145h
      [ref4]: https://wetten.overheid.nl/BWBR0020871#Artikel16
