    text: het beleid inzake de toedelingsregels rondom beschermingsrendementen en de overrendementen;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel25
  - number: 25.1.f
    text: |-
      het beleid aangaande de uitgangspunten, regels en procedures welke gelden ten aanzien van een solidariteitsreserve
      of een risicodelingsreserve;
    url: https://wetten.overheid.nl/BWBR0020871/2026-01-01#Artikel25
  - number: 25.1.g
    text: |-
      het beleid aangaande de uitgangspunten, regels en procedures welke gelden ten aanzien
      van een compensatiedepot als bedoeld in [artikel 150f van de Pensioenwet][ref1] of
      [artikel 145e van de Wet verplichte beroepspensioenregeling][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150f
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel145e
