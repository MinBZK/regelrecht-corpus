preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 11 juli 1995, AV/RV/95/1620;

    Gelet op de Richtlijnen van de Raad van de Europese Unie van 23 november 1993 betreffende een aantal aspecten van
    de organisatie van de arbeidstijd (PbEG 1993, L 307) en van 22 juni 1994 betreffende de bescherming van jongeren op
    het werk (PbEG 1994, L 216);

    Gelet op de artikelen 2:1, eerste lid, 2:7, eerste lid, 4:3, tweede en vierde lid, en 5:12, eerste lid, van de
    Arbeidstijdenwet;

    De Raad van State gehoord (advies van 4 september 1995, no. W12.95 0352);

    Gezien het nader rapport van voornoemde minister van 28 november 1995, Directie Wetgeving, Bestuurlijke en
    Juridische Aangelegenheden, nr. WBJA/W2/95/1377;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#ArtikelAanhef
articles:
  - number: 1:1
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - aanwezigheidsdienst: een aaneengesloten
      periode van ten hoogste 24 uren waarin de werknemer, zo nodig naast het verrichten van de bedongen arbeid,
      verplicht is op de arbeidsplaats aanwezig te zijn om op oproep zo spoedig mogelijk de bedongen arbeid te
      verrichten;
        - bereikbaarheidsdienst: een aaneengesloten periode van ten hoogste 24 uren waarin de werknemer, zo nodig naast het
      verrichten van de bedongen arbeid, verplicht is om bereikbaar te zijn om op oproep zo spoedig mogelijk de bedongen
      arbeid te verrichten;
        - mijnbouwwerk: hetgeen daaronder wordt verstaan in [artikel 1, onder n, van de Mijnbouwwet][ref1];
        - verpleging en verzorging: de verpleging, de verzorging, de begeleiding, de medische behandeling of het medisch
      onderzoek van personen in verband met hun lichamelijke of geestelijke gesteldheid dan wel hun gevorderde leeftijd;
        - vrijwillige brandweer: een werknemer van 18 jaar of ouder die zich als vrijwilliger beschikbaar heeft gesteld
      voor de brandweer en als zodanig door het bestuur van de veiligheidsregio of het college van burgemeester en
      wethouders is aangesteld en werkzaam is;
        - wet: de [Arbeidstijdenwet][ref2];
        - *windpark:* hetgeen daaronder wordt verstaan in [artikel 1 van de Wet windenergie op zee][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007671
