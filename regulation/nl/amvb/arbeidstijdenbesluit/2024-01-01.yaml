    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.152
  - number: 5.15:2.3
    text: |-
      In afwijking van het tweede lid, onder a, kan de werkgever de arbeid zodanig organiseren, dat de werknemer ten
      hoogste 26 maal in elke periode van 52 aaneengesloten weken ten hoogste 14 uren per dienst arbeid onderscheidenlijk
      nachtdienst verricht, mits die werknemer na die dienst onderscheidenlijk nachtdienst een onafgebroken rusttijd
      heeft van ten minste 24 uren.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.152
  - number: 5.15:2.4
    text: |-
