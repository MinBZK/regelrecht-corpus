        bwb_id: BWBR0007671
        artikel: '5'
  - number: 5.4:3.3
    text: 'De werkgever organiseert de arbeid zodanig, dat de jeugdige werknemer die arbeid in nachtdienst verricht:'
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.43
  - number: 5.4:3.3.a
    text: geen arbeid verricht tussen 22.00 uur en 04.00 uur;
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.43
  - number: 5.4:3.3.b
    text: ten hoogste 8 uren per nachtdienst en 40 uren per week arbeid verricht;
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.43
  - number: 5.4:3.3.c
    text: ten hoogste 4 maal in elke aaneengesloten periode van 7 maal 24 uren arbeid in nachtdienst verricht;
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.43
  - number: 5.4:3.3.d
    text: na het verrichten van arbeid in nachtdienst een onafgebroken rusttijd heeft van ten minste 14 uren.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.43
  - number: 5.4:3.4
    text: |-
      De in het derde lid, onder c, bedoelde aaneengesloten periode vangt aan op het eerste tijdstip van de dag waarop de
      jeugdige werknemer arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.43
  - number: 5.4:3.5
    text: |-
      Toepassing van dit artikel is uitsluitend mogelijk bij collectieve regeling. Elk beding waarbij wordt afgeweken van
      de vorige zin dan wel het tweede, derde, of vierde lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.43
  - number: 5.4:4.1
    text: |-
      Dit artikel is uitsluitend van toepassing op brood- en banketbakkerijen waar op ambachtelijke wijze werkzaamheden
      worden verricht en waar uitsluitend of in hoofdzaak wordt geproduceerd voor een of meer eigen brood- en
      banketwinkels.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.44
  - number: 5.4:4.2
    text: |-
      [Artikel 5:8, achtste en negende lid, van de wet][ref1] is niet van toepassing, indien dit artikel wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel5
