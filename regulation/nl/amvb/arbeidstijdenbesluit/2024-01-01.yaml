    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.52
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '5'
  - number: 5.5:2.2
    text: |-
      De werkgever organiseert de arbeid zodanig, dat in afwijking van
      [artikel 5:7, tweede lid, onder c, van de wet][ref1] de werknemer aan wie in een periode van 16 aaneengesloten
      weken 16 of meer malen consignatie is opgelegd, welke consignatie telkens geheel of gedeeltelijk perioden tussen
      00.00 uur en 06.00 uur omvat, in die periode van 16 aaneengesloten weken ten hoogste gemiddeld 50 uren per week
      arbeid verricht en in elke periode van 52 weken ten hoogste 40 uren per week arbeid verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.52
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '5'
  - number: 5.5:2.3
    text: |-
      Toepassing van dit artikel is uitsluitend mogelijk bij collectieve regeling. Elk beding waarbij wordt afgeweken van
      de vorige zin of het tweede lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.52
  - number: 5.6:1
    text: Deze paragraaf is uitsluitend van toepassing op arbeid verricht door defensiepersoneel dat als zodanig werkzaam is.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.61
  - number: 5.6:2.1
    text: |-
