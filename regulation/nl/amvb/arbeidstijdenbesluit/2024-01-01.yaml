  - number: 5.14:4a.3
    text: |-
      In afwijking van [artikel 5.14:2, derde lid, onder a][ref1], ten aanzien van het aantal malen dat een dienst wordt
      verricht, organiseert de werkgever de arbeid zodanig, dat de werknemer ten hoogste 15 maal in elke periode van 21
      aaneengesloten dagen een dienst verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007687#Artikel5
