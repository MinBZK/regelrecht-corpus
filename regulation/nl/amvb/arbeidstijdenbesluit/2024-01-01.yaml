  - number: 5.7:2.2
    text: 'De werkgever organiseert de arbeid zodanig, dat de personenchauffeur:'
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.72
  - number: 5.7:2.2.a
    text: gedurende ten hoogste 7 maal in elke periode van 14 aaneengesloten dagen arbeid verricht;
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.72
  - number: 5.7:2.2.b
    text: |-
      een onafgebroken rusttijd heeft van ten minste 8 uren in elke aaneengesloten periode van 24 uren welke rusttijd 3
      maal in elke periode van 7 dagen mag worden ingekort tot ten minste 6 uren.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.72
  - number: 5.7:2.3
    text: |-
      De in het tweede lid, onder b, bedoelde aaneengesloten periode vangt aan op het eerste tijdstip van de dag waarop
      de personenchauffeur arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.72
  - number: 5.7:2.4
    text: |-
      Toepassing van dit artikel is uitsluitend mogelijk bij collectieve regeling. Elk beding waarbij wordt afgeweken van
      de vorige zin dan wel het tweede lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.72
  - number: 5.7:3.1
    text: |-
      De dagelijkse rijtijd van een personenchauffeur bedraagt niet meer dan 9 uren per dag, welke rijtijd 2 maal in elke
      periode van 7 dagen mag worden verlengd tot 10 uren per dag.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.73
  - number: 5.7:3.2
    text: |-
      Onverminderd [artikel 5:4 van de wet][ref1], wordt de dagelijkse rijtijd onderbroken, indien door vermoeidheid van
      de personenchauffeur de verkeersveiligheid in het gedrang komt of dreigt te komen.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.73
