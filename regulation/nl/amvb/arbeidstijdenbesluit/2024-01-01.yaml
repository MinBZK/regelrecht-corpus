  - number: 5.14:7.3
    text: 'De werkgever organiseert de arbeid zodanig, dat de werknemer:'
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.147
  - number: 5.14:7.3.a
    text: |-
      in een periode van 26 weken ten hoogste 121 dagen op locatie doorbrengt, waarvan ten hoogste 28 dagen
      aaneengesloten;
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.147
  - number: 5.14:7.3.b
    text: |-
      na een periode van ten hoogste 28 aaneengesloten dagen op locatie een rust elders heeft van ten minste 7 maal 24
      aaneengesloten uren;
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.147
  - number: 5.14:7.3.c
    text: |-
      na arbeid te hebben verricht in een dienst onderscheidenlijk een nachtdienst een onafgebroken rusttijd heeft van
      ten minste 8 uren;
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.147
  - number: 5.14:7.3.d
    text: ten hoogste arbeid verricht gedurende 10 uren per dienst en 70 uren per week.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.147
  - number: 5.14:7.4
    text: |-
      Indien de werknemer minder dan 28 aaneengesloten dagen op locatie heeft doorgebracht organiseert de werkgever de
      arbeid van de werknemer zodanig, dat de werknemer een rust elders heeft van ten minste 2 maal 24 aaneengesloten
      uren voor elke aaneengesloten periode van 7 maal 24 uren die de werknemer op locatie heeft doorgebracht. De eerste
      zin wordt toegepast naar rato van het aantal uren dat de werknemer op locatie heeft doorgebracht, waarbij een
      minimum rust elders in acht wordt genomen van 24 aaneengesloten uren.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.147
  - number: 5.14:7.5
    text: |-
      Toepassing van dit artikel is uitsluitend mogelijk bij collectieve regeling. Elk beding waarbij wordt afgeweken van
      de vorige zin dan wel het tweede, derde of vierde lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.147
  - number: 5.14:8.1
    text: |-
      Dit artikel is uitsluitend van toepassing op arbeid die bestaat uit saturatieduiken en de direct daarmee
      samenhangende werkzaamheden, verricht ten behoeve van een mijnbouwinstallatie.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.148
  - number: 5.14:8.2
    text: |-
      De [artikelen 5:3, tweede lid][ref1], [5:5, tweede lid][ref2], en [5:7][ref3] en [5:8 van de wet][ref4] zijn niet
      van toepassing, indien dit artikel wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0007671#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0007671#Artikel5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.148
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0007671
        artikel: '5'
