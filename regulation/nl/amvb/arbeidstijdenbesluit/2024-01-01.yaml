  - number: 5.13:2.2
    text: 'De werkgever organiseert de arbeid zodanig, dat de werknemer:'
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.132
  - number: 5.13:2.2.a
    text: |-
      ten hoogste 4 maal in elke aaneengesloten periode van 7 maal 24 uren arbeid verricht in nachtdienst welke eindigt
      voor of op 02.00 uur;
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.132
  - number: 5.13:2.2.b
    text: |-
      na een nachtdienst als bedoeld onder a die wordt gevolgd door een dienst, niet zijnde een nachtdienst, een
      onafgebroken rusttijd heeft van ten minste 11 uren;
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.132
  - number: 5.13:2.2.c
    text: in de dienst, bedoeld onder b, ten hoogste 6 uren arbeid verricht, en
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.132
  - number: 5.13:2.2.d
    text: na de dienst, bedoeld onder b, een onafgebroken rusttijd heeft van ten minste 46 uren.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.132
  - number: 5.13:2.3
    text: |-
      Toepassing van dit artikel is uitsluitend mogelijk bij collectieve regeling. Elk beding waarbij wordt afgeweken van
      de vorige zin of het tweede lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.132
  - number: 5.14:1.1
    text: 'Deze paragraaf is van toepassing op werknemers van 18 jaar of ouder die arbeid verrichten:'
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.141
  - number: 5.14:1.1.a
    text: op een mijnbouwwerk;
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.141
  - number: 5.14:1.1.b
    text: vanaf of ten behoeve van een mijnbouwinstallatie.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.141
  - number: 5.14:1.2
    text: |-
      In deze paragraaf wordt onder mijnbouwinstallatie verstaan hetgeen daaronder wordt verstaan in
      [artikel 1, onder o, van de Mijnbouwwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel1
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.141
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '1'
  - number: 5.14:2.1
    text: Dit artikel is uitsluitend van toepassing op een werknemer die arbeid verricht op of vanaf een mijnbouwinstallatie.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.142
  - number: 5.14:2.2
    text: |-
      De [artikelen 5:3, tweede lid][ref1], [5:5, tweede lid][ref2], [5:7][ref3] en
      [5:8, eerste tot en met zevende lid, van de wet][ref4] zijn niet van toepassing, indien dit artikel wordt
      toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0007671#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0007671#Artikel5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.142
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0007671
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0007671
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0007671
        artikel: '5'
  - number: 5.14:2.3
    text: |-
      De werkgever organiseert de arbeid zodanig, dat de werknemer die in een bestendig en regelmatig arbeidstijdpatroon
      werkzaam is:
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.142
  - number: 5.14:2.3.a
    text: |-
      gedurende ten hoogste 14 maal in elke periode van 28 aaneengesloten dagen, ten hoogste 11 uren per dienst
      onderscheidenlijk per nachtdienst, en in een periode van 16 aaneengesloten weken gemiddeld 40 uren per week arbeid
      verricht;
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.142
  - number: 5.14:2.3.b
    text: |-
      na het verrichten van arbeid in die dienst onderscheidenlijk nachtdienst een onafgebroken rusttijd heeft van ten
      minste 12 uren, welke rusttijd 4 maal in elke periode van 28 aaneengesloten dagen mag worden ingekort tot ten
      minste 8 uren.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.142
  - number: 5.14:2.4
    text: |-
      De arbeidstijd per dienst onderscheidenlijk per nachtdienst kan in afwijking van het derde lid, onderdeel a, 2 maal
      in elke periode van 28 aaneengesloten dagen worden verlengd met ten hoogste één uur voor het verrichten van arbeid
      die bestaat uit oefeningen en trainingen die tot doel hebben de bekwaamheid en de bedrevenheid in het uitvoeren van
      maatregelen en procedures ten tijde van ongelukken en calamiteiten te verkrijgen of te behouden.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.142
  - number: 5.14:2.5
    text: |-
      Indien het vierde lid wordt toegepast kan in afwijking van het derde lid, onder b, de onafgebroken rusttijd van ten
      minste 12 uren worden ingekort met ten hoogste één uur.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.142
  - number: 5.14:2.6
    text: 'Indien dit artikel wordt toegepast, organiseert de werkgever de arbeid van de werknemer zodanig, dat:'
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.142
  - number: 5.14:2.6.a
    text: |-
      tegenover iedere periode van 24 uren welke wordt doorgebracht op of vanaf een mijnbouwinstallatie in een periode
      van 16 aaneengesloten weken een onafgebroken rusttijd staat van ten minste 24 uren elders;
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.142
  - number: 5.14:2.6.b
    text: |-
      alle werknemers, die gelijksoortige werkzaamheden verrichten en in een bestendig en regelmatig arbeidstijdpatroon
      werkzaam zijn, die arbeid in een zelfde arbeidstijdpatroon verrichten.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.142
  - number: 5.14:2.7
    text: |-
      De rusttijd van ten minste 24 uren, bedoeld in het zesde lid, onderdeel a, mag uitsluitend worden onderbroken
      ten behoeve van niet op de reguliere arbeidsplaats plaatsvindende oefeningen en trainingen ten behoeve van het
      verkrijgen en behouden van de bekwaamheid en de bedrevenheid in het uitvoeren van maatregelen en procedures ten
      tijde van ongelukken en calamiteiten. In een periode van 52 achtereenvolgende weken mag de in de vorige volzin
      bedoelde onderbreking ten hoogste 20 dagen duren, waarvan ten hoogste 5 dagen aaneengesloten.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.142
  - number: 5.14:2.8
    text: |-
      Indien het zevende lid, eerste zin, van toepassing is, organiseert de werkgever de arbeid zodanig, dat de werknemer
      die in een bestendig en regelmatig arbeidstijdpatroon werkzaam is, in een periode van 52 aaneengesloten weken ten
      hoogste gemiddeld 40 uren per week arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.142
  - number: 5.14:3.1
    text: |-
      Dit artikel is uitsluitend van toepassing op een werknemer die werkzaamheden in een bestendig en regelmatig
      arbeidspatroon verricht op een mijnbouwwerk, niet zijnde een mijnbouwinstallatie.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.143
  - number: 5.14:3.2
    text: |-
      De [artikelen 5:3, tweede lid][ref1], [5:5, tweede lid][ref2], [5:7][ref3] en
      [5:8, eerste tot en met zevende lid, van de wet][ref4] zijn niet van toepassing, indien dit artikel wordt
      toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0007671#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0007671#Artikel5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.143
    references:
