    text: |-
      Voor de toepassing van [paragraaf 5.2 van de wet][ref1] wordt de jeugdige werknemer, met inachtneming van het derde
      lid, gelijkgesteld aan de werknemer van 18 jaar of ouder. Voor de toepassing van dit besluit, met uitzondering van
      [hoofdstuk 2][ref2], is de eerste volzin van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Paragraaf5.2
      [ref2]: https://wetten.overheid.nl/BWBR0007687#Hoofdstuk2
