    text: 'De werkgever organiseert de arbeid zodanig, dat de werknemer:'
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.148
  - number: 5.14:8.3.a
    text: |-
      gedurende ten hoogste 28 maal achtereen ten hoogste 11 uren per dienst onderscheidenlijk per nachtdienst en in een
      periode van 16 aaneengesloten weken gemiddeld 40 uren per week arbeid verricht;
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.148
  - number: 5.14:8.3.b
    text: na arbeid te hebben verricht in die dienst een onafgebroken rusttijd heeft van ten minste 12 uren, en
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.148
  - number: 5.14:8.3.c
    text: |-
      tegenover iedere periode van 24 uren waarin arbeid wordt verricht na het beëindigen van die arbeid direct
      aansluitend een onafgebroken rusttijd heeft van ten minste 24 uren elders.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.148
  - number: 5.14:8.4
    text: |-
      Toepassing van dit artikel is uitsluitend mogelijk bij collectieve regeling. Elk beding waarbij wordt afgeweken van
      de vorige zin dan wel het tweede of derde lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.148
  - number: 5.15:1
    text: |-
      Deze paragraaf is van toepassing op arbeid, verricht in een bioscoop door een werknemer van 18 jaar of ouder en die
      bestaat uit het uitsluitend of in hoofdzaak:
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.151
  - number: 5.15:1.a
    text: bedienen van filmapparatuur als operateur of leerlingoperateur, of
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.151
  - number: 5.15:1.b
    text: het namens de werkgever en in diens plaats uitoefenen van het bioscoopbedrijf.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.151
  - number: 5.15:2.1
    text: |-
      De [artikelen 5:3, tweede lid][ref1], [5:7, tweede lid, onderdelen a en b][ref2], en
      [5:8, eerste, tweede en derde lid, van de wet][ref3] zijn niet van toepassing, indien dit artikel wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0007671#Artikel5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.152
