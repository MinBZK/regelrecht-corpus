  - number: 7:2.1
    text: |-
      Na een herhaling van een overtreding of soortgelijke overtreding wordt een waarschuwing gegeven als bedoeld in
      [artikel 8:3a, eerste lid, van de wet][ref1] en indien een herhaling van die of een soortgelijke overtreding is
      geconstateerd als bedoeld in dat artikel van de wet, wordt een bevel opgelegd door de daartoe aangewezen ambtenaar
      dat de door hem aangewezen werkzaamheden voor een daarbij aangegeven periode worden gestaakt dan wel niet mogen
      aanvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel8
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '8'
  - number: 7:2.2
    text: |-
      Indien een ernstige overtreding is geconstateerd, wordt in afwijking van het eerste lid, een waarschuwing als
      bedoeld in [artikel 8:3a, eerste lid, van de wet][ref1] gegeven bij de eerste overtreding en wordt, indien opnieuw
      dezelfde of een soortgelijke overtreding is geconstateerd die eveneens ernstig is, een bevel opgelegd door de
      daartoe aangewezen ambtenaar dat de door hem aangewezen werkzaamheden voor een daarbij aangegeven periode worden
      gestaakt dan wel niet mogen aanvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel8
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '8'
  - number: 7:2.3
    text: 'Als een ernstige overtreding als bedoeld in het tweede lid wordt aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel72
  - number: 7:2.3.a
    text: |-
      een handelen of nalaten van de werkgever in strijd met het bepaalde bij of krachtens
      [artikel 3:2, eerste lid][ref1], juncto [artikel 3:3 van de wet][ref2] indien arbeid wordt verricht door een kind
      jonger dan 12 jaar;


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel3
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0007671
        artikel: '3'
  - number: 7:2.3.b
    text: |-
      een handelen of nalaten van de werkgever in strijd met het bepaalde bij of krachtens
      [artikel 3:2, eerste en vierde lid][ref1], en [artikel 3:3, tweede lid, van de wet][ref2] indien het kind bij het
      verrichten van arbeid een ongeval overkomt dat ernstig lichamelijk of geestelijk letsel of de dood ten gevolge
      heeft of indien redelijkerwijs te verwachten is dat de hiervoor genoemde gevolgen redelijkerwijs aan het verrichten
      van arbeid zijn verbonden;


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel3
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0007671
        artikel: '3'
  - number: 7:2.3.c
    text: |-
      een handelen of nalaten van de werkgever waardoor een werknemer ten minste het dubbele van het in de wet en de
      daarop berustende bepalingen toegestane aantal uren dat hij per dienst arbeid mag verrichten, arbeid verricht
      dan wel de onafgebroken rusttijd in elke aaneengesloten periode van 24 uren de helft of minder is van de in de
      [wet][ref1] en de daarop berustende bepalingen gegeven onafgebroken rusttijd.


      [ref1]: https://wetten.overheid.nl/BWBR0007671
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0007671
  - number: 7:2.4
    text: |-
      Indien de aard van de overtreding of de met de overtreding samenhangende omstandigheden dan wel de gevolgen van het
      staken van het werk daartoe aanleiding geven, kan worden afgezien van een waarschuwing als bedoeld in het eerste en
      tweede lid en kan worden afgezien van een bevel als bedoeld in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel72
  - number: 7:2.5
    text: |-
      Een waarschuwing als bedoeld in het eerste en tweede lid wordt niet gegeven en een bevel als bedoeld in het eerste
      en tweede lid wordt niet opgelegd indien de bestuurlijke boete voor de overtreding, bedoeld in het eerste en tweede
      lid, op grond van de beleidsregels, bedoeld in [artikel 10:7, zesde lid, van de wet][ref1] lager is dan een bij
      ministeriële regeling vast te stellen hoogte van het boetebedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel10
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '10'
  - number: 7:3
    text: |-
      Ernstige overtredingen in de zin van [artikel 10:7, derde en vijfde lid, van de wet][ref1] zijn de overtredingen,
      genoemd in [artikel 7:2, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0007687#Artikel7
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0007687
        artikel: '7'
        hoofdstuk: '7'
  - number: 7:4
    text: |-
      De soortgelijke verplichtingen en verboden, bedoeld in [artikel 10:7, tweede en vierde lid, van de we][ref1]t,
      en de soortgelijke overtredingen, bedoeld in [artikel 7:2, eerste en tweede lid][ref2], worden bij ministeriële
      regeling aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0007687#Artikel7
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0007687
        artikel: '7'
        hoofdstuk: '7'
  - number: 8.1:1.1
    text: |-
      In afwijking van [artikel 5:8, achtste en negende lid, van de wet][ref1] organiseert de werkgever de arbeid
      zodanig, dat de werknemer in elke periode van 4 aaneengesloten weken ten hoogste 20 malen arbeid verricht in een
      nachtdienst die eindigt na 02.00 uur, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel8.11
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '5'
  - number: 8.1:1.1.a
    text: |-
      die werknemer direct voorafgaand aan het tijdstip van de inwerkingtreding van de wet en de daarop berustende
      bepalingen een aantal jaren aaneengesloten volgens een arbeidstijdpatroon dat daarmee gelijkenis vertoont arbeid
      heeft verricht;
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel8.11
  - number: 8.1:1.1.b
    text: |-
      het in onderdeel a bedoelde arbeidstijdpatroon niet in strijd is geweest met de voor het tijdstip van
      inwerkingtreding van de wet op die arbeid van toepassing zijnde wet- en regelgeving terzake van arbeids- en
      rusttijden;
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel8.11
  - number: 8.1:1.1.c
    text: dit door het op een andere wijze organiseren van de arbeid redelijkerwijs niet is te voorkomen.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel8.11
  - number: 8.1:1.2
    text: |-
      Zolang het eerste lid van toepassing is, bewaart de werkgever de gegevens en bescheiden die betrekking hebben op
      dat artikellid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel8.11
  - number: 8.3:1
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel8.31
  - number: 8.3:2
    text: 'Dit besluit wordt aangehaald als: Arbeidstijdenbesluit.'
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel8.32
