        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.14'
  - number: 3.1:2.2
    text: |-
      De werknemer, bedoeld in het eerste lid, draagt tijdens het verrichten van de arbeid de in dat lid bedoelde
      registratie bij zich.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel3.12
  - number: 3.1:2.3
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op een persoon als bedoeld in [artikel 2.2:1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007687#Artikel2
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel3.12
    references:
