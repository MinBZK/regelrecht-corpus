      Deze paragraaf is uitsluitend van toepassing op arbeid verricht door een werknemer van 18 jaar of ouder, die arbeid
      van huishoudelijke aard verricht in of ten behoeve van een particuliere huishouding, waarbij die werknemer in de
      particuliere huishouding inwoont.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.101
