  - number: 5.15:2.2.c
    text: ten hoogste gemiddeld 40 uren per week in elke periode van 52 aaneengesloten weken arbeid verricht, en
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.152
