  - number: 3.1:1
    text: |-
      De werkgever zorgt er voor, dat op een bemand mijnbouwwerk of windpark de op dat mijnbouwwerk of windpark
      betrekking hebbende deugdelijke registratie, bedoeld in [artikel 4:3, eerste lid, van de wet][ref1] aanwezig is.
      Een afschrift van deze registratie dient na ten hoogste 6 weken, gerekend vanaf de datum waarop de desbetreffende
      gegevens en bescheiden betrekking hebben, aanwezig te zijn in het hoofdkantoor van de werkgever in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel4
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '4'
  - number: 3.1:2.1
    text: |-
      Indien [artikel 5.14:4][ref1] of [5.14:4a][ref2] van toepassing of van overeenkomstige toepassing is, zorgt de
      werkgever er voor dat de registratie van de arbeids- en rusttijden van de werknemer plaatsvindt volgens een door
      Onze Minister vastgesteld model.


      [ref1]: https://wetten.overheid.nl/BWBR0007687#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007687#Artikel5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0007687
        artikel: '5'
