        paragraaf: '5.14'
      - id: ref3
        bwb_id: BWBR0007687
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.14'
  - number: 5.14:4a.2
    text: |-
      Indien de aard van de arbeid of de bedrijfsomstandigheden dit noodzakelijk maken kan bij collectieve
      regeling, met inachtneming van het derde lid, ten hoogste 2 maal in elke periode van 52 weken worden
      afgeweken van [artikel 5.14:2, derde lid, onder a][ref1], ten aanzien van het aantal malen dat een dienst
      wordt verricht. Elk beding, waarbij op andere wijze dan in de vorige zin is bepaald, wordt afgeweken van
      [artikel 5.14:2, derde lid, onder a][ref2], is nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0007687#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007687#Artikel5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.144a
    references:
      - id: ref1
        bwb_id: BWBR0007687
        artikel: '5'
