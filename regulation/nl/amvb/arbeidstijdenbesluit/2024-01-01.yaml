  - number: 2.1:4.1
    text: |-
      [Artikel 5:5, tweede lid, onder b, van de wet][ref1], is niet van toepassing op arbeid verricht door werknemers in
      handelsondernemingen en kantoren.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '5'
  - number: 2.1:4.2
    text: |-
      Het eerste lid blijft buiten toepassing indien de aard van de arbeid of de bedrijfsomstandigheden dit met zich
      brengen.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel2.14
  - number: 2.1:4.3
    text: |-
      Het tweede lid kan uitsluitend bij collectieve regeling of, indien geen collectieve regeling van toepassing is dan
      wel de collectieve regeling geen bepalingen terzake bevat, telkens met instemming van de betrokken werknemer worden
      toegepast. Elk beding waarbij op andere wijze dan in de vorige zin of het tweede lid is bepaald, het eerste lid
      buiten toepassing wordt gelaten, is nietig.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel2.14
  - number: 2.1:5
    text: |-
      [Artikel 5:6 van de wet][ref1] is niet van toepassing op arbeid verricht door de werknemer in verband met het
      vervullen van een geestelijk ambt alsmede op arbeid verricht door de werknemer die hem in de uitoefening van dat
      ambt bijstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '5'
  - number: 2.2:1
    text: |-
      [Paragraaf 5.1 van de wet][ref1] en - voor zover aangeduid als overtredingen - de
      [paragrafen 5.2 tot en met 5.5 van de wet][ref2] en de daarop berustende bepalingen zijn van overeenkomstige
      toepassing op de persoon, die zonder werkgever of werknemer te zijn in de zin van de wet, arbeid verricht op of
      vanaf of ten behoeve van een mijnbouwwerk of een windpark.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Paragraaf5.1
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Paragraaf5.2
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel2.21
