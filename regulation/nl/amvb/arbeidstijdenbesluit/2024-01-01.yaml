    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.192
  - number: 5.19:3.1
    text: |-
      Uitsluitend bij collectieve regeling kan, met inachtneming van het tweede en derde lid, aan een werknemer een
      bereikbaarheidsdienst worden opgelegd. Elk beding waarin op andere wijze dan in de eerste zin is bepaald, gebruik
      wordt gemaakt van het tweede of derde lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.193
  - number: 5.19:3.2
    text: |-
      De werkgever organiseert de arbeid zodanig dat een werknemer ten hoogste 3 maal in elke aaneengesloten periode van
      7 maal 24 uren en 32 maal in elke periode van 16 aaneengesloten weken een bereikbaarheidsdienst wordt opgelegd.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.193
  - number: 5.19:3.3
    text: |-
