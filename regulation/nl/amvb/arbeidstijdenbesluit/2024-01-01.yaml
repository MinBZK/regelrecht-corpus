      Toepassing van dit artikel is uitsluitend mogelijk bij collectieve regeling. Elk beding waarbij wordt afgeweken van
      de vorige zin dan wel het tweede of derde lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.122
  - number: 5.13:1
    text: |-
      Deze paragraaf is uitsluitend van toepassing op een werknemer van 18 jaar of ouder die arbeid verricht in
      of op een spoorvoertuig, gebezigd voor vervoer van personen over lokale spoorwegen, aangewezen krachtens
      [artikel 2, eerste lid, van de Wet lokaal spoor][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034363#Artikel2
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.131
    references:
      - id: ref1
        bwb_id: BWBR0034363
        artikel: '2'
  - number: 5.13:2.1
    text: |-
      [Artikel 5:8, vijfde lid, van de wet][ref1] is niet van toepassing, indien dit artikel wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.132
