        artikel: '5'
      - id: ref4
        bwb_id: BWBR0007671
        artikel: '5'
  - number: 5.14:3.3
    text: |-
      [Artikel 5.14:2, derde tot en met achtste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007687#Artikel5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.143
    references:
