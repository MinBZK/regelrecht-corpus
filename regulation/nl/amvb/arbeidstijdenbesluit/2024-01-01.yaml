  - number: 2.1:3
    text: |-
      [Paragraaf 5.2 van de wet][ref1] en de daarop berustende bepalingen zijn van toepassing op arbeid verricht door een
      werknemer van 18 jaar of ouder in dienst van de Dienst Koninklijk Huis, tenzij bijzondere omstandigheden om redenen
      van veiligheid en privacy samenhangend met de leden van het Koninklijk Huis de toepassing van die paragraaf en de
      daarop berustende bepalingen belemmeren.


