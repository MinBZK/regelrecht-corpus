        bwb_id: BWBR0007687
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 3.1:2.4
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de inhoud, de invulling en het gebruik van de
      in het eerste lid bedoelde registratie.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel3.12
  - number: 3.2:1
    text: |-
      De werkgever en de persoon als bedoeld in [artikel 2:7, eerste lid][ref1], van de wet bewaart de gegevens en
      bescheiden met betrekking tot de in [artikel 4:3][ref2] van de wet neergelegde registratieverplichting ten minste
      52 weken, gerekend vanaf de datum waarop de desbetreffende gegevens en bescheiden betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel4
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel3.21
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007671
        artikel: '4'
  - number: 3.3:1
    text: |-
      De werkgever houdt een register bij van alle werknemers die instemming hebben verleend als bedoeld in
      [artikel 4.8:2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007687#Artikel4
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel3.31
    references:
      - id: ref1
        bwb_id: BWBR0007687
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.8'
  - number: 4.1:1.1
    text: Deze paragraaf is uitsluitend van toepassing op arbeid verricht in het kader van een alternatieve sanctie.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.11
  - number: 4.1:1.2
    text: 'Voor de toepassing van deze paragraaf wordt onder alternatieve sanctie verstaan:'
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.11
  - number: 4.1:1.2.a
    text: |-
      een project ter uitvoering van de straf van onbetaalde arbeid ten algemenen nutte, bedoeld in
      [artikel 9, eerste lid, onder a, onder 3°, van het Wetboek van Strafrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel9
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '9'
  - number: 4.1:1.2.b
    text: |-
      de deelneming aan een project als bedoeld in [artikel 77e van het Wetboek van Strafrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77e
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77e
  - number: 4.1:1.2.c
    text: |-
      de vervulling van de voorwaarde, bedoeld in [artikel 77f, eerste lid, onder b, van het Wetboek van Strafrecht][ref1],
      of


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77f
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77f
  - number: 4.1:1.2.d
    text: |-
      de uitvoering van de alternatieve sanctie, bedoeld in
      [artikel 77h, tweede lid, van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77h
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77h
  - number: 4.1:2.1
    text: |-
      In afwijking van [artikel 5:7, eerste lid van de wet][ref1] kan dit artikel worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '5'
  - number: 4.1:2.2
    text: |-
      De werkgever voor wie de jeugdige werknemer arbeid in het kader van een alternatieve sanctie verricht, organiseert
      de arbeid zodanig, dat die werknemer ten hoogste 10 uren per dienst en 55 uren per week arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.12
  - number: 4.1:3.1
    text: |-
      [Artikel 5:15, eerste tot en met vierde lid en zesde en zevende lid, van de wet][ref1] is niet van toepassing op
      arbeid verricht in het kader van een alternatieve sanctie.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '5'
  - number: 4.1:3.2
    text: |-
      De werknemer die bij een werkgever arbeid verricht in het kader van een alternatieve sanctie, verstrekt aan die
      werkgever uit eigen beweging tijdig de voor de naleving van de wet en de daarop berustende bepalingen nodige
      inlichtingen betreffende zijn arbeid.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.13
  - number: 4.2:1.1
    text: |-
      In afwijking van de [artikelen 5:7, tweede lid, onder a][ref1], en [5:8, eerste lid, van de wet][ref2] kan dit
      artikel worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0007671
        artikel: '5'
  - number: 4.2:1.2
    text: |-
      De werkgever organiseert de arbeid voorafgaand aan Nieuwjaarsdag, de Christelijke Eerste of Tweede Paasdag, de dag
      waarop de verjaardag van de Koning wordt gevierd, Hemelvaartsdag, de Christelijke Eerste of Tweede Pinksterdag,
      5 december en de Eerste of Tweede Kerstdag zodanig dat de werknemer van 18 jaar of ouder in de aaneengesloten
      periode van 7 dagen voorafgaand aan die dag ten hoogste 2 maal 14 uren per dienst onderscheidenlijk per nachtdienst
      arbeid verricht, indien de aard van de arbeid of de bedrijfsomstandigheden dit in verband met die feestdag met
      zich brengen.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.21
  - number: 4.2:1.3
    text: |-
      Indien een door godsdienstige of levensbeschouwelijke opvattingen ingegeven andere dag dan een dag als bedoeld in
      het tweede lid de aard van de arbeid of de bedrijfsomstandigheden beïnvloedt op een wijze die gelijkenis vertoont
      met de beïnvloeding van een in dat lid bedoelde dag, is dat lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.21
  - number: 4.3:1.1
    text: |-
      In afwijking van de [artikelen 5:7, tweede lid, onder a][ref1], en [artikel 5:8, eerste lid, van de wet][ref2] kan
      dit artikel worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.31
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0007671
        artikel: '5'
  - number: 4.3:1.2
    text: |-
      Indien de arbeid geen uitstel gedoogt en door het nemen van andere maatregelen redelijkerwijs niet is te voorkomen,
      organiseert de werkgever de arbeid zodanig, dat de werknemer van 18 jaar of ouder ten hoogste eenmaal in elke
      periode van 2 aaneengesloten weken 14 uren per dienst onderscheidenlijk per nachtdienst arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.31
  - number: 4.4:1.1
    text: |-
      Ten aanzien van de arbeidstijd per dienst onderscheidenlijk per nachtdienst en de onafgebroken rusttijd
      kan, in afwijking van [paragraaf 5.2 van de wet][ref1] alsmede de [paragrafen 4.2][ref2] en [4.7][ref3] en
      [hoofdstuk 5][ref4], dit artikel worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Paragraaf5.2
      [ref2]: https://wetten.overheid.nl/BWBR0007687#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0007687#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0007687#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.41
    references:
      - id: ref1
        bwb_id: BWBR0007671
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0007687
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0007687
        hoofdstuk: '4'
        paragraaf: '4.7'
      - id: ref4
        bwb_id: BWBR0007687
        hoofdstuk: '5'
  - number: 4.4:1.2
    text: |-
      De werkgever organiseert de arbeid zodanig, dat de arbeidstijd per dienst onderscheidenlijk per nachtdienst en de
      onafgebroken rusttijd met ten hoogste 15 aaneengesloten minuten wordt verlengd onderscheidenlijk ingekort, indien
      de werkzaamheden van de werknemer van 18 jaar of ouder aan het einde van zijn dienst onderscheidenlijk nachtdienst
      worden overgenomen en direct daaropvolgend worden voortgezet door een andere werknemer en een goede voortgang van
      die werkzaamheden overdracht noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.41
  - number: 4.4:1.3
    text: |-
      Op de afwijking, bedoeld in het tweede lid, zijn [artikel 5:8, achtste en negende lid, van de wet][ref1] en
      de [artikelen 5.1:3, derde lid, onder d][ref2], [5.4:4, derde lid][ref3] en [5.8:1, derde lid][ref4], niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007687#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0007687#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0007687#Artikel5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.41
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0007687
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref3
        bwb_id: BWBR0007687
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref4
        bwb_id: BWBR0007687
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.8'
  - number: 4.6:1.1
    text: |-
      [Artikel 5:4, tweede en derde lid, van de wet][ref1] is niet van toepassing, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.61
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '5'
  - number: 4.6:1.1.a
    text: |-
      de werknemer werkzaamheden verricht zonder enig direct contact met een andere werknemer die vergelijkbare
      werkzaamheden verricht, of
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.61
  - number: 4.6:1.1.b
    text: |-
      de aard van de arbeid het noodzakelijk maakt dat de afwisseling van de arbeid per dienst onderscheidenlijk
      nachtdienst door een pauze onmogelijk is en dit door het op een andere wijze organiseren van de arbeid
      redelijkerwijs niet is te voorkomen.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.61
  - number: 4.6:1.2
    text: 'Indien het eerste lid wordt toegepast organiseert de werkgever de arbeid zodanig, dat in afwijking van:'
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.61
  - number: 4.6:1.2.a
    text: |-
      [artikel 5:7, tweede lid, onder c, van de wet][ref1], de werknemer in elke periode van 16 aaneengesloten weken ten
      hoogste gemiddeld 44 uren per week arbeid verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.61
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '5'
  - number: 4.6:1.2.b
    text: |-
      [artikel 4.7:1, tweede lid, onder a][ref1], de werknemer ten hoogste gedurende 10 uren in een nachtdienst arbeid
      verricht, welke 2 maal kan worden verlengd tot ten hoogste 12 uren in een nachtdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0007687#Artikel4
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.61
    references:
      - id: ref1
        bwb_id: BWBR0007687
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.7'
  - number: 4.6:1.3
    text: |-
      Toepassing van dit artikel is uitsluitend mogelijk bij collectieve regeling. Elk beding waarbij wordt afgeweken van
      de vorige zin of tweede lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.61
  - number: 4.6:2.1
    text: |-
      [Artikel 5:9, tweede lid, van de wet][ref1] is niet van toepassing, indien de aard van de arbeid het noodzakelijk
      maakt dat de werknemer tijdens een pauze op oproep zo spoedig mogelijk de bedongen arbeid verricht en dit door het
      op een andere wijze organiseren van de arbeid redelijkerwijs niet is te voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.62
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '5'
  - number: 4.6:2.2
    text: |-
      Een pauze als bedoeld in het eerste lid wordt aangemerkt als een pauze als bedoeld in
      [artikel 5:4, tweede of derde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.62
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '5'
  - number: 4.6:2.3
    text: |-
      Toepassing van dit artikel is uitsluitend mogelijk bij collectieve regeling. Elk beding waarbij wordt afgeweken van
      de vorige zin of het eerste lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.62
  - number: 4.7:1.1
    text: |-
      [Artikel 5:8, eerste, derde en vierde lid, van de wet][ref1] is niet van toepassing, indien dit artikel wordt
      toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.71
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '5'
  - number: 4.7:1.2
    text: |-
      De werkgever organiseert de arbeid zodanig, dat de werknemer in de periode tussen vrijdag 18.00 uur en de daarop
      volgende maandag 08.00 uur:
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.71
  - number: 4.7:1.2.a
    text: |-
      ten hoogste arbeid verricht gedurende 10 uren in een nachtdienst, welke 2 maal kan worden verlengd tot ten hoogste
      11 uren in een nachtdienst, en
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.71
  - number: 4.7:1.2.b
    text: aansluitend op een nachtdienst als bedoeld onder a een onafgebroken rusttijd heeft van ten minste 12 uren.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.71
  - number: 4.7:1.3
    text: |-
      Bij toepassing van het tweede lid organiseert de werkgever de arbeid zodanig, dat de werknemer in elke periode van
      52 aaneengesloten weken ten minste 26 perioden van zaterdag 00.00 uur tot de daarop volgende zondag 24.00 uur geen
      arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.71
  - number: 4.7:1.4
    text: |-
      Toepassing van dit artikel is uitsluitend mogelijk bij collectieve regeling. Elk beding waarbij wordt afgeweken van
      de vorige zin dan wel het tweede of derde lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.71
  - number: 4.7:2.1
    text: |-
      [Artikel 5:8, eerste, derde en vierde lid, van de wet][ref1] is niet van toepassing, indien dit artikel wordt
      toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.72
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '5'
  - number: 4.7:2.2
    text: |-
      Dit artikel is uitsluitend van toepassing, indien gebruik wordt gemaakt van [artikel 4.7:1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007687#Artikel4
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.72
    references:
      - id: ref1
        bwb_id: BWBR0007687
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.7'
  - number: 4.7:2.3
    text: |-
      Indien zich bij toepassing van [artikel 4.7:1][ref1] in een andere periode dan de periode, bedoeld in het tweede
      lid van genoemd artikel, incidentele en onvoorziene omstandigheden voordoen waardoor het aantal voor de arbeid
      noodzakelijke werknemers onder het vereiste minimum komt, dan wel op Nieuwjaarsdag, de Christelijke Tweede Paasdag,
      de dag waarop de verjaardag van de Koning wordt gevierd, Hemelvaartsdag, de Christelijke Tweede Pinksterdag,
      5 december, Eerste Kerstdag of Tweede Kerstdag, organiseert de werkgever die arbeid zodanig dat de werknemer:


      [ref1]: https://wetten.overheid.nl/BWBR0007687#Artikel4
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.72
    references:
      - id: ref1
        bwb_id: BWBR0007687
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.7'
  - number: 4.7:2.3.a
    text: |-
      ten hoogste 2 maal in elke aaneengesloten periode van 14 maal 24 uren, en ten hoogste 8 malen in elke
      aaneengesloten periode van 52 weken, ten hoogste arbeid verricht gedurende 12 uren in een nachtdienst, en
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.72
  - number: 4.7:2.3.b
    text: aansluitend op een nachtdienst als bedoeld onder a een onafgebroken rusttijd heeft van ten minste 12 uren.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.72
  - number: 4.7:2.4
    text: |-
      Toepassing van dit artikel is uitsluitend mogelijk bij collectieve regeling. Elk beding waarbij wordt afgeweken van
      de vorige zin dan wel het tweede of derde lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.72
  - number: 4.8:1.1
    text: |-
      De [artikelen 5:3, tweede lid][ref1], [5:5, tweede lid][ref2], [5:7, tweede tot en met vierde lid][ref3], en
      [5:8 van de wet][ref4] zijn niet van toepassing, indien de aard van de arbeid het noodzakelijk maakt dat de arbeid
      regelmatig of voor een aanzienlijk deel in een aanwezigheidsdienst wordt verricht en dit door het op een andere
      wijze organiseren van de arbeid redelijkerwijs niet is te voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0007671#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0007671#Artikel5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.81
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0007671
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0007671
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0007671
        artikel: '5'
  - number: 4.8:1.2
    text: |-
      Een aanwezigheidsdienst wordt, met inachtneming van het derde, vierde of vijfde lid, uitsluitend bij collectieve
      regeling aan een werknemer van 18 jaar of ouder opgelegd. Elk beding waarin op andere wijze dan in de eerste zin is
      bepaald, gebruik wordt gemaakt van het derde, vierde of vijfde lid is nietig.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.81
  - number: 4.8:1.3
    text: 'De werkgever organiseert de arbeid zodanig dat de werknemer:'
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.81
  - number: 4.8:1.3.a
    text: ten hoogste 52 maal in elke periode van 26 achtereenvolgende weken een aanwezigheidsdienst wordt opgelegd;
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.81
  - number: 4.8:1.3.b
    text: ten hoogste gemiddeld 48 uren per week in elke periode van 26 achtereenvolgende weken arbeid verricht;
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.81
  - number: 4.8:1.3.c
    text: |-
      zowel voorafgaand aan als aansluitend op een aanwezigheidsdienst een onafgebroken rusttijd heeft van ten minste 11
      uren, en
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.81
  - number: 4.8:1.3.d
    text: |-
      in elke aaneengesloten periode van 7 maal 24 uren een rusttijd heeft van ten minste 90 uren, welke rusttijd bestaat
      uit een onafgebroken rustperiode van ten minste 24 uren, alsmede zes onafgebroken rustperioden van ten minste 11
      uren, waarbij onafgebroken rustperioden aaneengesloten kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.81
  - number: 4.8:1.4
    text: |-
      Uitsluitend bij collectieve regeling kan, met inachtneming van het vijfde lid, van het derde lid, onderdeel c of d,
      in uitzonderlijke gevallen worden afgeweken, indien de aard van de arbeid of bedrijfsomstandigheden dat objectief
      rechtvaardigen. Elk beding, waarbij op een andere wijze dan in de vorige zin is bepaald, wordt afgeweken van dit
      lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.81
  - number: 4.8:1.5
    text: 'Bij toepassing van het vierde lid organiseert de werkgever de arbeid zodanig, dat de werknemer:'
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.81
  - number: 4.8:1.5.a
    text: |-
      zowel voorafgaand aan als aansluitend op een aanwezigheidsdienst een onafgebroken rusttijd heeft van ten minste 11
      uren, welke rusttijd in elke aaneengesloten periode van 7 maal 24 uren eenmaal mag worden ingekort tot ten minste
      10 uren alsmede eenmaal mag worden ingekort tot ten minste 8 uren, indien, nadat een dergelijke inkorting van de
      rusttijd heeft plaatsgevonden, de daarop volgende onafgebroken rustperiode ten minste 11 uren bedraagt en wordt
      verlengd met ten minste het aantal uren dat de voorafgaande onafgebroken rustperiode minder bedraagt dan 11 uren;
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.81
  - number: 4.8:1.5.b
    text: |-
      onverminderd onderdeel a, in elke aaneengesloten periode van 7 maal 24 uren een rusttijd heeft van ten minste 90
      uren, welke rusttijd bestaat uit een onafgebroken rustperiode van ten minste 24 uren, alsmede vier onafgebroken
      rustperioden van ten minste 11 uren, een onafgebroken rustperiode van ten minste 10 uren, en een onafgebroken
      rustperiode van ten minste 8 uren, waarbij onafgebroken rustperioden aaneengesloten kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.81
  - number: 4.8:2.1
    text: |-
      Het tweede lid kan uitsluitend bij een aanwezigheidsdienst worden toegepast, indien de werknemer daarmee
      uitdrukkelijk schriftelijk instemt. Deze schriftelijke instemming geldt voor een periode van 26 achtereenvolgende
      weken en wordt telkens stilzwijgend voor eenzelfde periode verlengd, tenzij de werknemer uitdrukkelijk te kennen
      geeft met een dergelijke verlenging niet in te stemmen. Het door de werknemer niet instemmen met de stilzwijgende
      verlenging maakt hij tijdig aan de werkgever kenbaar.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.82
  - number: 4.8:2.2
    text: |-
      [Artikel 4.8:1][ref1] is van toepassing, met dien verstande dat in afwijking van het
      [derde lid, onderdeel b, van dat artikel][ref2] de werkgever de arbeid zodanig organiseert dat de werknemer in elke
      periode van 26 achtereenvolgende weken ten hoogste gemiddeld 60 uren per week arbeid verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007687#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007687#Artikel4
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.82
    references:
      - id: ref1
        bwb_id: BWBR0007687
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.8'
      - id: ref2
        bwb_id: BWBR0007687
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.8'
  - number: 4.9:1.1
    text: |-
      [Artikel 5:7, tweede lid, onder c, van de wet][ref1] is niet van toepassing, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.91
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '5'
  - number: 4.9:1.1.a
    text: |-
      een onvoorziene wijziging van omstandigheden of de aard van de arbeid het met zich brengt dat het volume aan
      werkaanbod zodanig fluctueert dat de werknemer tijdelijk meer dan gemiddeld 48 uren per week in een periode
      van 16 aaneengesloten weken arbeid verricht en dit door het op een andere wijze van organiseren van de arbeid
      redelijkerwijs niet is te voorkomen, of
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.91
  - number: 4.9:1.1.b
    text: |-
      een werknemer namens de werkgever uitsluitend of in hoofdzaak leiding geeft aan werknemers die voor die werkgever
      arbeid verrichten.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.91
  - number: 4.9:1.2
    text: |-
      De werkgever organiseert de arbeid zodanig dat de werknemer in elke periode van 52 aaneengesloten weken ten hoogste
      gemiddeld 48 uren per week arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.91
  - number: 4.9:1.3
    text: |-
      Toepassing van dit artikel is uitsluitend mogelijk bij collectieve regeling als bedoeld in
      [artikel 1:3 van de wet][ref1] dan wel bij een daarmee gelijkgestelde regeling als bedoeld
      in [artikel 1:4, eerste lid, van de wet][ref2], indien de collectieve regeling, bedoeld in
      [artikel 1:3 van de wet][ref3], dat uitdrukkelijk bepaalt dan wel er geen collectieve regeling als bedoeld in
      [artikel 1:3 van de wet][ref4] van toepassing is. [Artikel 1:4, tweede lid, van de wet][ref5], is zonodig van
      overeenkomstige toepassing. Elk beding waarbij wordt afgeweken van dit lid of het tweede lid, is nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007671#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0007671#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0007671#Artikel1
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.91
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007671
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0007671
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0007671
        artikel: '1'
      - id: ref5
        bwb_id: BWBR0007671
        artikel: '1'
  - number: 4.9:2.1
    text: |-
      [Artikel 5:8, tweede lid, van de wet][ref1] is niet van toepassing, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.92
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '5'
  - number: 4.9:2.1.a
    text: |-
      een onvoorziene wijziging van omstandigheden of de aard van de arbeid het met zich brengt dat het volume aan
      werkaanbod zodanig fluctueert dat de werknemer tijdelijk meer dan gemiddeld 40 uren per week in een periode
      van 16 aaneengesloten weken arbeid verricht en dit door het op een andere wijze van organiseren van de arbeid
      redelijkerwijs niet is te voorkomen, of
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.92
  - number: 4.9:2.1.b
    text: |-
      een werknemer namens de werkgever uitsluitend of in hoofdzaak leiding geeft aan werknemers die voor die werkgever
      arbeid verrichten.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.92
  - number: 4.9:2.2
    text: |-
      De werkgever organiseert de arbeid zodanig dat de werknemer in elke periode van 52 aaneengesloten weken ten hoogste
      gemiddeld 40 uren per week arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.92
  - number: 4.9:2.3
    text: |-
      Toepassing van dit artikel is uitsluitend mogelijk bij collectieve regeling. Elk beding waarbij wordt afgeweken van
      de vorige zin of het tweede lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel4.92
  - number: 5.1:1
    text: |-
      Voor de toepassing van deze paragraaf wordt verstaan onder baggerwerkzaamheden: werkzaamheden die bestaan uit
      het baggeren, zuigen, opspuiten, verplaatsen of winnen van materialen voor industriële, bouwkundige of andere
      doeleinden en de direct daarmee samenhangende werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.11
  - number: 5.1:2
    text: |-
      Deze paragraaf is uitsluitend van toepassing op baggerwerkzaamheden op het Nederlands
      territoir, verricht door een werknemer van 18 jaar of ouder die geen zeevarende als bedoeld
      in [artikel 6.1:2 van het Arbeidstijdenbesluit vervoer][ref1] of bemanningslid als bedoeld in
      [artikel 1, eerste lid, van de Binnenvaartwet][ref2] is.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0023009#Artikel1
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.12
    references:
      - id: ref1
        bwb_id: BWBR0009386
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0023009
        artikel: '1'
  - number: 5.1:3.1
    text: |-
      De [artikelen 5:7, tweede lid, onder b][ref1], en [5:8 van de wet][ref2] zijn niet van toepassing, indien dit
      artikel wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0007671
        artikel: '5'
  - number: 5.1:3.2
    text: De werkgever organiseert arbeid zodanig, dat de werknemer ten hoogste 72 uren per week arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.13
  - number: 5.1:3.3
    text: 'De werkgever organiseert de arbeid zodanig, dat de werknemer die arbeid in nachtdienst verricht:'
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.13
  - number: 5.1:3.3.a
    text: ten hoogste arbeid verricht gedurende 11 uren in een nachtdienst;
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.13
  - number: 5.1:3.3.b
    text: aansluitend op een nachtdienst een onafgebroken rusttijd heeft van ten minste 12 uren;
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.13
  - number: 5.1:3.3.c
    text: |-
      na een reeks van ten minste 3 en ten hoogste 7 malen achtereenvolgend arbeid te hebben verricht in een nachtdienst,
      een onafgebroken rusttijd heeft van ten minste 60 uren;
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.13
  - number: 5.1:3.3.d
    text: |-
      in elke periode van 16 aaneengesloten weken ten hoogste 36 malen arbeid verricht in een nachtdienst die eindigt na
      02.00 uur, en
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.13
  - number: 5.1:3.3.e
    text: |-
      in elke periode van 16 aaneengesloten weken waarin de werknemer 16 of meer malen arbeid in een nachtdienst verricht
      ten hoogste gemiddeld 40 uren per week arbeid verricht in die periode van 16 aaneengesloten weken.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.13
  - number: 5.1:3.4
    text: |-
      Toepassing van dit artikel is uitsluitend mogelijk bij collectieve regeling. Elk beding waarbij wordt afgeweken van
      de vorige zin dan wel het tweede of derde lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.13
  - number: 5.2:1
    text: |-
      Deze paragraaf is uitsluitend van toepassing op arbeid van werknemers, die als lid van de operationele teams
      onder verantwoordelijkheid van Rijkswaterstaat, in de periode van 1 oktober tot en met 15 april zijn belast met de
      bediening van beweegbare stormvloedkeringen.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.21
  - number: 5.2:2
    text: |-
      [Artikel 5:9, tweede lid, van de wet][ref1] is niet van toepassing in de periode van 1 oktober tot en met 15 april.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.22
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '5'
  - number: 5.3:1
    text: 'Deze paragraaf is uitsluitend van toepassing op arbeid verricht door de werknemer van 18 jaar of ouder:'
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.31
  - number: 5.3:1.a
    text: |-
      die met goed gevolg een brandweeropleiding heeft afgesloten met een vanwege Onze Minister van Binnenlandse Zaken
      en Koninkrijksrelaties afgenomen examen dan wel door voornoemd minister is vrijgesteld van de aan die opleiding
      verbonden diploma-eis en die als zodanig werkzaam is;
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.31
  - number: 5.3:1.b
    text: |-
      die in directe samenhang met de in onderdeel *a* bedoelde werknemer arbeid verricht voor de in dat onderdeel
      bedoelde arbeid.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.31
  - number: 5.3:2.1
    text: |-
      [Artikel 5:9, vierde lid, van de wet][ref1] is niet van toepassing, indien het tweede lid wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.32
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '5'
  - number: 5.3:2.2
    text: |-
      In aanvulling op [artikel 5:7, tweede lid, onder a, van de wet][ref1] organiseert de werkgever de arbeid zodanig,
      dat de werknemer aan wie als vrijwillige brandweer consignatie is opgelegd ten hoogste 14 uren in elke periode van
      24 aaneengesloten uren arbeid verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.32
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '5'
  - number: 5.3:2.3
    text: |-
      De [artikelen 5:9, vijfde en zesde lid][ref1], en [5:15, eerste tot en met vierde lid, van de wet][ref2] zijn niet
      van toepassing op de vrijwillige brandweer.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.32
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0007671
        artikel: '5'
  - number: 5.3:3.1
    text: |-
      Dit artikel is uitsluitend van toepassing op een werknemer die in de functie van commandant of ondercommandant als
      vrijwillige brandweer consignatie is opgelegd.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.33
  - number: 5.3:3.2
    text: |-
      [Artikel 5:9, tweede lid, van de wet][ref1] is niet van toepassing als het derde lid wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.33
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '5'
  - number: 5.3:3.3
    text: |-
      Indien dit door het nemen van andere maatregelen redelijkerwijs niet is te voorkomen, organiseert de werkgever de
      arbeid zodanig, dat de in het eerste lid bedoelde werknemer in elke aaneengesloten periode van 182 maal 24 uren ten
      minste 91 maal een periode van 24 aaneengesloten uren geen consignatie wordt opgelegd.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.33
  - number: 5.3:3.4
    text: |-
      [Artikel 5:9, derde lid, van de wet][ref1] is niet van toepassing op een werknemer als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.33
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '5'
  - number: 5.3:4.1
    text: Dit artikel is niet van toepassing op de werknemer die als vrijwillige brandweer arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.34
  - number: 5.3:4.2
    text: |-
      De werkgever organiseert in afwijking van [artikel 4.8:1, derde lid, onderdeel a][ref1], de arbeid zodanig dat
      de werknemer ten hoogste 62 maal in elke periode van 26 achtereenvolgende weken een aanwezigheidsdienst wordt
      opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007687#Artikel4
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.34
    references:
      - id: ref1
        bwb_id: BWBR0007687
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.8'
  - number: 5.3:4.3
    text: |-
      [Artikel 4.8:1, derde lid, onderdeel c][ref1], blijft buiten toepassing, indien zich incidentele en onvoorziene
      omstandigheden voordoen waardoor het aantal werknemers dat nodig is om een onbelemmerde voortgang van de dienst te
      waarborgen, onder het vereiste minimum komt.


      [ref1]: https://wetten.overheid.nl/BWBR0007687#Artikel4
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.34
    references:
      - id: ref1
        bwb_id: BWBR0007687
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.8'
  - number: 5.3:5.1
    text: Dit artikel is uitsluitend van toepassing op de werknemer die als vrijwillige brandweer arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.35
  - number: 5.3:5.2
    text: |-
      De werkgever organiseert in afwijking van [artikel 4.8:1, derde lid, onderdeel a][ref1], de arbeid zodanig dat de
      werknemer ten hoogste eenmaal in elke aaneengesloten tijdruimte van 7 maal 24 uren een aanwezigheidsdienst wordt
      opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007687#Artikel4
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.35
    references:
      - id: ref1
        bwb_id: BWBR0007687
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.8'
  - number: 5.3:5.3
    text: |-
      [Artikel 4.8:1, derde lid, onderdeel c][ref1], kan eenmaal in elke aaneengesloten tijdruimte van 7 maal 24 uren
      buiten toepassing worden gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0007687#Artikel4
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.35
    references:
      - id: ref1
        bwb_id: BWBR0007687
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.8'
  - number: 5.4:1
    text: |-
      Deze paragraaf is uitsluitend van toepassing op arbeid de werknemer verricht en die die bestaat uit het bakken van
      brood en banket en de direct daarmee samenhangende werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.41
  - number: 5.4:2.1
    text: |-
      [Artikel 5:8, vijfde lid, van de wet][ref1] is niet van toepassing, indien dit artikel wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.42
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '5'
  - number: 5.4:2.2
    text: |-
      De werkgever organiseert de arbeid zodanig, dat een werknemer na het verrichten van een reeks van 3 en ten hoogste
      6 achtereenvolgende nachtdiensten een onafgebroken rusttijd heeft van ten minste 36 uren.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.42
  - number: 5.4:2.3
    text: |-
      Toepassing van dit artikel is uitsluitend mogelijk bij collectieve regeling. Elk beding waarbij wordt afgeweken van
      de vorige zin of het tweede lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.42
  - number: 5.4:3.1
    text: |-
      Dit artikel is uitsluitend van toepassing op arbeid verricht in nachtdienst door een jeugdige werknemer
      die een opleiding volgt tot brood- en banketbakker, tot broodbakker of tot leidinggevende in de bakkerij
      door middel van hetzij een beroepsbegeleidende hetzij een beroepsopleidende leerweg in het kader van de
      [Wet Educatie en Beroepsonderwijs][ref1], voorzover die arbeid noodzakelijk is in het kader van die opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.43
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: 5.4:3.2
    text: |-
