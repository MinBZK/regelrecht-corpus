      [artikel 5:9, derde lid en zevende lid, van de wet][ref62], [5.21:3, derde lid, en vierde lid][ref63], voor zover
      dit lid betrekking heeft op [artikel 5:9, derde lid en zevende lid, van de wet][ref64], [5.23:2, tweede lid][ref65],
      [5.26:3, derde lid][ref66], [5.26:4, tweede lid][ref67], [5.27:2, tweede lid, en derde lid][ref68], voor zover
      dit lid betrekking heeft op [artikel 5:9, derde tot en met zevende lid, van de wet][ref69], [5.27:3][ref70],
      [5.28:3][ref71], en [8.1:1][ref72], levert een overtreding op.


