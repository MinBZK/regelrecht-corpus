        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0007671
        paragraaf: '5.2'
  - number: 2.2:2
    text: |-
      [Paragraaf 5.1 van de wet][ref1] en – voor zover aangeduid als overtredingen – de
      [paragrafen 5.2 tot en met 5.5 van de wet][ref2] en de daarop berustende bepalingen zijn van overeenkomstige
      toepassing op de persoon, die zonder werknemer of werkgever te zijn in de zin van de wet duikwerkzaamheden en de
      direct daarmee samenhangende werkzaamheden verricht in de civiele onderwaterbouw.


