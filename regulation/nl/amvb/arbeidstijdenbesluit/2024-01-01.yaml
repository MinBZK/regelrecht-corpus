        bwb_id: BWBR0007671
        artikel: '5'
  - number: 5.4:4.3
    text: |-
      De werkgever organiseert de arbeid zodanig, dat een werknemer in elke periode van 4 aaneengesloten weken ten
      hoogste 20 malen arbeid verricht in een nachtdienst die eindigt na 02.00 uur.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.44
  - number: 5.4:4.4
    text: |-
      Toepassing van dit artikel is uitsluitend mogelijk bij collectieve regeling. Elk beding waarbij wordt afgeweken van
      de vorige zin dan wel het eerste of derde lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.44
  - number: 5.5:1
    text: |-
      Deze paragraaf is uitsluitend van toepassing op werkzaamheden, verricht door een werknemer van 18 jaar of ouder, in
      het kader van sneeuw- en gladheidsbestrijding in verband met de veiligheid op verkeerswegen of de vliegveiligheid
      van het luchtverkeer in de periode van 1 november tot 1 april.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.51
  - number: 5.5:2.1
    text: |-
      [Artikel 5:9, vijfde lid, van de wet][ref1] is niet van toepassing, indien dit artikel wordt toegepast.


