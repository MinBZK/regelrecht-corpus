        artikel: '5'
      - id: ref4
        bwb_id: BWBR0007671
        artikel: '5'
  - number: 5.14:4.3
    text: |-
      De werkgever organiseert de arbeid zodanig, dat de werknemer die in een niet-bestendig en -regelmatig
      arbeidstijdpatroon werkzaam is:
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.144
  - number: 5.14:4.3.a
    text: |-
      gedurende ten hoogste 15 maal in elke periode van 21 aaneengesloten dagen, ten hoogste 11 uren per dienst
      onderscheidenlijk per nachtdienst, en in een periode van 26 aaneengesloten weken gemiddeld 40 uren per week arbeid
      verricht;
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.144
  - number: 5.14:4.3.b
    text: |-
      na arbeid te hebben verricht in die dienst een onafgebroken rusttijd heeft van ten minste 12 uren, welke rusttijd 3
      maal in elke periode van 21 aaneengesloten dagen mag worden ingekort tot ten minste 8 uren;
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.144
  - number: 5.14:4.3.c
    text: |-
      in de in onderdeel a bedoelde periode van 21 aaneengesloten dagen een onafgebroken rusttijd heeft van ten minste
      72 uren.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.144
  - number: 5.14:4.4
    text: |-
      De arbeidstijd per dienst onderscheidenlijk per nachtdienst kan in afwijking van het derde lid, onderdeel a, 2 maal
      in elke periode van 28 aaneengesloten dagen worden verlengd met ten hoogste één uur voor het verrichten van arbeid
      die bestaat uit oefeningen die tot doel hebben de bekwaamheid en de bedrevenheid in het uitvoeren van maatregelen
      en procedures ten tijde van ongelukken en calamiteiten te verkrijgen of te behouden.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.144
  - number: 5.14:4.5
    text: |-
      Indien het vierde lid wordt toegepast kan in afwijking van het derde lid, onderdeel b, de onafgebroken rusttijd van
      ten minste 12 uren worden ingekort met ten hoogste één uur.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.144
  - number: 5.14:4.6
    text: |-
      Indien dit artikel wordt toegepast, organiseert de werkgever de arbeid van de werknemer zodanig, dat tegenover
      iedere periode van 24 uren welke wordt doorgebracht op of vanaf een mijnbouwwerk in een periode van 26
      aaneengesloten weken een onafgebroken rusttijd staat van ten minste 24 uren elders.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.144
  - number: 5.14:4a.1
    text: |-
      Dit artikel is uitsluitend van toepassing op een werknemer die vanuit een bestendig en regelmatig arbeidspatroon,
      bedoeld in de [artikelen 5.14:2][ref1] of [5.14:3][ref2], werkzaamheden gaat verrichten in een niet-bestendig en
      regelmatig arbeidspatroon, bedoeld in [artikel 5.14:4][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007687#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007687#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0007687#Artikel5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.144a
    references:
