    text: |-
      De werkgever organiseert de arbeid zodanig, dat de jeugdige werknemer in elke periode van 16 aaneengesloten weken
      gemiddeld ten hoogste 40 uren per week arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.62
  - number: 5.7:1.1
    text: Deze paragraaf is uitsluitend van toepassing op arbeid verricht door personenchauffeurs.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.71
  - number: 5.7:1.2
    text: |-
      Voor de toepassing van deze paragraaf wordt onder personenchauffeur verstaan: persoon die als chauffeur uitsluitend
      of nagenoeg uitsluitend is belast met het vervoer van doorgaans dezelfde persoon per auto.
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.71
  - number: 5.7:2.1
    text: |-
      De [artikelen 5:3, tweede lid][ref1], [5:7, tweede lid, onderdelen a en b][ref2],
      [5:8, eerste tot en met vijfde lid][ref3], en [5:9, derde tot en met zesde lid, van de wet][ref4] zijn niet van
      toepassing, indien dit artikel wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0007671#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0007671#Artikel5
    url: https://wetten.overheid.nl/BWBR0007687/2024-01-01#Artikel5.72
    references:
