      1 [Paragraaf 4.1][ref1] en de daarop berustende bepalingen en [hoofdstuk 6][ref2] van de wet zijn niet van
      toepassing op arbeid van huishoudelijke aard verricht door de werknemer van 18 jaar of ouder in of ten behoeve van
      een particuliere huishouding, waarbij die werknemer in die particuliere huishouding inwoont.

      2 Onder arbeid, als bedoeld in het eerste lid, wordt mede verstaan: arbeid van huishoudelijke aard, verricht in de
      ruimte die de werkgever gebruikt om geheel of gedeeltelijk door middel van werkzaamheden in zijn levensonderhoud
      te voorzien.


