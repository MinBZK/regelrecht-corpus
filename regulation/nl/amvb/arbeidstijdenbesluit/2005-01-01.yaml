  - number: 5.24:1
    text: |-
      Deze paragraaf is uitsluitend van toepassing op arbeid die bestaat uit danwel samenhangt met het verzorgen van
      kraamvrouwen, verricht door werknemers van 18 jaar of ouder.
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.241
  - number: 5.24:2
    text: |-
      1 Uitsluitend bij collectieve regeling kan, met in achtneming van het tweede lid, van
      [artikel 5:3, tweede lid][ref1], van de wet worden afgeweken. Elk beding waarin op andere wijze dan in de eerste
      volzin is bepaald, wordt afgeweken van [artikel 5:3, tweede lid][ref2], van de wet is nietig.

      2 De werkgever organiseert de arbeid zodanig, dat de werknemer een onafgebroken rusttijd heeft van hetzij
      ten minste 36 uren in elke aaneengesloten tijdruimte van 7 maal 24 uren, hetzij ten minste 60 uren in elke
      aaneengesloten tijdruimte van 9 maal 24 uren welke rusttijd éénmaal in elke periode van 5 achtereenvolgende weken
      mag worden ingekort tot 32 uren, hetzij ten minste 72 uren in elke aaneengesloten tijdruimte van 11 maal 24 uren.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel53
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.242
