  - number: 5.25:1
    text: |-
      Onder instellingen voor maatschappelijke opvang wordt verstaan: algemene crisisopvangcentra, instellingen voor
      dak- en thuislozenzorg, sociale pensions, vrouwenopvangcentra, evangelische opvangcentra, en daarmee vergelijkbare
      instellingen en centra.
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.251
  - number: 5.25:2
    text: |-
      Deze paragraaf is uitsluitend van toepassing op arbeid, verricht door werknemers van 18 jaar of ouder in
      instellingen voor maatschappelijke opvang.
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.252
  - number: 5.25:3
    text: |-
      1 In afwijking van [artikel 5:8, derde lid, onderdeel ][ref1], van de wet kan, echter uitsluitend indien de arbeid
      door het nemen van andere maatregelen redelijkerwijs niet anders is te organiseren, dit artikel worden toegepast.

      2 De werkgever organiseert de arbeid zodanig, dat de werknemer die arbeid verricht in nachtdienst ten hoogste 42
      maal in elke periode van 13 achtereenvolgende weken en 140 maal in elke periode van 52 achtereenvolgende weken
      arbeid in nachtdienst verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel58
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.253
    references:
