  - number: 5.20:5
    text: |-
      Indien consignatie, aanwezigheidsdiensten en bereikbaarheidsdiensten worden opgelegd, organiseert de werkgever de
      arbeid zodanig, dat de werknemer ten hoogste 5 maal in elke aaneengesloten tijdruimte van 7 maal 24 uren en 26 maal
      in elke periode van 13 achtereenvolgende weken consignatie, een aanwezigheidsdienst of een bereikbaarheidsdienst
      wordt opgelegd.
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.205
  - number: 5.21:1
    text: |-
      Deze paragraaf is uitsluitend van toepassing op de werknemer van 18 jaar of ouder die arbeid verricht als
      verloskundige werkzaam in de extramurale gezondheidszorg, alsmede de werknemer van 18 jaar of ouder die hiertoe in
      opleiding is.
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.211
  - number: 5.21:2
    text: |-
      1 Ter aanvulling van [artikel 5:11][ref1] van de wet en in afwijking van
      [artikel 5:11, derde lid, onderdelen ][ref2], van de wet kan dit artikel worden toegepast.

      2 Een bereikbaarheidsdienst wordt, met inachtneming van het derde lid, uitsluitend opgelegd indien de werkgever dit
      heeft bedongen.

      3 De werkgever organiseert de arbeid zodanig, dat de werknemer:

      a. ten hoogste 5 maal in elke aaneengesloten tijdruimte van 7 maal 24 uren en 52 maal in elke periode van 13
      achtereenvolgende weken een bereikbaarheidsdienst wordt opgelegd;

      b. ten hoogste 60 uren per week en in elke periode van 13 achtereenvolgende weken ten hoogste gemiddeld 40 uren per
      week arbeid verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel511
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel511
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.212
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: 5:11
      - id: ref2
        bwb_id: BWBR0007671
        artikel: 5:11
  - number: 5.21:3
    text: |-
      1 Dit artikel is uitsluitend van toepassing op arbeid verricht door de werknemer in opleiding tot verloskundige.

      2 Ter aanvulling van [artikel 5:11][ref1] van de wet en in afwijking van
      [artikel 5:11, derde lid, onderdelen ][ref2], van de wet kan dit artikel worden toegepast.

      3 Een bereikbaarheidsdienst wordt, met inachtneming van het vierde lid, uitsluitend opgelegd indien de werkgever
      dit heeft bedongen.

      4 De werkgever organiseert de arbeid zodanig, dat de werknemer:

      a. ten hoogste 12 maal in elke periode van 52 achtereenvolgende weken ten hoogste 7 maal achtereen een
      bereikbaarheidsdienst wordt opgelegd;

      b. ten hoogste 60 uren per week en in elke periode van 13 achtereenvolgende weken ten hoogste gemiddeld 40 uren per
      week arbeid verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel511
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel511
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.213
    references:
