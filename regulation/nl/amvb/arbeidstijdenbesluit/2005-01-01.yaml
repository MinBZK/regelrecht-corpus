      1 In afwijking van [artikel 5:7, derde lid][ref1], van de wet kan dit artikel worden toegepast.

      2 De werkgever organiseert de arbeid zodanig, dat de werknemer ten hoogste 11 uren per dienst, in elke periode van
      4 achtereenvolgende weken gemiddeld 45 uren per week en in elke periode van 13 achtereenvolgende weken gemiddeld 40
      uren per week arbeid verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel57
