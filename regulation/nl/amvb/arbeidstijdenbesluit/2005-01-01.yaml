      1 Deze paragraaf is van toepassing op arbeid, die bestaat uit werkzaamheden met betrekking tot uitvoeringen
      van culturele of artistieke aard of uitvoeringen die daarmee gelijkenis vertonen alsmede de direct daarmee
      samenhangende werkzaamheden, verricht door een werknemer van 18 jaar of ouder.

      2 De[ artikelen 5.16:3][ref1] en[ 5.16:4][ref2] zijn van toepassing op arbeid, verricht in een bioscoop door een
      werknemer van 18 jaar of ouder en die bestaat uit het uitsluitend of in hoofdzaak:

      a. bedienen van filmapparatuur als operateur of leerlingoperateur, of

      b. het namens de werkgever en in diens plaats uitoefenen van het bioscoopbedrijf.


