  - number: 4.6:1
    text: |-
      1 Uitsluitend bij collectieve regeling kan, met inachtneming van het derde lid, van
      [artikel 5:10, tweede lid][ref1], van de wet worden afgeweken, indien:

      a. de werknemer werkzaamheden verricht zonder enig direct contact met een andere werknemer die vergelijkbare
      werkzaamheden verricht, of

      b. de aard van de arbeid met zich brengt dat de afwisseling van de arbeid per dienst onderscheidenlijk
      per nachtdienst door een pauze onmogelijk is en dit door het op een andere wijze organiseren van de arbeid
      redelijkerwijs niet is te voorkomen.

      2 Elk beding waarbij op andere wijze dan in het eerste lid, aanhef, is bepaald, wordt afgeweken van
      [artikel 5:10, tweede lid][ref2], van de wet is nietig.

      3 De werkgever organiseert de arbeid zodanig, dat de werknemer in elke periode van 52 achtereenvolgende weken
      gemiddeld ten hoogste 40 uren per week arbeid verricht.

      4 Indien het eerste lid wordt toegepast, organiseert de werkgever in afwijking van
      de[ artikelen 4.2:3, tweede lid, onderdeel ][ref3], [4.5:3, tweede lid, onderdeel ][ref4],
      [5.2:2, tweede lid, onderdeel ][ref5], en [5.6:3, tweede lid, onderdeel ][ref6], de arbeid zodanig, dat de
      werknemer ten hoogste 12 uren per dienst onderscheidenlijk per nachtdienst arbeid verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel510
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel510
      [ref3]: https://wetten.overheid.nl/BWBR0007687#Artikel4.23
