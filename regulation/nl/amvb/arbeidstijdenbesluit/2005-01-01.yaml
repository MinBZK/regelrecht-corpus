  - number: 4.8:2
    text: |-
      1 In afwijking van de[ artikelen 5:7, derde lid][ref1], en [5:9, derde lid][ref2], van de wet ten aanzien van de
      arbeidstijd per dienst kan dit artikel worden toegepast.

      2 De werkgever organiseert de arbeid zodanig, dat de werknemer ten hoogste 12 uren per dienst arbeid verricht.

      3 Dit artikel kan uitsluitend worden toegepast, indien [artikel 4.8:1, eerste tot en met het vierde lid][ref3], van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel59
