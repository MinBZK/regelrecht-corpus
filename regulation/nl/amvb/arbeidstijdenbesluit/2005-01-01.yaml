  - number: 5.18:1
    text: |-
      Voor de toepassing van deze paragraaf wordt verstaan onder schoonmaakbedrijf: een onderneming die uitsluitend of
      in hoofdzaak haar beroep maakt van het periodiek dan wel telkens voor eenmaal schoonmaken in, op of aan gebouwen,
      terreinen en verkeersmiddelen, gebezigd voor het openbaar vervoer van personen of goederen, alsmede de direct
      daarmee samenhangende werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.181
  - number: 5.18:2
    text: |-
      Deze paragraaf is uitsluitend van toepassing op arbeid verricht door een werknemer van 18 jaar of ouder in een
      schoonmaakbedrijf.
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.182
  - number: 5.18:3
    text: |-
      1 Dit artikel is uitsluitend van toepassing op arbeid, die bestaat uit het schoonmaken in, op of aan gebouwen en
      terreinen.

      2 In afwijking van [artikel 5:5, tweede lid][ref1], van de wet kan uitsluitend bij collectieve regeling onder
      gelijktijdige uitsluiting van het bepaalde in dat artikellid, dit artikel worden toegepast.

      3 De werkgever organiseert de arbeid zodanig, dat de werknemer een onafgebroken rusttijd heeft van ten minste 10
      uren in een aaneengesloten tijdruimte van 24 uren. De in de vorige volzin bedoelde tijdruimte vangt aan op het
      eerste tijdstip van de dag waarop de werknemer arbeid verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel55
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.183
