        artikel: 5:11
      - id: ref2
        bwb_id: BWBR0007671
        artikel: 5:11
  - number: 5.22:1
    text: |-
      Deze paragraaf is uitsluitend van toepassing op arbeid verricht in directe samenhang met het vervoer van personen
      en goederen als bedoeld in [hoofdstuk 3 van het Arbeidstijdenbesluit vervoer][ref1], en die bestaat uit directe
      betrokkenheid bij het goederenvervoer-volgproces en het transport- en rangeerproces, verricht door een werknemer
      van 18 jaar of ouder.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.221
    references:
      - id: ref1
        bwb_id: BWBR0009386
        hoofdstuk: '3'
  - number: 5.22:2
    text: |-
      1 In afwijking van [artikel 5:8, derde lid, onderdeel b, onder 2][ref1], van de wet kan, echter uitsluitend indien
      de arbeid door het nemen van andere maatregelen redelijkerwijs niet anders is te organiseren, dit artikel worden
      toegepast.

      2 De werkgever organiseert de arbeid zodanig, dat de werknemer die arbeid verricht in nachtdienst ten hoogste 42
      maal in elke periode van 13 achtereenvolgende weken en 140 maal in elke periode van 52 achtereenvolgende weken
      arbeid in nachtdienst verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel58
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.222
    references:
      - id: ref1
