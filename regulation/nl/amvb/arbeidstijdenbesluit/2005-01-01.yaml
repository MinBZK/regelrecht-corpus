        artikel: 5:11
  - number: 4.7:1
    text: |-
      1 In afwijking van [artikel 5:8, derde lid, onderdeel ][ref1], van de wet, kan dit artikel worden toegepast, indien
      de aard van de arbeid met zich brengt dat arbeid in nachtdienst wordt verricht en dit door het op een andere wijze
      organiseren van de arbeid redelijkerwijs niet is te voorkomen.

      2 De werkgever organiseert de arbeid zodanig, dat de werknemer:

      a. hetzij ten hoogste 35 maal in elke periode van 13 achtereenvolgende weken arbeid in nachtdienst verricht;

      b. hetzij ten hoogste 20 uren in elke periode van 2 achtereenvolgende weken arbeid verricht tussen 00.00 uur en
      06.00 uur.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel58
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel4.71
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: 5:8
  - number: 4.8:1
    text: |-
      1 Ter aanvulling van [artikel 5:11][ref1] van de wet en in afwijking van de[ artikelen 5:5, tweede lid][ref2], en
      [5:11, derde lid, onderdeel ][ref3], van de wet kan dit artikel worden toegepast indien de aard van de arbeid het
      noodzakelijk maakt dat de werknemer een aanwezigheidsdienst wordt opgelegd en dit door het op een andere wijze
      organiseren van de arbeid redelijkerwijs niet is te voorkomen.

      2 Een aanwezigheidsdienst wordt, met inachtneming van het derde en vijfde lid, uitsluitend bij collectieve regeling
      bepaald. Elk beding waarin op andere wijze dan in de eerste volzin is bepaald, gebruik wordt gemaakt van het derde
      of vijfde lid, is nietig.

      3 De werkgever organiseert de arbeid zodanig, dat de werknemer:

      a. ten hoogste 3 maal in elke aaneengesloten tijdruimte van 7 maal 24 uren en 26 maal in elke periode van 13
      achtereenvolgende weken een aanwezigheidsdienst wordt opgelegd;

      b. vóór en nà een aanwezigheidsdienst een onafgebroken rusttijd heeft van ten minste 11 uren, welke rusttijd
      éénmaal in elke aaneengesloten tijdruimte van 7 maal 24 uren mag worden ingekort tot ten minste 8 uren;

      c. tijdens een aanwezigheidsdienst na een arbeidstijd van ten hoogste 10 uren een onafgebroken rusttijd heeft van
      ten minste 6 uren. 4. Het derde lid, onderdeel *b*, is niet van toepassing in de tijdruimte gelegen tussen vrijdag
      18.00 uur en de daaropvolgende maandag 08.00 uur.

      5 In afwijking van het derde lid, onderdeel *a*, en vierde lid, organiseert de werkgever, indien een
      aanwezigheidsdienst van ten hoogste 12 uren wordt opgelegd en de werknemer in deze periode ten hoogste 5 uren
      arbeid verricht, de arbeid zodanig, dat die werknemer ten hoogste 5 maal in elke aaneengesloten tijdruimte van 7
      maal 24 uren en 26 maal in elke periode van 13 achtereenvolgende weken een aanwezigheidsdienst wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel511
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0007671#Artikel511
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel4.81
