  - number: 5.23:4
    text: |-
      1 In afwijking van de[ artikelen 5:7, derde lid][ref1], en [5:9, derde lid][ref2], ten aanzien van het verrichten
      van arbeid tijdens een dienst, niet zijnde een nachtdienst, van de wet ten aanzien van de arbeidstijd per dienst
      kan dit artikel worden toegepast. 2. De werkgever organiseert de arbeid zodanig, dat de werknemer ten hoogste 12
      uren per dienst, 72 uren per week, in elke periode van 13 achtereenvolgende weken gemiddeld 48 uren per week en in
      elke periode van 52 achtereenvolgende weken gemiddeld 45 uren per week arbeid verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel59
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.234
