  - number: 2.1:13
    text: |-
      [Paragraaf 5.2][ref1] van de wet en de daarop berustende bepalingen zijn van toepassing op arbeid verricht door een
      werknemer van 18 jaar of ouder in dienst van de Dienst Koninklijk Huis, tenzij bijzondere omstandigheden om redenen
      van veiligheid en privacy samenhangend met de leden van het Koninklijk Huis de toepassing van die paragraaf en de
      daarop berustende bepalingen belemmeren.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Paragraaf5.2
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel2.113
    references:
      - id: ref1
        bwb_id: BWBR0007671
        paragraaf: '5.2'
  - number: 2.1:14
    text: |-
      1 [Artikel 5:3, tweede lid, van de wet][ref1], uitsluitend voor zover betrekking hebbend op een onafgebroken
      rusttijd van ten minste 60 uren in elke aaneengesloten tijdruimte van 9 maal 24 uren welke rusttijd éénmaal in elke
      periode van 5 achtereenvolgende weken mag worden bekort tot 32 uren, is niet van toepassing op arbeid verricht door
      werknemers in handelsondernemingen en kantoren.

      2 Het eerste lid blijft buiten toepassing indien de aard van de arbeid of de bedrijfsomstandigheden zulks
      noodzakelijk maken.

      3 Het tweede lid kan uitsluitend bij collectieve regeling of, indien geen collectieve regeling van toepassing is
      dan wel de collectieve regeling geen bepalingen terzake bevat, telkens met instemming van de betrokken werknemer
      worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel53
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel2.114
