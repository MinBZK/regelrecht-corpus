  - number: 5.20:4
    text: |-
      1 Ter aanvulling van [artikel 5:11][ref1] van de wet en in afwijking van
      [artikel 5:11, derde lid, onderdeel ][ref2], van de wet kan dit artikel worden toegepast.

      2 Een bereikbaarheidsdienst wordt, met inachtneming van het derde lid, uitsluitend bij collectieve regeling
      bepaald. Elk beding waarin op andere wijze dan in de eerste volzin is bepaald, gebruik wordt gemaakt van het derde
      lid, is nietig.

      3 De werkgever organiseert de arbeid zodanig, dat de werknemer ten hoogste 5 maal in elke tijdruimte van 7 maal 24
      uren en 26 maal in elke periode van 13 achtereenvolgende weken een bereikbaarheidsdienst wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel511
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel511
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.204
