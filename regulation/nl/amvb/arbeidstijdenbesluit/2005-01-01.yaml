  - number: 5.13:3
    text: |-
      In afwijking van [paragraaf 5.2][ref1] van de wet geldt voor de in die paragraaf aangegeven referentieperiode voor
      de arbeidstijd van 13 achtereenvolgende weken een referentieperiode van 52 achtereenvolgende weken.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Paragraaf5.2
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.133
