      De hoogte van het bedrag, bedoeld in [artikel 2.1:5, eerste lid][ref1], bedraagt:

      1°. het twaalfvoud van de uitbetalingstermijn van een maand, bedoeld in [artikel 8, eerste lid, onderdeel ][ref2],
      dat overeenkomstig [artikel 14, eerste en zesde lid van die wet][ref3], is vastgesteld op 1 januari van het
      desbetreffende jaar,

      2°. verhoogd met het op grond van [artikel 15, eerste lid, van de Wet minimumloon en minimum vakantiebijslag][ref4]
      voorgeschreven percentage vakantiebijslag,

      3°. afgerond op het dichtstbijzijnde veelvoud van € 50 waarbij het restbedrag van € 25 wordt afgerond naar boven.


