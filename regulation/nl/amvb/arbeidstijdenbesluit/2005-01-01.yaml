  - number: 5.10:2
    text: |-
      1 De werknemer heeft een onafgebroken rusttijd van ten minste 36 uren in elke aaneengesloten tijdruimte van 7 maal
      24 uren.

      2 De in het eerste lid bedoelde tijdruimte vangt aan op het eerste tijdstip van de dag, waarop de werknemer arbeid
      verricht.
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.102
  - number: 5.10:3
    text: De werknemer verricht op ten minste 4 zondagen in elke periode van 13 achtereenvolgende weken geen arbeid.
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.103
  - number: 5.10:4
    text: |-
      1 De werknemer heeft een onafgebroken rusttijd van ten minste 9 uren in elke aaneengesloten tijdruimte van 24 uren.

      2 De in het eerste lid bedoelde tijdruimte vangt aan op het eerste tijdstip van de dag, waarop de werknemer arbeid
      verricht.
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.104
  - number: 5.10:5
    text: |-
      De werknemer verricht ten hoogste in elke periode van 4 achtereenvolgende weken gemiddeld 50 uren per week en in
      elke periode van 13 achtereenvolgende weken gemiddeld 45 uren per week arbeid.
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.105
  - number: 5.10:6
    text: |-
      De arbeid van de werknemer wordt na ten hoogste 4 uren aaneengesloten arbeid in een dienst onderbroken door een
      pauze.
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.106
  - number: 5.10:7
    text: Elk beding waarbij ten nadele van de werknemer wordt afgeweken van deze paragraaf is nietig.
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.107
  - number: 5.11:1
    text: |-
      Deze paragraaf is uitsluitend van toepassing op arbeid verricht door een werknemer van 18 jaar of ouder als bedoeld
      in [artikel 3, eerste lid, onderdeel ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel3
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.111
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '3'
  - number: 5.11:2
    text: |-
      1 Uitsluitend bij collectieve regeling kan, met inachtneming van het tweede lid, ten hoogste éénmaal in elke
      aaneengesloten tijdruimte van 7 maal 24 uren van de[ artikelen 5:3, tweede lid][ref1], en [5:5, tweede lid][ref2],
      van de wet worden afgeweken. Elk beding waarbij op andere wijze dan in de vorige volzin bepaald, wordt afgeweken
      van de[ artikelen 5:3, tweede lid][ref3], en [5:5, tweede lid][ref4], van de wet is nietig.

      2 De werkgever organiseert de arbeid zodanig, dat de werknemer in elke aaneengesloten tijdruimte van 7 maal 24
      uren:

      a. hetzij een onafgebroken rusttijd heeft van ten minste 24 uren;

      b. hetzij een rusttijd heeft van ten minste 11 uren in een aaneengesloten tijdruimte van 24 uren.

      3 Indien het tweede lid, onderdeel *b*, wordt toegepast, organiseert de werkgever de arbeid zodanig, dat de
      werknemer na het verrichten van die arbeid een onafgebroken rusttijd heeft van ten minste 24 uren.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0007671#Artikel53
      [ref4]: https://wetten.overheid.nl/BWBR0007671#Artikel55
