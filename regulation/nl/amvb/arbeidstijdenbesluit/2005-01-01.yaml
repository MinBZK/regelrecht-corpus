      1 In afwijking van [artikel 5:10, zevende lid][ref1], van de wet kan dit artikel worden toegepast.

      2 De werkgever organiseert de arbeid zodanig, dat de werknemer de in het[ tweede lid van artikel 5:10][ref2] van de
      wet bedoelde pauze heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel510
