      - id: ref1
        bwb_id: BWBR0007671
        artikel: 5:5
  - number: 5.18:4
    text: |-
      1 Dit artikel is uitsluitend van toepassing op arbeid, die bestaat uit het schoonmaken in, op of aan
      verkeersmiddelen, gebezigd voor het openbaar vervoer van personen of goederen.

      2 In afwijking van [artikel 5:8, derde lid, onderdeel ][ref1], van de wet kan, echter uitsluitend indien de arbeid
      door het nemen van andere maatregelen redelijkerwijs niet anders is te organiseren, dit artikel worden toegepast.

      3 De werkgever organiseert de arbeid zodanig, dat de werknemer die arbeid verricht in nachtdienst ten hoogste 42
      maal in elke periode van 13 achtereenvolgende weken en 140 maal in elke periode van 52 achtervolgende weken arbeid
      in nachtdienst verricht.


