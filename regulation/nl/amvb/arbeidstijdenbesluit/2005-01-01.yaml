  - number: 5.26:3
    text: |-
      1 Dit artikel is uitsluitend van toepassing indien de reis die geheel of gedeeltelijk buiten Nederland wordt
      gemaakt langer duurt dan 6 aaneengesloten dagen.

      2 Uitsluitend bij collectieve regeling kan gedurende ten hoogste 6 aaneengesloten weken
      [artikel 5:3, tweede lid][ref1], van de wet buiten toepassing worden gelaten, mits de in dat artikellid bedoelde
      onafgebroken rusttijd, wordt gecompenseerd overeenkomstig het derde lid. Elk beding waarbij op andere wijze dan in
      de vorige volzin is bepaald, wordt afgeweken van [artikel 5:3, tweede lid][ref2], van de wet is nietig.

      3 De werkgever organiseert de arbeid zodanig dat de werknemer vanaf de dag nadat het schip de binnenwateren is
      binnengevaren een onafgebroken rusttijd heeft waarvan de omvang wordt bepaald door de uitkomst van de berekening
      van het aantal dagen dat de werknemer aan boord van het schip werkzaamheden heeft verricht, vermenigvuldigd met
      6 uur.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel53
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.263
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: 5:3
      - id: ref2
        bwb_id: BWBR0007671
        artikel: 5:3
  - number: 5.26:4
    text: |-
      1 Met uitsluiting van hetgeen in [artikel 4.3:1][ref1] is bepaald, kan in afwijking van
      de[ artikelen 5:7, derde lid][ref2], en [5:9, derde lid][ref3], van de wet ten aanzien van de arbeidstijd per
      dienst dit artikel worden toegepast.

      2 De werkgever organiseert de arbeid zodanig, dat de werknemer van 18 jaar of ouder ten hoogste éénmaal in elke
      periode van 2 achtereen-volgende weken 14 uren per dienst arbeid verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007687#Artikel4.31
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel57
      [ref3]: https://wetten.overheid.nl/BWBR0007671#Artikel59
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.264
    references:
      - id: ref1
        bwb_id: BWBR0007687
        artikel: 4.3:1
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0007671
        artikel: 5:7
      - id: ref3
        bwb_id: BWBR0007671
        artikel: 5:9
  - number: 5.27:1
    text: |-
      Met uitsluiting van hetgeen in [paragraaf 5.19][ref1] is bepaald, is deze paragraaf van toepassing op arbeid die
      bestaat uit ambulancezorg en de direct daarmee samenhangende werkzaamheden, verricht door de werknemer van 18 jaar
      of ouder.


      [ref1]: https://wetten.overheid.nl/BWBR0007687#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.271
    references:
      - id: ref1
        bwb_id: BWBR0007687
        hoofdstuk: '5'
        paragraaf: '5.19'
  - number: 5.27:2
    text: |-
      1 In afwijking van [artikel 4.8:1, derde lid, onderdeel b][ref1], kan dit artikel worden toegepast.

      2 De werkgever organiseert de arbeid zodanig dat de werknemer vóór en nà een aanwezigheidsdienst een onafgebroken
      rusttijd heeft van ten minste 11 uren, welke rusttijd in elke aaneengesloten tijdruimte van 7 maal 24 uren mag
      worden ingekort tot éénmaal ten minste 10 uren enéé nmaal ten minste 8 uren.


      [ref1]: https://wetten.overheid.nl/BWBR0007687#Artikel4.81
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.272
    references:
      - id: ref1
        bwb_id: BWBR0007687
        artikel: 4.8:1
        hoofdstuk: '4'
        paragraaf: '4.8'
  - number: 5.27:3
    text: |-
      1 Ter aanvulling van [artikel 5:11][ref1] van de wet en in afwijking van
      [artikel 5:11, derde lid, onderdeel a][ref2], van de wet kan dit artikel worden toegepast.

      2 Een bereikbaarheidsdienst wordt, met inachtneming van het derde lid, uitsluitend bij collectieve regeling
      bepaald. Elk beding waarbij op andere wijze dan in de eerste volzin is bepaald, gebruik wordt gemaakt van het derde
      lid, is nietig.

      3 De werkgever organiseert de arbeid zodanig, dat de werknemer ten hoogste 3 maal in elke tijdruimte van 7 maal 24
      uren en 37 maal in elke periode van 13 achtereenvolgende weken een bereikbaarheidsdienst wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel511
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel511
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.273
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: 5:11
      - id: ref2
        bwb_id: BWBR0007671
        artikel: 5:11
  - number: 5.27:4
    text: |-
      Indien consignatie, aanwezigheidsdiensten en bereikbaarheidsdiensten worden opgelegd, organiseert de werkgever de
      arbeid zodanig, dat de werknemer ten hoogste 3 maal in elke aaneengesloten tijdruimte van 7 maal 24 uren en 26 maal
      in elke periode van 13 achtereenvolgende weken consignatie, een aanwezigheidsdienst of een bereikbaarheidsdienst
      wordt opgelegd.
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.274
