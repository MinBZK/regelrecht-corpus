  - number: 5.13:1
    text: Deze paragraaf is uitsluitend van toepassing op landbouwarbeid, verricht door de werknemer van 18 jaar of ouder.
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.131
  - number: 5.13:2
    text: |-
      1 In afwijking van [artikel 5:3, tweede lid, van de wet][ref1] kan dit artikel worden toegepast.

      2 Uitsluitend bij collectieve regeling kan, met inachtneming van het derde lid, van
      [artikel 5:3, tweede lid, van de wet][ref2] worden afgeweken voor arbeid:

      a. die bestaat uit het verzorgen van dieren;

      b. die uitsluitend bestaat uit het oogsten van vlas, tijdens de oogstperiode van 1 juli tot en met 30 september.

      Elk beding waarbij op andere wijze dan in de vorige volzin is bepaald, wordt afgeweken van
      [artikel 5:3, tweede lid, van de wet][ref3] is nietig.

      3 De werkgever organiseert de arbeid zodanig, dat de werknemer een onafgebroken rusttijd heeft van hetzij
      ten minste 36 uren in elke aaneengesloten tijdruimte van 7 maal 24 uren, hetzij ten minste 60 uren in elke
      aaneengesloten tijdruimte van 14 maal 24 uren.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Paragraaf5.3
      [ref3]: https://wetten.overheid.nl/BWBR0007671#Artikel53
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.132
