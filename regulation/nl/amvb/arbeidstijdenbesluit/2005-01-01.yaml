  - number: 5.19:4
    text: |-
      Indien consignatie, aanwezigheidsdiensten en bereikbaarheidsdiensten worden opgelegd, organiseert de werkgever de
      arbeid zodanig, dat de werknemer ten hoogste 3 maal in elke aaneengesloten tijdruimte van 7 maal 24 uren en 26 maal
      in elke periode van 13 achtereenvolgende weken consignatie, een aanwezigheidsdienst of een bereikbaarheidsdienst
      wordt opgelegd.
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.194
  - number: 5.20:1
    text: |-
      Deze paragraaf is uitsluitend van toepassing op de werknemer van 18 jaar of ouder die arbeid verricht als arts, of
      die na het behalen van het doctoraal examen geneeskunde hiertoe in opleiding is, of als tandarts tot tandheelkundig
      specialist in opleiding is, of die als verloskundige werkzaam is in de intramurale gezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.201
  - number: 5.20:2
    text: |-
      1 In afwijking van de[ artikelen 5:7, derde lid][ref1], [5:8, derde lid, onderdeel ][ref2], [5:9, derde lid][ref3],
      en [5:11, derde lid, onderdelen ][ref4], van de wet ten aanzien van de arbeidstijd per week onderscheidenlijk per 4
      weken onderscheidenlijk per 13 weken kan dit artikel worden toegepast.

      2 De werkgever organiseert de arbeid zodanig, dat de werknemer in elke periode van 13 achtereenvolgende weken ten
      hoogste gemiddeld 48 uren per week arbeid verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0007671#Artikel59
      [ref4]: https://wetten.overheid.nl/BWBR0007671#Artikel511
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.202
