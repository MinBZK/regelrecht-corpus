      Deze paragraaf is uitsluitend van toepassing op beveiligingswerkzaamheden die worden verricht
      door de werknemer van 18 jaar of ouder en waarvoor die werknemer toestemming als bedoeld in
      [artikel 7, tweede lid, van de Wet particuliere beveiligingsorganisaties en recherchebureaus][ref1]
      heeft verkregen en bij de uitvoering van die werkzaamheden een legitimatiebewijs als bedoeld in
      [artikel 9, vierde lid, van die wet][ref2] bij zich draagt.


      [ref1]: https://wetten.overheid.nl/BWBR0008973#Artikel7
