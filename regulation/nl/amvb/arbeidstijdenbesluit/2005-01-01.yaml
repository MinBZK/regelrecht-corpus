      1 De[ artikelen 4:2][ref1] en [4:3][ref2] en de[ hoofdstukken 5][ref3] en [6][ref4] van de wet en de daarop
      berustende bepalingen zijn niet van toepassing op arbeid verricht door de werknemer van 18 jaar of ouder:

      a. die namens de werkgever uitsluitend of in hoofdzaak leiding geeft aan werknemers die voor die werkgever
      arbeid verrichten en van wie het jaarlijks in geld vastgesteld loon ten minste tweemaal het bedrag, vastgesteld
      overeenkomstig [artikel 2.1:6][ref5], bedraagt;

      b. die namens de werkgever en in diens plaats een landbouwbedrijf uitoefent en daarin landbouwarbeid verricht
      en van wie het jaarlijks in geld vastgesteld loon ten minste tweemaal het bedrag, vastgesteld overeenkomstig
      [artikel 2.1:6][ref6], bedraagt;

      c. die de werkgever of de werknemer, bedoeld in de onderdelen *a* of *b*, vervangt, gedurende die vervanging, mits
      het jaarlijks in geld vastgesteld loon van die werknemer ten minste tweemaal het bedrag, vastgesteld overeenkomstig
      [artikel 2.1:6][ref7], bedraagt;

      d. wiens jaarlijks in geld vastgesteld loon ten minste driemaal het bedrag, vastgesteld overeenkomstig
      [artikel 2.1:6][ref8], bedraagt.

      2 Het eerste lid, onderdelen *b* tot en met *d*, is niet van toepassing op arbeid verricht op of vanaf een
      mijnbouwinstallatie.

      3 Het eerste lid, onderdeel *d*, is niet van toepassing op de werknemer die:

      a. arbeid pleegt te verrichten in nachtdienst;

      b. arbeid verricht waaraan of in rechtstreeks verband waarmee ernstige gevaren voor de veiligheid of de gezondheid
      van personen zijn verbonden.


