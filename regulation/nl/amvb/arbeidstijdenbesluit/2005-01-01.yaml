        bwb_id: BWBR0007671
        artikel: 5:5
  - number: 5.19:3
    text: |-
      1 Ter aanvulling van [artikel 5:11][ref1] van de wet en in afwijking van
      [artikel 5:11, derde lid, onderdeel a, en vierde lid][ref2], van de wet kan dit artikel worden toegepast.

      2 Een bereikbaarheidsdienst wordt, met inachtneming van het derde of vierde lid, uitsluitend bij collectieve
      regeling bepaald. Elk beding waarin op andere wijze dan in de eerste volzin is bepaald, gebruik wordt gemaakt van
      het derde of vierde lid, is nietig.

      3 De werkgever organiseert de arbeid zodanig, dat de werknemer ten hoogste 3 maal in elke tijdruimte van 7 maal 24
      uren en 26 maal in elke periode van 13 achtereenvolgende weken een bereikbaarheidsdienst wordt opgelegd.

      4 De werkgever organiseert de arbeid zodanig dat de werknemer in elke periode van 13 weken ten hoogste gemiddeld 45
      uren per week arbeid verricht mits hij voldoet aan de voorwaarden, bedoeld in [artikel 4.8:4, tweede lid][ref3], of
      aan een de voorwaarden, bedoeld in [artikel 4.8:4, derde lid][ref4].


