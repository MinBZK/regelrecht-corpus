    text: |-
      1 In afwijking van [artikel 5:8, derde lid, onderdeel ][ref1], van de wet kan, echter uitsluitend indien de arbeid
      door het nemen van andere maatregelen redelijkerwijs niet anders is te organiseren, dit artikel worden toegepast.

      2 De werkgever organiseert de arbeid zodanig, dat de werknemer die arbeid verricht in nachtdienst hetzij ten
      hoogste 42 maal in elke periode van 13 achtereenvolgende weken en 140 maal in elke periode van 52 achtereenvolgende
      weken arbeid in nachtdienst verricht, hetzij ten hoogste 38 uren in elke periode van 2 achtereenvolgende weken
      arbeid verricht tussen 00.00 uur en 06.00 uur.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel58
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.23
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: 5:8
  - number: 5.3:1
    text: |-
      Deze paragraaf is uitsluitend van toepassing op arbeid verricht door de werknemer van 18 jaar of ouder:

      a. die met goed gevolg een brandweeropleiding heeft afgesloten met een vanwege Onze Minister van Binnenlandse Zaken
      afgenomen examen dan wel door voornoemd minister is vrijgesteld van de aan die opleiding verbonden diploma-eis en
      die als zodanig werkzaam is;

      b. die in directe samenhang met de in onderdeel *a* bedoelde werknemer arbeid verricht voor de in dat onderdeel
      bedoelde arbeid.
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.31
  - number: 5.3:2
    text: |-
      1 Dit artikel is uitsluitend van toepassing op de werknemer die lid is van de vrijwillige brandweer en de functie
      van commandant of ondercommandant vervult.

      2 In afwijking van [artikel 5:11, derde lid, onderdelen ][ref1], van de wet kan dit artikel worden toegepast.

      3 Indien dit door het nemen van andere maatregelen redelijkerwijs niet is te voorkomen, organiseert de werkgever
      de arbeid zodanig, dat de in het eerste lid bedoelde werknemer gedurende ten minste 13 maal een aaneengesloten
      tijdruimte van 7 maal 24 uren in elke periode van 26 achtereenvolgende weken geen consignatie tussen twee
      opeenvolgende diensten wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel511
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.32
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: 5:11
  - number: 5.3:3
    text: |-
      1 Dit artikel is niet van toepassing op de werknemer die lid is van de vrijwillige brandweer.

      2 Met uitsluiting van hetgeen in [artikel 4.8:1][ref1] is bepaald, kan, ter aanvulling van [artikel 5:11][ref2] van
      de wet en in afwijking van [artikel 5:11, derde en vierde lid][ref3], van de wet dit artikel worden toegepast.

      3 De werknemer:

      a. wordt ten hoogste 3 maal in elke aaneengesloten tijdruimte van 7 maal 24 uren en 31 maal in elke periode van 13
      achtereenvolgende weken een aanwezigheidsdienst opgelegd;

      b. heeft vóór en ná een aanwezigheidsdienst een onafgebroken rusttijd van ten minste 11 uren;

      c. verricht ten hoogste 9 uren in elke periode van 24 achtereenvolgende uren en in elke periode van 13
      achtereenvolgende weken gemiddeld 40 uren per week arbeid.

      4 Van het derde lid kan, met inachtneming van het vijfde lid, slechts bij collectieve regeling worden afgeweken.
      Elk beding waarbij op andere wijze dan in de vorige volzin is bepaald, wordt afgeweken van het derde lid, is
      nietig.

      5 De werkgever organiseert de arbeid zodanig, dat de werknemer:

      a. ten hoogste 4 maal in elke aaneengesloten tijdruimte van 7 maal 24 uren, 46 maal in elke periode van 13
      achtereenvolgende weken en 124 maal in elke periode van 52 achtereenvolgende weken een aanwezigheidsdienst wordt
      opgelegd;

      b. vóór en ná een aanwezigheidsdienst een onafgebroken rusttijd heeft van ten minste 11 uren, welke rusttijd
      éénmaal in elke aaneengesloten tijdruimte van 7 maal 24 uren mag worden ingekort tot ten minste 8 uren;

      c. ten hoogste 10 uren in elke periode van 24 achtereenvolgende uren en in elke periode van 13 achtereenvolgende
      weken gemiddeld 45 uren per week arbeid verricht.

      6 Het vijfde lid, onderdeel *b*, blijft buiten toepassing, indien zich incidentele en onvoorziene omstandigheden
      voordoen waardoor het aantal werknemers dat nodig is onder het vereiste minimum komt, die een dergelijke afwijking
      noodzakelijk maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0007687#Artikel4.81
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel511
      [ref3]: https://wetten.overheid.nl/BWBR0007671#Artikel511
