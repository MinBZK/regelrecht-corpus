  - number: 4.3:1
    text: |-
      1 In afwijking van de[ artikelen 5:7, eerste en derde lid][ref1], [5:8, eerste lid, onderdeel ][ref2], en
      [5:9, eerste en derde lid][ref3], van de wet ten aanzien van de arbeidstijd per dienst onderscheidenlijk per
      nachtdienst kan dit artikel worden toegepast.

      2 Indien de arbeid geen uitstel gedoogt en door het nemen van andere maatregelen redelijkerwijs niet is te
      voorkomen, organiseert de werkgever de arbeid zodanig, dat de werknemer van 18 jaar of ouder ten hoogste éénmaal in
      elke periode van 2 achtereenvolgende weken 14 uren per dienst onderscheidenlijk per nachtdienst arbeid verricht.

      3 Het tweede lid is eveneens van toepassing, indien de arbeid wordt verstoord door een zich plotseling voordoende
      situatie:

      a. waarbij personen ernstig letsel oplopen, dan wel daartoe de onmiddellijke dreiging bestaat;

      b. waarbij buitengewoon ernstige schade aan goederen ontstaat, dan wel dreigt te ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0007671#Artikel59
