  - number: 5.12:2
    text: |-
      1 Uitsluitend bij collectieve regeling kan, met inachtneming van het tweede lid, van
      [artikel 5:5, tweede lid][ref1], van de wet onder gelijktijdige uitsluiting van hetgeen in dat artikellid is
      bepaald, worden afgeweken. Elk beding waarbij op andere wijze dan in de vorige volzin is bepaald, wordt afgeweken
      van [artikel 5:5, tweede lid][ref2], van de wet is nietig.

      2 De werkgever organiseert de arbeid zodanig, dat de werknemer:

      a. een onafgebroken rusttijd heeft van ten minste 11 uren in een aaneengesloten tijdruimte van 24 uren, welke
      rusttijd 12 maal in elke periode van 4 achtereenvolgende weken mag worden ingekort tot ten minste 10 uren;

      b. in elke periode van 52 achtereenvolgende weken gemiddeld 40 uren per week arbeid verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel55
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.122
