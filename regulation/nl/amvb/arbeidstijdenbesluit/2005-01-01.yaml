  - number: 4.8:3
    text: |-
      1 Uitsluitend bij collectieve regeling kan in afwijking van [artikel 5:11, derde lid, onderdeel a][ref1],
      van de wet dit artikel worden toegepast, indien de aard van de arbeid met zich brengt dat het voor de
      werknemer te belastend is om in een aaneengesloten periode van 7 maal 24 uur consignatie opgelegd te
      krijgen. Elk beding waarbij op een andere wijze dan in de eerste volzin is bepaald, wordt afgeweken van
      [artikel 5:11, derde lid, onderdeel a][ref2], van de wet is nietig.

      2 De werkgever organiseert de arbeid zodanig dat de werknemer in elke periode van 4 achtereenvolgende weken:

      a. ten minste 14 maal een tijdruimte van 24 achtereenvolgende uren geen consignatie wordt opgelegd en

      b. ten minste 2 maal een aaneengesloten tijdruimte van 48 uren geen arbeid verricht noch consignatie wordt
      opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel511
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel511
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel4.83
