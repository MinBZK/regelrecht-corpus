      [Artikel 5:4][ref1] van de wet is niet van toepassing op arbeid verricht door de werknemer in verband met het
      vervullen van een geestelijk ambt alsmede op arbeid verricht door de werknemer die hem in de uitoefening van dat
      ambt bijstaat.


