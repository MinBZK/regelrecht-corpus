  - number: 5.19:1
    text: |-
      Deze paragraaf is uitsluitend van toepassing op arbeid die bestaat uit verpleging of verzorging, verricht door de
      werknemer van 18 jaar of ouder.
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.191
  - number: 5.19:2
    text: |-
      1 Ter aanvulling van [artikel 5:5, tweede lid][ref1], van de wet kan dit artikel worden toegepast.

      2 Uitsluitend bij collectieve regeling kan, met inachtneming van het derde lid, de rusttijd in elke aaneengesloten
      tijdruimte van 7 maal 24 uren worden ingekort. Elk beding waarin op andere wijze dan in de eerste volzin is
      bepaald, gebruik wordt gemaakt van het derde lid, is nietig.

      3 De werkgever organiseert de arbeid van de werknemer zodanig, dat diens onafgebroken rusttijd in elke
      aaneengesloten tijdruimte van 7 maal 24 uren ten hoogste éénmaal wordt ingekort tot ten minste 10 uren.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel55
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.192
