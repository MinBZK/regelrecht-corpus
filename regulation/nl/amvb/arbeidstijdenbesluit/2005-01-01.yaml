        bwb_id: BWBR0007671
        artikel: 5:8
  - number: 5.4:3
    text: |-
      1 Dit artikel is uitsluitend van toepassing op arbeid verricht in nachtdienst door een jeugdige werknemer
      die een opleiding volgt tot brood- en banketbakker, tot broodbakker of tot leidinggevende in de bakkerij
      door middel van hetzij een beroepsbegeleidende hetzij een beroepsopleidende leerweg in het kader van de
      [Wet Educatie en Beroepsonderwijs][ref1], voorzover die arbeid noodzakelijk is in het kader van die opleiding.

      2 Uitsluitend bij collectieve regeling kan, met inachtneming van het derde lid, van
      [artikel 5:5, eerste lid][ref2], van de wet ten aanzien van de periode die in de onafgebroken rusttijd moet zijn
      gelegen, worden afgeweken. Elk beding waarbij op andere wijze dan in de eerste volzin is bepaald, wordt afgeweken
      van [artikel 5:5, eerste lid][ref3], van de wet is nietig.

      3 De werkgever organiseert de arbeid zodanig, dat de jeugdige werknemer die arbeid in nachtdienst verricht:

      a. geen arbeid verricht tussen 22.00 uur en 04.00 uur;

      b. ten hoogste 8 uren per nachtdienst en 40 uren per week arbeid verricht;

      c. ten hoogste 4 maal in elke aaneengesloten tijdruimte van 7 maal 24 uren arbeid in nachtdienst verricht;

      d. na het verrichten van arbeid in nachtdienst een onafgebroken rusttijd heeft van ten minste 14 uren.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0007671#Artikel55
