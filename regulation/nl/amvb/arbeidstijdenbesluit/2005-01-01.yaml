  - number: 4.6:2
    text: |-
      1 Uitsluitend bij collectieve regeling kan van [artikel 5:11, eerste en derde lid, onderdeel ][ref1], van de wet
      ten aanzien van de pauze worden afgeweken, indien de aard van de arbeid het noodzakelijk maakt dat de werknemer
      tijdens de pauze bereikbaar is onderscheidenlijk op de arbeidsplaats aanwezig is om op oproep zo spoedig mogelijk
      die arbeid te verrichten en dit door het op een andere wijze organiseren van de arbeid redelijkerwijs niet
      is te voorkomen. Elk beding waarbij op andere wijze dan in de eerste volzin is bepaald, wordt afgeweken van
      [artikel 5:11, eerste en derde lid, onderdeel ][ref2], van de wet is nietig.

      2 Voor de toepassing van dit artikel geldt de tijd tijdens de arbeidsplaatsgebonden pauze waarop arbeid van de
      werknemer zich uitsluitend beperkt tot de verplichte aanwezigheid op de arbeidsplaats, als pauze.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel511
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel511
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel4.62
