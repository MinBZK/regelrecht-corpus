        bwb_id: BWBR0007671
        artikel: 5:8
  - number: 5.26:1
    text: |-
      Voor de toepassing van deze paragraaf wordt onder binnenwateren verstaan: de binnenwateren, bedoeld in
      [artikel 1, onderdeel d, van de Wet vaartijden en bemanningssterkte binnenvaart][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006029#Artikel1
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.261
