  - number: 8.1:1
    text: |-
      1 In afwijking van [artikel 5:8, eerste lid, onderdeel ][ref1], van de wet organiseert de werkgever de arbeid
      zodanig, dat de werknemer van 18 jaar of ouder in elke periode van 4 achtereenvolgende weken ten hoogste 20 maal
      arbeid verricht in nachtdienst, indien:

      a. die werknemer direct voorafgaand aan het tijdstip van de inwerkingtreding van de wet en de daarop berustende
      bepalingen een aantal jaren aaneengesloten volgens een arbeidstijdpatroon dat daarmee gelijkenis vertoont arbeid
      heeft verricht;

      b. het in onderdeel *a* bedoelde arbeidstijdpatroon niet in strijd is geweest met de voor het tijdstip van
      inwerkingtreding van de wet op die arbeid van toepassing zijnde wet- en regelgeving terzake van arbeids- en
      rusttijden;

      c. dit door het op een andere wijze organiseren van de arbeid redelijkerwijs niet is te voorkomen.

      2 Zolang het eerste lid van toepassing is, bewaart de werkgever de gegevens en bescheiden die betrekking hebben op
      dat artikellid, onderdeel *a*.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel58
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel8.11
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: 5:8
  - number: 8.1:2
    text: |-
      [Artikel 8.1:1][ref1] vervalt 10 jaren na het tijdstip van inwerkingtreding van dit besluit.


