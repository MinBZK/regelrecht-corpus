  - number: 4.1:1
    text: Deze paragraaf is uitsluitend van toepassing op arbeid verricht in het kader van een alternatieve sanctie.
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel4.11
  - number: 4.1:2
    text: |-
      1 In afwijking van [artikel 5:6][ref1] van de wet kan dit artikel worden toegepast.

      2 De werkgever voor wie de jeugdige werknemer arbeid in het kader van een alternatieve sanctie verricht,
      organiseert de arbeid zodanig, dat die werknemer ten hoogste 10 uren per dienst en 55 uren per week arbeid
      verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel56
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: 5:6
  - number: 4.1:3
    text: |-
      1 In afwijking van [artikel 5:7][ref1] van de wet kan dit artikel worden toegepast.

      2 De werkgever voor wie de werknemer van 18 jaar of ouder arbeid in het kader van een alternatieve sanctie
      verricht, organiseert de arbeid zodanig, dat die werknemer ten hoogste 12 uren per dienst en 60 uren per week
      arbeid verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel57
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: 5:7
  - number: 4.1:4
    text: |-
      De werknemer die bij een werkgever arbeid verricht in het kader van een alternatieve sanctie, verstrekt aan die
      werkgever uit eigen beweging tijdig de voor de naleving van de wet en de daarop berustende bepalingen nodige
      inlichtingen betreffende zijn arbeid.
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel4.14
  - number: 4.2:1
    text: |-
      Voor de toepassing van deze paragraaf wordt verstaan onder feestdag: Nieuwjaarsdag, Eerste en Tweede Paasdag,
      Hemelvaartsdag, Eerste en Tweede Pinksterdag en Eerste en Tweede Kerstdag.
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel4.21
  - number: 4.2:2
    text: |-
      1 In afwijking van [artikel 5:9, eerste en derde lid][ref1], van de wet ten aanzien van de arbeidstijd per dienst
      onderscheidenlijk per nachtdienst kan dit artikel worden toegepast.

      2 Indien de aard van de arbeid of de bedrijfsomstandigheden dit in verband met de feestdag, Koninginnedag of
      5 december noodzakelijk maakt, organiseert de werkgever de arbeid zodanig, dat de werknemer van 18 jaar of
      ouder in de aaneengesloten periode van 7 dagen voorafgaand aan die dag ten hoogste tweemaal 14 uren per dienst
      onderscheidenlijk per nachtdienst arbeid verricht.

      3 Indien een door godsdienstige opvattingen ingegeven feestdag, anders dan bedoeld in [artikel 4.2:1][ref2], de
      aard van de arbeid of de bedrijfsomstandigheden beïnvloedt op een wijze die gelijkenis vertoont met de beïnvloeding
      van een aldaar bedoelde feestdag, is het tweede lid van overeenkomstige toepassing.

      4 [Artikel 4.3:1][ref3] is niet van toepassing indien dit artikel wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0007687#Artikel4.21
      [ref3]: https://wetten.overheid.nl/BWBR0007687#Artikel4.31
