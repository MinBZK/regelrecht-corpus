    text: |-
      1 Bij collectieve regeling kan, met inachtneming van het tweede lid, worden afgeweken van
      [artikel 5:11, derde en vierde lid][ref1], van de wet. Elk beding waarbij op andere wijze dan in de vorige volzin
      is bepaald, wordt afgeweken van [artikel 5:11, derde en vierde lid][ref2], van de wet is nietig.

      2 De werkgever organiseert de arbeid zodanig dat de werknemer die consignatie wordt opgelegd ten hoogste 13 uren in
      elke periode van 24 achtereenvolgende uren en 85 uren per week arbeid verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel511
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel511
