  - number: 5.12:1
    text: |-
      Met uitsluiting van hetgeen in [paragraaf 5.16][ref1] is bepaald, is deze paragraaf uitsluitend van toepassing op
      arbeid, die bestaat uit werkzaamheden met betrekking tot het totstandkomen en het uitzenden van audio-, visuele
      of audio-visuele producties alsmede de direct daarmee samenhangende werkzaamheden, verricht door werknemers van 18
      jaar of ouder.


      [ref1]: https://wetten.overheid.nl/BWBR0007687#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.121
