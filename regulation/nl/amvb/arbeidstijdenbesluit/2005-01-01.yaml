  - number: 5.14:9
    text: |-
      1 Dit artikel is uitsluitend van toepassing op arbeid die bestaat uit saturatieduiken en de direct daarmee
      samenhangende werkzaamheden, verricht ten behoeve van een mijnbouwinstallatie door een werknemer van 18 jaar of
      ouder.

      2 In afwijking van de[ artikelen 5:7, derde lid][ref1], en [5:8, derde lid, onderdeel a][ref2], ten
      aanzien van de arbeidstijd per nachtdienst, en de onderdelen b tot en met d, van de wet kan dit artikel
      worden toegepast. Uitsluitend bij collectieve regeling kan met inachtneming van het derde lid, van
      de[ artikelen 5:3, tweede lid][ref3], en [5:5, tweede lid][ref4], van de wet worden afgeweken. Elk beding waarbij
      op een andere wijze dan in de eerste volzin is bepaald, wordt afgeweken van de[ artikelen 5:3, tweede lid][ref5],
      [5:5, tweede lid][ref6], van de wet is nietig.

      3 De werkgever organiseert de arbeid zodanig, dat de werknemer:

      a. gedurende ten hoogste 28 maal achtereen ten hoogste 11 uren per dienst onderscheidenlijk per nachtdienst en in
      een periode van 13 achtereenvolgende weken gemiddeld 40 uren per week arbeid verricht;

      b. na arbeid te hebben verricht in die dienst een onafgebroken rusttijd heeft van ten minste 12 uren.

      4 Indien dit artikel wordt toegepast, organiseert de werkgever de arbeid van de werknemer zodanig, dat tegenover
      iedere periode van 24 uren waarin werkzaamheden worden verricht, als bedoeld in het eerste lid, na het beëindigen
      van de werkzaamheden direct aansluitend een onafgebroken rusttijd staat van ten minste 24 uren elders.


