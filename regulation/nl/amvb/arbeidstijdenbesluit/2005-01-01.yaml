  - number: 4.4:1
    text: |-
      1 Ten aanzien van de arbeidstijd per dienst onderscheidenlijk per nachtdienst en de onafgebroken rusttijd kan, in
      afwijking van [paragraaf 5.2][ref1] van de wet en de [paragrafen 4.2][ref2] en [4.5][ref3] en [hoofdstuk 5][ref4],
      dit artikel worden toegepast.

      2 De werkgever organiseert de arbeid zodanig, dat de arbeidstijd per dienst of per nachtdienst onderscheidenlijk
      de onafgebroken rusttijd met ten hoogste 15 achtereenvolgende minuten wordt verlengd onderscheidenlijk ingekort,
      indien de werkzaamheden van de werknemer van 18 jaar of ouder aan het einde van zijn dienst onderscheidenlijk
      nachtdienst worden overgenomen en direct daaropvolgend worden voortgezet door een andere werknemer en een goede
      voortgang van die werkzaamheden overdracht noodzakelijk maakt.

      3 Op de afwijking, bedoeld in het tweede lid, zijn [artikel 5:8, eerste lid, onderdeel ][ref5], van
      de wet en de[ artikelen 4.7:1, tweede lid][ref6], [5.1:4, tweede lid, onderdeel ][ref7], 5.2:3, derde
      lid, [5.4:2, tweede lid, onderdeel ][ref8], [5.5:2, tweede lid][ref9], [5.7:2, tweede lid][ref10],
      [5.8:3, tweede lid][ref11], [5.14:2, derde lid, onderdeel a, en vijfde lid, onderdeel a][ref12],
      [5.14:5, derde lid, onderdeel a][ref13], en [8.1:1, eerste lid](onbekend), niet van toepassing.


