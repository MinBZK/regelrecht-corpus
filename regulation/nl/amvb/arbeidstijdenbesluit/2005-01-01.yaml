  - number: 4.5:1
    text: |-
      Deze paragraaf is uitsluitend van toepassing op arbeid die semi- of volcontinu in een ploegenstelsel door de
      werknemer van 18 jaar of ouder wordt verricht.
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel4.51
  - number: 4.5:2
    text: |-
      1 In afwijking van [artikel 5:3, tweede lid][ref1], van de wet kan dit artikel worden toegepast.

      2 De werkgever organiseert de arbeid zodanig, dat de werknemer een onafgebroken rusttijd heeft van hetzij
      ten minste 36 uren in elke aaneengesloten tijdruimte van 7 maal 24 uren, hetzij ten minste 92 uren in elke
      aaneengesloten tijdruimte van 11 maal 24 uren.

      3 Van de onafgebroken rusttijd in elke aaneengesloten tijdruimte van 11 maal 24 uren, bedoeld in het tweede lid,
      kan, met in achtneming van het vierde lid, slechts bij collectieve regeling worden afgeweken. Elk beding waarbij op
      andere wijze dan in de vorige volzin is bepaald, wordt afgeweken van het tweede lid, is nietig.

      4 De werkgever organiseert de arbeid zodanig, dat de werknemer een onafgebroken rusttijd heeft van ten minste
      92 uren in elke aaneengesloten tijdruimte van 11 maal 24 uren, welke rusttijd éénmaal in elke periode van 5
      achtereenvolgende weken mag worden bekort tot 72 uren.

      5 De in het tweede en vierde lid bedoelde tijdruimte vangt aan op het eerste tijdstip van de dag, waarop de
      werknemer arbeid verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel53
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel4.52
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: 5:3
  - number: 4.5:3
    text: |-
      1 In afwijking van de[ artikelen 5:7, derde lid][ref1], en [5:8, derde lid, onderdeel ][ref2],
      van de wet ten aanzien van de arbeidstijd per dienst onderscheidenlijk per nachtdienst en van
      [artikel 5:8, derde lid, onderdeel ][ref3], van de wet, kan dit artikel worden toegepast.

      2 De werkgever organiseert de arbeid zodanig, dat de werknemer in de tijdruimte tussen zaterdag 18.00 uur en de
      daaropvolgende maandag 08.00 uur:

      a. ten hoogste 11 uren per dienst onderscheidenlijk per nachtdienst arbeid verricht;

      b. na het verrichten van die arbeid een onafgebroken rusttijd heeft van ten minste 12 uren.

      3 Indien dit artikel wordt toegepast, organiseert de werkgever de arbeid van de in dat lid bedoelde werknemer
      zodanig, dat deze op ten minste 26 zondagen in elke periode van 52 achtereenvolgende weken geen arbeid verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel58
