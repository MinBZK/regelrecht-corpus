  - number: 5.14:6
    text: |-
      1 In afwijking van [artikel 5:10, zevende lid][ref1], van de wet wordt, indien
      de[ artikelen 5.14:2 tot en met 5.14:5 ][ref2]van toepassing zijn, dit artikel toegepast.

      2 De werkgever organiseert de arbeid zodanig, dat de in het[ tweede lid van artikel 5:10][ref3] van de wet bedoelde
      pauze ten minste één uur bedraagt, welke mag worden gesplitst in 2 of meer pauzes.


