      2 Voor de toepassing van dit besluit geldt de tijd tijdens een aanwezigheidsdienst of piket waarop de arbeid van de
      werknemer zich uitsluitend beperkt tot de verplichte aanwezigheid op de arbeidsplaats, als rusttijd.


