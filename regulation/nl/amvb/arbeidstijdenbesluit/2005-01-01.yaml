    text: |-
      1 Dit artikel is uitsluitend van toepassing op de werknemer die lid is van de vrijwillige brandweer.

      2 Met uitsluiting van hetgeen in [artikel 4.8:1][ref1] is bepaald, kan, ter aanvulling van [artikel 5:11][ref2] van
      de wet en in afwijking van [artikel 5:11, derde en vierde lid][ref3], van de wet dit artikel worden toegepast.

      3 Een aanwezigheidsdienst wordt, met inachtneming van het vierde lid, uitsluitend bij collectieve regeling bepaald.
      Elk beding waarbij op andere wijze dan in de eerste volzin is bepaald, gebruik wordt gemaakt van het vierde lid,
      is nietig.

      4 De werkgever organiseert de arbeid zodanig, dat de werknemer:

      a. ten hoogste éénmaal in elke aaneengesloten tijdruimte van 7 maal 24 uren en 10 maal in elke periode van 13
      achtereenvolgende weken een aanwezigheidsdienst wordt opgelegd;

      b. ten hoogste 10 uren in elke periode van 24 achtereenvolgende uren en in elke periode van 13 achtereenvolgende
      weken gemiddeld 48 uren per week arbeid verricht.


