      Deze paragraaf is uitsluitend van toepassing op arbeid verricht door werknemers van 18 jaar of ouder, die in
      hun hoedanigheid van uitvaartverzorger onderscheidenlijk uitvaartleider, alle werkzaamheden in samenhang met een
      uitvaart organiseren.
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.171
  - number: 5.17:2
    text: |-
      1 Uitsluitend bij collectieve regeling kan met inachtneming van het tweede lid, van
      [artikel 5:3, tweede lid][ref1], van de wet worden afgeweken. Elk beding waarbij op andere wijze dan in de vorige
      volzin is bepaald, wordt afgeweken van [artikel 5:3, tweede lid][ref2], van de wet is nietig.

      2 De werkgever organiseert de arbeid zodanig, dat de werknemer een onafgebroken rusttijd heeft van ten minste
      36 uren in elke aaneengesloten tijdruimte van 7 maal 24 uren, welke rusttijd ten hoogste 18 maal in elke periode
      van 52 achtereenvolgende weken mag worden vervangen door een onafgebroken rusttijd van ten minste 96 uren in een
      aaneengesloten tijdruimte van 14 maal 24 uren.

      3 De in het tweede lid bedoelde tijdruimte vangt aan op het eerste tijdstip van de dag, waarop de werknemer arbeid
      verricht.


