  - number: 5.14:3
    text: |-
      1 Dit artikel is uitsluitend van toepassing op een werknemer die werkzaamheden in een bestendig en regelmatig
      arbeidspatroon verricht op een mijnbouwwerk, niet zijnde een mijnbouwinstallatie.

      2 In afwijking van de[ artikelen 5:7, derde lid][ref1], en [5:8, derde lid, met uitzondering van onderdeel b][ref2],
      van de wet ten aanzien van de arbeidstijd per dienst onderscheidenlijk per nachtdienst kan dit artikel worden
      toegepast. Uitsluitend bij collectieve regeling kan worden afgeweken van de[ artikelen 5:3, tweede lid][ref3], en
      [5:5, tweede lid][ref4], van de wet. Elk beding waarop op andere wijze dan in de vorige volzin is bepaald, wordt
      afgeweken van de[ artikelen 5:3, tweede lid][ref5], en [5:5, tweede lid][ref6], van de wet is nietig.

      3 [Artikel 5.14:2, vijfde tot en met tiende lid][ref7], zijn van overeenkomstige toepassing.


