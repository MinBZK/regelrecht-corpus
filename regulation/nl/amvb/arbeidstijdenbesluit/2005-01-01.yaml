  - number: 4.2:3
    text: |-
      1 In afwijking van de[ artikelen 5:7, derde lid][ref1], en [5:8, derde lid, onderdeel ][ref2],
      van de wet ten aanzien van de arbeidstijd per dienst onderscheidenlijk per nachtdienst en
      [artikel 5:8, derde lid, onderdeel ][ref3], van de wet kan dit artikel worden toegepast.

      2 De werkgever organiseert de arbeid zodanig, dat de werknemer van 18 jaar of ouder in de tijdruimte tussen de dag
      voorafgaand aan de feestdag 18.00 uur en de op de feestdag volgende dag 08.00 uur:

      a. ten hoogste 11 uren per dienst onderscheidenlijk per nachtdienst arbeid verricht;

      b. na het verrichten van die arbeid een onafgebroken rusttijd heeft van ten minste 12 uren.

      3 Indien het tweede lid wordt toegepast, organiseert de werkgever de arbeid zodanig, dat zoveel mogelijk werknemers
      geen arbeid verrichten in de tijdruimte gelegen tussen de feestdag 00.00 uur en de daarop volgende dag 06.00 uur.

      4 Bij collectieve regeling kan een door godsdienstige opvattingen ingegeven feestdag, anders dan bedoeld in
      [artikel 4.2:1][ref4], worden aangewezen waarop dit artikel van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0007671#Artikel58
      [ref4]: https://wetten.overheid.nl/BWBR0007687#Artikel4.21
