  - number: 5.4:1
    text: |-
      Deze paragraaf is uitsluitend van toepassing op arbeid de werknemer verricht en die die bestaat uit het bakken van
      brood en banket en de direct daarmee samenhangende werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.41
  - number: 5.4:2
    text: |-
      1 Dit artikel is uitsluitend van toepassing op arbeid verricht door werknemers van 18 jaar of ouder.

      2 In afwijking van [artikel 5:8, derde lid, onderdeel ][ref1], van de wet kan dit artikel worden toegepast.

      3 De werkgever organiseert de arbeid zodanig, dat de werknemer die arbeid verricht in nachtdienst:

      a. hetzij ten hoogste 42 maal in elke periode van 13 achtereenvolgende weken en 140 maal in elke periode van
      52 achtereenvolgende weken arbeid in nachtdienst verricht, hetzij ten hoogste 38 uren in elke periode van 2
      achtereenvolgende weken arbeid verricht tussen 00.00 uur en 06.00 uur;

      b. na een reeks van ten minste 3 en ten hoogste 6 maal achtereen arbeid te hebben verricht in nachtdienst, een
      onafgebroken rusttijd heeft van ten minste 36 uren.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel58
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.42
    references:
