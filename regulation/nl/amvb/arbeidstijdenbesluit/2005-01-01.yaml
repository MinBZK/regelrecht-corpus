  - number: 5.14:8
    text: |-
      1 Dit artikel is uitsluitend van toepassing op de werknemer die duikwerkzaamheden en de direct daarmee
      samenhangende werkzaamheden verricht op of vanaf of ten behoeve van een mijnbouwinstallatie.

      2 In afwijking van [artikel 5:8, derde lid, onderdeel a][ref1], ten aanzien van de arbeidstijd per nachtdienst, en
      de onderdelen *c* en *d*, van de wet kan dit artikel worden toegepast. Uitsluitend bij collectieve regeling kan,
      met inachtneming van het derde lid, van de[ artikelen 5:3, tweede lid][ref2], en [5:5, tweede lid][ref3], van de
      wet worden afgeweken. Elk beding waarbij op andere wijze dan in de vorige volzin is bepaald, wordt afgeweken van
      de[ artikelen 5:3, tweede lid][ref4] en [5:5, tweede lid][ref5], van de wet is nietig.

      3 De werkgever organiseert de arbeid zodanig, dat de werknemer:

      a. gedurende ten hoogste 21 maal in elke periode van 6 achtereenvolgende weken arbeid verricht;

      b. in elke periode van 6 achtereenvolgende weken gedurende ten minste 14 maal 24 achtereenvolgende uren, waarvan
      ten minste een aaneengesloten tijdruimte van 7 maal 24 achtereenvolgende uren, rust elders heeft;

      c. na arbeid te hebben verricht in een dienst onderscheidenlijk een nachtdienst een onafgebroken rusttijd heeft van
      ten minste 8 uren;

      d. ten hoogste 10 uren arbeid verricht per nachtdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel53
