  - number: 1:2
    text: |-
      In dit besluit wordt verstaan onder:

      a. wet: de [Arbeidstijdenwet][ref1];

      b. consignatie: hetgeen daaronder wordt verstaan in [artikel 5:11, eerste lid][ref2], van de wet;

      c. aanwezigheidsdienst: een aaneengesloten tijdruimte van ten hoogste 24 uren, waarin de werknemer, zonodig naast
      het verrichten van de bedongen arbeid, consignatie wordt opgelegd waarbij in afwijking van [artikel 5:11][ref3]
      van de wet die werknemer verplicht is om op de arbeidsplaats aanwezig te zijn om op oproep zo spoedig mogelijk de
      bedongen arbeid te verrichten;

      d. bereikbaarheidsdienst: een aaneengesloten tijdruimte van ten hoogste 24 uren, waarin de werknemer, zo
      nodig naast het verrichten van de bedongen arbeid, consignatie wordt opgelegd waarbij in afwijking van
      [artikel 5:11][ref4] van de wet die werknemer verplicht is om op oproep zo spoedig mogelijk de bedongen arbeid
      te verrichten;

      e. piket: een periode waarin de werknemer, zonodig naast het verrichten van de bedongen arbeid, consignatie wordt
      opgelegd waarbij in afwijking van [artikel 5:11][ref5] van de wet die werknemer verplicht is om in verband met zijn
      bereikbaarheid op de arbeidsplaats aanwezig te zijn;

      f. jeugdhulpverlening: residentiële en semi-residentiële hulpverlening als bedoeld in
      [artikel 1, tweede lid, onderdelen ][ref6], voor zover daarin personen plegen te worden verzorgd uit andere hoofde
      dan wegens hun lichamelijke of geestelijke gesteldheid;

      g. landbouwarbeid: alle arbeid die direct verband houdt met het ten behoeve van consumptie- en gebruiksartikelen
      verbouwen van gewassen en houden van dieren;

      h. mijnbouwwerk: hetgeen daaronder wordt verstaan in [artikel 1, onderdeel n, van de Mijnbouwwet](onbekend);

      i. mijnbouwinstallatie: hetgeen daaronder wordt verstaan in [artikel 1, onderdeel o, van de Mijnbouwwet](onbekend);

      j. verpleging en verzorging: de verpleging, de verzorging, de begeleiding, de medische behandeling of het medisch
      onderzoek van personen in verband met hun lichamelijke of geestelijke gesteldheid dan wel hun gevorderde leeftijd.


