        paragraaf: '5.14'
  - number: 5.14:5
    text: |-
      1 Voor de toepassing van dit artikel wordt verstaan onder een niet-bestendig of -regelmatig arbeidstijdpatroon een
      arbeidstijdpatroon waarin een werknemer gedurende ten hoogste 6 weken werkzaam is op dezelfde arbeidsplaats.

      2 In afwijking en ter aanvulling van de[ artikelen 5:3, tweede lid][ref1], [5:7][ref2] en
      [5:8, met uitzondering van het eerste lid, onderdeel b, en het derde lid, onderdeel b][ref3], van de wet kan dit
      artikel worden toegepast.

      3 De werkgever organiseert de arbeid zodanig, dat de werknemer die in een niet-bestendig en -regelmatig
      arbeidstijdpatroon werkzaam is:

      a. gedurende ten hoogste 15 maal in elke periode van 21 achtereenvolgende dagen, ten hoogste 11 uren per dienst
      onderscheidenlijk per nachtdienst, en in een periode van 13 achtereenvolgende weken gemiddeld 40 uren per week
      arbeid verricht;

      b. na arbeid te hebben verricht in die dienst een onafgebroken rusttijd heeft van ten minste 12 uren, welke
      rusttijd 3 maal in elke periode van 21 achtereenvolgende dagen mag worden ingekort tot ten minste 8 uren;

      c. in de in onderdeel a bedoelde periode van 21 achtereenvolgende dagen een onafgebroken rusttijd heeft van ten
      minste 72 uren.

      4 De arbeidstijd per dienst onderscheidenlijk per nachtdienst kan in afwijking van het derde lid, onderdeel a, 2
      maal in elke periode van 28 achtereenvolgende dagen worden verlengd met ten hoogste één uur voor het verrichten
      van arbeid die bestaat uit oefeningen die tot doel hebben de bekwaamheid en de bedrevenheid in het uitvoeren van
      maatregelen en procedures ten tijde van ongelukken en calamiteiten te verkrijgen of te behouden.

      5 Indien het vierde lid wordt toegepast kan in afwijking van het derde lid, onderdeel b, de onafgebroken rusttijd
      van ten minste 12 uren worden ingekort met ten hoogste één uur.

      6 Indien dit artikel wordt toegepast, organiseert de werkgever de arbeid van de werknemer zodanig, dat
      tegenover iedere periode van 24 uren welke wordt doorgebracht op of vanaf een mijnbouwwerk in een periode van 13
      achtereenvolgende weken een onafgebroken rusttijd staat van ten minste 24 uren elders.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel57
