  - number: 4.8:4
    text: |-
      1 Uitsluitend bij collectieve regeling kan in afwijking van [artikel 5:11, vierde lid, van de wet,][ref1] het
      tweede of het derde lid van dit artikel worden toegepast, indien de aard van de arbeid met zich brengt dat de
      werknemer bij uitzondering consignatie wordt opgelegd dan wel de werknemer na een oproep voldoende compenserende
      rust wordt geboden, maar de werkgever de arbeid redelijkerwijs niet op een zodanige wijze kan organiseren dat de
      werknemer ten hoogste de in [artikel 5:11, vierde lid][ref2], van de wet voorgeschreven gemiddelde arbeidstijd per
      week arbeid verricht. Elk beding waarbij op een andere wijze dan in de eerste volzin is bepaald, wordt afgeweken
      van [artikel 5:11, vierde lid][ref3], van de wet is nietig.

      2 De werkgever organiseert de arbeid zodanig dat de werknemer in elke periode van 13 achtereenvolgende weken ten
      hoogste gemiddeld 45 uren per week arbeid verricht, mits hem in elke periode van 4 achtereenvolgende weken ten
      hoogste 4 maal voor een tijdruimte van ten hoogste 24 achtereenvolgende uren consignatie wordt opgelegd.

      3 De werkgever organiseert de arbeid zodanig, dat de werknemer in elke periode van 13 achtereenvolgende weken ten
      hoogste gemiddeld 45 uren per week arbeid verricht, mits de werknemer:

      a. in de periode van 00.00 uur tot 05.00 uur arbeid verricht als gevolg van een oproep, hij voordat zijn
      eerstvolgende dienst aanvangt een onafgebroken rusttijd heeft van ten minste 8 uren waarin hij geen arbeid verricht
      die een gevolg is van een oproep, of

      b. in de periode van 05.00 uur tot 06.00 uur arbeid verricht als gevolg van een oproep, hij in de periode van 24
      aaneengesloten uren welke periode aanvangt op 06.00 uur een onafgebroken rust heeft van ten minste 8 uren waarin
      hij geen arbeid verricht die een gevolg is van een oproep.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel511
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel511
      [ref3]: https://wetten.overheid.nl/BWBR0007671#Artikel511
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel4.84
