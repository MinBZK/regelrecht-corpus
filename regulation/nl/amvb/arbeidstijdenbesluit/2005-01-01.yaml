  - number: 4.9:1
    text: |-
      1 In afwijking van de[ artikelen 5:8, derde lid, onderdeel ][ref1], en [5:9, derde lid, tweede volzin][ref2], ten
      aanzien van het gemiddeld aantal uren per week in elke periode van 13 achtereenvolgende weken, kan dit artikel
      worden toegepast.

      2 Indien zich een onvoorziene wijziging van omstandigheden voordoet of de aard van de arbeid het noodzakelijk
      maakt, dat de werknemer slechts incidenteel of voor korte tijd arbeid in nachtdienst verricht en dit door het op
      een andere wijze organiseren van de arbeid redelijkerwijs niet is te voorkomen, organiseert de werkgever die arbeid
      zodanig dat de werknemer in elke periode van 52 achtereenvolgende weken gemiddeld 40 uren per week arbeid verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel59
