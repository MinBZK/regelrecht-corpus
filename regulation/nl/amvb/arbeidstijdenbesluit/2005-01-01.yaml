  - number: 5.11:3
    text: |-
      1 Uitsluitend bij collectieve regeling kan, met inachtneming van het tweede lid, dit artikel worden toegepast. Elk
      beding waarbij op andere wijze dan in de eerste volzin is bepaald, dit artikel wordt toegepast, is nietig.

      2 Indien een werknemer, die werkzaamheden verricht in het kader van de vrijwillige politie, ten
      hoogste éénmaal in elke tijdruimte van 7 maal van 24 uren arbeid verricht in nachtdienst zijn de in
      de[ artikelen 5:8, derde lid, onderdeel a][ref1], en [5:9, derde lid, tweede volzin][ref2], van de wet gestelde
      regels niet van toepassing.


