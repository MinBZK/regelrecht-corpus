      b. na die aanwezigheidsdienst of reeks van aaneengesloten aanwezigheidsdiensten een onafgebroken rusttijd heeft
      die ten minste even lang is als de voorafgaande aanwezigheidsdienst onderscheidenlijk reeks van aaneengesloten
      aanwezigheidsdiensten.


