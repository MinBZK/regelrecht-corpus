        paragraaf: '5.2'
  - number: 3.1:1
    text: |-
      De werkgever zorgt er voor, dat op een bemande mijnbouwinstallatie de op die mijnbouwinstallatie betrekking
      hebbende deugdelijke registratie, bedoeld in artikel 4:3, eerste lid, van de wet aanwezig is. Een afschrift
      van deze registratie dient na ten hoogste 6 weken, gerekend vanaf de datum waarop de desbetreffende gegevens en
      bescheiden betrekking hebben, aanwezig te zijn in het hoofdkantoor van de werkgever in Nederland.
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel3.11
  - number: 3.1:2
    text: |-
      1 Indien [artikel 5.14:5][ref1] van toepassing is, zorgt de werkgever er voor dat de registratie van de arbeids- en
      rusttijden van de werknemer plaatsvindt volgens een door Onze Minister vastgesteld model.

      2 De werknemer, bedoeld in het eerste lid, draagt tijdens het verrichten van de arbeid de in dat lid bedoelde
      registratie bij zich.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op een persoon als bedoeld in [artikel 2.2:1][ref2].

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de inhoud, de invulling en het gebruik van
      de in het eerste lid bedoelde registratie.


      [ref1]: https://wetten.overheid.nl/BWBR0007687#Artikel5.145
      [ref2]: https://wetten.overheid.nl/BWBR0007687#Artikel2.21
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel3.12
