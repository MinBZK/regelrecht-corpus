  - number: 5.14:4
    text: |-
      [Artikel 5.14:2, derde en vierde lid][ref1], is niet van toepassing op arbeid verricht door werknemers in dienst
      van een niet in Nederland gevestigde werkgever op of vanaf een in zijn geheel verplaatsbare mijnbouwinstallatie.


      [ref1]: https://wetten.overheid.nl/BWBR0007687#Artikel5.142
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.144
