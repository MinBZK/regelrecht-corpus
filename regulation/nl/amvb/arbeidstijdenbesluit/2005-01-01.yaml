  - number: 5.20:3
    text: |-
      1 Met uitsluiting van hetgeen in [artikel 4.8:1][ref1] is bepaald, kan, ter aanvulling van [artikel 5:11][ref2]
      van de wet en in afwijking van [artikel 5:11, derde lid, onderdelen a en c][ref3], ten aanzien van de arbeidstijd
      per periode van 24 achtereenvolgende uren, van de wet en in afwijking van [artikel 4.4:1, tweede lid][ref4], ten
      aanzien van de verlenging van de arbeidstijd per dienst onderscheidenlijk van de inkorting van de onafgebroken
      rusttijd, dit artikel worden toegepast.

      2 Een aanwezigheidsdienst wordt, met inachtneming van het derde, vierde en vijfde lid, uitsluitend bij collectieve
      regeling bepaald. Elk beding waarin op andere wijze dan in de eerste volzin is bepaald, gebruik wordt gemaakt van
      het derde, vierde of vijfde lid, is nietig.

      3 De werkgever organiseert de arbeid zodanig, dat de werknemer:

      a. ten hoogste 26 maal in elke periode van 13 achtereenvolgende weken een aanwezigheidsdienst wordt opgelegd;

      b. vóór een aanwezigheidsdienst een onafgebroken rusttijd heeft van ten minste 11 uren;

      c. nà een aanwezigheidsdienst een onafgebroken rusttijd heeft van ten minste 24 uren;

      d. ten hoogste 16 uren in elke periode van 24 achtereenvolgende uren arbeid verricht.

      4 Indien de werkzaamheden van de werknemer aan het einde van zijn aanwezigheidsdienst worden overgenomen en direct
      daaropvolgend worden voortgezet door een andere werknemer en een goede voortgang van die werkzaamheden overdracht
      noodzakelijk maakt, organiseert de werkgever de arbeid zodanig, dat de arbeidstijd per aanwezigheidsdienst
      onderscheidenlijk de onafgebroken rusttijd met ten hoogste 1 uur wordt verlengd onderscheidenlijk ingekort.

      5 In afwijking van het derde en vierde lid organiseert de werkgever, indien een aanwezigheidsdienst van ten hoogste
      15 uren wordt opgelegd en de werknemer in deze periode ten hoogste 10 uren arbeid verricht, de arbeid zodanig, dat
      die werknemer:

      a. ten hoogste 5 maal in elke aaneengesloten tijdruimte van 7 maal 24 uren en 26 maal in elke periode van 13
      achtereenvolgende weken een aanwezigheidsdienst wordt opgelegd;

      b. vóór en nà een aanwezigheidsdienst een onafgebroken rusttijd heeft van ten minste 9 uren.


      [ref1]: https://wetten.overheid.nl/BWBR0007687#Artikel4.81
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel511
      [ref3]: https://wetten.overheid.nl/BWBR0007671#Artikel511
      [ref4]: https://wetten.overheid.nl/BWBR0007687#Artikel4.41
