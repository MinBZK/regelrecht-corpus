      De[ artikelen 4:2][ref1] en [4:3][ref2] en de[ hoofdstukken 5][ref3] en [6][ref4] van de wet en de daarop
      berustende bepalingen zijn niet van toepassing op arbeid verricht door de werknemer van 18 jaar of ouder, die
      werkzaam is als medisch specialist, als huisarts, als verpleeghuisarts of als sociaal geneeskundige en als zodanig
      staat geregistreerd in één van de registers van de Koninklijke Nederlandsche Maatschappij tot bevordering der
      Geneeskunst, dan wel als tandheelkundig specialist en als zodanig staat ingeschreven in het specialistenregister
      van de Nederlandse Maatschappij tot bevordering der Tandheelkunde.


