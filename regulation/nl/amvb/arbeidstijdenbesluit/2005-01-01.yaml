  - number: 4.5:5
    text: |-
      1 Van [artikel 5:8, derde lid, onderdeel ][ref1], van de wet kan ten aanzien van de arbeidstijd per nachtdienst
      en van [artikel 5:8, derde lid, onderdeel ][ref2], worden afgeweken, indien zich incidentele en onvoorziene
      omstandigheden voordoen waardoor het aantal werknemers in een ploeg onder het vereiste minimum komt, die een
      dergelijke afwijking noodzakelijk maken.

      2 Onverminderd [de artikelen 4.2:3][ref3] en [4.5:3][ref4] organiseert de werkgever de arbeid zodanig, dat de
      werknemer:

      a. gedurende ten hoogste 2 maal in elke periode van 4 achtereenvolgende weken en 8 maal in elke periode van 52
      achtereenvolgende weken, ten hoogste 11 uren per nachtdienst arbeid verricht;

      b. na het verrichten van die arbeid een onafgebroken rusttijd heeft van ten minste 12 uren.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0007687#Artikel4.23
      [ref4]: https://wetten.overheid.nl/BWBR0007687#Artikel4.53
