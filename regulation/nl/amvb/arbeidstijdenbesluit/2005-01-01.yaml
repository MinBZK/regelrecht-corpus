    text: Deze paragraaf is uitsluitend van toepassing op arbeid verricht door defensiepersoneel dat als zodanig werkzaam is.
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.61
  - number: 5.6:2
    text: |-
      1 Dit artikel is uitsluitend van toepassing op arbeid verricht door defensiepersoneel als bedoeld in
      [artikel 1:7, onderdeel ][ref1], van de wet.

      2 Voor de toepassing van [paragraaf 5.2][ref2] van de wet wordt de jeugdige werknemer, met inachtneming van
      het derde lid, gelijkgesteld aan de werknemer van 18 jaar of ouder. Voor de toepassing van dit besluit, met
      uitzondering van [hoofdstuk 2][ref3], is de eerste volzin van overeenkomstige toepassing.

      3 De werkgever organiseert de arbeid zodanig, dat de jeugdige werknemer in elke periode van 13 achtereenvolgende
      weken gemiddeld ten hoogste 40 uren per week arbeid verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Paragraaf5.2
