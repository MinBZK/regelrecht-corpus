  - number: 5.16:5
    text: |-
      1 In afwijking van de[ artikelen 5:7, derde lid][ref1], [5:8, derde lid, onderdeel ][ref2], en
      [5:9, derde lid][ref3], van de wet ten aanzien van de arbeidstijd kan het tweede lid, onderdeel *a*, worden
      toegepast. Uitsluitend bij collectieve regeling kan, met inachtneming van het tweede lid, onderdeel *b*, worden
      afgeweken van [artikel 5:5, tweede lid][ref4], van de wet. Elk beding waarbij op andere wijze dan in de vorige
      volzin is bepaald, wordt afgeweken van [artikel 5:5, tweede lid][ref5], van de wet is nietig.

      2 De werkgever organiseert de arbeid zodanig, dat de werknemer:

      a. ten hoogste 12 uren per dienst onderscheidenlijk per nachtdienst, in elke periode van 52 achtereenvolgende weken
      gemiddeld 40 uren per week arbeid verricht;

      b. een onafgebroken rusttijd heeft van ten minste 11 uren in een aaneengesloten tijdruimte van 24 uur, welke
      rusttijd ten hoogste 117 maal in elke periode van 52 achtereenvolgende weken mag worden ingekort tot ten minste
      8 uren.

      c. na een dienst onderscheidenlijk een nachtdienst waarop de onderdelen *a* en *b*, voorzover het de inkorting van
      de rusttijd in een aaneengesloten tijdruimte van 24 uur betreft, van toepassing zijn, een onafgebroken rusttijd
      heeft van ten minste 24 uren.

      3 De in het tweede lid, onderdeel *b*, bedoelde tijdruimte vangt aan op het eerste tijdstip van de dag, waarop de
      werknemer arbeid verricht.

      4 [Artikel 5.16:4][ref6] is niet van toepassing als dit artikel wordt toegepast.


