      1 In afwijking van de[ artikelen 5:7, derde lid][ref1], en [5:8, derde lid, onderdeel ][ref2], van de wet ten
      aanzien van de arbeidstijd per dienst onderscheidenlijk per nachtdienst en van artikel 5:8, derde lid, onderdeel ,
      van de wet kan dit artikel worden toegepast.

      2 De werkgever organiseert de arbeid zodanig, dat de werknemer in de tijdruimte gelegen tussen vrijdag 18.00 uur en
      de daaropvolgende maandag 08.00 uur:

      a. ten hoogste 11 uren per dienst onderscheidenlijk per nachtdienst arbeid verricht;

      b. na het verrichten van die arbeid een onafgebroken rusttijd heeft van ten minste 12 uren;

      c. ten minste 2 maal in elke periode van 4 achtereenvolgende weken geen arbeid verricht in de tijdruimte gelegen
      tussen zaterdag 00.00 uur en de daaropvolgende maandag 06.00 uur.


