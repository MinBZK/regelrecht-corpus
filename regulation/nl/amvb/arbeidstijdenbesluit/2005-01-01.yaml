        artikel: 5:8
  - number: 5.23:1
    text: |-
      Deze paragraaf is van toepassing op arbeid, verricht door een werknemer van 18 jaar of ouder, die bestaat uit:

      a. het ontwerpen, het opbouwen en het afbreken van tentoonstellingen of onderdelen daarvan, alsmede vergelijkbare
      werkzaamheden;

      b. het herstellen van schepen.
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.231
  - number: 5.23:2
    text: |-
      1 In afwijking van [artikel 5:3, tweede lid][ref1], van de wet kan dit artikel worden toegepast.

      2 De werknemer heeft een onafgebroken rusttijd van ten minste 36 uren in elke aaneengesloten tijdruimte van 7 maal
      24 uren.

      3 Van het tweede lid kan, met inachtneming van het vierde lid, slechts bij collectieve regeling worden afgeweken.
      Elk beding waarbij op andere wijze dan in de vorige volzin is bepaald, wordt afgeweken van het tweede lid, is
      nietig.

      4 De werkgever organiseert de arbeid zodanig, dat de werknemer een onafgebroken rusttijd heeft van ten minste
      36 uren in elke aaneengesloten tijdruimte van 7 maal 24 uren, welke rusttijd ten hoogste 8 maal in elke periode
      van 52 achtereenvolgende weken mag worden vervangen door een onafgebroken rusttijd van ten minste 60 uren in een
      aaneengesloten tijdruimte van 14 maal 24 uren.

      5 De in het tweede en vierde lid bedoelde tijdruimte vangt aan op het eerste tijdstip van de dag, waarop de
      werknemer arbeid verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel53
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.232
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: 5:3
  - number: 5.23:3
    text: |-
      1 In afwijking van [artikel 5:5, tweede lid][ref1], van de wet kan, uitsluitend indien [artikel 5.23:4][ref2] van
      toepassing is, dit artikel worden toegepast.

      2 De werkgever organiseert de arbeid zodanig, dat de werknemer een onafgebroken rusttijd heeft van ten minste 11
      uren in een aangesloten tijdruimte van 24 uren, welke rusttijd 4 maal in elke periode van 4 achtereenvolgende weken
      mag worden ingekort tot ten minste 8 uren.

      3 De in het tweede bedoelde tijdruimte vangt aan op het eerste tijdstip van de dag, waarop de werknemer arbeid
      verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0007687#Artikel5.234
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.233
