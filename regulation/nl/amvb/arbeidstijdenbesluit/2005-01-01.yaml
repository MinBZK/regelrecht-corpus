  - number: 5.1:4
    text: |-
      1 In afwijking van [artikel 5:8, derde lid][ref1], van de wet kan, met inachtneming van [artikel 5.1:3][ref2], dit
      artikel worden toegepast.

      2 De werkgever organiseert de arbeid zodanig, dat de werknemer die arbeid verricht in nachtdienst:

      a. in elke periode van 13 achtereenvolgende weken niet meer dan ten hoogste 28 maal arbeid in nachtdienst verricht;

      b. na het verrichten van arbeid in nachtdienst een onafgebroken rusttijd heeft van ten minste 12 uren;

      c. na een reeks van ten minste 3 en ten hoogste 7 maal achtereen arbeid te hebben verricht in nachtdienst, een
      onafgebroken rusttijd heeft van ten minste 60 uren.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel58
