      1 In afwijking van de[ artikelen 5:7, derde lid][ref1], [5:8, derde lid, onderdeel ][ref2], en
      [5:9, derde lid][ref3], van de wet ten aanzien van de arbeidstijd kan dit artikel worden toegepast.

      2 De werkgever organiseert de arbeid zodanig, dat de werknemer ten hoogste 12 uren per dienst onderscheidenlijk
      per nachtdienst, 72 uren per week, in elke periode van 13 achtereenvolgende weken gemiddeld 48 uren per week en in
      elke periode van 52 achtereenvolgende weken gemiddeld 40 uren per week arbeid verricht. In afwijking van de eerste
      volzin ten aanzien van de arbeidstijd per dienst onderscheidenlijk per nachtdienst, kan de werkgever de arbeid
      zodanig organseren, dat de werknemer ten hoogste 26 maal in elke periode van 52 achtereenvolgende weken ten hoogste
      14 uren per dienst onderscheidenlijk per nachtdienst arbeid verricht, mits die werknemer vóór en ná die dienst een
      onafgebroken rusttijd heeft van ten minste 24 uren.


