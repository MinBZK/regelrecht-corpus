  - number: 5.14:1
    text: |-
      Deze paragraaf is van toepassing op werknemers van 18 jaar of ouder die arbeid verrichten:

      a. op een mijnbouwwerk;

      b. vanaf of ten behoeve van een mijnbouwinstallatie.
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.141
  - number: 5.14:2
    text: |-
      1 Dit artikel is uitsluitend van toepassing op een werknemer die arbeid verricht op of vanaf een
      mijnbouwinstallatie.

      2 In afwijking en ter aanvulling van de[ artikelen 5:3, tweede lid][ref1], [5:5, tweede lid][ref2], [5:7][ref3] en
      [5:8, met uitzondering van het eerste lid, onderdeel b, en het derde lid, onderdeel b][ref4], van de wet kan dit
      artikel worden toegepast.

      3 De werknemer die in een bestendig en regelmatig arbeidstijdpatroon werkzaam is, verricht:

      a. gedurende ten hoogste 7 maal in elke periode van 14 achtereenvolgende dagen, ten hoogste 11 uren per dienst
      onderscheidenlijk per nachtdienst, en in elke periode van 4 achtereenvolgende weken gemiddeld 40 uren per week
      arbeid;

      b. heeft na het verrichten van arbeid in die dienst een onafgebroken rusttijd van ten minste 12 uren, welke
      rusttijd 2 maal in elke periode van 14 achtereenvolgende dagen mag worden ingekort tot ten minste 8 uren.

      4 Van het derde lid kan, met inachtneming van het vijfde lid, slechts bij collectieve regeling worden afgeweken.
      Elk beding waarbij op andere wijze dan in de vorige volzin is bepaald, wordt afgeweken van het derde lid, is
      nietig.

      5 De werkgever organiseert de arbeid zodanig, dat de werknemer die in een bestendig en regelmatig
      arbeidstijdpatroon werkzaam is:

      a. gedurende ten hoogste 14 maal in elke periode van 28 achtereenvolgende dagen, ten hoogste 11 uren per dienst
      onderscheidenlijk per nachtdienst, en in een periode van 13 achtereenvolgende weken gemiddeld 40 uren per week
      arbeid verricht;

      b. na het verrichten van arbeid in die dienst een onafgebroken rusttijd heeft van ten minste 12 uren, welke
      rusttijd 4 maal in elke periode van 28 achtereenvolgende dagen mag worden ingekort tot ten minste 8 uren.

      6 De arbeidstijd per dienst onderscheidenlijk per nachtdienst kan in afwijking van het derde lid, onderdeel
      *a*, en het vijfde lid, onderdeel *a*, 2 maal in elke periode van 28 achtereenvolgende dagen worden verlengd met
      ten hoogste één uur voor het verrichten van arbeid die bestaat uit oefeningen en trainingen die tot doel hebben
      de bekwaamheid en de bedrevenheid in het uitvoeren van maatregelen en procedures ten tijde van ongelukken en
      calamiteiten te verkrijgen of te behouden.

      7 Indien het zesde lid wordt toegepast kan in afwijking van het derde lid, onderdeel *b*, en het vijfde lid,
      onderdeel *b*, de onafgebroken rusttijd van ten minste 12 uren worden ingekort met ten hoogste één uur.

      8 Indien dit artikel wordt toegepast, organiseert de werkgever de arbeid van de werknemer zodanig, dat:

      a. tegenover iedere periode van 24 uren welke wordt doorgebracht op of vanaf een mijnbouwinstallatie in een periode
      van 13 achtereenvolgende weken een onafgebroken rusttijd staat van ten minste 24 uren elders;

      b. alle werknemers, die gelijksoortige werkzaamheden verrichten en in een bestendig en regelmatig
      arbeidstijdpatroon werkzaam zijn, die arbeid in een zelfde arbeidstijdpatroon verrichten.

      9 De rusttijd van ten minste 24 uren, bedoeld in het achtste lid, onderdeel a, mag uitsluitend worden onderbroken
      ten behoeve van niet op de reguliere arbeidsplaats plaatsvindende oefeningen en trainingen ten behoeve van het
      verkrijgen en behouden van de bekwaamheid en de bedrevenheid in het uitvoeren van maatregelen en procedures ten
      tijde van ongelukken en calamiteiten. In een periode van 13 achtereenvolgende weken mag de in de vorige volzin
      bedoelde onderbreking ten hoogste 3 dagen duren.

      10 Indien het negende lid, eerste volzin, van toepassing is, organiseert de werkgever de arbeid zodanig,
      dat de werknemer die in een bestendig en regelmatig arbeidstijdpatroon werkzaam is, in een periode van 52
      achtereenvolgende weken ten hoogste gemiddeld 40 uren per week arbeid verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0007671#Artikel57
      [ref4]: https://wetten.overheid.nl/BWBR0007671#Artikel58
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel5.142
