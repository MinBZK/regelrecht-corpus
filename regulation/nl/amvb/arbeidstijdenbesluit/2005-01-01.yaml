  - number: 8.3:1
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel8.31
  - number: 8.3:2
    text: 'Dit besluit wordt aangehaald als: Arbeidstijdenbesluit.'
    url: https://wetten.overheid.nl/BWBR0007687/2005-01-01#Artikel8.32
