      De[ artikelen 4:2][ref1] en [4:3][ref2] en de[ hoofdstukken 5][ref3] en [6][ref4] van de wet en de daarop
      berustende bepalingen zijn op ten hoogste 14 dagen in elke periode van 26 achtereenvolgende weken niet van
      toepassing op werknemers van 18 jaar of ouder die arbeid verrichten welke bestaat uit het leiden of begeleiden
      van leerlingen onderscheidenlijk personen tijdens schoolkampen of -reizen onderscheidenlijk vakantiedagen of
      -kampen, welke in het kader van de onderwijsinstelling, een inrichting ten behoeve van de jeugdhulpverlening
      of een inrichting voor verpleging of verzorging worden georganiseerd en welke arbeid buiten die instelling
      onderscheidenlijk inrichting wordt verricht, mits die werknemer na het verrichten van deze arbeid een onafgebroken
      rusttijd heeft van ten minste 36 uren, welke rusttijd dient in te gaan uiterlijk op de derde dag na terugkeer van
      de bedoelde schoolkampen of -reizen onderscheidenlijk vakantiedagen of -kampen.


