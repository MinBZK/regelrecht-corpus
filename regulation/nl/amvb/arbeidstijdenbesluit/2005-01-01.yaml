        bwb_id: BWBR0006029
        artikel: '1'
  - number: 5.26:2
    text: |-
      1 Deze paragraaf is uitsluitend van toepassing op arbeid verricht aan boord van schepen op binnenwateren, met
      uitzondering van de schepen, bedoeld in [artikel 4 van de Wet vaartijden en bemanningssterkte binnenvaart][ref1],
      door werknemers van 18 jaar of ouder die geen bemanningslid zijn als bedoeld in
      [artikel 1, onderdeel b, van die wet][ref2].

      2 [Paragraaf 5.1][ref3] is niet van toepassing als deze paragraaf wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0006029#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006029#Artikel1
