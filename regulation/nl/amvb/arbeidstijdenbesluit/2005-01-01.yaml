  - number: 5.10:1
    text: |-
      In afwijking van [paragraaf 5.2][ref1] van de wet is, met uitsluiting van hetgeen in [hoofdstuk 4][ref2] en de
      [paragrafen 5.1 tot en met 5.9][ref3] en [5.11 tot en met 5.27][ref4] is bepaald, deze paragraaf van toepassing op
      arbeid als bedoeld in [artikel 2.1:4][ref5].


