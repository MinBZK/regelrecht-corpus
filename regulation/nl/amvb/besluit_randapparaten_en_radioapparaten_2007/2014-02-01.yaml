---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_randapparaten_en_radioapparaten_2007
regulatory_layer: AMVB
publication_date: '2016-12-21'
valid_from: '2014-02-01'
bwb_id: BWBR0021037
url: https://wetten.overheid.nl/BWBR0021037/2014-02-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Minister van Economische Zaken van 5 september 2006, nr. WJZ 6062961;

    Gelet op richtlijn nr. 1999/5/EG van het Europees Parlement en de Raad van de Europese Unie van 9 maart 1999
    betreffende radioapparatuur en telecommunicatie-eindapparatuur en de wederzijdse erkenning van hun conformiteit
    (PbEG L 91), alsmede op het Besluit van het Gemengd Comité van de EER, nr. 48/2000, van 31 mei 2000, tot wijziging
    van bijlage II (Technische voorschriften, normen, keuring en certificatie) bij de EER-Overeenkomst (PbEG L 237),
    artikel 3, tweede lid en de sectorbijlage betreffende radioapparatuur en telecommunicatie-eindapparatuur van
    de Overeenkomst inzake wederzijdse erkenning tussen de Europese Gemeenschap en de Verenigde Staten van Amerika
    (PbEG 1999, L 31), artikel II, derde lid en de sectorbijlage betreffende radioapparatuur en telecommunicatie-
    eindapparatuur van de Overeenkomst inzake wederzijdse erkenning tussen de Europese Gemeenschap en Canada
    (PbEG 1998, L 280), artikel 2, tweede lid en de sectorbijlage betreffende radioapparatuur en telecommunicatie-
    eindapparatuur van de Overeenkomst inzake wederzijdse erkenning van overeenstemmingsbeoordeling, certificaten
    en markeringen tussen de Europese Gemeenschap en Australië (PbEG 1998, L 229), artikel 2, tweede lid en de
    sectorbijlage betreffende radioapparatuur en telecommunicatie-eindapparatuur van de Overeenkomst inzake de
    wederzijdse erkenning van overeenstemmingsbeoordeling tussen de Europese Gemeenschap en Nieuw-Zeeland (PbEG 1998,
    L 229), artikel 2 en de sectorbijlage betreffende eindapparatuur voor telecommunicatie en radioapparatuur van
    de Overeenkomst inzake wederzijdse erkenning van overeenstemmingsbeoordeling, tussen de Europese Gemeenschap en
    Japan (PbEG 2001, L 284), artikel 1 en bijlage 1, Hoofdstuk 7, betreffende eindapparatuur voor telecommunicatie
    van de Overeenkomst inzake wederzijdse erkenning van overeenstemmingsbeoordeling tussen de Europese Gemeenschap
    en Zwitserland (PbEG 2002, L 114) en op de artikelen 10.1, tweede lid, 10.2, tweede lid, 10.3, 10.4, 10.6, 10.7 en
    10.8, onderdeel b, van de Telecommunicatiewet;

    De Raad van State gehoord (advies van 12 oktober 2006, nr. W10.06.0378/II);

    Gezien het nader rapport van Minister van Economische Zaken van 20 december 2006, nr. WJZ 6108618;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel1
  - number: 1.a
    text: |-
      wet: [Telecommunicatiewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009950
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009950
  - number: 1.b
    text: |-
      [richtlijn nr. 1999/5/EG](31999L0005): [richtlijn nr. 1999/5/EG](31999L0005) van het Europees Parlement en de
      Raad van de Europese Unie van 9 maart 1999 betreffende radioapparatuur en telecommunicatie-eindapparatuur en de
      wederzijdse erkenning van hun conformiteit (PbEG L 91);
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel1
  - number: 1.c
    text: |-
      richtlijn nr. 2006/95/EG: richtlijn nr. 2006/95/EG van het Europees Parlement en de Raad van de Europese Unie
      van 12 december 2006 betreffende de onderlinge aanpassing van de wettelijke voorschriften der lidstaten inzake
      elektrisch materiaal bestemd voor gebruik binnen bepaalde spanningsgrenzen (PbEU L 374);
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel1
  - number: 1.d
    text: |-
      [richtlijn nr. 2004/108/EG](32004L0108): [richtlijn nr. 2004/108/EG](32004L0108) van het Europees Parlement en
      de Raad van de Europese Unie van 15 december 2004 betreffende de onderlinge aanpassing van de wetgevingen van de
      lidstaten inzake elektromagnetische compatibiliteit en tot intrekking van [Richtlijn 89/336/EEG](31989L0336) (PbEG
      L 390);
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel1
  - number: 1.e
    text: |-
      radioapparaten: radiozendapparaten en apparaten die naar hun aard bestemd zijn voor het ontvangen van
      radiocommunicatiesignalen;
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel1
  - number: 1.f
    text: |-
      geharmoniseerde norm: technische specificatie die door een erkende Europese normalisatie-instelling, in opdracht
      van de Europese Commissie en in overeenstemming met de procedures van de notificatierichtlijn is goedgekeurd;
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel1
  - number: 1.g
    text: 'lidstaat: staat die lid is van de Europese Unie;'
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel1
  - number: 1.h
    text: 'derde land: land dat partij is bij een bij ministeriële regeling genoemde overeenkomst;'
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel1
  - number: 1.i
    text: |-
      aangemelde instantie: instantie die voor het uitvoeren van conformiteitsbeoordelingsprocedures als bedoeld in
      artikel 10 van richtlijn nr. 1999/5/EG is aangewezen
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel1
  - number: 1.i.1°
    text: |-
      door een lidstaat die de instantie op grond van artikel 11 van [richtlijn nr. 1999/5/EG](31999L0005) heeft
      aangemeld,
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel1
  - number: 1.i.2°
    text: |-
      door een staat, niet zijnde een lidstaat, die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte die de instantie op grond van artikel 11 van [richtlijn nr. 1999/5/EG](31999L0005) heeft aangemeld, of
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel1
  - number: 1.i.3°
    text: |-
      in het kader van een bij ministeriële regeling genoemde overeenkomst, door de aanwijzende autoriteit in een derde
      land.
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel1
  - number: 1.j
    text: |-
      verklaring van conformiteit: document waarin degene die randapparaten of radioapparaten in de handel brengt,
      verklaart dat die apparaten voldoen aan de voorschriften van [richtlijn nr. 1999/5](31999L0005);
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel1
  - number: 1.k
    text: |-
      overeenstemmingsbeoordelingsorgaan: instantie die voor het beoordelen van overeenstemming van randapparaten
      en radioapparaten met de normen van een derde land en volgens de regels en procedures van het derde land is
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel1
  - number: '2'
    text: 'Het bij of krachtens dit besluit bepaalde is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel2
  - number: 2.a
    text: de randapparaten of radioapparaten, genoemd in bijlage I van [richtlijn nr. 1999/5/EG](31999L0005), en
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel2
  - number: 2.b
    text: |-
      randapparaten of radioapparaten die uitsluitend worden gebruikt bij activiteiten die betrekking hebben op de
      openbare veiligheid, defensie, de staatsveiligheid en bij de activiteiten van de staat op gebieden die onder het
      strafrecht vallen.
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel2
  - number: '3'
    text: |-
      De verplichtingen die bij of krachtens dit besluit worden opgelegd aan degene die randapparaten of radioapparaten
      in de handel brengt en aan degene die het voornemen heeft om radioapparaten, die in frequentiebanden worden
      gebruikt waarvan het gebruik niet in de gehele Europese Unie is geharmoniseerd, in Nederland in de handel te
      brengen, zijn eveneens van toepassing op de in Nederland gevestigde vertegenwoordigers van deze personen.
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel3
  - number: '4.1'
    text: |-
      Degene die het voornemen heeft om radioapparaten, die in frequentiebanden worden gebruikt waarvan het gebruik niet
      in de gehele Europese Unie is geharmoniseerd, in Nederland in de handel te brengen, stelt Onze Minister ten minste
      vier weken voordat de apparaten in Nederland in de handel worden gebracht in kennis van dit voornemen.
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel4
  - number: '4.2'
    text: |-
      Bij de kennisgeving, bedoeld in het eerste lid, wordt aan Onze Minister informatie verschaft inzake de
      radiokenmerken van de radioapparaten en wordt, indien bij de conformiteitsbeoordelingsprocedures, bedoeld in
      [artikel 7][ref1], een aangemelde instantie is betrokken, het identificatienummer van deze aangemelde instantie
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0021037#Artikel7
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0021037
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '4.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld inzake de wijze waarop de in het eerste lid bedoelde
      kennisgeving geschiedt en de informatie die hierbij wordt verschaft.
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel4
  - number: '5.1'
    text: |-
      Randapparaten en radioapparaten voldoen aan de voorschriften, bedoeld in artikel 3, eerste lid, van [richtlijn nr.
      1999/5/EG](31999L0005), te weten:
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel5
  - number: 5.1.a
    text: |-
      de bescherming van de gezondheid of de veiligheid van de gebruiker of van anderen, met inbegrip van de
      doelstellingen met betrekking tot de veiligheidsvoorschriften van richtlijn nr. 2006/95/EG, echter zonder
      toepassing van de spanningsgrens, en
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel5
  - number: 5.1.b
    text: |-
      de elektromagnetische compatibiliteit van [richtlijn nr. 2004/108/EG](32004L0108), voor zover deze relevant zijn
      voor randapparaten of radioapparaten.
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel5
  - number: '5.2'
    text: |-
      Onverminderd het eerste lid, voldoen radioapparaten aan artikel 3, tweede lid, van [richtlijn nr. 1999/5/EG]
      (31999L0005).
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel5
  - number: '5.3'
    text: |-
      Indien op grond van artikel 3, derde lid, van [richtlijn nr. 1999/5/EG](31999L0005) voorschriften worden
      gesteld, worden ter uitvoering daarvan bij ministeriële regeling regels gesteld inzake die voorschriften waaraan
      randapparaten of radioapparaten dan wel categorieën of soorten daarvan, onverminderd het eerste en tweede lid,
      voldoen.
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel5
  - number: '6.1'
    text: |-
      Randapparaten en radioapparaten worden vermoed aan een of meer voorschriften, bedoeld in [artikel 5][ref1] te
      voldoen, indien blijkens een van de in [artikel 7][ref2] bedoelde conformiteitsbeoordelingsprocedures is voldaan
      aan de met betrekking tot [richtlijn nr. 1999/5/EG](31999L0005) vastgestelde geharmoniseerde normen of delen
      daarvan, die betrekking hebben op de desbetreffende voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0021037#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0021037#Artikel7
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0021037
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0021037
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '6.2'
    text: |-
      Naast de mogelijkheid, bedoeld in het eerste lid, worden randapparaten en radioapparaten eveneens vermoed aan de
      voorschriften, bedoeld in [artikel 5, eerste lid, onderdeel a, onderscheidenlijk onderdeel b][ref1], te voldoen,
      indien blijkens een van de in [artikel 7][ref2] bedoelde conformiteitsbeoordelingsprocedures is voldaan aan de
      met betrekking tot richtlijn nr. 2006/95/EG onderscheidenlijk met betrekking tot [richtlijn nr. 2004/108/EG]
      (32004L0108) vastgestelde geharmoniseerde normen of delen daarvan, die betrekking hebben op de desbetreffende
      voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0021037#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0021037#Artikel7
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0021037
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0021037
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '6.3'
    text: |-
      Van een vermoeden van overeenstemming als bedoeld in het eerste of tweede lid is slechts sprake indien de
      referentienummers van de bij de conformiteitsbeoordelingsprocedure gehanteerde geharmoniseerde normen gepubliceerd
      zijn in het Publicatieblad van de Europese Unie en deze normen of voorschriften van kracht zijn.
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel6
  - number: '7.1'
    text: |-
      Degene die randapparaten die geen gebruik maken van de frequentieruimte, apparaten die naar hun aard bestemd zijn
      voor het ontvangen van radiocommunicatiesignalen of ontvangende delen van radiozendapparaten in de handel brengt,
      onderwerpt deze apparaten naar keuze aan de in bijlage II, IV of V van [richtlijn nr. 1999/5/EG](31999L0005)
      beschreven conformiteitsbeoordelingsprocedures om vast te stellen of deze apparaten aan de voorschriften, bedoeld
      in [artikel 5][ref1], voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0021037#Artikel5
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0021037
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '7.2'
    text: |-
      Degene die andere dan de in het eerste lid bedoelde radioapparaten in de handel brengt en de van toepassing zijnde
      geharmoniseerde normen, bedoeld in [artikel 6][ref1], heeft toegepast, onderwerpt deze apparaten naar keuze aan de
      in bijlage III, IV of V van [richtlijn nr. 1999/5/EG](31999L0005) beschreven conformiteitsbeoordelingsprocedures om
      vast te stellen of deze apparaten aan de voorschriften, bedoeld in [artikel 5][ref2], voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0021037#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0021037#Artikel5
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0021037
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0021037
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '7.3'
    text: |-
      Degene die andere dan de in het eerste lid bedoelde radioapparaten in de handel brengt en de van toepassing zijnde
      geharmoniseerde normen, bedoeld in [artikel 6][ref1], niet of slechts gedeeltelijk heeft toegepast, onderwerpt
      deze apparaten naar keuze aan de in de bijlage IV of V van [richtlijn nr. 1999/5/EG](31999L0005) beschreven
      conformiteitsbeoordelingsprocedures om vast te stellen of deze apparaten aan de voorschriften, bedoeld in
      [artikel 5][ref2], voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0021037#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0021037#Artikel5
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0021037
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0021037
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '7.4'
    text: |-
      In afwijking van het eerste tot en met het derde lid, kan degene die randapparaten of radioapparaten in de
      handel brengt de conformiteitsbeoordelingsprocedures, bedoeld in bijlage III, paragraaf B, en bijlage IV van
      richtlijn nr. 2006/95/EG toepassen, om vast te stellen of deze apparaten aan de voorschriften, bedoeld in
      [artikel 5, eerste lid, onderdeel a][ref1], voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0021037#Artikel5
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0021037
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '7.5'
    text: |-
      De stukken die betrekking hebben op de in het eerste tot en met het vierde lid bedoelde
      conformiteitsbeoordelingsprocedures zijn gesteld in een officiële taal van de lidstaat waar de
      conformiteitsbeoordelingsprocedure plaatsvindt of in een taal die door de bij de conformiteitsbeoordelingsprocedure
      betrokken aangemelde instantie wordt aanvaard.
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel7
  - number: '8'
    text: |-
      Degene die randapparaten of radioapparaten in de handel brengt, voldoet aan de uit de bijlagen II
      tot en met V van [richtlijn nr. 1999/5/EG](31999L0005) voortvloeiende verplichtingen behorende bij de
      conformiteitsbeoordelingsprocedures die op grond van [artikel 7][ref1] op die apparaten van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0021037#Artikel7
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0021037
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '9.1'
    text: |-
      Bij de in [artikel 7][ref1] bedoelde conformiteitsbeoordelingsprocedures kan degene die randapparaten of
      radioapparaten in de handel brengt een aangemelde instantie inschakelen, mits deze instantie voor de desbetreffende
      procedure of het desbetreffende onderdeel daarvan bij de Europese Commissie is aangemeld op grond van artikel 11,
      eerste lid, van [richtlijn nr. 1999/5/EG](31999L0005).


      [ref1]: https://wetten.overheid.nl/BWBR0021037#Artikel7
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0021037
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '9.2'
    text: |-
      In afwijking van het eerste lid kan degene die randapparaten of radioapparaten in de Europese Unie in de handel
      brengt een aangemelde instantie in een derde land inschakelen, mits deze aangemelde instantie is vermeld in de
      sectorbijlage betreffende radioapparatuur en telecommunicatie-eindapparatuur behorend bij een bij ministeriële
      regeling genoemde overeenkomst, de aanwijzing van de instantie op grond van deze overeenkomst niet is geschorst en
      de Europese Gemeenschap haar uit deze overeenkomst voortvloeiende verplichtingen niet geheel of gedeeltelijk heeft
      opgeschort.
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel9
  - number: '10.1'
    text: |-
      Ter bekrachtiging dat randapparaten of radioapparaten aan de voorschriften, bedoeld in [artikel 5][ref1] voldoen,
      stelt degene die deze apparaten in de handel brengt een verklaring van conformiteit op en brengt hij op elk
      apparaat, op de eventuele verpakking hiervan en op de documenten met betrekking tot de apparaten, een door Onze
      Minister aan te wijzen markering aan.


      [ref1]: https://wetten.overheid.nl/BWBR0021037#Artikel5
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0021037
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '10.2'
    text: |-
      Onverminderd het eerste lid wordt op radioapparaten, in bij ministeriële regeling te bepalen gevallen, een door
      Onze Minister aan te wijzen markering aangebracht ter aanduiding van de categorie waartoe deze radioapparaten
      behoren.
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel10
  - number: '10.3'
    text: |-
      Onverminderd het eerste en tweede lid wordt op radioapparaten die gebruikt worden in frequentiebanden waarvan
      het gebruik niet in de gehele Europese Unie is geharmoniseerd, een door Onze Minister aan te wijzen markering
      aangebracht.
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel10
  - number: '10.4'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld inzake de afmeting en de grafische vorm van de in het
      eerste, tweede en derde lid bedoelde markeringen, de aanvullende aanduidingen bij deze markeringen, de wijze waarop
      deze markeringen wordt aangebracht en omtrent de zichtbaarheid, leesbaarheid en herkenbaarheid hiervan.
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel10
  - number: '11.1'
    text: |-
      Onze Minister kan een instantie aanwijzen voor de uitvoering van de taken die met de in [artikel 7][ref1] bedoelde
      conformiteitsbeoordelingsprocedures samenhangen, indien uit de aanvraag tot aanwijzing volgt, dat de instantie
      blijkens accreditatie aantoonbaar voldoet aan de norm NEN-EN 45011:1998 of de norm NEN-EN-ISO/IEC 17065:2012.


      [ref1]: https://wetten.overheid.nl/BWBR0021037#Artikel7
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0021037
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '11.2'
    text: |-
      Onze Minister kan de aanwijzing beperken tot daarbij te omschrijven categorieën van randapparaten of radioapparaten
      of conformiteitsbeoordelingsprocedures, dan wel onderdelen hiervan.
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel11
  - number: '12'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop een aanvraag tot aanwijzing als bedoeld
      in [artikel 11][ref1] moet worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0021037#Artikel11
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0021037
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 12a.1
    text: Onze Minister kan een instantie aanwijzen als overeenstemmingsbeoordelingsorgaan.
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel12a
  - number: 12a.2
    text: |-
      Bij de aanwijzing kan Onze Minister nadere voorwaarden stellen, waaronder in ieder geval het toepassingsbereik van
      de aanwijzing en de wijze waarop een overeenstemmingsbeoordeling uitgevoerd wordt.
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel12a
  - number: 12a.3
    text: |-
      Onze Minister kan een aanwijzing intrekken indien het overeenstemmingsbeoordelingsorgaan niet voldoende technisch
      bekwaam is of niet voldoet aan de voorwaarden gesteld bij de aanwijzing.
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel12a
  - number: 12a.4
    text: |-
      Onze Minister kan een aanwijzing schorsen indien Onze Minister het vermoeden heeft dat het derde lid van toepassing
      is.
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel12a
  - number: 12a.5
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de procedure van aanwijzing en de wijze waarop een
      aanvraag tot aanwijzing wordt ingediend.
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel12a
  - number: '13.1'
    text: |-
      Degene die randapparaten of radioapparaten in de handel brengt, verstrekt aan de gebruiker een afschrift van de
      verklaring van conformiteit en informatie over het gebruik waarvoor deze apparaten bestemd zijn, met dien verstande
      dat:
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel13
  - number: 13.1.a
    text: |-
      indien het radioapparaten betreft, de verpakking of de gebruiksaanwijzing informatie bevat waaruit blijkt voor
      het gebruik in welke lidstaat of in welk geografisch grondgebied binnen een lidstaat deze radioapparaten bedoeld
      zijn en de gebruiker door de op het apparaat aangebrachte markering als bedoeld in [artikel 10, derde lid][ref1],
      geattendeerd wordt op voorschriften inzake het gebruik van deze radioapparaten in bepaalde lidstaten;


      [ref1]: https://wetten.overheid.nl/BWBR0021037#Artikel10
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0021037
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 13.1.b
    text: |-
      indien het randapparaten betreft, op alle apparaten duidelijk zichtbaar informatie is aangebracht waaruit blijkt
      voor welke netwerkaansluitpunten van openbare telecommunicatienetwerken deze randapparaten zijn bestemd.
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel13
  - number: '13.2'
    text: |-
      Degene die randapparaten of radioapparaten in de handel brengt, draagt er zorg voor dat op de apparaten zijn naam
      of de naam van de fabrikant is aangebracht alsmede een type-, partij- of serienummer, waardoor het mogelijk is hem
      of de fabrikant te identificeren.
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel13
  - number: '13.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld inzake de informatie die in de documenten met betrekking tot
      de randapparaten of radioapparaten moet zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel13
  - number: '14.1'
    text: |-
      Een aanbieder van een openbaar telecommunicatienetwerk verschaft de Autoriteit Consument en Markt informatie over
      de technische specificaties van de netwerkaansluitpunten en maakt deze informatie op genoegzame wijze bekend,
      voordat via deze netwerkaansluitpunten diensten aan het publiek beschikbaar worden gesteld.
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel14
  - number: '14.2'
    text: |-
      De in het eerste lid bedoelde technische specificaties moeten nauwkeurig genoeg zijn om randapparaten te kunnen
      ontwerpen waarmee alle via het netwerkaansluitpunt verstrekte diensten kunnen worden gebruikt en moeten in elk
      geval alle informatie bevatten die de fabrikanten in staat stellen naar keuze de relevante tests uit te voeren om
      vast te stellen of de randapparaten voldoen aan de voorschriften, bedoeld in [artikel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021037#Artikel5
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0021037
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '14.3'
    text: |-
      Een aanbieder van een openbaar telecommunicatienetwerk draagt er zorg voor dat wijzigingen in de informatie,
      bedoeld in het eerste lid, ten minste twee maanden voor de datum waarop die wijzigingen ingaan, bij de Autoriteit
      Consument en Markt bekend zijn en op genoegzame wijze bekend zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel14
  - number: '14.4'
    text: |-
      Een aanbieder van een openbaar telecommunicatienetwerk doet van de wijze van bekendmaking, bedoeld in het eerste en
      derde lid, mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel14
  - number: '15'
    text: |-
      Een aanbieder van een openbaar telecommunicatienetwerk zorgt er voor dat randapparaten die voldoen aan de
      voorschriften, bedoeld in [artikel 5][ref1], op daartoe geschikte netwerkaansluitpunten kunnen worden aangesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0021037#Artikel5
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0021037
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '16'
    text: |-
      In afwijking van [artikel 15][ref1] is een aanbieder van een openbaar telecommunicatienetwerk gerechtigd om
      randapparaten die voldoen aan de voorschriften, bedoeld in [artikel 5][ref2], niet aan te sluiten of af te sluiten
      dan wel buiten gebruik te stellen indien deze apparaten ernstige schade toebrengen aan een telecommunicatienetwerk,
      schadelijke interferentie veroorzaken of het telecommunicatienetwerk of de werking daarvan schaden, mits hij
      hiertoe voorafgaande toestemming heeft van de Autoriteit Consument en Markt.


      [ref1]: https://wetten.overheid.nl/BWBR0021037#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0021037#Artikel5
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0021037
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.6'
      - id: ref2
        bwb_id: BWBR0021037
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '17.1'
    text: |-
      In afwijking van de [artikelen 15][ref1] en [16][ref2] is een aanbieder van een openbaar telecommunicatienetwerk
      gerechtigd randapparaten af te sluiten, indien dit in verband met de bescherming van het telecommunicatienetwerk
      onmiddellijk dient te geschieden en biedt de gebruiker van het telecommunicatienetwerk direct, en zonder daarvoor
      kosten in rekening te brengen, een alternatieve voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0021037#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0021037#Artikel16
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0021037
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.6'
      - id: ref2
        bwb_id: BWBR0021037
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2.6'
  - number: '17.2'
    text: |-
      De aanbieder, bedoeld in het eerste lid, doet onmiddellijk mededeling aan de Autoriteit Consument en Markt van het
      feit dat de randapparaten zijn afgesloten.
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel17
  - number: '18.1'
    text: |-
      Het verbod om uitrusting te verhandelen, bedoeld in [artikel 10.1, eerste lid, van de wet][ref1], geldt
      niet voor randapparaten of radioapparaten indien wordt voldaan aan de verplichtingen, bedoeld in de
      [artikelen 10, eerste tot en met derde lid][ref2], en [13, eerste en tweede lid][ref3], betreffende het aanbrengen
      van markeringen, het verstrekken van een afschrift van de verklaring van conformiteit en het verschaffen van
      informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0021037#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0021037#Artikel13
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0021037
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0021037
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '18.2'
    text: |-
      Indien wordt geconstateerd, dat een in de handel gebracht randapparaat of radioapparaat niet voldoet aan de
      in [artikel 5][ref1] bedoelde voorschriften ondanks het feit dat wordt voldaan aan de verplichtingen in de
      [artikelen 10, eerste tot en met derde lid][ref2], en [13, eerste en tweede lid][ref3], betreffende het aanbrengen
      van markeringen, het verstrekken van een afschrift van de verklaring van conformiteit en het verschaffen van
      informatie, wordt hiervan schriftelijk mededeling gedaan aan de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0021037#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0021037#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0021037#Artikel13
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0021037
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0021037
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0021037
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '18.3'
    text: Onze Minister maakt de constatering, bedoeld in het tweede lid, zo spoedig mogelijk bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel18
  - number: '18.4'
    text: |-
      Met ingang van de dag na de datum van bekendmaking is het verboden de randapparaten of radioapparaten van dit type
      te verhandelen.
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel18
  - number: '19'
    text: |-
      Onze Minister kan het in de handel brengen of verhandelen van radiozendapparaten of categorieën van
      radiozendapparaten beëindigen of beperken, indien de vrees is gewettigd dat door de betrokken radiozendapparaten
      ontoelaatbare belemmeringen worden veroorzaakt in het etherverkeer, in andere radiozendapparaten of in
      ontvangapparaten.
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel19
  - number: '20'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld inzake de behandeling van klachten over belemmeringen welke
      bij het gebruik van radiozendapparaten worden ondervonden.
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel20
  - number: '21'
    text: |-
      Het is verboden handelsreclame te maken voor randapparaten of radioapparaten die niet voldoen aan de eisen van dit
      besluit en waarvan het in de handel brengen of het verhandelen op grond van [artikel 10.1, eerste lid][ref1] en
      [artikel 10.5, tweede lid, van de wet][ref2] is verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel10
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '10'
  - number: '22'
    text: |-
      Het is verboden randapparaten of radioapparaten die niet voldoen aan de eisen van dit besluit tentoon te stellen of
      te demonstreren, tenzij
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel22
  - number: 22.a
    text: |-
      het tentoonstellen of demonstreren plaatsvindt tijdens handelsbeurzen, tentoonstellingen of soortgelijke
      evenementen, en
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel22
  - number: 22.b
    text: |-
      deze uitrusting is voorzien van een zichtbaar teken dat aangeeft dat de uitrusting niet in de handel mag worden
      gebracht of mag worden verhandeld zolang deze uitrusting niet voldoet aan de eisen van dit besluit.
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel22
  - number: '23.1'
    text: |-
      Voor de toepassing van [artikel 10.8 tot en met 10.11 van de wet][ref1] worden met radiozendapparaten gelijkgesteld
      radiofrequentvermogensversterkers die geschikt zijn voor gebruik tezamen met radiozendapparaten alsmede andere
      elektrische of elektronische apparaten die geschikt zijn om het radiofrequent signaal van radiozendapparaten te
      wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel10
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '10'
  - number: '23.2'
    text: |-
      Bij ministeriële regeling aangewezen elektrische of elektronische apparaten worden voor de toepassing van
      [artikel 10.8 tot en met 10.11 van de wet][ref1] gelijkgesteld met radiozendapparaten.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel10
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '10'
  - number: 23a
    text: |-
      Bij ministeriële regeling worden regels gesteld om verstoringen te voorkomen in frequentiebanden die ingevolge het
      frequentieplan als bedoeld in [artikel 3.1 van de wet][ref1] zijn bestemd voor omroep.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: '25.1'
    text: |-
      Na de inwerkingtreding van dit besluit berust de [Regeling storingsklachten][ref1] op
      [artikel 22 van het Besluit elektromagnetische compatibiliteit 2007][ref2] en op [artikel 20][ref3] van dit
      besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0007511
      [ref2]: https://wetten.overheid.nl/BWBR0021041#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0021037#Artikel20
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0007511
      - id: ref2
        bwb_id: BWBR0021041
        artikel: '22'
      - id: ref3
        bwb_id: BWBR0021037
        artikel: '20'
        hoofdstuk: '5'
  - number: '25.2'
    text: |-
      Na de inwerkingtreding van dit besluit berust de [Regeling randapparaten en radioapparaten][ref1] op
      [artikel 1, onderdeel h][ref2], [artikel 4, derde lid][ref3], [artikel 10][ref4], [artikel 12][ref5],
      [artikel 13, derde lid][ref6] en [artikel 20][ref7] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0011347
      [ref2]: https://wetten.overheid.nl/BWBR0021037#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0021037#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0021037#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0021037#Artikel12
      [ref6]: https://wetten.overheid.nl/BWBR0021037#Artikel13
      [ref7]: https://wetten.overheid.nl/BWBR0021037#Artikel20
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011347
      - id: ref2
        bwb_id: BWBR0021037
        artikel: '1'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0021037
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref4
        bwb_id: BWBR0021037
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref5
        bwb_id: BWBR0021037
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref6
        bwb_id: BWBR0021037
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref7
        bwb_id: BWBR0021037
        artikel: '20'
        hoofdstuk: '5'
  - number: '26'
    text: |-
      Een wijziging van [richtlijn nr. 1999/5/EG](31999L0005), van de notificatierichtlijn, van [richtlijn nr. 2004/108/
      EG](32004L0108), of van richtlijn nr. 2006/95/EG gaat voor de toepassing van het onderhavige besluit gelden met
      ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel
      besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel26
  - number: '27.1'
    text: |-
      Het bij of krachtens dit besluit bepaalde is niet van toepassing op apparaten die vóór 8 april 2001
      overeenkomstig het bij of krachtens het Besluit randapparatuur en apparatuur voor satellietgrondstations bepaalde,
      onderscheidenlijk het bij of krachtens het Besluit radio-elektrische inrichtingen bepaalde, in de handel zijn
      gebracht.
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel27
  - number: '27.2'
    text: |-
      Apparaten, bedoeld in het eerste lid, die niet of niet meer voldoen aan de voorschriften waaraan deze apparaten
      op grond van het bij of krachtens het Besluit radio-elektrische inrichtingen of het Besluit randapparatuur en
      apparatuur voor satellietgrondstations bepaalde moesten voldoen op het tijdstip dat zij in de handel zijn gebracht,
      kunnen uit de handel worden genomen.
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel27
  - number: '28.1'
    text: |-
      Het [Besluit randapparaten en radioapparaten][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0011261
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0011261
  - number: '28.2'
    text: |-
      Het __REF000___________________________________________________________________________________________________________
      ______________________________________________________________________________________________________ wordt
      ingetrokken (Stcrt. 2000, 229).


      [ref1]: https://wetten.overheid.nl/BWBR0011799
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0011799
  - number: '29'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0021037/2014-02-01#Artikel29
  - number: '30'
