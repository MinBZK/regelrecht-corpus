        bwb_id: BWBR0004613
        artikel: '12'
  - number: '15'
    text: |-
      1 Het UWV kan op verzoek bepalen dat, voor de duur van ten hoogste twee jaar, niet als werknemer in de zin van de
      werknemersverzekeringen wordt beschouwd degene die

      a. niet duurzaam in Nederland woont;

      b. in dienst is van een in Nederland gevestigde buitenlandse instelling zonder winstoogmerk, en

      c. verzekerd is krachtens het stelsel van sociale verzekering van een andere mogendheid.

      Het in de eerste volzin bedoelde verzoek kan slechts worden gedaan door de in die volzin bedoelde instelling.

      2 De in het eerste lid genoemde periode kan op verzoek telkens met ten hoogste twee jaar worden verlengd.
    url: https://wetten.overheid.nl/BWBR0004613/2006-09-30#Artikel15
  - number: 16a
    text: |-
      Als werknemer in de zin van de werknemersverzekeringen wordt niet beschouwd de vreemdeling die rechtmatig in
      Nederland verblijf houdt in de zin van [artikel 8, onder a tot en met e, of l, van de Vreemdelingenwet 2000][ref1],
      indien hij arbeid in dienstbetrekking verricht zonder dat aan de [Wet arbeid vreemdelingen][ref2] is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0004613/2006-09-30#Artikel16a
