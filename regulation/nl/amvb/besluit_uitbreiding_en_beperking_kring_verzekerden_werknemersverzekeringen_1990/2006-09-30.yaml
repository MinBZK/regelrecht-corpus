        bwb_id: BWBR0019057
      - id: ref3
        bwb_id: BWBR0001888
      - id: ref4
        bwb_id: BWBR0004045
  - number: '2'
    text: |-
      Als werknemer in de zin van de werknemersverzekeringen wordt beschouwd de Nederlander die in dienst is van een in
      Nederland wonende of gevestigde werkgever, deel uitmaakt van de bemanning van een zeevaartuig en woont aan boord
      van dat vaartuig.
    url: https://wetten.overheid.nl/BWBR0004613/2006-09-30#Artikel2
  - number: '3'
    text: |-
      Als werknemer in de zin van de werknemersverzekeringen wordt beschouwd degene die niet in Nederland woont
      en behoort tot het rijdend, vliegend of op de binnenwateren varend personeel van een in Nederland wonende of
      gevestigde werkgever die internationaal vervoer verricht, tenzij hij in hoofdzaak in het woonland arbeid verricht
      dan wel werkt bij een filiaal of een vaste vertegenwoordiging van die werkgever buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0004613/2006-09-30#Artikel3
  - number: '4'
    text: |-
      Als werknemer in de zin van de werknemersverzekeringen wordt beschouwd de Nederlander en de vreemdeling, bedoeld in
      [artikel 8, onder a tot en met e, of l, van de Vreemdelingenwet 2000][ref1] die in Nederland woont, behoort tot het
      rijdend, vliegend of op de binnenwateren varend personeel van een buiten Nederland wonende of gevestigde werkgever
      en in hoofdzaak in Nederland arbeid verricht dan wel werkt bij een filiaal of een vaste vertegenwoordiging van die
      werkgever in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0004613/2006-09-30#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 4a
    text: |-
      1 Als werknemer in de zin van de werknemersverzekeringen wordt beschouwd de Nederlander die op grond van
      __REF000___________________________________________________________________________________________________________
      _________________________ werkzaam is bij een vertegenwoordiging van het Koninkrijk der Nederlanden in het
      buitenland als bedoeld in [artikel 7, tweede lid, van het Reglement Dienst Buitenlandse Zaken][ref2], tenzij hij:

      a. buiten Nederland arbeid verricht anders dan de werkzaamheden, bedoeld in de aanhef; of

      b. een uitkering ontvangt op grond van een buitenlandse wettelijke regeling inzake sociale zekerheid.

      2 Als werknemer in de zin van de werknemersverzekeringen wordt beschouwd de particuliere bediende die in dienst is
      van de in het eerste lid bedoelde verzekerde, tenzij hij:

      a. onderdaan is van de ontvangende staat;

      b. ten tijde van aanwerving niet in Nederland woonde;

      c. buiten Nederland arbeid verricht anders dan uit hoofde van vorenbedoelde dienstbetrekking; of

      d. een uitkering ontvangt op grond van een buitenlandse wettelijke regeling inzake sociale zekerheid.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel7
    url: https://wetten.overheid.nl/BWBR0004613/2006-09-30#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0004052
        artikel: '7'
  - number: 4b
    text: |-
      1 Als werknemer in de zin van de werknemersverzekeringen wordt beschouwd de Nederlander, voorzover niet reeds
      begrepen onder [artikel 4a][ref1], die uit hoofde van een dienstbetrekking met een Nederlands publiekrechtelijke
      rechtspersoon buiten Nederland arbeid verricht ten behoeve van die rechtspersoon, tenzij hij:

      a. ten tijde van aanwerving niet in Nederland woonde;

      b. buiten Nederland arbeid verricht anders dan uit hoofde van de vorenbedoelde dienstbetrekking;

      c. een uitkering ontvangt op grond van een buitenlandse wettelijke regeling inzake sociale zekerheid; of

      d. werkzaam is bij een door Onze Minister, Onze Minister van Volksgezondheid, Welzijn en Sport en Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties aan te wijzen volkenrechtelijke organisatie en op hem een regeling inzake
      sociale zekerheid van die organisatie van toepassing is.

      2 In afwijking van het eerste lid, onderdeel b, wordt als werknemer in de zin van de werknemersverzekeringen
      beschouwd de Nederlander die in dienst is van een publiekrechtelijke rechtspersoon op de Nederlandse Antillen of
      Aruba mits hij door de Nederlandse overheid is uitgezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0004613#Artikel4a
    url: https://wetten.overheid.nl/BWBR0004613/2006-09-30#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0004613
        artikel: 4a
  - number: 4c
    text: |-
      Als werknemer in de zin van de werknemersverzekeringen wordt beschouwd de vreemdeling die rechtmatig in Nederland
      verblijf houdt in de zin van [artikel 8, onder f tot en met k, van de Vreemdelingenwet 2000][ref1], indien hij in
      overeenstemming met de [Wet arbeid vreemdelingen][ref2] arbeid in dienstbetrekking verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0004613/2006-09-30#Artikel4c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0007149
  - number: '5'
    text: |-
      Als werknemer in de zin van de werknemersverzekeringen wordt niet beschouwd degene die in Nederland woont, doch
      buiten Nederland in dienstbetrekking arbeid verricht en ter zake van die arbeid is verzekerd tegen geldelijke
      gevolgen van langdurige arbeidsongeschiktheid en werkloosheid op grond van een in het land waar hij werkt geldende
      wettelijke regeling.
    url: https://wetten.overheid.nl/BWBR0004613/2006-09-30#Artikel5
  - number: '6'
    text: |-
      1 Als werknemer in de zin van de werknemersverzekeringen wordt niet beschouwd de diplomatiek ambtenaar en de
      consulaire ambtenaar, niet zijnde honorair consul, van een andere mogendheid, tenzij zij:

      a. in Nederland arbeid in dienstbetrekking verrichten anders dan uit hoofde van de vorenbedoelde dienstbetrekking;
      of

      b. een Nederlandse socialeverzekeringsuitkering ontvangen.

      2 Als werknemer in de zin van de werknemersverzekeringen worden niet beschouwd de naar Nederland uitgezonden leden
      van het administratieve, technische en bedienende personeel van de diplomatieke zending of de consulaire post van
      een andere mogendheid, indien zij korter dan tien jaar in Nederland werkzaam zijn, tenzij zij:

      a. Nederlander zijn;

      b. ten tijde van aanwerving in Nederland woonden;

      c. in Nederland arbeid in dienstbetrekking verrichten anders dan de werkzaamheden, bedoeld in de aanhef; of

      d. een Nederlandse socialeverzekeringsuitkering ontvangen.

      3 Als werknemer in de zin van de werknemersverzekeringen worden niet beschouwd de leden van het administratieve,
      technische en bedienende personeel van de diplomatieke zending of de consulaire post van een andere mogendheid
      alsmede de particuliere bedienden die in dienst zijn van de ambtenaar, bedoeld in het eerste lid, of van de leden
      van het personeel, bedoeld in het tweede lid, indien zij reeds vóór 1 augustus 1987 als zodanig in dienst waren, en
      vanaf 1 augustus 1987 als zodanig onafgebroken in dienst zijn, tenzij zij:

      a. in Nederland arbeid in dienstbetrekking verrichten anders dan de werkzaamheden, bedoeld in de aanhef; of

      b. een Nederlandse socialeverzekeringsuitkering ontvangen.

      In afwijking van de eerste zin worden de daar genoemde leden en particuliere bedienden als werknemer in de zin van
      de werknemersverzekeringen beschouwd indien zij dit reeds op 31 juli 1987 waren.

      4 Als werknemer in de zin van de werknemersverzekeringen wordt niet beschouwd de particulier bediende die in dienst
      is van de ambtenaar, bedoeld in het eerste lid, of van de leden van het personeel, bedoeld in het tweede lid,
      indien hij korter dan tien jaar in Nederland werkzaam is en op hem het stelsel van sociale verzekering van een
      andere mogendheid van toepassing is, tenzij hij:

      a. Nederlander is;

      b. ten tijde van aanwerving in Nederland woonde;

      c. in Nederland arbeid in dienstbetrekking verricht anders dan uit hoofde van de vorenbedoelde dienstbetrekking; of

      d. een Nederlandse socialeverzekeringsuitkering ontvangt.
    url: https://wetten.overheid.nl/BWBR0004613/2006-09-30#Artikel6
  - number: '7'
    text: |-
      1 Als werknemer in de zin van de werknemersverzekeringen wordt niet beschouwd de persoon die in dienst is van een
      volkenrechtelijke organisatie en op wie de regeling inzake sociale zekerheid van die organisatie van toepassing is,
      tenzij hij:

      a. in Nederland arbeid in dienstbetrekking verricht anders dan uit hoofde van de vorenbedoelde dienstbetrekking; of

      b. een Nederlandse socialeverzekeringsuitkering ontvangt.

      2 De volkenrechtelijke organisaties, bedoeld in het eerste lid, worden door Onze Minister en Onze Minister van
      Volksgezondheid, Welzijn en Sport in overeenstemming met Onze Minister van Buitenlandse Zaken, aangewezen.
    url: https://wetten.overheid.nl/BWBR0004613/2006-09-30#Artikel7
  - number: '8'
    text: |-
      1 Als werknemer in de zin van de werknemersverzekeringen wordt niet beschouwd de persoon die:

      a. gevolmachtigd Minister van de Nederlandse Antillen of gevolmachtigd Minister van Aruba is, of

      b. als ambtenaar is toegevoegd aan een van de in onderdeel *a* bedoelde personen, of

      c. als ambtenaar van de Nederlandse Antillen, Aruba of een publiekrechtelijke rechtspersoon van een van beide
      landen in Nederland een studie-opdracht vervult,

      mits hij is verzekerd tegen geldelijke gevolgen van langdurige arbeidsongeschiktheid en werkloosheid op grond van
      een in de Nederlandse Antillen of in Aruba geldende wettelijke regeling.

      2 Het eerste lid geldt slechts ter zake van de dienstbetrekking waarin een in dat lid genoemde functie wordt
      uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0004613/2006-09-30#Artikel8
  - number: '9'
    text: |-
      Als werknemer in de zin van de werknemersverzekeringen wordt niet beschouwd de vreemdeling die deel uitmaakt van de
      bemanning van een zeevaartuig mits hij woont aan boord van dat vaartuig.
    url: https://wetten.overheid.nl/BWBR0004613/2006-09-30#Artikel9
  - number: '10'
    text: |-
      Als werknemer in de zin van de werknemersverzekeringen wordt niet beschouwd degene die in Nederland woont, behoort
      tot het rijdend, vliegend of op de binnenwateren varend personeel van een buiten Nederland wonende of gevestigde
      werkgever die internationaal vervoer verricht, en ter zake van die dienstbetrekking is verzekerd tegen geldelijke
      gevolgen van langdurige arbeidsongeschiktheid en werkloosheid op grond van een in het land, waar zijn werkgever
      woont of gevestigd is, geldende wettelijke regeling, tenzij hij in hoofdzaak in Nederland arbeid verricht dan wel
      werkt bij een filiaal of een vaste vertegenwoordiging van die werkgever in Nederland.
    url: https://wetten.overheid.nl/BWBR0004613/2006-09-30#Artikel10
  - number: '11'
    text: |-
      Als werknemer in de zin van de werknemersverzekeringen wordt niet beschouwd degene die niet in Nederland woont,
      behoort tot het rijdend, vliegend of op de binnenwateren varend personeel van een in Nederland wonende of
      gevestigde werkgever en in hoofdzaak in het woonland arbeid verricht dan wel werkt bij een filiaal of een vaste
      vertegenwoordiging van die werkgever buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0004613/2006-09-30#Artikel11
  - number: '12'
    text: |-
      Als werknemer in de zin van de werknemersverzekeringen wordt niet beschouwd degene die in dienst is van een
      buiten Nederland wonende of gevestigde werkgever, deel uitmaakt van de bemanning van een zee- of binnenvaartuig en
      tijdelijk in Nederland werkzaam is.
    url: https://wetten.overheid.nl/BWBR0004613/2006-09-30#Artikel12
  - number: '13'
    text: |-
      1 Als werknemer in de zin van de werknemersverzekeringen wordt niet beschouwd de persoon die niet in Nederland
      woont en die ter zake van als musicus of anderszins als artiest in dienstbetrekking verrichte arbeid aan de
      loonbelasting is onderworpen, indien hij die arbeid voor korte duur in Nederland verricht.

      2 Voor de toepassing van het eerste lid wordt met artiest gelijkgesteld degene, die als beroep een tak van sport
      beoefent.
    url: https://wetten.overheid.nl/BWBR0004613/2006-09-30#Artikel13
  - number: '14'
    text: |-
      1 Als werknemer in de zin van de werknemersverzekeringen wordt niet beschouwd degene, anders dan bedoeld in
      [artikel 7][ref1], [8][ref2] of [12][ref3], die buiten Nederland woont, in dienst is van een buiten Nederland
      wonende of gevestigde werkgever en tijdelijk in Nederland werkzaam is, indien bij de aanvang van zijn werkzaamheden
      kan worden aangenomen, dat deze niet langer dan zes maanden, gerekend vanaf de aanvang van die werkzaamheden, in
      Nederland zullen worden verricht.

      2 Onze Minister is bevoegd in bepaalde gevallen van het eerste lid en de aldaar genoemde termijn af te wijken.
      Een buiten Nederland doorgebrachte verlofperiode geldt niet als onderbreking van zowel de termijn, genoemd in het
      eerste lid, als de termijn, vastgesteld na toepassing van de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0004613#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004613#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0004613#Artikel12
    url: https://wetten.overheid.nl/BWBR0004613/2006-09-30#Artikel14
    references:
      - id: ref1
