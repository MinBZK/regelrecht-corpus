    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel1
  - number: 1.a
    text: |-
      *werknemersverzekeringen:* de [Wet op de arbeidsongeschiktheidsverzekering][ref1], de
      [Wet werk en inkomen naar arbeidsvermogen][ref2], de [Ziektewet][ref3] en de [Werkloosheidswet][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0019057
      [ref3]: https://wetten.overheid.nl/BWBR0001888
      [ref4]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel1
