        bwb_id: BWBR0019057
      - id: ref3
        bwb_id: BWBR0001888
      - id: ref4
        bwb_id: BWBR0004045
  - number: 1.b
    text: |-
      *in Nederland arbeid verrichten, dan wel werkzaam zijn:* in Nederland of op het continentaal plat arbeid
      verrichten;
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel1
  - number: 1.c
    text: |-
      *buiten Nederland arbeid verrichten, dan wel werkzaam zijn:* buiten Nederland en het continentaal plat arbeid
      verrichten;
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel1
  - number: 1.d
    text: |-
      *Nederlandse socialeverzekeringsuitkering:* een uitkering op grond van de [Werkloosheidswet][ref1], de
      [Ziektewet][ref2], [hoofdstuk 3, afdeling 2][ref3], [artikel 4:2b][ref4] of [6:3 van de Wet arbeid en zorg][ref5],
      de [Wet op de arbeidsongeschiktheidsverzekering][ref6], de [Wet werk en inkomen naar arbeidsvermogen][ref7], de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref8], de [Wet inkomensvoorziening oudere werklozen][ref9],
      de [Wet werk en arbeidsondersteuning jonggehandicapten][ref10], de [Algemene Ouderdomswet][ref11] en de
      [Algemene nabestaandenwet][ref12] en de [Algemene Kinderbijslagwet][ref13].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0001888
