preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 12 mei 1989, Directoraat-
    Generaal Sociale Zekerheid, Directie Sociale Verzekeringen, Hoofdafdeling Werknemersverzekeringen, Afdeling
    Werkloosheidsregelingen, nr. SZ/SVW/89/2566;

    Gelet op artikel 3, derde en vierde lid, van de Wet op de arbeidsongeschiktheidsverzekering (Stb. 1987, 89),
    artikel 3, derde en vierde lid, van de Ziektewet (Stb. 1987, 88) en artikel 3, derde en vierde lid, van de
    Werkloosheidswet (Stb. 1987, 93);

    De Raad van State gehoord (advies van 5 juli 1989, nr. W12.89.0249);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 16 augustus 1989,
    Directoraat-Generaal Sociale Zekerheid, nr. SZ/SV/SVW/89/3774;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#ArtikelAanhef
articles:
