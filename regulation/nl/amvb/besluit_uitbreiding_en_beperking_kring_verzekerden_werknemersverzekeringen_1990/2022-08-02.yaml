  - number: '2'
    text: |-
      Als werknemer in de zin van de werknemersverzekeringen wordt beschouwd de Nederlander die in dienst is van een in
      Nederland wonende of gevestigde werkgever, deel uitmaakt van de bemanning van een zeevaartuig en woont aan boord
      van dat vaartuig.
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel2
  - number: '3'
    text: |-
      Als werknemer in de zin van de werknemersverzekeringen wordt beschouwd degene die niet in Nederland woont
      en behoort tot het rijdend, vliegend of op de binnenwateren varend personeel van een in Nederland wonende of
      gevestigde werkgever die internationaal vervoer verricht, tenzij hij in hoofdzaak in het woonland arbeid verricht
      dan wel werkt bij een filiaal of een vaste vertegenwoordiging van die werkgever buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel3
  - number: 3a.1
    text: |-
      Onverminderd de [artikelen 4a][ref1] en [4b][ref2] wordt als werknemer in de zin van de werknemersverzekeringen
      beschouwd degene die:


      [ref1]: https://wetten.overheid.nl/BWBR0004613#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0004613#Artikel4b
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0004613
        artikel: 4a
      - id: ref2
        bwb_id: BWBR0004613
        artikel: 4b
  - number: 3a.1.a
    text: |-
      de nationaliteit heeft van een van de lidstaten van de Europese Unie, een staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte of Zwitserland;
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel3a
  - number: 3a.1.b
    text: |-
      woont buiten Nederland in een andere lidstaat van de Europese Unie, een staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte, of Zwitserland;
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel3a
  - number: 3a.1.c
    text: een dienstbetrekking heeft met een in Nederland wonende of gevestigde werkgever, en
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel3a
  - number: 3a.1.d
    text: 'arbeid verricht voor de werkgever, bedoeld onderdeel c, en werkzaam is buiten:'
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel3a
  - number: 3a.1.d.1
    text: Nederland of een andere lidstaat van de Europese Unie;
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel3a
  - number: 3a.1.d.2
    text: een staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte, of
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel3a
  - number: 3a.1.d.3
    text: Zwitserland.
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel3a
  - number: 3a.2
    text: 'Als werknemer in de zin van de werknemersverzekeringen wordt beschouwd degene die:'
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel3a
  - number: 3a.2.a
    text: niet beschikt over de nationaliteit, bedoeld in het eerste lid, onderdeel a;
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel3a
  - number: 3a.2.b
    text: |-
      die buiten Nederland rechtmatig op het grondgebied verblijft van een andere lidstaat van de Europese Unie,
      uitgezonderd Denemarken;
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel3a
  - number: 3a.2.c
    text: een dienstbetrekking heeft met een in Nederland wonende of gevestigde werkgever, en
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel3a
  - number: 3a.2.d
    text: 'arbeid verricht voor de werkgever, bedoeld in onderdeel c, en werkzaam is buiten:'
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel3a
  - number: 3a.2.d.1
    text: Nederland of een andere lidstaat van de Europese Unie;
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel3a
  - number: 3a.2.d.2
    text: een staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte, of
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel3a
  - number: 3a.2.d.3
    text: Zwitserland.
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel3a
  - number: '4'
    text: |-
      Als werknemer in de zin van de werknemersverzekeringen wordt beschouwd de Nederlander en de vreemdeling, bedoeld in
      [artikel 8, onder a tot en met e, of l, van de Vreemdelingenwet 2000][ref1] die in Nederland woont, behoort tot het
      rijdend, vliegend of op de binnenwateren varend personeel van een buiten Nederland wonende of gevestigde werkgever
      en in hoofdzaak in Nederland arbeid verricht dan wel werkt bij een filiaal of een vaste vertegenwoordiging van die
      werkgever in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 4a.1
    text: |-
      Als werknemer in de zin van de werknemersverzekeringen wordt beschouwd de persoon die niet in Nederland woont en
      die uit hoofde van een privaatrechtelijke dienstbetrekking naar Nederlands recht met een overheidswerkgever als
      bedoeld in [artikel 2 van de Ambtenarenwet 2017][ref1], dan wel een publiekrechtelijke dienstbetrekking met een
      bestuursorgaan dat daar deel van uitmaakt, als ambtenaar van Aruba, Curaçao of Sint Maarten of anderszins uit
      hoofde van een uitzending door of met instemming met de Minister van Buitenlandse Zaken tijdelijk werkzaam is bij
      een vertegenwoordiging van het Koninkrijk der Nederlanden in het buitenland, tenzij hij:


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel2
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '2'
  - number: 4a.1.a
    text: buiten Nederland arbeid verricht anders dan de werkzaamheden, bedoeld in de aanhef; of
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel4a
  - number: 4a.1.b
    text: een uitkering ontvangt op grond van een buitenlandse wettelijke regeling inzake sociale zekerheid.
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel4a
  - number: 4a.2
    text: |-
      Als werknemer in de zin van de werknemersverzekeringen wordt beschouwd de particuliere bediende die in dienst is
      van de in het eerste lid bedoelde verzekerde, tenzij hij:
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel4a
  - number: 4a.2.a
    text: onderdaan is van de ontvangende staat;
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel4a
  - number: 4a.2.b
    text: ten tijde van aanwerving niet in Nederland woonde;
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel4a
  - number: 4a.2.c
    text: buiten Nederland arbeid verricht anders dan uit hoofde van vorenbedoelde dienstbetrekking; of
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel4a
  - number: 4a.2.d
    text: een uitkering ontvangt op grond van een buitenlandse wettelijke regeling inzake sociale zekerheid.
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel4a
  - number: 4b.1
    text: |-
      Als werknemer in de zin van de werknemersverzekeringen wordt beschouwd de persoon die niet in Nederland woont,
      voor zover niet reeds begrepen onder artikel 4a, en die uit hoofde van een privaatrechtelijke dienstbetrekking naar
      Nederlands recht met een overheidswerkgever als bedoeld in [artikel 2 van de Ambtenarenwet 2017][ref1], dan wel
      een publiekrechtelijke dienstbetrekking met een bestuursorgaan dat daar deel van uitmaakt, buiten Nederland arbeid
      verricht ten behoeve van die overheidswerkgever of dat bestuursorgaan, tenzij hij:


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel2
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '2'
  - number: 4b.1.a
    text: ten tijde van aanwerving niet in Nederland woonde;
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel4b
  - number: 4b.1.b
    text: buiten Nederland arbeid verricht anders dan uit hoofde van de vorenbedoelde dienstbetrekking;
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel4b
  - number: 4b.1.c
    text: een uitkering ontvangt op grond van een buitenlandse wettelijke regeling inzake sociale zekerheid; of
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel4b
  - number: 4b.1.d
    text: |-
      werkzaam is bij een door Onze Minister, Onze Minister van Volksgezondheid, Welzijn en Sport en Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties aan te wijzen volkenrechtelijke organisatie en op hem een regeling inzake
      sociale zekerheid van die organisatie van toepassing is.
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel4b
  - number: 4b.2
    text: |-
      In afwijking van het eerste lid, onderdeel b, wordt als werknemer in de zin van de werknemersverzekeringen
      beschouwd de Nederlander die in dienst is van een publiekrechtelijke rechtspersoon in Aruba, Curaçao, Sint Maarten
      of in de openbare lichamen Bonaire, Sint Eustatius of Saba mits hij door de Nederlandse overheid is uitgezonden.
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel4b
  - number: 4c
    text: |-
      Als werknemer in de zin van de werknemersverzekeringen wordt beschouwd de vreemdeling die: rechtmatig in Nederland
      verblijf houdt in de zin van [artikel 8, onder f tot en met k, van de Vreemdelingenwet 2000][ref1], indien hij:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel4c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 4c.a
    text: |-
      in Nederland, met uitzondering van het continentaal plat, in overeenstemming met de
      [Wet arbeid vreemdelingen][ref1] arbeid in dienstbetrekking verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel4c
    references:
      - id: ref1
        bwb_id: BWBR0007149
  - number: 4c.b
    text: op het continentaal plat arbeid in dienstbetrekking verricht.
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel4c
  - number: '5'
    text: |-
      Als werknemer in de zin van de werknemersverzekeringen wordt niet beschouwd degene die in Nederland woont, doch
      buiten Nederland in dienstbetrekking arbeid verricht en ter zake van die arbeid is verzekerd tegen geldelijke
      gevolgen van langdurige arbeidsongeschiktheid en werkloosheid op grond van een in het land waar hij werkt geldende
      wettelijke regeling.
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel5
  - number: '6.1'
    text: |-
      Als werknemer in de zin van de werknemersverzekeringen wordt niet beschouwd de diplomatiek ambtenaar en de
      consulaire ambtenaar, niet zijnde honorair consul, van een andere mogendheid, tenzij zij:
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel6
  - number: 6.1.a
    text: in Nederland arbeid in dienstbetrekking verrichten anders dan uit hoofde van de vorenbedoelde dienstbetrekking; of
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel6
  - number: 6.1.b
    text: een Nederlandse socialeverzekeringsuitkering ontvangen.
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel6
  - number: '6.2'
    text: |-
      Als werknemer in de zin van de werknemersverzekeringen worden niet beschouwd de naar Nederland uitgezonden leden
      van het administratieve, technische en bedienende personeel van de diplomatieke zending of de consulaire post van
      een andere mogendheid, indien zij korter dan tien jaar in Nederland werkzaam zijn, tenzij zij:
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel6
  - number: 6.2.a
    text: Nederlander zijn;
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel6
  - number: 6.2.b
    text: ten tijde van aanwerving in Nederland woonden;
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel6
  - number: 6.2.c
    text: in Nederland arbeid in dienstbetrekking verrichten anders dan de werkzaamheden, bedoeld in de aanhef; of
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel6
  - number: 6.2.d
    text: een Nederlandse socialeverzekeringsuitkering ontvangen.
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel6
  - number: '6.3'
    text: |-
      Als werknemer in de zin van de werknemersverzekeringen worden niet beschouwd de leden van het administratieve,
      technische en bedienende personeel van de diplomatieke zending of de consulaire post van een andere mogendheid
      alsmede de particuliere bedienden die in dienst zijn van de ambtenaar, bedoeld in het eerste lid, of van de leden
      van het personeel, bedoeld in het tweede lid, indien zij reeds vóór 1 augustus 1987 als zodanig in dienst waren, en
      vanaf 1 augustus 1987 als zodanig onafgebroken in dienst zijn, tenzij zij:
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel6
  - number: 6.3.a
    text: in Nederland arbeid in dienstbetrekking verrichten anders dan de werkzaamheden, bedoeld in de aanhef; of
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel6
  - number: 6.3.b
    text: een Nederlandse socialeverzekeringsuitkering ontvangen.
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel6
  - number: '6.4'
    text: |-
      Als werknemer in de zin van de werknemersverzekeringen wordt niet beschouwd de particulier bediende die in dienst
      is van de ambtenaar, bedoeld in het eerste lid, of van de leden van het personeel, bedoeld in het tweede lid,
      indien hij korter dan tien jaar in Nederland werkzaam is en op hem het stelsel van sociale verzekering van een
      andere mogendheid van toepassing is, tenzij hij:
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel6
  - number: 6.4.a
    text: Nederlander is;
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel6
  - number: 6.4.b
    text: ten tijde van aanwerving in Nederland woonde;
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel6
  - number: 6.4.c
    text: in Nederland arbeid in dienstbetrekking verricht anders dan uit hoofde van de vorenbedoelde dienstbetrekking; of
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel6
  - number: 6.4.d
    text: een Nederlandse socialeverzekeringsuitkering ontvangt.
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel6
  - number: '7.1'
    text: |-
      Als werknemer in de zin van de werknemersverzekeringen wordt niet beschouwd de persoon die in dienst is van een
      volkenrechtelijke organisatie en op wie de regeling inzake sociale zekerheid van die organisatie van toepassing is,
      tenzij hij:
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel7
  - number: 7.1.a
    text: in Nederland arbeid in dienstbetrekking verricht anders dan uit hoofde van de vorenbedoelde dienstbetrekking; of
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel7
  - number: 7.1.b
    text: een Nederlandse socialeverzekeringsuitkering ontvangt.
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel7
  - number: '7.2'
    text: |-
      De volkenrechtelijke organisaties, bedoeld in het eerste lid, worden door Onze Minister en Onze Minister van
      Volksgezondheid, Welzijn en Sport in overeenstemming met Onze Minister van Buitenlandse Zaken, aangewezen.
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel7
  - number: '7.3'
    text: |-
      Als werknemer in de zin van de werknemersverzekeringen wordt niet beschouwd de particuliere bediende van de
      persoon, bedoeld in het eerste lid, die werkzaam is voor een volkenrechtelijke organisatie, indien hij korter dan
      tien jaar in Nederland is en op hem het stelsel van sociale verzekering van een andere mogendheid van toepassing
      is, tenzij hij:
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel7
  - number: 7.3.a
    text: Nederlander is;
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel7
  - number: 7.3.b
    text: ten tijde van de aanwerving in Nederland woonde;
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel7
  - number: 7.3.c
    text: in Nederland arbeid verricht anders dan uit hoofde van vorenbedoelde dienstbetrekking; of
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel7
  - number: 7.3.d
    text: een Nederlandse socialeverzekeringsuitkering ontvangt.
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel7
  - number: '8.1'
    text: 'Als werknemer in de zin van de werknemersverzekeringen wordt niet beschouwd de persoon die:'
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel8
  - number: 8.1.a
    text: |-
      gevolmachtigd Minister van Aruba, gevolmachtigd Minister van Curaçao of gevolmachtigd Minister van Sint Maarten
      is, of
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel8
  - number: 8.1.b
    text: als ambtenaar is toegevoegd aan een van de in onderdeel *a* bedoelde personen, of
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel8
  - number: 8.1.c
    text: |-
      als ambtenaar van Aruba, Curaçao, Sint Maarten of de openbare lichamen Bonaire, Sint Eustatius of Saba of een
      publiekrechtelijk rechtspersoon van een van de drie landen of openbare lichamen in Nederland een studie-opdracht
      vervult,
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel8
  - number: '8.2'
    text: |-
      Het eerste lid geldt slechts ter zake van de dienstbetrekking waarin een in dat lid genoemde functie wordt
      uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel8
  - number: '9'
    text: |-
      Als werknemer in de zin van de werknemersverzekeringen wordt niet beschouwd de vreemdeling die deel uitmaakt van de
      bemanning van een zeevaartuig mits hij woont aan boord van dat vaartuig.
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel9
  - number: '10'
    text: |-
      Als werknemer in de zin van de werknemersverzekeringen wordt niet beschouwd degene die in Nederland woont, behoort
      tot het rijdend, vliegend of op de binnenwateren varend personeel van een buiten Nederland wonende of gevestigde
      werkgever die internationaal vervoer verricht, en ter zake van die dienstbetrekking is verzekerd tegen geldelijke
      gevolgen van langdurige arbeidsongeschiktheid en werkloosheid op grond van een in het land, waar zijn werkgever
      woont of gevestigd is, geldende wettelijke regeling, tenzij hij in hoofdzaak in Nederland arbeid verricht dan wel
      werkt bij een filiaal of een vaste vertegenwoordiging van die werkgever in Nederland.
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel10
  - number: '11'
    text: |-
      Als werknemer in de zin van de werknemersverzekeringen wordt niet beschouwd degene die niet in Nederland woont,
      behoort tot het rijdend, vliegend of op de binnenwateren varend personeel van een in Nederland wonende of
      gevestigde werkgever en in hoofdzaak in het woonland arbeid verricht dan wel werkt bij een filiaal of een vaste
      vertegenwoordiging van die werkgever buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel11
  - number: '12'
    text: |-
      Als werknemer in de zin van de werknemersverzekeringen wordt niet beschouwd degene die in dienst is van een buiten
      Nederland wonende of gevestigde werkgever, deel uitmaakt van de bemanning van een zee- of binnenvaartuig en niet
      langer dan zes maanden in Nederland werkzaam is.
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel12
  - number: '13.1'
    text: |-
      Als werknemer in de zin van de werknemersverzekeringen wordt niet beschouwd de persoon die niet in Nederland woont
      en die ter zake van als musicus of anderszins als artiest in dienstbetrekking verrichte arbeid aan de loonbelasting
      is onderworpen, indien hij die arbeid voor korte duur in Nederland verricht.
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel13
  - number: '13.2'
    text: |-
      Voor de toepassing van het eerste lid wordt met artiest gelijkgesteld degene, die als beroep een tak van sport
      beoefent.
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel13
  - number: '14.1'
    text: |-
      Als werknemer in de zin van de werknemersverzekeringen wordt niet beschouwd degene, anders dan bedoeld in
      [artikel 7][ref1], [8][ref2] of [12][ref3], die buiten Nederland woont, in dienst is van een buiten Nederland
      wonende of gevestigde werkgever en tijdelijk in Nederland werkzaam is, indien bij de aanvang van zijn werkzaamheden
      kan worden aangenomen, dat deze niet langer dan zes maanden, gerekend vanaf de aanvang van die werkzaamheden, in
      Nederland zullen worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0004613#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004613#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0004613#Artikel12
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004613
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0004613
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0004613
        artikel: '12'
  - number: '14.2'
    text: |-
      Onze Minister is bevoegd in bepaalde gevallen van het eerste lid en de aldaar genoemde termijn af te wijken. Een
      buiten Nederland en op het continentaal plat doorgebrachte verlofperiode geldt niet als onderbreking van zowel de
      termijn, genoemd in het eerste lid, als de termijn, vastgesteld na toepassing van de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel14
  - number: '15.1'
    text: |-
      Het UWV kan op verzoek bepalen dat, voor de duur van ten hoogste twee jaar, niet als werknemer in de zin van de
      werknemersverzekeringen wordt beschouwd degene die
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel15
  - number: 15.1.a
    text: niet duurzaam in Nederland woont;
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel15
  - number: 15.1.b
    text: in dienst is van een in Nederland gevestigde buitenlandse instelling zonder winstoogmerk, en
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel15
  - number: 15.1.c
    text: verzekerd is krachtens het stelsel van sociale verzekering van een andere mogendheid.
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel15
  - number: '15.2'
    text: De in het eerste lid genoemde periode kan op verzoek telkens met ten hoogste twee jaar worden verlengd.
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel15
  - number: 16a
    text: |-
      Als werknemer in de zin van de werknemersverzekeringen wordt niet beschouwd de vreemdeling die rechtmatig in
      Nederland verblijf houdt in de zin van [artikel 8, onder a tot en met e, of l, van de Vreemdelingenwet 2000][ref1],
      indien hij in Nederland, met uitzondering van het continentaal plat, arbeid in dienstbetrekking verricht zonder dat
      aan de [Wet arbeid vreemdelingen][ref2] is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0007149
  - number: 16b
    text: |-
      [Artikel 7, derde lid][ref1], is niet van toepassing ten aanzien van de particulier bediende, bedoeld in dat lid,
      indien deze persoon op de dag van inwerkingtreding van het besluit van 11 december 2014 tot wijziging van het
      Besluit uitbreiding en beperking kring verzekerden volksverzekeringen 1999, het Besluit uitbreiding en beperking
      kring verzekerden werknemersverzekeringen 1990 en het Besluit uitbreiding en beperking kring ingezetenen Wet Wajong
      (Stb. 514) werknemer was in de zin van de werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0004613#Artikel7
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0004613
        artikel: '7'
  - number: 16a_bis
    text: |-
      [Artikel 4b, eerste lid][ref1], zoals dat onmiddellijk voor 1 juli 2022 luidde, blijft van toepassing op personen
      die onmiddellijk voor die datum verzekerd waren voor de volksverzekeringen op grond van dat lid zolang de
      verzekering op die grond voortduurt.


      [ref1]: https://wetten.overheid.nl/BWBR0004613#Artikel4b
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0004613
        artikel: 4b
  - number: '17'
    text: Het besluit van 24 december 1986, *Stb.* 654, wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel17
  - number: '18'
    text: Dit besluit treedt in werking met ingang van 1 januari 1990.
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel18
  - number: '19'
    text: |-
      Dit besluit kan worden aangehaald onder de titel "Besluit uitbreiding en beperking kring verzekerden
      werknemersverzekeringen 1990".
    url: https://wetten.overheid.nl/BWBR0004613/2022-08-02#Artikel19
