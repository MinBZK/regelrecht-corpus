preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 1 november 2007, 2007-
    00004664125, DGOBR/POIR/OR, gedaan in overeenstemming met het gevoelen van de ministerraad;

    Gelet op artikel 44, eerste lid, van de Grondwet;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0023020/2007-12-19#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder Onze Minister: een minister als bedoeld in
      [artikel 44, eerste lid, van de Grondwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel44
    url: https://wetten.overheid.nl/BWBR0023020/2007-12-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '44'
  - number: '2.1'
    text: Onze Minister stelt de organisatie en formatie van zijn ministerie vast.
    url: https://wetten.overheid.nl/BWBR0023020/2007-12-19#Artikel2
  - number: '2.2'
    text: |-
      De vaststelling geschiedt in overeenstemming met Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties voor zover het betreft de functies in de salarisschalen 16 en hoger, bedoeld in het
      [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0023020/2007-12-19#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: '3'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt na overleg met Onze Ministers een kader vast voor
      de vaststelling van de organisatie en formatie, bedoeld in [artikel 2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023020#Artikel2
    url: https://wetten.overheid.nl/BWBR0023020/2007-12-19#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0023020
        artikel: '2'
  - number: '4'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties publiceert jaarlijks van ieder
      ministerie de organisatie en de formatie, voor zover vastgesteld op salarisschaal 16 of hoger van het
      [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0023020/2007-12-19#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: '5'
    text: |-
      Het [Coördinatiebesluit inrichting organisatie en formatie rijksdienst][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0009500
    url: https://wetten.overheid.nl/BWBR0023020/2007-12-19#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009500
  - number: '6'
    text: 'Dit besluit wordt aangehaald als: Coördinatiebesluit organisatie en formatie rijksdienst 2007.'
    url: https://wetten.overheid.nl/BWBR0023020/2007-12-19#Artikel6
