  - number: '3.11'
    text: |-
      Bij ministeriële regeling worden normen voor de kwaliteit van de examinering van de examens, bedoeld in
      [artikel 3.5, tweede lid][ref1], vastgesteld die in ieder geval betrekking hebben op:

      a. de afname van de examens;

      b. de voorwaarden voor toelating tot de examens;

      c. de deskundigheid van de beoordelaars;

      d. het vaststellen van de uitslag van de examens;

      e. de waarborging van de kwaliteit van de examinering;

      f. de procedures en sancties bij onregelmatigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel3.5
    url: https://wetten.overheid.nl/BWBR0045555/2022-01-01#Artikel3.11
    references:
