  - number: '6.1'
    text: |-
      Tenzij uitdrukkelijk anders is bepaald, zijn de bepalingen in dit hoofdstuk van overeenkomstige toepassing op de
      persoon, bedoeld in [artikel 3, tweede lid, van de wet][ref1], die rechtmatig verblijf verkrijgt als bedoeld in
      [artikel 8, onderdeel e, van de Vreemdelingenwet 2000][ref2] en die:

      a. 16 jaar of ouder is en de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref3] nog niet heeft bereikt;

      b. minder dan acht jaren leerplichtig of kwalificatieplichtig is geweest op grond van de
      [Leerplichtwet 1969][ref4];

      c. niet beschikt over een diploma, certificaat of ander document als bedoeld in
      [artikel 4, eerste lid, onderdeel b, van de wet][ref5] en geen opleiding volgt waarvan de afronding leidt tot
      uitreiking van voornoemd diploma, certificaat of ander document;

      d. niet leerplichtig of kwalificatieplichtig is op grond van de [Leerplichtwet 1969][ref6]; of

      e. niet heeft aangetoond al voldoende te zijn ingeburgerd.


