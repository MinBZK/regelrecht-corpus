  - number: '3.15'
    text: |-
      1 Degene die heeft voldaan aan de inburgeringsplicht en in dat kader het inburgeringsexamen of de onderwijsroute
      heeft behaald, ontvangt een inburgeringsdiploma.

      2 Onze Minister verstrekt het inburgeringsdiploma.

      3 Het inburgeringsdiploma wordt ondertekend door Onze Minister.

      4 Duplicaten van het inburgeringsdiploma worden tegen betaling van de kostprijs, uitsluitend door Onze Minister
      verstrekt.

      5 Bij ministeriële regeling wordt de tekst van het inburgeringsdiploma vastgesteld.
    url: https://wetten.overheid.nl/BWBR0045555/2022-01-01#Artikel3.15
  - number: '3.16'
    text: |-
      1 Degene die heeft voldaan aan de inburgeringsplicht en in dat kader de zelfredzaamheidsroute heeft behaald,
      ontvangt een inburgeringscertificaat.

      2 Onze Minister verstrekt het inburgeringscertificaat.

      3 Het inburgeringscertificaat wordt ondertekend door Onze Minister.

      4 Duplicaten van inburgeringscertificaten worden tegen betaling van de kostprijs, uitsluitend door Onze Minister
      verstrekt.

      5 Bij ministeriële regeling wordt de tekst van het inburgeringscertificaat vastgesteld en kunnen regels worden
      gesteld over de wijze van afgifte van het inburgeringscertificaat.
    url: https://wetten.overheid.nl/BWBR0045555/2022-01-01#Artikel3.16
  - number: '3.17'
    text: |-
      1 Aan de inburgeringsplichtige, bedoeld in [artikel 10 van de wet][ref1], wordt door Onze Minister dan wel door
      een op grond van artikel 10 van de wet aangewezen instelling een aanbod tot voorbereiding op de inburgering gedaan.

      2 De voorbereiding op de inburgering bestaat uit de volgende onderdelen:

      a. een cursus Nederlands als tweede taal;

      b. een introductiemodule Arbeidsmarkt en Participatie;

      c. een introductiemodule kennis van de Nederlandse maatschappij; en

      d. een introductiemodule participatieverklaringstraject.

      3 De deelname aan voorbereiding op de inburgering is kosteloos en deelname kan niet worden verplicht.

      4 Deelname aan voorbereiding op de inburgering mag het inburgeringstraject in geen geval vertragen.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel10
    url: https://wetten.overheid.nl/BWBR0045555/2022-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '10'
  - number: '3.18'
    text: |-
      1 Onze Minister bekostigt de voorbereiding op de inburgering.

      2 De kosten voor de uitvoering van deze taak door de aangewezen instelling, bedoeld in
      [artikel 3.17, eerste lid][ref1], komen ten laste van de begroting van het Ministerie van Sociale Zaken en
      Werkgelegenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel3.17
    url: https://wetten.overheid.nl/BWBR0045555/2022-01-01#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0045555
        artikel: '3.17'
        hoofdstuk: '3'
        afdeling: '6'
  - number: '3.19'
    text: |-
      Op verzoek van de inburgeringsplichtige zullen de door Onze Minister aangewezen organisaties kosteloos het door
      de inburgeringsplichtige behaalde internationale diploma of de behaalde opleidingsjaren waarderen dan wel een
      indicatie geven van het door de inburgeringsplichtige behaalde onderwijsniveau.
    url: https://wetten.overheid.nl/BWBR0045555/2022-01-01#Artikel3.19
  - number: '4.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder termijn de termijn, bedoeld in [artikel 11, eerste lid, van de wet][ref1],
      de op grond van [artikel 12 van de wet][ref2] verlengde termijn, of de vastgestelde nieuwe termijn, bedoeld in de
      [artikelen 24, tweede en derde lid][ref3], en [25, tweede lid, van de wet][ref4], tenzij anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0044770#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0044770#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0044770#Artikel25
