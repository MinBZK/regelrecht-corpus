  - number: '2.3'
    text: |-
      Onze Minister verleent de vrijstelling, bedoeld in [artikel 4, eerste lid, onderdeel e, van de wet][ref1], indien:

      a. de inburgeringsplichtige volgens de basisregistratie personen ten minste 10 jaar onafgebroken als ingezetene
      ingeschreven is geweest;

      b. de inburgeringsplichtige aantoonbaar gedurende ten minste 5 jaar betaald werk of vrijwilligerswerk heeft
      verricht in Nederland; en

      c. in een gesprek is vastgesteld dat de inburgeringsplichtige beheerst over spreekvaardigheid en luistervaardigheid
      in de Nederlandse taal op ten minste het niveau B1 van het Gemeenschappelijk Europees Referentiekader voor Moderne
      Vreemde Talen.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel4
    url: https://wetten.overheid.nl/BWBR0045555/2022-01-01#Artikel2.3
