  - number: '3.1'
    text: |-
      1 Het participatieverklaringstraject wordt wat betreft het onderdeel inleiding op de Nederlandse kernwaarden
      afgelegd door het deelnemen aan een door of namens het college aangeboden inleiding op de Nederlandse
      kernwaarden en wat betreft het onderdeel ondertekenen van de participatieverklaring door het aanwezig zijn bij de
      ondertekeningsbijeenkomst en het aldaar ondertekenen van de participatieverklaring.

      2 Het onderdeel inleiding op de Nederlandse kernwaarden bestaat uit minimaal een activiteit of excursie in het
      kader waarvan aan ten minste een Nederlandse kernwaarde een praktische uitwerking wordt gegeven.

      3 Het participatieverklaringstraject omvat ten minste 12 uren.

      4 Bij het participatieverklaringstraject worden door het college de aanwezigheid van de inburgeringsplichtige bij
      de inleiding op de Nederlandse kernwaarden en de ondertekening van de participatieverklaring geregistreerd.

      5 Indien in het kader van de brede intake door de inburgeringsplichtige activiteiten zijn verricht die voldoen
      aan het gestelde in dit artikel, kunnen deze bestede uren, in afwijking van [artikel 5.3, vierde lid][ref1], in
      mindering worden gebracht op de urennorm, genoemd in het derde lid.

      6 De tekst van de participatieverklaring, bedoeld in [artikel 6, achtste lid, van de wet][ref2], is opgenomen als
      bijlage bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel5.3
      [ref2]: https://wetten.overheid.nl/BWBR0044770#Artikel6
