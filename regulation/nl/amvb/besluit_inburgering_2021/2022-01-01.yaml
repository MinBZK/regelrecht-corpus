  - number: '6.3'
    text: |-
      1 De inburgeringsplichtige, bedoeld in [artikel 19, van de wet][ref1] heeft, behoudens het
      bepaalde in [artikel 20, tweede lid, van de wet][ref2], aanspraak op de lening gedurende de
      termijn, bedoeld in [artikel 11 van de wet][ref3], gedurende de verlengde termijn bedoeld in
      [artikel 12, eerste lid, van de wet][ref4] en gedurende de termijn, genoemd in de boetebeschikking, bedoeld
      in de [artikelen 24, tweede lid][ref5], en [25, tweede lid, van de wet][ref6]. Een persoon als bedoeld in
      [artikel 6.1][ref7] heeft aanspraak op de lening gedurende drie jaar nadat hij rechtmatig verblijf verkrijgt.

      2 Het geleende bedrag wordt niet uitbetaald, indien de inburgeringsplichtige:

      a. niet langer ingezetene is in de zin van de [Wet basisregistratie personen][ref8];

      b. als vreemdeling geen rechtmatig verblijf meer heeft in de zin van
      [artikel 8, onderdelen a, c, e van de Vreemdelingenwet 2000][ref9], dan wel, in de in
      [artikel 2.2, eerste lid][ref10], bedoelde gevallen, in de zin van artikel 8, onderdelen g of
      h, van de Vreemdelingenwet 2000, voor zover dit ziet op de [artikelen 14][ref11], [20][ref12] en
      [45 van de Vreemdelingenwet][ref13]; of

      c. overeenkomstig [artikel 20, tweede lid, van de wet][ref14] geen of niet langer aanspraak heeft op een lening.

      3 Bij ministeriële regeling worden regels gesteld over de betaling van de lening.


