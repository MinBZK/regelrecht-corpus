      1 In de aanvraag vermeldt de aanvrager zijn: naam- en adresgegevens, burgerservicenummer en rekeningnummer.

      2 Bij de aanvraag overlegt de aanvrager een door hem ondertekende verklaring waarin hij Onze Minister machtigt het
      bedrag van de maandelijkse termijnen die hij op grond van [artikel 6.9][ref1] of [6.12][ref2] moet terugbetalen,
      automatisch van zijn bankrekening af te schrijven.


