  - number: '6.2'
    text: |-
      1 Aan de inburgeringsplichtige kan, behoudens het bepaalde in [artikel 20, tweede lid, van de wet][ref1] op
      aanvraag een lening van ten hoogste € 10.000 worden verstrekt ten behoeve van de kosten voor:

      a. het volgen van een cursus ten behoeve van de in het persoonlijk plan inburgering en participatie vastgestelde
      leerroute;

      b. het volgen van een taalschakeltraject ten behoeve van de in het persoonlijk plan inburgering en participatie
      vastgestelde leerroute;

      c. het volgen van alfabetiseringsonderwijs, mits de verplichting hiertoe is opgenomen in het persoonlijk plan
      inburgering en participatie; of

      d. het afleggen van het inburgeringsexamen, bedoeld in [artikel 7, eerste lid, van de wet][ref2].

      2 De hoogte van de lening wordt bepaald aan de hand van de hoogte van het overeenkomstig
      [artikel 8, eerste, tweede, derde en vijfde lid, van de Algemene wet inkomensafhankelijke regelingen][ref3]
      te berekenen toetsingsinkomen van de inburgeringsplichtige en diens partner als bedoeld in
      [artikel 3 van die wet][ref4].

      3 De lening ten behoeve van het volgen van een cursus of alfabetiseringsonderwijs wordt slechts verstrekt indien
      de inburgeringsplichtige een cursus of alfabetiseringsonderwijs volgt bij een cursusinstelling die in het bezit
      is van een certificaat als bedoeld in [artikel 28, eerste lid, van de wet][ref5] of een keurmerk als bedoeld in
      [artikel 32, eerste lid, van de wet][ref6].

      4 De lening ten behoeve van het volgen van een taalschakeltraject wordt slechts verstrekt indien deze in het kader
      van de onderwijsroute wordt gevolgd, waarbij sprake moet zijn van een erkend taalschakeltraject als bedoeld in
      [artikel 8, tweede lid, van de wet][ref7].

      5 De lening wordt niet verstrekt, indien de inburgeringsplichtige op grond van
      [artikel 4.1 van het Besluit inburgering][ref8] zoals dat luidde voor het tijdstip van inwerkingtreding van het
      __REF001___________________________________________________________________________________________________________
      _____________________________________________________________________________________ (Stb. 2012, 432) een lening
      is verstrekt en deze nog niet geheel is terugbetaald of kwijtgescholden.

      6 De lening wordt niet verstrekt, indien de inburgeringsplichtige op grond van
      [artikel 4.1 van het Besluit inburgering][ref10] zoals dat luidde voor het tijdstip van inwerkingtreding van het
      Besluit inburgering 2021 een lening is verstrekt en deze nog niet geheel is terugbetaald of kwijtgescholden.

      7 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de toepassing van het eerste tot
      en met vierde lid.


