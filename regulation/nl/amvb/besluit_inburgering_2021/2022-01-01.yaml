    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 17 maart 2021, nr. 2021000492

    Gelet op de artikelen 3, vierde en vijfde lid, 4, tweede lid, 5, vierde en vijfde lid, 6, zevende en achtste lid,
    7, vierde en vijfde lid, 9, tweede lid, 10, 12, tweede lid, onderdeel a en b, 13, vierde lid, 14, vierde lid, 15,
    vijfde en zesde lid, 17, tweede en vierde lid, 20, eerste lid, derde tot en met vijfde lid, 21, eerste en vijfde
    lid, 23, tweede lid, 26, tweede lid, 32, tweede lid, 36, 38, 39, eerste lid, 40, vierde en zevende lid, 41, derde
    lid, 42, vierde lid, van de Wet inburgering 2021, artikel 38, eerste lid, van de Algemene wet inkomensafhankelijke
    regelingen, en artikel 107, negende lid, van de Vreemdelingenwet 2000;

    De Afdeling advisering van de Raad van State gehoord (advies van 2 juni 2021, nr. W12.21.0078/III);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid van 19 augustus 2021, nr. 2021-
    0000133440,

    Hebben goedgevonden en verstaan:
