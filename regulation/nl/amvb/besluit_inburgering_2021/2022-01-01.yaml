        artikel: '10'
  - number: '9.5'
    text: |-
      1 De gegevens, bedoeld in dit artikel, worden verstrekt ten behoeve van het vaststellen, beheren en de
      terugbetaling van de sociale lening.

      2 De Belastingdienst verstrekt de gegevens over het toetsingsinkomen, bedoeld in
      [artikel 8, eerste, tweede, derde en vijfde lid, van de Algemene wet inkomensafhankelijke regelingen][ref1] van de
      aanvrager en diens partner als bedoeld in [artikel 3 van die wet][ref2] aan Onze Minister.

      3 De aangewezen cursusinstelling, bedoeld in [artikel 20 vijfde lid, van de wet][ref3], verstrekt aan Onze
      Minister de volgende gegevens over de inburgeringsplichtige:

      a. contractgegevens en inschrijvingsgegevens;

      b. factuurgegevens.

      4 Het college verstrekt Onze Minister de gegevens, bedoeld in [artikel 9.2, tweede lid, onderdeel a][ref4], mede
      voor het doel, bedoeld in het eerste lid.

      5 Onze Minister van Justitie en Veiligheid verstrekt Onze Minister de gegevens, bedoeld in
      [artikel 9.1, tweede lid][ref5], mede voor het doel, bedoeld in het eerste lid.


