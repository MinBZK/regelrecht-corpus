        bwb_id: BWBR0044770
        artikel: '12'
  - number: '4.5'
    text: |-
      1 Een aanvraag tot verlenging van de voor de inburgeringsplichtige geldende termijn kan niet eerder worden
      ingediend dan zes maanden voor het verstrijken van die termijn. Onze Minister geeft binnen acht weken na ontvangst
      van de aanvraag een beschikking.

      2 In bijzondere gevallen die de inburgeringsplichtige betreffen, kan Onze Minister ambtshalve besluiten tot
      verlenging van de voor de inburgeringsplichtige geldende termijn. De beschikking wordt niet eerder gegeven dan zes
      maanden voor het verstrijken van die termijn.

      3 In bijzondere gevallen die alle inburgeringsplichtigen of categorieën van inburgeringsplichtigen betreffen, kan
      Onze Minister ambtshalve besluiten tot verlenging van de voor de inburgeringsplichtige geldende termijn voor een
      bij ministeriële regeling te bepalen duur.

      4 In de beschikking wordt de duur van de verlenging vermeld.
    url: https://wetten.overheid.nl/BWBR0045555/2022-01-01#Artikel4.5
  - number: '5.1'
    text: |-
      De maatschappelijke begeleiding, bedoeld in [artikel 13, tweede lid, van de wet][ref1], bevat in ieder geval de
      volgende componenten:

      a. praktische hulp bij het regelen van basisvoorzieningen: ondersteuning en begeleiding bij het regelen van
      praktische zaken ten aanzien van voorzieningen zoals wonen, zorg, werk, inkomen, verzekeringen, onderwijs en
      kennismaking met de lokale woonomgeving;

      b. voorlichting over basisvoorzieningen in de Nederlandse samenleving: voorlichting over basisvoorzieningen en
      thema’s zoals wonen, inkomen, werk, zorg, onderwijs, opvoeding en kennismaking met maatschappelijke organisaties.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel13
    url: https://wetten.overheid.nl/BWBR0045555/2022-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '13'
  - number: '5.2'
    text: |-
      1 Het college brengt, in aanvulling op de onderdelen, bedoeld in [artikel 14, derde lid, van de wet][ref1], in het
      kader van de brede intake met betrekking tot de inburgeringsplichtige in ieder geval het volgende in kaart:

      a. het taalniveau;

      b. de mogelijkheden tot arbeidsparticipatie; en

      c. de mate van zelfredzaamheid.

      2 Het college wijst de inburgeringsplichtige op het recht om de gesprekken in het kader van de brede intake enkel
      met hem persoonlijk te voeren, derhalve zonder de aanwezigheid van enig ander persoon, niet zijnde degene die in de
      hoedanigheid van zijn professie bij de gesprekken aanwezig is.

      3 Het college legt de relevante informatie die wordt verkregen in verband met de afname van de brede intake
      schriftelijk vast.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel14
    url: https://wetten.overheid.nl/BWBR0045555/2022-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '14'
  - number: '5.3'
    text: |-
      1 Het college stelt het persoonlijk plan inburgering en participatie vast binnen uiterlijk 10 weken na de dag
      waarop de inburgeringsplichtige in de basisregistratie personen is ingeschreven, met dien verstande dat als
      hij rechtmatig verblijf heeft op grond van een verblijfsvergunning asiel voor bepaalde tijd, het gaat om de
      inschrijving in de gemeente waar hij op grond van [artikel 28 van de Huisvestingswet 2014][ref1] is gehuisvest.

      2 Als de inburgeringsplichtige, voor wie het persoonlijk plan inburgering en participatie is opgesteld, zijn
      woonplaats verplaatst naar een andere gemeente, stelt het college van de andere gemeente het voornoemde plan vast
      binnen uiterlijk 10 weken na de datum van inschrijving van de inburgeringsplichtige in deze gemeente.

      3 Het college legt het aantal te voeren voortgangsgesprekken met de inburgeringsplichtige vast in het persoonlijk
      plan inburgering en participatie.

      4 Inspanningen die een inburgeringsplichtige heeft verricht voorafgaand aan het vaststellen van het persoonlijk
      plan inburgering en participatie, wegen niet mee voor het voldoen aan de inburgeringsplicht, tenzij uitdrukkelijk
      anders is bepaald.

      5 Indien het college de leerroute van de inburgeringsplichtige ingevolge
      [artikel 17, tweede lid, van de wet][ref2], opnieuw vaststelt, of ingevolge artikel 17, derde lid, van
      de wet besluit dat de mondelinge en schriftelijke vaardigheden in de Nederlandse taal, in afwijking van
      [artikel 7, eerste lid, onderdeel a, van de wet][ref3] geheel of gedeeltelijk op het niveau A2 worden
      geëxamineerd, past het college het persoonlijk plan inburgering en participatie conform deze wijziging aan.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0044770#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0044770#Artikel7
