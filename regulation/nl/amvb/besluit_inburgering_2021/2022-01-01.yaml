  - number: '2.7'
    text: |-
      1 In het kader van de aanvraagprocedure tot gehele of gedeeltelijke ontheffing van de inburgeringsplicht
      op grond van een psychische of lichamelijke belemmering dan wel verstandelijke beperking als bedoeld
      in [artikel 5, eerste lid, van de wet][ref1], verzoekt Onze Minister een door hem aangewezen arts, niet
      zijnde de behandelend arts van de inburgeringsplichtige, die is ingeschreven in het register, bedoeld
      in [artikel 3, eerste lid, van de Wet op de beroepen in de individuele gezondheidszorg][ref2], een
      deskundigenverklaring af te geven met betrekking tot de inburgeringsplichtige die de aanvraag tot ontheffing heeft
      ingediend.

      2 De gehele of gedeeltelijke ontheffing van de inburgeringsplicht wordt verleend indien redelijkerwijs verwacht
      mag worden dat de aard en de ernst van de psychische of lichamelijke belemmering dan wel verstandelijke beperking
      zodanig is dat niet binnen vijf jaar na de aanvraag van de ontheffing aan de inburgeringsplicht dan wel aan een of
      meerdere onderdelen daarvan kan worden voldaan.

      3 Een gedeeltelijke ontheffing van de inburgeringsplicht wordt uitsluitend verleend indien vanwege de belemmering
      of beperking niet kan worden voldaan aan:

      a. maximaal drie van de vier examenonderdelen van de mondelinge en schriftelijke vaardigheden of het examen KNM van
      het inburgeringsexamen;

      b. maximaal drie van de vier examenonderdelen van de mondelinge en schriftelijke vaardigheden op ten minste het
      niveau B1 of het examen KNM als bedoeld in [artikel 8, vierde lid, van de wet][ref3] van de onderwijsroute; of

      c. het participatiegedeelte van de zelfredzaamheidsroute, bedoeld in [artikel 3.14, tweede lid, onderdeel b][ref4],
      met uitzondering van de activiteiten van het participatieverklaringstraject en de module Arbeidsmarkt en
      Participatie.

      4 Indien Onze Minister op grond van de deskundigenverklaring, bedoeld in het eerste lid, van oordeel is dat
      de inburgeringsplichtige wel aan een of meerdere onderdelen van het inburgeringsexamen dan wel een of meerdere
      examenonderdelen van de onderwijsroute als bedoeld in het derde lid, kan voldoen onder examenomstandigheden die
      zijn aangepast aan de mogelijkheden van die inburgeringsplichtige, geldt dat:

      a. voor het examen mondelinge en schriftelijke vaardigheden op het niveau A2 en het examen kennis van de
      Nederlandse maatschappij in een beschikking wordt vermeld welke aangepaste examenomstandigheden het betreft; en

      b. voor het examen mondelinge en schriftelijke vaardigheden op ten minste het niveau B1, de deskundigenverklaring,
      bedoeld in het eerste lid, waarin ten aanzien van de inburgeringsplichtige een voorstel wordt gedaan met betrekking
      tot in aanmerking komende aangepaste examenomstandigheden voor het voornoemde examen, aan de inburgeringsplichtige
      wordt verstrekt.

      5 Onze Minister geeft binnen acht weken na ontvangst van de aanvraag een beschikking.

      6 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de verlening van de ontheffing alsmede
      omtrent de deskundigenverklaring, bedoeld in het eerste lid.

      7 Bij ministeriële regeling worden regels gesteld omtrent de omstandigheden waaronder de kosten van de
      deskundigenverklaring, bedoeld in het eerste lid, worden vergoed aan de inburgeringsplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0044770#Artikel8
