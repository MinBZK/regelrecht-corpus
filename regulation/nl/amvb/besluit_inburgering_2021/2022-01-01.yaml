        artikel: '32'
  - number: '8.2'
    text: |-
      1 In het keurmerk worden in ieder geval eisen gesteld omtrent de volgende aspecten van de cursusinstelling:

      a. de bedrijfsvoering, waarbij de eisen zien op:

      1°. de continuïteit van de instelling;

      2°. de integriteit van het bestuur;

      3°. een transparante en deugdelijke financiële administratie;

      b. de onderwijskwaliteit, waarbij de eisen zien op:

      1°. de kwalificaties van de docenten;

      2°. een veilige onderwijsomgeving;

      3°. een aan de docent verleende verklaring omtrent het gedrag, afgegeven volgens de Wet justitiële en
      strafvorderlijke gegevens;

      c. fraudepreventie, waarbij in ieder geval de eis wordt gesteld dat bestuurders van de cursusinstelling beschikken
      over een verklaring omtrent het gedrag, afgegeven volgens de Wet justitiële en strafvorderlijke gegevens.

      2 Ten behoeve van een effectieve controle door de verlener van het keurmerk bevat het keurmerk eisen met betrekking
      tot de medewerking van de cursusinstelling aan controles, waaronder onaangekondigde controles en controles
      gedurende het onderwijs.

      3 De verklaring omtrent het gedrag, bedoeld in het eerste lid, onderdeel b, onder 3, en het eerste lid, onderdeel
      c, is in het bezit van de cursusinstelling, en is niet ouder dan drie maanden op het moment van aanvang van de
      werkzaamheden.

      4 De keurmerkverlener stelt voorwaarden op omtrent de schorsing of intrekking van het keurmerk.

      5 De voorwaarden, bedoeld in het vierde lid, houden in dat het keurmerk wordt geschorst indien:

      a. er aanwijzingen zijn van fraude;

      b. er sprake is van onvoldoende tevredenheid onder de inburgeraars;

      c. de slagingspercentages van de cursusinstelling onvoldoende zijn; of

      d. de cursusinstelling geen medewerking verleent aan een controle door de keurmerkverlener of een door de
      keurmerkverlener aangewezen instantie.

      6 De voorwaarden, bedoeld in het vierde lid, houden in dat het keurmerk wordt ingetrokken indien:

      a. na een door de keurmerkverstrekker vastgestelde periode na de schorsing, bedoeld in het vierde lid, geen sprake
      is van verbetering;

      b. er sprake is van het herhaaldelijk geen medewerking verlenen aan controles door de keurmerkverlener of een door
      de keurmerkverlener aangewezen instantie; of

      c. er sprake is van fraude door de cursusinstelling.

      7 De keurmerkverlener voert jaarlijks effectieve controles uit bij de cursusinstellingen.

      8 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de eisen, bedoeld in het eerste tot en
      met het zevende lid.
    url: https://wetten.overheid.nl/BWBR0045555/2022-01-01#Artikel8.2
  - number: '9.1'
    text: |-
      1 De gegevens, bedoeld in dit artikel, worden verstrekt ten behoeve van het vaststellen, beheren, vrijstellen en de
      ontheffing van de inburgeringsplicht en het daaruit volgende inburgeringstraject.

      2 Onze Minister van Justitie en Veiligheid verstrekt Onze Minister de volgende gegevens:

      a. gegevens over het verblijfsdoel en de wijziging daarvan;

      b. identiteitsgegevens, waaronder het vreemdelingennummer, bedoeld in
      [artikel 107, derde lid, van de Vreemdelingenwet 2000][ref1], en het burgerservicenummer, van de betrokkene, en,
      indien van toepassing, van de referent, bedoeld in [artikel 2a van de Vreemdelingenwet 2000][ref2].

      3 Onze Minister verstrekt het college gegevens over:

      a. de vaststelling van de inburgeringsplicht en de wijziging daarvan;

      b. een gehele vrijstelling of gedeeltelijke vrijstelling van de inburgeringsplicht;

      c. een aanvraag tot gehele of gedeeltelijke ontheffing van de inburgeringsplicht, waaronder de datum van de
      verlening alsmede over aangepaste examenomstandigheden, dan wel de afwijzing van een aanvraag daarvan;

      d. de toekenning van het inburgeringscertificaat.

      4 Onze Minister verstrekt de instelling die belast is met de voorbereiding op de inburgering, bedoeld in
      [artikel 10 van de wet][ref3], de gegevens over de vaststelling van de inburgeringsplicht en de wijziging daarvan,
      en maakt daarbij gebruik van het vreemdelingennummer of het burgerservicenummer.

      5 De aangewezen organisaties die belast zijn met internationale diplomawaardering verstrekken Onze Minister een
      advies over vrijstelling of gedeeltelijke vrijstelling van de inburgeringsplicht.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel2a
      [ref3]: https://wetten.overheid.nl/BWBR0044770#Artikel10
