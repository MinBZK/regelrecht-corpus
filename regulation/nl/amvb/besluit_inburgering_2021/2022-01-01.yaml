  - number: '5.4'
    text: |-
      1 De termijn, bedoeld in [artikel 17, tweede lid, van de wet][ref1], bedraagt maximaal anderhalf jaar vanaf de
      aanvang van de termijn, bedoeld in [artikel 11, eerste lid, van de wet][ref2], met dien verstande dat gedurende
      het gehele inburgeringstraject de onderwijsroute kan worden gewijzigd in de B1-route.

      2 In bijzondere gevallen die de inburgeringsplichtige betreffen, kan het college afwijken van de termijn, bedoeld
      in het eerste lid.

      3 Bij het wijzigen van leerroute geldt dat bij het wijzigen van:

      a. de onderwijsroute of de zelfredzaamheidsroute naar de B1-route:

      i. bij het bepalen van de intensiteit van de leerroute rekening wordt gehouden met de reeds gevolgde
      cursusuren Nederlands als tweede taal en cursusuren kennis van de Nederlandse maatschappij bij een instelling
      als bedoeld in [artikel 8, tweede lid, van de wet][ref3] of met de gevolgde cursusuren, bedoeld in
      [artikel 3.14, tweede lid, onderdeel a][ref4];

      ii. de in de onderwijsroute reeds gedane examenpogingen en behaalde examenonderdelen van de mondelinge en
      schriftelijke vaardigheden in de Nederlandse taal op ten minste het niveau B1 of kennis van de Nederlandse
      maatschappij, gelden als gedane examenpogingen en behaalde examenonderdelen van het inburgeringsexamen.

      b. de B1-route naar de onderwijsroute: de reeds gedane examenpogingen en behaalde examenonderdelen van het
      inburgeringsexamen gelden als gedane examenpogingen en behaalde examenonderdelen van de mondelinge en schriftelijke
      vaardigheden in de Nederlandse taal op ten minste het niveau B1 of kennis van de Nederlandse maatschappij als
      bedoeld in [artikel 8, vierde lid, van de wet][ref5].

      c. de B1-route of de onderwijsroute naar de zelfredzaamheidsroute: de reeds gevolgde cursusuren Nederlands
      als tweede taal en cursusuren kennis van de Nederlandse maatschappij bij een cursusinstelling die
      voldoet aan het bepaalde op grond van [artikel 32 van de wet][ref6] of bij een instelling als bedoeld
      in [artikel 8, tweede lid, van de wet][ref7], in mindering worden gebracht op de urennorm, bedoeld in
      [artikel 3.14, tweede lid, onderdeel a][ref8].


