  - number: '6.5'
    text: Onze Minister geeft binnen acht weken na ontvangst van de aanvraag een beschikking.
    url: https://wetten.overheid.nl/BWBR0045555/2022-01-01#Artikel6.5
  - number: '6.6'
    text: |-
      1 Onze Minister stelt jaarlijks voor 31 december ten behoeve van het daaropvolgende jaar een rentepercentage vast
      dat gelijk is aan het gemiddeld effectief rendement over de maand oktober van dat jaar van de openbare lening,
      uitgegeven door de Staat der Nederlanden en toegelaten tot de notering aan de officiële markt ter beurze van
      Amsterdam, met een resterende looptijd van drie tot vijf jaren.

      2 Bij ministeriële regeling worden nadere regels gesteld omtrent de wijze waarop de rente wordt berekend over de
      aangegane lening.
    url: https://wetten.overheid.nl/BWBR0045555/2022-01-01#Artikel6.6
  - number: '6.7'
    text: |-
      1 De terugbetalingsperiode beslaat ten hoogste tien jaren.

      2 De terugbetalingsperiode vangt aan op de eerste dag van de maand volgend op het in
      [artikel 21, derde lid, onderdeel a of b, van de wet][ref1] bedoelde tijdstip. De terugbetalingsperiode kan op
      schriftelijk verzoek van de debiteur aanvangen op een eerder tijdstip, in welk geval de aanspraak op de lening
      vervalt.

      3 Gedurende de in [artikel 21, derde lid, aanhef, van de wet][ref2] bedoelde aanloopfase van zes maanden bestaat
      geen verplichting tot terugbetaling, doch is wel rente verschuldigd over het bedrag van de lening.

      4 In afwijking van het tweede lid, vangt de terugbetalingsperiode voor een persoon als bedoeld in
      [artikel 6.1][ref3] aan zes maanden nadat drie jaar zijn verstreken sedert de verstrekking van de lening of,
      indien dat eerder is, zes maanden nadat het inburgeringsexamen is behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel21
