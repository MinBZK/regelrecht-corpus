      1 Ter bepaling van de draagkracht van de debiteur wordt het toetsingsinkomen van de debiteur en dat van zijn
      partner als bedoeld in [artikel 3 van de Algemene wet inkomensafhankelijke regelingen][ref1] in aanmerking
