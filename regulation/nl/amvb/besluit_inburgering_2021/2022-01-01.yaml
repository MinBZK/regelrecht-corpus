      1 De bestuurlijke boete, bedoeld in [artikel 24 van de wet][ref1], bedraagt € 340.

      2 De bestuurlijke boete, bedoeld in [artikel 25 van de wet][ref2], wordt vastgesteld op basis van het
      aantal geregistreerde uren dat de inburgeringsplichtige heeft besteed aan de leerroute, het aantal afgelegde
      examenpogingen en het aantal behaalde examens.

      3 De stelplicht en bewijslast van feiten en omstandigheden die aanleiding kunnen geven voor verlaging van de
