      - id: ref2
        bwb_id: BWBR0020611
      - id: ref3
        bwb_id: BWBR0044770
  - number: '12.2'
    text: |-
      1 Indien het bij koninklijke boodschap van 3 juni 2020 ingediende voorstel van wet houdende regels over inburgering
      in de Nederlandse samenleving ([Wet inburgering 2021][ref1]) (Kamerstukken ) tot wet is of wordt verheven en die
      wet in werking treedt, treedt dit besluit op hetzelfde tijdstip in werking.

      2 In afwijking van het eerste lid, treedt [artikel 8.1, derde lid][ref2], van dit besluit, in werking met ingang
      van 1 januari van het eerste kalenderjaar na inwerkingtreding van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0044770
      [ref2]: https://wetten.overheid.nl/BWBR0045555#Artikel8.1
    url: https://wetten.overheid.nl/BWBR0045555/2022-01-01#Artikel12.2
