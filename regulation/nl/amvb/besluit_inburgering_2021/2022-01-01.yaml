    text: |-
      1 De bestuurlijke boete, bedoeld in [artikel 22 van de wet][ref1], bedraagt € 250.

      2 De bestuurlijke boete, bedoeld in [artikel 23 van de wet][ref2], bedraagt € 50.

      3 De boete, bedoeld in het tweede lid, wordt steeds met 100 procent van het boetebedrag verhoogd tot een
      bedrag van ten hoogste € 800, indien binnen een tijdvak van twaalf maanden voorafgaand aan de dag van
      constatering van de overtreding een eerdere overtreding, bestaande uit het niet naleven van het bepaalde
      in [artikel 23 van de wet][ref3] is geconstateerd, en de bestuurlijke boete wegens de eerdere overtreding
      onherroepelijk is geworden.

      4 Bij het opleggen van de boete, bedoeld in het tweede lid, worden de volgende uitgangspunten in acht genomen:

      a. indien er sprake is van opzet, wordt de bestuurlijke boete vastgesteld op 100 procent;

      b. indien er sprake is van grove schuld, wordt de boete vastgesteld op 75 procent;

      c. indien er geen sprake is van opzet of grove schuld wordt de bestuurlijke boete vastgesteld op 50 procent;

      d. indien er sprake is van verminderde verwijtbaarheid wordt de bestuurlijke boete vastgesteld op 25 procent.

      5 Het totaal aan opgelegde boetes, bedoeld in het eerste en tweede lid, beloopt gedurende de termijn, genoemd
      in [artikel 11, eerste lid, van de wet][ref4], of de op grond van [artikel 12 van de wet][ref5] verlengde
      termijn, ten hoogste € 2.400 en beloopt gedurende de op grond van de [artikelen 24, tweede en derde lid][ref6], en
      [25, tweede lid, van de wet][ref7] vastgestelde nieuwe termijn ten hoogste:

      a. € 400 bij een nieuwe termijn van zes maanden;

      b. € 800 bij een nieuwe termijn van een jaar;

      c. € 1.200 bij een nieuwe termijn van anderhalf jaar;

      d. € 1.600 bij een nieuwe termijn van twee jaar.

      6 De stelplicht en bewijslast van feiten en omstandigheden die aanleiding kunnen geven voor verlaging van
      de bestuurlijke boete, bedoeld in het eerste lid, rust op betrokkene. Indien het college op de hoogte is van
      bijzondere omstandigheden, wordt bij het opleggen van de bestuurlijke boete daarmee rekening gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0044770#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0044770#Artikel23
