  - number: '2.8'
    text: |-
      1 Gehele ontheffing van de inburgeringsplicht vanwege bijzondere individuele omstandigheden, bedoeld in
      [artikel 5, tweede lid, van de wet][ref1], wordt slechts verleend in zeer uitzonderlijke, onvoorziene
      omstandigheden, die niet aan de inburgeringsplichtige te wijten zijn en waarbij het vasthouden aan de
      inburgeringsplicht voor de inburgeringsplichtige tot een zeer schrijnende situatie leidt.

      2 Bij de aanvraag tot gehele ontheffing van de inburgeringsplicht legt de inburgeringsplichtige een advies van het
      college over.

      3 Onze Minister geeft binnen acht weken na ontvangst van de aanvraag een beschikking.

      4 Onze Minister kan ambtshalve besluiten tot het verlenen van de ontheffing. Indien van toepassing adviseert het
      college Onze Minister inzake dit besluit.

      5 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de aanvraag en het verlenen van de
      ontheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel5
    url: https://wetten.overheid.nl/BWBR0045555/2022-01-01#Artikel2.8
