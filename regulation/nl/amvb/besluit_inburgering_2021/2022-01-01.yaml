        artikel: '29'
  - number: '10.2'
    text: |-
      1 Voor de bepaling van de definitieve uitkering, wordt het deel van de uitkering voor gezinsmigranten en overige
      migranten, bedoeld in [artikel 10.1, eerste en tweede lid][ref1], berekend aan de hand van de volgende formule:

      BGO = AGO (cohort t) * a

      Waarbij:

      a. AGO staat voor het aantal gezinsmigranten en overige migranten in de gemeente;

      b. Cohort het jaar aangeeft waarin de gezinsmigranten en overige migranten in een Nederlandse gemeente zijn
      gehuisvest; en

      c. a staat voor het bedrag aan uitkering per gezinsmigrant of overige migrant in jaar t.

      2 Voor de bepaling van de definitieve uitkering, wordt het totaal beschikbare landelijke budget in jaar t voor
      asielstatushouders, bedoeld in [artikel 10.1, derde lid, onderdeel c][ref2], berekend aan de hand van de volgende
      formule:










                    TBA =



                    LAA (cohort jaar t)


                    * [a]





                    +


                    LAA (cohort jaar t-1)


                    * [b]





                    +


                    LAA (cohort jaar t-2)


                    * [c]






      Waarbij:

      a. LAA staat voor het landelijk aantal asielstatushouders van het betreffende cohort;

      b. Cohort staat voor het jaar waarin de asielstatushouders in een Nederlandse gemeente zijn gehuisvest; en

      c. [a t/m c] staat voor de bedragen per asielstatushouder per variabele in de formule.

      3 Voor de bepaling van de definitieve uitkering, wordt de gemeentelijke grondslag, bedoeld in
      [artikel 10.1, vierde lid][ref3], berekend aan de hand van de volgende formule:










                    GG =



                    AA (cohort jaar t)


                    * [a]





                    +


                    AA (cohort jaar t-1)


                    * [b]





                    +


                    AA (cohort jaar t-2)


                    * [c]





                    +


                    AIA (jaar t-2)


                    * [d]






      Waarbij:

      a. AA staat voor het aantal asielstatushouders van het betreffende cohort in de gemeente;

      b. Cohort staat voor het jaar waarin de asielstatushouders in een Nederlandse gemeente zijn gehuisvest;

      c. AIA staat voor het aantal met een inburgeringsdiploma of inburgeringscertificaat afgeronde inburgeringstrajecten
      van asielstatushouders in het betreffende jaar t-2 in de gemeente; en

      d. [a t/m d] staat voor de gewichten die toegekend worden aan de afzonderlijke variabelen in de formule.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel10.1
      [ref2]: https://wetten.overheid.nl/BWBR0045555#Artikel10.1
      [ref3]: https://wetten.overheid.nl/BWBR0045555#Artikel10.1
