  - number: '3.3'
    text: |-
      Het inburgeringsexamen bestaat wat betreft de examinering van de mondelinge en schriftelijke vaardigheden in de
      Nederlandse taal, uit de volgende examenonderdelen:

      a. leesvaardigheid;

      b. luistervaardigheid;

      c. schrijfvaardigheid; en

      d. spreekvaardigheid.
    url: https://wetten.overheid.nl/BWBR0045555/2022-01-01#Artikel3.3
  - number: '3.4'
    text: |-
      1 Het inburgeringsexamen bestaat wat betreft de examinering van de kennis van de Nederlandse maatschappij, uit de
      volgende onderwerpen:

      a. werk en inkomen;

      b. omgangsvormen, waarden en normen;

      c. wonen;

      d. gezondheid en gezondheidszorg;

      e. geschiedenis en geografie;

      f. instanties;

      g. staatsinrichting en rechtsstaat; en

      h. onderwijs en opvoeding.

      2 Bij ministeriële regeling worden de onderwerpen, genoemd in het eerste lid, nader uitgewerkt in te behalen
      eindtermen.
    url: https://wetten.overheid.nl/BWBR0045555/2022-01-01#Artikel3.4
  - number: '3.5'
    text: |-
      1 Het examen van mondelinge en schriftelijke vaardigheden in de Nederlandse taal op ten minste het niveau B1,
      bedoeld in [artikel 7, eerste lid, onderdeel a, van de wet][ref1], vindt plaats overeenkomstig de regels van het
      [Staatsexamenbesluit Nederlands als tweede taal][ref2].

      2 Onze Minister stelt de volgende examens vast:

      a. het examen kennis van de Nederlandse maatschappij, bedoeld in
      [artikel 7, eerste lid, onderdeel b, van de wet][ref3];

      b. het examen van mondelinge en schriftelijke vaardigheden in de Nederlandse taal op het niveau A2 van het
      Gemeenschappelijk Europees Referentiekader voor Moderne Vreemde Talen.

      3 De examens, bedoeld in het tweede lid, worden afgenomen door Onze Minister.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de toepassing van het tweede en derde lid,
      onder meer omtrent de wijze van examineren en de beoordeling van de examens.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006192
      [ref3]: https://wetten.overheid.nl/BWBR0044770#Artikel7
