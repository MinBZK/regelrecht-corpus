        artikel: '3.5'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
  - number: '3.12'
    text: |-
      Bij ministeriële regeling worden regels gesteld over de procedure tot een aanvraag van een gedeeltelijke
      vrijstelling van het inburgeringsexamen als bedoeld in [artikel 7, derde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel7
    url: https://wetten.overheid.nl/BWBR0045555/2022-01-01#Artikel3.12
