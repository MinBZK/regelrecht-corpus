    text: |-
      De instanties, bedoeld in [artikel 39, eerste lid, van de wet][ref1], die aan Onze Minister gegevens en
      inlichtingen verstrekken ten behoeve van statistiek, monitoring en evaluatie, betreffen:

      a. het CBS, bedoeld in
      [artikel 1, aanhef en onderdeel b, van de Wet op het centraal bureau voor de statistiek][ref2];

      b. de instelling die is belast met de voorinburgering, bedoeld in [artikel 10 van de wet][ref3];

      c. Onze Minister van Justitie en Veiligheid;

      d. de door Onze Minister aangewezen organisaties die belast zijn met internationale diplomawaardering.


