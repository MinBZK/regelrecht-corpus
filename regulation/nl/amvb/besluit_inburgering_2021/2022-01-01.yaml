    text: |-
      1 De gegevens, bedoeld in dit artikel, worden verstrekt ten behoeve van de handhaving.

      2 De gegevens die door de instantie, bedoeld in [artikel 14, vijfde lid, van de wet][ref1], aan het college worden
      verstrekt, worden mede gebruikt voor het doel, bedoeld in het eerste lid.

      3 De gegevens, bedoeld in [artikel 9.2, vierde lid][ref2], die de cursusinstelling verstrekt aan het college,
      worden mede gebruikt voor het doel, bedoeld in het eerste lid.

      4 Het college verstrekt Onze Minister de gegevens, bedoeld in [artikel 9.2, tweede lid, onderdeel b][ref3], mede
      voor het doel, bedoeld in het eerste lid, en verstrekt, op verzoek, gegevens over opgelegde boetes.

      5 Onze Minister verstrekt het college gegevens over opgelegde boetes.

      6 Cursusinstellingen verstrekken Onze Minister de inschrijvingsgegevens van de inburgeringsplichtige, en van
      gezinsmigranten en overige migranten gegevens over de voortgang van de leerroute, de aanwezigheid en geleverde
      inspanningen.

      7 Het College voor toetsen en examens, genoemd in [artikel 2 van de Wet College voor toetsen en examens][ref4],
      verstrekt Onze Minister gegevens over de examendeelname en examenresultaten staatsexamen Nederlands als tweede
      taal.


