      - id: ref1
        bwb_id: BWBR0044770
        artikel: '7'
  - number: '3.13'
    text: |-
      De advisering met betrekking tot voor onderdelen van het inburgeringsexamen vrijstellende buitenlandse diploma’s,
      certificaten of andere documenten, wordt uitgevoerd door een of meer bij ministeriële regeling aangewezen
      organisaties.
    url: https://wetten.overheid.nl/BWBR0045555/2022-01-01#Artikel3.13
  - number: '3.14'
    text: |-
      1 Het college biedt de inburgeringsplichtige de onderdelen van de zelfredzaamheidsroute aan, waarbij de invulling
      van deze onderdelen wordt afgestemd op het vermogen en de ontwikkelbehoeften van de inburgeringsplichtige.

      2 De zelfredzaamheidsroute bestaat voor asielstatushouders uit de volgende onderdelen:

      a. in totaal 800 cursusuren gevolgd bij een cursusinstelling die voldoet aan het bepaalde op grond van
      [artikel 32 van de wet][ref1], bestaande uit:

      i. cursusuren Nederlands als tweede taal, waarvan alfabetiseringsonderwijs onderdeel kan zijn, onder persoonlijke
      begeleiding van een NT2-docent; en

      ii. cursusuren kennis van de Nederlandse maatschappij.

      b. in totaal 800 uren besteed aan activiteiten gericht op zelfredzaamheid, activering en participatie in de
      Nederlandse maatschappij, waarbij de activiteiten:

      i. plaatsvinden in een Nederlandstalige omgeving; en

      ii. niet in isolement plaatsvinden; en

      c. een eindgesprek met het college.

      3 Het tweede lid, onderdeel a en c, zijn van toepassing op gezinsmigranten en overige migranten.

      4 Het college verleent geen mandaat of machtiging aan een derde, met uitzondering van een openbaar lichaam als
      bedoeld in [artikel 8 van de Wet gemeenschappelijke regelingen][ref2], met betrekking tot de taak, bedoeld in het
      tweede lid, onderdeel c.

      5 De uren gemoeid met de module Arbeidsmarkt en Participatie en het participatieverklaringstraject worden in
      mindering gebracht op de urennorm, bedoeld in het tweede lid, onderdeel b.

      6 Indien in het kader van de brede intake door de inburgeringsplichtige cursusuren Nederlands als tweede taal of
      kennis van de Nederlandse maatschappij zijn gevolgd of activiteiten zijn verricht, of gedurende de brede intake
      activiteiten zijn verricht in het kader van de [Participatiewet][ref3], of in het kader van de maatschappelijke
      begeleiding, bedoeld in [artikel 13 van de wet][ref4], activiteiten zijn verricht, die voldoen aan het gestelde
      in dit artikel, kunnen de hiermee gemoeide uren, in afwijking van [artikel 5.3, vierde lid][ref5], in mindering
      worden gebracht op de urennorm, die geldt op grond van het tweede of achtste lid.

      7 Indien de inburgeringsplichtige een of meerdere van de examenonderdelen, genoemd in
      [artikel 3.3, aanhef en onderdeel a tot en met d][ref6], wenst af te leggen op het niveau A2 en het college de
      inburgeringsplichtige daartoe in staat acht, legt het college dit vast in het persoonlijk plan inburgering en
      participatie.

      8 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de onderdelen, bedoeld in het
      tweede lid, waarbij voor inburgeringsplichtigen met een auditieve of visuele beperking onder nader vast te stellen
      voorwaarden, een lagere urennorm kan worden vastgesteld dan de norm, bedoeld in het tweede lid, onderdeel a, of
      voor deze groep kan worden vastgesteld dat voor bepaalde vaardigheden van een cursus Nederlands als tweede taal,
      geen cursusuren hoeven te worden gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0015703
      [ref4]: https://wetten.overheid.nl/BWBR0044770#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0045555#Artikel5.3
      [ref6]: https://wetten.overheid.nl/BWBR0045555#Artikel3.3
