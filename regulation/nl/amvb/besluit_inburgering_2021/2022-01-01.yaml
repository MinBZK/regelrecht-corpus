        bwb_id: BWBR0044770
        artikel: '25'
  - number: '4.2'
    text: |-
      De termijn wordt verlengd met de duur van de periode, bedoeld in [artikel 2.1, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0045555/2022-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0045555
        artikel: '2.1'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '4.3'
    text: |-
      1 De inburgeringsplichtige treft geen verwijt ter zake van het niet tijdig voldoen aan de inburgeringsplicht,
      indien hij aannemelijk maakt dat zich gedurende de periode van de termijn een omstandigheid heeft voorgedaan
      waardoor hij niet in staat is geweest deel te nemen aan activiteiten die erop zijn gericht te voldoen aan de
      inburgeringsplicht en dit hem in alle redelijkheid niet te verwijten valt.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de duur van de verlenging en de
      toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0045555/2022-01-01#Artikel4.3
  - number: '4.4'
    text: |-
      1 Onze Minister verlengt de termijn genoemd in [artikel 11, eerste lid, van de wet][ref1], in het geval van
      [artikel 12, eerste lid, onderdeel b, van de wet][ref2], met zes maanden.

      2 Van aanzienlijke inspanningen als bedoeld in [artikel 12, eerste lid, onderdeel b, van de wet][ref3] is sprake
      indien de inburgeringsplichtige:

      a. de B1-route volgt en de spreekvaardigheid, luistervaardigheid, leesvaardigheid en schrijfvaardigheid worden
      geëxamineerd op het niveau dat is vastgelegd in het persoonlijk plan inburgering en participatie, maar ten minste
      op het niveau A2;

      b. alle taallessen en cursusuren kennis van de Nederlandse maatschappij heeft gevolgd, met uitzondering van
      afwezigheid vanwege geoorloofd verzuim;

      c. minimaal twee van de vier examenonderdelen als bedoeld in onderdeel a, van het inburgeringsexamen heeft behaald,
      alsmede het onderdeel kennis van de Nederlandse maatschappij; en

      d. het participatieverklaringstraject en de module Arbeidsmarkt en Participatie heeft afgerond.

      3 Voor gezinsmigranten en overige migranten geldt in afwijking van het tweede lid, onderdeel b, dat zij ten minste
      450 uren aan taallessen of cursusuren kennis van de Nederlandse maatschappij hebben gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0044770#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0044770#Artikel12
    url: https://wetten.overheid.nl/BWBR0045555/2022-01-01#Artikel4.4
    references:
