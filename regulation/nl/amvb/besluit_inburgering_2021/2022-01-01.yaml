  - number: '9.3'
    text: |-
      1 De gegevens, bedoeld in dit artikel, worden verstrekt ten behoeve van de vaststelling en verlenging van de
      inburgeringstermijn.

      2 Het college verstrekt Onze Minister de gegevens over:

      a. de datum van vaststelling van het persoonlijk plan inburgering en participatie, bedoeld in
      [artikel 15, derde lid, van de wet][ref1];

      b. het uitblijven van het inburgeringsaanbod, bedoeld in [artikel 16, eerste lid, van de wet][ref2], met het oog
      op de verlenging, bedoeld in [artikel 4.3][ref3].

      3 Onze Minister verstrekt het college de gegevens over:

      a. de aanvang en het einde van de termijn waarbinnen de inburgeringsplichtige aan de onderdelen van de
      inburgeringsplicht dient te voldoen;

      b. gegevens over de indiening van een verzoek tot verlenging van de termijn, de beoordeling van dat verzoek, de
      datum van verlenging en de einddatum van de nieuwe termijn.


