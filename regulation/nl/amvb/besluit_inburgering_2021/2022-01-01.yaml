  - number: '3.2'
    text: |-
      1 De inburgeringsplichtige neemt in het kader van de module Arbeidsmarkt en Participatie deel aan activiteiten die
      erop zijn gericht zijn kennis en vaardigheden te vergroten over de volgende thema’s:

      a. beroepenoriëntatie;

      b. werknemerscompetenties;

      c. realistisch beroepsbeeld;

      d. beroepskansen;

      e. beroepscompetenties verwerven;

      f. netwerk opbouwen;

      g. werk vinden; en

      h. werkcultuur.

      2 De module Arbeidsmarkt en Participatie wordt afgesloten met een eindgesprek tussen de inburgeringsplichtige en
      het college.

      3 Indien in het kader van de brede intake door de inburgeringsplichtige activiteiten zijn verricht die voldoen
      aan het gestelde in dit artikel, kunnen deze bestede uren, in afwijking van [artikel 5.3, vierde lid][ref1], in
      mindering worden gebracht op de voor de module Arbeidsmarkt en Participatie geldende urennorm.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de onderdelen, bedoeld in het
      eerste en tweede lid, waaronder een urennorm.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel5.3
    url: https://wetten.overheid.nl/BWBR0045555/2022-01-01#Artikel3.2
