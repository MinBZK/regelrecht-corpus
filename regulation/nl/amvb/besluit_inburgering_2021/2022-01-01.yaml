  - number: '12.1'
    text: |-
      Het [Besluit inburgering][ref1] wordt ingetrokken, met dien verstande dat zij van toepassing blijft op degene op
      wie de [Wet inburgering][ref2] van toepassing was op de dag voorafgaand aan de inwerkingtreding van de [wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020674
      [ref2]: https://wetten.overheid.nl/BWBR0020611
      [ref3]: https://wetten.overheid.nl/BWBR0044770
    url: https://wetten.overheid.nl/BWBR0045555/2022-01-01#Artikel12.1
    references:
      - id: ref1
