  - number: '9.4'
    text: |-
      1 De gegevens, bedoeld in dit artikel, worden verstrekt ten behoeve van de taken van het college op grond van de
      [wet][ref1].

      2 Onze Minister verstrekt gegevens over de vaststelling van het recht op maatschappelijke begeleiding aan het
      college.

      3 De instelling die is belast met de voorinburgering, bedoeld in [artikel 10 van de wet][ref2], verstrekt het
      college de volgende gegevens over de inburgeringsplichtige:

      a. identiteitsgegevens, waaronder het burgerservicenummer;

      b. gegevens over diens gezinssamenstelling; en

      c. gegevens die de instantie heeft verkregen in het kader van de deelname aan de voorinburgering, waaronder
      gegevens over de voortgang van de deelname en de taalvaardigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0044770
      [ref2]: https://wetten.overheid.nl/BWBR0044770#Artikel10
    url: https://wetten.overheid.nl/BWBR0045555/2022-01-01#Artikel9.4
