  - number: '2.1'
    text: |-
      1 De inburgeringsplicht eindigt niet, indien de vreemdeling direct aansluitend op de periode waarin hij
      op grond van [artikel 3, eerste lid, van de wet][ref1] inburgeringsplichtig was of op de termijn, bedoeld
      in [artikel 3.82, eerste lid, van het Vreemdelingenbesluit 2000][ref2], rechtmatig verblijf in de zin van
      [artikel 8, onderdeel g of h, van de Vreemdelingenwet 2000][ref3] heeft verkregen.

      2 De inburgeringsplicht wordt geacht niet te zijn geëindigd, indien de vreemdeling tussen twee tijdvakken waarin
      hij op grond van [artikel 3, eerste lid, van de wet][ref4] inburgeringsplichtig was, gedurende een tijdvak van
      maximaal een jaar:

      a. geen ingezetene in de zin van de [Wet basisregistratie personen][ref5] was;

      b. in Nederland verbleef voor een tijdelijk doel; of

      c. zijn werkzaamheden als geestelijke bedienaar, bedoeld in [artikel 3, eerste lid, onderdeel b, van de wet][ref6]
      heeft onderbroken.


