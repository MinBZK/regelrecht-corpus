  - number: '10.3'
    text: |-
      1 Bij een wijziging van de gemeentelijke indeling wordt voor de bepaling van de voorlopige uitkering, bedoeld in
      [artikel 10.1][ref1], uitgegaan van een redelijke inschatting van de situatie zoals die zou zijn geweest als de
      instelling, splitsing of opheffing van gemeenten in de van belang zijnde jaren al was ingegaan.

      2 Bij ministeriële regeling wordt het te verwachten percentage asielstatushouders in de landelijke
      huisvestingstaakstelling, bedoeld in [artikel 10.1, vijfde lid, onderdeel b][ref2], en het te verwachten
      percentage asielstatushouders in de gemeentelijke huisvestingstaakstelling, bedoeld in artikel 10.1, vierde lid,
      onderdeel b, vastgesteld.

      3 Bij ministeriële regeling wordt het bedrag per gezinsmigrant of overige migrant, bedoeld in de
      [artikelen 10.1, tweede lid, onderdeel c][ref3], en [10.2, eerste lid, onderdeel c][ref4], en worden de bedragen
      per asielstatushouder per variabele a tot en met c, bedoeld in de artikelen 10.1, vijfde lid, onderdeel e en 10.2,
      tweede lid, onderdeel c, vastgesteld.

      4 Bij ministeriële regeling worden de gewichten a tot en met d, bedoeld in
      [artikel 10.1, vierde lid, onderdeel f][ref5], en [10.2, derde lid, onderdeel d][ref6], vastgesteld.

      5 Bij de berekening van de voorlopige uitkering, bedoeld in [artikel 10.1][ref7], en de definitieve uitkering,
      bedoeld in [artikel 10.2][ref8], zal in het eerste jaar nadat bij ministeriële regeling aan het aantal met
      een inburgeringsdiploma of inburgeringscertificaat afgeronde inburgeringstrajecten in jaar t-2, bedoeld in
      artikelen 10.1, vierde lid, onderdeel e en 10.2, derde lid, onderdeel c, een gewicht wordt toegekend dat groter
      is dan 0, alle vanaf de inwerkingtreding van de [wet][ref9] aangevangen en inmiddels met een inburgeringsdiploma
      of inburgeringscertificaat afgeronde inburgeringstrajecten van asielstatushouders tot en met jaar t-2 worden
      meegeteld.

      6 Voor de berekening van de voorlopige uitkering, bedoeld in [artikel 10.1][ref10], en de definitieve uitkering,
      bedoeld in [artikel 10.2][ref11], worden onder asielstatushouders en gezinsmigranten en overige migranten, mede
      verstaan de personen die in het jaar waarin ze in een Nederlandse gemeente waren gehuisvest onder de definitie
      vielen van een asielstatushouder of gezinsmigrant of overige migrant, maar die op een peilmoment, bedoeld in
      [artikel 10.4][ref12], op basis waarvan de uitkering wordt bepaald, reeds aan hun inburgeringsplicht hebben
      voldaan.


