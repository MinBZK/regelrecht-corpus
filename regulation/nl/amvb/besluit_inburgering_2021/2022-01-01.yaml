    text: |-
      1 Het doel van het verblijf in Nederland van de houder van een verblijfsvergunning voor bepaalde
      tijd als bedoeld in [artikel 14 van de Vreemdelingenwet 2000][ref1] is tijdelijk in de zin van
      [artikel 3, eerste lid, onderdeel a, van de wet][ref2], indien die verblijfsvergunning is verleend onder een
      beperking verband houdend met:

      a. verblijf als familie- of gezinslid bij een persoon die voor een tijdelijk doel in Nederland verblijft;

      b. verblijf als vermogende vreemdeling;

      c. arbeid als zelfstandige;

      d. arbeid als kennismigrant;

      e. verblijf als houder van de Europese blauwe kaart in de zin van [richtlijn 2009/50/EG](32009L0050) van de Raad
      van 25 mei 2009 betreffende de voorwaarden voor toegang en verblijf van onderdanen van derde landen met het oog op
      een hooggekwalificeerde baan (PbEU 2009, L 155);

      f. seizoenarbeid;

      g. overplaatsing binnen een onderneming;

      h. arbeid in loondienst;

      i. grensoverschrijdende dienstverlening;

      j. onderzoek in de zin van [Richtlijn (EU) 2016/801](32016L0801) van het Europees Parlement en de Raad van 11 mei
      2016 betreffende de voorwaarden voor toegang en verblijf van derdelanders met het oog op onderzoek, studie, stages,
      vrijwilligerswerk, scholierenuitwisseling, educatieve projecten of au-pairactiviteiten (PbEU 2016, L132);

      k. lerend werken;

      l. arbeid als niet-geprivilegieerd militair of niet-geprivilegieerd burgerpersoneel;

      m. studie;

      n. het zoeken en verrichten van arbeid al dan niet in loondienst;

      o. uitwisseling, al dan niet in het kader van een verdrag;

      p. medische behandeling;

      q. tijdelijke humanitaire gronden;

      r. het afwachten van een verzoek op grond van [artikel 17 van de Rijkswet op het Nederlanderschap][ref3].

      2 Het doel van het verblijf van een houder van een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 14 van de Vreemdelingenwet 2000][ref4], verleend onder een andere beperking dan bedoeld in het eerste
      lid, is tijdelijk in de zin van [artikel 3, eerste lid, onderdeel a, van de wet][ref5], indien zulks met
      toepassing van [artikel 3.5, vierde lid, van het Vreemdelingenbesluit 2000][ref6] is bepaald.

      3 Het doel van het verblijf van de houder van een verblijfsvergunning als bedoeld in
      [artikel 8, onderdeel c, van de Vreemdelingenwet 2000][ref7] is niet tijdelijk in de zin van
      [artikel 3, eerste lid, onderdeel a, van de wet][ref8].


