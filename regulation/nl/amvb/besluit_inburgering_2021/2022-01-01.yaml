  - number: '3.10'
    text: |-
      1 Indien een kandidaat zich ten aanzien van een onderdeel van de examens, bedoeld in
      [artikel 3.5, tweede lid][ref1], aan enige onregelmatigheid schuldig maakt of heeft gemaakt, kan Onze Minister
      het betreffende examen ongeldig verklaren en bepalen dat de kandidaat het examen of een onderdeel daarvan opnieuw
      moet afleggen.

      2 Indien de onregelmatigheid eerst na afloop van het examen wordt ontdekt, kan Onze Minister het examenresultaat
      ongeldig verklaren.

      3 Indien de onregelmatigheid eerst na het verstrekken van het inburgeringsdiploma wordt ontdekt, kan het
      examenresultaat van het betreffende examen ongeldig worden verklaard en kan Onze Minister het inburgeringsdiploma
      intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel3.5
