  - number: '10.5'
    text: |-
      Indien in een kalenderjaar de uitkering, bedoeld in [artikel 40, eerste lid, van de wet][ref1], niet volledig
      is besteed aan inburgeringsvoorzieningen, kan het college het niet bestede bedrag tot maximaal 100% van de voor
      dat jaar toegekende uitkering reserveren voor besteding aan inburgeringsvoorzieningen in het daaropvolgende
      kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel40
    url: https://wetten.overheid.nl/BWBR0045555/2022-01-01#Artikel10.5
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '40'
  - number: '10.6'
    text: |-
      Indien in een kalenderjaar de netto lasten van gemeenten ten behoeve van inburgeringsvoorzieningen, de uitkering,
      bedoeld in [artikel 40, eerste lid, van de wet][ref1] overstijgt, dan worden de lasten administratief door Onze
      Minister toegerekend aan het volgende kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel40
    url: https://wetten.overheid.nl/BWBR0045555/2022-01-01#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '40'
  - number: '10.7'
    text: |-
      1 Voor de terugvordering, bedoeld in [artikel 42, tweede lid, van de wet][ref1], wordt uitgegaan van de gegevens
      waarvan Onze Minister kennis heeft op 30 september van het jaar volgend op het verantwoordingsjaar, met dien
      verstande dat gegevens die het college op verzoek van Onze Minister op een latere datum verstrekt mede in
      aanmerking worden genomen.

      2 Indien [artikel 18 van de wet][ref2] van toepassing is, kan voor de terugvordering, bedoeld in
      [artikel 42, tweede lid, van de wet][ref3], de informatie in aanmerking worden genomen die het
      openbaar lichaam heeft verantwoord over het jaar waarop de terugvordering betrekking heeft. De
      eerste zin is slechts van toepassing indien de bedoelde informatie is vastgesteld overeenkomstig
      [artikel 34a van de Wet gemeenschappelijke regelingen][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel42
