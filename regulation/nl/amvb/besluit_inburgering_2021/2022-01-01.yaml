  - number: '8.1'
    text: |-
      1 De door Onze Minister aan te wijzen instelling die een keurmerk als bedoeld in [artikel 32 van de wet][ref1]
      verleent, betreft een instelling die voldoet aan de volgende voorwaarden:

      a. zij heeft rechtspersoonlijkheid;

      b. zij is onafhankelijk van door haar te beoordelen personen of instellingen, en zij, haar leidinggevenden en haar
      medewerkers voeren geen activiteiten uit die hun onafhankelijk oordeel of integriteit kunnen schaden;

      c. zij en haar medewerkers voeren de activiteiten met betrekking tot het verlenen en beheren van het keurmerk uit
      met de grootste mate van beroepsintegriteit en met de vereiste vakbekwaamheid op het specifieke werkveld uit, en
      zijn vrij van elke druk en beïnvloeding, met name van financiële aard, die hun oordeel beïnvloeden;

      d. haar medewerkers beschikken over een gedegen vakinhoudelijke opleiding, voldoende kennis van de eisen inzake het
      keurmerk en over voldoende kennis van de relevante nationale regelgeving;

      e. de beloning van haar personeel hangt niet af van het aantal uitgevoerde beoordelingen of van de resultaten
      daarvan; en

      f. zij sluit een beroepsaansprakelijkheidsverzekering af.

      2 De instelling informeert Onze Minister over:

      a. omstandigheden die van invloed zijn op de werkingssfeer van of de voorwaarden voor haar aanwijzing; en

      b. op verzoek, over de binnen de werkingssfeer van haar aanwijzing verrichte activiteiten en andere activiteiten
      waaronder uitbesteding.

      3

      4 De aanwijzing kan worden geschorst of worden ingetrokken:

      a. op grond van door de instelling verstrekte onjuiste inlichtingen over feiten of omstandigheden, vanwege hun aard
      of ernst, mits de onjuistheid van de inlichtingen aan haar bekend was of kon zijn;

      b. indien de instelling niet meer voldoet aan de voorwaarden, bedoeld in het eerste lid; of

      c. indien de instelling de taken waarvoor zij is aangewezen, niet of niet meer naar behoren uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel32
    url: https://wetten.overheid.nl/BWBR0045555/2022-01-01#Artikel8.1
