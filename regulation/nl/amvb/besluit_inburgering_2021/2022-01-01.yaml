  - number: '10.4'
    text: |-
      Voor de variabelen in de formules, bedoeld in de [artikelen 10.1][ref1] en [10.2][ref2], geldt dat:

      a. het aantal gezinsmigranten en overige migranten in de gemeente, bedoeld in
      [artikel 10.1, tweede lid, onderdeel a][ref3], wordt bepaald aan de hand van gegevens van DUO met als peildatum
      voor de woongemeente ultimo jaar t-2;

      b. het aantal gezinsmigranten en overige migranten in de gemeente, bedoeld in
      [artikel 10.2, eerste lid, onderdeel a][ref4], wordt bepaald aan de hand van gegevens van DUO met als peildatum
      voor de woongemeente ultimo jaar t;

      c. de landelijke huisvestingstaakstelling, bedoeld in [artikel 10.1, vijfde lid, onderdeel a][ref5], wordt voor
      het jaar t en jaar t-1 bepaald aan de hand van de op die jaren betrekking hebbende landelijke halfjaarlijkse
      huisvestingstaakstellingen van het ministerie van Justitie en Veiligheid en voor de huisvestingstaakstelling voor
      de tweede helft van jaar t wordt indien nodig gebruik gemaakt van een prognose van het ministerie van Justitie
      en Veiligheid;

      d. het landelijk voorlopig aantal asielstatushouders, bedoeld in [artikel 10.1, vijfde lid, onderdeel c][ref6],
      en het voorlopig aantal asielstatushouders, bedoeld in artikel 10.1, vierde lid, onderdeel c, worden bepaald aan de
      hand van gegevens van DUO met als peildatum voor de woongemeente jaar t-2;

      e. het landelijk aantal asielstatushouders, bedoeld in [artikel 10.2, tweede lid, onderdeel a][ref7], en het
      aantal asielstatushouders, bedoeld in artikel 10.2, derde lid, onderdeel a, worden bepaald aan de hand van gegevens
      van DUO met als peildatum voor de woongemeente jaar t;

      f. het aantal met een inburgeringsdiploma of inburgeringscertificaat afgeronde inburgeringstrajecten
      van asielstatushouders, bedoeld in de [artikelen 10.1, vierde lid, onderdeel e][ref8], en
      [10.2, derde lid, onderdeel c][ref9], wordt bepaald aan de hand van cijfers van DUO over het gehele jaar t-2.


