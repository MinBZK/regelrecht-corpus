  - number: '6.8'
    text: |-
      1 De terugbetaling van de lening geschiedt in maandelijkse termijnbedragen, behoudens in de bij ministeriële
      regeling genoemde gevallen.

      2 De hoogte van het maandelijkse termijnbedrag wordt op basis van het aantal maanden van de terugbetalingsperiode
      tot een gelijk bedrag vastgesteld bij de aanvang van de aanloopfase, bedoeld in [artikel 6.7, derde lid][ref1],
      dan wel binnen acht weken na ontvangst van een verzoek als bedoeld in 6.7, tweede lid, tweede volzin.

      3 Bij ministeriële regeling worden nadere regels gesteld over de hoogte van het termijnbedrag alsmede de wijze
      waarop dit wordt berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel6.7
    url: https://wetten.overheid.nl/BWBR0045555/2022-01-01#Artikel6.8
