  - number: '3.6'
    text: |-
      1 Degene die wenst te worden toegelaten tot de examens, bedoeld in [artikel 3.5, tweede lid][ref1], meldt zich
      daartoe schriftelijk aan overeenkomstig de bij ministeriële regeling gestelde regels.

      2 Onze Minister bevestigt de aanmelding schriftelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel3.5
