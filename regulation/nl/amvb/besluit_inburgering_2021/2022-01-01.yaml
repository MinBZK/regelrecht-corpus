  - number: '10.1'
    text: |-
      1 De voorlopige uitkering voor een gemeente in het uitvoeringsjaar t wordt bepaald aan de hand van de volgende
      formule:

      U = BGO + BA

      Waarbij:

      a. U de uitkering is in jaar t;

      b. BGO het deel van de uitkering is voor gezinsmigranten en overige migranten; en

      c. BA het deel van de uitkering is voor asielstatushouders.

      2 Het deel van de uitkering voor gezinsmigranten en overige migranten, bedoeld in het eerste lid, onderdeel b,
      wordt berekend aan de hand van de volgende formule:

      BGO = AGO(cohort t-2) * a

      Waarbij:

      a. AGO staat voor het aantal gezinsmigranten en overige migranten in de gemeente;

      b. Cohort (t-2) het jaar aangeeft waarin de gezinsmigranten en overige migranten in een Nederlandse gemeente zijn
      gehuisvest; en

      c. a staat voor het bedrag aan uitkering per gezinsmigrant of overige migrant.

      3 Het deel van de uitkering voor asielstatushouders, bedoeld in het eerste lid, onderdeel c, wordt berekend aan de
      hand van de volgende formule:

      BA = GG / SOM GG * TBA

      Waarbij:

      a. GG de gemeentelijke grondslag is voor de berekening van het deel van de uitkering voor asielstatushouders;

      b. SOM GG het landelijk totaal is van de gemeentelijke grondslagen; en

      c. TBA het totaal voorlopig beschikbare landelijke budget in jaar t voor asielstatushouders.

      4 De gemeentelijke grondslag, bedoeld in het derde lid, onderdeel a, wordt berekend aan de hand van de volgende
      formule:











                    GG =



                    GHT (cohort jaar t)


                    * PA (jaar t)


                    * [a]





                    +


                    GHT (cohort jaar t-1)


                    * PA (jaar t-1)


                    * [b]





                    +


                    VAA (cohort jaar t-2)



                    * [c]





                    +


                    AIA (jaar t-2)



                    * [d]






      Waarbij:

      a. GHT staat voor de gemeentelijke huisvestingstaakstelling in het betreffende jaar welke wordt
      vastgesteld op basis van de landelijke huisvestingstaakstelling, bedoeld in het vijfde lid, onderdeel
      a, en wordt verdeeld onder gemeenten op basis van het aantal inwoners conform de formule, bedoeld in
      [artikel 29, eerste lid, van de Huisvestingswet 2014][ref1];

      b. PA staat voor het te verwachten percentage asielstatushouders in de gemeentelijke huisvestingstaakstelling in
      het betreffende jaar;

      c. VAA staat voor het voorlopig aantal asielstatushouders van het betreffende cohort jaar t-2 in de gemeente;

      d. Cohort het jaar aangeeft waarin de asielstatushouders in een Nederlandse gemeente zijn gehuisvest;

      e. AIA staat voor het aantal met een inburgeringsdiploma of inburgeringscertificaat afgeronde inburgeringstrajecten
      van asielstatushouders in het aangegeven jaar t-2 in de gemeente; en

      f. [a t/m d] staat voor de gewichten die toegekend worden aan de afzonderlijke variabelen in de formule.

      5 Het totaal voorlopig beschikbare landelijke budget in jaar t voor asielstatushouders, bedoeld in het derde lid,
      onderdeel c, wordt berekend aan de hand van de volgende formule:











                    TBA =



                    LHT (cohort jaar t)


                    * PA (jaar t)


                    * [a]





                    +


                    LHT (cohort jaar t-1)


                    *PA (jaar t-1)


                    * [b]





                    +


                    LVAA (cohort jaar t-2)



                    * [c]






      Waarbij:

      a. LHT staat voor de landelijke huisvestingstaakstelling welke wordt vastgesteld op basis van de landelijke
      halfjaarlijkse huisvestingstaakstelling vermenigvuldigd met een factor 2 of wordt vastgesteld op basis van de
      landelijke halfjaarlijkse huisvestingstaakstelling plus een prognose van de landelijke huisvestingstaakstelling
      voor het tweede halfjaar;

      b. PA staat voor het te verwachten percentage asielstatushouders in de landelijke huisvestingstaakstelling in het
      betreffende jaar;

      c. LVAA staat voor het landelijk voorlopig aantal asielstatushouders van het betreffende cohort;

      d. Cohort het jaar aangeeft waarin de asielstatushouders in een Nederlandse gemeente zijn gehuisvest; en

      e. [a t/m c] staat voor de bedragen per asielstatushouder per variabele in de formule.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel29
    url: https://wetten.overheid.nl/BWBR0045555/2022-01-01#Artikel10.1
