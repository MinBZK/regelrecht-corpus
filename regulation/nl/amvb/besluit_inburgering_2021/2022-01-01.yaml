  - number: '3.7'
    text: |-
      1 Bij ministeriële regeling worden regels gesteld over de hoogte en het betalen van het examengeld, voor de
      examens, bedoeld in [artikel 3.5, tweede lid][ref1], en op welke wijze het verschuldigde examengeld wordt voldaan,
      waarbij onderscheid kan worden gemaakt tussen groepen inburgeringsplichtigen.

      2 Bij ministeriële regeling kunnen regels worden gesteld omtrent het kosteloos afleggen van een of meerdere
      examenpogingen van onderdelen van het inburgeringsexamen door groepen van inburgeringsplichtigen, in welk geval
      Onze Minister het examengeld voor het afleggen van het staatsexamen Nederlands als tweede taal voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel3.5
    url: https://wetten.overheid.nl/BWBR0045555/2022-01-01#Artikel3.7
