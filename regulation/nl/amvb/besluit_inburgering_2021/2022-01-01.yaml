        artikel: '1'
  - number: '3.9'
    text: |-
      1 Onze Minister kan de kandidaat met een psychische of lichamelijke belemmering, of een verstandelijke beperking op
      diens verzoek in de gelegenheid stellen om de examens, bedoeld in [artikel 3.5, tweede lid][ref1], af te leggen op
      een wijze die is aangepast aan zijn mogelijkheden.

      2 De inburgeringsplichtige kan kosteloos een deskundigenverklaring aanvragen van een door Onze Minister aangewezen
      arts, niet zijnde de behandeld arts van de inburgeringsplichtige, die is ingeschreven in het register, bedoeld in
      [artikel 3, eerste lid, van de Wet op de beroepen in de individuele gezondheidszorg][ref2], waarin deze arts zich
      uitlaat over de noodzaak tot het treffen van aangepaste examenomstandigheden bij het afleggen van een of meerdere
      onderdelen van het inburgeringsexamen en welke mogelijke aangepaste examenomstandigheden dit kunnen betreffen.

      3 Bij het verzoek, bedoeld in het eerste lid, legt de kandidaat de deskundigenverklaring, bedoeld in het tweede
      lid, over, waaruit blijkt dat hij een of meerdere van de examens, bedoeld in het eerste lid, slechts kan afleggen
      op een wijze die is aangepast aan zijn mogelijkheden.

      4 Indien Onze Minister bij de toepassing van [artikel 2.7][ref3] heeft geoordeeld dat de inburgeringsplichtige
      een of meerdere van de examens, bedoeld in het eerste lid, slechts kan afleggen op een wijze die is aangepast aan
      de mogelijkheden van die inburgeringsplichtige, legt de kandidaat bij de aanmelding voor het voornoemde examen, de
      beschikking, bedoeld in het vierde lid, onderdeel a, van dat artikel over.

      5 Bij ministeriële regeling worden regels gesteld over de toepassing van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel3.5
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0045555#Artikel2.7
