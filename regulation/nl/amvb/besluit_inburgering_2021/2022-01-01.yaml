        artikel: '6.7'
        hoofdstuk: '6'
        afdeling: '2'
  - number: '6.9'
    text: |-
      1 Binnen acht weken na de aanvang van de aanloopfase, bedoeld in [artikel 6.7, derde lid][ref1], dan wel
      de ontvangst van een verzoek als bedoeld in artikel 6.7, tweede lid, tweede volzin, stelt Onze Minister het
      termijnbedrag vast dat de debiteur overeenkomstig de [artikelen 6.6 tot en met 6.8][ref2] maandelijks moet
      terugbetalen alsmede de periode waarbinnen dit moet gebeuren.

      2 Bij ministeriële regeling kunnen regels worden gesteld voor het geval de debiteur meer betaalt dan het
      termijnbedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel6.7
