      2 Het toetsingsinkomen wordt berekend overeenkomstig
      [artikel 8, eerste, tweede, derde en vijfde lid, van de Algemene wet inkomensafhankelijke regelingen][ref2].

      3 Bij ministeriële regeling worden nadere regels gesteld ten aanzien van de wijze waarop de draagkracht van de
