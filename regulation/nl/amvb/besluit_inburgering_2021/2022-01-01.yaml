  - number: '9.9'
    text: |-
      1 Het college en Onze Minister bewaren persoonsgegevens die zij in het kader van de uitvoering van deze wet hebben
      verkregen niet langer dan noodzakelijk en verwijderen de persoonsgegevens:

      a. na verloop van vijf jaren na beëindiging van de inburgeringsplicht; of

      b. indien de betrokkene is overleden.

      2 In afwijking van de in het eerste lid, onderdeel a, genoemde termijn worden de volgende gegevens van
      inburgeringsplichtigen en gewezen inburgeringsplichtigen verwijderd na verloop van ten hoogste vijftig jaar:

      a. burgerservicenummer;

      b. naamgegevens;

      c. adresgegevens;

      d. woonplaats;

      e. geboortedatum;

      f. gegevens die betrekking hebben op gehele of gedeeltelijke vrijstelling van de inburgeringsplicht;

      g. gegevens die betrekking hebben op een ontheffing van de inburgeringsplicht;

      h. de datum en de wijze waarop aan de inburgeringsplicht is voldaan.

      i. gegevens over een tijdelijke of definitief niet invorderbare schuld terzake van een lening.

      3 In afwijking van de in het eerste lid, onderdeel a, genoemde termijn worden de volgende gegevens van personen als
      bedoeld in [artikel 19 van de wet][ref1] en [artikel 6.1][ref2] van dit besluit verwijderd na verloop van vijf
      jaar nadat de lening is voldaan, kwijtgescholden, of teniet gegaan:

      a. burgerservicenummer;

      b. naamgegevens;

      c. adresgegevens;

      d. woonplaats;

      e. geboortedatum;

      f. de datum waarop het inburgeringsdiploma is behaald;

      g. gegevens over de lening.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0045555#Artikel6.1
