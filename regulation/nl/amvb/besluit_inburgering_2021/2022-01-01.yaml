  - number: '9.2'
    text: |-
      1 De gegevens, bedoeld in dit artikel, worden verstrekt ten behoeve van de uitvoering van verschillende onderdelen
      van de inburgeringsplicht, bedoeld in [artikel 6 van de wet][ref1], alsmede de voorbereiding op de inburgering,
      bedoeld in [artikel 10 van de wet][ref2].

      2 Het college verstrekt Onze Minister gegevens over:

      a. de door de inburgeringsplichtige te volgen leerroute, alsmede wijzigingen daarvan, en, indien van toepassing, de
      intensiteit van de leerroute;

      b. de voortgang van de leerroute, de aanwezigheid en geleverde inspanningen, het taalniveau, het
      participatieverklaringstraject en de module Arbeidsmarkt en Participatie.

      3 Het college verstrekt de cursusinstelling de NAW-gegevens en de gegevens over de leerroute, waaronder de
      intensiteit en de termijn van de leerroute, alsmede wijzigingen daarvan.

      4 Cursusinstellingen verstrekken het college gegevens over de voortgang van de leerroute, de aanwezigheid en
      geleverde inspanningen, van asielstatushouders, en desgevraagd, van gezinsmigranten en overige migranten.

      5 Onze Minister verstrekt het college gegevens over:

      a. examendeelname, examenpogingen en examenresultaten, en het afronden van de inburgeringsplicht;

      b. de datum van het inburgeringsdiploma;

      c. de toekenning van het inburgeringscertificaat.

      6 Onze Minister verstrekt cursusinstellingen gegevens over examendeelname, examenresultaten en het afronden van
      de inburgeringsplicht.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0044770#Artikel10
