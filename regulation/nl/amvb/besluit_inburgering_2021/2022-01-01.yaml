  - number: '10.8'
    text: |-
      1 Iedere maand wordt op of omstreeks de vijftiende dag van die maand een twaalfde deel van het voor dat
      kalenderjaar vastgestelde uitkering bedoeld in [artikel 40, eerste lid, van de wet][ref1], betaald

      2 Na de definitieve vaststelling van de uitkering wordt deze, indien hoger is vastgesteld in één keer nabetaald en
      indien lager is vastgesteld in één keer teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel40
