  - number: 6.2.7
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de toepassing van het eerste tot
      en met vierde lid.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.2
  - number: 6.3.1
    text: |-
      De inburgeringsplichtige, bedoeld in [artikel 19, van de wet][ref1] heeft, behoudens het
      bepaalde in [artikel 20, tweede lid, van de wet][ref2], aanspraak op de lening gedurende de
      termijn, bedoeld in [artikel 11 van de wet][ref3], gedurende de verlengde termijn bedoeld in
      [artikel 12, eerste lid, van de wet][ref4] en gedurende de termijn, genoemd in de boetebeschikking, bedoeld
      in de [artikelen 24, tweede lid][ref5], en [25, tweede lid, van de wet][ref6]. Een persoon als bedoeld in
      [artikel 6.1][ref7] heeft aanspraak op de lening gedurende drie jaar nadat hij rechtmatig verblijf verkrijgt.


