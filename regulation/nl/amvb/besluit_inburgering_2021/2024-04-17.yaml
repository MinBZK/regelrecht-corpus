      - id: ref2
        bwb_id: BWBR0045555
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.3.4
    text: |-
      Bij ministeriële regeling worden de gewichten a tot en met d, bedoeld in
      [artikel 10.1, vierde lid, onderdeel g][ref1], en [10.2, derde lid, onderdeel d][ref2], vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0045555#Artikel10
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.3
