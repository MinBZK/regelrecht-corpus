    text: 'In de aanvraag vermeldt de aanvrager zijn: naam- en adresgegevens, burgerservicenummer en rekeningnummer.'
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.4
  - number: 6.4.2
    text: |-
      Bij de aanvraag overlegt de aanvrager een door hem ondertekende verklaring waarin hij Onze Minister machtigt het
      bedrag van de maandelijkse termijnen die hij op grond van [artikel 6.9][ref1] of [6.12][ref2] moet terugbetalen,
      automatisch van zijn bankrekening af te schrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0045555#Artikel6
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0045555
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0045555
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '2'
  - number: '6.5'
    text: Onze Minister geeft binnen acht weken na ontvangst van de aanvraag een beschikking.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.5
  - number: 6.6.1
    text: |-
      Onze Minister stelt jaarlijks voor 31 december ten behoeve van het daaropvolgende jaar een rentepercentage vast
      dat gelijk is aan het gemiddeld effectief rendement over de maand september van dat jaar van de openbare lening,
      uitgegeven door de Staat der Nederlanden en toegelaten tot de notering aan de officiële markt ter beurze van
      Amsterdam, met een resterende looptijd van drie tot vijf jaren.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.6
  - number: 6.6.2
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld omtrent de wijze waarop de rente wordt berekend over de
      aangegane lening.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.6
  - number: 6.7.1
    text: De terugbetalingsperiode beslaat ten hoogste tien jaren.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.7
  - number: 6.7.2
    text: |-
      De terugbetalingsperiode vangt aan op de eerste dag van de maand volgend op het in
      [artikel 21, derde lid, onderdeel a of b, van de wet][ref1] bedoelde tijdstip. De terugbetalingsperiode kan op
      schriftelijk verzoek van de debiteur aanvangen op een eerder tijdstip, in welk geval de aanspraak op de lening
      vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel21
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '21'
  - number: 6.7.3
    text: |-
      Gedurende de in [artikel 21, derde lid, aanhef, van de wet][ref1] bedoelde aanloopfase van zes maanden bestaat
      geen verplichting tot terugbetaling, doch is wel rente verschuldigd over het bedrag van de lening.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel21
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '21'
  - number: 6.7.4
    text: |-
      In afwijking van het tweede lid, vangt de terugbetalingsperiode voor een persoon als bedoeld in
      [artikel 6.1][ref1] aan zes maanden nadat drie jaar zijn verstreken sedert de verstrekking van de lening of,
      indien dat eerder is, zes maanden nadat het inburgeringsexamen is behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel6
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0045555
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '1'
  - number: 6.8.1
    text: |-
      De terugbetaling van de lening geschiedt in maandelijkse termijnbedragen, behoudens in de bij ministeriële regeling
      genoemde gevallen.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.8
  - number: 6.8.2
    text: |-
      De hoogte van het maandelijkse termijnbedrag wordt op basis van het aantal maanden van de terugbetalingsperiode tot
      een gelijk bedrag vastgesteld bij de aanvang van de aanloopfase, bedoeld in [artikel 6.7, derde lid][ref1], dan
      wel binnen acht weken na ontvangst van een verzoek als bedoeld in 6.7, tweede lid, tweede volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel6
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0045555
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '2'
  - number: 6.8.3
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over de hoogte van het termijnbedrag alsmede de wijze waarop
      dit wordt berekend.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.8
  - number: 6.9.1
    text: |-
      Binnen acht weken na de aanvang van de aanloopfase, bedoeld in [artikel 6.7, derde lid][ref1], dan wel de
      ontvangst van een verzoek als bedoeld in artikel 6.7, tweede lid, tweede volzin, stelt Onze Minister het
      termijnbedrag vast dat de debiteur overeenkomstig de [artikelen 6.6 tot en met 6.8][ref2] maandelijks moet
      terugbetalen alsmede de periode waarbinnen dit moet gebeuren.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0045555#Artikel6
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.9
    references:
      - id: ref1
        bwb_id: BWBR0045555
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0045555
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '2'
  - number: 6.9.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld voor het geval de debiteur meer betaalt dan het
      termijnbedrag.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.9
  - number: '6.10'
    text: |-
      Indien de debiteur niet in staat is het overeenkomstig [artikel 6.9][ref1] vastgestelde termijnbedrag te
      voldoen, kan hij bij Onze Minister een aanvraag indienen om zijn draagkracht vast te stellen voor de resterende
      terugbetalingsperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel6
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.10
    references:
      - id: ref1
        bwb_id: BWBR0045555
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '2'
  - number: 6.11.1
    text: |-
      Ter bepaling van de draagkracht van de debiteur wordt het toetsingsinkomen van de debiteur en dat van zijn partner
      als bedoeld in [artikel 3 van de Algemene wet inkomensafhankelijke regelingen][ref1] in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel3
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.11
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '3'
  - number: 6.11.2
    text: |-
      Het toetsingsinkomen wordt berekend overeenkomstig
      [artikel 8, eerste, tweede, derde en vijfde lid, van de Algemene wet inkomensafhankelijke regelingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel8
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.11
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '8'
  - number: 6.11.3
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld ten aanzien van de wijze waarop de draagkracht van de
      debiteur wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.11
  - number: 6.12.1
    text: |-
      Onze Minister geeft binnen acht weken na ontvangst van de aanvraag, bedoeld in [artikel 6.10][ref1], een
      beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel6
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.12
    references:
      - id: ref1
        bwb_id: BWBR0045555
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '2'
  - number: 6.12.2
    text: |-
      Indien het bedrag van de draagkracht lager is dan het overeenkomstig [artikel 6.9][ref1] vastgestelde
      termijnbedrag, wordt het termijnbedrag opnieuw vastgesteld met ingang van de eerste dag van de maand volgend op de
      maand waarin Onze Minister het nieuwe termijnbedrag aan de debiteur bekend heeft gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel6
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.12
    references:
      - id: ref1
        bwb_id: BWBR0045555
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '2'
  - number: '6.13'
    text: Bij ministeriële regeling worden regels gesteld omtrent verzuim, aanmaning en de invordering van de schuld.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.13
  - number: 6.14.1
    text: |-
      De schuld die bij het einde van de terugbetalingsperiode resteert omdat overeenkomstig
      [artikel 6.12, tweede lid][ref1], het termijnbedrag opnieuw is vastgesteld, gaat op dat ogenblik teniet, met
      uitzondering van achterstallige termijnbedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel6
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.14
    references:
      - id: ref1
        bwb_id: BWBR0045555
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '2'
  - number: 6.14.2
    text: De schuld die resteert bij het overlijden van de debiteur gaat op dat ogenblik teniet.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.14
  - number: '6.15'
    text: |-
      De termijnen, bedoeld in [artikel 6.3, eerste lid][ref1], worden verlengd met de duur van de periode, bedoeld in
      [artikel 2.1, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0045555#Artikel2
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.15
    references:
      - id: ref1
        bwb_id: BWBR0045555
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0045555
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '6.16'
    text: |-
      De [artikelen 3][ref1], [4][ref2] en [6, eerste lid, van de Algemene wet inkomensafhankelijke regelingen][ref3]
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0018472#Artikel6
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.16
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0018472
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0018472
        artikel: '6'
  - number: 7.1.1
    text: |-
      De bestuurlijke boete, bedoeld in [artikel 22 van de wet][ref1], bedraagt € 250.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel22
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '22'
  - number: 7.1.2
    text: |-
      De bestuurlijke boete, bedoeld in [artikel 23 van de wet][ref1], bedraagt € 50.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel23
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '23'
  - number: 7.1.3
    text: |-
      De boete, bedoeld in het tweede lid, wordt steeds met 100 procent van het boetebedrag verhoogd tot een
      bedrag van ten hoogste € 800, indien binnen een tijdvak van twaalf maanden voorafgaand aan de dag van
      constatering van de overtreding een eerdere overtreding, bestaande uit het niet naleven van het bepaalde
      in [artikel 23 van de wet][ref1] is geconstateerd, en de bestuurlijke boete wegens de eerdere overtreding
      onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel23
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '23'
  - number: 7.1.4
    text: 'Bij het opleggen van de boete, bedoeld in het tweede lid, worden de volgende uitgangspunten in acht genomen:'
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel7.1
  - number: 7.1.4.a
    text: indien er sprake is van opzet, wordt de bestuurlijke boete vastgesteld op 100 procent;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel7.1
  - number: 7.1.4.b
    text: indien er sprake is van grove schuld, wordt de boete vastgesteld op 75 procent;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel7.1
  - number: 7.1.4.c
    text: indien er geen sprake is van opzet of grove schuld wordt de bestuurlijke boete vastgesteld op 50 procent;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel7.1
  - number: 7.1.4.d
    text: indien er sprake is van verminderde verwijtbaarheid wordt de bestuurlijke boete vastgesteld op 25 procent.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel7.1
  - number: 7.1.5
    text: |-
      Het totaal aan opgelegde boetes, bedoeld in het eerste en tweede lid, beloopt gedurende de termijn, genoemd
      in [artikel 11, eerste lid, van de wet][ref1], of de op grond van [artikel 12 van de wet][ref2] verlengde
      termijn, ten hoogste € 2.400 en beloopt gedurende de op grond van de [artikelen 24, tweede en derde lid][ref3], en
      [25, tweede lid, van de wet][ref4] vastgestelde nieuwe termijn ten hoogste:


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0044770#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0044770#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0044770#Artikel25
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0044770
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0044770
        artikel: '24'
      - id: ref4
        bwb_id: BWBR0044770
        artikel: '25'
  - number: 7.1.5.a
    text: € 400 bij een nieuwe termijn van zes maanden;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel7.1
  - number: 7.1.5.b
    text: € 800 bij een nieuwe termijn van een jaar;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel7.1
  - number: 7.1.5.c
    text: € 1.200 bij een nieuwe termijn van anderhalf jaar;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel7.1
  - number: 7.1.5.d
    text: € 1.600 bij een nieuwe termijn van twee jaar.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel7.1
  - number: 7.1.6
    text: |-
      De stelplicht en bewijslast van feiten en omstandigheden die aanleiding kunnen geven voor verlaging van de
      bestuurlijke boete, bedoeld in het eerste lid, rust op betrokkene. Indien het college op de hoogte is van
      bijzondere omstandigheden, wordt bij het opleggen van de bestuurlijke boete daarmee rekening gehouden.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel7.1
  - number: 7.2.1
    text: |-
      De bestuurlijke boete, bedoeld in [artikel 24 van de wet][ref1], bedraagt € 340.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel24
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '24'
  - number: 7.2.2
    text: |-
      De bestuurlijke boete, bedoeld in [artikel 25 van de wet][ref1], wordt vastgesteld op basis van het aantal
      geregistreerde uren dat de inburgeringsplichtige heeft besteed aan de leerroute, het aantal afgelegde
      examenpogingen en het aantal behaalde examens.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel25
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '25'
  - number: 7.2.3
    text: |-
      De stelplicht en bewijslast van feiten en omstandigheden die aanleiding kunnen geven voor verlaging van de
      bestuurlijke boete, bedoeld in het eerste lid, rust op betrokkene. Indien Onze Minister op de hoogte is van
      bijzondere omstandigheden, wordt bij het opleggen van de bestuurlijke boete daarmee rekening gehouden.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel7.2
  - number: 7.2.4
    text: Bij ministeriële regeling worden nadere regels gesteld over de boetes, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel7.2
  - number: 8.1.1
    text: |-
      De door Onze Minister aan te wijzen instelling die een keurmerk als bedoeld in [artikel 32 van de wet][ref1]
      verleent, betreft een instelling die voldoet aan de volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel32
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '32'
  - number: 8.1.1.a
    text: zij heeft rechtspersoonlijkheid;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.1
  - number: 8.1.1.b
    text: |-
      zij is onafhankelijk van door haar te beoordelen personen of instellingen, en zij, haar leidinggevenden en haar
      medewerkers voeren geen activiteiten uit die hun onafhankelijk oordeel of integriteit kunnen schaden;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.1
  - number: 8.1.1.c
    text: |-
      zij en haar medewerkers voeren de activiteiten met betrekking tot het verlenen en beheren van het keurmerk uit met
      de grootste mate van beroepsintegriteit en met de vereiste vakbekwaamheid op het specifieke werkveld uit, en zijn
      vrij van elke druk en beïnvloeding, met name van financiële aard, die hun oordeel beïnvloeden;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.1
  - number: 8.1.1.d
    text: |-
      haar medewerkers beschikken over een gedegen vakinhoudelijke opleiding, voldoende kennis van de eisen inzake het
      keurmerk en over voldoende kennis van de relevante nationale regelgeving;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.1
  - number: 8.1.1.e
    text: |-
      de beloning van haar personeel hangt niet af van het aantal uitgevoerde beoordelingen of van de resultaten daarvan;
      en
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.1
  - number: 8.1.1.f
    text: zij sluit een beroepsaansprakelijkheidsverzekering af.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.1
  - number: 8.1.2
    text: 'De instelling informeert Onze Minister over:'
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.1
  - number: 8.1.2.a
    text: omstandigheden die van invloed zijn op de werkingssfeer van of de voorwaarden voor haar aanwijzing; en
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.1
  - number: 8.1.2.b
    text: |-
      op verzoek, over de binnen de werkingssfeer van haar aanwijzing verrichte activiteiten en andere activiteiten
      waaronder uitbesteding.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.1
  - number: 8.1.3
    text: |-
      De instelling stelt jaarlijks voor 1 mei een verslag op van de door haar in verband met haar taak verrichte
      werkzaamheden, de rechtmatigheid en doeltreffendheid van haar werkzaamheden en werkwijze in het afgelopen
      kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.1
  - number: 8.1.4
    text: 'De aanwijzing kan worden geschorst of worden ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.1
  - number: 8.1.4.a
    text: |-
      op grond van door de instelling verstrekte onjuiste inlichtingen over feiten of omstandigheden, vanwege hun aard of
      ernst, mits de onjuistheid van de inlichtingen aan haar bekend was of kon zijn;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.1
  - number: 8.1.4.b
    text: indien de instelling niet meer voldoet aan de voorwaarden, bedoeld in het eerste lid; of
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.1
  - number: 8.1.4.c
    text: indien de instelling de taken waarvoor zij is aangewezen, niet of niet meer naar behoren uitvoert.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.1
  - number: 8.2.1
    text: 'In het keurmerk worden in ieder geval eisen gesteld omtrent de volgende aspecten van de cursusinstelling:'
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.2
  - number: 8.2.1.a
    text: 'de bedrijfsvoering, waarbij de eisen zien op:'
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.2
  - number: 8.2.1.a.1°
    text: de continuïteit van de instelling;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.2
  - number: 8.2.1.a.2°
    text: de integriteit van het bestuur;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.2
  - number: 8.2.1.a.3°
    text: een transparante en deugdelijke financiële administratie;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.2
  - number: 8.2.1.b
    text: 'de onderwijskwaliteit, waarbij de eisen zien op:'
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.2
  - number: 8.2.1.b.1°
    text: de kwalificaties van de docenten;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.2
  - number: 8.2.1.b.2°
    text: een veilige onderwijsomgeving;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.2
  - number: 8.2.1.b.3°
    text: |-
      een aan de docent verleende verklaring omtrent het gedrag, afgegeven volgens de Wet justitiële en strafvorderlijke
      gegevens;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.2
  - number: 8.2.1.c
    text: |-
      fraudepreventie, waarbij in ieder geval de eis wordt gesteld dat bestuurders van de cursusinstelling beschikken
      over een verklaring omtrent het gedrag, afgegeven volgens de Wet justitiële en strafvorderlijke gegevens.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.2
  - number: 8.2.2
    text: |-
      Ten behoeve van een effectieve controle door de verlener van het keurmerk bevat het keurmerk eisen met betrekking
      tot de medewerking van de cursusinstelling aan controles, waaronder onaangekondigde controles en controles
      gedurende het onderwijs.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.2
  - number: 8.2.3
    text: |-
      De verklaring omtrent het gedrag, bedoeld in het eerste lid, onderdeel b, onder 3, en het eerste lid, onderdeel c,
      is in het bezit van de cursusinstelling, en is op het moment van overlegging aan de cursusinstelling niet ouder dan
      zes maanden.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.2
  - number: 8.2.4
    text: De keurmerkverlener stelt voorwaarden op omtrent de schorsing of intrekking van het keurmerk.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.2
  - number: 8.2.5
    text: 'De voorwaarden, bedoeld in het vierde lid, houden in dat het keurmerk wordt geschorst indien:'
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.2
  - number: 8.2.5.a
    text: er aanwijzingen zijn van fraude;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.2
  - number: 8.2.5.b
    text: er sprake is van onvoldoende tevredenheid onder de inburgeraars;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.2
  - number: 8.2.5.c
    text: de slagingspercentages van de cursusinstelling onvoldoende zijn; of
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.2
  - number: 8.2.5.d
    text: |-
      de cursusinstelling geen medewerking verleent aan een controle door de keurmerkverlener of een door de
      keurmerkverlener aangewezen instantie.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.2
  - number: 8.2.6
    text: 'De voorwaarden, bedoeld in het vierde lid, houden in dat het keurmerk wordt ingetrokken indien:'
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.2
  - number: 8.2.6.a
    text: |-
      na een door de keurmerkverstrekker vastgestelde periode na de schorsing, bedoeld in het vierde lid, geen sprake is
      van verbetering;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.2
  - number: 8.2.6.b
    text: |-
      er sprake is van het herhaaldelijk geen medewerking verlenen aan controles door de keurmerkverlener of een door de
      keurmerkverlener aangewezen instantie; of
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.2
  - number: 8.2.6.c
    text: er sprake is van fraude door de cursusinstelling.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.2
  - number: 8.2.7
    text: De keurmerkverlener voert jaarlijks effectieve controles uit bij de cursusinstellingen.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.2
  - number: 8.2.8
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de eisen, bedoeld in het eerste tot en
      met het zevende lid.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.2
  - number: 8.3.1
    text: |-
      De keurmerkhouder is een vergoeding verschuldigd aan de door de minister aangewezen instelling voor kosten, bedoeld
      in [artikel 32, tweede lid, onderdeel d, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel32
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '32'
  - number: 8.3.2
    text: |-
      De vergoeding wordt jaarlijks vastgesteld en behoeft goedkeuring van Onze Minister. De goedgekeurde vergoeding
      wordt door Onze Minister bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.3
  - number: 8.3.3
    text: |-
      Indien uit de eisen van het keurmerk volgt dat diensten van derden worden benut, komen deze ten laste van de
      aanvrager of houder van het keurmerk.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel8.3
  - number: 9.1.1
    text: |-
      De gegevens, bedoeld in dit artikel, worden verstrekt ten behoeve van het vaststellen, beheren, vrijstellen en de
      ontheffing van de inburgeringsplicht en het daaruit volgende inburgeringstraject.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.1
  - number: 9.1.2
    text: 'Onze Minister van Justitie en Veiligheid verstrekt Onze Minister de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.1
  - number: 9.1.2.a
    text: gegevens over het verblijfsdoel en de wijziging daarvan;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.1
  - number: 9.1.2.b
    text: |-
      identiteitsgegevens, waaronder het vreemdelingennummer, bedoeld in
      [artikel 107, derde lid, van de Vreemdelingenwet 2000][ref1], en het burgerservicenummer, van de betrokkene, en,
      indien van toepassing, van de referent, bedoeld in [artikel 2a van de Vreemdelingenwet 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel2a
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 2a
  - number: 9.1.3
    text: 'Onze Minister verstrekt het college gegevens over:'
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.1
  - number: 9.1.3.a
    text: de vaststelling van de inburgeringsplicht en de wijziging daarvan;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.1
  - number: 9.1.3.b
    text: een gehele vrijstelling of gedeeltelijke vrijstelling van de inburgeringsplicht;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.1
  - number: 9.1.3.c
    text: |-
      een aanvraag tot gehele of gedeeltelijke ontheffing van de inburgeringsplicht, waaronder de datum van de verlening
      alsmede over aangepaste examenomstandigheden, dan wel de afwijzing van een aanvraag daarvan;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.1
  - number: 9.1.3.d
    text: de toekenning van het inburgeringscertificaat.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.1
  - number: 9.1.4
    text: |-
      Onze Minister verstrekt de instelling die belast is met de voorbereiding op de inburgering, bedoeld in
      [artikel 10 van de wet][ref1], de gegevens over de vaststelling van de inburgeringsplicht en de wijziging daarvan,
      en maakt daarbij gebruik van het vreemdelingennummer of het burgerservicenummer.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel10
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '10'
  - number: 9.1.5
    text: |-
      De aangewezen organisaties die belast zijn met internationale diplomawaardering verstrekken Onze Minister een
      advies over vrijstelling of gedeeltelijke vrijstelling van de inburgeringsplicht.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.1
  - number: 9.2.1
    text: |-
      De gegevens, bedoeld in dit artikel, worden verstrekt ten behoeve van de uitvoering van verschillende onderdelen
      van de inburgeringsplicht, bedoeld in [artikel 6 van de wet][ref1], alsmede de voorbereiding op de inburgering,
      bedoeld in [artikel 10 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0044770#Artikel10
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0044770
        artikel: '10'
  - number: 9.2.2
    text: 'Het college verstrekt Onze Minister gegevens over:'
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.2
  - number: 9.2.2.a
    text: |-
      de door de inburgeringsplichtige te volgen leerroute, alsmede wijzigingen daarvan, en, indien van toepassing, de
      intensiteit van de leerroute;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.2
  - number: 9.2.2.b
    text: |-
      de voortgang van de leerroute, de aanwezigheid en geleverde inspanningen, het taalniveau, het
      participatieverklaringstraject en de module Arbeidsmarkt en Participatie.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.2
  - number: 9.2.3
    text: |-
      Het college verstrekt de cursusinstelling de NAW-gegevens en de gegevens over de leerroute, waaronder de
      intensiteit en de termijn van de leerroute, alsmede wijzigingen daarvan.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.2
  - number: 9.2.4
    text: |-
      Cursusinstellingen verstrekken het college gegevens over de voortgang van de leerroute, de aanwezigheid en
      geleverde inspanningen, van asielstatushouders, en desgevraagd, van gezinsmigranten en overige migranten.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.2
  - number: 9.2.5
    text: 'Onze Minister verstrekt het college gegevens over:'
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.2
  - number: 9.2.5.a
    text: examendeelname, examenpogingen en examenresultaten, en het afronden van de inburgeringsplicht;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.2
  - number: 9.2.5.b
    text: de datum van het inburgeringsdiploma;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.2
  - number: 9.2.5.c
    text: de toekenning van het inburgeringscertificaat.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.2
  - number: 9.2.6
    text: |-
      Onze Minister verstrekt cursusinstellingen gegevens over examendeelname, examenresultaten en het afronden van de
      inburgeringsplicht.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.2
  - number: 9.3.1
    text: |-
      De gegevens, bedoeld in dit artikel, worden verstrekt ten behoeve van de vaststelling en verlenging van de
      inburgeringstermijn.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.3
  - number: 9.3.2
    text: 'Het college verstrekt Onze Minister de gegevens over:'
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.3
  - number: 9.3.2.a
    text: |-
      de datum van vaststelling van het persoonlijk plan inburgering en participatie, bedoeld in
      [artikel 15, derde lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel15
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '15'
  - number: 9.3.2.b
    text: |-
      het uitblijven van het inburgeringsaanbod, bedoeld in [artikel 16, eerste lid, van de wet][ref1], met het oog
      op de verlenging, bedoeld in [artikel 4.3][ref2] en, indien van toepassing, of de inburgeringsplichtige een niet
      vrijstellende opleiding volgt als bedoeld in het tweede lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0045555#Artikel4
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0045555
        artikel: '4'
        hoofdstuk: '4'
  - number: 9.3.3
    text: 'Onze Minister verstrekt het college de gegevens over:'
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.3
  - number: 9.3.3.a
    text: |-
      de aanvang en het einde van de termijn waarbinnen de inburgeringsplichtige aan de onderdelen van de
      inburgeringsplicht dient te voldoen;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.3
  - number: 9.3.3.b
    text: |-
      gegevens over de indiening van een verzoek tot verlenging van de termijn, de beoordeling van dat verzoek, de datum
      van verlenging en de einddatum van de nieuwe termijn.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.3
  - number: 9.4.1
    text: |-
      De gegevens, bedoeld in dit artikel, worden verstrekt ten behoeve van de taken van het college op grond van de
      [wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044770
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0044770
  - number: 9.4.2
    text: 'Onze Minister verstrekt het college gegevens over:'
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.4
  - number: 9.4.2.a
    text: de vaststelling van het recht op maatschappelijke begeleiding;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.4
  - number: 9.4.2.b
    text: |-
      de niet vrijstellende opleiding, bedoeld in [artikel 4.3, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel4
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0045555
        artikel: '4'
        hoofdstuk: '4'
  - number: 9.4.3
    text: |-
      De instelling die is belast met de voorinburgering, bedoeld in [artikel 10 van de wet][ref1], verstrekt het
      college de volgende gegevens over de inburgeringsplichtige:


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel10
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '10'
  - number: 9.4.3.a
    text: identiteitsgegevens, waaronder het burgerservicenummer;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.4
  - number: 9.4.3.b
    text: gegevens over diens gezinssamenstelling; en
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.4
  - number: 9.4.3.c
    text: |-
      gegevens die de instantie heeft verkregen in het kader van de deelname aan de voorinburgering, waaronder gegevens
      over de voortgang van de deelname en de taalvaardigheid.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.4
  - number: 9.5.1
    text: |-
      De gegevens, bedoeld in dit artikel, worden verstrekt ten behoeve van het vaststellen, beheren en de terugbetaling
      van de sociale lening.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.5
  - number: 9.5.2
    text: |-
      De Belastingdienst verstrekt de gegevens over het toetsingsinkomen, bedoeld in
      [artikel 8, eerste, tweede, derde en vijfde lid, van de Algemene wet inkomensafhankelijke regelingen][ref1] van de
      aanvrager en diens partner als bedoeld in [artikel 3 van die wet][ref2] aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel3
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.5
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0018472
        artikel: '3'
  - number: 9.5.3
    text: |-
      De aangewezen cursusinstelling, bedoeld in [artikel 20 vijfde lid, van de wet][ref1], verstrekt aan Onze Minister
      de volgende gegevens over de inburgeringsplichtige:


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel20
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.5
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '20'
  - number: 9.5.3.a
    text: contractgegevens en inschrijvingsgegevens;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.5
  - number: 9.5.3.b
    text: factuurgegevens.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.5
  - number: 9.5.4
    text: |-
      Het college verstrekt Onze Minister de gegevens, bedoeld in [artikel 9.2, tweede lid, onderdeel a][ref1], mede
      voor het doel, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel9
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.5
    references:
      - id: ref1
        bwb_id: BWBR0045555
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.5.5
    text: |-
      Onze Minister van Justitie en Veiligheid verstrekt Onze Minister de gegevens, bedoeld in
      [artikel 9.1, tweede lid][ref1], mede voor het doel, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel9
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.5
    references:
      - id: ref1
        bwb_id: BWBR0045555
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.6.1
    text: De gegevens, bedoeld in dit artikel, worden verstrekt ten behoeve van de handhaving.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.6
  - number: 9.6.2
    text: |-
      De gegevens die door de instantie, bedoeld in [artikel 14, vijfde lid, van de wet][ref1], aan het college worden
      verstrekt, worden mede gebruikt voor het doel, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel14
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.6
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '14'
  - number: 9.6.3
    text: |-
      De gegevens, bedoeld in [artikel 9.2, vierde lid][ref1], die de cursusinstelling verstrekt aan het college, worden
      mede gebruikt voor het doel, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel9
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.6
    references:
      - id: ref1
        bwb_id: BWBR0045555
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.6.4
    text: |-
      Het college verstrekt Onze Minister de gegevens, bedoeld in [artikel 9.2, tweede lid, onderdeel b][ref1], mede
      voor het doel, bedoeld in het eerste lid, en verstrekt, op verzoek, gegevens over opgelegde boetes.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel9
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.6
