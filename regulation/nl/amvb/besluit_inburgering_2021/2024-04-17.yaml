        bwb_id: BWBR0002221
        artikel: 7a
  - number: 6.1.b
    text: |-
      minder dan acht jaren leerplichtig of kwalificatieplichtig is geweest op grond van de [Leerplichtwet 1969][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0002628
  - number: 6.1.c
    text: |-
      niet beschikt over een diploma, certificaat of ander document als bedoeld in
      [artikel 4, eerste lid, onderdeel b, van de wet][ref1] en geen opleiding volgt waarvan de afronding leidt tot
      uitreiking van voornoemd diploma, certificaat of ander document;


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel4
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '4'
  - number: 6.1.d
    text: |-
      niet leerplichtig of kwalificatieplichtig is op grond van de [Leerplichtwet 1969][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0002628
  - number: 6.1.e
    text: niet heeft aangetoond al voldoende te zijn ingeburgerd.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.1
  - number: 6.2.1
    text: |-
      Aan de inburgeringsplichtige kan, behoudens het bepaalde in [artikel 20, tweede lid, van de wet][ref1] op aanvraag
      een lening van ten hoogste € 10.000 worden verstrekt ten behoeve van de kosten voor:


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel20
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '20'
  - number: 6.2.1.a
    text: |-
      het volgen van een cursus ten behoeve van de in het persoonlijk plan inburgering en participatie vastgestelde
      leerroute;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.2
  - number: 6.2.1.b
    text: |-
      het volgen van een taalschakeltraject ten behoeve van de in het persoonlijk plan inburgering en participatie
      vastgestelde leerroute;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.2
  - number: 6.2.1.c
    text: |-
      het volgen van alfabetiseringsonderwijs, mits de verplichting hiertoe is opgenomen in het persoonlijk plan
      inburgering en participatie; of
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.2
  - number: 6.2.1.d
    text: |-
      het afleggen van het inburgeringsexamen, bedoeld in [artikel 7, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel7
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '7'
  - number: 6.2.2
    text: |-
      De hoogte van de lening wordt bepaald aan de hand van de hoogte van het overeenkomstig
      [artikel 8, eerste, tweede, derde en vijfde lid, van de Algemene wet inkomensafhankelijke regelingen][ref1]
      te berekenen toetsingsinkomen van de inburgeringsplichtige en diens partner als bedoeld in
      [artikel 3 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel3
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0018472
        artikel: '3'
  - number: 6.2.3
    text: |-
      De lening ten behoeve van het volgen van een cursus of alfabetiseringsonderwijs wordt slechts verstrekt indien
      de inburgeringsplichtige een cursus of alfabetiseringsonderwijs volgt bij een cursusinstelling die in het bezit
      is van een certificaat als bedoeld in [artikel 28, eerste lid, van de wet][ref1] of een keurmerk als bedoeld in
      [artikel 32, eerste lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0044770#Artikel32
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.2
