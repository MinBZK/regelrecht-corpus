        afdeling: '4'
  - number: 5.5.1
    text: |-
      Van aanzienlijke inspanningen, bedoeld in [artikel 17, derde lid, van de wet][ref1], is sprake indien de
      inburgeringsplichtige in totaal 600 cursusuren Nederlands als tweede taal, waarvan alfabetiseringsonderwijs
      onderdeel kan zijn, heeft gevolgd bij een instelling die voldoet aan het bepaalde op grond van
      [artikel 32 van de wet][ref2] of bij een instelling als bedoeld in [artikel 8, tweede lid, van de wet][ref3]
      en voorts uit de relevante feiten en omstandigheden blijkt dat hij zich gedurende deze taallessen voldoende heeft
      ingespannen.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0044770#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0044770#Artikel8
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0044770
        artikel: '32'
      - id: ref3
        bwb_id: BWBR0044770
        artikel: '8'
  - number: 5.5.2
    text: |-
      Indien in het kader van de brede intake door de inburgeringsplichtige cursusuren Nederlands als tweede taal,
      waarvan alfabetiseringsonderwijs onderdeel kan zijn, zijn gevolgd die voldoen aan het gestelde in het eerste lid,
      kunnen deze uren, in afwijking van [artikel 5.3, vijfde lid][ref1], in mindering worden gebracht de urennorm,
      genoemd in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel5
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0045555
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '3'
  - number: '6.1'
    text: |-
      Tenzij uitdrukkelijk anders is bepaald, zijn de bepalingen in dit hoofdstuk van overeenkomstige toepassing op de
      persoon, bedoeld in [artikel 3, tweede lid, van de wet][ref1], die rechtmatig verblijf verkrijgt als bedoeld in
      [artikel 8, onderdeel e, van de Vreemdelingenwet 2000][ref2] en die:


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 6.1.a
    text: |-
      16 jaar of ouder is en de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1] nog niet heeft bereikt;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel6.1
    references:
