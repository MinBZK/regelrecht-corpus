      inburgeringsplichtigen en gewezen inburgeringsplichtigen verwijderd na verloop van ten hoogste vijftig jaar:
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.9
  - number: 9.9.2.a
    text: burgerservicenummer;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.9
  - number: 9.9.2.b
