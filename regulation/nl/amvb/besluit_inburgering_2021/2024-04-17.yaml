      het landelijk voorlopig aantal asielstatushouders, bedoeld in [artikel 10.1, vijfde lid, onderdeel c][ref1], en
      het voorlopig aantal asielstatushouders, bedoeld in artikel 10.1, vierde lid, onderdeel c, worden bepaald aan de
      hand van gegevens van DUO met als peildatum voor de woongemeente jaar t-2;


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel10
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.4
