        artikel: '8'
  - number: 5.4.4.c
    text: |-
      de B1-route of de onderwijsroute naar de zelfredzaamheidsroute: de reeds gevolgde cursusuren Nederlands
      als tweede taal en cursusuren kennis van de Nederlandse maatschappij bij een cursusinstelling die
      voldoet aan het bepaalde op grond van [artikel 32 van de wet][ref1] of bij een instelling als bedoeld
      in [artikel 8, tweede lid, van de wet][ref2], in mindering worden gebracht op de urennorm, bedoeld in
      [artikel 3.14, tweede lid, onderdeel a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0044770#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0045555#Artikel3
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel5.4
    references:
