  - number: 10.4.d
    text: |-
      de landelijke prognose aantal asielstatushouders, bedoeld in [artikel 10.1, vijfde lid, onderdeel a][ref1], wordt
      afgeleid van het voorstel van wet tot vaststelling van de begrotingsstaat voor het jaar t van onze Minister zoals
      bekend op de derde dinsdag van september voorafgaand aan het betreffende jaar;


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel10
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.4
    references:
      - id: ref1
        bwb_id: BWBR0045555
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.4.e
    text: |-
      de gemeentelijke prognose aantal asielstatushouders, bedoeld in [artikel 10.1, vierde lid, onderdeel a][ref1],
      wordt vastgesteld op basis van de landelijke prognose aantal asielstatushouders, bedoeld in artikel 10.1, vijfde
      lid, onderdeel a, en wordt verdeeld onder gemeenten op basis van het aantal inwoners conform de formule, bedoeld
      in [artikel 29, eerste lid, van de Huisvestingswet 2014][ref2], met dien verstande dat voor de toepassing van deze
      formule in plaats van «vg» moet worden gelezen «landelijke prognose aantal asielstatushouders»;


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0035303#Artikel29
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.4
