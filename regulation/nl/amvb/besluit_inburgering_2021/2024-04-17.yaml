      asielstatushouders, bedoeld in [artikel 10.1, derde lid, onderdeel c][ref1], berekend aan de hand van de volgende
      formule: 'Waarbij:'


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel10
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.2
    references:
