      verstrekt Onze Minister aan de Dienst Toeslagen, bedoeld in
      [artikel 11, tweede lid, van de Algemene Wet inkomensafhankelijke regelingen][ref2], gegevens over:


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel11
