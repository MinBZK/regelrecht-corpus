articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *asielstatushouders:*
      inburgeringsplichtigen, bedoeld in [artikel 13, eerste lid, van de wet][ref1];
        - *B1-route:* de leerroute, bedoeld in [artikel 7 van de wet][ref2];
        - *Besluit inburgering:* [Besluit inburgering][ref3], zoals dat luidde de dag voorafgaand aan de inwerkingtreding
      van dit besluit, tenzij anders is vermeld;
        - *cursus Nederlands als tweede taal:* door een cursusinstelling aangeboden cursus die een inburgeringsplichtige in
      staat stelt mondelinge en schriftelijke vaardigheden in de Nederlandse taal te verwerven, teneinde zijn leerroute
      te behalen;
        - *gezinsmigranten en overige migranten:* inburgeringsplichtigen, bedoeld in [artikel 19, van de wet][ref4];
        - *inburgeringscertificaat:* het certificaat, bedoeld in [artikel 6, tweede lid, van de wet][ref5];
        - *inburgeringsdiploma:* het diploma, bedoeld in [artikel 6, tweede lid, van de wet][ref6];
        - *inburgeringsvoorzieningen:* voorzieningen die bijdragen aan het voldoen aan de inburgeringsplicht;
        - *landelijke halfjaarlijkse huisvestingstaakstelling:* het door Onze Minister van Justitie en Veiligheid in
      de Staatscourant bekendgemaakte totale aantal vergunninghouders in wier huisvesting in het daarbij aangegeven
      kalenderhalfjaar naar verwachting voorzien zal moeten worden;
        - *lening:* lening, bedoeld in [artikel 20, van de wet][ref7];
        - *wet:* de [Wet inburgering 2021][ref8].


