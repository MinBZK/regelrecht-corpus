        artikel: '8'
      - id: ref2
        bwb_id: BWBR0045555
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '4'
  - number: 5.4.4.a.ii
    text: |-
      de in de onderwijsroute reeds gedane examenpogingen en behaalde examenonderdelen van de mondelinge en schriftelijke
      vaardigheden in de Nederlandse taal op ten minste het niveau B1 of kennis van de Nederlandse maatschappij, gelden
      als gedane examenpogingen en behaalde examenonderdelen van het inburgeringsexamen.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel5.4
  - number: 5.4.4.b
    text: |-
      de B1-route naar de onderwijsroute: de reeds gedane examenpogingen en behaalde examenonderdelen van het
      inburgeringsexamen gelden als gedane examenpogingen en behaalde examenonderdelen van de mondelinge en schriftelijke
      vaardigheden in de Nederlandse taal op ten minste het niveau B1 of kennis van de Nederlandse maatschappij als
      bedoeld in [artikel 8, vierde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel8
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel5.4
    references:
