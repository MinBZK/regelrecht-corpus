      - id: ref3
        bwb_id: BWBR0044770
  - number: 10.3.6
    text: |-
      Voor de berekening van de voorlopige uitkering, bedoeld in [artikel 10.1][ref1], en de definitieve uitkering,
      bedoeld in [artikel 10.2][ref2], worden onder asielstatushouders en gezinsmigranten en overige migranten, mede
      verstaan de personen die in het jaar waarin ze in een Nederlandse gemeente waren gehuisvest onder de definitie
      vielen van een asielstatushouder of gezinsmigrant of overige migrant, maar die op een peilmoment, bedoeld in
      [artikel 10.4][ref3], op basis waarvan de uitkering wordt bepaald, reeds aan hun inburgeringsplicht hebben
      voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0045555#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0045555#Artikel10
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.3
