    text: |-
      de landelijke huisvestingstaakstelling, bedoeld in [artikel 10.1, vijfde lid, onderdeel c][ref1], bepaald wordt
      aan de hand van de op die jaren betrekking hebbende landelijke halfjaarlijkse huisvestingstaakstellingen van het
      Ministerie van Justitie en Veiligheid;


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel10
