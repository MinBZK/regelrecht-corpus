      Het doel van het verblijf van de houder van een verblijfsvergunning als bedoeld in
      [artikel 8, onderdeel c, van de Vreemdelingenwet 2000][ref1] is niet tijdelijk in de zin van
      [artikel 3, eerste lid, onderdeel a, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0044770#Artikel3
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel2.2
