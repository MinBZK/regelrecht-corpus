  - number: '9.10'
    text: |-
      Cursusinstellingen, het College voor toetsen en examens, genoemd in
      [artikel 2 van de Wet College voor toetsen en examens][ref1], de op grond van [artikel 10 van de wet][ref2]
      aangewezen instelling, en de aangewezen organisaties die belast zijn met internationale diplomawaardering gebruiken
      het nummer, bedoeld in [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref3] bij het
      verwerken van gegevens op grond dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0044770#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0022428#Artikel1
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.10
    references:
