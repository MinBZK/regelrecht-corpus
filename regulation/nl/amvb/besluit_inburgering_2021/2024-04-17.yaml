        artikel: '32'
  - number: 6.2.4
    text: |-
      De lening ten behoeve van het volgen van een taalschakeltraject wordt slechts verstrekt indien deze in het kader
      van de onderwijsroute wordt gevolgd, waarbij sprake moet zijn van een erkend taalschakeltraject als bedoeld in
      [artikel 8, tweede lid, van de wet][ref1].


