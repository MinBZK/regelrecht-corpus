    text: |-
      het aantal met een inburgeringsdiploma of inburgeringscertificaat afgeronde inburgeringstrajecten
      van asielstatushouders, bedoeld in de [artikelen 10.1, vierde lid, onderdeel e][ref1], en
      [10.2, derde lid, onderdeel c][ref2], wordt bepaald aan de hand van cijfers van DUO over het gehele jaar t-2.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0045555#Artikel10
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.4
