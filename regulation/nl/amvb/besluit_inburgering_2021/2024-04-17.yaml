  - number: 10.2.2.b
    text: Cohort staat voor het jaar waarin de asielstatushouders in een Nederlandse gemeente zijn gehuisvest; en
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.2
  - number: 10.2.2.c
    text: '[a t/m c] staat voor de bedragen per asielstatushouder per variabele in de formule.'
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.2
  - number: 10.2.3
    text: |-
      Voor de bepaling van de definitieve uitkering, wordt de gemeentelijke grondslag, bedoeld in
      [artikel 10.1, vierde lid][ref1], berekend aan de hand van de volgende formule: Waarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel10
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.2
    references:
      - id: ref1
        bwb_id: BWBR0045555
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.2.3.a
    text: AA staat voor het aantal asielstatushouders van het betreffende cohort in de gemeente;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.2
  - number: 10.2.3.b
    text: Cohort staat voor het jaar waarin de asielstatushouders in een Nederlandse gemeente zijn gehuisvest;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.2
  - number: 10.2.3.c
    text: |-
      AIA staat voor het aantal met een inburgeringsdiploma of inburgeringscertificaat afgeronde inburgeringstrajecten
      van asielstatushouders in het betreffende jaar t-2 in de gemeente; en
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.2
  - number: 10.2.3.d
    text: '[a t/m d] staat voor de gewichten die toegekend worden aan de afzonderlijke variabelen in de formule.'
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.2
  - number: 10.3.1
    text: |-
      Bij een wijziging van de gemeentelijke indeling wordt voor de bepaling van de voorlopige uitkering, bedoeld in
      [artikel 10.1][ref1], uitgegaan van een redelijke inschatting van de situatie zoals die zou zijn geweest als de
      instelling, splitsing of opheffing van gemeenten in de van belang zijnde jaren al was ingegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel10
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0045555
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.3.2
    text: |-
      Bij ministeriële regeling wordt het te verwachten percentage asielstatushouders in de gemeentelijke
      huisvestingstaakstelling onderscheidenlijk de gemeentelijke prognose aantal asielstatushouders, bedoeld in
      [artikel 10.1, vierde lid, onderdeel b][ref1], en het te verwachten percentage asielstatushouders in de landelijke
      huisvestingstaakstelling onderscheidenlijk de landelijke prognose aantal asielstatushouders, bedoeld in artikel
      10.1, vijfde lid, onderdeel b, vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel10
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0045555
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.3.3
    text: |-
      Bij ministeriële regeling wordt het bedrag per gezinsmigrant of overige migrant, bedoeld in de
      [artikelen 10.1, tweede lid, onderdeel c][ref1], en [10.2, eerste lid, onderdeel c][ref2], en worden de bedragen
      per asielstatushouder per variabele a tot en met c, bedoeld in de artikelen 10.1, vijfde lid, onderdeel f en 10.2,
      tweede lid, onderdeel c, vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0045555#Artikel10
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.3
    references:
