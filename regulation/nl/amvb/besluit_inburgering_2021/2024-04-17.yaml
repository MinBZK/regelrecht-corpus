        artikel: '1'
  - number: '9.11'
    text: |-
      Bij de verwerking van bijzondere persoonsgegevens, bedoeld in [artikel 37 van de wet][ref1], wordt de toegang tot
      deze gegevens beveiligd tegen ongeautoriseerd gebruik door:


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel37
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.11
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '37'
  - number: 9.11.a
    text: |-
      het toekennen van autorisaties aan alleen die personen, die voor het uitoefenen van hun taak toegang tot de
      opgeslagen informatie moeten hebben;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.11
  - number: 9.11.b
    text: het bewaren van een reservebestand op een voor niet-geautoriseerde personen ontoegankelijke plaats.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.11
  - number: '9.12'
    text: |-
      De instanties, bedoeld in [artikel 39, eerste lid, van de wet][ref1], die aan Onze Minister gegevens en
      inlichtingen verstrekken ten behoeve van statistiek, monitoring en evaluatie, betreffen:


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel39
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.12
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '39'
  - number: 9.12.a
    text: |-
      het CBS, bedoeld in [artikel 1, aanhef en onderdeel b, van de Wet op het centraal bureau voor de statistiek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel1
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.12
    references:
      - id: ref1
        bwb_id: BWBR0015926
        artikel: '1'
  - number: 9.12.b
    text: |-
      de instelling die is belast met de voorinburgering, bedoeld in [artikel 10 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel10
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.12
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '10'
  - number: 9.12.c
    text: Onze Minister van Justitie en Veiligheid;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.12
  - number: 9.12.d
    text: de door Onze Minister aangewezen organisaties die belast zijn met internationale diplomawaardering.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.12
  - number: 10.1.1
    text: |-
      De voorlopige uitkering voor een gemeente in het uitvoeringsjaar t wordt bepaald aan de hand van de volgende
      formule: 'U = BGO + BA Waarbij:'
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.1
  - number: 10.1.1.a
    text: U de uitkering is in jaar t;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.1
  - number: 10.1.1.b
    text: BGO het deel van de uitkering is voor gezinsmigranten en overige migranten; en
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.1
  - number: 10.1.1.c
    text: BA het deel van de uitkering is voor asielstatushouders.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.1
  - number: 10.1.2
    text: |-
      Het deel van de uitkering voor gezinsmigranten en overige migranten, bedoeld in het eerste lid, onderdeel b, wordt
      berekend aan de hand van de volgende formule: BGO = AGO(cohort t-2) * a Waarbij:
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.1
  - number: 10.1.2.a
    text: AGO staat voor het aantal gezinsmigranten en overige migranten in de gemeente;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.1
  - number: 10.1.2.b
    text: |-
      Cohort (t-2) het jaar aangeeft waarin de gezinsmigranten en overige migranten in een Nederlandse gemeente zijn
      gehuisvest; en
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.1
  - number: 10.1.2.c
    text: a staat voor het bedrag aan uitkering per gezinsmigrant of overige migrant.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.1
  - number: 10.1.3
    text: |-
      Het deel van de uitkering voor asielstatushouders, bedoeld in het eerste lid, onderdeel c, wordt berekend aan de
      hand van de volgende formule: BA = GG / SOM GG * TBA Waarbij:
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.1
  - number: 10.1.3.a
    text: GG de gemeentelijke grondslag is voor de berekening van het deel van de uitkering voor asielstatushouders;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.1
  - number: 10.1.3.b
    text: SOM GG het landelijk totaal is van de gemeentelijke grondslagen; en
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.1
  - number: 10.1.3.c
    text: TBA het totaal voorlopig beschikbare landelijke budget in jaar t voor asielstatushouders.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.1
  - number: 10.1.4
    text: |-
      De gemeentelijke grondslag, bedoeld in het derde lid, onderdeel a, wordt berekend aan de hand van de volgende
      formule: 'Waarbij:'
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.1
  - number: 10.1.4.a
    text: GPAS staat voor gemeentelijke prognose aantal asielstatushouders in het betreffende jaar;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.1
  - number: 10.1.4.b
    text: |-
      PA staat voor het te verwachten percentage asielstatushouders in de gemeentelijke huisvestingstaakstelling
      onderscheidenlijk de gemeentelijke prognose aantal asielstatushouders in het betreffende jaar;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.1
  - number: 10.1.4.c
    text: |-
      GHT staat voor de gemeentelijke huisvestingstaakstelling in het betreffende jaar welke wordt
      vastgesteld op basis van de landelijke huisvestingstaakstelling, bedoeld in het vijfde lid, onderdeel
      a, en wordt verdeeld onder gemeenten op basis van het aantal inwoners conform de formule, bedoeld in
      [artikel 29, eerste lid, van de Huisvestingswet 2014][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel29
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.1
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '29'
  - number: 10.1.4.d
    text: VAA staat voor het voorlopig aantal asielstatushouders van het betreffende cohort jaar t-2 in de gemeente;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.1
  - number: 10.1.4.e
    text: Cohort het jaar aangeeft waarin de asielstatushouders in een Nederlandse gemeente zijn gehuisvest;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.1
  - number: 10.1.4.f
    text: |-
      AIA staat voor het aantal met een inburgeringsdiploma of inburgeringscertificaat afgeronde inburgeringstrajecten
      van asielstatushouders in het aangegeven jaar t-2 in de gemeente; en
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.1
  - number: 10.1.4.g
    text: '[a t/m d] staat voor de gewichten die toegekend worden aan de afzonderlijke variabelen in de formule.'
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.1
  - number: 10.1.5
    text: |-
      Het totaal voorlopig beschikbare landelijke budget in jaar t voor asielstatushouders, bedoeld in het derde lid,
      onderdeel c, wordt berekend aan de hand van de volgende formule: Waarbij:
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.1
  - number: 10.1.5.a
    text: LPAS staat voor landelijke prognose aantal asielstatushouders in het betreffende cohort;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.1
  - number: 10.1.5.b
    text: |-
      PA staat voor het te verwachten percentage asielstatushouders in de landelijke huisvestingstaakstelling
      onderscheidenlijk de landelijke prognose aantal asielstatushouders in het betreffende jaar;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.1
  - number: 10.1.5.c
    text: LHT staat voor de landelijke huisvestingstaakstelling;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.1
  - number: 10.1.5.d
    text: LVAA staat voor het landelijk voorlopig aantal asielstatushouders van het betreffende cohort;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.1
  - number: 10.1.5.e
    text: Cohort het jaar aangeeft waarin de asielstatushouders in een Nederlandse gemeente zijn gehuisvest; en
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.1
  - number: 10.1.5.f
    text: '[a t/m c] staat voor de bedragen per asielstatushouder per variabele in de formule.'
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.1
  - number: 10.2.1
    text: |-
