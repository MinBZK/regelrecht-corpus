      [artikel 10.2, eerste lid, onderdeel a][ref1], wordt bepaald aan de hand van gegevens van DUO met als peildatum
      voor de woongemeente ultimo jaar t;


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel10
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.4
    references:
      - id: ref1
