    text: |-
      het aantal gezinsmigranten en overige migranten in de gemeente, bedoeld in
      [artikel 10.1, tweede lid, onderdeel a][ref1], wordt bepaald aan de hand van gegevens van DUO met als peildatum
      voor de woongemeente ultimo jaar t-2;


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel10
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.4
