  - number: 2.1.1
    text: |-
      De inburgeringsplicht eindigt niet, indien de vreemdeling direct aansluitend op de periode waarin hij op
      grond van [artikel 3, eerste lid, van de wet][ref1] inburgeringsplichtig was of op de termijn, bedoeld
      in [artikel 3.82, eerste lid, van het Vreemdelingenbesluit 2000][ref2], rechtmatig verblijf in de zin van
      [artikel 8, onderdeel g of h, van de Vreemdelingenwet 2000][ref3] heeft verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel8
