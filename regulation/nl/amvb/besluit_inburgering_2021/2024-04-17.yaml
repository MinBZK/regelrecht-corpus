  - number: 9.9.2.g
    text: gegevens die betrekking hebben op een ontheffing van de inburgeringsplicht;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.9
  - number: 9.9.2.h
    text: de datum en de wijze waarop aan de inburgeringsplicht is voldaan.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.9
  - number: 9.9.2.i
    text: gegevens over een tijdelijke of definitief niet invorderbare schuld terzake van een lening.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.9
  - number: 9.9.3
    text: |-
      In afwijking van de in het eerste lid, onderdeel a, genoemde termijn worden de volgende gegevens van personen als
      bedoeld in [artikel 19 van de wet][ref1] en [artikel 6.1][ref2] van dit besluit verwijderd na verloop van vijf
      jaar nadat de lening is voldaan, kwijtgescholden, of teniet gegaan:


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0045555#Artikel6
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.9
    references:
