        bwb_id: BWBR0045555
        artikel: '8'
        hoofdstuk: '8'
  - number: '12.3'
    text: |-
      Dit besluit wordt aangehaald als: Besluit inburgering met vermelding van het jaartal van het Staatsblad waarin het
      zal worden geplaatst.
