  - number: 9.9.1
    text: |-
      Het college en Onze Minister bewaren persoonsgegevens die zij in het kader van de uitvoering van deze wet hebben
      verkregen niet langer dan noodzakelijk en verwijderen de persoonsgegevens:
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.9
  - number: 9.9.1.a
    text: na verloop van vijf jaren na beëindiging van de inburgeringsplicht; of
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.9
  - number: 9.9.1.b
    text: indien de betrokkene is overleden.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.9
  - number: 9.9.2
    text: |-
