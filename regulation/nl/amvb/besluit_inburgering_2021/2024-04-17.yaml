        bwb_id: BWBR0025364
        artikel: '2'
  - number: '9.7'
    text: |-
      Ten behoeve van het doel, bedoeld in [artikel 33, onderdeel b, van de wet][ref1], verstrekt Onze Minister aan Onze
      Minister van Justitie en Veiligheid gegevens over:


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel33
