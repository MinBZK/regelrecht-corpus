  - number: '2.3'
    text: |-
      Onze Minister verleent de vrijstelling, bedoeld in [artikel 4, eerste lid, onderdeel e, van de wet][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel4
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '4'
  - number: 2.3.a
    text: |-
      de inburgeringsplichtige volgens de basisregistratie personen ten minste 10 jaar onafgebroken als ingezetene
      ingeschreven is geweest;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel2.3
  - number: 2.3.b
    text: |-
      de inburgeringsplichtige aantoonbaar gedurende ten minste 5 jaar betaald werk of vrijwilligerswerk heeft verricht
      in Nederland; en
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel2.3
  - number: 2.3.c
    text: |-
      in een gesprek is vastgesteld dat de inburgeringsplichtige beheerst over spreekvaardigheid en luistervaardigheid
      in de Nederlandse taal op ten minste het niveau B1 van het Gemeenschappelijk Europees Referentiekader voor Moderne
      Vreemde Talen.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel2.3
  - number: '2.4'
    text: |-
      De advisering met betrekking tot voor de inburgeringsplicht vrijstellende buitenlandse diploma’s, certificaten of
      andere documenten, wordt uitgevoerd door een of meer bij ministeriële regeling aangewezen organisaties.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel2.4
  - number: '2.5'
    text: |-
      Bij ministeriële regeling worden regels gesteld over de procedure voor een aanvraag tot vrijstelling als bedoeld in
      [artikel 4, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel4
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '4'
  - number: '2.6'
    text: |-
      De duur van de periode dat een persoon leerplichtig of kwalificatieplichtig is geweest op grond van de
      [Leerplichtwet 1969][ref1], bedoeld in [artikel 4, eerste lid, onderdeel a, van de wet][ref2], blijkt uit
      inschrijving als ingezetene in de basisregistratie personen.


      [ref1]: https://wetten.overheid.nl/BWBR0002628
      [ref2]: https://wetten.overheid.nl/BWBR0044770#Artikel4
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0002628
      - id: ref2
        bwb_id: BWBR0044770
        artikel: '4'
  - number: 2.7.1
    text: |-
      In het kader van de aanvraagprocedure tot gehele of gedeeltelijke ontheffing van de inburgeringsplicht
      op grond van een psychische of lichamelijke belemmering dan wel verstandelijke beperking als bedoeld
      in [artikel 5, eerste lid, van de wet][ref1], verzoekt Onze Minister een door hem aangewezen arts, niet
      zijnde de behandelend arts van de inburgeringsplichtige, die is ingeschreven in het register, bedoeld
      in [artikel 3, eerste lid, van de Wet op de beroepen in de individuele gezondheidszorg][ref2], een
      deskundigenverklaring af te geven met betrekking tot de inburgeringsplichtige die de aanvraag tot ontheffing heeft
      ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel3
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '3'
  - number: 2.7.2
    text: |-
      De gehele of gedeeltelijke ontheffing van de inburgeringsplicht wordt verleend indien redelijkerwijs verwacht
      mag worden dat de aard en de ernst van de psychische of lichamelijke belemmering dan wel verstandelijke beperking
      zodanig is dat niet binnen vijf jaar na de aanvraag van de ontheffing aan de inburgeringsplicht dan wel aan een of
      meerdere onderdelen daarvan kan worden voldaan.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel2.7
  - number: 2.7.3
    text: |-
      Een gedeeltelijke ontheffing van de inburgeringsplicht wordt uitsluitend verleend indien vanwege de belemmering of
      beperking niet kan worden voldaan aan:
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel2.7
  - number: 2.7.3.a
    text: |-
      maximaal drie van de vier examenonderdelen van de mondelinge en schriftelijke vaardigheden of het examen KNM van
      het inburgeringsexamen;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel2.7
  - number: 2.7.3.b
    text: |-
      maximaal drie van de vier examenonderdelen van de mondelinge en schriftelijke vaardigheden op ten minste het niveau
      B1 of het examen KNM als bedoeld in [artikel 8, vierde lid, van de wet][ref1] van de onderwijsroute; of


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel8
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '8'
  - number: 2.7.3.c
    text: |-
      het participatiegedeelte van de zelfredzaamheidsroute, bedoeld in [artikel 3.14, tweede lid, onderdeel b][ref1],
      met uitzondering van de activiteiten van het participatieverklaringstraject en de module Arbeidsmarkt en
      Participatie.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel3
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0045555
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '4'
  - number: 2.7.4
    text: |-
      Indien Onze Minister op grond van de deskundigenverklaring, bedoeld in het eerste lid, van oordeel is dat de
      inburgeringsplichtige wel aan een of meerdere onderdelen van het inburgeringsexamen dan wel een of meerdere
      examenonderdelen van de onderwijsroute als bedoeld in het derde lid, kan voldoen onder examenomstandigheden die
      zijn aangepast aan de mogelijkheden van die inburgeringsplichtige, geldt dat:
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel2.7
  - number: 2.7.4.a
    text: |-
      voor het examen mondelinge en schriftelijke vaardigheden op het niveau A2 en het examen kennis van de Nederlandse
      maatschappij in een beschikking wordt vermeld welke aangepaste examenomstandigheden het betreft; en
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel2.7
  - number: 2.7.4.b
    text: |-
      voor het examen mondelinge en schriftelijke vaardigheden op ten minste het niveau B1, de deskundigenverklaring,
      bedoeld in het eerste lid, waarin ten aanzien van de inburgeringsplichtige een voorstel wordt gedaan met betrekking
      tot in aanmerking komende aangepaste examenomstandigheden voor het voornoemde examen, aan de inburgeringsplichtige
      wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel2.7
  - number: 2.7.5
    text: Onze Minister geeft binnen acht weken na ontvangst van de aanvraag een beschikking.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel2.7
  - number: 2.7.6
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de verlening van de ontheffing alsmede
      omtrent de deskundigenverklaring, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel2.7
  - number: 2.7.7
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de omstandigheden waaronder de kosten van de
      deskundigenverklaring, bedoeld in het eerste lid, worden vergoed aan de inburgeringsplichtige.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel2.7
  - number: 2.8.1
    text: |-
      Gehele ontheffing van de inburgeringsplicht vanwege bijzondere individuele omstandigheden, bedoeld in
      [artikel 5, tweede lid, van de wet][ref1], wordt slechts verleend in zeer uitzonderlijke, onvoorziene
      omstandigheden, die niet aan de inburgeringsplichtige te wijten zijn en waarbij het vasthouden aan de
      inburgeringsplicht voor de inburgeringsplichtige tot een zeer schrijnende situatie leidt.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel5
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '5'
  - number: 2.8.2
    text: |-
      Bij de aanvraag tot gehele ontheffing van de inburgeringsplicht legt de inburgeringsplichtige een advies van het
      college over.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel2.8
  - number: 2.8.3
    text: Onze Minister geeft binnen acht weken na ontvangst van de aanvraag een beschikking.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel2.8
  - number: 2.8.4
    text: |-
      Onze Minister kan ambtshalve besluiten tot het verlenen van de ontheffing. Indien van toepassing adviseert het
      college Onze Minister inzake dit besluit.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel2.8
  - number: 2.8.5
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de aanvraag en het verlenen van de
      ontheffing.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel2.8
  - number: 3.1.1
    text: |-
      Het participatieverklaringstraject wordt wat betreft het onderdeel inleiding op de Nederlandse kernwaarden
      afgelegd door het deelnemen aan een door of namens het college aangeboden inleiding op de Nederlandse
      kernwaarden en wat betreft het onderdeel ondertekenen van de participatieverklaring door het aanwezig zijn bij de
      ondertekeningsbijeenkomst en het aldaar ondertekenen van de participatieverklaring.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.1
  - number: 3.1.2
    text: |-
      Het onderdeel inleiding op de Nederlandse kernwaarden bestaat uit minimaal een activiteit of excursie in het kader
      waarvan aan ten minste een Nederlandse kernwaarde een praktische uitwerking wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.1
  - number: 3.1.3
    text: Het participatieverklaringstraject omvat ten minste 12 uren.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.1
  - number: 3.1.4
    text: |-
      Bij het participatieverklaringstraject worden door het college de aanwezigheid van de inburgeringsplichtige bij de
      inleiding op de Nederlandse kernwaarden en de ondertekening van de participatieverklaring geregistreerd.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.1
  - number: 3.1.5
    text: |-
      Indien in het kader van de brede intake door de inburgeringsplichtige activiteiten zijn verricht die voldoen
      aan het gestelde in dit artikel, kunnen deze bestede uren, in afwijking van [artikel 5.3, vijfde lid][ref1], in
      mindering worden gebracht op de urennorm, genoemd in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel5
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0045555
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '3'
  - number: 3.1.6
    text: |-
      De tekst van de participatieverklaring, bedoeld in [artikel 6, achtste lid, van de wet][ref1], is opgenomen als
      bijlage bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel6
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '6'
  - number: 3.2.1
    text: |-
      De inburgeringsplichtige neemt in het kader van de module Arbeidsmarkt en Participatie deel aan activiteiten die
      erop zijn gericht zijn kennis en vaardigheden te vergroten over de volgende thema’s:
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.2
  - number: 3.2.1.a
    text: beroepenoriëntatie;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.2
  - number: 3.2.1.b
    text: werknemerscompetenties;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.2
  - number: 3.2.1.c
    text: realistisch beroepsbeeld;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.2
  - number: 3.2.1.d
    text: beroepskansen;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.2
  - number: 3.2.1.e
    text: beroepscompetenties verwerven;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.2
  - number: 3.2.1.f
    text: netwerk opbouwen;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.2
  - number: 3.2.1.g
    text: werk vinden; en
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.2
  - number: 3.2.1.h
    text: werkcultuur.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.2
  - number: 3.2.2
    text: |-
      De module Arbeidsmarkt en Participatie wordt afgesloten met een eindgesprek tussen de inburgeringsplichtige en
      het college.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.2
  - number: 3.2.3
    text: |-
      Indien in het kader van de brede intake door de inburgeringsplichtige activiteiten zijn verricht die voldoen
      aan het gestelde in dit artikel, kunnen deze bestede uren, in afwijking van [artikel 5.3, vijfde lid][ref1], in
      mindering worden gebracht op de voor de module Arbeidsmarkt en Participatie geldende urennorm.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel5
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0045555
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '3'
  - number: 3.2.4
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de onderdelen, bedoeld in het
      eerste en tweede lid, waaronder een urennorm.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.2
  - number: '3.3'
    text: |-
      Het inburgeringsexamen bestaat wat betreft de examinering van de mondelinge en schriftelijke vaardigheden in de
      Nederlandse taal, uit de volgende examenonderdelen:
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.3
  - number: 3.3.a
    text: leesvaardigheid;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.3
  - number: 3.3.b
    text: luistervaardigheid;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.3
  - number: 3.3.c
    text: schrijfvaardigheid; en
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.3
  - number: 3.3.d
    text: spreekvaardigheid.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.3
  - number: 3.4.1
    text: |-
      Het inburgeringsexamen bestaat wat betreft de examinering van de kennis van de Nederlandse maatschappij, uit de
      volgende onderwerpen:
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.4
  - number: 3.4.1.a
    text: werk en inkomen;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.4
  - number: 3.4.1.b
    text: omgangsvormen, waarden en normen;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.4
  - number: 3.4.1.c
    text: wonen;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.4
  - number: 3.4.1.d
    text: gezondheid en gezondheidszorg;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.4
  - number: 3.4.1.e
    text: geschiedenis en geografie;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.4
  - number: 3.4.1.f
    text: instanties;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.4
  - number: 3.4.1.g
    text: staatsinrichting en rechtsstaat; en
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.4
  - number: 3.4.1.h
    text: onderwijs en opvoeding.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.4
  - number: 3.4.2
    text: |-
      Bij ministeriële regeling worden de onderwerpen, genoemd in het eerste lid, nader uitgewerkt in te behalen
      eindtermen.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.4
  - number: 3.5.1
    text: |-
      Het examen van mondelinge en schriftelijke vaardigheden in de Nederlandse taal op ten minste het niveau B1,
      bedoeld in [artikel 7, eerste lid, onderdeel a, van de wet][ref1], vindt plaats overeenkomstig de regels van het
      [Staatsexamenbesluit Nederlands als tweede taal][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006192
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0006192
  - number: 3.5.2
    text: 'Onze Minister stelt de volgende examens vast:'
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.5
  - number: 3.5.2.a
    text: |-
      het examen kennis van de Nederlandse maatschappij, bedoeld in
      [artikel 7, eerste lid, onderdeel b, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel7
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '7'
  - number: 3.5.2.b
    text: |-
      het examen van mondelinge en schriftelijke vaardigheden in de Nederlandse taal op het niveau A2 van het
      Gemeenschappelijk Europees Referentiekader voor Moderne Vreemde Talen.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.5
  - number: 3.5.3
    text: De examens, bedoeld in het tweede lid, worden afgenomen door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.5
  - number: 3.5.4
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de toepassing van het tweede en derde lid,
      onder meer omtrent de wijze van examineren en de beoordeling van de examens.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.5
  - number: 3.6.1
    text: |-
      Degene die wenst te worden toegelaten tot de examens, bedoeld in [artikel 3.5, tweede lid][ref1], meldt zich
      daartoe schriftelijk aan overeenkomstig de bij ministeriële regeling gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel3
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0045555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
  - number: 3.6.2
    text: Onze Minister bevestigt de aanmelding schriftelijk.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.6
  - number: 3.7.1
    text: |-
      Bij ministeriële regeling worden regels gesteld over de hoogte en het betalen van het examengeld, voor de examens,
      bedoeld in [artikel 3.5, tweede lid][ref1], en op welke wijze het verschuldigde examengeld wordt voldaan, waarbij
      onderscheid kan worden gemaakt tussen groepen inburgeringsplichtigen.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel3
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0045555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
  - number: 3.7.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent het kosteloos afleggen van een of meerdere
      examenpogingen van onderdelen van het inburgeringsexamen door groepen van inburgeringsplichtigen, in welk geval
      Onze Minister het examengeld voor het afleggen van het staatsexamen Nederlands als tweede taal voldoet.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.7
  - number: '3.8'
    text: |-
      Op verzoek van degene die de examens, bedoeld in [artikel 3.5, tweede lid][ref1], afneemt
      of daarop toezicht houdt, identificeert de kandidaat zich met een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0045555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 3.9.1
    text: |-
      Onze Minister kan de kandidaat met een psychische of lichamelijke belemmering, of een verstandelijke beperking op
      diens verzoek in de gelegenheid stellen om de examens, bedoeld in [artikel 3.5, tweede lid][ref1], af te leggen op
      een wijze die is aangepast aan zijn mogelijkheden.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel3
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0045555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
  - number: 3.9.2
    text: |-
      De inburgeringsplichtige kan kosteloos een deskundigenverklaring aanvragen van een door Onze Minister aangewezen
      arts, niet zijnde de behandeld arts van de inburgeringsplichtige, die is ingeschreven in het register, bedoeld in
      [artikel 3, eerste lid, van de Wet op de beroepen in de individuele gezondheidszorg][ref1], waarin deze arts zich
      uitlaat over de noodzaak tot het treffen van aangepaste examenomstandigheden bij het afleggen van een of meerdere
      onderdelen van het inburgeringsexamen en welke mogelijke aangepaste examenomstandigheden dit kunnen betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
  - number: 3.9.3
    text: |-
      Bij het verzoek, bedoeld in het eerste lid, legt de kandidaat de deskundigenverklaring, bedoeld in het tweede lid,
      over, waaruit blijkt dat hij een of meerdere van de examens, bedoeld in het eerste lid, slechts kan afleggen op een
      wijze die is aangepast aan zijn mogelijkheden.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.9
  - number: 3.9.4
    text: |-
      Indien Onze Minister bij de toepassing van [artikel 2.7][ref1] heeft geoordeeld dat de inburgeringsplichtige een
      of meerdere van de examens, bedoeld in het eerste lid, slechts kan afleggen op een wijze die is aangepast aan de
      mogelijkheden van die inburgeringsplichtige, legt de kandidaat bij de aanmelding voor het voornoemde examen, de
      beschikking, bedoeld in het vierde lid, onderdeel a, van dat artikel over.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel2
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0045555
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '4'
  - number: 3.9.5
    text: Bij ministeriële regeling worden regels gesteld over de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.9
  - number: 3.10.1
    text: |-
      Indien een kandidaat zich ten aanzien van een onderdeel van de examens, bedoeld in
      [artikel 3.5, tweede lid][ref1], aan enige onregelmatigheid schuldig maakt of heeft gemaakt, kan Onze Minister
      het betreffende examen ongeldig verklaren en bepalen dat de kandidaat het examen of een onderdeel daarvan opnieuw
      moet afleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel3
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0045555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
  - number: 3.10.2
    text: |-
      Indien de onregelmatigheid eerst na afloop van het examen wordt ontdekt, kan Onze Minister het examenresultaat
      ongeldig verklaren.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.10
  - number: 3.10.3
    text: |-
      Indien de onregelmatigheid eerst na het verstrekken van het inburgeringsdiploma wordt ontdekt, kan het
      examenresultaat van het betreffende examen ongeldig worden verklaard en kan Onze Minister het inburgeringsdiploma
      intrekken.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.10
  - number: '3.11'
    text: |-
      Bij ministeriële regeling worden normen voor de kwaliteit van de examinering van de examens, bedoeld in
      [artikel 3.5, tweede lid][ref1], vastgesteld die in ieder geval betrekking hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel3
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0045555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
  - number: 3.11.a
    text: de afname van de examens;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.11
  - number: 3.11.b
    text: de voorwaarden voor toelating tot de examens;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.11
  - number: 3.11.c
    text: de deskundigheid van de beoordelaars;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.11
  - number: 3.11.d
    text: het vaststellen van de uitslag van de examens;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.11
  - number: 3.11.e
    text: de waarborging van de kwaliteit van de examinering;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.11
  - number: 3.11.f
    text: de procedures en sancties bij onregelmatigheden.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.11
  - number: '3.12'
    text: |-
      Bij ministeriële regeling worden regels gesteld over de procedure tot een aanvraag van een gedeeltelijke
      vrijstelling van het inburgeringsexamen als bedoeld in [artikel 7, derde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel7
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '7'
  - number: '3.13'
    text: |-
      De advisering met betrekking tot voor onderdelen van het inburgeringsexamen vrijstellende buitenlandse diploma’s,
      certificaten of andere documenten, wordt uitgevoerd door een of meer bij ministeriële regeling aangewezen
      organisaties.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.13
  - number: 3.14.1
    text: |-
      Het college biedt de inburgeringsplichtige de onderdelen van de zelfredzaamheidsroute aan, waarbij de invulling van
      deze onderdelen wordt afgestemd op het vermogen en de ontwikkelbehoeften van de inburgeringsplichtige.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.14
  - number: 3.14.2
    text: 'De zelfredzaamheidsroute bestaat voor asielstatushouders uit de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.14
  - number: 3.14.2.a
    text: |-
      in totaal 800 cursusuren gevolgd bij een cursusinstelling die voldoet aan het bepaalde op grond van
      [artikel 32 van de wet][ref1], bestaande uit:


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel32
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '32'
  - number: 3.14.2.a.i
    text: |-
      cursusuren Nederlands als tweede taal, waarvan alfabetiseringsonderwijs onderdeel kan zijn, onder persoonlijke
      begeleiding van een NT2-docent; en
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.14
  - number: 3.14.2.a.ii
    text: cursusuren kennis van de Nederlandse maatschappij.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.14
  - number: 3.14.2.b
    text: |-
      in totaal 800 uren besteed aan activiteiten gericht op zelfredzaamheid, activering en participatie in de
      Nederlandse maatschappij, waarbij de activiteiten:
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.14
  - number: 3.14.2.b.i
    text: plaatsvinden in een Nederlandstalige omgeving; en
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.14
  - number: 3.14.2.b.ii
    text: niet in isolement plaatsvinden; en
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.14
  - number: 3.14.2.c
    text: een eindgesprek met het college.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.14
  - number: 3.14.3
    text: Het tweede lid, onderdeel a en c, zijn van toepassing op gezinsmigranten en overige migranten.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.14
  - number: 3.14.4
    text: |-
      Het college verleent geen mandaat of machtiging aan een derde, met uitzondering van een openbaar lichaam als
      bedoeld in [artikel 8 van de Wet gemeenschappelijke regelingen][ref1], met betrekking tot de taak, bedoeld in het
      tweede lid, onderdeel c.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '8'
  - number: 3.14.5
    text: |-
      De uren gemoeid met de module Arbeidsmarkt en Participatie en het participatieverklaringstraject worden in
      mindering gebracht op de urennorm, bedoeld in het tweede lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.14
  - number: 3.14.6
    text: |-
      Indien in het kader van de brede intake door de inburgeringsplichtige cursusuren Nederlands als tweede taal of
      kennis van de Nederlandse maatschappij zijn gevolgd of activiteiten zijn verricht, of gedurende de brede intake
      activiteiten zijn verricht in het kader van de [Participatiewet][ref1], of in het kader van de maatschappelijke
      begeleiding, bedoeld in [artikel 13 van de wet][ref2], activiteiten zijn verricht, die voldoen aan het gestelde in
      dit artikel, kunnen de hiermee gemoeide uren, in afwijking van [artikel 5.3, vijfde lid][ref3], in mindering worden
      gebracht op de urennorm, die geldt op grond van het tweede of achtste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0044770#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0045555#Artikel5
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0044770
        artikel: '13'
      - id: ref3
        bwb_id: BWBR0045555
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '3'
  - number: 3.14.7
    text: |-
      Indien de inburgeringsplichtige een of meerdere van de examenonderdelen, genoemd in
      [artikel 3.3, aanhef en onderdeel a tot en met d][ref1], op het niveau A2, of het examenonderdeel, genoemd in
      [artikel 3.4][ref2], wenst af te leggen en het college de inburgeringsplichtige daartoe in staat acht, legt het
      college dit vast in het persoonlijk plan inburgering en participatie.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045555#Artikel3
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0045555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0045555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: 3.14.8
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de onderdelen, bedoeld in het
      tweede lid, waarbij voor inburgeringsplichtigen met een auditieve of visuele beperking onder nader vast te stellen
      voorwaarden, een lagere urennorm kan worden vastgesteld dan de norm, bedoeld in het tweede lid, onderdeel a, of
      voor deze groep kan worden vastgesteld dat voor bepaalde vaardigheden van een cursus Nederlands als tweede taal,
      geen cursusuren hoeven te worden gevolgd.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.14
  - number: 3.15.1
    text: |-
      Degene die heeft voldaan aan de inburgeringsplicht en in dat kader het inburgeringsexamen of de onderwijsroute
      heeft behaald, ontvangt een inburgeringsdiploma.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.15
  - number: 3.15.2
    text: Onze Minister verstrekt het inburgeringsdiploma.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.15
  - number: 3.15.3
    text: Het inburgeringsdiploma wordt ondertekend door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.15
  - number: 3.15.4
    text: |-
      Duplicaten van het inburgeringsdiploma worden tegen betaling van de kostprijs, uitsluitend door Onze Minister
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.15
  - number: 3.15.5
    text: Bij ministeriële regeling wordt de tekst van het inburgeringsdiploma vastgesteld.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.15
  - number: 3.16.1
    text: |-
      Degene die heeft voldaan aan de inburgeringsplicht en in dat kader de zelfredzaamheidsroute heeft behaald, ontvangt
      een inburgeringscertificaat.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.16
  - number: 3.16.2
    text: Onze Minister verstrekt het inburgeringscertificaat.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.16
  - number: 3.16.3
    text: Het inburgeringscertificaat wordt ondertekend door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.16
  - number: 3.16.4
    text: |-
      Duplicaten van inburgeringscertificaten worden tegen betaling van de kostprijs, uitsluitend door Onze Minister
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.16
  - number: 3.16.5
    text: |-
      Bij ministeriële regeling wordt de tekst van het inburgeringscertificaat vastgesteld en kunnen regels worden
      gesteld over de wijze van afgifte van het inburgeringscertificaat.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.16
  - number: 3.17.1
    text: |-
      Aan de inburgeringsplichtige, bedoeld in [artikel 10 van de wet][ref1], wordt door Onze Minister dan wel door een
      op grond van artikel 10 van de wet aangewezen instelling een aanbod tot voorbereiding op de inburgering gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel10
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '10'
  - number: 3.17.2
    text: 'De voorbereiding op de inburgering bestaat uit de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.17
  - number: 3.17.2.a
    text: een cursus Nederlands als tweede taal;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.17
  - number: 3.17.2.b
    text: een introductiemodule Arbeidsmarkt en Participatie;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.17
  - number: 3.17.2.c
    text: een introductiemodule kennis van de Nederlandse maatschappij; en
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.17
  - number: 3.17.2.d
    text: een introductiemodule participatieverklaringstraject.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.17
  - number: 3.17.3
    text: De deelname aan voorbereiding op de inburgering is kosteloos en deelname kan niet worden verplicht.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.17
  - number: 3.17.4
    text: Deelname aan voorbereiding op de inburgering mag het inburgeringstraject in geen geval vertragen.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.17
  - number: 3.18.1
    text: Onze Minister bekostigt de voorbereiding op de inburgering.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.18
  - number: 3.18.2
    text: |-
      De kosten voor de uitvoering van deze taak door de aangewezen instelling, bedoeld in
      [artikel 3.17, eerste lid][ref1], komen ten laste van de begroting van het Ministerie van Sociale Zaken en
      Werkgelegenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel3
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0045555
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '6'
  - number: '3.19'
    text: |-
      Op verzoek van de inburgeringsplichtige zullen de door Onze Minister aangewezen organisaties kosteloos het door
      de inburgeringsplichtige behaalde internationale diploma of de behaalde opleidingsjaren waarderen dan wel een
      indicatie geven van het door de inburgeringsplichtige behaalde onderwijsniveau.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel3.19
  - number: '4.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder termijn de termijn, bedoeld in [artikel 11, eerste lid, van de wet][ref1],
      de op grond van [artikel 12 van de wet][ref2] verlengde termijn, of de vastgestelde nieuwe termijn, bedoeld in de
      [artikelen 24, tweede en derde lid][ref3], en [25, tweede lid, van de wet][ref4], tenzij anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0044770#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0044770#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0044770#Artikel25
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0044770
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0044770
        artikel: '24'
      - id: ref4
        bwb_id: BWBR0044770
        artikel: '25'
  - number: '4.2'
    text: |-
      De termijn wordt verlengd met de duur van de periode, bedoeld in [artikel 2.1, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel2
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0045555
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 4.3.1
    text: |-
      De inburgeringsplichtige treft geen verwijt ter zake van het niet tijdig voldoen aan de inburgeringsplicht, indien
      hij aannemelijk maakt dat zich gedurende de periode van de termijn een omstandigheid heeft voorgedaan waardoor hij
      niet in staat is geweest deel te nemen aan activiteiten die erop zijn gericht te voldoen aan de inburgeringsplicht
      en dit hem in alle redelijkheid niet te verwijten valt.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel4.3
  - number: 4.3.2
    text: |-
      De inburgeringsplichtige treft geen verwijt ter zake van het niet tijdig voldoen aan de inburgeringsplicht,
      indien hij aantoont dat hij gedurende de termijn, bedoeld in [artikel 11, eerste lid, van de wet][ref1], een
      bij ministeriële regeling aan te wijzen niet vrijstellende opleiding volgt of volgde, of deze opleiding na het
      verstrijken van de termijn, bedoeld in artikel 11 van de wet, of de op grond van [artikel 12 van de wet][ref2]
      verlengde termijn, nog voortzet.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0044770#Artikel12
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0044770
        artikel: '12'
  - number: 4.3.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de duur van de verlenging en de
      toepassing van het eerste en het tweede lid.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel4.3
  - number: 4.4.1
    text: |-
      Onze Minister verlengt de termijn genoemd in [artikel 11, eerste lid, van de wet][ref1], in het geval van
      [artikel 12, eerste lid, onderdeel b, van de wet][ref2], met zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0044770#Artikel12
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0044770
        artikel: '12'
  - number: 4.4.2
    text: |-
      Van aanzienlijke inspanningen als bedoeld in [artikel 12, eerste lid, onderdeel b, van de wet][ref1] is sprake
      indien de inburgeringsplichtige:


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel12
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '12'
  - number: 4.4.2.a
    text: |-
      de B1-route volgt en de spreekvaardigheid, luistervaardigheid, leesvaardigheid en schrijfvaardigheid worden
      geëxamineerd op het niveau dat is vastgelegd in het persoonlijk plan inburgering en participatie, maar ten minste
      op het niveau A2;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel4.4
  - number: 4.4.2.b
    text: |-
      alle taallessen en cursusuren kennis van de Nederlandse maatschappij heeft gevolgd, met uitzondering van
      afwezigheid vanwege geoorloofd verzuim;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel4.4
  - number: 4.4.2.c
    text: |-
      minimaal twee van de vier examenonderdelen als bedoeld in onderdeel a, van het inburgeringsexamen heeft behaald,
      alsmede het onderdeel kennis van de Nederlandse maatschappij; en
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel4.4
  - number: 4.4.2.d
    text: het participatieverklaringstraject en de module Arbeidsmarkt en Participatie heeft afgerond.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel4.4
  - number: 4.4.3
    text: |-
      Voor gezinsmigranten en overige migranten geldt in afwijking van het tweede lid, onderdeel b, dat zij ten minste
      450 uren aan taallessen of cursusuren kennis van de Nederlandse maatschappij hebben gevolgd.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel4.4
  - number: 4.5.1
    text: |-
      Een aanvraag tot verlenging van de voor de inburgeringsplichtige geldende termijn kan niet eerder worden ingediend
      dan zes maanden voor het verstrijken van die termijn. Onze Minister geeft binnen acht weken na ontvangst van de
      aanvraag een beschikking.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel4.5
  - number: 4.5.2
    text: |-
      In bijzondere gevallen die de inburgeringsplichtige betreffen, kan Onze Minister ambtshalve besluiten tot
      verlenging van de voor de inburgeringsplichtige geldende termijn. De beschikking wordt niet eerder gegeven dan zes
      maanden voor het verstrijken van die termijn.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel4.5
  - number: 4.5.3
    text: |-
      In bijzondere gevallen die alle inburgeringsplichtigen of categorieën van inburgeringsplichtigen betreffen, kan
      Onze Minister ambtshalve besluiten tot verlenging van de voor de inburgeringsplichtige geldende termijn voor een
      bij ministeriële regeling te bepalen duur.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel4.5
  - number: 4.5.4
    text: In de beschikking wordt de duur van de verlenging vermeld.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel4.5
  - number: '5.1'
    text: |-
      De maatschappelijke begeleiding, bedoeld in [artikel 13, tweede lid, van de wet][ref1], bevat in ieder geval de
      volgende componenten:


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel13
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '13'
  - number: 5.1.a
    text: |-
      praktische hulp bij het regelen van basisvoorzieningen: ondersteuning en begeleiding bij het regelen van praktische
      zaken ten aanzien van voorzieningen zoals wonen, zorg, werk, inkomen, verzekeringen, onderwijs en kennismaking met
      de lokale woonomgeving;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel5.1
  - number: 5.1.b
    text: |-
      voorlichting over basisvoorzieningen in de Nederlandse samenleving: voorlichting over basisvoorzieningen en thema’s
      zoals wonen, inkomen, werk, zorg, onderwijs, opvoeding en kennismaking met maatschappelijke organisaties.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel5.1
  - number: 5.2.1
    text: |-
      Het college brengt, in aanvulling op de onderdelen, bedoeld in [artikel 14, derde lid, van de wet][ref1], in het
      kader van de brede intake met betrekking tot de inburgeringsplichtige in ieder geval het volgende in kaart:


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel14
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '14'
  - number: 5.2.1.a
    text: het taalniveau;
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel5.2
  - number: 5.2.1.b
    text: de mogelijkheden tot arbeidsparticipatie; en
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel5.2
  - number: 5.2.1.c
    text: de mate van zelfredzaamheid.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel5.2
  - number: 5.2.2
    text: |-
      Het college wijst de inburgeringsplichtige op het recht om de gesprekken in het kader van de brede intake enkel
      met hem persoonlijk te voeren, derhalve zonder de aanwezigheid van enig ander persoon, niet zijnde degene die in de
      hoedanigheid van zijn professie bij de gesprekken aanwezig is.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel5.2
  - number: 5.2.3
    text: |-
      Het college legt de relevante informatie die wordt verkregen in verband met de afname van de brede intake
      schriftelijk vast.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel5.2
  - number: 5.3.1
    text: |-
      Het college stelt het persoonlijk plan inburgering en participatie vast uiterlijk 10 weken na de dag waarop
      Onze Minister de inburgeringsplichtige schriftelijk in kennis heeft gesteld van de inburgeringsplicht. Indien de
      inburgeringsplichtige op de datum van deze kennisgeving nog niet is ingeschreven in de gemeente waar hij op grond
      van [artikel 28 van de Huisvestingswet 2014][ref1] wordt gehuisvest, stelt het college het plan vast uiterlijk 10
      weken na de dag waarop de inburgeringsplichtige in de basisregistratie personen is ingeschreven in de gemeente waar
      hij op grond van artikel 28 van de Huisvestingswet 2014 is gehuisvest.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel28
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '28'
  - number: 5.3.2
    text: |-
      Het college kan afwijken van de termijn, bedoeld in het eerste lid, uitsluitend indien het redelijkerwijs niet
      mogelijk is om het persoonlijk plan inburgering en participatie binnen deze termijn vast te stellen zonder
      informatie van een derde, van welke informatie het college in afwachting is. Uiterlijk twee weken na ontvangst van
      deze informatie stelt het college het plan alsnog vast.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel5.3
  - number: 5.3.3
    text: |-
      Als de inburgeringsplichtige, voor wie het persoonlijk plan inburgering en participatie is opgesteld, zijn
      woonplaats verplaatst naar een andere gemeente, stelt het college van de andere gemeente het voornoemde plan vast
      binnen uiterlijk 10 weken na de datum van inschrijving van de inburgeringsplichtige in deze gemeente.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel5.3
  - number: 5.3.4
    text: |-
      Het college legt het aantal te voeren voortgangsgesprekken met de inburgeringsplichtige vast in het persoonlijk
      plan inburgering en participatie.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel5.3
  - number: 5.3.5
    text: |-
      Inspanningen die een inburgeringsplichtige heeft verricht voorafgaand aan het vaststellen van het persoonlijk plan
      inburgering en participatie, wegen niet mee voor het voldoen aan de inburgeringsplicht, tenzij uitdrukkelijk anders
      is bepaald.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel5.3
  - number: 5.3.6
    text: |-
      Indien het college de leerroute van de inburgeringsplichtige ingevolge [artikel 17, tweede lid, van de wet][ref1],
      opnieuw vaststelt, of ingevolge artikel 17, derde lid, van de wet besluit dat de mondelinge en schriftelijke
      vaardigheden in de Nederlandse taal, in afwijking van [artikel 7, eerste lid, onderdeel a, van de wet][ref2]
      geheel of gedeeltelijk op het niveau A2 worden geëxamineerd, past het college het persoonlijk plan inburgering en
      participatie conform deze wijziging aan.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0044770#Artikel7
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0044770
        artikel: '7'
  - number: 5.4.1
    text: |-
      De termijn, bedoeld in [artikel 17, tweede lid, van de wet][ref1], bedraagt maximaal anderhalf jaar vanaf de
      aanvang van de termijn, bedoeld in [artikel 11, eerste lid, van de wet][ref2], met dien verstande dat gedurende
      het gehele inburgeringstraject de onderwijsroute kan worden gewijzigd in de B1-route.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0044770#Artikel11
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0044770
        artikel: '11'
  - number: 5.4.2
    text: |-
      Indien de inburgeringsplichtige een niet vrijstellende opleiding als bedoeld in [artikel 4.3, tweede lid][ref1],
      heeft afgerond of voortijdig heeft beëindigd na het verstrijken van de termijn, bedoeld in het eerste lid, kan
      het college, in afwijking van de termijn, bedoeld in het eerste lid, na het afronden van deze opleiding de door de
      inburgeringsplichtige te volgen leerroute wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel4
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0045555
        artikel: '4'
        hoofdstuk: '4'
  - number: 5.4.3
    text: |-
      In bijzondere gevallen die de inburgeringsplichtige betreffen, kan het college afwijken van de termijn, bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel5.4
  - number: 5.4.4
    text: 'Bij het wijzigen van leerroute geldt dat bij het wijzigen van:'
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel5.4
  - number: 5.4.4.a
    text: 'de onderwijsroute of de zelfredzaamheidsroute naar de B1-route:'
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel5.4
  - number: 5.4.4.a.i
    text: |-
      bij het bepalen van de intensiteit van de leerroute rekening wordt gehouden met de reeds gevolgde cursusuren
      Nederlands als tweede taal en cursusuren kennis van de Nederlandse maatschappij bij een instelling
      als bedoeld in [artikel 8, tweede lid, van de wet][ref1] of met de gevolgde cursusuren, bedoeld in
      [artikel 3.14, tweede lid, onderdeel a][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0045555#Artikel3
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel5.4
    references:
