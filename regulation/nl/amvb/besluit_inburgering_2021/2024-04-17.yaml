    text: Onze Minister verstrekt het college gegevens over opgelegde boetes.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.6
  - number: 9.6.6
    text: |-
      Cursusinstellingen verstrekken Onze Minister de inschrijvingsgegevens van de inburgeringsplichtige, en van
      gezinsmigranten en overige migranten gegevens over de voortgang van de leerroute, de aanwezigheid en geleverde
      inspanningen.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.6
  - number: 9.6.7
    text: |-
      Het College voor toetsen en examens, genoemd in [artikel 2 van de Wet College voor toetsen en examens][ref1],
      verstrekt Onze Minister gegevens over de examendeelname en examenresultaten staatsexamen Nederlands als tweede
      taal.


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel9.6
    references:
