        hoofdstuk: '10'
  - number: '10.5'
    text: |-
      Indien in een kalenderjaar de uitkering, bedoeld in [artikel 40, eerste lid, van de wet][ref1], niet volledig
      is besteed aan inburgeringsvoorzieningen, kan het college het niet bestede bedrag tot maximaal 100% van de voor
      dat jaar toegekende uitkering reserveren voor besteding aan inburgeringsvoorzieningen in het daaropvolgende
      kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel40
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.5
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '40'
  - number: '10.6'
    text: |-
      Indien in een kalenderjaar de netto lasten van gemeenten ten behoeve van inburgeringsvoorzieningen, de uitkering,
      bedoeld in [artikel 40, eerste lid, van de wet][ref1] overstijgt, dan worden de lasten administratief door Onze
      Minister toegerekend aan het volgende kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel40
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '40'
  - number: 10.7.1
    text: |-
      Voor de terugvordering, bedoeld in [artikel 42, tweede lid, van de wet][ref1], wordt uitgegaan van de gegevens
      waarvan Onze Minister kennis heeft op 30 september van het jaar volgend op het verantwoordingsjaar, met dien
      verstande dat gegevens die het college op verzoek van Onze Minister op een latere datum verstrekt mede in
      aanmerking worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel42
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.7
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '42'
  - number: 10.7.2
    text: |-
      Indien [artikel 18 van de wet][ref1] van toepassing is, kan voor de terugvordering, bedoeld in
      [artikel 42, tweede lid, van de wet][ref2], de informatie in aanmerking worden genomen die het
      openbaar lichaam heeft verantwoord over het jaar waarop de terugvordering betrekking heeft. De
      eerste zin is slechts van toepassing indien de bedoelde informatie is vastgesteld overeenkomstig
      [artikel 34a van de Wet gemeenschappelijke regelingen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0044770#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0003740#Artikel34a
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.7
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0044770
        artikel: '42'
      - id: ref3
        bwb_id: BWBR0003740
        artikel: 34a
  - number: 10.8.1
    text: |-
      Iedere maand wordt op of omstreeks de vijftiende dag van die maand een twaalfde deel van het voor dat kalenderjaar
      vastgestelde uitkering bedoeld in [artikel 40, eerste lid, van de wet][ref1], betaald


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel40
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.8
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '40'
  - number: 10.8.2
    text: |-
      Na de definitieve vaststelling van de uitkering wordt deze, indien hoger is vastgesteld in één keer nabetaald en
      indien lager is vastgesteld in één keer teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.8
  - number: '12.1'
    text: |-
      Het [Besluit inburgering][ref1] wordt ingetrokken, met dien verstande dat zij van toepassing blijft op degene op
      wie de [Wet inburgering][ref2] van toepassing was op de dag voorafgaand aan de inwerkingtreding van de [wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020674
      [ref2]: https://wetten.overheid.nl/BWBR0020611
      [ref3]: https://wetten.overheid.nl/BWBR0044770
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel12.1
    references:
      - id: ref1
        bwb_id: BWBR0020674
      - id: ref2
        bwb_id: BWBR0020611
      - id: ref3
        bwb_id: BWBR0044770
  - number: 12.1a.1
    text: |-
      In afwijking van [artikel 4.13, vierde lid, van het Besluit inburgering][ref1], wordt de schuld, bedoeld in dat
      artikel, door Onze Minister ambtshalve, geheel of gedeeltelijk kwijtgescholden volgens de bij regeling, krachtens
      artikel 4.13, eerste lid, van dat besluit, aangewezen gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel12.1a
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
  - number: 12.1a.2
    text: |-
      In [artikel 4.5, eerste lid, van het Besluit inburgering][ref1], wordt «over de maand oktober» gelezen als «over de
      maand september».


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel12.1a
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
  - number: 12.1a.3
    text: |-
      Bij de vaststelling van het termijnbedrag op grond van [artikel 4.8 van het Besluit inburgering][ref1]
      stelt Onze Minister de draagkracht van de debiteur ambtshalve vast overeenkomstig
      [artikel 4.10 van het Besluit inburgering][ref2]. Het termijnbedrag wordt in afwijking van
      [artikel 4.7, tweede lid, van het Besluit inburgering][ref3] lager vastgesteld indien het bedrag van de draagkracht
      lager is dan de hoogte van het maandelijkse termijnbedrag, bedoeld in dat artikel. Bij ministeriële regeling worden
      nadere regels gesteld ten aanzien van de wijze waarop de draagkracht van de debiteur wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel12.1a
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020674
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0020674
        artikel: '4'
  - number: 12.1a.4
    text: 'Het college kan desgevraagd, of uit eigen beweging, begeleiding aanbieden aan degene die:'
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel12.1a
  - number: 12.1a.4.a
    text: |-
      inburgeringsplichtige is als bedoeld in artikel in [artikel 4.1a, derde lid, van het Besluit inburgering][ref1], en
      inburgeringsplichtig is onder de [Wet inburgering][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020611
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel12.1a
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020611
  - number: 12.1a.4.b
    text: |-
      een bij ministeriële regeling te bepalen percentage van zijn lening, bedoeld in
      [artikel 4.1a van het Besluit inburgering][ref1], heeft uitgeput.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel12.1a
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
  - number: 12.1a.5
    text: |-
      Voor de toepassing van [artikel 2.4a, eerste lid, onderdeel b, van het Besluit inburgering][ref1] op verzoeken
      ingediend op of na 1 januari 2024 luidt de formule: M * 48 * 6, waarbij M staat voor het minimumuurloon, bedoeld in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref2], met inbegrip van de
      vakantiebijslag, bedoeld in [artikel 15 van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
