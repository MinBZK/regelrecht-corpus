    text: |-
      Voor de variabelen in de formules, bedoeld in de [artikelen 10.1][ref1] en [10.2][ref2], geldt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0045555#Artikel10
