        artikel: '10'
        hoofdstuk: '10'
  - number: 10.3.5
    text: |-
      Bij de berekening van de voorlopige uitkering, bedoeld in [artikel 10.1][ref1], en de definitieve uitkering,
      bedoeld in [artikel 10.2][ref2], zal in het eerste jaar nadat bij ministeriële regeling aan het aantal met
      een inburgeringsdiploma of inburgeringscertificaat afgeronde inburgeringstrajecten in jaar t-2, bedoeld in
      artikelen 10.1, vierde lid, onderdeel e en 10.2, derde lid, onderdeel c, een gewicht wordt toegekend dat groter
      is dan 0, alle vanaf de inwerkingtreding van de [wet][ref3] aangevangen en inmiddels met een inburgeringsdiploma
      of inburgeringscertificaat afgeronde inburgeringstrajecten van asielstatushouders tot en met jaar t-2 worden
      meegeteld.


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0045555#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0044770
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.3
