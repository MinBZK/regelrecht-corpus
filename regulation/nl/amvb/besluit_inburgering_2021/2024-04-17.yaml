      het landelijk aantal asielstatushouders, bedoeld in [artikel 10.2, tweede lid, onderdeel a][ref1], en het aantal
      asielstatushouders, bedoeld in artikel 10.2, derde lid, onderdeel a, worden bepaald aan de hand van gegevens van
      DUO met als peildatum voor de woongemeente jaar t;


      [ref1]: https://wetten.overheid.nl/BWBR0045555#Artikel10
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel10.4
    references:
