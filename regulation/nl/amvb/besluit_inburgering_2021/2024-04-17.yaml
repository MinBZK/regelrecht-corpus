  - number: 2.2.2
    text: |-
      Het doel van het verblijf van een houder van een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 14 van de Vreemdelingenwet 2000][ref1], verleend onder een andere beperking dan bedoeld in het eerste
      lid, is tijdelijk in de zin van [artikel 3, eerste lid, onderdeel a, van de wet][ref2], indien zulks met
      toepassing van [artikel 3.5, vierde lid, van het Vreemdelingenbesluit 2000][ref3] is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0044770#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0045555/2024-04-17#Artikel2.2
