  - number: '5'
    text: |-
      1 De elektronische handtekening, bedoeld in
      [artikel 30c, derde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1] en
      [artikel 8:36d, tweede lid, van de Algemene wet bestuursrecht][ref2], voldoet aan de volgende eisen:

      a. de ondertekenaar heeft zich geauthentiseerd met een middel dat voldoet aan de eisen gesteld in [artikel 3][ref3]
      van dit besluit; en

      b. zij is op zodanige wijze verbonden aan het elektronische bestand waarop zij betrekking heeft, dat de identiteit
      van de ondertekenaar, het moment van ondertekening en elke wijziging na ondertekening van het document kunnen
      worden achterhaald.

      2 In afwijking van het eerste lid, onder a, voldoet de handtekening die handmatig op een elektronische
      gegevensdrager wordt geschreven aan de volgende eisen:

      a. zij heeft plaatsgevonden in het bijzijn van een rechter of griffier of is gezet door een rechter of griffier; en

      b. zij is op zodanige wijze verbonden aan het elektronische bestand waarop zij betrekking heeft, dat de identiteit
      van de ondertekenaar, het moment van ondertekening en elke wijziging na ondertekening van het document kunnen
      worden achterhaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel30c
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel836d
      [ref3]: https://wetten.overheid.nl/BWBR0038338#Artikel3
