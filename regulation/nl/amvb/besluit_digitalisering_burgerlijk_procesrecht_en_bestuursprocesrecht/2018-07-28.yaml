---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_digitalisering_burgerlijk_procesrecht_en_bestuursprocesrecht
regulatory_layer: AMVB
publication_date: '2020-10-30'
valid_from: '2018-07-28'
bwb_id: BWBR0038338
url: https://wetten.overheid.nl/BWBR0038338/2018-07-28
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Veiligheid en Justitie van 3 september 2015, nr. 680800;

    Gelet op de artikel en 30c, derde lid, 30f, 30n, achtste lid, van het Wetboek van Rechtsvordering, artikelen 8:36b,
    tweede lid, 8:36d, tweede lid en 8:36f van de Algemene wet bestuursrecht en artikel 24, tweede lid, van de Wet
    bescherming persoonsgegevens;

    De Afdeling advisering van de Raad van State gehoord (advies van 7 oktober 2016, nr. W03.15.0303/II);

    Gezien het nader rapport van Onze Minister van Veiligheid en Justitie van 12 juli 2016, nr. 780952;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit worden onder rechterlijke instanties verstaan:'
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel1
  - number: 1.a
    text: |-
      de gerechten zoals bedoeld in [artikel 2 van de Wet op de Rechterlijke Organisatie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel2
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '2'
  - number: 1.b
    text: de Afdeling bestuursrechtspraak van de Raad van State;
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel1
  - number: 1.c
    text: het College van Beroep voor het bedrijfsleven;
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel1
  - number: 1.d
    text: de Centrale Raad van Beroep.
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel1
  - number: '2.1'
    text: |-
      De rechterlijke instanties stellen een digitaal systeem voor gegevensverwerking ter beschikking. Dit systeem
      voldoet aan de volgende eisen:
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel2
  - number: 2.1.a
    text: de gebruiker van het systeem wordt geïdentificeerd;
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel2
  - number: 2.1.b
    text: na te gaan is wie wordt beschouwd als verzender van een bericht;
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel2
  - number: 2.1.c
    text: na te gaan is of een bericht is gewijzigd na het moment van verzending;
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel2
  - number: 2.1.d
    text: na te gaan is op welk tijdstip een bericht is ontvangen respectievelijk ter beschikking is gesteld in het systeem;
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel2
  - number: 2.1.e
    text: na te gaan is wanneer zich een storing in het systeem voordoet en heeft voorgedaan; en
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel2
  - number: 2.1.f
    text: |-
      de stukken in het digitale dossier zijn in het systeem uitsluitend toegankelijk voor personen die daarvoor zijn
      geautoriseerd.
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel2
  - number: '2.2'
    text: |-
      Het digitale systeem, genoemd in het eerste lid, is ingericht volgens nationale en internationale standaarden voor
      informatiebeveiliging. Bij ministeriële regeling kan worden bepaald aan welke standaarden dit digitale systeem in
      ieder geval voldoet.
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel2
  - number: '3'
    text: |-
      Authenticatie om toegang te krijgen tot een digitaal systeem voor gegevensverwerking van de rechterlijke
      instanties, vindt plaats met een middel dat voldoet aan de volgende eisen:
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel3
  - number: 3.a
    text: het is uitgegeven door de overheid of een onder toezicht van de overheid staande organisatie;
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel3
  - number: 3.b
    text: het gaat uit van een tweefactorauthenticatie; en
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel3
  - number: 3.c
    text: het is aangewezen door de rechterlijke instanties.
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel3
  - number: '4.1'
    text: |-
      Degene die een gerechtelijke procedure start of daarbij is betrokken en gebruik
      maakt of dient te maken van stukkenwisseling langs elektronische weg als bedoeld
      in [artikel 30c van het Wetboek van Burgerlijke Rechtsvordering][ref1] en
      [artikel 8:36a van de Algemene wet bestuursrecht][ref2], gebruikt voor het elektronisch indienen en ophalen van
      berichten een door de rechterlijke instanties aangewezen digitaal systeem voor gegevensverwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel30c
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 30c
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '4.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld aan de wijze waarop berichten worden ingediend langs
      de weg als bedoeld in het eerste lid. Tevens kunnen nadere regels worden gesteld die betrekking hebben op de eisen
      waaraan een bericht dient te voldoen dat langs deze weg wordt ingediend.
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel4
  - number: '4.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld die betrekking hebben op de eisen waaraan
      het door een gerechtsdeurwaarder te betekenen oproepingsbericht, bedoeld in de [artikelen 112][ref1] en
      [113 van het Wetboek van Burgerlijke Rechtsvordering][ref2], moet voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel112
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel113
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '112'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '113'
  - number: '5.1'
    text: |-
      De elektronische handtekening, bedoeld in
      [artikel 30c, derde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1] en
      [artikel 8:36d, tweede lid, van de Algemene wet bestuursrecht][ref2], voldoet aan de volgende eisen:


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel30c
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 30c
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 5.1.a
    text: |-
      de ondertekenaar heeft zich geauthentiseerd met een middel dat voldoet aan de eisen gesteld in [artikel 3][ref1]
      van dit besluit; en


      [ref1]: https://wetten.overheid.nl/BWBR0038338#Artikel3
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0038338
        artikel: '3'
  - number: 5.1.b
    text: |-
      zij is op zodanige wijze verbonden aan het elektronische bestand waarop zij betrekking heeft, dat de identiteit van
      de ondertekenaar, het moment van ondertekening en elke wijziging na ondertekening van het document kunnen worden
      achterhaald.
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel5
  - number: '5.2'
    text: |-
      In afwijking van het eerste lid, onder a, voldoet de handtekening die handmatig op een elektronische gegevensdrager
      wordt geschreven aan de volgende eisen:
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel5
  - number: 5.2.a
    text: zij heeft plaatsgevonden in het bijzijn van een rechter of griffier of is gezet door een rechter of griffier; en
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel5
  - number: 5.2.b
    text: |-
      zij is op zodanige wijze verbonden aan het elektronische bestand waarop zij betrekking heeft, dat de identiteit van
      de ondertekenaar, het moment van ondertekening en elke wijziging na ondertekening van het document kunnen worden
      achterhaald.
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel5
  - number: '6.1'
    text: Indien een natuurlijk persoon over een burgerservicenummer beschikt, is
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel6
  - number: 6.1.a
    text: degene die beroepsmatig rechtsbijstand verleent,
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel6
  - number: 6.1.b
    text: de gerechtsdeurwaarder, of
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel6
  - number: 6.1.c
    text: een andere gemachtigde in zaken waarin partijen in persoon kunnen procederen,
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel6
  - number: '6.2'
    text: |-
      De gerechtsdeurwaarder is tevens bevoegd om bij het indienen van de procesinleiding en het exploot van betekening
      het burgerservicenummer van de verweerder te verwerken, indien deze een natuurlijke persoon is die hierover
      beschikt.
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel6
  - number: '7'
    text: |-
      In aanvulling op [artikel 30c, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1] en
      [artikel 8:36b, tweede lid, van de Algemene wet bestuursrecht][ref2] geldt de verplichting tot procederen
      langs elektronische weg niet voor een onderneming of rechtspersoon die niet op grond van [artikel 5][ref3] of
      [artikel 6 Handelsregisterwet][ref4] is ingeschreven in het handelsregister, tenzij deze wordt vertegenwoordigd
      door een derde die in Nederland verplicht is tot digitaal procederen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel30c
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0021777#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0021777#Artikel6
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 30c
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0021777
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0021777
        artikel: '6'
  - number: '8'
    text: |-
      Indien op de laatste dag van een voor de indiener geldende termijn voor indiening van een bericht een niet aan
      hem toerekenbare verstoring plaatsvindt van de toegang tot een digitaal systeem voor gegevensverwerking van de
      rechterlijke instanties, is een daardoor veroorzaakte overschrijding van die termijn verschoonbaar indien het
      bericht uiterlijk wordt ingediend op de eerstvolgende dag na de dag waarop de indiener ermee bekend had kunnen zijn
      dat de verstoring is verholpen. [Artikel 1, eerste lid, van de Algemene termijnenwet][ref1] is van overeenkomstige
      toepassing op deze eerstvolgende dag.


      [ref1]: https://wetten.overheid.nl/BWBR0002448#Artikel1
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002448
        artikel: '1'
  - number: '9'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel9
  - number: '10.1'
    text: |-
      Dit besluit berust mede op
      [artikel 46, tweede lid, van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Artikel46
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0040940
        artikel: '46'
  - number: '10.2'
    text: 'Dit besluit wordt aangehaald als: Besluit digitalisering burgerlijk procesrecht en bestuursprocesrecht.'
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel10
