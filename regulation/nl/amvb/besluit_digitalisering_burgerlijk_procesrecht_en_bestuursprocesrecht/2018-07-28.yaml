articles:
  - number: '1'
    text: |-
      In dit besluit worden onder rechterlijke instanties verstaan:

      a. de gerechten zoals bedoeld in [artikel 2 van de Wet op de Rechterlijke Organisatie][ref1];

      b. de Afdeling bestuursrechtspraak van de Raad van State;

      c. het College van Beroep voor het bedrijfsleven;

      d. de Centrale Raad van Beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel2
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '2'
  - number: '2'
    text: >-
      1 De rechterlijke instanties stellen een digitaal systeem voor gegevensverwerking ter beschikking. Dit systeem
      voldoet aan de volgende eisen:


      a. de gebruiker van het systeem wordt geïdentificeerd;


      b. na te gaan is wie wordt beschouwd als verzender van een bericht;


      c. na te gaan is of een bericht is gewijzigd na het moment van verzending;


      d. na te gaan is op welk tijdstip een bericht is ontvangen respectievelijk ter beschikking is gesteld in het
      systeem;


      e. na te gaan is wanneer zich een storing in het systeem voordoet en heeft voorgedaan; en


      f. de stukken in het digitale dossier zijn in het systeem uitsluitend toegankelijk voor personen die daarvoor zijn
      geautoriseerd.


      2 Het digitale systeem, genoemd in het eerste lid, is ingericht volgens nationale en internationale standaarden
      voor informatiebeveiliging. Bij ministeriële regeling kan worden bepaald aan welke standaarden dit digitale systeem
      in ieder geval voldoet.
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel2
  - number: '3'
    text: >-
      Authenticatie om toegang te krijgen tot een digitaal systeem voor gegevensverwerking van de rechterlijke
      instanties, vindt plaats met een middel dat voldoet aan de volgende eisen:


      a. het is uitgegeven door de overheid of een onder toezicht van de overheid staande organisatie;


      b. het gaat uit van een tweefactorauthenticatie; en


      c. het is aangewezen door de rechterlijke instanties.
    url: https://wetten.overheid.nl/BWBR0038338/2018-07-28#Artikel3
  - number: '4'
    text: |-
      1 Degene die een gerechtelijke procedure start of daarbij is betrokken en
      gebruik maakt of dient te maken van stukkenwisseling langs elektronische weg als
      bedoeld in [artikel 30c van het Wetboek van Burgerlijke Rechtsvordering][ref1] en
      [artikel 8:36a van de Algemene wet bestuursrecht][ref2], gebruikt voor het elektronisch indienen en ophalen van
      berichten een door de rechterlijke instanties aangewezen digitaal systeem voor gegevensverwerking.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld aan de wijze waarop berichten worden ingediend
      langs de weg als bedoeld in het eerste lid. Tevens kunnen nadere regels worden gesteld die betrekking hebben op de
      eisen waaraan een bericht dient te voldoen dat langs deze weg wordt ingediend.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld die betrekking hebben op de eisen waaraan
      het door een gerechtsdeurwaarder te betekenen oproepingsbericht, bedoeld in de [artikelen 112][ref3] en
      [113 van het Wetboek van Burgerlijke Rechtsvordering][ref4], moet voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel30c
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel836a
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel112
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel113
