  - number: 3.6.9
    text: |-
      1 De Medisch Adviseur Scheepvaart kan op verzoek aan een zeevarende die in het bezit is van een verklaring die
      gebaseerd is op een ander medisch geneeskundig onderzoek dan bedoeld in [artikel 3.6.2][ref1], eerste lid, een
      geneeskundige verklaring zeevaart afgeven.

      2 De geneeskundige verklaring zeevaart wordt alleen afgegeven als:

      a. de zeevarende voldoet aan medische eisen die naar zijn oordeel gelijkwaardig zijn aan het geheel van de op grond
      van [artikel 6.3.6, eerste lid][ref2], vastgestelde medische eisen;

      b. de verklaring die gebaseerd is op een ander medisch onderzoek niet langer dan twee jaar voor het verzoek is
      afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0050941#Artikel3.6.2
      [ref2]: https://wetten.overheid.nl/BWBR0050941#Artikel6.3.6
