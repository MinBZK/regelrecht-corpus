  - number: 3.1.2
    text: |-
      1 Een vaarbevoegdheidsbewijs, met uitzondering van een vaarbevoegdheidsbewijs voor een gezel, is geldig tot ten
      hoogste vijf jaar na de datum van afgifte.

      2 Een vaarbevoegdheidsbewijs voor een gezel is onbeperkt geldig.

      3 Een vaarbevoegdheidsbewijs waarvoor de aanvraag tot vernieuwing uiterlijk 3 maanden voor de vervaldatum van
      het betreffende vaarbevoegdheidsbewijs wordt ingediend, heeft een geldigheidsduur van ten hoogste vijf jaar na
      de vervaldatum.
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel3.1.2
  - number: 3.1.3
    text: |-
      1 Een vaarbevoegdheidsbewijs wordt vernieuwd indien de houder diensttijd heeft opgedaan in een naar het oordeel van
      Onze Minister relevante functie waarvoor een vaarbevoegdheidsbewijs is vereist en die door de houder op grond van
      de aan hem toegekende bevoegdheden mocht worden vervuld, gedurende ten minste:

      a. 12 maanden in de periode van 5 jaar voorafgaand aan de datum van de aanvraag tot vernieuwing; of

      b. 3 maanden in de periode van 6 maanden voorafgaand aan de datum van de aanvraag tot vernieuwing.

      2 Bij ministeriële regeling wordt voor een vaarbevoegdheidsbewijs aangegeven in welke functie of functies de
      vereiste diensttijd moet zijn opgedaan om in aanmerking te komen voor vernieuwing, waarbij rekening wordt gehouden
      met de volgende criteria:

      a. aan boord van welke categorieën zeeschepen de diensttijd moet zijn opgedaan;

      b. aan boord van welke grootte, klasse of het voortstuwingsvermogen van zeeschepen de diensttijd moet zijn
      opgedaan, en

      c. welke diensttijd, niet opgedaan aan boord van zeeschepen, in aanmerking wordt genomen.

      3 In afwijking van het eerste lid kan de diensttijd in een andere, bij ministeriële regeling vastgestelde, daarmee
      vergelijkbare functie worden vervuld.

      4 De bevoegdheden op een te vernieuwen vaarbevoegdheidsbewijs worden op verzoek van de aanvrager gewijzigd
      indien de aanvrager aantoont ten minste te beschikken over de daarvoor benodigde kennisbewijzen, beroepseisen of
      diensttijd.
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel3.1.3
  - number: 3.1.4
    text: |-
      1 Een vaarbevoegdheidsbewijs of een aanvulling daarop die niet op grond van [artikel 3.1.3][ref1] door Onze
      Minister kan worden vernieuwd, wordt op verzoek vernieuwd indien de houder voorafgaand aan de aanvraag:

      a. gedurende ten minste 3 maanden aaneengesloten diensttijd heeft opgedaan voorafgaand aan de datum van de
      aanvraag tot vernieuwing in een naar het oordeel van Onze Minister relevante functie boven de sterkte voor zover
      de geldigheid van het te vernieuwen vaarbewijs niet langer dan 5 jaar is verstreken als bedoeld in sectie A-1/11,
      onderdeel 5, eerste zinsnede, van de STCW-code;

      b. gedurende ten minste 3 maanden aaneengesloten diensttijd heeft opgedaan voorafgaand aan de datum van de aanvraag
      tot vernieuwing in een naar het oordeel van Onze Minister relevante maar lagere functie dan waarvoor zijn ongeldig
      geworden vaarbevoegdheidsbewijs gold voor zover de geldigheid van het te vernieuwen vaarbewijs niet langer dan
      5 jaar is verstreken en in de 30 maanden direct voor het verstrijken van het vaarbevoegdheidsbewijs ten minste 6
      maanden diensttijd is opgedaan als bedoeld in sectie A-1/11, onderdeel 5, tweede zinsnede, van de STCW-code;

      c. met goed gevolg een test als bedoeld in [artikel 3.1.1, derde lid][ref2], heeft afgerond; of

      d. in het bezit is van een geldig kennisbewijs voor de betreffende functie, bedoeld in
      [artikel 3.1.1, eerste lid][ref3].

      2 Onze Minister geeft op verzoek een tijdelijk vaarbevoegdheidsbewijs af ten behoeve van het opdoen van de
      diensttijd, bedoeld in het eerste lid, onderdeel b.


