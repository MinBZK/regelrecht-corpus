  - number: 2.1.10
    text: |-
      1 Een regeling als bedoeld in [artikel 19, vierde lid, van de wet][ref1] bevat ten minste:

      a. een klachtenprocedure ten behoeve van eerste stuurlieden, respectievelijk eerste maritieme officieren die naar
      hun oordeel op onjuiste gronden niet zijn aangesteld in de functie van kapitein van een zeeschip;

      b. de vaststelling van de werkzaamheden van de commissie, bedoeld in [artikel 19, vijfde lid, van de wet][ref2]; en

      c. de wijze van verkrijging van bij ministeriële regeling aangegeven informatie over de arbeidsmarkt voor
      Nederlandse zeevarenden, welke jaarlijks vóór 1 oktober aan Onze Minister moet worden verstrekt.

      2 Voorafgaand aan de vaststelling of wijziging van een regeling als bedoeld in
      [artikel 19, eerste lid, van de wet][ref3] pleegt Onze Minister overleg daarover met de werkgevers- en
      werknemersorganisaties in de sector koopvaardij, respectievelijk de sector zeegaande waterbouw.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0050681#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0050681#Artikel19
