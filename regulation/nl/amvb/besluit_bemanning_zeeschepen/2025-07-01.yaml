    text: |-
      1 [Artikel 3.3.5, eerste lid][ref1], is niet van toepassing op een kapitein, eerste stuurman, wachtstuurman,
      eerste maritiem officier of maritiem officier van een tankschip of een passagiersschip, dat in open polaire
      wateren vaart indien hij tijdens de uitoefening van zijn taken wordt geadviseerd door een zeevarende als bedoeld
      in [artikel 3.3.6][ref2].

      2 [Artikel 3.3.5, tweede en derde lid][ref3], is niet van toepassing op een kapitein, eerste stuurman,
      wachtstuurman, eerste maritiem officier of maritiem officier van een tankschip of een passagiersschip dat in bergy
      wateren vaart, indien hij tijdens de uitoefening van zijn taken wordt geadviseerd door een zeevarende als bedoeld
      in [artikel 3.3.6][ref4].

      3 [Artikel 3.3.5, tweede lid][ref5], is niet van toepassing op een kapitein, eerste stuurman of eerste maritiem
      officier van een tankschip of een passagiersschip dat in andere polaire wateren dan bergy wateren vaart
      indien hij in het bezit is van een bekwaamheidsbewijs basistraining Polar-code, als bedoeld in artikel 3.3.5,
      eerste lid, en hij tijdens de uitoefening van zijn taken wordt geadviseerd door een zeevarende als bedoeld in
      [artikel 3.3.6][ref6].


