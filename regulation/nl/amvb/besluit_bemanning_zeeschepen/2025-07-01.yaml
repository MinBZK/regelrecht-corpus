  - number: 2.2.2
    text: |-
      Bij ministeriële regeling kan, na overleg met de betrokken organisaties van scheepsbeheerders en vissers,
      aanvulling van het aantal bemanningsleden worden voorgeschreven indien de inrichting, de uitrusting, de
      scheepslengte, het brutotonnage, het voortstuwingsvermogen, de wijze van voortstuwing of de bestemming van het
      vissersvaartuig daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel2.2.2
  - number: 2.2.3
    text: |-
      1 Bij ministeriële regeling kan, na overleg met de betrokken organisaties van scheepsbeheerders en vissers, voor
      bepaalde categorieën vissersvaartuigen met een scheepslengte van minder dan 45 meter, vrijstelling worden verleend
      van het bepaalde in dit hoofdstuk.

      2 Bij het verlenen van een vrijstelling kunnen beperkingen worden opgelegd ten aanzien van:

      a. de weersomstandigheden waaronder mag worden gevaren;

      b. het te bevaren vaargebied;

      c. de categorie vissersvaartuigen;

      d. de maximale tijd die op zee mag worden doorgebracht.
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel2.2.3
  - number: 2.2.4
    text: |-
      1 De scheepsbeheerder van een vissersvaartuig dient een aanvraag in voor een bemanningscertificaat bij Onze
      Minister.

      2 De bemanningssamenstelling op het bemanningscertificaat wordt vastgesteld met in achtneming van
      [artikel 2.2.1][ref1].

      3 De [artikelen 2.1.3, eerste lid][ref2], [2.1.4][ref3], [2.1.8, aanhef en onderdeel b][ref4], en
      [2.1.9, eerste lid][ref5], zijn van overeenkomstige toepassing.

      4 Bij ministeriële regeling wordt bepaald welke gegevens ten minste bij de aanvraag worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0050941#Artikel2.2.1
