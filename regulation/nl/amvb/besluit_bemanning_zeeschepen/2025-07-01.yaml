  - number: 3.6.1
    text: Bij ministeriële regeling wordt het model van de geneeskundige verklaring zeevaart vastgesteld.
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel3.6.1
  - number: 3.6.2
    text: |-
      1 Ten behoeve van de afgifte van een geneeskundige verklaring zeevaart als bedoeld in
      [artikel 31, eerste lid, van de wet][ref1] wordt de zeevarende aan een medisch onderzoek onderworpen door een
      aangewezen of erkende keuringsarts.

      2 Indien de keuringsarts twijfels heeft omtrent de medische geschiktheid dan wel wanneer in de medische eisen,
      bedoeld in [artikel 3.6.3, eerste lid][ref2], een specialistisch rapport is vereist, verwijst deze arts de
      zeevarende voor deelonderzoek door naar een specialist.

      3 Een geneeskundige verklaring zeevaart wordt afgegeven door een keuringsarts die heeft vastgesteld
      dat de zeevarende voldoet aan de voor die verklaring van toepassing zijnde medische eisen, bedoeld in
      [artikel 3.6.3, eerste lid][ref3].

      4 Indien de gekeurde zeevarende gebruik wenst te maken van zijn recht om opnieuw te worden onderzocht, wordt
      hij onderzocht door een op grond van [artikel 32, eerste lid, van de wet][ref4] als scheidsrechter aangewezen
      keuringsarts.

      5 De in dit besluit bedoelde onderzoeken worden verricht door geneeskundigen die niet de behandelend arts of
      specialist van de zeevarende zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0050941#Artikel3.6.3
      [ref3]: https://wetten.overheid.nl/BWBR0050941#Artikel3.6.3
      [ref4]: https://wetten.overheid.nl/BWBR0050681#Artikel32
