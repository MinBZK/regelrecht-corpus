  - number: 3.1.10
    text: |-
      1 Voor de erkenning van een vaarbevoegdheidsbewijs als kapitein of schipper op grond van
      [artikel 27, eerste lid, van de wet][ref1] legt de aanvrager het bekwaamheidsbewijs wetgeving en openbaar gezag
      over.

      2 Zeevarenden in het bezit van een vaarbevoegdheidsbewijs voor de functie van eerste stuurman, plaatsvervangend
      schipper, hoofdwerktuigkundige, tweede werktuigkundige of eerste maritiem officier dat erkend is op grond van
      [artikel 27, eerste lid, van de wet][ref2], nemen voor aanvang van hun dienst aan boord kennis van de voor het in
      het eerste lid genoemde bekwaamheidsbewijs van belang zijnde maritieme regelgeving. Van deze kennisneming wordt
      schriftelijk bewijs vastgelegd.

      3 Bij ministeriële regeling worden de beroepseisen vastgesteld voor de verkrijging van het in het eerste lid
      genoemde bekwaamheidsbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0050681#Artikel27
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel3.1.10
