  - number: '5.1'
    text: |-
      1 De voorzitter en de plaatsvervangende voorzitters als bedoeld in [artikel 42, eerste lid, van de wet][ref1] zijn
      personen:

      a. aan wie op grond van het afsluitend examen van een opleiding in het wetenschappelijk onderwijs door een
      universiteit dan wel de Open Universiteit, waarop de Wet op het hoger onderwijs en wetenschappelijk onderzoek
      betrekking heeft, de graad van Bachelor op het gebied van het Nederlands recht en tevens de graad van Master op het
      gebied van het Nederlands recht is verleend; of

      b. die op grond van het afsluitend examen van een opleiding op het gebied van het Nederlands recht aan een
      universiteit dan wel de Open Universiteit, waarop de Wet op het hoger onderwijs en wetenschappelijk onderzoek
      betrekking heeft, het recht hebben verkregen om de titel meester te voeren.

      2 Tien leden en acht plaatsvervangende leden hebben gedurende de aan hun benoeming voorafgaande periode van
      tien jaar ten minste vijf jaar als kapitein of als scheepsofficier aan boord van een ander zeeschip dan een
      vissersvaartuig gevaren.

      3 Vier leden en vier plaatsvervangende leden hebben gedurende de aan hun benoeming voorafgaande periode van tien
      jaar ten minste vijf jaar als schipper of als scheepsofficier aan boord van een vissersvaartuig gevaren.

      4 Voorts worden als plaatsvervangend lid benoemd:

      a. twee reders;

      b. twee waterbouwkundigen;

      c. twee registerloodsen; en

      d. twee hydrografen.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel42
