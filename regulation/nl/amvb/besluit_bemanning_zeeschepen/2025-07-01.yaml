        artikel: '4'
      - id: ref2
        bwb_id: BWBR0050681
        artikel: '4'
  - number: 2.1.4
    text: |-
      1 Op het bemanningscertificaat worden de kenmerken van het zeeschip en, zo nodig, de bijzonderheden ten aanzien van
      het gebruik van het zeeschip in relatie tot de bemanning vermeld.

      2 Een bemanningscertificaat wordt voor een bepaalde periode van ten hoogste vijf jaar afgegeven.

      3 De kapitein draagt er zorg voor dat een kopie van het geldige bemanningscertificaat op een duidelijk zichtbare
      plaats aan boord van het zeeschip wordt opgehangen.
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel2.1.4
  - number: 2.1.5
    text: |-
      Indien voor een zeeschip meer dan een bemanningssamenstelling geldt, worden alle bemanningssamenstellingen
      duidelijk onderscheiden in het bemanningscertificaat opgenomen.
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel2.1.5
  - number: 2.1.6
    text: |-
      Indien voor een zeeschip meer dan een bemanningssamenstelling geldt, tekent de kapitein in het scheepsdagboek aan:

      a. volgens welke bemanningssamenstelling het zeeschip is bemand; en

      b. de feiten of omstandigheden die niet in overeenstemming zijn met de gegevens van het bemanningsplan.
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel2.1.6
  - number: 2.1.7
    text: |-
      1 De scheepsbeheerder meldt aan Onze Minister alle wijzigingen van de gegevens van het bemanningsplan die hij
      voornemens is door te voeren.

      2 Op grond van de nieuwe gegevens beslist Onze Minister of de bemanningssamenstelling overeenkomstig het geldige
      bemanningscertificaat kan worden gehandhaafd. Zo nodig trekt hij het bemanningscertificaat in en geeft een nieuw
      bemanningscertificaat af.
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel2.1.7
  - number: 2.1.8
    text: |-
      Onze Minister trekt het bemanningscertificaat in, indien is gebleken dat

      a. het bemanningsplan onjuiste of onvolledige gegevens bevat, zodanig dat op grond van de juiste of volledige
      gegevens dit bemanningscertificaat niet zou zijn afgegeven, dan wel

      b. het zeeschip in strijd met de gegevens in het bemanningscertificaat wordt gebruikt en dit afwijkende gebruik
      naar zijn redelijk oordeel een andere bemanningssamenstelling noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel2.1.8
  - number: 2.1.9
    text: |-
      1 Onverminderd [artikel 2.1.3, vierde lid][ref1], geeft Onze Minister ambtshalve een nieuw bemanningscertificaat
      af voor een andere bemanningssamenstelling dan waarmee het betrokken zeeschip of de betrokken zeeschepen op grond
      van het laatst afgegeven bemanningscertificaat is of zijn bemand, indien hem is gebleken dat het voldoen aan het
      bepaalde in artikel 2.1.3, eerste lid, met dat certificaat niet langer gewaarborgd is.

      2 In het geval, bedoeld in het eerste lid, nodigt Onze Minister de scheepsbeheerder uit een nieuw bemanningsplan in
      te dienen.


