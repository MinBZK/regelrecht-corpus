      1 [Artikel 3.3.5, tweede en derde lid][ref1], is niet van toepassing op een kapitein, eerste stuurman,
      wachtstuurman, eerste maritiem officier of maritiem officier van een zeeschip, niet zijnde een tankschip of een
      passagiersschip dat in andere polaire wateren vaart met een ijsconcentratie van twee tiende of minder, als bedoeld
      in voorschrift 12.3.2, onderdelen 4 en 5, van de Polar-code indien hij tijdens de uitoefening van zijn taken wordt
      geadviseerd door een zeevarende als bedoeld in [artikel 3.3.6][ref2].

      2 [Artikel 3.3.5, tweede en derde lid][ref3], is niet van toepassing op een kapitein, eerste stuurman of eerste
      maritiem officier van een zeeschip, niet zijnde een tankschip of een passagiersschip, dat in andere polaire wateren
      vaart met een ijsconcentratie van meer dan twee tiende, als bedoeld in voorschrift 12.3.2, onderdeel 5, van de
      Polar-code indien hij tijdens de uitoefening van zijn taken wordt geadviseerd door een zeevarende als bedoeld in
      [artikel 3.3.6][ref4] en hij in het bezit is van een bekwaamheidsbewijs basistraining Polar-code, als bedoeld in
      artikel 3.3.5, eerste lid.


