  - number: 3.6.3
    text: |-
      1 Bij ministeriële regeling worden de medische eisen vastgesteld waaraan een zeevarende moet voldoen om in
      aanmerking te komen voor een geneeskundige verklaring zeevaart.

      2 Bij ministeriële regeling worden de procedures en andere voorschriften vastgesteld die in acht worden genomen bij
      elk van de onderzoeken, bedoeld in [artikel 3.6.2][ref1].

      3 Bij de vaststelling van de medische eisen wordt bepaald ten aanzien van welke nieuwe medische eisen een
      ontheffing als bedoeld in [artikel 32, vijfde lid, van de wet][ref2] kan worden verleend.

      4 In afwijking van het eerste lid kan Onze Minister aan een zeevarende ontheffing verlenen van één van de medische
      eisen indien naar zijn oordeel het niet voldoen aan die medische eis de veiligheid niet nadelig beïnvloedt.


      [ref1]: https://wetten.overheid.nl/BWBR0050941#Artikel3.6.2
      [ref2]: https://wetten.overheid.nl/BWBR0050681#Artikel32
