      1 Een vaarbevoegdheidsbewijs kan op verzoek met gebruikmaking van een bij ministeriële regeling vast te stellen
      format voor een geautomatiseerd bestand worden afgegeven.

      2 Bij ministeriële regeling kunnen regels worden gesteld ten aanzien van de in [artikel 3.1.1][ref1] genoemde
      bescheiden als geautomatiseerde bestanden.


      [ref1]: https://wetten.overheid.nl/BWBR0050941#Artikel3.1.1
