  - number: 3.6.7
    text: |-
      1 Een geneeskundige kan Onze Minister verzoeken hem aan te wijzen of te erkennen als keuringsarts op grond
      van [artikel 31, tweede lid, van de wet][ref1]. Bij het verzoek wordt registratie als arts als bedoeld in
      [artikel 3 van de Wet op de beroepen in de individuele gezondheidszorg][ref2], aangetoond.

      2 Indien het verzoek is ingediend door een geneeskundige die in het buitenland zijn praktijk houdt, vergewist Onze
      Minister zich van diens vakbekwaamheid.

      3 Onze Minister gaat niet over tot aanwijzing of erkenning van een geneeskundige indien diens onafhankelijkheid
      ten opzichte van werkgevers, werknemers of hun organisaties niet gewaarborgd is, of ingeval diens professionele
      kundigheden, praktijkervaring of beroepsuitrusting naar zijn oordeel ontoereikend zijn.

      4 Bij het besluit van Onze Minister over de aanwijzing of erkenning worden het aantal al aangewezen of erkende
      geneeskundigen en de spreiding over het land in relatie tot de regionale of plaatselijke behoefte in aanmerking
      genomen.

      5 De aanwijzing of erkenning als keurend arts wordt afgegeven voor een periode van ten hoogste vijf jaar.

      6 De aangewezen of erkende keuringsarts is verplicht de door Onze Minister aangewezen nascholingscursussen te
      volgen. De kosten van deelname komen voor rekening van de betrokken keuringsarts.

      7 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de aanwijzing en de erkenning van
      geneeskundigen als keurend arts voor de scheepvaart.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel3
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel3.6.7
