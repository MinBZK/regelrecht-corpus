  - number: 3.1.9
    text: |-
      1 Onze Minister erkent een vaarbevoegdheidsbewijs of een bekwaamheidsbewijs als bedoeld in
      [artikel 27, eerste lid, van de wet][ref1] dat op grond van het STCW-verdrag is afgegeven door of namens een
      bevoegde autoriteit van een Lidstaat van de Europese Unie of een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte of Zwitserland en met deze Lidstaat of andere staat een officiële
      verklaring is opgesteld als bedoeld in artikel 6, tweede lid van [richtlijn (EU) 2022/993](32022L0993).

      2 Onze Minister erkent een vaarbevoegdheidsbewijs of een bekwaamheidsbewijs als bedoeld in
      [artikel 27, eerste lid, van de wet][ref2] dat op grond van het STCW-verdrag is afgegeven door een bevoegde
      autoriteit van een staat, niet zijnde een Lidstaat van de Europese Unie, een andere staat die partij is
      bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, indien ten aanzien van dat
      vaarbevoegdheidsbewijs of bekwaamheidsbewijs is voldaan aan de criteria, bedoeld in artikel 20, tweede tot en met
      zesde lid, van [richtlijn (EU) 2022/993](32022L0993)en met deze andere staat een officiële verklaring is opgesteld
      als bedoeld in voorschrift I/10 van de bijlage bij het STCW-verdrag.

      3 Onze Minister erkent een vaarbevoegdheidsbewijs of een bekwaamheidsbewijs als bedoeld in
      [artikel 27, eerste lid, van de wet][ref3] dat is afgegeven door een bevoegde autoriteit van een staat die partij
      is bij het STCW F-verdrag, indien wordt voldaan aan de vereisten van bekwaamheid, afgifte en erkenning, bedoeld in
      voorschrift 7 van de bijlage bij het STCW F-verdrag.

      4 Onze Minister is bevoegd aan de tot het verstrekken en ontvangen van informatie bevoegde autoriteit van
      een lidstaat van de Europese Unie, een andere staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte, het STCW-verdrag of het STCW F-verdrag, informatie te verstrekken en van deze te ontvangen
      omtrent de erkenning van een vaarbevoegdheidsbewijs op grond van het STCW-verdrag of het STCW F-verdrag.

      5 Bij ministeriële regeling wordt bepaald welke bescheiden worden overlegd bij een aanvraag om erkenning van een
      vaarbevoegdheidsbewijs of bekwaamheidsbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0050681#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0050681#Artikel27
