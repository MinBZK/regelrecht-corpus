      1 Een kapitein, stuurman, werktuigkundige, officier elektrotechniek, maritiem officier of andere zeevarende die is
      aangewezen om leiding te geven aan brandbestrijdingsoperaties aan boord van een zeeschip is in het bezit van een
      bekwaamheidsbewijs brandbestrijding voor gevorderden dat ten minste voldoet aan voorschrift VI/3, eerste lid, van
