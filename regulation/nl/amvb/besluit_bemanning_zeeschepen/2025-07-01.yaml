  - number: '1.2'
    text: |-
      1 Dit besluit is niet van toepassing ten aanzien van zeilschepen met een scheepslengte van minder dan 12 meter.

      2 Dit besluit is, met uitzondering van [artikel 3.5.2][ref1] en [paragraaf 3.6][ref2] niet van toepassing ten
      aanzien van vissersvaartuigen met een scheepslengte van minder dan 12 meter.

      3 De minimumeisen voor een functie aan boord van vissersvaartuigen met een scheepslengte van minder dan 12 meter
      voldoen aan de bij ministeriële regeling gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0050941#Artikel3.5.2
      [ref2]: https://wetten.overheid.nl/BWBR0050941#Hoofdstuk3
