preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Infrastructuur en Waterstaat van 11 juni 2024, nr. IenW/BSK-2024/153686,
    Hoofddirectie Bestuurlijke en Juridische Zaken;

    Gelet op het op 1 november 1974 te Londen tot stand gekomen Verdrag voor de beveiliging van mensenlevens op zee
    (Trb. 1976, 157) en de bij dat verdrag behorende bindende protocollen, aanhangsels en bijlagen, het op 7 juli
    1978 te Londen tot stand gekomen Verdrag betreffende de normen voor zeevarenden inzake opleiding, diplomering en
    wachtdienst, 1978 (Trb. 1981, 144) en de bij dat verdrag behorende bindende bijlagen, het op 7 juli 1995 te Londen
    tot stand gekomen Internationaal Verdrag betreffende de normen inzake opleiding, diplomering en wachtdienst van
    personeel van vissersschepen van de Internationale Maritieme Organisatie (Trb. 2013, 218), het op 23 februari 2006
    in Genève tot stand gekomen Maritiem Arbeidsverdrag, 2006 (Trb. 2007, 93) en de bij dat verdrag behorende bindende
    protocollen en aanhangselen, het op 1 november 1974 te Londen tot stand gekomen Verdrag voor de beveiliging van
    mensenlevens op zee (Trb. 1976, 157) en de bij dat verdrag behorende bindende protocollen, aanhangsels en bijlagen,
    Richtlijn (EU)2022/993 van het Europees Parlement en de Raad van 8 juni 2022 inzake het minimumopleidingsniveau
    van zeevarenden (PbEU 2022, L 169), Richtlijn 2009/13/EG van de Raad van 16 februari 2009 tot tenuitvoerlegging
    van de overeenkomst tussen de Associatie van reders van de Europese Gemeenschap (ECSA) en de Europese Federatie van
    vervoerswerknemers (ETF) inzake het verdrag betreffende maritieme arbeid van 2006 en tot wijziging van Richtlijn
    1999/63/EG (PbEG 2009, L 124) en Richtlijn (EU) 2017/ 159 van de Raad van 19 december 2016 tot uitvoering van
    de op 21 mei 2012 door het Algemeen Comité van de landbouwcoöperaties van de Europese Unie (COGECA), de Europese
    Federatie van vervoerswerknemers (EFT) en de Vereniging van de nationale organisaties van visserijondernemingen in
    de Europese Unie (Europêche) gesloten Overeenkomst betreffende de uitvoering van het Verdrag betreffende werk in de
    visserijsector van de Internationale Arbeidsorganisatie uit 2007 (PbEU 2016, L 25);

    Gelet op de artikelen 3, derde lid, 19, zesde lid, 20, derde en vierde lid, 21, derde lid, 23, derde lid, 24,
    tweede lid, 25, tweede lid, 26, eerste lid, 27, tweede lid, 28, 30, derde lid, 31, vierde lid, 32, zesde lid, 37,
    tweede lid, 38, derde lid, 42, tweede lid, 46, tweede lid, 48, tweede lid, 55, achtstelid, 57, tweede lid, en84 van
    de Wet bemanning zeeschepen;

    De Afdeling advisering van de Raad van State gehoord (advies van 21 augustus 2024, nr. W17.24.00137/IV);

    Gezien het nader rapport van Onze Minister van Infrastructuur en Waterstaat van 10 maart 2025, nr. IenW/BSK-
    2025/23093, Hoofddirectie Bestuurlijke en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *andere polaire wateren:* polaire wateren, niet zijnde wateren als bedoeld in de voorschriften 2.5 en 2.10 van de
      Polar-code;
        - *beperkte wateren vissersvaartuigen:* gebied omvattende alle wateren tot 30 zeemijlen uit de kust, gemeten vanaf
      de Franse, Belgische, Nederlandse, Duitse en Deense basislijnen, in het zuiden begrensd door de lijn Calais-Dover
      en in het noorden begrensd door de parallel van 57° Noorderbreedte, alsmede het gebied omvattende alle wateren tot
      30 zeemijlen uit de kust, gemeten vanaf de basislijn van Helgoland;
        - *bergy wateren:* polaire wateren als bedoeld in voorschrift 1.2.1, deel I-A, van de Polar-code;
        - *beveiligingstaken:* elke functie of werkzaamheid met betrekking tot de beveiliging aan boord van een zeeschip,
      zoals omschreven in hoofdstuk XI-2 van de bijlage bij het SOLAS-verdrag en de ISPS-code;
        - *bijzonder zeeschip:* zeeschip dat in het bijzonder is aangepast aan technische ontwikkelingen of een bijzonder
      type zeeschip of zeeschip ingezet in een bijzonder soort vaart, als bedoeld in artikel IX van de bijlage bij het
      STCW-verdrag;
        - *CFR-nummer:* nummer als bedoeld in artikel 2, onderdeel l, van [Uitvoeringsverordening (EU) 2017/218]
      (32017R0218) van de Commissie van 6 februari 2017 inzake het vissersvlootregister van de Unie (PbEU 2017, L 34);
        - *chemicaliëntankschip:* tankschip gebouwd en gebezigd voor het vervoer in bulk van vloeibare producten die zijn
      opgenomen in hoofdstuk 17 van de IBC-code;
        - *eerste stuurman:* wachtstuurman die in rang volgt op de kapitein en op wie het bevel over het zeeschip komt te
      rusten indien de kapitein daartoe niet in staat is en die bevoegd is in overeenstemming met de voorschriften II/2
      of II/3 van bijlage I bij [richtlijn (EU) 2022/993](32022L0993);
        - *gekwalificeerd gezel dek:* gezel die bevoegd is in overeenstemming met voorschrift II/5 van bijlage I bij
      [richtlijn (EU) 2022/993](32022L0993);
        - *gekwalificeerd gezel machinekamer:* gezel die bevoegd is in overeenstemming met voorschrift III/5 van bijlage I
      bij [richtlijn (EU) 2022/993](32022L0993);
        - *gezel elektrotechniek:* gezel die bevoegd is in overeenstemming met voorschrift III/7 van bijlage I bij
      [richtlijn (EU) 2022/993](32022L0993);
        - *gezel zeevisvaart:* gezel aangesteld in de dekdienst van een vissersvaartuig;
        - *hogesnelheidsschip:* zeeschip als bedoeld in [artikel 7 van het Schepenbesluit 2004][ref1];
        - *hoofdwerktuigkundige:* wachtwerktuigkundige die het hoogst in rang is en die verantwoordelijk is voor de
      werktuiglijke voortstuwing en de werking en het onderhoud van de werktuiglijke en elektrische installaties van het
      zeeschip en die bevoegd is in overeenstemming met de voorschriften III/2 of III/3 van bijlage I bij [richtlijn (EU)
      2022/993](32022L0993);
        - *hoofdwerktuigkundige zeevisvaart:* werktuigkundige die het hoogst in rang is en die verantwoordelijk is voor
      de werktuiglijke voortstuwing en de werking en het onderhoud van de werktuiglijke en elektrische installaties van
      een vissersvaartuig;
        - *HSC-code:* bij resolutie MSC.97(73) van de Maritieme Veiligheidscommissie aangenomen Internationale Code voor de
      veiligheid van hogesnelheidsschepen (High-Speed Craft Code;
        - *IBC-code:* bij resolutie MSC.4(48) van de Maritieme Veiligheidscommissie aangenomen Internationale Code voor de
      bouw en uitrusting van schepen die gevaarlijke chemicaliën in bulk vervoeren (International Bulk Chemical Code);
        - *IGC-code:* bij resolutie MSC.5(48) van de Maritieme Veiligheidscommissie aangenomen Internationale Code voor de
      bouw en uitrusting van schepen die vloeibaar gemaakte gassen in bulk vervoeren (International Gas Carrier Code);
        - *IGF-code:* bij resolutie MSC.391(95) van de Maritieme Veiligheidscommissie aangenomen Internationale Code voor
      schepen die gas of andere brandstoffen met een laag vlampunt gebruiken (International Code of Safety for Ships
      Using Gases or Other low-flashpoint fuels);
        - *kW:* kilowatt;
        - *IGF-schip:* zeeschip onderworpen aan de IGF-code;
        - *ISPS-code:* bij resolutie 2 van de Conferentie van verdragsluitende regeringen die partij zijn bij het SOLAS-
      verdrag op 12 december 2002 aangenomen Internationale Code voor de beveiliging van schepen en havenfaciliteiten
      (International Ship and Port Facility Security Code);
        - *maritiem officier:* officier die in overeenstemming met hoofdstuk VII van bijlage I bij [richtlijn (EU)
      2022/993](32022L0993) bevoegd is voor een functie in de dekdienst en de machinekamerdienst en daartoe bevoegd is in
      overeenstemming met de hoofdstukken II en III van bijlage I bij [richtlijn (EU) 2022/993](32022L0993);
        - *Medisch Adviseur Scheepvaart:* door Onze Minister aangewezen keuringsarts;
        - *officier elektrotechniek:* officier die bevoegd is in overeenstemming met voorschrift III/6 van bijlage I bij
      [richtlijn (EU) 2022/993](32022L0993);
        - *olietankschip:* tankschip gebouwd en gebruikt voor het vervoer in bulk van aardolie of aardolieproducten;
        - *onbeperkte wateren vissersvaartuigen:* gebied omvattende beperkte wateren en alle wateren daarbuiten;
        - *open polaire wateren:* polaire wateren als bedoeld in voorschrift 2.10 van de Polar-code;
        - *passagiersschip:* zeeschip bestemd of gebezigd voor het bedrijfsmatig vervoer van meer dan twaalf passagiers;
        - *plaatsvervangend schipper:* stuurman die in rang volgt op de schipper en op wie het bevel over het zeeschip komt
      te rusten indien de schipper daartoe niet in staat is en die bevoegd is in overeenstemming met de voorschriften
      II/1 of II/3 van de bijlage bij het STCW F-verdrag;
        - *Polar-code:* bij resolutie MSC.385(94) van de Maritieme Veiligheidscommissie aangenomen Internationale Code voor
      schepen die in polaire wateren varen (International Code for Ships Operating in Polar Waters;
        - *polaire wateren:* wateren als bedoeld in voorschrift 1, tweede tot en met vierde lid, van de Polar-code;
        - *reizen nabij de kust:* gebruik van een zeeschip waarvoor nautische en technische ondersteuning vanaf de wal
      beschikbaar is, als bedoeld voorschrift I/3 van de bijlage bij het STCW-verdrag, in het vaargebied, dat zich
      uitstrekt tot: 1. de Nederlandse territoriale zee; 2. de aansluitende zone van het Koninkrijk grenzend aan de
      Nederlandse territoriale zee; of 3. de Nederlandse exclusieve economische zone;
        - *ro-ro passagiersschip:* passagiersschip met ruimten voor ro-ro lading of ruimten van bijzondere aard, zoals
      bedoeld in hoofdstuk II-2/A van de bijlage bij het SOLAS-verdrag;
        - *scheepsbeveiligingsfunctionaris:* zich aan boord bevindende, aan de kapitein verantwoordelijke persoon, dan
      wel de kapitein zelf, die door de scheepsbeheerder is aangesteld als verantwoordelijke voor de beveiliging van
      het zeeschip, waaronder begrepen de uitvoering en het onderhoud van het scheepsbeveiligingsplan, en voor het
      contact met de beveiligingsfunctionaris van de zeescheepvaartonderneming en de beveiligingsfunctionarissen van
      de havenfaciliteiten;
        - *scheepskok:* persoon van 18 jaar of ouder in het bezit van een bekwaamheidsbewijs scheepskok, dat ten minste
      voldoet aan voorschrift 3.2, titel 3, van de bijlage bij het MLC-verdrag.
        - *STCW-code:* code inzake opleiding, diplomering en wachtdienst van zeevarenden, behorend bij het STCW-Verdrag
      (Trb. 1996, 249);
        - *tankschip:* zeeschip, gebouwd of aangepast en gebruikt voor het vervoer in bulk van vloeibare producten;
        - *tweede werktuigkundige:* wachtwerktuigkundige die in rang volgt op de hoofdwerktuigkundige en op wie de
      verantwoordelijkheid voor de werktuiglijke voortstuwing en de werking en het onderhoud van de werktuiglijke en
      elektrische installaties van het zeeschip komt te rusten, indien de hoofdwerktuigkundige daartoe niet in staat
      is en die bevoegd is in overeenstemming met de voorschriften III/2 of III/3 van bijlage I bij [richtlijn (EU)
      2022/993](32022L0993);
        - *tweede werktuigkundige zeevisvaart:* werktuigkundige die in rang volgt op de hoofdwerktuigkundige en op wie
      de verantwoordelijkheid voor de werktuiglijke voortstuwing en de werking en het onderhoud van de werktuiglijke
      en elektrische installaties van het vissersvaartuig komt te rusten indien de hoofdwerktuigkundige daartoe niet in
      staat is als bedoeld in voorschrift I/1, achtste lid, van de bijlage bij het STCW F-verdrag;
        - *vloeibaargastankschip:* tankschip gebouwd en gebezigd voor het vervoer in bulk van vloeibaar gemaakt gas of
      andere producten die zijn opgenomen in hoofdstuk 19 van de IGC-code;
        - *voortstuwingsvermogen:* totale maximale vermogen, uitgedrukt in kW, dat staat vermeld op certificaten en
      bijbehorende uitrustingsrapporten en aanhangsels afgegeven in overeenstemming met de Schepenwet;
        - *wachtlopend gezel dek:* gezel die bevoegd is in overeenstemming met voorschrift II/4 van bijlage I bij
      [richtlijn (EU) 2022/993](32022L0993);
        - *wachtlopend gezel machinekamer:* gezel die bevoegd is in overeenstemming met voorschrift III/4 van bijlage I bij
      [richtlijn (EU) 2022/993](32022L0993);
        - *wachtlopend gezel zeevisvaart:* gezel die bevoegd is in overeenstemming met voorschrift II/4 van de bijlage bij
      het STCW-verdrag, aangesteld op een vissersvaartuig;
        - *wachtstuurman:* officier die bevoegd is in overeenstemming met voorschrift II/1 van bijlage I bij [richtlijn
      (EU) 2022/993](32022L0993);
        - *stuurman zeevisvaart:* officier die bevoegd is in overeenstemming met voorschrift II/2 of II/4 van de bijlage
      bij het STCW F-verdrag;
        - *wachtwerktuigkundige:* officier die bevoegd is in overeenstemming met voorschrift III/1 van bijlage I bij
      [richtlijn (EU) 2022/993](32022L0993);
        - *werktuigkundige zeevisvaart:* officier die bevoegd is in overeenstemming met voorschrift II/5 van de bijlage bij
      het STCW F-verdrag;
        - *wet:* [Wet bemanning zeeschepen][ref2].


