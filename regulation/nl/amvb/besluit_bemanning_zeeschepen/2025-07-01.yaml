  - number: 4.1.1
    text: |-
      1 De scheepsbeheerder voorziet de zeevarenden aan boord van een zeeschip kosteloos van voeding en drinkwater van
      voldoende hoeveelheid, kwaliteit, voedingswaarde en variëteit en rekening houdend met godsdienstige voorschriften
      en culturele gebruiken, in overeenstemming met de daaraan bij ministeriële regeling gestelde voorschriften.

      2 De maximale hoeveelheid sterke drank als bedoeld in [artikel 1, eerste lid, van de Drank- en Horecawet][ref1] die
      voor verbruik door de zeevarenden aan boord beschikbaar is, wordt vastgesteld bij ministeriële regeling.

      3 De voorraden voeding en drinkwater en de ruimten en apparatuur voor de opslag, bewerking en bereiding van voeding
      en drinkwater worden regelmatig door of namens de kapitein geïnspecteerd overeenkomstig bij ministeriële regeling
      gestelde regels.

      4 Degene die aan boord tot taak heeft de voeding voor de zeevarenden te beheren en te bereiden, voldoet aan de bij
      ministeriële regeling gestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel1
