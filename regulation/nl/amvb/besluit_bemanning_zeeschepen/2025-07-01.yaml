  - number: 2.3.1
    text: |-
      1 Alvorens een zeeschip voor de eerste maal naar zee vertrekt en vervolgens met tussenpozen van niet meer dan
      twaalf maanden wordt een bemanningslijst opgemaakt.

      2 Bij elke wijziging in de bemanningssamenstelling wordt een bemanningslijst opgemaakt.

      3 Een exemplaar van de bemanningslijst wordt door de kapitein aan boord bewaard en een exemplaar van de
      bemanningslijst wordt ten kantore van de scheepsbeheerder in Nederland bewaard en ter beschikking gehouden ten
      behoeve van het houden van toezicht door de ambtenaren, belast met het toezicht op de naleving.

      4 In afwijking van het derde lid zendt de schipper van een vissersvaartuig een exemplaar van de bemanningslijst
      vóór het vertrek of onmiddellijk na het vertrek van het vaartuig aan de scheepsbeheerder of zijn vertegenwoordiger
      aan de wal.

      5 De bemanningslijst kan worden opgemaakt met inachtneming van een bij ministeriële regeling vast te stellen format
      voor een geautomatiseerd bestand.
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel2.3.1
  - number: 2.3.2
    text: |-
      Bij ministeriële regeling kan worden bepaald dat andere gegevens op de bemanningslijst worden vermeld naast de
      gegevens, genoemd in de bij het bij het FAL-verdrag ingevoerde standaardverklaring.
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel2.3.2
  - number: 2.3.4
    text: De scheepsbeheerder bewaart een bemanningslijst, gedurende drie jaar na de vervangingsdatum of geldigheidsdatum.
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel2.3.4
  - number: 2.4.1
    text: |-
      1 De kapitein van een zeeschip, niet zijnde een vissersvaartuig, draagt er zorg voor dat voor het ondernemen
      van een reis en gedurende de reis overeenkomstig hoofdstuk III/10 van de bijlage bij het SOLAS-verdrag voldoende
      zeevarenden in het bezit van een bekwaamheidsbewijs reddingmiddelen dat ten minste voldoet aan voorschrift VI/2,
      eerste lid, van bijlage I bij [richtlijn (EU) 2022/993](32022L0993) aan boord zijn.

      2 De kapitein van elk zeeschip dat is uitgerust met snelle hulpverleningsboten draagt er zorg voor dat voor het
      ondernemen van een reis en gedurende de reis voor iedere snelle hulpverleningsboot ten minste twee zeevarenden
      beschikbaar zijn die in het bezit zijn van een bekwaamheidsbewijs snelle hulpverleningsboten dat ten minste voldoet
      aan voorschrift VI/2, tweede lid, van bijlage I bij [richtlijn (EU) 2022/993](32022L0993).
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel2.4.1
  - number: 2.4.2
    text: |-
      1 De schipper van een vissersvaartuig draagt er zorg voor dat voor het ondernemen van een reis een voldoende aantal
      bemanningsleden in het bezit is van een bekwaamheidsbewijs reddingmiddelen dat ten minste voldoet aan voorschrift
      VI/2, eerste lid, van de bijlage bij het STCW-verdrag.

      2 In afwijking van het eerste lid is een bekwaamheidsbewijs reddingmiddelen niet vereist op reizen in beperkte
      wateren vissersvaartuigen.

      3 De schipper wijst een visser die in het bezit is van een bekwaamheidsbewijs reddingmiddelen aan die de leiding
      heeft over de te gebruiken groepsreddingmiddelen van een vissersvaartuig.

      4 De schipper wijst tevens een visser die in het bezit is van een bekwaamheidsbewijs reddingmiddelen aan als
      plaatsvervanger van de visser, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel2.4.2
  - number: 2.4.3
    text: |-
      Op een zeeschip, niet zijnde een vissersvaartuig, dat een internationale reis van meer dan 3 dagen maakt met 100 of
      meer opvarenden, is een arts aanwezig.
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel2.4.3
  - number: 2.4.4
    text: |-
      1 Aan boord van een zeeschip waarvan de voorgeschreven bemanning uit meer dan 9 personen bestaat, is een scheepskok
      belast met het beheer en de bereiding van de voeding.

      2 Onder scheepskok wordt verstaan een persoon van 18 jaar of ouder in het bezit van een bekwaamheidsbewijs
      scheepskok dat ten minste voldoet aan voorschrift 3.2, titel 3, van de bijlage bij het MLC-verdrag.

      3 Onze Minister kan een vaarbevoegdheidsbewijs of bekwaamheidsbewijs, door de bevoegde autoriteiten in een
      verdragspartij afgegeven op grond van het Verdrag inzake het diploma van bekwaamheid als scheepskok, 1946
      (Trb. 1951, 24) of van het MLC-verdrag, als gelijkwaardig aan het bekwaamheidsbewijs scheepskok erkennen.

      4 Aan boord van een zeeschip waarvan de voorgeschreven bemanning uit minder dan tien personen bestaat, heeft
      eenieder die in de kombuis levensmiddelen verwerkt een opleiding genoten of instructie gekregen op het gebied van
      voeding, persoonlijke hygiëne en de behandeling en opslag van levensmiddelen aan boord van zeeschepen.
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel2.4.4
  - number: 2.4.5
    text: |-
      1 Aan boord van een zeeschip dat reizen onderneemt buiten het zeegebied A1, zoals omschreven in voorschrift
      2, onderdeel 12, van hoofdstuk IV van de bijlage bij het SOLAS-verdrag, is ten minste één zeevarende die als
      verantwoordelijke van de wacht, bedoeld in sectie A-VIII/2, part 4-1, van de STCW-code of, in geval van een
      vissersvaartuig, hoofdstuk II, onderdeel 4, van de bijlage bij het STCW F-verdrag, kan optreden in het bezit
      van een algemeen certificaat maritieme radiocommunicatie, afgegeven in overeenstemming met het bepaalde bij of
      krachtens het [Frequentiebesluit 2013][ref1].

      2 De kapitein wijst een zeevarende, in het bezit van een algemeen certificaat maritieme radiocommunicatie aan als
      de verantwoordelijke voor de afhandeling van radioberichtgeving tijdens noodgevallen.

      3 Alle andere zeevarenden die als verantwoordelijke van de wacht kunnen optreden zijn ten minste in het bezit van
      een beperkt certificaat maritieme radiocommunicatie dat is afgegeven in overeenstemming met het bepaalde bij of
      krachtens het [Frequentiebesluit 2013][ref2].

      4 Aan boord van een zeeschip dat uitsluitend reizen onderneemt in zeegebied A1, is ten minste één zeevarende
      die als verantwoordelijke voor de wacht kan optreden in het bezit van het beperkt certificaat maritieme
      radiocommunicatie, als bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0032895
      [ref2]: https://wetten.overheid.nl/BWBR0032895
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel2.4.5
    references:
      - id: ref1
        bwb_id: BWBR0032895
      - id: ref2
        bwb_id: BWBR0032895
  - number: 2.4.6
    text: |-
      1 De scheepsbeheerder, niet zijnde de scheepsbeheerder van een vissersvaartuig, draagt er zorg voor dat aan boord
      te allen tijde manieren beschikbaar zijn voor een doelmatige mondelinge communicatie tussen alle bemanningsleden
      over veiligheidsaspecten, met name dat boodschappen en instructies tijdig overkomen en juist worden begrepen.

      2 De scheepsbeheerder, niet zijnde de scheepsbeheerder van een vissersvaartuig, draagt er zorg voor dat aan boord
      van zijn zeeschip een werktaal wordt vastgesteld die in het journaal wordt aangetekend.

      3 De scheepsbeheerder van een passagiersschip draagt er zorg voor dat een zeevarende die op de alarmrol is
      aangewezen om de passagiers in kritieke situaties te helpen, duidelijk herkenbaar is en over voor dat doel
      toereikende communicatieve vaardigheden beschikt, rekening houdend met een relevante en geschikte combinatie van
      een van de volgende criteria:

      a. de taal of talen behorende bij de meest voorkomende nationaliteiten van de passagiers die op een bepaalde route
      worden vervoerd;

      b. de waarschijnlijkheid dat het vermogen om een Engelse basiswoordenschat te gebruiken voor elementaire
      instructies kan dienen als een middel om te communiceren met een passagier die hulp nodig heeft, ongeacht of de
      passagier en de zeevarende een gemeenschappelijke taal gemeen hebben;

      c. de mogelijke noodzaak om in een noodsituatie via enig ander middel te communiceren, bijvoorbeeld voordoen,
      handgebaren, of het aanduiden van de plaats waar zich instructies, verzamelplaatsen, reddingsmiddelen of
      ontsnappingsroutes bevinden, wanneer niet mondeling kan worden gecommuniceerd;

      d. de mate waarin aan de passagiers in hun moedertaal of -talen volledige veiligheidsinstructies zijn verstrekt;

      e. de talen waarin de noodinstructies tijdens een noodsituatie of oefening worden omgeroepen, teneinde de
      passagiers vitale aanwijzingen te geven en het voor de bemanning mogelijk te maken om de passagiers bij te staan.

      4 Onverminderd het eerste lid draagt de scheepsbeheerder van een olie- of chemicaliëntankschip of een
      vloeibaargastankschip er zorg voor dat de kapitein, de officieren en gezellen in staat zijn met elkaar te
      communiceren in één of meer gemeenschappelijke werktalen.
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel2.4.6
  - number: 2.4.7
    text: |-
      1 De scheepsbeheerder stelt een verklaring op waarin hij voor ieder onderdeel van [artikel 2.4.6][ref1] voor zover
      het desbetreffende onderdeel betrekking heeft op zijn zeeschip, nauwkeurig vermeldt op welke wijze hij ten aanzien
      van zijn zeeschip uitvoering heeft gegeven aan zijn verplichtingen ingevolge dat artikel.

      2 De scheepsbeheerder verschaft de kapitein een exemplaar van de verklaring.

      3 De kapitein hangt het exemplaar van de verklaring op in een voor iedereen toegankelijke plaats.

      4 De verklaring heeft een geldigheidsduur van vijf jaar.

      5 In afwijking van het vierde lid heeft de verklaring voor passagiersschepen en ro-ro passagiersschepen een
      geldigheidsduur van één jaar.

      6 Bij ministeriële regeling wordt bepaald welke gegevens worden opgenomen in de verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0050941#Artikel2.4.6
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel2.4.7
    references:
      - id: ref1
        bwb_id: BWBR0050941
        artikel: 2.4.6
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 2.4.8
    text: |-
      De scheepsbeheerder van een vissersvaartuig draagt er zorg voor dat de schipper en dekofficieren van een
      vissersvaartuig van 24 meter of meer waarvoor een bemanningscertificaat is afgegeven voor onbeperkt vaargebied
      vissersvaartuigen, beschikken over toereikende kennis van de Engelse taal, waardoor zij in staat zijn:

      a. kaarten en andere zeevaartkundige publicaties te gebruiken;

      b. weerkundige gegevens en berichten met betrekking tot de veiligheid en het gebruik van het vissersvaartuig te
      begrijpen;

      c. te communiceren met andere zeeschepen of tussen het vissersvaartuig en de autoriteiten te land;

      d. de bij resolutie A.918(22) van de Internationale Maritieme Organisatie aangenomen IMO Standard Marine
      Communication Phrases te begrijpen en te gebruiken.
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel2.4.8
  - number: 3.1.1
    text: |-
      1 Een vaarbevoegdheidsbewijs voor een functie als bedoeld in [artikel 23, eerste en tweede lid, van de wet][ref1]
      wordt door Onze Minister afgegeven indien de aanvrager met de daarvoor benodigde kennisbewijzen,
      bekwaamheidsbewijzen, beroepseisen of diensttijd aantoont ten minste te voldoen aan de minimumeisen voor de
      betreffende functie:

      a. genoemd in [paragraaf 3.2][ref2] voor zover het functies betreft aan boord van een zeeschip, niet zijnde een
      zeilschip met een brutotonnage van minder dan 500 GT of een vissersvaartuig;

      b. genoemd in [paragraaf 3.4][ref3] voor zover het functies betreft aan boord van een vissersvaartuig.

      2 Een kennisbewijs als bedoeld in het eerste lid of bekwaamheidsbewijs voor de zeilvaart mag ten hoogste 4 jaar
      voor de afgifte van het aangevraagde vaarbevoegdheidsbewijs zijn afgegeven.

      3 Een kennisbewijs of bekwaamheidsbewijs voor de zeilvaart dat meer dan 4 jaar geleden is afgegeven geeft recht op
      een vaarbevoegdheidsbewijs nadat de aanvrager met goed gevolg een bij ministeriële regeling vast te stellen test
      als bedoeld in sectie A-1/11, onderdeel 3, van de STCW-code heeft afgerond.


