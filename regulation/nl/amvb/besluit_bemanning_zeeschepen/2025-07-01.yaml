        artikel: '3'
  - number: 2.1.1
    text: Deze paragraaf is niet van toepassing op vissersvaartuigen.
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel2.1.1
  - number: 2.1.2
    text: |-
      1 De scheepsbeheerder dient een aanvraag voor een bemanningscertificaat in bij Onze Minister en voegt daarbij een
      bemanningsplan voor het betrokken zeeschip of de betrokken zeeschepen.

      2 De scheepsbeheerder kan voor een zeeschip meer dan één bemanningssamenstelling voorstellen.

      3 Bij ministeriële regeling wordt bepaald welke gegevens ten minste in het bemanningsplan worden opgenomen.

      4 Een aanvraag kan worden ingediend met gebruikmaking van een bij ministeriële regeling vast te stellen format voor
      een geautomatiseerd bestand.
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel2.1.2
  - number: 2.1.3
    text: |-
      1 Onze Minister besluit tot afgifte van een bemanningscertificaat voor het betrokken zeeschip of de betrokken
      zeeschepen, indien naar zijn oordeel met de voorgestelde bemanningssamenstelling of bemanningssamenstellingen:

      a. de veiligheid van het zeeschip en de veilige en milieuverantwoorde vaart zijn gewaarborgd;

      b. de voor de bemanning geldende normen voor arbeids- en rusttijden niet worden overschreden en er rekening is
      gehouden met de beperking van oververmoeidheid van zeevarenden;

      c. aan de eisen, bedoeld in [artikel 4, eerste lid, van de wet][ref1], kan worden voldaan; en

      d. wordt voldaan aan het bij of krachtens [artikel 4, derde lid, van de wet][ref2] bepaalde.

      2 De scheepsbeheerder verstrekt desgevraagd nadere inlichtingen over het bemanningsplan.

      3 Onze Minister kan de kapitein raadplegen over de bemanningssamenstelling en het bemanningsplan alvorens te
      besluiten omtrent de afgifte van een bemanningscertificaat.

      4 Onze Minister kan ambtshalve de bemanningssamenstelling of bemanningssamenstellingen van het betrokken zeeschip
      of de betrokken zeeschepen vaststellen en geeft dienovereenkomstig een bemanningscertificaat af, indien hij van
      oordeel is dat met de bemanningssamenstelling of bemanningssamenstellingen die door de scheepsbeheerder worden
      voorgesteld niet of niet geheel kan worden voldaan aan het eerste lid.

      5 De scheepsbeheerder verschaft de kapitein een afschrift van het bemanningsplan, dat is voorzien van de
      eventuele aanvullende gegevens die zijn verstrekt op grond van het derde lid, en dat behoort bij het geldige
      bemanningscertificaat.

      6 Een bemanningscertificaat kan worden afgegeven met gebruikmaking van een bij ministeriële regeling vast te
      stellen format voor een geautomatiseerd bestand.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0050681#Artikel4
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel2.1.3
    references:
