      1 De secretaris en de plaatsvervangende secretarissen zijn personen:

      a. aan wie op grond van het afsluitend examen van een opleiding in het wetenschappelijk onderwijs door een
      universiteit dan wel de Open Universiteit, waarop de Wet op het hoger onderwijs en wetenschappelijk onderzoek
      betrekking heeft, de graad van Bachelor op het gebied van het recht en tevens de graad van Master op het gebied van
      het recht is verleend; of

      b. die op grond van het afsluitend examen van een opleiding op het gebied van het recht aan een universiteit dan
      wel de Open Universiteit, waarop de Wet op het hoger onderwijs en wetenschappelijk onderzoek betrekking heeft, het
      recht heeft verkregen om de titel meester te voeren.
