        artikel: '27'
  - number: 3.1.11
    text: |-
      Onze Minister aanvaardt:

      a. een vaarbevoegdheidsbewijs voor de functie van gezel dat is afgeven door een staat die als verdragspartij is bij
      het STCW-verdrag;

      b. een bekwaamheidsbewijs, niet zijnde een bekwaamheidsbewijs als bedoeld in
      [artikel 27, eerste lid, van de wet][ref1], dat is afgegeven door de bevoegde autoriteit van een andere lidstaat
      van de Europese Unie, een andere staat die partij is bij de Overeenkomst betreffende de Europese Ruimte of
      Zwitserland of door een andere staat die verdragspartij is bij het STCW-verdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel27
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel3.1.11
