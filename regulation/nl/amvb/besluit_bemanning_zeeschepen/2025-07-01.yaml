      1 Een vaarbevoegdheidsbewijs of bekwaamheidsbewijs dat verloren is gegaan kan door Onze Minister tegen betaling
      worden vervangen door een duplicaat, waarvan de einddatum overeenkomt met de einddatum op het originele document.

      2 Indien de aanvrager van een duplicaat aanspraak kan maken op vernieuwing van het vaarbevoegdheidsbewijs of
      bekwaamheidsbewijs, wordt hem desgevraagd met inachtneming van [artikel 3.1.1][ref1] het vaarbevoegdheidsbewijs of
      bekwaamheidsbewijs afgegeven.


