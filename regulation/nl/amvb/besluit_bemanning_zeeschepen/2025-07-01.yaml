  - number: 3.5.1
    text: |-
      1 Een zeevarende die is belast met taken op het gebied van veiligheid of het voorkomen van verontreiniging, van
      een zeeschip, niet zijnde een vissersvaartuig, krijgt alvorens hij zijn taak aan boord aanvangt instructie in
      overeenstemming met sectie A-VI/1, paragraaf 1 van de STCW-code en is in het bezit van een bekwaamheidsbewijs
      basisveiligheid dat ten minste voldoet aan voorschrift VI/1 van bijlage I bij [richtlijn (EU) 2022/993]
      (32022L0993).

      2 Een zeevarende niet zijnde een zeevarende als bedoeld in het eerste lid, krijgt, alvorens hij zijn taak aan boord
      aanvangt instructie in overeenstemming met sectie A-VI/1, paragraaf 1, van de STCW-code.

      3 Een bekwaamheidsbewijs basisveiligheid is geldig tot ten hoogste 5 jaar na de datum van afgifte.

      4 Een bekwaamheidsbewijs basisveiligheid wordt op verzoek vernieuwd indien de houder met tussenpozen van niet meer
      dan 5 jaar aantoont een passende herhalingstraining te hebben gevolgd.
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel3.5.1
  - number: 3.5.2
    text: |-
      1 Een visser van een vissersvaartuig is in het bezit van een bekwaamheidsbewijs basisveiligheid voor vissers dat
      ten minste voldoet aan voorschrift 1, hoofdstuk III, van de bijlage bij het STCW F-verdrag en artikel 31, onderdeel
      b, van het C188-verdrag.

      2 Een visser als bedoeld in het eerste lid krijgt, alvorens hij zijn taak aan boord aanvangt, voldoende informatie
      en instructie ten einde:

      a. met de overige opvarenden over elementaire veiligheidszaken te kunnen spreken, begrip te hebben van de
      veiligheidssymbolen en de alarmseinen te kennen;

      b. voldoende bekend te zijn met de aanwezige uitrusting en de bediening ervan, met inbegrip van de te nemen
      veiligheidsmaatregelen voordat hij de uitrusting gebruikt;

      c. te weten wat te doen indien:

      1°. iemand over boord valt;

      2°. vuur of rook wordt ontdekt; of

      3°. het sein «brandalarm» of «schip verlaten» wordt gegeven;

      d. te weten waar de reddingsgordels zich bevinden en hoe deze om te doen;

      e. alarm te slaan en bekend te zijn met het gebruik van handbrandblussers;

      f. te weten wat te doen bij een ongeluk voordat hulp wordt ingeroepen;

      g. de brand- en waterdichte deuren, met uitzondering van die ter afsluiting van openingen in de romp, te kunnen
      sluiten en openen; en

      h. te kunnen vaststellen waar de verzamelplaatsen bij het sein «schip verlaten», de plaatsen van inscheping in de
      reddingmiddelen en de ontsnappingsroutes bij noodgevallen zich bevinden.

      3 Een bekwaamheidsbewijs als bedoeld in het eerste lid is geldig tot ten hoogste 5 jaar na de datum van afgifte.

      4 Een bekwaamheidsbewijs basisveiligheid voor vissers als bedoeld in het eerste lid wordt op verzoek vernieuwd
      indien de houder met tussenpozen van niet meer dan 5 jaar aantoont een passende herhalingstraining te hebben
      gevolgd.

      5 De geldigheidsduur, als bedoeld in het derde lid, is niet van toepassing tot en met 31 december 2029.
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel3.5.2
  - number: 3.5.3
    text: |-
      1 Een kapitein, stuurman, werktuigkundige, officier elektrotechniek, maritiem officier of andere zeevarende belast
      met het gebruik van reddingmiddelen en hulpverleningsboten, niet zijnde snelle hulpverleningsboten, is in het bezit
      van een bekwaamheidsbewijs reddingmiddelen dat ten minste voldoet aan voorschrift VI/2, eerste lid, van bijlage I
      bij [richtlijn (EU) 2022/993](32022L0993).

      2 Een kapitein, stuurman, werktuigkundige, officier elektrotechniek, maritiem officier of andere zeevarende
      belast met het gebruik van snelle hulpverleningsboten is in het bezit van een bekwaamheidsbewijs snelle
      hulpverleningsboten dat ten minste voldoet aan voorschrift VI/2, tweede lid, van bijlage I bij [richtlijn (EU)
      2022/993](32022L0993).

      3 Een bekwaamheidsbewijs als bedoeld in het eerste en tweede lid is geldig tot ten hoogste 5 jaar na de datum van
      afgifte.

      4 Een bekwaamheidsbewijs als bedoeld in het eerste en tweede lid wordt op verzoek vernieuwd indien de houder met
      tussenpozen van niet meer dan 5 jaar aantoont een passende herhalingstraining te hebben gevolgd.

      5 Het derde en vierde lid zijn niet van toepassing op vissers.
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel3.5.3
