  - number: 4.2.1
    text: |-
      1 Bij ministeriële regeling worden regels gesteld met betrekking tot:

      a. het onderzoek waaraan zeeschepen zijn onderworpen ter verkrijging en verlenging van een certificaat maritieme
      arbeid of tijdens de geldigheidsduur daarvan, alsmede de inhoud van die onderzoeken en de frequentie waarmee zij
      worden verricht;

      b. de registratie van de bij de inspectie verzamelde onderzoeksgegevens;

      c. de geldigheid van het certificaat maritieme arbeid en de verlenging van de geldigheidsduur daarvan;

      d. de voorwaarden voor afgifte van voorlopige certificaten maritieme arbeid;

      e. regels met betrekking tot de documenten waarmee kan worden aangetoond dat voldaan wordt aan het Aanhangsel A5-1
      van het MLC-verdrag.

      2 Bij ministeriële regeling worden regels gesteld met betrekking tot:

      a. de bij een aanvraag als bedoeld in het eerste lid te verstrekken gegevens en te overleggen bescheiden; en

      b. de modellen van het certificaat maritieme arbeid en het voorlopige certificaat maritieme arbeid.

      3 Het bepaalde bij of krachtens dit artikel is niet van toepassing op vissersvaartuigen.
    url: https://wetten.overheid.nl/BWBR0050941/2025-07-01#Artikel4.2.1
  - number: 4.2.2
    text: |-
      1 Een certificaat maritieme arbeid vervalt, indien:

      a. een deel van het zeeschip wordt verbouwd waarvoor de krachtens [artikel 4.2.1, eerste lid][ref1], gestelde
      voorschriften gelden, of in de inrichting of de uitrusting waarvoor de krachtens artikel 4.2.1, eerste lid,
      gestelde voorschriften gelden, ingrijpende wijzigingen worden aangebracht;

      b. het zeeschip een buitenlands zeeschip wordt;

      c. het tijdvak waarvoor het certificaat geldt, is verstreken;

      d. het tijdens de geldigheidsduur van het certificaat verplicht gestelde onderzoek niet of niet tijdig heeft
      plaatsgevonden, tenzij het gaat om een bij ministeriële regeling omschreven geval;

      e. het zeeschip van naam verandert of een ander letterteken of nummer krijgt, of

      f. het zeeschip niet langer wordt beheerd door de scheepsbeheerder vermeld op het certificaat maritieme arbeid.

      2 Onze Minister kan een certificaat intrekken, indien blijkt dat:

      a. de bouw, de inrichting of de uitrusting van het zeeschip waarvoor de krachtens
      [artikel 4.2.1, eerste lid][ref2], gestelde voorschriften gelden, in belangrijke mate afwijkt van de gegevens van
      het certificaat;

      b. het zeeschip of de scheepsbeheerder niet langer voldoet aan de voor het desbetreffende zeeschip afgegeven
      verklaring naleving maritieme arbeid en de vereiste corrigerende maatregelen niet zijn getroffen.

      3 Bij ministeriële regeling kan worden bepaald dat een certificaat maritieme arbeid in bij die regeling te bepalen
      gevallen ook vervalt, indien het zeeschip aan zijn oorspronkelijke bestemming wordt onttrokken.

      4 De scheepsbeheerder zendt een vervallen of ingetrokken certificaat, niet zijnde een geautomatiseerd bestand, zo
      spoedig mogelijk aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0050941#Artikel4.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0050941#Artikel4.2.1
